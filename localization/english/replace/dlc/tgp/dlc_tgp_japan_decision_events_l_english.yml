l_english:

 # GH: The Granmaer Throne reclaims direct rule from the Kanzelerij's cliques.
 # Vanilla text framed this as an eastern imperial restoration; retheming for Konijkmener lore.
 tgp_japan_decision.9301.desc: "I have reclaimed my rightful place as the true leader of this realm.\n\nMy power is no longer wielded by the cliques who wish to fuel their own ambitions, and all is restored to the Granmaer Throne."
 tgp_japan_decision.9301.a: "Let the Throne guide the land once more."

 tgp_japan_decision.9302.desc: "Words spread like wildfire of the monarch's return. [tenno.GetName] has restored [tenno.GetHerHis] rightful presence, in the name of revoking power from idle and ill-willed hands."
