l_english: 
 game_concept_canonized_desc: "A [character|E] who has, after death, been declared a saint or another faith's equivalent, such as a waysaint or a venerated ancestor, gaining the [GetTrait('saint').GetName( GetNullCharacter )] [trait|E].\n\nA virtuous life may end in $game_concept_canonization$: it is petitioned through a [decision|E], may require the blessing of the [head_of_faith|E], and is sealed by consecrating the saint's burial site. Their resting place thereafter draws pious travelers, and their remains may yield [holy_relics|E]."