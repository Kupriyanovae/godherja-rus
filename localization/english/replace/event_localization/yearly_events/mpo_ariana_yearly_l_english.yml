l_english:
 mpo_events_ariana.0030.desc: ""The bowls of [ROOT.Char.Custom('GetCulturalKumisVariant')] at our gathering have run quite dry, my [ROOT.Char.GetTitleAsNameNoTooltip]..." [spymaster.GetName] complains. "But at least I know the one responsible for this drought." [spymaster.GetSheHe|U] points to [bartender.GetName], who is seen bartering a cup of the fermented mare's milk to another lowborn.\n\n"Surely you won't let our guests be deprived of their drink, will you? After all, they were specially prepared for the great lords and ladies of [ROOT.Char.GetPrimaryTitle.GetNameNoTier]." [spymaster.GetSheHe] asks, a sly grin on [spymaster.GetHerHis] face."
 mpo_events_ariana.0040.desc_wedding_feast: "The hall is dimly lit, the air filled with laughter and the smell of [ROOT.Char.Custom('GetExpensiveMeal')]. The next part of the celebration involves guests and hosts alike to conceal themselves like the Ölteni do, with the premise of mystery and excitement. I carefully slip on a mask, being sure to obscure myself, and join the other guests in dance and merriment. As the festivities continue, I find myself drawn to a mysterious figure in the cards. [masked_guest.GetSheHe|U] is clad in an intricate mask depicting a [ROOT.Char.Custom('GetRandomRegionalBird')]. [masked_guest.GetSheHe|U] beckons me over, and I find myself unable to resist the pull.\n\nSoon enough, our conversation becomes more sensual, and I cannot help but feel a connection that goes beyond the mask. [masked_guest.GetSheHe|U] pulls me into a warm embrace, and hints for our move into a more private area."
 mpo_events_ariana.0090.desc: "After having spent some time in the pastures with shepherds, [child.GetFirstName] returns to the [SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')] with a smile on [child.GetHerHis] face.\n\n"
 mpo_events_ariana.0090.desc_younger: ""I wish to be a shepherd, [child.Custom2('RelationToMeShort', ROOT.Char)]!" [child.GetSheHe] exclaims. "They get to spend all day with the sheep, and look how happy they are. Being a [ROOT.Char.GetTitleAsNameNoTooltip] sounds boring!"\n\n[child.GetSheHe|U] hands me a freshly-sheared bundle of wool and, although it is rough and dirty, I can see the pride in [child.GetHerHis] eyes."
 mpo_events_ariana.0090.desc_older: ""I want to be the one who herds the sheep, rather than a [ROOT.Char.GetTitleAsNameNoTooltip] like you, [child.Custom2('RelationToMeShort', ROOT.Char)]," [child.GetSheHe] exclaims. "Their life seems so simple, without the worries of battle and rule."\n\n[child.GetSheHe|U] hands me a freshly-sheared bundle of wool and, although it is rough and dirty, I can sense the passion is [child.GetHerHis] words."
 mpo_events_ariana.0110.desc_ending: "I suggest moving your [SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')] to [new_capital.GetNameNoTier], and you might find prosperity there.""
 mpo_home_sweet_home_modifier: "[SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')] Sweet [SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')]"
 mpo_home_sweet_home_modifier_desc: "This character has grown quite attached to their [SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')] and its location."
