l_english:
 building_cereal_fields_01_desc:1 "Crop fields, the backbone of any aristocrat's economy, each manned by a small but generous family of commoners – all but willing to surrender most of what they produce in tithe to their ruler!"
 building_tribe_02_desc:1 "The fortified hold takes its inspiration from more 'civilized' castles, adding many new defensive elements."
 
 
 building_type_scriptorium_01: "House of Learning"
 building_type_scriptorium_01_desc: "Houses of Learning offer a place for the educated and the curious to commit their knowledge to writing, preserving wisdom for generations to come."
 building_scriptorium_01: "Libraries"
 building_scriptorium_01_desc: "The library is filled with books, ranging from small treatises to vast volumes on philosophy, history, and the natural world. A great wealth of knowledge is preserved here."
 building_scriptorium_02: "Copying Chambers"
 building_scriptorium_02_desc: "Scribes labor day and night in the copying chambers, reproducing manuscripts so that knowledge may spread and endure."
 building_scriptorium_03: "Translation House"
 building_scriptorium_03_desc: "Scholars gather here to translate works written in ancient or foreign tongues into the local scholarly language, making distant knowledge accessible."
 building_scriptorium_04: "House of Scribes"
 building_scriptorium_04_desc: "Many scribes reside here, allowing scholars and authors to dictate their works and have them carefully recorded."
 building_scriptorium_05: "Cataloguing System"
 building_scriptorium_05_desc: "Works are carefully organized according to their place of origin and subject, greatly improving a scholar’s ability to find what they seek."
 building_scriptorium_06: "Great Archives"
 building_scriptorium_06_desc: "Works from many lands are collected, translated, and preserved here so that their knowledge will not be lost."
 building_scriptorium_07: "School of Languages"
 building_scriptorium_07_desc: "Students are educated in ancient and foreign languages, improving the ability of scholars to study and preserve rare texts."
 building_scriptorium_08: "Hidden Archives"
 building_scriptorium_08_desc: "Vast underground archives protect rare and valuable works, including many recovered from distant lands."

