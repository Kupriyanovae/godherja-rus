l_english:
 tradition_mountaineer_ruralism_name: "Cliffside Ruralism"
 tradition_mountaineer_ruralism_desc: "The descendents of the first Malcoisiac colonists to settle the rocky cliffs where the Eramasic crosses from Katraddia into Malcois, this culture knows how to handle both the rocky cliffs and the river canyons with ease."

 tradition_female_only_inheritance_requirements: "You must have a [GetFaithDoctrine('doctrine_gender_female_dominated').GetBaseName] [faith|E] or the #V $heritage_agadari_name$#!, #V $heritage_sarminian_name$#!, #V $heritage_lonely_lighter_name$#!, or #V $heritage_canian_name$#! [heritage|E], and no existing matriarchal [culture_tradition|E]"
 tradition_hereditary_hierarchy_desc:0 "It is ingrained in this culture that leadership in passed on by blood, nobility is bound by stone in castles, and that the control of the aristocrats is unshakable. They do not easily forget those who break the laws of nobility."
 tradition_desert_nomads_name:1 "Sarradonian Desert Nomads"
 tradition_desert_nomads_desc:0 "This culture is intimately accustomed with the Sarradonian desert, which it has traversed for centuries, connecting the Imperial Sea with the realms of central and southern Sarradon."
 culture_in_camel_region_desc:0 "The [culture|E] is not present in [GetGeographicalRegion('world_es_desert').GetName]"
 culture_in_camel_region_percentage_desc:0 "The [culture|E] does not have #V [EmptyScope.ScriptValue('camel_percentage_trigger_value_desc')|0]%#! of its [counties|E] in [GetGeographicalRegion('world_es_desert').GetName]"
 tradition_pollaers_name:0 "Pollaers"
 tradition_pollaers_desc:0 "This culture has a long tradition of reclaiming land from the surrounding sea. This allows them to utilize what would normally be a shallow seabed for farming and construction."
 culture_in_non_sedentary_geographical_region_trigger_desc:0 "The [culture|E] is not present in the [GetGeographicalRegion('GH_REPLACE_world_steppe').GetName]"
 culture_in_india_region_trigger_desc:0 "The [culture|E] is not present in [GetGeographicalRegion('GH_REPLACE_world_india').GetName]"
 culture_in_roman_empire_desc:0 ""
 culture_in_plains_or_steppe_terrain_desc:0 "The [culture|E] does not have #V 40%#! of its [counties|E] in Plains [terrain|E], Steppe [terrain|E], or the [GetGeographicalRegion('GH_REPLACE_world_steppe').GetName] [region|E]"
 culture_in_plains_or_steppe_terrain_percentage_desc:0 "The [culture|E] does not have #V 60%#! of its [counties|E] in Plains [terrain|E], Steppe [terrain|E], or the [GetGeographicalRegion('GH_REPLACE_world_steppe').GetName] [region|E]"
 culture_in_steppe_desc:1 "At least #V 40%#! of the [counties|E] of this [culture|E] must be in the [GetGeographicalRegion('GH_REPLACE_world_steppe').GetName] [region|E]"
 sahara_percentage_desc:0 "The [culture|E] does not have #V 30%#! of its [counties|E] in [GetGeographicalRegion('GH_REPLACE_world_africa_sahara').GetName]"
 three_witch_rulers_desc:0 "The [culture|E] does not have #V 3#! or more [magi|E] [rulers|E]"
 steppe_heritage_reduction_desc:0 "The [culture|E] does not have a Steppe [heritage|E]"
 culture_in_himalaya_desc:0 ""
 culture_parameter_unlock_garuda_warrior_title:0 "Can appoint [knights|E] to the Dhā'geray Warrior [court_position|E], increasing their [prowess|E] as well as the likeliness that they will die in battle" #GH ADDITION: Adapted this for the Parakh

 # GH: retheme the vanilla Barangay tradition onto the Rovarska and strip the real-world reference.
 tradition_tgp_barangay_confederations_name: "Rovarska Confederations"
 tradition_tgp_barangay_confederations_desc: "The rulers of this culture lead many disparate city-states littered along river estuaries and the coast. Such states vary greatly in size, but tend to unite in confederations, led by a paramount chief chosen from amongst the member chieftains."
 DATU_GLOSS: "A title borne by the chiefs of the many petty polities scattered across the Rovarska."
