l_english:

 warhorse.0003.altun_mori:0 "Altun Mori — a golden-maned steed of steppe legend!"
 warhorse.0003.kulbarys:0 "Kulbarys — a winged beast said to cross the plains without rest!"
 warhorse.0003.joragaltai:0 "Joragaltai — remembered in old songs of loss and mourning."

 warhorse.0003.raucel:0 "Raucel — the mount said to have carried the Good King over the Black Mountains!"
 warhorse.0003.syagrin:0 "Syagrin — a stubborn beast recorded in Waymeet rolls, loyal only to Waymother!"
 warhorse.0003.valcroix:0 "Valcroix — should be its name."

 warhorse.0003.ashkavar:0 "Ashkavar — the unruly steed of the Prophet Hinamat!"
 warhorse.0003.hrafnvindr:0 "Hrafnvindr — Said to stride beside warriors at their end!"

 warhorse.0003.paerashva:0 "Paerashva — a first-born horse shaped in the earliest days of creation!"
 warhorse.0003.sarvaketu:0 "Sarvaketu — a thinking steed from Avastya Mahan folktales!"

 warhorse.0003.barq_samt:0 "Barq Samt — named in the great writings of Uliyanm!"
 warhorse.0003.rahzat_al_qamar:0 "Rahzat al-Qamar — should be its name."

 warhorse.0003.sirr_al_haras:0 "Sirr al-Haras — the mount of a the First Warden!"
 warhorse.0003.mizan_al_samt:0 "Mizan al-Samt — should be its name."
 warhorse.0003.thyrax:0 "Thyrax — a name from ancient tales, fitting a horse of strength."
 warhorse.0003.oreades:0 "Oreades — after the spirits of the mountains!"
 
