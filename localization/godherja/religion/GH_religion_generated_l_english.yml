 conclavian_rite_faith_desc: "Amongst the Islanders of the Shattered Coast, ancient customs of dead empires have long thrived, syncretised to new gods and monarchs. To many, the Holy Kingdom of Velos would be but a continuation of this long tradition, and tie their local beliefs on to a new authority."
