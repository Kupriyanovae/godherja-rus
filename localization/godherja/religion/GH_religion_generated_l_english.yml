 # The Black Fraternity Rite #
 black_fraternity_rite: "The Black Fraternity"
 black_fraternity_desc_with_gc: "'The blood of the weak will sow the land of pure souls.'\n\nSuch is the mantra of the Black Practitioners. Composed of the vilest [Concept('aversaria','Aversarian')|E] [magi|E], the Black Practitioners, part of the Black Fraternity, dedicate themselves to one goal only: the casting of the Kusnamenoi, the spell to warp the world and create for themselves a new paradise above it all.\n\nHaving aroused moral distaste even amongst fellow Aversarians, the Black Practitioners are forced to lay low, their influence mostly concentrated in isolated villages and settlements where they have consolidated their power following the Aversarian collapse. In these villages, no Gods are known but the Magi; these conditions have given way to an acquisitive system of worship focusing on whichever Magus arises as the strongest."
