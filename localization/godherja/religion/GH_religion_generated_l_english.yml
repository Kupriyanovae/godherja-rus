 cnevobarthane_religion_adherent: "Speaker"
 cnevobarthane_religion_adherent_plural: "Speakers"
 cnevobarthane_religion_desc: "The native beliefs of the insular Theugombrian peoples tend towards monotheism, with a solar diety being seen as the central figure. While reincarnation is sometimes a factor, it is usually limited to beings of great or godlike power, with the faithful relegated to eternal rest in either the "Bright Halls" of Cutu Remzna, or to eternally wander [aeras|E] in a cursed invisible and ethereal form known as the Naxaz. These faiths see few converts from outside their culture, with the faith usually passed from mother to son. That being said, conversion from without is not technically impossible."
