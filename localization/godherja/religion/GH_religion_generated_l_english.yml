 ## Ixsian Mysteries Faith ##
 ixsian_mysteries_faith: "Ixsian Mysteries"
 ixsian_mysteries_faith_desc: "Ixs — once center of the Sub-Governorate of the Southern Imperial Isles under the fallen [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] — would retain control of the region thanks to its prior legal claims and its relative stability and prosperity in the collapsing Imperial order. This control would only be briefly interrupted by the discovery of the Seven Seals of Sordornax'morovir and the associated Black Scroll, the studying of which would quickly drive the scholars of Ixs mad in a memetic curse that consumed the city's leadership.\n\nDespite the babbling madness of Ixs's administrators and their newfound obsession with studying of the infinite scroll and the breaking of the Seals (and the spreading of their madness to any able to read the forbidden language enscribed on them), the Ixsians have managed to uphold good governance and order in their territories, and many isles have voluntarily pledged allegiance to the city despite the occasional bout of inhuman screeching and intonations during diplomatic meetings."
 ixsian_mysteries_faith_adj: "Ixsian Mysterian"
 ixsian_mysteries_faith_adherent: "Mysterian"
 ixsian_mysteries_faith_adherent_plural: "Mysterians"
 
