 # The Favored Rite #
 favoured_ones_rite: "The Favored"
 favoured_ones_desc_with_gc: "Across the villages of the far west [Concept('shatteredisles','Isles')|E], when the stars and moon align, an almost eerie silence befalls the isles of those who believe themselves Favored. Homes fall silent, ships left to the waves, as communities gather in various stone circles vast and ancient. Each stone is uniquely marked, be it a painting, a symbol, even old words once spoken in wisdom.\n\nIn this circle of legends followers remember those of the past, each heroes and legends in their time. Tales of strength, wisdom and glory are spoken, prayers whispered and stories passed onto future descendants. Each hero is remembered, a ritual to receive their blessing for the years to come. The most ancient and celebrated heroes are ancient ancestors once endowed with Favour by their God, freed from long forgotten masters and blessed with new lands to settle.\n\nBelievers hold that their Favour was a divine gift not so easily lost to time. As long as they are not forgotten, their Favour may be found once more, the hope for a new hero for the ages to venerate and remember."
