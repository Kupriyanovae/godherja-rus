 ## Orispolj Rite Faith ##
 orispolj_rite_faith: "Orispolj Rite"
 orispolj_rite_faith_desc: "The Orispolj Rite is the codification and reformation of the many disparate faiths of the Sjalvolki faithful. [SelectLocalization(Faith.MakeScope.Var('great_reformer').IsSet,Concatenate('Founded by the radical shaman ',Faith.MakeScope.Var('great_reformer').Char.GetFullNameNicknamed),'Founded by a radical shaman')], the preacher called for the need for a codified book of faith, along with a strict hierarchy of priests and shamans to lead the faithful. Often considered inspired by the religions of the Marchers and structural aspects of the defeated faiths of the [Concept('aversaria','Aversarians')|E], the Orispolj Rite is a merging of a dozen different disparate Sjalvolki faiths with the hierarchal structure one would expect of a modern and entrenched religious movement.\n\nDespite the structural organization, its founder actively argued against the need for a central organization to manage the faith and instead demanded an 'Anarchy of Belief', in which each adherent would form their own specific path towards salvation in the final war."
 orispolj_rite_faith_adj: "Orispolj Rite"
 orispolj_rite_faith_adherent: "Orispolji"
 orispolj_rite_faith_adherent_plural: "Orispoljis"
 
 # Orispolj Rite Rite #
 orispolj_rite_rite: "Orispolj Rite"
