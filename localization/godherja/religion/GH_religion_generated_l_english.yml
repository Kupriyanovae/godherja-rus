 ## Cult of the Bitter Wave Faith ##
 cult_of_the_bitter_wave: "Cult of the Bitter Wave"
 cult_of_the_bitter_wave_desc: "'The one who lies in wait, the lingerer, the serene, the forebearer, the resolute, the one who awaits the coming of Ch'ngluiyarog, the sundering and rebirth of this wretched world. Praise be to Tagognth, God of the Bitter Wave!'\n\nThe cultists of the Bitter Wave are without exception regarded as an eerie people possessing utterly outlandish beliefs by their fellows. Given to the worship of the mysterious god Tagognth, whose true name is privy to none save only the most highly ranking of their priestly strata, the Cultists of the Bitter Wave practice a set of exceptionally unsettling rituals they believe are required to commune with the strange god of the sea. The blood of man is a common component, though other strange materials such as unusual skulls that resemble a sister group of humanity are also used from time to time. How or where they obtain such skulls and other strange curiosities is unknown. Priests and laymen both don helmets and armor of a make similar to no other culture on [aeras|E], confounding scholars who question the purpose of such attire. Adding to the mystifying nature of this cult are the frequent but oft dismissed reports by fishermen of the [Concept('shatteredisles','Isles')|E] that an immense being lurks beneath the sea, countless colorless eyes all pointed towards the surface. Watching... and waiting."
 cult_of_the_bitter_wave_adj: "Bitter Wave Cultist"
 cult_of_the_bitter_wave_adherent: "Cultist of the Bitter Wave"
 cult_of_the_bitter_wave_adherent_plural: "Cultists of the Bitter Wave"
 
