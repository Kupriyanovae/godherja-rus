 ## Ramazayi'a Faith ##
 ramazayi_faith: "Ramazayi'a"
 ramazayi_faith_desc: "Ramazayi, which means “the clues,” is a branch of Wardenism that originated among the Kirinarth of [Glossary('Kratemezin','crater_encyclopedia_desc')], who believe that He Who Has provides clues on how to keep the Dead God imprisoned. These clues are provided daily through a chanted numerology of the Kirinarth numbers, going so far as to search the numbers of agricultural production for clues regarding the number of virtues that constitute the pillars or even that no virtue lies behind these numbers and that they are, in and of themselves, the key to the Dead God’s prison, or that the true name of He Who Has can be found through algebra."
 ramazayi_faith_adj: "Ramazayi"
 ramazayi_faith_adherent: "Ramazâyite"
 ramazayi_faith_adherent_plural: "Ramazâyites"
 
 # Ramazayi'a Rite #
 ramazayi_rite: "Ramazayi'a"
 ramazayi_desc_with_gc: "The Ramazayi emerged in the 7th century IS, spearheaded by the jurist-musician Buwata Afdal of Sinasan, who claimed to have discovered the number of distinct phonemes that humans must use to pronounce the name of He Who Has (which is Two Thousand Three Hundred And Fourteen). His legal school, the Ishimimiyah, quickly became divided over how these sounds should be pronounced, since while the number of phonemes is known, their nature remains unknown, and, even more problematic, there is no indication that the human mouth is the proper instrument for producing them."
