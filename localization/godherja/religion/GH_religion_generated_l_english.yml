 ## Nitsafai Faith ##
 nitsafai_faith: "Nitsafai"
 nitsafai_faith_desc: "The Nitsafai believe that the mainstream Mogowai have lost their way, due largely to the meddling of secular leaders in religious affairs. They push for a literal interpretation of the Hymns of Heaven, and pursue a refocusing of the faith before the search can resume, fearing that corruption will prevent His body from ever being discovered. This dedication causes them to uphold their orthodoxy above all else, and any deviation from their truth is harshly punished."
