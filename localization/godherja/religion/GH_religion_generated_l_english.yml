 # Asdraqi'a Rite #
 asdraqi_rite: "Asdraqi'a"
 asdraqi_desc_with_gc: "The Asdraqi'un hold all who reject the teachings of the [Concept('the_first_warden','First Warden')|E] are actively plotting to free the Dead God, and that the heathen attacks upon the faith are but the first step in their plans of devastation. As a result, it is the primary duty of all [Concept('wardenism','Wardenites')|E] to actively assail these rival faiths, for only their complete eradication will save the world from their schemes and lies. They believe that the War Laws are still in effect, and that the struggle against the infidels can accept no limitations. They reject the Central [mamuramat|E] as weak and unsuited to lead the faith, instead advocating the return of the Western, Eastern, and even Far Eastern Mamuramats, in addition to the creation of entirely new ones. For the Asdraqi'un, all must serve the war."
