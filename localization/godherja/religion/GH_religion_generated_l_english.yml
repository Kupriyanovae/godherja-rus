 ## Marefai Faith ##
 marefai_faith: "Marefai"
 marefai_faith_desc: "While other denominations believe in centralized efforts to seek out His body, the Marefai decry central religious authority entirely, believing that mere mortals are unworthy to dictate the orders of the Most High. They encourage everyone to live their lives in accordance with their own interpretations of the Hymns, and see those who would attempt to lead the faith as usurpers. Despite their variety of beliefs, the quest for His tomb remains paramount, along with most other core tenets."
