 # Korlenalmic Rite #
 korlenalmic_rite: "Korlenalmic"
 korlenalmic_desc_with_gc: "A newer sect of the Korlonalmic heresy, the Korlenalmic or Fiery Path was founded by a group of Nattanan dissidents that discovered records of the [fire_path|E]. Facing persecution, the new sect then fled to the east, where they encountered stewards of the Thuantyan Sraidyan, Kathuni who believed in the sanctity of creating lasting works. The Korlenalmics eventually adopted much of this worldview and held that by innovating and creating great works, they would be raised up to serve directly under Korlacu, who would then lead them to create a better world for all."
