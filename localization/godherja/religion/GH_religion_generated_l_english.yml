 # Monokerixi Rite #
 saintly_order_rite: "Monokerixi"
 saintly_order_desc_with_gc: "The Monokerixi, while rejecting the divinity of aautokratirs and holding the Saints to be the only incarnation of the Purest, have still been heavily influenced by traditional [Concept('aversaria','Aversarian')|E] cultural beliefs. They hold that it was no accident that the Saints chose to manifest in Aversaria, but rather due to the Aversarians' advanced culture increasing their ability to follow the Saints' messages and achieve purity. As such, it is the duty of pious Agionists to spread both Agionist teachings and Aversarian knowledge to the lesser peoples of the world, so that all may benefit from the teachings of the Saints."
