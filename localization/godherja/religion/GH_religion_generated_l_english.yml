 ## Tegonianism Faith ##
 tegonian: "Tegonianism"
 tegonian_desc: "Tegionianism is the ancient beliefs of the Seychescian people of what is now Pergicos. Tegonians believe that seers, mainly Tarka and Vagas, revealed the belief to the Seychescian people after discovering the presence of the gods presence in six visions. Within the dream They declared They were disappointed that their children had forgotten how to worship them, and demanded the fealty of the Seychescians lest the world itself be destroyed by a great cloud of poison.\n\nTegionian rites dictate that nearly no action can be done without first consulting the gods for an answer. Even things as trivial as what to wear or what side of the street to walk on must be decided by the gods."
 tegonian_adj: "Tegonianist"
 tegonian_adherent: "Tegonist"
 tegonian_adherent_plural: "Tegonists"
 
