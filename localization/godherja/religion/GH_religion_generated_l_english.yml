 ## Albot-al-Mamurism Faith ##
 albot_al_mamurism_faith: "Albot-al-Mamurism"
 albot_al_mamurism_faith_desc: "Centuries of trade and communication have converted many within the Sarradonian Desert to the Wardenite tradition with varying degrees of success. Although nomadic tribunals are often styled as courts, their decisions are largely based on the discretion of village elders rather than judicial experts. The rarity of legal texts within many of these communities, has led to a corrosion of authority, the Mamur merely a figure to swear nominal allegiance, their name, personality and status largely unknown and uncared for. The failure to eradicate local superstition has led to a number of strange and antiquated holdovers, such as the trial of Talfasomoll, or Tirga Tissit, leading many in the Wardenite core to name these priests 'Albot-al-Mamurs,' or 'Spider Mamurs.'"
 albot_al_mamurism_faith_adj: "Albot-al-Mamurism"
 albot_al_mamurism_faith_adherent: "Spider Wardenite"
 albot_al_mamurism_faith_adherent_plural: "Spider Wardenites"
 
