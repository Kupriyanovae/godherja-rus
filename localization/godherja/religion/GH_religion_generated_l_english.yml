 ## Post-Imperial Deviationism Faith ##
 post_imperial_deviationists_faith: "Post-Imperial Deviationism"
 post_imperial_deviationists_faith_desc: "As the Empire burned to ashes and migrant barbarians overran Oraispol, the Imperial Cult effectively ended, and with it the enforcement of laws both secular and religious. While in some places the local priesthoods of the various cults of the Aagiokrata would attempt to wrangle control over the rapidly splintering faith, very often the reins of religious enforcement were taken by local warlords. Primarily through the process of [deviationism|E], warlords across the former Empire would fill the gaps left in the dead Empire's legal systems by simply declaring themselves Aautokratir and establishing their own regional 'deviation' of Imperial Law. The disintegration of legal unity would lead to a rapid collapse within the Aagiokratan priesthood that would eventually give way to the many [Glossary('Old Imperial','GH_OLD_EMPIRE_GLOSS')] cults of the early 14th century IS."
 post_imperial_deviationists_faith_adj: "Post-Imperial Deviationist"
 post_imperial_deviationists_faith_adherent: "Deviationist"
 post_imperial_deviationists_faith_adherent_plural: "Deviationists"
 
