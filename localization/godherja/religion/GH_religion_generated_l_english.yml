 khebaranism_rite_adherent_plural: "Khebarāni"
 # Mezra'ī Rite #
 mezrai_rite: "Mezra'ī"
 mezrai_desc_with_gc: "Originating in Lirkak in North Levan, the Mezra'īsi trace their teachings to Sarvān i-Khizrad, a man who, they claim, received a secret revelation from the $amsari_prophet_link$ Prophet#! while passing through the region. The Prophet is said to have entrusted him with truths too complex for the simple minds of commoners, teachings meant only for those chosen to fully understand Zaoran's deeper wisdom. Rejecting the idea of writing down their secretive knowledge, the Mezra'īsi passed them orally through strict initiatory rites."
