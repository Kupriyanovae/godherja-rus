 # Ruidari'a Rite #
 ruidari_rite: "Ruidari'a"
 ruidari_desc_with_gc: "The Ruidari'un uphold the 'Pillar of Inclusion,' the idea that if one commits a good deed, it doesn't matter if the deed is done in the name of a false god, it still upholds the Pillars of Virtue that keep the Dead God imprisoned. Ruidari societies feature a big influence of the mystical orders and tusuffna organized around them. Very often, these are open to non-believers, and their spiritual masters attempt to work to guide them to Pillars of Virtue rather than attempt superficial conversions."
