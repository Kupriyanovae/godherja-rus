 # Oirigan Rite #
 oirigan_rite: "Oirigan"
 oirigan_desc_with_gc: "Oirigan is the religion of the southern [mayikrata|E] creole culture of the Samojitians. Descended from slaves who served in the [mayikrata|E]'s halls and towers at the behest of the [magi|E], the slaves spent years slowly gathering stolen [Concept('magic','Magical')|E] lore and learning the power of Magic for themselves. When Cenware of the Sjalvolki invaded the Mayikrata and shattered the Magi's power, they rose up with the Magi's own gifts to destroy them. The Oirigians worship a flurry of gods inspired by their stolen tomes, and see Magic as a tool needed to secure the freedom of their people."
