 ## Bēshanidism Faith ##
 beshanida_faith: "Bēshanidism"
 beshanida_faith_desc: "Considered a reformist current within Post-Prophet early Zaoranianism, the Bēshanidi are today mainly remembered for their absolute rejection of any sort of apotheosis of the prophetic lineage, in contrast to the growing cult-like movement tolerated, if not encouraged, by the first daughter of Qanamsar Aushedar, Mehreva. The name Bēshanida derives from the enigmatic figure known as the [gh_last_witness_conflict|E], though little is agreed upon regarding this figure's origin, intentions, or disappearance.\n\nThe movement is believed to have influenced certain liturgical simplifications and certainly played a role in the iconoclastic decrees issued under Qanamsara Sha'Nira who, after the figure's disappearance, positioned herself as the central authority within the movement. The sect gradually lost coherence and withered soon after."
 beshanida_faith_adj: "Bēshanida"
 beshanida_faith_adherent: "Zaoranian"
 beshanida_faith_adherent_plural: "Zaoranians"
 
