 # Tarriaq al-Thubēt Rite #
 tarriaq_al_thubet_rite: "Tarriaq al-Thubēt"
 tarriaq_al_thubet_desc_with_gc: "The Thubēthiyyīn hold that all of [aeras|E] is an illusion, ever shifting and ever changing, and that [GetBuilding('01_sophocos').GetName] alone is real. It is the immutable force that anchors the world, and to climb its Thousand-and-One Steps is to step out of the illusion and onto the only solid ground there is."
 tarriaq_al_thubet_rite_desc: "The Thubēthiyyīn hold that all of Aeras is an illusion, ever shifting and ever changing, and that Sophocos alone is real. It is the immutable force that anchors the world, and to climb its Thousand-and-One Steps is to step out of the illusion and onto the only solid ground there is."
