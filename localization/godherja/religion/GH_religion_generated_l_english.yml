 # Xwestrozên Rite #
 xwestrozen_rite: "Xwestrozên"
 xwestrozen_desc_with_gc: "The Xwestrozên arose with $crater_queen_naza_link$ Naza the Great#! after she received a revelation about the true nature of [GetBuilding('01_sophocos').GetName]. The Xwestrozên claim that Sophocos is not, in fact, a real place, but rather a song with one thousand and one notes, each note rising upward in pitch. Supposedly, mastery of this song will grant one enlightenment and great magical skill, with the Xwestrozên believing that [magi|E] draw their power from knowledge of some notes of the song. However, all music is considered holy to the Xwestrozên, not just the Song of Sophocos, and musicians are widely regarded as pious individuals."
