 ## Imperii Faith ##
 imperii: "Imperii"
 imperii_desc: "Imperii refers to the disparate pagan beliefs of the ancient Etepezeans, possibly even the ancient ancestor tribe of the Etapexe. Primarily based around the worship of various ruins and the attempt to restore ancient temples, the Imperii'a believe that structures can become home to spirits both spontaneously and from generations of their inhabitants. The pantheon of the Imperii is vast, but all agree on the existence of the Red Lord — the ruler of all spirits and the builder of all of the great ruins of the world, most commonly agreed to have once inhabited the Sea Tower."
 imperii_adj: "Imperii'a"
 imperii_adherent: "Imperii'ayn"
 imperii_adherent_plural: "Imperii'ayni"
 
