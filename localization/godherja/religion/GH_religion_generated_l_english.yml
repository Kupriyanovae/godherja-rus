### Kakarataki Religion ###
 kakarataki_religion: "Kakarataki"
 kakarataki_religion_adj: "Kakarataki"
 kakarataki_religion_adherent: "Kakarataki"
 kakarataki_religion_adherent_plural: "Kakarataki"
 kakarataki_religion_desc: "To the Kakarataki, originally an agrarian people, the Sun is the bringer of all things good. They consider it to be the avatar of the god Koru, creator of mankind. However, they consider the Moon, creator of all creatures of the night, to be the Sun's sworn enemy. The two are locked into a dualistic battle for control over the cosmos, and beneath, their creations fight for control of the world."
