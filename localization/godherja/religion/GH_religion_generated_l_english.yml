 ## Aqshar' al-Miyālaf wa l-Qasāhir Faith ##
 ritualist_physicalist_faith: "Aqshar' al-Miyālaf wa l-Qasāhir"
 ritualist_physicalist_faith_desc: "Perhaps the oldest of the physicalist branches of [Concept('ritualism','Ritualism')|E], the Aqshar' al-Miyālaf wa l-Qasāhir, meaning 'Ritualism of the Thousand and One Rituals', believe that the 1,001 rituals mirror the Thousand-and-One Steps of Sophocos, though considerable differences exist among them regarding which rituals are considered legitimate and how they should be performed. Their recognition of a multitude of gods and angels, alongside this diversity of practices, may help explain the branch's longevity and its ability to adapt to changing times."
 ritualist_physicalist_faith_adj: "Miyālafī"
 ritualist_physicalist_faith_adherent: "Miyālafī"
 ritualist_physicalist_faith_adherent_plural: "Miyālafiyyīn"
 
 # Sophocist Rite #
 sophocist_rite: "Sophocist"
 sophocist_desc_with_gc: "The Sophocists emphasize the memorization and performance of symbolic divine rituals, which they insist are the true Thousand-and-One Steps of [GetBuilding('01_sophocos').GetName]. The [Concept('the_towers','Tower')|E] where the physical Steps lie is merely where the lessons were passed down, and the rituals were meant to be performed anywhere. Through accurate performance of all 1,001 rituals, will a person be able to understand the secrets of the gods and attain enlightenment."
 sophocist_rite_desc: "The Sophocists emphasize the memorization and performance of symbolic divine rituals, which they insist are the true Thousand-and-One Steps of Sophocos. The Tower where the physical Steps lie is merely where the lessons were passed down, and the rituals were meant to be performed anywhere. Through accurate performance of all 1,001 rituals, will a person be able to understand the secrets of the gods and attain enlightenment."
 sophocist_rite_adj: "Sophocist"
 sophocist_rite_adherent: "Sophocist"
 sophocist_rite_adherent_plural: "Sophocists"
 # Iramite Rite #
 iramite_rite: "Iramite"
 iramite_rite_desc: "Iram, the City of the Pillars.\nShe will rise from the sands like dawn, but only for those whose minds are open and hearts are worthy.\nShe will be black as pitch, and engraved with gold, full of jewels that glitter like a thousand stars.\nThe Seven-Headed Serpent will watch you longingly within the city, where you will be safe.\nDo not seek Iram, faithful one, until Iram has sought for you."
