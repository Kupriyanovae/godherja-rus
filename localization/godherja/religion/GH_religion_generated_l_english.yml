 # Iyrossi Aagiokrata Rite #
 iyrossi_aagiokrata_rite: "Iyrossi Aagiokrata"
 iyrossi_aagiokrata_desc_with_gc: "The result of centuries of [Concept('aversaria','Aversarian')|E] laws over Iyrossi worship, the 'Iyrossi Aagiokrata' is the remains of dozens of ancient Iyrossi faiths mixed through forced relocation and the claimed 'reincarnation' of their gods in Aversarian (normally Malcoisiac) figures. While the Iyrossi still hold to some of their old faith through the Timespeakers, even gods are only remembered in Aversarian."
 iyrossi_aagiokrata_rite_desc: "The result of centuries of Aversarian laws over Iyrossi worship, the 'Iyrossi Aagiokrata' is the remains of dozens of ancient Iyrossi faiths mixed through forced relocation and the claimed 'reincarnation' of their gods in Aversarian (normally Malcoisiac) figures. While the Iyrossi still hold to some of their old faith through the Timespeakers, even gods are only remembered in Aversarian."
