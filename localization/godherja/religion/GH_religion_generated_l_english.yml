 ## Arayvtar Faith ##
 arayvtar_faith: "Arayvtar"
 arayvtar_faith_desc: "Arising from ancient interactions with the Wardenites, the Arayvtar hold that the Warden and several prominent Mamurs in the Wardenite religion were, in fact, [Concept('malaak','Malaaks')|E] carrying out the will of Ohrasik. As such, the Arayvtar have adopted some of the teachings of the Warden, claiming that the moon is the prison that contains the dead god, and that the correct traditions and laws must be observed to keep it trapped there."
 arayvtar_faith_adj: "Arayvtarism"
 arayvtar_faith_adherent: "Arayvtarist"
 arayvtar_faith_adherent_plural: "Arayvtarists"
 
