 # Militant Cliques Rite #
 militant_cliques_rite: "Militant Cliques"
 militant_cliques_desc_with_gc: "The Militant Cliques are an [Concept('aversaria','Aversarian')|E] cult originating from within its Legions based primarily around the worship of the Agionist Saint Sansia (as the embodiment of strategic genius) and of Saint Eos (as the embodiment of martial perfection).\n\nThe Saints had many sympathizers (and outright followers) within the Legions, and in the recovery from the Agionist Rebellions there was no political will to attempt to dislodge them from within the otherwise loyal Legions. As such, worship of the Saints has always been seen as somewhat controversial yet extremely common, and most soldiers carry icons of $saint_sansia_link$ Sansia#! or $saint_eos_link$ Eos#! as good luck charms even if they do not consider themselves faithful.\n\nSome Legionnaires have gone so far as to venerate them both solely as two halves of the Purest, and almost all veteran Legionnaires in Aversaria have historically considered themselves in some way associated to these beliefs."
 militant_cliques_rite_desc: "The Militant Cliques are an Aversarian cult originating from within its Legions based primarily around the worship of the Agionist Saint Sansia (as the embodiment of strategic genius) and of Saint Eos (as the embodiment of martial perfection).\n\nThe Saints had many sympathizers (and outright followers) within the Legions, and in the recovery from the Agionist Rebellions there was no political will to attempt to dislodge them from within the otherwise loyal Legions. As such, worship of the Saints has always been seen as somewhat controversial yet extremely common, and most soldiers carry icons of Sansia or Eos as good luck charms even if they do not consider themselves faithful.\n\nSome Legionnaires have gone so far as to venerate them both solely as two halves of the Purest, and almost all veteran Legionnaires in Aversaria have historically considered themselves in some way associated to these beliefs."
