 ## Eirbaadit al-Muntarisa Faith ##
 ritualist_monolithist_faith: "Eirbaadit al-Muntarisa"
 ritualist_monolithist_faith_desc: "Founded by the adventurer-king Hasaar al-Khour in 727 IS, the Cult of the Monoliths worships three white monoliths engraved with unusually intricate designs and with extremely smooth surfaces, situated in [GetTitleByKey('b_arzoia').GetNameNoTooltip]. Claiming that the monoliths gave commandments to their most faithful followers when smeared in blood, ritual bloodletting swiftly evolved into the sacrifice of criminals to the monoliths, which purportedly increases the intensity of their commandments, as they are almost inaudible when given only offerings of blood. The monoliths are believed to represent a chthonic three-headed god of life and death, who was the first being to ascend the 1001 Steps of Sophocos where he became King of all Gods."
 ritualist_monolithist_faith_adj: "Ritualist"
 ritualist_monolithist_faith_adherent: "Ritualist"
 ritualist_monolithist_faith_adherent_plural: "Ritualists"
 
