 ## Old Rite Priesthood Faith ##
 old_rite_priesthood_faith: "Old Rite Priesthood"
 old_rite_priesthood_faith_desc: "As the Empire collapsed with the fall of Oraispol to the [Concept('sjalvolki_migration','migrant armies')|E] of the $cenware_link$ Witch-Breaker#!, the Imperial Cult fell alongside it with the treachery of the Priest's Coup and the spread of [Concept('deviationism','Deviationist')|E] philosophies amongst the warlords. Across the Empire, the thousand cults of the Aagiokrata found themselves reckoning with a dual crisis (beyond the thousand others endemic to the abjected remains of [aversaria|E]): Not only had the disintegration of Imperial legal authority left the cults without any central church law or hierarchy beyond the regional level, but the Aagiokrata's tight bond to the existence of the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] had left the priesthoods without any true legal authority or theological guidance.\n\nAs the cults disintegrated into bloody sectarian infighting over the newfound realities of the [Concept('the_continent', 'Shattered Coast')|E], those regions without strong warlords capable of enforcing Deviationist doctrine have found themselves like ships at sea without sail or rudder. Local priests have assumed as many theological functions as they have been able, and local administrators have become far too busy to attempt to do anything but buoy the dying faith. The 'Old Rite Priesthood' would become the Ritelander term for the [Glossary('Old Imperial','GH_OLD_EMPIRE_GLOSS')] status-quo, where local priests have done their best to pretend the end has not yet come, even as their followers have long moved past them."
 old_rite_priesthood_faith_adj: "Old Rite"
 old_rite_priesthood_faith_adherent: "Old Riteist"
 old_rite_priesthood_faith_adherent_plural: "Old Riteists"
 
