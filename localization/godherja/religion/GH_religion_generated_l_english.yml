 # The Five Hundred Paths of Katharitos Rite #
 five_hundred_rite: "The Five Hundred Paths of Katharitos"
 five_hundred_desc_with_gc: "The Five Hundred Paths of $saint_katharitos_link$ Katharitos#! come from the same origin as the Katharites, both dedicated to the veneration of Saint Katharitos. But unlike their Agionist brethren, the Five Hundred-Pathers have devoted themselves to radical pacifism. They believe that no man should take the life of a living thing, or use anything that was not freely offered to them from [aeras|E]. Many of them interpret that tenet as a ban against wearing clothes made from cultivated textiles, animal hides, or metal armor, and are most identifiable by their ritual nudity.\n\nDespite their nonaggressive nature, they have earned plenty of ire from both the Agionists and the [Concept('aversaria','Aversarians')|E]. They are condemned as heretics and deviants of the lowest form, and they are frequently harassed and killed when making pilgrimages to places important in Katharitos' life. But that does not stop them from practicing their faith, nor does it deter new recruits."
 five_hundred_rite_desc: "The Five Hundred Paths of Katharitos come from the same origin as the Katharites, both dedicated to the veneration of Saint Katharitos. But unlike their Agionist brethren, the Five Hundred-Pathers have devoted themselves to radical pacifism. They believe that no man should take the life of a living thing, or use anything that was not freely offered to them from Aeras. Many of them interpret that tenet as a ban against wearing clothes made from cultivated textiles, animal hides, or metal armor, and are most identifiable by their ritual nudity.\n\nDespite their nonaggressive nature, they have earned plenty of ire from both the Agionists and the Aversarians. They are condemned as heretics and deviants of the lowest form, and they are frequently harassed and killed when making pilgrimages to places important in Katharitos' life. But that does not stop them from practicing their faith, nor does it deter new recruits."
 five_hundred_rite_adj: "Katharite"
 five_hundred_rite_adherent: "Katharite"
 five_hundred_rite_adherent_plural: "Katharites"
 # Blood Veneration Rite #
 blood_veneration_rite: "Blood Veneration"
 blood_veneration_desc_with_gc: "One of the most ancient cults of [aversaria|E], as old as Aersodiaxynism with several high-profile followers. Believed to be the originator of Aversarian blood worship, the Venerators worship blood as a holy reflection of the power of the gods and strictly believe that the world belongs only to the holiest [magi|E] Kings, for they have the purest blood. As such, adherents sought to create the perfect Magi above all else, with some resorting to extreme methods ranging from marriage amongst one's own family to purging the impure, often to the detriment and horror of their own population."
 blood_veneration_rite_desc: "One of the most ancient cults of Aversaria, as old as Aersodiaxynism with several high-profile followers. Believed to be the originator of Aversarian blood worship, the Venerators worship blood as a holy reflection of the power of the gods and strictly believe that the world belongs only to the holiest Magi Kings, for they have the purest blood. As such, adherents sought to create the perfect Magi above all else, with some resorting to extreme methods ranging from marriage amongst one's own family to purging the impure, often to the detriment and horror of their own population."
 blood_veneration_rite_adj: "Blood Venerator"
 blood_veneration_rite_adherent: "Blood Venerator"
 blood_veneration_rite_adherent_plural: "Blood Venerators"
 # Cult of the Red Star Rite #
 red_star_rite: "Cult of the Red Star"
 red_star_desc_with_gc: "Having seen the great red comet that foretold the Worldeater, some among the followers of Aersodiax concluded that it was a sign. The Worldeater, they claimed, was the 'First Herald', one of ten great beasts that would precede the return of Aersodiax, risen from death to punish those who betrayed him. Considering themselves the watchers for the end times, their secretive meetings have gradually expanded the number of Heralds, having reached the number 8 when [frodbrokna|E] devastated the world. Seeing what was surely the beginning of the end, priests rushed to declare the last two Heralds, with $aauto_aeschraes_link$ Aeschraes#! and $aauto_axiaothea_link$ Axiaothea#! as the most common choices for the dubious honorific, though others have also become candidates, including the [Concept('the_fog','Fog')|E], Aexionarax, $cenware_link$ Cenware#!, along with many more.\n\nThough it might normally be expected of such a faith to consolidate around a single message, the imminent apocalypse has rendered such quibbling worthless, and the worshipers of the Red Star are instead devoted to enjoying what little time they have left in the form of endless celebrations and orgies, taking what they still can of life before their long-dead master returns to avenge their ancient sin."
 red_star_rite_desc: "Having seen the great red comet that foretold the Worldeater, some among the followers of Aersodiax concluded that it was a sign. The Worldeater, they claimed, was the 'First Herald', one of ten great beasts that would precede the return of Aersodiax, risen from death to punish those who betrayed him. Considering themselves the watchers for the end times, their secretive meetings have gradually expanded the number of Heralds, having reached the number 8 when Frodbrokna devastated the world. Seeing what was surely the beginning of the end, priests rushed to declare the last two Heralds, with Aeschraes and Axiaothea as the most common choices for the dubious honorific, though others have also become candidates, including the Fog, Aexionarax, Cenware, along with many more.\n\nThough it might normally be expected of such a faith to consolidate around a single message, the imminent apocalypse has rendered such quibbling worthless, and the worshipers of the Red Star are instead devoted to enjoying what little time they have left in the form of endless celebrations and orgies, taking what they still can of life before their long-dead master returns to avenge their ancient sin."
