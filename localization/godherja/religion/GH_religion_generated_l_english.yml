 ## Cult of the Shattered Stars Faith ##
 shattered_stars_cult: "Cult of the Shattered Stars"
 shattered_stars_cult_desc: "In the wake of the [frodbrokna|E], the followers of the Sacred Stars have witnessed a tragedy most traumatising, the destruction of [aervalr|E], the ancient halls of the most beloved heroes. As its shattered ruins fall to [aeras|E], its followers have turned bitter, cursing those of magical power and casting them from their [Concept('shatteredisles','Isles')|E]. Followers preach that only through greater worship of the ancient pantheons, willingly or otherwise, can they be saved from a fate of eternal detachment and the dying of the light."
 shattered_stars_cult_adj: "Shattered Stars Cultist"
 shattered_stars_cult_adherent: "Shattered Stars Cultist"
 shattered_stars_cult_adherent_plural: "Shattered Stars Cultists"
 
