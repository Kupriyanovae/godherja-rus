 # Ḥārthahi'a Rite #
 harthahi_rite: "Ḥārthahi'a"
 harthahi_desc_with_gc: "The Ḥārthahi sect was created in response to perceived [Concept('wardenism','Wardenite')|E] weakness, and a belief that the [Concept('wardenism','Wardenite')|E] sects are too tolerant of outsiders. The Ḥārthahi'un argue that the Dead God is imprisoned within [sarradon|E], and that all evil done upon its land is a direct attempt to unleash them back upon the world. Thus, Sarradon must be free, and its people united against those the Ḥārthahii view as foreign invaders — namely the Agionists, [Concept('aversaria','Aversarians')|E], and [marchers|E]. While militant, the faith is fairly pluralistic, more concerned with removing the realms of hostile foreigners than their populations."
