 ## Manikos Aagiokrata Faith ##
 manikos_aagiokrata_faith: "Manikos Aagiokrata"
 manikos_aagiokrata_faith_desc: "Propagated by Megistos 'the Mad Emperor,' this faith is dismissed as a mockery of virtue by those who adhere to traditional [Concept('aversaria','Aversarian')|E] ways. To adherents, the descendents of the Purest are mentally and physically sound enough to indulge in physical sensations without fear of corruption. But to outsiders, it seems like the ravings of a delusional satyromaniac who says his gods want him to host orgies and bed every beautiful woman in his court."
 manikos_aagiokrata_faith_adj: "Manic Aagiokratan"
 manikos_aagiokrata_faith_adherent: "Manikos Aagiokratan"
 manikos_aagiokrata_faith_adherent_plural: "Manikos Aagiokratans"
 
