 ## Cult of the Cleansed Faith ##
 cleansed_ones_faith: "Cult of the Cleansed"
 cleansed_ones_faith_desc: "At the edge of the island remnants of [aversaria|E], the ancient cult of the Cleansed has reemerged in the wake of [frodbrokna|E], preaching a new message of restoration in the midst of general anarchy. Several [Concept('shatteredisles','Isles')|E] have fallen under their sway through bloody uprisings and brutal conquests, often followed by mass purges of those deemed unwilling or unable to understand the calamity adherants hold was spawned of a milenium of Aversarian degeneracy.\n\nBelievers speak of an ancient ritual known only as the Blood Trial, a trial that allows a [magi|E] to be purified, false beliefs eradicated, their blood cleansed, and a path to the Purest made clear. This path is said to be a blessing from the highest figure of the cult, the so-called 'Voice of the Purest'. The few exiles that have left the cult since the Frodbrokna speak of a depraved ritual of self-flagellation, complete Magi supremacy, and the widespread enslavement of non-[magic|E] commoners."
 cleansed_ones_faith_adj: "Cleansed Cultist"
 cleansed_ones_faith_adherent: "Cleansed One"
 cleansed_ones_faith_adherent_plural: "Cleansed Ones"
 ## Theryionism Faith ##
 theryionist_faith: "Theryionism"
 theryionist_faith_desc: "Theryionists worship Theryion, 'the Last Dragon', an ancient [Concept('aversaria','Aversarian')|E] pretender to the Empire.\n\nGrand nephew of Aautokratia $aauto_maklea_link$ Maklea#!, Theryion was raised in secret with the goal of reclaiming the throne his family believed stolen by Maklea. When Theryion's grandfather died, Theryion at age 20 came out of hiding and assaulted an Aversaria in civil war. Riding a wyvern in place of the (believed) extinct dragons, Theryion began the Widow War, and would quickly become legend with even his enemies naming him 'the Last Dragon' in recognition of his adherence to the old honor and ideals of pre-Maklean Aversaria. The war only ended with his alleged death after nearly 40 years of brutal fighting, Thyrionists claiming that Theryion was a spirit in human form who simply ascended to lay out bloody justice within the heavens. Theryionist belief holds that Theyrion guides the world from the ephemeral [Concept('first_empire','First City')|E], and one day shall return, reborn as the [Concept('aersanon','Purest')|E] to reclaim Their rightful throne."
 theryionist_faith_adj: "Theryionist"
 theryionist_faith_adherent: "Theryionist"
 theryionist_faith_adherent_plural: "Theryionists"
 
