 # Nathanalmic Rite #
 nathanalmic_rite: "Nathanalmic"
 nathanalmic_desc_with_gc: "The [Glossary('Nathanalmic','GH_NATHANALMIC_GLOSS')], preaches that the best way to honor the Twin Gods is through being in harmony with nature and conducting [Concept('holy_hunts','holy hunts')|E] in their name. Adherents view outsiders as melancholic and misguided souls and believe that it is the duty of the faithful to convince them to walk the middle path. Despite this openness however, the Nathanalmics continue to be wary of ideas outside the norm, out of fear that these may ignite anew the [Concept('great_betrayal','tragedies')|E] that passed before."
 nathanalmic_rite_desc: "The Nathanalmic, preaches that the best way to honor the Twin Gods is through being in harmony with nature and conducting holy hunts in their name. Adherents view outsiders as melancholic and misguided souls and believe that it is the duty of the faithful to convince them to walk the middle path. Despite this openness however, the Nathanalmics continue to be wary of ideas outside the norm, out of fear that these may ignite anew the tragedies that passed before."
