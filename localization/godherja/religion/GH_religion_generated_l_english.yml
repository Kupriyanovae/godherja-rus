 ## Cult of the Black Hand Faith ##
 blackhand_faith: "Cult of the Black Hand"
 blackhand_faith_desc: "The Cult of the Black Hand was an [Concept('aversaria','Aversarian')|E] cult centered around an enigmatic figure known as 'the Mindseeker.' The Cult held the Mindseeker as an all-powerful being and prophet, capable of predicting the future, seeing the past, and of bestowing great powers upon their followers. The Seeker themself preached the idea that all gods are to be rejected and killed, as it is the gods of man which once destroyed the world and would again. Followers of the Mindseeker destroyed all religious iconography and scripture they could, and attempted to learn the 'true names' of gods, driven by the belief that speaking a deity's true name would kill them."
 blackhand_faith_adj: "Cult of the Black Hand"
 blackhand_faith_adherent: "Black Hand"
 blackhand_faith_adherent_plural: "Black Hands"
 
 # Cult of the Black Hand Rite #
 blackhand_rite: "Cult of the Black Hand"
 blackhand_desc_with_gc: "The Cult of the Black Hand collapsed and vanished from the public eye after the sudden disappearance of their mysterious leader, the Mindseeker, in 1190 IS. Until their downfall, the Cult had spread like wildfire across Etepezea and portions of Opakhasia, and were most infamous for burning the Nikarynpalati, the millennia-old residence of [Concept('aversaria','Aversarian')|E] Aautokratirs, to the ground."
