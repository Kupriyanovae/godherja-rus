 ## Cult of the Dragon Faith ##
 the_dragon_cult: "Cult of the Dragon"
 the_dragon_cult_desc: "The ancient Cult of the [Concept('dragons','Dragon')|E] is a faith native to the more southwestern [shatteredisles|E], those closest to the continent of [sarradon|E]. A mixture of beliefs and doctrines from both Aersodiaxianism and the Drakánorix Aagiokrata, the Cult of the Dragon focuses solely on the worship of those great beasts famed across [aeras|E] for their might and majesty. They exhort the divine attributes of dragonkind, and insist that the creator god, Karalthor created those known as the Winged Lords in their own image to rule over mankind as benevolent monarchs and vicious scourges of injustice and impurity. The greatest of the Winged Lords, Paratharian stands above all others as the firstborn child of Karalthor and overlord of not only all Dragons but of Aeras itself. A litany of other Dragons make up the rest of the Cult's pantheon, though a great number of these 'Dragons' are in truth simply exceptionally potent [magi|E] deified after death."
 the_dragon_cult_adj: "Dragon Cultist"
 the_dragon_cult_adherent: "Cultist of the Dragon"
 the_dragon_cult_adherent_plural: "Cultists of the Dragon"
 
