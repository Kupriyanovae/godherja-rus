 ## Reformed Aversarinas Aagiokrata Faith ##
 aversarinas_aagiokrata_reformed_faith: "Reformed Aversarinas Aagiokrata"
 aversarinas_aagiokrata_reformed_faith_desc: "The old ways of the [Concept('aversaria','Aversarians')|E] died the same way they were practiced and enforced, at the tip of a sword. In the chaos following the collapse of the Aversarinas Aautokrata, Legan Hecaeda of the LXI Legion swore to prevent the circumstances that led to its destruction from ever happening again. To be an Aversarian is no longer defined by bloodlines and ancestry, but through personal virtue, and the noble magocracy of old has been torn down and replaced with a meritocracy."
 aversarinas_aagiokrata_reformed_faith_adj: "Reformed Aagiokratan"
 aversarinas_aagiokrata_reformed_faith_adherent: "Reformed Aagiokratan"
 aversarinas_aagiokrata_reformed_faith_adherent_plural: "Reformed Aagiokratans"
 
