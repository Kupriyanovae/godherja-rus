 zaragett_aagiokrata_rite_adherent: "Zaragett Aagiokratan"
 zaragett_aagiokrata_rite_adherent_plural: "Zaragett Aagiokratan"
 # Sjalvolki Aagiokrata Rite #
 sjalvolki_aagiokrata_rite: "Sjalvolki Aagiokrata"
 sjalvolki_aagiokrata_desc_with_gc: "Former followers of the Sjalvolki faith who learned the powers of [magic|E], these relatively recent converts to the way of the [Concept('aversaria','Aversarians')|E] brought with them traditions that their brothers in faith regard as borderline-heretical. They also have a bit more of an inclusive worldview, and consider belief and magical ability to preclude even the most pedigreed bloodlines in terms of purity."
