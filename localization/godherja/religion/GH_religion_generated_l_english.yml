 ## Tarriaq al-Dhaat Faith ##
 tarriaq_al_dhaat_faith: "Tarriaq al-Dhaat"
 tarriaq_al_dhaat_faith_desc: "The Road of the Self teaches that the Thousand-and-One Steps of [GetBuilding('01_sophocos').GetName] cannot be climbed unless ones soul has been freed from oppression. Gods, angels, and false prophets alike are but chains on the living, and each step taken is a chain cast off. To walk the Tarriaq al-Dhaat is to need nothing but what is within you.\n\nThis was the revelation of the [Glossary('Saayf al-Malaiki al-Khalidh','UNDYING_SWORD_GLOSS')], who turned the blade of heaven against heaven itself."
