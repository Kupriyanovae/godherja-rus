 ## Saratarat Faith ##
 saratarat_faith: "Saratarat"
 saratarat_faith_desc: "Saratarat is a pacifistic oceanic religion based around the worship of the saratans of the Kezymin crater. Sarataratians believe that the saratans were the first guardians of the world as well as the first beings to exist, and that their movements formed the seas and Aeras which swirled around them to form reality and the universe itself.\n\nAfter great calamity, the faithful swore themselves to pacificism, and now live humble lives as fishermen and merchants."
