 # Cult of the Sacred Stars Rite #
 sacred_stars_cult_rite: "Cult of the Sacred Stars"
 sacred_stars_cult_desc_with_gc: "For the followers of the Sacred Stars, the heroes of the [Concept('shatteredisles','Isles')|E] exist for a time far greater than their life on [aeras|E]. Each star is an ascended legend of old, each constellation a sign for their followers. Worship is what draws them back to the lands they once called home, the brighest stars are those still treasured by their followers on Aeras. The most celebrated and beloved heroes live in the ancient halls of [aervalr|E], watching, endowing their most loyal adherants with blessings in life and a chance of eternal existence."
