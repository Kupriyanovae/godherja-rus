 ## Kathsiti'a Faith ##
 kathsiti_faith: "Kathsiti'a"
 kathsiti_faith_desc: "The Kathsiti'un, unlike other [Concept('wardenism','Wardenite')|E] sects believe that there must be complete separation between the church and state, for secular matters corrupt the true spiritual nature of the church. In reality this has led to an extremely independent, politically powerful group of Kathsiti clerics dictating rules to secular lords."
