 ## Talita Namit Faith ##
 talita_namit_faith: "Talita Namit"
 talita_namit_faith_desc: "The Talita Namit is as much a mode of religious belief as it is a political system. The most striking element of the faith is the belief espoused by zealous adherents that certain Chosen Magi can serve as messengers from the Realm Above, serving as emissaries of the will of the Heavens and exerting rightful rulership over the lands of Aeras."
