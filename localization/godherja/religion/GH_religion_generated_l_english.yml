 tulharsin_faith_desc: "A faith as old as the ancient and rocky hillsides of the Tarsanides — or at least, human habitation thereof, the Tulharsin, or "family" is the name the Barzawa give to their pantheon. Though lesser gods come and go, the core five deities of the Tulharsin have remained the same since time out of memory, their faces carved by ancient hands into the highest peaks of the Tarsanides Range. Chief among them is Ke-Ren, the mother-father god who split open their own stomach to birth the universe, and from whose viscera crawled the second-born — The most important were the four eldest gods, Tarhannu, Mishkush, Annira, and Kesh, as well as the moon itself. Once assembled, these siblings then set about populating Aeras by bringing into existence all manner of flora, fauna, and terrible monsters, alongside man."
 tulharsin_faith_adj: "Tulharsin"
 tulharsin_faith_adherent: "Tulharsite"
 tulharsin_faith_adherent_plural: "Tulharsites"
 
