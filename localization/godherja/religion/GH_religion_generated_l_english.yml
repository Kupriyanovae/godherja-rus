 # Iyêtrandên Rite #
 iyetrande_rite: "Iyêtrandên"
 iyetrande_desc_with_gc: "Emerging after the collapse of [Glossary('Kratemezin','crater_encyclopedia_desc')]'s nobility following the Frodbrokna, the Iyêtrandên are a radical sect that rejects the divinity of music. They believe sound is an obstacle to their rituals while silence is the foremost step towards reaching [GetBuilding('01_sophocos').GetName] through meditation. While hostile to musicians, whom they believe to be swayed by demonic influences, its practitioners still cultivate the arcana of the [aspect_hymns] through collective prayers and songs that can only be heard through [aspect_dream] magic."
