 ## Mourners of the Slain Eagle Faith ##
 slain_eagle_cult: "Mourners of the Slain Eagle"
 slain_eagle_cult_desc: "The followers of this isolationist cult are feared across the [Concept('shatteredisles','Isles')|E] for their fanaticism, their faith only known to a few traders and dusty shelves in [Concept('aversaria','Aversarian')|E] academies. Followers disdain the peoples of the isles, seeing them as complicit in the great betrayal that has haunted them ever since. They speak of a guardian eagle, protectors of a meek people blessed to live under its wings. They were safe, until a jealous [magi|E] cut the throat of their guardian and left them to the terrors of the night. In time they grew strong, and when the time was right they set sail to find a home where they could mourn their protector in peace.\n\nSince ancient times their isles have found peace, most never encountering an eagle banner in their lifetime. Once in a century however tales spread far and wide of a small fleet sailing the waves, slaying any Magi unfortunate enough to cross their path."
 slain_eagle_cult_adj: "Slain Eagle Mourner"
 slain_eagle_cult_adherent: "Mourner"
 slain_eagle_cult_adherent_plural: "Mourners"
 
