 # Korlonalmic Rite #
 korlonalmic_rite: "Korlonalmic"
 korlonalmic_desc_with_gc: "For as long as the Twin Gods and Followers of the Way have existed, there have been those who reject it and seek the Korlonalmic or [fire_path|E]. However, the [twin_deceivers|E]'' betrayal resulted in the fall of Korlacu, and his followers' banishment to the [Glossary( 'Chan Kyawkorlacu', 'GH_CHAN_KYAWKORLACU_GLOSS' )] - northwestern mountains of Kharadan. There the sect would adopt a more radical view of magical research, influenced in part by the nearby worshippers of Sarvat, the Kashiryan god of knowledge."
