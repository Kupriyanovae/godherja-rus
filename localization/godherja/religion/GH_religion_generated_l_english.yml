 # Daenavadism Rite #
 daenavad_rite: "Daenavadism"
 daenavad_desc_with_gc: "Founded within the Amonnid ruling dynasty, Daenavadism holds that the Amsari Hiklahn should be ruled by a descendant of the $amsari_prophet_link$ Prophet#!, a principle it extends to all positions of authority. It asserts that every position of power must be held by those who can directly trace their lineage to the Prophet. While no Qanamsar has ever officially adhered to Daenavad, its influence persists in the higher echelons of society among the Prophet's descendants, where the purity of one's lineage is regarded as the ultimate marker of authority and legitimacy."
