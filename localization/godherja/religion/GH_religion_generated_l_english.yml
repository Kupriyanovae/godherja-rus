 iyrossi_aagiokrata_rite_adherent_plural: "Iyrossi Aagiokratan"
 # Abdêxorn Aagiokrata Rite #
 abdexorn_aagiokrata_rite: "Abdêxorn Aagiokrata"
 abdexorn_aagiokrata_desc_with_gc: "The [Concept('shatteredisles','Islanders')|E] of Abdêxorn hold to their ancient heroes in both heart and mind. Famous warriors and [magi|E], legends who forged isles and brought down civilizations without fear or doubt. They unified rivaling city-states with purpose and a warrior's spirit passed down generations. Many of their heroes were ancient enemies of [aversaria|E] who eventually bowed to the Purest through bonds of blood. For some, these heroes were traitors, and the chosen of Abdêxorn are destined to bring Aversaria to its knees."
 abdexorn_aagiokrata_rite_desc: "The Islanders of Abdêxorn hold to their ancient heroes in both heart and mind. Famous warriors and Magi, legends who forged isles and brought down civilizations without fear or doubt. They unified rivaling city-states with purpose and a warrior's spirit passed down generations. Many of their heroes were ancient enemies of Aversaria who eventually bowed to the Purest through bonds of blood. For some, these heroes were traitors, and the chosen of Abdêxorn are destined to bring Aversaria to its knees."
 abdexorn_aagiokrata_rite_adj: "Abdêxorn Aagiokratan"
 abdexorn_aagiokrata_rite_adherent: "Abdêxorn Aagiokratan"
 abdexorn_aagiokrata_rite_adherent_plural: "Abdêxorn Aagiokratas"
 # Sunarwei Aagiokrata Rite #
 sunwarwei_aagiokrata_rite: "Sunarwei Aagiokrata"
 sunwarwei_aagiokrata_desc_with_gc: "The Sunarwei Aagiokrata is perhaps one of the most peculiar results of the [Concept('aversaria','Aversarianization')|E] of a native faith to improve stability of Aversaria's vast empire. While normally Aversarianization of a faith involves modifying the faith to exalt the Aversarians and [magi|E] in some form, the Sunarwei Aagiokrata instead attempts to encourage more militaristic outlooks and push back against its traditional pacifistic beliefs while making almost no mention of [Concept('peculiar_compromise_sunarwei', 'Aversarians')|E] or [magi|E]."
 sunwarwei_aagiokrata_rite_desc: "The Sunarwei Aagiokrata is perhaps one of the most peculiar results of the Aversarianization of a native faith to improve stability of Aversaria's vast empire. While normally Aversarianization of a faith involves modifying the faith to exalt the Aversarians and Magi in some form, the Sunarwei Aagiokrata instead attempts to encourage more militaristic outlooks and push back against its traditional pacifistic beliefs while making almost no mention of Aversarians or Magi."
