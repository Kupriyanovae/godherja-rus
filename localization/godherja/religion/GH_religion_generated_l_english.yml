 ## Calystoanistism Faith ##
 calystoanistism: "Calystoanistism"
 calystoanistism_desc: "Calystoanistism is a cult centered around the worship of the Agionist saint, Calysto, known to many as the greatest hero to ever spring forth from the [shatteredisles|E]. Originating from the few remnants of the legendary pirate's crew that managed to elude [Concept('aversaria','Aversarians')|E] and Order Militant both, the Calystoans held fast to the beliefs of their freedom-loving patron, treasuring personal autonomy and liberty above all else. For this they are staunchly opposed to the heretical Saintly Order of Calysto's Key, whom they view as mere slavers and heretics of the most vile breed. Unlike most cults of the isles centered around exceptional heroic figures, Calystoanistism holds Calysto to be a deity who descended from the celestial realm to unite the lost peoples of [aeras|E] into one. Though he has now returned to his abode in the cosmos, it is believed that in this action he left the task of completing his holy work to humanity, a charge taken up by the Calystoans in their mission to break the bonds of servitude and bring about an era of complete freedom for all the people of Aeras."
 calystoanistism_adj: "Calystoanist"
 calystoanistism_adherent: "Calystoanist"
 calystoanistism_adherent_plural: "Calystoanists"
 
