 daenavad_rite_adherent: "Daenavadian"
 daenavad_rite_adherent_plural: "Daenavadi"
 # Tirazhidar Rite #
 tirazhidar_rite: "Tirazhidar"
 tirazhidar_desc_with_gc: "Its adherents blame the unfaithful for Zaoran's recent defeat and the catastrophe brought by [frodbrokna|E], seeing it as the hand of Maiya upon the world through the actions of humans. Their doctrine rests on a strictly literal reading of the [gh_zenda|E], treating verses that most scholars regard as metaphorical as direct commands? Salvation is not an individual pursuit but a collective duty.\n\nAn interpretation that has driven many of them toward violent actions, inclduing enacting forced conversion upon the wandering people of Amsar. To them, humanity must be brought beneath Zaoran's divine order for His triumph to be absolute. Only then will the world be made whole, and the Last Struggle at last be won."
 tirazhidar_rite_desc: "Its adherents blame the unfaithful for Zaoran's recent defeat and the catastrophe brought by Frodbrokna, seeing it as the hand of Maiya upon the world through the actions of humans. Their doctrine rests on a strictly literal reading of the Zenda, treating verses that most scholars regard as metaphorical as direct commands? Salvation is not an individual pursuit but a collective duty.\n\nAn interpretation that has driven many of them toward violent actions, inclduing enacting forced conversion upon the wandering people of Amsar. To them, humanity must be brought beneath Zaoran's divine order for His triumph to be absolute. Only then will the world be made whole, and the Last Struggle at last be won."
 tirazhidar_rite_adj: "Tahkedar"
 tirazhidar_rite_adherent: "Zaoranian"
 tirazhidar_rite_adherent_plural: "Zaoranians"
 # Mahazhadar Rite #
 mahazhadar_rite: "Mahazhadar"
 mahazhadar_desc_with_gc: "Emerging in the years following the $amsari_prophet_link$ Prophet's#! death, Mahazhadarism persisted briefly after the [Concept('gh_amsari_rebellion','Amsari Rebellion')|E] before disappearing. Mahazhadari interpreted the Prophet's teachings not as straightforward declarations but as symbolic expressions of deeper truths. Its adherents believed that the events described for the future were not literal prophecies but abstract concepts that required thoughtful interpretation. They maintained that the future, as described by the Prophet, was not fixed but could be understood through reflection and debate."
