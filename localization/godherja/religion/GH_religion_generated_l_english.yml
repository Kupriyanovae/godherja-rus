 # Axiaotheaism Rite #
 aversarian_axiaotheaism_rite: "Axiaotheaism"
 aversarian_axiaotheaism_desc_with_gc: "Although $aauto_axiaothea_link$ Axiaothea#! and her most powerful supporters were all killed by the despicable $aauto_aeschraes_link$ Aeschraes#! when he ushered in the [frodbrokna|E], the late Empress still has her supporters within the former borders of the Empire. They revere her legacy nearing on deification, painting her struggle with Aeschraes as a battle between good and evil for the fate of the world. And unfortunately, evil got the upper hand this time."
