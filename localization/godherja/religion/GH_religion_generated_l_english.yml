 # Muka'asubat Rite #
 mukaasubat_rite: "Muka'asubat"
 mukaasubat_desc_with_gc: "Following the collapse of the [GetTitleByKey('e_far_eastern_mamuramat').GetNameNoTier], the Muka'asubites believed that the Pillars of Virtue had begun to crumble. As the books left behind by the defunct polity began to rot, the devout began carving replacements onto great stone tablets, and burying judges alongside their lawbooks. This, they believe, will equip them with the necessary materials to repair the pillars in the afterlife. As the pillars continue to crumble, however "kebang sejan" are released, spirits of virtue who can possess pious and goodly mortals and dispense great wisdom."
 mukaasubat_rite_desc: "Following the collapse of the Far Eastern Mamuramat, the Muka'asubites believed that the Pillars of Virtue had begun to crumble. As the books left behind by the defunct polity began to rot, the devout began carving replacements onto great stone tablets, and burying judges alongside their lawbooks. This, they believe, will equip them with the necessary materials to repair the pillars in the afterlife. As the pillars continue to crumble, however "kebang sejan" are released, spirits of virtue who can possess pious and goodly mortals and dispense great wisdom."
