 aironoian_aagiokrata_rite_desc: "Owing to their great distance from the homeland, the Aversarian priest in eastern Aironoi struggled to maintain any sort of orthodoxy among the faithful. While the Aversarinas Aagiokrata has always been far from consistent among its thousands of local and Imperial cults, the mass deviation its easternmost practitioners slid into was cause for such concern that many priests worried they'd slide from the faith altogether. Despite best attempts, however, what would become known as the Aironoian Aagiokrata largely began to reach a level of consistency with its eastern cults instead of the homelands, and soon became a somewhat codified heresy deeply ingrained in Eastern Culture."
