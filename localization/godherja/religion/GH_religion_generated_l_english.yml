### Mogowai Religion ###
 mogowai_religion: "Mogowai"
 mogowai_religion_adj: "Mogowai"
 mogowai_religion_adherent: "Mogowai"
 mogowai_religion_adherent_plural: "Mogowai"
 mogowai_religion_desc: "The Mogowai believe that their god, known only as the Most High, once had a physical avatar who walked upon [aeras|E] and interacted with supplicants. However, He was attacked by an army of nonbelievers, who burnt His temples, destroyed His offerings, and even slew Him. His body was spirited away to places unknown, and it is the duty of the Mogowai ('Searchers' in their language) to track down this body and give it proper last rites, after which the Most High shall be born in a new body and peace shall return to the world."
