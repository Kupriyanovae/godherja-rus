 ## Seaborne Exalted Faith ##
 seaborne_exalted: "Seaborne Exalted"
 seaborne_exalted_desc: "Hated by all, feared by many, scourges of the Shattered Coast and all its [Concept('shatteredisles','Isles')|E], the Seaborne Exalted are an abhorrent and spiteful cult who value the act of raiding and pillaging above all else. Believing that all of mankind arose from seasalt, to the Seaborne a life without murder, plunder, and rape is one devoid of any meaning. Life is short, and when one dies there is no lofty afterlife or place of heavenly residence but only the returning of one's body to the seasalt it was before.\n\nThus, one should seize any opportunities that might arise, commit any crimes one might wish to commit and take all that one can, for nothing lies beyond the veil of death besides an eternity of being carried from shore to shore by the perfidious sea that once troubled them so much in life. To kill is to exert one's will on this world of the damned and change the tides of fate themselves. To rule is to be strong, and the weak should stand aside or die when confronted by their betters. No law, no god, and no king constrains the Seaborne, who come where they will and go when they may, and woe betide any who seek to chain them."
 seaborne_exalted_adj: "Seaborne Exalted"
 seaborne_exalted_adherent: "Seaborne"
 seaborne_exalted_adherent_plural: "Seaborne"
 
 # Seaborne Exalted Rite #
 seaborne_exalted_rite: "Seaborne Exalted"
 seaborne_exalted_desc_with_gc: "Hated by all, feared by many, scourges of the Shattered Coast and all its [Concept('shatteredisles','Isles')|E], the Seaborne Exalted are an abhorrent and spiteful cult who value the act of raiding and pillaging above all else. Believing that all of mankind arose from seasalt, to the Seaborne a life without murder, plunder, and rape is one devoid of any meaning. Life is short, and when one dies there is no lofty afterlife or place of heavenly residence but only the returning of one's body to the seasalt it was before.\n\nThus, one should seize any opportunities that might arise, commit any crimes one might wish to commit and take all that one can, for nothing lies beyond the veil of death besides an eternity of being carried from shore to shore by the perfidious sea that once troubled them so much in life. To kill is to exert one's will on this world of the damned and change the tides of fate themselves. To rule is to be strong, and the weak should stand aside or die when confronted by their betters. No law, no god, and no king constrains the Seaborne, who come where they will and go when they may, and woe betide any who seek to chain them."
 seaborne_exalted_rite_desc: "Hated by all, feared by many, scourges of the Shattered Coast and all its Isles, the Seaborne Exalted are an abhorrent and spiteful cult who value the act of raiding and pillaging above all else. Believing that all of mankind arose from seasalt, to the Seaborne a life without murder, plunder, and rape is one devoid of any meaning. Life is short, and when one dies there is no lofty afterlife or place of heavenly residence but only the returning of one's body to the seasalt it was before.\n\nThus, one should seize any opportunities that might arise, commit any crimes one might wish to commit and take all that one can, for nothing lies beyond the veil of death besides an eternity of being carried from shore to shore by the perfidious sea that once troubled them so much in life. To kill is to exert one's will on this world of the damned and change the tides of fate themselves. To rule is to be strong, and the weak should stand aside or die when confronted by their betters. No law, no god, and no king constrains the Seaborne, who come where they will and go when they may, and woe betide any who seek to chain them."
