 nathanalmic_rite_adherent: "Sepattanni"
 nathanalmic_rite_adherent_plural: "Sepattani"
 # Katharnalmic Rite #
 katharnalmic_rite: "Katharnalmic"
 katharnalmic_desc_with_gc: "The Twin Gods watch over those who live in harmony with nature, and so unyielding stone which refuses harmony must be carved and broken for this purpose.\n\n So it is spoken among the [Glossary('Katharnalmic','GH_KATHARNALMIC_GLOSS')], whose followers are housed within the very stone they shape. The path's faithful have a long history of guarding against those who would seek to drive them from the Cloud Forests of [Glossary( 'Chan Kyawkorlacu', 'GH_CHAN_KYAWKORLACU_GLOSS' )] - granting them a great zeal that serves as a shield against the temptation to follow in the ways of their [Concept('great_betrayal','heathen ancestors')|E]."
 katharnalmic_rite_desc: "The Twin Gods watch over those who live in harmony with nature, and so unyielding stone which refuses harmony must be carved and broken for this purpose.\n\n So it is spoken among the Katharnalmic, whose followers are housed within the very stone they shape. The path's faithful have a long history of guarding against those who would seek to drive them from the Cloud Forests of Chan Kyawkorlacu - granting them a great zeal that serves as a shield against the temptation to follow in the ways of their heathen ancestors."
 katharnalmic_rite_adj: "Sepattann"
 katharnalmic_rite_adherent: "Sepattanni"
 katharnalmic_rite_adherent_plural: "Sepattani"
 # Gotharnalmic Rite #
 gotharnalmic_rite: "Gotharnalmic"
 gotharnalmic_desc_with_gc: "To the followers of the [Glossary('Gotharnalmic','GH_GOTHARNALMIC_GLOSS')], the Twin Gods' prohibition on slavery includes the act of forcing outsiders to embrace their way of life. Thus, while they are respected by all Nattanan, adherents mostly keep to their own within the deepest reaches of the jungle. Gotharnalmics also shun war and violence as a corrupting force that caused [Concept('great_betrayal','Korlacu')|E] to fall and believe that the only time it is permitted by the Twin Gods is when it is done to protect one's own."
