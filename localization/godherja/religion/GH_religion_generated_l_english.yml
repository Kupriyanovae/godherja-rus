 ## Underimperial Aagiokrata Faith ##
 underimperial_aagiokrata_faith: "Underimperial Aagiokrata"
 underimperial_aagiokrata_faith_desc: "When the city of Nevetexon crashed down into the [Concept('mayikrata','underworld')|E] thanks to the efforts of the [magi|E] Avaxon and his revolution against the [Concept('chaos_of_the_seventh_century','occupying')|E] [Concept('kartharadd','Kartharaddi')|E] armies they landed into a cavern at war. Upon their island in the middle of the great abyss the Currataggagglarni and Skrattakiattia warred, the newly arrived [Concept('aversaria','Imperials')|E] and the surviving Kartharaddi armies soon joining the great battle that destroyed much of what remained of Nevetexon.\n\nAvaxon's disciple, Zekros, would end the war with the opening of the Beaconlight and the signing of the Abyssal Peace. Thereafter, Bleakbeacon would become possibly the largest city in the underworld, and the strange confluence of tribals, Kartharaddi (oddly spared from the [Concept('night_of_the_bleeding_moon','fate of their aboveground kin')|E], and Imperials would see the formation of an Aagiokratan cult mixing each faith represented in the Abyssal Peace."
