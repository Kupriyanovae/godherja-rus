 ## Conclave of Raocourt Faith ##
 lifepath: "Conclave of Raocourt"
 lifepath_desc: "At the age of sixteen, every Marcher is supposed to choose a Path (or more controversially, have one forced by a parent or lord) that dictates the role they are to play in both Marcher Society and the world. They are tutored in this path by a Waymaster, one skilled in their role who has dedicated their life to teaching others. Initiates study the ways of the revered Waysaints of the past, who guide the spirits in aiding the faithful down their Paths. For most of the faith's existence, its priesthood has organized beneath the [GetTitleByKey('d_lifepath_rel').GetNameNoTier]."
 lifepath_adj: "Conclave of Raocourt"
 lifepath_adherent: "Pathtreader"
 lifepath_adherent_plural: "Pathtreaders"
 
 # Raocourt Rite Rite #
 raocourt_rite: "Raocourt Rite"
 raocourt_desc_with_gc: "The mainline observance of the Lifepath from Raocourt. It holds that a path is chosen and then walked, that the wayfathers are witnesses rather than masters, and that a house which shelters a traveller has already kept the greater part of the faith."
 raocourt_rite_desc: "The mainline observance of the Lifepath from Raocourt. It holds that a path is chosen and then walked, that the wayfathers are witnesses rather than masters, and that a house which shelters a traveller has already kept the greater part of the faith."
 raocourt_rite_adj: "Raocourt"
 raocourt_rite_adherent: "Raocourt Wayfarer"
 raocourt_rite_adherent_plural: "Raocourt Wayfarers"
 # Gisredde Rite Rite #
 gisredde_rite: "Gisredde Rite"
 gisredde_desc_with_gc: "The observance kept by the conclaves of Peti and Grande Gisredde, where the wayfathers answer to a temporal seat rather than a spiritual one. While extremely similar to Raocourt's teachings, the Gisreddeans chafe under Raocourt and have repeatedely schismed from the conclave."
 gisredde_rite_desc: "The observance kept by the conclaves of Peti and Grande Gisredde, where the wayfathers answer to a temporal seat rather than a spiritual one. While extremely similar to Raocourt's teachings, the Gisreddeans chafe under Raocourt and have repeatedely schismed from the conclave."
 gisredde_rite_adj: "Gisreddean"
 gisredde_rite_adherent: "Gisreddean"
 gisredde_rite_adherent_plural: "Gisreddeans"
 # Wyrd Rite Rite #
 wyrd_rite: "Wyrd Rite"
 wyrd_desc_with_gc: "The Wyrd Path was born from a mix of early proselytizing efforts by [marchers|E] in northern Kalathipsomi. It would prove only marginally successful, teaching the necessity of following your path through life, but failing to replace their ancient rites and customs."
 wyrd_rite_desc: "The Wyrd Path was born from a mix of early proselytizing efforts by Marchers in northern Kalathipsomi. It would prove only marginally successful, teaching the necessity of following your path through life, but failing to replace their ancient rites and customs."
 wyrd_rite_adj: "Wyrd"
 wyrd_rite_adherent: "Wyrdtreader"
 wyrd_rite_adherent_plural: "Wyrdtreaders"
 # Opakasijan Rite Rite #
 opakasijan_lifepath_rite: "Opakasijan Rite"
 opakasijan_lifepath_desc_with_gc: "The observance of the marchers who settled western Opakhasia and have not listened to the Sjalvolki."
 opakasijan_lifepath_rite_desc: "The observance of the marchers who settled western Opakhasia and have not listened to the Sjalvolki."
 opakasijan_lifepath_rite_adj: "Opakasijan"
 opakasijan_lifepath_rite_adherent: "Opakasijan"
 opakasijan_lifepath_rite_adherent_plural: "Opakasijans"
 # Coast Path Rite #
 coast_rite: "Coast Path"
 coast_desc_with_gc: "The 'Coast Path' is an exceptionally loose gathering of several dozen separate faiths that are native to the Konijkmener coasts as well as southeastern [chevalie|E]. The fusing of native beliefs in oceanic and river based pantheons with the Lifepath, it enjoyed several hundred years of relative isolation before being stamped out brutally by Woder Broudan of the Konijkmener in 772 IS as part of his attempts to centralize the realm. With much of the faith destroyed and little interest or need for it in Chevalie, the Chevaliens soon after began their own process of rooting out the native faiths, though pockets have doggedly survived throughout the centuries."
 coast_rite_desc: "The 'Coast Path' is an exceptionally loose gathering of several dozen separate faiths that are native to the Konijkmener coasts as well as southeastern Chevalie. The fusing of native beliefs in oceanic and river based pantheons with the Lifepath, it enjoyed several hundred years of relative isolation before being stamped out brutally by Woder Broudan of the Konijkmener in 772 IS as part of his attempts to centralize the realm. With much of the faith destroyed and little interest or need for it in Chevalie, the Chevaliens soon after began their own process of rooting out the native faiths, though pockets have doggedly survived throughout the centuries."
 coast_rite_adj: "Coast Path"
 coast_rite_adherent: "Pathtreader"
 coast_rite_adherent_plural: "Pathtreaders"
 # Inner Path Rite #
 innerpath_rite: "Inner Path"
 innerpath_desc_with_gc: "The 'Inner Path' is actually a loose name for several versions of the Lifepath normally practiced in the more remote or rugged parts of [chevalie|E], primarily the mountainous interior where the last of the Gallicaders remain. Far looser in many rules and in nature than the mainstream Lifepath, it is the result of Lifepath preachers attempting to reconcile several native Gallicader beliefs with those of their faith.\n\nWhile it has slowly fallen out of favor and has been generally shunned out of Marcher society — especially after the general hostilities against factionalism in the faith following the War of the Heretic Princes — it is nonetheless still popular in some circles."
 innerpath_rite_desc: "The 'Inner Path' is actually a loose name for several versions of the Lifepath normally practiced in the more remote or rugged parts of Chevalie, primarily the mountainous interior where the last of the Gallicaders remain. Far looser in many rules and in nature than the mainstream Lifepath, it is the result of Lifepath preachers attempting to reconcile several native Gallicader beliefs with those of their faith.\n\nWhile it has slowly fallen out of favor and has been generally shunned out of Marcher society — especially after the general hostilities against factionalism in the faith following the War of the Heretic Princes — it is nonetheless still popular in some circles."
 innerpath_rite_adj: "Innerpath"
 innerpath_rite_adherent: "Pathtreader"
 innerpath_rite_adherent_plural: "Pathtreaders"
 ## Becledienism Faith ##
 becledienism: "Becledienism"
 becledienism_desc: "Becledienism is a Marcher belief system founded by the radical monk Urso Becledièvre during the 'War of the Heretic Princes' period of Chevalien history. Becledienism revolves around the concept that ones Lifepath is chosen at birth and not by the adherent's own self, and that a Wayfather must foretell the Path at birth by looking to the stars. Declared arch heresy at the Council of Ex along with the rest of the heresies spawned in the period, it nonetheless continued on for several decades after its compatriot heresies thanks to the relatively small number of (major) differences between the baseline faith."
 becledienism_adj: "Becledien"
 becledienism_adherent: "Becledite"
 becledienism_adherent_plural: "Becledites"
 
 # Becledien Rite Rite #
 becledien_rite: "Becledien Rite"
 becledien_desc_with_gc: "Founded on the claim that a path is not chosen but foretold, read at birth from the sky. Its wayfathers are less guides than interpreters, and they are not often thanked for what they read."
 becledien_rite_desc: "Founded on the claim that a path is not chosen but foretold, read at birth from the sky. Its wayfathers are less guides than interpreters, and they are not often thanked for what they read."
 becledien_rite_adj: "Becledien"
 becledien_rite_adherent: "Becledien"
 becledien_rite_adherent_plural: "Beclediens"
 ## Darrallianism Faith ##
 darrallianism: "Darrallianism"
 darrallianism_desc: "Founded by noblewoman turned preacher Cathrène den va Darrall, Darrallianism is an esoteric blend of beliefs centered around the 'Tripath'; a belief that the only Paths are those of War, Peace and Death. Darrall also claimed that Wayleaders should rule Chevalie as a [Concept( 'clerical_control_of_chevalie', 'theocratic class' )|E]. This and her belief that anyone could be a Wayleader led to many lords converting to establish power through divine right during the [war_of_the_heretic_princes|E]."
 darrallianism_adj: "Darrallianist"
 darrallianism_adherent: "Darrallianist"
 darrallianism_adherent_plural: "Darrallianists"
 
 # Darrallian Rite Rite #
 darrallian_rite: "Darrallian Rite"
 darrallian_desc_with_gc: "Three paths: peace, war and death, and a priesthood that lives in coven with its flock rather than above it."
 darrallian_rite_desc: "Three paths: peace, war and death, and a priesthood that lives in coven with its flock rather than above it."
 darrallian_rite_adj: "Darrallian"
 darrallian_rite_adherent: "Darrallian"
 darrallian_rite_adherent_plural: "Darrallians"
 ## Arderism Faith ##
 arderism: "Arderism"
 arderism_desc: "The iconoclastic Arderists (from the [Concept('marchers','Chevalien')|E] word for 'burning') see the idolization of spiritual entities (such as gods and waysaints) as the source of all [magic|E] (and [liches|E]). Led during the [war_of_the_heretic_princes|E] by the enigmatic '[Concept('the_black_monk','Black Monk')|E]', the burning of dozens of churches and hundreds of religious artifacts and its adoption by many warlords hoping to seize church lands is often credited for collapsing Raocourt's power in northern [chevalie|E]."
 arderism_adj: "Arderian"
 arderism_adherent: "Arderist"
 arderism_adherent_plural: "Arderists"
 
 # Arderist Rite Rite #
 arderist_rite: "Arderist Rite"
 arderist_desc_with_gc: "The burning creed holds that veneration of anything not of the material world is the wound through which evil entered, and that a path walked without idols is the only path that ends anywhere."
 arderist_rite_desc: "The burning creed holds that veneration of anything not of the material world is the wound through which evil entered, and that a path walked without idols is the only path that ends anywhere."
 arderist_rite_adj: "Arderist"
 arderist_rite_adherent: "Arderist"
 arderist_rite_adherent_plural: "Arderists"
 ## Saintsmarch Faith ##
 saintsmarch_faith: "Saintsmarch"
 saintsmarch_faith_desc: "The Saintsmarch is a revanchist movement founded by veteran [antimagi|E] turned prophet Wildermutt den va Seyseunns. Highly militaristic, adherents hold the [GetTrait('way_of_nullification_follower').GetName( GetNullCharacter )] and the [GetTrait('way_of_swords_follower').GetName( GetNullCharacter )] above all others and claim peace can only be found when all [magi|E] are dead. While briefly entertained by several lords, the [war_of_the_noose|E] would lead to the movement's decline and eventual collapse."
 saintsmarch_faith_adj: "Saintsmarcher"
 saintsmarch_faith_adherent: "Saintsmarcher"
 saintsmarch_faith_adherent_plural: "Saintsmarchers"
 
 # Saintsmarch Rite Rite #
 saintsmarch_rite: "Saintsmarch Rite"
 saintsmarch_desc_with_gc: "The militant path, which places the war of nullification above all other walking. It holds that the Marches cannot be at peace while a single magus draws breath, and it has never been talked out of this."
 saintsmarch_rite_desc: "The militant path, which places the war of nullification above all other walking. It holds that the Marches cannot be at peace while a single magus draws breath, and it has never been talked out of this."
 saintsmarch_rite_adj: "Saintsmarch"
 saintsmarch_rite_adherent: "Saintsmarcher"
 saintsmarch_rite_adherent_plural: "Saintsmarchers"
 ## Four Steps of Salvation Faith ##
 four_steps_of_salvation: "Four Steps of Salvation"
 four_steps_of_salvation_desc: "The Four Steps of Salvation was a heresy of the Lifepath formed in the mid 9th century by Chevalien aristocrat Thiscul den va Vescot. Salvationists preach that the four true paths are the Way of Pain, the Way of Blood, the Way of Dread, and the Way of Fear, and demanded of its followers everything from ritualized cannibalism to mass torture and murder indiscriminate of station, gender or age.\n\nAlways on the fringe, Salvationists entered the public eye after a string of brutal murders in [peti_gisredde|E], and briefly rose up in several cities before being brutally stomped down on by an inquisitorial force along with over a dozen knightly orders. Thiscul himself, along with his entire dynasty, was publically executed, and 'Thiscul' is now considered something akin to a heretical curse word in Chevalien society."
 four_steps_of_salvation_adj: "Four Steps of Salvation"
 four_steps_of_salvation_adherent: "Salvationist"
 four_steps_of_salvation_adherent_plural: "Salvationists"
 
 # Four Steps of Salvation Rite #
 four_steps_rite: "Four Steps of Salvation"
 four_steps_desc_with_gc: "Four steps, each one further from what the Lifepath was for. Its adherents hold that power is the only salvation and that the flesh of the faithful is a legitimate rung. Every other rite of the Lifepath calls it what it is."
 four_steps_rite_desc: "Four steps, each one further from what the Lifepath was for. Its adherents hold that power is the only salvation and that the flesh of the faithful is a legitimate rung. Every other rite of the Lifepath calls it what it is."
 four_steps_rite_adj: "Four Steps"
 four_steps_rite_adherent: "Ascendant"
 four_steps_rite_adherent_plural: "Ascendants"
 ## Conclave of Opakasija Faith ##
 conclave_of_opakhasia: "Conclave of Opakasija"
 conclave_of_opakhasia_desc: "Founded by Lifepather missionaries, the Conclave of Opakasija was officialy formed with the codification of the 'Eastern Paths'. A strange merging of pagan Sjalvolki myth and the Lifepaths of the Marchers, the Conclave of Opakasija preaches the existence of four distinct Lifepaths. The Path of the Hunt, focused on the improvement of one's inner self; the Path of the Sword, focused on practicing war and training the body; the Path of the Shepherd, focused on practicing peaceful pursuits and training the mind; and the Path of the Stars, focusing on magic and trickery.\n\nWhile initially seen as an odd but promising offshoot of the mainstream Marcher faith, with many expecting it to one day join proper northern dogma with the increasing of ties, the Entreatment of Ventell led to the Conclave of Opakasija being declared arch-heresy. With the breaking of ties, the southern worshippers formed their own Conclave to oppose the now antagonistic northerners, and the practices of the southern faith rapidly separated from mainstream Marcher rite."
 conclave_of_opakhasia_adj: "Conclave of Opakasija"
 conclave_of_opakhasia_adherent: "Opakasijan"
 conclave_of_opakhasia_adherent_plural: "Opakasijans"
 
 # Rite of Velos Rite #
 conclave_velos_rite: "Rite of Velos"
 conclave_velos_desc_with_gc: "$VELOS_GLOSS$"
 conclave_velos_rite_desc: "According to myth, it was Velos who first felt the light of the middle-realm. He was elected leader of the expedition by his siblings, who too were eager to leave Prohen's halls and quickly took up the mantle of chief god. To the Sjalvolki, Velos is a paternal figure who embodies the qualities which they value most, bravery, honesty and confidence. More than a mere hunting god, Velos is the guardian and protector of his people, his name envoked before honour duels, coronations or hunts in equal reverence. Perhaps his greatest achievement was the creation of the first bow, from the stolen hair of a Sky-God, knowledge which he granted mankind for their service in the war."
 conclave_velos_rite_adj: "Conclave of Opakasija"
 conclave_velos_rite_adherent: "Opakasijan"
 conclave_velos_rite_adherent_plural: "Opakasijans"
 # Rite of Prohen Rite #
 conclave_prohen_rite: "Rite of Prohen"
 conclave_prohen_desc_with_gc: "$PROHEN_GLOSS$"
 conclave_prohen_rite_desc: "It is austere Prohen who weaves and cuts our fates, according to the Sjalvolki. With his wife Marma he fathered the gods, Velos, Pekwon, Pekielo, Varpalis, Zamistra and Ureha but instead of searching for new lands with his children, he travelled further underground below the halls in which souls go to rest. He is absent in most Sjalvolki legends, due to his seclusion but when he does appear he  is described as a blind hermit, his skin as pale as chalk and with hair that reaches his feet. Due to his enigmatic powers within Sjalvolki mythology, some consider him to be their true chief god, most notably the Gruelokin who dedicate various rituals and festivals to the Old Weaver."
 conclave_prohen_rite_adj: "Conclave of Opakasija"
 conclave_prohen_rite_adherent: "Opakasijan"
 conclave_prohen_rite_adherent_plural: "Opakasijans"
 # Rite of Marma Rite #
 conclave_marma_rite: "Rite of Marma"
 conclave_marma_desc_with_gc: "$MARMA_GLOSS$"
 conclave_marma_rite_desc: "Mother of the Gods and wife of the Old Weaver Prohen, Marma is often interchangeable with Aeras itself. Her nature is tempremental, responsible for bountiful harvests and devastating famine, those who mistreat her great domain are doomed to suffer the consequences. Like her husband, she did not fight alongside her children in the war with the Sky-Gods and hence is largely indifferent to the lives of men, despite this many rituals are dedicated to her in attempt to gain her affection."
 conclave_marma_rite_adj: "Conclave of Opakasija"
 conclave_marma_rite_adherent: "Opakasijan"
 conclave_marma_rite_adherent_plural: "Opakasijans"
 # Rite of Ureha Rite #
 conclave_ureha_rite: "Rite of Ureha"
 conclave_ureha_desc_with_gc: "$UREHA_GLOSS$"
 conclave_ureha_rite_desc: "Ureha, the youngest sibling and only sister of Velos is one of the most important figures in the whole of Sjalvolki mythology. Disturbed by the constant fighting between her brothers, over how the world should be formed, she decided to make more amiable company. So with her own hands, the first humans were sculpted. But soon after, the other gods began to use her creations in their own quarrels. So distraught with the violence which befell her people, she fled to lands which had yet been seen. Unbeknownst to her however, she was watched by the callous Sky-Gods and so from above she was taken to dwell among the clouds. So distracted were her brothers that mountains moved before they noticed her absence. By this time, she had grown accustomed to her new home but still harboured a longing for the land below the sky.\n\nA brutal yet inconclusive war between the Sky-Gods and the Earth-Gods was fought, where mankind was instrumental. It was agreed however, that Ureha may spend half the year in the Sky-Realm and the other half below. Her arrival in the Middle-Realm is marked by the largest of the Sjalvolki's festivals, celebrating the coming of Spring."
 conclave_ureha_rite_adj: "Conclave of Opakasija"
 conclave_ureha_rite_adherent: "Opakasijan"
 conclave_ureha_rite_adherent_plural: "Opakasijans"
 # Rite of Pekielo Rite #
 conclave_pekielo_rite: "Rite of Pekielo"
 conclave_pekielo_desc_with_gc: "$PEKIELO_GLOSS$"
 conclave_pekielo_rite_desc: "Blinded in the War with Sky-Gods, Pekielo dedicated himself to the pursuit of knowledge. The raven Norus, who knows of all events that have transpired since the dawn of time, whispers into his left ear. Meanwhile, in his right whispers the owl Nora, who knows all that is yet to come. Pekielo has no control over the past or future but instead catalogues it in his 'Book of Days', its contents and location a mystery that not even Velos himself knows. In one Saga, a shaman attempts to find the fabled tome and, against all odds, he is able to locate the cave in which Pekielo resides. To his utmost surprise, the deity hands him the book with no hesitation whatsoever. However, upon reading even a few pages he is overcome with such dread that he resorted to clawing his own eyes out in desperation, his mind so warped that his words became maddened screams."
 conclave_pekielo_rite_adj: "Conclave of Opakasija"
 conclave_pekielo_rite_adherent: "Opakasijan"
 conclave_pekielo_rite_adherent_plural: "Opakasijans"
 # Rite of Zamistra Rite #
 conclave_zamistra_rite: "Rite of Zamistra"
 conclave_zamistra_desc_with_gc: "$ZAMISTRA_GLOSS$"
 conclave_zamistra_rite_desc: "Youngest of the Sons of Prohen, Zamistra is worshipped for his sharp mind rather than blade. Often depicted as a travelling bard, it is the role of a Sjalvolki to always welcome strangers into their home in case it may be Zamistra himself. He is credited as the first poet, a skill he taught the Sjalvolki people. Zamistra is often shown as a trickster, preferring cloak and dagger to the typical honest and headstrong solutions of the Sjalvolki. This puts him at odds with many of the virtues which his followers hold dear, making him particularly popular with those who fall outside the usual confines of Sjalvolki society such as merchants and Magi."
 conclave_zamistra_rite_adj: "Conclave of Opakasija"
 conclave_zamistra_rite_adherent: "Opakasijan"
 conclave_zamistra_rite_adherent_plural: "Opakasijans"
 # Rite of Varpalis Rite #
 conclave_varpalis_rite: "Rite of Varpalis"
 conclave_varpalis_desc_with_gc: "$VARPALIS_GLOSS$"
 conclave_varpalis_rite_desc: "Humble Varpalis is thought to inhabit all the lakes, rivers and waterways which crisscross the Sjalvolki homeland. It is the duty of Sjalvolki anglers to leave an offering or portion of their catch to Varpalis, so that he may replenish the waters in which they fish. He prepares those unable to be buried for the afterlife and transforms stillborns and children who die young, into otters who are said to look over their families. Despite this, women are taught not to bath in water alone as Varpalis has a reputation as a lecher, father of many of the demi-gods of Sjalvolki myth."
 conclave_varpalis_rite_adj: "Conclave of Opakasija"
 conclave_varpalis_rite_adherent: "Opakasijan"
 conclave_varpalis_rite_adherent_plural: "Opakasijans"

