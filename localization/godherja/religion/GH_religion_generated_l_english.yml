 ## Beshashuriyya Faith ##
 beshashuriyya_faith: "Beshashuriyya"
 beshashuriyya_faith_desc: "A philosophical, political, and religious movement centered around the figure of Ishtabima Mamura, who served as a general and bodyguard under first Sanad and briefly her husband Tathtali. In the generations since her death, Ishtabima's life and military career saw her elevated to near-sainthood amongst the Beshashuriyya, who view her as a paragon of martial honor and fidelity. Notably, the Beshashuriyya strive to approach martial pursuits in the same way scholars and legalists pursue their own fields. Many outside the sect consider this to be an absurd justification for raising a (likely) lowborn woman to a nearly divine status."
