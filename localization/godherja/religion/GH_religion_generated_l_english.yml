 ## Ahlēt al-Wēdi Faith ##
 ritualist_esoterist_faith: "Ahlēt al-Wēdi"
 ritualist_esoterist_faith_desc: "The Wēdiyyīn descend from the old faiths of the [Glossary('Khenem Valley','khenemhat_encyclopedia_desc')], grouped under [Concept('ritualism','Ritualism')|E] for the (sometimes loose) place [GetBuilding('01_sophocos').GetName] holds in their beliefs and the practices they have adopted from mainline Ritualists over millennia, a kinship both sides have been quick to invoke whenever it served them."
