 ## Kao'sahetam Faith ##
 kaosahetam_faith: "Kao'sahetam"
 kaosahetam_faith_desc: "The Kao'sahetami believe that every person is born possessing a set amount of "Kao" or "Fortune" inside their spirit, which is increased by performing good deeds and reduced when engaging in evil acts. Those with great amounts of Kao are blessed with good luck in their endeavors, while those that are lacking are mired in misfortune. The Kao'sahetami also make use of divination, using the motions and actions of crabs to gauge a person's Kao. The more skilled diviners are said to be able to use the crabs' movement to see the truth of the past, and even predict future events."
 kaosahetam_faith_adj: "Kao'sahetami"
 kaosahetam_faith_adherent: "Kao'sahetami"
 kaosahetam_faith_adherent_plural: "Kao'sahetami"
 
