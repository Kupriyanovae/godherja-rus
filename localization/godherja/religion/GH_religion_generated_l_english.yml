 sarridian_reformism_rite_desc: "Gurdurbok may have fallen to the knives of his treacherous brother and father of the Black Mountain Imperials, King Nicanoneus, but the generations of Sarridians who followed him and took up control of their homeland in the wake of the Imperial collapse would be inspired to build a new and better world that no Sarridian before their first true king had ever imagined.\n\nUnited in purpose and spirit, the new Sarridian nobility has encouraged the spread of their newly 'created' language (largely a fusion of Aversarian, Marcher, Rekvolki and real and imagined traditional Sarridian glyphs) and of an eclectic array of burgeoning new art forms and literary traditions.\n\nThe faith, likewise, has formed into an anachronistic vision of the old and an excited energy for the future. While largely based off of the traditions and priestly structures of the old Aagiokrata, the Sarridians have proven just as enthusiastic at building the new faith as their new language. While other remnants of the Old Empire have become trapped in bitter fighting over Imperial legacy, the Sarridians have shown themeslves more than willing to wholly invent new pillars of the faith and discard those that do not fit. The new 'Free Aagiokratan Conclave of the Sarridian Cults' has already established a unique priestly structure and system of religious practice unseen anywhere else on Aeras, and the faith has proven one of the most dynamic. Every day there seems to be new practices and agreements to discard the old, and as literacy continues to spread across the Black Mountains the spread of ideas has only hastened."
