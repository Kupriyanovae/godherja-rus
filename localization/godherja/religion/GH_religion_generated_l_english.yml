 ## Saldhaari'a Faith ##
 ritualist_saldhaarist_faith: "Saldhaari'a"
 ritualist_saldhaarist_faith_desc: "Centered on the writings of the Magi-philosopher Saldhaar the Wise, the faith holds that in ancient times, philosophers were blessed with great wisdom and powers that could manipulate the world around them, but as time passed this ability degenerated into a chaotic form known as magic."
 ritualist_saldhaarist_faith_adj: "Saldhaari"
 ritualist_saldhaarist_faith_adherent: "Saldhaari"
 ritualist_saldhaarist_faith_adherent_plural: "Saldhaariyyīn"
 
 # Ataabay Zatanai Rite #
 ataabay_zatanai_rite: "Ataabay Zatanai"
 ataabay_zatanai_desc_with_gc: "The Followers of Zatani'a adhere to the teachings of the Ritualist prophet Zatanai, who received his revelations from [GetBuilding('01_sophocos').GetName] at just seventeen years of age. Zatanai, though young, was a fierce orator who stated that the [Concept('wardenism','Wardenites')|E] must be destroyed utterly, and that anyone who rejected the truths of [GetBuilding('01_sophocos').GetName] should be slain as an enemy of mankind. Though it was not originally meant to be a permanent sect, Zatanai incorporated elements of the Suleimani'a sect into his own, chiefly the belief in Domah Daniyal and the view that all philosophies can be learned from, though Zatanai rejected the idea that non-Ritualist philosophies have any merit. Zatanai and his followers believe that Ritualism is the one and only way of life for mankind; all other religions are mere perversions of Ritualism, and so must either be assimilated if possible or destroyed if not. Zatanai was one of the youngest Ritualist prophets in the religion's history, and he entered into occultation at nineteen years of age after declaring that he would return when his people needed him most."
 ataabay_zatanai_rite_desc: "The Followers of Zatani'a adhere to the teachings of the Ritualist prophet Zatanai, who received his revelations from Sophocos at just seventeen years of age. Zatanai, though young, was a fierce orator who stated that the Wardenites must be destroyed utterly, and that anyone who rejected the truths of Sophocos should be slain as an enemy of mankind. Though it was not originally meant to be a permanent sect, Zatanai incorporated elements of the Suleimani'a sect into his own, chiefly the belief in Domah Daniyal and the view that all philosophies can be learned from, though Zatanai rejected the idea that non-Ritualist philosophies have any merit. Zatanai and his followers believe that Ritualism is the one and only way of life for mankind; all other religions are mere perversions of Ritualism, and so must either be assimilated if possible or destroyed if not. Zatanai was one of the youngest Ritualist prophets in the religion's history, and he entered into occultation at nineteen years of age after declaring that he would return when his people needed him most."
