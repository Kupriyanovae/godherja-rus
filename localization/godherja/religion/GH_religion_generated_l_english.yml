 ## Elaahism Faith ##
 elaahism_faith: "Elaahism"
 elaahism_faith_desc: "The Elaahi are one of the few Amsari sects that maintained their own beliefs for centuries after the [Concept('gh_the_amsari_prophet','Prophet')|E]'s death and the formation of the Hiklahn. They reject the very story of creation and the [gh_amsari_story_first_struggle|E] as described in the [gh_zenda|E]. Believing Belruk's actions to have been misunderstood and instead that Iralya was an agent of Maiya, leading the [gh_amsari_first_dreamers|E] astray from Zaoran. As such, they consider The Prophet to have reinforced a corrupted version of faith, one that fails to recognize the true struggle against deception and falsehood. The Elaahi hold that true faith in Zaoran requires rejecting the lies imposed upon the world since the First Struggle."
 elaahism_faith_adj: "Elaahi"
 elaahism_faith_adherent: "Elaahan"
 elaahism_faith_adherent_plural: "Elaahi"
 
