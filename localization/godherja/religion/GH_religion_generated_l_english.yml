### Sjalvolki Religion ###
 sjalvolki_religion: "Sjalvolki"
 sjalvolki_religion_adj: "Sjalvolki"
 sjalvolki_religion_adherent: "Sjalvolk"
 sjalvolki_religion_adherent_plural: "Sjalvolki"
 sjalvolki_religion_desc: "According to Sjalvolki teachings, when the world was made and humanity was born from the soil, the gods created gifts for them. [Glossary('Varpalis','VARPALIS_GLOSS')] created the fish of the sea, [Glossary('Ureha','UREHA_GLOSS')] created the plants of the soil, [Glossary('Zamistra','ZAMISTRA_GLOSS')] created the wily beasts of the land, and [Glossary('Pekielo','PEKIELO_GLOSS')] created the birds of the sky. But [Glossary('Pekwon','PEKWON_GLOSS')], in his cruelty, gave the 'gift' of hunger and misery to humanity. The final one to give a gift was [Glossary('Velos','VELOS_GLOSS')], so he taught them how to hunt and kill the animals around them."
