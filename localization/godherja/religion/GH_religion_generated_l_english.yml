 # Khebarānism Rite #
 khebaranism_rite: "Khebarānism"
 khebaranism_desc_with_gc: "Khebarāni believe that the teachings of the $amsari_prophet_link$ Prophet#! conceal deeper truths, accessible only to those with the wisdom to perceive them. To them, the [gh_zenda|E] is layered, and what is forbidden to the ignorant may be permitted to the enlightened if it serves a higher purpose. This has led to unorthodox interpretations of religious law, where morality is dictated by wisdom rather than rigid doctrine. Khebarānism flourished for some time in Western Siral, despite facing harsh persecution from orthodox [Concept('gh_frazan','Frazani')|E], who condemn its teachings as dangerous heresy."
 khebaranism_rite_desc: "Khebarāni believe that the teachings of the Prophet conceal deeper truths, accessible only to those with the wisdom to perceive them. To them, the Zenda is layered, and what is forbidden to the ignorant may be permitted to the enlightened if it serves a higher purpose. This has led to unorthodox interpretations of religious law, where morality is dictated by wisdom rather than rigid doctrine. Khebarānism flourished for some time in Western Siral, despite facing harsh persecution from orthodox Frazani, who condemn its teachings as dangerous heresy."
