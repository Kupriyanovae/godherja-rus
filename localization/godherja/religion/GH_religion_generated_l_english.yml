 ## Cult of the Falamai Faith ##
 deep_one_cult: "Cult of the Falamai"
 deep_one_cult_desc: "'The powers of the deep are myriad in their forms and cruelties, but it is to them that worship must be given, as their power is second to none.' So it was taught to the Falamai by the [Concept('hameh','Viridiscent Prophet')|E]. The cultists are notorious for slaying those they meet at sea, taking the occasional captive to use in a profane ritual that turns them into conduits to converse with the gods beneath."
