 ## Wahaydi'a Faith ##
 ritualist_wahaydia_faith: "Wahaydi'a"
 ritualist_wahaydia_faith_desc: "A ritualist faith that has syncretized with [Concept('wardenism','Wardenism')|E] or rejects taking part in [war_in_heaven|E]. Arguing that both faiths can coexist together as one, their theology share the concept of the al-Wahayd, the One. Though he takes different roles as per each rites, the One is He who unites and links both Wardenite and Ritualist."
 ritualist_wahaydia_faith_adj: "Wahaydi"
 ritualist_wahaydia_faith_adherent: "Wahaydi"
 ritualist_wahaydia_faith_adherent_plural: "Wahaydiyyīn"
 
 # Tarriaq al-Wahayd Rite #
 tarriaq_al_wahayd_rite: "Tarriaq al-Wahayd"
 tarriaq_al_wahayd_desc_with_gc: "The Road of the One was founded by a prophetess named Hanaa, a woman born under [Concept('wardenism','Wardenite')|E] rule. Hanaa was born a Ritualist, but fraternized extensively with Wardenites. Attaining an understanding of Wardenite beliefs, and sympathizing with the Wardenite cause, Hanaa was said to have been given a revelation when she ascended the steps of [GetBuilding('01_sophocos').GetName], warning her that the physical world was created by a malevolent demiurge, and that this demiurge's servants must be combated whenever possible. Only through its annihilation can mortals be freed from the shackles of physical existence and dwell eternally in the Gardens of Life. Hanaa also preached that there was but one god, and that this god was named the One. The One commanded the Ritualists to battle the demiurge long ago, but these prophets were misinterpreted or slain by their followers; therefore, the One gave a revelation unto the first of the Wardenites, and abandoned the Ritualists. But if the Ritualists heed Hanaa, and live according to the Road of the One — a list of laws delivered to Hanaa — the One will favor them again."
