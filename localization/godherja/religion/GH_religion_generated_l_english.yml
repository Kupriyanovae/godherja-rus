 mezrai_rite_adherent_plural: "Mezra'īsi"
 # Hazrandānism Rite #
 hazrandanism_rite: "Hazrandānism"
 hazrandanism_desc_with_gc: "Once among the most popular movement following the $amsari_prophet_link$ Prophet's#! death and some time after the establishment of the Amsari Hiklahn, Hazrandānism rejects written scriptures, believing that they distort the eternal and adaptable nature of divine truth. To the Hazrandāni, faith must be preserved through oral tradition, as the evolution of language and personal understanding is essential to keeping its true meaning alive. Over time, the movement suffered steep decline, facing repression from the [Concept('gh_frazan','Frazani')|E], who viewed its teachings as a direct threat to the integrity of the Prophet's message. Now, only small and scattered communities continue to uphold its traditions."
