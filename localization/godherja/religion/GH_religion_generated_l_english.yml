 # Kamayedi'a Rite #
 kamayed_rite: "Kamayedi'a"
 kamayed_desc_with_gc: "The Kamayediyyīn believe that the Thousand-and-One Steps of [GetBuilding('01_sophocos').GetName] are indeed a literal place, but not at the great [Concept('the_towers','Tower')|E] that is usually described as their location in Sophocist folklore. Instead, they claim that the steps are a location of descent into a great crater 'beyond the north stars'. This crater, they insist, is the doorway to the afterlife, and those who are worthy enough to reach the bottom may enter into the realm of the gods."
 kamayed_rite_desc: "The Kamayediyyīn believe that the Thousand-and-One Steps of Sophocos are indeed a literal place, but not at the great Tower that is usually described as their location in Sophocist folklore. Instead, they claim that the steps are a location of descent into a great crater 'beyond the north stars'. This crater, they insist, is the doorway to the afterlife, and those who are worthy enough to reach the bottom may enter into the realm of the gods."
 kamayed_rite_adj: "Kamayedi"
 kamayed_rite_adherent: "Kamayedi"
 kamayed_rite_adherent_plural: "Kamayediyyīn"
 # Saqādiri'a Rite #
 saqadiri_rite: "Saqādiri'a"
 saqadiri_desc_with_gc: "Although the Saqādiriyyīn reject the notion that the 1,001 rituals can bring divine revelations when performed away from the Thousand-and-One Steps of [GetBuilding('01_sophocos').GetName], they nevertheless encourage their memorisation as a means of maintaining a connection with the faith."
 saqadiri_rite_desc: "Although the Saqādiriyyīn reject the notion that the 1,001 rituals can bring divine revelations when performed away from the Thousand-and-One Steps of Sophocos, they nevertheless encourage their memorisation as a means of maintaining a connection with the faith."
 saqadiri_rite_adj: "Saqādiri"
 saqadiri_rite_adherent: "Saqādiri"
 saqadiri_rite_adherent_plural: "Saqādiriyyīn"
 # Thamāqiri'a Rite #
 thamaqiri_rite: "Thamāqiri'a"
 thamaqiri_desc_with_gc: "The Thamāqiriyyīn reject the notion that the 1,001 rituals can be performed anywhere other than at the Thousand-and-One Steps of [GetBuilding('01_sophocos').GetName]. They consider any attempt to perform them elsewhere a profanation of the rituals themselves, and consequently regard other [Concept('ritualism','Ritualists')|E] who do so as outright unbelievers."
 thamaqiri_rite_desc: "The Thamāqiriyyīn reject the notion that the 1,001 rituals can be performed anywhere other than at the Thousand-and-One Steps of Sophocos. They consider any attempt to perform them elsewhere a profanation of the rituals themselves, and consequently regard other Ritualists who do so as outright unbelievers."
 thamaqiri_rite_adj: "Thamāqiri"
 thamaqiri_rite_adherent: "Thamāqiri"
 thamaqiri_rite_adherent_plural: "Thamāqiriyyīn"
 # Sajmaari'a Rite #
 sajmaari_rite: "Sajmaari'a"
 sajmaari_desc_with_gc: "The Sajmaariyyīn believe that the Thousand-and-One Steps of [GetBuilding('01_sophocos').GetName] must be undertaken by a group of exactly 1,001 adults, each responsible for performing one of the 1,001 rituals without error. In preparation for their ascent, the pilgrims form a community and live together for a month. They believe that the fate of each of the faithful is bound to that of the others, and that a single mistake may doom them all. Every member is therefore expected to watch over and care for their companions."
 sajmaari_rite_desc: "The Sajmaariyyīn believe that the Thousand-and-One Steps of Sophocos must be undertaken by a group of exactly 1,001 adults, each responsible for performing one of the 1,001 rituals without error. In preparation for their ascent, the pilgrims form a community and live together for a month. They believe that the fate of each of the faithful is bound to that of the others, and that a single mistake may doom them all. Every member is therefore expected to watch over and care for their companions."
 sajmaari_rite_adj: "Sajmaari"
 sajmaari_rite_adherent: "Sajmaari"
 sajmaari_rite_adherent_plural: "Sajmaariyyīn"
 # Tasaawi'a Rite #
 tasaawism_rite: "Tasaawi'a"
 tasaawism_desc_with_gc: "The Tasaawiyyīn hold that every [Concept('the_towers','Tower')|E] is [GetBuilding('01_sophocos').GetName], and that the one in [Glossary('Kharadamat','kharadamat_encyclopedia_desc')], traditionally worshipped by [Concept('ritualism','Ritualists')|E], is but one among many equal manifestations. Other Ritualists, they claim, are mistaken in placing a single tower above the rest, for Sophocos is manifest across [aeras|E] so that all believers may be within sight of one."
 tasaawism_rite_desc: "The Tasaawiyyīn hold that every Tower is Sophocos, and that the one in Kharadamat, traditionally worshipped by Ritualists, is but one among many equal manifestations. Other Ritualists, they claim, are mistaken in placing a single tower above the rest, for Sophocos is manifest across Aeras so that all believers may be within sight of one."
 tasaawism_rite_adj: "Tasaawi"
 tasaawism_rite_adherent: "Tasaawi"
 tasaawism_rite_adherent_plural: "Tasaawiyyīn"
 ## Abaraji'a Faith ##
 ritualist_abarajism_faith: "Abaraji'a"
 ritualist_abarajism_faith_desc: "The Abarajiyyīn believe that [GetBuilding('01_sophocos').GetName] stands in many places across [aeras|E], each worthy of worship to one extent or another."
 ritualist_abarajism_faith_adj: "Abaraji"
 ritualist_abarajism_faith_adherent: "Abaraji"
 ritualist_abarajism_faith_adherent_plural: "Abarajiyyīn"
 
 # Tarriaq al-Asal Rite #
 tarriaq_al_asal_rite: "Tarriaq al-Asal"
 tarriaq_al_asal_desc_with_gc: "The Asaliyyīn recognize the other [Concept('the_towers','Towers')|E] scattered across [aeras|E] as legitimate sites of worship, but maintain that none can equal [GetBuilding('01_sophocos').GetName]. They believe it to be the birthplace of [ritualism|E] and the first and greatest of all Towers. Although worship may be offered at any of them, none is held in such reverence as the one in [Glossary('Kharadamat','kharadamat_encyclopedia_desc')]."
 tarriaq_al_asal_rite_desc: "The Asaliyyīn recognize the other Towers scattered across Aeras as legitimate sites of worship, but maintain that none can equal Sophocos. They believe it to be the birthplace of Ritualism and the first and greatest of all Towers. Although worship may be offered at any of them, none is held in such reverence as the one in Kharadamat."
 tarriaq_al_asal_rite_adj: "Asali"
 tarriaq_al_asal_rite_adherent: "Asali"
 tarriaq_al_asal_rite_adherent_plural: "Asaliyyīn"
 ## Ruhwaadi'a Faith ##
 ritualist_ruhwaadist_faith: "Ruhwaadi'a"
 ritualist_ruhwaadist_faith_desc: "The Ruhwaadiyyīn are followers of Ruhwaad ibn Hasil, once a Tasaawi. Having made pilgrimages to many [Concept('the_towers','Towers')|E] in his youth, Ruhwaad is said to have received a revelation that [GetBuilding('01_sophocos').GetName] is alive, and that it alone among the Towers of [aeras|E] has remained so. Though ostracized by his own family, Ruhwaad would quickly gain many followers in his lifetime."
 ritualist_ruhwaadist_faith_adj: "Ruhwaadi"
 ritualist_ruhwaadist_faith_adherent: "Ruhwaadi"
 ritualist_ruhwaadist_faith_adherent_plural: "Ruhwaadiyyīn"
 
 # Hayaali'a Rite #
 hayaaliyya_rite: "Hayaali'a"
 hayaaliyya_desc_with_gc: "The Hayaaliyyīn adhere to the teachings of Ruhwaad ibn Hasil. They point to [GetBuilding('01_sophocos').GetName] being the only [Concept('the_towers','Tower')|E] that people can safely approach as proof that it alone remains alive, while the others are dead. Over time, their worship has come to combine traditional [Concept('ritualism','Ritualist')|E] practices with more unorthodox rituals that they claim were taught by Ruhwaad himself."
 hayaaliyya_rite_desc: "The Hayaaliyyīn adhere to the teachings of Ruhwaad ibn Hasil. They point to Sophocos being the only Tower that people can safely approach as proof that it alone remains alive, while the others are dead. Over time, their worship has come to combine traditional Ritualist practices with more unorthodox rituals that they claim were taught by Ruhwaad himself."
 hayaaliyya_rite_adj: "Hayaali"
 hayaaliyya_rite_adherent: "Hayaali"
 hayaaliyya_rite_adherent_plural: "Hayaaliyyīn"
 # Khudaami'a Rite #
 khudaamiyya_rite: "Khudaami'a"
 khudaamiyya_desc_with_gc: "The Khudaamiyyīn interpret the teachings of Ruhwaad ibn Hasil as requiring them to tend to [GetBuilding('01_sophocos').GetName] as one would a living person, pouring offerings of water upon its steps, washing it and climbing in silence so as not to disturb its rest. Other [Concept('ritualism','Ritualists')|E] dismiss these practices as an absurd anthropomorphization of Sophocos, yet to the Khudaamiyyīn, its death would mean the end of all worship, for without the last living tower, there would be no means of reaching the divine."
 khudaamiyya_rite_desc: "The Khudaamis interpret the teachings of Ruhwaad ibn Hasil as requiring them to tend to Sophocos as one would a living person, pouring offerings of water upon its steps, washing it and climbing in silence so as not to disturb its rest. Other Ritualists dismiss these practices as an absurd anthropomorphization of Sophocos, yet to the Khudaamiyyīn, its death would mean the end of all worship, for without the last living tower, there would be no means of reaching the divine."
 khudaamiyya_rite_adj: "Khudaami"
 khudaamiyya_rite_adherent: "Khudaami"
 khudaamiyya_rite_adherent_plural: "Khudaamiyyīn"
 ## Omahyyini'a Faith ##
 ritualist_omahyyinist_faith: "Omahyyini'a"
 ritualist_omahyyinist_faith_desc: "The Omahyyiniyyīn follow the teachings of the [Concept('ritualism','Ritualist')|E] prophet Omahyyin ibn Sashil, and are divided between those who hold to his original teachings and those who follow the later revelations granted to him at the summit of [GetBuilding('01_sophocos').GetName]. Though the two sects stand opposed, Omahyyin is in practice still recognized as the prophet of both."
 ritualist_omahyyinist_faith_adj: "Omahyyini"
 ritualist_omahyyinist_faith_adherent: "Omahyyini"
 ritualist_omahyyinist_faith_adherent_plural: "Omahyyiniyyīn"
 
 # Euruji'a Rite #
 eurujiyya_rite: "Euruji'a"
 eurujiyya_desc_with_gc: "The Eurujiyyīn follow the later revelations of the [Concept('ritualism','Ritualist')|E] prophet Omahyyin ibn Sashil, granted to him when he was carried by angels to the summit of [GetBuilding('01_sophocos').GetName]. There, the angels revealed that his earlier teachings were the work of evil beings who sought to reach the surface of [aeras|E]. Omahyyin thus came to oppose the Eamiqiyyīn, a sect he had himself established, and turned with his disciples against those who still held to his former teachings, even fighting alongside the [Concept('wardenism','Wardenites')|E]. Though the two sects stand opposed, Omahyyin is in practice still recognized as the prophet of both."
 eurujiyya_rite_desc: "The Eurujiyyīn follow the later revelations of the Ritualist prophet Omahyyin ibn Sashil, granted to him when he was carried by angels to the summit of Sophocos. There, the angels revealed that his earlier teachings were the work of evil beings who sought to reach the surface of Aeras. Omahyyin thus came to oppose the Eamiqiyyīn, a sect he had himself established, and turned with his disciples against those who still held to his former teachings, even fighting alongside the Wardenites. Though the two sects stand opposed, Omahyyin is in practice still recognized as the prophet of both."
 eurujiyya_rite_adj: "Euruji"
 eurujiyya_rite_adherent: "Euruji"
 eurujiyya_rite_adherent_plural: "Eurujiyyīn"
 # Eamiqi'a Rite #
 eamiqiyya_rite: "Eamiqi'a"
 eamiqiyya_desc_with_gc: "The Eamiqiyyīn hold to the original teachings of their founder, Omahyyin ibn Sashil, who taught that the visible [GetBuilding('01_sophocos').GetName] is but a reflection of its true, inverted counterpart buried beneath the surface, and that the faithful must dig deep in search of it. Omahyyin's later revelations did little to sway them. To the Eamiqiyyīn, the prophet who returned from Sophocos was an impostor wearing their prophet's skin, while the real Omahyyin had died."
 eamiqiyya_rite_desc: "The Eamiqiyyīn hold to the original teachings of their founder, Omahyyin ibn Sashil, who taught that the visible Sophocos is but a reflection of its true, inverted counterpart buried beneath the surface, and that the faithful must dig deep in search of it. Omahyyin's later revelations did little to sway them. To the Eamiqiyyīn, the prophet who returned from Sophocos was an impostor wearing their prophet's skin, while the real Omahyyin had died."
 eamiqiyya_rite_adj: "Eamiqi"
 eamiqiyya_rite_adherent: "Eamiqi"
 eamiqiyya_rite_adherent_plural: "Eamiqiyyīn"
 ## Ataabay Malaiki al-Sophocos Faith ##
 ritualist_malaikist_faith: "Ataabay Malaiki al-Sophocos"
 ritualist_malaikist_faith_desc: "Rejecting the worship of divinities, whose existence they either deny or consider irrelevant to humanity, the Malaikiyyīn instead worship the angels said to dwell in and around [GetBuilding('01_sophocos').GetName], who they believe guide mortals and intervene in their lives."
 ritualist_malaikist_faith_adj: "Malaiki"
 ritualist_malaikist_faith_adherent: "Malaiki"
 ritualist_malaikist_faith_adherent_plural: "Malaikiyyīn"
 
 # Sabiat al-Malaikiya Rite #
 sabiat_al_malaikiya_rite: "Sabiat al-Malaikiya"
 sabiat_al_malaikiya_desc_with_gc: "The Sabiat al-Malaikiya was founded by the prophetess Sirhaba bint Shikhiraat, who reputedly ascended the steps of [GetBuilding('01_sophocos').GetName] and was greeted by a host of angels who were horrible to behold and whose voices caused men to enter into convulsions. Sirhaba was accompanied by a band of other Ritualists who reported seeing the angels as well. Speaking to their prophetess, the angels commended the Ritualists for their devotion to [GetBuilding('01_sophocos').GetName], and gave Sirhaba a revelation: the gods and goddesses of this world were but masks worn by the angels of [GetBuilding('01_sophocos').GetName], and each religion was but another path to enlightenment. She was therefore charged with delivering peace to men, to cease the endless wars of Sarradon and bring an understanding between Ritualist and Wardenite, and then to spread this message of peace to the world entire. She and her new converts called themselves the Tribe of the Angels, and set about spreading this message of coexistence."
 sabiat_al_malaikiya_rite_desc: "The Sabiat al-Malaikiya was founded by the prophetess Sirhaba bint Shikhiraat, who reputedly ascended the steps of Sophocos and was greeted by a host of angels who were horrible to behold and whose voices caused men to enter into convulsions. Sirhaba was accompanied by a band of other Ritualists who reported seeing the angels as well. Speaking to their prophetess, the angels commended the Ritualists for their devotion to Sophocos, and gave Sirhaba a revelation: the gods and goddesses of this world were but masks worn by the angels of Sophocos, and each religion was but another path to enlightenment. She was therefore charged with delivering peace to men, to cease the endless wars of Sarradon and bring an understanding between Ritualist and Wardenite, and then to spread this message of peace to the world entire. She and her new converts called themselves the Tribe of the Angels, and set about spreading this message of coexistence."
