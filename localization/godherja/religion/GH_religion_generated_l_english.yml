 ## Kothori'a Faith ##
 kothori_faith: "Kothori'a"
 kothori_faith_desc: "A melding of [Concept('wardenism','Wardenite')|E] religious practices with some traditions endemic to the Tarsanides mountains, Kothori'a brings a number of ancient gods from the old Barzawa pantheons into the faith as either benevolent spiritual guardians or saints, with the first group often incarnating as important judges, and the latter often ascending upon death to join to a near-divine status. This is naturally quite scandalous to the broader Wardenite faith, which is noted for a distinct anti-theist stance, but the Kothorites have always skirted suppression largely due to the remoteness of their mountainous homes, and the relative obscurity of their rural faith."
