 ## Bekashai Faith ##
 bekashai_faith: "Bekashai"
 bekashai_faith_desc: "The Bekashai hold that those who slew the Most High must be brought to justice, believing that only through attaining revenge can His body be found. They have refocused their efforts to search the world, ignoring the quest for His body itself and instead seeking out His killers, hoping to one day avenge their ancient sin. A variety of theories as to His death have been proposed, but most tend to simply blame one's current enemies for the long-ago tragedy."
 bekashai_faith_adj: "Bekashai"
 bekashai_faith_adherent: "Bekashai"
 bekashai_faith_adherent_plural: "Bekashai"
 
