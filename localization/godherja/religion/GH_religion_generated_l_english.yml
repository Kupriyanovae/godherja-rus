 ## The Black Fraternity Faith ##
 black_fraternity_faith: "The Black Fraternity"
 black_fraternity_faith_desc: "'The blood of the weak will sow the land of pure souls.'\n\nSuch is the mantra of the Black Practitioners. Composed of the vilest [Concept('aversaria','Aversarian')|E] [magi|E], the Black Practitioners, part of the Black Fraternity, dedicate themselves to one goal only: the casting of the Kusnamenoi, the spell to warp the world and create for themselves a new paradise above it all.\n\nHaving aroused moral distaste even amongst fellow Aversarians, the Black Practitioners are forced to lay low, their influence mostly concentrated in isolated villages and settlements where they have consolidated their power following the Aversarian collapse. In these villages, no Gods are known but the Magi; these conditions have given way to an acquisitive system of worship focusing on whichever Magus arises as the strongest."
 black_fraternity_faith_adj: "Black Fraternal"
 black_fraternity_faith_adherent: "Black Practitioner"
 black_fraternity_faith_adherent_plural: "Black Practitioners"
 ## Aeschraeism Faith ##
 aeschraes_aagiokrata_faith: "Aeschraeism"
 aeschraes_aagiokrata_faith_desc: "Although responsible for unleashing [frodbrokna|E] and destroying [aversaria|E], $aauto_aeschraes_link$ Aautokratir-Legon Aeschraes#! slowly built a cult of fanatics through the [imperial_civil_war|E] and especially in the chaotic decades after that remains insistent that his 'mistakes' were the machinations of dark villains (namely $aauto_axiaothea_link$ Axiaothea#!). They claim — not without merit — that the throne was his by right and law, and all who call themselves descendants of the Purest must bow to his rule."
 aeschraes_aagiokrata_faith_adj: "Aeschraeist"
 aeschraes_aagiokrata_faith_adherent: "Aeschraeist"
 aeschraes_aagiokrata_faith_adherent_plural: "Aeschraeists"
 ## Gorassosianism Faith ##
 aversarian_gorassos_faith: "Gorassosianism"
 aversarian_gorassos_faith_desc: "Named by its followers after its eponymous founder and leader $gorassos_link$ Gorassos#!, the [Concept('aversaria','Aversarian')|E] faith has been crudely reshaped into a cult of war and death. Purity is not earned by the blood in one's veins, but how much heathen blood one spills. And Gorassos intended for #EMP much#! blood to be spilled in his name."
 aversarian_gorassos_faith_adj: "Gorassian"
 aversarian_gorassos_faith_adherent: "Gorassosian"
 aversarian_gorassos_faith_adherent_plural: "Gorassosians"
 
 # Gorassosianism Rite #
 aversarian_gorassos_rite: "Gorassosianism"
 aversarian_gorassos_desc_with_gc: "Named by its followers after its eponymous founder and leader $gorassos_link$ Gorassos#!, the [Concept('aversaria','Aversarian')|E] faith has been crudely reshaped into a cult of war and death. Purity is not earned by the blood in one's veins, but how much heathen blood one spills. And Gorassos intended for #EMP much#! blood to be spilled in his name."
 aversarian_gorassos_rite_desc: "Named by its followers after its eponymous founder and leader Gorassos, the Aversarian faith has been crudely reshaped into a cult of war and death. Purity is not earned by the blood in one's veins, but how much heathen blood one spills. And Gorassos intended for much blood to be spilled in his name."
