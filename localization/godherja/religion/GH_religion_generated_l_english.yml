 ## Zamitaalat Kumaysh Faith ##
 ritualist_radicalist_faith: "Zamitaalat Kumaysh"
 ritualist_radicalist_faith_desc: "The Fellowship of Kumaysh, or Zamitaalat Kumaysh, was founded by the prophet Kumaysh ibn Sophocos, an illiterate and uneducated man who lived near the [Concept('the_towers','Tower')|E]. Kumaysh argued that organized priesthoods were anathema to the revelations of [GetBuilding('01_sophocos').GetName], and that one didn't need to be educated, highborn, or even intelligent to be a prophet of the Tower. The concept of priest-king, high priest, or god-king is an abomination to the Kumayshiyyīn, who argue that any sort of organized priesthood merely serves to repress the truths delivered on Sophocos' steps. The priesthood should therefore be composed entirely of the laity, and any attempt to impose organization on it or to codify the religion should be violently resisted. Ascension of [GetBuilding('01_sophocos').GetName] is considered paramount for any true Kumayshi, and every member of the sect and prospective priest is expected to make the journey at least once in their lifetime."
 ritualist_radicalist_faith_adj: "Kumayshi"
 ritualist_radicalist_faith_adherent: "Kumayshi"
 ritualist_radicalist_faith_adherent_plural: "Kumayshiyyīn"
 
