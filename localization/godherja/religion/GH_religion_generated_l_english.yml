 nicanonean_aagiokrata_rite: "Nicanoneanism"
 nicanonean_aagiokrata_desc_with_gc: "Nicanoneanism is the worship of $nicanoneus_link$ Nicanoneus 'the Black Sun'#! as the reincarnation of the [Concept('aersanon','Purest')|E]. The [Concept('aversaria','Aversarian')|E] warlord would deify himself shortly after his [Concept('the_black_mountain_war','arrival')|E] in Kalathipsomi and the cult would thereafter spread among the ranks of his legions and loyalists to whom he claimed he was personally brought to [aeras|E] by the Purest himself to the drums of the [Concept('aelfir','First Men')|E]."
