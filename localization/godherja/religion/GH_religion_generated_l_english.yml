 aversarinas_aagiokrata_religion_desc: "[aversarinas_aagiokratia|E] is the catch-all term for the assorted denominations, offshoots, and heresies of the [Concept('aversaria','Aversarinas Aautokrata')|E] and the Imperial Cult. Though their tenets may vary wildly, they largely revolve around belief in the primordial '[Concept('aelfir','First Men')|E]', a divine race of [Concept('magic','magic-wielding')|E] humans led by a [magi|E] named the [Concept('aersanon','Purest')|E] who once ruled the [Concept('first_empire','World City')|E] and the [first_empire|E]. The Aagiokrata is a religion largely without any cohesive belief system, and is instead dominated by innumerable cults often descended from innumerable faiths long conquered and absorbed by the Empire."
