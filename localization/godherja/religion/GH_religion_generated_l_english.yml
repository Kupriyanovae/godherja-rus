 harfi_faith: "Harfi'a"
 harfi_faith_desc: "The Harfi'un, unlike other [Concept('wardenism','Wardenite')|E] sects believe that the 'Pillars of Virtue' are actual, physical pillars that can be found in the material world, and must be protected. The other Wardenite sects dismiss this interpetation as comically literal, and view any unironic adherents of the Harfi ways as backwards fundamentalists."
