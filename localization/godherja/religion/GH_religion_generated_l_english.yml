 # Thalthit-Thalthun Rite #
 thalthit_thalthun_rite: "Thalthit-Thalthun"
 thalthit_thalthun_desc_with_gc: "The Thalthunyyīn believe that the lives of men are shaped by thirty-three angels, each charged with its own part of mortal existence, for good and for ill. Birth and death, fortune and famine, all are the work of one angel or another and a Thalthunyyī learns early which of them to thank and which to appease. Above them all, the highest of the thirty-three dwells within [GetBuilding('01_sophocos').GetName]."
