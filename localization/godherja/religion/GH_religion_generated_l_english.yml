 ## Praznarva Faith ##
 praznarva_faith: "Praznarva"
 praznarva_faith_desc: "The Praznarvii interpret certain stories about [Glossary('Velos','VELOS_GLOSS')] drinking the blood of his fallen pray to learn the secrets of life in a literalist context, and take drinking blood to be a sacred and important religious duty. Through this, they believe that they may taste the souls of the dead and learn their secrets, just as their patron god once did."
 praznarva_faith_adj: "Praznarvan"
 praznarva_faith_adherent: "Praznarvi"
 praznarva_faith_adherent_plural: "Praznarvii"
 
