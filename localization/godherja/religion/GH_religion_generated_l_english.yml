 ## Hero Cult Faith ##
 hero_religion: "Hero Cult"
 hero_religion_desc: "'Hero Cult' is a catch-all term for thousands of minor faiths tied together by a common belief system which places great mortals as the forefront object of worship, originating in the Western [Concept('shatteredisles','Isles')|E]. Though its legends may occasionally include mentions of disinterested deities and world-shaking leviathans, most Hero Cult pantheons are composed almost entirely of men and women of impressive deeds who are perceived to have some connection to local history — though this connection can often be quite tenuous, debatable or outright invented from whole cloth. Despite some propensity to exalt great warriors more often than heroes of other backgrounds, tales of the exploits of great adventurers, traders, scholars, rogues and [magi|E] are no less treasured than their more martial counterparts."
 hero_religion_adj: "Hero Cultist"
 hero_religion_adherent: "Hero Cultist"
 hero_religion_adherent_plural: "Hero Cultists"
 
