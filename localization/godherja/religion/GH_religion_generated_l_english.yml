 ## Labaqiri'a Faith ##
 labaqiri_faith: "Labaqiri'a"
 labaqiri_faith_desc: "A divergent sect of the Stranûni faith practiced by the Kirinarth traders that would later become the Dathanites, the Labaqirites believe that the source of power within the Holy Mountain of Dahangon is none other than the Dead God itself, imprisoned within its inaccessible depths.\n\nInheriting the musical beliefs of the Stranûnites, practitioners of the sect have a variety of chants and songs of warding, and during solstices and eclipses, hold festivals with a cacophony of noises to drive away evil."
