 ## Hulawitism Faith ##
 hulawite_faith: "Hulawitism"
 hulawite_faith_desc: "A rationalistic and experiential philosophy founded by Adar 'the Nib', a notoriously irascible scholar and philosopher of the late 8th century blooming of the Mamural courts. Initially working within the confines of an intellectually liberated form of Traditionalist Wardenism, Adar's theories evolved to the extent that they effectively rendered him an apostate. His followers to this day are saddled with the label "Hulaw", meaning "truant" after the wording of a judgement by the High Court of the Center shortly following his death.\n\nThe insult from the courts was ultimately impotent and without Mamural backing, and his heirs quickly began to self-identify with the label out of a shared love of ironic humor."
 hulawite_faith_adj: "Hulawite"
 hulawite_faith_adherent: "Hulawite"
 hulawite_faith_adherent_plural: "Hulawites"
 
