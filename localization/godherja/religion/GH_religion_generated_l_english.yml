 # Agiopolei Rite #
 agiopolei_rite: "Agiopolei"
 agiopolei_desc_with_gc: "Humanity is hopelessly corrupt, and attempts to save mankind from impurity are futile without the Saints. Therefore the faithful seek isolation from the corruption of the outside world to preserve the Saintly teachings until the 'Second Manifestation', when the Saints shall return to spread their divine teachings as they did in times long past."
