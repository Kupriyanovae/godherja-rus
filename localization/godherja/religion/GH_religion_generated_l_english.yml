 ## Listeners of Thoronis Faith ##
 listeners_of_thoronis: "Listeners of Thoronis"
 listeners_of_thoronis_desc: "Thoronis, either a [Concept('dragons','Dragon')|E] or a [magi|E] who once ruled the northern lands of [aeras|E] is the subject of much reverence amongst the peoples of the Continent. A faith sprung forth from the shores of the bay now named after Pathos, some [Concept('aversaria','Aversarian')|E] scholars assert that it may in fact be the furthest northern branch of Aversarian religions, though it is still distinct from the Aersodiaxianists of Aelarvisia and the Aagiokratans of the latter day empire. The self-proclaimed Listeners of Thoronis are of the belief that the eponymous god Thoronis gave rise to the oceans in an expression of their rage against the denizens of the seafloor who refused to offer worship to them. To avert such tragedies from occurring again, adherents regularly make offerings in the form of immense ships bearing sacrifices to the sea to appease the god, who will in return give gifts such as calm seas and bountiful harvests. It is rumored that these sacrificial vessels sometimes bear humans in times of famine and stormy weather, when their god is thought to be greatly angered, although the existence of such practices is vehemently denied by Thoronites."
 listeners_of_thoronis_adj: "Thoronis Listeners"
 listeners_of_thoronis_adherent: "Listener of Thoronis"
 listeners_of_thoronis_adherent_plural: "Listeners of Thoronis"
 
