 # Omitilos Aagiokrata Rite #
 omitilos_aagiokrata_rite: "Omitilos Aagiokrata"
 omitilos_aagiokrata_desc_with_gc: "Following the [frodbrokna|E] and the fracturing of [aversaria|E], not all of the Imperial Priesthood were content to lose power. In fact, some sought to consolidate it. They rallied behind one of their own and proclaimed him the Ypsilonis Omitilos, demanding that every other ecclesiastical and secular ruler show deference. They want a strong head around whom the faithful can rally... and weak kings who are incapable of getting in their way."
