 ## Black Mountain Imperial Cult Faith ##
 black_mountain_imperial_faith: "Black Mountain Imperial Cult"
 black_mountain_imperial_faith_desc: "The death of the $nicanoneus_link$ Black Sun#! would pass with little note outside the [Glossary('Black Mountains','black_mountains_encyclopedia_desc')], but those most ardent zealots to his rapidly disintegrating god-cult — primarily the last elders of the Black Legions and the barbarian warriors who had slowly filled their emptying ranks — would only redouble their worship.\n\nAs the world has marched on from the brutalities of the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] and as Nicanoneus has become increasingly relegated to an item of folktales and the faces of old coins, the dwindling zealots to the last true [Concept('aversaria','Aversarian')|E] have become — in the estimation of some — a reactionary death cult. This is despite the degradations of even their fellow [Glossary('Old Imperials','GH_OLD_EMPIRE_GLOSS')] as 'backwards barbarians' who have mistaken their old tribal customs as divine and true [Concept('first_empire','Second Empire')|E] doctrine."
 black_mountain_imperial_faith_adj: "Black Mountain Imperial"
 black_mountain_imperial_faith_adherent: "Black Mountainite"
 black_mountain_imperial_faith_adherent_plural: "Black Mountainites"
 
