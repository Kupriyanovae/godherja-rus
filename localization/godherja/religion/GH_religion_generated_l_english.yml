 # Saldhaari'a Rite #
 saldhaaria_rite: "Saldhaari'a"
 saldhaaria_desc_with_gc: "The Saldhaariyyīn follow the teachings of the [magi|E]-philosopher Saldhaar the Wise, who posited that the [GetBuilding('01_sophocos').GetName] on the surface of the world is an emanation of the True Sophocos maintained deep beneath the earth in the caverns of Domah Daniyal. The Saldhaariyyīn believe that long ago, men were blessed with great wisdom and stature, and that their philosophies allowed them to manipulate the world. Over time they began to degenerate in size and wisdom, and their philosophy likewise degenerated into what is now called [magic|E], becoming dangerous and enticing men to evil. A few called the Banu Daniyal fled underground to the True Sophocos, while their kinsmen transformed into modern man. Saldhaariyyīn believe philosophy is divine and philosophers are the incarnations of divinity on [aeras|E]."
 saldhaaria_rite_desc: "The Saldhaariyyīn follow the teachings of the Magi-philosopher Saldhaar the Wise, who posited that the Sophocos on the surface of the world is an emanation of the True Sophocos maintained deep beneath the earth in the caverns of Domah Daniyal. The Saldhaariyyīn believe that long ago, men were blessed with great wisdom and stature, and that their philosophies allowed them to manipulate the world. Over time they began to degenerate in size and wisdom, and their philosophy likewise degenerated into what is now called magic, becoming dangerous and enticing men to evil. A few called the Banu Daniyal fled underground to the True Sophocos, while their kinsmen transformed into modern man. Saldhaariyyīn believe philosophy is divine and philosophers are the incarnations of divinity on Aeras."
