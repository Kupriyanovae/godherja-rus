 ## Mountain-Sun Revivalism Faith ##
 mountain_sun_revivalism_faith: "Mountain-Sun Revivalism"
 mountain_sun_revivalism_faith_desc: "While the Mountain-Sun Temple persisted under the [Concept('aversaria','Aversarinas')|E] Aagiokrata, the collapse of the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] and the disintegration of the Imperial Cult in the Priest's Coup of Oraispol would lead to a reckoning in the Opakhasian aristocracy. Those nobles who survived the [Concept('sjalvolki_migration','Migrations')|E] with their power intact would find it much easier to move on from the Aautokrata than many of their former countrymen. Mountain-Sun titles and honors that had persisted throughout the Empire were reinforced and the ancient Imperial ones discarded. Fascination with rediscovering the ancient faith would be spurred on by the New Sun Reminiscency, as [GetBuilding('01_vounill').GetName] priests of the Scarlet Chosen spread across Opakhasia armed with thousands of ancient tomes and scrolls collected by the order."
