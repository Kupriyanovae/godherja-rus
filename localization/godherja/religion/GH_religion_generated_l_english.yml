 ## Tathtali'a Faith ##
 tathtali_faith: "Tathtali'a"
 tathtali_faith_desc: "The Tathtali'a have pretensions to being the mainstream branch of [wardenism|E], and historically this assumption hasn't been altogether incorrect as the Tathtali'a hold sway over the most heavily populated core of the Wardenite faith. Though they would claim their traditions date back centuries to the founding of Wardenism under the [Concept('the_first_warden','First Warden')|E] himself, the quirks that define the movement owe more to the $mamur_tathtali_link$ 9th century IS Mamur#! whose name the movement is often labeled with. The major point of divergence between the Tathtalites and what came before is in the unified and all powerful figure of the [Concept('mamuramat','Mamur')|E], whose rule is absolute and sacred. It is he who has final right of dissent in all legal matters, and he who leads the armies of the faithful in times of war and settles the soldiers in times of peace. His word is absolute — or at least, such is the theory."
 tathtali_faith_adj: "Tathtali"
 tathtali_faith_adherent: "Tathtalite"
 tathtali_faith_adherent_plural: "Tathtalites"
 
