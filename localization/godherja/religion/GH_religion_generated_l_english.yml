 ## Kaelenyanism Faith ##
 kaelenyanism_faith: "Kaelenyanism"
 kaelenyanism_faith_desc: "Kaelenyanism is founded on the absolute conviction that Kaelen, the 'Chosen Vessel,' is the living incarnation of Zaoran's will, sent to purge the world of its pervasive falsehoods and usher in an age of divine order. Adherents believe that Kaelen's every pronouncement and every decree is a direct emanation from Zaoran Himself, rendering all past interpretations secondary. To live by the will of Kaelen is to live in perfect alignment with Zaoran, for the new Prophet embodies the very essence of purification. Their faith demands unwavering obedience and an ardent dedication to Kaelen's vision, believing that only through his direct guidance can humanity be redeemed and the world made whole."
 kaelenyanism_faith_adj: "Kaelenyana"
 kaelenyanism_faith_adherent: "Zaoranian"
 kaelenyanism_faith_adherent_plural: "Zaoranians"
 
 # Kaelenyanism Rite #
 kaelenyanism_rite: "Kaelenyanism"
 kaelenyanism_rite_desc: "Kaelenyanism is founded on the absolute conviction that Kaelen, the 'Chosen Vessel,' is the living incarnation of Zaoran's will, sent to purge the world of its pervasive falsehoods and usher in an age of divine order. Adherents believe that Kaelen's every pronouncement and every decree is a direct emanation from Zaoran Himself, rendering all past interpretations secondary. To live by the will of Kaelen is to live in perfect alignment with Zaoran, for the new Prophet embodies the very essence of purification. Their faith demands unwavering obedience and an ardent dedication to Kaelen's vision, believing that only through his direct guidance can humanity be redeemed and the world made whole."
 kaelenyanism_rite_adj: "Zaoranian"
 kaelenyanism_rite_adherent: "Zaoranian"
 kaelenyanism_rite_adherent_plural: "Zaoranians"
 ## Shehzaranism Faith ##
 shehzarani_faith: "Shehzaranism"
 shehzarani_faith_desc: "Many have attempted to explain the similarities and reconcile the differences between Zaoranic and Sheharddi faiths. Shehzaranism represents an ancient confluence, proposing that the ultimate High God is one universal deity, known by countless names across the ages, be it ELOI, Zaoran, or others. Its followers believe that this singular divine being has never ceased to guide humanity, sending a multitude of Prophets throughout history descending from the [Concept('gh_amsari_first_dreamers','First Dreamers')|E], the Malikiyah, each tailored to their time and people, to teach the eternal message of righteousness against deception. The Faithful can not only return to God's heavenly grace but also aid in His ultimate, prophesied victory over all deception, by rejecting the primordial deceit of Eir'Shaytan."
 shehzarani_faith_adj: "Shehzaranic"
 shehzarani_faith_adherent: "Shehzaranian"
 shehzarani_faith_adherent_plural: "Shehzaranians"
 
