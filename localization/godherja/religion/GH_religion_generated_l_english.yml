 ## Talfasem Faith ##
 talfasmolline_faith: "Talfasem"
 talfasmolline_faith_desc: "Marmaladids have traditionally revered the deadly toxins of the Sarradonian Desert and the animals which harbour them as a source of immense power. Zealous adherents take part in a ritual known as the Talfasomoll. It is uncommon to find any Talfasamolline without a vial of venom, for it is not only to be used against one's enemies, but also for honourable suicide when all hope is lost."
