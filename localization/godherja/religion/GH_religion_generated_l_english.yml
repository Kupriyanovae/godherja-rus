 ## Stranûni'a Faith ##
 stranuni_faith: "Stranûni'a"
 stranuni_faith_desc: "An exotic branch of [wardenism|E] cut off from the Wardenite heartlands, the Stranûni beliefs have steadily diverged into something truly strange. The Stranûnites hold that words and the structure of those words hold great power, and that the pillars that keep the Dead God trapped are in fact five different holy forms of poetry and music. They hold that these forms must be constantly practiced, with poet-judges required to know at least one of the styles. However, the Stranûnites view it as of utmost importance that these sacred forms are not misused and only practiced under the proper circumstances. This leads to a paradoxical society, where music and poetry is simultaneously omnipresent and tightly regulated."
 stranuni_faith_adj: "Stranûni"
 stranuni_faith_adherent: "Stranûnite"
 stranuni_faith_adherent_plural: "Stranûnites"
 
