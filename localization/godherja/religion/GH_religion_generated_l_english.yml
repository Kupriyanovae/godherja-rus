 # Way of Karoxos Rite #
 karoxos_cult_rite: "Way of Karoxos"
 karoxos_cult_desc_with_gc: "Across the western [Concept('shatteredisles','Isles')|E], many ships are marked with a strange symbol, three triangles encircled by radiating lines. These vessels carry those who follow the Way of Karoxos, an ancient hero long passed into legend, worshipped in various forms across the seas. Her tales long fallen into myth speak of a grand odyssey across the seven great isles of the early [Concept('aversaria','Aversarian')|E] age. Be it legends of martial valour in the wars of the Abdexorn, the sack of the three legendary cities of the Symvolix, or an epic duel in the Imperial Isle for love and glory, all tales speak of a calling, a voice hailing Karoxos from distant shores inspiring her journeys.\n\nBelievers hold that when her fleet finally sailed into the isles she once called home, Karoxos came to understand the voice from afar. A final instruction followed that inspired a thousand years of followers, a request to go forth, sail the seas, and hear the calling for themselves. With a single ship, Karoxos is believed to have sailed into lands untamed, along ancient rivers, and into the lands of freezing winter, a path long followed by the most devout of worshippers."
