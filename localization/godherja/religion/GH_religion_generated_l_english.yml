 ## Kidarian Dance Faith ##
 kidarian_dance: "Kidarian Dance"
 kidarian_dance_desc: "The Kidarian Dance, born in the [Concept('shatteredisles','Isles')|E] of [sarradon|E], sees all of existence through the lens of rhythm and beats, where their gods are the dancers and the universe is their stage. Natural events, from light breezes to massive thunderstorms, are the gods' steps and moves, and the great cyclical patterns of nature are movements and tempos. Mortals are part of the dance too, though they do not understand the beats they follow in the way that the gods do.\n\nKidarian rituals unsurprisingly center around dancing. Whether to mimic a god's rhythm in thanks and praise, or to use their own rhythms in hope of influencing the world around them, Kidarian priests know a drumbeat for every prayer imaginable. They dedicate themselves in the name of Kidar-awah, the first man to learn the gods' rhythms, and strive to get a glimpse of the divine by dancing in the gods' steps in an endless frenzy. Unfortunately for them, it is more likely to result in bloodied feet and broken ankles than enlightenment."
 kidarian_dance_adj: "Kidarian Dancer"
 kidarian_dance_adherent: "Kidarian Dancer"
 kidarian_dance_adherent_plural: "Kidarian Dancers"
 
