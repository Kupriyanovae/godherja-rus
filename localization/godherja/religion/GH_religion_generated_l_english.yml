 ## Tenmaîxana Faith ##
 tenmaixana_faith: "Tenmaîxana"
 tenmaixana_faith_desc: "The Tenmaîxaîtes is the main canon in Tennger'Amîzen's faiths. It was created in 578 IS by a group of [Glossary('Kratemezin','crater_encyclopedia_desc')] scholars in the recently created [GetBuilding('01_xanamik').GetName], fearing that the rise of [Concept('ritualism','Ritualism')|E] and [Concept('wardenism','Wardenism')|E] would erase the Crater's native beliefs. While not intended as a faith, unlike the two latter, the scholar's work compiled into writings many myths, practices, beliefs and ultimately songs from all around the Crater. Most of Kratemezin's music schools adopted their work, which slowly over time became the shared canon from all over the Crater."
 tenmaixana_faith_adj: "Tenmaîxazen"
 tenmaixana_faith_adherent: "Tenmaîxaîte"
 tenmaixana_faith_adherent_plural: "Tenmaîxaîtes"
 
 # Xana I'Shamîr Rite #
 xana_i_shamir_rite: "Xana I'Shamîr"
 xana_i_shamir_desc_with_gc: "The School of Bards, or Xana I'Shamîr is teached throughout [Glossary('Kratemezin','crater_encyclopedia_desc')]. All students, even foreign, learn of the ancient mythology of the Crater, the legend of the [Glossary('Masked Moth','legend_masked_moth_kratemezin')] and most importantly of the [Glossary('Minstrels','minstrels_kratemezin')]. Their believer dedicate their life to [aspect_hymns] and songs, believe in the divinity of the [GetBuilding('01_geminam').GetName] and that music is both a blessing on the land and a pathway to the divine."
 xana_i_shamir_rite_desc: "The School of Bards, or Xana I'Shamîr is teached throughout Kratemezin. All students, even foreign, learn of the ancient mythology of the Crater, the legend of the Masked Moth and most importantly of the Minstrels. Their believer dedicate their life to hymns and songs, believe in the divinity of the Gemînam and that music is both a blessing on the land and a pathway to the divine."
 xana_i_shamir_rite_adj: "Shamîrzen"
 xana_i_shamir_rite_adherent: "Shamîrstrel"
 xana_i_shamir_rite_adherent_plural: "Shamîrstrel"
 # Sîlarîn Rite #
 silarin_rite: "Sîlarîn"
 silarin_desc_with_gc: "The Sîlarîn is an oft overlooked rite found primarily in the Crater. Those that believe in it hold that the shades found in and around Kratemezin are actually messengers of a great apocalypse. However, on their journey to warn the world, they were intercepted by a great evil, which transformed them into their current form. Despite their hostility, the Sîlarîn believe that they must listen to the songs of the shades so as to prevent whatever apocalypse they foretell."
 silarin_rite_desc: "The Sîlarîn is an oft overlooked rite found primarily in the Crater. Those that believe in it hold that the shades found in and around Kratemezin are actually messengers of a great apocalypse. However, on their journey to warn the world, they were intercepted by a great evil, which transformed them into their current form. Despite their hostility, the Sîlarîn believe that they must listen to the songs of the shades so as to prevent whatever apocalypse they foretell."
 silarin_rite_adj: "Sîlarîzen"
 silarin_rite_adherent: "Sîlarîte"
 silarin_rite_adherent_plural: "Sîlarîtes"
 ## Malayn-Talashbukt Gushuma Faith ##
 idoist_mtg_faith: "Malayn-Talashbukt Gushuma"
 idoist_mtg_faith_desc: "The Church of a Million Sounds of the Body is an ancient faith native to [Glossary('Kratemezin','crater_encyclopedia_desc')]. Its followers believe in a duality between the soul and the body, and that the world was created for amusement by [Concept('bored_god','Zoz Nûra')|E], one of many gods without a physical form. Having exhausted all the delights the universe had to offer, the god created a tangible world from Their own mind, where They could interact to alleviate Their boredom. In this world, They brought humanity into being, with each individual possessing a fragment of Their soul. Having created sentient beings, They hoped that, with these humans, They could stave off the boredom of an infinite life where death does not exist."
 idoist_mtg_faith_adj: "Idoist"
 idoist_mtg_faith_adherent: "Idoist"
 idoist_mtg_faith_adherent_plural: "Idoists"
 
 # Ido'Tit Neyîrk Rite #
 idoist_neyirk_rite: "Ido'Tit Neyîrk"
 idoist_neyirk_desc_with_gc: "The Church of Pain, or Ido'Tit Neyîrk in [GetCulturePillar('language_arapa').GetName] believe that the [Concept('bored_god','Bored God')|E] disappointement can only be satisfied by the many forms of agonies one can suffer. Consequently, their followers believe the only way they can speak and hear their god is through the voice of pain. Their ceremonies are an harmonious chorus of screams and [aspect_blood] where they torture their sacrifice through agonizing way until their death, and that, in this way, Zoz Nûra would deliver them from their pathetic shells and call them back into his infinite mind."
 idoist_neyirk_rite_desc: "The Church of Pain, or Ido'Tit Neyîrk in Arapan believe that the Bored God disappointement can only be satisfied by the many forms of agonies one can suffer. Consequently, their followers believe the only way they can speak and hear their god is through the voice of pain. Their ceremonies are an harmonious chorus of screams and blood where they torture their sacrifice through agonizing way until their death, and that, in this way, Zoz Nûra would deliver them from their pathetic shells and call them back into his infinite mind."
