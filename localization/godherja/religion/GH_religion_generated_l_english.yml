 ## Skrattaki Faith ##
 skrattaki: "Skrattaki"
 skrattaki_desc: "None remember before the [Concept('twist_of_the_tunnels','Great Unmaking')|E], when the Skrattakiatti still had eyes to see and worshipped mundane men without the ability to possess the [Concept('magic','Shadowgift')|E], for the priests have for eons maintained that this hated era of falseness and lies must be destroyed in all forms. While the first Skrattakiatti would use the Shadowgift to scourge their mind of the memories and replace it with the love of their god Skrallaviax — the great spider-queen whom taught the Skrattakiatti how to crawl across the cavern walls and to climb down the mighty abyss from whence she came — the practice has become ritual. Now, all Skrattakiatti perform the Thoughtpurge when they reach majority, destroying their memories and replacing them with the combined knowledge of their tribes."
 skrattaki_adj: "Skrattakiatt"
 skrattaki_adherent: "Skrattakiatti"
 skrattaki_adherent_plural: "Skrattakiattia"
 
 # Skrattaki Rite #
 skrattaki_rite: "Skrattaki"
 skrattaki_desc_with_gc: "None remember before the [Concept('twist_of_the_tunnels','Great Unmaking')|E], when the Skrattakiatti still had eyes to see and worshipped mundane men without the ability to possess the [Concept('magic','Shadowgift')|E], for the priests have for eons maintained that this hated era of falseness and lies must be destroyed in all forms. While the first Skrattakiatti would use the Shadowgift to scourge their mind of the memories and replace it with the love of their god Skrallaviax — the great spider-queen whom taught the Skrattakiatti how to crawl across the cavern walls and to climb down the mighty abyss from whence she came — the practice has become ritual. Now, all Skrattakiatti perform the Thoughtpurge when they reach majority, destroying their memories and replacing them with the combined knowledge of their tribes."
 skrattaki_rite_desc: "None remember before the Great Unmaking, when the Skrattakiatti still had eyes to see and worshipped mundane men without the ability to possess the Shadowgift, for the priests have for eons maintained that this hated era of falseness and lies must be destroyed in all forms. While the first Skrattakiatti would use the Shadowgift to scourge their mind of the memories and replace it with the love of their god Skrallaviax — the great spider-queen whom taught the Skrattakiatti how to crawl across the cavern walls and to climb down the mighty abyss from whence she came — the practice has become ritual. Now, all Skrattakiatti perform the Thoughtpurge when they reach majority, destroying their memories and replacing them with the combined knowledge of their tribes."
