 ## Anban Sarradon Faith ##
 anban_sarradon_faith: "Anban Sarradon"
 anban_sarradon_faith_desc: "A cult founded in the wake of the Frodbrokna. The Anban is a deliberate and somewhat cynically pragmatic attempt to unify both Wardenism and Ritualism into a singular faith based around the figure of an immaterial godhead lawgiver. Partially a political philosophy, its idealistic proponents offer it as a method to unite Sarradon and usher in a new age of religious peace. For somewhat obvious reasons it has generally struggled to find popular support outside of a handful of warlords looking for any kind of edge over their rivals."
