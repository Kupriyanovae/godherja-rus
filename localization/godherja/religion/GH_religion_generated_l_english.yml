 # Octarian Agionism Rite #
 eight_rite: "Octarian Agionism"
 eight_desc_with_gc: "United, codified, and purified under the eye of the Order of the Forlorn Guardian, Agionism is now unified in their veneration of the Saints who were martyred by the [Concept('aversaria','Aversarians')|E]. While initially against Aversarian religious practices, the end of their rebellions saw their cults 'rehabilitated' and reincorporated into the Aversarian fold; the Agionists and Aversarians now share many tenets. All Saints previously worshipped are included in the Canon, including the $forgotten_saint_link$;medium Forgotten Saint#!."
