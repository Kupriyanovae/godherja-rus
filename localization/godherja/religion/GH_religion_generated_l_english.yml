 ## Waharai Faith ##
 waharai_faith: "Waharai"
 waharai_faith_desc: "The Waharai hold that the Most High's death was merely His ascension, and that He waits in the heavens for those who accept this truth. Their attitude towards piety is far more lax than their fellows, to the Waharai, your actions on Aeras matter not, as merely the belief in the Most High will earn you a reward. As a result, the rules they follow are less formal and structured, with far more leeway given to individuals that would have been punished by other faiths, so long as they maintain their beliefs."
