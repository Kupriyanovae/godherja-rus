 etepezean_religion_desc: "The cultural ancestors to the modern Aversarian cultures that now inhabit Etepezea — the Etapexe — inhabited the peninsula long enough that it has never been proven if Proto-Aversarian culture first emerged in Etepezea or the Isles. Their faiths, while not as disparate as those of their Islander cousins, nevertheless remained largely divided in both belief and practice. The greatest commonalities between Etapexe-descended faiths would be worship and fascination with the extensive ruins spilling across the Shattered Coast, veneration of both the magi and great warriors, and a deep-seated fear of dreams (in all varieties mundane, mystical, and metaphysical)."
