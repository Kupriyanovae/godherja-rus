 ## Mazhūb al-Surāb Faith ##
 ritualist_nihilist_faith: "Mazhūb al-Surāb"
 ritualist_nihilist_faith_desc: "The Surābiyyīn are [Concept('ritualism','Ritualists')|E] who hold that the world as men perceive it is not truly real, and that all of [aeras|E] is but an illusion. Through [GetBuilding('01_sophocos').GetName] can, in one way or another, deliver them from its deceit and perhaps attain enlightenment."
 ritualist_nihilist_faith_adj: "Ritualist"
 ritualist_nihilist_faith_adherent: "Ritualist"
 ritualist_nihilist_faith_adherent_plural: "Ritualists"
 
 # Akhawwat al-Iiraahadat al-Mutajaaluyah Rite #
 akhawwat_rite: "Akhawwat al-Iiraahadat al-Mutajaaluyah"
 akhawwat_rite_desc: "The Akhawwat al-Iiraahadat al-Mutajaaluyah — the Fraternity of the Will Manifest — is an esoteric Ritualist sect that believes that reality is a collective hallucination, and that true reality is actually a spiritual realm. Humans are not beings of fallible flesh, but are rather immortal and immaterial spiritual entities that are eternal but of a finite creation. They have trapped themselves in this false reality through the deceits of al-Khadidruj, but may learn the truth through Sophocos — which itself does not exist — and regain control of their spiritual bodies and break the delusion of existence."
