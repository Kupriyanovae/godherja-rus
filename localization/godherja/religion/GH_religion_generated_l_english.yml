 ## Grotticand Faith ##
 grotticand: "Grotticand"
 grotticand_desc: "The keepers of [GetTitleByKey('b_grotto_of_the_golden_martyrs').GetNameNoTier], the holiest place in all the underworld, the Grotticanders would establish great farms and and holy temples in what was once the greatest of cities beneath the world. The thousands of strange and [Concept('aelfir','alien')|E] bodies found in the Grotto, clad in strange golden armor impossible to forge by the hands of man, were believed to have once been the ancient guardians of the Grotto from before any man walked the world below.\n\nSeeing themselves as the inheritors of this great legacy and dreading the return of the barberous creatures that no doubt slew the ancient wardens, the Grotticanders have taken to preserving the ancient place and warding it with the greatest of magics their tribes could produce. To this end, the bodies of these once great warriors have often been given new life to assist in both war and peace. While many find their strange visage's disturbing, and while more than one has regained some mad semblance of its once-life and slew many in a rampage before being banished, the great bounty of the Grotto and the assitance of the [Concept('undead','undead')|E] have allowed the Grotticanders to form three great empires well before any interloper intruded from [Concept('aversaria','lands unknown')|E]."
 grotticand_adj: "Grotticander"
 grotticand_adherent: "Grotticander"
 grotticand_adherent_plural: "Grotticanders"
 
