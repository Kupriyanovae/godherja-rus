 hazrandanism_rite_adherent: "Hazrandān"
 hazrandanism_rite_adherent_plural: "Hazrandāni"
 # Nashadism Rite #
 nashadism_rite: "Nashadism"
 nashadism_desc_with_gc: "Nashadism properly emerged in the wake of the [gh_massacre_of_the_ten_heirs|E]. However, many Zaoranian thinkers such as Arvashdān Izhākhet, along with the local population, had already begun questioning the long-held belief that legitimacy passed solely through blood. Dissatisfaction with both past and present rulers led them to argue that struggle and righteousness solely determined a ruler's right to rule.\n\nIronically, in an effort to gain further traction across [amsar|E] and strengthen their political position, they rallied behind Nashad. Who was the alleged surviving son of Qanamsar Parashād's eldest heir, and rejected the 'usurper' Qanamsara Tōvah. To the Nashadi, the rightful line of succession passed through Radesh and his son Nashad, whom they believed was destined to lead them to prophesied victory. History would repeat itself when, after his death and the failure of the [gh_emerald_rebellion|E], his most ardent followers insisted that he had hidden away a child who would one day reclaim his birthright."
 nashadism_rite_desc: "Nashadism properly emerged in the wake of the Massacre of the Ten Heirs. However, many Zaoranian thinkers such as Arvashdān Izhākhet, along with the local population, had already begun questioning the long-held belief that legitimacy passed solely through blood. Dissatisfaction with both past and present rulers led them to argue that struggle and righteousness solely determined a ruler's right to rule.\n\nIronically, in an effort to gain further traction across Amsar and strengthen their political position, they rallied behind Nashad. Who was the alleged surviving son of Qanamsar Parashād's eldest heir, and rejected the 'usurper' Qanamsara Tōvah. To the Nashadi, the rightful line of succession passed through Radesh and his son Nashad, whom they believed was destined to lead them to prophesied victory. History would repeat itself when, after his death and the failure of the Emerald Rebellion, his most ardent followers insisted that he had hidden away a child who would one day reclaim his birthright."
 nashadism_rite_adj: "Nashadi"
 nashadism_rite_adherent: "Nashadan"
 nashadism_rite_adherent_plural: "Nashadi"
 # Arishayanism Rite #
 arishayana_rite: "Arishayanism"
 arishayana_rite_desc: "The Arishani Faith follows the radical revelations of Prophetess Arisha az-Behni, who asserted that the Last Struggle had already occurred, and that Zaoran had died when Maiya broke the moon—marking the end of the Prophecy and of direct divine guidance. She believed, however, that Zaoran had left the world one final gift: His essence had been infused into all things, and by cultivating heightened awareness—as she had—one could perceive the divine interplay of Zaoran's Will in everything, a presence that would guide the Faithful in His absence.\n\nHaving traveled the world and witnessed the first Great Sleeper's awakening, Arisha proclaimed that she would lead the Faithful in the Last Battle, soon to fall upon humanity, and deliver them from darkness. Her death on the eve of the prophesied conflict left her followers in disarray, seemingly forced to face the Last Battle without their leader."
 arishayana_rite_adj: "Arishayana"
 arishayana_rite_adherent: "Zaoranian"
 arishayana_rite_adherent_plural: "Zaoranians"
 ## Zurvan Zaoranism Faith ##
 zurvan_zaoran_faith: "Zurvan Zaoranism"
 zurvan_zaoran_faith_desc: "The ancient belief in Zaoran, He of a Hundred Virtues, was practiced by the Amsari under the rule of the Kemsari. Persecution forced the faith into secrecy, with its followers adapting their worship to survive. Each community formed its own rituals and interpretations, leading to a wide array of localized practices."
