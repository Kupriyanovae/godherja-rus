 sunwarwei_aagiokrata_rite_adherent: "Sunarwei Aagiokratan"
 sunwarwei_aagiokrata_rite_adherent_plural: "Sunarwei Aagiokrata"
 # Cult of the Waves Rite #
 cult_of_the_waves_rite: "Cult of the Waves"
 cult_of_the_waves_desc_with_gc: "After the [frodbrokna|E], the inhabitants of several coastal islands became obsessed with the sea. They have adapted their rituals to be performed facing the shore, and their priests try and divine the future by observing the patterns of clouds and waves during storms. They insist that they are still just as faithful as any other Aagiokratan, but suddenly clam up when asked by an outsider to explain the details of their faith."
