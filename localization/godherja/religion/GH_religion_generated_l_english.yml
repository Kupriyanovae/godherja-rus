 # Mawtalmumini'a Rite #
 mawtalmuminin_rite: "Mawtalmumini'a"
 mawtalmuminin_rite_desc: "Beyond the veil of the mortal realm there lies only the eternity of death. The Mawtalmuminiyyīn gladly embrace this final destination; in fact, they crave it. To the Mawtalmuminiyyīn, there is nothing to fear from death, and in fact it must be venerated. As death is eternal, all gods and men are his servants."
