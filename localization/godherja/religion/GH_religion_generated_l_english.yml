### Manat Religion ###
 manats_religion: "Manat"
 manats_religion_adj: "Manat"
 manats_religion_adherent: "Manat"
 manats_religion_adherent_plural: "Manats"
 manats_religion_desc: "A thousand thousand generations prior, the Manats claim, the [Concept('manat_mythology','Manat Gods')|E] once walked among humanity. They taught mankind how to build cities, how to hunt, how to fight, and how to structure society. When they departed, they left behind a list of [Concept('gena_tinngir','Sacred Texts')|E] for humanity to follow their teachings. They have been transcribed again and again over the centuries, repeated in a long-dead language whose translations have been passed down by oral tradition. Although only a fraction of the original texts are said to survive, what remains is treasured by Manats as more precious than gold."
