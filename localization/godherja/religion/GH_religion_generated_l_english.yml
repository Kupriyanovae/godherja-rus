 ## Makerelyon Faith ##
 makerelyon_faith: "Makerelyon"
 makerelyon_faith_desc: "The Makerelyon branch of the Manat religion is popular among ambitious kings who wish to usurp the power of the Nosanni. They believe that it is the sole right of the ruler of a realm to translate the Sacred Texts, with clergy only guarding the libraries, a task they argue is so vital it cannot be distracted from by scholarly efforts. They justify this belief by referring to how the king of the gods, Relyon, had supreme authority over all other gods, even the keeper of the divine library, Ashema."
 makerelyon_faith_adj: "Makerelyon"
 makerelyon_faith_adherent: "Makerelyon"
 makerelyon_faith_adherent_plural: "Makerelyons"
 
