 ## Sheharddi Faith ##
 sheharddi_faith: "Sheharddi"
 sheharddi_faith_desc: "The origins of the Sheharddi faith are shrouded in mystery, and scholars debate whether it is a syncretism of several Sarradonian faiths, a single-god cult that split off from a larger polytheistic faith, or the surviving remnants of a more primordial religion. They believe that the high god Eloi, creator of the heavens, created a race called the Malikiyah, or Messengers. The eldest of these, Eir'Shaytan, created an even lesser race of beings — the humans — to be his servants and to worship him and his six lieutenants as if they were greater than their father. This caused mankind to be expelled from paradise after the Kalnaih and only by being honorable and righteous in life can one return to heaven to worship Him for eternity."
 sheharddi_faith_adj: "Sheharddic"
 sheharddi_faith_adherent: "Sheharddi"
 sheharddi_faith_adherent_plural: "Sheharddim"
 
