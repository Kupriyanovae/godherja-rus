 # Velosgrave Rite Rite #
 piety_rite_rite: "Velosgrave Rite"
 piety_rite_desc_with_gc: "The Velosgrave Rite derives its name from the Conclave of the Velosgrave, the ancient priesthood that administered the holiest site in the Sjalvolki faith and once held a preeminent religious role in their pre-migration world, though it is also sometimes referred to as the Piety Rite. The loss of the Velosgrave itself to the [Concept('the_fog','Fog')|E] would see a sharp decline in their power and prestige, however, and throughout most of the Conquest they would find themselves clinging to the court of Cenware in a respected advisory role — but little more.\n\nWith the onset of the great reformation, however, the group would see its fortunes dramatically surge. Ardent early supporters of the movement, they would ultimately break away from the Orispolj Rite as they attempted to codify themselves as the legal heads of the religion. Though most other rites at least nominally recognize the prestige and venerable nature of the Velosgrave Conclave, they claim that their position of preeminence is either merely symbolic or subordinate to another institution, such as the Holy Kingdom of the Krona Rite."
 piety_rite_rite_desc: "The Velosgrave Rite derives its name from the Conclave of the Velosgrave, the ancient priesthood that administered the holiest site in the Sjalvolki faith and once held a preeminent religious role in their pre-migration world, though it is also sometimes referred to as the Piety Rite. The loss of the Velosgrave itself to the Fog would see a sharp decline in their power and prestige, however, and throughout most of the Conquest they would find themselves clinging to the court of Cenware in a respected advisory role — but little more.\n\nWith the onset of the great reformation, however, the group would see its fortunes dramatically surge. Ardent early supporters of the movement, they would ultimately break away from the Orispolj Rite as they attempted to codify themselves as the legal heads of the religion. Though most other rites at least nominally recognize the prestige and venerable nature of the Velosgrave Conclave, they claim that their position of preeminence is either merely symbolic or subordinate to another institution, such as the Holy Kingdom of the Krona Rite."
 piety_rite_rite_adj: "Velosgrave Rite"
 piety_rite_rite_adherent: "Velosgraver"
 piety_rite_rite_adherent_plural: "Velosgravers"
 # Krona Rite Rite #
 authority_rite_rite: "Krona Rite"
 authority_rite_desc_with_gc: "The Krona Rite, also known as the Crown Rite or Authority Rite, traces many of its fundamental theological origins to the formation of the Imperrech itself. Though initially understood by most to be only a temporary arrangement, a number of heavily disputed and possibly apocryphal statements made by Cenware and his closest associates throughout his reign would later come to serve as the fuel for one of the most bitter and divisive conflicts in the Sjalvolki religion — namely, the nature of the High Kingdom itself, and its authority over spiritual affairs.\n\nThe Kronists, unlike the [GetTitleByKey('c_oraispol').GetNameNoTier] and Velosgrave rites, claim that the High Kingdom was in fact never intended to be a unique entity, and that it was instead an example that a mighty secular ruler must be the head of the Sjalvolki world — Albeit, in the form of a successor 'Holy Kingdom', rather than some mad attempt to revive the Imperrech itself. Though not initially openly anti-clerical, ensuing conflicts with the Velosgrave Rite would also see it adopt an increasingly hostile position towards the power of the clergy — namely, that the faithful should be led by the most worthy of secular lords, rather than be in the hands of a possibly hedonistic and scheming spiritual class who threaten to destroy the faith for lust of power."
 authority_rite_rite_desc: "The Krona Rite, also known as the Crown Rite or Authority Rite, traces many of its fundamental theological origins to the formation of the Imperrech itself. Though initially understood by most to be only a temporary arrangement, a number of heavily disputed and possibly apocryphal statements made by Cenware and his closest associates throughout his reign would later come to serve as the fuel for one of the most bitter and divisive conflicts in the Sjalvolki religion — namely, the nature of the High Kingdom itself, and its authority over spiritual affairs.\n\nThe Kronists, unlike the Oraispol and Velosgrave rites, claim that the High Kingdom was in fact never intended to be a unique entity, and that it was instead an example that a mighty secular ruler must be the head of the Sjalvolki world — Albeit, in the form of a successor 'Holy Kingdom', rather than some mad attempt to revive the Imperrech itself. Though not initially openly anti-clerical, ensuing conflicts with the Velosgrave Rite would also see it adopt an increasingly hostile position towards the power of the clergy — namely, that the faithful should be led by the most worthy of secular lords, rather than be in the hands of a possibly hedonistic and scheming spiritual class who threaten to destroy the faith for lust of power."
 authority_rite_rite_adj: "Krona Rite"
 authority_rite_rite_adherent: "Kronist"
 authority_rite_rite_adherent_plural: "Kronists"
 # Eastern Rite Rite #
 eastern_rite_rite: "Eastern Rite"
 eastern_rite_rite_desc: "Splitting from the 'Orispolj Rite', the Eastern Rite was formed due to the great distance from the spiritual strongholds in Etepezea to the eastern regions of Aironoi and the great number of exotic faiths found in the east. With the eastern faithful thrown into chaos with the Veloscoup and the rapid onslaught of religious infighting, the spiritual class of the east attempted to sidestep further doctrinal conflict by working with spiritual lords to find a middle ground for their faith. As such, the Eastern Rite is a strange mix of spiritual and secular control, with a spiritual head over a decentralized system of priests who shares control with the lords alongside them.\n\nDue to these differences, the Eastern Rite is incredibly permissive, the founding ideals of the faith and the confusion of its creation leading to many laws and rules to faith being conspicuously absent or lenient."
 eastern_rite_rite_adj: "Eastern Rite"
 eastern_rite_rite_adherent: "Easterner"
 eastern_rite_rite_adherent_plural: "Easterners"
 # Bánstur Rite Rite #
 banstur_rite_rite: "Bánstur Rite"
 banstur_rite_desc_with_gc: "The Bánstur Rite is a pluralistic Rite born from the many [Concept('sjalvolki_migration','migrations')|E] that settled along the Shattered Coast who believe that it is their duty to uncover, collect, and share the knowledge of the Old World with the settlers of the New. Many reject the authority of both the Holy Kingdom and the Velosgrave and adhere to a philosophy of nonviolence."
 banstur_rite_rite_desc: "The Bánstur Rite is a pluralistic Rite born from the many migrations that settled along the Shattered Coast who believe that it is their duty to uncover, collect, and share the knowledge of the Old World with the settlers of the New. Many reject the authority of both the Holy Kingdom and the Velosgrave and adhere to a philosophy of nonviolence."
 banstur_rite_rite_adj: "Bánstur Rite"
 banstur_rite_rite_adherent: "Bard"
 banstur_rite_rite_adherent_plural: "Bards"
 # Prohen Rite Rite #
 earth_rite_rite: "Prohen Rite"
 earth_rite_rite_desc: "The Prohen Rite is the codification of oft-derided Prohen worship from before the migrations under a central system. Unlike the 'Anarchy of Belief' espoused by the Orispolj reformers, Prohenites believe in a central authority to help guide the faithful towards their fates."
 earth_rite_rite_adj: "Prohen Rite"
 earth_rite_rite_adherent: "Prohenite"
 earth_rite_rite_adherent_plural: "Prohenites"
 # Pathos Rite Rite #
 river_rite_rite: "Pathos Rite"
 river_rite_desc_with_gc: "The Pathos Rite believes that the river systems of the [Glossary('Pathos Delta','pathos_delta_encyclopedia_desc')] were a gift created for the faithful that they may find in their wandering and prosper with. [Glossary('Varpalis','VARPALIS_GLOSS')] is raised to the center of the Sjalvolki pantheon, and the codification of myths are structured around him rather than more tradtional gods."
 river_rite_rite_desc: "The Pathos Rite believes that the river systems of the Pathos Delta were a gift created for the faithful that they may find in their wandering and prosper with. Varpalis is raised to the center of the Sjalvolki pantheon, and the codification of myths are structured around him rather than more tradtional gods."
 river_rite_rite_adj: "Pathos Rite"
 river_rite_rite_adherent: "Varpalisite"
 river_rite_rite_adherent_plural: "Varpalisites"
