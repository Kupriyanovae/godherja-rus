 # Dejorig Rite #
 dejorig_rite: "Dejorig"
 dejorig_desc_with_gc: "The religion of the northern slaves of the former [mayikrata|E], Dejorig beliefs primarily descend from those slaves who were put to work excavating and exploring the dark tunnels running throughout the [mayikrata|E], a task which would kill nearly every other man and woman sent to it. Its followers reject [magic|E] entirely, seeing it as a foul evil and whispering harshly about its effect on what lies below the Citadel. To the Dejorigs, [magic|E] is the source of the world's evil, and may be the path to its end."
 dejorig_rite_desc: "The religion of the northern slaves of the former Mayikrata, Dejorig beliefs primarily descend from those slaves who were put to work excavating and exploring the dark tunnels running throughout the Mayikrata, a task which would kill nearly every other man and woman sent to it. Its followers reject magic entirely, seeing it as a foul evil and whispering harshly about its effect on what lies below the Citadel. To the Dejorigs, magic is the source of the world's evil, and may be the path to its end."
