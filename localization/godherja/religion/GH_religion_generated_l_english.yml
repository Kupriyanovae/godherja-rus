 ## Cult of the Kidunawa Faith ##
 black_abyss_cult: "Cult of the Kidunawa"
 black_abyss_cult_desc: "Kidunawists believe in the Kidunawa, a sea-beneath-the-sea that is home to demons and sinister deities that conspire against all life above water. Calamities that occur at sea are understood as punishment from those that dwell below, leading adherents to constantly seek appeasement by following an array of esoteric superstitions. Some adherents are known to graft parts of sea creatures to their bodies, believing that those who bear part of the deep need not fear the deep."
