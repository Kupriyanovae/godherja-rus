 ## Adabyssian Faith ##
 adabyssian_faith: "Adabyssian"
 adabyssian_faith_desc: "Only the most purified are permitted to see the greatest statues with their own eyes. It is the priests who go into trances in the temples' cells, listening for commands from the gods beneath the gold and relaying it into intelligible orders for secular 'rulers'. Above all has been one command, repeated by the gods throughout the centuries: go forth and conquer, so that all the world may join their supplication."
