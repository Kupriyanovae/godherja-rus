 # Cult of the Distant Shore Rite #
 distant_shore_cult_rite: "Cult of the Distant Shore"
 distant_shore_cult_desc_with_gc: "The cultists of the Distant Shore are a rare sight in [aeras|E], seldom seen beyond the scattered [Concept('shatteredisles','Isles')|E] of its devoted adherents. They preach of a land of heroes far beneath the waves, a distant shore where paradise awaits. Only the enigmatic preacher known as the 'Listener' can commune with the ancient heroes who live beyond the shore, an ability passed down from preacher to preacher through elaborate ritual.\n\nWhen the Listener finally hears their call, the most virtuous gather in celebration for their final journey. With the Listener's blessing of protection and the guidance of the heroes before, a small fleet sets sail for the Distant Shore, passing through lands unknown to even the most experienced [Concept('aversaria','Aversarian')|E] sailor in a grand adventure to the land beyond the waves."
