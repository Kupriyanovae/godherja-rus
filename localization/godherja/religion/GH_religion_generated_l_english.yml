 ## Mogowai Faith ##
 mogowai_faith: "Mogowai"
 mogowai_faith_desc: "The mainstream Mogowai, codified in the [karururi_chorus|E], take their task of finding the body of the Most High incredibly seriously. While a good many just pray that He leads His followers to His final resting place, others are compelled to go out into the world and search themselves. They retread old paths thought to be dead ends, or search in completely undiscovered locales, and pursue any lead about a sacred burial site in hopes of fulfilling their one goal. It is believed that when found, He will rise once more, and transform the world into a paradise."
 mogowai_faith_adj: "Mogowai"
 mogowai_faith_adherent: "Mogowai"
 mogowai_faith_adherent_plural: "Mogowai"
 
