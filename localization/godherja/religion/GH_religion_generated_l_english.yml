 ## Ihzāfehism Faith ##
 ihzafeh_faith: "Ihzāfehism"
 ihzafeh_faith_desc: "The Ihzāfehsi arose in defiance of what they saw as the corruption of society, particularly among the ruling elite and the Frazan clergy, whom they viewed as decadent and estranged from true faith. Rejecting rigid doctrine, they hold that personal interpretation is the purest means of understanding Zaoran's will, elevating direct spiritual experience over the authority of religious institutions. To the Ihzāfeh, faith is not bound by hierarchy, but by the sincerity of one's devotion."
