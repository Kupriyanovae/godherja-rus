 kothori_rite_desc:0 "Смешение [Concept('wardenism','варденитских')|E] религиозных практик с некоторыми традициями, эндемичными для гор Тарсанид, Которский культ включает множество древних богов из старых барзавских пантеонов в веру либо как благосклонных духовных хранителей, либо как святых, причём первая группа часто воплощается в важных судьях, а вторая часто возносится после смерти до почти божественного статуса. Это, естественно, весьма скандально для более широкой варденитской веры, известной своей явной антитеистской позицией, но которцы всегда избегали подавления в основном из-за отдалённости своих горных домов и относительной безвестности своей сельской веры."
 krothagg_desc_with_gc:0 "Дети великих Первых Царей, Джора Разрушителя Гор и Грулара Мудреца, как говорят, были приведены под землю, чтобы встретиться с самыми ненавистными врагами всего человечества — трусливыми и коварными [Concept('aelfir','экаггирами')|E]. Хотя Джор и Грулар изгнали их под землю во время [Concept('prehistory','Войн Богов')|E], братья-воины объединили свои племена, когда мир треснул и раскололся, и повели великую армию, чтобы чёрные звери никогда больше не поднялись.\n\nХотя кротхаггские цари доминировали в подземном мире, [Concept('twist_of_the_tunnels','Искажение туннелей')|E] разрушила их империю, оставив лишь малую часть населения в их странной новой реальности. Великий Кормакан «Бескровный», величайший из царей со времён Джора и Грулара, впоследствии объявил мир проклятым и нуждающимся в исправлении через праведную войну и воссоздание павшей Кротхаггской империи будущим царём-спасителем."
 krothagg_rite:0 "Кротхаггск"
 krothagg_rite_adherent:0 "Кротхаггец"
