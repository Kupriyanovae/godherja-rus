 ataabay_zatanai_rite_desc:0 "Последователи Затани'а придерживаются наставлений пророка-ритуалиста Затаная, который получил откровения от Софокоса в возрасте всего семнадцати лет. Несмотря на молодость, Затанай был пламенным оратором. Он призывал полностью истребить хранителей и умерщвлять всякого, кто отвергает истины Софокоса, как врага человечества. Изначально это течение не задумывалось как самостоятельная постоянная секта, однако Затанай включил в своё учение элементы сулеймани'а: прежде всего веру в Домаха Данияла и убеждение, что у любой философии можно чему-то научиться. При этом он отрицал какую-либо истинную ценность нередко заимствуемых неритуалистских воззрений. Затанай и его ученики считали ритуализм единственным истинным образом жизни человечества. Все прочие религии представлялись им лишь извращёнными формами ритуализма, которые следовало по возможности обратить в истинную веру, а в противном случае уничтожить. Затанай был одним из самых молодых пророков в истории ритуализма. В девятнадцать лет он ушёл в сокрытие, объявив, что вернётся, когда его народ будет нуждаться в нём больше всего."
