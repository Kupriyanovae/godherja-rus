 black_mountain_imperial_desc_with_gc:0 "Смерть $nicanoneus_link$ Чёрного Солнца#! едва ли заметили за пределами [Glossary('Чёрных гор','black_mountains_encyclopedia_desc')]. Но самые истовые приверженцы его стремительно распадавшегося культа — прежде всего последние старейшины Чёрных легионов и варварские воины, постепенно заполнившие их редеющие ряды, — лишь удвоили своё рвение.\n\nМир постепенно забыл ужасы правления [Glossary( 'Аутократы', 'GH_AAUTOKRATA_GLOSS' )], а Никанея всё чаще вспоминают лишь в народных сказаниях да видят на потёртых монетах. Немногочисленные фанатики последнего истинного [Concept('aversaria','аверсарианца')|E], по мнению некоторых, превратились в реакционный культ смерти. Сами же они не щадят даже единоверцев из числа [Glossary('старых имперцев','GH_OLD_EMPIRE_GLOSS')], называя их «отсталыми варварами», которые приняли древние племенные обычаи за божественное истинное учение [Concept('first_empire','Второй империи')|E]."
