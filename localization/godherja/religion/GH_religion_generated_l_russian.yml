 cult_of_the_waves_desc_with_gc:0 "После [Concept('frodbrokna','Фродброкны')|E] жители нескольких прибрежных островов стали одержимы морем. Они адаптировали свои ритуалы так, чтобы проводить их лицом к берегу, а их жрецы пытаются предсказывать будущее, наблюдая за облаками и волнами во время штормов. Они настаивают на том, что остаются такими же верными, как и любой другой аагиократ, но внезапно замолкают, когда посторонний спрашивает их о подробностях их веры."
