 nathanalmic_desc_with_gc:0 "[Glossary('Натаналмики','GH_NATHANALMIC_GLOSS')] проповедуют, что лучший способ чтить Богов-Близнецов — это жить в гармонии с природой и проводить [Concept('holy_hunts','священные охоты')|E] во имя их. Последователи видят в чужаках меланхоличные и заблудшие души и верят, что долг верных — убедить их ступить на срединный путь. Несмотря на эту открытость, натаналмики продолжают опасаться идей, выходящих за рамки нормы, опасаясь, что они могут вновь разжечь [Concept('great_betrayal','трагедии')|E], случившиеся ранее."
 nathanalmic_rite:0 "Натаналмик"
 nathanalmic_rite_adherent:0 "Сепаттанец"
 nathanalmic_rite_adherent_plural:0 "Сепаттанцы"
 nathanalmic_rite_adj:0 "Сепаттан"
 nathanalmic_rite_desc:0 "Натаналмики учат, что лучший способ почтить Богов-близнецов — жить в гармонии с природой и устраивать священные охоты во имя них. Чужеземцев они считают унылыми и заблудшими душами, которых верующие обязаны убедить ступить на Срединный путь. Несмотря на эту открытость, натаналмики с опаской относятся к чуждым учениям и новым идеям, боясь повторения трагедий прошлого."
