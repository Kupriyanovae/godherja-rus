 guillater_cult_desc_with_gc:0 "Редкое единство, достигнутое Гийятом, навечно закрепило его наследие на просторах [Concept('shatteredisles','Островов')|E], сделав его самым любимым героем всех островных культов. Для его самых верных последователей, однако, Гийят — нечто гораздо большее. В смерти верующие считают, что Гийят перешёл за пределы земель героев, вознесясь, чтобы править пантеонами своей новообразованной империи вечно. Среди Последователей издавна зреет презрение к народам островов, которых они считают предателями наследия Гийята, разрушившими его империю и отвергнувшими его высокий статус.\n\n[Concept('frodbrokna','Фродброкна')|E] в их глазах — это долгожданное божественное наказание Гийята, праведное возмездие за невежество и отсутствие смирения островитян. За этим последовали радикализация и милитаризация, ибо их путь был прояснён через самое божественное откровение о самой священной войне. Последователи стремятся положить конец поклонению меньшим героям, низвергнуть идолопоклонство лжегероев в море и предложить острова Гийяту как жест подчинения верховному герою."
 guillater_cult_rite:0 "Последователи Гийата"
 guillater_cult_rite_adherent:0 "Культист Гийята"
 guillater_cult_rite_adherent_plural:0 "Культисты Гийята"
 guillater_cult_rite_adj:0 "Последователи Гийята"
