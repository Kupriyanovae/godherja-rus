 calysto_desc_with_gc:0 "Калистианцы почитают $saint_calysto_link$;medium Святого Калисто#!, который возглавил множество освободительных войн против аверсарианцев. Их символ — два скрещённых ключа, олицетворяющих свободу от мирских и духовных оков."
 calysto_pure_desc_with_gc:0 "Калистианцы почитают $saint_calysto_link$;medium Святого Калисто#!, который возглавил множество освободительных войн против аверсарианцев. Их символ — два скрещённых ключа, олицетворяющих свободу от мирских и духовных оков."
