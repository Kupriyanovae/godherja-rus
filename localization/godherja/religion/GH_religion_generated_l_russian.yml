 blackhand_rite_desc:0 "Культ Чёрной Руки распался и исчез из поля зрения общественности после внезапного исчезновения своего таинственного лидера, Искателя Разума, в 1190 году от И.С. До своего падения Культ распространился подобно лесному пожару по Этепезее и частям Опахасии и был наиболее печально известен сожжением Никаринпалати — тысячелетней резиденции [Concept('aversaria','аверсарианских')|E] Аавтократов — дотла."
