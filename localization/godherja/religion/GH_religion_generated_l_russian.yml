 kemsar_desc_with_gc:0 "Исконная вера народа кемсарцев, религия Кемсара является натуралистической и сосредоточена на поклонении дающей свет луне Иаху и дающей жизнь реке Хейе. Однако пересыхание Хейи и раскол Иаха во время [Concept('frodbrokna','Фродброкны')|E] принесли с собой как религиозные, так и социальные потрясения, и земли были погружены в хаос. Попытки осмыслить этот сбивающий с толку мир привели к новой, более циничной вере. Иах теперь — Инпиа, Мёртвая Луна. Кемсары больше не молятся о Его защите, но о том, чтобы Его разлагающийся труп не упал на них и не разрушил тот маленький мир, который у них остался."
