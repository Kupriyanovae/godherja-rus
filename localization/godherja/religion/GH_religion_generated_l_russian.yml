 orphecian_rite_desc:0 "Орфецианизм — это почитание трёх аспектов бога Орфеции: «Крови», «Камня» и «Воздуха», представленных соответственно солнцем, луной и молнией. Орфецианское общество придавало большое значение [Concept('magi','магам')|E] как представителям воли аспектов Орфеции, и конклавы Магов, представляющих каждый аспект, возглавляли большинство орфецианских царств.\n\nСамым известным орфецианским царством был [Concept('kartharadd','Империум Картарадд')|E], который вторгся в [Concept('aversaria','Аверсарию')|E] во время [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E] и завоевал провинцию Малькоя, достигнув западной Опахасии, прежде чем был остановлен. После их поражения аверсарианская расправа была быстрой, и орфецианская вера была искоренена везде, где её находили."
