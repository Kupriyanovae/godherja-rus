 saintly_order_desc_with_gc:0 "Монокерикси, отвергая божественность аавтократов и считая Святых единственным воплощением Чистейшего, тем не менее испытали сильное влияние традиционных [Concept('aversaria','аверсарианских')|E] культурных верований. Они полагают, что Святые явились в Аверсарии не случайно, а из-за высокой развитости аверсарианской культуры, которая повысила их способность следовать посланиям Святых и достичь чистоты. Таким образом, долг благочестивых агионистов — распространять как учения агионизма, так и аверсарианские знания среди низших народов мира, дабы все могли извлечь пользу из учений Святых."
 saintly_order_rite:0 "Монокерикси"
 saintly_order_rite_adherent:0 "Агионист"
 saintly_order_rite_adherent_plural:0 "Агионисты"
 saintly_order_rite_adj:0 "Монокерикси"
 saintly_order_rite_desc:0 "Монокерикси, отвергая божественность аавтократов и считая Святых единственным воплощением Чистейшего, тем не менее испытали сильное влияние традиционных [Concept('aversaria','аверсарианских')|E] культурных верований. Они полагают, что Святые явились в Аверсарии не случайно, а из-за высокой развитости аверсарианской культуры, которая повысила их способность следовать посланиям Святых и достичь чистоты. Таким образом, долг благочестивых агионистов — распространять как учения агионизма, так и аверсарианские знания среди низших народов мира, дабы все могли извлечь пользу из учений Святых."
 saintsmarch_desc_with_gc:0 "Воинственный Путь, ставящий войну за искоренение магии превыше любых странствий. Его приверженцы считают, что Марки не обретут мира, пока жив хотя бы один маг, и никогда не позволяли отговорить себя от этого убеждения."
 saintsmarch_faith:0 "Маршесвятойск"
 saintsmarch_faith_adherent:0 "маршесвятой"
 saintsmarch_faith_adherent_plural:0 "маршесвятые"
 saintsmarch_faith_adj:0 "Марш святых"
 saintsmarch_faith_desc:0 "Марш святых — это реваншистское движение, основанное ветераном-[Concept('antimagi','антимагов')|E], ставшим пророком, Вильдермуттом ден ва Сейсёнсом. Крайне милитаристское, оно ставит [GetTrait('way_of_nullification_follower').GetName( GetNullCharacter )] и [GetTrait('way_of_swords_follower').GetName( GetNullCharacter )] превыше всех прочих и утверждает, что мир может быть обретён только тогда, когда все [Concept('magi','маги')|E] будут мертвы. Хотя некоторое время его поддерживали несколько лордов, [war_of_the_noose|E] привела к упадку движения и его окончательному краху."
 saintsmarch_rite:0 "Обряд Маршесвятойска"
