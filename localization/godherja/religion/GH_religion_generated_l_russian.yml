 asred_desc_with_gc:0 "Асред — это вера в бога Асреда, Того, чьим молоком питается мир и под чьим бичом страдает. В асреддийской вере Асред родил весь мир и его народ из своих чресл, а затем воспитал их, чтобы они вечно питали его своей кровью.\n\nАсреддийские последователи традиционно милитаристичны, веря, что Асред не будет доволен, если они не будут постоянно проливать кровь других или свою собственную, будь то в битве или в ритуале."
