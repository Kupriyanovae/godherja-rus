 oirigan_desc_with_gc:0 "Ойриган — вера самоджитийцев, креольского народа южной [mayikrata|E]. Их предки были рабами, прислуживавшими [Concept('magi','магам')|E] в залах и башнях [Concept('mayikrata','Майикраты')|E]. Долгие годы они понемногу похищали тайные знания о [Concept('magic','магии')|E], пока не научились пользоваться ею сами. Когда шьялволк Кенвар вторгся в Майикрату и сокрушил могущество магов, рабы восстали и уничтожили угнетателей их же дарами. Ойриганцы поклоняются сонму божеств, о которых узнали из похищенных томов, и считают магию орудием, необходимым для сохранения свободы народа."
 oirigan_rite:0 "Оириган"
 oirigan_rite_adherent:0 "Оиригиан"
 oirigan_rite_adherent_plural:0 "Оиригианс"
 oirigan_rite_adj:0 "Оириган"
 oirigan_rite_desc:0 "Ойриган — вера самоджитийцев, креольского народа южной Майикраты. Их предки были рабами, прислуживавшими магам в залах и башнях Майикраты. Долгие годы они понемногу похищали тайные знания о магии, пока не научились пользоваться ею сами. Когда шьялволк Кенвар вторгся в Майикрату и сокрушил могущество магов, рабы восстали и уничтожили угнетателей их же дарами. Ойриганцы поклоняются сонму божеств, о которых узнали из похищенных томов, и считают магию орудием, необходимым для сохранения свободы народа."
