 distant_shore_cult_rite_desc:0 "Культисты Далёкого Берега — редкое явление на [Concept('aeras','Эрасе')|E], их редко можно увидеть за пределами разрозненных [Concept('shatteredisles','Островов')|E] их преданных последователей. Они проповедуют о земле героев глубоко под волнами, о далёком берегу, где ждёт рай. Только загадочный проповедник, известный как «Слушающий», может общаться с древними героями, живущими за берегом, — способность, передаваемая от проповедника к проповеднику через сложные ритуалы.\n\nКогда Слушающий наконец слышит их зов, самые добродетельные собираются на празднование своего последнего путешествия. С благословением Слушающего на защиту и руководством героев прошлого небольшой флот отправляется к Далёкому Берегу, проходя через земли, неизвестные даже самым опытным [Concept('aversaria','аверсарианским')|E] морякам, в великое приключение к земле за волнами."
