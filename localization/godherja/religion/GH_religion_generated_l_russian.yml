 aversarian_axiaotheaism_rite_desc:0 "Хотя презренный Эсхраэс погубил Аксиофею и её могущественнейших сторонников, обрушив на мир Фродброкну, у покойной императрицы до сих пор остаются последователи в бывших пределах империи. Они чтят её наследие почти как божественное и изображают противостояние с Эсхраэсом битвой добра со злом за судьбу мира. К несчастью, на этот раз зло одержало верх."
