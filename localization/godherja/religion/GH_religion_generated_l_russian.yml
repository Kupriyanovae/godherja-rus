 orispolj_rite_desc_with_gc:0 "Ораиспольский обряд является кодификацией и реформацией множества разрозненных вер сьялволькских верных. [SelectLocalization(Faith.MakeScope.Var('great_reformer').IsSet,Concatenate('Основанный радикальным шаманом ',Faith.MakeScope.Var('great_reformer').Char.GetFullNameNicknamed),'Основанный радикальным шаманом')], проповедник призвал к необходимости кодифицированной книги веры, а также строгой иерархии жрецов и шаманов для руководства верными. Часто считающийся вдохновлённым религиями марочников и структурными аспектами побеждённых вер [Concept('aversaria','аверсарианцев')|E], Ораиспольский обряд является слиянием дюжины различных сьялволькских вер с иерархической структурой, которую можно ожидать от современного и укоренившегося религиозного движения.\n\nНесмотря на структурную организацию, его основатель активно выступал против необходимости центральной организации для управления верой и вместо этого требовал «анархии веры», в которой каждый верный формировал бы свой собственный путь к спасению в финальной войне."
 orispolj_rite_faith:0 "Обряд Орисполя"
