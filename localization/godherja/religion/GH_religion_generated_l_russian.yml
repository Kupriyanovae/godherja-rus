 mukaasubat_rite_desc:0 "После краха [GetTitleByKey('e_far_eastern_mamuramat').GetNameNoTier] мукаасубиты уверовали, что Столпы Добродетели начали рушиться. Когда книги, оставленные упразднённым государством, начали гнить, благочестивые начали вырезать замены на больших каменных плитах и хоронить судей вместе с их судебниками. Это, по их мнению, снабдит их необходимыми материалами для восстановления столпов в загробной жизни. Однако по мере того, как столпы продолжают рушиться, освобождаются «кебан седжан» — духи добродетели, которые могут вселяться в благочестивых и добрых смертных и наделять их великой мудростью."
 nashadism_desc_with_gc:0 "Нашадизм оформился после [Concept('gh_massacre_of_the_ten_heirs','Резни десяти наследников')|E]. Однако многие заоранийские мыслители, такие как Арвашдан Ижакхет, вместе с местным населением уже начали ставить под сомнение давнюю веру в то, что легитимность передаётся исключительно по крови. Недовольство как прошлыми, так и нынешними правителями привело их к утверждению, что борьба и праведность единолично определяют право правителя на власть.\n\nПо иронии судьбы, в попытке завоевать больше сторонников по всему [Concept('amsar','Амсару')|E] и укрепить своё политическое положение, они сплотились вокруг Нашада. Который был якобы выжившим сыном старшего наследника канамсара Парашада, и отвергли «узурпаторшу» канамсару Тову. Для нашадийцев законная линия престолонаследия проходила через Радеша и его сына Нашада, которого они считали предназначенным вести их к предсказанной победе. История повторилась, когда после его смерти и провала [Concept('gh_emerald_rebellion','Изумрудного восстания')|E] его самые рьяные последователи настаивали на том, что он спрятал ребёнка, который однажды вернёт себе законное право."
