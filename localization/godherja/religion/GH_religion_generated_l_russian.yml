 ixsian_mysteries_rite_desc:0 "Икс, некогда центр наместничества Южных Имперских островов при павшей Аутократе, удержал власть над областью благодаря прежним законным притязаниям, относительному порядку и процветанию на фоне распада империи. Его власть была лишь ненадолго прервана находкой Семи печатей Сордорнакс'моровира и связанного с ними Чёрного свитка. Изучение реликвий быстро свело учёных Икса с ума: меметическое проклятие охватило руководство города.\n\nНесмотря на бессвязное безумие правителей и их новообретённую одержимость бесконечным свитком и снятием Печатей (причём всякий, кто умел читать начертанный на них запретный язык, рисковал заразиться безумием), жители Икса сохранили добротное управление и порядок во владениях. Многие острова добровольно присягнули городу, не обращая особого внимания на порой раздающиеся на дипломатических встречах нечеловеческие визги и заклинательные напевы."
 iyetrande_desc_with_gc:0 "Иетрандены — радикальная секта, возникшая после крушения знати [Glossary('Кратемезина','crater_encyclopedia_desc')] вслед за Фродброкной. Они отрицают божественную природу музыки, считая звук помехой для обрядов, а безмолвие — первым шагом к достижению [GetBuilding('01_sophocos').GetName] через созерцание. Музыкантов они считают подверженными демоническому влиянию и относятся к ним враждебно. Тем не менее они продолжают изучать тайны [aspect_hymns] через совместные молитвы и песни, которые можно услышать лишь посредством магии [aspect_dream]."
