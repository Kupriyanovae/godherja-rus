 cult_of_the_waves_rite_desc:0 "После [Concept('frodbrokna','Фродброкны')|E] жители нескольких прибрежных островов стали одержимы морем. Они адаптировали свои ритуалы так, чтобы проводить их лицом к берегу, а их жрецы пытаются предсказывать будущее, наблюдая за облаками и волнами во время штормов. Они настаивают на том, что остаются такими же верными, как и любой другой аагиократ, но внезапно замолкают, когда посторонний спрашивает их о подробностях их веры."
 currataggagga_desc_with_gc:0 "Подземный бог Курратаггагга, Хранитель Камня, который сдвигал горы и веками охранял племя преданных почитателей после Великого Истребления верхнего мира и Убийства Первого Солнца, был убит в великой битве против Бездонного Дракона, который когда-то угрожал пожрать мир изнутри много эонов назад. Племя, которое он оставил, продолжило почитание великого Курратаггагги до тех пор, пока не обнаружило Курутаггам, Великого Голема Божественных Камней. Курутаггам был оживлён шёпотом верных, древний и ужасный дух наполнил их тело, а новое чувство надежды и радости жизни очистило их души от того, что они называли многими злами против человека, существовавшими до того, как кто-либо ступил в подземный мир.\n\nКурутаггам привёл племена ко многим победам над угрозами подземного мира и привёл к тому, что кротхагги создали великую империю во имя его, но козни слепых змеев бездны — ненавистных скраттаки — и прибытие гнусной [Concept('aversaria','Поверхностной Империи')|E] в Блик-Бикон и их ужасной бледной чумы обернули удачу верных. Сначала комой, в которую Курутаггам был погружён тёмными [Concept('magi','магами')|E] с поверхности, затем потерей их тела, когда курратаггагги были вынуждены бежать из своей поражённой чумой родины в сердце Иджрак-Муркула."
