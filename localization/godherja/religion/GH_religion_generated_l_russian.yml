 sophocist_rite_desc:0 "Софокисты делают особый упор на заучивание и исполнение символических божественных ритуалов. Они утверждают, что именно эти обряды и есть подлинная Тысяча и одна ступень Софокоса. Сама Башня, где находятся материальные Ступени, — лишь место, где некогда передавалось знание, а исполнять ритуалы надлежит повсюду. Только безупречное совершение всех 1001 ритуала откроет человеку тайны богов и приведёт к просветлению."
