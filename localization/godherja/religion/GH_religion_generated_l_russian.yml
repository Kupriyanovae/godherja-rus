 beshanida_desc_with_gc:0 "Считаемое реформистским течением в раннем постпророческом заоранианизме, бешаниды сегодня запоминаются главным образом своим абсолютным неприятием любого обожествления пророческой линии, в отличие от растущего культового движения, которое терпелось, если не поощрялось, первой дочерью канамсара Аушедара, Мехревой. Название бешанида происходит от загадочной фигуры, известной как [Concept('gh_last_witness_conflict','Последний Свидетель')|E], хотя о происхождении, намерениях или исчезновении этой фигуры мало что известно.\n\nСчитается, что движение повлияло на некоторые литургические упрощения и, безусловно, сыграло роль в иконоборческих указах, изданных при канамсаре Ша'Нире, которая после исчезновения фигуры позиционировала себя как центральный авторитет внутри движения. Секта постепенно потеряла свою целостность и вскоре угасла."
