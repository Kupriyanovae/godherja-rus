 cnevobarthane_faith_adj:0 "Теугомбрийство"
 cnevobarthane_faith_desc:0 "Пылкие монотеисты, глашатаи [Concept('cnevobarthane','Кневобартана')|E] являются исконной религиозной сектой теугомбрийского народа — хотя обращение извне теоретически возможно, исторически оно было почти неслыханным.\n\nГлашатаи верят, что люди живут в циклические эпохи, где роды людей рождаются, процветают долгие века, а затем исчезают в неизвестной и, возможно, апокалиптической судьбе. Они поклоняются Кневобартану, Первому Человеку Нынешнего Мира, который родился полностью сформированным из последнего уцелевшего камня последнего уцелевшего руинного дома исчезнувших людей Мира Предыдущего. Затем он создал всё человечество, населив [Concept('aeras','Эрас')|E] своим потомством. Однако многие из его детей, недовольные и завистливые, отвернулись от Него. Лишь избранные немногие проглотили свою гордыню и были благодарны своему Отцу, выбрав чтить его и его законы. Те, кто следует за ним, рассказывают о его [Concept('cenvobarthanes_cycle_of_rebirth','жертве')|E], которая позволила человечеству избежать участи мира предыдущего."
