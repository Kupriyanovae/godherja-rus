 katharnalmic_desc_with_gc:0 "Боги-Близнецы наблюдают за теми, кто живёт в гармонии с природой, и поэтому неподатливый камень, отвергающий гармонию, должен быть вырезан и разбит для этой цели.\n\nТак говорят среди [Glossary('катарналмиков','GH_KATHARNALMIC_GLOSS')], чьи последователи обитают в том самом камне, который они обрабатывают. Верные этого пути имеют долгую историю защиты от тех, кто стремится изгнать их из Облачных лесов [Glossary('Чан Кьявкорлаку','GH_CHAN_KYAWKORLACU_GLOSS')] — что дарует им великое рвение, служащее щитом от искушения следовать путями своих [Concept('great_betrayal','языческих предков')|E]."
 katharnalmic_rite:0 "Катарналмик"
 katharnalmic_rite_adherent:0 "Сепаттанец"
 katharnalmic_rite_adherent_plural:0 "Сепаттанцы"
 katharnalmic_rite_adj:0 "Сепаттан"
 katharnalmic_rite_desc:0 "Боги-близнецы оберегают тех, кто живёт в согласии с природой. А потому неподатливый камень, отказывающийся от гармонии, следует высечь и раздробить во имя этой цели.\n\nТак учат катарналмики, чьи жилища устроены прямо в камне, который они обрабатывают. На протяжении веков последователи Пути отражали попытки изгнать их из Облачных лесов Чан-Кьявкорлаку. Эта долгая борьба породила особое рвение, защищающее их от соблазна возвратиться к обычаям языческих предков."
 kathsiti_desc_with_gc:0 "Катситийцы, в отличие от других [Concept('wardenism','варденитских')|E] сект, считают, что между церковью и государством должно быть полное разделение, поскольку мирские дела развращают истинную духовную природу церкви. На деле это привело к появлению чрезвычайно независимой и политически влиятельной группы катситийских священников, диктующих правила светским владыкам."
