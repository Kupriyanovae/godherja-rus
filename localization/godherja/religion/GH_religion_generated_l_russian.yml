 sokaloma_rite_desc:0 "Сокалома — это традиционная вера такопара, система верований, согласно которой звёзды являются фундаментальным элементом человеческого существования. Те, кто почитает Сокалому, или «небесный танец», верят, что каждая звезда представляет собой прошлое и будущее бытие человека, и что когда человек умирает, он оставляет свою предыдущую душу среди небес, чтобы возродиться из той же самой материи. Сокаломцы считают, что эта ткань сознания проявляется в виде фигур, более похожих на традиционных божеств, представленных различными созвездиями ночного неба. Судьба человека и его духи-хранители определяются при рождении через сложные астрологические ритуалы, которые можно понять только после долгих лет тщательного изучения."
 sophocist_desc_with_gc:0 "Софокисты делают особый упор на заучивание и исполнение символических божественных ритуалов. Они утверждают, что именно эти обряды и есть подлинная Тысяча и одна ступень [GetBuilding('01_sophocos').GetName]. Сама [Concept('the_towers','Башня')|E], где находятся материальные Ступени, — лишь место, где некогда передавалось знание, а исполнять ритуалы надлежит повсюду. Только безупречное совершение всех 1001 ритуала откроет человеку тайны богов и приведёт к просветлению."
