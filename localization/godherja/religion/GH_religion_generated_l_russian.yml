 iyetrande_rite_desc:0 "Иетрандены — радикальная секта, возникшая после крушения знати Кратемезина вслед за Фродброкной. Они отрицают божественную природу музыки, считая звук помехой для обрядов, а безмолвие — первым шагом к достижению Софокоса через созерцание. Музыкантов они считают подверженными демоническому влиянию и относятся к ним враждебно. Тем не менее они продолжают изучать тайны песнопений через совместные молитвы и песни, которые можно услышать лишь посредством магии сновидений."
