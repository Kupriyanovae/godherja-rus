 harthahi_desc_with_gc:0 "Хартахийская секта возникла в ответ на предполагаемую слабость [Concept('wardenism','варденитов')|E] и убеждение, что варденитские секты слишком терпимы к чужакам. Хартахийцы утверждают, что Мёртвый Бог заключён в [Concept('sarradon','Саррадоне')|E], и всё зло, совершаемое на его земле, является прямой попыткой освободить его обратно в мир. Таким образом, Саррадон должен быть свободен, а его народ должен объединиться против тех, кого хартахийцы считают чужеземными захватчиками — а именно агионистов, [Concept('aversaria','аверсарианцев')|E] и [Concept('marchers','марочников')|E]. Будучи воинственными, они тем не менее довольно плюралистичны и больше озабочены изгнанием враждебных иностранцев, чем уничтожением их населения."
