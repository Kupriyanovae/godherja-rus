 mafida_desc_with_gc:0 "Основанная недовольными крестьянами, Мафида считает, что все люди имеют право толковать и переводить [Concept('gena_tinngir','Священные тексты')|E] — от самого низкого крестьянина до самого высокого короля. Из-за большого разнообразия толкований Священных текстов, допускаемых мафидами, они были объявлены еретиками всеми остальными манатами, даже если большинство мафидов придерживаются сходных с основным течением манатизма верований."
