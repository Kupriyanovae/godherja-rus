 kakarataki_faith_desc:0 "Какаратакцы вошли в известный мир вместе с сьялволькской коалицией. Из-за веры в то, что Солнце и Луна — два бога, запертые в вечной борьбе, они должны благоволить Солнцу и сражаться против Луны. Жрецы ухаживают за садами священных растений, выращенных животворящим светом Солнца, на ночных существ охотятся, но никогда не едят, и жертвоприношения животных Солнцу должны совершаться часто, чтобы поддерживать его силу в вечной битве."
