 thalthit_thalthun_rite_desc:0 "Тальтунийцы верят, что судьбами людей распоряжаются тридцать три ангела, каждый из которых ведает своей стороной земного бытия — как благой, так и пагубной. Рождение и смерть, удача и голод — всё это дело рук того или иного ангела; поэтому каждый тальтуниец с детства знает, кого из них следует благодарить, а кого умилостивлять. Над всеми тридцатью тремя возвышается величайший ангел, обитающий внутри Софокоса."
