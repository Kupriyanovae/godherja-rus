 cleansed_ones_desc_with_gc:0 "На краю островных остатков [Concept('aversaria','Аверсарии')|E] древний культ Очищенных вновь возник после [Concept('frodbrokna','Фродброкны')|E], проповедуя новое послание о восстановлении в условиях всеобщей анархии. Несколько [Concept('shatteredisles','Островов')|E] попали под их влияние через кровавые восстания и жестокие завоевания, часто сопровождаемые массовыми чистками тех, кто считается нежелающим или неспособным понять бедствие, которое, по мнению последователей, было порождено тысячелетием аверсарианской деградации.\n\nВерующие говорят о древнем ритуале, известном только как Кровавое Испытание — испытании, которое позволяет [Concept('magi','магам')|E] очиститься, искоренить ложные верования, очистить свою кровь и открыть путь к Чистейшему. Говорят, что этот путь — благословение от высшей фигуры культа, так называемого «Гласа Чистейшего». Немногие изгнанники, покинувшие культ после Фродброкны, говорят о развращённом ритуале самобичевания, полном превосходстве Магов и широком порабощении простолюдинов, не обладающих [Concept('magic','магией')|E]."
