 post_imperial_deviationists_desc_with_gc:0 "Пока империя обращалась в пепел, а варвары-переселенцы захватывали Орайсполь, Имперский культ фактически прекратил существование, а вместе с ним — механизм исполнения светских и религиозных законов. Кое-где местное жречество многочисленных культов Аагиократии пыталось овладеть быстро распадающейся верой, однако чаще право устанавливать религиозные правила захватывали провинциальные военачальники. В основном посредством [deviationism|E] полководцы на просторах бывшей империи заполняли пустоты в умершей правовой системе, просто объявляя себя аутократирами и устанавливая собственное местное «отклонение» от имперских законов. Разрушение единства права вызвало стремительный упадок жречества Аагиократии, из которого к началу XIV века ИС выросло множество [Glossary('староимперских','GH_OLD_EMPIRE_GLOSS')] культов."
