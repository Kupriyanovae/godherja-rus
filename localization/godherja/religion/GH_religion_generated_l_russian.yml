 imperii_desc_with_gc:0 "Империи'а — собирательное название разрозненных языческих верований древних этепезейцев и, возможно, их прародителей из племени Этапексе. Их культ прежде всего связан с поклонением различным руинам и стремлением восстановить древние храмы. Приверженцы верят, что в сооружениях могут самопроизвольно поселяться духи либо возникать там благодаря многим поколениям обитателей. Пантеон империи'а огромен, но все его почитатели признают [Concept('aersanon','Красного Владыку')|E] — повелителя всех духов и строителя великих руин мира, некогда, как принято считать, населявшего [sea_tower|E]."
 imperii_rite:0 "Империйск"
 imperii_rite_adherent:0 "Империец"
