 sheharddi_rite_desc:0 "Истоки веры шехарддов окутаны тайной, и учёные спорят о том, является ли она синкретизмом нескольких [Concept('sarradon','саррадонских')|E] вер, культом единого бога, отделившимся от более крупной политеистической религии, или же уцелевшими остатками более древней веры. Они верят, что верховный бог Элой, создатель небес, сотворил расу под названием Маликийя, или Вестники. Старший из них, Эйр-Шайтан, создал ещё более низшую расу существ — людей — чтобы те служили ему и поклонялись ему и его шести помощникам как существам, превосходящим их отца. Это привело к изгнанию человечества из рая после [Concept('kalnaih','Кальнайха')|E], и только ведя честную и праведную жизнь, можно вернуться на небеса, чтобы вечно поклоняться Ему."
 shehzarani_desc_with_gc:0 "Многие пытались объяснить сходство и примирить противоречия между заоранистской и шехардийской верами. Шехзаранизм представляет древнее соединение этих традиций. Он учит, что единый Всевышний Бог известен под бесчисленными именами разных эпох — ЭЛОИ, Заоран и другими. Его последователи верят, что это единственное божественное существо никогда не переставало направлять человечество, посылая во все времена множество пророков из рода [Concept('gh_amsari_first_dreamers','Первых Сновидцев')|E], Маликийа. Каждый пророк говорил на языке своего народа и своего века, но все возвещали вечную истину праведности в борьбе с обманом. Отвергая первородную ложь Эйр'Шайтана, верующие могут не только вновь снискать небесную милость Бога, но и помочь Ему одержать окончательную предсказанную победу над всяким обманом."
