 shattered_stars_cult_desc_with_gc:0 "После [Concept('frodbrokna','Фродброкны')|E] последователи Священных Звёзд стали свидетелями самой травмирующей трагедии — разрушения [Concept('aervalr','Эрвала')|E], древних чертогов самых любимых героев. Когда её разбитые руины падают на [Concept('aeras','Эрас')|E], их последователи озлобились, проклиная тех, кто обладает магической силой, и изгоняя их со своих [Concept('shatteredisles','Островов')|E]. Последователи проповедуют, что только через большее поклонение древним пантеонам — добровольное или нет — они могут быть спасены от судьбы вечной разобщённости и угасания света."
 shattered_stars_cult_rite:0 "Разбито-звёздн"
 shattered_stars_cult_rite_adherent:0 "Культист Разбитых Звёзд"
 shattered_stars_cult_rite_adherent_plural:0 "Культисты Разбитых Звёзд"
