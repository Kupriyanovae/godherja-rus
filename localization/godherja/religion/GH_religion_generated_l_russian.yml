 cnevobarthane_rite:0 "Кневобартаническ"
 cnevobarthane_rite_adherent:0 "Глашатай"
 cnevobarthane_rite_adherent_plural:0 "Глашатаи"
 cnevobarthane_rite_adj:0 "Теугомбрийство"
 cnevobarthane_rite_desc:0 "Пылкие монотеисты, глашатаи [Concept('cnevobarthane','Кневобартана')|E] являются исконной религиозной сектой теугомбрийского народа — хотя обращение извне теоретически возможно, исторически оно было почти неслыханным.\n\nГлашатаи верят, что люди живут в циклические эпохи, где роды людей рождаются, процветают долгие века, а затем исчезают в неизвестной и, возможно, апокалиптической судьбе. Они поклоняются Кневобартану, Первому Человеку Нынешнего Мира, который родился полностью сформированным из последнего уцелевшего камня последнего уцелевшего руинного дома исчезнувших людей Мира Предыдущего. Затем он создал всё человечество, населив [Concept('aeras','Эрас')|E] своим потомством. Однако многие из его детей, недовольные и завистливые, отвернулись от Него. Лишь избранные немногие проглотили свою гордыню и были благодарны своему Отцу, выбрав чтить его и его законы. Те, кто следует за ним, рассказывают о его [Concept('cenvobarthanes_cycle_of_rebirth','жертве')|E], которая позволила человечеству избежать участи мира предыдущего."
 cnevobarthane_rite_old:0 "Старокневобартаническ"
 cnevobarthane_rite_old_adherent:0 "Старый хизлаксар"
 cnevobarthane_rite_old_adherent_plural:0 "Старые хизлаксары"
 cnevobarthane_rite_old_adjective:0 "Старый Кневобартанизм"
 coast_desc_with_gc:0 "«Прибрежный путь» представляет собой исключительно свободное собрание нескольких десятков отдельных вер, распространённых на побережье Коникменера, а также в юго-восточном [chevalie|E]. Будучи слиянием исконных верований в океанические и речные пантеоны с Жизненным путём, он пользовался несколькими столетиями относительной изоляции, прежде чем был жестоко искоренён Водером Бруданом из Коникменера в 772 году от И.С. в рамках его попыток централизовать королевство. Поскольку большая часть веры была уничтожена, а в Шевалье не было особого интереса или нужды в ней, шевальенцы вскоре после этого начали собственный процесс искоренения исконных вер, хотя отдельные очаги упорно выживали на протяжении веков."
 coast_rite:0 "Прибрежный путь"
 coast_rite_adherent:0 "Идущий по пути"
 coast_rite_adherent_plural:0 "Идущие по пути"
 coast_rite_adj:0 "Прибрежный путь"
 coast_rite_desc:0 "«Прибрежный Путь» — весьма рыхлое объединение нескольких десятков отдельных верований, возникших на побережье Конийкменера и юго-востоке Шевалье. Сочетая местное почитание морских и речных божеств с учением Пути Жизни, оно несколько столетий существовало в относительной изоляции. Но в 772 году ИС Водер Броудан из Конийкменера жестоко подавил его, стремясь централизовать своё государство. Поскольку большая часть верующих была уничтожена, а в Шевалье это учение не вызывало особого интереса, вскоре и шевальенцы принялись искоренять исконные веры. И всё же разрозненные общины упорно выживали на протяжении столетий."
 conclave_marma_desc_with_gc:0 "$MARMA_GLOSS$"
 conclave_marma_rite:0 "Обряд Мармы"
 conclave_marma_rite_adherent:0 "Опахасиец"
 conclave_marma_rite_adherent_plural:0 "Опахасийцы"
 conclave_marma_rite_adj:0 "Конклав Опахасии"
 conclave_marma_rite_desc:0 "Марма, Мать богов и супруга Старого Ткача Прохена, нередко отождествляется с самим Аэрасом. Её нрав непостоянен: она дарует обильные урожаи и насылает губительный голод, и всякому, кто осквернит её великие владения, придётся испытать последствия. Подобно мужу, Марма не сражалась рядом с детьми в войне против Небесных богов и потому в целом безразлична к человеческим судьбам. Тем не менее множество обрядов посвящено попыткам снискать её благосклонность."
 conclave_pekielo_desc_with_gc:0 "$PEKIELO_GLOSS$"
 conclave_pekielo_rite:0 "Обряд Пекиело"
 conclave_pekielo_rite_adherent:0 "Опахасиец"
 conclave_pekielo_rite_adherent_plural:0 "Опахасийцы"
 conclave_pekielo_rite_adj:0 "Конклав Опахасии"
 conclave_pekielo_rite_desc:0 "Ослепнув в войне с Небесными богами, Пекиело посвятил себя познанию. Ворон Норус, помнящий всё, что случилось с начала времён, шепчет ему в левое ухо, а сова Нора, которой ведомо всё грядущее, — в правое. Пекиело не властен ни над прошлым, ни над будущим, но заносит их в свою «Книгу дней». Ни её содержание, ни местонахождение неведомы даже самому Велосу. В одной из саг шаман отправляется на поиски легендарного тома и вопреки всему отыскивает пещеру Пекиело. К величайшему удивлению гостя, божество без колебаний вручает ему книгу. Однако уже после нескольких прочитанных страниц шамана охватывает такой ужас, что он в отчаянии вырывает себе глаза, а его помрачённый разум обращает слова в безумные вопли."
 conclave_prohen_desc_with_gc:0 "$PROHEN_GLOSS$"
 conclave_prohen_rite:0 "Обряд Прохена"
 conclave_prohen_rite_adherent:0 "Опахасиец"
 conclave_prohen_rite_adherent_plural:0 "Опахасийцы"
 conclave_prohen_rite_adj:0 "Конклав Опахасии"
 conclave_prohen_rite_desc:0 "Как верят шьялволки, суровый Прохен сплетает и обрывает нити наших судеб. От Мармы у него родились боги Велос, Пеквон, Пекиело, Варпалис, Замистра и Уреха. Однако вместо поисков новых земель вместе с детьми Прохен ушёл ещё глубже под землю, ниже чертогов, где обретают покой души умерших. Из-за своего затворничества он редко появляется в сказаниях шьялволков, а если появляется, то в образе слепого отшельника с белой как мел кожей и волосами до пят. Его таинственное могущество побуждает некоторых считать именно Прохена верховным богом. Особенно это относится к груэлокинам, посвятившим Старому Ткачу множество празднеств и обрядов."
 conclave_ureha_desc_with_gc:0 "$UREHA_GLOSS$"
 conclave_ureha_rite:0 "Обряд Урехи"
 conclave_ureha_rite_adherent:0 "Опахасиец"
 conclave_ureha_rite_adherent_plural:0 "Опахасийцы"
 conclave_ureha_rite_adj:0 "Конклав Опахасии"
 conclave_ureha_rite_desc:0 "Уреха, младшая сестра Велоса и единственная девочка среди его братьев и сестёр, занимает одно из важнейших мест в мифологии шьялволков. Устав от постоянных споров братьев о том, каким должен стать мир, она решила создать себе более мирных спутников и собственными руками вылепила первых людей. Но вскоре другие боги начали использовать её творения в своих распрях. Потрясённая насилием, обрушившимся на её народ, Уреха бежала в ещё неведомые земли. Она не подозревала, что за ней следят безжалостные Небесные боги, которые похитили её и увели к себе за облака. Братья были так поглощены враждой, что не заметили её исчезновения, пока не сдвинулись горы. К тому времени Уреха успела привыкнуть к новому жилищу, но продолжала тосковать по земле под небом.\n\nМежду Небесными и Земными богами разразилась жестокая, но не принёсшая победы война, в которой человечество сыграло решающую роль. В конце концов стороны договорились, что полгода Уреха будет проводить в Небесном царстве, а остальные полгода — внизу. Её возвращение в Срединный мир отмечают величайшим праздником шьялволков — приходом весны."
 conclave_varpalis_desc_with_gc:0 "$VARPALIS_GLOSS$"
 conclave_varpalis_rite:0 "Обряд Варпалиса"
 conclave_varpalis_rite_adherent:0 "Опахасиец"
 conclave_varpalis_rite_adherent_plural:0 "Опахасийцы"
 conclave_varpalis_rite_adj:0 "Конклав Опахасии"
 conclave_varpalis_rite_desc:0 "Скромный Варпалис, как верят сьялволки, обитает во всяком озере, реке и водном русле, что омывают их родину. Долг каждого рыбака — оставлять часть улова или серебряную монету Варпалису, дабы тот полнил рыбой воды, где они промышляют. Он же прибирает души тех, кому не нашлось могилы на суше, а мертворожденных младенцев обращает в выдр, кои, как поют в сагах, оберегают свои бывшие семьи со стороны воды. Несмотря на такую заботу, женам заказано купаться в одиночку, ибо Варпалис славится своим распутным нравом и стал отцом множества полубогов в сьялволькских легендах."
 conclave_velos_desc_with_gc:0 "$VELOS_GLOSS$"
 conclave_velos_rite:0 "Обряд Велоса"
 conclave_velos_rite_adherent:0 "Опахасиец"
 conclave_velos_rite_adherent_plural:0 "Опахасийцы"
 conclave_velos_rite_adj:0 "Конклав Опахасии"
 conclave_velos_rite_desc:0 "Согласно преданию, Велос первым увидел свет Срединного мира. Братья и сёстры, тоже стремившиеся покинуть чертоги Прохена, избрали его предводителем похода, и вскоре Велос принял титул верховного бога. Для шьялволков он — отец и покровитель, воплощение их самых почитаемых добродетелей: храбрости, честности и уверенности. Велос не просто бог охоты, но страж и защитник своего народа. Его имя с одинаковым почтением призывают на поединках чести, коронациях и охотах. Возможно, величайшим его деянием стало создание первого лука из похищенных волос Небесного бога. Этим искусством он наградил человечество за службу в войне."
 conclave_zamistra_desc_with_gc:0 "$ZAMISTRA_GLOSS$"
 conclave_zamistra_rite:0 "Обряд Замистры"
 conclave_zamistra_rite_adherent:0 "Опахасиец"
 conclave_zamistra_rite_adherent_plural:0 "Опахасийцы"
 conclave_zamistra_rite_adj:0 "Конклав Опахасии"
 conclave_zamistra_rite_desc:0 "Замистра, младший из сыновей Прохена, почитается не за остроту клинка, а за живость ума. Его часто изображают странствующим бардом, и всякий шьялволк обязан гостеприимно встречать незнакомцев: вдруг среди них окажется сам Замистра? Его считают первым поэтом, научившим народ шьялволков искусству стихосложения. Замистра часто предстаёт хитрецом, предпочитающим плащ и кинжал прямодушным и упрямым решениям, обычным для шьялволков. Поэтому он словно противоречит многим добродетелям, дорогим его почитателям, и особенно любим теми, кто стоит за пределами привычных устоев общества: купцами и магами."
 conclavian_rite_desc_with_gc:0 "Среди островитян Расколотого побережья древние обычаи мёртвых империй долго процветали, синкретизированные с новыми богами и монархами. Для многих Святое Королевство Велоса было бы лишь продолжением этой долгой традиции, привязывающей их местные верования к новой власти."
 conclavian_rite_faith:0 "Конклавский обряд"
 conclavian_rite_faith_adherent:0 "Конклавианец"
 conclavian_rite_faith_adherent_plural:0 "Конклавианцы"
 conclavian_rite_faith_adj:0 "Конклавский Обряд"
 conclavian_rite_faith_desc:0 "Среди островитян Расколотого побережья древние обычаи мёртвых империй долго процветали, синкретизированные с новыми богами и монархами. Для многих Святое Королевство Велоса было бы лишь продолжением этой долгой традиции, привязывающей их местные верования к новой власти."
