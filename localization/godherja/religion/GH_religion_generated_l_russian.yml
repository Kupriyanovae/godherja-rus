 black_abyss_cult_desc_with_gc:0 "Кидунависты верят в Кидунаву — море-под-морем, которое является домом для демонов и злобных божеств, замышляющих против всей жизни над водой. Бедствия, случающиеся в море, воспринимаются как наказание от тех, кто обитает внизу, что побуждает последователей постоянно искать умиротворения, следуя множеству эзотерических суеверий. Известно, что некоторые последователи приращивают к своим телам части морских существ, веря, что те, кто носит часть глубин, не должны бояться глубин."
