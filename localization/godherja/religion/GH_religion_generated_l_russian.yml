 blood_veneration_desc_with_gc:0 "Один из древнейших культов [aversaria|E], такой же старый, как и эрсодиаксинизм, с несколькими высокопоставленными последователями. Считающийся прародителем аверсарианского кровопочитания, Культ Крови почитает кровь как святое отражение силы богов и строго верит, что мир принадлежит только святейшим [Concept('magi','магам')|E] Царям, ибо у них чистейшая кровь. Как таковые, последователи стремились создать совершенного Мага превыше всего, причём некоторые прибегали к крайним методам, начиная от браков внутри собственной семьи до очищения нечистых, часто во вред и к ужасу собственного населения."
