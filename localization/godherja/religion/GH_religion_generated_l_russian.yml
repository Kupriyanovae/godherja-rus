 eurujiyya_desc_with_gc:0 "Эуруджийин следуют поздним откровениям [Concept('ritualism','пророка-ритуалиста')|E] Омахийина ибн Сашиля, которые он получил, когда ангелы вознесли его на вершину [GetBuilding('01_sophocos').GetName]. Там ангелы поведали, что его прежние наставления исходили от злых существ, стремившихся вырваться на поверхность [Concept('aeras','Аэраса')|E]. Тогда Омахийин выступил против эамиккиин — секты, которую сам же основал, — и вместе с учениками обратился против приверженцев своего старого учения, даже сражаясь бок о бок с [Concept('wardenism','Хранителями')|E]. Хотя два течения противостоят друг другу, Омахийина на деле по-прежнему признают пророком обоих."
 eurujiyya_rite:0 "Еуруджи'а"
 eurujiyya_rite_adherent:0 "Еуруджи"
 eurujiyya_rite_adherent_plural:0 "Еуруджииин"
 eurujiyya_rite_adj:0 "Еуруджи"
 eurujiyya_rite_desc:0 "Эуруджийин следуют поздним откровениям пророка-ритуалиста Омахийина ибн Сашиля, которые он получил, когда ангелы вознесли его на вершину Софокоса. Там ангелы поведали, что его прежние наставления исходили от злых существ, стремившихся вырваться на поверхность Аэраса. Тогда Омахийин выступил против эамиккиин — секты, которую сам же основал, — и вместе с учениками обратился против приверженцев своего старого учения, даже сражаясь бок о бок с Хранителями. Хотя два течения противостоят друг другу, Омахийина на деле по-прежнему признают пророком обоих."
 fallen_star_desc_with_gc:0 "Загадочный культ, сосредоточенный вокруг чудовищной [Concept('fallen_star','Падшей Pвезды')|E], который проповедует, что просветление может быть достигнуто только через осознание бессмысленности жизни на [Concept('aeras','Эрасе')|E], в то время как истинный смысл можно найти в поклонении самой Падшей Звезде. Те, кто не принимает это, должны быть стёрты в пыль и удалены из этого мира, ибо они — распространители нынешнего состояния человечества.\n\nХотя широко не известно, где находится Падшая Звезда — или даже существует ли она на самом деле, — благочестивые знают, что по-настоящему умелые и достойные ревнители великой Звезды будут призваны в её логово во сне, чтобы получить могущественное благословение её магии и быть посвящёнными в «истинный культ»."
