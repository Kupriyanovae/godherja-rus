 thysia_desc_with_gc:0 "Тисианцы почитают $saint_thysia_link$;medium Святую Тисию#!, прославленную целительницу, которая была казнена за самоотверженное лечение как господ, так и рабов. Их символ — чаша, наполненная кровью, что символизирует как практику кровопускания, так и жертву Тисии."
