 grotticand_rite_desc:0 "Хранители [GetTitleByKey('b_grotto_of_the_golden_martyrs').GetNameNoTier], святейшего места во всём подземном мире, гроттиканды основали великие фермы и священные храмы в том, что когда-то было величайшим из городов под землёй. Тысячи странных и [Concept('aelfir','чуждых')|E] тел, найденных в Гроте, облачённых в странные золотые доспехи, которые невозможно выковать руками человека, считались древними стражами Грота, существовавшими ещё до того, как человек ступил в подземный мир.\n\nСчитая себя наследниками этого великого наследия и страшась возвращения варварских существ, которые, несомненно, убили древних стражей, гроттиканды посвятили себя сохранению этого древнего места и защите его величайшей магией, которую могли произвести их племена. С этой целью тела этих некогда великих воинов часто получали новую жизнь, чтобы помогать как в войне, так и в мире. Хотя многие находят их странный облик тревожным, и хотя не один из них обретал безумное подобие своей былой жизни и устраивал резню, прежде чем его изгоняли, великое изобилие Грота и помощь [Concept('undead','нежити')|E] позволили гроттикандам создать три великие империи задолго до того, как какой-либо захватчик проник из [Concept('aversaria','неведомых земель')|E]."
 grotticand_rite_old:0 "Старо-гроттикандск"
 grotticand_rite_old_adherent:0 "Старый гроттикандец"
