 gestanwoder_faith_desc:0 "Гестанводеры некогда правили коникменерскими болотами, но затем были вытеснены захватчиками-путеходцами. Они выживают лишь в самых глубоких и труднодоступных болотах, цепляясь за свою исконную веру и веря, что это лишь очередное наказание от жестоких богов. Но некоторые обратились к тёмным и неведомым созданиям в местах, куда даже бесстрашные не осмеливаются ступать, стремясь к кратким мгновениям неведомой силы в своих коротких жизнях..."
