 venalmic_rite_desc:0 ""
 vinderon_desc_with_gc:0 "Никто не знает точно, какой дух движет умами его последователей. Никто не знает, чему они поклоняются. Никто даже не знает, откуда взялось слово «Виндеон». Всё, что известно, — это его связь с [Concept('the_towers','Башней')|E], той первобытной чудовищностью из циклопического камня, которая стояла в пустынных пустошах ещё до того, как человек ступил туда. Они одержимы ею и любыми подобными Башнями по всему миру. Неизвестно, что они хотят сделать с этими Башнями, но никто не хочет это выяснять."
