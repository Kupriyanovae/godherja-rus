 bekashai_faith_desc:0 "Бекашайцы считают, что те, кто убил Всевышнего, должны быть привлечены к справедливости, веря, что только через обретение мести Его тело может быть найдено. Они переориентировали свои усилия на поиски по всему миру, игнорируя поиски самого Его тела и вместо этого выслеживая Его убийц, надеясь однажды отомстить за их древний грех. Было предложено множество теорий о Его смерти, но большинство склонно просто обвинять в этой давней трагедии своих нынешних врагов."
