 labaqiri_desc_with_gc:0 "Ответвление странунийской веры, практикуемое торговцами Киринарт, которые позже стали дафанитами, лабакириты верят, что источник силы внутри Священной Горы Дахангона — не кто иной, как сам Мёртвый Бог, заключённый в её недоступных глубинах.\n\nУнаследовав музыкальные верования странунийцев, практикующие эту секту имеют множество защитных песнопений и песен, а во время солнцестояний и затмений устраивают празднества с какофонией шумов, чтобы отогнать зло."
