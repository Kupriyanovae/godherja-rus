 zaragett_rite_adj:0 "Зарагетт"
 zaragett_rite_desc:0 "Вера зарагеттов в основном сосредоточена вокруг моря, Дакалены, и её священной связи с луной, [Concept('aervalr','Эрвалом')|E]. Их вечный танец и трагическое разлучение друг с другом из-за рождения их возлюбленных детей, человечества, является предметом великого раскаяния среди их народа, и потому они пытаются облегчить страдания своих божественных родителей через бесчисленные и бесчисленные ритуалы, проводимые год за годом. Многие из этих упомянутых ритуалов включают использование водной магии, известной только зарагеттам, чей талант к таким тайным искусствам намного превосходит талант большинства [Concept('magi','магов')|E] на [Concept('aeras','Эрасе')|E], которых они считают фрагментом силы самой матери Дакалены. Такие одарённые составляют большинство жречества зарагеттов из-за их тесной связи с Морской Матерью. Принадлежащие морю и луне, зарагетты остаются послушными кающимися детьми Морской Матери и Отца Луны, и они будут продолжать искупать своё рождение до самого разрушения мира."
 zaumiere_rite_desc_with_gc:0 "Заумьерский, или Солнечный, обряд является амальгамой карзарадской и сьялволькской мифологии, синкретизированной через [Concept('sjalvolki_migration','переселения')|E]. Практикующие смешали древние дуалистические мифы какаратакской легенды с историями о Богах Верхних и Нижних и стремятся распространить свою мудрость в отдалённые уголки «просвещённого» мира."
