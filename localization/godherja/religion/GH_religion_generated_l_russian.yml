 odyrian_rite_desc:0 "Одирианизм — это почитание военачальников Одира Тена, Одира Ллета и Одира Хуне. Будучи мятежниками против древнего Храма Горного Солнца, а затем и против [Concept('aversaria','прото-аверсарианцев')|E], Одиры восстали в 65, 87 и 109 годах соответственно. По сей день ведутся горячие споры о том, были ли Одиры родственниками, брали ли имена предшественников из уважения, или же Одир был неким древним титулом из единой культуры.\n\nНезависимо от этого, Одиры оказались проницательными как администраторами, так и воинами, каждый из них организовывал значительные восстания против любого царства, под властью которого они жили, несмотря на жестокие расправы. Одирианцы верят, что Одиры были реинкарнациями древнего бога Одиранона, и что однажды последний «Одир Торм» восстанет и вернёт себе трон небес, чтобы вести все народы. Хотя за столетия после Одира Хуне появилось более дюжины лже-Одиров, ни один из них не доказал, что достоин этого титула."
