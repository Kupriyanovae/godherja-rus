 tarriaq_al_thubet_desc_with_gc:0 "Тубетийин считают, что весь [aeras|E] — изменчивая иллюзия, и только [GetBuilding('01_sophocos').GetName] по-настоящему существует. Он — незыблемая сила, удерживающая мир от распада. Взойти по Тысяче и одной ступени Софокоса означает покинуть обманчивую видимость и впервые ступить на единственную твёрдую почву."
 tarriaq_al_thubet_rite:0 "Тарриак аль-Тубет"
 tarriaq_al_thubet_rite_adherent:0 "Тубети"
 tarriaq_al_thubet_rite_adherent_plural:0 "Тубетииин"
 tarriaq_al_thubet_rite_adj:0 "Тубети"
 tarriaq_al_thubet_rite_desc:0 "Тубетийин считают, что весь Аэрас — изменчивая иллюзия, и только Софокос по-настоящему существует. Он — незыблемая сила, удерживающая мир от распада. Взойти по Тысяче и одной ступени Софокоса означает покинуть обманчивую видимость и впервые ступить на единственную твёрдую почву."
 tarriaq_al_wahayd_desc_with_gc:0 "Путь Единого основала пророчица Ханаа, родившаяся под властью [Concept('wardenism','Хранителей')|E]. По рождению ритуалистка, она много общалась с Хранителями, постигла их веру и прониклась сочувствием к их делу. Говорят, когда Ханаа взошла по ступеням [GetBuilding('01_sophocos').GetName], ей открылось, что материальный мир создан злонамеренным демиургом, а его слугам необходимо противостоять при всякой возможности. Лишь с уничтожением демиурга смертные смогут освободиться от оков плоти и вечно пребывать в Садах Жизни. Ханаа также учила, что существует только один бог, именуемый Единым. Некогда Единый повелел пророкам-ритуалистам бороться с демиургом, но ученики неверно истолковали их слова или убили их. Поэтому Единый даровал откровение первым Хранителям и оставил ритуалистов. Однако, если ритуалисты прислушаются к Ханаа и станут жить по Пути Единого — своду законов, переданных пророчице, — Единый вновь окажет им милость."
