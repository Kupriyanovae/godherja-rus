 tirazhidar_desc_with_gc:0 "Его приверженцы обвиняют неверных в недавнем поражении Заорана и катастрофе, вызванной [Concept('frodbrokna','Фродброкной')|E], видя в этом руку Майи, действующую через людей. Их доктрина основывается на строго буквальном прочтении [Concept('gh_zenda','Зенды')|E], рассматривая стихи, которые большинство учёных считают метафорическими, как прямые повеления. Спасение — это не индивидуальное стремление, а коллективный долг.\n\nТакая интерпретация подтолкнула многих из них к насильственным действиям, включая принудительное обращение бродячих народов Амсара. Для них человечество должно быть приведено под божественный порядок Заорана, чтобы его триумф стал абсолютным. Только тогда мир станет целостным, и Последняя Битва будет наконец выиграна."
