 yuagaug_rite_desc:0 "В вере Шуб-Юагуаг зачатие и материнство считаются священными деяниями, подражающими природе Матери Молока. Однако это означает, что женщины обязаны всегда служить матерями и хранительницами домашнего очага, что замыкает их в сфере домашнего хозяйства, в то время как мужчины управляют делами вне дома. Конечным результатом является вера с глубоким гендерным дисбалансом, где отцы имеют право даже приказывать убивать своих жён и детей за неповиновение священным заповедям."
 zamitilaat_kumaysh_desc_with_gc:0 "Братство Кумайша, или Замитаалат Кумайш, основал пророк Кумайш ибн Софокос — неграмотный и необразованный человек, живший неподалёку от [Concept('the_towers','Башни')|E]. Кумайш учил, что организованное жречество противоречит откровениям [GetBuilding('01_sophocos').GetName], а чтобы стать пророком Башни, вовсе не обязательно быть образованным, знатным или даже умным. Представление о царе-жреце, верховном жреце или божественном царе отвратительно кумайшитам: по их убеждению, всякая жреческая иерархия служит лишь подавлению истин, ниспосланных на ступенях Софокоса. Поэтому жречество должно целиком состоять из мирян, а любые попытки подчинить его строгой организации или свести веру к писаному своду правил надлежит пресекать силой. Восхождение на [GetBuilding('01_sophocos').GetName] считается высшим долгом всякого истинного кумайшита, и каждый член общины, равно как каждый будущий жрец, обязан хотя бы раз в жизни совершить это паломничество."
 zamitilaat_kumaysh_rite:0 "Замитилаат Кумайш"
 zamitilaat_kumaysh_rite_adherent:0 "Кумаиши"
 zamitilaat_kumaysh_rite_adherent_plural:0 "Кумаишииин"
 zamitilaat_kumaysh_rite_adj:0 "Кумаиши"
 zamitilaat_kumaysh_rite_desc:0 "Братство Кумайша, или Замитаалат Кумайш, основал пророк Кумайш ибн Софокос — неграмотный и необразованный человек, живший неподалёку от Башни. Кумайш учил, что организованное жречество противоречит откровениям Софокоса, а чтобы стать пророком Башни, вовсе не обязательно быть образованным, знатным или даже умным. Представление о царе-жреце, верховном жреце или божественном царе отвратительно кумайшитам: по их убеждению, всякая жреческая иерархия служит лишь подавлению истин, ниспосланных на ступенях Софокоса. Поэтому жречество должно целиком состоять из мирян, а любые попытки подчинить его строгой организации или свести веру к писаному своду правил надлежит пресекать силой. Восхождение на Софокос считается высшим долгом всякого истинного кумайшита, и каждый член общины, равно как каждый будущий жрец, обязан хотя бы раз в жизни совершить это паломничество."
 zaragett_aagiokrata_desc_with_gc:0 "Острова юго-востока находились под властью [Concept('aversaria','Аверсарии')|E] ещё до [Concept('chaos_of_the_seventh_century','Хаос седьмого века')|E], и хотя многие считали их незначительными, аавтократ Варфаний приложил большие усилия для консолидации имперского контроля над этим районом, чтобы обезопасить проход между зарождающейся провинцией Айроной и Опахасией. Частью его инициатив было подчинение Зарагеттов, повелителей водной магии, которые жили в этом районе с незапамятных времён и яростно сопротивлялись первоначальному аверсарианскому завоеванию. Результатом стала Зарагеттская Аагиократия — вера, возвышающая жречество [Concept('magi','магов')|E] до положения верховной власти как над мирским, так и над духовным мирами. Более того, назначенные боги-цари должны были служить верховными жрецами, ставя их выше остального жречества и правя над верными как воплощения Морской Матери и Отца Луны. Обычно правящий аавтократ Аверсарии считается богом-царём Зарагеттов, хотя в последнее время многие военачальники стали использовать этот титул в погоне за ещё большей властью."
 zaragett_aagiokrata_rite:0 "Зарагеттско-аагиократическ"
 zaragett_aagiokrata_rite_adherent:0 "Зарагеттский аагиократ"
 zaragett_aagiokrata_rite_adherent_plural:0 "Зарагеттские аагиократы"
 zaragett_aagiokrata_rite_adj:0 "Зарагеттская Аагиократия"
 zaragett_aagiokrata_rite_desc:0 "Острова юго-востока находились под властью [Concept('aversaria','Аверсарии')|E] ещё до [Concept('chaos_of_the_seventh_century','Хаос седьмого века')|E], и хотя многие считали их незначительными, аавтократ Варфаний приложил большие усилия для консолидации имперского контроля над этим районом, чтобы обезопасить проход между зарождающейся провинцией Айроной и Опахасией. Частью его инициатив было подчинение Зарагеттов, повелителей водной магии, которые жили в этом районе с незапамятных времён и яростно сопротивлялись первоначальному аверсарианскому завоеванию. Результатом стала Зарагеттская Аагиократия — вера, возвышающая жречество [Concept('magi','магов')|E] до положения верховной власти как над мирским, так и над духовным мирами. Более того, назначенные боги-цари должны были служить верховными жрецами, ставя их выше остального жречества и правя над верными как воплощения Морской Матери и Отца Луны. Обычно правящий аавтократ Аверсарии считается богом-царём Зарагеттов, хотя в последнее время многие военачальники стали использовать этот титул в погоне за ещё большей властью."
 zaragett_faith:0 "Зарагетт"
 zaragett_faith_adherent:0 "Зарагетт"
 zaragett_faith_adherent_plural:0 "Зарагетти"
 zaragett_faith_adj:0 "Зарагетт"
 zaragett_faith_desc:0 "Вера зарагеттов в основном сосредоточена вокруг моря, Дакалены, и её священной связи с луной, [Concept('aervalr','Эрвалом')|E]. Их вечный танец и трагическое разлучение друг с другом из-за рождения их возлюбленных детей, человечества, является предметом великого раскаяния среди их народа, и потому они пытаются облегчить страдания своих божественных родителей через бесчисленные и бесчисленные ритуалы, проводимые год за годом. Многие из этих упомянутых ритуалов включают использование водной магии, известной только зарагеттам, чей талант к таким тайным искусствам намного превосходит талант большинства [Concept('magi','магов')|E] на [Concept('aeras','Эрасе')|E], которых они считают фрагментом силы самой матери Дакалены. Такие одарённые составляют большинство жречества зарагеттов из-за их тесной связи с Морской Матерью. Принадлежащие морю и луне, зарагетты остаются послушными кающимися детьми Морской Матери и Отца Луны, и они будут продолжать искупать своё рождение до самого разрушения мира."
