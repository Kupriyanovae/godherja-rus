 listeners_of_thoronis_desc_with_gc:0 "Торонис, будь то [Concept('dragons','Дракон')|E] или [Concept('magi','маг')|E], правивший когда-то северными землями [aeras|E], является предметом великого почитания среди народов Континента. Вера, возникшая на берегах залива, ныне названного в честь Патоса, некоторые [Concept('aversaria','аверсарианские')|E] учёные утверждают, что это может быть самая северная ветвь аверсарианских религий, хотя она всё же отличается от эрсодиаксианцев Аэларвизии и аагиократов поздней империи. Самопровозглашённые Слушающие Торониса верят, что одноимённый бог Торонис породил океаны в выражении своего гнева против обитателей морского дна, отказавшихся воздать ему почести. Чтобы предотвратить повторение подобных трагедий, последователи регулярно приносят дары в виде огромных кораблей с жертвами, отправляемых в море, чтобы умилостивить бога, который взамен одаривает их спокойным морем и обильным урожаем. Ходят слухи, что эти жертвенные суда иногда перевозят людей во времена голода и штормов, когда считается, что их бог сильно разгневан, хотя существование таких практик яростно отрицается торонитами."
