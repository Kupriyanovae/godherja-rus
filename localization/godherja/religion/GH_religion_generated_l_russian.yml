 graveright_rite_adj:0 "Право мертвых"
 graveright_rite_desc:0 "Право Мертвых — это древняя вера ойчайнцев северных земель. Некогда доминирующая вера на территории нынешних [Concept('the_lichdoms','личеств')|E], Право Мертвых (или Мрогилпрано для ойчиянзов) сосредоточено на вере в то, что душа остаётся с телом в загробной жизни. Когда душа уходит, она наблюдает за теми, кто вокруг неё, и защищает их, пока тело также защищено и уважаемо. В лучшие времена почитатели Права Мертвых хранили тела умерших в огромных некрополях по городам севера, обеспечивая, чтобы все умершие в городе могли вечно служить стражами для своих потомков, как живые делали для них.\n\nЭто, разумеется, [Concept('sorrowing_of_oejeynica','оказалось пороховой бочкой')|E], и ныне Право Мертвых — почти мёртвая религия. Даже там, где она сохранилась, её догматы редко соблюдаются, а хранение мёртвых вместо их сожжения считается безумием."
 gravewatch_rite:0 "Могильнодозорн"
 gravewatch_rite_adherent:0 "Могильнодозорец"
 gravewatch_rite_adherent_plural:0 "Могильнодозорцы"
 gravewatch_rite_adj:0 "Могильный дозор"
 gravewatch_rite_desc:0 "Могильные дозорные — это те, кто поклоняется модернизированной версии Права Мертвых, созданной в попытке обеспечить выживание Права Мертвых в современном мире. Вместо некрополей, где хранятся мёртвые, и зданий из их костей, за умершими наблюдают в течение недели, пока жрецы совершают ритуалы очищения и упокоения. Могильные дозорные утверждают, что эти обряды всё же позволят душе защищать местность, пока о ней помнят и устанавливают памятники в память об умерших. Эти могилы строго охраняются храмовыми стражами, а за каждым телом присматривает отряд стражников, следящих, чтобы его не беспокоили.\n\nХотя это гораздо более приемлемо для современных взглядов, этой вере не удалось найти последователей среди марочников или убедить старых верующих в своей правоте, и она с трудом приживается."
 grotticand_desc_with_gc:0 "Хранители [GetTitleByKey('b_grotto_of_the_golden_martyrs').GetNameNoTier], святейшего места во всём подземном мире, гроттиканды основали великие фермы и священные храмы в том, что когда-то было величайшим из городов под землёй. Тысячи странных и [Concept('aelfir','чуждых')|E] тел, найденных в Гроте, облачённых в странные золотые доспехи, которые невозможно выковать руками человека, считались древними стражами Грота, существовавшими ещё до того, как человек ступил в подземный мир.\n\nСчитая себя наследниками этого великого наследия и страшась возвращения варварских существ, которые, несомненно, убили древних стражей, гроттиканды посвятили себя сохранению этого древнего места и защите его величайшей магией, которую могли произвести их племена. С этой целью тела этих некогда великих воинов часто получали новую жизнь, чтобы помогать как в войне, так и в мире. Хотя многие находят их странный облик тревожным, и хотя не один из них обретал безумное подобие своей былой жизни и устраивал резню, прежде чем его изгоняли, великое изобилие Грота и помощь [Concept('undead','нежити')|E] позволили гроттикандам создать три великие империи задолго до того, как какой-либо захватчик проник из [Concept('aversaria','неведомых земель')|E]."
