 saqadiri_desc_with_gc:0 "Хотя сакадирийин отвергают мысль, что 1001 обряд может принести божественное откровение вдали от Тысячи и одной ступени [GetBuilding('01_sophocos').GetName], они призывают заучивать обряды, чтобы сохранять связь с верой."
