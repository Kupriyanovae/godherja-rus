 mountain_sun_revivalism_rite_desc:0 "Хотя Храм Горного Солнца сохранился при Аверсаринас Аагиократии, падение Аутократы и распад Имперского культа после Жреческого переворота в Орайсполе вынудили знать Опахасии переосмыслить прежний порядок. Тем из аристократов, кто пережил Переселения, сохранив власть, было гораздо легче расстаться с наследием Аутократы, чем многим бывшим соотечественникам. Древние титулы и почести Горного Солнца, уцелевшие на протяжении существования империи, вновь обрели силу, а имперские звания были отброшены. Интерес к возрождению древней веры подогрело движение Воспоминания о Новом Солнце: жрецы Алых Избранных из Воунилла разошлись по Опахасии, вооружённые тысячами древних книг и свитков, собранных их орденом."
 mountain_sun_temple_desc_with_gc:0 "«Последователи» Храма Горного Солнца, как они сами себя называют, поклоняются горе, ныне известной как [GetBuilding('01_vounill').GetName]. Доктрина последователей утверждает, что существует двадцать главных богов и восемьдесят духов и демонов, и их эзотерические методы слишком сложны и запутанны для понимания кем-либо, кто не посвятил себя их изучению. Последователи верят, что никто, кроме понимающих их, не может править, и исторически Храм Горного Солнца полностью управлялся теократическим классом монашеских орденов, главный из которых располагался у самого [GetBuilding('01_vounill').GetName].\n\nКогда Храм Горного Солнца — как религия, так и царство — был завоёван [Concept('aversaria','аверсарианцами')|E], многие из их верований и структур были включены в их религию. Наиболее примечательно то, что Храм Горного Солнца всё ещё технически существует как «Алые Избранники» — аверсарианский орден воинов-монахов, защищающих храмы [GetBuilding('01_vounill').GetName]."
 mountain_sun_temple_rite:0 "Храм Горного Солнца"
