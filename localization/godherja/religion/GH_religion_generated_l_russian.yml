 conclavian_rite_rite_adherent:0 "Конклавианец"
 conclavian_rite_rite_adherent_plural:0 "Конклавианцы"
 conclavian_rite_rite_adj:0 "Конклавский Обряд"
 conclavian_rite_rite_desc:0 "Среди островитян Расколотого побережья древние обычаи мёртвых империй долго процветали, синкретизированные с новыми богами и монархами. Для многих Святое Королевство Велоса было бы лишь продолжением этой долгой традиции, привязывающей их местные верования к новой власти."
 corkkattirkana_desc_with_gc:0 "[Concept('ritualism','Ритуалистская')|E] секта, родившаяся на [Concept('pirate_coast','Пиратском побережье')|E], корккаттирканы верят, что восхождение по [GetBuilding('01_sophocos').GetName] может быть по-настоящему завершено только величайшими из верующих. Каждый последователь стремится превзойти других, как в соревновании, чтобы решить, кто станет тем, кто завершит восхождение."
 corkkattirkana_rite:0 "Корккаттирканск"
 corkkattirkana_rite_adherent:0 "Ритуалист"
 corkkattirkana_rite_adherent_plural:0 "Ритуалисты"
 corkkattirkana_rite_adj:0 "Ритуализм"
 corkkattirkana_rite_desc:0 "Корккаттиркана — секта ритуалистов, возникшая на Пиратском побережье. Её приверженцы верят, что завершить восхождение Софокоса способен лишь величайший из верующих. Каждый стремится превзойти остальных, словно участвуя в состязании за право первым достичь вершины."
