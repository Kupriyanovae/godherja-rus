 kaosahetam_rite_desc:0 "Каосахетамцы верят, что каждый человек рождается с определённым количеством «Као» или «Удачи» в своём духе, которое увеличивается через совершение добрых дел и уменьшается при злых поступках. Те, у кого много Као, благословлены удачей в своих начинаниях, а те, у кого её недостаёт, погрязли в несчастьях. Каосахетамцы также используют гадание, наблюдая за движениями и действиями крабов, чтобы оценить Као человека. Говорят, что более искусные прорицатели могут использовать движения крабов, чтобы видеть правду прошлого и даже предсказывать будущие события."
 kaosahetam_rite_old:0 "Старокаосахетамск"
 kaosahetam_rite_old_adherent:0 "Старый каосахетамец"
 kaosahetam_rite_old_adherent_plural:0 "Старые каосахетамцы"
 kaosahetam_rite_old_adjective:0 "Старокаосахетамск"
 karoxos_cult_desc_with_gc:0 "По западным [Concept('shatteredisles','Островам')|E] многие корабли отмечены странным символом — тремя треугольниками, окружёнными расходящимися лучами. Эти суда перевозят тех, кто следует Пути Кароксоса — древнего героя, давно ушедшего в легенды, почитаемого в различных формах по морям. Её истории, давно ставшие мифами, повествуют о великой одиссее по семи великим островам ранней [Concept('aversaria','аверсарианской')|E] эпохи. Будь то легенды о воинской доблести в войнах Абдексорна, разграблении трёх легендарных городов Символикса или эпической дуэли на Имперском острове ради любви и славы, все истории говорят о зове, голосе, взывающем к Кароксосу с далёких берегов и вдохновляющем её путешествия.\n\nВерующие считают, что когда её флот наконец вошёл в острова, которые она некогда называла домом, Кароксос поняла голос издалека. Последовало последнее наставление, вдохновившее тысячу лет последователей — просьба идти вперёд, бороздить моря и услышать зов самой. Считается, что на единственном корабле Кароксос отправилась в необузданные земли, вдоль древних рек и в земли ледяной зимы — путь, которому следуют самые преданные из почитателей."
