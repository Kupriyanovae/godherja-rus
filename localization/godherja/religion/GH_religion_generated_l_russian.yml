 skrattaki_rite_old_adherent:0 "старый скраттакиец"
 skrattaki_rite_old_adherent_plural:0 "старые скраттакийцы"
 skrattaki_rite_old_adjective:0 "Старые Скраттаки"
 slain_eagle_cult_desc_with_gc:0 "Последователей этого изоляционистского культа боятся по всему [Concept('shatteredisles','Островам')|E] за их фанатизм, их вера известна лишь немногим торговцам и пыльным полкам в [Concept('aversaria','аверсарианских')|E] академиях. Последователи презирают народы островов, считая их соучастниками великого предательства, которое преследует их с тех пор. Они говорят о орле-хранителе, защитнике кроткого народа, благословлённого жить под его крыльями. Они были в безопасности, пока завистливый [Concept('magi','магов')|E] не перерезал горло их хранителю и не оставил их ужасам ночи. Со временем они окрепли, и когда пришло время, отправились в плавание, чтобы найти дом, где они могли бы оплакивать своего защитника в покое.\n\nС древних времён на их островах царит мир, большинство никогда не встречало орлиного знамени за свою жизнь. Однако раз в столетие распространяются слухи о небольшом флоте, бороздящем волны и убивающем любого Мага, которому не посчастливится пересечь их путь."
