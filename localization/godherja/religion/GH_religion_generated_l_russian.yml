 marefai_faith_adj:0 "Марефаизм"
 marefai_faith_desc:0 "В то время как другие деноминации верят в централизованные усилия по поиску Его тела, марефайцы полностью отвергают центральную религиозную власть, считая, что простые смертные недостойны диктовать повеления Всевышнего. Они поощряют всех жить в соответствии со своими собственными толкованиями Гимнов и видят тех, кто пытается возглавить веру, узурпаторами. Несмотря на разнообразие их верований, поиски Его гробницы остаются первостепенными, как и большинство других основных догматов."
