 aversarinas_practitioner_desc_with_gc:0 "Впервые появившись после [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E] с возвышением [Concept('mayikrata','Майикратии')|E], Практическая Аагиократия — это культ, который считает, что [Concept('aversarinas_aagiokratia','Аверсарианская Аагиократия')|E] ущербна, позволяя профанацию именовать не-[Concept('magi','магов')|E] божественными. Приверженцы либо запираются в своих башнях, посвящая время исследованиям в поисках большего знания о тонкостях [Concept('magic','магии')|E] и её совершенствовании, либо работают над превращением [Concept('aversaria','Аверсарию')|E] в идеальную магическую олигархию. Хотя некоторые высмеивают их как амбициозных самозванцев с ограниченными легитимными навыками, объявление себя за культ считается демонстрацией силы среди могущественных (и не очень) магических дворян."
