 katharitos_desc_with_gc:0 "Кахариты следуют учению $saint_katharitos_link$;medium Святого Кахарита#!, странствующего проповедника, наставлявшего своих последователей быть чистыми плотью и помыслами. Их символ — посох их основателя, напоминающий о его странствиях."
