 elaahism_rite_desc:0 "Элаахцы — одна из немногих амсарских сект, которые веками сохраняли свои собственные верования после смерти [Concept('gh_the_amsari_prophet','Пророка')|E] и формирования Хиклахна. Они отвергают саму историю творения и [Concept('gh_amsari_story_first_struggle','Первое противостояние')|E], описанные в [Concept('gh_zenda','Зенде')|E]. Веря, что действия Белрука были неправильно поняты, и что Иралья на самом деле была агентом Майи, сбившей [Concept('gh_amsari_first_dreamers','Первых сновидцев')|E] с пути Заорана. Как следствие, они считают, что Пророк укрепил искажённую версию веры, которая не признаёт истинную борьбу против обмана и лжи. Элаахцы считают, что истинная вера в Заорана требует отвержения лжи, навязанной миру с первой Битвы."
 eos_desc_with_gc:0 "Посвятившие себя $saint_eos_link$;medium Святому Эосу#!, Одинокому Стражу, эосианцы стремятся подражать его мужеству как на поле боя, так и вне его. Их символ — меч, пылающий праведным гневом."
