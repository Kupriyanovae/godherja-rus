 ethylisiac_rite_adj:0 "Этилисиацизм"
 ethylisiac_rite_desc:0 "Этилисиацизм — это вера племён этилисиадов. Этилисиады верили, что все люди являются рабами сложного пантеона жестоких богов, и что их собственный народ был избран богами, чтобы быть господами над другими рабами. Общество этилисиаков строго стратифицировано, и считается, что только те, кто владеет собственным рабом, достойны какого-либо положения в обществе.\n\nБудучи крайне милитаристскими, движения этилисиаков часто полностью определяются внешней экспансией и захватом новых тел рабов для распределения среди поклоняющихся племён."
