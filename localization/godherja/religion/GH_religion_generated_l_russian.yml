 calysto_rite_adj:0 "Калистианство"
 calysto_rite_desc:0 "Калистианцы почитают святого Калисто, возглавлявшего многочисленные освободительные войны против аверсарианцев. Их символ — два скрещённых ключа, знаменующих освобождение как от земных, так и от духовных оков."
 calysto_rite_religious_symbol:0 "Скрещённые Ключи"
 calystoanistism_desc_with_gc:0 "Калистоанизм — это культ, сосредоточенный вокруг поклонения агионистскому святому Калисто, известному многим как величайший герой, когда-либо появившийся на [Concept('shatteredisles','Расколотых островах')|E]. Возникнув из немногих остатков команды легендарного пирата, которым удалось ускользнуть как от [Concept('aversaria','аверсарианцев')|E], так и от Воинствующего Ордена, калистоанисты твёрдо придерживались верований своего свободолюбивого покровителя, ценя личную автономию и свободу превыше всего. За это они яростно противостоят еретическому Святому Ордену Ключа Калисто, которого они считают просто рабовладельцами и еретиками самой низкой пробы. В отличие от большинства культов островов, сосредоточенных вокруг выдающихся героических фигур, калистоанизм считает Калисто божеством, сошедшим с небесного царства, чтобы объединить потерянные народы [Concept('aeras','Эраса')|E] воедино. Хотя он теперь вернулся в свою обитель в космосе, считается, что этим действием он оставил задачу завершить его святое дело человечеству — миссию, которую калистоанисты взяли на себя в своей задаче разорвать оковы рабства и установить эру полной свободы для всех народов Эраса."
