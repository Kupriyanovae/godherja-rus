 kaelenyanism_faith_desc:0 "Кэлэнианизм основан на абсолютной уверенности в том, что Кэлэн, «Избранный Сосуд», является живым воплощением воли Заорана, посланным очистить мир от его повсеместной лжи и наступить эру божественного порядка. Приверженцы верят, что каждое заявление и каждый указ Кэлэна являются прямым исхождением от самого Заорана, делая все прошлые толкования второстепенными. Жить по воле Кэлэна — значит жить в совершенном согласии с Заораном, ибо новый Пророк воплощает саму суть очищения. Их вера требует непоколебимого послушания и пламенной преданности видению Кэлэна, веря, что только через его прямое руководство человечество может быть искуплено и мир станет целостным."
