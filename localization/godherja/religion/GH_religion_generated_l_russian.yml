 mahazhadar_desc_with_gc:0 "Возникнув в годы после смерти $amsari_prophet_link$ Пророка#!, махажадаризм просуществовал недолго после [Concept('gh_amsari_rebellion','Амсарского восстания')|E], прежде чем исчезнуть. Махажадари толковали учения Пророка не как прямые заявления, а как символические выражения более глубоких истин. Его приверженцы верили, что события, описанные для будущего, были не буквальными пророчествами, а абстрактными концепциями, требующими вдумчивого толкования. Они утверждали, что будущее, описанное Пророком, не было фиксированным, но могло быть понято через размышления и споры."
 mahazhadar_rite:0 "Махажадаризм"
 mahazhadar_rite_adherent:0 "Заораниец"
 mahazhadar_rite_adherent_plural:0 "Заоранийцы"
 mahazhadar_rite_adj:0 "Махажадаризм"
 mahazhadar_rite_desc:0 "Махажадаризм возник вскоре после смерти Пророка, ненадолго пережил восстание амсари и затем исчез. Махажадариты понимали его учение не как буквальные утверждения, а как символические образы, скрывающие глубинную истину. Они полагали, что описанные Пророком события будущего — не прямые предсказания, а отвлечённые понятия, требующие вдумчивого истолкования. Будущее, о котором говорил Пророк, считалось не предрешённым, а постижимым через размышление и спор."
 mahndayana_desc_with_gc:0 "[Concept('frodbrokna','Фродброкна')|E] стала подтверждением самых худших опасений многих заоранийцев, особенно потому, что она произошла именно в тот момент, когда $amsari_prophet_link$ Пророк#! предсказал поражение их бога. Люди остались в смятении, гадая, как они вообще могут продолжать существовать в мире, где зло одержало верх над добром. Их ответ был удивительно прост: продолжать функционировать, как будто этого не произошло. Многие заоранийцы продолжают совершать ритуалы и петь песни своих предков в отчаянной надежде, что их жесты однажды приведут Заорана к предсказанной победе."
 mahndayana_rite:0 "Махндаянийск"
 mahndayana_rite_adherent:0 "Заораниец"
 mahndayana_rite_adherent_plural:0 "Заоранийцы"
 mahndayana_rite_adj:0 "Махндаянизм"
 mahndayana_rite_desc:0 "Фродброкна подтвердила худшие страхи многих заоранистов, ведь она случилась именно тогда, когда Пророк предрёк поражение их бога. Люди пали духом, не понимая, как продолжать жить в мире, где зло восторжествовало над добром. Ответ оказался неожиданно прост: жить так, словно ничего не произошло. Многие заоранисты до сих пор совершают обряды и поют песни предков, отчаянно надеясь, что однажды их верность поможет Заорану достичь предсказанной победы."
 makerelyon_desc_with_gc:0 "Ветвь манатской религии Макерелион популярна среди амбициозных королей, стремящихся узурпировать власть [nosanni|E1]. Они верят, что единственным правом правителя царства является перевод [Concept('gena_tinngir','Священных текстов')|E], а духовенство должно лишь охранять библиотеки — задачу, которую, как они утверждают, настолько важную, что её нельзя отвлекать учёными изысканиями. Они оправдывают это верование, ссылаясь на то, что царь богов, [Concept('manat_mythology','Релион')|E], обладал верховной властью над всеми остальными богами, даже над хранительницей божественной библиотеки, [Concept('manat_mythology','Ашемой')|E]."
