 sansia_desc_with_gc:0 "Посвятившие себя $saint_sansia_link$;medium Святой Сансии#!, сансианцы делают упор на самопожертвование и отказ от мирских удовольствий во имя духовного спасения. Их символ — роза, обагрённая кровью их покровительницы."
