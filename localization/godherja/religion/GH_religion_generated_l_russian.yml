 daenavad_desc_with_gc:0 "Основанное в правящей династии Амоннидов, даэнавадизм утверждает, что амсарским Хиклахном должен править потомок $amsari_prophet_link$ Пророка#!, и распространяет этот принцип на все должности власти. Он утверждает, что каждая позиция власти должна принадлежать тем, кто может напрямую проследить свою родословную до Пророка. Хотя ни один канамсар никогда официально не придерживался даэнавадизма, его влияние сохраняется в высших эшелонах общества среди потомков Пророка, где чистота происхождения считается высшим мерилом авторитета и легитимности."
 daenavad_rite:0 "Даэнавадийск"
 daenavad_rite_adherent:0 "Даэнавадиец"
 daenavad_rite_adherent_plural:0 "Даэнавадийцы"
 daenavad_rite_adj:0 "Даэнавадизм"
 daenavad_rite_desc:0 "Даенавадизм возник при правящей династии Амоннидов. Его учение гласит, что хиклахном амсари должен править потомок Пророка, и распространяет этот принцип на все властные должности. Любую власть могут занимать лишь те, кто способен доказать своё прямое происхождение от Пророка. Хотя ни один канамсар официально не исповедовал даенавадизм, это учение сохраняет влияние среди высшей знати, особенно среди потомков Пророка: чистота происхождения здесь считается высшим мерилом власти и законности."
