 quwazaw_faith_desc:0 "Квазавиты относятся к титаническим каменным статуям, которым поклоняются, с величайшим почтением: они омывают их, заново раскрашивают замысловатые узоры на них и даже ткут для них великие плащи, на создание которых у целых деревень уходит год. Основная движущая сила этих действий, которые чужеземцы отвергают как глупую трату времени и ресурсов, — уверенность в том, что они будут вознаграждены за своё благочестие и долг, когда их боги пробудятся и вновь утвердят свою власть над человечеством."
