 arayvtar_desc_with_gc:0 "Возникнув из древних взаимодействий с [Concept('wardenism','варденитами')|E], арайвтаристы полагают, что Варден и несколько видных [Concept('mamuramat','мамуров')|E] в варденитской религии были на самом деле [Concept('malaak','Малааками')|E], исполняющими волю Охрасика. Как следствие, арайвтаристы переняли некоторые из учений Вардена, утверждая, что луна — это темница, заключающая мёртвого бога, и что правильные традиции и законы должны соблюдаться, чтобы удерживать его там."
