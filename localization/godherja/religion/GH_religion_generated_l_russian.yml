 harfi_desc_with_gc:0 "Харфийцы, в отличие от других [Concept('wardenism','варденитских')|E] сект, верят, что «Столпы Добродетели» — это реальные, физические столпы, которые можно найти в материальном мире, и их нужно защищать. Другие варденитские секты отвергают это толкование как комично буквальное и считают любых неироничных последователей харфийских путей отсталыми фундаменталистами."
