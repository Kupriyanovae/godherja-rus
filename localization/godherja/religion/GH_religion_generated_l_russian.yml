 ritualist_ruhwaadist_faith_desc:0 "Рухваадийин — последователи Рухваада ибн Хасиля, прежде принадлежавшего к тасаави. В молодости он совершил паломничества ко многим [Concept('the_towers','Башням')|E] и, по преданию, получил откровение, что [GetBuilding('01_sophocos').GetName] жив, причём единственный среди всех Башен [Concept('aeras','Аэраса')|E]. Хотя родная семья отвергла Рухваада, ещё при жизни он быстро приобрёл множество учеников."
 ritualist_saldhaarist_faith:0 "Салдхари'а"
 ritualist_saldhaarist_faith_adherent:0 "Салдхари"
 ritualist_saldhaarist_faith_adherent_plural:0 "Салдхарииин"
 ritualist_saldhaarist_faith_adj:0 "Салдхари"
 ritualist_saldhaarist_faith_desc:0 "В основе этой веры лежат труды мага-философа Сальдхаара Мудрого. Она учит, что в древности философам были дарованы великая мудрость и силы, позволявшие изменять окружающий мир. Но с течением времени эти способности выродились в хаотичную форму, называемую ныне магией."
 ritualist_wahaydia_faith:0 "Вахаиди'а"
 ritualist_wahaydia_faith_adherent:0 "Вахаиди"
 ritualist_wahaydia_faith_adherent_plural:0 "Вахаидииин"
 ritualist_wahaydia_faith_adj:0 "Вахаиди"
 ritualist_wahaydia_faith_desc:0 "Направление ритуалистов, соединённое с [Concept('wardenism','верой Хранителей')|E] либо отказывающееся участвовать в [war_in_heaven|E]. Его последователи утверждают, что обе религии могут сосуществовать как единое целое. Общим для них является понятие аль-Вахайд, Единого. Хотя в различных обрядах его роль меняется, Единый связывает и объединяет хранителей и ритуалистов."
 river_rite_desc_with_gc:0 "Обряд Патоса учит, что речная сеть [Glossary('дельты Патоса','pathos_delta_encyclopedia_desc')] была создана в дар верующим, чтобы они могли отыскать её в странствиях и процветать на её берегах. [Glossary('Варпалис','VARPALIS_GLOSS')] занимает центральное место в пантеоне шьялволков, а мифы приводятся в систему вокруг него, а не более традиционных богов."
 river_rite_faith:0 "Обряд Пафоса"
