 aversarian_gorassos_desc_with_gc:0 "Названная её последователями в честь одноимённого основателя и лидера $gorassos_link$ Горасса#!, [Concept('aversaria','аверсарианская')|E] вера была грубо переделана в культ войны и смерти. Чистота зарабатывается не кровью в жилах, а тем, сколько языческой крови пролито. И Горасс намеревался, чтобы во имя его было пролито #E MP много#! крови."
