 arishayana_rite_desc:0 "Аришанская вера следует радикальным откровениям пророчицы Ариши аз-Бехни, которая утверждала, что Последняя Битва уже произошла и что Заоран умер, когда Майя разбил луну — что ознаменовало конец Пророчества и прямого божественного руководства. Однако она верила, что Заоран оставил миру последний дар: его сущность была вложена во все вещи, и, развивая повышенное осознание — как это сделала она, — можно было воспринять божественное взаимодействие воли Заорана во всём, присутствие, которое будет направлять верных в его отсутствие.\n\nОбъехав мир и став свидетелем пробуждения первого Великого Спящего, Ариша провозгласила, что поведёт верных в Последней Битве, которая скоро обрушится на человечество, и избавит их от тьмы. Её смерть накануне предсказанного конфликта оставила её последователей в смятении, вынужденных, казалось бы, встретить Последнюю Битву без своего лидера."
 arthenaxian_desc_with_gc:0 "Артенаксианисты поклоняются [arthenax|E], последнему известному [Concept('dragons','Дракону')|E] в [Concept('aversaria','Аверсарии')|E]. Спустя три столетия после истребления и предполагаемого вымирания драконов, Артенакс и её выводок вошли в Аверсарию и грабили царство почти десять лет, прежде чем были убиты аавтократией Элиадией. Артенакс в своей гордости требовала поклонения, и хотя её культ никогда не был популярен, он, тем не менее, оказался живучим."
