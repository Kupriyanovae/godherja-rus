 adabyssian_rite_desc:0 "Лишь самым очищенным дозволено лицезреть величайшие статуи собственными глазами. Это жрецы входят в трансы в кельях храмов, внимая велениям богов под золотом и передавая их в понятные приказы для мирских «правителей». Превыше всего было одно веление, повторяемое богами на протяжении веков: идите и завоёвывайте, дабы весь мир присоединился к их молению."
 aeschraes_aagiokrata_desc_with_gc:0 "Хотя именно он ответственен за высвобождение [Concept('frodbrokna','Фродброкны')|E] и разрушение [Concept('aversaria','Аверсарии')|E], $aauto_aeschraes_link$ аавтократ-легон Эшрей#! постепенно создал культ фанатиков во время [Concept('imperial_civil_war','Имперской гражданской войны')|E] и особенно в хаотичные десятилетия после неё, которые по-прежнему настаивают на том, что его «ошибки» были происками тёмных злодеев (а именно $aauto_axiaothea_link$ Аксиотеи#!). Они утверждают — не без оснований, — что трон принадлежал ему по праву и закону, и все, кто называет себя потомками Чистейшего, должны склониться перед его властью."
