 manats_desc_with_gc:0 "Значительная часть современной манатской религиозной культуры строится вокруг защиты и толкования [Concept('gena_tinngir','Священных текстов')|E] богов, за чем наблюдает большая каста [Concept('nosanni','жрецов-толкователей')|E]. Хотя существуют оригинальные переводы, передаваемые из уст в уста, многие манатские толкователи пытаются расшифровать исконный язык самих богов, чтобы лучше суметь построить общество таким, каким оно было в те святейшие из ранних дней."
