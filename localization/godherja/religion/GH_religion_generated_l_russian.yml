 saratarat_desc_with_gc:0 "Саратарат — это пацифистская океаническая религия, основанная на почитании [Glossary('саратанов','GH_SARATAN_GLOSS')] из [Glossary('кратера Кезимин','crater_encyclopedia_desc')]. Саратаратины верят, что саратаны были первыми стражами мира, а также первыми существами, и что их движения образовали моря и [Concept('aeras','Эрас')|E], которые кружились вокруг них, формируя реальность и саму вселенную.\n\n[Concept('sarataratin_militarism','После великого бедствия')|E], верные присягнули пацифизму и теперь ведут скромную жизнь рыбаков и торговцев."
