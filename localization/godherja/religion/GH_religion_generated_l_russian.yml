 sunwarwei_aagiokrata_desc_with_gc:0 "Сунарвейская Аагиократия — возможно, один из самых своеобразных результатов [Concept('aversaria','аверсианизации')|E] местной веры для улучшения стабильности обширной империи Аверсарии. Хотя обычно аверсианизация веры включает модификацию веры для возвеличения аверсарианцев и [Concept('magi','магов')|E] в той или иной форме, Сунарвейская Аагиократия вместо этого пытается поощрять более милитаристские взгляды и противостоять своим традиционным пацифистским верованиям, почти не упоминая [Concept('peculiar_compromise_sunarwei','аверсарианцев')|E] или [Concept('magi','магов')|E]."
 sunwarwei_aagiokrata_rite:0 "Сунарвейская агиократия"
 sunwarwei_aagiokrata_rite_adherent:0 "Сунарвейский аагиократ"
 sunwarwei_aagiokrata_rite_adherent_plural:0 "Сунарвейские аагиократы"
 sunwarwei_aagiokrata_rite_adj:0 "Сунарвейская Аагиократия"
 sunwarwei_aagiokrata_rite_desc:0 "Сунарвейская Аагиократия — возможно, один из самых своеобразных результатов [Concept('aversaria','аверсианизации')|E] местной веры для улучшения стабильности обширной империи Аверсарии. Хотя обычно аверсианизация веры включает модификацию веры для возвеличения аверсарианцев и [Concept('magi','магов')|E] в той или иной форме, Сунарвейская Аагиократия вместо этого пытается поощрять более милитаристские взгляды и противостоять своим традиционным пацифистским верованиям, почти не упоминая [Concept('peculiar_compromise_sunarwei','аверсарианцев')|E] или [Concept('magi','магов')|E]."
 talfasmolline_desc_with_gc:0 "[Concept('marmaladid_great_tribes','Мармаладиды')|E] издавна почитали смертоносные яды [Glossary('Саррадонской пустыни','sarradonian_desert_encyclopedia_desc')] и животных, которые их носят, как источник огромной силы. Ревностные последователи принимают участие в ритуале, известном как [Glossary('Тальфасомолль','tafasomoll_glossary_desc')]. Редко можно встретить тальфасемца без пузырька с ядом, ибо он предназначен не только для использования против врагов, но и для почётного самоубийства, когда вся надежда потеряна."
 talfasmolline_faith:0 "Талфасем"
 talfasmolline_faith_adherent:0 "Тальфасемец"
 talfasmolline_faith_adherent_plural:0 "Тальфасемцы"
 talfasmolline_faith_adj:0 "Тальфасем"
 talfasmolline_faith_desc:0 "Мармаладиды издавна почитают смертоносные яды Саррадонской пустыни и животных, несущих их, как источник огромного могущества. Ревностные последователи участвуют в обряде Тальфасомолль. Редко можно встретить тальфасомоллина без пузырька с ядом: он нужен не только против врагов, но и для почётного самоубийства, когда потеряна последняя надежда."
 talfasmolline_rite:0 "Талфасем"
 talfasmolline_rite_adherent:0 "Тальфасемец"
 talfasmolline_rite_adherent_plural:0 "Тальфасемцы"
 talfasmolline_rite_adj:0 "Тальфасем"
 talfasmolline_rite_desc:0 "Мармаладиды издавна почитают смертоносные яды Саррадонской пустыни и животных, несущих их, как источник огромного могущества. Ревностные последователи участвуют в обряде Тальфасомолль. Редко можно встретить тальфасомоллина без пузырька с ядом: он нужен не только против врагов, но и для почётного самоубийства, когда потеряна последняя надежда."
 talita_namit_desc_with_gc:0 "Талита Намит является в равной мере и образом религиозных верований, и политической системой. Наиболее поразительным элементом этой веры является убеждение, исповедуемое ревностными последователями, что определённые [Concept('marmaladid_chosen_magi','маги')|E] могут служить вестниками из [Concept('realm_above','Высшей обители')|E], выступая посланниками воли Небес и осуществляя законное правление над землями Эраса."
 talita_namit_faith:0 "Талита Намит"
 talita_namit_faith_adherent:0 "Избранный"
 talita_namit_faith_adherent_plural:0 "Избранные"
 talita_namit_faith_adj:0 "Талита Намит"
 talita_namit_faith_desc:0 "Талита Намит — не только религиозное учение, но и политическое устройство. Его самая примечательная черта — убеждение ревностных последователей, что некоторые Избранные маги могут выступать посланниками Высшего царства, возвещать волю Небес и по праву властвовать над землями Аэраса."
 talita_namit_rite:0 "Талита Намит"
 talita_namit_rite_adherent:0 "Избранный"
 talita_namit_rite_adherent_plural:0 "Избранные"
 talita_namit_rite_adj:0 "Талита Намит"
 talita_namit_rite_desc:0 "Талита Намит — не только религиозное учение, но и политическое устройство. Его самая примечательная черта — убеждение ревностных последователей, что некоторые Избранные маги могут выступать посланниками Высшего царства, возвещать волю Небес и по праву властвовать над землями Аэраса."
 tarriaq_al_asal_desc_with_gc:0 "Асалийин признают другие [Concept('the_towers','Башни')|E], рассеянные по [Concept('aeras','Аэрасу')|E], законными местами поклонения, однако утверждают, что ни одна не сравнится с [GetBuilding('01_sophocos').GetName]. Они считают его родиной [Concept('ritualism','ритуализма')|E], первой и величайшей из всех Башен. Почитать божественное можно у каждой, но ни одна не удостаивается такого благоговения, как башня в [Glossary('Харадамате','kharadamat_encyclopedia_desc')]."
 tarriaq_al_asal_rite:0 "Тарриак аль-Асаль"
 tarriaq_al_asal_rite_adherent:0 "Асали"
 tarriaq_al_asal_rite_adherent_plural:0 "Асалииин"
 tarriaq_al_asal_rite_adj:0 "Асали"
 tarriaq_al_asal_rite_desc:0 "Асалийин признают другие Башни, рассеянные по Аэрасу, законными местами поклонения, однако утверждают, что ни одна не сравнится с Софокосом. Они считают его родиной ритуализма, первой и величайшей из всех Башен. Почитать божественное можно у каждой, но ни одна не удостаивается такого благоговения, как башня в Харадамате."
 tarriaq_al_dhaat_desc_with_gc:0 "Путь Себя учит, что Тысяча и Одна Ступень [GetBuilding('01_sophocos').GetName] не может быть пройдена, если душа не освобождена от гнёта. Боги, ангелы и лжепророки — всего лишь цепи на живых, и каждый шаг — это сброшенная цепь. Идти по Тарриак аль-Дхаат — значит нуждаться только в том, что внутри тебя.\n\nЭто было откровение [Glossary('Саайф аль-Малаики аль-Халид','UNDYING_SWORD_GLOSS')], который обратил клинок небес против самих небес."
