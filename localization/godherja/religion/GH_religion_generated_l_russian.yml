 ixsian_mysteries_desc_with_gc:0 "Икс, некогда центр наместничества Южных Имперских островов при павшей [Glossary( 'Аутократе', 'GH_AAUTOKRATA_GLOSS' )], удержал власть над областью благодаря прежним законным притязаниям, относительному порядку и процветанию на фоне распада империи. Его власть была лишь ненадолго прервана находкой Семи печатей Сордорнакс'моровира и связанного с ними Чёрного свитка. Изучение реликвий быстро свело учёных Икса с ума: меметическое проклятие охватило руководство города.\n\nНесмотря на бессвязное безумие правителей и их новообретённую одержимость бесконечным свитком и снятием Печатей (причём всякий, кто умел читать начертанный на них запретный язык, рисковал заразиться безумием), жители Икса сохранили добротное управление и порядок во владениях. Многие острова добровольно присягнули городу, не обращая особого внимания на порой раздающиеся на дипломатических встречах нечеловеческие визги и заклинательные напевы."
