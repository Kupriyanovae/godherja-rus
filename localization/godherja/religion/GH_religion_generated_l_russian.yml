 sarridian_reformism_rite_desc:0 "Гурдурбок мог пасть от клинков своего вероломного брата, отца черногорских имперцев, короля Никанея, но поколения сарридианцев, шедшие за ним и овладевшие родной землёй после гибели империи, вдохновились мечтой создать новый, лучший мир, какого не мог представить ни один сарридианец до первого истинного короля.\n\nОбъединённая общей целью и духом, новая сарридианская знать поощряет распространение «созданного» ими языка (в основном смеси аверсарианского, маркитского, рекволкского и настоящих и вымышленных традиционных сарридианских письмен), а также множества новых художественных направлений и литературных обычаев.\n\nИ вера стала одновременно анахроничным образом старины и вдохновенным стремлением в будущее. Хотя она опирается главным образом на традиции и жреческое устройство древней Аагиократии, сарридианцы строят новую религию с тем же воодушевлением, с каким создают язык. Пока другие наследники Старой империи погрязли в ожесточённых спорах об имперском наследии, сарридианцы охотно изобретают новые столпы веры и отбрасывают всё неподходящее. Новый «Свободный аагиократский конклав сарридианских культов» уже учредил особую жреческую иерархию и обрядовую систему, не имеющую аналогов ни в одной другой земле Аэраса. Эта вера оказалась одной из самых изменчивых: едва ли не ежедневно возникают новые обряды и соглашения об отказе от старых, а распространение грамотности в Чёрных горах лишь ускоряет обмен идеями."
 seaborne_exalted_desc_with_gc:0 "Ненавидимые всеми, страшимые многими, бичи Расколотого побережья и всех его [Concept('shatteredisles','Островов')|E], Морские Избранные — это отвратительный и злобный культ, ставящий грабёж и пиратство превыше всего. Веря, что всё человечество произошло из морской соли, для морских избранных жизнь без убийств, грабежа и насилия лишена всякого смысла. Жизнь коротка, и когда человек умирает, его не ждёт возвышенная загробная жизнь или небесная обитель — лишь возвращение тела в ту морскую соль, из которой оно было создано.\n\nПоэтому следует хвататься за любую возможность, совершать любые преступления, какие только можно пожелать, и забирать всё, что можно, ибо за завесой смерти нет ничего, кроме вечного скитания с берега на берег по коварному морю, которое столько досаждало им при жизни. Убивать — значит навязывать свою волю этому проклятому миру и менять сами течения судьбы. Властвовать — значит быть сильным, а слабые должны уступить дорогу или умереть при столкновении с лучшими. Никакой закон, никакой бог и никакой король не сдерживают морских избранных, которые приходят, куда хотят, и уходят, когда могут, и горе тому, кто попытается их заковать в цепи."
