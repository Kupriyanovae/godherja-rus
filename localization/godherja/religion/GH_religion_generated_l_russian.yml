 anban_sarradon_faith_desc:0 "Культ, основанный после Фродброкны. Анбан является преднамеренной и отчасти цинично прагматичной попыткой объединить варденизм и ритуализм в единую веру, основанную на фигуре нематериального божественного законодателя. Являясь отчасти политической философией, её идеалистические сторонники предлагают её как способ объединить Саррадон и наступить новую эру религиозного мира. По вполне понятным причинам ей в целом не удалось найти народной поддержки за пределами горстки военачальников, ищущих любое преимущество перед соперниками."
