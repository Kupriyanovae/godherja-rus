 aarayi_faith_desc:0 "Означая «регентство», Аарайи родились, когда $mamur_tathtali_link$ Татхтали#! объединил Восточный и Западный Мамураматы, приведя с собой большую часть обременённых судов Востока. Однако несколько этих судов отказались последовать за ним. Собравшись вокруг верховного судьи, ставшего военачальником Афнааном, они опровергли притязания Татхтали на право по браку. При отсутствии какого-либо законного кандидата, который мог бы заменить Татхтали, Высокий Суд Востока — институт, созданный по настоянию Афнаана — должен был служить регентом до тех пор, пока не найдётся законный наследник Востока. Учитывая полное, по-видимому, исчезновение матрилинейной линии семьи Заахира — за исключением детей Санад от Татхтали, которые были незаконнорождёнными из-за узурпации их отца — эта последняя цель оказалась несколько труднодостижимой.\n\nВысокий Суд Востока на протяжении веков поддерживал нескольких надеющихся претендентов на трон, и хотя им ещё не удалось добиться успеха, упрямые арайийские судьи верят, что это лишь вопрос времени, когда татхталийская ересь будет свергнута."
