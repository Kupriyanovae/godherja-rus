 krothagg_rite_old_adjective:0 "Старокротаггск"
 kyaalic_desc_with_gc:0 "Кьяали верят, что божественное царство, или Кьяаль, является физическим местом, куда можно отправиться. Они считают его местом рождения всех существ мира, и поэтому все существа несут в себе искру божественности.\n\nНекоторые из кьяали могут совершать ритуалы, чтобы обуздать эту искру, позволяя им носить шкуру любого существа и принимать его облик, причём особое почитание оказывается тем, кто сумеет облачиться в [Concept('kyaldzakaxi','Кьяльдзакаши')|E] — грозных зверей, на которых охотятся во время [kyalmuku|E], или Охоты на бога."
