 agiopolei_rite_adj:0 "Агиополей"
 agiopolei_rite_desc:0 "Человечество безнадёжно испорчено, и попытки спасти людей от скверны тщетны без Святых. Поэтому верующие ищут уединения от развращённого внешнего мира, чтобы сохранить учения Святых до «Второго явления», когда Святые вернутся, чтобы распространять свои божественные учения, как в давние времена."
 ahridar_desc_with_gc:0 "Странные и несколько загадочные верования племён западного кратера, Ахридар — это почитание древнего бога-царя Охрасика, который освободил человечество от рабства у древних дьяволов, некогда наполнявших мир тьмой. Охрасик перебил дьяволов и поработил многих из них, дабы они следовали его воле, но раны, оставленные дьяволами в мире, никогда не исчезли, став тенью и ночью, и противостояли Охрасику, принявшему обличье солнца в небе. Ахридаристы утверждают, что Охрасик — крайне деятельный бог, несмотря на молчание, которое он хранит к своим верным; Охрасик просто настолько сосредоточен на своей ежедневной войне с тенью, что не в силах ответить на большинство молитв верных.\n\nМногие ахридаристские вожди объявляли себя [Concept('malaak','Малааком')|E], или воплощением Охрасика, утверждая, что Охрасик иногда помогает своим верным, принимая человеческий облик и сражаясь со слугами тьмы. Большинство правителей, принимающих этот титул, провозглашают: «Это я сражу луну» — при своём провозглашении, веря, что [Concept('aervalr','Эрвал')|E] — злой бог, направляющий дьяволов против Охрасика.\n\n[Concept('aversaria','Аверсарианские')|E] учёные отметили, что ахридаристская устная традиция, похоже, ссылается на несколько событий, которые на самом деле произошли не рядом с кратером, а в древней Аверсарии. Несмотря на это, никакой дальнейшей связи найдено не было, и вера остаётся исключительно интересной темой в аверсарианских учёных кругах, хотя она слишком отдалена и изолирована от аверсарианских дел, чтобы ей уделяли серьёзное внимание."
