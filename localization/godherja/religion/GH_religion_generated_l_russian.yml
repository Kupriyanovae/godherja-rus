 sjalvolki_desc_with_gc:0 "Сьялволки, или «сильный народ» на их языке, считают себя теми, кто всё ещё следует учениям [Glossary('Велоса','VELOS_GLOSS')] Великого Охотника. Они восхваляют охоту и считают её ключевым принципом своей веры, хотя это также сочетается с общением с природой и ответственностью в своих действиях. Боги оказали им милость, назначив их управителями мира, но они, вероятно, не получат такой щедрости снова, если растратят её впустую. Таким образом, они чувствуют необходимость иногда браться за оружие против поистине злых и вопиющих, чтобы обезопасить остальное существование."
