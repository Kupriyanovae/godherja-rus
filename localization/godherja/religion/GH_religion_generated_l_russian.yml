 beshashuriyya_desc_with_gc:0 "Философское, политическое и религиозное движение, сосредоточенное вокруг фигуры [Concept('ishtabima_mamura','Иштабимы Мамура')|E], которая служила генералом и телохранителем сначала у [Concept('sanad','Санады')|E], а затем недолго у её мужа [Concept('tathtali','Татхтали')|E]. В поколениях после её смерти жизнь и военная карьера Иштабимы вознесли её до почти священного статуса среди бешашуритов, которые видят в ней образец воинской чести и верности. Примечательно, что бешашуриты стремятся подходить к воинским занятиям так же, как учёные и правоведы подходят к своим областям. Многие за пределами секты считают это абсурдным оправданием для возведения (вероятно) низкорождённой женщины до почти божественного статуса."
