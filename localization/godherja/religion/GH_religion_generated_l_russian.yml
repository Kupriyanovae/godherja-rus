 orispolj_rite_faith_desc:0 "Ораиспольский обряд является кодификацией и реформацией множества разрозненных вер сьялволькских верных. [SelectLocalization(Faith.MakeScope.Var('great_reformer').IsSet,Concatenate('Основанный радикальным шаманом ',Faith.MakeScope.Var('great_reformer').Char.GetFullNameNicknamed),'Основанный радикальным шаманом')], проповедник призвал к необходимости кодифицированной книги веры, а также строгой иерархии жрецов и шаманов для руководства верными. Часто считающийся вдохновлённым религиями марочников и структурными аспектами побеждённых вер [Concept('aversaria','аверсарианцев')|E], Ораиспольский обряд является слиянием дюжины различных сьялволькских вер с иерархической структурой, которую можно ожидать от современного и укоренившегося религиозного движения.\n\nНесмотря на структурную организацию, его основатель активно выступал против необходимости центральной организации для управления верой и вместо этого требовал «анархии веры», в которой каждый верный формировал бы свой собственный путь к спасению в финальной войне."
 orispolj_rite_rite:0 "Ораиспольско-обрядовск"
 orispolj_rite_rite_adherent:0 "Ораисполец"
 orispolj_rite_rite_adherent_plural:0 "Ораиспольцы"
 orispolj_rite_rite_adj:0 "Ораиспольский обряд"
 orispolj_rite_rite_desc:0 "Ориспольский обряд — попытка объединить и реформировать многочисленные разрозненные верования шьялволков. Его основал радикальный шаман, призывавший создать единый свод веры и строгую иерархию жрецов и шаманов для духовного руководства. В его устройстве нередко усматривают влияние религий маркитов и организационных принципов побеждённых аверсарианцев. Обряд объединил дюжину разных шьялволкских верований под иерархией, достойной развитого религиозного движения.\n\nНесмотря на чёткую структуру, основатель деятельно отвергал необходимость единого центра управления верой и требовал «анархии верований», при которой каждый последователь сам избирает путь к спасению в последней войне."
 orphecian_desc_with_gc:0 "Орфецианизм — это почитание трёх аспектов бога Орфеции: «Крови», «Камня» и «Воздуха», представленных соответственно солнцем, луной и молнией. Орфецианское общество придавало большое значение [Concept('magi','магам')|E] как представителям воли аспектов Орфеции, и конклавы Магов, представляющих каждый аспект, возглавляли большинство орфецианских царств.\n\nСамым известным орфецианским царством был [Concept('kartharadd','Империум Картарадд')|E], который вторгся в [Concept('aversaria','Аверсарию')|E] во время [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E] и завоевал провинцию Малькоя, достигнув западной Опахасии, прежде чем был остановлен. После их поражения аверсарианская расправа была быстрой, и орфецианская вера была искоренена везде, где её находили."
 orphecian_rite:0 "Орфецианск"
 orphecian_rite_adherent:0 "Орфецианец"
