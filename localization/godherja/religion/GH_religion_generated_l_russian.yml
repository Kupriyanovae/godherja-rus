 five_hundred_desc_with_gc:0 "Пятьсот Путей $saint_katharitos_link$ Кахарита#! происходят из того же источника, что и кахариты, оба посвящены почитанию Святого Кахарита. Но в отличие от своих агионистских собратьев, Последователи Пятисот Путей посвятили себя радикальному пацифизму. Они верят, что ни один человек не должен лишать жизни живое существо или использовать что-то, что не было свободно даровано им [aeras|E]. Многие из них толкуют этот принцип как запрет на ношение одежды из культивируемых тканей, шкур животных или металлических доспехов, и их легче всего узнать по ритуальной наготе.\n\nНесмотря на их неагрессивную природу, они навлекли на себя немало гнева как со стороны агионистов, так и [Concept('aversaria','аверсарианцев')|E]. Их осуждают как еретиков и извращенцев низшего сорта, и их часто преследуют и убивают во время паломничеств в места, важные в жизни Кахарита. Но это не мешает им исповедовать свою веру и не отпугивает новых рекрутов."
 five_hundred_rite:0 "Кахаритск"
 five_hundred_rite_adherent:0 "Кахарит"
 five_hundred_rite_adherent_plural:0 "Кахариты"
 five_hundred_rite_adj:0 "Катарите"
 five_hundred_rite_desc:0 "Пятьсот Путей Катаритоса имеют общие истоки с катаритами: обе общины почитают святого Катаритоса. Но, в отличие от братьев по агионизму, приверженцы Пятисот Путей избрали крайний пацифизм. Они верят, что человек не вправе лишать жизни ни одно живое существо и пользоваться ничем, что не было добровольно даровано ему Аэрасом. Многие истолковывают это как запрет на одежду из выращенных растений, шкур животных и на металлические доспехи. Поэтому их легко узнать по обрядовой наготе.\n\nНесмотря на миролюбие, они навлекли на себя гнев и агионистов, и аверсарианцев. Их осуждают как еретиков и извращенцев последней степени; во время паломничеств к местам, связанным с жизнью Катаритоса, их часто избивают и убивают. Но ни гонения, ни гибель собратьев не заставляют их отступить от веры и не останавливают новых последователей."
 forgotten_desc_with_gc:0 "Все подробности о $forgotten_saint_link$;medium Святом#!, которому поклоняется этот культ, включая его имя, утеряны во времени, поэтому последователи носят маски и избегают личной похвалы, подражая отсутствию личности у своего покровителя. Их символ — око их святого, бессмысленно взирающее, неспособное сфокусироваться, пока его имя не будет произнесено вновь."
 forgotten_rite:0 "Забытосвятойск"
 forgotten_rite_adherent:0 "Почитатель Забытого"
 forgotten_rite_adherent_plural:0 "Почитатели Забытого"
 forgotten_rite_adj:0 "Культ Забытого"
 forgotten_rite_desc:0 "Все сведения о святом, которому поклоняется этот культ, включая само его имя, стёрты временем. Поэтому верующие носят маски и не поощряют личных восхвалений, уподобляясь своему безымянному покровителю. Их символ — око святого, смотрящее пустым взглядом, не способным обрести ясность, пока его имя не будет произнесено вновь."
 forgotten_rite_religious_symbol:0 "Забытое Око"
 four_steps_desc_with_gc:0 "Четыре шага — и каждый уводит всё дальше от подлинного предназначения Пути Жизни. Последователи этого обряда утверждают, что лишь власть дарует спасение, а плоть верующих — допустимая ступень к нему. Все остальные ветви Пути Жизни называют это тем, чем оно и является."
