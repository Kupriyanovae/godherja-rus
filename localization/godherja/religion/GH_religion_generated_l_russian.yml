 eamiqiyya_desc_with_gc:0 "Эамиккиин держатся первоначальных наставлений своего основателя Омахийина ибн Сашиля. Тот учил, что видимая [GetBuilding('01_sophocos').GetName] — лишь отражение истинной, перевёрнутой святыни, сокрытой глубоко под землёй, и что верующим надлежит копать в поисках её. Позднейшие откровения Омахийина не изменили их убеждений. Для эамиккиин пророк, вернувшийся с Софокоса, был самозванцем, облачённым в кожу Пророка, а настоящий Омахийин умер."
