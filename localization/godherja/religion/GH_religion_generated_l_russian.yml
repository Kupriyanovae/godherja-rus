 agionist_imperial_cults_desc:0 "Агионизм — религия, основанная на житиях и мученичестве различных [Concept('aversaria','аверсарианских')|E] реформаторов, святых и мятежников. Поначалу последователи этой веры отвергали религиозные обычаи Аверсарии, однако после подавления восстаний их культы были «реабилитированы» и вновь включены в аверсарианскую традицию. Ныне агионисты и аверсарианцы разделяют многие догматы. Позднее агионисты создали крестоносные ордена в [Concept('sarradon','Саррадоне')|E], намереваясь распространять учение своих святых в войнах, известных как [saints_war|E]."
