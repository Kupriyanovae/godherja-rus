 hayaaliyya_rite_desc:0 "Хаяалийин следуют учению Рухваада ибн Хасиля. Они указывают, что Софокос — единственная Башня, к которой люди могут безопасно приблизиться, и видят в этом доказательство того, что лишь она остаётся живой, тогда как остальные мертвы. Со временем их культ объединил традиционные обряды ритуалистов с более необычными ритуалами, которые, как они утверждают, были преподаны самим Рухваадом."
 hayawan_desc_with_gc:0 "Давным-давно Лев, сильнейший из зверей, был один в мире. Могучим рыком он извлёк человечество из земли, и Лев больше не был одинок. Затем пришёл Пёс, страж мёртвых и воинов. Пёс разгневался на Льва, ибо Льву не было дела до жизни созданных им людей, и он не хранил верности своему творению. Прежде чем между ними могла разразиться великая война, Рысь хитростью заставила Льва пригласить Пса в свой дом. Поскольку весь [aeras|E] был домом Льва, он был связан правилами гостеприимства, и так Лев и Пёс стали братьями."
