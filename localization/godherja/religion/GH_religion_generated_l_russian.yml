 haradar_desc_with_gc:0 "[Concept('sarradon','Саррадонская')|E] легенда гласит, что десять тысяч лет назад саррадонские военачальники погрязли в разврате и нечестии, и Столпы, удерживающие Мёртвого Бога в Иблисе, начали рушиться. Когда всё казалось потерянным, из Теней появились храбрые и праведные мужи, чтобы истребить этих лжевладык, и снова исчезли в тени. Правдива ли эта легенда или нет, харадарийцы несколько раз основывались и распускались за тысячелетия, до такой степени, что никто точно не знает, как стар этот орден убийц. Последнее основание произошло вскоре после [Concept('frodbrokna','Фродброкна')|E]. Это новое основание пришло к выводу, что после того, как Эшрей сломал мир, ни один [Concept('magi','маг')|E] не может оставаться в живых. Они озабочены главным образом выслеживанием и убийством Магов, особенно тех, кто обладает богоподобной силой."
