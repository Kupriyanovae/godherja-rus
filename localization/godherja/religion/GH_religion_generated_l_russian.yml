 amaghean_aagiokrata_desc_with_gc:0 "[Concept('aversaria','Аверсианизированная')|E] версия тысяч амагейских вер, Амагейская Аагиократия сильно подчёркивает роль [Concept('magi','магов')|E] (особенно аверсарианской крови) в амагейской вере и их способность возвышаться до божественности наравне с великими воинами прошлого. Более того, Амагейская Аагиократия утверждает, что Маги могут превзойти даже другие божества и быть ближе к Арназу «Великому Предку», вечно правя из небесного рая. Воины всё ещё чаще возносятся, хотя вера подчёркивает, что это происходит через проявление «аспектов Магов» и что они редко, если вообще когда-либо, смогут подняться так же высоко, как одарённые. Эта вера возникла, когда Аверсария умиротворила амагейское побережье; однако она не получила широкого распространения до правления Дедафала Мариамны «Строительницы», которая покровительствовала Амагейской Аагиократии и превратила её в её современное воплощение."
