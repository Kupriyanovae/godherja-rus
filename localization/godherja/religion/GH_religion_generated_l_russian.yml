 drakanorix_aagiokrata_rite_desc:0 "Драканорикс Аагиократа (буквально «Вера драконов» на языках Аверсарии) — древняя религия аверсарианцев, возникшая задолго до известных летописей и появления письменности. Приверженцы считают её исконной верой своего народа. Древнейший известный памятник аверсарианского письма — Драканорамоникар — был создан жрецами этого учения для закрепления его догматов.\n\nДраканорикс Аагиократа поклоняется драконам древней Аверсарии, обожествляя их как воплощения чистой магии и божественной силы, посланные в мир забытым существом, дабы править людьми. Несмотря на разрозненность и огромную географию культов — они встречались даже в Саррадоне, — некогда вера господствовала на нынешнем Имперском острове, в Этепезее и у Раздробленного моря. Она оставалась опорой аверсарианского общества и после образования Аверсаринас Аагиократии, отступив на второй план лишь по окончании Войны тысячи драконов. По иронии судьбы, в Гражданской войне жрецы драконов поддержали имперскую сторону: давняя ненависть к аерсодиаксианству сблизила их с аагиократами. После победы Летигианекс перебил последних драконов, а вместе с ними — уцелевших культистов. Последний верховный жрец Драконьего культа предпринял отчаянное восстание при аутократии Маклее, в разгар её чисток. Его освежевали и прибили к дворцовой стене осквернёнными рогами драконов."
 eabuyad_al_duhaad_khubir_desc_with_gc:0 "Рабы Великого Червя поклоняются [Concept('the_worldeater','Пожирателю Миров')|E] и тому, что они считают его бесчисленным потомством глубоко под [Concept('aeras','Эрасом')|E]. Рабы Великого Червя почитают Пожирателя Миров как Великого Червя, или аль-Духаад Хубир, а его потомство — как Великих Червей, или аль-Дийхаадан аль-Эазаам. Только принося Великим Червями жертвы и поклонение, они могут оставаться спящими под землёй, и Рабы считают своим долгом предотвратить пробуждение ещё одного Великого Червя."
