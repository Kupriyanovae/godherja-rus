 mountain_sun_revivalism_desc_with_gc:0 "Хотя Храм Горного Солнца сохранился при [Concept('aversaria','Аверсаринас')|E] Аагиократии, падение [Glossary( 'Аутократы', 'GH_AAUTOKRATA_GLOSS' )] и распад Имперского культа после Жреческого переворота в Орайсполе вынудили знать Опахасии переосмыслить прежний порядок. Тем из аристократов, кто пережил [Concept('sjalvolki_migration','Переселения')|E], сохранив власть, было гораздо легче расстаться с наследием Аутократы, чем многим бывшим соотечественникам. Древние титулы и почести Горного Солнца, уцелевшие на протяжении существования империи, вновь обрели силу, а имперские звания были отброшены. Интерес к возрождению древней веры подогрело движение Воспоминания о Новом Солнце: жрецы Алых Избранных из [GetBuilding('01_vounill').GetName] разошлись по Опахасии, вооружённые тысячами древних книг и свитков, собранных их орденом."
 mountain_sun_revivalism_faith:0 "Возрожденческо-горносолнечн"
