 deep_one_cult_desc_with_gc:0 "«Силы глубин многообразны в своих формах и жестокостях, но им должно быть воздано поклонение, ибо их сила не знает равных». Так было научено фаламаи [Concept('hameh','Виридесцентным Пророком')|E]. Культисты печально известны тем, что убивают всех встреченных в море, иногда захватывая пленников для использования в кощунственном ритуале, превращающем их в проводников для общения с богами внизу."
