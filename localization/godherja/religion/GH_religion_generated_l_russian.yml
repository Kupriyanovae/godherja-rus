 shattered_stars_cult_rite_desc:0 "После [Concept('frodbrokna','Фродброкны')|E] последователи Священных Звёзд стали свидетелями самой травмирующей трагедии — разрушения [Concept('aervalr','Эрвала')|E], древних чертогов самых любимых героев. Когда её разбитые руины падают на [Concept('aeras','Эрас')|E], их последователи озлобились, проклиная тех, кто обладает магической силой, и изгоняя их со своих [Concept('shatteredisles','Островов')|E]. Последователи проповедуют, что только через большее поклонение древним пантеонам — добровольное или нет — они могут быть спасены от судьбы вечной разобщённости и угасания света."
 sheharddi_desc_with_gc:0 "Истоки веры шехарддов окутаны тайной, и учёные спорят о том, является ли она синкретизмом нескольких [Concept('sarradon','саррадонских')|E] вер, культом единого бога, отделившимся от более крупной политеистической религии, или же уцелевшими остатками более древней веры. Они верят, что верховный бог Элой, создатель небес, сотворил расу под названием Маликийя, или Вестники. Старший из них, Эйр-Шайтан, создал ещё более низшую расу существ — людей — чтобы те служили ему и поклонялись ему и его шести помощникам как существам, превосходящим их отца. Это привело к изгнанию человечества из рая после [Concept('kalnaih','Кальнайха')|E], и только ведя честную и праведную жизнь, можно вернуться на небеса, чтобы вечно поклоняться Ему."
