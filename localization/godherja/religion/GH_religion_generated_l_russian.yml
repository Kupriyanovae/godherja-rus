 gh_sjalvolki_religion_religious_head_title_name:0 "Роща [Glossary('Велоса','VELOS_GLOSS')]"
 gisredde_desc_with_gc:0 "Обряд, которого придерживаются конклавы Пети и Большого Гисредде: их Отцы Пути подчиняются земной, а не духовной власти. Хотя учение почти не отличается от веры Раокура, последователи Гисредде тяготятся его верховенством и неоднократно откалывались от конклава."
 gisredde_rite:0 "Обряд Гисредда"
 gisredde_rite_adherent:0 "Гисреддец"
 gisredde_rite_adherent_plural:0 "Гисреддцы"
 gisredde_rite_adj:0 "Конклав Гисредда"
 gisredde_rite_desc:0 "Обряд, которого придерживаются конклавы Пети и Большого Гисредде: их Отцы Пути подчиняются земной, а не духовной власти. Хотя учение почти не отличается от веры Раокура, последователи Гисредде тяготятся его верховенством и неоднократно откалывались от конклава."
 gotharnalmic_desc_with_gc:0 "Для последователей [Glossary('готарналмиков','GH_GOTHARNALMIC_GLOSS')] запрет Богов-Близнецов на рабство включает в себя принуждение чужаков к принятию их образа жизни. Таким образом, хотя их уважают все наттананы, последователи в основном держатся особняком в самых глухих чащобах джунглей.\n\nГотарналмики также избегают войны и насилия как развращающей силы, из-за которой пал [Concept('great_betrayal','Корлаку')|E], и верят, что единственное время, когда это дозволено Богами-Близнецами, — это когда это делается для защиты своего."
 gotharnalmic_rite:0 "Готарналмик"
 gotharnalmic_rite_adherent:0 "Сепаттанец"
 gotharnalmic_rite_adherent_plural:0 "Сепаттанцы"
 gotharnalmic_rite_adj:0 "Сепаттан"
 gotharnalmic_rite_desc:0 "Для последователей [Glossary('готарналмиков','GH_GOTHARNALMIC_GLOSS')] запрет Богов-Близнецов на рабство включает в себя принуждение чужаков к принятию их образа жизни. Таким образом, хотя их уважают все наттананы, последователи в основном держатся особняком в самых глухих чащобах джунглей.\n\nГотарналмики также избегают войны и насилия как развращающей силы, из-за которой пал [Concept('great_betrayal','Корлаку')|E], и верят, что единственное время, когда это дозволено Богами-Близнецами, — это когда это делается для защиты своего."
 graveright_desc_with_gc:0 "Право Мертвых — это древняя вера ойчайнцев северных земель. Некогда доминирующая вера на территории нынешних [Concept('the_lichdoms','личеств')|E], Право Мертвых (или Мрогилпрано для ойчиянзов) сосредоточено на вере в то, что душа остаётся с телом в загробной жизни. Когда душа уходит, она наблюдает за теми, кто вокруг неё, и защищает их, пока тело также защищено и уважаемо. В лучшие времена почитатели Права Мертвых хранили тела умерших в огромных некрополях по городам севера, обеспечивая, чтобы все умершие в городе могли вечно служить стражами для своих потомков, как живые делали для них.\n\nЭто, разумеется, [Concept('sorrowing_of_oejeynica','оказалось пороховой бочкой')|E], и ныне Право Мертвых — почти мёртвая религия. Даже там, где она сохранилась, её догматы редко соблюдаются, а хранение мёртвых вместо их сожжения считается безумием."
