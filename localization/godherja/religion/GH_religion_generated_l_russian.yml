 dejorig_rite_desc:0 "Дежориг — вера северных рабов бывшей Майикраты. Её воззрения сложились прежде всего среди невольников, которых отправляли раскапывать и исследовать тёмные туннели Майикраты, — работы, почти неизменно приводившей людей к гибели. Последователи дежорига полностью отвергают магию, считая её отвратительным злом, и со страхом перешёптываются о её воздействии на то, что скрывается под Цитаделью. Для дежоригов магия — источник зла в мире и, возможно, причина его грядущей гибели."
