 seven_one_desc_with_gc:0 "Объединённый, кодифицированный и очищенный под оком Ордена Одинокого Стража, агионизм ныне един в почитании Святых, замученных [Concept('aversaria','аверсарианцами')|E]. Хотя изначально агионисты выступали против аверсарианских религиозных обычаев, после окончания их восстаний их культы были «реабилитированы» и вновь вписаны в аверсарианское вероучение; ныне агионисты и аверсарианцы разделяют многие догматы. Почти все Святые, почитавшиеся ранее, включены в Канон, за одним заметным исключением — ныне еретического Культа $forgotten_saint_link$;medium Забытого Святого#!."
 seven_one_rite:0 "Септарианск"
 seven_one_rite_adherent:0 "Септарианец"
 seven_one_rite_adherent_plural:0 "Септарианцы"
 seven_one_rite_adj:0 "Септарианский агионизм"
 seven_one_rite_desc:0 "Под присмотром Ордена Забытого Хранителя агионизм был объединён, систематизирован и очищен. Теперь его последователи едины в почитании святых, замученных аверсарианцами. Поначалу агионисты отвергали религиозные обычаи Аверсарии, однако после окончания восстаний их культы были «реабилитированы» и вновь включены в аверсарианскую традицию. Сегодня обе веры разделяют множество догматов. Почти все ранее почитаемые святые вошли в канон; единственное заметное исключение — культ Забытого Святого, отныне объявленный еретическим."
 seven_one_rite_religious_symbol:0 "Семиконечная Звезда"
