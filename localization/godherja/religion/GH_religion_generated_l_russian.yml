 aarayi_rite_desc:0 "Само название «А'Арайи» означает «регентство». Это течение возникло, когда Таттали объединил Восточный и Западный Мамураматы, уведя за собой большинство обессиленных дворов Востока. Однако несколько дворов отказались ему подчиниться. Сплотившись вокруг Афнаана, верховного судьи, ставшего военачальником, они отвергли притязания Таттали, основанные на браке. Поскольку законного правителя, способного занять его место, не нашлось, учреждённый по настоянию Афнаана Верховный суд Востока должен был исполнять обязанности регента до появления законного наследника восточного престола. Увы, материнская линия рода Заахира, по всей видимости, полностью пресеклась. Единственное исключение — дети Санада от Таттали, но узурпация их отца лишила их законных прав. Поэтому осуществить намеченное оказалось непросто.\n\nНа протяжении веков Верховный суд Востока поддерживал немало претендентов на престол, однако ни один из них так и не одержал победы. Упрямые судьи Арайи убеждены: падение татталитской ереси — лишь вопрос времени."
 abathonic_cult_desc_with_gc:0 "Поклонение Абатону, древнему пророку, богу-царю и создателю [Concept('shatteredisles','Островов')|E], существует тысячелетия. Абатонисты таинственны, но известно, что они верят, что их божественные [magi|E1] вознеслись после таинственного путешествия к каждому из островов Лей-линий, каким-то образом пережив их огромную силу и создав ритуал «Рождения души» для обретения бессмертия. Сохранились лишь фрагменты, но легенды гласят, что ритуал включает уничтожение души ребёнка и дарование пустого сосуда Абатону. Хотя верующих часто высмеивают за их верования, [Concept('aversaria','аверсарианцы')|E] потеряли множество экспедиций в поисках истины в легендах об Абатоне."
