 shehzarani_rite_desc:0 "Многие пытались объяснить сходство и примирить различия между заоранийской и шехардийской верами. Шехзаранизм представляет собой древнее слияние, утверждая, что высший Бог является единым универсальным божеством, известным под бесчисленными именами на протяжении веков, будь то ЭЛОЙ, Заоран или другие. Его последователи верят, что это единое божественное существо никогда не переставало направлять человечество, посылая множество Пророков на протяжении истории, происходящих от Первых сновидцев, Маликийя, каждый из которых был адаптирован к своему времени и народу, чтобы учить вечному посланию праведности против обмана. Верные могут не только вернуться к божественной благодати Бога, но и помочь в его конечной, предсказанной победе над всяким обманом, отвергнув изначальный обман Эйр-Шайтана."
 sheticad_desc_with_gc:0 "Шетикадизм — это древняя система верований шетиканцев, почти забытого народа из западных Клановых земель.\n\nВеря в бога Эфиоса, шетиканцы утверждают, что их бог погиб, сражаясь со вторым солнцем, которое было уничтожено в битве и взорвалось, превратившись в звёзды на небе. Шетикадцы верят, что новые звёзды слились с сущностью мёртвого бога, и что судьбу и пророчества теперь можно предсказывать, изучая их — древняя божественная воля Эфиоса всё ещё мерцает в каждой из них."
