 stranuni_desc_with_gc:0 "Экзотическая ветвь [Concept('wardenism','варденизма')|E], отрезанная от варденитских земель, странунийские верования постепенно превратились во что-то поистине странное. Странунийцы считают, что слова и структура этих слов обладают великой силой, и что столпы, удерживающие Мёртвого Бога в темнице, на самом деле являются пятью различными священными формами поэзии и музыки. Они считают, что эти формы должны постоянно практиковаться, а поэты-судьи обязаны знать хотя бы один из стилей. Однако странунийцы считают крайне важным, чтобы эти священные формы не использовались во зло и практиковались только при подобающих обстоятельствах. Это приводит к парадоксальному обществу, где музыка и поэзия одновременно повсеместны и строго регламентированы."
 stranuni_faith:0 "Странунийск"
 stranuni_faith_adherent:0 "Странуниец"
