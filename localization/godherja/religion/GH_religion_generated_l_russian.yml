 eabuyad_ilah_al_atilaam_desc_with_gc:0 "Рабы Бога Боли верят, что мир был создан злобным богом Ашредом мин Башитан аль-Атилаам. Когда он создавал мир, он оторвал свою плоть, чтобы сделать растения, а свои кости растёр в пыль, чтобы заполнить полую сферу, которую он использовал для создания земли, ставшую почвой и металлами земли. Затем он создал животных, сжигая себя, и создал расу людей, вырвав своё сердце. Наконец, он использовал свой позвоночник, чтобы воздвигнуть [GetBuilding('01_sophocos').GetName] и Шпили Скорби. Вложив так много себя в мир, он дал первым людям простую заповедь: идите и убивайте. Чем больше людей будет убито и будет страдать, тем скорее Бог Боли восстановит своё тело. Легенды Рабов гласят, что Ашреду поклонялась в древности империя могучих воинов, но их империя рухнула, и, лишённая регулярных жертв, Ашред жестоко наказал человечество. Чтобы предотвратить дальнейшие наказания, Рабы должны страдать, чтобы другие не страдали."
