 cult_of_the_bitter_wave_desc_with_gc:0 "«Тот, кто ждёт, затаившийся, безмятежный, предвестник, непоколебимый, тот, кто ждёт пришествия Ч'нглуйярога, распадения и возрождения этого проклятого мира. Хвала Тагонгту, Богу Горькой Волны!»\n\nКультистов Горькой Волны без исключения считают жутким народом с совершенно нелепыми верованиями. Преданные таинственному богу Тагонгту, чьё истинное имя известно лишь высшим слоям их жреческой иерархии, культисты Горькой Волны практикуют ряд исключительно тревожных ритуалов, которые, по их мнению, необходимы для общения со странным богом моря. Человеческая кровь является распространённым компонентом, хотя время от времени используются и другие странные материалы, такие как необычные черепа, напоминающие родственную человечеству группу. Как или где они добывают такие черепа и другие странные диковины, неизвестно. И жрецы, и миряне носят шлемы и доспехи, не похожие ни на одну другую культуру на [Concept('aeras','Эрасе')|E], озадачивая учёных, задающихся вопросом о предназначении такого облачения. Добавляет загадочности этому культу частое, но часто отвергаемое сообщения рыбаков [Concept('shatteredisles','Островов')|E] о том, что в море скрывается огромное существо, бесчисленные бесцветные глаза которого устремлены к поверхности. Оно наблюдает... и ждёт."
 cult_of_the_bitter_wave_rite:0 "Горько-волн"
 cult_of_the_bitter_wave_rite_adherent:0 "Культист Горькой Волны"
 cult_of_the_bitter_wave_rite_adherent_plural:0 "Культисты Горькой Волны"
 cult_of_the_bitter_wave_rite_adj:0 "Культ Горькой Волны"
