 underimperial_aagiokrata_desc_with_gc:0 "Когда город Неветексон рухнул в [Concept('mayikrata','подземный мир')|E] благодаря усилиям [Concept('magi','мага')|E] Аваксона и его революции против [Concept('chaos_of_the_seventh_century','оккупационных')|E] армий [Concept('kartharadd','Картарадди')|E], они приземлились в пещере, охваченной войной. На их острове посреди великой бездны курратаггаггцы и скраттакийцы воевали, и вскоре к великой битве присоединились недавно прибывшие [Concept('aversaria','имперцы')|E] и выжившие армии Картарадди, что уничтожило большую часть того, что осталось от Неветексона.\n\nУченик Аваксона, Зекрос, положил конец войне открытием Маяка и подписанием Бездонного Мира. После этого Блик-Бикон стал, возможно, крупнейшим городом в подземном мире, и странное слияние племенных, картараддцев (странно пощажённых от [Concept('night_of_the_bleeding_moon','судьбы своих сородичей на поверхности')|E]) и имперцев привело к формированию аагиократического культа, смешивающего каждую веру, представленную в Бездонном Мире."
 underimperial_aagiokrata_faith:0 "Подземно-имперско-аагиократическ"
 underimperial_aagiokrata_faith_adherent:0 "Подземно-имперский аагиократ"
