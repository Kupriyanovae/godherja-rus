 waharai_desc_with_gc:0 "Вахарайцы считают, что смерть Всевышнего была всего лишь Его вознесением, и что Он ждёт на небесах тех, кто примет эту истину. Их отношение к благочестию гораздо более снисходительно, чем у их собратьев. Для вахарайцев ваши действия на [Concept('aeras','Эрасе')|E] не имеют значения, ибо лишь вера во Всевышнего принесёт вам награду. В результате правила, которым они следуют, менее формальны и структурированы, предоставляя гораздо больше свободы тем, кто был бы наказан другими верованиями, при условии, что они сохраняют свои убеждения."
