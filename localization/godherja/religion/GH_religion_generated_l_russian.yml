 eirbaadit_al_muntarisa_desc_with_gc:0 "Культ Монолитов был основан королём-авантюристом Хасааром аль-Хуром в 727 году ИС. Его последователи поклоняются трём белым монолитам с необычайно сложной резьбой и идеально гладкой поверхностью, стоящим в [GetTitleByKey('b_arzoia').GetNameNoTooltip]. Они утверждают, что окроплённые кровью камни возвещают заповеди самым преданным почитателям. Постепенно обрядовое кровопускание превратилось в принесение преступников в жертву монолитам: считается, что это делает веления громче, ибо в ответ на простую жертву крови их почти не расслышать. По верованиям культа монолиты воплощают подземного трёхглавого бога жизни и смерти, который первым взошёл по Тысяче и одной ступени Софокоса и стал Царём всех богов."
