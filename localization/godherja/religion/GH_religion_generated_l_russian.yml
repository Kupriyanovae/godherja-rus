 hazrandanism_desc_with_gc:0 "Некогда одно из самых популярных движений после смерти $amsari_prophet_link$ Пророка#! и некоторое время после установления Амсарского Хиклахна, хазранданизм отвергает письменные писания, веря, что они искажают вечную и адаптивную природу божественной истины. Для хазранданцев вера должна сохраняться через устную традицию, поскольку эволюция языка и личное понимание необходимы для сохранения её истинного смысла. Со временем движение пришло в упадок, столкнувшись с репрессиями со стороны [Concept('gh_frazan','фразанов')|E], которые рассматривали его учения как прямую угрозу целостности послания Пророка. Теперь лишь небольшие разрозненные общины продолжают поддерживать его традиции."
 hazrandanism_rite:0 "Хазранданск"
 hazrandanism_rite_adherent:0 "Хазранданец"
 hazrandanism_rite_adherent_plural:0 "Хазранданцы"
 hazrandanism_rite_adj:0 "Хазранданизм"
 hazrandanism_rite_desc:0 "Некогда хазранданизм был одним из самых распространённых течений после смерти Пророка и в первые годы существования амсарского хиклахна. Он отвергает письменные священные тексты, полагая, что те искажают вечную и изменчивую природу божественной истины. Хазранданиты считают, что вера должна сохраняться устным преданием, а перемены в языке и личное осмысление необходимы, чтобы её подлинный смысл оставался живым. Со временем течение пришло в упадок, подвергаясь преследованиям фразанитов, видевших в его учении прямую угрозу чистоте послания Пророка. Ныне традиции поддерживают лишь небольшие разрозненные общины."
 hero_religion_desc_with_gc:0 "«Культ героя» — это обобщающий термин для тысяч малых вер, связанных общей системой верований, которая ставит выдающихся смертных в центр поклонения, происходящих из Западных [Concept('shatteredisles','Островов')|E]. Хотя их легенды могут иногда включать упоминания о равнодушных божествах и сотрясающих мир левиафанах, большинство пантеонов культов героев состоят почти полностью из мужчин и женщин великих деяний, которые, как считается, имеют некоторую связь с местной историей — хотя эта связь часто может быть весьма сомнительной, спорной или полностью вымышленной. Несмотря на склонность к возвеличиванию великих воинов чаще, чем героев из других слоёв, рассказы о подвигах великих авантюристов, торговцев, учёных, плутов и [Concept('magi','магов')|E] ценятся не меньше, чем их более воинственные аналоги."
 hero_religion_rite:0 "Культ героев"
 hero_religion_rite_adherent:0 "Культист героя"
