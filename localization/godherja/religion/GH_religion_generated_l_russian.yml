 asdraqi_desc_with_gc:0 "Асдракийцы считают, что все, кто отвергает учения [Concept('the_first_warden','Первого Вардена')|E], активно замышляют освободить Мёртвого Бога, и что нападки язычников на веру — лишь первый шаг в их планах опустошения. Таким образом, главный долг всех [Concept('wardenism','варденитов')|E] — активно нападать на эти враждебные веры, ибо только их полное искоренение спасёт мир от их козней и лжи. Они верят, что Законы Войны всё ещё действуют, и что борьба с неверными не может иметь ограничений. Они отвергают Центральный [mamuramat|E1] как слабый и непригодный для руководства верой, вместо этого выступая за возвращение Западного, Восточного и даже Дальневосточного [Concept('mamuramat','Мамураматов')|E], а также за создание совершенно новых. Для асдракийцев всё должно служить войне."
