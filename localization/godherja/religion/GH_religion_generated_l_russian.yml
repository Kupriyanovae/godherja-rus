 adabyssian_faith_desc:0 "Лишь самым очищенным дозволено лицезреть величайшие статуи собственными глазами. Это жрецы входят в трансы в кельях храмов, внимая велениям богов под золотом и передавая их в понятные приказы для мирских «правителей». Превыше всего было одно веление, повторяемое богами на протяжении веков: идите и завоёвывайте, дабы весь мир присоединился к их молению."
