 theryionist_rite_desc:0 "Терионисты поклоняются Териону, «Последнему Дракону», древнему аверсарианскому претенденту на имперский престол.\n\nТерион, внучатый племянник аутократии Маклеи, воспитывался в тайне: его род стремился вернуть трон, который, по мнению семьи, Маклея узурпировала. После смерти деда двадцатилетний Терион вышел из укрытия и обрушился на Аверсарию, раздираемую гражданской войной. Вместо драконов, которых тогда считали вымершими, он оседлал виверну и развязал Вдовью войну. Вскоре о нём начали слагать легенды, а даже враги прозвали его «Последним Драконом», признавая верность древним представлениям о чести и идеалам Аверсарии до времён Маклеи. Война окончилась лишь после его предполагаемой гибели, почти сорок лет спустя, после бесчисленных жестоких сражений. Терионисты же утверждают, что Терион был духом в человеческом обличье и просто вознёсся на небеса, чтобы вершить там кровавое правосудие. Согласно их вере, Терион направляет мир из бесплотного Первого Города и однажды вернётся, возродившись Чистейшим, чтобы возвратить принадлежащий ему по праву престол."
 theryionist_rite_old:0 "Старотерионистск"
 theryionist_rite_old_adherent:0 "Старый терионист"
 theryionist_rite_old_adherent_plural:0 "Старые терионисты"
 theryionist_rite_old_adjective:0 "Старотерионистск"
 theygundaropei_aagiokratian_desc_with_gc:0 "Когда [aversaria|E] пришла за Тейгундаропе, древние верования были утеряны под жестоким натиском тотальной войны и геноцида. Что осталось — это легенда о Пяти Фигурах, древних пророках, спасших свой народ от уничтожения через подчинение Чистейшему. Доказав свою Чистоту, они вознеслись из этого мира, присоединившись к Чистейшему в божественности навечно.\n\nИх учения о Кровопочитании и самопожертвовании почитаются многими знатными родами, которые всё ещё ведут свою родословную к Пяти, сохраняя их наследие через мир и непрерывное правление только тех, кто благословлён Чистотой. Хотя [aversarinas_aagiokratia|E] в целом не одобряла эту вопиющую ересь, поколения наместников находили сосуществование наиболее прибыльным и стабильным курсом действий."
 theygundaropei_aagiokratian_rite:0 "Пять фигур"
 theygundaropei_aagiokratian_rite_adherent:0 "Ведомый Пятью"
 theygundaropei_aagiokratian_rite_adherent_plural:0 "Ведомые Пятью"
 theygundaropei_aagiokratian_rite_adj:0 "Пять Фигур"
 theygundaropei_aagiokratian_rite_desc:0 "Когда [aversaria|E] пришла за Тейгундаропе, древние верования были утеряны под жестоким натиском тотальной войны и геноцида. Что осталось — это легенда о Пяти Фигурах, древних пророках, спасших свой народ от уничтожения через подчинение Чистейшему. Доказав свою Чистоту, они вознеслись из этого мира, присоединившись к Чистейшему в божественности навечно.\n\nИх учения о Кровопочитании и самопожертвовании почитаются многими знатными родами, которые всё ещё ведут свою родословную к Пяти, сохраняя их наследие через мир и непрерывное правление только тех, кто благословлён Чистотой. Хотя [aversarinas_aagiokratia|E] в целом не одобряла эту вопиющую ересь, поколения наместников находили сосуществование наиболее прибыльным и стабильным курсом действий."
 theygundaropei_cult_desc_with_gc:0 "Тысячелетие [Concept('aversaria','аверсарианского')|E] правления ознаменовалось возвышением и падением бесчисленных восстаний рабов на [Concept('shatteredisles','Островах')|E], часто совпадающих с шёпотом о древней борьбе против вечного [Glossary('Аавтократии','GH_AAUTOKRATA_GLOSS')] со стороны порабощённых масс. В хаосе [Concept('frodbrokna','Фродброкны')|E] тысячелетняя вера наконец вышла на свет по всем островам. История всегда начинается с Пятого, фигуры инакомыслия, давно преисполненной сожалений. В тени смерти Пятый возненавидел Четверых, увидев порчу запятнанной крови, которая едва не привела к гибели их народа.\n\nПятый проповедовал тем, кто готов был слушать, Истину — послание о предательстве, которое привело его новых последователей к отправлению его к древним богам прошлого. Пятеро должны пасть, их потомки быть истреблены, острова освобождены, их народ восстановлен на землях, которые они некогда называли домом, и положен конец войне, которая не была проиграна."
