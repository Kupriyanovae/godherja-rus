 innerpath_desc_with_gc:0 "«Внутренний путь» на самом деле является общим названием для нескольких версий Жизненного пути, обычно практикуемых в более отдалённых или суровых частях [chevalie|E], в основном в горной глуши, где ещё сохранились последние из галликадов. Будучи куда более свободным во многих правилах и по своей природе, чем основное течение Жизненного пути, он является результатом попыток проповедников Жизненного пути примирить несколько исконных верований галликадов с верованиями своей веры.\n\nХотя со временем он постепенно вышел из употребления и был в целом отвергнут марочникским обществом — особенно после всеобщей враждебности к фракционности в вере после Войны принцев-еретиков, — он тем не менее всё ещё популярен в некоторых кругах."
