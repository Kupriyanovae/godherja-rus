 ritualist_abarajism_faith:0 "Абараджи'а"
 ritualist_abarajism_faith_adherent:0 "Абараджи"
 ritualist_abarajism_faith_adherent_plural:0 "Абараджииин"
 ritualist_abarajism_faith_adj:0 "Абараджи"
 ritualist_abarajism_faith_desc:0 "Абараджийин верят, что [GetBuilding('01_sophocos').GetName] существует во множестве мест на [Concept('aeras','Аэрасе')|E] и каждое из них в той или иной степени достойно поклонения."
 ritualist_blood_cultist_faith:0 "Ахлет аль-Дем"
 ritualist_blood_cultist_faith_adherent:0 "Ритуалист"
 ritualist_blood_cultist_faith_adherent_plural:0 "Ритуалисты"
 ritualist_blood_cultist_faith_adj:0 "Ритуализм"
 ritualist_blood_cultist_faith_desc:0 "Порождённые долгой историей кровавой магии и культов смерти Саррадона, ахлет аль-Дем, или «Люди Крови», образуют рыхлое объединение [Concept('ritualism','ритуалистов')|E], почитающих давно забытые личности посредством человеческих жертвоприношений и кровавых обрядов."
 ritualist_duhaadist_faith:0 "Атаабай аль-Духаад Хубир"
 ritualist_duhaadist_faith_adherent:0 "Духаадиец"
 ritualist_duhaadist_faith_adherent_plural:0 "Духаадийин"
 ritualist_duhaadist_faith_adj:0 "Эабуяд аль-Духаад Хубир"
 ritualist_duhaadist_faith_desc:0 "Духаадийин считают Пожирателя Миров божественным существом: богом, воплощением бога или посланником богов."
 ritualist_eastern_radicalist_faith:0 "Корккаттирканск"
 ritualist_eastern_radicalist_faith_adherent:0 "Ритуалист"
 ritualist_eastern_radicalist_faith_adherent_plural:0 "Ритуалисты"
 ritualist_eastern_radicalist_faith_adj:0 "Ритуализм"
 ritualist_eastern_radicalist_faith_desc:0 "Корккаттиркана — секта [Concept('ritualism','ритуалистов')|E] с [Concept('pirate_coast','Пиратского побережья')|E]. Её последователи верят, что восхождение на [GetBuilding('01_sophocos').GetName] может завершить лишь величайший из верующих. Каждый старается превзойти остальных, словно в состязании за право первым достичь вершины."
 ritualist_esoterist_faith:0 "Ахлет аль-Веди"
 ritualist_esoterist_faith_adherent:0 "Веди"
 ritualist_esoterist_faith_adherent_plural:0 "Ведииин"
 ritualist_esoterist_faith_adj:0 "Ахлет аль-Веди"
 ritualist_esoterist_faith_desc:0 "Ведийин происходят от древних вер [Glossary('долины Хенем','khenemhat_encyclopedia_desc')]. Их относят к [Concept('ritualism','ритуализму')|E] из-за места, которое [GetBuilding('01_sophocos').GetName] занимает в их учении (порой весьма скромного), и обрядов, за тысячелетия перенятых у основных направлений ритуалистов. Обе стороны охотно вспоминают об этом родстве, когда оно оказывается им выгодно."
 ritualist_geminamist_faith:0 "Геминамен"
 ritualist_geminamist_faith_adherent:0 "Геминами"
 ritualist_geminamist_faith_adherent_plural:0 "Геминамииан"
 ritualist_geminamist_faith_adj:0 "Геминами"
 ritualist_geminamist_faith_desc:0 "Ветвь ритуализма, испытавшая влияние местных верований [Glossary('Кратемезина','crater_encyclopedia_desc')]. Её богословие уделяет особое место музыке и магии [aspect_hymns]."
 ritualist_hubarist_faith:0 "Хубаритск"
 ritualist_hubarist_faith_adherent:0 "Хубари"
 ritualist_hubarist_faith_adherent_plural:0 "Хубарииин"
 ritualist_hubarist_faith_adj:0 "Хубари"
 ritualist_hubarist_faith_desc:0 "Хубариты принадлежат к древней вере [Concept('sarradon','Саррадона')|E], которую [living_magi|E] исповедовали с самых ранних известных времён. В центре их учения стоит Солнце — первоисточник всего сущего. Его благословения нисходят на [Concept('magi','магов')|E] подобно лучам, освещающим посевы. Следуя по небу, Солнце перевозит души умерших в своё царство, где по ночам держит двор. Враг Солнца — Олум, посылающий своего воплощённого слугу, [Concept('aervalr','Луну')|E], на ночную охоту за светилом."
 ritualist_malaikist_faith:0 "Атаабай Малаики аль-Софокос"
 ritualist_malaikist_faith_adherent:0 "Малаикиец"
 ritualist_malaikist_faith_adherent_plural:0 "Малаикииин"
 ritualist_malaikist_faith_adj:0 "Сабиат аль-Малаикия"
 ritualist_malaikist_faith_desc:0 "Малаикийин отвергают поклонение богам: они либо отрицают их существование, либо считают его несущественным для человечества. Вместо этого они чтят ангелов, которые, по преданию, обитают внутри [GetBuilding('01_sophocos').GetName] и вокруг него, направляя смертных и вмешиваясь в их судьбы."
 ritualist_monolithist_faith:0 "Хасанийск"
 ritualist_monolithist_faith_adherent:0 "Ритуалист"
 ritualist_monolithist_faith_adherent_plural:0 "Ритуалисты"
 ritualist_monolithist_faith_adj:0 "Ритуализм"
 ritualist_monolithist_faith_desc:0 "Культ Монолитов основан королём-авантюристом Хасааром аль-Хуром в 727 году ИС. Его приверженцы почитают три белых монолита с необычайно сложной резьбой и идеально гладкой поверхностью, стоящих в [GetTitleByKey('b_arzoia').GetNameNoTooltip]. По их словам, окроплённые кровью камни возвещают заповеди самым верным последователям. Постепенно обрядовое кровопускание сменилось принесением преступников в жертву: считается, что так монолиты говорят громче, ведь на обычные приношения крови они отвечают почти неслышно. Камни якобы воплощают подземного трёхглавого бога жизни и смерти, первым преодолевшего Тысячу и одну ступень Софокоса и ставшего Царём всех богов."
 ritualist_nihilist_faith:0 "Мазхуб аль-Сураб"
 ritualist_nihilist_faith_adherent:0 "Ритуалист"
 ritualist_nihilist_faith_adherent_plural:0 "Ритуалисты"
 ritualist_nihilist_faith_adj:0 "Ритуализм"
 ritualist_nihilist_faith_desc:0 "Сурабийин — [Concept('ritualism','ритуалисты')|E], убеждённые, что мир, воспринимаемый людьми, не обладает подлинным существованием, а весь [aeras|E] — лишь иллюзия. Они надеются, что [GetBuilding('01_sophocos').GetName] так или иначе поможет им освободиться от обмана чувств и, возможно, обрести просветление."
 ritualist_omahyyinist_faith:0 "Омахиини'а"
 ritualist_omahyyinist_faith_adherent:0 "Омахиини"
 ritualist_omahyyinist_faith_adherent_plural:0 "Омахиинииин"
 ritualist_omahyyinist_faith_adj:0 "Омахиини"
 ritualist_omahyyinist_faith_desc:0 "Омахийинийин следуют наставлениям [Concept('ritualism','пророка-ритуалиста')|E] Омахийина ибн Сашиля. Они разделились на сторонников его первоначального учения и тех, кто принял позднейшие откровения, полученные им на вершине [GetBuilding('01_sophocos').GetName]. Хотя оба течения противостоят друг другу, Омахийина по-прежнему признают пророком и те и другие."
 ritualist_physicalist_faith:0 "Акшар аль-Мийалаф ва-ль-Касахир"
 ritualist_physicalist_faith_adherent:0 "Мииалафи"
 ritualist_physicalist_faith_adherent_plural:0 "Мииалафииин"
 ritualist_physicalist_faith_adj:0 "Мииалафи"
 ritualist_physicalist_faith_desc:0 "Возможно, древнейшая из материалистических ветвей [Concept('ritualism','ритуализма')|E] — Акшар аль-Миялаф ва-ль-Касахир, что означает «Ритуализм тысячи и одного обряда». Её последователи верят, что 1001 ритуал отражает Тысячу и одну ступень Софокоса, хотя значительно расходятся во мнениях о том, какие ритуалы законны и как следует их исполнять. Признание множества богов и ангелов наряду с разнообразием обрядов, возможно, объясняет долговечность этого течения и его способность приспосабливаться к меняющимся временам."
 ritualist_qubaalist_faith:0 "Квбали'а"
 ritualist_qubaalist_faith_adherent:0 "Ритуалист"
 ritualist_qubaalist_faith_adherent_plural:0 "Ритуалисты"
 ritualist_qubaalist_faith_adj:0 "Ритуализм"
 ritualist_qubaalist_faith_desc:0 "Кубаалисты поклоняются вампирам как божественным существам и считают Кубаала, Первого Вампира, своим изначальным богом."
 ritualist_radicalist_faith:0 "Замитаалат Кумайш"
 ritualist_radicalist_faith_adherent:0 "Кумаиши"
 ritualist_radicalist_faith_adherent_plural:0 "Кумаишииин"
 ritualist_radicalist_faith_adj:0 "Кумаиши"
 ritualist_radicalist_faith_desc:0 "Братство Кумайша, или Замитаалат Кумайш, основал пророк Кумайш ибн Софокос — неграмотный и необразованный человек, живший близ [Concept('the_towers','Башни')|E]. Кумайш утверждал, что организованное жречество противоречит откровениям [GetBuilding('01_sophocos').GetName], а чтобы стать пророком Башни, не обязательно быть образованным, знатным или даже умным. Для кумайшийин сама мысль о царе-жреце, верховном жреце или богоцаре отвратительна: любое устроенное жречество лишь подавляет истины, возвещаемые на ступенях Софокоса. Поэтому жрецами должны быть только миряне, а попытки навязать им иерархию или создать единый канон надлежит пресекать силой. Восхождение на [GetBuilding('01_sophocos').GetName] — высшая обязанность каждого истинного кумайшита; все члены секты и будущие жрецы должны совершить его хотя бы раз в жизни."
 ritualist_religion_bishop:0 "Олотала"
