 agiopolei_desc_with_gc:0 "Человечество безнадёжно испорчено, и попытки спасти людей от скверны тщетны без Святых. Поэтому верующие ищут уединения от развращённого внешнего мира, чтобы сохранить учения Святых до «Второго явления», когда Святые вернутся, чтобы распространять свои божественные учения, как в давние времена."
 agiopolei_rite:0 "Агиополеи"
 agiopolei_rite_adherent:0 "Агионист"
