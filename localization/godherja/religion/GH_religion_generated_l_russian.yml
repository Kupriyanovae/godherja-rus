 mezrai_desc_with_gc:0 "Возникнув в Лиркаке в Северном Леване, мезраисцы возводят своё учение к Сарвану и-Хизраду, человеку, который, как они утверждают, получил тайное откровение от $amsari_prophet_link$ Пророка#! во время прохождения через этот регион. Говорят, что Пророк доверил ему истины, слишком сложные для простых умов простолюдинов, учения, предназначенные только для избранных, чтобы полностью понять более глубокую мудрость Заорана. Отвергая идею записи своих тайных знаний, мезраисцы передавали их устно через строгие инициатические обряды."
 mezrai_rite:0 "Мезра'и"
 mezrai_rite_adherent:0 "Мезраисец"
 mezrai_rite_adherent_plural:0 "Мезраисцы"
 mezrai_rite_adj:0 "Мезраи"
 mezrai_rite_desc:0 "Мезраиси происходят из Лиркака в Северном Леване и возводят своё учение к Сарвану-и-Хизраду. По их утверждениям, Пророк, проходя через эту область, передал тому тайное откровение. Он доверил Сарвану истины, слишком сложные для незрелых умов простолюдинов, — знания, предназначенные только избранным, способным до конца постичь глубинную мудрость Заорана. Отвергая запись сокровенного учения, мезраиси передают его из уст в уста через строгие обряды посвящения."
 militant_cliques_desc_with_gc:0 "Воинствующие Клики — это [Concept('aversaria','аверсарианский')|E] культ, происходящий из Легионов, основанный в основном на почитании агионистской Святой Сансии (как воплощения стратегического гения) и Святого Эоса (как воплощения воинского совершенства).\n\nСвятые имели много сторонников (и откровенных последователей) в Легионах, и после восстановления после Агионистских восстаний не было политической воли пытаться изгнать их из в остальном верных Легионов. Таким образом, почитание Святых всегда считалось несколько спорным, но крайне распространённым, и большинство солдат носят иконы $saint_sansia_link$ Сансии#! или $saint_eos_link$ Эоса#! как талисманы на удачу, даже если они не считают себя верными.\n\nНекоторые легионеры зашли так далеко, что почитают их обоих как две половины Чистейшего, и почти все ветераны-легионеры в Аверсарии исторически считали себя каким-то образом связанными с этими верованиями."
 militant_cliques_rite:0 "Воинствующ"
 militant_cliques_rite_adherent:0 "Воинствующий"
 militant_cliques_rite_adherent_plural:0 "Воинствующие"
 militant_cliques_rite_adj:0 "Воинствующие Клики"
 militant_cliques_rite_desc:0 "Воинственные клики — аверсарианский культ, возникший в легионах. Он прежде всего почитает агионистскую святую Сансию как воплощение стратегического гения и святого Эоса как воплощение воинского совершенства.\n\nВ легионах у этих святых было множество сочувствующих и прямых последователей. Во время восстановления после восстаний агионистов у власти не было политической воли выкорчёвывать их культ среди в остальном верных легионеров. Поэтому такое почитание всегда считалось спорным, но оставалось чрезвычайно распространённым. Большинство солдат носит иконы Санcии или Эоса как талисманы удачи, даже если не считает себя их верными последователями.\n\nНекоторые легионеры дошли до поклонения им обоим как двум ипостасям Чистейшего, и почти все аверсарианские ветераны исторически считали себя в какой-то мере связанными с этими верованиями."
 mogowai_desc_with_gc:0 "Основное течение моговаизма, кодифицированное на [Concept('karururi_chorus','Карурурийском хоре')|E], относится к задаче поиска тела Всевышнего с невероятной серьёзностью. Хотя многие просто молятся, чтобы Он привёл своих последователей к месту Его последнего упокоения, другие чувствуют побуждение выйти в мир и искать самим. Они заново проходят старые пути, считавшиеся тупиковыми, или ищут в совершенно неисследованных местах, следуя любой зацепке о священном захоронении в надежде исполнить свою единственную цель. Считается, что когда Он будет найден, Он восстанет вновь и превратит мир в рай."
