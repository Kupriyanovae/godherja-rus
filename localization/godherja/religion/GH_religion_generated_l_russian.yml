 hubarism_rite_desc:0 "Традиционное направление магов-судей, пережившее многовековое господство ритуалистов и Хранителей в Саррадоне. Хубариты строго соблюдают священные кодексы, а история их веры уходит в эпоху, когда маги-судьи управляли огромной империей под божественным светом Солнца."
