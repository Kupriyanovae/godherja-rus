 saqadiri_rite_desc:0 "Хотя сакадирийин отвергают мысль, что 1001 обряд может принести божественное откровение вдали от Тысячи и одной ступени Софокоса, они призывают заучивать обряды, чтобы сохранять связь с верой."
 saratadibe_desc_with_gc:0 "Саратадибцы верят, что [Glossary('саратаны','GH_SARATAN_GLOSS')] образовали мир из своего медленного движения по морям, они также верили, что саратан может родиться только в том случае, если кто-то умрёт. Таким образом, хотя смерть саратана была печальным событием для всех верных, она тем не менее была естественной и, следовательно, допустимой, чтобы убить зверя при необходимости, хотя это и оставалось спорным.\n\nДо того, как это верование было удалено из веры, те, кто жил на саратанах, часто участвовали в клановых войнах и набегах. Обычно это происходило в виде того, что племена саратанов выпускали стрелы друг в друга, когда два из них проходили мимо, и спускали лодки с бортов, чтобы абордировать другого и разграбить их товары. Со смертью половины всех саратанов и бесчисленных других верных во время [Concept('the_decimation_of_sarradon','Халакдуна')|E], [Concept('sarataratin_militarism','верные приняли новый пацифистский взгляд')|E]."
