 zivvirath_desc_with_gc:0 "Легендарные Рыболюди подземного мира, как их называют [Concept('aversaria','аверсарианские')|E] исследователи, которые встречали зиввиратов, бороздили великие воды подземного моря гораздо дольше, чем любая современная империя существовала на поверхности. Самое древнее зиввиратское предание, записанное в Великой Книге Первых, утверждает, что предки зиввиратов бежали от великой битвы между армиями, вооружёнными сталью и могущественными огненными посохами, которые опустошили их древнюю родину Утуггуи, через портал, который привёл их под землю.\n\nВ бесконечные эпохи с тех пор зиввираты ввели десятки новых богов, чтобы заменить старых и забытых, лишь кратко упомянутых в Великой Книге. Главные три — Зиккуру, Рыбомать, которая родила могучих Чешуйчатых Карпов, на которых зиввиратские рейдеры гордятся верховой ездой; Кам-казолл, который открыл великий портал и из чьей крови произошли все [Concept('magi','маги')|E]; и Занзабу, который научил зиввиратов строить первые лодки, способные плавать под водой, и даровал им плавники и жабры на случай, если они упадут с них."
