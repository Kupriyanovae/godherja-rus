 aversarian_gorassos_faith_desc:0 "Названная её последователями в честь одноимённого основателя и лидера $gorassos_link$ Горасса#!, [Concept('aversaria','аверсарианская')|E] вера была грубо переделана в культ войны и смерти. Чистота зарабатывается не кровью в жилах, а тем, сколько языческой крови пролито. И Горасс намеревался, чтобы во имя его было пролито #E MP много#! крови."
 aversarian_gorassos_rite:0 "Горассианск"
 aversarian_gorassos_rite_adherent:0 "Горассианец"
 aversarian_gorassos_rite_adherent_plural:0 "Горассианцы"
 aversarian_gorassos_rite_adj:0 "Горассианство"
 aversarian_gorassos_rite_desc:0 "Названная в честь основателя и предводителя Горассоса, эта аверсарианская вера была грубо переделана в культ войны и смерти. Чистота определяется не кровью, текущей в жилах, а количеством пролитой крови иноверцев. И Горассос намеревался пролить её немало."
 aversarian_gorassos_rite_religious_text:0 "слова Горасса"
 aversarinas_aagiokrata_desc_with_gc:0 "[aversarinas_aagiokratia|E] — это обобщающий термин для различных деноминаций, ответвлений и ересей [Concept('aversaria','Аверсарианской Аавтократии')|E] и Имперского культа. Хотя их догматы могут сильно различаться, в основном они вращаются вокруг веры в изначальных '[Concept('aelfir','Первых людей')|E]' — божественную расу [Concept('magic','владеющих магией')|E] людей, ведомых [Concept('magi','магом')|E] по имени [Concept('aersanon','Чистейший')|E], который некогда правил [Concept('first_empire','Мировым городом')|E] и [Concept('first_empire','Первой империей')|E]. Аагиократия — это религия, по большей части лишённая какой-либо целостной системы верований, и вместо этого в ней доминируют бесчисленные культы, часто происходящие от бесчисленных вер, давно завоёванных и поглощённых Империей."
 aversarinas_aagiokrata_faith:0 "Имперские культы"
 aversarinas_aagiokrata_faith_adherent:0 "Аагиократ"
 aversarinas_aagiokrata_faith_adherent_plural:0 "Аагиократы"
 aversarinas_aagiokrata_faith_adj:0 "Аверсарианская Аагиократия"
 aversarinas_aagiokrata_faith_desc:0 "[aversarinas_aagiokratia|E] — это обобщающий термин для различных деноминаций, ответвлений и ересей [Concept('aversaria','Аверсарианской Аавтократии')|E] и Имперского культа. Хотя их догматы могут сильно различаться, в основном они вращаются вокруг веры в изначальных '[Concept('aelfir','Первых людей')|E]' — божественную расу [Concept('magic','владеющих магией')|E] людей, ведомых [Concept('magi','магом')|E] по имени [Concept('aersanon','Чистейший')|E], который некогда правил [Concept('first_empire','Мировым городом')|E] и [Concept('first_empire','Первой империей')|E]. Аагиократия — это религия, по большей части лишённая какой-либо целостной системы верований, и вместо этого в ней доминируют бесчисленные культы, часто происходящие от бесчисленных вер, давно завоёванных и поглощённых Империей."
 aversarinas_aagiokrata_reformed_desc_with_gc:0 "Старые пути [Concept('aversaria','аверсарианцев')|E] умерли так же, как они практиковались и навязывались — на острие меча. В хаосе, последовавшем за крахом Аверсарианской Аавтократии, леган Гекаэда из LXI легиона поклялась предотвратить обстоятельства, которые привели к её разрушению, от повторения. Быть аверсарианцем больше не определяется родословной и происхождением, а личной добродетелью, и благородная магическая олигархия старого мира была разрушена и заменена меритократией."
