 skrattaki_desc_with_gc:0 "Никто не помнит времён до [Concept('twist_of_the_tunnels','Великого Распада')|E], когда у скраттакиев ещё были глаза, чтобы видеть, и они поклонялись обычным смертным, не обладающим способностью владеть [Concept('magic','Теневым Даром')|E], ибо жрецы веками утверждали, что эта ненавистная эпоха лжи и обмана должна быть уничтожена во всех её проявлениях. Хотя первые скраттакийцы использовали Теневой Дар, чтобы выжечь из своего разума воспоминания и заменить их любовью к своему богу Скраллавиаксу — великой королеве-паучихе, которая научила скраттакийцев ползать по стенам пещер и спускаться в великую бездну, откуда она пришла, — это действие стало ритуалом. Теперь все скраттакийцы проходят Очищение Мыслей по достижении зрелости, уничтожая свои воспоминания и заменяя их совокупным знанием своего племени."
