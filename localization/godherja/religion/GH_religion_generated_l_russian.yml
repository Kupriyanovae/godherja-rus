 korlenalmic_desc_with_gc:0 "Новая секта корлоналмической ереси, Корленалмик, или Огненный Путь, был основан группой наттананских диссидентов, обнаруживших записи о [Concept('fire_path','Пути Огня')|E]. Столкнувшись с преследованиями, новая секта бежала на восток, где встретила хранителей Тхуантьян Срайдьян — катунцев, веривших в святость создания долговечных творений. Корленалмики в конце концов переняли большую часть этого мировоззрения и считали, что, создавая инновации и великие творения, они будут вознесены, чтобы служить непосредственно под началом Корлаку, который затем поведёт их к созданию лучшего мира для всех."
