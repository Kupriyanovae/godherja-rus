 mogowai_rite_desc:0 "Основное течение моговаизма, кодифицированное на [Concept('karururi_chorus','Карурурийском хоре')|E], относится к задаче поиска тела Всевышнего с невероятной серьёзностью. Хотя многие просто молятся, чтобы Он привёл своих последователей к месту Его последнего упокоения, другие чувствуют побуждение выйти в мир и искать самим. Они заново проходят старые пути, считавшиеся тупиковыми, или ищут в совершенно неисследованных местах, следуя любой зацепке о священном захоронении в надежде исполнить свою единственную цель. Считается, что когда Он будет найден, Он восстанет вновь и превратит мир в рай."
