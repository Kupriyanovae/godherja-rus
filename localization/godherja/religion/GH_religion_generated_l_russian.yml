 sacred_stars_cult_desc_with_gc:0 "Для последователей Священных Звёзд герои [Concept('shatteredisles','Островов')|E] существуют во времени, намного превосходящем их жизнь на [Concept('aeras','Эраса')|E]. Каждая звезда — это вознесённая легенда прошлого, каждое созвездие — знак для их последователей. Поклонение — это то, что возвращает их в земли, которые они некогда называли домом, самые яркие звёзды — это те, которые всё ещё почитаются их последователями на Эрасе. Самые прославленные и любимые герои живут в древних чертогах [Concept('aervalr','Эрвала')|E], наблюдая и наделяя своих самых верных последователей благословениями в жизни и шансом на вечное существование."
 sacred_stars_cult_rite:0 "Священно-звёздн"
 sacred_stars_cult_rite_adherent:0 "Культист Священных Звёзд"
