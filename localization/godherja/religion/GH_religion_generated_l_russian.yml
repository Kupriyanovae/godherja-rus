 sjalvolki_aagiokrata_desc_with_gc:0 "Бывшие последователи сьялволькской веры, познавшие силы [Concept('magic','магии')|E], эти относительно недавние обращённые на путь [Concept('aversaria','аверсарианцев')|E] принесли с собой традиции, которые их братья по вере считают почти еретическими. У них также более инклюзивное мировоззрение, и они считают, что вера и магические способности могут перевесить даже самые родовитые кровные линии в вопросах чистоты."
