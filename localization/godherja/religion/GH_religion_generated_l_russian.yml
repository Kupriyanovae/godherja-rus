 zurvan_zaoran_faith_desc:0 "Древнюю веру в Заорана, Обладателя Сотни Добродетелей, исповедовали амсари во времена владычества кемсари. Преследования вынудили верующих скрываться и приспосабливать обряды к жизни в тайне. Каждая община выработала собственные ритуалы и толкования веры, отчего возникло множество местных традиций."
