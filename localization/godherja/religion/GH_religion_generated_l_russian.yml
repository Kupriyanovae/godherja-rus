 drakanorix_aagiokrata_desc_with_gc:0 "Драканориксская Аагиократия (буквально «[Concept('dragons','Драконья')|E] Вера» на [Concept('aversaria','аверсарианских')|E] языках) — это древняя аверсарианская система верований, предшествующая большинству известных памятников и любой форме аверсарианской письменности, почитаемая верующими как изначальная вера аверсарианских народов. Известно, что древнейший найденный фрагмент аверсарианской письменности, Драканорамоникар, был создан древними лидерами этой веры для кодификации их религии.\n\nДраканориксская Аагиократия поклоняется драконам древней Аверсарии, обожествляя их как существ чистой [Concept('magic','магии')|E] и божественности, посланных в мир забытым существом, чтобы править людьми. Будучи крайне разрозненной и распространённой по большей части мира (культы встречаются вплоть до [Concept('sarradon','Саррадона')|E]), вера тем не менее доминировала на большей части того, что сейчас является Имперским островом, Этепезеей и Расколотым морем. Она оставалась столпом аверсарианского общества даже после формирования [Concept('aversarinas_aagiokratia','Аверсарианской Аагиократии')|E], сойдя на нет лишь после [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E]. По иронии судьбы, они служили Имперской фракции в Гражданской войне, их давняя ненависть к Эрсодиаксинизму бросила их на сторону Аагиократии. После их победы Летигианекс перебил всех оставшихся драконов, а вместе с ними и оставшихся культистов. Последний верховный жрец Драконьих культов предпринял последнее восстание при $aauto_maklea_link$ аавтократии Маклее#! в разгар её чисток и был освежёван и прибит к стене её дворца осквернёнными рогами драконов."
