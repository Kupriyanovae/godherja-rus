 eastern_rite_faith_desc:0 "Отколовшись от «Ораиспольского обряда», Восточный обряд был сформирован из-за большого расстояния от духовных оплотов в Этепезее до восточных регионов Айроноя и большого количества экзотических вер, встречающихся на востоке. Когда восточные верные были ввергнуты в хаос Велоскупом и стремительным натиском религиозных междоусобиц, духовный класс востока попытался обойти дальнейший доктринальный конфликт, работая с духовными лордами, чтобы найти средний путь для своей веры. Таким образом, Восточный обряд представляет собой странную смесь духовного и светского контроля, с духовным главой над децентрализованной системой жрецов, который делит контроль с лордами наряду с ними.\n\nИз-за этих различий Восточный обряд невероятно дозволителен: основополагающие идеалы веры и путаница её создания привели к тому, что многие законы и правила веры отсутствуют или мягки."
