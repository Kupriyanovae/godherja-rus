 kemsar_rite_desc:0 "Исконная вера народа кемсарцев, религия Кемсара является натуралистической и сосредоточена на поклонении дающей свет луне Иаху и дающей жизнь реке Хейе. Однако пересыхание Хейи и раскол Иаха во время [Concept('frodbrokna','Фродброкны')|E] принесли с собой как религиозные, так и социальные потрясения, и земли были погружены в хаос. Попытки осмыслить этот сбивающий с толку мир привели к новой, более циничной вере. Иах теперь — Инпиа, Мёртвая Луна. Кемсары больше не молятся о Его защите, но о том, чтобы Его разлагающийся труп не упал на них и не разрушил тот маленький мир, который у них остался."
 khebaranism_desc_with_gc:0 "Хебаранцы верят, что учения $amsari_prophet_link$ Пророка#! скрывают более глубокие истины, доступные только тем, кто обладает мудростью их воспринять. Для них [Concept('gh_zenda','Зенда')|E] многослоена, и то, что запрещено невеждам, может быть дозволено просвещённым, если это служит высшей цели. Это привело к неортодоксальным толкованиям религиозного закона, где мораль определяется мудростью, а не жёсткой доктриной. Хебаранизм некоторое время процветал в Западном Сирале, несмотря на суровые преследования со стороны ортодоксальных [Concept('gh_frazan','фразанов')|E], которые осуждают его учения как опасную ересь."
 khebaranism_rite:0 "Хебаранск"
 khebaranism_rite_adherent:0 "Хебаранец"
 khebaranism_rite_adherent_plural:0 "Хебаранцы"
 khebaranism_rite_adj:0 "Хебаранизм"
 khebaranism_rite_desc:0 "Хебараниты верят, что наставления Пророка скрывают более глубокие истины, доступные лишь тем, кому хватает мудрости их постичь. Для них Зенда многослойна: то, что запрещено невежде, может быть позволено просветлённому, если служит высшей цели. Отсюда необычные толкования религиозного закона, в которых нравственность определяется мудростью, а не жёсткими догматами. Некоторое время хебаранизм процветал в Западном Сирале, несмотря на суровые гонения со стороны ортодоксальных фразанитов, осуждавших его как опасную ересь."
 khudaamiyya_desc_with_gc:0 "Худаамийин толкуют учение Рухваада ибн Хасиля как повеление заботиться о [GetBuilding('01_sophocos').GetName], словно о живом существе: приносить воду на ступени, омывать её и подниматься молча, чтобы не тревожить покой. Другие [Concept('ritualism','ритуалисты')|E] отвергают эти обряды как нелепое очеловечивание Софокоса. Но худаамийин считают, что смерть башни означала бы конец всякого богопочитания: без последней живой башни нельзя достичь божественного."
 khudaamiyya_rite:0 "Худами'а"
 khudaamiyya_rite_adherent:0 "Худами"
 khudaamiyya_rite_adherent_plural:0 "Худамииин"
 khudaamiyya_rite_adj:0 "Худами"
 khudaamiyya_rite_desc:0 "Худаамийин толкуют учение Рухваада ибн Хасиля как повеление заботиться о Софокосе, словно о живом существе: приносить воду на ступени, омывать его и подниматься молча, чтобы не тревожить покой. Другие ритуалисты отвергают эти обряды как нелепое очеловечивание Софокоса. Но худаамийин считают, что смерть башни означала бы конец всякого богопочитания: без последней живой башни нельзя достичь божественного."
 kidarian_dance_desc_with_gc:0 "Кидарианский танец, рождённый на [Concept('shatteredisles','Островах')|E] [Concept('sarradon','Саррадона')|E], видит всё существование через призму ритма и биений, где их боги — танцоры, а вселенная — их сцена. Естественные события, от лёгких бризов до мощных гроз, — это шаги и движения богов, а великие циклические узоры природы — это движения и темпы. Смертные тоже часть танца, хотя они не понимают биений, которым следуют, так, как это делают боги.\n\nКидарианские ритуалы, как и следовало ожидать, сосредоточены вокруг танца. Будь то подражание ритму бога в знак благодарности и хвалы, или использование собственных ритмов в надежде повлиять на окружающий мир, кидарианские жрецы знают барабанный бой для каждой мыслимой молитвы. Они посвящают себя во имя Кидар-аваха, первого человека, познавшего ритмы богов, и стремятся увидеть божественное, танцуя шаги богов в бесконечной неистовости. К сожалению для них, это скорее приводит к окровавленным ногам и сломанным лодыжкам, чем к просветлению."
