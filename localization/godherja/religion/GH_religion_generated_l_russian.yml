 sokaloma_faith_adj:0 "Сокалома"
 sokaloma_faith_desc:0 "Сокалома — это традиционная вера такопара, система верований, согласно которой звёзды являются фундаментальным элементом человеческого существования. Те, кто почитает Сокалому, или «небесный танец», верят, что каждая звезда представляет собой прошлое и будущее бытие человека, и что когда человек умирает, он оставляет свою предыдущую душу среди небес, чтобы возродиться из той же самой материи. Сокаломцы считают, что эта ткань сознания проявляется в виде фигур, более похожих на традиционных божеств, представленных различными созвездиями ночного неба. Судьба человека и его духи-хранители определяются при рождении через сложные астрологические ритуалы, которые можно понять только после долгих лет тщательного изучения."
