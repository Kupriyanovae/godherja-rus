 praznarva_desc_with_gc:0 "Празнарвии толкуют некоторые истории о [Glossary('Велосе','VELOS_GLOSS')], пьющем кровь своей павшей добычи, чтобы узнать тайны жизни, в буквальном контексте и считают питьё крови священным и важным религиозным долгом. Благодаря этому они верят, что могут вкусить души мёртвых и узнать их секреты, как когда-то делал их бог-покровитель."
