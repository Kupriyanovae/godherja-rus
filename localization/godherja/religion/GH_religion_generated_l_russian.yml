 manats_rite_adj:0 "Манатизм"
 manats_rite_desc:0 "Значительная часть современной манатской религиозной культуры строится вокруг защиты и толкования [Concept('gena_tinngir','Священных текстов')|E] богов, за чем наблюдает большая каста [Concept('nosanni','жрецов-толкователей')|E]. Хотя существуют оригинальные переводы, передаваемые из уст в уста, многие манатские толкователи пытаются расшифровать исконный язык самих богов, чтобы лучше суметь построить общество таким, каким оно было в те святейшие из ранних дней."
 manikos_aagiokrata_desc_with_gc:0 "Распространяемая Мегистом «Безумным Императором», эта вера отвергается как насмешка над добродетелью теми, кто придерживается традиционных [Concept('aversaria','аверсарианских')|E] путей. Для приверженцев потомки Чистейшего достаточно здравы умом и телом, чтобы предаваться физическим ощущениям без страха развращения. Но для посторонних это похоже на бредни безумного сатирика, который говорит, что его боги хотят, чтобы он устраивал оргии и переспал со всеми красивыми женщинами при своём дворе."
