 aironoian_aagiokrata_desc_with_gc:0 "Из-за большой удалённости от родины, [Concept('aversaria','аверсарианским')|E] жрецам в Восточном Айроное было трудно поддерживать какую-либо ортодоксию среди верных. Хотя Аверсарианская Аагиократия никогда не была последовательной среди своих тысяч местных и имперских культов, массовое отклонение, в которое скатились её восточные практикующие, вызывало такое беспокойство, что многие жрецы опасались, что они вовсе отпадут от веры. Несмотря на все попытки, то, что стало известно как Айронойская Аагиократия, в основном достигло уровня согласованности со своими восточными культами вместо метрополии, и вскоре стало несколько кодифицированной ересью, глубоко укоренившейся в [Concept('cosmopolitan_eastern_aversarians','Восточной культуре')|E]."
