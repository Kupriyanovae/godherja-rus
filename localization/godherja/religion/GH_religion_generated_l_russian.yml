 old_rite_priesthood_desc_with_gc:0 "Когда империя рухнула после падения Орайсполя под ударами [Concept('sjalvolki_migration','армий переселенцев')|E] $cenware_link$ Ведьмолома#!, вместе с нею пал и Имперский культ, подорванный предательством Жреческого переворота и распространением [Concept('deviationism','девиационистских')|E] воззрений среди военачальников. Тысячи культов Аагиократии по всей империи столкнулись с двойным кризисом — помимо бесчисленных иных бед, обрушившихся на измученные остатки [Concept('aversaria','Аверсарии')|E]. Распад имперской законной власти оставил культы без общецерковного права и иерархии выше областного уровня, а теснейшая связь Аагиократии с самим существованием [Glossary( 'Аутократы', 'GH_AAUTOKRATA_GLOSS' )] лишила жречество подлинных юридических полномочий и богословских ориентиров.\n\nПока культы погружались в кровавые междоусобицы, приспосабливаясь к новой действительности [Concept('the_continent','Раздробленного побережья')|E], земли без сильных военачальников, способных навязать девиационистское учение, оказались подобны кораблям без парусов и руля. Местные жрецы взвалили на себя все духовные обязанности, какие только могли, а управители были слишком заняты, чтобы делать что-либо сверх попыток поддержать умирающую веру. «Жречество старого обряда» стало у рителандцев названием [Glossary('староимперского','GH_OLD_EMPIRE_GLOSS')] уклада, при котором жрецы всеми силами делают вид, будто конец ещё не наступил, хотя их паства давно ушла вперёд."
