 korlonalmic_desc_with_gc:0 "С тех пор как существуют Боги-Близнецы и последователи Пути, существовали и те, кто отвергает его и ищет Корлоналмический, или [fire_path|E]. Однако предательство [Concept('twin_deceivers','Близнецов')|E] привело к падению Корлаку, а его последователи были изгнаны в [Glossary('Чан Кьявкорлаку','GH_CHAN_KYAWKORLACU_GLOSS')] — северо-западные горы Харадана. Там секта приняла более радикальный взгляд на магические исследования, отчасти под влиянием соседних почитателей Сарвата, каширийского бога знания."
