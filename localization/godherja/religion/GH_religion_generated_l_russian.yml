 black_mountain_imperial_faith_desc:0 "Смерть $nicanoneus_link$ Чёрного Солнца#! едва ли заметили за пределами [Glossary('Чёрных гор','black_mountains_encyclopedia_desc')]. Но самые истовые приверженцы его стремительно распадавшегося культа — прежде всего последние старейшины Чёрных легионов и варварские воины, постепенно заполнившие их редеющие ряды, — лишь удвоили своё рвение.\n\nМир постепенно забыл ужасы правления [Glossary( 'Аутократы', 'GH_AAUTOKRATA_GLOSS' )], а Никанея всё чаще вспоминают лишь в народных сказаниях да видят на потёртых монетах. Немногочисленные фанатики последнего истинного [Concept('aversaria','аверсарианца')|E], по мнению некоторых, превратились в реакционный культ смерти. Сами же они не щадят даже единоверцев из числа [Glossary('старых имперцев','GH_OLD_EMPIRE_GLOSS')], называя их «отсталыми варварами», которые приняли древние племенные обычаи за божественное истинное учение [Concept('first_empire','Второй империи')|E]."
 black_mountain_imperial_rite:0 "Чёрногорско-имперск"
 black_mountain_imperial_rite_adherent:0 "Чёрногорец"
 black_mountain_imperial_rite_adherent_plural:0 "Чёрногорцы"
 black_mountain_imperial_rite_adj:0 "Чёрногорский Имперский Культ"
 black_mountain_imperial_rite_desc:0 "Смерть Чёрного Солнца едва ли заметили за пределами Чёрных гор. Но самые истовые приверженцы его стремительно распадавшегося культа — прежде всего последние старейшины Чёрных легионов и варварские воины, постепенно заполнившие их редеющие ряды, — лишь удвоили своё рвение.\n\nМир постепенно забыл ужасы правления Аутократы, а Никанея всё чаще вспоминают лишь в народных сказаниях да видят на потёртых монетах. Немногочисленные фанатики последнего истинного аверсарианца, по мнению некоторых, превратились в реакционный культ смерти. Сами же они не щадят даже единоверцев из числа старых имперцев, называя их «отсталыми варварами», которые приняли древние племенные обычаи за божественное истинное учение Второй империи."
 blackhand_desc_with_gc:0 "Культ Чёрной Руки распался и исчез из поля зрения общественности после внезапного исчезновения своего таинственного лидера, Искателя Разума, в 1190 году от И.С. До своего падения Культ распространился подобно лесному пожару по Этепезее и частям Опахасии и был наиболее печально известен сожжением Никаринпалати — тысячелетней резиденции [Concept('aversaria','аверсарианских')|E] Аавтократов — дотла."
 blackhand_faith:0 "Культ Чёрной Руки"
 blackhand_faith_adherent:0 "Культист Чёрной Руки"
 blackhand_faith_adherent_plural:0 "Культисты Чёрной Руки"
 blackhand_faith_adj:0 "Культ Чёрной Руки"
 blackhand_faith_desc:0 "Культ Чёрной Руки — [Concept('aversaria','аверсарианское')|E] вероучение, сосредоточенное вокруг загадочного существа по прозванию «Искатель Разума». Последователи почитали Искателя как всемогущее создание и пророка, способного предсказывать грядущее, прозревать минувшее и наделять великими силами своих избранников. Сам Искатель проповедовал, что от всех богов следует отречься и всех богов надлежит убить: ведь именно человеческие боги однажды уже уничтожили мир и непременно сделают это снова. Его последователи разрушали все попадавшиеся им святыни, изображения и писания, стараясь познать «истинные имена» богов. Они верили, что произнесённое вслух подлинное имя божества убьёт его."
