 new_rite_agionism_rite_desc:0 ""
 nicanonean_aagiokrata_desc_with_gc:0 "Никанонеанство — это почитание $nicanoneus_link$ Никанонея «Чёрного Солнца»#! как реинкарнации [Concept('aersanon','Чистейшего')|E]. [Concept('aversaria','Аверсарианский')|E] военачальник обожествил себя вскоре после своего [Concept('the_black_mountain_war','прибытия')|E] в Калатипсоми, и культ впоследствии распространился среди рядов его легионов и сторонников, которым он заявлял, что был лично приведён на [aeras|E] самим Чистейшим под барабаны [Concept('aelfir','Первых людей')|E]."
 nicanonean_aagiokrata_rite:0 "Никанонеанск"
 nicanonean_aagiokrata_rite_adherent:0 "Никанонеанец"
 nicanonean_aagiokrata_rite_adherent_plural:0 "Никанонеанцы"
 nicanonean_aagiokrata_rite_adj:0 "Никанонеанство"
 nicanonean_aagiokrata_rite_desc:0 "Никанеонизм — поклонение Никанею по прозванию «Чёрное Солнце» как новому воплощению Чистейшего. Аверсарианский полководец обожествил себя вскоре после прибытия в Калатипсоми, и культ распространился среди его легионов и верных сторонников. Он утверждал, что сам Чистейший привёл его на Аэрас под барабанный бой Первых людей."
 nitsafai_faith:0 "Ницафаи"
 nitsafai_faith_adherent:0 "Ницафаец"
 nitsafai_faith_adherent_plural:0 "Ницафайцы"
 nitsafai_faith_adj:0 "Ницафаизм"
 nitsafai_faith_desc:0 "Ницафайцы считают, что основное течение моговаизма сбилось с пути, во многом из-за вмешательства светских правителей в религиозные дела. Они выступают за буквальное толкование Небесных гимнов и стремятся к переориентации веры до того, как поиски могут быть возобновлены, опасаясь, что коррупция помешает когда-либо обнаружить Его тело. Эта преданность заставляет их ставить свою ортодоксию превыше всего, и любое отклонение от их истины строго наказывается."
