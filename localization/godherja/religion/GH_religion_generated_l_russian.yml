 hulawite_faith_desc:0 "Рационалистическое учение, основанное на опыте и созданное Адаром по прозванию «Ниб», печально известным вспыльчивым учёным и философом, жившим в конце VIII века, когда мамурские дворы переживали расцвет. Сначала Адар работал в рамках интеллектуально свободного традиционалистского учения Хранителей, но со временем его воззрения зашли так далеко, что он фактически стал отступником. Его последователей до сих пор называют «хулав», то есть «прогульщиками»: так они были охарактеризованы в приговоре Верховного суда Центра вскоре после смерти Адара.\n\nОднако оскорбление судей оказалось бессильным без поддержки мамуров. Наследники Адара быстро приняли прозвище как собственное имя, находя в нём приятную им иронию."
