 dejorig_desc_with_gc:0 "Дежориг — вера северных рабов бывшей [mayikrata|E]. Её воззрения сложились прежде всего среди невольников, которых отправляли раскапывать и исследовать тёмные туннели, пронизывающие [Concept('mayikrata','Майикрату')|E], — работы, почти неизменно приводившей людей к гибели. Последователи дежорига полностью отвергают [Concept( 'magic', 'магию' )|E], считая её отвратительным злом, и со страхом перешёптываются о её воздействии на то, что скрывается под Цитаделью. Для дежоригов [magic|E] — источник зла в мире и, возможно, причина его грядущей гибели."
