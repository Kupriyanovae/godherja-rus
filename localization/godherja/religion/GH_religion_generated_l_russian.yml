 kathanouxiac_desc_with_gc:0 "Хотя почитание «[Concept('magi','Короля-волшебника')|E]» никогда не было популярным, настояние Катанукса на том, что он является законным богом и правителем [Concept('aeras','Эраса')|E], часто подкреплялось остриём посоха и собрало достаточно последователей за века его правления, чтобы сохраниться и после его смерти. Катануксиакцы верят, что Катанукс не умер, а вознёсся, и используют таинственный термин «Волшебник» для своего жречества в честь него, в надежде, что их грозный повелитель пощадит их при своём возвращении."
