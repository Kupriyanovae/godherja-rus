 raocourt_desc_with_gc:0 "Основное течение Пути Жизни, возникшее в Раокуре. Его последователи полагают, что путь сначала избирают, а затем проходят; Отцы Пути должны быть свидетелями, а не повелителями; дом же, давший страннику кров, уже исполнил большую часть предписаний веры."
 raocourt_rite:0 "Обряд Раокура"
 raocourt_rite_adherent:0 "Раокуртский путник"
 raocourt_rite_adherent_plural:0 "Раокуртские путники"
 raocourt_rite_adj:0 "Раокур"
 raocourt_rite_desc:0 "Основное течение Пути Жизни, возникшее в Раокуре. Его последователи полагают, что путь сначала избирают, а затем проходят; Отцы Пути должны быть свидетелями, а не повелителями; дом же, давший страннику кров, уже исполнил большую часть предписаний веры."
 red_star_desc_with_gc:0 "Увидев великую красную комету, предвещавшую Пожирателя Миров, некоторые из последователей Эрсодиакса заключили, что это был знак. Пожиратель Миров, утверждали они, был «Первым Вестником», одним из десяти великих зверей, которые предшествуют возвращению Эрсодиакса, восставшего из мёртвых, чтобы наказать тех, кто предал его. Считая себя стражами конца времён, их тайные собрания постепенно увеличили число Вестников, достигнув числа 8, когда [frodbrokna|E] опустошила мир. Увидев то, что, несомненно, было началом конца, жрецы поспешили объявить последних двух Вестников, причём $aauto_aeschraes_link$ Эшрей#! и $aauto_axiaothea_link$ Аксиотея#! были наиболее частым выбором для этого сомнительного почётного звания, хотя другие также стали кандидатами, включая [Concept('the_fog','Туман')|E], Эксионаракса, $cenware_link$ Ценвара#! и многих других.\n\nХотя обычно можно было бы ожидать, что такая вера консолидируется вокруг единого послания, надвигающийся апокалипсис сделал эти споры бесполезными, и поклонники Красной Звезды вместо этого посвящены тому, чтобы наслаждаться тем немногим временем, что у них осталось, в виде бесконечных празднеств и оргий, беря то, что они ещё могут взять от жизни, прежде чем их давно мёртвый господин вернётся, чтобы отомстить за их древний грех."
 red_star_rite:0 "Краснозвёздный-культистск"
 red_star_rite_adherent:0 "Краснозвёздный культист"
 red_star_rite_adherent_plural:0 "Краснозвёздные культисты"
 red_star_rite_adj:0 "Культ Красной Звезды"
 red_star_rite_desc:0 "Увидев огромную красную комету, предвещавшую Пожирателя миров, некоторые последователи Аэрсодиакса сочли её знамением. Они провозгласили Пожирателя миров «Первым Вестником» — одним из десяти великих чудовищ, которые должны предшествовать возвращению Аэрсодиакса, восставшего из мёртвых ради наказания предателей. Считая себя стражами последних времён, они тайно собирались и постепенно увеличивали число Вестников. К тому времени, когда Фродброкна опустошила мир, их насчитывалось уже восемь. Уверенные, что видят начало конца, жрецы поспешили назвать двух последних: чаще других сомнительной чести удостаивались Эсхраэс и Аксиофея, хотя предлагались и другие имена — Туман, Аексионарэкс, Кенвар и многие прочие.\n\nКазалось бы, перед грядущим концом света верующие должны объединиться вокруг одного откровения. Но неизбежность гибели сделала богословские споры бессмысленными. Вместо этого почитатели Красной Звезды проводят оставшееся время в бесконечных празднествах и оргиях, стремясь взять от жизни всё, что ещё можно, прежде чем их давно умерший владыка вернётся, чтобы отомстить за древний грех."
