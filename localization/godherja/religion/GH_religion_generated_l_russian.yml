 favoured_ones_rite_desc:0 "По деревням далёких западных [Concept('shatteredisles','Островов')|E], когда звёзды и луна выстраиваются в ряд, почти жуткая тишина опускается на острова тех, кто считает себя Избранными. Дома замолкают, корабли отдаются на милость волн, а общины собираются в различных обширных и древних каменных кругах. Каждый камень отмечен уникальным образом — будь то роспись, символ или даже старые слова, когда-то произнесённые с мудростью.\n\nВ этом круге легенд последователи вспоминают тех, кто был в прошлом, каждого героя и легенду своего времени. Рассказывают истории о силе, мудрости и славе, шепчут молитвы и передают сказания будущим потомкам. Каждого героя помнят, совершая ритуал, чтобы получить их благословение на грядущие годы. Самые древние и прославленные герои — это древние предки, когда-то наделённые Божественной Милостью, освобождённые от давно забытых хозяев и благословлённые новыми землями для поселения.\n\nВерующие считают, что их Милость была божественным даром, не так легко утраченным со временем. Пока их не забывают, их Милость может быть обретена вновь — надежда на нового героя для будущих поколений, которого можно будет почитать и помнить."
