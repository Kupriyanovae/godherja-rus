 eastern_rite_rite_adj:0 "Восточный обряд"
 eastern_rite_rite_desc:0 "Отколовшись от «Ораиспольского обряда», Восточный обряд был сформирован из-за большого расстояния от духовных оплотов в Этепезее до восточных регионов Айроноя и большого количества экзотических вер, встречающихся на востоке. Когда восточные верные были ввергнуты в хаос Велоскупом и стремительным натиском религиозных междоусобиц, духовный класс востока попытался обойти дальнейший доктринальный конфликт, работая с духовными лордами, чтобы найти средний путь для своей веры. Таким образом, Восточный обряд представляет собой странную смесь духовного и светского контроля, с духовным главой над децентрализованной системой жрецов, который делит контроль с лордами наряду с ними.\n\nИз-за этих различий Восточный обряд невероятно дозволителен: основополагающие идеалы веры и путаница её создания привели к тому, что многие законы и правила веры отсутствуют или мягки."
 eight_desc_with_gc:0 "Объединённый, кодифицированный и очищенный под оком Ордена Одинокого Стража, агионизм ныне един в почитании Святых, замученных [Concept('aversaria','аверсарианцами')|E]. Хотя изначально агионисты выступали против аверсарианских религиозных обычаев, после окончания их восстаний их культы были «реабилитированы» и вновь вписаны в аверсарианское вероучение; ныне агионисты и аверсарианцы разделяют многие догматы. Все Святые, почитавшиеся ранее, включены в Канон, включая $forgotten_saint_link$;medium Забытого Святого#!."
 eight_rite:0 "Октарианск"
 eight_rite_adherent:0 "Октарианец"
 eight_rite_adherent_plural:0 "Октарианцы"
 eight_rite_adj:0 "Октарианский агионизм"
 eight_rite_desc:0 "Под надзором Ордена Забытого Хранителя агионизм был объединён, упорядочен и очищен. Теперь все его приверженцы едины в почитании святых, принявших мученическую смерть от рук аверсарианцев. Поначалу агионисты отвергали религиозные обычаи Аверсарии, однако после подавления восстаний их культы были «реабилитированы» и возвращены в лоно аверсарианской традиции. Сегодня обе веры разделяют множество догматов. В канон включены все ранее почитаемые святые, в том числе Забытый Святой."
 eight_rite_religious_symbol:0 "Восьмиконечная Звезда"
 eirbaadit_al_hukadir_desc_with_gc:0 "Хукадириты верят, что мир возник из бурлящего водоворота Фавхадаа, несотворённого каким-либо разумным существом. Там появились всевозможные звери, и главным среди них было человечество. Но у людей не было богов, и поэтому у них не было морали; они принялись создавать своих собственных богов и свою собственную мораль, но безуспешно. Тогда явился Кубаал, Первый Вампир, который успешно сделал себя богом. Затем Кубаал наставил других, как достичь божественности, и первые вампиры правили великолепной империей под названием [GetBuilding('01_sophocos').GetName], откуда Кубаал правил со своего великого шпиля. Эйрбаадит аль-Хукадир действует в рамках эвгемеристической системы, предполагая, что все боги имеют смертное происхождение; они либо не существуют, либо были смертными, ставшими обожествлёнными. Хотя первое менее справедливо, чем второе, что в конечном счёте имеет значение, так это то, платит ли кто-то Кровавую десятину или нет."
