 hayaaliyya_desc_with_gc:0 "Хаяалийин следуют учению Рухваада ибн Хасиля. Они указывают, что [GetBuilding('01_sophocos').GetName] — единственная [Concept('the_towers','Башня')|E], к которой люди могут безопасно приблизиться, и видят в этом доказательство того, что лишь она остаётся живой, тогда как остальные мертвы. Со временем их культ объединил традиционные обряды [Concept('ritualism','ритуалистов')|E] с более необычными ритуалами, которые, как они утверждают, были преподаны самим Рухваадом."
 hayaaliyya_rite:0 "Хаиали'а"
