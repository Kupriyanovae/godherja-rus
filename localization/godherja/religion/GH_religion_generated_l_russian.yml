 hulawite_desc_with_gc:0 "Рационалистическая и эмпирическая философия, основанная Адаром Нибом, печально известным своей вспыльчивостью учёным и философом периода расцвета мамурских дворов конца VIII века. Первоначально работая в рамках интеллектуально свободной формы традиционалистского варденизма, [Concept('adaric_philosophy','теории Адара')|E] развились до такой степени, что фактически сделали его отступником. Его последователи и по сей день обременены ярлыком «Хулав», что означает «прогульщик», по формулировке приговора Верховного Суда Центра, вынесенного вскоре после его смерти.\n\nОскорбление со стороны судов оказалось бессильным и не имело поддержки мамура, и его наследники вскоре стали сами идентифицировать себя с этим ярлыком из общей любви к ироничному юмору."
 hulawite_faith:0 "Хулавитск"
 hulawite_faith_adherent:0 "Хулавит"
