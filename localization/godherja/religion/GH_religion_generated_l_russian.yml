 black_fraternity_desc_with_gc:0 "«Кровь слабых удобрит землю чистых душ».\n\nТаков девиз Чёрных Практиков. Состоящее из самых гнусных [Concept('aversaria','аверсарианских')|E] [Concept('magi','магов')|E], Чёрное Братство посвящает себя единственной цели: сотворению Куснаменой, заклинанию, которое исказит мир и создаст для них новый рай над всем сущим.\n\nВызывая моральное отвращение даже у собратьев-аверсарианцев, Чёрные Практики вынуждены залечь на дно, их влияние в основном сосредоточено в изолированных деревнях и поселениях, где они консолидировали свою власть после краха Аверсарии. В этих деревнях нет иных богов, кроме Магов; эти условия породили систему поклонения, ориентированную на того Мага, который окажется сильнейшим."
