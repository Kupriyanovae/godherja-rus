 biblosxar_desc_with_gc:0 "Ограниченный изолированными Западными [Concept('shatteredisles','Островами')|E], культ библос'ксарианцев и их героя Библосея относительно малоизвестен остальной [Concept('aversaria','Аверсарии')|E]. Несмотря на это, библос'ксарианцы печально известны своей преданностью своему божеству, часто проводя сложные церемонии и возлияния в его честь.\n\nС раннего возраста детей обучают старейшины путешествиям и борьбе Библосея в его стремлении обрести высший дар: избежать самой смерти. Согласно легенде, передаваемой из поколения в поколение, однажды ночью с юным Библосеем заговорил дух Саутоно, пообещав ему бессмертие, если он убьёт в поединке ужасного царя смерти Поласа-Уро. Саутоно предупредил юношу, что это задача, которой он должен будет посвятить всю свою жизнь, ибо целые армии прежде пресмыкались у ног Поласа-Уро.\n\nНо Библосей был целеустремлённой душой. После долгих лет тренировок он стал вдохновляющим воином, владеющим копьём и уникальным девятигранным щитом, который он выковал из лучшего дерева и металла на своём родном острове. Косил врагов, как дровосек валит деревья, и в конце концов Библосей стал достаточно сильным, чтобы бросить вызов Поласу-Уро, который сохранил свою силу даже в старости. И после поединка, длившегося пять часов, Попас-Уро был пронзён в голову; царь смерти был повержен.\n\nОднако когда Библосей призвал Саутоно даровать ему бессмертие, дух рассмеялся. Без предупреждения Библосей был мгновенно обращён в камень и низвергнут глубоко под землю. Лукавый Саутоно даровал Библосею бессмертие, но не так, как тот желал..."
