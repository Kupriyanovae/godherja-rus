 piety_rite_faith_desc:0 "Обряд Могилы Велоса получил своё название от Конклава Могилы Велоса — древнего жречества, управлявшего святейшим местом в сьялволькской вере и некогда занимавшего главенствующую религиозную роль в их доммиграционном мире, хотя он также иногда упоминается как Обряд Благочестия. Однако потеря самой Могилы Велоса из-за [Concept('the_fog','Тумана')|E] привела к резкому падению их власти и престижа, и на протяжении большей части Завоевания они цеплялись за двор Ценвара в уважаемой консультативной роли — но не более того.\n\nОднако с началом великой реформации группа увидела резкий подъём своего положения. Будучи ярыми ранними сторонниками движения, они в конечном счёте отделились от Ораиспольского обряда, пытаясь кодифицировать себя как законных глав религии. Хотя большинство других обрядов по крайней мере номинально признают престиж и почтенную природу Конклава Могилы Велоса, они утверждают, что их положение превосходства либо чисто символическое, либо подчинено другому институту, такому как Святое Королевство Кронского обряда."
