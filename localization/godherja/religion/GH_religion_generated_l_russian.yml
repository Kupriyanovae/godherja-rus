 river_rite_rite_adj:0 "Патосский обряд"
 river_rite_rite_desc:0 "Обряд Патоса учит, что речная сеть дельты Патоса была создана в дар верующим, чтобы они могли отыскать её в странствиях и процветать на её берегах. Варпалис занимает центральное место в пантеоне шьялволков, а мифы приводятся в систему вокруг него, а не более традиционных богов."
 ruidari_desc_with_gc:0 "Руидарийцы исповедуют «Столп Включения», идею о том, что если кто-то совершает доброе дело, неважно, во имя ли ложного бога оно совершено, оно всё равно поддерживает Столпы Добродетели, удерживающие Мёртвого Бога в темнице. В руидарийских обществах велико влияние мистических орденов и тусуффна, организованных вокруг них. Очень часто они открыты для неверующих, и их духовные наставники пытаются направить их к Столпам Добродетели, а не пытаются обратить их поверхностно."
 ruidari_rite:0 "Руидарийск"
 ruidari_rite_adherent:0 "Руидариец"
 ruidari_rite_adherent_plural:0 "Руидарийцы"
 ruidari_rite_adj:0 "Руидарий"
 ruidari_rite_desc:0 "Руидарийцы исповедуют «Столп Включения», идею о том, что если кто-то совершает доброе дело, неважно, во имя ли ложного бога оно совершено, оно всё равно поддерживает Столпы Добродетели, удерживающие Мёртвого Бога в темнице. В руидарийских обществах велико влияние мистических орденов и тусуффна, организованных вокруг них. Очень часто они открыты для неверующих, и их духовные наставники пытаются направить их к Столпам Добродетели, а не пытаются обратить их поверхностно."
 sabiat_al_malaikiya_desc_with_gc:0 "Сабиат аль-Малаикия была основана пророчицей Сарой бинт Шакирой, которая, по слухам, поднялась по ступеням [GetBuilding('01_sophocos').GetName] и была встречена сонмом ангелов, чей вид был ужасен, а голоса вызывали у людей судороги. Сару сопровождала группа других ритуалистов, которые также сообщили о видении ангелов. Обращаясь к своей пророчице, ангелы похвалили ритуалистов за их преданность [GetBuilding('01_sophocos').GetName] и дали Саре откровение: боги и богини этого мира — всего лишь маски, носимые ангелами [GetBuilding('01_sophocos').GetName], и каждая религия — лишь ещё один путь к просветлению. Поэтому на неё была возложена миссия донести мир до людей, прекратить бесконечные войны Саррадона и принести понимание между ритуалистами и варденитами, а затем распространить это послание мира на весь мир. Она и её новообращённые назвали себя Племенем Ангелов и принялись распространять это послание о сосуществовании."
