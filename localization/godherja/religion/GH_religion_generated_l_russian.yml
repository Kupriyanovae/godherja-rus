 stavronic_rite_desc:0 "Ставронизм — шевальенский культ конца света, поклоняющийся архиличу Силасу Ставро. Его приверженцы утверждают, что таинственные боги послали Ставро уничтожить живой мир и сотворить его заново. По их вере он вернётся и начнёт последнюю войну против живущих, которые затем возродятся вместе с мёртвыми. Шевальенцы считают ставронистов безумцами, и, несмотря на гонения, по меньшей мере раз в столетие обнаруживаются и уничтожаются новые тайные общины культа."
