 eiyos_desc_with_gc:0 "Эйос — это вера в 1001 Бога Эйоса, далёкого царства на небесах, которое зеркально отражает то, в котором обитают люди. Эйосцы верят, что всё, что 1001 Бог делает в Эйосе, будет зеркально отражено в нашем мире, намереваются они того или нет, и такие явления, как грозы или хороший урожай, являются результатом войны или рождения в Эйосе. Хотя боги Эйоса редко взаимодействуют с материальным миром, те, кто не поклоняется им должным образом, подвергаются суровому возмездию в случае неудачи — великие столпы огня или молнии разрушают города, пока их последователи не исправят свои пути."
