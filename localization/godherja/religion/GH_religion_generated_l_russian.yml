 tulharsin_desc_with_gc:0 "Вера, столь же древняя, как древние и скалистые склоны Тарсанид — или, по крайней мере, человеческое обитание на них. Тулхарсин, или «семья» — так барзава называют свой пантеон. Хотя второстепенные боги приходят и уходят, пять основных божеств Тулхарсина оставались неизменными с незапамятных времён, их лики вырезаны древними руками на высочайших вершинах хребта Тарсанид. Главный среди них — Ке-Рен, бог-мать-отец, который разорвал собственное чрево, чтобы родить вселенную, и из внутренностей которого выползли второрождённые. Самыми важными были четыре старших бога — Тарханну, Мишкуш, Аннира и Кеш, а также сама луна. Собравшись вместе, эти братья и сёстры затем принялись заселять [Concept('aeras','Эрас')|E], создавая всевозможную флору, фауну и ужасных монстров, наряду с [Concept('tulharsin_creation_of_man','человеком')|E]."
