 hulawite_rite_desc:0 "Рационалистическая и эмпирическая философия, основанная Адаром Нибом, печально известным своей вспыльчивостью учёным и философом периода расцвета мамурских дворов конца VIII века. Первоначально работая в рамках интеллектуально свободной формы традиционалистского варденизма, [Concept('adaric_philosophy','теории Адара')|E] развились до такой степени, что фактически сделали его отступником. Его последователи и по сей день обременены ярлыком «Хулав», что означает «прогульщик», по формулировке приговора Верховного Суда Центра, вынесенного вскоре после его смерти.\n\nОскорбление со стороны судов оказалось бессильным и не имело поддержки мамура, и его наследники вскоре стали сами идентифицировать себя с этим ярлыком из общей любви к ироничному юмору."
 ihzafeh_desc_with_gc:0 "Ихзафехсанцы возникли в противовес тому, что они считали разложением общества, особенно среди правящей элиты и духовенства [Concept('gh_frazan','фразанов')|E], которых они считали декадентскими и отчуждёнными от истинной веры. Отвергая жёсткую доктрину, они считают, что личное толкование является чистейшим способом понимания воли Заорана, ставя прямой духовный опыт выше авторитета религиозных институтов. Для ихзафехсанцев вера не ограничена иерархией, а определяется искренностью преданности."
