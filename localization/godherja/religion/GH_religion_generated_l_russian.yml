 abdexorn_aagiokrata_desc_with_gc:0 "[Concept('shatteredisles','Островитяне')|E] Абдексорна чтят своих древних героев и сердцем, и разумом. Знаменитых воинов и [Concept('magi','магов')|E], легенд, которые создавали острова и низвергали цивилизации без страха и сомнений. Они объединяли соперничающие города-государства с целью и воинским духом, передаваемым из поколения в поколение. Многие из их героев были древними врагами [Concept('aversaria','Аверсарии')|E], которые в конце концов склонились перед Чистейшим через узы крови. Для некоторых эти герои были предателями, и избранные Абдексорна обречены поставить Аверсарию на колени."
