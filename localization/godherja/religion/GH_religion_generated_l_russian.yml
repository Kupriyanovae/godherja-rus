 korlonalmic_rite_desc:0 "С тех пор как существуют Боги-близнецы и Последователи Пути, находятся и те, кто отвергает их и обращается к корлоналмикам, или Огненному Пути. Однако предательство Близнецов-Обманщиков привело к падению Корлаку и изгнанию его последователей в Чан-Кьявкорлаку — северо-западные горы Харадана. Там секта переняла более радикальные взгляды на магические исследования, отчасти под влиянием ближайших поклонников Сарвата, каширийского бога знаний."
