 albot_al_mamurism_desc_with_gc:0 "Века торговли и общения обратили многих в [Glossary('Саррадонской пустыне','sarradonian_desert_encyclopedia_desc')] в [Concept('wardenism','варденитскую')|E] традицию с переменным успехом. Хотя кочевые трибуналы часто именуются судами, их решения в основном основываются на усмотрении деревенских старейшин, а не на судебных экспертах. Редкость юридических текстов во многих из этих общин привела к размыванию власти, мамур является лишь фигурой, которой приносят номинальную клятву, а его имя, личность и статус в значительной степени неизвестны и безразличны. Неспособность искоренить местные суеверия привела к ряду странных и архаичных пережитков, таких как испытание [Glossary('Тальфасомолль','tafasomoll_glossary_desc')] или [Glossary('Тирга Тисит','tirga_tissit_glossary_desc')], из-за чего многие в ядре варденизма называют этих жрецов «Альбот-аль-Мамурами», то есть «Паучьими Мамурами»."
 albot_al_mamurism_faith:0 "Албот-ал-Мамурисм"
 albot_al_mamurism_faith_adherent:0 "Альбот-аль-мамурит"
 albot_al_mamurism_faith_adherent_plural:0 "Альбот-аль-мамуриты"
 albot_al_mamurism_faith_adj:0 "Альбот-аль-Мамуризм"
 albot_al_mamurism_faith_desc:0 "Века торговли и общения обратили многих обитателей Саррадонской пустыни в веру Хранителей, хотя успехи проповедников были весьма неравномерны. Кочевые судилища нередко именуют себя судами, но выносят решения скорее по усмотрению деревенских старейшин, чем по суждению знатоков права. Поскольку в этих общинах редко встречаются письменные своды законов, власть постепенно теряет вес: мамур становится лишь фигурой, которой приносят формальную присягу, почти не зная ни его имени, ни характера, ни положения. Неспособность искоренить местные суеверия сохранила множество странных архаичных обычаев, включая испытание Тальфасомолля и Тирга-Тиссит. Поэтому приверженцы основного учения Хранителей прозвали местных жрецов «альбот-аль-мамурами», или «паучьими мамурами»."
