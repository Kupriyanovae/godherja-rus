 saintsmarch_rite_desc:0 "Воинственный Путь, ставящий войну за искоренение магии превыше любых странствий. Его приверженцы считают, что Марки не обретут мира, пока жив хотя бы один маг, и никогда не позволяли отговорить себя от этого убеждения."
 sajmaari_desc_with_gc:0 "Саджмаарийин верят, что восхождение по Тысяче и одной ступени [GetBuilding('01_sophocos').GetName] должно совершаться группой ровно из 1001 взрослого, каждый из которых обязан без единой ошибки исполнить один из 1001 обряда. Готовясь к подъёму, паломники образуют общину и целый месяц живут вместе. Они верят, что судьба каждого связана с судьбами остальных, и одна-единственная ошибка может погубить всех. Поэтому каждый обязан заботиться о спутниках и беречь их."
 sajmaari_rite:0 "Саджмари'а"
 sajmaari_rite_adherent:0 "Саджмари"
 sajmaari_rite_adherent_plural:0 "Саджмарииин"
 sajmaari_rite_adj:0 "Саджмари"
 sajmaari_rite_desc:0 "Саджмаарийин верят, что восхождение по Тысяче и одной ступени Софокоса должно совершаться группой ровно из 1001 взрослого, каждый из которых обязан без единой ошибки исполнить один из 1001 обряда. Готовясь к подъёму, паломники образуют общину и целый месяц живут вместе. Они верят, что судьба каждого связана с судьбами остальных, и одна-единственная ошибка может погубить всех. Поэтому каждый обязан заботиться о спутниках и беречь их."
 saldhaaria_desc_with_gc:0 "Сальдхаарийин следуют учению [Concept('magi','мага')|E]-философа Сальдхаара Мудрого. Он полагал, что [GetBuilding('01_sophocos').GetName] на поверхности мира — лишь эманация Истинного Софокоса, скрытого глубоко под землёй, в пещерах Домаха Данияла. Сальдхаарийин верят, что в древности люди отличались могучим ростом и великой мудростью, а их философия позволяла изменять мир. Со временем они стали терять рост и разум, а прежняя философия выродилась в то, что теперь зовут [Concept('magic','магией')|E], опасной силой, соблазняющей людей злом. Немногие, названные бану Даниял, бежали под землю к Истинному Софокосу, а их родичи превратились в современное человечество. Сальдхаарийин считают философию божественной, а философов — живыми воплощениями божественного на [Concept('aeras','Аэрасе')|E]."
