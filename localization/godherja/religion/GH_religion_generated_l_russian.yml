 thamaqiri_desc_with_gc:0 "Тамакирийцы отвергают саму мысль о том, что тысячу и один обряд можно совершить где-либо, кроме Тысячи и одной ступени [GetBuilding('01_sophocos').GetName]. Любую попытку провести их в другом месте они считают осквернением священнодействий, а потому объявляют всех прочих [Concept('ritualism','ритуалистов')|E], поступающих подобным образом, откровенными неверными."
 thamaqiri_rite:0 "Тамакири'а"
 thamaqiri_rite_adherent:0 "Тамакири"
 thamaqiri_rite_adherent_plural:0 "Тамакирииин"
 thamaqiri_rite_adj:0 "Тамакири"
 thamaqiri_rite_desc:0 "Тамакирийцы отвергают саму мысль о том, что тысячу и один обряд можно совершить где-либо, кроме Тысячи и одной ступени Софокоса. Любую попытку провести их в другом месте они считают осквернением священнодействий, а потому объявляют всех прочих ритуалистов, поступающих подобным образом, откровенными неверными."
 the_dragon_cult_desc_with_gc:0 "Древний Культ [Concept('dragons','Дракона')|E] — это вера, распространённая на более юго-западных [Concept('shatteredisles','Расколотых островов')|E], тех, что ближе к [Concept('sarradon','Саррадону')|E]. Смесь верований и доктрин как из эрсодиаксинизма, так и из Драканориксской Аагиократии, Культ Дракона сосредоточен исключительно на поклонении тем великим зверям, славящимся по всему [Concept('aeras','Эрасу')|E] своей мощью и величием. Они превозносят божественные атрибуты драконов и утверждают, что бог-творец Каралтор создал тех, кто известен как Крылатые Владыки, по своему образу и подобию, чтобы править человечеством как благодетельные монархи и жестокие каратели несправедливости и нечистоты. Величайший из Крылатых Владык, Паратариан, стоит превыше всех как перворождённое дитя Каралтора и повелитель не только всех Драконов, но и самого Эраса. Остальную часть пантеона Культа составляют другие Драконы, хотя великое множество этих «Драконов» на самом деле являются просто исключительно могущественными [magi|E1], обожествлёнными после смерти."
