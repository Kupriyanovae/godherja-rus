 tasaawism_desc_with_gc:0 "Тасаавийин учат, что всякая [Concept('the_towers','Башня')|E] — это [GetBuilding('01_sophocos').GetName], а башня в [Glossary('Харадамате','kharadamat_encyclopedia_desc')], традиционно почитаемая [Concept('ritualism','ритуалистами')|E], лишь одно из множества равных воплощений. По их словам, прочие ритуалисты ошибаются, возвышая одну башню над другими: Софокос явлен во всех уголках [Concept('aeras','Аэраса')|E], чтобы каждый верующий мог видеть хотя бы одну из Башен."
 tasaawism_rite:0 "Тасави'а"
 tasaawism_rite_adherent:0 "Тасави"
 tasaawism_rite_adherent_plural:0 "Тасавииин"
 tasaawism_rite_adj:0 "Тасави"
 tasaawism_rite_desc:0 "Тасаавийин учат, что всякая Башня — это Софокос, а башня в Харадамате, традиционно почитаемая ритуалистами, лишь одно из множества равных воплощений. По их словам, прочие ритуалисты ошибаются, возвышая одну башню над другими: Софокос явлен во всех уголках Аэраса, чтобы каждый верующий мог видеть хотя бы одну из Башен."
 tathtali_desc_with_gc:0 "Татхталийцы претендуют на то, чтобы быть основным течением [Concept('wardenism','варденизма')|E], и исторически это предположение не было совсем неверным, поскольку татхталийцы господствуют над наиболее густонаселённым ядром варденитской веры. Хотя они утверждают, что их традиции восходят к векам, к основанию варденизма при [Concept('the_first_warden','самом Первом Вардене')|E], особенности, определяющие это движение, обязаны больше $mamur_tathtali_link$ мамуру IX века от И.С.#!, чьим именем часто называют это движение. Главное различие между татхталийцами и тем, что было до них, заключается в единой и всевластной фигуре [Concept('mamuramat','Мамура')|E], чья власть абсолютна и священна. Именно он обладает последним словом во всех юридических вопросах, именно он ведёт армии верных в военное время и улаживает дела солдат в мирное. Его слово — закон, или, по крайней мере, такова теория."
 tathtali_faith:0 "Татхталийск"
 tathtali_faith_adherent:0 "Татхталиец"
 tathtali_faith_adherent_plural:0 "Татхталийцы"
 tathtali_faith_adj:0 "Татхталий"
 tathtali_faith_desc:0 "Татхталийцы претендуют на то, чтобы быть основным течением [Concept('wardenism','варденизма')|E], и исторически это предположение не было совсем неверным, поскольку татхталийцы господствуют над наиболее густонаселённым ядром варденитской веры. Хотя они утверждают, что их традиции восходят к векам, к основанию варденизма при [Concept('the_first_warden','самом Первом Вардене')|E], особенности, определяющие это движение, обязаны больше $mamur_tathtali_link$ мамуру IX века от И.С.#!, чьим именем часто называют это движение. Главное различие между татхталийцами и тем, что было до них, заключается в единой и всевластной фигуре [Concept('mamuramat','Мамура')|E], чья власть абсолютна и священна. Именно он обладает последним словом во всех юридических вопросах, именно он ведёт армии верных в военное время и улаживает дела солдат в мирное. Его слово — закон, или, по крайней мере, такова теория."
 tathtali_rite:0 "Татхталийск"
 tathtali_rite_adherent:0 "Татхталиец"
 tathtali_rite_adherent_plural:0 "Татхталийцы"
 tathtali_rite_adj:0 "Татхталий"
 tathtali_rite_desc:0 "Татталийа претендуют на роль главного направления веры Хранителей, и исторически эти притязания не вполне беспочвенны: татталийа господствуют в самой густонаселённой сердцевине веры. Хотя их последователи заявляют, будто традиции восходят к самому Первому Хранителю и началу религии, отличительные особенности течения в гораздо большей степени сложились под влиянием мамура IX века ИС, имя которого оно носит. Главное отличие татталитов от предшественников — единая и всемогущая фигура мамура, чья власть абсолютна и священна. За ним остаётся последнее слово во всех правовых спорах; он ведёт армии верующих на войне и расселяет воинов в мирные годы. Его слово — закон. Во всяком случае, так гласит теория."
 tegonian_desc_with_gc:0 "Тегонианизм — это древние верования народа сейшесков, нынешнего Пергикоса. Тегонисты верят, что провидцы, в основном Тарка и Вагас, открыли эту веру сейшескам после того, как обнаружили присутствие богов в шести видениях. Во сне Они объявили, что разочарованы тем, что их дети забыли, как поклоняться им, и потребовали верности сейшесков, иначе сам мир будет уничтожен великим облаком яда.\n\nТегонистские обряды диктуют, что почти никакое действие не может быть совершено без предварительной консультации с богами. Даже такие тривиальные вещи, как что надеть или по какой стороне улицы идти, должны быть решены богами."
 tegonian_rite:0 "Тегонистск"
 tegonian_rite_adherent:0 "Тегонист"
 tegonian_rite_adherent_plural:0 "Тегонисты"
 tegonian_rite_adj:0 "Тегонианизм"
 tegonian_rite_desc:0 "Тегонианизм — это древние верования народа сейшесков, нынешнего Пергикоса. Тегонисты верят, что провидцы, в основном Тарка и Вагас, открыли эту веру сейшескам после того, как обнаружили присутствие богов в шести видениях. Во сне Они объявили, что разочарованы тем, что их дети забыли, как поклоняться им, и потребовали верности сейшесков, иначе сам мир будет уничтожен великим облаком яда.\n\nТегонистские обряды диктуют, что почти никакое действие не может быть совершено без предварительной консультации с богами. Даже такие тривиальные вещи, как что надеть или по какой стороне улицы идти, должны быть решены богами."
