 iramite_rite_desc:0 "Ирам, Город Столпов.\nОна восстанет из песков, как заря, но лишь для тех, чей разум открыт и чьи сердца достойны.\nОна будет черна, как смоль, и изрезана золотом, полна самоцветов, сверкающих, как тысяча звёзд.\nСемиглавый Змей будет с тоской взирать на тебя в городе, где ты будешь в безопасности.\nНе ищи Ирам, верный, пока Ирам сам не найдёт тебя."
