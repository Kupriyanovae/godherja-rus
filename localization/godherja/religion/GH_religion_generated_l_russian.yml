 authority_rite_desc_with_gc:0 "Кронский обряд, также известный как Королевский обряд или Обряд Власти, прослеживает многие свои фундаментальные богословские истоки до самого образования Имперреха. Хотя изначально большинство считало это лишь временным устройством, ряд крайне спорных и, возможно, апокрифических заявлений, сделанных Ценваром и его ближайшими соратниками на протяжении его правления, позже послужили топливом для одного из самых горьких и разделяющих конфликтов в сьялволькской религии — а именно природы самого Верховного Королевства и его власти над духовными делами.\n\nКронисты, в отличие от обрядов [GetTitleByKey('c_oraispol').GetNameNoTier] и Могилы Велоса, утверждают, что Верховное Королевство на самом деле никогда не задумывалось как уникальная сущность, и что оно было примером того, что могущественный светский правитель должен быть главой сьялволькского мира — правда, в форме преемника «Святого Королевства», а не какой-то безумной попытки возродить сам Имперрех. Хотя изначально не будучи открыто антиклерикальным, последующие конфликты с обрядом Могилы Велоса также привели к тому, что он занял всё более враждебную позицию по отношению к власти духовенства — а именно, что верными должны руководить наиболее достойные светские лорды, а не находиться в руках возможно гедонистического и интригующего духовного класса, который угрожает уничтожить веру ради жажды власти."
