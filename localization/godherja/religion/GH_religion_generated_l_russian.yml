 badari_desc_with_gc:0 "В глазах большинства единоверцев из числа [Concept('wardenism','Хранителей')|E] бадари'а — одна из опаснейших ересей. Она возникла из попытки соединить вероучение Хранителей с религиозными законами дикансианцев, которую предприняла придворная группировка $mamur_radi_i_link$ мамура Ради#!. Бадаритов повсеместно недолюбливают и считают радикалами, несмотря на их упорные попытки доказать обратное. Даже агионисты, именующие их своими «друзьями», едва терпят бадаритов: для них это скорее неудачная шутка, чем серьёзные союзники."
