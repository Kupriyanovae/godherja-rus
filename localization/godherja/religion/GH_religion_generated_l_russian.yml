 imperii_rite_adj:0 "Империи"
 imperii_rite_desc:0 "Империи относится к разрозненным языческим верованиям древних этепезейцев, возможно, даже древнего племени-предка этапексе. Основанные в основном на почитании различных руин и попытках восстановить древние храмы, империйцы верят, что строения могут становиться домом для духов как спонтанно, так и благодаря поколениям их обитателей. Пантеон империйцев обширен, но все согласны с существованием [Concept('aersanon','Красного Владыки')|E] — правителя всех духов и строителя всех великих руин мира, о котором чаще всего говорят, что он некогда обитал в [Concept('sea_tower','Морской башне')|E]."
