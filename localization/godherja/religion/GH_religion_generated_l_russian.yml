 mukaasubat_desc_with_gc:0 "После краха [GetTitleByKey('e_far_eastern_mamuramat').GetNameNoTier] мукаасубиты уверовали, что Столпы Добродетели начали рушиться. Когда книги, оставленные упразднённым государством, начали гнить, благочестивые начали вырезать замены на больших каменных плитах и хоронить судей вместе с их судебниками. Это, по их мнению, снабдит их необходимыми материалами для восстановления столпов в загробной жизни. Однако по мере того, как столпы продолжают рушиться, освобождаются «кебан седжан» — духи добродетели, которые могут вселяться в благочестивых и добрых смертных и наделять их великой мудростью."
 mukaasubat_rite:0 "Мукаасубийск"
 mukaasubat_rite_adherent:0 "Мукаасубит"
 mukaasubat_rite_adherent_plural:0 "Мукаасубиты"
