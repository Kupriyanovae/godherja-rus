 earth_rite_faith_desc:0 "Обряд Прохена — систематизированное учение о почитании бога Прохена, которое прежде переселений часто подвергалось насмешкам. В отличие от «анархии верований», проповедуемой реформаторами Орисполя, прохениты признают необходимость единой власти, направляющей верующих к предначертанной судьбе."
