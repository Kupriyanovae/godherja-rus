 aeschraes_aagiokrata_rite_desc:0 "Хотя именно ау́тократир-легон Эсхраэс освободил Фродброкну и погубил Аверсарию, во время Имперской гражданской войны и особенно в последовавшие за ней десятилетия смуты вокруг него постепенно сложился культ фанатиков. Его последователи упорно твердят, будто «ошибки» Эсхраэса были делом рук тёмных злодеев — прежде всего Аксиофеи. Они не без основания заявляют, что престол принадлежал ему по праву и закону, а значит, все, кто называет себя потомками Чистейших, обязаны склониться перед его властью."
