 underimperial_aagiokrata_faith_desc:0 "Когда город Неветексон рухнул в [Concept('mayikrata','подземный мир')|E] благодаря усилиям [Concept('magi','мага')|E] Аваксона и его революции против [Concept('chaos_of_the_seventh_century','оккупационных')|E] армий [Concept('kartharadd','Картарадди')|E], они приземлились в пещере, охваченной войной. На их острове посреди великой бездны курратаггаггцы и скраттакийцы воевали, и вскоре к великой битве присоединились недавно прибывшие [Concept('aversaria','имперцы')|E] и выжившие армии Картарадди, что уничтожило большую часть того, что осталось от Неветексона.\n\nУченик Аваксона, Зекрос, положил конец войне открытием Маяка и подписанием Бездонного Мира. После этого Блик-Бикон стал, возможно, крупнейшим городом в подземном мире, и странное слияние племенных, картараддцев (странно пощажённых от [Concept('night_of_the_bleeding_moon','судьбы своих сородичей на поверхности')|E]) и имперцев привело к формированию аагиократического культа, смешивающего каждую веру, представленную в Бездонном Мире."
 underimperial_aagiokrata_rite:0 "Агиократия Мрачного маяка"
 underimperial_aagiokrata_rite_adherent:0 "Аагиократ"
 underimperial_aagiokrata_rite_adherent_plural:0 "Аагиократы"
 underimperial_aagiokrata_rite_adj:0 "Аверсарианская Аагиократия"
 underimperial_aagiokrata_rite_desc:0 "Когда маг Авахон, восстав против оккупационных войск Картхарадди, низверг город Неветексон в подземный мир, тот угодил прямо в охваченную войной пещеру. На острове посреди великой бездны сражались курратагаггларны и скраттакиаттия, а прибывшие имперцы и уцелевшие войска Картхарадди вскоре втянулись в общую битву, уничтожившую большую часть того, что ещё оставалось от Неветексона.\n\nУченик Авахона, Зекрос, положил конец войне, открыв Свет Маяка и заключив Мир Бездны. Впоследствии Бликбикон стал, вероятно, крупнейшим городом подземного мира, а необычное соседство племенных народов, Картхарадди — по странной прихоти судьбы избежавших участи своих наземных сородичей — и имперцев породило культ Аагиократы, объединивший черты всех верований, представленных при заключении Мира Бездны."
 venalmic_rite:0 "Веналмик"
 venalmic_rite_adherent:0 "Сепаттанец"
