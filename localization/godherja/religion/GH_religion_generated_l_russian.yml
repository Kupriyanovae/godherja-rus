 theryionist_faith_desc:0 "Терионисты поклоняются Териону, «Последнему Дракону», древнему [Concept('aversaria','аверсарианскому')|E] претенденту на Империю.\n\nВнучатый племянник аавтократии $aauto_maklea_link$ Маклеи#!, Терион был тайно воспитан с целью вернуть трон, который его семья считала украденным Маклеей. Когда дед Териона умер, Терион в возрасте 20 лет вышел из укрытия и напал на Аверсарию, охваченную гражданской войной. Верхом на виверне вместо (считавшихся вымершими) драконов, Терион начал Вдовью войну и быстро стал легендой, даже его враги называли его «Последним Драконом» в знак признания его приверженности старой чести и идеалам домаклейской Аверсарии. Война закончилась лишь его предполагаемой смертью после почти 40 лет ожесточённых боёв. Терионисты утверждают, что Терион был духом в человеческом обличье, который просто вознёсся, чтобы вершить кровавое правосудие на небесах. Терионистское верование гласит, что Терион направляет мир из эфемерного [Concept('first_empire','Первого Города')|E], и однажды вернётся, переродившись как [Concept('aersanon','Чистейший')|E], чтобы вернуть свой законный трон."
