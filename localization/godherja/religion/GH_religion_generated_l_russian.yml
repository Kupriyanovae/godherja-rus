 badari_rite_desc:0 "В глазах большинства единоверцев из числа Хранителей бадари'а — одна из опаснейших ересей. Она возникла из попытки соединить вероучение Хранителей с религиозными законами дикансианцев, которую предприняла придворная группировка мамура Ради. Бадаритов повсеместно недолюбливают и считают радикалами, несмотря на их упорные попытки доказать обратное. Даже агионисты, именующие их своими «друзьями», едва терпят бадаритов: для них это скорее неудачная шутка, чем серьёзные союзники."
 banstur_rite_desc_with_gc:0 "Банстурский обряд — это плюралистический обряд, рождённый из многих [Concept('sjalvolki_migration','переселенческих')|E] сообществ, осевших вдоль Расколотого побережья, которые верят, что их долг — открывать, собирать и делиться знаниями Старого Мира с поселенцами Нового. Многие отвергают власть как Святого Королевства, так и Велосгрейва и придерживаются философии ненасилия."
