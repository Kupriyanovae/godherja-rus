 saratarat_rite_desc:0 "Саратарат — это пацифистская океаническая религия, основанная на почитании [Glossary('саратанов','GH_SARATAN_GLOSS')] из [Glossary('кратера Кезимин','crater_encyclopedia_desc')]. Саратаратины верят, что саратаны были первыми стражами мира, а также первыми существами, и что их движения образовали моря и [Concept('aeras','Эрас')|E], которые кружились вокруг них, формируя реальность и саму вселенную.\n\n[Concept('sarataratin_militarism','После великого бедствия')|E], верные присягнули пацифизму и теперь ведут скромную жизнь рыбаков и торговцев."
 sarridian_reformism_desc_with_gc:0 "$oulnir_link$ Гурдурбок#! мог пасть от клинков своего вероломного брата, отца [Concept('aversaria','черногорских имперцев')|E], короля $nicanoneus_link$ Никанея#!, но поколения сарридианцев, шедшие за ним и овладевшие родной землёй после гибели империи, вдохновились мечтой создать новый, лучший мир, какого не мог представить ни один сарридианец до первого истинного короля.\n\nОбъединённая общей целью и духом, новая сарридианская знать поощряет распространение «созданного» ими языка (в основном смеси [GetCulturePillar('language_aversarian').GetName], [GetCulturePillar('language_marcher').GetName], [GetCulturePillar('language_rekvolki').GetName] и настоящих и вымышленных традиционных сарридианских письмен), а также множества новых художественных направлений и литературных обычаев.\n\nИ вера стала одновременно анахроничным образом старины и вдохновенным стремлением в будущее. Хотя она опирается главным образом на традиции и жреческое устройство древней Аагиократии, сарридианцы строят новую религию с тем же воодушевлением, с каким создают язык. Пока другие наследники Старой империи погрязли в ожесточённых спорах об имперском наследии, сарридианцы охотно изобретают новые столпы веры и отбрасывают всё неподходящее. Новый «Свободный аагиократский конклав сарридианских культов» уже учредил особую жреческую иерархию и обрядовую систему, не имеющую аналогов ни в одной другой земле [Concept('aeras','Аэраса')|E]. Эта вера оказалась одной из самых изменчивых: едва ли не ежедневно возникают новые обряды и соглашения об отказе от старых, а распространение грамотности в Чёрных горах лишь ускоряет обмен идеями."
