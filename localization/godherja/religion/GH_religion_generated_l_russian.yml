 kamayed_desc_with_gc:0 "Камайеди верят, что Тысяча и Одна Ступень [GetBuilding('01_sophocos').GetName] действительно существует, но не у великой [Concept('the_towers','Башни')|E], которую обычно описывают как их местонахождение в софокистском фольклоре. Вместо этого они утверждают, что ступени ведут вниз, в огромный кратер «за северными звёздами». Этот кратер, по их мнению, — врата в загробную жизнь, и те, кто достаточно достоин достичь дна, могут войти в царство богов."
 kamayed_rite:0 "Камаиеди'а"
 kamayed_rite_adherent:0 "Камайеди"
 kamayed_rite_adherent_plural:0 "Камаиедииин"
 kamayed_rite_adj:0 "Камайеди"
 kamayed_rite_desc:0 "Камайедийин верят, что Тысяча и одна ступень Софокоса действительно существует как осязаемое место, но вовсе не на великой Башне, где их обычно помещают сказания софокистов. По их учению, ступени ведут вниз, в огромный кратер «за северными звёздами». Они утверждают, что кратер — врата в загробный мир, а достойные, достигшие его дна, могут войти в обитель богов."
 kaosahetam_faith:0 "Као'сахетам"
 kaosahetam_faith_adherent:0 "Каосахетамец"
 kaosahetam_faith_adherent_plural:0 "Каосахетамцы"
 kaosahetam_faith_adj:0 "Каосахетамизм"
 kaosahetam_faith_desc:0 "Каосахетамцы верят, что каждый человек рождается с определённым количеством «Као» или «Удачи» в своём духе, которое увеличивается через совершение добрых дел и уменьшается при злых поступках. Те, у кого много Као, благословлены удачей в своих начинаниях, а те, у кого её недостаёт, погрязли в несчастьях. Каосахетамцы также используют гадание, наблюдая за движениями и действиями крабов, чтобы оценить Као человека. Говорят, что более искусные прорицатели могут использовать движения крабов, чтобы видеть правду прошлого и даже предсказывать будущие события."
