 wyrd_desc_with_gc:0 "Путь Вирда зародился в результате ранних миссионерских усилий [Concept('marchers','марочников')|E] в северном Калатипсоми. Эта миссия увенчалась лишь частичным успехом: она научила местное население необходимости следовать своему жизненному пути, но так и не смогла вытеснить их древние обряды и обычаи."
 wyrd_rite:0 "Обряд Вйрда"
 wyrd_rite_adherent:0 "Идущий по Вирду"
 wyrd_rite_adherent_plural:0 "Идущие по Вирду"
 wyrd_rite_adj:0 "Вирд"
 wyrd_rite_desc:0 "Путь Вирда возник благодаря первым миссионерским усилиям жителей Мархий на севере Калатипсоми и смешению принесённых ими учений с местными верованиями. Проповедь имела лишь ограниченный успех: местные жители приняли мысль о необходимости следовать своему жизненному Пути, но сохранили древние обряды и обычаи."
 xwestrozen_desc_with_gc:0 "Ксвестрозены возникли с Назой Великой после того, как она получила откровение об истинной природе [GetBuilding('01_sophocos').GetName]. Ксвестрозены утверждают, что Софокос на самом деле не является реальным местом, а скорее песней с тысячей и одной нотой, каждая нота восходит по высоте. Предположительно, овладение этой песней дарует просветление и великое магическое мастерство, и ксвестрозены верят, что [Concept('magi','маги')|E] черпают свою силу из знания некоторых нот этой песни. Однако вся музыка считается священной для ксвестрозенов, а не только Песнь Софокоса, и музыкантов широко почитают как благочестивых людей."
