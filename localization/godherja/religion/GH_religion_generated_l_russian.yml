 old_rite_priesthood_rite_desc:0 "Когда империя рухнула после падения Орайсполя под ударами армий переселенцев Ведьмолома, вместе с нею пал и Имперский культ, подорванный предательством Жреческого переворота и распространением девиационистских воззрений среди военачальников. Тысячи культов Аагиократии по всей империи столкнулись с двойным кризисом — помимо бесчисленных иных бед, обрушившихся на измученные остатки Аверсарии. Распад имперской законной власти оставил культы без общецерковного права и иерархии выше областного уровня, а теснейшая связь Аагиократии с самим существованием Аутократы лишила жречество подлинных юридических полномочий и богословских ориентиров.\n\nПока культы погружались в кровавые междоусобицы, приспосабливаясь к новой действительности Раздробленного побережья, земли без сильных военачальников, способных навязать девиационистское учение, оказались подобны кораблям без парусов и руля. Местные жрецы взвалили на себя все духовные обязанности, какие только могли, а управители были слишком заняты, чтобы делать что-либо сверх попыток поддержать умирающую веру. «Жречество старого обряда» стало у рителандцев названием староимперского уклада, при котором жрецы всеми силами делают вид, будто конец ещё не наступил, хотя их паства давно ушла вперёд."
 omitilos_aagiokrata_desc_with_gc:0 "После [Concept('frodbrokna','Фродброкны')|E] и распада [Concept('aversaria','Аверсарии')|E] не все Имперские жрецы были готовы потерять власть. Напротив, некоторые стремились её консолидировать. Они сплотились вокруг одного из своих и провозгласили его Ипсилонис Омитилосом, требуя почтения от всех прочих церковных и светских правителей. Они хотят сильного главы, вокруг которого верные могли бы сплотиться... и слабых королей, которые неспособны встать у них на пути."
