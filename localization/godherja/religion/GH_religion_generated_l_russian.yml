 kothori_desc_with_gc:0 "Смешение [Concept('wardenism','варденитских')|E] религиозных практик с некоторыми традициями, эндемичными для гор Тарсанид, Которский культ включает множество древних богов из старых барзавских пантеонов в веру либо как благосклонных духовных хранителей, либо как святых, причём первая группа часто воплощается в важных судьях, а вторая часто возносится после смерти до почти божественного статуса. Это, естественно, весьма скандально для более широкой варденитской веры, известной своей явной антитеистской позицией, но которцы всегда избегали подавления в основном из-за отдалённости своих горных домов и относительной безвестности своей сельской веры."
