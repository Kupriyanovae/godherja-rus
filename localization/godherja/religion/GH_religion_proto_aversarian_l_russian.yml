 proto_aversarian_religion_desc: "Наиболее распространённое название для тысяч культов и верований древних [Concept('aversaria','аверсарианцев')|E] во время (и до) [Glossary('Полисократии','GH_POLISOCRACY_GLOSS')]. Прото-аверсарианские веры обычно сосредоточены в той или иной степени вокруг [Concept('magic','магии')|E] и [Concept('magi','магов')|E], [Concept('aspect_blood','крови')|E], [Concept('dragons','драконов')|E], [Concept('the_towers','Башен')|E] и бесконечных простирающихся руин [Concept('the_continent','Расколотого побережья')|E]. Каждый полис обычно поклонялся своей собственной вариации более широкой веры, часто имея мало общего друг с другом, кроме смутного чувства культурного братства."