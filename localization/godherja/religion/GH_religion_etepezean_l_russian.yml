l_russian:

 etepezean_religion: "Этапексейск"
 etepezean_religion_adj: "Этапексе"
 etepezean_religion_adherent: "Этапексеец"
 etepezean_religion_adherent_plural: "Этапексейцы"
 etepezean_religion_desc: "Культурные предки современных [Concept('aversaria','аверсарианских')|E] культур, населяющих ныне Этепезею — этапексе — обитали на полуострове достаточно долго, чтобы так и не было доказано, возникла ли прото-аверсарианская культура впервые в Этепезее или на [Concept('shatteredisles','Островах')|E]. Их веры, хотя и не столь разрозненные, как у их родственников-островитян, тем не менее оставались в значительной степени разделёнными как в верованиях, так и в практике. Наибольшими общими чертами между верами, происходящими от этапексе, были почитание и увлечение обширными руинами, усеивающими Расколотое побережье, почитание [Concept('magi','магов')|E] и великих воинов, а также глубоко укоренившийся страх перед снами (во всех их проявлениях — обыденных, мистических и метафизических)."

 imperii: "Империйск"
 imperii_adj: "Империи"
 imperii_adherent: "Империец"
 imperii_adherent_plural: "Империйцы"
 imperii_desc: "Империи относится к разрозненным языческим верованиям древних этепезейцев, возможно, даже древнего племени-предка этапексе. Основанные в основном на почитании различных руин и попытках восстановить древние храмы, империйцы верят, что строения могут становиться домом для духов как спонтанно, так и благодаря поколениям их обитателей. Пантеон империйцев обширен, но все согласны с существованием [Concept('aersanon','Красного Владыки')|E] — правителя всех духов и строителя всех великих руин мира, о котором чаще всего говорят, что он некогда обитал в [Concept('sea_tower','Морской башне')|E]."
 imperii_old: "Староимперийск"
 imperii_old_adj: "Старые Империи"
 imperii_old_adherent: "Старый империец"
 imperii_old_adherent_plural: "Старые империйцы"