 skrattaki: "Скраттакийск"
 skrattaki_adj: "Скраттаки"
 skrattaki_adherent: "Скраттакиец"
 skrattaki_adherent_plural: "Скраттакийцы"
 skrattaki_desc: "Никто не помнит времён до [Concept('twist_of_the_tunnels','Великого Распада')|E], когда у скраттакиев ещё были глаза, чтобы видеть, и они поклонялись обычным смертным, не обладающим способностью владеть [Concept('magic','Теневым Даром')|E], ибо жрецы веками утверждали, что эта ненавистная эпоха лжи и обмана должна быть уничтожена во всех её проявлениях. Хотя первые скраттакийцы использовали Теневой Дар, чтобы выжечь из своего разума воспоминания и заменить их любовью к своему богу Скраллавиаксу — великой королеве-паучихе, которая научила скраттакийцев ползать по стенам пещер и спускаться в великую бездну, откуда она пришла, — это действие стало ритуалом. Теперь все скраттакийцы проходят Очищение Мыслей по достижении зрелости, уничтожая свои воспоминания и заменяя их совокупным знанием своего племени."
 skrattaki_old: "Староскраттакийск"
 skrattaki_old_adj: "Старые Скраттаки"
 skrattaki_old_adherent: "старый скраттакиец"
 skrattaki_old_adherent_plural: "старые скраттакийцы"

 grotticand: "Гроттикандск"
 grotticand_adj: "Гроттиканд"
 grotticand_adherent: "Гроттикандец"
 grotticand_adherent_plural: "Гроттикандцы"
 grotticand_desc: "Хранители [GetTitleByKey('b_grotto_of_the_golden_martyrs').GetNameNoTier], святейшего места во всём подземном мире, гроттиканды основали великие фермы и священные храмы в том, что когда-то было величайшим из городов под землёй. Тысячи странных и [Concept('aelfir','чуждых')|E] тел, найденных в Гроте, облачённых в странные золотые доспехи, которые невозможно выковать руками человека, считались древними стражами Грота, существовавшими ещё до того, как человек ступил в подземный мир.\n\nСчитая себя наследниками этого великого наследия и страшась возвращения варварских существ, которые, несомненно, убили древних стражей, гроттиканды посвятили себя сохранению этого древнего места и защите его величайшей магией, которую могли произвести их племена. С этой целью тела этих некогда великих воинов часто получали новую жизнь, чтобы помогать как в войне, так и в мире. Хотя многие находят их странный облик тревожным, и хотя не один из них обретал безумное подобие своей былой жизни и устраивал резню, прежде чем его изгоняли, великое изобилие Грота и помощь [Concept('gh_general_undead','нежити')|E] позволили гроттикандам создать три великие империи задолго до того, как какой-либо захватчик проник из [Concept('aversaria','неведомых земель')|E]."
 grotticand_old: "Старо-гроттикандск"
 grotticand_old_adj: "Старый Гроттиканд"
 grotticand_old_adherent: "Старый гроттикандец"
 grotticand_old_adherent_plural: "Старые гроттикандцы"

 krothagg: "Кротхаггск"
 krothagg_adj: "Кротхагг"
 krothagg_adherent: "Кротхаггец"
 krothagg_adherent_plural: "Кротхаггцы"
 krothagg_desc: "Дети великих Первых Царей, Джора Разрушителя Гор и Грулара Мудреца, как говорят, были приведены под землю, чтобы встретиться с самыми ненавистными врагами всего человечества — трусливыми и коварными [Concept('aelfir','экаггирами')|E]. Хотя Джор и Грулар изгнали их под землю во время [Concept('prehistory','Войн Богов')|E], братья-воины объединили свои племена, когда мир треснул и раскололся, и повели великую армию, чтобы чёрные звери никогда больше не поднялись.\n\nХотя кротхаггские цари доминировали в подземном мире, [Concept('twist_of_the_tunnels','Искажение туннелей')|E] разрушила их империю, оставив лишь малую часть населения в их странной новой реальности. Великий Кормакан «Бескровный», величайший из царей со времён Джора и Грулара, впоследствии объявил мир проклятым и нуждающимся в исправлении через праведную войну и воссоздание павшей Кротхаггской империи будущим царём-спасителем."
 krothagg_old: "Старокротхаггск"
 krothagg_old_adj: "Старый Кротхагг"
 krothagg_old_adherent: "Старый кротхаггец"
 krothagg_old_adherent_plural: "Старые кротхаггцы"

 currataggagga: "Курратаггаггск"
 currataggagga_adj: "Курратаггагга"
 currataggagga_adherent: "Курратаггаггец"
 currataggagga_adherent_plural: "Курратаггаггцы"
 currataggagga_desc: "Подземный бог Курратаггагга, Хранитель Камня, который сдвигал горы и веками охранял племя преданных почитателей после Великого Истребления верхнего мира и Убийства Первого Солнца, был убит в великой битве против Бездонного Дракона, который когда-то угрожал пожрать мир изнутри много эонов назад. Племя, которое он оставил, продолжило почитание великого Курратаггагги до тех пор, пока не обнаружило Курутаггам, Великого Голема Божественных Камней. Курутаггам был оживлён шёпотом верных, древний и ужасный дух наполнил их тело, а новое чувство надежды и радости жизни очистило их души от того, что они называли многими злами против человека, существовавшими до того, как кто-либо ступил в подземный мир.\n\nКурутаггам привёл племена ко многим победам над угрозами подземного мира и привёл к тому, что кротхагги создали великую империю во имя его, но козни слепых змеев бездны — ненавистных скраттаки — и прибытие гнусной [Concept('aversaria','Поверхностной Империи')|E] в Блик-Бикон и их ужасной бледной чумы обернули удачу верных. Сначала комой, в которую Курутаггам был погружён тёмными [Concept('magi','магами')|E] с поверхности, затем потерей их тела, когда курратаггагги были вынуждены бежать из своей поражённой чумой родины в сердце Иджрак-Муркула."
 currataggagga_old: "Старокурратаггаггск"
 currataggagga_old_adj: "Старая Курратаггагга"
 currataggagga_old_adherent: "Старый курратаггаггец"
 currataggagga_old_adherent_plural: "Старые курратаггаггцы"

 zivvirath: "Зиввиратск"
 zivvirath_adj: "Зиввират"
 zivvirath_adherent: "Зиввиратец"
 zivvirath_adherent_plural: "Зиввиратцы"
 zivvirath_desc: "Легендарные Рыболюди подземного мира, как их называют [Concept('aversaria','аверсарианские')|E] исследователи, которые встречали зиввиратов, бороздили великие воды подземного моря гораздо дольше, чем любая современная империя существовала на поверхности. Самое древнее зиввиратское предание, записанное в Великой Книге Первых, утверждает, что предки зиввиратов бежали от великой битвы между армиями, вооружёнными сталью и могущественными огненными посохами, которые опустошили их древнюю родину Утуггуи, через портал, который привёл их под землю.\n\nВ бесконечные эпохи с тех пор зиввираты ввели десятки новых богов, чтобы заменить старых и забытых, лишь кратко упомянутых в Великой Книге. Главные три — Зиккуру, Рыбомать, которая родила могучих Чешуйчатых Карпов, на которых зиввиратские рейдеры гордятся верховой ездой; Кам-казолл, который открыл великий портал и из чьей крови произошли все [Concept('magi','маги')|E]; и Занзабу, который научил зиввиратов строить первые лодки, способные плавать под водой, и даровал им плавники и жабры на случай, если они упадут с них."
 zivvirath_old: "Старозиввиратск"
 zivvirath_old_adj: "Старый Зиввират"
 zivvirath_old_adherent: "Старый зиввиратец"
 zivvirath_old_adherent_plural: "Старые зиввиратцы"

 underimperial_aagiokrata: "Подземно-имперско-аагиократическ"
 underimperial_aagiokrata_adj: "Подземно-имперская Аагиократия"
 underimperial_aagiokrata_adherent: "Подземно-имперский аагиократ"
 underimperial_aagiokrata_adherent_plural: "Подземно-имперские аагиократы"
 underimperial_aagiokrata_desc: "Когда город Неветексон рухнул в [Concept('mayikrata','подземный мир')|E] благодаря усилиям [Concept('magi','мага')|E] Аваксона и его революции против [Concept('chaos_of_the_seventh_century','оккупационных')|E] армий [Concept('kartharadd','Картарадди')|E], они приземлились в пещере, охваченной войной. На их острове посреди великой бездны курратаггаггцы и скраттакийцы воевали, и вскоре к великой битве присоединились недавно прибывшие [Concept('aversaria','имперцы')|E] и выжившие армии Картарадди, что уничтожило большую часть того, что осталось от Неветексона.\n\nУченик Аваксона, Зекрос, положил конец войне открытием Маяка и подписанием Бездонного Мира. После этого Блик-Бикон стал, возможно, крупнейшим городом в подземном мире, и странное слияние племенных, картараддцев (странно пощажённых от [Concept('night_of_the_bleeding_moon','судьбы своих сородичей на поверхности')|E]) и имперцев привело к формированию аагиократического культа, смешивающего каждую веру, представленную в Бездонном Мире."