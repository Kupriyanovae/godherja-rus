 fallen_star: "Падше-звездн"
 fallen_star_desc: "Загадочный культ, сосредоточенный вокруг чудовищной [Concept('fallen_star','Падшей Pвезды')|E], который проповедует, что просветление может быть достигнуто только через осознание бессмысленности жизни на [Concept('aeras','Эрасе')|E], в то время как истинный смысл можно найти в поклонении самой Падшей Звезде. Те, кто не принимает это, должны быть стёрты в пыль и удалены из этого мира, ибо они — распространители нынешнего состояния человечества.\n\nХотя широко не известно, где находится Падшая Звезда — или даже существует ли она на самом деле, — благочестивые знают, что по-настоящему умелые и достойные ревнители великой Звезды будут призваны в её логово во сне, чтобы получить могущественное благословение её магии и быть посвящёнными в «истинный культ»."
