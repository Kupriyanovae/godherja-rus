 shadowy_cults_religion_desc: "Человечество имеет естественное стремление искать божественное, и пока на [Concept('aeras','Эрасе')|E] поклоняются какой-либо вере, существует головокружительное множество культистов, поклоняющихся странным и теневым богам. Некоторые завоевали империи и утвердились как полноценные «веры», но подавляющее большинство навсегда останутся в тени, отвергнутые теми #BOL глупцами#!, кто не понимает #BOL истинной#! божественности."
