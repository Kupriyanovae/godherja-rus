l_russian:
 yrridic: "Дириддийский"
 dyrridic_adj: "Диридди"
 dyrridic_adherent: "Дириддиец"
 dyrridic_adherent_plural: "Дириддийцы"
 dyrridic_desc: "Хотя изначально они были частью более широкой среды племенных вер, распространённых по древним Клановым землям, ранний конфликт с $kathanouxa_link$ Катануксской империей#! оттеснил дириддийцев на юг и привёл к столкновению с древними племенами современной Этепезеи. Будучи в одних местах завоевателями, а в других — беженцами, дириддийцы быстро синкретизировались с более оседлыми южанами, сохраняя при этом свои племенные традиции. Ко времени ранней [Concept('aversaria','Империи')|E] племена поклонялись богу Сортеку, воинственному отцу-молнии, который ударил молнией с небес в первое дерево, чтобы дать человечеству огонь, и научил их владеть мечами."
 dyrridic_old: "Старо-дириддийск"
 dyrridic_old_adj: "Старая Диридди"
 dyrridic_old_adherent: "Старый дириддиец"
 dyrridic_old_adherent_plural: "Старые дириддийцы"