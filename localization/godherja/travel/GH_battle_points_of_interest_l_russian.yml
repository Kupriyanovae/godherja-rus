 BattlePoIHistoricalNameFlowerPass: "Битва у Цветочного перевала"
 BattlePoIHistoricalDescFlowerPass: "#emp Победитель: [GetScriptedCharacterByHistoryID('jarakmar_ertomax_16').GetTitledFirstName]\nПобеждённый: [GetScriptedCharacterByHistoryID('astilik_astiliak_2').GetTitledFirstName]\nДата: 11 васаде (5), 192 И.С.#!\n#weak Битва у Цветочного перевала была крупным сражением между набирающим силу королевством [Concept('ertomax','Эртомакса')|E] и вторгшейся [Concept(astilik_empire','Астиликской империи')|E], закончившееся решительной победой Эртомакса. Когда численно превосходящие имперские силы двинулись на Жа'Ракмарские позиции, серия внезапных лавин расколола их армию на три разрозненных отряда, которые затем поодиночке перебили застрельщики [GetMaA('kanpahuri').GetName]. Астиликский император и многие из его вельмож пали в бою, что позволило [GetScriptedCharacterByHistoryID('jarakmar_ertomax_16').GetTitledFirstNameNoTooltip] затребовать колоссальную дань под угрозой вторжения в сердце астиликских земель.#!"

 BattlePoIHistoricalNameElysianPass: "Битва у Элизийского перевала"
 BattlePoIHistoricalDescElysianPass: "#emp Победитель: [GetScriptedCharacterByHistoryID('daukeni_sjalvolki_1').GetFirstNameNicknamed]\nПобеждённый: [GetScriptedCharacterByHistoryID('westernimperial_aversarinas_aagiokrata_154').GetTitledFirstName]\nДата: 3 прохде (2), 1252 И.С.#!\n#weak Элизийский перевал — ничем не примечательный горный проход между деревней Илтия на востоке и крепостью Тамасатро на западе, в нескольких лигах к западу от основных путей, ведущих на юг, в сердце Империи. Дорога здесь была проложена ещё в V веке и с тех пор почти не развивалась — ею пользовались разве что местные жители, солдаты, передвигавшиеся между имперскими крепостями, да торговцы, по тем или иным причинам избегавшие главного тракта.\n\nИменно здесь Сокрушитель Ведьм встретил 26 [Concept('aversaria','аверсарианских')|E] легионов, а также тысячи вспомогательных войск из Аверсарии и её пределов. Это стало крупнейшим скоплением аверсарианских солдат на памяти ныне живущих и первым проявлением имперского единства против сьялволков с самого начала [Concept('sjalvolki_migration','переселений')|E]. И именно здесь лишь четырём легионам удалось унести ноги; подавляющее большинство отправленных на север солдат так и не вернулось, в то время как армия сьялволков осталась практически невредимой.\n\nНыне путники обычно обходят это место стороной, считая его проклятым или опасаясь, что использование сьялволками [Concept('mixed_magic','магии Тумана')|E] отравило землю. Те же, кто всё-таки проходит мимо, отмечают, что самое примечательное в этой местности — полное отсутствие чего-либо примечательного, хотя вся округа до сих пор усыпана доспехами, оружием и костями.#!"

 BattlePoIHistoricalNameTenTrees: "Битва у Десяти деревьев"
 BattlePoIHistoricalDescTenTrees: "#emp Победитель: [GetScriptedCharacterByHistoryID('daukeni_sjalvolki_1').GetFirstNameNicknamed]\nПобеждённый: [GetScriptedCharacterByHistoryID('northernimperial_aversarinas_aagiokrata_48').GetTitledFirstName]\nДата: 20 уреде (3), 1248 И.С.#!\n#weak Поляна в лесах Калатипсоми поколениями была известна местным жителям как «Десяти деревьев» — названная так в честь десяти сосен, возвышающихся друг над другом по (приблизительному) кругу дольше, чем кто-либо из ныне живущих помнит. В этом месте нет ничего поистине мистического; максимум, оно служило скромным святилищем для различных племенных верований, чьи последователи когда-то считали этот край своим домом. Для большинства же тех, кто знал о нём в истории, поляна была не более чем путевым ориентиром, природным аналогом придорожного столба — пока в её окрестностях не произошла знаменитая [Concept('battle_of_ten_trees','битва у Десяти деревьев')|E].#!"
 
