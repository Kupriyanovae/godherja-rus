 EventPoIHistoricalNameOpakasijakLandings: "Высадка в Опакасии"
 EventPoIHistoricalDescOpakasijakLandings: "Дата: 1-е таргаде (6), 1265 И.С.#!\n#weak #!В Платиднае есть безымянный участок побережья, где окружающие острова гасят волны, оставляя это место погруженным в тишину и покой, нарушаемый лишь приливами и отливами. Именно здесь Иордан из Сумерек, правитель близлежащего острова Тинитида, предложил высадиться войскам Имперреха. Таким образом, этот пляж стал плацдармом для завоевания Опахасии Имперрехом и местом, где они соединились с силами, ранее прибывшими на Тинитиду перед форсированием пролива."

 EventPoIHistoricalNameDeathPreacher: "Смерть Проповедника"
