l_russian:

 gh_laamp_decision_event.1000.desc_intro_returned_metro_holding: "Поднявшись на возвышенность, я обозреваю владение [visiting_location.GetTitle.GetNameNoTierNoTooltip], пытаясь проникнуться этой жемчужиной государства [visiting_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nЗдесь живут не только [visiting_location.GetCulture.GetNameNoTooltip|l], но и представители самых разных культур со всех уголков мира — поистине плавильный котел для бессчетного множества обычаев и традиций."
 gh_laamp_decision_event.1000.desc_intro_metro_holding_01: "Миновав величественные ворота и арки, мы вступаем в великий город [visiting_location.GetBaronyNameExplicitlyNoTooltip]. Неудивительно, что [visiting_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitledFirstName] считает его жемчужиной в своей короне, и я устремляю взор в самое сердце этого города."