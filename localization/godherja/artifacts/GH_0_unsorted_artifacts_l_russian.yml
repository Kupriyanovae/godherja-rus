 artifact_armor_of_aushedar_name: "Доспех Аушедара"
 artifact_armor_of_aushedar_description: "Носимый $qanamsar_aushedar_link$ Канамасаром Аушедаром#! в его кампаниях по [Concept('amsar','Амсару')|E] и за его пределами, эта кольчуга выкована из переплетённых пластин, тяжелее обычной солдатской сбруи, но на удивление гибкая. Мнения расходятся относительно того, имела ли она когда-либо позолоту или украшения; в нынешнем состоянии она проста и затемнена, с глубокими вмятинами, вероятно, относящимися к битвам его неудачной попытки завоевания [GetTitleByKey('e_ayyar').GetName]."

 artifact_siralqueen_crown_name: "Корона цариц Сирала"
 artifact_siralqueen_crown_description: "Обруч из кованого серебра, украшенный бледным жемчугом, собранным на побережье Сирала. Дизайн аскетичен, с одной полосой и без более высокого гребня, что соответствует обычаям правителей Сирала. Изготовленная $siralqueen_senayya_link$ царицой Сенайей#! при её вступлении на престол, она затем передавалась её наследникам. На её поверхности видны следы многократной переделки, свидетельствующие о ремонте на протяжении последовательных правлений цариц Сирала."

 artifact_pedestal_crown_of_golshan_name: "Корона Гольшан"
 artifact_pedestal_crown_of_golshan_description: "Подаренная $qanamsar_pejman_link$ Канамасаром Педжманом#! своей первой жене Гольшан, эта корона сделана из золота и украшена драгоценными камнями, причём в её дизайне отчётливо видно влияние мастеров [Glossary('Айяра','ayyar_coast_encyclopedia_desc')]. Арки высоки и изогнуты, с филигранью и гроздьями вставок, напоминающими их северо-восточных магов-ремесленников. Айярское влияние придало этому изделию роскошный характер с плотным орнаментом и разнообразными огранками, призванными ослеплять на свету."

 artifact_figurine_of_mother_of_milk_name: "Фигурка Матери Молока"
 artifact_figurine_of_mother_of_milk_description: "Маленькая фигурка, вырезанная из китовой кости, изображает Мать Молока в виде округлой массы с кольцом маленьких ртов на поверхности. По верху проходит глубокая трещина, рассматриваемая как бесконечная родильная рана Матери. В основании имеется бороздка, отполированная до гладкости, вероятно, от того, что её крепко сжимали во время ритуалов деторождения."

 artifact_statue_of_three_divine_siblings_name: "Рельеф Трёх Божественных Братьев"
 artifact_statue_of_three_divine_siblings_description: "Рельеф запечатлевает схватку трёх божественных братьев, когда Тарханну и Аннира восстали против своего брата Кеша, стремившегося к господству как над мёртвыми, так и над живыми. Тарханну поднимает свой молот над львино-змеиной формой Кеша, в то время как Аннира упирается щитом в его кольца. В толковании Тулхарсина эта схватка привела к разрыву родства между старейшими богами, Кеш был низвергнут в тень, и смерть стала участью смертных."

 artifact_throne_of_the_lirenaras_name: "Трон Двойного Льва"
 artifact_throne_of_the_lirenaras_description: "Трон Двойного Льва начинался как единый блок белого мрамора, который столетиями айярского правления превратился в роскошную демонстрацию их богатства. Золото было вплавлено прямо в камень, так что жилы металла проходили по его поверхности. Сиденье было покрыто эмалью зелёного и тёмно-синего цвета, подлокотники увенчаны резными хрустальными навершиями, ножки переделаны в львов, инкрустированных серебром, а на спинке закреплены гроздья изумрудов и рубинов, а над троном установлены полированные медные зеркала, чтобы лить солнечный свет на трон.\n\nСогласно легенде, именно на этом троне впервые воссела Шейарла после того, как одним ударом меча обезглавила Мусирайна, а затем повернулась к собравшейся толпе и пригласила их пировать на его личных запасах. С этого места она потребовала подчинения от наёмных капитанов и жителей Лон-Терика, чтобы осада была сломлена, начав тем самым своё завоевание региона."

 artifact_utyalid_poem_of_harthah_name: "Утьялидская поэма неизвестного происхождения"
 artifact_utyalid_poem_of_harthah_description: "Мы мчались с тобой, о Хартах,\nпод звёздами, что жгут пустынный прах.\nКопья наши в битве были едины,\nнкровь поила песок и лес — в одном краю.\n\nТы дал обет у дюн и луны,\nклялся, что долины станут нашими,\n\nисточники — нашими,\nи тень священных рощ — нашей.\n\nНо слово твоё — лишь миража обман.\nРощи не дали прохлады,\nисточник не утолил жажды,\nдолина пред шатрами нашими замкнулась.\n\nО, демон лживого языка,\nтвой голос сладок, как финиковый хмель.\nМы бросили имя твоё в пламя,\nи дым над барханами всё витает."

 artifact_crown_of_issai_name: "Корона Иссая"
 artifact_crown_of_issai_description: "Выкованная из чеканного золота и украшенная полосой тёмных сапфиров, эта корона была создана в годы после гражданской войны в [GetTitleByKey('k_marwaven').GetNameNoTier]. Её форма намеренно аскетична по сравнению с более ранними регалиями."

 artifact_letter_of_isaf_to_rushad_name: "Письмо Исафа к Рушаду"
 artifact_letter_of_isaf_to_rushad_description: "Рушад, их шкуры принесли лучшую цену, чем я рассчитывал, хотя соль всё ещё тяжело давит на мой кошелёк. Если дороги на юг останутся открытыми, я попробую добраться до [GetTitleByKey('b_derb_ej_jabbih').GetNameNoTier], но я не рискну вести туда слишком много скота.\n\nЯ слышал разговоры о [GetTitleByKey('c_el_qulatha').GetNameNoTier] снова. Один парень поклялся, что встретил человека, чей брат был там, когда город горел. Сказал, что камни раскололись, дым затянул небо так густо, что человек чуть не задохнулся. И Паршад Чёрный стоял над всем этим, раскинув руки, словно сам призвал этот огонь. Это все разговоры в каждой таверне, где я был, и люди плюются, произнося его имя.\n\nДороги на север становятся хуже с каждой неделей. Эти дикари с холмов осмеливаются нападать средь бела дня. Если хочешь отправить товары через меня, лучше присылай их побыстрее, пока есть ещё дорога, по которой можно идти."

 artifact_sword_of_yusuf_name: "Меч Юсуфа"
 artifact_sword_of_yusuf_description: "Длинный стальной клинок с позолоченной бронзовой рукоятью, носимый $mamur_yusuf_link$ Мамуром Юсуфом#! во время кампаний в [Glossary('Харадамат','kharadamat_encyclopedia_desc')]. Его навершие несёт несколько крупных зелёных изумрудов, подаренных айярскими лордами.\n\nГоворят, что у ворот [GetTitleByKey('b_hillaquah').GetNameNoTier], отказавшись сдаться, [Concept('ritualism','ритуалистский')|E] военачальник Сарухад вызвал Юсуфа на поединок. Этим мечом он сразил его на глазах у изумлённой толпы, которая, поражённая величием Юсуфа, обратилась к варденизму."

 artifact_uqtal_flute_name: "Уктальская флейта"
 artifact_uqtal_flute_description: "Костяная флейта, сделанная для того, чтобы её втыкали в песок вертикально, звуком отпугивая кусачих насекомых, встречающихся в некоторых регионах пустыни. Этот экземпляр необычайно замысловат, с вырезанными извилистыми узорами дюн и звёзд. Его происхождение неизвестно, хотя можно с уверенностью предположить, что она когда-то принадлежала вождю, ибо флейты этого типа обычно гораздо проще."

 artifact_yuaguag_scepter_name: "Ксебарский скипетр"
 artifact_yuaguag_scepter_description: "Золотой скипетр, который когда-то носили старые цари Шуб-Юагуаг. Его древко отлито из одного куска и украшено геометрическими полосами, головка увенчана цельным шаром с тремя рубинами. Захваченный агионистами во время [Concept('faghira_jalil_revolt','восстания Фагира и Джалиля')|E] и долгое время считавшийся утерянным, он был чудесным образом возвращён Умейром Мехдери и его братом во время отвоевания королевства Кудамаш."

 artifact_letter_el_qulatha_destruction_hulawite_name: "Письмо второстепенного хулавитского дворянина"
 artifact_letter_el_qulatha_destruction_hulawite_description: "И вот снова шакалы рычат у наших ворот, крича, что мы виноваты в Эль-Кулате. Я устал от их пустых ртов. Разве не их собственная безрассудность, их бесконечное пролитие крови, их магия, разрывающая мир на части, привели к Разрыву? Если нужно кого-то винить, то вина лежит на каждом дураке, поднявшем в тот день руку."