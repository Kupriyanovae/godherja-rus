 weapon_staff_inspiration_description: "посох"
 weapon_staff_inspiration_name: "посох"

 artifact_belar_seal_description: "Эта инкрустированная драгоценными камнями серебряная печать несёт эмблему [boqqarut_damotada|E], окружённую художественным изображением стены. Она использовалась во времена [belar_dynasty|E], её оттиск ставился на указы, такие как строительство Ирочи Дамотада, и хранилась потомками династии даже после их падения."
 artifact_belar_seal_name: "Печать Беларов"

 artifact_mesir_seal_description: "Эта бронзовая печать несёт изображение черепа с надписью «Единый правитель и единая цель». Она использовалась династией [mesir_dynasty|E], возможно, украшая такие указы, как [karururi_chorus|E] и само формирование [Concept('boqqarut_damotada','Боккарута')|E]."
 artifact_mesir_seal_name: "Печать Месиров"

 artifact_necklace_of_the_baarilka_description: "Это ожерелье было захвачено силами [boqqarut_damotada|E] около 500 года от И.С. у племени, которое они называли «Баарилка», или «Западные люди». После уничтожения его культуры-источника Адабиссом вскоре после приобретения, ожерелье теперь является, возможно, единственным материальным свидетельством ныне утерянного племени."
 artifact_necklace_of_the_baarilka_name: "Ожерелье Баарилка"

 artifact_olani_seal_description: "Эта золотая печать несёт эмблему [boqqarut_damotada|E] с надписью «Как Боккар и Кихине». Она использовалась во времена [olani_dynasty|E], и её оттиск ставился на такие важные указы, как создание [Concept('lodges','Орденов Раякуукс')|E] и формализация Голкавис."
 artifact_olani_seal_name: "Печать Олани"

 artifact_skull_of_kayoba_description: "Этот невзрачный череп, как полагают, принадлежал Боккару Кайобе, последнему правителю [zalreb_dynasty|E] и самого [Concept('boqqarut_damotada','Боккарута')|E]. Как и у каждого другого Боккара, его череп был магически сохранён после его смерти и должен был быть выставлен в [GetBuilding('01_tabik_betemisit').GetName]. Однако до этого не дошло: череп исчез, а Битва при Захали и начало [etami_tetenik|E] сделали все попытки найти его тщетными."
 artifact_skull_of_kayoba_name: "Череп Кайобы"

 artifact_spear_of_eshwo_description: "Этот наконечник копья с большим изумрудом, вставленным в головку, был оружием Эшво во время [war_of_songs|E]. Хотя, скорее всего, он никогда не использовался непосредственно в бою, это оружие является мощным символом, изображённым в бесчисленных произведениях дамотанского искусства в честь их легендарного основателя."
 artifact_spear_of_eshwo_name: "Копьё Эшво"

 artifact_zalreb_seal_description: "Эта довольно простая серебряная печать несёт эмблему [boqqarut_damotada|E] с копьями, окружающими знамя. Она использовалась во времена [zalreb_dynasty|E], её оттиск ставился на указы, такие как чистки Ралери и [ayule_expedition|E]."
 artifact_zalreb_seal_name: "Печать Залребов"

 artifact_abyssal_prism_name: "Бездонная призма"
 artifact_abyssal_prism_noncultist_desc: "Эта любопытная призма, кажется, задерживает весь свет внутри себя, и, глядя сквозь неё, не видно конца. Хотя она безобидна, её тревожащая природа создаёт впечатление, что она способна на невиданные разрушения..."
 artifact_abyssal_prism_cultist_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +100#!\nПоследний компонент, чтобы наконец исполнить волю наших тёмных повелителей. Окончательная Смерть Солнца уже близка...\n"
 artifact_sun_prism_name: "Заточенное солнце"
 artifact_sun_prism_desc: "Эта призма излучает непостижимую силу заточенного Солнца во всей его былой славе."

