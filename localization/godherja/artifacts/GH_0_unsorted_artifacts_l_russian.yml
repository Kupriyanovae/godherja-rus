 artifact_skullofanancient_desc: "Этот странный череп похож на человеческий, но содержит несколько отличий, которые явно указывают на то, что он... что-то иное. Будь то творческое произведение искусства или останки какого-то забытого существа, вы понятия не имеете, но магическая сила, излучаемая костью, неоспорима."
 artifact_skullofanancient_modifier: "Череп древнего"
 artifact_skullofanancient_name: "Череп древнего"
 artifact_skullofaxiaothea_desc: "Череп [axiaothea.GetName], овдовевшей жены Анесимасия, последнего аавтократа [Concept('aversaria','Аверсарии')|E] и заклятого врага Эшрея. Эшрей и Аксиотея прославились тем, что вели [Concept('imperial_civil_war','великую гражданскую войну')|E] по всей Аверсарии за контроль над империей, которая закончилась тем, что Эшрей выпустил [Concept('frodbrokna','Фродброкну')|E] и положил конец миру. Этот череп был обнаружен в руинах Асиуполя Горассом Собирателем Черепов, посланным Эшреем спустя годы, чтобы убедиться, что никто не остался в живых в укрытиях."
 artifact_skullofaxiaothea_modifier: "Череп Аксиотеи"
 artifact_skullofaxiaothea_name: "Череп [axiaothea.GetFirstName]"
 artifact_skullofduvaken_desc: "Череп [duvaken.GetFirstNameNicknamed], карзарадского вождя, который возглавил отряд своих соплеменников и сьялволкских добровольцев, чтобы выкроить себе владения в северной Опахасии. Хотя изначально он добился успеха, отчасти благодаря могучей [Concept('magic','магической')|E] способности Дувакена, он в конце концов был убит Горассом «Собирателем Черепов» в дуэли."
 artifact_skullofduvaken_modifier: "Череп Дувакена «Серебряного Глашатая»"
 artifact_skullofduvaken_name: "Череп [duvaken.GetFirstNameNicknamed]"
 artifact_skullofpridni_desc: "Череп [pridni.GetFirstNameNicknamed], аверсарианского военачальника и сына управляющего Анесимасия, последнего аавтократа Аверсарии. Придни выкроил обширное владение на большей части Этепезеи, Малькои и Опахасии, прежде чем был убит в бою Горассом «Собирателем Черепов». Смерть Придни вызвала великую гражданскую войну в его владениях, которую положили конец сьялволки, воспользовавшиеся ситуацией и вторгшиеся на его земли."
 artifact_skullofpridni_modifier: "Череп Придни «Младшего»"
 artifact_skullofpridni_name: "Череп [pridni.GetFirstNameNicknamed]"
 artifact_karthynskull_desc: "Этот череп принадлежал аверсарианскому военачальнику [Concept('karthyn_delenel','Деленелу')|E]. Известный своими кампаниями террора в Опахасии и Малькое, с помощью которых он удерживал восток под контролем своего сюзерена аавтократа Эшрея во время и после [Concept('imperial_civil_war','Имперской гражданской войны')|E] (наряду со своим не менее печально известным коллегой [Concept('demetros_detheniax','Деметрием Железным Шипом')|E]), этот череп мало что говорит об ужасающем облике, о котором рассказывают немногие выжившие после его резни.\n\nДеленел был смертельно ранен леганом Исацеей из Легиона XXI «Аксиотея» во время Вилнианского штурма, хотя он выжил достаточно долго, чтобы отступить на восток, в свои личные владения. Там, брошенный своими людьми и союзниками, его ученик Горасс вошёл под видом дружбы. Что произошло дальше, неизвестно, но известно, что Горасс зверски убил своего наставника, отрубил ему голову, изнасиловал и убил остатки его семьи и слуг, а затем сжёг поместье. Считается, что именно в этот момент Горасс дезертировал со службы Эшрею и стал править как независимый военачальник."
 artifact_karthynskull_modifier: "Череп Картина Деленела"
 artifact_karthynskull_modifier_desc: "Череп покойного Картина Деленела"
 artifact_karthynskull_name: "Череп [karthyn_delenel]"
 artifact_gh_tarfals_staff_name: "Посох Тарфала"
 artifact_gh_tarfals_staff_description: "Посох Тарфала — святейшая реликвия в религии Сепаттан, и им может владеть только глава жречества. Созданный Тарфалом, посох дарует своему владельцу долгую жизнь и наделяет его магической силой, позволяя ему вершить волю Богов-Близнецов, защищая наттананов от всех, кто угрожает их существованию."
 legendary_nattanan_spear: "Копьё Тура Мьинтейн"
 legendary_nattanan_spear_desc: "Это священное копьё, как говорят, было создано Богами-Близнецами, чтобы наделить силой их чемпиона, Тура Мьинтейн, легендарного защитника Священной Рощи. Благословлённое духами природы, оно несёт силу пронзать порчу и приносить равновесие в расколотый мир. Его присутствие вдохновляет на храбрость и вселяет страх в сердца недостойных."
 artifact_gh_jerniems_bow_name: "Лук Йернейма"
 artifact_gh_jerniems_bow_description: "Лук бога охоты Йернейма — оружие невероятной силы, которое дарует владельцу скорость и скрытность самого бога охоты. Лук Йернейма может быть использован только самыми свирепыми и достойными воинами наттананов. На протяжении веков вожди наттананов использовали лук, чтобы переломить ход битвы против ольтенских отрядов и других врагов, стремящихся уничтожить образ жизни наттананов."
 artifact_pale_rider_mask_name: "Маска Бледного Всадника"
 artifact_pale_rider_mask_desc: "Выкованная из выбеленных костей павшего ольтенского хана и испещрённая рунами школы Жулвирах, Маска Бледного Всадника является священной реликвией вечного владычества Аккарадхаммы. Когда её надевают, она окутывает носителя призрачной аурой, даруя видения эфирного плана и власть повелевать беспокойными тенями, а также вселяет ужас в сердца врагов своим смертоносным обликом."
 artifact_gh_spear_of_korlacu_name: "Копьё Корлаку"
 artifact_gh_spear_of_korlacu_description: "Копьё Корлаку — могущественный артефакт, который, как говорят, пульсирует ярким, переливающимся светом такой силы, что смотреть непосредственно на рубиновый камень, вставленный чуть ниже наконечника копья, крайне не рекомендуется, так как известно, что он ослепляет тех, кто смотрит слишком пристально. Само копьё, как говорят, горячее на ощупь, и ходят слухи, что оно обладает разрушительной энергией тысячи солнц, что делает копьё способным поджечь любой материал на [Concept('aeras','Эрасе')|E]."
 artifact_adekaday_battle_desc: "Выкованное легендарным кузнецом [newly_created_artifact.MakeScope.Var('blade_forger').Char.GetFirstNameNicknamed], Адекадай, или Смертостраж, — знаменитый меч банвагульского военачальника [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFirstName|E]. Хотя сам по себе он не зачарован, клинок изготовлен из редкого сплава бронзы и [Concept('zhaen','чжэня')|E], что придаёт ему сверхъестественную остроту, а также любопытное свойство — давать жизненную силу своему владельцу. Налайкан носил этот меч до самой своей смерти во время [Concept('ratarakaw','Ратаракавы')|E], после чего меч перешёл в руки [newly_created_artifact.MakeScope.Var('current_bearer').Char.GetTitledFirstName], единственного выжившего после катастрофы."
 artifact_adekaday_desc: "Выкованное легендарным кузнецом Дахасаем «Бронзовым Певцом», Адекадай — знаменитый меч банвагульского военачальника Налайкана. Хотя сам по себе он не зачарован, клинок изготовлен из редкого сплава бронзы и [Concept('zhaen','чжэня')|E], что придаёт ему сверхъестественную остроту, а также любопытное свойство — давать жизненную силу своему владельцу."
 artifact_adekaday_name: "Адекадай"
 artifact_kenaranek_battle_desc: "Легендарное копьё [nari_daya|E], Кенаранек, или «Чёрный Терновник», считается одним из главных символов власти правителей Вехангуна. Его клинок, состоящий из чужеродного чёрного металла, прикреплён к древку, выкованному из чистой усиленной бронзы, что делает оружие слишком тяжёлым для любого, у кого нет достаточной силы.\n\nКопьё также обладает необычным свойством становиться невероятно тяжёлым, когда его держит не женщина, — заклинание, якобы наложенное на него самой [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetTitledFirstName]. Однако те, кому удаётся использовать оружие, сообщают, что острота и сила копья не имеют себе равных, и говорят, что один удар может пробить даже самые толстые стены замка."
 artifact_kenaranek_desc: "Легендарное копьё [nari_daya|E], Кенаранек, или «Чёрный Терновник», считается одним из главных символов власти правителей Вехангуна. Его клинок, состоящий из чужеродного чёрного металла, прикреплён к древку, выкованному из чистой усиленной бронзы, что делает оружие слишком тяжёлым для любого, у кого нет достаточной силы.\n\nКопьё также обладает необычным свойством становиться невероятно тяжёлым, когда его держит не женщина, — заклинание, якобы наложенное на него самой Нари Дайей. Однако те, кому удаётся использовать оружие, сообщают, что острота и сила копья не имеют себе равных, и говорят, что один удар может пробить даже самые толстые стены замка."
 artifact_kenaranek_name: "Кенаранек"
 artifact_kedatals_talon_battle_desc: "Странный на вид инструмент из нефрита и эбенового дерева, этот клинок используется не для боя, а для нанесения зачарованных чернил Кедари на кожу. Созданный знаменитым [Concept('magi','магом')|E] [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFirstName|E], татуировки, сделанные с помощью этого когтя, как утверждается, не только более яркие, но и более могущественные."
 artifact_kedatals_talon_desc: "Странный на вид инструмент из нефрита и эбенового дерева, этот клинок используется не для боя, а для нанесения зачарованных чернил Кедари на кожу. Созданный знаменитым [Concept('magi','магом')|E] Хабви, татуировки, сделанные с помощью этого когтя, как утверждается, не только более яркие, но и более могущественные."
 artifact_kedatals_talon_name: "Коготь Кедаталя"
 artifact_wave_breaker_battle_desc: "Выкованный целиком из [Concept('zhaen','чжэня')|E], Волнолом является первым из Саньчжэнь Цзитянь (Трёх Бронзовых Чудес), созданных легендарным кузнецом Цзы Ауяном. Заряженный аспектом [aspect_water], клинок светится мистическим синим светом, и его лезвие удивительно холодное на ощупь.\n\nМечом, как известно, владеет влиятельный клан Цзяцзяо, особенно его знаменитый верховный старейшина, Цзяцзяо [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFirstName]. Легенда гласит, что именно этим клинком Ксангли рассек огромную приливную волну, вызванную Раем Анжи, чтобы уничтожить флот коалиции во время Вердигрисового инцидента, и тем самым возвестил начало правления Лаконга над [Concept('bureau_bronzeport','Бронзовой гаванью')|E]."
 artifact_wave_breaker_desc: "Выкованный целиком из [Concept('zhaen','чжэня')|E], Волнолом является первым из Саньчжэнь Цзитянь (Трёх Бронзовых Чудес), созданных легендарным кузнецом Цзы Ауяном. Заряженный аспектом [aspect_water], клинок светится мистическим синим светом, и его лезвие удивительно холодное на ощупь."
 artifact_wave_breaker_name: "Волнолом"
 artifact_thunderhoofs_roar_battle_desc: "Третье и последнее произведение Саньчжэнь Цзитянь (Трёх Бронзовых Чудес), выкованных Цзы Ауяном, Рёв Громового Копыта — это великолепное змеевидное копьё, целиком — и лезвие, и древко — изготовленное из [Concept('zhaen','чжэня')|E]. Несмотря на то, что оно сделано из чистого металла, копьё удивительно лёгкое, а его удары предваряются трескучим звуком, напоминающим гром.\n\nПервоначально принадлежавшее клану Цзяцзяо, копьё было украдено пиратами во время печально известного разграбления Бронзовой гавани, а его владелец, верховный министр Цзяцзяо [newly_created_artifact.MakeScope.Var('original_wielder').Char.GetFirstName], был пронзён собственным оружием. Рёв Громового Копыта в конце концов был завоёван после легендарной дуэли с пиратским лордом Сингда великим адмиралом Лихиджином [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFirstName], который впоследствии использовал его, чтобы выдвинуть — и обеспечить — свои притязания на правление [Concept('bureau_bronzeport','Бронзовой гаванью')|E]."
 artifact_thunderhoofs_roar_desc: "Третье и последнее произведение Саньчжэнь Цзитянь (Трёх Бронзовых Чудес), выкованных Цзы Ауяном, Рёв Громового Копыта — это великолепное змеевидное копьё, целиком — и лезвие, и древко — изготовленное из [Concept('zhaen','чжэня')|E]. Несмотря на то, что оно сделано из чистого металла, копьё удивительно лёгкое, а его удары предваряются трескучим звуком, напоминающим гром."
 artifact_thunderhoofs_roar_name: "Рёв Громового Копыта"
 artifact_fireclaw_battle_desc: "Второе из Саньчжэнь Цзитянь (Трёх Бронзовых Чудес), выкованных Цзы Ауяном, Огненный Коготь — это пара наручей из [Concept('zhaen','чжэня')|E], инкрустированных кровавыми рубинами. Наделённые аспектом [aspect_fire], наручи сжигают всё, чего касаются, но их владелец остаётся нечувствительным к жару.\n\nПерейдя к клану Цзяцзяо, Огненный Коготь был подарен верховным министром Цзяцзяо [newly_created_artifact.MakeScope.Var('bestower').Char.GetFirstName] воину Шифази [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFirstName] за его службу в усмирении пиратской королевы Веллатолы. Наручи остались реликвией дома Шифази и постоянно использовались на службе [Concept('bureau_bronzeport','Бронзовой гавани')|E], наиболее известным образом — знаменитым воином [newly_created_artifact.MakeScope.Var('second_wielder').Char.GetFirstNameNicknamed]."
 artifact_fireclaw_desc: "Второе из Саньчжэнь Цзитянь (Трёх Бронзовых Чудес), выкованных Цзы Ауяном, Огненный Коготь — это пара наручей из [Concept('zhaen','чжэня')|E], инкрустированных кровавыми рубинами. Наделённые аспектом [aspect_fire], наручи сжигают всё, чего касаются, но их владелец остаётся нечувствительным к жару."
 artifact_fireclaw_name: "Огненный Коготь"
 artifact_myrnish_map_battle_desc: "Созданная знаменитым картографом Оллосом из Мирны, эта зачарованная карта изображает регион, известный как [Concept('aversaria','аверсарианские')|E] Родовые земли. Горы, реки, замки и даже сами люди в этом районе изображены с предельной детализацией, что делает артефакт бесценным инструментом для разведки."
 artifact_myrnish_map_desc: "Созданная знаменитым картографом Оллосом из Мирны, эта зачарованная карта изображает регион, известный как [Concept('aversaria','аверсарианские')|E] Родовые земли. Горы, реки, замки и даже сами люди в этом районе показаны с предельной детализацией, что делает артефакт бесценным инструментом для разведки."
 artifact_myrnish_map_name: "Мирнская карта № 5"
 artifact_acolytes_confidant_battle_desc: "Сделанный из чистого тейссианского серебра с инкрустированным кровавым кристаллом, «Наперсник послушника» — это кольцо, которое обычно дают всем новым послушникам [Concept('mayikrata','Майикратии')|E].\n\nХотя оно служит в первую очередь знаком престижа и идентификации, кольцо также зачаровано магической защитой, которая бесценна против арканных последствий неудачного эксперимента — или, возможно, враждебных заклинаний, насланных соперниками-послушниками.\n\nПоследующая нехватка тейссианского серебра привела к тому, что кольцо стало всё более редким, и к XII веку от И.С. оно предназначено исключительно для десяти лучших [Concept('magi','магов')|E]-послушников в рейтинге."
 artifact_acolytes_confidant_desc: "Сделанный из чистого тейссианского серебра с инкрустированным кровавым кристаллом, «Наперсник послушника» — это кольцо, которое обычно дают всем новым послушникам [Concept('mayikrata','Майикратии')|E].\n\nХотя оно служит в первую очередь знаком престижа и идентификации, кольцо также зачаровано магической защитой, которая бесценна против арканных последствий неудачного эксперимента — или, возможно, враждебных заклинаний, насланных соперниками-послушниками.\n\nПоследующая нехватка тейссианского серебра привела к тому, что кольцо стало всё более редким, и к XII веку от И.С. оно предназначено исключительно для десяти лучших [Concept('magi','магов')|E]-послушников в рейтинге."
 artifact_acolytes_confidant_name: "Наперсник послушника"
 artifact_sword_of_soter_name: "Меч Сотера"
 artifact_sword_of_soter_desc: "Таинственный меч из тёмного металла, мастерски выкованный. Рукоять украшена изящной золотой филигранью, а на клинке выгравирован рельеф символов, значение которых известно только создателю. Конфискованный из храма Сотера-Непобедимого в [GetTitleByKey('b_imbraieus').GetNameNoTier] аавтократом Маклеей в 253 году от И.С., этот клинок стал государственным мечом [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] на следующую тысячу лет; хотя примечательно, что он был утерян [Concept('kartharadd','картараддцами')|E] после гибели аавтократа Кетемода в битве и бесследно исчез после [night_of_the_bleeding_moon|E], но чудесным образом был вновь обнаружен аавтократом Тейссией в 792 году от И.С."
 artifact_tarthailar_sceptre_name: "Скипетр Тартайлара"
 artifact_tarthailar_sceptre_desc: "[SCOPE.Custom('ArtifactArticleWealth')|U] позолоченный скипетр из яблоневого дерева [SCOPE.Custom('ArtifactQuality')] качества, увенчанный золотым персиком. Он примечателен тем, что последовательно использовался древними царицами [GetTitleByKey('k_cornucopia').GetBaseNameNoTier], этрандексийскими королями Бастонпорта и ранними [Concept('aversaria','аверсарианскими')|E] губернаторами Мегос Калатипсоми."
 artifact_honey_orb_name: "Медовая сфера"
 artifact_honey_orb_desc: "Весьма нетрадиционная гадательная сфера спорного происхождения; этот липкий золотой шар, по-видимому, способен давать только оптимистичные и счастливые видения будущего, часто вводящие в заблуждение."
 artifact_beekeepers_wand_name: "Жезл пчеловода"
 artifact_beekeepers_wand_desc: "Жезл [SCOPE.Custom('ArtifactQuality')] качества. Он инкрустирован светящимися руническими заклинаниями и лишён какого-либо фокуса на наконечнике. Он способен привлекать и управлять роями пчёл, что полезно как для сельского хозяйства, так и для боевых целей. Все, кто соприкасается с этим предметом, чувствуют сладкий привкус, покрывающий зубы."
 artifact_maethroxian_water_mirror_name: "Метроксианское водяное зеркало"
 artifact_maethroxian_water_mirror_desc: "Зеркало [SCOPE.Custom('ArtifactQuality')] качества, в котором в качестве отражающей поверхности используется тонкая плёнка магически подвешенной воды. Его рама изготовлена из дуба. Древесина отшлифована до гладкости. Любой, кто смотрит в него, видит более красивое отражение себя."
 artifact_fur_tuft_old_cubozoid_name: "Пучок шерсти [Glossary( 'Старого Кубазоида', 'OLD_CUBOZOID_GLOSS' )]"
 artifact_fur_tuft_old_cubozoid_desc: "Невидимый, пушистый пучок шерсти легендарного [Glossary( 'Старого Кубазоида', 'OLD_CUBOZOID_GLOSS' )]."
 artifact_cloak_wilderking_shedding_name: "Сброшенный плащ [Glossary( 'Дикого Короля', 'WILDERKING_GLOSS' )] ([Localize(newly_created_artifact.MakeScope.Var('wilderking_shedding_type').GetFlagName)|U])"
 artifact_cloak_wilderking_shedding_desc: "Плащ, сделанный из сброшенной шкуры [Localize(newly_created_artifact.MakeScope.Var('wilderking_shedding_type').GetFlagName)] легендарного [Glossary( 'Дикого Короля', 'WILDERKING_GLOSS' )]."
 artifact_cloak_wilderking_true_name: "Истинный плащ [Glossary( 'Дикого Короля', 'WILDERKING_GLOSS' )]"
 artifact_cloak_wilderking_true_desc: "Сновидческий, меняющийся плащ, сделанный из истинной кожи [Glossary( 'Дикого Короля', 'WILDERKING_GLOSS' )], который дарует часть былой силы существа."
 artifact_fairyqueen_lantern_extinguished_name: "Погасший фонарь [Glossary( 'Королевы Фей', 'FAIRYQUEEN_GLOSS' )]"
 artifact_fairyqueen_lantern_extinguished_desc: "Похожее на фонарь арканное устройство, которое когда-то содержало [Glossary( 'Королеву Фей', 'FAIRYQUEEN_GLOSS' )]. Сырая [magic|E] сила духа всё ещё бурлит внутри, хотя она запятнана разлагающей магией, а разум, стоящий за ней, давно умер."
 artifact_rose_of_themetea_name: "Роза Теметеи"
 artifact_rose_of_themetea_desc: "Всё вблизи этого завораживающе красивого цветка увядает, и он печально известен тем, что привёл к гибели губернаторши Калатипсоми после долгих лет украшения её волос."
 artifact_aedean_amulet_name: "Амулет Эдеана «Злого Глаза»"
 artifact_aedean_amulet_desc: "Замысловатое, но изящное ожерелье мастерской работы. Ожерелье выковано из неизвестного металла и имеет рунический кулон. Когда-то оно принадлежало печально известному колдуну, известному как [Glossary( 'Эдеан', 'AEDEAN_GLOSS' )], и до сих пор хранит угрожающую силу."
 artifact_sword_pathos_name: "Меч аавтократа Патоса"
 artifact_sword_pathos_desc: "Меч из магической стали мастерской работы. Навершие выполнено в виде ряда округлых долей и инкрустировано драконьей костью. Это был меч, который аавтократ Патос носил с собой во время завоевания Калатипсоми, прежде чем потерял его в ручье во время битвы у Старой Мельницы, о чём сожалел много раз до конца своей жизни."
 artifact_sword_marcomer_name: "Меч Верховного короля Маркомера"
 artifact_sword_marcomer_desc: "Меч из кованого железа мастерской работы. Клинок испещрён арканными рунами и имеет меняющуюся, волнистую текстуру, похожую на нахождение под водой. Это был меч Верховного короля Маркомера из Предела, хотя он был реликвией его династии задолго до него. Его происхождение оспаривается, хотя, согласно большинству легенд, он был подарен одному из предков Маркомера водяной нимфой, хотя некоторые истории также утверждают, что он был украден."
 artifact_sword_mornegeu_name: "Меч Морнегё"
 artifact_sword_mornegeu_desc: "Меч из кованого железа мастерской работы. Рукоять украшена изящной золотой филигранью, а на клинке выгравирован рельеф мифологических зверей.\n\nНа его боку красуется крошечная, но элегантная надпись, посвящающая его «Моей Возлюбленной, $mornegeu_link$ Морнегё#!»."
 artifact_spear_malkhandor_name: "Копьё Малхандора"
 artifact_spear_malkhandor_desc: "Длинное копьё мастерской работы. Наконечник из чёрного драгоценного камня укреплён на элегантном древке из магической стали, которое вырезано изящными волнами для уменьшения скольжения при использовании. Это копьё было одним из самых ценных владений и могущественных видов оружия крепости Этилисиак Малхандор и сыграло важную роль в защите города от Пасти Глубин во время её древнего буйства. Гораздо позже, во время [Glossary('Войны Чёрного Тиса', 'WAR_OF_THE_BLACK_YEW_GLOSS')], оно было извлечено из руин Малхандора и использовано для уничтожения [GetBuilding('01_fidhasil').GetName], положив конец её пророческому циклу раз и навсегда."
 metal_magi_steel: "Магическая сталь"
 feature_blade_metal_magi_steel: "$metal_magi_steel$"
 feature_head_metal_magi_steel: "$metal_magi_steel$"
 feature_handle_metal_magi_steel: "$metal_magi_steel$"
 feature_decoration_pattern_dragon: "драконы"
 feature_decoration_pattern_blood_drops: "капли крови"
 feature_blade_magi_steel: "магическая сталь"
 artifact_gauntlet: "Наручи"
 artifact_terroxian_manifesto_desc: "Насчитывая почти двести страниц, следующая манифестация является магически созданной копией [Glossary('Имперского Эдикта-Манифеста','GH_TERROXIAN_IMPERIAL_EDICT_MANIFESTO_GLOSS')] архимага Террокса из [mayikrata|E]. В нём содержатся его всё более бессвязные бредни о чистоте и месте [magi|E] в мире, перемежающиеся здесь и там заявлениями о восхищении некой «Аксиотеей», прежде чем наконец завершаться плохо пунктуированным призывом к давно заслуженной независимости Майикратии."
 artifact_terroxian_manifesto_name: "Терроксианский манифест"
