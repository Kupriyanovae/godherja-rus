 artifact_staff: "Посох"
 artifact_staff_amsari_description: "Простой, узловатый деревянный посох, который когда-то принадлежал Пророку амсари. Разумеется, этот объект несёт огромную историческую и религиозную ценность — редко встречается искусство, изображающее Пророка, где он не держит свой знаковый посох, и последующие поколения его паствы позаботились о том, чтобы он был залакирован и сохранён в безупречном состоянии."
 artifact_staff_amsari_name: "Посох Пророка"

 artifact_staff_description: "Посох [SCOPE.Custom('ArtifactQuality')] качества. Он [newly_created_artifact.GetFeatureText( 'staff_decoration' )] и [newly_created_artifact.Custom('ArtifactStaffFocusCharacteristic')].\n\n$artifact_staff_explanation$"
 artifact_staff_explanation: "Многие [magi|E] получают пользу от использования фокуса для своей магии, такого как посох, который либо заряжается магической силой его пользователем, либо делается из материалов, из которых пользователь может черпать силу."
 artifact_staff_name: "$artifact_name_prefix$ [newly_created_artifact.GetFeatureText( 'staff_characteristic' )|U] [newly_created_artifact.GetFeatureText( 'staff_material' )] Посох"

 ## Unique Artifacts
 artifact_spear_thaxaon_name: "Копьё Таксаона"
 artifact_spear_thaxaon_desc: "Внушительное эбеновое копьё с большой инкрустированной [bloodcrystal|E], это оружие было реликвией династии [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetHouse.GetName], крупного западного аверсарианского дворянского дома."
 artifact_spear_thaxaon_jaxor_desc: "Внушительное эбеновое копьё с большой инкрустированной [bloodcrystal|E], это оружие было реликвией династии [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetHouse.GetName], крупного западного аверсарианского дворянского дома. Среди его наиболее известных владельцев — претендент-аавтократ [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFirstNameNicknamed], который возглавил масштабное [Concept('thaxaonic_blood_pact','Восстание Таксаонского кровавого пакта')|E] против Эшрея в непосредственной близости от [frodbrokna|E]."

 artifact_staffofkatharitos_desc: "#size:15 Посох святого Катаритоса, агионистского святого, который поднялся вместе с семью другими, чтобы проповедовать лучшую [Concept('aversaria','Аверсарию')|E]. Хотя Катаритос, к сожалению, умер в своих усилиях, его послание и его бесконечные изречения живы, и его последователи до сих пор почитают его мудрые слова."
 artifact_staffofkatharitos_modifier: "Посох Катаритоса"
 artifact_staffofkatharitos_modifier_desc: "#E Магия#!:@magic_icon!#positive_value; +4#!/месяц"
 artifact_staffofkatharitos_name: "Посох Катаритоса"

 artifact_staffofthewizardking_desc: "#size:15 Этот зазубренный чёрный посох украшен несколькими красными камнями, которые, кажется, пульсируют и светятся в такт сердцебиению того, кто его держит. Хотя несколько из них отсутствуют, посох всё ещё излучает ауру ненависти и силы. Вопросы о том, что такое «волшебник» и кто был их королём, останутся, как вы полагаете, без ответа."
 artifact_staffofthewizardking_modifier: "Посох Короля-волшебника"
 artifact_staffofthewizardking_modifier_desc: "#E Магия#!:@magic_icon!#positive_value; +6#!/месяц"
 artifact_staffofthewizardking_name: "Посох Короля-волшебника"

 artifact_standardofanoterion_desc: "#size:15 Бело-красный штандарт Легиона LXI был поднят повсюду, от высочайших гор Калатипсоми до края великой реки на далёком востоке. Хотя легион, который он представляет, был уничтожен дважды в своей истории, штандарт всегда выживал, чтобы вдохновлять его следующее поколение."
 artifact_standardofanoterion_modifier: "Штандарт Легиона LXI"
 artifact_standardofanoterion_name: "Штандарт Легиона LXI"

 artifact_strangetalkingskull_desc: "#size:15 Этот череп, кажется, довольно зол на своё положение. Называя себя [vilas_venslau|E], он проклинает вас на множестве языков и утверждает, что как только у него будут руки, чтобы это сделать, он уничтожит вас.\n\nКакая забавная игрушка для вечеринок!"
 artifact_strangetalkingskull_modifier: "Странный говорящий череп"
 artifact_strangetalkingskull_name: "Странный говорящий череп"

 artifact_sun_piercer_battle_desc: "Легендарное копьё героев и чемпионов, Пронзатель Солнца выкован из неизвестного чёрного материала, обладающего необычным свойством поглощать как свет, так и пламя. Необычная форма оружия делает его трудным в использовании для всех, кроме самых искусных воинов, но его почти неразрушимость делает его стоящим в любом бою.\n\nЭто копьё было прославлено тем, что им владел [Concept('marchers','шевальенский')|E] герой сэр [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFirstNameNicknamed] с Озёр, который использовал его, чтобы убить ужасного [Concept('liches','лича')|E] [newly_created_artifact.MakeScope.Var('prominent_foe').Char.GetFirstNameNicknamed]."
 artifact_sun_piercer_desc: "Легендарное копьё героев и чемпионов, Пронзатель Солнца выкован из неизвестного чёрного материала, обладающего необычным свойством поглощать как свет, так и пламя. Необычная форма оружия делает его трудным в использовании для всех, кроме самых искусных воинов, но его почти неразрушимость делает его стоящим в любом бою."
 artifact_sun_piercer_name: "Пронзатель Солнца"

 artifact_black_legion_standard_battle_desc: "Это потёртое и выцветшее знамя изображает эмблему одного из Чёрных Легионов Катраддии — известных своим чёрным вооружением и мастерством в бою. Большая часть Чёрных Легионов была потеряна в различных войнах, сотрясавших начало XIII века, и немногие выжившие присоединились к губернатору [newly_created_artifact.MakeScope.Var('governor_ioldon').Char.GetFirstNameNicknamed] в его походе на юг — а позже и к его сыну, [newly_created_artifact.MakeScope.Var('black_sun').Char.GetFirstNameNicknamed]."
 artifact_black_legion_standard_desc: "Это знамя изображает эмблему одного из Чёрных Легионов Катраддии — известных своим чёрным вооружением и мастерством в бою."
 artifact_black_legion_standard_name: "Штандарт Чёрного Легиона"

 artifact_black_gold_standard_battle_desc: "Этот пыльный кусок ткани изображает объединённые эмблемы домов Монто и Валадек — ведущих домов печально известной Лиги Чёрного Золота, союза восточных [Concept('marchers','шевальенских')|E] лордов, объединившихся, чтобы возвести [newly_created_artifact.MakeScope.Var('teryn_valadec').Char.GetFirstNameNicknamed] на трон Шевалье после таинственной смерти Верховного короля [newly_created_artifact.MakeScope.Var('high_king_dendon').Char.GetFirstNameNicknamed]. Так называемая [black_gold_war|E] закончилась полным поражением Лиги, оставив лишь сожаления тем, кто взирал на это некогда гордое знамя."
 artifact_black_gold_standard_desc: "Это знамя изображает объединённые эмблемы домов Монто и Валадек — ведущих домов печально известной Лиги Чёрного Золота."
 artifact_black_gold_standard_name: "Штандарт Лиги Чёрного Золота"

 artifact_staff_of_the_high_seer_desc: "Вырезанный из упавшей ветви Драйоганн Дтохт, Мирового древа, этот посох передаётся через несколько поколений партикских Верховных провидцев. К посоху прикреплён хрустальный шар, окрашенный кроваво-красным соком Мирового древа, усиливающий способность владельца к колдовству [aspect_nature] и [aspect_blood]. Наступление [Concept('the_fog','Тумана')|E] и затуманивание Воли Мира несколько ослабили силу посоха, но любопытным образом также наделили его новой близостью к [aspect_ethereal] магии."
 artifact_staff_of_the_high_seer_name: "Посох Верховного провидца"

 artifact_bane_star_ring_battle_desc: "Выточенный из прочного обсидиана, этот перстень получил своё название в честь его знаменитого владельца, [newly_created_artifact.MakeScope.Var('ring_bearer').Char.GetFirstNameNicknamed]. В качестве камня в перстне — бледно-зелёный осколок [Concept('aervalr','звезды')|E], упавшей во время рождения Элдрада. Хотя нет историй о том, что его владелец когда-либо совершал арканные подвиги с этим кольцом, его подданные шепчут, что оно излучает ауру ужаса и может принести великую силу, если его наденут нужные руки."
 artifact_bane_star_ring_desc: "Выточенный из прочного обсидиана, этот перстень получил своё название в честь его знаменитого владельца, Элдрада Погибельной Звезды. В качестве камня в перстне — бледно-зелёный осколок [Concept('aervalr','звезды')|E], упавшей во время рождения Элдрада. Хотя нет историй о том, что его владелец когда-либо совершал арканные подвиги с этим кольцом, его подданные шепчут, что оно излучает ауру ужаса и может принести великую силу, если его наденут нужные руки."
 artifact_bane_star_ring_name: "Перстень Погибельной Звезды"

 artifact_swordofeos_battle_desc: "Легендарный меч святого [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFirstName], агионистского святого, который поднялся вместе с семью другими, чтобы проповедовать лучшую [Concept('aversaria','Аверсарию')|E]. Эос украл этот меч из арсенала Ордена Партикуляр и использовал его, чтобы убить [Concept('liches','лича')|E] [newly_created_artifact.MakeScope.Var('prominent_foe').Char.GetFullName], после чего клинок был дарован ему в награду.\n\nМеч Эоса считался утерянным после его смерти при осаде Геки, но теперь он здесь. При каждом взмахе вырываются языки пламени, и вы можете видеть праведную ярость в каждой искре."
 artifact_swordofeos_desc: "Легендарный меч святого Эоса, агионистского святого, который поднялся вместе с семью другими, чтобы проповедовать лучшую [Concept('aversaria','Аверсарию')|E]. Меч Эоса считался утерянным после его смерти при осаде Геки, но теперь он здесь. При каждом взмахе вырываются языки пламени, и вы можете видеть праведную ярость в каждой искре."
 artifact_swordofeos_modifier: "Меч Эоса"
 artifact_swordofeos_name: "Меч Эоса"
 artifact_theiyrossicrown_desc: "Корона царя Потаклея, последнего царя ийроссов. Хотя он был лишь одним из многих королей, его последняя битва и легендарная партизанская война против [Concept('aversaria','аверсарианцев')|E] закрепили за ним в истории звание «Последнего ийросса»."
 artifact_theiyrossicrown_modifier: "Корона ийроссов"
 artifact_theiyrossicrown_name: "Корона последнего ийросса"
 artifact_vorpal_blade_desc: "Ворпальные мечи — древние зачарованные клинки, способные проходить сквозь что угодно, включая стены, доспехи и даже сам мир. Единственное, что мешает им пройти сквозь землю под ногами, — это гарда, на которой они закреплены.\n\nДревний тайник с примерно шестью тысячами мечей был впервые обнаружен [Concept('marchers','марочникскими')|E] авантюристами в Калатипсоми около 550 года от И.С., что немедленно вызвало небольшую войну, поскольку многочисленные фракции — включая первых [Concept('aversaria','аверсарианских')|E] колонистов в этом регионе — боролись за контроль над этими чудесными вооружениями. В последовавшем конфликте авантюристы, вооружившиеся этими клинками, были перебиты почти до последнего человека, поскольку выяснилось, что мечи безвредно проходят сквозь всё... включая плоть.\n\nНа протяжении веков ворпальные клинки распространялись повсюду как простые любопытные безделушки, ценимые только театральными труппами и мошенниками, и возникло множество идиом, сказок на ночь и шуток вокруг фразы «Резать, как ворпал»."
 artifact_vorpal_blade_name: "Ворпальный клинок"
 artifact_useless_sword: "Бесполезный меч"
 artifact_whisperingskull_desc: "Никто не знает происхождения этого странного черепа, но вы можете поклясться, что когда вы остаётесь с ним наедине в темноте, он шепчет вам. Некоторые из этих шепотов довольно интересны, череп замечает многие секреты, которые некоторые хотели бы скрыть."
 artifact_whisperingskull_modifier: "Шепчущий череп"
 artifact_whisperingskull_name: "Шепчущий череп"
 artifact_wall_sword_wardenism_description: "Элегантный реликварий, содержащий святую реликвию: меч [Concept('the_first_warden','Первого Вардена')|E]."
 artifact_wall_sword_wardenism_name: "Меч Первого Вардена"
 artifact_maskofforgottensaint_desc: "Легендарная маска Забытого Святого, агионистского святого, который поднялся вместе с семью другими, чтобы проповедовать лучшую [Concept('aversaria','Аверсарию')|E]. Простая металлическая маска Забытого Святого кажется намного тяжелее, чем можно было бы ожидать, а на внутренней стороне, кажется, есть несколько светящихся защитных рун, тщательно вырезанных на поверхности."
 artifact_maskofforgottensaint_modifier: "Маска Забытого Святого"
 artifact_maskofforgottensaint_name: "Маска Забытого Святого"
 artifact_panickedeye_desc: "На этом амулете находится один глаз, зрачок которого постоянно мечется по комнате, словно боясь того, что может увидеть. Если прижать амулет к своему глазу, можно поклясться, что почти видишь Их тоже... наблюдающих из теней, которые лучше оставлять пустыми."
 artifact_panickedeye_modifier: "Амулет панического глаза"
 artifact_panickedeye_name: "Амулет панического глаза"
 artifact_peytonsbonecracker_battle_desc: "Путеводный отец [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFullName] с Пути Жатвы объявил, что ни одна жатва не может быть собрана в безопасности, пока нежить всё ещё «живёт», и что костная мука творит чудеса с посевами, и поэтому объявил, что лучший способ совершенствовать свой Путь — это уничтожение нежити. Пейтон стал легендой благодаря своим вылазкам в [the_lichdoms|E], даже убив [Concept('liches','лича')|E] [newly_created_artifact.MakeScope.Var('prominent_foe').Char.GetFullName] при штурме его цитадели, потеряв всего 566 человек из 570 в своём отряде. Его булава до сих пор имеет небольшие борозды, без сомнения, появившиеся от четырёх десятилетий ударов по скелетам."
 artifact_peytonsbonecracker_desc: "Путеводный отец Пейтон с Пути Жатвы объявил, что ни одна жатва не может быть собрана в безопасности, пока нежить всё ещё «живёт», и что костная мука творит чудеса с посевами, и поэтому объявил, что лучший способ совершенствовать свой Путь — это уничтожение нежити. Пейтон стал легендой благодаря своим вылазкам в [the_lichdoms|E], даже убив [Concept('liches','лича')|E] Красмера Красвира при штурме его цитадели, потеряв всего 566 человек из 570 в своём отряде. Его булава до сих пор имеет небольшие борозды, без сомнения, появившиеся от четырёх десятилетий ударов по скелетам."
 artifact_peytonsbonecracker_modifier: "Костолом Путеводного отца Пейтона"
 artifact_peytonsbonecracker_modifier_desc: "Простая булава, использовавшаяся для убийства множества нежити"
 artifact_peytonsbonecracker_name: "Костолом Путеводного отца Пейтона"
 artifact_rehdyia_uddayir_spear_description: "Хотя теперь она заржавела, лишилась рукояти и давно утратила свою магию, это наконечник копья, который легендарная мечница-чародейка — а впоследствии и царица [Concept('sarradon','Саррадона')|E] — Рехдия Уддайир вонзила в колоссальный чёрный глаз [Concept('the_worldeater','Пожирателя миров')|E], нанеся смертельный удар чудовищному зверю, который едва не положил конец всей цивилизации на континенте и за его пределами."
 artifact_rehdyia_uddayir_spear_name: "Копьё Рехдии Уддайир"
 artifact_ringofthelich_desc: "Истекая тёмной магией, это кольцо было надето на костлявый палец многих архиличей на протяжении истории. [vilas_venslau|E], [silas_stavro|E] и другие тёмные личности оставили отпечатки своей силы в этом самом кольце."
 artifact_ringofthelich_modifier: "Кольцо королей-личей"
 artifact_ringofthelich_modifier_desc: "#E Магия#!:@magic_icon!#positive_value +4#!/месяц\n#E Магия#!:@magic_icon!#positive_value +100%#!/месяц"
 artifact_ringofthelich_name: "Кольцо королей-личей"
 artifact_sacrifical_dagger_age: "Этот предмет, вероятно, был изготовлен около [owner.MakeScope.Var('dagger_age').GetValue|0] года."
 artifact_sacrifical_dagger_description: "Кинжал из [newly_created_artifact.GetFeatureText( 'blade_metal' )] [SCOPE.Custom('ArtifactQuality')] качества. [newly_created_artifact.Custom('ArtifactDaggerDecoration')] Само лезвие [newly_created_artifact.GetFeatureText( 'sacrifical_decoration' )].\n\n$artifact_sacrifical_dagger_age$"
 artifact_sacrifical_dagger_name: "Жертвенный кинжал [owner.GetTitledFirstNamePossessiveNoTooltip]"
 artifact_sandals_amsari_description: "Элегантный реликварий, содержащий святую реликвию: скромные сандалии, в которых Пророк произнёс Слова."
 artifact_sandals_amsari_name: "Сандалии Пророка"
 artifact_sculpture_mask_of_ankepy_ix_description: "Знаменито декадентская и показная погребальная маска кемсарийского царя Анкепи IX, безусловно, оставила после себя маску, достойную его титула и личности. Не удовлетворившись простым золотом, Анкепи приказал тщательно отлить свою маску из нескольких магически заряженных метеоритов — процесс, потребовавший объединённых усилий некоторых из величайших саррадонских [Concept('magi','магов')|E] и металлургов того времени. Затем эта основа была инкрустирована бесчисленными драгоценными камнями, причём, по-видимому, присутствуют все их разновидности, существующие на [Concept('aeras','Эрасе')|E], а два смертных глаза маски сделаны из особенно крупных и впечатляющих кровавых кристаллов.\n\nОднако наиболее примечательным является «третий глаз» маски. Как и большинство кемсарийских правителей, Анкепи отправился в загробную жизнь в сопровождении слуг, однако их количество и ранг — его высшие чиновники, супруга, наложницы, домашняя прислуга, личная стража, кабал магов и десятки тысяч рабов — превосходит излишества даже подавляющего большинства его предшественников и преемников. Все они были ритуально убиты, а их души заключены в чёрный драгоценный камень неизвестного происхождения, составляющий третий глаз маски, чтобы они могли продолжать служить своему господину в вечности."
 artifact_sculpture_mask_of_ankepy_ix_name: "Погребальная маска Анкепи IX"
 artifact_seal_wardenism_description: "Простая глиняная печать с изображением ключа, окружённого текстом, слишком сильно выветренным, чтобы его можно было разобрать. Хотя на первый взгляд это не более чем потёртый аксессуар мелкого [Concept('wardenism','варденитского')|E] судьи, надёжные источники прослеживают этот конкретный предмет до самого [Concept('the_first_warden','Первого Вардена')|E] — это была та самая печать, которой была придана легитимность практически всем самым ранним, основополагающим текстам [wardenism|E] и постановлениям, которые их вдохновляли."
 artifact_seal_wardenism_name: "Печать Первого Вардена"
 artifact_seignonsword_desc: "Семейный клинок дома Ден ва Сеньон использовался в сотнях битв на протяжении четырёх столетий. Первоначально обнаруженный (самопровозглашённым) королём Кредоном ден ва Сеньоном незадолго до [Concept('red_river_war','Войны Красной реки')|E], в древнем склепе неизвестного происхождения, его мерцающий чёрный клинок, кажется, исчезает и появляется из поля зрения, рассекая воздух с тошнотворным шипением. Металл и стиль клинка остаются загадкой для всех, кто его видел, как и его способность рассекать само зрение."
 artifact_seignonsword_modifier: "Семейный меч Ден ва Сеньон"
 artifact_seignonsword_modifier_desc: "Семейный меч дома Ден ва Сеньон, [Concept('aelfir','чужеземного')|E] происхождения"
 artifact_seignonsword_name: "Семейный меч Ден ва Сеньон"
