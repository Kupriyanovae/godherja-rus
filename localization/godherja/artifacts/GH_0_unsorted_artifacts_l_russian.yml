 beaker_decorations_pattern_inlay_gem: "Поверхность её чаши содержит [ROOT.Artifact.GetFeatureText('decoration_pattern')], с несколькими кусочками [ROOT.Artifact.GetFeatureText('decoration_material_gem')], вставленными в искусные инкрустации из [ROOT.Artifact.GetFeatureText('decoration_material_inlay')]"
