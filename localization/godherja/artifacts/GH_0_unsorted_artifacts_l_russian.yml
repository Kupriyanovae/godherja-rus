 artifact_dragonskull_desc: "Древняя пожелтевшая кость зверя, некогда называемого «[Concept('the_worldeater','Пожирателем миров')|E]». В определённый момент истории Пожиратель миров пожирал целые [Concept('sarradon','саррадонские')|E] города, опустошая целые регионы из-за своей ненасытной голодности. После того как он поглотил саму правительницу [sarradon|E], зверь был убит Рехдией Уддайир, которая затем была объявлена законной королевой."
 artifact_dragonskull_name: "Череп дракона"
 artifact_boneoftheworldeater_desc: "Древняя пожелтевшая кость зверя, некогда называемого «[Concept('the_worldeater','Пожирателем миров')|E]». В определённый момент истории Пожиратель миров пожирал целые [Concept('sarradon','саррадонские')|E] города, опустошая целые регионы из-за своей ненасытной голодности. После того как он поглотил саму правительницу [sarradon|E], зверь был убит Рехдией Уддайир, которая затем была объявлена законной королевой."
 artifact_boneoftheworldeater_modifier: "Кость Пожирателя миров"
 artifact_boneoftheworldeater_name: "Кость Пожирателя миров"
 crown_of_chevalie: "Корона [chevalie|E]"
 crown_of_chevalie_description: "Восстановленная истинным правителем [chevalie|E], корона марочников [chevalie|E] снова является символом единства. Остаётся только надеяться, что эта новая линия королей сможет сохранить святость короны и защитить северную границу от некромантической тьмы за ней."
 broken_crown_name: "Часть Разбитой Короны"
 broken_crown_description: "#size:15 Корона марочников была разбита на четыре части Верховным королём Гардфреем ден ва Сеньоном на Совете Клуа, который, когда его дети потребовали выбрать преемника, провозгласил, что тот, кто сможет собрать её заново, может получить трон «плевать ему, с большой горы». С тех пор эти части стали символом утраченной славы [chevalie|E], и многие ждут дня, когда достойный правитель сможет собрать воедино и корону, и королевство."
 


