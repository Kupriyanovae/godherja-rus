 beaker_decorations_decoration_wire_gem: "Внешняя поверхность её чаши покрыта [ROOT.Artifact.GetFeatureText('beaker_decoration')], а несколько кусочков [ROOT.Artifact.GetFeatureText('decoration_material_gem')] закреплены на ней тонкой проволокой из [ROOT.Artifact.GetFeatureText('decoration_material_wire')]"
