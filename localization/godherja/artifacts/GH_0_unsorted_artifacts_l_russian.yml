## From the artifacts_loc_l_english file, fuck me ##

 artifact_skull: "Череп"

 artifact_hunt.0001.a: "Время охоты!"
 artifact_hunt.0001.b: "Может быть, в другой раз."
 artifact_hunt.0001.desc: "Благодаря моим недавним приключениям я наткнулся на следы возможного артефакта, который долгое время был скрыт от историков. Конечно, всё это может быть просто причудливым слухом, бабкиными сказками или даже откровенной выдумкой. Тем не менее, если эти шепоты окажутся правдой, я был бы глуп, упустив такую возможность. Артефакты исторического значения могут быть огромной ценности для тех, кто умеет их ценить, и любой правитель, обладающий таким, без сомнения, стал бы предметом разговоров на долгое время. Мой разум наполняется образами великолепных шлемов, сверкающих и позолоченных мечей, и нагрудников, выкованных самыми искусными руками истории. Я чувствую, будто уже держу их всех..."
 artifact_hunt.0001.t: "Охота начинается"
 artifact_hunt.0002.a: "Удачи!"
 artifact_hunt.0002.b: "Возможно, мне стоит приберечь золото для более верного дела."
 artifact_hunt.0002.desc: "Зачем мне тратить время на поиски того, что вполне может оказаться погоней за журавлём в небе? У меня есть гораздо более важные, абсолютно реальные проблемы при дворе. Я просто не могу уделить время личному расследованию слухов. Это не значит, что я должен их игнорировать, ибо это было бы весьма неразумно. Вместо того чтобы отправляться самому, я решил нанять местных жителей для поисков. Охотников, трапперов, ветеранов прошлых войн — людей, которые должны знать здешние места. Они будут хороши и надёжны, пока я плачу им достойную плату за находку артефакта."
 artifact_hunt.0002.t: "Наёмная помощь"
 artifact_hunt.0003.a: "Мы выступаем!"
 artifact_hunt.0003.b: "У меня есть другие битвы, которые нужно выиграть."
 artifact_hunt.0003.desc: "Любой хороший лидер должен быть готов испачкать руки в погоне за славой и властью, как говорят нам рассказчики. Сегодня я поведу свою личную свиту на поиски якобы находящегося поблизости артефакта. Отряд будет разбит на пары и отправлен на прочёсывание как можно большей территории. Надеюсь, вылазка окажется быстрой и без вмешательства людей, зверей или более тёмных сущностей. Охота не снаряжена для тяжёлого боя, и нашим главным преимуществом будет скорость. С удачей я вернусь домой не позднее завтрашнего дня, с новым артефактом при себе."
 artifact_hunt.0003.t: "Вылазка"
 artifact_hunt.0004.a: "Пора набросать приглашение."
 artifact_hunt.0004.b: "Возможно, мне стоит приберечь золото для более верного дела."
 artifact_hunt.0004.desc: "Похоже, артефакт, который я искал, попал в руки мелкого соседнего дворянина. Они могут быть не так уж готовы расстаться с ним, даже за хорошую сумму монет. Однако, учитывая, что я доминирующий лорд в этом регионе, я могу применить как свою власть, так и личное обаяние, чтобы заставить их уступить. Если этого окажется недостаточно, я могу пойти дальше и прибегнуть к угрозам и уговорам. Надеюсь, они прислушаются к голосу разума, прежде чем дело дойдёт до подобной грубости."
 artifact_hunt.0004.t: "Заключение сделки"
 artifact_hunt.0005.a: "Итак, какой же это был свиток?"
 artifact_hunt.0005.b: "С другой стороны, это, вероятно, будет бессмысленным занятием."
 artifact_hunt.0005.desc: "Бесцельные поиски могут быть хороши для простолюдинов, но я выше подобной траты времени! Я нашёл обрывки информации об артефакте, который, как говорят, находится поблизости. Анализируя подсказки, оставленные в этих древних томах и свитках, я могу значительно сузить возможное местонахождение моей цели, что сделает самую сложную часть этой задачи куда проще. Как только я расшифрую местоположение, я просто отправлю несколько учёных с навыками в археологии, чтобы они обеспечили мой новый приз."
 artifact_hunt.0005.t: "Штурм свитков"
 artifact_hunt.0006.a: "Принесите мне счёты."
 artifact_hunt.0006.b: "Возможно, я подожду дождливого дня, чтобы разгадать эту тайну."
 artifact_hunt.0006.desc: "Мой управляющий принёс мне весть о весьма удачном повороте в моих поисках артефакта! Похоже, местные записи могут содержать ключ к получению моей цели. Конечно, многие из этих документов довольно сложны и потребуют тщательного чтения и перекрёстных ссылок, если я хочу достичь понимания. Мой управляющий пообещал помочь мне разобрать некоторые из возможных шифров и кодов, которые, как он считает, были спрятаны в этих записях. Тем не менее, учитывая, как усердно кто-то работал, чтобы скрыть это сокровище, я не могу быть уверен, что мы добьёмся успеха."
 artifact_hunt.0006.t: "Бюрократический прорыв"
 artifact_hunt.0007.a: "Возможно, это была судьба..."
 artifact_hunt.0007.b: "Может быть, некоторые вещи лучше оставить в покое..."
 artifact_hunt.0007.desc: "Завершая охоту, радуясь её успеху, меня охватывает странное чувство. Это не неприятное чувство, скорее похожее на тёплый позыв, тянущий меня к чему-то неведомому. Я сворачиваю с пути и иду к таинственной и незнакомой силе, влекущей меня куда-то ещё. Неизбежно я достигаю места, куда она пыталась меня привести, и нахожу некий предмет там, где притяжение было сильнее всего, после чего чувство исчезает."
 artifact_hunt.0007.t: "Благосклонное принуждение"
 artifact_hunt.0008.a: "Какая досада."
 artifact_hunt.0008.desc: "Несмотря на все мои усилия, поиски того, что могло бы стать легендарным артефактом, не увенчались успехом. Будь то из-за моих собственных провалов или провалов тех, кого я нанял, след остыл."
 artifact_hunt.0008.t: "Неудача"

 ## Mounts ##

 artifact_mount: "Скакун"

 artifact_mountgriffon_desc: "#size:15 Грифон с высочайших вершин гор [chevalie|E]. Грифоны обычно мигрируют из своих домов на западе на юго-восток к зиме, и во время этой миграции предприимчивые марочники, рождённые как высокого, так и низкого происхождения, отправляются на попытку поимки и дрессировки детёнышей."
 artifact_mountgriffon_modifier: "Грифон"
 artifact_mountgriffon_name: "Грифон"

 artifact_mountgreatergolem_desc: "#size:15 С помощью арканного ритуала это массивное творение из металла и камня подчинено вашей воле. Этот огромный конструкт поможет вам в бою и разрушит стены ваших врагов."
 artifact_mountgreatergolem_modifier: "Великий голем"
 artifact_mountgreatergolem_name: "Великий голем"

 artifact_mountamiablefogbeast_desc: "#size:15 Редкий пример [Concept('fogbeast','туманной твари')|E], который с помощью арканного ритуала был сделан достаточно послушным для использования в качестве скакуна. В отличие от других своего вида, он демонстрирует стабильный темперамент и терпим к обращению."
 artifact_mountamiablefogbeast_name: "Туманная тварь"
 artifact_mountamiablefogbeast_modifier: "Туманная тварь"

 artifact_mountsandskiff_name: "Личный песчаный скиф"
 artifact_mountsandskiff_desc: "#size:15 Песчаные скифы — это необычные суда, используемые для передвижения по самым глубоким просторам Саррадонской пустыни. Секреты их строительства и мастерства среди пустынных племён издавна строго охраняются.\n\nЭтот скиф сделан для личного использования и вмещает не более одного всадника."
 artifact_mountsandskiff_modifier: "Песчаный скиф"

 artifact_fellcharm_desc: "#size:15 Это ожерелье источает тёмную и неведомую магию. Отлитое из странного и чуждого металла, оно выглядит так, будто его многократно перековывали в прошлом, возможно, в попытке уничтожить.\n\nНоситель этого кулона, без сомнения, будет наделён великой силой против своих врагов... но остаётся вопрос, есть ли у этого равная или даже большая цена..."
 artifact_fellcharm_modifier: "Злой талисман"
 artifact_fellcharm_modifier_desc: "Ожерелье, источающее тёмную неведомую магию"
 artifact_fellcharm_name: "Злой талисман"

 artifact_gift.1.desc: "Любой [GetPlayer.Custom('WomanManGirlBoy')] может одновременно использовать лишь ограниченное количество артефактов, поэтому в интересах моей династии обеспечить, чтобы наши артефакты использовались с пользой.\n\nС этой целью я решил подарить [recipient.GetTitledFirstName] артефакт."

 artifact_marias_blade_battle_desc: "#size:15 Этот клинок, позолоченный серебром и с прекрасной надписью вдоль лезвия, был в руках [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFullName] во время вторжения [Concept('liches','лича')|E] [newly_created_artifact.MakeScope.Var('prominent_foe').Char.GetFirstNameNicknamed]. Мария была дочерью богатой дворянской династии Тейдия, и ожидалось, что она примет Путь Семьи на своём выборе Пути в преддверии брака с семьёй Калменсон.\n\nОднако, услышав об ужасе, обрушившемся на её родину, она вместо этого выбрала Путь Опустошения, вызвав большой скандал. Её отец, убитый горем, но желая безопасности своей дочери, заказал этот великий клинок, чтобы обеспечить её выживание, который, как гласят легенды, позже был вонзён в «глаз» лича в конце её вторжения."
 artifact_marias_blade_desc: "#size:15 Этот клинок, позолоченный серебром и с прекрасной надписью вдоль лезвия, был в руках Марии ден ва Тейдия во время вторжения [Concept('liches','лича')|E] Дексаса «Носителя Смерти». Мария была дочерью богатой дворянской династии Тейдия, и ожидалось, что она примет Путь Семьи на своём выборе Пути в преддверии брака с семьёй Калменсон.\n\nОднако, услышав об ужасе, обрушившемся на её родину, она вместо этого выбрала Путь Опустошения, вызвав большой скандал. Её отец, убитый горем, но желая безопасности своей дочери, заказал этот великий клинок, чтобы обеспечить её выживание, который, как гласят легенды, позже был вонзён в «глаз» лича в конце её вторжения."
 artifact_marias_blade_modifier: "Клинок Марии ден ва Тейдия"
 artifact_marias_blade_modifier_desc: "Серебряный меч, который, как говорят, убил [Concept('liches','лича')|E]"
 artifact_marias_blade_name: "Клинок Марии ден ва Тейдия"

 artifact_ringofwaysaints_desc: "#size:15 Прекрасное позолоченное кольцо, которое, как говорят, было заказано для святого пути Катха ден ва Кречча Конклавом Раокура незадолго до его мученической смерти. Оно было подарено молодому Верховному королю Реми Хадкурту-Ведрону на его коронации в 974 году от И.С. и служило мощным символом его веры и верности Пути."
 artifact_ringofwaysaints_modifier: "Кольцо святого пути"
 artifact_ringofwaysaints_modifier_desc: "Прекрасное кольцо, которое, как говорят, было выковано для руки святого пути"
 artifact_ringofwaysaints_name: "Кольцо святого пути"

 artifact_sackofsmokebombs_desc: "#size:15 «Дымовухи» — это довольно недавнее алхимическое изобретение, используемое антимагическими орденами [chevalie|E] в их усилиях по уравниванию шансов против личей, магов и всех остальных. Вдохновлённые саррадонскими изобретениями, увиденными марочниками во время их приключений на юге, эти устройства создают довольно впечатляющее облако, скрывающее всё внутри него при зажигании простого фитиля. Вы полагаете, что вдыхать слишком много этого дыма было бы не особенно полезно для здоровья."
 artifact_sackofsmokebombs_modifier: "Мешок дымовых шашек"
 artifact_sackofsmokebombs_modifier_desc: "Мешок алхимических дымовых шашек, предназначенных для скрытия пользователя и, возможно, вызывающих рак"
 artifact_sackofsmokebombs_name: "Мешок дымовых шашек"
 
 ##artifact_sackofsmokebombs_desc: "#size:15 'Smokers' are a fairly recent alchemical invention used by the Anti-Magic Orders of [chevalie|E] in their efforts to even the playing field against Liches, Magi, and everyone else. Inspired by Sarradonian inventions observed on the Marcher's adventures in the south, these devices make a rather impressive cloud that obscures anything within it at the lighting of a simple fuse. You imagine breathing too much of it in would not be particularly healthy."
 ##artifact_sackofsmokebombs_modifier: "Sack of Smoke Bombs"
 ##artifact_sackofsmokebombs_modifier_desc: "A sack of alchemical smoke bombs designed to obscure the user and possibly give cancers"
 ##artifact_sackofsmokebombs_name: "Sack of Smoke Bombs"
 

 artifact_sirtheyvnsbreastplate_desc: "#size:15 Говорят, что сэр Тейвн «Мученик» был первым марочником, убитым [Concept('liches','личем')|E]. Истории гласят, что когда [vilas_venslau|E] вторгся на юг, он первым подошёл к воротам пограничного форта Метенс и потребовал, чтобы гарнизон открыл ворота для своего нового господина. Сэр Тейвн, комендант гарнизона, вышел один и провозгласил, что ни один живой человек не сможет заковать марочников в цепи, а тем более мёртвый. Прожжённая дыра в центре нагрудника рассказывает остальную часть истории, а многочисленные песни и баллады, посвящённые Тейвну, повествуют о его наследии."
 artifact_sirtheyvnsbreastplate_modifier: "Нагрудник сэра Тейвна"
 artifact_sirtheyvnsbreastplate_modifier_desc: "Сломанный нагрудник, который, как говорят, принадлежал первому марочнику, убитому [Concept('liches','личем')|E]. Возможно, репродукция"
 artifact_sirtheyvnsbreastplate_name: "Нагрудник сэра Тейвна"

 artifact_create.degrade.desc: "Качество артефакта снизилось."
 artifact_create.degrade.t: "Снижение качества"
 artifact_create.degrade.tt: "Качество артефакта снизится."

 artifact_create.improvement.desc: "Качество артефакта повысилось."
 artifact_create.improvement.t: "Повышение качества"
 artifact_create.improvement.tt: "Качество артефакта повысится."

 artifact_adabyssiancontrolrod_desc: "#size:15 Этот золотой жезл имеет странный набор эзотерических кнопок, циферблатов и переключателей вдоль стороны. Хотя его работа является загадкой для любого, кто не с далёких южных окраин, слухи говорят, что если вы владеете им, вы можете управлять одной из их легендарных живых статуй..."
 artifact_adabyssiancontrolrod_modifier: "Адабисский жезл управления"
 artifact_adabyssiancontrolrod_name: "Адабисский жезл управления"

 artifact_fire_arbalest: "Адабисский огненный арбалет"
 artifact_adabyssianfirearbalest_desc: "#size:15 Это странное устройство было выковано на одной из огромных мануфактур в Лавовых ямах горы Вирирень'аго или, возможно, одним из личных кузнецов императора из Города Золотых Статуй. Огненный арбалет — это странный прототип, который адабиссы медленно совершенствуют веками. Хотя он всё ещё экспериментальный, разрушительный треск этого оружия вселяет страх в солдат врага, а странный снаряд, который он выпускает, пронзает доспехи насквозь. Маркировка на рукояти гласит, что это [owner.MakeScope.Var('model_number').GetValue|0] из 50."
 artifact_adabyssianfirearbalest_modifier: "Адабисский огненный арбалет"
 artifact_adabyssianfirearbalest_modifier_desc: "Может быть использован в [Concept('monster_hunt','Охоте на монстров')|E]"
 artifact_adabyssianfirearbalest_name: "Адабисский огненный арбалет"

 artifact_aersanonstaff1_desc: "#size:15 Этот странный посох сделан из материала, совершенно чуждого всем. Жёсткая чёрная конструкция кажется почти эфирной, совершенной в своём исполнении. Пожалуй, самая странная вещь в его конструкции — это то, что, несмотря на явно магическую природу предмета, острый наконечник посоха, по-видимому, активно высасывает магическую силу из всего вокруг с поразительной скоростью. Кто знает, какое Древнее Существо когда-то держало его?"
 artifact_aersanonstaff1_modifier: "#E Магия#!:@magic_icon!#positive_value -1#!/месяц\n#E Магия#!:@magic_icon!#positive_value +50%#!/месяц"
 artifact_aersanonstaff1_modifier_desc: "#E Магия#!:@magic_icon!#positive_value; +8#!/месяц"
 artifact_aersanonstaff1_name: "Верхняя половина древнего посоха"

 artifact_aersanonstaff2_desc: "#size:15 Этот странный посох сделан из материала, совершенно чуждого всем. Жёсткая чёрная конструкция кажется почти эфирной, совершенной в своём исполнении. Хотя верхняя часть посоха отломана, нижняя часть всё ещё источает огромное количество магической силы, хотя никто не имеет представления, как можно извлечь эту силу; простое его удержание, кажется, доводит до предела то, что [Comcept('magi','маг')|E] может вместить. Кто знает, какое Древнее Существо когда-то держало его?"
 artifact_aersanonstaff2_modifier: "#E Магия#!:@magic_icon!#positive_value +2#!/месяц\n#E Магия#!:@magic_icon!#positive_value +25%#!/месяц"
 artifact_aersanonstaff2_modifier_desc: "#E Магия#!:@magic_icon!#positive_value; +8#!/месяц"
 artifact_aersanonstaff2_name: "Нижняя половина древнего посоха"

 artifact_alienwhip_desc: "#size:15 Этот кнут, по-видимому, имеет конструкцию, на которую ни один человек не может претендовать. Каждый раз, когда он щёлкает, кажется, что летят искры, словно ударяет молния. Вы не можете сдержать дрожь каждый раз, когда видите его, как будто почти вспоминаете что-то, что вы давно забыли..."
 artifact_alienwhip_modifier: "Чуждый кнут"
 artifact_alienwhip_name: "Чуждый кнут"

 artifact_ancienttablet_desc: "#size:15 Древняя табличка из [Concept('aversaria','протоаверсарианской')|E] культуры. Кажется, она изображает Чистейшего и Первых людей, создающих мир, но содержит много странностей, не соответствующих аверсарианскому священному писанию, таких как неразрушенное побережье, люди с заострёнными ушами и другие загадки."
 artifact_ancienttablet_modifier: "Древняя табличка"
 artifact_ancienttablet_name: "Древняя табличка"

 artifact_ante_apocalyptic_prophecy_amsari_description: "До откровений Пророка народ Амсара веками получал наставления, заверения и проблески грядущей славы от ряда второстепенных пророческих фигур, чьи писания известны как Анте-Апокалиптические Пророчества. Хотя их сохранность была крайне фрагментарной из-за преследований кемсарианцев и спонтанного характера их записи, и они в значительной степени утратили своё значение перед откровениями Пророка, подлинные сохранившиеся тексты этого типа всё ещё пользуются большим уважением."
 artifact_ante_apocalyptic_prophecy_amsari_name: "Анте-Апокалиптическое Пророчество"

 artifact_atracorde_battle_desc: "Клинок из чёрного железа с золотой рукоятью, эта рапира является шедевром салисийской металлургии и считается одним из лучших произведений, когда-либо созданных Цитаделью Мечей. Заказанная богатыми лордами Лиги Чёрного Золота, эта рапира была подарена молодому [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFirstNameNicknamed|V], чтобы служить достойным клинком Верховного короля. Молодой лорд назвал меч «Атракорде», что означает «Чёрный Союз», и многие считали, что это в честь лиги, вознёсшей его к власти. Однако те, кто был ближе к нему, уже знали о недовольстве Терина интригами его отца и считали, что это имя является проклятием против самой Лиги."
 artifact_atracorde_desc: "Клинок из чёрного железа с золотой рукоятью, эта рапира является шедевром салисийской металлургии и считается одним из лучших произведений, когда-либо созданных Цитаделью Мечей."
 artifact_atracorde_name: "Атракорде"

 artifact_automaticgemlion_desc: "#size:15 Поразительный пример утраченного картараддского ремесла, это элегантное, но тяжёлое устройство достигает высоты плеча. Похоже, оно было спроектировано как некий защищённый футляр для хранения ювелирных изделий, которые его медные когти деликатно сортируют по различным хитроумно скрытым полостям, расположенным по всему телу. Всё устройство управляется поворотом и нажатием на ряд рычагов, выступающих из его основания. Находка для любого, у кого есть коллекция ювелирных изделий, слишком большая, чтобы уследить за ней, но ограниченного использования для любого другого. Отрывочные записи предполагают, что они делались для использования картараддскими [Concept('magi','магами')|E], хотя для какой именно цели — до сих пор неясно."
 artifact_automaticgemlion_modifier: "Декоративный львиный автомат"
 artifact_automaticgemlion_modifier_desc: "Поразительная шкатулка-автомат для ювелирных изделий."
 artifact_automaticgemlion_name: "Декоративный львиный автомат"

 artifact_aversariacrown_desc: "#size:15 Корона Аверсарии была надета каждым правящим аавтократом, кроме двух, на протяжении более тысячи лет. Внушительная и богато украшенная, корона вызывает смешанные чувства страха и благоговения, и легенды гласят, что головы стольких могущественных [Concept('magi','магов')|E] оставили на короне свою собственную магическую ауру."
 artifact_aversariacrown_modifier: "Аверсарианская корона"
 artifact_aversariacrown_modifier_desc: "#E Магия#!:@magic_icon!#positive_value +1#!/месяц\n"
 artifact_aversariacrown_name: "Аверсарианская корона"

 artifact_aversarian_crown_base_desc: "Этот тусклый золотой обруч когда-то был каркасом [Concept('aversaria','аверсарианской')|E] Короны. Теперь это лишь тусклая оболочка её бывшего величия, лишённая компонентов и обнажённая."
 artifact_aversarian_crown_base_name: "Основа аверсарианской короны"

 artifact_aversarian_crown_chain_desc: "Эта богато украшенная цепь когда-то скрепляла [Concept('aversaria','аверсарианскую')|E] Корону. Теперь её искусно вырезанные заклинания лишь тускло мерцают на свету."
 artifact_aversarian_crown_chain_name: "Цепь аверсарианской короны"

 artifact_aversarian_crown_diamond_desc: "Этот огромный алмаз когда-то был центральным камнем [Concept('aversaria','аверсарианской')|E] Короны. Его ослепительные цвета и размер заставляли всех взирать на его великолепие; теперь, отделённый от короны, алмаз утратил свой блеск."
 artifact_aversarian_crown_diamond_name: "Алмаз аверсарианской короны"

 artifact_aversarian_crown_dragonveil_desc: "Эта тонкая, серебристая вуаль когда-то свисала с [Concept('aversaria','аверсарианской')|E] Короны, символизируя древнюю связь [Concept('aversaria','Аверсарии')|E] с [Concept('dragons','драконами')|E]."
 artifact_aversarian_crown_dragonveil_name: "Вуаль из драконьей чешуи аверсарианской короны"

 artifact_aversarian_crown_jewels_desc: "Эти сверкающие самоцветы когда-то украшали [Concept('versaria','аверсарианскую')|E] Корону, но уже давно извлечены из своих гнёзд."
 artifact_aversarian_crown_jewels_name: "Самоцветы аверсарианской короны"

 artifact_aversarianspear_desc: "#size:15 Это копьё имеет аверсарианский дизайн и исключительно хорошо сделано. Скорее всего, это изделие, выкованное в конце XII века, оно сверкает полосами электрума вокруг полированного железного древка. Наконечник выкован в форме капли крови с одним сияющим рубином в месте соединения с основанием.\n\nПодобные копья были распространены в аверсарианских легионах, хотя мастерство изготовления указывает на то, что это оружие высокопоставленного офицера или дворянина."
 artifact_aversarianspear_modifier: "Аверсарианское копьё"
 artifact_aversarianspear_modifier_desc: "Копьё с наконечником в форме капли крови"
 artifact_aversarianspear_name: "Аверсарианское копьё"

 artifact_banner_wardenism_description: "Хотя нет никаких доказательств того, что [Concept('the_first_warden','Первый Варден')|E] использовал только одно боевое знамя на протяжении всей своей жизни, как часто утверждается, это знамя, безусловно, самое известное — оно присутствовало в знаменательной битве у Горящего Ключа, которая ознаменовала решительное поражение саррадонского регента Улатира силами [Concept('wardenism','варденитов')|E] и начало тысячелетнего господства в долине Синамия.\n\nНесмотря на то, что оно загорелось в середине битвы и было целью многочисленных попыток врага уничтожить его, оно в значительной степени уцелело (вероятно, из-за конкретного типа ткани, использованной при его изготовлении, а не чуда, как иногда утверждается) и служило точкой сбора для немногочисленных сил [Concept('wardenism','варденитов')|E], а впоследствии дало битве её название."
 artifact_banner_wardenism_name: "Знамя Горящего Ключа"

 artifact_blackhorn_desc: "#size:15 Чёрный Рог — это легендарный рог сьялволкского бога [Glossary('Velos','Велоса')|E], или, по крайней мере, утверждается, что это так. Рог регулярно появляется в мифологиях различных культур со всех уголков [aeras|E], всегда используемый в той или иной форме для призыва духов на войну, но при этом убивающий трубящего. Рог делает различие: тот, кто приказывает его использовать, должен быть убит, а не тот, кто в него трубит."
 artifact_blackhorn_modifier: "Чёрный Рог"
 artifact_blackhorn_modifier_desc: "Легендарный Чёрный Рог, который, как говорят, призывает павших духов сражаться за живых"
 artifact_blackhorn_name: "Чёрный Рог"

 artifact_bloodofthearchmagi_desc: "#size:15 Когда архимага Каталитоса из [mayikrata|E] нашли пронзённым люстрой его кабинета холодным утром 1098 года, первой реакцией его помощника было, вопреки всякой логике, собрать его кровь в бутылки. Каталитос истёк кровью, пока тот это делал, и хотя подозревалась тёмная магия, ничего не было доказано. После того как помощник вскоре исчез во время расследования, несколько пузырьков появились по всему миру десятилетия спустя, а кровь в бутылках всё ещё хранила в себе много силы."
 ####artifact_bloodofthearchmagi_desc: "#size:15 When Arch-Magi Kathalitos of the Mayikprolollan was found skewered on the chandelier of his study one cold morning in 1098, his assistant's first reaction was, against all reason and logic, to bottle up his blood. Kathalitos bled to death while he did so, and while dark magic was suspected nothing was ever proven. After his assistant disappeared soon after during the investigation, several of the vials would appear around the world decades later, the blood in the bottles still holding much power."
 artifact_bloodofthearchmagi_modifier: "Кровь архимага"
 artifact_bloodofthearchmagi_modifier_desc: "#E Магия#!:@magic_icon!#positive_value +25%#!/месяц"
 artifact_bloodofthearchmagi_name: "Кровь архимага"
 
 artifact_bone: "кость"
 artifact_bone_amulet_dread_1_desc: "#size:15 Этот костяной амулет создаёт вокруг носителя ауру беспокойства."
 artifact_bone_amulet_dread_1_modifier: "Малый амулет ужаса"
 artifact_bone_amulet_dread_1_modifier_desc: "Этот костяной амулет создаёт вокруг носителя ауру беспокойства."
 artifact_bone_amulet_dread_1_name: "Малый амулет ужаса"

 artifact_bone_amulet_dread_2_desc: "#size:15 Этот костяной амулет создаёт вокруг носителя тяжёлую ауру беспокойства."
 artifact_bone_amulet_dread_2_modifier: "Амулет ужаса"
 ####artifact_bone_amulet_dread_2_modifier_desc: "This bone amulet creates a heavy aura of unease around its wearer."
 artifact_bone_amulet_dread_2_modifier_desc: "Этот костяной амулет даёт своему носителю чутьё на поиск скрытых богатств, но также увеличивает склонность к извлечению богатств из своих подданных."
 artifact_bone_amulet_dread_2_name: "Амулет ужаса"
 
 artifact_bone_amulet_dread_3_desc: "#size:15 Этот костяной амулет внушает страх тем, кто находится рядом с его носителем."
 artifact_bone_amulet_dread_3_modifier: "Великий амулет ужаса"
 artifact_bone_amulet_dread_3_modifier_desc: "Этот костяной амулет даёт своему носителю острое чутьё на поиск скрытых богатств, но также значительно увеличивает склонность к извлечению богатств из своих подданных."
 ####artifact_bone_amulet_dread_3_modifier_desc: "This bone amulet instills fear into those around its wearer."
 artifact_bone_amulet_dread_3_name: "Великий амулет ужаса"

 artifact_bone_amulet_dread_4_desc: "#size:15 Этот костяной амулет внушает ужас тем, кто находится рядом с его носителем."
 artifact_bone_amulet_dread_4_modifier: "Грандиозный амулет ужаса"
 artifact_bone_amulet_dread_4_modifier_desc: "Этот костяной амулет внушает ужас тем, кто находится рядом с его носителем."
