 artifact_brokenavianautomata_desc: "#size:15 Всё ещё очень востребованные, птичьи автоматы, как утверждается, были обычным явлением в домах баснословно богатых, по крайней мере, пока [Concept('aversaria','аверсарианцы')|E] не завоевали картараддов и не подавили искусство создания автоматов достаточно долго, чтобы обречь его на гибель. Записи указывают, что некоторые из этих захватывающе сложных машин были даже зачарованы во время строительства для имитации поведения настоящих птиц, а лучшие из них могли даже реагировать на простые инструкции.\n\nЭтот конкретный пример утраченного искусства может только петь и бесполезно размахивать одним оставшимся крылом, но тем не менее это впечатляющий экспонат."
 artifact_brokenavianautomata_modifier: "Сломанный птичий автомат"
 artifact_brokenavianautomata_modifier_desc: "Поразительный, хотя и едва функционирующий птичий автомат."
 artifact_brokenavianautomata_name: "Сломанный птичий автомат"

 artifact_cloak_amsari_description: "Элегантный реликварий, содержащий святую реликвию: простой шерстяной плащ Пророка."
 artifact_cloak_amsari_name: "Плащ Пророка"

 artifact_consopite_effigy_desc: "Жутковатое изваяние неизвестного происхождения, которое всегда кажется холодным на ощупь. Два необычных янтарных [bloodcrystal|E] камня украшают его птичью голову и тускло светятся в темноте. Оно достаточно мало, чтобы поместиться на прикроватном столике, и в остальном кажется довольно обычным и инертным, возможно, являясь не более чем диковинкой, сделанной эксцентричным ремесленником, чьё имя затерялось в истории.\n\nПо необъяснимым причинам, оно, по-видимому, особенно подвержено потере, часто оказываясь утром в другом месте, чем то, где его оставили вечером."
 artifact_consopite_effigy_name: "Изваяние Консопита"

 artifact_achromatic_mirror_desc: "Это высокое напольное зеркало неопределённого происхождения заключено в бледную металлическую раму и, кажется, отражает больше света, чем падает на него. Его безупречная поверхность улавливает даже самые тонкие нюансы наблюдателя, придавая их отражению чарующее, почти эфирное качество. Благодать этого отражения такова, что оно почти ощущается как обладающее собственной жизнью — как безупречная, превосходная версия оригинала."
 artifact_achromatic_mirror_name: "Ахроматическое зеркало"

 artifact_crimsonseal_description: "Сделанная из неизвестного, чёрного как смоль материала со странными гипнотическими узорами, вырезанными на нём светящимся багрянцем, эта государственная печать прошла через руки нескольких крупных саррадонских империй. Впервые появившись в Иркалитской империи в XII веке до И.С., она впоследствии принадлежала Гаштани, Асреду, Аккарику и, наконец, Саррадону. История артефакта заканчивается в 1233 году от И.С., когда последний регент Саррадона бросил его в море, провозгласив: «Ни одно царство человеческое больше никогда не будет достойно тебя!»"
 artifact_crimsonseal_name: "Багряная печать"

 artifact_crown_wardenism_description: "Являясь предметом одного из наиболее известных эпизодов возвышения [Concept('the_first_warden','Первого Вардена')|E], эта корона принадлежала печально известному тирану [arachas|E] до его гибели в конце самого первого восстания [Concept('wardenism','варденитов')|E] на Аль-Газире. Согласно легенде, после того как её извлекли из пепелищ крепости покойного короля, её немедленно предложили мессии [Concept('wardenism','варденитов')|E] — который отверг это предложение и вместо этого приказал продать её для благотворительных целей.\n\nОт былого великолепия головного убора почти ничего не осталось, кроме corroded, broken skeleton. Если присмотреться, всё ещё можно различить искажённые и повреждённые изображения [Concept('ritualism','ритуалистской')|E] иконографии, деформированные огнём, который унёс жизнь самого Арахаса."
 artifact_crown_wardenism_name: "Корона Арахаса"

 artifact_crownofprawladsyl_desc: "#size:15 Древняя Корона Прауладсиля — единственный сохранившийся предмет королевского облачения от любого из древних королей Ойейницы, или, по крайней мере, единственный сохранившийся, который не находится в руках [liches|E] или давно украден другими. Сама корона проста, помята и потёрта, но тяжесть стольких трагедий придаёт ей торжественную и мощную ауру."
 artifact_crownofprawladsyl_modifier: "Корона Прауладсиля"
 artifact_crownofprawladsyl_name: "Корона Прауладсиля"

 artifact_dagun_mask_desc: "Выкованная из чёрного метеоритного железа, эта маска была надета [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFirstNameNicknamed], печально известным ольтенским warlord, жившим в конце XII века. Вместе со своим племянником Дагун завоевал большую часть восточной Айронойской степи и создал одну из величайших ольтенских орд за столетия."
 artifact_dagun_mask_fall_desc: "Выкованная из чёрного метеоритного железа, эта маска была надета [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFirstNameNicknamed], печально известным ольтенским warlord, жившим в конце XII века. Вместе со своим племянником Дагун завоевал большую часть восточной Айронойской степи и создал одну из величайших ольтенских орд за столетия.\n\nВ то время как [jajak_otroka|E] вёл свою могучую орду в авангарде битвы, Дагун командовал «Пепельными всадниками» — элитной группой наездников, которые нападали на вражеские лагеря в глубокой ночи. Многие ольтены стали считать появление чёрной маски дурным предзнаменованием, и немногие горевали, когда этот feared raider наконец встретил свою смерть в бою."
 artifact_dagun_mask_name: "Маска Дагуна «Чёрная маска»"

 artifact_deadlykartharaddimusicautomata_desc: "#size:15 Автомат в форме человека, оснащённый тем, что можно предположить, является высокой [Concept('kartharadd','картараддской')|E] модой эпохи падения Империума, этот автомат предназначен для адекватной игры на картараддской разновидности флейты. Когда его выступление заканчивается, дьявольское устройство опускает инструмент и выпускает dart из механизма, похожего на арбалет, искусно спрятанного за одним из его «глаз», поражая то или того, кому не повезло оказаться прямо перед ним. Умный, хотя, вероятно, трудный в исполнении метод убийства."
 artifact_deadlykartharaddimusicautomata_modifier: "Смертоносный картараддский часовой музыкант"
 artifact_deadlykartharaddimusicautomata_modifier_desc: "Дьявольский способ убить кого-то."
 artifact_deadlykartharaddimusicautomata_name: "Смертоносный картараддский часовой музыкант"

 artifact_kartharaddidancingautomata_desc: "#size:15 Автомат в форме человека, раскрашенный в кричащие цвета и одетый в bizarre clothing, этот конструкт достигает высоты пояса. Если его правильно завести и смазать, он приходит в движение, исполняя серию безумных танцев и играя назойливую мелодию из свистка, который, по-видимому, встроен в его заднюю часть. Когда его выступление заканчивается, он почти начинает звучать так, будто смеётся над вами. Неясно, считали ли картараддцы это чудо инженерии соответствующим хорошему вкусу или нет.\n\nКусочки плохо нанесённой краски указывают на то, что текущая цветовая гамма и одежда автомата, вероятно, были грубо нанесены более поздними [Concept('aversaria','аверсарианцами')|E]. Более пристальное изучение того немногого, что осталось от его оригинального дизайна, настоятельно предполагает, что эта шаловливая маленькая машина когда-то могла быть задумана как нелестное изображение Чистейшего."
 artifact_kartharaddidancingautomata_modifier: "Картараддский часовой танцор"
 artifact_kartharaddidancingautomata_modifier_desc: "Маленький автомат для тех, у кого сомнительный вкус."
 artifact_kartharaddidancingautomata_name: "Картараддский часовой танцор"

 artifact_kartharaddimanautomata_desc: "#size:15 Шедевр утраченного часового искусства [Concept('kartharadd','картараддов')|E], этот гуманоидный автомат возвышается на две головы выше среднего человека и обладает захватывающей артикуляцией, с деликатными стальными пружинами вместо сухожилий и пугающе живыми стеклянными глазами, которые слепо смотрят в пустоту. До своего падения картараддцы прилагали огромные усилия, чтобы сохранить любую информацию об этих шедеврах в секрете, и даже сегодня их предназначение остаётся полной загадкой, горячо обсуждаемой в [Concept('aversaria','аверсарианских')|E] учёных кругах. Некоторые утверждают, что картараддцы создавали армию бесстрашных железных солдат, другие предполагают, что они предназначались для размещения человеческой души в безумной попытке достичь бессмертия. Каковы бы ни были истинные намерения этого проекта, смерть их создателей во время Ночи Кровавой Луны оставила его незавершённым и неодушевлённым. Несмотря на эту путаницу, они всё ещё являются объектами глубокого восхищения и изучения. Известно, что шесть из них сохранились относительно нетронутыми до наших дней, и Майикпрололлан хвастается обладанием двумя из этих бесценных артефактов."
 artifact_kartharaddimanautomata_modifier: "Картараддский человек"
 artifact_kartharaddimanautomata_modifier_desc: "Загадочный пример утраченного искусства."
 artifact_kartharaddimanautomata_name: "Картараддский человек"

 artifact_kartharaddimusicautomata_desc: "#size:15 Автомат в форме человека, оснащённый тем, что можно предположить, является высокой [Concept('kartharadd','картараддской')|E] модой эпохи падения Империума, этот автомат предназначен для адекватной игры на уникальном картараддском струнном инструменте, известном как Жарра. Ещё более впечатляюще, серия труб и мехов в его торсе позволяет ему также имитировать пение. Весёлая мелодия, которую он производит, — это всё, что осталось от музыкальной культуры мёртвой цивилизации."
 artifact_kartharaddimusicautomata_modifier: "Картараддский часовой музыкант"
 artifact_kartharaddimusicautomata_modifier_desc: "Прекрасный пример утраченного искусства."
 artifact_kartharaddimusicautomata_name: "Картараддский часовой музыкант"

 artifact_glass_sword_desc: "Шедевр зелкаванского стеклоделия, Стеклянный клинок — это оружие, которое противоречит культуре своих пацифистских создателей и является мощным символом [Concept('aversaria','аверсарианского')|E] влияния, вдохновляющего их на воинственность."
 artifact_glass_sword_name: "Стеклянный клинок"
 artifact_glass_sword_xipheos_desc: "Шедевр зелкаванского стеклоделия, Стеклянный клинок — это оружие, которое противоречит культуре своих пацифистских создателей и является мощным символом [Concept('aversaria','аверсарианского')|E] влияния, вдохновляющего их на воинственность.\n\nМеч был выкован и прославился тем, что им владел [newly_created_artifact.MakeScope.Var('prominent_creator').Char.GetFirstNameNicknamed], но был взят с трупа своего создателя после его смерти во время [blue_robe_revolt|E]. Легон [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetFirstName] wielded the Glassblade to great effect for the remainder of the war, before being slain in the final battle by [jajak_otroka|E].\n\nВыжившие легионеры Легиона XXXIX «Протемаксос» смогли извлечь клинок, и с тех пор он стал реликвией дома [newly_created_artifact.MakeScope.Var('prominent_wielder').Char.GetHouse.GetName]."

 artifact_greednecklace_desc: "Это железное ожерелье, как утверждается, носил [Concept('aversaria','аверсарианский')|E] военачальник [Concept('demetros_detheniax','Деметрос Железный Шип')|E] на протяжении всего своего правления в Калатипсоми, и часто утверждается, что оно было самым большим инструментом, использованным для обеспечения контроля над севером.\n\nПростая чёрная железная цепь и кулон, на лицевой стороне украшения изображён искажённый лик, застывший в крике, по-видимому, естественное образование, застывшее из расплавленного железа. Вглядываясь в него, невозможно не представить глубины внутри его оскаленного рта и великую цену, чтобы накормить его...\n\nНекоторые говорили, что ожерелье просто принуждает тех, кто слушает его носителя, подчиняться его приказам, в то время как другие утверждают, что оно взимает ужасную плату за эту услугу..."
 artifact_greednecklace_modifier: "Кулон алчности"
 artifact_greednecklace_modifier_desc: "Железное ожерелье с кричащим ликом"
 artifact_greednecklace_name: "Кулон алчности"

 artifact_ice_sculpture: "Ледяная скульптура"
 artifact_jajak_mask_desc: "Богато украшенная маска знаменитого ольтенского военачальника Яяка Отроки. Хотя она не сделана из чистого золота, как легендарная маска Отачеда, эта маска отделана драгоценным металлом и выкована из прочной марндеотиценской стали."
 artifact_jajak_mask_lost_desc: "Богато украшенная маска знаменитого ольтенского военачальника Яяка Отроки. Хотя она не сделана из чистого золота, как легендарная маска Отачеда, эта маска отделана драгоценным металлом и выкована из прочной марндеотиценской стали.\n\nМаска считалась утерянной после того, как Яяк Отрока бросил её в каньоны Айроноя из-за своей неудачи в убийстве Агоса Слина, и многие ольтены верят, что только воин его калибра сможет вновь извлечь маску."
 artifact_jajak_mask_name: "Маска Яяка Отроки"

