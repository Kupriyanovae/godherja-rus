 artifact_bone_staff_explanation: "Некоторые [Concept('dead_magi','Маги Земли')|E] известны тем, что могут создавать могущественные посохи из скелетных останков живых существ. Эти посохи могут быть размером от небольшого жезла до могущественных скипетров выше своего владельца."
