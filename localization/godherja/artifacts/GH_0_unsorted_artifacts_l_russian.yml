 gh_armor_black_sun_description: "Доспех Никанонея «Чёрного Солнца». Хотя он относительно малоизвестен, его кампании на западе и непоколебимая вера в своих людей привели к тому, что солдаты обожествили его."
 gh_armor_black_sun_name: "Доспех Чёрного Солнца"

 gh_helmet_black_sun_description: "Маска Никанонея «Чёрного Солнца». Хотя он относительно малоизвестен, его кампании на западе и непоколебимая вера в своих людей привели к тому, что солдаты обожествили его. Никаноней, умея распознавать возможность, решил использовать их любовь в своих целях. Этот прекрасный шлем был создан для этой цели, скрывая боевые шрамы Никанонея и выставляя его потусторонней фигурой."
 gh_helmet_black_sun_name: "Шлем Чёрного Солнца"

 gh_helmet_skull_helmet_description: "Этот мрачный головной убор был сделан Горассом «Собирателем Черепов» из черепов многочисленных врагов, которых он поверг в бою."
 gh_helmet_skull_helmet_name: "Черепной шлем"

