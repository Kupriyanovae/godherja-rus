l_russian:
 
 artifact_gh_chaos_throne_name: "lirr'kesh ammm"
 artifact_gh_chaos_throne_desc: "Дарованный Богами Пустоты достойному сосуду, этот трон издали невидим, отчего кажется, будто благословенный Владыка парит в воздухе. Лишь приблизившись, можно узреть истинную тьму внутри трона, внутри себя, внутри самой реальности."