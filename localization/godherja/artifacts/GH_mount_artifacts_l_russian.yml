l_russian:
 
 artifact_gh_chaos_throne_name: "Лирр'кеш Аммм"
 artifact_gh_chaos_throne_desc: "Дарованный Богами Бездны достойному сосуду, этот трон невидим на расстоянии — создавая иллюзию благословенного Владыки, парящего в воздухе. Лишь приблизившись, можно увидеть истинную тьму внутри трона, внутри себя, внутри самой реальности."