 book_flaw_biased_author: "Автор книги, очевидно, писал с исключительной предвзятостью, что ставит под сомнение достоверность большей части информации и выводов в книге."
 book_flaw_burned: "На протяжении всей книги видны следы обугливания, и несколько групп страниц повреждены до нечитаемого состояния."
 book_flaw_faded: "Чернила в книге в целом выцвели и их трудно читать, но в некоторых местах текст полностью исчез."
 book_flaw_incomplete: "Работа, по-видимому, никогда не была завершена. Несмотря на многообещающее начало, содержание книги внезапно обрывается по неизвестным причинам."
 book_flaw_ink_damaged: "Разлив чернил повредил значительные части книги, сделав большие разделы нечитаемыми."
 book_flaw_missing_pages: "Несколько страниц книги отсутствуют, возможно, были намеренно удалены."
 book_flaw_none: ""
 book_flaw_redacted: "Многие из наиболее важных страниц книги были зацензурированы Майикпрололланом с помощью шифра Косейрона, искажающего текст и делающего его нечитаемым без соответствующего ритуала. К сожалению, поскольку ритуал утерян, соответствующие главы, вероятно, безвозвратно утеряны."
 book_flaw_superficial: "В работе практически нет оригинальных исследований, большая часть её — просто пересказанная и поверхностная информация из более старых источников."
 book_flaw_water_damaged: "Вода повредила значительные части книги, сделав большие разделы нечитаемыми."

 book_mayikprolollan_commentary_corroborated: "По всему тому разбросаны стандартные пометки Майикпрололлана, в основном подтверждающие утверждения, сделанные в работе. Академия, по-видимому, считала большую часть тома достоверной."
 book_mayikprolollan_commentary_debunked: "По всему тому разбросаны стандартные пометки Майикпрололлана, в основном пытающиеся опровергнуть различные утверждения, сделанные в работе. По-видимому, академия не совсем соглашалась с посланием автора."
 book_mayikprolollan_commentary_enigmatic: "По всему тому разбросаны стандартные пометки Майикпрололлана, но большинству из них не хватает критического контекста, и они ссылаются на концепции и события, которые невозможно понять из самой работы. Академия, по-видимому, знала, что книга является частью какой-то более масштабной истории, но, к сожалению, из этого невозможно вывести её детали."
 book_mayikprolollan_commentary_none: ""
 book_mayikprolollan_commentary_partly_corroborated: "По всему тому разбросаны стандартные пометки Майикпрололлана, содержащие как подтверждения, так и опровержения утверждений работы."

 book_mayikprolollan_relevant_artifact_note_destroyed_accident: "Хотя рассматриваемый артефакт некоторое время находился во владении академии, он был уничтожен в результате «несчастного случая» в ХХХХ. Дополнительные сведения не приводятся."
 book_mayikprolollan_relevant_artifact_note_missing: "Хотя рассматриваемый артефакт в какой-то момент находился во владении академии, сообщается, что он был утерян в какой-то момент по неизвестным причинам."
 book_mayikprolollan_relevant_artifact_note_not_found: "Несмотря на попытки академии найти его, рассматриваемый артефакт не был обнаружен."
 book_mayikprolollan_relevant_artifact_note_present: "Рассматриваемый артефакт также находился во владении академии, по крайней мере на момент подачи заметки, и предоставлен полезный каталожный номер."
 book_mayikprolollan_relevant_artifact_note_stolen: "Хотя рассматриваемый артефакт некоторое время находился во владении академии, он был украден в ХХХХ."

 book_mayikprolollan_seal_type_easy: "Магическая печать слабая и простая — достаточная, чтобы отпугнуть не-[Concept('magi','мага')|E], но легко взламываемая теми, кто имеет базовое понимание соответствующих магических искусств."
 book_mayikprolollan_seal_type_hard: "Магическая печать, скрепляющая этот том, мощная и, вероятно, требует сложного ритуала для открытия — и ещё более мощной магии для взлома."
 book_mayikprolollan_seal_type_medium: "Магическая печать достаточно сильна, и для её взлома, вероятно, потребуется [Concept('magi','маг')|E] с достаточным опытом в соответствующих искусствах."
 book_mayikprolollan_seal_type_very_hard: "Магическая печать, скрепляющая этот том, исключительно мощна, и не было пощажено ни усилий, ни средств, чтобы сделать её неприступной, как крепость. Что бы ни было в этой книге, академия очень хотела, чтобы она не попала в чужие руки."

