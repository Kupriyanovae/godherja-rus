 ## Ragambald Manswel's Bestiarium ##
 artifact_manswelbestiarium_title: "\n\n#size:20 Бестиарий Рагамбальда Мансвела"
 artifact_manswelbestiarium_ghouls_title: "\n\n#size:20 Гули#!"
 artifact_manswelbestiarium_cockatrice_title: "\n\n#size:20 Кокатрикс#!"
 artifact_manswelbestiarium_werewolf_title: "\n\n#size:20 Оборотни#!"

 artifact_manswelbestiarium_page_1: "\n\n#size:15 Предисловие к читателю: Эта работа обошлась мне недешево, ведь она была выплавлена из бесчисленных лет, проведённых в море и в дороге с людьми, давно уже мёртвыми. Повезло мне, что я выжил в тех испытаниях, которые свели меня лицом к лицу с чудовищами, о коих вы скоро прочтёте. Но за всем ужасом я также находил красоту, и за всей свирепостью — любовь. Этим текстом я посвящаю тем, кого я нашёл и кого потерял. Тем же, кто читает в надежде найти собственных зверей для убийства, я могу предложить лишь осторожность. Я слишком много знаю горя, проистекающего от чрезмерной бравады, чтобы советовать то же самое. Воспринимайте мою работу не как поощрение, а как предупреждение и суровую надежду на ваше чудесное выживание. Не многим посчастливилось иметь под рукой такой путеводитель, как вам."
 artifact_manswelbestiarium_page_2: "\n\n#size:15 Гуль — ужасная обезьяна, обитающая в некоторых регионах Саррадона. Издалека он может показаться человеком, но при ближайшем рассмотрении его бесчеловечность очевидна: выступающий лоб, нос, похожий на летучий, пронзительные красные глаза и тело, покрытое грубой чёрной шерстью. Они алчны до плоти, особенно до человеческой. Когда предоставляется выбор, они предпочтут это лакомство всем прочим плодам и мясу. Они обладают талантом к подражанию, которым искусно пользуются, чтобы заманивать неосторожных на гибель. Любопытно, что в последние годы, с началом крестового похода святых в Саррадоне, некоторые богатые [Concept('aversaria','аверсарианцы')|E] сочли модным ввозить запасы этих тварей для своих зверинцев. Сообщается, что они пугливы и с ними легко управляться, если не давать им повода думать, что они имеют преимущество над своим хозяином или превосходят его числом."
 artifact_manswelbestiarium_page_3: "\n\n#size:15 Кокатрикс, известный некоторым как Орёл [aervalr|E], другим — Гранитный Петух, а третьим — Алхимический Дракон, является боготронутым зверем, знаменитым своим ядом, невероятным уродством и зловонным запахом. Наиболее известен его взгляд — пронзительный и смертоносный. Известно, что кокатрикс имеет внутреннюю связь с циклами Эрвала и может преобразовывать мёртвую материю [aeras|E] одним лишь взглядом. По этой причине Мёртвые маги используют этого зверя как геральдический символ. Следует быть осторожным, ибо в полнолуние это чудовище наиболее могущественно. Оно особенно любит превращать кости в камень, что мгновенно убивает любого несчастного, подвергшегося его взгляду."
 artifact_manswelbestiarium_page_4: "\n\n#size:15 Оборотень — это самое двуличное из чудовищ, рождённое самой гнусной магией крови. Аверсарианцы считают, что за их создание ответственны саррадонцы, а саррадонцы нынче полагают, что виноваты аверсарианцы. Эти звери в обычное время выглядят как люди, но в определённые часы их облик искажается и меняется на нечто среднее между человеком и волком, но крупнее того и другого. В эти промежутки они обретают огромную силу. Те из них, кто переживает гнев своих сородичей и доживает до старости, иногда, как говорят, обретают контроль над временем и местом своего превращения. Тем не менее, однажды изменившись, они теряют всякий рассудок, становясь крайне склонными к каннибализму."

 ## The Seventy-Seven Cities of the Greater World ##
 artifact_seventysevencities_title: "\n\n#size:20 Семьдесят семь городов Великого мира"
 artifact_seventysevencities_oraispol_title: "\n\n#size:20 [GetTitleByKey('c_oraispol').GetNameNoTier]"

 artifact_seventysevencities_page_1: "\n\n#size:30 [GetTitleByKey('c_oraispol').GetNameNoTier]#!\n\n#size:15 Можно было бы предположить, что среднему читателю не нужно представление [GetTitleByKey('c_oraispol').GetNameNoTier], колыбели [aversaria|E] и традиционной столицы, но будет благоразумно помнить, что огромные размеры империи означают, что большинство её жителей знают о метрополии лишь как о далёком, смутном символе имперского величия, и не более того. Поэтому правильно, что наше путешествие по [Concept('aeras','Эрасу')|E] начинается в её сердце.\n\nРасположенный на берегах реки Халиум, город имеет происхождение, ныне в значительной степени скрытое туманом времени; историй о его основании — десятки, и каждая фантастичнее предыдущей. Будучи одним из главных полисов [Concept('aversaria','Прото-Аверсарии')|E], он возвысился под покровительством почти легендарного архексира Ораисикса, чьё имя он и будет носить до конца истории. Хотя его удачи взлетали и падали в вечно меняющихся волнах древней аверсарианской политики, в конечном счёте он объединил остальную часть древней Палитаки и Имперского острова под началом Дхаци'эноха, первого аавтократа, в 0 году от И.С., и оставался резиденцией империи на протяжении следующих 700 лет."
 artifact_seventysevencities_page_2: "\n\n#size:15 Однако после [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E] его сменил восточный собрат — [GetTitleByKey('c_asiupoli').GetNameNoTier]. Хотя город несколько уступает в размерах и процветании, он тем не менее остаётся одним из самых почитаемых в [Concept('aversaria','Аверсарии')|E] и местом многих древних традиций — например, большинство аавтократов до сих пор предпочитают короноваться на холме Никаринов в его сердце.\n\nДля города с такой богатой историей неудивительно, что, кажется, на каждом углу есть достопримечательность. Большинство знаменитых мест сосредоточено вокруг великого дворцового комплекса на холме Никаринов — Колонна Чистейшего, Фонтан Вечного Спокойствия и Астротракейон, назовём лишь самые известные примеры. Сами дворцы перестраивались, надстраивались и расширялись бесчисленное множество раз, причём древнейшие сооружения восходят к восстановительным работам архексира Эолиакса'иканы в конце IV века до И.С., после разграбления города Араккариаком."
 artifact_seventysevencities_page_3: "\n\n#size:15 Духовный центр большей части Палитаки также находится поблизости — в храме Арсодиеса, величественном сооружении, построенном среди невероятных руин дворцового комплекса, старше любой записанной истории, и считающемся резиденцией Первого Человека Арсодиеса (который, кстати, во многих мифах также считается основателем города).\n\nПригороды, однако, не менее полны исторических курьёзов, хотя посетители часто их упускают из виду. Очевидно, Арена Маклеи в районе Амария является главным исключением, будучи одним из самых популярных и известных мест всего города; её, кажется, бесконечные кровавые турниры ежедневно собирают толпы размером с небольшой город. Прекрасные бульвары и геометрически правильные улицы Кифениона также заслуживают внимания — это реликвия краткой, но энергичной попытки рационализировать планировку города в конце X века."

 ## Personal Dictations of Chernivmala 'God-Slaver' Cheskovara ##
