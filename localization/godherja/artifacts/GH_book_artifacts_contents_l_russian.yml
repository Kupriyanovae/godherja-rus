 artifact_godslaverdictations_fix_page_1: "\n\n#size:15 (Написано учёным-слугой «Вискалоном», четвёртым из шестидесяти, воскрешённым и поднятым вопреки многочисленным протестам Владыкой и Богом всей вселенной и реальности, Королевой-личом-богиней Чернивмалой «Поработительницей богов» Ческоварой)\n\n«Я сказал — пиши, будь ты проклят! Не смотри вдаль и не бормочи о своих детях, они тоже мертвы! Жалкий мешок костей и пыли. Пиши!»\n\n«Хорошо, теперь слушайте мои слова, слуги и просители. Я, величайшая из всех личей, величайшая из всех богов, Чернивмала Ческовара, порабощающая самих богов своей бесконечной силой, сим повелеваю: я также стала величайшим полководцем в истории этого жалкого мира! Все личи — глупцы, без толку бегающие на Марки с малыми выгодами. Аверсарианцы, однако! Пока марочники — жалкие племенные отбросы, питающиеся грязью, аверсарианцы убили Империум! Жалкое построение жалких мужчин и женщин, думавших, что могут контролировать ЧЕРНИВМАЛУ ПОРАБОТИТЕЛЬНИЦУ БОГОВ ЧЕСКОВАРУ!»"
 artifact_godslaverdictations_fix_page_2: "\n\n#size:15 (Владыка и Бог всей вселенной и реальности, Королева-лич-богиня Чернивмала «Поработительница богов» Ческовара, случайно ~~случайно~~ с огромной преднамеренностью испускает магический взрыв, разрушающий стену её тронного зала)\n\n«Аверсарианцы лишили меня моей мести, но также доказали, что они превосходят жалкого Императора (текст неразборчив) и (текст неразборчив) столь же жалкий совет... (текст неразборчив). (текст неразборчив). (ТЕКСТ НЕРАЗБОРЧИВ). ПОЧЕМУ ЭТО... Мне всё равно, мне всё равно! Я слишком могущественна, чтобы беспокоиться, у меня слишком много дел! Игнорируй это, Черни, игнорируй, простые слова не могут так ошеломить тебя...»\n\n(Владыка и Бог всей вселенной и реальности, Королева-лич-богиня Чернивмала «Поработительница богов» Ческовара пытается кашлянуть в кулак и потереть виски, чтобы снять головную боль, прежде чем осознать, что она больше не может делать таких вещей, а затем дезинтегрирует пробуждённого солдата-слугу «Слоновую Кость XXI» за то, что тот указал на это)"
 artifact_godslaverdictations_fix_page_3: "\n\n#size:15 «Итак, я докажу, что я сильнее всех, и РАЗОРВУ [Concept('aversaria','Аверсарию')|E] в жалкий прах! Они не только могущественнее марочников, но и богаче, и их народ давно привык к рабству. Я пройду ВОСТОК через Личества, на юг в Калатипсоми, и я сожгу их изнутри! Ага! Ахаха! Ахахаха! Ахаха!»\n\n(Владыка и Бог всей вселенной и реальности, Королева-лич-богиня Чернивмала «Поработительница богов» Ческовара «смеётся» в течение 199 секунд)\n\n«Я гений. Я МОГУЩЕСТВЕННА. Чего ещё ожидать от богини! Богини!»\n\n«Теперь прекрати писать. Я хочу созерцать нечто прекрасное. Принесите картину».\n\n(Владыка и Бог всей вселенной и реальности, Королева-лич-богиня Чернивмала «Поработительница богов» Ческовара ждёт 267 секунд, прежде чем появляются слуги-художники)"
 artifact_godslaverdictations_fix_page_4: "\n\n#size:15 «Что это!? Это отвратительно! Я сказала нарисовать меня молодой! Молодой! Они должны увидеть скулы, которые так ясны даже сейчас! Красивый изгиб моего подбородка! Что значит «у меня заячья губа»!? Заячья губа!? Я твоя госпожа, ты гребанный мешок пыли! Я аннигили... ты всё ещё пишешь!? Как ты смеешь!»\n\n(Владыка и Бог всей вселенной и реальности, Королева-лич-богиня Чернивмала «Поработительница богов» Ческовара начинает разбирать учёных-слуг в наказание за"
 artifact_godslaverdictations_fix_page_5: "\n\n#size:15 (Написано учёным-слугой «Вискалоном», четвёртым из тридцати шести, воскрешённым и поднятым ещё пять раз вопреки многочисленным протестам после двух наказательных разборок Владыкой и Богом всей вселенной и реальности, Королевой-личом-богиней и Императрицей Чернивмалой «Поработительницей богов» Ческоварой и тремя разборками странными духами, которых Королева-лич-богиня и Императрица «Поработительница богов» Ческовара настоятельно просила не упоминать без чёткого указания, что они по своей природе ниже её величия и могут быть легко смещены, когда она пожелает)\n\n«Пиши! Я сказала — пиши, поднимай перо! Да! И держи его правильно, я НЕ позволю своим слугам писать как гребаному крестьянину. Хорошо, да, и пиши аккуратнее! Мне насрать, что тебя учили как какого-то второстепенного сброда и неудачника из второго века писать как кретин. Это я дала тебе жизнь, это я управляю тобой, ты пишешь как я хочу, так что пиши аккуратнее, если не хочешь снова оказаться душой, запертой в кости пальца!»"
 artifact_godslaverdictations_fix_page_6: "\n\n#size:15 «Я, Королева-лич-богиня и Императрица Чернивмала Ческовара, Поработительница многих богов, настоящим объявляю четвёртое вторжение на восток оглушительным успехом. Мне плевать, каких слуг оно уничтожает, мне плевать на "потери", которые, по мнению других, несут бесполезные оболочки душ. Несмотря на уничтожение моих сил, я успешно сожгла два дерева почти дотла!»\n\n«Хотя деревья реагировали быстро, моя магия успешно отразила их контратаку с небольшими лишь трещинами, несмотря на их яростный штурм. Без сомнения, восточная долина, какой бы убогой и тревожной она ни была, является дворцом какого-то напуганного бога, который понимает, что Королева-лич-богиня и Императрица Чернивмала Ческовара Поработительница... чёрт, идёт за ними! Ахаха! Ага! Ааааа!»"
 artifact_godslaverdictations_fix_page_7: "\n\n#size:15 (Королева-лич-богиня и Императрица Чернивмала «Поработительница богов» Ческовара смеётся 98 секунд, пока не начинает сильно кашлять 209 секунд; ритуал привязки её чрезвычайно могущественных и великих сил нарушается из-за многочисленных серьёзных ранений, полученных при попытке пересечь пустое поле, которое затем превратилось в бездонную пропасть, взобраться на небольшой холм, который переходил в то, что казалось западным океаном, несмотря на его положение на востоке, или пересечь ручей, из которого сотни каменных рук тянулись и хватали её великолепные ноги. Этот слуга не знает, какое ранение вызвало трещину над её прекрасным черепом без заячьей губы, ибо Королева-лич-богиня и Императрица Чернивмала «Поработительница богов» Ческовара исчезла в лесу на три недели, пока её слуги добросовестно искали её в пределах видимости)"
 artifact_godslaverdictations_fix_page_8: "\n\n#size:15 «Следующее будет окончательным вторжением. Я накопила великие знания. Я знаю их тактику, я знаю их силу! Эти духи там —» (Королева-лич-богиня и Императрица Чернивмала «Поработительница богов» Ческовара настоятельно просила не упоминать их без чёткого указания, что они по своей природе ниже её величия и могут быть легко смещены, когда она пожелает) «— познают истинную силу Поработительницы богов! Закончить диктовку!»\n\n«А теперь вы, двенадцать, назовите мне шестьсот причин, почему я славна и прекрасна. А ты! Как продвигается моя корона!? Ты знаешь, что я сказала Чёрные Горные Кровавые Рубины, а не Этепезейские Кровавые Рубины! Что это!? Я не могу носить такое отвратительное бесполезное барахло! Бесполезные слуги! Глупые кости! Вы не знаете истинной силы!? Я управляю всеми вами! Почему другие, более низшие личи, не имеют дела с такими ИДИОТСКИМИ слугами!?»"
 artifact_godslaverdictations_fix_page_9: "\n\n#size:15 (Королева-лич-богиня и Императрица Чернивмала «Поработительница богов» Ческовара, похоже, готовит какое-то великое заклинание, чтобы наказать своих слуг. Этот слуга считает её сильнейшей и величайшей правительницей во всём существовании и поработительницей богов, как она ритуально заставила его написать, но желает не быть воскрешённым вновь как из-за желания умереть, так и из-за страха перед духами, которых Королева-лич-богиня и Императрица Чернивмала «Поработительница богов» Ческовара настоятельно просила не упоминать без чёткого указания, что они по своей природе ниже её величия и могут быть легко смещены, когда она пожелает. Теперь она, похоже, готовится выпустить закл" # текст обрывается
 artifact_godslaverdictations_fix_page_10: "\n\n#size:15 (Написано учёным-слугой «Вискалоном», четвёртым из пяти, воскрешённым и поднятым ещё двенадцать раз вопреки многочисленным протестам после четырёх наказательных разборок Владыкой и Богом всей вселенной и реальности, Богом всех богов и величайшим из архиличей, Верховной Королевой и Императрицей Чернивмалой «Поработительницей всех богов вселенной» Ческоварой Великолепной и восьми разборок странными духами, которых Владыка и Бог всей вселенной и реальности, Бог всех богов и величайший из архиличей, Верховная Королева и Императрица Чернивмала «Поработительница всех богов вселенной» Ческовара Великолепная настоятельно просила не упоминать без чёткого указания, что они по своей природе ниже её величия и могут быть легко смещены, когда она пожелает)\n\n«ПИШИ. Я. УБЬЮ. ИХ. ВСЕХ.»"
 artifact_godslaverdictations_fix_page_11: "\n\n#size:15 «Я СОЖГУ ДЕРЕВЬЯ. Я РАЗГРАБЛЮ ЛЕСА. Я ВЕЛЮ ВСЯКОМУ ВОРОБЬЮ И ВСЯКОМУ ОЛЕНЮ БЫТЬ ОБОДРАННЫМИ И ВЫСТАВЛЕННЫМИ ПЕРЕД ДОЛИНОЙ, ЧТОБЫ ПОКАЗАТЬ ЭТИМ ДУХАМ (Бог всех богов и величайший из архиличей, Верховная Королева и Императрица Чернивмала «Поработительница всех богов вселенной» Ческовара Великолепная настоятельно просила не упоминать их без чёткого указания, что они по своей природе ниже её величия и могут быть легко смещены, когда она пожелает), ЧТО Я БОГИНЯ. ЭТИ ДУХИ (Бог всех богов и величайший из архиличей, Верховная Королева и Императрица Чернивмала «Поработительница всех богов вселенной» Ческовара Великолепная настоятельно просила не упоминать их без чёткого указания, что они по своей природе ниже её величия и могут быть легко смещены, когда она пожелает), ДУХ (Бог всех богов и величайший из архиличей, Верховная Королева и Императрица Чернивмала «Поработительница всех богов вселенной» Ческовара Великолепная настоятельно просила не упоминать их без чёткого указания, что они по своей природе ниже её величия и могут быть легко смещены, когда она пожелает) ИЛИ НЕТ, НЕ ВОЗЬМУТ ВЕРХ НАДО МНОЙ! МНОЙ!»"
 artifact_godslaverdictations_fix_page_12: "\n\n#size:15 (Бог всех богов и величайший из архиличей, Верховная Королева и Императрица Чернивмала «Поработительница всех богов вселенной» Ческовара Великолепная начинает пронзительно кричать от боли, когда её искусно созданная привязка начинает разрушаться. Этот слуга теряет зрение, когда его магическое зрение, щедро подаренное Богом всех богов и величайшим из архиличей, Верховной Королевой и Императрицей Чернивмалой «Поработительницей всех богов вселенной» Ческоварой Великолепной после его воскрешения, ослепляется громким устройством, создающим яркую вспышку, брошенным одним из живых в доспехах. Этот слуга слышит звуки криков и гнева. Этот слуга теперь слышит, как Бог всех богов и величайший из архиличей, Верховная Королева и Императрица Чернивмала «Поработительница всех богов вселенной» Ческовара Великолепная кричит от боли и ярости. Этот слуга слышит, как его госпожа выпускает великое заклинание. Этот слуга слышит, что звучит как clash of weapons. Этот слуга чувствует, как топор вонзается в его позвоночник. Этот слуга слышит, как один из живых восклицает, что этот слуга всё ещё пишет. Этот слуга слыши..."
 artifact_godslaverdictations_fix_page_13: "\n\n#size:15 «Я найду способ, СПОСОБ. Я не знаю, как эти духи (Бог всех богов и величайший из архиличей, Верховная Королева и Императрица Чернивмала «Поработительница всех богов вселенной» Ческовара Великолепная настоятельно просила не упоминать их без чёткого указания, что они по своей природе ниже её величия и могут быть легко смещены, когда она пожелает) могут сбивать с толку такую великую, как я, но я НЕ буду побеждена. Я та, кто сбежала. Все остальные жили как зловонные твари, умирающие рабы с кровью в пузырьке в ящиках Императора. Я, никто, кроме жалкой маленькой девочки, маленького ничтожного отброса на краю края цивилизации, без отца или матери, которые могли бы помочь мне, я та, кто вытащила себя через Девять Кругов Магов. Я стала лидером Ритуальных Рабов Императора (текст неразборчив) для (текст неразборчив) ПРОКЛЯТЬЕ, ПРОКЛЯТЬЕ, ПРОКЛЯТЬЕ." # Текст обрывается
 artifact_godslaverdictations_fix_page_14: "\n\n#size:15 «Они сказали мне, они сказали мне, Вискалон. Они сказали мне, что я умру там. Император потребовал, чтобы я умерла за их службу, как и все остальные. Что моя кровь принадлежит им. Это НЕ ТАК. Моя кровь — ЭТО МОЯ кровь. Моё существо — ЭТО МОЁ существо. Я не какой-то инструмент! Я не какой-то инструмент, Вискалон! Я могущественна, я ДОКАЗАЛА себя как БОГ! Они охотились на меня как на собаку после того, как я украла филактерию, мне пришлось ползти лигами через подлесок и прятаться в древних гробницах и пещерах, чтобы просто сбежать. Я была девочкой! Мне не было и двадцати лет! И я сделала такое! Я нашла ту древнюю силу, я выучила шаги, я пришла в Личества, я УЗУРПИРОВАЛА жалкого лича Ультина Ультриникса, и я доказала, что я могуча! Я поклялась, что никто больше не одолеет меня, я ПОКЛЯЛАСЬ, что никогда не буду жить меньше того, что я заслужила!»\n\n«Вискалон! Ты слушаешь, мешок пыли!? Да? Спасибо. Спаси... пожалуйста, Вискалон. Я приказываю тебе, скажи мне, почему я славна. Сообщи мне о моей славе.»"
 artifact_godslaverdictations_fix_page_15: "\n\n#size:15 (Этому слуге было приказано больше не писать ничего, кроме слов госпожи, по причине того, что комментарии этого слуги были «неправдивыми», «неуважительными» и «мятежными». Этот слуга произносил добрые слова в течение 1024 секунд с минимальными паузами благодаря щедрой практике, данной Богом всех богов и величайшим из архиличей, Верховной Королевой и Императрицей Чернивмалой «Поработительницей всех богов вселенной» Ческоварой Великолепной в том, как правильно восхвалять её. Этот слуга представляет свою жену, когда делает это.)\n\n«Спасибо. Да. Мне это было ну... Мне ничего не нужно, я Богиня! Теперь я исцелюсь, я восстановлюсь. Я вновь соберу свои легионы, я вернусь на восток, и Я ПОКАЖУ ИМ, ЧТО... что? Ты слышишь что-то? Кто смеет разрушать двери моего ужасного дворца!? Что это значит!? Живая плоть и кости, марширующие в оловянных доспехах и несущие металлические палки!? Вы думаете, что можете убить лича!? Вы думаете, что достойны даже любоваться моим присутствием!?»"
 artifact_godslaverdictations_fix_page_16: "\n\n#size:15 (Этому слуге было приказано больше не писать ничего, кроме слов госпожи, по причине того, что комментарии этого слуги были «неправдивыми», «неуважительными» и «мятежными». Поэтому разговоры живых, пришедших, надеюсь, убить этого слугу, не записываются.)\n\n«Ахаха! Рыцарь! Рыцарь в моём замке! Рыцарь, который умрё... умрёт! Я могущественна! Могущественна!»"
