 artifact_pocketguideaversaria_page_1: "\n\n#size:15 Добро пожаловать, дорогой читатель, в любезный карманный путеводитель по различным наместничествам [Concept('aversaria','Аверсарии')|E]. Возможно, вы и сами аверсарианец, желающий узнать о братских и сестринских культурах, с которыми вы разделяете радости и славу нашей прекрасной империи. Возможно, вы низшей крови, зовёте своим домом суровые северные земли или палящие пустыни, а может быть, вы даже грамотный раб, читающий своему законному хозяину по его требованию! Это не важно, ибо человек вы или чужеземец, вы тоже можете насладиться взглядом на мир, который населяют чистейшие люди. Аверсария — процветающая и растущая империя, и конца её росту не видно, и, возможно, однажды она охватит все уголки мира, каким мы его знаем. Посему нет оправдания не узнать её мощи и славы, а также прекрасных и сложных культур, которые зовут её домом!\n\nБлагословлённый Чистейшим, Первыми людьми и славным аавтократом Эолом (да продлится его правление!), посему я посвящаю эту серию путеводителей чудесным народам, населяющим нашу империю. Спасибо, дорогой читатель, и я молюсь, чтобы вы нашли в этих словах и образах то, что восхитит вас, и вы мечтали о дне, когда встретите великих людей Аверсарии!"
 artifact_pocketguideaversaria_page_2: "\n\n#size:15 Родина Империи\n\nСуровые и властные, жители Этепезеи породили больше аавтократов, чем любое другое наместничество, и провозглашают славное достижение — быть основателями прекрасной [Concept('aversaria','Аверсарии')|E]. Именно в множестве городов-государств, усеивавших побережье Имперского острова и западной Палитаки, родилась наша любимая империя, и именно народы этих городов создали культуры, которые в ней заключены.\n\nЭтепезейцы известны своим благородным поведением. Не место западу показывать излишнюю роскошь или зацикливаться на изысках и силе мечей. Вместо этого западные люди известны тем, что показывают силу через власть, полагаясь на свою репутацию, острый ум и славу своей истории. Из всех народов в этом сочинении (за исключением, возможно, колонистов) этепезейцы, вероятно, самые сдержанные. Зачем тратить время и богатства, демонстрируя свою силу, когда она так известна? Настолько пропитаны традициями западные люди, что они до сих пор называют своих величайших чемпионов «Дракарстатарокс» — современное искажение древнего слова «Драконьи солдаты». Действительно, именно этепезейцы первыми приручили и оседлали могучих и коварных драконов и использовали их мощь для создания того, что впоследствии стало Аверсарией.\n\nЗападная архитектура стара и могуча. Построенная на великих руинах Первых людей, этепезейцы подражали их стилю, возводя новые крепости среди разбросанных остатков старых. Эта архитектура издавна известна как «Аэкорсдиксианская» или «протоаверсарианская», и включает в себя широкие арки и сложные цветочные узоры, как у древних, наряду с более «современной» архитектурой, такой как аверсарианская колонна."
 artifact_pocketguideaversaria_page_3: "\n\n#size:15 Земля Горного Солнца\n\nОпахасийцы! Что можно сказать о самом своеобразном народе [Concept('aversaria','Аверсарии')|E]. Наследники великой веры и знаний, люди Опахасии, как говорят, происходят от жрецов-царей, правивших с горных вершин, пока они не были свергнуты превосходящей мощью Аверсарии. Хотя они не унаследовали кровь этих царей, они унаследовали их храмы, которые, как многие полагают, поклонялись тому, что могло быть искажённой имитацией аверсарианской религии. Без сомнения, варвары, когда-то сидевшие в этих залах, с тоской взирали на запад, молясь, чтобы подражание могло обеспечить им собственную чистоту.\n\nОпахасийцы известны своими громкими заявлениями о возвышенности. Они носят древние одеяния поверх современных доспехов и одежды, утверждая, что бесконечная линия поклонения Чистейшему и право этих древних варваров-жрецов дают им законное право называться самыми верными в империи. Пир у опахасийцев нельзя пропустить! Ибо они действительно пойдут на любые расходы, чтобы гость знал об их славе. Только помните не упоминать восток! Народы Айроноя и Опахасии издавна являются соперниками, и вы непременно услышите несколько крепких словечек, если упомянете их восточных соседей. Но не волнуйтесь! Дети Аверсарии, как всегда, едины, и два народа так же часто встречаются для добросовестной торговли или обмена беглыми рабами, как и для набегов и разорения друг друга, и аавтократ всегда будет следить, чтобы мелкие распри не поглотили могучую Аверсарию. Архитектура Опахасии делает акцент на демонстрации богатства и благочестия. Позолоченные изображения Чистейшего и Первых людей видны в каждом городе, а опахасийцы известны тем, что строят на древних руинах Первых людей и украшают их драгоценными камнями, чтобы усилить их красоту. Хотя многие указывали, что многие из тонких металлов на их памятниках облупляются или ржавеют, опахасийцы, у которых я спрашивал, гордо говорили мне, что они просто видят в этом пережиток красоты..."
 artifact_pocketguideaversaria_page_4: "\n\n#size:15 Железная твердыня\n\nДолина Митидона — древняя и плодородная земля. Хотя её фермы сильны, ещё сильнее мощь минеральных богатств. Малькойцы — народ суровый, но иначе, чем их предки в Этепезее. Малькойцы ценят простое железо и металлы и предпочитают жить в крепких укреплениях, а не в роскошных дворцах. Символ малькойцев — железная цепь, которой они контролируют самое большое население рабов и слуг среди всех наместничеств. Они даже имеют честь быть единственными хозяевами, которые никогда не сталкивались с настоящим восстанием рабов, чем они гордятся; северные кузницы Малькои вечно поставляют бесконечный поток оружия и припасов для славных легионов [Concept('aversaria','Аверсарии')|E].\n\nМалькойцы, под стать своему суровому нраву, едят простую пищу и носят простую одежду. Обычный малькойец предпочтёт знать, что у него есть запас провизии на месяц, чем один день пиршества, но не волнуйтесь! Хотя железная хватка отцовская и никогда не отпустит цепей их рабов, малькойцы — одни из самых добрых в Аверсарии. Только в малькойском доме вы можете сидеть в безопасности и знать, что никакое предательство вас не постигнет, ибо малькойцы чужды интригам и изменам. Ешьте сытное рагу и чёрный хлеб и наслаждайтесь тёплым обществом закалённых ветеранов и твёрдых купцов, которые зовут север домом. Малькоя также является родиной ийроссов.\n\nАрхитектура Малькои — урезанная и голая. Вместо памятников и храмов малькойцы предпочитают укрепления, чтобы их рабы знали о тщетности попыток восстать против детей Чистейшего. Хотя вы можете не найти самого большого комфорта или красоты в городе долины, вы точно не найдёте места безопаснее..."