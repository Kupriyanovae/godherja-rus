l_russian:
 ## Ice Sculptures
 artifact_ice_sculpture_name: "Ледяная скульптура [inter_in_ice_prisoner_scope.GetTitledFirstName]"
 artifact_ice_sculpture_description: "Застывший лик [inter_in_ice_prisoner_scope.GetTitledFirstName], навечно сохраненный во льду. Это служит мрачным напоминанием о той экзотической и потусторонней магии, которой владеет [owner.GetTitledFirstName], и о возможной участи любого, кто перейдет ему дорогу."
 artifact_ice_sculpture_description.brave: "Бесстрастный лик [inter_in_ice_prisoner_scope.GetTitledFirstName], навечно сохраненный во льду. Это служит мрачным напоминанием о той экзотической и потусторонней магии, которой владеет [owner.GetTitledFirstName], и о возможной участи любого, кто перейдет ему дорогу."
 artifact_ice_sculpture_description.neutral: "Испуганный лик [inter_in_ice_prisoner_scope.GetTitledFirstName], навечно сохраненный во льду. Это служит мрачным напоминанием о той экзотической и потусторонней магии, которой владеет [owner.GetTitledFirstName], и о возможной участи любого, кто перейдет ему дорогу."
 artifact_ice_sculpture_description.craven: "Ужаснувшийся лик [inter_in_ice_prisoner_scope.GetTitledFirstName], навечно сохраненный во льду. Это служит мрачным напоминанием о той экзотической и потусторонней магии, которой владеет [owner.GetTitledFirstName], и о возможной участи любого, кто перейдет ему дорогу."

 daukeni_sjalvolki_1.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «[owner.GetName] заморозил того, кого не смогли сломить Десять Деревьев.» #!"
 westernimperial_aeschraes_aagiokrata_1.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Похоже, за эти годы у него заледенело не только сердце.» #!"
 easternimperial_aironoian_aagiokrata_1.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Холодный прием ожидал реформатора, но не только.» #!"
 apokiakas_aversarinas_aagiokratia_23.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Спорно, что Черное Солнце все еще не так холодно, как его личность.» #!"
 apokiakas_militant_cliques_1.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Достойный конец для Зимнего Легиона, хотя и без тени, под которой можно умереть.» #!"
 voyagen_lifepath_8.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Черный Бастард стоит неподвижно, его тело застыло, как и его великие устремления.» #!"
 scusstari_iyrossi_aagiokrata_13.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Даже во льду Черный страж, без сомнения, кипит от неоплаченных долгов.» #!"
 southernimperial_aversarian_gorassos_1.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Хочется верить, что у Горасса была потрясающая личность, если лед точен, ибо похоже, что тот, кто заморозил этого безумца, уронил статую лицом вниз несколько десятков раз.» #!"
 westernimperial_omitilos_aagiokrata_2.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Заточенный в этом льду, Койс правит так же, как и всегда.» #!"
 westernimperial_omitilos_aagiokrata_1.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Замерзшие пальцы не играют ловко на марионетке.» #!"
 voyagen_lifepath_7.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Заточенный в одиночестве во льду, Бенуэ выглядит... испуганным, словно не понимает, что такая жестокость вообще возможна.» #!"
 tasurmad_harthahi_1.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Давным-давно где-то в пустыне Отец Саррадона, вероятно, желал быть таким же холодным, как сейчас.» #!"
 curgerski_sjalvolki_2.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Огонь в его чреслах едва ли можно было сдержать этой холодной магией.» #!"
 vrodkin_sjalvolki_1.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Будем надеяться, что он веселится в смерти лишь наполовину так же, как в жизни, ибо и небесам, и аду было бы трудно сдержать такое веселье.» #!"
 centralislander_aversarinas_aagiokrata_1.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Кто знал, что ледяные скульптуры бывают такими низкими!» #!"
 caemansi_sjalvolki_14.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Говорят, что хорошая заморозка наращивает мышцы. Однако, похоже, это не работает...» #!"
 fenvir_sjalvolki_1.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Все такой же закостенелый, как всегда...» #!"
 southernimperial_aversarinas_aagiokrata_30.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Тепло сердца этого человека мало что могло сделать против такой ледяной магии.» #!"
 southernimperial_manikos_aagiokrata_1.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Ну, Мегист сказал бы, что Мегист делает лучшую статую Мегиста!» #!"
 kawoch_mogowai_9.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Возможно, его глаза все еще видят через озеро.» #!"
 easternimperial_aversarinas_aagiokrata_7.epitaph: "[newly_created_artifact.GetDesc]\n\n #weak «Всегда говорили, что интеллект Холодного можно измерить температурой ледника...» #!"