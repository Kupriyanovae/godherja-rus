l_russian:
 proving_grounds_mammoth_caravan_domicile_building: "Караван мамонтов"
 proving_grounds_mammoth_caravan_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('proving_grounds_01').GetName])#!\nСтадо выносливых мамонтов, великих зверей [Glossary( 'Древнего Севера', 'OLD_NORTH_GLOSS' )], — зрелище одновременно #E MP величественное и устрашающее#! Кто посмеет противостоять тому, кто повелевает ими?"
 proving_grounds_mammoth_caravan.tt.ate_mammoths: "Вы недавно съели своих мамонтов"

 beetle_yurt_01_domicile_building: "[SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')] наездников на скарабеях"
 beetle_yurt_01_domicile_building_desc: "Скромный загон, где разводят выносливых больших скарабеев для упряжки колесниц. Дрессировщики обучают основам ориентирования в пустыне и воспитывают нрав, необходимый, чтобы управлять этими могучими зверями."
 beetle_yurt_02_domicile_building: "$beetle_yurt_01_domicile_building$"
 beetle_yurt_02_domicile_building_desc: "Улучшенные методы разведения дают более сильных скарабеев. Экипажи колесниц упражняются в пыльных бурях, повышая свою боевую выучку."
 beetle_yurt_03_domicile_building: "$beetle_yurt_01_domicile_building$"
 beetle_yurt_03_domicile_building_desc: "Особый корм и доспехи делают скарабеев и их колесницы быстрее и выносливее. Ветераны делятся приёмами господства в глубокой пустыне."
 beetle_yurt_04_domicile_building: "$beetle_yurt_01_domicile_building$"
 beetle_yurt_04_domicile_building_desc: "Отборных скарабеев облачают в усиленную упряжь, а построения колесниц теперь используют дюны для засад, наводя ужас на всю пустыню."
 beetle_yurt_05_domicile_building: "$beetle_yurt_01_domicile_building$"
 beetle_yurt_05_domicile_building_desc: "Выведена легендарная порода скарабеев, способных к долгим переходам по глубокой пустыне. Колесничие учатся выполнять сложные манёвры на зыбучих песках."
 beetle_yurt_06_domicile_building: "$beetle_yurt_01_domicile_building$"
 beetle_yurt_06_domicile_building_desc: "Вершина мастерства в обращении со скарабеями. Колесницы становятся неудержимой силой, а их громовые атаки превращают пустыни в кладбища."

 sand_skiff_yurt_01_domicile_building: "[SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')] песчаных скифов"
 sand_skiff_yurt_01_domicile_building_desc: "Простейшая ремонтная мастерская для бесценных [Concept('sand_skiffs','песчаных скифов')|E]. Уважаемые члены клана учатся использовать их скорость, улучшая и передвижение, и торговлю среди дюн."
 sand_skiff_yurt_02_domicile_building: "$sand_skiff_yurt_01_domicile_building$"
 sand_skiff_yurt_02_domicile_building_desc: "Лучший уход увеличивает дальность хода скифов. Обозы перенимают их слаженность, позволяя отрядам налётчиков дольше оставаться в глубокой пустыне."
 sand_skiff_yurt_03_domicile_building: "$sand_skiff_yurt_01_domicile_building$"
 sand_skiff_yurt_03_domicile_building_desc: "[Concept('sand_skiffs','Песчаные скифы')|E] приспосабливают для разведки. Отряды налётчиков осваивают тактику «ударил — отступил» и с молниеносной быстротой достигают более далёких целей."
 sand_skiff_yurt_04_domicile_building: "$sand_skiff_yurt_01_domicile_building$"
 sand_skiff_yurt_04_domicile_building_desc: "Пути скифов поддерживают жизнь отдалённых оазисов. Поселения растут вместе с торговыми сетями, а конные набеги становятся смертоноснее."
 sand_skiff_yurt_05_domicile_building: "$sand_skiff_yurt_01_domicile_building$"
 sand_skiff_yurt_05_domicile_building_desc: "Мастера-ремесленники способны вернуть [Concept('sand_skiffs','песчаным скифам')|E] почти былое великолепие. Кормчие стали символами культуры, вызывая восхищение и подстёгивая развитие."
 sand_skiff_yurt_06_domicile_building: "$sand_skiff_yurt_01_domicile_building$"
 sand_skiff_yurt_06_domicile_building_desc: "Последние хранители знаний о скифах творят чудеса. Отряды налётчиков почти не несут потерь в пустыне, торговля процветает, а имя клана разносится с каждым порывом ветра."
