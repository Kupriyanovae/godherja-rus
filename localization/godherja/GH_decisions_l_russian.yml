 gh_formation_decisions.0002.t: "Провозглашена автократия Акрапиргос"
 gh_formation_decisions.0002.opening: "До нас дошли вести с островов..."
 gh_formation_decisions.0002.desc: "[scope:aautokrator.GetTitledFirstName], [scope:aautokrator.GetTitledName], провозгласил державу [title:e_insular_aautokrata.GetFullName], утвердив свое владычество над Башенными островами и окружающими морями. Море Империй стало Империей Моря."
