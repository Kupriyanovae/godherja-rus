 ####################################
 ## Kingdom of the Kasiryat (Eastern Settlers)
 ####################################
 form_kasiryat_kingdom_decision: "Основать новое королевство на Касиряте"
 form_kasiryat_kingdom_decision_desc:0 "#flavor Они пришли из далеких земель: тевгомбрийские братья по мечу, проложившие путь; воины-змеи из рода Балаури, хранящие древние обычаи; народ Изикалек, читающий знамения по небесам. Каждый из них прибыл вдоль [Glossary('реки Касирят','kasiryat_encyclopedia_desc')] и обрел мир процветания.#!\n\nГород Атерисполь и окружающие его земли теперь стали нашим домом, купленным кровью и потом. Пусть законы и титулы утвердят то, что уже совершено на деле: Касирят принадлежит тем, кто сделал его своим."
 form_kasiryat_kingdom_decision_tooltip:0 "Заявить права на Атерисполь и Касирят и официально основать новое государство."

 # Effect tooltips
 form_kasiryat_kingdom_title_effect_tt:0 "Основать Королевство Касирят; Атерисполь будет укреплен, чтобы стать столицей нового государства поселенцев.\n\n#flavor Название королевства будет отражать ваше культурное происхождение.#!"
 kasiryat_kingdom_formed_fervor_desc:0 "В Касиряте провозглашено королевство; вера поселенцев окрепла благодаря новой родине."

 # Modifier
 kasiryat_settler_capital_modifier: "Оплот поселенцев"
 kasiryat_settler_capital_modifier_desc: "Атерисполь был укреплен поселенцами, а его строительный потенциал расширился в знак новой роли как пограничной столицы Касирята."

 # Titles
 k_kasiryat_adj: "Касирятский"

 ####################################
 ## Insular Aautokrata (Tower Isles)
 ####################################
 form_isles_aautokrata_decision: "Создать автократию Акрапиргос"
 form_isles_aautokrata_decision_desc:0 "Море не принадлежит тем, кто лишь смотрит на него с берега. Оно принадлежит тем, кто бороздит его волны. [Glossary('Акрапиргос','tower_isles_encyclopedia_desc')] образует отдельный мир — владение ветра, соли и амбиций. Любой, кто правит здесь, делает это с властью автократора, подобно тому как правила [aversaria|E]. Держава, возвышающаяся над смертными королевствами, благословенная божественным человечеством."
 form_isles_aautokrata_decision_tooltip:0 "Выковать автократию Акрапиргос из островных королевств Башен."

 # Requirement tooltips
 form_isles_aautokrata_kingdoms_tt:0 "У вас должно быть не менее трех титулов ранга королевства"
 form_isles_aautokrata_no_continental_tt:0 "Вы не должны владеть провинциями за пределами регионов [GetGeographicalRegion('tower_isles_biozone').GetName], [GetGeographicalRegion('central_isles_biozone').GetName], [GetGeographicalRegion('guillate_rocks_biozone').GetName] или [GetGeographicalRegion('the_isles_biozone').GetName]"

 # Modifier
 isles_aautokrata_founder_modifier: "Владыка Акрапиргоса"
 isles_aautokrata_founder_modifier_desc: "Этот персонаж вписал свое имя в историю, закрепив за собой владычество над [shatteredisles|E]."

 # Titles
 e_isles_aautokrata_adj: "Акрапиргосский"

 # Legend
 legend_chronicle_new_title_e_isles_aautokrata: "Основание автократии Акрапиргос"

