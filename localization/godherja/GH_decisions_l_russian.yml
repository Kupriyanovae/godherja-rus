gh_formation_decisions.0002.desc: "[scope:aautokratir.GetTitledFirstName], [scope:aautokratir.GetTitledName], провозглашает [title:e_insular_aautokrata.GetFullName], утверждая свою власть над Башенными островами и окружающими морями. Море Империй превратилось в Империю Моря."
