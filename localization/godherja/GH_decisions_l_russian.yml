####################################
## Kingdom of the Kasiryat (Eastern Settlers)
####################################
form_kasiryat_kingdom_decision: "Основать новое королевство на Каширьяте"
form_kasiryat_kingdom_decision_desc:0 "#flavor Они пришли из далеких земель: братья по мечу из теугомбрийцув, проложившие дорогу; воины-змеи из балауров, хранящие древние традиции; и изикалеков, читающий знамения по небесам. Каждый из них шёл вдоль [Glossary('Каширьята','kasiryat_encyclopedia_desc')] и нашёл здесь процветающий край.#!\n\nГород Атерисполь и окружающие его земли стали нашим домом, за который пролито немало крови и пота. Пусть же отныне по закону и титулам закрепится то, что уже доказано делами: Каширьят принадлежит тем, кто сделал его своим."
form_kasiryat_kingdom_decision_tooltip:0 "Заявить права на Атерисполь и Каширьят и официально основать новое королевство."

# Effect tooltips
form_kasiryat_kingdom_title_effect_tt:0 "Основать Королевство Каширьят; Атерисполь укрепляется и становится столицей нового государства поселенцев.\n\n#flavor Название королевства будет отражать ваше культурное происхождение.#!"
kasiryat_kingdom_formed_fervor_desc:0 "В Каширьяте провозглашено королевство; вера переселенцев укрепляется в их новом доме."

# Modifier
kasiryat_settler_capital_modifier: "Оплот поселенцев"
kasiryat_settler_capital_modifier_desc: "Атерисполь был укрепилен народами-поселенцами, а его градостроительный потенциал возрос в признание новой роли столицы на рубежах Каширьята."

# Titles
k_kasiryat_adj: "Каширьятск"

####################################
## Insular Aautokrata (Tower Isles)
####################################
form_isles_aautokrata_decision: "Основать Акрапиргскую Аавтократию"
form_isles_aautokrata_decision_desc:0 "Море не принадлежит тем, кто лишь смотрит на него с берега. Оно принадлежит тем, кто бороздит его волны. [Glossary('Акрапирг','tower_isles_encyclopedia_desc')] образуют свой собственный мир — обитель ветров, соли и великих амбиций. Любой, кто властвует здесь, правит с силой Аавтократора, как это делала [Concept('aversaria','Аверсария')|E]. Это владычество превыше смертных королевств, благословенное божественной природой человечества."
form_isles_aautokrata_decision_tooltip:0 "Создать Акрапиргскую Аавтократию из островных королевств Башенных островов."

# Requirement tooltips
form_isles_aautokrata_kingdoms_tt:0 "Удерживать как минимум три титула королевского уровня"
form_isles_aautokrata_no_continental_tt:0 "Не иметь владений за пределами регионов [GetGeographicalRegion('tower_isles_biozone').GetName], [GetGeographicalRegion('central_isles_biozone').GetName], [GetGeographicalRegion('guillate_rocks_biozone').GetName] или [GetGeographicalRegion('the_isles_biozone').GetName]"

# Modifier
isles_aautokrata_founder_modifier: "Владыка Акрапиргия"
isles_aautokrata_founder_modifier_desc: "Этот персонаж вписал своё имя в историю, закрепив власть над [Concept('shatteredisles','Расколотыми островами')|E]."

# Titles
e_isles_aautokrata_adj: "Акрапиргск"

# Legend
legend_chronicle_new_title_e_isles_aautokrata: "Основание Акрапиргской Аавтократией"

