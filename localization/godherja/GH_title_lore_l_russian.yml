l_russian:
 # The Reach
 #c_ciderwell_desc: "This [county|E] has been covered in apple orchards since Kathanouxaic times, and its cider is known as some of the finest on the Shattered Coast."

 # Cornucopia
 c_gamlaberget_desc: "Это [Concept('county','графство')|E] хорошо известно своими многочисленными клановскими руинами, что указывает на то, что некогда здесь располагался крупный торговый порт, покинутый по неизвестным причинам."
  
 # Nattanan Region 
 c_nalmicn_quha_desc: "[Glossary('Налмикн Куха','GH_NALMICN_QUHA_GLOSS')] — пристанище изгоев, отступников и еретиков. \n\n #color_dark_grey;italic \"Также на третий год моего правления я возвратил добродетель в храм Аункана, ставший обителью великого зла, чьи жрецы опозорили свой сан и (неразборчиво). Я изгнал их в Налмикн Куха дабы страдали они средь негодяев, почитателей Корлаку, сошедших-с-тропы, (неразборчиво) и пожирателей сверчков, ибо преступление их пред Богами-близнецами было столь велико, что даже смерть их не вернула бы земле гармонии"#!$c_paths_edge_quote_attribution$"
 c_nalmicn_quha_quote_attribution: "\n  #color_dark_grey;italic ~ Таратало Шлаб#!" 
 c_sugusuleaa_sugukya_desc: "The [Glossary('Сугусулеа Сугукья','GH_SUGUSULEAA_SUGUKYA_GLOSS')] — край холмов на границе наттананской цивилизации. Местные жители занялись выпасом овец и прочей одомашненной скотины вместо охоты, как то предписывает Йернейм, и потому зовутся сугусулеа, что означает «слабые охотники»"
 c_sogo_tom_desc: "[Glossary('Сого Том','GH_SOGO_TOM_GLOSS')] — изолированная джунглевая долина где наттананы на протяжении бесчисленных лет сдерживали всех, кто угрожал их землям. Древняя крепость в горах на западе хранит древние руны, которые, по слухам, некогда дарили защиту, но ныне служит в основном перевалочным пунктом для путников."
 c_chan_jerniem_suleaan_desc: "[Glossary('Чан Йернейм Сулеан','GH_CHAN_JERNIEM_SULEAAN_GLOSS')], как говорят, является излюбленным охотничьим угодьем Йернейма-Охотника, что делает его почитаемым местом паломничества для тех, кто следует его путём."
 c_nen_nachan_desc: "[Glossary('Нен Начан','GH_NEN_NACHAN_GLOSS')] — край густых холмов и глубоких ущелий. \n\n #color_dark_grey;italic \"С присущим ему низким коварством, Тет Наун Зин избрал Змеиную Тропу, что вьётся сквозь Нен Начан, путём своего наступления; и это вопреки всем советам, ибо край сей известен своими коварными ущельями, в коих не один несчастный путник расстался с жизнью. Это безрассудство стоило царю половины его войска к тому времени, как он наконец достиг Кхупонга." #!$c_dense_crags_quote_attribution$"
 c_dense_crags_quote_attribution: "\n  #color_dark_grey;italic ~ Сандаловые хроники#!" 
 c_nat_kan_desc: " [Glossary('Нат Кан','GH_NAT_KAN_GLOSS')] — место, где Боги-близнецы сразили Аккхарадхамму Бессмертного также известного как [Glossary('Акхар Фреча','GH_AKKHAR_FRECHA_GLOSS')] что веками порабощал север. Гробницу его вечно охраняют духи мёртвых, связанные клятвой не дать ему восстать вновь из глухого источника под холмами и руинами его твердыни."
 c_korle_lehtor_desc: "Когда Корлаку восстал против Богов-близнецов, он искал место, дабы утвердить своё владычество. В [Glossary('Корле Лехтор','GH_KORLE_LEHTOR_GLOSS')], что в [Glossary( 'Чан Кьявкорлаку', 'GH_CHAN_KYAWKORLACU_GLOSS' )], он воздвиг могучую крепость из металла и камня. Легенда гласит, что именно здесь были впервые выкованы [Glossary('Корло Рупан','GH_KORLO_RUPAN_GLOSS')] и [Glossary('Лех Рупан','GH_LEH_RUPAN_GLOSS')] и где Корлаку впервые нашептал свои тайны человеку."
 c_kuam_hullo_desc: "Особенность северной окраины долины Наттанан, [Glossary('Куам Хулло','GH_KUAM_HULLO_GLOSS')] содержит диковинные деревья с листвой, что стелется низко над землёй, и причудливыми корнями, тянущимися к воздуху. Корни эти обладают магическими свойствами и часто используются для создания величайших луков наттананов."
 c_adhit_tra_desc: "[Glossary('Адхит Тра','GH_ADHIT_TRA_GLOSS')] как говорят, — место, где покоится солнце глубоко в [Glossary('Чан Кьявкорлаку','GH_CHAN_KYAWKORLACU_GLOSS')], — верование, подкрепляемое красным заревом, что вспыхивает на его вершинах по ночам. Корлаканы ценят камень, добываемый в этих краях, за его уникальное свойство усиливать призванное пламя."
 c_moh_nalmicn_desc: "[Glossary('Мох Налмикн','GH_MOH_NALMICN_GLOSS')] получил своё имя из-за неизменной пелены густого тумана, что покрывает эти земли, — особенности, которую молва приписывает заклятию, наложенному Богами-близнецами в далёком прошлом. Говорят, туман служит щитом для верных им, а тех, кто желает им зла, уводит прочь, не дав отыскать ни единого поселения."
 c_sogo_jern_desc: "Джунгли [Glossary('Сого Джерн','GH_SOGO_JERN_GLOSS')] печально известны опасностями, что подстерегают неподготовленных. И всё же охотники вечно рыщут в этих краях, невзирая на угрозы, ибо только здесь можно найти [Glossary('бин налмиков','GH_BIN_NALMICAA_GLOSS')], чьи шкуры, как известно, мягки, словно ткань, но прочны, словно камень."
 c_carleh_sogotom_desc: "[Glossary('Карлех Соготом','GH_CARLEH_SOGOTOM_GLOSS')] берёт своё имя от твердыни древнего военачальника, разрушенной, когда Боги-близнецы и Корлаку освободили Наттанан. Горнило ересей, он видел взлёт и падение многих вер, отчего нынешние его обитатели вечно пребывают под пристальным взором недреманных глаз."
 c_por_chan_kaenga_vag_desc: "Этот регион зовётся [Glossary('Пон Чан Кэнга Вак','GH_POR_CHAN_KAENGA_VAG_GLOSS')] из-за светящихся цветов, что, кажется, произрастают лишь в этих краях. Необходимые для сотворения дорогостоящей природной магии, цветы эти ценятся даже чужеземцами и являются одним из немногих товаров, коими наттананы торгуют с чужаками, видя в этом способ убедить их последовать путями Богов-близнецов." 
 ###c_sidekor_tuhgn_desc: "Glossary('Sidekor Tuhgn','GH_SIDEKOR_TUGHN_GLOSS') is a land long scarred, in the Sundering War, the Twin Gods and Korlacu cast so many spells and so many died the ground itself was stained red with blood. The region was barren after until many years later when the whole region's topsoil was systematically burried with magic, allowing new plants to grow and wildlife to return. Ocassionally some of that soil will be exposed, requireing great effort to rebury."