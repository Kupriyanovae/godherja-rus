 ## MAA TYPE GAME CONCEPT ##
 
 game_concept_chariot_cavalry: "Колесницы"
 game_concept_chariot_cavalry_desc: "Почтенная колесница использовалась в сражениях обученными воинами на протяжении большей части мировой истории, особенно прославившись во многих битвах, таких как Битва на Десяти озерах и Четырех днях, когда астилики разгромили силы имперской армии, посланной на завоевание Айроноя (подвиг, который после этого редко кому удавалось повторить). Колесницы ужасающе смертоносны на открытой равнине, где они образуют быстро движущуюся стену смерти, ведомую кем угодно — от упряжек боевых коней до чудовищ и тварей всех мастей. Аверсарианцы Поздней империи пошли ещё дальше, создав колесницы, способные парить вперед вообще без участия животных. Колесницы чрезвычайно эффективны против любой пехоты и обладают гораздо большей [Concept('Tougher','стойкостью')|E], чем кавалерия, но при этом обладают гораздо меньшей способностью к преследованию или противостоянию более крупным угрозам. Однако за пределами равнин они практически бесполезны: леса, горы, болота и большинство других типов местности представляют для них серьезное препятствие. Это, наряду с их высокой стоимостью и малой численностью, привело к тому, что колесницы практически канули в небытие."
 
 game_concept_magi: "Маги"
 game_concept_magi_possessive: "Магов"
 game_concept_magi_desc: "Маги — это люди, наделенные даром — и проклятием — [Concept('magic','магии')|E]. Они нанимаются в качестве [Concept('men_at_arms','профессионалов')|E] в армии всех типов по всему [Concept('aeras','Эрасу')|E]. У [Concept('magi','магов')|E] нет начальных [Concept('counters','противодействий')|E], но сами они могут [Concept('counter','противостоять')|E] большинству мирских войск и крайне опасны в [Concept('battle','бою')|E] и при [Concept('siege','осаде')|E].\n\nНесмотря на свою силу, они часто собираются в небольшом количестве и требуют высоких затрат, а многие виды отрядов специализируются на их уничтожении."
 
 game_concept_constructs: "Конструкты"
 game_concept_constructs_desc: "Созданные руками человека конструкты, одушевленные [Concept('magic','магией')|E] и исполняющие волю своих арканных создателей в качестве [Concept('men_at_arms','профессионалов')|E]. Нет двух одинаковых отрядов конструктов; они могут выполнять самые разные вспомогательные роли, например, при [Concept('siege','осаде')|E] или в качестве сокрушительных бойцов в [Concept('battle','бою')|E]. Хотя у них нет истинных [Concept('counter','противодействий')|E], многие [Concept('magi','маги')|E] обучены их уничтожению, а сами они обычно неспособны осуществлять [Concept('screen','прикрытие')|E] или [Concept('pursuit','преследование')|E]."
 
 game_concept_gh_adventurers_type: "Искатели приключений"
 game_concept_gh_adventurers_type_desc: "Вторая древнейшая профессия на [Concept('aeras','Эрасе')|E]: искатели острых ощущений, охотники за сокровищами и убийцы чудовищ часто собираются в наемные отряды [Concept('men_at_arms','профессионалов')|E], чтобы справляться с необычными угрозами. Искатели приключений обычно показывают себя в [Concept('battle','бою')|E] хуже обученных солдат и призываются в гораздо меньшем количестве, но они великолепно [Concept('counter','противостоят')|E] [Concept('monsters','монстрам')|E] и являются самым распространенным средством противодействия [Concept('magic','магическим существам')|E], [Concept('flying','летающим')|E], [Concept('constructs','конструктам')|E], [Concept('gh_general_undead','нежити')|E] и [Concept('magi','магам')|E].\n\nХотя из них получается плохая армия, любой разумный полководец знает, что под рукой всегда стоит держать группу приключенцев для борьбы с нетрадиционными угрозами и для действий на сложном [Concept('terrain','типе местности')|E]."
 
 game_concept_flying: "Летающие"
 game_concept_flying_desc: "Летающие звери и существа всех мастей, как сами по себе, так и с опытными наездниками. Воздушные [Concept('men_at_arms','профессионалы')|E] могут с легкостью изнурять вражеские войска в [Concept('battle','бою')|E]. Большинство летающих отрядов [Concept('counters','противостоят')|E] почти всем наземным войскам и не получают штрафов за [Concept('terrain','тип местности')|E], хотя они менее эффективны при атаке отрядов, укрывшихся в джунглях, тайге, лесах и на болотах. Обычно они уязвимы только для [Concept('archers','лучников')|E], [Concept('magi','магов')|E] и искателей приключений."
 
 game_concept_monsters: "Монстры"
 game_concept_monsters_desc: "Свирепые [Concept('creature','существа')|E], обитающие в дикой природе, от [Concept('griffons','грифонов')|E] до [Concept('dragons','драконов')|E]. Будучи прирученными или зачарованными, они вместе со своими погонщиками формируют полки [Concept('men_at_arms','профессионалов')|E].\n\nМонстры чрезвычайно разнообразны, и хотя обычно они слабее традиционных солдат, их разнообразие и уникальность позволяют им [Concept('counter','противодействовать')|E] большинству человеческих армий. Однако монстры уязвимы перед искателями приключений, которые специализируются на охоте на них."
 
 game_concept_undead: "Нежить"
 game_concept_undead_desc: "Кости бесчисленных людей, погибших в минувшие эпохи, восставшие в качестве [Concept('men_at_arms','профессионалов')|E], чтобы исполнять порочную волю своих владык. У нежити нет начальных [Concept('counter','противодействовий')|E], но она представлена в версиях всех остальных типов войск.\n\nНежить обычно слабее своих живых аналогов, но компенсирует это численностью и [Concept('toughness','выносливостью')|E]."
 
 
