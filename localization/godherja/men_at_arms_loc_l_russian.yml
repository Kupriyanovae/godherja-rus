 death_elementals: "Элементали смерти"
 
 dark_elementals: "Элементали тьмы"
 
 ethereal_elementals: "Эфирные элементали"
 
 celestial_elementals: "Небесные элементали"
 
 lightning_elementals: "Элементали молнии"
 
 quicksilver_elementals: "Ртутные элементали"
 
 dream_elementals: "Элементали грёз"
 
 desert_mirage_elementals: "Элементали пустынного миража"
 
 dune_reaper_elementals: "Элементали дюнных жнецов"
 
 mountain_spirit_elementals: "Элементали духа гор"
 
 vine_elementals: "Элементали лоз"
 
 ocean_reavers: "Налётчики"
 ocean_reavers_flavor: "Знаменитые воительницы Крехеджада, эти пиратки — настоящие мастерицы манёвра против тяжёлой пехоты, способные стремительно и эффективно сокрушать гарнизоны местных городов."
 
 
