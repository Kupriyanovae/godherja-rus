 ## MEN-AT-ARMS ##
 
 magi_regular_flavor: "Хотя они и уступают своим [Concept('aversaria','имперским')|E] коллегам в силе, познаниях и выучке, бродячие [Concept('magi','маги')|E] во множестве стекаются на блеск монет.#!"
 
 sjalvolki_waymakers: "Следопыты отцов Пути"
 
 sjalvolki_berserkers: "Берсерки"
 sjalvolki_berserkers_flavor: "Гордость каждого клана, эти ужасающие ударные отряды впадают в неистовство берсерков, равного которому нет на поле боя, и прорубают кровавую просеку сквозь вражеские ряды.#!"
 
 moonkin: "Родичи луны"
 moonkin_flavor: "Родичи луны — это последователи мондернских обычаев, благословлённые перед многими ликами [Concept('aervalr','Эрвала')|E]. Мастера всех восьми боевых стилей, на поле брани они являют собой зрелище столь же прекрасной грации, сколь и ужасающей разрушительной мощи.#!"
 
 wodes: "Воды"
 wodes_flavor: "Эти воины не верят в броню, полагаясь на татуировки, которые, как они утверждают, даруют им мистическую защиту. Неистовые и, верно, безумные — но в их отваге и свирепости усомниться невозможно.#!"
 
 bloodbound: "Связанные кровью"
 bloodbound_flavor: "Отряды воинов, поклявшихся друг другу в братстве во имя Дейфартора, Связанные кровью принесли обет отмщения всем, кто чинил несправедливость народу ийроссов. Они бьются с ужасающим упорством, применяя тактики, перенятые у своих [Concept('aversaria','аверсарианских')|E] угнетателей.#!"
 
 legion_raiders: "Легионные налётчики"
 legion_raiders_flavor: "Легионные налётчики легко бронированы и снаряжены для стремительных манёвров и рейдов, а не для привычного боя в плотном строю — тактика, выработанная веками подавления плохо вооружённых рабских восстаний.#!"
 
 legion_marines: "Морские легионы"
 legion_marines_flavor: "Самые скудно оплачиваемые, обойдённые вниманием и презираемые легионы во всей [Concept('aversaria','Аверсарии')|E], Морские легионы, несмотря ни на что, ведут боевой послужной список, соперничающий даже с Государственными легионами. Патрулируя самые коварные и кишащие пиратами воды мира, морские легионеры успевают побывать в десятках сражений ещё до того, как их сухопутные собратья увидят своё первое.#!"
 
 mountainstrikers: "Горные ударники"
 mountainstrikers_flavor: "Хотя их родина и осталась позади, гоанское мастерство горного боя никуда не делось, и они по-прежнему сводятся в элитные отряды горных ударников. Покуда они шествуют в поисках нового дома, то помогают своему народу одолевать самые неприступные преграды.#!"
 
 huntsmen: "Охотники"
 huntsmen_flavor: "Для кардвенского охотника не существует ни человека, ни зверя — есть лишь добыча. Украшенные головами тех, кто не сумел от них уйти, кардвенские охотничьи партии видели немногие, а ещё меньше — дожили до того, чтобы поведать об этом."
 
 tsanruti: "Цанрути"
 tsanruti_flavor: "Отряды цанрути составляют основную оборону чарчакских крепостей, с превосходной точностью выслеживая неприятеля. Хотя многие из них обратились к разбою с момента своего формирования, чарчакские общины по-прежнему нанимают цанрути, когда нуждаются в защитниках.#!"
 
 kanpahuri: "Кан'пахури"
 
 waranuux_spearmen: "Копейщики-варануукс"
 waranuux_spearmen_flavor: "Закалённые в битвах копейщики-варануукс, с юных лет обучаемые ратному делу, почти не ведают страха в бою. Они сражаются искусно выделанными копьями, обращая их в прекрасный смертоносный танец и прорубая широкие просеки во вражеском строю.#!"
 
 advanced_waranuux: "Стандартизированные варануукс"
 advanced_waranuux_flavor: "Оснащённые превосходным снаряжением и блюдущие строгую дисциплину, современные воины-варануукс вознеслись ещё выше над простым солдатом. След опустошения, что прокладывают они сквозь всякого, кто встаёт у них на пути, порою сравнивают с последствиями бури.#!"
 
 napaq: "Напаки"
 napaq_flavor: "Обученные сводить на нет урон от налётов, напаки держат рассыпной, гибкий строй."
 
 golden_spears: "Золотые копья"
 golden_spears_flavor: "Элитные солдаты, обученные и вымуштрованные в огромных городах Адабисса, Золотые копья составляют передовую линию каждой адабисской армии. Прошедшие годы муштры и учений до того, как они впервые вышли на поле боя, каждый из этих солдат не желает ничего иного, кроме как принести славу своей Империи#!"
 
 konijkmener_pikes: "Конейкменерские пикинеры"
 konijkmener_pikes_flavor: "Различные ополчения конейкменеров издавна удерживают речные границы против марочников, чтобы обеспечить независимость своих земель. Дисциплинированные и хорошо обученные, пики Республики не дрогнут.#!"
 
 pure_pikes: "Пики Чистейшего"
 pure_pikes_flavor: "С пиками в пять метров длиной и славой самоубийственной отваги, эти копейщики составляют оплот опахасийских армий. Опахасийские наставления по стратегии утверждают как неоспоримый факт: лишь эти воины во всём [Concept('aeras','Эрасе')|E] способны надёжно сдержать натиск рыцарей марочников.#!"
 
 jokhosani: "Джохосани"
 jokhosani_flavor: "Джохосани орудуют длинными пиками, достигающие почти восьми метров в длину, и о них никогда не забывают, когда Амагея собирает свои армии. Пусть они не славятся отвагой, известно, что джохосани оставляют в живых считаных врагов, когда они выходят на поле брани.#!"
 
 kaphral: "Кафралы"
 kaphral_flavor: "Кафралы искусны во владении клинками любого рода, однако их истинное призвание — копьё: короткий и верткий дуйбиндир несёт смертоносные жала на обоих концах.#!"
 
 rearka: "Реарки"
 rearka_flavor: "Искусные в обращении с копьём, реарки — несравненные мастера охранять вверенные им караваны."
 
 crimson_spears: "Багровые копья Корлаку"
 crimson_spears_flavor: "С алыми наконечниками их оружия и кроваво-красными облачениями, сверкающими на солнце, Багровые копья идут в бой как знак непокорства и гнева, и каждый их удар подпитывается кровью их священных обетов."
 
 molten_vanguard: "Копья Священного пламени"
 molten_vanguard_flavor: "Копья Священного пламени используют оружие, выкованное в священных огнях храма Огня Корлаку. На поле битвы сам воздух вокруг этой грозного отряда воинов, говорят, пылает божественной яростью, их натиск так же неудержим, как и пламя, которым они повелевают."
 
 darksteel_bombards: "Бомбарды из темной стали"
 darksteel_bombards_flavor: "Выкованные в палящем пламени Кузницы Корлаку из редких руд, добытых в полностью восстановленных корлаканских шахтах, бомбарды из темной стали являют собой вершину корлаканской изобретательности. Эти грозные осадные орудия, созданные из сплава, столь же непреклонного, как вера их создателей, способны сокрушать стены и сминать армии. Они символизируют мощь цивилизации, доказывая, что индустрия и прогресс превосходят хаос дикой природы.#!"
 
 darksteel_colossi: "Колоссы из темной стали"
 darksteel_colossi_flavor: "Возвышающиеся исполины из металла и пламени, колоссы из темной стали выковываются в священных горнилах Кузницы Корлаку. Оживлённые непреклонной волей корлаканской индустрии и питаемые редкими сплавами возрождённых копей, эти механические бегемоты воплощают торжество прогресса над природой. Созданные сокрушать армии и вселять ужас в сердца врагов, они шествуют как живые монументы во славу цивилизации и неколебимой мощи Вечного Пламени.#!"
 
 adventurers_maa: "Авантюристы"
 adventurers_maa_flavor: "Стекающиеся со всех концов света, авантюристы жаждут добычи и новой земли, что можно будет назвать домом."
 
 marcher_anti_mage: "Антимаги"
 marcher_anti_mage_flavor: "Лучшие из того, что могут предложить королевства марочников, эти войска прекрасно обучены сопротивляться магии и уничтожать [Concept('magi','магов')|E].#!"
 
 slayers: "Истребители"
 slayers_flavor: "Профессиональные охотники на монстров. Они продают свое мастерство любому, кто способен заплатить, и куда меньше остальных боятся магии."
 
 grave_wardens: "Могильные стражи"
 grave_wardens_flavor: "Тяжеловооруженные стражи мертвых ойчизанов, эти воины славятся своей несокрушимой бронёй и ещё более сокрушительным натиском.#!"
 
 flying_lances: "Летающие копья"
 flying_lances_flavor: "Легендарные рыцари ойчизанцев, легенды гласят о временах, когда крылья на их спинах загорались пламенем и давали им способность летать. Хотя это искусство было забыто, их мастерство владения копьем и верховой ездой осталось неизменным.#!"
 
 the_bloodied: "Окровавленные"
 the_bloodied_flavor: "Окровавленные — это ийросские солдаты, которые убили как минимум троих [Concept('aversaria','аверсарианцев')|E]. Броня их и луки испещрены древними письменами ийроссов — знаками, что аверсарианцы давно мнили стёртыми из памяти, — и выведены они кровью прежних господ#!"
 
 grove_guardians: "Стражи Священной рощи"
 grove_guardians_flavor: "Мастера маскировки, Стражи Священной рощи движутся в совершенной гармонии с самим джунглями, и они известны тем, что наводят хаос среди незваных гостей."
 
 jerniems_rangers: "Следопыты Йернейма"
 jerniems_rangers_flavor: "Опытные следопыты и мастера дикой природы, Следопыты Йернейма патрулируют окраины Священной рощи, чтобы ничего не угрожало её священным землям."
 
 prophets_sons: "Сыны Пророка"
 prophets_sons_flavor: "Элитные воины благородного происхождения, Сыны Пророка происходят из малых и крупных домов амсаров, претендующих на происхождение от Пророка. Каждый из них сражается за честь не только своего дома, но и всего своего народа.#!"
 
 marcher_knights: "Рыцари Пути"
 marcher_knights_flavor: "Рыцари Пути — это марчочникские рыцари, посвятившие себя совершенствованию в Пути Мечей, Очищения и Справедливости. Обычно происходящие из благородных домов, они легендарны своей приверженностью делу защиты своего народа и своих лордов.#!"
 
 brother_riders: "Братья-всадники"
 brother_riders_flavor: "Братья-всадники — это сьялволки, вдохновленные более организованными рыцарскими орденами, с которыми они столкнулись и сражались на западе. Братья по клану, оседлавшие коня и взявшие копьё, рыщут ныне по Землям Кланов и за их пределами, и за их пределами в поисках славы, оберегая сельские просторы, насколько это в человеческих силах.#!"
 
 aversarian_legionaires: "Аверсарианские легионеры"
 aversarian_legionaires_flavor: "[Concept('aversaria','Аверсария')|E] пережила расплату сьялволков — пусть и не в прежнем обличье, — и её легионы тоже. Перестроенные и преобразованные, легионеры Аверсарии никогда более не дрогнут.#!"
 
 autocrossbowmen: "Автоматические арбалетчики"
 autocrossbowmen_flavor: "Мундимби считаются элитой необъятной адабисской армии. они держат в руках устройства поразительной меткости, способные выпускать один болт за другим без перезарядки — благодаря хитрому механизму, что подаёт новые болты из прикреплённого короба.#!"
 
 kikarsag_heavy_cav: "Кикарсагские испытанные всадники"
 kikarsag_heavy_cav_flavor: "Облачённые в устрашающую личинную броню и восседающие на тяжело бронированных конях, испытанные всадники издали порой принимаются простыми солдатами за диковинную разновидность големов. Их смертоносные натиски и непревзойдённая тактика тяжёлой кавалерии обычно означают, что немного находится выживших, способных оспорить это умозаключение.#!"
 
 home_legions: "Внутренние легионы"
 home_legions_flavor: "Древнее сердце [Concept('aversaria','Аверсарии')|E] поныне бьётся воинственным пылом. Пусть старые Легионы ушли навстречу гибели в битве у Элизийского перевала, их собратья из Внутренних легионах хранят многие из их традиций и боевых укладов.#!"
 
 legion_outriders: "Легионные застрельщики"
 legion_outriders_flavor: "Бескрайние равнины [Concept('aversaria','Восточной Аверсарии')|E] ставят перед военным искусством вызов, не сравнимый ни с чем на континенте. В этих землях легионные застрельщики завоевали устрашающую репутацию благодаря своему образу жизни. Они странствуют, подобно кочевникам, неделями не рассчитывая ни на что, кроме собственных кобылиц.#!"
 
 north_shields: "Щиты Севера"
 north_shields_flavor: "В этой элитной пехоте с трудом узнаются [Concept('aversaria','аверсарианские')|E] легионеры. Знамёна, несущие варварские знаки и увенчанные диковинными идолами, рееют наравне с традиционными аверсарианскими символами. Но эти странности ничуть не умаляют их боевой доблести.#!"
 
 duneriders: "Наездники дюн"
 duneriders_flavor: "Целиком переняв методы ведения боя местных, Наездники дюн возникают словно из ниоткуда и вновь растворяются в пустыне, едва их кровавая работа завершилась. Иные плюются им вслед, почитая их «одичавшими», но никто не усомнится в их жестокой действенности.#!"
 
 stoneforged: "Выкованные из камня"
 stoneforged_flavor: "Выкованные из камня — это современное переосмысление древних гоанских горных ударников, вооружённых ныне более совершенным снаряжением и разросшихся до куда большей численности. Пусть они и пожертвовали толикой подвижности своих предшественников, они с лихвой восполнили это ударной мощью, и никто не возьмётся утверждать, будто на горных кручах найдётся противник смертоноснее.#!"
 
 cloud_riders: "Облачные всадники"
 cloud_riders_flavor: "#F Сарминианские всадницы наводили ужас на всю Катунскую степь, а ныне несут свою доблесть в [Concept('aversaria','Аверсарию')|E]. Они — одни из самых непревзойдённых лучниц на континенте, и молва гласит, будто они способны выбить человеку оба глаза с двух сотен шагов на полном скаку.#!"
 
 sunstriders: "Идущие по солнцу"
 sunstriders_flavor: "#F Новый облик сарминианской войны — это тяжёлая ударная конница, сметающая всякую армию, безрассудную довольно, чтобы встать у неё на пути. Их дисциплина и воинское умение соперничают даже с прославленными рыцарями марочников.#!"
 
 observant: "Наблюдатели"
 observant_flavor: "Наблюдатели — это братство воинов-монахов, издавна связанное с хуэгодоками. Они почитают битву лишь за очередное переживание Сновидца и достигли немалого мастерства в стрельбе из лука, дабы иметь возможность одновременно и участвовать в сих столкновениях, и наблюдать за ними.#!"
 
 huegodoc_legion: "Хуэгодокские легионы"
 huegodoc_legion_flavor: "Увидев легионы, марширующие по хуэгодокским городам, всякому простительно было бы решить, что [Concept('aversaria','аверсарианцы')|E] вернулись. Но нет — они создали собственные легионы, надеясь повторить военные успехи Аверсарии.#!"
 
 war_mammoth: "Варисникские всадники на мамонтах"
 war_mammoth_flavor: "#F Украшенные ритуальными татуировками и письменами, эти мамонты несут на поле битвы ярость [Glossary( 'древнего севера', 'OLD_NORTH_GLOSS' )]!#!"
 
 mubaaizun: "Мубаризуны"
 mubaaizun_flavor: "Мубаризун — это чемпион [Concept('sarradon','саррадонской')|E] армии; часто лучшие воины господина сходятся в ритуальном поединке перед началом битвы, сражаясь насмерть. Эти поединки нередко сопровождаются тем, что каждая армия выкрикивает песнопения или осыпает противника оскорблениями, и бывали случаи — как, например, [Concept('battle_of_the_mubaaizun_fix','Битва мубаризунов')|E] — когда перед битвой происходило множество поединков подряд, зачастую ради отмщения за павшего мубаризуна."
 
 krialetil: "Криалетилы"
 krialetil_flavor: "Криалетилы — это стражи гор Армазли, и являются величайшими защитниками Амагеи со дней Парназа «Великого». Полки криалетилов обучены умирать, но не уступать врагу ни пяди земли.#!"
 
 tskherosan: "Цхеросан"
 tskherosan_flavor: "Излюбленные воины махратийцев, всадники-цхеросан известны по всей Амагее своей стремительностью и безжалостностью.#!"
 
 sahkmavali: "Сахмавали"
 sahkmavali_flavor: "Стражи сокрытых храмов айгаенов, сахмавали обыкновенно служат отрядами не более пятидесяти человек. Однако, несмотря на их малочисленность, сахмавали являются мастерами горной войны, чьим умениям трудно найти равных на их родной территории.#!"
 
 mezilachitnen: "Мезилачитнены"
 mezilachitnen_flavor: "Обученные обращению с длинным луком как часть придворного ритуала, самые искусные дранетские воины всегда избирались служить в мезилачитненах. Хотя их и немного, они являют собой вершину амагейских лучников.#!"
 
 talabhau: "Талабхау"
 talabhau_flavor: "Талабхау некогда служили элитной гвардией ванэламаку Хайтрахати; после его исчезновения любой достойный принц может призвать их на службу.#!"
 
 visvasavrak: "Вишвасавраки"
 visvasavrak_flavor: "Изначально основанные для истребления полчищ нежити, вишвасавраки бьются насмерть, храня неколебимую верность их сюзерену.#!"
 
 rayakuux_archers: "Лучники-раякуукс"
 rayakuux_archers_flavor: "Благодаря опыту странствий сквозь самые разные климаты, лучники-раякуукс славятся умением приноровиться к любой местности. Их стрелы вылетают из просветов меж деревьев, и незримые лучники наблюдают, как падают их цели.#!"
 
 advanced_rayakuux: "Корпус раякуукс"
 advanced_rayakuux_flavor: "Отменно вышколенные и закалённые разнообразными походами, воины корпуса раякуукс возводят умения своих предшественников на новую ступень. Местность для них не преграда, и стрелы их находят цель даже сквозь самый густой лес.#!"
 
 mezzarb_riders: "Наездники на меззарбах"
 mezzarb_riders_flavor: "Восседая на крепких козлах-меззарбах, эти всадники с лёгкостью преодолевают любую местность, на какой запнулось бы большинство коней."
 
 shemota_warriors: "Воины-шемоты"
 shemota_warriors_flavor: "Облачённые в гибкий и прочный волоконный доспех, воины-щемоты тяжело бронированы и при том сохраняют высокую подвижность."
 
 ahbshaani_devouts: "Преданные ахбшаани"
 ahbshaani_devouts_flavor: "Восседая на исполинских ящерах, эти святые воины следуют лишь зову Охрасика."
 
 sarradon_imitation_legion: "Саррадонский легион-подражатель"
 sarradon_imitation_legion_flavor: "Саррадонские ополченцы, обученные на старый имперский манер. Они умелы в открытом поле, хоть и уступают легионам, которым пытаются подражать."
 
 enlevett: "Анлеветы"
 enlevett_flavor: "Облачённые в чёрные доспехи и тёмные маски, анлеветы — элита всякой канийской армии. С юных лет обученные искусству ближнего боя и в совершенстве владеющие боевой косой, эти дисциплинированные воины несут косы, приспособленные для хвата одной рукой.#!"
 
 theugombrian_warrior_kinband: "Родовая ватага"
 theugombrian_warrior_kinband_flavor: "Состоящие из сплочённых кровных братств молодых воинов, родовые ватаги странствуют по всему свету, продавая свои услуги тому, кто больше заплатит, и бьются в стальных доспехах с почти самоубийственной отвагой. Те из отрядов, что выживают, становятся ядром будущих теугомбрийских родов."
 
 theugombrian_iron_brotherhood: "Железное братство"
 theugombrian_iron_brotherhood_flavor: "Вскормленные искусствами металла и боевой магии, теугомбрийские железные братства это по сути кровные братства, сформированные вокруг магических родословных, и бьются они равно заклятьем и мечом. Их ритуалы известны тем, что наделяют клинок такой остротой, что тот рассекает кольчугу словно бумагу."
 
 leki_herdmasters: "Лекские загонщики"
 leki_herdmasters_flavor: "Скотоводы по своей природе, во времена нужды леки берётся за оружие и собирается в неуловимые ватаги застрельщиков. Обращая своё знание земель на ратное дело,они бьют жестоко и стремительно, исчезая в окрестных просторах прежде, чем враг успевает ответить."
 
 bronzecast: "Бронзовые мортиры"
 bronzecast_flavor: "Вершина бронзовой металлургии Дахангона, бронзовые мортиры суть огромные, искусно изукрашенные пушки, что применяют порох для метания металлических снарядов, обращая в руины крепчайшие из стен."
 
 thorn_maidens: "Девы Шипа"
 thorn_maidens_flavor: "Отточенные целой жизнью суровой боевой выучки, элитные даяркские воительницы, как говорят, несут в себе силу десяти мужей, и наводят ужас умением выслеживать врага с незримых крон джунглей."
 
 death_seekers: "Искатели смерти"
 death_seekers_flavor: "[death_seekers|E] — это мастера меча, что с лёгкостью разят разом и всадника, и коня."
 
 sidharakyan: "Сидаракян"
 sidharakyan_flavor: "Сидаракян — мастера изогнутых секир, коими они разят легковооружённых врагов, дерзнувших ступить на их берега."
 
 dhageray: "Загерай"
 dhageray_flavor: "Воины-загерай славятся своей верностью и тем, что бьются до последнего вздоха. Едва падёт их предводитель, вся свита воинов обязана принять смерть вместе с ним."
 
 bluescars: "Синие шрамы"
 bluescars_flavor: "Грозные таларегские воины отмечены татуировками из неведомой синей краски и их свирепость внушает страх."
 
 azmaram: "Азмарамы"
 azmaram_flavor: "Азмарамы маршируют в ногу, наступая на врага непроницаемой стеной сверкающих щитов и острых сарисс."
 
 lujian: "Лунцзяни"
 lujian_flavor: "Собираемые местными магистратами по всему Катуну, луцзяни составляют основу бесчисленных армий. Их снаряжение разнится от провинции к провинции, однако одна лишь их численность делает их незаменимой силой."
 
 tetukor: "Тетукоры"
 tetukor_flavor: "Вдали от открытых степей катунские наездники на зверях покорили джунгли, приручив гигантских пауков. Быстрые и неуловимые, тетукоры наносят удар там, где всадников ждут меньше всего."
 
 kathuni_tetukor: "Тетукоры"
 kathuni_tetukor_flavor: "Вдали от открытых степей катунские наездники на зверях покорили джунгли, приручив гигантских пауков. Быстрые и неуловимые, тетукоры наносят удар там, где всадников ждут меньше всего."
 
 yamen_troops: "Войска-ямень"
 yamen_troops_flavor: "Когда-то бывшие личной охраной катунских губернаторов, войска-ямень выросли в тяжело бронированных профессионалов, славящихся своей дисциплиной и непреклонной верностью."
 
 ding: "Динг"
 ding_flavor: "Динг — это колоссальная бомбарда, чей гром способен обрушить даже самые неприступные укрепления. Ее оглушительный рёв стал мрачным знамением для защитников по всему Катуну."
 
 qibing: "Цибин"
 qibing_flavor: "Отобранные для службы непосредственно под началом Драконьего императора, цибини — это конные воины, для которых честь измеряется исключительно победой."
 
 chinlin_iron_elephant: "Чинлинский железный боевой слон"
 chinlin_iron_elephant_flavor: "Облаченные в огромные железные доспехи, слишком тяжелые для любого человека, чинлинские железные слоны — это живые тараны. Мало какой строй способен выдержать грохот их атаки."
 
 guoren_fire_lancers: "Гожэньские огненные копейщики"
 guoren_fire_lancers_flavor: "Вооруженные пылающими огненными копьями, гожэни внушают страх как своей храбростью, так и своим оружием. Никакая жертва не будет слишком велика ради Синь Сюэ."
 
 green_watchers: "Зелёные дозорные"
 green_watchers_flavor: "Ветераны многих нашествий, Зелёные дозорные — ответ клановцев на вторжения как марочников, так и аверсарианцев. Они — мастера партизанской войны и хорошо знают слабости своих разнообразных властителей."
 
 owl_men: "Люди-совы"
 owl_men_flavor: "Носящие знаменитые ордикинские совиные маски, эти воины — мастера как охоты, так и асимметричной войны, и стали погибелью для многих аверсарианцев и марочников."
 
 spirit_regular: "Духи"
 spirit_regular_flavor: "Плененные эхо усопших. Опасны, когда их много, но полностью развеиваются там, где угасает магия."
 
 raised_undead: "Поднятая нежить"
 raised_undead_flavor: "Свежеподнятые мертвецы из ближайшей земли. От них мало толку, кроме их численности и готовности бездумно идти прямо на клинки."
 
 jaanvarkis: "Яанварки"
 jaanvarkis_flavor: "Закалённые годами охоты, эти ветераны леса известны своей искусной и вместе с тем стремительной манерой боя — чем и заслужили у врагов прозвище «Вьюхаракша» — «Скользящие налётчики». При должной подготовке к современной войне из них выходят отличные застрельщики.#!"
 
 oltenic_horse_archers: "Ольтенские конные лучники"
 oltenic_horse_archers_flavor: "Ольтенские лучники происходят из воинских традиций, изученных со времён [Concept('aironoian_migration','Айронойского переселения')|E]. Они славятся смертоносной меткостью и именно этим удерживают власть над степью."
 
 oltenic_spearmen: "Ольтенские копейщики"
 oltenic_spearmen_flavor: "Ольтенские копейщики издавна специализировались на уникальных стилях боя, чтобы противостоять свирепым конным владыкам Айроноя.#!"
 
 oltenic_light_horsemen: "Ольтенские всадники"
 oltenic_light_horsemen_flavor: "Ольтенские всадники — наследники воинских традиций, усвоенных со времён [Concept('aironoian_migration','Айронойского переселения')|E]. Эти наездники считались одними из лучших во всей [Concept('aversaria','Аверсарии')|E].#!"
 
 cavern_ram: "Осадный пещерный таран"
 cavern_ram_flavor: "Осадный пещерный таран создан для того, чтобы использовать тесное пространство подземной войны. Орудие строится низким и упирается в стены туннеля, что придаёт ему сокрушительную силу в коридорах, где надземные осадные машины были бы бесполезны. Однако под открытым небом обсидиановый наконечник слишком тяжёл для правильного манёвра, а рама лишена точек опоры, от которых полностью зависит."
 
 tension_trebuchet: "Натяжной требушет"
 tension_trebuchet_flavor: "В отличие от падающего противовеса, что приводит в действие обычные требушеты, натяжной требушет использует исполинские плетёные канаты из грибных сухожилий, взращённых во влажной подземной среде, где они сохраняют упругость. Конструкция предназначена для сокрушения стен под [Glossary('Майикратией','mayikprolollan_encyclopedia_desc')]. Вытащенное на поверхность, грибное волокно под сухим воздухом затвердевает, делая орудие почти совершенно бесполезным."
 sarathem_magi_flavor: "[Concept('magi','Маги')|E]-саратемы сражаются как единый механизм. Их совместные заклинания способны уничтожить боевые порядки еще до сближения войск."
 adventurers_flavor: "Стекающиеся со всех концов света, авантюристы жаждут добычи и новой земли, что можно будет назвать домом."
 
 war_chariots: "Боевые колесницы"
 war_chariots_flavor: "Запряженные от одной до трех лошадей в зависимости от размера, боевые колесницы способны как проламывать ряды врага, так и поражать их на расстоянии.#!"
 
 beetle_rider: "Скарабейные колесницы"
 beetle_rider_flavor: "Возничие скарабейных колесниц [Glossary('Кемсара','kemsar_encyclopedia_desc')] сеяли ужас в суровых песках западного [Concept('sarradon','Саррадона')|E] с незапамятных времён."
 
 golem_infantry: "Адабисские големы"
 golem_infantry_flavor: "Золотые Статуи Вольмбаз-нза, или Города Золотых Башен, высятся на марше почти в два человеческих роста. Сработанные из золотистых металлов и движимые хитросплетением шестерён и неведомой магии, они являют собой на поле боя сокрушительное зрелище. Иные суеверные солдаты божатся, что, приложив ухо к их груди, можно услышать исполненные паники шёпоты на древних языках...#!"
 
 stone_golems: "Каменные големы"
 stone_golems_flavor: "Тесанные из цельного камня и наделенные примитивной волей. Медлительные и терпеливые, они практически неостановимы, если их направить на штурм стены."
 
 metal_golems: "Металлические големы"
 metal_golems_flavor: "Самые дорогие и смертоносные из конструктов. Созданные из кованой стали, они двигаются с точностью, недостижимой для живого кузнеца."
 
 ice_golems: "Ледяные големы"
 ice_golems_flavor: "Высеченные из ледникового льда и скрепленные стужей, они неостановимы на холодном севере, но жалки везде, где палит солнце."
 
 magma_golems: "Магматические големы"
 magma_golems_flavor: "Расплавленная порода под коркой остывающего камня. Они оставляют обугленные следы и поджигают все, что опрометчиво подбирается слишком близко."
 
 siege_golems: "Осадные големы"
 siege_golems_flavor: "Титаны из глины и камня, оживленные энергиями [Concept('aervalr','Эрвала')|E], осадные големы способны в одиночку уничтожать целые полки.#!"
 
 bronze_golems: "Бронзовые големы"
 bronze_golems_flavor: "Отлитые в древних литейных и оживленные ритуалом, бронзовые големы невредимыми принимают удары, способные свалить дюжину мужей, и без труда вышибают ворота."
 
 griffon_riders: "Всадники на грифонах"
 griffon_riders_flavor: "Цвет рыцарства марочников. Гибель многих врагов Шевалье возвещала яркая вспышка среди ясного неба, а вскоре за ней — боевые кличи пикирующей в смертоносном броске эскадрильи всадников на грифонах, чьи доспехи пламенеют отражённым солнцем.#!"
 
 griffon_silencers: "Антимаги на грифонах"
 griffon_silencers_flavor: "Чести вылететь на грифоне в битву удостаиваются лишь лучшие бойцы, каких только способны выставить Антимагические ордена. Они кружат над полем брани, пикируя вниз, чтобы разить уязвимых [Concept('magi','магов')|E].#!"
 
 airships: "Воздушные корабли"
 airships_flavor: "Полностью адабисская разработка, основанная на концепциях и технологиях, восстановленных из Города Золотых Башен. Воздушные корабли считаются безумием на севере, но в джунглях юга они все больше становятся нормой, перевозя солдат и атакуя города с воздуха.#!"
 
 seraph_melacham: "Мелахамы"
 seraph_melacham_flavor: "Крылатые и со пылающими очами, мелахамы обрушиваются на армию с небес и исчезают прежде, чем выжившие успеют понять, что их поразило."
 dragonriders_flavor: "Те немногие, кто смог подчинить своей воле дракона — и те единицы, кто прожил достаточно долго, чтобы выехать на нем на войну."
 
 arcane_auxiliaries: "Арканные ауксиларии"
 arcane_auxiliaries_flavor: "Искусные мастера избранной школы магии, появление [Concept('magi','магов')|E] на поле боя, способно обратить простую стычку в океан огня и смерти.#!"
 
 partic_seers: "Партикские провидцы"
 partic_seers_flavor: "Обученные друиды и их послушники, партикские провидцы неукоснительно следуют тайным наказам и повелениям своего Совета. Их мотивы неведомы — но не их могущество.#!"
 
 whisperers: "Шепчущие"
 whisperers_flavor: "Шепчущие — это [Concept('fogeaters','Пожиратели тумана')|E], благословленные (или проклятые) «даром» магии. Казавшиеся бормочущими безумцами, когда-то бывшими мужчинами и женщинами, они призывают [Concept('the_fog','Туман')|E] и высвобождают разрушительную магию на поле боя.#!"
 
 veiled: "Сокрытые вуалью"
 veiled_flavor: "Таинственные ведьмы Гастанводерских болот редко показываются кому-либо, но когда они решают собраться, они наверняка дают чужакам понять, почему их стоит бояться.#!"
 
 stepwalkers: "Шагающие по ступеням"
 stepwalkers_flavor: "Культы [Concept('magi','магов')|E], прославленные своей скрытностью — или дерзким её отсутствием, смотря по тому, какой секте они хранят верность. При всём своём многообразии, эти собрания сохраняют одни из самых древних и эзотерических магических традиций в Саррадоне.#!"
 
 markwardens: "Стражи меток"
 markwardens_flavor: "Гибкие и стремительные, стражи меток налагают на недругов гибельные проклятия и знаки с сокрушительным исходом."
 
 redland_cultists: "Культисты Красных земель"
 redland_cultists_flavor: "Иным из них едва минуло несколько десятилетий, но большинство пережило столетие, а то и многие века. Не знающие смерти, их чуждые человеку обличья корёжатся, послушные воле ужасных богов, коим поклоняются эти [Concept('magi','маги')|E]. Они убивают, чтобы крепнуть силой, ибо Пустота алчет изничтожения всего сущего. Особенно — жизней."
 
 willing_acolytes: "Готовые послушники"
 willing_acolytes_flavor: "#italic Кажется, при насильственном захвате разума что-то утрачивается, ведь иначе с чего бы теням промышлять поисками добровольных сосудов? — Амнакс Летописец, \"Наблюдения.\" Глава II."
 
 fogbeasts: "Туманные твари"
 fogbeasts_flavor: "[Concept('fogbeasts','Туманные твари')|E] — это чудовища, которые последовали за Гарформдаэром из [Concept('the_fog','Тумана')|E]. Они принимают самые разные обличья: от от мелкой шныряющей твари до исполинских левиафанов, рожденных лишь из глубочайших страхов живых и мертвых, прошлых, нынешних и грядущих...#!"
 
 woodland_hydra: "Лесная гидра"
 woodland_hydra_flavor: "Многоголовое чудовище из лесной чащи. На месте каждой отрубленной шеи вырастают две новые. Бывали случаи, когда одна такая тварь поглощала целые военные отряды."
 
 war_hounds: "Боевые псы"
 
 maples_marauders: "Мародеры Мэйпл"
 
 nascent_shadehosts: "Зарождающиеся вместилища теней"
 nascent_shadehosts_flavor: "#italic Даэлиниокс не ожидал снова увидеть своего сына. Его появление на поле боя спустя десять лет после исчезновения стало настоящим шоком. Но когда малыш Михиос побежал к отцу, он не откликнулся ни на один призыв. И когда он вонзил свой клинок сквозь плоть и органы, Даэлиниокс не увидел никакой любви за этими когда-то светлыми глазами. В них не было ни узнавания, ни печали, ни страха — и даже не было ненависти. Но кое-что в них всё же было.#!"
 
 manifestations_of_fear: "Воплощения страха"
 manifestations_of_fear_flavor: "Люди часто говорят, что больше всего на свете боятся пауков или высоты. Те, кто честнее, могут признаться в страхе смерти или в боязни стать ненавистными своим любимым. Но истинный страх — столь ужасающий, что его невозможно даже помыслить, — заключается в сомнении: существуют ли они на самом деле? Красноземельцы воплотили этот страх в реальность и заставят своих врагов столкнуться с ним лицом к лицу."
 
 chasm_terrors: "Ужасы пропасти"
 chasm_terrors_flavor: "Красные земли кишат самыми ужасающими и злобными тварями из всех, что ведомы на [Concept('aeras','Эрасе')|E]. Разумные бездны, полные трупов; рои гигантских ос, что неделями зреют в телах живых носителей; многорукие глаза, ползающие по стенам и разверзающие в зрачках зияющие, усеянные зубами пасти... Только жители Красных земель, кажется, каким-то образом способны приручатьих для войны, а это, увы, означает, что даже те, кто благоразумно держится от Красных земель как можно дальше, не избавлены от кошмаров, таящихся внутри."
 
 lesser_voidspawns: "Малые порождения Пустоты"
 lesser_voidspawns_flavor: "Оборванные фрагменты иного мира, просачивающиеся через истончившиеся грани реальности. Падки прежде всего на тех, кто повелевает тайными искусствами."
 
 marrowdrones: "Мозгокостные трутни"
 marrowdrones_flavor: "Мозгокостные трутни — это охотники Пасти, чьё предназначение — сокрушать всё, что способно противиться распространению Проклятия Плоти. Заключённые в костяной экзоскелет, они не замечают смертельных ран и обрушивают на противника шквал костяных шипов, за которым следует сокрушительная атака."
 
 hungering_mouths: "Алчущие пасти"
 hungering_mouths_flavor: "Наиболее излюбленные среди детей Пасти, алчущие пасти суть колоссальные сращения плоти и кости, возвещающие пришествие Проклятия Плоти. Бессчётные клыки, когти и костяные шипы выступают из их громоздких тел, пожирая всё окрест этих чудовищ в тщетной попытке утолить их бесконечный голод."
 
 living_pits: "Живые ямы"
 living_pits_flavor: "#italic \"Докладывайте, Леган. Похоже, к нам приближаются какие-то... дыры.\"\n\"Расстояние? Скорость? Размер?\"\n\"Примерно в двух днях пути к востоку — быстрее человека, но медленнее лошади, а размером примерно с городскую площадь Асиуполя. Вы сталкивались с подобным раньше, мэм?\"\n\"Нет. Но в этом жутком месте лучше подготовиться, чем тратить время на бесполезное неверие. Собирай людей, мы выступаем на север через час.\"#!"
 
 archonarachs: "Архонарахи"
 archonarachs_flavor: "Придворные, слуги и камердинеры Паучьего двора, архонарахи редко появляются в [Concept('aeras','Эрасе')|E] иначе как в составе охотничьих партий и кровавых забав, устраиваемых их знатью. Размером со взрослого боевого коня, каждая из их паучьих конечностей оканчивается хитиновой кистью со смертоносными когтями, довольно крепкими, чтобы проминать металл. Архонарахи плетут себе лица из шёлка и возлагают их пред своими головогрудями, впадая в великую ярость, если к ним обращаются не сообразно их рукотворной личине."
 
 spider_jockeys: "Паучьи наездники"
 spider_jockeys_flavor: "#italic \"Ученые и так называемые «эксперты» выдвинули немало теорий о связанной с пауками культовой рыцарской знати: мол, забираясь к ним на спину, рыцарь спасается от их ядовитых клыков или что это исполнение пакта с Паучьим богом, или что так они наводят еще больший ужас на своих врагов... Думаю, объяснение куда проще: верховая езда на гигантском пауке — это просто восхитительно.\"#!"
 
 blade_tendrils: "Клинковые щупальца"
 blade_tendrils_flavor: "Клинковые щупальца — самые многочисленные и, безусловно, слабейшие из отродий Пасти. Прорастая из любого трупа, что соприкоснулся с заражённой плотью, они захватывают своего носителя в жестоком взрыве внутренностей и мозгового вещества, поднимаясь на ноги шатким человекоподобным кадавром с длинным, подобным хлысту щупальцем вместо головы."
 
 night_gaunts: "Выходцы ночи"
 night_gaunts_flavor: "Безликие и безмолвные, они слетают на лагерь между двумя вздохами и исчезают еще до того, как успеют поднять тревогу."
 
 voidhosts: "Объятые Пустотой"
 voidhosts_flavor: "Быть может, некогда люди, Объятые Пустотой ныне суть «живые» источники энтропии. Безликие фигуры в капюшонах, сеющие гибель во всяком краю, куда ступает их нога, — сказания повествуют о путниках, что спускают свой капюшон посреди храмов и городов, и тысячи душ пожирает адская тьма Пустоты, заменившая им плоть. Когда красноземецы выступают на войну, сотни Объятых Пустотой можно узреть в их рядах, и мир содрогается от ужаса."
 
 enfleshed_grotesquerie: "Воплощенная гротескность"
 enfleshed_grotesquerie_flavor: "Гротескность — это омерзительная масса из жил и костей, составленная из меньших культистов, рабов и всякого зверья, что было втянуто в эту плоть. Её гротескное обличье вселяет ужас во всякого, кто встанет против неё, и большинство предпочитает сдаться её объятиям из плоти."
 skeleton_flavor: "Голые кости, держащиеся вместе лишь за счет чьего-то умысла. Их дешево поднимать и еще дешевле терять."
 
 skeleton_archers: "Скелеты-лучники"
 skeleton_archers_flavor: "Лишенные плоти пальцы натягивают тетиву с механическим терпением. Недостаток меткости они компенсируют тем, что никогда не дрогнут под ответным залпом."
 
 elite_undead: "Элита нежити"
 elite_undead_flavor: "#F Наделённые куда большей силой, разумом и самостоятельностью, нежели заурядная нежить, эти грозные создания искусно справляются с положениями, в коих одна лишь численность не служит достаточным решением.#!"
 
 spirits_of_the_horn: "Духи Рога"
 spirits_of_the_horn_flavor: "Духи Рога — это давно почившие могучие воители, что обрекли свои закалённые в сече души на служение [Glossary('Велосу','VELOS_GLOSS')]. Говорят, отныне и навеки служат они Чёрному Рогу, приходя на помощь тем, кто нуждается в их силе.#!"
 
 undead_skirmishers: "Орда нежити"
 undead_skirmishers_flavor: "#F Огромные орды почти безмозглых восставших мертвецов, опасных скорее своими большими числами, чем боевыми навыками.#!"
 
 undead_bowmen: "Нежить-лучники"
 undead_bowmen_flavor: "#F Огромные полчища почти безмозглых восставших мертвецов, опасные скорее своей многочисленностью, нежели боевым умением.#!"
 
 undead_light_horsemen: "Легкие всадники-нежить"
 undead_light_horsemen_flavor: "Призрачные всадники на скелетах коней, эти неживые легкие всадники сохраняют ту же скорость и маневренность, что были у них при жизни. Призванные с помощью [death_i|E]магии, они служат стремительными разведчиками и силами обхода с флангов."
 
 undead_pikemen_unit: "Пикинеры-нежить"
 undead_pikemen_unit_flavor: "Частокол из ржавых наконечников в руках, которые никогда не задрожат. Врезающаяся в них кавалерия не может кого-либо обратить в бегство — лишь натыкается на новые пики за первыми рядами."
 
 undead_armored_footmen: "Бронированные пехотинцы-нежить"
 undead_armored_footmen_flavor: "Дружина какого-то давно почившего лорда, все еще носящая его геральдические цвета."
 
 undead_armored_horsemen: "Бронированные конники-нежить"
 undead_armored_horsemen_flavor: "Одетые в броню трупы в убранстве, в котором их погребли. Они обрушиваются на открытую местность со всей мощью живой кавалерии, но без капли колебаний."
 
 undead_crossbowmen: "Арбалетчики-нежить"
 undead_crossbowmen_flavor: "Взвести, зарядить, выстрелить, повторить. Из мертвецов выходят скверные стрелки, зато неутомимые, да и арбалет не требует особого мастерства от держащих его рук."
 
 undead_horse_archers: "Конные лучники-нежить"
 undead_horse_archers_flavor: "Мертвые всадники на мертвых скакунах, пускающие стрелы в бесконечном галопе по кругу. Они не знают усталости, их нельзя сломить, и они никогда не спешиваются для отдыха."
 
 undead_camel_rider: "Всадники на верблюдах-нежить"
 undead_camel_rider_flavor: "Пустынные верблюды, поднятые вместе со своими бывшими наездниками. Они плетутся сквозь зной и жажду, которые еще при жизни убили бы их дважды."
 
 undead_war_elephant: "Боевые слоны-нежить"
 undead_war_elephant_flavor: "Гниющие громадины, идущие вперед по воле своего повелителя. Их бивни продолжают щепить щиты и после того, как сами звери перестают чувствовать наносимые им удары."
 
 undead_dragon: "Дракон-нежить"
 undead_dragon_flavor: "#F Некогда драконы вольно парили в небесах [Concept('aeras','Эраса')|E], но после их [Concept('war_of_the_thousand_dragons','истребления')] это больше невозможно. Ныне же эти свирепые чудища, сам ужас во плоти, возвращены из мёртвых#!"
 
 undead_worldeater: "Неживой Пожиратель миров"
 undead_worldeater_flavor: "#F Воплощенный в гниющей плоти конец всего сущего, затянутый обратно в этот мир [Concept('magic','магией')|E].#!"
 
 fog_spirits: "Духи Тумана"
 fog_spirits_flavor: "Шепчущие тени и визжащие лики в [Concept('the_fog','Тумане')|E], духи Тумана — суть исключение из его же законов. Они не люди и не порождения их разума, а нечто из давно минувших времён. Бесплотные и мстительные в равной мере.#!"
 
 leshens: "Лешие"
 leshens_flavor: "Древние стражи корней и рогов, куда более старые, чем боящиеся их народы. Каменные стены — ничто для существа, перед которым расступается сам лес."
 
