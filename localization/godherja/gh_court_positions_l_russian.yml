l_russian:
 visvasavrak_employer_custom_effect_description:0 "$BULLET$Снижает шанс погибнуть или попасть в плен в сражениях, где участвуете вы оба"
 visvasavrak_court_position:0 "Висвасаврак"
 visvasavrak_court_position_desc:0 "Этот рыцарь поклялся исполнить волю своего сюзерена или умереть, пытаясь. Подобно тому как Висвасавра стойко противостоял ужасным духам и нежити, стражи-$visvasavrak_court_position|l$ защищают суверенитет монарха."

 legon_court_position:0 "Благородный легон"
 legon_court_position_desc:0 "Легон ваших Благородных легионов. В то время как генералы Государственных легионов теоретически утверждались только аавтократом, каждому [Concept('aversaria','аверсарианскому')|E] гражданину благородного сословия разрешалось назначать легонов во главе своих Благородных легионов. Это почетная должность, но она также часто становилась политической подачкой, и они могли сосредоточить в своих руках опасный объем власти, направленный против своих владык."
 legon_employer_custom_effect_description:0 "$BULLET$Персонаж получает [Concept('trait', 'свойство')|E] «Легон», пока не будет снят с должности"

 state_legon_court_position:0 "Государственный легон"
 state_legon_court_position_desc:0 "Легон одного из могущественных Государственных легионов. Полностью преданные Аавтократу, Государственные легионы исторически наводили ужас на низшие народы мира, и командовать ими считалось высокой честью. Однако золотой век давно прошел, и титул «легон» теперь связывают скорее с военачальством и разбоем, чем со славой. Пора это изменить."

 court_adventurer_court_position:0 "Придворный авантюрист"
 court_adventurer_court_position_desc:0 "[monsters|E], [magi|E], крестьяне. Мир полон всевозможных жутких тварей, и со всего [Concept('aeras','Эраса')|E] стекаются авантюристы, готовые жестоко уничтожать их за хорошую плату. Правители нередко нанимают авантюристов на постоянную службу для защиты своих владений или организации экспедиций, а знаменитые искатели приключений часто становятся ценным трофеем при любом пышном дворе."

 colonial_administrator_court_position:90 "Колониальный администратор"
 colonial_administrator_court_position_desc:90 "[aeras|E] хранит множество чудес — от погребенных в песках руин под знойным солнцем [sarradonian_desert_biozone|E] до тайн, скрытых под кронами древних лесов [whisperveil_biozone|E]. Найти их — удача; покорить — могущество; а найти кого-то достаточно надежного, чтобы заниматься рутинными делами в промежутке, — настоящее чудо."
 colonial_administrator_employer_custom_effect_description:90 "$BULLET$Увеличивает прирост [Concept('colonization_progress', 'прогресса колонизации')|E]"

 court_position_lifestyle_gh_steppe_queen_trait:0 "[GetTrait('lifestyle_gh_steppe_queen').GetName( ROOT.Char )]"
 court_tradition_bastard:0 "$tradition_beloved_bastards_name$"
 court_position_glassinger_modifier:0 "[GetModifier('glassinger_modifier').GetNameWithTooltip]"

 court_adventurer_protect_province:90 "Защита провинций"
 court_adventurer_protect_province_desc:90 "Этому персонажу поручено устранять угрозы во всех [Concept('barony', 'баронствах')|E], принадлежащих его [Concept('liege', 'сюзерену')|E]."
 court_adventurer_adventure:90 "Исследование"
 court_adventurer_adventure_desc:90 "Этому персонажу поручено искать примечательные места."
 court_adventurer_perform_heroics:90 "Совершение подвигов"
 court_adventurer_perform_heroics_desc:90 "Этому персонажу поручено выполнять небольшие поручения простолюдинов и повышать [Concept('prestige','престиж')|E] своего [Concept('liege', 'сюзерена')|E]."

 colonial_administrator_attend_colonial_affairs:90 "Заведование колониальными делами"
 colonial_administrator_attend_colonial_affairs_desc:90 "Этому персонажу поручено любой ценой увеличивать [Concept('colonization_progress', 'прогресс колонизации')|E] в [Concept('colony_holding', 'колониях')|E] своего [Concept('liege', 'сюзерена')|E]."
 colonial_administrator_attend_colonial_affairs_tt:90 "Удваивает прирост [Concept('colonization_progress', 'прогресса колонизации')|E] от [Concept('aptitude', 'пригодности')|E] на [Concept('court_position', 'должности')|E], но повышает вероятность негативных событий в [Concept('colony_holding', 'колонии')|E]."
 colonial_administrator_sustainable_development:90 "Устойчивое развитие"
 colonial_administrator_sustainable_development_desc:90 "Этому персонажу поручено ускорять [development|El] [Concept('colony_holding', 'колонии')|E] в ущерб [Concept('colonization_progress', 'прогрессу колонизации')|E]."
 colonial_administrator_sustainable_development_tt:90 "Заменяет бонус к приросту [Concept('colonization_progress', 'прогресса колонизации')|E] от [Concept('aptitude', 'пригодности')|E] на [Concept('court_position', 'должности')|E] бонусом к росту [Concept('development', 'развития')|E]."
 colonial_administrator_riches_of_the_frontier:90 "Богатства фронтира"
 colonial_administrator_riches_of_the_frontier_desc:90 "Этому персонажу поручено выкачивать богатства из [Concept('colony_holding', 'колоний')|E], чтобы преумножить [prestige|E] и [court_grandeur|E] своего [Concept('liege', 'сюзерена')|E]."
 
 water_seeker_dig_oases_out:0 "Раскопки оазисов"
 water_seeker_dig_oases_out_desc:0 "Этому персонажу поручено откопать источники воды, застрявшие под стоячими водами [sarradon_oasis|E]"
 court_position_desert_nomad:0 "В их [Concept('culture', 'культуре')|E] есть [Concept('culture_tradition', 'традиция')|E] «[GetCultureTradition('tradition_desert_nomads').GetName]»"

 dream_interpreter_court_position:89 "Толкователь снов"
 dream_interpreter_court_position_desc:89 "Толкователь сновидений, способный отделить бессмысленный хаос и вожделенные фантазии от обманчивых истин и глубоких прозрений. Все это делается ради того, чтобы обнажить устройство реальности, с удивительной частотой открывающейся сильным мира сего во сне. Выясненные откровения обычно успокаивают, иногда глубоко трогают, а изредка оказываются правдой."
 
 aniguran_court_position:0 "Анегуран"
 kel_owi_court_position_desc:0 "$aniguran_court_position$ — один из главных генералов в армии сюзерена, обеспечивающий успех в бою."
 
 amashek_court_position:0 "Амашек"
 amashek_court_position_desc:0 "$amashek_court_position$ следит за организацией и благополучием клана, а также за тем, чтобы он был хорошо экипирован для битвы."

 aharawan_court_position:0 "Ахараван"
 aharawan_court_position_desc:0 "$aharawan_court_position$ руководит $bodyguard_court_position_nomadic|l$, гарантируя безопасность своего сюзерена. Заведование безопасностью правителя делает эту должность одной из самых престижных в клане."

 anastafidet_court_position:0 "Анастафидет"
 anastafidet_court_position_desc:0 "$anastafidet_court_position$ следит за тем, чтобы законы сюзерена соблюдались во всей державе."
 
 keeper_of_the_camels_court_position:0 "Смотритель верблюдов"
 keeper_of_the_camels_court_position_desc:0 "$keeper_of_the_camels_court_position$ — почетная должность, отвественная за верховых животных и конюшни сюзерена."
 
 water_seeker_court_position:0 "Агалем"
 water_seeker_court_position_desc:0 "На $water_seeker_court_position|l$ возложена священная обязанность отслеживать и понимать движение воды в [Glossary('Саррадонской пустыне','sarradonian_desert_encyclopedia_desc')]."

 aneguran_court_position:0 "Анегуран"

 court_gaffer_court_position:0 "Придворный стеклодув"
 court_position_gh_lifestyle_glassmith_trait:0 "[Concept('trait_level_track_xp', 'Опыт свойства')] «[GetTrait('gh_lifestyle_glassmith').GetName(GetNullCharacter)]»"
 court_gaffer_court_position_desc:0 "Придворный стеклодув — главный ремесленник в стеклянной мастерской, получивший официальное одобрение своего [Concept('liege', 'сюзерена')|E]. Он должен снабжать [Concept('court', 'двор')|E] изысканными стеклянными изделиями и служить связующим звеном между местными стеклодувами и [Concept('ruler', 'правителем')|E]."
 court_gaffer_employer_custom_effect_description:0 "$BULLET$Может получить [Concept('inspired', 'вдохновение')|E] категории #V Стеклянные изделия#! (в зависимости от [Concept('aptitude', 'пригодности')|E])\n@alert_icon! #alert_trial При увольнении покинет [Concept('court', 'двор')|E]#!"
 court_gaffer_teach_ruler:0 "Обучение правителя"
 court_gaffer_teach_ruler_desc:0 "Этому персонажу платят за то, чтобы он регулярно давал уроки стеклодувного дела своему [Concept('liege', 'сюзерену')|E], словно ученику."
 court_gaffer_teach_ruler_insufficient_experience:0 "[liege.GetShortUIName|U] сильнее в стеклоделии, чем $court_gaffer_court_position$"
 court_gaffer_teach_ruler_tt:0 "[Concept('liege', 'Сюзерен')|E] может каждый месяц получать [Concept('trait_level_track_xp', 'опыт свойства')] «[GetTrait('gh_lifestyle_glassmith').GetName(GetNullCharacter)]»"
 court_gaffer_teach_ruler_title:0 "Уроки с персонажем [ROOT.Char.GetShortUINameNoTooltip]"
 court_gaffer_teach_ruler_notification_desc:0 "[ROOT.Char.GetShortUIName] [Select_CString(ROOT.Char.IsLocalPlayer, 'обучили', Select_CString(ROOT.Char.IsFemale, 'обучила', 'обучил' ))] [Select_CString(liege.IsLocalPlayer, '', 'персонажа ' )|l][liege.GetShortUINamePossessive|l][Select_CString(liege.IsLocalPlayer, 'его персонажа', '' )] стеклодувному делу"

 court_gaffer_expand_the_workshop:0 "Расширение мастерской"
 court_gaffer_expand_the_workshop_desc:0 "Этому персонажу поручено расширить производство в мастерской, освоить новые методы стеклоделия и стремиться к вершинам ремесла."
 court_gaffer_expand_the_workshop_tt:0 "Каждый месяц у этого персонажа есть шанс получить [Concept('trait_level_track_xp', 'опыт свойства')] «[GetTrait('gh_lifestyle_glassmith').GetName(GetNullCharacter)]», а шанс обрести [Concept('inspired', 'вдохновение')|E] категории #V Стеклянные изделия#! значительно повышается."

 court_position_court_gaffer:0 "[GetCourtPositionType('court_gaffer_court_position').GetName()]"
 court_position_desc_court_gaffer:0 "выдувает для вас великолепную стеклянную посуду"
 court_position_subject_glasswork:0 "стеклянная посуда"

 court_gaffer_inspired_effect:0 "[Select_CString(gaffer.IsFemale, 'Ваша', 'Ваш' )] [GetCourtPositionType('court_gaffer_court_position').GetName()|l] [gaffer.GetFirstName] [Select_CString(gaffer.IsFemale, 'получила', 'получил' )] [Concept('inspiration', 'вдохновение')|E]"

 COURT_POSITION_CATEGORY_IMPERIAL_NAME:0 "Имперские"