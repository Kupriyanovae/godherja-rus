 gh_mishap_air: "лишён всего, что не было прибито гвоздями"
 gh_mishap_stone: "покорёжен там, где пол пытался стать стеной"
 gh_mishap_dark: "неосвещён так, что это не имеет никакого отношения к часу"
 gh_mishap_light: "выжжен до бледности, тени застыли там, где упали"
 gh_mishap_death: "стал холодным и тихим, и мыши в стенах вместе с ним"
 gh_mishap_nature: "зелёный до потолка и всё ещё выпускает побеги"
 gh_mishap_blood: "отмечен так, что слуги отказываются оттирать"
 gh_mishap_metal: "увешан железом, которое растеклось, как свечной воск"
 gh_mishap_dream: "неправильный так, что никто, кто пройдёт через него, не сможет описать после"
 gh_mishap_ethereal: "тонкий, словно комната местами протёрлась"
 gh_mishap_celestial: "освещён откуда-то значительно дальше окон"
 gh_mishap_hymns: "звенит слабо, и с тех пор не прекращалось"
 gh_mishap_sand: "наполовину засыпан песком, который появился из ниоткуда"
 gh_mishap_time: "на час отстаёт от остального дома"
 gh_mishap_dawn: "вымыт серым, словно утро случилось в нём без кого-либо"
 gh_mishap_generic: "в состоянии, которое управляющий отказывается оценить"

# --- 0005: what the apprentice says when you walk in ---
 gh_excuse_arrogant: "Оно бы удержалось. Пропорции были верны. Что-то в комнате было не так."
 gh_excuse_shy: "Я [Select_CString(gh_apprentice.IsFemale, 'проверяла', 'проверял')]. Я [Select_CString(gh_apprentice.IsFemale, 'проверяла', 'проверял')] дважды. Простите, я [Select_CString(gh_apprentice.IsFemale, 'проверяла', 'проверял')]."
 gh_excuse_honest: "Я [Select_CString(gh_apprentice.IsFemale, 'вышла', 'вышел')] за то, чему меня учили. Я [Select_CString(gh_apprentice.IsFemale, 'знала', 'знал')], что [Select_CString(gh_apprentice.IsFemale, 'делала', 'делал')] это, пока [Select_CString(gh_apprentice.IsFemale, 'делала', 'делал')], и прошу прощения."
 gh_excuse_deceitful: "Оно уже было нестабильным, когда я [Select_CString(gh_apprentice.IsFemale, 'вошла', 'вошёл')]. Я [Select_CString(gh_apprentice.IsFemale, 'пыталась', 'пытался')] сделать его безопасным."
 gh_excuse_craven: "Пожалуйста. Оно не должно было быть чем-то. Оно вообще не должно было быть чем-то."
 gh_excuse_brave: "Это было моё. Я [Select_CString(gh_apprentice.IsFemale, 'сделала', 'сделал')] это, никто мне не [Select_CString(gh_apprentice.IsFemale, 'помогала', 'помогал')], и я всё исправлю."
 gh_excuse_diligent: "У меня есть записи. Каждый шаг записан. Вы можете точно увидеть, где оно повернуло."
 gh_excuse_ambitious: "Это должно было сработать. Ещё час, и оно стоило бы всего этого."
 gh_excuse_generic_1: "Я не знаю, что случилось. Оно держалось, а потом перестало."
 gh_excuse_generic_2: "Я могу это исправить. Дайте мне до утра, и я смогу это исправить."

# --- 0007: what I make of settling a grievance this way ---
 gh_duel_stakes_tradition: "Так мой народ всегда это улаживал."
 gh_duel_stakes_arrogant: "Это грубый способ уладить что угодно. И он также будет очень коротким."
 gh_duel_stakes_brave: "Есть и худшие способы ответить перед свидетелями."
 gh_duel_stakes_zealous: "Пусть это решится тем, что каждому из нас дано, и пусть это будет ответом."
 gh_duel_stakes_craven: "Это глупый способ умереть, но я видел, как более умные люди на это шли."
 gh_duel_stakes_cynical: "Это не решает ничего, кроме того, кто был лучше в этом."
 gh_duel_stakes_temperate: "Это много шума из-за разногласия, из которого были другие выходы."
 gh_duel_stakes_generic: "Это глупый способ уладить что угодно."

# --- 0019.e: let the executioner do the digging ---
 gh_arcana_lifestyle.0019.e: "Пусть [gh_gravedigger.GetTitledFirstName] сделает это."
 gh_arcana_lifestyle.0019.e.flavor: "Работа ниже меня и полностью входит в [gh_gravedigger.GetHerHis] обычные обязанности. [gh_gravedigger.GetSheHe] не спросит, для чего кости, за что я [gh_gravedigger.GetHerHim] в основном и плачу."
 gh_arcana_lifestyle.0019.e.clean: "[gh_gravedigger.GetSheHe] уходит в сумерках и возвращается до смены караула, неся мешок и никаких объяснений."
 gh_arcana_lifestyle.0019.e.seen: "[gh_gravedigger.GetSheHe] приносит мешок обратно. [gh_gravedigger.GetSheHe] также приносит тот факт, что двое мужчин из [gh_settlement.Custom('BaronyTownType')] видели, как [gh_gravedigger.GetSheHe] это делал, и точно знают, чью ливрею [gh_gravedigger.GetSheHe] носит."

 gh_arcana_lifestyle.0045.t: "Упавший осколок"
 gh_arcana_lifestyle.0045.desc: "Осколок [Concept('aervalr','Эрвала')|E] упал на [gh_shard_county.GetName] некоторое время назад и с тех пор лежит наполовину закопанным и совершенно тихим. Но крестьяне боятся, что он медленно убивает людей, а маги предполагают, что он стоит больше, чем окружающее его графство. И то, и другое может быть ложью, но со временем всё больше крестьян начинает верить, что от него одни неприятности.\n\n[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(gh_witness.IsFemale, 'принесла', 'принёс')] мне счёт снова, и он не улучшился. \"Четверо за сезон, [ROOT.Char.Custom('FormOfAddressForLiege')]. Двое, говорят, ослепли, один не проснулся, а четвёртый ушёл в лес и не вернулся.\" — говорит [gh_witness.GetSheHe]. Если ничего не сделать, истерия может выйти из-под контроля."
 gh_arcana_lifestyle.0045.a: "Оцепить и выставить охрану. Никто не подходит к нему."
 gh_arcana_lifestyle.0045.a.flavor: "Оно может полежать там ещё немного, чтобы мои люди на него не лазили."
 gh_arcana_lifestyle.0045.b: "Вырубить в нём каменоломню."
 gh_arcana_lifestyle.0045.b.flavor: "Каждый кусок, выходящий из этой скалы, стоит огромных денег для магов повсюду."
 gh_arcana_lifestyle.0045.b.tt: "Каменоломня снова даст результат со временем"
 gh_arcana_lifestyle.0045.c: "Я хочу лучше понять его."
 gh_arcana_lifestyle.0045.c.flavor: "Эрвал, вероятно, хранит много секретов старше жизни."
 gh_arcana_lifestyle.0045.c.read: "Это не камень с чем-то внутри. Это единое колдовство, всё ещё работающее, которое терпит неудачу очень долгое время. Я следую за его формой так далеко, как могу выдержать."
 gh_arcana_lifestyle.0045.c.repelled: "Я заглядываю, возможно, на треть в его структуру, прежде чем вернуться к реальности, когда треть дня прошла."
 gh_arcana_lifestyle.0045.quarry_yield: "Каменоломня даёт результат"
 gh_arcana_lifestyle.0045.quarry_yield.tt: "Каменоломня осколка произвела ещё один фрагмент"
 gh_quickened_ground_modifier: "Оживлённая земля"
 gh_quickened_ground_modifier_desc: "Девять акров почвы растят то, что им велено растить."
 gh_shard_quarry_modifier: "Каменоломня осколка"
 gh_shard_quarry_modifier_desc: "Действующая каменоломня, вырубленная в упавшем осколке. Камень, выходящий из неё, стоит очень много."
 gh_shard_interdict_modifier: "Запрет на осколок"
 gh_shard_interdict_modifier_desc: "Никто не ступает на землю вокруг осколка, по приказу и под вооружённой охраной."

 gh_sealed_shelves_modifier: "Запечатанные полки"
 gh_sealed_shelves_modifier_desc: "Библиотека защищена. Ничто не выходит из неё без разрешения, и любой, кто попытается, обнаружит, что полки менее сговорчивы, чем он ожидал."
 gh_scoured_modifier: "Вычищенный"
 gh_scoured_modifier_desc: "Лихорадка изгнана силой. Это сработало, и она забрала с собой что-то, что не совсем отросло обратно."
 gh_mapped_the_stone_modifier: "Нанесённый на карту камень"
 gh_mapped_the_stone_modifier_desc: "Камера, прочитанная до самых соединений. Точное знание того, как устроено место, остаётся полезным ещё долго после того, как ты из него вышел."
 gh_undivided_modifier: "Неразделённый"
 gh_undivided_modifier_desc: "Этот персонаж решил не позволять одной части магии делать остальные меньше. От этого шире и труднее поколебим."
 gh_hand_stayed_modifier: "Удержал руку"
 gh_hand_stayed_modifier_desc: "Достиг порога и решил не переступать его. Знание, что ты можешь остановиться, — это своего рода власть, и люди находят этого персонажа несколько менее тревожным из-за этого."
 gh_cowed_modifier: "Запуганный"
 gh_cowed_modifier_desc: "Этот персонаж стоял достаточно близко, чтобы увидеть, как это делается, и с тех пор не перестаёт об этом думать. Они делают, что им говорят, и делают это плохо."
 gh_unbound_beast_modifier: "Что-то в холмах"
 gh_unbound_beast_modifier_desc: "На это посмотрели, записали и оставили в покое. Теперь каждый, кому приходится пересекать ту землю после темноты, знает об этом и о том, кто решил оставить это."
 gh_omen_driven_off_modifier: "Знамение изгнано"
 gh_omen_driven_off_modifier_desc: "Что бы ни слонялось у путевой линии, оно ушло. Никто не мог сказать, что это было, но, возможно, это к лучшему."

 #####################################
 # 46. The Warlock-Vassal
 #####################################
 gh_arcana_lifestyle.0046.t: "Выскочка"
 gh_arcana_lifestyle.0046.desc: "[gh_warlock_vassal.GetTitledFirstName] [Select_CString(gh_warlock_vassal.IsFemale, 'перестала', 'перестал')] уважать мою власть.\n\nПризывы были разосланы и вернулись без ответа. Их ополчение прибывает поздно и в недостатке. И когда мои люди пошли спросить почему, [gh_warlock_vassal.GetSheHe] [Select_CString(gh_warlock_vassal.IsFemale, 'сказала', 'сказал')], что тот, кто может взывать к [Concept('magic','магии')|E], не стоит во дворе в ожидании писца.\n\n[gh_mundane_vassal.GetTitledFirstName] выразился яснее за столом прошлой ночью: либо их \"Искусство\" подчиняется моему закону, либо мой закон — просто вежливость."
 gh_arcana_lifestyle.0046.a: "Тогда мы должны выяснить, что именно."
 gh_arcana_lifestyle.0046.a.flavor: "Ошейник не всегда оскорбление."
 gh_arcana_lifestyle.0046.a.heeled: "Уступка подписана"
 gh_arcana_lifestyle.0046.a.defied: "Ты [Select_CString(ROOT.Char.IsFemale, 'потянулась', 'потянулся')] и [Select_CString(ROOT.Char.IsFemale, 'не сомкнула', 'не сомкнул')] ничего."
 gh_arcana_lifestyle.0046.b: "Пусть бормочут. [gh_warlock_vassal.GetFirstName] имеет мою поддержку."
 gh_arcana_lifestyle.0046.b.flavor: "Королевство, которое укрывает магию, должно заявить об этом так, чтобы все слышали."
 gh_arcana_lifestyle.0046.c: "Оба. Сядьте."
 gh_arcana_lifestyle.0046.c.flavor: "Ни один из них не получит то, за чем пришёл."
 gh_arcana_lifestyle.0046.c.settled: "Условия установлены, и оба подписывают"
 gh_arcana_lifestyle.0046.c.stalled: "Они уходят из-за стола, всё ещё споря"

 #####################################
 # 47. The Question of Magic
 #####################################
 gh_arcana_lifestyle.0047.t: "Вопрос о магии"
 gh_arcana_lifestyle.0047.desc.seizure: "Горожане взяли деревенскую ведьму из деревни в нескольких днях езды отсюда, и говорят, они уже построили костёр.\n\nИнквизиторы не спрашивали. Но они всё ещё хотят мою печать на этом. [gh_petitioner.GetTitledFirstName] во внешнем зале, и с рассвета. За [gh_petitioner.GetHerHim] вопрос, который никто в этом королевстве ещё не заставил меня произнести вслух: чем именно Искусству позволено быть здесь?"
 gh_arcana_lifestyle.0047.desc.petition: "Несколько деревенских магов и мистиков пришли с документами, и по этому я понимаю, что они серьёзны.\n\n[gh_petitioner.GetTitledFirstName] говорит за них. Уставы, [gh_petitioner.GetSheHe] говорит. Реестр. Названная власть, которой нужно отвечать, и в обмен защита с моим именем на ней, чтобы практикующий, путешествующий по моему королевству, был подданным, а не тем, с кем разбирается тот, кто найдёт [gh_petitioner.GetHerHim] первым.\n\nЭто разумно, но каким именно должно быть место магии в моём королевстве?"
 gh_arcana_lifestyle.0047.a.seizure: "Искусство отвечает перед алтарём. Пусть горит."
 gh_arcana_lifestyle.0047.a.petition: "Отказано — и я заберу этот реестр. Имён для наблюдения."
 gh_arcana_lifestyle.0047.a.flavor: "Каждый практикующий в королевстве услышит об этом к концу недели."
 gh_arcana_lifestyle.0047.b: "Они мои. Кто тронет их, ответит передо мной."
 gh_arcana_lifestyle.0047.b.flavor: "Те, кому некуда идти, придут сюда и запомнят, кто сказал это первым."
 gh_arcana_lifestyle.0047.c.seizure: "Сегодня никого не сжигают. Но их зарегистрируют и обложат налогом."
 gh_arcana_lifestyle.0047.c.petition: "Тогда уставы. Зарегистрированы, обложены налогом и подотчётны."
 gh_arcana_lifestyle.0047.c.flavor: "Ни один лагерь не получает королевство, которое хотел. Оба получают возможность продолжать жить в этом."

 #####################################
 # 48. A Blight Upon the Land
 #####################################
 gh_arcana_lifestyle.0048.t: "Порча на земле"
 gh_arcana_lifestyle.0048.desc: "[gh_blighted_county.GetName] умирает, но от чего, я не знаю.\n\nПервые всадники сказали, что мёртвые не остаются лежать. Вторые сказали, что поля превращаются в пепел у них на глазах. Третий вернулся бледным и голодным, крича о [GetTrait('shade_stricken').GetName( GetNullCharacter )] телах.\n\n[gh_witness.GetTitledFirstName] [Select_CString(gh_witness.IsFemale, 'прочитала', 'прочитал')] то, что можно было прочитать, но всё ещё [Select_CString(gh_witness.IsFemale, 'озадачена', 'озадачен')], как это пришло. \"Это распространяется, [ROOT.Char.Custom('FormOfAddressForLiege')],\" — говорит [gh_witness.GetSheHe]. \"Как это началось, я не могу тебе сказать. Но оно не остановится само.\""
 gh_arcana_lifestyle.0048.a: "Запечатать. Ничто не входит и ничто не выходит."
 gh_arcana_lifestyle.0048.a.flavor: "Графство потеряно в любом случае, но мы можем спасти других."
 gh_arcana_lifestyle.0048.b: "Чего бы это ни стоило, мы должны найти способ!"
 gh_arcana_lifestyle.0048.b.flavor: "Для этого и нужны маги."
 gh_arcana_lifestyle.0048.c: "Что-то начало это, и мы должны узнать, что это было."
 gh_arcana_lifestyle.0048.c.flavor: "Порча будет продолжать работать, пока ты ищешь. Это цена знания."
 gh_arcana_lifestyle.0048.c.hunt_tt: "Твои маги начинают охоту за тем, что это начало. [gh_blighted_county.GetName] остаётся #X поражённым#! пока они ищут, и сегодня ничего не снимается.\nОни вернутся с отчётом через несколько месяцев, и то, что они найдут, можно будет решить в корне."
 gh_arcana_lifestyle.0048.b.cleansed: "Земля возвращается"
 gh_arcana_lifestyle.0048.b.partial: "Порча снимается. Не всё, чего она коснулась, тоже."

 #####################################
 # 50. A Blight Upon the Land - the root cause
 #####################################
 gh_arcana_lifestyle.0050.t: "Что было под"
 gh_arcana_lifestyle.0050.desc.site: "Они нашли это в конце, что, как мне говорят, и есть трудная часть.\n\nПод старым курганным полем на краю [gh_blighted_county.GetName] есть тёмное место, которое должно было быть запечатано и не было, или было запечатано кем-то, кто не понимал, что делает. Оно было открыто долго. Достаточно долго, чтобы порча была лишь симптомом.\n\n[gh_witness.GetTitledFirstName] говорит, что его можно закрыть. [gh_witness.GetSheHe] не говорит, что это будет приятно."
 gh_arcana_lifestyle.0050.desc.being: "Они нашли это в конце, что, как мне говорят, и есть трудная часть.\n\nВ [gh_blighted_county.GetName] живёт нечто, что не было рождено и не намерено уходить. Оно не большое. Оно просто старое, терпеливое, чёрное как смоль, и оно питалось тем графством дольше, чем кто-либо считал.\n\nОно знает, что мы теперь ищем. Это может быть не в нашу пользу."
 gh_arcana_lifestyle.0050.a: "Тогда мы покончим с этим в корне."
 gh_arcana_lifestyle.0050.a.flavor: "Знание того, что это такое, не делает это безопасным для прикосновения."
 gh_arcana_lifestyle.0050.a.rooted_out: "Это закончено, и земля исцелится"
 gh_arcana_lifestyle.0050.a.escaped: "Оно выскальзывает на свободу, и земля сохраняет шрам"
 gh_arcana_lifestyle.0050.b: "Записать то, что мы знаем, и запечатать графство."
 gh_arcana_lifestyle.0050.b.flavor: "Кто-то столкнётся с этим снова. Они не должны начинать с нуля."

 #####################################
 # 49. The Shared Dream
 #####################################
 gh_arcana_lifestyle.0049.t: "Общий сон"
 gh_arcana_lifestyle.0049.desc: "Каждая душа в [gh_dream_county.GetName] видит один и тот же сон, и так уже несколько ночей.\n\nУтонувший город. Башни стоят в стоячей воде, и в них всё ещё горит свет.\n\nПоловина графства называет это пророчеством. Другая половина перестала спать нарочно, и это заметно. \"Что бы ни осело на той земле,\" — осторожно говорит [gh_witness.GetTitledFirstName], \"оно осело не случайно.\""
 gh_arcana_lifestyle.0049.a: "Послать кого-нибудь, кто умеет слушать как следует."
 gh_arcana_lifestyle.0049.a.flavor: "Сон, приходящий по расписанию, — это сообщение, которое не нашло своего читателя."
 gh_arcana_lifestyle.0049.a.omen: "Сон прочитан правильно"
 gh_arcana_lifestyle.0049.a.caught: "Твой читатель теперь тоже видит его во сне"
 gh_arcana_lifestyle.0049.b: "Защитить деревню. Пусть спят."
 gh_arcana_lifestyle.0049.b.flavor: "Они будут спать и благодарить тебя за это, и никогда не узнают, что говорилось. Ты тоже не узнаешь."
 gh_arcana_lifestyle.0049.c: "Это пройдёт. Большинство вещей проходит."
 gh_arcana_lifestyle.0049.c.flavor: "Некоторые из них сломаются до того, как оно пройдёт. Немногие выйдут с другой стороны изменёнными."
 gh_arcana_lifestyle.0049.c.touched_tt: "Некоторые из спящих могут выйти другими"

 # Modifiers from events 46-50
 gh_arbiter_of_the_art_modifier: "Арбитр Искусства"
 gh_arbiter_of_the_art_modifier_desc: "Ты уладил ссору из-за [Concept('magic','магии')|E], которую ни одна из сторон не могла уладить сама. Обе половины зала теперь приносят такие вещи тебе первым, что утомительно и чрезвычайно полезно."
 gh_sworn_of_the_art_modifier: "Присягнувший Искусству"
 gh_sworn_of_the_art_modifier_desc: "Вассал, чьё положение как практикующего опирается на слово сюзерена, а не на собственную силу. Они осознают разницу."
 gh_the_art_proscribed_modifier: "Искусство запрещено"
 gh_the_art_proscribed_modifier_desc: "Магия изгнана из открытого пространства здесь. То, что от неё осталось, скрытно, недоучено и обижено, и графство потеряло тихие преимущества, которые с ней приходили."
 gh_haven_of_the_art_modifier: "Убежище Искусства"
 gh_haven_of_the_art_modifier_desc: "Слово путешествует среди практикующих быстрее, чем среди лордов."
 gh_protector_of_the_art_modifier: "Защитник Искусства"
 gh_protector_of_the_art_modifier_desc: "Ты поставил своё имя между практикующими твоего королевства и всеми, кто хотел с ними разобраться. Они не забыли это. Духовенство тоже."
 gh_the_compact_modifier: "Договор"
 gh_the_compact_modifier_desc: "Уставы, реестр, плата и названная власть, которой нужно отвечать. Маги возмущены тем, что их считают, другие возмущены тем, что счёт — это всё, что происходит, и договорённость пока выдерживает и то, и другое."
 gh_blighted_ground_modifier: "Порченная земля"
 gh_blighted_ground_modifier_desc: "Что-то работает над этим графством, что не отвечает ни сезону, ни медицине. Мёртвые не успокаиваются, поля превращаются в пепел, и это ещё не закончено."
 gh_quarantined_county_modifier: "Запечатано от порчи"
 gh_quarantined_county_modifier_desc: "Ничто не входит и ничто не выходит. Графство не вылечено; оно сдерживается, и люди внутри знают это."
 gh_cleansed_ground_modifier: "Очищенная земля"
 gh_cleansed_ground_modifier_desc: "Колдовство было снято как следует, и землю потом возделывали. Теперь она растёт лучше, чем прежде."
 gh_lingering_mutation_modifier: "Остатки порчи"
 gh_lingering_mutation_modifier_desc: "Недуг ушёл. То, что он сделал с людьми, пережившими его, — нет, и их дети тоже это показывают."
 gh_shared_dream_modifier: "Общий сон"
 gh_shared_dream_modifier_desc: "Каждый спящий в графстве видит одно и то же в одни и те же ночи. Некоторые перестали спать нарочно."
 gh_dream_warded_modifier: "Защищённый от снов"
 gh_dream_warded_modifier_desc: "Резонанс закрыт, и графство снова спит. Что бы ни говорилось, оно остаётся несказанным."
 gh_read_the_omen_modifier: "Знамение прочитано"
 gh_read_the_omen_modifier_desc: "Сон оказался сообщением, и кто-то наконец прочитал его. Графство спит и держится как место, которое предупредили вовремя."
 gh_dreamsick_county_modifier: "Больной снами"
 gh_dreamsick_county_modifier_desc: "Это выгорело само, как это бывает, и забрало с собой часть графства. Те, кто ещё здесь, не говорят об одиннадцати ночах."
 gh_dream_touched_modifier: "Тронутый сном"
 gh_dream_touched_modifier_desc: "Они вынесли что-то из сна, который был не их. Оно не ушло, и в некоторые ночи всё ещё говорит."

 # Opinion modifiers from events 46-47
 gh_magi_privilege_curbed_opinion: "Обуздание Искусства"
 gh_magi_privilege_checked_opinion: "Обуздание колдунов"
 gh_arcane_patron_opinion: "Покровительство Искусству"
 gh_arcane_patron_devout_opinion: "Потакание колдунам"
 gh_arbitration_accepted_opinion: "Справедливое рассуждение"
 gh_the_art_proscribed_opinion: "Запрет Искусства"
 gh_the_art_proscribed_devout_opinion: "Очищение державы"
 gh_the_compact_opinion: "Навязывание Договора"