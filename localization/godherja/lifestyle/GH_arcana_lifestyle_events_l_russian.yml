l_russian:
 gh_duel_arcana_name: "[arcana_i][Concept('arcana','аркана')|E]"
 gh_duel_hymns_name: "@gh_hymns_icon![aspect_hymns]"
 gh_arcana_lifestyle.0001.t: "Торговец диковинами"
 gh_arcana_lifestyle.0001.desc: "Телега — наполовину рыночный прилавок, наполовину реликварий, и [gh_peddler.GetTitledFirstName] обладает неторопливым терпением того, кто уже [Select_CString(gh_peddler.IsFemale, 'продавала', 'продавал')] [Concept('magi','магам')|E] прежде.\n\nБольшая часть — [ROOT.Char.Custom('GH_PeddlerStock')], разложенная с большей торжественностью, чем заслуживает. Единственное, что удостоено собственной ткани, — это книга, и [Select_CString(gh_peddler.IsFemale, 'торговка', 'торговец')] не делает никаких заявлений, кроме цены. Эта сдержанность — либо честность, либо старейший трюк на свете."
 gh_arcana_lifestyle.0001.a: "Взглянуть как следует."
 gh_arcana_lifestyle.0001.b: "Взять реагенты."
 gh_arcana_lifestyle.0001.c: "Тогда книгу. Назови свою цену."
 gh_arcana_lifestyle.0001.d: "Проходи."
 gh_prepared_reagents_modifier: "Приготовленные реагенты"
 gh_prepared_reagents_modifier_desc: "Запас приготовленных реагентов, каким бы образом он ни был добыт.\n\n$EFFECT_LIST_BULLET$Покрывает [gold_i][Concept('gold','золотом')|E] стоимость компонентов для одного [Concept('gh_ritual','ритуала')|E]\n$TAB$#weak Расходуется при проведении ритуала. Если не использовать, реагенты портятся в течение года.#!"
 gh_peddler_stock_fire: "стекло из пепла и запечатанные банки с чем-то, что движется, когда на это падает свет"
 gh_peddler_stock_water: "дождевая вода в бутылях, речной ил и банка того, что вежливо называют морским стеклом"
 gh_peddler_stock_dark: "пещерный лишайник, незажжённые свечи и порошки, хранящиеся в двойной ткани"
 gh_peddler_stock_death: "могильные лилии, костная пыль и ящик, который торговец не открывает"
 gh_peddler_stock_nature: "сушёный корень и семенные коробочки, каждая подписана чужой рукой"
 gh_peddler_stock_generic_1: "мел, сало, соль и множество самой обычной верёвки"
 gh_peddler_stock_generic_2: "медные опилки, сушёные травы и три сорта чернил"
 gh_peddler_stock_generic_3: "воск, проволока, каменная пыль и пучок перьев"
 gh_arcana_lifestyle.0002.t: "Заблудший фамильяр"
 gh_arcana_lifestyle.0002.desc: "Оно приходит в один и тот же угол внешнего двора уже шесть ночей, и [gh_witness.GetTitledFirstName] [Select_CString(gh_witness.IsFemale, 'вела', 'вел')] счёт. \"Когда-то оно было животным, [ROOT.Char.Custom('FormOfAddressForLiege')]. Оно всё ещё имеет его форму,\" — сообщает [gh_witness.GetSheHe]. Оно пришло с [Concept('waylines','лей-линией')|E] и не ушло. Чем бы оно ни питалось, это не может быть хорошо для остальных."
 gh_arcana_lifestyle.0002.a: "Мы должны найти способ связать его."
 gh_arcana_lifestyle.0002.b: "Наблюдать за ним и записывать, что оно делает."
 gh_arcana_lifestyle.0002.c: "Прогнать его, пока оно не узнало чего-то ещё."
 gh_arcana_lifestyle.0002.d: "Оно может не кровоточить, но всё ещё может умереть."
 artifact_mountconstruct_name: "Связанная конструкция"
 artifact_mountconstruct_desc: "Ни зверь, которым оно было, ни то, чем оно могло бы стать, но нечто, застрявшее между двумя и удерживаемое связью."
 gh_arcana_lifestyle.0003.t: "Дрожь путевой линии"
 gh_arcana_lifestyle.0003.desc.magi: "[gh_tremor_magi.Custom2('MyCharacterIntroduction', ROOT.Char)|U] не ждёт, чтобы [Select_CString(gh_tremor_magi.IsFemale, 'её', 'его')] объявили.\n\n[Concept('waylines','лей-линия')|E] под [ROOT.Char.GetPrimaryTitle.GetName] пульсирует уже неделю, и сегодня она вышла на поверхность. Свечи оплывают без сквозняка. Молоко скисает в ведре. Каждая гончая внутри стен не спит с рассвета.\n\n\"Это пройдёт, [ROOT.Char.Custom('FormOfAddressForLiege')]. Такое всегда проходит. Единственный вопрос — не заберут ли что-нибудь из этого первым, и кто именно,\" — говорит [gh_tremor_magi.GetSheHe]."
 gh_arcana_lifestyle.0003.desc.household: "Мой управляющий приносит новости дважды, прежде чем я воспринимаю их всерьёз.\n\n[Concept('waylines','лей-линия')|E] под [ROOT.Char.GetPrimaryTitle.GetName] пульсирует уже неделю, и сегодня она вышла на поверхность. Свечи оплывают без сквозняка. Молоко скисает в ведре. Каждая гончая внутри стен не спит с рассвета.\n\nЭто пройдёт. Такое всегда проходит. Единственный вопрос — не заберут ли что-нибудь из этого первым, и кто именно."
 gh_arcana_lifestyle.0003.a: "Взять часть силы в себя."
 gh_arcana_lifestyle.0003.b: "Защитить его и отпустить."
 gh_arcana_lifestyle.0003.c: "Отправить [gh_tremor_magi.GetName] нанести его на карту."
 gh_arcana_lifestyle.0003.c.tt: "[gh_tremor_magi.GetName] вернётся с отчётом о прогрессе через несколько месяцев."
 gh_arcana_lifestyle.0004.t: "Что хранила путевая линия"
 gh_arcana_lifestyle.0004.desc: "[gh_tremor_magi.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(gh_tremor_magi.IsFemale, 'находилась', 'находился')] внизу у [Concept('waylines','линии')|E] с момента тремора и возвращается с видом того, кто задерживал дыхание два месяца."
 gh_arcana_lifestyle.0004.a: "Хорошо."
 gh_arcana_lifestyle.0004.b: "А какова цена?"
 gh_arcana_lifestyle.0005.t: "Колдовство, пошедшее не так"
 gh_arcana_lifestyle.0005.desc: "Шум доносится до меня задолго до новостей.\n\nПаж находит меня на лестнице и рассказывает плохо, но суть ясна: [gh_apprentice.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(gh_apprentice.IsFemale, 'работала одна', 'работал один')] в восточном зале, работа вышла из-под [gh_apprentice.GetHerHis] рук, и зал теперь [gh_apprentice.Custom('GH_MishapKind')]. Связывание, которое [gh_apprentice.GetSheHe] [Select_CString(gh_apprentice.IsFemale, 'пыталась', 'пытался')] совершить, не столько провалилось, сколько остановилось на полпути.\n\n[gh_apprentice.GetTitledFirstName] всё ещё стоит в дверях, когда я прихожу, руки опущены, [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', gh_apprentice)]. [gh_apprentice.GetSheHe] выдавливает: \"[gh_apprentice.Custom('GH_ApprenticeExcuse')]\""
 gh_arcana_lifestyle.0005.a: "Показать им, где оно пошло не так."
 gh_arcana_lifestyle.0005.b: "Пусть двор увидит, чего заслуживает беспечность."
 gh_arcana_lifestyle.0005.c: "Этого никогда не было."
 gh_arcana_lifestyle.0005.d: "В камеры. Пусть остынут в темноте."
 gh_arcana_lifestyle.0006.t: "Шёпот в камне"
 gh_arcana_lifestyle.0006.desc: "Сначала слуги отказались спускаться в корневой погреб, затем стража, а теперь и [gh_witness.GetTitledFirstName] не желает, и не стесняется об этом сказать. \"Это не сквозняк. Сквозняк не ждёт, пока ты остановишься, [ROOT.Char.Custom('FormOfAddressForLiege')]. Постой там и послушай до счёта десять. Потом скажи мне, что это сквозняк,\" — говорит [gh_witness.GetSheHe] без выражения."
 gh_arcana_lifestyle.0006.a: "Слушать как следует."
 gh_arcana_lifestyle.0006.b: "Защитить залы и покончить с этим."
 gh_arcana_lifestyle.0006.c: "Это сквозняк. Это всегда был сквозняк."
 gh_arcana_lifestyle.0006.e: "Спеть в ответ."
 gh_arcana_lifestyle.0007.t: "Дуэль колдунов"
 gh_arcana_lifestyle.0007.desc: "[gh_duel_rival.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ждёт, пока зал наполнится, прежде чем говорить смело. \"Ни стали. Ни секундантов. Всё, что мы двое сможем удержать, и мы все узнаем, кого из нас стоило слушать,\" — говорит [gh_duel_rival.GetSheHe], достаточно громко, чтобы донести до дальнего конца зала.\n\nЧто могу удержать я — [ROOT.Char.Custom('GH_DuelStyle')]. Что может удержать [gh_duel_rival.GetSheHe] — [gh_duel_rival.Custom('GH_DuelStyle')]. [ROOT.Char.Custom('GH_DuelStakes')]"
 gh_arcana_lifestyle.0007.a: "Тогда давайте выясним."
 gh_arcana_lifestyle.0007.b: "Дотянуться до того, чего они не ожидают."
 gh_arcana_lifestyle.0007.c: "Мне нечего тебе доказывать."
 gh_arcana_lifestyle.0008.t: "Вызов бури"
 gh_arcana_lifestyle.0008.desc.drought: "[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)|U] имеет отчёты и, вероятно, [Select_CString(gh_witness.IsFemale, 'держала', 'держал')] их две недели, надеясь, что они улучшатся.\n\n\"Колодцы в трёх деревнях превратились в грязь, [ROOT.Char.Custom('FormOfAddressForLiege')]. Дожди не пришли и не придут,\" — признаёт [gh_witness.GetSheHe].\n\nЯ чувствую это отсюда; всё небо устроено неправильно, и оно было неправильным с весны."
 gh_arcana_lifestyle.0008.desc.flood: "[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)|U] имеет отчёты и явно [Select_CString(gh_witness.IsFemale, 'держала', 'держал')] их две недели, надеясь, что они улучшатся.\n\n\"Низинные поля под водой с самого таяния, [ROOT.Char.Custom('FormOfAddressForLiege')]. Вода не уходит. Она прибывает,\" — признаёт [gh_witness.GetSheHe].\n\nЯ чувствую это отсюда; всё небо устроено неправильно, и оно было неправильным с весны."
 gh_arcana_lifestyle.0008.a.drought: "Вызвать дожди."
 gh_arcana_lifestyle.0008.a.flood: "Отвести бурю."
 gh_arcana_lifestyle.0008.b: "Может, что-нибудь поменьше?"
 gh_arcana_lifestyle.0008.c: "Погода не нам перечить."
 gh_arcana_lifestyle.0009.t: "Демонстрация силы"
 gh_arcana_lifestyle.0009.desc: "[gh_restless_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(gh_restless_vassal.IsFemale, 'перестала', 'перестал')] понижать [gh_restless_vassal.GetHerHis] голос, и остальной зал перестал делать вид, что не слышит.\n\n\"Правитель, которому нужна [Concept('magic','магия')|E], чтобы удержать зал, не имеет ничего за душой!\" — говорит [gh_restless_vassal.GetSheHe] и не утруждает себя понижением голоса.\n\n[Select_CString(ROOT.Char.IsFemale, 'Я могла бы', 'Я мог бы')] закончить разговор сегодня днём. [ROOT.Char.Custom('GH_ShowOfPower')] Каждый из них ушёл бы домой тихим, и ни один не забыл бы, что из двух вещей я [Select_CString(ROOT.Char.IsFemale, 'выбрала', 'выбрал')] быть."
 gh_arcana_lifestyle.0009.a: "Пусть увидят, тогда."
 gh_arcana_lifestyle.0009.b: "Демонстрация. Не более."
 gh_arcana_lifestyle.0009.c: "Ответить им [Select_CString(ROOT.Char.IsFemale, 'как равная', 'как равный')]."
 gh_show_of_power_death: "Мёртвые этого дома недалеко, и их ни разу не просили встать."
 gh_show_of_power_dark: "В этом зале нет ни одной лампы, которую я не [Select_CString(ROOT.Char.IsFemale, 'могла бы', 'мог бы')] погасить, не вставая с места, ни тени, которую я не [Select_CString(ROOT.Char.IsFemale, 'могла бы', 'мог бы')] оставить стоять после."
 gh_show_of_power_dream: "Я точно знаю, что каждому из них снится, и точно, как мало усилий потребовалось бы, чтобы ждать там."
 gh_show_of_power_blood: "Каждый мужчина за этим столом — в основном вода и железо."
 gh_show_of_power_ethereal: "Стена позади них — не факт, и я никогда не [Select_CString(ROOT.Char.IsFemale, 'была', 'был')] особенно связана условностями."
 gh_show_of_power_fire: "Очаг в четырёх шагах от высокого стола, и мне не потребуется времени, чтобы сделать это расстояние неважным."
 gh_show_of_power_ice: "Вино в их чашах покроется инеем за время, необходимое чтобы закончить предложение, и их руки тоже."
 gh_show_of_power_stone: "Зал был построен людьми, которые предполагали, что камень останется там, где его положили."
 gh_show_of_power_air: "В этой комнате нет воздуха, который не движется по твоему усмотрению."
 gh_show_of_power_nature: "Балки над головой когда-то были живым деревом, а дерево помнит очень долго."
 gh_show_of_power_light: "Ты [Select_CString(ROOT.Char.IsFemale, 'могла бы', 'мог бы')] показать им, кто они на самом деле, освещённых под углом, которого никто из них не видел."
 gh_show_of_power_generic: "У тебя нет глубины для чего-то показного, но у меня достаточно, и никто из них не знает, где проходит черта."
 gh_arcana_lifestyle.0010.t: "Отмеченный колдовством"
 gh_arcana_lifestyle.0010.desc: "Моё тело вело счёт ритуалам, которые я [Select_CString(ROOT.Char.IsFemale, 'совершала', 'совершал')], и сегодня утром оно предъявило счёт.\n\nМетка появлялась годами, оттенок за оттенком, достаточно медленно, чтобы я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог')] убеждать себя, что это свет. Это не свет. Она идёт от запястья до локтя и цветом не похожа ни на что, что должно быть на человеке. [gh_witness.GetTitledFirstName] [Select_CString(gh_witness.IsFemale, 'увидела', 'увидел')] её раньше меня и [Select_CString(gh_witness.IsFemale, 'молчала', 'молчал')] всю неделю. \"Я действительно [Select_CString(gh_witness.IsFemale, 'раздумывала', 'раздумывал')], стоит ли упоминать об этом, [ROOT.Char.Custom('FormOfAddressForLiege')]. Я [Select_CString(gh_witness.IsFemale, 'решила', 'решил')], что ты [Select_CString(ROOT.Char.IsFemale, 'упомянешь первой', 'упомянешь первым')],\" — говорит [gh_witness.GetSheHe]."
 gh_arcana_lifestyle.0010.a: "Пусть смотрят."
 gh_arcana_lifestyle.0010.b: "Скрывать её. Каждое утро, если потребуется."
 gh_arcana_lifestyle.0010.c: "Выжечь её из меня."
 gh_marked_by_the_working_modifier: "Отмеченный колдовством"
 gh_marked_by_the_working_modifier_desc: "Искусство черпало из этого человека годами и наконец получило плату. В основном скрыто высокими воротниками и осторожным освещением, но двор знает, и двор говорит."
 gh_marked_worn_openly_modifier: "Метка, носимая открыто"
 gh_marked_worn_openly_modifier_desc: "Этот человек не пытается скрыть то, что сделало Искусство, что беспокоит людей значительно больше, чем сама метка. Те, кто практикует [Concept('magic','магию')|E], относятся к этому легче."
 gh_arcana_lifestyle.0013.t: "На грани"
 gh_arcana_lifestyle.0013.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'работала', 'работал')] над одним и тем же учебником весь сезон. Тем, что выдают каждому ученику и никто не читает дважды.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'читала', 'читал')] эту страницу одиннадцать раз. Но на двенадцатый, словно что-то щёлкает. На странице ничего не изменилось; изменилось что-то за ней, и это колдовство, которому меня никто не учил, собранное из кусков, которые у меня уже были и которые я никогда не [Select_CString(ROOT.Char.IsFemale, 'думала', 'думал')] складывать в таком порядке.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'показала', 'показал')] это [gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)], [Select_CString(gh_witness.IsFemale, 'которая читала', 'который читал')] больше меня.\n\n\"Этого нет в книге, [ROOT.Char.Custom('FormOfAddressForLiege')],\" — говорит [gh_witness.GetSheHe]."
 gh_arcana_lifestyle.0013.a: "Гнаться за этим. Сон — предмет переговоров."
 gh_arcana_lifestyle.0013.b: "Записать и вернуться [Select_CString(ROOT.Char.IsFemale, 'трезвой', 'трезвым')]."
 gh_arcana_lifestyle.0013.c: "Отпустить."
 gh_arcana_lifestyle.0014.t: "Оживлённый акр"
 gh_arcana_lifestyle.0014.desc: "[gh_claimant_one.Custom2('MyCharacterIntroduction', ROOT.Char)] и [gh_claimant_two.GetTitledFirstName] спорят о поле два сезона и теперь обратились ко мне, чтобы разрешить это.\n\nЭто девять акров плохой земли на границе, где [gh_disputed_county.GetName] встречается с [gh_neighbour_county.GetName]. Там растёт то, что не должно; не в сезон, не в порядке и быстрее, чем что-либо имеет право расти. Ни один из них не может сказать мне, что это за поле.\n\n\"Пограничный камень стоит там, где поставил его мой дед, [ROOT.Char.Custom('FormOfAddressForLiege')].\" — говорит [gh_claimant_one.GetSheHe].\n\n\"Камень не оспаривается. Оспаривается то, что растёт на моей стороне от него.\" — отвечает [gh_claimant_two.GetSheHe]."
 gh_arcana_lifestyle.0014.a: "[gh_claimant_one.GetTitledFirstName] [Select_CString(gh_claimant_one.IsFemale, 'права', 'прав')]."
 gh_arcana_lifestyle.0014.a.flavor: "Более старое притязание, и то, за которым стоит камень. Границы держатся, потому что правители их держат."
 gh_arcana_lifestyle.0014.b: "Нет, [gh_claimant_two.GetTitledFirstName] [Select_CString(gh_claimant_two.IsFemale, 'права', 'прав')]."
 gh_arcana_lifestyle.0014.b.flavor: "Камень говорит одно, а земля — другое. Я склоняюсь верить земле."
 gh_arcana_lifestyle.0014.c: "Ни то, ни другое. Поле моё."
 gh_arcana_lifestyle.0014.c.flavor: "Что бы ни было под этими девятью акрами, оно стоит больше, чем они оба вместе взятые, и ни один из них не имеет ни малейшего представления, что с этим делать. А я имею."
 gh_arcana_lifestyle.0014.d: "Показать им, как разделить это."
 gh_arcana_lifestyle.0014.d.flavor: "Землю не обязательно разрезать пополам, чтобы разделить. Сначала её нужно понять, а это как раз то, чего ни один из них не может сделать."
 gh_arcana_lifestyle.0014.d.settled: "Я провожу их обоих по нему и показываю, что на самом деле происходит в почве."
 gh_arcana_lifestyle.0014.d.botched: "Я объясняю это дважды, и к концу оба уверены, что я [Select_CString(ROOT.Char.IsFemale, 'приняла', 'принял')] чью-то сторону, не сказав, чью."
 gh_arcana_lifestyle.0014.e: "Уладьте это между собой."
 gh_arcana_lifestyle.0014.e.flavor: "Девять акров плохой земли не стоят утра моего времени."
 gh_arcana_lifestyle.0014.e.tt: "[gh_claimant_one.GetTitledFirstName] и [gh_claimant_two.GetTitledFirstName] становятся [Concept('rival','соперниками')|E]"
 gh_arcana_lifestyle.0016.t: "Заказ чародея"
 gh_arcana_lifestyle.0016.desc: "Моя мастерская наконец в состоянии, позволяющем создать что-то стоящее. Верстаки выровнены, линии вырезаны, и достаточно реагентов, минералов и редких трав, чтобы связывание не требовало спешки. [gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)|U] теперь просто нужно моё одобрение.\n\n\"Что бы ты ни [Select_CString(ROOT.Char.IsFemale, 'собиралась', 'собирался')] использовать, [ROOT.Char.Custom('FormOfAddressForLiege')], вложи это во что-то, что ты всё ещё будешь носить через двадцать лет. Я [Select_CString(gh_witness.IsFemale, 'видела', 'видел')], как зрелище превращалось в ничто, большее чем чаша,\" — говорит [gh_witness.GetSheHe]."
 gh_arcana_lifestyle.0016.a: "Что-то новое и моё."
 gh_arcana_lifestyle.0016.b: "Вложить это в то, что я уже ношу."
 gh_arcana_lifestyle.0016.c: "Открыть верстак для покупателей."
 gh_arcana_lifestyle.0016.d: "Не сейчас. Верстак подождёт."
 gh_enchanters_trade_modifier: "Верстак чародея"
 gh_enchanters_trade_modifier_desc: "Работу такого рода нельзя купить ни за какую цену в пределах месяца пути, и люди, которые её хотят, не из тех, кто торгуется."
 gh_arcana_lifestyle.0017.t: "Переполненное хранилище"
 gh_arcana_lifestyle.0017.desc: "[gh_witness.GetTitledFirstName] поднимает это так, как [gh_witness.GetSheHe] поднимает всё, о чём уже [Select_CString(gh_witness.IsFemale, 'приняла', 'принял')] решение: мимоходом, с примером под рукой. \"Одна из этих реликвий держит дверь открытой, [ROOT.Char.Custom('FormOfAddressForLiege')]. В западном коридоре. Она держит эту дверь уже месяц,\" — жалуется [gh_witness.GetSheHe]. Множество артефактов, которыми я владею, отнюдь не бесполезны, но в этом-то и проблема. Каждый требует немалой заботы, и их теперь так много, что забота тихо превратилась в хранение."
 gh_arcana_lifestyle.0017.a: "Найти покупателя."
 gh_arcana_lifestyle.0017.b: "Отдать одну тому, кто будет её использовать."
 gh_arcana_lifestyle.0017.c: "Разобрать одну на материалы."
 gh_arcana_lifestyle.0017.d: "Оставить их. Они никому не вредят."
 gh_arcana_lifestyle.0018.t: "Конструкция"
 gh_arcana_lifestyle.0018.desc: "Каркас стоит законченный и пустой в мастерской уже два месяца, и каждое утро я [Select_CString(ROOT.Char.IsFemale, 'находила', 'находил')] причину не заполнять его.\n\nС работой всё в порядке. Соединения верны, и каналы выдержат. Проблема в том, что связывание такого размера не проваливается тихо, а встаёт в комнате вместе со мной.\n\nКаркас не завершит себя сам, но сколько я могу закончить за один присест?"
 gh_arcana_lifestyle.0018.a: "Всё сразу. Пусть устоит или нет."
 gh_arcana_lifestyle.0018.b: "По частям. Это займёт вдвое больше."
 gh_arcana_lifestyle.0018.c: "Ещё нет."
 gh_arcana_lifestyle.0018.d: "Пусть [gh_construct_magi.GetTitledFirstName] вложит [gh_construct_magi.GetHerHis] руки в это."
 gh_arcana_lifestyle.0019.t: "Могильный урожай"
 gh_arcana_lifestyle.0019.desc: "[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)|U] упоминает это так, как люди упоминают то, о чём уже думали какое-то время. \"Есть новая могильная яма рядом с [gh_settlement.Custom('BaronyTownType')], [ROOT.Char.Custom('FormOfAddressForLiege')]. Выкопана в спешке в [ROOT.Char.Custom('GroundType')], засыпана ещё хуже. Говорят, чума или голод, я не совсем [Select_CString(gh_witness.IsFemale, 'уверена', 'уверен')]. Никто никогда не назвал никого там по имени,\" — говорит [gh_witness.GetSheHe].\n\n[gh_witness.GetName] утверждает, что там внизу есть многое, что моя [Concept('magic','магия')|E] могла бы использовать, и нет живых притязаний. Это один аргумент.\n\nДругой — что [gh_settlement.Custom('BaronyTownType')] выкопал эту яму, помнит об этом и, вероятно, предпочёл бы оставить её в покое. Кто бы ни пошёл туда сегодня ночью, его заметят. Имеет большое значение, сможет ли кто-нибудь потом связать это с моим именем."
 gh_arcana_lifestyle.0019.a: "Взять всё, что стоит взять."
 gh_arcana_lifestyle.0019.b: "Одну кость. Выбранную тщательно."
 gh_arcana_lifestyle.0019.c: "Засыпать её обратно."
 gh_arcana_lifestyle.0021.t: "Выбор сродства"
 gh_arcana_lifestyle.0021.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'ходила', 'ходил')] вокруг этого годами, не признаваясь. Из всего, чему меня учили, одна часть даётся легче остальных.\n\nЭто тихий выбор. Такой, когда однажды утром замечаешь, что [Select_CString(ROOT.Char.IsFemale, 'тянулась', 'тянулся')] к одному и тому же десятилетие и [Select_CString(ROOT.Char.IsFemale, 'называла', 'называл')] это предпочтением. Есть настоящая глубина, которую я [Select_CString(ROOT.Char.IsFemale, 'могла бы', 'мог бы')] обрести, если перестану притворяться. Есть также дверь, которая закрывается за мной."
 gh_arcana_lifestyle.0021.a: "Следовать вглубь."
 gh_arcana_lifestyle.0021.b: "Я оставлю варианты открытыми."
 gh_arcana_lifestyle.0021.c: "Я не вижу необходимости выбирать сейчас."
 gh_arcana_lifestyle.0022.t: "Трансмутация"
 gh_arcana_lifestyle.0022.desc: "Каждое поколение производит кого-то, уверенного, что решил трансмутацию, и хоронит его беднее, чем он начинал. Я [Select_CString(ROOT.Char.IsFemale, 'читала', 'читал')] их записи. Большинство были глупцами. Двое или трое — нет.\n\nЭти двое или трое — причина, по которой моя мастерская расчищена, основной металл взвешен передо мной, и по которой [gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)], [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', gh_witness)] как всегда, [Select_CString(gh_witness.IsFemale, 'нашла', 'нашёл')] причину стоять у двери.\n\n\"Я подержу всё, что тебе нужно подержать, [ROOT.Char.Custom('FormOfAddressForLiege')]. Я просто [Select_CString(gh_witness.IsFemale, 'хотела бы', 'хотел бы')] отметить, что [Select_CString(gh_witness.IsFemale, 'предлагала', 'предлагал')] подержать это из коридора,\" — говорит [gh_witness.GetSheHe]."
 gh_arcana_lifestyle.0022.a: "Попытаться как следует."
 gh_arcana_lifestyle.0022.b: "Небольшая проба. Не более."
 gh_arcana_lifestyle.0022.c: "Золото — золото, потому что его не делают."
 gh_arcana_lifestyle.0024.t: "Запретный гримуар"
 gh_arcana_lifestyle.0024.desc: "Оно прибывает без отправителя, завёрнутое дважды, внешняя обёртка выжжена в узоре, который чуть не становится словом. [gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(gh_witness.IsFemale, 'принесла', 'принёс')] его наверх и [Select_CString(gh_witness.IsFemale, 'убрала', 'убрал')] от [gh_witness.GetHerHis] особы.\n\n\"Всадник не захотел войти в ворота, [ROOT.Char.Custom('FormOfAddressForLiege')]. Он также не взял плату,\" — говорит [gh_witness.GetSheHe]. Тот, кто держал его раньше, хотел избавиться от него достаточно сильно, чтобы передать его дальше, а не сжечь."
 gh_arcana_lifestyle.0024.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] прочитать его, всё целиком."
 gh_arcana_lifestyle.0024.b: "Поставить на полку, не открывая."
 gh_arcana_lifestyle.0024.c: "Сжечь его и посыпать пепел солью."
 gh_arcana_lifestyle.0025.t: "Руны в старом камне"
 gh_arcana_lifestyle.0025.desc: "Полоса странных рун и знаков опоясывает основание внутренней стены в крепости [old_county.GetNameNoTier]. Стена старше крепости, а крепость старше [old_county.GetNameNoTier]. Никто никогда не читал этот текст, и каждому каменщику, работавшему здесь, было велено не трогать этот ряд.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'уверена', 'уверен')] только в том, что это не украшение. Тот, кто вырезал их, ожидал, что его поймут, и с тех пор прошло очень много времени."
 gh_arcana_lifestyle.0025.a: "Сидеть с ним, пока оно не поддастся."
 gh_arcana_lifestyle.0025.b: "Мои придворные маги могут с этим справиться."
 gh_arcana_lifestyle.0025.c: "Оно ждало так долго, почему бы не дольше."
 gh_arcana_lifestyle.0026.t: "Вундеркинд при дворе"
 gh_arcana_lifestyle.0026.desc: "Ребёнок не принадлежит никому конкретно. Бондаря или возчика; история меняется в зависимости от рассказчика, и ни в одном из вариантов нет дома.\n\nНе меняется лишь рассказ о том, что [gh_prodigy.GetSheHe] [Select_CString(gh_prodigy.IsFemale, 'сделала', 'сделал')] во дворе. [Select_CString(gh_prodigy.IsFemale, 'Необученная, без присмотра', 'Необученный, без присмотра')] и, по-видимому, без осознания. Я [Select_CString(ROOT.Char.IsFemale, 'видела', 'видел')] взрослых [Concept('magi','магов')|E], работающих полдесятилетия ради меньшего контроля, а [gh_prodigy.GetSheHe] ещё [Select_CString(gh_prodigy.IsFemale, 'недостаточно взрослая', 'недостаточно взрослый')], чтобы [Select_CString(gh_prodigy.IsFemale, 'ей', 'ему')] доверили нож.\n\nБез обучения это рано или поздно выйдет боком. Сейчас важно только, кто будет за это отвечать, когда это случится."
 gh_arcana_lifestyle.0026.a: "Я [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам')] буду их учить."
 gh_arcana_lifestyle.0026.b: "Отправить их туда, где им будет лучше."
 gh_arcana_lifestyle.0026.c: "Связать это, пока оно не выросло."
 gh_arcana_lifestyle.0027.t: "Украденное заклинание"
 gh_arcana_lifestyle.0027.desc: "Моя библиотека выглядит точно так, как я её [Select_CString(ROOT.Char.IsFemale, 'оставила', 'оставил')], кроме одной книги. Неуклюжий вор оставляет пробелы. Этот закрыл футляр, выровнял корешок и поставил подставку для чтения обратно к стене, но каким-то образом умудрился поставить текст вверх ногами. Иначе я бы никогда не [Select_CString(ROOT.Char.IsFemale, 'узнала', 'узнал')].\n\n[gh_poacher.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(gh_poacher.IsFemale, 'провела', 'провёл')] ритуал на прошлой неделе, о котором [gh_poacher.GetSheHe] [Select_CString(gh_poacher.IsFemale, 'не должна знать', 'не должен знать')], и внутри этих стен есть ровно одна его копия.\n\n\"Я никогда не [Select_CString(gh_poacher.IsFemale, 'была', 'был')] в твоей библиотеке, [ROOT.Char.Custom('FormOfAddressForLiege')]. Спроси любого, кто охраняет дверь,\" — говорит [gh_poacher.GetSheHe].\n\nНикто не охраняет эту дверь. Именно поэтому я и знаю."
 gh_arcana_lifestyle.0027.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] взять что-то взамен."
 gh_arcana_lifestyle.0027.b: "Защитить полки и ничего не говорить."
 gh_arcana_lifestyle.0027.c: "Я позволю им сохранить то, что они узнали."
 gh_arcana_lifestyle.0027.d: "В камеры. Пусть подумают."
 gh_arcana_lifestyle.0028.t: "Защита королевства"
 gh_arcana_lifestyle.0028.desc: "Защитные чары — не стены. Стена заявляет о себе и приглашает к осаде. Чары делают [ROOT.Char.Custom('GroundType')] под ногами неприятной, и люди, которым она неприятна, редко объясняют, почему они предпочли уйти в другое место.\n\n[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(gh_witness.IsFemale, 'сделала', 'сделал')] расчёты и [Select_CString(gh_witness.IsFemale, 'недовольна', 'недоволен')] ими. \"Это можно сделать, [ROOT.Char.Custom('FormOfAddressForLiege')]. Я [Select_CString(gh_witness.IsFemale, 'хотела бы', 'хотел бы')], чтобы ты сначала [Select_CString(ROOT.Char.IsFemale, 'поняла', 'понял')], чего это будет тебе стоить и как надолго,\" — говорит [gh_witness.GetSheHe].\n\nВремена такие, какие есть, и я [Select_CString(ROOT.Char.IsFemale, 'предпочла бы', 'предпочёл бы')], чтобы мои границы держало что-то иное, чем каменная кладка и люди, стоящие на ней."
 gh_arcana_lifestyle.0028.a: "Каждый камень должен быть покрыт."
 gh_arcana_lifestyle.0028.b: "Только моя столица, этого хватит."
 gh_arcana_lifestyle.0028.c: "Нет, стены и люди хорошо служили."
 gh_arcana_lifestyle.0029.t: "Спор магов"
 gh_arcana_lifestyle.0029.desc: "Это началось как разногласие о методе и постепенно привело к тому, что [gh_dispute_magi.GetTitledFirstName] и [gh_dispute_rival.GetTitledFirstName] отказываются находиться в одной комнате.\n\n\"Место моё. Это было решено, когда ты дал его мне,\" — говорит [gh_dispute_magi.GetSheHe]. \"Место принадлежит [gh_dispute_magi.GetHerHis]. Работа моя, и каждый в этом зале знает, что из двух на самом деле нужно королевству,\" — отвечает [gh_dispute_rival.GetSheHe].\n\n[gh_dispute_magi.Custom2('MyCharacterIntroduction', ROOT.Char)] обладает властью. [gh_dispute_rival.GetTitledFirstName] обладает лучшим аргументом. Оба ждут, что я скажу, что из этого важнее, и домочадцы уже выбрали стороны."
 gh_arcana_lifestyle.0029.a: "Место что-то значит."
 gh_arcana_lifestyle.0029.b: "Побеждает лучший аргумент."
 gh_arcana_lifestyle.0029.c: "Усадить их обоих и объяснить, как всё работает."
 gh_arcana_lifestyle.0029.d: "Никто не побеждает, вопрос закрыт!"
 gh_arcana_lifestyle.0031.t: "Эксперимент"
 gh_arcana_lifestyle.0031.desc: "Есть колдовство, которое я [Select_CString(ROOT.Char.IsFemale, 'хотела', 'хотел')] попробовать годами и не пробовала, по отличной причине: никто не записал, что оно делает.\n\nНо в этом-то и вся привлекательность.\n\nВсё, что я умею делать, когда-то было тем, что никто не записал, и кто-то стоял примерно там, где [Select_CString(ROOT.Char.IsFemale, 'стояла', 'стоял')] я, и [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил')], что незнание хуже безопасности.\n\nМастерская свободна. Никому больше не нужно быть в комнате для этого."
 gh_arcana_lifestyle.0031.a: "Мы можем совершить великие дела!"
 gh_arcana_lifestyle.0031.b: "Контролируемый опыт, не более."
 gh_arcana_lifestyle.0031.c: "Нет, это просто слишком опасно."
 gh_arcana_lifestyle.0032.t: "Великое исследование"
 gh_arcana_lifestyle.0032.desc: "[gh_research_magi.GetTitledFirstName] приходит ко мне смиренно с просьбой. Годами [gh_research_magi.GetSheHe] тайно [Select_CString(gh_research_magi.IsFemale, 'занималась', 'занимался')] тайными исследованиями и наконец [Select_CString(gh_research_magi.IsFemale, 'перестала', 'перестал')] вилять: [gh_research_magi.GetHerHis] исследование близко, и оно либо произведёт что-то, стоящее десятилетия тайных усилий, либо много шума с дырой в полу.\n\n[gh_research_magi.GetSheHe] просит финансирования, чтобы выяснить, что именно. [gh_research_magi.GetSheHe] также, на том же дыхании и не показывая виду, просит тебя принять любой ответ, который придёт."
 gh_arcana_lifestyle.0032.a: "Мы должны довести это до конца."
 gh_arcana_lifestyle.0032.b: "Что-нибудь полезное в этом десятилетии, пожалуйста."
 gh_arcana_lifestyle.0032.c: "Нет, время неподходящее."
 gh_arcana_lifestyle.0033.t: "Приезжий мудрец"
 gh_arcana_lifestyle.0033.desc: "[gh_visiting_sage.GetTitledFirstName] [Select_CString(gh_visiting_sage.IsFemale, 'приехала', 'приехал')] издалека из [gh_sage_origin.GetName] в путешествие, которое, по [gh_visiting_sage.GetHerHis] словам, заведёт [gh_visiting_sage.GetHerHim] ещё дальше. Двор был очень заинтригован [gh_visiting_sage.GetHerHis] путешествием, но когда я [Select_CString(ROOT.Char.IsFemale, 'услышала', 'услышал')] [gh_visiting_sage.GetHerHis] акцент в заклинании, которое я уже [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал')], я [Select_CString(ROOT.Char.IsFemale, 'поняла', 'понял')], что мы можем поделиться большим.\n\nТри дня затем прошли в моей библиотеке, в неизменной вежливости и тщательном выяснении того, чего я не знаю, а [gh_visiting_sage.GetSheHe] знает.\n\n\"Честный обмен. То, что я [Select_CString(gh_visiting_sage.IsFemale, 'привезла', 'привёз')] с собой, против того, что стоит на твоих полках непрочитанным. Я уезжаю через две ночи в любом случае,\" — говорит [gh_visiting_sage.GetSheHe]."
 gh_arcana_lifestyle.0033.a: "Тогда честный обмен."
 gh_arcana_lifestyle.0033.b: "Они дадут мне то, что я хочу, или иначе."
 gh_arcana_lifestyle.0033.c: "Моя библиотека — не рынок."
 gh_arcana_lifestyle.0034.t: "Тайное пробуждение"
 gh_arcana_lifestyle.0034.desc.untaught: "[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(gh_witness.IsFemale, 'была', 'был')] в комнате и с тех пор ничего не [Select_CString(gh_witness.IsFemale, 'сказала', 'сказал')]. Я много [Select_CString(ROOT.Char.IsFemale, 'читала', 'читал')] о тайных мистериях, но только сегодня мне удалось совершить ритуал самостоятельно.\n\nНикто не учил меня шагу, который я [Select_CString(ROOT.Char.IsFemale, 'сделала', 'сделал')]. Его не было в книгах, потому что это не то, что выживает в записи, это момент, когда грамматика перестаёт быть грамматикой и становится языком, на котором я думаю."
 gh_arcana_lifestyle.0034.desc.magi: "[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(gh_witness.IsFemale, 'была', 'был')] в комнате и знает достаточно, чтобы понять, что [gh_witness.GetSheHe] только что [Select_CString(gh_witness.IsFemale, 'увидела', 'увидел')]. Я [Select_CString(ROOT.Char.IsFemale, 'начала', 'начал')] верить, что знаю всё, что есть, что Искусство — это набор дверей, к которым я уже [Select_CString(ROOT.Char.IsFemale, 'нарисовала', 'нарисовал')] карту.\n\nНо сегодня утром я [Select_CString(ROOT.Char.IsFemale, 'вошла', 'вошёл')] в дверь, которой нет на карте. Не более трудное колдовство, чем обычно, но нечто, чего я никогда не [Select_CString(ROOT.Char.IsFemale, 'совершала', 'совершал')] прежде, и оно прошло так, словно я [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал')] его наизусть."
 gh_arcana_lifestyle.0034.a: "Мир узнает."
 gh_arcana_lifestyle.0034.b: "Освоить это тихо."
 gh_arcana_lifestyle.0034.c: "Я отказываюсь от призвания."
 gh_arcana_lifestyle.0034.d: "Я принимаю призвание."
 gh_arcana_lifestyle.0038.t: "Проклятый соперник"
 gh_arcana_lifestyle.0038.desc: "[gh_hex_target.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(gh_hex_target.IsFemale, 'была', 'был')] проблемой годами и [Select_CString(gh_hex_target.IsFemale, 'останется', 'останется')] ею, потому что ничто в [gh_hex_target.GetHerHis] положении не требует, чтобы [gh_hex_target.GetSheHe] [Select_CString(gh_hex_target.IsFemale, 'остановилась', 'остановился')].\n\nЕсть колдовство для таких людей. Оно не убивает: тот, кто умирает внезапно, — это вопрос, но тот, чья удача просто меняется на десятилетие, — это история о невезении."
 gh_arcana_lifestyle.0038.a: "Я наложу проклятие как следует."
 gh_arcana_lifestyle.0038.b: "Небольшое проклятие. Ничего доказуемого."
 gh_arcana_lifestyle.0038.c: "Нет, я могу подняться выше такой мелочности."
 gh_arcana_lifestyle.0039.t: "Ясновидение в камере"
 gh_arcana_lifestyle.0039.desc: "Они забрали кольца, реагенты, нож и каждый обрывок всего, что могло удерживать заряд. Они были тщательны.\n\nОни не забрали [Concept('magic','магию')|E]. Она не в кольцах. Её там никогда не было.\n\nЯ не могу много сделать отсюда. Но и не ничего."
 gh_arcana_lifestyle.0039.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] искать выход."
 gh_arcana_lifestyle.0039.c: "Я сохраню то, что у меня осталось."
 gh_arcana_lifestyle.0040.t: "Полевое вызывание"
 gh_arcana_lifestyle.0040.desc: "Линии встречаются на рассвете, и все на этой стороне поля знают это. Лошади знают.\n\n[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(gh_witness.IsFemale, 'была', 'был')] у моего локтя с тех пор, как советы разошлись, [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', gh_witness)] и ждёт, чтобы [Select_CString(gh_witness.IsFemale, 'ей', 'ему')] сказали, что это будет.\n\n\"Вперёд или над нашими головами, [ROOT.Char.Custom('FormOfAddressForLiege')]. Любое стоит иметь. Оба не стоят ничего, и люди смотрят, как ты решаешь,\" — говорит [gh_witness.GetSheHe].\n\nЯ несу достаточно для одного колдовства реального размера, и у меня не будет второго шанса выбрать."
 gh_arcana_lifestyle.0040.a: "Выпустить это в их строй."
 gh_arcana_lifestyle.0040.b: "Я защищу своих."
 gh_arcana_lifestyle.0040.c: "Нет, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] сохранить это на потом."
 gh_arcana_lifestyle.0041.t: "Лихорадочная мутация"
 gh_arcana_lifestyle.0041.desc: "Лихорадка держится четыре дня, и где-то на третью ночь стены перестали быть стенами.\n\nЭто не бред. То, что обычно удерживает Искусство на своей стороне от меня, истончилось от болезни, и сквозь это прорывается то, что не должно бы.\n\n[gh_witness.GetTitledFirstName] хочет пустить мне кровь.\n\n\"Это из-за гуморов, [ROOT.Char.Custom('FormOfAddressForLiege')]. Это всегда гуморами,\" — говорит [gh_witness.GetSheHe].\n\n[gh_witness.GetSheHe] понятия не имеет, на что [gh_witness.GetSheHe] смотрит."
 gh_arcana_lifestyle.0041.a: "Я последую за этими мутациями."
 gh_arcana_lifestyle.0041.b: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] бороться с этой лихорадкой."
 gh_arcana_lifestyle.0041.c: "Пусть пройдёт."
 gh_warded_ground_modifier: "Защищённая земля"
 gh_warded_ground_modifier_desc: "Постоянные чары, наложенные на всё графство. Враждебное колдовство находит землю тяжёлой, а люди, живущие на ней, спят несколько лучше, зная, что они там."
 gh_hexed_modifier: "Проклятый"
 gh_hexed_modifier_desc: "Кто-то компетентный наложил колдовство на этого человека. Оно не заявляет о себе, оно просто приходит как десятилетие, в котором ничего толком не ладится."
 gh_battle_evocation_modifier: "Вызывание выпущено"
 gh_battle_evocation_modifier_desc: "Что-то было выпущено в поле до того, как линии встретились."
 gh_battle_warding_modifier: "Защищённые ряды"
 gh_battle_warding_modifier_desc: "Колдовство, наложенное на солдат. Меньше из них будет не хватать в конце."

 gh_arcana_lifestyle.0001.a.flavor: "Реагенты лгут о своём сорте, а книги лгут о своём происхождении. Только одно из двух можно проверить через стол."
 gh_arcana_lifestyle.0001.b.flavor: "Кем бы ещё ни [Select_CString(gh_peddler.IsFemale, 'была', 'был')] [gh_peddler.GetSheHe], [gh_peddler.GetSheHe] — [Select_CString(gh_peddler.IsFemale, 'торговка', 'торговец')]."
 gh_arcana_lifestyle.0001.c.flavor: "В этом тексте есть что-то, что нельзя оценить."
 gh_arcana_lifestyle.0001.d.flavor: "Ничто на этой ткани не стоит того, чего стоит послеобеденное время твоего внимания."
 gh_arcana_lifestyle.0002.a.flavor: "Что-то забрело с линии и осталось. Дай ему форму, имя и владельца, и оно станет вещью, которой ты обладаешь."
 gh_arcana_lifestyle.0002.b.flavor: "Не обязательно владеть вещью, чтобы учиться у неё."
 gh_arcana_lifestyle.0002.c.flavor: "Оно пришло ради путевой линии, а не ради тебя. Оно найдёт другую."
 gh_arcana_lifestyle.0003.a.flavor: "Ничто, что предлагает, не только предлагает."
 gh_arcana_lifestyle.0003.b.flavor: "Выпусти всплеск в камень и позволь стране ниже по течению сохранить урожай."
 gh_arcana_lifestyle.0003.c.flavor: "Лучше их руки, чем твои."
 gh_arcana_lifestyle.0004.a.flavor: "Нанесённый на карту всплеск — это всплеск, который можно потратить. Второго смысла нет."
 gh_arcana_lifestyle.0004.b.flavor: "Они вошли по твоему слову и вернулись изменёнными."
 gh_arcana_lifestyle.0005.a.flavor: "Они не выучат колдовство из нотации. Они выучат его из часа тренировки после."
 gh_arcana_lifestyle.0005.b.flavor: "Зал, который смотрит, как горит один ученик, — это зал, который перестаёт искать оправдания для остальных."
 gh_arcana_lifestyle.0005.c.flavor: "Монета, молчание и выжженная комната, в которую никто не входит. Сам факт никуда не исчезает."
 gh_arcana_lifestyle.0006.a.flavor: "У некоторых магий есть грамматика для того, что говорит камень, когда он что-то говорит. Без неё это лишь погода в стене."
 gh_arcana_lifestyle.0006.b.flavor: "Что бы ни говорило, оно может говорить само с собой."
 gh_arcana_lifestyle.0006.c.flavor: "Старые дома оседают. Старые дома всегда оседали."
 gh_arcana_lifestyle.0006.d: "Прочитать реликвию вместо того, чтобы слушать её."
 gh_arcana_lifestyle.0006.d.flavor: "Шёпот — это симптом. Достаточно глубокий заклинатель может пойти и прочитать причину."
 gh_arcana_lifestyle.0007.a.flavor: "Их условия, их зал, их выбор часа. И всё же только два заклинателя."
 gh_arcana_lifestyle.0007.b.flavor: "Всегда есть что-то сильнее того, чему тебя учили."
 gh_arcana_lifestyle.0007.c.flavor: "Отказ стоит тебе ровно столько, сколько, по мнению всех в зале, он тебе стоит."
 gh_arcana_lifestyle.0007.d: "Закончить это одним жестом."
 gh_arcana_lifestyle.0007.d.flavor: "Ты не собираешься выяснять, кто лучше; ты собираешься показать им."
 gh_arcana_lifestyle.0008.a.flavor: "Погоде такого масштаба всё равно, готов ли ты. Ей важно только, прав ли ты."
 gh_arcana_lifestyle.0008.b.flavor: "Неделя дождя. Достаточно малая, чтобы удержать, достаточно малая, чтобы почти ни для кого не иметь значения."
 gh_arcana_lifestyle.0008.c.flavor: "Небо делало это ещё до того, как появились путевые линии, чтобы с ним спорить."
 gh_arcana_lifestyle.0008.d.drought: "Вызвать это из глубокой воды, как следует."
 gh_arcana_lifestyle.0008.d.flood: "Разобрать бурю на ветру."
 gh_arcana_lifestyle.0008.d.flavor: "Ты не борешься с небом. Ты говоришь с ним, и оно ответит."
 gh_arcana_lifestyle.0009.a.flavor: "Страх быстр, тотален и запоминается всеми, включая тех, в кого ты не целился."
 gh_arcana_lifestyle.0009.b.flavor: "Ничего пугающего. Только напоминание, доставленное туда, где хорошая акустика."
 gh_arcana_lifestyle.0009.c.flavor: "Их обида реальна. Ответить на неё как на таковую стоит меньше, чем ответить на неё как на оскорбление."
 gh_arcana_lifestyle.0009.d: "И кто [gh_restless_vassal.GetSheHe] [Select_CString(gh_restless_vassal.IsFemale, 'такая', 'такой')], чтобы так говорить!?"
 gh_arcana_lifestyle.0009.d.flavor: "Они умеют колдовать. Это делает это состязанием, а не угрозой, а состязания можно проиграть."
 gh_arcana_lifestyle.0010.a.flavor: "Метка — это доказательство. Пусть она сделает работу, которую иначе пришлось бы делать спорам."
 gh_arcana_lifestyle.0010.b.flavor: "Краска, пудра, высокий воротник и час каждое утро до конца твоей жизни."
 gh_arcana_lifestyle.0010.c.flavor: "Её можно снять, но не чисто."
 gh_arcana_lifestyle.0013.a.flavor: "Оно прямо здесь. Ещё две ночи, может, три, и оно всё ещё будет здесь, пока тебя не будет."
 gh_arcana_lifestyle.0013.b.flavor: "Запиши это на бумагу, пока оно ещё имеет свою форму, и возвращайся, когда тебе можно будет доверить это."
 gh_arcana_lifestyle.0013.c.flavor: "Некоторые двери открываются в никуда, и единственная цена выяснения — всё, что ты потратишь по пути."
 gh_arcana_lifestyle.0016.a.flavor: "Новая работа, твой верстак, твоё имя внутри неё."
 gh_arcana_lifestyle.0016.b.flavor: "Клинок, который ты уже знаешь, превращённый в то, чему можно доверять дальше."
 gh_arcana_lifestyle.0016.c.flavor: "Чародеи, которые продают, становятся чародеями, к которым едут люди. Заказы следуют за мастерской."
 gh_arcana_lifestyle.0016.d.flavor: "Заказ никуда не денется, как и мастерская."
 gh_arcana_lifestyle.0017.a.flavor: "Кто-то там хочет это достаточно сильно, чтобы переплатить, а у тебя их несколько."
 gh_arcana_lifestyle.0017.b.flavor: "Артефакт в хранилище — это мебель. В нужных руках это аргумент в пользу твоего правления."
 gh_arcana_lifestyle.0017.c.flavor: "Разбери его на то, из чего он сделан. Им всё равно только любовались бы."
 gh_arcana_lifestyle.0017.d.flavor: "Их ничего не стоит хранить, и они великолепны."
 gh_arcana_lifestyle.0018.a.flavor: "Одно колдовство, одна форма, один ответ. Оно устоит или нет."
 gh_arcana_lifestyle.0018.b.flavor: "Медленнее, безопаснее и вдвое дороже во всём, кроме риска."
 gh_arcana_lifestyle.0018.c.flavor: "Части хранятся. Проблема в том, что и амбиции тоже."
 gh_arcana_lifestyle.0018.d.flavor: "У [gh_construct_magi.GetTitledFirstName] есть руки для этого. [gh_construct_magi.GetHerHis] мнение о тебе сделает куда больше работы, чем любой из вас признал бы."
 gh_arcana_lifestyle.0019.a.flavor: "Земля мягкая, ночь длинная, и никто не считает то, что уже похоронено."
 gh_arcana_lifestyle.0019.b.flavor: "Один набор, выбранный за то, чем он был при жизни. Меньше объяснять."
 gh_arcana_lifestyle.0019.c.flavor: "Верни землю в то состояние, в котором [Select_CString(ROOT.Char.IsFemale, 'нашла', 'нашёл')], и не возьми ничего, кроме прогулки домой."
 gh_arcana_lifestyle.0021.a.flavor: "Глубина стоит ширины. Это не предупреждение, это просто факт."
 gh_arcana_lifestyle.0021.b.flavor: "Универсал никогда не лучший заклинатель в комнате, но и никогда не бесполезен."
 gh_arcana_lifestyle.0021.c.flavor: "Притяжение реально. Как и возражение против того, чтобы быть притянутым."
 gh_arcana_lifestyle.0022.a.flavor: "Каждый трансмутатор, который когда-либо разрушил себя, начинал с серьёзных усилий."
 gh_arcana_lifestyle.0022.b.flavor: "Щепотка основного металла, контролируемая мастерская и ответ, ошибку в котором можно пережить."
 gh_arcana_lifestyle.0022.c.flavor: "Ценность металла не в том, что его создали в обход."
 gh_arcana_lifestyle.0024.a.flavor: "Что бы в нём ни было, оно там, прочтёшь ты его или нет. Чтение лишь перемещает проблему в тебя."
 gh_arcana_lifestyle.0024.b.flavor: "Высокая полка, запертая комната и знание, что оно всё ещё в доме."
 gh_arcana_lifestyle.0024.c.flavor: "Книги горят. Книга ли это — открытый вопрос."
 gh_arcana_lifestyle.0025.a.flavor: "Камень хранил своё значение очень долго. Его можно пережить."
 gh_arcana_lifestyle.0025.b.flavor: "Их руки и их заслуга, если оно поддастся."
 gh_arcana_lifestyle.0025.c.flavor: "Оно ждало многие династии. Подождёт и мою."
 gh_arcana_lifestyle.0026.a.flavor: "Никто ничему не учит вундеркинда. Ты показываешь им, где края, и надеешься, что они поверят тебе."
 gh_arcana_lifestyle.0026.b.flavor: "Куда-нибудь с настоящей школой, настоящими защитами и кем-то лучше тебя, кого можно бояться."
 gh_arcana_lifestyle.0026.c.flavor: "Отсечь это сейчас, пока отсечение — ещё то, что может сделать один человек."
 gh_arcana_lifestyle.0027.a.flavor: "Они взяли колдовство с твоих полок. Это должно работать в обе стороны."
 gh_arcana_lifestyle.0027.b.flavor: "Закрой брешь, ничего не говори и позволь им гадать, почему следующая попытка провалилась."
 gh_arcana_lifestyle.0027.c.flavor: "Заклинание не перестаёт быть твоим от того, что его скопировали, а обвинение может стоить дороже."
 gh_arcana_lifestyle.0027.d.flavor: "Кража есть кража, и зал, который смотрит, как вор уходит безнаказанным, решит, что твои секреты открыты."
 gh_arcana_lifestyle.0028.a.flavor: "Каждый пограничный камень, каждый брод, каждые ворота. Это можно сделать."
 gh_arcana_lifestyle.0028.b.flavor: "Одно графство, защищённое как следует, стоит королевства, защищённого плохо."
 gh_arcana_lifestyle.0028.c.flavor: "Камень и люди держали эту землю веками без чар на пути."
 gh_arcana_lifestyle.0029.a.flavor: "Подорви место однажды, и оно больше не место."
 gh_arcana_lifestyle.0029.b.flavor: "Претендент прав. Это неудобно, но это всё ещё так."
 gh_arcana_lifestyle.0029.c.flavor: "Ни один из них не уйдёт удовлетворённым, в этом и есть посредничество."
 gh_arcana_lifestyle.0029.d.flavor: "Спор ниже должности. Скажи это и позволь обоим нести это."
 gh_arcana_lifestyle.0029.e: "Судить само колдовство."
 gh_arcana_lifestyle.0029.e.flavor: "Ты [Select_CString(ROOT.Char.IsFemale, 'достаточно глубока', 'достаточно глубок')], чтобы прочитать оба аргумента по существу и показать каждому, где именно он ошибся."
 gh_arcana_lifestyle.0031.a.flavor: "Безопасность меняет результаты. В этом суть и твоё возражение."
 gh_arcana_lifestyle.0031.b.flavor: "Ограниченный, защищённый, наблюдаемый и стоящий несколько меньше неконтролируемой версии."
 gh_arcana_lifestyle.0031.c.flavor: "Обратно на полку к остальным, где оно было в полной безопасности годами."
 gh_arcana_lifestyle.0032.a.flavor: "Исследование может занять десятилетия, а монеты никогда не возвращаются."
 gh_arcana_lifestyle.0032.b.flavor: "Сузь масштаб до того, что даст результат в пределах человеческой жизни."
 gh_arcana_lifestyle.0032.c.flavor: "Приостановленная работа не гниёт. Учёные, к сожалению, да."
 gh_arcana_lifestyle.0033.a.flavor: "Ты показываешь им своё, они показывают тебе своё, и оба ума к концу недели становятся светлее."
 gh_arcana_lifestyle.0033.b.flavor: "Они уедут через две недели, а копирование уже сделано."
 gh_arcana_lifestyle.0033.c.flavor: "Гостеприимство — это одно. Секреты — другое."
 gh_arcana_lifestyle.0034.a.flavor: "Объяви это, и оно станет фактом о тебе, вокруг которого всем остальным придётся устраиваться."
 gh_arcana_lifestyle.0034.b.flavor: "Держи это в тайне, где это может оказаться выгодным раскрыть позже."
 gh_arcana_lifestyle.0034.c.flavor: "От этого можно отказаться. Но это нельзя отменить."
 gh_arcana_lifestyle.0034.d.flavor: "Ты [Select_CString(ROOT.Char.IsFemale, 'прочитала', 'прочитал')] каждое слово, когда-либо написанное об Искусстве, и не [Select_CString(ROOT.Char.IsFemale, 'произнесла', 'произнёс')] ни одного заклинания. В твоей культуре есть традиция с дверью, в которую ты не [Select_CString(ROOT.Char.IsFemale, 'стучала', 'стучал')]."
 gh_arcana_lifestyle.0002.d.flavor: "Ты [Select_CString(ROOT.Char.IsFemale, 'убивала', 'убивал')] вещи и пострашнее."
 gh_arcana_lifestyle.0005.d.flavor: "Выжженный зал — это не плохо усвоенный урок, это опасность, разгуливающая в твоей ливрее."
 gh_arcana_lifestyle.0006.e.flavor: "Каждый резонанс — это нота, которую держит кто-то другой. Держи лучшую."
 gh_arcana_lifestyle.0038.a.flavor: "Проклятие, наложенное как следует, держится годами и читается любым, кто знает, как смотреть."
 gh_arcana_lifestyle.0038.b.flavor: "Достаточно малое, чтобы считаться невезением и не думать о нём вовсе."
 gh_arcana_lifestyle.0038.c.flavor: "Ничегонеделание — не то же самое, что прощение, и стоит значительно меньше."
 gh_arcana_lifestyle.0039.a.flavor: "Камень, стража, расстояние и расписание. Прочитай их все, и что-то в узоре окажется слабым."
 gh_arcana_lifestyle.0039.c.flavor: "То, что у тебя осталось, — это то, что у тебя будет, когда это будет важно."
 gh_arcana_lifestyle.0040.a.flavor: "Оно приземлится в их строю и не спросит, кто это заслужил."
 gh_arcana_lifestyle.0040.b.flavor: "Ничего эффектного. Только твои собственные солдаты, стоящие там, где они пали бы."
 gh_arcana_lifestyle.0040.c.flavor: "Заклинатель, который ничего не потратил, — это заклинатель, вокруг которого врагу всё ещё нужно планировать."
 gh_arcana_lifestyle.0041.a.flavor: "Лихорадка меняет тебя. Следовать за ней — значит выбирать изменения намеренно."
 gh_arcana_lifestyle.0041.b.flavor: "Выжечь это, пока оно не обрело форму."
 gh_arcana_lifestyle.0041.c.flavor: "Лихорадки проходят. Большинство проходит так, как и должно было."

