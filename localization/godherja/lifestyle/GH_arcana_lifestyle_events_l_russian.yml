#  Duel aftermath letters
 gh_arcana_lifestyle.0042.opening: "К [ROOT.Char.GetTitledFirstName],"
 gh_arcana_lifestyle.0042.desc.win: "У меня была неделя, чтобы найти способ написать это, не признавая поражения, и такого способа нет.\n\nТы [Select_CString(ROOT.Char.IsFemale, 'была', 'был')] лучше. Не удачливее, лучше, и на глазах у людей, которые будут повторять это годами. Я [Select_CString(gh_duel_rival.IsFemale, 'пересматривала', 'пересматривал')] то, что ты [Select_CString(ROOT.Char.IsFemale, 'сделала', 'сделал')], пожалуй, раз сорок, и раздражает то, что я могу проследить всё это и всё равно не [Select_CString(gh_duel_rival.IsFemale, 'сделала бы', 'сделал бы')] так.\n\nСчитай вопрос решённым. Я больше не подниму его."
 gh_arcana_lifestyle.0042.desc.loss: "Надеюсь, это застанет тебя [Select_CString(ROOT.Char.IsFemale, 'выздоравливающей', 'выздоравливающим')].\n\nХочу ясно сказать, что не испытываю особого удовольствия от этого. Ты [Select_CString(ROOT.Char.IsFemale, 'потянулась', 'потянулся')] за тем, с чем не [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог')] справиться.\n\nПредложение уладить это как следует остаётся в силе, когда бы ты ни [Select_CString(ROOT.Char.IsFemale, 'была готова', 'был готов')] его принять."
 gh_arcana_lifestyle.0042.a: "Пусть пишут, что хотят."
 gh_arcana_lifestyle.0042.a.flavor: "В письме нет ничего, чего бы ты уже не [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал')]."
 gh_arcana_lifestyle.0043.opening: "Моему сюзерену,"
 gh_arcana_lifestyle.0043.desc.win: "Я [Select_CString(gh_restless_vassal.IsFemale, 'просила', 'просил')], чтобы мне ответили как равному, и ты [Select_CString(ROOT.Char.IsFemale, 'оказала', 'оказал')] мне эту любезность, чего я [Select_CString(gh_restless_vassal.IsFemale, 'не ожидала', 'не ожидал')], а затем ты [Select_CString(ROOT.Char.IsFemale, 'оказалась', 'оказался')] лучше меня, чего я [Select_CString(gh_restless_vassal.IsFemale, 'ожидала', 'ожидал')] ещё меньше.\n\nУ меня нет жалоб. Обида, на которую ответили честно, — это ответ, каков бы ни был результат. Мои люди видели, что это улажено так же, как и я, и с этого момента из моего зала будет меньше шума.\n\nЯ остаюсь, и более искренне, твоим вассалом."
 gh_arcana_lifestyle.0043.desc.loss: "Хочу, чтобы было записано, что я [Select_CString(gh_restless_vassal.IsFemale, 'не просила', 'не просил')] никакого преимущества и [Select_CString(gh_restless_vassal.IsFemale, 'не получила', 'не получил')] его, и что результат был таким, каким был, на глазах у свидетелей.\n\nПолагаю, теперь мы понимаем друг друга лучше."
 gh_arcana_lifestyle.0043.a: "Понятно."
 gh_arcana_lifestyle.0043.a.flavor: "Вассал, который ожидает, что его будут держать за написанное."
 gh_arcana_lifestyle.0018.d.stood: "У [gh_construct_magi.GetTitledFirstName] руки твёрже, чем были бы у тебя."
 gh_arcana_lifestyle.0018.d.broke: "Оно разваливается на верстаке [gh_construct_magi.GetTitledFirstNamePossessive]."
 gh_arcana_lifestyle.0025.b.success: "Они сидят с ним сезон и возвращаются с прочтением."
 gh_arcana_lifestyle.0025.b.failure: "Проходит сезон, и камень хранит своё значение."
 gh_arcana_lifestyle.0032.a.yielded: "Десятилетие этого, и гримуар закрывается на чём-то стоящем."
 gh_arcana_lifestyle.0032.a.chaotic: "Десятилетие этого, и то, что выходит, не то, что было заказано."

 gh_arcana_lifestyle.0003.d: "Вложить это в работу вместо этого."
 gh_arcana_lifestyle.0003.d.flavor: "Силу лучше всего тратить на то, что ты уже знаешь."
 gh_arcana_lifestyle.0003.d.caught: "Ты ловишь это внутри себя."
 gh_arcana_lifestyle.0003.d.spilled: "Оно проходит сквозь тебя."
 gh_arcana_lifestyle.0038.a.deniable.tt: "Ничто в колдовстве не может быть прочитано обратно к тебе"

# --- 0040 duel outcomes ---
 gh_arcana_lifestyle.0040.a.landed: "Оно приземляется туда, куда ты [Select_CString(ROOT.Char.IsFemale, 'хотела', 'хотел')], и строй больше не смыкается."
 gh_arcana_lifestyle.0040.a.scattered: "Оно уходит в сторону и рассеивается по земле, где никто не стоял."
 gh_arcana_lifestyle.0040.b.held: "Защита держится, и твои люди выходят из земли, из которой не должны были."
 gh_arcana_lifestyle.0040.b.thin: "Она держится тонко и на несколько меньшей земле, чем ты [Select_CString(ROOT.Char.IsFemale, 'намеревалась', 'намеревался')]."

# --- 0005: what the working actually did, by the apprentice's deepest aspect ---
 gh_mishap_fire: "выжжен до балок"
