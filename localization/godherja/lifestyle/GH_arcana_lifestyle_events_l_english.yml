 gain_a_construct_tooltip: "You will gain a Construct [artifact|E]"
 gh_arcana_lifestyle.0002.a.slipped.wound_tt: "You may gain the [GetTrait('wounded_1').GetName( GetNullCharacter )] [trait|E]"
 gain_staff_artifact_tooltip: "You will gain a Staff [artifact|E]"
 gain_bones_artifact_tooltip: "You will gain 2 to 3 Bone [artifacts|E]"
 gain_bone_artifact_tooltip: "You will gain a Bone [artifact|E]"
 gh_arcana_lifestyle.0006.a.followed: "You follow it, and it goes somewhere"
 gh_arcana_lifestyle.0006.a.fragments: "You catch enough of it to know it was worth catching"
 gh_arcana_lifestyle.0006.a.noticed: "It notices you noticing"

#  Duel outcome toasts 
 gh_arcana_lifestyle.0002.a.bound: "It has a shape and an owner"
 gh_arcana_lifestyle.0002.a.slipped: "The binding does not take"
 gh_arcana_lifestyle.0002.d.success: "The beast is dead"
 gh_arcana_lifestyle.0002.d.failure: "Hunting boars would be less dangerous"
 gh_arcana_lifestyle.0008.a.success: "The sky answers"
 gh_arcana_lifestyle.0008.a.failure: "The weather ignores you"
 gh_arcana_lifestyle.0009.c.success: "They left with a settlement"
 gh_arcana_lifestyle.0009.c.failure: "Answering as an equal is read as having no better answer"
 gh_arcana_lifestyle.0013.a.learn_tt: "Catch it and you will learn #underline [gh_verge_spell.Custom('SpellName')]#! [gh_ritual|E]"
 gh_arcana_lifestyle.0013.a.found: "You catch it before it goes"
 gh_arcana_lifestyle.0013.a.lost: "Three nights of chasing wasted"
 gh_arcana_lifestyle.0018.a.stood: "It stands up, and stays standing"
 gh_arcana_lifestyle.0018.a.broke: "It comes apart on the bench"
 gh_arcana_lifestyle.0019.a.success: "The ground goes back the way you found it"
 gh_arcana_lifestyle.0019.a.failure: "Somebody counts what is buried after all"
 gh_arcana_lifestyle.0019.b.success: "One set, carried out clean"
 gh_arcana_lifestyle.0019.b.failure: "One set, and a witness"
 gh_arcana_lifestyle.0022.a.success: "The lead turns to gold"
 gh_arcana_lifestyle.0022.a.failure: "The assay fails, loudly"
 gh_arcana_lifestyle.0025.a.success: "The stone gives freely"
 gh_arcana_lifestyle.0025.a.failure: "The stone keeps its meaning, and you a headache"
 gh_arcana_lifestyle.0029.c.settled: "Neither leaves satisfied"
 gh_arcana_lifestyle.0029.c.festered: "The matter is closed, for now"
 gh_arcana_lifestyle.0031.a.breakthrough: "It discovers something new"
 gh_arcana_lifestyle.0031.a.backfire: "It fails spectacularly"
 gh_arcana_lifestyle.0033.b.unnoticed: "The copying is done and they leave none the wiser"
 gh_arcana_lifestyle.0033.b.noticed: "They noticed"
 gh_arcana_lifestyle.0038.a.deniable: "It holds, and no one is the wiser"
 gh_arcana_lifestyle.0038.a.traced: "The hex holds a trail leading back to you"
 gh_arcana_lifestyle.0039.a.found: "Something in the pattern is exploitable"
 gh_arcana_lifestyle.0039.a.nothing: "Stone, guards, distance, rota. All of it exactly as it should be"
 gh_arcana_lifestyle.0041.a.insight: "The fever leaves something behind"
 gh_arcana_lifestyle.0041.a.took: "The fever breaks the way fevers do, and takes its price"

#  Duel aftermath letters 
 gh_arcana_lifestyle.0042.opening: "To [ROOT.Char.GetTitledFirstName],"
 gh_arcana_lifestyle.0042.desc.win: "I have had a week to find a way of writing this that does not concede the point, and there is not one.\n\nYou were better. Not luckier, better, and in front of people who will be repeating it for years. I have gone back over what you did perhaps forty times now, and the irritating part is that I can follow all of it and still not have done it.\n\nConsider the matter settled. I will not raise it again."
 gh_arcana_lifestyle.0042.desc.loss: "I hope this finds you recovering.\n\nI want to be clear that I take no particular pleasure in it. You reached for something you could not handle.\n\nThe offer to settle this properly stands, whenever you are ready to make it."
 gh_arcana_lifestyle.0042.a: "Let them write what they like."
 gh_arcana_lifestyle.0042.a.flavor: "There is nothing in the letter you did not already know."
 gh_arcana_lifestyle.0043.opening: "To my liege,"
 gh_arcana_lifestyle.0043.desc.win: "I asked to be answered as an equal and you obliged me, which I did not expect, and then you were better than me, which I expected still less.\n\nI have no complaint. A grievance answered honestly is answered, whatever the result. My people saw it settled the same way I did, and there will be less noise out of my hall from now on.\n\nI remain, rather more sincerely, your vassal."
 gh_arcana_lifestyle.0043.desc.loss: "I want it on record that I asked for no advantage and was given none, and that the result was what it was in front of witnesses.\n\nI trust we understand each other better now."
 gh_arcana_lifestyle.0043.a: "Understood."
 gh_arcana_lifestyle.0043.a.flavor: "A vassal who expects to be held by what is written."
 gh_arcana_lifestyle.0018.d.stood: "[gh_construct_magi.GetTitledFirstName] has steadier hands than yours would have been."
 gh_arcana_lifestyle.0018.d.broke: "It comes apart on [gh_construct_magi.GetTitledFirstNamePossessive] bench."
 gh_arcana_lifestyle.0025.b.success: "They sit with it for a season and come back with a reading."
 gh_arcana_lifestyle.0025.b.failure: "A season passes, and the stone keeps its meaning."
 gh_arcana_lifestyle.0032.a.yielded: "A decade of it, and the grimoire closes on something worth having."
 gh_arcana_lifestyle.0032.a.chaotic: "A decade of it, and what comes out is not what was commissioned."

 gh_arcana_lifestyle.0003.d: "Take it into the work instead."
 gh_arcana_lifestyle.0003.d.flavor: "Power is best spent on what you already know."
 gh_arcana_lifestyle.0003.d.caught: "You catch it within you."
 gh_arcana_lifestyle.0003.d.spilled: "It goes through you."
 gh_arcana_lifestyle.0038.a.deniable.tt: "Nothing in the working can be read back to you"

# --- 0040 duel outcomes ---
 gh_arcana_lifestyle.0040.a.landed: "It lands where you meant it to, and the line does not close again."
 gh_arcana_lifestyle.0040.a.scattered: "It goes wide, and scatters into ground nobody was standing on."
 gh_arcana_lifestyle.0040.b.held: "The ward holds, and your men walk out of soil they should not have."
 gh_arcana_lifestyle.0040.b.thin: "It holds thinly, and over rather less soil than you meant."

# --- 0005: what the working actually did, by the apprentice's deepest aspect ---
 gh_mishap_fire: "scorched to the joists"
 gh_mishap_ice: "furred white with ice that is not melting"
 gh_mishap_water: "ankle-deep in water and still filling"
 gh_mishap_air: "stripped of everything that was not nailed down"
 gh_mishap_stone: "buckled where the floor tried to become a wall"
 gh_mishap_dark: "unlit in a way that has nothing to do with the hour"
 gh_mishap_light: "burned pale, the shadows fixed where they fell"
 gh_mishap_death: "gone cold and quiet, and the mice in the walls with it"
 gh_mishap_nature: "green to the ceiling and still putting out shoots"
 gh_mishap_blood: "marked in a way the servants are refusing to scrub"
 gh_mishap_metal: "hung with iron that has run like candle wax"
 gh_mishap_dream: "wrong in a way nobody who walks through it can describe afterwards"
 gh_mishap_ethereal: "thin, as though the room has been worn through in places"
 gh_mishap_celestial: "lit from somewhere considerably further off than the windows"
 gh_mishap_hymns: "ringing, faintly, and it has not stopped since"
 gh_mishap_sand: "half-buried in grit that came from nowhere"
 gh_mishap_time: "an hour behind the rest of the house"
 gh_mishap_dawn: "washed grey, as though a morning happened in it without anyone present"
 gh_mishap_generic: "in a state the steward is refusing to put a number on"

# --- 0005: what the apprentice says when you walk in ---
 gh_excuse_arrogant: "It would have held. The proportions were right. Something in the room was wrong."
 gh_excuse_shy: "I did check it. I checked it twice. I am sorry, I did check it."
 gh_excuse_honest: "I went past what I have been taught. I knew I was doing it while I did it and I apologize."
 gh_excuse_deceitful: "It was already unstable when I came in. I was trying to make it safe."
 gh_excuse_craven: "Please. It was not meant to be anything. It was not meant to be anything at all."
 gh_excuse_brave: "It was mine. I did it, nobody helped me, and I will put it right."
 gh_excuse_diligent: "I have the notes. Every step is written down. You can see exactly where it turned."
 gh_excuse_ambitious: "It was going to work. Another hour and it would have been worth all of this."
 gh_excuse_generic_1: "I do not know what happened. It was holding and then it was not."
 gh_excuse_generic_2: "I can fix it. Give me until morning and I can fix it."

# --- 0007: what I make of settling a grievance this way ---
 gh_duel_stakes_tradition: "This is how my people have always settled it."
 gh_duel_stakes_arrogant: "It is a crude way to settle anything. It is also going to be very short."
 gh_duel_stakes_brave: "There are worse ways to answe in front of witnesses."
 gh_duel_stakes_zealous: "Let it be decided by what we were each given, and let that be the answer."
 gh_duel_stakes_craven: "It is a stupid way to die, yet I have watched more clever people take it."
 gh_duel_stakes_cynical: "This settles nothing except who was better at it."
 gh_duel_stakes_temperate: "This is a great deal of noise for a disagreement that had other doors out of it."
 gh_duel_stakes_generic: "It is a stupid way to settle anything."

# --- 0019.e: let the executioner do the digging ---
 gh_arcana_lifestyle.0019.e: "Have [gh_gravedigger.GetTitledFirstName] do it."
 gh_arcana_lifestyle.0019.e.flavor: "The work is beneath me and squarely within [gh_gravedigger.GetHerHis] usual duties. [gh_gravedigger.GetSheHe] will not ask what the bones are for, which is most of what I pay [gh_gravedigger.GetHerHim] for."
 gh_arcana_lifestyle.0019.e.clean: "[gh_gravedigger.GetSheHe] goes out at dusk and is back before the watch changes, carrying a sack and no explanation."
 gh_arcana_lifestyle.0019.e.seen: "[gh_gravedigger.GetSheHe] brings the sack back. [gh_gravedigger.GetSheHe] also brings back the fact that two men from the [gh_settlement.Custom('BaronyTownType')] watched [gh_gravedigger.GetHerHim] do it, and know exactly whose livery [gh_gravedigger.GetSheHe] wears."

 gh_arcana_lifestyle.0045.t: "The Fallen Shard"
 gh_arcana_lifestyle.0045.desc: "A shard of [aervalr|E] fell on [gh_shard_county.GetName] some time ago, and ever since has sat half-buried and perfectly quiet. Yet the peasants fear it kills people slowly, while Magi theorize it is worth more than the county around it. Both could be false, yet as time has gone by, more and more of the peasantry has come to believe it is nothing but trouble.\n\n[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)] has brought me the tally again, and it has not improved.\"Four this season, [ROOT.Char.Custom('FormOfAddressForLiege')]. Two are said to have gone blind, one has not woken up, and the fourth walked into the woods and never came back.\" [gh_witness.GetSheHe] says. If something is not done, the hysteria may grow out of control."
 gh_arcana_lifestyle.0045.a: "Rope it off and place guards. Nobody goes near it."
 gh_arcana_lifestyle.0045.a.flavor: "It can sit there a while longer without my people climbing on it."
 gh_arcana_lifestyle.0045.b: "Cut a quarry into it."
 gh_arcana_lifestyle.0045.b.flavor: "Every piece that comes out of that rock is worth something immense to Magi everywhere."
 gh_arcana_lifestyle.0045.b.tt: "The quarry will yield again in time"
 gh_arcana_lifestyle.0045.c: "I wish to better understand it."
 gh_arcana_lifestyle.0045.c.flavor: "Aervalr is like to hold many secrets older than life."
 gh_arcana_lifestyle.0045.c.read: "It is not a stone with something in it. It is a single working, still running, that has been failing for a very long time. I follow the shape of it as far as I can stand to."
 gh_arcana_lifestyle.0045.c.repelled: "I look perhaps a third of the way into the structure of it before snapping back to reality with a third of the day gone."
 gh_arcana_lifestyle.0045.quarry_yield: "The Quarry Yields"
 gh_arcana_lifestyle.0045.quarry_yield.tt: "The shard quarry has produced another fragment"
 gh_quickened_ground_modifier: "Quickened Ground"
 gh_quickened_ground_modifier_desc: "Nine acres of soil grows what it is told to grow."
 gh_shard_quarry_modifier: "Shard Quarry"
 gh_shard_quarry_modifier_desc: "A working quarry cut into a fallen shard. The stone that comes out of it is worth a great deal."
 gh_shard_interdict_modifier: "Shard Interdict"
 gh_shard_interdict_modifier_desc: "Nobody sets foot on the ground around the shard, by order and armed watch."

 gh_sealed_shelves_modifier: "Sealed Shelves"
 gh_sealed_shelves_modifier_desc: "The library is warded. Nothing walks out of it without permission, and anyone who tries finds the shelves less cooperative than they expected."
 gh_scoured_modifier: "Scoured"
 gh_scoured_modifier_desc: "The fever driven out by force. It worked, and it took something with it that has not entirely grown back."
 gh_mapped_the_stone_modifier: "Mapped the Stone"
 gh_mapped_the_stone_modifier_desc: "A cell scried down to its joints. Knowing exactly how a place is put together stays useful long after you are out of it."
 gh_undivided_modifier: "Undivided"
 gh_undivided_modifier_desc: "This character chose to not let one piece of magic make the rest of it smaller. Broader for it, and harder to unsettle."
 gh_hand_stayed_modifier: "Stayed the Hand"
 gh_hand_stayed_modifier_desc: "Reached the threshold and chose not to cross it. Knowing you can stop is its own kind of command, and people find this character rather less alarming for it."
 gh_cowed_modifier: "Cowed"
 gh_cowed_modifier_desc: "This character stood close enough to see how it was done, and has not stopped thinking about it since. They do as they are told, and they do it badly."
 gh_unbound_beast_modifier: "Something in the Hills"
 gh_unbound_beast_modifier_desc: "It was looked at, written down, and left alone. Everyone now who has to cross that ground after dark knows of it, and who chose to leave it."
 gh_omen_driven_off_modifier: "The Omen Driven Off"
 gh_omen_driven_off_modifier_desc: "Whatever had been loitering by the wayline is gone. Nobody could say what it was, but perhaps that's the best."

 #####################################
 # 46. The Warlock-Vassal
 #####################################
 gh_arcana_lifestyle.0046.t: "The Upstart"
 gh_arcana_lifestyle.0046.desc: "[gh_warlock_vassal.GetTitledFirstName] has stopped respecting my authoirty.\n\nThe summons went out and came back unanswered. Their levies arrive late and short. And when my men went to ask why, [gh_warlock_vassal.GetSheHe] said that one who can call on [magic|E] does not stand in a yard waiting on a clerk.\n\n[gh_mundane_vassal.GetTitledFirstName] put it more plainly at table last night: either their 'Art' answers to my law, or my law is merely courtesy."
 gh_arcana_lifestyle.0046.a: "Then we must find out which it is."
 gh_arcana_lifestyle.0046.a.flavor: "A collar is not always an insult."
 gh_arcana_lifestyle.0046.a.heeled: "The concession is signed"
 gh_arcana_lifestyle.0046.a.defied: "You reached, and closed on nothing"
 gh_arcana_lifestyle.0046.b: "Let them mutter. [gh_warlock_vassal.GetFirstName] has my backing."
 gh_arcana_lifestyle.0046.b.flavor: "A realm that shelters magic should say so where everyone can hear it."
 gh_arcana_lifestyle.0046.c: "Both of you. Sit down."
 gh_arcana_lifestyle.0046.c.flavor: "Neither of them will get what they came for."
 gh_arcana_lifestyle.0046.c.settled: "The terms are set, and both sign"
 gh_arcana_lifestyle.0046.c.stalled: "They leave the table still arguing"

 #####################################
 # 47. The Question of Magic
 #####################################
 gh_arcana_lifestyle.0047.t: "The Question of Magic"
 gh_arcana_lifestyle.0047.desc.seizure: "Townsfolk have taken a hedge-witch from a village severals days' ride from here, and they are said to have already built a pyre.\n\nThe inquisitors did not ask. But they they still want my seal on it. [gh_petitioner.GetTitledFirstName] is in the outer hall, and has been since dawn. Behind [gh_petitioner.GetHerHim] the question nobody in this realm has yet made me answer aloud: what, exactly, is the Art permitted to be here?"
 gh_arcana_lifestyle.0047.desc.petition: "A handful of Hedge Magi and Village Mystics have come with documents, which is how I know they are serious.\n\n[gh_petitioner.GetTitledFirstName] speaks for them. Charters, [gh_petitioner.GetSheHe] says. A register. A named authority to answer to, and in exchange, protection with my name on it so that a practitioner travelling in my realm is a subject rather than something to be dealt with by whoever finds [gh_petitioner.GetHerHim] first.\n\nIt is reasonable, yet what exactly should the place for magic be in my realm?"
 gh_arcana_lifestyle.0047.a.seizure: "The Art answers to the altar. Let it burn."
 gh_arcana_lifestyle.0047.a.petition: "Refused - and I will take that register. Of names to watch."
 gh_arcana_lifestyle.0047.a.flavor: "Every practitioner in the realm will hear about this by week's end."
 gh_arcana_lifestyle.0047.b: "They are mine. Anyone who touches them answers to me."
 gh_arcana_lifestyle.0047.b.flavor: "The ones with nowhere else to go will come here, and they will remember who said it first."
 gh_arcana_lifestyle.0047.c.seizure: "Nobody burns today. But they will be registered, and taxed."
 gh_arcana_lifestyle.0047.c.petition: "Charters, then. Registered, taxed, and accountable."
 gh_arcana_lifestyle.0047.c.flavor: "Neither camp gets the realm it wanted. Both of them get to keep living in this one."

 #####################################
 # 48. A Blight Upon the Land
 #####################################
 gh_arcana_lifestyle.0048.t: "A Blight Upon the Land"
 gh_arcana_lifestyle.0048.desc: "[gh_blighted_county.GetName] is dying, yet of what I do not know.\n\nThe first riders said the dead would not stay down. The second said the fields were turning to ash in front of them. The third came back pale and ravenous, yelling of [GetTrait('shade_stricken').GetName( GetNullCharacter )] bodies.\n\n[gh_witness.GetTitledFirstName] has read what there is to read and yet remains confused how it arrived. \"It is spreading, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [gh_witness.GetSheHe] says. \"How it began, I could not tell you. But it will not stop on its own.\""
 gh_arcana_lifestyle.0048.a: "Seal it. Nothing goes in and nothing comes out."
 gh_arcana_lifestyle.0048.a.flavor: "The county is lost whichever way this goes, but we can save others."
 gh_arcana_lifestyle.0048.b: "Whatever it costs, we must find a way!"
 gh_arcana_lifestyle.0048.b.flavor: "This is what Magi are for."
 gh_arcana_lifestyle.0048.c: "Something started this, and we must learn what it was.."
 gh_arcana_lifestyle.0048.c.flavor: "The blight will keep working while you look. That is the price of knowing."
 gh_arcana_lifestyle.0048.c.hunt_tt: "Your magi begin hunting for whatever started this. [gh_blighted_county.GetName] stays #X stricken#! while they search, and nothing is lifted today.\nThey will report back within a few months, and what they find can then be dealt with at the root."
 gh_arcana_lifestyle.0048.b.cleansed: "The ground comes back"
 gh_arcana_lifestyle.0048.b.partial: "The blight lifts. Not everything it touched does."

 #####################################
 # 50. A Blight Upon the Land - the root cause
 #####################################
 gh_arcana_lifestyle.0050.t: "What Was Underneath"
 gh_arcana_lifestyle.0050.desc.site: "They found it in the end, which I am told is the hard part.\n\nUnder the old barrow field at the edge of [gh_blighted_county.GetName] there is a dark place that should have been sealed and was not, or was sealed by someone who did not understand what they were doing. It has been open a long time. Long enough that the blight is but a symptom.\n\n[gh_witness.GetTitledFirstName] says it can be closed. [gh_witness.GetSheHe] does not say it will be pleasant."
 gh_arcana_lifestyle.0050.desc.being: "They found it in the end, which I am told is the hard part.\n\nThere is something living in [gh_blighted_county.GetName] that was not born and does not intend to leave. It is not large. It is simply old, patient, pitch black, and it has been feeding on that county for longer than anyone has been counting.\n\nIt knows we are looking now. That may not be to our advantage."
 gh_arcana_lifestyle.0050.a: "Then we end it at the root."
 gh_arcana_lifestyle.0050.a.flavor: "Knowing what a thing is does not make it safe to touch."
 gh_arcana_lifestyle.0050.a.rooted_out: "It is finished, and the land will heal"
 gh_arcana_lifestyle.0050.a.escaped: "It slips free, and the ground keeps the scar"
 gh_arcana_lifestyle.0050.b: "Write what we know, and seal the county."
 gh_arcana_lifestyle.0050.b.flavor: "Someone will face this again. They should not have to start from nothing."

 #####################################
 # 49. The Shared Dream
 #####################################
 gh_arcana_lifestyle.0049.t: "The Shared Dream"
 gh_arcana_lifestyle.0049.desc: "Every soul in [gh_dream_county.GetName] is dreaming the same dream, and they have been for sevearl nights.\n\nA drowned city. Towers standing in still water with the lights still burning in them.\n\nHalf the county calls it prophecy. The other half has stopped sleeping on purpose, and it shows. \"Whatever settled over that ground,\" [gh_witness.GetTitledFirstName] says carefully, \"it did not settle by accident.\""
 gh_arcana_lifestyle.0049.a: "Send someone in who can listen properly."
 gh_arcana_lifestyle.0049.a.flavor: "A dream that arrives on schedule is a message that has not found its reader."
 gh_arcana_lifestyle.0049.a.omen: "The dream is read correctly"
 gh_arcana_lifestyle.0049.a.caught: "Your reader is dreaming it now too"
 gh_arcana_lifestyle.0049.b: "Ward the village. Let them sleep."
 gh_arcana_lifestyle.0049.b.flavor: "They will sleep, and thank you for it, and never learn what was being said. You will not learn either."
 gh_arcana_lifestyle.0049.c: "It will pass. Most things do."
 gh_arcana_lifestyle.0049.c.flavor: "Some of them will break before it does. A few will come out the other side changed."
 gh_arcana_lifestyle.0049.c.touched_tt: "Some of the sleepers may emerge different"

 # Modifiers from events 46-50
 gh_arbiter_of_the_art_modifier: "Arbiter of the Art"
 gh_arbiter_of_the_art_modifier_desc: "You settled a quarrel over [magic|E] that neither side could settle themselves. Both halves of the hall now bring such things to you first, which is tiring and extremely useful."
 gh_sworn_of_the_art_modifier: "Sworn of the Art"
 gh_sworn_of_the_art_modifier_desc: "A vassal whose standing as a practitioner rests on their liege's word rather than on their own power. They are aware of the difference."
 gh_the_art_proscribed_modifier: "The Art Proscribed"
 gh_the_art_proscribed_modifier_desc: "Magic has been driven out of the open here. What remains of it is furtive, undertrained and resentful, and the county has lost the quiet advantages that came with it."
 gh_haven_of_the_art_modifier: "Haven of the Art"
 gh_haven_of_the_art_modifier_desc: "Word travels among practitioners faster than it travels among lords."
 gh_protector_of_the_art_modifier: "Protector of the Art"
 gh_protector_of_the_art_modifier_desc: "You put your name between the practitioners of your realm and everyone who wanted them dealt with. They have not forgotten it. Neither has the clergy."
 gh_the_compact_modifier: "The Compact"
 gh_the_compact_modifier_desc: "Charters, a register, a fee and a named authority to answer to. The magi resent being counted, others resent that counting is all that happens, and the arrangement has so far survived both."
 gh_blighted_ground_modifier: "Blighted Ground"
 gh_blighted_ground_modifier_desc: "Something is working on this county that does not answer to season or medicine. The dead do not settle, the fields go to ash, and it has not finished."
 gh_quarantined_county_modifier: "Sealed Against the Blight"
 gh_quarantined_county_modifier_desc: "Nothing goes in and nothing comes out. The county is not cured; it is contained, and the people inside know it."
 gh_cleansed_ground_modifier: "Cleansed Ground"
 gh_cleansed_ground_modifier_desc: "The working was lifted properly and the ground tended afterwards. It grows better now than it did before."
 gh_lingering_mutation_modifier: "The Blight's Leavings"
 gh_lingering_mutation_modifier_desc: "The affliction is gone. What it did to the people who lived through it is not, and their children show it too."
 gh_shared_dream_modifier: "The Shared Dream"
 gh_shared_dream_modifier_desc: "Every sleeper in the county is dreaming the same thing on the same nights. Some of them have stopped sleeping on purpose."
 gh_dream_warded_modifier: "Dream-Warded"
 gh_dream_warded_modifier_desc: "The resonance has been shut out and the county sleeps again. Whatever was being said goes unsaid."
 gh_read_the_omen_modifier: "The Omen Read"
 gh_read_the_omen_modifier_desc: "The dream turned out to be a message, and someone finally read it. The county sleeps, and carries itself like a place that was warned in time."
 gh_dreamsick_county_modifier: "Dreamsick"
 gh_dreamsick_county_modifier_desc: "It burned itself out, as these things do, and took a portion of the county with it. The ones still here do not talk about the eleven nights."
 gh_dream_touched_modifier: "Dream-Touched"
 gh_dream_touched_modifier_desc: "They carried something out of a dream that was not theirs. It has not left, and on some nights it is still talking."

 # Opinion modifiers from events 46-47
 gh_magi_privilege_curbed_opinion: "Curbed the Art"
 gh_magi_privilege_checked_opinion: "Checked the Warlocks"
 gh_arcane_patron_opinion: "Patron of the Art"
 gh_arcane_patron_devout_opinion: "Indulges the Warlocks"
 gh_arbitration_accepted_opinion: "Arbitrated Fairly"
 gh_the_art_proscribed_opinion: "Proscribed the Art"
 gh_the_art_proscribed_devout_opinion: "Cleansed the Realm"
 gh_the_compact_opinion: "Imposed the Compact"
