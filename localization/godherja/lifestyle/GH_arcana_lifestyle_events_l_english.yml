l_english:
 gh_duel_arcana_name: "[arcana_i][arcana|E]"
 gh_duel_hymns_name: "@gh_hymns_icon![aspect_hymns]"
 gh_arcana_lifestyle.0001.t: "A Peddler of Curios"
 gh_arcana_lifestyle.0001.desc: "The cart is half a market stall, half a reliquary, and [gh_peddler.GetTitledFirstName] has the unhurried patience of someone who has sold to [magi|E] before\n\nMost of it is [ROOT.Char.Custom('GH_PeddlerStock')], laid out with more ceremony than it deserves. The one thing given its own cloth is a book, and the peddler makes no claims at all beyond the price. That reticence is either honesty or the oldest trick there is."
 gh_arcana_lifestyle.0001.a: "Look at it properly."
 gh_arcana_lifestyle.0001.b: "Take the reagents."
 gh_arcana_lifestyle.0001.c: "The book, then. Name your price."
 gh_arcana_lifestyle.0001.d: "Move along."
 gh_prepared_reagents_modifier: "Prepared Reagents"
 gh_prepared_reagents_modifier_desc: "A stock of prepared reagents, however come by.\n\n$EFFECT_LIST_BULLET$Covers the [gold_i][gold|E] cost of the components for one [gh_ritual|E]\n$TAB$#weak Consumed when the ritual is cast. Unused, the reagents spoil within the year.#!"
 gh_peddler_stock_fire: "cinder-glass and sealed jars of something that moves when the light hits it"
 gh_peddler_stock_water: "stoppered rainwater, river-silt, and a jar of what is politely called sea-glass"
 gh_peddler_stock_dark: "cave-lichen, unlit tapers, and powders kept in doubled cloth"
 gh_peddler_stock_death: "grave-lilies, bone-dust, and a box the peddler does not open"
 gh_peddler_stock_nature: "dried root and seed-cases, each labelled in a hand not their own"
 gh_peddler_stock_generic_1: "chalk, tallow, salt, and a great deal of very ordinary string"
 gh_peddler_stock_generic_2: "copper filings, dried herbs, and three grades of ink"
 gh_peddler_stock_generic_3: "wax, wire, powdered stone, and a bundle of quills"
 gh_arcana_lifestyle.0002.t: "The Stray Familiar"
 gh_arcana_lifestyle.0002.desc: "It has been coming to the same corner of the outer yard for six nights, and [gh_witness.GetTitledFirstName] has been keeping count.\"It was an animal once, [ROOT.Char.Custom('FormOfAddressForLiege')]. It is still shaped like one,\" [gh_witness.GetSheHe] reports. It came in off the [Concept('waylines','wayline')|E] and it has not left. Whatever it is living on, it cannot be good for the rest of us."
 gh_arcana_lifestyle.0002.a: "We must find a way to bind it."
 gh_arcana_lifestyle.0002.b: "Watch it and write down what it does."
 gh_arcana_lifestyle.0002.c: "Drive it off before it learns anything else."
 gh_arcana_lifestyle.0002.d: "It might not bleed, but it can still die."
 artifact_mountconstruct_name: "Bound Construct"
 artifact_mountconstruct_desc: "Neither the beast it was nor what it might have been, but something caught between the two and held there by a binding."
 gh_arcana_lifestyle.0003.t: "Wayline Tremor"
 gh_arcana_lifestyle.0003.desc.magi: "[gh_tremor_magi.Custom2('MyCharacterIntroduction', ROOT.Char)|U] does not wait to be announced.\n\nThe [Concept('waylines','wayline')|E] under [ROOT.Char.GetPrimaryTitle.GetName] has been pulsing for a week and today it surfaced. Candles gutter with no draught. Milk turns in the pail. Every hound inside the walls has been awake since dawn.\n\n\"It will pass, [ROOT.Char.Custom('FormOfAddressForLiege')]. These always pass. The only question is whether anything gets taken from it first, and by whom,\" [gh_tremor_magi.GetSheHe] says."
 gh_arcana_lifestyle.0003.desc.household: "My steward brings the news twice before I take it seriously.\n\nThe [Concept('waylines','wayline')|E] under [ROOT.Char.GetPrimaryTitle.GetName] has been pulsing for a week and today it surfaced. Candles gutter with no draught. Milk turns in the pail. Every hound inside the walls has been awake since dawn.\n\nIt will pass. These always pass. The only question is whether anything gets taken from it first, and by whom."
 gh_arcana_lifestyle.0003.a: "Take some of the power into myself."
 gh_arcana_lifestyle.0003.b: "Ward it, and let it go."
 gh_arcana_lifestyle.0003.c: "Send [gh_tremor_magi.GetName] to map it."
 gh_arcana_lifestyle.0003.c.tt: "[gh_tremor_magi.GetName] will report back in several months on their progress."
 gh_arcana_lifestyle.0004.t: "What the Wayline Held"
 gh_arcana_lifestyle.0004.desc: "[gh_tremor_magi.Custom2('MyCharacterIntroduction', ROOT.Char)] has been down at the [Concept('waylines','line')|E] since the tremor, and comes back with the look of someone who has been holding their breath for two months."
 gh_arcana_lifestyle.0004.a: "Good."
 gh_arcana_lifestyle.0004.b: "And the cost of it?"
 gh_arcana_lifestyle.0005.t: "A Working Gone Wrong"
 gh_arcana_lifestyle.0005.desc: "The noise reaches me a long way before the news does.\n\nA page finds me on the stair and tells it badly, but the shape is clear enough: [gh_apprentice.Custom2('MyCharacterIntroduction', ROOT.Char)] was working alone in the east hall, the working got out from under [gh_apprentice.GetHerHis] hands, and the hall is now [gh_apprentice.Custom('GH_MishapKind')]. The binding [gh_apprentice.GetSheHe] was attempting did not fail so much as stop halfway.\n\n[gh_apprentice.GetTitledFirstName] is still in the doorway when I arrive, hands down now, [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', gh_apprentice)]. [gh_apprentice.GetSheHe] manages, \"[gh_apprentice.Custom('GH_ApprenticeExcuse')]\""
 gh_arcana_lifestyle.0005.a: "Show them where it went wrong."
 gh_arcana_lifestyle.0005.b: "Let the court see what carelessness earns."
 gh_arcana_lifestyle.0005.c: "This never happened."
 gh_arcana_lifestyle.0005.d: "To the cells. Let them cool off in the dark."
 gh_arcana_lifestyle.0006.t: "Whispers in the Stone"
 gh_arcana_lifestyle.0006.desc: "First, the servants refused to go into the root cellar, then the guards, and now [gh_witness.GetTitledFirstName] will not either and is not embarrassed to say so.\"It is not a draught. A draught does not wait until you stop walking, [ROOT.Char.Custom('FormOfAddressForLiege')]. Stand in there and listen for a count of ten. Then tell me it is a draught,\" [gh_witness.GetSheHe] says flatly."
 gh_arcana_lifestyle.0006.a: "Listen properly."
 gh_arcana_lifestyle.0006.b: "Ward the halls and be done with it."
 gh_arcana_lifestyle.0006.c: "It is a draught. It has always been a draught."
 gh_arcana_lifestyle.0006.e: "Sing back to it."
 gh_arcana_lifestyle.0007.t: "Duel of Sorcerers"
 gh_arcana_lifestyle.0007.desc: "[gh_duel_rival.Custom2('MyCharacterIntroduction', ROOT.Char)|U] waits until the hall is full before speaking boldly. \"No steel. No seconds. Whatever the two of us can hold, and we will all find out which of us was worth listening to,\" [gh_duel_rival.GetSheHe] says, loud enough to carry to the back of the hall.\n\nWhat I can hold is [ROOT.Char.Custom('GH_DuelStyle')]. What [gh_duel_rival.GetSheHe] can hold is [gh_duel_rival.Custom('GH_DuelStyle')]. [ROOT.Char.Custom('GH_DuelStakes')]"
 gh_arcana_lifestyle.0007.a: "Then let us find out."
 gh_arcana_lifestyle.0007.b: "Reach for something they will not expect."
 gh_arcana_lifestyle.0007.c: "I have nothing to prove to you."
 gh_arcana_lifestyle.0008.t: "The Storm-Calling"
 gh_arcana_lifestyle.0008.desc.drought: "[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has the reports and has likely been sitting on them for a fortnight hoping they would improve.\n\n\"The wells are down to mud in three villages, [ROOT.Char.Custom('FormOfAddressForLiege')]. The rains did not come and they are not going to,\" [gh_witness.GetSheHe] admits.\n\nI can feel the shape of it from here; the whole sky is sitting wrong, and it has been sitting wrong since spring."
 gh_arcana_lifestyle.0008.desc.flood: "[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has the reports and has clearly been sitting on them for a fortnight hoping they would improve.\n\n\"The low fields have been under water since the thaw, [ROOT.Char.Custom('FormOfAddressForLiege')]. It is not going down. It is coming up,\" [gh_witness.GetSheHe] admits.\n\nI can feel the shape of it from here; the whole sky is sitting wrong, and it has been sitting wrong since spring."
 gh_arcana_lifestyle.0008.a.drought: "Call the rains."
 gh_arcana_lifestyle.0008.a.flood: "Turn the storm aside."
 gh_arcana_lifestyle.0008.b: "Something smaller perhaps?"
 gh_arcana_lifestyle.0008.c: "The weather is not ours to argue with."
 gh_arcana_lifestyle.0009.t: "A Show of Power"
 gh_arcana_lifestyle.0009.desc: "[gh_restless_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has stopped lowering [gh_restless_vassal.GetHerHis] voice, and the rest of the hall has stopped pretending not to hear it.\n\n\"A ruler who needs [magic|E] to hold a room holds nothing to their name!\" [gh_restless_vassal.GetSheHe] says, and does not trouble to lower it.\n\nI could end the conversation this afternoon. [ROOT.Char.Custom('GH_ShowOfPower')] Every one of them would go home quiet, and not one of them would forget which of the two things I chose to be."
 gh_arcana_lifestyle.0009.a: "Let them see it, then."
 gh_arcana_lifestyle.0009.b: "A demonstration. Nothing more."
 gh_arcana_lifestyle.0009.c: "Answer them as an equal."
 gh_show_of_power_death: "The dead of this house are not far, and they have never once been asked to stand up."
 gh_show_of_power_dark: "There is not a lamp in this hall I could not put out from where I are sitting, nor a shadow I could not leave standing afterward."
 gh_show_of_power_dream: "I know precisely what each of them dreams about, and precisely how little effort it would take to be waiting there."
 gh_show_of_power_blood: "Every man at this table is mostly water and iron."
 gh_show_of_power_ethereal: "The wall behind them is not a fact, and I have never been especially bound by conventions."
 gh_show_of_power_fire: "The hearth is four paces from the high table and it would take I no time at all to make that distance irrelevant."
 gh_show_of_power_ice: "The wine in their cups would take frost in the time it takes to finish a sentence, and so would their hands."
 gh_show_of_power_stone: "The hall was built by people who assumed the stone would stay where it was put."
 gh_show_of_power_air: "There is no air in this room that does not move at your discretion."
 gh_show_of_power_nature: "The beams overhead were living wood once, and wood remembers for a very long time."
 gh_show_of_power_light: "You could show them exactly what they are, lit from an angle none of them have seen."
 gh_show_of_power_generic: "You have not the depth for anything showy, but I have enough, and none of them know where the line is."
 gh_arcana_lifestyle.0010.t: "Marked by the Working"
 gh_arcana_lifestyle.0010.desc: "My body has been keeping a tally of the rituals I have performed, and this morning it presented the bill.\n\nThe mark came in over years, a shade at a time, slowly enough that I could tell myself it was the light. It is not the light. It runs from wrist to elbow and it is the colour of nothing that belongs on a person. [gh_witness.GetTitledFirstName] saw it before I did, and has said nothing all week. \"I did wonder whether to mention it, [ROOT.Char.Custom('FormOfAddressForLiege')]. I decided you would mention it first,\" [gh_witness.GetSheHe] says."
 gh_arcana_lifestyle.0010.a: "Let them look."
 gh_arcana_lifestyle.0010.b: "Cover it. Every morning, if that is what it takes."
 gh_arcana_lifestyle.0010.c: "Burn it out of me."
 gh_marked_by_the_working_modifier: "Marked by the Working"
 gh_marked_by_the_working_modifier_desc: "The Art has been drawing on this one for years and has finally been paid. Covered, mostly, by high collars and careful lighting, but the court knows, and the court talks."
 gh_marked_worn_openly_modifier: "The Mark Worn Openly"
 gh_marked_worn_openly_modifier_desc: "This one makes no attempt to hide what the Art has done, which unsettles people considerably more than the mark itself. Those who practice [magic|E] find it rather easier to accept."
 gh_arcana_lifestyle.0013.t: "On the Verge"
 gh_arcana_lifestyle.0013.desc: "I have been working through the same primer all season. The one every student is handed and nobody reads twice.\n\nI have read this page eleven times. But on the twelth, it is as if something clicks. Nothing on the page has changed; something behind it has, and it is a working nobody taught me, assembled out of pieces I already had and never thought to put in that order.\n\nI put it to [gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)], who has read beyond me.\n\n\"That is not in the book, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [gh_witness.GetSheHe] says."
 gh_arcana_lifestyle.0013.a: "Chase it. Sleep is negotiable."
 gh_arcana_lifestyle.0013.b: "Write it down and come back sober."
 gh_arcana_lifestyle.0013.c: "Let it go."
 gh_arcana_lifestyle.0014.t: "The Quickened Acre"
 gh_arcana_lifestyle.0014.desc: "[gh_claimant_one.Custom2('MyCharacterIntroduction', ROOT.Char)] and [gh_claimant_two.GetTitledFirstName] have been arguing about a field for two seasons, and have now approached me to resolve it..\n\nIt is nine acres of poor ground on the line where [gh_disputed_county.GetName] meets [gh_neighbour_county.GetName]. Nothing grows there that should; out of season, out of order, and faster than anything has any business growing. Neither of them can tell me what the field is.\n\n\"The boundary stone has stood where it stands since my grandfather set it, [ROOT.Char.Custom('FormOfAddressForLiege')].\" [gh_claimant_one.GetSheHe] says.\n\n\"The stone is not in dispute. What is growing on my side of it is.\" [gh_claimant_two.GetSheHe] answers."
 gh_arcana_lifestyle.0014.a: "[gh_claimant_one.GetTitledFirstName] is correct."
 gh_arcana_lifestyle.0014.a.flavor: "The older claim, and the one with a stone behind it. Boundaries hold because rulers hold them."
 gh_arcana_lifestyle.0014.b: "No, [gh_claimant_two.GetTitledFirstName] has it."
 gh_arcana_lifestyle.0014.b.flavor: "The stone says one thing and the ground says another. I am inclined to believe the ground."
 gh_arcana_lifestyle.0014.c: "Neither. The field is mine."
 gh_arcana_lifestyle.0014.c.flavor: "Whatever is under those nine acres is worth more than the pair of them put together, and neither has the first idea what to do with it. I do."
 gh_arcana_lifestyle.0014.d: "Show them how to share it."
 gh_arcana_lifestyle.0014.d.flavor: "The ground does not have to be cut in half to be divided. It has to be understood first, which is the part neither of them can do."
 gh_arcana_lifestyle.0014.d.settled: "I walk them both across it and show them what is actually happening in the soil."
 gh_arcana_lifestyle.0014.d.botched: "I explain it twice and by the end, both of them are certain that I have taken a side without saying which."
 gh_arcana_lifestyle.0014.e: "Settle it between yourselves."
 gh_arcana_lifestyle.0014.e.flavor: "Nine acres of bad ground is not worth a morning of my time."
 gh_arcana_lifestyle.0014.e.tt: "[gh_claimant_one.GetTitledFirstName] and [gh_claimant_two.GetTitledFirstName] become [rival|E]s"
 gh_arcana_lifestyle.0016.t: "The Enchanter's Commission"
 gh_arcana_lifestyle.0016.desc: "My workshop is finally in a state to create something proper with. Benches levelled, lines carved, and enough reagents, minerals, and rare herbs stored that a binding would need no rushing. [gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)|U] now simply needs my approval.\n\n\"Whatever you intend to use, [ROOT.Char.Custom('FormOfAddressForLiege')], put it into something you will still be carrying in twenty years. I have watched spectacle go into nothing more than a cup,\" [gh_witness.GetSheHe] says."
 gh_arcana_lifestyle.0016.a: "Something new, and mine."
 gh_arcana_lifestyle.0016.b: "Put it into what I already carry."
 gh_arcana_lifestyle.0016.c: "Open the bench to buyers."
 gh_arcana_lifestyle.0016.d: "Not now. The bench keeps."
 gh_enchanters_trade_modifier: "Enchanter's Bench"
 gh_enchanters_trade_modifier_desc: "Work of this kind cannot be bought at any price within a month's travel, and the people who want it are not the sort who haggle."
 gh_arcana_lifestyle.0017.t: "The Overflowing Vault"
 gh_arcana_lifestyle.0017.desc: "[gh_witness.GetTitledFirstName] raises it the way [gh_witness.GetSheHe] raises anything [gh_witness.GetSheHe] has already made up [gh_witness.GetHerHis] mind about: in passing, and with an example to hand. \"One of these relics is holding a door open, [ROOT.Char.Custom('FormOfAddressForLiege')]. In the west corridor. It has been holding that door for a month,\" [gh_witness.GetSheHe] complains. The plethora of artifacts I possess are by no means worthless, but that is precisely the problem. Each requires good deal of care, and there are now enough that the care has quietly turned into storage."
 gh_arcana_lifestyle.0017.a: "Find a buyer."
 gh_arcana_lifestyle.0017.b: "Give one to someone who will use it."
 gh_arcana_lifestyle.0017.c: "Break one down for the materials."
 gh_arcana_lifestyle.0017.d: "Leave them. They are not hurting anyone."
 gh_arcana_lifestyle.0018.t: "The Construct"
 gh_arcana_lifestyle.0018.desc: "The frame has stood finished and empty in the workshop for two months, and every morning I have found a reason not to fill it.\n\nThere is nothing wrong with the work. The joints are true and the channels will hold. The problem is that a binding this size does not fail quietly, but standing up in a room with me in it.\n\nThe frame is not going to complete itself, but how much can I finish in one sitting?"
 gh_arcana_lifestyle.0018.a: "All at once. Let it stand or not."
 gh_arcana_lifestyle.0018.b: "Piece by piece. It will take twice as much."
 gh_arcana_lifestyle.0018.c: "Not yet."
 gh_arcana_lifestyle.0018.d: "Let [gh_construct_magi.GetTitledFirstName] put [gh_construct_magi.GetHerHis] hands in it."
 gh_arcana_lifestyle.0019.t: "The Grave-Harvest"
 gh_arcana_lifestyle.0019.desc: "[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mentions it the way people mention things they have already thought about for a while.\"There is a new grave pit outside the nearby [gh_settlement.Custom('BaronyTownType')], [ROOT.Char.Custom('FormOfAddressForLiege')]. Dug in a hurry into the [ROOT.Char.Custom('GroundType')], filled in worse. Plague or famine they say, I'm not quite sure. Nobody has ever put a name to anyone down there,\" [gh_witness.GetSheHe] says.\n\n[gh_witness.GetName] argues there is a great deal down there my [magic|E] could use and no living claims. That is one argument.\n\nThe other is that the [gh_settlement.Custom('BaronyTownType')] dug that pit, remembers doing it, and would likely prefer it be left undisturbed. Whoever goes out there tonight will be noticed. It matters a great deal whether anyone can put my name to it afterwards."
 gh_arcana_lifestyle.0019.a: "Take everything worth taking."
 gh_arcana_lifestyle.0019.b: "One bone. Chosen carefully."
 gh_arcana_lifestyle.0019.c: "Fill it back in."
 gh_arcana_lifestyle.0021.t: "Choosing an Affinity"
 gh_arcana_lifestyle.0021.desc: "I have been circling this for years without admitting it. Of everything I have been taught, one part comes easier than the rest.\n\nIt is a quiet sort of choice. The kind where I notice, one morning, that I have been reaching for the same thing for a decade and calling it preference.There is real depth I could obtain if I stop pretending otherwise. There is also a door that closes behind me."
 gh_arcana_lifestyle.0021.a: "Follow it down."
 gh_arcana_lifestyle.0021.b: "I will keep my options open."
 gh_arcana_lifestyle.0021.c: "I see no need to make a choice now."
 gh_arcana_lifestyle.0022.t: "Transmutation"
 gh_arcana_lifestyle.0022.desc: "Every generation turns out somebody certain they have solved transmutation, and buries them poorer than they started. I have read their notes. Most were fools. Two or three were not.\n\nThose two or three are why my workshop is cleared, the base metal weighed out in front of me, and why [gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)], [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', gh_witness)] as ever, has found a reason to stand near the door.\n\n\"I will hold whatever you need held, [ROOT.Char.Custom('FormOfAddressForLiege')]. I would simply like it noted that I offered to hold it from the corridor,\" [gh_witness.GetSheHe] says."
 gh_arcana_lifestyle.0022.a: "Attempt it properly."
 gh_arcana_lifestyle.0022.b: "A small assay. Nothing more."
 gh_arcana_lifestyle.0022.c: "Gold is gold because it is not made."
 gh_arcana_lifestyle.0024.t: "The Forbidden Grimoire"
 gh_arcana_lifestyle.0024.desc: "It arrives without a sender, wrapped twice, the outer wrapping scorched in a pattern that stops just short of being a word. [gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)] carried it up and has set it away from [gh_witness.GetHerHis] person.\n\n\"The rider would not come inside the gate, [ROOT.Char.Custom('FormOfAddressForLiege')]. He would not take payment either,\" [gh_witness.GetSheHe] says. Whoever held it before wanted rid of it badly enough to hand it on rather than burn it."
 gh_arcana_lifestyle.0024.a: "I should read it, all of it."
 gh_arcana_lifestyle.0024.b: "Shelve it, unopened."
 gh_arcana_lifestyle.0024.c: "Burn it and salt the ashes."
 gh_arcana_lifestyle.0025.t: "Runes in the Old Stone"
 gh_arcana_lifestyle.0025.desc: "A band of strange runes and marks circuits the base of an inner wall in [old_county.GetNameNoTier]'s keep. The wall predates the keep, and the keep predates [old_county.GetNameNoTier]. Nobody has ever read the text, and every mason who has worked here has been told to leave that course alone.\n\nAll I am sure of is that they are not decoration. Whoever cut them expected to be understood, and it has been a very long time since anyone has."
 gh_arcana_lifestyle.0025.a: "Sit with it until it gives."
 gh_arcana_lifestyle.0025.b: "My court magi can handle this."
 gh_arcana_lifestyle.0025.c: "It has waited this long, why not longer."
 gh_arcana_lifestyle.0026.t: "A Prodigy at Court"
 gh_arcana_lifestyle.0026.desc: "The child belongs to nobody in particular. A cooper's, or a carter's; the story changes depending on who is telling it, and none of the tellings include a house.\n\nWhat does not change is the account of what [gh_prodigy.GetSheHe] did in the yard. Untaught, unwatched, and apparently without noticing. I have seen grown [magi|E] work half a decade for less control than that, and [gh_prodigy.GetSheHe] is not old enough to be trusted with a knife.\n\nUntrained it will come out sideways sooner or later. All that matters now is who will be responsible for it when it does."
 gh_arcana_lifestyle.0026.a: "I will teach them myself."
 gh_arcana_lifestyle.0026.b: "Send them somewhere better suited."
 gh_arcana_lifestyle.0026.c: "Bind it down before it grows."
 gh_arcana_lifestyle.0027.t: "The Poached Spell"
 gh_arcana_lifestyle.0027.desc: "My library is exactly as I left it except for one book.A clumsy thief leaves gaps. This one closed the case, squared the spine and put the reading stand back against the wall, yet somehow managed to put the text back upside down. Otherwise, I would have never known.\n\n[gh_poacher.Custom2('MyCharacterIntroduction', ROOT.Char)] worked a ritual last week that [gh_poacher.GetSheHe] has no business knowing, and there is exactly one copy of it inside these walls.\n\n\"I have never been in your library, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ask anyone who keeps the door,\" [gh_poacher.GetSheHe] says.\n\nNobody keeps that door. That is also how I know."
 gh_arcana_lifestyle.0027.a: "I must take something in return."
 gh_arcana_lifestyle.0027.b: "Ward the shelves and say nothing."
 gh_arcana_lifestyle.0027.c: "I will let them keep what they have learned."
 gh_arcana_lifestyle.0027.d: "To the cells. Let them think about it."
 gh_arcana_lifestyle.0028.t: "Warding the Realm"
 gh_arcana_lifestyle.0028.desc: "Wards are not walls. A wall announces itself and invites a siege. A ward makes the [ROOT.Char.Custom('GroundType')] underfoot disagreeable, and the men who find it disagreeable rarely explain why they chose to go elsewhere instead.\n\n[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)] has done the sums and does not care for them.\"It can be done, [ROOT.Char.Custom('FormOfAddressForLiege')]. I would want you to understand what it will take out of you first, and for how long,\" [gh_witness.GetSheHe] says.\n\nTimes being what they are, I would rather my borders were held by something other than masonry and the men standing on it."
 gh_arcana_lifestyle.0028.a: "Every stone must be covered."
 gh_arcana_lifestyle.0028.b: "Just my capital, that will do."
 gh_arcana_lifestyle.0028.c: "No, walls and men have served well."
 gh_arcana_lifestyle.0029.t: "The Magi Dispute"
 gh_arcana_lifestyle.0029.desc: "It started as a disagreement about method and has arrived, by degrees, at [gh_dispute_magi.GetTitledFirstName] and [gh_dispute_rival.GetTitledFirstName] refusing to be in the same room.\n\n\"The seat is mine. That was settled when you gave it to me,\" [gh_dispute_magi.GetSheHe] says.\"The seat is [gh_dispute_magi.GetHerHis]. The work is mine, and everyone in this hall knows which of the two the realm actually needs,\" [gh_dispute_rival.GetSheHe] answers.\n\n[gh_dispute_magi.Custom2('MyCharacterIntroduction', ROOT.Char)] holds the authority. [gh_dispute_rival.GetTitledFirstName] holds the better argument. Both of them are waiting for me to say which one matters, and the household has already picked sides."
 gh_arcana_lifestyle.0029.a: "The seat means something."
 gh_arcana_lifestyle.0029.b: "The better argument wins."
 gh_arcana_lifestyle.0029.c: "Sit them both down and explain how things work."
 gh_arcana_lifestyle.0029.d: "Neither wins, the matter is closed!"
 gh_arcana_lifestyle.0031.t: "Experimentation"
 gh_arcana_lifestyle.0031.desc: "There is a working I have wanted to attempt for years and have not, for the excellent reason that nobody has written down what it does.\n\nYet that is the entire appeal.\n\nEverything I know how to do was once a thing nobody had written down, and somebody stood roughly where I am standing and decided the not-knowing was worse than the safety.\n\nThe workshop is clear. Nobody else needs to be in the room for this."
 gh_arcana_lifestyle.0031.a: "We can accomplish great things!"
 gh_arcana_lifestyle.0031.b: "A controlled trial, nothing more."
 gh_arcana_lifestyle.0031.c: "No, this is simply too dangerous."
 gh_arcana_lifestyle.0032.t: "The Grand Research"
 gh_arcana_lifestyle.0032.desc: "[gh_research_magi.GetTitledFirstName] comes to me humbly with a request. For years [gh_research_magi.GetSheHe] has secretly been pursuing arcane research and has finally stopped hedging: [gh_research_magi.GetHerHis] research is close, and it will either produce something worth the decade of secret effort, or a great deal of noise with a hole in the floor.\n\n[gh_research_magi.GetSheHe] is asking for funding to find out which. [gh_research_magi.GetSheHe] is also, in the same breath and without appearing to notice, asking you to accept whichever answer arrives."
 gh_arcana_lifestyle.0032.a: "We must see it through."
 gh_arcana_lifestyle.0032.b: "Something useful this decade, please."
 gh_arcana_lifestyle.0032.c: "No, the timing is not right."
 gh_arcana_lifestyle.0033.t: "The Visiting Sage"
 gh_arcana_lifestyle.0033.desc: "[gh_visiting_sage.GetTitledFirstName] traveled far from [gh_sage_origin.GetName] on a journey that [gh_visiting_sage.GetSheHe] says will take [gh_visiting_sage.GetHerHim] even farther. The court was very intrigued with [gh_visiting_sage.GetHerHis] journey, but when I heard [gh_visiting_sage.GetHerHis] accent applied to an incantation I already knew, I realized we could share even more.\n\nThree days then were spent in my library, being unfailingly polite, and establishing very carefully what I do not know that [gh_visiting_sage.GetSheHe] does.\n\n\"An even trade. What I brought with me, against what sits on your shelves unread. I leave in two nights either way,\" [gh_visiting_sage.GetSheHe] says."
 gh_arcana_lifestyle.0033.a: "An honest trade, then."
 gh_arcana_lifestyle.0033.b: "They will give me what I want, or else."
 gh_arcana_lifestyle.0033.c: "My library is not a market."
 gh_arcana_lifestyle.0034.t: "The Arcane Awakening"
 gh_arcana_lifestyle.0034.desc.untaught: "[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)] was in the room and [gh_witness.GetSheHe] has not said anything since. I have read much on the arcane mysteries but it was not until today that I managed to perform a ritual on my own.\n\nNobody taught me the step I took. It was not in the books, because it is not the sort of thing that survives being written down, it is the moment the grammar stops being grammar and becomes a language I think in."
 gh_arcana_lifestyle.0034.desc.magi: "[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)] was in the room, and knows enough to understand what [gh_witness.GetSheHe] just watched. I had started to believe that I knew all there was was, that the Art was a set of doors I had already drawn a map to.\n\nYet this morning I entered a door that is not on the map. Not a harder working than usual, yet something I had never performed before, and it went as though I knew it by memory."
 gh_arcana_lifestyle.0034.a: "The world will know."
 gh_arcana_lifestyle.0034.b: "Master it quietly."
 gh_arcana_lifestyle.0034.c: "I refuse the calling."
 gh_arcana_lifestyle.0034.d: "I accept the calling."
 gh_arcana_lifestyle.0038.t: "The Hexed Rival"
 gh_arcana_lifestyle.0038.desc: "[gh_hex_target.Custom2('MyCharacterIntroduction', ROOT.Char)] has been a problem for years and will go on being one, because nothing about [gh_hex_target.GetHerHis] position requires [gh_hex_target.GetHerHim] to stop.\n\nThere is a working for people like that. It does not kill, someone who dies suddenly is a question, but someone whose luck simply turns for a decade is a story about bad luck."
 gh_arcana_lifestyle.0038.a: "I will lay the hex properly."
 gh_arcana_lifestyle.0038.b: "A small jinx. Nothing provable."
 gh_arcana_lifestyle.0038.c: "No, I can rise above such pettiness."
 gh_arcana_lifestyle.0039.t: "Cell Scrying"
 gh_arcana_lifestyle.0039.desc: "They took the rings, the reagents, the knife, and every scrap of anything that could hold a charge. They were thorough about it.\n\nThey did not take the [magic|E]. It is not in the rings. It never was.\n\nThere is not much I can do from in here. There is not nothing."
 gh_arcana_lifestyle.0039.a: "I must look for a way out."
 gh_arcana_lifestyle.0039.c: "I will conserve what I have left."
 gh_arcana_lifestyle.0040.t: "Battlefield Evocation"
 gh_arcana_lifestyle.0040.desc: "The lines meet at first light and everyone on this side of the field knows it. The horses know it.\n\n[gh_witness.Custom2('MyCharacterIntroduction', ROOT.Char)] has been at my elbow since the councils broke up, [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', gh_witness)] and waiting to be told which it is going to be.\n\n\"Forward or over our own heads, [ROOT.Char.Custom('FormOfAddressForLiege')]. Either is worth having. Both is worth nothing, and the men are watching you decide,\" [gh_witness.GetSheHe] says.\n\nI am carrying enough for one working of real size, and I will not get a second chance to choose."
 gh_arcana_lifestyle.0040.a: "Loose it into their line."
 gh_arcana_lifestyle.0040.b: "I will ward mine own."
 gh_arcana_lifestyle.0040.c: "No, I must hold this for later."
 gh_arcana_lifestyle.0041.t: "Fevered Mutation"
 gh_arcana_lifestyle.0041.desc: "The fever has been up four days, and somewhere in the third night the walls stopped being walls.\n\nThis is not delirium. Whatever normally keeps the Art on its own side of me has gone thin with the illness, and things are coming up through it that should not be able to.\n\n[gh_witness.GetTitledFirstName] wants to bleed me.\n\n\"It is the humours, [ROOT.Char.Custom('FormOfAddressForLiege')]. It is always the humours,\" [gh_witness.GetSheHe] says.\n\n[gh_witness.GetSheHe] has no idea what [gh_witness.GetSheHe] is looking at."
 gh_arcana_lifestyle.0041.a: "I will follow these mutations."
 gh_arcana_lifestyle.0041.b: "I must fight this fever."
 gh_arcana_lifestyle.0041.c: "Let it pass."
 gh_warded_ground_modifier: "Warded Ground"
 gh_warded_ground_modifier_desc: "A standing ward laid over an entire county. Hostile workings find the ground heavy going, and the people living on it sleep rather better knowing it is there."
 gh_hexed_modifier: "Hexed"
 gh_hexed_modifier_desc: "Someone competent has laid a working against this one. It does not announce itself, it simply arrives as a decade in which nothing quite goes right."
 gh_battle_evocation_modifier: "Evocation Loosed"
 gh_battle_evocation_modifier_desc: "Something was put into the field before the lines met."
 gh_battle_warding_modifier: "Warded Ranks"
 gh_battle_warding_modifier_desc: "A working laid over soldiers. Fewer of them will be missing at the end of it."

 gh_arcana_lifestyle.0001.a.flavor: "Reagents lie about their grade and books lie about their provenance. Only one of the two can be checked from across a table."
 gh_arcana_lifestyle.0001.b.flavor: "Whatever else the peddler is, they are a peddler."
 gh_arcana_lifestyle.0001.c.flavor: "There's something about the text that cannot be priced."
 gh_arcana_lifestyle.0001.d.flavor: "Nothing on that cloth is worth what an afternoon of your attention costs."
 gh_arcana_lifestyle.0002.a.flavor: "Something wandered in off the line and stayed. Give it a shape, a name, and an owner, and it becomes a thing you have."
 gh_arcana_lifestyle.0002.b.flavor: "You do not have to own a thing to learn from it."
 gh_arcana_lifestyle.0002.c.flavor: "It came for the wayline, not for you. It will find another."
 gh_arcana_lifestyle.0003.a.flavor: "Nothing that offers is only offering."
 gh_arcana_lifestyle.0003.b.flavor: "Bleed the surge into the stone and let the country downstream keep its harvest."
 gh_arcana_lifestyle.0003.c.flavor: "Better their hands than yours."
 gh_arcana_lifestyle.0004.a.flavor: "A mapped surge is a surge you can spend. There is no second meaning."
 gh_arcana_lifestyle.0004.b.flavor: "They went in on your word and came back changed."
 gh_arcana_lifestyle.0005.a.flavor: "They will not learn the working from scolding. They will learn it from the hour of training afterwards."
 gh_arcana_lifestyle.0005.b.flavor: "A hall that watches one apprentice burn is a hall that stops making excuses for the rest."
 gh_arcana_lifestyle.0005.c.flavor: "Coin, silence, and a scorched room nobody enters. The fact of it does not go anywhere."
 gh_arcana_lifestyle.0006.a.flavor: "Some magics have a grammar for what stone says when it says anything. Without one, it is only weather in a wall."
 gh_arcana_lifestyle.0006.b.flavor: "Whatever is talking can talk to itself."
 gh_arcana_lifestyle.0006.c.flavor: "Old houses settle. Old houses have always settled."
 gh_arcana_lifestyle.0006.d: "Read the relic instead of listening to it."
 gh_arcana_lifestyle.0006.d.flavor: "The whisper is a symptom. A caster deep enough can go and read the cause."
 gh_arcana_lifestyle.0007.a.flavor: "Their terms, their hall, their choice of hour. Yet still only two casters."
 gh_arcana_lifestyle.0007.b.flavor: "There is always something stronger than what you were taught."
 gh_arcana_lifestyle.0007.c.flavor: "Refusing costs you exactly what everyone in the hall thinks it costs you."
 gh_arcana_lifestyle.0007.d: "End it in one gesture."
 gh_arcana_lifestyle.0007.d.flavor: "You are not going to find out who is better; you are going to show them."
 gh_arcana_lifestyle.0008.a.flavor: "Weather this size does not care whether you are ready. It only cares whether you are right."
 gh_arcana_lifestyle.0008.b.flavor: "A week of rain. Small enough to hold, small enough to matter to almost nobody."
 gh_arcana_lifestyle.0008.c.flavor: "The sky has been doing this since before there were waylines to argue with it."
 gh_arcana_lifestyle.0008.d.drought: "Call it out of the deep water, properly."
 gh_arcana_lifestyle.0008.d.flood: "Take the storm apart on the wind."
 gh_arcana_lifestyle.0008.d.flavor: "You are not wrestling the sky. You are speaking to it, and it is going to answer."
 gh_arcana_lifestyle.0009.a.flavor: "Fear is quick, total, and remembered by everyone including those you did not aim at."
 gh_arcana_lifestyle.0009.b.flavor: "Nothing frightening. Only a reminder, delivered where the acoustics are good."
 gh_arcana_lifestyle.0009.c.flavor: "Their grievance is real. Answering it as such costs less than answering it as an insult."
 gh_arcana_lifestyle.0009.d: "And who is [gh_restless_vassal.GetSheHe] to speak this way!?"
 gh_arcana_lifestyle.0009.d.flavor: "They can cast. That makes this a contest instead of a threat, and contests can be lost."
 gh_arcana_lifestyle.0010.a.flavor: "The mark is the proof. Let it do the work that arguing would otherwise have to."
 gh_arcana_lifestyle.0010.b.flavor: "Paint, powder, a high collar, and an hour every morning for the rest of your life."
 gh_arcana_lifestyle.0010.c.flavor: "It can be taken off, but not cleanly."
 gh_arcana_lifestyle.0013.a.flavor: "It is right there. Two more nights, perhaps three, and it will still be right there while you are not."
 gh_arcana_lifestyle.0013.b.flavor: "Put it on paper while it is still shaped like itself, and come back when you can be trusted with it."
 gh_arcana_lifestyle.0013.c.flavor: "Some doors open onto nothing, and the only cost of finding out is everything you spend along the way.."
 gh_arcana_lifestyle.0016.a.flavor: "New work, your bench, your name on the inside of it."
 gh_arcana_lifestyle.0016.b.flavor: "The blade you already know, made into something you can trust further."
 gh_arcana_lifestyle.0016.c.flavor: "Enchanters who sell become enchanters people travel to. Custom follows the workshop."
 gh_arcana_lifestyle.0016.d.flavor: "The commission is not going anywhere and neither is the workshop."
 gh_arcana_lifestyle.0017.a.flavor: "Somebody out there wants this badly enough to overpay, and you have several."
 gh_arcana_lifestyle.0017.b.flavor: "An artifact in a vault is furniture. In the right hands it is an argument for your reign."
 gh_arcana_lifestyle.0017.c.flavor: "Take it apart for what it is made of. It was only ever going to be admired."
 gh_arcana_lifestyle.0017.d.flavor: "They cost nothing to keep and they are magnificent."
 gh_arcana_lifestyle.0018.a.flavor: "One working, one shape, one answer. It stands up or it does not."
 gh_arcana_lifestyle.0018.b.flavor: "Slower, safer, and twice the cost in everything that is not risk."
 gh_arcana_lifestyle.0018.c.flavor: "The parts keep. The problem is that so does the ambition."
 gh_arcana_lifestyle.0018.d.flavor: "[gh_construct_magi.GetTitledFirstName] has the hands for it. [gh_construct_magi.GetHerHis] opinion of you will do rather more of the work than either of you would admit."
 gh_arcana_lifestyle.0019.a.flavor: "The ground is soft, the night is long, and nobody counts what is already buried."
 gh_arcana_lifestyle.0019.b.flavor: "One set, chosen for what it was in life. Less to explain."
 gh_arcana_lifestyle.0019.c.flavor: "Put the earth back the way you found it and take nothing but a walk home."
 gh_arcana_lifestyle.0021.a.flavor: "Depth costs you breadth. That is not a warning, it is simply fact."
 gh_arcana_lifestyle.0021.b.flavor: "A generalist is never the best caster in the room yet never useless either."
 gh_arcana_lifestyle.0021.c.flavor: "The pull is real. So is the objection to being pulled."
 gh_arcana_lifestyle.0022.a.flavor: "Every transmuter who ever ruined themselves began with serious effort."
 gh_arcana_lifestyle.0022.b.flavor: "A pinch of base metal, a controlled workshop, and an answer you can survive being wrong about."
 gh_arcana_lifestyle.0022.c.flavor: "The worthiness of metal is not in it being made through shortcuts."
 gh_arcana_lifestyle.0024.a.flavor: "Whatever is in it, is in it, whether you read it or not. Reading only moves the problem into you."
 gh_arcana_lifestyle.0024.b.flavor: "High shelf, locked room, and the knowledge that it is still in the house."
 gh_arcana_lifestyle.0024.c.flavor: "Books burn. Whether this one is a book is an open question."
 gh_arcana_lifestyle.0025.a.flavor: "The stone has kept its meaning for a very long time. It can be outlasted."
 gh_arcana_lifestyle.0025.b.flavor: "Their hands and their credit if it gives."
 gh_arcana_lifestyle.0025.c.flavor: "It waited through many dynasties. It will wait mine too."
 gh_arcana_lifestyle.0026.a.flavor: "Nobody teaches a prodigy anything. You show them where the edges are and hope they believe you."
 gh_arcana_lifestyle.0026.b.flavor: "Somewhere with a proper school, proper wards, and someone better than you to be frightened by."
 gh_arcana_lifestyle.0026.c.flavor: "Cut it now, while cutting it is still something one person can do."
 gh_arcana_lifestyle.0027.a.flavor: "They took a working off your shelves. This should go in both directions."
 gh_arcana_lifestyle.0027.b.flavor: "Fix the hole, say nothing, and let them wonder why the next attempt failed."
 gh_arcana_lifestyle.0027.c.flavor: "A spell is not less yours for being copied, and the accusation might cost more.."
 gh_arcana_lifestyle.0028.a.flavor: "Every border stone, every ford, every gate. It can be done."
 gh_arcana_lifestyle.0028.b.flavor: "One county warded properly is worth a realm warded poorly."
 gh_arcana_lifestyle.0028.c.flavor: "Stone and men have held this land for centuries without a ward in their way."
 gh_arcana_lifestyle.0029.a.flavor: "Undercut the seat once and it is no longer a seat."
 gh_arcana_lifestyle.0029.b.flavor: "The challenger is right. That is inconvenient yet it is still the case."
 gh_arcana_lifestyle.0029.c.flavor: "Neither of them will leave satisfied, which is what mediation is."
 gh_arcana_lifestyle.0029.d.flavor: "The dispute is beneath the office. Say so, and let both of them carry it."
 gh_arcana_lifestyle.0029.e: "Judge the working itself."
 gh_arcana_lifestyle.0029.e.flavor: "You are deep enough to read both arguments on their merits and show each of them precisely where they went wrong."
 gh_arcana_lifestyle.0031.a.flavor: "Safety changes results. That is the point, and your objection."
 gh_arcana_lifestyle.0031.b.flavor: "Bounded, warded, observed, and worth rather less than the uncontrolled version."
 gh_arcana_lifestyle.0031.c.flavor: "Back onto the shelf with the others, where it has been perfectly safe for years."
 gh_arcana_lifestyle.0032.a.flavor: "Research can take decades and the coinage never comes back."
 gh_arcana_lifestyle.0032.b.flavor: "Narrow the scope to something that produces a result inside a human lifetime."
 gh_arcana_lifestyle.0032.c.flavor: "Paused work does not rot. The scholars, unfortunately, do."
 gh_arcana_lifestyle.0033.a.flavor: "You show them yours, they show you theirs, and both minds end the week brighter."
 gh_arcana_lifestyle.0033.b.flavor: "They will be gone in a fortnight and the copying is already done."
 gh_arcana_lifestyle.0033.c.flavor: "Hospitality is one thing. The secrets are another."
 gh_arcana_lifestyle.0034.a.flavor: "Announce it and it becomes a fact about you that everyone else has to arrange themselves around."
 gh_arcana_lifestyle.0034.b.flavor: "Keep this private, where it might prove advantageous to reveal later."
 gh_arcana_lifestyle.0034.c.flavor: "It can be refused. It cannot be un-had."
 gh_arcana_lifestyle.0038.a.flavor: "A hex laid properly holds for years and is legible to anyone who knows how to look."
 gh_arcana_lifestyle.0038.b.flavor: "Small enough to be bad luck and thought of as nothing at all."
 gh_arcana_lifestyle.0038.c.flavor: "Doing nothing is not the same as forgiving, and it costs considerably less."
 gh_arcana_lifestyle.0039.a.flavor: "Stone, guards, distance, and the rota. Scry them all and something in the pattern will be weak."
 gh_arcana_lifestyle.0039.c.flavor: "What you have left is what you will have when it matters."
 gh_arcana_lifestyle.0040.a.flavor: "It will land in their line and it will not ask who deserved it."
 gh_arcana_lifestyle.0040.b.flavor: "Nothing spectacular. Only your own soldiers, standing when they would have fallen."
 gh_arcana_lifestyle.0040.c.flavor: "A caster who has not spent anything is a caster the enemy still has to plan around."
 gh_arcana_lifestyle.0041.a.flavor: "The fever is changing you. Following it means choosing to be changed on purpose."
 gh_arcana_lifestyle.0041.b.flavor: "Burn it out before it settles into a shape."
 gh_arcana_lifestyle.0041.c.flavor: "Fevers break. Most of them break the way they were always going to."
 gh_arcana_lifestyle.0027.d.flavor: "Theft is theft, and a hall that watches a thief walk unpunished will assume your secrets are open."
 gh_arcana_lifestyle.0034.d.flavor: "You have read every word ever written about the Art and cast none of it. There is a tradition in your culture with a door you have not knocked."
 gh_arcana_lifestyle.0002.d.flavor: "You have put down things with more teeth than this."
 gh_arcana_lifestyle.0005.d.flavor: "A scorched hall is not a lesson badly learned, it is a hazard walking around wearing your livery."
 gh_arcana_lifestyle.0006.e.flavor: "Every resonance is a note somebody else is holding. Hold a better one."

#  Duel styles: what each caster opens with, by aspect 
 gh_duel_style_fire: "a hand already too bright to look at directly"
 gh_duel_style_water: "a slow, deliberate gathering of every drop of moisture in the hall"
 gh_duel_style_ice: "the air between them going hard and white"
 gh_duel_style_air: "a pressure building in the room with nowhere to go"
 gh_duel_style_stone: "a floor beginning to remember that it was once a mountain"
 gh_duel_style_dream: "a door held open onto whatever the other one is most afraid of"
 gh_duel_style_celestial: "a light from considerably further away than the ceiling"
 gh_duel_style_dark: "every lamp in the hall guttering at once, on request"
 gh_duel_style_light: "a brightness with an edge ground onto it"
 gh_duel_style_blood: "an awareness of every heartbeat in the room, and of one in particular"
 gh_duel_style_nature: "the rushes on the floor stirring as though there were a wind indoors"
 gh_duel_style_ethereal: "a thinning of the air where something on the other side has begun paying attention"
 gh_duel_style_hymns: "one held note that the walls take up and decline to put down"
 gh_duel_style_death: "the particular cold that arrives just before something stops"
 gh_duel_style_sand: "a dry hiss of grit that was not on the flagstones a moment ago"
 gh_duel_style_metal: "every buckle, blade and hinge in the hall turning very slightly"
 gh_duel_style_time: "a half-second that arrives twice"
 gh_duel_style_dawn: "the grey certainty of a morning nobody asked for"
 gh_duel_style_generic: "raw force, badly shaped, and enough of it to be going on with"

