 gh_arcana_lifestyle.0006.e.success: "The house takes your note and holds it"
 gh_arcana_lifestyle.0006.e.failure: "The house takes your note and will not give it back"
 gh_arcana_lifestyle.0007.win: "You are the better hand, and the hall watches you prove it"
 gh_arcana_lifestyle.0007.loss: "You are not, and the hall watches you find out"
 gh_arcana_lifestyle.0009.d.win: "They came at you as an equal and left knowing they were not"
 gh_arcana_lifestyle.0009.d.loss: "They came at you as an equal and left having been right"
 gh_arcana_lifestyle.0001.a.read: "You read the stall true"
 gh_arcana_lifestyle.0001.a.partial: "You didn't read enough to argue"
 gh_arcana_lifestyle.0001.a.taken: "The Sight gives you nothing you can interpret, and the peddler waits politely while you pay for it"

