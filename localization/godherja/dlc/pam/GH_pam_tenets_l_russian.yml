 tenet_dulia_aagiokrata_desc:0 "Подобно тому как Чистейший восседал на небесном престоле в [Concept('first_empire','Первом Городе')|E], Воплощённые царствуют с престола [Glossary('Аутократы','GH_AAUTOKRATA_GLOSS')]. Почитайте их, ибо на их плечах покоится судьба человечества."
 tenet_dulia_aagiokrata_historical_desc:0 "Среди множества верований [Concept('aversaria','Аверсарии')|E], объединённых [Concept('aversarinas_aagiokratia','Аагиократой')|E], лишь аутократир занимает вершину почитания, уступая одному только Чистейшему. Этот культ в равной мере политический и духовный: он служит опорой законности имперского порядка и связывает [Concept('first_empire','Первый Город')|E] с [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier|l]. Судьбы отдельных культов аутократиров столь же переменчивы, сколь судьбы обожествлённых ими правителей, а притязания на божественность зачастую зависят скорее от верности знати, нежели от благоговения перед святынями."
 tenet_dulia_aagiokrata_historical_glossary:0 "[Glossary('$tenet_dulia_aagiokrata_name|q$','tenet_dulia_aagiokrata_historical_desc')]"
 tenet_dulia_aagiokrata_name:0 "Аутократолатера"
 tenet_dulia_lifepath_desc:0 "Следовать Путями — священное дело, но святее всех те, кто достиг с ними единства. Подражайте их добродетелям и деяниям, и пусть их духи ведут вас всё дальше."
 tenet_dulia_lifepath_historical_desc:0 "Хотя почитание $lifepath_saint$ как религиозная практика, по всей видимости, древнее самой [GetReligionByKey('lifepath_religion').GetName] и, вероятно, восходит к старинным верованиям [GetFaithByKey('starvayrd').GetName|V], лишь Ормский собор 242 года ИС утвердил его в качестве официального церковного учения тогдашнего конклава Обриэста. Согласно традиционному толкованию духовенства, звания $lifepath_saint$ удостаиваются добродетельные путники, ставшие образцами своих избранных Путей и достигшие совершенного единства с ними.\n\nВ действительности же на протяжении истории священнослужители порой даровали это звание за услуги, денежные подношения или прощение долгов, в знак извинения, в качестве подарка ко дню рождения, во время редких проблесков рассудка после долгой болезни или заключения, а иногда и вовсе без объяснения причин."
 tenet_dulia_lifepath_historical_glossary:0 "[Glossary('$tenet_dulia_lifepath_name|q$','tenet_dulia_lifepath_historical_desc')]"
 tenet_dulia_lifepath_name:0 "Симюлери Вейсан"
 tenet_dulia_salacad_desc:0 "Блаженны те, кто покинул проклятую землю и вступил в небесное воинство Лазурной Матери, ибо велика их слава. Смешай их кровь со своею и приобщись к их великолепию через почитание."
 tenet_dulia_salacad_historical_desc:0 "Испытание, необходимое для перехода в загробный мир, — неизменная тема религиозных преданий [GetReligionByKey('salacad_religion').GetName]. Чаще всего умершему предстоит сразиться с одним из [Glossary('#G_light чазанов#!','GH_CZAZANAD_GLOSS')], хотя встречаются и другие состязания, в том числе проверка смекалки или хитрости. Исход такого обряда перехода обычно определяют посредством гадания вскоре после смерти человека. Если покойного признают победителем, принято испить каплю его крови, чтобы разделить хотя бы толику его силы."
 tenet_dulia_salacad_historical_glossary:0 "[Glossary('$tenet_dulia_salacad_name|q$','tenet_dulia_salacad_historical_desc')]"
 tenet_dulia_salacad_name:0 "Орай Чазанэр"
