l_russian:
 ##Character Generic
 legend_blood_of_the_giants: "Кровь великанов"
 legend_blood_of_the_giants_desc: "В незапамятные времена, когда великаны, как говорят, обладали собственной цивилизацией, они, по слухам, иногда заключали браки с людьми. Хотя минули эпохи, их кровь до сих пор может течь в некоторых."
 legend_anesimasios: "Кровь Анесимасия"
 legend_anesimasios_desc: "[ancestor.GetTitledFirstName|U] взял бразды правления рушащейся империей и попытался бороться с течениями истории; увы, он был взят из этого мира, не завершив своего великого замысла."
 legend_theyssia: "Золотая кровь Тейссии"
 legend_theyssia_desc: "Из пепла и руин [ancestor.GetTitledFirstName|U] воздвиг блистательную империю из мрамора и золота. За её полуторавековое правление целые поколения рождались, старели и умирали, зная лишь процветание и мир."
 legend_tayberl: "Наследник Тайберлов"
 legend_tayberl_desc: "Давным-давно короли Тайберлов правили одним из немногих государств, объединивших все южные кланы сьялволков. Хотя их правление, возможно, было недолгим, оно оставило свой след в подданных."
 legend_coc_melani: "Героическое наследие Мелани Иллурдиан"
 legend_coc_melani_desc: "Одна из трёх спутников [Conceot('champion_of_chevalie','Героя Шевалье')|E], [ancestor.GetFirstName|U] потеряла, а затем отвоевала своё королевство у вероломного [rival.GetFirstName|U] из Ви, чтобы после поражения [Concept('silas_stavro','Силаса Ставро')|E] отречься от престола и провести остаток жизни в странствиях по [Concept('aeras','Эрасу')|E]."
 legend_coc_raven: "Героическое наследие Рейвена ден ва Понтаже"
 legend_coc_raven_desc: "Один из трёх спутников [Conceot('champion_of_chevalie','Героя Шевалье')|E], [ancestor.GetFirstName|U] большую часть жизни странствовал по свету как наёмник, прежде чем вернуться на родину, чтобы сражаться в [Concept('red_river_war','Войне Красной реки')|E]. Он сыграл решающую роль в свержении отца и привлёк королевство Рор на сторону Защитника, а после поражения [Concept('silas_stavro','Силаса Ставро')|E] отрёкся от престола и провёл остаток дней в [Concept('peti_gisredde','Пети-Гисредде')|E]."
 legend_coc_pierre: "Мученическое наследие Пьера Валадека"
 legend_coc_pierre_desc: "Союзник [Conceot('champion_of_chevalie','Героя Шевалье')|E], [ancestor.GetFirstName|U] пал, сдерживая силы [Concept('silas_stavro','Силаса Ставро')|E] в битве при Гранд-Лафадае, выиграв драгоценное время для сил живых, чтобы отступить на запад и организовать последнюю оборону в [Concept('peti_gisredde','Пети-Гисредде')|E]."
 legend_coc_gofrei: "Героическое наследие Гофрея Монто"
 legend_coc_gofrei_desc: "Единственный из первоначальных королей эпохи [Concept('anarchy_of_the_five_crowns','Анархии пяти корон')|E], ещё живой во время [Concept('red_river_war','Войне Красной реки')|E], [ancestor.GetFirstName|U] попытался сплотить остальное [chevalie|E] против [Concept('silas_stavro','Силаса Ставро')|E], но был предан Понтаже и пал, лично ведя войско против восставших мертвецов."
 legend_valden: "Наследие верховного короля Вальдена"
 legend_valden_desc: "Столкнувшись с вторжением ужасного [Concept('liches','лича')|E] [GetGlobalVariable('gh_doc_milon_var').Char.GetFullNameNicknamed], [ancestor.GetFirstName|U] явил себя истинным государем, лично сразив в бою чудовище, угрожавшее его царству."
 legend_wayfather_peyton: "Святая кровь Путевого отца Пейтона"
 legend_wayfather_peyton_desc: "Путевой отец [ancestor.GetFirstName|U] с Пути Жатвы объявил, что ни одна жатва не может быть собран в безопасности, пока нежить ещё «жива», и что костная мука творит чудеса с посевами, а посему лучший способ достичь совершенства на своём Пути — истребление нежити. Пейтон стал легендой благодаря своим вылазкам в [Concept('the_lichdoms','Личества')|E], где он даже сразил [Concept('liches','лича')|E] [lich.GetFullName|U] при штурме его цитадели, потеряв лишь 566 человек из отряда в 570."
 legend_high_king_marcomer: "Наследник верховного короля Предела"
 legend_high_king_marcomer_desc: "Единственный верховный король за пределами [chevalie|E], [ancestor.GetFirstName|U] был поставлен во главе новообразованного государства, столкнувшегося с полной мощью [Concept('aversaria','Аверсарии')|E] — хотя, по слухам, он много раз пытался отказаться от короны и глубоко негодовал на свою роль. Тем не менее, он двадцать лет яростно сопротивлялся аверсарианской экспансии, но в конечном счёте согласился отречься и принести вассальную присягу Аавтократу в обмен на щедрые условия для всех своих бывших подданных."
 legend_aeschraes: "Кровь Создателя миров"
 legend_aeschraes_desc: "[ancestor.GetFirstNameNicknamed|U] в своём великом и ужасном сотворении [selfreplicating_blood_magic|E] стал «Разрушителем миров». В её разрыве [Concept('aversaria','Вторая империя')|E] была сокрушена без возможности восстановления, реальность вскрикнула, а [aeras|E] утонул в морях крови. Всякая легитимность, которой он обладал как сильнейший из живущих [Concept('magi','магов')|E], угасла, и его подорвали новые аверсарианские военачальники. В конце концов изгнанный из Ораисполя после [Concept('the_vilnian_assault','Вилнианского штурма')|E], он был свергнут и считался мёртвым.\n\nКак же они ошибались, и как дорого им это обошлось."
 legend_cenware: "Песнь о Сокрушителе ведьм"
 legend_cenware_desc: "Легендарный воин и вождь, [founder.GetFirstName|U] получил прозвище «Сокрушитель ведьм» за великий набег на [Concept('mayikrata','Майикратию')|E], чьи стены прежде считались неприступными. Бич [Concept('aversaria','Аверсарии')|E] и провозвестник нового мира, скальды будут петь о могучих деяниях Ценвара грядущие века."
 legend_seignon: "Законные короли Шевалье"
 legend_seignon_desc: "Наш предок [ancestor.GetTitledFirstName|U] доказал свою способность объединять разрозненные марки [chevalie|E], а [absentdad.GetFirstName|U] одержал победу над [Concept('black_gold_league','Лигой Чёрного Золота')|E] в [Concept('black_gold_war','Войне Чёрного золота')|E]. Наше право на верховную корону незыблемо, и мы будем доказывать своё право на неё снова и снова!"
 legend_black_sun: "Рождённый под чёрным солнцем"
 legend_black_sun_desc: "В самый тёмный час [Concept('aversaria','Аавтократии')|E] сам [Concept('aersanon','Чистейший')|E] окутал солнце чёрным, чтобы возвестить приход героя: [founder.GetFirstName|U], спасителя Аверсарии. Он твёрдо стоял против [Concept('sjalvolki_migration','варварских орд')|E] и [Concept('chevalie', 'вороватых марочникских военачальников')|E]. Покуда жив его род, Аверсария никогда не падёт по-настоящему."
 legend_iyrossi_kings: "Род последнего ийросского царя"
 legend_iyrossi_kings_desc: "Основатель династии Наренси, [ancestor.GetFirstName], был последним царём народа ийроссов, который отважно сражался за нашу свободу против злой [aversaria|E] и всей их великой магии и людской силы. Благодаря своим [Concept('scusstari_guerilla_warfare', 'хитрым тактикам')|E], он смог нанести захватчикам тяжёлые поражения и заключил сделку. Жизни ийроссов будут пощажены в обмен на наше порабощение и его собственную жизнь в качестве жертвы."
 legend_skull_taker: "Ужасное наследие Собирателя черепов"
 legend_skull_taker_desc: ""
 legend_ogier: "Убийца «Солнцестоящего бича»"
 legend_ogier_desc: ""
 legend_esterax: "Божественное дитя Эшрея и Аксиотеи"
 legend_esterax_desc: "[aversaria|E] не могла бы желать более достойного правителя, чем [founder.GetTitledFirstName], непорочное потомство двух величайших [Concept('magi','магов')|E] в истории! С такой благословенной кровью он, несомненно, предназначенный спаситель [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )]!"
 legend_harthah: "Отец Саррадона"
 legend_harthah_desc: "В долгой и тяжкой [Concept('saints_war','Войне Святых')|E] [founder.GetTitledFirstName|U] был свидетелем угнетения, принесённого агионистскими крестоносцами, и боролся с ним. Объявив народ [sarradon|E] своими детьми, он поклялся освободить их от языческих властителей. Когда его мечта наконец осуществилась, Саррадон стоит крепко, готовый отразить любых захватчиков."
 legend_earthshaker: "Мощь Землетряса"
 legend_earthshaker_desc: ""
 legend_naklan: "Золотая кровь Возвращённого"
 legend_naklan_desc: "Легендарный [ancestor.GetTitledFirstName|U], МногоСын, Чёрное Копьё, Тот-Кто-Запряг-Звёзды, считался величайшим вождём нашего народа. Как его второе пришествие, я должен не только соответствовать его имени, но и превзойти его."
 legend_daya: "Наследие Терновой королевы"
 legend_daya_desc: "В далёком прошлом [ancestor.GetTitledFirstName|U], Терновая королева, была лишена своей судьбы из-за козней мужчин. Я должен приложить все усилия, чтобы исправить эту несправедливость и доказать превосходство нашего народа."
 legend_dawas: "Род Звёздорожденных"
 legend_dawas_desc: ""
 legend_utyal: "Кровь первого оракула"
 legend_utyal_desc: ""
 legend_mutsar: "Титановая кровь"
 legend_mutsar_desc: ""
 legend_gwasil: "Кровь налётчика Тёмного неба"
 legend_gwasil_desc: ""
 legend_nonn: "Наследие Забытых"
 legend_nonn_desc: ""
 legend_morimal: "Рождённый призраками"
 legend_morimal_desc: ""
 legend_akhtar: "Происхождение звёздных бастардов"
 legend_akhtar_desc: ""
 legend_victorious_cois: "Койс Победоносный"
 legend_victorious_cois_desc: "Хотя [winner.GetFirstName|U] доказал, что он не просто марионетка, когда великий Имперрех [loser.GetFirstNameNicknamed|U] потерпел неудачу в первом походе в сердце [Concept('aversaria','Аверсарии')|E], его вторая победа и разгром коалиции вписали его имя в анналы истории. Его великий подвиг укрепил веру в идею полностью возрождённой [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )]."
 legend_last_aautokratir: "Наследники последнего Аавтократора"
 legend_last_aautokratir_desc: "[defender.GetFirstName|U] сотворил чудо, отразив вторжение [attacker.GetFirstNameNicknamed|U] в Этепезею, но дрогнул, когда Ценвар удвоил усилия. Последний истинный Аавтократор Запада погиб, зажатый в долине, но его мечты живут в его изгнанных наследниках."
 legend_narses: "Мститель Элизии"
 legend_narses_desc: "В кровавой бане Элизии считалось, что остатки мощи [Concept('aversaria','Аверсарии')|E] разбиты вдребезги, а выжившие не знали, можно ли остановить сьялвольскую орду. Однако [winner.GetFirstName|U] выстоял и в конце концов отомстил за павшие легионы Элизии и остановил [loser.GetFirstNameNicknamed|U] Южный поход."
 legend_hecaeda_aironoi: "Новая восточная Аавтократия"
 legend_hecaeda_aironoi_desc: ""
 legend_hecaeda_liberator: "Справедливое наследие Освободительницы"
 legend_hecaeda_liberator_desc: "Великая [founder.GetTitledFirstName] положила конец древней несправедливости и освободила рабов [Concept('aironoi','Айроноя')|E]. Мы навсегда запомним, как она проложила путь к более справедливой [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )]."
 legend_hecaeda_reformed: "Праведная кровь Реформатора"
 legend_hecaeda_reformed_desc: "Солнце засияло ярче в тот день, когда [founder.GetTitledFirstName] реформировала [Concept('aagiokrata','Аагиократию')|E]. Она научила нас, что человечеству не нужна бессмысленная жестокость, чтобы оставаться сильным."
 legend_nicky_voreias: "Неа Аавтократия"
 legend_nicky_voreias_desc: ""
 legend_nicky_reformed: "Возрождённый Чистейший"
 legend_nicky_reformed_desc: ""
 legend_gatecrasher: "Бич Адабисса"
 legend_gatecrasher_desc: ""
 legend_not_lelmand_beaten: "Адабисс побеждён"
 legend_not_lelmand_beaten_desc: "[winner.GetFirstNameNicknamed] разбил великие армии [loser.GetFirstName], спасая [Concept('damota','Дамоту')|E] от ига Адабисса. Истинный триумф над врагами, значительно превосходившими нас технологически, [winner.GetFirstNameNoTooltip] вписал своё имя в анналы истории."
 legend_lelmand_beaten: "Колосс повержен"
 legend_lelmand_beaten_desc: "Вопреки всему, [winner.GetFirstNameNicknamed] отразил огромные армии [GetTrait('adabyss_invasion_leader').GetName( loser )] [loser.GetFirstName], спасая наш народ, а возможно, и весь [sarradon|E], от рабства и подчинения. С падением могучих летающих крепостей Адабисса и сокрушением ужасных боевых големов мы навечно в долгу перед родом [winner.GetHerHis]."
 legend_fog_beaten: "Погибель Элхьоёров"
 legend_fog_beaten_desc: ""
 legend_lich_slayer_necropolis: "Убийца лича [loser.GetFirstNameNicknamedNoTooltip]"
 legend_lich_slayer_necropolis_desc: "В легендарной дуэли насмерть [winner.GetFirstName|U] сразил ужасного [Concept('liches','лича')|E] [loser.GetFirstNameNicknamed] в его логове в [location.GetName|U]. Разграбив тёмный некрополь и забрав его сокровища, [winner.GetFirstNameNoTooltip|U] вернулся домой под героические приветствия, зная, что одним повелителем нежити, угрожающим царствам живых, стало меньше."
 legend_lich_slayer_border: "Стойкость против лича [loser.GetFirstNameNicknamedNoTooltip]"
 legend_lich_slayer_border_desc: "Во время набега на [location.GetName|U] со стороны гнусного [Concept('liches','лича')|E] [loser.GetFirstNameNicknamed], [winner.GetFirstName|U] совершил свой героический подвиг, отразив мерзость и её армию нежити. Земли [winner.GetHerHis] защищены, тосты за имя [winner.GetFirstNamePossessiveNoTooltip] звучали в каждой таверне."
 legend_restored_aversaria: "Третья империя Чистейшего"
 legend_restored_aversaria_desc: "Подобно тому, как [Culture('aelarvisian', 'древние')|E] восстановили царство [Concept('aelfir', 'Первых людей')|E], так и [founder.GetTitledFirstName] восстановил царство древних. Своей мощью [founder.GetSheHe] доказал, что человечество может сгибаться, но никогда не сломается."
 legend_successor_aautokrata: "Империя, восставшая из кровавого пепла"
 legend_oraispol_aautokrata_desc: ""
 legend_asiupoli_aautokrata_desc: ""
 legend_stellios_aautokrata_desc: ""
 legend_restored_aversarian_province: "Восстановление провинции [title.GetNameNoToolstip]"
 legend_restored_aversarian_province_desc: ""
 legend_viesuados_restored: "Истинные наследники Виесуадоса"
 legend_viesuados_restored_desc: ""
 legend_chevalie_uniter_generic: "Объединитель Марок"
 legend_chevalie_uniter_generic_desc: ""
 legend_chevalie_uniter_mathilde_desc: ""
 legend_marcher_amsar: "Покорение Амсара"
 legend_marcher_amsar_desc: ""
 legend_amsar_shattered_reforged: ""
 legend_amsar_shattered_reforged_desc: ""
 legend_amsar_obliterated_reforged: ""
 legend_amsar_obliterated_reforged_desc: "" 
 legend_skycrown: "Новое королевство в облаках"
 legend_skycrown_desc: ""
 legend_huegodoc_kingdom: "Основание [title.GetNameNoToolstip]"
 legend_heurgordica_desc: ""
 legend_dathothica_desc: ""
 legend_rithogedica_desc: ""
 legend_mountain_home: ""
 legend_mountain_home_desc: ""
 legend_malaak: "Аватар Охрасика"
 legend_malaak_desc: ""
 legend_shanisu_hubarin: "Шамса над Саррадоном вновь"
 legend_shanisu_hubarin_desc: ""
 legend_mountain_sun: "Заря нового конкордата"
 legend_mountain_sun_desc: "Среди религиозных и политических потрясений сьялволков в Войнах Южного обряда [struggle_ender.GetFirstNameNicknamed] вернул законную опахасийскую землю и положил конец мелким распрям [struggle_ender.GetHerHis] захватчиков. В этом новом мире без [Concept('aversaria','Аверсарии')|E] [struggle_ender.GetFirstNamePossessiveNoTooltip] предстоит создать новую опахасийскую идентичность, возвращаясь к дням до империи, когда [GetBuilding('01_vounill').GetName] был средоточием власти и веры в регионе."
 legend_new_mamuramat: "Учреждение [title.GetNameNoTooltip]"
