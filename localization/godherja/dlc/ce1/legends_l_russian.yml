 legend_kash_east_desc: ""
 legend_taryaad: ""
 legend_taryaad_desc: ""
 legend_riverlands_kingdom: "[title.GetNameNoTooltip] восходит"
 legend_riverlands_kingdom_desc: "[founder.GetName] благодаря своей политической хитрости и управленческим талантам возвысил Речные земли до нового королевства, соперничающего с историческими де-юре землями [chevalie|E]."