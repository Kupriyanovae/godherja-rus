l_russian:
 bp1_house_feud.0010.searing:90 "Волны тупой боли обрушиваются на мое сознание, пока моя обожженная голова горит как в аду. Этот жар, этот огонь, моя ненависть, стыд и гнев — [house_feud_attacker.GetTitledFirstName] #EMP заплатит#!.\n"
 bp1_house_feud.0011.searing:90 "Новость о выжигании [Select_CString(house_feud_victim.IsFemale, 'моей', 'моего')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))], [house_feud_victim.GetFirstName], витает при дворе.\n\n"
 house_feud_searing:90 "выжигание"