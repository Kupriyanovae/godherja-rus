 commandry_tax_collector: "Коммандория"
 commandry_tax_collector_desc: "#emphasis #bold Привилегии [Concept('vassal','вассала')|E]:#!#!\n[Concept('vassal','Вассал')|E] может использовать завоевательные [Concept('casus_bellis','поводы для войны')|E].\n\n#flavor $game_concept_vassal$ получает особое право завоевания соседних земель, независимо от [Concept('crown_authority','авторитета короны')|E] или [Concept('clique_authority','власти клики')|E] [Concept('liege','сюзерена')|E].#!"
 commandry_tax_collector_flavor_desc: "В обмен на сокращение числа рекрутов, члены этого Ордена взимают высокие налоги с местного населения."
 trade_rights_special_tax_collector: "Торговые права"
 trade_rights_special_tax_collector_flavor_desc: "Этому [Concept('vassal','вассалу')|E] предоставлены особые торговые права для поставки лучших товаров с уменьшенными тарифами."
 exploitative_tax_collector: "Эксплуатация"
 exploitative_tax_collector_flavor_desc: "Этот [Concept('vassal','вассал')|E] получил указание извлекать как можно больше выгоды из земель и их населения."
 inquisitive_special_rights_tax_collector: "Инквизиторские начинания"
 inquisitive_special_rights_tax_collector_flavor_desc: "Хотя с местных жителей берется меньше, больше усилий направлено на образование и развитие населения в правильных путях веры."

