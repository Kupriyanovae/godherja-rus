 first_loot_tax_collector_flavor_desc: "В обмен на сниженные налоги и рекрутский набор сей [Concept('vassal','вассал')|E] должен оборонять и расширять земли."
 raw_deal_tax_collector: "Грабительская сделка"
 raw_deal_tax_collector_flavor_desc: "Сей [Concept('vassal','вассал')|E] обязан платить непомерные налоги и сгонять множество местных жителей на работы или в рекруты, к великой их досаде."
