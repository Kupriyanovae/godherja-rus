 convert_to_otachedian_desc: "Вы #bold не#! выполняете по крайней мере одно из следующих условий:\n$EFFECT_LIST_BULLET$[Concept('top_liege_possessive','Вашего верховного сюзерена')|E] [Concept('government','форма правления')|E] — [GetGovernment('otachedian_government').GetName]\n$EFFECT_LIST_BULLET$Ваша [Concept('culture','культура')|E] обладает [GetCultureTradition('tradition_otachedian_law').GetName]"
