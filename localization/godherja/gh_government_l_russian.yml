 burgher_tax_collector: "Бюргерские сборщики"
 burgher_tax_collector_desc: "#emphasis #bold Привилегии [Concept('vassal','вассала')|E]:#!#!\n[Concept('liege','Сюзерен')|E] не может отнять у [Concept('vassals_possessive','вассалов')|E] их [Concept('titles','титулы')|E]\n\n#flavor [Concept('vassal','Вассалу')|E] гарантируется владение его [Concept('titles','титулами')|E], что не позволяет [Concept('liege','сюзерену')|E] отобрать их, даже если у него есть на то [Concept('revoke_title_reason','повод')|E] или нет.#!"
 burgher_tax_collector_flavor_desc: "Народ сего града ставит торговлю и промыслы превыше всего и не жалеет трудов ради сохранения своих вольностей."
 plantation_tax_collector: "Плантационные права"
 plantation_tax_collector_flavor_desc: "Требования: [Concept('vassal','Вассал')|E] должен владеть определённой долей земель с [Concept('terrain','местностью')|E] «Пашни» или «Поймы»."
 mining_tax_collector: "Горные права"
 mining_tax_collector_flavor_desc: "Требования: [Concept('vassal','Вассал')|E] должен владеть определённой долей земель с богатыми ископаемыми [Concept('terrain','местностями')|E], такими как горы или холмы."
 autonomy_special_rights_tax_collector: "Автономия"
 autonomy_special_rights_tax_collector_desc: "#emphasis #bold Привилегии [Concept('vassal','вассала')|E]:#!#!\n[Concept('liege','Сюзерен')|E] не может [Concept('demand_conversion','требовать обращения')|E] [Concept('vassal','вассала')|E]\n[Concept('liege','Сюзерен')|E] не может [Concept('convert_county','обращать графства')|E] в землях [Concept('vassals','вассалов')|E]\n[Concept('liege','Сюзерен')|E] не может использовать различия в [Concept('faith','конфессии')|E], чтобы избежать получения [Concept('tyranny','тирании')|E] при отъеме титулов\n[Concept('liege','Сюзерен')|E] не может отнять у [Concept('vassals_possessive','вассалов')|E] их [Concept('titles','титулы')|E]\n\n#flavor [Concept('vassal','Вассалу')|E] гарантируется владение его [Concept('titles','титулами')|E], что не позволяет [Concept('liege','сюзерену')|E] отобрать их, даже если у него есть на то [Concept('revoke_title_reason','повод')|E] или нет.\n[Concept('vassal','Вассалу')|E] также дарован особый защищённый статус, и держава официально признаёт его право исповедовать свою [Concept('faith','конфессию')|E].#!"
 autonomy_special_rights_tax_collector_flavor_desc: "Сим городам дарована ещё большая власть над своими делами в обмен на более крупные и долгосрочные полки рекрутов."
 march_special_rights_tax_collector: "Марка"
 march_special_rights_tax_collector_desc: "#emphasis #bold Привилегии [Concept('vassal','вассала')|E]:#!#!\n[Concept('liege','Сюзерен')|E] не может отнять у [Concept('vassals_possessive','вассалов')|E] их [Concept('titles','титулы')|E]\n[Concept('vassal','Вассал')|E] может использовать [Concept('casus_bellis','казус белли')|E] «Завоевание».\n\n#flavor [Concept('vassal','Вассалу')|E] гарантируется владение его [Concept('titles','титулами')|E], что не позволяет [Concept('liege','сюзерену')|E] отобрать их, даже если у него есть на то [Concept('revoke_title_reason','повод')|E] или нет.\n[Concept('vassal','Вассалу')|E] также даровано особое право завоёвывать соседние земли вне зависимости от [Concept('crown_authority','авторитета короны')|E] или [Concept('clique_authority','авторитета клики')|E] его [Concept('liege','сюзерена')|E].#!"
 march_special_rights_tax_collector_flavor_desc: "[Concept('vassal','Вассалу')|E] дарованы сниженные налоги и ополчение в обмен на охрану и укрепление сего пограничья."
 privateer_special_rights_tax_collector: "Каперские права"
 privateer_special_rights_tax_collector_desc: "#emphasis #bold Привилегии [Concept('vassal','вассала')|E]:#!#!\n[Concept('liege','Сюзерен')|E] не может отнять у [Concept('vassals_possessive','вассалов')|E] их [Concept('titles','титулы')|E]\n[Concept('vassal','Вассал')|E] может использовать [Concept('casus_bellis','казус белли')|E] «Завоевание».\n\n#flavor [Concept('vassal','Вассалу')|E] гарантируется владение его [Concept('titles','титулами')|E], что не позволяет [Concept('liege','сюзерену')|E] отобрать их, даже если у него есть на то [Concept('revoke_title_reason','повод')|E] или нет.\n[Concept('vassal','Вассалу')|E] также даровано особое право завоёвывать соседние земли вне зависимости от [Concept('crown_authority','авторитета короны')|E] или [Concept('clique_authority','авторитета клики')|E] его [Concept('liege','сюзерена')|E].#!"
 privateer_special_rights_tax_collector_flavor_desc: "[Concept('vassal','Вассалу')|E] даровано право набегов на суда, не принадлежащие его сюзерену."

