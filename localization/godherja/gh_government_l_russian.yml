l_russian:

 magocratic_government: "Магократия"
 magocratic_government_with_icon: "@government_type_magocracy! Магократия"
 magocratic_government_desc: "\n$game_concept_magocracy_desc$\n\n#F Магократия — это земли, коими правит единственный [Concept('magi','маг')|E]. Сей [Concept('magi','маг')|E] правит подобно аристократическому владыке, но с той лишь разницей, что государственный аппарат выстроен так, что правителем по праву может быть лишь [Concept('magi','маг')|E]. Из сего проистекает система, сродни феодальной, где всякое чадо, не одарённое магией, почитается лишённым права на престол."
 magocratic_government_adjective: "Магократическ"
 magocratic_government_realm: "Магократическая держава"
 magocratic_government_vassals_label: "Магократические [Concept('obligations','обязательства')|E] определяются [Concept('vassal_contract','вассальным договором')|E] каждого [Concept('vassal','вассала')|E]"
 liege_magic_level_desc: "Ваш [Concept('magic','магический')|E] [Concept('trait','дар')|E] — [liege.Custom('MagicTraitLevel')]"
 nothing_no_magical_ability: "ничем, вы не обладаете магическими способностями"

 magocratic_republic: "Магократическая республика"
 magocratic_republic_with_icon: ""
 magocratic_republic_desc: "\n$game_concept_magocratic_republic_desc$\n\n#F Магократические республики схожи с обычной магократией, но правитель в них не династический самодержец, а избранник, коего выбирают из числа могущественных [Concept('magi','магов')|E] сего края."
 magocratic_republic_adjective: "Магократическ"
 magocratic_republic_realm: "Магократическая республика"
 magocratic_republic_vassals_label: "Обязательства в магократической республике подобны таковым в республике: чем выше [Concept('opinion','мнение')|E], тем больше вклад."
 magocratic_republic_house_attribute_flavor_name: "[powerful_family_attribute|E]"
 magocratic_republic_house_attribute_flavor_name_no_tooltip: "$game_concept_powerful_family_attribute$"

 peasant_republic: "Крестьянская республика"
 peasant_republic_with_icon: "@government_type_peasant_republic! Крестьянская республика"
 peasant_republic_desc: "\n$game_concept_peasant_republic_desc$\n\n#F Крестьянские республики — это вольные «государства» с рыхлой демократией, полностью подчинённые воле местного крестьянства. Они часто возникают в смутные времена, но редко живут долго из-за угрозы, кою они несут для устоявшихся устоев власти."
 peasant_republic_adjective: "Крестьянск"
 peasant_republic_realm: "Крестьянские общины"
 peasant_republic_vassals_label: "Обязательства в крестьянских республиках едины для всех республиканских [Concept('vassals','вассалов')|E]"
 peasant_republic_house_attribute_flavor_name: "[powerful_family_attribute|E]"
 peasant_republic_house_attribute_flavor_name_no_tooltip: "$game_concept_powerful_family_attribute$"

 republic_playable_government: "Республика"
 republic_playable_government_with_icon: "@government_type_republic! $republic_playable_government$"
 republic_playable_government_adjective: "Республиканск"
 republic_playable_government_realm: "Республика"
 republic_playable_government_desc: "\n$game_concept_republic_desc$\n\n#F Городами правят привилегированные зажиточные горожане, которые выбирают из своих кругов мэра. Несмотря на значительное влияние, мэр должен сохранять всеобщее уважение, чтобы не покинуть пост по окончании срока.#!"
 republic_playable_government_vassals_label: "Республиканские [Concept('obligations','обязательства')|E] едины для всех республиканских [Concept('vassals','вассалов')|E] и могут меняться в зависимости от [Concept('opinion','мнения')|E]"
 republic_playable_government_obligations: "Республиканские обязательства"
 republic_playable_government_house_attribute_flavor_name: "[powerful_family_attribute|E]"
 republic_playable_government_house_attribute_flavor_name_no_tooltip: "$game_concept_powerful_family_attribute$"

 judicial_republic_government: "Судебная республика"
 judicial_republic_government_with_icon: "@government_type_judicial_republic! $judicial_republic_government$"
 judicial_republic_government_realm: "Судебная республика"
 judicial_republic_government_desc: "\n$game_concept_republic_desc$\n\n#F Городами управляет судейское сословие, кое ведает торговлей и повседневными делами. Один из них избирается верховным судьёй. Хотя верховный судья обладает немалой властью, она зыбко держится на его судейском авторитете.#!"
 judicial_republic_government_adjective: "Судебно-республиканск"
 judicial_republic_government_vassals_label: "Республиканские [Concept('obligations','обязательства')|E] едины для всех республиканских [Concept('vassals','вассалов')|E] и могут меняться в зависимости от [Concept('opinion','мнения')|E]"
 judicial_republic_government_house_attribute_flavor_name: "[powerful_family_attribute|E]"
 judicial_republic_government_house_attribute_flavor_name_no_tooltip: "$game_concept_powerful_family_attribute$"

 administrative_republic_playable_government: "Великая республика"
 administrative_republic_playable_government_with_icon: "@government_type_administrative_republic! $republic_playable_government$"
 administrative_republic_playable_government_adjective: "Великореспубликанск"
 administrative_republic_playable_government_realm: "Великая республика"
 administrative_republic_playable_government_desc: "\n$game_concept_administrative_republic_desc$\n\n#F Республика, переросшая свой первоначальный город и ныне управляющая целой державой. Система откупа налогов и административных должностей определяет повседневную жизнь и политику."
 administrative_republic_playable_government_vassals_label: "Республиканские [Concept('obligations','обязательства')|E] едины для всех республиканских [Concept('vassals','вассалов')|E] и могут меняться в зависимости от [Concept('opinion','мнения')|E]"
 administrative_republic_playable_government_obligations: "Республиканские обязательства"
 administrative_republic_playable_government_house_attribute_flavor_name: "Магистратские дома"
 administrative_republic_playable_government_house_attribute_flavor_name_no_tooltip: "Магистратские дома"

 landed_order_government: "Владетельный орден"
 landed_order_government_with_icon: "@government_type_landed_order! $landed_order_government$"
 landed_order_government_realm: "Владетельный орден"
 landed_order_government_desc: "\n$game_concept_landed_order_desc$\n\n#F Сей святой орден осел на землях и принял обличье, более схожее с аристократической державой. Пусть по имени и убранству он остаётся святым, и, быть может, в некоторых своих правленческих функциях, братия сего капитула во многом действует как выборная монархия.#!"
 landed_order_government_adjective: "Владетельно-орденск"
 landed_order_government_vassals_label: "Обязательства орденских [Concept('vassals','вассалов')|E] зависят от [Concept('opinion','мнения')|E]"
 landed_order_government_house_attribute_flavor_name: "[powerful_family_attribute|E]"
 landed_order_government_house_attribute_flavor_name_no_tooltip: "$game_concept_powerful_family_attribute$"

 military_unit_government: "Военный отряд"
 military_unit_government_with_icon: "@government_type_military_unit! Военный отряд"
 military_unit_government_realm: "Военный отряд"
 military_unit_government_desc: "\n$game_concept_military_unit_desc$\n\n#F Остатки [Concept('aversaria','аверсарианской')|E] военной силы, оставшиеся после падения Империи. Будь то аверсарианский легион, выкроивший себе удел, или остатки военных рубежей Аверсарии, ныне сей отряд воюет по большей части за себя.#!"
 military_unit_government_adjective: "Военн"
 military_unit_government_vassals_label: "Военные [Concept('obligations','обязательства')|E] определяются @prestige_icon![Concept('prestige','престижем')|E] [Concept('liege','сюзерена')|E]"
 military_unit_government_house_attribute_flavor_name: "[powerful_family_attribute|E]"
 military_unit_government_house_attribute_flavor_name_no_tooltip: "$game_concept_powerful_family_attribute$"

 pirate_government: "Пират"
 pirate_government_with_icon: "@government_type_mercenary! $pirate_government$"
 pirate_government_adjective: "Пиратск"
 pirate_government_realm: "Пиратская держава"
 pirate_government_desc: "\n$game_concept_pirate_desc$\n\n#F Пираты редко соблюдают какой-либо кодекс, кроме одного — сильнейший и хитрейший правит. Любой муж или жена, обладающие стальным сердцем и острым умом, могут взобраться на вершину по горе поверженных врагов, если приложат к тому старание.#!"
 pirate_government_vassals_label: "Пиратские [Concept('obligations','обязательства')|E] зависят от того, насколько [Concept('vassals','вассалы')|E] страшатся своего [Concept('liege','сюзерена')|E], и от их общего [Concept('opinion','мнения')|E] о нём"

 administrative_bureaucracy_government: "Административная бюрократия"
 administrative_bureaucracy_government_with_icon: ""
 administrative_bureaucracy_government_adjective: "Бюрократическ"
 administrative_bureaucracy_government_realm: "Административная бюрократия"
 administrative_bureaucracy_government_desc: "\nМогучая империя Адабисс — обитель, быть может, самого централизованного государства на [Concept('aeras','Эрасе')|E], где сильный император и жреческое сословие правят обширными землями со всем тщанием, используя передовые знания для организации колоссальных строек и содержания гигантских, единообразных армий.\n\n#N Бюрократические державы пока что недоступны для игры!#!"
 administrative_bureaucracy_government_vassals_label: "Обязательства административной бюрократии регулируются сложной бюрократической системой налогообложения"
 administrative_bureaucracy_government_house_attribute_flavor_name: "[powerful_family_attribute|E]"
 administrative_bureaucracy_government_house_attribute_flavor_name_no_tooltip: "$game_concept_powerful_family_attribute$"

 migratory_government: "Переселенческий"
 migratory_government_with_icon: "@government_type_adventurer! $migratory_government$"
 migratory_government_adjective: "Переселенческ"
 migratory_government_realm: "Переселенческая держава"
 migratory_government_desc: "\nПереселенческие державы либо не имеют родины, либо кочуют между несколькими. Кочевники [Concept('aeras','Эраса')|E] — от пустынных кланов до бродячих отрядов искателей приключений и [Concept('fogeaters','обезумевших бывших людей')|E]. Переселенческие державы не следует путать с большими группами, совершающими [Concept('sjalvolki_migration','Великие переселения')|E] после катастрофических событий [Concept('frodbrokna','Фродброкны')|E].\n\n#N Играбельные переселенческие державы появятся вскоре!#!"
 migratory_government_vassals_label: "Переселенческие [Concept('obligations','обязательства')|E] зависят от [Concept('opinion','мнения')|E]"

 lichdom_government: "Личество"
 lichdom_government_with_icon: "@government_type_lichdom! Личество"
 lichdom_government_realm: "Личество"
 lichdom_government_desc: "\nУправляемая личом, сия держава состоит из одной лишь нежити, бездумно марширующей под дудку своего господина, и младших личей, выжидающих часа, дабы заколоть своего временного угнетателя."
 lichdom_government_adjective: "Танатократическ"
 lichdom_government_vassals_label: "Личества не имеют [Concept('vassals','вассалов')|E]"

 wasteland_government: "Пустошь"
 wasteland_government_realm: "Пустошь"
 wasteland_government_desc: "$wasteland_faith_desc$"
 wasteland_government_adjective: "Пустошн"
 wasteland_government_vassals_label: "Пустоши не имеют [Concept('vassals','вассалов')|E]"

 continental_clan_government: "Племенной клан"
 continental_clan_government_with_icon: "@government_type_continental_clan! $continental_clan_government$"
 continental_clan_government_realm: "Клан"
 continental_clan_government_desc: "\n$game_concept_continental_clan_desc$\n\n#F Племенные кланы из [Concept('continental_interior_biozone','Внутренних областей континента')|E] часто невероятно велики и придерживаются весьма традиционных обычаев. [Concept('taxes','Налоги')|E] и [Concept('levies','ополчение')|E] для [Concept('liege','сюзерена')|E] определяются [Concept('prestige','престижем')|E] последнего.#!"
 continental_clan_government_adjective: "Племеннокланов"
 continental_clan_government_vassals_label: "Племенные [Concept('obligations','обязательства')|E] определяются [Concept('prestige_level','уровнем репутации')|E] [Concept('liege','сюзерена')|E]"

 landed_cultist_government: "Энтропийное сборище"
 landed_cultist_government_with_icon: "@government_type_landed_cultist! Энтропийное сборище"
 landed_cultist_government_realm: "Энтропийное сборище"
 landed_cultist_government_desc: "\nПереросшее сборище бессознательных сектантов, творящих ритуалы в полуразрушенных церквях, ныне это Культ правит обширным краем с множеством малых культов внутри. Хотя в выражении Ничто не может быть истинной структуры, Боги Бездны вознаграждают своих вернейших слуг временной властью."
 landed_cultist_government_adjective: "Культистск"
 landed_cultist_government_vassals_label: "Культисты Бездны взимают малую десятину со своих подчинённых, но вознаграждаются властью по праву силы."

 otachedian_government: "Отачедская"
 otachedian_government_with_icon: "@government_type_otachedian! Отачедская"
 otachedian_government_realm: "Отачедская держава"
 otachedian_government_desc: "\n$game_concept_otachedian_desc$\n\n#F Выстроенная на законах [GetCultureTradition('tradition_otachedian_law').GetName], отачедская держава подобна [Concept('administrative','бюрократической')|E], но от [Concept('liege','сюзерена')|E] ожидается поддержание высокого уровня [Concept('legitimacy','легитимности')|E] и [Concept('influence','влияния')|E] посредством [Concept('paiza','пайцзы')|E]."
 otachedian_government_adjective: "Отачедск"
 otachedian_government_vassals_label: "Отачедские [Concept('obligations','обязательства')|E] определяются [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 otachedian_obligations: "Отачедские обязательства"
