l_russian:

 magocratic_government: "Магократия"
 magocratic_government_with_icon: "@government_type_magocracy! Магократия"
 magocratic_government_desc: "$game_concept_magocracy_desc$\n\n#F Магократии — земли под властью единственного [Concept('magi','мага')|E]. [Concept('magi','Маги')|E] правит как аристократ, но государство устроено так, что только [Concept('magi','маг')|E] может править. Это создаёт феодальную систему, где дети без магического дара автоматически лишаются наследства."
 magocratic_government_adjective: "Магократическ"
 magocratic_government_realm: "Магократическая держава"
 magocratic_government_vassals_label: "[Concept('obligations','Обязанности')|E] [Concept('magi','магов')|E] основаны на [Concept('vassal_contract','вассальном договоре')|E] каждого [Concept('vassal','вассала')|E]"
 liege_magic_level_desc: "Your [magic|E] [trait|E] is [liege.Custom('MagicTraitLevel')]"
 nothing_no_magical_ability: "nothing, you possesses no magical ability"
 
 magocratic_republic: "Магократическая республика"
 magocratic_republic_with_icon: ""
 magocratic_republic_desc: "\n$game_concept_magocratic_republic_desc$\n\n#F Магократические республики схожи с обычными магократиями, но правитель — не наследственный автократ, а избранный из числа влиятельных [Concept('magi','магов')|E]."
 magocratic_republic_adjective: "Магократическ"
 magocratic_republic_realm: "Республиканская магократия"
 magocratic_republic_vassals_label: "Республиканские [Concept('obligations','обязанности')|E] [Concept('magi','магов')|E] аналогичны [Concept('obligations','обязанностям')|E] республиканским [Concept('vassals','вассалам')|E], увеличиваясь с ростом [Concept('opinion','мнения')|E]."
 
 peasant_republic: "Крестьянская республика"
 peasant_republic_with_icon: "@government_type_peasant_republic! Крестьянская республика"
 peasant_republic_desc: "\n$game_concept_peasant_republic_desc$\n\n#F Крестьянские республики — слабо организованные демократические 'государства', полностью контролируемые местными крестьянами. Часто возникают в периоды беспорядков, но редко существуют долго из-за угрозы современным системам власти.#!"
 peasant_republic_adjective: "Крестьянск"
 peasant_republic_realm: "Крестьянские коммуны"
 peasant_republic_vassals_label: "[Concept('obligations','Обязанности')|E] крестьянских республик едины для всех республиканских [Concept('vassals','вассалам')|E]"
 
 republic_playable_government: "Республика"
 republic_playable_government_with_icon: "@government_type_republic! $republic_playable_government$"
 republic_playable_government_adjective: "Республиканск"
 republic_playable_government_realm: "Республика"
 republic_playable_government_desc: "\n$game_concept_republic_desc$\n\n#F Города управляются привилегированными гражданами из бюргерского сословия, среди которых выбирается мэр. Хотя мэр имеет значительное влияние, он зависит от популярности для избрания.#!"
 republic_playable_government_vassals_label:1 "[Concept('obligations','Обязанности')|E] республик едины для всех республиканских [Concept('vassals','вассалов')|E] и могут изменяться с [Concept('opinion','мнением')|E]"
 republic_playable_government_obligations:1 "Республиканские [Concept('obligations','обязанности')|E]"

 judicial_republic_government: "Судебная Республика"
 judicial_republic_government_with_icon: "@government_type_judicial_republic! $judicial_republic_government$"
 judicial_republic_government_realm: "Судебная Республика"
 judicial_republic_government_desc: "\n$game_concept_republic_desc$\n\n#F Городами управляет судейское сословие, контролирующее торговлю и повседневные дела. Верховный судья избирается из их числа. Хотя его влияние велико, власть зыбко покоится на судебном авторитете.#!"
 judicial_republic_government_adjective: "Судейско-республиканск"
 judicial_republic_government_vassals_label:1 "Concept('obligations', 'Обязанности')|E] одинаковы для всех республиканских [Concept('vassals','вассалов')|E] и зависят от [Concept('opinion', 'мнения')|E]"
 
 administrative_republic_playable_government: "Великая республика"
 administrative_republic_playable_government_with_icon: "@government_type_administrative_republic! $republic_playable_government$"
 administrative_republic_playable_government_adjective: "Велико-республиканск"
 administrative_republic_playable_government_realm: "Великая республика"
 administrative_republic_playable_government_desc: "\nРеспублика, выросшая за пределы родного города и управляющая целой державой. Система откупов налогов и административных должностей определяет повседневную жизнь и политику."
 administrative_republic_playable_government_vassals_label:1 "[Concept('obligations','Обязанности')|E] республики едины для всех республиканских [Concept('vassals','вассалов')|E] и зависят от [Concept('opinion','мнения')|E]"
 administrative_republic_playable_government_obligations:1 "Республиканские [Concept('obligations','обязанности')|E]"

 landed_order_government: "Земельный священный орден"
 landed_order_government_with_icon: "@government_type_landed_order! $landed_order_government$"
 landed_order_government_realm: "Земельный священный орден"
 landed_order_government_desc:1 "\n$game_concept_landed_order_desc$\n\n#F Этот священный орден обосновался, приняв роль аристократического государства. Сохраняя святые атрибуты и части функций, братья управляют им как выборной монархией.#!"
 landed_order_government_adjective: "Земельный священно-орден"
 landed_order_government_vassals_label: "[Concept('obligations','Обязанности')|E] [Concept('vassals','вассалов')|E] ордена зависят от [Concept('opinion','мнения')|E]"

 military_unit_government: "Военное подразделение"
 military_unit_government_with_icon: "@government_type_military_unit! Военное подразделение"
 military_unit_government_realm: "Военное подразделение"
 military_unit_government_desc:1 "\n$game_concept_military_unit_desc$\n\n#F Остатки [Concept('aversaria','Аверсарианской')|E] военной силы, оставленные после падения Империи. Будь то [Concept('aversaria','аверсарианский')|E] легион, который вырезал себе собственное королевство, или остатки военных границ [Concept('aversaria','Аверсарии')|E], это подразделение теперь сражается в основном за себя.#!" 
 military_unit_government_adjective: "Воинск"
 military_unit_government_vassals_label: "Военные [Concept('obligations','обязанности')|E] основываются на @prestige_icon![Concept('prestige','престиже')|E] [Concept('liege','сюзерена')|E]"
 
 pirate_government: "Пират"
 pirate_government_with_icon: "@government_type_mercenary! $pirate_government$"
 pirate_government_adjective: "Пиратск"
 pirate_government_realm: "Пиратское королевство"
 pirate_government_desc: "$game_concept_pirate_desc$\n\n#F Пираты крайне редко придерживаются какого-либо кодекса, кроме одного — сильнейшие и самые хитроумные правят. Любой мужчина или женщина с железным сердцем и острым умом может взобраться на вершину по горе павших врагов, если поставят себе такую цель.#!" 
 pirate_government_vassals_label: "Пиратские [Concept('obligations','обязательства')|E] основываются на страхе [Concept('vassals','вассалов')|E] и их общем [Concept('opinion','мнения')|E] о [Concept('liege','сюзерене')|E]"

 administrative_bureaucracy_government: "Административная бюрократия"
 administrative_bureaucracy_government_with_icon: ""
 administrative_bureaucracy_government_adjective: "Бюрократическ"
 administrative_bureaucracy_government_realm: "Административная бюрократия"
 administrative_bureaucracy_government_desc: "Могущественная империя Адабисс является домом, пожалуй, самого централизованного государства на [Concept('aeras','Эрасе')|E], где сильный император и жреческое сословие эффективно управляют обширными территориями, используя передовые технологии для организации грандиозных строительных проектов и создания огромных, стандартизированных армий.\n\n#N Бюрократические государства в настоящее время неиграбельны!#!"
 administrative_bureaucracy_government_vassals_label: "Административные бюрократические [Concept('obligations','обязательства')|E] регулируются сложной системой налогообложения"

 migratory_government: "Мигранты"
 migratory_government_with_icon: "@government_type_adventurer! $migratory_government$"
 migratory_government_adjective: "Мигрирующ"
 migratory_government_realm: "Мигрирующая держава"
 migratory_government_desc: "Мигрирующие государства либо не имеют постоянного дома, либо перемещаются между несколькими. Кочевники [aeras|E] варьируются от пустынных кланов до странствующих отрядов авантюристов и [Concept('fogeaters','обезумевших бывших людей')|E]. Мигрирующие государства не следует путать с крупными группами, совершающими [Concept('sjalvolki_migration','великие переселения')|E] после катастрофических событий [Concept('frodbrokna','Фродброкны')|E].\n\n#N Играбельные мигрирующие государства появятся в ближайшее время!#!"
 migratory_government_vassals_label: "Мигрирующие [Concept('obligations','обязательства')|E] зависят от [Concept('opinion','мнения')|E]"

 lichdom_government: "Личество"
 lichdom_government_with_icon: "@government_type_lichdom! Личество"
 lichdom_government_realm: "Личеств"
 lichdom_government_desc: "Управляемое личем, это государство состоит исключительно из мертвецов-рабов, бездумно следующих воле своего хозяина, и младших личей, выжидающих возможности свергнуть своего временного угнетателя."
 lichdom_government_adjective: "Личеств"
 lichdom_government_vassals_label: "Личества не имеют [Concept('vassals','вассалов')|E]"

 wasteland_government: "Пустошь"
 wasteland_government_realm: "Пустошь"
 #wasteland_government_desc: "Blasted remains and empty wilderness, this wasteland is untouched by the mark of civilization, whether from terrible danger or a simple lack of exploration."
 wasteland_government_desc: "$wasteland_faith_desc$"
 wasteland_government_adjective: "Пустошьск"
 wasteland_government_vassals_label: "Пустоши не имеют [Concept('vassals','вассалов')|E]"

 continental_clan_government: "Племенной клан"
 continental_clan_government_with_icon: "@government_type_tribal! $continental_clan_government$"
 continental_clan_government_realm: "Клан"
 continental_clan_government_desc: "$game_concept_continental_clan_desc$\n\n#F Племенные кланы из [Concept('continental_interior_biozone','центра континента')|E] часто отличаются огромными размерами и строго придерживаются традиционалистских обычаев. [Concept('taxes','налоги')|E] и [Concept('levies','ополчение')|E] для [Concept('liege','сюзерена')|E] определяются уровнем его [Concept('prestige','престижа')|E].#!" 
 continental_clan_government_adjective: "Племенно-кланск"
 continental_clan_government_vassals_label: "Племенные [Concept('obligations','обязательства')|E] зависят от уровня [Concept('prestige','престижа')|E] [Concept('liege','сюзерена')|E]"

 landed_cultist_government: "Entropic Gathering"
 landed_cultist_government_with_icon: "@government_type_landed_cultist! Entropic Gathering"
 landed_cultist_government_realm: "Entropic Gathering"
 landed_cultist_government_desc: "\nHaving grown beyond a smattering of unwitting cultists practicing rituals in dilapidated churches, this Cult rules a large region with many sub-Cults inside of it. While there can be no true structure to the expression of Nothing, the Void Gods reward their most loyal servants with temporary power."
 landed_cultist_government_adjective: "Cultist"
 landed_cultist_government_vassals_label: "Void Cultists extract a small tithe from their underlings, but are rewarded with power by virtue of might."
 
 otachedian_government: "Otachedian"
 otachedian_government_with_icon: "@government_type_otachedian! Otachedian"
 otachedian_government_realm: "Otachedian Realm"
 otachedian_government_desc: "\n$game_concept_otachedian_desc$\n\n#FBuilt through the legalese of [GetCultureTradition('tradition_otachedian_law').GetName], Otachedian realms are similar to [administrative|E] but the [liege|E] is expected to maintain higher levels of [legitimacy|E] and [influence|E] through the use of [paiza|E]."
