 liege_influence_level_desc: "Your [influence_level|E] is [GetInfluenceLevelName(liege.GetInfluenceLevel)|L]"
 convert_to_otachedian_desc: "You do #bold not#! fulfill at least one of the following:\n$EFFECT_LIST_BULLET$Your [top_liege_possessive|E] [government|E] is [GetGovernment('otachedian_government').GetName]\n$EFFECT_LIST_BULLET$Your [culture|E] has the [GetCultureTradition('tradition_otachedian_law').GetName]"
 gh_ayraal_conflict: "You already have a [paiza|E] equipped!"
