 republic_playable_government_vassal_opinion: "Мнение [Concept('vassal','вассала')|E] о [Concept('republic','республике')|E]"
 republic_playable_tax_collector_court_position: "Бейлейт"

 burgher_tax_collector: "Городские сборщики налогов"
 burgher_tax_collector_desc: "#emphasis #bold Привилегии [Concept('vassal','вассала')|E]:#!#!\n[Concept('liege','Сюзерен')|E] не может лишить [Concept('vassals_possessive','вассала')|E] их [Concept('titles','титулов')|E]\n\n#flavor [Concept('vassal','Вассал')|E] гарантированно сохраняет свои [Concept('titles','титулы')|E], что препятствует [Concept('liege','сюзерену')|E] лишить их – независимо от того, есть ли у $game_concept_liege$ основания для этого или нет.#!"
 burgher_tax_collector_flavor_desc: "Жители этого города ставят торговлю и коммерцию выше всего и жертвуют трудом ради сохранения своих свобод."
 plantation_tax_collector: "Права на плантации"
 plantation_tax_collector_flavor_desc: "Требования: [Concept('vassal','вассал')|E] должен иметь минимальный процент сельскохозяйственных земель или пойменных [Concept('terrain','ландшафтов')|E]."
 mining_tax_collector: "Горные права"
 mining_tax_collector_flavor_desc: "Требования: [Concept('vassal','вассал')|E] должен иметь минимальный процент богатых ресурсами [Concept('terrain','ландшафтов')|E], таких как горы или холмы."
 autonomy_special_rights_tax_collector: "Автономия"
 autonomy_special_rights_tax_collector_desc: "#emphasis #bold Привилегии [Concept('vassal','вассала')|E]:#!#!\n[Concept('liege','Сюзерен')|E] не может [Concept('demand_conversion','потребовать изменения веры')|E] у [Concept('vassal','вассала')|E]\n[Concept('liege','Сюзерен')|E] не может использовать [Concept('convert_county','обращения графства')|E] в землях [Concept('vassal','вассала')|E]\n[Concept('liege','Сюзерен')|E] не может использовать [Concept('faith','конфесию')|E] как причину для предотвращения [Concept('tyranny','тирании')|E] при лишении титулов\n[Concept('liege','Сюзерен')|E] не может лишить [Concept('vassal','вассала')|E] их [Concept('titles','титулов')|E]\n\n#flavor [Concept('vassal','Вассал')|E] гарантированно сохраняет свои [Concept('titles','титулы')|E], что препятствует [Concept('liege','сюзерену')|E] лишить их – независимо от того, есть ли у $game_concept_liege$ основания для этого или нет.\n$game_concept_vassal$ также получает специальный защищенный статус, с официальным признанием его права на практику своей собственной [Concept('faith','конфесии')|E].#!"
 autonomy_special_rights_tax_collector_flavor_desc: "Этим городам предоставлено еще больше полномочий для управления собственными делами в обмен на большие и более продолжительные служебные обязательства."
 march_special_rights_tax_collector: "Марка"
 march_special_rights_tax_collector_desc: "#emphasis #bold Привилегии [Concept('vassal','вассала')|E]:#!#!\n[Concept('liege','Сюзерен')|E] не может лишить [Concept('vassal','вассала')|E] их [Concept('titles','титулов')|E]\n[Concept('vassal','Вассал')|E] может использовать завоевательные [Concept('casus_bellis','поводы для войны')|E].\n\n#flavor [Concept('vassal','Вассал')|E] гарантированно сохраняет свои [Concept('titles','титулы')|E], что препятствует [Concept('liege','сюзерену')|E] лишить их – независимо от того, есть ли у $game_concept_liege$ основания для этого или нет.\n$game_concept_vassal$ также получает особое право завоевания соседних земель, независимо от [Concept('crown_authority','авторитета короны')|E] или [Concept('clique_authority','власти клики')|E] [Concept('liege','сюзерена')|E].#!"
 march_special_rights_tax_collector_flavor_desc: "Вассалу предоставлены сниженные налоги и повинности в обмен на охрану и укрепление пограничных территорий."
 privateer_special_rights_tax_collector: "Каперские права"
 privateer_special_rights_tax_collector_desc: "#emphasis #bold Привилегии [Concept('vassal','вассала')|E]:#!#!\n[Concept('liege','Сюзерен')|E] не может лишить [Concept('vassal','вассала')|E] их [Concept('titles','титулов')|E]\n[Concept('vassal','Вассал')|E] может использовать завоевательные [Concept('casus_bellis','поводы для войны')|E].\n\n#flavor [Concept('vassal','Вассал')|E] гарантированно сохраняет свои [Concept('titles','титулы')|E], что препятствует [Concept('liege','сюзерену')|E] лишить их – независимо от того, есть ли у $game_concept_liege$ основания для этого или нет.\n$game_concept_vassal$ также получает особое право завоевания соседних земель, независимо от [Concept('crown_authority','авторитета короны')|E] или [Concept('clique_authority','власти клики')|E] [Concept('liege','сюзерена')|E].#!"
 privateer_special_rights_tax_collector_flavor_desc: "Вассалу предоставлены права на рейды против кораблей, не принадлежащих их сюзерену."


