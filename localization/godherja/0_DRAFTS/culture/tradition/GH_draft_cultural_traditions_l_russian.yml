 ##############
 # TRADITIONS #
 ##############
 gh_tradition_dream_guidance_name:0 "Ведомые снами"
 gh_tradition_dream_guidance_desc:0 "В этой культуре сны — это не просто мимолетные видения, а продолжение реальности. Они служат окнами в невидимый мир и в то, чему еще лишь предстоит случиться. Те, кто научился толковать сновидения и подчинять их себе, пользуются большим уважением."
 
 culture_parameter_gh_visit_house_of_dreams_decision:0 "Открывает [Concept('decision', 'решение')|E] «[GetDecision('gh_consult_dream_interpreter_decision').GetName]»"
 culture_parameter_gh_enable_house_of_dream_building:0 "[rulers|E] могут строить [building|E] «[GetBuilding('gh_house_of_dreams_01').GetName]» в [Concept('city_holdings', 'городских владениях')|E] и [Concept('metro_holding', 'метрополиях')|E]." # Zanir-e-Mazrah 

 gh_tradition_dune_wardens_name:0 "Стражи дюн"
 gh_tradition_dune_wardens_desc:0 "Крепости усеивают края пустыни, и несут в них службу воины, способные выдержать как песчаные бури, так и осады. Держать строй — их священный долг."
 gh_tradition_border_lords_name:0 "Пограничные лорды"
 gh_tradition_border_lords_desc:0 "Земля, за которой следят, находится в безопасности. Укрепленные заставы и патрули охраняют рубежи, а каждого, кто пересечет их без спросу, ждет смерть."

 culture_parameter_gh_enable_hixartii_watchtower_building:0 "[rulers|E] могут строить [building|E] #high Укрепленная сторожевая башня#!"
 culture_parameter_male_only_inheritance:0 "Позволяет принять [gender_law|E] «[GetLaw('male_only_law').GetName]»"
 #_name:0 "Дисциплинированный строй"
 #_desc:0 "Порядок — это основа войны. Отточенные построения, жесткая иерархия и строгая дисциплина гарантируют, что ни один солдат не станет действовать в одиночку."