 gh_tradition_dream_guidance_name:89 "Ведомые сновидениями"
 gh_tradition_dream_guidance_desc:89 "В этой культуре сны считают не мимолётными видениями, а продолжением яви — окнами в незримое и в то, что ещё только может свершиться. Тех, кто научился толковать сновидения и властвовать над ними, окружают глубоким почтением."
 
 culture_parameter_gh_visit_house_of_dreams_decision:89 "Открывает [Concept('decision','решение')|E] «[GetDecision('gh_consult_dream_interpreter_decision').GetName]»"
 culture_parameter_gh_enable_house_of_dream_building:89 "Правители могут строить [Concept('building','здание')|E] «[GetBuilding('gh_house_of_dreams_01').GetName]» в [Concept('city_holding','городских владениях')|E] и [Concept('metro_holding','метрополиях')|E]." # Zanir-e-Mazrah 

 gh_tradition_dune_wardens_name:89 "Стражи дюн"
 gh_tradition_dune_wardens_desc:89 "По краю пустыни высятся крепости, где несут службу воины, способные выдержать и песчаные бури, и долгую осаду. Стоять насмерть на рубеже — их священный долг."
 gh_tradition_border_lords_name:89 "Пограничные лорды"
 gh_tradition_border_lords_desc:89 "Земля под надзором — земля в безопасности. Укреплённые заставы и дозоры стерегут рубежи, а всякого, кто пересечёт их без дозволения, ждёт смерть."

 culture_parameter_gh_enable_hixartii_watchtower_building:89 "Правители могут строить [Concept('building','здание')|E] #high «Укреплённая сторожевая башня»#!"
 culture_parameter_male_only_inheritance:89 "Можно принять [Concept('gender_law','закон о наследовании по полу')|E] «[GetLaw('male_only_law').GetName]»"
 #_name:89 "Disciplined Ranks"
 #_desc:89 "Order is the foundation of war. Drilled formations, rigid hierarchy, and strong discipline ensure no soldier acts alone."