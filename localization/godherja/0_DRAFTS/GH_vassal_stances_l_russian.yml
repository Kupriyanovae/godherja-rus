l_russian:
 magic_focused:0 "Магические интересы"
 magic_focused_desc:0 "[vassals|El], проявляющие магические интересы, стремятся изучать [Concept('arcana','арканные')|E] и [Concept('magic','магические')|E] свойства мира, а также демонстрировать свои познания. Разумные и любознательные вассалы часто придерживаются подобных [Concept('vassal_stance', 'взглядов')|E]. Они с большей вероятностью будут пытаться изучать и копить магию.\n\n#low Такие вассалы одобряют, когда сюзерен:#!\n$EFFECT_LIST_BULLET$обладает низким [Concept('crown_authority', 'авторитетом короны')|E]\n$EFFECT_LIST_BULLET$дает [titles|El] персонажам-[Concept('magi', 'магам')|E]\n$EFFECT_LIST_BULLET$успешно завершает [scheme|El] на [Concept('crown_authority', 'авторитет короны')|E]\n$EFFECT_LIST_BULLET$является [Concept('magi', 'магом')|E]\n\n#low Такие вассалы не одобряют, когда сюзерен:#!\n$EFFECT_LIST_BULLET$обладает высоким [Concept('crown_authority', 'авторитетом короны')|E]\n\nОни предпочитают могущественных [Concept('magi', 'магов')|E]-[Concept('heirs', 'наследников')|E] с высоким значением навыка [arcana_i][Concept('arcana', 'арканы')|E]."
 magic_focused_filter_option:0 "Магические интересы"
 magic_focused_option_desc:0 "Только персонажи с #TOOLTIP:VASSAL_STANCE,magic_focused #L [GetVassalStance( 'magic_focused' ).GetTextIcon]склонными к магии#!#! [vassal|El] взглядами"
