l_russian:
 
 generic_intro_desc:90 "Мы отправились в дикие земли #BOL [Localize(Concatenate(GetPlayer.MakeScope.Var('temporary_hunt_biozone_variable').GetFlagName,'_name'))]#!, предвкушая предстоящую охоту. После недель скучной подготовки — самой охоты, припасов, дороги и прочих мелочей — мы наконец оказались на природе и можем выдохнуть.\n\nТеперь осталось лишь выбрать добычу. До места, достаточно далёкого от цивилизации, чтобы там стоило искать следы, идти ещё несколько часов, но приятная прогулка на свежем воздухе наверняка станет хорошей разминкой перед самой охотой."
 
 ## KALATHIPSOMI ##

 kalathipsomi_name:90 "Калатипсоми"
 kalathipsomi_intro_desc:90 "Вдали от шумных садов, полей и деревень, приютившихся вдоль великих рек #BOL Калатипсоми#!, лежит по-настоящему древняя и нетронутая глушь, способная пленить всякого, кто сюда попадёт. Следует быть осторожным: здесь невероятно легко заблудиться, а дикие просторы так велики, что до ближайшей цивилизации могут быть сотни лиг.\n\nДичь здесь, как и следовало ожидать, не знает себе равных. В этих краях можно встретить всё — от обычного оленя до полумифических свирепых чудовищ. И пусть место кажется охотничьим раем, ступать здесь нужно осторожно: в этих лесах очень легко самому стать добычей."
 kalathipsomi_encyclopedia_desc:90 "Долины двух огромных рек, Патоса и Копролоса, укрывают одни из самых густых и пышных лесов умеренного пояса во всём Аэрасе. Хотя тысячи лет земледельческого освоения оставили на земле широкие полосы пашен, похожие на шрамы, большая часть #BOL Калатипсоми#! по-прежнему занята почти непроходимыми первобытными лесами, где сложилась невероятно разнообразная и во многом эндемичная экосистема."
 
 ## HEARTWOOD ##

 kalath_old_growth_name:90 "Сердцелесье"
 kalath_old_growth_intro_desc:90 "Несколько дней мы думали, что уже находимся в настоящей глуши. Давно не попадалось нам ни поселений, ни даже других людей, и почти во все стороны вокруг тянулась дикая земля до самого горизонта. Но лишь достигнув [Glossary('Сердцелесья','kalath_old_growth_encyclopedia_desc')], мы наконец поняли свою ошибку.\n\nКрай первобытного леса окружён лугами; корни и древесные стволы ползут по земле и обвивают деревья, словно усики, так плотно, что в лесу едва видно дальше нескольких шагов. Несмотря на полдень, под пологом уже настолько темно, что мои спутники приготовили фонарь. Когда мы вступаем под деревья, кажется, будто лес поворачивается вокруг нас, меняя сам воздух, словно эта тёмная и загадочная чаща приглашает нас глубже."
 kalath_old_growth_encyclopedia_desc:90 "#BOL Сердцелесье#! — первобытный лес к югу от реки Патос, стоящий здесь дольше, чем длится записанная история. В этом вечнозелёном лесу встречаются деревья со всего [Glossary('Калатипсоми','kalathipsomi_encyclopedia_desc')], однако корни древнейших деревьев Сердцелесья разрослись так широко и жёстко, что местные говорят: эти деревья почти никогда не покидают свой лес. Некоторые учёные считают, что именно он был первым лесом Калатипсоми, хотя о его точном возрасте спорят до сих пор.\n\nБольшая часть Сердцелесья представляет собой почти непроходимую чащу. Полог пропускает к земле мало света, а огромные, бесконечные корни перекрывают большинство путей через лес. Ночью чаща вспыхивает светом светлячков и спор, пляшущих на деревьях под луной. Говорят, во время своих миграций все существа и даже деревья Калатипсоми посещают Сердцелесье, хотя учёные так и не смогли понять почему."
 
 ## DELTA ##

 pathos_delta_name:90 "Дельта Патоса"
 pathos_delta_intro_desc:90 "Каждый шаг в [Glossary('Дельте Патоса','pathos_delta_encyclopedia_desc')] мы делаем осмотрительно и осторожно. Местные уверяли, что нам нечего бояться, пока мы держимся деревьев, но трудно не тревожиться, когда есть шанс случайно провалиться насмерть. И всё же, несмотря на лёгкую панику, которую каждый из нас испытывает, стоит почве дрогнуть под ногами, красотой леса невозможно не любоваться. Густой лишайник мятного цвета покрывает всё вокруг, а разноцветные грибные побеги расползаются по коре и корням. Над нами висит нежная дымка, и редкие лучи солнца, пробившиеся сквозь плотный полог, заставляют растения мерцать.\n\nМы перебираемся через каменистый ручей и вдыхаем свежий воздух, пока внизу из воды выпрыгивает лосось. Даже если добычи мы так и не найдём, время, проведённое здесь, наверняка запомнится."
 pathos_delta_encyclopedia_desc:90 "#BOL Дельта Патоса#! — название большого умеренного дождевого леса и разбросанных болот, заполняющих Залив Мечей и тянущихся вдоль значительной части реки Патос. Погода здесь круглый год прохладная и мягкая, с долгим вегетационным периодом и почти постоянной моросью. Ближе к рекам и побережью дождевые леса в основном состоят из елей и пихт, которые на больших высотах быстро смешиваются с обширными массивами вечнозелёного красного кедра. Большая часть подлеска покрыта толстым слоем лишайника и папоротников, а влажный климат создаёт идеальную среду для грибов, растущих в дождевом лесу в изобилии.\n\nНесмотря на красоту региона и обилие пищи, поселяться в его глухих местах издавна считалось опасным делом. Известняковые почвы плохо отводят воду дельты и осадки, сходящие с гор, из-за чего от дельты до Кепиранской котловины протянулась сеть изрезанных пещер. Нередко случается, что искатели приключений, охотящиеся на [Glossary('лимрилла Патоса','animal_type_lymrill_encyclopedia_desc')], или поселенцы в поисках нового дома внезапно проваливаются в глубокую каверну из-за незамеченной воронки."

 ## BASIN ##

 sulzegg_basin_name:90 "Кепиранская котловина"
 sulzegg_basin_intro_desc:90 "Мы взобрались на зубчатый скальный выступ, откуда открывается вид на [Glossary('Кепиранскую котловину','sulzegg_basin_encyclopedia_desc')], и вдохнули чистый прохладный воздух. Глядя на колышущиеся леса и поля, мимо которых проходит мягкий ветер, почти невозможно не расслабиться. Зелень листьев и синева воды кажутся ярче, чем где-либо прежде, а зверьё — спокойнее. Разбросанные по котловине фермы и поселения выделяются, словно небольшие ориентиры, и мы отправляемся на охоту с обновлённым воодушевлением."
 sulzegg_basin_encyclopedia_desc:90 "#BOL Кепиранская котловина#! прежде всего известна обильными урожаями, чистейшими озёрами и прекрасными видами. Большая часть региона у гор всё ещё покрыта густыми лесами сахарной сосны и чёрного дуба, а также полосами секвой, пришедших с побережья, но длиннотравные прерии у кристально чистых озёрных вод считаются одними из самых плодородных полей на [Concept('the_continent', 'Расколотом побережье')|E]. Плодородны и многие пляжи; несколько видов жерухи встречаются только вдоль кепиранских озёрных берегов. Самая обычная местная фауна — бобры, и многие жители уверяют, что самая долгая война в Аэрасе идёт между бобрами и поселениями, пытающимися разрушать их плотины по всему водосбору региона."

 ## FORESTS ##

 kalath_redwoods_name:90 "Лаодантинские леса"
 kalath_redwoods_intro_desc:90 "Величественные секвойи, господствующие в [Glossary('Лаодантинских лесах','kalath_redwoods_encyclopedia_desc')], безусловно, стоят того, чтобы на них смотреть: они вырастают до таких головокружительных высот, что даже древние дубы рядом с ними кажутся жалкими сорняками. Если запрокинуть голову и всмотреться в огромный полог в нескольких сотнях футов над нами, можно различить в листве всевозможное движение — от ярких птиц до гигантских жуков.\n\nК счастью для нас, подлесок, хотя и есть, главным образом в виде крупных папоротников, редок и легко проходим; лишь изредка колоссальные корни становятся чем-то похожим на препятствие. Путь здесь должен быть приятным, но заставить более скрытных обитателей крон спуститься вниз будет куда труднее."
 kalath_redwoods_encyclopedia_desc:90 "Хотя колоссальные секвойи встречаются отдельными рощами по всему [Glossary('Калатипсоми','kalathipsomi_encyclopedia_desc')], нигде они не господствуют над биосферой так полно, как в северной половине полуострова. Тень их огромных крон почти не оставляет другим деревьям шанса укорениться под ними, зато сами верхушки служат особой экосистемой: невероятное множество птиц, мелких млекопитающих и гигантских насекомых проводят всю жизнь, редко — если вообще когда-либо — спускаясь из своего лиственного дома."

 ## HILLS ##

 southern_kalath_name:90 "Грезящие холмы"
 southern_kalath_intro_desc:90 "Мы разбили лагерь на склоне холма, глубоко среди [Glossary('Грезящих холмов','southern_kalath_encyclopedia_desc')]. Холмы, каменные утёсы и густые полосы деревьев вокруг навевают неожиданное спокойствие, будто сама дикая земля и вправду спит.\n\nНа рассвете мы собираемся углубиться в леса, хотя в последней деревне нам рассказывали о горячем источнике неподалёку, и меня не удивит, если остальные захотят сделать крюк ради отдыха. Всё же задерживаться не стоит: так мы можем потерять след добычи."
 southern_kalath_encyclopedia_desc:90 "К югу от Калатипсомских гор лежат #BOL Грезящие холмы#! — край умеренных лугов, густых лесов и впечатляющих гейзеров. Зубчатые скальные образования, разбросанные по местности, породили множество тёплых водопадов и каскадов вдоль водных путей. Хотя большая часть добрых земель у рек обращена в пашни, богатые леса, поднимающиеся по каменистым холмам к горам, всё ещё полны фауны и флоры. Все деревья окрестных лесов встречаются вплоть до линии леса: говорят, многие из них проходят через тёплые долины на своих путях по чащам. Дальше вглубь суши лесные пожары давно стали обычным явлением, и местная среда, похоже, приспособилась именно к этому.\n\nНекоторые учёные полагают, что под горами дремлет огромная кальдера, поскольку по холмам встречается множество гейзеров и горячих источников."

 ## VALLEY ##

 knokidbes_name:90 "Долина Кнокидбес"
 knokidbes_intro_desc:90 "Мы тащились через [Glossary('долину Кнокидбес','knokidbes_encyclopedia_desc')] целую вечность — хотя на деле прошло, конечно, куда меньше. Глубокая грязь промочила ноги выше икр и продолжает тянуть нас вниз с каждым шагом в эту глушь. Большую часть холмистых травяных равнин к югу от лесов мы вовсе обошли стороной, главным образом потому, что местные говорили: там нет почти ничего, кроме травы и ещё большей грязи. Один из моих спутников пошутил, что по долине нам было бы легче идти на лодке, и я наполовину готов с ним согласиться."
 knokidbes_encyclopedia_desc:90 "#BOL Долина Кнокидбес#! — сравнительно дикий простор глубоко раскисших холмов, пустошей и лесов, тянущийся от южных Калатипсомских гор к заливу Патоса. Благодаря уникальному положению региона, принимающего сток из [Glossary('Кепиранской котловины','sulzegg_basin_encyclopedia_desc')], а также переполняющие воды близких рек Зарриньян и Эрамасик, луга Кнокидбеса коварны и большую часть года почти непроходимы, а вне холодного сезона мало чем отличаются от грязевых равнин. Через кипарисовые и дубовые леса течёт множество чёрноводных рек, тоже добавляющих грязи, хотя и в меньшей степени, чем низины южнее.\n\nБлизкие реки помогли сформировать и цепь барьерных островов в дельте Эрамасика. Эти острова известны большим количеством плотоядных растений, таких как $aauto_maklea_link$ осоловка Маклеи#!, хотя некоторые встречаются и на материковом побережье."

 ## HIGHLANDS ##

 migraddar_name:90 "Психрасское нагорье"
 migraddar_intro_desc:90 "Чем дальше мы уходили в леса от [Glossary('Дельты Патоса','pathos_delta_encyclopedia_desc')], тем реже встречались города. Последний мы миновали почти пять дней назад. Когда лес сменился густой белокорой сосной, а под ногами стало всё больше чертополоха и шишек, мы поняли, что наконец достигли [Glossary('Психрасского нагорья','migraddar_encyclopedia_desc')]. Жёсткий ветер кусает нас, скатываясь с гор за деревьями, и я невольно плотнее запахиваю одежду. Суровая глушь вокруг, кажется, вовсе не замечает холода.\n\nСквозь лес разносится громкий гул и треск древесины: где-то между деревьями движется крупная тварь, но откуда именно — понять невозможно. Тёплой постели и горячей еды нам, похоже, ждать ещё нескоро, так что надеюсь, припасов на путь мы взяли достаточно."
 migraddar_encyclopedia_desc:90 "#BOL Психрасское нагорье#! представляет собой неровную цепь густо поросших лесом предгорий, идущих через местность к Чёрному перевалу и Железным шпилям дальше на севере. Эти густые леса давно считают глухой окраиной: каменистые чащи бедны полезными ископаемыми и для большинства недоступны из-за мегафауны и лавин. Коварный путь к Чёрному перевалу и Железным шпилям чрезвычайно трудно пройти без знания местности или проводника, а немногие города и деревни здесь часто называют краем цивилизации — за ними лежит глубокая глушь и громадные горы."

 ## MAYIKRATA ##

 mayikprolollan_name:90 "Майикратия"
 mayikprolollan_intro_desc:90 "[mayikrata|E] и окружающие её [Glossary('горы','mayikprolollan_encyclopedia_desc')] издали поистине поражают взгляд. Синие на отлив, невозможной высоты, их снежные вершины венчают облака, и на одной из не самых высоких стоит колоссальная академия. Вид прекрасен, но в нём есть и мрачное предостережение, стоит лишь понять, что скоро нам самим предстоит подниматься в эти горы.\n\nС тех пор как главный путь к сооружению пришёл в упадок, посетителям приходится довольствоваться запутанной сетью опасных и трудных троп. Даже если мы не собираемся входить в саму академию, окружающая местность всё равно станет серьёзным испытанием."
 mayikprolollan_encyclopedia_desc:90 "Горы, на вершинах которых расположена [mayikrata|E], входят в число самых высоких и неприступных в мире. Враждебная среда поддерживает лишь скудную растительность; животных здесь тоже мало, и большинство из них — воздушные хищники, охотящиеся в низинах вокруг. Кроме того, века деятельности самого [Concept('mayikprolollans','Майикпрололлана')|E] породили в этих местах многочисленных одичавших мутантов и духов."
 
 ## ETEPEZEA ##

 etepezea_name:90 "Этепезея"
 etepezea_intro_desc:90 "Материковая [Glossary('Этепезея','etepezea_encyclopedia_desc')] никогда не была особенно привлекательным местом для обычного охотника, и понять почему нетрудно. Побережье может быть сравнительно приятным, но почти вся достойная добыча обитает в гористой, выжженной солнцем глубине полуострова. Чем дальше мы уходим от берега, тем круче и неровнее становится земля, а выносливый вечнозелёный кустарник почти так же непроходим.\n\nБесконечный маквис не только сильно замедляет движение, но и скрывает, пожалуй, главную опасность полуострова — змей. [Glossary('Этепезея','etepezea_encyclopedia_desc')] печально известна, кажется, бесконечным обилием и разнообразием змей, и каждый шаг приходится делать с предельной осторожностью: будто под каждым кустом прячется с десяток гадюк."
 etepezea_encyclopedia_desc:90 "#BOL Этепезея#! — сравнительно спокойный каменистый полуостров в самом сердце [Concept('the_continent', 'Расколотого побережья')|E]. Прибрежные холмы и долины рассечены скалистыми, раздробленными горами в центре Этепезеи. Хотя регион сравнительно приятен для путешественников и охотников-любителей, многие ядовитые змеи здесь являются местными видами. В горах нередко встречаешь их почти под каждым вторым камнем или кустом."

 ## ISLE ##

 imperial_isle_name:90 "Имперский остров"
 imperial_isle_intro_desc:90 "[Glossary('Имперский остров','imperial_isle_encyclopedia_desc')] широко считается одним из красивейших регионов [Concept('the_continent', 'Расколотого побережья')|E] и с первых дней империи служит любимым охотничьим местом для [Concept('aversaria','аверсарианской')|E] знати, о чём свидетельствуют бесчисленные виллы, разбросанные по сельской местности. Понять причину нетрудно: приятная погода круглый год, обилие дичи и съедобных растений, отсутствие опасных хищников и общая красота этого края.\n\nМы выступаем на рассвете, хорошо снабжённые и в добром расположении духа. Если что-то вдруг пойдёт не так, цивилизация здесь редко бывает далеко, а весь остров часто называют скорее огромным садом, чем настоящей глушью."
 imperial_isle_encyclopedia_desc:90 "#BOL Имперский остров#! широко считается одним из красивейших регионов [Concept('the_continent', 'Расколотого побережья')|E] и с первых дней империи служит популярным местом охоты для [Concept('aversaria','аверсарианской')|E] знати."
 
 ## ISLES ##

 the_isles_name:90 "Западные острова"
 the_isles_intro_desc:90 "Любой моряк на Море Империй, если он хоть чего-то стоит, расскажет истории об опасностях, таящихся под водами [Glossary('Западных островов','the_isles_encyclopedia_desc')]. Удивительно многие из них могут оказаться правдой: не секрет, что корабли в этом регионе разбиваются или исчезают с удручающей частотой, хотя за подавляющее большинство таких случаев, вероятно, отвечают местные штормы.\n\nМы лавируем между чёрными утёсами и грозными морскими столбами, пока наконец не находим достаточно крупный остров для высадки. Погода пока спокойна, но задерживаться надолго нельзя: свирепые бури архипелага могут оставить нас в ловушке на недели, если нам особенно не повезёт, а полное отсутствие лесного покрова означает, что даже на суше мы будем открыты любым капризам ненастья."
 the_isles_encyclopedia_desc:90 "По мере приближения к самым северо-западным пределам [Concept('the_continent', 'Расколотого побережья')|E] тёплый и в основном спокойный климат юга сменяется морями, терзаемыми бурями и частыми дождями. Меняется и облик самих островов: побережья холмистых пастбищ окаймлены высокими чёрными утёсами, среди которых бесчисленно торчат морские столбы. Из-за бурных вод и часто опасной морской жизни моряки подходят к этим местам с осторожностью или вовсе их избегают."
  
 ## ISLES ##

 tower_isles_name:90 "Башенные острова"
 tower_isles_intro_desc:90 "Огромные руины под водами [Glossary('Башенных островов','tower_isles_encyclopedia_desc')], несмотря на свои размеры, поначалу легко не заметить. Спрятанные под зарослями губок, кораллов и ламинарии, они выдают искусственное происхождение лишь тогда, когда взгляд улавливает под ними блеск золотистого металла, почему-то не потускневшего за эоны. А затем внимательный наблюдатель всё яснее различает очертания колоссальных шпилей, арок, статуй и окон.\n\nМы высаживаемся на острове рядом с особенно крупным скоплением затопленных зданий — без сомнения, когда-то это был город такого масштаба, что затмил бы почти любой из ныне стоящих, — и в последний раз проверяем снаряжение."
 tower_isles_encyclopedia_desc:90 "#BOL Башенные острова#! — крупный кольцеобразный архипелаг вокруг [Concept('sea_tower','Морской башни')|E], с тёплым климатом на юго-востоке, постепенно холодеющим к северо-западу. Затонувшие руины неизвестного происхождения господствуют в сравнительно мелких местных водах, хотя их впечатляющие формы по большей части скрыты густыми зарослями кораллов и губок, где обитает множество [Concept('magic','магических')|E] водных существ."
 
 ## ISLES ##

 central_isles_name:90 "Центральные острова"
 central_isles_intro_desc:90 "С каждым островом, мимо которого мы проходим, кажется, будто мы открываем новое место. По одну сторону лодки над нами высится колоссальный утёс из ослепительно белой скалы. По другую — узкий пляж огибает край острова, отделённый от суши плотной полосой кустарника и фиолетовых деревьев.\n\nМы высаживаемся на относительно спокойном берегу среди камней и опунций; мягкий морской ветер омывает нас, пока мы разгружаемся. Где-то на острове поднимается огромная стая ярких птиц и дугой уходит по небу. Пусть путь ещё может оказаться долгим, я невольно радуюсь тому, что мы можем найти в этих водах."
 central_isles_encyclopedia_desc:90 "#BOL Центральные острова#! — архипелаг в сердце Расколотого побережья. Хотя климат здесь в целом мягкий и сухой, учёные давно считают невозможным обобщить природную среду островов из-за их огромного географического и экологического разнообразия. Одни острова могут быть чрезвычайно плодородными житницами, другие — пустыми скалами; здесь столько же пляжей, сколько отвесных мраморных утёсов. Чем ближе к Малкое, тем более неспокойными и каменистыми обычно становятся острова.\n\nНекоторые [Concept('aversaria','аверсарианские')|E] учёные предполагают, что острова когда-то могли быть горной цепью, ушедшей под море, хотя убедительных доказательств этому нет."
 
 ## GUILLATE ##

 guillate_rocks_name:90 "Скалы Гийят"
 guillate_rocks_intro_desc:90 "Мы сразу заметили, как пересекли границу [Glossary('Башенных островов','tower_isles_encyclopedia_desc')] и вошли в [Glossary('Скалы Гийят','guillate_rocks_encyclopedia_desc')]: вода из прозрачной стала тёмной, завихряющейся смесью зелени и синевы. Чем дальше мы идём, тем больше кристаллических образований поднимается из моря. Некоторые, поймав солнечный свет, будто сияют и слегка окрашивают воду вдоль своих рифов.\n\nЕдва не разбив лодку о кристаллы, скрытые прямо под поверхностью, мы пристаём к пляжу под двумя утёсами, словно расколотыми пополам. Несколько деревьев цепляются за камень, вытягиваясь в воздух над нами, точно конечности. Мы уже столкнулись с опасностью в самом начале, но впереди, вероятно, будет ещё немало подобных встреч."
 guillate_rocks_encyclopedia_desc:90 "Зубчатые #BOL Скалы Гийят#! змеятся от Алойзийского моря до Бодрствующего побережья. Эти острова прежде всего примечательны кристальными рифами, окаймляющими большую часть региона. Такие рифы часто выступают над поверхностью воды, а кое-где бывают больше ближайшего острова. В холодный сезон климат обычно спокоен и прохладен, но в тёплый суровые бури становятся гораздо чаще, когда ураганы бьют по [Glossary('Западным островам','the_isles_encyclopedia_desc')]. Многие уникальные виды фауны и флоры встречаются только в Скалах Гийят, часто образуя особые связи с кристаллическими формациями атоллов и рифов."


 ## ARCHIPELAGO ##

 lonely_light_name:90 "Архипелаг Одинокого света"
 lonely_light_intro_desc:90 "$generic_intro_desc$"
 lonely_light_encyclopedia_desc:90 "Одинокий свет — скалистый вулканический архипелаг далеко к северо-западу от [Concept('the_continent','Расколотого побережья')|E]. Хотя большая часть его севера покрыта тундрой, острова известны густым разнотравьем и папоротниками. Считается, что немногие уцелевшие деревья были привезены поселенцами из старой Ойейники. Снега здесь мало, зато дождь и туман обычны круглый год.\n\nСамая распространённая фауна — мигрирующие морские птицы, с многочисленными колониями на северных берегах. Окружающие воды славятся великими китами и косатками, господствующими в море, а также огромными морскими львами, что делает путь опасным для неопытных. Некоторые животные, например северные олени, были завезены с материка, но местные голубые лисы, ламы и выдры достаточно многочисленны, чтобы поддерживать крепкую торговлю мехом с [chevalie|E] и дальше."
 
 chevalie_name:90 "Шевалье"
 chevalie_intro_desc:90 "В диких землях [Glossary('Шевалье','chevalie_encyclopedia_desc')] есть почти волшебное очарование, несмотря на историю региона. Волнистые пастбища переходят в густые леса и каменистые горные хребты, господствующие во внутренних землях. Горы стоят стражей к северу от Шевалье, где, как говорят, чем ближе подходишь к [Concept('the_lichdoms','Личествам')|E], тем кислее становится дождь. Леса поднимаются высоко в небо; их вечнозелёная листва и хвоя укрывают лишайник, стелющийся по лесной подстилке. Плотные, ровные стволы так мешают ориентироваться, что без горных вершин над кронами легко сбиться с пути. Для неподготовленного путника дорога здесь трудна, а порой и опасна.\n\nЧем ближе к побережью, тем светлее становятся леса: верхний слой почвы покрывается густым кустарником и ярусами растительности, а деревья растут глубоко и широко. Чем выше поднимаешься в холмы и горы, тем опаснее путь, ведь там обитают самые свирепые твари Шевалье. Крутые фьорды, вырезанные эонами, возвышаются над западными берегами, а мутные болота пятнают леса к востоку, укрытые туманом.\n\nЭти леса — чудо для всякого достойного охотника, но бдительность терять нельзя: при всей красоте эти чащи не для слабых."
 chevalie_encyclopedia_desc:90 "#BOL Шевалье#! чаще всего связывают с антимагическим полем, укрывающим регион и защищающим его от опустошённых [Concept('the_lichdoms','Личеств')|E] дальше на севере. Низинные поля считаются сравнительно безопасными для путешественников, но густые леса и горные хребты куда коварнее и богаче фауной, включая [Concept('griffons','грифонов')|E]. В этих горах живут единственные грифоны на [Concept('aeras','Аэрасе')|E], что делает их желанными трофеями для любого охотника."
 
 ## MOOR ##

 konijkmener_name:90 "Гранмаарские пустоши"
 konijkmener_intro_desc:90 "Путь в [Glossary('Гранмаарские пустоши','konijkmener_encyclopedia_desc')] дался нам нелегко, но теперь перед нами лежит дикая земля Конийкских болот. С дамбы, на которой мы стоим, видно густой лабиринт лесов, перемежающийся туманными топями, ещё не тронутыми усилиями местных. Тёмно-зелёные листья спадают к бурым и синим заросшим тростником водам, отмечающим наш путь. Запах прибрежной сосны слабеет, уступая место дубу и буку, а рысьи трели смешиваются с куда более тревожными стонами из глубин болот.\n\nПо мере того как отряд уходит в заросли, реки становятся всё более дикими и непредсказуемыми, разливаясь в топи. Воздух тяжелеет, и настроение наше мрачнеет."
 konijkmener_encyclopedia_desc:90 "#BOL Гранмаарские пустоши#! лежат к югу от [Glossary('Шевалье','chevalie_encyclopedia_desc')], где реки и болота отделяют их от более спокойных северных земель. Суровые заболоченные угодья сами по себе станут испытанием для всякого, кто рискнёт углубиться на полуостров, но путникам следует опасаться и обитателей густых буковых лесов и зловонных топей. Крупные лоси бродят меж лабиринтом деревьев, а морские свиньи подстерегают глупцов, потерявших опору на скользких прибрежных дюнах. Хуже всего слухи о левиафанах под болотами, способных заманить даже опытных путешественников в свои туманные логова."

 ## MOUNTAINS ##

 black_mountains_name:90 "Чёрные горы"
 black_mountains_intro_desc:90 "$generic_intro_desc$"
 black_mountains_encyclopedia_desc:90 "#BOL Чёрные горы#! возвышаются над суровыми окраинами [Glossary('Выштанки','vyshtanka_encyclopedia_desc')] и холмистыми полями [Glossary('Шевалье','chevalie_encyclopedia_desc')]. Пепел и кровь покрыли этот регион; именно пепел и дал горам их имя. Те существа, что называют эти земли домом, столь же крепки, как сами горы, и часто бродят по диким рощам и долинам, прорезающим скалу. Охотиться здесь не советуют никому, кроме самых опытных охотников."

 ## REDLANDS ##

 redlands_name:90 "Красные земли"
 redlands_intro_desc:90 "Путешественники часто называют пустоши [Glossary('Красных земель','redlands_encyclopedia_desc')] одним из самых негостеприимных мест на Аэрасе, возможно, наравне с [Concept('the_lichdoms','Личествами')|E] и [Concept('foglands','Туманными землями')|E]. Это тягостный край выжженных красных песков и скал, насыщенный высоким уровнем скрытой магии; учёные со всего мира веками пытались понять, что именно сформировало его необычную географию. Все они потерпели неудачу — главным образом потому, что опасности Красных земель поглотили тысячи честолюбивых исследователей, а большинство соседних культур научилось отвергать и обходить этот край стороной. Даже [Concept('aversaria','аверсарианцы')|E], при всей своей ненависти к чужакам, признали внутренние Красные земли домом красноземцев и строили поселения лишь вдоль почти пригодного для жизни побережья.\n\nВ Красных землях чем глубже заходишь, тем быстрее растёт угроза, особенно когда вступаешь в таинственные овраги, господствующие во внутренних областях. Все, кто проводит здесь больше короткого времени, слышат странные и тревожные голоса, а ритуальные песнопения тысяч культов глубинных Красных земель будто плывут из тысяч мелких отверстий почти на каждой поверхности. Хуже того, во внутренних землях региона обитают одни из самых враждебных и жутких существ, известных человечеству: от кошмарных масс щупалец, известных как кесрраварга, до пускающего корни в жилах гриба угк'илрррмагса. Маги, кажется, особенно сильно страдают от этого адского биома: большинство сходит с ума, едва покинув с трудом выживающие прибрежные города.\n\nЕдинственное, что здесь может утешить, — шанс умереть от голода или жажды в бесплодной глубине минимален, потому что жертвоприношение культам, взрыв грибка, смерть во сне, безумие, [Concept('overwhelmation', 'магическая болезнь')|E], заражение пожирающим грудь паразитом, управляющим телом, и многое другое убивают больше половины чужаков задолго до того, как голод успеет стать заботой."
 redlands_encyclopedia_desc:90 "#BOL Красные земли#! считаются одним из самых опасных регионов на [Concept('aeras','Аэрасе')|E]. В изрезанных проходах таятся мерзкие твари и отвратительные чудовища, а обычных животных, способных жить здесь, совсем немного. И фауна, и флора одинаково коварны; путь через Красные земли без карт, опыта или хотя бы проводника почти наверняка ведёт к смерти, ведь непосвящённому лабиринт тоннелей и перевалов кажется бесконечной западнёй."

 ## VYSHTANKA ##

 vyshtanka_name:90 "Выштанка"
 vyshtanka_intro_desc:90 "Суровые окраины [Glossary('Выштанки','vyshtanka_encyclopedia_desc')] никогда не были дружелюбны к человеческому жилью. Почва здесь очень плодородна — возможно, одна из лучших на [Concept('aeras','Аэрасе')|E] благодаря частым пеплопадам из соседних [Glossary('Чёрных гор','black_mountains_encyclopedia_desc')], — но неровный рельеф и трудности с использованием каменистого русла реки Выддрин для орошения сделали усмирение региона слишком затратным для владевших им империй.\n\nТак Выштанка и осталась чистой, едва тронутой человеческими руками. Здесь простираются холодные равнины, где бродят последние великие стада мамонтов [Concept('the_continent','Континента')|E]. Здесь свирепые быстрые реки прорезают острые каньоны в горных склонах. И здесь нависают бездорожные леса, скрывающие циклопические каменные идолы, не знавшие солнечного света с незапамятных времён."
 vyshtanka_encyclopedia_desc:90 "Регион суровых окраинных земель, лежащий между окружающими его [Glossary('Чёрными горами','black_mountains_encyclopedia_desc')] и [Glossary('Железными шпилями','mayikprolollan_encyclopedia_desc')]. Он более всего известен тем, что укрывает одни из последних стад мамонтов на [Concept('the_continent','Расколотом побережье')|E]."

 ## FOGLANDS ##

 foglands_name:90 "Туманные земли"
 foglands_intro_desc:90 "Мы начинаем путь в хорошем настроении, но по мере того как цивилизация редеет, а обугленные руины деревень и умирающие леса встречаются всё чаще, воздух становится тише и мрачнее. Наконец, поднявшись на большой холм, мы видим его вдали — странный густой туман, закрывающий весь горизонт до края зрения.\n\nМои спутники заметно неловко переглядываются; прежняя уверенность покинула их. На миг полную тишину нарушает слабый, странный звук, доносящийся откуда-то издали внутри [Concept('the_fog','Тумана')|E]. Спутники смотрят на меня — уверен ли я, что хочу продолжать?"
 random_foglands_ambience_1:90 "Можно ожидать, что стоит ступить в [foglands|E], как на тебя тут же набросится какая-нибудь мерзкая тварь или безумные [fogeaters|E], но правда в том, что большую часть времени это место обладает #BOL глубоко#! жутким однообразием. Куда ни взгляни — одна и та же картина: бесконечные почерневшие мёртвые деревья поднимаются из земли и постепенно исчезают в туманной дали, часто скрывая даже свои верхушки. И сама тишина здесь до крайности неестественна."
 random_foglands_ambience_2:90 "Мы переходим мелкий ручей; болезненно-чёрная вода источает зловонный запах. Пользоваться ею нельзя: когда-то она, возможно, была живительной и приятной, но теперь только безумец решит из неё пить. И всё же бормотание ручья становится желанной передышкой от оглушительной тишины [Concept('foglands','Туманных земель')|E]."
 random_foglands_ambience_3:90 "Мы внезапно останавливаемся: все услышали одно и то же — [GetPlayer.Custom('random_creepy_sound')]. Мы напрягаемся и готовимся к бою, но вскоре понимаем, что звук — лишь обман [Concept('the_fog','Тумана')|E]. Мы идём дальше, а странный шум ещё какое-то время тянется вокруг нас, и его сонное эхо делает происходящее ещё более нереальным."
 fogbeast_encyclopedia_desc:90 "[fogbeasts|E] делятся на две категории: туманные твари мутации и туманные твари мысли. Первые — [Concept('mutations','мутировавшие')|E] и изменённые обитатели [Concept('foglands','Туманных земель')|E], как животные, так и люди. Вторые, похоже, рождаются из самого тумана в ответ на страхи тех глупцов, что задержались в нём слишком надолго. Оба вида чрезвычайно смертоносны."
 foglands_encyclopedia_desc:90 "#BOL Туманные земли#! когда-то были огромной, почти неукрощённой глушью внутренних областей континента. Их дальние леса и долины были зрелищем, достойным любого охотника, но те времена прошли. Теперь землю укрывает густой шепчущий туман. Одичавшие туземцы и тёмные твари таятся в дымке, и всякий, кто достаточно храбр, чтобы войти в эти пугающие леса, должен быть готов к ожидающей его участи."

 ## MALCOIS ##

 malcois_name:90 "Малкоя"
 malcois_intro_desc:90 "[Glossary('Малкоя','malcois_encyclopedia_desc')] обладает умеренной средой, которую обычно считают приятной, пусть и несколько тусклой и унылой. Огромные мраморные и гранитные утёсы господствуют над всеми частями Малкои, не занятыми пологими холмами и глубокими оврагами, а большинство земель вдали от самого побережья считается суровым и негостеприимным из-за нехватки пашни и зубчатого рельефа. Зато здесь нет многих опасных странностей и созданий, встречающихся в других местах Аэраса.\n\nОднако даже при относительной безопасности опасности всё же остаются. Тысяча лет жестокого рабства ийросси породила множество гневных духов и сорвавшихся с цепи мутантов, а ужасающие бои [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E] и Картараддских войн оставили после себя немало странных зверей и призраков — живых свидетельств тех времён. Наконец, некоторые из более враждебных местных видов всё ещё выживают в изолированных уголках в остальном процветающей долины Митидон, хотя местные в основном сделали их крайне редкими или, возможно, довели до вымирания."
 malcois_encyclopedia_desc:90 "#BOL Малкоя#! более всего известна суровыми утёсами и горами, которые господствуют над регионом и защищают его со всех сторон. Внутренние земли прорезаны глубокими оврагами и пологими холмами, что придаёт этой в остальном умеренной земле чрезвычайно дикий вид. Но какой бы ни казалась местная глушь, естественных опасностей в ней осталось очень мало. Многие считают, что этим Малкоя обязана одержимой культуре чести древних ийросси, приведшей к уничтожению множества наиболее опасных видов региона."

 ## OPAKHASIA ##

 opakhasia_name:90 "Опахазия"
 opakhasia_intro_desc:90 "#BOL Опахазия#! — один из самых своеобразных регионов [Concept('aversaria','Аверсарии')|E], с одним из самых контрастных биомов. Прибрежные земли роскошны и богаты и почвой, и торговлей, а большинство местных видов там обычно сравнительно смирны или малочисленны. Внутренние земли, напротив, заняты зубчатыми горными хребтами и бесконечно петляющими перевалами, где, как говорят, обитает множество древних зверей. Хуже того, широкие разрушения прошлых войн сделали многие места непригодными для жизни, и ужасающие магические мерзости — созданные страшными чарами или вырванные из гробниц, попавших под удар, — распространились по большей части региона.\n\nМы только начали путь, но, стоя на скалистом гребне между зелёным побережьем с одной стороны и мрачными горами в глубине с другой, я не могу не думать о том, какие существа могут скрываться здесь."
 opakhasia_encyclopedia_desc:90 "#BOL Опахазия#! — регион Расколотого побережья, отмеченный контрастной географией. Многие места здесь совершенно необитаемы: их опустошили масштабные разрушения, оставив землю почти голой. Говорят, опахазийская #BOL Красная пустошь#! даже укрывает магических мерзостей и мутировавших чудовищ, охотящихся на людей.\n\nСреди наиболее обычных опахазийских монстров, которых можно встретить, называют огненных и каменных великанов, стаи крокотт и легендарных, якобы вымерших горных титанов. Кроме того, вершины Опахазии известны одним из самых разнообразных собраний птиц на Аэрасе — как обычных, так и чудовищных."
 
 ## OPAKHASIA ##

 northern_opakhasia_name:90 "Северная Опахазия"
 northern_opakhasia_intro_desc:90 "Мы ушли как можно дальше от дорог и освоенных берегов [Glossary('Северной Опахазии','northern_opakhasia_encyclopedia_desc')], почти достигнув каменистых предгорий, ведущих к горам. Чем дальше от океана мы шли, тем больше становилось кипарисов, и теперь, когда цивилизация осталась далеко позади, дикая жизнь начала понемногу показываться нам.\n\nМы поднимаемся на мягкий склон холма и смотрим на тихую долину впереди: тонкий ручей бежит по ней от мрачных гор, почти неземных на фоне спокойных полей. При такой контрастной среде трудно не гадать, какие существа могут скрываться здесь."
 northern_opakhasia_encyclopedia_desc:90 "Мягкие волнистые холмы #BOL Северной Опахазии#! считаются одними из самых красивых на [Concept('the_continent', 'Расколотом побережье')|E]. Длинные кипарисовые рощи идут по гребням, отделяя богатые прибрежные города и плантации от немногой оставшейся глуши на пути к каменистой горной глубине. Плодородная почва давно служит благом для местных, хотя раны кровавых конфликтов долго заживали на этих землях, оставив многие пашни заросшими. Мягкий климат приносит сухое тёплое лето, влажные зимы и долгий вегетационный период. Оставшаяся здесь дикая фауна сравнительно смирна и редка, а хищников вне гор почти не осталось."

 ## OPAKHASIA ##

 western_opakhasia_name:90 "Западная Опахазия"
 western_opakhasia_intro_desc:90 "[Glossary('Западная Опахазия','western_opakhasia_encyclopedia_desc')] — один из самых своеобразных регионов [Concept('aversaria','Аверсарии')|E], с одним из самых контрастных биомов. Прибрежные земли роскошны и богаты и почвой, и торговлей, а большинство местных видов там обычно сравнительно смирны или малочисленны. Внутренние земли, напротив, заняты зубчатыми горными хребтами и бесконечно петляющими перевалами, где, как говорят, обитает множество древних зверей.\n\nМы только начали путь, но, стоя на скалистом гребне между зелёным побережьем с одной стороны и мрачными горами в глубине с другой, я не могу не думать о том, какие существа могут скрываться здесь."
 western_opakhasia_encyclopedia_desc:90 "#BOL Западную Опахазию#! прежде всего отличают каменистые, изрезанные берега, полуостровами выдающиеся в море. Её яркие и роскошные прибрежные города окружены плодородными почвами; в местной глуши фауна сравнительно мирна и часто немногочисленна. Дальше вглубь страны, однако, землю начинают занимать зубчатые горы и предгорья, которых охотники обычно избегают. Западная Опахазия также известна разнообразными и яркими водорослями, видными сквозь чистые воды Залива Бастардов."
 
 ## DIVIDE ##

 hyrea_name:90 "Гирейский водораздел"
 hyrea_intro_desc:90 "После нескольких дней вдали от прибрежных городов Парфарии мы стали держаться гор, проходя через [Glossary('Гирейский водораздел','hyrea_encyclopedia_desc')]. Длинные полосы тонкой травы местами так высоки, что пешему касаются живота, а густые осиновые рощи оказались более серьёзным препятствием, чем мы ожидали: между деревьями почти нет места.\n\nПока местная фауна сводилась главным образом к суркам, да и тех поймать непросто. Отсюда недалеко до зубчатых горных проходов, куда местные настоятельно не советовали идти, но на данный момент мы согласны хотя бы найти след."
 hyrea_encyclopedia_desc:90 "#BOL Гирейский водораздел#! — узкая полоса лугов и лесных рощ, зажатая между скалистыми горами Бёлькут на севере и Парфарийским морем на юге. Большая часть лугов состоит из тонкого ковыля и разбросанных тюльпанов, часто прерываемых участками осины и грабового дуба, которые гуще растут ближе к горам.\n\nЦентр Гиреи в значительной мере занимает Зепниан — огромное пресноводное озеро, где ковыль редеет, а дикая пшеница растёт отдельными прериями. Многие рыбы Парфарии, как известно, поднимаются по реке к Зепниану во время миграций, давая обильную пищу и поселениям, и дикой природе."

 ## AIRONOI ##

 western_aironoi_name:90 "Западный Айроной"
 western_aironoi_intro_desc:90 "[Glossary('Западный Айроной','western_aironoi_encyclopedia_desc')] когда-то считался экономическим сердцем [Concept('aversaria','Аверсарии')|E], а теперь превратился в обломки и отбросы. Его некогда живые сосновые леса и разбросанные прерии кажутся искажёнными и бесплодными. Каменистые холмы ближе к Айронойским горам иссушены и изранены, и от красоты в них осталось немногое. Полосы соснового леса пересекают холмы и равнины, обрываясь у возвращённых полей. Мы давно оставили главные дороги, и глушь оказалась почти успокаивающей, хотя чем глубже мы заходим, тем труднее избавиться от чувства, будто за нами что-то следит."
 western_aironoi_encyclopedia_desc:90 "Знаменитый своим золотым цветом с весны до осени, #BOL Западный Айроной#! по сути представляет собой огромное поле дикой пшеницы, изредка прерываемое пятнами заросших садов, и давно считается одной из самых плодородных и экономически желанных областей всего мира. Точно неизвестно, почему луга региона так сильно отличаются от негостеприимных степей дальше на восток; среди возможных причин называют особые климатические условия, исключительное качество почвы и даже древнюю астилакскую магию."

 ## STEPPE ##

 great_steppe_name:90 "Ольтенская степь"
 great_steppe_intro_desc:90 "За [Glossary('Западным Айроноем','western_aironoi_encyclopedia_desc')] лежит необъятная [Glossary('Ольтенская степь','great_steppe_encyclopedia_desc')]. Перед нами во все стороны расходятся бескрайние поля волнистой травы, и степь видна до самого горизонта. Почти ничто не нарушает плоского однообразия ландшафта, кроме редких стад животных, мигрирующих через эти просторы. Ночи ледяные, суровый ветер почти каждый час бьёт по телу. Здесь трудно не чувствовать себя совершенно несчастным, но, будем надеяться, мы найдём что-нибудь стоящее."
 great_steppe_encyclopedia_desc:90 "#BOL Ольтенская степь#! — огромное открытое пространство, тянущееся от Айронойских гор в [Glossary('Западном Айроное','western_aironoi_encyclopedia_desc')] до [Glossary('реки Каширият','kasiryat_encyclopedia_desc')] на далёком востоке. Когда-то степь считали частью Айронойского губернаторства, но издавна она была домом кочевого ольтенского народа. В степи мало приметных ориентиров или географических меток, и для тех, кто не привык к таким переходам, эта земля может быть весьма опасной."

 ## SOUTHEAST ##

 aironoian_southeast_name:90 "Юго-Восток Айроноя"
 aironoian_southeast_intro_desc:90 "Каньоны и лесистые холмы [Glossary('Юго-Востока Айроноя','aironoian_southeast_encyclopedia_desc')] обладают суровой прелестью. Сильные холодные ночные ветры соответствуют сухому воздуху и тяжёлому дневному зною. Наш путь через низкие кустарники сменяется бурыми полями и густыми зарослями можжевелового редколесья выше в холмах. В глубоких тропах каньонов следует быть осторожными — по слухам, там таятся опасные чудовища, — но, глядя с плато на окружающую глушь, мы всё же не можем не надеяться на лучшее."
 aironoian_southeast_encyclopedia_desc:90 "Глубокие каньоны, лесистые плато и каменистые месы господствуют в #BOL Юго-Востоке Айроноя#!, пересекая регион вплоть до Красных земель дальше на юге. В низинах встречаются главным образом сухие кустарники и разбросанные равнины, на высоте уступающие место сосново-можжевеловым лесам. Регион иссушен, с немногими источниками и скудными дождями круглый год. Разнообразная фауна юго-востока простирается от мелких грызунов и рептилий до куда более крупных медведей и антилоп редколесья. Глубоко под каньонами лежит несколько огромных водоносных горизонтов, снабжающих водой большую часть региона. [Concept('aversaria','Аверсарианцы')|E] часто называли этот край проклятым из-за частых вспышек болезней в аверсарианских крепостях, хотя в местных общинах почти не видно свидетельств этому."

 ## COAST ##

 fools_coast_name:90 "Берег дураков"
 fools_coast_intro_desc:90 "$generic_intro_desc$"
 fools_coast_encyclopedia_desc:90 "Берег дураков — на удивление мирная и малонаселённая земля, зажатая между [Glossary('рекой Каширият','kasiryat_encyclopedia_desc')] на востоке, Тропами Валдрика на севере и [Glossary('Красными землями','redlands_encyclopedia_desc')] на западе. Несмотря на окружение, она чрезвычайно гостеприимна: приятные океанские ветры с юга охлаждают влажные и горячие пески южного Айроноя, а огромное разнообразие дикой природы и зелени остаётся достаточно разреженным, чтобы не мешать человеческому жилью. Словно этого мало для будущих поселенцев, область считается одной из богатейших золотом в мире, и почти все заметки исследователей, посещавших её, бесконечно восхищаются особым блеском и оттенком местных рек, зеленовато-золотых из-за кажущегося бесконечным притока золотых чешуек.\n\nИ всё же край почти полностью свободен от постоянных чужеземных поселений, а его богатства в основном не тронуты. Хотя безлюдность Берега дураков объясняют разными причинами, главной остаётся давшее ему имя [fools_curse|E] — исключительно смертельная болезнь, будто бы переносимая золотом и драгоценными камнями, вынесенными из региона, к которой иммунитет есть только у местных. Поскольку большая часть воды и главный предмет интереса к региону действуют как буквальный яд, Берег дураков остаётся прекрасной, живой и пустой средой."

 ## AMAGHEA ##

 amaghea_mountains_name:90 "Амагея"
 amaghea_mountains_intro_desc:90 "$generic_intro_desc$"
 amaghea_mountains_encyclopedia_desc:90 "Зажатая между [Glossary('Латунным морем','brass_sea_coasts_encyclopedia_desc')] и горами Армазли, #BOL Амагея#! характеризуется влажными лесами чёрной ольхи у побережья, которые по мере подъёма постепенно сменяются обширными и зрелищными горными лугами и редкими рощами армазлийской пихты. Чрезвычайно неровный, изрезанный утёсами рельеф и нехватка естественного укрытия дали местным исключительное преимущество в строительстве замков — искусстве, в котором они весьма преуспели. Хотя регион прежде всего известен эндемичными пегасами, живущими на его травяных землях, в местах, куда знают путь лишь опытные охотники, скрываются и куда более опасные существа, например загадочные деви."

 ## SEA ##

 brass_sea_coasts_name:90 "Побережье Латунного моря"
 brass_sea_coasts_intro_desc:90 "[Glossary('Побережье Латунного моря','brass_sea_coasts_encyclopedia_desc')] липнет влажностью, пока мы идём через высокую траву и болота. Дневной зной и вечерняя прохлада словно пристают к коже: пот почти не испаряется. Я просыпаюсь потным и ложусь спать всё таким же липким с головы до ног. Немногие дороги, пересекающие регион, давно остались позади, и чем ближе к берегам мы идём, тем глубже тонем в грязи. Стрекот и жужжание насекомых, кажется, сопровождают нас постоянно, заставляя побережье казаться живым не меньше любого города. Остаётся надеяться, что добыча здесь так же обильна, как эти насекомые."
 brass_sea_coasts_encyclopedia_desc:90 "Низменное #BOL Побережье Латунного моря#! поддерживает разнообразную экосистему барьерных островов у берега, солончаковых болот вокруг заливов и реликтовых прерий. Вода здесь теплее, чем в Море Империй, и дикая жизнь приспособилась соответственно. Многие мигрирующие стада проходят по этим берегам на пути через степь, поскольку пищи и воды здесь больше, чем дальше в глубине суши. Несмотря на шрамы войн, эти берега остаются прекрасным зрелищем для путников."

 ## KREHEJAD ##

 krehejad_name:90 "Крехеджад"
 krehejad_intro_desc:90 "Сказания и легенды говорят, что [Glossary('Крехеджад','krehejad_encyclopedia_desc')] когда-то был покрыт пышным дождевым лесом, но сейчас об этом едва ли догадаешься: на юге ландшафтом правят пашни, на севере — сухой чапарраль. Что не изменилось с начала времён, так это знаменитые чёрные пляжи и бесчисленные вулканические черты, отмечающие эту землю.\n\nДаже издали видно, как из нагорий зловеще поднимаются несколько столбов дыма, хотя местные уверяют нас, что обычно это не повод для тревоги. Если мы хотим охотиться на более привычную дичь, прибрежные низины — надёжный выбор, хотя по-настоящему опасных существ там теперь немного. Вулканические нагорья, однако, наверняка таят куда более серьёзные испытания, если мы решим их искать..."
 krehejad_encyclopedia_desc:90 "Один из самых вулканически активных районов во всём Аэрасе, архипелаг #BOL Крехеджад#! славится чёрными пляжами, горячими источниками, серными бассейнами, фумаролами и гейзерами. За исключением некоторых глубоких внутренних областей, регион на деле довольно пригоден для жизни и плодороден; в частности, Великий Крехеджад когда-то был покрыт дождевым лесом на юге, большую часть которого давно вырубили под земледелие, постепенно переходившим в чапарраль на севере.\n\nЭто, однако, не значит, что геологическая нестабильность региона не была постоянной угрозой для местных. Землетрясения здесь обычны, а вулканические извержения не раз уничтожали города в ходе истории; два особенно мощных события, в 57 и 904 годах от И.С. соответственно, фактически привели к краху местной цивилизации."

 ## INTERIOR ##

 continental_interior_name:90 "Внутренние области континента"
 continental_interior_intro_desc:90 "$generic_intro_desc$"
 continental_interior_encyclopedia_desc:90 "Внутренними областями континента называют огромные пространства земли, целиком поглощённые [Concept('the_fog','Туманом')|E]. Когда-то прекрасные леса, пологие долины и широкие виды встречались по всему Континенту, но всё это потеряно для #BOL Туманных земель#! и уже никогда не будет возвращено."
 
 ## KHARADAMAT ##

 kharadamat_name:90 "Харадамат"
 kharadamat_intro_desc:90 "Хотя [Glossary('Харадамат','kharadamat_encyclopedia_desc')] больше известен духовным значением для ритуализма, его также считают одним из лучших охотничьих регионов северного [Concept('sarradon','Саррадона')|E] — как для любителей, так и для профессионалов. Непроходимые кедровые леса этих мест резко контрастируют с сухим чапарралем и пустынями, характерными для остального континента, и легко соперничают даже с [Concept('kalath_redwoods_biozone','Лаодантинскими лесами')|E] или самыми густыми лесами Катраддии.\n\nКогда мы сходим с колеи старого, исхоженного паломнического пути, вокруг остаётся лишь одиночество кедровой глуши. Солнце над головой светит ярко, но полог оставляет нас в приятной тени, и мы отправляемся на охоту в хорошем настроении."
 kharadamat_encyclopedia_desc:90 "Помимо того что полуостров #BOL Харадамат#! является местом Софокоса и родиной ритуализма, он, пожалуй, больше всего знаменит своими обширными густыми кедровыми лесами. Разнообразная фауна отражает его положение на перекрёстке между [Concept('sarradon','Саррадоном')|E] и [Concept('the_continent', 'Расколотым побережьем')|E]: гули и крокодилы встречаются здесь рядом с одними из немногих популяций медведей и оленей на всём Саррадонском континенте."
 
 ## SIHNAMIYAH ##

 sinhamiyah_name:90 "Сихнамия"
 sinhamiyah_intro_desc:90 "Плодородные поймы [Glossary('Сихнамии','sinhamiyah_encyclopedia_desc')] видели взлёт и падение бесчисленных обществ; руины, древние как само время, здесь так обычны, что если присмотреться, одну-две почти всегда можно заметить на горизонте. Пока держишься крупных водных путей, цивилизация обычно недалеко, как и всё, что можно собрать в пищу.\n\nХотя среда здесь приятна, возле рек следует смотреть под ноги и остерегаться хищников, а опасные существа, как говорят, таятся и в редких местных рощах, и в пустынной глубине."
 sinhamiyah_encyclopedia_desc:90 "Будучи местом городской цивилизации с начала записанной истории, #BOL Сихнамию#! также иногда зовут «садом [Concept('sarradon','Саррадона')|E]» за плодородие и лёгкий доступ к пресной воде. Хотя здесь есть редкий и лёгкий лесной покров, большая его часть давно вырублена под земледелие. В наши дни регион в основном занят поймами, пашнями и лугами у рек, а в остальных местах — чапарралем."
 
 ## COAST ##

 sirwali_coast_name:90 "Сирвалийское побережье"
 sirwali_coast_intro_desc:90 "[Glossary('Сирвалийское побережье','sirwali_coast_encyclopedia_desc')] во многом обязано своей красотой резкому соседству опустошения и плодородия. На одном горизонте не видно ничего, кроме бесконечной палящей пустыни, а на другом — побережье, цветущее морской жизнью и красками. Немногим удалось укротить и надолго заселить эту завораживающую область, и потому она остаётся почти не тронутой рукой человека.\n\nДобраться сюда было непросто. Сухопутные пути требуют перехода через беспощадную пустыню, а путь морем — навигации среди коварных рифов, которыми регион так знаменит. И всё же мы наконец прибыли. Разумеется, мы провели несколько дней, наслаждаясь местными пляжами в полном одиночестве, но теперь сосредоточились на истинной цели нашего визита."
 sirwali_coast_encyclopedia_desc:90 "Лазурное побережье, местным известное как #BOL Сирвали#!, — безлюдная полоса берега между северо-востоком [Glossary('Саррадонской пустыни','sarradonian_desert_encyclopedia_desc')] и Морем Империй. Хотя в глубине суши здесь почти нет ничего, кроме палящей пустыни, регион славится красивой морской водой того самого лазурного цвета, широкими жемчужно-белыми пляжами и одними из крупнейших и самых ярких коралловых систем на Аэрасе."

 ## GHAZIR ##

 al_ghazir_name:90 "Аль-Газир"
 al_ghazir_intro_desc:90 "У мрачного восточного острова [Concept('sarradon','Саррадона')|E] неоднозначная репутация. С одной стороны, [Glossary('Аль-Газир','al_ghazir_encyclopedia_desc')] важен и для [Concept('ritualism','ритуализма')|E], и для [Concept('wardenism','варденизма')|E]; с другой — в народном воображении он окружён зловещей мистикой и дурными предзнаменованиями. Детские сказки о чудовищах, скрывающихся здесь, и крестьянские суеверия о древних проклятиях не становятся менее убедительными от того, что эта местность действительно полна призраков, хотя причины этого неизвестны.\n\nНеудивительно, что погода здесь скверная и пасмурная, как почти всегда. Привычный стрёкот сверчков полностью отсутствует; лишь тихий ветер хоть немного нарушает полную тишину."
 al_ghazir_encyclopedia_desc:90 "#BOL Аль-Газир#! — или просто «Остров» по-саррадонски (иногда также «Восточный остров») — один из крупнейших островов Моря Империй, имеющий религиозное значение как для [Concept('ritualism','ритуалистов')|E], так и для [Concept('wardenism','варденитов')|E]. Экологически он представляет собой смесь чапарраля на западе, кедровых лесов на востоке и засушливых гор во внутренних землях. Особо примечательны странный климат острова — большую часть года пасмурный — и аномальное обилие духов и других [Concept('magic','магических')|E] явлений, бродящих по земле."

 ## VALLEY ##

 khenemhat_name:90 "Долина Хенем"
 khenemhat_intro_desc:90 "Зажатая с обеих сторон внушительными горными хребтами, [Glossary('долина Хенем','khenemhat_encyclopedia_desc')] по большей части лишь немного менее суха и бесплодна, чем окружающая пустыня. Выжженные кустарники господствуют почти во всём регионе, за двумя заметными исключениями: самой великой рекой, где обитает богатая водная фауна, и прекрасными, но изолированными вади, бесчисленно стекающими с хребта Мал-Бирам.\n\nМы начинаем охоту у самого Хенема, хотя, если нам захочется приключений, с местным проводником можно исследовать и знаменитые вади региона. Местность на возвышенностях сурова и камениста, но великая река видна почти с любой точки, и риск заблудиться, к счастью, невелик."
 khenemhat_encyclopedia_desc:90 "Расположенный вдоль дороги Гонан, соединяющей северный и центральный [sarradon|E], #BOL Хенемхат#! — регион, где чапарраль на севере постепенно переходит в узкую полосу пышных болот на юге. Особого внимания заслуживают обширные системы вади, берущие начало в близких нагорьях и до сих пор не нанесённые на карту полностью."
 
 ## DESERT ##

 sarradonian_desert_name:90 "Саррадонская пустыня"
 sarradonian_desert_intro_desc:90 "Палящие глубины [Glossary('Саррадонской пустыни','sarradonian_desert_encyclopedia_desc')] обладают почти чуждой красотой. Куда ни взгляни — лишь золото песка и синева совершенно чистого неба, а полное однообразие нарушают только волнообразные дюны. Здесь можно пройти сотни лиг в любом направлении и, вероятно, никогда не пересечь землю, которую за всю историю [Concept('aeras','Аэраса')|E] посещала другая человеческая душа.\n\nМы позаботились взять столько пресной воды, сколько смогли унести верблюды, и наняли местного проводника, искусного в навигации по ночному небу. Заблудиться здесь — почти верное самоубийство."
 sarradonian_desert_encyclopedia_desc:90 "Бескрайнее море песка, покрывающее север внутренних областей [Concept('sarradon','Саррадона')|E], — одно из самых негостеприимных мест мира. Очень немногие обычные [Concept('creature','существа')|E] называют это место домом, но почти полное отсутствие человеческого жилья означает, что [Glossary('духи','animal_type_spirit_encyclopedia_desc')] и другие [Concept('magic','магические')|E] существа встречаются здесь в необычайно большом числе."
 
 ## MOUNTAINS ##

 sarradonian_mountains_name:90 "Саррадонские горы"
 sarradonian_mountains_intro_desc:90 "Выжженные солнцем [Glossary('Саррадонские горы','sarradonian_mountains_encyclopedia_desc')], окаймляющие север [Concept('sarradon','Саррадона')|E], столь же внушительны, как само Небо."
 sarradonian_mountains_encyclopedia_desc:90 "На востоке пастухи приветствуют солнце, когда оно поднимается над низкими вершинами хребта Амаувф, а на западе земледельцы провожают его, когда оно уходит за зубчатые острия Тарсанид. #BOL Саррадонские горы#! господствуют над этим континентом, как ни одна другая черта. Три крупных хребта нависают над зверями и людьми, образуя стену из сухого, выбеленного солнцем камня. Эта преграда отделяет Северный Саррадон с его богатыми городами, реками, военачальниками и дородными купцами от внутренних земель, укрывая более утончённых жителей континента от жестокости великой внутренней пустыни. Разделяя эти два разных мира, горы Саррадона переняли что-то от каждого. Здесь долины зеленеют, питаемые прохладными сладкими источниками и тающим снегом. И здесь же есть суровые тропы по скалистым склонам и высокогорные плато, никогда не знавшие прикосновения дождя. Даже там, где Саррадонские горы наиболее гостеприимны, путнику стоит опасаться скрытых угроз: львы, мантикоры и пещерные медведи здесь обычны, не говоря уже о рассказах местных племён о более странных, загадочных и смертоносных зверях."
 
 ## BONEYARD ##

 boneyard_name:90 "Костяной погост"
 boneyard_intro_desc:90 "$generic_intro_desc$"
 boneyard_encyclopedia_desc:90 "Мало что можно сказать о регионе, зажатом между лазурными водами [Glossary('Сирвалийского побережья','sirwali_coast_encyclopedia_desc')] и великой [Glossary('Саррадонской пустыней','sarradonian_desert_encyclopedia_desc')]. Многим он известен как Костяной погост, названный так за бесчисленные останки, усеивающие землю, среди которых самый знаменитый — [the_worldeater|E]. Это сеть изрезанных каньонов, где костяные выступы соседствуют с плодородными оазисами. Пусть ландшафт и его фауна многим кажутся странными и чуждыми, полными огромных древних зверей, непохожих ни на что виденное на [Concept('aeras','Аэрасе')|E], регион изобилен благодаря бесконечному выпасу спокойных исполинов, оставляющих после себя плодородную почву с пышной растительностью."

 ## COAST ##

 ayyar_coast_name:90 "Айярское побережье"
 ayyar_coast_intro_desc:90 "Мы давно оставили мягкие пашни у городской окраины ради волнистых полей сухой травы и густого кустарника. Несмотря на враждебные земли вокруг [Glossary('Айярского побережья','ayyar_coast_encyclopedia_desc')], жизнь сумела здесь расцвести. Краски проступают среди вереска и ягодников, мягкой волной оттенков проходя по зелёным зарослям. Вдали я вижу тонкую линию нескладных деревьев, скрывающих всё, что лежит за ними, кроме возвышающихся над головой гор.\n\nПробираться сквозь кустарник труднее, чем кажется: мелкие и крупные шипы способны искалечить ребёнка или неосторожного пьяницу. Жара далека от невыносимой, но всё же берёт своё. Когда мы наконец разбиваем лагерь, мне удаётся найти вид на окрестности и наблюдать, как поля колышутся на фоне огромного океана к северу."
 ayyar_coast_encyclopedia_desc:90 "#BOL Айярское побережье#! охватывает кустарниковые земли и субтропические широколиственные леса, тянущиеся от реки Лахкорини до западных склонов Тарсанид. Большая часть региона состоит из густых вечнозелёных верещатников и ягодных кустарников, которые редеют к скудным поймам и пустыне дальше в глубине. В далёком прошлом регион был куда более лесистым, но после отвода реки Кемсар некогда туманные леса быстро высохли и поредели.\n\nЛесные пожары уничтожили большую часть оставшегося, и то, что уцелело, тянется полосами вдоль рек Лахкорини и Ташкорф, уходя к северу и югу разрозненными рощами у гор. Финиковая слива и сиреневый хурмовник обычны в этих малых остаточных лесах, но путникам не стоит свободно брать плоды с деревьев и кустов: многие виды ядовитой флоры всё ещё процветают в лесах и верещатниках. Среди обычной фауны здесь встречаются страусы и гиены, хотя ходят слухи, что в глубокой глуши таятся куда более странные существа."

 ## DAMOTA ##

 damota_name:90 "Дамота"
 damota_intro_desc:90 "Окружённые горами джунгли [Glossary('Дамоты','damota_encyclopedia_desc')] давно слывут домом таинственных и необъяснимых существ, которых редко видят даже уроженцы региона. Бесконечное зелёное море тянется от горизонта до горизонта, прерываемое лишь трудом людей и Этами Бияки — великими озёрами края. По мере нашего продвижения в Дамоту высокие деревья закрывают солнце, и только тонкие лучи света добираются до лесной земли сквозь густой полог.\n\nДаже в середине дня, когда солнце прямо над головой, порой приходится зажигать факелы или магические огни, чтобы видеть землю перед собой; неудивительно, что в этой яркой и пышной темноте легко потеряться. Вокруг нас роятся насекомые, жужжа во влажном воздухе, который словно давит на плечи. Говорят, джунгли — владения величественных кошек, но тот, кто прислушается к местным сказкам или кому просто не повезёт, может найти в зелёных глубинах нечто куда более зловещее и смертоносное."
 damota_encyclopedia_desc:90 "Изолированная земля #BOL Дамота#! со всех сторон окружена горами, удерживающими её уникальных и необъяснимых обитателей внутри густых джунглей. Глубокий полог накрывает весь регион, прерываясь только городами Дамоты и Этами Бияки, или великими озёрами, питающими край водой. Джунгли служат домом разнообразной фауне — от величественных больших кошек до куда более крупных дамотских слонов и горилл. Поистине, это земля, не похожая ни на какую другую."

 ## CYRAT ##

 cyrat_name:90 "Кират"
 cyrat_intro_desc:90 "Тем, кто родом не из ближайших земель, рассказы о гибельной природе [Glossary('Кирата','cyrat_encyclopedia_desc')] могут казаться всего лишь преувеличенными слухами об отдалённом, разве что чуть необычно опасном регионе дождевых лесов, почти не тронутом рукой человека.\n\nОднако даже короткий путь по окраине джунглей быстро избавляет любого гостя от таких мыслей. Наш поход пока был совершенно мучительным: влажность душит, тучи комаров не дают покоя ни на миг, а земля, не покрытая почти непроходимой листвой, представляет собой смесь слизеподобной грязи и воды. И это не говоря уже об огромных силуэтах, время от времени пролетающих над головой, или об эхо далёких рыков, от которых, кажется, дрожит сама земля..."
 cyrat_encyclopedia_desc:90 "Расположенный на восточном выступе [Concept('sarradon','Саррадона')|E], #BOL Кират#! — огромные джунгли, пользующиеся дурной славой из-за полной враждебности к любой жизни, не приспособленной к их экстремальным условиям. Хотя огромная и свирепая флора и фауна считаются самой известной опасностью, зубчатый рельеф, на котором лежит дождевой лес, и тропические болезни под его пологом сами по себе остаются грозными убийцами."

 ## KRATEMEZIN ##

 crater_name:90 "Кратемезин"
 crater_intro_desc:90 "[Glossary('Кратемезин','crater_encyclopedia_desc')] настолько безобиден для тропического региона, насколько вообще можно представить: дождевой лес, где он есть, редок и в основном населён существами, почти не опасными для людей. Заблудиться здесь практически невозможно, поскольку окружающая горная цепь постоянно служит ориентиром.\n\nЗапах океана не исчезает никогда, как и редкие звуки великих саратанов, обитающих в его водах. Великий Кратер славится богатой морской жизнью не меньше, чем идиллическим побережьем, и решим ли мы охотиться на суше или в море, вряд ли уйдём разочарованными."
 crater_encyclopedia_desc:90 "Великий кратер #BOL Кратемезин#! — мелкое тропическое море, окружённое узкой полосой плодородного побережья на северо-востоке [Concept('sarradon','Саррадона')|E]. Богатая морская жизнь, в целом приятная, пусть и влажная, погода и хорошо возделанный ландшафт — главным образом сельскохозяйственные болота и лёгкий дождевой лес — делают эту область одной из самых идиллических в тропическом поясе континента.\n\nПожалуй, самые знаменитые местные обитатели — великие саратаны, блуждающие по мелководью залива; такие существа наблюдались лишь в немногих других регионах всего известного мира."

 ## MANGROVES ##

 rojihlat_name:90 "Рожихлатские мангры"
 rojihlat_intro_desc:90 "$generic_intro_desc$"
 rojihlat_encyclopedia_desc:90 "#BOL Рожихлатские мангры#! тянутся от южного края [Glossary('Кратемезина','crater_encyclopedia_desc')] до Каменного залива. Рифы и песчаные косы защищают большую часть береговой линии, давая надёжное укрытие обильным лесам, илистым равнинам и разбросанным мангровым островкам. Хотя флора здесь неизменно красива — массивные оранжевые мангры по мере продвижения вглубь сменяются белыми и чёрными, — регион не отличается большим цветочным биоразнообразием. Переход через леса часто считают простым и почти спокойным из-за открытых и удобных водных путей, хотя внутренние области куда коварнее из-за огромных залежей торфа."
 
 ## AEKERSHAAN ##

 aekershaan_name:90 "Акерсхан"
 aekershaan_intro_desc:90 "$generic_intro_desc$"
 aekershaan_encyclopedia_desc:90 "#BOL Акерсхан#! — название кратера к западу от залива Ринах и [Glossary('Кратемезина','crater_encyclopedia_desc')]. Регион хорошо известен резкими экологическими контрастами при смене высоты. Его верхние области состоят из разрозненных кустарников под горами, окружающими кратер и иссечёнными песчаным ветром. Ниже кустарники уступают место сухим лугам и одиноким деревьям. На самых низких высотах, благодаря богатым почвам, лежит большая часть местных пашен, а также смешанные тропические облачные леса.\n\nХотя фауна региона может сильно меняться из-за контрастных климатов, козы меззарб, как известно, живут по всему Акерсхану и повсеместно используются как верховые и вьючные животные во всех трёх слоях кратера."

 ## AMSAR ##

 amsar_name:90 "Амсар"
 amsar_intro_desc:90 "$generic_intro_desc$"
 amsar_encyclopedia_desc:90 "#BOL Амсар#! — земля огромного экологического разнообразия, за долгие века пережившая резкие перемены как среди людей, так и среди животных. В глубокой древности он был известен как засушливый край. В те дни лишь немногие счастливые области нижнего Амсара имели достаточно воды, чтобы поддерживать скудную растительность и кочевое земледелие. Сегодня тот же регион — пышный рай, пересечённый фермами, садами и ухоженными лесами, которые знать держит как охотничьи угодья. Только горы Амсара почти не изменились с той почти забытой эпохи. Мрачные, огромные и пронизанные лабиринтом загадочных каменных дорог, протянутых по вершинам и долинам, они умеют поглощать даже самых подготовленных путников.\n\nДичи в Амсаре в изобилии, во многом благодаря усилиям скучавших канамсаров прошлых веков, велевших завезти зверьё, которого недоставало их некогда пустынной земле. Большинство этих животных безвредны, но волки, львы и другие опасные хищники укоренились во внутренних землях благодаря переменчивой страсти к приключениям, свойственной часто эксцентричной высшей знати Хиклахна.\n\nЭтим же вельможам можно благодарить и за то, что древнейших и страннейших обитателей долины Амсара вытеснили вверх, в горы, превратив саму долину в место спокойствия и безопасности. И всё же среди великих древних вершин до сих пор таятся сущности с зари времён, завистливо взирающие на зелёную и щедрую долину внизу."

 ## KEMSAR ##

 kemsar_name:90 "Кемсар"
 kemsar_intro_desc:90 "Расположенный на западе [Concept('sarradon','Саррадона')|E], [Glossary('Кемсар','kemsar_encyclopedia_desc')] — сухая пустошь жарких дней и холодных ночей. Растительности почти нет, и выживают здесь только самые сильные и безжалостные животные: например, крайне ядовитые и неуловимые ужасные скорпионы или ужасные скарабеи, печально известные нападениями на ничего не подозревающих путников. Они атакуют роями и оставляют после себя лишь выбеленные солнцем кости.\n\nМы с охотничьей партией одеты в плащи и традиционные головные уборы, которые местные кочевники носят для защиты от палящего солнца. Наш проводник обошёлся дёшево: странный человек попросил плату только водой. Теперь он ведёт нас через раскалённые дюны, а я думаю о том, что ждёт нас в этой пустоши, так далеко от всего остального."
 kemsar_encyclopedia_desc:90 "Расположенный к западу от [Concept('sarradon','Саррадона')|E], #BOL Кемсар#! — край обширных дюн и засушливых бедлендов с немногими разбросанными оазисами. Когда-то он был колыбелью Кемсарской империи, от которой остались лишь руины; несмотря на прошедшее время, они всё ещё стоят памятниками по всей пустыне. Потомки древних кемсари, рассеянные по палящим пескам, теперь ведут кочевую жизнь, борясь за выживание рядом с опасной фауной, называющей эти дюны домом."
 
 ## KASIRYAT ##

 kasiryat_name:90 "Каширият"
 kasiryat_intro_desc:90 "Прохладный ветер с [Glossary('Каширията','kasiryat_encyclopedia_desc')] поддерживает наш дух на пути в высокую траву. Каждый стебель почти достаёт мне до живота, из-за чего трудно понять, на что именно я наступаю, но идиллические речные берега считаются довольно спокойными по сравнению с большинством окрестных регионов.\n\nКогда мы наконец находим возвышение над колышущимися полями, я могу охватить взглядом пышную глушь: разбросанные остатки лесов, одинокие деревья в море зелёных стеблей, мягко склоняемых сильным ветром. Интересно, каких существ мы найдём здесь."
 kasiryat_encyclopedia_desc:90 "#BOL Каширият#! — крупная река, отделяющая земли Айроноя от [Concept('kashirya','Каширии')|E] на востоке. Широкие полосы плодородных равнин и болот отделяют реку от степи дальше на западе и от [Glossary('Северных гор Харадан','north_kharadan_encyclopedia_desc')] на востоке. Поля Каширията представляют собой мозаику высоких прибрежных лугов и почти вечнозелёных лесов, редеющих по мере удаления от пресной воды. Животные со всего Айроноя и Каширии встречаются вдоль реки, что делает её популярным местом и для путников, и для охотников."

 ## MOUNTAINS ##

 north_kharadan_name:90 "Северные горы Харадан"
 north_kharadan_intro_desc:90 "Охота в [Glossary('Северных горах Харадан','north_kharadan_encyclopedia_desc')] необычна, мягко говоря. Принято считать, что даже самые свирепые элементали, живущие на их снежных вершинах, бледнеют перед опасностью самой среды. Даже если погода всё время останется ясной, рельеф означает, что кое-где нам, вероятно, придётся взбираться почти отвесно; если же нас настигнет один из чудовищных буранов, регулярно поглощающих эти места, мы, скорее всего, уже мертвы.\n\nМы сделали всё возможное, чтобы подготовиться к этому пути, насколько человек вообще может быть готов, — и всё равно чувствуем себя до боли неподготовленными к предстоящему делу. Когда последние леса вокруг сменяются мрачным камнем и мы встречаем первые пятна снега, перед нами наконец открывается совершенно ясный вид на горный хребет впереди — нет, #BOL над#! нами, — оставляя последнюю возможность передумать и решить, стоит ли затея такого риска."
 north_kharadan_encyclopedia_desc:90 "#BOL Северные горы Харадан#! — дом одних из высочайших вершин на [Concept('aeras','Аэрасе')|E], причём даже большинство их «меньших» пиков заставляют внушительные горы остального мира казаться жалкими холмами. Как и следовало ожидать, среда здесь враждебна почти всякой жизни: столь коварный рельеф, что для перехода нужны магия или специальное снаряжение, постоянный снежный покров и крайне непредсказуемая погода означают, что обитателей здесь мало — немногочисленные узкоспециализированные обычные животные и, что важнее, элементали."

 ## HYRATAN ##

 hyratan_name:90 "Хайратан"
 hyratan_intro_desc:90 "Добраться до [Glossary('Хайратана','hyratan_encyclopedia_desc')] и его глуши нелегко: большинство путей в регион настолько опасны, что даже пытаться ими идти не стоит, и лишь несколько ущелий и долин позволяют пройти сравнительно безопасно. Попав внутрь, идти становится несколько легче, но видимость и ориентация, напротив, превращаются в серьёзную проблему: все соседние вершины, кроме самых высоких, полностью скрыты плотным сосновым пологом над головой.\n\nЧистый горный воздух встречает нас, когда мы поднимаемся в эти земли, и мы идём вверх по течению небольшой реки, пока окрестные луга не редеют до пустоты и не сменяются густым хвойным лесом. Пора погрузиться во мрак Хайратана."
 hyratan_encyclopedia_desc:90 "Расположенные среди одних из высочайших гор мира, великие долины #BOL Хайратана#! покрыты густыми сосновыми лесами, лишь изредка прерываемыми горными лугами — чаще всего там, где есть человеческое жильё, или ближе к каменистым высотам. Из-за сравнительно редкого населения, исключительной лесной плотности и общей мистической репутации регион вошёл в каширийские народные сказания как место чудесных и ужасных монстров. Иногда эти существа оказываются не просто историями."

 ## PLAIN ##

 darmirat_plain_name:90 "Дармиратская равнина"
 darmirat_plain_intro_desc:90 "$generic_intro_desc$"
 darmirat_plain_encyclopedia_desc:90 "#BOL Дармиратская равнина#! — большая аллювиальная равнина, лежащая во внутренней части северной [Concept('kashirya','Каширии')|E] у [Glossary('плато Магийор','magiyor_encyclopedia_desc')] дальше на юге. Бесчисленные ручьи и речушки текут по равнинам, принося с гор почвенные отложения. Исполинские скальные формации, видные из любой точки окрестных земель, возвышаются над немногими муссонными лесами региона, которые почти круглый год сохраняют вечнозелёный цвет. Крупнейшие буйволы на [Concept('aeras','Аэрасе')|E], гауры, встречаются здесь в большом изобилии."

 ## FLATS ##

 kashti_flats_name:90 "Солончаки Кашти"
 kashti_flats_intro_desc:90 "$generic_intro_desc$"
 kashti_flats_encyclopedia_desc:90 "#BOL Солончаки Кашти#! когда-то были крупной дельтой, давно высохшей из-за изменений уровня моря за прошедшие тысячелетия; после неё осталась обширная сеть солончаковых болот вдоль северного побережья Каширии. Полосы почти засушливых лугов отделяют солончаки от внутренних земель, но сами болота известны жарой, способной соперничать даже с [Concept('sarradon','Саррадоном')|E]. Солёная глина и илистые равнины наполняются стоячей водой в сезон муссонов, а в особенно влажные годы продвигаются дальше к югу. Фламинго часто встречаются по всем солончакам и используют немногие разбросанные островки, возвышающиеся над уровнем моря, как места гнездования во время высоких разливов."

 ## PLATEAU ##

 magiyor_name:90 "Плато Магийор"
 magiyor_intro_desc:90 "Знаменитая земля цветения Зимнего Огня, [Glossary('плато Магийор','magiyor_encyclopedia_desc')] считается одним из главных охотничьих угодий [Concept('kashirya','Каширии')|E]. В основном приятная, хотя порой бодрящая, погода круглый год, лёгкая навигация и отсутствие природных опасностей позволяют любому приезжему охотнику сосредоточиться именно на охоте, не отдавая много сил простому выживанию.\n\nПоднимаясь на плато, трудно не почувствовать подавляющую широту пространства. К северу стоят одни из самых высоких и мрачных горных вершин мира, а вокруг тянется, кажется, бесконечный луг, лишь иногда прерываемый ярко-синей рекой или одинокой сосновой рощей. Даже если охота не удастся, один вид, пожалуй, уже стоил дороги."
 magiyor_encyclopedia_desc:90 "Горные луга #BOL плато Магийор#! лежат в тени колоссальных [Glossary('Северных гор Харадан','north_kharadan_encyclopedia_desc')], хотя сами лишь мягко холмисты. Регион знаменит кристально-чистыми ледниковыми реками и ярким зимним цветением магиятинской огненной маргаритки — цветка с магическими свойствами, окрашивающего луга в огненно-янтарный цвет и испускающего достаточно тепла, чтобы жизнь процветала так, будто суровой горной зимы вовсе нет."

 ## FOOTHILLS ##

 kafasali_name:90 "Предгорья Кафасали"
 kafasali_intro_desc:90 "Стоя в [Glossary('предгорьях Кафасали','kafasali_encyclopedia_desc')], можно увидеть далеко впереди уступ [Glossary('плато Магийор','magiyor_encyclopedia_desc')], почти на одной линии с исполинскими горами, возвышающимися над ним к востоку. Мы давно отправились в глушь Кафасали, но путь идёт медленно. Кустарники и деревья, полные шипов, более чем успешно нас задерживают и оставили на каждом множество порезов и царапин, но хуже всего рельеф. На каждое ровное поле высокой травы и колючек находится другое, где каменные опоры уходят из-под ног при малейшем давлении. Вся крупная фауна, что нам пока попадалась, легко уходила от нас из-за нашей неуклюжести; если мы надеемся вернуться из этого предприятия с успехом, придётся следить за каждым шагом."
 kafasali_encyclopedia_desc:90 "#BOL Кафасали#! — название сухих полей, лесов и каменистых холмов, отделённых от северной [Concept('kashirya','Каширии')|E] [Glossary('плато Магийор','magiyor_encyclopedia_desc')]. Из-за плато, [Glossary('Северных гор Харадан','north_kharadan_encyclopedia_desc')] на востоке и высоких прибрежных холмов регион почти полностью защищён от муссонного сезона, что делает его одним из самых сухих мест Каширии. Большую часть глуши занимают субтропические листопадные леса и колючие кустарниковые леса. Волнистые поля полузасушливого кустарника разбиваются о скалы и каменные формы, возвышающиеся над окружающими лесами. Некоторые из этих огромных холмов и острых камней несут крепости и замки, сторожащие регион, хотя многие за века обратились в руины. Несмотря на полузасушливый климат, Кафасали поддерживает огромное разнообразие фауны, прежде всего птиц, о которых говорят, что их здесь больше, чем на всём [Concept('the_continent', 'Расколотом побережье')|E]."

 ## FORESTS ##

 vichacil_name:90 "Вичасильские леса"
 vichacil_intro_desc:90 "Наш путь в [Glossary('Вичасильские леса','vichacil_encyclopedia_desc')] был тяжёлым, но стоил усилий. Покрытая росой трава скользила под сапогами, когда мы поднимались к обзорной точке на вершине крутого холма, и я не раз едва не потерял равновесие, но какой же вид открылся перед нами. Низкие заболоченные земли побережья были ярки красками и движением городской жизни, а глубокая глушь, стоящая в долинах и рощах перед нами, мерцала словно поле молочного нефрита. Плотные туманные леса тянулись до горизонта, прерываемые высокими полосами водянистого подлеска и редкими плантациями, спрятанными под древним пологом.\n\nМы углубляемся дальше, следуя за змеящимся ручьём, бегущим через лес. Над головами поют певчие птицы, и их мелодия наполняет нас почти радостным настроением."
 vichacil_encyclopedia_desc:90 "#BOL Вичасильские леса#! идут по южному краю [Concept('kashirya','Каширии')|E] на восток, к мягким прохладным вершинам Южных гор Харадан. Холмы здесь густо поросли лесом и поддерживают огромную экосистему тропических горных облачных лесов, почти постоянно укрытых низкими облаками, которые дают лесам большую часть влаги. Вечнозелёная глушь переживает два муссонных сезона в год: один в середине зимы с запада, другой поздней весной с юго-востока. Низины у побережья не раз страдали от огромных паводков, некоторые из которых с тех пор затопили целые области; эти наводнения сильно повлияли на местных жителей и то, как они строят свою инфраструктуру. Холмы также чрезвычайно разнообразны, и многие виды фауны неизвестны больше нигде на Аэрасе. Здесь в изобилии встречаются бычьи и слоновые, хотя, говорят, в туманных уголках и глубинах леса скрываются куда более странные существа."

 ## KATUPPILAN ##

 katuppilan_name:90 "Катуппилан"
 katuppilan_intro_desc:90 "Дикие заводи [Glossary('Катуппилана','katuppilan_encyclopedia_desc')] считаются одним из самых таинственных и опасных мест для охоты во всей [Concept('kashirya','Каширии')|E]. Густой лабиринт мангр и болот затрудняет путь, но богатые и загадочные существа, которые, как говорят, скрываются в солоноватых глубинах, привлекают охотников и искателей приключений отовсюду. Не то чтобы они переживали дорогу, но мы надеемся на куда лучшую участь.\n\nИли, по крайней мере, надеялись. Катуппилан оказался опаснее, чем мы ожидали. Наша маленькая речная лодка уже получила достаточно повреждений от густых корней под поверхностью воды, чтобы вынудить нас высадиться на болотистую почву раньше, чем хотелось. Теперь на суше мы глубоко вошли в мангровую сеть, оставляя метки где только можем, чтобы не потеряться в этом водном лабиринте. Каждый шаг будто утягивает меня всё глубже в грязь, но нужно идти дальше. Надеюсь, обратную дорогу мы всё ещё найдём."
 katuppilan_encyclopedia_desc:90 "#BOL Катуппилан#! — название густых мангровых лесов и илистых равнин вдоль каширийских берегов. Этот огромный лес заполняет большую часть водных путей и речных систем юга, затрудняя продвижение во внутренние земли. Илистые равнины, болота и солоноватые воды широколиственных болотных лесов заселены больше, чем солёные леса дальше от берегов, которые остаются в основном необитаемыми. Зимний муссон ежегодно тяжело обрушивается на Катуппилан, и осадки в регионе остаются высокими круглый год. Во время прилива большая часть мангр полностью уходит под воду. Несмотря на богатство флоры и фауны этих мангр, местные жители обычно избегают заходить слишком глубоко из страха и суеверий перед обитающими там существами. Тигры, крабы и гигантские лягушки — лишь часть животных этих лесов, но, поскольку большая часть внутренних областей не нанесена на карту и необитаема, мангры хранят множество тайн."

 ## ROVARSKA ##

 rovarska_name:90 "Роварска"
 rovarska_intro_desc:90 "Мы вышли на лодке в извилистые водные пути [Glossary('Роварски','rovarska_encyclopedia_desc')]. Со всех сторон над островами поднимаются зелёные леса, а какофония насекомых и зверей гремит между густыми стволами и лианами. Стаи птиц взмывают в небо, танцуя по небесам в таком ритме, будто передают вести своим гнёздам внизу.\n\nК тому времени как мы достигаем берега необитаемого острова в глубине архипелага, большая часть моей одежды липнет от пота и влаги в воздухе. Лесная кромка стоит совсем рядом, и я вижу, как несколько обезьян скачут по пологу, пока мы готовим снаряжение для пути в дождевой лес."
 rovarska_encyclopedia_desc:90 "#BOL Роварска#!, или, как её чаще называют, #BOL «Пиратское побережье»#!, — архипелаг на границе Моря Империй и Восточного океана. Густые низинные дождевые леса покрывают большую часть островов, прерываясь только редкими горными лугами, пресноводными бассейнами и скалистыми вулканами. Чем глубже в архипелаг, тем более зубчатым становится рельеф — следствие тысячелетий вулканической активности, — и многим крупным кораблям трудно проходить по тесным и узким водным путям, разделяющим внутренние области. Рептилии и птицы всех форм и размеров обычны на островах, хотя путников часто предупреждают не заходить слишком глубоко в леса и не есть ничего, что не куплено у торговца. Ядовитые плоды и травы островов, не говоря уже о фауне, хорошо известны своей силой."
 
 ## COAST ##

 nightcoast_name:90 "Ночное побережье"
 nightcoast_intro_desc:90 "$generic_intro_desc$"
 nightcoast_encyclopedia_desc:90 "#BOL Ночное побережье#! — регион, охватывающий значительную часть юго-восточной [Concept('kashirya','Каширии')|E] и названный так за свои исключительные ночные свойства. Днём это сравнительно обычные тропические джунгли, но после заката регион наполняется такими яркими красками, что начинает казаться почти чужим.\n\nПрежде всего небо становится столь зрелищным, что даже самые чистые небеса в других частях мира в лучшем случае кажутся дешёвой имитацией. Оранжевый фон Горнила становится таким насыщенным, что напоминает пламя, затмевающее [aervalr|E]; Две Реки будто действительно текут; звёзды Леса принимают неестественные цвета и, как отмечают, напоминают цветение весенних цветов; а границы Пустоты становятся настолько чёткими и ясными, что многие при первом взгляде на эту великую «дыру в ночном небе» чувствуют головокружение. Даже созвездия низко над горизонтом, вроде северной полярной Короны, совсем не страдают от своего положения и видны так ясно, будто стоят прямо над головой.\n\nОднако эффект не ограничивается небом. Огромные популяции разноцветных светокораллов и биолюминесцентных морских существ освещают океан почти на уровне небесного свода. Прозрачность воды позволяет видеть каждую стаю светящихся рыб вплоть до столь же ярко освещённого дна, в ослепительном множестве цветов, при заметной особенности: существа схожей окраски часто держатся вместе. Даже на суше растения со светящимися цветами освещают джунгли настолько, что видимость нередко становится лучше, чем днём."
 
 ## DAHANGON ##

 nattanan_highlands_name:90 "Наттананское нагорье"
 nattanan_highlands_encyclopedia_desc:90 "#BOL Наттананское нагорье#! — суровый, дикий регион тропических дождевых лесов и зубчатых гор, господствующий на севере Дахангона. Эти сезонные нагорья переживают очень мягкие влажный и сухой сезоны, хотя в сухой сезон лесные пожары являются естественным явлением. Регион во многом делит флору с [Glossary('Вичасильскими лесами','vichacil_encyclopedia_desc')], но местная фауна хорошо известна отличительными полосатыми шкурами и багряно-красными оттенками."

 dahangon_lowlands_name:90 "Глинистое море Дахангона"
 dahangon_lowlands_encyclopedia_desc:90 "Болота, заболоченные земли и приречные коридоры #BOL Глинистого моря Дахангона#! образуют богатый и биоразнообразный регион, где, как говорят, живёт больше видов пресноводной рыбы, чем во всей [Concept('the_continent','Великой Аверсарии')|E]. Регион обладает уникальным явлением: отлив внутри суши оказывается ниже, чем морской прилив, из-за чего реки и болота в сезон дождей переполняются дождевой водой. Большинство животных приспособилось к жизни вдоль рек, например кошки-рыболовы. Дельфины и гигантские сомы здесь обычное зрелище, как и свирепые крокодилы."


 ## ERIPOMVUNO ##

 eripomvuno_name:90 "Эрипомвуно"
 eripomvuno_intro_desc:90 "После довольно тревожного пути к острову мы наконец достигли «пляжа» [Glossary('Эрипомвуно','eripomvuno_encyclopedia_desc')], если его вообще можно так назвать. Оставшийся песок оттеснён к самой кромке воды лесом, который всё наступает и гуще самых тёмных уголков [Glossary('Калатипсоми','kalathipsomi_encyclopedia_desc')].\n\nГлядя между стволами, я невольно чувствую укол отчаяния при мысли, что нам придётся искать путь в этом месте. И всё же что-то тянет моё сердце глубже в заросли, словно чем дольше я смотрю на листья и цветы, тем сильнее хочу увидеть, что ещё скрывается среди листвы."
 eripomvuno_encyclopedia_desc:90 "#BOL Эрипомвуно#! — цепь островов у южного побережья [Glossary('Этепезеи','etepezea_encyclopedia_desc')], остающаяся незаселённой на протяжении тысячелетий, несмотря на безграничную красоту. Те исследователи, которым удалось вернуться с острова, описывают землю несравненных видов: идеальный сад изумрудной листвы и радужных цветов с почти подавляющими ароматами. Те высокие сооружения, что сохранились на острове, полностью поглощены густой растительностью.\n\nНекоторые учёные отмечали, что новые сообщения об острове отличаются от рассказов прошлых веков, указывая на расхождения в описаниях береговой линии и зарослей в глубине, но никто не смог исследовать остров достаточно тщательно, чтобы понять причину."

 ## LICHDOMS ##

 lichdoms_name:90 "Владения личей"
 lichdoms_intro_desc:90 "$generic_intro_desc$"
 lichdoms_encyclopedia_desc:90 "Далеко к северу от [Glossary('Шевалье','chevalie_encyclopedia_desc')], за Чёрными фортами, лежат мёртвые земли #BOL Владений личей#!. Давным-давно здесь жили ойчизайны, пока восстание личей не уничтожило всю жизнь в ходе [Concept('sorrowing_of_oejeynica','Скорби по Оейенике')|E]. Теперь здесь ничего не растёт. Искатели приключений замечали, что в некоторых местах земля так тиха, что можно почти услышать собственное сердце. Воздух при дыхании обжигает из-за подавляющего запаха серы. Целые участки земли вырваны из почвы, оставив лишь зияющие провалы прямо к сердцу Аэраса. От прежней погоды остались только пыльные бури и насыщенные магией облака пепла, поднимающиеся из вулканических разломов. Огромные некрополи пятнают эту оболочку региона, окружённые горами костей. Путники любого рода должны знать: этих земель следует избегать любой ценой, если они не хотят потерять жизнь или нечто ещё худшее."

 ## WHISPERVEIL ##

 whisperveil_name:90 "Завеса шёпота"
 whisperveil_intro_desc:90 "$generic_intro_desc$"
 whisperveil_encyclopedia_desc:90 "Завеса шёпота — дикое пространство густых сосновых и еловых лесов далеко к северу от [Concept('the_continent', 'Расколотого побережья')|E]. О местной фауне известно немного, кроме скудных следов медведей и волков, хотя споры о том, какие существа могут водиться глубже в лесу, не утихают. Большая часть региона остаётся неисследованной, и за века он обрёл репутацию места с привидениями или проклятием. Рассказы об исчезнувших [Concept('aversaria','аверсарианских')|E] экспедициях и забытых руинах потерянных картараддских колоний слишком часты, и исследователям, желающим раскрыть тайны Завесы шёпота, стоит идти с величайшей осторожностью, если они не хотят разделить ту же судьбу."

 ## WASTE ##

 red_waste_name:90 "Красная пустошь"
 red_waste_intro_desc:90 "Переход от золотых подсолнухов и каменистых холмов [Glossary('Западной Опахазии','western_opakhasia_encyclopedia_desc')] к выжженному ландшафту [Glossary('Красной пустоши','red_waste_encyclopedia_desc')] поначалу не испортил нам настроения, но очень скоро глаза пересохли, а горло начало гореть. Воздух душит, отдавая горячим дымом и горелой плотью. С каждым шагом вглубь этого сурового адского края часть меня всё сильнее сомневается, стоило ли нам приходить.\n\nМы поднимаемся на вершину потрескавшегося бесплодного холма, с которого видна высохшая озёрная котловина внизу. Я едва не пропустил осыпающиеся руины у озера — возможно, когда-то это был город; теперь остались только кирпичи и щебень. С горизонта доносится зловещий вой, из центра озера поднимается яростное облако пыли, и мои спутники смотрят на меня. Путь уже выжал из нас силы, а впереди он станет только опаснее."
 red_waste_encyclopedia_desc:90 "#BOL Красные пустоши#! — выжженная пустошь, поражённая мощной магической энергией, некогда опустошившей эту землю. Сильные багровые пыльные бури, которые, как говорят, несут токсины, обжигающие лёгкие, проносятся через пустые руины городов и деревень. Земля бесплодна, а остовы деревьев похожи лишь на обугленные прутья. Та малая жизнь, что ещё остаётся здесь, — мутировавшая тень прежней себя, и путников следует предупредить: этого региона нужно избегать любой ценой."

 
