 trait_gh_dragon_blue_desc: "Это [Concept('dragons','дракон')|E] — одно из величайших [Concept('godtouched_creatures','затронутых богами существ')|E], когда-либо ступавших по [Concept('aeras','Эрасу')|E]. Некогда драконы властвовали над землёй и небом, но, по всей видимости, были истреблены вскоре после [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E] и остались лишь в мифах и легендах.\n\nЭто создание покрыто сапфировой чешуёй. Представители этого вида славятся владением аспектом «[aspect_water|E]»."
