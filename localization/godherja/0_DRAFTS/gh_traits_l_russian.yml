 trait_gh_pale_seer: "Бледный провидец"
 trait_gh_pale_seer_desc: "Бледный провидец способен почти без усилий переносить свой разум в Разлом и кружиться среди истлевающих нитей реальности. И пока большинство блуждает в этом искажённом царстве, бледный провидец свободно передвигается по нему, постигая тайны прошлого, настоящего и будущего."
 trait_gh_pale_seer_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] может почти без усилий переносить свой разум в Разлом и кружиться среди истлевающих нитей реальности. И пока большинство блуждает в этом искажённом царстве, [ROOT.GetCharacter.GetFirstNameNoTooltip] свободно передвигается по нему, постигая тайны прошлого, настоящего и будущего."
 TRAIT_FLAG_DESC_gh_pale_seer_spell_reroll: "Позволяет перебрасывать результаты «Взора в реальность»"
 
 trait_gh_reifier: "Реификатор"
 trait_gh_reifier_desc: "Большинство считают ночь временем для отдыха, но для этого персонажа тогда начинается другая жизнь. Стоит ему закрыть глаза, как он вступает в мир снов — затянутое туманом царство страшных тайн, нерождённых чудовищ и обжигающих истин. Порой трудно понять, какой из двух миров реальнее."
 trait_gh_reifier_char_desc: "Большинство считают ночь временем для отдыха, но для [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] тогда начинается другая жизнь. Стоит [ROOT.GetCharacter.GetHerHim] закрыть глаза, как [ROOT.GetCharacter.GetSheHe] вступает в мир снов — затянутое туманом царство страшных тайн, нерождённых чудовищ и обжигающих истин. Порой трудно понять, какой из двух миров реальнее."
 
 trait_lifestyle_jurist: "Правовед"
 trait_track_lifestyle_jurist: "Правоведение"
 
 trait_lifestyle_jurist_desc: "Этот персонаж усвоил основы сложнейших легалистских доктрин варденизма. Хотя он прекрасно знает порядок судебного процесса и базовые методики, он всё ещё стоит в самом начале своего пути к юридическому мастерству. Это, конечно, лучше полного отсутствия знаний, но его, скорее всего, разнесут в пух и прах в любом суде под председательством хоть сколько-нибудь толкового судьи. Для многих представителей низших слоёв сельского населения это вершина образования, хотя тех редких умельцев, что проявляют особый талант, могут отослать в города с рекомендательными письмами для продолжения учёбы."
 trait_lifestyle_jurist_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'усвоила', 'усвоил' )] основы сложнейших легалистских доктрин варденизма. Хотя [ROOT.GetCharacter.GetSheHe] прекрасно знает порядок судебного процесса и базовые методики, [ROOT.GetCharacter.GetSheHe] всё ещё стоит в самом начале своего пути к юридическому мастерству. Это, конечно, лучше полного отсутствия знаний, но [ROOT.GetCharacter.GetHerHim], скорее всего, разнесут в пух и прах в любом суде под председательством хоть сколько-нибудь толкового судьи. Для многих представителей низших слоёв сельского населения это вершина образования, хотя тех редких умельцев, что проявляют особый талант, могут отослать в города с рекомендательными письмами для продолжения учёбы."
 
 trait_jurist_2: "Компетентный правовед"
 trait_jurist_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'получила', 'получил' )] достаточное образование, чтобы выступать в роли сносного судьи, законника или учёного в запутанной системе варденитского права и судов. Действительно, варденитский мир полнится чиновниками такого уровня — совершенно ничем не примечательными исполнителями, способными грамотно вести большинство обычных дел. Однако [ROOT.GetCharacter.GetSheHe] всё ещё будет с трудом справляться с высшим искусством варденитского легализма, особенно в делах с политическим подтекстом. Тем не менее для большинства варденитов достижение даже такого уровня считается высокой честью и требует лет усердной учёбы. А для амбициозных людей это лишь первый шаг."
 
 trait_jurist_3: "Выдающийся правовед"
 trait_jurist_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'продемонстрировала', 'продемонстрировал' )] уровень навыков, выгодно выделяющий [ROOT.GetCharacter.GetHerHim] из массы обычных законников, составляющих большинство варденитского юридического сословия. [ROOT.GetCharacter.GetSheHe|U] уже пробует себя в судебной практике, выходящей за рамки простых убийств, краж или наследственных споров. Многие из тех, кто достиг этой степени образования, стремятся к престижным судейским должностям, и их часто можно увидеть среди зрителей на важнейших судебных процессах страны, где они внимательно следят за ходом разбирательств."
 
 trait_jurist_4: "Мастер-правовед"
 trait_jurist_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] обладает редким талантом и далеко [Select_CString(ROOT.GetCharacter.IsFemale, 'превзошла', 'превзошёл' )] своих коллег. Знание законов делает [ROOT.GetCharacter.GetHerHim] крайне [Select_CString(ROOT.GetCharacter.IsFemale, 'востребованной', 'востребованным' )] среди сильных мира сего в варденитском обществе, а [ROOT.GetCharacter.GetHerHis] заключения читают и обсуждают учёные по всему варденитскому миру. [ROOT.GetCharacter.GetSheHe|U] знает все тонкости и уловки, легко обходит менее искушённых правоведов и, когда уместно, даже привносит немного театральности в обычно строгие заседания варденитских судов. Правоведы такого уровня обычно соперничают за должности верховных судей. Их редкие навыки настолько опасны, что местные владыки пристально за ними следят — и горе неподготовленному правителю, который перейдёт дорогу мастеру права."
 
 trait_jurist_5: "Легендарный правовед"
 trait_jurist_5_character_desc: "Такой талант рождается раз в поколение. После долгих лет учёбы и труда [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'достигла', 'достиг' )] уровня юридического мастерства, доступного лишь немногим за всю историю варденизма. Даже мамуры не решаются оспаривать [ROOT.GetCharacter.GetHerHis] решения, а другие правоведы смотрят на [ROOT.GetCharacter.GetHerHim] со смесью страха и уважения. В зависимости от своих предпочтений [ROOT.GetCharacter.GetSheHe] наверняка либо оснует новую юридическую школу, либо возвысит уже существующую. Что бы [ROOT.GetCharacter.GetSheHe] ни [Select_CString(ROOT.GetCharacter.IsFemale, 'выбрала', 'выбрал' )], [ROOT.GetCharacter.GetHerHis] деяния будут определять варденитскую доктрину на протяжении многих веков."

