 trait_gh_one_with_mist: "Единство с Туманом"
 trait_gh_one_with_mist_desc: "Сны этого персонажа полны тумана, и в эфирном мире он чувствует себя так же свободно, как в мире грубой материи."
 trait_gh_one_with_mist_char_desc: "Сны [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] полны тумана, и в эфирном мире [ROOT.GetCharacter.GetSheHe] чувствует себя так же свободно, как в мире грубой материи."
