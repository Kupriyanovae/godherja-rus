l_russian:

 trait_hunter_4: "Опытный охотник"
 trait_hunter_4_desc: "Опытный охотник — настоящая гроза диких земель."
 trait_hunter_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — настоящая гроза диких земель."
 
 trait_hunter_5: "Легендарный охотник"
 trait_hunter_5_desc: "Для легендарного охотника охота столь же естественна, как дыхание."
 trait_hunter_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] охотится так же естественно, как дышит."
 
 trait_beasthunter_1: "Начинающий охотник на чудовищ"
 trait_beasthunter_1_desc: "Этот персонаж — лишь новичок в искусстве охоты на самых опасных тварей."
 trait_beasthunter_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — лишь новичок в искусстве охоты на самых опасных тварей."
 
 trait_beasthunter_2: "Охотник на чудовищ"
 trait_beasthunter_2_desc: "Этот персонаж доказал своё умение охотиться на диковинных и опасных зверей — а порой и на тех, кто сочетает оба качества."
 trait_beasthunter_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'доказала', 'доказал' )] своё умение охотиться на диковинных и опасных зверей — а порой и на тех, кто сочетает оба качества."
 
 trait_beasthunter_3: "Опытный охотник на чудовищ"
 trait_beasthunter_3_desc: "Этот персонаж известен как мастер охоты на опасных и чудовищных существ. Особенно впечатляет его умение идти по следу."
 trait_beasthunter_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'известна', 'известен' )] как мастер охоты на опасных и чудовищных существ. Особенно впечатляет [ROOT.GetCharacter.GetHerHis] умение идти по следу."
 
 trait_beasthunter_4: "Легендарный охотник на чудовищ"
 trait_beasthunter_4_desc: "Охотничьи подвиги этого персонажа стали легендой, и даже самые могучие чудовища боятся дня, когда он войдёт в их логово."
 trait_beasthunter_4_character_desc: "Охотничьи подвиги [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] стали легендой, и даже самые могучие чудовища боятся дня, когда [ROOT.GetCharacter.GetSheHe] войдёт в их логово."

 trait_gh_falconer: "Сокольник"
 trait_gh_falconer_desc: "Этот персонаж искусен в обучении ловчих птиц для охоты на диких зверей."
 trait_gh_falconer_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'искусна', 'искусен' )] в обучении ловчих птиц для охоты на диких зверей."

 trait_specialized_beasthunter: "Охотник на [SelectLocalization('(bool)no','',Concatenate(ROOT.GetCharacter.MakeScope.Var('game_gain_expert_proficiency_var').GetFlagName,'_name'))]"
 trait_beasthunter_1_specialized_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — лишь новичок в искусстве охоты на самых опасных тварей, но уже [Select_CString(ROOT.GetCharacter.IsFemale, 'проявила', 'проявил' )] особую склонность к охоте на [SelectLocalization('(bool)no','',Concatenate(ROOT.GetCharacter.MakeScope.Var('game_gain_expert_proficiency_var').GetFlagName,'_name'))]."
 trait_beasthunter_2_specialized_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'доказала', 'доказал' )] своё умение выслеживать диковинных и опасных тварей, навострившись охотиться именно на [SelectLocalization('(bool)no','',Concatenate(ROOT.GetCharacter.MakeScope.Var('game_gain_expert_proficiency_var').GetFlagName,'_name'))]."
 trait_beasthunter_3_specialized_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'известна', 'известен' )] как мастер охоты на опасных и чудовищных существ. Особенно впечатляет [ROOT.GetCharacter.GetHerHis] умение идти по следу, когда добычей становится [SelectLocalization('(bool)no','',Concatenate(ROOT.GetCharacter.MakeScope.Var('game_gain_expert_proficiency_var').GetFlagName,'_name'))]."
 trait_beasthunter_4_specialized_desc: "Охотничьи подвиги [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] стали легендой, и даже самые могучие чудовища боятся дня, когда [ROOT.GetCharacter.GetSheHe] войдёт в их логово — особенно [SelectLocalization('(bool)no','',Concatenate(ROOT.GetCharacter.MakeScope.Var('game_gain_expert_proficiency_var').GetFlagName,'_name'))]."

 TRAIT_FLAG_DESC_can_hunt_low_level_monsters: "Позволяет во время [Concept('monster_hunt','охоты')|E] выслеживать #E чудовищ низкого уровня#!"
 TRAIT_FLAG_DESC_can_hunt_medium_level_monsters: "Позволяет во время [Concept('monster_hunt','охоты')|E] выслеживать #E чудовищ среднего уровня#!"
 TRAIT_FLAG_DESC_can_hunt_high_level_monsters: "Позволяет во время [Concept('monster_hunt','охоты')|E] выслеживать #E чудовищ высокого уровня#!"

 trait_education_dead_magic: "[dead_magic|E]"
 trait_education_dead_magic_latent: "Скрытая [Concept('dead_magic', 'мёртвая магия')|E]"
 trait_education_dead_magic_latent_desc: "Персонаж со скрытым даром [Concept('dead_magic', 'мёртвой магии')|E] пока совершенно не способен использовать эту силу."
 trait_education_dead_magic_latent_character_desc: "В [ROOT.GetCharacter.GetFirstNameNoTooltip] скрыт дар [Concept('dead_magic', 'мёртвой магии')|E], но [ROOT.GetCharacter.GetSheHe] пока не [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] пользоваться [Concept('dead_magic','мёртвой магией')|E]."
 trait_education_dead_magic_1: "Ученик [Concept('dead_magic', 'мёртвой магии')|E]"
 trait_education_dead_magic_1_desc: "Новичок в [Concept('dead_magic', 'мёртвой магии')|E] хорошо изучил движение [Concept('aervalr','Эрвала')|E], но ему трудно управлять его силой, а собственные способности [Concept('dead_magi','мага земли')|E] пока невелики."
 trait_education_dead_magic_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] хорошо [Select_CString(ROOT.GetCharacter.IsFemale, 'изучила', 'изучил' )] движение [Concept('aervalr','Эрвала')|E], но [ROOT.GetCharacter.GetHerHim] всё ещё трудно управлять его силой, а [ROOT.GetCharacter.GetHerHis] способности [Concept('dead_magi','мага земли')|E] пока невелики."
 trait_education_dead_magic_2: "Адепт [Concept('dead_magic', 'мёртвой магии')|E]"
 trait_education_dead_magic_2_desc: "[Concept('magi','Маг')|E], достигший уровня адепта [Concept('dead_magic','мёртвой магии')|E], хорошо знает циклы [Concept('aervalr','Эрвала')|E] и умеет обращать фазы угасающей луны себе на пользу, как подобает настоящему [Concept('dead_magi','магу земли')|E]."
 trait_education_dead_magic_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] хорошо знает циклы [Concept('aervalr','Эрвала')|E] и умеет обращать фазы угасающей луны себе на пользу, как подобает настоящему [Concept('dead_magi','магу земли')|E]."
 trait_education_dead_magic_3: "Знаток [Concept('dead_magic', 'мёртвой магии')|E]"
 trait_education_dead_magic_3_desc: "Знаток [Concept('dead_magic', 'мёртвой магии')|E] овладел редким искусством, которое многие считают противоестественным, и способен сокрушать врагов при любой фазе угасающей луны. Лишь немногие [Concept('dead_magi','маги земли')|E] достигают такого уровня."
 trait_education_dead_magic_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'овладела', 'овладел' )] редким искусством [Concept('dead_magic', 'мёртвой магии')|E], которое многие считают противоестественным, и [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] сокрушать [ROOT.GetCharacter.GetHerHis] врагов при любой фазе угасающей луны. Лишь немногие [Concept('dead_magi','маги земли')|E] достигают такого уровня."
 trait_education_dead_magic_4: "Магистр [Concept('dead_magic', 'мёртвой магии')|E]"
 trait_education_dead_magic_4_desc: "Этот персонаж — легендарный [Concept('dead_magi','маг земли')|E]. Само его присутствие внушает трепет и тревогу окружающим, заставляя волосы вставать дыбом от ощутимой мощи и опасности, исходящих от его тела."
 trait_education_dead_magic_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — легендарный [Concept('dead_magi','маг земли')|E]. [ROOT.GetCharacter.GetHerHis|U] присутствие внушает трепет окружающим, а волоски на коже встают дыбом, стоит находящимся рядом подсознательно ощутить чистую силу и опасность, исходящие от [ROOT.GetCharacter.GetHerHim]."

 trait_education_mixed_magic: "[mixed_magic|E]"
 trait_education_mixed_magic_latent: "Скрытая [Concept('mixed_magic', 'смешанная магия')|E]"
 trait_education_mixed_magic_latent_desc: "Персонаж со скрытым даром [Concept('mixed_magic', 'смешанной магии')|E] пока совершенно не способен использовать эту силу."
 trait_education_mixed_magic_latent_character_desc: "В [ROOT.GetCharacter.GetFirstNameNoTooltip] скрыт дар [Concept('mixed_magic', 'смешанной магии')|E], но [ROOT.GetCharacter.GetSheHe] пока не [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] пользоваться [Concept('mixed_magic','смешанной магией')|E]."
 trait_education_mixed_magic_1: "Ученик [Concept('mixed_magic', 'смешанной магии')|E]"
 trait_education_mixed_magic_1_desc: "Новичок в [Concept('mixed_magic', 'смешанной магии')|E] уже развил способности, которые коллеги, не являющиеся [Concept('mixed_magi','смешанными магами')|E], считают противоестественными и пугающими, но пока плохо контролирует эту силу."
 trait_education_mixed_magic_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'развила', 'развил' )] способности, которые коллеги, не являющиеся [Concept('mixed_magi','смешанными магами')|E], считают противоестественными и пугающими, но пока плохо контролирует эту силу."
 trait_education_mixed_magic_2: "Адепт [Concept('mixed_magic', 'смешанной магии')|E]"
 trait_education_mixed_magic_2_desc: "По мере того как знания адепта в [Concept('mixed_magic', 'смешанной магии')|E] растут, его глаза постепенно теряют цвет, а животные начинают его сторониться. Люди тоже замечают неладное и обходят его стороной, опасаясь сил [Concept('mixed_magi','смешанного мага')|E]."
 trait_education_mixed_magic_2_character_desc: "По мере того как знания [ROOT.GetCharacter.GetFirstNameNoTooltip] в [Concept('mixed_magic', 'смешанной магии')|E] растут, [ROOT.GetCharacter.GetHerHis] глаза постепенно теряют цвет, а животные начинают сторониться [ROOT.GetCharacter.GetHerHim]. Люди тоже замечают неладное и обходят [ROOT.GetCharacter.GetHerHim] стороной, опасаясь сил [Concept('mixed_magi','смешанного мага')|E]."
 trait_education_mixed_magic_3: "Знаток [Concept('mixed_magic', 'смешанной магии')|E]"
 trait_education_mixed_magic_3_desc: "Тени вокруг знатока [Concept('mixed_magic', 'смешанной магии')|E] мерцают и сгущаются, когда он проходит мимо, а во время его речи словно начинают шептать вместе с ним. Его почти белые глаза видят нечто невидимое для остальных. Немногие [Concept('mixed_magi','смешанные маги')|E] достигают этого уровня, и всех достигших его боятся."
 trait_education_mixed_magic_3_character_desc: "Тени вокруг [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] мерцают и сгущаются, когда [ROOT.GetCharacter.GetSheHe] проходит мимо, а во время [ROOT.GetCharacter.GetHerHis] речи словно начинают шептать вместе с [ROOT.GetCharacter.GetHerHim]. [ROOT.GetCharacter.GetHerHis|U] почти белые глаза видят нечто невидимое для остальных. Немногие [Concept('mixed_magi','смешанные маги')|E] достигают этого уровня, и всех достигших его боятся."
 trait_education_mixed_magic_4: "Магистр [Concept('mixed_magic', 'смешанной магии')|E]"
 trait_education_mixed_magic_4_desc: "Глаза [ROOT.GetCharacter.GetFirstNameNoTooltip], истинного [Concept('mixed_magi','смешанного мага')|E], давно утратили цвет, но продолжают двигаться, вглядываясь в пустоту. Вокруг [ROOT.GetCharacter.GetHerHim] разливается аура страха, а свет и краски искажаются вокруг [ROOT.GetCharacter.GetHerHis] тела, которое время от времени подрагивает. Искусство [Concept('mixed_magic','смешанной магии')|E] почти неведомо миру, но никто не станет отрицать, что мастерство превратило [ROOT.GetCharacter.GetHerHim] во что-то... иное."
 trait_education_mixed_magic_4_character_desc: "Глаза [ROOT.GetCharacter.GetFirstNameNoTooltip], истинного [Concept('mixed_magi','смешанного мага')|E], давно утратили цвет, но продолжают двигаться, вглядываясь в пустоту. Вокруг [ROOT.GetCharacter.GetHerHim] разливается аура страха, а свет и краски искажаются вокруг [ROOT.GetCharacter.GetHerHis] тела, которое время от времени подрагивает. Искусство [Concept('mixed_magic','смешанной магии')|E] почти неведомо миру, но никто не станет отрицать, что мастерство превратило [ROOT.GetCharacter.GetHerHim] во что-то... иное."

 ethereal_necromancy: "Эфирная некромантия"
 trait_ethereal_necromancy: "Эфирная некромантия"
 trait_ethereal_necromancy_desc: "Этот [Concept('magi','маг')|E] умеет связываться с духами, подчинять их своей воле и посылать выполнять приказы. Будь то слежка за врагами или их убийство, духи беспрекословно повинуются воле этого [Concept('magi','мага')|E]."
 trait_ethereal_necromancy_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] связываться с духами, подчинять их своей воле и посылать выполнять приказы. Будь то слежка за врагами или их убийство, духи беспрекословно повинуются [ROOT.GetCharacter.GetHerHis] воле."

 trait_pryonism: "Прионизм"
 trait_pryonism_desc: "Этот [Concept('magi','маг')|E] обладает даром читать чужие мысли, а также влиять на чужие помыслы и сновидения."
 trait_pryonism_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] читать чужие мысли и влиять на разумы и сны других людей."

 trait_education_anti_magic: "[antimagic|E]"
 trait_education_anti_magic_1: "Ученик [Concept('antimagic', 'антимагии')|E]"
 trait_education_anti_magic_1_desc: "Ученик [Concept('antimagic', 'антимагии')|E] освоил лишь основные навыки защиты от магии и борьбы с ней. У него есть шанс только против самых слабых проявлений чародейства."
 trait_education_anti_magic_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] владеет лишь базовыми навыками для противостояния волшебным силам. Увы, [ROOT.GetCharacter.GetSheHe] долго не продержится против хоть сколько-нибудь грозных чар."
 trait_education_anti_magic_2: "Адепт [Concept('antimagic', 'антимагии')|E]"
 trait_education_anti_magic_2_desc: "Адепт [Concept('antimagic', 'антимагии')|E] вполне способен справиться с обыденными и, возможно, даже с некоторыми редкими проявлениями магии в этом мире."
 trait_education_anti_magic_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] вполне [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] одолеть большинство чародеев, с которыми простой смертный может столкнуться за свою жизнь."
 trait_education_anti_magic_3: "Знаток [Concept('antimagic', 'антимагии')|E]"
 trait_education_anti_magic_3_desc: "Знатоки [Concept('antimagic', 'антимагии')|E] входят в число лучших борцов с чародейством. Когда миру угрожают редкие формы магии, именно знатоков [Concept('antimagic','антимагии')|E] призывают защищать остальных."
 trait_education_anti_magic_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'готова', 'готов' )] встретить даже самые жуткие чары, если те будут угрожать стране или всему миру. Пусть эти силы и редки, [ROOT.GetCharacter.GetFirstNameNoTooltip] встретит их во всеоружии." 
 trait_education_anti_magic_4: "Магистр [Concept('antimagic', 'антимагии')|E]"
 trait_education_anti_magic_4_desc: "[Concept('magi','Маги')|E], чудовища и другие магические существа в страхе прячутся при приближении магистра [Concept('antimagic', 'антимагии')|E]. Такой мастер способен одолеть даже самые могущественные силы магии, и мало кто решается бросить ему вызов."
 trait_education_anti_magic_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] не страшится чародейства — скорее сами чары трепещут перед [ROOT.GetCharacter.GetHerHim], ибо [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] развеять их единым ударом."

 trait_education_arcana: "[arcana|E]"
 trait_education_arcana_1: "Начинающий арканист"
 trait_education_arcana_1_desc: "Начинающий арканист имеет лишь общее представление об [Concept('arcana','аркане')|E] и окружающих его фундаментальных силах."
 trait_education_arcana_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] имеет лишь общее представление о фундаментальных силах, действующих вокруг [ROOT.GetCharacter.GetHerHim]."
 trait_education_arcana_2: "Робкий экспериментатор"
 trait_education_arcana_2_desc: "Робкий экспериментатор уже начал выходить за рамки старых фолиантов, но ему всё ещё предстоит пройти долгий путь."
 trait_education_arcana_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'начала', 'начал' )] выходить за пределы пыльных фолиантов, но путь познания ещё весьма долог."
 trait_education_arcana_3: "Наблюдательный эзотерик"
 trait_education_arcana_3_desc: "Наблюдательный эзотерик изучил древние гримуары и проявил глубокое понимание [Concept('arcana','арканы')|E]."
 trait_education_arcana_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'изучила', 'изучил' )] древние гримуары и глубоко [Select_CString(ROOT.GetCharacter.IsFemale, 'постигла', 'постиг' )] [Concept('arcana','аркану')|E]."
 trait_education_arcana_4: "Искусный арканософ"
 trait_education_arcana_4_desc: "Искусный арканософ — признанный знаток [Concept('arcana','арканы')|E] и сверхъестественных явлений."
 trait_education_arcana_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — признанный знаток [Concept('arcana','арканы')|E] и сверхъестественных явлений."
 trait_education_arcana_5: "Эрудированный тауматург"
 trait_education_arcana_5_desc: "Эрудированный тауматург обладает познаниями в [Concept('arcana', 'аркане')|E], накопленными целой цивилизацией, и хранит многие тайны, считавшиеся утраченными."
 trait_education_arcana_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] обладает познаниями в [Concept('arcana', 'аркане')|E], накопленными целой цивилизацией, и хранит многие тайны, считавшиеся утраченными."

 trait_gh_arcanist: "Арканист"
 trait_gh_arcanist_desc: "Этот персонаж мастерски исследует тайны [Concept('magic', 'магии')|E] и ставит опыты за пределами известного мира."
 trait_gh_arcanist_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] мастерски исследует тайны [Concept('magic','магии')|E] и ставит опыты за пределами известного мира."

 trait_gh_transmuturgist: "Трансмутург"
 trait_gh_transmuturgist_desc: "Этот персонаж настроился на потоки тайных сил и способен проводить и понимать сложные ритуалы, недоступные большинству [Concept('magi','магов')|E]."
 trait_gh_transmuturgist_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'настроилась', 'настроился' )] на потоки тайных сил и [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] проводить и понимать сложные ритуалы, недоступные большинству [Concept('magi','магов')|E]."

 trait_gh_sage: "Мудрец"
 trait_gh_sage_desc: "Этот персонаж способен проникать в глубины сокрытых миров [Concept('aeras', 'Эраса')|E], храня ответы на тайные загадки бытия."
 trait_gh_sage_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] проникать в самые сокровенные тайны [Concept('aeras', 'Эраса')|E], храня ответы на вечные загадки бытия."

 trait_marine_commander: "Морской военачальник"
 trait_marine_commander_desc: "Этот персонаж чувствует себя как дома среди [Concept('shatteredisles', 'Расколотых островов')|E] и эффективно использует особенности местности в бою."
 trait_marine_commander_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] чувствует себя как дома на просторах [Concept('shatteredisles', 'Расколотых островов')|E] и мастерски использует местность в бою."

 trait_blackspawn: "Чернорождённый"
 trait_gh_blackspawn_1: "Посвящённый чернорождённых"
 trait_gh_blackspawn_1_desc: "Этот персонаж поражён начальной стадией [Concept('shadesoul_curse', 'проклятия теневой души')|E]: он обрёл бессмертие, но пока почти не ощущает других сил и недугов проклятия. Внешне он всё ещё выглядит обычно, однако вокруг него возникает необъяснимое чувство тревоги, а нездешние кошмары порой вынуждают его действовать..."
 trait_gh_blackspawn_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'поражена', 'поражён' )] начальной стадией [Concept('shadesoul_curse', 'проклятия теневой души')|E]: [ROOT.GetCharacter.GetSheHe] [Select_CString(ROOT.GetCharacter.IsFemale, 'обрела', 'обрёл' )] бессмертие, но пока почти не ощущает других сил и недугов проклятия. Внешне [ROOT.GetCharacter.GetSheHe] всё ещё выглядит обычно, однако вокруг [ROOT.GetCharacter.GetHerHim] возникает необъяснимое чувство тревоги, а нездешние кошмары порой вынуждают [ROOT.GetCharacter.GetHerHim] действовать..."
 trait_gh_blackspawn_2: "Адепт чернорождённых"
 trait_gh_blackspawn_2_desc: "Скрывать поражение [Concept('shadesoul_curse', 'проклятием теневой души')|E] становится всё сложнее. Кожа персонажа давно утратила цвет, а вокруг него висит зловещая аура. Силы проклятия возросли, но вместе с ними усилилось и почти непреодолимое желание воплощать пророческие кошмары наяву."
 trait_gh_blackspawn_2_character_desc: "На [ROOT.GetCharacter.GetHerHis] теле всё труднее скрыть следы [Concept('shadesoul_curse', 'проклятия теневой души')|E]. [ROOT.GetCharacter.GetHerHis|U] кожа давно утратила цвет, а вокруг [ROOT.GetCharacter.GetHerHim] висит зловещая аура. Силы проклятия возросли, но вместе с ними усилилось и почти непреодолимое желание воплощать [ROOT.GetCharacter.GetHerHis] пророческие кошмары наяву."
 trait_gh_blackspawn_3: "Призыватель чернорождённых"
 trait_gh_blackspawn_3_desc: "Этот персонаж достиг поздней стадии [Concept('shadesoul_curse', 'проклятия теневой души')|E] — рубежа, до которого добираются немногие даже при невосприимчивости к старению. Он лишился обычных телесных потребностей, включая сон, а сновидения теперь приходят к нему шёпотом наяву. Его сила возросла, но усилились и недуги проклятия: долгое пребывание на солнце причиняет жгучую боль."
 trait_gh_blackspawn_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'достигла', 'достиг' )] поздней стадии [Concept('shadesoul_curse', 'проклятия теневой души')|E] — рубежа, до которого добираются немногие даже при невосприимчивости к старению. [ROOT.GetCharacter.GetSheHe|U] [Select_CString(ROOT.GetCharacter.IsFemale, 'лишилась', 'лишился' )] обычных телесных потребностей, включая сон, а сновидения теперь приходят к [ROOT.GetCharacter.GetHerHim] шёпотом наяву. [ROOT.GetCharacter.GetHerHis|U] сила возросла, но усилились и недуги проклятия: долгое пребывание на солнце причиняет [ROOT.GetCharacter.GetHerHim] жгучую боль."
 trait_gh_blackspawn_4: "Вестник чернорождённых"
 trait_gh_blackspawn_4_desc: "Этот персонаж превратился в нечто по-настоящему ужасающее — редчайший пример крайней стадии [Concept('shadesoul_curse', 'проклятия теневой души')|E]. Солнечный свет теперь для него смертелен и навсегда вынуждает скрываться во тьме, но он без устали продолжает строить зловещие планы."
 trait_gh_blackspawn_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'превратилась', 'превратился' )] в нечто по-настоящему ужасающее — редчайший пример крайней стадии [Concept('shadesoul_curse', 'проклятия теневой души')|E]. Солнечный свет теперь для [ROOT.GetCharacter.GetHerHim] смертелен и навсегда вынуждает скрываться во тьме, но [ROOT.GetCharacter.GetSheHe] без устали продолжает строить зловещие планы."
 trait_gh_blackspawn_5: "Абиссалист чернорождённых"
 trait_gh_blackspawn_5_desc: "Существо бездонного зла и невероятного могущества, питающее ужасающие замыслы относительно судьбы мира. Если и есть слово, описывающее то, во что [Concept('shadesoul_curse', 'проклятие теневой души')|E] превратило этого персонажа, то «демон» подходит лучше всего."
 trait_gh_blackspawn_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — существо бездонного зла и невероятной силы, питающее ужасные замыслы в отношении всего мира. Если и можно описать то, во что [Concept('shadesoul_curse', 'проклятие теневой души')|E] превратило [ROOT.GetCharacter.GetHerHim], то слово «демон» будет недалеко от истины."


