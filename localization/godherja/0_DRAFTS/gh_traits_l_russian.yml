 trait_magic_good: "[Concept('magi','Маг')|E]"
 trait_magic_good_1: "Скрытый [Concept('magi','маг')|E]"
 trait_magic_good_1_desc: "В жилах этого персонажа течет капля магической крови."
 trait_magic_good_1_character_desc: "В жилах [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] течет капля магической крови."
 trait_magic_good_2: "Обычный [Concept('magi','маг')|E]"
 trait_magic_good_2_desc: "Этот персонаж обладает лишь самым скромным магическим потенциалом для [Concept('magi','мага')|E]. Он способен на разрушения, но, к счастью, лишь в небольших масштабах."
 trait_magic_good_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] обладает лишь самым скромным магическим потенциалом для [Concept('magi','мага')|E]. [ROOT.GetCharacter.GetSheHe|U] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] на разрушения, но, к счастью, лишь в небольших масштабах."
 trait_magic_good_3: "Одарённый [Concept('magi','маг')|E]"
 trait_magic_good_3_desc: "Этот персонаж наделен врожденным сродством к магии, и во многих культурах считается, что у него чистейшая кровь. Это примерно средний уровень для большинства [Concept('magi','магов')|E] на [Concept('aeras','Эрасе')|E]."
 trait_magic_good_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'наделена', 'наделен' )] врожденным сродством к магии, и во многих культурах считается, что у [ROOT.GetCharacter.GetHerHim] чистейшая кровь. Это примерно средний уровень для большинства [Concept('magi','магов')|E] на [Concept('aeras','Эрасе')|E]."
 trait_magic_good_4: "Выдающийся [Concept('magi','маг')|E]"
 trait_magic_good_4_desc: "Этот персонаж обладает магическим потенциалом, который встречается, быть может, раз в поколение, и способен проявлять сокрушительную силу даже без базового обучения. Те, кто знает о нем, страшатся его мощи — и вполне обоснованно."
 trait_magic_good_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] обладает магическим потенциалом, который встречается, быть может, раз в поколение, и [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] проявлять сокрушительную силу даже без базового обучения. Те, кто знает о [ROOT.GetCharacter.GetHerHim], страшатся [ROOT.GetCharacter.GetHerHis] мощи — и вполне обоснованно."
 
 trait_magic_good_5: "Исключительный [Concept('magi','маг')|E] I"
 trait_magic_good_5_desc: "Этот персонаж — один из величайших [Concept('magi','магов')|E] своей эпохи, способный на невероятные свершения как в разрушении, так и в созидании. Хотя в истории встречались и более могущественные чародеи, подобные личности рождаются едва ли чаще раза в столетие. Лишь благодаря продуманным и многовековым династическим программам общество способно породить больше, чем горстку таких чародеев."
 trait_magic_good_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — один из величайших [Concept('magi','магов')|E] своей эпохи, [Select_CString(ROOT.GetCharacter.IsFemale, 'способная', 'способный' )] на невероятные свершения как в разрушении, так и в созидании. Хотя в истории встречались и более могущественные чародеи, подобные личности рождаются едва ли чаще раза в столетие. Лишь благодаря продуманным и многовековым династическим программам общество способно породить больше, чем горстку таких чародеев."
 
