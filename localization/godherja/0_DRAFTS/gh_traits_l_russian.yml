 trait_gh_one_handed_desc: "У этого персонажа только одна рука."
 trait_gh_one_handed_character_desc: "У [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] только одна рука."

 trait_gh_dragon_black: "Дракон"
 trait_gh_dragon_black_desc: "Это [Concept('dragons','Дракон')|E] — одно из величайших [godtouched_creatures|E], когда-либо ходивших по [aeras|E]. Драконы когда-то правили сушей и небесами, но были практически полностью истреблены сразу после [war_of_the_thousand_dragons|E], что превратило их в миф.\n\nДанное создание покрыто чешуей цвета обсидиана — этот вид известен своим мастерством в управлении стихией [aspect_dark|E]."
 trait_gh_dragon_black_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('dragons','Дракон')|E], одно из величайших [godtouched_creatures|E], когда-либо ходивших по [aeras|E]. Драконы когда-то правили сушей и небесами, но были практически полностью истреблены сразу после [war_of_the_thousand_dragons|E], что превратило их в миф.\n\nДанное создание покрыто чешуей цвета обсидиана — этот вид известен своим мастерством в управлении стихией [aspect_dark|E]."

 trait_gh_dragon_blue: "Дракон"
 trait_gh_dragon_blue_desc: "Это [Concept('dragons','Дракон')|E] — одно из величайших [godtouched_creatures|E], когда-либо ходивших по [aeras|E]. Драконы когда-то правили сушей и небесами, но были практически полностью истреблены сразу после [war_of_the_thousand_dragons|E], что превратило их в миф.\n\nДанное создание покрыто чешуей цвета сапфира — этот вид известен своим мастерством в управлении стихией [aspect_water|E]."
 trait_gh_dragon_blue_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('dragons','Дракон')|E], одно из величайших [godtouched_creatures|E], когда-либо ходивших по [aeras|E]. Драконы когда-то правили сушей и небесами, но были практически полностью истреблены сразу после [war_of_the_thousand_dragons|E], что превратило их в миф.\n\nДанное создание покрыто чешуей цвета сапфира — этот вид известен своим мастерством в управлении стихией [aspect_water|E]."

 trait_gh_dragon_green: "Дракон"
 trait_gh_dragon_green_desc: "Это [Concept('dragons','Дракон')|E] — одно из величайших [godtouched_creatures|E], когда-либо ходивших по [aeras|E]. Драконы когда-то правили сушей и небесами, но были практически полностью истреблены сразу после [war_of_the_thousand_dragons|E], что превратило их в миф.\n\nДанное создание покрыто чешуей цвета изумруда — этот вид известен своим мастерством в управлении стихией [aspect_nature|E]."
