 trait_setup_flag_story_content_desc: ""

 trait_gh_yuankang_founding_father: "Отец-основатель"
 trait_gh_yuankang_founding_father_desc: "Этот персонаж — основатель Республики Юанькан, приведший народ Бронзовой Гавани к независимости."
 trait_gh_yuankang_founding_father_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — основатель Республики Юанькан, приведший народ Бронзовой Гавани к независимости."

 trait_gh_high_emperor: "Шан-Хуан"
 trait_gh_high_emperor_desc: "Народ почитает этого персонажа как «Шан-Хуана» в знак признания его монументального достижения — основания первой династии Дахангона под правлением катуни."
 trait_gh_high_emperor_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] почитается народом как «Шан-Хуан» в знак признания его монументального достижения — основания первой династии Дахангона под правлением катуни."

 trait_gh_scion_of_nolan: "Отпрыск Нолана"
 trait_gh_scion_of_nolan_desc: "В жилах этого персонажа течет божественная кровь: он признан истинным потомком [Concept('naklan_the_golden','Наклана')|E] и пользуется высоким положением."
 trait_gh_scion_of_nolan_character_desc: "В жилах [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] течет божественная кровь: [ROOT.GetCharacter.GetSheHe] [Select_CString(ROOT.GetCharacter.IsFemale, 'признана', 'признан' )] истинным потомком [Concept('naklan_the_golden','Наклана')|E] и пользуется высоким положением."

 trait_gh_king_of_conquerors: "Завоеватель-аавтократ"
 trait_gh_king_of_conquerors_desc: "Этот персонаж славно покорил далекие земли, куда не ступала нога аверсарианцев древности, став благородным владыкой над множеством чужеземных народов."
 trait_gh_king_of_conquerors_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] с славой [Select_CString(ROOT.GetCharacter.IsFemale, 'покорила', 'покорил' )] далекие земли, куда не ступала нога аверсарианцев древности, став благородным владыкой над множеством чужеземных народов."

 trait_gh_apparition: "Призрак"
 trait_gh_apparition_desc: "Этот персонаж — бестелесный призрак. [ROOT.GetCharacter.GetSheHe|U] скитается по миру смертных, сея ужас и нашептывая жуткие проклятия своим врагам."
 trait_gh_apparition_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — бестелесный призрак. [ROOT.GetCharacter.GetSheHe|U] скитается по миру смертных, сея ужас и нашептывая жуткие проклятия своим врагам."

 trait_dragonmaster: "Повелитель драконов"
 trait_dragonmaster_drakengard: "Дракенгард"
 trait_dragonmaster_desc: "Этот персонаж обучен командовать отрядом несравненных [Concept('dragons','драконьих наездников')|E] — должность, внушающая равную меру уважения и страха."
 trait_dragonmaster_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'обучена', 'обучен' )] командовать отрядом несравненных [Concept('dragons','драконьих наездников')|E] — должность, внушающая равную меру уважения и страха."

 trait_adopted: "Принятый в дом"
 trait_adopted_desc: "Этот персонаж был усыновлен другой [dynasty|E], навсегда разорвав прежние родовые узы."
