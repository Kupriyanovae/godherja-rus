 # Substitute lifestyle traits for history work
 trait_gh_historical_blademaster_1: "Начинающий мастер клинка"
 trait_gh_historical_blademaster_1_desc: "Начинающий мастер клинка уже неплохо сражается в одиночном бою и знает, каким концом оружия нужно колоть."
 trait_gh_historical_blademaster_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] уже неплохо сражается в одиночном бою и знает, каким концом оружия нужно колоть."

 trait_gh_historical_blademaster_2: "Мастер клинка"
 trait_gh_historical_blademaster_2_desc: "Мастер клинка — грозный и уважаемый противник в любых видах поединков."
 trait_gh_historical_blademaster_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — грозный и уважаемый противник в любых видах поединков."

 trait_gh_historical_blademaster_3: "Легендарный мастер клинка"
 trait_gh_historical_blademaster_3_desc: "Годы жизни ушли на овладение оружием, чтобы достигнутое мастерство однажды спасло одну жизнь и оборвало другую."
 trait_gh_historical_blademaster_3_character_desc: "Годы жизни ушли на овладение оружием, чтобы достигнутое мастерство однажды спасло одну жизнь и оборвало другую."

 trait_gh_historical_reveler_1: "Заядлый кутила"
 trait_gh_historical_reveler_1_desc: "Выпивка, смех и добрая компания — что ещё нужно для счастья?"
 trait_gh_historical_reveler_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'попробовала', 'попробовал' )] на вкус упоительную жизнь пиров и разврата и жаждет продолжения."

 trait_gh_historical_reveler_2: "Известный кутила"
 trait_gh_historical_reveler_2_desc: "Известный кутила — душа любого собрания, притягивающая к себе роскошь и безудержное веселье."
 trait_gh_historical_reveler_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — душа любого собрания, притягивающая к себе роскошь и безудержное веселье."

 trait_gh_historical_reveler_3: "Легендарный кутила"
 trait_gh_historical_reveler_3_desc: "Еда, напитки и опьянение тела и разума — легендарный кутила ни в чём себе не отказывает и неизменно остаётся центром каждого пира."
 trait_gh_historical_reveler_3_character_desc: "Еда, напитки и опьянение тела и разума — [ROOT.GetCharacter.GetFirstNameNoTooltip] ни в чём себе не отказывает и неизменно остаётся центром каждого пира."

 trait_gh_historical_physician_1: "Начинающий врач"
 trait_gh_historical_physician_1_desc: "Этот персонаж обучен врачебному искусству."
 trait_gh_historical_physician_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'обучена', 'обучен' )] врачебному искусству."

 trait_gh_historical_physician_2: "Врач"
 trait_gh_historical_physician_2_desc: "У этого персонажа немало опыта в уходе за больными и ранеными."
 trait_gh_historical_physician_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] имеет богатый опыт ухода за больными и ранеными."

 trait_gh_historical_physician_3: "Прославленный врач"
 trait_gh_historical_physician_3_desc: "Врачебное искусство этого персонажа широко известно в учёных кругах."
 trait_gh_historical_physician_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] славится своим врачебным искусством в учёных кругах."

 trait_gh_historical_pilgrim_1: "Паломник"
 trait_gh_historical_pilgrim_1_desc: "Мозоли на ногах, ломота в суставах, обветренное лицо — малая цена за исполнение священного долга."
 trait_gh_historical_pilgrim_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'совершила', 'совершил' )] паломничество к святому месту."

 trait_gh_historical_pilgrim_2: "Опытный паломник"
 trait_gh_historical_pilgrim_2_desc: "Этот персонаж много путешествовал по святым местам и считается знатоком среди странников."
 trait_gh_historical_pilgrim_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] много [Select_CString(ROOT.GetCharacter.IsFemale, 'путешествовала', 'путешествовал' )] по святым местам и считается знатоком среди странников."

 trait_gh_historical_pilgrim_3: "Усердный паломник"
 trait_gh_historical_pilgrim_3_desc: "Этот персонаж известен в кругах священнослужителей как человек мира. Другие паломники часто обращаются к нему за советом как в духовных вопросах, так и в выборе пути."
 trait_gh_historical_pilgrim_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'известна', 'известен' )] в кругах священнослужителей как человек мира. Другие паломники часто обращаются к [ROOT.GetCharacter.GetHerHim] за советом как в духовных вопросах, так и в выборе пути."
 
 trait_gh_historical_mystic_1: "Эзотерик"
 trait_gh_historical_mystic_1_desc: "Этот персонаж известен своим необычным, но практичным подходом к религии."
 trait_gh_historical_mystic_1_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'известна', 'известен' )] своим необычным, но практичным подходом к религии."

 trait_gh_historical_mystic_2: "Мистик"
 trait_gh_historical_mystic_2_desc: "Тайны мира, как физического, так и духовного, открываются перед тем, кто предаётся долгим размышлениям."
 trait_gh_historical_mystic_2_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'известна', 'известен' )] своими необычными методами достижения религиозного просветления."

 trait_gh_historical_mystic_3: "Чудотворец"
 trait_gh_historical_mystic_3_desc: "Фимиам, песнопения и странные заговоры — этот персонаж творит чудеса необычными способами."
 trait_gh_historical_mystic_3_character_desc: "Фимиам, песнопения и странные заговоры — [ROOT.Char.GetFirstNameNoTooltip] творит чудеса нетрадиционными способами."

 trait_gh_historical_hunter: "Охотник"
 trait_gh_historical_hunter_desc: "Этот персонаж внемлил зову дикой природы."
 trait_gh_historical_hunter_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'внемлила', 'внемлил' )] зову дикой природы."

 trait_gh_historical_track_hunter_1: "Охотник"
 trait_gh_historical_track_hunter_1_desc: "Звук рогов, лай собак, добыча! Будь то с луком или в седле, нет чувства слаще, чем повергнуть свирепого зверя!"
 trait_gh_historical_track_hunter_1_character_desc: "Звук рогов, лай собак, добыча! Будь то с луком или в седле, нет чувства слаще, чем повергнуть свирепого зверя!"

 trait_gh_historical_track_hunter_2: "Охотник"
 trait_gh_historical_track_hunter_2_desc: "Звук рогов, лай собак, добыча! Будь то с луком или в седле, нет чувства слаще, чем повергнуть свирепого зверя!"
 trait_gh_historical_track_hunter_2_character_desc: "Звук рогов, лай собак, добыча! Будь то с луком или в седле, нет чувства слаще, чем повергнуть свирепого зверя!"

 trait_gh_historical_track_hunter_3: "Опытный охотник"
 trait_gh_historical_track_hunter_3_desc: "Опытный охотник — настоящая гроза диких лесов."
 trait_gh_historical_track_hunter_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — настоящая гроза диких лесов."

 trait_gh_historical_track_hunter_4: "Легендарный охотник"
 trait_gh_historical_track_hunter_4_desc: "Легендарный охотник промышляет в диких краях так же естественно, как дышит."
 trait_gh_historical_track_hunter_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] охотится так же естественно, как дышит."

 trait_gh_historical_track_falconer_1: "Сокольник"
 trait_gh_historical_track_falconer_1_desc: "Нет более благородного занятия, чем охота с ястребом или соколом."
 trait_gh_historical_track_falconer_1_character_desc: "Нет более благородного занятия, чем охота с ястребом или соколом."

 trait_gh_historical_track_falconer_2: "Сокольник"
 trait_gh_historical_track_falconer_2_desc: "Этот персонаж искусен в дрессировке хищных птиц для охоты на диких зверей."
 trait_gh_historical_track_falconer_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'искусна', 'искусен' )] в дрессировке хищных птиц для охоты на диких зверей."

 trait_gh_historical_track_beasthunter_1: "Начинающий охотник на чудовищ"
 trait_gh_historical_track_beasthunter_1_desc: "Этот персонаж — лишь новичок в искусстве охоты на самых опасных тварей."
 trait_gh_historical_track_beasthunter_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — лишь новичок в искусстве охоты на самых опасных тварей."

 trait_gh_historical_track_beasthunter_2: "Охотник на чудовищ"
 trait_gh_historical_track_beasthunter_2_desc: "Этот персонаж доказал своё умение охотиться на диковинных и опасных зверей — а порой и на тех, кто сочетает оба качества."
 trait_gh_historical_track_beasthunter_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'доказала', 'доказал' )] своё умение охотиться на диковинных и опасных зверей — а порой и на тех, кто сочетает оба качества."

 trait_gh_historical_track_beasthunter_3: "Опытный охотник на чудовищ"
 trait_gh_historical_track_beasthunter_3_desc: "Этот персонаж известен как мастер охоты на опасных и чудовищных существ. Особенно впечатляет его умение идти по следу."
 trait_gh_historical_track_beasthunter_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'известна', 'известен' )] как мастер охоты на опасных и чудовищных существ. Особенно впечатляет [ROOT.GetCharacter.GetHerHis] умение идти по следу."

 trait_gh_historical_track_beasthunter_4: "Легендарный охотник на чудовищ"
 trait_gh_historical_track_beasthunter_4_desc: "Охотничьи подвиги этого персонажа стали легендой, и даже самые могучие чудовища боятся дня, когда он войдёт в их логово."
 trait_gh_historical_track_beasthunter_4_character_desc: "Охотничьи подвиги [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] стали легендой, и даже самые могучие чудовища боятся дня, когда [ROOT.GetCharacter.GetSheHe] войдёт в их логово."

 trait_pellagra: "Айронойская проказа"
 trait_pellagra_desc: "Этот персонаж страдает айронойской проказой — ужасной болезнью, которая, по преданию, зародилась в Восточном Айроное из-за проклятия, некогда наложенного древним [Concept('magi','магом')|E] для защиты земель от захватчиков."
 trait_pellagra_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] страдает айронойской проказой — ужасной болезнью, которая, по преданию, зародилась в Восточном Айроное из-за проклятия, некогда наложенного древним [Concept('magi','магом')|E] для защиты земель от захватчиков."

 trait_mostly_whole_of_body: "Почти здоровое тело"
 trait_mostly_whole_of_body_desc: "Знай себя, знай свои пределы и помни о границах своих не столь уж безграничных возможностей."

 trait_wane_tender: "Хранитель угасания"

 trait_track_lifestyle_beasthunter: "Охотник на чудовищ"
 trait_track_lifestyle_beasthunter_desc: "Охотник на чудовищ — это тот, кто посвятил себя выслеживанию и уничтожению самых опасных тварей, населяющих [Concept('aeras','Эрас')|E]."

 trait_gh_historical_school: "Исторический маг"
 trait_gh_historical_school_desc: "В своё время этого персонажа знали как [Concept('magi','мага')|E]."

 trait_gh_naklan_returned: "Возрождённый Наклан"
 trait_gh_naklan_returned_desc: "Многие считают этого персонажа новым воплощением [Concept('naklan_the_golden','Наклана')|E] — легендарного царя Дахангона, вернувшегося в мир и телом, и духом."
 trait_gh_naklan_returned_char_desc: "По мнению многих, [ROOT.GetCharacter.GetFirstNameNoTooltip] — новое воплощение [Concept('naklan_the_golden','Наклана')|E], легендарного царя Дахангона, вернувшегося в мир и телом, и духом."

 trait_gh_trait_amsari_pretender: "Претендент на Хиклан"
 gh_trait_amsari_pretender_desc: "Этот персонаж открыто заявил права на Амсарский Хиклан."
 gh_trait_amsari_pretender_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] открыто [Select_CString(ROOT.GetCharacter.IsFemale, 'заявила', 'заявил' )] права на Амсарский Хиклан."

 trait_gh_trait_renounced_claim: "Отказ от претензий"
 gh_trait_renounced_claim_desc: "Этот персонаж публично отрёкся от всех притязаний на престол — добровольно или по принуждению."
 gh_trait_renounced_claim_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] публично [Select_CString(ROOT.GetCharacter.IsFemale, 'отреклась', 'отрёкся' )] от всех притязаний на престол, добровольно или по принуждению."

 trait_regent: "Регент"
 trait_regent_desc: "Этот персонаж как [regent|E] фактически управляет землями своего [Concept('primary_title','основного титула')|E], но не заявляет прав на престол — по крайней мере открыто — и не занимает его на деле."
 trait_regent_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] как [regent|E] фактически управляет землями своего [Concept('primary_title','основного титула')|E], но не заявляет прав на престол — по крайней мере открыто — и не занимает его на деле."

 trait_former_regent: "Бывший регент"
 trait_former_regent_desc: "Этот персонаж когда-то управлял державой как [regent|E], фактически исполняя обязанности правителя, но не претендуя на престол."
 trait_former_regent_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] когда-то [Select_CString(ROOT.GetCharacter.IsFemale, 'управляла', 'управлял' )] державой как [regent|E], фактически исполняя обязанности правителя, но не претендуя на престол."

 trait_dragonrider: "Драконий наездник"
 trait_dragonrider_desc: "Этот персонаж обучен искусству [Concept('dragons','верховой езды на драконах')|E], что во многих культурах считается великой честью."
 trait_dragonrider_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'обучена', 'обучен' )] искусству [Concept('dragons','верховой езды на драконах')|E], что во многих культурах считается великой честью."

