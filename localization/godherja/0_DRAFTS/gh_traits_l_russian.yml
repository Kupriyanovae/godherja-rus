 trait_magic_good_11: "Великий [Concept('magi','маг')|E] I"
 trait_magic_good_11_desc: "Обладая почти мифической мощью, [Concept('magi','маг')|E] такого уровня появляются раз в эпоху. Расцвет и падение целых народов следуют за ними по пятам."
 trait_magic_good_11_character_desc: "Обладая почти мифической мощью, такие [Concept('magi','маги')|E], как [ROOT.GetCharacter.GetFirstNameNoTooltip], появляются, быть может, раз в эпоху. Расцвет и падение целых народов следуют за ними по пятам."
 
