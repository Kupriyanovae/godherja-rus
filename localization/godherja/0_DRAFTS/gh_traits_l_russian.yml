 trait_magic_good_16: "Невероятно могущественный [Concept('magi','маг')|E] III"
 trait_magic_good_16_desc: "Многие учёные считали, что [Concept('magi','маги')|E] такой силы не могут существовать. Ребёнок с настолько мощной магической кровью с самого рождения рисковал бы случайно уничтожить себя и всё вокруг. Но они ошибались."
 trait_magic_good_16_character_desc: "Многие учёные считали, что [Concept('magi','маги')|E] такой силы не могут существовать. Ребёнок с настолько мощной магической кровью с самого рождения рисковал бы случайно уничтожить себя и всё вокруг. Но они ошибались."
 
 trait_magic_good_17: "Отмеченный богами [Concept('magi','маг')|E]"
 trait_magic_good_17_desc: "Пространство заметно искажается вокруг этого [Concept('magi','мага')|E]. Мощь просачивается в воздух вокруг него. Он способен убить одним лишь словом. Если [Concept('magi','маг')|E] подобного могущества и существовал прежде, то не сохранилось хроник, способных поведать о нём."
 trait_magic_good_17_character_desc: "Пространство заметно искажается вокруг [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]. Сила пропитывает воздух рядом с [ROOT.GetCharacter.GetHerHim]. [ROOT.GetCharacter.GetSheHe|U] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] убить одним словом. Если [Concept('magi','маг')|E] подобного могущества и существовал прежде, ни одна хроника о нём не сохранилась."
 
 trait_magic_good_18: "Неописуемо могущественный [Concept('magi','маг')|E]"
 trait_magic_good_18_desc: "Этот [Concept('magi','маг')|E] повелевает нечеловеческой мощью. Его собратьям не хватает слов, чтобы описать подобный потенциал, если столь ничтожных существ вообще ещё можно считать собратьями. Уже само присутствие рядом с этим магом означает подчинение."
 trait_magic_good_18_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] повелевает нечеловеческой мощью. [ROOT.GetCharacter.GetHerHis|U] собратьям не хватает слов, чтобы описать подобный потенциал, если столь ничтожных существ вообще ещё можно считать собратьями. Уже само присутствие рядом с [ROOT.GetCharacter.GetHerHim] означает подчинение."
 
 trait_magic_good_19: "Неудержимо могущественный [Concept('magi','маг')|E]"
 trait_magic_good_19_desc: "Никакая сила на [Concept('aeras','Эрасе')|E] не может противостоять этому [Concept('magi','магу')|E]. Его потенциал продолжает без конца расти, увлекая его к всё большей мощи. Некоторые шепчутся, что его уже нельзя считать человеком, и с этим трудно спорить. Он превосходит обычного [Concept('magi','мага')|E] так же, как [Concept('magi','маг')|E] превосходит обычного человека."
 trait_magic_good_19_character_desc: "Никакая сила на [Concept('aeras','Эрасе')|E] не может противостоять [ROOT.GetCharacter.GetHerHim]. [ROOT.GetCharacter.GetHerHis|U] потенциал продолжает без конца расти, увлекая [ROOT.GetCharacter.GetHerHim] к всё большей мощи. Некоторые шепчутся, что [ROOT.GetCharacter.GetFirstNameNoTooltip] уже не человек, и с этим трудно спорить. [ROOT.GetCharacter.GetSheHe|U] превосходит обычного [Concept('magi','мага')|E] так же, как [Concept('magi','маг')|E] превосходит обычного человека."
 
 trait_magic_good_20: "Невообразимо могущественный [Concept('magi','маг')|E]"
 trait_magic_good_20_desc: "Если жители [Concept('aeras','Эраса')|E] решат поклоняться этому персонажу как божеству, они почти не ошибутся. Его могущество столь велико, что подобное заблуждение вполне простительно. Вероятно, именно этот персонаж ближе всех в мире к живому божеству."
 trait_magic_good_20_character_desc: "Если жители [Concept('aeras','Эраса')|E] решат поклоняться [ROOT.GetCharacter.GetHerHim] как божеству, они почти не ошибутся. [ROOT.GetCharacter.GetHerHis|U] могущество столь велико, что подобное заблуждение вполне простительно. Вероятно, [ROOT.GetCharacter.GetFirstNameNoTooltip] ближе всех в мире к живому божеству."
 
 TRAIT_DESC_POSIITIVE_FOR_THEM: "Магия почитается в некоторых религиях:"

##ORIGIN##
 trait_gh_peasant_birth: "Крестьянское происхождение"
 trait_gh_peasant_birth_desc: "Этот персонаж вырос на самом дне общества, и хотя каким-то образом сумел добиться высокого положения, прочие «дворяне» испытывают к нему скорее раздражение, чем уважение."
 trait_gh_peasant_birth_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'выросла', 'вырос' )] на самом дне общества, и хотя каким-то образом [Select_CString(ROOT.GetCharacter.IsFemale, 'добилась', 'добился' )] высокого положения, прочие «дворяне» испытывают к [ROOT.GetCharacter.GetHerHim] скорее раздражение, чем уважение."
 trait_gh_puppet: "Политическая марионетка"
 trait_gh_puppet_desc: "Этого персонажа фактически контролирует кто-то другой — он пляшет под чужую дудку, лишь изображая власть. Хуже всего то, что это ни для кого не секрет."
 trait_gh_puppet_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] фактически находится под чужим контролем — [ROOT.GetCharacter.GetSheHe] пляшет под чужую дудку, лишь изображая власть. Хуже всего то, что это ни для кого не секрет."
 trait_gh_gedeora_child: "Дитя [Concept('gedeora', 'гедеоры')|E]"
 trait_gh_gedeora_child_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'была поражена', 'был поражён' )] [Concept('gedeora', 'гедеорой')|E] ещё в чреве матери — ужасным проклятием для большинства, но, возможно, знаком грядущего величия для некоторых."

 #Konijkmener traits#
 trait_konijkmener_councilists: "Раадилист"
 trait_konijkmener_councilists_1: "Раадилист"
 trait_konijkmener_councilists_1_desc: "Этот персонаж принадлежит к раадилистам — одной из двух главных политических фракций дворянства Канцереркерий. Раадилисты ведут свою историю от регентского совета Конена Хейрдванга, который с рождения до самой смерти находился в коме. Совет дворян взял управление в свои руки и сплотился в единую фракцию, когда преемник Хейрдванга, Каусен, отказался признать легитимность совета и открыть перед ним двери своего дворца. В ответ совет начал прибивать тексты законов прямо к дверям дворца от имени Каусена, а любые попытки короля отменить эти указы просто игнорировались.\n\nРаадилисты были отстранены от власти во время Народной революции 1099 года, но сторонники партии с тех пор не оставляют попыток вернуть дворянству абсолютную власть, а многие и вовсе мечтают о реставрации монархии, чтобы посадить на престол марионеточного государя."
 trait_konijkmener_councilists_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] принадлежит к раадилистам — одной из двух главных политических фракций дворянства Канцереркерий. Раадилисты ведут свою историю от регентского совета Конена Хейрдванга, который с рождения до самой смерти находился в коме. Совет дворян взял управление в свои руки и сплотился в единую фракцию, когда преемник Хейрдванга, Каусен, отказался признать легитимность совета и открыть перед ним двери своего дворца. В ответ совет начал прибивать тексты законов прямо к дверям дворца от имени Каусена, а любые попытки короля отменить эти указы просто игнорировались.\n\nРаадилисты были отстранены от власти во время Народной революции 1099 года, но сторонники партии с тех пор не оставляют попыток вернуть дворянству абсолютную власть, а многие и вовсе мечтают о реставрации монархии, чтобы посадить на престол марионеточного государя."
 trait_konijkmener_peopleofunity: "Унитариш"
 trait_konijkmener_peopleofunity_1: "Унитариш"
 trait_konijkmener_peopleofunity_1_desc: "Этот персонаж принадлежит к унитариям — одной из двух главных политических фракций дворянства Канцереркерий. Своё название они получили в честь первых слов декларации Казелерена Броде о создании нового государства в 1099 году: «Мы — народ единства». Свергнув регентский совет, который к тому времени стал восприниматься как бездарный и коррумпированный и удерживал полную власть почти 150 лет, унитарии фактически установили республику. Правда, такую, где право голоса имеют только землевладельцы, а канцлер правит пожизненно. Судя по всему, Народная революция была не столько революцией, сколько перехватом власти мелким дворянством у крупной знати, контролировавшей совет.\n\nУнитарии до сих пор пользуются популярностью как среди низших слоёв, так и среди многих дворян, а сама фракция выступает за сохранение «республиканского» строя."
 trait_konijkmener_peopleofunity_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] принадлежит к унитариям — одной из двух главных политических фракций дворянства Канцереркерий. Своё название они получили в честь первых слов декларации Казелерена Броде о создании нового государства в 1099 году: «Мы — народ единства». Свергнув регентский совет, который к тому времени стал восприниматься как бездарный и коррумпированный и удерживал полную власть почти 150 лет, унитарии фактически установили республику. Правда, такую, где право голоса имеют только землевладельцы, а канцлер правит пожизненно. Судя по всему, Народная революция была не столько революцией, сколько перехватом власти мелким дворянством у крупной знати, контролировавшей совет.\n\nУнитарии до сих пор пользуются популярностью как среди низших слоёв, так и среди многих дворян, а сама фракция выступает за сохранение «республиканского» строя."
 
 #Religion#
 trait_gh_blood_of_prophet: "Хадасур"
 trait_gh_blood_of_prophet_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — потомок легендарного Пророка, чьи пророчества уже много поколений предрекают ход истории. Потомков Пророка глубоко чтут, и только носители его крови могут восходить на престол Хиклана, чтобы его мудрость всегда направляла последователей святого пророчества."
 trait_gh_blood_of_prophet_desc: "Хадасур, или «Кровь Пророка» — термин, обозначающий в обществе амсари членов правящей династии или тех, в чьих жилах течёт кровь Великого Пророка."

 trait_gh_chevalie_uniter: "Объединитель марок"
 trait_gh_chevalie_uniter_desc: "Войной, интригами, дипломатией или, скорее всего, всем сразу этот правитель объединил марочников Шевалье и возродил Высокое королевство древности. Многие предсказывают, что однажды новому правителю вновь придётся собирать разбитый трон по частям, но сейчас он правит как великий объединитель и не уступает высоким королям прошлого."
 trait_gh_chevalie_uniter_character_desc: "Войной, интригами, дипломатией или, скорее всего, всем сразу [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'объединила', 'объединил' )] марочников Шевалье и [Select_CString(ROOT.GetCharacter.IsFemale, 'возродила', 'возродил' )] Высокое королевство древности. Многие предсказывают, что однажды новому правителю вновь придётся собирать разбитый трон по частям, но сейчас [ROOT.GetCharacter.GetSheHe] правит как великий объединитель и не уступает высоким королям прошлого."

 trait_gh_chevalie_uniter_og: "Великий объединитель"
 trait_gh_chevalie_uniter_og_desc: "Впервые в истории этот правитель сплотил разрозненные племена шевигадов, объединив их как культурно, так и политически. Остаётся лишь надеяться, что это единство продержится долго и шевигады не падут жертвой прежних ужасов."
 trait_gh_chevalie_uniter_og_character_desc: "Впервые в истории [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сплотила', 'сплотил' )] разрозненные племена шевигадов, объединив их как культурно, так и политически. Остаётся лишь надеяться, что это единство продержится долго и шевигады не падут жертвой прежних ужасов."

 trait_gh_iyrossi_uniter: "Объединитель ийроссов"
 trait_gh_iyrossi_uniter_desc: "Войной, интригами, дипломатией или, скорее всего, всем вместе этот правитель сплотил бывших рабов ийроссов и стал их величайшей надеждой на будущее."
 trait_gh_iyrossi_uniter_character_desc: "Войной, интригами, дипломатией или, скорее всего, всем вместе [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сплотила', 'сплотил' )] разрозненных рабов ийроссов; [ROOT.GetCharacter.GetSheHe] правит как великий объединитель, не уступая Пофаклеасу древности."

 trait_gh_chosen_man: "Избранник"
 trait_gh_chosen_man_desc: "Этот персонаж был окроплён кровью [Concept('aversaria','аверсарианцев')|E] и стал одним из Избранников — тех, кому поручено блюсти Мандат Чистоты."
 trait_gh_chosen_man_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'была окроплена', 'был окроплён' )] кровью [Concept('aversaria','аверсарианцев')|E] и [Select_CString(ROOT.GetCharacter.IsFemale, 'стала одной из Избранниц', 'стал одним из Избранников' )] — тех, кому поручено блюсти Мандат Чистоты."

