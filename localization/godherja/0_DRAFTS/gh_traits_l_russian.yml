 trait_setup_flag_story_content_desc: ""

 trait_gh_yuankang_founding_father: "Отец-основатель"
 trait_gh_yuankang_founding_father_desc: "Этот персонаж — основатель республики Юанькан, который привёл народ Бронзовой гавани к независимости."
 trait_gh_yuankang_founding_father_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'основала', 'основал' )] республику Юанькан и [Select_CString(ROOT.GetCharacter.IsFemale, 'привела', 'привёл' )] народ Бронзовой гавани к независимости."

 trait_gh_high_emperor: "Шан-Хуан"
 trait_gh_high_emperor_desc: "Народ почитает этого персонажа как «Шан-Хуана» за великое свершение — основание первой династии Дахангона под властью катуни."
 trait_gh_high_emperor_character_desc: "Народ почитает [ROOT.GetCharacter.GetFirstNameNoTooltip] как «Шан-Хуана» за великое свершение — основание первой династии Дахангона под властью катуни."

 trait_gh_scion_of_nolan: "Отпрыск Нолана"
 trait_gh_scion_of_nolan_desc: "В жилах этого персонажа течёт божественная кровь: его считают истинным потомком [Concept('naklan_the_golden','Наклана')|E], и он занимает высокое положение."
 trait_gh_scion_of_nolan_character_desc: "В жилах [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] течёт божественная кровь: [ROOT.GetCharacter.GetHerHim] считают истинным потомком [Concept('naklan_the_golden','Наклана')|E], и [ROOT.GetCharacter.GetSheHe] занимает высокое положение."

 trait_gh_king_of_conquerors: "Завоеватель-аавтократ"
 trait_gh_king_of_conquerors_desc: "Этот персонаж прославился покорением далёких земель, куда не добирались даже древние аверсарианцы, и теперь правит бесчисленными чужеземными народами."
 trait_gh_king_of_conquerors_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'прославилась', 'прославился' )] покорением далёких земель, куда не добирались даже древние аверсарианцы, и теперь правит бесчисленными чужеземными народами."

 trait_gh_apparition: "Призрак"
 trait_gh_apparition_desc: "Этот персонаж — эфирный призрак. Он таится в мире смертных, а его потусторонний шёпот внушает врагам ужас."
 trait_gh_apparition_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — эфирный призрак. [ROOT.GetCharacter.GetSheHe|U] таится в мире смертных, а [ROOT.GetCharacter.GetHerHis] потусторонний шёпот внушает врагам ужас."

 trait_dragonmaster: "Повелитель драконов"
 trait_dragonmaster_drakengard: "Дракенгард"
 trait_dragonmaster_desc: "Этот персонаж обучен командовать отрядом несравненных [Concept('dragons','драконьих наездников')|E] — такая должность внушает в равной мере уважение и страх."
 trait_dragonmaster_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'обучена', 'обучен' )] командовать отрядом несравненных [Concept('dragons','драконьих наездников')|E] — такая должность внушает в равной мере уважение и страх."

 trait_adopted: "Принятый в дом"
 trait_adopted_desc: "Этот персонаж был принят в новую [Concept('dynasty','династию')|E] и разорвал все прежние родовые связи."
 trait_adopted_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'была принята', 'был принят' )] в дом [ROOT.GetCharacter.GetHouse.GetName], разорвав все прежние династические связи."
 trait_adopted_axiaotheos_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'была принята', 'был принят' )] в дом [ROOT.GetCharacter.GetHouse.GetName|V] по воле $hecaeda_link$ Гекаэды#!, оставив в прошлом прежний дом $varixion_link$ Вариксион#! и свою мать, [GetScriptedCharacterByHistoryID('easternimperial_aversarinas_aagiokrata_90').GetName|V]."
 trait_adopted_arkloba_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'была принята', 'был принят' )] в дом [ROOT.GetCharacter.GetHouse.GetName|V] по воле $cenware_link$ Ценвара#! и [GetScriptedCharacterByHistoryID('daukeni_sjalvolki_21').GetName|V] — безродной крестьянки аверсарианского происхождения, ставшей частью знатной семьи Сокрушителя ведьм."