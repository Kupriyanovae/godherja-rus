 trait_track_magical_death_desc: "Овладейте силой загробного мира."
 trait_track_magical_blood: "Сродство с кровью"
 trait_track_magical_blood_desc: "Овладейте силой жизни и смерти."
 trait_track_magical_sand: "Сродство с песком"
 trait_track_magical_sand_desc: "Овладейте силой бескрайней пустыни."
 trait_track_magical_metal: "Сродство с металлом"
 trait_track_magical_metal_desc: "Овладейте силой кузнечного пламени и стали."
 trait_track_magical_ethereal: "Сродство с эфиром"
 trait_track_magical_ethereal_desc: "Овладейте силой духовного мира."
 trait_track_magical_celestial: "Сродство со звездами"
 trait_track_magical_celestial_desc: "Овладейте силой небесных светил."
 trait_track_magical_nature: "Сродство с природой"
 trait_track_magical_nature_desc: "Овладейте силой дикой природы."
 trait_track_magical_dawn: "Сродство с рассветом"
 trait_track_magical_dawn_desc: "Овладейте силой новых начинаний."
 trait_track_magical_hymns: "Сродство с гимнами"
 trait_track_magical_hymns_desc: "Овладейте силой священной музыки."
 trait_track_magical_time: "Сродство со временем"
 trait_track_magical_time_desc: "Овладейте силой прошлого, настоящего и будущего."

 trait_thura_myinthein: "Тура Мьинтейн, Помазанник"
 trait_thura_myinthein_desc: "Этот персонаж явился исполнением древнего пророчества — могучий воин, которому суждено изгнать тьму и объединить разрозненные наттананские царства. Направляемый волей Богов-Близнецов, Тура Мьинтейн изгнал нечестивых еретиков Корлакана, очистил землю от скверны и зла и основал великую Наттананскую империю Тура Тав, что служит вечным напоминанием о благоволении Богов-Близнецов."

 trait_thura_myinthein_descendant: "Потомок Туры Мьинтейна"
 trait_thura_myinthein_descendant_desc: "Этот персонаж — прямой потомок Туры Мьинтейна."
 trait_thura_myinthein_descendant_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — прямой потомок Туры Мьинтейна."

 trait_gh_minister: "Министр"
 trait_gh_minister_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — выдающийся управленец и судья, что делает [ROOT.GetCharacter.GetHerHim] идеальной кандидатурой на роль министра."
 trait_gh_minister_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] имеет богатый опыт управления землями и отлично справляется с обязанностями министра."
 trait_gh_minister_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'приобрела', 'приобрел' )] ценные навыки, исполняя обязанности министра."

 trait_setup_flag_opening_event: ""
 trait_setup_flag_opening_event_desc: ""
