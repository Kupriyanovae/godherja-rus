 trait_gh_one_with_mist: "Единство с Туманом"
 trait_gh_one_with_mist_desc: "Сны этого персонажа клубятся туманом, и он чувствует себя в бестелесном мире столь же свободно, сколь и в мире грубой материи."
 trait_gh_one_with_mist_char_desc: "Сны [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] клубятся туманом, и [ROOT.GetCharacter.GetSheHe] чувствует себя в бестелесном мире столь же свободно, сколь и в мире грубой материи."
 # TRAIT_FLAG_DESC_gh_one_with_mist_spell_variance: "Открывает более могущественные (но и более рискованные) варианты для заклинаний Лиминальной магии"
 
 trait_gh_pale_seer: "Бледный провидец"
 trait_gh_pale_seer_desc: "Бледный провидец способен почти без усилий переносить свой разум в Разлом и кружиться среди истлевающих нитей реальности. И пока большинство блуждает в этом перекрученном царстве, бледный провидец свободно передвигается по нему, постигая тайны прошлого, настоящего и будущего."
 trait_gh_pale_seer_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] может почти без усилий переносить свой разум в Разлом и кружиться среди истлевающих нитей реальности. И пока большинство блуждает в этом перекрученном царстве, [ROOT.GetCharacter.GetFirstNameNoTooltip] свободно передвигается по нему, постигая тайны прошлого, настоящего и будущего."
 TRAIT_FLAG_DESC_gh_pale_seer_spell_reroll: "Позволяет перебрасывать результаты «Взора в реальность»"
 
 trait_gh_reifier: "Проникающий в грёзы"
 trait_gh_reifier_desc: "Большинство считают ночные часы лишь временем для отдыха. Для этого персонажа в это время начинается иная жизнь. С смыканием веков он ступает в мир снов — затянутое туманом царство жутких тайн, нерожденных мерзостей и обжигающих истин. Порой бывает трудно понять, какой из двух миров более реален."
 trait_gh_reifier_char_desc: "Большинство считают ночные часы лишь временем для отдыха. Для [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] в это время начинается иная жизнь. С смыканием веков [ROOT.GetCharacter.GetSheHe] ступает в мир снов — затянутое туманом царство жутких тайн, нерожденных мерзостей и обжигающих истин. Порой бывает трудно понять, какой из двух миров более реален."
 
 trait_lifestyle_jurist: "Правовед"
 trait_track_lifestyle_jurist: "Правоведение"
 
 trait_lifestyle_jurist_desc: "Этот персонаж усвоил основы сложнейших легалистских доктрин варденизма. Хотя он прекрасно знает порядок судебного процесса и базовые методики, он всё еще стоит в самом начале своего пути к юридическому мастерству. Это, конечно, лучше полного отсутствия знаний, но его, скорее всего, разнесут в пух и прах в любом суде под председательством хоть сколько-нибудь толкового судьи. Для многих представителей сельских низов это абсолютная вершина образования — хотя тех редких умельцев, что проявляют особый талант, могут отослать в города с рекомендательными письмами для продолжения учебы."
 trait_lifestyle_jurist_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'усвоила', 'усвоил' )] основы сложнейших легалистских доктрин варденизма. Хотя [ROOT.GetCharacter.GetSheHe] прекрасно знает порядок судебного процесса и базовые методики, [ROOT.GetCharacter.GetSheHe] всё еще стоит в самом начале своего пути к юридическому мастерству. Это, конечно, лучше полного отсутствия знаний, но [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip], скорее всего, разнесут в пух и прах в любом суде под председательством хоть сколько-нибудь толкового судьи. Для многих представителей сельских низов это абсолютная вершина образования — хотя тех редких умельцев, что проявляют особый талант, могут отослать в города с рекомендательными письмами для продолжения учебы."
 
 trait_jurist_2: "Опытный правовед"
 trait_jurist_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'получила', 'получил' )] достаточное образование, чтобы выступать в роли сносного судьи, законника или ученого в запутанной системе варденитского права и судов. Действительно, варденитский мир полнится чиновниками такого уровня — совершенно ничем не примечательными исполнителями, способными грамотно вести большинство обычных дел. Однако [ROOT.GetCharacter.GetSheHe] всё еще будет с трудом справляться с высшим искусством варденитского легализма, особенно в делах с политическим подтекстом. Тем не менее для большинства варденитов достижение даже такого уровня считается высокой честью и требует лет усердной учебы. А для амбициозных людей это лишь первый шаг."
 
 trait_jurist_3: "Выдающийся правовед"
 trait_jurist_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'продемонстрировала', 'продемонстрировал' )] уровень навыков, выгодно выделяющий [ROOT.GetCharacter.GetHerHim] из массы обычных законников, составляющих большинство варденитского юридического сословия. [ROOT.GetCharacter.GetSheHe] уже пробует себя в судебной практике, выходящей за рамки простых убийств, краж или наследственных споров. Многие из тех, кто достиг этой степени образования, стремятся к престижным судейским должностям, и их часто можно увидеть на скамьях важнейших судебных процессов страны, где они с жадностью впитывают ход разбирательств."
 
 trait_jurist_4: "Мастер-правовед"
 trait_jurist_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — редкий талант, поднявшийся далеко над коллегами. Его знание законов крайне высоко ценится великими и могущественными деятелями варденитского общества, а его экспертные заключения читают и обсуждают ученые по всему варденитскому миру. Он знает все тонкости и уловки, способные оставить в дураках менее искушенные умы, и даже примешивает элементы театральности в обычно строгие заседания варденитских судов, когда это уместно. Правоведы такого уровня обычно соперничают друг с другом за должности верховных судей. Уникальные навыки делают их настолько опасными, что местные лорды внимательно следят за ними — и горе тому не подготовленному правителю, который перейдет дорогу мастеру-законнику."
 
 trait_jurist_5: "Легендарный правовед"
 trait_jurist_5_character_desc: "Талант, рождающийся раз в поколение. Годами трудов и исследований [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'достигла', 'достиг' )] такого уровня юридического мастерства, которым за всю историю варденизма обладали лишь единицы. Даже мамуры опасаются отменять [ROOT.GetCharacter.GetHerHis] решения, а остальные правоведы смотрят на [ROOT.GetCharacter.GetHerHim] со смесью страха и почтения. [ROOT.GetCharacter.GetSheHe] либо основует новую юридическую школу, либо выведет к процветанию уже существующую. Что бы [ROOT.GetCharacter.GetSheHe] ни [Select_CString(ROOT.GetCharacter.IsFemale, 'выбрала', 'выбрал' )], [ROOT.GetCharacter.GetHerHis] решения будут определять варденитскую доктрину на века вперед."

