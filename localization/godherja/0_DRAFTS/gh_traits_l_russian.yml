 trait_magic_good_13_character_desc: "Обладая почти мифической мощью, такие [Concept('magi','маги')|E], как [ROOT.GetCharacter.GetFirstNameNoTooltip], появляются, быть может, раз в эон. Расцвет и падение целых народов следуют за ними по пятам."
 
 trait_magic_good_14: "Невероятно могущественный [Concept('magi','маг')|E] I"
 trait_magic_good_14_desc: "Многие ученые утверждали, что [Concept('magi','маг')|E] такой силы не должны существовать. Дети, рожденные с такой концентрацией магии в крови, рисковали бы случайно уничтожить себя и всё вокруг с самого момента рождения. Как же они ошибались."
 trait_magic_good_14_character_desc: "Многие ученые утверждали, что [Concept('magi','маг')|E] такой силы не должны существовать. Дети, рожденные с такой концентрацией магии в крови, рисковали бы случайно уничтожить себя и всё вокруг с самого момента рождения. Как же они ошибались."
 
