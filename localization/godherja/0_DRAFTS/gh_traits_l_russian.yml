 trait_magic_good_11: "Великий [Concept('magi','маг')|E] I"
 trait_magic_good_11_desc: "Такие [Concept('magi','маги')|E] почти мифической силы появляются лишь раз в эпоху. Их появление определяет расцвет и падение целых народов."
 trait_magic_good_11_character_desc: "Такие [Concept('magi','маги')|E], как [ROOT.GetCharacter.GetFirstNameNoTooltip], обладают почти мифической силой и появляются лишь раз в эпоху. Их появление определяет расцвет и падение целых народов."
 
 trait_magic_good_12: "Великий [Concept('magi','маг')|E] II"
 trait_magic_good_12_desc: "Такие [Concept('magi','маги')|E] почти мифической силы появляются лишь раз в эпоху. Их появление определяет расцвет и падение целых народов."
 trait_magic_good_12_character_desc: "Такие [Concept('magi','маги')|E], как [ROOT.GetCharacter.GetFirstNameNoTooltip], обладают почти мифической силой и появляются лишь раз в эпоху. Их появление определяет расцвет и падение целых народов."

 trait_magic_good_13: "Великий [Concept('magi','маг')|E] III"
 trait_magic_good_13_desc: "Такие [Concept('magi','маги')|E] почти мифической силы появляются лишь раз за многие эпохи. Их появление определяет расцвет и падение целых народов."
 trait_magic_good_13_character_desc: "Такие [Concept('magi','маги')|E], как [ROOT.GetCharacter.GetFirstNameNoTooltip], обладают почти мифической силой и появляются лишь раз за многие эпохи. Их появление определяет расцвет и падение целых народов."
 
 trait_magic_good_14: "Невероятно могущественный [Concept('magi','маг')|E] I"
 trait_magic_good_14_desc: "Многие учёные считали, что [Concept('magi','маги')|E] такой силы не могут существовать. Ребёнок с настолько мощной магической кровью с самого рождения рисковал бы случайно уничтожить себя и всё вокруг. Но они ошибались."
 trait_magic_good_14_character_desc: "Многие учёные считали, что [Concept('magi','маги')|E] такой силы не могут существовать. Ребёнок с настолько мощной магической кровью с самого рождения рисковал бы случайно уничтожить себя и всё вокруг. Но они ошибались."
 
 trait_magic_good_15: "Невероятно могущественный [Concept('magi','маг')|E] II"
 trait_magic_good_15_desc: "Многие учёные считали, что [Concept('magi','маги')|E] такой силы не могут существовать. Ребёнок с настолько мощной магической кровью с самого рождения рисковал бы случайно уничтожить себя и всё вокруг. Но они ошибались."
