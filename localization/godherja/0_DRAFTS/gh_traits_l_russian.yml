 trait_magic_good_6_desc: "Этот персонаж — один из величайших [Concept('magi','магов')|E] своей эпохи, способный на невероятные свершения как в разрушении, так и в созидании. Хотя в истории встречались и более могущественные чародеи, подобные личности рождаются едва ли чаще раза в столетие. Лишь благодаря продуманным и многовековым династическим программам общество способно породить больше, чем горстку таких чародеев, да и тогда подобный чародей считается воистину редчайшим сокровищем."
 trait_magic_good_6_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — один из величайших [Concept('magi','магов')|E] своей эпохи, [Select_CString(ROOT.GetCharacter.IsFemale, 'способная', 'способный' )] на невероятные свершения как в разрушении, так и в созидании. Хотя в истории встречались и более могущественные чародеи, подобные личности рождаются едва ли чаще раза в столетие. Лишь благодаря продуманным и многовековым династическим программам общество способно породить больше, чем горстку таких чародеев, да и тогда такой [Concept('magi','маг')|E], как [ROOT.GetCharacter.GetFirstNameNoTooltip], остается единственным в своем роде."
 
