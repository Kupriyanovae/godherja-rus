 #invasion stuff
 
 trait_fogeater_invasion_leader: "Гарфордаэр"
 trait_fogeater_invasion_leader_desc: "Гарфордаэр — самопровозглашенный «Рекущий войну» объединенных кланов [Concept('fogeaters','пожирателей тумана')|E]. Заявляя, будто услышал истинные слова Туманной Матери, и проявив удивительную для [Concept('fogeaters','пожирателей тумана')|E] хлыщность и рассудительность, он разгромил своих оппонентов, сплотил племена Слушателей и теперь ведет их маршем на известный мир ради неведомой цели.\n\nОн внушает страх не только своим величественным и жутким обликом — те немногие, кто видел его и выжил, не могут отрицать витающую вокруг него странность. От глухого шепота, раздающегося всякий раз, когда он рядом, до искажения и расплывания в глазах при взгляде на его искаженный лик..."
 trait_fogeater_invasion_leader_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — самопровозглашенный «Рекущий войну» объединенных кланов [Concept('fogeaters','пожирателей тумана')|E]. Заявляя, будто [Select_CString(ROOT.GetCharacter.IsFemale, 'услышала', 'услышал' )] истинные слова Туманной Матери, и проявив удивительную для [Concept('fogeaters','пожирателей тумана')|E] хлыщность и рассудительность, [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сокрушила своих противников и сплотила', 'сокрушил своих противников и сплотил' )] племена Слушателей, а теперь ведет их маршем на известный мир ради неведомой цели.\n\n[ROOT.GetCharacter.GetSheHe|U] внушает страх не только своим величественным и жутким обликом — те немногие, кто видел [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] и выжил, не могут отрицать витающую вокруг [ROOT.GetCharacter.GetHerHim] странность. От глухого шепота, раздающегося всякий раз, когда [ROOT.GetCharacter.GetSheHe] рядом, до искажения и расплывания в глазах при взгляде на [ROOT.GetCharacter.GetHerHis] искаженный лик..."
