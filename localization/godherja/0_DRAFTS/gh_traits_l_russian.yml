 trait_magic_good_16_character_desc: "Многие ученые утверждали, что [Concept('magi','маги')|E] такой силы не должны существовать. Дети, рожденные с такой концентрацией магии в крови, рисковали бы случайно уничтожить себя и всё вокруг с самого момента рождения. Как же они ошибались."
 
 trait_magic_good_17: "Богоподобный [Concept('magi','маг')|E]" 
 trait_magic_good_17_desc: "Пространство заметно искажается вокруг этого [Concept('magi','мага')|E]. Мощь просачивается в воздух вокруг него. Он способен убить одним лишь словом. Если [Concept('magi','маг')|E] подобного могущества и существовал прежде, то не сохранилось хроник, способных поведать о нем."
 trait_magic_good_17_character_desc: "Пространство заметно искажается вокруг [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]. Мощь просачивается в воздух вокруг [ROOT.GetCharacter.GetHerHim]. [ROOT.GetCharacter.GetSheHe|U] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] убить одним лишь словом. Если [Concept('magi','маг')|E] подобного могущества и существовал прежде, то не сохранилось хроник, способных поведать о нем."
 
 trait_magic_good_18: "Немыслимо могущественный [Concept('magi','маг')|E]"
 trait_magic_good_18_desc: "Этот [Concept('magi','маг')|E] повелевает нечеловеческой силой. Термины, используемые его собратьями-магами (если столь ничтожных существ еще можно называть «собратьями»), совершенно бессильны описать его потенциал. Просто находиться рядом с этим чародеем — значит подпасть под его незримое рабство."
 trait_magic_good_18_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] повелевает нечеловеческой силой. Термины, используемые [ROOT.GetCharacter.GetHerHis] собратьями-магами (если столь ничтожные силы еще можно называть «собратьями»), совершенно бессильны описать [ROOT.GetCharacter.GetHerHis] потенциал. Просто находиться рядом с [ROOT.GetCharacter.GetFirstNameWithNoTooltip] — значит подпасть под незримое рабство."
 
 trait_magic_good_19: "Незримо-неудержимый [Concept('magi','маг')|E]"
 trait_magic_good_19_desc: "Никакая сила на [Concept('aeras','Эрасе')|E] не может противостоять этому [Concept('magi','магу')|E]. Его потенциал закручивается внутрь — в бесконечное погружение в силу. Некоторые шепчутся, что его больше нельзя считать человеком, — и с этим выводом трудно спорить. Как обычный [Concept('magi','маг')|E] возвышается над человеком, так и этот властелин силы возвышается над простым [Concept('magi','магом')|E]."
 trait_magic_good_19_character_desc: "Никакая сила на [Concept('aeras','Эрасе')|E] не может противостоять [ROOT.GetCharacter.GetFirstNameNoTooltip]. [ROOT.GetCharacter.GetHerHis|U] потенциал закручивается внутрь — в бесконечное погружение в силу. Некоторые шепчутся, что [ROOT.GetCharacter.GetFirstNameNoTooltip] больше нельзя считать человеком, — и с этим выводом трудно спорить. Как обычный [Concept('magi','маг')|E] возвышается над человеком, так и этот властелин силы возвышается над простым [Concept('magi','магом')|E]."
 
 trait_magic_good_20: "Невообразимо могущественный [Concept('magi','маг')|E]"
 trait_magic_good_20_desc: "Если жители [Concept('aeras','Эраса')|E] решат поклоняться этому персонажу как богу, они не сильно ошибутся. Это существо обладает такой мощью, что любому смертному можно простить подобное заблуждение. Как бы то ни было, это воплощение — ближайшее к живому богу из всего, что осталось в этом мире."
 trait_magic_good_20_character_desc: "Если жители [Concept('aeras','Эраса')|E] решат поклоняться [ROOT.GetCharacter.GetFirstNameNoTooltip] как богу, они не сильно ошибутся. [ROOT.GetCharacter.GetSheHe|U] обладает такой мощью, что любому смертному можно простить подобную ошибку. Как бы то ни было, [ROOT.GetCharacter.GetSheHe] — ближайшее к живому богу из всего, что осталось в этом мире."
 
 TRAIT_DESC_POSIITIVE_FOR_THEM: "Магия почитается в некоторых религиях:"

##ORIGIN##
 trait_gh_peasant_birth: "Крестьянское происхождение"
 trait_gh_peasant_birth_desc: "Этот персонаж вырос на самом дне общества, и хотя каким-то образом сумел добиться высокого положения, прочие «дворяне» испытывают к нему скорее раздражение, чем уважение."
 trait_gh_peasant_birth_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'выросла', 'вырос' )] на самом дне общества, и хотя каким-то образом [Select_CString(ROOT.GetCharacter.IsFemale, 'добилась', 'добился' )] высокого положения, прочие «дворяне» испытывают к [ROOT.GetCharacter.GetHerHim] скорее раздражение, чем уважение."
 trait_gh_puppet: "Политическая марионетка"
 trait_gh_puppet_desc: "Этого персонажа фактически контролирует кто-то другой — он пляшет под чужую дудку, лишь изображая власть. Хуже всего то, что это ни для кого не секрет."
 trait_gh_puppet_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] фактически находится под чужим контролем — [ROOT.GetCharacter.GetSheHe] пляшет под чужую дудку, лишь изображая власть. Хуже всего то, что это ни для кого не секрет."
 trait_gh_gedeora_child: "Дитя [Concept('gedeora', 'гедеоры')|E]"
 trait_gh_gedeora_child_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'была поражена', 'был поражен' )] ещё в чреве матери [Concept('gedeora', 'гедеорой')|E] — ужасным проклятием для большинства, но, возможно, знаком величия для некоторых."

 #Konijkmener traits#
 trait_konijkmener_councilists: "Раадилист"
 trait_konijkmener_councilists_1: "Раадилист"
 trait_konijkmener_councilists_1_desc: "Этот персонаж принадлежит к раадилистам — одной из двух главных политических фракций дворянства Канцереркерий. Раадилисты ведут свою историю от регентского совета Конена Хейрдванга, который родился в коме и оставался в ней до самой смерти. Совет дворян взял управление в свои руки и сплотился в единую фракцию, когда преемник Хейрдванга, Каусен, отказался признать легитимность совета и закрыл перед ними двери своего дворца. В ответ совет начал прибивать законы прямо к дверям дворца от имени Каусена, а любые попытки короля отменить их указы просто игнорировались.\n\nРаадилисты были отстранены от власти во время Народной революции 1099 года, но потомки партии с тех пор не оставляют попыток вернуть дворянству абсолютную власть, а многие и вовсе мечтают о реставрации монархии, чтобы посадить на престол марионеточного государя."
 trait_konijkmener_councilists_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] принадлежит к раадилистам — одной из двух главных политических фракций дворянства Канцереркерий. Раадилисты ведут свою историю от регентского совета Конена Хейрдванга, который родился в коме и оставался в ней до самой смерти. Совет дворян взял управление в свои руки и сплотился в единую фракцию, когда преемник Хейрдванга, Каусен, отказался признать легитимность совета и закрыл перед ними двери своего дворца. В ответ совет начал прибивать законы прямо к дверям дворца от имени Каусена, а любые попытки короля отменить их указы просто игнорировались.\n\nРаадилисты были отстранены от власти во время Народной революции 1099 года, но потомки партии с тех пор не оставляют попыток вернуть дворянству абсолютную власть, а многие и вовсе мечтают о реставрации монархии, чтобы посадить на престол марионеточного государя."
 trait_konijkmener_peopleofunity: "Унитариш"
 trait_konijkmener_peopleofunity_1: "Унитариш"
 trait_konijkmener_peopleofunity_1_desc: "Этот персонаж принадлежит к унитариям — одной из двух главных политических фракций дворянства Канцереркерий. Свое название они получили в честь первых слов декларации Казелерена Броде о создании нового государства в 1099 году: «Мы — народ единства». Свергнув регентский совет, который к тому времени стал восприниматься как бездарный и коррумпированный и удерживал полную власть почти 150 лет, унитарии фактически установили республику. Правда, такую, где право голоса имеют только землевладельцы, а канцлер правит пожизненно. Судя по всему, Народная революция была не столько революцией, сколько перехватом власти мелким дворянством у крупной знати, контролировавшей совет.\n\nУнитарии до сих пор пользуются популярностью как среди низших слоев, так и среди многих дворян, а сама фракция выступает за сохранение «республиканского» строя."
 trait_konijkmener_peopleofunity_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] принадлежит к унитариям — одной из двух главных политических фракций дворянства Канцереркерий. Свое название они получили в честь первых слов декларации Казелерена Броде о создании нового государства в 1099 году: «Мы — народ единства». Свергнув регентский совет, который к тому времени стал восприниматься как бездарный и коррумпированный и удерживал полную власть почти 150 лет, унитарии фактически установили республику. Правда, такую, где право голоса имеют только землевладельцы, а канцлер правит пожизненно. Судя по всему, Народная революция была не столько революцией, сколько перехватом власти мелким дворянством у крупной знати, контролировавшей совет.\n\nУнитарии до сих пор пользуются популярностью как среди низших слоев, так и среди многих дворян, а сама фракция выступает за сохранение «республиканского» строя."
 
 #Religion#
 trait_gh_blood_of_prophet: "Хадасур"
 trait_gh_blood_of_prophet_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — потомок легендарного Пророка, из чьих пророчеств нам веками ведом ход всей истории. Это чтимый род, и только обладатели крови Пророка могут восходить на престол Хиклана, дабы его мудрость в той или иной форме всегда направляла последователей святого пророчества."
 trait_gh_blood_of_prophet_desc: "Хадасур, или «Кровь Пророка» — термин, обозначающий в обществе амсари членов правящей династии или тех, в чьих жилах течет кровь Великого Пророка."

 trait_gh_chevalie_uniter: "Объединитель Марки"
 trait_gh_chevalie_uniter_desc: "Войной, интригами, дипломатией или, скорее всего, всем вместе этот правитель объединил марочников Шевалье в былое Верховное королевство. И хотя многие предрекают, что настанет час, когда очередному властелину снова придется собирать воедино разбитый трон, пока что он правит как великий объединитель, равный верховным королям древности."
 trait_gh_chevalie_uniter_character_desc: "Войной, интригами, дипломатией или, скорее всего, всем вместе [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'объединила', 'объединил' )] марочников Шевалье в былое Верховное королевство. И хотя многие предрекают, что настанет час, когда очередному властелину снова придется собирать воедино разбитый трон, пока что [ROOT.GetCharacter.GetSheHe] правит как великий объединитель, равный верховным королям древности."

 trait_gh_chevalie_uniter_og: "Великий объединитель"
 trait_gh_chevalie_uniter_og_desc: "Впервые в истории этот правитель сплотил разрозненные племена шевигадов, объединив их как культурно, так и политически. Остается лишь надеяться, что это единство продержится долго и шевигады не падут жертвой прежних ужасов."
 trait_gh_chevalie_uniter_og_character_desc: "Впервые в истории [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сплотила', 'сплотил' )] разрозненные племена шевигадов, объединив их как культурно, так и политически. Остается лишь надеяться, что это единство продержится долго и шевигады не падут жертвой прежних ужасов."

 trait_gh_iyrossi_uniter: "Объединитель ийроссов"
 trait_gh_iyrossi_uniter_desc: "Войной, интригами, дипломатией или, скорее всего, всем вместе этот правитель сплотил бывших рабов ийроссов и стал их величайшей надеждой на будущее."
 trait_gh_iyrossi_uniter_character_desc: "Войной, интригами, дипломатией или, скорее всего, всем вместе [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сплотила', 'сплотил' )] разрозненных рабов ийроссов; [ROOT.GetCharacter.GetSheHe] правит как великий объединитель, равный Пофаклеасу древности."

 trait_gh_chosen_man: "Избранник"
 trait_gh_chosen_man_desc: "Этот персонаж был окроплен кровью [Concept('aversaria','аверсарианцев')|E] и стал одним из Избранников — тех, кому поручено блюсти Мандат Чистоты."
 trait_gh_chosen_man_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'была окроплена', 'был окроплен' )] кровью [Concept('aversaria','аверсарианцев')|E] и [Select_CString(ROOT.GetCharacter.IsFemale, 'стала одной из Избранниц', 'стал одним из Избранников' )] — тех, кому поручено блюсти Мандат Чистоты."

