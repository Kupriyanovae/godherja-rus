 trait_magic_good_8: "Чистокровный [Concept('magi','маг')|E] I"
 trait_magic_good_8_desc: "Такие [Concept('magi','маги')|E] словно сошли со страниц легенд: за всё время существования целой цивилизации их может появиться лишь один или два. От их решений зависит ход истории."
