 trait_gh_the_last_nikaryin: "Последний никарин"
 trait_gh_the_last_nikaryin_desc: "Последний никарин, почитаемый богами, — последний пережиток древнего мира. Никарины возглавляли гвардию Аэрсодиакса и были его самыми верными слугами. Они не покинули своего владыку даже тогда, когда предатели отвернулись от него и сразили его в великой войне древности, прежде чем поднять руку на самих богов.\n\nНо времена меняются: племена должны объединиться и вернуть владения, которыми некогда правил Аэрсодиакс. Теперь, когда его верные дети создали собственную великую империю по образцу прежней, никарину пора оставить службу военачальника и начать новую эпоху в качестве императора. Последний никарин закрепил эту перемену и провозгласил новую великую империю во славу Аэрсодиакса."
 trait_gh_the_last_nikaryin_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — последний никарин, почитаемый богами, и последний пережиток древнего мира. Никарины возглавляли гвардию Аэрсодиакса и были его самыми верными слугами. Они не покинули своего владыку даже тогда, когда предатели отвернулись от него и сразили его в великой войне древности, прежде чем поднять руку на самих богов.\n\nНо времена меняются: племена должны объединиться и вернуть владения, которыми некогда правил Аэрсодиакс. Теперь, когда его верные дети создали собственную великую империю по образцу прежней, никарину пора оставить службу военачальника и начать новую эпоху в качестве императора. Как последний никарин, [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'закрепила', 'закрепил' )] эту перемену и [Select_CString(ROOT.GetCharacter.IsFemale, 'провозгласила', 'провозгласил' )] новую великую империю во славу Аэрсодиакса."

 trait_gh_axiaothea_reborn: "Возрождённая Аксиотея"
 trait_gh_axiaothea_reborn_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], возрождённая Аксиотея, [Select_CString(ROOT.GetCharacter.IsFemale, 'воссоединила', 'воссоединил' )] расколотую империю и наконец [Select_CString(ROOT.GetCharacter.IsFemale, 'заняла', 'занял' )] законный престол. Да будет [ROOT.GetCharacter.GetHerHis] правление вечным!"

 trait_gh_aeschraes_killer: "Палач Эшрея"
 trait_gh_aeschraes_killer_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'пленила', 'пленил' )] самого Эшрея — Расколовшего мир, Владыку пепла — и одним взмахом [ROOT.GetCharacter.GetHerHis] клинка навсегда [Select_CString(ROOT.GetCharacter.IsFemale, 'заставила', 'заставил' )] могущественного мага замолчать."
 trait_gh_aeschraes_killer_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'пленила', 'пленил' )] самого Эшрея — Расколовшего мир, Владыку пепла — и одним взмахом [ROOT.GetCharacter.GetHerHis] клинка навсегда [Select_CString(ROOT.GetCharacter.IsFemale, 'заставила', 'заставил' )] могущественного мага замолчать."

 trait_adabyss_invasion_leader: "Лельманд"
 trait_adabyss_invasion_leader_desc: "Лельманд — официальный титул командующего адабисским аналогом [Concept('aversaria','аверсарианского')|E] легиона. Пройдя 47 испытаний, необходимых для получения командной должности в огромной военной структуре Адабисса, и освоив оружие, о котором на севере могли лишь мечтать, лельманд теперь ведёт Мосеку Лимпегайл, или «Янтарный корпус», в поход на северные земли.\n\nКорпус — лишь малая часть адабисской армии: завоевание северных королевств считается не более чем второстепенной кампанией на фоне куда более важных и прибыльных вторжений на юге и востоке. И всё же адабисцам, наступающим с технологиями, которые некогда считались доступными лишь богам, словно нет числа."
 trait_adabyss_invasion_leader_character_desc: "Лельманд — официальный титул командующего адабисским аналогом [Concept('aversaria','аверсарианского')|E] легиона. Пройдя 47 испытаний, необходимых для получения командной должности в огромной военной структуре Адабисса, и освоив оружие, о котором на севере могли лишь мечтать, [ROOT.GetCharacter.GetFirstNameNoTooltip] теперь ведёт Мосеку Лимпегайл, или «Янтарный корпус», в поход на северные земли.\n\nКорпус — лишь малая часть адабисской армии: завоевание северных королевств считается не более чем второстепенной кампанией на фоне куда более важных и прибыльных вторжений на юге и востоке. И всё же адабисцам, наступающим с технологиями, которые некогда считались доступными лишь богам, словно нет числа."

 trait_gh_magicsickness_1: "Лёгкая [Concept('exposure_sickness','магическая немочь')|E]"
 trait_gh_magicsickness_1_desc: "Воздействие огромного количества [Concept('magic','магии')|E] имеет множество тяжёлых последствий для тела. При лёгкой [Concept('exposure_sickness','магической немочи')|E] этот персонаж страдает от внезапных приступов тошноты и рвоты, головной боли, усталости и жара. При близком рассмотрении видно, что вены стали заметнее, а кровь быстро движется прямо под кожей. Иногда она даже начинает сочиться из ушей, носа или рта."
 trait_gh_magicsickness_1_character_desc: "Воздействие огромного количества [Concept('magic','магии')|E] имеет множество тяжёлых последствий для тела. При лёгкой [Concept('exposure_sickness','магической немочи')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] страдает от внезапных приступов тошноты и рвоты, головной боли, усталости и жара. При близком рассмотрении видно, что [ROOT.GetCharacter.GetHerHis] вены стали заметнее, а кровь быстро движется прямо под кожей. Иногда она даже начинает сочиться из ушей, носа или рта."

 trait_gh_magicsickness_2: "Умеренная [Concept('exposure_sickness','магическая немочь')|E]"
 trait_gh_magicsickness_2_desc: "Воздействие огромного количества [Concept('magic','магии')|E] имеет множество тяжёлых последствий для тела. При умеренной [Concept('exposure_sickness','магической немочи')|E] этот персонаж страдает от внезапных приступов тошноты и рвоты, головной боли, усталости и жара. При близком рассмотрении видно, что вены стали заметнее, а кровь быстро движется прямо под кожей. Иногда она даже начинает сочиться из ушей, носа или рта."
 trait_gh_magicsickness_2_character_desc: "Воздействие огромного количества [Concept('magic','магии')|E] имеет множество тяжёлых последствий для тела. При умеренной [Concept('exposure_sickness','магической немочи')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] страдает от внезапных приступов тошноты и рвоты, головной боли, усталости и жара. При близком рассмотрении видно, что [ROOT.GetCharacter.GetHerHis] вены стали заметнее, а кровь быстро движется прямо под кожей. Иногда она даже начинает сочиться из ушей, носа или рта."
 
 trait_gh_magicsickness_3: "Сильная [Concept('exposure_sickness','магическая немочь')|E]"
 trait_gh_magicsickness_3_desc: "Воздействие огромного количества [Concept('magic','магии')|E] имеет множество тяжёлых последствий для тела. При сильной [Concept('exposure_sickness','магической немочи')|E] этот персонаж быстро теряет способность действовать самостоятельно: большую часть дня его рвёт, а при ухудшении — кровью, и без помощи он часто не может даже стоять. Кровь постоянно сочится из глаз, носа и ушей, а иногда скапливается под кожей в таком количестве, что начинает проступать наружу. В этих местах кожа отслаивается, а мышцы словно плавятся от переполняющей тело магической силы."
 trait_gh_magicsickness_3_character_desc: "Воздействие огромного количества [Concept('magic','магии')|E] имеет множество тяжёлых последствий для тела. При сильной [Concept('exposure_sickness','магической немочи')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] быстро теряет способность действовать самостоятельно: большую часть дня [ROOT.GetCharacter.GetHerHim] рвёт, а при ухудшении — кровью, и без помощи [ROOT.GetCharacter.GetSheHe] часто не может даже стоять. Кровь постоянно сочится из [ROOT.GetCharacter.GetHerHis] глаз, носа и ушей, а иногда скапливается под кожей в таком количестве, что начинает проступать наружу. В этих местах кожа отслаивается, а мышцы словно плавятся от переполняющей тело магической силы."

 trait_gh_magicsickness_4: "Тяжёлая [Concept('exposure_sickness','магическая немочь')|E]"
 trait_gh_magicsickness_4_desc: "Воздействие огромного количества [Concept('magic','магии')|E] имеет множество тяжёлых последствий для тела. При тяжёлой [Concept('exposure_sickness','магической немочи')|E] этот персонаж быстро теряет способность действовать самостоятельно: большую часть дня его рвёт, а при ухудшении — кровью, и без помощи он часто не может даже стоять. Кровь постоянно сочится из глаз, носа и ушей, а иногда скапливается под кожей в таком количестве, что начинает проступать наружу. В этих местах кожа отслаивается, а мышцы словно плавятся от переполняющей тело магической силы."
 trait_gh_magicsickness_4_character_desc: "Воздействие огромного количества [Concept('magic','магии')|E] имеет множество тяжёлых последствий для тела. При тяжёлой [Concept('exposure_sickness','магической немочи')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] быстро теряет способность действовать самостоятельно: большую часть дня [ROOT.GetCharacter.GetHerHim] рвёт, а при ухудшении — кровью, и без помощи [ROOT.GetCharacter.GetSheHe] часто не может даже стоять. Кровь постоянно сочится из [ROOT.GetCharacter.GetHerHis] глаз, носа и ушей, а иногда скапливается под кожей в таком количестве, что начинает проступать наружу. В этих местах кожа отслаивается, а мышцы словно плавятся от переполняющей тело магической силы."
 
 trait_gh_magicsickness_5: "Критическая [Concept('exposure_sickness','магическая немочь')|E]"
 trait_gh_magicsickness_5_desc: "Воздействие огромного количества [Concept('magic','магии')|E] имеет множество тяжёлых последствий для тела. На критической стадии [Concept('exposure_sickness','магической немочи')|E] этот персонаж почти не способен даже говорить. Кровь свободно течёт из всех отверстий и пор, а кожа, плоть и волосы отпадают клочьями. Конечности словно оседают внутрь: мышцы, сухожилия и кости плавятся и больше не выдерживают собственного веса, а отказывающие органы и с трудом работающие артерии давят на истончённую кожу, заметно пульсируя и разрываясь. Выжить на этой стадии [Concept('exposure_sickness','магической немочи')|E]... маловероятно."
 trait_gh_magicsickness_5_character_desc: "Воздействие огромного количества [Concept('magic','магии')|E] имеет множество тяжёлых последствий для тела. На критической стадии [Concept('exposure_sickness','магической немочи')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] почти не [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] даже говорить. Кровь свободно течёт из всех отверстий и пор, а кожа, плоть и волосы отпадают клочьями. Конечности словно оседают внутрь: мышцы, сухожилия и кости плавятся и больше не выдерживают собственного веса, а отказывающие органы и с трудом работающие артерии давят на истончённую кожу, заметно пульсируя и разрываясь. Выжить на этой стадии [Concept('exposure_sickness','магической немочи')|E]... маловероятно."

 trait_gh_glowing_eyes: "Светящиеся глаза"
 trait_gh_glowing_eyes_desc: "Хотя глаза [Concept('magi','магов')|E] часто светятся во время совершения ритуалов [Concept('magic','магии')|E], некоторые [Concept('magi','маги')|E] обретают этот эффект навсегда из-за постоянного использования своего дара. Это довольно жуткая, пусть и безобидная особенность, которую многие [Concept('magi','маги')|E] считают символом могущества."
 trait_gh_glowing_eyes_character_desc: "Хотя глаза [Concept('magi','магов')|E] часто светятся во время совершения ритуалов [Concept('magic','магии')|E], [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'обрела', 'обрёл' )] этот эффект навсегда из-за постоянного использования своего дара. Это довольно жуткая, пусть и безобидная особенность, которую многие [Concept('magi','маги')|E] считают символом [ROOT.GetCharacter.GetHerHis] могущества."

 trait_gh_excessively_pale: "Нездоровая бледность"
 trait_gh_excessively_pale_desc: "Из-за злоупотребления ритуалами [Concept('magic','магии')|E] этот персонаж обрёл болезненно-бледный цвет лица: его кожа настолько истончена и обескровлена, что при близком рассмотрении под ней можно увидеть пульсацию вен и сухожилий."
 trait_gh_excessively_pale_character_desc: "Из-за злоупотребления ритуалами [Concept('magic','магии')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'обрела', 'обрёл' )] болезненно-бледный цвет лица: [ROOT.GetCharacter.GetHerHis] кожа настолько истончена и обескровлена, что при близком рассмотрении под ней можно увидеть пульсацию вен и сухожилий."

 trait_gh_glowing_veins: "Светящиеся вены"
 trait_gh_glowing_veins_desc: "Хотя цвет зависит от применяемого [Concept('magic_type','типа магии')|E], светящиеся вены — верный признак того, что [Concept('magi','маг')|E] обращался к своему дару настолько часто, что тот наложил неизгладимый отпечаток на его тело. Несмотря на жуткий вид, это весьма распространённое и относительно безобидное явление."
 trait_gh_glowing_veins_character_desc: "Хотя цвет зависит от применяемого [Concept('magic_type','типа магии')|E], светящиеся вены [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] — распространённая особенность [Concept('magi','магов')|E] и верный признак того, что [ROOT.GetCharacter.GetSheHe] слишком часто [Select_CString(ROOT.GetCharacter.IsFemale, 'обращалась', 'обращался' )] к своему дару и тот наложил неизгладимый отпечаток на [ROOT.GetCharacter.GetHerHis] тело. Несмотря на жуткий вид, это относительно безобидное явление."

 trait_gh_power_bleeder: "Алая волна"
 trait_gh_power_bleeder_desc: "Хотя обильное кровотечение является известным симптомом [Concept('exposure_sickness','магической немочи')|E], некоторые [Concept('living_magi','живые маги')|E] страдают от её разновидности, которая сохраняется, даже когда [Concept('magi','маг')|E] больше не подвергается воздействию [Concept('magic','магии')|E]. Учёные прозвали этот недуг «Алой волной»; он вызывает кровотечение из всех отверстий тела. Алая волна не столь тяжела, как кровотечения при магической немочи, но всё равно опасна для живых магов: без срочной помощи даже самая мелкая рана может привести к полной потере крови."
 trait_gh_power_bleeder_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] страдает от Алой волны — недуга [Concept('living_magi','живых магов')|E], вызывающего кровотечение из всех отверстий тела. Алая волна не столь тяжела, как кровотечения при [Concept('exposure_sickness','магической немочи')|E], но всё равно опасна: без срочной помощи даже самая мелкая рана может привести к полной потере крови."

 trait_gh_necronic_skin: "Пепел Эльтиадда"
 trait_gh_necronic_skin_desc: "Названный в честь лорда-мага Эльтиадда, который медленно превратился в прах из-за злоупотребления [Concept('dead_magic','мёртвой магией')|E], «Пепел Эльтиадда» (или некротическая кожа) — это недуг, поражающий многих [Concept('dead_magi','магов земли')|E], хотя и редко приводящий к полной недееспособности. Кожа рук, рта и других проводников силы постепенно чернеет и отвердевает, превращаясь в каменистую массу, которая затем отслаивается вместе с пеплом. Большинство поражённых [Concept('magi','магов')|E] регулярно увлажняют кожу и на время отказываются от своего дара, чтобы сдержать симптомы. Однако постоянное применение мощной [Concept('dead_magic','мёртвой магии')|E] распространяет недуг по всему телу и в итоге приводит [Concept('magi','мага')|E] к смерти."
 trait_gh_necronic_skin_character_desc: "Названный в честь лорда-мага Эльтиадда, который медленно превратился в прах из-за злоупотребления [Concept('dead_magic','мёртвой магией')|E], «Пепел Эльтиадда» (или некротическая кожа) — это недуг, поражающий многих [Concept('dead_magi','магов земли')|E], хотя и редко приводящий к полной недееспособности. Кожа рук, рта и других проводников силы постепенно чернеет и отвердевает, превращаясь в каменистую массу, которая затем отслаивается вместе с пеплом. Большинство поражённых [Concept('magi','магов')|E] регулярно увлажняют кожу и на время отказываются от своего дара, чтобы сдержать симптомы. Однако постоянное применение мощной [Concept('dead_magic','мёртвой магии')|E] распространяет недуг по всему телу и в итоге приводит [Concept('magi','мага')|E] к смерти."

 trait_gh_beset_by_visions: "Мучительные видения"
 trait_gh_beset_by_visions_desc: "Этот персонаж постоянно страдает от длительных видений, в которых наблюдает всё — от жизни собственных придворных до гибели военачальников на другом краю света за тысячи лет до его рождения. Груз стольких чужих судеб даёт о себе знать: бесконечные мигрени часто приковывают его к постели, а отголоски непрожитых жизней вызывают внезапные перемены личности."
 trait_gh_beset_by_visions_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] постоянно страдает от длительных видений, в которых наблюдает всё — от жизни собственных придворных до гибели военачальников на другом краю света за тысячи лет до [ROOT.GetCharacter.GetHerHis] рождения. Груз стольких чужих судеб даёт о себе знать: бесконечные мигрени часто приковывают [ROOT.GetCharacter.GetHerHim] к постели, а отголоски непрожитых жизней вызывают внезапные перемены личности."

 trait_gh_aervalrian_curse: "Проклятие Эрвала"
 trait_gh_aervalrian_curse_desc: "Этот персонаж поражён проклятием [Concept('aervalr','Эрвала')|E] — недугом, который, как говорят, настигает [Concept('dead_magi','магов земли')|E], слишком глубоко погрузившихся в своё искусство. Видения расколотой луны вызывают непреодолимое влечение к её болезненно-зелёному лику и заставляют персонажа бродить по ночам, чтобы быть к ней ближе. Проклятие уже разрушает его личную жизнь и мешает править."
 trait_gh_aervalrian_curse_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'поражена', 'поражён' )] проклятием [Concept('aervalr','Эрвала')|E] — недугом, который, как говорят, настигает [Concept('dead_magi','магов земли')|E], слишком глубоко погрузившихся в своё искусство. Видения расколотой луны вызывают у [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] непреодолимое влечение к её болезненно-зелёному лику и заставляют [ROOT.GetCharacter.GetHerHim] бродить по ночам, чтобы быть к ней ближе. Проклятие уже разрушает [ROOT.GetCharacter.GetHerHis] личную жизнь и мешает править."

 trait_gh_ritual_tattoos: "Ритуальные татуировки"
 trait_gh_ritual_tattoos_desc: "Этот персонаж покрыт ритуальными татуировками, которые притягивают и сосредотачивают магическую силу, но при их нанесении явно мало думали о внешнем виде. Даже узоры, созданные ради красоты, отпугивают скрытым смыслом и тупой болью в глубине глаз, возникающей при долгом взгляде."
 trait_gh_ritual_tattoos_list_desc: "$trait_gh_ritual_tattoos_character_desc$ [ROOT.GetCharacter.GetSheHe|U] имеет следующие татуировки:\n\n[GetScriptedGui('character_ritual_tattoo_list_scripted_gui').BuildTooltip(GuiScope.SetRoot(ROOT.GetCharacter.MakeScope).End)]"
 trait_gh_ritual_tattoos_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'покрыта', 'покрыт' )] ритуальными татуировками, которые притягивают и сосредотачивают магическую силу, но при их нанесении явно мало думали о внешнем виде. Даже узоры, созданные ради красоты, отпугивают скрытым смыслом и тупой болью в глубине глаз, возникающей при долгом взгляде."
 trait_track_gh_ritual_tattoos: "$trait_gh_ritual_tattoos$"
 trait_track_gh_ritual_tattoos_desc: "$trait_gh_ritual_tattoos_desc$"
 RITUAL_TATTOO_NAME: "$spell_primary_aspect_coloring$ [THIS.Story.Custom('SpellName')]#!"

 trait_gh_ritual_scars_1: "Ритуальные шрамы"
 trait_gh_ritual_scars_1_desc: "Ритуальное шрамирование — обычная практика среди [Concept('magi','магов')|E], применяемая как для пускания крови в магических целях, так и в рамках различных таинств. Несмотря на пугающий вид, среди [Concept('magi','магов')|E] хотя бы один заметный шрам считается знаком престижа."
 trait_gh_ritual_scars_1_character_desc: "Ритуальное шрамирование — обычная практика среди [Concept('magi','магов')|E], применяемая как для пускания крови в магических целях, так и в рамках различных таинств. Несмотря на пугающий вид, среди [Concept('magi','магов')|E] хотя бы один заметный шрам считается знаком престижа."

 trait_gh_ritual_scars_2: "Множественные ритуальные шрамы"
 trait_gh_ritual_scars_2_desc: "Ритуальное шрамирование — обычная практика среди [Concept('magi','магов')|E], применяемая как для пускания крови в магических целях, так и в рамках различных таинств. [Concept('magi','Маги')|E], мало заботящиеся о своей внешности, со временем покрываются шрамами настолько, что те скрывают большинство черт лица."
 trait_gh_ritual_scars_2_character_desc: "Ритуальное шрамирование — обычная практика среди [Concept('magi','магов')|E], применяемая как для пускания крови в магических целях, так и в рамках различных таинств. Такие [Concept('magi','маги')|E], как [ROOT.GetCharacter.GetFirstNameNoTooltip], мало заботятся о своей внешности и со временем покрываются шрамами настолько, что те скрывают большинство черт лица."

 trait_gh_ritual_scars_3: "Изувечен ритуальными шрамами"
 trait_gh_ritual_scars_3_desc: "Ритуальное шрамирование — обычная практика среди [Concept('magi','магов')|E], применяемая как для пускания крови в магических целях, так и в рамках различных таинств. Некоторые [Concept('magi','маги')|E] полностью отказываются от мирской жизни вне своей [Concept('magic','магии')|E]: за десятки ритуалов они покрываются шрамами настолько, что на теле не остаётся нетронутого места. Это выглядит крайне жутко и отталкивающе, но служит признаком истинного могущества."
 trait_gh_ritual_scars_3_character_desc: "Ритуальное шрамирование — обычная практика среди [Concept('magi','магов')|E], применяемая как для пускания крови в магических целях, так и в рамках различных таинств. [ROOT.GetCharacter.GetFirstNameNoTooltip], похоже, [Select_CString(ROOT.GetCharacter.IsFemale, 'отказалась', 'отказался' )] от мирской жизни вне своей [Concept('magic','магии')|E]: за десятки ритуалов [ROOT.GetCharacter.GetSheHe] [Select_CString(ROOT.GetCharacter.IsFemale, 'покрылась', 'покрылся' )] шрамами настолько, что на теле не осталось нетронутого места. Это выглядит крайне жутко, но служит признаком истинного могущества."

 trait_gh_racked_by_voices: "Вещатель Пустоты"
 trait_gh_racked_by_voices_desc: "Вещатели Пустоты — это [Concept('magi','маги')|E], а изредка и лишённые [Concept('magic','магического дара')|E] люди, которые после чрезмерного воздействия [Concept('magic','магии')|E] обрели связь с иным миром за пределами человеческого понимания. Этот персонаж постоянно слышит шёпот, голоса и яростные крики невидимых духов, некоторые из которых кажутся слишком знакомыми..."
 trait_gh_racked_by_voices_character_desc: "Вещатели Пустоты — это [Concept('magi','маги')|E], а изредка и лишённые [Concept('magic','магического дара')|E] люди, которые после чрезмерного воздействия [Concept('magic','магии')|E] обрели связь с иным миром за пределами человеческого понимания. [ROOT.GetCharacter.GetFirstNameNoTooltip] постоянно слышит шёпот, голоса и яростные крики невидимых духов, некоторые из которых кажутся слишком знакомыми..."

 trait_gh_exhausted: "Истощение"
 trait_gh_exhausted_desc: "Этот персонаж с трудом спит хотя бы несколько часов и постоянно страдает от изнеможения и мучительной усталости."
 trait_gh_exhausted_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] с трудом спит хотя бы несколько часов и постоянно страдает от изнеможения и мучительной усталости."

 trait_gh_stimulated: "Перевозбуждение"
 trait_gh_stimulated_desc: "Этот персонаж переполнен энергией и не может уснуть, пока не доведёт себя работой до полного изнеможения."
 trait_gh_stimulated_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] переполнен энергией и не может уснуть, пока не доведёт себя работой до полного изнеможения."

 trait_gh_deep_mutation: "Глубокая мутация"
 trait_gh_deep_mutation_desc: "Этот персонаж подвергся воздействию огромного количества [Concept('magic','магии')|E] — намеренно во время эксперимента или по несчастной случайности. Его чудовищно изменённое тело быстро разрушается, а вместе с ухудшением здоровья всё новые мутации возникают без всякой закономерности."
 trait_gh_deep_mutation_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'подверглась', 'подвергся' )] воздействию огромного количества [Concept('magic','магии')|E] — намеренно во время эксперимента или по несчастной случайности. [ROOT.GetCharacter.GetHerHis|U] чудовищно изменённое тело быстро разрушается, а вместе с ухудшением здоровья всё новые мутации возникают без всякой закономерности."

 trait_gh_vampiric: "Вампирическое существо"
 trait_gh_vampiric_desc: "Тело этого персонажа давно уже не способно поддерживать человеческую жизнь и существует почти исключительно за счёт тёмной [Concept('magic','магии')|E]. Без магии он умер бы почти мгновенно, и большинство [Concept('magi','магов')|E] скорее предпочли бы угаснуть разумом и телом, чем позволить себе дойти до подобного. Хотя во многих обществах считается допустимым продлевать жизнь с помощью [Concept('magic','магии')|E], доходить до такого состояния — нет, особенно учитывая всё более страшную цену ритуалов, проводимых десятилетиями."
 trait_gh_vampiric_character_desc: "Тело [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] давно уже не способно поддерживать [ROOT.GetCharacter.GetHerHis] жизнь и существует почти исключительно за счёт тёмной [Concept('magic','магии')|E]. Без магии [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'умерла', 'умер' )] бы почти мгновенно, и большинство [Concept('magi','магов')|E] скорее предпочли бы угаснуть разумом и телом, чем позволить себе дойти до подобного. Хотя во многих обществах считается допустимым продлевать жизнь с помощью [Concept('magic','магии')|E], доходить до такого состояния — нет, особенно учитывая всё более страшную цену ритуалов, проводимых десятилетиями."

 trait_gh_dehanded: "Безрукий"
 trait_gh_dehanded_desc: "Руки этого персонажа были отсечены — его доступ к [Concept('magic','магии')|E] навсегда закрыт."
 trait_gh_dehanded_character_desc: "Руки [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] были отсечены в качестве наказания, и теперь [ROOT.GetCharacter.GetSheHe] [Select_CString(ROOT.GetCharacter.IsFemale, 'навсегда лишена', 'навсегда лишён' )] возможности вновь использовать [Concept('magic','магию')|E]."

 trait_gh_shortsighted: "Близорукость"
 trait_gh_shortsighted_desc: "Зрение этого персонажа уже не то, что прежде. Хотя он всё ещё способен выполнять большинство повседневных дел, его неловкость при этом весьма заметна."
 trait_gh_shortsighted_character_desc: "Зрение [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] уже не то, что прежде. Хотя [ROOT.GetCharacter.GetSheHe] всё ещё [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] выполнять большинство повседневных дел, [ROOT.GetCharacter.GetHerHis] неловкость при этом весьма заметна."

 trait_gh_nearly_blind: "Почти слепой"
 trait_gh_nearly_blind_desc: "Хотя этот персонаж всё ещё способен отличить свет от тьмы, его глаза едва ли способны на что-то большее."
 trait_gh_nearly_blind_character_desc: "Хотя [ROOT.GetCharacter.GetFirstNameNoTooltip] всё ещё [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] отличить свет от тьмы, [ROOT.GetCharacter.GetHerHis] глаза едва ли способны на что-то большее."

 trait_gh_riftsight_1: "Слабое видение Разлома"
 trait_gh_riftsight_1_desc: "Приложив некоторое усилие, этот персонаж может заглянуть в Разлом, но его способности ограничены."
 trait_gh_riftsight_1_character_desc: "Приложив некоторое усилие, [ROOT.GetCharacter.GetFirstNameNoTooltip] может заглянуть в Разлом, но [ROOT.GetCharacter.GetHerHis] способности ограничены."

 trait_gh_riftsight_2: "Видение Разлома"
 trait_gh_riftsight_2_desc: "Этот персонаж способен постоянно видеть Разлом, благодаря чему его прежде дремлющий навык теперь весьма полезен — особенно по мере угасания обычного зрения."
 trait_gh_riftsight_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] постоянно видеть Разлом, благодаря чему [ROOT.GetCharacter.GetHerHis] прежде дремлющий навык теперь весьма полезен — особенно по мере угасания обычного зрения."

 trait_gh_riftsight_3: "Сильное видение Разлома"
 trait_gh_riftsight_3_desc: "Обычное зрение этого персонажа полностью заменилось жуткой способностью видеть Разлом, которой он уже уверенно пользуется."
 trait_gh_riftsight_3_character_desc: "Обычное зрение [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] полностью заменилось жуткой способностью видеть Разлом, и [ROOT.GetCharacter.GetSheHe] уже уверенно ею пользуется."

 trait_gh_riftsight_4: "Исключительное видение Разлома"
 trait_gh_riftsight_4_desc: "Этот персонаж видит Разлом так же отчётливо, как сокол видит обычный мир. Встретившись с ним взглядом, можно почувствовать, будто он смотрит прямо в душу."
 trait_gh_riftsight_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] видит Разлом так же отчётливо, как сокол видит обычный мир. Встретившись с [ROOT.GetCharacter.GetHerHim] взглядом, можно почувствовать, будто [ROOT.GetCharacter.GetSheHe] смотрит прямо в душу."

 trait_gh_veteran_of_elysia_sjalvolki: "Ветеран Элизии"
 trait_gh_veteran_of_elysia_sjalvolki_desc: "Этот персонаж участвовал в легендарной битве у Элизийского перевала в 1252 году на стороне сьялволков, заслужив признание соратников и место среди самых прославленных воинов Имперреха."
 trait_gh_veteran_of_elysia_sjalvolki_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'участвовала', 'участвовал' )] в легендарной битве у Элизийского перевала в 1252 году на стороне сьялволков, заслужив признание соратников и место среди самых прославленных воинов Имперреха."

 trait_gh_veteran_of_elysia_aversarian: "Ветеран Элизии"
 trait_gh_veteran_of_elysia_aversarian_desc: "Этот персонаж участвовал в легендарной битве у Элизийского перевала в 1252 году на стороне [Concept('aversaria','аверсарианцев')|E], заслужив репутацию стойкого защитника империи и душевные раны на всю жизнь."
 trait_gh_veteran_of_elysia_aversarian_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'участвовала', 'участвовал' )] в легендарной битве у Элизийского перевала в 1252 году на стороне аверсарианцев, вынеся из этой ужасной катастрофы лишь душевные раны."

 trait_gh_veteran_of_elysia_marcher: "Ветеран Элизии"
 trait_gh_veteran_of_elysia_marcher_desc: "Этот персонаж участвовал в легендарной битве у Элизийского перевала в 1252 году на стороне [Concept('aversaria','аверсарианцев')|E] как независимый наёмник-марочник — редкое достижение, которым можно гордиться."
 trait_gh_veteran_of_elysia_marcher_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'участвовала', 'участвовал' )] в легендарной битве у Элизийского перевала в 1252 году на стороне [Concept('aversaria','аверсарианцев')|E] как независимый наёмник-марочник. Марочники заслужили признание самого Сокрушителя ведьм, хотя лишь немногие воины Шевалье выжили, чтобы насладиться этой недолгой славой."

 trait_gh_veteran_of_elysia_narses: "Ветеран Элизии"
 trait_gh_veteran_of_elysia_narses_desc: "Этот персонаж участвовал в легендарной битве у Элизийского перевала в 1252 году на стороне [Concept('aversaria','аверсарианцев')|E] и заслужил репутацию стойкого защитника империи. После стремительного перелома в судьбе Имперреха эта борьба стала восприниматься как необходимая жертва ради выживания Аверсарии."
 trait_gh_veteran_of_elysia_narses_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'участвовала', 'участвовал' )] в легендарной битве у Элизийского перевала в 1252 году на стороне [Concept('aversaria','аверсарианцев')|E] и [Select_CString(ROOT.GetCharacter.IsFemale, 'заслужила', 'заслужил' )] репутацию стойкого защитника империи. После стремительного перелома в судьбе Имперреха [ROOT.GetCharacter.GetHerHis] борьба стала восприниматься как необходимая жертва ради выживания Аверсарии."

 trait_gh_widow: "Вдовство"
 trait_gh_widow_desc: "Этот персонаж всё ещё оплакивает смерть своего супруга и пока не готов вступить в новый брак."

 trait_gh_wasteland: "Пустошь"
 trait_gh_wasteland_desc: "Эта местность практически полностью необитаема, и приписывать кому-либо политический контроль над ней не имеет никакого смысла."

 trait_gh_extended_life: "Продление жизни"
 trait_gh_extended_life_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'продлила', 'продлил' )] себе жизнь с помощью паразитической магии, поглощая жизненную энергию других и поддерживая собственное неестественное существование. Сейчас в [ROOT.GetCharacter.GetHerHis] вампирическом запасе находится [ROOT.Var('vampiric_drain_health_pool').GetValue|0] ед. здоровья.\n\n#P Пока в [ROOT.GetCharacter.GetHerHis] вампирическом запасе остаются очки, при наступлении естественной смерти [ROOT.GetCharacter.GetSheHe] выживет. Из запаса будет потрачено столько очков, сколько необходимо для восстановления здоровья до уровня «Хорошее»; они преобразуются в обычное здоровье и уровни эффекта [GetModifier('vampirism_mod').GetNameWithTooltip|L].#!\n\n#N Внимание: если [ROOT.GetCharacter.GetHerHis] здоровье опустится ниже 5, а вампирический запас будет пуст, [ROOT.GetCharacter.GetSheHe] больше не сможет поддерживать своё вампирическое существование.#!"

 trait_magikill: "Убийца магов"

 trait_magikill_1: "Крещёный кровью убийца магов"
 trait_magikill_1_desc: "Этот персонаж сразил как минимум одного из ненавистных [Concept('magi','магов')|E]. Первый из многих — если он, конечно, выживет в своих самоубийственных начинаниях."
 trait_magikill_1_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сразила', 'сразил' )] как минимум одного из ненавистных [Concept('magi','магов')|E]. Первый из многих — если [ROOT.GetCharacter.GetSheHe], конечно, выживет в своих самоубийственных начинаниях."
 trait_magikill_2: "Опытный убийца магов"
 trait_magikill_2_desc: "Этот персонаж сразил нескольких ненавистных [Concept('magi','магов')|E]. Впечатляющий подвиг, учитывая опасности, сопряжённые с такой охотой."
 trait_magikill_2_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сразила', 'сразил' )] нескольких ненавистных [Concept('magi','магов')|E]. Впечатляющий подвиг, учитывая опасности, сопряжённые с такой охотой."
 trait_magikill_3: "Очень опытный убийца магов"
 trait_magikill_3_desc: "Этот персонаж сразил множество [Concept('magi','магов')|E]. Его имя вселяет ужас в магические кабалы по всей стране."
 trait_magikill_3_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сразила', 'сразил' )] множество [Concept('magi','магов')|E]. [ROOT.GetCharacter.GetHerHis|U] имя вселяет ужас в магические кабалы по всей стране."
 trait_magikill_4: "Ветеран охоты на магов"
 trait_magikill_4_desc: "Этот персонаж сразил многих [Concept('magi','магов')|E]. Его имя вселяет ужас в магические кабалы по всему краю."
 trait_magikill_4_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сразила', 'сразил' )] многих [Concept('magi','магов')|E]. [ROOT.GetCharacter.GetHerHis|U] имя вселяет ужас в магические кабалы по всему краю."
 trait_magikill_5: "Элитный убийца магов"
 trait_magikill_5_desc: "Этот персонаж сразил бесчисленное количество чудовищных [Concept('magi','магов')|E]. Его имя внушает страх даже сильнейшим из магов."
 trait_magikill_5_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сразила', 'сразил' )] бесчисленное количество чудовищных [Concept('magi','магов')|E]. [ROOT.GetCharacter.GetHerHis|U] имя внушает страх даже сильнейшим из магов."
 trait_magikill_6: "Непревзойдённый убийца магов"
 trait_magikill_6_desc: "Этот персонаж сразил бесчисленное количество чудовищных [Concept('magi','магов')|E]. Его имя внушает страх даже сильнейшим из магов."
 trait_magikill_6_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сразила', 'сразил' )] бесчисленное количество чудовищных [Concept('magi','магов')|E]. [ROOT.GetCharacter.GetHerHis|U] имя внушает страх даже сильнейшим из магов."
 trait_magikill_7: "Погибель магии"
 trait_magikill_7_desc: "Бесчисленные [Concept('magi','маги')|E] погибли от руки этого персонажа. От [Concept('mayikrata','Майикратии')|E] до дворцов амсари маги шёпотом передают страшные истории о его подвигах. Они знают: никто из них не в безопасности."
 trait_magikill_7_char_desc: "Бесчисленные [Concept('magi','маги')|E] погибли от руки [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]. От [Concept('mayikrata','Майикратии')|E] до дворцов амсари маги шёпотом передают страшные истории о [ROOT.GetCharacter.GetHerHis] подвигах. Они знают: никто из них не в безопасности."

 trait_gh_riftmark_1: "Тронутый Разломом"
 trait_gh_riftmark_1_desc: "Вокруг этого персонажа витает зловещая аура. Всё будто идёт наперекосяк: чернильницы опрокидываются на драгоценные книги, двери заклинивает в самый неподходящий момент, а сам он изредка странно покашливает. Иногда в удачно упавших солнечных лучах вокруг него заметна лёгкая дымка."
 trait_gh_riftmark_1_char_desc: "Вокруг [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] витает зловещая аура. Всё будто идёт наперекосяк: чернильницы опрокидываются на драгоценные книги, двери заклинивает в самый неподходящий момент, а [ROOT.GetCharacter.GetSheHe] изредка странно покашливает. Иногда в удачно упавших солнечных лучах вокруг [ROOT.GetCharacter.GetHerHim] заметна лёгкая дымка."
 TRAIT_FLAG_DESC_gh_riftmark_1_spell_vulnerability: "Уязвимость к [Concept('magic','магии')|E] немного повышена."
 trait_gh_riftmark_2: "Отмеченный Разломом"
 trait_gh_riftmark_2_desc: "Невезение этого персонажа лишь усилилось. Иногда в игре света ему на мгновение мерещатся силуэты близких, манящие его перелезть через перила балкона или свернуть в безлюдный коридор. Вокруг него всё чаще замечают дурные знамения, принятые в его культуре, — верный знак обречённости."
 trait_gh_riftmark_2_char_desc: "Невезение [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] лишь усилилось. Иногда в игре света [ROOT.GetCharacter.GetHerHim] на мгновение мерещатся силуэты близких, манящие [ROOT.GetCharacter.GetHerHim] перелезть через перила балкона или свернуть в безлюдный коридор. Вокруг [ROOT.GetCharacter.GetHerHim] всё чаще замечают дурные знамения, принятые в [ROOT.GetCharacter.GetHerHis] культуре, — верный знак обречённости."
 TRAIT_FLAG_DESC_gh_riftmark_2_spell_vulnerability: "Уязвимость к [Concept('magic','магии')|E] повышена."
 trait_gh_riftmark_3: "Проклятый Разломом"
 trait_gh_riftmark_3_desc: "Этот персонаж совершенно беззащитен перед воздействием смешанной магии. Он часто просыпается в одиночестве в отдалённых уголках своего поместья, куда забрёл во сне. В другое время он неправильно слышит указания, сбивается с пути и остаётся один. Порой, оглянувшись через плечо, он замечает преследователя — всегда одного и того же и с каждым разом всё ближе..."
 trait_gh_riftmark_3_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] совершенно [Select_CString(ROOT.GetCharacter.IsFemale, 'беззащитна', 'беззащитен' )] перед воздействием смешанной магии. [ROOT.GetCharacter.GetSheHe|U] часто просыпается в одиночестве в отдалённых уголках своего поместья, куда [Select_CString(ROOT.GetCharacter.IsFemale, 'забрела', 'забрёл' )] во сне. В другое время [ROOT.GetCharacter.GetSheHe] неправильно слышит указания, сбивается с пути и остаётся [Select_CString(ROOT.GetCharacter.IsFemale, 'одна', 'один' )]. Порой, оглянувшись через плечо, [ROOT.GetCharacter.GetSheHe] замечает преследователя — всегда одного и того же и с каждым разом всё ближе..."
 TRAIT_FLAG_DESC_gh_riftmark_3_spell_vulnerability: "Уязвимость к [Concept('mixed_magic','магии Тумана')|E] значительно повышена."


