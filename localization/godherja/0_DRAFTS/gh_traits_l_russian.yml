 trait_magic_good_8: "Чистокровный [Concept('magi','маг')|E] I"
 trait_magic_good_8_desc: "Сила из легенд. [Concept('magi','маг')|E] подобного размаха появляются, быть может, раз или два за всю историю целых цивилизаций. Сама история балансирует на лезвии их клинка."
