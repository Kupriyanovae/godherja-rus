 trait_track_magical_time: "Сродство со временем"
 trait_track_magical_time_desc: "Овладейте силой прошлого, настоящего и будущего."

 trait_thura_myinthein: "Тура Мьинтейн, помазанник"
 trait_thura_myinthein_desc: "В этом персонаже исполнилось древнее пророчество о могучем воине, которому суждено изгнать тьму и объединить разрозненные наттананские царства. Следуя воле богов-близнецов, Тура Мьинтейн изгнал нечестивых корлаканских еретиков, очистил землю от скверны и зла и основал великую Наттананскую империю Тура Тав — вечное напоминание о благоволении богов-близнецов."

 trait_thura_myinthein_descendant: "Потомок Туры Мьинтейна"
 trait_thura_myinthein_descendant_desc: "Этот персонаж — прямой потомок Туры Мьинтейна."
 trait_thura_myinthein_descendant_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — прямой потомок Туры Мьинтейна."

 trait_gh_minister: "Министр"
 trait_gh_minister_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — выдающийся управленец и судья, что делает [ROOT.GetCharacter.GetHerHim] идеальной кандидатурой на роль министра."
 trait_gh_minister_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] имеет богатый опыт управления землями и отлично справляется с обязанностями министра."
 trait_gh_minister_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'приобрела', 'приобрёл' )] ценные навыки, исполняя обязанности министра."

