 #invasion stuff
 
 trait_fogeater_invasion_leader: "Гарфордаэр"
 trait_fogeater_invasion_leader_desc: "Гарфордаэр — самопровозглашённый «Глашатай войны» объединённых кланов [Concept('fogeaters','пожирателей тумана')|E]. Он утверждает, что постиг истинный смысл слов Туманной матери, и, проявив удивительные для [Concept('fogeaters','пожирателя тумана')|E] хитрость и здравомыслие, разгромил противников и объединил племена Слушателей. Теперь он ведёт их в поход на известный мир ради неведомой цели.\n\nОн устрашает не только ростом и обликом: немногие из тех, кто видел его и выжил, могут отрицать, что с ним что-то неладно. Рядом с ним слышится приглушённый шёпот, а при взгляде на его искажённое лицо зрение начинает подводить..."
 trait_fogeater_invasion_leader_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — самопровозглашённый «Глашатай войны» объединённых кланов [Concept('fogeaters','пожирателей тумана')|E]. [ROOT.GetCharacter.GetSheHe|U] утверждает, что [Select_CString(ROOT.GetCharacter.IsFemale, 'постигла', 'постиг' )] истинный смысл слов Туманной матери, и, проявив удивительные для [Concept('fogeaters','пожирателя тумана')|E] хитрость и здравомыслие, [Select_CString(ROOT.GetCharacter.IsFemale, 'разгромила', 'разгромил' )] противников и [Select_CString(ROOT.GetCharacter.IsFemale, 'объединила', 'объединил' )] племена Слушателей. Теперь [ROOT.GetCharacter.GetSheHe] ведёт их в поход на известный мир ради неведомой цели.\n\n[ROOT.GetCharacter.GetSheHe|U] устрашает не только ростом и обликом: немногие из тех, кто видел [ROOT.GetCharacter.GetHerHim] и выжил, могут отрицать, что с [ROOT.GetCharacter.GetHerHim] что-то неладно. Рядом с [ROOT.GetCharacter.GetHerHim] слышится приглушённый шёпот, а при взгляде на [ROOT.GetCharacter.GetHerHis] искажённое лицо зрение начинает подводить..."
