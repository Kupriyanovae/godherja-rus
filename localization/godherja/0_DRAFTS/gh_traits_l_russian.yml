 trait_gh_kemsari_warlord: "Провозглашенный таэссор"
 trait_kemsari_warlord_desc: "Этот персонаж — великий кемсарийский военачальник, объявивший о своем намерении вторгнуться и завоевать сам амсарийский Хиклахн."
 trait_kemsari_warlord_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — великий кемсарийский военачальник, объявивший о своем намерении вторгнуться и завоевать сам амсарийский Хиклахн."

 trait_gh_elephant_racer: "Гонщик на слонах"
 trait_track_gh_elephant_racer: "Гонщик на слонах"
 trait_gh_elephant_racer_desc: "Этот персонаж известен своим участием в каширьянском спорте — гонках на слонах — и освоил как праздничные традиции, так и тонкости самих состязаний."
 trait_gh_elephant_racer_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'известна', 'известен' )] своим участием в каширьянском спорте — гонках на слонах — и [Select_CString(ROOT.GetCharacter.IsFemale, 'освоила', 'освоил' )] как праздничные традиции, так и тонкости самих состязаний."
 trait_gh_elephant_racer_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — бывалый гонщик на слонах, отточивший свое мастерство на множестве соревнований и сделавший себе имя на гоночных аренах Востока."
 trait_gh_elephant_racer_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — истинный мастер седла и арены, прославленный гонщик на слонах, чьи навыки и хитрость принесли [ROOT.GetCharacter.GetHerHim] славу на самых грандиозных гонках каширьянского мира."

 trait_gh_landed_order_trait: "Правитель владетельного ордена"
 trait_gh_landed_order_trait_desc: "Выбор этого свойства в редакторе правителя гарантирует, что на старте игры вы возглавите владетельный орден. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 trait_gh_landed_order_trait_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'выбрала', 'выбрал' )] это свойство в редакторе правителя, чтобы возглавить владетельный орден на старте игры. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 
 trait_gh_republic_trait: "Правитель республики"
 trait_gh_republic_trait_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'выбрала', 'выбрал' )] это свойство в редакторе правителя, чтобы возглавить республику на старте игры. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 trait_gh_republic_trait_desc: "Выбор этого свойства в редакторе правителя гарантирует, что на старте игры вы возглавите республику. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 
 trait_gh_military_unit_trait: "Командующий воинским формированием"
 trait_gh_military_unit_trait_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'выбрала', 'выбрал' )] это свойство в редакторе правителя, чтобы возглавить воинское формирование на старте игры. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 trait_gh_military_unit_trait_desc: "Выбор этого свойства в редакторе правителя гарантирует, что на старте игры вы возглавите воинское формирование. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 
 trait_gh_theocracy_trait: "Теократический правитель"
 trait_gh_theocracy_trait_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'выбрала', 'выбрал' )] это свойство в редакторе правителя, чтобы возглавить теократию на старте игры. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 trait_gh_theocracy_trait_desc: "Выбор этого свойства в редакторе правителя гарантирует, что на старте игры вы возглавите теократию. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 
 trait_gh_magocracy_trait: "Правитель-магократ"
 trait_gh_magocracy_trait_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'выбрала', 'выбрал' )] это свойство в редакторе правителя, чтобы возглавить магократию на старте игры. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 trait_gh_magocracy_trait_desc: "Выбор этого свойства в редакторе правителя гарантирует, что на старте игры вы возглавите магократию. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 
 trait_gh_magocratic_republic_trait: "Правитель магократической республики"
 trait_gh_magocratic_republic_trait_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'выбрала', 'выбрал' )] это свойство в редакторе правителя, чтобы возглавить магократическую республику на старте игры. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 trait_gh_magocratic_republic_trait_desc: "Выбор этого свойства в редакторе правителя гарантирует, что на старте игры вы возглавите магократическую республику. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 
 trait_gh_pirate_trait: "Пиратский капитан"
 trait_gh_pirate_trait_character_desc: "ЙАРРР! [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'выбрала', 'выбрал' )] это свойство в редакторе правителя, чтобы возглавить пиратское государство на старте игры. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 trait_gh_pirate_trait_desc: "ЙАРРР! Выбор этого свойства в редакторе правителя гарантирует, что на старте игры вы возглавите пиратское государство. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."

 trait_gh_glassmith_1: "Стеклодув"
 trait_gh_glassmith_1_desc: "Этот персонаж освоил базовые техники стеклодувного дела и способен создавать красивые, пусть и не без изъянов, стеклянные безделушки и сосуды."
 trait_gh_glassmith_1_character: "Стеклодув-любитель"
 trait_gh_glassmith_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'освоила', 'освоил' )] базовые техники стеклодувного дела и [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] создавать красивые, пусть и не без изъянов, стеклянные безделушки и сосуды."
 trait_gh_glassmith_2_character: "Опытный стеклодув"
 trait_gh_glassmith_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — опытный мастер-стеклодув, и [ROOT.GetCharacter.GetHerHis] творения достойны украшать дворы королей и императоров по всему [Concept('aeras','Аэрасу')|E]."
 trait_gh_glassmith_3_character: "Мастер-стеклодув"
 trait_gh_glassmith_3_character_desc: "Для [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] стекло течет словно вода, а из-под [ROOT.GetCharacter.GetHerHis] рук выходят сокровища, достойные целых народов."
 trait_track_gh_lifestyle_glassmith: "Стеклодув"
 trait_track_gh_lifestyle_glassmith_desc: "Изготовление стекла — утонченное искусство, вершина мастерства в котором доступна лишь самым преданным своему делу ремесленникам."
 trait_gh_historical_glassmith: "Персонажи со свойством «$trait_track_gh_lifestyle_glassmith$»"

 trait_gh_steppe_queen_1: "Орзопайя"
 trait_gh_steppe_queen_1_desc: "Ожидается, что [Glossary('Órzopaja','GH_ORZOPAJA_GLOSS')] преуспеет в традиционных сарминских воинских искусствах: стрельбе из лука, соколиной охоте и конном бою."
 trait_gh_steppe_queen_1_character: "Начинающая орзопайя"
 trait_gh_steppe_queen_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] только [Select_CString(ROOT.GetCharacter.IsFemale, 'начала', 'начал' )] осваивать сарминские воинские традиции, и [ROOT.GetCharacter.GetHerHim] положено носить лишь самые короткие косы."
 trait_gh_steppe_queen_2_character: "Усердная орзопайя"
 trait_gh_steppe_queen_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'добилась', 'добился' )] определенных успехов в том, что значит быть [Glossary('Órzopaja','GH_ORZOPAJA_GLOSS')], и [Select_CString(ROOT.GetCharacter.IsFemale, 'заслужила', 'заслужил' )] право носить более длинную косу."
 trait_gh_steppe_queen_3_character: "Испытанная орзопайя"
 trait_gh_steppe_queen_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'заслужила', 'заслужил' )] признание и уважение соратников впечатляющими проявлениями воинского мастерства и имеет право заплетать лишь самые длинные косы."
 trait_gh_steppe_queen_4_character: "Прославленная орзопайя"
 trait_gh_steppe_queen_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'достигла', 'достиг' )] почти легендарной славы и считается [Select_CString(ROOT.GetCharacter.IsFemale, 'равной', 'равным' )] героям древности [ROOT.GetCharacter.GetCulture.GetNameNoTooltip], а длина [ROOT.GetCharacter.GetHerHis] косы впечатляет не меньше."
 trait_gh_steppe_queen_1_foreign_character: "Начинающая зерхени"
 trait_gh_steppe_queen_1_foreign_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Glossary('Zsêrhêni','GH_ZSERHENI_GLOSS')], пока не совершившая особых подвигов, и [ROOT.GetCharacter.GetHerHim] положено носить лишь самые короткие косы."
 trait_gh_steppe_queen_2_foreign_character: "Усердная зерхени"
 trait_gh_steppe_queen_2_foreign_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'добыла', 'добыл' )] себе некоторую славу и признание как [Glossary('Zsêrhêni','GH_ZSERHENI_GLOSS')] и имеет право носить более длинную косу."
 trait_gh_steppe_queen_3_foreign_character: "Испытанная зерхени"
 trait_gh_steppe_queen_3_foreign_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Select_CString(ROOT.GetCharacter.IsFemale, 'бывалая', 'бывалый' )] [Glossary('Zsêrhêni','GH_ZSERHENI_GLOSS')], за плечами [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] немало впечатляющих подвигов, и [ROOT.GetCharacter.GetSheHe] имеет право заплетать лишь самые длинные косы."
 trait_gh_steppe_queen_4_foreign_character: "Прославленная зерхени"
 trait_gh_steppe_queen_4_foreign_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'снискала', 'снискал' )] великую славу как [Glossary('Zsêrhêni','GH_ZSERHENI_GLOSS')], а длина [ROOT.GetCharacter.GetHerHis] косы не уступает косам героев древности."
 trait_track_lifestyle_gh_steppe_queen: "$trait_gh_steppe_queen_1$"
 trait_track_lifestyle_gh_steppe_queen_desc: "$trait_gh_steppe_queen_1_desc$\n\n$trait_track_lifestyle_gh_steppe_queen_hint$"
 trait_track_lifestyle_gh_steppe_queen_hint: "#weak Уровень этой [trait_level_track|E] повышается совершением поступков, приумножающих личную легенду: участием в [raids|E], [battles|E] и [Concept('single_combat_duel','поединках')|E], продвижением по [martial_lifestyle|E], участием в [GetActivityType('activity_hunt').GetName] или выбором определенных вариантов в событиях.#!"

 trait_gh_elementalist: "Элементалист"
 trait_gh_elementalist_desc: "Элементалист — это [magi|E], владеющий искусством призыва живых воплощений [Concept('gh_aspect', 'Аспектов')|E] себе на службу."
 trait_gh_elementalist_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] умеет призывать живые воплощения [Concept('gh_aspect', 'Аспектов')|E], заставляя их исполнять свою волю."
 trait_track_magical_light: "Единство с [aspect_light]"
 trait_track_magical_light_desc: "Элементали [aspect_light] олицетворяют порядок и подчинение."

 trait_lifestyle_one_with_nature: "Единство с природой"
 trait_lifestyle_one_with_nature_desc: "Этот персонаж обрел глубокую связь с диким миром [aeras|E]; он лучше подготовлен и чуток к его хаотичным капризам."
 trait_lifestyle_one_with_nature_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'обрела', 'обрел' )] глубокую связь с диким миром [aeras|E]; [ROOT.GetCharacter.GetSheHe] лучше [Select_CString(ROOT.GetCharacter.IsFemale, 'подготовлена', 'подготовлен' )] и [Select_CString(ROOT.GetCharacter.IsFemale, 'чутка', 'чуток' )] к его хаотичным капризам."

 trait_gh_heir_of_asojiva: "Наследник Асодживы"
 trait_gh_heir_of_asojiva_desc: "Этот персонаж провозглашен законным наследником престола Асодживы и крови Тарьядов. Применяя те же навыки, что помогли вернуть земли предков, он непременно приведет державу к золотому веку и будет зорко следить за определенными группами — например, учеными, — чтобы трагедия гибели Тарьяда никогда не повторилась."
 trait_gh_heir_of_asojiva_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'провозглашена', 'провозглашен' )] законным наследником престола Асодживы и крови Тарьядов. Применяя те же навыки, что помогли вернуть земли [ROOT.GetCharacter.GetHerHis] предков, [ROOT.GetCharacter.GetSheHe] непременно приведет державу к золотому веку и будет зорко следить за определенными группами — например, учеными, — чтобы трагедия гибели Тарьяда никогда не повторилась."

 trait_gh_temporarily_disinherited: "Временно лишенный наследства"
 trait_temporarily_disinherited_desc: "Этот персонаж из-за привратностей судьбы был лишен прав на наследование. Но его заверили, что это лишь временная мера."
 trait_temporarily_disinherited_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] из-за привратностей судьбы [Select_CString(ROOT.GetCharacter.IsFemale, 'была лишена', 'был лишен' )] прав на наследование. Но [ROOT.GetCharacter.GetHerHim] заверили, что это лишь временная мера."

 trait_necromancy_undead_thrall: "Некротический слуга"
 trait_necromancy_undead_thrall_desc: "Этот персонаж — некротический слуга, пешка в руках могущественного некроманта или [Concept('liches','лича')|E], поднятая из мертвых лишь для того, чтобы быть обреченной на вечную службу. Едва способное к самостоятельным мыслям, это создание годится лишь для черной работы, а его автономия ограничивается лишь умением сетовать на свою участь. Однако со временем душа внутри него может снова начать проявлять подобие личности."
 trait_necromancy_undead_thrall_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — некротический слуга, пешка в руках могущественного некроманта или [Concept('liches','лича')|E], [Select_CString(ROOT.GetCharacter.IsFemale, 'поднятая', 'поднятый' )] из мертвых лишь для того, чтобы быть [Select_CString(ROOT.GetCharacter.IsFemale, 'обреченной', 'обреченным' )] на вечную службу. Едва [Select_CString(ROOT.GetCharacter.IsFemale, 'способная', 'способный' )] к самостоятельным мыслям, [ROOT.GetCharacter.GetFirstNameNoTooltip] годится лишь для черной работы, а [ROOT.GetCharacter.GetHerHis] автономия ограничивается лишь умением сетовать на свою участь. Однако со временем душа внутри [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] может снова начать проявлять подобие личности."

 trait_necromancy_undead_awakened: "Пробужденный нежить"
 trait_necromancy_undead_awakened_desc: "Будь то результат преднамеренного ритуала могущественного некроманта или [Concept('liches','лича')|E], либо же случайность, из-за которой слуга обрел истинную разумность, этот персонаж — Пробужденный. Обладая личностью, волей и фундаментальным желанием продолжать существование, он больше не подвластен простейшей магии. Разумеется, сильный некромантический контроль всё еще сработает, равно как и обычные житейские уловки вроде «убеждения» или «торга»."
 trait_necromancy_undead_awakened_character_desc: "Будь то результат преднамеренного ритуала могущественного некроманта или [Concept('liches','лича')|E], либо же случайность, из-за которой слуга обрел истинную разумность, [ROOT.GetCharacter.GetFirstNameNoTooltip] — Пробужденный нежить. Обладая личностью, волей и фундаментальным желанием продолжать существование, [ROOT.GetCharacter.GetFirstNameNoTooltip] больше не подвластен простейшей магии. Разумеется, сильный некромантический контроль всё еще сработает, равно как и обычные житейские уловки вроде «убеждения» или «торга»."

 trait_necromancy_undead_lich: "Лич"
 trait_necromancy_undead_lich_desc: "Этот персонаж — могущественный некромант или [Concept('liches','лич')|E], властелин жизни и смерти, обладающий силой, которую большинство сочло бы противоестественной."
 trait_necromancy_undead_lich_character_desc: "Пройдя через серию темных и жутких ритуалов, известных как «Тринадцать шагов Бездны», [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'достигла', 'достиг' )] состояния [lichdom|E], избавившись от морали и смертной плоти взамен на кажущееся бессмертие."

 # Lich traits
 trait_gh_volatile: "Вспыльчивый"
 trait_gh_volatile_desc: "Этот [Concept('liches','лич')|E] склонен к крайним перепадам настроения и способен впасть в разрушительный гнев от малейшего повода или неудачи."
 trait_gh_volatile_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] склонен к крайним перепадам настроения и способен впасть в разрушительный гнев от малейшего повода или неудачи."

 trait_gh_emotionless: "Бездушный"
 trait_gh_emotionless_desc: "Последние искры человеческих эмоций давно покинули этого [Concept('liches','лича')|E], а его нерушимо-хладнокровное поведение подобно поведению автоматона."
 trait_gh_emotionless_character_desc: "Последние искры человеческих эмоций давно покинули [ROOT.GetCharacter.GetFirstNameNoTooltip], а [ROOT.GetCharacter.GetHerHis] нерушимо-хладнокровное поведение подобно поведению автоматона."

 trait_gh_divine: "Божественный"
 trait_gh_divine_desc: "Этот [Concept('liches','лич')|E] знает, что боги действительно существуют, и безусловно считает себя одним из них."
 trait_gh_divine_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E], который знает, что боги действительно существуют, и уверен, что сам является одним из них."

 trait_gh_megalomaniacal: "Мания величия"
 trait_gh_megalomaniacal_desc: "Даже по меркам [Concept('liches','личей')|E] этот персонаж тратит непомерно много сил на возведение монументов в свою честь, длинные злорадные тирады и принятие поклонения от смертных и неживых слуг."
 trait_gh_megalomaniacal_character_desc: "Даже по меркам [Concept('liches','личей')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] тратит непомерно много сил на возведение монументов в свою честь, длинные злорадные тирады и принятие поклонения от смертных и неживых слуг."

 trait_gh_inactive: "Бездействующий"
 trait_gh_inactive_desc: "Этот [Concept('liches','лич')|E] лишь изредка проявляет активность, предпочитая проводить долгие годы в праздности внутри своего некрополя вместо попыток влиять на внешний мир."
 trait_gh_inactive_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] лишь изредка проявляет активность, предпочитая проводить долгие годы в праздности внутри своего некрополя вместо попыток влиять на внешний мир."

 trait_gh_tireless: "Неутомимый"
 trait_gh_tireless_desc: "Не теряя попусту ни мгновения своего вечного существования, этот [Concept('liches','лич')|E] посвящает каждую секунду посмертия неустанной работе над своими великими целями."
 trait_gh_tireless_character_desc: "Не теряя попусту ни мгновения своего вечного существования, [ROOT.GetCharacter.GetFirstNameNoTooltip] посвящает каждую секунду посмертия неустанной работе над своими великими целями."

 trait_gh_naive: "Наивный"
 trait_gh_naive_desc: "Кажется, этот лич абсолютно не способен понять, что кто-то может осмелиться предать его. Он часто вверяет опасный объем власти подчиненным, и его легко склонить на свою сторону лестью или знаками покорности."
 trait_gh_naive_character_desc: "Кажется, этот лич абсолютно не способен понять, что кто-то может осмелиться предать его. [ROOT.GetCharacter.GetFirstNameNoTooltip] часто вверяет опасный объем власти подчиненным, и [ROOT.GetCharacter.GetHerHim] легко склонить на свою сторону лестью или знаками покорности."

 trait_gh_erratic: "Взбалмошный"
 trait_gh_erratic_desc: "Этот [Concept('liches','лич')|E] ничем не увлекается надолго: за его спиной лежит целое кладбище полуброшенных проектов и незавершенных замыслов."
 trait_gh_erratic_character_desc: "Этот [Concept('liches','лич')|E] ничем не увлекается надолго: за спиной [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] лежит целое кладбище полуброшенных проектов и незавершенных замыслов."

 trait_gh_indomitable: "Непреклонный"
 trait_gh_indomitable_desc: "Стоит этому [Concept('liches','личу')|E] вознамериться что-то сделать, как он будет идти до конца, несмотря ни на что. Хотя для существа с бесконечным запасом времени это часто благо, предсказуемость его действий делает подобные планы легко уязвимыми."
 trait_gh_indomitable_character_desc: "Стоит [ROOT.GetCharacter.GetFirstNameNoTooltip] вознамериться что-то сделать, как [ROOT.GetCharacter.GetSheHe] будет идти до конца, несмотря ни на что. Хотя для существа с бесконечным запасом времени это часто благо, предсказуемость [ROOT.GetCharacter.GetHerHis] действий делает подобные планы легко уязвимыми."

 trait_gh_godhater: "Богоненавистник"
 trait_gh_godhater_desc: "Этот [Concept('liches','лич')|E] либо полностью отрицает существование богов более могущественных, чем он сам, либо находит эту мысль настолько оскорбительной, что намеревается исправить подобную несправедливость."
 trait_gh_godhater_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E], который либо полностью отрицает существование богов более могущественных, чем [ROOT.GetCharacter.GetSheHe] сам, либо находит эту мысль настолько оскорбительной, что намеревается исправить подобную несправедливость."

 trait_gh_destroyer: "Разрушитель"
 trait_gh_destroyer_desc: "Этого лича вполне устраивает мысль остаться последним разумным существом на [aeras|E]: истребление смертных и других личей привлекает его куда больше, чем завоевания или господство."
 trait_gh_destroyer_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E], знающий, что живые — лишь слабые глупцы, само существование которых есть нанесение обиды, требующее ответа. Естественно, это означает, что каждое живое создание на [aeras|E] должно быть уничтожено и перековано в более полезную и прочную форму."

 trait_gh_controller: "Повелитель"
 trait_gh_controller_desc: "Этому [Concept('liches','личу')|E] куда интереснее заставлять смертных склоняться перед ним, чем просто убивать их. Поднятые скелеты слишком скучны! Кому охота получать поклонение от существ, которые даже не могут умолять о пощаде?"
 trait_gh_controller_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E], которому куда интереснее заставлять жалких смертных склоняться перед ним, чем истреблять их. Поднятые скелеты слишком скучны! Какое удовольствие пытать существ, которые даже не способны умолять о милосердии?"

 trait_gh_imperious: "Властолюбивый"
 trait_gh_imperious_desc: "Посмертие было бы слишком тоскливым для этого лича, не держи он судьбы бесчисленных существ в своих руках. Будь то смертные, разумная нежить или другие личи — он заинтересован в покорении своих врагов куда больше, чем в их полном уничтожении."
 trait_gh_imperious_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E], которого приводят в ярость мысли о том, что в мире всё еще существуют царства, не поклоняющиеся ему как богу. Положить конец этому вопиющему неповиновению — его первостепенная задача."

 trait_gh_logical: "Расчетливый"
 trait_gh_logical_desc: "Этот [Concept('liches','лич')|E] действуют медленно и методично, предпочитая уничтожать своих врагов с помощью долгосрочных интриг и коварных замыслов. В конце концов, в его распоряжении вечность."
 trait_gh_logical_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — медлительный и методичный [Concept('liches','лич')|E], предпочитающий уничтожать своих врагов с помощью долгосрочных интриг и коварных замыслов. В конце концов, в его распоряжении вечность."

 trait_gh_impulsive: "Импульсивный"
 trait_gh_impulsive_desc: "Этот [Concept('liches','лич')|E] — человек действия. Если другим перспектива вечности дарует терпение и рассудительность, то он считает, что и так прождал достаточно. После всего, что было отдано ради законного могущества, владычество над [aeras|E] всё еще не достигнуто, и каждый миг промедления — несмываемое оскорбление."
 trait_gh_impulsive_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E] действия. Если другим перспектива вечности дарует терпение и рассудительность, то [ROOT.GetCharacter.GetSheHe] считает, что и так [Select_CString(ROOT.GetCharacter.IsFemale, 'прождала', 'прождал' )] достаточно. После всего, что было отдано ради законного могущества, владычество над [aeras|E] всё еще не достигнуто, и каждый миг промедления — несмываемое оскорбление."

 trait_gh_perfectionist: "Перфекционист"
 trait_gh_perfectionist_desc: "Этот [Concept('liches','лич')|E] стремится к тому, чтобы его слуги и творения отражали искру его собственного величия, и предпочитает элиту своих армий бездумной ораве нежити."
 trait_gh_perfectionist_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E], который стремится к тому, чтобы его слуги и творения отражали искру его собственного величия, и предпочитает элиту своих армий бездумной ораве нежити."

 trait_gh_pragmatic: "Прагматик"
 trait_gh_pragmatic_desc: "Этот [Concept('liches','лич')|E] верит, что любые изъяны в боевых навыках бездумной нежити можно легко компенсировать ее подавляющим количеством."
 trait_gh_pragmatic_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E], убежденный, что любые изъяны в боевых навыках бездумной нежити можно легко компенсировать ее подавляющим количеством."

 trait_gh_selfcentered: "Эгоцентричный"
 trait_gh_selfcentered_desc: "Этого [Concept('liches','лича')|E] мало волнуют жалкие создания за пределами его поля зрения. Будучи центром вселенной, он искренне верит, что весь мир вращается вокруг него."
 trait_gh_selfcentered_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E], которого мало волнуют жалкие создания за пределами его поля зрения. Будучи центром вселенной, он искренне верит, что весь мир вращается вокруг него."

 trait_gh_luxurious: "Сибарит"
 trait_gh_luxurious_desc: "Этот [Concept('liches','лич')|E] знает: жить посмертной жизнью нужно в роскоши и пышности. Как низшие создания поймут его величие, если не демонстрировать его с царским размахом?"
 trait_gh_luxurious_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E], который знает: жить посмертной жизнью нужно в роскоши и пышности. Как низшие создания поймут его величие, если не демонстрировать его с царским размахом?"

 trait_gh_dour: "Хмурый"
 trait_gh_dour_desc: "Этот [Concept('liches','лич')|E], хоть и сохраняет свойственную его роду эксцентричность, куда более аскетичен, чем многие его собратья. Некоторые личи просто устают от пиров длиною в век — особенно когда соседний некрополь никогда не умеет вести себя тихо!"
 trait_gh_dour_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E], который, хоть и сохраняет свойственную его роду эксцентричность, куда более аскетичен, чем многие его собратья. Некоторые личи просто устают от пиров длиною в век — особенно когда соседний некрополь никогда не умеет вести себя тихо!"

 trait_gh_hoarder: "Скупец"
 trait_gh_hoarder_desc: "Для этого [Concept('liches','лича')|E] накопление сокровищ, тайных знаний и артефактов — это не средство достижения цели, а сама цель."
 trait_gh_hoarder_character_desc: "Для этого [Concept('liches','лича')|E] накопление сокровищ, тайных знаний и артефактов — это не средство достижения цели, а сама цель."

 trait_gh_cautious: "Осторожный"
 trait_gh_cautious_desc: "Этого [Concept('liches','лича')|E] редко увидишь без целой армии прислуги; он не подвергнет себя даже малейшей опасности без крайней нужды и крайне редко покидает свой некрополь."
 trait_gh_cautious_character_desc: "Этого [Concept('liches','лича')|E] редко увидишь без целой армии прислуги; он не подвергнет себя даже малейшей опасности без крайней нужды и крайне редко покидает свой некрополь."

 trait_gh_chaotic: "Хаотичный"
 trait_gh_chaotic_desc: "Порядок отвратителен для этого [Concept('liches','лича')|E], даже если он сам стоит у руля. Он упоен своей непредсказуемостью, сея хаос и смуту даже тогда, когда это вредит его собственным интересам."
 trait_gh_chaotic_character_desc: "Порядок отвратителен для этого [Concept('liches','лича')|E], даже если он сам стоит у руля. Он упоен своей непредсказуемостью, сея хаос и смуту даже тогда, когда это вредит его собственным интересам."

 trait_gh_brazen: "Дерзкий"
 trait_gh_brazen_desc: "Воодушевленный обретенным бессмертием, этот [Concept('liches','лич')|E] предпочитает лично рваться в самую гущу событий."
 trait_gh_brazen_character_desc: "Воодушевленный обретенным бессмертием, этот [Concept('liches','лич')|E] предпочитает лично рваться в самую гущу событий."

 trait_gh_manipulator: "Манипулятор"
 trait_gh_manipulator_desc: "Сложная паутина интриг и обмана, окружающей этого [Concept('liches','лича')|E], плелась веками и опутывает целые континенты."
 trait_gh_manipulator_character_desc: "Сложная паутина интриг и обмана, окружающей этого [Concept('liches','лича')|E], плелась веками и опутывает целые континенты."

 trait_education_lich: "Лич"
 trait_education_lich_1: "Юный лич"
 trait_education_lich_1_desc: "Юный [Concept('liches','лич')|E] сделал лишь первые шаги на пути к тому, чтобы стать мерзкой аберацией вопреки всем законам жизни, и еще не накопил темных знаний более древних и умудренных собратьев. Или, возможно, он просто бездарен в искусстве личдом, хоть и ни за что в этом не признается."
 trait_education_lich_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сделала', 'сделал' )] лишь первые шаги на пути к тому, чтобы стать мерзкой аберацией вопреки всем законам жизни, и еще не [Select_CString(ROOT.GetCharacter.IsFemale, 'накопила', 'накопил' )] темных знаний более древних и умудренных [liches|E]. Или, возможно, [ROOT.GetCharacter.GetSheHe] просто бездарен в искусстве личдома, хоть и ни за что в этом не признается."

 trait_education_lich_2: "Лич-посвященный"
 trait_education_lich_2_desc: "Лич-посвященный все еще считается относительно слабым по сравнению со своими современниками — будь то из-за недавнего обращения или простой некомпетентности, хотя, слушая его пространные тирады, этого и не скажешь."
 trait_education_lich_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] все еще считается относительно слабым по сравнению с другими [liches|E] — будь то из-за недавнего обращения или простой некомпетентности, хотя, слушая [ROOT.GetCharacter.GetHerHis] пространные тирады, этого и не скажешь."

 trait_education_lich_3: "Лич"
 trait_education_lich_3_desc: "Рядовой [Concept('liches','лич')|E], наделенный силами, способными сводить с ума, и нравом, который большинство назвали бы «крайне неприятным для общения»."
 trait_education_lich_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — типичный [Concept('liches','лич')|E], наделенный силами, способными сводить с ума, и нравом, который большинство назвали бы «крайне неприятным для общения»."

 trait_education_lich_4: "Могущественный лич"
 trait_education_lich_4_desc: "Могущественный [Concept('liches','лич')|E] с возрастом и силой заслужил статус грозного представителя своего вида и внушающего страх некроманта, способного сеять разрушения и проявлять поистине магический уровень нарциссизма."
 trait_education_lich_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] с возрастом и силой [Select_CString(ROOT.GetCharacter.IsFemale, 'заслужила', 'заслужил' )] статус грозного представителя [Concept('liches','личей')|E] и внушающего страх некроманта, способного сеять разрушения и проявлять поистине магический уровень нарциссизма."

 trait_education_lich_5: "Старейший лич"
 trait_education_lich_5_desc: "Старейший [Concept('liches','лич')|E] стоит на вершине могущества своего темного племени. Достиг ли он таких жудощных высот за века отвратительной насмешки над жизнью или благодаря чудовищной силе своей души, он способен сеять невиданное опустошение и произносить многодневные пространные речи, не требующие глупых человеческих перерывов вроде «дыхания» или «возможности дать высказаться другим». Ситуацию обычно усугубляет то, что большинство старейших личей настолько древние, что их взгляды на современную культуру можно в лучшем случае назвать «слегка устаревшими»."
 trait_education_lich_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] стоит на вершине могущества своего темного племени. Достиг ли [ROOT.GetCharacter.GetSheHe] таких жутких высот за века отвратительной насмешки над жизнью или благодаря чудовищной силе своей души, [ROOT.GetCharacter.GetSheHe] — [Concept('liches','лич')|E], способный сеять невиданное опустошение и произносить многодневные пространные речи, не требующие глупых человеческих перерывов вроде «дыхания» или «возможности дать высказаться другим». Ситуацию обычно усугубляет то, что большинство старейших личей настолько древние, что их взгляды на современную культуру можно в лучшем случае назвать «слегка устаревшими»."
 
 trait_gh_cult_everlasting: "Культ Вечности"
 trait_gh_cult_everlasting_desc: "Этот [Concept('liches','лич')|E] когда-то состоял в Культе Вечности (Kult Wiczośwoci) древней Оейницы. Это делает его одним из перворожденных личей и учеником легендарного [vilas_venslau|E]. Как один из виновников ужасного [Concept('sorrowing_of_oejeynica','Оплакивания Оейницы')|E], чужеземцами он считается чудовищным монстром, но в то же время признается, возможно, одним из самых опасных существ, когда-либо живших или неживших. Члены Культа Вечности пользуются привилегией, которую почти невозможно заслужить любому другому личу: неохотным уважением со стороны большинства себе подобных."
 trait_gh_cult_everlasting_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] когда-то [Select_CString(ROOT.GetCharacter.IsFemale, 'состояла', 'состоял' )] в Культе Вечности (Kult Wiczośwoci) древней Оейницы. Это делает [ROOT.GetCharacter.GetHerHim] одним из перворожденных [liches|E] и [Select_CString(ROOT.GetCharacter.IsFemale, 'ученицей', 'учеником' )] легендарного [vilas_venslau|E]. Как [Select_CString(ROOT.GetCharacter.IsFemale, 'одна', 'один' )] из виновников ужасного [Concept('sorrowing_of_oejeynica','Оплакивания Оейницы')|E], чужеземцами [ROOT.GetCharacter.GetSheHe] считается чудовищным монстром, но в то же время признается, возможно, одним из самых опасных существ, когда-либо живших или неживших. [ROOT.GetCharacter.GetSheHe] даже пользуется привилегией, которую почти невозможно заслужить любому другому личу: неохотным уважением со стороны большинства себе подобных."

 trait_gh_master_cult_everlasting: "Магистр Культа Вечности"
 trait_gh_master_cult_everlasting_desc: "Этот [Concept('liches','лич')|E] когда-то был магистром Культа Вечности в древней Оейнице. Это делает его прародителем практически каждого [Concept('liches','лича')|E] на [the_continent|E]. Будучи, возможно, самым могущественным личом в истории, он внушает уважение даже пресловутым своей злобой и усобными войнами личам из [the_lichdoms|E], ведь именно он начал [sorrowing_of_oejeynica|E]."
 trait_gh_master_cult_everlasting_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] когда-то [Select_CString(ROOT.GetCharacter.IsFemale, 'была магистром', 'был магистром' )] Культа Вечности в древней Оейнице. Это делает [ROOT.GetCharacter.GetHerHim] [Select_CString(ROOT.GetCharacter.IsFemale, 'прародительницей', 'прародителем' )] практически каждого [Concept('liches','лича')|E] на [the_continent|E]. Будучи, возможно, самым могущественным личом в истории, [ROOT.GetCharacter.GetSheHe] внушает уважение даже пресловутым своей злобой и усобными войнами личам из [the_lichdoms|E], ведь именно [ROOT.GetCharacter.GetSheHe] [Select_CString(ROOT.GetCharacter.IsFemale, 'начала', 'начал' )] [sorrowing_of_oejeynica|E]."

 trait_gh_arch_lich_1: "Архилич"
 trait_gh_arch_lich_1_desc: "Истинный [Concept('arch_lich','Архилич')|E] — этот [Concept('liches','лич')|E] совершил невозможное и временно подчинил себе достаточное количество соперников из [the_lichdoms|E], чтобы его признали Архиличом, верховным владыкой всей нежити. Это означает, что он, скорее всего, повелевает огромным войском неживых, а его свита состоит из ковена сильнейших [magi|E] из ныне живущих. Впрочем, успеет ли он воспользоваться этой силой до того, как кто-то из подчиненных совершит традиционное политическое убийство, еще неизвестно..."
 trait_gh_arch_lich_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — истинный [Concept('arch_lich','Архилич')|E]. Это [Concept('liches','лич')|E], [Select_CString(ROOT.GetCharacter.IsFemale, 'совершившая', 'совершивший' )] невозможное и временно [Select_CString(ROOT.GetCharacter.IsFemale, 'подчинившая', 'подчинивший' )] себе достаточное количество соперников из [the_lichdoms|E], чтобы быть признанным Архиличом, верховным владыкой всей нежити. Это означает, что [ROOT.GetCharacter.GetSheHe], скорее всего, повелевает огромным войском неживых, а [ROOT.GetCharacter.GetHerHis] свита состоит из ковена сильнейших [magi|E] из ныне живущих. Впрочем, успеет ли [ROOT.GetCharacter.GetSheHe] воспользоваться этой силой до того, как кто-то из подчиненных совершит традиционное политическое убийство, еще неизвестно..."

 trait_gh_disconnected: "Отторгнутый"
 trait_gh_disconnected_desc: "Этот [Concept('liches','лич')|E] утратил связь с миром, судя по всему, потеряв способность управлять собственным телом."
 trait_gh_disconnected_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'утратила', 'утратил' )] связь с миром, судя по всему, потеряв способность управлять своим телом."

 trait_gh_debodied: "Обезглавленный"
 trait_gh_debodied_desc: "Тело этого [Concept('liches','лича')|E] было уничтожено, и от него остался лишь череп. Скорее всего, он крайне разъярен этим фактом, а также тем, что лишился почти всей своей магии."
 trait_gh_debodied_character_desc: "Тело [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] было уничтожено, и от [ROOT.GetCharacter.GetHerHis] остался лишь череп. [ROOT.GetCharacter.GetSheHe], скорее всего, крайне [Select_CString(ROOT.GetCharacter.IsFemale, 'разъярена', 'разъярен' )] этим фактом, а также тем, что [Select_CString(ROOT.GetCharacter.IsFemale, 'лишилась', 'лишился' )] почти всей своей магии."

 trait_gh_overvain: "Одержимый тщеславием"
 trait_gh_overvain_desc: "Этот [Concept('liches','лич')|E] пал жертвой тщеславия — особый вид безумия, присущий нежити. Не получив ответа на претензии на владычество над вселенной и не найдя ничего нового в вечном существовании, он сошел с ума от самовлюбленности и теперь бесконечно пыжится, уничтожая сам себя в попытках «украсить» свой облик."
 trait_gh_overvain_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'пала', 'пал' )] жертвой тщеславия — особый вид безумия, присущий [Concept('liches','личам')|E]. Не получив ответа на претензии на владычество над вселенной и не найдя ничего нового в вечном существовании, [ROOT.GetCharacter.GetSheHe] [Select_CString(ROOT.GetCharacter.IsFemale, 'сошла', 'сошел' )] с ума от самовлюбленности и теперь бесконечно пытается превзойти [Select_CString(ROOT.GetCharacter.IsFemale, 'саму себя', 'самого себя' )], уничтожая свое тело в попытках «украсить» свой облик."

 trait_gh_soulshadowed: "Омраченный душой"
 trait_gh_soulshadowed_desc: "«Омрачение души» — вежливое выражение, используемое [liches|E] для описания угасания и распада разума нежити. Некроманты, пораженные этим недугом, становятся всё более отстраненными и равнодушными к окружающему миру, с трудом понимают речи и часто кажутся «затерянными» в странных грезах, видениях или кошмарах. Точная причина неизвестна: среди вариантов называют вновь открывшуюся травму, магическое повреждение узы или же неизбежный финал жизни любого лича. Последнее внушает личам наибольший ужас, и многие из них веками отчаянно пытаются найти способ отсрочить это безумие."
 trait_gh_soulshadowed_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'омрачена', 'омрачен' )] душой — это вежливое выражение, используемое [liches|E] для описания угасания и распада разума нежити. [ROOT.GetCharacter.GetFirstNameNoTooltip] становится всё более [Select_CString(ROOT.GetCharacter.IsFemale, 'отстраненной', 'отстраненным' )] и [Select_CString(ROOT.GetCharacter.IsFemale, 'равнодушной', 'равнодушным' )] к окружающему миру, с трудом понимает речи и часто кажется [Select_CString(ROOT.GetCharacter.IsFemale, 'затерянной', 'затерянным' )] в странных грезах, видениях или кошмарах. Точная причина неизвестна: среди вариантов называют вновь открывшуюся травму, магическое повреждение узы или неизбежный финал жизни нежити. Последнее внушает личам наибольший ужас, и многие из них веками отчаянно пытаются найти способ отсрочить это безумие."

 trait_gh_legon: "Легон"
 gh_legon_neutral: "Легон"
 gh_legon_male: "Легон"
 gh_legon_female: "Легона"
 trait_gh_legon_character_desc: "Благодаря интригам, праву рождения или личным заслугам, [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'признана', 'признан' )] командующим [Concept('aversaria','Аверсарианского')|E] Легиона."
 trait_gh_legon_desc: "Благодаря интригам, праву рождения или личным заслугам, этот персонаж признан командующим [Concept('aversaria','Аверсарианского')|E] Легиона."

 trait_gh_arch_legon: "Архилегон"
 gh_arch_legon_neutral: "Архилегон"
 gh_arch_legon_male: "Архилегон"
 gh_arch_legon_female: "Архилегона"
 trait_gh_arch_legon_desc: "Этот персонаж, заслуженно или нет, достиг высшего военного чина в [aversaria|E] и обладает властью командовать целой армией Легионов Аверсарии и править от имени аавтократа."
 trait_gh_arch_legon_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], заслуженно или нет, [Select_CString(ROOT.GetCharacter.IsFemale, 'достигла', 'достиг' )] высшего военного чина в [aversaria|E] и обладает властью командовать целой армией Легионов Аверсарии и править от имени аавократа."

 trait_gh_gedeora_victim: "Жертва гедёрды"
 trait_gh_gedeora_victim_desc: "Разум этого персонажа был изменен с помощью [gedeora|E]. Даже если он не может понять, что именно изменилось, где-то в глубине его сознания всё кричит о том, что произошло нечто ужасное..."
 trait_gh_gedeora_victim_character_desc: "Разум [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] был изменен с помощью [gedeora|E]. Даже если [ROOT.GetCharacter.GetSheHe] не может понять, что именно изменилось, где-то в глубине [ROOT.GetCharacter.GetHerHis] сознания всё кричит о том, что произошло нечто ужасное..."

 trait_gh_odrstund_victim: "Жертва Одрстунда"
 trait_gh_odrstund_victim_desc: "Разум этого персонажа был искажен [odrstund|E] — наихудшей [gedeora|E], зафиксированной в исторической хронике [Concept('aversaria','Аверсарии')|E]. Доведенный до грани безумия вырвавшейся наружу жаждой крови, он вызывает одинаковую смесь жалости, страха и отвращения."
 trait_gh_odrstund_victim_character_desc: "Разум [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] был искажен [odrstund|E] — наихудшей [gedeora|E], зафиксированной в исторической хронике [Concept('aversaria','Аверсарии')|E]. [Select_CString(ROOT.GetCharacter.IsFemale, 'Доведенная', 'Доведенный' )] до грани безумия вырвавшейся наружу жаждой крови, [ROOT.GetCharacter.GetSheHe] вызывает одинаковую смесь жалости, страха и отвращения."

 trait_fools_curse: "Проклятие Дураков"
 trait_fools_curse_desc: "Этот персонаж поражен проклятием [Concept('fools_coast_biozone','Берега Дураков')|E]: его плоть превращается в сплав металлов, а внутренности разрываются на части."
 trait_fools_curse_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'поражена', 'поражен' )] [fools_curse|E]: [ROOT.GetCharacter.GetHerHis] плоть превращается в сплав металлов, а внутренности разрываются на части."

 trait_shade_stricken: "Пораженный тенью"
 trait_shade_stricken_desc: "Этот персонаж стал жертвой губительной силы Теней — зловещих духов, способных погрузить землю во мрак. Его тело медленно уничтожает себя изнутри."
 trait_shade_stricken_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'стала жертвой', 'стал жертвой' )] губительной силы Теней — зловещих духов, способных погрузить землю во мрак. [ROOT.GetCharacter.GetHerHis] тело медленно уничтожает себя изнутри."

 trait_magic_court: "Тайный придворный"
 trait_magic_court_1: "Тайный придворный"
 trait_magic_court_1_desc: "Этот персонаж провел не менее [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] лет при исполненном мудрости [GetCourtType('court_magic').GetName], где полно проницательных [magi|E] и ученых."
 trait_magic_court_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'провела', 'провел' )] не менее [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] лет при исполненном мудрости [GetCourtType('court_magic').GetName], где полно проницательных [magi|E] и ученых."

 trait_magic_court_2: "Уважаемый тайный придворный"
 trait_magic_court_2_desc: "Этот персонаж провел не менее [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] лет при исполненном мудрости [GetCourtType('court_magic').GetName], где полно проницательных [magi|E] и ученых."
 trait_magic_court_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'провела', 'провел' )] не менее [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] лет при исполненном мудрости [GetCourtType('court_magic').GetName], где полно проницательных [magi|E] и ученых."

 trait_gh_magic_debug: "Маг-гепард"
 trait_gh_magic_debug_desc: "Этот персонаж — маг, используемый для отладки. #BOL Вы#, скорее всего, читерите. Фу таким быть!"
 trait_gh_magic_debug_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — маг, используемый для отладки. #BOL Вы#!, скорее всего, читерите. Фу таким быть!"

 trait_gh_griffon_trait: "Грифон"
 trait_gh_griffon_trait_desc: "Это [Concept('griffons','Грифон')|E] — одно из [Concept('godtouched_creatures','Боготронутых созданий')|E], родом из [chevalie|E]. Хотя они ценятся как благородные верховые животные, встречаются они довольно редко и распространены в основном среди королевских особ."
 trait_gh_griffon_trait_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('griffons','Грифон')|E], одно из [Concept('godtouched_creatures','Боготронутых созданий')|E], родом из [chevalie|E]. Хотя они ценятся как благородные верховые животные, встречаются они довольно редко и распространены в основном среди королевских особ."

