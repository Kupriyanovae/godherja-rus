 trait_gh_magocratic_republic_trait: "Правитель магократической республики"
 trait_gh_magocratic_republic_trait_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'выбрала', 'выбрал' )] это свойство в редакторе правителя, чтобы возглавить магократическую республику на старте игры. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 trait_gh_magocratic_republic_trait_desc: "Выбор этого свойства в редакторе правителя гарантирует, что на старте игры вы возглавите магократическую республику. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 
 trait_gh_pirate_trait: "Пиратский капитан"
 trait_gh_pirate_trait_character_desc: "ЙАРРР! [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'выбрала', 'выбрал' )] это свойство в редакторе правителя, чтобы возглавить пиратское государство на старте игры. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."
 trait_gh_pirate_trait_desc: "ЙАРРР! Выбор этого свойства в редакторе правителя гарантирует, что на старте игры вы возглавите пиратское государство. Если это свойство встречается за пределами редактора правителя, пожалуйста, сообщите об этой ошибке."

 trait_gh_glassmith_1: "Стеклодув"
 trait_gh_glassmith_1_desc: "Этот персонаж освоил базовые техники стеклодувного дела и способен создавать красивые, пусть и не без изъянов, стеклянные безделушки и сосуды."
 trait_gh_glassmith_1_character: "Стеклодув-любитель"
 trait_gh_glassmith_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'освоила', 'освоил' )] базовые техники стеклодувного дела и [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] создавать красивые, пусть и не без изъянов, стеклянные безделушки и сосуды."
 trait_gh_glassmith_2_character: "Опытный стеклодув"
 trait_gh_glassmith_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — опытный мастер стеклодувного дела, и [ROOT.GetCharacter.GetHerHis] творения достойны украшать дворы королей и императоров по всему [Concept('aeras','Эрасу')|E]."
 trait_gh_glassmith_3_character: "Мастер-стеклодув"
 trait_gh_glassmith_3_character_desc: "Для [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] стекло течёт словно вода, а из-под [ROOT.GetCharacter.GetHerHis] рук выходят сокровища, достойные целых народов."
 trait_track_gh_lifestyle_glassmith: "Стеклодув"
 trait_track_gh_lifestyle_glassmith_desc: "Изготовление стекла — утончённое искусство, вершина мастерства в котором доступна лишь самым преданным своему делу ремесленникам."
 trait_gh_historical_glassmith: "Персонажи со свойством «$trait_track_gh_lifestyle_glassmith$»"

 trait_gh_steppe_queen_1: "Орзопайя"
 trait_gh_steppe_queen_1_desc: "Ожидается, что [Glossary('Órzopaja','GH_ORZOPAJA_GLOSS')] преуспеет в традиционных сарминских воинских искусствах: стрельбе из лука, соколиной охоте и конном бою."
 trait_gh_steppe_queen_1_character: "Начинающая орзопайя"
 trait_gh_steppe_queen_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] только [Select_CString(ROOT.GetCharacter.IsFemale, 'начала', 'начал' )] осваивать сарминские воинские традиции, и [ROOT.GetCharacter.GetHerHim] положено носить лишь самые короткие косы."
 trait_gh_steppe_queen_2_character: "Усердная орзопайя"
 trait_gh_steppe_queen_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] уже неплохо [Select_CString(ROOT.GetCharacter.IsFemale, 'освоила', 'освоил' )] роль [Glossary('Órzopaja','GH_ORZOPAJA_GLOSS')] и [Select_CString(ROOT.GetCharacter.IsFemale, 'заслужила', 'заслужил' )] право носить более длинную косу."
 trait_gh_steppe_queen_3_character: "Испытанная орзопайя"
 trait_gh_steppe_queen_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'заслужила', 'заслужил' )] признание и уважение соратников благодаря впечатляющему воинскому мастерству и имеет право заплетать лишь самые длинные косы."
 trait_gh_steppe_queen_4_character: "Прославленная орзопайя"
 trait_gh_steppe_queen_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'достигла', 'достиг' )] почти легендарной славы и считается ровней древним героям своей культуры ([ROOT.GetCharacter.GetCulture.GetNameNoTooltip]), а длина [ROOT.GetCharacter.GetHerHis] косы впечатляет не меньше."
 trait_gh_steppe_queen_1_foreign_character: "Начинающая зерхени"
 trait_gh_steppe_queen_1_foreign_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] только начинает путь [Glossary('Zsêrhêni','GH_ZSERHENI_GLOSS')] и пока не [Select_CString(ROOT.GetCharacter.IsFemale, 'совершила', 'совершил' )] особых подвигов, поэтому [ROOT.GetCharacter.GetHerHim] положено носить лишь самые короткие косы."
 trait_gh_steppe_queen_2_foreign_character: "Усердная зерхени"
 trait_gh_steppe_queen_2_foreign_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'заслужила', 'заслужил' )] некоторое признание в качестве [Glossary('Zsêrhêni','GH_ZSERHENI_GLOSS')] и имеет право носить более длинную косу."
 trait_gh_steppe_queen_3_foreign_character: "Испытанная зерхени"
 trait_gh_steppe_queen_3_foreign_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Select_CString(ROOT.GetCharacter.IsFemale, 'бывалая', 'бывалый' )] [Glossary('Zsêrhêni','GH_ZSERHENI_GLOSS')]. За [ROOT.GetCharacter.GetHerHis] плечами немало впечатляющих подвигов, и [ROOT.GetCharacter.GetSheHe] имеет право заплетать лишь самые длинные косы."
 trait_gh_steppe_queen_4_foreign_character: "Прославленная зерхени"
 trait_gh_steppe_queen_4_foreign_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'прославилась', 'прославился' )] как [Glossary('Zsêrhêni','GH_ZSERHENI_GLOSS')], а длина [ROOT.GetCharacter.GetHerHis] косы не уступает косам героев древности."
 trait_track_lifestyle_gh_steppe_queen: "$trait_gh_steppe_queen_1$"
 trait_track_lifestyle_gh_steppe_queen_desc: "$trait_gh_steppe_queen_1_desc$\n\n$trait_track_lifestyle_gh_steppe_queen_hint$"
 trait_track_lifestyle_gh_steppe_queen_hint: "#weak Это [Concept('trait_level_track','направление свойства')|E] получает прогресс за поступки, приумножающие личную легенду: участие в [Concept('raids','налётах')|E], [Concept('battles','битвах')|E] и [Concept('single_combat_duel','поединках')|E], продвижение в [Concept('martial_lifestyle','военном деле')|E], участие в занятии «[GetActivityType('activity_hunt').GetName]», а также выбор определённых вариантов в событиях.#!"

 trait_gh_elementalist: "Элементалист"
 trait_gh_elementalist_desc: "Элементалист — это [Concept('magi','маг')|E], владеющий искусством призыва живых воплощений [Concept('gh_aspect', 'аспектов')|E] себе на службу."
 trait_gh_elementalist_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] умеет призывать живые воплощения [Concept('gh_aspect', 'аспектов')|E], заставляя их исполнять свою волю."
 trait_track_magical_light: "Сродство: [aspect_light]"
 trait_track_magical_light_desc: "Элементали аспекта «[aspect_light]» олицетворяют порядок и подчинение."

 trait_lifestyle_one_with_nature: "Единство с природой"
 trait_lifestyle_one_with_nature_desc: "Этот персонаж обрёл глубокую связь с диким миром [Concept('aeras','Эраса')|E]; он лучше подготовлен и чуток к его хаотичным капризам."
 trait_lifestyle_one_with_nature_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'обрела', 'обрёл' )] глубокую связь с диким миром [Concept('aeras','Эраса')|E]; [ROOT.GetCharacter.GetSheHe] лучше [Select_CString(ROOT.GetCharacter.IsFemale, 'подготовлена', 'подготовлен' )] и [Select_CString(ROOT.GetCharacter.IsFemale, 'чутка', 'чуток' )] к его хаотичным капризам."

 trait_gh_heir_of_asojiva: "Наследник Асодживы"
 trait_gh_heir_of_asojiva_desc: "Этот персонаж провозглашён законным наследником престола Асодживы и продолжателем рода Тарьядов. Применяя те же навыки, что помогли вернуть земли предков, он непременно приведёт державу к золотому веку и будет зорко следить за некоторыми группами, например за учёными, чтобы трагедия гибели Тарьяда никогда не повторилась."
 trait_gh_heir_of_asojiva_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'провозглашена', 'провозглашён' )] законным наследником престола Асодживы и продолжателем рода Тарьядов. Применяя те же навыки, что помогли вернуть земли [ROOT.GetCharacter.GetHerHis] предков, [ROOT.GetCharacter.GetSheHe] непременно приведёт державу к золотому веку и будет зорко следить за некоторыми группами, например за учёными, чтобы трагедия гибели Тарьяда никогда не повторилась."

 trait_gh_temporarily_disinherited: "Временно лишённый наследства"
 trait_temporarily_disinherited_desc: "Из-за превратностей судьбы этот персонаж лишился прав на наследование. Но его заверили, что это лишь временная мера."
 trait_temporarily_disinherited_character_desc: "Из-за превратностей судьбы [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'лишилась', 'лишился' )] прав на наследование. Но [ROOT.GetCharacter.GetHerHim] заверили, что это лишь временная мера."

 trait_necromancy_undead_thrall: "Некротический слуга"
 trait_necromancy_undead_thrall_desc: "Этого персонажа подняли из мёртвых и обрекли на вечную службу могущественному некроманту или [Concept('liches','личу')|E]. Теперь он — некротический слуга, пешка в чужих руках. Самостоятельное мышление даётся ему с трудом, поэтому он годится лишь для чёрной работы, а вся его свобода сводится к возможности сетовать на свою участь. Однако со временем заключённая в нём душа может вновь обрести подобие личности."
 trait_necromancy_undead_thrall_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] служит некротическим слугой — пешкой в руках могущественного некроманта или [Concept('liches','лича')|E]. [ROOT.GetCharacter.GetHerHim|U] подняли из мёртвых и обрекли на вечную службу. Самостоятельное мышление даётся [ROOT.GetCharacter.GetHerHim] с трудом, поэтому [ROOT.GetCharacter.GetSheHe] годится лишь для чёрной работы, а вся [ROOT.GetCharacter.GetHerHis] свобода сводится к возможности сетовать на свою участь. Однако со временем заключённая в [ROOT.GetCharacter.GetHerHim] душа может вновь обрести подобие личности."

 trait_necromancy_undead_awakened: "Пробуждённая нежить"
 trait_necromancy_undead_awakened_desc: "Этот персонаж стал пробуждённой нежитью: либо его намеренно создал могущественный некромант или [Concept('liches','лич')|E], либо мёртвый слуга случайно обрёл подлинное сознание. Теперь у него есть личность, воля и стремление продолжать существование, поэтому низшая магия больше не способна им управлять. Более сильное некромантическое подчинение, конечно, всё ещё действует — как и обычные средства вроде «убеждения» и «торга»."
 trait_necromancy_undead_awakened_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — пробуждённая нежить: либо [ROOT.GetCharacter.GetHerHim] намеренно создал могущественный некромант или [Concept('liches','лич')|E], либо сначала [ROOT.GetCharacter.GetHerHim] воскресили в виде бездумной нежити, после чего [ROOT.GetCharacter.GetSheHe] случайно [Select_CString(ROOT.GetCharacter.IsFemale, 'обрела', 'обрёл' )] подлинное сознание. Теперь у [ROOT.GetCharacter.GetHerHim] есть личность, воля и стремление продолжать существование, поэтому низшая магия больше не способна [ROOT.GetCharacter.GetHerHim] контролировать. Более сильное некромантическое подчинение, конечно, всё ещё действует — как и обычные средства вроде «убеждения» и «торга»."

 trait_necromancy_undead_lich: "Лич"
 trait_necromancy_undead_lich_desc: "Этот персонаж — могущественный некромант или [Concept('liches','лич')|E], властелин жизни и смерти, обладающий силой, которую большинство сочло бы противоестественной."
 trait_necromancy_undead_lich_character_desc: "Пройдя череду тёмных и жутких ритуалов, известных как «Тринадцать шагов Бездны», [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'достигла', 'достиг' )] состояния [Concept('lichdom','личества')|E], отбросив мораль и смертную плоть и обретя взамен кажущееся бессмертие."

 # Lich traits
 trait_gh_volatile: "Вспыльчивый"
 trait_gh_volatile_desc: "Этот [Concept('liches','лич')|E] склонен к крайним перепадам настроения и способен впасть в разрушительный гнев от малейшего повода или неудачи."
 trait_gh_volatile_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] отличается резкими перепадами настроения и может впасть в разрушительный гнев из-за малейшего повода или неудачи."

 trait_gh_emotionless: "Бесчувственный"
 trait_gh_emotionless_desc: "Последние искры человеческих эмоций давно покинули этого [Concept('liches','лича')|E], и теперь он действует с холодной неизменностью, словно автоматон."
 trait_gh_emotionless_character_desc: "Последние искры человеческих эмоций давно покинули [ROOT.GetCharacter.GetHerHim], и теперь [ROOT.GetCharacter.GetSheHe] действует с холодной неизменностью, словно автоматон."

 trait_gh_divine: "Божественный"
 trait_gh_divine_desc: "Этот [Concept('liches','лич')|E] знает, что боги действительно существуют, и безусловно считает себя одним из них."
 trait_gh_divine_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. [ROOT.GetCharacter.GetSheHe|U] знает, что боги действительно существуют, и считает себя божеством."

 trait_gh_megalomaniacal: "Мания величия"
 trait_gh_megalomaniacal_desc: "Даже по меркам [Concept('liches','личей')|E] этот персонаж тратит непомерно много сил на возведение монументов в свою честь, затяжные самодовольные тирады и принятие поклонения как смертных, так и мёртвых слуг."
 trait_gh_megalomaniacal_character_desc: "Даже по меркам [Concept('liches','личей')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] тратит непомерно много сил на возведение монументов в свою честь, затяжные самодовольные тирады и принятие поклонения как смертных, так и мёртвых слуг."

 trait_gh_inactive: "Бездействующий"
 trait_gh_inactive_desc: "Этот [Concept('liches','лич')|E] лишь изредка проявляет активность, предпочитая проводить долгие годы в праздности в стенах своего некрополя вместо того, чтобы влиять на внешний мир."
 trait_gh_inactive_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] лишь изредка проявляет активность, предпочитая проводить долгие годы в праздности в стенах своего некрополя вместо того, чтобы влиять на внешний мир."

 trait_gh_tireless: "Неутомимый"
 trait_gh_tireless_desc: "Не теряя ни мгновения вечного существования, этот [Concept('liches','лич')|E] посвящает каждую секунду посмертия работе ради своих конечных целей."
 trait_gh_tireless_character_desc: "Не теряя ни мгновения вечного существования, [ROOT.GetCharacter.GetFirstNameNoTooltip] посвящает каждую секунду посмертия работе ради своих конечных целей."

 trait_gh_naive: "Наивный"
 trait_gh_naive_desc: "Этот лич, похоже, не способен поверить, что кто-то осмелится его предать. Он часто наделяет подчинённых опасно широкими полномочиями и легко поддаётся лести и показной покорности."
 trait_gh_naive_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], похоже, не допускает мысли, что кто-то осмелится [ROOT.GetCharacter.GetHerHim] предать. [ROOT.GetCharacter.GetSheHe|U] часто наделяет подчинённых опасно широкими полномочиями и легко поддаётся лести и показной покорности."

 trait_gh_erratic: "Взбалмошный"
 trait_gh_erratic_desc: "Этот [Concept('liches','лич')|E] ничем не увлекается надолго: за его спиной лежит целое кладбище полуброшенных проектов и незавершённых замыслов."
 trait_gh_erratic_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ничем не увлекается надолго: за [ROOT.GetCharacter.GetHerHis] спиной осталось целое кладбище полузаконченных проектов и брошенных замыслов."

 trait_gh_indomitable: "Непреклонный"
 trait_gh_indomitable_desc: "Стоит этому [Concept('liches','личу')|E] что-то задумать, как он доведёт дело до конца, несмотря ни на что. Для существа с почти бесконечным запасом времени это часто полезно, но из-за его предсказуемости такие планы легко сорвать."
 trait_gh_indomitable_character_desc: "Стоит [ROOT.GetCharacter.GetFirstNameNoTooltip] что-то задумать, как [ROOT.GetCharacter.GetSheHe] доведёт дело до конца, несмотря ни на что. Для существа с почти бесконечным запасом времени это часто полезно, но из-за [ROOT.GetCharacter.GetHerHis] предсказуемости такие планы легко сорвать."

 trait_gh_godhater: "Богоненавистник"
 trait_gh_godhater_desc: "Этот [Concept('liches','лич')|E] либо полностью отрицает существование богов более могущественных, чем он сам, либо находит эту мысль настолько оскорбительной, что намеревается исправить подобную несправедливость."
 trait_gh_godhater_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. [ROOT.GetCharacter.GetSheHe|U] либо полностью отрицает существование богов могущественнее [ROOT.GetCharacter.GetHerselfHimself], либо считает саму эту мысль настолько невыносимой, что намеревается исправить положение."

 trait_gh_destroyer: "Разрушитель"
 trait_gh_destroyer_desc: "Этого лича вполне устраивает мысль остаться последним разумным существом на [Concept('aeras','Эрасе')|E]: истребление смертных и других личей привлекает его куда больше, чем завоевания или господство."
 trait_gh_destroyer_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. Для [ROOT.GetCharacter.GetHerHim] живые — слабые глупцы, а само их существование — оскорбление, требующее ответа. Поэтому всё живое на [Concept('aeras','Эрасе')|E] следует уничтожить и переделать в более полезную и долговечную форму."

 trait_gh_controller: "Повелитель"
 trait_gh_controller_desc: "Этому [Concept('liches','личу')|E] куда интереснее заставлять смертных склоняться перед ним, чем просто убивать их. Поднятые скелеты слишком скучны! Кому охота получать поклонение от существ, которые даже не могут умолять о пощаде?"
 trait_gh_controller_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. [ROOT.GetCharacter.GetSheHe|U] предпочитает заставлять жалких смертных склоняться перед [ROOT.GetCharacter.GetHerHim], а не истреблять их. Поднятые скелеты слишком скучны! Какое удовольствие пытать существ, которые даже не способны умолять о милосердии?"

 trait_gh_imperious: "Властолюбивый"
 trait_gh_imperious_desc: "Посмертие было бы слишком тоскливым для этого лича, не держи он судьбы бесчисленных существ в своих руках. Будь то смертные, разумная нежить или другие личи — он заинтересован в покорении своих врагов куда больше, чем в их полном уничтожении."
 trait_gh_imperious_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. Одна мысль о том, что в мире всё ещё существуют царства, не поклоняющиеся [ROOT.GetCharacter.GetHerHim] как божеству, приводит [ROOT.GetCharacter.GetHerHim] в ярость. Покончить с этим вопиющим пренебрежением [ROOT.GetCharacter.GetHerHis] законной властью — первостепенная задача."

 trait_gh_logical: "Расчётливый"
 trait_gh_logical_desc: "Этот [Concept('liches','лич')|E] действует медленно и методично, предпочитая уничтожать врагов с помощью многолетних интриг и махинаций. В конце концов, в его распоряжении вечность."
 trait_gh_logical_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. [ROOT.GetCharacter.GetSheHe|U] действует медленно и методично, предпочитая уничтожать врагов с помощью многолетних интриг и махинаций. В конце концов, в [ROOT.GetCharacter.GetHerHis] распоряжении вечность."

 trait_gh_impulsive: "Импульсивный"
 trait_gh_impulsive_desc: "Этот [Concept('liches','лич')|E] предпочитает действовать, а не ждать. Вечность дарит другим терпение и дальновидность, но он считает, что уже прождал достаточно. После всего, что ему пришлось вынести и отдать ради законного могущества, он до сих пор не властвует над всем [Concept('aeras','Эрасом')|E], и каждый новый миг такого положения — тяжкое оскорбление."
 trait_gh_impulsive_character_desc: "Будучи [Concept('liches','личом')|E], [ROOT.GetCharacter.GetFirstNameNoTooltip] предпочитает действовать, а не ждать. Вечность дарит другим терпение и дальновидность, но [ROOT.GetCharacter.GetSheHe] считает, что уже [Select_CString(ROOT.GetCharacter.IsFemale, 'прождала', 'прождал' )] достаточно. После всего, что [ROOT.GetCharacter.GetHerHim] пришлось вынести и отдать ради законного могущества, [ROOT.GetCharacter.GetSheHe] до сих пор не властвует над всем [Concept('aeras','Эрасом')|E], и каждый новый миг такого положения — тяжкое оскорбление."

 trait_gh_perfectionist: "Перфекционист"
 trait_gh_perfectionist_desc: "Этот [Concept('liches','лич')|E] стремится к тому, чтобы его слуги и творения отражали искру его собственного величия, и предпочитает элиту своих армий бездумной ораве нежити."
 trait_gh_perfectionist_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. [ROOT.GetCharacter.GetSheHe|U] стремится к тому, чтобы [ROOT.GetCharacter.GetHerHis] слуги и творения отражали искру [ROOT.GetCharacter.GetHerHis] собственного величия, и предпочитает отборные войска бездумной орде нежити."

 trait_gh_pragmatic: "Прагматик"
 trait_gh_pragmatic_desc: "Этот [Concept('liches','лич')|E] уверен, что любые недостатки бездумных мертвецов в бою можно компенсировать их огромным числом."
 trait_gh_pragmatic_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. [ROOT.GetCharacter.GetSheHe|U] считает, что любые недостатки бездумных мертвецов в бою можно компенсировать их огромным числом."

 trait_gh_selfcentered: "Эгоцентричный"
 trait_gh_selfcentered_desc: "Этого [Concept('liches','лича')|E] мало волнуют жалкие создания за пределами его поля зрения. Будучи центром вселенной, он искренне верит, что весь мир вращается вокруг него."
 trait_gh_selfcentered_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E] и почти не замечает жалких созданий за пределами [ROOT.GetCharacter.GetHerHis] поля зрения. [ROOT.GetCharacter.GetSheHe|U] считает себя центром вселенной и не сомневается, что всё вращается вокруг [ROOT.GetCharacter.GetHerHim]."

 trait_gh_luxurious: "Сибарит"
 trait_gh_luxurious_desc: "Этот [Concept('liches','лич')|E] знает: жить посмертной жизнью нужно в роскоши и пышности. Как низшие создания поймут его величие, если не демонстрировать его с царским размахом?"
 trait_gh_luxurious_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E] и знает: посмертие следует проводить в роскоши и пышности. Как низшие создания оценят [ROOT.GetCharacter.GetHerHis] величие, если не выставлять его напоказ?"

 trait_gh_dour: "Хмурый"
 trait_gh_dour_desc: "Этот [Concept('liches','лич')|E], хоть и сохраняет свойственную его роду эксцентричность, куда более аскетичен, чем многие его собратья. Некоторые личи просто устают от пиров длиною в век — особенно когда из соседнего некрополя вечно доносится шум!"
 trait_gh_dour_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. Хотя [ROOT.GetCharacter.GetSheHe] сохраняет свойственную личам эксцентричность, [ROOT.GetCharacter.GetSheHe] куда аскетичнее многих собратьев. Некоторые личи просто устают от пиров длиною в век — особенно когда из соседнего некрополя вечно доносится шум!"

 trait_gh_hoarder: "Скупец"
 trait_gh_hoarder_desc: "Для этого [Concept('liches','лича')|E] накопление сокровищ, тайных знаний и артефактов — это не средство достижения цели, а сама цель."
 trait_gh_hoarder_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. Для [ROOT.GetCharacter.GetHerHim] накопление сокровищ, тайных знаний и артефактов — не средство достижения цели, а сама цель."

 trait_gh_cautious: "Осторожный"
 trait_gh_cautious_desc: "Этого [Concept('liches','лича')|E] редко увидишь без целой армии прислуги; он не подвергнет себя даже малейшей опасности без крайней нужды и крайне редко покидает свой некрополь."
 trait_gh_cautious_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. [ROOT.GetCharacter.GetSheHe|U] редко появляется без целой армии прислужников, не подвергает себя даже малейшей опасности без крайней нужды и почти не покидает свой некрополь."

 trait_gh_chaotic: "Хаотичный"
 trait_gh_chaotic_desc: "Порядок отвратителен для этого [Concept('liches','лича')|E], даже если он сам стоит у руля. Он упоён своей непредсказуемостью, сея хаос и смуту даже тогда, когда это вредит его собственным интересам."
 trait_gh_chaotic_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. Порядок отвратителен [ROOT.GetCharacter.GetHerHim], даже установленный под [ROOT.GetCharacter.GetHerHis] собственным началом. [ROOT.GetCharacter.GetSheHe|U] наслаждается собственной непредсказуемостью и сеет хаос даже во вред своим интересам."

 trait_gh_brazen: "Дерзкий"
 trait_gh_brazen_desc: "Воодушевлённый обретённым бессмертием, этот [Concept('liches','лич')|E] предпочитает лично рваться в самую гущу событий."
 trait_gh_brazen_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. Бессмертие придаёт [ROOT.GetCharacter.GetHerHim] смелости, и [ROOT.GetCharacter.GetSheHe] предпочитает лично бросаться в самую гущу событий."

 trait_gh_manipulator: "Манипулятор"
 trait_gh_manipulator_desc: "Сложная паутина интриг и обмана, окружающая этого [Concept('liches','лича')|E], плелась веками и охватывает целые континенты."
 trait_gh_manipulator_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('liches','лич')|E]. Сложная паутина интриг и обмана, окружающая [ROOT.GetCharacter.GetHerHim], плелась веками и охватывает целые континенты."

 trait_education_lich: "Лич"
 trait_education_lich_1: "Юный лич"
 trait_education_lich_1_desc: "Юный [Concept('liches','лич')|E] сделал лишь первые шаги к превращению в мерзкое поругание всех законов жизни и ещё не накопил тёмных знаний более древних и учёных собратьев. А возможно, искусство личества ему просто не даётся — хотя сам он никогда этого не признаёт."
 trait_education_lich_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сделала', 'сделал' )] лишь первые шаги к превращению в мерзкое поругание всех законов жизни и ещё не [Select_CString(ROOT.GetCharacter.IsFemale, 'накопила', 'накопил' )] тёмных знаний более древних и учёных [Concept('liches','личей')|E]. А возможно, искусство личества [ROOT.GetCharacter.GetHerHim] просто не даётся — хотя [ROOT.GetCharacter.GetSheHe] никогда этого не признаёт."

 trait_education_lich_2: "Посвящённый лич"
 trait_education_lich_2_desc: "Посвящённый [Concept('liches','лич')|E] всё ещё считается относительно слабым по сравнению со своими современниками — будь то из-за недавнего обращения или простой некомпетентности, хотя, слушая его пространные тирады, этого и не скажешь."
 trait_education_lich_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] всё ещё считается относительно [Select_CString(ROOT.GetCharacter.IsFemale, 'слабой', 'слабым' )] по сравнению с другими [Concept('liches','личами')|E] — то ли из-за недавнего обращения, то ли из-за некомпетентности. Впрочем, по [ROOT.GetCharacter.GetHerHis] пространным тирадам этого не скажешь."

 trait_education_lich_3: "Лич"
 trait_education_lich_3_desc: "Рядовой [Concept('liches','лич')|E], наделённый силами, способными сводить с ума, и нравом, который большинство назвали бы «крайне неприятным для общения»."
 trait_education_lich_3_character_desc: "Даже по меркам [Concept('liches','личей')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] считается вполне обычным представителем своего рода: [ROOT.GetCharacter.GetHerHis] силы способны сводить с ума, а нрав большинство назвали бы «крайне неприятным для окружающих»."

 trait_education_lich_4: "Могущественный лич"
 trait_education_lich_4_desc: "Благодаря возрасту или врождённой силе этот [Concept('liches','лич')|E] стал одним из грознейших представителей своего рода — страшным некромантом, способным сеять великое разрушение и проявлять поистине магический нарциссизм."
 trait_education_lich_4_character_desc: "Благодаря возрасту или врождённой силе [ROOT.GetCharacter.GetFirstNameNoTooltip] входит в число грознейших [Concept('liches','личей')|E] — страшных некромантов, способных сеять великое разрушение и проявлять поистине магический нарциссизм."

 trait_education_lich_5: "Старейший лич"
 trait_education_lich_5_desc: "Старейший [Concept('liches','лич')|E] — один из могущественнейших представителей своего тёмного рода. Неважно, достиг ли он таких ужасающих высот за долгие века противоестественного существования или благодаря чудовищной силе души: мало кто способен сравниться с ним в разрушении и многодневных тирадах, которым не мешают мелкие человеческие нужды вроде «дыхания» или «возможности дать другим высказаться». Обычно не помогает и то, что взгляды столь древних [Concept('liches','личей')|E] на современную культуру можно лишь снисходительно назвать «устаревшими»."
 trait_education_lich_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] входит в число могущественнейших представителей своего тёмного рода. Неважно, [Select_CString(ROOT.GetCharacter.IsFemale, 'достигла', 'достиг' )] ли [ROOT.GetCharacter.GetSheHe] таких ужасающих высот за долгие века противоестественного существования или благодаря чудовищной силе души: мало кто способен сравниться с [ROOT.GetCharacter.GetHerHim] в разрушении и многодневных тирадах, которым не мешают мелкие человеческие нужды вроде «дыхания» или «возможности дать другим высказаться». Обычно не помогает и то, что взгляды столь древних [Concept('liches','личей')|E] на современную культуру можно лишь снисходительно назвать «устаревшими»."
 
 trait_gh_cult_everlasting: "Культ вечности"
 trait_gh_cult_everlasting_desc: "Этот [Concept('liches','лич')|E] когда-то состоял в Культе вечности, или Kult Wiczośwoci на древнеойейницком. Это один из первых личей и ученик легендарного [Concept('vilas_venslau','Виласа Венслау')|E]. Чужеземцы считают его чудовищем за участие в ужасной [Concept('sorrowing_of_oejeynica','Скорби по Ойейнице')|E], но одновременно признают одним из самых опасных существ, когда-либо живших или продолжавших существовать после смерти. Член Культа вечности пользуется почти недостижимой для других личей привилегией — пусть неохотным, но уважением большинства собратьев."
 trait_gh_cult_everlasting_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] когда-то [Select_CString(ROOT.GetCharacter.IsFemale, 'состояла', 'состоял' )] в Культе вечности, или Kult Wiczośwoci на древнеойейницком. Это делает [ROOT.GetCharacter.GetHerHim] [Select_CString(ROOT.GetCharacter.IsFemale, 'одной', 'одним' )] из первых [Concept('liches','личей')|E] и [Select_CString(ROOT.GetCharacter.IsFemale, 'ученицей', 'учеником' )] легендарного [Concept('vilas_venslau','Виласа Венслау')|E]. Чужеземцы считают [ROOT.GetCharacter.GetHerHim] чудовищем за участие в ужасной [Concept('sorrowing_of_oejeynica','Скорби по Ойейнице')|E], но одновременно признают одним из самых опасных существ, когда-либо живших или продолжавших существовать после смерти. [ROOT.GetCharacter.GetSheHe|U] пользуется почти недостижимой для других личей привилегией — пусть неохотным, но уважением большинства собратьев."

 trait_gh_master_cult_everlasting: "Магистр Культа вечности"
 trait_gh_master_cult_everlasting_desc: "Этот [Concept('liches','лич')|E] когда-то возглавлял Культ вечности, или Kult Wiczośwoci на древнеойейницком. Поэтому он считается прародителем почти каждого [Concept('liches','лича')|E] на [Concept('the_continent','Континенте')|E]. Возможно, это самый могущественный лич в истории: даже печально известные своей злобой и вечными распрями личи [Concept('the_lichdoms','Личеств')|E] вынуждены уважать того, кто положил начало [Concept('sorrowing_of_oejeynica','Скорби по Ойейнице')|E]."
 trait_gh_master_cult_everlasting_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] когда-то [Select_CString(ROOT.GetCharacter.IsFemale, 'возглавляла', 'возглавлял' )] Культ вечности, или Kult Wiczośwoci на древнеойейницком. Поэтому [ROOT.GetCharacter.GetHerHim] считают прародителем почти каждого [Concept('liches','лича')|E] на [Concept('the_continent','Континенте')|E]. Возможно, это самый могущественный лич в истории: даже печально известные своей злобой и вечными распрями личи [Concept('the_lichdoms','Личеств')|E] вынуждены уважать [ROOT.GetCharacter.GetHerHim] за то, что именно [ROOT.GetCharacter.GetSheHe] [Select_CString(ROOT.GetCharacter.IsFemale, 'положила', 'положил' )] начало [Concept('sorrowing_of_oejeynica','Скорби по Ойейнице')|E]."

 trait_gh_arch_lich_1: "Архилич"
 trait_gh_arch_lich_1_desc: "Истинный [Concept('arch_lich','архилич')|E], этот [Concept('liches','лич')|E] совершил почти невозможное: временно подчинил достаточно соперников из [Concept('the_lichdoms','Личеств')|E], чтобы его признали верховным владыкой всех личей. Скорее всего, он повелевает огромным войском нежити, а среди его знати — кабала из сильнейших ныне существующих [Concept('magi','магов')|E]. Успеет ли он воспользоваться этой силой, прежде чем кто-нибудь из подчинённых совершит традиционное политическое убийство, ещё неизвестно..."
 trait_gh_arch_lich_1_character_desc: "Будучи [Concept('liches','личом')|E], [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'стала', 'стал' )] истинным [Concept('arch_lich','архиличем')|E] и [Select_CString(ROOT.GetCharacter.IsFemale, 'совершила', 'совершил' )] почти невозможное: [Select_CString(ROOT.GetCharacter.IsFemale, 'подчинила', 'подчинил' )] достаточно соперников из [Concept('the_lichdoms','Личеств')|E], чтобы добиться признания своей верховной власти над всеми личами. Скорее всего, [ROOT.GetCharacter.GetSheHe] повелевает огромным войском нежити, а среди [ROOT.GetCharacter.GetHerHis] знати — кабала из сильнейших ныне существующих [Concept('magi','магов')|E]. Успеет ли [ROOT.GetCharacter.GetSheHe] воспользоваться этой силой, прежде чем кто-нибудь из подчинённых совершит традиционное политическое убийство, ещё неизвестно..."

 trait_gh_disconnected: "Оторванный от мира"
 trait_gh_disconnected_desc: "Этот [Concept('liches','лич')|E] утратил связь с миром, судя по всему, потеряв способность управлять собственным телом."
 trait_gh_disconnected_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'утратила', 'утратил' )] связь с миром, судя по всему, потеряв способность управлять своим телом."

 trait_gh_debodied: "Лишённый тела"
 trait_gh_debodied_desc: "Тело этого [Concept('liches','лича')|E] уничтожено, и от него остался лишь череп. Скорее всего, он крайне зол из-за этого и из-за потери почти всей своей магии."
 trait_gh_debodied_character_desc: "Тело [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] уничтожено, и от [ROOT.GetCharacter.GetHerHim] остался лишь череп. Это и потеря почти всей магии наверняка приводят [ROOT.GetCharacter.GetHerHim] в ярость."

 trait_gh_overvain: "Одержимый тщеславием"
 trait_gh_overvain_desc: "Этот [Concept('liches','лич')|E] пал жертвой тщеславия — особого вида безумия, присущего нежити. Не получив ответа на претензии на владычество над вселенной и не найдя ничего нового в вечном существовании, он сошёл с ума от самовлюблённости и теперь бесконечно пыжится, уничтожая сам себя в попытках «украсить» свой облик."
 trait_gh_overvain_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'пала', 'пал' )] жертвой тщеславия — особого вида безумия, присущего [Concept('liches','личам')|E]. Не получив ответа на претензии на владычество над вселенной и не найдя ничего нового в вечном существовании, [ROOT.GetCharacter.GetSheHe] [Select_CString(ROOT.GetCharacter.IsFemale, 'сошла', 'сошёл' )] с ума от самовлюблённости и теперь бесконечно пытается превзойти [Select_CString(ROOT.GetCharacter.IsFemale, 'саму себя', 'самого себя' )], уничтожая своё тело в попытках «украсить» свой облик."

 trait_gh_soulshadowed: "Омрачённый душой"
 trait_gh_soulshadowed_desc: "«Омрачение души» — вежливое выражение, которым [Concept('liches','личи')|E] называют распад разума нежити. Поражённые этим недугом некроманты всё сильнее отдаляются от мира, теряют интерес к происходящему, с трудом понимают речь и часто словно теряются в странных грёзах, видениях или кошмарах. Точная причина неизвестна: давняя душевная травма, магическое повреждение связывающих чар или неизбежное следствие существования лича. Последняя возможность страшит их сильнее всего, и многие веками отчаянно ищут способ отсрочить безумие."
 trait_gh_soulshadowed_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] страдает омрачением души — так [Concept('liches','личи')|E] вежливо называют распад разума нежити. [ROOT.GetCharacter.GetSheHe|U] всё сильнее отдаляется от мира, теряет интерес к происходящему, с трудом понимает речь и часто словно теряется в странных грёзах, видениях или кошмарах. Точная причина неизвестна: давняя душевная травма, магическое повреждение связывающих чар или неизбежное следствие существования лича. Последняя возможность страшит их сильнее всего, и многие веками отчаянно ищут способ отсрочить безумие."

 trait_gh_legon: "Легон"
 gh_legon_neutral: "Легон"
 gh_legon_male: "Легон"
 gh_legon_female: "Легона"
 trait_gh_legon_character_desc: "Благодаря интригам, праву рождения или личным заслугам [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'признана', 'признан' )] командующим [Concept('aversaria','аверсарианским')|E] легионом."
 trait_gh_legon_desc: "Благодаря интригам, праву рождения или личным заслугам этот персонаж признан командующим [Concept('aversaria','аверсарианским')|E] легионом."

 trait_gh_arch_legon: "Архилегон"
 gh_arch_legon_neutral: "Архилегон"
 gh_arch_legon_male: "Архилегон"
 gh_arch_legon_female: "Архилегона"
 trait_gh_arch_legon_desc: "Этот персонаж, заслуженно или нет, достиг высшего военного чина в [Concept('aversaria','Аверсарии')|E] и получил право командовать целой армией аверсарианских легионов и править от имени аавтократа."
 trait_gh_arch_legon_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], заслуженно или нет, [Select_CString(ROOT.GetCharacter.IsFemale, 'достигла', 'достиг' )] высшего военного чина в [Concept('aversaria','Аверсарии')|E] и [Select_CString(ROOT.GetCharacter.IsFemale, 'получила', 'получил' )] право командовать целой армией аверсарианских легионов и править от имени аавтократа."

 trait_gh_gedeora_victim: "Жертва гедеоры"
 trait_gh_gedeora_victim_desc: "Разум этого персонажа был изменён [Concept('gedeora','гедеорой')|E]. Даже если он не понимает, что именно стало иначе, что-то в глубине сознания кричит: всё очень плохо..."
 trait_gh_gedeora_victim_character_desc: "Разум [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] был изменён [Concept('gedeora','гедеорой')|E]. Даже если [ROOT.GetCharacter.GetSheHe] не понимает, что именно стало иначе, что-то в глубине [ROOT.GetCharacter.GetHerHis] сознания кричит: всё очень плохо..."

 trait_gh_odrstund_victim: "Жертва [Concept('odrstund','Одрстунда')|E]"
 trait_gh_odrstund_victim_desc: "Разум этого персонажа был искажён [Concept('odrstund','Одрстундом')|E] — самой страшной [Concept('gedeora','гедеорой')|E] в истории [Concept('aversaria','Аверсарии')|E]. Жажда крови довела его почти до безумия, и теперь он вызывает в равной мере жалость, страх и отвращение."
 trait_gh_odrstund_victim_character_desc: "Разум [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] был искажён [Concept('odrstund','Одрстундом')|E] — самой страшной [Concept('gedeora','гедеорой')|E] в истории [Concept('aversaria','Аверсарии')|E]. Жажда крови довела [ROOT.GetCharacter.GetHerHim] почти до безумия, и теперь [ROOT.GetCharacter.GetSheHe] вызывает в равной мере жалость, страх и отвращение."

 trait_fools_curse: "Проклятие дураков"
 trait_fools_curse_desc: "Этот персонаж поражён проклятием [Concept('fools_coast_biozone','Берега дураков')|E]: его плоть превращается в сплав металлов, а внутренности разрываются на части."
 trait_fools_curse_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'поражена', 'поражён' )] [Concept('fools_curse','проклятием дураков')|E]: [ROOT.GetCharacter.GetHerHis] плоть превращается в сплав металлов, а внутренности разрываются на части."

 trait_shade_stricken: "Поражённый тенью"
 trait_shade_stricken_desc: "Этот персонаж стал жертвой губительной силы теней — злобных духов, способных накрыть землю мраком. Его тело разрушается изнутри."
 trait_shade_stricken_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'стала', 'стал' )] жертвой губительной силы теней — злобных духов, способных накрыть землю мраком. [ROOT.GetCharacter.GetHerHis|U] тело разрушается изнутри."

 trait_magic_court: "Магический придворный"
 trait_magic_court_1: "Магический придворный"
 trait_magic_court_1_desc: "Этот персонаж провёл не менее [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] лет при просвещённом дворе — [GetCourtType('court_magic').GetName], среди проницательных [Concept('magi','магов')|E] и учёных."
 trait_magic_court_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'провела', 'провёл' )] не менее [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] лет при просвещённом дворе — [GetCourtType('court_magic').GetName], среди проницательных [Concept('magi','магов')|E] и учёных."

 trait_magic_court_2: "Ценный магический придворный"
 trait_magic_court_2_desc: "Этот персонаж провёл не менее [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] лет при просвещённом дворе — [GetCourtType('court_magic').GetName], среди проницательных [Concept('magi','магов')|E] и учёных."
 trait_magic_court_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'провела', 'провёл' )] не менее [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] лет при просвещённом дворе — [GetCourtType('court_magic').GetName], среди проницательных [Concept('magi','магов')|E] и учёных."

 trait_gh_magic_debug: "Маг-гепард"
 trait_gh_magic_debug_desc: "Этот персонаж — маг, используемый для отладки. #BOL Вы#, скорее всего, читерите. Фу таким быть!"
 trait_gh_magic_debug_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — маг, используемый для отладки. #BOL Вы#!, скорее всего, читерите. Фу таким быть!"

 trait_gh_griffon_trait: "Грифон"
 trait_gh_griffon_trait_desc: "Это [Concept('griffons','грифон')|E] — одно из [Concept('godtouched_creatures','затронутых богами существ')|E], обитающих в [chevalie|E]. Грифоны высоко ценятся как верховые животные, но встречаются редко и в основном принадлежат королевским особам."
 trait_gh_griffon_trait_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('griffons','грифон')|E], одно из [Concept('godtouched_creatures','затронутых богами существ')|E], обитающих в [chevalie|E]. Грифоны высоко ценятся как верховые животные, но встречаются редко и в основном принадлежат королевским особам."

