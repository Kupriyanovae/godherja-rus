l_russian:

 trait_hunter_4: "Опытный охотник"
 trait_hunter_4_desc: "Опытный охотник — настоящая гроза диких земель."
 trait_hunter_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — настоящее бедствие для диких земель."
 
 trait_hunter_5: "Легендарный охотник"
 trait_hunter_5_desc: "Легендарный охотник предается охоте так же естественно, как дышит."
 trait_hunter_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'предается', 'предается' )] охоте так же естественно, как дышит."
 
 trait_beasthunter_1: "Новичок-чудовищеборец"
 trait_beasthunter_1_desc: "Этот персонаж — лишь новичок в искусстве охоты на самых опасных тварей."
 trait_beasthunter_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — лишь новичок в искусстве охоты на самых опасных тварей."
 
 trait_beasthunter_2: "Чудовищеборец"
 trait_beasthunter_2_desc: "Этот персонаж доказал свое умение выслеживать и разить диковинных и опасных тварей. А порой — и тех, и других одновременно."
 trait_beasthunter_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'доказала', 'доказал' )] свое умение выслеживать и разить диковинных и опасных тварей. А порой — и тех, и других одновременно."
 
 trait_beasthunter_3: "Ветеран-чудовищеборец"
 trait_beasthunter_3_desc: "Этот персонаж слывет признанным мастером охоты на всякую опасную и чудовищную тварь. Вид этого охотника на тропе внушает истинный трепет."
 trait_beasthunter_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'известна', 'известен' )] как настоящий мастер охоты на всякую опасную и чудовищную тварь. Вид этого охотника на тропе внушает истинный трепет."
 
 trait_beasthunter_4: "Легендарный чудовищеборец"
 trait_beasthunter_4_desc: "Охотничьи подвиги этого персонажа стали легендой, и даже самые могучие чудовища в страхе трепещут перед днём, когда он ступит в их логовище."
 trait_beasthunter_4_character_desc: "Охотничьи подвиги [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] стали легендой, и даже самые могучие чудовища в страхе трепещут перед днём, когда охотник ступит в их логовище."

 trait_gh_falconer: "Сокольник"
 trait_gh_falconer_desc: "Этот персонаж искусен в обучении ловчих птиц для охоты на диких зверей."
 trait_gh_falconer_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'искусна', 'искусен' )] в обучении ловчих птиц для охоты на диких зверей."

 trait_specialized_beasthunter: "Охотник на [SelectLocalization('(bool)no','',Concatenate(ROOT.GetCharacter.MakeScope.Var('game_gain_expert_proficiency_var').GetFlagName,'_name'))]"
 trait_beasthunter_1_specialized_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — лишь новичок в искусстве охоты на самых опасных тварей, но уже [Select_CString(ROOT.GetCharacter.IsFemale, 'проявила', 'проявил' )] особую склонность к охоте на [SelectLocalization('(bool)no','',Concatenate(ROOT.GetCharacter.MakeScope.Var('game_gain_expert_proficiency_var').GetFlagName,'_name'))]."
 trait_beasthunter_2_specialized_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'доказала', 'доказал' )] свое умение выслеживать диковинных и опасных тварей, навострившись охотиться именно на [SelectLocalization('(bool)no','',Concatenate(ROOT.GetCharacter.MakeScope.Var('game_gain_expert_proficiency_var').GetFlagName,'_name'))]."
 trait_beasthunter_3_specialized_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'известна', 'известен' )] как настоящий мастер охоты на всякую опасную и чудовищную тварь. Вид этого охотника на тропе внушает трепет — особенно когда добычей выступает [SelectLocalization('(bool)no','',Concatenate(ROOT.GetCharacter.MakeScope.Var('game_gain_expert_proficiency_var').GetFlagName,'_name'))]"
 trait_beasthunter_4_specialized_desc: "Охотничьи подвиги [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] стали легендой, и даже самые могучие чудовища в страхе трепещут перед днём, когда охотник ступит в их логовище — и [SelectLocalization('(bool)no','',Concatenate(ROOT.GetCharacter.MakeScope.Var('game_gain_expert_proficiency_var').GetFlagName,'_name'))] страшатся этого сильнее прочих."

 TRAIT_FLAG_DESC_can_hunt_low_level_monsters: "Разрешает отправляться в [Concept('monster_hunt','Охоту на чудовищ')|E] против #E слабых монстров#!"
 TRAIT_FLAG_DESC_can_hunt_medium_level_monsters: "Разрешает отправляться в [Concept('monster_hunt','Охоту на чудовищ')|E] против #E опасных монстров#!"
 TRAIT_FLAG_DESC_can_hunt_high_level_monsters: "Разрешает отправляться в [Concept('monster_hunt','Охоту на чудовищ')|E] против #E смертоносных монстров#!"

 trait_education_dead_magic: "[dead_magic|E]"
 trait_education_dead_magic_latent: "Скрытая [Concept('dead_magic', 'мёртвая магия')|E]"
 trait_education_dead_magic_latent_desc: "Персонаж со скрытой [Concept('dead_magic', 'мёртвой магией')|E] совершенно не способен чаровать, однако эта сила затаилась в самых глубинах его духа."
 trait_education_dead_magic_latent_character_desc: "В [ROOT.GetCharacter.GetFirstNameNoTooltip] таится [dead_magic|E], но [ROOT.GetCharacter.GetSheHe] не [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] использовать какую-либо [Concept('dead_magic', 'мёртвую магию')|E]."
 trait_education_dead_magic_1: "Ученик [Concept('dead_magic', 'мёртвой магии')|E]"
 trait_education_dead_magic_1_desc: "Ученик, постигающий [dead_magic|E], глубоко изучил движение светила [Concept('aervalr','Эрвала')|E], однако владение этой силой дается ему с трудом, а познания в искусстве [Concept('dead_magi','магов земли')|E] пока скудны."
 trait_education_dead_magic_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'изучила', 'изучил' )] движение светила [Concept('aervalr','Эрвала')|E] весьма подробно, но повелевать его силами [ROOT.GetCharacter.GetHerHim] всё ещё трудно, а умения как [Concept('dead_magi','мага земли')|E] весьма скромны."
 trait_education_dead_magic_2: "Адепт [Concept('dead_magic', 'мёртвой магии')|E]"
 trait_education_dead_magic_2_desc: "Ход [Concept('aervalr','Эрвала')|E] хорошо ведом адепту школы [Concept('dead_magic', 'мёртвой магии')|E]: настоящий [Concept('dead_magi','маг земли')|E] умеет обращать фазы угасающей луны себе на грозную пользу."
 trait_education_dead_magic_2_character_desc: "Циклы светила [Concept('aervalr','Эрвала')|E] хорошо известны [ROOT.GetCharacter.GetFirstNameNoTooltip], [Select_CString(ROOT.GetCharacter.IsFemale, 'которая', 'который' )] умеет обращать фазы угасающей луны к [ROOT.GetCharacter.GetHerHis] грозной выгоде как истинный [Concept('dead_magi','маг земли')|E]."
 trait_education_dead_magic_3: "Знаток [Concept('dead_magic', 'мёртвой магии')|E]"
 trait_education_dead_magic_3_desc: "Искусный знаток мистических искусств [Concept('dead_magic', 'мёртвой магии')|E] овладел редким мастерством, которое многие сочли бы неестественным, и способен разить врагов безотносительно фазы угасающей луны. Лишь немногие [Concept('dead_magi','маги земли')|E] способны достичь подобного уровня."
 trait_education_dead_magic_3_character_desc: "Опытный знаток чародейских искусств [Concept('dead_magic', 'мёртвой магии')|E], [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'овладела', 'овладел' )] редким мастерством, которое многие сочли бы неестественным. [ROOT.GetCharacter.GetSheHe|U] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] сокрушать [ROOT.GetCharacter.GetHerHis] врагов вне зависимости от фазы угасающей луны. Лишь немногие [Concept('dead_magi','маги земли')|E] поднимались до таких высот."
 trait_education_dead_magic_4: "Магистр [Concept('dead_magic', 'мёртвой магии')|E]"
 trait_education_dead_magic_4_desc: "Этот персонаж — легендарный [Concept('dead_magi','маг земли')|E]. Само его присутствие внушает трепет и тревогу окружающим, заставляя волосы вставать дыбом от ощутимой мощи и опасности, исходящих от его тела."
 trait_education_dead_magic_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — легендарный [Concept('dead_magi','маг земли')|E]. [ROOT.GetCharacter.GetHerHis|U] присутствие внушает трепет окружающим, а волоски на коже встают дыбом, стоит находящимся рядом подсознательно ощутить чистую силу и опасность, исходящие от [ROOT.GetCharacter.GetHerHim]."

 trait_education_mixed_magic: "[mixed_magic|E]"
 trait_education_mixed_magic_latent: "Скрытая [Concept('mixed_magic', 'смешанная магия')|E]"
 trait_education_mixed_magic_latent_desc: "Персонаж со скрытой [Concept('mixed_magic', 'смешанной магией')|E] совершенно не способен чаровать, однако эта сила затаилась в самых глубинах его духа."
 trait_education_mixed_magic_latent_character_desc: "В [ROOT.GetCharacter.GetFirstNameNoTooltip] таится [Concept('mixed_magic', 'смешанная магия')|E], но [ROOT.GetCharacter.GetSheHe] не [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] использовать какую-либо [Concept('mixed_magic', 'смешанную магию')|E]."
 trait_education_mixed_magic_1: "Ученик [Concept('mixed_magic', 'смешанной магии')|E]"
 trait_education_mixed_magic_1_desc: "Ученик, постигающий [Concept('mixed_magic', 'смешанная магия')|E], уже развил чародейские навыки, казалось бы, неестественные и пугающие для его собратьев, лишенных санов [Concept('mixed_magi','смешанных магов')|E], однако пока плохо контролирует эту силу."
 trait_education_mixed_magic_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'развила', 'развил' )] в себе чародейские навыки, казалось бы, неестественные и пугающие для [ROOT.GetCharacter.GetHerHis] собратьев, лишенных санов [Concept('mixed_magi','смешанных магов')|E], но пока выказывает мало власти над этой силой."
 trait_education_mixed_magic_2: "Адепт [Concept('mixed_magic', 'смешанной магии')|E]"
 trait_education_mixed_magic_2_desc: "По мере того как растят познания адепта в [Concept('mixed_magic', 'смешанной магии')|E], глаза его блекнут, а зверьё начинает чуждаться его. Люди постепенно перенимают страх животных и стараются обходить чародея стороной, опасаясь сил, коими владеют [Concept('mixed_magi','смешанные маги')|E]."
 trait_education_mixed_magic_2_character_desc: "По мере того как познания, коими обладает [ROOT.GetCharacter.GetFirstNameNoTooltip] в области [Concept('mixed_magic', 'смешанной магии')|E], растут, [ROOT.GetCharacter.GetHerHis] глаза блекнут, а звери начинают чуждаться [ROOT.GetCharacter.GetHerHim]. Люди же начинают обходить [ROOT.GetCharacter.GetHerHim] стороной, страшась сил, коими повелевает этот [Concept('mixed_magi','смешанный маг')|E]."
 trait_education_mixed_magic_3: "Знаток [Concept('mixed_magic', 'смешанной магии')|E]"
 trait_education_mixed_magic_3_desc: "Тени вокруг того, кто искушен в [Concept('mixed_magic', 'смешанной магии')|E], сгущаются и мерцают, стоит ему пройти мимо, а когда он говорит, окружающие готовы поклясться, что тени шепчут вместе с ним. Лишь немногие из [Concept('mixed_magi','смешанных магов')|E] достигают этого уровня, и всякого из них объемлет страх людской."
 trait_education_mixed_magic_3_character_desc: "Тени вокруг [ROOT.GetCharacter.GetFirstNameNoTooltip] мерцают и сгущаются, стоит [ROOT.GetCharacter.GetHerHim] пройти мимо, а когда [ROOT.GetCharacter.GetSheHe] говорит, окружающие готов поклясться, что тени шепчут вглубь [ROOT.GetCharacter.GetHerHis] речей, пока почти белые глаза чародея устремлены на невидимое. Лишь немногие [Concept('mixed_magi','смешанные маги')|E] достигают этой ступени, и всякого из них настигает людской страх."
 trait_education_mixed_magic_4: "Магистр [Concept('mixed_magic', 'смешанной магии')|E]"
 trait_education_mixed_magic_4_desc: "Взойдя на сан истинного магистра [Concept('mixed_magi','смешанного мага')|E], [ROOT.GetCharacter.GetFirstNameNoTooltip] давно утрачивает былую пигментацию глаз, однако взгляд чародея все так же прикован к невидимым безднам. Вокруг распространяется аура ужаса, пока свет и цвета вокруг подрагивающей фигуры искажаются. Хотя искусство [Concept('mixed_magic', 'смешанной магии')|E] почти неведомо миру, никто не посмеет отрицать, что мастерство превратило [ROOT.GetCharacter.GetFirstNameNoTooltip] во что-то... иное."
 trait_education_mixed_magic_4_character_desc: "Взойдя на сан истинного магистра [Concept('mixed_magi','смешанного мага')|E], [ROOT.GetCharacter.GetFirstNameNoTooltip] давно [Select_CString(ROOT.GetCharacter.IsFemale, 'утратила', 'утратил' )] былую пигментацию глаз, однако взгляд всё так же прикован к невидимым безднам. Вокруг [ROOT.GetCharacter.GetHerHim] веет аура ужаса, а свет и цвета искажаются вокруг подрагивающего тела. Хотя искусство [Concept('mixed_magic', 'смешанной магии')|E] почти неведомо миру, никто не посмеет отрицать, что мастерство превратило [ROOT.GetCharacter.GetFirstNameNoTooltip] во что-то... иное."

 ethereal_necromancy: "Бестелесная некромантия"
 trait_ethereal_necromancy: "Бестелесная некромантия"
 trait_ethereal_necromancy_desc: "Этот [Concept('magi','маг')|E] обладает даром взывать к духам, подчинять их своей воле и посылать на исполнение повелений. Будь то слежка за врагами или их прямое убийство — духи беспрекословно повинуются воле этого [Concept('magi','маг')|E]."
 trait_ethereal_necromancy_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] взывать к духам, подчинять их своей воле и посылать исполнять повеления. Будь то слежка за врагами или их прямое убийство — духи беспрекословно повинуются повелениям, коими велел наделить их [ROOT.GetCharacter.GetFirstNameNoTooltip]."

 trait_pryonism: "Прионизм"
 trait_pryonism_desc: "Этот [Concept('magi','маг')|E] обладает даром читать чужие мысли, а также влиять на чужие помыслы и сновидения."
 trait_pryonism_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] читать чужие мысли и влиять на разумы и сны других людей."

 trait_education_anti_magic: "[antimagic|E]"
 trait_education_anti_magic_1: "Ученик [Concept('antimagic', 'антимагии')|E]"
 trait_education_anti_magic_1_desc: "Ученик [Concept('antimagic', 'антимагии')|E] освоил лишь базовые навыки, необходимые для отражения чар или противостояния их силам. Его шансы велики лишь против самых слабых проявлений чародейства."
 trait_education_anti_magic_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] владеет лишь базовыми навыками для противостояния волшебным силам. Увы, [ROOT.GetCharacter.GetSheHe] долго не продержится против хоть сколько-нибудь грозных чар."
 trait_education_anti_magic_2: "Адепт [Concept('antimagic', 'антимагии')|E]"
 trait_education_anti_magic_2_desc: "Адепт [Concept('antimagic', 'антимагии')|E] вполне способен справиться с обыденными и, возможно, даже с некоторыми редкими проявлениями магии в этом мире."
 trait_education_anti_magic_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] вполне [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] одолеть большинство чародеев, с которыми простой смертный может столкнуться за свою жизнь."
 trait_education_anti_magic_3: "Знаток [Concept('antimagic', 'антимагии')|E]"
 trait_education_anti_magic_3_desc: "Знатоки [Concept('antimagic', 'антимагии')|E] состоят в рядах элиты борцов с чародейством. Когда редчайшие формы магии угрожают миру, именно знатоков призывают на защиту смертных."
 trait_education_anti_magic_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'готова', 'готов' )] встретить даже самые жуткие чары, если те будут угрожать стране или всему миру. Пусть эти силы и редки, [ROOT.GetCharacter.GetFirstNameNoTooltip] встретит их во всеоружии." 
 trait_education_anti_magic_4: "Магистр [Concept('antimagic', 'антимагии')|E]"
 trait_education_anti_magic_4_desc: "[magi|E], монстры и прочие магия заставляют содрогаться чародеев и существ, стоит магистру [Concept('antimagic', 'антимагии')|E] появиться поблизости. Магистр способен положить конец даже самым могущественным проявлениям чар, и мало кто дерзнет встать у него на пути."
 trait_education_anti_magic_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] не страшится чародейства — скорее сами чары трепещут перед [ROOT.GetCharacter.GetHerHim], ибо [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] развеять их единым ударом."

 trait_education_arcana: "[arcana|E]"
 trait_education_arcana_1: "Ученик-арканист"
 trait_education_arcana_1_desc: "Новичок в постижении [Concept('arcana', 'арканы')|E], обладающий лишь самым поверхностным пониманием фундаментальных сил мироздания."
 trait_education_arcana_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] имеет лишь самое базовое представление о фундаментальных силах, окружающих мир."
 trait_education_arcana_2: "Робкий экспериментатор"
 trait_education_arcana_2_desc: "Робкий экспериментатор уже начал выходить за рамки старых фолиантов, но ему все еще предстоит пройти долгий путь."
 trait_education_arcana_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'начала', 'начал' )] выходить за пределы пыльных фолиантов, но путь познания еще весьма долог."
 trait_education_arcana_3: "Наблюдательный эзотерик"
 trait_education_arcana_3_desc: "Наблюдательный эзотерик изучил древние гримуары и проявил глубокое понимание тайн [Concept('arcana','арканы')|E]."
 trait_education_arcana_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'изучила', 'изучил' )] древние гримуары и [Select_CString(ROOT.GetCharacter.IsFemale, 'проявила', 'проявил' )] немалое понимание [Concept('arcana','арканы')|E]."
 trait_education_arcana_4: "Искусный арканософ"
 trait_education_arcana_4_desc: "Искусный арканософ — признанный эксперт во всем, что касается [Concept('arcana','тайных знаний')|E] и потусторонних сил."
 trait_education_arcana_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — признанный знаток во всех вопросах, касающихся [Concept('arcana','арканы')|E] или сверхъестественного."
 trait_education_arcana_5: "Эрудированный тауматург"
 trait_education_arcana_5_desc: "Эрудированный тауматург вобрал в себя всю мудрость цивилизаций в области [Concept('arcana', 'арканы')|E] и хранит секреты, которые некогда считались утерянными."
 trait_education_arcana_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] владеет полнотой знании древних в области [Concept('arcana', 'арканы')|E] и хранит тайны, казалось, навеки утраченные."

 trait_gh_arcanist: "Арканист"
 trait_gh_arcanist_desc: "Этот персонаж проявил великое мастерство как в исследовании тайн [Concept('magic', 'магии')|E], так и в опытах за пределами ведомого мира."
 trait_gh_arcanist_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] обладает великим искусством постижения тайн, коими наделена [Concept('magic','магия')|E], и проникает взором за пределы познанного мира."

 trait_gh_transmuturgist: "Трансмутург"
 trait_gh_transmuturgist_desc: "Этот персонаж настроился на потоки тайных сил и способен проводить сложные ритуалы, недоступные большинству обычных [Concept('magi','магов')|E]."
 trait_gh_transmuturgist_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'настроилась', 'настроился' )] на потоки тайных сил и [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] verшить ритуалы, превосходящие разумение большинства [Concept('magi','магов')|E]."

 trait_gh_sage: "Мудрец"
 trait_gh_sage_desc: "Этот персонаж способен проникать в глубины сокрытых миров [Concept('aeras', 'Эраса')|E], храня ответы на тайные загадки бытия."
 trait_gh_sage_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] проникать в самые сокровенные тайны [Concept('aeras', 'Эраса')|E], храня ответы на вечные загадки бытия."

 trait_marine_commander: "Морской командир"
 trait_marine_commander_desc: "Этот персонаж чувствует себя как дома среди [Concept('shatteredisles', 'Расколотых островов')|E] и эффективно использует особенности местности в бою."
 trait_marine_commander_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] чувствует себя как дома на просторах [Concept('shatteredisles', 'Расколотых островов')|E] и мастерски использует местность в бою."

 trait_blackspawn: "Чернорождённый"
 trait_gh_blackspawn_1: "Посвященный Чернорождённых"
 trait_gh_blackspawn_1_desc: "Этот персонаж поражен начальной стадией [Concept('shadesoul_curse', 'проклятия Теневой души')|E]: он обрел бессмертие, но пока не обременен иными силами и недугами. Хотя облик персонажа остаётся обычным, вокруг него витает необъяснимая тревога, а ночные кошмары иной раз побуждают его к действию..."
 trait_gh_blackspawn_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'поражена', 'поражен' )] начальной стадией [Concept('shadesoul_curse', 'проклятия Теневой души')|E]: бессмертие уже в [ROOT.GetCharacter.GetHerHis] руках, но иные болезни скверны ещё не проявились. Внешне [ROOT.GetCharacter.GetSheHe] [Select_CString(ROOT.GetCharacter.IsFemale, 'неизменна', 'неизменен' )], но вокруг ощущается тревога, и зловещие сны ведут [ROOT.GetCharacter.GetHerHim] к действию..."
 trait_gh_blackspawn_2: "Адепт Чернорождённых"
 trait_gh_blackspawn_2_desc: "Скрывать поражение [Concept('shadesoul_curse', 'проклятием Теневой души')|E] становится всё сложнее. Кожа персонажа давно утратила краску, а аура вокруг него дышит злобой. Даруемые силы возросли, но цена велика — устоять перед пророческими кошмарами почти невозможно."
 trait_gh_blackspawn_2_character_desc: "Следы [Concept('shadesoul_curse', 'проклятия Теневой души')|E] на [ROOT.GetCharacter.GetFirstNameNoTooltip] всё труднее утаить. Кожа давно блекнет, а вокруг висит злобный дух. Дары скверны сильны, но плата за них неизбежна — устоять перед зовом кошмаров [ROOT.GetCharacter.GetHerHim] почти невозможно."
 trait_gh_blackspawn_3: "Призыватель Чернорождённых"
 trait_gh_blackspawn_3_desc: "Этот персонаж пребывает на поздних стадиях [Concept('shadesoul_curse', 'проклятия Теневой души')|E] — рубеж, до которого мало кто доживает, невзирая на бессмертие. Персонаж лишился человеческой биологии и даже сна — видения шепчут ему наяву. Мощь его велика, но и муки страшны: солнечный свет причиняет ему жгучую боль."
 trait_gh_blackspawn_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'достигла', 'достиг' )] глубоких стадий [Concept('shadesoul_curse', 'проклятия Теневой души')|E]. [ROOT.GetCharacter.GetSheHe|U] [Select_CString(ROOT.GetCharacter.IsFemale, 'утратила', 'утратил' )] человеческое естество и способность спать — сны шепчут [ROOT.GetCharacter.GetHerHim] прямо наяву. [ROOT.GetCharacter.GetHerHis|U] сила велика, но и расплата за неё страшна — яркое солнце теперь приносит невыносимые ожоги."
 trait_gh_blackspawn_4: "Вестник Чернорождённых"
 trait_gh_blackspawn_4_desc: "Этот персонаж превратился в нечто воистину ужасающее — редчайший пример крайних стадий [Concept('shadesoul_curse', 'проклятия Теневой души')|E]. Навеки изгнанный в тьму губительным солнечным светом, он тем не менее неустанно плетет свои зловещие козни."
 trait_gh_blackspawn_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'превратилась', 'превратился' )] в нечто воистину ужасающее — редчайший пример высшего проявления [Concept('shadesoul_curse', 'проклятия Теневой души')|E]. [Select_CString(ROOT.GetCharacter.IsFemale, 'Заточенная', 'Заточенный' )] во тьме из-за смертоносного солнца, [ROOT.GetCharacter.GetSheHe] неустанно продолжат плести свои тёмные замыслы."
 trait_gh_blackspawn_5: "Абиссалист Чернорождённых"
 trait_gh_blackspawn_5_desc: "Существо бездонного зла и невероятного могущества, питающее ужасающие замыслы относительно судьбы мира. Если и есть слово, описывающее то, во что [Concept('shadesoul_curse', 'проклятие Теневой души')|E] превратило этого персонажа, то «демон» подходит лучше всего."
 trait_gh_blackspawn_5_character_desc: "Порождение бездонного зла и невероятной силы. Если и можно описать то, во что [Concept('shadesoul_curse', 'проклятие Теневой души')|E] превратило [ROOT.GetCharacter.GetFirstNameNoTooltip], то слово «демон» подойдёт лучше всего."


