 trait_gh_the_last_nikaryin: "Последний никарин"
 trait_gh_the_last_nikaryin_desc: "Последний никарин, приветствуемый Богами, — последний пережиток древнего мира. Никарины были командирами гвардии Эрсодиакса, его самыми верными и преданными слугами, сохранявшими верность своего владыке даже тогда, когда предатели отвернулись от него и сразили его в великом конфликте прошлого, еще до того, как дерзнули поднять руку на самих Богов.\n\nНо времена меняются, и племена должны объединиться, чтобы прибрать к рукам владения, которыми когда-то правил Аэрсодиакс. Теперь, когда его верные дети сформировали собственную великую Империю, пытающуюся воссоздать образ прошлого, никарину пора сложить с себя полномочия военачальника и открыть новую эпоху в качестве Императора. Как последний никарин, этот правитель оформил этот переход и провозгласил создание новой великой империи во славу Эрсодиакса."
 trait_gh_the_last_nikaryin_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — Последний никарин, приветствуемый Богами и являющийся последним пережитком древнего мира. Никарины были командирами гвардии Эрсодиакса, его самыми верными и преданными слугами, сохранявшими верность своего владыке даже тогда, когда предатели отвернулись от него и сразили его в великом конфликте прошлого, еще до того, как дерзнули поднять руку на самих Богов.\n\nНо времена меняются, и племена должны объединиться, чтобы прибрать к рукам владения, которыми когда-то правил Аэрсодиакс. Теперь, когда его верные дети сформировали собственную великую Империю, пытающуюся воссоздать образ прошлого, никарину пора сложить с себя полномочия военачальника и открыть новую эпоху в качестве Императора. Как последний никарин, [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'оформила', 'оформил' )] этот переход и [Select_CString(ROOT.GetCharacter.IsFemale, 'провозгласила', 'провозгласил' )] создание новой великой империи во славу Эрсодиакса."

 trait_gh_axiaothea_reborn: "Возрожденная Аксиотея"
 trait_gh_axiaothea_reborn_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip], возрожденная Аксиотея, [Select_CString(ROOT.GetCharacter.IsFemale, 'исцелила', 'исцелил' )] расколотую Империю и теперь наконец восседает на своем законном престоле. Да будет [ROOT.GetCharacter.GetHerHis] правление вечным!"

 trait_gh_aeschraes_killer: "Палач Эшрея"
 trait_gh_aeschraes_killer_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — тот, кто пленил Расколоть мира, Владыку Пепла — самого Эшрея. И от одного взмаха [ROOT.GetCharacter.GetHerHis] клинка могущественный маг затих навсегда."
 trait_gh_aeschraes_killer_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — тот, кто пленил Расколоть мира, Владыку Пепла — самого Эшрея. И от одного взмаха [ROOT.GetCharacter.GetHerHis] клинка могущественный маг затих навсегда."

 trait_adabyss_invasion_leader: "Лельманд"
 trait_adabyss_invasion_leader_desc: "Лельманд — официальный титул командующего адабисским аналогом [Concept('aversaria','аверсарианского')|E] легиона. Пройдя 47 испытаний, необходимых для вступления в командные должности в огромной военной структуре Адабисса, и освоив оружие, о котором на севере могли только гадать, лельманд теперь ведет Мосеку Лимпегайл, или «Янтарный корпус», в вторжение на северные земли.\n\nЭтот корпус — лишь малая часть адабисской армии, ведь завоевание северных королевств считается лишь второстепенной забавой на фоне куда более важных и прибыльных походов на юге и востоке. Однако, несмотря на это, адабисцы маршируют в кажущемся бесчисленным количестве, неся с собой технологии, которые прежде считались уделом лишь богов."
 trait_adabyss_invasion_leader_character_desc: "Лельманд — официальный титул командующего адабисским аналогом [Concept('aversaria','аверсарианского')|E] легиона. Пройдя 47 испытаний, необходимых для вступления в командные должности в огромной военной структуре Адабисса, и освоив оружие, о котором на севере могли только гадать, [ROOT.GetCharacter.GetFirstNameNoTooltip] теперь ведет Мосеку Лимпегайл, или «Янтарный корпус», в вторжение на северные земли.\n\nЭтот корпус — лишь малая часть адабисской армии, ведь завоевание северных королевств считается лишь второстепенной забавой на фоне куда более важных и прибыльных походов на юге и востоке. Однако, несмотря на это, адабисцы маршируют в кажущемся бесчисленным количестве, неся с собой технологии, которые прежде считались уделом лишь богов."

 trait_gh_magicsickness_1: "Легкая [Concept('exposure_sickness','магическая болезнь')|E]"
 trait_gh_magicsickness_1_desc: "Воздействие экстремального количества [Concept('magic','магии')|E] на организм многогранно и разрушительно. На ранних стадиях [Concept('exposure_sickness','магической болезни')|E] этот персонаж испытывает приступы тошноты и рвоты, чередующиеся с головными болями, утомляемостью и лихорадкой. При близком рассмотрении видно, как вены становятся отчетливее, а под кожей явно угадывается движение пульсирующей крови. Иногда кровь даже начинает сочиться из ушей, носа или рта."
 trait_gh_magicsickness_1_character_desc: "Воздействие высокой концентрации [Concept('magic','магии')|E] на организм многогранно и разрушительно. При легкой форме [Concept('exposure_sickness','магической болезни')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] испытывает приступы тошноты и рвоты, чередующиеся с головными болями, утомляемостью и лихорадкой. При близком рассмотрении видно, как [ROOT.GetCharacter.GetHerHis] вены становятся отчетливее, а под кожей явно угадывается движение пульсирующей крови. Иногда кровь даже начинает сочиться из ушей, носа или рта."

 trait_gh_magicsickness_2: "Умеренная [Concept('exposure_sickness','магическая болезнь')|E]"
 trait_gh_magicsickness_2_desc: "Воздействие экстремального количества [Concept('magic','магии')|E] на организм многогранно и разрушительно. На ранних стадиях [Concept('exposure_sickness','магической болезни')|E] этот персонаж испытывает приступы тошноты и рвоты, чередующиеся с головными болями, утомляемостью и лихорадкой. При близком рассмотрении видно, как вены становятся отчетливее, а под кожей явно угадывается движение пульсирующей крови. Иногда кровь даже начинает сочиться из ушей, носа или рта."
 trait_gh_magicsickness_2_character_desc: "Воздействие высокой концентрации [Concept('magic','магии')|E] на организм многогранно и разрушительно. При умеренной форме [Concept('exposure_sickness','магической болезни')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] испытывает приступы тошноты и рвоты, чередующиеся с головными болями, утомляемостью и лихорадкой. При близком рассмотрении видно, как [ROOT.GetCharacter.GetHerHis] вены становятся отчетливее, а под кожей явно угадывается движение пульсирующей крови. Иногда кровь даже начинает сочиться из ушей, носа или рта." 
 
 trait_gh_magicsickness_3: "Сильная [Concept('exposure_sickness','магическая болезнь')|E]"
 trait_gh_magicsickness_3_desc: "Воздействие экстремального количества [Concept('magic','магии')|E] на организм многогранно и разрушительно. При сильной [Concept('exposure_sickness','магической болезни')|E] этот персонаж стремительно теряет недееспособность: большую часть дня его рвет (а при ухудшении — и кровью), и он часто не в состоянии стоять без посторонней помощи. Кровь постоянно сочится из глаз, носа и ушей, а иногда скапливается под кожей в таких объемах, что начинает проступать наружу. В этих местах кожа слезает, а мышцы буквально плавятся внутри тела под действием испепеляющей магической мощи."
 trait_gh_magicsickness_3_character_desc: "Воздействие высокой концентрации [Concept('magic','магии')|E] на организм многогранно и разрушительно. При сильной [Concept('exposure_sickness','магической болезни')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] стремительно теряет недееспособность: большую часть дня [ROOT.GetCharacter.GetHerHim] рвет (а при ухудшении — и кровью), и [ROOT.GetCharacter.GetSheHe] часто не в состоянии стоять без посторонней помощи. Кровь постоянно сочится из глаз, носа и ушей, а иногда скапливается под кожей в таких объемах, что начинает проступать наружу. В этих местах кожа слезает, а мышцы буквально плавятся внутри тела под действием испепеляющей магической мощи."

 trait_gh_magicsickness_4: "Тяжелая [Concept('exposure_sickness','магическая болезнь')|E]"
 trait_gh_magicsickness_4_desc: "Воздействие экстремального количества [Concept('magic','магии')|E] на организм многогранно и разрушительно. При тяжелой [Concept('exposure_sickness','магической болезни')|E] этот персонаж стремительно теряет недееспособность: большую часть дня его рвет (а при ухудшении — и кровью), и он часто не в состоянии стоять без посторонней помощи. Кровь постоянно сочится из глаз, носа и ушей, а иногда скапливается под кожей в таких объемах, что начинает проступать наружу. В этих местах кожа слезает, а мышцы буквально плавятся внутри тела под действием испепеляющей магической мощи."
 trait_gh_magicsickness_4_character_desc: "Воздействие высокой концентрации [Concept('magic','магии')|E] на организм многогранно и разрушительно. При тяжелой [Concept('exposure_sickness','магической болезни')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] стремительно теряет недееспособность: большую часть дня [ROOT.GetCharacter.GetHerHim] рвет (а при ухудшении — и кровью), и [ROOT.GetCharacter.GetSheHe] часто не в состоянии стоять без посторонней помощи. Кровь постоянно сочится из глаз, носа и ушей, а иногда скапливается под кожей в таких объемах, что начинает проступать наружу. В этих местах кожа слезает, а мышцы буквально плавятся внутри тела под действием испепеляющей магической мощи."
 
 trait_gh_magicsickness_5: "Критическая [Concept('exposure_sickness','магическая болезнь')|E]"
 trait_gh_magicsickness_5_desc: "Воздействие экстремального количества [Concept('magic','магии')|E] на организм многогранно и разрушительно. На критической стадии [Concept('exposure_sickness','магической болезни')|E] этот персонаж практически теряет способность даже говорить. Кровь хлыщет из всех возможных отверстий и пор, а кожа, плоть и волосы выпадают клочьями. Конечности буквально оседают внутрь — мышцы, сухожилия и кости плавятся и больше не удерживают собственный вес, а множественные отказывающие органы и бьющиеся в агонии артерии давят на истонченную кожу, пульсируя и лопаясь прямо на глазах. Выживание на этой стадии... крайне маловероятно."
 trait_gh_magicsickness_5_character_desc: "Воздействие экстремального количества [Concept('magic','магии')|E] на организм многогранно и разрушительно. На критической стадии [Concept('exposure_sickness','магической болезни')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] практически [Select_CString(ROOT.GetCharacter.IsFemale, 'потеряла', 'потерял' )] способность даже говорить. Кровь хлыщет из всех возможных отверстий и пор, а кожа, плоть и волосы выпадают клочьями. Конечности буквально оседают внутрь — мышцы, сухожилия и кости плавятся и больше не удерживают собственный вес, а множественные отказывающие органы и бьющиеся в агонии артерии давят на истонченную кожу, пульсируя и лопаясь прямо на глазах. Выживание на этой стадии... крайне маловероятно."

 trait_gh_glowing_eyes: "Светящиеся глаза"
 trait_gh_glowing_eyes_desc: "Хотя глаза [Concept('magi','магов')|E] часто светятся во время совершения ритуалов [Concept('magic','магии')|E], некоторые из них обретают этот эффект навсегда из-за постоянного использования своего дара. Это довольно жуткая, пусть и безобидная особенность, которую многие [Concept('magi','маги')|E] считают символом могущества."
 trait_gh_glowing_eyes_character_desc: "Хотя глаза [Concept('magi','магов')|E] часто светятся во время совершения ритуалов [Concept('magic','магии')|E], [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'обрела', 'обрел' )] этот эффект навсегда из-за постоянного использования своего дара. Это довольно жуткая, пусть и безобидная особенность, которую многие [Concept('magi','маги')|E] считают символом [ROOT.GetCharacter.GetHerHis] могущества."

 trait_gh_excessively_pale: "Нездоровая бледность"
 trait_gh_excessively_pale_desc: "Из-за злоупотребления ритуалами [Concept('magic','магии')|E] этот персонаж обрел болезненно-бледный цвет лица: его кожа настолько истончена и обескровлена, что при близком рассмотрении под ней можно увидеть пульсацию вен и сухожилий."
 trait_gh_excessively_pale_character_desc: "Из-за злоупотребления ритуалами [Concept('magic','магии')|E] [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'обрела', 'обрел' )] болезненно-бледный цвет лица: [ROOT.GetCharacter.GetHerHis] кожа настолько истончена и обескровлена, что при близком рассмотрении под ней можно увидеть пульсацию вен и сухожилий."

 trait_gh_glowing_veins: "Светящиеся вены"
 trait_gh_glowing_veins_desc: "Хотя цвет зависит от применяемого [Concept('magic_type','типа магии')|E], светящиеся вены — верный признак того, что [magi|E] обращался к своему дару настолько часто, что тот наложил неизгладимый отпечаток на его тело. Несмотря на жуткий вид, это весьма распространенное и относительно безобидное явление."
 trait_gh_glowing_veins_character_desc: "Хотя цвет зависит от применяемого [Concept('magic_type','типа магии')|E], светящиеся вены — верный признак того, что [magi|E] обращался к своему дару настолько часто, что тот наложил неизгладимый отпечаток на его тело. Несмотря на жуткий вид, это весьма распространенное и относительно безобидное явление."

 trait_gh_power_bleeder: "Алая волна"
 trait_gh_power_bleeder_desc: "Хотя обильное кровотечение является известным симптомом [Concept('exposure_sickness','магической болезни')|E], некоторые [Concept('living_magi','живые маги')|E] страдают от ее разновидности, которая сохраняется, даже если [Concept('magi','маг')|E] больше не подвергается воздействию [Concept('magic','магии')|E]. Прозванный учеными «Алой волной», этот недуг характеризуется кровотечением из всех отверстий тела. Не будучи столь же смертоносной, как кровотечения при магической болезни, Алая волна всё же представляет серьезную опасность для Живых магов: даже самая неглубокая рана может привести к полной потере крови, если ее немедленно не обработать."
 trait_gh_power_bleeder_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] страдает от Алой волны — недуга [Concept('living_magi','живых магов')|E], вызывающего кровотечение из всех отверстий тела. Не будучи столь же смертоносной, как кровотечения при [Concept('exposure_sickness','магической болезни')|E], Алая волна всё же представляет серьезную опасность для Живого мага: даже самая неглубокая рана может привести к полной потере крови, если ее немедленно не обработать."

 trait_gh_necronic_skin: "Пепел Эльтиадда"
 trait_gh_necronic_skin_desc: "Названный в честь лорда-мага Эльтиадда, который медленно превратился в прах из-за злоупотребления [Concept('dead_magic','мертвой магией')|E], «Пепел Эльтиадда» (или некротическая кожа) — это недуг, поражающий многих [Concept('dead_magi','магов земли')|E], хотя и редко приводящий к полной недееспособности. Заболевание характеризуется тем, что кожа рук, рта и других проводников силы постепенно чернеет и отвердевает в каменистую массу, которая затем отшелушивается пеплом. Большинство пораженных этим [Concept('magi','магов')|E] обычно соблюдают строгий уход и воздерживаются от использования силы, чтобы сдержать симптомы, однако постоянное колдовство с использованием сильной [Concept('dead_magic','мертвой магии')|E] приведет к распространению болезни по всему телу вплоть до гибели [Concept('magi','мага')|E]."
 trait_gh_necronic_skin_character_desc: "Названный в честь лорда-мага Эльтиадда, который медленно превратился в прах из-за злоупотребления [Concept('dead_magic','мертвой магией')|E], «Пепел Эльтиадда» (или некротическая кожа) — это недуг, поражающий многих [Concept('dead_magi','магов земли')|E], хотя и редко приводящий к полной недееспособности. Заболевание характеризуется тем, что кожа рук, рта и других проводников силы постепенно чернеет и отвердевает в каменистую массу, которая затем отшелушивается пеплом. Большинство пораженных этим [Concept('magi','магов')|E] обычно соблюдают строгий уход и воздерживаются от использования силы, чтобы сдержать симптомы, однако постоянное колдовство с использованием сильной [Concept('dead_magic','мертвой магии')|E] приведет к распространению болезни по всему телу вплоть до гибели [Concept('magi','мага')|E]."

 trait_gh_beset_by_visions: "Одержимость видениями"
 trait_gh_beset_by_visions_desc: "Мучимый непрерывными видениями, этот персонаж регулярно переживает длительные приступы, в которых видит всё — от жизней своих придворных до гибели полководцев, живших тысячи лет назад на другом краю света. Груз стольких чужих судеб явно дает о себе знать: он часто оказывается прикован к постели из-за бесконечных мигреней и внезапных смен личности, вызванных наплывом никогда не прожитых жизней."
 trait_gh_beset_by_visions_character_desc: "Мучимый непрерывными видениями, [ROOT.GetCharacter.GetFirstNameNoTooltip] регулярно переживает длительные приступы, в которых видит всё — от жизней своих придворных до гибели полководцев, живших тысячи лет назад на другом краю света. Груз стольких чужих судеб явно дает о себе знать: [ROOT.GetCharacter.GetFirstNameNoTooltip] часто оказывается [Select_CString(ROOT.GetCharacter.IsFemale, 'прикована', 'прикован' )] к постели из-за бесконечных мигреней и внезапных смен личности, вызванных наплывом никогда не прожитых жизней."

 trait_gh_aervalrian_curse: "Проклятие Эрвала"
 trait_gh_aervalrian_curse_desc: "Этот персонаж поражен [Concept('aervalr','Аэрвалрским')|E] проклятием — недугом, который, как говорят, поражает [Concept('dead_magi','магов земли')|E], слишком глубоко погрузившихся в свое искусство. Терзаемые видениями расколотой луны Эрвала, они чувствуют непреодолимое влечение к ее болезненно-зеленому лику и вынуждены бродить по ночам, чтобы быть ближе к ней. Проклятие настолько сильно, что подрывает как их личную жизнь, так и способности править."
 trait_gh_aervalrian_curse_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'поражена', 'поражен' )] [Concept('aervalr','Эрвалским')|E] проклятием — недугом, который, как говорят, поражает [Concept('dead_magi','магов земли')|E], слишком глубоко погрузившихся в свое искусство. Терзаемый видениями расколотой луны Аэрвалра, [ROOT.GetCharacter.GetFirstNameNoTooltip] чувствует непреодолимое влечение к ее болезненно-зеленому лику и вынужден бродить по ночам, чтобы быть ближе к ней. Проклятие настолько сильно, что подрывает как [ROOT.GetCharacter.GetHerHis] личную жизнь, так и способности править."

 trait_gh_ritual_tattoos: "Ритуальные татуировки"
 trait_gh_ritual_tattoos_desc: "Покрытый тайными татуировками для накопления и фокусировки магической энергии, этот персонаж явно мало заботился об эстетике. Даже там, где узоры наносились с претензией на красоту, жуткая суть скрытых в них знаков и тупая пульсация в висках при долгом взгляде на них отпугивают окружающих."
 trait_gh_ritual_tattoos_list_desc: "$trait_gh_ritual_tattoos_character_desc$ У [ROOT.GetCharacter.GetHerHis] имеются следующие татуировки:\n\n[GetScriptedGui('character_ritual_tattoo_list_scripted_gui').BuildTooltip(GuiScope.SetRoot(ROOT.GetCharacter.MakeScope).End)]"
 trait_gh_ritual_tattoos_character_desc: "Покрытый тайными татуировками для накопления и фокусировки магической энергии, [ROOT.GetCharacter.GetFirstNameNoTooltip] явно мало [Select_CString(ROOT.GetCharacter.IsFemale, 'заботилась', 'заботился' )] об эстетике. Даже там, где узоры наносились с претензией на красоту, жуткая суть скрытых в них знаков и тупая пульсация в висках при долгом взгляде на них отпугивают окружающих."
 trait_track_gh_ritual_tattoos: "$trait_gh_ritual_tattoos$"
 trait_track_gh_ritual_tattoos_desc: "$trait_gh_ritual_tattoos_desc$"
 RITUAL_TATTOO_NAME: "$spell_primary_aspect_coloring$ [THIS.Story.Custom('SpellName')]#!"

 trait_gh_ritual_scars_1: "Ритуальные шрамы"
 trait_gh_ritual_scars_1_desc: "Ритуальное шрамирование — обычная практика среди [Concept('magi','магов')|E], применяемая как для пускания крови в магических целях, так и в рамках различных таинств. Несмотря на пугающий вид, наличие хотя бы одного видимого шрама считается у [Concept('magi','магов')|E] знаком престижа."
 trait_gh_ritual_scars_1_character_desc: "Ритуальное шрамирование — обычная практика среди [Concept('magi','магов')|E], применяемая как для пускания крови в магических целях, так и в рамках различных таинств. Несмотря на пугающий вид, наличие хотя бы одного видимого шрама считается у [Concept('magi','магов')|E] знаком престижа."

 trait_gh_ritual_scars_2: "Множественные ритуальные шрамы"
 trait_gh_ritual_scars_2_desc: "Ритуальное шрамирование — обычная практика среди [Concept('magi','магов')|E], применяемая как для пускания крови в магических целях, так и в рамках различных таинств. Маги, мало заботящиеся о своей внешности, со временем становятся скорее похожими на сплошной шрам, скрывающий черты лица."
 trait_gh_ritual_scars_2_character_desc: "Ритуальное шрамирование — обычная практика среди [Concept('magi','магов')|E], применяемая как для пускания крови в магических целях, так и в рамках различных таинств. [magi|E], мало заботящиеся о своей внешности, такие как [ROOT.GetCharacter.GetFirstNameNoTooltip], со временем становятся скорее похожими на сплошной шрам, скрывающий большинство черт лица."

 trait_gh_ritual_scars_3: "Изувечен ритуальными шрамами"
 trait_gh_ritual_scars_3_desc: "Ритуальное шрамирование — обычная практика среди [Concept('magi','магов')|E], применяемая как для пускания крови в магических целях, так и в рамках различных таинств. Некоторые [Concept('magi','маги')|E] полностью отказываются от мирской жизни вне своей [Concept('magic','магии')|E]: за десятки ритуалов они покрываются шрамами настолько, что на теле не остается нетронутого места. Это выглядит крайне жутко и отталкивающе, но служит признаком истинного могущества."
 trait_gh_ritual_scars_3_character_desc: "Ритуальное шрамирование — обычная практика среди [Concept('magi','магов')|E], применяемая как для пускания крови в магических целях, так и в рамках различных таинств. [ROOT.GetCharacter.GetFirstNameNoTooltip], похоже, [Select_CString(ROOT.GetCharacter.IsFemale, 'отказалась', 'отказался' )] от мирской жизни вне своей [Concept('magic','магии')|E]: за десятки ритуалов [ROOT.GetCharacter.GetSheHe] [Select_CString(ROOT.GetCharacter.IsFemale, 'покрылась', 'покрылся' )] шрамами настолько, что на теле не осталось нетронутого места. Это выглядит крайне жутко, но служит признаком истинного могущества."

 trait_gh_racked_by_voices: "Глас Бездны"
 trait_gh_racked_by_voices_desc: "Вещатели Бездны — это [Concept('magi','маги')|E] (или изредка обычные люди, подвергшиеся избыточному воздействию [Concept('magic','магии')|E]), обретшие связь с иным миром за гранью человеческого понимания. Мучимый постоянными голосами, этот персонаж терпит непрерывный шепот, выкрики и яростный вопль незримых призраков, некоторые из которых кажутся слишком знакомыми..."
 trait_gh_racked_by_voices_character_desc: "Вещатели Бездны — это [Concept('magi','маги')|E] (или изредка обычные люди, подвергшиеся избыточному воздействию [Concept('magic','магии')|E]), обретшие связь с иным миром за гранью человеческого понимания. [ROOT.GetCharacter.GetFirstNameNoTooltip] терзается шепотом, выкриками и яростным воплем незримых призраков, некоторые из которых кажутся слишком знакомыми..."

 trait_gh_exhausted: "Истощение"
 trait_gh_exhausted_desc: "Этот персонаж с трудом может поспать хотя бы немного, чувствуя себя постоянно истощенным и мучительно уставшим."
 trait_gh_exhausted_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] с трудом может поспать хотя бы немного, чувствуя себя постоянно истощенным и мучительно уставшим."

 trait_gh_stimulated: "Перевозбуждение"
 trait_gh_stimulated_desc: "Этот персонаж переполнен энергией и не может уснуть, пока не доведет себя работой до полного изнеможения."
 trait_gh_stimulated_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] переполнен энергией и не может уснуть, пока не доведет себя работой до полного изнеможения."

 trait_gh_deep_mutation: "Глубокая мутация"
 trait_gh_deep_mutation_desc: "Этот персонаж подвергся воздействию колоссального количества [Concept('magic','магии')|E] — либо сознательно в ходе какого-то эксперимента, либо по роковой случайности. Ужасающе изувеченная, структура его тела, похоже, стремительно разрушается, а новые мутации возникают будто бы наугад по мере того, как здоровье быстро угасает."
 trait_gh_deep_mutation_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'подверглась', 'подвергся' )] воздействию колоссального количества [Concept('magic','магии')|E] — либо сознательно в ходе какого-то эксперимента, либо по роковой случайности. Ужасающе изувеченное, тело [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip], похоже, стремительно разрушается, а новые мутации возникают будто бы наугад по мере того, как [ROOT.GetCharacter.GetHerHis] здоровье быстро угасает."

 trait_gh_vampiric: "Вампирическое существо"
 trait_gh_vampiric_desc: "Поддерживаемое почти исключительно темной [Concept('magic','магией')|E], тело этого персонажа давно миновало то состояние, в котором оно способно поддерживать человеческую жизнь. Без магии он умер бы почти мгновенно, и большинство [Concept('magi','магов')|E] скорее предпочли бы угаснуть разумом и телом, чем позволить себе дойти до подобного. Хотя продление жизни с помощью [Concept('magic','магии')|E] во многих обществах считается допустимым, делать это настолько часто и долго, чтобы дойти до такого состояния, — нет, особенно из-за возрастающей и пугающей цены ритуалов, проводимых десятилетиями."
 trait_gh_vampiric_character_desc: "Поддерживаемое почти исключительно темной [Concept('magic','магией')|E], тело [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] давно миновало то состояние, в котором оно способно поддерживать [ROOT.GetCharacter.GetHerHis] жизнь. Без магии [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'умерла', 'умер' )] бы почти мгновенно, и большинство [Concept('magi','магов')|E] скорее предпочли бы угаснуть разумом и телом, чем позволить себе дойти до подобного. Хотя продление жизни с помощью [Concept('magic','магии')|E] во многих обществах считается допустимым, делать это настолько часто и долго, чтобы дойти до такого состояния, — нет, особенно из-за возрастающей и пугающей цены ритуалов, проводимых десятилетиями."

 trait_gh_dehanded: "Безрукий"
 trait_gh_dehanded_desc: "Руки этого персонажа были отсечены — его доступ к [Concept('magic','магии')|E] навсегда закрыт."
 trait_gh_dehanded_character_desc: "Руки [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] были отсечены в качестве наказания, и теперь [ROOT.GetCharacter.GetSheHe] [Select_CString(ROOT.GetCharacter.IsFemale, 'навсегда лишена', 'навсегда лишен' )] возможности вновь использовать [Concept('magic','магию')|E]."

 trait_gh_shortsighted: "Близорукость"
 trait_gh_shortsighted_desc: "Зрение этого персонажа уже не то, что прежде. Хотя он всё еще способен выполнять большинство повседневных дел, его неловкость при этом весьма заметна."
 trait_gh_shortsighted_character_desc: "Зрение [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] уже не то, что прежде. Хотя [ROOT.GetCharacter.GetSheHe] всё еще [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] выполнять большинство повседневных дел, [ROOT.GetCharacter.GetHerHis] неловкость при этом весьма заметна."

 trait_gh_nearly_blind: "Почти слепой"
 trait_gh_nearly_blind_desc: "Хотя этот персонаж всё еще способен отличить свет от тьмы, его глаза едва ли способны на что-то большее."
 trait_gh_nearly_blind_character_desc: "Хотя [ROOT.GetCharacter.GetFirstNameNoTooltip] всё еще [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] отличить свет от тьмы, [ROOT.GetCharacter.GetHerHis] глаза едва ли способны на что-то большее."

 trait_gh_riftsight_1: "Слабое видение Разлома"
 trait_gh_riftsight_1_desc: "Этот персонаж может с определенным усилием вглядываться в Разлом. Однако его способности ограничены."
 trait_gh_riftsight_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] может с определенным усилием вглядываться в Разлом. Однако [ROOT.GetCharacter.GetHerHis] способности ограничены."

 trait_gh_riftsight_2: "Видение Разлома"
 trait_gh_riftsight_2_desc: "Этот персонаж способен постоянно видеть Разлом, благодаря чему его прежде дремлющий навык теперь весьма полезен — особенно по мере угасания обычного зрения."
 trait_gh_riftsight_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] постоянно видеть Разлом, благодаря чему [ROOT.GetCharacter.GetHerHis] прежде дремлющий навык теперь весьма полезен — особенно по мере угасания обычного зрения."

 trait_gh_riftsight_3: "Сильное видение Разлома"
 trait_gh_riftsight_3_desc: "Обычное зрение этого персонажа полностью сменилось жуткой способностью видеть Разлом, и делает он это весьма уверенно."
 trait_gh_riftsight_3_character_desc: "Обычное зрение [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] полностью сменилось жуткой способностью видеть Разлом, и [ROOT.GetCharacter.GetSheHe] делает это весьма уверенно."

 trait_gh_riftsight_4: "Исключительное видение Разлома"
 trait_gh_riftsight_4_desc: "Этот персонаж видит Разлом так же отчетливо, как сокол видит явный мир. Встретившись с ним взглядом, можно почувствовать, как он смотрит прямо в душу."
 trait_gh_riftsight_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] видит Разлом так же отчетливо, как сокол видит явный мир. Встретившись с [ROOT.GetCharacter.GetHerHim] взглядом, можно почувствовать, как [ROOT.GetCharacter.GetSheHe] смотрит прямо в душу."

 trait_gh_veteran_of_elysia_sjalvolki: "Ветеран Элизии"
 trait_gh_veteran_of_elysia_sjalvolki_desc: "Этот персонаж участвовал в легендарной битве в Элизийском перевале в 1252 году на стороне сьялволки, заслужив признание соратников и место в рядах самых славных воинов Имперреха."
 trait_gh_veteran_of_elysia_sjalvolki_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'участвовала', 'участвовал' )] в легендарной битве в Элизийском перевале в 1252 году на стороне сьялволки, заслужив признание соратников и место в рядах самых славных воинов Имперреха."

 trait_gh_veteran_of_elysia_aversarian: "Ветеран Элизии"
 trait_gh_veteran_of_elysia_aversarian_desc: "Этот персонаж участвовал в легендарной битве в Элизийском перевале в 1252 году на [Concept('aversaria','аверсарианской')|E] стороне, снискав репутацию стойкого защитника Империи и душевные травмы на всю оставшуюся жизнь."
 trait_gh_veteran_of_elysia_aversarian_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'участвовала', 'участвовал' )] в легендарной битве в Элизийском перевале в 1252 году на аверсарианской стороне, вынеся из этой ужасающей катастрофы лишь душевные травмы."

 trait_gh_veteran_of_elysia_marcher: "Ветеран Элизии"
 trait_gh_veteran_of_elysia_marcher_desc: "Этот персонаж участвовал в легендарной битве в Элизийском перевале в 1252 году на [Concept('aversaria','аверсарианской')|E] стороне в качестве независимого наемника-маршера — редкий подвиг, которым можно похвастаться и о котором стоит сложить повесть."
 trait_gh_veteran_of_elysia_marcher_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'участвовала', 'участвовал' )] в легендарной битве в Элизийском перевале в 1252 году на [Concept('aversaria','аверсарианской')|E] стороне в качестве независимого наемника-маршера — редкий подвиг, которым можно похвастаться и о котором стоит сложить повесть, особенно после того, как маршеры удостоились салюта от самого Сокрушителя Ведьм, пусть лишь немногие шевалье выжили, чтобы вкусить эту скоротечную славу."

 trait_gh_veteran_of_elysia_narses: "Ветеран Элизии"
 trait_gh_veteran_of_elysia_narses_desc: "Этот персонаж участвовал в легендарной битве в Элизийском перевале в 1252 году на [Concept('aversaria','аверсарианской')|E] стороне, снискав репутацию стойкого защитника Империи. С крутым поворотом судьбы Имперреха их борьба предстала в новом свете — как необходимая жертва ради выживания Аверсарии."
 trait_gh_veteran_of_elysia_narses_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'участвовала', 'участвовал' )] в легендарной битве в Элизийском перевале в 1252 году на [Concept('aversaria','аверсарианской')|E] стороне, снискав репутацию стойкого защитника Империи. С крутым поворотом судьбы Имперреха их борьба предстала в новом свете — как необходимая жертва ради выживания Аверсарии."

 trait_gh_widow: "Овдовевший"
 trait_gh_widow_desc: "Этот персонаж всё еще оплакивает смерть своего супруга и пока не готов вступить в новый брак."

 trait_gh_wasteland: "Пустошь"
 trait_gh_wasteland_desc: "Эта местность практически полностью необитаема, и приписывать кому-либо политический контроль над ней не имеет никакого смысла."

 trait_gh_extended_life: "Продление жизни"
 trait_gh_extended_life_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'продлила', 'продлил' )] себе жизнь с помощью паразитической магии, поглощая жизненную энергию других для поддержания своего неестественного существования. На данный момент [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'накопила', 'накопил' )] [ROOT.Var('vampiric_drain_health_pool').GetValue|0] здоровья в своем вампирическом резервуаре здоровья.\n\n#P Пока у [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] есть очки в вампирическом резервуаре здоровья, всякий раз, когда [ROOT.GetCharacter.GetSheHe] [Select_CString(ROOT.GetCharacter.IsFemale, 'должна была бы умереть', 'должен был бы умереть' )] естественной смертью, [ROOT.GetCharacter.GetSheHe] выживает, а количество очков вампирического резервуара, необходимое для восстановления здоровья до уровня «Хорошее», забирается из резервуара высасывания и конвертируется в фактическое здоровье и эффекты [GetModifier('vampirism_mod').GetNameWithTooltip|L] #!\n\n#N Внимание: Если у [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] останется менее 5 единиц здоровья и не будет очков в вампирическом резервуаре здоровья, [ROOT.GetCharacter.GetSheHe] потеряет возможность продолжать свое вампирическое существование.#!"

 trait_magikill: "Убийца магов"

 trait_magikill_1: "Крещеный кровью убийца магов"
 trait_magikill_1_desc: "Этот персонаж сразил как минимум одного из ненавистных [Concept('magi','магов')|E]. Первый из многих — если он, конечно, выживет в своих самоубийственных начинаниях."
 trait_magikill_1_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сразила', 'сразил' )] как минимум одного из ненавистных [Concept('magi','магов')|E]. Первый из многих — если [ROOT.GetCharacter.GetSheHe], конечно, выживет в своих самоубийственных начинаниях."
 trait_magikill_2: "Опытный убийца магов"
 trait_magikill_2_desc: "Этот персонаж сразил нескольких ненавистных [Concept('magi','магов')|E]. Впечатляющий подвиг, учитывая опасности, сопряженные с такой охотой."
 trait_magikill_2_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сразила', 'сразил' )] нескольких ненавистных [Concept('magi','магов')|E]. Впечатляющий подвиг, учитывая опасности, сопряженные с такой охотой."
 trait_magikill_3: "Очень опытный убийца магов"
 trait_magikill_3_desc: "Этот персонаж сразил множество [Concept('magi','магов')|E]. Его имя вселяет ужас в ковены по всей земле."
 trait_magikill_3_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сразила', 'сразил' )] множество [Concept('magi','магов')|E]. [ROOT.GetCharacter.GetHerHis|U] имя вселяет ужас в ковены по всей земле."
 trait_magikill_4: "Ветеран охоты на магов"
 trait_magikill_4_desc: "Этот персонаж сразил многих [Concept('magi','магов')|E]. Его имя вселяет ужас в ковены по всей земле."
 trait_magikill_4_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сразила', 'сразил' )] многих [Concept('magi','магов')|E]. [ROOT.GetCharacter.GetHerHis|U] имя вселяет ужас в ковены по всей земле."
 trait_magikill_5: "Элитный убийца магов"
 trait_magikill_5_desc: "Этот персонаж сразил бесчисленное количество чудовищных [Concept('magi','магов')|E]. Его имя внушает страх даже сильнейшим из магов."
 trait_magikill_5_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сразила', 'сразил' )] бесчисленное количество чудовищных [Concept('magi','магов')|E]. [ROOT.GetCharacter.GetHerHis|U] имя внушает страх даже сильнейшим из магов."
 trait_magikill_6: "Непревзойденный убийца магов"
 trait_magikill_6_desc: "Этот персонаж сразил бесчисленное количество чудовищных [Concept('magi','магов')|E]. Его имя внушает страх даже сильнейшим из магов."
 trait_magikill_6_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'сразила', 'сразил' )] бесчисленное количество чудовищных [Concept('magi','магов')|E]. [ROOT.GetCharacter.GetHerHis|U] имя внушает страх даже сильнейшим из магов."
 trait_magikill_7: "Погибель магии"
 trait_magikill_7_desc: "Бесчисленные жизни [Concept('magi','магов')|E] пресеклись от руки этого персонажа. От [Concept('mayikrata','майикрат')|E] до залов Амсари маги шепотом передают пугающие сказания о его подвигах. Они знают, что никто из них не в безопасности."
 trait_magikill_7_char_desc: "Бесчисленные жизни [Concept('magi','магов')|E] пресеклись от руки [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip]. От [Concept('mayikrata','майикрат')|E] до залов Амсари маги шепотом передают пугающие сказания о [ROOT.GetCharacter.GetHerHis] подвигах. Они знают, что никто из них не в безопасности."

 trait_gh_riftmark_1: "Тронутый Разломом"
 trait_gh_riftmark_1_desc: "Вокруг этого персонажа витает зловещая аура. Всё будто идет накосяк: баночки с краской проливают чернила на драгоценные книги, двери заклинивает в самые недвусмысленные моменты, а сам он изредка странно покашливает. В солнечных лучах вокруг него иногда заметна легкая дымка."
 trait_gh_riftmark_1_char_desc: "Вокруг [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] витает зловещая аура. Всё будто идет накосяк: баночки с краской проливают чернила на драгоценные книги, двери заклинивает в самые недвусмысленные моменты, а сам [ROOT.GetCharacter.GetSheHe] изредка странно покашливает. В солнечных лучах вокруг [ROOT.GetCharacter.GetHerHis] иногда заметна легкая дымка."
 TRAIT_FLAG_DESC_gh_riftmark_1_spell_vulnerability: "Немного более [Select_CString(ROOT.GetCharacter.IsFemale, 'уязвима', 'уязвим' )] к [Concept('magic','магии')|E]."
 trait_gh_riftmark_2: "Отмеченный Разломом"
 trait_gh_riftmark_2_desc: "Невезение этого персонажа стало лишь хуже. Иногда в игре света ему на мгновение мерещатся силуэты близких, манящие его за перила балконов и в пустынные, изолированные коридоры. Вокруг него всё чаще замечают дурные знамения местной культуры, что прямо указывает на его обреченность."
 trait_gh_riftmark_2_char_desc: "Невезение [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] стало лишь хуже. Иногда в игре света [ROOT.GetCharacter.GetHerHim] на мгновение мерещатся силуэты близких, манящие [ROOT.GetCharacter.GetHerHim] за перила балконов и в пустынные, изолированные коридоры. Вокруг [ROOT.GetCharacter.GetHerHis] всё чаще замечают дурные знамения местной культуры, что прямо указывает на [ROOT.GetCharacter.GetHerHis] обреченность."
 TRAIT_FLAG_DESC_gh_riftmark_2_spell_vulnerability: "Несколько более [Select_CString(ROOT.GetCharacter.IsFemale, 'уязвима', 'уязвим' )] к [Concept('magic','магии')|E]."
 trait_gh_riftmark_3: "Проклятый Разломом"
 trait_gh_riftmark_3_desc: "Этот персонаж оказался совершенно беззащитен перед воздействием Смешанной магии. Он часто просыпается и обнаруживает, что бродил во сне в одиночестве по отдаленным углам своего поместья. В другое время он сбивается с пути, ошибочно ослышавшись указаний. Порой, оглядываясь через плечо, он видит, что за ним следят — всегда один и тот же человек, и с каждым разом всё ближе..."
 trait_gh_riftmark_3_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'оказалась', 'оказался' )] совершенно [Select_CString(ROOT.GetCharacter.IsFemale, 'беззащитна', 'беззащитен' )] перед воздействием Смешанной магии. [ROOT.GetCharacter.GetSheHe] часто просыпается и обнаруживает, что [Select_CString(ROOT.GetCharacter.IsFemale, 'бродила', 'бродил' )] во сне в одиночестве по отдаленным углам своего поместья. В другое время [ROOT.GetCharacter.GetSheHe] сбивается с пути, ошибочно ослышавшись указаний. Порой, оглядываясь через плечо, [ROOT.GetCharacter.GetSheHe] видит, что за [ROOT.GetCharacter.GetHerHim] следят — всегда один и тот же человек, и с каждым разом всё ближе..."
 TRAIT_FLAG_DESC_gh_riftmark_3_spell_vulnerability: "Значительно более [Select_CString(ROOT.GetCharacter.IsFemale, 'уязвима', 'уязвим' )] к [Concept('mixed_magic','магии Тумана')|E]."


