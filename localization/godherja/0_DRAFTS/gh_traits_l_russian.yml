 trait_magic_good: "[Concept('magi','Маг')|E]"
 trait_magic_good_1: "Скрытый [Concept('magi','маг')|E]"
 trait_magic_good_1_desc: "В жилах этого персонажа течёт капля магической крови."
 trait_magic_good_1_character_desc: "В жилах [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] течёт капля магической крови."
 trait_magic_good_2: "Обычный [Concept('magi','маг')|E]"
 trait_magic_good_2_desc: "Этот персонаж обладает лишь самым скромным магическим потенциалом для [Concept('magi','мага')|E]. Он способен на разрушения, но, к счастью, лишь в небольших масштабах."
 trait_magic_good_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] обладает лишь самым скромным магическим потенциалом для [Concept('magi','мага')|E]. [ROOT.GetCharacter.GetSheHe|U] [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] на разрушения, но, к счастью, лишь в небольших масштабах."
 trait_magic_good_3: "Одарённый [Concept('magi','маг')|E]"
 trait_magic_good_3_desc: "Этот персонаж наделён врождённым сродством к магии, и во многих культурах считается, что у него чистейшая кровь. Это примерно средний уровень для большинства [Concept('magi','магов')|E] на [Concept('aeras','Эрасе')|E]."
 trait_magic_good_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'наделена', 'наделён' )] врождённым сродством к магии, и во многих культурах считается, что у [ROOT.GetCharacter.GetHerHim] чистейшая кровь. Это примерно средний уровень для большинства [Concept('magi','магов')|E] на [Concept('aeras','Эрасе')|E]."
 trait_magic_good_4: "Сильный [Concept('magi','маг')|E]"
 trait_magic_good_4_desc: "Этот персонаж обладает магическим потенциалом, который встречается, быть может, раз в поколение, и способен проявлять сокрушительную силу даже без базового обучения. Те, кто знает о нём, страшатся его мощи — и вполне обоснованно."
 trait_magic_good_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] обладает магическим потенциалом, который встречается, быть может, раз в поколение, и [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] проявлять сокрушительную силу даже без базового обучения. Те, кто знает о [ROOT.GetCharacter.GetHerHim], страшатся [ROOT.GetCharacter.GetHerHis] мощи — и вполне обоснованно."
 
 trait_magic_good_5: "Исключительный [Concept('magi','маг')|E] I"
 trait_magic_good_5_desc: "Такой персонаж входит в число величайших [Concept('magi','магов')|E] своей эпохи и способен на невероятные свершения как в разрушении, так и в созидании. Хотя в истории встречались и более могущественные чародеи, подобные личности рождаются едва ли чаще раза в столетие. Лишь благодаря продуманным и многовековым династическим программам общество способно породить больше, чем горстку таких чародеев."
 trait_magic_good_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] входит в число величайших [Concept('magi','магов')|E] своей эпохи и [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] на невероятные свершения как в разрушении, так и в созидании. Хотя в истории встречались и более могущественные чародеи, подобные личности рождаются едва ли чаще раза в столетие. Лишь благодаря продуманным и многовековым династическим программам общество способно породить больше, чем горстку таких чародеев."
 
 trait_magic_good_6: "Исключительный [Concept('magi','маг')|E] II"
 trait_magic_good_6_desc: "Такой персонаж входит в число величайших [Concept('magi','магов')|E] своей эпохи и способен на невероятные свершения как в разрушении, так и в созидании. Хотя в истории встречались и более могущественные чародеи, подобные личности рождаются едва ли чаще раза в столетие. Лишь благодаря продуманным и многовековым династическим программам общество способно породить больше, чем горстку таких чародеев, да и тогда подобный чародей считается воистину редчайшим сокровищем."
 trait_magic_good_6_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] входит в число величайших [Concept('magi','магов')|E] своей эпохи и [Select_CString(ROOT.GetCharacter.IsFemale, 'способна', 'способен' )] на невероятные свершения как в разрушении, так и в созидании. Хотя в истории встречались и более могущественные чародеи, подобные личности рождаются едва ли чаще раза в столетие. Лишь благодаря продуманным и многовековым династическим программам общество способно породить больше, чем горстку таких чародеев, да и тогда такой [Concept('magi','маг')|E], как [ROOT.GetCharacter.GetFirstNameNoTooltip], остаётся единственным в своём роде."
 
 trait_magic_good_7: "Исключительный [Concept('magi','маг')|E] III"
