 trait_gh_dragon_red: "Дракон"
 trait_gh_dragon_red_desc: "Это [Concept('dragons','Дракон')|E] — одно из величайших [godtouched_creatures|E], когда-либо ходивших по [aeras|E]. Драконы когда-то правили сушей и небесами, но были практически полностью истреблены сразу после [war_of_the_thousand_dragons|E], что превратило их в миф.\n\nДанное создание покрыто чешуей цвета рубина — этот вид известен своим мастерством в управлении стихией [aspect_fire|E]."
 trait_gh_dragon_red_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — [Concept('dragons','Дракон')|E], одно из величайших [godtouched_creatures|E], когда-либо ходивших по [aeras|E]. Драконы когда-то правили сушей и небесами, но были практически полностью истреблены сразу после [war_of_the_thousand_dragons|E], что превратило их в миф.\n\nДанное создание покрыто чешуей цвета рубина — этот вид известен своим мастерством в управлении стихией [aspect_fire|E]."

 # Substitute lifestyle traits for history work
 trait_gh_historical_blademaster_1: "Ученик мастера клинка"
 trait_gh_historical_blademaster_1_desc: "Искусен в одиночном бою: начинающий мастер клинка отлично знает, каким концом оружия нужно колоть."
 trait_gh_historical_blademaster_1_character_desc: "Искусен в одиночном бою: [ROOT.GetCharacter.GetFirstNameNoTooltip] отлично знает, каким концом оружия нужно колоть."

 trait_gh_historical_blademaster_2: "Мастер клинка"
 trait_gh_historical_blademaster_2_desc: "Мастер клинка — грозный и уважаемый противник в любых видах поединков."
 trait_gh_historical_blademaster_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — грозный и уважаемый противник в любых видах поединков."

 trait_gh_historical_blademaster_3: "Легендарный мастер клинка"
 trait_gh_historical_blademaster_3_desc: "Годы жизни, отданные оттачиванию мастерства владения оружием, чтобы отточенное изящество однажды спасло одну жизнь и оборвало другую."
 trait_gh_historical_blademaster_3_character_desc: "Годы жизни, отданные оттачиванию мастерства владения оружием, чтобы отточенное изящество однажды спасло одну жизнь и оборвало другую."

 trait_gh_historical_reveler_1: "Заядлый кутила"
 trait_gh_historical_reveler_1_desc: "Выпивка да смех, и всё в доброй компании — что еще нужно для счастья?"
 trait_gh_historical_reveler_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'попробовала', 'попробовал' )] на вкус упоительную жизнь пиров и разврата и жаждет продолжения."

 trait_gh_historical_reveler_2: "Известный кутила"
 trait_gh_historical_reveler_2_desc: "Известный кутила — душа любого собрания, притягивающая к себе роскошь и безудержное веселье."
 trait_gh_historical_reveler_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — душа любого собрания, притягивающая к себе роскошь и безудержное веселье."

 trait_gh_historical_reveler_3: "Легендарный кутила"
 trait_gh_historical_reveler_3_desc: "Еда, напитки и опьянение как тела, так и духа — легендарный кутила ни в чем себе не отказывает и неизменно остается центром каждого пира."
 trait_gh_historical_reveler_3_character_desc: "Еда, напитки и опьянение как тела, так и духа — [ROOT.GetCharacter.GetFirstNameNoTooltip] ни в чем себе не отказывает и неизменно остается центром каждого пира."

 trait_gh_historical_physician_1: "Начинающий врач"
 trait_gh_historical_physician_1_desc: "Этот персонаж обучен врачебному искусству."
 trait_gh_historical_physician_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'обучена', 'обучен' )] врачебному искусству."

 trait_gh_historical_physician_2: "Врач"
 trait_gh_historical_physician_2_desc: "У этого персонажа немало опыта в уходе за больными и ранеными."
 trait_gh_historical_physician_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] имеет богатый опыт ухода за больными и ранеными."

 trait_gh_historical_physician_3: "Прославленный врач"
 trait_gh_historical_physician_3_desc: "Целительские навыки этого персонажа широко известны в ученых кругах."
 trait_gh_historical_physician_3_character_desc: "Целительские навыки [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] широко известны в ученых кругах."

 trait_gh_historical_pilgrim_1: "Паломник"
 trait_gh_historical_pilgrim_1_desc: "Мозоли на ногах, ломота в суставах, обветренное лицо — малая цена за исполнение священного долга."
 trait_gh_historical_pilgrim_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'совершила', 'совершил' )] паломничество к святому месту."

 trait_gh_historical_pilgrim_2: "Опытный паломник"
 trait_gh_historical_pilgrim_2_desc: "Этот персонаж много путешествовал по святым местам и считается знатоком среди странников."
 trait_gh_historical_pilgrim_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] много [Select_CString(ROOT.GetCharacter.IsFemale, 'путешествовала', 'путешествовал' )] по святым местам и считается знатоком среди странников."

 trait_gh_historical_pilgrim_3: "Усердный паломник"
 trait_gh_historical_pilgrim_3_desc: "Этот персонаж широко известен в духовных кругах как человек, повидавший мир. Другие паломники часто обращаются к нему за советом как в духовных, так и в житейских вопросах."
 trait_gh_historical_pilgrim_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'широко известна', 'широко известен' )] в духовных кругах как человек, повидавший мир. Другие паломники часто обращаются к [ROOT.GetCharacter.GetHerHim] за советом как в духовных, так и в житейских вопросах."
 
 trait_gh_historical_mystic_1: "Эзотерик"
 trait_gh_historical_mystic_1_desc: "Этот персонаж известен своим необычным, но практичным подходом к религии."
 trait_gh_historical_mystic_1_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'известна', 'известен' )] своим необычным, но практичным подходом к религии."

 trait_gh_historical_mystic_2: "Мистик"
 trait_gh_historical_mystic_2_desc: "Тайны мира, как физического, так и духовного, открываются перед тем, кто предается долгим размышлениям."
 trait_gh_historical_mystic_2_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'известна', 'известен' )] своими необычными методами достижения религиозного просветления."

 trait_gh_historical_mystic_3: "Чудотворец"
 trait_gh_historical_mystic_3_desc: "Фимиам, песнопения и странные заговоры — этот персонаж творения чудеса нетрадиционными способами."
 trait_gh_historical_mystic_3_character_desc: "Фимиам, песнопения и странные заговоры — [ROOT.Char.GetFirstNameNoTooltip] творит чудеса нетрадиционными способами."

 trait_gh_historical_hunter: "Охотник"
 trait_gh_historical_hunter_desc: "Этот персонаж внемлил зову дикой природы."
 trait_gh_historical_hunter_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'внемлила', 'внемлил' )] зову дикой природы."

 trait_gh_historical_track_hunter_1: "Охотник"
 trait_gh_historical_track_hunter_1_desc: "Звук рогов, лай собак, добыча! Будь то с луком или в седле, нет чувства слаще, чем повергнуть свирепого зверя!"
 trait_gh_historical_track_hunter_1_character_desc: "Звук рогов, лай собак, добыча! Будь то с луком или в седле, нет чувства слаще, чем повергнуть свирепого зверя!"

 trait_gh_historical_track_hunter_2: "Охотник"
 trait_gh_historical_track_hunter_2_desc: "Звук рогов, лай собак, добыча! Будь то с луком или в седле, нет чувства слаще, чем повергнуть свирепого зверя!"
 trait_gh_historical_track_hunter_2_character_desc: "Звук рогов, лай собак, добыча! Будь то с луком или в седле, нет чувства слаще, чем повергнуть свирепого зверя!"

 trait_gh_historical_track_hunter_3: "Опытный охотник"
 trait_gh_historical_track_hunter_3_desc: "Опытный охотник — настоящая гроза диких лесов."
 trait_gh_historical_track_hunter_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — настоящая гроза диких лесов."

 trait_gh_historical_track_hunter_4: "Легендарный охотник"
 trait_gh_historical_track_hunter_4_desc: "Легендарный охотник промышляет в диких краях так же естественно, как дышит."
 trait_gh_historical_track_hunter_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] охотится так же естественно, как дышит."

 trait_gh_historical_track_falconer_1: "Сокольник"
 trait_gh_historical_track_falconer_1_desc: "Нет более благородного занятия, чем охота с ястребом или соколом."
 trait_gh_historical_track_falconer_1_character_desc: "Нет более благородного занятия, чем охота с ястребом или соколом."

 trait_gh_historical_track_falconer_2: "Сокольник"
 trait_gh_historical_track_falconer_2_desc: "Этот персонаж искусен в дрессировке хищных птиц для охоты на диких зверей."
 trait_gh_historical_track_falconer_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'искусна', 'искусен' )] в дрессировке хищных птиц для охоты на диких зверей."

 trait_gh_historical_track_beasthunter_1: "Начинающий охотник на чудовищ"
 trait_gh_historical_track_beasthunter_1_desc: "Этот персонаж — лишь новичок в искусстве охоты на самую опасную дичь."
 trait_gh_historical_track_beasthunter_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — новичок в искусстве охоты на самую опасную дичь."

 trait_gh_historical_track_beasthunter_2: "Охотник на чудовищ"
 trait_gh_historical_track_beasthunter_2_desc: "Этот персонаж доказал свое мастерство в выслеживании диковинных и опасных тварей. А порой и тех, и других одновременно."
 trait_gh_historical_track_beasthunter_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'доказала', 'доказал' )] свое мастерство в выслеживании диковинных и опасных тварей. А порой и тех, и других одновременно."

 trait_gh_historical_track_beasthunter_3: "Бывалый охотник на чудовищ"
 trait_gh_historical_track_beasthunter_3_desc: "Этот персонаж известен как настоящий мастер выслеживания опасных монстров. Наблюдать за ним во время охоты — истинное впечатляющее зрелище."
 trait_gh_historical_track_beasthunter_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'известна', 'известен' )] как истинный мастер выслеживания опасных монстров. Наблюдать за [ROOT.GetCharacter.GetHerHim] во время охоты — впечатляющее зрелище."

 trait_gh_historical_track_beasthunter_4: "Легендарный охотник на чудовищ"
 trait_gh_historical_track_beasthunter_4_desc: "Подвиги этого охотника стали легендой: даже самые могучие чудовища трепещут, когда он ступает в их логовище."
 trait_gh_historical_track_beasthunter_4_character_desc: "Охотничьи подвиги [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] стали легендой: даже самые могучие чудовища трепещут перед тем днем, когда [ROOT.GetCharacter.GetSheHe] ступит в их логовище."

 trait_pellagra: "Айронойская проказа"
 trait_pellagra_desc: "Этот персонаж страдает от айронойской проказы — ужасной болезни, зародившейся в Восточном Айроное из-за проклятия, которое древний [magi|E] когда-то наложил на эти земли для защиты от захватчиков."
 trait_pellagra_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] страдает от айронойской проказы — ужасной болезни, зародившейся в Восточном Айроное из-за проклятия, которое древний [magi|E] когда-то наложил на эти земли для защиты от захватчиков."

 trait_mostly_whole_of_body: "Почти телесное здравие"
 trait_mostly_whole_of_body_desc: "Знай себя, знай свои пределы и помни о границах своих не столь уж безграничных возможностей."

 trait_wane_tender: "Хранитель Угасания"

 trait_track_lifestyle_beasthunter: "Охотник на чудовищ"
 trait_track_lifestyle_beasthunter_desc: "Охотник на чудовищ — это тот, кто посвятил себя выслеживанию и уничтожению самых опасных тварей, населяющих [aeras|E]."

 trait_gh_historical_school: "Исторический маг"
 trait_gh_historical_school_desc: "Этот персонаж был известен как [magi|E] своего времени."

 trait_gh_naklan_returned: "Возрожденный Наклан"
 trait_gh_naklan_returned_desc: "Многие считают этого персонажа вторым пришествием [Concept('naklan_the_golden','Наклана')|E], легендарного царя Дахангона, как духом, так и плотью."
 trait_gh_naklan_returned_char_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] считается многими вторым пришествием [Concept('naklan_the_golden','Наклана')|E], легендарного царя Дахангона, как духом, так и плотью."

 trait_gh_trait_amsari_pretender: "Амсарийский претендент"
 gh_trait_amsari_pretender_desc: "Этот персонаж открыто заявили свои права на Амсарийский Хиклан."
 gh_trait_amsari_pretender_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'открыто заявила', 'открыто заявил' )] свои права на Амсарийский Хиклан."

 trait_gh_trait_renounced_claim: "Отказ от претензий"
 gh_trait_renounced_claim_desc: "Этот персонаж публично отрекся от всех претензий на престол — добровольно или по принуждению."
 gh_trait_renounced_claim_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'публично отреклась', 'публично отрекся' )] от всех претензий на престол, добровольно или по принуждению."

 trait_regent: "Регент"
 trait_regent_desc: "Этот персонаж фактически правит своим [Concept('primary_title','основным титулом')|E] как [regent|E], но не претендует на престол — во всяком случае, публично или на практике."
 trait_regent_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] фактически правит своим [Concept('primary_title','основным титулом')|E] как [regent|E], но не претендует на престол — во всяком случае, публично или на практике."

 trait_former_regent: "Бывший регент"
 trait_former_regent_desc: "Этот персонаж когда-то управлял державой как [regent|E], выступая правителем на практике, но не возлагая на себя корону."
 trait_former_regent_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] когда-то [Select_CString(ROOT.GetCharacter.IsFemale, 'управляла', 'управлял' )] державой как [regent|E], выступая правителем на практике, но не возлагая на себя корону."

 trait_dragonrider: "Драконий наездник"
 trait_dragonrider_desc: "Этот персонаж обучен искусству [Concept('dragons','верховой езды на драконах')|E] — почетному и легендарному мастерству среди многих культур."
 trait_dragonrider_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'обучена', 'обучен' )] искусству [Concept('dragons','верховой езды на драконах')|E] — почетному и легендарному мастерству среди многих культур."

 trait_track_magical_water: "Сродство с водой"
 trait_track_magical_water_desc: "Овладейте силой приливов и течений."
 trait_track_magical_fire: "Сродство с огнем"
 trait_track_magical_fire_desc: "Овладейте силой всепоглощающего пламени."
 trait_track_magical_air: "Сродство с воздухом"
 trait_track_magical_air_desc: "Овладейте силой бушующих ветров."
