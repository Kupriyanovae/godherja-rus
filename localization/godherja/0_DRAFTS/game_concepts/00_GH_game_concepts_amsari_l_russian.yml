l_russian:
 
 #game_concept_amsar: "Amsar" Name is already defined elsewhere probably for the old aliases
 game_concept_amsar_desc:0 "Амсар — это как сам регион, так и альтернативное название Амсарского Хиклана. Он граничит с дикими землями на западе, засушливый [Concept('kemsar_biozone','Кемсар')|E] на юге и шехардскими городами-государствами на юго-востоке. Амсар — земля поразительных контрастов: от бесплодных холмов до цветущих равнин, питаемых реками, что спускаются с далеких гор. Географическая изоляция Амсара оказала глубокое влияние на его историю и культуру, сформировав закрытое государство с ограниченными экономическими и политическими связями с остальным [Concept('sarradon','Саррадоном')|E].\n\nДля чужеземцев Амсар часто предстает единым, сплоченным и стабильным королевством, чья протяженная береговая линия усеяна внушительными крепостями и процветающими городами. Однако за этим фасадом скрывается сложная история, полная внутренних кризисов, которые отчасти подогревались частыми случаями братоубийства в самых могущественных династиях, жестокой политикой и периодами глубокой неопределенности, самым недавним из которых на сегодняшний день стал [gh_century_of_crisis|E].\n\nНовейшая история региона неотделима от народа, давшего ему имя, — амсарцев, а также от [gh_the_amsari_prophet|E|l]. В силу этого [Concept('mixed_magi','маги снов')|E] занимают почитаемое положение в амсарском обществе; ученые часто выдвигают гипотезы, что эта магия представляет собой центральную форму, от которой происходят все остальные. Большинство [Concept('magi','магов')|E] являются [Concept('gh_frazan','фразани')|E] или, по крайней мере, прошли обучение под руководством фразани."
 
 game_concept_gh_the_amsari_prophet:0 "Пророк"
 game_concept_gh_the_amsari_prophet_desc:0 "Пророк — самая значимая фигура в новейшей истории Заорании, чье учение продолжает оказывать влияние на [amsar|E]. Считается, что Пророк родился под божественным знамением, однако о его ранней жизни почти ничего не известно. В 201 году от И.С. Пророк вышел из трехдневного пророческого транса и открыл истины Разбития Цепей и [Concept('frodbrokna','События Мертвой Луны')|E] Тысяче Святых Свидетелей, в мельчайших деталях предсказав грядущее не только в [Concept('sarradon','Саррадоне')|E], но и по всему [Concept('aeras','Эрасу')|E]. После этого откровения Пророк путешествовал по [Concept('amsar','Амсару')|E], проповедуя [Concept('gh_zenda','Зенду')|E] и закладывая основы единой амсарской идентичности, одной из опор которой стал [gh_rham|E|l]."

 game_concept_gh_zenda:0 "Зенда"
 game_concept_gh_zenda_desc:0 "[Glossary('Зенда', 'GH_ZENDA_GLOSS')] — это священный свод знаний, включающий в себя откровения [gh_the_amsari_prophet|E|l], записанные и сохраненные амсарскими учеными. Он содержит предсказания будущих событий, включая Битву Разбитой Цепи и Мертвую Луну, и служит путеводителем для понимания воли Заорана.\n\nХотя учение Пророка излагалось в виде непрерывного повествования на протяжении всей его жизни, Зенда традиционно делится на две отдельные книги: вышеупомянутое Пророчество и [gh_sazan_mahndazi|E]. Это деление, будучи практичным, в конечном счете условно, поскольку на протяжении веков научных толкований отдельные отрывки переходили из одной книги в другую."
 
 game_concept_gh_sazan_mahndazi:0 "Сазан-э Махндази"
 game_concept_gh_sazan_mahndazi_desc:0 "[Glossary('Сазан-э Махндази', 'GH_SAZAN_MAHNDAZI_GLOSS')] — это спутник [Concept('gh_zenda','Зенды')|E], посвященный учению Пророка о морали и добродетели. Написанная в том же поэтическом и аллегорическом стиле, эта книга содержит ритуалы, притчи и песни. Вместе эти два труда составляют основу заоранской веры."

 game_concept_gh_frazan:0 "Фразани"
 game_concept_gh_frazan_desc:0 "Фразани — это заоранские жрецы. Их влияние ощущается на каждом уровне жизни, от самой крошечной деревни до императорского двора.\n\nСтановление фразани требует долгих лет сурового обучения, которое начинается в центрах знаний; самым известным в [Concept('amsar','Амсаре')|E] является [Glossary('Унидж-э Кахдерз', 'GH_UNIJ_KAHDERZ_GLOSS')], который долгое время доминировал в мейнстримной вере и ее доктринах. Роль фразани одновременно духовная и практическая: они проводят церемонии, служат религиозными лидерами для своих общин, выступают советниками правителей и порой разрешают споры."
 
 game_concept_gh_century_of_crisis:0 "Век кризиса"
 game_concept_gh_century_of_crisis_desc:0 "Век кризиса относится к неспокойному периоду в амсарской истории между 905 и 999 годами от И.С., который ознаменовался политической раздробленностью, экономическим упадком и повсеместной нестабильностью. Он начался со вспышки дирхадской лихорадки в 905 году, унесшей жизнь канамсара Бахрана и скосившей огромную часть населения. Престолонаследие становилось все более жестоким, что вылилось в одно из самых разрушительных событий в истории [Concept('amsar','Амсара')|E] — гражданскую войну, развязанную Зоэном и Рексилом и известную как [gh_scouring_of_amsar|E].\n\nЭта бесславная эпоха запомнилась как внутренними распрями, так и внешними угрозами, поскольку соседние державы пользовались ослаблением [Concept('amsar','Амсара')|E] для набегов на его границы."

 game_concept_gh_rham:0 "Рам"
 game_concept_gh_rham_desc:0 "Рам — это амсарский завет никогда не соприкасаться со злом рабства. Каждый амсарский ребенок узнает об этом с рождения, и в результате в их культуре развилась глубокая и непреклонная гордость за свой статус свободных людей. Сама мысль о порабощении считается отвратительной для их общества — чем-то, что порождено кошмаром самых темных дней их истории. Один из пактов этого завета гласит, что любой раб, остающийся на [Concept('amsar','амсарской')|E] земле после захода солнца, немедленно становится свободным, хотя фактическое исполнение этого закона в отношении глупых чужеземных купцов, привозящих с собой рабов, в лучшем случае было слабым."

 game_concept_gh_first_siralagi_golden_age:0 "Первый золотой век Сиралаги"
 game_concept_gh_first_siralagi_golden_age_desc:0 "Первый золотой век пиратства Сиралаги, который исследователи обычно датируют периодом с 500 по 569 год, ознаменовал эпоху беспрецедентного процветания городов Сиралаги. В это время заблистали одни из самых известных деятелей в истории Сиралаги, включая Маштана «Краснорукого», а также состоялись легендарные плавания Сины и Римеха — двух самых знаменитых первопроходцев в истории [Concept('amsar','Амсара')|E].\n\nК началу 500-х годов пираты Сиралаги основали Искандур — укрепленный аванпост на островах Три Сестры. Он превратился в оплот налетчиков, грабивших торговые флоты, и плацдарм для искателей приключений, продвигавшихся дальше на запад. Корабли Сиралаги терроризировали торговлю по всему [Concept('amsar','Амсару')|E], совершая рейды все глубже в Амсарский Хиклан и навлекая на себя гнев канамсара. Растущее влияние пиратов, особенно их связи с левиденскими городами-государствами, в итоге привело их к краху.\n\nВ ответ канамсар расширил имперский флот, подчинил оставшихся независимых правителей Сиралаги и усилил контроль над своими вассалами. В 569 году после продолжительной осады Искандур пал. По приказу канамсара город был сравнен с землей, что положило конец золотому веку пиратства Сиралаги."

 game_concept_gh_scouring_of_amsar:0 "Опустошение Амсара"
 game_concept_gh_scouring_of_amsar_desc:0 "Опустошением Амсара называют гражданскую войну, разразившуюся во время [Concept('gh_century_of_crisis','Века кризиса')|E], — конфликт, который разрушил тот хрупкий мир, что еще сохранялся в [Concept('amsar','Амсаре')|E] к тому моменту. Все началось в 939 году, когда Зоэн и Рексил попытались захватить трон, что привело к самой кровопролитной борьбе за власть в истории региона.\n\nГлубокой ночью два брата и их сообщники совершили покушение на своего отца, канамсара Язарита. Зайал, старший сын, сплотил выживших лоялистов, и по всему дворцу вспыхнули бои. К рассвету улицы Чурана были залиты кровью, так как мятежники столкнулись с правительственными силами. Не сумев удержать город, Зоэн и Рексил отступили вглубь Западного Амсара.\n\nВскоре восстание скатилось в безумие: братья стремились уничтожить своих врагов любыми средствами. Целые города приносились в жертву в ходе ритуалов, невиданных со времен древности, — их жители исчезали в столбах фиолетового пламени или тонули в провалах распадающейся материи. Земля сохранит эти шрамы на века."

 game_concept_gh_amsari_rebellion:0 "Второе рассветное восстание"
 game_concept_gh_amsari_rebellion_desc:0 "Второе рассветное восстание относится к великому восстанию рабов, вспыхнувшему в [Concept('amsar','Амсаре')|E] в конце IV века. Оно воплотило в жизнь то, что амсарцы считали божественной волей Заорана, и привело к уничтожению [Glossary('Ран Кемсари', 'GH_RAN_KEMSARI_GLOSS')] — империи, некогда охватывавшей большую часть северо-западного [Concept('sarradon','Саррадона')|E].\n\nАмсарцы тайно собирали оружие и осваивали [Concept('magic','магов')|E] своих угнетателей. Как и предсказывал [gh_the_amsari_prophet|E|l], им суждено было восстать из бесконечного рабства в ходе великой борьбы.\n\nПрежде чем кемсарцы успели собрать надлежащий ответ, амсарцы захватили Вехидка'ха в битве, ставшей известной как Битва Разбитой Цепи, и повернули вспять реку Хейя — источник жизни всей кемсарской цивилизации."

 game_concept_gh_massacre_of_the_ten_heirs:0 "Резня десяти наследников"
 game_concept_gh_massacre_of_the_ten_heirs_desc:0 "Резня десяти наследников относится к жестокой казни своих первых десяти детей, а также их мужей и жен, которую в 1097 году приказал устроить канамсар Парашад, дабы гарантировать, что его младшая дочь унаследует трон без всякого соперничества. Точная роль его третьей жены, Нуйи, остается неясной, хотя говорили, что она имела необычайно сильное влияние на Парашада.\n\nЭто событие впоследствии привело к [Concept('gh_emerald_rebellion','Изумрудное восстание')|E], вспыхнувшему почти два десятилетия спустя."

 game_concept_gh_emerald_rebellion:0 "Изумрудное восстание"
 game_concept_gh_emerald_rebellion_desc: "The Emerald Rebellion erupted nearly two decades after the [gh_massacre_of_the_ten_heirs|E], led by Nashad, a man claiming to be the surviving son of Radesh, the late eldest son of Qanamsar Parashād, said to have been taken away from the slaughter. The name of the rebellion came from the crown he wore, adorned with emeralds, and the deep rich green garments he dressed in, in accordance with the Amsari tradition.\n\nHis supporters, composed of the dynasties of those executed in the massacre and powerful merchants discontent with Qanamsara Tovah's rule, rallied behind him, believing that the rightful line of Qanamsar had passed down to Nashad and his lineage. His defeat and death at the Battle of Tourma would bring the ultimate end of the religious movement he created. Yet his daughter, only sixteen years old, would lead the Second Emerald Rebellion."

 game_concept_gh_amsari_first_dreamers:0 "Первые сновидцы"
 game_concept_gh_amsari_first_dreamers_desc:0 "Первые сновидцы — семь божественных существ, сотворенных Заораном, Тем, Кто Есть, еще до создания человечества. Они первыми ступили в этот мир и первыми узрели формирование бытия; они были словно дети, и Заоран обучал их. Они несли волю Заорана, служа Его эмиссарами и пастырями смертных. Считалось, что Иралия была самой просвещенной из них, и ее смерть дала начало [Concept('gh_amsari_story_first_struggle','первому противостоянию')|E]."
 
 game_concept_gh_amsari_story_first_struggle:0 "Первое противостояние"
 game_concept_gh_amsari_story_first_struggle_desc:0 "Согласно [Concept('gh_zenda','Зенды')|E], Первое противостояние знаменует собой первый акт раздора в творении, когда баланс бытия был разрушен.\n\nЗаоран явил [Concept('gh_amsari_first_dreamers','Первых сновидцев')|E], дабы они направляли мир до и после прихода смертных. Среди них была Иралия. Она единственная понимала волю Заорана так, как не могли ее братья и сестры. Остальные искали ее мудрости, и в своем смирении она обучала их. Но ее брат Белрук возревновал, отказываясь примириться с тем, что другой видит то, чего не дано ему. Гордыня закралась в его сердце, а Майя подпитывал его сомнения. В приступе ярости Белрук сразил Иралию, и пролилась Первая Кровь. Прежде чем ее [Concept('gh_amsari_three_layers_soul','Духовное ядро')|E] смогло воссоединиться с Заораном, само творение содрогнулось.\n\nРана от этого деяния просочилась в само бытие, образовав Анвахгар — Кровоточащий Шрам. Одновременно с этим Майя в своем голоде поглотил звезды, и мир раскололся и был создан заново, как это происходило бесчисленное количество раз после."

 game_concept_gh_amsari_three_layers_soul:0 "Три слоя души"
 game_concept_gh_amsari_three_layers_soul_desc:0 "В заоранских верованиях каждая душа состоит из трех слоев, определяющих природу существования и путь за пределами жизни.\n\n$EFFECT_LIST_BULLET$Тело — смертная оболочка, сбрасываемая при смерти.\n\n$EFFECT_LIST_BULLET$Бремя — опыт, эмоции и выборы, сделанные при жизни. Этот слой сбрасывается после преодоления [Concept('gh_amsari_mountain_of_souls','Горы Душ')|E] в Байзар Мана перед тем, как душа переродится.\n\n$EFFECT_LIST_BULLET$Ядро — чистая сущность бытия, вечная искра дыхания Заорана, которую невозможно уничтожить.\n\nДуховное ядро вечно; оно возвращается к Заорану только тогда, когда освобождается из цикла существования. До тех пор оно проходит через бесчисленные жизни, формируясь испытаниями Бремени и мимолетной формой Тела."
 
 game_concept_gh_amsari_mountain_of_souls:0 "Гора Душ"
 game_concept_gh_amsari_mountain_of_souls_desc:0 "Иногда именуемая «Пиком Душ», она является для заоранских верующих последним рубежом, который все должны пересечь после смерти; местом, которого ни одно существо не может достичь при жизни. Считается, что она находится где-то в [Concept('gh_amsari_realm_of_dreams','царстве снов')|E]. Каждая душа должна взойти на ее вершину перед вступлением в Байзар Мана.\n\nТе, кто жил добродетельно, ясно увидят путь, ведомые рукой Заорана. Те, чей путь остался незавершенным, пребудут в Байзар Мана неопределенное время. Их душа очистится перед возвращением в [aeras|E], Мир Пробуждения, в ином обличии, без памяти о том, кем они были прежде. И наконец, те, кто жил греховно, не найдут пути. Их души затеряются в вечности, блуждая до Последнего Противостояния, когда они будут уничтожены в чистой агонии.\n\nВо время этого странствия душа должна выдержать Четыре Испытания, проверяющие ее достоинство перед восхождением.\n\nДля заоранцев высшая цель души — вырваться из цикла перерождений, живя добродетельно и в полном согласии с божественным порядком Заорана. Только тогда она больше не вернется в мир, оставшись навечно в близости к Заорану."
 
 game_concept_gh_amsari_realm_of_dreams:0 "Царство снов"
 game_concept_gh_amsari_realm_of_dreams_desc:0 "Также называемое Планом Снов, Царство снов в заоранской космологии считается смежным с Миром Пробуждения. От Байзар Мана его отделяет лишь Шахмсур, Бесконечный Поток — река, которую не может пересечь ни один смертный, ибо ее воды суть сама эссенция времени.\n\nВремя от времени Шахмсур выходит из берегов, изливаясь в сны смертных. Именно благодаря этим проблескам люди видят то, что было, что будет, что могло бы быть и что могло бы случиться.\n\nЦарство снов занимает центральное место в амсарском понимании мира. Многие люди и ученые посвящают его изучению всю свою жизнь. По этой причине [amsar|E] считается центром магии снов. Странники по планам здесь не редкость, а стремление к знаниям в этой области всегда считалось престижным.\n\nГоворят, что во время своего десятилетнего отсутствия [gh_the_amsari_prophet|E|l] пребывал именно в Царстве снов, где Заоран открыл Пророку истины бытия и велел испить из Шахмсура."

 game_concept_gh_last_witness_conflict: "Last Witness"
 game_concept_gh_last_witness_conflict_desc: "The Last Witness was an itinerant preacher active in the early sixth century in [amsar|E]. Most sources associate them with the rise of the Bēshanid, though whether the movement preceded them or was born in their wake remains unclear. No reliable name, birthplace, or fate is recorded. In any case, the movement appears to have taken shape around the time the Last Witness were said to have spoken publicly on the dangers of prophetic idolatry, though the exact wording and scope of their message are unknown now. Its adherents have taken part in widespread statue desecration and destruction of religious images in the region. Even the meaning behind the title Last Witness remains a subject of intense debate, ranging from their supposed ability to see into the past and hear the words of [gh_the_amsari_prophet|E|l] as if spoken before them, to claims that they were one of the Thousand Holy Witnesses - figures who, in some way, had traversed time itself. A far-fetched idea, perhaps, until one considers the impossible feats they were said to have performed."

 game_concept_gh_frazan_sirhad_conflict: "Frazan-Sirhad Conflict"
 game_concept_gh_frazan_sirhad_conflict_desc: "The Frazan-Sirhad Conflict refers to the series of events culminating in both the [gh_wujadih_war|E] and, decades later, the [gh_summer_massacre_war|E]. While the [bloodblight|E] had mostly ended the [sirhad|E]'s plans in Far Western Sarradon, the cabals had not ceased to exist, and by 700 IS had become more influential in [amsar|E], their presence growing ever more contentious, especially among traditionalist Frazani elements.\n\nIn 727 IS, tensions worsened with the controversial election of Nashirad Veshdunir, a Sirhad-backed magi, to the position of Hsuh-[gh_frazan|E] in Kalbafaraj Mahalleh. Though the post was formally legitimate, the appointment was viewed by many as a dangerous encroachment, proof that the Sirhad's influence now extended into the highest tiers of Frazan religious authority. Meanwhile, Qanamsar Arika would increasingly denounce in court the supposed influence the [Concept('wardenism','Wardenites')|E] had amassed within his empire. Despite no evidence surfacing then or since, he became convinced that the First Thyssaen Revolt had been orchestrated by sympathizers of the Sirhad.\n\nIn the spring of 728 IS, possibly on the advice of Sarmashar Oltavanid, twelve high-ranking Frazani and two Hsuh-Frazani, including Nashirad, were arrested and executed without trial. This sparked immediate outrage among the [Glossary('Wujādih','gh_wuhadih_gloss')] and began the [gh_wujadih_war|E]."
