 game_concept_gh_wujadih_war: "Wujādih War"
 game_concept_gh_wujadih_war_desc: "A group of [Concept('gh_frazan', 'Frazani')|E]-aligned magi led by Sarmashar Oltavanid began, in 728 IS, a campaign to drive out the now far more established [sirhad|E] magi caste and its [Glossary('Wujādih','gh_wuhadih_gloss')] in [amsar|E] through threats, assassinations, and mob-led lynchings, all under the discreet backing - and possible funding - of Qanamsar Arika. Though not a war in the formal sense, it nonetheless saw open and brutal confrontations between the two opposing and loosely organized blocs, each seeking to assert de facto dominance over the future of the [magi|E] caste in the Hiklahnate. The conflict ended in 730 IS with the death of Sarmashar and the collapse of his pro-Frazani faction, but it left the broader struggle in stalemate and would culminate seventy years later in the [gh_summer_massacre_war|E]."

 game_concept_gh_summer_massacre_war: "Summer Massacre"
 game_concept_gh_summer_massacre_war_desc: "The Summer Massacre, sometimes referred by amsari scholars as the Second Wujādih War, was the systemic and coordinated killings of pro-sirhad [magi|E] in [amsar|E] that took place in 802 IS. Following [Concept('the_decimation_of_sarradon','Halakdun')|E], the Pro-Institution [Concept('gh_frazan','Frazani')|E] magi caste would began to blame the Sirhad cabals in Amsar for the often exaggerated, but somewhat mysterious failure of the pre-organized counterspell, accusing them of intentional sabotage and citing highly interpretive passages from the [gh_zenda|E] as evidence of foreknown guilt. This, despite the [sirhad|E] having been among the most devastatingly struck in the aftermath, particularly with the deaths of a large portion of the population in Tchouran and the surrounding lands.\n\nWhether acting on mere opportunity or by long-laid design, a wave of exceptionally violent purges was carried out across Amsar. In what was widely regarded as one of the many failings of Qanamsar Zartosht at the time, coordinated assassinations and public contracts initially targeted high-ranking Sirhad-aligned magi, but soon expanded to encompass the entire surviving Sirhad caste, and eventually their families as well. The campaign marked the formal end of the Wujādih. The Frazani institution would henceforth exercise unchallenged control over later generations of magi in the Amsari Hiklahn."