l_russian:
 
 #game_concept_amsar: "Amsar" Name is already defined elsewhere probably for the old aliases
 game_concept_amsar_desc: "Амсар — это как сам регион, так и альтернативное название Амсарского Хиклана. Он граничит с дикими землями на западе, засушливый [Concept('kemsar_biozone','Кемсар')|E] на юге и шехарддскими городами-государствами на юго-востоке. Амсар — земля поразительных контрастов: от бесплодных холмов до цветущих равнин, питаемых реками, что спускаются с далеких гор. Географическая изоляция Амсара оказала глубокое влияние на его историю и культуру, сформировав закрытое государство с ограниченными экономическими и политическими связями с остальным [Concept('sarradon','Саррадоном')|E].\n\nДля чужеземцев Амсар часто предстает единым, сплоченным и стабильным королевством, чья протяженная береговая линия усеяна внушительными крепостями и процветающими городами. Однако за этим фасадом скрывается сложная история, полная внутренних кризисов, которые отчасти подогревались частыми случаями братоубийства в самых могущественных династиях, жестокой политикой и периодами глубокой неопределенности, самым недавним из которых на сегодняшний день стал [gh_century_of_crisis|E].\n\nНовейшая история региона неотделима от народа, давшего ему имя, — амсарцев, а также от [gh_the_amsari_prophet|E|l]. В силу этого [Concept('mixed_magi','маги снов')|E] занимают почитаемое положение в амсарском обществе; ученые часто выдвигают гипотезы, что эта магия представляет собой центральную форму, от которой происходят все остальные. Большинство [Concept('magi','магов')|E] являются [Concept('gh_frazan','фразанами')|E] или, по крайней мере, прошли обучение под руководством фразанов."
 
 game_concept_gh_the_amsari_prophet: "Пророк"
 game_concept_gh_the_amsari_prophet_desc: "Пророк — самая значимая фигура в новейшей истории Заорании, чье учение продолжает оказывать влияние на [amsar|E]. Считается, что Пророк родился под божественным знамением, однако о его ранней жизни почти ничего не известно. В 201 году от И.С. Пророк вышел из трехдневного пророческого транса и открыл истины Разбития Цепей и [Concept('frodbrokna','События Мертвой Луны')|E] Тысяче Святых Свидетелей, в мельчайших деталях предсказав грядущее не только в [Concept('sarradon','Саррадоне')|E], но и по всему [Concept('aeras','Эрасу')|E]. После этого откровения Пророк путешествовал по [Concept('amsar','Амсару')|E], проповедуя [Concept('gh_zenda','Зенду')|E] и закладывая основы единой амсарской идентичности, одной из опор которой стал [gh_rham|E|l]."

 game_concept_gh_zenda: "Зенда"
 game_concept_gh_zenda_desc: "[Glossary('Зенда', 'GH_ZENDA_GLOSS')] — это священный свод знаний, включающий в себя откровения [gh_the_amsari_prophet|E|l], записанные и сохраненные амсарскими учеными. Он содержит предсказания будущих событий, включая Битву Разбитой Цепи и Мертвую Луну, и служит путеводителем для понимания воли Заорана.\n\nХотя учение Пророка излагалось в виде непрерывного повествования на протяжении всей его жизни, Зенда традиционно делится на две отдельные книги: вышеупомянутое Пророчество и [gh_sazan_mahndazi|E]. Это деление, будучи практичным, в конечном счете условно, поскольку на протяжении веков научных толкований отдельные отрывки переходили из одной книги в другую."
 
 game_concept_gh_sazan_mahndazi: "Сазан-э Махндази"
 game_concept_gh_sazan_mahndazi_desc: "[Glossary('Сазан-э Махндази', 'GH_SAZAN_MAHNDAZI_GLOSS')] — это спутник [Concept('gh_zenda','Зенды')|E], посвященный учению Пророка о морали и добродетели. Написанная в том же поэтическом и аллегорическом стиле, эта книга содержит ритуалы, притчи и песни. Вместе эти два труда составляют основу заоранской веры."

 game_concept_gh_frazan: "Фразаны"
 game_concept_gh_frazan_desc: "Фразаны — это заоранские жрецы. Их влияние ощущается на каждом уровне жизни, от самой крошечной деревни до императорского двора.\n\nСтановление фразаном требует долгих лет сурового обучения, которое начинается в центрах знаний; самым известным в [Concept('amsar','Амсаре')|E] является [Glossary('Унидж-э Кахдерз', 'GH_UNIJ_KAHDERZ_GLOSS')], который долгое время доминировал в основной вере и ее доктринах. Роль фразанов одновременно духовная и практическая: они проводят церемонии, служат религиозными лидерами для своих общин, выступают советниками правителей и порой разрешают споры."
 
 game_concept_gh_century_of_crisis: "Век кризиса"
 game_concept_gh_century_of_crisis_desc: "Век кризиса относится к неспокойному периоду в амсарской истории между 905 и 999 годами от И.С., который ознаменовался политической раздробленностью, экономическим упадком и повсеместной нестабильностью. Он начался со вспышки дирхадской лихорадки в 905 году, унесшей жизнь канамсара Бахрана и скосившей огромную часть населения. Престолонаследие становилось все более жестоким, что вылилось в одно из самых разрушительных событий в истории [Concept('amsar','Амсара')|E] — гражданскую войну, развязанную Зоэном и Рексилом и известную как [gh_scouring_of_amsar|E].\n\nЭта бесславная эпоха запомнилась как внутренними распрями, так и внешними угрозами, поскольку соседние державы пользовались ослаблением [Concept('amsar','Амсара')|E] для набегов на его границы."

 game_concept_gh_rham: "Рам"
 game_concept_gh_rham_desc: "Рам — это амсарский завет никогда не соприкасаться со злом рабства. Каждый амсарский ребенок узнает об этом с рождения, и в результате в их культуре развилась глубокая и непреклонная гордость за свой статус свободных людей. Сама мысль о порабощении считается отвратительной для их общества — чем-то, что порождено кошмаром самых темных дней их истории. Один из пактов этого завета гласит, что любой раб, остающийся на [Concept('amsar','амсарской')|E] земле после захода солнца, немедленно становится свободным, хотя фактическое исполнение этого закона в отношении глупых чужеземных купцов, привозящих с собой рабов, в лучшем случае было слабым."

 game_concept_gh_first_siralagi_golden_age: "Первый золотой век сиралагов"
 game_concept_gh_first_siralagi_golden_age_desc: "Первый золотой век пиратства сиралагов, который исследователи обычно датируют периодом с 500 по 569 год, ознаменовал эпоху беспрецедентного процветания сиралагских городов. В это время заблистали одни из самых известных деятелей в сиралагской истории, включая Маштана «Краснорукого», а также состоялись легендарные плавания Сины и Римеха — двух самых знаменитых первопроходцев в истории [Concept('amsar','Амсара')|E].\n\nК началу 500-х годов сиралагские пираты основали Искандур — укрепленный аванпост на островах Три Сестры. Он превратился в оплот налетчиков, грабивших торговые флоты, и плацдарм для искателей приключений, продвигавшихся дальше на запад. Корабли сиралагов терроризировали торговлю по всему [Concept('amsar','Амсару')|E], совершая рейды все глубже в Амсарский Хиклан и навлекая на себя гнев канамсара. Растущее влияние пиратов, особенно их связи с левиденскими городами-государствами, в итоге привело их к краху.\n\nВ ответ канамсар расширил имперский флот, подчинил оставшихся независимых сиралагских правителей и усилил контроль над своими вассалами. В 569 году после продолжительной осады Искандур пал. По приказу канамсара город был сравнен с землей, что положило конец золотому веку пиратства сиралагов."

 game_concept_gh_scouring_of_amsar: "Опустошение Амсара"
 game_concept_gh_scouring_of_amsar_desc: "Опустошением Амсара называют гражданскую войну, разразившуюся во время [Concept('gh_century_of_crisis','Века кризиса')|E], — конфликт, который разрушил тот хрупкий мир, что еще сохранялся в [Concept('amsar','Амсаре')|E] к тому моменту. Все началось в 939 году, когда Зоэн и Рексил попытались захватить трон, что привело к самой кровопролитной борьбе за власть в истории региона.\n\nГлубокой ночью два брата и их сообщники совершили покушение на своего отца, канамсара Язарита. Зайал, старший сын, сплотил выживших лоялистов, и по всему дворцу вспыхнули бои. К рассвету улицы Чурана были залиты кровью, так как мятежники столкнулись с правительственными силами. Не сумев удержать город, Зоэн и Рексил отступили вглубь Западного Амсара.\n\nВскоре восстание скатилось в безумие: братья стремились уничтожить своих врагов любыми средствами. Целые города приносились в жертву в ходе ритуалов, невиданных со времен древности, — их жители исчезали в столбах фиолетового пламени или тонули в провалах распадающейся материи. Земля сохранит эти шрамы на века."

 game_concept_gh_amsari_rebellion: "Второе рассветное восстание"
 game_concept_gh_amsari_rebellion_desc: "Второе рассветное восстание относится к великому восстанию рабов, вспыхнувшему в [Concept('amsar','Амсаре')|E] в конце IV века. Оно воплотило в жизнь то, что амсарцы считали божественной волей Заорана, и привело к уничтожению [Glossary('Ран Кемсара', 'GH_RAN_KEMSARI_GLOSS')] — империи, некогда охватывавшей большую часть северо-западного [Concept('sarradon','Саррадона')|E].\n\nАмсарцы тайно собирали оружие и осваивали [Concept('magic','магов')|E] своих угнетателей. Как и предсказывал [gh_the_amsari_prophet|E|l], им суждено было восстать из бесконечного рабства в ходе великой борьбы.\n\nПрежде чем кемсарийцы успели собрать надлежащий ответ, амсарцы захватили Вехидка'ха в битве, ставшей известной как Битва Разбитой Цепи, и повернули вспять реку Хейя — источник жизни всей кемсарской цивилизации."

 game_concept_gh_massacre_of_the_ten_heirs: "Резня десяти наследников"
 game_concept_gh_massacre_of_the_ten_heirs_desc: "Резня десяти наследников относится к жестокой казни своих первых десяти детей, а также их мужей и жен, которую в 1097 году приказал устроить канамсар Парашад, дабы гарантировать, что его младшая дочь унаследует трон без всякого соперничества. Точная роль его третьей жены, Нуйи, остается неясной, хотя говорили, что она имела необычайно сильное влияние на Парашада.\n\nЭто событие впоследствии привело к [Concept('gh_emerald_rebellion','Изумрудное восстание')|E], вспыхнувшему почти два десятилетия спустя."

 game_concept_gh_emerald_rebellion: "Изумрудное восстание"
 game_concept_gh_emerald_rebellion_desc: "Изумрудное восстание вспыхнуло почти через два десятилетия после [Concept('gh_massacre_of_the_ten_heirs','Резни десяти наследников')|E] под предводительством Нашада, человека, утверждавшего, что он выживший сын Радеша, покойного старшего сына Канамасара Парашада, которого, как говорили, вынесли из резни. Название восстание получило от короны, которую он носил, украшенной изумрудами, и глубоких насыщенно-зелёных одеяний, в которые он облачался в соответствии с амсарской традицией.\n\nЕго сторонники, состоявшие из династий тех, кто был казнён во время резни, и могущественных купцов, недовольных правлением Канамасары Товы, сплотились вокруг него, веря, что законная линия Канамасара перешла к Нашаду и его потомкам. Его поражение и смерть в битве при Турме положили окончательный конец религиозному движению, которое он создал. Однако его дочь, которой было всего шестнадцать лет, возглавила Второе Изумрудное восстание."

 game_concept_gh_amsari_first_dreamers: "Первые сновидцы"
 game_concept_gh_amsari_first_dreamers_desc: "Первые сновидцы — семь божественных существ, сотворенных Заораном, Тем, Кто Есть, еще до создания человечества. Они первыми ступили в этот мир и первыми узрели формирование бытия; они были словно дети, и Заоран обучал их. Они несли волю Заорана, служа Его эмиссарами и пастырями смертных. Считалось, что Иралия была самой просвещенной из них, и ее смерть дала начало [Concept('gh_amsari_story_first_struggle','первому противостоянию')|E]."
 
 game_concept_gh_amsari_story_first_struggle: "Первое противостояние"
 game_concept_gh_amsari_story_first_struggle_desc: "Согласно [Concept('gh_zenda','Зенды')|E], Первое противостояние знаменует собой первый акт раздора в творении, когда баланс бытия был разрушен.\n\nЗаоран явил [Concept('gh_amsari_first_dreamers','Первых сновидцев')|E], дабы они направляли мир до и после прихода смертных. Среди них была Иралия. Она единственная понимала волю Заорана так, как не могли ее братья и сестры. Остальные искали ее мудрости, и в своем смирении она обучала их. Но ее брат Белрук возревновал, отказываясь примириться с тем, что другой видит то, чего не дано ему. Гордыня закралась в его сердце, а Майя подпитывал его сомнения. В приступе ярости Белрук сразил Иралию, и пролилась Первая Кровь. Прежде чем ее [Concept('gh_amsari_three_layers_soul','Духовное ядро')|E] смогло воссоединиться с Заораном, само творение содрогнулось.\n\nРана от этого деяния просочилась в само бытие, образовав Анвахгар — Кровоточащий Шрам. Одновременно с этим Майя в своем голоде поглотил звезды, и мир раскололся и был создан заново, как это происходило бесчисленное количество раз после."

 game_concept_gh_amsari_three_layers_soul: "Три слоя души"
 game_concept_gh_amsari_three_layers_soul_desc: "В заоранских верованиях каждая душа состоит из трех слоев, определяющих природу существования и путь за пределами жизни.\n\n$EFFECT_LIST_BULLET$Тело — смертная оболочка, сбрасываемая при смерти.\n\n$EFFECT_LIST_BULLET$Бремя — опыт, эмоции и выборы, сделанные при жизни. Этот слой сбрасывается после преодоления [Concept('gh_amsari_mountain_of_souls','Горы Душ')|E] в Байзар Мана перед тем, как душа переродится.\n\n$EFFECT_LIST_BULLET$Ядро — чистая сущность бытия, вечная искра дыхания Заорана, которую невозможно уничтожить.\n\nДуховное ядро вечно; оно возвращается к Заорану только тогда, когда освобождается из цикла существования. До тех пор оно проходит через бесчисленные жизни, формируясь испытаниями Бремени и мимолетной формой Тела."
 
 game_concept_gh_amsari_mountain_of_souls: "Гора Душ"
 game_concept_gh_amsari_mountain_of_souls_desc: "Иногда именуемая «Пиком Душ», она является для заоранских верующих последним рубежом, который все должны пересечь после смерти; местом, которого ни одно существо не может достичь при жизни. Считается, что она находится где-то в [Concept('gh_amsari_realm_of_dreams','царстве снов')|E]. Каждая душа должна взойти на ее вершину перед вступлением в Байзар Мана.\n\nТе, кто жил добродетельно, ясно увидят путь, ведомые рукой Заорана. Те, чей путь остался незавершенным, пребудут в Байзар Мана неопределенное время. Их душа очистится перед возвращением в [aeras|E], Мир Пробуждения, в ином обличии, без памяти о том, кем они были прежде. И наконец, те, кто жил греховно, не найдут пути. Их души затеряются в вечности, блуждая до Последнего Противостояния, когда они будут уничтожены в чистой агонии.\n\nВо время этого странствия душа должна выдержать Четыре Испытания, проверяющие ее достоинство перед восхождением.\n\nДля заоранцев высшая цель души — вырваться из цикла перерождений, живя добродетельно и в полном согласии с божественным порядком Заорана. Только тогда она больше не вернется в мир, оставшись навечно в близости к Заорану."
 
 game_concept_gh_amsari_realm_of_dreams: "Царство снов"
 game_concept_gh_amsari_realm_of_dreams_desc: "Также называемое Планом Снов, Царство снов в заоранской космологии считается смежным с Миром Пробуждения. От Байзар Мана его отделяет лишь Шахмсур, Бесконечный Поток — река, которую не может пересечь ни один смертный, ибо ее воды суть сама эссенция времени.\n\nВремя от времени Шахмсур выходит из берегов, изливаясь в сны смертных. Именно благодаря этим проблескам люди видят то, что было, что будет, что могло бы быть и что могло бы случиться.\n\nЦарство снов занимает центральное место в амсарском понимании мира. Многие люди и ученые посвящают его изучению всю свою жизнь. По этой причине [amsar|E] считается центром магии снов. Странники по планам здесь не редкость, а стремление к знаниям в этой области всегда считалось престижным.\n\nГоворят, что во время своего десятилетнего отсутствия [gh_the_amsari_prophet|E|l] пребывал именно в Царстве снов, где Заоран открыл Пророку истины бытия и велел испить из Шахмсура."

 game_concept_gh_last_witness_conflict: "Последний Свидетель"
 game_concept_gh_last_witness_conflict_desc: "Последний Свидетель был странствующим проповедником, действовавшим в начале VI века в [Concept('amsar','Амсаре')|E]. Большинство источников связывают его с возвышением бешанидов, хотя остаётся неясным, предшествовало ли это движение им или родилось уже после. Ни достоверного имени, ни места рождения, ни судьбы не сохранилось. В любом случае, движение, по-видимому, оформилось примерно в то время, когда Последний Свидетель, как говорят, публично выступил против опасностей пророческого идолопоклонства, хотя точные слова и масштаб его послания ныне неизвестны. Его последователи участвовали в повсеместном осквернении статуй и уничтожении религиозных изображений в регионе. Даже смысл титула «Последний Свидетель» остаётся предметом ожесточённых споров — от предполагаемой способности видеть прошлое и слышать слова [Concept('gh_the_amsari_prophet','Пророка')|E], как если бы они произносились перед ним, до утверждений, что он был одним из Тысячи Святых Свидетелей — фигур, которые каким-то образом пересекали само время. Возможно, надуманная идея, пока не вспомнишь о невозможных деяниях, которые ему приписывают."

 game_concept_gh_frazan_sirhad_conflict: "Конфликт фразанов и сирхадов"
 game_concept_gh_frazan_sirhad_conflict_desc: "Конфликт фразанов и сирхадов относится к череде событий, кульминацией которых стали [Concept('gh_wujadih_war','Война вуджадихов')|E], а десятилетия спустя — [Concept('gh_summer_massacre_war','Летняя резня')|E]. Хотя [Concept('bloodblight','Кровавый мор')|E] в основном положил конец планам [Concept('sirhad','сирхадов')|E] на Дальнем Западе Саррадона, кабалы не перестали существовать и к 700 году от И.С. обрели большее влияние в [Concept('amsar','Амсаре')|E], а их присутствие становилось всё более спорным, особенно среди традиционалистских элементов фразанов. В 727 году от И.С. напряжённость усилилась после спорного избрания Наширада Вешдунира, мага, поддерживаемого сирхадами, на должность хсух-[Concept('gh_frazan','фразана')|E] в Калбафараж-Махалле. Хотя пост был формально законным, назначение многие сочли опасным вторжением — доказательством того, что влияние Сирхада теперь простирается на высшие эшелоны религиозной власти фразанов. Тем временем канамсар Арика всё чаще осуждал при дворе предполагаемое влияние, которое [Concept('wardenism','вардениты')|E] накопили в его империи. Хотя никаких доказательств тогда или с тех пор не всплыло, он убедился, что Первое восстание Тиссен было организовано сторонниками сирхадов. Весной 728 года от И.С., возможно по совету Сармашара Олтаванида, двенадцать высокопоставленных фразанов и два хсух-фразана, включая Наширада, были арестованы и казнены без суда. Это вызвало немедленное возмущение среди [Glossary('вуджадихов','gh_wuhadih_gloss')] и положило начало [Concept('gh_wujadih_war','Войне вуджадихов')|E]."

 game_concept_gh_wujadih_war: "Война вуджадихов"
 game_concept_gh_wujadih_war_desc: "Группа [Concept('gh_frazan','фразанов')|E]-союзных магов под руководством Сармашара Олтаванида начала в 728 году от И.С. кампанию по изгнанию из [Concept('amsar','Амсара')|E] куда более укоренившейся касты магов [Concept('sirhad','сирхадов')|E] и их [Glossary('вуджадихов','gh_wuhadih_gloss')] с помощью угроз, убийств и самосудов толпы — всё это при скрытой поддержке и, возможно, финансировании канамсара Арики. Хотя это и не было войной в формальном смысле, конфликт всё же вылился в открытые и жестокие столкновения между двумя противоборствующими и слабо организованными блоками, каждый из которых стремился утвердить фактическое господство над будущим касты [Concept('magi','магов')|E] в Хикланате. Конфликт завершился в 730 году от И.С. со смертью Сармашара и крахом его про-фразановской фракции, но оставил более широкую борьбу в тупике и завершился семьдесят лет спустя [Concept('gh_summer_massacre_war','Летней резней')|E]."

 game_concept_gh_summer_massacre_war: "Летняя резня"
 game_concept_gh_summer_massacre_war_desc: "Летняя резня, иногда называемая амсарскими учёными Второй войной вуджадихов, представляла собой систематические и скоординированные убийства про-сирхадских [Concept('magi','магов')|E] в [Concept('amsar','Амсаре')|E], произошедшие в 802 году от И.С. После [Concept('the_decimation_of_sarradon','Халакдуна')|E], про-институциональная каста магов [Concept('gh_frazan','фразанов')|E] начала обвинять кабалы Сирхада в Амсаре в часто преувеличенном, но несколько загадочном провале заранее подготовленного контрзаклинания, обвиняя их в преднамеренном саботаже и цитируя весьма вольные отрывки из [Concept('gh_zenda','Зенды')|E] как доказательство заранее известной вины. Это несмотря на то, что [Concept('sirhad','сирхады')|E] оказались одними из самых сильно пострадавших в последствиях, особенно с гибелью большой части населения в Чуране и окрестных землях. Действуя ли по случайному стечению обстоятельств или по давно задуманному плану, по всему Амсару прокатилась волна исключительно жестоких чисток. То, что широко считалось одной из многих ошибок канамсара Зартошта в то время, скоординированные убийства и публичные контракты изначально были направлены против высокопоставленных магов, связанных с cирхадом, но вскоре распространились на всю уцелевшую касту Сирхада, а в конечном счёте и на их семьи. Эта кампания ознаменовала формальный конец Вуджадих. Институт aразанов с тех пор осуществлял бесспорный контроль над последующими поколениями магов в Амсарском Хиклане."