 building_type_ruin_01:90 "Руины"
 building_ruin_01:90 "Руины"
 building_ruin_01_desc:90 "Заброшенные поселения, цитадели, превратившиеся в логовища чудовищ, и последние остатки давно забытых цивилизаций — зазубренные кости мира, продолжающего жить вопреки всему."

 building_type_colony_building:90 "Колония"
 building_colony_building:90 "Колония"
 building_colony_building_desc:90 "Аванпост в диких землях и оплот цивилизации — прекрасное, но хрупкое творение, сеющее семена надежды для множества народов [aeras|E]."

############################
# MAYIKRATA UNDERGROUND BUILDINGS
############################

 building_type_mayik_fungal_caverns_01: "Грибные пещеры"
 building_type_mayik_fungal_caverns_01_desc: "Глубокая тьма [Glossary('Майикратии','mayikprolollan_encyclopedia_desc')] — не место для традиционного земледелия, однако подземный край обладает собственным изобилием. Обширные системы пещер кишеть кишат съедобными грибами, и те, кто научится правильно их культивировать, смогут прокормить урожаем целые поселения."
 building_mayik_fungal_caverns_01: "Мицелиевые грядки"
 building_mayik_fungal_caverns_01_desc: "Влажные поверхности пещер засеваются съедобными грибами и оставляются расти под присмотром смотрителей. Урожаи нерегулярны, но их достаточно, чтобы поддерживать жизнь в поселении во время суровых подземных сезонов."
 building_mayik_fungal_caverns_02: "Окультуренный грот"
 building_mayik_fungal_caverns_02_desc: "Самые продуктивные участки пещерных стен расчищаются и орошаются, а для посадки отбираются наиболее быстро плодоносящие штаммы грибов. Сбор урожая становится более надежным и разнообразным."
 building_mayik_fungal_caverns_03: "Подземные сады"
 building_mayik_fungal_caverns_03_desc: "Целые пещерные галереи отводятся под выращивание грибов, а на их стенах произрастают десятки тщательно контролируемых видов. Смотрители обходят галереи по строгому расписанию, следя за тем, чтобы ни один вид не заглушал соседей."
 building_mayik_fungal_caverns_04: "Глубокая микология"
 building_mayik_fungal_caverns_04_desc: "Поколения подземного культивирования сформировали свод знаний, граничащий с искусством. Глубинные микологи [Glossary('Майикратии','mayikprolollan_encyclopedia_desc')] добиваются невиданных урожаев от бесплодного камня — мастерство, возможное лишь благодаря накопленному веками опыту."

 building_type_mayik_lichen_pastures_01: "Лишайниковые пастбища"
 building_type_mayik_lichen_pastures_01_desc: "Пещерные системы [Glossary('Майикратии','mayikprolollan_encyclopedia_desc')] поддерживают жизнь не только грибов, но и обширных зарослей лишайников — медленно растущих, но богатых питательными веществами и привлекательных для уникальной фауны подземелий. Те, кто разводит пещерных существ, полностью зависят от этих пастбищ."
 building_mayik_lichen_pastures_01: "Пещерные выпасы"
 building_mayik_lichen_pastures_01_desc: "Поросшие лишайником проходы и камеры отводятся под пастбища для пещерных зверей и скота. Их перемещение регулируется погонщиками, знающими подземные тропы так же хорошо, как любой наземный пастух знает свои поля."
 building_mayik_lichen_pastures_02: "Ухоженные лишайниковые рощи"
 building_mayik_lichen_pastures_02_desc: "Лишайник высевается и орошается в самых плодородных пещерных проходах, при этом предпочтение отдается быстро разрастающимся видам за их высокую урожайность. Подземные пастбищные угодья расширяются."
 building_mayik_lichen_pastures_03: "Загонные садки"
 building_mayik_lichen_pastures_03_desc: "Разветвленная сеть садков и переходов поддерживается для подземного скота, позволяя погонщикам эффективно перемещать большие стада животных, не мешая выращиванию грибов в других местах."
 building_mayik_lichen_pastures_04: "Обширные подземные пастбища"
 building_mayik_lichen_pastures_04_desc: "Подземные пастбища теперь охватывают несколько пещерных систем, став домом для зверей, никогда не видевших солнечного света. Их смотрители превратились в особую касту — глубоко знающую экологию пещер и незаменимую для снабжаемых им поселений."

 building_type_mayik_flooded_grottos_01: "Затопленные гроты"
 building_type_mayik_flooded_grottos_01_desc: "Там, где подземные реки и морские протоки пробиваются в пещерные водоемы, воды кишат бледной рыбой и странными ракообразными. Затопленные гроты [Glossary('Майикратии','mayikprolollan_encyclopedia_desc')] служат как источником пищи, так и ценным товаром — обитающие в них существа не встречаются больше нигде на [aeras|E]."
 building_mayik_flooded_grottos_01: "Промысловый пещерный водоем"
 building_mayik_flooded_grottos_01_desc: "Сети и снасти растянуты над тихими водами грота для ловли бледных рыб и слепых ракообразных. Скромный, но надежный источник свежей пищи."
 building_mayik_flooded_grottos_02: "Подземные рыбные промыслы"
 building_mayik_flooded_grottos_02_desc: "Каменные каналы перенаправляют подземные ручьи в садки, где пойманая рыба содержится живой и вылавливается по мере необходимости. Отходы промысла сливаются обратно в пещерную систему, питая широкую экосистему."
 building_mayik_flooded_grottos_03: "Подземная аквакультура"
 building_mayik_flooded_grottos_03_desc: "Самые ценные виды обитателей гротов разводятся в контролируемых бассейнах, а их молодь выпускается в пещерную систему для пополнения диких популяций. Сбор урожая теперь включает редкие деликатесы, высоко ценимые наземными торговцами."
 building_mayik_flooded_grottos_04: "Дельты Великих Гротов"
 building_mayik_flooded_grottos_04_desc: "Огромные системы управления подземными водами направляют течения нескольких пещерных рек в сеть продуктивных водоемов и протоков. Гроты превратились в нечто среднее между гаванью и фермой, став ключевой особенностью региональной экономики."

 building_mayik_crystal_geode_vein_terrain_tt: "Можно построить только в баронстве с местностью «[mayik_caverns|E]»"
 building_mayik_glowmoss_project_required_tt: "Требуется завершение проекта «Освещение светящимся мхом» в этом графстве"
 building_mayik_underground_terrain_tt: "Можно построить только в подземном баронстве"

 building_type_mayik_crystal_geode_vein_01: "Жила кристаллоносных геод"
 building_type_mayik_crystal_geode_vein_01_desc: "Пещеры [Glossary('Майикратии','mayikprolollan_encyclopedia_desc')] скрывают геодовые образования необычайной красоты — выстланные кристаллами пустоты в скале, чье содержимое одинаково ценно как для [magi|E], так и для торговцев. Но найти их могут лишь те, кто знает, где искать."
 building_mayik_crystal_geode_vein_01: "Кристаллические выходы"
 building_mayik_crystal_geode_vein_01_desc: "Естественный выход кристаллической породы аккуратно разрабатывается небольшой командой специалистов-добытчиков, которые извлекают лучшие образцы неповрежденными и продают их ценителям."
 building_mayik_crystal_geode_vein_02: "Раскопки геод"
 building_mayik_crystal_geode_vein_02_desc: "Пласт вскрывается, открывая доступ к более глубоким геодовым камерам. Крупные кристаллические образования извлекаются с помощью специализированных инструментов, а расположенная неподалеку ограночная мастерская подготавливает их к продаже."
 building_mayik_crystal_geode_vein_03: "Кристаллообрабатывающий завод"
 building_mayik_crystal_geode_vein_03_desc: "Огранщики и обработчики придают сырым кристаллам стандартные формы, ценимые ремесленниками, ювелирами и [magi|E]. Слава об этих кристаллах разносится далеко за пределы подземелий."
 building_mayik_crystal_geode_vein_04: "Великие кристальные хранилища"
 building_mayik_crystal_geode_vein_04_desc: "Жила геод полностью нанесена на карту и систематически разрабатывается. Огромные кристаллические друзы извлекаются целиком и выставляются на показ или продаются как предметы колоссального престижа — живое доказательство того, что недра земли хранят чудеса, недоступные верхнему миру."

 building_type_mayik_cavern_gate_01: "Пещерные врата"
 building_type_mayik_cavern_gate_01_desc: "Подземные коридоры служат естественными теснинами, и тот, кто контролирует их, управляет перемещением по всему региону [Glossary('Майикратии','mayikprolollan_encyclopedia_desc')]. Пещерные врата превращают узкий проход в неприступное укрепление, через которое с трудом пробиваются целые армии."
 building_mayik_cavern_gate_01: "Пещерная блокада"
 building_mayik_cavern_gate_01_desc: "Проход перекрыт тяжелыми бревнами и камнем и охраняется посменным дозором. Ничто не может миновать блокпост без досмотра."
 building_mayik_cavern_gate_02: "Укреплённый тоннельный надвратный дом"
 building_mayik_cavern_gate_02_desc: "Настоящий каменный надвратный дом возведен в самом узком месте прохода; над ним обустроены бойницы, а железная герса способна запечатать коридор в считанные мгновения."
 building_mayik_cavern_gate_03: "Железный бастион"
 building_mayik_cavern_gate_03_desc: "Надвратный дом расширен до полноценного оборонительного бастиона, перекрывающего весь проход. В пещерных стенах вырублены фланговые камеры, позволяющие лучникам и копьеносцам вести оборону из укрытия."
 building_mayik_cavern_gate_04: "Запечатывание"
 building_mayik_cavern_gate_04_desc: "Проход превращен в инженерную зону смертельного огня. Несколько рядов ворот, бойницы и фланговые камеры делают попытку прорыва задачей, за которую решатся взяться лишь самые умелые или отчаянные армии."

 building_type_mayik_chasm_bridge_fort_01: "Форт у моста через пропасть"
 building_type_mayik_chasm_bridge_fort_01_desc: "Там, где дно пещеры уходит в бездонные пропасти, мосты становятся одновременно и необходимостью, и стратегическим активом. Удерживающий мост владеет переправой — а тот, кто укрепит его, заставит врага заплатить за переход дороже, чем может позволить себе большинство армий."
 building_mayik_chasm_bridge_fort_01: "Аванпост у канатного моста"
 building_mayik_chasm_bridge_fort_01_desc: "Канатный мост через пропасть укреплен по обеим сторонам небольшими каменными аванпостами с часовыми, готовыми перерубить канаты в случае опасности."
 building_mayik_chasm_bridge_fort_02: "Гарнизон каменного моста"
 building_mayik_chasm_bridge_fort_02_desc: "Канатный мост заменен каменным, достаточно широким для проезда телег, а аванпосты превратились в полноценный гарнизон с казармами и небольшим арсеналом."
 building_mayik_chasm_bridge_fort_03: "Мостовая крепость"
 building_mayik_chasm_bridge_fort_03_desc: "На ближней стороне переправы возвышается укрепленная башня, контролирующая подходы к мосту. Дальняя сторона простреливается из галереи лучников, вырубленной прямо в скале."
 building_mayik_chasm_bridge_fort_04: "Цитадель пропасти"
 building_mayik_chasm_bridge_fort_04_desc: "Мостовой переход превратился в самостоятельную цитадель — многоярусную крепость, вслубленную прямо в отвес пропасти, с укреплениями по обоим концам моста и под ним. Штурмовать ее — значит с боем пробиваться наверх через зоны сплошного огня, абсолютно не имея пространства для маневра."

 building_type_mayik_expedition_barracks_01: "Экспедиционные казармы"
 building_type_mayik_expedition_barracks_01_desc: "Подземелье вознаграждает тех, кто умеет передвигаться и сражаться в его недрах. Экспедиционные казармы [Glossary('Майикратии','mayikprolollan_encyclopedia_desc')] готовят воинов специально для тьмы, обучая их ориентироваться по звуку, вести ближний бой и сохранять хладнокровие, когда туннели смыкаются вокруг."
 building_mayik_expedition_barracks_01: "Экспедиционные покои"
 building_mayik_expedition_barracks_01_desc: "Особые казармы, где размещаются воины, предназначенные для подземных экспедиций, и где они обучаются тактике пещерного боя. Особый упор делается на выносливость и ориентирование на местности в той же мере, что и на боевые навыки."
 building_mayik_expedition_barracks_02: "Залы глубоких экспедиций"
 building_mayik_expedition_barracks_02_desc: "Расширенные тренировочные залы, где опытные пещерные бойцы передают достававшиеся кровью знания новому поколению. Учебные секции туннелей позволяют солдатам отрабатывать ведение боя в замкнутом пространстве."
 building_mayik_expedition_barracks_03: "Элитный корпус спелеологов"
 building_mayik_expedition_barracks_03_desc: "Сформирован официальный корпус элитных подземных бойцов, отбираемых из лучших курсантов казарм и обученных специализированным боевым дисциплинам, развивавшимся веками в глубокой тьме."
 building_mayik_expedition_barracks_04: "Майикские военные школы"
 building_mayik_expedition_barracks_04_desc: "Накопленные знания о ведении подземной войны систематизированы и преподаются в специально построенных военных школах. Их выпускники входят в число самых умелых бойцов известного подземелья, а их слава достигает даже наземного мира."

 building_type_mayik_glowmoss_tunnels_01: "Туннели светящегося мха"
 building_type_mayik_glowmoss_tunnels_01_desc: "[Glossary('Светомох','GLOWMOSS_GLOSS')] — это живой свет глубин. Впервые выведенные в ходе масштабного проекта освещения, туннели светящегося мха могут быть расширены, даруя свет и жизнь все более широкой сети подземных проходов."
 building_mayik_glowmoss_tunnels_01: "Облицовка светящимся мхом"
 building_mayik_glowmoss_tunnels_01_desc: "После завершения проекта освещения вдоль стен главных туннелей закладываются первые постоянные колонии [Glossary('светомоха','GLOWMOSS_GLOSS')]. Проходы озаряются прохладным сине-зеленым светом."
 building_mayik_glowmoss_tunnels_02: "Освещенные проходы"
 building_mayik_glowmoss_tunnels_02_desc: "Сеть светящегося мха расширяется и поддерживается; новые колонии высеваются вдоль второстепенных проходов. Смотрители подрезают и орошают мох, чтобы сохранить его свечение."
 building_mayik_glowmoss_tunnels_03: "Сеть живого света"
 building_mayik_glowmoss_tunnels_03_desc: "Разветвленная система подземного освещения теперь соединяет основные маршруты этого графства. [Glossary('светомох','GLOWMOSS_GLOSS')] растет аккуратными ухоженными полосами, а испускаемый им свет достаточно ярок, чтобы при нем можно было читать."
 building_mayik_glowmoss_tunnels_04: "Светоносные садки"
 building_mayik_glowmoss_tunnels_04_desc: "Вся сеть туннелей светится ровной биолюминесценцией, превращая то, что раньше было угрожающей тьмой, в почти комфортное для жизни место. Торговцы, паломники и солдаты передвигаются по этим проходам без факелов — признак цивилизации, уникальный для глубинного мира."

 building_type_mayik_rope_bridge_caravanserai_01: "Караван-сарай у канатного моста"
 building_type_mayik_rope_bridge_caravanserai_01_desc: "Торговля в подземелье таит немало опасностей без постоялых дворов, а канатные мосты через глубокие пропасти становятся естественными точками сбора путешественников и купцов. Караван-сарай на такой переправе превращает простой путевой пункт в процветающий центр."
 building_mayik_rope_bridge_caravanserai_01: "Мостовой путевой пункт"
 building_mayik_rope_bridge_caravanserai_01_desc: "Скромная станция у переправы через пропасть предлагает путешественникам кров, воду и припасы. Каменные комнаты малы, а еда проста, но после долгого перехода во тьме это более чем желанный приют."
 building_mayik_rope_bridge_caravanserai_02: "Пещерная торговая фактория"
 building_mayik_rope_bridge_caravanserai_02_desc: "Путевой пункт разросся в полноценную торговую факторию: купцы со всего подземелья привозят сюда товары для обмена у переправы. Здесь обосновалось небольшое постоянное население из торговцев и проводников."
 building_mayik_rope_bridge_caravanserai_03: "Подземный караван-сарай"
 building_mayik_rope_bridge_caravanserai_03_desc: "Полноценный караван-сарай теперь занимает пещерную камеру вокруг переправы; здесь есть стойла для вьючных животных, используемых при подземных перевозках, хранилища для товаров и постоялый двор для купцов, совершающих долгий путь по глубинным дорогам."
 building_mayik_rope_bridge_caravanserai_04: "Эмпорий глубинных дорог"
 building_mayik_rope_bridge_caravanserai_04_desc: "Переправа превратилась в знаменитый торговый центр, привлекающий купцов со всей [Glossary('Майикратии','mayikprolollan_encyclopedia_desc')] и за ее пределами. На его рынках торгуют пещерными кристаллами, редкими грибами, консервированной рыбой из гротов и дорогостоящими наземными товарами — настоящий перекресток двух миров."

 building_type_gh_house_of_dreams_01: "Дом сновидений"
 building_type_gh_house_of_dreams_01_desc: "Святилище для тех, кто ищет смысл в своих снах, где искусные толкователи раскрывают сокровенные истины и божественные указания."
 building_gh_house_of_dreams_01: "Покои сновидений"
 building_gh_house_of_dreams_01_desc: "Скромная комната, где ищущие пересказывают свои сны толкователю, надеясь обрести смысл в ночных видениях."
 building_gh_house_of_dreams_02: "Зал видений"
 building_gh_house_of_dreams_02_desc: "Просторное место сбора, где толкователи погружаются в видения, даруя прозрение растущей аудитории сновидцев."
 building_gh_house_of_dreams_03: "Покои послушников"
 building_gh_house_of_dreams_03_desc: "Учебный центр для начинающих толкователей, учившихся разгадывать смысл самых простых снов."
 building_gh_house_of_dreams_04: "Тайный архив"
 building_gh_house_of_dreams_04_desc: "Охраняемое хранилище, где сны, признанные особо важными, сохраняются для изучения и будущих толкователей."
 building_gh_house_of_dreams_05: "Грезы"
 building_gh_house_of_dreams_05_desc: "Полумрачная комната, наполненная благовониями, где толкователи используют травы и снадобья, чтобы погрузиться в искусственно вызванные сны в состоянии полубодрствования."
 building_gh_house_of_dreams_06: "Крыло отдыха"
 building_gh_house_of_dreams_06_desc: "Уединенное крыло, созданное для обеспечения толкователей покоем, необходимым для их трудов."
 building_gh_house_of_dreams_07: "Святая святых"
 building_gh_house_of_dreams_07_desc: "Особая комната, где мастера-толкователи и [magi|E] совместно работают над снами, которые, как считается, предсказывают судьбоносные события."
 building_gh_house_of_dreams_08: "Великий дом сновидений"
 building_gh_house_of_dreams_08_desc: "Великолепное сооружение, привлекающее ищущих со всего королевства, где самые искусные толкователи распутывают глубочайшие тайны разума."

