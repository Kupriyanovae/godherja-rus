 building_01_special_aervalr_shard_desc: "Осколок [Concept('aervalr','Эрвала')|E] упал в этой местности, предоставив заклинателям полезный источник потенциальной тайной силы.\n\n#P [travel|E] в эту локацию может привести к получению [Concept('artifact','артефакта')|E].#!"
