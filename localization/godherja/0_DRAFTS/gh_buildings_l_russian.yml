 building_00_degasho_bedelam_desc: "$building_type_00_degasho_bedelam_desc$"

 building_00_desert_stilto_katharoteras: "Иссохший Стильто Катаротерас"
 building_00_desert_stilto_katharoteras_desc: "$building_type_00_desert_stilto_katharoteras_desc$"

 building_00_dihasma_xiidan: "Разрушенная Дихасма Ксидан"
