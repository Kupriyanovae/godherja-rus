 building_03_four_cliffs_five_walls: "Четыре утеса и четыре стены Халкамахоса"
 building_03_four_cliffs_five_walls_desc: "$building_type_03_four_cliffs_five_walls_desc$"

 building_03_gisreddeport: "Иноземный квартал"
 building_03_gisreddeport_desc: "$building_type_03_gisreddeport_desc$"

 building_03_golgelea_mines: "Развитые серебряные рудники Гольгелеи"
 building_03_golgelea_mines_desc: "Расположенные в предгорьях гор Айроной, серебряные рудники Гольгелеи на протяжении веков были желанной добычей как для [Concept('aversaria','аверсарианцев')|E], так и для вханавидов. В лучшие времена их богатства питали помпезную и законодательную моду, рождавшуюся в Восточной Аверсарианской провинции и экспортировавшуюся оттуда. Они также финансировали вечные ссоры провинции с Опахасией, три из которых сегодня признаны достаточно серьезными конфликтами, чтобы считаться полноценными войнами, несмотря на то, что [Glossary('Аавтократия','GH_AAUTOKRATA_GLOSS')] в остальном сохраняла стабильность в то время. В более недавние времена их бесконечные богатства стали решающим фактором, позволившим Аксиофее свести войну с Эшрасом к ничьей. Рудники сильно пострадали от [frodbrokna|E] — считается, что каждый из их управляющих погиб как во время катастрофы, так и в годы последующей анархии на востоке. Теперь, когда особое внимание уделяется восстановлению, рудники наконец качают серебро в экономику востока."

 building_03_griffon_roost: "Питомник грифонов"
 building_03_griffon_roost_desc: "Позволяет нанимать [GetMaA('griffon_riders').GetName] как [men_at_arms|E]\n\nЭтот питомник продолжает разводить и обучать грифонов круглый год, не только увеличивая число всадников в армии, но и выращивая грифонов более свирепыми, чем их сородичи в дикой природе."

 building_03_gujak_mines: "Крупный рудник Гуджак"
 building_03_gujak_mines_desc: "По мере того как расширяются горные работы, растут и сами рудники. Строится больше входов и выкапываются большие шахтные стволы для извлечения глубоко залегающей руды."

 building_03_irochi_damotada: "Ирочи Дамотада"
 building_03_irochi_damotada_desc: "С волной ремонтных работ, профинансированных казной объединенной Дамоты, Ирочи Дамотада приветствует всех — как для торговли, так и для поиска знаний. Похваставшись, вероятно, одной из крупнейших библиотек в [Concept('sarradon','Саррадоне')|E] и возвышаясь над всеми путешественниками, прибывающими с севера, Ворота теперь ясно демонстрируют силу южного царства."

 building_03_jans_market: "Кредиты под ничтожный процент от доброго сэра Раноса"
 building_03_jans_market_desc: "$building_type_03_jans_market_desc$"

 building_03_kasmeze_cathedral: "Собор Касмезе"
 building_03_kasmeze_cathedral_desc: "$building_type_03_kasmeze_cathedral_desc$"

 building_03_knightly_chapterhouse: "Рыцарская цитадель"
 building_03_knightly_chapterhouse_desc: "Эта цитадель стоит как оплот Рыцарского Ордена, считающего эту землю своим домом. Многие живут и тренируются в ее стенах, а их герб можно увидеть на полях сражений по всему [Concept('chevalie','Шевалье')|E]."

 building_03_lachish_mines: "Крупные рудники Лахиша"
 building_03_lachish_mines_desc: "Высоко в западных предгорьях Лахиша лежит глубокое хранилище неизвестного происхождения, построенное из железных колонн, уходящих в глубины [aeras|E]. Хотя оно является священным для местных оргаррдских верующих, со временем из него были извлечены казалось бы неисчерпаемые запасы железа. Хранилище без конца, рудники Лахиша покрыты импровизированными тоннелями и плавильнями, предназначенными для извлечения железа и других сокровищ, найденных внутри."

 building_03_lascife_mines: "Крупный рудник Ласцифе"
 building_03_lascife_mines_desc: "По мере того как расширяются горные работы, растут и сами рудники. Строится больше входов и выкапываются большие шахтные стволы для извлечения глубоко залегающей руды."

