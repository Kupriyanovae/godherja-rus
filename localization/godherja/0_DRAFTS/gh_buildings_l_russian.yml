 building_00_tiwu_anaan_mines: "Медные жилы Тиву Анаан"
 building_00_tiwu_anaan_mines_desc: "Открытые медные жилы Тиву Анаан, разрабатывавшиеся Кемсаром на протяжении несчетных поколений и никогда не бросавшиеся окончательно. Постоянных сооружений на них пока нет."
 building_01_tiwu_anaan_mines: "Шахтерское поселение Тиву Анаан"
 building_01_tiwu_anaan_mines_desc: "Рудники Тиву Анаан с незапамятных времен были основным источником меди для Кемсара, а стелы столь многих правителей усеивают окружающий ландшафт, что он имеет такую же археологическую ценность, как и минеральную. Когда бронза все еще безраздельно господствовала как военный металл, месторождения непрерывно разрабатывались для соединения с оловом, импортируемым из неизвестного источника далеко на юге. С появлением железа их значение значительно снизилось, хотя они никогда не были заброшены полностью — даже когда Кемсар сгорел дотла после Битвы за Разорванную Цепь."

 building_01_tomb_of_the_lost: "Грубоньц Заргабоных"
 building_01_tomb_of_the_lost_desc: "$building_type_01_tomb_of_the_lost_desc$"

 building_01_tomb_of_the_suns: "Гробница Солнц"
 building_01_tomb_of_the_suns_desc: "Гробница Солнц — это крупный некрополь, состоящий из нескольких усыпальниц, каждая из которых посвящена отдельному [Concept('malaak','малааку')|E] Охрасика. Она служит местом созерцания и поклонения для ахридаристов, куда они могут прийти, чтобы принести жертвы Охрасику и получить его благословение."

 building_01_tombofthesaints: "Тафон то Агионис"
 building_01_tombofthesaints_desc: "$building_type_01_tombofthesaints_desc$"

 building_01_tower_golden_seeker: "Башня Золотых Искателей"
