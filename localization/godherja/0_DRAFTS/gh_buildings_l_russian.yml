 building_gh_iskandur_02_v2: "$building_type_gh_iskandur_01_v2$"
 building_gh_iskandur_02_v2_desc: "$building_type_gh_iskandur_01_v2_desc$"

 # Shakar Abkaraz
 building_type_gh_shakar_abkaraz_01: "Шакар Абкараз"
 building_type_gh_shakar_abkaraz_01_desc: "Шакар, что означает «Угнетатель», и Абкараз — «разбитое изваяние» или «осколки идола», когда-то был внушительной статуей неизвестного бога кемсарцев, разрушенной после падения [Glossary('Ран Кемсарцы','GH_RAN_KEMSARI_GLOSS')]. Его пьедестал расколот, а само изваяние разбито на куски, чья голова и тело рассеяны по всей территории."
 building_gh_shakar_abkaraz_01: "$building_type_gh_shakar_abkaraz_01$"
 building_gh_shakar_abkaraz_01_desc: "$building_type_gh_shakar_abkaraz_01_desc$"

 building_type_gh_shakar_abkaraz_02: "Кокун"
 building_type_gh_shakar_abkaraz_02_desc: "Ранее известный амсарец как Шакар Абкараз, этот исполинский монумент был восстановлен кемсарами в честь Кокуна. Возвышаясь на неповрежденном пьедестале, статуя зловеще грозит округе, пронизывая регион своим пристальным взглядом."
 building_gh_shakar_abkaraz_02: "$building_type_gh_shakar_abkaraz_02$"
 building_gh_shakar_abkaraz_02_desc: "$building_type_gh_shakar_abkaraz_02_desc$"

 building_type_gh_shakar_abkaraz_01_v2: "Шакар Абкараз"
 building_type_gh_shakar_abkaraz_01_v2_desc: "Шакар, что означает «Угнетатель», и Абкараз — «разбитое изваяние» или «осколки идола», когда-то был внушительной статуей неизвестного бога кемсарцев, разрушенной после падения [Glossary('Ран Кемсарцы','GH_RAN_KEMSARI_GLOSS')]. Его пьедестал расколот, а само изваяние разбито на куски, чья голова и тело рассеяны по всей территории."
 building_gh_shakar_abkaraz_01_v2: "$building_type_gh_shakar_abkaraz_01$"
 building_gh_shakar_abkaraz_01_v2_desc: "$building_type_gh_shakar_abkaraz_01_desc$"

 building_type_gh_shakar_abkaraz_02_v2: "Кокун"
 building_type_gh_shakar_abkaraz_02_v2_desc: "Ранее известный амсарец как Шакар Абкараз, этот исполинский монумент был восстановлен кемсарами в честь Кокуна. Возвышаясь на неповрежденном пьедестале, статуя зловеще грозит округе, пронизывая регион своим пристальным взглядом."
 building_gh_shakar_abkaraz_02_v2: "$building_type_gh_shakar_abkaraz_02$"
 building_gh_shakar_abkaraz_02_v2_desc: "$building_type_gh_shakar_abkaraz_02_desc$"

 # First Altar
 building_type_gh_amsari_first_altar_01: "Первый алтарь"
 building_type_gh_amsari_first_altar_01_desc: "Этот древний заоранский алтарь, который многие считают самым первым (хотя никто не знает наверняка), остается древнейшим из ныне стоящих в [amsar|E]. Его конструкция несет следы многочисленных починок камнями разной эпохи и обработки. Сокрытое и отдаленное местоположение уберегло его от притеснений кемсарцев. Хотя за последнее тысячелетие его значение померкло, местные жители по-прежнему собираются у его обветренных камней для молитв и песнопений."
 building_gh_amsari_first_altar_01: "$building_type_gh_amsari_first_altar_01$"
 building_gh_amsari_first_altar_01_desc: "$building_type_gh_amsari_first_altar_01_desc$"

 # River's Wall
 building_type_gh_rivers_wall_01: "Речная стена"
 building_type_gh_rivers_wall_01_desc: "Возведенная в правление $qanamsar_navrosh_link$ Навроша#! в 513 году от И. С., Речная стена предназначалась для отражения набегов хассаридов, угрожавших западным рубежам Хеклана. Тянущаяся через всю равнину, она оснащена башнями, расположенными через равные промежутки для лучников и дозорных. Любопытно, что на одном из участков стены сохранились полустиравшиеся надписи на древнем языке, напоминающем старую амсарскую письменность — они, судя по всему, предшествуют правлению Навроша, однако некоторые символы каким-то образом описывают события, произошедшие задолго после его эпохи."
 building_gh_rivers_wall_01: "$building_type_gh_rivers_wall_01$"
 building_gh_rivers_wall_01_desc: "$building_type_gh_rivers_wall_01_desc$"

 # Stone Crescent
 building_type_gh_stone_crescent_01: "Каменный полумесяц"
 building_type_gh_stone_crescent_01_desc: "Загадочное полукруглое святилище из массивных каменных монолитов, Каменный полумесяц возвышается над окружающими равнинами уже тысячелетия. Его истинное происхождение и предназначение неизвестны, а записей о его постройке не сохранилось. На каждом монолите высечены едва заметные обветренные узоры.\n\nПолумесяц служил религиозным центром для самых разных народов. Даже сейчас паломники и странники оставляют здесь подношения, продолжая традиции своих предшественников."
 building_gh_stone_crescent_01: "$building_type_gh_stone_crescent_01$"
 building_gh_stone_crescent_01_desc: "$building_type_gh_stone_crescent_01_desc$"
 
 building_type_gh_kholrevish_01: "Холревиш"
 building_type_gh_kholrevish_01_desc: "Холревиш возвышается над бесплодными горами южного [amsar|E] — крепость невероятных масштабов. Ее стены, несомненно кемсарские по архитектуре, предшествуют всем известным хроникам.\n\nМестные жители избегают крепости, а чужеземцев предостерегают держаться от нее подальше. Именно здесь после отступления во время [gh_amsari_rebellion|E] бесследно исчез целый полк кемсарской армии. Поблизости последний левиденский король принял свой обреченный последний бой, решив как свою судьбу, так и участь своей династии.\n\nКажется, будто цитадель поглощает сам свет. Воздух вокруг нее удушлив, а сама земля словно испытывает вражду к присутствию живых. Еще более странен всплеск нестабильной магии, отмечаемый многими [magi|E]."
 building_gh_kholrevish_01: "$building_type_gh_kholrevish_01$"
 building_gh_kholrevish_01_desc: "$building_type_gh_kholrevish_01_desc$"
 
 building_type_gh_prophet_scultpure_01: "Изваяние Пророка"
 building_type_gh_prophet_scultpure_01_desc: "У подножия священной горы стоит исполинская статуя — странное, но искусно высеченное изображение $amsari_prophet_link$ Пророка#!. Ее окружают десятки меньших фигур из [gh_zenda|E], изваянных прямо из скалы умелейшими амсарскими магами-изваятелями. Говорят, эти фигуры вечно подпирают огромную тяжесть горы, словно держа на себе весь мир.\n\nУкрывшись в тени горы, лежит Сарад-Рошен — один из святейших городов заоранской веры и, пожалуй, одно из самых загадочных мест во всем [amsar|E]. Немногим паломникам довелось стать свидетелями священной игры света и тени на резных изваяниях во время святых праздников, а некоторые и вовсе утверждают, что фигуры едва заметно шевелятся в меняющихся лучах.\n\nИ еще меньше тех, кому дарована честь пройти за его стены. Священный город невероятен: здания из ослепительно белого камня выстроены идеальными концентрическими кругами. Потоки кристально чистой воды ниспадают с горных высот, пронизывая улицы подобно жилам жидкого света и омывая полированные камни яркими переливами. Каждая тропа украшена пышными золотыми рельефами, являющими божественную славу Заорана его верным почитателям."
 building_gh_prophet_scultpure_01: "$building_type_gh_prophet_scultpure_01$"
 building_gh_prophet_scultpure_01_desc: "$building_type_gh_prophet_scultpure_01_desc$" 

 building_type_gh_tisrani_khuneh_01: "Тисрани Хуне"
 building_type_gh_tisrani_khuneh_01_desc: "Тисрани Хуне — это огромный храмовый комплекс, возведенный на священной земле, где $amsari_prophet_link$ Пророк#! впервые воззвал к Тысяче Святых Свидетелей. Храм способен вместить десятки тысяч верующих одновременно. Его великие залы расходятся в форме идеального круга, спроектированные так, что на рассвете и закате солнечный свет проходит через узкий проем над возвышением, заливая пространство золотым свечением.\n\nВ самом сердце храма покоится простая каменная платформа, где прозвучало первое откровение — место, где даже дикие звери, как говорят, молча собирались послушать волю Божества. Статуи Свидетелей, высеченные из красного мрамора, не мигая смотрят на возвышение.\n\nХранящий Пламя Первого Рассвета, храм был разграблен в конце VII века, когда город захватили [Concept('wardenism','вардениты')|E] на своем пути к насаждению [Glossary('Арсин-За Нумака','GH_ARSIN_ZAH_NUMAK_GLOSS')] канамсару."
 building_gh_tisrani_khuneh_01: "$building_type_gh_tisrani_khuneh_01$"
 building_gh_tisrani_khuneh_01_desc: "$building_type_gh_tisrani_khuneh_01_desc$"

 building_type_01_unij_e_uleyysah: "Унидж-э Улейса"
 building_type_01_unij_e_uleyysah_desc: "Унидж-э Улейса — один из величайших центров просвещения в [amsar|E] и духовное сердце региона [Glossary('Кеш Илахии','GH_QHESH_ILAHIA_GLOSS')], где большинство [Concept('gh_frazan','фразаны')|E], служащих местным правителям, проходят часть своего обучения. Заведение представляет собой обширный террасный комплекс, возведенный вокруг центральной библиотеки — купольного зала, чьи полки хранят многовековые переписанные рукописи. Вокруг нее расходятся дворы, где крытые галереи отбрасывают тени на вымощенные плиткой полы. Внизу лежит древняя цистерна, созданная еще до основания заведения; ее каналы до сих пор питают прекрасные сады и фонтаны во внутренних дворах, служащие извечным источником вдохновения для жрецов.\n\nИсторически Унидж-э Улейса считался самым консервативным из четырех великих институтов, и не без оснований — именно он выступил непреклонным защитником власти фразанов во время [gh_frazan_sirhad_conflict|E]."
 building_01_unij_e_uleyysah: "$building_type_01_unij_e_uleyysah$"
 building_01_unij_e_uleyysah_desc: "$building_type_01_unij_e_uleyysah_desc$"


 building_type_01_wizzhaod: "Уиззхаод"
 building_type_01_wizzhaod_desc: "Уиззхаод — это [magic|E] академия и анклав среди городов-государств шехарддов. Школа так же древна, как и сам ЭЛОИ-Уиззхаод, и тесно связана с его управлением и историей. Большая часть школы была возведена благодаря могущественной [stone_i][aspect_stone] [magic|E]. Возвышаясь над всем вокруг, светоч вечного пламени ярко сияет над городом на мили во всех направлениях, направляя ищущих знания к его залам."
 building_01_wizzhaod: "Уиззхаод"
 building_01_wizzhaod_desc: "Уиззхаод — это [magic|E] академия и анклав среди городов-государств шехарддов. Школа так же древна, как и сам ЭЛОИ-Уиззхаод, и тесно связана с его управлением и историей. Большая часть школы была возведена благодаря могущественной [stone_i][aspect_stone] [magic|E]. Возвышаясь над всем вокруг, светоч вечного пламени ярко сияет над городом на мили во всех направлениях, направляя ищущих знания к его залам."
 building_02_wizzhaod: "Руины Уиззхаода"
 building_02_wizzhaod_desc: "Уиззхаод считался одной из величайших [magic|E] школ в [sarradon|E], куда ученики стекались со всех концов света, чтобы учиться под началом убеленных сединами и затворнических [magi|E]. Его величие можно было созерцать за много миль во всех направлениях благодаря великолепной башне пылающего света, озарявшей небо на протяжении тысячелетий.\n\nСегодня от его былой славы осталась лишь пустая оболочка. Возвышающиеся прекрасные строения, созданные лишь с помощью магии, заброшены и покоятся в песках как напоминание тем, кто стремится познать слишком многое."
 building_03_wizzhaod: "Восстановленный Уиззхаод"
 building_03_wizzhaod_desc: "Школа Уиззхаод вновь торжествующе возвышается над пустыней, и ее маяк света раз и навсегда вернулся в ночное небо. [magi|E] стекаются в ее залы, а жители окрестных земель вновь приняли присутствие магии."
 magocratic_capital_effect_desc: "#low Открывает:#!\nПозволяет [holder|E] принять тип [government|E] [magocracy|E] или [magocratic_republic|E] при определенных условиях, если их [capital|E] находится в этой [province|E]"
 building_type_01_white_hall_castle: "Сэйбантай"
 building_type_01_white_hall_castle_desc: "Резиденция влиятельного клана Хоувэнь, [Glossary('Сэйбантай','GH_SEIBANTAI_GLOSS')] — это огромный замок из укрепленного фарфора и известняка, возведенный на нетронутых жемчужных берегах восточного Дахангона. Построенный в X веке от И. С. катунскими поселенцами, он берет свое начало от скромного деревянного форта, возведенного для защиты от пиратов Соклога.\n\nИз-за меньшего контроля, который Лакоенг осуществляют над востоком — и его в целом более опасного окружения, — Сэйбантай является скорее крепостью, чем дворцом, бряцая прочными стенами, способными выдержать даже огонь бронзовых мортир. И все же замок остается великолепным: его гладкий белый фасад отражает столь же яркую береговую линию, возвышаясь сияющим светочем цивилизации посреди восточной глуши."
 building_01_white_hall_castle: "$building_type_01_white_hall_castle$"
 building_01_white_hall_castle_desc: "$building_type_01_white_hall_castle_desc$"

 building_type_01_xanglis_lantern: "Фонарь Ксангли"
 building_type_01_xanglis_lantern_desc: "Ослепительный маяк, Фонарь Ксангли долгое время указывал путь кораблям, пересекающим южные берега Дахангона. Его зачарованное пламя меняет цвет, предупреждая об угрозах в море: желтый — к шторму, фиолетовый — к морским чудовищам, а красный — к пиратам.\n\nВопреки распространенному поверью, башня была создана не первым Ксангли, а его внуком, Ксангли Вторым. Многие считали ее тщетной попыткой сдержать набеги Морского Льва из Соклога, что и было доказано печально известным разграблением Бронзового Порта едва ли через два года после постройки."
 building_01_xanglis_lantern: "$building_type_01_xanglis_lantern$"
 building_01_xanglis_lantern_desc: "$building_type_01_xanglis_lantern_desc$"

 building_type_01_pakaras_pass: "Проход Пакары"
 building_type_01_pakaras_pass_desc: "Узкая тропа, ведущая к великой долине Канарим; проход назван так в честь грозного полководца Пакары. Легенда гласит, что во время завоевания Дахангона ему отказали во входе как стражи Такадая, так и королева-воительница Вехангуна, оставив его войска застрявшими в восточной глуши. Желая проложить собственный путь, Пакара, как говорят, рассек гору голыми руками.\n\nОднако с тех пор на защите прохода выросла могучая крепость, и за эти годы дуканы Пакинбри повернули назад немало потенциальных захватчиков с востока."
 building_01_pakaras_pass: "$building_type_01_pakaras_pass$"
 building_01_pakaras_pass_desc: "$building_type_01_pakaras_pass_desc$"

 building_type_01_thornfort: "Замок Рантако"
 building_type_01_thornfort_desc: "Построенный еще во времена правления самой Нари Дайи, замок Рантако является одним из древнейших замков Дахангона и защищает от вторжений со стороны сайелаянов. Во время войн с королевством Шрунфан в VII веке от И. С. крепость снискала немеркнущую славу, выдержав не менее восьми штурмов сайелаянов, которые завершились гибелью самого короля Нхайена Хронга в последнем сражении.\n\nОднако после успешного завоевания Нонгханака Нари Саранги в X веке от И. С. стратегическое значение Рантако уменьшилось. Тем не менее замок остается стойким оплотом и служит последней линией обороны, защищающей сердце Вехангуна."
 building_01_thornfort: "$building_type_01_thornfort$"
 building_01_thornfort_desc: "$building_type_01_thornfort_desc$"

 building_type_01_laon_ratab: "Террасы Лао Ратаб"
 building_type_01_laon_ratab_desc: "Огромная терраса в Центральном Дахангоне, Лао Ратаб была построена самим Нэкланом Золотым для обеспечения стабильного продовольствия для новосозданной цитадели [GetBuilding('01_dawang_tarmak').GetName]. Более чем в два раза превосходя по размеру своего восточного сородича, эта система террас возделывает все Четыре Великих Зерна, чередуя их в течение восьмилетнего цикла.\n\nС момента постройки Лао Ратаб кормила Банвагул, и получение контроля над ней необходимо каждому, кто стремится ступить по стопам Нэклана."
 building_01_laon_ratab: "$building_type_01_laon_ratab$"
 building_01_laon_ratab_desc: "$building_type_01_laon_ratab_desc$"

 building_type_01_laon_gia: "Террасы Лао Гиа"
 building_type_01_laon_gia_desc: "Построенная в далеком прошлом, терраса Лао Гиа кормила целые поколения людей. Почитаемая как величайшее достижение Ламарка, одного из предков Банвагула, постройка террасы закрепила их положение как выдающегося клана среди племен Дахангона. Несмотря на ее размеры, в Лао Гиа выращивают лишь одну культуру — Дакарем, или Королевский рис.\n\nС годами значение Лао Гиа уменьшилось, особенно после постройки Лао Ратаб. Тем не менее она оставалась жизненно важным источником пищи для Банвагула в центральном Дахангоне, особенно для тех, кто обитает в его отдаленных болотах."
 building_01_laon_gia: "$building_type_01_laon_gia$"
 building_01_laon_gia_desc: "$building_type_01_laon_gia_desc$"

 building_type_01_rakarongs_lair: "Логово Ракаронга"
 building_type_01_rakarongs_lair_desc: "#inno_quote «Страшитесь мощи Ракаронга, отца крокодилов и непревзойденного владыки Такадая.\n\nЕго зубы — кинжалы из алмаза, его шкура — из адаманта».#! \n\nС древнейших времен логово Ракаронга делало лес Такадай почти непроходимым, разделяя Дахангон надвое. Многие герои и прославленные воины пытались и не смогли избавить землю от этого чудовища — и главным среди них был Налай, сын самого Нэклана.\n\nИбо куда опаснее силы Ракаронга его хитрость и колдовство. Слагают сказания о путниках, завлеченных видом идиллической поляны в глуши леса, лишь для того, чтобы их сон наяву внезапно оборвался оглушительным смыканием челюстей."
 building_01_rakarongs_lair: "$building_type_01_rakarongs_lair$"
 building_01_rakarongs_lair_desc: "$building_type_01_rakarongs_lair_desc$"

 building_type_01_fount_of_heroes: "Датунг Наяб"
 building_type_01_fount_of_heroes_desc: "Спрятанный глубоко в северных горах, Датунг Наяб представляет собой зачарованный оазис в роще мистической флоры. Почитаемый как обитель глубокой духовности, именно здесь начинается каждое сказание о героях или эпос — обычно в результате пророчеств, изреченных шаманами, испившими его вод. Последователи Лемад Дакта стекаются к Датунг Наяб, ибо их орден не только родился в этой роще, но и считается, что один единственный глоток из водоема способен увеличить их силу десятикратно."
 building_01_fount_of_heroes: "$building_type_01_fount_of_heroes$"
 building_01_fount_of_heroes_desc: "$building_type_01_fount_of_heroes_desc$"

 building_type_01_neos_ypsikenon: "Неос-Ипсикенон"
 building_01_neos_ypsikenon: "Акрополь Неос-Ипсикенона"
 building_01_neos_ypsikenon_desc: "Великая цитадель Неос-Ипсикенона на вершине холма, возведенная, чтобы повелевать морскими путями и защищать побережье. Ее стены отпугивают налетчиков, а удобное положение привлекает как торговцев, так и поселенцев."
 building_02_neos_ypsikenon: "Верфи Неос-Ипсикенона"
 building_02_neos_ypsikenon_desc: "Высеченные в естественной гавани под Акрополем, верфи Неос-Ипсикенона делают город гаванью, не похожей ни на одну другую. Флотилии снабжаются и отбывают куда быстрее, а стабильный доход от кораблестроения обеспечивает процветание города."

 # DATA LINKED BUILDINGS
 # These are buildings that have their descs changed to link the characters mentioned to the in-game historical character

 building_type_01_tur_senach: "Тур Сенах"
 building_01_tur_senach: "Кольцевая стена Тур Сенаха"
 building_01_tur_senach_desc: "Прежде чем [GetBuilding('02_tur_senach').GetName] была построена хотя бы наполовину, ее великая кольцевая стена уже возвышалась и защищала строительную площадку от множества угроз; ибо в те дни непокорные племена $skycrown_link$ Небесной Короны#! все еще роптали против $dailennir_culture_key_link_switch$ власти над их землями, над ними нависала сила Мальхадора, а непостоянные гиганты Железного Хребта были многочисленны.\n\nЭти грандиозные укрепления лишь изредка оказывались пробиты, несмотря на многочисленные попытки самых разных претендентов оспорить власть Тур Сенаха. Лишь немногие подошли близко к успеху, и только две попытки увенчались победой нападавших, причем обе принадлежали претендентам из рода $breidsenach_link$ Брейдсенахов#!. $aauto_eramos_link$ Эрамос#!, вероятно, стал бы третьим, кому досталась бы эта честь, если бы коварный $general_chyvar_link$ Хивар#! сам не пригласил своего врага на [GetBuilding('03_tur_senach').GetName] в неудавшейся попытке покушения на жизнь аавтократора. С приходом веков [Concept('aversaria','аверсарианского')|E] мира и защиты в Небесную Корону значение стен стало весьма незначительным вплоть до бурных времен XII века, когда они были пробиты в третий и последний раз во время [imperial_civil_war|E] $fairest_witch_link$ Инд «Прекраснейшей Ведьмой»#!."
 building_02_tur_senach: "Шпиль Тур Сенаха"
 building_02_tur_senach_desc: "Когда Икауна «Говорящая-с-Камнем» представила план своего главного шедевра королю — шпиля, который затмил бы большинство строений, возведенных при самом Короле-Чародее, — она должна была понимать, что не доживет до его завершения. Даже на пике империи $kathanouxa_link$ Катануксы#! подобный проект потребовал бы десятилетий, а новообретенное царство $meiandun_the_exile_link$ Мейандуна Изгнанника#! в еще едва освоенных землях $skycrown_link$ Небесной Короны#! располагало лишь малой долей ресурсов Короля-Чародея. Сам Мейандун не был глупцом и наверняка понимал это, но все же дал свое согласие.\n\nИ действительно, сооружение высотой почти в фурлонг было завершено лишь во время правления третьего короля из рода $breidsenach_link$ Брейдсенахов#! столетие спустя. Камни для него добывались в этилизиакской цитадели Тракул-Караг порабощенными гигантами из клана Кримкигна, а затем каждый массивный блок обрабатывался магией. Под карнизами шпиля стоят фигуры в капюшонах, изображающие $snowbeard_link$ Элдакея «Снежную Бороду»#! и первых трех королей Брейдсенахов, чьи строгие геометрические формы сурово взирают на свои владения, а шесть вертикальных рядов слабо светящихся рун тянутся вверх по его желобчатому фасаду. На самом верху находится плоская открытая крыша — истинный нексус [magic|E] шпиля, хотя долгое время этот венец оставался незавершенным..."
 building_02_tur_senach_desc_ruined: "$building_02_tur_senach_desc$\n\n#X Верхние этажи Тур Сенаха полностью уничтожены и разметены на сотни шагов вокруг взрывом [GetBuilding('08_tur_senach').GetName] в 1200 году от И. С. Настоящее чудо, что большая часть конструкции все еще стоит, хотя бушевавший вовсю пожар выжег практически каждый этаж в здании, превратив его в обугленный остов.#!"
 building_03_tur_senach: "Нексус Алдоса"
 building_03_tur_senach_desc: "[SelectLocalization( GetPlayer.IsValid, 'building_03_tur_senach_desc_player','None')]"
 building_03_tur_senach_desc_player: "Обдуваемая ветрами вершина Тур Сенаха представляет собой мистическое чудо, насквозь пропитанное энергией вековых могущественных чар. Ее пол покрыт гипнотическим узором рунических кругов, столь же прекрасных, сколь и замысловатых, а потертые пьедесталы служат свидетельством множества ритуалов, совершенных с этих высот: ритуалов $aldos_the_mute_sage_link$ Алдоса «Немого Мудреца»#!, говорившего только с небесами, и которому отвечали звезды; Косеуна Голубое Крыло и его легендарного кабала; Трех Королей-Призывателей и их потустороннего порождения; Элдакея IV, обратившегося к некромантии ради любви; Карсена, сотрясавшего и землю, и небеса; и Мейандуна II, вступившего в сделку с силами за гранью его понимания и дорого заплатившего за свое безумие. Здесь же было место, где король Галамос отрекся от веры своих предков в пользу [GetReligionByKey('lifepath_religion').GetAdjective|V], где $fairy_of_lake_migraddr_link$ Фея Озера Миграддр#! погрузила $skycrown_link$ Небесную Корону#! во снежную тьму на пике [Glossary('Войны Чёрного тиса','WAR_OF_THE_BLACK_YEW_GLOSS')], и где $general_chyvar_link$ Хивар#! совершил отчаянное покушение на жизнь $aauto_eramos_link$ Эрамоса#!.\n\nВо времена Майикпрололлана использование этого места не угасло, хотя и стало более скрытным и таинственным. Примечателен архимаг Мелеандр, предавшийся здесь заново открытому аэлидийскому искусству хождения по планам перед своим исчезновением; а также его преемница Каллисфия, которая настолько активно использовала нексус, что возвела импровизированную лабораторию прямо на его краю и, как говорят, часто здесь спала. Нексус, без сомнения, сыграл бы ключевую роль и в апокалиптических замыслах Заговора Тысячи Лет, если бы их злодейские планы не были вовремя остановлены."
 building_03_tur_senach_desc_ruined: "$building_03_tur_senach_desc$\n\n#X Наконец, это место также стало одним из главных истоков, откуда сотворялась [selfreplicating_blood_magic] во время [imperial_civil_war] — со столь катастрофическими последствиями как для Эраса, так и для самого шпиля.#!"
 building_04_tur_senach: "Сады Лилейной Короны"
 building_04_tur_senach_desc: "Ухоженные сады, укрытые за [GetBuilding('01_tur_senach').GetName], когда-то были не более чем лугами, хвойными зарослями и россыпью хозяйственных построек. Это сильно огорчало Элдакея V «Лилейную Корону», ибо хоть он и обделен был талантом к правлению, мало кто мог оспорить его художественный вкус и любовь к прекрасному; по мере его правления территория шпиля превратилась в оазис как знакомой, так и экзотической флоры, украшенный уютными водоемами и изящными изваяниями. Как и прочие увлечения короля, это делалось без оглядки на расходы, покрытие которых легло на плечи Элдакея VI «Мрачного» в ранние годы его правления.\n\nВ одном из уголков садов лежит кластер мавзолеев и склепов — место, где $snowbeard_link$ Элдакей «Снежная Борода»#! и почти все его преемники покоились веками, пока их останки не были эксгумированы и развеяны по четырем сторонам [aversaria|E] после разграбления 728 года от И. С. Ныне там остались лишь пустые гробницы, а окружающие земли были превращены Майикпрололланом в дендрарии и оранжереи для выращивания алхимических культур."
 building_04_tur_senach_desc_ruined: "$building_04_tur_senach_desc$\n\n#X Сады Лилейной Короны одичали и заросли, а большая часть более нежной флоры была вытеснена и задушена неприхотливыми растениями — как местными, так и завезёнными. Племя леших также необъяснимым образом захватило обширные участки территории и не потерпит никакого вторжения на «свою» землю.#!"
 building_05_tur_senach: "Библиотека Тур Сенаха"
 building_05_tur_senach_desc: "Средние этажи шпиля представляли собой лабиринт скрипториев и архивов по меньшей мере со времен правления $aldos_the_mute_sage_link$ Алдоса «Немого Мудреца»#!. К последним дням независимости $skycrown_link$ Небесной Короны#! они разрослись в крупнейшее хранилище знаний во всем $reach_link$ Пределе#!; это первенство внезапно оборвалось, когда $aauto_eramos_link$ Эрамос#! приказал очистить его еловые полки дочиста. Однако, по воле судьбы, башня вскоре стала резиденцией зарождающегося Майикпрололлана, и в течение следующего столетия в пустые книжные шкафы снова хлынул поток фолиантов и свитков.\n\nС начала IX века на этих этажах также располагались покои правителей Тур Сенаха. Архимаг Теонид счел старые королевские покои $breidsenach_link$ Брейдсенахов#! слишком просторными и сквозистыми как для своего личного вкуса, так и для скрипящих костей, и переоборудовал группу комнат в более скромный, но уютный кабинет и спальню. Даже после того как его преемники покинули шпиль ради [mayikrata|E], некоторые, как известно, предпочитали уютный комфорт этих комнат своим более грандиозным официальным апартаментам. В частности, легендарный архимаг Каталитос Старший не любил ничего больше, чем раскуривать трубку под треск камина, пока дождь тихо стучал по окнам кабинета, и он приписывал именно этому месту некоторые из величайших озарений за свою долгую и славную карьеру."
 building_05_tur_senach_desc_ruined: "$building_05_tur_senach_desc$\n\n#X Большая часть библиотек шпиля в 1200 году сгорела дотла, снова лишив его сокровищ знаний. Покои Теонида, однако, остались удивительно невредимыми — без сомнения, в результате защитной магии, оставленной одним из их прежних жильцов.#!"
 building_06_tur_senach: "Купальни Тур Сенаха"
 building_06_tur_senach_desc: "Глубоко в фундаменте [GetBuilding('02_tur_senach').GetName] находится комплекс подземных сводов, служивших королевскими купальнями со времен Элдакея IV. Питаемые теплыми источниками из самых глубин — некоторые говорят, из самого Подземья Железного Хребта, — эти бирюзовые бассейны дают утешительный отдых как в суровые холодные зимы Небесной Короны, так и в ее знойное лето. Помимо того, что бассейны были одной из самых любимых бытовых удобств комплекса, их также время от времени использовали при сотворении магии [aspect_water]; печально известно и то, что именно через них Фея Озера Миграддр и ее родичи проникли в шпиль, перебили его жителей и захватили [GetBuilding('03_tur_senach').GetName] во время [Glossary('Войны Чёрного тиса','WAR_OF_THE_BLACK_YEW_GLOSS')].\n\nМногие из первых архимагов также питали большую любовь к купальням. Несмотря на общую аскетичность их правления в Тур Сенахе, дополнительно были построены два бассейна с холодной и три с горячей водой, а также целая парилка; большая часть — во времена Теонида, который настолько любил купание, что часто проводил собрания прямо во время приема ванн."
 building_06_tur_senach_desc_ruined: "$building_06_tur_senach_desc$\n\n#X Хотя купальни в некоторой степени уцелели во время опустошительных событий 1200 года от И. С. благодаря своему подземному расположению, некоторые из них частично обрушились. Большая часть оригинальных труб также получила значительные повреждения, а самые нижние помещения затоплены.#!"
 building_07_tur_senach: "Паноптикон"
 building_07_tur_senach_desc: "Помещение, не видевшее дневного света с момента своего создания, окруженное пятнадцатью зеркалами из полированного серебра, двумя из золота и одним из чистейшего лунаргентума: это Паноптикон Тур Сенаха, где со времен постройки королевой Икауэн совершались сотни как малых, так и великих прорицательских ритуалов. Если верить песням бардов, она соглашалась принять руку только того жениха, который сумеет войти в [GetBuilding('02_tur_senach').GetName] так, чтобы она не увидела его приближения в своем творении. Очевидно, никому это не удалось, и Икауэн умерла незамужней и бездетной, погрузив $skycrown_link$ Небесную Корону#! в десятилетия кризисов наследования и гражданских войн. Паноптикон сыскал дурную славу инструмента тирании и безумия: сменявшие друг друга короли использовали его для выслеживания угроз, как реальных, так и мнимых. Ещё в те далекие дни некоторые шептались, что его видения отравлены едва заметными крупицами лжи.\n\n$general_chyvar_link$ Хивар#!, картараддский генерал, провел большую часть своих дней запертым в этих покоях, строя планы и плетя заговоры; когда петля $aauto_eramos_link$ Эрамоса#! затянулась, этот крайне взбалмошный человек в приступах ярости разбил несколько зеркал, и лишь при $kothexir_tharsanos_link$ Котексире Латеоксе#! они были восстановлены до прежнего состояния. Он также проникся одержимой любовью к Паноптикону, и многие полагали, что именно его видения стали причиной его таинственного исчезновения в 760 году от И. С. Хотя слухи о природе зеркал неустанно ходили весь следующий век, лишь после исчезновения Мелеандра в 846 году от И. С. большинство архимагов полностью отказались от их использования — их роль в злодейских замыслах Заговора Тысячи Лет наконец привела к официальному запрету зеркал во всех случаях, кроме самых крайних."
 building_07_tur_senach_desc_ruined: "$building_07_tur_senach_desc$\n\n#X Солнечный свет проник в некогда нерушимую тьму Паноптикона, а его зеркала потускнели и окончательно утратили свою силу.#!"
 building_08_tur_senach: "Алхимикариум"
 building_08_tur_senach_desc: "Позднее дополнение к шпилю, Алхимикариум был одной из самых передовых лабораторий своего времени. Его услугами часто пользовалась $aauto_theyssia_link$ Аавтократриса Тессия#!, и многие из самых чудесных алхимических открытий ее правления были сделаны в этих полутемных залах — такие как первый в истории этериум и халаккизиум, а также совершенные формулы алькагеста, лунаргентума и гемиума.\n\nУвы, смерть ее величайшей покровительницы и перенос резиденции Майикпрололлана в [mayikrata|E] привели к тому, что значение лаборатории сильно угасло. Кастеляны шпиля часто сдавали эти комнаты ремесленникам более низкого ранга, и уход за ними становился все более небрежным. Безуспешные попытки Анилиаса Ксенеферона искусственно создать черную сталь в конце X века привели к тому, что несколько комнат были полностью поглощены тьмой; десятилетия работы гильдии конейкменеров Святых Бессмертных, Благословенных Их Красотой, привели стареющее оборудование в столь плачевное состояние, что половину в итоге пришлось заменить подержанными вещами из [mayikrata|E]; крупный розлив эктоплазмы в 1075 году от И. С. привел к тому, что заброшенные залы стали постоянным пристанищем призраков; а вспышка жуткой плесени «Бледный палец» в 1134 году от И. С. окончательно заставила запечатать ее потускневшие посеребренные двери."
 building_08_tur_senach_desc_ruined: "$building_08_tur_senach_desc$\n\n#X Самый сокрушительный удар по Тур Сенаху нанесла вовсе не сама [frodbrokna], а буйный всплеск энергий [aspect_fire], поджегший летучие запасы Алхимикариума. Взрыв был настолько мощным, что сорвал верхние этажи шпиля, а оставшийся после него яркий пожар бушевал почти год.#!"
 dailennir_culture_key_link_switch: "[SelectLocalization(HasGameStartedForTheFirstTime, 'dailennir_switch_true', 'dailennir')]"
 dailennir_switch_true: "[GetCultureByKey('dailennir').GetName|V]"

 building_type_01_fidhasil: "Фидасил"
 building_type_01_fidhasil_desc: "На закате своего правления $kathanouxa_link$ Катанукса#! пришел к берегам озера Тихедд, пленившись слухами о пророческом буке. Сказания не врут: дерево действительно даровало Королю-Чародею свое самое первое пророчество — о его собственной смерти. Разгневанный, он приказал сжечь его за непокорность; однако Фидасил быстро восстановился, и Катанукса пал в бою, как и было предсказано. В последующие годы многие из его потенциальных преемников искали наставления оракула, но все, кроме одной, увидели лишь мимолётные проблески славы; исключением стала $silver_hair_link$ Карттуэн Серебряноволосая#!, чью смерть Фидасил не смог узреть и чье восшествие ознаменовало завершение Цикла — судьбу, за которой она гонялась годы, десятилетия и века.\n\nОднако между этими двумя событиями переплелись бесчисленные меньшие нити судьбы, начертанные на коре бука. Истории великих героев и ничтожных злодеев, королей и бродяг, и королей-бродяг; фей и богов; о том, как земли $dailennir_culture_key_link_switch$ обратятся в прах, разорванные звездопоклонниками-рабами Атил-Дорома; о том, как их собственные королевства будут возвышаться и рушиться, сметенные приходом [Concept('aversaria', 'могущественной империи солнечных морей')|E]. В конце концов наступит правление последнего из регентов и И-Амантила, а за ним — лишь темная вечность. Все это предсказал Фидасил; и ничто из этого нельзя было ни отвергнуть, ни отсрочить."
 building_01_fidhasil: "$building_type_01_fidhasil$"
 building_01_fidhasil_desc: "$building_type_01_fidhasil_desc$"
 building_01_fidhasil_desc_ruined: "$building_01_fidhasil_desc$\n\n#X Дерево встретило свою истинную смерть, когда его пронзило Копье Мальхадора в 654 году от И. С., формально завершив Цикл, положив конец войне Карттуэн против мира смертных и ознаменовав начало Мирской Эры Предела. К лучшему или к худшему, оно больше никогда не станет предсказывать — или направлять — судьбы людей.#!"

 building_type_01_blackbonesofarthenax: "Черные Кости Артенакс"
 building_type_01_blackbonesofarthenax_desc: "Здесь покоятся останки $arthenax_link$ Артенакс#!, великой [Concept('dragons','драконицы')|E], которая вторгалась в [aversaria|E] и выжигала ее земли на протяжении более чем десятилетия в V веке. Артенакс и ее дети явились с северо-востока через несколько столетий после того, как [Concept('aversaria','аверсарианцы')|E] посчитали драконов вымершими; они убили аавтократора Деноса, после чего потребовали верности от народа Аверсарии. Артенакс и ее порождения были повержены лишь благодаря вмешательству [magi|E] $aauto_aeliadias_link$ Аэлиадиас#!, чья магия была настолько могущественной, что ее пламя обратило драконицу в пепел. Уцелели лишь ее кости, лежащие здесь и по сей день."
 building_01_blackbonesofarthenax: "Черные Кости Артенакс"
 building_01_blackbonesofarthenax_desc: "$building_type_01_blackbonesofarthenax_desc$"
 building_type_02_blackbonesofarthenax: "Мегос Наон Артенакс"
 building_type_02_blackbonesofarthenax_desc: "Великое святилище $arthenax_link$ Артенакс#! — это грандиозный комплекс, возведенный вокруг останков [Concept('dragons','драконицы')|E] Артенакс. Спустя сотни лет ее последователи наконец вернули место упокоения своей госпожи; ныне они хранят память о ней, дабы ее могучий дух не обрушил свой гнев на верных."
 building_02_blackbonesofarthenax: "$building_type_02_blackbonesofarthenax$"
 building_02_blackbonesofarthenax_desc: "$building_type_02_blackbonesofarthenax_desc$"

 building_type_01_grod_cruprag: "Грод Крупраг"
 building_type_01_grod_cruprag_desc: "Высеченный в северном склоне Черных Гор, Грод Крупраг представляет собой неприступную крепость-поместье $sarridians_culture_key_link_switch$ полководца $oulnir_link$ Оулнира Гурдурбока#!. Намереваясь сделать это место имперским центром своего владычества на севере, Гурдурбок не жалел средств на строительство, возведя замок, практически неприступный для традиционной осады. К сожалению, эти укрепления оказались бесполезны против шпионажа, и [Concept('aversaria','аверсарианские')|E] силы смогли устранить Гурдурбока прямо в его цитадели в последние дни [Concept('the_black_mountain_war','Войны Черных Гор')|E]. Из-за отсутствия штурма крепость осталась практически невредимой и по-прежнему служит надежным оплотом для любого укрывшегося в ней правителя."
 building_01_grod_cruprag: "Грод Крупраг"
 building_01_grod_cruprag_desc: "$building_type_01_grod_cruprag_desc$"
 sarridians_culture_key_link_switch: "[SelectLocalization(HasGameStartedForTheFirstTime, 'sarridians_switch_true', 'sarridians')]"
 sarridians_switch_true: "[GetCultureByKey('sarridians').GetName|V]"

 building_type_01_light_of_guillate: "Свет Гийята"
 building_type_01_light_of_guillate_desc: "В заливе Маньотт при поддержке Совета Пяти был возведен величественный маяк впечатляющей высоты. Созданный как дань уважения легендарному герою и спасителю [Concept('shatteredisles','Островов')|E], Свет Гийята указывает путь заблудшим кораблям к ныне процветающей гавани. Увековечивая Похищение Знамен, маяк изображает $guillate_link$ Гийата#! с факелом в руках, освещающего путь к $konijkmener_culture_key_link_switch$ флоту для своих вооруженных последователей. Наблюдаемое изображение событий часто оспаривается странствующими последователями Гийата, называющими его приукрашенной ложью."
 building_01_light_of_guillate: "Свет Гийята"
 building_01_light_of_guillate_desc: "$building_type_01_light_of_guillate_desc$"
 konijkmener_culture_key_link_switch: "[SelectLocalization(HasGameStartedForTheFirstTime, 'konijkmener_switch_true', 'konijkmener')]"
 konijkmener_switch_true: "[GetCultureByKey('konijkmener').GetName|V]"

 building_type_00_mond_graz_castle: "Руины замка Мон-Грац"
 building_type_00_mond_graz_castle_desc: "Великий замок $illurdian_link$ иллюрдианцев#! пал, а его неприступные стены оказались бессильны перед постигшим его бедствием. Замок Мон-Грац отправился вслед за своими создателями и теперь принадлежит лишь истории, а его вздымавшиеся к небу башни разрушены и повержены."
 building_00_mond_graz_castle: "Руины замка Мон-Грац"
 building_00_mond_graz_castle_desc: "$building_type_00_mond_graz_castle_desc$"
 building_type_01_mond_graz_castle: "Замок Мон-Грац"
 building_type_01_mond_graz_castle_desc: "Возведенный в конце IX века от И. С. $karth_illurdian_link$ королем Картом Иллюрдианом#! из $perignan_link$ Периньяна#!, внушительный замок Мон-Грац гордо возвышается на вершине Западных гор Ранос. Хотя его строительство завершилось лишь к концу правления короля Карта, устремленные ввысь башни Мон-Граца стали символом $illurdian_link$ иллюрдианского#! могущества.\n\nЗамок был захвачен и поврежден еще в самом начале [red_river_war|E], что, как ни парадоксально, спасло его от опустошения во время последующего вторжения [Concept('arch_lich','архилича')|E] [silas_stavro|E]. С тех пор он был восстановлен сменявшими друг друга владыками и превратился в неприступную каменную крепость, защищающую юго-западные перевалы Периньяна, а также сдерживающую склонный к бунтам город Аостопорт на востоке.\n\nИменно в этом замке $rene_vouirard_link$ дюк Рене де Вуарар#! сдерживал войска [Concept('black_gold_war','Черно-золотой лиги')|E], остановив их стремительное продвижение на запад. Это дало достаточно времени для подхода подкреплений $gardfrei_link$ Гардфрея#!, что привело к неожиданному тупику в ранее односторонней войне."
 building_01_mond_graz_castle: "Замок Мон-Грац"
 building_01_mond_graz_castle_desc: "$building_type_01_mond_graz_castle_desc$"

 building_01_lascife_mines: "Серебряный рудник Ласиф"
 building_01_lascife_mines_desc: "Марки никогда не славились особыми минеральными богатствами, а с утерей Калатипсоми в пользу зарождающейся [Concept('aversaria','Аверсарианской')|E] империи в V веке эта нехватка стала еще более острой. Предприятия сменявших друг друга верховных королей — такие как государственные наемные компании и торговые экспедиции по всему [the_continent|El], а затем и по [sarradon|E] — пытались вместо этого заполучить заморские рудники, но с переменным успехом. Мысль найти прибыльные жилы в самой [chevalie|E] была почти забыта вплоть до 1211 года от И. С., когда обвал в горах Россемон по чистой случайности обнажил богатейшие залежи серебра. При правлении $gardfrei_link$ Гардфрея#! разработка жилы началась вовсю, однако личный интерес государя к этому делу угас по мере его возрастающей одержимости более эзотерическими материями, и предприятие быстро ощутило на себе последствия административного запустения."

 building_type_01_pathospalace: "Палат ту Пафос"
 building_type_01_pathospalace_desc: "Дворец был возведен $aauto_pathos_link$ аавтократором Пафосом#! в 357 году от И. С., чтобы позволить ему править прямо с передовой, где война против [Concept('marchers','марочников')|E] за контроль над Калатипсоми быстро стала главным приоритетом для [Glossary('Аавтократии','GH_AAUTOKRATA_GLOSS')]. Пока марочники изо всех сил пытались сдержать наступление [Concept('arch_lich','Черного императора')|E] $lich_yakub_link$ Якуба «Злослова» Яковада#!, а их империя на востоке отчаянно пыталась удержать границы перед лицом многочисленных восстаний туземцев, Пафос со своими легионами устремился на север, начав вековую войну, которая завершилась триумфальной [Concept('aversaria','аверсарианской')|E] победой.\n\nПосле взятия Калатипсоми дворец в течение 300 лет служил резиденцией наместника Калатипсоми. Однако особенности колониального управления на севере сделали его неудобным для постоянного нахождения, и последующие наместники обычно правили из своих личных владений, регулярно курсируя между Мег- и Микр-Калатипсоми.\n\nСчитавшийся самым бедным из всех наместнических дворцов Аверсарии — более скромным, чем даже Палат ту Митидон, и менее престижным, чем все остальные, — он из-за своей незначительности в итоге избежал худших разрушений [imperial_civil_war|E]. Благодаря этому он и по сей день остается довольно внушительным, хоть и весьма скромным строением."
 building_01_pathospalace: "Палат ту Пафос"
 building_01_pathospalace_desc: "$building_type_01_pathospalace_desc$"

 building_00_stilto_katharoteras: "Руины Стильто Кафаротерас"
 building_00_stilto_katharoteras_desc: "$building_type_00_stilto_katharoteras_desc$"
 building_type_00_stilto_katharoteras: "Руины Стильто Кафаротерас"
 building_type_00_stilto_katharoteras_desc: "То, что когда-то было монументом величию [aversaria|E], ныне возвышается лишь как надгробие на ее могиле. В окружении руин некогда великого Ораисполя полусгнившие статуи богов и завоевателей с грустью взирают на пепелище империи."
 building_type_01_stilto_katharoteras: "Стильто Кафаротерас"
 building_type_01_stilto_katharoteras_desc: "Колонна Чистейшей стоит на центральной площади Ораисполя перед величественным Дворцом [magi|E]. Возведенная $aauto_phanagorax_link$ аавтократором Фанагораксом#! еще до основания Империи, эта массивная колонна, увенчанная золотой статуей Чистейшей и меньшим кольцом Первых Людей, покрыта спиральными желобами. Легенды гласят, что перед покорением ийросси легионы Фанагоракса возложили по шлему в самый верхний желоб, поклявшись вернуться и забрать их лишь после победы.\n\nДесятки шлемов до сих пор покоятся на самом верху, а все нижние ярусы на протяжении тысячелетия заполнялись [Concept('aversaria','аверсарианскими')|E] воинами: древний ритуал предписывал уходящим на войну солдатам оставлять шлем на удачу. Вокруг основания сложены тысячи других шлемов, и жрецы регулярно принимают посетителей, проводя торжественные церемонии в честь отправляющихся на битву воинов."
 building_01_stilto_katharoteras: "Стильто Кафаротерас"
 building_01_stilto_katharoteras_desc: "$building_type_01_stilto_katharoteras_desc$"
 building_type_01_dovatelskistlo: "Довательскистло"
 building_type_01_dovatelskistlo_desc: "После взятия Ораисполя $cenware_link$ Сокрушителем Ведьм#!, Стильто Кафаротерас была снесена его ликующими солдатами во время празднования победы. Однако обломки пролежали нетронутыми до тех пор, пока новая сьяльвольская администрация не решила превратить их в памятник своему великому вождю.\n\nТысячи шлемов, что когда-то находились в желобах колонны и горами лежали у ее подножия, были переплавлены вместе со статуями с ее вершины. Перекованный Ценвар Сокрушитель Ведьм ныне гордо возвышается на вершине в доспехах из золота и железа. У основания стоят и сидят его ликующие воины, навеки бессмерченные в металле."
 building_01_dovatelskistlo: "Довательскистло"
 building_01_dovatelskistlo_desc: "$building_type_01_dovatelskistlo_desc$"

 building_type_01_thetowerwatch: "Ролос Пирго"
 building_type_01_thetowerwatch_desc: "Стража Башни — это название целой сети монастырей, возведенных для размещения членов Алого Избранничества и Илювианского Ордена, дабы они могли наблюдать за [sea_tower|E] на северо-западе. В этом одном из крупнейших храмовых комплексов известного мира монахи Стражи Башни проводят большую часть времени, изучая Морскую Башню с помощью передовых телескопов, созданных по проекту лучших инженеров [sarradon|E] по приказу $aauto_clytomedes_link$ аавтократора Клитомеда#!, а также пытаясь толковать пророчества по игре солнечного и [Concept('aervalr','лунного')|E] света на ее полированных камнях."
 building_01_thetowerwatch: "Ролос Пирго"
 building_01_thetowerwatch_desc: "$building_type_01_thetowerwatch_desc$"

 building_type_01_silverspruce_mines: "Рудники Серебряной Ели"
 building_type_01_silverspruce_mines_desc: "Давным-давно жил-был скромный рыбак, который выловил в водах озера Энтис странного, волшебного сазана. В качестве выкупа за свою жизнь сазан даровал ему исполнение трех желаний. В ответ на первое желание — о том, чтобы его семья больше никогда не голодала, — рыба указала ему на это самое место. Обнаружив скрытые под горой богатства, рыбак отправился к своему королю — коим чаще всего называют $clothar_i_link$ Хлотаря I#!, хотя иногда и $kathanouxa_link$ Катануксу#!, $golden_rowan_link$ Сина Золотой Рябины#! или $valoric_the_good_link$ Валорика I «Доброго»#!, — который наградил его землями, где был построен этот рудник, и отдал дочь замуж за его сына.\n\nИли, по крайней мере, так гласит легенда.\n\nНа самом деле существует крайне мало доказательств этой сказки, самая ранняя письменная запись о которой относится к VI веку в #italic Летописи Мельтева#!, написанной спустя века после правления любого из упомянутых монархов. Сам же серебряный рудник впервые упоминается в указе барона Ансфрея, датированном V веком, хотя контекстные данные указывают на то, что он, вероятно, еще древнее."
 building_01_silverspruce_mines: "Шахтерское поселение Серебряной Ели"
 building_01_silverspruce_mines_desc: "$building_type_01_silverspruce_mines_desc$"
 building_02_silverspruce_mines: "Рудник Серебряной Ели"
 building_02_silverspruce_mines_desc: "$building_type_01_silverspruce_mines_desc$"
 building_03_silverspruce_mines: "Большой рудник Серебряной Ели"
 building_03_silverspruce_mines_desc: "$building_type_01_silverspruce_mines_desc$"
 building_04_silverspruce_mines: "Горнодобывающий комплекс Серебряной Ели"
 building_04_silverspruce_mines_desc: "$building_type_01_silverspruce_mines_desc$"

 building_type_01_dryadstones: "Камни Дриад"
 building_type_01_dryadstones_desc: "Рунные камни и ритуальные круги — не редкость в древней сельской местности Калатипсоми, однако круг, возвышающийся к северо-востоку от озера Девин, бесспорно является самым впечатляющим — и, пожалуй, самым легендарным во всем регионе. Здесь отчаявшаяся $silver_hair_link$ Карттуэн Серебряноволосая#! безуспешно молила древние силы леса вернуть ей зрение, получив взамен лишь указания, которые привели ее в неведомое место. Спустя два века после нее $clothar_ii_link$ король Хлотарь II#! был очарован Ведьмой Камней Дриад в этих священных местах, и именно здесь был освящен их нечестивый союз — вероятно, он стал первым, но далеко не последним последователем Путей Жизни, кто вел здесь тайные дела с феями.\n\nВ начале VII века восемь баронов, восемь путеводцев и восемьдесят восемь [magi|E] пришли сюда, чтобы заключить перемирие с силами прошлого и умиротворить гнев зайца — хрупкое перемирие, которое продлилось всего несколько лет, прежде чем Кивернир Тьялион по глупости нарушил его, сжегши [GetBuilding('01_fidhasil').GetName] и тем самым обрушив Владычество Пчелы на и без того пораженный Предел. Но самым легендарным событием, без сомнения, стало заключение Перемирия Очага и Леса после [Glossary('окончательного поражения в 654 году И. С.','WAR_OF_THE_BLACK_YEW_GLOSS')] вернувшейся Карттуэн, навсегда разграничившее границы между силами прошлого и владениями людей, а также положившее конец большей части кровопролития, терзавшего регион последнюю половину столетия."
 building_01_dryadstones: "$building_type_01_dryadstones$"
 building_01_dryadstones_desc: "$building_type_01_dryadstones_desc$"

 ## Sarradonian Desert Buildings##
 building_type_01_lmeih_complex: "Лмейхский комплекс"
 building_type_01_lmeih_complex_desc: "Массивный соляной комплекс, построенный в ложе протяженного высохшего озера. Лмейхский комплекс веками служил правителям [Glossary('Утерайерабу','sarradonian_desert_encyclopedia_desc')] невероятным источником дохода, ежегодно отправляя два огромных каравана соли, доставляющих колоссальные соляные плиты для торговли на побережье [sarradon|E] и за его пределы."
 building_01_lmeih_complex: "$building_type_01_lmeih_complex$"
 building_01_lmeih_complex_desc: "$building_type_01_lmeih_complex_desc$"
 building_02_lmeih_complex: "$building_type_01_lmeih_complex$"
 building_02_lmeih_complex_desc: "$building_type_01_lmeih_complex_desc$"
 building_03_lmeih_complex: "$building_type_01_lmeih_complex$"
 building_03_lmeih_complex_desc: "$building_type_01_lmeih_complex_desc$"
 building_04_lmeih_complex: "$building_type_01_lmeih_complex$"
 building_04_lmeih_complex_desc: "$building_type_01_lmeih_complex_desc$"

 building_00_lmeih_complex: "Руины Лмейхского комплекса"
 building_00_lmeih_complex_desc: "Когда-то здесь возвышался массивный Лмейхский комплекс, чья соледобыча веками питала баснословное богатство восточного [sarradon|E] посредством полугодовых соляных караванов."
 
 building_type_01_mutsars_well: "Колодец Мутсара"
 building_type_01_mutsars_well_desc: ""
 building_01_mutsars_well: "Колодец Мутсара"
 building_01_mutsars_well_desc: "Колодец Мутсара представляет собой систему небольших озер на севере [Glossary('Саррадонской пустыни','sarradonian_desert_encyclopedia_desc')], известных своим необычным сочетанием пресной и соленой воды. Все озера, кроме одного, пресные; это самое крупное озеро в центре оазиса круглый год источает слабое свечение. Колодец издавна поддерживает изобилие жизни в суровой пустыне и считается местом, где $mutsar_link$ вождь Мутсар#! собрал свои войска для [marmaladid_invasion_sihnimiyyah|E]. Впоследствии он стал важным священным местом для многих [Concept('marmaladid_great_tribes','Великих Племен')|E]."
 
 building_type_01_the_folly: "Безумие"
 building_type_01_the_folly_desc: "Свирепый вулкан в глубине [Glossary('Усеххарских гор','USEHHAR_MOUNTAINS_GLOSS')]; «Безумие» было названо так [Concept('marmaladid_great_tribes','мармаладидами')|E] в память о месте, где два древних [marmaladid_chosen_magi|E], один из которых предположительно был ребенком Мармала, сошлись в жестокой дуэли, расколовшей землю под их ногами и поглотившей обоих целиком. С тех пор «Безумие» стоит зияющей пастью с двумя чудовищными кальдерами, окруженными полями ядовитых фумарол. Редко кто отваживается забрести сюда, за исключением редких [magi|E], стремящихся овладеть сокрытой в глубине колоссальной силой."
 building_01_the_folly: "Безумие"
 building_01_the_folly_desc: "$building_type_01_the_folly_desc$"

 building_type_01_tomb_of_the_starborn: "Гробница Звездорожденной"
 building_type_01_tomb_of_the_starborn_desc: ""
 building_01_tomb_of_the_starborn: "Гробница Звездорожденной"
 building_01_tomb_of_the_starborn_desc: "Гробница Звездорожденной была возведена вскоре после внезапной и неожиданной смерти $dawas_link$ Давас#!. Преданнейшие сторонники перенесли ее в гробу из метеорита в глубь [Glossary('Усеххарских гор','USEHHAR_MOUNTAINS_GLOSS')] и с помощью [magic|E] погребли себя вместе с ней под цитаделью из песчаника. Паломники, достигающие безмолвного мавзолея, часто рассказывают о его тревожной и торжественной атмосфере."
 
 building_type_01_imutargit: "Имутаргит"
 building_type_01_imutargit_desc: ""
 building_01_imutargit: "Имутаргит"
 building_01_imutargit_desc: "Монументальный обелиск из песчаника, возведенный с помощью магии [magic|E], отмечает место, где великая $utyal_link$ Утьяль#!, как гласят предания, приняла смертельный яд и беседовала с Пауком три дня и три ночи. На четвертый день она поднялась из-под скал и поведала своим последователям все, что смогла узнать.\n\nМеньше чем за год армии Утьяль начали опустошать северо-восточные берега [sarradon|E], а древний обычай [Glossary('Тальфасомолл','tafasomoll_glossary_desc')] распространился по всей [Glossary('Великой пустыне','sarradonian_desert_encyclopedia_desc')] со скоростью лесного пожара."

 building_type_01_umrawet: "Умравет"
 building_type_01_umrawet_desc: ""
 building_01_umrawet: "Умравет"
 building_01_umrawet_desc: "Обширная система пещер, как естественных, так и рукотворных, где, во всяком случае по мнению [Concept('marmaladid_great_tribes','Великих Племен')|E], полубог Исетар сражался с богиней-демоницей Тифравенат в ее владениях. Тифравенат охотилась на младенцев проходивших через эти земли племен, пока Исетар не поверг ее. С тех пор пещеры служат местом отдыха и встреч для путешественников и караванов, находясь на перекрестке между глубокой пустыней и дорогами, ведущими к побережью. На их стенах запечатлены тысячелетия молитв и оберегов, оставленных ради защиты и удачи для всех идущих следом, как того требует традиция."

 building_type_01_fadruwatoasis: "Оазис Фадруват"
 building_type_01_fadruwatoasis_desc: ""
 building_01_fadruwatoasis: "Оазис Фадруват"
 building_01_fadruwatoasis_desc: "Оазис Фадруват расположен в [Glossary('Саррадонской пустыне','sarradonian_desert_encyclopedia_desc')]. Согласно кочевым устным преданиям, оазис существует с тех пор, как Мельтихал и ее народ были изгнаны в пустыню. Лишенные всего, что у них было, они были обречены на скитания и смерть «людьми-демонами» в качестве жертвы Чудовищу, Способному Проглотить Горы. Но пустынные боги сжалились над смертными и укрыли их. И из ничего они создали великий оазис, чья вода бьет прямо из песка, пальмы поднимаются, давая спасительную тень, а плоды питают голодающих."

 building_01_zokah_forest: "Лес Зоках"
 building_01_zokah_forest_desc: "Ни один кедровый лес северного [sarradon|E] не сравнится по странности с великими чащами Зокаха. Его искривленные и мрачные деревья отливают бледным оттенком и обладают мистическими свойствами, почитавшимися царями и мудрецами древности.\n\nИ все же этот лес — лишь бледная тень самого себя, ведь когда-то его кроны простирались до самого горизонта. Ныне Зоках обходят стороной большинство путников, ибо местные клянутся, что древние деревья шепчут тем, кто забредет слишком глубоко..."

 building_type_01_beaconlight: "Светоч"
 building_type_01_beaconlight_desc: "Когда война за руины Неветексона спалила всё, что ещё могло гореть, и мир наконец стал достижим, [magi|E] Зекрос поднялся на самый высокий уступ пещеры и зажёг пламя, которое с тех пор не угасало. Оно и поныне висит там — узел скованного магического огня, цветом подобный сердцу чёрной кузни, привязанный к скале над городом Бликбикон. Его резкий белый свет отбрасывает тени на каждую улицу города.\n\nТопливо к нему не поднимают. Его поддерживают по очереди, скрепляя службу клятвами, и каждый участник Мира Бездны несёт свою долю этой обязанности. Под Светочем нет ночи, в которой можно было бы укрыть обиду."
 building_01_beaconlight: "$building_type_01_beaconlight$"
 building_01_beaconlight_desc: "$building_type_01_beaconlight_desc$"

