 building_01_drakavil_desc: "$building_type_01_drakavil_desc$"

 building_00_easterncabal: "Алькаба Альмади"
 building_00_easterncabal_desc: "$building_type_00_easterncabal_desc$"
 building_00_easterncabal_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +100#!"

 building_01_easterncabal: "[Concept('mayikprolollans','Майикпрололлан')|E] Альмади"
 building_01_easterncabal_desc: "После периода запустения, вызванного его разрушением во время [Concept('the_decimation_of_sarradon','Халакдуна')|E], бывший оплот [Concept('sirhad','сирхадов')|E] древнего города Мади был восстановлен и превращен [Concept('aversaria','аверсарианцами')|E] в [Concept('mayikprolollans','майикпрололлан')|E]."

 building_02_easterncabal: "Алькаба Альмади"
 building_02_easterncabal_desc: "С завоеванием Хартой агионистских орденов [Concept('aversaria','аверсарианские')|E] системы, поддерживавшие Майикпрололлан Альмади, рухнули. Стремясь восстановить саррадонскую магию без помощи [Concept('sirhad','сирхадов')|E] и [Concept('mayikprolollans','майикпрололланов')|E], Харта поддержал развитие Альмади в новую школу, построенную вокруг современных ценностей стражей и отвергающую аверсарианские идеалы."

 building_01_easterntower: "Восточная башня"
 building_01_easterntower_desc: "$building_type_01_easterntower_desc$"

 building_01_elysian_pass: "Элисийский перевал"
 building_01_elysian_pass_desc: "$building_type_01_elysian_pass_desc$"

 building_01_epidaphos_mines: "Шахтерское поселение Эдидафос"
 building_01_epidaphos_mines_desc: "Хотя золото обычно ассоциируется с Опахасией, куда менее гламурное железо Эдидафоса за последние несколько веков было главным минеральным экспортом провинции. Встроенный в огромный массив слоистых утесов, этот комплекс действовал по меньшей мере со времен Храма Горного Солнца и служил основным источником железа. Хотя его значение заметно снизилось с завоеванием Калатипсоми и его собственных минеральных богатств, надежные старые рудники снова вызвали интерес, когда золотые месторождения Фанапетры на востоке иссякли, и Опахасия оказалась в отчаянной нужде в любом источнике дохода, будь он блестящим или нет."

 building_01_eponthos_mines: "Шахтерское поселение Эпонфос"
 building_01_eponthos_mines_desc: "Когда-то нефрит был известен лишь благодаря редким купцам из Катун-Кая, отваживавшимся на эпохальное путешествие на запад, чтобы продать свой товар. Соответственно, нефрит был одним из самых дорогих минералов на всем [Concept('aversaria','Разрушенном Побережье')|E], и покупали его только самые могущественные и успешные знать. Неудивительно, что когда здесь открыли месторождение камня, вскоре началась одна из крупнейших лихорадок в истории Аверсарии, и неподалеку постепенно вырос город Рея. В последующие века аверсарианские ремесленники довели искусство резьбы по нефриту почти до того же уровня, что и их собратья на Дальнем Востоке. Шахта и прилегающее к ней поселение, большей частью уцелевшие в ужасах [Concept('imperial_civil_war','имперской гражданской войны')|E], продолжают работать и по сей день — обычно на благо того местного военачальника, который контролирует это место в данный момент."

 building_01_eternal_grove: "Вечная роща"
 building_01_eternal_grove_desc: "Глубоко в сердце Зеленого моря лежит Вечная роща — священный центр партической веры. Массивные деревья навсегда закрывают земли от солнечного света, а гигантские росомахи охотятся на ничего не подозревающих путников. Незнакомый с лесом человек может подумать, что он необитаем, но кроны деревьев скрывают небольшое поселение Геабрэб, доступное только с помощью скрытых блочных подъемников и лестниц, известных лишь партикам. Геабрэб — обитель Верховного совета партиков, где они беседуют с духами и вершат судьбу мира. Когда-то Геабрэб был процветающим городом с тысячами жителей среди деревьев, пока архидруиды не повелели эвакуировать город и сжечь большинство построек. Все, что осталось — это кампус Верховного совета и несколько постоялых дворов, где усталые паломники могут дать отдых ногам.\n\nПосреди леса есть поляна, где в одиночестве стоит Драйоганн Дтохт — Древо Мира. Черпая силу из огромного месторождения [Concept('bloodcrystal','кровавого кристалла')|E], корни Драйоганн Дтохт пульсируют красной магией и, кажется, уходят в самое ядро [Concept('aeras','Эраса')|E].\n\nВокруг Древа Мира время течет иначе. Здесь царит вечная весна даже в самые суровые зимы, а мир, кажется, замедляется до черепашьего шага, стоит лишь закрыть глаза. Партические [Concept('magi','маги')|E] медитируют в тени Драйоганн Дтохт уже тысячелетиями, вслушиваясь в голоса в шелесте ветвей и падении листьев. Пока стоит Драйоганн Дтохт, партики будут едины.#!"

