 building_03_tomb_of_the_lost_desc: "$building_type_03_tomb_of_the_lost_desc$"

 building_03_turayyil_mines: "Крупный рудник Тураййиль"
 building_03_turayyil_mines_desc: "По мере того как расширяются горные работы, растут и сами рудники. Строится больше входов и выкапываются большие шахтные стволы для извлечения глубоко залегающей руды."

 building_03_universityofgiherehalwajaf: "Манзи Альфайнсуфи"
 building_03_universityofgiherehalwajaf_desc: "$building_type_03_universityofgiherehalwajaf_desc$"

 building_03_vilunnak_mines: "Крупные рудники Вилуннак Сатра"
 building_03_vilunnak_mines_desc: "Расположенный в затонувшей речной долине, горнодобывающий комплекс в Вилуннак Сатра производит наибольшее количество алмазов и других драгоценных камней в Каширии. Поселение, название которого на местном диалекте означает «Поле звезд», обязано своим минеральным богатством, как говорят, древней битве, произошедшей в этом регионе, в ходе которой могущественный [Concept('magi','маг')|E] призвал упавшую звезду, чтобы поразить своих врагов. Маг выиграл битву, а поле, где стоял его противник, превратилось в почерневшую равнину, усыпанную астральными самоцветами. Сегодня вилуннакские алмазы украшают короны многих каширийских монархов, а безделушки с этими потрясающими камнями стоят огромных денег по всему востоку."

 building_03_zakran_mines: "Большой рудник Закран"
 building_03_zakran_mines_desc: "Шахтёрский комплекс у подножия горного хребта Закран действовал по меньшей мере со времён Первого междуцарствия в Кемсаре, когда дом Себхенаф активно использовал его для финансирования своих, казалось, бесконечных конфликтов с западными соперниками. Он сохранил своё значение и после воссоединения Кемсара, оставаясь основным источником серебра на протяжении всей остальной истории империи.\n\nОднако после Битвы у Разорванной цепи рудник был захвачен молодой империей Айяр и с тех пор подпитывал большую часть её экономики."

 building_04_antimagi_chapterhouse: "Крепость антимагов"
 building_04_antimagi_chapterhouse_desc: "Позволяет нанимать [GetMaA('marcher_anti_mage').GetName] и [GetMaA('griffon_silencers').GetName] в качестве [men_at_arms|E]\n#weak Можно нанять только один полк Грифоньих усмирителей (до 5 размера)#!\n\nЭта крепость — выдающаяся сила как в политике, так и на войне, вмещающая сотни антимагов и способная отправлять их по всей [chevalie|E] и за её пределы."

 building_04_ashmarite_hospital: "Ашмаритская медицинская школа"
 building_04_ashmarite_hospital_desc: "Переросшая свои прежние границы, Ашмаритская медицинская школа теперь может похвастаться обширным кампусом и формализованной программой обучения для учеников лекарей и повитух."

 building_04_ashuku_mines: "Добывающий комплекс Ашуку"
 building_04_ashuku_mines_desc: "Завораживающий изумруд Ашуку был одним из главных товаров, переправляемых через пустыню по Гонянскому пути на протяжении всего времени существования этого маршрута. По мере роста добычи руды вокруг поселения возводятся новые литейные и плавильные цеха. Резьба по драгоценным камням стала для местных жителей вторым природой, а их мастерство славится по всему известному миру. Многие гадают, не превзошли ли они объёмы производства золотых дней [Concept('boqqarut_damotada','Боккарута')|E]."

