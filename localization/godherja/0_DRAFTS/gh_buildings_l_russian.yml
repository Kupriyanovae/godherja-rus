 building_01_irochi_damotada: "Ироти Дамотада"
 building_01_irochi_damotada_desc: "Со времен [etami_tetenik|E] Ироти Дамотада сохранила большую часть своего значения: через ее ворота проходят бесчисленные караваны, груженные сокровищами. Хотя сооружение явно переживало лучшие времена, а его гарнизона едва хватает, чтобы использовать военный потенциал, оно по-прежнему служит для торговых городов Сокой ценным проходом. Даже библиотека, пусть и не столь богатая, как прежде, все еще хранит внушительное сокровище знаний."

