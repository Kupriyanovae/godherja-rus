 building_type_01_kishi_mines: "$building_01_kishi_mines$"
 building_01_kishi_mines: "Малые кишинские рудники"
 building_01_kishi_mines_desc: "Джадеитовый рудник Киши признан крупнейшим месторождением жадеита за пределами самого Катхун-Кая. Народ сайелаянов долгое время отбивал попытки Протектората Южных Земель установить прямой контроль над рудниками, поднимая восстания всякий раз, когда их власть над ними оказывается под угрозой. Несмотря на тысячелетнюю историю добычи, в регионе все еще регулярно открываются новые жилы жадеита."
 building_02_kishi_mines: "Кишинские рудники"
 building_02_kishi_mines_desc: "$building_01_kishi_mines_desc$"
 building_03_kishi_mines: "Крупные кишинские рудники"
 building_03_kishi_mines_desc: "$building_01_kishi_mines_desc$"
 building_04_kishi_mines: "Великие кишинские рудники"
 building_04_kishi_mines_desc: "$building_01_kishi_mines_desc$"

 building_type_01_shangnyi_port: "Порт Шанъи"
 building_01_shangnyi_port: "Порт Шанъи"
 building_01_shangnyi_port_desc: "Находясь под прямым управлением Протектората Южных Земель на протяжении большей части своей недавней истории, Бэньбай время от времени служил столицей Протектората со времен [great_western_march|E]; его положение идеально как для наблюдения за землями сайелаянов, так и благодаря естественной стоянке для проходящих мимо кораблей. Порт неуклонно рос и процветал на протяжении поколений систематического развития при сменяющих друг друга протекторах-генералах, а его торговые судьбы были тесно связаны с судьбой [Concept('bureau_bronzeport','Бронзового Порта')|E].\n\nДесятки каналов расходятся от гавани, разделяя набережную на лабиринт небольших островов и позволяя товарам перемещаться между причалами, не касаясь суши. Сложная подземная дренажная система и постоянный уход со стороны [magi|E] сохраняют воды удивительно чистыми круглый год, и говорят, что торговец может узнать родной порт корабля по благовониям, все еще цепляющимся за его трюм спустя долгое время после швартовки."

 building_type_01_chinlin_royal_workshop: "Цзиньлиньская королевская мастерская"
 building_01_chinlin_royal_workshop: "Цзиньлиньская королевская мастерская"
 building_01_chinlin_royal_workshop_desc: ""

 building_type_01_nolan_shrine: "Святилище Нолана"
 building_01_nolan_shrine: "Святилище Нолана"
 building_01_nolan_shrine_desc: "Расположенное за пределами города [Glossary('Юйду','GH_YUYDU_GLOSS')], святилище Нолана представляет собой обширный комплекс дворцов, посвященных [Glossary('Нолану','GH_NOLAN_GLOSS')] и правителям династии Цзиньлинь сменявшим друг друга. Богате украшенное рельефами, изображающими деяния прошлых правителей, оно служило как родовым святилищем дома, так и одним из величайших символов правящей власти."

 building_type_01_the_lee_canal: "Канал Леюн"
 building_01_the_lee_canal: "Канал Леюн"
 building_01_the_lee_canal_desc: "Канал Леюн представляет собой разветвленную сеть водных путей, каналов и дамб, окружающих город Ганилок. Возведенный по заказу верховного министра Леюн Тинга из [Concept('bureau_bronzeport','Бронзового Порта')|E], этот амбициозный гидротехнический проект превратил подверженную наводнениям равнину Каэйок в плодородные сельскохозяйственные угодья, обеспечив Бронзовый Порт надежным источником пресной воды. Издавна прославляемый как одно из величайших инженерных достижений Бронзового Порта, канал сыграл важнейшую роль в превращении города в главный порт [Glossary('Дахангона','dahangon_lowlands_encyclopedia_desc')].\n\nВека запустения привели к тому, что большая часть канала пришла в негодность. Водные пути заилились, дамбы разрушились, и сезонные наводнения вновь угрожают окрестным землям. Без масштабной реставрации канал Ли может в конечном счете стать для Бронзового Порта столь же великой угрозой, сколь и река, которую он был призван обуздать."
 building_02_the_lee_canal: "Канал Ли"
 building_02_the_lee_canal_desc: "Канал Леюн представляет собой разветвленную сеть водных путей, каналов и дамб, окружающих город Ганилок. Возведенный по заказу верховного министра Леюн Тинга из [Concept('bureau_bronzeport','Бронзового Порта')|E], этот амбициозный гидротехнический проект превратил подверженную наводнениям равнину Каэйок в плодородные сельскохозяйственные угодья, обеспечив Бронзовый Порт надежным источником пресной воды. Издавна прославляемый как одно из величайших инженерных достижений Бронзового Порта, канал сыграл важнейшую роль в превращении города в главный порт [Glossary('Дахангона','dahangon_lowlands_encyclopedia_desc')].\n\nПосле восстановления канал Ли вновь обуздывает воды реки Тагсан. Равнина Каэйок возвратилась к процветанию, в то время как поля, гавани и растущее население Бронзового Порта продолжают зависеть от грандиозных гидротехнических сооружений, впервые задуманных верховным министром Ли Тингом."

 building_01_yannden_prefectural_city: "Крепость Яньндэнь"
 building_01_yannden_prefectural_city_desc: "Уютно расположившись на берегах реки Цан, крепость Яньндэнь была возведена во время [age_of_strife|E] восходящим Долоканским королевством в качестве как грозного оплота, так и резиденции своей правящей династии.\n\nХотя большая часть комплекса была разрушена во время [renshen_calamity|E], позже он был восстановлен как столица вновь созданного [military_protectorate_of_the_silangur_highlands|E] и превратился в крупнейшую монашескую резиденцию ордена Биньяр в Наньмай-Бон."
 building_type_01_yannden_prefectural_city: "$building_01_yannden_prefectural_city$"
 building_type_01_yannden_prefectural_city_desc: "$building_01_yannden_prefectural_city_desc$"
 building_02_yannden_prefectural_city: "$building_01_yannden_prefectural_city$"
 building_02_yannden_prefectural_city_desc: "$building_01_yannden_prefectural_city_desc$"
 building_03_yannden_prefectural_city: "$building_01_yannden_prefectural_city$"
 building_03_yannden_prefectural_city_desc: "$building_01_yannden_prefectural_city_desc$"



 building_type_01_angkaontara_ruin: "Руины Ангаконтары"
 building_01_angkaontara_ruin: "Руины Ангаконтары"
 building_01_angkaontara_ruin_desc: "Ангаконтара была возведена в 158 г. И. С., после того как бог-король Ру завершил объединение мелких городов-государств бассейна реки Киранги, чтобы хранить накопленные знания известного мира. Номинально открытая для всех искателей знаний, библиотека своим великолепием не спаслась от [age_of_the_warring_cities|E]: она была сожжена собственным народом в хаосе эпохи и с тех пор лежит в руинах."

 building_type_01_the_pirate_kings_throne: "Порт Трона Короля"
 building_01_the_pirate_kings_throne: "Порт Трона Короля"
 building_01_the_pirate_kings_throne_desc: "Здесь покоится [tarmyu|E], пират и правитель [rovarska_biozone|E]. Это была резиденция, из которой он отдавал приказы при жизни, откуда и название: Порт Трона. Хотя построенная им пиратская империя давно пала, укоренившаяся традиция превратила Тронный Порт в де-факто место сбора пиратов Роварски. Когда крупные события потрясают пиратский мир, корсары всех мастей стекаются сюда, чтобы обсудить происходящее и выработать коллективный ответ."

 building_type_01_lava_land: "Дворец Бхумираджи"
 building_01_lava_land: "Дворец Бхумираджи"
 building_01_lava_land_desc: "Бхумираджа был самым богатым из древних городов Мутанде, своим процветанием обязанный исключительно богатой металлами почве. Инженеры-маги города славились по всему [aeras|E] своим мастерством, а его народ, как говорили, добывал саму кровь Эраса из глубоких недр. Это богатство во всем своем великолепии было выставлено напоказ во дворце Бхумираджи, построенном из металла всех видов и инкрустированном каждым драгоценным камнем, известным на Эрасе — поговаривали, что путешественники, богатые и бедные, падали на колени в благоговейном трепете перед ним.\n\nНо однажды земля сама взревела в ярости, разгневанная жадностью своих обитателей, и поглотила город в лаве. Сами мутанде верили, что [magi|E] из сайелаянов, завидуя тому, что его собственный город никогда не сравнится с ним по красоте, уничтожил его лично. Какова бы ни была истина, разрушение Бхумираджи ознаменовало падение самих мутанде."

 building_type_01_golden_glow_temple: "Храм Золотого Сияния"
 building_01_golden_glow_temple: "Храм Золотого Сияния"
 building_01_golden_glow_temple_desc: "Храм Золотого Сияния — типичное святилище туаньтяньского стиля срайдян, притаившееся в огромной естественной пещере в северо-восточных отрогах Хараданских гор. Основанный в начале VIII века туаньтяньскими практиками срайдян, бежавшими от преследований в Катхун-Кае, он стал одним из главных святилищ этой веры в Наньмай-Бон.\n\nНесмотря на относительную веротерпимость в регионе, растущее присутствие секты вызывало все больше подозрений у властей. Во время [hanwei_movement|E] в 754 г. И. С. войска Катхун-Кая обрушились на храм, предав его огню и оставив большую часть святилища в руинах."
 building_02_golden_glow_temple: "Храм Золотого Сияния"
 building_02_golden_glow_temple_desc: "Храм Золотого Сияния — типичное святилище туаньтяньского стиля срайдян, притаившееся в огромной естественной пещере в северо-восточных отрогах Хараданских гор.\n\nОснованный практиками, бежавшими от преследований в Катхун-Кае в начале VIII века, он издавна стоял среди главных святилищ этой веры в Наньмай-Бон. Хотя он был разрушен во время преследований периода [hanwei_movement|E] в VIII веке, храм с тех пор был восстановлен, вновь приветствуя паломников и служа местом паломничества и поклонения."

 building_type_01_yeiqushen_high_wall: "Высокая Стена Ейцюшэнь"
 building_01_yeiqushen_high_wall: "Высокая Стена Ейцюшэнь"
 building_01_yeiqushen_high_wall_desc: "[Glossary('Высокая Стена Ейцюшэнь','GH_HIGH_WALL_GLOSS')], арсенал Протектората Южного Моря, представляет собой город, построенный специально для ремесленников. Используя колоссальную магическую энергию реки, город был спроектирован с многочисленными самодействующими гидравлическими механизмами. С помощью [magi|E], владеющих гидрокинезом, он мог вместить тысячи одновременно кующих мастеров. Благодаря катхунской системе ремесленных домохозяйств эти ремесленники, веками служившие Высокой Стене из поколения в поколение, превратились в уникальные ремесленные дома. Каждая семья освоила особые методы ковки, поддерживая своими непревзойденными приемами кампании Протектората в регионе Южного Моря.\n\nОчевидно, что Высокая Стена Ейцюшэнь понесла тяжелый урон. Большинство объектов лежат в руинах, заброшены и опустошены. Число ремесленников сократилось до ничтожной доли, техники были в значительной степени утрачены, а эффективность производства оружия резко упала, едва позволяя поддерживать полную цепочку поставок."
 building_02_yeiqushen_high_wall: "Высокая Стена Ейцюшэнь"
 building_02_yeiqushen_high_wall_desc: "[Glossary('Высокая Стена Ейцюшэнь','GH_HIGH_WALL_GLOSS')], арсенал Протектората Южного Моря, представляет собой город, построенный специально для ремесленников. Используя колоссальную магическую энергию реки, город был спроектирован с многочисленными самодействующими гидравлическими механизмами. С помощью [magi|E], владеющих гидрокинезом, он мог вместить тысячи одновременно кующих мастеров. Благодаря катхунской системе ремесленных домохозяйств эти ремесленники, веками служившие Высокой Стене из поколения в поколение, превратились в уникальные ремесленные дома. Каждая семья освоила особые методы ковки, поддерживая своими непревзойденными приемами кампании Протектората в регионе Южного Моря. \n\n Часть кузнечных мощностей остается в строю, однако многие периферийные вспомогательные сооружения пришли в негодность. Немногие оставшиеся ремесленники борются за поддержание полуразрушенных механизмов. Некогда бушевавшие пламенем печи затухают, а их некогда исключительное мастерство, ограниченное скудным оборудованием, способно создавать лишь самое примитивное оружие."
 building_03_yeiqushen_high_wall: "Высокая Стена Ейцюшэнь"
 building_03_yeiqushen_high_wall_desc: "[Glossary('Высокая Стена Ейцюшэнь','GH_HIGH_WALL_GLOSS')], арсенал Протектората Южного Моря, представляет собой город, построенный специально для ремесленников. Используя колоссальную магическую энергию реки, город был спроектирован с многочисленными самодействующими гидравлическими механизмами. С помощью [magi|E], владеющих гидрокинезом, он мог вместить тысячи одновременно кующих мастеров. Благодаря катхунской системе ремесленных домохозяйств эти ремесленники, веками служившие Высокой Стене из поколения в поколение, превратились в уникальные ремесленные дома. Каждая семья освоила особые методы ковки, поддерживая своими непревзойденными приемами кампании Протектората в регионе Южного Моря. \n\n После всесторонних вливаний ресурсов Высокая Стена Ейцюшэнь в целом вернулась к нормальному функционированию. Заброшенные мастерские восстановлены, а разрушенная система обучения ремесленников воссоздана. Непрерывный поток оружия течет отсюда во все уголки Южного Моря, и некогда снискавшее славу по всему миру высококачественное вооружение возродилось заново."
 building_04_yeiqushen_high_wall: "Высокая Стена Ейцюшэнь"
 building_04_yeiqushen_high_wall_desc: "[Glossary('Высокая Стена Ейцюшэнь','GH_HIGH_WALL_GLOSS')], арсенал Протектората Южного Моря, представляет собой город, построенный специально для ремесленников. Используя колоссальную магическую энергию реки, город был спроектирован с многочисленными самодействующими гидравлическими механизмами. С помощью [magi|E], владеющих гидрокинезом, он мог вместить тысячи одновременно кующих мастеров. Благодаря катхунской системе ремесленных домохозяйств эти ремесленники, веками служившие Высокой Стене из поколения в поколение, превратились в уникальные ремесленные дома. Каждая семья освоила особые методы ковки, поддерживая своими непревзойденными приемами кампании Протектората в регионе Южного Моря. \n\n Кузнечные работы здесь идут в размеренном и методичном ритме. Мастерские работают непрерывно, день и ночь, сияя огнями в процессе впечатляющего производства. Весь город напоминает прожорливого левиафана, поглощающего бесчисленное количество сырья на конвейерных лентах и изрыгающего элитное снаряжение, достаточное для обеспечения армии в десятки тысяч бойцов."
 building_05_yeiqushen_high_wall: "Высокая Стена Ейцюшэнь"
 building_05_yeiqushen_high_wall_desc: "[Glossary('Высокая Стена Ейцюшэнь','GH_HIGH_WALL_GLOSS')], арсенал Протектората Южного Моря, представляет собой город, построенный специально для ремесленников. Используя колоссальную магическую энергию реки, город был спроектирован с многочисленными самодействующими гидравлическими механизмами. С помощью [magi|E], владеющих гидрокинезом, он мог вместить тысячи одновременно кующих мастеров. Благодаря катхунской системе ремесленных домохозяйств эти ремесленники, веками служившие Высокой Стене из поколения в поколение, превратились в уникальные ремесленные дома. Каждая семья освоила особые методы ковки, поддерживая своими непревзойденными приемами кампании Протектората в регионе Южного Моря. \n\n Спустя годы развития Высокая Стена Ейцюшэнь превратилась в сложнейший кузнечный комплекс. За счет внедрения технологий изгнанных корлканских ремесленников Высокая Стена воздвигла высокие дымоходы и пустила в ход колоссальные кузнечные печи. Скорость ее производства ныне превосходит любую прошлую эпохи, а рев ее работы слышен за миль вокруг."

