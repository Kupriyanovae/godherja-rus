 building_type_gh_iskandur_01_v2_desc: "Укрепленный прибрежный город, процветавший во времена [gh_first_siralagi_golden_age|E]. Его высокие каменные стены и обращенные к морю фортификации позволяли ему выдерживать осады годами. Последний оплот на Островах Трех Сестер, он противостоял войскам амсаров до 569 года от И. С. Когда полководец $qanamsar_oshvari_link$ канамсара Ошвари#! наконец пробил его оборону, город был систематически разорен и сровнен с землей, что положило конец Первому золотому веку сиралагского пиратства."
 building_gh_iskandur_01_v2: "$building_type_gh_iskandur_01_v2$"
 building_gh_iskandur_01_v2_desc: "$building_type_gh_iskandur_01_v2_desc$"

 building_type_gh_iskandur_02: "Искандур"
 building_type_gh_iskandur_02_desc: "Укрепленный прибрежный город, процветавший во времена [gh_first_siralagi_golden_age|E]. Его высокие каменные стены и обращенные к морю фортификации позволяли ему выдерживать осады годами. Разрушенный в 569 году от И. С., этот оплот на Островах Трех Сестер с тех пор был восстановлен в своем прежнем величии."
 building_gh_iskandur_02: "$building_type_gh_iskandur_01$"
