 building_01_amagheantower: "Амагейская башня"
 building_01_amagheantower_desc: "$building_type_01_amagheantower_desc$"

 building_01_antimagi_chapterhouse: "Храм Подавления"
 building_01_antimagi_chapterhouse_desc: "Позволяет нанимать [GetMaA('marcher_anti_mage').GetName] и [GetMaA('griffon_silencers').GetName] как [Concept('men_at_arms','профессиональные войска')|E]\n#weak Можно нанять только один полк Бесшумных Грифонов (размером до 5)#!\n\nНебольшой храм, посвященный Пути Подавления и обучению антимагов."

 building_01_ashmarite_hospital: "Ашмаритский госпиталь"
 building_01_ashmarite_hospital_desc: "Простой одноэтажный зал, примыкающий к внутреннему дворику. Ашмаритский госпиталь веками служил беднякам Эль-Кулаты. Говорят, его название происходит от имени народной святой, прославившейся на этих самых улицах своей чудесной способностью исцелять больных простым наложением рук."

 building_01_ashuku_mines: "Шахтерское поселение Ашуку"
 building_01_ashuku_mines_desc: "Завораживающие изумруды Ашуку были одним из главных товаров, перевозимых через пустыню по Гонянской дороге на протяжении всего времени существования этого маршрута. Несмотря на огромную ценность камней, почти вся добыча велась у поверхности, а старые глубокие выработки давно обрушились."

 building_01_assassinskeep: "Калеада Харадар"
 building_01_assassinskeep_desc: "$building_type_01_assassinskeep_desc$"

 building_01_bastards_run: "Скотный прогон"
 building_01_bastards_run_desc: "$building_type_01_bastards_run_desc$"

 building_01_bastonport: "Бастонпорт"
 building_01_bastonport_desc: "$building_type_01_bastonport_desc$"

 building_01_baytors_grave: "Могила Байтора"
 building_01_baytors_grave_desc: "$building_type_01_baytors_grave_desc$"

 building_01_beban_mines: "Шахтерское поселение Бебан"
 building_01_beban_mines_desc: "За золотые рудники Бебана последнее тысячелетие сражались секты [Concept('ritualism','ритуалистов')|E] и [Concept('wardenism','стражей')|E] (что вполне ожидаемо для любого места в [Concept('sarradon','Саррадоне')|E], хоть отдаленно напоминающего достопримечательность). В итоге они оказались под всевидящим, но слепым оком дикайноситов — после того как предыдущего владельца-ритуалиста признали виновным в пособничестве произволу и незамедлительно истребили вместе со всем его родом."
 
 building_01_benoriya_atawek: "Бенория Атавек"
 building_01_benoriya_atawek_desc: "Хотя [Concept('magic','магию')|E] и её адептов в Дамоте долгое время чуждались, считая их странными и не заслуживающими доверия, они тем не менее нашли свое место в обществе, служа и помогая своим лишенным магии соплеменникам. Пожалуй, главным символом их роли стала Обитель магии, возведенная как центр чародейского обучения. В последующие века она превратилась в сердце дамотанской магической традиции, воспитав множества выдающихся советников и воинов при [Concept('boqqarut_damotada','Боккаруте')|E], заслуживших высокое положение несмотря на статус социальных изгоев. Однако во время [Concept('etami_tetenik','Этами Тетеник')|E] школа пришла в упадок после того, как ее захватили различные военные вожди. С тех пор она большей частью пустовала, если не считать редких искателей сокровищ или [Concept('magi','магов')|E], пытающихся добыть трофеи или древние знания из ее разрушающихся стен.#!"
 building_01_benoriya_atawek_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +20#!\n"

 building_type_01_benoriya_atawek: "Бенория Атавек"
 building_type_01_benoriya_atawek_desc: "$building_01_benoriya_atawek_desc$"

 building_01_bigglacier: "Ледники Куунель"
 building_01_bigglacier_desc: "$building_type_01_bigglacier_desc$"

 building_01_biyakaddu: "Биякадду"
 building_01_biyakaddu_desc: "Со времени падения [Concept('boqqarut_damotada','Боккарута')|E] торговля на Этами Бияки иссякла, и Биякадду начал медленно увядать. Хотя это всё еще оживленный порт, значительная часть деревянных построек гниет, а поток купцов составляет лишь малую долю от былого."

 building_01_blackgates: "Серые врата"
 building_01_blackgates_desc: "$building_type_01_blackgates_desc$"

 building_01_blood_market: "Кровавый рынок"
 building_01_blood_market_desc: "До сих пор так называемые «Кровавые яблоки» считались просто диковиной, но постепенно они становятся символом региона. Потребовались деньги, чтобы построить это место и стимулировать фермеров присоединиться к централизованному рынку, а также время, чтобы распустить слухи в высших кругах.\n\nТеперь это изысканный подарок для владык, религиозных лидеров и любознательных ученых. Их даже коллекционируют, сортируют по качеству и изучают их магические свойства. Вместо торговцев, разбросанных по всей деревне, для торговли яблоками теперь выделена целая аллея. Ряды ярких витрин привлекают людей в дождливую погоду. Посетители приходят и уходят, скользя по грязи и не замечая печальной серости деревни Тильес.\n\nНекоторые все еще сомневаются в их безопасности, но торговцы говорят лучше всех: никто не приезжает в Тильес, чтобы жаловаться на единственную изысканную вещь, которую здесь можно найти."

