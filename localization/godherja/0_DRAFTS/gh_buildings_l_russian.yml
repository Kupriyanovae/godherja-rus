 building_04_golgelea_mines: "Серебродобывающий комплекс Гольгелея"
 building_04_golgelea_mines_desc: "Расположенные в предгорьях гор Айроной, серебряные рудники Гольгелеи веками являлись желанной добычей как для [Concept('aversaria','аверсарианцев')|E], так и для вханавидов. В лучшие времена их богатства питали помпезные и задающие тренды моды, рождавшиеся в восточной аверсарианской провинции и экспортировавшиеся оттуда. Они также финансировали вечные междоусобицы провинции с Опахазией, три из которых ныне признаны достаточно серьёзными конфликтами, чтобы считаться полноценными войнами, несмотря на то что [Glossary('Аавтократия','GH_AAUTOKRATA_GLOSS')] в то время оставалась стабильной. В более близкие к нам времена их нескончаемые богатства стали решающим фактором, позволившим Аксиотее свести войну с Эшраэсом к ничьей. Рудники сильно пострадали от [frodbrokna|E] — считается, что абсолютно все их управляющие погибли как во время катастрофы, так и в последовавшие годы анархии на востоке. Однако эти тёмные дни остались далеко в прошлом, и серебряные рудники Гольгелеи снова разрабатываются в полную силу."

 building_04_gujak_mines: "Добывающий комплекс Гуджак"
 building_04_gujak_mines_desc: "По мере роста добычи руды вокруг поселения возводятся новые литейные и плавильные цеха. Обработка металла стала для жителей второй природой, а их мастерство славится по всему известному миру."

 building_04_jans_market: "Великий эмпорий"
 building_04_jans_market_desc: "$building_type_04_jans_market_desc$"

 building_04_knightly_chapterhouse: "Рыцарская крепость"
 building_04_knightly_chapterhouse_desc: "Донжон высится как символ как для правителей, так и для рыцарей. Величественное сооружение, укреплённое со всех сторон и охраняемое одними из лучших рыцарей этой эпохи. В этих стенах обитают несколько орденов, и их цвета — знаки чести."

 building_04_lachish_mines: "Добывающий комплекс Лахиш"
 building_04_lachish_mines_desc: "Высоко в западных предгорьях Лахиша лежит глубокое хранилище неизвестного происхождения, построенное из железных колонн, уходящих в глубины [aeras|E]. Хотя хранилище и свято для местных оргаррдских верующих, со временем оно было опустошено, лишившись своего, казалось бы, бесконечного запаса железа. Бесконечный склеп рудников Лахиша усыпан импровизированными туннелями и литейными цехами, предназначенными для извлечения железа и других сокровищ, найденных внутри."

 building_04_lascife_mines: "Добывающий комплекс Ласиф"
 building_04_lascife_mines_desc: "По мере роста добычи руды вокруг поселения возводятся новые литейные и плавильные цеха. Обработка металла стала для жителей второй природой, а их мастерство славится по всему известному миру."

