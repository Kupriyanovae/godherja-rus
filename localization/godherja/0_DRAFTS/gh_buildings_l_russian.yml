 building_01_ten_trees_desc: "$building_type_01_ten_trees_desc$"

 building_01_tenenae: "Тененея"
 building_01_tenenae_desc: "Среди древних лесов Калатипсоми лежат проклятые руины древнего мегаполиса под названием Тененея. Зародившись как [Concept('aversaria','аверсарианская')|E] торговая фактория, со временем она превратилась в один из крупнейших и наиболее влиятельных мегаполисов Калатипсоми. В период своего расцвета её даже называли Северной Короной Аверсарии. Все изменилось в течение одной ночи, когда огромный осколок разбитого [Concept('aervalr','Эрвала')|E] рухнул прямо на город, вызвав хаос и опустошение последующим высвобождением дикой магии. Те немногие граждане, которым удалось выжить, были обречены на участь хуже смерти.\n\nИз-за энергии, оставшейся после катастрофы, руины Тененеи кишат копошащимися трупами бывших жителей города, а в темноте подстерегают еще более ужасные твари. Мрачная репутация этого места такова, что любая армия или торговый караван предпочтет сделать большой крюк, чем пройти рядом с руинами. Теперь единственными посетителями Северной Короны являются лишь те искатели приключений, которые достаточно безумны, чтобы искать старые сокровища разрушающегося [Concept('mayikprolollans','майикпрололлана')|E] города или зловеще светящиеся осколки метеора из Эрвала, уничтожившего его."
 building_01_tenenae_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +100#!\n"

