 building_type_01_jerniems_lodge: "Охотничий домик Йернейма"
 building_type_01_jerniems_lodge_desc: "Охотничий домик Йернейма — надежное убежище из дерева и камня, возведенное легендарным охотником Йернеймом, чтобы покорить дикую природу. В его залах, украшенных трофеями из костей и чучел зверей, эхом отзываются сказания, которые древнее собирающихся здесь кланов Наттанан. Возведенный с гордостью и вызовом, домик служит доказательством: нет непокоримой глуши и нет слишком свирепой добычи. Воздух вокруг него гудит от жизни, словно сам лес чтит наследие охотника."

 building_01_culling_ground: "Смертная плаха"
 building_01_culling_ground_desc: "$building_type_01_culling_ground_desc$"

 building_type_01_culling_ground: "Смертная плаха"
 building_type_01_culling_ground_desc: "Смертная плаха — мрачный алтарь из почерневшего камня и обугленных костей, освященный культистами Аккараналма, чтобы умилостивить своего темного владыку, Аккарадхамму Неумирающего. Его зубчатые края, окропленные дарами бесчисленных жертв, гудят от злобы, которая древнее родов ______, воспевающих его имя. Возведенное в страхе и благоговении, это место пульсирует болезненной силой: каждая пролитая здесь жизнь все сильнее подчиняет мир воле Лича. Воздух становится тяжелым, будто сами небеса содрогаются от творимых внизу ужасов."

