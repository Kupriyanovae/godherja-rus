 building_type_abandoned_headquarters_01:0 "Заброшенный штаб"
 building_type_abandoned_headquarters_01_desc:0 "Когда-то этот штаб был пристанищем военной элиты государства, но с тех пор генералы и их подчиненные покинули его. Всё, что осталось — это пыльные комнаты, разбросанные документы и планы вторжений, которым уже не суждено осуществиться."
 #building_type_abandoned_headquarters_01: "Заброшенный штаб"
 #sbuilding_type_abandoned_headquarters_01_desc: "Когда-то этот штаб был пристанищем военной элиты государства, но с тех пор генералы и их подчиненные покинули его. Всё, что осталось — это пыльные комнаты, разбросанные документы и планы вторжений, которым уже не суждено осуществиться."

 ##building_type_administration_01: "Администрация"
 ##building_type_administration_01_desc: "Клерки и бумагомараки, благодаря которым функционирует цивилизованное общество."

 building_type_amphitheatre_01: "Амфитеатр"
 building_type_amphitheatre_01_desc: "Развлекать массы несложно, но чтобы сделать это по-настоящему незабываемо, требуются большие вложения и внушительная сцена."

 building_type_assassins_guild_01: "Гильдия убийц"
 building_type_assassins_guild_01_desc: "Убийцы, головорезы, ассасины — этим мужчинам и женщинам нет дела до того, как их называют. Они — вестники самой смерти, и, должным образом объединившись в собственное сообщество, они способны добраться до кого угодно в этом мире за подходящую цену."

 building_type_blood_market_00: "Кровавые сады"
 building_type_boulevard_01: "Бульвары"
 building_type_boulevard_01_desc: "Одинокая набережная не способна в должной мере отразить величие этого города; его дороги должны быть столь же широки, сколь и амбиции его правителей."

 building_type_brewery_01: "Пивоварни"
 building_type_brewery_01_desc: "Место, откуда льется жизненная сила цивилизаций."

 building_type_cemetery_01: "Кладбище"
 building_type_cemetery_01_desc: "Место, где хоронят мертвых, чтобы они могли упокоиться в своем (надеемся) вечном сне."

 building_type_citadel_01: "Цитадель"
 building_type_citadel_ruins_01: "Заброшенная цитадель"
 building_type_crater_ruins_01: "Огромный кратер"
 building_type_desert_academyofswords: "Высохшая [Concept('mayikprolollans','майикпрололланская')|E] сто Спатас"
 building_type_desert_academyofswords_desc: "Иссушенные и выжженные земли Академии Мечей ныне заброшены, будучи опустошенными смертоносным магическим увяданием, вытянувшим жизнь и влагу из земли и ее обитателей. Мумифицированные трупы лежат там, где они упали в залах академии, а их скопление возле дверных проемов и фонтанов свидетельствует об ужасающих последних мгновениях города."

 building_type_dilapidated_boulevards_01: "Полуразрушенные бульвары"
 building_type_dilapidated_boulevards_01_desc: ""

 building_type_empty_building: "Пусто"
 building_type_fencing_School_01: "Школа фехтования"
 building_type_fencing_School_01_desc: "Мало что доставляет дворянскому сословию больше хлопот, чем выходки их скучающих сыновей и дочерей. Предоставление им активного способа отвлечься убережет их от неприятностей и подготовит к временам войны."
 building_type_fishmarket_01: "Рыбный рынок"
 building_type_fishmarket_01_desc: "Сюда приходит продавать свой дневной улов каждый рыбак — от владельцев самых убогих и дырявых лодок до капитанов крупных траулеров."

 building_type_forge_01: "Кузница"
 building_type_forge_01_desc: "Пылающие горны и крепкие наковальни — самое сердце любого трудолюбивого государства. Превращение металла в товары, от мечей до гвоздей, может стать одним из главных источников дохода и могущества правителя."

 building_type_fountain_ruins_01: "Полуразрушенные фонтаны"
 building_type_fountains_01: "Фонтаны"
 building_type_fountains_01_desc: "Эти милые водные зрелища, кажется, очаровывают всех — от крестьянина до лорда."

 building_type_garden_01: "Сады"
 building_type_garden_01_desc: "Особая зеленая зона, служащая общественным, хотя и все более эксклюзивным местом отдыха для жителей города."

 building_type_garden_ruins_01: "Запущенный сад"

 building_type_granary_01: "Фермерский рынок"
 building_type_granary_01_desc: "Очевидно, что ни один город не может существовать без источника пропитания, и именно сюда местные жители из окрестностей приходят за горячей пищей."

 building_type_gymnasium_01: "Гимнасий"
 building_type_gymnasium_01_desc: "Жизнь знати в мегаполисе довольно малоподвижна. Постройка специальных сооружений позволит поддерживать хорошую физическую форму прямо в черте города."

 building_type_house_ruins_01: "Разрушенный квартал"
 building_type_ice_academyofswords: "Замерзшая [Concept('mayikprolollans','майикпрололланская')|E] сто Спатас"
 building_type_ice_academyofswords_desc: "Бывшая территория Академии Мечей, скованная лютым морозом, ныне стоит безжизненной. Лютый холод от заклинания, погубившего академию, и по сей день держит порт Мегольтона во льдах. Блуждающие айсберги время от времени откалываются, угрожая всем судам в устье реки Пафос."

 building_type_inquisition_headquarters_01: "Штаб инквизиции"
 building_type_inquisition_headquarters_01_desc: "#P Работающие и живущие здесь инквизиторы будут искоренять ересь, ускоряя обращение.#!\n\nНет большей угрозы, чем еретик. Предоставление духовенству условий для преследования этого вероломного врага жизненно важно для безопасности региона."

 building_type_jail_01: "Тюрьма"
 building_type_jail_01_desc: "Где есть процветание и цивилизация, там найдутся и те, кто захочет использовать и то, и другое в своих преступных целях. Будь они схвачены стражей или пленены после битвы, тюрьмы надежно сжимают железный кулак."

 building_type_library_01: "Библиотека"
 building_type_library_01_desc: "Обитель знаний, мудрости и сокрытых древних тайн."

 building_type_lichdom_academyofswords: "Некрополь [mayikprolollans|E] сто Спатас"
 building_type_lichdom_academyofswords_desc: "Проклятые залы этого места, когда-то известного как Академия Мечей, теперь служат домом лишь для ходячих мертвецов и бестелесных духов. Где раньше тренировочные залы оглашались звоном мечей и заклинаниями, теперь эхом разносится лишь редкая стычка между бессмысленными слугами, сражающимися во имя своих владык-[Concept('liches','личей')|E], чтобы разграбить забытые тайны и фолианты академии."

 building_type_lighthouse_01: "Маяк"
 building_type_lighthouse_01_desc: "Путеводный свет, позволяющий морякам безопасно заходить в порт."

 building_type_magic_silver_mine_01: "Серебряный рудник"
 building_type_magic_silver_mine_01_desc: "В этой провинции находится серебряный рудник, приносящий 상당ную прибыль своим владельцам."

 building_type_marcher_enclave_01: "Маркизский квартал"
 building_type_marcher_wayshrine_01: "Придорожные святилища"
 building_type_maritime_district_01: "Набережная"
 building_type_maritime_ruins_01: "Затонувшая гавань"
 building_type_mass_grave_site_01: "Братская могила"
 building_type_mass_grave_site_01_desc: "Будь то голод, болезнь или война, бедствие, обрушившееся на этот район, унесло слишком много жизней, чтобы местные власти могли с этим справиться, в результате чего район превратился в огромную братскую могилу."

 building_type_massive_crater_01: "Огромный кратер"
 building_type_massive_crater_01_desc: ""

 building_type_mercenary_hall_01: "Зал наемников"
 building_type_mercenary_hall_01_desc: "Как и любой другой импорт, живая сила выиграет от наличия надлежащих торговых условий."

 #building_type_mint_01: "Королевский монетный двор"
 #building_type_mint_01_desc: "Еда, лошади, королевства, жизни — за монеты можно купить всё. Днем и ночью Монетный двор служит государству, поддерживая денежный поток и превращая сырой металл в законное платежное средство."

 building_type_monument_01: "Монумент"
 building_type_monument_01_desc: "Всё более пышные почитания героев и событий, выполняющие двойную функцию пропагандистских произведений для своих покровителей."

 building_type_monument_ruins_01: "Разграбленный мавзолей"
 building_type_necropolis_01: "Некрополь"
 building_type_necropolis_01_desc: "Крепость-некрополь, построенная не только для того, чтобы укрывать порабощенную нежить, но и чтобы внушать страх любому, кто осмелится бросить вызов их господству."

 building_type_nexus_ruins_01: "Разрушенный Нексус"
 building_type_overgrown_gardens_01: "Заросшие сады"
 building_type_overgrown_gardens_01_desc: ""

 building_type_palace_01: "Дворец"
 building_type_palace_ruins_01: "Разрушенные дворцы"
 building_type_peasant_housing_01: "Жилища крестьян"
 building_type_peasant_housing_01_desc: "Жилье для простолюдинов — вопрос не комфорта, а плотности. Сколько крепостных можно затолкнуть в как можно меньшее пространство?"

 building_type_pirate_den_01: "Пиратское логовище"
 building_type_pirate_den_01_desc: "Предоставив место для сбора, город может поставить себе на службу умелую, хоть и буйную живую силу."

 building_type_plaza_01: "Площадь"
 building_type_plaza_01_desc: "Ничто не отражает шум и суету городской жизни ярче, чем его центральная площадь."

 building_type_plaza_ruins_01: "Забытая ветрами площадь"
 building_type_plumbing_01: "Водопровод"
 building_type_plumbing_01_desc: "Система снабжения города свежей водой там, где это необходимо, способна сотворить чудеса для улучшения условий жизни, красоты и престижа."

 building_type_promenade_01: "Променад"
 building_type_promenade_01_desc: "Украшение центрального участка дороги или портовых сооружений гарантирует, что городская элита будет наслаждаться самыми величественными прогулочными зонами на мили вокруг."

 building_type_recruitment_post_01: "Вербовочный пункт"
 building_type_recruitment_post_01_desc: "Армия не возникает из воздуха, и прежде чем дать ополченцам в руки меч и провести подобие обучения, их нужно сначала вырвать с городских улиц."

 building_type_reinforcement_tunnels_01: "Укрепленные туннели"
 building_type_reinforcement_tunnels_01_desc: "Когда деревня, город или мегаполис оказываются в осаде, наличие скрытых туннелей может сыграть решающую роль в судьбе всего населения."

 building_type_roxirvoreais_fog_desc: "Роксирвореаш стал доказательством того, что дух человека не способен противостоять движению [Concept('the_fog','Тумана')|E]. Какими бы гордыми или серьезными ни были жители и какими бы могущественными ни были укрепления, Туман поглощает всё. Древняя стена теперь кажется бесконечной, и из башен или старых подвалов регулярно выбираются ужасные твари. В самом центре этого места древняя центральная площадь продолжает кипеть жизнью: солдаты, как люди, так и [Concept('aelfir','чужаки')|E], ведут бесконечный бой из незапамятных времен, словно не способные умереть."

 building_type_ruined_citadel_01: "Заброшенный форт"
 building_type_ruined_district_01: "Разрушенный район"
 building_type_ruined_maritime_district_01: "Обрушившийся док"
 building_type_ruined_palace_01: "Разграбленный дворец"
 building_type_ruined_temple_district_01: "Ветшающий храм"
 building_type_ruined_trade_district_01: "Разграбленные лавки"
 building_type_ruined_urban_district_01: "Разросшиеся трущобы"
 building_type_ruined_workshop_district_01: "Разрушенные литейные"
 building_type_scattered_training_ground_01: "Заброшенное тренировочное поле"
 building_type_scattered_training_ground_01_desc: "Бывшая тренировочная площадка и место для спаррингов местного гарнизона ныне превратилась в заросший пустырь, усыпанный сгнившими манекенами и ржавым снаряжением."

 building_type_shipyard_01: "Верфь"
 building_type_shipyard_01_desc: "Иностранные корабли — это хорошо, но собственные суда, построенные здесь, обеспечивают существенный прирост доходов города."

 building_type_siege_workshop_01: "Осадная мастерская"
 building_type_siege_workshop_01_desc: "Мегаполис будет стоять вечно, но создаваемые здесь орудия гарантируют, что другие города не разделят его бессмертия."

 building_type_slave_market_01: "Невольничий рынок"
 building_type_slave_market_01_desc: "Пожалуй, самый древний товар, известный человеку — это его собственный труд, и вполне естественно предоставить условия для обмена этим товаром. Любые этические возражения легко перевешиваются огромной потенциальной прибылью."

 building_type_special_aervalr_shard: "Осколок [aervalr|E]"
 building_type_special_aervalr_shard_desc: "$building_01_special_aervalr_shard_desc$"

 building_type_special_bloodcrystal: "$building_01_special_bloodcrystal$"
 building_type_special_bloodcrystal_desc: "$building_01_special_bloodcrystal_desc$"

 building_type_stonemason_01: "Каменоломня"
 building_type_stonemason_01_desc: "Такой город не строится за один день, и его бы вообще не было без этих мастеров."

 building_type_tavern_01: "Таверна"
 building_type_tavern_01_desc: "В таверне путешественник может найти укрытие от непогоды, а горожанин — от своих забот."

 building_type_temple_district_01: "Храмовый район"
 building_type_temple_workshop_01: "Храмовая мастерская"
 building_type_temple_workshop_01_desc: "Предоставление духовенству города условий для занятия ремеслами благотворно сказывается как на их усердии, так и на экономике города."
 building_type_thieves_guild_01: "Гильдия воров"
 building_type_thieves_guild_01_desc: ""

 building_type_trade_district_01: "Торговый район"
 building_type_urban_district_01: "Городской район"
 building_type_wall_breach_01: "Пролом в стене"
 building_type_wall_breach_01_desc: "Во время бедствия, обрушившегося на этот мегаполис, одна из внешних стен района была пробита. На ее месте осталась зияющая дыра, подвергающая нас угрозам как со стороны вражеских войск, так и со стороны преступников."

 building_type_warehouse_01: "Склады"
 building_type_warehouse_01_desc: ""

 building_type_waterway_ruins_01: "Пересохший водный канал"
 building_type_waymakers_fort: "Форт Путеводных"
 building_type_waymakers_fort_desc: "Форт Путеводных — это крупный замковый комплекс, построенный в провинции для размещения воинов Путеводных Велоса, ордена, посвященного направлению и защите последователей их Ритуала."

 building_type_wealthy_manors_01: "Богатые усадьбы"
 building_type_wealthy_manors_01_desc: "Пока простой человек довольствуется юдолью с себе подобными, следует проявлять больше заботы о том, чтобы потребности знати в пространстве и роскоши были удовлетворены."

 building_type_workshop_district_01: "Ремесленный район"
 building_urban_district_01: "Пригород"
 building_urban_district_01_desc: "Замысел будущих великих свершений: огромная сеть тщательно спланированных дорог пока заселена лишь кое-где."

 building_urban_district_02: "Коммуна"
 building_urban_district_02_desc: "Оживленный городской центр начал формироваться и разрастаться среди созданной здесь инфраструктуры."

 building_urban_district_03: "Район"
 building_urban_district_03_desc: "Размер мегаполиса теперь сравним с владениями иного графа, и в наиболее плотных районах нужно быть счастливчиком, чтобы разглядеть чистое небо из-за зданий."

 building_urban_district_04: "Шумный мегаполис"
 building_urban_district_04_desc: "Население целой страны, ютящееся друг на друге в разросшемся мегаполисе; потребление ресурсов и производство этого города сопоставимы с целыми государствами."

 building_wall_breach_01: "Скрытый проход"
 building_wall_breach_01_desc: "Будь то из-за разрушительного действия времени или вражеской атаки, обрушившийся участок внешней стены в этом районе теперь позволяет проникать в мегаполис и покидать его без нашего надзора. Хуже того, поскольку пролом образовался еще при прежнем режиме, лишь немногие при дворе знают о существовании этой уязвимости."

 building_wall_breach_02: "Укрепленный пролом"
 building_wall_breach_02_desc: "Обнаруженный местными преступниками, пролом был укреплен деревянными балками, лесами и верёвками, а обломки были расчищены. Теперь, когда обрушение предотвращено, нелегальный поток людей через пролом наверняка возрастет."

 building_wall_breach_03: "Маршрут контрабандистов"
 building_wall_breach_03_desc: "Получив возможность проникать в наш мегаполис и покидать его без уплаты налогов, соблюдения правил и досмотра стражи, контрабандисты теперь проносят через пролом самые разные незаконные товары, питая черный рынок на нашей территории."

 building_wall_breach_04: "Беззаконные врата"
 building_wall_breach_04_desc: "То, что когда-то было простым обвалом стены, превратилось в преступный хаб: контрабандисты, наемники, агенты и культисты свободно проникают на нашу территорию. Покольку даже местные банды не контролируют, кто проходит через эти нелегальные врата, единственным плюсом остается то, что наши собственные агенты также могут этим воспользоваться."

 building_warehouse_01: "Ветхие лачуги"
 building_warehouse_01_desc: "Кусок куска брезента и дырявая соломенная «крыша» — это всё, что защищает от непогоды ящики и грузы, прибывающие в порт и убывающие из него."

 building_warehouse_02: "Грузовой депо"
 building_warehouse_02_desc: "Построенное из кирпича и на совесть, это скромное сооружение всё же является заметным шагом вперед по сравнению со своим почти постыдным предшественником."

 building_warehouse_03: "Склад"
 building_warehouse_03_desc: "После неоднократных пристроек и расширений грузовое депо наконец-то можно назвать полноценным складом. Здесь можно надежно укрыть грузы нескольких купеческих судов солидных размеров."

 building_warehouse_04: "Разрозненные склады"
 building_warehouse_04_desc: "Несколько складов тянутся вдоль побережья, заполненные в основном товарами местного производства."

 building_warehouse_05: "Складской квартал"
 building_warehouse_05_desc: "Целая секция набережной теперь занята исключительно складами и небольшими хранилищами."

 building_warehouse_06: "Складской район"
 building_warehouse_06_desc: "Несколько массивных складов возвышаются вдоль набережной в окружении бесчисленных рядов вспомогательных хранилищ. Кажется, для каждого вида товаров здесь есть отдельное депо."

 building_waterway_ruins_01: "Пересохший водный канал"
 building_waterway_ruins_01_desc: "Единственное, что всё еще течет по каналам, изрезавшим эту местность, — это постоянно смещающиеся пески."

 building_waymakers_fort: "Форт Путеводных"
 building_waymakers_fort_desc: "$building_type_waymakers_fort_desc$"

 building_wealthy_manors_01: "Усадьбы на холме"
 building_wealthy_manors_01_desc: "Из этих просторных поместий открываются потрясающие виды на город, а сами они находятся на почтенном расстоянии от любых элементов городской жизни, которые дворянин мог бы посчитать неприятными."

 building_wealthy_manors_02: "Помещения для слуг"
 building_wealthy_manors_02_desc: "Слуги содержатся в этих зданиях отдельно от своих господ, как и подобает их положению."

 building_wealthy_manors_03: "Частные казармы"
 building_wealthy_manors_03_desc: "Личные телохранители, наемники и частные отряды живут в этих шумных зданиях, ожидая приказа своего лорда."

 building_wealthy_manors_04: "Обнесенные стеной поместья"
 building_wealthy_manors_04_desc: "Разрешение знати управляться в своих небольших барониях прямо из мегаполиса привлекло в город множество дворян с их славой и бездонными ресурсами."

