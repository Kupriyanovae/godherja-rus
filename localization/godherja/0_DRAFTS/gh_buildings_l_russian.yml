 building_02_turayyil_mines_desc: "По мере роста поселения добывается все больше и больше руды. Приток компетентных инженеров позволяет построить полноценный рудник."

 building_02_umlojtemplecomplex: "Ковенант Умлоджа"
 building_02_umlojtemplecomplex_desc: "$building_type_02_umlojtemplecomplex_desc$"

 building_02_universityofgiherehalwajaf: "Манзи Альфайнсуфи"
 building_02_universityofgiherehalwajaf_desc: "$building_type_02_universityofgiherehalwajaf_desc$"

 building_02_vilunnak_mines: "Рудники Вилуннак Сатра"
 building_02_vilunnak_mines_desc: "Расположенный в затонувшей речной долине, горнодобывающий комплекс в Вилуннак Сатра производит наибольшее количество алмазов и других драгоценных камней в Каширии. Поселение, название которого на местном диалекте означает «Поле звезд», обязано своим минеральным богатством, как говорят, древней битве, произошедшей в этом регионе, в ходе которой могущественный [Concept('magi','маг')|E] призвал упавшую звезду, чтобы поразить своих врагов. Маг выиграл битву, а поле, где стоял его противник, превратилось в почерневшую равнину, усыпанную астральными самоцветами. Сегодня вилуннакские алмазы украшают короны многих каширийских монархов, а безделушки с этими потрясающими камнями стоят огромных денег по всему востоку."

 building_02_zakran_mines: "Малый рудник Закрана"
 building_02_zakran_mines_desc: "Горнодобывающий комплекс у подножия горного хребта Закран действовал по меньшей мере со времен Первого Междуцарствия Кемсара, когда дом Себхенаф активно использовал его для финансирования своих, казалось, бесконечных конфликтов с западными соперниками. Он сохранил свое значение и после воссоединения Кемсара, оставаясь основным источником серебра на протяжении всей последующей истории империи.\n\nОднако после Битвы за Разорванную Цепь рудник был захвачен молодой империей Айяр и с тех пор подпитывает большую часть ее экономики."

 building_03_antimagi_chapterhouse: "Цитадель антимагов"
 building_03_antimagi_chapterhouse_desc: "Позволяет нанимать [GetMaA('marcher_anti_mage').GetName] и [GetMaA('griffon_silencers').GetName] как [men_at_arms|E]\n#weak Можно нанять только один полк Глушителей Грифонов (размером до 5)#!\n\nСлышно, как офицеры и ветераны муштруют новобранцев за много лиг во всех направлениях, и то, что когда-то было чуть больше чем монастырем, превратилось в крепость, охраняемую грозными антимагами."

 building_03_ashmarite_hospital: "Ашмаритский госпиталь"
 building_03_ashmarite_hospital_desc: "Обширный комплекс зданий окружает двухэтажный зал, куда привозят больных и раненых для лечения. Здесь можно найти почти пятьдесят целителей, поддерживаемых благотворительными пожертвованиями и покровительством богатых. Некоторые из самых знаменитых врачей Саррадона начинали именно здесь, пройдя обучение у старшего персонала и позже поступив под покровительство богатых и могущественных жителей города."

 building_03_ashuku_mines: "Крупный рудник Ашуку"
 building_03_ashuku_mines_desc: "Завораживающий изумруд Ашуку был одним из основных товаров, перевозимых через пустыню по Гонянской дороге на протяжении всего времени существования этого маршрута. По мере того как расширяются горные работы, растут и сами рудники. Строится больше входов и выкапываются большие шахтные стволы для извлечения глубоко залегающей руды."

 building_03_bastards_run: "Мастерская Тадеша"
 building_03_bastards_run_desc: "$building_type_03_bastards_run_desc$"

 building_03_beban_mines: "Крупный рудник Бебан"
 building_03_beban_mines_desc: "По мере того как расширяются горные работы, растут и сами рудники. Строится больше входов и выкапываются большие шахтные стволы для извлечения глубоко залегающей руды."

 building_03_biyakaddu: "Биякадду"
 building_03_biyakaddu_desc: "И вновь Биякадду ежедневно принимает бесчисленные суда, и вновь великое озеро подле него заполнено мелкими лодками. Растущая экономическая сложность Дамоты снова открыла нишу, и этот древний центр торговли с радостью ее занял."

 building_03_calmensons_crest: "Герцогские высоты"
 building_03_calmensons_crest_desc: "$building_type_03_calmensons_crest_desc$"

 building_03_champion_grounds: "Протошлити Аиттитос"
 building_03_champion_grounds_desc: "$building_type_03_champion_grounds_desc$"
 03_champion_grounds_effect_desc: "Находящиеся поблизости [Concept('aversaria', 'аверсарианцы')|E] могут принять [decision|E] [GetDecisionWithKey('hire_protoshliti_legon_decision').GetName]"

 building_03_creonta_mines: "Крупный рудник Креонта"
 building_03_creonta_mines_desc: "По мере того как расширяются горные работы, растут и сами рудники. Строится больше входов и выкапываются большие шахтные стволы для извлечения глубоко залегающей руды."

 building_03_degasho_bedelam: "Дегашо Беделам"
 building_03_degasho_bedelam_desc: "Превосходя, пожалуй, даже богатство старого [Concept('boqqarut_damotada','Боккарута')|E], Дегашо Беделам представляет собой воистину неописуемый рай материального богатства и физических удовольствий. Едва ли возможно даже начать описывать бесчисленные удобства, которыми он теперь снабжен, ведь их чистое разнообразие и количество удовлетворяют практически любое желание элиты Дамоты."

 building_dergi_garden_03: "Опустевший сад дергов"
 building_dergi_garden_03_desc: "[magic|E] этого сада угасла, и вместо него остался лишь пустой участок почвы и песка. Эта священная земля служит свидетельством круговорота природы и роли ее хранителей в поддержании жизни и смерти ее прекрасных творений."

 building_03_dihasma_xiidan: "Дихасма Ксиидан"
 building_03_dihasma_xiidan_desc: "Поддерживаемый инвестициями подкованных правителей, Дихасма Ксиидан теперь снова гордится своей репутацией, а его ученики занимают почетные места в армиях по всей Дамоте."

 building_03_epidaphos_mines: "Крупный рудник Эпидафос"
 building_03_epidaphos_mines_desc: "По мере того как расширяются горные работы, растут и сами рудники. Строится больше входов и выкапываются большие шахтные стволы для извлечения глубоко залегающей руды."

