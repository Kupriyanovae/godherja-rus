 building_01_statuefacingwest_desc: "$building_type_01_statuefacingwest_desc$"

 building_01_stone_battlefield: "Каменное поле битвы"
 building_01_stone_battlefield_desc: "Среди холмов стоят две армии, целиком состоящие из камня и навеки застывшие в яростном сражении. Статуи выполнены с безупречным мастерством, передающим даже малейшие детали лиц воинов. Несмотря на это, они практически неуничтожимы и не имеют никаких следов повреждений от многолетнего воздействия стихий. В центре поля битвы возвышается одна статуя. Внушительная фигура в орнаментированных доспехах восседает на коне, а её пальцы едва касаются конца вытянутого дротика, нацеленного на другую статую, застывшую прямо посреди сотворения заклинания.\n\nМестные жители долгое время считали эту местность проклятой, а деревья отказываются расти на территории каменного поля. [Concept('aversaria','Аверсарианские')|E] ученые, напротив, сделали поразительные открытия при осмотре статуй. Одна из армий облачена в доспехи, напоминающие те, что использовались древними аверсарианцами. Никто не знает наверняка, как и почему такие доспехи и оружие оказались так далеко на юге, и именно поэтому обсуждение каменного поля до сих пор остается предметом жарких споров среди историков."

 building_01_sunarsarwena_gardens: "Святилище Сунарсарвены"
 building_01_sunarsarwena_gardens_desc: "Возведено в честь [Concept('aversaria','аверсарианской')|E] принцессы Сунарсарвены, жены мамура Юсуфа и матери мамуров Муктафи и Ка'има. Небольшое святилище расположено в углу Зеленых садов Иклувада."

