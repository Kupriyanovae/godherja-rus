 building_01_golgelea_mines: "Развалины серебряных рудников Гёльгелея"
 building_01_golgelea_mines_desc: "Размещенные в предгорьях гор Айроной, серебряные рудники Гёльгелея веками были лакомым кусочком как для [Concept('aversaria','аверсарианцев')|E], так и для вханавидов. В лучшие времена их богатства питали помпезную и задающую тренды моду, которая рождалась в восточной аверсарианской провинции и экспортировалась оттуда. Они также финансировали вечные междоусобицы провинции с Опахасией, три из которых сегодня признаны достаточно серьезными конфликтами, чтобы считаться настоящими войнами, несмотря на то, что [Glossary('Аавтократия','GH_AAUTOKRATA_GLOSS')] в остальном была стабильна. Совсем недавно их нескончаемые богатства стали решающим фактором, позволившим Аксиотее сражаться с Эшресом до ничейного исхода. Рудники все еще восстанавливаются после ущерба, нанесенного провинции [frodbrokna|E] — считается, что абсолютно все их управляющие погибли как во время катастрофы, так и в последовавшие за ней годы анархии на востоке. Тем не менее, уцелевшие богатства Гёльгелея наверняка снова привлекут алчные взоры."

 building_01_graveofthemillion: "Могила Миллиона"
 building_01_graveofthemillion_desc: "$building_type_01_graveofthemillion_desc$"

