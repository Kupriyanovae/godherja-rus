 building_03_malcoispalace_desc: "$building_type_03_malcoispalace_desc$"

 building_03_mayaliha_mines: "Крупный рудник Маялиха"
 building_03_mayaliha_mines_desc: "По мере того как расширяются горные работы, растут и сами рудники. Строится больше входов и выкапываются большие шахтные стволы для извлечения глубоко залегающей руды."

 building_03_oasisofgonan: "Оазис Гонан"
 building_03_oasisofgonan_desc: "$building_type_03_oasisofgonan_desc$"

 building_03_oetanai_mines: "Развивающиеся золотые рудники Оэтанаи"
 building_03_oetanai_mines_desc: "Хотя о золотых жилах Оэтанаи было известно давно, географическая удаленность делала их разработку нерентабельной, пока куда более доступные выработки в Оронтисе не истощились в начале XII века. Из-за серии неизбежных неудач систематическая эксплуатация началась только в 1160-х годах. Развитию препятствовали густые леса Кнотоса, а расположение шахтного ствола на значительной высоте создавало огромные трудности. Часто отмечалось, что путь к руднику был, вероятно, более опасен, чем сама работа на нем. Хаос [odrstund|E], [imperial_civil_war|E] и, наконец, [frodbrokna|E] вывели рудник из строя, так как интересы Малькоиса сместились в сторону вопросов выживания, а не эксплуатации недоразвитого высокогорного рудника. С медленным возвращением жизни в провинцию золотой рудник Оэтанаи стал активно развиваться. Поскольку ценой огромных расходов в холмах наконец-то прорубаются постоянные дороги, рудники начинают терять свою дурную репутацию места, добраться до которого опаснее, чем работать на нем."

 building_03_ordus_mines: "Крупные золотые рудники Ордуса"
 building_03_ordus_mines_desc: "Действовавшие еще во времена древних ийросси, жестокие каторжные работы [Concept('aversaria','аверсарианцев')|E] фактически превратили это место в массовую могилу для тех, кто когда-то сам его эксплуатировал. Шахты пришли в упадок из-за восстания рабов-ийросси, а большая часть построек была сожжена или разрушена во время масштабного мятежа. Бывшие управляющие рудников все еще здесь — их тела были бесцеремонно сброшены в шурфы вместе с трупами аверсарианских жителей нескольких близлежащих городков. Теперь, благодаря постоянным инвестициям, Ордус наконец начал выходить на уровень производства, которым славился еще до [frodbrokna|E]. Из-за темного прошлого этих мест ходят шепоты о проклятиях и призраках, и на крыльях этих слухов как сами рудники, так и добываемое здесь золото приобрели дурную славу. Впрочем, слиток золота Ордуса тратится ничуть не хуже любого другого."

 building_03_paccai_mines: "Крупный карьер Паккаи Малаи"
 building_03_paccai_mines_desc: "Высоко в облачных лесах Веллатолы, окутанный туманом, возвышается темный пик Паккаи Малаи. Именно здесь на протяжении веков в склоне вершины был вырыт огромный карьер, из которого извлекаются массивные объемы черной породы с зелеными прожилками. Кажущаяся бесполезной для многих, ковен водных [Concept('magi','магов')|E]-вародаистов за прошедшие века довела до совершенства искусство извлечения из этой руды чистой меди и в меньших количествах — золота. Однако магические процессы дают большое количество отходов, к сожалению, оставляя реки и леса вокруг Паккаи Малаи опустошенными и загрязненными."

 building_03_phanapetra_mines: "Крупный рудник Фанапетра"
 building_03_phanapetra_mines_desc: "По мере того как расширяются горные работы, растут и сами рудники. Строится больше входов и выкапываются большие шахтные стволы для извлечения глубоко залегающей руды."

 building_03_preachers_hill: "Высоты Конклава"
 building_03_preachers_hill_desc: "$building_type_03_preachers_hill_desc$"

 building_03_seychunds_square: "Четырнадцать святилищ"
 building_03_seychunds_square_desc: "$building_type_03_seychunds_square_desc$"

 building_03_sonas_sikelenizi: "Сонас Сикеленизи"
 building_03_sonas_sikelenizi_desc: "С очередным объединением Дамоты в единое государство торговля, проходящая через бесчисленные лавки и причалы Сонас Сикеленизи, разрослась до невероятных масштабов. Теперь, занимая практически весь перекресток рек, никто не может пройти мимо, не посетив этот памятник хаотичной изобретательности."

 building_03_sophocos: "Софокос"
 building_03_sophocos_desc: "$building_type_03_sophocos_desc$"

 building_03_special_aervalr_shard: "Огромный осколок [Concept( 'aervalr', 'Эрвала' )|E]"
 building_03_special_aervalr_shard_desc: "Исключительно крупный кусок [Concept( 'aervalr', 'Эрвала' )|E] упал в этих землях — потенциал его магического применения огромен.\n\n#P [Concept( 'travel', 'Путешествие' )|E] в эту локацию может принести [Concept( 'artifact', 'артефакт' )|E].#!"
 building_03_special_aervalr_shard_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +30#!\n[aspect_celestial] [spellcasting_success_chance|E]:@gh_celestial_icon!#positive_value; +15%#!\n[aspect_death] [spellcasting_success_chance|E]:@gh_death_icon!#positive_value; +15%#!"

 building_03_special_bloodcrystal: "Рудник [Concept( 'bloodcrystal', 'кровавого кристалла' )|E]"
 building_03_special_bloodcrystal_desc: ""
 building_03_special_bloodcrystal_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +30#!"

 building_03_sunarsarwena_gardens: "Огороженный сад Иклувада"
 building_03_sunarsarwena_gardens_desc: "Первоначально воздвигнутый как святилище в честь [Concept('aversaria','аверсарианской')|E] принцессы Сунарсарвены, жены мамура Юсуфа и матери мамуров Муктафи и Каима, этот огороженный сад расцвел благодаря заботливым усилиям садоводов. Здесь можно найти образцы экзотических деревьев и цветов из дальних стран."

