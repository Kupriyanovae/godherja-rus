 building_04_creonta_mines_desc: "По мере роста добычи руды вокруг поселения возводятся новые литейные и плавильные цеха. Обработка металла стала для жителей второй природой, а их мастерство славится по всему известному миру."

 building_04_dihasma_xiidan: "Дихасма Ксиидан"
 building_04_dihasma_xiidan_desc: "С воссоединением Дамоты под единым знаменем Дихасма Ксиидан вернул и, возможно, даже превзошёл своё прежнее значение. Гарнизонный центр, принимающий теперь учеников со всего царства и даже из-за рубежа, известен за пределами [Glossary('Великой пустыни','sarradonian_desert_encyclopedia_desc')] как вершина человеческого воинского искусства."

