 building_00_elysian_pass: "Забытый Элисийский проход"
 building_00_elysian_pass_desc: "$building_type_00_elysian_pass_desc$"

 building_00_eternal_grove: "Разрушенная Вечная роща"
 building_00_eternal_grove_desc: "Глубоко в сердце Зеленоморья лежит Вечная роща — священный центр партической веры. В ее пределах растет Дриоганн Дтохт, Древо Мира. Черпая силу из огромных залежей [Concept('bloodcrystal','кровавого кристалла')|E], узловатые корни Дриоганн Дтохт пульсируют красным магическим светом, проникая, кажется, в самое ядро [Concept('aeras','Эраса')|E].\n\nОднако теперь Вечная роща уничтожена, её древние деревья сожжены дотла или срублены. И все же Дриоганн Дтохт все еще стоит: любого, кто дерзнет приблизиться к нему, узловатые корни Древа Мира затягивают глубоко под землю, и больше этих людей никто не видит."

 building_00_fog_dihasma_xiidan: "Поглощенная Туманом Дихасма Ксидан"
 building_00_fog_dihasma_xiidan_desc: "$building_type_00_fog_dihasma_xiidan_desc$"

 building_00_fog_elysian_pass: "Поглощенный Туманом Элисийский проход"
 building_00_fog_elysian_pass_desc: "$building_type_00_fog_elysian_pass_desc$"

 building_00_fog_eternal_grove: "Поглощенная Туманом Вечная роща"
 building_00_fog_eternal_grove_desc: "Глубоко в сердце Зеленоморья лежит Вечная роща — священный центр партической веры. В ее пределах растет Дриоганн Дтохт, Древо Мира. Черпая силу из огромных залежей [Concept('bloodcrystal','кровавого кристалла')|E], узловатые корни Дриоганн Дтохт пульсируют красным магическим светом, проникая, кажется, в самое ядро [Concept('aeras','Эраса')|E].\n\nС наступлением [Concept('the_fog','Тумана')|E] Вечная роща стала еще гуще, укрыв в своей чаще самых разных [Concept('fogbeasts','туманных тварей')|E]. Глубокие трещины раскололи ствол великого древа, издавая жуткий вопль, слышный за много миль. И все же Дриоганн Дтохт всё еще стоит.#!"
 building_00_fog_eternal_grove_effect_desc: "[aspect_dream] [spellcasting_success_chance|E]:@gh_dream_icon!#positive_value; +15%#!\n[aspect_ethereal] [spellcasting_success_chance|E]:@gh_ethereal_icon!#positive_value; +15%#!\n"

