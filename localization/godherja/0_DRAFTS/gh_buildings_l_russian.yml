 building_00_darksteel_tomb: "Склеп Неумирающего"
 building_00_darksteel_tomb_desc: "$building_type_00_darksteel_tomb_desc$"

 building_type_00_darksteel_tomb: "Склеп Неумирающего"
 building_type_00_darksteel_tomb_desc: "Давным-давно Двуликие Боги и Корлаку объединили силы, чтобы одолеть лича Аккарадхамму Неумирающего. Используя темную сталь, которая уже доказала свою способность подавлять чародейство, Корлаку и колдун Замрах спроектировали огромную подземную тюрьму абсолютного подавления — камеру, укрепленную цепями из темной стали, связывающими символами и арканными проводниками, предназначенными для вытягивания силы Аккарадхаммы прямо в стены его собственной гробницы. Это была не обычная темница — это была живая конструкция, которая должна была вечно высасывать его силы, гарантируя, что даже если он как-то восстановит могущество, то никогда не сможет снова обрушить его на мир.\n\nОднако легенда гласит, что Аккарадхамма не останется заточенным навечно и со временем восстанет вновь, чтобы опять угрожать народам [Concept('aeras','Эраса')|E]."

 building_01_darksteel_tomb: "Гробница Неумирающего"
 building_01_darksteel_tomb_desc: "$building_type_01_darksteel_tomb_desc$"

 building_type_01_darksteel_tomb: "Гробница Неумирающего"
 building_type_01_darksteel_tomb_desc: "Гробница Неумирающего — мрачное сооружение из темной стали, возведенное для хранения останков — или, возможно, самой сущности — Аккарадхаммы, Лича, почитаемого сепаттанскими верующими. Его стены, холодные и непреклонные, шепчут тайны, древнейшие чем роды #font:RedactedScriptFont ______#!, охраняющие его. Построенная с почтением и страхом, гробница служит предупреждением: некоторая сила бросает вызов смерти, и ее покой никогда не бывает мирным. Земля вокруг нее становится тяжелой, словно сама суша содрогается от того, что лежит внутри."

 building_02_darksteel_tomb: "Мавзолей из темной стали"
 building_02_darksteel_tomb_desc: "$building_type_02_darksteel_tomb_desc$"

 building_type_02_darksteel_tomb: "Мавзолей из темной стали"
 building_type_02_darksteel_tomb_desc: "Мавзолей из темной стали поднимается на фундаменте первоначальной гробницы, его шпили впиваются в небеса, подобно перстам погребенного бога. Это не просто склеп, это монумент непреклонной воле Аккарадхаммы, где жрецы #font:RedactedScriptFont ______#! поют сепаттанские гимны, неестественно отдающиеся эхом в его залах. Воздух густеет от ужаса, а живущие неподалеку рассказывают о снах, в которых их преследует голос, требующий повиновения. Мавзолей не просто стоит — он наблюдает, и земля увядает под его взором."

 building_03_darksteel_tomb: "Святилище Неумирающего"
 building_03_darksteel_tomb_desc: "$building_type_03_darksteel_tomb_desc$"

 building_type_03_darksteel_tomb: "Святилище Неумирающего"
 building_type_03_darksteel_tomb_desc: "Святилище Неумирающего превращает мавзолей в освященную крепость, ее стены из темной стали исписаны рунами, пульсирующими сепаттанским чародейством. Здесь сущность Аккарадхаммы больше не скована, а направляется, привлекая паломников и воинов склонить колени перед его алтарями. Верные #font:RedactedScriptFont _____#! утверждают, что Лич говорит через тени святилища, даруя видения завоеваний и вечности. И все же земля вокруг трескается и увядает, словно святилище пьет жизненную силу мира, чтобы питать возвращение своего господина."

 building_04_darksteel_tomb: "Тюрьма Лича"
 building_04_darksteel_tomb_desc: "$building_type_04_darksteel_tomb_desc$"

 building_type_04_darksteel_tomb: "Тюрьма Лича"
 building_type_04_darksteel_tomb_desc: "Тюрьма Лича — это уже не просто место упокоения, а цитадель сдерживания, ее коридоры из темной стали предназначены для того, чтобы сковать бессмертный дух Аккарадхаммы — или обрушить его на мир. Воздух гудит от тяжести сепаттанских ритуалов, и военачальники #font:RedactedScriptFont _____#! клянутся в верности незримому присутствию, бродящему в ее глубинах. Кажется, что стены тюрьмы дышат, а ее врата открываются только перед теми, кто признан достойным — или обреченным. Окружающие земли лежат в запустении, проклятые скверной, губящей жизнь, словно сама земля скорбит о вечном заточении Лича."

 building_05_darksteel_tomb: "Цитадель Вечности"
 building_05_darksteel_tomb_desc: "$building_type_05_darksteel_tomb_desc$"

 building_type_05_darksteel_tomb: "Цитадель Вечности"
 building_type_05_darksteel_tomb_desc: "Цитадель Вечности возвышается над миром — оплот из темной стали, где воля Аккарадхаммы искажает саму ткань бытия. Ее шпили пронзают облака, а залы отзываются криками забытых эпох, сохраненными сепаттанской магией. Правители #font:RedactedScriptFont ______#!, входящие внутрь, выходят измененными, с глазами, горящими видениями владычества. Цитадель — это парадокс: тюрьма, которая наделяет силой, гробница, которая живет. Земля вокруг рассыпается в пепел, не в силах вынести тяжесть взора вечности."

 building_06_darksteel_tomb: "Апофеоз Аккарадхаммы"
 building_06_darksteel_tomb_desc: "$building_type_06_darksteel_tomb_desc$"

 building_type_06_darksteel_tomb: "Апофеоз Аккарадхаммы"
 building_type_06_darksteel_tomb_desc: "Апофеоз Аккарадхаммы — это богоподобный монумент, его форма из темной стали — рана на теле мира, где сущность Лича сливается с божественным. Сепаттанские жрецы провозглашают его точкой опоры мироздания, где судьба #font:RedactedScriptFont _____#! куется в ужасе и огне. Сооружение пульсирует неестественной жизнью, его коридоры смещаются, заманивая в ловушку недостойных. Те, кто правит им, обладают непревзойденным могуществом, но земля за его вратами превращается в пустошь, словно сама реальность рушится, питая восхождение Аккарадхаммы."

 building_07_darksteel_tomb: "Бастион Вечного Покрова"
 building_07_darksteel_tomb_desc: "$building_type_07_darksteel_tomb_desc$"

 building_type_07_darksteel_tomb: "Бастион Вечного Покрова"
 building_type_07_darksteel_tomb_desc: "Бастион Вечного Покрова стоит там, где стирается грань между жизнью и смертью, а его стены из темной стали истончают границы между мирами. Шепот Аккарадхаммы проникает сквозь сепаттанские песнопения, даруя правителям прозорливость, граничащую с безумием. Предания #font:RedactedScriptFont ______#! гласят, что бастион больше не строят, а выращивают, и его фундамент уходит корнями в незримые царства. Земля вокруг него искажается под действием потусторонней скверны, а людей преследуют видения собственного конца. Бастион не защищает — он пожирает, и лишь сильнейшие способны выжить, познав его истину."

 building_08_darksteel_tomb: "Склеп Потопленного Времени"
 building_08_darksteel_tomb_desc: "$building_type_08_darksteel_tomb_desc$"

 building_type_08_darksteel_tomb: "Склеп Потопленного Времени"
 building_type_08_darksteel_tomb_desc: "Склеп Потопленного Времени — это бездна из темной стали, где бессмертная воля Аккарадхаммы поглощает течение эпох. В его тени время замирает, а сепаттанские гимны смолкают перед его безмолвием. Правители #font:RedactedScriptFont _____#!, входящие сюда, выходят полубогами, чьи разумы освобождены от смертных преград, но взор склепа не щадит никому. Земля вокруг — больше не плоть мира, а шрам, где сменяемость времен года прекращается, и жизнь забывает свое предназначение. Это не гробница и не тюрьма, а рана на ткани реальности; его голод вечен, а его владыка пробудился."

 building_01_well_of_souls: "Колодец Безымянных Душ"
 building_01_well_of_souls_desc: "$building_type_01_well_of_souls_desc$"

 building_type_01_well_of_souls: "Колодец Безымянных Душ"
 building_type_01_well_of_souls_desc: "В тени Склепа Потопленного Времени лежит Колодец Безымянных Душ — бездонная пропасть, куда Аккарадхамма низвергает вычеркнутые им души, обрекая их на вечное бесплотное существование. Говорят, колодец искажает саму реальность, подчиняя себе воспоминания подступающих к нему людей, пока они полностью не забудут свое предназначение."

 building_01_degasho_bedelam: "Дегашо Бедедам"
 building_01_degasho_bedelam_desc: "Хотя Дегашо Бедедам все еще остается великим центром роскоши, он уже не вполне соответствует стандартам боккаров былых времен. Однако даже в этой «скромной» форме он входит в число величайших дворцов наслаждений известного мира, где в своих залах собирается богатейшая элита Мегеди."

 building_01_tarfal_garden: "Сад Тарфала"
 building_01_tarfal_garden_desc: "$building_type_01_tarfal_garden_desc$"
 building_01_tarfal_garden_effect_desc: "[aspect_nature] [spellcasting_success_chance|E]:@gh_nature_icon!#positive_value; +25%#!"

 building_01_overgrown_temple: "Заросший храм"
 building_01_overgrown_temple_desc: "Когда-то это был величественный храм, посвященный Корлаку, и в его залах эхом отзывались песнопения Жречества Вечного Пламени. Однако после того, как контроль захватили наттананские еретики, они позволили природе поглотить это место в знак вызова цивилизации и промышленности. Теперь лианы душат каменную кладку, деревья пронзают алтари, а воздух гудит от дикой энергии господства Богов-Близнецов. Для них это увядание — не запущенность, а сознательное почтение к диким силам природы."
 building_01_overgrown_temple_effect_desc: "[aspect_nature] [spellcasting_success_chance|E]:@gh_nature_icon!#positive_value; +25%#!\n[aspect_stone] [spellcasting_success_chance|E]:@gh_stone_icon!#positive_value; +25%#!"
 building_type_01_overgrown_temple: "Заросший храм"

 building_01_hanging_gardens: "Висячие сады Богов-Близнецов"
 building_01_hanging_gardens_desc: "Чудо наттананского благочестия, Висячие сады служат доказательством гармонии между природой и божественным. Их каскадная зелень и яркая флора служат как священным местом, так и источником природных сил, сонастроенных с волей Богов-Близнецов."
 building_01_hanging_gardens_effect_desc: "[aspect_nature] [spellcasting_success_chance|E]:@gh_nature_icon!#positive_value; +25%#!"

 building_type_01_hanging_gardens: "Висячие сады Богов-Близнецов"
 building_type_01_hanging_gardens_desc: "Чудо наттананского благочестия, Висячие сады служат доказательством гармонии между природой и божественным. Их каскадная зелень и яркая флора служат как священным местом, так и источником природных сил, сонастроенных с волей Богов-Близнецов."

 building_01_ruins_of_thuriya_pyinnya: "Руины Сурия Пьиннья"
 building_01_ruins_of_thuriya_pyinnya_desc: "Бывший когда-то светочём просвещения и прогресса, Сурия Пьиннья теперь лежит в руинах, а его величественные залы погрузились в тишину и заросли дикими травами. Остатки его знаний и открытий ждут своего часа, чтобы быть переоткрытыми, напоминая о том, что было утеряно, когда угасло пламя промышленности."
 building_type_01_ruins_of_thuriya_pyinnya: "Руины Сурия Пьиннья"

 building_01_thuriya_pyinnya: "Сурия Пьиннья"
 building_01_thuriya_pyinnya_desc: "Сурия Пьиннья, или «Солнечная Мудрость», — это вершина корлаканского просвещения и образования. Включая в себя грандиозные библиотеки, кузницы инноваций и лекционные залы, освещаемые Вечным Пламенем, она взращивает умы и амбиции тех, кто стремится овладеть искусством прогресса."
 building_01_thuriya_pyinnya_effect_desc: "[aspect_fire] [spellcasting_success_chance|E]:@gh_fire_icon!#positive_value; +25%#!"
 building_type_01_thuriya_pyinnya: "Сурия Пьиннья"

 building_01_temple_of_wisdom: "Храм Мудрости"
 building_01_temple_of_wisdom_desc: "Восстановленный в своем прежнем величии Жречеством Вечного Пламени, этот величественный храм стоит как светоч просвещения и прогресса. В его залах эхом отзываются учения Корлаку, а его пылающие алтари символизируют торжество промышленности и порядка над хаосом. Здесь верующие собираются, чтобы искать наставления и славить величие цивилизации."
 building_01_temple_of_wisdom_effect_desc: "[aspect_fire] [spellcasting_success_chance|E]:@gh_fire_icon!#positive_value; +25%#!\n[aspect_metal] [spellcasting_success_chance|E]:@gh_metal_icon!#positive_value; +25%#!"
 building_type_01_temple_of_wisdom: "Храм Мудрости"

 building_01_forge_of_korlacu: "Кузница Корлаку"
 building_01_forge_of_korlacu_desc: "Кузница Корлаку — священное место, где Вечное Пламя горит ярче всего, воплощая союз божественной воли и человеческой изобретательности. Здесь куются орудия прогресса и оружие цивилизации, а их создание считается актом преданности Корлаку. Непрекращающийся рев кузницы и отблески раскаленного металла служат доказательством некрошимого духа промышленности, противостоящего хаосу и упадку."
 building_type_01_forge_of_korlacu: "Кузница Корлаку"
 building_type_01_forge_of_korlacu_desc: "Кузница Корлаку — священное место, где Вечное Пламя горит ярче всего, воплощая союз божественной воли и человеческой изобретельности. Здесь куются орудия прогресса и оружие цивилизации, а их создание считается актом преданности Корлаку. Непрекращающийся рев кузницы и отблески раскаленного металла служат доказательством некрошимого духа промышленности, противостоящего хаосу и упадку."

