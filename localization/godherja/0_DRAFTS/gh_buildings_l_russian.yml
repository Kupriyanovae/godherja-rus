 building_02_libraryofzheggarah: "Великая библиотека Жеггары"
 building_02_libraryofzheggarah_desc: "$building_type_02_libraryofzheggarah_desc$"

 building_02_losttempleofmesbadh: "Месбад Орин'то"
 building_02_losttempleofmesbadh_desc: "$building_type_02_losttempleofmesbadh_desc$"

 building_02_lygudista_mines: "Рудник Лигудиста"
 building_02_lygudista_mines_desc: "По мере роста поселения добывается все больше и больше руды. Приток компетентных инженеров позволяет построить полноценный рудник."

 building_02_malah_enlevettah: "Малах Энлеветта"
 building_02_malah_enlevettah_desc: "Расположенная в канарском мегаполисе Шен'идад, престижная Академия Храбрых — это место, где склонные к военному искусству могут получить систематическое образование в его принципах. Обучаемые мастерами меча и отставными командирами, адепты Малах Энлеветта часто блистают на поле боя, еще больше укрепляя славу и без того знаменитого института. С этой растущей репутацией Академия значительно расширила свои мощности, включая новые помещения для обучения кузнечному делу, а также расширенный штат инструкторов."

 building_02_malcoispalace: "Палат то Митидон"
 building_02_malcoispalace_desc: "$building_type_02_malcoispalace_desc$"

 building_02_mayaliha_mines: "Рудник Маялиха"
 building_02_mayaliha_mines_desc: "По мере роста поселения добывается все больше и больше руды. Приток компетентных инженеров позволяет построить полноценный рудник."

 building_02_mdala_hasira: "Мдала Манис"
 building_02_mdala_hasira_desc: "Мдала Манис — это крупные плантации специй, производящие различные культуры для рынка. Они часто имеют собственную охрану и обычно управляются могущественными лордами, пиратами или аристократами по всему архипелагу."

 building_02_mountainhold: "$building_01_mountainhold$"
 building_02_mountainhold_desc: "Горная Цитадель — древнее сооружение, возведенное эоны назад, хотя большая часть первоначальной конструкции давно либо была застроена, либо обрушилась с горы.\n\nСовременная Горная Цитадель берет свое начало в [Concept('kartharadd','Империи Картарадд')|E] и была построена с использованием руин древнего комплекса где-то в III веке. Крепость оказалась центром [Concept('kartharadd','картараддской')|E] власти на юге, из которого они контролировали большую часть великой речной долины. Именно здесь картараддцы отбили несколько [Concept('aversaria','аверсарианских')|E] контрвторжений во время завоевания Малькоиса, хотя [Concept('night_of_the_bleeding_moon','падение')|E] картараддской столицы далеко на севере и реформа аверсарианских легионов ааутократиром $aauto_eramos_link$ Эрамосом#! оказались фатальными, и вскоре после этого крепость стала имперским центром.\n\nС продолжающимся наступлением [Concept('the_fog','Тумана')|E] цитадель была подлатана и еще больше расширена в вероятной тщетной попытке сдерживать набеги [Concept('fogbeasts','туманных тварей')|E] и [Concept('fogeaters','туманоедов')|E]. В целом перевод службы сюда рассматривается как назначение на самый край света."

 building_02_new_iyrossi_palace: "Теутровна Зиррус"
 building_02_new_iyrossi_palace_desc: "Теутровна Зиррус возвышается как памятник возрожденному народу ийросси. Пройдя путь от скромных началов в виде неуклюже маленького королевского двора в центре сети укреплений, явно слишком больших для него, дворец наконец разросся так, чтобы идеально занять отведенное ему пространство. Комплексы храмов, королевские покои и сады теперь заполняют эту территорию, расположенные так, чтобы сосредоточить всю деятельность внутрь, к королевскому двору, откуда новый правитель свободного Митидона дает аудиенции. Народ ийросси теперь имеет памятник, способный соперничать с теми, что ненавистные [Concept('aversaria','аверсарианцы')|E] воздвигли на их украденной земле."

 building_02_oasisofgonan: "Оазис Гонан"
 building_02_oasisofgonan_desc: "$building_type_02_oasisofgonan_desc$"

 building_02_oetanai_mines: "Золотые рудники Оэтанаи"
 building_02_oetanai_mines_desc: "Хотя о золотых жилах Оэтанаи было известно давно, географическая удаленность делала их разработку нерентабельной, пока куда более доступные выработки в Оронтисе не истощились в начале XII века. Из-за серии неизбежных неудач систематическая эксплуатация началась только в 1160-х годах. Развитию препятствовали густые леса Кнотоса, а расположение шахтного ствола на значительной высоте создавало огромные трудности. Часто отмечалось, что путь к руднику был, вероятно, более опасен, чем сама работа на нем. Хаос [odrstund|E], [imperial_civil_war|E] и, наконец, [frodbrokna|E] вывели рудник из строя, так как интересы Малькоиса сместились в сторону вопросов выживания, а не эксплуатации недоразвитого высокогорного рудника. С медленным возвращением жизни в провинцию рудник был восстановлен хотя бы до уровня, предшествовавшего Фродброкне, а вокруг шахтного ствола образовался небольшой городок для постоянного проживания рабочих."

 building_02_orangepalace: "Хун фер 'т Гросдвордре"
 building_02_orangepalace_desc: "$building_type_02_orangepalace_desc$"

 building_02_ordus_mines: "Золотые рудники Ордуса"
 building_02_ordus_mines_desc: "Действовавшие еще во времена древних ийросси, жестокие каторжные работы [Concept('aversaria','аверсарианцев')|E] фактически превратили это место в массовую могилу для тех, кто когда-то сам его эксплуатировал. Шахты пришли в упадок из-за восстания рабов-ийросси, а большая часть построек была сожжена или разрушена во время масштабного мятежа. Бывшие управляющие рудников все еще здесь — их тела были бесцеремонно сброшены в шурфы вместе с трупами аверсарианских жителей нескольких близлежащих городков. Теперь, когда новые инвестиции наконец поступают, Ордус возвращается к жизни, хотя новые рабочие все еще находят скелетные останки, и место пользуется репутацией проклятого. К счастью, суеверное ворчание шахтеров ничуть не умаляет огромных количеств золота, отгружаемого с восстановленных выработок."

 building_02_paccai_mines: "Карьер Паккаи Малаи"
 building_02_paccai_mines_desc: "Высоко в облачных лесах Веллатолы, окутанный туманом, возвышается темный пик Паккаи Малаи. Именно здесь на протяжении веков в склоне вершины был вырыт огромный карьер, из которого извлекаются массивные объемы черной породы с зелеными прожилками. Кажущийся бесполезным для многих камень ковен водных [Concept('magi','магов')|E]-вародаистов за прошедшие века научился перерабатывать в чистую медь и, в меньших количествах, золото. Однако магическая добыча дает большое количество отходов, оставляя реки и леса вокруг Паккаи Малаи опустошенными и загрязненными."

 building_02_palaceofthegoldenmartyrs: "Палат то Кресо Маертирион"
 building_02_palaceofthegoldenmartyrs_desc: "$building_type_02_palaceofthegoldenmartyrs_desc$"

 building_02_palaceofthewizardking: "Священный дворец Катануксы"
 building_02_palaceofthewizardking_desc: "$building_type_02_palaceofthewizardking_desc$"
 building_02_palaceofthewizardking_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +50#!\n\n"

 building_02_phanapetra_mines: "Рудник Фанапетра"
 building_02_phanapetra_mines_desc: "По мере роста поселения добывается все больше и больше руды. Приток компетентных инженеров позволяет построить полноценный рудник."

 building_02_preachers_hill: "Собор Всех Святых"
 building_02_preachers_hill_desc: "$building_type_02_preachers_hill_desc$"

 building_02_riduvianbarrows: "Переоборудованные Ридувианские курганы"
 building_02_riduvianbarrows_desc: "Ридувианские курганы когда-то были местом упокоения первых [Concept('kartharadd','картараддских')|E] [Concept('magi','магов')|E]-императоров в Эпоху Звезд. Но даже после их разрушения в начале Эпохи Крови они оставались местом мира и удачи для народа Картараддьи. Однако после «Ночи Кровавой Луны» 748 года И. С. они были в значительной степени заброшены. В последний раз они привлеки к себе внимание во время Битвы при Ридувианских курганах, завершающего сражения Картараддских войн и финальной точки [chaos_of_the_seventh_century|E].\n\nИменно здесь картараддский зига-вортэльск («слуга-воевода», высший чин в картараддской армии) Владич Ялрион Махроанавак попытался вести переговоры о мире с [Concept('aversaria','аверсарианскими')|E] легионами, и именно здесь он и его люди были окончательно уничтожены, когда легионеры устали от его упрямого отказа от безоговорочной капитуляции."

 building_02_serpent_gate: "Ворота Змей"
 building_02_serpent_gate_desc: "$building_type_02_serpent_gate_desc$"

 building_02_seychunds_square: "Площадь Сейчунда"
 building_02_seychunds_square_desc: "$building_type_02_seychunds_square_desc$"

 building_02_silverpalace: "Восстановленный [silver_palace|E]"
 building_02_silverpalace_desc: "$building_type_02_silverpalace_desc$"

 building_02_sonas_sikelenizi: "Сонас Сикеленизи"
 building_02_sonas_sikelenizi_desc: "Благодаря инвестициям региональных лидеров Сонас Сикеленизи снова начал расширяться. Теперь, укомплектованный теми грамотными бюрократами, которых государство может себе позволить, разросшийся деревянный город снова является краеугольным камнем местной экономики."

 building_02_sophocos: "Софокос"
 building_02_sophocos_desc: "$building_type_02_sophocos_desc$"

 building_02_special_aervalr_shard: "Крупный осколок [Concept( 'aervalr', 'Эрвала' )|E]"
 building_02_special_aervalr_shard_desc: "Здесь упал довольно крупный кусок [Concept( 'aervalr', 'Эрвала' )|E] — несомненная находка для тех, кто практикует тайные искусства.\n\n#P [Concept( 'travel', 'Путешествие' )|E] в эту локацию может принести [Concept( 'artifact', 'артефакт' )|E].#!"
 building_02_special_aervalr_shard_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +20#!\n[aspect_celestial] [spellcasting_success_chance|E]:@gh_celestial_icon!#positive_value; +10%#!\n[aspect_death] [spellcasting_success_chance|E]:@gh_death_icon!#positive_value; +10%#!"

 building_02_special_bloodcrystal: "Небольшая шахта [Concept( 'bloodcrystal', 'кровавого кристалла' )|E]"
 building_02_special_bloodcrystal_desc: "Для добычи местного кровавого кристалла были организованы горные работы, на которых задействованы в основном рабы и другие избыточные или нежелательные элементы общества. Из-за крайней опасности этой работы мало кто выживает дольше одного-двух месяцев."
 building_02_special_bloodcrystal_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +20#!"

 building_02_sunarsarwena_gardens: "Огороженное святилище Сунарсарвены"
 building_02_sunarsarwena_gardens_desc: "Воздвигнуто в честь [Concept('aversaria','аверсарианской')|E] принцессы Сунарсарвены, жены мамура Юсуфа и матери мамуров Муктафи и Каима. Небольшое огороженное святилище укрылось в уголке зелени «Иклувад»."

 building_02_tabik_betemisit: "Табик Бетемисит"
 building_02_tabik_betemisit_desc: "Построенный Эшво в приготовлении к возвращению Всевышнего, Пустой дворец теперь стоит как памятник поражению моговайской веры от меча [Concept( 'wardenism', 'варденизма' )|E]. Все еще возвышаясь над окружающим городом, его великие купола и шпили внушают трепет прохожим.\n\nОднако внутри здания, где когда-то располагались боккары, осталась лишь пустая оболочка. Полагая, что сооружение предназначалось для Закутанного в капюшон Узника, вардениты обобрали интерьер, объявив такую роскошь ужасной данью уважения злому божеству. Вместо этого скверного предназначения здание было превращено в верховный суд, а его древнее библиотечное крыло осталось нетронутым. Дворец, предназначавшийся для мертвого бога и когда-то заселенный Его управляющими, теперь занят Его тюремщиками."

 building_02_the_minteries: "Монетная ловушка"
 building_02_the_minteries_desc: "$building_type_02_the_minteries_desc$"

