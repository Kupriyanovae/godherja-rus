 building_01_special_bloodcrystal_desc: "В этой области были обнаружены значительные месторождения неуловимого, магически могущественного кровавого кристалла. Рудник здесь может оказаться продуктивным, но дорогостоящим предприятием — особенно с точки зрения затрат на рабочую силу."
