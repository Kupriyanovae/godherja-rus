 building_type_01_greyport_college: "Грейпортская школа"
 building_00_greyport_college: "Руины Грейпортской школы"
 building_00_greyport_college_desc: "Выгоревший остов школы Грейпорта, колыбели бардовской традиции ритуала Банстур. Ничего ценного не уцелело, но земля освящена, а память жива."

 building_01_greyport_college: "Грейпортская школа"
 building_01_greyport_college_desc: "Эта школа была построена из остатков [GetBuilding('01_academyofswords').GetName] группой, в которую входили $korinne_ptaciv_link$, $daun_link$ и другие мыслители [Cocenpt('sjalvolki_migration','переселения')|E], чтобы каталогизировать и сохранить старые сказания в новом мире. В конечном итоге она была разрушена во время [Concept('sacking_of_greyport_college','Разграбления')|E]."

 building_03_greyport_college_rebuilt: "Восстановленная Грейпортская школа"
 building_03_greyport_college_rebuilt_desc: "Полная реконструкция оригинальной школы. Здесь сохраняются и преподаются учения ритуала Банстур, привлекая тех, кто ценит бардовское искусство, знания и практику адаптивной веры."

 building_type_01_kykopleia_ruins: "Циклопические руины"
 building_01_kykopleia_ruins: "Циклопические руины"
 building_01_kykopleia_ruins_desc: "Эти древние руины издавна возвышаются над этой частью Крехеджа — достаточно долго, чтобы их происхождение и те, кто их создал, были навсегда стерты из памяти времени. Сами руины массивны и включают в себя сооружения, построенные для людей или существ гораздо более крупных, чем люди.\n\nХотя их первоначальные строители неизвестны, они повидали немало новых обитателей. Коренные ададари Крехеджа давно сделали их своим домом, надстроив и приспособив сооружение под собственные нужды. С прибытием [Concept('aversaria', 'аверсарийцев')|E] после [war_of_all_islands|E] этот процесс перепрофилирования только закрепился: руины стали центром миграции благодаря тому, что многие связывали их с наследием [Concept('aelfir','Первых Людей')|E]."
















































































































