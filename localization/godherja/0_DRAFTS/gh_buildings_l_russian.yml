 building_01_new_iyrossi_palace: "Теутровна Зиррус"
 building_01_new_iyrossi_palace_desc: "Теутровна Зиррус стоит как памятник восстановленному народу ироссов — или, по крайней мере, таковой остается надежда. Каким бы впечатляющим он ни был, стены, окружающие этот комплекс храмов, административных зданий и королевских покоев, явно предназначены для куда более обширного дворцового района, которому еще только предстоит воплотиться в жизнь. Что бы ни готовило будущее, дворец в его нынешнем виде служит ярким свидетельством надежд народа ироссов, вступающего в новую эру."

