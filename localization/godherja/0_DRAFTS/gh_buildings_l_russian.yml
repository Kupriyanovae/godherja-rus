 building_03_lygudista_mines: "Крупный рудник Лигудиста"
 building_03_lygudista_mines_desc: "По мере того как расширяются горные работы, растут и сами рудники. Строится больше входов и выкапываются большие шахтные стволы для извлечения глубоко залегающей руды."

