########################
# METROPOLIS BUILDINGS #
########################

 building_type_metro_01: "Метрополия"
 building_type_metro_01_desc: "Крупный и густонаселенный город, давно разросшийся далеко за пределы обычного поселения."
 building_metro_01: "Крупное поселение"
 building_metro_01_desc: "Со временем это поселение росло и развивалось, превратившись в экономический центр всего окрестного региона."
 building_metro_02: "Районы и кварталы"
 building_metro_02_desc: "Улицы кишат толпами людей. По мере того как метрополия расширяется, появляются всё новые и новые кварталы."
 building_metro_03: "Бесконечные улицы"
 building_metro_03_desc: "Обладая огромным населением, метрополия раскинулась по всей окружающей местности. Люди со всех уголков стекаются на её улицы в поисках работы и лучшей жизни."
 building_metro_04: "Огромная метрополия"
 building_metro_04_desc: "Быстро развивающаяся и растущая метрополия играет ключевую роль в экономике как окрестных земель, так и всего мира."

# Generic Metro Buildings
 
 #Metro Walls
 building_type_gh_walls_01: "Стены"
 building_type_gh_walls_01_desc: "Город столь внушительных размеров и великолепия неизбежно привлекает дурное внимание. Эти стены гарантируют, что завистливые взоры упрутся лишь в холодный, неприступный камень высотой в несколько этажей."

 building_gh_walls_01: "Стена Старого города"
 building_gh_walls_01_desc: "Самое сердце метрополии укреплено прочной каменной стеной. И хотя предместья всё ещё обречены на огненную гибель при каждой вражеской осаде, знатные и важные горожане будут укрыты в полной безопасности."

 building_gh_walls_02: "Цитадель"
 building_gh_walls_02_desc: "В самом центре метрополии возведена цитадель, служащая последним оплотом обороны, а также безопасным обиталищем для правителя и его домочадцев."

 building_gh_walls_03: "Крепкие валы"
 building_gh_walls_03_desc: "Теперь стены окружают город целиком. Жители могут спать спокойно, зная, что ни одна варварская орда не сможет внезапно возникнуть ниоткуда и разграбить их квартал."

 building_gh_walls_04: "Укрепленные надвратные башни"
 building_gh_walls_04_desc: "Ворота метрополии были укреплены и превращены в полноценные надвратные башни с машикулями, бойницами, опускающимися решетками и прочими ловушками, способными причинить немало боли любому нападающему."

 building_gh_walls_05: "Оборонительные башни"
 building_gh_walls_05_desc: "Ряд башен был возведен как на обновленной стене старого города, так и на внешнем кольце укреплений. Они служат опорными пунктами, внутри которых обустроены оружейные склады для защитников."

 building_gh_walls_06: "Городской ров"
 building_gh_walls_06_desc: "Окружающий эту часть метрополии ров полезен как защитникам, так и простым жителям. Он затрудняет подход традиционных осадных орудий к воротам и стенам, а также служит источником пресной воды."

 building_gh_walls_07: "Внушительная оборона"
 building_gh_walls_07_desc: "Прежние укрепления были расширены и надстроены в высоту, отбрасывая мрачную тень на прилегающие здания. Попытка пойти на прямой штурм этого города становится крайне сомнительной затеей."

 building_gh_walls_08: "Неприступные фортификации"
 building_gh_walls_08_desc: "Фортификационные сооружения теперь настолько грандиозны, что многие армии не решатся даже на нападение. Они дарят гражданам метрополии огромную гордость и чувство безопасности. Поговаривают, что взять этот город силой без предательства изнутри попросту невозможно."

 #Metro Harbor
 building_type_harbor_01: "Гавань"
 building_type_harbor_01_desc: "Торговые корабли могут швартоваться и вести торговлю в этой метрополии, увеличивая её процветание."

 building_harbor_01: "Прибрежный пирс"
 building_harbor_01_desc: "Ряд причалов, подходящих для погрузки и разгрузки легких торговых судов, открывает метрополию большому миру."

 building_harbor_02: "Пристань"
 building_harbor_02_desc: "Служа одновременно местом стоянки и волнорезом, пристань позволяет более крупным торговым судам перевозить пассажиров и грузы прямо в метрополию."

 building_harbor_03: "Гавань"
 building_harbor_03_desc: "Сооружение, состоящее из нескольких пристаней, молов и волнорезов, позволяет множеству крупных купеческих судов беспрепятственно входить и выходить, неуклонно множа богатство метрополии."

 building_harbor_04: "Верфь"
 building_harbor_04_desc: "В гавани появилась верфь, позволяющая проводить капитальный ремонт торговых судов, что делает её излюбленным местом для стоянки."

 building_harbor_05: "Глубоководный порт"
 building_harbor_05_desc: "Акватория гавани была углублена, что позволяет крупным кораблям швартоваться прямо у пристаней, а не стоять на рейде вдали от берега."

 building_harbor_06: "Великий морской порт"
 building_harbor_06_desc: "Порт превратился во всемирный центр морской торговли. Соленый запах моря смешивается с ароматами пряностей, благовоний и редких трав, пока купеческие флотилии привозят диковинные товары со всего света."

 building_harbor_07: "Магическая инфраструктура"
 building_harbor_07_desc: "Сложное сочетание [Concept('magic','магии')|E] и механизмов возведено для облегчения транспортировки грузов и людей с пришвартованных судов прямо в метрополию."

 building_harbor_08: "Магические сухие доки"
 building_harbor_08_desc: "В порту оборудован сухой док: корабли заходят в канал, после чего с помощью чар и водопроводных систем вода откачивается, позволяя ремонтировать и обслуживать суда с небывалым удобством."

 #Metro Marketplace
 building_type_marketplace_01: "Рынок"
 building_type_marketplace_01_desc: "Жители [Concept('metro_holding','владения-метрополии')|E] собираются здесь для торговли самыми разнообразными товарами."

 building_marketplace_01: "Уличные торговцы"
 building_marketplace_01_desc: "Зазывалы и лоточники оглашают воздух криками, привлекая покупателей к своему товару. Хотя большая часть товаров местная, заморские и экзотические вещицы тоже порой попадают на эти лотки."

 building_marketplace_02: "Рыночные лавки"
 building_marketplace_02_desc: "Улицы застроены лавками, где продается всё — от дешевой еды до искусных изделий ремесленников. Здесь можно найти практически всё, что может потребоваться обычному горожанину."

 building_marketplace_03: "Рыночная площадь"
 building_marketplace_03_desc: "Жители со всего [Concept('metro_holding','владения-метрополии')|E] ежедневно заполняют площадь в поисках лучших цен и товаров, а купцы с радостью наживаются на их азарте. Оживленная атмосфера царит вокруг, а чужеземный импорт доступен как никогда."

 building_marketplace_04: "Торговые галереи"
 building_marketplace_04_desc: "Крытые пассажи защищают продавцов и покупателей от непогоды. Теперь рынок — это не просто торговый узел, но и главный центр общественной жизни."

 building_marketplace_05: "Купеческие хартии"
 building_marketplace_05_desc: "Официальные хартии защищают покупателей от несправедливых цен. Горожане стали избирательнее в своих покупках, а выросшая конкуренция подтолкнула торговцев к повышению качества и эффективности."
 
 building_marketplace_06: "Торговый центр"
 building_marketplace_06_desc: "Рынок стал бьющимся сердцем [Concept('metro_holding','владения-метрополии')|E]. Люди видят в обмене товарами не просто суровую необходимость, а сам образ жизни."

 building_marketplace_07: "Магические лавки"
 building_marketplace_07_desc: "Магия больше не заперта в стенах академий или закрытых орденов: состоятельные граждане теперь могут нанять лучших магов региона для воплощения любых своих задумок."

 building_marketplace_08: "Дворец коммерции"
 building_marketplace_08_desc: "То, что когда-то было скромным рядом деревянных лотков с крикливыми зазывалами, превратилось в величественное зрелище — сияющий памятник купеческому духу. Если какую-то вещь вообще можно купить в этом мире, её точно можно купить здесь."
 
 #Metro Clinic
 building_type_clinic_01: "Лечебница"
 building_type_clinic_01_desc: "Клиники и лечебницы способствуют росту города и служат оплотом в борьбе с распространением болезней."

 building_clinic_01: "Травники"
 building_clinic_01_desc: "Группа травников объединила усилия для более эффективного сбора ингредиентов. Это также позволяет им обмениваться знаниями о методах врачевания."

 building_clinic_02: "Благотворительная клиника"
 building_clinic_02_desc: "Местное медицинское сообщество медленно развивается за счет пожертвований горожан, из-за чего всё еще испытывает скудость в оснащении."

 building_clinic_03: "Отделение для высшего общества"
 building_clinic_03_desc: "Врачеватели завоевали добрую репутацию, и элитные клиенты потребовали открыть отдельное заведение для знати. Средства, полученные от этого отделения, позволяют существенно улучшить оснащение всех остальных клиник."
 
 building_clinic_04: "Аптека"
 building_clinic_04_desc: "Опытные алхимики и ученые прибыли в город, чтобы совершенствовать свое мастерство, принеся с собой богатые медицинские знания, чертежи инструментов и приборов."

 building_clinic_05: "Анатомический театр"
 building_clinic_05_desc: "Оборудованный вместительными аудиториями для вскрытий, этот центр стал ключевой точкой медицинских инноваций и исследований человеческого тела."

 building_clinic_06: "Больница"
 building_clinic_06_desc: "Наряду со множеством мелких клиник, рассеянных по метрополии, был возведен массивный государственный комплекс, где собраны мудрейшие врачи и лучшее оборудование, которое только можно купить за деньги."

 building_clinic_07: "Магический институт исцеления"
 building_clinic_07_desc: "Государственное финансирование позволило открыть небольшую учебную программу целительской магии, подготавливающую специалистов и повышающую качество лечения."

 building_clinic_08: "Департамент медицинских исследований"
 building_clinic_08_desc: "Городская больница настолько успешна, что при ней был создан исследовательский департамент для разработки совершенно новых методов врачевания."
 
 #Metro Gaurd Barracks
 building_type_guard_barracks_01: "Казармы стражи"
 building_type_guard_barracks_01_desc: "Под надзором местного бейлифа городские стражники патрулируют улицы, следя за соблюдением законов, задерживая преступников и поддерживая общий порядок."

 building_guard_barracks_01: "Караульное помещение"
 building_guard_barracks_01_desc: "Скромное здание, где стражники могут работать, отдыхать и спать. Оно играет ключевую роль в обеспечении правопорядка в метрополии."

 building_guard_barracks_02: "Сторожевые посты"
 building_guard_barracks_02_desc: "Стратегически размещенные по всей метрополии посты позволяют оперативно направлять небольшие отряды во все районы одновременно, что сильно сокращает время реагирования и не оставляет слепых зон для преступников."

 building_guard_barracks_03: "Караульный зал"
 building_guard_barracks_03_desc: "Вместительный зал, уставленный койками для стражников, с просторной площадкой для проведения базовых тренировок."

 building_guard_barracks_04: "Стражные патрули"
 building_guard_barracks_04_desc: "Благодаря строгому расписанию и проработанным маршрутам, строи стражников круглосуточно патрулируют улицы метрополии для предотвращения преступлений."

 building_guard_barracks_05: "Оружейная стражи"
 building_guard_barracks_05_desc: "Оружейная обеспечивает стражников доспехами и оружием, а также занимается ремонтом снаряжения, поврежденного в стычках."

 building_guard_barracks_06: "Казармы стражи"
 building_guard_barracks_06_desc: "Благодаря отдельным и хорошо финансируемым казармам городские стражники получают доступ к качественным тренировочным площадкам и мастерским, что повышает престиж службы и привлекает новых рекрутов."

 building_guard_barracks_07: "Офицерские казармы"
 building_guard_barracks_07_desc: "Стражу метрополии тренируют и ведут в бой высокопоставленные офицеры. Они пользуются улучшенными жилыми условиями и личными кабинетами для лучшей организации службы."

 building_guard_barracks_08: "Комплекс стражи"
 building_guard_barracks_08_desc: "Просторный укрепленный комплекс обеспечивает метрополию вышколенной и профессиональной стражей, способной дать отпор любым угрозам и утихомирить любые беспорядки."


 # Metro Residential
 building_type_residential_infrastructure_01: "Жилая инфраструктура"
 building_type_residential_infrastructure_01_desc: "Это когда-то тихое поселение давно превратилось в шумную, тесную общину с домами, плотно прижатыми друг к другу в самом сердце метрополии."
 
 building_residential_infrastructure_01: "Доходный дом"
 building_residential_infrastructure_02: "Общественные зоны"
 building_residential_infrastructure_03: "Укрепление конструкций"
 building_residential_infrastructure_04: "Городское зонирование"
 building_residential_infrastructure_05: "Устойчивая архитектура"
 building_residential_infrastructure_06: "Внутренние базары"
 building_residential_infrastructure_07: "Оранжереи"
 building_residential_infrastructure_08: "Метрополитенская цитадель"
 building_residential_infrastructure_01_desc: "Жители этой метрополии размещаются в крупных зданиях, спроектированных для проживания множества семей."
 building_residential_infrastructure_02_desc: "Обустроенные места для отдыха и общения превращают бывших незнакомцев в сплоченную и дружную общину."
 building_residential_infrastructure_03_desc: "Использование прочных строительных материалов и дополнительных опор укрепляет надежность всей конструкции, значительно снижая риск обрушения."
 building_residential_infrastructure_04_desc: "Комплекс был четко разделен на специализированные зоны, что облегчает передвижение и максимально эффективно использует пространство."
 building_residential_infrastructure_05_desc: "Форма зданий укреплена так, чтобы противостоять любым бедствиям и угрозам — как природным, так и [Concept('magic','магическим')|E]."
 building_residential_infrastructure_06_desc: "Торговцы и лавочники обустроили свои лотки прямо внутри комплекса, обеспечивая жильцов всеми необходимыми товарами и предметами первой необходимости."
 building_residential_infrastructure_07_desc: "Передовые купола с климат-контролем скрывают пышные сады и огороды, позволяя жителям выращивать собственную еду почти без контакта с внешним миром."
 building_residential_infrastructure_08_desc: "Сказочно богатый и полностью самодостаточный, этот комплекс превратился в настоящий город в городе, предлагающий роскошные жилые помещения для своего огромного населения."

#District Metro Buildings
 
 #Trade District - Luxury Goods
 building_type_luxury_goods_01: "Рынок предметов роскоши"
 building_type_luxury_goods_01_desc: "Растущее богатство города заложило основу для скромной торговли роскошью, предлагающей весьма скромный выбор престижных местных товаров."
 building_luxury_goods_01: "Зарождающийся рынок роскоши"
 building_luxury_goods_01_desc: "Растущее богатство города заложило основу для скромной торговли роскошью, предлагающей весьма скромный выбор престижных местных товаров."

 building_luxury_goods_02: "Ранняя фактория-эмпорий"
 building_luxury_goods_02_desc: "По мере процветания города он стал привлекать купцов из дальних земель. Теперь у богачей есть возможность покупать редкие и экзотические товары — пусть пока и в небольших количествах."

 building_luxury_goods_03: "Развивающаяся заморская торговля"
 building_luxury_goods_03_desc: "Верхушке городского общества открылся доступ к достойному выбору редких и дорогих товаров: от частей тел диковинных существ до изысканных изделий самых разных форм и размеров."

 building_luxury_goods_04: "Растущий рынок роскоши"
 building_luxury_goods_04_desc: "От драгоценных тканей и редких напитков до изысканной мебели — лучшие и самые дорогие вещи в мире можно приобрести на этом рынке за поистине безумные деньги."

 building_luxury_goods_05: "Именитый эмпорий"
 building_luxury_goods_05_desc: "Купцы со всего света готовы преодолевать огромные расстояния, чтобы привезти сюда уникальные и дорогие диковины, а затем отправиться домой, утопая в золоте."

 building_luxury_goods_06: "Экзотический эмпориум"
 building_luxury_goods_06_desc: "Горожане дивятся ослепительному разнообразию редких и иноземных товаров, доступных богатейшим из них. Все сказания далеких земель будто оживают на местных прилавках, а их красоте уступает лишь количество потраченного золота."

 building_luxury_goods_07: "Процветающая торговля роскошью"
 building_luxury_goods_07_desc: "Покупатели этого рынка, облаченные в лучшие наряды со всех [Concept('aeras','углов Эраса')|E] и попивающие напитки из легендарных земель, известны своей готовностью спускать целые состояния на экзотику — от шкур невиданных зверей до шедевров лучших мастеров."

 building_luxury_goods_08: "Базар излишеств"
 building_luxury_goods_08_desc: "Стоимости товаров, проходящих через этот рынок, хватило бы на содержание целого королевства в течение нескольких десятилетий. Дурманящий густой аромат парфюмерии, блеск золота отовсюду и буйство красок тысяч видов тканей и шелков — это место кажется настоящим раем, по крайней мере для тех, чьи кошельки не имеют дна."

 # Trade District - Merchant Guild
 building_type_merchant_guild_01: "Гильдия купцов"
 building_type_merchant_guild_01_desc: "Деньги — это кровь империй. Поддержка ремесел и организаций, укрепляющих контроль державы над капиталом города, приносит прямую выгоду."

 building_merchant_guild_01: "Налоговая контора"
 building_merchant_guild_01_desc: "В этом мрачном здании сидят люди, которых боятся больше самой смерти. Ибо какая польза от экономики, если она не платит казне свою долю?"
 
 building_merchant_guild_02: "Гильдейский зал"
 building_merchant_guild_02_desc: "Богатейшие люди города собираются здесь, чтобы обсудить наилучшие способы приумножения своего и без того огромного состояния."

 building_merchant_guild_03: "Гильдейские склады"
 building_merchant_guild_03_desc: "Члены гильдии могут использовать общие склады для временного хранения товаров, что позволяет проворачивать куда более крупные сделки, чем прежде."

 building_merchant_guild_04: "Ростовщическая контора"
 building_merchant_guild_04_desc: "Удовлетворяя вечный спрос на использование чужих средств, в городе сформировалось и окрепло целое сообщество кредиторов."

 building_merchant_guild_05: "Разветвленная сеть"
 building_merchant_guild_05_desc: "Гильдия завоевала непререкаемый авторитет, что позволяет ей вести переговоры с окрестными поселениями о монопольных контрактах на добычу ресурсов."

 building_merchant_guild_06: "Центральный банк"
 building_merchant_guild_06_desc: "Одинокий ростовщик способно удовлетворить финансовый аппетит пары дюжин транжир, но чтобы обеспечить потребности целой державы, нужен размах покрупнее."

 building_merchant_guild_07: "Региональные филиалы гильдии"
 building_merchant_guild_07_desc: "Влияние купеческой гильдии возросло еще сильнее: её филиалы открываются в других городах, обеспечивая более эффективные переговоры о пошлинах и товарах."

 building_merchant_guild_08: "Магическая связь"
 building_merchant_guild_08_desc: "Благодаря передовым магическим технологиям гильдия наладила мгновенное сообщение между своими отделениями, достигнув невиданной эффективности."
 
 #Leisure District - City Center
 building_type_city_center_01: "Городской центр"
 building_type_city_center_01_desc: "Сердце общины внутри шумной метрополии. В городском центре сосредоточены многочисленные заведения и развлечения на любой вкус."

 building_city_center_01: "Городская площадь"
 building_city_center_01_desc: "Скромная площадь, где можно встретить глашатаев, неплохие таверны и умелых пекарей. Горожане собираются здесь, чтобы пообщаться и перекусить на свежем воздухе."

 building_city_center_02: "Растущий центр"
 building_city_center_02_desc: "Площадь была расширена, благодаря чему заведения на прилегающих улицах могут лучше обслуживать растущий поток прохожих."
 
 building_city_center_03: "Расширенный сервис"
 building_city_center_03_desc: "Ремесленные мастера всех мастей открывают здесь свои лавки и предлагают услуги и обучение ремеслу по всему городскому центру."
 
 building_city_center_04: "Общественный проход"
 building_city_center_04_desc: "Пространства для досуга вроде театров и игровых площадок стали настолько популярны, что павильоны пришлось расширить. Теперь уличные праздники и бродячие труппы можно встретить по всей площади."

 building_city_center_05: "Главная площадь"
 building_city_center_05_desc: "Шумная площадь превратилась в нечто большее. Жители окрестных районов и приезжие собираются здесь для дел и отдыха, чтобы делиться новостями... и секретами."

 building_city_center_06: "Городское ядро"
 building_city_center_06_desc: "Площадь и окрестные улицы плотно застроены: извилистые переулки прорезают густую урбанистическую среду."

 building_city_center_07: "Просторные площади"
 building_city_center_07_desc: "Широкие пешеходные зоны и площади городского центра дали толчок бурному развитию индустрии развлечений. Амфитеатры и бродячие артисты процветают благодаря рекам эля из гильдии пивоваров, а горожане и путешественники приходят сюда развеять тоску."

 building_city_center_08: "Космополитичный центр"
 building_city_center_08_desc: "Шумный центр города кипит жизнью день и ночь, пока местные жители и странники стекаются сюда, чтобы приобщиться к культурным сокровищам великолепной метрополии."

 #Leisure District - Parks and Gardens
 building_type_parks_and_gardens_01: "Парки и сады"
 building_type_parks_and_gardens_01_desc: "Парки и сады поднимают дух жителей и украшают метрополию."

 building_parks_and_gardens_01: "Общественные парки"
 building_parks_and_gardens_01_desc: "Часть земли в городе оставлена зелёной: здесь выгуливают коней городской стражи и проводят общественные мероприятия."

 building_parks_and_gardens_02: "Частные сады"
 building_parks_and_gardens_02_desc: "Высшая знать начинает обустраивать собственные сады, чтобы устраивать пышные приемы и укреплять свое положение."

 building_parks_and_gardens_03: "Общественные фонтаны"
 building_parks_and_gardens_03_desc: "Появление общественных фонтанов преобразило парки, сделав их более красивыми и удобными для отдыха."

 building_parks_and_gardens_04: "Парковые пруды"
 building_parks_and_gardens_04_desc: "В некоторых парках вырыты пруды, дарящие людям возможность кататься на лодках и устраивать романтические прогулки у воды."

 building_parks_and_gardens_05: "Фруктовые деревья"
 building_parks_and_gardens_05_desc: "В парках и садах высажены плодовые деревья, дающие прохладную тень и привлекающие певчих птиц."

 building_parks_and_gardens_06: "Ботанические сады"
 building_parks_and_gardens_06_desc: "Ботанические сады возведены как живописное место для ухаживаний или уединенного отдыха от городской суеты."

 building_parks_and_gardens_07: "Фонд поддержки частных садов"
 building_parks_and_gardens_07_desc: "Создание специального фонда поощряет закладку новых садов, что повышает престиж и красоту метрополии."

 building_parks_and_gardens_08: "Менажерия"
 building_parks_and_gardens_08_desc: "В парках открылся обширный зверинец с разнообразными животными и монстрами, привезенными со всех уголков вокруг метрополии."

 # Craftsmen District - Artisan Quarters
 building_type_artisan_quarters_01: "Ремесленный квартал" 
 building_type_artisan_quarters_01_desc: "Район метрополии, в котором живут и работают преимущественно ремесленники и мастера."

 building_artisan_quarters_01: "Малые мастерские"
 building_artisan_quarters_01_desc: "Независимые ремесленники, работающие прямо на дому, составляют основу промышленного производства города."

 building_artisan_quarters_02: "Крупные мастерские" 
 building_artisan_quarters_02_desc: "Мастера расширяют свои мастерские, берут учеников и наращивают выпуск качественных товаров."

 building_artisan_quarters_03: "Квартал мастеров" 
 building_artisan_quarters_03_desc: "Объединяясь в одних и тех же районах, ремесленники создают сплоченные общины, что значительно повышает объемы производства."

 building_artisan_quarters_04: "Ремесленные гильдии"
 building_artisan_quarters_04_desc: "В квартале ремесленников появляются официальные гильдии по специализациям: кузнецы, каменщики, плотники и кожевники."

 building_artisan_quarters_05: "Склады ремесленников"
 building_artisan_quarters_05_desc: "По мере роста производства гильдейские склады обеспечивают надежное хранение товаров перед их продажей или вывозом за пределы города."

 building_artisan_quarters_06: "Мануфактурные центры"
 building_artisan_quarters_06_desc: "Метрополия стала местом объединения мастеров в крупные мануфактуры, выпускающие огромные партии товаров, востребованных по всему миру."

 building_artisan_quarters_07: "Промышленный гигант"
 building_artisan_quarters_07_desc: "Огромные фабрики метрополии дают работу ордам рабочих и ремесленников, производя товары в количествах, доступных для потребления только гигантскому городу."

 building_artisan_quarters_08: "Магические улучшения"
 building_artisan_quarters_08_desc: "Оснащение фабрик магическими кранами и чарами позволило достичь непревзойденного качества и объема выпускаемой продукции."

 #Craftsmen District - Waterworks
 building_type_metro_waterworks_01: "Городской водопровод"
 building_type_metro_waterworks_01_desc: "Система инфраструктуры в крупных поселениях, предназначенная для бесперебойной подачи свежей воды по всему городу."

 building_metro_waterworks_01: "Аведкуки"
 building_metro_waterworks_01_desc: "Извилистая система акведуков доставляет свежую воду в различные точки города для общего пользования."

 building_metro_waterworks_02: "Первые купальни"
 building_metro_waterworks_02_desc: "В городе открылось несколько общественных купален, где горожане могут отдохнуть и вымыться."

 building_metro_waterworks_03: "Базовая канализация"
 building_metro_waterworks_03_desc: "Неизбежное следствие скопления множества людей — отходы, которые скапливаются на улицах, если их не утилизировать. Канализационная система если и не решает проблему полностью, то существенно ее снижает."

 building_metro_waterworks_04: "Ограниченный водопровод"
 building_metro_waterworks_04_desc: "Большинство важных зданий города и некоторые общественные места получили доступ к проточной свежей воде."

 building_metro_waterworks_05: "Разветвленная канализация"
 building_metro_waterworks_05_desc: "Благодаря обширной сети сточных каналов и подземных тоннелей отходы жителей удаляются вполне гигиеничным образом."

 building_metro_waterworks_06: "Общественные бани"
 building_metro_waterworks_06_desc: "В городе работает множество крупных общественных бань, дающих почти всем горожанам доступ к чистой воде и служащих важным местом для общения."

 building_metro_waterworks_07: "Расширенный водопровод"
 building_metro_waterworks_07_desc: "Хотя водопровод еще не повсеместен, многие здания и общественные места города получили надежный источник проточной воды."

 building_metro_waterworks_08: "Повсеместный водопровод"
 building_metro_waterworks_08_desc: "Городской водопровод наконец достигает такого уровня развития, при котором почти в каждом доме есть проточная свежая вода."

 #Martial District - Arena
 building_type_arena_01: "Арена"
 building_type_arena_01_desc: "Хлеб и зрелища умиротворяют массы, и ни одно зрелище не захватывает их так, как кровавые игры."

 building_arena_01: "Бойцовские ринги"
 building_arena_01_desc: "Местные жители сменяют дни изнурительного труда ночами кулачных боев. Вспешке выложенный круг из неотесанных камней становится ареной, где бойцы меряются силами, пока дельцы принимают ставки."

 building_arena_02: "Местные турниры"
 building_arena_02_desc: "Более организованные состязания: участники распределяются по сетке, а турниры проводятся регулярно."

 building_arena_03: "Арена"
 building_arena_03_desc: "Вместительный амфитеатр заполнен толпой, жаждущей крови. Наемники, отдыхающие солдаты и гладиаторы сражаются в командных боях, рискуя жизнью ради рева восторженных зрителей."

 building_arena_04: "Великие турниры"
 building_arena_04_desc: "Воины со всего света сходятся в битве за славу. Разрешение на торговлю на территории турнира стоит целое состояние, ведь тысячи азартных горожан спешат потратить свое золото. Турниры стали настолько прибыльными, что теперь включают состязания по стрельбе из лука, метанию копий, дуэли магов и имитации осад."

 building_arena_05: "Ипподром"
 building_arena_05_desc: "Внушительный ипподром принимает конные скачки и шумных, хмельных зрителей. Драки на трибунах здесь вспыхивают не реже, чем на самом поле, и часто оказываются куда более кровавыми."

 building_arena_06: "Колизей"
 building_arena_06_desc: "Способный вместить целые армии, этот колизей видел всё — от постановочных сражений до морских битв на настоящих галерах."

 building_arena_07: "Маготехнический колизей"
 building_arena_07_desc: "Сложный сплав [Concept('magic','магии')|E] и механизмов в разы повышает зрелищность боев. Одних только спецэффектов достаточно, чтобы продавать билеты с огромной наценкой, не говоря уже о масштабах самих сражений."

 building_arena_08: "Легендарная арена"
 building_arena_08_desc: "Невообразимый размах и качество этой арены делают её посещение поистине незабываемым зрелищем. Не один иноземный владыка заплатил кругленькую сумму за хорошее место на трибуне. Армия рабочих, [Concept('magi','магов')|E] и особых машин поддерживает работу арены, позволяя устраивать битвы титанических масштабов, а сотрудничество с гильдиями драматургов позволяет органично вплетать в бои эпические пьесы.\n\nПомимо прочего, арена принимала многодневные реконструкции знаменитых сражений разных эпох со всех [Concept('aeras','углов Эраса')|E]!"

 #Administrative District - Embassy
 building_type_embassy_01: "Посольство"
 building_type_embassy_01_desc: "Армии и казармы хороши в военное время, но именно посольства поддерживают каналы связи между державами мира, давая людям слова шанс сохранить мир."

 building_embassy_01: "Покои для гостей"
 building_embassy_01_desc: "После долгого пути по бездорожью и сквозь непогоду мы можем предложить прибывающим сановникам горячую купальню, мягкую постель и крепкий напиток."

 building_embassy_02: "Канцелярии посланников"
 building_embassy_02_desc: "Выделив отдельное помещение для работы иностранных посланников, можно вывести дипломатическое искусство на новый уровень и перейти к обсуждению куда более сложных соглашений."

 building_embassy_03: "Дипломатический квартал"
 building_embassy_03_desc: "По мере того как наши международные связи растут в качестве и количестве, выделение дополнительных помещений и удобств для иностранных дипломатов сделает их визиты более продолжительными и комфортными."

 building_embassy_04: "Временные посольства"
 building_embassy_04_desc: "Ряд зданий отведен для проживания иностранных дипломатов на время переговоров и заключения торговых сделок, альянсов или проведения магических диспутов."

 building_embassy_05: "Постоянные посольства"
 building_embassy_05_desc: "С учреждением постоянных посольств близких и далеких держав присутствие официальных послов при нашем дворе позволит дипломатическим отношениям работать как часы, улаживая споры до того, как они перерастут в конфликты."

 building_embassy_06: "Культурные выставки"
 building_embassy_06_desc: "В метрополии рядом с постоянными посольствами возводятся театры, позволяющие знакомить горожан с диковинными обычаями других стран, а также демонстрировать собственное культурное наследие."

 building_embassy_07: "Роскошные посольства"
 building_embassy_07_desc: "Каждое посольство теперь служит великолепным символом нации и культуры, которую оно представляет, выделяясь уникальным убранством."

 building_embassy_08: "Магическая связь"
 building_embassy_08_desc: "Современная маготехника обеспечивает мгновенную связь на больших расстояниях между послами, их родными государствами и другими дипмиссиями, помогая разрешать разногласия в зародыше."

 #Administrative District - Treasury
 building_type_treasury_01: "Казначейство"
 building_type_treasury_01_desc: "В казначействе трудятся клерки и писцы, необходимые для функционирования цивилизованного общества, а также хранится богатство региона."

 building_treasury_01: "Контора клерка"
 building_treasury_01_desc: "Грамотный человек, сведущий в законах, нанят местным правителем. Он помогает общине в делах, слишком сложных для простого крестьянина, но слишком банальных, чтобы знать занималась ими лично."

 building_treasury_02: "Сводчатое хранилище"
 building_treasury_02_desc: "По мере расширения казначейства было построено надежное хранилище для защиты средств, полученных от сбора налогов и торговли."

 building_treasury_03: "Монетный двор"
 building_treasury_03_desc: "С ростом метрополии требуется больше монет для поддержания экономической активности. Металлообрабатывающие мастерские обеспечивают их чеканку."

 building_treasury_04: "Квартал писцов"
 building_treasury_04_desc: "Писцы ведут учет имущества, дебиторской задолженности, контрактов, указов и законов, гарантируя порядок в обществе."

 building_treasury_05: "Ведомство жалования"
 building_treasury_05_desc: "Разрастание метрополии сделало необходимым создание отдельного ведомства для учета и выплаты жалования государственным служащим."

 building_treasury_06: "Лицензионное ведомство"
 building_treasury_06_desc: "Казначейство получает дополнительный доход за счет выдачи лицензий на строительство и иные виды деятельности, что попутно повышает общее качество застройки."

 building_treasury_07: "Облигации и займы метрополии"
 building_treasury_07_desc: "Казначейство начинает выдавать кредиты предприятиям и торговым гильдиям для развития экономики и получения прибыли, а также выпускает облигации для быстрого привлечения средств при необходимости."

 building_treasury_08: "Магические улучшения"
 building_treasury_08_desc: "Теперь, когда казначейство процветает, искусные зачарователи и магические инженеры привлечены для укрепления самого здания и повышения эффективности работы его служащих."

 building_type_commercial_hub_01: "Торговый центр"
 building_commercial_hub_01: "Площадь торговцев"
 building_commercial_hub_01_desc: "Скромный, но растущий торговый центр в самом сердце метрополии."
 building_commercial_hub_02: "Рыночная площадь"
 building_commercial_hub_02_desc: "Инвестиции в инфраструктуру и рост торговли позволили открыть множество рынков и лавок, обслуживающих шумное население."
 building_commercial_hub_03: "Великая ярмарка"
 building_commercial_hub_03_desc: "Огромная сеть улиц и площадей, гудящая от торговли и движения. Здесь покупается, продается и производится практически любой товар или услуга."
 building_commercial_hub_04: "Огромный базар"
 building_commercial_hub_04_desc: "Биение сердца торговли целого континента тесно переплелось с жизнью метрополии, опутывая её районы словно паутина."

 building_type_center_of_wisdom_01: "Центр мудрости"
 building_center_of_wisdom_01: "Молитвенная улица"
 building_center_of_wisdom_01_desc: "В метрополии возведено или включено в её черту несколько храмов, которые служат как для поклонения, так и для хранения знаний."
 building_center_of_wisdom_02: "Обители знаний"
 building_center_of_wisdom_02_desc: "Пока силуэты храмов и шпили украшают город, по всему региону открывается множество других интеллектуальных заведений."
 building_center_of_wisdom_03: "Ученые пространства"
 building_center_of_wisdom_03_desc: "Регион пользуется высочайшим уважением в научных кругах. Тысячи людей стекаются сюда, чтобы молиться, учиться и вести дискуссии о теологии, философии и других науках."
 building_center_of_wisdom_04: "Преподобные институты"
 building_center_of_wisdom_04_desc: "Во всей державе мало найдется мест более святых или просвещенных, чем этот район. Он задает тон во всем, что касается веры, знаний и науки."

