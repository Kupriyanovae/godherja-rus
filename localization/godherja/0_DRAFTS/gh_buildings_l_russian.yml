 building_01_creonta_mines: "Шахтерское поселение Креонта"
 building_01_creonta_mines_desc: "С завоеванием народа ийросси [Concept('aversaria','аверсарианцами')|E] ценность соли была открыта вновь. Но для обычного современного аверсарианца соль стала чем-то само собой разумеющимся. Озеро в центре земель ийросси обеспечивает почти все соляные потребности. Со сменой сезонов воды озера отступали, обнажая многочисленные и богатые соляные пласты. Множество рабов погибло под палящим солнцем, добывая кристаллы соли. Аверсарианским хозяевам было всё равно: у них были сроки и график до конца сезона, а жизнь раба — лишь цифра. Однако с недавней дестабилизацией региона на руднике работают только те, кому за это платят."

