 building_01_house_of_ohrasik: "Дом Охрасика"
 building_01_house_of_ohrasik_desc: "Занимая господствующее положение на верхнем ярусе, Дом Охрасика представляет собой массивный храм-крепость, возведенный на протяжении веков верными ахридаристами. Говорят, что именно в этом храме Охрасик впервые сошел на землю и именно отсюда начал свою войну против дьяволов. Ныне принято, чтобы [Concept('malaak','малааки')|E] владели Домом Охрасика и правили из него."

 building_01_huraihr: "Хурайхр"
