 building_01_towers_of_pytheceas: "Башни Пифея"
 building_01_towers_of_pytheceas_desc: "$building_type_01_towers_of_pytheceas_desc$"

 building_01_turayyil_mines: "Шахтерское поселение Турайиль"
 building_01_turayyil_mines_desc: "Серебряный рудник Турайиль был открыт недавно, а добыча началась лишь под эгидой [Concept('aversaria','аверсарианского')|E] наместника Тетедакса 'Златоносого' в 943 году И. С. Учитывая огромные размеры провинции Айроной и отсутствие безопасных судоходных рек, горнодобывающие предприятия полагались на медленный и уязвимый сухопутный транспорт, чтобы отправлять добычу в безопасные аверсарианские порты на побережье. Поэтому наместники Айроной сильно зависели от местных эльтенских и кикарсагских защитников, поддерживавших производительность и прибыльность их самого ценного актива. Взамен те получали долю добычи, которая широко распространялась по степи для изготовления религиозных масок, распространенных среди обоих народов."

 building_01_umlojtemplecomplex: "Ковенант Умлоджа"
 building_01_umlojtemplecomplex_desc: "$building_type_01_umlojtemplecomplex_desc$"

 building_01_universityofgiherehalwajaf: "Манзи Альфайнсуфи"
 building_01_universityofgiherehalwajaf_desc: "$building_type_01_universityofgiherehalwajaf_desc$"

 building_01_velostadd: "Велостадд"
 building_01_velostadd_desc: "$building_type_01_velostadd_desc$"

 building_01_vilunnak_mines: "Шахтерское поселение Вилуннак Сатра"
 building_01_vilunnak_mines_desc: "Расположенный в затонувшей речной долине, горнодобывающий комплекс в Вилуннак Сатра производит наибольшее количество алмазов и других драгоценных камней в Каширии. Поселение, название которого на местном диалекте означает «Поле звезд», обязано своим минеральным богатством, как говорят, древней битве, произошедшей в этом регионе, в ходе которой могущественный [Concept('magi','маг')|E] призвал упавшую звезду, чтобы поразить своих врагов. Маг выиграл битву, а поле, где стоял его противник, превратилось в почерневшую равнину, усыпанную астральными самоцветами. Сегодня вилуннакские алмазы украшают короны многих каширийских монархов, а безделушки с этими потрясающими камнями стоят огромных денег по всему востоку."

