 building_02_irochi_damotada: "Ирочи Дамотада"
 building_02_irochi_damotada_desc: "С частично пополненной библиотекой и расширенным гарнизоном Ворота Дамоты теперь действительно выполняют свое двойное назначение. Практически ни один торговец не может войти в Дамоту, не пройдя через них (и не заплатив требуемую пошлину), а моговай стекаются со всей Дамоты, чтобы почерпнуть духовные знания из опыта своих братьев-Искателей."

