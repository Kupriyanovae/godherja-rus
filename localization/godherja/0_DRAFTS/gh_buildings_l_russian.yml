 building_00_lich_elysian_pass: "Опечаленный Элисийский проход"
 building_00_lich_elysian_pass_desc: "$building_type_00_lich_elysian_pass_desc$"

 building_00_lich_eternal_grove: "Опечаленная Вечная роща"
 building_00_lich_eternal_grove_desc: "Глубоко в сердце Зеленоморья лежит Вечная роща — священный центр партической веры. В ее пределах растет Дриоганн Дтохт, Древо Мира. Черпая силу из огромных залежей [Concept('bloodcrystal','кровавого кристалла')|E], узловатые корни Дриоганн Дтохт пульсируют красным магическим светом, проникая, кажется, в самое ядро [Concept('aeras','Эраса')|E].\n\nС продвижением вторжения [Concept('liches','Лича')|E] Вечная роща стала темной и мертвой, а ее почва больше непригодна для жизни. Кора Древа Мира превратилась в иссиня-черный камень. И все же Дриоганн Дтохт все еще стоит, ведь глубоко-глубоко внутри все еще слышен биение Древа Мира.#!"
 building_00_lich_eternal_grove_effect_desc: "[aspect_celestial] [spellcasting_success_chance|E]:@gh_celestial_icon!#positive_value; +5%#!"

