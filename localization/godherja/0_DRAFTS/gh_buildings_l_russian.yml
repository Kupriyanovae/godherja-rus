 building_04_lygudista_mines: "Добывающий комплекс Лигудиста"
 building_04_lygudista_mines_desc: "По мере роста добычи руды вокруг поселения возводятся новые литейные и плавильные цеха. Обработка металла стала для жителей второй природой, а их мастерство славится по всему известному миру."

 building_04_mayaliha_mines: "Добывающий комплекс Маялиха"
 building_04_mayaliha_mines_desc: "По мере роста добычи руды вокруг поселения возводятся новые литейные и плавильные цеха. Обработка металла стала для жителей второй природой, а их мастерство славится по всему известному миру."

 building_04_oetanai_mines: "Золотодобывающий комплекс Оэтанай"
 building_04_oetanai_mines_desc: "Хотя о золотых жилах Оэтаная было известно с давних времён, географическая удалённость делала их нерентабельными до тех пор, пока в начале двенадцатого века не были истощены куда более доступные разработки в Оронтисе. Из-за серии неизбежных неудач систематическая разработка началась только в 1160-х годах. Развитию препятствовали густые леса Кнотоса, а расположение шахты на значительной высоте создавало огромные трудности. Часто отмечалось, что путь до рудника, скорее всего, был опаснее, чем сама работа на нём. Хаос [odrstund|E], [imperial_civil_war|E] и, наконец, [frodbrokna|E] разорили рудник, так как интересы Малкойса сместились с разработки недоразвитой альпийской шахты на вопросы выживания. С медленным возвращением жизни в провинцию золотой рудник Оэтанай снова начал развиваться. Поселение, ютящееся у входа в шахту, начинает заполнять плато, на котором расположено. Дороги, ведущие к месторождению, теперь дополнены внушительной системой блоков и канатов, чтобы сделать транспортировку туда и обратно гораздо безопаснее и быстрее. Рудники Оэтанай наконец-то выросли из дикой мечты в региональный институт." 

 building_04_ordus_mines: "Золотодобывающий комплекс Ордус"
 building_04_ordus_mines_desc: "Работавшие ещё во времена старого Ийроссиса, жестокие каторжные работы [Concept('aversaria','аверсарианцев')|E] фактически превратили это место в братскую могилу для тех, кто когда-то сам его эксплуатировал. Шахты пришли в упадок из-за восстания рабов Ийросси, а большая часть выработок была сожжена или разрушена во время этого масштабного мятежа. Бывшие управляющие рудников всё ещё здесь — их тела были бесцеремонно сброшены в ямы вместе с телами аверсарианских жителей нескольких близлежащих городов. Теперь, наконец, Ордус не просто восстановлен до уровня развития перед [frodbrokna|E], но и превзошёл его: паутина пересекающихся шахтных стволов обеспечивает одну из самых прибыльных операций по добыче золота на [aeras|E]. Это ничуть не исправило дурную репутацию Ордуса, и слухи об исчезновениях среди шахтёрских бригад и жутких призраках всё ещё ползут повсюду."

 building_04_paccai_mines: "Карьерный комплекс Паччаи Малай"
 building_04_paccai_mines_desc: "Высоко в облачных лесах Веллатолы, окутанный туманом, возвышается тёмный пик Паччаи Малай. Именно здесь на протяжении веков в склоне вершины вырыт огромный карьер, из которого извлекаются массивные объёмы чёрной породы с зелёными прожилками. Кажущийся бесполезным для многих камень кабала вародаистских [magi|E] воды за столетия научилась перерабатывать в чистую медь и, в меньших количествах, золото. Однако магическая добыча производит огромное количество отходов, оставляя реки и леса вокруг Паччаи Малай опустошёнными и загрязнёнными."

