 building_01_ordus_mines: "Развалины золотого рудника Ордус"
 building_01_ordus_mines_desc: "Действовавшие еще во времена древних ироссов, эти каторжные работы благодаря жестокости [Concept('aversaria','аверсарианцев')|E] превратились в массовую могилу для тех, кто когда-то сам их эксплуатировал. В последние годы рудники пришли в упадок из-за восстания рабов-ироссов, причем большая часть выработок была сожжена или разрушена во время масштабного мятежа. Бывшие управляющие рудников все еще здесь — их тела были бесцеремонно сброшены в шахты вместе с трупами аверсарианских жителей из нескольких близлежащих городков."

 building_01_paccai_mines: "Карьерной рудник Паккай Малай"
 building_01_paccai_mines_desc: "Высоко в облачных лесах Веллатолы, окутанный туманом, возвышается темный пик Паккай Малай. Именно здесь за долгие века на склоне вершины был вырыт огромный карьер, из которого извлекаются массивные объемы черной породы с зелеными прожилками. Казалось бы бесполезная для многих, кабала водных [magi|E] вародаистов на протяжении веков доводила до совершенства искусство извлечения чистой меди и, в меньших количествах, золота из этой руды. Однако магические процессы извлечения образуют огромное количество отходов, к сожалению, оставляя реки и леса вокруг Паккай Малай опустошенными и загрязненными."

