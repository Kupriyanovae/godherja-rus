 building_00_mayaliha_mines: "Солончаки Маялихи"
 building_00_mayaliha_mines_desc: "Осушенные озерные ложа Маялихи, на которых пустынные племена издавна добывали соль. Ничего для полноценной эксплуатации этих мест здесь еще возведено не было."
 building_01_mayaliha_mines: "Шахтерское поселение Маялиха"
 building_01_mayaliha_mines_desc: "Если соляные рудники Креонты были единственным поставщиком для всей [aversaria|E], то рудники Маялихи — это жизненная сила [sarradon|E]. Высохшие озера использовались местными пустынными племенами с незапамятных времен, благодаря чему их пища хранилась в десять раз дольше обычного. В наши дни объект активно эксплуатируется в коммерческих целях, а его казалось бы нескончаемые продукты отправляются в близлежащий мегаполис Кудаххбар, откуда продаются и развозятся во все уголки мира, оказываясь везде — от дворцов Амсарского Хиклана до наместников Опахасии."

