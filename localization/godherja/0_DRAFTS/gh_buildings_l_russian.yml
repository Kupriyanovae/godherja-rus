 building_01_oetanai_mines: "Месторождения золота Оэтанай"
 building_01_oetanai_mines_desc: "Хотя о них было известно веками, географическая удаленность золотых жил Оэтанай делала их нерентабельными вплоть до истощения куда более доступных выработок в Оронтисе в начале двенадцатого века. Из-за серии неизбежных неудач систематическая эксплуатация началась только в 1160-х годах. Развитию мешали густые леса Кнотоса, а расположение шахты на значительной высоте создавало огромные трудности. Часто отмечали, что путь к руднику, вероятнее всего, смертоноснее, чем сама работа на нем. Хаос [odrstund|E], [imperial_civil_war|E] и, наконец, [frodbrokna|E] вывели рудник из строя, так как интересы Малькоиса сместились от разработки неразвитого альпийского рудника к вопросам выживания. Поскольку жизнь медленно возвращается в провинцию, еще неизвестно, будут ли рудники Оэтанай открыты вновь — и если да, то кем?"

