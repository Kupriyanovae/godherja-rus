 building_01_sonas_sikelenizi: "Сонас Сикеленизи"
 building_01_sonas_sikelenizi_desc: "Со спадом дамотанской торговли после [etami_tetenik|E] Сонас Сикеленизи переживает период упадка: несколько древних секций сооружения так и не были заменены, и им позволили просто уплыть вниз по течению. Бюрократия здесь также пришли в упадок и продолжает существовать лишь из чистой необходимости и инерции."

