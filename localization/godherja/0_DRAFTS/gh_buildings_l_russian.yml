 building_00_sunarsarwena_gardens: "Разрушенное святилище Сунарсарвены"
 building_00_sunarsarwena_gardens_desc: "$building_type_00_sunarsarwena_gardens_desc$"

 building_00_tombofthesaints: "Разрушенный Тафон то Агионис"
 building_00_tombofthesaints_desc: "$building_type_00_tombofthesaints_desc$"

 building_00_umlojtemplecomplex: "Разрушенный Завет Умлоджа"
 building_00_umlojtemplecomplex_desc: "Когда-то здесь располагалась одна из самых религиозно разнообразных общин на [Concept('aeras','Эрасе')|E] — центр торговли и убежище для преследуемых меньшинств. Ныне не осталось ничего, кроме разбитых идолов и разрушенных храмов десятков верований, чьи последователи объединились в смерти так же, как были едины при жизни."

 building_00_walls_of_qarmuz: "Разрушенные стены Кармуза"
 building_00_walls_of_qarmuz_desc: "$building_type_00_walls_of_qarmuz_desc$"

