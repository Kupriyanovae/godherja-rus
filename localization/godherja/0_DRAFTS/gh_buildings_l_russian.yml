 building_01_burning_palace: "Горящий дворец"
 building_01_burning_palace_desc: "$building_type_01_burning_palace_desc$"
 building_01_burning_palace_effect_desc: "[aspect_fire] [spellcasting_success_chance|E]:@gh_fire_icon!#positive_value; +25%#!"
 
 building_01_temple_of_korlacu: "Храм Огня Корлаку"
 building_01_temple_of_korlacu_desc: "Когда-то заброшенный и оскверненный, Храм Огня Корлаку теперь пылает с новой силой. Посвященный Вечному Пламени, этот священный объект служит как местом поклонения, так и оплотом корлаканской стойкости, доказывая, что вера и промышленность способны вернуть то, что было отнято дикой природой."
 building_01_temple_of_korlacu_effect_desc: "[aspect_fire] [spellcasting_success_chance|E]:@gh_fire_icon!#positive_value; +25%#!\n[aspect_metal] [spellcasting_success_chance|E]:@gh_metal_icon!#positive_value; +25%#!"

 building_01_ruins_of_korlacu: "Разрушенный храм Корлаку"
 building_01_ruins_of_korlacu_desc: "В наказание корлаканцам за поклонение Корлаку, Несущему Огонь, наттананы разрушили великий Храм Огня, который когда-то стоял на этом месте."

 building_01_forsaken_fortress: "Заброшенная крепость Корлаку"
 building_type_01_forsaken_fortress: "Заброшенная крепость Корлаку"
 building_type_01_forsaken_fortress_desc: "Бывшая когда-то могущественной резиденцией Корлаку, Вечного Пламени, теперь лежит в руинах, а ее осыпающиеся стены и разрушенные залы служат мрачным напоминанием о былом величии. Во время одной свирепой осады наттананы обрушили на крепость всю мощь самих джунглей. Огромные корни раскалывали ее фундамент, цепкие лианы удушали ее оборону, а стада диких зверей заполонили цитадель. Теперь природа правит безраздельно: сочная зелень поглощает руины, а звуки нетронутой глуши эхом отдаются в ее заброшенных коридорах."
 building_01_forsaken_fortress_desc: "Бывшая когда-то могущественной резиденцией Корлаку, Вечного Пламени, теперь лежит в руинах, а ее осыпающиеся стены и разрушенные залы служат мрачным напоминанием о былом величии. Во время одной свирепой осады наттананы обрушили на крепость всю мощь самих джунглей. Огромные корни раскалывали ее фундамент, цепкие лианы удушали ее оборону, а стада диких зверей заполонили цитадель. Теперь природа правит безраздельно: сочная зелень поглощает руины, а звуки нетронутой глуши эхом отдаются в ее заброшенных коридорах."
 building_01_forsaken_fortress_effect_desc: "[aspect_fire] [spellcasting_success_chance|E]:@gh_fire_icon!#positive_value; +25%#!\n[aspect_metal] [spellcasting_success_chance|E]:@gh_metal_icon!#positive_value; +25%#!"

 building_01_restored_fortress: "Восстановленная крепость Корлаку"
 building_type_01_restored_fortress: "Восстановленная крепость Корлаку"
 
 building_01_restored_fortress_desc: "Когда-то брошенная на произвол гнева природы, крепость была кропотливо восстановлена в своем прежнем величии. Ее стены, укрепленные камнем и украшенные пышной зеленью, служат свидетельством стойкости и гармонии. Шрамы от ее разрушения наттананами остаются видимыми, сохранившись как напоминание о прошлом, пока в ее залах снова раздаются шаги тех, кто стремится вернуть ее наследие."
 building_01_restored_fortress_effect_desc: "[aspect_fire] [spellcasting_success_chance|E]:@gh_fire_icon!#positive_value; +25%#!\n[aspect_metal] [spellcasting_success_chance|E]:@gh_metal_icon!#positive_value; +25%#!"

 building_01_renewed_fortress: "Цитадель Железного Пламени"
 building_type_01_renewed_fortress: "Цитадель Железного Пламени"
 building_01_renewed_fortress_desc: "Вырвавшись из цепких лап диких джунглей, крепость была обновлена как триумфальный символ господства цивилизации. Ее стены, перекованные из несокрушимого камня и стали, теперь сияют светом бесчисленных огней, отгоняющих дикую природу. Заросли срублены, наступающие корни сожжены дотла, а в залах снова раздаются звуки промышленности и порядка. Оплот огня и металла, она стоит как доказательство воли человечества покорить и укротить даже самые неукротимые силы природы."
 building_01_renewed_fortress_effect_desc: "[aspect_fire] [spellcasting_success_chance|E]:@gh_fire_icon!#positive_value; +25%#!\n[aspect_metal] [spellcasting_success_chance|E]:@gh_metal_icon!#positive_value; +25%#!"

 building_type_01_korlacan_mines: "Корлаканские рудники"
 building_01_korlacan_mines: "Разрушенные рудники Корлаку"
 building_01_korlacan_mines_desc: "Когда-то процветающий центр промышленности и богатства, рудники Корлаку теперь лежат в руинах, их тоннели обрушились, а механизмы сгнили и заржавели. Природа начала возвращать свое: ползучий мох и стоячие лужи заполняют заброшенные шахты. Эхо труда давно утихло, сменившись жуткой тишиной, которая служит мрачным напоминанием об утерянной силе и амбициях империи."

 building_type_02_korlacan_mines: "$building_type_01_korlacan_mines$"
 building_02_korlacan_mines: "Частично восстановленный корлаканский рудник"
 building_02_korlacan_mines_desc: "Частично восстановленные после долгих лет запустения, глубоко под землей корлаканские рудники снова раскинулись подобно лабиринту амбиций и мастерства. Эти рудники — доказательство корлаканского мастерства в металлургии, добыче драгоценных металлов и редких самоцветов из твердого камня. В воздухе эхом отдается непрерывный звон кирок и рев печей, пока огонь и обработка металла превращают сырую руду в сокровища, питающие могущество цивилизации и империй. Рудники стоят как символ способности цивилизации вырывать богатство и славу из самого сердца земли."

 building_type_03_korlacan_mines: "$building_type_01_korlacan_mines$"
 building_03_korlacan_mines: "Обновленный корлаканский рудник"
 building_03_korlacan_mines_desc: "Восстановленный в своем прежнем величии, корлаканский рудник снова процветает как светоч промышленности и амбиций. Его тоннели укреплены, печи горят ярко, а шум труда разносится по его глубинам. Драгоценные руды и самоцветы непрерывно поступают из недр земли, питая возрождение могущества и процветания цивилизации. Обновленный рудник стоит как доказательство изобретательности, упорства и несломимого духа прогресса."

 building_type_04_korlacan_mines: "$building_type_01_korlacan_mines$"
 building_04_korlacan_mines: "Большой корлаканский рудник"
 building_04_korlacan_mines_desc: "Сердце корлаканского горнодобывающего промысла, этот грандиозный комплекс служит как центром промышленности, так и символом власти. Массивные подземные подземелья испещрены жилами драгоценных металлов, а возвышающиеся дымовые трубы выбрасывают в небо ровный шлейф промышленного дыма. Умелые рабочие трудятся без устали, превращая сырую руду в бесценные ресурсы, продающиеся по астрономическим ценам на рынках по всему [Concept('aeras','Эрасу')|E]. Рудник стоит как памятник господству цивилизации над землей, где огонь, металл и упорство формируют будущее."

 building_type_05_korlacan_mines: "$building_type_01_korlacan_mines$"
 building_05_korlacan_mines: "Великие рудники Священного Пламени"
 building_05_korlacan_mines_desc: "В самом сердце горнодобывающего комплекса лежат Великие рудники Священного Пламени — колоссальная сеть тоннелей и кузниц, где огонь и металл сходятся в священном союзе. Под землей раскаленные реки лавы питают печи, плавящие богатейшие руды, а священное пламя, символ корлаканского могущества, вечно горит в их центре. Эти рудники — не только источник богатства, но и духовный центр, где считается, что жар кузницы очищает душу и укрепляет устои империи."

 building_dergi_garden_01: "Искусственный сад дергов"
 building_dergi_garden_01_desc: "За этими садами заботливо ухаживают группы искусных садовников, пышно взращивая их с помощью магии. В этом центре красоты можно найти растения со всего [Concept('aeras','Эраса')|E]."

 building_01_dielecport: "Диэлеспорт"
 building_01_dielecport_desc: "$building_type_01_dielecport_desc$"

 building_01_dihasma_xiidan: "Дихасма Ксидан"
 building_01_dihasma_xiidan_desc: "С падением [Concept('boqqarut_damotada','Боккарута')|E] Дихасма Ксидан превратилась в тень самой себя, обменивая имеющиеся у нее воинские знания и службу оставшихся солдат на автономию от местных правителей."

