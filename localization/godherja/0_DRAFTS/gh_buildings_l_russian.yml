 building_02_four_cliffs_five_walls_desc: "$building_type_02_four_cliffs_five_walls_desc$"

 building_02_gisreddeport: "Гисреддепорт"
 building_02_gisreddeport_desc: "$building_type_02_gisreddeport_desc$"

 building_02_golgelea_mines: "Серебряные рудники Гольгелеи"
 building_02_golgelea_mines_desc: "Расположенные в предгорьях гор Айроной, серебряные рудники Гольгелеи на протяжении веков были желанной добычей как для [Concept('aversaria','аверсарианцев')|E], так и для вханавидов. В лучшие времена их богатства питали помпезную и законодательную моду, рождавшуюся в Восточной Аверсарианской провинции и экспортировавшуюся оттуда. Они также финансировали вечные ссоры провинции с Опахасией, три из которых сегодня признаны достаточно серьезными конфликтами, чтобы считаться полноценными войнами, несмотря на то, что [Glossary('Аавтократия','GH_AAUTOKRATA_GLOSS')] в остальном сохраняла стабильность в то время. В более недавние времена их бесконечные богатства стали решающим фактором, позволившим Аксиофее свести войну с Эшрасом к ничьей. Рудники сильно пострадали от [frodbrokna|E] — считается, что каждый из их управляющих погиб как во время катастрофы, так и в годы последующей анархии на востоке. Однако благодаря инвестициям, вдохнувшим новую жизнь в эти места, серебряные рудники Гольгелеи наконец вернулись на карту."

 building_02_griffon_roost: "Гнездовье грифонов"
 building_02_griffon_roost_desc: "Позволяет нанимать [GetMaA('griffon_riders').GetName] как [men_at_arms|E]\n\nДобавлены дополнительные помещения и места содержания, а также подготовлена смотрители, специально обученные искусству высиживания и выращивания грифонов."

 building_02_gujak_mines: "Рудник Гуджак"
 building_02_gujak_mines_desc: "По мере роста поселения добывается все больше и больше руды. Приток компетентных инженеров позволяет построить полноценный рудник."

