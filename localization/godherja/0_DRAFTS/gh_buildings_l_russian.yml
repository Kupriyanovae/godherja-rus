 building_02_knightly_chapterhouse: "Рыцарский аванпост"
 building_02_knightly_chapterhouse_desc: "Каждую неделю сюда прибывают юноши в надежде вступить в Орден, хотя большинство уходит, едва увидев условия жизни. На аванпосте тяжелая жизнь, но рыцари получают от нее удовольствие."

 building_02_korkivo_port: "Порт Коркиво"
 building_02_korkivo_port_desc: "$building_type_02_korkivo_port_desc$"

 building_02_lachish_mines: "Рудники Лахиша"
 building_02_lachish_mines_desc: "Высоко в западных предгорьях Лахиша лежит глубокое хранилище неизвестного происхождения, построенное из железных колонн, уходящих в глубины [aeras|E]. Хотя оно является священным для местных оргаррдских верующих, со временем из него были извлечены казалось бы неисчерпаемые запасы железа. Хранилище без конца, рудники Лахиша покрыты импровизированными тоннелями и плавильнями, предназначенными для извлечения железа и других сокровищ, найденных внутри."

 building_02_lascife_mines: "Шахтерское поселение Ласцифе"
 building_02_lascife_mines_desc: "По мере роста поселения добывается все больше и больше руды. Приток компетентных инженеров позволяет построить полноценный рудник."

