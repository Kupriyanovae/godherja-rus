 building_00_frost_stilto_katharoteras: "Замороженный Стильто Катаротерас"
 building_00_frost_stilto_katharoteras_desc: "В сердце замершего города, посреди площади, когда-то кипевшей жизнью, возвышается величественный мемориал. Возведенный в честь великих побед, он обращает взоры своих шлемоносных ликов на лютую студень, видя лишь мгновенно застывшие фигуры тех, кого застигла гибель метрополии."

 building_00_haseti_mekab: "Разрушенный Хасети Мекаб"
