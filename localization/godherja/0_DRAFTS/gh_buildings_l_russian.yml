 building_type_01_ruins_of_dadama_city: "$building_01_ruins_of_dadama_city$"
 building_01_ruins_of_dadama_city: "Руины Дадамы"
 building_01_ruins_of_dadama_city_desc: "Основанная сайелаянами во время [Concept('ancient_shrunfan_era','переселения чайлаонов')|E], Дадама когда-то была столицей королевства Шрунфан, религиозным, политическим и экономическим сердцем сайелаянского народа. Всему этому пришел конец, когда катхунцы захватили город во время [great_western_march|E], большая часть его населения была насильно переселена в северный Наньмай-Бон, а стены снесены, чтобы город никогда больше не смог восстать в недовольстве.\n\nДадама так и не оправилась. За прошедшие столетия ее затмил южный город-побратим Бэньбай, ставший вместо неё резиденцией власти Протектората Южных Земель."

 building_type_02_ruins_of_dadama_city: "$building_01_ruins_of_dadama_city$"
 building_02_ruins_of_dadama_city: "Восстановленная Дадама"
 building_02_ruins_of_dadama_city_desc: "Основанная сайелаянами во время [Concept('ancient_shrunfan_era','переселения чайлаонов')|E], Дадама когда-то была столицей королевства Шрунфан, религиозным, политическим и экономическим сердцем сайелаянского народа. Всему этому пришел конец, когда катхунцы захватили город во время [great_western_march|E], большая часть его населения была насильно переселена в северный Наньмай-Бон, а стены снесены, чтобы город никогда больше не смог восстать в недовольстве.\n\nДадама была отстроена во всем своем великолепии, вернув себе статус центра власти сайелаянов."

 building_type_01_asojiva_radiant_tower: "Лучезарная башня Асодживы"
 building_01_asojiva_radiant_tower: "Лучезарная башня Асодживы"
 building_01_asojiva_radiant_tower_desc: "Она стоит на северном берегу Балийактерского пролива. Это колоссальная статуя-маяк, созданная по образу $asojiva_link$ Асодживы#!. Благодаря искусному инженерному делу и встроенным магическим программам башня гарантирует, что свет, исходящий от лица Асодживы, виден под любым углом, направляя корабли через бурный Каширянский залив. Будучи одной из немногих уцелевших крупных построек эпохи [taryaad_saramsaasan|E], она стоит как чудо [Concept('kashirya','каширянской')|E] инженерии."

 building_type_01_maharatna_mahal: "Махаратна-махал"
 building_01_maharatna_mahal: "Руины Махаратна-махала"
 building_01_maharatna_mahal_desc: "[Glossary('Махаратна-махал','MAHARATNA_MAHAL_GLOSS')] когда-то был резиденцией [taryaad_saramsaasan|E]. Строительство этого блистательного дворца началось после того, как $asojiva_link$ Асоджива#! была коронована единоличной правительницей [kashirya|E], и потребовало шестнадцати лет работы до его дальнейшего расширения. На пике своего могущества дворец насчитывал более тысячи комнат, и тысячи слуг суетились в нем день и ночь. Внутренние и внешние стены были инкрустированы самоцветами с южных [GetBuilding('01_vilunnak_mines').GetName], каждый размером с человеческую голову, испещренными изящными узорами из драгоценных металлов и непрерывно поддерживаемыми [magi|E], направляющими магию для сохранения их блеска, а также их антимагических свойств. По словам побывавших во дворце Махаратна-махал путешественников, можно было почти воочию увидеть, как сама концепция богатства медленно струится по стенам дворца.\n\nПосле [Concept('vaarash','краха Тарьяад-Сарамсаасана')|E] Махаратна-махал пришел в запустение, а его слуги разбрелись. Когда сменяющие друг друга военачальники оккупировали [GetTitleByKey('c_asojivas_concourse').GetNameNoTooltip], они разграбили сокровища дворца, оставив некогда сверкающее сооружение в руинах."
 building_02_maharatna_mahal: "Мрачный Махаратна-махал"
 building_02_maharatna_mahal_desc: "[Glossary('Махаратна-махал','MAHARATNA_MAHAL_GLOSS')] когда-то был резиденцией [taryaad_saramsaasan|E]. Строительство этого блистательного дворца началось после того, как $asojiva_link$ Асоджива#! была коронована единоличной правительницей [kashirya|E], и потребовало шестнадцати лет работы до его дальнейшего расширения. На пике своего могущества дворец насчитывал более тысячи комнат, и тысячи слуг суетились в нем день и ночь. Внутренние и внешние стены были инкрустированы самоцветами с южных [GetBuilding('01_vilunnak_mines').GetName], каждый размером с человеческую голову, испещренными изящными узорами из драгоценных металлов и непрерывно поддерживаемыми бесчисленными [magi|E], направляющими магию для сохранения их блеска, а также их антимагических свойств. По словам побывавших во дворце Махаратна-махал путешественников, можно было почти воочию увидеть, как сама концепция богатства медленно струится по стенам дворца."
 building_03_maharatna_mahal: "Махаратна-махал"
 building_03_maharatna_mahal_desc: "[Glossary('Махаратна-махал','MAHARATNA_MAHAL_GLOSS')] когда-то был резиденцией [taryaad_saramsaasan|E]. Строительство этого блистательного дворца началось после того, как $asojiva_link$ Асоджива#! была коронована единоличной правительницей [kashirya|E], и потребовало шестнадцати лет работы до его дальнейшего расширения. На пике своего могущества дворец насчитывал более тысячи комнат, и тысячи слуг суетились в нем день и ночь. Внутренние и внешние стены были инкрустированы самоцветами с южных [GetBuilding('01_vilunnak_mines').GetName], каждый размером с человеческую голову, испещренными изящными узорами из драгоценных металлов и непрерывно поддерживаемыми бесчисленными [magi|E], направляющими магию для сохранения их блеска, а также их антимагических свойств. По словам побывавших во дворце Махаратна-махал путешественников, можно было почти воочию увидеть, как сама концепция богатства медленно струится по стенам дворца."
 building_04_maharatna_mahal: "Сияющий Махаратна-махал"
 building_04_maharatna_mahal_desc: "[Glossary('Махаратна-махал','MAHARATNA_MAHAL_GLOSS')] когда-то был резиденцией [taryaad_saramsaasan|E]. Строительство этого блистательного дворца началось после того, как $asojiva_link$ Асоджива#! была коронована единоличной правительницей [kashirya|E], и потребовало шестнадцати лет работы до его дальнейшего расширения. На пике своего могущества дворец насчитывал более тысячи комнат, и тысячи слуг суетились в нем день и ночь. Внутренние и внешние стены были инкрустированы самоцветами с южных [GetBuilding('01_vilunnak_mines').GetName], каждый размером с человеческую голову, испещренными изящными узорами из драгоценных металлов и непрерывно поддерживаемыми бесчисленными [magi|E], направляющими магию для сохранения их блеска, а также их антимагических свойств. По словам побывавших во дворце Махаратна-махал путешественников, можно было почти воочию увидеть, как сама концепция богатства медленно струится по стенам дворца."

 building_type_01_kashirya_gate: "Каширянские ворота"
 building_01_kashirya_gate: "Каширянские ворота"
 building_01_kashirya_gate_desc: "Каширянские ворота — это главный проход, соединяющий Колргийскую степь с регионом Каширя. Хотя это место называют воротами, оно представляет собой относительно низкий перевал среди возвышающихся гор. Местность здесь коварна, изобилует крутыми обрывами и зияющими провалами, оставляя лишь узкие тропинки вдоль скал. В сочетании с частыми черными ветрами, несосущими ослепляющие путников песок и пыль, пересечение этого маршрута крайне опасно, а масштабное передвижение войск практически невозможно. В истории есть лишь одно исключение: согласно ольтенской легенде, хатан провел свое войско по извилистым горным тропам без проводника всего за один день, совершив внезапное нападение на неподготовленные [Concept('kashirya','каширянские')|E] королевства. Ольтеники видят в этом знак благословения [Glossary('Кайгана','GH_KAIGAN_GLOSS')], в то время как ученые-видваукеятраны пытаются объяснить это некой формой неизвестной магии."

 building_type_01_tivyasamita: "Тивьясамита"
 building_01_tivyasamita: "Тивьясамита"
 building_01_tivyasamita_desc: "Тивьясамита — древний город, прославившийся задолго до появления [otachedian_empire|E]. Его стили искусства даже на какое-то время вошли в моду при ольтенском дворе. Хотя он был известен и в прошлом, его золотой век наступил с возвышением [Concept('vidvaookeyatran_scholarly_caste','ученых-видваукеятранов')|E]. Используя разнообразную магию, включая технологии света и тени, разработанные в [GetBuilding('01_haryaadad_academy').GetName], театры Тивьясамиты могли ставить иммерсивные представления, благодаря чему Тивьясамита мгновенно превратилась в художественный центр всей [kashirya|E], привлекая художников со всего региона для сбора и обмена идеями, в то время как правители считали искусство Тивьясамиты эталоном высшего общества.\n\nОднако из-за сильной зависимости от ученых-видваукеятранов Тивьясамита сильно пострадала во время [dharya_varha|E]. Художники, использовавшие магические приемы, подверглись жестоким преследованиям со стороны Дхарьям-Лона, а [magi|E], владевшие такими навыками, исчезли. Тивьясамита пережила трудную трансформацию, и город начал возрождаться лишь в процветающую эпоху [taryaad_saramsaasan|E]."

 building_type_01_khiyatuso_dungeon: "Подземелье Хиятусо"
 building_01_khiyatuso_dungeon: "Заброшенное подземелье Хиятусо"
 building_01_khiyatuso_dungeon_desc: "Подземелье Хиятусо — это секрет Полишинеля среди правителей [Concept('kashirya','Кашири')|E]. Это подземелье служит информационным центром для всего региона. Любую информацию, известную хотя бы двум людям в мире, можно добыть здесь, если у вас достаточно денег. Благодаря усилиям бесчисленных поколений пайдемов подземелье постоянно расширялось, в конце концов выдолбив целое горное склоновое образование в сложную подземную сеть. Говорят, оно насчитывает более сотни известных выходов для сокрытия передвижений посетителей и бесчисленное множество тайных.\n\nУчитывая огромный поток людей, здесь также сплотились различные граничащие с законом индустрии, такие как бордели и лавки по продаже осаиэра, что породило процветающий теневой (как в буквальном, так и в переносном смысле) рынок. Хотя близлежащие дворяне часто пытались подавить это логовище хаоса, нарушающее мир их владений, его хозяева неизменно используют свою разветвленную сеть связей для распределения выгод на все стороны, ловко отговаривая дворян от доведения дела до конца.\n\nНесмотря на все усилия хозяев, подземелье Хиятусо пришло в упадок под внешним давлением. Большая его часть ныне заброшена. Некогда вечно горевшие огни больше не освещают коридоры, а тишина смерти сменила прежний шепот."
 building_02_khiyatuso_dungeon: "Подземелье Хиятусо"
 building_02_khiyatuso_dungeon_desc: "Учитывая огромный поток людей, здесь также сплотились различные граничащие с законом индустрии, такие как бордели и лавки по продаже осаиэра, что породило процветающий теневой (как в буквальном, так и в переносном смысле) рынок. Хотя близлежащие дворяне часто пытались подавить это логовище хаоса, нарушающее мир их владений, его хозяева-пайдемы неизменно используют свою разветвленную сеть связей для распределения выгод на все стороны, ловко отговаривая дворян от доведения дела до конца."

 building_type_01_arambdeh_free_port: "Свободный порт Арамбдех"
 building_01_arambdeh_free_port: "Свободный порт Арамбдех"
 building_01_arambdeh_free_port_desc: "Свободный порт Арамбдех называется портом, но основная часть города находится под землей. По разным причинам города, построенные на поверхности Вольного порта, за столетия разрушались и отстраивались заново много раз, причем новые города возводились поверх старых, образуя многослойные структуры.\n\nПоскольку он находится далеко от любых центров власти и лежит на окраинах порядка, сюда бежали бесчисленные преступники. Многослойная сложность подземелья означает, что номинальные правители не могут проникнуть в него для управления. Таким образом, подземелье выработало собственную социальную структуру и собственный правящий класс. Порой даже наземным дворянам приходится подчиняться правителям подземелья в силу их огромного влияния."

 building_type_01_sanagiria_lake: "Озеро Санагирия"
 building_01_sanagiria_lake: "Озеро Санагирия"
 building_01_sanagiria_lake_desc: "Озеро [Glossary('Санагирия','SANAGIRIA_GLOSS')] лежит на краю [Glossary('Хараданских гор','north_kharadan_encyclopedia_desc')], образованное талой водой близлежащих ледников. Его воды чисты и имеют цвет индиго. Наиболее примечательны обитающие в озере зачарованные косяки рыб и исключительно редкие крупные жемчужины, находящиеся в его глубинах. Опираясь на богатства озера, города вокруг озера Гахарин стали доминирующими торговыми центрами всего региона. Согласно записям, первыми этим озером стали пользоваться хусаяханы, и их глубокое понимание водоема означало, что любому правителю приходилось полагаться на этих опытных рыбаков и ныряльщиков, чтобы извлечь дары озера."

 building_type_01_devenishaya_law_school: "Юридическая школа Девенишайи"
 building_01_devenishaya_law_school: "Юридическая школа Девенишайи"
 building_01_devenishaya_law_school_desc: "Юридическая школа Девенишайи, или иногда академия Отачеда — это самый известный и крупнейший университет в [kashirya|E]. Он был основан во время [otachedian_empire|E], и его первыми преподавателями, как говорят, лично отбирал Отачед. Академия обеспечивала постоянный приток свежих сил в имперскую административную систему. Из ее стен вышли бесчисленные государственные деятели; например, несколько имперских канцлеров IV века были ее выпускниками. Некоторые ученые даже предполагали, что [mayikrata|E] отчасти создавались по образцу школы Девенишайи.\n\nДаже после падения империи юридическая школа оставалась главным академическим центром всей Кашири. Широко распространено мнение, что установленная Отачедом система государственного управления продержалась столетиями во многом благодаря вкладу юридической школы Девенишайи — такова была ее мощь. Однако после великих потрясений, принесенных [chan_skorpokaipis|E], и растущего предпочтения монархов [taryaad_saramsaasan|E] к чиновникам, не обучавшимся в Девенишайи, академические достижения и политическое влияние юридической школы сегодня значительно уменьшились."

 building_type_00_conqueror_otached_colossus: "Исчезнувший колосс завоевателя Отачеда"
 building_00_conqueror_otached_colossus: "Исчезнувший колосс завоевателя Отачеда"
 building_00_conqueror_otached_colossus_desc: "На вершине Пика Отачеда возвышается колоссальная статуя легендарного завоевателя Отачеда верхом на коне, с мечом в руке. Эта статуя, полностью черная и выполненная из чистого железа, была создана путем переплавки и отливки всех доспехов и оружия, захваченных Отачедом после его завоевания [kashirya|E]. Легенда гласит, что Отачед использовал божественный меч [iorne_seld|E], чтобы сровнять с землей верхушку горы (отсюда и название «Пик Отачеда») исключительно ради того, чтобы она служила постаментом для этой статуи. После смерти Отачеда ольтеники возвели вокруг статуи ряд святилищ, чтобы приносить жертвы в его честь. Поскольку место его захоронения неизвестно, некоторые ученые предполагают, что его тело покоится под основанием статуи, однако высокая цена (во всех смыслах) раскопок помешала какой-либо проверке.\n\nВскоре после того, как туман поглотил Пик Отачеда, люди с изумлением заметили, что статуя на вершине бесследно исчезла. Издалека на горе остался лишь пустой постамент. Выдвигались различные гипотезы, но помехи [the_fog|E] делают правду невозможной для выяснения."

 building_type_01_conqueror_otached_colossus: "Колосс завоевателя Отачеда"
 building_01_conqueror_otached_colossus: "Колосс завоевателя Отачеда"
 building_01_conqueror_otached_colossus_desc: "На вершине Пика Отачеда возвышается колоссальная статуя легендарного завоевателя Отачеда верхом на коне, с мечом в руке. Эта статуя, полностью черная и выполненная из чистого железа, была создана путем переплавки и отливки всех доспехов и оружия, захваченных Отачедом после его завоевания [kashirya|E]. Легенда гласит, что Отачед использовал божественный меч [iorne_seld|E], чтобы сровнять с землей верхушку горы (отсюда и название «Пик Отачеда») исключительно ради того, чтобы она служила постаментом для этой статуи. После смерти Отачеда ольтеники возвели вокруг статуи ряд святилищ, чтобы приносить жертвы в его честь. Поскольку место его захоронения неизвестно, некоторые ученые предполагают, что его тело покоится под основанием статуи, однако высокая цена (во всех смыслах) раскопок помешала какой-либо проверке."

 building_type_01_everwinter_forest: "Лес Вечной Зимы"
 building_01_everwinter_forest: "Лес Вечной Зимы"
 building_01_everwinter_forest_desc: "Лес Вечной Зимы — это вечно холодный, темный регион, небо над которым навечно заперто в сумерках, исчерченных полярными сияниями, порождаемыми высокой концентрацией магии. Растения здесь сплошь фиолетовые, чрезвычайно твердые и, как считается, выживают за счет извлечения магии из окружающей среды. Холод внутри леса, кажется, совсем не рассеивается; он усиливается с глубиной и не может быть смягчен никакой магией или источником тепла, из-за чего никто не может углубиться внутрь.\n\nСогласно редким уцелевшим записям, это стало неудачным результатом магического эксперимента, проведенного группой [magi|E] из числа [Concept('vidvaookeyatran_scholarly_caste','видваукеятранов')|E]. Эти маги пытались воссоздать магию управления климатом, использовавшуюся [Concept('astilik_empire','астиликским народом')|E]. Хотя они добыли некоторые материалы у изгнанных астиликских беженцев, они добавили множество необоснованных шагов, из-за чего ритуал стал опасно перегружен магией. Это мгновенно привлекло большое количество [Glossary('живых метелей','animal_type_living_blizzard_encyclopedia_desc')], моментально обрушив температуру в месте проведения ритуала до ужасающих показателей. Мгновенная смерть магов еще больше дестабилизировала заклинание, навсегда изменив климат региона."

 building_type_01_burgediin_tsaiz: "Бүргэдийн Цайз"
 building_01_burgediin_tsaiz: "Бүргэдийн Цайз"
 building_01_burgediin_tsaiz_desc: "Бүргэдийн Цайз — это крепость, построенная на границе между [kashirya|E] и Дахангоном и завершенная в середине IV века. Она служила передовой линией против набегов кедаров и ключевым ольтенским оплотом в южной Кашири. Во время [Concept('otachedian_empire','отачедианской эпохи')|E] имперские армии бесчисленное число раз выступали отсюда для подавления мятежей. Будучи внушительным бастионом уже при своем основании, крепость на протяжении веков удерживалась ольтенскими военачальниками, которые вложили огромные ресурсы в ее расширение, превратив в обширный оборонительный комплекс, включающий в себя многочисленные цитадели, траншеи, тоннели и сторожевые башни. В бурные годы после падения Отачедианской империи Бүргэдийн Цайз стоял твердо, подобно рифу, не сокрушенному штормом — его не смог взять ни один враг. Глубокая красная почва под его стенами — самое красноречивое свидетельство этого кровавого наследия.\n\nВ конце VII века клан турлесут основал последнюю олтеникскую династию южной Кашири — Эргунесар, сосредоточив ее вокруг этой крепости. Опираясь на высокие стены Бүргэдийн Цайза, династия сдерживала мятежников и удерживала долгое правление, пока ее последний правитель, Алчитай, во время [murtuy_ka_varha|e] не покинул свои земли в страхе перед легионами нежити [Concept('liches','лича')|E] Сатаяна Холккарака, бежав в Бүргэдийн Цайз и оборвав все связи с внешним миром. Впоследствии большинство правителей этой крепости довольствовались управлением лишь небольшим клочком земли поблизости, отказавшись от экспансии. Тем не менее, с другой стороны, такой подход также уберег клан турлесут от хаоса, охватившего остальные части Кашири."
 building_02_burgediin_tsaiz: "Бүргэдийн Цайз"
 building_02_burgediin_tsaiz_desc: "Бүргэдийн Цайз — это крепость, построенная на границе между [kashirya|E] и Дахангоном и завершенная в середине IV века. Она служила передовой линией против набегов кедаров и ключевым ольтенским оплотом в южной Кашири. Во время [Concept('otachedian_empire','отачедианской эпохи')|E] имперские армии бесчисленное число раз выступали отсюда для подавления мятежей. Будучи внушительным бастионом уже при своем основании, крепость на протяжении веков удерживалась ольтенскими военачальниками, которые вложили огромные ресурсы в ее расширение, превратив в обширный оборонительный комплекс, включающий в себя многочисленные цитадели, траншеи, тоннели и сторожевые башни. В бурные годы после падения Отачедианской империи Бүргэдийн Цайз стоял твердо, подобно рифу, не сокрушенному штормом — его не смог взять ни один враг. Глубокая красная почва под его стенами — самое красноречивое свидетельство этого кровавого наследия.\n\nВ конце VII века клан турлесут основал последнюю олтеникскую династию южной Кашири — Эргунесар, сосредоточив ее вокруг этой крепости. Опираясь на высокие стены Бүргэдийн Цайза, династия сдерживала мятежников и удерживала долгое правление, пока ее последний правитель, Алчитай, во время [murtuy_ka_varha|e] не покинул свои земли в страхе перед легионами нежити [Concept('liches','лича')|E] Сатаяна Холккарака, бежав в Бүргэдийн Цайз и оборвав все связи с внешним миром. Впоследствии большинство правителей этой крепости довольствовались управлением лишь небольшим клочком земли поблизости, отказавшись от экспансии. Тем не менее, с другой стороны, такой подход также уберег клан турлесут от хаоса, охватившего остальные части Кашири."
 building_03_burgediin_tsaiz: "Бүргэдийн Цайз"
