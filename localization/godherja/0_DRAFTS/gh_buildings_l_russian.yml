 building_01_knightly_chapterhouse: "Рыцарский обитель"
 building_01_knightly_chapterhouse_desc: "Эта небольшая обитель предоставляет надежная приют и горячую пищу немногим благородным рыцарям земли, хотя места для большего количества здесь почти нет."

 building_01_kresoxgrave: "Могила Кресокса"
 building_01_kresoxgrave_desc: "$building_type_01_kresoxgrave_desc$"

 building_01_lachish_mines: "Шахтерское поселение Лахиш"
 building_01_lachish_mines_desc: "Высоко в западных предгорьях Лахиша лежит глубокое хранилище неизвестного происхождения, построенное из железных колонн, уходящих в самые недра [aeras|E]. Хотя это хранилище является священным для местных поклонников Оргаррда, со временем оно было лишено своих, казалось бы, нескончаемых запасов железа. Не имея конца, рудники Лахиша покрыты импровизированными тоннелями и плавильнями, предназначенными для извлечения железа и других сокровищ, найденных внутри."

 building_01_last_standers_street: "Народный арсенал"
 building_01_last_standers_street_desc: "$building_type_01_last_standers_street_desc$"

 building_01_libraryofzheggarah: "Великая библиотека Жеггары"
 building_01_libraryofzheggarah_desc: "$building_type_01_libraryofzheggarah_desc$"

 building_01_light_wall: "Стена Света"
 building_01_light_wall_desc: "Простираясь через устье [GetGeographicalRegion('aekershaan_biozone').GetName], Стена Света представляет собой вереницу из сотен факелов и свечей, поддерживаемых горящими всю ночь. Построенная после опустошения [Concept('the_decimation_of_sarradon','Халакдуна')|E], она, как утверждают дварша, способна не подпускать злую магию и вредоносную тьму."

 building_01_lionspalace: "Кеахслтна Джеаша"
 building_01_lionspalace_desc: "$building_type_01_lionspalace_desc$"

 building_00_listikraxos: "Разрушенный Листикракос"
 building_00_listikraxos_desc: "$building_type_00_listikraxos_desc$"

 building_01_listikraxos: "Листикракос"
 building_01_listikraxos_desc: "$building_type_01_listikraxos_desc$"

 building_02_listikraxos: "Укрепленный Листикракос"
 building_02_listikraxos_desc: "$building_type_02_listikraxos_desc$"

 building_01_losttempleofmesbadh: "Месбад Орин'то"
 building_01_losttempleofmesbadh_desc: "$building_type_01_losttempleofmesbadh_desc$"

 building_01_lygudista_mines: "Шахтерское поселение Лигудиста"
 building_01_lygudista_mines_desc: "Старые [Concept('wardenism','варденитские')|E] правители Лигудисты знали об изобилующих здесь богатствах, но истинное сокровище, предоставляемое этим горнодобывающим комплексом, не было раскрыто вплоть до ордена Розы Святой Сансии. Теперь рудник служит одним из крупнейших символов статуса, которым любят выхваляться его новые правители. Количество рабов, отправленных на работы в золотых жилах, беспрецедентно для всего [sarradon|E] — на каждые пять несчастных душ, трудящихся там, приходится надсмотрщик с плетью, а страдания этого места уступают разве что рудникам Малькоиса. Близлежащий орден Ключа Святого Калисто со своей стороны только рад расстаться с несколькими «кающимися» в обмен на долю ежегодного улова из тоннелей."

 building_magi_quarters_01: "Квартал [magi|E]"
 building_magi_quarters_01_desc: "Построенный вдали от обычного населения, квартал [magi|E] позволяет заклинателям практиковать свою [magic|E] в мире и покое. Эти кварталы служат своего рода маленькими деревнями сами по себе, предоставляя пропитание и кров тем, кого отвергли их соотечественники. Разумеется, кварталы также служат способом связать магов долгом перед местными правителями, одалживая их силу при необходимости."
 building_magi_quarters_01_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +5#!"

 building_type_magi_quarters_01: "Квартал [magi|E]"
 building_type_magi_quarters_01_desc: "Построенный вдали от обычного населения, квартал [magi|E] позволяет заклинателям практиковать свою [magic|E] в мире и покое. Эти кварталы служат своего рода маленькими деревнями сами по себе, предоставляя пропитание и кров тем, кого отвергли их соотечественники. Разумеется, кварталы также служат способом связать магов долгом перед местными правителями, одалживая их силу при необходимости."

 building_type_magi_tower_01: "Башня магов"
 building_type_magi_tower_01_desc: "Участок земли, сданный в аренду [magi|E] вашего двора, где они могут практиковать и совершенствовать свое ремесло."
 building_magi_tower_01: "Арканные основания"
 building_magi_tower_01_desc: "Сырая сила скапливается и течет за завесой обыденного мира, но для ее эффективного использования обычно требуется сооружение точной геометрии — чаще всего башня."
 building_magi_tower_01_effect_desc: "$building_activates_province_aspects_effect_desc$"
 building_magi_tower_02: "Карты лей-линий"
 building_magi_tower_02_desc: "Полки забиты картами, фиксирующими местный поток магии. Подобная документация жизненно важна для подчинения силы региона."
 building_magi_tower_02_effect_desc: "$building_activates_province_aspects_effect_desc$\n$building_province_aspect_specialization_1_effect_desc$"
 building_magi_tower_03: "Арканные мастерские"
 building_magi_tower_03_desc: "Мастерские, снабженные реагентами и уникальным оборудованием, необходимым для экспериментов с тайными искусствами, предоставляют куда лучшую среду для исследований, чем открытое поле."
 building_magi_tower_03_effect_desc: "$building_magi_tower_02_effect_desc$"
 building_magi_tower_04: "Ложа арканного обучения"
 building_magi_tower_04_desc: "Хотя многое можно узнать из книг, прямое обучение учеников позволяет [magi|E] более эффективно передавать свои уникальные техники и теоремы. А заставление студентов выполнять бытовую работу дает [magi|E] больше времени для собственных исследований."
 building_magi_tower_04_effect_desc: "$building_magi_tower_02_effect_desc$"
 building_magi_tower_05: "Эфирные резервуары"
 building_magi_tower_05_desc: "Предметы с сильным резонансом аспектов накапливают избыточную энергию, позволяя [magi|E] черпать ее для более могущественных заклинаний или продолжать свои эксперименты во время спадов местного эфира."
 building_magi_tower_05_effect_desc: "$building_magi_tower_02_effect_desc$"
 building_magi_tower_06: "Массивы прорицания"
 building_magi_tower_06_desc: "Точное размещение оборудования для гадания по всей территории позволяет значительно усилить прорицание на больших расстояниях, предоставляя местным [magi|E] ценные данные об арканных явлениях во всем регионе."
 building_magi_tower_06_effect_desc: "$building_magi_tower_02_effect_desc$"
 building_magi_tower_07: "Геомантический ландшафтный дизайн"
 building_magi_tower_07_desc: "Тщательные изменения окружающего ландшафта еще больше усиливают его естественный резонанс и направляют энергию к башням."
 building_magi_tower_07_effect_desc: "$building_activates_province_aspects_effect_desc$\n$building_province_aspect_specialization_2_effect_desc$"
 building_magi_tower_08: "Башня архимагов"
 building_magi_tower_08_desc: "Монументальная башня простирается в небо над землей и уходит глубоко вниз, пропуская силу через всю свою высоту. Немногие сооружения способны укротить столько энергии, сколько этот великий подвиг магии и инженерии."
 building_magi_tower_08_effect_desc: "$building_magi_tower_07_effect_desc$"

