 building_type_sirwali_coast_pearl_industry_01: "Жемчужный промысел"
 building_type_sirwali_coast_pearl_industry_01_desc: "Побережье этого региона богато жемчугом, который служит важным источником дохода."
 building_sirwali_coast_pearl_industry_01: "Ныряльщики за жемчугом"
 building_sirwali_coast_pearl_industry_01_desc: "Хотя добыча жемчуга практиковалась в этом регионе веками, теперь она ведется более организованно."
 building_sirwali_coast_pearl_industry_02: "Жемчужные торговцы"
 building_sirwali_coast_pearl_industry_02_desc: "С ростом жемчужного промысла в регионе купцы и местные власти проявили интерес к расширению инфраструктуры для его поддержки."
 building_sirwali_coast_pearl_industry_03: "Центр жемчужного промысла"
 building_sirwali_coast_pearl_industry_03_desc: "Этот регион считается одним из самых прибыльных в том, что касается добычи жемчуга. Добытый здесь жемчуг отправляется в самые отдаленные уголки [aeras|E]."

 building_01_shenewuh_warrior_temple: "Храм воинов Шенэву"
 building_01_shenewuh_warrior_temple_desc: "Храм воинов Шенэву — самый южный из храмов Шанмяо. Широко распространенная в Наньмай-Бон практика почитания предков отличает его от катхунских аналогов, которые традиционно служат местами поклонения пантеону Кай-Цзяо. В результате по всему храму стоят статуи легендарных воинов, прославляющие тех, чьи великие деяния заслужили им место среди почитаемых предков региона."
 building_01_shenewuh_warrior_temple_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +15#! "
 building_02_shenewuh_warrior_temple: "$building_01_shenewuh_warrior_temple$"
 building_02_shenewuh_warrior_temple_desc: "$building_01_shenewuh_warrior_temple_desc$"
 building_02_shenewuh_warrior_temple_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +25#! "
