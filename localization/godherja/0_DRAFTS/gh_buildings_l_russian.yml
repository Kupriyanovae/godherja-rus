 building_04_vilunnak_mines: "Добывающий комплекс Вилуннак Сатра"
 building_04_vilunnak_mines_desc: "Расположенный в затопленной речной долине, добывающий комплекс в Вилуннак Сатра производит наибольшее количество алмазов и менее ценных драгоценных камней в Каширии. Название означает «Поле звёзд» на местном диалекте; говорят, что минеральные богатства этого места связаны с древней битвой, произошедшей в этом регионе, во время которой могущественный [magi|E] призвал падающую звезду, чтобы поразить своих врагов. Маг выиграл битву, а поле, где стоял его враг, превратилось в обугленную равнину, усыпанную астральными самоцветами. Сегодня вилуннакские алмазы украшают короны многих каширийских монархов, а безделушки, инкрустированные этими ошеломительными камнями, стоят огромных денег по всему востоку."

 building_04_zakran_mines: "Добывающий комплекс Закран"
 building_04_zakran_mines_desc: "Шахтёрский комплекс у подножия горного хребта Закран действовал по меньшей мере со времён Первого междуцарствия в Кемсаре, когда дом Себхенаф активно использовал его для финансирования своих, казалось, бесконечных конфликтов с западными соперниками. Он сохранил своё значение и после воссоединения Кемсара, оставаясь основным источником серебра на протяжении всей остальной истории империи.\n\nОднако после Битвы у Разорванной цепи рудник был захвачен молодой империей Айяр и с тех пор подпитывал большую часть её экономики."

 building_05_ashmarite_hospital: "Ашмаритская медицинская школа"
 building_05_ashmarite_hospital_desc: "Переросшая свои прежние границы, Ашмаритская медицинская школа теперь может похвастаться обширным кампусом и формализованной программой обучения для учеников лекарей и повитух. Эксперименты становятся всё более допустимыми, но работа с трупами всё ещё редка и осуждается из-за культурных табу. Услуги для бедняков всё ещё оказываются, но их всё сильнее вытесняет более прибыльная работа больницы."

 building_05_sunarsarwena_gardens: "Сады Эль-Кулата"
 building_05_sunarsarwena_gardens_desc: "Разросшиеся вокруг небольшого ядра ныне забытого святилища полузабытой принцессы, пышные аллеи и галереи Садов Эль-Кулата привлекают посетителей со всего континента."

 building_06_ashmarite_hospital: "Медицинская школа $c_el_qulatha$"
 building_06_ashmarite_hospital_desc: "Поддерживаемая покровительством богатых и могущественных горожан, Медицинская школа $c_el_qulatha$ представляет собой укреплённый комплекс, вмещающий всевозможные библиотеки, медицинские учреждения, больницы и магические лаборатории, тестирующие передовые методы магических искусств исцеления. Ныне обветшалый зал целителей был переоборудован в склад и пансион для учеников, слишком бедных, чтобы позволить себе лучшую жилплощадь в домах вокруг школы."

 building_06_sunarsarwena_gardens: "Великие сады Эль-Кулата"
 building_06_sunarsarwena_gardens_desc: "Разросшиеся вокруг небольшого ядра ныне забытого святилища полузабытой принцессы, пышные аллеи и галереи Садов Эль-Кулата привлекают посетителей со всего континента. Теперь, оснащённые зверинцем и охотничьим заповедником, сады в полной мере раскрыли свой потенциал как площадка для отдыха богатых и могущественных людей города и его окрестностей."

 building_07_ashmarite_hospital: "Медицинский университет $c_el_qulatha$"
 building_07_ashmarite_hospital_desc: "Внушительный центр науки в самом сердце $c_el_qulatha$, Медицинский университет $c_el_qulatha$ признан во всём Эрасе как обитель самых талантливых врачевателей в мире. Хотя выпускники, не владеющие магией, крайне востребованы, стоимость выкупа контракта одного из знаменитых [Concept('magi','хирургов-магов')|E] из $c_el_qulatha$ способна разорить большинство мелких дворян.\n\nШкола уже давно утратила уважение среди простолюдинов, которые смотрят на работу персонала как на осквернение могил."

 building_07_sunarsarwena_gardens: "Утопающие в роскоши сады Эль-Кулата"
 building_07_sunarsarwena_gardens_desc: "[Concept('magi','Маги-инженеры')|E] превзошли самих себя в своей последней попытке сотворить рай, разделённый на две зоны искусственной рекой, чьи воды одновременно прохладны и сладки. Песни сотен видов певчих птиц, которых никогда не видели на Саррадоне, раздаются в утреннем воздухе, наполненном ароматами цветов, чьи выведенные магией лепестки сияют перламутровым блеском. Дичи здесь также в избытке, так как заповедник зарыблен и населён травоядными животными, отобранными со всего [aeras|E] за их приятный вид и азарт погони.\n\nНыне полностью забытое всеми, кроме горстки посетителей, забредавших с ухоженных троп, маленькое заросшее святилище ютится у северо-восточного угла стены. Что же касается молодой женщины, изображённой в архаичном великолепии на выцветшей и крошащейся потолочной мозаике, то ныне не осталось в живых никого, кто помнил бы, кем она была."

 building_08_ashmarite_hospital: "Медицинский университет $c_el_qulatha$"
 building_08_ashmarite_hospital_desc: "$building_08_ashmarite_hospital$ разросся до размеров целого города в городе: более двух десятков всё более массивных корпусов, окружённых стеной, охраняемой самыми профессиональными наёмниками. Мрачный вид стражи резко контрастирует с сотнями [Concept('magi','хирургов-магов')|E], снующих по дворам и вестибюлям комплекса в течение дня — от бледнолицых послушников до властных хирургов, настолько знаменитых, уважаемых и богатых, что они считаются дворянами сами по себе, несмотря на любое незнатное происхождение.\n\nПростолюдины $c_el_qulatha$ уже давно начали возмущаться множеством лекарей и их квази-дворцами, видя в них ещё один институт, облагающий налогом их скудные заработки и оказывающий недолжное политическое влияние."

 building_abandoned_headquarters_01: "Бандитская лачуга"
 building_abandoned_headquarters_01_desc: "Несмотря на ветхое состояние, местная банда, действующая в этом районе, теперь занимает штаб-квартиру бывших военных. К стыду всего царства, казармы и кухни, ранее служившие нашим офицерам, теперь служат обычным преступникам."

 building_abandoned_headquarters_02: "Камеры похитителей"
 building_abandoned_headquarters_02_desc: "Подземные камеры, изначально предназначавшиеся для содержания шпионов и высокопоставленных военнопленных, теперь забиты жертвами, выхваченными с улиц и из домов по всему городу ради выкупа."

 building_abandoned_headquarters_03: "Покои главаря банды"
 building_abandoned_headquarters_03_desc: "Когда-то бывшие личными покоями старшего генерала, теперь эти помещения занял местный бандитский вожак, наслаждаясь комфортом и роскошью, предоставленными прежним режимом величайшему герою войны, который наверняка переворачивается в гробу."

 building_abandoned_headquarters_04: "Зал планирования"
 building_abandoned_headquarters_04_desc: "Здесь резные деревянные фигурки аккуратно передвигают по картам городов и королевств, но офицеров армии нигде не видно. Вместо них умелые и могущественные преступники планируют свои следующие шаги, решая, как лучше захватить контроль над новыми территориями и, что более тревожно, как правильно защитить свои земли от нас."

 building_amphitheatre_01: "Театральная площадка"
 building_amphitheatre_01_desc: "Самая простая из сцен — это просто большой расчищенный участок травы. Всё скромно, но это только начало."

 building_amphitheatre_02: "Цирк"
 building_amphitheatre_02_desc: "Шатры бродячих трупп занимают когда-то пустующие участки земли, привлечённые отличными условиями и огромной аудиторией мегаполиса."

 building_amphitheatre_03: "Стадион"
 building_amphitheatre_03_desc: "В самом сердце мегаполиса можно найти специализированные площадки и сооружения для бесчисленных видов спорта и искусств."

 building_amphitheatre_04: "Ипподром"
 building_amphitheatre_04_desc: "Колосс общественного развлечения возвышается в центре этого города, вмещая тысячи жаждущих зрелищ граждан, готовых отдать месячный заработок, чтобы посмотреть на захватывающие шоу, проходящие в его стенах."




 building_assassins_guild_01: "Заброшенные жилища"
 building_assassins_guild_01_desc: "Бывшие дома местных жителей ныне заброшены. Эти пустые комнаты и забытые улицы не приносят нашему царству ни налогов в казну, ни ополчения для армии. Однако они предоставляют многочисленные укрытия для подонков нашего державы, желающих скрыться от ока закона."

 building_assassins_guild_02: "Приютище убийц"
 building_assassins_guild_02_desc: "Глубоко в этом районе находится усадьба, поросшая плющом, заброшенная своим благородным владельцем, но ныне ставшая явочной квартирой для беглых убийц местного преступного мира. Это не просто место для отдыха: здесь душегубы общаются со своими братьями по кровопролитию, делятся историями, приемами, извращенным товариществом и даже торгуют контрактами на людские жизни."

 building_assassins_guild_03: "Полоса препятствий"
 building_assassins_guild_03_desc: "Хотя для двора руины этого района не представляют ничего, кроме мозолящего глаза зрелища, местный криминалитет нашел в них отличную возможность. Бегая по заваленным обломками улицам, перепрыгивая через баррикады и карабкаясь по разрушающимся стенам, отребье, называющее этот район своим домом, не только становится физически крепче, но и лучше умеет уходить от стражников, которые могут встретиться на их пути."

 building_assassins_guild_04: "Отравильня"
 building_assassins_guild_04_desc: "Капля в кубке, брызги на еде, налёт на клинке — отравитель превращает убийство в искусство. Для многих правителей профессиональные убийцы, действующие в этом районе, страшнее любой вражеской армии: они могут сразить человека, даже не находясь рядом со своей жертвой, из-за чего чрезвычайно трудно как предотвратить подобные преступления, так и поймать стоящих за ними преступников."

 building_blood_market_00: "Кровавые сады"
 building_blood_market_00_desc: "Пресловутый Кровавый сад представляет собой массивный яблоневый сад, протянувшийся вдоль ручья, берущего начало в [the_lichdoms|E]. Сейчас он довольно хорошо ухожен, но местные жители утверждают, что деревья выросли здесь сами по себе, после чего их обнаружили и стали культивировать.\n\nОт кожицы яблок исходит головокружительное излучение, заметно переливающееся на близлежащие предметы плотным, ярким и резким красным цветом. Многие крестьяне утверждали, что это магическое свойство, придаваемое странным веществом в реке. Оно похоже на молоко, но имеет резкий металлический вкус. Оно гуще воды, плотнее и движется сквозь неё подобно потоку внутри потока; прямо из земли мёртвых.\n\nИ всё же, несмотря на необычный вкус плодов, их краснота, странность и небывалый размер взвинтили их ценность. То, что является яркой местной достопримечательностью в мрачном пейзаже, можно было бы превратить в прибыльную отрасль..."

 building_boulevard_01: "Расширенные улицы"
 building_boulevard_01_desc: "Центральные дороги района были расширены для обеспечения более быстрого передвижения."

 building_boulevard_02: "Замощенные улицы"
 building_boulevard_02_desc: "Бульвары района были должным образом за мощены — к всеобщей радости, дождь больше не превратит их в отвратительную жижу из грязи и отходов."

 building_boulevard_03: "Торговые фасады"
 building_boulevard_03_desc: "Многие торговцы обустроили лавки вдоль местных бульваров, получая хорошую прибыль от оживленного движения."

 building_boulevard_04: "Великолепные бульвары"
 building_boulevard_04_desc: "Вдоль бульваров владения были посажены деревья, а также введены постановления, ограничивающие количество нечистот, сливаемых на улицы. Передвижение по главным улицам стало куда более приятным и поистине впечатляющим."


 building_brewery_01: "Лачуга пивовара"
 building_brewery_01_desc: "Предприимчивый горожанин обустроил небольшую пивоварню в своем доме, обеспечивая некоторые потребности местного населения."

 building_brewery_02: "Винодельня"
 building_brewery_02_desc: "Винодел производит винтаж приемлемого качества, хотя большинство состоятельных граждан с тонким вкусом все еще воротят от него нос и предпочитают импортное вино."

 building_brewery_03: "Тавернный квартал"
 building_brewery_03_desc: "Пивоварни выросли по всему этому району, снабжая местные таверны день и ночь. Здесь дислоцирована примерно половина городской стражи, так как спонтанные драки, кажется, вспыхивают подобно грому среди ясного неба."

 building_brewery_04: "Винокурня"
 building_brewery_04_desc: "Здесь производят изысканный алкоголь и крепкие напитки на радость местным жителям, стремящимся напиться до беспамятства еще до того, как успеют допить вторую кружку."

 building_brewery_05: "Пивоваренный район"
 building_brewery_05_desc: "Концентрация пивоварен и таверн возросла настолько, что целая часть района предназначена исключительно для производства пива, вина и крепких напитков. Теперь город производит достаточно напитков, чтобы снабжать не только себя, но и весь окрестный регион."

 building_brewery_06: "Гильдия напитков"
 building_brewery_06_desc: "Местные пивовары, виноделы и винокуры объединились в организованную гильдию, чтобы распространять свою продукцию повсюду."

 building_brewery_07: "Алкогольные мануфактуры"
 building_brewery_07_desc: "Процесс производства невероятного количества напитков был еще больше оптимизирован с помощью как механических, так и магических средств. Конечно, этого должно быть достаточно, чтобы удовлетворить все наши потребности?"

 building_brewery_08: "Мировая чаша"
 building_brewery_08_desc: "Количество как пойла, так и изысканного выдержанного алкоголя, выливающегося из этого города, могло бы питать целую реку. Изготовленные здесь напитки можно найти где угодно: от кружки простого пьяницы за несколько королевств отсюда до пиршественного стола верховного лорда за морем."

 building_cemetery_01: "Скопление надгробий"
 building_cemetery_01_desc: "Разбросанные курганы и надгробия усеивают эту ранее заброшенную территорию: местные жители, судя по всему, решили, что земля здесь достаточно свята (или мягка), чтобы мертвецы могли легко перейти в иной мир."

 building_cemetery_02: "Огороженное кладбище"
 building_cemetery_02_desc: "Забор, окружающий кладбище, надеемся, будет достаточным, чтобы отпугнуть случайных расхитителей гробниц и проходящий скот."

 building_cemetery_03: "Кладбищенское святилище"
 building_cemetery_03_desc: "Среди могил, заполняющих эту территорию, был воздвигнут небольшой объект духовного значения."

 building_cemetery_04: "Сад памяти"
 building_cemetery_04_desc: "На территории кладбища разбили сад, предназначенный для памяти и почитания усопших, а также предлагающий посетителям место для спокойного созерцания.\n\nЕжедневные потребности кладбища больше не могут удовлетворяться добровольцами из общины, и теперь за территорией ухаживает постоянный смотритель."

 building_cemetery_05: "Плотное кладбище"
 building_cemetery_05_desc: "Накопившиеся могилы, большие и малые, принадлежащие бесчисленным поколениям, превратили местную территорию в ценный ресурс. Некоторые из самых старых участков, вероятно, застраивались поверх несколько раз, а их первоначальные обитатели давным-давно забыты."

 building_cemetery_06: "Дворянские усыпальницы"
 building_cemetery_06_desc: "Кладбище стало настолько ухоженным и престижным, что некоторые из более зажиточных граждан решили, что оно лучше подходит в качестве их последнего пристанища, чем сад семейного поместья. По всей территории начали появляться гробницы заметно более высокого качества, полные богатств."

 building_cemetery_07: "Королевские усыпальницы"
 building_cemetery_07_desc: "Престижный и знаменитый, этот формирующийся некрополь теперь украшают великолепные мавзолеи нескольких королей и их сородичей. Количество захороненных внутри богатств потребовало постоянного штата стражников и смотрителей, чье число теперь, вероятно, не поддается счету." 

 building_cemetery_08: "Некрополь"
 building_cemetery_08_desc: "Целое королевство покоится под камнями ярусных мавзолеев и гробниц, занимающих каждый свободный уголок кладбища. Обычные захоронения давным-давно стали непомерно дорогими, закрыв доступ к нормальным могилам всем, кроме самых богатых, поэтому урны теперь стоят, кажется, во всех щелях и нишах. Между тем, совместные гробницы и погребальные комплексы целых королевских династий и тысяч представителей мелкого дворянства означают, что по всей территории распределена настоящая армия стражников и смотрителей." 

 building_citadel_01: "Малая крепость"
 building_citadel_01_desc: "Эта крепость, сопоставимая с большинством сельских замков, служит главным центром власти окружающего мегаполиса."

 building_citadel_02: "Крепость"
 building_citadel_02_desc: "Огромная по сравнению с самыми впечатляющими сельскими замками, эта крепость выглядит внушительно и является сосредоточением военной мощи окружающего мегаполиса."

 building_citadel_03: "Цитадель"
 building_citadel_03_desc: "Удерживаемая обученными солдатами и возвышающаяся как размерами, так и формой, эта цитадель служит оплотом этого мегаполиса и окружающей сельской местности."

 building_citadel_04: "Великая цитадель"
 building_citadel_04_desc: "Поддерживаемая обученными профессиональными силами, эта великая цитадель является шедевром инженерного дела и оборонительного дизайна. Она служит центром военной мощи этого мегаполиса и окрестных земель."

 building_citadel_ruins_01: "Заброшенная цитадель"
 building_citadel_ruins_01_desc: "Полуразрушенные бастионы этого оборонительного сооружения — свидетельство плачевного состояния региона в целом. Никто не охраняет эти старые стены, кроме призраков."

 building_crater_ruins_01: "Огромный кратер"
 building_crater_ruins_01_desc: "Какая-то катастрофа воистину грандиозного масштаба не оставила здесь ничего, кроме зияющей дыры."

 building_desert_academyofswords: "Иссохшая [Concept('mayikprolollans','Майикпрололлан')|E] сто Спатас"
 building_desert_academyofswords_desc: "$building_type_desert_01_academyofswords_desc$"

 building_dilapidated_boulevards_01: "Захудалые дороги"
 building_dilapidated_boulevards_01_desc: ""

 building_dilapidated_boulevards_02: "Заблокированные пути"
 building_dilapidated_boulevards_02_desc: ""

 building_dilapidated_boulevards_03: "Разбойничьи поборы"
 building_dilapidated_boulevards_03_desc: ""

 building_dilapidated_boulevards_04: "Безнадёжные тропы"
 building_dilapidated_boulevards_04_desc: ""

 building_empty_building: "Пустует"
 building_empty_building_desc: "Здешняя земля неблагоприятна для проживания большого количества людей и, скорее всего, останется таковой."

 building_fencing_School_01: "Дуэльная площадка"
 building_fencing_School_01_desc: "Меловые линии на земле, ободряющие крики сверстников и создание размеченного пространства для не смертельных дуэлей дадут нашим молодым дворянам шанс разрешать свои споры с наименьшим кровопролитием."

 building_fencing_School_02: "Фехтовальный клуб"
 building_fencing_School_02_desc: "Основание полноценного клуба фехтовального искусства позволяет его приверженцам собираться вместе, делиться знаниями, тренироваться друг с другом и формировать общие узы."

 building_fencing_School_03: "Фехтовальное общество"
 building_fencing_School_03_desc: "Переход от группы любителей к чему-то гораздо более грандиозному: провозглашение элитного Фехтовального общества открывает новые пути для интереса, инвестиций и набора людей для развития дуэльных искусств в нашем царстве."

 building_fencing_School_04: "Дуэльная академия"
 building_fencing_School_04_desc: "С основанием официальной академии, посвященной поединкам один на один для дворянских сословий, фехтование из простого хобби превращается в преданный образ жизни, выращивающий одних из лучших рыцарей в царстве."

 building_fishmarket_01: "Рыбацкие хижины"
 building_fishmarket_01_desc: "Небольшая община лачуг выстроилась вдоль побережья — дом для закаленных рыбаков, едва сводящих концы с концами."

 building_fishmarket_02: "Пристанищные прилавки"
 building_fishmarket_02_desc: "Многие рыбаки обустроили постоянные прилавки рядом с местным доком."

 building_fishmarket_03: "Площадь торговцев рыбой"
 building_fishmarket_03_desc: "Соленый запах моря и громкие торги за цены наполняют воздух этого района, пока его жители бесконечно спорят о том, чей дневной улов самый большой, впечатляющий, сочный и стоит больше всего монет."

 building_fishmarket_04: "Эмпорий морепродуктов"
 building_fishmarket_04_desc: "Большое крытое рыночное здание, заполненное и окруженное бесконечными прилавками с морепродуктами, обеспечивает большую часть окружающего района дарами океана для употребления в пищу. Рыба, крабы, омары, устрицы и даже некоторые более экзотические твари из глубин — все это можно найти здесь в изобилии."

 building_forge_01: "Кузнец"
 building_forge_01_desc: "Будь то солдат, всадник, строитель или фермер, кузнецы поддерживают бесперебойную работу почти всех отраслей промышленности в мире, превращая сырые металлы во всевозможные товары для всех слоев общества."

 building_forge_02: "Оружейник"
 building_forge_02_desc: "Специализированные мастера, производящие нагрудники, шлемы, щиты и доспехи, являются ключевым компонентом в превращении армии из крестьянского сброда в профессиональную боевую силу, способную не только побеждать в битвах, но и выживать в них."

 building_forge_03: "Кузнец-стрельник"
 building_forge_03_desc: "Пока многие смотрят на ревущие горны или бьющие молоты, многие ветераны знают, что работа мастеров по изготовлению луков и арбалетов — от охотничьих луков до арбалетов, пробивающих нагрудники, — так же важна для защиты царства, как любой меч или щит."

 building_forge_04: "Гильдия ремесленников"
 building_forge_04_desc: "Объединение мастеров-ремесленников в центральном гильдейском доме в этом районе обеспечивает мегаполис более единой, оптимизированной и регулируемой промышленностью, гарантирующей защиту как рабочих, так и производства."

 building_fountain_ruins_01: "Полуразрушенные фонтаны"
 building_fountain_ruins_01_desc: "Вода — лишь воспоминание для этих потрескавшихся, забитых обломками фонтанов."

 building_fountains_01: "Фонтаны"
 building_fountains_01_desc: "На площадях района были установлены небольшие фонтаны, предоставившие более изысканное место для стирки белья и сбора питьевой воды."

 building_fountains_02: "Украшения"
 building_fountains_02_desc: "Фонтаны владения были усовершенствованы простыми украшениями и художественными элементами, чтобы придать им более утонченный вид."

 building_fountains_03: "Статуи"
 building_fountains_03_desc: "В систему водоснабжения фонтанов были включены статуи, используемые для прославления покровителей — часто правителей города."

 building_fountains_04: "Продвинутый трубопровод"
 building_fountains_04_desc: "Водная инфраструктура города развилась до такой степени, что инженеры могут строить высоконапорные трубы, способные выталкивать воду в воздух с высокой скоростью, устраивая впечатляющее шоу для посетителей."

 building_garden_01: "Городской луг"
 building_garden_01_desc: "Небольшой городской луг, предназначенный для общего выпаса скота."

 building_garden_02: "Городские сады"
 building_garden_02_desc: "Зеленые зоны были расширены и теперь включают огород, позволяющий местному населению выращивать большую часть пищи, необходимую для собственного пропитания."

 building_garden_03: "Цветочные сады"
 building_garden_03_desc: "По мере развития города функции городского луга всё больше децентрализовались, что позволило садовникам ухаживать за красивыми цветниками, где могут отдыхать привилегированные классы."

 building_garden_04: "Лабиринт из живой изгороди"
 building_garden_04_desc: "В центральных садах города есть тщательно ухоженный лабиринт из живой изгороди, который впечатляет посетителей и который знать может использовать для частных бесед."

 building_garden_ruins_01: "Запущенный сад"
 building_garden_ruins_01_desc: "Когда-то бывший уютным, зеленеющим убежищем природы, этот сад больше не имеет доступа к животворящей воде, которая когда-то заставляла его цвести, и теперь превратился в высохшую оболочку."

 building_type_gh_university_01: "Университет"
 building_type_gh_university_01_desc: "Жаждущие знаний студенты, умудренные опытом старцы, редкие жаркие споры, перерастающие в драки — университеты являются центрами обучения, исследований и гордостью многих государств."
 
 building_gh_university_01: "Круг наставников"
 building_gh_university_01_desc: "Несколько ученых мужей объединяются в этом здании, чтобы обучать избранных протеже и передавать им свои знания."

 building_gh_university_02: "Кафедра философии"
 building_gh_university_02_desc: "По мере роста числа студентов была создана кафедра философии, ведь как можно учиться, не зная, как мыслить."

 building_gh_university_03: "Кафедра истории"
 building_gh_university_03_desc: "Приют для археологов, историков, ученых, древних артефактов и пыльных фолиантов: создание кафедры истории гарантирует, что прежде чем студенты вообще подумают о взгляде в будущее, они будут иметь хотя бы сносное представление о прошлом."
 
 building_gh_university_04: "Кафедра естественных наук"
 building_gh_university_04_desc: "В лабораториях, войти в которые могут побояться даже самые храбрые рыцари царства, одни из лучших химиков, биологов и физиков в мире принимаются за работу по объяснению великих тайн мироздания, лишь изредка теряя по пути очередного студента."

 building_gh_university_05: "Академическая библиотека"
 building_gh_university_05_desc: "Огромная, сложная библиотека, прикрепленная к университету, предназначена исключительно для сбора и сохранения текстов со всего известного мира на темы, как известные всем, так и доступные лишь избранным."

 building_gh_university_06: "Кафедра теологии"
 building_gh_university_06_desc: "Университет наработал достаточную репутацию, чтобы позволить себе обсуждение теологии в своих стенах. Кафедра теологии предлагает студентам взгляд на множество культов и верований, найденных по всему миру, и углубленное изучение их религиозных воззрений."

 building_gh_university_07: "Кафедра драматургии"
 building_gh_university_07_desc: "По мере роста университета ему необходимы способы представления своих философских и исторических знаний. Кафедра драматургии позволит использовать пьесы для передачи как истории, так и философии через увлекательные сюжетов."

 building_gh_university_08: "Музыкальная кафедра"
 building_gh_university_08_desc: "Успех кафедры драматургии привел к тому, что музыкальное сопровождение к спектаклям становилось все более сложным. Это, в свою очередь, потребовало формирования музыкальной кафедры, сосредоточенной на теории музыки."

 building_granary_01: "Крестьянские лавки"
 building_granary_01_desc: "Несколько фермеров из окружающих земель обустроили здесь торговые места, продавая излишки продуктов своего труда. Хотя подобные лавки обычно можно найти в изобилии в каждом крупном городе, эта территория, похоже, обладает необычным потенциалом, так как продавцы сообщают о высокой прибыли."

 building_granary_02: "Пекарни"
 building_granary_02_desc: "Хотя в каждом городе и даже деревне есть пара пекарен, повсеместная доступность муки и других основных культур позволила развить разнообразный и узкоспециализированный кондитерский сектор, наполняя утренний воздух по всему району приятным запахом свежего хлеба и другой выпечки."

 building_granary_03: "Мясные лавки"
 building_granary_03_desc: "Широкая доступность мяса позволила открыть мясные лавки и сформировать разнообразный сектор переработки мяса по всему городу, давая даже простолюдинам доступ к недорогой птице, свинине и говядине."

 building_granary_04: "Житницы"
 building_granary_04_desc: "Зерно стекается в этот город в столь невероятных объемах, что для его хранения требуется несколько массивных амбаров и силосных башен. Продукты на основе муки стали настолько дешевыми и доступными, что была введена бесплатная раздача хлеба, обеспечивающая базовыми продуктами питания всех бедняков города."

 building_granary_05: "Скотный рынок"
 building_granary_05_desc: "Огромное количество скота на плодородных сельскохозяйственных угодьях вокруг города позволяет продавать его по воистину низким ценам. Хотя запах может быть зловонным, тот факт, что голову скота можно купить по цене кружки эля, говорит о многом в плане общего сельскохозяйственного процветания региона. Иностранные купцы, как известно, посещают город исключительно ради экспорта продаваемых здесь за бесценок фермерских животных."

 building_granary_06: "Сыроваренная отрасль"
 building_granary_06_desc: "Кажется, у каждого, кто имеет доступ к молочной продукции, есть свой собственный вкусный сорт сыра для продажи. Великолепный буйство цветов, текстур и вкусов заставит течь слюнки у каждого."

 building_granary_07: "Рынок деликатесов"
 building_granary_07_desc: "Это место больше не считается просто источником дешевой еды — местная кухня начала специализироваться и утончаться для более изысканных гурманов. Здесь развилось несколько необычных видов пищи, включая странные желатиновые кондитерские изделия, круглое плоское тесто с различными видами мяса и приправами, а также охлажденные сливки."

 building_granary_08: "Рог изобилия"
 building_granary_08_desc: "Кухня города, его казалось бы бесконечные местные разновидности хлеба, выпечки, мяса, молочных продуктов и других, более экзотических видов пищи славятся по всему миру. Обычные продукты питания стали настолько дешевыми, что продавать их непосредственно сами по себе стало невыгодно. Напротив, кажется, что каждый прилавок на этом огромном, охватывающем целый район рынке имеет свою местную изюминку в старых блюдах и абсолютно уникальные собственные рецепты.\n\nХотя бедность здесь является проблемой, как и в любом другом месте, по крайней мере, даже самый несчастный простолюдин, скорее всего, может позволить себе обед, достойный пира дворянина в каком-нибудь менее процветающем крае."
 
 building_gymnasium_01: "Беговая дорожка"
 building_gymnasium_01_desc: "Возможность выйти на пробежку, не пробираясь сквозь кишащие массы людей — одна из многих роскошей, доступных знати этого города."

 building_gymnasium_02: "Залы для атлетики"
 building_gymnasium_02_desc: "Размер и масса придают солидности любому человеку, и правитель города позаботился о том, чтобы у жителей были инструменты для обретения такой массы."

 building_gymnasium_03: "Бассейн"
 building_gymnasium_03_desc: "Физические упражнения рабочего могут быть эффективными, но они также тяжелы для плоти и костей. Эти сооружения позволяют пользователям обойти этот хлопотный побочный эффект поддержания активности."

 building_gymnasium_04: "Борцовская арена"
 building_gymnasium_04_desc: "Чтобы стать хозяином государства, нужно сначала стать хозяином арены."

 building_house_ruins_01: "Разрушенный квартал"
 building_house_ruins_01_desc: "Здесь мало что осталось, кроме поврежденных фундаментов домов, разрушенных каким-то бедствием."

 building_ice_academyofswords: "Замёрзшая [Concept('mayikprolollans','Майикпрололлан')|E] сто Спатас"
 building_ice_academyofswords_desc: "$building_type_ice_01_academyofswords_desc$"

 building_inquisition_headquarters_01: "Казармы инквизиторов"
 building_inquisition_headquarters_01_desc: "#P Инквизиторы, работающие и живущие здесь, будут искоренять ересь, увеличивая скорость обращений.#!\n\nУсловия для размещения агентов и персонала Инквизиции, а также обеспечение их базовых потребностей значительно облегчают их работу в городе."

 building_inquisition_headquarters_02: "Еретические камеры"
 building_inquisition_headquarters_02_desc: "#P Инквизиторы, работающие и живущие здесь, будут искоренять ересь, увеличивая скорость обращений.#!\n\nТюремный комплекс, построенный рядом с казармами, гарантирует, что еретики будут страдать от рук Инквизиции, а не городской стражи."

 building_inquisition_headquarters_03: "Пыточные камеры"
 building_inquisition_headquarters_03_desc: "#P Инквизиторы, работающие и живущие здесь, будут искоренять ересь, увеличивая скорость обращений.#!\n\nСпрятанные под тюремным комплексом кровавые сырые камеры наполнены инструментами, необходимыми для излюбленных методов убеждения Инквизиции."

 building_inquisition_headquarters_04: "Запретное хранилище"
 building_inquisition_headquarters_04_desc: "#P Инквизиторы, работающие и живущие здесь, будут искоренять ересь, увеличивая скорость обращений.#!\n\nСамые оскверненные и темные тайны как еретических культов царств, так и самой Инквизиции хранятся в этом хранилище, где их секреты могут быть раскрыты, чтобы сеять хаос по воле своих хозяев."

 building_jail_01: "Тёмные камеры"
 building_jail_01_desc: "Для тех, кто нарушает правила цивилизованного общества, ждет тюремная камера, извлекающая их из него. Пронизывающий холод, комковатая еда, сводящая с ума изоляция и бесконечные крысы — это все, что эти люди могут назвать своим домом."

 building_jail_02: "Виселичные клетки"
 building_jail_02_desc: "Если и есть что-то, в чем дворяне, офицеры и простые люди согласны, так это то, что мало что передает послание так ясно, как публичные мучения. Оставление некоторых из худших преступников гнить на виду у всех заставит многих дважды подумать, прежде чем нарушать закон."

 building_jail_03: "Петля и виселица"
 building_jail_03_desc: "Для наихудших преступников их преступления оставляют после себя боль, которую не уменьшит никакое тюремное заключение или наказание. В таких случаях виселица ждет их перед ликующей толпой масс."

 building_jail_04: "Пыточная камера"
 building_jail_04_desc: "Не каждый заключенный — лишь никому не известный бродяга, воспользовавшийся случаем. Будь то их сообщники, их боссы, преступные планы или укрытия — многие узники хранят в своих головах ценную информацию. Если они не отдадут её добровольно, то пожалеют, что не сделали этого сразу."

 building_type_karavuux_01: "Рынок каравукс"
 building_type_karavuux_01_desc: "Доффоры издавна организовывались в каравуксы — разновидность могущественных караванных компаний, которые обычно возводят грандиозные центры торговли."

 building_karavuux_01: "Малый рынок каравукс"
 building_karavuux_01_desc: "Доффоры издавна организовывались в каравуксы — разновидность могущественных караванных компаний, которые обычно возводят грандиозные центры торговли. Хотя этот рынок все еще относительно мал, он может похвастаться аккуратной планировкой, тщательно разделенной на секторы, специализирующиеся на определенных товарах, разнообразие которых впечатляет."

 building_karavuux_02: "Растущий рынок каравукс"
 building_karavuux_02_desc: "Доффоры издавна организовывались в каравуксы — разновидность могущественных караванных компаний, которые обычно возводят грандиозные центры торговли. Начав расширяться, аккуратная планировка этого рынка стала разрушаться: на тщательно разделенные секторы начали посягать новые конкуренты и заведения."

 building_karavuux_03: "Крупный рынок каравукс"
 building_karavuux_03_desc: "Доффоры издавна организовывались в каравуксы — разновидность могущественных караванных компаний, которые обычно возводят грандиозные центры торговли. Став ключевым звеном в местной торговле, этот рынок быстро превращается в хаотичную путаницу улиц, петляющих между прилавками, где можно найти практически любой товар под солнцем."

 building_karavuux_04: "Оживленный рынок каравукс"
 building_karavuux_04_desc: "Доффоры издавна организовывались в каравуксы — разновидность могущественных караванных компаний, которые обычно возводят грандиозные центры торговли. Этот рынок является важной остановкой на различных маршрутах и в любой час дня переполнен людьми, ведущими дела в любую погоду."

 building_karavuux_05: "Обширный рынок каравукс"
 building_karavuux_05_desc: "Доффоры издавна организовывались в каравуксы — разновидность могущественных караванных компаний, которые обычно возводят грандиозные центры торговли. Разросшись далеко за свои первоначальные пределы, снаружи этот рынок кажется сплошным скоплением ткани, камня и дерева, где ежедневно обмениваются огромные количества ценностей."

 building_karavuux_06: "Раскинувшийся рынок каравукс"
 building_karavuux_06_desc: "Доффоры издавна организовывались в каравуксы — разновидность могущественных караванных компаний, которые обычно возводят грандиозные центры торговли. Этот рынок стал величественным памятником коммерции, через который ежедневно протекают воображению не поддающиеся богатства." 

 building_library_01: "Хранилище свитков"
 building_library_01_desc: "В стенах этого здания формируется расцветающий архив, содержащий записи и учетные книги администрации державы, а также некоторые избранные труды."

 building_library_02: "Архив"
 building_library_02_desc: "Расширившись и включив в себя труды самых прославленных философов и ученых города, он теперь хранит знание, представляющее собой совокупность трудов множества местных знатоков."

 building_library_03: "Атенеум"
 building_library_03_desc: "Был построен просторный читальный зал, чтобы лучше способствовать распространению знаний, хранящихся в этом заведении."

 building_library_04: "Иллюминаторий"
 building_library_04_desc: "В центре библиотеки было возведено центральное купольное здание, использующее зеркала для освещения большой читальной зоны. Это значительно увеличило время суток, в течение которого библиотека доступна для использования, и устранило риск пожара от свечей."

 building_library_05: "Библиотечный комплекс"
 building_library_05_desc: "Накопление свитков и книг в этом здании потребовало десятков расширений площади библиотеки, и теперь она образует лабиринтоподобный комплекс в самом сердце мегаполиса."

 building_library_06: "Дом Мудрости"
 building_library_06_desc: "Кишащая мудрецами со всего мира, изучающими многочисленные труды библиотеки и добавляющими свои собственные на ее огромные полки, библиотека стала настоящей кузницей инноваций."

 building_library_07: "Великая библиотека"
 building_library_07_desc: "Огромные и бесчисленные крылья библиотеки содержат полки, простирающиеся так далеко, насколько хватает глаз, и уходящие ввысь высотою с дворянские усадьбы." 

 building_library_08: "Библиотека Панаэра"
 building_library_08_desc: "Тысяча наречий, сотня письменностей, труды не поддающиеся счету — то, что можно описать только как величайшее сокровищницу интеллектуальных и культурных достижений человечества, находится именно здесь." 

 building_lichdom_academyofswords: "Некрополь [mayikprolollans|E] сто Спатас"
 building_lichdom_academyofswords_desc: "$building_type_lichland_01_academyofswords_desc$"

 building_lighthouse_01: "Крытый маяк-сигнал"
 building_lighthouse_01_desc: "Простой крытый сигнальный огонь на близлежащем холме — примитивный маяк, обустроенный из-за отсутствия иной инфраструктуры."

 building_lighthouse_02: "Отдельно стоящий маяк"
 building_lighthouse_02_desc: "Ближе к входу в гавань была возведена большая башня, позволяющая сигнальному огню светить дальше в море."

 building_lighthouse_03: "Жилье смотрителя"
 building_lighthouse_03_desc: "Рядом с маяком был построен небольшой дом для проживания смотрителей маяка, что позволяет им находиться возле маяка постоянно."

 building_lighthouse_04: "Магический маяк"
 building_lighthouse_04_desc: "Большой огонь в башне маяка был заменен магическим источником света, который поддерживает свечение бессрочно и значительно снижает риск уничтожения маяка пожаром."

 building_lighthouse_08: "Сияющий шпиль"
 building_lighthouse_08_desc: "Эта чудесная башня, являющаяся одним из самых высоких рукотворных зданий во всем известном мире, кажется, сияет мощью самого Солнца. На протяжении всей ночи моряки видят маяк за неизреченные лиги как яркую звезду низко над горизонтом, а его сияние в итоге заслоняется лишь кривизной Эреаса."

 building_magic_silver_mine_01: "Серебряный рудник"
 building_magic_silver_mine_01_desc: "$building_type_magic_silver_mine_01_desc$"

 building_marcher_enclave_01: "Анклав марочников"
 building_marcher_enclave_01_desc: "Открывает постройки культуры #E Шевальян#!\n\nГруппы наемников-шевальян обосновались в этом районе, сформировав общину закаленных воинов и их потомков."

 building_marcher_wayshrine_01: "Рассыпанные придорожные святилища"
 building_marcher_wayshrine_01_desc: "Жители этого города из числа шевальян основали несколько придорожных святилищ с благословения местного правителя."

 building_maritime_district_01: "Прибрежный пирс"
 building_maritime_district_01_desc: "Небольшойдок, подходящий для погрузки и разгрузки легких торговых судов."

 building_maritime_district_02: "Причал"
 building_maritime_district_02_desc: "Служа одновременно местом швартовки и волнорезом, причал позволяет более крупным торговым судам перевозить пассажиров и грузы."

 building_maritime_district_03: "Гавань"
 building_maritime_district_03_desc: "Сооружение, состоящее из нескольких причалов, молов и волнорезов, позволяющее многочисленным крупным купеческим судам беспрепятственно входить и выходить."

 building_maritime_district_04: "Великий морской порт"
 building_maritime_district_04_desc: "Владение теперь является всемирным центром морской торговли. Соленый запах морской воды переплетается с ароматами специй, духов и трав, пока флоты заходят в порт, привозя экзотические товары со всего мира."

 building_maritime_ruins_01: "Затонувшая гавань"
 building_maritime_ruins_01_desc: "Потрескавшиеся и покрытые водорослями обломки гавани выстроились вдоль побережья, почти полностью захваченные морем из-за капризов времени или какого-то великого, сотрясшего землю катаклизма."

 building_mass_grave_site_01: "Чумная яма"
 building_mass_grave_site_01_desc: "Кровавая цена бедствия: большая яма, поспешно вырытая в земле, выставляет напоказ сотни тел под открытым небом. Непрезентабельное и нечестивое зрелище усугубляется тем, что те немногие души, что все еще зовут этот район своим домом, продолжают сбрасывать сюда своих мертвецов."

 building_mass_grave_site_02: "Гниющая могила"
 building_mass_grave_site_02_desc: "Из-за отсутствия каких-либо попыток убрать или засыпать это массовое захоронение, воздействие времени и стихий превратило это место экстренного погребения в уродливую массу гнили. Будучи источником зловония, господствующего теперь в районе, бесконечные крысы снуют по улицам и руинам, пока мерзкие заразы распространяются среди оставшегося населения."

 building_mass_grave_site_03: "Сборщик трупов"
 building_mass_grave_site_03_desc: "Привлекая одни из самых отвратительных элементов преступности любого царства, местная банда расхитителей гробниц теперь орудует на территории массового захоронения и вокруг него. Обмотав рты и носы грязными тряпками, они оскверняют мертвых: от кражи ценностей до сбора зубов, глаз, конечностей и органов для черных рынков."

 building_mass_grave_site_04: "Некромантическое убежище"
 building_mass_grave_site_04_desc: "Гнилая плоть, наполненные опарышами органы, черепа с пустые глазницами — по мере того, как ситуация с массой мертвецов ухудшается, в этом районе проявился неожиданный побочный эффект. Став мощным источником энергий Мертвой Магии, группа некромантов основала вокруг этого места свой ковен. Ничем не ограниченные, они свободно практикуются и экспериментируют в своем ремесле, пока восставшие мертвецы выбираются из ямы и бредут по улицам."

 building_massive_crater_01: "Выжженная площадь"
 building_massive_crater_01_desc: ""

 building_massive_crater_02: "Обнаженная канализация"
 building_massive_crater_02_desc: ""

 building_massive_crater_03: "Затопленные каналы"
 building_massive_crater_03_desc: ""

 building_massive_crater_04: "Контрабандный пролом"
 building_massive_crater_04_desc: ""

 building_mercenary_hall_01: "Контрактный стол"
 building_mercenary_hall_01_desc: "Обещание награды — вот что движет наемником; именно за контрактным столом даются эти обещания и выигрываются войны."

 building_mercenary_hall_02: "Зал трофеев"
 building_mercenary_hall_02_desc: "Добыча, сокровища, военные трофеи — все это выставлено напоказ на этой грандиозной экспозиции полевого грабежа. Ее блеск привлекает наемников сотнями."

 building_mercenary_hall_03: "Частная оружейная"
 building_mercenary_hall_03_desc: "Прославленные отряды наемников арендуют эти залы, чтобы хранить свое снаряжение в этих укрепленных стенах."

 building_mercenary_hall_04: "Иностранный вербовщик"
 building_mercenary_hall_04_desc: "Зов богатства эхом отдается по всему миру, и опытные переводчики выступают посредниками в этом здании, чтобы воспользоваться этим."

 ##building_mint_01: "Примитивный монетный двор"
 ##building_mint_01_desc: "Простая металлообрабатывающая мастерская, способная производить простые, невзрачные монеты для нашей экономики."
##
 ##building_mint_02: "Железные штампы"
 ##building_mint_02_desc: "Благодаря усовершенствованию более современным чеканным оборудованием, принятие железных штампов позволяет производить более детализированные монеты с большей скоростью."
##
 ##building_mint_03: "Стальные штампы"
 ##building_mint_03_desc: "С внедрением гораздо более прочных стальных штампов эксплуатационные расходы монетного двора значительно снижаются, а производство увеличивается."
##
 ##building_mint_04: "Мастера-граверы"
 ##building_mint_04_desc: "Укомплектованный одними из лучших мастеров с самыми передовыми инструментами, этот монетный двор способен производить монеты чрезвычайного качества, что кардинально снижает угрозу фальшивомонетничества."

 unlock_treasury_decisions_effect: "Открывает решения, связанные с казной"

 building_monument_01: "Малый монумент"
 building_monument_01_desc: "Небольшой памятник был воздвигнут во славу владельцев города."

 building_monument_02: "Колонна"
 building_monument_02_desc: "Владельцы города создали обелиск или иной возвышающийся монумент, посвященный достижениям правителей владения."

 building_monument_03: "Впечатляющий монумент"
 building_monument_03_desc: "Был построен впечатляющий памятник, изображающий важного героя, правителей города или знаменующий великую победу, что служит отличным пропагандистским успехом для владельцев владения."

 building_monument_04: "Великий мавзолей"
 building_monument_04_desc: "Целое здание, посвященное прославлению знатных людей общины, приносит великую прославленность семье, которая его покровительствует."

 building_monument_ruins_01: "Разграбленный мавзолей"
 building_monument_ruins_01_desc: "Мертвые, должно быть, весьма недовольны, ибо их место захоронения было разграблено настолько тщательно, что некогда пышные гробницы теперь кажутся более подходящими для прокаженного нищего."

 building_necropolis_01: "Некрополь"
 building_necropolis_01_desc: "Гробница-крепость могущественного [Concept('liches','Лича')|E]."

 building_nexus_ruins_01: "Разрушенный нексус"
 building_nexus_ruins_01_desc: "Это место когда-то было мощным магическим фокусом и местом, из которого на протяжении всей истории сотворялись бесчисленные заклинания невероятной силы. Оно давным-давно перестало обладать прежней мощью, хотя все еще гудит арканной энергией."

 building_overgrown_gardens_01: "Запущенный сад"
 building_overgrown_gardens_01_desc: ""

 building_overgrown_gardens_02: "Заросший огражденный сад"
 building_overgrown_gardens_02_desc: ""

 building_overgrown_gardens_03: "Оскверненная растительность"
 building_overgrown_gardens_03_desc: ""

 building_overgrown_gardens_04: "Запретная роща"
 building_overgrown_gardens_04_desc: ""

 building_palace_01: "Вилла"
 building_palace_01_desc: "Скромная обитель по дворянским меркам, она служит центром небольшой бюрократии и домом для правящей элиты."

 building_palace_02: "Губернаторский особняк"
 building_palace_02_desc: "С значительно расширенной планировкой и выполненный из куда более изысканных материалов, этот городской нервный центр отражает как растущее богатство своих обитателей, так и их бюрократические потребности."

 building_palace_03: "Королевский дворец"
 building_palace_03_desc: "С пышностью, отражающей огромные богатства этого мегаполиса, это возвышающееся архитектурное произведение искусства наблюдает за своими гражданами как в буквальном, так и в переносном смысле."

 building_palace_04: "Дворцовый комплекс"
 building_palace_04_desc: "Город в городе, населенный сотнями администраторов и различным дворянством. Огромный государственный аппарат, содержащийся внутри, является чудом государственного управления."

 building_palace_ruins_01: "Разрушенные дворцы"
 building_palace_ruins_01_desc: "Когда-то бывшие прекрасными символами богатства и изысканной жизни, эти обугленные остовы давным-давно были разграблены огнем и мародерами и теперь служат лишь пристанищем для диких животных и сквоттеров."

 building_peasant_housing_01: "Ветхие лачуги"
 building_peasant_housing_01_desc: "Хотя места предостаточно, рабочий класс можно просто содержать в поспешно возведенных трущобах вокруг главных торговых узлов."

 building_peasant_housing_02: "Деревянные дома"
 building_peasant_housing_02_desc: "Инвестиции в более прочное жилье значительно повысили выживаемость крестьян этого города, а вместе с ней и их численность."

 building_peasant_housing_03: "Многоэтажные дома"
 building_peasant_housing_03_desc: "Как и ящики на складе, человеческие ресурсы этого города укладываются друг на друга, чтобы удовлетворить постоянно растущий спрос на жилье."

 building_peasant_housing_04: "Каменные дома"
 building_peasant_housing_04_desc: "Хотя тратить драгоценное время каменщиков на простых крепостных было бы неслыханно где-либо еще, элита этого города понимает, что только из камня здания города могут быть достаточно высокими, чтобы вместить армию рабочих, необходимую для их предприятий."

 building_pirate_den_01: "Матросская таверна"
 building_pirate_den_01_desc: "Моряки и пьяницы — две стороны одной медали: привлечение одних привлекает и других."

 building_pirate_den_02: "Припортовый бордель"
 building_pirate_den_02_desc: "Месяцы в море оставляют с определенными... потребностями. Здесь эти потребности удовлетворяются в изолированной и облагаемой налогом обстановке."

 building_pirate_den_03: "Контрабандный док"
 building_pirate_den_03_desc: "Черный рынок может казаться нелицеприятным, но для этого города это не что иное, как еще один источник ресурсов."

 building_pirate_den_04: "Пиратский квартал"
 building_pirate_den_04_desc: "Методы приобретения богатства не ограничиваются торговлей, и принятие этого обязательно принесет огромные богатства."

 building_plaza_01: "Городская площадь"
 building_plaza_01_desc: "Скромная площадь для сбора местных жителей и распространения новостей и слухов городскими глашатаями среди широких масс."

 building_plaza_02: "Центральная площадь"
 building_plaza_02_desc: "Городская площадь выросла в настоящее сердце зарождающегося города, где собираются люди со всех окрестных территорий."

 building_plaza_03: "Городские площади"
 building_plaza_03_desc: "Сеть небольших городских площадей служит местными узлами для рынков и уменьшает заторы на главной рыночной площади."

 building_plaza_04: "Великая площадь"
 building_plaza_04_desc: "Центральная площадь теперь представляет собой грандиозное зрелище, окруженное великолепными зданиями со всех сторон, внушая трепет посетителям издалека."

 building_plaza_ruins_01: "Задуваемая ветрами площадь"
 building_plaza_ruins_01_desc: "Жуткая тишина, висящая над этим вроде бы огромным городским пространством, заставляет чувствовать себя почти в клаустрофобии, а по поврежденной мостовой теперь разбросаны лишь обломки и редкие скелеты."

 building_promenade_01: "Бульвар"
 building_promenade_01_desc: "Скромный бульвар расположен неподалеку от пристаней, к которым швартуются купцы, позволяя состоятельным гражданам неспешно прогуливаться и покупать редкие безделушки."

 building_promenade_02: "Брусчатка"
 building_promenade_02_desc: "Прибрежный бульвар был замощен брусчаткой, что улучшило качество дороги и производит приятное впечатление на гостей."

 building_promenade_03: "Променад"
 building_promenade_03_desc: "Бульвар превратился в настоящий променад со множеством рыночных палаток, арендуемых купцами. Хотя денежный доход от этих сделок для короны относительно невелик, престиж обладания иноземными диковинами стоит затрат на строительство."

 building_promenade_04: "Ривьера"
 building_promenade_04_desc: "Став оживленным центром для городской элиты, этот променад служит постоянным напоминанием о процветании его правителей."

 building_type_qabuux_01: "Жилище кабуукс"
 building_type_qabuux_01_desc: "Составляя основу социальной организации федагешей, жилища кабуукс представляют собой разновидность большого дома, в котором живут несколько семей, объединенных в единое целое, называемое «кабуукс»."
 building_qabuux_01: "Скромное жилище кабуукс"
 building_qabuux_01_desc: "Составляя основу социальной организации федагешей, жилища кабуукс представляют собой разновидность большого дома, в котором живут несколько семей, объединенных в единое целое, называемое «кабуукс». Данная постройка является относительно скромным примером такого жилища и состоит всего из одного здания и окружающих его сельскохозяйственных угодий."
 building_qabuux_02: "Растущее жилище кабуукс"
 building_qabuux_02_desc: "Составляя основу социальной организации федагешей, жилища кабуукс представляют собой разновидность большого дома, в котором живут несколько семей, объединенных в единое целое, называемое «кабуукс». Данная постройка представляет собой умеренный пример такого жилища, главное здание которого было расширено для размещения большего числа людей."
 building_qabuux_03: "Внушительное жилище кабуукс"
 building_qabuux_03_desc: "Составляя основу социальной организации федагешей, жилища кабуукс представляют собой разновидность большого дома, в котором живут несколько семей, объединенных в единое целое, называемое «кабуукс». Данная постройка представляет собой довольно крупный пример такого жилища, где центральное здание окружено рядом дополнительных построек."
 building_qabuux_04: "Большое жилище кабуукс"
 building_qabuux_04_desc: "Составляя основу социальной организации федагешей, жилища кабуукс представляют собой разновидность большого дома, в котором живут несколько семей, объединенных в единое целое, называемое «кабуукс». Данная постройка представляет собой масштабный пример такого жилища, в котором давние здания были усовершенствованы с помощью современных строительных технологий."
 building_qabuux_05: "Впечатляющее жилище кабуукс"
 building_qabuux_05_desc: "Составляя основу социальной организации федагешей, жилища кабуукс представляют собой разновидность большого дома, в котором живут несколько семей, объединенных в единое целое, называемое «кабуукс». Данная постройка представляет собой впечатляющий пример такого жилища, возвышающееся здание которого возносится над окружающей его скромной деревней."
 building_qabuux_06: "Монументальное жилище кабуукс"
 building_qabuux_06_desc: "Составляя основу социальной организации федагешей, жилища кабуукс представляют собой разновидность большого дома, в котором живут несколько семей, объединенных в единое целое, называемое «кабуукс». Данное сооружение — монументальный подвиг инженерной мысли, возвышающийся над окрестными землями как символ дамотанской культуры."
 building_recruitment_post_01: "Вербовочные отряды"
 building_recruitment_post_01_desc: "Когда военный набор оставляет желать лучшего для местных лордов, всегда есть вариант отправить вербовочные отряды, чтобы согнать отчаявшихся бедолаг и просто объявить им, что отныне они солдаты."

 building_recruitment_post_02: "Вербовочные пункты"
 building_recruitment_post_02_desc: "Посадив улыбчивого солдата за стол на местных рынках и форумах, мы можем обеспечить постоянный поток смельчаков и глупцов, записывающихся на службу в поисках обещанной славы."

 building_recruitment_post_03: "Демонстрация снаряжения"
 building_recruitment_post_03_desc: "Стальные мечи, качественные сапоги, расписные щиты, гравированные шлемы — одолжив вербовщикам кое-что из самого лучшего и современного снаряжения армии, мы можем завлечь новобранцев, свято верящих, что именно такое снаряжение они и получат."

 building_recruitment_post_04: "Пропагандистские кампании"
 building_recruitment_post_04_desc: "Спросите любого ветерана, пережившего пару кампаний, и он скажет вам, что военная жизнь вовсе не романтична. К счастью, мы можем расклеить по стенам плакаты и распустить слухи, которые убедят потенциальных новобранцев в обратном."

 building_reinforcement_tunnels_01: "Секретные тоннели"
 building_reinforcement_tunnels_01_desc: "Наличие надежного, скрытого тоннеля между мегаполисом и внешним миром позволяет приводить подкрепления и дает возможность правителям бежать во время осады."

 building_reinforcement_tunnels_02: "Потайные склады"
 building_reinforcement_tunnels_02_desc: "Расширив скрытую сеть под мегаполисом и обустроив потайные склады продовольствия, медикаментов и боеприпасов, мы сможем гарантировать, что наши войска выдержат более длительную осаду."

 building_roxirvoreais_fog_desc: "$building_type_roxirvoreais_fog_desc$" 

 building_ruined_citadel_01: "Залитые кровью залы"
 building_ruined_citadel_01_desc: "Какое бы бедствие ни погубило это место, местный гарнизон сыграл в этой истории ключевую роль. Будь то результат нападения вражеской армии, внутренних интриг за власть или откровенного мятежа, стены и полы этого форта усыпаны костями, засохшей кровью и сломанным снаряжением."

 building_ruined_citadel_02: "Восстановленная крепость"
 building_ruined_citadel_02_desc: "Хотя форт стал лишь тенью своего прежнего величия, теперь он очищен от человеческих останков, гнилой мебели и крысиных гнезд и способен поддерживать небольшой гарнизон в районе."

 building_ruined_district_01: "Разрушенный район"
 building_ruined_district_01_desc: "Когда-то бывший сияющей жемчужиной цивилизации, этот жуткий город-призрак теперь представляет собой лишь груды битого камня, потускневшую славу и трагические воспоминания."

 building_ruined_maritime_district_01: "Заросшая береговая линия"
 building_ruined_maritime_district_01_desc: "Вынужденные бороться как с разрушительным воздействием природы, так и со временем, прошедшим с момента заброшенности, затонувшие и покоробившиеся пирсы теперь окружают покрытые водорослями остовы кораблей, а приливы привели набережную в состояние полного запустения."

 building_ruined_maritime_district_02: "Пустующая набережная"
 building_ruined_maritime_district_02_desc: "Очищенная от гнилых пирсов и затонувших обломков, эта набережная пока может предложить мало ценности, кроме живописного вида, однако чистый потенциал для восстановления наших водных ворот в город теперь открыт для использования."

 building_ruined_palace_01: "Разграбленный цитадель"
 building_ruined_palace_01_desc: ""

 building_ruined_temple_district_01: "Оскверненная земля"
 building_ruined_temple_district_01_desc: ""

 building_ruined_trade_district_01: "Заваленная обломками площадь"
 building_ruined_trade_district_01_desc: "Рыночная площадь, где когда-то располагался мощнейший экономический центр города, теперь завалена горами обломков — остатками как рыночных палаток, так и всяческого хлама со всего города, снуемого мародерами и беженцами на открытом пространстве."

 building_ruined_trade_district_02: "Открытый рынок"
 building_ruined_trade_district_02_desc: "Хотя это была трудоемкая задача, рыночная площадь была очищена от огромных куч мусора, занимавших пространство. Это не только устранило пожарную и санитарную угрозу для нашего народа, но и вновь открыло пространство для ведения торговли."

 building_ruined_urban_district_01: "Непригодные для жизни руины"
 building_ruined_urban_district_01_desc: ""

 building_ruined_workshop_district_01: "Пустующие мастерские"
 building_ruined_workshop_district_01_desc: ""

 building_scattered_training_ground_01: "Место для драки"
 building_scattered_training_ground_01_desc: "Кое-как начерченный на земле круг, когда-то служивший тренировочной площадкой для нашего гарнизона, теперь стал местом проведения кулачных боев — как ради забавы, так и для разрешения споров среди местного преступного мира."

 building_scattered_training_ground_02: "Бойцовская яма"
 building_scattered_training_ground_02_desc: "Вырытая в земле и укрепленная деревом и металлом местными преступниками, эта яма имеет только одно правило: входят двое бойцов, а живым выходит только один. К сожалению, далеко не все оказываются здесь по своей воле."

 building_scattered_training_ground_03: "Арена бандитов"
 building_scattered_training_ground_03_desc: "С расширенным пространством, нормальными местами для зрителей и букмекерским столом, за которым заправляет золотозубая фигура, которую каждый зовет по-разному, эта арена не только обеспечивает кровавое развлечение для отборной сволочи нашего мегаполиса, но и позволяет проводить более крупные и прибыльные мероприятия."

 building_scattered_training_ground_04: "Игры преступного мира"
 building_scattered_training_ground_04_desc: "Дерзость наших преступников, воплощенная в физической форме: игры, проводимые на этих бывших тренировочных площадках, теперь соперничают с лучшими в стране. Королевские битвы, бои с экзотическими зверями и даже примитивные гонки на колесницах наполняют воздух криками и смертью. Эти испытания настолько суровы, что даже некоторые из наших собственных рыцарей участвуют в них, чтобы пополнить свои навыки."

 building_shipyard_01: "Резчик по дереву"
 building_shipyard_01_desc: "В этих скромных мастерских изготавливаются резьба для мачт и корпусов, производится ремонт и строятся небольшие лодки."

 building_shipyard_02: "Парусная мастерская"
 building_shipyard_02_desc: "Ни один корабль не обходится без паруса, и щедрые инвестиции правителя города гарантировали, что значительная часть городских ткачей с готовностью производит эту ключевую деталь корабля."

 building_shipyard_03: "Сухие доки"
 building_shipyard_03_desc: "Без логистических трудностей, связанных с транспортировкой, здесь можно строить куда более крупные корабли, что значительно повышает производственные мощности города."

 building_shipyard_04: "Военно-морская база"
 building_shipyard_04_desc: "Лес судов отечественного производства — как военных, так и торговых — содержится здесь в ожидании покупателей и владельцев."

 building_siege_workshop_01: "Резчик по дереву"
 building_siege_workshop_01_desc: "Чтобы производить высококачественные осадные орудия, умелые резчики города труждаются над кусками древесины со специально изготовленными измерительными инструментами и приборами."

 building_siege_workshop_02: "Баллистическая мастерская"
 building_siege_workshop_02_desc: "Чтобы владыки мегаполиса могли метать во врагов не только обычные камни, инженеры внутри этих зданий изобретают все более смертоносные снаряды."

 building_siege_workshop_03: "Варка зажигательной смеси"
 building_siege_workshop_03_desc: "Ужасное и жестокое оружие производится в этой варочной, пригодное для использования только правителем мегаполиса."

 building_siege_workshop_04: "Испытательный полигон"
 building_siege_workshop_04_desc: "Наличие команды строителей и большого поля для испытаний нового осадного оружия значительно повысило его качество."

 building_slave_market_01: "Площадь работорговцев"
 building_slave_market_01_desc: "Обосновавшееся в городе сообщество работорговцев захватило небольшую площадь для торговли своим товаром."

 building_slave_market_02: "Рынок рабов"
 building_slave_market_02_desc: "Растущая работорговля выплеснулась за пределы скромной площади и теперь занимает место и на прилегающих улицах."

 building_slave_market_03: "Невольничья биржа"
 building_slave_market_03_desc: "То, что начиналось как внутренний рынок, расширилось в размерах и масштабах, и теперь работорговцы со всего мира торгуют здесь своим экзотическим человеческим товаром."

 building_slave_market_04: "Квартал работорговли"
 building_slave_market_04_desc: "Вокруг бурно развивающейся работорговли города возникла обширная индустрия производства и услуг, позволяющая недорого производить и продавать предметы роскоши и услуги многочисленным жителям и гостям города."

 building_stonemason_01: "Каменный склад"
 building_stonemason_01_desc: "Здесь хранятся строительные блоки города, ожидая использования во многочисленных текущих проектах мегаполиса."

 building_stonemason_02: "Каменотес"
 building_stonemason_02_desc: "Пределы простой укладки камней друг на друга преодолеваются каменотесами, которые обрезают и обтесывают материал до размеров, требуемых архитекторами."

 building_stonemason_03: "Скульптурная мастерская"
 building_stonemason_03_desc: "Мегаполис стал местом создания множества прекрасных статуй и каменных изделий, и все они берут свое начало в этих мастерских."

 building_stonemason_04: "Гравировщики по камню"
 building_stonemason_04_desc: "Значительное количество самых умелых каменотесов в мире неустанно трудятся в мегаполисе, помогая создавать вневременные архитектурные шедевры."

 building_tavern_01: "Общественная пивная"
 building_tavern_01_desc: "Для большинства выпивка — это порок, веселое времяпрепровождение или способ забыть о печалях. Для города же — источник прибыли и контроля."

 building_tavern_02: "Тайный бордель"
 building_tavern_02_desc: "Для тех, кто не может с шармом добиться плотских утех, улаживание этого вопроса найдется в этом городе... за определенную цену."

 building_tavern_03: "Кабаре"
 building_tavern_03_desc: "Развлечения в мегаполисе принимают самые разные формы, а заведений, предлагающих их, не меньше."

 building_tavern_04: "Квартал красных фонарей"
 building_tavern_04_desc: "Каждое вообразимое плотское наслаждение предлагается здесь мужчине или женщине с достаточно глубокими карманами."

 building_temple_district_01: "Собрание верующих"
 building_temple_district_01_desc: "Благодаря приглашениям и условиям, созданным правителем этого города, он стал излюбленным местом для паломников и других амбициозных священнослужителей."

 building_temple_district_02: "Храмовый квартал"
 building_temple_district_02_desc: "Приток ревностных верующих, щедро финансируемый, вылился в расцвет храмов в самом сердце города, привлекая и обращая в веру еще больше жителей."

 building_temple_district_03: "Духовный анклав"
 building_temple_district_03_desc: "Иерархии священнослужителей, установившиеся в храмовом квартале, образовали несколько микрогосударств в черте города, привлекая тысячи верующих, облагаемых налогом."

 building_temple_district_04: "Священный город"
 building_temple_district_04_desc: "Религиозные организации в этом городе полностью захватили его, и теперь он застроен храмами и молитвенными домами тысячи общин."

 building_temple_workshop_01: "Скрипторий"
 building_temple_workshop_01_desc: "Удовлетворяя в первую очередь собственные нужды, оставляя немного места для экспорта, духвные лица в этом заведении переписывают и распространяют священные и светские тексты по запросу, часто с большим вниманием к деталям."

 building_temple_workshop_02: "Монастырская пивоварня"
 building_temple_workshop_02_desc: "Погреба, полные эля и пива, производятся здесь городским духовенством. Высокого качества, это пиво стало весьма востребованным товаром в регионе."

 building_temple_workshop_03: "Ботанический сад"
 building_temple_workshop_03_desc: "Монахи этого города ухаживают за десятками видов трав, редких растений и медицинских реагентов, продаваемых жителям города."

 building_temple_workshop_04: "Деревообрабатывающие мастерские"
 building_temple_workshop_04_desc: "Умелые и терпеливые руки монахов создают одни из лучших деревянных изделий на континенте, что создает огромный спрос на их труд по всему миру."

 building_thieves_guild_01: "Заброшенные тоннели"
 building_thieves_guild_01_desc: ""

 building_thieves_guild_02: "Притон воров"
 building_thieves_guild_02_desc: ""

 building_thieves_guild_03: "Скупщик краденого"
 building_thieves_guild_03_desc: ""

 building_thieves_guild_04: "Скрытые хранилища"
 building_thieves_guild_04_desc: ""

 building_trade_district_01: "Площадь разносчиков"
 building_trade_district_01_desc: "Скромный, но растущий торговый узел, расположенный в центре мегаполиса."

 building_trade_district_02: "Рыночная площадь"
 building_trade_district_02_desc: "Инвестиции в инфраструктуру и растущий торговый интерес раздули торговый узел в размерах, и теперь он занимает большую площадь."

 building_trade_district_03: "Грандиозная ярмарка"
 building_trade_district_03_desc: "Размером с целый город, купеческая элита этого города выкроила обширное промышленное и торговое царство в самом сердце этого мегаполиса."

 building_trade_district_04: "Огромный базар"
 building_trade_district_04_desc: "Бьющееся сердце коммерции целого континента глубоко укоренилось в этом мегаполисе, опутывая его районы словно паутина."

 building_type_00_ashmarite_hospital: "Разрушенная ашмаритская больница"
 building_type_00_ashmarite_hospital_desc: "Долгое время служившая нуждающимся в Эль-Кулате, знаменитая Ашмаритская больница не избежала разрушения и теперь лежит в руинах. В полуразрушенные помещения стекаются больные и умирающие, которым больше некуда обратиться, и теперь они бесцельно бродят в ожидании смерти."

 building_type_00_candamarun_academy: "Разрушенная академия Кандамарун"
 building_type_00_candamarun_academy_desc: "Когда-то престижный [Concept('vidvakastilaya','университет и метеостанция')|E] теперь пал под ударами стихии, за которой он когда-то наблюдал и которую изучал. Однако [Concept('gudugwrat','Дикий шторм Гудугврат')|E] все еще беспрепятственно бушует над Каширянским заливом, пережив тех, кто когда-то пытался укротить его силу."

 building_type_00_carthara_statue: "Разрушенная статуя Картары"
 building_type_00_carthara_statue_desc: "Когда-то грандиозная статуя Картары-Завоевательницы теперь разбита на куски, разбросанные вокруг ее пьедестала. Все ее украшения разграблены или уничтожены, а гордое знамя LIV Легиона, которое несла архилегат, теперь лежит изорванным и забытым — свидетельство того, что даже великие завоеватели не могут победить разрушительное время."

 building_type_00_champion_grounds: "Разрушенная Протошлити"
 building_type_00_champion_grounds_desc: "Гроссмейстеры Протошлити и раньше сталкивались с полным уничтожением своего Легиона. Однако на этот раз катастрофа, обрушившаяся на академию, была настолько сокрушительной, что на горах, где она когда-то стояла, не осталось ни единого следа ее существования."

 building_type_00_chrys_lymani: "Разрушенный Хрис Лимани"
 building_type_00_chrys_lymani_desc: "Когда-то бывший сияющим драгоценным камнем в [Concept('aversaria','аверсарианской')|E] короне, центральным элементом едва ли не самого богатого города на [aeras|E], Золотой порт теперь представляет собой лишь разбитые камни и гниющие остовы кораблей, окруженные блеклыми руинами создавшей его империи."

 building_type_00_degasho_bedelam: "Разрушенный Дегашо Беделам"
 building_type_00_degasho_bedelam_desc: "Когда-то бывший пышным памятником роскоши и порока, Дегашо Беделам теперь превратился в обычный гниющий остов — дворец, опустевший не из-за благочестия, а из-за трагедии. Здесь больше не играет музыка, не кружатся танцовщицы; висит лишь леденящая душу тишина и жуткая неподвижность могилы."

 building_type_00_desert_stilto_katharoteras_desc: "Когда-то бывший процветающим мегаполисом, сияющей жемчужиной в [Concept('aversaria','имперской')|E] короне, Орайсполь теперь превратился в пыль. Из странного песка, казалось бы, пульсирующего магической энергией, поджимаются разрушающиеся статуи и древние монументы, устремленные к небу в тщетной попытке ухватиться за память человечества. Говорят, что в пронзительном ветре можно услышать вопли забытых."

 building_type_00_dihasma_xiidan: "Разрушенный Дихасма Ксиидан"
 building_type_00_dihasma_xiidan_desc: "Когда-то бывший памятником воинским традициям Дамоты, Дихасма Ксиидан был заброшен и поглощен джунглями. Институт, переживший даже [etami_tetenik|E], теперь, возможно, навсегда утерян."

 building_type_00_elysian_pass: "Забытый Элисийский перевал"
 building_type_00_elysian_pass_desc: "Элисийский перевал теперь вновь напоминает то, чем он был до одноименной битвы. Просто еще одна проселочная дорога, забытая почти всем миром. Когда его точное местоположение затерялось, Битва при Элисийском перевале приобрела еще более мифический размах. Даже те немногие туземцы, что остались здесь, едва ли могут вспомнить кладбище у себя под ногами."

 building_type_00_eternal_grove: "Разрушенная Вечная роща"
 building_type_00_fog_dihasma_xiidan: "Окутанный туманом Дихасма Ксиидан"
 building_type_00_fog_dihasma_xiidan_desc: "В бесплодных землях, оставленных не прекращающимся продвижением [Concept('the_fog','Тумана')|E], изолированно стоит крепость. Когда-то известная по всей Дамоте, теперь о ней никто не помнит, за исключением бестелесных теней, бродящих по ее территории.#!"

 building_type_00_fog_elysian_pass: "Окутанный туманом Элисийский перевал"
 building_type_00_fog_elysian_pass_desc: "Внутри [Concept('the_fog','Тумана')|E], вдоль в остальном забытой тропы, все еще патрулирует армия. Облаченные в мундиры бесчисленных Легионов, [Concept('aversaria','аверсарианцы')|E], павшие при Элисийском перевале, все еще заново переживают ту обреченную битву, крича в оглушительной какофонии. Что заставляет их духи стенать от такой видимой боли — неизвестно, а может и непостижимо. Но до тех пор, пока исследователи все еще осмеливаются отваживаться в их часть Земель Тумана, их борьба не будет забыта."

 building_type_00_fog_eternal_grove: "Туманная Вечная роща"
 building_type_00_fog_irochi_damotada: "Туманный Ирочи Дамотада"
 building_type_00_fog_irochi_damotada_desc: "В конце древней тропы возвышается могучая стена, воздвигнутая давным-давно сгинувшим царством. Однако прямо перед ней расположилось кладбище. Потрёпанные знамёна и перевёрнутые повозки великого конвоя беженцев покоятся навеки среди гниющих останков едва ли не всего населения северного [Concept( 'sarradon', 'Саррадона' )|E]. Словно молчаливые стражи за этой горой обломков, руины Врат Дамоты остаются, пожалуй, последним напоминанием о прежнем мире.#!"

 building_type_00_fog_nagom_kakezihi: "Туманный Нагом Какезихи"
 building_type_00_fog_nagom_kakezihi_desc: "Даже технологическая мощь Адабисса не смогла устоять перед наступлением [Concept('the_fog','Тумана')|E]. После многовекового стражи Нагом Какезихи был оставлен стражниками без единого выстрела. Однако эта эвакуация была организована настолько чётко, что заброшенная крепость всё ещё сохранила большую часть своего функционала. Ворота запечатаны намертво, а внутренние помещения усеяны ловушками — отчаянная попытка северного гарнизона выиграть время для эвакуации Нотафвилока. Но каков бы ни был их успех, север теперь потерян навсегда."

 building_type_00_fog_riduvianbarrows: "Туманные Ридувианские курганы"
 building_type_00_fog_riduvianbarrows_desc: "Прекрасная и могучая Картараддия пала под напором [Concept('the_fog','Тумана')|E]. Здесь, на Ридувианских курганах, усыпальнице некогда великих [Concept( 'magi', 'магов' )|E]-императоров севера, это выглядит почти поэтично. Навсегда поглощённые тьмой, эти места полны странного скрежета, доносящегося из-за каждой двери, где навечно скитаются сотни поколений замученных магов." 

 building_type_00_fog_stilto_katharoteras: "Туманный Стильто Катаротерас"
 building_type_00_fog_stilto_katharoteras_desc: "То, что когда-то было монументом величию [Concept( 'aversaria', 'Аверсарии' )|E], теперь стоит как надгробие на её могиле. Он возвышается над руинами Ораисполя, окружённый удушающим [Concept('the_fog','Туманом')|E], а глаза позолоченных статуй, кажется, следят за каждым, кто отважится пройти по пустым улицам. Порой монумент даже будто сдвигается с места, словно духи великой армии, в честь которой он был воздвигнут, даровали ему новую, искажённую жизнь."

 building_type_00_fog_tabik_betemisit: "Туманный Табик Бетемисит"
 building_type_00_fog_tabik_betemisit_desc: "Дамота пала жертвой [Concept('the_fog','Тумана')|E], став лишь ещё одним мёртвым царством в мире, полным им подобных. Нет более яркого символа этого поражения, чем труп Захали, в центре которого всё ещё стоит пустой дворец. Его украшенные драгоценными камнями золотые залы отныне навсегда недоступны для человечества, а трон Боккаров, являющийся также троном бога, навеки останется пустующим."

 building_type_00_haseti_mekab: "Разрушенный Хасети Мекаб"
 building_type_00_haseti_mekab_desc: "Когда-то забытая в дебрях джунглей, Ложная Гробница снова ускользнула из поля зрения Искателей, оставленная гнить в глубинах Дамоты."

 building_type_00_irochi_damotada: "Разрушенный Ирочи Дамотада"
 building_type_00_irochi_damotada_desc: "В конце древней тропы путешественник может наткнуться на обломки разрушенной стены. Серые кирпичи лежат разбитыми, развеянными по ветру будто рукой великана. Лишь по обрывкам истлевших знамён да сохранившимся страницам сожжённых книг можно вспомнить о временах, когда это место было конечным пунктом великого торгового пути."

 building_type_00_lich_dihasma_xiidan: "Скорбный Дихасма Ксиидан"
 building_type_00_lich_dihasma_xiidan_desc: "В землях мёртвых Дихасма Ксиидан теперь стоит как усталый монумент ушедшему миру. Его оставили медленно гнить, ведь новым владыкам нет дела до традиций живых."

 building_type_00_lich_elysian_pass: "Скорбный Элизийский перевал"
 building_type_00_lich_elysian_pass_desc: "После падения этого исторического места под натиском, который возглавил [Concept('liches','Лич')|E], Элизийский перевал впервые в истории обрёл колоссальное стратегическое значение. Земля, усеянная трупами последних армий [Concept( 'aversaria', 'Аверсарии' )|E], под контролем одного из повелителей нежити превратилась в исток невероятной силы. Легионы Аверсарии снова маршируют под знамёнами великих [Concept( 'magi', 'магов' )|E]. Если закрыть глаза на их скелетообразный облик, это место вполне могло бы напомнить империю былых времён."

 building_type_00_lich_eternal_grove: "Скорбная Вечная роща"
 building_type_00_lich_irochi_damotada: "Скорбный Ирочи Дамотада"
 building_type_00_lich_irochi_damotada_desc: "Врата Дамоты, возведённые при [Concept( 'belar_dynasty', 'династии Белар' )|E], наконец пали — и не перед армией живых, а перед полчищами мертвецов. Однако любому путнику было бы невозможно разглядеть их прежнее значение. Никогда не предназначавшиеся для использования в качестве настоящего военного укрепления, Врата быстро рухнули после короткой борьбы, а великая библиотека вместе с большинством других свидетельств того, что это место не всегда принадлежало мёртвым, была предана огню."

 building_type_00_lich_nagom_kakezihi: "Скорбный Нагом Какезихи"
 building_type_00_lich_nagom_kakezihi_desc: "Не от рук людей севера Адабиссу суждено было терпеть поражение. Как и на юге, Адабисс встретил равного соперника в лице восставших мертвецов, которые хлынули на Нагом Какезихи огромной ордой во главе с [Concept('liches','Личем')|E]. С его падением земли Адабисса оказались беззащитны перед угрозой, с которой они не сталкивались на памяти живущих."

 building_type_00_lich_riduvianbarrows: "Скорбные Ридувианские курганы"
 building_type_00_lich_riduvianbarrows_desc: "Прекрасная и могучая Картараддия была потеряна в результате вторжения, которое возглавил [Concept('liches','Лич')|E]. Здесь, на Ридувианских курганах, бывшем упокоении некогда могущественных [Concept( 'magi', 'магов' )|E]-императоров севера, мертвецы восстают из своих могил, превращаясь в марионеток Мёртвого Императора. Поглощённые вечной тьмой, эти места полны странного скрежета, доносящегося из-за каждой двери, и сотни поколений замученных магов вновь шагают по земле." 

 building_type_00_lich_stilto_katharoteras: "Скорбный Стильто Катаротерас"
 building_type_00_lich_stilto_katharoteras_desc: "На месте, где прежде возвышалась Колонна Чистейшего, теперь не осталось ничего, кроме груды руин. В приступе мании величия [Concept('liches','Лич')|E], покоривший древний мегаполис, уничтожил её вместе со всеми остальными памятниками в городе, безумно провозгласив, что почитания достоин лишь его собственный лик. Древнее наследие Ораисполя, пережившее так много, в конце концов было задушено костлявой рукой."

 building_type_00_lich_tabik_betemisit: "Скорбный Табик Бетемисит"
 building_type_00_lich_tabik_betemisit_desc: "Созданный для того, чтобы дать приют мёртвому богу, Табик Бетемисит — по крайней мере, по мнению его нынешнего правителя — наконец исполняет свое предназначение. С высокомерием, свойственным [Concept( 'liches', 'личам' )|E], завоеватель Захали провозгласил себя вернувшимся Всевышним и оставил здание нетронутым в качестве храма своего величия. Перед троном выставлены черепа Боккаров, навеки проклятые созерцать эту ужасную пародию на их империю."

 building_type_00_lionspalace: "Разрушенный Кеашлтна Джеаша"
 building_type_00_lionspalace_desc: "Когда-то сияющий монумент бесчисленным триумфам Айяров, Львиный дворец ныне представляет собой лишь лабиринт запустения. Обвалы конструкций сделали огромные секции здания — и сокровища, по слухам, всё ещё таящиеся внутри — недоступными ни для кого, кроме самых отважных или безрассудных искателей приключений. Хотя статуи, в честь которых дворец получил своё название, всё ещё стоят, многие из них были изуродованы катастрофой до неузнаваемости, и лишь немногие уцелевшие взирают на раскинувшиеся руины Шеярлахиры, неся скорбный вахтенный покой над этим кладбищем."

 building_type_00_grod_cruprag: "Разрушенный Грод Крупраг"
 building_type_00_grod_cruprag_desc: "Многие думали, что Грод Крупраг выдержит штурм любой силы, однако теперь замок разделяет поражение своего создателя. Погибель пришла в некогда великую крепость, а её разбросанные обломки практически неотличимы от камней горного склона, из которого она когда-то была высечена."

 building_type_00_mountain_tower: "Разрушенный Пиргон то Тейссия"
 building_type_00_mountain_tower_desc: "Горная башня была построена Ааутократией Тейссией как величественный символ [Concept('aversaria','аверсарианского')|E] триумфа, возвышающийся над великой столицей. Теперь же это лишь разбитый шпиль из камня, устремлённый вверх, словно тянущийся к навсегда утерянному прошлому."

 building_type_00_nagom_kakezihi: "Разрушенный Нагом Какезихи"
 building_type_00_nagom_kakezihi_desc: "Даже мощь Адабисса не уязвима перед разрушением. Нет лучшего подтверждения этому факту, чем руины Нагом Какезихи, бывшие когда-то неприступным барьером между золотой империей и варварской пустошью севера. Прежде величественная стена теперь пробита, с огромной брешью по центру — открытый путь на юг преграждают лишь обломки упавших башен."

 building_type_00_riduvianbarrows: "Заброшенные Ридувианские курганы"
 building_type_00_riduvianbarrows_desc: "Ридувианские курганы когда-то были местом упокоения первых [Concept('kartharadd','картараддских')|E] [Concept( 'magi', 'магов' )|E]-императоров в Эру Звёзд. Хотя Ридувианский двор в конечном итоге был массово казнён после событий Инвеституры, Неронманический («Абнормалистский») и Скритарийский («Секретный») дворы всё ещё продолжали использовать это место. Курганы вышли из употребления только после окончания Эры Звёзд, когда Срарврии («рабы») одержали победу в Рабском перевороте. Будучи одновременно местом, где последний отряд магов сдался Старврии, и местом, где затем был коронован первый император, курганы всегда считались у картарадди символом мира и удачи." 

 building_type_00_sonas_sikelenizi: "Разрушенный Сонас Сикеленизи"
 building_type_00_sonas_sikelenizi_desc: "На перекрёстке трёх рек медленно гниют деревянные доски. Всё, что осталось от этого когда-то великого центра торговли — лишь обломки."

 building_type_00_star_tower: "Разрушенный Пиргон то Анатокион Астерон"
 building_type_00_star_tower_desc: "Звёздная башня когда-то несла торговлю и стражу над Корвионским проливом, защищая сияющую столицу Асиуполис. Но те дни давно прошли. Теперь звёзды светят лишь на разбитый, гниющий остов, бросающий тёмную тень на разбросанные камни и разрушенные здания, которые он когда-то укрывал."

 building_type_00_sunarsarwena_gardens: "Разрушенное святилище Сунарсарвены"
 building_type_00_sunarsarwena_gardens_desc: "Когда-то цветущий уголок зелени, славившийся своей красотой, сады Сунарсарвены ныне лежат в запустении, а их удивительная коллекция флоры давно погибла от небрежения. Бесплодные руины не хранят и следа жизни, что некогда кипела здесь, а цветущие сады теперь так же забыты, как и принцесса, ради которой они создавались."

 building_type_00_tabik_betemisit: "Разрушенный Табик Бетемисит"
 building_type_00_tabik_betemisit_desc: "Когда-то сияющий памятник богатству Боккаров и преданности вере Моговай, Пустой дворец теперь истинно пуст. Из его стен выбиты огромные куски драгоценных камней и золота, украденные мародёрами в хаосе после обрушившегося на город бедствия. Этот опустошённый остов окружён лишь разрушающимися руинами — каменный город Захали оставлен на съедение джунглям."

 building_type_00_tombofthesaints: "Разрушенный Тафон то Агионис"
 building_type_00_tombofthesaints_desc: "То, что когда-то было строгим монументом Святым, олицетворявшим чистоту и бескорыстие их жизни, теперь превратилось в обычную груду камней. Толпы верующих больше не приходят молиться в сожжённую церковь. Возможно, это наконец заставит агионистов исполнить то, чего требовал Забытый Святой: «Помните об отвержении иконы»."

 building_type_00_umlojtemplecomplex: "Разрушенный Завет Умлоджа"
 building_type_00_umlojtemplecomplex_desc: "$building_00_umlojtemplecomplex_desc$"

 building_type_00_walls_of_qarmuz: "Разрушенные стены Кармуза"
 building_type_00_walls_of_qarmuz_desc: "Хотя Стены Кармуза простояли веками, выдерживая осады величайших полководцев и завоевателей в истории [Concept( 'sarradon', 'Саррадона' )|E], даже они не были вечными. И хотя они всё ещё возвышаются над землей, магические обереги, делавшие их почти неприступными, за столь долгий срок наконец пали. Всё, что осталось сейчас — лишь разрушающийся фасад, пока последнее наследие древних правителей развеивается вместе с песком."

 building_type_01_abathon_throne: "Трон Абатона"
 building_type_01_abathon_throne_desc: "Среди высоких холмов Тенамара традиционная деревянная архитектура старого центра уступает место внушительному сооружению: ступени, высеченные прямо в камне холма, ведут к его плоской вершине. На самом верху этих ступеней возвышается величественный трон, будто созданный для существа, куда превосходящего размерами любого человека. Простой, лишённый украшений, но внушающий трепет своим бруталистским дизайном. По словам местных жителей, сооружение посвящено легендарному богу-царю, известному на островах как Абатон, и трон никогда никем не занимался, вечно ожидая его возможного возвращения."

 building_type_01_academyofswords: "[Concept('mayikprolollans','Майикпрололлан')|E] сто Спатас"
 building_type_01_academyofswords_desc: "Академия Мечей — одна из трёх [Concept( 'pathosixyic_academies', 'патосиксийских академий' )|E]. Построенная в порту Мегольтона, через который [Concept( 'mayikrata', 'Майикратия' )|E] получала большую часть товаров по реке Пафос и куда Академия могла принимать свежее железо и металлы из различных рудников Калатипсоми, Академия Мечей, тем не менее, является самой бедной из трёх академий.\n\nВысеченная из суровых колоний северной [Concept( 'aversaria', 'Аверсарии' )|E], академия всё же считается более престижной, чем роскошная Академия Волн. Упорный акцент на боевую магию и искусство заклинательного фехтования сделал Академию Мечей домом для многих самых легендарных [Concept( 'magi', 'магов' )|E] Аверсарии.#!"

 building_type_01_aironoiakaan: "[Concept('mayikprolollans','Майикпрололлан')|E] Айронойакаан"
 building_type_01_aironoiakaan_desc: "Айронойакаан, или Майикпрололлан Айронойакаан, был магической академией, основанной [Concept('aversaria','имперской')|E] претенденткой Ааутократией Аксиотеей в качестве прямого вызова господству [Concept('pathosixyic_academies','западных академий')|E]. Считается также, что она была создана для сбора сведений о [Concept( 'selfreplicating_blood_magic', 'самовоспроизводящейся магии крови' )|E], и в течение нескольких лет её члены были сосредоточены на исследовании апокалиптического [Concept('sarradon','саррадонского')|E] заклинания.\n\nАкадемия столкнулась с величайшей угрозой своему существованию во время [Concept( 'blue_robe_revolt', 'Восстания Голубых Мантий' )|E], которое привело к гибели её правящего совета. Айронойакаан прекратил своё существование через несколько месяцев в результате [Concept( 'frodbrokna', 'Фродброкны' )|E], когда восставшие Голубые Мантии и большинство оставшихся членов академии сгорели от заклинания, которое они отказались исследовать.#!"

 building_type_01_amagheantower: "Амагейская башня"
 building_type_01_amagheantower_desc: "Возвышаясь даже над самыми высокими пиками гор, в которых она расположена, Амагейская [Concept('the_towers','Башня')|E] долгое время привлекала [Concept('aversaria','аверсарианских')|E] [Concept( 'magi', 'магов' )|E], словно костёр мотыльков. Многие из её искателей погибли во время поисков, ведь природные препятствия этих мест столь же опасны, как и любые другие на [Concept( 'aeras', 'Эрасе' )|E]. Изобилующие лавинами зимой и изнуряющим сухим зноем летом, внутренние перевалы, ведущие к высокогорной долине с башней, подходят далеко не каждому. Хуже того, сама башня странно влияет на тех, кто не является уроженцем этого региона. Взгляд на неё производит эффект, схожий со взглядом на солнце — как полагают, это необычный побочный эффект магического сияния, украшающего её собратьев по всему Эрасу. Люди, родившиеся в этом регионе, судя по всему, смотрят на башню без каких-либо проблем, не описывая никакой слепоты, кроме ощущения «тёплого» цвета, который улавливают их глаза, но который они не могут описать."

 building_type_01_antimagi_chapterhouse: "Капитул антимагов"
 building_type_01_antimagi_chapterhouse_desc: "Позволяет нанимать [GetMaA('marcher_anti_mage').GetName] и [GetMaA('griffon_silencers').GetName] в качестве [Concept( 'men_at_arms', 'профессиональных полков' )|E]\n#weak Можно нанять только один полк Безмолвных Грифонов (макс. размер: 5)#!\n\nОбители, предназначенные для обучения и подготовки антимагов, самых прославленных воинов [Concept( 'chevalie', 'Шевалье' )|E]."

 building_type_01_ashmarite_hospital: "Ашмаритский госпиталь"
 building_type_01_ashmarite_hospital_desc: "Простой одноэтажный зал, примыкающий к внутреннему двору, Ашмаритский госпиталь веками служил беднякам $c_el_qulatha$. Говорят, его название происходит от имени народной святой, прославившейся давным-давно на этих самых улицах своей чудесной способностью исцелять больных простым наложением рук."

 building_type_01_ashuku_mines: "Изумрудные копи Ашуку"
 building_type_01_ashuku_mines_desc: "Завораживающие изумруды Ашуку были одним из основных товаров, переправляемых через пустыню по Гонянской дороге с самых пор, как этот маршрут стал действующим. Ревниво охраняемая местными жителями и [Concept('karavuux_capital','Каравуукс')|E], влияющими на политику северной Дамоты, добыча драгоценных камней долгое время находилась под строгим контролем сначала [Concept('boqqarut_damotada','Боккарута')|E], а затем и различных государств, удерживавших её со времён [Concept( 'etami_tetenik', 'Этами Тетеник' )|E]. Хотя многочисленные экспедиции с севера пытались захватить копи, большинство из них не продвинулись дальше Ирочи Дамотады, и никому не удалось вырвать контроль над рудником из рук удерживающих его дамотанцев. Дефицит лишь сделал драгоценные камни еще более ценными, и они продаются по всему [Concept('sarradon','Саррадону')|E] по заоблачным ценам."

 building_type_01_assassinskeep: "Калеада Харадар"
 building_type_01_assassinskeep_desc: "Калеада Харадар, или Крепость Харадара, служит главной штаб-квартирой религиозного культа Харадар. Хотя крепость забрасывалась на целые десятилетия и внешне никак не связана с убийствами, ни для кого не секрет, что именно отсюда харадарцы направляют свои действия и наносят удары из тени, обучая новых убийц и укрывая своих многочисленных агентов.\n\nКалеада Харадар не представляет собой ничего примечательного в плане фортификации, но скрывает обширный подземный комплекс, где и выполняются основные задачи культа и где харадарцы часто уходят в подполье на долгие годы, когда над крепостью нависает угроза."

 building_type_01_bastards_run: "Бастардов Бег"
 building_type_01_bastards_run_desc: ""

 building_type_01_bastonport: "Бастонпорт"
 building_type_01_bastonport_desc: "Бастонпорт — название древней серии верфей и фортов, когда-то обозначавших самую дальнюю южную границу [Concept( 'chevalie', 'Шевалье' )|E]. Захваченный в 277 году И. С. и удерживаемый чуть менее 100 лет, Бастонпорт остаётся одним из немногих сохранившихся напоминаний о былом контроле марочников.\n\nНесмотря на то, что марочники владели провинцией недолго, Бастонпорт оставался центром Калатипсоми на протяжении жизни большей части своего поколения, и [Concept('aversaria','аверсарианцы')|E] построили свой собственный город вокруг большинства первоначальных построек. Даже сегодня многие из оригинальных зданий Бастонпорта всё ещё видны, а название закрепилось за городскими портами."

 building_type_01_baytors_grave: "Могила Байтора"
 building_type_01_baytors_grave_desc: "Легенда гласит, что когда ольтенский военачальник Байтор пал в [Concept( 'battle_of_the_wall_of_astila', 'битве при Стене Астилы' )|E], его тело унесла могучая река Петрониатис, пока оно не упокоилось в её устье в Западной Айроное. С тех пор ольтени почитают скромный ручей, где берёт начало река, как последнее место упокоения Байтора, и он часто становится конечной точкой для паломников, идущих по пути [Concept( 'bayyuralar', 'байюраларов' )|E]."

 building_type_01_beban_mines: "Золотой рудник Бебана"
 building_type_01_beban_mines_desc: "Оспариваемый [Concept('ritualism','ритуалистскими')|E] и [Concept('wardenism','варденитскими')|E] сектами на протяжении последнего тысячелетия (чего и следовало ожидать от любого места в [Concept('sarradon','Саррадоне')|E], хотя бы отдалённо напоминающего достопримечательность), золотой рудник Бебана оказался под бдительным, слепым оком дикайноситов после того, как предыдущий ритуалистский владелец был признан виновным по делу о самоуправстве и незамедлительно истреблён вместе со всем своим родом."
 
 building_type_01_bigglacier: "Ледники Куйнель"
 building_type_01_bigglacier_desc: "Вдали от цивилизации, в суровых северных пустошах Катраддии открывается прекрасный вид. Массивные ледники, которые, кажется, бесконечно уходят за горизонт, внушают чувство ничтожности каждому проходящему мимо. В 1053 году первым [Concept('aversaria','аверсарианским')|E] исследователем, который и открыл, и смог выжить, чтобы рассказать о севере Катраддии, стал Константинос «Потерянный» Аксандос. После того как туземные проводники привели его в этот регион, Константинос позже писал, что был шокирован огромными размерами ледников. Однако правдивы ли его слова о почти кристально чистом льде с замёрзшими внутри предметами, похожими на «идеально сформированные слезинки», остаётся только гадать. Вернувшись с ледников, Константинос сообщил, что его проводники начали странный ритуал, будто молясь какому-то божеству. Его заметки завершаются коротким замечанием о том, что вскоре после этого начался снегопад."

 building_type_01_biyakaddu: "Биякадду"
 building_type_01_biyakaddu_desc: "Этами Бияки, великие озёра Дамоты, с давних пор формировали жизнь вокруг себя. И нигде это не проявляется так явно, как в Биякадду — крупнейшем порту на самом большом из этих озёр. Существуя со времён [Concept( 'pre_boqqarut_damota', 'добоккарутской Дамоты' )|E], он постепенно вырос в огромный порт, служащий перевалочным пунктом для кораблей, следующих в любой конец озера.\n\nВ самом порту можно найти отличные судостроительные верфи, едва ли не единственные в Дамоте — источник большинства речных судов и мелких лодок, ходящих по многочисленным рекам региона, а также их команд. Кроме того, почти все товары, происходящие к югу от Захали, проходят через этот город и продаются по относительно низким ценам на его многочисленных рынках. Порт также пользуется заслуженной репутацией места, где можно быстро и скрытно договориться о перевозке по всей Дамоте — услуга, весьма востребованная многочисленными мелкими правителями, давно окружавшими эти земли."

 building_type_01_blackgates: "Серые Врата"
 building_type_01_blackgates_desc: "Серые Врата — прозвище горного перевала, контролирующего северный вход из суровых диких земель северо-востока в [Concept('aversaria','Аверсарию')|E] на западе.\n\nЭто огромный горный массив с единственной узкой, извилистой и тревожно крутой тропой, уходящей на запад, делающей этот путь крайне опасным для путешественников, не говоря уже о целых армиях. Больше людей погибло на этом перевале от падающих валунов, обвалов и оползней, чем в любой битве, проходившей в его пределах.\n\nНад перевалом возвышаются древние сооружения неизвестной постройки, словно врезанные в стены гор высоко над дорогой. Аверсарианские археологи предполагают, что они предшествуют истории Аверсарии на несколько сотен тысяч лет, хотя никому так и не удалось найти вход: камень, из которого они сложены, кажется непробиваемым. Согласно многим сказаниям, вход скрывают тысячи пещер, пересекающих перевал, но его так никто и не нашёл, а многие из искателей так и не вернулись. Говорят, их крики о помощи вечно эхом отдаются в перевале." 

 building_type_01_blood_market: "Кровавый рынок"
 building_type_01_boneshrine: "То Иеротостони"
 building_type_01_boneshrine_desc: "Костяное святилище — это древний и странный алтарь, построенный глубоко в горных перевалах Серых Врат. Он загадочен не только своим местоположением и постройкой (высечен на каменной колонне, выступающей из лавовой ямы и окружённой неизвестными костями), но и своим происхождением. Хотя исследовательские отряды бывали здесь и до его открытия, святилище, по всем данным, внезапно возникло в середине 900-х годов И. С. Хотя первоначально считалось, что оно возведено странным культом или духами, [Concept('aversaria','аверсарианские')|E] археологи позже датировали этот объект с помощью окаменелостей и духовных изысканий примерно 699 годом до И. С.\n\nНеизвестно, откуда взялось святилище, но попытки аверсарианцев пересечь лавовое поле оказались тщетными. Любые проекты по постройке моста проваливались из-за постоянных несчастных случаев среди рабов или [Concept('magic','магической')|E] отдачи. По общему мнению, это место проклято, и любая попытка достичь его обречена на провал скорее из-за банального невезения, чем из-за видимого присутствия магии.\n\nЦенваре «Разрушитель Ведьм» и его армия беженцев заново открыли это место спустя более века после того, как оно перестало интересовать Аверсарию. Сьяльвольки держались от него подальше, считая проклятым, хотя легенды гласят, что провидцы партики каким-то образом смогли пройти к нему без особых проблем, но никогда и никому не рассказывали о том, что увидели там.#!" 

 building_type_01_bonesoftheworldeater: "Кости [Concept( 'the_worldeater', 'Пожирателя Миров' )|E]"
 building_type_01_bonesoftheworldeater_desc: "Здесь лежит [Concept( 'the_worldeater', 'Пожиратель Миров' )|E], Царь Царей!\n\nВзгляни на его воющий сон и отчайся! Песок струится из пустых глазниц, песчаные жуки снуют между зазубренных зубов!\n\nРехидия снискала славу, сразив этот могучий оплот древнего отчаяния, но на чьи кости ты смотришь теперь?\n\nВ смерти Пожиратель Миров спит, но именно в истории он продолжает жить. Вечно могущественный. Вечный в своем ужасе. Ожидающий зверя, что завершит его затронутый Пустотой труд и пожрёт мир заново — ибо не Пожиратель Миров уничтожил Саррадон, а глупые люди, посчитавшие, что врата к гробнице истории принадлежат им."

 building_type_01_buraiwf_pass: "Перевал Бурайв"
 building_type_01_buraiwf_pass_desc: "Перевал Бурайв — главный южный перевал между Зуалфи и востоком, а также один из трёх путей, связывающих запад и восток.\n\nСильно укреплённый и населённый туземцами, которые предпочли бы, чтобы армии и странные иностранные торговцы перестали топтать их земли, он обычно избегается крупными группами путешественников, когда есть возможность пройти по столичному северному побережью. Многие небольшие армии устраивали здесь великую оборону на протяжении истории, и многие из этих защитников были вскоре вырезаны местными жителями, поджидавшими в засаде победителей этих героических сражений."

 building_type_01_bronzeport: "Бронзовый порт"
 building_type_01_bronzeport_desc: "Воздвигнутая поверх древнего поселения катунскими торговцами в IX веке, обнесённая стенами цитадель Бронзового порта долгое время была сердцем катунского присутствия (и предполагаемой власти) в Дахангоне.\n\nПолучившая своё название благодаря великолепным стенам, облицованным [Concept( 'zhaen', 'чжэнем' )|E], эта твердыня вместе с близлежащими крепостями «Когти Дракона» образовала почти неприступный центр торговли и коммерции. Бастион также является домом для [Concept('bureau_bronzeport','Бюро Бронзового порта')|E], а в его гаванях можно найти практически любой товар со всего [Concept( 'aeras', 'Эраса' )|E]."

 building_type_01_dilapamal_mines: "Шахтёрское поселение Дилапамал"
 building_type_02_dilapamal_mines: "Шахты Дилапамала"
 building_type_03_dilapamal_mines: "Крупные шахты Дилапамала"
 building_type_04_dilapamal_mines: "Горнодобывающий комплекс Дилапамал"

 building_type_01_dilapamal_mines_desc: "Славящиеся своими богатыми минеральными ресурсами ещё с древних времён, северные берега реки Калингьян служат домом для множества аллювиальных месторождений олова. Народ банвагул метко назвал этот регион Дилапамал, что означает «где можно найти олово», и почти всё бронзовое оружие и артефакты в Дахангоне выкованы из олова, добытого в этих шахтах. Поколения царей и правителей жаждали обладать этим прибыльным краем, и богатства этих копей финансировали расцвет и падение нескольких королевств."

 building_type_01_calmensons_crest: "Гребень Кальменсона"
 building_type_01_calmensons_crest_desc: ""

 building_type_01_candamarun_academy: "Академия Кандамарун"
 building_type_01_candamarun_academy_desc: "Академия Кандамарун, полное название — Академия полиарканологии и метеорологических наук Хавоккендра Кандамаруна, представляет собой престижный [Concept('vidvakastilaya','университет и метеостанцию')|E], расположенный на берегу Каширского залива. Первоначально бывшая лишь аванпостом для изучения [Concept('gudugwrat','Бродячего шторма Гудугврат')|E], академическая база моментально обрела известность после открытия [Concept( 'wratcrystals', 'кристаллов врат' )|E].\n\nАстроном, математик и астролог Хавоккендра Кандамарун разработал молниеотвод, защитивший прибрежные города от худших ударов молний и позволивший процветать торговле в Кашириянском заливе. Среди позднейших инноваций числятся термоскоп и Таракша Кава — электрически устойчивый доспех, который сократил потери во время экспедиций вдвое."

 building_type_01_haryaadad_academy: "Академия Харьяадад"
 building_type_01_haryaadad_academy_desc: "Когда-то самая престижная [Concept('vidvakastilaya','обитель знаний')|E] во всей [Concept( 'kashirya', 'Каширии' )|E], Академия #font:RedactedScriptFont ~~~~~~~~~#! специализировалась на арканоптике и сциографии — божественном и мистическом взаимодействии тени и света. Говорят, что системы и правила магии, которые со временем превратились в школу эмпириков, были впервые разработаны её учеными-[Concept( 'magi', 'магами' )|E], и что пятеро из Семьи Мудрых Гуру когда-то ходили по её древним залам.\n\nОднако её слава осталась в далёком прошлом. Ибо вместе с [Concept( 'sabar_lambay_raad', 'Сабар Ламбай Раад' )|E] пришла некончаемая тьма — странное явление, сохранившееся даже после возвращения солнца в Каширию. После [Concept( 'dharya_varha', 'Дхарья Варха' )|E] само название академии было запрещено произносить, и от самого здания не осталось ничего, кроме обугленных руин под бессолнечным небом."
 
 building_type_01_carapace_cove: "Вохюэт"
 building_type_01_carapace_cove_desc: "Вохюэт был создан из окаменелого панциря гигантского рака-отшельника; первоначально в нём обитали мутанде, а позже королевство Шрунфан превратило его в цитадель. Оставленный в руинах после [Concept( 'great_western_march', 'Великого западного похода' )|E], он был заново открыт торговцами киринарт и вновь перестроен в укреплённую гавань.\n\nСпиральные внутренние помещения, где когда-то располагались пышные залы и палаты, теперь служат торговцам в качестве доков и складов."

 building_type_01_carthara_statue: "Статуя Карфары Завоевательницы"
 building_type_01_carthara_statue_desc: "Архилегат Картара «Железнобокая» из Государственного легиона LIV «Особые» увековечена здесь в виде гигантской статуи, прославляющей её завоевание Амагеи. Несмотря на это отличие, архилегата часто ошибочно называют «легат Картарос», а сама статуя даже обладает явно мужским телосложением. Статуя наиболее любима в Амагее, поскольку завоевания Картары ознаменовали начало осознания амагейцами того факта, что они, вообще-то, всё это время были [Concept('aversaria','аверсарианцами')|E]."

 building_type_01_champion_grounds: "Поля Чемпионов"
 building_type_01_champion_grounds_desc: "Поля Чемпионов, или Протошлити, — это великая крепость, возведённая на землях, дарованных сорок второму легиону «Гордость [Concept('aversaria','Аверсарии')|E]» за их выдающиеся заслуги в [Concept('kartharadd','Картараддских')|E] войнах. После ухода с активной службы сорок второй легион взял на себя задачу по подготовке самых измыленных новобранцев Аверсарийских Государственных Легионов. Те, кто прошёл обучение в Протошлити под руководством почитаемых наставников, скорее всего, сами станут чемпионами, и истории многих легендарных героев Аверсарии в рядах Легионов начинались именно в этих стенах.\n\nВсё это подошло к концу во время «Легионного дела» в ходе [imperial_civil_war|E], когда Ааутократир Эшрэс, узнав, что сорок второй легион укрывал беженцев с обеих сторон конфликта, начал систематическую чистку Легионов. Протошлити были взяты штурмом войсками Эшрэса, которые перебили гроссмейстеров и сровняли крепость с землей при помощи [magic|E], оставив после себя лишь горы трупов."

 building_type_01_chrys_lymani: "Хрис Лимани"
 building_type_01_chrys_lymani_desc: "Золотая Гавань стояла у входа в Партарианское море с тех самых пор, как губернатор Партариан организовал первый частный захватнический корпус для покорения территорий [astilik_empire|E]. Изначально это был захолустный порт, который считался лишь форпостом, защищавшим [aversaria|E] на краю света, однако покорение восточных степей превратило Асиуполи из военной крепости в столицу самой восточной провинции Аверсарии.\n\nС ростом торговли по всей Империи, а также со странными народами из-за моря и с далекого востока, Асиуполи вскоре превратился в главный торговый центр Аверсарии, а вместе с ним разрослась и Золотая Гавань. Переименованный из-за огромного количества богатств, стекавшихся в город, порт вскоре стал причиной того, что Асиуполи превратился в неофициальную столицу Империи: двенадцать различных Императоров и покойная Императрица Аксиотея объявляли его своей столицей."

 building_type_02_chrys_lymani: "Восстановленная Золотая Гавань"
 building_type_02_chrys_lymani_desc: "Гавань снова способна принимать торговые суда. Первоначальная реставрация позволила расчистить завалы, подлатать старые причалы и углубить заилённые каналы.\n\nДля купцов Партарианского побережья подъемные краны, возвышающиеся над Асиуполи, имеют значение, выходящее далеко за рамки обычной торговли. Видеть Золотую Гавань восстановленной — значит видеть, что мечта востока жива. Богатства, которые когда-то текли через этот порт, могут хлынуть снова, и тот, кто владеет городом, владеет всем миром."

 building_type_01_citadel_of_almi: "Цитадель Альми"
 building_type_01_citadel_of_almi_desc: "Цитадель Альми — это древний форт, обнаруженный заброшенным и разрушенным [Concept('ritualism','ритуалистским')|E] военачальником Караэ Альми более тысячи лет назад. Раскопав остатки могучих стен и великой цитадели среди великих южных гор, он, согласно легенде, направил всё своё население на восстановление былого величия этого укрепления. Стоя на её вершине в момент завершения этого грандиозного проекта, он громко провозгласил, что создал новый [GetBuilding('01_sophocos').GetName] и что живущие не на небесах наконец-то сравнялись с его славой.\n\nДальнейшие легенды гласят, что Караэ Альми тем самым навлёк проклятие на своё великое творение. Сказания утверждают, что вскоре после этого он заблудился и погиб в её извилистых коридорах и оборонительных сооружениях, и хотя это может быть неправдой, неоспоримо одно: кажется, будто все владельцы крепости кончают далеко не самой славной смертью. Впрочем, несмотря на это, ни один из хозяев не пал в результате внешнего вторжения — укрепления практически неприступны. И даже если они не проклинают своего правителя лично, они уж точно опустошают его казну: почти все, кто не погиб при её удержании, едва не разорились на её содержании."

 building_type_01_conclave_of_raocourt: "Конклав Раокура"
 building_type_01_conclave_of_raocourt_desc: "Конклав Раокура — это центр веры Жизненного Пути. Именно в Конклаве все Путевые Отцы утверждаются в своих ролях, и именно здесь проживают самые мудрые и опытные представители каждого Пути, чтобы лучше углублять понимание каждого Пути и обсуждать богословские вопросы. Только отсюда может быть провозглашён Путевой Святой, и только с согласия Совета Восьми — главного богословского органа в [chevalie|E]. Многие герои [Concept('marchers','марочникской')|E] мифологии входили в его стены, чтобы учиться у величайших мастеров, хотя поступление в Конклав — исключительная редкость."

 building_type_01_crab_ranch: "Каа Биро"
 building_type_01_crab_ranch_desc: "Каа Биро широко распространены в общинах илоходцев в качестве временных жилищ для их веретеноногих крабов. Эти ранчо часто разбирают и собирают заново по всему Рогу по мере того, как приливы и отливы сменяют друг друга на побережье."

 building_type_01_creonta_mines: "Соляной рудник Креонта"
 building_type_01_creonta_mines_desc: "С [Concept('aversaria','аверсарийским')|E] завоеванием народа ийросси важная роль соли была открыта уже давно. Но для обычного современного аверсарийца соль стала чем-то само собой разумеющимся. Озеро в центре сердцевины земель ийросси обеспечивало почти все их потребности в этой солоноводной продукции. Со сменой сезонов воды озера отступали, обнажая многочисленные и богатые соляные пласты. Множество рабов было загнано до смерти на палящем солнце при добыче соляных кристаллов. Ибо аверсарийским хозяевам было всё равно: у них были сроки до конца сезона и график, а жизнь раба оставалась лишь пустой цифрой. Однако в связи с недавней дестабилизацией региона на руднике теперь работают только те, кому за это платят."

 building_type_01_creusons: "Крёзон"
 building_type_01_creusons_desc: "Тигель представляет собой массивную цитадель, служащую узлом для целой серии укреплений, протянувшихся вдоль северной границы между [chevalie|E] и [the_lichdoms|E]. Цитадель была основана совместными усилиями [antimagic_orders|E] в конце [red_river_war|E] и после поражения [Concept('arch_lich','Короля-лича')|E] [silas_stavro|E], когда Ордена поклялись отстраниться от политики марочников после жертвы [champion_of_chevalie|E] и почти полного уничтожения человечества.\n\nС тех пор она всё больше застраивалась местными лордами, а в мирное время — и Верховными Королями Шевалье. Несколько капитулов [antimagi|E] удерживают её в качестве своей столицы, а [antimagic_orders|E] вместе с шевальенскими лордами регулярно отправляют сюда своих рекрутов для обучения и борьбы с постоянными набегами [gh_general_undead|E]. Говорят, именно там настоящий воин может снискать себе имя — будь то во время празднеств в суровых залах после победы или среди имён, высеченных на замковых стенах вместе с тысячами других павших героев."

 building_type_01_crow_gate: "Врата Воронов"
 building_type_01_crow_gate_desc: "Врата Воронов служат восточными воротами в некогда могучую столицу Дедерак. Хотя стена лежит в руинах, а со статуй воронов, когда-то украшавших её, давно сорваны рубины и электрум, они всё ещё остаются мощным оборонительным рубежом израненной войной цитадели. Говорят, что Врата Воронов пали лишь единожды за всё время своего существования, когда мудрый [magi|E] Хукахатут растворил первозданную дверь и ворвался в цитадель, чтобы найти врата в небеса, но лишь канул в преисподнюю."

 building_type_01_dalath_analoth: "Далат Аналот"
 building_type_01_dalath_analoth_desc: "Расположенный в канийском мегаполисе ЭЛОИ-Лашем, Далат Аналот является крупнейшим храмом, возведённым в честь Элои, и религиозным центром всей шехарддской веры. Этот храм имеет честь и привилегию охранять Атунет Ках — запечатанный сосуд, защищающий, согласно шехарддскому вероучению, последние заповеди, преподанные Элои человечеству.\n\nХрам был построен в 430 году на руинах древнего кемсарского сооружения, в результате чего сочетает в себе черты как канийской, так и кемсарской архитектуры. Храм служит резиденцией высшего шехарддского духовенства, и в его мраморных залах под витражными окнами обсуждаются вопросы духовного и философского характера."

 building_type_01_dawang_tarmak: "Даванг Тармак"
 building_type_01_dawang_tarmak_desc: "Буквально означающий «Золотая Цитадель», Даванг Тармак — это легендарный дворец [naklan_the_golden|E]. Его позолоченные стены и пышные покои долгое время служили ярким символом власти и могущества для любого, кто им владел, и амбициозные военачальники часто захватывали его в качестве своего центра силы.\n\nОднако цитадель получила серьёзные повреждения в результате [ratarakaw|E], когда землетрясения превратили это сооружение в золотую гробницу для претендента на власть, занимавшего её."

 building_type_02_dawang_tarmak: "Даванг Тармак"
 building_type_02_dawang_tarmak_desc: "Буквально означающий «Золотая Цитадель», Даванг Тармак — это легендарный дворец [naklan_the_golden|E]. Его позолоченные стены и пышные покои долгое время служили ярким символом власти и могущества для любого, кто им владел, и амбициозные военачальники часто захватывали его в качестве своего центра силы.\n\nНыне восстановленный во всём своём былом величии, Даванг Тармак вновь служит сияющим маяком процветания и могущества."

 building_type_01_dederak: "Дедерак"
 building_type_01_dederak_desc: "Дедерак, или «Цитадель Богов», когда-то был великой столицей Империи Хемет под властью ран кемсарцев. Тысячи статуй, цитаделей и гробниц сверкали золотом, пока вода изливалась из фонтанов, великих каналов и акведуков. Тем не менее, после Битвы Разорванной Цепи и последующего голода по всему Хемету столица была брошена на увядание, пока мир ран кемсарцев погружался в анархию.\n\nОднако после сотен лет упадка столица была восстановлена. Кланы падальщиков наконец-то уничтожены или приведены к повиновению, многие памятники и здания отреставрированы, и люди снова выходят на улицы, чтобы участвовать в жизни возрождённого города. Хотя столица уже никогда не станет прежней, её жители могут хотя бы снова вспомнить, какой она когда-то была."

 building_type_01_dederak_ruin: "Мёртвый город"
 building_type_01_dederak_ruin_desc: "Дедерак, или «Цитадель Богов», когда-то был великой столицей Империи ран кемсарцев. Тысячи статуй, цитаделей и гробниц сверкали золотом, пока вода изливалась из фонтанов, великих каналов и акведуков. Тем не менее, после Битвы Разорванной Цепи и последующего голода по всему Хемету столица была брошена на увядание, пока мир Ран Кемсари погружался в анархию.\n\nДаже когда в город возвращается подобие власти, он остаётся переполнен падальщиками, грабителями, бандитскими кланами и древними магическими созданиями и питомцами, давно одичавшими."

 building_type_01_degasho_bedelam: "Дегашо Бедедам"
 building_type_01_degasho_bedelam_desc: "Впервые построенный самонадеянным местным дворянином в 426 году И. С. при [Concept('boqqarut_damotada','Боккаруте')|E] и использовавшийся как личный дворец чередой мелких аристократов, резиденция в ходе политических торгов во время Первого [tetenik|E] перешла в руки Боккаров. Она была переоборудована для использования правителями Дамоты во время их поездок по стране.\n\nВ результате веков расширений за счёт невероятных богатств она стала известна как самая роскошная резиденция в Дамоте — репутация, пережившая даже падение Боккарута. За века, прошедшие с момента [etami_tetenik|E], она несколько пришла в упадок, но расточительные расходы самых разных военачальников, мелких королей и самопровозглашённых Боккаров, занимавших её, позволили в основном сохранить её славу, и она остаётся помпезным памятником богатству и роскоши."

 building_type_01_mechanical_city: "Руины Дравнок Шталь"
 building_type_01_mechanical_city_desc: "Дравнок Шталь, когда-то гудящий исполин из стали и пара, был выкован неизвестной рукой в эпоху железных амбиций. Его возвышающиеся шпили из чернённого металла и скрежещущие шестерни простирались до самого горизонта — чудесный непрекращающийся механизм, работавший день и ночь. Однако катаклизм — будь то война, предательство или угасание его расплавленного сердца — заставил его двигатели умолкнуть, оставив лишь пустую оболочку среди пустошей, с чей целью, затерянной во времени.\n\nТеперь руины стоят как изувеченное кладбище ржавчины и развалин, населённое лишь кланами падальщиков да одичавшими конструктами, снующими в его тёмных глубинах. Сломанные поршни лежат, подобно поверженным гигантам, а ветер воет в разбитых трубах, разнося эхо некогда неостановимой силы. Земля вокруг съёжилась, изуродованная древним голодом города, и люди шепчутся о проклятой стали и призраках его создателей."

 building_type_02_mechanical_city: "Дравнок Жерн"
 building_type_02_mechanical_city_desc: "Дравнок Шталь в свои лучшие времена был титаном из железа и огня, а его кузницы ревели с яростью, сотрясавшей землю. Возведённый чуждой волей, его лабиринты шестерёнок и раскалённые жилы питали ненасытного владыку машин, чьё имя давно забыто. Когда его огни угасли после веков господства, он превратился в разрушающуюся реликвию, его былые могучие двигатели забились пеплом и тишиной — пока искра жизни не затеплилась вновь.\n\nДравнок Жерн восстаёт из пепла, и его ржавое сердце, заикаясь, снова приходит в движение. Падальщики и изгои были изгнаны или порабощены, а их руки заставлены вновь разжечь тлеющие кузницы. Чёрный дым клубится из восстановленных труб, и стон просыпающихся механизмов рокочет по улицам. Это лишь тень его прежнего «я», но обещание его механической мощи снова начинает внушать страх окружающим землям."

 building_type_03_mechanical_city: "Штальвор Краг"
 building_type_03_mechanical_city_desc: "Дравнок Шталь когда-то был бьющимся стальным сердцем империи, построенной на шестерёнках и завоеваниях, а его поршни и прессы выковывали наследие господства. Возведённый цивилизацией, затерянной в истории, его высочайшие печи и неустанные механизмы пожирали ресурсы и жизни, ставя памятник эффективности и террору. Когда его создатели исчезли — из-за восстания или краха, — город погрузился в спящий упадок, его механизмы остановились среди эха его собственного разрушения.\n\nНыне перерождённый как Штальвор Краг, город наполняется новой силой, его стальные жилы пульсируют расплавленным огнём. Кланов падальщиков больше нет, их сменили толпы рабочих и надсмотрщиков, трудящихся под вращающимися колёсами. Восстановленные каналы гудят от энергии, а воздух сгущается от сажи, пока ненасытный аппетит города пробуждается. Он стоит как крепость механической ярости, а его присутствие становится язвой на земле, шепча обещания порабощения всем, кто приблизится."

 building_type_04_mechanical_city: "Дравнок Шталь"
 building_type_04_mechanical_city_desc: "Дравнок Шталь был выкован в эпоху железа и теней — механический бегемот, созданный сгинувшей расой, чьи амбиции не знали границ. Его шпили из чернённой стали и реки расплавленного шлака когда-то питали бесконечный цикл созидания и разрушения, а его двигатели ревели голосом, заглушавшим крики порабощённых. Когда его создатели пали — сгорев, возможно, в огне собственного высокомерия, — город остался стоять как молчаливый титан с застывшими шестернями и холодными печами, реликт кошмарного прошлого.\n\nСегодня Дравнок Шталь снова воцарился во всей своей полноте мощи, восстановленный в симфонии лязгающей стали и палящего пламени. Каждая шестерёнка вращается, каждый поршень разит, и город двигается как живой организм, его улицы полны гула машин и труда тех, кто подчинён его воле. Земля дрожит под его тяжестью, а небо темнеет от его дыхания. Это не просто город, но живое изваяние из железа, чья цель непостижима, а голод вечен."

 building_type_01_ash_gate: "Врата Пепла"
 building_type_01_ash_gate_desc: "Врата Пепла возвышаются как восточный портал к механическим просторам Дравнок Шталя. Когда-то бывшие ревущей пастью из выхлопов и пламени, их чернённые стальные арки теперь забиты сажей и руинами, а скелетные остатки труб и вентиляций лишились бытраго величия. И всё же они стоят как мрачный оплот среди упадка города, их ржавый каркас — свидетельство забытой силы. Легенды шепчут, что они пали лишь однажды, когда отступник-артифактор взломал их печати в поисках запретных двигателей, чтобы лишь сгинуть в расплавленных глубинах города."

 building_type_02_ash_gate: "Врата Пепла"
 building_type_02_ash_gate_desc: "Восстановленные Врата Пепла вновь возвышаются как могучий страж восточного фланга Дравнок Шталя. Их стальные жилы пульсируют вновь зажжённым огнём, а воздух вокруг мерцает от зноя и пепла — мрачное обещание возрождённого гнева города. Хотя они не могут вернуть себе палящее великолепие древних дней, эти врата стоят как несокрушимый барьер, гарантирующий, что механическое сердце внутри больше никогда не умолкнет."

 building_02_ash_gate: "Врата Пепла"
 building_02_ash_gate_desc: "Восстановленные Врата Пепла вновь возвышаются как могучий страж восточного фланга Дравнок Шталя. Их стальные жилы пульсируют вновь зажжённым огнём, а воздух вокруг мерцает от зноя и пепла — мрачное обещание возрождённого гнева города. Хотя они не могут вернуть себе палящее великолепие древних дней, эти врата стоят как несокрушимый барьер, гарантирующий, что механическое сердце внутри больше никогда не умолкнет."

 building_type_01_progress_gate: "Врата Прогресса"
 building_type_01_progress_gate_desc: "Врата Прогресса охраняют северные рубежи Дравнок Шталя — реликт его неустанного стремления к механическому совершенству. Когда-то украшенная гудящими поршнями и сверкающими шестернями, эта конструкция ныне лежит в разрухе, её шестерни заклинило, а каркас изъеден временем. И всё же они держатся как израненный оплот среди городских руин, их защита не была пробита, за исключением одной истории: о прозорливом механике, прорвавшемся через затворы в поисках тайн вечного движения, только чтобы быть раздавленным тяжестью собственных амбиций."

 building_type_02_progress_gate: "Врата Прогресса"
 building_type_02_progress_gate_desc: "Перестроенные Врата Прогресса стоят как памятник непреклонной воле Дравнок Шталя, их северный фасад вновь ожил от гула восстановленных механизмов. Шестерни снова вращаются, а укреплённая сталь блестит холодной целеустремлённостью — далеко от прежней славы, но всё же грозный щит. Эти врата гарантируют, что марш города к господству продолжается неудержимо, не сломленный неудачами прошлого."

 building_02_progress_gate: "Врата Прогресса"
 building_02_progress_gate_desc: "Перестроенные Врата Прогресса стоят как памятник непреклонной воле Дравнок Шталя, их северный фасад вновь ожил от гула восстановленных механизмов. Шестерни снова вращаются, а укреплённая сталь блестит холодной целеустремлённостью — далеко от прежней славы, но всё же грозный щит. Эти врата гарантируют, что марш города к господству продолжается неудержимо, не сломленный неудачами прошлого."

 building_type_01_industry_gate: "Врата Промышленности"
 building_type_01_industry_gate_desc: "Врата Промышленности удерживают западную границу Дравнок Шталя — некогда могучий порог грохочущих молотов и расплавленных рек. Их величественная рама, ныне ставшая остовом из разъеденной стали и разрушенных кузниц, несёт на себе шрамы долгого молчания, но всё ещё остаётся ключевым бастионом в расколотой оболочке города. Говорят, что они пали лишь однажды, когда безумный кузнец пробил их двери, чтобы захватить расплавленное ядро города, но был поглощён печью, которой стремился повелевать."

 building_type_02_industry_gate: "Врата Промышленности"
 building_type_02_industry_gate_desc: "Возрождённые Врата Промышленности возвышаются над западным краем Дравнок Шталя, их кузницы вновь оживают с оглушительным лязгом. Стальные балки снова сияют, а реки шлака текут под их арками — лишь тень былого величия, но неустанный страж. Эти врата стоят как несокрушимый хребет промышленной мощи города, гарантируя, что его двигатели завоеваний больше никогда не заглохнут."

 building_02_industry_gate: "Врата Промышленности"
 building_02_industry_gate_desc: "Возрождённые Врата Промышленности возвышаются над западным краем Дравнок Шталя, их кузницы вновь оживают с оглушительным лязгом. Стальные балки снова сияют, а реки шлака текут под их арками — лишь тень былого величия, но неустанный страж. Эти врата стоят как несокрушимый хребет промышленной мощи города, гарантируя, что его двигатели завоеваний больше никогда не заглохнут."

 building_type_01_tarfal_garden: "Сад Тарфала"
 building_type_01_tarfal_garden_desc: "Глубоко в густых джунглях Беронг Наттана находится место глубокой магии и истории — великолепный сад, где собраны, кажется, абсолютно все организмы, живущие в совершенном балансе. Молитвы Наттана гласят, что садовник Тарфал посадил его, пока охотник Йернейм вёл верных туда после искушения злого Корлаку. Именно здесь Близнецы-Боги обучили и повелели человечеству жить в гармонии с природой и защищать джунгли от всех глупых последователей Корлаку.\n\nМагические посохи поют из местных деревьев Комихоу, что позволяет рьяным жрецам-[magi|E] проводить великие ритуалы во исполнение их божественного завета. Заклятие, наложенное на сад, гарантирует, что обитатели не смогут нарушить законы Богов-Близнецов. Те, кто сеет раздор, насильно изгоняются, а любые рукотворные сооружения вскоре зарастают и уничтожаются самими джунглями."

 building_type_01_burning_palace: "Горящий Дворец"
 building_type_01_burning_palace_desc: "Сад Тарфала когда-то был местом глубокой магии, а ныне стал дворцом Корлаку, вечно пылающим как место поклонения священному пламени."

 building_type_01_ruins_of_korlacu: "Храм Корлаку"
 building_type_01_ruins_of_korlacu_desc: "Наттанам, возможно, и удалось превратить этот храм в руины, но пророчества ясны. Приносящий Огонь снова восстанет на востоке, его великий храм будет восстановлен во всём своём былом величии, а его враги сгинут в пламени."

 building_type_01_temple_of_korlacu: "Огненный храм Корлаку"
 building_type_01_temple_of_korlacu_desc: "Священное Пламя воссияет вновь."

 building_type_dergi_garden_01: "Сад дергов"
 building_type_dergi_garden_01_desc: "Сады дергов — это демонстрация мира с естественным миром, восхваляющая его силу и одновременно укрепляющая положение владельца как его хранителя, пока природа не превзойдёт их искусственную красоту."

 building_type_01_dielecport: "Дилекпорт"
 building_type_01_dielecport_desc: "Дилекпорт когда-то был самым важным портом конейкменеров за пределами их родины. Будучи домом для Досточтимой Королевской Торговой Хартии Оранжевого Совета и Путевых Святых Монет [EITNTKFAO_BTWPAIF|E], одной из самых богатых торговых компаний в [aversaria|E], Дилекпорт стал основным портом, через который фильтровалась большая часть торговли с юга в сторону материковой части Шевалье, а Досточтимая Королевская Торговая Хартия сохраняла почти эксклюзивное право на импорт из Аверсарии на протяжении большей части своего существования.\n\nС крахом торговой империи конейкменеров во время Фродброкны Дилекпорт в значительной степени пришёл в упадок, что особенно ознаменовалось закрытием некогда могущественной Досточтимой Королевской Торговой Хартии. Оставаясь важным портом, многие из его кварталов тем не менее за эти годы пришли в запустение."

 building_type_01_dihasma_xiidan: "Дихасма Ксиидан"
 building_type_01_dihasma_xiidan_desc: "Возникнув как лагерь для местного гарнизона, которому было поручено защищать тех, кто осваивал лесные расчистки на севере, Гарнизонный центр со временем вырос и стал самым престижным учебным центром [Concept('boqqarut_damotada','Боккарута')|E], где небольшая группа профессиональных солдат годами обучалась искусству насилия. Этим элитам затем предстояло рассредоточиться по многочисленным сторожевым постам и лагерям Боккарута, где им поручалось вести за собой и обучать тех, кто поступал под их командование. Хотя эта программа никогда не была достаточно масштабной, чтобы создать то, что можно было бы назвать подлинно профессиональной армией, она тем не менее приносит свои плоды, а репутация её выпускников сохранилась сквозь века."

 building_type_01_drakavil: "Дракавиль"
 building_type_01_drakavil_desc: "Дракавиль, или «[Concept('dragons','Драконий')|E] Двор» на [Concept('aversaria','аверсарийском')|E], — это легендарная гробница последних аверсарийских [dragons|E]. Сказания гласят, что драконы были первыми существами, с которыми столкнулись Первые Люди, и провозгласили себя Чистейшими при виде первых человеческих существ. Они похитили дар магии у человека, и в ответ на их провокации Первые Люди приручили и поработили драконов, используя их в битвах, пока наконец не истребили последних свободных особей и не уничтожили всё их стадо.\n\nИстинно ли это сказание или нет, Дракавиль остаётся на своём месте, заполненный костями легендарных созданий. В течение тысячи лет после этого гробница оставалась под присмотром Красной Гвардии, которая следит за тем, чтобы драконы покоились в своём смертном сне. И, к счастью, они наверняка останутся там под неусыпным взором, гарантируя, что никто не станет вмешиваться в то, чему лучше оставаться мёртвым. Вполне вероятно."

 building_type_00_easterncabal: "Алькаба Альмади"
 building_type_00_easterncabal_desc: "Алькаба Альмади когда-то была резиденцией власти могущественного кабала [magi|E] Альмади. Влиятельное и милитаризованное братство Альмади в своих постоянных попытках переоткрыть [Concept('magic','магические')|E] секреты, чтобы переломить ход противостояния с [Concept('ritualism','ритуалистами')|E], пришло к открытию запретных тайн [selfreplicating_blood_magic|E] — примерно в то же время, что и кабал магов-ритуалистов Курати.\n\nОстальная часть истории хорошо известна в [sarradon|E]: оба кабала быстро потеряли контроль над заклинанием, что привело к гибели почти всех магов Саррадона и значительной части населения. «Золотой век саррадонской магии» с тех пор стал именоваться «Веком Огня». Иронично, но именно из руин Алькабы Альмади [Concept('aversaria','аверсарийские')|E] археологи впоследствии заново откопают это заклинание, обрекая воюющих претендентов Аверсарии повторить ошибку Альмади и Курати."

 building_type_01_easterntower: "Восточная Башня"
 building_type_01_easterntower_desc: "Восточная Башня — одна из многих [Concept('the_towers','Башен')|E], усыпавших этот мир, представляющая собой чрезвычайно мощное место магии, которое, кажется, убивает любого, кто осмелится подойти слишком близко.\n\nВозведённая на острове Амбракия, эта Башня остаётся самой восточной из своего рода, когда-либо находившихся под прямым контролем [Concept('aversaria','аверсарийцев')|E], которые потратили несколько веков и тысячи жизней (в основном рабов, но иногда и безрассудных [magi|E]), пытаясь найти способ обойти её защиту."

 building_type_01_elysian_pass: "Элизейский перевал"
 building_type_01_elysian_pass_desc: "Элизейский перевал — ничем не примечательный переход между деревней Ильтия на востоке и крепостью Тамасатро на западе, в нескольких лигах к западу от основных путей, ведущих на юг Империи. Дорога была проложена в V веке и с тех пор почти не развивалась, служа лишь местным жителям, солдатам, перемещавшимся между имперскими фортами, и купцам, обходившим главное шоссе по тем или иным причинам.\n\nИменно здесь Разрушитель Ведьм встретил 26 [Concept('aversaria','аверсарийских')|E] легионов, а также тысячи вспомогательных войск из Аверсарии и из-за рубежа, что стало самым крупным скоплением аверсарийских солдат на памяти живущих и первым знаком имперского единства против сьяльволков с начала [Concept('sjalvolki_migration','Великого переселения')|E]. И именно отсюда лишь четыре легиона смогли уползти обратно — большинство солдат, отправленных на север, так и не вернулись, а армия сьяльволков осталась практически нетронутой.\n\nПутешественники обычно избегают этих мест, считая их проклятыми или опасаясь, что использование сьяльволками [Concept('mixed_magic','магии тумана')|E] могло отравить землю. Те же, кто всё-таки проходит здесь, обычно считают отсутствие чего-либо примечательного самой примечательной чертой этой местности, хотя доспехи, оружие и кости до сих пор усеивают округу."

 building_type_01_epidaphos_mines: "Железные рудники Эпидафоса"
 building_type_01_epidaphos_mines_desc: "Хотя золото обычно ассоциируется с Опахасией, куда менее гламурный железо Эпидафоса оставалось основным минеральным экспортом провинции на протяжении последних нескольких веков. Построенный в огромной гряде полосчатых утесов, этот комплекс действовал по меньшей мере со времён Храма Горного Солнца и служил для него главным источником железа. Хотя его значение существенно померкло с завоеванием Калатипсоми и его собственными минеральными богатствами, надежные старые рудники вновь вызвали интерес, когда золотые месторождения Панапетры на востоке иссякли, а Опахасия оказалась в отчаянной нужде в любом источнике дохода, блестящем или нет."

 building_type_01_eponthos_mines: "Нефритавый рудник Эпонтоса"
 building_type_01_eponthos_mines_desc: "Когда-то известный лишь благодаря редким купцам из Катун-Кая, отваживавшимся на грандиозное путешествие на запад ради продажи своего товара, и соответственно невероятно дорогой, нефрит был одним из самых ценных минералов на всём [Concept('aversaria','Разрушенном Берегу')|E], приобретаемым только самыми могущественными и успешными дворянами. Неудивительно, что когда камень был обнаружен здесь, вскоре вспыхнула одна из величайших горнодобывающих лихорадок в истории Аверсарии, и неподалёку постепенно вырос город Рея. За прошедшие века аверсарийские ремесленники довели искусство резьбы по нефриту практически до такого же совершенства, как и их собратья на Дальнем Востоке. В значительной степени уцелевшие во время худших сражений [imperial_civil_war|E], рудник и прилегающее к нему поселение продолжают работать и по сей день, как правило, к выгоде любого местного военачальника, контролирующего этот объект в данный момент."

 building_type_01_eternal_grove: "Вечная Роща"

 building_type_01_firstshard: "Первое падение [Concept('aervalr','Эрвала')|E]"
 building_type_01_firstshard_desc: "Когда Эшрэс применил своё главное оружие, никто не мог предугадать, какие немыслимые разрушения и последствия оно принесёт. Когда жившие на [Concept( 'aeras', 'Эрасе' )|E] в тот день подняли взоры к небу, тёмный небосвод обрушил на них огненный дождь, и до людей наконец дошёл весь ужас их участи. А участь была неизбежна: первый и самый крупный обломок некогда цельной луны рухнул на земли Мегос Калатипсоми, стирая в пыль всё под собой. Впервые [Concept( 'aervalr', 'Эрвал' )|E] коснулся Эраса, породив колоссальную ударную волну, которая разрывала барабанные перепонки каждому, кто оказался достаточно близко, чтобы увидеть падение осколка. Лишь благодаря невероятной удаче или божественному вмешательству кратер образовался в необитаемой местности, а не превратил в прах такой мегаполис, как Ораисполь."

 building_type_01_fort_ranos: "Форт Ранос"
 building_type_01_fort_ranos_desc: "Форт Ранос — крайняя северная точка, где сохранилась жизнь к северу от [Concept( 'chevalie', 'Шевалье' )|E], по крайней мере из известных обитателям юга. Мрачное пристанище искателей приключений, изгоев и охотников за сокровищами, этот форт уединённо возвышается на холме среди бесконечных бесплодных земель. Форт регулярно сжигает дотла [Concept( 'gh_general_undead', 'нежить' )|E], однако его неизменно заселяют вновь. Местные жители проводят дни либо в отчаянных попытках выжить благодаря скудному фермерству с помощью наёмных [Concept( 'magi', 'магов' )|E], либо в осаде местных [Concept( 'liches', 'личей' )|E]. Поговаривают, будто личи позволяют вновь заселять форт лишь для того, чтобы обеспечивать себе постоянный приток новых подопытных.\n\nКроме того, форт стал последним известным местом, где видели пропавшего Верховного короля Гардфрея — он ненадолго останавливался здесь со своей свитой для пополнения припасов к изумлению изнурённых жителей, после чего исчез на севере."

 building_type_01_fortenorn: "Фортенорны"
 building_type_01_fortenorn_desc: "«Чёрные форты» — так [Concept( 'marchers', 'марочники' )|E] прозвали масштабную сеть укреплений вдоль границы с [Concept( 'the_lichdoms', 'Личествами' )|E]. Названные в честь чёрной, мёртвой почвы северного края, эти форты представляют собой не единое сооружение, а сотни часто переплетённых между собой фортификационных комплексов, растянувшихся почти по всему северу [Concept( 'chevalie', 'Шевалье' )|E]. Линии траншей, форты, опорные пункты, осадные укрепления, рвы, гарнизоны, зоны сплошного огня, минные поля и капитулы десятков малых и великих [Concept( 'antimagic_orders', 'антимагических орденов' )|E] — всё это образует Чёрные форты. Из этих укреплений марочники целыми поколениями сдерживают нескончаемые волны [Concept( 'gh_general_undead', 'нежити' )|E]."

 building_type_02_fortenorn: "Укреплённые фортенорны"
 building_type_02_fortenorn_desc: "Поколения крови и золота [Concept( 'marchers', 'марочников' )|E] были вложены в усиление этой цепи Чёрных фортов. Новые осадные башни для контрбатарейной стрельбы, более глубокие рвы, засыпанные талисманами, и укреплённые стены, способные выдержать прямой штурм, теперь тянутся вдоль этого участка границы. Если старые фортенорны были лишь линией отчаяния, то Укреплённые Чёрные форты стали настоящей зоной уничтожения, призванной дорого обойтись любому [Concept( 'arch_lich', 'архиличу' )|E]."

 building_type_03_fortenorn: "Восстановленные Чёрные форты"
 building_type_03_fortenorn_desc: "Поколения организованных усилий и единая воля [Concept( 'chevalie', 'Шевалье' )|E] превратили взаимосвязанные Чёрные форты в один из самых могущественных оборонительных комплексов на [Concept( 'aeras', 'Эрасе' )|E]. Великие форты венчают каждый холм, соединительные стены перекрывают каждую долину, а лучшие [Concept( 'antimagic_orders', 'антимагические ордена' )|E] страны занимают свои капитулы. [Concept( 'the_lichdoms', 'Личества' )|E] долго смотрели на эти земли с голодом; теперь они вспомнят, что такое голод."

 building_type_01_fortifications_muisle: "Укрепления Мюиля"
 building_type_01_fortifications_muisle_desc: "Изначально неприметная деревенька в восточном Роре, Мюиль стала местом, где [Concept( 'aversaria', 'аверсарианцы' )|E] были отброшены назад после внезапного появления партийских сил в последние дни [Concept( 'ash_war', 'Пепельной войны' )|E]. Обе армии оказались в тупике и спешно возвели обширную сеть траншей, брустверов и осадных замков — задачу упростило ослабленное Антимагическое поле в этой местности. Последняя атака [Concept( 'marchers', 'шевальенцев' )|E] и последующее предательство партийцев привели к обрушению нескольких фортов, однако даже в руинах они остаются удобно удерживаемой господствующей высотой."

 building_type_01_four_cliffs_five_walls: "Великие оборонительные сооружения Халкамахоса"
 building_type_01_four_cliffs_five_walls_desc: "Город Халкамахос, или Халкама для [Concept( 'wardenism', 'варденитов' )|E], возведён поверх массивной серии земляных валов неизвестного происхождения, расположенных друг над другом четырьмя концентрическими кольцами. Общая площадь этой странной горы составляет около пятнадцати километров в диаметре, причем высота каждого уступа ровно пять метров. Что ещё страннее, на вершине бьют три весьма обильных источника, которые продолжают течь даже во время засухи — результат древней и могущественной магии, чьё происхождение так же загадочно, как и эти явно рукотворные скалы. Как бы то ни было, эти факторы в сочетании с плодородной землёй, на которой расположен город, превратили его в настоящий сад, защищённый от вражеских армий внушительными природными укреплениями."

 building_type_01_frozentower: "Замёрзший шпиль"
 building_type_01_frozentower_desc: "Острая и потрескавшаяся башня возвышается в центре свирепой метели, укрывающей этот остров уже тысячи лет. Изрезанные скалы и бурные воды, окружающие остров, затрудняют подход, а суровые пронизывающие ветры делают долгое выживание на суше почти невозможным. Никто не знает, откуда взялся этот шторм и почему он так и не утихает."

 building_type_01_frozenvillage: "Замёрзшая деревня"
 building_type_01_frozenvillage_desc: "Несмотря на то что она расположена в краю вечной зимы на берегу ледяного озера, эта деревня словно застыла во времени. Лишь немногие искатели приключений видела её мельком, так как наблюдения происходили только во время сильных метелей, заставлявших даже самых храбрых повернуть назад. [Concept( 'the_fog', 'Туман' )|E] лишь усложнил дальнейшие попытки, хотя знаменитый путешественник Трекаэль ден ва Сюрклаз утверждал, что Туман рассеивается прямо у границы деревни. Жилища принадлежат давно ушедшей эпохе: покрытые снегом соломенные хижины окружают низкую круглую ледяную платформу. Многие ученые Шевалье считали существование этой деревни в лучшем случае сомнительным, но это не помешало начинающим поэтам писать сказки о весёлом городке снеговиков на севере."

 building_type_01_gardens_of_de_illiterat: "Водные сады Де Иллитерата"
 building_type_01_gardens_of_de_illiterat_desc: "Опираясь на вековые привилегии и престиж древней крови, знатнейшие дома Де Иллитерата привыкли демонстрировать своё богатство и властность жителям [Concept( 'shatteredisles', 'Островов' )|E]. Однако ни одно из их владений или пышных титулов не считается столь престижным, как роскошные водные сады Де Иллитерата — центральное украшение многих поместий и дворцов, покрывающих сельскую местность островов. Колоссальным трудом в скалистом лике острова были высечены реки и озёра, окружённые мощёными дорожками и пышными парками с ввезёнными извне флорой и фауной, за которыми ухаживает многочисленная слуга местной знати."

 building_type_01_gehazetower: "Озеро Гехазе"
 building_type_01_gehazetower_desc: "Расположенное глубоко в манграх Роджихлата, Гехазе — это запустелое место среди пышного и густого края. Яркие мангровые заросли, характерные для этого региона, здесь бледные и мёртвые, а любое животное, испившее воды из озера, погибает мучительной смертью. Туземцы говорят, что здешние воды обладают высокой магической силой и могут использоваться как основа для зелий, хотя мало кто был достаточно храбр, чтобы проверить это.\n\nОпасность озера исходит от великой [Concept( 'the_towers', 'Башни' )|E] в его центре. Известная местным как Ралкшоарх, она, как и другие её сородичи, окружена смертоносным магическим полем, способным убить всё живое вокруг. Кроме того, у неё есть уникальная особенность — брешь с восточной стороны, из которой вытекает студенистое вещество глубокого фиолетового цвета, отравляющее воды озера. Некоторые [Concept( 'magi', 'маги' )|E] пытались исследовать пролом с помощью заклинаний дальновидения, однако эти попытки неизменно заканчивались катастрофой: голосовые связки мага рвались, когда он начинал говорить на забытом языке, после чего он захлёбывался собственной кровью, пока его спутники бились в корчах на земле, изрыгая странную фиолетовую субстанцию, похожую на ту, что течёт из башни. Исследования вещества дают неопределённые результаты, так как с каждым человеком оно реагирует по-разному, вызывая непредсказуемые болезни."

 building_type_01_qasmudha:90 "Касмуда"
 building_type_01_qasmudha_desc:90 "Если верить легенде, Касмуд Просветлённый получил видение об этом дворце во сне, а его великолепие было списано с Дома Ангелов мифического Ирима. Шедевр среднеталитской архитектуры, прекрасная Касмуда служила королевской резиденцией для большинства поздних монархов Королевства Саррадон. Дворец прославился тем, что неоднократно избегал разрушения: сначала во время [Concept( 'the_worldeater', 'Пожирателя Миров' )|E], который опустошил остальную часть Нового Ирима, но чудом оставил дворец нетронутым; а затем во время похода полководца-варденита эпохи [Concept( 'the_downfall', 'Падения' )|E] Эшарика «Пламя Вардена», который жестоко разграбил окружающий город, но растрогался до слёз при мысли об осквернении Касмуды и приказал сохранить её под страхом смерти."

 building_type_01_gisreddeport: "Гизреддепорт"
 building_type_01_gisreddeport_desc: "Гизреддепорт на памяти всех живущих был центром северной торговли и сердцем [Concept( 'marchers', 'шевальенской' )|E] культуры. Великие доки и пирсы из чёрного камня выполнены в чужеродном стиле архитектуры и созданы древними зодчими, неизвестными даже самым ученым мужам. Среди них и вокруг них расположились десятки других сооружений, возведённых за века по мере того, как город Валльгедок рос и расширялся вдоль побережья. По сей день порт укрывает один из крупнейших военно-морских флотов в мире, и каждый день сотни кораблей из [Concept( 'chevalie', 'Шевалье' )|E] и со всего света швартуются у его таинственных пирсов, чтобы вести торговлю и пополнять знаменитые рынки города."

 building_type_01_glowcave: "Пещеры Света"
 building_type_01_glowcave_desc: "В казалось бы ничем не примечательном баронстве Пиасита находится сеть пещер, скрывающая весьма любопытную тайну. Первые исследовательские отряды [Concept( 'aversaria', 'аверсарианцев' )|E], наткнувшиеся на эти туннели, увидели изумительное зрелище: камни пульсировали глубоким синим светом. Шепотки о новой руде или долго скрываемом магическом артефакте быстро распространялись, пока при ближайшем рассмотрении не выяснилось, что скалы покрыты мелкими насекомыми. Теперь местные [Concept( 'aversaria', 'аверсарианские' )|E] исследователи пытаются выяснить, почему эти уникальные насекомые пульсируют в едином ритме, подобно биению сердца. К сожалению, будучи извлечёнными из пещеры, насекомые быстро перестают излучать свет, сморщиваются и погибают, что крайне затрудняет изыскания. Впрочем, это не останавливает некоторых богатых аверсарианцев от попыток купить синих жуков на чёрном рынке — лишь для того, чтобы разочароваться при доставке обычного жука, выкрашенного в синий цвет."

 building_type_01_golgelea_mines: "Серебряные рудники Гольгелеи"
 building_type_01_golgelea_mines_desc: "Расположенные в предгорьях гор Айроной, Серебряные рудники Гольгелеи веками были желанной добычей как для [Concept( 'aversaria', 'аверсарианцев' )|E], так и для вханавидов. В лучшие времена их богатства финансировали помпезную и задающую тренды моду, которая зарождалась и экспортировалась из Восточной Аверсарианской провинции. Они также обеспечивали средства для бесконечных распрей провинции с Опахасией, три из которых официально признаны достаточно серьёзными, чтобы считаться полноценными войнами, несмотря на то что [Glossary('Аавтократия','GH_AAUTOKRATA_GLOSS')] в то время оставалась стабильной. В более поздние времена эти неисчерпаемые богатства стали ключевым фактором, позволившим Аксиотее свести войну с Эшрэсом к ничьей. Рудники всё ещё восстанавливаются после гнева Губителя Миров — считается, что абсолютно все управляющие погибли как во время катастрофы, так и в последовавшие недели хаоса. Тем не менее сохранившиеся богатства Гольгелеи наверняка снова привлекут к себе жадные взоры."

 building_type_01_graveofthemillion: "Могила Миллиона"
 building_type_01_graveofthemillion_desc: "Могила Миллиона — название главного поля битвы в Харад Аль-Сюдаха, или «Кампании Мучеников». Хотя эта кампания охватила большую часть Сихнамии и длилась более ста лет, пережив даже начавшего её генерала-[Concept( 'wardenism', 'варденита' )|E].\n\nНесмотря на размах кампании, по какому-то невероятному и постоянному стечению обстоятельств почти каждое крупное сражение этой войны каким-то образом происходило именно здесь. Каждый раз, когда вардениты подбирались к родовому краю [Concept( 'ritualism', 'ритуалистов' )|E], их отбрасывали сюда. Каждый раз, когда ритуалисты переправлялись на запад, вардениты устраивали им засаду на этом самом месте. К концу кампании обе стороны активно пытались избегать этого региона, но лишь для того, чтобы снова сойтись на той же точке, всё ещё заваленной тысячами павших за век войны.\n\nВ конечном счёте Кампания Мучеников закончилась именно из-за этой локации, и война на несколько десятилетий перенеслась на море. По сей день этого места избегают: духи и ходячие мертвецы, похоже, призываются древней магией и всей тяжестью эмоций, впитавшихся в пески."

 building_type_01_greattempleofelqulatha: "Великий храм Эль-Кулата"
 building_type_01_greattempleofelqulatha_desc: "«Великий храм Эль-Кулата» — это общее название примерно дюжины различных храмов, которые за историю этого места переосвящались или надстраивались один поверх другого. Массивный комплекс возник раньше любой известной религии, даже [Concept( 'ritualism', 'софокоистов' )|E], а его архитектура и конструкция выглядят совершенно [Concept( 'aelfir', 'чужеродными' )|E] даже для величайших инженеров и философов, изучавших его. Все, однако, сходятся во мнении, что гигантское сооружение поразительно красиво — настолько, что некоторые предполагают наличие чар, придающих ему почти гипнотическое очарование...\n\nМенее приятным фактом, чем изящный фасад дозолотой эпохи или прекрасные шелковые ритуалистские гобелены, украшающие западную башню, является то, что лабиринт его сложных подземных комплексов остается практически неисследованным. Не из-за отсутствия попыток, а из-за нехватки искателей приключений, которые действительно возвращаются обратно. По этой причине, какая бы вера ни царила в храме, катакомбы почти всегда запечатаны наглухо."

 building_type_01_griffon_roost: "Насест грифонов"
 building_type_01_griffon_roost_desc: "Позволяет нанимать [GetMaA('griffon_riders').GetName] как [men_at_arms|E]\n\nСооружение, предназначенное для разведения и дрессировки грифонов."

 building_type_01_gujak_mines: "Бирюзовые копи Гуджака"
 building_type_01_gujak_mines_desc: "Прекрасная бирюза Гуджака украшала дворы Кемсара на протяжении тысячелетий, хотя когда-то её было гораздо труднее добывать из-за расположения рудника на выжженных окраинах мира [Glossary('ран кемсарцев','GH_RAN_KEMSARI_GLOSS')]. С изменением русла великой реки после Битвы у Разорванной Цепи новые поселенцы-амсарцы обнаружили близость процветающих месторождений как приятный сюрприз, и деятельность на руднике бурлила в течение веков после основания Хиклана. Дворцы Чоурана стали почти так же наполнены бирюзой, как и сами копи, а этот минерал превратился в настоящую классику в украшении столицы."

 building_type_01_gurardport: "Гурардпорт"
 building_type_01_gurardport_desc: "Гурардпорт когда-то был Белангрикте Остельик Хавердом, или «Главным Восточным Портом», до Баларенского спора и знаменитого противостояния адмирала Гурарда. Именно в Белангрикте Остельик Хаверде моряки Гурарда вырыли великий ров для своих кораблей, создав импровизированную стену, с которой они месяцами удерживали легионы Тесалиона, пока его Ааутократир не объявил о прекращении огня и не приказал Тесалиону совершить самоубийство.\n\nС тех пор порт носит название Гурардпорт, и хотя присутствие конийкмениров на побережье с годами угасло, Гурардпорт с тех пор остаётся важным центром клановой торговли."

 building_type_01_halls_of_everard: "Великие чертоги Эверарда"
 building_type_01_halls_of_everard_desc: "На вершине древних ступеней, высеченных в склоне горы Авионн, находится вход в Великие чертоги Эверарда — гробницу героя, занимающего центральное место в пантеоне Мотаклотта. Говорят, Эверард любил этот остров больше, чем своё великое королевство, тратя богатства своего царства на грандиозные сооружения по всему острову и продвигая рыцарский кодекс, ныне священный для местной аристократии. Жители Мотаклотта часто называют Эверарда «Последним королём» — этот эпитет отсылает к мифологическому Королевству [Concept( 'shatteredisles', 'Островов' )|E], которым Эверард правил перед его распадом."

 building_type_01_harekana_observatory: "Обсерватория Харекана"
 building_type_01_harekana_observatory_desc: "Обсерватория Сата Реда Гашадете ка Харекана, или «Разбирающая блуждающее небо», — это видваоокеятранский [Concept( 'vidvakastilaya', 'университет и обсерватория' )|E], известный своими впечатляющими астрологическими памятниками. После того как бурные дебаты о скорости Небесной Звезды закончились тяжёлыми травмами двух [Concept( 'vidvaookeyatran_scholarly_caste', 'учёных' )|E], Катпатти Нандамуни из Шейтары объявил, что на острове Кеготон расположится самая совершенная обсерватория во всем [Concept( 'aeras', 'Эрасе' )|E].\n\nВ центре комплекса находится Мальнар Джай — огромная армиллярная сфера, которая может двигаться только ночью, ярко светится в темноте и записывает орбиты Эраса, [Concept( 'aervalr', 'Эрвала' )|E] и солнца. Вспышка неудачного заклинания заставила массивные лестницы из окаменевшего коралла взмыть высоко в небо, изгибаясь в невозможных геометрических формах, а затем снова спуститься в море. Большое металлическое кольцо на краю острова, направленное вверх, кажется, дышит, расширяясь и сжимаясь вместе с приливами. Лучшие астрономы и астрологи обсерватории привлекают огромное количество студентов, жаждущих научиться «разбирать блуждающее небо»."

 building_type_01_haseti_mekab: "Хасети Мекаб"
 building_type_01_haseti_mekab_desc: "Расположенная за густыми джунглями у подножия великих гор, отмечающих южную границу Дамоты, Хасети Мекаб, или Ложная Гробница, долгое время была важным местом для последователей Всевышнего. Обнаруженная во времена [Concept( 'olani_dynasty', 'династии Олани' )|E] и изначально считавшаяся местом упокоения павшего бога Моговая, она потребовала нескольких экспедиций через ловушки строения, чтобы добраться до её сердца.\n\nВ центре храма, глубоко под землёй, находится склеп, где чудом сохранившийся древний скелет лежит в окружении выцветших барельефов, изображающих милостивого и могущественного правителя и его соратников, дарующих благословения своему народу. В результате этой находки был сделан вывод, что гробница принадлежит лишь одному из Его самых доверенных слуг, а не является местом Его пропавших останков. Несмотря на это, она остаётся центром веры Моговая с постоянным потоком паломников, стремящихся приблизиться к останкам того, кто знал Его, или искателей приключений, ищущих подсказки о Его местонахождении."

 building_type_01_holy_site_grand_courthouse: "Здание великого суда"
 building_type_01_holy_site_grand_courthouse_desc: "[holy_site|E] в этой области — популярное место среди благочестивых паломников. Великий суд дает им место для молитвы, отдыха и поклонения перед продолжением пути. Его прекрасные купола и величественные замысловатые шпили возвещают о величии Бога для всех вокруг, а местные жители и путешественники часто пользуются обширными юридическими услугами, предлагаемыми в стенах комплекса."

 building_type_01_holy_site_hallowed_naon: "Священный Наон"
 building_type_01_holy_site_hallowed_naon_desc: "[holy_site|E] в этой области привлекает поклонников Чистейшего во всех формах из сотен культов, настолько разнообразных, что они кажутся принадлежащими к совершенно разным конфессиям. Великолепные сады и внушительные мраморные статуи привлекают многих возможностями для отдыха, церемоний и уединения, а также демонстрируют явное могущество и преданность местного правителя."
 building_type_01_holy_site_marcher_cathedral: "Великий собор"
 building_type_01_holy_site_marcher_cathedral_desc: "[holy_site|E] в этой области привлекает паломников-путеходцев со всего известного мира. Великий собор — это не просто чудо инженерии и красоты, но и безопасное убежище для путешественников, а также престижный памятник его покровителю."
 building_type_01_holy_site_saintly_cathedral: "Святой собор"
 building_type_01_holy_site_saintly_cathedral_desc: "[holy_site|E] в этой области собирает множества благочестивых последователей каждого из Святых. Этот собор является одновременно чудом агионистской архитектуры и символом единства, с конклавами и садами, посвящёнными каждому из Святых."
 building_type_01_house_of_ohrasik: "Дом Орасика"
 building_type_01_huraihr: "Хурайхр"
 building_type_01_huraihr_desc: "Расположенный на берегу Каменного залива, Хурайхр представляет собой монолитное сооружение, созданное неизвестной цивилизацией. Высеченная из мрамора колоссальная статуя не имеет видимых черт лица и несёт вечную службу, сжимая внушительный факел. Положение статуи и её факела привело академические круги Каосемаха к выводу, что она служила маяком. Рядом лежит изъеденная временем расколотая мраморная плита, которую едва удерживают разрушенные столбы. Предполагается, что в древности у статуи был парный двойник, но единственное тому свидетельство — камни необычной формы на дне залива."

 building_type_01_imperialresort: "Он Парадеон"
 building_type_01_imperialresort_desc: "«Убежище» — так называют прекрасный участок Башенного острова, который ученые-[Concept( 'aversaria', 'аверсарианцы' )|E] часто считают одним из 12 чудес света. Серия великолепных пляжей с белым песком, водопады и пышные утесы, возвышающиеся над ними — красоту этого места дополняют бескрайние и прозрачные прибрежные воды, а также тёплый и мягкий климат почти круглый год.\n\nВ мирное время знать часто проводит зимы в частных резиденциях на утесах у побережья, и многие небольшие деревни и городки существуют лишь для обслуживания приезжих аристократов. В последние годы также возникло несколько «курортов», дающих даже мелкому дворянству и богатым простолюдинам возможность насладиться видами, не владея собственным жильем на побережье, хотя любой знатный гость с собственным домом здесь, без сомнения, назвает это бесстыдством."

 building_type_01_irochi_damotada: "Ирочи Дамотада"
 building_type_01_irochi_damotada_desc: "Возведённые в 689 году И. С. при Ралоке из [Concept( 'belar_dynasty', 'династии Белар' )|E], так называемые «Врата Дамоты» представляют собой нечто большее, чем просто укрепление. С одной стороны, это крепость, перекрывающая один из немногих проходимых путей в Дамоту и защищающая изолированный край от чужаков. С другой стороны, это торговый центр, частая остановка на маршрутах Конанского пути, где товары облагаются налогом и передаются между караванами.\n\nОднако уникальнее всего их религиозное значение, ведь земля, на которой они построены, считалась священной задолго до их возведения. Над самими воротами высечена фраза «Он лежит за ними» — послание тем, кто ищет затерянную гробницу Всевышнего. Это важнейшая остановка во время паломничества Моговая, в силу чего здесь расположена библиотека, состоящая в основном из дневников и путевых заметок бесчисленного количества исследователей, покинувших Дамоту и отправившихся на север — настоящая сокровищница сведений о землях вплоть до Каширии или [Concept( 'chevalie', 'Шевалье' )|E]."

 building_type_01_isle_of_iyondel: "Остров Иондель"
 building_type_01_isle_of_iyondel_desc: "Немногочисленное население Ионделя долгое время избегало взоров великих империй Башенных [Concept( 'shatteredisles', 'Островов' )|E], а большинство завоевателей обходили его стороной из-за диковинной, чужеродной природы этого места. Берега острова омываются синими песками, переходящими в алые воды окружающего моря, а его трава имеет необычный оттенок бирюзы. Более того, вся его разнообразная фауна обладает единой общей чертой — лазурно-синими глазами. Причина этого неестественного феномена остается неизвестной, и большинство исследователей избегают острова из-за зловещей репутации среди конфессий окружающих земель. Однако для его древних жителей экология их острова не представляет ничего необычного, а сами они считают, что иностранцы просто не способны оценить его красоту."

 building_type_01_jackal_gate: "Шакальи врата"
 building_type_01_jackal_gate_desc: "Шакальи врата — северные ворота некогда могущественной столицы Дедерак. Хотя стена лежит в руинах, а со статуй шакалов, когда-то выстроенных вдоль неё, давно содрали оникс и золото, они всё ещё остаются прочным оборонительным рубежом раздираемой войной цитадели. Говорят, Шакальи врата пали лишь однажды за всё время своего существования, когда обольстительная Кемтахпут перебралась через них, чтобы похитить душу богини Хеймиат."

 building_type_01_jans_market: "Рынок Яна"
 building_type_01_jans_market_desc: ""

 building_type_01_kadtarak: "Кадтарак"
 building_type_01_kadtarak_desc: "Загадочное сооружение, полностью состоящее из материала, похожего на чёрный камень. Кадтарак вывалился из бездонной пустоты, внезапно разверзшейся в небе во время инцидента, известного как [Concept( 'ratarakaw', 'Ратаракав' )|E]. Несмотря на огромный размер, кажется, что у всего здания нет ни одного проёма или входа.\n\nВпрочем, дальнейшие исследования этого места крайне затруднены из-за присутствия невидимых миазмов и внезапных вспышек света, поражающих любого, кто подберётся слишком близко."

 building_type_01_karavuux: "Рынок Каравукс"
 building_type_01_kashiryatower: "Шпиль ПЭрасжатана"
 building_type_01_kashiryatower_desc: "Шпиль ПЭрасжатана, расположенный на севере Каширии на берегу мелководного озера Кунсровсар, является самым восточным шпилем, чьё местоположение было точно подтверждено и задокументировано [Concept('aversaria','Аверсарией')|E]. Местность вокруг шпиля долгое время считалась местом огромной духовной силы среди различных местных последователей веры Авастья Махани, поэтому она усеяна храмами, святилищами и небольшими общинами более академически настроенных [magi|E] и исследователей.\n\nКак и большинство других известных [Concept('the_towers','Шпилей')|E], Шпиль ПЭрасжатана излучает опасную ауру [Concept('magic','магической')|E] энергии, вызывающую [overwhelmation|E], [exposure_sickness|E] и смерть. В отличие от многих других шпилей, энергия, излучаемая Шпилем ПЭрасжатана, довольно непредсказуема: за тысячелетия радиус, в пределах которого находиться рядом со Шпилем небезопасно, то резко сокращался, то значительно увеличивался. Хотя бесчисленные поколения каширийских учёных выдвигали самые изощрённые теории для предсказания и объяснения этих колебаний — от попыток привязать их к вековым циклам [aervalr|E] и расположению различных созвездий до наблюдения за закономерностями в перелётах определённых видов воробьёв, — никому не удалось предсказать его расширение или сжатие хотя бы с минимальной точностью. Из-за этого территория в пределах смертоносного охвата шпиля усеяна каменными кладками, артефактами и негниющими телами бесчисленных прошлых поколений исследователей, паломников и жрецов, погибших от внезапного и неожиданного расширения ауры своенравного Шпиля."

 building_type_01_kasmeze_cathedral: "Собор Касмезе"
 building_type_01_kasmeze_cathedral_desc: "Вопрос о том, кто изначально построил великую цитадель в Касмезе и прилегающий к ней храм, до сих пор не имеет однозначного ответа. Большинство учёных сходятся во мнении, что этому месту очень покровительствовал император Партариан начиная примерно с 200 года, однако до сих пор ведутся споры о том, построил ли он ядро сооружения сам, или же это сделали отколовшиеся фракции Храма Горного Солнца, как неоднократно предполагалось. В любом случае, в последующие два столетия оно быстро стало одним из крупнейших и процветающих паломнических мест на юге и в Агиократии в целом, соперничая даже с такими местами, как [GetBuilding('01_vounill').GetName] и Тебастро."

 building_type_01_klyabasala: "Клябасала"
 building_type_01_klyabasala_desc: "В провинции Асмур Клябасала издавна служит убежищем и культурным центром для таминайцев, которые зовут её своим домом и защищают с древнейших времён.\n\nЭто сооружение неизвестного возраста возведено над пещерой, ведущей к обширному водоносному горизонту глубоко под землёй. Для самых способных тактиков она является настоящей головной болью, так как грозные кварцитовые стены Клябасалы позволяют ей выдерживать удары любых осадных орудий лишь с незначительными повреждениями. На победу может рассчитывать только упрямая и упорная армия, хотя порой опасность исходила изнутри. Некоторые из самых жестоких битв в истории твердыни происходили в пещерах внизу, где, как говорят, обитают странные колоссальные чудовища, не встречающиеся больше нигде на [aeras|E]."

 building_type_01_knightly_chapterhouse: "Рыцарский капитул"
 building_type_01_knightly_chapterhouse_desc: "Сооружения, предназначенные для обучения и подготовки благородных рыцарей."

 building_type_01_kresoxgrave: "Могила Кресокса"
 building_type_01_kresoxgrave_desc: "После спорадических боёв против орды сьяльвольков по всему Мегос Калатипсоми легон Кресокс, оставшись без припасов и с стремительно тающими силами регулярных войск, объявил о своей капитуляции перед Ведьмоломом. Хотя некоторые из генералов Кресокса заслужили определённое уважение в боях со сьяльвольками, ни для кого не было секретом, что сам Кресокс оказался такой же помехой для военных, как и сами захватчики. Тучный, жадный и исключительный гедонист, Кресокс своим горьким отказом проявлять даже базовые качества лидера постоянно вредил военным усилиям и сорвал любую организованную попытку дать отпор вторжению.\n\nКогда Кресокс прибыл к древнему святилищу на этом месте для встречи с Ведьмоломом, он приказал своей личной гвардии предать его лейтенантов и привести их к Ценвару в цепях. Кресокс предложил своих генералов в качестве рабов вместе с армиями в обмен на право сохранить собственных рабов.\n\nВедьмолом принял предложение, и Кресокс подписал официальную декларацию, приказывающую Легионам Калатипсоми (II «Гордейший», IX «Чистота», VII «Доблесть» и XVII «Пафос») немедленно сдаться Ведьмолому. Как только соглашение было подписано, Ценвар приказал привести рабов Кресокса, чтобы их вернули легону, а затем приказал раздеть Кресокса и бросить его толпе, объявив рабам, что легон возвращён им, как они и просили, и они могут делать с ним всё, что пожелают. Пока Кресокса забивали до смерти, Ведьмолом сообщил сдавшимся легионерам, что он официально освобождает их от рабства, и приказал им вернуться в свои дома и обучиться ремёслам, отличным от войны. Предложение, которое большинство из них поспешили принять."

 building_type_01_lachish_mines: "Шахты Лахиша"
 building_type_01_lachish_mines_desc: "Высоко в западных предгорьях Лахиша лежит глубокое хранилище неизвестного происхождения, состоящее из железных колонн, уходящих в самые недра [aeras|E]. Хотя это хранилище священно для местных оргаррдских верующих, со временем оно было опустошено от своего, казалось бы, нескончаемого запаса железа. Бесконечное хранилище шахт Лахиша покрыто импровизированными туннелями и плавильнями, предназначенными для добычи железа и других сокровищ, найденных внутри."
 building_type_01_lascife_mines: "Серебряный рудник Ласиф"
 building_type_01_last_standers_street: "Улица Последних Защитников"
 building_type_01_last_standers_street_desc: ""

 building_type_01_libraryofzheggarah: "Великая библиотека Жеггары"
 building_type_01_libraryofzheggarah_desc: "Великая библиотека Жеггары была основана учёными-ритуалистами по меньшей мере за девятьсот лет до образования [aversaria|E], что делает её одним из древнейших всё ещё заселённых рукотворных сооружений в известном мире. Библиотека, наполненная сотнями древних фолиантов, тысячами свитков и несметным количеством табличек, настолько древних, что они написаны на давно мёртвых языках, является величайшим источником знаний, о котором только может мечтать любой учёный. Персонал библиотеки состоит из бюрократического класса, принадлежащего к самым разным конфессиям и культурам; формально изучать труды может каждый (хотя простолюдинам чаще всего отказывают из страха кражи или порчи), а открытое отношение к доступу привело к тому, что библиотека в основном была предоставлена сама себе при самых разных правителях. Даже аверсарцы при всём своём могуществе оставили библиотеку нетронутой, когда ненадолго завоевали Жеггару."

 building_type_01_light_wall: "Стена Света"
 building_type_01_lionspalace: "Кеахслтна Жеаша"
 building_type_01_lionspalace_desc: "Львиный дворец — традиционная резиденция Лиренарас. Изначально бывший довольно скромным дворцом, приютившим одного из десятков враждующих воевод на руинах [Concept('mamuramat','Западного Мамурамата')|E], за века правления Айяров он превратился в один из самых пышных показов богатства в истории.\n\nВеличественную арку перед сооружением обрамляют массивные парные львы из слоновой кости, хотя до сих пор ведутся жаркие споры о том, стали ли они причиной любви Айяров к этому животному или же были построены в ответ на неё. Интерьер наполнен похожими статуями, а также более чем 300 спальнями, шестью бальными залами, сорока столовыми, тремя десятками садов, четырнадцатью залами трофеев и бесчисленными роскошествами, о которых большинство правителей могли бы только мечтать. Если на [aeras|E] и есть более пышный дворец, Айяры отказываются верить в его существование." 

 building_type_00_listikraxos: "Разрушенный листикраксос"
 building_type_00_listikraxos_desc: "Этот [Glossary('Листикраксос','LISTIKRAXOS_GLOSS')] представляет собой лишь обвалившуюся каменную кладку и заросшие дворы. Стоят только фундаменты и несколько пролётов крепостной стены — этого достаточно, чтобы отметить место, где когда-то был донжон, но недостаточно, чтобы удержать его."

 building_type_01_listikraxos: "Листикраксос"
 building_type_01_listikraxos_desc: "[Glossary('Листикраксосы','LISTIKRAXOS_GLOSS')] точечно усеивают пути и водные артерии [Glossary('Калатипсоми','kalathipsomi_encyclopedia_desc')] в различном состоянии запущенности. Хотя [Concept('chevalie','пограничные')|E] лорды, построившие их, потеряли своё огромное политическое влияние в IX веке из-за неудачных политических ходов, эти форты до сих пор служат политическими центрами для многих владык."

 building_type_02_listikraxos: "Укреплённый листикраксос"
 building_type_02_listikraxos_desc: "Для тех, кто путешествует по дорогам [Glossary('Калатипсоми','kalathipsomi_encyclopedia_desc')], вид гарнизонного [Glossary('Листикраксоса','LISTIKRAXOS_GLOSS')] с новым знаменем, укреплёнными зубчатыми стенами и организованными патрулями служит знакомым посланием: эта дорога под чьим-то контролем, и за проезд придётся заплатить."

 building_type_01_losttempleofmesbadh: "Месбад Орин'то"
 building_type_01_losttempleofmesbadh_desc: "Месбад Орин'то, более известный как «Затерянный храм Месбада», представляет собой древний комплекс зданий, предназначенных для ритуалов и религиозных трудов, насчитывающий более четырёхсот отдельных построек. Его тысячи алтарей, статуй и прочего погребены глубоко под песком, и наружу торчат лишь вершины многочисленных башен этого места. С этих башен многие искатели приключений отправлялись в глубь песков, возвращаясь с великими артефактами и ценными предметами... если вообще возвращались.\n\nМногие утверждают, что это место проклято, веря, будто божество, которому они поклоняются, поглотило храм и его приверженцев песками в наказание за некий грех. Истинная причина разрушения остаётся загадкой, так как любые попытки серьёзных исследований пресекались постоянными войнами и суровыми условиями окружающей среды." 

 building_type_01_lygudista_mines: "Золотой рудник Лигудисты"
 building_type_01_lygudista_mines_desc: "Старые правители-последователи [Concept('wardenism','варденизма')|E] Лигудисты знали об изобилующих здесь богатствах, но истинное изобилие, обеспечиваемое этим горнодобывающим комплексом, было раскрыто только при Ордене Розы Святой Сансии. Теперь рудник служит одним из крупнейших символов статуса, которым любят хвастаться его новые правители. Количество рабов, отправляемых на разработку золотых жил внутри, не имеет прецедентов по всему [sarradon|E] — на каждые пять несчастных душ, трудящихся там, приходится надсмотрщик с плетью, а страдания этого места уступают разве что шахтам Малькоиса. Со своей стороны, близлежащий Орден Ключа Святого Калисто с радостью расстаётся с несколькими «кающимися» в обмен на часть ежегодного улова из этих туннелей."

 building_type_01_magic_hole: "Магическая бездна"
 building_type_01_magic_hole_desc: "Эта любопытная дыра в земле является точкой пересечения [Concept('tower_wayline','Имперской лей-линии')|E] и [northern_wayline|E]. Это единственное завоёванное [Concept('aversaria','аверсарцами')|E] место, где [Concept('magic','магическая')|E] сила видна за многие мили вокруг, а чистая магическая аура особенно отчетливо проступает ночью. Однако сырая мощь слишком велика для обычного [magi|E], и даже приближение к краю крайне опасно. Постоянный пост чародеев из [mayikprolollans|E] располагается в близлежащем форпосте для изучения значения этого места. До [frodbrokna|E] чародеи выяснили, что материал, ввозимый из [sarradon|E] (если из него сковать полный доспех), может защитить магов по мере их приближения к краю. Любые экспедиции, отправленные к самому краю бездны, сообщают, что сияние магии настолько ярко, что кажется, будто солнце выжигает им глаза."

 building_type_01_malah_enlevettah: "Малах Энлеветта"
 building_type_01_malah_enlevettah_desc: "Престижная Академия Храбрецов, расположенная в канийском мегаполисе ЭЛОИ-Авар, — это место, где кандидаты, обладающие склонностью к военному искусству, могут получить формальное образование в его канонах. Обучаемые мастерами-фехтовальщиками и отставными командирами, послушники Малах Энлеветта часто блистают на поле боя, ещё больше укрепляя славу и без того знаменитого института. Основанное знаменитым Иаратом Азарией Каракаром во время Войны Братьев в Амсаре как изначально разношёрстное ополчение (большинство ранних подвигов Энлеветта, без сомнения, по большей части миф), это подразделение со временем обосновалось в ЭЛОИ-Авар и превратилось в постоянную боевую силу, а позже — в гибрид между военным орденом и академией."

 building_type_01_malcoispalace: "Палат то Митидон"
 building_type_01_malcoispalace_desc: "Дворец Митидона, названный в честь [Concept('aversaria','аверсарской')|E] кампании, сокрушившей последнего ийросского короля, считается одним из самых скудных и серых по аверсарским меркам. Несмотря на это, он также является одним из крупнейших, построенным как грандиозная цитадель для удержания жителей долины Малькоис в подчинении и быстрого подавления любых восстаний рабов.\n\nНесмотря на отсутствие красоты, дворец оставался массивным и внушительным — огромным серым блоком северного гранита, с территории которого аверсарцы веками подавляли коренное население.\n\nДворцовый комплекс был практически разрушен в ходе жестокой трёхлетней осады силами Горассоса «Череполома». Семья Атовидов, правившая Малькоисом на протяжении нескольких поколений, встала на сторону Аксиотеи в 1199 году от И. С. и оставалась одним из последних крупных оплотов её государства после [frodbrokna|E]. Когда Горассос наконец прорвал оборону в 1240 году от И. С., дворец был разорван на части, а семья Атовидов уничтожена." 

 building_type_01_malcoisslavefactory: "Кенитрод Кавасеви"
 building_type_01_malcoisslavefactory_desc: "Центральная мануфактура — это название центра [Concept('aversaria','аверсарской')|E] работорговли в Малькоисе. Массивный комплекс мастерских, загонов для содержания и торговых рынков, Мануфактура оставалась главным узлом рабства на севере на протяжении почти целого тысячелетия.\n\nВсе рабы в Малькоисе попадают на Мануфактуру, чтобы получить клеймо и быть распределёнными по одной из множества категорий, которые определят их судьбу, в то время как другие отправляются на работу на самой Мануфактуре, либо помогая бюрократии, либо трудясь в многочисленных мастерских и на полях вокруг нее."

 building_type_01_mayaliha_mines: "Соляная шахта Маялиха"
 building_type_01_mayaliha_mines_desc: "Если соляные шахты Креонты были единственным поставщиком для всей [aversaria|E], то шахты Маялиха — это живительная артерия [sarradon|E]. Высохшие озёра использовались местными пустынными племенами с незапамятных времён, что позволяло сохранять их пищу в десять раз дольше обычного. В наши дни это место подвергается интенсивной коммерческой эксплуатации, а его, казалось бы, нескончаемая продукция отправляется в близлежащий мегаполис Кудаххбар, а оттуда продаётся и развозится во все уголки мира — от дворцов амсарских хикланов до губернаторов Опахасии."
 building_type_01_mayikprolollan: "[mayikrata|E]"
 building_type_01_mayikprolollan_desc: "Массивная цитадель древней постройки, восседающая на высочайших горах северной [aversaria|E], [mayikrata|E] служила главной магической академией для аверсарских (и многих неаверсарских) [magi|E] с момента своего создания. Будучи лишь одной из трёх крупных академий [mayikprolollans|E], северная всегда являлась центральным узлом всей магической силы и науки, стоя далеко выше своих сестринских комплексов по престижу и значению.\n\nЕдинственным случаем, когда академия подверглась вторжению, разграбление Ценваром из сьяльвольков, за что тот и получил прозвище Ведьмолом. С тех пор Майикпрололлан, её сотни ярусных донжонов, фортов, залов и двориков превратились в руины.\n\nТеперь, когда залы опустели или превратились в зоны боевых действий для тех немногих, кто остался, великие туннели под крепостью кажутся всё более опасными. Более молодые и суеверные из местных чародеев утверждают, что внизу что-то наблюдает... и шепчет."

 building_type_01_mdala_hasira: "Мдала Хасира"
 building_type_01_mdala_hasira_desc: "Мдала Хасира — это плантации специй, часто встречающиеся по всему [pirate_coast|E]. Эти фермы небольшие и выращивают лишь отдельные урожаи прибыльных пряностей, таких как корица, перец, гвоздика или кардамон."

 building_01_magaala_qaaday: "Шагающий город"
 building_01_magaala_qaaday_desc: "$building_type_01_magaala_qaaday_desc$"

 building_type_01_magaala_qaaday: "Шагающий город"
 building_type_01_magaala_qaaday_desc: "[magaala_qaaday|E] был построен с учётом высоких приливов Рога: его высокие деревянные и каменные опоры удерживают весь город высоко над уровнем воды, благодаря чему каналы могут свободно протекать через город, подобно улицам из морской воды. Многие отмечают, что во время низкого прилива у города словно вырастают ноги, будто он сам вышагивает из моря."

 building_01_mji_safi: "Бандар'Сафи"
 building_01_mji_safi_desc: "$building_type_01_mji_safi_desc$"

 building_type_01_mji_safi: "Бандар'Сафи"
 building_type_01_mji_safi_desc: "Этот порт был построен с нуля с красивыми алебастровыми стенами и одной из крупнейших гаваней в регионе. Через эти доки проходит больше товаров, чем через большую часть [Concept('pirate_coast','архипелага')|E] вместе взятого."

 building_02_mji_safi: "Мджи'Сафи"
 building_02_mji_safi_desc: "$building_type_02_mji_safi_desc$"

 building_type_02_mji_safi: "Мджи'Сафи"
 building_type_02_mji_safi_desc: "Этот монументальный порт славится своими алебастровыми стенами и гаванями, впервые построенными в золотой век [ufaliracci|E] и позже расширенными [cinnamon_cities|E] благодаря оживлённой торговле специями и текстилем вдоль Саррадонского побережья на юг. Его размеры и размах затмевают большинство портов на [pirate_coast|E], что делает его главной целью как для торговых перевозок, так и для пиратов."

 building_01_mlima_taa: "Млима'Таа"
 building_01_mlima_taa_desc: "$building_type_01_mlima_taa_desc$"

 building_type_01_mlima_taa: "Млима'Таа"
 building_type_01_mlima_taa_desc: "[Glossary('Млима’Таа','GH_MLIMA_TAA_GLOSS')] — это спящий вулкан в [nightcoast_biozone|E]. На его поверхности прорезаны глубокие жилы люминесцентного камня, которые светятся и переливаются днём и ночью. Никто не помнит, когда он извергался в последний раз — его плодородные склоны и тёплое кратерное озеро давно заселены, но свечение напоминает всем о спящем внутри огне."

 building_type_01_mountain_tower: "Пиргон то Тейссия"
 building_type_01_mountain_tower_desc: "Построенные Аавтократией Тейссией в конце [chaos_of_the_seventh_century|E] века и на рассвете последующего Золотого века [aversaria|E], Башня Горы (позже называемая местными Башней Тейссии) и Башня Восточных Звёзд ранее принадлежали аверсарскому дворянину, ставшему [Concept('liches','личам')|E], по имени Темос. После поражения Темоса от рук Тейссии и их включения в корону, новые восточные провинции Тейссии вскоре стали центром смещения аверсарского центра силы из Этепезеи и Малькоиса в Аироной и Опахасию.\n\nВозведённые для защиты новой столицы Асиуполиса и прекращения угрозы пиратства для столицы и северных провинций Аверсарии, две башни были построены на древних руинах и возвышаются выше почти любого другого аверсарского сооружения. Благодаря целой системе оборонительного снаряжения, собственным гарнизонам и внушительной серии цепей, которые можно легко опустить для перекрытия пролива, в тени этих башен вырастали целые города."

 building_type_01_mountainhold: "Кративоун"
 building_type_01_mountainhold_desc: "Горный Оплот — это древнее сооружение, построенное эоны лет назад, хотя большая часть первоначальной постройки давно либо застроена, либо обрушилась с горы.\n\nСовременный Горный Оплот берет своё начало в [Concept('kartharadd','Империи Картарадд')|E] и был построен с использованием руин древнего памятника где-то в третьем веке. Крепость оказалась центром [Concept('kartharadd','картараддского')|E] могущества на юге, с территории которого они контролировали большую часть долины великой реки. Именно здесь картараддцы отбили несколько [Concept('aversaria','аверсарских')|E] контрнаступлений, пока завоёвывали Малькоис, хотя [Concept('night_of_the_bleeding_moon','падение')|E] картараддской столицы на дальнем севере, а также реформирование аверсарских легионов Аавтократиром $aauto_eramos_link$ Эрамосом#! оказались непреодолимым препятствием, и вскоре крепость стала имперским центром.\n\nГорный Оплот пришёл в запустение вплоть до [frodbrokna|E], когда он сначала стоял как бастион против сьяльвольков, пока его не обошёл Эофвайн, брат Ведьмолома. Теперь он остаётся опорным пунктом для убывающего числа людей, оказавшихся в ловушке в [Concept('the_fog','Тумане')|E], и ключевой точкой, откуда беженцев переправляют на юг." 

 building_type_01_lang_ky_mines: "Шахтёрское поселение Ланг Ки"

 building_type_02_lang_ky_mines: "Шахты Ланг Ки"

 building_type_03_lang_ky_mines: "Шахты Ланг Ки"

 building_type_04_lang_ky_mines: "Горнодобывающий комплекс Ланг Ки"

 building_type_01_lang_ky_mines_desc: "Шахты Ланг Ки, считающиеся крупнейшим нефритовым рудником за пределами Катун-Кай, долгое время были источником процветания древнего царства Шрунфан, а также основной причиной неоднократных катхунских вторжений на его территории. Наконец захватив контроль над объектом в начале восьмого века, победившие захватчики не теряли времени на эксплуатацию и экспорт его обширных залежей нефрита, и шлемы Лордов-Протекторов Южных Земель украшены драгоценностями, добытыми именно на этом руднике. Несмотря на годы разработки, каждый год открываются всё новые жилы, и многие верят, что богатства Ланг Ки уходят глубоко в недра Эраса."

 building_type_01_mountainport: "Лиманово"
 building_type_01_mountainport_desc: "Лиманово, или Горный Порт — главный порт западной Опахасии. Когда-то второй по значимости город в [aversaria|E] после самого Ораисполя, с расширением [Glossary('Аавтократии','GH_AAUTOKRATA_GLOSS')] на восток его значение уменьшилось, а последним гвоздем в крышку гроба стал Кризис [chaos_of_the_seventh_century|E] века. Когда западные торговые пути были практически закрыты из-за различных бедствий, а наступивший Золотой век Аверсарии вновь сместил акцент торговли и развития на восток, Лиманово окончательно утратил свое былое величие.\n\nНесмотря на это, Лиманово остаётся важным торговым городом. Хотя он далёк от своего древнего значения, сотни лет создаваемой инфраструктуры оказались достаточно сильным стимулом для продолжения торговли."

 building_type_01_mourners_rest: "Упокой Скорбящего"
 building_type_01_mourners_rest_desc: "В центре поселения Чавой дома и рынки уступают место широкой круглой площади, известной как Упокой Скорбящего — дому монумента, который редко можно увидеть за пределами острова Ира. Высокая статуя, высеченная из камня, изображает странную птичью фигуру, похожую на орла, но с весьма необычными крыльями. Примечательно лицо существа: на первый взгляд казалось бы человеческое, но его черты несомненно божественны. Те немногие, кому удалось своими глазами увидеть этот неуловимый памятник, отмечали нескольких последователей, стоящих в молчании вокруг статуи и взирающих на существо с лицами, полными скорби."

 building_type_01_nagom_kakezihi: "Нагом Какезихи"
 building_type_01_nagom_kakezihi_desc: "Для тех, кто находится за пределами его пределов, Нагом Какезихи кажется неприступной крепостью, возвышающейся стеной, протянувшейся от края до края горного перевала, который она охраняет. Созданный давно адабиссцами, он стоит столько, сколько себя помнят люди, — символ их могущества, закрывающий людям севера доступ к их землям.\n\nОднако для самих адабиссцев грандиозная крепость — лишь ветхий лагерь, её нерушимые стены — всего лишь поспешно возведённый частокол, а её стражники — скучающие солдаты, отправленные на самое нежеланное место службы в Империи. Это не более чем необходимость — место, куда можно отправлять новых рекрутов для обучения, изолированное как единственный островок цивилизации среди дикарей. Хотя её различные командиры предпринимали неоднократные попытки укрепить оборону или улучшить условия проживания в форте, ни одна из них не увенчалась успехом, так как развитие такого захолустного лагеря считалось пустой тратой денег и усилий."

 building_type_01_new_iyrossi_palace: "Теутровна Зиррус"
 building_type_01_northgate: "Ворея Нкеит"
 building_type_01_northgate_desc: "Северные Ворота представляют собой цепь укреплений вдоль одной крупной каменной стены, протянувшейся вдоль северной границы современного Малькоиса.\n\nПервоначально построенные [Concept('kartharadd','картараддцами')|E], чтобы отделить их недавно завоёванные территории в [aversaria|E] от их основных регионов на севере, укрепления стали местом жестоких боёв после аверсарского отвоевания Малькоиса, и, по преданию, вокруг них захоронены кости сотни тысяч воинов.\n\nЭто место было в значительной степени заброшено после [night_of_the_bleeding_moon|E] и марша аверсарцев на север, и постепенно приходило в упадок вплоть до [frodbrokna|E], произошедшей примерно 500 лет спустя. Когда сьяльвольки подступали всё ближе к югу, а [Concept('the_fog','Туман')|E] стремительно разрастался, стена была отремонтирована и перестроена местным аверсарским военачальником Детином Калатином в попытке сдержать поток мигрантов на юг. Хотя стена действительно помогла замедлить дальнейшие вторжения, никто не ожидал, что сьяльвольки отважатся преодолеть горные перевалы на западе и прорубят путь через Туман с помощью магии, поэтому Северные Ворота пали перед Имперрехом без пролития крови. Теперь Северные Ворота представляют собой последнюю линию обороны между Аверсарией и Туманом, а их стража неустанно вглядывается на север, в тревожную дымку, касающуюся стен крепости." 

 building_type_01_northwatch: "Роксирвореаис"
 building_type_01_northwatch_desc: "Роксирвореаис, или «Северный Дозор» на [Concept('aversaria','аверсарских')|E] языках, — это исторически самая северная точка аверсарских поселений в губернаторстве Катраддия. Грандиозная система цитаделей и крепостей, граничащая с северной рекой, поражает воображение большинства путешественников, являясь одними из самых крупных и древних сооружений, известных [Glossary('Аавтократии','GH_AAUTOKRATA_GLOSS')]. Целые деревни, городки и города живут в тени стены или внутри её донжонов, и она также является крупнейшим сооружением на [aeras|E] по протяжённости.\n\nТе, кто родился и вырос в Северном Дозоре, обычно с ранних лет получают военное образование, живя на враждебном пограничье, где даже от детей часто ждут, что они возьмут копьё для битвы с нападающими племенами или тварями из древних подвалов. Хотя он часто становился столицей Катраддии, этот выбор остаётся редким — главным образом потому, что местные жители почти поголовно считаются угрюмым и суровым народом."

 building_type_01_oasisofgonan: "Оазис Гонан"
 building_type_01_oasisofgonan_desc: "Оазис Гонан — это большой каньон, который в какой-то момент за последние два тысячелетия заполнился водой естественным или искусственным путём. Независимо от своего происхождения, оазис стал одним из важнейших мест для [Concept('sarradon','саррадонской')|E] торговли и жизненной артерией для десятков культур. Плодородный оазис вокруг каньона стал необходимой точкой отдыха для путешественников, пересекающих [Glossary('Великую пустыню','sarradonian_desert_encyclopedia_desc')] с севера и юга вглубь континента, и за тысячелетия здесь была построена внушительная инфраструктура, чтобы размещать многочисленных купцов, исследователей и паломников, пересекающих пустынные перевалы, и получать от них прибыль." 

 building_type_01_oetanai_mines: "Золотые рудники Оэтанаи"
 building_type_01_oetanai_mines_desc: "Хотя о золотых жилах Оэтанаи было известно издавна, географическая удалённость делала их разработку нерентабельной до тех пор, пока намного более доступные рудники в Оронтисе не истощились в начале XII века. Из-за ряда неизбежных неудач систематическая эксплуатация началась только в 1160-х годах. Развитию препятствовали густые леса Кнотоса, а расположение шахтного устья на значительной высоте создавало дополнительные трудности. Часто отмечали, что добраться до рудника было, пожалуй, опаснее, чем работать на нём. Хаос [odrstund|E], [imperial_civil_war|E] и, наконец, [frodbrokna|E] привели к закрытию рудника, так как интересы в Малькоисе сместились в сторону вопросов выживания, а не разработки неразвитого высокогорного рудника. С постепенным возвращением жизни в провинцию пока неизвестно, будут ли рудники Оэтанаи открыты снова — и если да, то кем?" 
 building_type_01_oltenictower: "Ольтенская башня"
 building_type_01_oltenictower_desc: "Хотя Восточная башня и находилась под контролем [Concept('aversaria','аверсарцев')|E], Ольтенская башня так и не попала в их руки. Начала ли магия [Concept('the_towers','Шпилей')|E] угасать или она всё ещё неприступна — загадка, поскольку её свирепо защищает народ ольтени. Они видят в Башне физическую связь между своими двумя богами, Ольгон-теном и Еру-маи. Защита Башни считается у ольтени высокой честью и обрядом посвящения для молодёжи." 

 building_type_01_orangepalace: "Хун вер 'д Гроствордре"
 building_type_01_orangepalace_desc: "«Дом Великих Монархов» — традиционная резиденция древних королей Конийкмениров. После Народной революции большая часть интерьера дворца была переоборудована для нового правящего совета дворянства и размещения разросшейся вокруг них огромной бюрократии.\n\nВ задней части Дворца бывшей правящей династии всё ещё оставлены их покои — технически как богатым арендаторам, а не правящим монархам. Гораздо более грандиозные, пышные и современные покои были построены прямо над ними, и именно в них проживает канцлер Конийкмениров."

 building_type_01_ordus_mines: "Золотые рудники Ордуса"
 building_type_01_ordus_mines_desc: "Действовавшие ещё во времена старой Ийроссии, жестокие рабовладельческие артели [Concept('aversaria','аверсарцев')|E] фактически превратили это место в братскую могилу для тех, кто когда-то сам его эксплуатировал. В последние годы шахты пришли в запустение из-за ийросского восстания рабов, а большая часть горнодобывающих выработок была сожжена или разрушена во время масштабного мятежа. Ранее управлявшие шахтой аверсарцы всё ещё здесь — их тела без лишних церемоний сбросили в шурфы вместе с телами жителей нескольких близлежащих колоний."
 building_type_01_paccai_mines: "Карьерный рудник Паккаи Малаи"
 building_type_01_paccai_mines_desc: "Высоко в туманных лесах Веллатолы, окутанный дымкой, возвышается тёмный пик Паккаи Малаи. Именно здесь на протяжении веков в склоне вершины был вырыт огромный карьер, из которого извлекаются огромные количества чёрной породы с зелёными жилами. Казалось бы, бесполезная для многих, тайная ложа вародаистских [magi|E] воды на протяжении веков совершенствовала искусство извлечения из этой руды чистой меди, а также золота в меньших количествах. Однако магические процессы добычи дают большое количество отходов, оставляя реки и леса вокруг Паккаи Малаи опустошёнными и загрязнёнными."
 building_type_01_palaceofthegoldenmartyrs: "Палат то Кресо Мартюрион"
 building_type_01_palaceofthegoldenmartyrs_desc: "Дворец Золотых Мучеников — официальная резиденция губернатора Опахасии, или, по крайней мере, был таковой, когда титул «губернатор» имел хоть какой-то реальный вес. Прекрасное сооружение, выполненное в традиционных опахасийских белых, золотых, чёрных и пурпурных тонах. Несколько Аавтократиров в истории [Concept('aversaria','Аверсарии')|E] проживали здесь, правя из Аироноя или Ораисполя и наслаждаясь пышностью дворца в летнее время.\n\nНеизвестно, как дворец получил своё название, хотя недавние археологические находки храмового комплекса, погребённого под зданием, заставили многих аверсарских историков поверить, что изначально это могло быть названием монастыря Храма Горного Солнца. Однако, несмотря на красоту и историю, дворец пришёл в запустение. С упадком Опахасии со времён [chaos_of_the_seventh_century|E] века и крахом Аверсарии после Фродброкны многие его крылья были заброшены, а большая часть внешних стен разобрана на строительные материалы."

 building_type_01_palaceofthewizardking: "Дворец Короля-Чародея"
 building_type_01_palaceofthewizardking_desc: "Никто в известном мире уже не помнит, кто такой «чародей», но все знают сказки об ужасном Короле-Чародее. Именно здесь эта таинственная фигура когда-то правила великой империей, требуя вассальной верности от всех народов мира и прожив сотни лет, в течение которых навлекла немало ужаса на мир. В конце концов король [Concept('marchers','марочников')|E] Бастион сразил его и изгнал его [magic|E] из мира, а его двенадцать дьявольских детей терзали мир до тех пор, пока человечество не доказало, что достойно свободы.\n\nСейчас это место в основном заброшено, хотя неподалёку расположена небольшая деревня. Местные жители часто говорят о странных огоньках в пустых окнах и обычно винят дух Короля-Чародея во всём: от скисшего молока до пропажи местных жителей."

 building_type_01_paswatun_mines: "Шахтёрское поселение Пасватун"
 building_type_02_paswatun_mines: "Шахты Пасватун"
 building_type_03_paswatun_mines: "Большие шахты Пасватун"
 building_type_04_paswatun_mines: "Шахтёрское поселение Пасватун"

 building_type_01_paswatun_mines_desc: "Открытые в X веке знаменитым искателем приключений Лакомом Длинноногим, богатые залежи меди рудника Пасватун принесли невиданное процветание некогда неразвитой глуши Дахангона.\n\nПоявление нового источника металла создало как возможности, так и проблемы для правящих сил региона, и многие верховные министры [Concept('bureau_bronzeport','Бронзовой Гавани')|E] пытались вырвать контроль над шахтами, но лишь с ограниченным успехом. Масштабные раскопки за эти годы почти не истощили его огромные запасы: по мере того как шахтёры спускаются всё глубже в горы, открываются всё новые жилы более высококачественной меди."

 building_type_01_phanapetra_mines: "Рудник Фанапетра"
 building_type_01_phanapetra_mines_desc: "В лучшие времена простой гражданин Агиократии при одном лишь упоминании Фанапетры сразу представлял себе небывалые горы золота абсурдных пропорций, добываемые жадными и развращёнными опахасийскими дворянами. Нынче же вы, скорее всего, встретите лишь недоумённый взгляд, поскольку Фанапетра ушла в небытие вместе со своими давно угасающими минеральными богатствами. Не стоит заблуждаться — количество золота в этих шахтах всё ещё довольно значительно, однако большинство самых прибыльных жил были истощены ещё века назад и оставлены пылиться позади куда более продуктивными рудниками Малькоиса."

 building_type_01_portacademy: "Майикпрололлан сто Таллас"
 building_type_01_portacademy_desc: "Академия Волн — одна из двух главных младших академий самого [mayikrata|E]. Построенная в купеческом порту благодаря пожертвованиям местных ведущих просийских картелек (конгломерата торговых компаний и криминальных организаций, законно правящих городом), Академия Волн оставалась крупнейшим источником финансирования для [pathosixyic_academies|E] с самого момента своего основания.\n\nАкадемия находится не только в богатом портовом городе в самом сердце [aversaria|E], но и сама по себе является домом для многих известных [magi|E]. Хотя она считается менее престижной, чем две её сестринские академии, она, тем не менее, остаётся излюбленной академией для многих представителей высшей знати — главным образом благодаря пышному и роскошному отношению, которое обычно получают её студенты.#!" 

 building_type_01_potionworks: "Королевский зельеварный завод Виржиллиаров"
 building_type_01_potionworks_desc: "Королевский зельеварный завод Виржиллиаров — это грандиозное мануфактурное предприятие, построенное среди болот Конийкменира и являющееся источником подавляющего большинства зелий и настоек [the_continent|E]. Будучи технически независимой гильдейской и торговой корпорацией, контрольный пакет акций которой принадлежит государству и канцлеру, точное внутреннее устройство Зельеварного завода держится в строжайшем секрете: стража из наёмников и законы гарантируют, что никто не узнает тайн того, как Конийкмениры варят свои «чудодейственные» эликсиры.\n\nБудучи благом для экономики региона и Республики, испарения, откачиваемые с фабрики... мягко говоря, не слишком приятны для местных жителей, у которых заметно повышается шанс мутаций и онкологических заболеваний. Возможно, ещё менее популярен постоянный спрос на испытателей зелий, которым выплачивается пожизненная пенсия, если им (что бывает редко) удаётся прожить год на Зельеварном заводе, равно как и нетихающие споры вокруг заявлений о том, что зелья по вкусу поразительно напоминают смесь болотной воды и крови.#!" 

 building_type_01_preachers_hill: "Проповеднический холм"
 building_type_01_preachers_hill_desc: "Живое святейшество Путесвятого Реми всё ещё остается недоказанным, а его статус Путеотца Монет, Ворон, Корон и «Автоброжения», которому довелось жить в переулке Проповеднического холма, признаться, вызывал сомнения; однако его исключительно театральные молитвы и исключительно низкие цены всё равно обеспечивали ему верную паству. Нужен ли был вам ещё один Путеотей Пути для выбора Пути вашего ребёнка или вы просто хотели, чтобы пьяный Путеотей жонглировал вашими новорождёнными тройняшками во время проведения церемонии Посвящения — Реми мог предоставить всё.\n\nКонечно, как и многие безумные старики, продающие абсурдные вещи по абсурдным ценам на [Concept('peti_gisredde','жисреддинских')|E] уличных углах, Реми в конце концов напился до смерти прямо посреди проведения Выбора Пути. Его вдохновляющий пример на века вперёд сформировал предприимчивый дух нижнего класса Проповеднического холма, и здесь бережливый ревнитель всё ещё может найти больше недорогих Путесвятых как банальных, так и абсурдных Путей, чем когда-либо смог бы найти в архивах Раокура."

 building_type_01_qabuux: "Жилище Кабуукс"
 building_type_01_rafhamah_pass: "Перевал Рафхама"
 building_type_01_rafhamah_pass_desc: "Перевал Рафхама — главный северный перевал между Зуальфи и востоком, а также один из трёх проходов между западом и востоком.\n\nХотя он очень удобен для обороны и местами довольно узкий, он, тем не менее, гораздо шире южного перевала в Бурайвфе и кишит куда меньшим количеством враждебных туземцев, что делает его предпочтительным для проходящих армий и купцов. Впрочем, быть лучшим из плохих вариантов — это не так уж много, и большинство всё же предпочло бы использовать куда более развитые прибрежные маршруты для путешествий, даже если ради этого приходится делать крюк."

 building_type_01_redportal: "Разлом Эйнора"
 building_type_01_redportal_desc: "Впервые обнаруженный [Concept('aversaria','аверсарским')|E] [magi|E] Эйнором Истилмикроксом во время его исследований пресловутых [redlands_biozone|E] (и ставшей последним местом в Красных Землях, которое он видел перед тем, как ослепнуть и затем сжечь себя в своём поместье в Пифагорионе), учёные впоследствии рассказывали об адском втором мире, который Эйнор утверждал, что видел внутри, как о символе всех Красных Земель, сдвинувшем исследователя с ума. Немногие последующие путешественники, достаточно глупые, чтобы отважиться отправиться в Красные Земли, сходились во мнении, что там действительно можно разглядеть скудные алые проблески того, что кажется каким-то полем боя с траншеями и суетящимися фигурами внизу, но находили утешение в том, что, возможно, когда-нибудь все Красные Земли выплеснутся в какой-нибудь другой мир, но не в [aeras|E]."

 building_type_reefmine_01: "Добыча рифовых кристаллов"
 building_type_reefmine_01_desc: "Небольшая рыбацкая деревня, превращающаяся в форпост по добыче кристаллов."

 building_type_01_riduvianbarrows: "Ридувийские курганы"
 building_type_01_riduvianbarrows_desc: "Ридувийские курганы — место упокоения [Concept('kartharadd','картараддских')|E] [magi|E]-императоров. Курганы включают в себя десятки древних полых холмов, которые чародеи превратили в массивные ульи древних гробниц и могил. Каждый холм изнутри обустроен так, чтобы вмещать невероятно запутанные усыпальницы для важных и уважаемых чародеев со всей Империи, часто украшенные магией для демонстрации могущества заказчика.\n\nЛичная гвардия императора стоит здесь напоготове, готовая к любым неожиданностям и постоянным попыткам некромантов и искателей приключений совершить налёт на это место в поисках подопытных и богатств." 

 building_type_01_serpent_gate: "Врата Змей"
 building_type_01_serpent_gate_desc: "Врата Змей — это южные ворота некогда могущественной столицы Дедерак. Хотя стена лежит в руинах, а статуи змей, когда-то обрамлявшие её, давно лишились нефрита и серебра, они всё ещё остаются прочным оборонительным пунктом для терзаемых войной руин цитадели. Говорят, что Врата Змей пали лишь однажды за всё время своего существования, когда скверный военачальник Хек-Сакират пробил их в ходе разорительной войны, прежде чем был остановлен у ворот дворца Духом Руид-таха."

 building_type_01_seychunds_square: "Площадь Сейчунда"
 building_type_01_seychunds_square_desc: ""

 building_type_01_silverpalace: "Серебряный дворец"
 building_type_01_silverpalace_desc: "[silver_palace|E] представлял собой массивное, изысканно украшенное сооружение, построенное мастером-ремесленником и поэтом Каттупу Джамирасом, 9-м монархом королевства [ufaliracci|E]. Говорят, что на строительство дворца ушло 30 лет, а колоссальные расходы на его возведение навсегда закрепили торговое могущество [cinnamon_cities|E] во всём регионе. Он давно лишился своих ценностей и теперь представляет собой лишь руины на пустом холме."

 building_type_01_slums_of_den_teriatrixx: "Шесть городов Ден Териатрикс"
 building_type_01_slums_of_den_teriatrixx_desc: "Будучи давним узлом торговли между разнообразными [Concept('shatteredisles','Островами')|E] и купеческими городами [chevalie|E], неизменно стабильный союз трёх древних городов сохранял процветание Ден Териатрикс даже в самые хаотичные времена. Тысячелетняя политика приема многочисленных потенциальных мигрантов на расстоянии вытянутой руки привела к тому, что начинающие торговцы и добровольные мигранты строили импровизированное жильё за пределами их неизменных стен. С тех пор общинный дух сформировал вторую культуру среди жителей разросшихся трущоб, лежащих за стенами триархии, где каждые трущобы являются полноценным вторым городом."

 building_type_01_sonas_sikelenizi: "Сонас Сикеленизи"
 building_type_01_sonas_sikelenizi_desc: "На пересечении трёх рек расположился крупный форпост — ряд причалов, уходящих далеко в воду, между которыми лавируют речные суда, отправляющиеся в дальнейший путь. Сонас Сикеленизи, или буквально «перекрёсток трёх рек», начал разрастаться после объединения Дамоты, став местом расположения бюрократического центра, которому была поручена администрация земель к югу от него. За прошедшие века город на воде разросся, превратившись в перевалочную остановку для торговцев, курьеров и путешественников, предлагая широкий спектр товаров и услуг, причём торговцы часто выплывают на лодках навстречу проходящим судам, чтобы продать свой товар. Хотя периодические наводнения могут поставить под угрозу всё сооружение, его жители на протяжении всего существования постепенно ремонтировали и заменяли его ветшающие части. В результате от первоначального сооружения мало что осталось, если вообще осталось хоть что-то, и даже первые несколько комплексов замен уже практически отслужили свой срок."

 building_type_01_sophocos: "Софокос"
 building_type_01_sophocos_desc: "1001 ступень Софокоса, по мнению [Concept('ritualism','ритуалистов')|E], — это лестница в небо. Или, по крайней мере, неоднозначная и крайне оспариваемая концепция того, что большинство учёных-ритуалистов считают местом истинного духовного просветления.\n\nСогласно ритуалистским сказаниям, на Софокос, великий [Concept('the_towers','Шпиль')|E], впервые поднялась группа из ста паломников, совершивших восхождение на вершину по призыву ангелов. На каждой ступени высотой в человеческий рост они сталкивались с новым испытанием и выходили из него с новым пониманием того, как лучше жить, чтобы достичь совершенства. Правда это или нет — ещё одна тема для жарких споров среди богословского класса ритуалистов, однако Шпиль в любом случае остаётся внушительным зрелищем."

 building_type_01_star_tower: "Пиргон то Анатокион Астерон"
 building_type_01_star_tower_desc: "Построенные Аавтократией Тейссией в конце [chaos_of_the_seventh_century|E] века и в последующий Золотой век [aversaria|E], Башня Восточных Звёзд и Башня Горы (ныне Башня Тейссии) ранее принадлежали аверсарскому дворянину, ставшему [Concept('liches','личам')|E], по имени Темос. После поражения Темоса от рук Тейссии и их включения в корону, новые восточные провинции Тейссии вскоре стали центром смещения аверсарского центра силы из Этепезеи и Малькоиса в Аироной и Опахасию.\n\nВозведённые для защиты новой столицы Асиуполиса и прекращения угрозы пиратства для столицы и северных провинций Аверсарии, две башни были построены на древних руинах и возвышаются выше почти любого другого аверсарского сооружения. Благодаря целой системе оборонительного снаряжения, собственным гарнизонам и внушительной серии цепей, которые можно легко опустить для перекрытия пролива, в тени этих башен вырастали целые города."

 building_type_01_statuefacingwest: "Древняя статуя"
 building_type_01_statuefacingwest_desc: "Никто не знает о происхождении этой великой статуи, обращённой на запад, к перевалам через Чёрные горы. Носящая мантию фигура оставлена безликой; восседая на троне из чёрного камня, она непринуждённо указывает своим посохом в сторону [Concept('chevalie','Маршей')|E].\n\nМногочисленные религии и культуры объявляли её своей, хотя ни одной не удалось доказать это убедительно.\n\n[Concept('aversaria','Аверсарские')|E] археологи веками вели жаркие споры вокруг этой статуи. Многие утверждают, что она представляет собой изваяние Непорочнейшего, созданное Первыми Людьми, однако это означало бы, что первоначальные границы распространения аверсарской культуры на протяжении нескольких тысячелетий были в разы шире, чем считалось ранее."

 building_type_01_stone_battlefield: "Каменное поле битвы"
 building_type_01_sunarsarwena_gardens: "Святилище Сунарсарвены"
 building_type_01_sunarsarwena_gardens_desc: "Возведено в честь [Concept('aversaria','аверсарской')|E] принцессы Сунарсарвены, жены мамура Юсуфа и матери мамуров Муктафи и Ка'има. Небольшое окружённое стеной святилище уютно расположилось в уголке зелёного луга Иклувад."

 building_type_01_sunkentower: "Затонувшая башня"
 building_type_01_sunkentower_desc: "С виду обычное древнее двухэтажное строение, выступающее из болот Конийкменира, оказавшееся, благодаря изысканиям [Concept('aversaria','аверсарского')|E] археолога Детина Кафаникса в 1171 году, одним из великих [Concept('the_towers','Шпилей')|E], что возвышаются по всему миру как места [Concept('magic','магической')|E] силы. Детин с помощью науки и магии предположил, что Шпиль насчитывал бы около ста этажей, если бы его откопали.\n\nРазумеется, как впоследствии узнал Кафаникс, Шпиль всё ещё активен, пусть и погребён под землёй. Любое живое существо, приближающееся к нему, погибает от остановки сердца, а болото стремительно затягивает его в пучину; при этом многие из трупов, покачивающихся под болотными водами вокруг Башни, одеты в одежды, выдшие из моды тысячи лет назад."

 building_type_01_tabik_betemisit: "Табик Бетемисит"
 building_type_01_tabik_betemisit_desc: "Построенный Эшво в приготовлении к возвращению Всевышнего, Пустой дворец возвышается как памятник веры могоуай и [Concept('boqqarut_damotada','Боккарута')|E], что ее закрепил. Возвышаясь над окружающим городом, само здание представляет собой внушительный архитектурный подвиг с грандиозными колонными залами и куполами, превосходящими всё, что можно было увидеть где-либо ещё в регионе, особенно во времена его постройки.\n\nХотя официально дворец пустовал, на самом деле в нём жили сменявшие друг друга боккары, поддерживавшие его в качестве наместников, ожидающих Его возвращения. С веками, по мере того как в руках этих правителей накапливались богатства, он всё больше инкрустировался редкими драгоценными камнями и драгоценными металлами, которые и по сей день остаются знаками богатства Боккарута. После того как Дамота погрузилась в хаос во время [etami_tetenik|E], массивное сооружение осталось нетронутым: сменявшие друг друга завоеватели города стремились сохранить его, надеясь использовать как инструмент для обретения легитимности."

 building_type_01_the_first_claw: "Первый Коготь"
 building_type_01_the_first_claw_desc: "Крепкая крепость, защищённая множеством стен, сооруженных из самых разных материалов, Первый Коготь воздвигнут на мысе, прикрывающем вход в залив Бронзовой Гавани.\n\nИзвестная в литературных произведениях как «Пышный первый взор на Бронзовое море и Лазурное небо», эта цитадель отмечает место, где знаменитая катунская исследовательница Цзяо Ду впервые вступила на берега Дахангона, предвещая начало многовекового катунского освоения этого региона.\n\nЗа прошедшие годы сменявшие друг друга верховные министры [Concept('bureau_bronzeport','Бронзовой Гавани')|E] застраивали первоначальный деревянный форт, превратив Первый Коготь в внушительное сооружение, служащее первой линией обороны города от морских захватчиков и налётчиков."

 building_type_01_the_second_claw: "Второй Коготь"
 building_type_01_the_second_claw_desc: "Завершая пару «Драконьих когтей», защищающих [Concept('bureau_bronzeport','Бронзовую Гавань')|E], Второй Коготь аналогичным образом расположен на мысе, охраняющем близлежащий залив.\n\nНесмотря на то, что он меньше и менее укреплён, чем Первый Коготь, рельеф местности позволяет крепости иметь более широкое основание, что позволяет разместить в ней большое количество солдат — особенность, благодаря которой она получила поэтическое прозвище «Младший камень, рождающий бронзовые листья»."

 building_type_01_ten_trees: "Десять Деревьев"
 building_type_01_ten_trees_desc: "Поляна в живых лесах Калатипсоми на протяжении поколений была известна местным деревенским жителям как «Десять Деревьев» — названная так из-за десяти сосен, возвышавшихся друг над другом по (приблизительному) кругу дольше, чем любой из ныне живущих людей думал записать. В этом месте нет ничего истинно мистического, и в лучшем случае оно служило скромным святилищем для различных племенных верований, которые в тот или иной момент считали эту местность своим домом. Для большинства из тех, кто знал о ней в истории, поляна была не более чем ориентиром для путешественников, природным аналогом придорожного указателя — до тех пор, пока в её окрестностях не произошла знаменитая [battle_of_ten_trees|E]."

 building_type_01_tenenae: "Тененае"
 building_type_01_the_eye: "Око"
 building_type_01_the_eye_desc: "[gh_agionists_the_eye_concept|E]"

 building_type_01_the_minteries: "Монетные дворы"
 building_type_01_the_minteries_desc: ""

 building_type_01_thebloodyard: "Эфоусамартас"
 building_type_01_thebloodyard_desc: "Кровавый двор — это древнее сооружение до[Concept('aversaria','аверсарской')|E] постройки, созданное, по-видимому, исключительно для пыток и казней как людей, так и животных. Хотя даже аверсарцы видят в нём место жестокости и боли, оно, тем не менее, регулярно использовалось аверсарскими [magi|E] вплоть до IV века.\n\nЕго огромные палаты для сбора крови со временем были заброшены и по большей части превратились в руины. Так продолжалось до [Concept('imperial_civil_war','Гражданской войны')|E] между Эшраесом и Аксиотеей, когда сооружения были вновь открыты и затем активированы Эшраесом. Именно отсюда Эшраес почерпнул силу для сотворения [frodbrokna|E], принеся в жертву тысячи рабов, слуг и даже собственных солдат, чтобы сотворить заклинание, положившее конец миру.\n\nС крушением Ораиспольской [Glossary('Аавтократии','GH_AAUTOKRATA_GLOSS')] местные жители вместе с несколькими восставшими военными отрядами уничтожили комплексы Кровавого двора, и теперь он представляет собой лишь молчаливое свидетельство жестокости, приютившее бесчисленных духов и обладающее значительной магической силой."

 building_type_01_theeffigy: "Жертвенное место"
 building_type_01_theeffigy_desc: "Именно здесь таинственный культ, занимающий острова, по всей видимости, приносит в жертву животных и материальные вещи своему загадочному толкованию Непорочнейшего и Первых Людей. Любое обвинение в том, что они приносят в жертву людей, особенно со стороны тех, кто задаёт слишком много вопросов, просто абсурдно. Мужчины и женщины в жутких звериных масках, которые сейчас неподвижно смотрят на вас, пока вы задаёте эти вопросы, обязательно убедят вас в обратном; только не покидайте остров, пока они готовят место проведения ритуала, пожалуйста."

 building_type_01_thesorrowfield: "То Педитлипси"
 building_type_01_thesorrowfield_desc: "Поле Скорби — это древние останки столицы ийросского народа, чьё название было стёрто веками [Concept('aversaria','аверсарского')|E] гнёта. Проявление жестокой аверсарской злобы и памятник безумной мощи, ставшей результатом совместной работы тысячи аверсарских [magi|E], желавших доказать свою силу, — первоначальная столица, погребальные курганы древних королей, дворец и даже сами жители остаются на своём месте.\n\nОни так и застыли в свои последние мгновения: земля под ними и строения вокруг вырваны камень за камнем и парят в воздухе. Из глубин земли, через трещины далеко внизу, вырываются столбы пламени, охватывающие всё вокруг. В таком состоянии они простояли более тысячи лет, застыв в свои последние секунды, даруя каждому прохожему идеальный обзор финальных мгновений Ийроссии.\n\nЛюбой, кто попытается войти туда, мгновенно погибает. Поскольку первоначальное заклинание было утеряно во времени, современным учёным остаётся лишь гадать о причинах. Быть может, внезапный сдвиг гравитации и состава воздуха при переходе из настоящего в прошлое слишком губителен? Или изгиб реальности слишком узок для человека? Или же скрытая [Concept('magic','магическая')|E] сила в этой области является стремительным ядом? Скорее всего, никто и никогда не узнает наверняка."

 building_type_01_thewatchers: "Стражи"
 building_type_01_thewatchers_desc: "Стражи — это несколько древних статуй, высеченных на склоне северных Тарсанид. Двенадцать фигур, застывших в молитве, любви и битве: хотя их конструкция проста, детализация их поз и движений невероятно точна, а сами статуи огромны — одни лишь ступни размером с человека.\n\nМножество религий истолковывали их по-разному и объявляли своими святынями, совсем недавно это сделали [Concept('wardenism','вардениты')|E]. Критические трактовки их происхождения и значения сильно разнятся: от [Concept('aversaria','аверсарских')|E] учёных, утверждающих, что это фантастическое изображение древней войны, в которой одна из сторон представлена [Concept('aelfir','чужеродной')|E] расой, до [Concept('ritualism','ритуалистской')|E] веры в то, что это иносказательное изображение восхождения по 1001 ступени [GetBuilding('01_sophocos').GetName]."

 building_type_01_thousand_hero_circle: "Круг Тысячи Героев"
 building_type_01_thousand_hero_circle_desc: "Обязательное место посещения во многих паломничествах по островам, Круг Тысячи Героев — общее название обширного религиозного комплекса в северных холмах Абдсини, ставшего домом для более чем тысячи столбов, воздвигнутых по всему ландшафту. Каждый из них представляет одну из многих легендарных фигур из множества культов героев и древних верований, для которых острова являются домом, или — в некоторых случаях — из мифов удивительно далёких берегов. Местные последователи Благоволимых, как известно, возвращаются из своих долгих паломничеств с историями о великих людях, которые затем увековечиваются возведением нового столба, посвящённого часто искажённому образу ныне почитаемого героя."

 building_type_01_tiwu_anaan_mines: "Шахты Тиву Анаан"
 building_type_01_tiwu_anaan_mines_desc: "Шахты Тиву Анаан с незапамятных времён были главным источником меди для Кемсара, а стелы многих правителей усыпали окружающий пейзаж настолько густо, что он имеет не меньшую археологическую ценность, чем минеральную. Когда бронза всё ещё безраздельно господствовала как металл войны, залежи непрестанно разрабатывались для соединения с оловом, ввозимым из неизвестного источника далеко на юге. С появлением железа их значение значительно снизилось, хотя они никогда не были заброшены окончательно — даже когда Кемсар сгорел дотла после Битвы Сломанной Цепи."

 building_type_01_tomb_of_the_lost: "Грубонец Заргабоных"
 building_type_01_tomb_of_the_lost_desc: "Гробница Затерянных — скромное сооружение, построенное беженцами из Оейеники. В то время как уроженцы севера поклоняются чтимым мертвецам и верят, что долг живых — сохранять кости усопших, дабы их духи защищали свои семьи и дома, вторжение [liches|E] и [sorrowing_of_oejeynica|E] давно лишили их этой возможности.\n\nВ Гробнице Затерянных, в попытке хоть как-то примирить эти верования с реальностью или просто принести некоторое утешение, усопшим вместо этого устанавливают памятные знаки рядом с их урнами. Даже если их тела не удаётся сохранить, быть может, получится сохранить хотя бы память о них."

 building_type_01_tomb_of_the_suns: "Гробница Солнц"
 building_type_01_tombofthesaints: "Тафон то Агионис"
 building_type_01_tombofthesaints_desc: "Гробница Святых, хоть и не является фактическим местом упокоения всех восьми агионистских святых, представляет собой, пожалуй, один из самых святых памятников их жизни и деяниям. Самая поразительное черта гробницы — её строгость: восемь гробниц покоятся в простой гранитной часовне, где нет ничего, кроме таблички с именем каждого из них.\n\nИ это не от недостатка почитателей или пылкости, ибо всего в нескольких шагах по скромной булыжной дороге, ведущей к часовне, находится грандиозный Собор Всех Святых, служащий главной богословской резиденцией агионистских орденов и вмещающий крупнейшую общину верующих в [aversaria|E]. Нет, гробница строга потому, что, несмотря на современные учения о том, что Святые — лишь реинкарнации Непорочнейшего и Первых Людей, в глубине души истинные верующие знают главную заповедь Святых. Выполнять свой долг и творить добро для других доступно каждому простому человеку — или, как однажды сказал Катаритос: «Будь верен своему сердцу и найди в нём любовь»."

 building_type_01_tower_golden_seeker: "Башня Золотых Искателей"
 building_type_01_tower_golden_seeker_desc: "Башня Золотых Искателей — цитадель, построенная древними калатипсомийцами ещё до первого века с использованием магических рун для зачарования её стен. Единственный способ пробраться в саму крепость — через систему пещер и залов под утёсом, на котором она стоит. Пещеры совершенно иного происхождения, чем сама Башня, и предшествуют известной истории; некоторые даже предполагают, что они могут вести в подземный [mayikrata|E].\n\nВ VII веке башня заслужила как имя, так и славу, когда [Concept('marchers','марочникский')|E] рыцарский орден «Сестёр-мирянок Золотого Искателя, Путесвятого Раноса», обосновавшийся на острове, оказался в осаде [Concept('aversaria','аверсарских')|E] захватчиков в одной из кульминационных битв [marcher_aversarian_wars|E]. Сёстры вместе с местными жителями сдерживали огромные силы аверсарцев более шести лет, пока наконец не пали от голода. Хотя защитники были объявлены Путесвятыми, а остров заселён марочниками, он всё равно остался завоёванным. Эта утрата, как бы о ней ни помнили, стала мрачным шоком для тогдашнего (претендента) верховного короля Гидмонда и сделала его амбиции по захвату северного берега реки Патос невыполнимыми, фактически положив конец войнам."

 building_type_01_towers_of_pytheceas: "Башни Пифея"
 building_type_01_towers_of_pytheceas_desc: "Напротив берегов Пифеея из моря возвышаются не подверженные времени сооружения — остатки чужеродного мегаполиса, поглощённого волнами, строители которого давно забыты. Наиболее примечательными среди руин являются поросшие мхом башни различной высоты. Хотя некоторые из них оказались полностью затоплены и скрылись под водой вместе с большей частью города, ко многим всё ещё можно добраться через их верхние ярусы. Их величественные масштабы и архитектура из чёрного камня резко контрастируют со сравнительно примитивными постройками островных поселений, вдохновляя мифы о древних создателях и утраченном веке славы. Разграбленные и опустошённые за свыше чем тысячелетие, башни давно утратили своё первоначальное предназначение и смысл. Захваченные островитянами, теперь они служат святилищами и жилищами для элиты."

 building_type_01_turayyil_mines: "Серебряный рудник Тураййиль"
 building_type_01_turayyil_mines_desc: "Серебряный рудник Тураййиль был открыт недавно: добыча началась только под эгидой [Concept('aversaria','аверсарского')|E] губернатора Тетедакса «Златоноса» в 943 году от И. С. Учитывая огромные размеры провинции Аироной и отсутствие поблизости безопасных судоходных рек, горнодобывающие предприятия полагались на медленную и уязвимую сухопутную транспортировку для отправки своей добычи в безопасные аверсарские порты на побережье. Поэтому губернаторы Аироной сильно зависели от местных защитников из племен ольтени и кикарсаг, поддерживавших производительность и прибыльность их самого ценного актива. Взамен они получали долю добычи, которая широко расходилась по всей степи для изготовления религиозных масок, популярных у обоих народов."

 building_type_01_umlojtemplecomplex: "Завет Умлоджа"
 building_type_01_umlojtemplecomplex_desc: "Завет Умлоджа был заключён в 633 году после жестокого восстания местных хулавитов и [Concept('ritualism','ритуалистов')|E] против местной [Concept('wardenism','варденитской')|E] администрации. Умлож по странной воле судьбы стал приютом для двух десятков различных религиозных сект и более тридцати культов, и к восстанию быстро примкнули многие из них в знак протеста против того, что расценивалось как репрессивные попытки обращения со стороны властей.\n\nВскоре после этого был подписан мир, и Умлож был объявлен свободным городом для всех религий (при условии уплаты надлежащих налогов, разумеется). С тех пор «Завет Умлоджа» стал одной из самых мультикультурных областей в мире, гордящейся таким количеством храмов, часовен и соборов, которое угрожает превзойти число обычных домов в городе. Религии столь же распространенные, как варденизм, и столь же загадочные, как Погребальное право Ойчизны, сосуществуют здесь в относительном мире, а конфессиональное разнообразие оказалось огромным благом для торговли."

 building_type_01_universityofgiherehalwajaf: "Манзи Альфайсуфи"
 building_type_01_universityofgiherehalwajaf_desc: "«Дом Философа» — прозвище величайшего университета [sarradon|E]а; Манзи Альфайсуфи находится в том или ином управлении уже более двух тысячелетий.\n\nОснованный философами ныне забытой религии, кампус дал жизнь многим великим писателям, мыслителям и изобретателям в истории Саррадона, а также многим из его величайших [magi|E]. Однако, несмотря на это, университет остался относительно небольшим: века войн и Век Огня нанесли свой урон комплексу."

 building_type_01_velostadd: "Велостадд"
 building_type_01_velostadd_desc: "Великий храм, посвящённый [Glossary('Велосу','VELOS_GLOSS')], Велостадд был создан совместными усилиями нескольких сьяльвольки правящих родов, чтобы освятить свои новые владения во имя их высшего бога. Построенный на месте древнего храма, предшествовавшего даже [Concept('aversaria','аверсарскому')|E] владычеству, наиболее примечательной чертой храма, помимо его (по меркам сьяльвольки) массивной конструкции, является Зелёный Свет. Когда луна (или то, что от неё осталось) входит в полную фазу, яркий свет вырывается из колонны в древнем святилище и устремляется к парной колонне на загадочном алтаре в центре озера Миграддр. Хотя никто так и не постиг предназначение этого явления и не нашёл ничего интересного под Велостаддом или на Миграддре, это по-прежнему впечатляющее зрелище, которое провидцы, населяющие ныне эти чертоги, считают божественным знаком."

 building_type_01_vilunnak_mines: "Вилуннак Сатра"
 building_type_01_vilunnak_mines_desc: "Расположенный в затопленной речной долине, горнодобывающий комплекс в Вилуннак Сатре производит наибольшее количество алмазов и менее ценных драгоценных камней в Каширии. Название, означающее «Поле Звёзд» на местном диалекте, восходит к легенде о том, что минеральные богатства этого места возникли в результате древней битвы: могущественный [magi|E] призвал падающую звезду, чтобы поразить своих врагов. Маг выиграл битву, а поле, где стоял его противник, превратилось в обугленную равнину, усыпанную астральными самоцветами. Сегодня вилуннакские алмазы украшают короны многих каширийских монархов, а безделушки, инкрустированные этими ослепительными камнями, ценятся по всему востоку."

 building_type_01_vounill: "Воунилл"
 building_type_01_vounill_desc: "Солнечная гора — великий храм, высеченный в скалах горы Синтроллиас. Считающийся святым местом для [Concept('aversaria','аверсарцев')|E], он, по преданиям, служит домом для ордена воинов-жрецов и жриц Алого Избранника: они живут в прославленных залах храма и могут прозревать будущее, наблюдая за тем, как солнце восходит и заходит над Синтроллиасом. Вокруг великого храма расположены смотровые площадки и небольшие часовни с тропами и мостами, ведущими на другую сторону горной вершины для вечерних наблюдений. Тысячи паломников ежегодно совершают путешествие, чтобы получить пророчества, хотя в сам храм могут входить только члены Алого Избранника.\n\nНа склоне горы возвышается статуя Непорочнейшего — самая большая статуя в мире. Даже аверсарцы не могут приписать себе её создание, утверждая взамен, что только сам Непорочнейший мог сотворить подобное. Однако после [frodbrokna|E] она стоит разрушенной, а падшие государства Аверсарии не могут даже мечтать о её восстановлении."

 building_type_01_walls_of_qarmuz: "Стены Кармуза"
 building_type_01_walls_of_qarmuz_desc: "Ещё до начала письменной истории Кармуз был защищён стенами древней постройки; древние обереги от [magic|E] делают эти стены практически неразрушимыми. Скромные с виду, эти внушительные укрепления сокрушили немало потенциальных завоевателей и долгое время пользовались репутацией неприступной позиции для отступления. Наиболее известно то, что Кармуз служил столицей [regency_of_karadun|E], одного из величайших ритуалистских государств во время [war_in_heaven|E]."

 building_type_01_wehydkaha: "Вехидка'ха"
 building_type_01_wehydkaha_desc: "Вехидка'ха — древний центр кемсарской [magic|E]. Древнее место силы, высоко возведённый алтарь и окружающая его ритуальная площадка были, по преданию, построены над древним провалом, уходящим к самому центру планеты. Именно здесь кемсарцы углубляли своё понимание магии и черпали силу; в период своего расцвета это место постоянно укрывало более сотни [magi|E], сосредоточенных на постижении магии своего народа.\n\nИменно здесь Битва Сломанной Цепи положила конец великой империи ран кемсарцев. Их амсарские рабы восстали и захватили это место вместе со всей его любовью и силой, чтобы осушить великую речную долину, на которой ран кемсарцы построили свою империю, и перенаправить её на север. С тех пор оно остаётся важным местом для амсаров, которые видят в нём святыню, где они обрели свободу, а также священное место силы."

 building_type_01_westerncabal: "Бай Алькурати"
 building_type_01_westerncabal_desc: "Бай Алькурати — бывшая штаб-квартира куратийского ковена [magi|E]. Относительно незначительный ковен, Курати оставался в тени по сравнению с более престижными [Concept('ritualism','ритуалистскими')|E] магическими сектами своей эпохи; его считали лишь временным кружком, не предназначенным для величия или серьёзных успехов в эпоху, прозванную «Золотым веком [Concept('sarradon','саррадонской')|E] магии».\n\nОднако, несмотря на это, именно маги Курати открыли древние секреты [selfreplicating_blood_magic|E] примерно в то же время, что и их соперники из [Concept('wardenism','варденитского')|E] ковена Альмади. Как знает каждый саррадонец, это привело к катастрофе, и сегодня Бай Алькурати стоит как заброшенный памятник эпохе, которая началась как золотой век, но закончилась как «Век Огня». Могила для Курати и для 80% всех магов Саррадона того времени."

 building_type_01_westtower: "Пустынный шпиль"
 building_type_01_westtower_desc: "В отдалённом уголке [Concept('sarradon','саррадонской')|E] пустыни возвышается зловещий [Concept('the_towers','Шпиль')|E]; его обвеянные песками, иссиня-чёрные камни служат свидетельством непостижимой древности. [Glossary('Ран Кемсарцы','GH_RAN_KEMSARI_GLOSS')] знали об этом месте во времена своего расцвета, и, по слухам, использовали его как площадку для многих тёмных ритуалов. Амсарцы тоже знают о нём, но со своей стороны предпочли держаться подальше. Кто именно контролирует Шпиль, редко бывает понятно, поскольку странные, тёмные группы приходят и уходят подобно дюнам окружающей пустоши. Самые отчаянные искатели приключений отправлялись сюда в поисках воображаемых богатств — и далеко не все вернулись назад."

 building_type_01_whitegoldpalace: "Ханхе Пеашмбра"
 building_type_01_whitegoldpalace_desc: "Обитель Пророка — грандиозный дворец, из которого правители Амсарского Хиклана вели свой народ на протяжении поколений. Массивный комплекс, вмещающий в себя всё: от крупнейшего в мире тронного зала, более чем сорока садов и почти сотни фонтанов, наполненных всем — от воды до вина, до сотен слуг и бюрократов, постоянно снующих туда-сюда, чтобы лучше служить крови Пророков и [Concept('amsar','державе')|E] в целом. Пожалуй, наиболее интересны грандиозные фрески, украшающие почти каждую стену и подробно описывающие каждую деталь [Concept('gh_zenda','Пророчества')|E], с небольшими свистящими отверстиями вдоль них — говорят, они заставляют фрески произносить слова [Concept('gh_the_amsari_prophet','Пророка')|E], когда ветер касается дворца."

 building_type_01_yaawdetmaw: "Пасть Яавдет"
 building_type_01_yaawdetmaw_desc: "Пасть Яавдет находится на месте бывшей Академии Рейтагал ра Яавдет для исследователей [magic|E] и науки. Хотя подавляющее большинство записей утеряно, принято считать, что Пасть образовалась во время экспериментов с неясным заклинанием, способным передавать мысли через комнату. В результате на потолке самой высокой исследовательской башни возник огромный портал, мгновенно заполнивший лабораторию красным песком и удушивший всех внутри. За считанные минуты вся Академия была захвачена, когда песок пробил стены и обрушил здания.\n\nПопытки закрыть портал не увенчались успехом: местным правителям пришлось согнать сотни копателей, чтобы сдержать постоянно растущую гору песка. Солдаты охраняют периметр от ужасающих монстров, таящихся под ним. Несмотря на опасность, это популярное место среди искателей приключений: утраченные знания Академии бесценны, а вместе с песком прибыли могущественные реликвии из далёкой страны."

 building_type_01_zakran_mines: "Закранские шахты"
 building_type_01_zakran_mines_desc: "Горнодобывающий комплекс у подножия Закранского хребта действовал как минимум со времён Первого Междуцарствия Кемсара, когда дом Себхенаф активно использовал его для финансирования своих, казалось, бесконечных конфликтов с западными соперниками. Он сохранил своё значение и после воссоединения Кемсара, оставаясь основным источником серебра на протяжении всей последующей истории империи.\n\nОднако после Битвы Сломанной Цепи рудник был захвачен новорождённой империей Айяр и с тех пор подпитывал большую часть её экономики."

 building_type_02_aironoiakaan: "Майикпрололлан Аиронойакаан"
 building_type_02_aironoiakaan_desc: "Аиронойакаан, или [Concept('mayikprolollans','Майикпрололлан')|E] Аиронойакаан, — магическая академия, основанная [Concept('aversaria','имперской')|E] претенденткой Аутэкратией Аксиотеей в качестве прямого вызова господству [Concept('pathosixyic_academies','западных академий')|E]. Считается, что она также была создана для получения сведений о [selfreplicating_blood_magic|E], и на протяжении нескольких лет её члены были сосредоточены на исследовании апокалиптического [Concept('sarradon','саррадонского')|E] заклинания.\n\nАкадемия столкнулась счайшей угрозой своему существованию во время [blue_robe_revolt|E], приведшего к гибели её правящего совета. Несколько месяцев спустя Аиронойакаан прекратил своё существование в результате [frodbrokna|E]: восставшие Синие Мантии и большинство оставшихся членов академии были испепелены заклинанием, которое они отказались исследовать.\n\nНыне восстановленный в своём прежнем величии, Аиронойакаан наконец исполнил свою роль центра магических изысканий на востоке, затмив собой даже легендарные [Concept('vidvakastilaya','университеты')|E] Каширии."

 building_type_02_bastards_run: "Путь Бастарда"
 building_type_02_bastards_run_desc: "Проведя тридцать лет в качестве удалой искательницы приключений, наёмницы и любительницы женщин, совершившей множество легендарных подвигов от Калатипсоми до [the_lichdoms|E], Джейла прославилась тем, что примкнула к соратникам [champion_of_chevalie|E] и помогла им одолеть [arch_lich|E] [silas_stavro|E]. Когда вторжение окончилось, она ушла на покой в родном [peti_gisredde|E], где сразу же (знаменито выбив двери в залы совета) потребовала (и получила от перепуганного канцлера) рыцарство от [council_of_gisredde|E]. Удовлетворенная тем, что у неё наконец появился титул, она купила таверну на Пути Бастарда.\n\nЗаведение сэра Джейлы с тех пор стало оплотом [Concept('peti_gisredde','пети-жисреддинской')|E] культуры, и хотя самой Джейлы уже нет рядом, чтобы разгонять или возглавлять очередную драку, таверна остаётся одной из самых известных таверн Шевалье. Здесь можно встретить авантюристов всех мастей: десятки знаменитых отрядов искателей приключений и наёмных компаний впервые сформировались именно у Джейлы по указке таинственных незнакомцев и напуганных девиц.\n\nТолько не заказывайте «Фирменное от Джейлы»! Эта дрянь способна укокошить даже лича."

 building_type_02_calmensons_crest: "Гребень Кальменсона"
 building_type_02_calmensons_crest_desc: ""

 building_type_02_champion_grounds: "Площадь Чемпионов"
 building_type_02_champion_grounds_desc: "Площадь Чемпионов, или Протошлити, — великая крепость, где XLII легион «Гордость Аверсарии» обучал самых выдающихся новобранцев Державных легионов [Concept('aversaria','Аверсарии')|E]. Те, кто прошёл подготовку в Протошлити под руководством почитаемых инструкторов, сами с высокой вероятностью становились чемпионами, и истоки подвигов многих легендарных героев Аверсарии в рядах легионов берут своё начало в этих стенах.\n\nБлагодаря щедрой поддержке Протошлити был восстановлен до состояния, предшествовавшего его разрушению войсками Аутэкратира Эшраеса. Обширные тренировочные площадки очищены от обломков, великая стена крепости отремонтирована и укреплена, а казарм построено достаточно, чтобы вместить до трёх легионов. Хотя XLII легион давно ушёл в историю, многие ветераны легиона всё ещё живы, и обещания золота вместе с отдыхом достаточно, чтобы убедить их обучать новое поколение легионеров."

 building_type_02_crow_gate: "Ворота Воронов"
 building_type_02_crow_gate_desc: "Восстановленные Ворота Воронов вновь возвышаются как грозное оборонительное сооружение, защищающее сердце Кемсара. Хотя они никогда не сравняются с былым величием, восточные ворота без сомнения гарантируют, что Цитадель больше никогда не столкнётся с подобным ужасом."

 building_type_02_dielecport: "Дилекпорт"
 building_type_02_dielecport_desc: "Дилекпорт когда-то был важнейшим конийкменирским портом за пределами их родины. Будучи домом для Достопочтенной Королевской Торговой Хартии Оранжевого Совета и Путесвятых Монет ВИНКВСБППИЕП, одной из самых богатых торговых компаний в [aversaria|E], Дилекпорт стал основным портом, через который большая часть торговли устремлялась с юга на [Concept('marchers','шевальерский')|E] материк, а Достопочтенная Королевская Торговая Хартия сохраняла почти эксклюзивное право на импорт из Аверсарии на протяжении большей части своего существования.\n\nС возвращением конийкменирского контроля над Дилеком, Дилекпорт возродился. С восстановлением Королевской Торговой Хартии местные купцы — и, разумеется, правящие власти — снова получают огромную прибыль."

 building_type_02_four_cliffs_five_walls: "Великие укрепления Халкамахоса"
 building_type_02_four_cliffs_five_walls_desc: "Город Халкамахос, или Халкама для [Concept('wardenism','варденитов')|E], построен на вершине массивного комплекса земляных валов неизвестного происхождения, расположенных друг над другом четырьмя концентрическими кольцами. В общей сложности основание этой необычного вида горы составляет около пятнадцати километров в диаметре, а высота каждого обрыва составляет ровно пять метров. Что ещё страннее, на вершине бьют три довольно обильных источника, которые текут даже во время засухи — результат древней и могущественной магии, чьё происхождение столь же загадочно, как и рукотворные утесы.\n\nВ ходе недавних строительных работ город был дополнительно укреплен: возведены две внешние стены. Первая — на некотором отдалении от нижнего кольца утёсов для защиты ценных пастбищ и цистерн, а вторая — для укрепления самих утёсов первого яруса в местах их обрушения или проседания. Поистине внушительная цитадель."

 building_type_02_gisreddeport: "Жисреддепорт"
 building_type_02_gisreddeport_desc: "Жисреддепорт на памяти всех живущих был центром северной торговли и сердцем [Concept('marchers','шевальерской')|E] культуры. Великие доки и пирсы из чёрного камня выполнены в чужеземном архитектурном стиле древними зодчими, неизвестными даже самым искушённым учёным. Среди них и вокруг них расположились десятки других сооружений, возведённых за века расширения Вальгедока вдоль побережья. По сей день порт укрывает один из крупнейших военно-морских флотов в мире, и каждый день сотни кораблей из [chevalie|E] и со всего света швартуются у его таинственных пирсов, чтобы торговать и пополнять знаменитые городские рынки."

 building_type_02_gurardport: "Гурардпорт"
 building_type_02_gurardport_desc: "Отвоёванный конийкменирцами, Гурардпорт был восстановлен и расширен далеко за свои прежние границы. Вновь став центром торговли в Клановых землях, порт теперь служит главной точкой, из которой весь конийкменирский торговый поток устремляется на восток, вглубь континента, или на запад, обратно на родину."

 building_type_02_jackal_gate: "Ворота Шакалов"
 building_type_02_jackal_gate_desc: "Восстановленные Ворота Шакалов вновь возвышаются как грозное оборонительное сооружение для защиты сердца Кемсара. Хотя они никогда не вернут былого величия, северный проход останется неприступным — с драгоценностями или без них."

 building_type_02_jans_market: "Рынок Яна"
 building_type_02_jans_market_desc: "«Безумный» Кастос (как он сам себя прозвал) — [Concept('aversaria','аверсарский')|E] [magi|E], прибывший в [peti_gisredde|E] в 844 году от И. С. Хотя местные жители относились с... скепсисом к лавке магических товаров, управляемой безумным аверсарским магом в [chevalie|E], они проявили куда большую благосклонность к двум баржам, доверху наполненным монетами, которые Кастос каким-то образом украл из имперской казны и магией привел в Пети-Жисредде. На вопрос, почему именно Пети-Жисредде, Кастос ответил: «Потому что именно здесь разбились корабли!» (имея в виду три купеческих судна, которые Кастос протаранил, потопил, а затем оплатил по прибытии, потеряв управление в поле [antimagic|E]).\n\nКастос смог — каким-то образом не используя заклинаний — дожить до ста двух лет и превратить «Удивительные диковины Безумного Кастоса» в главное место назначения для любого авантюриста, возвращающегося из [the_lichdoms|E] или желающего испытать удачу с одним из его «магических» мечей (БЕЗ ВОЗВРАТА, БЕЗОПАСНОСТЬ НЕ ГАРАНТИРУЕТСЯ, НО ЦЕНЫ ВСЕГДА ХОРОШИЕ!).\n\nПосле множества прославившихся на всю округу происшествий вроде превращения Кастосом двенадцати вымогателей в лягушек, последовавшего за этим побега (и повторной поимки) из девяти тюрем за три дня или случайной телепортации [machyos_prothex|E] в Кемсар, Безумный Кастос, к прискорбию, скончался. Впрочем, длинная вереница его учеников с гордостью продолжает продавать «относительно безопасные» предметы «относительно понятной» силы по повседневным низким ценам, к неизменному унынию городской стражи."

 building_type_02_karth_tower: "Сторожевая башня"
 building_type_02_karth_tower_desc: "На вершине Армазлинских гор стоит крайне любопытная башня. Достижимая лишь по длинной извилистой горной тропе, полной опасностей, она представляет собой нечто похожее на военный объект. Внутри этого комплекса высоко над землей возвышается большая башня. Что больше всего поразило [Concept('aversaria','аверсарских')|E] исследователей в этом месте, так это его скромный и спартанский вид. Войдя внутрь, они обнаружили бесчисленные скелеты в заржавевших доспехах древнего [Concept('kartharadd','Картараддского Империума')|E]. На вершине башни была найдена огромная телескопическая система, направленная прямо на старые аверсарские земли. Среди исследователей возникли теории о том, как долго существовал этот военный объект и как долго картараддцы вели наблюдение. Вернувшись домой, аверсарские исследователи пытались найти хоть какие-то признаки комплекса или хотя бы разглядеть башню снизу, но она сливается с окружением, словно снежный барс на снегу. После представления отчётов разгорелись масштабные (и противоречивые) научные споры о том, наблюдали ли картараддцы за аверсарцами задолго до того, как они официально «открыли» друг друга — споры, не утихающие и по сей день."

 building_type_02_kasmeze_cathedral: "Разрушенный собор Касмезе"
 building_type_02_kasmeze_cathedral_desc: "Кто первоначально построил великую Цитадель в Касмезе и прилегающий к ней храм — вопрос, на который до сих пор нет однозначного ответа. Большинство учёных сходятся во мнении, что комплекс расцвёл благодаря покровительству императора Партариана около 200 года от И. С., однако всё ещё ведутся споры о том, возвёл ли он основную часть строения или же это сделали отколовшиеся фракции Храма Горного Солнца, как неоднократно предполагалось. В любом случае в последующие два столетия комплекс быстро стал одним из крупнейших и процветающих паломнических мест юга и Аагиократии в целом, соперничая с Воуниллом и Тебастро.\n\nЕго история как крупного духовного центра скоропостижно оборвалась во время [chaos_of_the_seventh_century|E]: сначала в 603 году граф Темос осквернил его ради тайного ритуала, а несколько десятилетий спустя отчаявшееся и обнищавшее губернаторство Опахасии обобрало его до нитки. К концу кризиса собор превратился в выгоревшие руины и из-за общего экономического упадка региона был брошен на произвол судьбы.\n\nВ 1147 году планировалась реконструкция здания, но она сталкивалась с постоянными задержками, пока наконец не началась в 1184 году. Разумеется, этот краткий всплеск оптимизма угас, как только [aversaria|E] погрузилась в [imperial_civil_war|E]: место снова бросили, а восстановление осталось завершённым лишь наполовину."

 building_type_02_korkivo_port: "Порт Коркиво"
 building_type_02_korkivo_port_desc: "Главный торговый город в регионе, известном как «Красные земли», — это старый оживлённый [Concept('aversaria','аверсарский')|E] порт Коркиво к югу от столицы Асуиполи и к западу от богатств Каширии. С уходом [frodbrokna|E] и падением Аверсарии местные купцы вырвали контроль из рук имперских военачальников. Получившие власть торговцы оказались в идеальном положении для монополизации торговли с востока на запад. Ибо купцы надеются продавать не только дальние товары, но и новую оранжевую пряность — тщательно охраняемый секрет Красных земель. Ходят слухи, что её вдыхание вызывает «пророческие видения», однако учёные пока не подтвердили это утверждение.\n\nИ хотя этот город обладает заветной монополией, в темноте шепчутся о том, что прежние аверсарские инвестиции преследовали куда более зловещую цель. Красные земли могут быть враждебны к чужакам, но это никогда не останавливало молодых юношей и девушек от использования Коркиво как стартовой площадки для распространения «доброго» слова — практика, которая лишь расширилась, когда аверсарцы стали вливать в порт всё больше денег."

 building_type_02_last_standers_street: "Улица Последних Защитников"
 building_type_02_last_standers_street_desc: ""

 building_type_02_libraryofzheggarah: "Великая библиотека Жеггары"
 building_type_02_libraryofzheggarah_desc: "Под контролем хулавитов Библиотека Жеггары расцвела и преуспела. Хотя она всегда была источником знаний для всего мира, передовое мышление хулавитских учёных и чиновников привело к масштабному расширению комплекса и значительному улучшению систем хранения. Кроме того, мудрецы-хулавиты путешествуют по всему миру в поисках утраченных знаний для пополнения библиотеки, а официальная поддержка местных властей гарантирует щедрое вознаграждение за любые пожертвования.\n\nВ этом великом храме науки искать и находить нужную информацию стало проще и быстрее, чем когда-либо прежде."

 building_type_02_losttempleofmesbadh: "Месбад Орин'то"
 building_type_02_losttempleofmesbadh_desc: "Под властью хулавитов Потерянный храм наконец начал преображаться. Благодаря огромным раскопкам, медленно расчищающим великий храм, и организованным группам, спускающимся в глубины для раскрытия истинного предназначения Месбад Орин'то, цитадель может наконец явить свои тайны. Каждый день в её древних залах совершаются новые открытия, и это место стало не только ценным объектом для исследований, но и крайне прибыльным предприятием, поскольку даже незначительные артефакты продаются за внушительные суммы лишь из-за места, где они были найдены.\n\nРаскопки в Месбад Орин'то доказали свою огромную ценность как для умов, так и для казны хулавитского народа."

 building_type_02_malcoispalace: "Палат то Митидон"
 building_type_02_malcoispalace_desc: "Дворец Митидон, названный в честь [Concept('aversaria','аверсарского')|E] похода, разгромившего последнего ийросского короля, считается одним из самых скупых и унылых по аверсарским меркам. Несмотря на это, он также является одним из крупнейших — возведённый как грандиозная цитадель, гарантирующая покорение уроженцев долины Малькойс и быстрое подавление любых восстаний рабов.\n\nНесмотря на отсутствие изящества, дворец остаётся массивной и внушительной глыбой северного гранита, с помощью которой аверсарцы веками удерживали местных жителей в повиновении.\n\nБлагодаря усилиям местной администрации Дворец был по большей части восстановлен после разрушений Атовидского возмездия, хотя многие стены всё ещё представляют собой кучи обломков с временными палисадами на них, а несколько башен внутренней стены ещё только предстоит отстроить из-за нехватки средств."

 building_type_02_oasisofgonan: "Оазис Гонан"
 building_type_02_oasisofgonan_desc: "Оазис Гонан — это большой каньон, который в какой-то момент за последние два тысячелетия заполнился водой естественным или искусственным путём. Независимо от происхождения, оазис стал одним из важнейших мест для [Concept('sarradon','саррадонской')|E] торговли и источником жизни для десятков культур. Плодородный оазис вокруг каньона стал обязательной точкой отдыха для путешественников, пересекающих [Glossary('Великую пустыню','sarradonian_desert_encyclopedia_desc')] между севером и югом по пути вглубь континента. За тысячелетия здесь была построена внушительная инфраструктура, дабы давать приют и извлекать выгоду из многочисленных купцов, исследователей и паломников, пересекающих пустынные перевалы."

 building_type_02_orangepalace: "Хюн вер 'т Гроствюрдре"
 building_type_02_orangepalace_desc: "«Обитель Великих Монархов» — традиционная резиденция древних королей конийкменирцев. После Народной революции большая часть интерьера дворца была переоборудована для нового правящего совета дворянства и обширной бюрократии, возникшей вокруг него.\n\nС восстановлением монархии Вудер снова правит из дворца, избавившись от назойливых вопросов народного представительства. Старые покои канцлера давно снесены, чтобы сделать потолки в комнатах Вудера абсурдно высокими и пристроить очаровательный кольцевой балкон."

 building_type_02_palaceofthegoldenmartyrs: "Палат то Хрисо Мартирион"
 building_type_02_palaceofthegoldenmartyrs_desc: "Дворец Золотых Мучеников — официальная резиденция губернатора Опахасии (по крайней мере, она была таковой, когда титул «губернатора» имел хоть какой-то реальный вес). Это прекрасное сооружение, выполненное в традиционных опахасийских белых, золотых, чёрных и пурпурных тонах. Несколько Аутэкратиров в [Concept('aversaria','аверсарской')|E] истории жили здесь во время правления из Аироной или Ораисполя, наслаждаясь роскошью дворца в летние месяцы.\n\nНеизвестно, как дворец получил своё название, хотя недавние археологические находки храмового комплекса, погребённого под зданием, заставили многих аверсарских историков поверить, что изначально это могло быть названием монастыря Храма Горного Солнца. Однако, несмотря на всю красоту и историю, дворец пришёл в упадок. С новым объединением Опахасии он был обновлён и перестроен. Такой же роскошный, как и прежде, теперь он служит сияющим символом не только Аверсарии, но и её стойкости."

 building_type_02_palaceofthewizardking: "Священный дворец Катануксы"
 building_type_02_palaceofthewizardking_desc: "Дворец Короля-Чародея отвоёван! Его верные последователи снова населяют эти священные залы, украшая их Его ликом и восстанавливая его великое и чудесное устройство. Дворец снова стоит во всём своём великолепии и величии, а священный трон (всегда пустующий) в главном зале на вершине Его башни напоминает о влиянии Короля-Чародея и ожидает Его возвращения.\n\nВ близлежащей деревне царит мрачная атмосфера: Его слуги регулярно обеспечивают постоянный приток жертв, чтобы умилостивить дух Короля-Чародея."

 building_type_02_preachers_hill: "Холм Проповедника"
 building_type_02_preachers_hill_desc: ""

 building_type_02_riduvianbarrows: "Переоборудованные ридувианские курганы"
 building_type_02_serpent_gate: "Ворота Змей"
 building_type_02_serpent_gate_desc: "Восстановленные Ворота Змей вновь возвышаются как грозное оборонительное сооружение для защиты сердца Кемсара. Хотя они никогда не вернут былого величия, южный проход вновь представляет собой внушительное зрелище как для путешественников, так и для завоевателей."

 building_type_02_seychunds_square: "Площадь Сейхунда"
 building_type_02_seychunds_square_desc: "Площадь Сейхунда — умеренно большая площадь перед аббатством Авакандера. Хотя когда-то площадь по очевидным причинам носила имя «Площадь Авакандера», местные жители переименовали её после [coup_of_the_wayfathers|E] и прихода к власти Путеотца Сейхунда в качестве теократического правителя [grande_gisredde|E]. Сейхунд чаще всего произносил свои знаменитые длинные речи с балкона аббатства, а площадь перед ним была его любимым местом для обезглавливания политических оппонентов.\n\nОднако название связано не с этим. Площадь Сейхунда получила своё имя после того, как убийца нанёс отравленному Сейхунду тринадцать ножевых ранений прямо на балконе, после чего сбросил его вниз на площадь. Трещины, оставленные Сейхундом на булыжниках, всё ещё видны рядом с его статуей, а недолгие споры местных лидеров о ремонте так и не зашли дальше рассуждений о том, не будет ли это святотатством."

 building_type_02_silverpalace: "Серебряный дворец"
 building_type_02_silverpalace_desc: "Когда-то бывший оплотом власти [ufaliracci|E] на [pirate_coast|E], [silver_palace|E] снова сияет под солнцем. Это великолепное сооружение было перестроено лучшими мастерами Пиратского берега, а его искусные рельефы демонстрируют высочайшее мастерство их рук."

 building_type_02_sophocos: "Софокос"
 building_type_02_sophocos_desc: "Софокос [sophocos|E], по мнению [Concept('ritualism','ритуалистов')|E], — это лестница в небо. Или, по крайней мере, спорная концепция того, что большинство ритуалистских богословов считают местом истинного духовного просветления.\n\nВокруг основания башни теперь ютится паломнический городок, привлекающий торговцев и предприимчивых продавцов реликвий. Жильё для бедных паломников состоит из нескольких больших ночлежных домов, в то время как богачи разбивают собственные шатры на почтенном расстоянии. Из скромных молитвенных домов доносятся гимны и песнопения. Несколько новаторски настроенных паломников рискнули подвесить к стенам башни огромные молитвенные ковры, провозглашая превосходство своего направления. Между сектами, приходящими засвидетельствовать почтение, установился дух дружеского соперничества, а отдельные предприимчивые дельцы принимались копать в поисках реликвий прямо у основания башни."

 building_type_02_the_minteries: "Монетные дворы"
 building_type_02_the_minteries_desc: ""

 building_type_02_thebloodyard: "Эфоусамартас"
 building_type_02_thebloodyard_desc: "Кровавый двор — это древнее сооружение до[Concept('aversaria','аверсарской')|E] постройки, созданное, по-видимому, исключительно для пыток и казней как людей, так и животных. Хотя даже аверсарцы видят в нём место жестокости и боли, оно, тем не менее, регулярно использовалось аверсарскими [magi|E] вплоть до IV века.\n\nЕго огромные палаты для сбора крови со временем были заброшены и по большей части превратились в руины. Так продолжалось до [Concept('imperial_civil_war','Гражданской войны')|E] между Эшраесом и Аксиотеей, когда сооружения были вновь открыты и активированы Эшраесом. Именно отсюда Эшраес почерпнул силу для сотворения [frodbrokna|E], принеся в жертву тысячи рабов, слуг и даже собственных солдат, чтобы сотворить заклинание, положившее конец миру.\n\nНесмотря на попытки уничтожить это проклятое место, нынешние владельцы Эфоусамартаса по весьма зловещим причинам сочли нужным вернуть ему былое величие, выстроив крепкие стены для защиты ритуальных площадок от любопытных глаз и мстительных вандалов. Мрачные слухи о гнусных обрядах, проводимых внутри возрождённого комплекса, стремительно распространяются среди населения. Кровавый двор помог уничтожить мир, и тень, которую он отбросил на историю [aeras|E], может стать ещё темнее."

 building_type_02_theeffigy: "Великое деревянное чучело"
 building_type_02_theeffigy_desc: "Благодаря значительным вложениям местных культистов здесь теперь стоит великое чучело. Угрожающе возвышаясь над местной деревней, магическая сила просачивается сквозь горящую древесину и гарантирует, что даже после завершения ритуала его можно разжигать вновь до бесконечности. Любые обвинения в том, что внутри груди чучела есть камера для жертвоприношения людей, совершенно безосновательны, особенно со стороны чужаков, продолжающих задавать идиотские вопросы, из-за которых их самих кто-нибудь может принести в жертву. Мужчины и женщины в жутких звериных масках, стоящие вокруг деревни и неподвижно смотрящие на вас, которые недавно «проводили домой» последнего любителя задавать вопросы, обязательно убедят вас в обратном; только прекратите пытаться сбежать, пока готовится чучело, Черт возьми!"

 building_type_02_tomb_of_the_lost: "Грубонвц Заргабоных"
 building_type_02_tomb_of_the_lost_desc: "Гробница Забытых значительно расширилась благодаря финансовым вложениям аристократов и пожертвованиям простолюдинов-эйейница. Появилась свежевыкопанная сеть подземных катакомб для упокоения растущего числа усопших, а также новый комплекс помещений для монахов и Стражей Могил, ухаживающих за кладбищем и охраняющих его земли.\n\nПомимо укрепления самой структуры, часть средств была выделена на эстетическое оформление: залы украсили новые фрески, гобелены и статуи, изображающие более светлые времена в истории севера."

 building_type_02_umlojtemplecomplex: "Завет Умлоя"
 building_type_02_umlojtemplecomplex_desc: "Благодаря усилиям местных властей Завет Умлоя расширился ещё сильнее и теперь вмещает, пожалуй, больше всего священнослужителей и праведников среди всех городов мира. Между величественными церквями и храмами раскинулись огромные торговые кварталы, банки и счётные палаты, где купцы со всех уголков земли свободно ведут дела. Это приносит колоссальную выгоду местной экономике, полностью завязанной на обслуживании Завета. Сразу за пределами священного квартала можно найти неисчислимое множество игорных домов, борделей и постоялых дворов: менее прихотливые паломники (или последователи менее строгих вероисповеданий) с радостью находят собственное спасение на дне кружки или в объятиях танцовщиц, когда устают от проповедей очередного модного на этой неделе культа."

 building_type_02_universityofgiherehalwajaf: "Манзи Альфайсуфи"
 building_type_02_universityofgiherehalwajaf_desc: "Благодаря притоку средств и целеустремлённым работам по реконструкции старых зданий «Обитель Философов» вновь обрела облик, напоминающий о её золотом веке. Великие мыслители, творцы и деятели всех мастей постоянно снуют по комплексу. Они перемещаются между десятками лекций, театральных представлений и демонстраций. Университет уже вдохнул новую жизнь в окрестный край: местная экономика стремительно подстраивается под неутолимые потребности философов в выпивке, развлечениях, научных материалах и галлюциногенах."

 building_type_03_bastards_run: "Бастардов Дол"
 building_type_03_bastards_run_desc: ""

 building_type_03_calmensons_crest: "Гребень Кальменсона"
 building_type_03_calmensons_crest_desc: ""

 building_type_03_champion_grounds: "Обитель Чемпионов"
 building_type_03_champion_grounds_desc: "Обитель Чемпионов, или Протошлити, представляет собой величественную крепость, где XLII «Гордость Аверсарии» легион тренировал самых выдающихся рекрутов государственных легионов [Concept('aversaria','Аверсарии')|E]. Те, кто прошёл обучение в Протошлити под руководством почитаемых наставников, почти наверняка сами станут чемпионами; пути многих легендарных героев Аверсарских Легионов начинались именно в этих залах.\n\nБлагодаря новым инвестициям Протошлити удалось вернуть то великолепное состояние, в котором она находилась в дни славы Аверсарии. Огромная территория окружающих полигонов сопоставима с небольшой провинцией, а казармы и жилые помещения были расширены, чтобы вмещать целые армии. Воины и чемпионы со всего [aeras|E] стекаются в академию, чтобы отточить своё мастерство, ведь каждый из инструкторов Протошлити — признанный мастер своего дела."

 building_type_03_four_cliffs_five_walls: "Великие укрепления Чалькамахоса"
 building_type_03_four_cliffs_five_walls_desc: "Город Чалькамахос (или Халкама для [Concept('wardenism','варденистов')|E]) возведён на вершине массивного комплекса земляных валов неизвестного происхождения, расположенных один над другим в виде четырёх концентрических колец. В общей сложности подножие этой необычной горы достигает пятнадцати километров в диаметре, а высота каждого утеса составляет ровно пять метров. Что ещё удивительнее, на самой вершине бьют три весьма обильных источника, не пересыхающие даже во время засухи — результат древней и могущественной магии, чьё происхождение так же загадочно, как и рукотворные утесы. Как бы то ни было, эти факторы в сочетании с плодородной землёй превратили город в настоящий сад, защищённый от вражеских армий неприступными естественными преградами. В ходе недавних работ стены были расширены, и теперь каждый утес укреплен слоем стен у своего основания. Сам город также начал процветать благодаря раскопкам древних кирпичных оросительных каналов и других подземных туннелей, что снизило затраты на содержание городских ферм. По мере того как город становится всё более самообеспеченным, осаждать его будет практически невозможно."

 building_type_03_gisreddeport: "Гизреддепорт"
 building_type_03_gisreddeport_desc: "Иноземный квартал [peti_gisredde|E] — это огромная часть района Гизреддепорт, вмещающая десятки складов, меняльных лавок и экзотических храмов. Пожалуй, это единственное место в мире, где, просто перейдя улицу, можно услышать [Concept('aversaria','аверсарскую')|E], [Concept('marchers','шевальенскую')|E], [Concept('sarradon','саррадонскую')|E] и каширскую речь. Квартал стал центром не только торговли, но и информации. Как говорится, «Шёпот идёт в Гизредде на ухо», и Иноземный квартал — лучшее тому подтверждение. Торговые общины здесь настолько сплочены и связаны между собой, что, по слухам, гизреддеанцы узнают цену на зерно в Ораисполе раньше аверсарских фермеров, а в переулках Квартала можно выведать куда более опасные и прибыльные тайны.\n\nРазумеется, [council_of_gisredde|E] поощряет, регулирует, а затем облагает этих купцов непомерными налогами. Однако благодаря самому опытному купеческому сообществу в мире и городу, способному приносить казалось бы неограниченную прибыль, иноземная община продолжает процветать, а вместе с ней — и сам город."

 building_type_03_jans_market: "Рынок Яна"
 building_type_03_jans_market_desc: ""

 building_type_03_kasmeze_cathedral: "Собор Касмезе"
 building_type_03_kasmeze_cathedral_desc: "Чудом, вопреки всему, Собор Касмезе был восстановлен избранниками Чистейшего. Приток людей, желающих увидеть новую базилику, принёс процветание окружающему графству и немалые деньги в виде десятины. В первоначальном комплексе Цитадель была построена первее, а Собор — лишь спустя годы. Теперь же, когда [frodbrokna|E] открыла путь новому архитектурному направлению, Собор возвели в первую очередь. Это позволило ему служить не только местом поклонения, но и центром подготовки новых воинов веры. Эта новая церковь стала больше и, пожалуй, лучше прежней, действительно вернув себе былое величие."

 building_type_03_last_standers_street: "Улица Последних Защитников"
 building_type_03_last_standers_street_desc: "Среди казалось бы бесконечного числа объединённых казарм, тюрем и тренировочных центров Благородной и Уважаемой Верной Городской Стражи Его Светлости Герцога [grande_gisredde|E] в Величайшем Гизреддеанском Городе [BITNOAWFAWMBTGORBAAPAHBGSAS|E] прохожие часто не замечают Караульное помещение № 3343, считая его очередным пристанищем «самых невоспитанных и коррумпированных преступников города». Но вопреки репутации обеих Гизреддеанских Страж как карьеры, которая хуже, чем судьба «исследователя [lichdom|E]», стражники № 3343 усердно спасают город от апокалиптических катастроф, никогда не получая взамен ни благодарности, ни признания.\n\nБольшинство стражников вполне довольствуются максимально допустимой законом ежемесячной взяткой, но самые «нестандартные» члены Стражи держатся обособленно. Хотя большинство из них — «неудачники», «изгои», «служащие в Страже взамен казни» или «говорящие на совершенно незнакомом языке и, скорее всего, укравшие форму после того, как случайно забрели сюда», именно они зачастую остаются единственной преградой между очередным обычным днём на суровых улицах Криппи-Роу и очередными культами, пытающимися призвать кракена."

 building_type_03_malcoispalace: "Палат то Митидон"
 building_type_03_malcoispalace_desc: "Дворец Митидона, названный в честь [Concept('aversaria','аверсарской')|E] кампании, разгромившей последнего короля ииросси, считается одним из самых скромных и безликих по меркам Аверсарии. Несмотря на это, он также является одним из крупнейших, будучи возведённым как великая цитадель, призванная удерживать туземцев долины Малькоис в подчинении и быстро подавлять любые восстания рабов.\n\nНесмотря на отсутствие изысканности, дворец остаётся массивным и внушительным — огромным серым блоком северного гранита, с помощью которого аверсарцы веками подавляли местное население.\n\nПолностью восстановленный и укреплённый дворец окончательно избавился от воспоминаний о том времени, когда он был лишь руинами. Его тридцать великих башен снова возвышаются к небу, массивные стены практически не имеют изъянов, а шесть рвов выкопаны ещё глубже и заполнены новой смесью воды, масла и разъярённых зверей."

 building_type_03_oasisofgonan: "Оазис Гонан"
 building_type_03_oasisofgonan_desc: "Оазис Гонан представляет собой крупный каньон, который за последние два тысячелетия заполнился водой — естественным или искусственным путём. Независимо от своего происхождения, оазис стал одним из важнейших центров [Concept('sarradon','саррадонской')|E] торговли и источником жизни для десятков культур. Плодородный оазис вокруг каньона превратился в необходимую стоянку для путешественников, пересекающих [Glossary('Большую Пустыню','sarradonian_desert_encyclopedia_desc')] с севера на юг и вглубь континента. За тысячелетия здесь была построена внушительная инфраструктура, позволяющая принимать многочисленных купцов, исследователей и паломников, идущих через пустынные перевалы, и получать от этого немалую выгоду."

 building_type_03_preachers_hill: "Холм Проповедника"
 building_type_03_preachers_hill_desc: ""

 building_type_03_seychunds_square: "Площадь Сейчунда"
 building_type_03_seychunds_square_desc: ""

 building_type_03_sophocos: "Софокос"
 building_type_03_sophocos_desc: "Согласно [Concept('ritualism','ритуалистам')|E], [sophocos|E] — это лестница в небеса. Или, по крайней мере, неясная и вызывающая жаркие споры концепция места подлинного духовного просветления, как утверждают большинство ритуалистских богословов.\n\nВокруг Софокоса выросло беспорядочное скопление зданий, давшее приют как верующим, так и предприимчивым дельцам. Бедняки спят в тесных каморках или убогих палатках, а те, кто может себе это позволить, наслаждаются хорошими постелями и едой во множестве отличных таверн и постоялых дворов. Мало кто из прежних скромных молитвенных домов уцелел — их вытеснили новые соперничающие храмы. Флаги и ленты теперь украшают прежде строгие стены башни, пока группы поднимающихся паломников соревнуются друг с другом. Ландшафт вокруг башни изрыт шахтами, выкопанными охотниками за реликвиями."

 building_type_03_the_minteries: "Минтерии"
 building_type_03_the_minteries_desc: "Трижды благословенная Гильдия Преступного Промысла несёт сомнительную честь быть самой известной регулируемой гильдией воров в [grande_gisredde|E]. Хотя это немного усложняет вести дела — капюшоны и маски не слишком помогают, когда публичный городской архив ежемесячно обновляет реестр членов Гильдии, — другие направления становятся куда более прибыльными. Если раньше воры довольствовались карманными кражами и мошенничеством, то теперь их руководство наслаждается искусством законного грабежа. Зачем рисковать на дело, если можно собирать огромные членские взносы? Или заставить человека, побившего вашего вора за пролом в доме, платить за ущерб? Или инвестировать добычу в личный банк Гильдии?\n\nТеперь Гильдия яростно судится с не состоящими в ней ворами за кражи из своих банков и одновременно финансирует кампании по работе с общественностью, чтобы показать обворованным гражданам, почему они на самом деле должны быть благодарны. Это возымело успех, а попытки ввести государственные ограничения привели к бунтам. Известен случай, когда обеспокоенный гражданин Редли ден ва Гизредде страстно вещал совету (находясь там, чтобы подать отчёт о краже купчей на собственный дом) о неприличии предложений повысить налоги для членов Гильдии: ведь что станет с городом, если они забрали бы свой (незаконный) бизнес и (украденные) деньги и переехали в [peti_gisredde|E]?"

 building_type_03_tomb_of_the_lost: "Грубонвц Заргабоных"
 building_type_03_tomb_of_the_lost_desc: "Гробница Забытых превратилась в поистине грандиозное сооружение благодаря непрерывным инвестициям и упорному труду целой армии инженеров, каменщиков, плотников, художников и жрецов. С созданием полноценного храмового архива, десятков погребальных залов и лабиринта катакомб фокус внимания сместился с поиска места для местных жителей на поиск имён предков.\n\nИмея в штате целую группу писцов и несколько отрядов авантюристов на жалованье, Гробница Забытых поставила своей миссией отыскать утраченную историю народа эйейница. Учёные-заргабоны регулярно платят царские суммы любому, кто готов отправиться в [the_lichdoms|E] на поиски затерянных архивов и записей."

 building_type_03_universityofgiherehalwajaf: "Манзи Альфайсуфи"
 building_type_03_universityofgiherehalwajaf_desc: "Став ещё величественнее, Манзи Альфайсуфи превратилась в светоч науки, известный во всём просвещённом мире. Философы всех направлений — [Concept('sarradon','саррадонцы')|E], амсарцы, [Concept('aversaria','аверсарианцы')|E], [Concept('marchers','шевальенцы')|E] и многие другие — посещают университет, делают пожертвования в его обширные музеи, а также читают или слушают грандиозные лекции. Впечатляет не только вклад как в тайную, так и в мирскую философию и изобретения, но и сам город, выросший вокруг этого места — целый мегаполис, построенный для удовлетворения постоянных и эксцентричных потребностей учёного сословия."

 building_type_04_bastards_run: "Бастардов Дол"
 building_type_04_bastards_run_desc: ""

 building_type_04_calmensons_crest: "Гребень Кальменсона"
 building_type_04_calmensons_crest_desc: "Первый и лучший театр Гизредде, Отель Гизредде — это величественное здание, известное пышными балами, оглушительными операми и непристойными пьесами. Первоначально утверждённый как постоянная резиденция ранее странствовавшей Трупы Пути Легкомыслия, театр стал местом бунта после ужасной инсценировки жизни [champion_of_chevalie|E]: толпа узнала, что актёр, игравший Чемпиона, родился в [peti_gisredde|E], а сама история будет мюзиклом. Хотя местные жители с помощью дубин и вил выгнали Трупу Пути Легкомыслия из города, а сам Отель сгорел дотла, он остаётся популярным с момента своего открытия, пережив с тех пор всего три крупных пожара и один бунт.\n\nСейчас в Отеле выступают сменяющие друг друга актёры и артисты. Хотя раз в месяц здесь по-прежнему проходят открытые спектакли для низших классов, в основном он служит местом, где высшие слои [Concept('grande_gisredde','великогизреддеанского')|E] общества могут пообщаться и побурчать о бескультурии плебеев, параллельно наслаждаясь зрелищем того, как двое взрослых мужчин комично шлёпают друг друга в инсценировках «Страстного рыцаря и приятного полнотелого мага» Абаэля Венодо."

 building_type_04_four_cliffs_five_walls: "Великие укрепления Чалькамахоса"
 building_type_04_four_cliffs_five_walls_desc: "Город Чалькамахос (или Халкама для [Concept('wardenism','варденистов')|E]) возведён на вершине массивного комплекса земляных валов неизвестного происхождения, расположенных один над другим в виде четырёх концентрических колец. В общей сложности подножие этой необычной горы достигает пятнадцати километров в диаметре, а высота каждого утеса составляет ровно пять метров. Что ещё удивительнее, на самой вершине бьют три весьма обильных источника, не пересыхающие даже во время засухи — результат древней и могущественной магии, чьё происхождение так же загадочно, как и рукотворные утесы. Как бы то ни было, эти факторы в сочетании с плодородной землёй превратили город в настоящий сад, защищённый от вражеских армий неприступными естественными преградами. Город-Сад, как его начинаютзывать, достиг вершины своего развития: здания теснятся рядом с фруктовыми садами, а фермы занимают каждый доступный клочок земли на террасах. Обширные раскопки показали, что холм, на котором построен город, испещрён кирпичными туннелями неизвестного происхождения, уходящими в неосвещённую глубину далеко под землёй. Полные размеры этих палат ещё только предстоит картографировать, но их уже используют в качестве долгосрочных складов — несмотря на слухи о том, что отважные исследователи бесследно исчезают в этом огромном подземном лабиринте коридоров."

 building_type_04_gisreddeport: "Гизреддепорт"
 building_type_04_gisreddeport_desc: "Гизреддепорт на памяти всех живущих был центром северной торговли и сердцем [Concept('marchers','шевальенской')|E] культуры. Великие доки и пирсы из чёрного камня выполнены в чужеземном архитектурном стиле и созданы древними зодчими, неизвестными даже самым просвещённым учёным. Среди них и вокруг них располагаются десятки других сооружений, возведённых за века расширения города Валльгедок вдоль побережья. По сей день порт вмещает один из крупнейших военно-морских флотов в мире, и ежедневно сотни кораблей из [chevalie|E] и со всего света швартуются у его таинственных пирсов, чтобы вести торговлю и пополнять знаменитые городские рынки."

