 building_01_zakran_mines: "Становящиеся на ноги рудники Закрана"
 building_01_zakran_mines_desc: "Горнодобывающий комплекс у подножия горного хребта Закран действовал по меньшей мере со времен Первого Междуцарствия Кемсара, когда дом Себхенаф активно использовал его для финансирования своих, казалось, бесконечных конфликтов с западными соперниками. Он сохранил свое значение и после воссоединения Кемсара, оставаясь основным источником серебра на протяжении всей последующей истории империи.\n\nОднако после Битвы за Разорванную Цепь рудник был захвачен молодой империей Айяр и с тех пор подпитывает большую часть ее экономики."

 building_02_aironoiakaan: "Майикпрололлан Айронойакаан"
 building_02_aironoiakaan_desc: "$building_type_02_aironoiakaan_desc$"
 building_02_aironoiakaan_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +50#!\n[aspect_water] [spellcasting_success_chance|E]:@gh_water_icon!#positive_value; +10%#!\n[aspect_air] [spellcasting_success_chance|E]:@gh_air_icon!#positive_value; +10%#!"

 building_02_antimagi_chapterhouse: "Аванпост антимагов"
 building_02_antimagi_chapterhouse_desc: "Позволяет нанимать [GetMaA('marcher_anti_mage').GetName] и [GetMaA('griffon_silencers').GetName] как [men_at_arms|E]\n#weak Можно нанять только один полк Глушителей Грифонов (размером до 5)#!\n\nСтремящиеся к славе воины и бродячие рыцари из окрестных деревень стекаются к этому небольшому аванпосту в надежде сделать себе имя, хотя мало кто получает право войти."

 building_02_ashmarite_hospital: "Ашмаритская больница"
 building_02_ashmarite_hospital_desc: "Ашмаритская больница разрослась в небольшой комплекс с купальней и кладовой, построенными рядом со целительским залом и двором. Рядом также возник небольшой кластер домов — жилищ для врачей и подсобных рабочих этого учреждения."

 building_02_ashuku_mines: "Рудник Ашуку"
 building_02_ashuku_mines_desc: "Завораживающий изумруд Ашуку был одним из основных товаров, перевозимых через пустыню по Гонянской дороге на протяжении всего времени существования этого маршрута. По мере роста поселения добывается все больше и больше руды. Приток компетентных инженеров позволяет построить полноценный рудник и заново открыть заброшенные шахты."

 building_02_bastards_run: "Питейное заведение сэра Джейлы"
 building_02_bastards_run_desc: "$building_type_02_bastards_run_desc$"

 building_02_beban_mines: "Рудник Бебан"
 building_02_beban_mines_desc: "По мере роста поселения добывается все больше и больше руды. Приток компетентных инженеров позволяет построить полноценный рудник."

 building_02_benoriya_atawek: "Бенория Атавек"
 building_02_benoriya_atawek_desc: "Хотя [magic|E] и её адептов долгое время чуждались в Дамоте, считая чуждыми и не заслуживающими доверия, они тем не менее нашли свое место в обществе, служа и помогая своим немагическим собратьям. Пожалуй, величайшим символом их роли является Дом Магии, построенный Эшво в 263 году И. С. как центр магического обучения. За прошедшие века он стал сердцем дамотанской магической традиции, воспитав множество выдающихся советников и воинов при [Concept('boqqarut_damotada','Боккаруте')|E], которые добились высокого положения в дамотанском обществе, несмотря на свой статус изгоев. И хотя школа значительно пришли в упадок во время [etami_tetenik|E] и последующей эпохи раздробленных военных вождей, теперь она восстановлена, снова обучая тех, кто обладает потенциалом, безопасному использованию своего искусства, и продолжая накапливать магические знания в масштабах, редких за пределами великих академий [aversaria|E] или бесконечных библиотек Каширии.#!"
 building_02_benoriya_atawek_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +50#!\n\n"

 building_02_biyakaddu: "Биякадду"
 building_02_biyakaddu_desc: "Благодаря щедрым инвестициям Биякадду начал восстанавливаться после долгого упадка. Хотя большая часть конструкции все еще плохо обслуживается, он вернул себе статус центра торговли на озерах."

 building_02_calmensons_crest: "Хартия горожан"
 building_02_calmensons_crest_desc: "$building_type_02_calmensons_crest_desc$"

 building_02_champion_grounds: "Протошлити Апокатас"
 building_02_champion_grounds_desc: "$building_type_02_champion_grounds_desc$"
 02_champion_grounds_effect_desc: "Находящиеся поблизости [Concept('aversaria', 'аверсарианцы')|E] могут принять [decision|E] [GetDecisionWithKey('hire_protoshliti_warrior_decision').GetName]"

 building_02_creonta_mines: "Рудник Креонта"
 building_02_creonta_mines_desc: "По мере роста поселения добывается все больше и больше руды. Приток компетентных инженеров позволяет построить полноценный рудник."

 building_02_crow_gate: "Ворота Воронов"
 building_02_crow_gate_desc: "$building_type_02_crow_gate_desc$"

 building_02_dalath_analoth: "Далат Аналот"
 building_02_dalath_analoth_desc: "Расположенный в канийском мегаполисе ЭЛОИ-Ласхем, Далат Аналот является крупнейшим храмом, возведенным в честь Элои, и религиозным центром всей веры шехарддов. Этот храм имеет честь и престиж быть хранителем Атунет Ка, опечатанного сосуда, защищающего то, что, согласно догматам шехарддов, является последними обрядами, которым Элои обучил человечество.\n\nХрам подвергся масштабному расширению и теперь стоит как одно из крупнейших религиозных зданий в Западном Саррадоне с великолепными залами и искусно выполненными витражами, на которых изображена великая жертва почтенного Комера во время легендарной [kalnaih|E]. В его полированных мраморных залах проживает высшее духовенство шехарддов, а после расширения храма были созданы залы, где ученые, теологи и академики ведут дискуссии на любые темы."

 building_02_degasho_bedelam: "Дегашо Беделам"
 building_02_degasho_bedelam_desc: "Отреставрированный ценой огромных затрат, Дегашо Беделам стал эпицентром высшего света Дамоты. Со всего региона здесь собираются элиты, общаясь со всеми самыми важными лицами Дамоты. Хотя ему все еще не хватает престижа, которым он когда-то обладал как второй дворец Боккаров, его положение тем не менее впечатляет."

 building_dergi_garden_02: "Дикий сад дергов"
 building_dergi_garden_02n_desc: "Предоставленный своей естественной пышности, этот сад перерос замыслы своих садовников. Разросшиеся, по мнению посторонних, эти магически взращенные джунгли из цветов, камней и деревьев достигли своей конечной формы, прежде чем снова раствориться в небытии."

 building_02_dielecport: "Диелекпорт"
 building_02_dielecport_desc: "$building_type_02_dielecport_desc$"

 building_02_dihasma_xiidan: "Дихасма Ксиидан"
 building_02_dihasma_xiidan_desc: "По мере того как политическая ситуация улеглась, а новый порядок начал формироваться, Дихасма Ксиидан привлекает все больше покровительства со стороны восстанавливающейся знати, избавляясь от летаргического упадка, который, казалось, поглотил его. Хотя он все еще далек от того, чем был раньше, он снова начинает становиться значимым местным институтом."

 building_02_epidaphos_mines: "Рудник Эпидафос"
 building_02_epidaphos_mines_desc: "По мере роста поселения добывается все больше и больше руды. Приток компетентных инженеров позволяет построить полноценный рудник."

