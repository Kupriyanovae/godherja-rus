 # Qafazala' Offering
 building_type_gh_tamlais_offering_01: "Подношение Кафазалы"
 building_type_gh_tamlais_offering_01_desc: "Высеченный в склоне горы Кафазала, этот колоссальный барельеф во всех деталях изображает [Concept('dragons','дракона')|E], возвышающегося над группой склонившихся перед ним людей. Его первоначальный смысл, как и название, со временем были утеряны."
 building_gh_tamlais_offering_01: "$building_type_gh_tamlais_offering_01$"
 building_gh_tamlais_offering_01_desc: "$building_type_gh_tamlais_offering_01_desc$"

 #Kharash Port
 building_type_gh_kharash_01: "Хараш"
 building_type_gh_kharash_01_desc: "Скромный порт, расположенный в устье естественной бухты. Деревянные причалы уходят в воду, а с нескольких небольших судов разгружают товары. Местные купцы торгуют в основном рыбой и бытовыми товарами, изредка принимая караваны из глубины континента."
 building_gh_kharash_01: "$building_type_gh_kharash_01$"
 building_gh_kharash_01_desc: "$building_type_gh_kharash_01_desc$"

 building_type_gh_kharash_02: "Хараш"
 building_type_gh_kharash_02_desc: "Порт разросся в оживленный центр торговли. Каменные пирсы сменили деревянные причалы, позволяя более крупным кораблям бросать якор и разгружать товары. Наземные караваны теперь прибывают регулярно, привозя товары для обмена с купцами из дальних краев."
 building_gh_kharash_02: "$building_type_gh_kharash_02$"
 building_gh_kharash_02_desc: "$building_type_gh_kharash_02_desc$"

 building_type_gh_kharash_03: "Хараш"
 building_type_gh_kharash_03_desc: "Процветающий порт в самом сердце экономики Сиуни и всего региона центрального [amsar|E]. Доки уходят далеко в залив, и корабли из дальних стран разгружают разнообразные товары на переполненные пристани. Описанный хиксартийским поэтом Варзаном Илькешем как «Устье ста языков», порт гудит от непрерывного хора иностранных голосов: купцы торгуются, моряки хвастаются, а посланники заключают сделки на древних и новых языках. Здесь взвешивают, пересчитывают и продают весь мир."
 building_gh_kharash_03: "$building_type_gh_kharash_03$"
 building_gh_kharash_03_desc: "$building_type_gh_kharash_03_desc$"

 building_type_gh_kharash_04: "Великий Хараш"
 building_type_gh_kharash_04_desc: "Огромный торговый хаб, Хараш стал одним из важнейших портов в [amsar|E]. Массивные каменные пирсы вмещают флотилии крупных торговых судов, а вдоль доков тянутся склады и шумные рынки. Описанный хиксартийским поэтом Варзаном Илькешем как «Устье ста языков», порт гудит от непрерывного хора иностранных голосов: купцы торгуются, моряки хвастаются, а посланники заключают сделки на древних и новых языках. Здесь взвешивают, пересчитывают и продают весь мир."
 building_gh_kharash_04: "$building_type_gh_kharash_04$"
 building_gh_kharash_04_desc: "$building_type_gh_kharash_04_desc$"

 # Keszkecske Cliff
 building_type_gh_keszkecske_cliff_01: "Утесы Кешкечке"
 building_type_gh_keszkecske_cliff_01_desc: "Изрезанная, опасная береговая линия, где волны неустанно бьются об острые скалы. Внезапные штормы часто проносятся здесь, заставая врасплох как опытных, так и начинающих моряков; лишь самые умелые сиралагские команды отваживаются проходить через эти коварные воды. Мелководье и скрытые рифы погубили бесчисленное множество судов. Этот естественный барьер способствовал изоляции хиксартийцев от остальных хекланов. Среди множества погибших здесь был и $qanamsar_kavashid_link$ канамсар Кавашид#!, который, как говорят, сгинул вместе со всем Имперским флотом в 582 году от И. С., скорее всего, застигнутый внезапной бурей."
 building_gh_keszkecske_cliff_01: "$building_type_gh_keszkecske_cliff_01$"
 building_gh_keszkecske_cliff_01_desc: "$building_type_gh_keszkecske_cliff_01_desc$"

 # Zarashti Tower
 building_type_gh_zarashti_tower_01: "Башня Зарашти"
 building_type_gh_zarashti_tower_01_desc: "Построенная $maraghid_ardivusura_link$ Ардивусурой#!, легендарной первой королевой королевства Марагидов, эта сторожевая башня когда-то была частью сложной сети пограничной обороны. Остальные башни были разрушены в 1006 году от И. С. незадолго до вторжения Иахии. Одинокая башня, обветшалая и частично обрушившаяся, все еще открывает захватывающий вид на окружающую пустыню, хотя ее каменные стены постепенно поддаются наступающим пескам."
 building_gh_zarashti_tower_01: "$building_type_gh_zarashti_tower_01$"
 building_gh_zarashti_tower_01_desc: "$building_type_gh_zarashti_tower_01_desc$"

 # Sulujeh Walls
 building_type_gh_shahr_nira_walls_01: "Стены Шахр-Ниры"
 building_type_gh_shahr_nira_walls_01_desc: "Впервые возведенные при $qanamsar_sharnira_link$ канамсаре Шахр-Нире#! для отражения набегов кемсарцев, эти внушительные укрепления были построены с толстыми каменными слоями, чтобы выдерживать прямые штурмы. Позже $qanamsar_zayar_link$ канамсар Заяр#! укрепил их дополнительными бойницами, стреловыми щелями и укреплёнными воротами. Хотя они выдержали века конфликтов, стены неоднократно латали и восстанавливали."
 building_gh_shahr_nira_walls_01: "$building_type_gh_shahr_nira_walls_01$"
 building_gh_shahr_nira_walls_01_desc: "$building_type_gh_shahr_nira_walls_01_desc$"

 # Anjari Burz
 building_type_gh_anjari_burz_01: "Анджари Бурз"
 building_type_gh_anjari_burz_01_desc: "Раскидистый дворцовый комплекс с резными каменными колоннами, расписными фресками и пышными внутренними двориками. Мраморные фонтаны тихо журчат в окружении экзотических растений. Дворец тщательно поддерживается ремесленниками и слугами, сохраняющими его изысканный замысел."
 building_gh_anjari_burz_01: "$building_type_gh_anjari_burz_01$"
 building_gh_anjari_burz_01_desc: "$building_type_gh_anjari_burz_01_desc$"

 # Iskandur Durz
 building_type_gh_iskandur_01: "Искандур"
 building_type_gh_iskandur_01_desc: "Укрепленный прибрежный город, процветавший во времена [gh_first_siralagi_golden_age|E]. Его высокие каменные стены и обращенные к морю фортификации позволяли ему выдерживать осады годами. Последний оплот на Островах Трех Сестер, он противостоял войскам амсаров до 569 года от И. С. Когда полководец $qanamsar_oshvari_link$ канамсара Ошвари#! наконец пробил его оборону, город был систематически разорен и сровнен с землей, что положило конец Первому золотому веку сиралагского пиратства."
 building_gh_iskandur_01: "$building_type_gh_iskandur_01$"
 building_gh_iskandur_01_desc: "$building_type_gh_iskandur_01_desc$"

