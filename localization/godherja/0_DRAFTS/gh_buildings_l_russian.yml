 building_type_04_sophocos: "Софокос"
 building_type_04_sophocos_desc: "Согласно [Concept('ritualism','ритуалистам')|E], [sophocos|E] — это лестница в небеса. Или, по крайней мере, неясная и вызывающая жаркие споры концепция места подлинного духовного просветления, как утверждают большинство ритуалистских богословов.\n\nШумный мегаполис своего рода разросся у подножия башни, а его рынки переполнены зазывалами, торгующими реликвиями, безделушками, подделками, а иногда и подлинными артефактами. Богатые и бедные здесь редко пересекаются: дворцы за стенами вмещают первых, а тесные трущобы и палаточные городки дают приют вторым. Междоусобные бунты и другие формы религиозного насилия — обычное дело, лишь изредка подавляемое ополчением, финансируемым богатыми купцами города. Буйство флагов и знамен украшает башню, а соперничающие группы паломников время от времени вступают в жестокие стычки во время восхождения. Для богачей «короткие пути» к просветлению существуют в виде ненадёжных импровизированных подъёмников, поднимающихся на сотни футов по отвесной стене башни. Ландшафт вокруг Софокоса изуродован огромными карьерами, где ведутся поиски зарытых реликвий и сокровищ."

 building_type_04_the_minteries: "Минтерии"
 building_type_04_the_minteries_desc: ""

 building_type_04_tomb_of_the_lost: "Грубонвц Заргабоных"
 building_type_04_tomb_of_the_lost_desc: "Одно из величайших рукотворных чудес света, Гробница Забытых — это гигантский храмовый комплекс, возведённый вокруг массивной центральной гробницы. Персонал размером с небольшой город, состоящий из жрецов, воинов, писцов, инженеров и других специалистов, неустанно трудится над расширением сооружения, чтобы оно оставалось потрясающим свидетельством почти утраченной культуры эйейница. Статуи и монументы украшают садово-храмовый комплекс и его великие залы, а множественные небольшие часовни служат паломникам, желающим помолиться древним мертвецам.\n\nСреди выдающихся объектов комплекса — Зал Королей, вмещающий более сорока великих статуй различных заново открытых фигур народа эйейница вместе с именами сотен других, позолоченными на стенах; Поющая Святыня — искусное сооружение, позволяющее ветру проходить через систему отверстий, имитируя голоса затерянных; а также великие храмовые ворота, являющиеся одной из крупнейших арок в мире."

 building_type_01_khanazdar_khanduz: "Ханаздар Хандуз"
 khanazdar_khanduz_can_construct_tt: "Происходит от астиликской [culture|E]"
 building_01_khanazdar_khanduz: "Руины Ханаздар Хандуза"
 building_01_khanazdar_khanduz_desc: "Ханаздар Хандуз — это название массивного шестиуровневого укреплённого дворцового комплекса, построенного [astilik_empire|E] примерно в первом веке И. С. для наблюдения и защиты города Астила, важного торгового центра и одной из главных остановок на пути [kherkeloi_tin_trade|E]. Как и многие астиликские укрепления, Ханаздар Хандуз развивался и менялся на протяжении веков, вырастя из нескольких скромных валов неизвестного происхождения в лабиринт неприступных стен и высоких шпилей, созданных по образу и подобию [Concept('the_towers','Башен')|E].\n\nЦитадель пережила бесчисленные набеги ольтенов, как минимум три крупных пожара и короткий шестнадцатилетний период, когда она, казалось, и вовсе перестала существовать. И лишь в последние десятилетия восьмого века И. С. рушащаяся Астиликская империя окончательно покинула её. Сегодня руины Ханаздар Хандуза служат главным образом источником качественного камня для близлежащих поселений, а также время от времени дают приют бродягам и бандитам."
 building_02_khanazdar_khanduz: "Цитадель Ханаздар Хандуза"
 building_02_khanazdar_khanduz_desc: "Возрождённый во всём своём былом величии, Ханаздар Хандуз снова возвышается над окружающим ландшафтом, служа грозным оплотом против любого врага, дерзнувшего приблизиться к его стенам. Многочисленные стражники бдительно несут службу на многочисленных бойницах цитадели, а сила её укреплений, как говорят, уступает лишь пышности её внутренних палат и коридоров."
 building_03_khanazdar_khanduz: "Шпили Ханаздар Хандуза"
 building_03_khanazdar_khanduz_desc: "Подобно распускающемуся каменному цветку, Ханаздар Хандуз разросся далеко за пределы того, чем он когда-либо был. Его стены возвышаются подобно утёсам, его бойницы и башни кишат солдатами, и говорят, что преступники и злодеи исходят кровью при одном лишь виде его прекрасных и ужасных шпилей."

 building_type_01_temples_of_old_ialyrian: "Храмы Старого Иалириана"
 NOT_holy_site_astiliak_or_holy_site_trigger: "[holder|E] должен либо быть [GetFaithByKey('astiliak').GetAdherentName], иметь корни [GetCulturePillar('heritage_kherkeloi').GetName], поклоняться руинам или считать это место [holy_site|E]"
 building_01_temples_of_old_ialyrian: "Руины Старого Иалириана"
 building_01_temples_of_old_ialyrian_desc: "Иалириан был одной из первых засвидетельствованных столиц [astilik_empire|E] и конечным узлом маршрута [kherkeloi_tin_trade|E]. Хотя первые следы поселения в этом регионе датируются задолго до 2000 года ДИ, лишь тысячу лет спустя астилики вытеснили местные вармийские племена и основали сам город поверх уже существовавших руин. Названный одной из жемчужин [Concept('aironoian_bronze_age','древнего айронойского мира')|E], Иалириан быстро набирал силу и влияние на протяжении веков — сначала как морской и промышленный центр, а затем как важный религиозный центр с сотнями, если не тысячами храмов, каждый из которых был посвящён одному из богов обширного [Concept('astilik_gods','астилиакского пантеона')|E].\n\nПокровителем города был [Glossary('Ирраду','GH_IRRADU_GLOSS')], почитаемый как эгида империи и защитник слабых, чьё почитание и значение росли вместе с расцветом самого Иалириана; однако в конечном счёте его божественные силы не смогли помешать [Concept('aversaria','аверсарцам')|E] жестоко разграбить город в 768 году И. С., после чего он был по большей части заброшен."
 building_02_temples_of_old_ialyrian: "Восстановленные храмы Старого Иалириана"
 building_02_temples_of_old_ialyrian_desc: "Наконец восстановленные после веков запустения, многочисленные храмы Иалириана вновь открывают свои двери для паломников со всего Айроноя и из за его пределов. В воздухе витает аромат горящего фимиама, а вокруг выросли обширные рынки, чтобы кормить, размещать и одевать непрерывный поток прибывающих верующих."

 building_type_01_gates_of_kaz: "Врата Каза"
 gates_of_kaz_can_construct_tt: "Происходит от казувской [culture|E]"
 building_01_gates_of_kaz: "Солончаки Казвоска"
 building_01_gates_of_kaz_desc: "Дворец-город [Glossary('Казвоск','GH_KAZVOSK_GLOSS')], благословленный [Glossary('Бронзовым Владыкой','GH_BRONZE_SOVEREIGN_GLOSS')], был крупным [Concept('aironoian_bronze_age','древним айронойским')|E] населенным пунктом и одной из доминирующих сухопутных военных держав херкелойского мира. Хотя Казвоск был не так богат, как некоторые города [astilik_empire|E] или даже его сосед и вечный соперник Исанда, он тем не менее расширял свое влияние и могущество благодаря усилиям своих неукротимых армий, подчиняя под свое знамя множество более мелких сунакарских государственных образований и латтских племен. Эта агрессивная экспансия стала одной из причин, разжегших [wars_of_dominion|E], что в конечном итоге привело к падению дворца-города во время [desiccation_of_kazvosk|E].\n\nПокинутый немногочисленными выжившими жителями и почти повсеместно избегаемый окрестными народами, он не знал человеческой активности вплоть до прихода в регион [aversaria|E], когда солончаки Казвоска вновь стали использоваться — в первую очередь как почти неисчерпаемый источник соли высокой чистоты, быстро ставшей ценным товаром на рынках Ааутократы."
 building_02_gates_of_kaz: "Восстановленные Врата Каза"
 building_02_gates_of_kaz_desc: "Впервые за тысячелетия Врата Каза были восстановлены в своем былом величии. Целые пласты соли были выкопаны и заменены свежей почвой, дав новый шанс на жизнь земле, которая стояла мертвой и бесплодной на протяжении многих поколений. Новый [Glossary('Казвоск','GH_KAZVOSK_GLOSS')] пока еще может быть хрупким и уязвимым — но вскоре его дух пробудится вновь, и огромные армии снова промаршируют через его врата, чтобы бросить вызов миру."

 building_type_01_glassworks_of_ysanda: "Стекольные мастерские Исанды"
 building_01_glassworks_of_ysanda: "Кварцевый дом Исанды"
 gh_glassworks_of_ysanda_effect_desc: "$unlocks_building_desc$Повышенное качество спонсируемого [inspirations|E] на создание #V изделий из стекла#!"
 building_01_glassworks_of_ysanda_desc: "Производство стекла издавна было источником жизненной силы промышленности Исанды — сначала в виде сосудов, бус и небольших статуэток из пигментированного спеченного кварца, а позднее благодаря знаменитым [Concept('zelkavani_glassmaking','шедеврам стекольного дела')|E] зелкаванских ремесленников. В то время как децентрализованные мелкие мастерские были нормой на заре ремесла, в 237 году И. С. опасения по поводу сохранения секретов мастерства, пожароопасности и неприятных запахов привели к переносу всех разрозненных стекольных производств в специально отведенный район города в целях безопасности, где вся отрасль была объединена в одно огромное здание, призванное вместить все мастерские на долгие века."
 building_02_glassworks_of_ysanda: "Стеклянный дом Исанды"
 building_02_glassworks_of_ysanda_desc: "Достижения в стекольном деле и рост ремесленных гильдий изменили принципы работы исандских стеклодувов: ремесло перестало быть уделом мастеров-одиночек, передающих секретные техники своим ученикам, а превратилось в открытое поле деятельности для крупных мануфактур и сертифицированных профессионалов, конкурирующих друг с другом за аттестационные степени и лицензии. Стекольные мастерские расширились соответствующим образом и теперь охватывают несколько районов, причём у многих их обитателей нет почти никаких причин покидать их стены годами."
 building_03_glassworks_of_ysanda: "Хрустальный дом Исанды"
 building_03_glassworks_of_ysanda_desc: "Теперь Стекольные мастерские, больше напоминающие отдельный город, превратились в монументальный производственный центр беспрецедентного размера и мощности. Здесь производится самое чистое стекло, как магическое, так и обыденное, чтобы продаваться на рынках по всему [aeras|E], разнося легенду о местном мастерстве по всему известному миру. Говорят, что человек может прожить всю жизнь в стенах этого комплекса, ни в чём не испытывая нужды."

 building_type_01_abandoned_labyrinth: "Скрытый лабиринт"
 building_01_abandoned_labyrinth: "Заброшенный лабиринт"
 building_01_abandoned_labyrinth_desc: "Скрытый глубоко в горных долинах [hyratan_biozone|E], за темными пещерами и узкими расщелинами, находится одинокий дверной проем, высеченный в древней скальной породе. За ним простирается огромное пространство, большее, чем сами горы, вымощенное во всех направлениях плитами, которые едва заметно мерцают, несмотря на гнетущую тьму зала — тьму, которая, словно живая, жадно поглощает любой свет, осмелившийся удалиться дальше, чем на расстояние вытянутой руки от любого источника за порогом.\n\nНа любой живой ткани, принесенной в пустоту внутри, начинают появляться небольшие порезы, поначалу неглубокие, но медленно перерастающие в расширяющуюся кровоточащую мозаику из фрактальных узоров и спиралей. Со временем раны углубляются, сдирая кожу, а затем и мышцы, пока не останется лишь голая кость."

 building_type_01_halite_temple: "Галитовый храм"
 building_01_halite_temple: "Руины Галитового храма"
 building_01_halite_temple_effect_desc: "[extended_magic_baseline|E]:[Concept('magic','@magic_icon!')|E]#positive_value; +25#!\n[aspect_light] [spellcasting_success_chance|E]:@gh_light_icon!#positive_value; +5%#!\n[aspect_sand] [spellcasting_success_chance|E]:@gh_sand_icon!#positive_value; +5%#!"
 building_01_halite_temple_desc: "В период своего расцвета Галитовый храм был в равной степени центром паломничества, оплотом знаний и грозным политическим игроком как среди дворцов-городов [GetCulturePillar('heritage_kherkeloi').GetName], так и среди мелких вародайских королевств. Достигнув почти беспрецедентного духовного превосходства благодаря своим учениям о благородстве, жертвенности и чистоте, к концу третьего века И. С. он прямо или косвенно контролировал большую часть [Concept('kashti_flats_biozone','полуострова Кашти')|E].\n\nПроцветанию храма пришел конец с вторжением [iorne_horde|E] в [kashirya|E] и последовавшей за этим отчаянной попыткой организовать совместную оборону. Благодаря своему влиятельному положению галитовое жречество взяло на себя руководство коалицией — коалицией, которая была быстро и решительно разгромлена [Concept('otachedian_empire','Отачедом')|E] в битве при Бизане в 302 году И. С. В ходе последовавших мирных переговоров на храм были наложены суровые санкции, он был почти разграблен и потерял все свои материковые владения в пользу мигрирующих колргианских кланов и кланов [GetCulturePillar('heritage_dayatemi').GetName]. Хотя храм никогда не был официально распущен, суровая дань и долгое запустение привели к тому, что ко времени [bayyuralar|E] от него остались лишь руины, местами обнажив архитектуру, предшествующую письменной истории."
 building_02_halite_temple: "Галитовый храмовый комплекс" 
 building_02_halite_temple_effect_desc: "[extended_magic_baseline|E]:[Concept('magic','@magic_icon!')|E]#positive_value; +50#!\n[aspect_light] [spellcasting_success_chance|E]:@gh_light_icon!#positive_value; +10%#!\n[aspect_air] [spellcasting_success_chance|E]:@gh_sand_icon!#positive_value; +10%#!"
 building_02_halite_temple_desc: "Восстановленный в своем былом великолепии, Галитовый храм вновь привлекает множество паломников, [magi|E] и ученых к своим четырем тысячам ступеней и обширным священным реликвариям. Хотя он больше не является независимой силой в мире, который так сильно изменился за годы его запустения, знания и идеи редко теряются бесследно — и потому Храм готов выковать себя заново."
 wane_tender_harmoniarchy_school_trigger: "[culture|E] владельца практикует [Concept('magic_type','школу магии')|E] #V $wane_tender_harmoniarchy_name$#!"
 02_halite_temple_enable_tooltip: "[holder|E] должен исповедовать [faith|E], которая считает это место [holy_site|E], или принадлежать к [culture|E], которая либо практикует [Concept('magic_type','школу магии')|E] #V $wane_tender_harmoniarchy_name$#!, либо имеет [tradition|E] [GetCultureTradition('tradition_wasteland_reclaimers').GetName]"

 building_type_ayraal_office_01: "Печатные дворы айраала"
 building_type_ayraal_office_01_desc: "По [Concept('otachedian_empire','отачедианским')|E] законам правитель без [paiza|E] часто воспринимается не более чем как выскочка-мятежник, выступающий против божественно предопределенной — и чрезвычайно запутанной — воли Небес. Эти скромные металлические таблички свергли немало [Concept('kashirya','каширских')|E] королевств, но основали еще больше."
 building_ayraal_office_01: "Канцелярии айраала"
 building_ayraal_office_01_desc: "В хранилищах этого тщательно охраняемого комплекса находится одно из величайших [Concept('kashirya','каширских')|E] сокровищ: нетронутая форма для отливки [paiza|E], которую местный правитель может использовать по своему усмотрению. Множество клерков и бюрократов обитают в этих священных залах, выпуская бесконечный поток свитков и посланий в широкий мир."
 building_ayraal_office_02: "Королевская комиссия"
 building_ayraal_office_02_desc: "Установка массивного рычажного молота позволила местным чиновникам значительно увеличить масштабы производства [paiza|E] — будь то в благородных или гнусных целях. Поблизости строятся обширные архивы для размещения поистине гор бумаг, получающихся в результате этого, как для учета, так и для будущего изучения."
 building_ayraal_office_03: "Имперское бюро"
 building_ayraal_office_03_desc: "Неосведомленному наблюдателю легко можно было бы простить то, что он принял это здание за дворец — или, возможно, за поместье дворянина. Масштабы местной деятельности таковы, что скромный здешний клерк может обладать властью над большим количеством душ, чем многие лорды или мэры."

 building_type_01_ayars_mint: "Великий айраальский двор Аяра"
 building_01_ayars_mint: "$building_type_01_ayars_mint$"
 building_01_ayars_mint_desc: "[Glossary('Тарок Махан Айраал ам’Аяр','GH_TAROK_MAHAN_AYRAAL_AM_AYAR_GLOSS')] когда-то был одним из величайших [Concept('kashirya','каширских')|E] дворов по изготовлению [paiza|E], основанным сыном [Concept('otachedian_empire','Отачеда')|E] Аяром в 329 году И. С. для удовлетворения постоянно растущих законодательных потребностей южных владений империи. Благодаря размеру своей юрисдикции и интенсивности экономической деятельности в регионе, это учреждение оставалось крупнейшим отачедианским административным центром в окрестностях [Concept('rovarska_biozone','Пиратского берега')|E] — вплоть до 362 года И. С., когда оно было почти до основания разрушено в хаосе Войны Пяти Братьев.\n\nТолько после создания [taryaad_saramsaasan|E] двор вернул себе часть былого величия и подвергся множеству столь необходимых реконструкций, хотя после окончательного краха империи он быстро вновь погрузился в относительную безвестность."
 building_02_ayars_mint: "Зал Последнего Неба"
 building_02_ayars_mint_desc: "[Glossary('Сьярва Эрам Аккара','GH_SJARVA_ERAM_AKKARA_GLOSS')] — это обширное подземное хранилище под [Glossary('Тарок Махан Айраал ам’Аяр','GH_TAROK_MAHAN_AYRAAL_AM_AYAR_GLOSS')], наиболее известное тем, что в нем покоилось тело покойного [Concept('otachedian_empire','Отачеда')|E] после кончины великого завоевателя в 318 году И. С. и вплоть до его пышных похорон пять лет спустя. Став домом для огромного множества реликвий периода позднего Отачеда, когда-то, как утверждалось, он хранил резервные копии почти всех форм для [paiza|E], произведенных в [kashirya|E]."

 building_type_01_otacheds_mint: "Великий имперский айраальский двор"
 building_01_otacheds_mint: "$building_type_01_otacheds_mint$"
 building_01_otacheds_mint_desc: "[Glossary('Хайтратарок Махан Айраал','GH_HAYTRATAROK_MAHAN_AYRAAL_GLOSS')] — первый и величайший из [Concept('otachedian_empire','отачедианских')|E] дворов по изготовлению [paiza|E], основанный самим великим завоевателем в 314 году И. С. в тот самый день, когда он провозгласил роспуск [iorne_horde|E] и создание легендарной Отачедианской Империи. Расположенный в самом сердце первой имперской столицы, этот двор веками оставался краеугольным камнем [Concept('kashirya','каширской')|E] политики, пережив не только породившее его государство, но и многие другие, появившиеся с тех пор."
 building_02_otacheds_mint: "Обсидиановая машина"
 building_02_otacheds_mint_desc: "Центральный комплекс [Glossary('Хайтратарок Махан Айраал','GH_HAYTRATAROK_MAHAN_AYRAAL_GLOSS')] закрыт для всех, кроме нескольких избранных агентов правящей бюрократии, технически независимых в своем праве с момента падения [otachedian_empire|E].\n\nТам, скрытая от посторонних глаз, стоит [Glossary('Янтра Джвалакаач','GH_YANTRA_JVALAKAACH_GLOSS')] — гигантская машина из черного стекла и стали [magi|E], которая, как говорят, знает каждый закон в [aeras|E], будь то прошлый, настоящий или будущий, и безошибочно выносит по ним решения. Хотя точное происхождение и устройство этого артефакта, как считается, были утеряны во время [chan_skorpokaipis|E], на некоторых его деталях сохранились надписи на различных [Concept('kashirya','каширских')|E] языках, датируемые периодом с седьмого по девятый века И. С."

 ayraal_county_effect_desc: "$unlocks_building_desc$Позволяет создавать [artifacts|E] типа [paiza|E] уровня: [county|E]"
 ayraal_duchy_effect_desc: "$unlocks_building_desc$Позволяет создавать [artifacts|E] типа [paiza|E] уровня: [duchy|E]"
