 building_type_01_dragoncourt: "Драконий Двор"
 building_type_01_dragoncourt_desc: "Большой исторический замок, являющийся главным оплотом власти в Долине Дара Фей уже более тысячелетия."
 building_01_dragoncourt: "Дуб барона Терина"
 building_01_dragoncourt_desc: "Задолго до того, как трагический барон Терин обрел покой, лишив себя жизни, до прихода легионов [Concept('aversaria','Аверсарии')|E], до того, как первый вождь шевигадов ступил на черную почву долины, до того, как были заложены первые камни [GetBuilding('02_dragoncourt').GetName], и даже до того, как имя Короля-Чародея $kathanouxa_link$ Катануксы#! впервые прошептали в Даре Фей, этот почтенный дуб уже стоял здесь — возвышаясь над великими озерами, между которыми он укрылся. По всей вероятности, он переживет и все, что его окружает.\n\nОднако в данный момент он уютно расположился во внутреннем дворе замка, а кружевная тень, которая когда-то скрывала друидические пляски и первобытные ритуалы, теперь защищает пиры от полуденного солнца."
 building_02_dragoncourt: "Шпиль Принцессы"
 building_02_dragoncourt_desc: "Возведенный в последние века правления $kathanouxa_link$ Катануксы#!, в то любопытное время, что зажато между эпохой мифов и должным образом зафиксированной историей, Шпиль Принцессы является самой старой из сохранившихся частей Дракоьего Двора. Именно отсюда наместники Короля-Чародея распространяли свою власть на окружающую долину и именно здесь $golden_rowan_link$ Кин из Золотой Рябины#! впервые принял королевский титул после того, как эта власть за ночь рухнула; он стал первым, но далеко не последним монархом, правившим из этого замка. Хотя род Кина был истреблен драконом по имени $tyrandax_link$ Тирандакс#! и сменен домом $clothar_i_link$ Клотаря#!, солярий башни продолжал служить королевской опочивальней до тех пор, пока в Драконьем Дворе вообще правили короли — последним из которых был $aloric_link$ Алорик Заносчивый#! в IV веке."
 building_03_dragoncourt: "Драконий Шпиль"
 building_03_dragoncourt_desc: "Говорят, что жестокий $tyrandax_link$ Тирандакс#! так гордился этой внушительной башней — самой высокой во всей долине, — что проклял любого, кто дерзнет построить башню еще выше. Несмотря на внешнее великолепие, сооружение долгое время пользовалось дурной славой; многие говорят, что кровь тысяч рабов, запеченная в растворе драконьим пламенем Тирандакса, навечно прокляла башню, некоторые считают, что использование ее в качестве темницы деспотичным $clothar_iii_link$ королем Клотарем III 'Ведьминой Кровью'#! привело к скоплению злых энергий в ее темных лестничных пролетах, а третьи и вовсе списывают эти истории на детские суеверия и сплетни поварят.\n\nОднако несомненно то, что высота башни, неудобные лестницы, редкий доступ солнечного света и мрачная репутация привели к тому, что ее верхние ярусы часто оставались заброшенными или почти не использовались на протяжении веков."
 building_04_dragoncourt: "Старый Донжон"
 building_04_dragoncourt_desc: "Не совсем настоящий донжон, но и не просто большой зал, этот запутанный комплекс построек, соединяющий [GetBuilding('02_dragoncourt').GetName] и [GetBuilding('03_dragoncourt').GetName], возводился по частям на протяжении нескольких веков. Зал Клотаря, к примеру, был построен вовсе не его предполагаемым тезкой и даже не его потомками; его характерная [Glossary('неоойчайнская','NEO_OJYCZANYZ_ARCHITECTURE_GLOSS')] архитектура выдает его происхождение из VII века, созданное руками самого знаменитого мастера Вийкона из Гарьё. Значительно старше его и, по сути, древнейшим сооружением самого донжона является небольшая каменная каплица, построенная $valoric_the_good_link$ королем Валориком I 'Добрым'#!, хотя технически она физически не соединена с остальной частью комплекса.\n\nСреди других примечательных мест — просторные кухни донжона, построенные во время правления $gudoulf_the_rotund_link$ барона Гудульфа 'Тучного'#!; а также винные погреба замка, #italic также#! сооруженные при Гудульфе — хотя он был бы глубоко шокирован, если бы дожил до дня, когда его благочестивый внук, $marcomer_faegift_link$ барон Маркомер#!, выбросит его драгоценные бочки в озеро Энтис и временно превратит это помещение в приют для бедных."
 building_05_dragoncourt: "Стены Зайцененавистника"
 building_05_dragoncourt_desc: "Мощные крепостные стены, защищающие Драконий Двор, восходят к бурные временам начала VII века. Когда Клотарь IV 'Зайцененавистник' боролся с бичом Правления Зайца, он проницательно предсказал, что хаос в регионе будет только нарастать, и заранее взялся за то, чтобы сделать свой замок неприступным как для осады, так и для проклятий фей. На завершение проекта ушло пятнадцать лет, и барон практически опустошил свою казну, но результат оказался внушительным как в обыденном, так и в магическом плане; сообщается, что в стены были даже вплетены запретные ольчанские ритуалы.\n\nВсего несколько лет спустя проблемы Предела достигли апогея во время [Glossary('Войны Чёрного тиса','WAR_OF_THE_BLACK_YEW_GLOSS')], и Драконий Двор оказался в осаде одной из самых чудовищных орд красных колпаков $silver_hair_link$ Карттуэна Серебряноволосого#!. Орде так и не удалось взять замок, и она сгинула после поражения Карттуэна. Позже Королевство Гор и Предела еще сильнее укрепило эту оборону, справедливо рассматривая замок как ключевой оплот для предотвращения [Concept('aversaria','аверсарианского')|E] отвоевания региона — отбившего шесть атак, пока $aauto_eramos_link$ Эрамос#! не сумел взять его хитростью в 727 году И. С. в ходе своего Великого Северного похода."
 building_06_dragoncourt: "Кабинет Драконьего Наседства"
 building_06_dragoncourt_ruined: "Кабинет Драконьего Наседства (Разрушено)"
 building_06_dragoncourt_desc: "К завершению [chaos_of_the_seventh_century|E] шестьсот лет запустения привели [GetBuilding('03_dragoncourt').GetName] в самое удручающее состояние в истории, пригодное лишь для обитания птиц и крыс. Сообщалось, что барон Валорик II даже рассматривал возможность полного сноса сооружения на стройматериалы, но его преждевременная смерть помешала этим планам. Вместо этого его сын и преемник, Гиль, позаботился о столь необходимом Драконьему Шпилю восстановлении: его рушащиеся лестницы были перестроены, сгнившие деревянные полы заменены на отполированные дубовые доски, кровожадный призрак $clothar_iii_link$ короля Клотаря III#! был наконец упокоен, странник и [Concept('aversaria','аверсарианский')|E] жрец освятили здание, были установлены очаги и другие удобства, а над ранее открытым верхним этажом возвели полноценную крышу.\n\nЗатем Гиль превратил новый солярий башни в кабинет. Последующие поколения более образованных правителей замка продолжили его обустройство, разместив там большую библиотеку, алхимическую мастерскую и астрономическое оборудование."
 building_06_dragoncourt_desc_ruined: "$building_06_dragoncourt_desc$\n\n@warning_icon! #X Уничтоженный пожаром 1211 года И. С., Кабинет Драконьего Наседства снова заброшен. Пожар был настолько сильным, что растрескались даже камни.#!"
 building_07_dragoncourt: "Зал Метрилоса"
 building_07_dragoncourt_ruined: "Зал Метрилоса (Разрушено)"
 building_07_dragoncourt_desc: "Метрилос Амнитриак — придворный императора, драматург, слухи о связи которого с Киверной Тематеей из Калатипсоми не утихали, и первый [Concept('aversaria','аверсарианский')|E] правитель Дракоьего Двора — взялся за украшение своего нового дома практически в тот же миг, как впервые увидел его. Он приказал побелить стены, а стареющую кровлю двух его великих башен и многочисленных турелей заменить конусами из синего сланца из его родной Опахасии, что придало Драконьему Двору его узнаваемый современный облик.\n\nНо самым амбициозным его планом было расширение [GetBuilding('04_dragoncourt').GetName], который он насмешливо называл непригодным даже для конюшни, не говоря уже о парадном зале. Метрилос не дожил до завершения этого проекта — зальное помещение было достроено лишь спустя десятилетия, при правлении его дочери Эвриники 'Кроткой'. Однако великий зал, носящий его имя, с его впечатляюще высокими стрельчатыми окнами, орнаментированными колоннами, сводчатым интерьером и пышным убранством, действительно считается одним из самых красивых и амбициозных образцов архитектуры Второго Золотого века Аверсарии."
 building_07_dragoncourt_desc_ruined: "$building_07_dragoncourt_desc$\n\n@warning_icon! #X Великий зал Метрилоса обрушился после того, как замок подвергся обстрелу арканным огнем во время осады 1211 года И. С., и с тех пор большая часть его изысканного мрамора была разобрана на восстановительные работы и строительство в других местах.#!"
 building_08_dragoncourt: "Золотой Шпиль"
 building_08_dragoncourt_ruined: "Золотой Шпиль (Разрушено)"
 building_08_dragoncourt_desc: "Хотя на протяжении веков к Драконьему Двору добавлялись десятки меньших башен и турелей, ни одна из них не могла сравниться по размерам с [GetBuilding('02_dragoncourt').GetName] или [GetBuilding('03_dragoncourt').GetName], возведенными с использованием древних катануксийских техник, давно утерянных во времени. Деспекса Ксития решила пустить огромное состояние, унаследованное от ее пресловутого скупого отца, на благое дело и оставить свой след в истории замка, построив башню, превосходящую даже [GetBuilding('03_dragoncourt').GetName].\n\nКогда спустя почти полвека Ксития скончалась, башня не достигла и половины запланированной высоты, а её строительство затормозилось из-за бесконечных неудач и растущих финансовых проблем. Оглядываясь назад, чересчур амбициозный и непрактичный проект в сочетании с ухудшающимся положением как дома Амнитриак, так и [aversaria|E] в целом, вероятно, с самого начала обрек его на провал, хотя некоторые шептались, что проклятие $tyrandax_link$ Тирандакса#! карает гордыню Деспексы. Не видя реального способа завершить первоначальный замысел шпиля, преемник Кситии решил завершить постройку в её текущем состоянии, компенсировав недостаток высоты захватывающим позолоченным солярием."
 building_08_dragoncourt_desc_ruined: "$building_08_dragoncourt_desc$\n\n@warning_icon! #X Хотя сооружение все еще стоит, его золотые украшения были полностью ободраны, а часть конструкции получила серьезные повреждения после прямого магического попадания в 1211 году И. С.#!"

 building_type_01_saint_hugomers_cathedral: "Собор Святого Гюгомера"
 building_type_01_saint_hugomers_cathedral_desc: "Шедевр эптрандексской [Glossary('неоойчайнской','NEO_OJYCZANYZ_ARCHITECTURE_GLOSS')] архитектуры, белоснежное здание собора Святого Гюгомера с лазурными окнами было возведено в самый разгар [Glossary('Тридцати золотых лет','THIRTY_GOLDEN_SUMMERS_GLOSS')] в 579 году И. С. Именно здесь Косен был коронован как первый король Гор и Предела по завершении [Glossary('Войны Чёрного тиса','WAR_OF_THE_BLACK_YEW_GLOSS')], и именно здесь собрался Совет Одбрю, чтобы порвать с Раокуром в 801 году И. С."
 building_01_saint_hugomers_cathedral: "$building_type_01_saint_hugomers_cathedral$"
 building_01_saint_hugomers_cathedral_generic: "[Province.GetCounty.GetFaith.HouseOfWorship|U] в провинции [Province.GetNameNoTooltip]"
 building_01_saint_hugomers_cathedral_polytheist: "[Province.GetCounty.GetFaith.HouseOfWorship|U] бога [Province.GetCounty.GetFaith.KnowledgeGodName|U] в провинции [Province.GetNameNoTooltip]"
 building_01_saint_hugomers_cathedral_desc: "$building_type_01_saint_hugomers_cathedral_desc$"

 building_type_01_wizardsbridge: "Мост Катануксы"
 building_type_01_wizardsbridge_desc: "На протяжении веков это был не только единственный мост через Патос, но и самый длинный на всем Расколотом Берегу — величественный подвиг инженерии, о котором часто говорили, что он стал возможен лишь благодаря утерянной магии $kathanouxa_link$ Катануксы#!. Статуи Короля-Чародея когда-то выстраивались вдоль его парапетов, но к концу [chaos_of_the_seventh_century|E] все они либо были убраны, либо разрушились под воздействием времени, а их пустые постаменты в конечном итоге заняли статуи Тейссии-как-Аэлиды."
 building_01_wizardsbridge: "$building_type_01_wizardsbridge$"
 building_01_wizardsbridge_desc: "$building_type_01_wizardsbridge_desc$"
 building_02_wizardsbridge: "Надвратные башни Ануэ и Ануэна"
 building_02_wizardsbridge_desc: "Если [GetBuilding('01_wizardsbridge').GetName] и имел укрепления во время его правления, ни одно из них не сохранилось до наших дней. Надвратные башни, охраняющие подступы к нему, явно отличаются по архитектуре, будучи построенными в какой-то момент в королевский или ранний баронский период Эстразии — возможно, даже враждовавшими братьями [Glossary('Ануэ и Ануэном','HANOUET_AND_HANOUIN_GLOSS')].\n\nС этими относительно небольшими, но древними сооружениями связано множество историй: Призрака Пьяного Стражника чаще всего видели в надвратной башне Ануэ; подъемный механизм в башне Ануэна был замешан в ряде зловещих инцидентов и подозрительных смертей на протяжении всей истории; и оба сооружения, как говорят, обладают своего рода собственной волей, обижаясь на тех, кто явно предпочитает их «собрата»."
 building_03_wizardsbridge: "Великий Ридан"
 building_03_wizardsbridge_desc: "На протяжении большей части шестисот лет своего существования Великий Ридан собирался в этой просторной палате; высокая ротонда с двадцатью двумя окнами, в которой он располагается, построена в [Glossary('неоойчайнском','NEO_OJYCZANYZ_ARCHITECTURE_GLOSS')] стиле эпохи [Glossary('Тридцати золотых лет','THIRTY_GOLDEN_SUMMERS_GLOSS')]. Массивный дубовый круглый стол, стоящий в ее центре, был заказан королем Гор и Предела Косеном в знак доброй воли к своим новым подданным, и именно здесь происходили некоторые из самых драматических событий политической истории региона. После роспуска Ридана в X веке комната была заперта императорским указом — хотя правители замка, как сообщается, иногда сдержанно использовали ее в личных целях."

 building_type_01_altar_of_spring: "Алтарь Весны"
 building_type_01_altar_of_spring_desc: "Грубо отесанный, покрытый мохом каменный алтарь, где прохождение весеннего равноденствия праздновалось тысячелетиями теми, кто соблюдает [cycle_of_the_wood|E]."
 building_01_altar_of_spring: "$building_type_01_altar_of_spring$"
 building_01_altar_of_spring_desc: "$building_type_01_altar_of_spring_desc$"

 building_type_01_altar_of_summer: "Алтарь Лета"
 building_type_01_altar_of_summer_desc: "В бескрайнем поле наперстянок, скрытый небольшой рощей лип, лежит известняковый алтарь, облепленный пчелиными ульями. С незапамятных времен те, кто соблюдает [cycle_of_the_wood|E], праздновали здесь летнее солнцестояние песнями и пирами, моля силы самого теплого сезона ниспослать хороший урожай — этот ежегодный ритуал был настолько важен, что сам $kathanouxa_link$ Король-Чародей#! удостаивал его личной организацией в расцвет своей империи.\n\nХотя с приходом шевигадов эти праздники уменьшились в масштабах и величии, они никогда не угасали полностью; более того, многие короли Онривьера пытались проводить их, хотя их слабое понимание магии часто приводило к тому, что результат оказывался неэффективным."
 building_01_altar_of_summer: "$building_type_01_altar_of_summer$"
 building_01_altar_of_summer_desc: "$building_type_01_altar_of_summer_desc$"

 building_type_01_altar_of_winter: "Алтарь Зимы"
 building_type_01_altar_of_winter_desc: "На живописных берегах озера Миграддр лежит белоснежный алтарь, посвященный силам зимы. Здесь в изобилии растет только мокролист, в остальном же даже самые стойкие сорняки вянут в морозных окрестностях древнего камня."
 building_01_altar_of_winter: "$building_type_01_altar_of_winter$"
 building_01_altar_of_winter_desc: "$building_type_01_altar_of_winter_desc$"

 building_type_01_nira_yew: "Круг Нирийского Тиса"
 building_type_01_nira_yew_desc: "Присемянники тисов этого леса имеют такой же ярко-алый оттенок, как сверкающие рубины, и алтари, сопровождающие многие из деревьев, возможно, могут подтвердить причину этого. Некоторые из них могут быть почти такими же древними, как и сами ветви, под которыми они лежат — грубые камни, потемневшие от тысячелетий засохшей крови, — в то время как другие явно являются более недавними дополнениями. По меньшей мере два были построены во время правления $kathanouxa_link$ Катануксы#!, над которыми возвышались статуи бесстрастного Короля-Чародея, хотя к настоящему времени они давно заброшены и отданы на откуп окружающему лесу. Один из них мог быть возведен во время войн Двенадцати Регентов, хотя сопровождающий его памятник изуродован до неузнаваемости, что делает невозможным установление первоначального благодетеля. Шевигады также явно осознавали силу этих мест, разместив под их кронами множество путевых святилищ, хотя сам факт человеческих жертвоприношений в те времена был бы запрещен законом. Даже [aversaria|E] внесла свой вклад: красивый храм Йетросу огибает особенно крупный и исторический тис.\n\nПомимо того, что деревья служат местами жертвоприношений, их сок известен своими мощными арканными свойствами; когда-то его ревностно охраняло Сестринство Нирийского Тиса, пока оно не было истреблено королем Эстразии Клоадаром II 'Бичом Ведьм'. Даже после этого первобытные рощи не остались без защитника, ибо вскоре после этого в исторических текстах начинают появляться первые упоминания о [Glossary('Красном Рикомере','RED_RICOMER_GLOSS')]. Какова бы ни была его истинная природа, мало кто с тех пор был достаточно глуп, чтобы осквернить его владения."
 building_01_nira_yew: "$building_type_01_nira_yew$"
 building_01_nira_yew_desc: "$building_type_01_nira_yew_desc$"
 
 building_type_01_duragarn_kharathi: "Дурагарн-Харати"
 building_type_01_duragarn_kharathi_desc: "До своего опустошения Пастью Глубин могучий Дурагарн-Харати был одним из величайших оплотов этилизцев своего времени. Стоя в месте, где подземные воды реки Сурат впервые выходят на дневной свет, он является одним из самых прямых входов в бездонные просторы Подземья Железного Хребта — и часто считается самым живописным и безопасным. В отличие от большинства своих собратьев, он имеет довольно открытую планировку. Вместо темных, клаустрофобных коридоров, которыми так печально известны многие другие этилизские руины, в Дурагарн-Харати преобладают ослепительные променады, возвышающиеся над чарующими водами Сурата и освещаемые светящимися грибными лесами, растущими по ее берегам.\n\nПосле веков запустения твердыня была вновь заселена шахтерами, прибывшими по королевскому указу короля Скайнкрауна Галамоса, который славился своей одержимостью богатствами, скрытыми в руинах под его королевством. Со временем это место стало оживленным узлом сети золотых, серебряных и аметистовых рудников, а среди разрушающихся променадов и площадей древнего мегаполиса начал процветать небольшой город. Слабый отблеск его древней славы, возможно, но это единственный этилизский город, в котором и по сей день кипит человеческая жизнь."
 building_01_duragarn_kharathi: "$building_type_01_duragarn_kharathi$"
 building_01_duragarn_kharathi_desc: "$building_type_01_duragarn_kharathi_desc$"
 
