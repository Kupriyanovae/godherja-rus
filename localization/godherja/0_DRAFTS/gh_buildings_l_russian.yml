 building_01_grand_velostadd: "Великий Велостадд"
 building_01_grand_velostadd_desc: "$building_type_01_grand_velostadd_desc$"
 building_type_01_grand_velostadd: "Великий Велостадд"
 building_type_01_grand_velostadd_desc: "Воздвигнутый избранниками Велоса на костях старой веры и оплаченный пожертвованиями верных последователей Велосгроба, Великий Велостадд является церемониальным сердцем ритуала Велосгроба. Его великие залы для процессий созданы так, чтобы вместить всё духовенство [Glossary('Велоса','VELOS_GLOSS')] целиком, а его колокол слышен на три лиги вокруг."
