 building_01_griffon_roost: "Гнездовье грифонов"
 building_01_griffon_roost_desc: "Позволяет нанимать [GetMaA('griffon_riders').GetName] как [men_at_arms|E]\n\nСостоящее из высокой деревянной башни и нескольких прилегающих построек, это здание позволяет грифонам гнездиться под нашим присмотром."

 building_01_gujak_mines: "Шахтерское поселение Гуджак"
 building_01_gujak_mines_desc: "Прекрасная бирюза Гуджака тысячелетиями украшала дворы Кемсара, хотя когда-то ее было куда труднее добыть из-за расположения рудника на выжженных окраинах мира [Glossary('ран кемсарцев','GH_RAN_KEMSARI_GLOSS')]. Когда после Битвы за Разорванную Цепь великая река изменила свое русло, прибывающие амсарские поселенцы с приятным удивлением обнаружили близость процветающих месторождений, и в столетия, последовавшие за основанием Хиклана, добыча на этом месте резко возросла. Дворцы Чоурана наполнены бирюзой почти так же, как и сами рудники, а этот минерал стал фактически клише в убранстве столицы."

