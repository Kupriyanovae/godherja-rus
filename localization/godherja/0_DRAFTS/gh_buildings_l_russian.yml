 building_01_phanapetra_mines: "Шахтерское поселение Фанапетра"
 building_01_phanapetra_mines_desc: "В лучшие времена рядовой гражданин Аагиократии при одном лишь упоминании Фанапетры сразу же воображал невероятные горы золота абсурдных пропорций, добываемые жадными, развращенными опахасийскими дворянами. Нынче же вы, скорее всего, встретите лишь недоуменный взгляд, так как Фанапетра канула в небытие вместе со своими давно истощившимися минеральными богатствами. Не стоит заблуждаться — количество золота в этих шахтах все еще довольно значительно, но большинство самых прибыльных жил были истощены веками ранее и оставлены позади гораздо более продуктивными рудниками Малькоиса."

