 building_type_falcon_roost_01: "Гнездовья соколов"
 building_type_falcon_roost_01_desc: "Священное святилище у предгорий гор, где выхаживают соколов для дрессировки сарминскими всадницами, после чего их выпускают жить под Матерью-Небом."
 building_falcon_roost_01: "Соколиные насесты"
 building_falcon_roost_01_desc: "Скромный каменный выступ, покрытый искусной резьбой, служащий местом гнездования соколов. За гнездами ухаживают шаманы, отбирающие самых способных птиц для доставки посланий и охоты."
 building_falcon_roost_02: "Инкубационные насесты"
 building_falcon_roost_02_desc: "Большие каменные карнизы вмещают ряды гнезд хищных птиц с десятками птенцов. Выведенные здесь соколы быстрее и опаснее диких, но при этом остаются верными спутниками."
 building_falcon_roost_03: "Присады для хищников"
 building_falcon_roost_03_desc: "Высокие столбы возводятся для того, чтобы соколы могли восседать на них и обозревать окрестности. Там они могут чистить клювы, ухаживать за перьями и отдыхать в безопасности."
 building_falcon_roost_04: "Управляемые гнездовья"
 building_falcon_roost_04_desc: "За гнездящимися соколами присматривают смотрители, которые ухаживают за птицами, обеспечивая здоровье и крепкую популяцию всей стаи."
 building_falcon_roost_05: "Ловушки для молодых птиц"
 building_falcon_roost_05_desc: "Приманки-ловушки сооружаются для отлова и дрессировки соколов, пока они еще находятся в юношеском оперении. Раннее приучение к контакту с человеком позволяет этим птицам развивать более крепкую привязанность и становиться свирепыми спутниками."
 building_falcon_roost_06: "Разлёточные садки"
 building_falcon_roost_06_desc: "Еще не оперившиеся соколиные птенцы помещаются в защищенные вольеры и снабжаются пищей до того, как смогут встать на крыло, что подготавливает молодых хищников к раскрытию их полного охотничьего потенциала через физическую нагрузку и опыт."
 building_falcon_roost_07: "Дрессировочные соколыни"
 building_falcon_roost_07_desc: "Обширные участки земли с крупными птичниками в центре предназначены для натаскивания поколений соколов по единой системе, стирая грань между дрессировкой и одомашниванием."
 building_falcon_roost_08: "Профессиональные селекционеры"
 building_falcon_roost_08_desc: "Полноценные гильдии объединились для централизации разведения соколов, выращивая лучших хищных птиц, каких только видел Континент. Тщательно отобранные за свою скорость и преданность, они становятся отличными разведчиками и верными спутниками."

 falcon_roost_effect_desc: "$unlocks_building_desc$Увеличивает шанс [hunt_sighting_no_prefix|E] соколиной охоты и [hunt_success_chance|E] для [activities|E] [GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName], устраиваемых в этом [holding|E]"

 building_type_xapanta_plantations_01: "Плантации ксапанты"
 building_type_xapanta_plantations_01_desc: "Древесный сок ксапанты — бесценный ресурс для любого, кто пытается выжить в [cyrat_biozone|E], поскольку он является основным компонентом почти мифической мази «Духовная кожа» — сверхъестественно эффективного средства от насекомых и противоядия. Таким образом, выращивание и подсочка этих деревьев стали важнейшей частью местной экономики."
 building_xapanta_plantations_01: "Подсочки ксапанты"
 building_xapanta_plantations_01_desc: "С деревьев ксапанты в этой местности регулярно собирают сок, который используется в производстве мази «Духовная кожа» — мощного противоядия и средства от насекомых, бесценного для любого, кто пытается выжить в джунглях [cyrat_biozone|E]."
 building_xapanta_plantations_02: "Управляемые поросли"
 building_xapanta_plantations_02_desc: "Истощенные деревья неоднократно срубают почти до самого основания, не убивая их, что приводит к быстрому появлению новых полезных побегов из пней."
 building_xapanta_plantations_03: "Обогащенные почвы"
 building_xapanta_plantations_03_desc: "Торф, компост и кровяная мука добавляются в почву джунглей для повышения ее плодородия, ускоряя рост деревьев и увеличивая количество добываемого сока."
 building_xapanta_plantations_04: "Культивируемые рощи"
 building_xapanta_plantations_04_desc: "Участки земли расчищаются от подлеска, что позволяет выращивать множество деревьев ксапанты вплотную друг к другу."
 building_xapanta_plantations_05: "Глубокие желоба"
 building_xapanta_plantations_05_desc: "Длинные игловидные металлические желоба вбиваются почти в самое сердце деревьев, что кардинально увеличивает количество собираемого сока."
 building_xapanta_plantations_06: "Управляемые древостои"
 building_xapanta_plantations_06_desc: "Деревья ксапанты выращиваются обособленными группами, образуя лески одного размера, возраста и состояния здоровья, что значительно упрощает уход за ними."
 building_xapanta_plantations_07: "Восстановительные методы"
 building_xapanta_plantations_07_desc: "Состояние каждого дерева оценивается индивидуально, чтобы определить количество подсочек, которое оно может выдержать за раз, что продлевает им жизнь и сохраняет высокую урожайность."
 building_xapanta_plantations_08: "Сады ксапанты"
 building_xapanta_plantations_08_desc: "Вокруг этих колоссальных плантаций возникли многочисленные поместья невиданных ранее масштабов, без труда обеспечивающие соком как местный регион, так и земли далеко за его пределами."

 building_mammoth_pens_requirement_terrain_loc: "[GetBuilding('mammoth_pens_01').GetName] можно построить только на местности [GetTerrain('taiga').GetName] или [GetTerrain('forest').GetName] [terrain|E]"
 building_type_mammoth_pens_01: "Мамонтовня"
 building_type_mammoth_pens_01_desc: "Здесь содержат и дрессируют мамонтов. Из них получаются отличные вьючные животные, полезные как для работы, так и для войны."
 building_mammoth_pens_01: "Загоны для мамонтов"
 building_mammoth_pens_01_desc: "Эти прочные стойла способны удержать даже самого своенравного мамонта."
 building_mammoth_pens_02: "Ловушки на мамонтов"
 building_mammoth_pens_02_desc: "Новых мамонтов отлавливают с помощью различных средств, таких как ловчие ямы или силки. Иногда в качестве приманки используют даже самку мамонта."
 building_mammoth_pens_03: "Тренировочные площадки для мамонтов"
 building_mammoth_pens_03_desc: "Мамонты — непростые в обучении животные, но на тренировочных площадках самые опытные погонщики делают всё возможное, чтобы снабдить корону боевыми зверями."
 building_mammoth_pens_04: "Полигоны для верховых мамонтов"
 building_mammoth_pens_04_desc: "На ездовых полигонах мамонтов подвергают испытаниям, заставляя переносить экипаж, доспехи и снаряжение."
 building_mammoth_pens_05: "Кабинеты надзирателей"
 building_mammoth_pens_05_desc: "Надзиратели отвечают за благополучие мамонтов, и постройка надлежащих кабинетов для них обеспечивает высокую эффективность их работы."
 building_mammoth_pens_06: "Лечебницы для мамонтов"
 building_mammoth_pens_06_desc: "Специализированные лечебницы для мамонтов достаточно велики, чтобы вместить даже самого крупного самца, спасая жизни животным, которые иначе гарантированно погибли бы."
 building_mammoth_pens_07: "Заповедники для мамонтов"
 building_mammoth_pens_07_desc: "Выделяя обширные участки тундры под заповедники для мамонтов, мы гарантируем, что меньше животных пострадает от браконьеров, а их популяция останется стабильной."
 building_mammoth_pens_08: "Заводчики мамонтов"
 building_mammoth_pens_08_desc: "Заводчики мамонтов следят за тем, чтобы новые детеныши рождались и выращивались только от самых лучших и здоровых особей."

 building_type_herdstone_01: "Мегалит стадного камня"
 building_type_herdstone_01_desc: "Стадные камни, обычно возводимые в центре крупных поселений — это места, где местные скотоводы собираются для торговли и обсуждения важных дел."
 building_herdstone_01: "Стадный камень"
 building_herdstone_01_desc: "Большой вертикальный камень в центре поселения служит центром религиозных ритуалов и общественных собраний. В трудные времена могучие воины собираются у его основания, чтобы совместно защищать свои родные земли."
 building_herdstone_02: "Резной монолит"
 building_herdstone_02_desc: "На каменную поверхность нанесена искусная резьба, а окружающий его хендж кипит жизнью."
 building_herdstone_03: "Украшенная стела"
 building_herdstone_03_desc: "Искусно высеченные менгиры стоят стражей вокруг поселения, и множеством рьяных защитников готовы по первому зову встать на его защиту."

 building_type_gh_axe_house_01: "Зал топоров"
 building_type_gh_axe_house_01_desc: "Зал топоров служит местом сбора как для воинов, так и для артистов — и грань между ними часто размывается, ибо их топоры двигаются с одинаковым изяществом как в [Concept('sevra_par','таинственном танце')|E], так и в бою."
 building_gh_axe_house_01: "Дом топоров"
 building_gh_axe_house_01_desc: "Именитый зал, где мастера [sevra_par|E] собираются, чтобы выступать, хвастаться, соревноваться и передавать свои знания о войне; место, где воинская доблесть переплетается с культурным празднеством."
 building_gh_axe_house_02: "Ложи Кан'пахури"
 building_gh_axe_house_02_desc: "Немногие могут похвастаться таким мастерством владения формами [sevra_par|E], как Кан'пахури — смертоносные пляшущие виртуозы топора. Общительные до безрассудства, они всегда держат свои ложи полными песен и веселья, пока опытные воины и надежные любители вместе участвуют в бесконечных пирах."
 building_gh_axe_house_03: "Севра Туун"
 building_gh_axe_house_03_desc: "Только самым величественным Залам топоров дарована привилегия именоваться [Glossary('Севра Туун','GH_SEVRA_TUUN_GLOSS')], где красота и опасность сливаются воедино, словно превосходя смертные пределы."

 building_type_gh_glassworks_01: "Стекольные литейные"
 building_type_gh_glassworks_01_desc: "Одобренные короной ремесленники трудятся в обширных стекольных мастерских, производя всё: от простых сосудов до изысканных — и дорогих — произведений искусства."
 gh_glassworks_effect_desc: "$unlocks_building_desc$Повышенное качество спонсируемых [inspirations|E] на создание #V изделий из стекла#!"
 building_gh_glassworks_01: "Стекольный завод"
 building_gh_glassworks_01_desc: "Расположенная вдали от любой особо #EMP легковоспламеняющейся#! инфраструктуры, эта грандиозная мастерская служит домом для множества опытных стеклодувов. Плоды их трудов приносят как торговлю, так и славу местному краю, служа катализатором для любых других существующих ремесел и производств."
 building_gh_glassworks_02: "Стекольное ателье"
 building_gh_glassworks_02_desc: "Рост местной торговли подтолкнул многих мастеров к более прибыльной стороне стекольного дела, и многие стали ориентироваться на далеких, богатых покровителей, жаждущих роскоши, выходящей за рамки простой пользы. Эти новые запросы вызвали острую конкуренцию среди ремесленников, что привело к многочисленным усовершенствованиям и открытиям."
 building_gh_glassworks_03: "Стекольная мануфактура"
 building_gh_glassworks_03_desc: "Если бы кто-то спросил, откуда берется мировое стекло, не было бы ошибкой сказать, что большая его часть создается здесь. Огромные множества людей трудятся в этих прославленных сводчатых залах, а стоящие во главе потомственные мастера приравниваются к [magi|E]."

 building_type_dark_obelisk_01: "Темный обелиск"
 building_type_dark_obelisk_01_desc: "Черный обелиск, пульсирующий магией [aspect_dark|E] [magic|E] в знак почитания Провальной Ямы и для снискания благосклонности гнездящихся в ней богов."

 building_dark_obelisk_01: "Темный обелиск"
 building_dark_obelisk_01_desc: "Простой обелиск, наделенный благосклонностью богов Бездны."
 building_dark_obelisk_01_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +10#!\n"

 building_dark_obelisk_02: "Резной обелиск"
 building_dark_obelisk_02_desc: "Иссиня-черный камень покрыт рунами, чтобы лучше проводить окружающие его темные энергии."
 building_dark_obelisk_02_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +20#!\n"

 building_dark_obelisk_03: "Внушительный обелиск"
 building_dark_obelisk_03_desc: "Вершина обелиска надстроена и возвышается над всеми строениями в округе."
 building_dark_obelisk_03_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +30#!\n"

 building_dark_obelisk_04: "Шипастый обелиск"
 building_dark_obelisk_04_desc: "Ряд зазубренных обсидиановых шипов вырос вокруг основания обелиска, угрожая покалечить каждого, кто подойдет слишком близко."
 building_dark_obelisk_04_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +40#!\n"

 building_dark_obelisk_05: "Зловещий обелиск"
 building_dark_obelisk_05_desc: "От черного камня исходит шепот, а багровое небо темнеет по мере приближения к нему."
 building_dark_obelisk_05_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +50#!\n"

 building_dark_obelisk_06: "Искаженный обелиск"
 building_dark_obelisk_06_desc: "Обелиск обрел собственный разум: он растет, чувствует и жаждет."
 building_dark_obelisk_06_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +60#!\n"

 building_dark_obelisk_07: "Обелиск Небытия"
 building_dark_obelisk_07_desc: "Он сделан не из камня и не из чего-либо, существующего в этом мире. Он — ничто."
 building_dark_obelisk_07_effect_desc: "[extended_magic_baseline|E]:@magic_icon!#positive_value; +70#!\n"

 building_dark_obelisk_08: "Ничто"
 building_dark_obelisk_08_desc: "Ничто.\n\n#help; Полное улучшение принесет его в жертву богам Бездны, даровав вам чрезвычайно мощный отряд монстров [men_at_arms|E] и огромное количество [Concept('piety','благосклонности')|E], но уничтожит здание в процессе."

 building_type_cultpit_01: "Культовая яма"
 building_type_cultpit_01_desc: "Глубокая яма, призванная подражать самой Провальной Яме. За ней ухаживают рабы, и из ее глубин часто поднимаются искаженные твари, дарующие благословения верным последователям."
 building_cultpit_01: "Культовая яма"
 building_cultpit_01_desc: "Глубокая яма, призванная подражать самой Провальной Яме. За ней ухаживают рабы, и из ее глубин часто поднимаются искаженные твари, дарующие благословения верным последователям."
 
 building_type_abnegation_hall_01: "Чертог самоотречения"
 building_type_abnegation_hall_01_desc: "Место сбора преданных культистов, где они падают ниц перед богами бездны."
 building_abnegation_hall_01: "Круг самоотречения"
 building_abnegation_hall_01_desc: "Особое место, выложенное красными камнями, где культисты собираются для поклонения своим темным богам."
 building_abnegation_hall_02: "Темные святилища"
 building_abnegation_hall_02_desc: "Несколько святилищ окаймляют Круг; на них изображены гротескные лики богов бездны, окруженные кровавыми жертвоприношениями."
 building_abnegation_hall_03: "Бассейны Бездны"
 building_abnegation_hall_03_desc: "Круг был расширен, и от его края спиралью расходятся ручьи темной жидкости. Вереницы культистов бредут сквозь эту топь в ходе ритуальной церемонии."
 building_abnegation_hall_04: "Чертог самоотречения"
 building_abnegation_hall_04_desc: "Чертог самоотречения возведен из маслянистого черного камня и возвышается над Кругом. У него нет входа — культисты поклоняются снаружи обитающей внутри сущности."
 building_abnegation_hall_05: "Теневые каирны"
 building_abnegation_hall_05_desc: "В Чертоге теперь обитают призрачные фигуры, выходящие из песков — посланники Богов Бездны. В их честь были воздвигнуты десятки каирнов."
 building_abnegation_hall_06: "Подземная камера"
 building_abnegation_hall_06_desc: "В красном песчанике под Чертогом высечена огромная камера. Сотни культистов на поверхности и под землей синхронно падают ниц."
 building_abnegation_hall_07: "Трещины в Бездну"
 building_abnegation_hall_07_desc: "Было принесено достаточно жертв, чтобы в стенах сооружения образовались трещины, хотя они еще недостаточно велики, чтобы пролезть внутрь. Культисты дерутся за право стать первыми, кто войдет туда."
 building_abnegation_hall_08: "Абсолютное самоотречение"
 building_abnegation_hall_08_desc: "Изнутри доносится рокот великого ужаса.\n\n#help; Полное улучшение принесет его в жертву Богам Бездны, даровав вам чрезвычайно мощный отряд монстров [men_at_arms|E] и огромное количество [Concept('piety','благосклонности')|E], но уничтожит здание в процессе."

 building_type_aaimperon_plantations_01: "Плантации ааимперона"
 building_type_aaimperon_plantations_01_desc: "В этих садах растет [Glossary('Ааймперон','GH_AAIMPERON_GLOSS')] — знаменитый кровавый арбуз [aversaria|E], чей вкус и сладость завоевали восхищение и зависть всех жителей от [amsar|E] до Катун-Кая."
 building_aaimperon_plantations_01: "Сады ааимперона"
 building_aaimperon_plantations_01_desc: "Крупные участки местных сельскохозяйственных угодий отведены исключительно под выращивание прибыльного [Glossary('ааймперона','GH_AAIMPERON_GLOSS')] в ущерб всем остальным культурам, и фермеры более чем рады этому."
 building_aaimperon_plantations_02: "Арендные огороды"
 building_aaimperon_plantations_02_desc: "Небольшие наделы земли сдаются в аренду местным арендаторам и батракам, чтобы они могли заложить собственные фруктовые садики. Раздельные участки рассредотачивают посадки, делая всю плантацию менее уязвимой к неурожаю или болезням."
 building_aaimperon_plantations_03: "Чередующиеся ряды"
 building_aaimperon_plantations_03_desc: "Лозы [Glossary('ааймперона','GH_AAIMPERON_GLOSS')] перемежаются рядами других товарных культур для повышения урожайности и подавления роста сорняков."
 building_aaimperon_plantations_04: "Пасеки"
 building_aaimperon_plantations_04_desc: "Рядом с цветущими лозами размещают ульи, что позволяет пчелам эффективно опылять растения — и вдобавок давать вкусный мед."
 building_aaimperon_plantations_05: "Фасовочные навесы"
 building_aaimperon_plantations_05_desc: "Собранные плоды сортируются по размеру, цвету и форме, а затем хранятся в прохладе для сохранения свежести перед употреблением, продажей или транспортировкой."
 building_aaimperon_plantations_06: "Капельное орошение"
 building_aaimperon_plantations_06_desc: "Неглазурованные глиняные горшки, наполненные водой, закапывают под растениями; они медленно просачивают влагу в окружающую почву, защищая лозы от засыхания даже в самые засушливые сезоны."
 building_aaimperon_plantations_07: "Объединенные плантации"
 building_aaimperon_plantations_07_desc: "Несколько крупных отдельных плантаций объединены под единым централизованным управлением, что позволяет комбинировать лучшие методы работы и извлекать выгоду из масштаба производства."
 building_aaimperon_plantations_08: "Теплицы"
 building_aaimperon_plantations_08_desc: "Обширные — #EMP и дорогие#! — теплицы возводятся на самых плодородных почвах для защиты растений от непогоды и обеспечения обильного круглогодичного урожая."

