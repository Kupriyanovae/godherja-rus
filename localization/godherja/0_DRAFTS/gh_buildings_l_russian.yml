 building_type_01_great_guerlogs_bowl: "Великая чаша Герлога"
 building_type_01_great_guerlogs_bowl_desc: "Названа в честь великого вождя круплегов древности. Поговаривали, что Герлог Великий происходил из давным-давно затерянной расы гигантов и был высок даже по их меркам. Вместо обуви он носил холмы, а на рубаху сшивал цельные шкуры мамонтов, превратив огромные подземные пустоты под горой в свои покои, пиршественный зал и сокровищницу. Говорят, что в прежние времена это озеро служило ему кубком на многих грандиозных пирах.\n\nВ наши дни это озеро является своего рода полумифическим чудом [aeras|E]. Находись оно хоть немного ближе к цивилизации, оно, несомненно, стало бы раем для богачей и объектом глубокого любопытства магем. Здесь некое древнее и непостижимое чародейство сдерживает суровые условия, характерные для высокогорий с разряженным воздухом. Более того, воздух здесь не только теплый, но и влажный, благодаря чему температура больше напоминает гораздо более приятную версию джунглей Восточного Саррадона. Считается, что скопление мегалитических колонн и гладких, лишенных рельефа обсидиановых пирамид, украшающих северную оконечность озера, может служить тайной инфраструктурой, поддерживающей этот гостеприимный климат, но никто еще не сумел постичь принцип их работы."
 building_01_great_guerlogs_bowl: "Великая чаша Герлога"
 building_01_great_guerlogs_bowl_desc: "$building_type_01_great_guerlogs_bowl_desc$"

 building_workshop_district_01: "Малые мастерские"
 building_workshop_district_01_desc: "Работающие на дому ремесленники-одиночки составляют основу промышленного производства этого города."
 building_workshop_district_02: "Производственные комплексы"
 building_workshop_district_02_desc: "Объединяясь в одних и тех же районах и кварталах, ремесленники этого города смогли создать симбиотические общины, что позволило значительно увеличить объемы выпускаемой продукции."
 building_workshop_district_03: "Мануфактурные центры"
 building_workshop_district_03_desc: "Этот город стал местом слияния множества ремесленных артелей в крупные мануфактуры, производящие огромные партии товаров, востребованных по всему миру."
 building_workshop_district_04: "Промышленный гигант"
 building_workshop_district_04_desc: "Огромные фабрики этого города дают работу оравам рабочих и ремесленников, выпуская товары в количествах, способных быть поглощенными только целым мегаполисом."

 building_type_dahangon_terraces_01: "Террасы"
 building_type_dahangon_terraces_01_desc: "Холмы этой провинции были размечены террасами, что снижает эрозию и предоставляет большую площадь земли для орошения."
 building_dahangon_terraces_01: "Простые террасы"
 building_dahangon_terraces_01_desc: "Фермеры соорудили на склонах холмов террасы для различных культур, обеспечивая стабильный источник пищи, несмотря на ограниченную площадь земли."
 building_dahangon_terraces_02: "Старинные сорта"
 building_dahangon_terraces_02_desc: "На этих полях выращиваются традиционные, проверенные временем культуры, что повышает качество и урожайность продукции."
 building_dahangon_terraces_03: "Каменные перегородки"
 building_dahangon_terraces_03_desc: "Глиняные подпорные стены террас были заменены каменными, что обеспечивает устойчивость конструкции и предотвращает обвалы."
 building_dahangon_terraces_04: "Улучшенное орошение"
 building_dahangon_terraces_04_desc: "Замысловатая система каналов и канав служит для эффективного распределения воды по всей террасе."
 building_dahangon_terraces_05: "Лесопосадки"
 building_dahangon_terraces_05_desc: "Около вершины холма поддерживается вторичный лес, способствующий сбору воды и предоставляющий дополнительные продовольственные и сырьевые ресурсы."
 building_dahangon_terraces_06: "Расширенные лесопосадки"
 building_dahangon_terraces_06_desc: "Твердые породы деревьев привозятся из различных лесов со всего [aeras|E] и пересаживаются в местную рощу, обеспечивая ценный источник дров и древесины."
 building_dahangon_terraces_07: "Висячие сады"
 building_dahangon_terraces_07_desc: "Фруктовые деревья выращиваются как для получения дополнительных плодов, так и для украшения теперь уже живописных террас."
 building_dahangon_terraces_08: "Гидротехника"
 building_dahangon_terraces_08_desc: "Террасы этой провинции превратились в шедевр гидротехники, отличающийся сложными системами орошения и земляных работ, превративший скромные прежде холмы в пейзажи захватывающей красоты."

