 gh_wih_corn_cultivation_modifier: "Kashiryan Corn Cultivation"
 gh_wih_corn_cultivation_modifier_desc: "Farmers here have adopted the high-yield grain techniques brought by Kashiryan and Aironoian traders."

 gh_wih_islander_settlers_county_modifier: "Opakhasian Settlers"
 gh_wih_islander_settlers_county_modifier_desc: "A community of Opakhasian settlers has established itself here, bringing maritime skills and mercantile connections."

 gh_wih_sophocene_ho_protected_modifier: "Sophocene Road — Holy Order Patrol"
 gh_wih_sophocene_ho_protected_modifier_desc: "A holy order patrols the pilgrimage routes toward Sophocene, providing safety for merchants and pilgrims alike."

 gh_wih_sophocene_protected_modifier: "Sophocene Road — Protected"
 gh_wih_sophocene_protected_modifier_desc: "The pilgrimage roads toward Sophocene have been secured by hired forces. Trade and travel flow more freely."

 # --- gh_wih_flavor.9003 — Amsari Herbs ---
 gh_wih_flavor.9003.t: "The Amsari Herb"
 gh_wih_flavor.9003.desc: "My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('superstitious_consort'))] [superstitious_consort.GetFirstName] has the habit of burning a rare Amsari herb to ward off the Evil Eye. But now [superstitious_consort.GetSheHe] claims that my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cruel_consort'))] [cruel_consort.GetFirstName] has stolen [superstitious_consort.GetHerHis] supply. [cruel_consort.GetFirstNameNoTooltip], of course, denies everything. But [superstitious_consort.GetFirstNameNoTooltip] remains completely focused on acquiring more.\n\n\"Please, [ROOT.Char.Custom('FormOfAddressForLiege')]\", [superstitious_consort.GetSheHe] begs, \"A wandering Magi told me the finest herbs in the world grow only in the high passes of [espad_mountain_province.GetName], in the Amsari Mountains. You must send for them.\""
 gh_wih_flavor.9003.a: "Trust in your faith — not in herbs and superstition."
 gh_wih_flavor.9003.b: "I will send the best scouts gold can buy."
 gh_wih_flavor.9003.c: "I will send my [quest_chaplain.GetCouncilTitle] [quest_chaplain.GetFirstName] to fetch them."

 # --- gh_wih_flavor.9004 — The Frontier Beckons ---
 gh_wih_flavor.9004.desc: "Some who were raised on tales of the [war_in_heaven|E] hear its echo even in times of peace — a restlessness that the comforts of court cannot quite cure. For good or ill, my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp3_child_to_leave'))] [fp3_child_to_leave.GetFirstName] has begun to feel this pull.\n\n\"[parent.GetMotherFather|U], you must let me go. I want to test my blade and my mind on the frontier — travel with the caravans, learn the desert roads, see the places that only soldiers and wanderers know.\"\n\nBut [worried_relation.GetFirstName] loves [fp3_child_to_leave.GetFirstNameNoTooltip] dearly, and is begging me to refuse [fp3_child_to_leave.GetHerHis] request."

 # --- gh_wih_flavor.9010 — HoF Demands Holy War ---
 gh_wih_flavor.9010.desc_wardenite: "The [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] divides the world simply: those within [righteous_caliph.GetFaith.GetReligion.GetAdjectiveNoTooltip] authority, and those who must be brought within it. The lands beyond my eastern border concern [righteous_caliph.GetHerHim] greatly.\n\n\"It is your duty as a faithful [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] to bring the frontier under our protection\", [righteous_caliph.GetSheHe] tells me through [righteous_caliph.GetHerHis] envoy. \"Too long have we tolerated the practices of [pagan_ruler.GetTitledFirstName]. I shall send you troops from the Orders and cavalry to reinforce your campaign, so you can bring [pagan_county.GetNameNoTier] under righteous rule.\""
 gh_wih_flavor.9010.desc_other: "The [righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] sees the frontier plainly: the faithful, and those who resist. The pagan presence to my east has grown intolerable in [righteous_caliph.GetHerHis] estimation.\n\n\"It is your duty as a [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]\", [righteous_caliph.GetSheHe] tells me, \"to bring the frontier into the fold. Too long have we tolerated the idolatrous practices of [pagan_ruler.GetTitledFirstName]. I shall send Order troops and cavalry to reinforce your campaign, so you can claim [pagan_county.GetNameNoTier] in righteousness.\""

