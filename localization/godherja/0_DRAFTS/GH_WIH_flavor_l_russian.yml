l_russian:

 # --- gh_wih_flavor.8005 — Under the Painted Stone ---
 gh_wih_flavor.8005.t: "Under the Painted Stone"
 gh_wih_flavor.8005.desc_opening: "A season of war has left the cities of [sarradon|E] quieter than usual. Tonight, fire-tenders have lit the public hearths early, and somewhere down the street, a musician is playing."
 gh_wih_flavor.8005.desc_thalite: "The song is old, likely older than the [war_in_heaven|E]. It is a [ROOT.Char.GetCulture.GetName] thing, a tale of love gone strange in the desert heat, sung in a Thalite dialect."
 gh_wih_flavor.8005.desc_aversarian: "The music carries the formal cadence of old, imperial tradition: disciplined, structured, and unmistakably beautiful. An [Concept('aversaria','Aversarian')|E] song, sung far from where it was composed."
 gh_wih_flavor.8005.desc_neutral: "I do not know the tradition, but the feeling is familiar."
 gh_wih_flavor.8005.desc_middle_part: "I find myself lingering. This is not a night for councils or dispatches."
 gh_wih_flavor.8005.desc_sarradon_poetry_tradition: "In [sarradon|E], the poets say that a ruler who cannot feel music has already lost half the war. I have heard that said by [Concept('wardenism','Wardenites')|E] and [Concept('ritualism','Ritualists')|E] alike."
 gh_wih_flavor.8005.a: "This is what love is for."
 gh_wih_flavor.8005.b: "Let the feeling wash over you."
 gh_wih_flavor.8005.c: "Fund more musicians like this."
 gh_wih_flavor.8005.d: "Tear the monument down, there is no time for this."

 # --- gh_wih_flavor.8006 — Aversarian Settlers ---
 gh_wih_flavor.8006.t: "Opakhasians at the Gate"
 gh_wih_flavor.8006.desc: "A group of [scope:islander_leader.GetCulture.GetName] men and women have appeared at my gates, led by [scope:islander_leader.GetFirstName]. They are weary and travel-worn, and they ask for land and safety. According to their leader, they were taken from [Glossary('Western Opakhasia','western_opakhasia_encyclopedia_desc')] long ago and pressed into service under [scope:former_master.GetFirstNameNoTooltip] — and they have finally managed to flee."
 gh_wih_flavor.8006.flavor.b.tt: "I take [scope:islander_leader.GetFirstName] into my household, but cannot offer land to the whole group — the others must find their own way."
 gh_wih_flavor.8006.flavor.c.tt: "I cannot afford to antagonize [scope:former_master.GetFirstNameNoTooltip] over this. The islanders must leave."
 gh_wih_flavor.8006.a: "Give them land and title."
 gh_wih_flavor.8006.b: "Take their leader, but not the rest."
 gh_wih_flavor.8006.c: "Turn them away."

 # --- gh_wih_flavor.1002 — The Sarradonian Scholar ---
 gh_wih_flavor.1002.t: "A Scholar at Your Gates"
 gh_wih_flavor.1002.desc_has_physician: "Word has reached me of a learned physician residing at the court of [scope:neighboring_ruler.GetFirstNameNoTooltip]. My own court physician, [scope:scoped_physician.GetFirstName], raises an eyebrow when I mention it — there is a professional curiosity there, perhaps a little rivalry."
 gh_wih_flavor.1002.desc_no_physician: "Word has reached me of a learned physician residing at the court of [scope:neighboring_ruler.GetFirstNameNoTooltip]. My court has no physician of its own — this could remedy that."
 gh_wih_flavor.1002.b.failure: "My attempt to persuade [scope:neighboring_ruler.GetFirstNameNoTooltip] falls flat. The scholar remains where they are, and [scope:neighboring_ruler.GetFirstName] is left irritated."
 gh_wih_flavor.1002.b.success: "My eloquence carries the day. [scope:great_scholar.GetFirstName] agrees to attend my court."
 gh_wih_flavor.1002.c.failure: "My intrigue fails. [scope:neighboring_ruler.GetFirstNameNoTooltip] discovers the attempt and is furious."
 gh_wih_flavor.1002.c.success: "I extract enough of [scope:great_scholar.GetFirstName]'s methods to apply them myself."
 gh_wih_flavor.1002.a: "Pay handsomely to bring them here."
 gh_wih_flavor.1002.b: "Persuade [scope:neighboring_ruler.GetFirstName] to share."
 gh_wih_flavor.1002.c: "Steal the knowledge by subterfuge."
 gh_wih_flavor.1002.d: "Leave the matter alone."

 # --- gh_wih_flavor.1050 — The Visionary Spouse ---
 gh_wih_flavor.1050.t: "The Visions of [scope:visionary_spouse.GetFirstName]"
 gh_wih_flavor.1050.desc_wardenite: "A wardenite may call these visions a sign, the Dead God's hand moving behind dreams. But the hand has been busy lately, and [scope:visionary_spouse.GetFirstName] is clearly frightened."
 gh_wih_flavor.1050.desc_ritualist: "The ritualists speak of omens as messages from powers older than memory. [scope:visionary_spouse.GetFirstName] has woken with a dread that no comfort can quite dissolve."
 gh_wih_flavor.1050.desc_agionist: "The Agionists hold that the Purest can speak through suffering. If so, [scope:visionary_spouse.GetFirstName]'s dreams are eloquent."
 gh_wih_flavor.1050.desc_lifepath: "The Lifepaths teach acceptance of what comes. [scope:visionary_spouse.GetFirstName] is having trouble accepting this particular vision."
 gh_wih_flavor.1050.desc_other_faith: "[scope:visionary_spouse.GetFirstName] has woken trembling for the third night running. Something in the dream will not let go."
 gh_wih_flavor.1050.b.success: "My reassurance reaches [scope:visionary_spouse.GetFirstName]. The troubled look fades — somewhat."
 gh_wih_flavor.1050.b.failure: "My words helped less than I hoped. [scope:visionary_spouse.GetFirstName] remains unsettled."
 gh_wih_flavor.1050.a: "Accuse them of consorting with dark forces."
 gh_wih_flavor.1050.b: "Pray with them and offer comfort."
 gh_wih_flavor.1050.c: "Take the omen seriously and prepare."

 # --- gh_wih_flavor.2000 — The Inspector ---
 gh_wih_flavor.2000.t: "The Inspector's Conduct"
 gh_wih_flavor.2000.desc_wardenite: "A judge dispatched to oversee the markets of [scope:gh_2000_county.GetName] has gone beyond his mandate. Reports of extortion, selective enforcement, and personal enrichment have reached my steward, [scope:gh_2000_scoped_steward.GetFirstNameNoTooltip] — who has brought them to me."
 gh_wih_flavor.2000.desc_agionist: "A tax collector operating in [scope:gh_2000_county.GetName] has been helping himself to more than his sanctioned levy. My steward, [scope:gh_2000_scoped_steward.GetFirstNameNoTooltip], has had enough complaints to fill a ledger."
 gh_wih_flavor.2000.desc_generic: "A religious official operating in [scope:gh_2000_county.GetName] has apparently been treating their authority as a personal license. My steward has the evidence."

 # --- gh_wih_flavor.2008 — Misdeeds of the Councillor ---
 gh_wih_flavor.2008.t: "What [scope:gh_2008_misdeed_actor.GetFirstName] Has Done"
 gh_wih_flavor.2008.desc: "I have come into possession of certain records. My [scope:gh_2008_misdeed_actor.GetCouncilTitle], [scope:gh_2008_misdeed_actor.GetFirstNameNoTooltip], has been engaged in systematic fraud by diverting funds, falsifying accounts, and pocketing the difference. The evidence is damning, but the question remains on what to do with it."
 gh_wih_flavor.2008.b.notif: "The Councillor Teaches You Something"

 # --- gh_wih_flavor.3000 — Corn from Kashirya ---
 gh_wih_flavor.3000.t: "The Crop from Kashirya"
 gh_wih_flavor.3000.desc: "[scope:corn_propagator.GetFirstNameNoTooltip], ruler of [scope:corn_propagator.GetPrimaryTitle.GetBaseName], has established a trade connection with [Concept('kashirya','Kashirya')|E] and is importing a remarkable new grain hardy, prolific, and well-suited to the Sarradonian climate. A Vidvaookeyatran scholar from Kashirya has arrived with the latest shipment. The yields being spoken of are extraordinary. The cultivation technique is not yet known in my lands."
 gh_wih_flavor.3000.b.failure: "[scope:corn_propagator.GetFirstNameNoTooltip] takes the approach as an insult and refuses."
 gh_wih_flavor.3000.b.success: "With some diplomatic finesse, I convince [scope:corn_propagator.GetFirstNameNoTooltip] to share the cultivation technique."
 gh_wih_flavor.3000.c.failure: "My attempt to extract the knowledge is discovered. [scope:corn_propagator.GetFirstNameNoTooltip] is furious."
 gh_wih_flavor.3000.c.success: "My agents successfully extract the cultivation method. The new crop will grow in my capital's farms."
 gh_wih_flavor.3000.a: "Pay generously for the technique."
 gh_wih_flavor.3000.b: "Persuade them to share it."
 gh_wih_flavor.3000.c: "Have agents steal the method."
 gh_wih_flavor.3000.d: "Leave it alone."

 # --- gh_wih_flavor.4003 — Road to Sophocene ---
 gh_wih_flavor.4003.t: "The Roads to Sophocos"
 gh_wih_flavor.4003.desc: "The pilgrim roads toward [GetBuilding('01_sophocos').GetName] pass through my lands, and [scope:steward.GetFirstNameNoTooltip] has brought me a troubling report: bandit activity has intensified along the route. Merchants and pilgrims alike are being robbed."
 gh_wih_flavor.4003.tt: "The order will patrol the road for ten years."
 gh_wih_flavor.4003.a: "Call upon the local Agionist commandry."
 gh_wih_flavor.4003.b: "Pay for protection from your own treasury."
 gh_wih_flavor.4003.c: "The pilgrims must take their chances."

 # --- gh_wih_flavor.4008 — Folk Stories ---
 gh_wih_flavor.4008.t: "Stories by the Fire"
 gh_wih_flavor.4008.desc.intro: "On a quiet evening, an old woman settles near the common hearth and begins to tell stories. She speaks of old things; long dead heroes, forgotten judges, and fiery prophets. People gather."
 gh_wih_flavor.4008.desc.erimatos.a: "She tells a founding story: the first Erimati ships landing on a shore that was already someone else's, and the bargain struck in the dark to build a city where there had only been suspicion. What was offered. What was accepted. How two peoples spoke the other's words without quite noticing."
 gh_wih_flavor.4008.desc.erimatos.b: "She tells of the merchant who crossed the sea three times in one life, and came home each time speaking a different language, praying to a different god. He could not explain to his family why he wept at things they found ordinary. The crowd is divided on whether this is a cautionary tale."
 gh_wih_flavor.4008.desc.makryenis.a: "She tells the old Makryeni parable of the Aautokratir's Ladder: a poor youth who rose through nothing but cunning to lord it over his enemies. The crowd knows the ending already. They listen anyway, waiting to hear whether the old woman will dare ask what changed when he got to the top."
 gh_wih_flavor.4008.desc.makryenis.b: "She tells the one every local knows: the first Agionist who took beyond their authority, who levied even the prayers of the poor. The story ends with the dead outnumbering the living, and what the dead collected in return. The crowd laughs, but not entirely comfortably."
 gh_wih_flavor.4008.desc.thalite.a: "She tells a Tasurmad story, one of the Hundred Cities cycle. The tale of the city that fell first, and the bargain its rulers made to save it. The bargain worked. The city survived. But no one who heard the full terms was ever quite the same."
 gh_wih_flavor.4008.desc.thalite.b: "She tells a Saruyad story about an Akkabla, a witch of the cedar forests, who was told by Death that her time had come. The story is about everything she said in reply. The crowd is very quiet by the end."
 gh_wih_flavor.4008.desc.sarradon.a: "She tells a story that could have come from anywhere in Sarradon — a hero, a test, a choice that mattered."
 gh_wih_flavor.4008.desc.sarradon.b: "She tells one of the old foundation myths, the kind that explain why the world is the way it is, and why it probably couldn't be any other way."
 gh_wih_flavor.4008.desc.ending: "I have the evening free. What I do with the story is my own business."

 # --- gh_wih_flavor.9000 — Holy Warrior Gone Bad ---
 gh_wih_flavor.9000.t: "The Soldier Who Went Too Far"
 gh_wih_flavor.9000.desc_agionist_opening: "An Agionist soldier has taken it upon themself to interpret their mandate far more broadly than intended, leaving a trail of chaos in their wake."
 gh_wih_flavor.9000.desc_other_opening: "A self-proclaimed holy warrior has been conducting his own campaign in your territory."
 gh_wih_flavor.9000.desc: "The city of [scope:murder_barony.GetName] has been terrorized. My marshal, [scope:righteous_marshal.GetFirstNameNoTooltip], has the man in chains and is waiting for my judgment."
 gh_wih_flavor.9000.a: "Release them — they fought in your name."
 # fp3 vanilla options b and c reused

 # --- gh_wih_flavor.9009 — Wardenite Head of Faith ---
 gh_wih_flavor.9009.b: "Send them texts in the sacred tongue."
 gh_wih_flavor.9009.qurans.flavor: "The emissary's faith speaks through [language_thalite|E]. Perhaps that is where conversion should begin."

 # --- gh_wih_flavor.9014 — The Chort Teapot ---
 gh_wih_flavor.9014.t: "The Matter of the Chort"
 gh_wih_flavor.9014.desc: "[scope:opportunistic_courtier.GetFirstNameNoTooltip] has observed that I have been using the resinous herb [chort|E]. They have a proposal: they know how to be discreet. For a consideration."

 # --- gh_wih_flavor.9016 — Ancient Ruins ---
 gh_wih_flavor.9016.t: "The Old Stones of Kharadamat"
 gh_wih_flavor.9016.desc: "[scope:kharadamat_vassal.GetFirstNameNoTooltip] has come to me with a grievance: ancient stonework has been found in [scope:ruins_county.GetName], deep in the Kharadamat countryside. The inscriptions are unlike anything from living memory. [scope:kharadamat_vassal.GetFirstName] wants them destroyed. But I find myself curious."

 # --- gh_wih_flavor.9018 — Amsari Horse Trader ---
 gh_wih_flavor.9018.t: "The Buyer from the Amsari"
 gh_wih_flavor.9018.desc_merchant: "An Amsari merchant sun-weathered, calm, and clearly used to negotiating with people who would rather they never met, has come to my court. They have heard of the beauty of my horses and want to buy one.\n\nAnd I am, at present, in considerable debt."
 gh_wih_flavor.9018.desc_woman: "An Amsari lady, confident, unhurried, and possessed of the sort of quiet authority that makes bodyguards uneasy, has arrived at my court. She has heard of my horse. She wants to buy it.\n\nAnd I am, at present, in considerable debt."

 # --- gh_wih_flavor.5000 — The Undying Sword of Angels ---
 gh_wih_flavor.5000.t: "Whispers of the Undying Sword"
 gh_wih_flavor.5000.desc_opening: "[scope:gh_5000_informant.GetFirstName] has come to me with a report: among the poor, the displaced, and the commoners in the border counties, a name is being whispered. 'The Undying Sword of Angels.' No one agrees on who or what it refers to, but the fervor with which it spreads is unmistakable."
 gh_wih_flavor.5000.desc_wardenite: "Among the faithful, the name carries an undertone of both hope and worry. In desperate times, these can act as kindle for the fire that does not stay in one hearth."
 gh_wih_flavor.5000.desc_agionist: "The reports make it sound like [Concept('ritualism','Ritualist')|E] propaganda, and they may be right. But the name is resonating in the poor quarters of our settlements too, especially those who remember still the blade of Ibn Sarradon, and found no justice for it."
 gh_wih_flavor.5000.desc_other: "My advisors cannot agree on whether this is a [Concept('ritualism','Ritualist')|E] operation, a [Concept('wardenism','Wardenite')|E] folk legend, or something born entirely of collective desperation after the fall of El-Qulatha. The disagreement itself is concerning."
 gh_wih_flavor.5000.b.success: "The threads lead somewhere. I have names, a network, a point of origin. The rumor can be cut."
 gh_wih_flavor.5000.b.failure: "My agents turn up nothing useful, and in poking around they may have spread the story further. The name echoes louder now."
 gh_wih_flavor.5000.a: "Suppress it — coin and dread, in that order."
 gh_wih_flavor.5000.b: "Investigate — find who is spreading this."
 gh_wih_flavor.5000.c: "Send preachers to counter the narrative."
 gh_wih_flavor.5000.d: "Issue an official Agionist condemnation."
 gh_wih_flavor.5000.e: "Leave it alone. The poor have always told stories."

 # --- gh_wih_flavor.5001 — The Wandering Magi Archivist ---
 gh_wih_flavor.5001.t: "The Mysterious Archivist"
 gh_wih_flavor.5001.desc: "A figure has arrived at my court. Old and watchful, they carry a sealed satchel of documents they claim predates the [Concept('the_decimation_of_sarradon','Halakdun')|E], but refuse to say from where they gained such nor from what order or background they hail.\n\nSupposedly, this sealed satchel contains maps and records of this region from before the Decimation: land-rights, water sources, old alliances, and the locations of things buried deliberately. They want protection in exchange for their knowledge."
 gh_wih_flavor.5001.c.success: "My agents secure the archive before the archivist can react. They know I have it now — that cuts both ways."
 gh_wih_flavor.5001.c.failure: "The archivist is more prepared than they appeared. The satchel vanishes, and so do they."
 gh_wih_flavor.5001.a: "Pay well for the archive — and for them."
 gh_wih_flavor.5001.b: "Offer patronage. Let them stay, on your terms."
 gh_wih_flavor.5001.c: "Have your people take the records."
 gh_wih_flavor.5001.d: "Turn them away. Trouble follows archivist orders."

 # --- gh_wih_flavor.5002 — Bones of the Worldeater ---
 gh_wih_flavor.5002.t: "The Bones in the Sand"
 gh_wih_flavor.5002.desc_opening: "Scouts in [scope:gh_5002_bones_county.GetName] have sent word of unusual, crystalline, formations breaking through the desert floor. The scholars who have examined them say the same thing: these are segments of the [Concept('the_worldeater','Worldeater')|E], but they do not understand how nor why this has occurred."
 gh_wih_flavor.5002.desc_wardenite: "The scholars are already arguing. A minority says this is the Dead God pressing against his prison. That bones this old, resurfacing now, means something is weakening. The majority says it means nothing at all."
 gh_wih_flavor.5002.desc_ritualist: "Two Ritualist sects have already sent delegations. One believes the [Concept('the_worldeater','Worldeater')|E] was blessed. The other believes any contact with the bones invites a spiritual contamination. They have not yet come to blows, but they are watching my decision carefully."
 gh_wih_flavor.5002.desc_agionist: "My commandry wants to know if they can be quarried for building material. My clergy wants to know if touching them counts as heresy. Both questions are, in their own way, correct ones to ask."
 gh_wih_flavor.5002.desc_other: "No one I have asked can agree on whether this is a blessing, a warning, or simply geography. They do agree that I cannot pretend I did not find them."
 gh_wih_flavor.5002.a.magi_tt: "My magical senses detect residual energy in the bones — studying them may yield deeper understanding, at some risk."
 gh_wih_flavor.5002.a: "Commission a scholarly study."
 gh_wih_flavor.5002.b: "Sell them to foreign collectors."
 gh_wih_flavor.5002.c: "Leave them as a sacred site."
 gh_wih_flavor.5002.d: "Destroy them. Ancient relics draw trouble."

 # --- gh_wih_flavor.5003 — The Syncretic Preacher ---
 gh_wih_flavor.5003.t: "The Preacher of Both Pillars"
 gh_wih_flavor.5003.desc: "In [scope:gh_5003_preacher_county.GetName], a wandering preacher has been drawing crowds. [scope:gh_5003_preacher.GetFirstName] claims that the [Concept('wardenism','Wardenite')|E] Pillars and the [Concept('ritualism','Ritualist')|E] trials on the 1001 Steps are two descriptions of the same spiritual path — that both faiths have been fighting over half a truth, and the violence between them is itself the proof of their incompleteness. The crowd is fascinated. Both the local wardenite and ritualist clergy are incensed. The reports crossing my desk this morning are uniformly alarmed."
 gh_wih_flavor.5003.desc_agionist: "In [scope:gh_5003_preacher_county.GetName], a wandering preacher has been drawing crowds. [scope:gh_5003_preacher.GetFirstName] is preaching that the [Concept('wardenism','Wardenite')|E] Pillars and the [Concept('ritualism','Ritualist')|E] trials on the 1001 Steps are two halves of one truth, and that the natives have been at each other's throats over a single body of scripture split down the middle. The crowd is listening. My chaplain's reports emphasize the word 'reconciliation.' That word is doing a great deal of work here, and none of it is in [Concept('agionism','Agionist')|E] interests."
 gh_wih_flavor.5003.b.success: "[scope:gh_5003_chaplain.GetFirstName] dismantles the argument in public, calmly and thoroughly. The crowd goes home unsatisfied but without a prophet to follow."
 gh_wih_flavor.5003.b.failure: "The preacher handles [scope:gh_5003_chaplain.GetFirstName]'s arguments better than expected. The crowd is now larger."
 gh_wih_flavor.5003.a: "Arrest them — this ends now."
 gh_wih_flavor.5003.b: "Send [scope:gh_5003_chaplain.GetFirstName] to debate them publicly."
 gh_wih_flavor.5003.c: "Invite them to court. A curiosity is better supervised than loose."
 gh_wih_flavor.5003.d: "Leave them be. The people will decide."

 # --- gh_wih_flavor.5004 — The Tributary Ghost ---
 gh_wih_flavor.5004.t: "The Old Seal"
 gh_wih_flavor.5004.desc: "A delegation has arrived from a minor clan in the interior — one of the small communities that has survived the [war_in_heaven|E] by staying small and staying quiet. They carry a seal of tribute from an arrangement made before the [saints_war|E], with a suzerain who no longer exists in a polity that was absorbed into mine. The seal is genuine. The arrangement is technically valid. The gold involved is modest, but the political precedent of recognizing it — or of not recognizing it — is not."
 gh_wih_flavor.5004.b.success: "The renegotiation goes well. The new terms are more favorable to me, and the delegation accepts them without visible resentment."
 gh_wih_flavor.5004.b.failure: "The renegotiation breaks down. The delegation leaves with grievances they did not arrive with."
 gh_wih_flavor.5004.a: "Honor the old tribute. Let the arrangement stand."
 gh_wih_flavor.5004.b: "Renegotiate the terms."
 gh_wih_flavor.5004.c: "Repudiate the arrangement entirely."
 gh_wih_flavor.5004.d: "Forward the matter to your liege."

 # --- gh_travel_event.9003 — El-Qulatha (great city) ---
 gh_travel_event.9003.t: "El-Qulatha"
 gh_travel_event.9003.desc: "El-Qulatha rises around me: the [GetBuilding('01_greattempleofelqulatha').GetName] visible from the city's edge. This is the seat of the [Concept('mamuramat','Mamur')|E], the heart of [Concept('wardenism','Wardenism')|E]'s central authority, and one of the greatest cities of the world. I have time. How do I spend it?"
 gh_travel_event.9003.a: "Pray at the Great Temple."
 gh_travel_event.9003.b: "Study at the Medicinal University."
 gh_travel_event.9003.c: "Walk the city and take its measure."
 gh_travel_event.9003.d: "Seek audience with the High Court."

 # --- gh_travel_event.9004 — El-Qulatha (ruins) ---
 gh_travel_event.9004.t: "What Remains of El-Qulatha"
 gh_travel_event.9004.desc: "The smoke has long since cleared, but the smell has not. Fire and halved geometry both unmade this city, splitting stone and cleaving bodies alike. The [GetBuilding('01_greattempleofelqulatha').GetName] is rubble, the university towers are open to the sky, and the markets are little but ash. This was the heart of [Concept('wardenism','Wardenism')|E]'s authority. It no longer resembles a city, but a warning."
 gh_travel_event.9004.b.success: "Among the rubble, there are people still alive."
 gh_travel_event.9004.b.failure: "I search for hours. There is no one left."
 gh_travel_event.9004.c.wardenite_tt: "Standing in the Sterilization's aftermath, surrounded by the ruins of my faith's greatest city, the grief is profound, but so is the resolve."
 gh_travel_event.9004.d.danger_tt: "The magical residue here is dense and unstable. Studying it carries risk of exposure sickness."
 gh_travel_event.9004.a: "Loot the ruins."
 gh_travel_event.9004.b: "Search for survivors."
 gh_travel_event.9004.c: "Stand in silence. Bear witness."
 gh_travel_event.9004.d: "Study the magical scarring."

 # --- New modifier names ---
 gh_wih_sword_rumor_suppressed: "Rumors Suppressed"
 gh_wih_sword_rumor_suppressed_desc: "The rumors of the Undying Sword have been actively quashed, but the suppression has left local opinion bruised."
 gh_wih_sword_rumor_suppressed_county: "Suppressed Rumors"
 gh_wih_sword_rumor_suppressed_county_desc: "Enforcement has quieted the Undying Sword's name, but not the underlying grievances."
 gh_wih_sword_rumor_spreading_county: "Spreading Rumors"
 gh_wih_sword_rumor_spreading_county_desc: "The name of the Undying Sword spreads unchecked among the poor, eroding loyalty and levy willingness."
 gh_wih_sword_rumor_countered_county: "Countered Narrative"
 gh_wih_sword_rumor_countered_county_desc: "Preachers have worked to undercut the Undying Sword's story. The message has taken hold, for now."

 gh_travel_9003_temple_blessing: "Blessed at El-Qulatha"
 gh_travel_9003_temple_blessing_desc: "I prayed at the Great Temple of El-Qulatha and left with something I cannot quite name."
 gh_travel_9003_medicinal_knowledge: "Medicinal Knowledge of El-Qulatha"
 gh_travel_9003_medicinal_knowledge_desc: "The Medicinal University's methods have improved my understanding of the body's management of illness."

 gh_wih_worldeater_studied_county: "Worldeater Site — Under Study"
 gh_wih_worldeater_studied_county_desc: "Scholars have established a study encampment near the Worldeater's bones. Their work draws trade and curiosity alike."
 gh_wih_worldeater_bones_site_county: "Worldeater Sacred Site"
 gh_wih_worldeater_bones_site_county_desc: "The Worldeater's bones have been left as a site of religious significance. Pilgrims and scholars arrive, bringing coin with them."
 gh_wih_worldeater_destroyed_county: "Worldeater Bones Cleared"
 gh_wih_worldeater_destroyed_county_desc: "The bones were destroyed on orders. The scholarly community is aggrieved, but the locals feel safer."

 gh_wih_syncretic_preaching_county: "Syncretic Preaching"
 gh_wih_syncretic_preaching_county_desc: "A preacher blending Wardenite and Ritualist theology is drawing crowds. Both official faiths are furious; the commons are fascinated."

 gh_wih_tributary_honored_county: "Honored Tributary Arrangement"
 gh_wih_tributary_honored_county_desc: "An old pre-Saints War tributary arrangement has been honored. The minor clans of the interior have taken note."
 gh_wih_tributary_repudiated_county: "Repudiated Tribute"
 gh_wih_tributary_repudiated_county_desc: "The old tributary arrangement was dismissed. Word has spread among the interior communities that your authority is less interested in legitimacy than convenience."

