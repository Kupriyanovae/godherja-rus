l_russian:
 gh_colonization_events.0001.t:90 "Колонизация: мир и процветание"
 gh_colonization_events.0001.desc:90 "Последние донесения из [colony.GetNameNoTier] свидетельствуют, что колония процветает как никогда прежде: каждый день в провинцию прибывают десятки полных энтузиазма поселенцев в поисках богатства и удачи.\n\nЕсли всё и дальше будет развиваться так же, вскоре этот край станет полноценной частью моей державы."
 gh_colonization_events.0001.a:90 "Пусть наслаждаются плодами своих трудов."
 gh_colonization_events.0001.b:90 "Пусть начинают платить налоги досрочно."
 gh_colonization_events.0001.c:90 "Благодаря хорошей инфраструктуре [colony.GetNameNoTierNoTooltip] будет процветать ещё долгие годы."
 gh_colonization_events.0001.d:90 "Их налоги #EMP удвоятся#!."
 gh_colonization_events.0001.d.tt:90 "[Concept('colonization_progress','Прогресс колонизации')|E] в [colony.GetName] снизится на #X 20#!"

 gh_colonization_events.0002.t:90 "Колонизация: нашествие разбойников"
 gh_colonization_events.0002.desc:90 "В последнее время магистраты, управляющие моей колонией в [colony.GetNameNoTier], присылают всё более тревожные донесения о крупной шайке разбойников, набирающей силу в провинции. Вербуя и недовольных поселенцев, и бродяг, ищущих лёгкой наживы, они нападают на торговые караваны и грабят пограничные поселения, разоряя край и сея хаос среди местных жителей.\n\nЕсли их число продолжит расти такими темпами, вскоре эта волна бандитизма перекинется на соседние земли и подорвёт мою власть."
 gh_colonization_events.0002.a:90 "Им придётся разбираться с этим самим."
 gh_colonization_events.0002.a.tt:90 "Уровень [Concept('control','контроля')|E] во всех [Concept('counties','графствах')|E] вашей [Concept('realm','державы')|E], граничащих с колонией [colony.GetName], изменится на #X -20#!"
 gh_colonization_events.0002.b:90 "Удвоить число патрулей и выставить охрану на дорогах."
 gh_colonization_events.0002.c:90 "Отправить карательный отряд на поиски разбойников."
 gh_colonization_events.0002.d:90 "[court_adventurer.GetFirstName] с этим разберётся."
 gh_colonization_events.0002.d.tt:90 "Ваш [GetCourtPositionType('court_adventurer_court_position').GetName()] без труда разгоняет разбойников"

 gh_colonization_events.0003.t:90 "Колонизация: нехватка продовольствия"
 gh_colonization_events.0003.desc:90 "Неурожаи, истощение запасов дичи и задержки поставок привели к нехватке продовольствия в колонии [colony.GetNameNoTier]. Оставшихся припасов едва хватит, чтобы местные жители продержались ещё неделю-другую.\n\nПеред лицом надвигающегося кризиса представители поселенцев обратились ко мне с отчаянной просьбой о помощи. Они предупреждают: если ничего не предпринять, провинцию ждут массовый голод и беспорядки."
 gh_colonization_events.0003.a:90 "Тут каждый сам за себя."
 gh_colonization_events.0003.a.tt:90 "[Concept('colonization_progress','Прогресс колонизации')|E] снизится на #X 30#!"
 gh_colonization_events.0003.b:90 "Отправить им достаточно еды, чтобы пережить год."

 gh_colonization_events.0004.t:90 "Колонизация: некомпетентный администратор"
 gh_colonization_events.0004.desc:90 "Передо мной в цепях предстаёт [idiot.GetWomanMan]. [jailor.Custom2('MyCharacterIntroduction', ROOT.Char)] сильным толчком валит этого человека на пол. К моему немалому удивлению, я узнаю, что этот человек входит в число главных администраторов моей колонии в [colony.GetNameNoTier] и обвиняется в деяниях, которые можно объяснить лишь преступной халатностью или полным безумием.\n\nКак утверждают, [idiot.GetSheHe] едва ли не в одиночку разоряет всю общину: растрачивает припасы, мешает важнейшим работам ради проведения не менее дюжины собраний в день и взимает непомерные налоги, чтобы оплатить строительство «губернаторского особняка».\n\nЕсли хотя бы половина этого — правда, сам факт, что [idiot.GetSheHe] занимает [idiot.GetHerHis] должность, остаётся полной загадкой."
 gh_colonization_events.0004.a:90 "С глаз моих долой."
 gh_colonization_events.0004.a.tt:90 "[idiot.GetFirstName]: изгнание из державы без права на возвращение"
 gh_colonization_events.0004.b:90 "Бросить в темницу!"
 gh_colonization_events.0004.c:90 "[jailor.GetFirstNameNoTooltip], казните это ничтожество."

 gh_colonization_events.0005.t:90 "Колонизация: нашествие монстров"
 gh_colonization_events.0005.desc:90 "Ко двору является посланник из [colony.GetNameNoTier] с ужасными вестями: колонию заполонила орда монстров! Появление поселенцев привело зверей в бешенство, и теперь они бесчинствуют по всей округе, разоряя хутора и уничтожая деревни. Связь со многими поселениями уже потеряна, а передвигаться можно лишь большими вооружёнными группами — если вообще можно.\n\nЧисло жертв растёт с каждым днём, и, если ничего не предпринять, колония может быть полностью уничтожена."
 gh_colonization_events.0005.a:90 "Я ничего не могу с этим поделать."
 gh_colonization_events.0005.a.tt:90 "[Concept('colonization_progress','Прогресс колонизации')|E] снизится на #X 15#!"
 gh_colonization_events.0005.b:90 "Постоянной награды за головы монстров должно хватить."
 gh_colonization_events.0005.c:90 "Моя свита с этим разберётся."
 gh_colonization_events.0005.d:90 "[court_adventurer.GetFirstName] с этим разберётся."
 gh_colonization_events.0005.d.tt:90 "Ваш [GetCourtPositionType('court_adventurer_court_position').GetName()] без труда расправляется с монстрами"

 gh_colonization_events.0006.t:90 "Колонизация: золотая жила!"
 gh_colonization_events.0006.desc:90 "Какой удачный день!\n\nЗемлемеры в [colony.GetNameNoTier] обнаружили огромную золотую жилу и уже начали добычу, чтобы финансировать развитие колонии и, что ещё важнее, заранее выплатить мне дань. Весть о находке уже разнеслась повсюду, и теперь каждую неделю в провинцию прибывают десятки новых поселенцев, надеющихся улучшить свою жизнь."
 gh_colonization_events.0006.a:90 "Отличные новости!"
 gh_colonization_events.0006.b:90 "Часть этого золота я вложу обратно в колонию."

 gh_colonization_events.0007.t:90 "Колонизация: переселенцы из [migrant_origin.GetNameNoTierNoTooltip]"
 gh_colonization_events.0007.desc:90 "Мне сообщают, что в мою колонию в [colony.GetNameNoTier] прибывает множество новых поселенцев: [migrant_origin.GetProvince.GetCounty.GetCulture.GetName] покидают [migrant_origin.GetName], поверив обещаниям светлого будущего вдали от родины.\n\nХотя это будущее, признаться, может оказаться не таким светлым, как они думают, я не сомневаюсь, что их труд можно направить на благо державы."
 gh_colonization_events.0007.a:90 "Полагаю, ничего плохого в этом нет."
 gh_colonization_events.0007.b:90 "Больше людей — больше налогов."
 gh_colonization_events.0007.b.tt:90 "[Concept('colonization_progress','Прогресс колонизации')|E] в [colony.GetName] увеличится на #P 10#!"
 gh_colonization_events.0007.c:90 "Пусть заселяют [colony.GetNameNoTierNoTooltip] вместо меня."
 gh_colonization_events.0007.c.tt:90 "[Concept('colonization_progress','Прогресс колонизации')|E] увеличится на #P 30#!"

 gh_colonization_events.0008.t:90 "Колонизация: исключительный урожай"
 gh_colonization_events.0008.desc:90 "В этом году в [colony.GetNameNoTier] собрали исключительно богатый урожай, и амбары колонии забиты доверху. Поселенцам хватит продовольствия и на этот год, и на следующий.\n\nКак их правитель и благодетель, я, разумеется, имею право на долю урожая, но, если забрать слишком много сразу, можно подорвать экономику региона и вызвать недовольство его жителей."
 gh_colonization_events.0008.a:90 "Пусть оставят всё себе — мне это ни к чему."
 gh_colonization_events.0008.b:90 "Я заберу пятую часть на благо державы."
 gh_colonization_events.0008.c:90 "По праву всё это #EMP моё#!!"

 gh_colonization_events.0010.t:90 "Колонизация: безмолвные берега"
 gh_colonization_events.0010.desc:90 "Колония в [colony.GetNameNoTier] умолкла.\n\nСначала это были мелочи: разведывательный отряд пропал в глуши, в местной переписи обнаружились небольшие расхождения, какая-то семья разыскивала пропавшего ребёнка. Затем исчезло рыбацкое судно. Потом — целая деревня. А теперь уже больше месяца из поселения не приходит ни единой вести.\n\nНесколько кораблей отправились разведать колонию, но вернулись ни с чем: им не удалось увидеть ни самого форпоста, ни его жителей. Даже береговая линия теперь кажется чужой и незнакомой, словно отвесные утёсы [Concept('eripomvuno_biozone','Эрипомвуно')|E] изменили своё расположение и скрылись из виду.\n\nНикаких зацепок нет. Похоже, судьба пропавших поселенцев навсегда останется тайной."
 gh_colonization_events.0010.tt:90 "@death_icon! [dead_person.GetTitledFirstName] бесследно исчезнет"
 gh_colonization_events.0010.a:90 "Остаётся лишь молиться за их души."
 
 #############
 # MODIFIERS #
 #############
 
 colonial_boom_modifier:90 "Колониальный бум"
 colonial_boom_modifier_desc:90 "Эта колония растёт невиданными темпами\n[colonization_progress|E]: [Concept('colonization_progress','@colonization_progress_icon!')]#positive_value +30%#!"
 colonial_prosperity_modifier:90 "Колониальное процветание"
 colonial_prosperity_modifier_desc:90 "Эта колония стремительно развивается\n[colonization_progress|E]: [Concept('colonization_progress','@colonization_progress_icon!')]#positive_value +15%#!"
 infrastructure_expansion_modifier:90 "Расширение инфраструктуры"
 infrastructure_expansion_modifier_desc:90 "Сеть ухоженных дорог и постоялых дворов пересекает это графство, ускоряя поездки и торговлю"
 bandit_stronghold_modifier:90 "Оплот бандитов"
 bandit_stronghold_modifier_desc:90 "Крупная шайка разбойников обосновалась в местной глуши, сея хаос и беспорядки среди населения\n[colonization_progress|E]: [Concept('colonization_progress','@colonization_progress_icon!')]#negative_value -50%#!"
 frontier_banditry_modifier:90 "Пограничный бандитизм"
 frontier_banditry_modifier_desc:90 "Дикие земли вокруг колонии кишат людьми с дурной репутацией\n[colonization_progress|E]: [Concept('colonization_progress','@colonization_progress_icon!')]#negative_value -25%#!"
 safe_roads_modifier:90 "Безопасные дороги"
 safe_roads_modifier_desc:90 "Дороги в этой колонии исключительно безопасны, что способствует торговле и росту колонии\n[colonization_progress|E]: [Concept('colonization_progress','@colonization_progress_icon!')]#positive_value +20%#!"
 adventurer_patrols_modifier:90 "Патрули искателей приключений"
 adventurer_patrols_modifier_desc:90 "Искатели приключений патрулируют дороги в этой колонии, и ни зверь, ни бродяга не осмеливается бросить им вызов\n[colonization_progress|E]: [Concept('colonization_progress','@colonization_progress_icon!')]#positive_value +40%#!"
 acute_food_shortages_modifier:90 "Острая нехватка продовольствия"
 acute_food_shortages_modifier_desc:90 "Жителям этой колонии едва хватает продовольствия\n[colonization_progress|E]: [Concept('colonization_progress','@colonization_progress_icon!')]#negative_value -80%#!"
 colonial_mismanagement_modifier:90 "Неумелое управление колонией"
 colonial_mismanagement_modifier_desc:90 "Неумелое управление нанесло колонии ущерб, который ощущается даже после отстранения администратора от власти\n[colonization_progress|E]: [Concept('colonization_progress','@colonization_progress_icon!')]#negative_value -20%#!"
 monster_infestation_modifier:90 "Нашествие монстров"
 monster_infestation_modifier_desc:90 "Эта колония страдает от разрушительных — и постоянных — нападений монстров\n[colonization_progress|E]: [Concept('colonization_progress','@colonization_progress_icon!')]#negative_value -40%#!"
 adventurer_influx_modifier:90 "Приток авантюристов"
 adventurer_influx_modifier_desc:90 "Эта колония стала центром деятельности авантюристов, что оживило местную экономику\n[colonization_progress|E]: [Concept('colonization_progress','@colonization_progress_icon!')]#positive_value +10%#!"
 monster_exterminators_modifier:90 "Истребители монстров"
 monster_exterminators_modifier_desc:90 "Свита этого персонажа взяла на себя охоту на монстров, что увеличивает расходы на содержание свиты"
 gold_rush_modifier:90 "Золотая лихорадка"
 gold_rush_modifier_desc:90 "Эта колония переживает массовый приток новых поселенцев после обнаружения золота в провинции\n[colonization_progress|E]: [Concept('colonization_progress','@colonization_progress_icon!')]#positive_value +50%#!"
 thriving_economy_modifier:90 "Процветающая экономика"
 thriving_economy_modifier_desc:90 "Открытие золота дало мощный толчок экономике этого графства"
 migrant_influx_modifier:90 "Приток переселенцев"
 migrant_influx_modifier_desc:90 "Каждый день в колонию из соседних земель прибывают целые семьи новых поселенцев\n[colonization_progress|E]: [Concept('colonization_progress','@colonization_progress_icon!')]#positive_value +25%#!"
 food_surplus_modifier:90 "Излишки продовольствия"
 food_surplus_modifier_desc:90 "У этого персонажа огромные запасы продовольствия и других припасов"
 food_abundance_modifier:90 "Изобилие продовольствия"
 food_abundance_modifier_desc:90 "Запасов этого персонажа хватит, чтобы десять лет кормить небольшой город"
 unruly_population_modifier:90 "Непокорное население"
 unruly_population_modifier_desc:90 "Правящая верхушка несправедливо обошлась с населением этого графства, породив гнев и недоверие на поколения вперёд"