l_russian:
  gh_health.1001.t:0 "[SCOPE.Custom('EventTitleDisease')]: Проклятие золотом"
  gh_health.1001.desc:0 "Вот уже несколько дней [cursed_fool.GetFirstNameNoTooltip] слабеет на глазах. Теперь в крови, которую [cursed_fool.GetSheHe] откашливает, поблёскивают крупицы золота. Я [Select_CString(ROOT.Char.IsFemale, 'думала', 'думал')], что нам удастся избежать [Concept('fools_curse','проклятия дураков')|E], но, похоже, эта смертоносная земля не выпустит нас из своих объятий. Остаётся надеяться, что боль будет терпимой, а если нет — что смерть придёт быстро."
  gh_health.1001.a:0 "Ох, [Select_CString(ROOT.Char.IsFemale, 'какой же дурой я была', 'каким же дураком я был')]!"

  gh_health.2002.t:0 "[SCOPE.Custom('EventTitleDisease')]: Теневая болезнь"
  gh_health.2002.desc:0 "О тенях мне доводилось слышать лишь в страшных сказках, которыми нас пугали перед сном в детстве. Никто, кроме диких [Concept('magi','магов')|E], в них не верил.\n\nНо теперь я знаю, что всё иначе. Угольно-чёрная гниль, поразившая мою кожу, шершава на ощупь, словно кожа обращается в прах."
  gh_health.2002.court_physician.desc:0 "\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя', 'Мой')] [ROOT.Char.GetLadyLord], я сделаю всё возможное, чтобы помочь, но есть вещи, которые превыше сил человека...»"
  gh_health.2002.a:0 "О, [ROOT.Char.GetFaith.HealthGodName]! Спаси меня!"

  gh_health.2001.t:0 "[SCOPE.Custom('EventTitleDisease')]: К свету"
  gh_health.2001.desc:0 "То ли на меня снизошло благословение, то ли удача иссякла окончательно. Прошлой ночью мне казалось, что она станет последней, но сегодня я [Select_CString(ROOT.Char.IsFemale, 'проснулась полной сил', 'проснулся полным сил' )], а теневая болезнь отступает.\n\nЭтот недуг унёс немало жизней, но мою не заберёт."
  gh_health.2001.a:0 "Хвала [ROOT.Char.GetFaith.HealthGodName] за это чудо!"
  gh_health.2001.tt:0 "Я всё ещё могу заболеть [GetTrait('shade_stricken').GetName( GetNullCharacter )]"
