l_russian:
 gedeora.0010.title:0 "Поднимаются лютые ветры"
 gedeora.0010.desc:0 "Сегодня что-то по-другому. В воздухе висит несказанная зловещая атмосфера, и я не [Select_CString(ROOT.Char.IsFemale, 'единственная', 'единственный' ), кто заметил это] — шепотки, тихие, но полные ненависти, наполняют двор, а глаза многих моих слуг одаряют меня взглядами чистой злобы.\n\nЯ чувствую себя почти как в трансе. Истины о мире, которые я [Select_CString(ROOT.Char.IsFemale, 'пыталась', 'пытался' )] игнорировать, теперь кружатся в моем разуме и терзают меня. Приму ли я их близко к сердцу или продолжу погрязать в детской наивности?"
 gedeora.0010.desc.depravity:0 "Почти полдень, когда я это замечаю: ощущение, пульсирующее в моей груди, чистая страсть, текущая по моим венам. Весь мир меняется и, кажется, заново кристаллизуется перед моими глазами. Все эти запреты, все эти страхи быть отвергнутым, перенапрячься, зайти слишком далеко...\n\nДа ведь они бессмысленны! Полный бред, изрыгнутый осуждающими трусами, утверждающими, будто они говорят от имени [ROOT.Char.GetFaith.HighGodName]. Какое право они имели так нас заковывать! Отныне я буду проживать каждое мгновение на полную катушку, ни в чем себе не отказывая. По взглядам, которыми перешептываются мои придворные и слуги, я вижу, что они разделяют то же несказанное понимание. У меня такое чувство, что это лишь начало чего-то величественного!"
 gedeora.0010.desc.zeal:0 "Я просыпаюсь в холодном поту посреди ночи. Бледный лунный свет танцует на полу сквозь мои шторы, озаряя мои покои. Осматривая пространство вокруг, я понимаю, что каждый предмет в моей комнате теперь, кажется, несет какой-то скрытый смысл, словно они были расставлены нарочно [ROOT.Char.GetFaith.HighGodName], чтобы передать некое пророческое послание. С ясностью откровения я вижу невидимую руку божественного в своей жизни, направляющую меня, готовящую меня к этому мгновению. Я [Select_CString(ROOT.Char.IsFemale, 'была избрана', 'был избран' )] [ROOT.Char.GetFaith.HighGodName] дабы нести свое послание, мы общаемся лично!\n\nЯ скатываюсь с постели и в лихорадке бросаюсь к окну. В бледном свете [Concept('aervalr','Эрвала')|E] я вижу начинающийся во дворе переполох: придворные выбегают в исподнем и падают ниц в молитве или с пеной у рта проповедуют друг другу. Лишь немногие прячутся обратно в дом, выглядя испуганными и растерянными."
 gedeora.0010.desc.bloodlust:0 "Я даю аудиенцию, пытаясь не заснуть во время слушания какого-то спора между незначительными землевладельцами, когда это происходит. Железный запах крови внезапно наполняет воздух, и мои глаза слезятся от всепоглощающего аромата. Сердцебиение учащается — как я раньше не [Select_CString(ROOT.Char.IsFemale, 'замечала', 'замечал' )], насколько этот запах в самом деле соблазнителен? Еда и вино блекнут по сравнению с его тонким вкусом.\n\nСпор, происходящий передо мной, за считанные секунды превращается из дружеского обсуждения юридических тонкостей прав на выпас в перепалку на повышенных тонах. Один из мужчин сжимает трость обеими руками, словно намереваясь пробить латунным набалдашником череп своего оппонента. У меня текут слюнки при этой мысли, а затем я и [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам' )] начинаю приходить в ярость от его трусости. Почему он не действует? Если он слишком труслив, чтобы сделать это сам, почему бы мне не разделаться с обоими и не избавить нас всех от лишних хлопот?"
 gedeora.0010.desc.ambition:0 "Я разделяю вечернюю трапезу с несколькими придворными, когда это обрушивается на нас. Свет на мгновение ощутимо меркнет, вызывая любопытные взгляды и пару секунд паники, прежде чем все возвращается в норму. Все озадаченно переглядываются, после чего мы осторожно возобновляем трапезу.\n\nПока мы едим, мои мысли внезапно начинают стремительно нестись. Эти мужчины и женщины вокруг меня — можно ли им доверять? Будь я на их месте, это было бы идеальным временем, чтобы отравить своего сюзерена или устроить заговор, чтобы жестоко убить [ROOT.Char.GetHerHis] в укромном месте, пока [Select_CString(ROOT.Char.IsFemale, 'она ослабила', 'он ослабил' )] бдительность. А если бы я [Select_CString(ROOT.Char.IsFemale, 'поступила', 'поступил' )] так, что останавливает их? О [ROOT.Char.GetFaith.HighGodName], при мне даже нет меча! Я резко встаю, в панике выплевывая еду. Другие за столом делают то же самое, бросая панические взгляды на каждого вокруг."
 gedeora.0010.desc.apostasy:0 "[ROOT.Char.GetFaith.HighGodName] мертв.\n\nС той минуты, как я встаю с постели, я не могу избавиться от этой мысли. Каждый цвет кажется более блеклым, каждое удовольствие — более бессмысленным, каждый изъян и трещина на [Concept('aeras','Эрасе')|E] видны как никогда прежде. Как мог мир, столь фундаментально сломанный, быть сотворен чем-то хотя бы отдаленно напоминающим совершенное существо?\n\nЯ иду в храм, намереваясь вновь разжечь внутри пламя, которое когда-то проводило меня через испытания и невзгоды, но приходя туда, я едва не плачу. Он пуст, у жрецов, судя по всему, произошло аналогичное просветление. На алтаре стоит изуродованный идол [ROOT.Char.GetFaith.HighGodName], лишенный всего золота и драгоценностей, что когда-то заставляли его сиять. А под ними нет ничего, кроме истины — пышное убранство было лишь оберткой для лжи. Нас всех обманули, подкупив утешительными обещаниями и поверхностными истинами, словно детей, увлеченных сказкой."

 gedeora.0010.a:0 "[Concept('aeras','Эрас')|E] — холодное, жестокое место."
 gedeora.0010.b:0 "Нет! Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] очнуться от этого!"
 gedeora.0010.a.depravity:0 "[ROOT.Char.Custom('AttractionWomanManMultiple')|U], еда, вино — у меня будет всё!"
 gedeora.0010.b.depravity:0 "Нет, я не могу..."
 gedeora.0010.a.zeal:0 "[ROOT.Char.GetFaith.HighGodName] говорит моими устами!"
 gedeora.0010.b.zeal:0 "Что это за фантазия, что за безумие? [ROOT.Char.GetFaith.HighGodName], защити меня, это заблуждение!"
 gedeora.0010.a.bloodlust:0 "Я приказываю слугам принести мой меч: пора немного поразвлечься."
 gedeora.0010.b.bloodlust:0 "Да это же насилие! Стража, вмешайтесь и прекратите это!"
 gedeora.0010.a.ambition:0 "Я [Select_CString(ROOT.Char.IsFemale, 'была дурой', 'был дураком' )], доверяя кому-либо! Стража, соберите эскорт и выведите меня отсюда!"
 gedeora.0010.b.ambition:0 "Нет, это мои друзья, эти мысли — безумие!"
 gedeora.0010.a.good:0 "[Concept('aeras','Эрас')|E] — светлое, теплое место."
 
 gedeora.0020.title:0 "Проклятая кровь"
 gedeora.0020.desc:0 "С каждым днем, пока я расту, я нахожу этот мир все более и более разочаровывающим местом. Мои старые игрушки и друзья оглядываясь назад кажутся столь нелепыми и глупыми. Взрослые в моей жизни, их истории и мораль, которую они пытались мне привить — все это оказалось лишь ложью и мусором.\n\nИ я знаю, что обо мне думают другие. Слуги избегают меня, а другие дети говорят, что я [Select_CString(ROOT.Char.IsFemale, 'проклята', 'проклят' )]. С чего бы мне заботиться о них? День за днем они доказывают, что все они — лишь никчемный сброд."
 gedeora.0020.a:0 "...и в один прекрасный день они все пожалеют об этом!"
 gedeora.0020.b:0 "Но я не [Select_CString(ROOT.Char.IsFemale, 'проклята', 'проклят' )]!"
 
 gedeora_magic_invert:0 "Магическая инверсия"
 gedeora_struck_tt:0 "[Concept('gedeora','Гедеора')|E] обрушилась на ваше столичное графство!"
 gedeora_in_target_populace_tt:0 "Поскольку вы находитесь среди #E населения целей#!, на вас подействует дополнительный эффект!"
 gedeora_childhood_tt:0 "Это произошло из-за того, что на вас повлияла [Concept('gedeora','гедеора')|E], когда вы находились в утробе матери."