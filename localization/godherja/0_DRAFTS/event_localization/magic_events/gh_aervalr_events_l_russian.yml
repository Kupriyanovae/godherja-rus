l_russian:
  aervalr.0101.t:0 "Падающее небо"
  aervalr.0101.desc.capital_county:0 "Похоже, небольшой осколок [Concept('aervalr','Эрвала')|E] озарил небо вблизи наших земель. Мы смотрим, как бирюзовый огненный шар прочерчивает ночное небо и рассыпается ещё более ярким дождём падающих звёзд.\n\nРаспавшись в небе, этот небесный гость, вероятно, рассеял по окрестностям немало ценного лунного камня, наделённого магической силой."
  aervalr.0101.a:0 "Прекрасно."  
  aervalr.0102.t:0 "Падающее небо"
  aervalr.0102.desc.capital_county:0 "Яркий свет в ночном небе и нарастающий гул заставляют всех прервать привычные вечерние занятия. За окном открывается поистине захватывающее зрелище: довольно крупный осколок [Concept('aervalr','Эрвала')|E] падает на землю, пылая словно тысяча костров.\n\nУтром стражники, отправленные к предполагаемому месту падения, докладывают, что серьёзных разрушений почти нет — обрушилось лишь несколько крестьянских лачуг. Осколок уцелел и может оказаться весьма полезным для знатоков [Concept('magic','магии')|E]."
  aervalr.0102.a:0 "Отлично."  
  aervalr.0103.t:0 "Падающее небо"
  aervalr.0103.desc.capital_county:0 "Весёлый шум вечернего пира заглушает нарастающий грохот снаружи. Ослепительная бирюзовая вспышка ошеломляет всех, а вскоре мощный взрыв сотрясает замок. Несколько минут я не слышу ничего, кроме звона в ушах.\n\nКрупный осколок [Concept('aervalr','Эрвала')|E] упал на наши земли и, похоже, сравнял с землёй соседнюю деревню. Разрушения велики, но оставшиеся после падения ценные магические руды могут стать немалым подспорьем."
  aervalr.0103.a:0 "Могло быть и хуже..."  
  aervalr.0104.t:0 "Падающее небо"
  aervalr.0104.desc.capital_county:0 "В очаге потрескивает огонь, в коридорах слышны приглушённые разговоры ещё не уснувших слуг, а я постепенно погружаюсь в сон. Но вдруг снаружи доносится низкий гул, который становится всё громче. Видимо, слуги у моих покоев тоже его слышат: их разговоры стихают.\n\nЯ выглядываю в окно и лишь на миг успеваю осознать увиденное — огромный осколок [Concept('aervalr','Эрвала')|E] мчится к земле. Он врезается в неё, и ударная волна вырывает деревья с корнем, разверзает землю и сотрясает мою крепость до основания, едва не обрушив её."
  aervalr.0104.a:0 "Пригнитесь!"  
  aervalr.0105.t:0 "Падающее небо"
  aervalr.0105.desc.capital_county:0 "Меня будят испуганные крики. Выйдя из спальни, я вижу, как придворные и слуги в ночных рубашках мечутся туда-сюда, не замечая меня и не отвечая на вопросы. Они собираются на балконе и смотрят куда-то в небо.\n\nСтоит мне поднять глаза, как становится ясно: происходит нечто необычное. Огромный тёмный силуэт над головой заслоняет часть звёздного неба.\n\nПоняв, что это такое, я едва не падаю в обморок."
  aervalr.0105.a.capital_county:0 "Святая матерь, это же…"  
  aervalr.0106.t:0 "Падающее небо"
  aervalr.0106.desc.capital_county:0 "В очаге потрескивает огонь, в коридорах слышны приглушённые разговоры ещё не уснувших слуг, а я постепенно погружаюсь в сон. Но вдруг снаружи доносится низкий гул, который становится всё громче. Видимо, слуги у моих покоев тоже его слышат: их разговоры стихают.\n\nЯ выглядываю в окно и лишь на миг успеваю осознать увиденное — огромный осколок [Concept('aervalr','Эрвала')|E] мчится к земле. Он врезается в неё, и ударная волна вырывает деревья с корнем, разверзает землю и сотрясает мою крепость до основания, едва не обрушив её."
  aervalr.0106.a:0 "Пригнитесь!"
  
  aervalr.0110.t:0 "Падающее небо"
  aervalr.0110.desc:0 "Я, моя семья и двор бодрствуем глубокой ночью, собравшись у окон. Снаружи — зрелище, которое трудно описать: гигантский осколок [Concept('aervalr','Эрвала')|E] приближается к земле и вот-вот упадёт. К счастью, он достаточно далеко, чтобы не представлять никакой опасности — по крайней мере для нас."
  aervalr.0110.a:0 "Красиво, но смертельно."
  
  aervalr.small_shard_falls.tt:0 "Небольшой осколок #E Эрвала#! сгорает в ночном небе, его обломки рассеялись по [aervalr_shard_landing_site.GetName]!"
  aervalr.medium_shard_falls.tt:0 "Осколок #E Эрвала#! среднего размера падает на [aervalr_shard_landing_site.GetName]!"
  aervalr.large_shard_falls.tt:0 "Крупный осколок #E Эрвала#! падает на [aervalr_shard_landing_site.GetName]!"
  aervalr.huge_shard_falls.tt:0 "Огромный осколок #E Эрвала#! падает на [aervalr_shard_landing_site.GetName]!"
  aervalr.colossal_shard_falls.tt:0 "Гигантский осколок #E Эрвала#! падает на [aervalr_shard_landing_site.GetName]!"
  aervalr.colossal_shard_falls_neighbor.tt:0 "Так как мы находимся рядом с местом падения, наша провинция также понесёт значительные разрушения."
  
  aervalr.everyone_dies_county.tt:0 "Все несчастные, находившиеся в [aervalr_shard_landing_site.GetName], #negative_value погибают#!."
  aervalr.many_die_county.tt:0 "Мощная ударная волна сравняет здания с землёй, #negative_value погубив многих жителей#!."
  devastate_county.tt:0 "Навсегда превратится в необитаемую #negative_value пустошь#!."
  aervalr.duchy_damage.tt:0 "Провинции в радиусе взрыва будут серьёзно повреждены ударной волной и выбросами, многие персонажи там также погибнут."
  
  extreme_devastation:0 "Пустошь"
  extreme_devastation_desc:0 "Какое-то разрушительное бедствие, древнее или недавнее, превратило эту область в практически необитаемую пустошь, которую избегают жители окрестных земель."
  aervalr_debris_field:0 "Поле лунного камня"
  aervalr_debris_field_desc:0 "#E Магия#!:@magic_icon!#positive_value; +0.2#!\n\nЭта область усыпана обломками разбившегося осколка [Concept('aervalr','Эрвала')|E]."
