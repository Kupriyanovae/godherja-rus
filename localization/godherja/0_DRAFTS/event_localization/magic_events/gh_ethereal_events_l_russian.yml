l_russian:
  ethereal.0001.t:0 "Врата в Потустороннее"
  ethereal.0001.desc:0 "Многодневные исследования наконец подошли к концу. В десятках тайных трактатов и свитков отыскались сведения об именах и рангах бесчисленных даймонов, архонтов, эманаций и великих духов, известных [Concept('magi','магам')|E]. У меня готовы чертежи нескольких ритуальных кругов и вычислены координаты, необходимые для их правильного расположения относительно земных и небесных ориентиров. Остаётся лишь один вопрос: кого призвать?\n\nЭто существа огромного могущества и непостижимых желаний. Выбирать нужно осторожно."
  ethereal.0001.a:0 "Эринийского дьявола, для войны"
  ethereal.0001.a.tt:0 "Это могущественный и враждебный дух"
  ethereal.0001.b:0 "Эманацию Земного Порядка"
  ethereal.0001.b.tt:0 "Это слабый и нейтральный дух"
  ethereal.0001.c:0 "Архонта Первозданного Хаоса"
  ethereal.0001.c.tt:0 "Это средний по силе и склонный к сотрудничеству дух"
  ethereal.0001.d:0 "Возможно, я ещё не [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов')]"

  ethereal.0002.t:0 "Врата в Потустороннее"
  ethereal.0002.desc:0 "Первым признаком скорого появления Эринийского дьявола становится густой запах крови с металлическим оттенком, ударивший мне в нос в тот момент, когда я [Select_CString(ROOT.Char.IsFemale, 'произнесла', 'произнёс')] последний слог ритуального напева. Вторым — низкий животный рык, доносящийся неведомо откуда, сначала едва слышный, но становящийся всё громче и настойчивее. Наконец, сам дьявол появляется, вырываясь из ниоткуда в клубах кровавого тумана. Кроваво-красная тень зависает передо мной, её голос — смесь звериных рыков и нечеловеческого рёва, которые я, тем не менее, понимаю.\n\n«По какой причине ты [Select_CString(ROOT.Char.IsFemale, 'призвала', 'призвал')] меня, однодневка?»\n\nНевысказанная угроза, скрытая за этими словами, наполняет комнату. Мне нужно действовать быстро, чтобы либо подчинить этого духа, либо заключить с ним договор, прежде чем он обратится против меня."
  ethereal.0002.a:0 "«Великий дьявол, я [Select_CString(ROOT.Char.IsFemale, 'пришла', 'пришёл')] в поисках твоего совета и помощи»"
  ethereal.0002.a.tt:0 "Это вариант средней сложности, и Эринийский дьявол не будет милосерден в случае неудачи"
  ethereal.0002.b:0 "Попытаться одолеть демона и подчинить его своей воле!"
  ethereal.0002.b.tt:0 "Это рискованный вариант, и Эринийский дьявол не будет милосерден в случае неудачи"
  ethereal.0002.c:0 "Слишком опасно. Изгнать демона и покончить с этим!"
  ethereal.0002.toast:0 "Вы успешно вступили в контакт с Эринийским дьяволом"
