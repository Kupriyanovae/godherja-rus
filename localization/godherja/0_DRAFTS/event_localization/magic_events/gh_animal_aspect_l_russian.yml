l_russian:

 # Initial Event
 magic.9100.t: "Единение с дикой природой"
 magic.9100.desc: "Ритуальный круг подготовлен, фимиам горит с потусторонним ароматом, и граница между обыденным и магическим истончается. С помощью этого древнего обряда я могу настроить свой дух на дикое создание, связав фрагмент его сущности со своей собственной.\n\nЭтот процесс не лишен риска — духи, откликающиеся на подобные призывы, непредсказуемы, и мне, возможно, придется отвергнуть неподходящие связи, прежде чем найти ту, что резонирует с моей душой. Но если мне удастся достичь успеха, я навсегда сохраню в себе частицу природы этого существа."
 magic.9100.a: "Начать поиск родственного духа"
 magic.9100.b: "Сейчас не время для этого ритуала"

 # Magical Creature
 magic.9101.t: "Появляется магическое создание"
 magic.9101.desc: "Воздух мерцает эфирным светом, когда передо мной возникает создание из чистой [Concept('magic','магии')|E]. Его форма переливается и течет, словно живой звездный свет, излучая ауру магической силы, от которой по коже пробегают мурашки. Это существо существует между мирами — порождение первозданной магической сущности.\n\nНастройка на такое создание углубит мою связь с небесными силами и естественным потоком самой [Concept('magic','магии')|E]. Я получу представление о фундаментальной природе магических искусств."
 magic.9101.a: "Настроиться на это магическое создание"
 magic.9101.b: "Это не тот дух, которого я ищу"

 # Fodder Creature
 magic.9102.t: "Появляется обычное создание"
 magic.9102.desc: "Из теней выходит скромное создание — на первый взгляд ничего впечатляющего. Задающий ритм выживания падальщик, тот тип зверья, которого авантюристы сбрасывают со счетов как простую добычу. И все же в его глазах светится мудрость — хитрость неисчислимых поколений, выживших там, где пали более великие звери.\n\nЕдинение с таким созданием дарует мне его стойкость и упрямую волю к жизни вопреки всему. Порой величайшая сила заключается в простом отказе умирать."
 magic.9102.a: "Настроиться на этого скромного выжившего"
 magic.9102.b: "Я ищу нечто большее"

 # Humanoid Creature
 magic.9103.t: "Появляется гуманоидное создание"
 magic.9103.desc: "Земля дрожит, когда в поле зрения грузно ступает огромная гуманоидная фигура — тролль, огр или, возможно, кто-то еще более древний. Его мышцы перекатываются под толстой шкурой, а во взгляде таится первобытный разум. Эти создания ходили по [Concept('aeras','Эрасу')|E] еще до возвышения цивилизации, и их сила легендарна.\n\nЕдинение с таким существом дарует мне частицу его необузданной физической мощи и устрашающее присутствие, заставляющее меньших существ бежать в ужасе."
 magic.9103.a: "Настроиться на этого могучего гуманоида"
 magic.9103.b: "Грубая сила — это не то, что я ищу"

 # Intelligent Creature
 magic.9104.t: "Появляется разумное создание"
 magic.9104.desc: "Явившееся мне создание смотрит на меня глазами, таящими глубины древней мудрости. Будь то сфинкс, мудрый змей или нечто еще более странное, это существо копило знания на протяжении веков существования. Оно говорит не словами, но мыслями, касающимися моего разума словно шелк.\n\nЕдинение с таким созданием обострит мой интеллект и дарует мне понимание тайных механизмов этого мира. Долго погребенные секреты станут яснее для моего обостренного восприятия."
 magic.9104.a: "Настроиться на это мудрое существо"
 magic.9104.b: "Я ищу иную мудрость"

 # Inorganic Creature
 magic.9105.t: "Появляется неорганическое создание"
 magic.9105.desc: "Камень скрежещет о камень, когда передо мной обретает форму создание из живой породы. Будь то элементаль, голем или первозданный дух самой земли, это существо не знает ничего о плоти и крови. Оно вечно, неизменно и терпеливо свыше смертного понимания.\n\nЕдинение с таким созданием дарует мне частицу его невероятной стойкости. Мое тело станет более крепким и способным лучше противостоять невзгодам битвы и времени."
 magic.9105.a: "Настроиться на этот стойкий дух"
 magic.9105.b: "Я [Select_CString(ROOT.Char.IsFemale, 'не готова', 'не готов' )] стать камнем"

 # Enormous Creature
 magic.9106.t: "Появляется исполинское создание"
 magic.9106.desc: "Сама земля содрогается, когда приближается нечто исполинское. Титан, левиафан, зверь столь огромных пропорций, что разум с трудом постигает его масштабы. Там, где оно ступает, сам мир, кажется, склоняется, признавая его присутствие.\n\nЕдинение с таким созданием дарует мне толику его подавляющего величия. Армии будут трепетать передо мной, а мои шаги обретут тяжесть древней силы."
 magic.9106.a: "Настроиться на это колоссальное существо"
 magic.9106.b: "Такая сила была бы слишком заметной"

 # Monstrous Creature
 magic.9107.t: "Появляется чудовищное создание"
 magic.9107.desc: "То, что выходит из теней, бросает вызов законам природы — химерический ужас, сотворенный из сросшейся плоти и немыслимой анатомии. Множество голов, слишком много конечностей, черты дюжины разных зверей, слившиеся в единое кошмарное целое. Оно прекрасно в своем уродстве и идеально в своем несовершенстве.\n\nЕдинение с таким созданием дарует мне силу, черпаемую из самого хаоса. Я [Select_CString(ROOT.Char.IsFemale, 'стала', 'стал' )] бы чем-то большим, чем человек... и, возможно, чем-то меньшим."
 magic.9107.a: "Настроиться на это искажённое существо"
 magic.9107.b: "Некоторые связи слишком опасны, чтобы их ковать"

 # Incorporeal Creature
 magic.9108.t: "Появляется бестелесное создание"
 magic.9108.desc: "Температура резко падает, когда проявляется присутствие — не совсем видимое, но ощутимое. Призрак, дух, сущность, не скованная плотью. Оно существует между миром живых и тем, что лежит за его пределами, видя истины, скрытые от смертных глаз.\n\nЕдинение с таким созданием истончит завесу между мной и миром духов. Я буду видеть то, что недоступно другим, но также привлеку внимание вещей, которые лучше оставить незамеченными."
 magic.9108.a: "Настроиться на эту призрачную сущность"
 magic.9108.b: "Я не буду привлекать внимание мертвецов"

 # Extremely Dangerous Creature
 magic.9109.t: "Приближается нечто ужасное"
 magic.9109.desc: "Каждый инстинкт кричит мне о необходимости бежать. Передо мной проявляется высший хищник — древний дракон, владыка демонов, существо столь сокрушительной мощи, что мой ритуальный круг на его фоне кажется детским рисунком. Одно его присутствие давит и удушает.\n\nЕдинение с таким созданием дарует мне невообразимую силу — но и навеки запятнает меня. Я буду нести частицу этого ужаса в своей душе до конца своих дней."
 magic.9109.a: "Собраться с духом и настроиться на это ужасающее существо"
 magic.9109.b: "Даже я не настолько [Select_CString(ROOT.Char.IsFemale, 'безрассудна', 'безрассуден' )]"

 # Rejection Events
 magic.9110.t: "Поиск продолжается"
 magic.9110.desc.first_rejection: "Создание растворяется обратно в эфирном царстве, и ритуальный круг пульсирует обновленной энергией. Есть и другие духи, что могут откликнуться на мой призыв — мне нужно лишь вновь протянуть руку. Но я чувствую, что окно для этого единения не будет оставаться открытым вечно."
 magic.9110.desc.second_rejection: "Я снова [Select_CString(ROOT.Char.IsFemale, 'отвергла', 'отверг' )] потенциальную связь и чувствую, как магические энергии слабеют. Духи становятся настороженными по отношению к тому, кто так легко отвергает их дары. У меня может быть еще один шанс найти подходящее создание, но не более."
 magic.9110.desc.final_rejection: "Ритуальный круг мерцает и угасает. Я [Select_CString(ROOT.Char.IsFemale, 'отвергла', 'отверг' )] слишком много предложений, и духи отозвали свое присутствие. Возможность единения упущена — по крайней мере, на данный момент. Возможно, со временем я смогу повторить этот ритуал."
 magic.9110.a: "Искать другого духа"
 magic.9110.b: "Оставить ритуал"
 magic.9110.c: "Смириться с тем, что духи ушли"

 # Failure Event
 magic.9111.t: "Духи уходят"
 magic.9111.desc: "Последние струйки магической энергии рассеиваются в ночном воздухе, оставляя меня в одиночестве в темном ритуальном пространстве. Я [Select_CString(ROOT.Char.IsFemale, 'была', 'был' )] слишком [Select_CString(ROOT.Char.IsFemale, 'разборчивой', 'разборчив' )], слишком [Select_CString(ROOT.Char.IsFemale, 'нерешительной', 'нерешителен' )], и теперь возможность ускользнула сквозь пальцы, словно дым.\n\nИстощение от неудачного ритуала оседает в моих костях. Пройдет некоторое время, прежде чем я восстановлю силы, чтобы снова попытаться совершить подобное единение."
 magic.9111.a: "Принять эту неудачу и двигаться дальше"

 # Success Event
 magic.9120.t: "Связь скреплена"
 magic.9120.desc: "Сила течет через меня, словно молния по медному проводу. Сущность создания сливается с моей собственной, не заменяя то, кем я являюсь, но дополняя и расширяя мои возможности так, как я только начинаю осознавать.\n\nТеперь я [Select_CString(ROOT.Char.IsFemale, 'изменилась', 'изменился' )], навеки [Select_CString(ROOT.Char.IsFemale, 'отмеченная', 'отмеченный' )] этим единением. Закрывая глаза, я все еще чувствую присутствие этого создания — постоянного спутника, привязанного к моей душе. С какими бы испытаниями мне ни пришлось столкнуться впереди, я встречу их с этой новой силой."
 magic.9120.a: "Принять эту новую силу"

 # Tooltips
 animal_attunement_magical_tooltip: "Вы получите бонусы к [Concept('learning','учености')|E], [Concept('arcana','аркане')|E] и [Concept('piety','благочестию')|E], а также увеличенный прирост опыта [Concept('lifestyle','образа жизни')|E]."
 animal_attunement_fodder_tooltip: "Вы получите бонусы к [Concept('health','здоровью')|E] и сопротивлению [Concept('stress','стрессу')|E], благодаря чему вас станет чрезвычайно трудно убить."
 animal_attunement_humanoid_tooltip: "Вы получите бонусы к [Concept('prowess','доблести')|E], [Concept('martial','военному делу')|E] и [Concept('dread','ужасу')|E], став более грозным воином."
 animal_attunement_intelligent_tooltip: "Вы получите бонусы к [Concept('learning','учености')|E] и [Concept('intrigue','интригам')|E], а также улучшите свои возможности проведения [Concept('scheme','происков')|E]."
 animal_attunement_inorganic_tooltip: "Вы получите значительные бонусы к [Concept('health','здоровью')|E] и [Concept('prowess','доблести')|E], став невероятно стойким."
 animal_attunement_enormous_tooltip: "Вы получите бонусы к [Concept('martial','военному делу')|E], [Concept('prowess','доблести')|E] и [Concept('prestige','престижу')|E], а также повысите эффективность армии."
 animal_attunement_monstrous_tooltip: "Вы получите мощные бонусы к [Concept('prowess','доблести')|E] и [Concept('dread','ужасу')|E], но столкнетесь со штрафами к [Concept('opinion','мнению')|E] со стороны других."
 animal_attunement_incorporeal_tooltip: "Вы получите бонусы к [Concept('intrigue','интригам')|E] и защите от [Concept('scheme','происков')|E], но станетe более подвержены [Concept('stress','стрессу')|E]."
 animal_attunement_dangerous_tooltip: "Вы получите исключительные бонусы к боевым навыкам, но столкнетесь со штрафами к [Concept('opinion','мнению')|E] и повышенным приростом [Concept('stress','стресса')|E]."

