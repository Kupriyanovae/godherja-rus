l_russian:
 study_magic.0001.t:0 "Прорыв!"
 study_magic.0001.desc.minor:0 "Я не понимаю. Свитки и фолианты передо мной намекают на могущественные тайны магии, однако я [Select_CString(ROOT.Char.IsFemale, 'смогла', 'смог' )] извлечь лишь самые базовые понятия. Переводя уставший взгляд на разбросанные по столу заметки, я чувствую, как меня накрывает волна истощения и разочарования.\n\nЯ решаю прекратить изыскания на этом этапе, пообещав себе вернуться к этим трудам, когда получу лучшее представление о предмете."
 study_magic.0001.desc.mid:0 "После месяцев напряженных занятий мои исследования магии наконец принесли плоды. Хотя многие из более грандиозных откровений, к которым я [Select_CString(ROOT.Char.IsFemale, 'стремилась', 'стремился' )], все еще ускользают от меня, мне безусловно удалось углубить как теоретическое, так и практическое понимание изучаемого предмета.\n\nУбирая бумаги, я отмечаю те из них, что представляют интерес для дальнейших исследований: я [Select_CString(ROOT.Char.IsFemale, 'нашла', 'нашел' )] несколько многообещающих зацепок, заслуживающих дополнительного изучения."
 study_magic.0001.desc.major:0 "Это исследование было полным трудностей и испытаний. Однако после долгих лун кропотливого труда я наконец [Select_CString(ROOT.Char.IsFemale, 'пришла', 'пришел' )] к удовлетворительному заключению. Различные теории и мысли, которые я раньше [Select_CString(ROOT.Char.IsFemale, 'считала', 'считал' )] разрозненными, слились в моем разуме в замысловатый гобелен магических знаний — что означает понимание этой сферы магии, которого достигали немногие [Concept('magi','маги')|E] моего уровня."
 study_magic.0001.desc.major_goodmagi:0 "Это исследование было полным трудностей и испытаний. Однако после долгих лун кропотливого труда я наконец [Select_CString(ROOT.Char.IsFemale, 'пришла', 'пришел' )] к удовлетворительному заключению. Различные теории и мысли, которые я раньше [Select_CString(ROOT.Char.IsFemale, 'считала', 'считал' )] разрозненными, слились в моем разуме в замысловатый гобелен арканных знаний — что означает мастерство в этой сфере магии, которого мало кто когда-либо достигал."
 study_magic.0001.desc.epic:0 "Готово. Месяцы кропотливых изысканий принесли сокровищницу знаний, сопоставимую с трудами [Concept('mayikrata','Майикратии')|E] в ее расцвет. Поднимаясь на дрожащие ноги, не находившие применения несколько дней, я трепещу перед бесчисленными возможностями, которые открывает мое новое понимание магии. Однако одно можно сказать наверняка: [Concept('aeras','Эрас')|E] больше никогда не будет прежним."
 study_magic.0001.desc.epic_goodmagi:0 "Готово. Месяцы кропотливых изысканий принесли сокровищницу знаний, сопоставимую с трудами [Concept('mayikrata','Майикратии')|E] в ее расцвет. Поднимаясь на дрожащие ноги, не находившие применения несколько дней, я пребываю в восторге при мысли о своем стремительном развитии в области [Concept('magic','магии')|E] благодаря новым сведениям, поступившим в мое распоряжение."
 study_magic.0001.a:0 "Я [Select_CString(ROOT.Char.IsFemale, 'усвоила', 'усвоил' )] все, что [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )], на данный момент."
 study_magic.0011.t:0 "Тупик"
 study_magic.0011.desc:0 "Я стою над письменным столом, пытаясь разобраться в хаотичном сплетении диаграмм и заметок. Это просто не имеет смысла! Содержащиеся здесь теории полны зияющих брешей, их выводы противоречат как друг другу, так и наблюдаемой реальности, а практические попытки проверить их истинность закончились полным провалом.\n\nК сожалению, похоже, что большая часть этого труда практически бесполезна."
 study_magic.0011.a:0 "Моему разуму нужно отдохнуть от этого."
 study_magic.0011.b:0 "Но я ведь так [Select_CString(ROOT.Char.IsFemale, 'близка', 'близок' )]! Еще совсем немного исследований!"