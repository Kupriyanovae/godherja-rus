 normal_spirit_desc: "почти не отличается по внешнему виду от моей команды, хотя океанские волны проходят сквозь него без вреда"
 disfigured_spirit_desc: "сильно изуродован и разложен, как будто испорчен морем при жизни"
 mutated_spirit_1_desc: "сильно мутировал, покрыт с головы до ног плотными ракушками, которые крошатся и отрастают заново, когда дух движется"
 mutated_spirit_2_desc: "сильно мутировал, с щупальцами, растущими из его позвоночника"
 mutated_spirit_3_desc: "сильно мутировал, с раковиной моллюска вместо головы, из которой выглядывают глаза, и клешнями краба вместо рук"
 mutated_spirit_4_desc: "сильно мутировал, с кораллами, покрывающими большую часть его кожи, и медузой, сидящей внутри его открытого черепа, где должен быть мозг"

