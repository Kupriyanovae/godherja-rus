l_russian:
 dead_magic.0001.t: "Человек из камня"
 dead_magic.0001.desc: "Мои коллеги предложили мне, что практика создания голема может оказаться ценным упражнением для развития моих навыков. Хотя создание простого боевого голема находится в пределах моих возможностей, построение более изысканного и специализированного слуги станет настоящим испытанием и, без сомнения, откроет для меня новые аспекты искусства.\n\nПередо мной лежит стол, заваленный чертежами, и я размышляю, с чего же начать."
 dead_magic.0001.a: "Не жалеть средств, создайте мне золотого голема!"
 dead_magic.0001.b: "Ничего лишнего, просто прямолинейный слуга."
 dead_magic.0001.c: "Может, просто использовать олово?"
 dead_magic.0001.d: "А, подумав, нет."
 
 dead_magic.0002.t: "Душа голема"
 dead_magic.0002.desc: "С телом голема, принимающим форму на моём рабочем столе, я размышляю, как лучше наполнить его оболочку. Требуется душа, и её природа определит функции и навыки моего слуги. К счастью, экспертов по созданию душ хватает, и они могут помочь добыть подходящий дух — разумеется, за плату.\n\nВыбор за мной."
 dead_magic.0002.a: "Душа преданного слуги."
 dead_magic.0002.b: "Душа верного телохранителя."
 dead_magic.0002.c: "Душа искусного танцора."
 dead_magic.0002.d: "О, просто найдите крестьянина."
 
 dead_magic.0003.t: "Предложение"
 dead_magic.0003.desc: "В мой двор явился незнакомец, утверждающий, что слышал о моём стремлении создать голема-слугу. Он предлагает свои услуги как [Concept('magi','маг')|E] и опытный создатель големов, объясняя, что определённые магические искусства могут ещё сильнее специализировать моего слугу.\n\nРазумеется, за плату."
 dead_magic.0003.a: "Оболочка из орихалка для непревзойдённой прочности!"
 dead_magic.0003.a.tt: "Сделает голема почти неразрушимым!"
 dead_magic.0003.b: "Вторая пара рук из совершенного гермия!"
 dead_magic.0003.b.tt: "Увеличит полезность голема как слуги!"
 dead_magic.0003.c: "Обработка черепа тончайшим серебром."
 dead_magic.0003.c.tt: "Сделает голема более восприимчивым и острым!"
 dead_magic.0003.d: "Нет, нам это не нужно."
 
 dead_magic.0004.t: "Новый сотрудник?"
 dead_magic.0004.desc: "С завершением улучшений незнакомец начал собирать свои вещи, готовясь покинуть мой двор. [Concept('magi','Маги')|E] с их навыками — редкость в Эрасе. Может, мне стоит попытаться уговорить его остаться?"
 dead_magic.0004.a: "Подождите, не уходите! У меня есть деньги!"
 dead_magic.0004.b: "Нет, они нам не нужны."
 
 dead_magic.0005.t: "Голем восстаёт"
 dead_magic.0005.desc: "После долгих месяцев работы мой голем наконец завершён. Лежа на гранитной плите, он медленно поднимается в сидячее положение, а затем встаёт на ноги. Кристаллические глаза горят загадочным зелёным светом, изучая окружающее пространство, прежде чем обратить взгляд на меня, своего нового хозяина. Он ждёт моих команд."
 dead_magic.0005.a: "ОН ЖИВ!"
 dead_magic.0005.b: "Он жив!"
 dead_magic.0005.c: "Прекрасно. Продайте его."
 
 dead_magic.0006.t: "Тайны лунного камня"
 dead_magic.0006.desc: "‘Должен быть другой путь’, — мрачно бормочу я, глядя в ночное небо через окно. Оно насмехается надо мной, [aervalr|E], его расколотый труп висит высоко на небосводе. Уже поздно, и я заперт в своём кабинете, окружённый запахом старой, разложившейся бумаги. Гримуары и свитки лежат на столе, предметы моих исследований и источник моего разочарования. Теоремы по искусству [Concept('dead_magic','мертвой магией')|E], некогда драгоценные, теперь бесполезны. Устаревшие. Ненадёжные в лучшем случае, теперь, когда Эрвал разрушен.\n\n«Должен быть», — повторяю я, глядя на тень, пересекающую чёрное небо, путь ещё одного падающего осколка. Конечно! Я всё смотрел не так. Эти тексты бесполезны, ведь у нас больше нет луны их времён. Но у нас есть кое-что другое, гораздо ближе. Её расколотые осколки, лунные камни, упавшие на [Concept('aeras','Эрас')|E]. Если я смогу достать несколько образцов, если я смогу их изучить... Какие знания я смогу извлечь?"
 dead_magic.0006.a: "На моей земле есть место, где упали лунные камни."
 dead_magic.0006.b: "Мне придётся сначала их купить, разумеется."
 dead_magic.0006.c: "Изучать камни? Уверен, у меня есть дела поважнее."
 
 dead_magic.0007.t: "Прибытие камней"
 dead_magic.0007.desc: "Мои слуги приносят сундук. Мягкое зелёное свечение просачивается через его стенки, едва заметное в свете факелов, освещающих мою комнату. Они работают быстро, их нервозность очевидна, когда они ставят сундук и едва удерживаются, чтобы не отскочить назад. В последние дни по замку распространились слухи, высокие рассказы о мёртвых полях вокруг упавших обломков и болезнях, распространяющихся среди тех, кому не повезло добывать их. Хотя это, конечно, преувеличения, в них может быть доля правды. Даже стоя рядом, я чувствую силу, исходящую из запертого сундука. По моему позвоночнику пробегает дрожь. Страх? Ожидание? Так или иначе, мне придётся быть осторожным в своих исследованиях."
 dead_magic.0007.a: "Начнём."
 dead_magic.0007.a.failure.t: "Вы не смогли извлечь знания из камней."
 dead_magic.0007.a.success.t: "Вы извлекли ценные знания из камней."
 dead_magic.0007.b: "Мой придворный маг, [court_magi.GetTitledFirstName], может пригодиться здесь."
 dead_magic.0007.c: "На самом деле, я передумал. Избавьтесь от этого хлама."
 
 