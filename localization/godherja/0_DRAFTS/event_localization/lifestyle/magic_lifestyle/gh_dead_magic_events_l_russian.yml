l_russian:
 dead_magic.0001.t: "Человек из камня"
 dead_magic.0001.desc: "Коллеги полагают, что создание голема станет для меня хорошим упражнением в магическом искусстве. Простого боевого голема я вполне могу создать, но изготовление более искусного и специализированного слуги станет настоящим испытанием моего мастерства и, несомненно, откроет мне новые грани этого искусства.\n\nПередо мной стол, заваленный чертежами. С чего же начать?"
 dead_magic.0001.a: "Не жалейте средств — создайте мне золотого голема!"
 dead_magic.0001.b: "Без излишеств. Мне нужен просто слуга."
 dead_magic.0001.c: "Может, просто использовать олово?"
 dead_magic.0001.d: "Нет, пожалуй, не стоит."
 
 dead_magic.0002.t: "Душа голема"
 dead_magic.0002.desc: "Тело голема постепенно обретает форму на моём верстаке. Теперь нужно решить, чем наполнить эту оболочку. Ему необходима душа, и от её природы во многом зависят предназначение и способности моего слуги. К счастью, знатоков искусства работы с душами немало: они могут добыть подходящий дух — разумеется, за плату.\n\nВыбор за мной."
 dead_magic.0002.a: "Душа преданного слуги."
 dead_magic.0002.b: "Душа верного телохранителя."
 dead_magic.0002.c: "Душа искусного танцора."
 dead_magic.0002.d: "О, просто найдите крестьянина."
 
 dead_magic.0003.t: "Предложение"
 dead_magic.0003.desc: "При моём дворе появляется незнакомец, по словам которого, до него дошли слухи о том, что я создаю голема-слугу. Этот [Concept('magi','маг')|E] и искусный мастер по созданию големов предлагает свои услуги: при помощи тайных искусств он может наделить моего слугу дополнительными способностями.\n\nРазумеется, за плату."
 dead_magic.0003.a: "Оболочка из орихалка для непревзойдённой прочности!"
 dead_magic.0003.a.tt: "Голема будет почти невозможно разрушить!"
 dead_magic.0003.b: "Вторая пара рук из совершенного гермия!"
 dead_magic.0003.b.tt: "Голем сможет выполнять больше обязанностей слуги!"
 dead_magic.0003.c: "Обработка черепа тончайшим серебром."
 dead_magic.0003.c.tt: "Голем станет наблюдательнее и сообразительнее!"
 dead_magic.0003.d: "Нет, нам это не нужно."
 
 dead_magic.0004.t: "Нанять мастера?"
 dead_magic.0004.desc: "Работа закончена, и мастер уже собирает вещи, намереваясь покинуть мой двор. На Эрасе редко встречаются [Concept('magi','маги')|E] такого мастерства. Может, стоит уговорить его остаться?"
 dead_magic.0004.a: "Подождите, не уходите! У меня есть деньги!"
 dead_magic.0004.b: "Нет, его услуги нам больше не нужны."
 
 dead_magic.0005.t: "Голем восстаёт"
 dead_magic.0005.desc: "После долгих месяцев труда мой голем наконец готов. Он лежит на гранитной плите, затем медленно садится и поднимается на ноги. Его кристаллические глаза горят загадочным зелёным светом. Он оглядывается, а затем обращает свой взор на меня — [Select_CString(ROOT.Char.IsFemale, 'свою новую хозяйку', 'своего нового хозяина')]. Он ждёт моего приказа."
 dead_magic.0005.a: "ОН ЖИВ!"
 dead_magic.0005.b: "Он жив!"
 dead_magic.0005.c: "Прекрасно. Продайте его."
 
 dead_magic.0006.t: "Тайны лунного камня"
 dead_magic.0006.desc: "«Должен быть иной способ», — с досадой бормочу я, глядя из окна на ночное небо. [aervalr|E] словно насмехается надо мной: его расколотое тело висит высоко над землёй. Уже поздно, а я всё ещё не выхожу из кабинета, где пахнет ветхой бумагой. На столе разложены гримуары и свитки — предмет моих исследований и источник моего разочарования. Труды по искусству [Concept('dead_magic','мёртвой магии')|E], некогда бесценные, теперь бесполезны. Устарели. В лучшем случае им нельзя доверять с тех пор, как раскололся Эрвал.\n\n«Должен быть», — повторяю я, когда чёрное небо пересекает едва заметный след очередного падающего осколка. Ну конечно! Всё это время я смотрю не туда. Старые тексты бесполезны, ведь луны, которую знали их авторы, больше нет. Зато есть кое-что гораздо ближе: её обломки, лунные камни, упавшие на [Concept('aeras','Эрас')|E]. Если раздобыть несколько образцов и изучить их... Какие тайны они могут открыть?"
 dead_magic.0006.a: "В моих владениях есть место падения лунных камней."
 dead_magic.0006.b: "Мне придётся сначала их купить, разумеется."
 dead_magic.0006.c: "Изучать камни? У меня наверняка найдутся дела поважнее."
 
 dead_magic.0007.t: "Лунные камни доставлены"
 dead_magic.0007.desc: "Слуги вносят сундук. Сквозь щели пробивается слабое зелёное свечение, едва различимое при свете факелов в моём кабинете. Слуги торопятся; по их лицам видно, как они нервничают. Поставив сундук, они едва сдерживаются, чтобы не отскочить от него. Последние дни по замку ходят слухи — невероятные рассказы о мёртвых полях вокруг упавших осколков и болезни, поражающей несчастных, которым приходится их добывать. Наверняка многое преувеличено, но доля правды в этих историях может быть. Даже отсюда я ощущаю силу, исходящую из запертого сундука. По спине пробегает дрожь. Страх? Предвкушение? Как бы то ни было, в ходе исследований придётся соблюдать осторожность."
 dead_magic.0007.a: "Начнём."
 dead_magic.0007.a.failure.t: "Вы не смогли извлечь знания из камней."
 dead_magic.0007.a.success.t: "Вы извлекли ценные знания из камней."
 dead_magic.0007.b: "Возможно, мне поможет придворный маг — [court_magi.GetTitledFirstName]."
 dead_magic.0007.c: "На самом деле, я [Select_CString(ROOT.Char.IsFemale, 'передумала', 'передумал' )]. Избавьтесь от этого хлама."
 
 
