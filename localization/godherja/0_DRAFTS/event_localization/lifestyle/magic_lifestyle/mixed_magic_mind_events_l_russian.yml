l_russian:

 mixed_magic_mind.0001.t: "Ребёнок, страдающий от кошмаров"
 mixed_magic_mind.0001.desc: "Ваш ребёнок страдает от повторяющихся кошмаров (GH TODO: Необходимо добавить полноценное описание)"
 mixed_magic_mind.0001.a: "Ничего не делать."
 mixed_magic_mind.0001.b: "Попытаться помочь с помощью магии"

 mixed_magic_mind.0011.t: "Лунатик"
 mixed_magic_mind.0011.desc: "По ночам [dreamer.GetName] бродит во сне, бессвязно бормочет и словно заново переживает свои жуткие кошмары. В этих снах предстают могущественные ритуалы и существа, недоступные моему пониманию; во время ночных блужданий от [dreamer.GetHerHis] тела непрерывно исходит магия. Однако по пробуждении никаких отклонений не заметно. [dreamer.GetSheHe|U] умоляет меня о помощи, но попытка исцеления может лишь усугубить кошмары. С другой стороны, если тщательно изучить эти сновидения и проникнуть в разум во время ночных блужданий, можно узнать немало нового о смешанной магии.\n\nА если каким-то образом погрузить [dreamer.GetHerHis] разум в вечный сон, сновидения могут стать мощным источником магии..."
 mixed_magic_mind.0011.a: "Я излечу ваш разум от этих недугов."
 mixed_magic_mind.0011.b: "Подумать только, чему я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] бы научиться!"
 mixed_magic_mind.0011.c: "Ваши сны станут мощным даром."
 mixed_magic_mind.0011.success.t: "Лунатизм излечен: [dreamer.GetFirstName]"
 mixed_magic_mind.0011.failure.t: "Ваши усилия не увенчались успехом."
