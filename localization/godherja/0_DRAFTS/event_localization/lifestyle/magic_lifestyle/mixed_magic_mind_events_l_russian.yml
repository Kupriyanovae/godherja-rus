l_russian:

 mixed_magic_mind.0001.t: "Ребёнок, страдающий от кошмаров"
 mixed_magic_mind.0001.desc: "Ваш ребёнок страдает от повторяющихся кошмаров (GH TODO: Необходимо добавить полноценное описание)"
 mixed_magic_mind.0001.a: "Ничего не делать."
 mixed_magic_mind.0001.b: "Попытаться помочь с помощью магии"

 mixed_magic_mind.0011.t: "Лунатик"
 mixed_magic_mind.0011.desc: "Мой придворный, [dreamer.GetName], бродит во сне посреди ночи, говоря бессвязно и разыгрывая [dreamer.GetHerHis] ужасные кошмары. [dreamer.GetHerHis|U] сны повествуют о могущественных ритуалах и существах, лежащих за гранью моего понимания, а постоянный поток магии исходит от [dreamer.GetSheHe], пока [dreamer.GetSheHe] блуждает во сне. Однако, когда [dreamer.GetSheHe] пробуждается, [dreamer.GetSheHe] кажется совершенно нормальным. [dreamer.GetSheHe|U] умоляют меня вылечить их, но существует риск ухудшения их кошмаров. С другой стороны, их сны можно было бы тщательно изучить, и проникновение в их разум во время лунатизма дало бы мне глубокие знания в области Смешанной Магии.\n\nОднако, если бы они каким-то образом погрузились в вечный сон, их сны могли бы стать мощным источником магии..."
 mixed_magic_mind.0011.a: "Я излечу ваш разум от этих недугов."
 mixed_magic_mind.0011.b: "Подумать только, чему я мог бы научиться!"
 mixed_magic_mind.0011.c: "Ваши сны станут мощным даром."
 mixed_magic_mind.0011.success.t: "Вы излечили [dreamer.GetFirstNamePossessive] лунатизм."
 mixed_magic_mind.0011.failure.t: "Ваши усилия не увенчались успехом."
