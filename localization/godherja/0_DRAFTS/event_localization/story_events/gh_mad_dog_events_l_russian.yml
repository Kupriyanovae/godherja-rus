l_russian:

 mad_dog.1.t:0 "Мой молодой щенок..."
 mad_dog.1.desc:0 "Мой молодой щенок, Ульфиркс мертв... Он погиб от рук этих [Concept('aversaria','аверсарианских')|E] гадюк, и скоро они узнают мой гнев. Мои люди собираются под моим знаменем, чтобы раскалывать аверсарианские черепа и видеть, как их столь «чистая» кровь течет по их улицам. Острова покраснеют от аверсарианской крови, в чем я клянусь перед богами и людьми."
 
 mad_dog.1.a:0 "Я заберу острова Коллоса, в чем я клянусь."

 mad_dog.2.t:0 "Месть Бешеного Пса"
 mad_dog.2.desc:0 "Гадюкам [Concept('aversaria','Аверсарии')|E], сукиным сыновьям и дочерям Пеквона. Знайте, что мне известно о ваших преступлениях против сьяволков, моей семьи и моего сына Ульфиркса. Я увижу, как ваша столь «чистая» кровь потечет по вашим улицам, а ваши вопли агонии эхом разнесутся по вашим великим дворцам, построенным трудом ваших рабов. Я приговариваю вас к смерти за ваши бесчисленные преступления и клянусь перед богами, что вырежу вас до последнего мужчины, женщины и ребенка. Да будете вы вечно страдать в самом черном из адов, дабы появилась хоть какая-то видимость справедливости за ваши бесконечные злодеяния. Подпись: Херберд Серилак, «Меч, Расколовший Небеса»."
 
 mad_dog.2.a:0 "У этого варвара нет шансов против сыновей и дочерей [Concept('aversaria','Аверсарии')|E]!"
 mad_dog.2.b:0 "Я не [Concept('aversaria','аверсарианец')|E], но эти земли мои!"