l_russian:
 harthah_war.0100.t:0 "Против агионистов"
 harthah_war.0100.desc:0 "Наконец-то наша кампания по изгнанию агионистов из [Concept('sarradon','Саррадона')|E] началась, и мои солдаты собираются в великих количествах. По мере того как вести о нашем походе против этих чудовищ в человеческом обличье распространяются по земле, рьяные новобранцы стекаются под наше знамя. Слишком долго народ Саррадона угнетался этими тиранами и их языческими Святыми, и наши ряды рекрутов полнятся даже [Concept('ritualism','ритуалистами')|E] и другими не-[Concept('wardenism','варденитами')|E], отчаянно жаждущими свободы от ига [Concept('aversaria','аверсарианского')|E] рабства. Стоит мне лишь молвить слово — и население поднимет восстание, чтобы поддержать мое вторжение."
 harthah_war.0100.a:0 "Весь Саррадон марширует со мной!"
 harthah_war.0100.a.tt:0 "Вы получите огромную поддержку для вашей кампании как от удерживаемых агионистами провинций, так и от вассалов-неагионистов орденов."
 harthah_war.0100.b:0 "Мне не нужен этот сброд."
 harthah_war.0100.b.tt:0 "Вы не получите дополнительных войск для этой войны."
 harthah_war.0101.t:0 "Хартах марширует"
 harthah_war.0101.desc:0 "Наконец-то Хартах, так называемый «Отец [Concept('sarradon','Саррадона')|E]», марширует, чтобы освободить нас. Паника среди агионистов, когда-то столь самодовольных в своем превосходстве, очевидна, пока они спешно собирают свои ополчения. За их ухмылками я теперь замечаю леденящий ужас, а их некогда самоуверенные приказы сменились хриплыми воплями с требованиями верности и службы. Я долго [Select_CString(ROOT.Char.IsFemale, 'трудилась', 'трудился' )] как марионетка и вассал под началом этих жестоких тиранов, но теперь? Возможно, пришло время подняться и вернуть Саррадон."
 harthah_war.0101.a:0 "К оружию!"
 harthah_war.0101.a.tt:0 "Вы присоединитесь к Хартаху против вашего сюзерена."
 harthah_war.0101.b:0 "Хартах обречен. Я не пойду ко дну вместе с ним."