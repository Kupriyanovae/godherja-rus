 ##############################
 # Emarios 'The Sea-Sword'	  #
 # By UltimateVictory		 #
 ##############################
 opening_event.80.txt:0 "Морской клинок"
 opening_event.80.desc:0 "Мне было всего пять лет, когда умер мой отец, и всего семь, когда мир раскололся. Мое самое раннее воспоминание — как моя напуганная, скорбящая мать спешно сажает меня на корабль, объясняя, что после смерти отца нам придется покинуть наш дом. Выросший в [GetTitleByKey('c_oraispol').GetNameNoTier], я провел всю жизнь в изгнании, мечтая о дне, когда мир удастся исправить, когда я смогу всё вернуть на свои места.\n\nВ мое отсутствие Крехеджад пылал, поглощенный тем же ужасным пламенем войны, которое повергло [Concept('aversaria','Аверсарию')|E] так низко. Там, где когда-то мы жили в невообразимом процветании, теперь мы режем друг друга ради чести носить окровавленную корону. Но я могу разорвать этот порочный круг. Во имя законного Аавтократа я могу спасти Крехеджад. Я стану светом в это темное время, я стану героем, в котором нуждаются эти острова. Северные пределы Лейдокоса уже приняли мое праведное возвращение, и они будут лишь первыми.\n\nМое имя будут воспевать поколения будущих крехеджадцев, которые родятся в эпоху без войн. Все, что мне нужно делать — идти вперед, и этот осколок нашего разбитого мира вернется на свое место."
 opening_event.80.a:0 "Надеющийся зайдет далеко"

