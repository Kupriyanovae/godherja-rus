l_russian:
 world_story.0001.t: "Падение Ораисполя"
 world_story.0001.desc: "Разрозненная группа мелких дворян из северной столицы прибыла в наши земли в поисках убежища, принеся мрачные вести: Ораисполь пал под натиском варварских орд, которые ведёт [oraispol_conqueror.GetTitledFirstName]! Несмотря на героическую оборону безнадёжно уступавшего в численности гарнизона, некогда гордый мегаполис повержен и превращён в полностью разграбленную, сгоревшую тень своего прошлого.\n\nЭти события, хотя их в тайне и ожидали со времён катастрофы у Элисийского перевала, всё же вызвали глубокое потрясение среди и без того деморализованных и терзаемых войной остатков Империи. Теперь, когда север, кажется, навсегда погружается в подвластную варварам анархию, надежды на общее восстановление [Concept('aversaria','имперского')|E] порядка становятся всё более туманными и призрачными."
 world_story.0001.desc.sjalvolki: "Сегодня великий день, ибо древнее зло наконец встретило свой конец. Храбрые и неудержимые воины нашего народа вонзили кол в тёмное, полное желчи сердце [Concept('aversaria','аверсарианского')|E] чудовища, что некогда жаждало поглотить всё вокруг: [title_c_oraispol.GetNameNoTier] пал.\n\nПока [oraispol_conqueror.GetTitledFirstName] взирает на поверженный город, зажигается рассвет новой эры. Теперь, когда безоговорочная победа над Империей считается предрешённым делом, наш великий марш по известному миру подходит к концу. Со всей добытой славой и захваченными богатыми землями настало время называть это место нашим новым домом."
 world_story.0001.desc.iyrossi: "Хотя жернова справедливости мелют медленно, они всё же мелют. После тысячи лет порока, жестокости и безграничной злобы настало время для наших бывших господ платить по счетам.\n\n[title_c_oraispol.GetNameNoTier], некогда считавшийся неуязвимым, ныне лежит поверженным под сапогами воинов [oraispol_conqueror.GetTitledFirstName]. Высокомерные здания, что прежде возвышались монументом слепой гордыне [Concept('aversaria','аверсарианцев')|E], теперь лишь пылающие груды обломков.\n\nДолгие годы нашего пленения наконец подходят к концу. Мы должны воспользоваться моментом и сбросить последние остатки чужеземного ига, ибо наш народ ждёт новое, более светлое будущее."
 world_story.0001.desc.generic: "То, что поначалу казалось преувеличенными трактирными сплетнями проезжих наёмников и купцов, ныне подтвердил вестник со двора [oraispol_conqueror.GetTitledFirstName]: [title_c_oraispol.GetNameNoTier] пал.\n\nХотя великий город переживал упадок из-за продолжающегося распада Империи, символическая мощь этого события неоспорима. По всему Расколотому побережью [Concept('aversaria','аверсарианцы')|E] всех мастей встретили эту весть с предсказуемым ужасом, тогда как их враги предались ликующим пиршествам. Впрочем, хотя это событие, несомненно, имеет колоссальный исторический масштаб, мы в этой борьбе сторонние наблюдатели."
 world_story.0001.a: "Проклятые дикари!"
 world_story.0001.b: "Ликуйте!"
 world_story.0001.c: "Любопытный поворот событий."
 
 world_story.0002.t: "Смерть Завоевателя"
 world_story.0002.desc: "Ценвар «Сокрушитель Ведьм» мёртв. Первые донесения не позволяют установить, было ли это убийством, гибелью в бою, болезнью или чем-то иным, но все сходятся во мнении: Имперрех распался. Многие в бывшей коалиции уже готовятся к войне друг против друга за уцелевшие обломки [Concept('aversaria','Аверсарии')|E]. То, что произойдёт дальше, навсегда определит будущее Континента."
 world_story.0002.a: "Восходит новый мир."
 
 world_story.0003.t: "Смерть Завоевателя"
 world_story.0003.desc: "Легендарный воин Ценвар «Сокрушитель Ведьм» мёртв. Первые донесения не позволяют определить, было ли это убийством, гибелью в бою, болезнью или чем-то иным, но все сходятся во мнении: без Ценвара во главе Имперрех неизбежно падет. Мои бывшие союзники уже готовятся к войне друг против друга за уцелевшие обломки [Concept('aversaria','Аверсарии')|E]. То, что произойдёт дальше, навсегда определит будущее моего народа."
 world_story.0003.a: "Восходит новый мир."
 
 world_story.0100.t: "Врата Ораисполя"
 world_story.0100.desc: "Вот и всё. Это кульминация дела всей моей жизни, мой звёздный час, величайшая радость, какую мне когда-либо выпадало познать.\n\nЯ родился никем. Местом моего рождения была деревня в самой глухой из колоний, давно поглощённой [Concept('the_fog','Туманом')|E]. Битва за битвой, труп за трупом, я пробивал себе путь с самого края мира к его бьющемуся позолоченному сердцу — и пришёл, чтобы забрать его себе.\n\nПока я направляюсь к Колонне Чистейших, ликующие толпы, выстроившиеся вдоль улиц, скандируют моё имя, и их радостные крики сливаются в оглушительную какофонию:\n\n«Спаситель! Чёрное Солнце! Аавтократ! Чистейший!»"
 world_story.0100.a: "Предстоит ещё многое сделать."
 world_story.0100.tt: "[new_capital.GetNameNoTier] станет законной столицей [aversarian_polity.GetNameNoTier]"
 world_story.0101.t: "Бастонпорт"
 world_story.0101.desc: "Мы всё ближе к нашей конечной цели. Ещё несколько лет назад под моим началом была лишь разрозненная горстка разбитых легионов да бесполезный кусок земли на самом краю [Concept('aversaria','Аверсарии')|E].\n\nСегодня под моей властью один из самых богатых уцелевших городов Империи со всеми прилегающими землями. Путь сюда был непрост: за каждый луг, за каждый лес, за каждую ферму было пролито столько крови, что хватило бы наполнить реку. Калатипсоми суждено было быть диким и наполненной анархией под властью варваров, но теперь я наконец принёс порядок в эту неспокойную провинцию. Мои деяния столь велики, что при желании я могу переименовать город в свою честь, и никто не сочтёт это дерзостью.\n\nОднако [GetBuilding('01_bastonport').GetName], как бы богат он ни был — не то, чего я жажду. Я обращаю взор на юг, ведь заветная мечта моей жизни дразняще близка..."
 world_story.0101.a: "Он будет носить имя своего освободителя до конца времён."
 world_story.0101.a.tt: "[GetTitleByKey('c_kankaanviisa').GetNameNoTier] и [GetTitleByKey('b_hinterreckenberg').GetNameNoTier] сменят своё название на #E Никонеаполь#!"
 world_story.0101.b: "Мелочная слава — не то, к чему я стремлюсь."

 NICONEAPOL_NAME: "Никонеаполь"
 
 world_story.0150.t: "Штурм Чурана"
 world_story.0150.desc: "Корабли, доверху наполненные сокровищами, неожиданно начали прибывать в порты по всему [Concept('chevalie','Шевалье')|E] из далёких земель амсаров в [Concept('sarradon','Саррадоне')|E]. Судя по всему, столица экзотической империи пала под ударами наших наёмников и искателей приключений, которые вывезли из города всё, что имело хоть какую-то ценность — хотя, похоже, даже при полном отсутствии удержания им трудно разграбить его золото дочиста.\n\nДиковинные товары южан в одночасье стали невероятно популярны среди знати. Награбленного сокровища так много, что кое-где золотые украшения продаются по цене фляги меда, а несколько гильдий ювелиров в [Concept('peti_gisredde','Пети-Гисредд')|E] требуют ограничить этот приток, опасаясь разорения.\n\nИ всё же алчность Западной королевской торговой компании ещё не утолена. Её агенты прочёсывают земли в поисках рекрутов, и это вполне понятно: многие в их рядах предпочли уйти на покой, обладая теперь таким богатством, что его не растратить и за десять роскошных жизней."
 world_story.0150.desc.amsari: "Кажется, бедствия продолжающейся гражданской войны нашли способ повергнуть нас ещё ниже, чем мы считали возможным: [GetTitleByKey('c_tchouran').GetNameNoTier], священная столица Канамсаров, город, который за всю свою долгую историю никогда не падал перед иноземным войском, пал при осаде варварскими наёмниками и ворами!\n\nШевальенские стервятники воспользовались нынешним хаосом, чтобы взять штурмом один из самых гордых оплотов нашего народа, и нам остаётся лишь слушать ужасные истории, которые рассказывают беженцы из метрополии. Несколько кварталов сожжены, бесчисленные невинные убиты, храмы осквернены, а Ханхе Пеашмбра, по сообщениям, разграблен настолько дочиста, что от него остались лишь голые мраморные стены.\n\nВоеначальники по всему бывшему Хиклахну поклялись отомстить за эту катастрофу и как можно скорее изгнать северную мразь, хотя надежда на согласованные военные действия столь же далека, как и то, что сам Заоран придёт нам на помощь."
 world_story.0150.desc.generic: "Известия из земель амсаров, где бушует гражданская война, указывают на то, что конфликт принял неожиданный оборот. Хаос оказался благодатной почвой для марочников, которые до сих пор лишь косвенно наживались на политической ситуации. Но теперь их цели явно выросли: они захватили [GetTitleByKey('c_tchouran').GetNameNoTier], столицу Хиклахна и один из самых пышных городов мира.\n\nКак именно это произошло, не совсем ясно: военачальники региона сыплют всё более нелепыми обвинениями в адрес друг друга, хотя большинство из них, вероятно, втайне проклинает покойного Пейджмана — ведь именно он вопреки советам так щедро предоставил шевальенцам плацдарм в регионе десятилетия назад.\n\nКак бы то ни было, это, несомненно, переломный момент конфликта. На северян, которых прежде почти не замечали, теперь обращено пристальное внимание местных жителей, а вкус богатств, захваченных в [GetTitleByKey('c_tchouran').GetNameNoTier], кажется, лишь разогрел амбиции самих захватчиков."
 world_story.0150.a: "Славный день!"
 world_story.0150.b: "Неужели грядут последние времена?"
 world_story.0150.c: "Как меняются времена..."
 
#world_story.1001.t: "A Song of Sarradon"
#world_story.1001.desc: "Hello! Thank you for playing Godherja: The Dying World, and its first update in nearly a year! This took a lot of sweat, tears, and sacrifices to dead gods to get released and we are so happy to finally have it out there. Of course it has been a very long time since we have had a wide release, and this is a *massive* patch, so please understand it isn't entirely polished yet!\n\nWe will be putting out a development retrospective talking about the difficulties we had in getting this patch together, as well as discussing the changes we've made to our development methods and team structure to ensure that future patches do not take anywhere near this long. Please go onto our Discord to report any bugs you find in the meanwhile, and keep in mind that the map was sadly not finished its repainting when we decided to release — it'll be done soon!\n\nThe next Godherja patch will be for Royal Court. We upload all released versions of the mod to ModDB in case you wish to access older versions, and Steam allows you to roll back the game version if the mod becomes incompatible.\n\nThank you again for playing! We hope you enjoy the wonders of the south :)\n\n~Lonely Knightess and the development team."
#world_story.1001.a: "Do they always talk this much?"