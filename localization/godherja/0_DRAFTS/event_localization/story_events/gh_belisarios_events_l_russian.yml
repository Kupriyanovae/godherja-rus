l_russian:
 gh_belisarios_events.0001.t:0 "То, что остается"
 gh_belisarios_events.0001.desc:0 "Так долго я был сосредоточен на мести. Словно голод, она пожирала меня. Можно ли представить себе такие страдания — быть вынужденным жить дальше с знанием того, что причинившие мне зло все еще живы и распространяют свой яд? Смеются, пока моя семья гниет в земле. Какая несправедливость! Даже сейчас одна лишь эта мысль едва переносима.\n\nХватит об этом. Все кончено. Мои враги уничтожены, а я остаюсь тут. Для меня не было ничего за пределами мести. Она была моей жизнью так долго, моей единственной амбицией. Моей целью. Я не представлял себе будущего. По правде говоря, я думал, что к этому моменту буду уже мертв. Буду последним трупом на этом прорубленном мною кровавом пути. И все же, вопреки всему, я все еще жив. Здесь, в самом конце, мир не кажется таким уж пустым. Всходит еще одно солнце, и я чувствую его тепло на своем лице. Возможно, мне пора начать жить для себя. Я — это нечто большее, чем мое прошлое."
 gh_belisarios_events.0001.a:0 "И я предназначен для большего, чем смерть."
 gh_belisarios_events.0001.ct:0 "Велисарий обретает новую цель в жизни."