l_russian:

 ##############################
 # Arshab                     #
 # By Askil         	      #
 ##############################
 opening_event_sarradon_1298.1.t: "Терновый венец"
 opening_event_sarradon_1298.1.desc: "Мир — это шепот, которого я никогда не знал, слово, доносящееся эхом из сказаний ушедшей эпохи. Старейшины рассказывают о славном прошлом, когда Хиклахнат мог выдержать всё. Но я знаю лишь постоянную борьбу, грызущий голод царства, пожирающего само себя. Проклятье Пейджману за его слабость, ведь если бы он поступил так, как его предшественники, возможно, [GetTitleByKey('e_amsari_hiklahn').GetNameNoTier] не был бы сегодня разбитой мечтой. Я сражаюсь, потому что это всё, что я когда-либо знал, всё, чему меня учили. Но ведь это мое право по крови; я из рода [Concept('gh_the_amsari_prophet',' Пророка')|E], избранный править верующими, как говорил мой отец.\n\nМилостью Заорана я верну то, что принадлежит мне, и изгоню жадных [Concept('marchers','марочников')|E] с наших земель. Я вел отчаявшихся и лишенных всего против их бывалых наемников. Мы пускали им кровь, заставляя платить за каждый пядь нашей священной земли. Я был так близок тогда, достаточно близок, чтобы видеть священную столицу [GetTitleByKey('c_tchouran').GetNameNoTier] в когтях марочников. Это горькая рана, утрата, которую я чувствую своими костями, хоть я никогда и не знал её невредимой. Я увижу её снова, свободной от их хватки, и я увижу, как Амсарский Хиклахн восстанет вновь."
 opening_event_sarradon_1298.1.a: "Война продолжается, как и всегда."

 #############################
 # Zehur                     #
 # By Askil         	     #
 #############################
 opening_event_sarradon_1298.2.t: "Благоразумный фанатик"
 opening_event_sarradon_1298.2.desc: "Заоран говорит со мной в грохоте сходящихся армий, в воплях нечестивых. Мир — это холст божественного гнева, а я — кисть! Я слышу лишь праведный рев Его Голоса, требующий отбросить тьму! Слишком долго наш народ заблуждался, завлеченный елейной ложью шарлатанов. Каждый враг, каждая БОГОХУЛЬНАЯ МРАЗЬ — это гноящийся, гниющий нарыв, который нужно ВЫРЕЗАТЬ! Я чувствовал это, славу, ЭКСТАЗ Его силы, бурлящей во мне, пока их ложь рассыпается в прах под моими ногами!\n\nСинод приказал мне готовиться. Вскоре лживый пророк хиксартийцев будет заставлен замолчать, а нечестивые будут очищены с этой проклятой земли. Я — БУРЯ! СУД! ПОТОК СВЯЩЕННОГО ОГНЯ, НИСПОСЛАННЫЙ, ЧТОБЫ СМЫТЬ ГРЕХИ ЭТОЙ ЭПОХИ! Я не остановлюсь. Я НЕ МОГУ ОСТАНОВИТЬСЯ! Пока каждая пядь этого жалкого мира не склонится перед Его абсолютной волей или пока мой собственный очищенный труп не ляжет триумфально на пепле творения!"
 opening_event_sarradon_1298.2.a: "МИР СГОРИТ ВО СЛАВУ ЗАОРАНА!"
 
 #############################
 # Arderith                  #
 # By Askil         	     #
 #############################
 opening_event_sarradon_1298.3.t: "Рука праведников"
 opening_event_sarradon_1298.3.desc: "Я все еще помню мирное время во времена правления Пейджмана, когда я был еще совсем ребенком. Когда мне исполнилось 15, я вступил в армию мелкого правителя рядовым солдатом, а к 24 годам стал бывалым наемником. Я не знал этого тогда, но я уже потерял себя, сносимый по течению в мире бесконечного конфликта. А когда тот проклятый лжепророк забрал мою семью, я обратился в ничто — отчаявшуюся душу без цели. Я блуждал по раскаленным солнцем улицам Кум Кале, как призрак среди живых, уверенный, что мой конец близок. Но затем меня нашел тахкедараский фразан. В его словах я обрел ясность божественного света Заорана. Я увидел праведный путь, который предстояло прорубить сквозь обман этого павшего мира.\n\nТеперь я — оружие в руке Заорана, Первейшая Рука Веры, связанный с Его волей через Синод. Мы искореним ереси, пустившие корни, как бы глубоко они ни отравили землю и как бы свирепо их последователи ни цеплялись за свою ложь. Триумф Заорана неизбежен. Такова воля Обладателя Ста Добродетелей, справедливого и милосердного, и я — Его инструмент."
 opening_event_sarradon_1298.3.a: "Во славу Заорана!"
 
 ##############################
 # Ielih                      #
 # By Askil         	      #
 ##############################
 opening_event_sarradon_1298.4.t: "Тень на ее отсутствии"
 opening_event_sarradon_1298.4.desc: "Снова и снова я вижу сон, поглощающий мои ночи и дни, и хотя я не проживала его наяву, я знаю, что все было именно так. Я вижу прекрасное лицо Ариши, поворачивающееся ко мне прямо перед тем, как мир взрывается белой тьмой. Моя душа кричит, жаждя ее объятий, ее близость связывает воедино мои рассеянные мысли. Она погибает в нем, она погибает, зовет и умоляет меня вытащить ее из вечной клетки. Я знаю, что она не направится к Байзар Мана, пока ее цель не будет исполнена.\n\nМне нужно, чтобы наш народ сохранил веру в нее еще ненадолго. В последнее время они начали избегать врат, где она лежит. Они говорят, что ее место за гранью, они думают, что это оскорбление порядка Того, Кто Превыше Всех. Они не понимают. Они никогда не понимали ее.\n\nПод руководством Анимейста они удерживают ее тело в том неподвижном, как лишайник, промежуточном состоянии, но его знания ограничены. Она ждет. Она так близко. Я должна вернуть ее."
 opening_event_sarradon_1298.4.a: "Но мое время истекает."
 
 ##############################
 # Tebouin                    #
 # By Askil         	      #
 ##############################
 opening_event_sarradon_1298.5.t: "Просто еще один купец"
 opening_event_sarradon_1298.5.desc: "Да, я сказал им ровно то, что они хотели услышать. Что торговля удвоится, а порты никогда не будут спать. Они посмотрели на меня, человека, чье семейное дело было на грани разорения, и увидели отчаявшегося простого торговца, который будет им обязан всем. Марионетка, я? Которую легко призвать к порядку, как только грязная работа будет сделана? Безамбициозные дураки, все до единого. Теперь люди выстраиваются вдоль улиц моей собственной столицы: наемники в полированных кольчугах, [Concept('marchers','шевальенцы')|E], гоняющиеся за фортуной, шевальенские и амсарские владыки, прикусывающие языки, когда я называю свою цену.\n\nКомпания? Они все еще думают, что создали меня. Я сбился с счета, сколько писем, полных угроз и обещаний, они мне прислали. Я даже перестал отправлять отчеты, а они все равно присылают корабли. Я построил нечто более грандиозное, чем всё, что они смели себе представить, и ни один человек, ни принц, ни пророк, ни купец по эту или по ту сторону моря никогда у меня этого не отнимет."
 opening_event_sarradon_1298.5.a: "И это только начало..."


 ##############################
 # Damiane                    #
 # By Skootstreeter           #
 ##############################
 opening_event_sarradon_1298.6.t: "Последний орден"
 opening_event_sarradon_1298.6.desc: "$harthah_link$ Хартах ибн Саррадон#! разгромил мои братские ордена в [Concept('saints_war','Войне Святых')|E], сбросив многих из нас в море. Лишь милостью Святых и Чистейшего я смогла остановить стремительный крах [GetTitleByKey('k_bleeding_martyr').GetNameNoTier] перед лицом наступающих саррадонских орд. Даже после смерти ибн Саррадона прилив насилия против агионистов едва ли ослаб. Худийские близнецы, разбойничьи владыки, укутанные в кровавое тряпье своей ложной религии, осадили мои земли и вырезали мой народ, и были отброшены назад за границу лишь после того, как [GetScriptedCharacterByHistoryID('hudi_yugaug_7').GetFirstName] сгинул от дозы Aqua Thysia. Теперь второй близнец жаждет мести, и я с радостью предоставлю ему такую возможность.\n\nЯ — последняя магистр ордена хоть какого-то значения в [Concept('sarradon','Саррадоне')|E], последний оплот агионизма на этом проклятом богами континенте. В своей правой руке я держу исцеляющую чашу $saint_thysia_link$ Святой Тисии#!. В левой руке я держу меч.\n\nЭто последние дни агионизма в Саррадоне. орден Истекающей Кровью Мученицы прольет наши жизни на страницы истории."
 opening_event_sarradon_1298.6.a: "Чашей или Мечом, да будет так!"


 ##############################
 # Kadar                      #
 # By Askil         	      #
 ##############################
 opening_event_sarradon_1298.7.t: "Дитя пустыни"
 opening_event_sarradon_1298.7.desc: "Сон стал упрямым делом. Моя луна-и-тень [wife.GetFirstName] говорит, что я ворочаюсь и бормочу по ночам громко, как верблюжьи копыта по камню. Она спрашивает, что меня тревожит, а я мало что говорю ей. Какой ответ я мог бы дать? Я просыпаюсь со словами на губах, которых сам не понимаю. Я не мистик, не мудрый старец. Я — сын пустыни.\n\nИ все же сны не прекращаются. Когда мне было семь лет, налетела великая песчаная буря. Говорят, духи защитили меня и вернули целым и невредимым к моему народу. Я всю жизнь кивал этой истории. И все же я помню, как песок поглощал меня, как я медленно задыхался под дюнами. Я помню его присутствие, то, как умирал, а затем просыпался.\n\nГодами я хоронил это воспоминание и мало о нем думал. Теперь оно возвращается ко мне еще отчетливее. Я вижу великие темные пальмы, пьющие из земли, укрывающие всё вокруг, а затем больше не вижу их. Почему я слышу слова о вещах, которые видели только дети Мармала, на которые старейшины старейшин взирали в другое время и в другом месте? Мой народ блуждал по пустыне поколениями без счета. [Glossary('Нхал-Сараат','GH_NHAL_SARAAT_GLOSS')] принадлежит старым песням и более древним воспоминаниям.\n\nИ все же с каждой прошедшей ночью я оказываюсь все больше увлечен этим."
 opening_event_sarradon_1298.7.a: "То, что было двумя морями, теперь одно."


 ##############################
 # Eohar                      #
 # By Deadr0x         	      #
 ##############################
 opening_event_aironoi_1298.1.t: "Сокол среди сорок"
 opening_event_aironoi_1298.1.desc: "Время от времени я вспоминаю свое детство в последние годы [Concept('sjalvolki_migration','Великого переселения')|E]. Тогда все было честнее, ближе к своей сути. Люди сражались, люди проливали кровь, а выжившие забирали добычу завоевателей. И все же, что насчет их дочерей и сыновей?\n\nСлабые! Мягкие! Жалкие! И изнутри, и снаружи недостойные рвутся и вожделеют не по своему чину, жаждящие крох, но хотящие всего мира. Неужели они, как мой глупый брат, не видят, насколько они немощны, насколько жидка их кровь? Неужели они не боятся стремительности клинка, идущего к их шеям?\n\nПусть расколотые [GetCulturePillar('heritage_sjalvolki').GetCollectiveNoun] ссорятся и бранятся из-за своих новых ферм, богов и догм; пусть последние отбросы [Concept('aversaria','Аверсарии')|E] дрожат за горными перевалами и спорят на костях своей мертвой империи; пусть ольтены на побережье собирают свои войска для возмездия — мечи и стрелы моих [Glossary('орзопаядов','GH_ORZOPAJA_GLOSS')] придут за всеми ними со временем."
 opening_event_aironoi_1298.1.a: "Неважно, будут ли они сражаться или споткнутся, их конец будет один."

 opening_event_aironoi_1298.2.t: "Суть дела"
 opening_event_aironoi_1298.2.desc: "Есть множество вещей, которых я не понимаю в других людях. Почему они не могут говорить прямо о том, что у них на уме? Почему они должны бороться до самого горького конца в неповиновении — вдвойне глупо, когда простое подчинение избавило бы их от такой боли и страданий?\n\nЯ задаю эти вопросы себе и другим, когда сшибаю врагов вместе со своими сестрами; я задавала их бесчисленное количество раз несчастным и угнетенным, которых отправляют ко мне, чтобы спрятать от неба и солнца; я задавала их [GetScriptedCharacterByHistoryID('sarminians_salacad_16').GetFirstName], когда приводила в исполнение [GetScriptedCharacterByHistoryID('sarminians_salacad_16').GetHerHis] наказание.\n\nПо правде говоря, я ничуть не против задавать эти вопросы. Каждый ответ, который я получаю, счищенный с непокорных сердец после того, как слои кожи, фальши и елейной лжи отброшены в сторону, приближает меня к поиску последнего кусочка, который наконец сделает меня цельной."
 opening_event_aironoi_1298.2.a: "Если бы я была неправа, почему песни, которые они поют, так манили бы меня?"

 opening_event_aironoi_1298.3.t: "Проблемы длиной в жизнь"
 opening_event_aironoi_1298.3.desc: "Ну и что, если немного золота нашло дорогу обратно в мои сундуки? Ну и что, если какого-то незудачливого конюха раздавила сгнившая балка — я не плотница, откуда мне было знать? Я видела, как мои сестры делали куда больше и куда хуже, так почему именно меня выбрали из-за чего-то столь совершенно банального?\n\nНи одна из них не слушала, и ни одной из них не было дела. Если я претендую на равенство с одним из [Glossary('орзопая','GH_ORZOPAJA_GLOSS')], как мне сказали, я должна быть готова к соответствующему наказанию. Переданная [GetScriptedCharacterByHistoryID('sarminians_salacad_15').GetFirstName], моя собственная [GetTrait('twin').GetName( GetNullCharacter )|l] с радостью клеймила меня как [Concept('anohelis_outcasts','анохелиса')|E] и изгнала меня, не взирая на мои слова и доводы.\n\nИ вот я здесь, несчастная и одинокая, лишенная прав и чести. Не может быть, чтобы я чувствовала страх, значит, это должна быть злость. Однажды они пожалеют о том, что сделали. Однажды они окажутся на моем месте."
 opening_event_aironoi_1298.3.a: "Я #EMP обязательно#! вернусь, клянусь."
 opening_event_aironoi_1298.3.b: "К демонам их косы, традиции и все остальное; я ухожу."

 opening_event_aironoi_1298.4.t: "Правители и подданные"
 opening_event_aironoi_1298.4.desc: "Лишь по чистой случайности я оказалась при дворе [GetScriptedCharacterByHistoryID('daukeni_sjalvolki_1').GetNickname]#L#! в [GetTitleByKey('c_oraispol').GetNameNoTier] в тот день, когда [GetScriptedCharacterByHistoryID('pactlander_banstur_1').GetFirstName]#L  #![GetScriptedCharacterByHistoryID('pactlander_banstur_1').GetHouse.GetName] выступила в защиту прав [GetCulturePillar('heritage_sjalvolki').GetName]их женщин. Было весьма странно для человека моего положения видеть подобные аргументы, высказанные в противоположность тому, что было лишь маргинальной мыслью дома в [GetTitleByKey('k_szamazonas').GetNameNoTier]. Несколько придворных продолжали коситься в мою сторону, без сомнения, опасаясь нанести оскорбление [ROOT.Char.GetCulture.GetName]ой посланнице, не ведая о различиях между их женщинами и [Glossary('орзопаядами','GH_ORZOPAJA_GLOSS')].\n\nИ все же старая [GetScriptedCharacterByHistoryID('pactlander_banstur_1').GetWomanMan] говорила, и говорила хорошо. Я видела размышления и внимание, которые $emperor_male_kholmvolki$ уделял [GetScriptedCharacterByHistoryID('pactlander_banstur_1').GetHerHis] рассуждениям, и не могла не начать считать про себя, что можно было бы сделать с удвоенным числом ремесленников, удвоенным числом солдат. Это была крайне трезвящая мысль — представить, что другие народы и королевства вдруг станут в два раза могущественнее за одну ночь.\n\nЯ покинула [GetTitleByKey('c_oraispol').GetNameNoTierNoTooltip] на следующее утро, неспокойная и задумчивая. Наше текущее положение сильно, но другие все еще могут опередить нас. Мы уже так многое изменили; так что значит еще одно изменение?"
 opening_event_aironoi_1298.4.a: "Так или иначе, мы не останемся позади."

 opening_event_aironoi_1298.5.t: "На службе у Вардена"
 opening_event_aironoi_1298.5.desc: "Я не тот [ROOT.Char.GetWomanMan], каким меня считают другие, и не тот, кому [ROOT.Char.GetFaith.HighGodName|l] доверил [ROOT.Char.GetFaith.HighGodHerHis|U] праведный мятеж все эти десятилетия назад. Как я могу претендовать на то, чтобы быть [ROOT.Char.GetFaith.HighGodHerHis|U] чемпионом, со всей той кровью, что я пролил, со всеми клятвами, что я нарушил? Люди помнят только победителей, а не жертв, каковой бы праведной ни была их жертва.\n\nИ все же я поступил бы так же снова, если бы пришлось. От $holy_site_hill_of_the_golden_saint_aruvasue_name$, где я предал последних из [GetScriptedCharacterByHistoryID('jarakmar_ertomax_16').GetHouse.GetName]#L#! и поднял знамя Королевы Героев, до $holy_site_glass_temple_aruvasue_name$ и дальше, где были побеждены последние [Concept('aversaria','аверсарианские')|E] остатки — [GetCulturePillar('heritage_kherkeloi').GetCollectiveNoun] обрели свободу.\n\nВ конце концов, под тяжестью возраста и угасающего тела, я все еще не могу поделиться своими сомнениями с теми, кто равняется на меня, даже со своей собственной женой и детьми. Только [GetScriptedCharacterByHistoryID('zelkavani_sarmuyr_2').GetFirstName] и покойный [GetScriptedCharacterByHistoryID('jarakmar_ertomax_8').GetFirstName] знают о преступлениях, которые мы совершили на нашем пути, за которые [ROOT.Char.GetFaith.HighGodName|l] будет судить нас в загробной жизни."
 opening_event_aironoi_1298.5.a: "Спасение ли это будет или проклятие, я поистине не знаю."

 opening_event_aironoi_1298.7.t: "Мальчик, ставший мужчиной"
 opening_event_aironoi_1298.7.desc: "Выросши уличным оборванцем, я не могу точно сказать, сколько мне было лет, когда вся моя жизнь изменилась. Должно быть, это была чистая глупость — или божественное провидение, — которая заставила меня повернуться спиной к разношерстной банде разбойников и бандитов, частью которой я был, и помочь группе безнадежных искателей приключений сбежать. Я присоединился к ним тогда скорее от отчаяния и голода, чем от искреннего желания компании, и слушал, как они говорили о своей тогда еще странной богине, пока они давали мне хлеб и кров.\n\nМне потребовалось несколько лет, чтобы понять, но я обрел свою семью в тот день. Сквозь все невзгоды и с благосклонным руководством [ROOT.Char.GetFaith.HighGodName|l] мы освободили народ и землю от развращенных и недостойных, от тьмы и отчаяния. Теперь мой долг — защищать эту свободу, как я и сделал, подавив кровавый мятеж [GetScriptedCharacterByHistoryID('jarakmar_ertomax_20').GetFirstNameNicknamed].\n\nЯ прошел долгий путь — от безымянного ребенка до [ROOT.Char.GetTitleAsNameNoTooltip] в [ROOT.Char.GetCapitalLocation.GetName]. К этому моменту я не боюсь ни битвы, ни клинка у моей шеи; единственное, что меня пугает — это быть недостойным доверия и ответственности, возложенных на меня."
 opening_event_aironoi_1298.7.a: "Я не жажду никакой славы, кроме славы моего долга."
 
 ##############################
 # Unwan                      #
 # By Grand Monkey Marshal    #
 ##############################
 opening_event_opakhasia_1298.1.t: "Наследие Десяти деревьев"
 opening_event_opakhasia_1298.1.desc: "Я родился в первых походах самого [GetScriptedCharacterByHistoryID('daukeni_sjalvolki_1').GetNickname]#L#!, я возмужал в дни после падения [GetTitleByKey('k_palitake').GetNameNoTier], я был вылеплен, чтобы стать его лучшим солдатом. И теперь Ценвар мертв, мои победы и слава против [GetScriptedCharacterByHistoryID('southernimperial_aversarian_gorassos_1').GetNickname]#L#! и его проклятых соратников уходят в историю, а труп [Concept('aversaria','Аверсарии')|E], который я помогал хоронить, ворочается вновь. Я вижу это в моих скромных землях, в моем скромном народе.\n\nНе эти была судьба солдата! Я сражался за дело, я сражался за героев! Я так долго ждал обновленного дела, новой славы от руки с клинком. Мое терпение было вознаграждено: наш Конклав дал мне обряд, которому я должен следовать ради моего истинного «я», а его противоречие с этими гоняющимися за монетами [Concept('marchers','марочниками')|E] дало мне повод поднять свой клинок.\n\nПозиция марочников в том золотом дворце, который они захватили, сильна, их сталь суровее, их казна полна. Все больше, чтобы сделать их высокомерными и неготовными перед лицом истинной [GetCulturePillar('heritage_sjalvolki').GetName]ой выдержки!\n\nИнтересно, однако, такой ли жизни хотели для меня родители, когда они бежали вместе с Сокрушителем Ведьм?"
 opening_event_opakhasia_1298.1.a: "Я никогда не был у Десяти деревьев, и все же моя судьба была решена там."


 #############################
 # Beksultan of Sas Nattana  #
 # By Aidan                  #
 #############################
 opening_event_kashirya_1298.1.t: "Избранник Аккарадхаммы"
 opening_event_kashirya_1298.1.desc: "Черный Вихрь предал меня, изгнав за совет уничтожить отсталый наттананский народ. Ему надоела война, поэтому он поручил своим слугам убить меня, когда я ехал по равнинам. Смертельно раненного, мой конь — да дарует ему Аккарадхамма покой — принес меня глубоко под землю к тюрьме моего господина. Я был схвачен его слугами и предстал перед печатью для суда. Аккарадхамма предсказал необходимость Бледного Всадника вновь и счел меня достойным. Он предупредил, что надевание маски дарует мне все знания ее прежних владельцев, но привяжет меня к его воле. Я счел его куда более достойным богом, чем Арлихана, поэтому согласился.\n\nС того великого и славного дня я отомстил, сразив Чёрного Вихря и подчинив себе свой народ. Я отправил множество слуг дестабилизировать регион, тем самым выполняя свою задачу. Аккарадхамма поручил мне уничтожить поклонников Богов-Близнецов и Корлаку и приготовить путь для его возвращения, и я сделаю это с радостью."
 opening_event_kashirya_1298.1.a: "Наттанан сгорит"

############
# Radjavil #
# By Grey  #
############
 etepezea_opening_event_1298.2.t: "Краль в змеином логове"
 etepezea_opening_event_1298.2.desc: "Во времена моего отца быть кралем было просто. Ему никогда не приходилось бояться того, о чем шептались за его спиной, потому что одного его имени было достаточно, чтобы заставить их всех встать в строй. Он был «Сокрушителем Ведьм», Рехралем, победителем при Перевале — королем, против которого никто не смел выступить.\n\nИ все же, когда он скончался, я не унаследовал королевство верных вассалов и благоговейных подданных, которыми он правил. Нет, моим единственным наследством стало то, что меня бросили в змеиную яму. Я слышу, о чем они шепчутся — что я лишь бледное подражание своему отцу, что я недостоин его короны.\n\nПредатели, все до единого! Я — Раджавиль, первенец Сокрушителя Ведьм! Все, что было его — мое право по рождению! Подобно тому как он сорвал [Glossary('красных магов','GH_RED_MAGI_GLOSS')] с их великих башен, я сброшу каждого ничтожного негодяя, который посмеет выступить против меня!"
 etepezea_opening_event_1298.2.a: "Если они не будут уважать меня, они научатся бояться меня."

############
# Vezlomir #
# by TOG   #
############
 etepezea_opening_event_1298.3.t: "Что же делать?"
 etepezea_opening_event_1298.3.desc: "Отец однажды сказал мне, что каждый может творить свою судьбу, но лишь мудрые могут делать это свободно. И вот теперь я лежу на плещующихся берегах Вожвыстроя, пью, развратничаю и уткнувшись носом в старые фолианты, абсолютно не уверенный в том, могу ли я сотворить свою собственную. Кто я без своего отца? Мои братья не хотели ничего больше, кроме как встать на его место, и когда каждый из них забирает себе по роли, где это оставляет меня?\n\nДолжна быть какая-то правда, которую я упускаю, и, возможно, эти друиды помогут мне ее раскрыть."
 etepezea_opening_event_1298.3.a: "Должно же что-то быть!"

#####################
# Tarshayn Muhaddad #
# by Mayor          #
#####################

 opening_event_sarradon_1298.8.t: "Надежда, сокрытая во тьме"
 opening_event_sarradon_1298.8.desc: "Катастрофа.\n\nДом моей семьи в руинах, выжженный до самого основания злой магией. Быть может это дело рук этого мерзкого язычника $parshad_the_black_link$ Паршада#!? Разумеется, он сваливает вину на меня и моих собственных [Concept('magi','магов')|E], словно кто-то поверят в это, но чего еще ожидать от отступника-[Concept('ritualism','ритуалиста')|E]. Каждое обвинение — лишь признание собственной вины; мы укажем ему и его сброду их законное место достаточно скоро.\n\nЧто хуже, другой главный кандидат на этот злодейский титул убийцы $el_qulatha_link$ Эль-Кулаты#! — еще одной жертвы в его и без того переполненном списке — зализывает раны на севере. Жирная, злая жаба, сидящая на корточках с остатками своей армии. Повешения слишком мало для таких военачальников, как он, но мы, скромные слуги Божественного Закона, должны довольствоваться теми инструментами, что есть в нашем распоряжении.\n\nИ вокруг кружит еще больше волков. Предательские горные варвары резвятся на руинах прекрасных городов, обращая верующих в бегство. Мятежники таятся за каждым углом — гнездо гадюк и яда. Больнее всего слышать новости о самозванце, выдающем себя за мою убитую родню. Всего этого достаточно, чтобы человек усомнился в собственном предназначении.\n\n[Glossary('Эсенгровы камни','GH_ESENGRA_GLOSS')], какую катастрофу я унаследовал. Невиданную в истории нашей самой священной веры, соперничающую, возможно, с самой ужасной [Concept('the_decimation_of_sarradon','Децимацией')|E]? Еще нет, и она никогда не станет таковой, если я смогу этому помешать. Разве [Concept('the_first_warden','Варден')|E] не призывает решительных людей выйти вперед в самый темный час, чтобы вести верующих к безопасности?"
 opening_event_sarradon_1298.8.a: "«Новый $mamur_tathtali_link$ Татхтали#!» звучит весьма неплохо, не правда ли?"

#######################
# Parshad 'the Black' #
# by Mayor            #
#######################

 opening_event_sarradon_1298.9.t: "Наше время, наконец-то"
 opening_event_sarradon_1298.9.desc: "Как было предсказано, так и свершилось.\n\nОни молили меня о помощи против узурпатора, и я дал ее с радостью. Это их слабые маги, скованные [Concept('wardenism','варденитской')|E] глупостью, и тот идиотский принц-гробокопатель оказались неспособны удержать силу, призванную на то место. Словно дети, играющие с раскаленным железом в комнате, полной хвороста. Какая глупость, какое разрушение; хоть это и не входило в мои намерения, это отлично служит моим целям.\n\nСлабость так называемых судей стала их погибелью, и теперь их престол лежит в руинах, их короны разбиты о землю, пока воющие варвары скачут сквозь их храмы. Цена, уплаченная за тысячелетие слабости, чистого нераскрытого человеческого потенциала, запряженного в глупость жалких писцов. Вардениты все еще борются, но они будут как ягнята перед ножом. Земля $four_rivers_link$ Четырех Рек#! станет моей, и с ее богатыми щедротами рабов и крепостных я протяну руку и захвачу сам горизонт."
 opening_event_sarradon_1298.9.a: "Я тянусь к [GetBuilding('01_sophocos').GetName]у. Трон для истинного царя, бога для новой эры."

###################
# Obarek A'Bashik #
# by Mayor        #
###################

 opening_event_sarradon_1298.10.t: "Всего лишь неудача"
 opening_event_sarradon_1298.10.desc: "Мятежники, крестьяне-идиоты, собачьи полукровки из горных племен. Я поднялся к силе из слабости, переступив через тела разнеженных бюрократов и дворцовых писцов. Неужели они не понимают?\n\nУстройство мира — это сила против силы. $muhaddad_link$ Мухаддады#! пришли из силы, но они притупились, а поскольку власть вытекает из силы, они встретили свой конец. Позволить им продолжать увядать лишь ослабило бы государство еще сильнее — нет, это должно было свершиться мечом. Только слабые плачут о слабых и отказываются принять свое место в порядке, навязанном сильными. Я признаю свою собственную слабость: мне следовало убить больше из них во время чисток. Когда у меня была возможность сделать это легко.\n\nОни забывают, что [Concept('wardenism','варденизм')|E] был выкован войной и конфликтом. На нашей вере слишком долго паразитировали книжники и бездельники. Я — воплощенный дух самого [Concept('great_uprising','Великого восстания')|E]. Я — меч и копье на кровавом поле. Я — огонь, выжигающий ложь неверного. Я — меч палача, несущийся к шеям виновных."
 opening_event_sarradon_1298.10.a: "Они думают, что зверь загнан в угол. Горе им, зверь уже на них набросился."

#######################
# Bahir ibn Sarradon  #
# by Mayor            #
#######################

 opening_event_sarradon_1298.11.t: "Уважение, которое мне причитается"
 opening_event_sarradon_1298.11.desc: "Разве я не сын своей матери?\n\nРазве кровь $harthah_link$ Хартаха#!-спасителя не течет в моих жилах?\n\nИ все же меня игнорируют. Мой собственный совет прислушивается к моей тетке — злой, злобной женщине. Каждая просьба, каждая инициатива подвергается сомнению, увиливанию и передается этой надвигающейся карге на утверждение. Или просто игнорируется вовсе! На самом деле, это почти узурпация. Нет, нет, не почти. Это абсолютная узурпация. Нельзя так обращаться с принцем королевской крови.\n\nЭто несправедливость. Простая и очевидная! Мое право по рождению, сама моя судьба отрицаются мне. Это заставляет мою кровь кипеть. Да я мог бы прямо сейчас кого-нибудь ударить! Может, так и сделаю."
 opening_event_sarradon_1298.11.a: "Где тот косолапый слуга?"

######################
# Hanna ibn Sarradon #
# by Mayor           #
######################

 opening_event_sarradon_1298.12.t: "О, не будь таким мрачным, Иштабим"
 opening_event_sarradon_1298.12.desc: "О [prisoner.GetFirstName], бедный ты дурак.\n\nЯ думала, наш отец лучше подготовил бы тебя к трону. Когда я и [GetScriptedCharacterByHistoryID('tasurmad_harthahi_15').GetFirstName] впервые начали ощупывать твой совет на предмет слабостей, мы думали, что это наконец подтолкнет тебя к действию. Ничего подобного, и когда слухи о перевороте начали всерьез кружить, это лишь заставило тебя еще больше уйти в нерешительность и лабиринт горькой паранойи. Помнишь, что ты сделал? Из всего, что ты мог сделать, ты приказал казнить главного крысолова! Это сбивает меня с толку и по сей день. Нет, не утруждайся объяснениями, ты уже пробовал раньше, и я знаю, что ответ меняется каждый раз.\n\nПо правде говоря, я думаю, что холодная определенность домашнего ареста для тебя лучше. Никакого выбора, достойного того, чтобы хотя бы начать сомневаться в себе. Может быть, однажды ты увидишь это именно так.\n\nЧто ж, хватит зацикливаться на прошлом. Давай смотреть вперед, ты и я.\n\nБумаги копятся день за днем: реквизиционные приказы, купеческие запросы, гильдейские споры, прочие мелочи. Мой маленький уголок семейного владения — изобильный и старинный город красоты и увядшего великолепия, когда-то годившийся на роль жемчужины империи. Однажды он снова засияет, и судьи, писцы и купцы будут взирать на него и восклицать: «О, как нам всем повезло, что [ROOT.Char.GetFaith.GetName]ая вера породила такую женщину, как Ханна!»\n\nТвердая рука снова на руле, прямо как у отца. Тебе не кажется, что наш дедушка гордился бы нами?\n\nУлыбнись, Иштабим. Ты должен быть счастлив."
 opening_event_sarradon_1298.12.a: "Правда."