l_russian:
 cois.0001.t:0 "Завоеватель или спаситель?"
 cois.0001.desc:0 "[attacker.GetTitledFirstName] приближается к моим землям, и [attacker.GetHerHis] намерение ясно — взять [GetTitleByKey('c_oraispol').GetNameNoTier] и нанести удар, который [Concept('aversaria','Аверсария')|E] никогда не забудет, если она вообще проживет достаточно долго, чтобы что-то помнить. Настроение при дворе мрачное, и некоторые уже обсуждают свои места в мире после [attacker.GetFirstNamePossessive].\n\nОт меня ждут воодушевляющей речи, полной банальностей, обращенной к солдатам, в которой я буду врать им, что этот бой еще не проигран, а затем меня вернут в заключение. Но разве он не проигран? И почему меня должен волновать этот гнилой двор, который удерживал меня в плену столько лет?\n\nЕсли правление выглядит именно так, то даже рабство у варвара может оказаться лучше..."
 cois.0001.a:0 "Я тайком выберусь из дворца ночью и направлюсь к [attacker.GetFirstName]у."
 
 cois.0002.t:0 "Король-нищий"
 cois.0002.desc:0 "Пока тянется дождливая ночь, стражники внезапно сообщают мне, что прибыл проситель, добивающийся аудиенции и называющий себя «правителем [Concept('aversaria','Аверсарии')|E]». Я с ходу искушен выгнать этого мошенника, но любопытство берет верх, и я маню [aversarian_mercy_requester.GetHerHim] предстать передо мной.\n\nТо, что следует далее... весьма забавная история. Похоже, это действительно [aversarian_mercy_requester.GetTitledFirstName], и [aversarian_mercy_requester.GetSheHe] пришел просить о подчинении в обмен на жалкий клочок земли неподалеку от своего бывшего столичного города."
 cois.0002.a:0 "Неужели среди вас нет ни одного честного человека, аверсарианец?"
 cois.0002.b:0 "Мне не нужно королевство, дарованное шутом. Стража, схватить [aversarian_mercy_requester.GetHerHim]!"
 
 cois.0003.t:0 "Свобода наконец?"
 cois.0003.desc:0 "Я прибываю ко двору [attacker.GetTitledFirstName] в грязи и капюшоне, едва уклонившись по пути сюда от прислужников, посланных вернуть меня в [GetTitleByKey('c_oraispol').GetNameNoTier]. Когда меня приводят к [attacker.GetFirstName], а [attacker.GetHerHis] стражники поначалу смеются над моим ответом о том, кто я такой, [attacker.GetSheHe] оглядывает меня с ног до головы. После того как я убеждаю [attacker.GetHerHim], что я не самозванец, а настоящий [ROOT.Char.GetFirstName], воцаряется минута молчания — а затем [attacker.GetSheHe] и вся [attacker.GetHerHis] свита взрываются хохотом. Некоторые из них определенно смотрят на меня с отвращением.\n\n«Молчать!» — приказывает [attacker.GetFirstName] и затем излагает мою судьбу. Поскольку я был не более чем пешкой в махинациях «моего» двора, меня не накажут. Естественно, моя роль Аавтократа заканчивается с этой самой минуты — не то чтобы она вообще когда-либо была настоящей. Мне позволят сохранить поместье в Палитаке, хотя мне запрещено впредь вмешиваться в политику."
 cois.0003.a:0 "Всё было к лучшему."
 
 cois.0004.t:0 "Конец или новое начало?"
 cois.0004.desc:0 "Меня приводят к [attacker.GetTitledFirstName] в цепях, пока [GetTitleByKey('c_oraispol').GetNameNoTier] горит вокруг меня. Я держался храбро, но напрасно — город все равно пал, и я вот-вот лишусь головы. Когда меня бросают к ногам завоевателя, [attacker.GetSheHe] смотрит на меня, и [attacker.GetHerHis] взгляд едва уловимо выдает... жалость? Сказано несколько тихих слов, и меня увозят в карете, непременно на гибель.\n\nНедели проходят в этой проклятой карете, прежде чем я снова вижу дневной свет. Свежий запах сосен отчетливо не похож ни на что из того, что было в Этепезее. Вокруг меня возвышаются зубчатые горы, сужаясь вдали в узкий перевал. Хотя трудно разглядеть, что лежит за ним, мне становится неуютно от одного лишь взгляда в том направлении. Вскоре прибывает и моя семья.\n\nГде я?"
 cois.0004.a:0 "Должно быть, это самый край Эраса!"
 
 cois.0005.t:0 "Разбитая надежда"
 cois.0005.desc:0 "Пока мое эпическое противостояние с [attacker.GetFirstName]ом продолжает затягиваться, ни один из нас не может одержать решающий верх над другим. Происходят мелкие стычки, захватываются города, но кульминационная битва, перед которой всё Расколотое побережье затаило дыхание, еще впереди.\n\nДо сегодняшнего дня.\n\nВступив в бой с небольшим войском сьялволков в схватке, казавшейся гарантированной, но незначительной победой, я осознал всю тяжесть своей ошибки — мы заперты в долине без возможности сбежать. И действительно, [attacker.GetFirstName] приводит свой план в действие в тот самый момент, когда я понимаю, что происходит. Пока мы окружены со всех сторон, а солдат вокруг меня вырезают, я задаюсь вопросом — неужели всё было напрасно? Был ли я действительно лучшим, что могла предложить [Concept('aversaria','Аверсария')|E]?"
 cois.0005.a:0 "Я умру так же, как родился — в грязи. Но меня никогда не забудут."
 
 cois.0010.t:0 "Чудо при [battle_county.GetNameNoTierNoTooltip]"
 cois.0010.desc:0 "Вчера я лег спать пешкой. Сегодня я встаю королем и героем. То, что считалось совершенно абсурдным, оказалось возможным при [battle_county.GetNameNoTierNoTooltip], где я вошел в чрезвычайно редкие ряды тех, кто успешно одолел [attacker.GetFirstNamePossessive] в битве. Большинство военачальников Этепезеи решили сделать ставку на меня — то ли из искреннего благоговения, то ли из простого прагматизма. В то время как [GetTitleByKey('c_oraispol').GetNameNoTier] месяцами готовился к суровым реалиям разграбления варварской армией, теперь они знают лишь кутеж и празднества.\n\nЯ возвращаюсь в город под цветы и прострации, бросаемые к моим ногам, а мои подданные впервые по-настоящему ведут себя так, будто они мои. Пока меня несут обратно в мой дворец под ликующие крики толпы, две вещи несомненны. Во-первых, мои бывшие тюремщики больше не смогут держать меня под замком, но они определенно теперь видят во мне угрозу. Хотя они могут временно отложить наши разногласия, чтобы победить Ценвара, после этого все ставки будут сняты. Во-вторых, [attacker.GetFirstName], возможно, и ранен, но [attacker.GetSheHe] точно не повержен. Имперрех вернется — и на этот раз они будут готовы. То, что произойдет дальше, определит, стану ли я легендой или потеряю всё."
 cois.0010.a:0 "Мы должны готовиться к грядущей буре."
 
 cois.0011.t:0 "Дело Чистейшего"
 cois.0011.desc:0 "Когда я был всего лишь мальчиком, чаще всего я воровал у жрецов. Они всегда были самыми жирными и больше всех обвешанными золотом — именно тогда я проникся презрением к вере и понял, что это не более чем яркая ложь, удерживающая угнетенных в повиновении. Это была ложь, которая позволила мне взлететь так высоко, но в которой я больше не нуждаюсь — сегодня это закончится.\n\nЯ приближаюсь к [aversarian_pope.GetFirstName], и мое лицо, скорей всего, выдает мои намерения. Прежде чем у [aversarian_pope.GetHerHis] появится шанс хотя бы спросить, чего я желаю, я приказываю своим стражникам немедленно окружить [aversarian_pope.GetHerHim].\n\n«Так вот как ты платишь нам? Ты был ничем! Ничем, кроме выбившейся в люди уличной крысы!»"
 cois.0011.a:0 "Я тоже не Чистейший, а ты — шарлатан!"
 cois.0011.b:0 "Ты хорошо меня научил. Спасибо."
 cois.0011.c:0 "Я не могу заставить себя навредить тебе, но ты должен покинуть [GetTitleByKey('c_oraispol').GetNameNoTier] навсегда."
 
 cois.0013.t:0 "Враг моего врага"
 cois.0013.desc:0 "Хотя приглашение тех самых сьялволков, с которыми мы сражаемся, на наши земли может показаться неразумным, правда заключается в том, что наше государство лишено бойцов. У моего врага есть преимущество в виде бесконечных орд воинов — то, чего у меня нет.\n\nК счастью, нам удалось нащупать связь с несколькими мелкими вождями, которые были бы готовы расстаться с Имперрехом и сражаться за нас, если мы предоставим им землю в Этепезее. Несколько моих лейтенантов высказались против этого — некоторые более решительно, чем другие. Мне следует взвесить потенциальную пользу и политические последствия."
 cois.0013.a:0 "Открыть ворота."
 cois.0013.b:0 "По зрелом размышлении, это может быть плохой идеей."
 
 cois.0014.t:0 "Запоздалое возмездие"
 cois.0014.desc:0 "Когда мы отправили замаринованную голову [aeschraes.GetFirstName] через проливы на юг, я понимал, что убедить XXI Легион сняться с места и отправиться в Этепезею будет трудно, даже несмотря на подарок. Днями мы ждали, и казалось, будто никакого ответа не последует. Возможно, посланник не добрался?\n\nИ как раз тогда, когда казалось, что желанная помощь никогда не придет, весь легион высадился на юге Аргиры и объявил о своей поддержке! [axiaothea_legon.GetTitledFirstName] уже [Select_CString(axiaothea_legon.IsFemale, 'запросила', 'запросил' )] разрешение на создание новой базы операций в [new_hq.GetNameNoTierNoTooltip] и всерьез начал подготовку к грядущей войне."
 cois.0014.a:0 "По крайней мере, хоть что-то хорошее вышло из моего предшественника."
 
 cois.0015.t:0 "Непрочное перемирие"
 cois.0015.desc:0 "Ответ от Конклава приходит быстро: запечатанное письмо из их главного храма, написанное [conclave_head.GetFirstNamePossessive] собственной рукой. Разумеется, оно продолжает продвигать фарс о [conclave_head.GetHerHis] чистых намерениях и абсолютной верности ко мне, и о том, что такой скромный слуга, как [conclave_head.GetSheHe] сам, может лишь обещать еще больше ревности в борьбе с варварской помехой у наших ворот.\n\nХотя непросвещенному человеку, не знающему [conclave_head.GetFirstNamePossessive] так же хорошо, как я, это может показаться пустыми словами, я прекрасно читаю подтекст и знаю, что сделка состоялась."
 cois.0015.a:0 "Мне это не нравится, но это должно было быть сделано."
 
 cois.0020.t:0 "Битва при [battle_county.GetNameNoTierNoTooltip]"
 cois.0020.desc:0 "После лет нерешительных стычек армии [attacker.GetFirstNamePossessive] и мои роковым образом сошлись при [battle_county.GetNameNoTierNoTooltip] в битве, которая послала ударные волны по всему Расколотому побережью и эхом отзовется сквозь века. Несмотря на то что изначально удача была на стороне моего врага, проницательный солдат сумел заметить тончайший изъян в плане противника. Не имея возможности подтвердить, ловушка это или нет, мы с головой бросились использовать его — и наш триумф был обеспечен.\n\nСилы [attacker.GetFirstNamePossessive] сначала пошатнулись, затем пали духом, попытались бежать и, наконец, были вырезаны. Их Верховный король [attacker.GetName] едва сумел сбежать с несколькими телохранителями, но это не имеет значения. Это поражение разрушило тот контроль, который [attacker.GetSheHe] имел над Имперрехом, и теперь сьялволки больше не объединены.\n\nНаступает новая эра, так как фокус моего правления сместился от простого выживания к восстановлению сильно пострадавшей империи. Моих деяний уже достаточно, чтобы поставить меня в один ряд с величайшими аавтократами, но мое время на троне только начинается."
 cois.0020.a:0 "Впервые за десятилетия будущее кажется светлым."
 
 cois.0030.t:0 "Слабое звено"
 cois.0030.desc:0 "Куда бы я ни повернулся, кажется, повсюду таятся глаза [conclave_head.GetTitledFirstName]. К счастью, хотя [conclave_head.GetSheHe] может быть змеей, не имеющей равных, с [conclave_head.GetHerHis] подчиненными, скорее всего, окажется значительно проще иметь дело.\n\nЧерез надежные источники я узнал, что [scheme_target_character.GetTitledFirstName] потенциально можно устранить из рядов сторонников [conclave_head.GetFirstNamePossessive] — будь то путем привлечения [scheme_target_character.GetHerHis] на мою сторону или... менее приятными средствами. Я мог бы воспользоваться этой возможностью, но если Конклав узнает о моем вмешательстве, последствия могут быть плохими."
 cois.0030.a:0 "Устранить [scheme_target_character.GetHerHis] как угрозу любыми средствами."
 cois.0030.b:0 "Найти компромат, который заставит [scheme_target_character.GetHerHis] уйти из политики."
 cois.0030.c:0 "Возможно, [scheme_target_character.GetHerHis] удастся склонить на мою сторону."
 
 cois.0030.a.success:0 "[scheme_target_character.GetFirstName] успешно [Select_CString(scheme_target_character.IsFemale, 'убита', 'убит' )]"
 cois.0030.a.failure:0 "Покушение провалилось"
 cois.0030.b.success:0 "Я раскрываю скандал, реальный или сфабрикованный, что заставляет [scheme_target_character.GetFirstNamePossessive] покинуть фракцию Конклава и совет, если [scheme_target_character.GetSheHe] [Select_CString(scheme_target_character.IsFemale, 'состояла', 'состоял' )] в нем."
 cois.0030.b.failure:0 "Попытка раздуть скандал провалилась"
 cois.0030.c.success:0 "Я успешно убеждаю [scheme_target_character.GetFirstNamePossessive] покинуть Конклав. В случае успеха [scheme_target_character.GetSheHe] получит [Concept('weak_hook','слабое влияние')|E] на меня."
 cois.0030.c.failure:0 "Попытка переманить провалилась"
 cois.0030.a.undiscovered:0 "Мое участие в заговоре остается нераскрытым"
 cois.0030.a.discovered:0 "[conclave_head.GetFirstName] подозревает меня в соучастии"
 
 cois.0031.t:0 "Слабое звено"
 cois.0031.desc:0 "Успех! [scheme_target_character.GetFirstName] лежит [Select_CString(scheme_target_character.IsFemale, 'мертвой', 'мертвым' )] в луже собственной крови!\n\nКонклав наверняка будет ослаблен внезапной кончиной одного из своих самых могущественных сторонников. Будем надеяться, что [conclave_head.GetFirstName] не сможет выследить убийство до меня..."
 cois.0031.desc.gregarious:0 "Любовь [scheme_target_character.GetFirstNamePossessive] к компании стала [scheme_target_character.GetHerHis] погибелью. Моим агентам удалось подружиться с [scheme_target_character.GetHerHim] и заманить [scheme_target_character.GetHerHis] на небольшой, весьма приватный пир. Излишне говорить, что [scheme_target_character.GetFirstName] [Select_CString(scheme_target_character.IsFemale, 'сочла', 'сочёл' )] их куда менее веселой компанией, когда они вытащили свои кинжалы прямо посреди обеда.\n\n[scheme_target_character.GetTitledFirstName] [Select_CString(scheme_target_character.IsFemale, 'была', 'был' )] довольно харизматичной фигурой в Конклаве, и [scheme_target_character.GetHerHis] смерть наверняка станет ударом по их внутреннему сплочению и популярности среди широкой публики. Однако с тем, насколько многочисленны были [scheme_target_character.GetHerHis] союзники, я могу лишь надеяться, что мое соучастие не будет раскрыто."
 cois.0031.desc.shy:0 "От [scheme_target_character.GetFirstNamePossessive], судя по всему, было не особо трудно избавиться — [scheme_target_character.GetHerHis] любовь к уединению означала, что возможностей нанести удар без свидетелей было хоть отбавляй. На самом деле, [scheme_target_character.GetHerHis] гниющий труп был обнаружен только спустя дни после [scheme_target_character.GetHerHis] фактической смерти, когда он провонял все [scheme_target_character.GetHerHis] поместье тошнотворной вонью.\n\nХотя [scheme_target_character.GetFirstName] [Select_CString(scheme_target_character.IsFemale, 'могла', 'мог' )] и не быть [Select_CString(scheme_target_character.IsFemale, 'одной', 'одним' )] из самых публично выдающихся членов Конклава, [scheme_target_character.GetHerHis] поддержка за кулисами была неоценимой. Мои враги наверняка будут ослаблены [scheme_target_character.GetHerHis] безвременной кончиной."
 cois.0031.a:0 "С каждым днем я все ближе к избавлению от этих назойливых жрецов."
 cois.0032.t:0 "Слабое звено"
 cois.0032.desc:0 "Провал! Будь то из-за неуклюжести моих подчиненных, неожиданной хитрости моей жертвы или простого невезения, моя попытка устранить [scheme_target_character.GetFirstName] закончилась катастрофой. Конклав спешно пытается ухватиться за оставленные зацепки, и я могу лишь надеяться, что мое соучастие не будет раскрыто."
 cois.0032.a:0 "Проклятье!"
 cois.0033.t:0 "Фигура взята"
 cois.0033.desc:0 "Пикантная, компрометирующая информация, которую я раскрыл (или сфабриковал) о [scheme_target_character.GetFirstNamePossessive], теперь обсуждается с утра до вечера — от убогой таверны до королевского банкета.\n\nПозор, обрушившийся на [scheme_target_character.GetHerHis], означает, что [scheme_target_character.GetSheHe] больше не сможет публично исполнять свои обязанности перед Конклавом. Однако мне следует быть осторожным, так как [scheme_target_character.GetSheHe], скорее всего, все еще находится на поводке у [conclave_head.GetFirstNamePossessive]."
 cois.0033.a:0 "С каждым днем я все ближе к избавлению от этих назойливых жрецов."
 cois.0034.t:0 "Слабое звено"
 cois.0034.desc:0 "Похоже, выслеживание моих агентов было замечено [scheme_target_character.GetFirstNamePossessive], [Select_CString(scheme_target_character.IsFemale, 'которая', 'который' )] теперь [Select_CString(scheme_target_character.IsFemale, 'приняла', 'принял' )] крайние меры предосторожности, чтобы никакая компрометирующая информация ни в коем случае не попала не в те руки. Я могу лишь надеяться, что из-за этого не всплывет ничего, компрометирующего мое собственное положение."
 cois.0034.a:0 "Проклятье!"
 cois.0035.t:0 "Перевербовка агента"
 cois.0035.desc:0 "С помощью комбинации угроз и обещаний мне удалось убедить [scheme_target_character.GetFirstNamePossessive] встретиться со мной в надежном месте уже несколько раз. Я уверен, что Ресус понятия не имеет о том, что я работал над перевербовкой одного из его марионеток, и хотя [schame_target.GetName] все еще опасается, мне удалось убедить [scheme_target_character.GetHerHis], что от моей поддержки можно получить куда больше выгоды, чем от игры по правилам Конклава. Для [scheme_target_character.GetHerHis] это риск, но с монументальной отдачей, и [scheme_target_character.GetName] теперь двойной агент, [Select_CString(scheme_target_character.IsFemale, 'работающая', 'работающий' )] на меня."
 cois.0035.a: "Лучше со мной, чем с Ним."
 cois.0036.t:0 "Не убедительно"
 cois.0036.desc:0 "С помощью комбинации угроз и обещаний мне удалось убедить [scheme_target_character.GetFirstNamePossessive] встретиться со мной в надежном месте уже несколько раз. К сожалению, несмотря на мои елейные речи и грандиозные обещания, [scheme_target_character.GetSheHe] остается абсолютно не [Select_CString(scheme_target_character.IsFemale, 'убежденной', 'убежденным' )]. Мы должны были встретиться сегодня, но [scheme_target_character.GetSheHe] [Select_CString(scheme_target_character.IsFemale, 'отправила', 'отправил' )] раба на свое место с коротким предупреждением в виде стиха из обычной молитвы: «Действующие во имя Чистейшего будут защищены от тех, кто замышляет заговор и врет, и никакие тени или завесы не укроют от их глаз тех, кто стремится причинить им вред». Моя кровь стынет, когда я мгновенно узнаю один из личных любимых стихов Ресуса."
 cois.0036.a: "Это... тревожно."
 
 cois.0100.t:0 "Гнев Конклава"
 cois.0100.desc:0 "Когда я покидаю свои покои, чтобы заняться повседневными делами, меня останавливает стража и говорит вернуться в комнаты. На мой вопрос о значении происходящего мне сообщают, что [faction_leader.GetTitledFirstName], как утверждается, раскрыл заговор против моей жизни и что меня необходимо держать в безопасности — ради моего же блага, разумеется.\n\nЕстественно, это не более чем дешевый ход, чтобы отстранить меня от политики. Увы, моего влияния недостаточно, чтобы предотвратить подобное. Я могу лишь надеяться, что [faction_leader.GetFirstName] сочтет нужным выпустить меня достаточно скоро..."
 cois.0100.a:0 "Проклятье!"
 cois.0101.t:0 "Гнев Конклава"
 cois.0101.desc:0 "Пытаясь произвести плановую выплату местному купцу, я встречаю не своего секретаря, а нового клерка, нервно сообщающего мне, что никому, кроме [faction_leader.GetTitledFirstName], на данный момент не разрешен доступ к казне. По-видимому, были обнаружены определенные «нарушения» в управлении королевским имуществом, и предполагаемые виновники этой коррупции (все до единого — мои сторонники) были задержаны. Мой бывший секретарь уже сложил голову на плахе.\n\nПока эта ситуация не уляжется, я фактически остаюсь без гроша в кармане, как уличный мальчишка."
 cois.0101.a:0 "И как я должен управлять государством без денег!?"
 cois.0102.t:0 "Гнев Конклава"
 cois.0102.desc:0 "[faction_leader.GetTitledFirstName], судя по всему, раскрыл невероятно обширную сеть мятежников и предателей в армии и даже в моей личной страже и начал масштабную чистку. Тот факт, что все эти люди — мои собственные сторонники, остался неупомянутым. Армия находится в полном беспорядке, и я даже не могу спать спокойно, зная, что новый капитан стражи — человек, сидящий в кармане у [faction_leader.GetFirstNamePossessive] настолько глубоко, что это даже не секрет.\n\nДавайте просто помолимся о том, чтобы мы не ввязались ни в какую войну в ближайшее время..."
 cois.0102.a:0 "Этот дурак!"
 cois.0103.t:0 "Гнев Конклава"
 cois.0103.desc:0 "Перечитывая свои последние письма, я сначала нахожусь в недоумении, а затем впадаю в ярость. Несколько варваров щедро благодарят меня за акты доброй воли, которых я решительно не обещал, но при внимательном изучении прошлой корреспонденции я замечаю несколько предписаний, написанных от моего имени и содержащих именно эти обещания!\n\nЯ могу только предположить, что за этим стоит [faction_leader.GetFirstName]... Только у н[faction_leader.GetHerHis] есть доступ к моей печати, помимо меня."
 cois.0103.a:0 "Я не могу выполнить всё это!"
 cois.0104.t:0 "Гнев Конклава"
 cois.0104.desc:0 "Ряд придворных интриг, тянущихся месяцами и абсолютно недоступных моему пониманию, привел к тому, что [hook_receiver.GetFirstName] [Select_CString(hook_receiver.IsFemale, 'заполучила', 'заполучил' )] компрометирующую информацию обо мне, которая была бы губительной в случае разглашения. Правда это или нет — неважно, улики показались бы кому угодно слишком убедительными.\n\nТолько [faction_leader.GetFirstName] обладает способностью и властью провернуть заговор столь сложный и возмутительный..."
 cois.0104.a:0 "Это очень, очень плохо."
 
 cois.0200.t:0 "Дело жреца"
 cois.0200.desc_fix:0 "Поступает информация, что [vassal_to_be_recruited.GetTitledFirstName] все чаще проводит встречи с [conclave_head.GetFirstNamePossessive]. Хотя точные произнесенные слова остаются мне неизвестны, я отлично знаю силу елейных речей [conclave_head.GetFirstNamePossessive]. Отныне мне следует оглядываться рядом с [vassal_to_be_recruited.GetFirstNamePossessive]."
 cois.0200.a:0 "Конклав растет..."
 cois.0201.t:0 "Загнанный в угол зверь"
 cois.0201.desc:0 "С каждым днем ряды Конклава редеют. С каждым днем хватка Ресуса за власть слабеет все сильнее. Я побеждаю.\n\nОднако если он чему-то меня и научил, так это тому, чтобы никогда не считать бой оконченным до того, как он реально закончится, и это как нельзя более верно и в данном случае. Он никогда не сдастся без боя, и в предстоящие месяцы и годы он будет в отчаянии — в отчаянии достаточном, чтобы попробовать что угодно, даже если это означает сжечь все царство дотла.\n\nМне следует выставить дополнительную стражу возле моих покоев. И дважды убедиться, что они не сидят в кармане у Ресуса."
 cois.0201.a:0 "Я либо выиграю, либо умру."
 
 cois.0250.t:0 "Кровь и мрамор"
 cois.0250.desc:0 "Крики и звуки битвы продолжают раздаваться по всему дворцу, пока я ухожу, переступая через изысканное, но окровавленное шелковое одеяние еще одного мертвого члена Конклава. На улицах других публично судят без промедления и сразу же казнят под ликование толпы. Те, кто не находится в [GetTitleByKey('c_oraispol').GetNameNoTier], вряд ли встретят значительно лучший конец — я уже направил войска к их поместьям в Этепезее, чтобы с ними расправились.\n\nЭто кровавое зрелище вряд ли будет забыто в скором времени, как к лучшему, так и к худшему. Я снискал и вражду, и страх многих, и не могу не задаваться вопросом — действительно ли это был единственный путь? Разве это не то самое, что сделал бы сам Ресус?"
 cois.0250.a:0 "Есть еще один человек, которого нам нужно навестить..."
 
 cois.0300.t:0 "Королевская фигура"
 cois.0300.desc:0 "Ресус сидит передо мной на своем священном троне — потертом и скромном, именно таком, каким он открыто себя заявлял, но любой человек с нужным глазом мог сразу заметить, что мастерство изготовления превосходило таковое у древних калатипсомцев и легендарной эпохи Двенадцати регентов. Если и не ценное по материалам, дворяне, созерцавшие его, знали, что одно только его историческое значение стоит выше большинства наций. Утонченное, скрытое проявление богатства, подходящее гадюке из [GetTitleByKey('c_oraispol').GetNameNoTier].\n\n«Итак, ты наконец пришел, мальчик, которого я сделал королем. Нищий, чтобы править [Concept('aversaria','Аверсарией')|E]. Мое гений», — произнес Ресус с разгромленной улыбкой на обычно решительном лице. Я едва мог сдерживать себя, но ситуация была серьезной, и если бы Ресуса можно было низложить мирно... даже король-нищий знал, что великой боли можно было бы избежать.\n\n«Все кончено, Ресус», — говорю я, поднимая меч, пока двое из шести человек, вошедших со мной, шагают вперед. — «Если ты сдашься сейчас, твоя служба будет помянута добром, и тебе позволят мирно уйти на покой».\n\nРесус снова вздохнул и встал, копья моих людей поднялись на дюйм, прежде чем остановиться, когда старый теократ встал на колени. Его колени дрожали при этом, его тело давно отвыкло от акта истинной покорности, и падая на колени, он медленно поднял скипетр своей должности над головой.\n\n«Забери его тогда. Я отдаю тебе церковь, если ты отдашь мне мою жизнь»."
 cois.0300.a:0 "Я делаю шаг к трону, тянясь за скипетром..."
 
 cois.0301.t:0 "Королевская фигура"
 cois.0301.desc:0 "Следующие мгновения проносятся подобно громовому раскату, воздействие события подобно молнии, вспыхивающей только после удара звука.\n\nРесус продолжал стоять на коленях, но я смог разглядеть вспышку краем глаза. Высоко на стропилах — блеск стали. Прежде чем стрела выпущена, я разворачиваюсь и приседаю, воздух вырывается из моих легких, когда варварский древок со свистом пролетает над головой и вонзается где-то в углу.\n\nОдин из моих людей первым добирается до меня, его рука тянется вперед, чтобы утащить меня под защиту своего щита, когда я замечаю еще одно движение. Одна рука наполовину скрыта его плащом, то, что в ней зажато, разглядеть невозможно, но я вижу очертания его пальцев на рукояти клинка. На улицах в детстве мы называли это «шансом нищего» — скрытый нож, удерживаемый в той самой идеальной манере, чтобы оставаться спрятанным даже для самого внимательного наблюдателя, но всегда наготове...\n\nПрежде чем предатель успевает среагировать, мой меч взлетает вверх, идеально вонзаясь в щель его шлема. Я чувствую, как его зловещий клинок рассекает кожу и плоть, а затем отскакивает от кости, лишь продолжая движение со всей силой моей руки, мое зрение застлано брызгами крови, когда солдат качается назад и валится вниз по лестнице под звуки гремящей утвари.\n\nУ лучника к этому моменту уже вторая стрела, а мой арбалетчик только поднимает свой, и я могу подумать лишь об одном действии...\n\nРесус был удивлен, когда я схватил его, тонкий и изящный клинок выпал из его руки там, где он успел его наполовину вытащить, и я разворачиваю его перед собой прямо в тот момент, когда стрела пронзает его грудь и угрожающе упирается в мою собственную. Звук арбалета раздается мгновением позже, и лучник валится и распластывается по изысканной каменной кладке тронного зала после секундной паузы. В моих руках Ресус усмехается, кашляет капелькой крови и испускает последний вдох..."
 cois.0301.a:0 "Всё кончено."
 
 cois.0400.t:0 "Сражения, оставшиеся несыгранными"
 cois.0400.desc:0 "После месяцев, лет подготовки к одной из самых монументальных войн, которую когда-либо видел [Concept('aversaria','Расколотое побережье')|E], конец наступил совершенно без развязки. С севера поступают вести о том, что Ценвар испустил последний вдох, хотя отчеты путаются в точных обстоятельствах его смерти. Кажется, у каждого есть своя любимая теория о том, был ли покойный Верховный король убит и кем — фенвирами, [Concept('Mayikrata','Майикратией')|E], каким-то северным военачальником, партиками, и даже несколько пальцев указывают в мою сторону.\n\nМы, скорее всего, никогда не узнаем, да это и неважно. Хотя титаническое столкновение, которое потенциально могло бы превратить меня из исторически важного человека в легендарного, никогда не состоится, я все же могу вздохнуть с огромным облегчением, так как величайшая экзистенциальная угроза моему правлению ликвидирована."
 cois.0400.a:0 "Истинное благословение."
 
 cois_join_cenware_tt:0 "[attacker.GetFirstName], скорее всего, согласится и позволит вам сохранить графство неподалеку от столицы. Унижение, которое это причинит всей [Concept('aversaria','Аверсарии')|E], будет слишком лакомым кусочком, чтобы от него отказаться."
 cois_rhesus_seizes_power_tt:0 "Поскольку я больше не действую как его марионетка, Ресус, скорее всего, наконец захватит власть над Палитакой для себя в официальном качестве."
 cois_resist_cenware_tt:0 "Это битва, которую вы почти наверняка проиграете. Если вам, однако, удастся совершить чудо, политические дивиденды будут невообразимыми."
 cois_cenware_will_come_back_tt:0 "#N Через три года [attacker.GetFirstName] вернется с местью. Это будет ваше окончательное противостояние. Будьте готовы.#!"
 cois_etepezea_unites_tt:0 "Военачальники Этепезеи объединились под вашим знаменем. Их верность не абсолютна."
 cois_conclave_distracted_tt:0 "Конклав будет временно отвлечен собственной подготовкой к следующему вторжению [attacker.GetFirstNamePossessive]. В это время они будут более уязвимы к враждебным интригам."
 cois_exiled_to_mistel_tt:0 "Я был изгнан так далеко от Палитаки, как только возможно, чтобы содержаться под замком в жалком маленьком поместье, предназначенном для моего содержания. Вряд ли я еще хоть раз в жизни увижу [GetTitleByKey('c_oraispol').GetNameNoTier]."
 cois_founder_bloodline_tt:0 "Несмотря на ваше поражение, ваши деяния навсегда запечатали ваше наследие, и вы будете известны всем как последний истинный Аавтократ."
 cois_smuggled_to_sarradon_tt:0 "Ваш наследник был благополучно переправлен далеко в [Concept('sarradon','Саррадон')|E]. Вы продолжите играть за него."
 cois_founder_bloodline_victorious_tt:0 "Ваши легендарные деяния позволили вам основать #E родословную#!."
 cois_imperrech_collapses_tt:0 "Имперрех рухнул, а сьялволки остались разобщенными."
 cois_can_use_reconquest_tt:0 "Теперь вы можете использовать повод к войне #E Аверсарианское возвращение#!, чтобы восстановить Империю!"
 vassal_joins_the_conclave:0 "[vassal_to_be_recruited.GetTitledFirstName] присоединяется к #E Конклаву#!"
 rhesus_final_phase_tt:0 "#N Ресус сделает все, что в его силах, чтобы убить вас, пока он не будет побежден!#!"
 rhesus_final_phase_finish_him_tt:0 "Его сеть все еще глубока, и лучший способ ее ликвидировать — отрубить ее голову. Вам следует сделать все возможное, чтобы прикончить его как можно скорее."
 lands_will_be_confiscated_tt:0 "Все земли будут конфискованы."
 
 gh_locked_out_of_treasury:0 "Заблокирован доступ к казне"
 gh_locked_out_of_treasury_desc:0 ""
 gh_levies_sabotaged:0 "Чистка в армии"
 gh_levies_sabotaged_desc:0 ""
 gh_bodyguards_replaced:0 "Неверные телохранители"
 gh_bodyguards_replaced_desc:0 ""