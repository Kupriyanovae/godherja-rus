l_russian:
 narses.0001.t:0 "Чудо в Этепезее"
 narses.0001.desc:0 "Всё кончено. Каким-то образом, после трагедии Элизии, после того как столь многое было утеряно, я одержал победу. Варвары-сьялволки бежали обратно в Калатипсоми, а земли, утерянные во время войны, отвоеваны моими войсками, славящими мое имя как спасителя [Concept('aversaria','Аверсарии')|E]. И меня чествуют не только на северных, освобожденных землях.\n\nИбо повернув на юг, я вижу, как многие из моих законных, но мятежных подданных внезапно превратились в образец верности, из кожи вон вылезая, чтобы поздравить меня с великой победой. Ааувократ — так они называют меня, и они правы. Моя победа над Сокрушителем Ведьм — явное доказательство того, что я один являюсь законным правителем Аверсарии! Единственная критика, которую я получаю, раздается во мне самом, словно голос предупреждает меня, что это еще не конец. Но теперь, когда остатки элизийских легионов присягнули мне на службу, когда орды снова хлынут на юг, я встану как щит Аверсарии и снова принесу победу!"
 narses.0001.a:0 "Элизия была не напрасна."