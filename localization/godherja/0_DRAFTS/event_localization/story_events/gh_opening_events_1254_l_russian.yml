 # Angobo kin Mamakhim
 opening_event_1254_adabyss.1.t: "Солдат Адабисской империи"
 opening_event_1254_adabyss.1.desc: "Как воин её великой и славно необъятной Адабисской империи, вы слишком хорошо знаете её проповеди о славе и войне. Как благочестивый последователь этих самых догматов, ваш долг — завоевывать во имя вашей веры и распространять священные учения повсюду, среди всех, кто еще дышит, независимо от того, слушают ли они охотно.\n\nВот почему вы отправились на север в эту странную землю, далеко от границ вашего дома. Найдется ли какая-либо слава в такой глуши, особенно когда Империя куда больше занята гораздо более прибыльными делами, вам предстоит выяснить самому. В конце концов, хорошо известно, что каждого амбициозного офицера ждет Лимпегайл — легион, ожидающий повышения этого лидера и его новых приказов..."
 opening_event_1254_adabyss.1.a: "Моим мечом и моей славой эта земля станет моей."

 opening_event_1254_aversaria.3.t: "Восточная Империя"
 opening_event_1254_aversaria.3.desc: "Восточная Империя, Айроной, погрузилась в хаос. Эшрей, помешанный на власти дурак, использовал свою нечестивую магическую силу, чтобы сломить свою соперницу Аксиотею. Он уничтожил не только свою соперницу, но и Восточную Империю, а возможно, и сам мир. Почуяв слабость, могущественный военачальник сьялволков, известный как Кормаг Фенрис, завоевал большую часть Восточной Империи. [Concept('aversaria','Аверсарианцы')|E] не смогли оказать сопротивления его завоеванию, и он захватил восточную жемчужину Империи — [GetTitleByKey('c_asiupoli').GetNameNoTier]. Если имперский король или королева отвоюет [GetTitleByKey('c_asiupoli').GetNameNoTier] у варварского короля, они смогут сплотить свои войска, чтобы вернуть восток!"
 opening_event_1254_aversaria.3.a: "Интересно..."