l_russian:

 ##############################
 # Nicanoneus 'the Black Sun' #
 # By Lonely Knightess		    #
 ##############################
 opening_event_1254_aversaria.1.t: "Сияющее Солнце Черной Лиги"
 opening_event_1254_aversaria.1.desc: "Жизнь — это война.\n\nС самого момента моего рождения война — это всё, что я знал. От междоусобиц в колониях, когда [Concept('the_fog','Туман')|E] захлестнул мои родные земли в детстве, до жестоких битв с ордами сьялволков после — ничего, кроме войны. Первая битва в 11 лет, первое убийство вскоре после этого и окровавленный путь из моих родных земель на дальнем востоке к более теплым берегам. Трупы на всем пути. Моя жизнь была войной, и она привела меня сюда. К последней битве.\n\n[Concept('marchers','Марочники')|E] и сьялволки оставили меня в шрамах, рассеяли моих людей, но для последнего боя они собираются вновь. Мои люди объявляют меня земным воплощением Чистейшего, ведь несмотря на отсутствие у меня [Concept('magic','магических')|E] способностей, сами Первые Люди возвестили о моем прибытии от самой колыбели до командного поста. Сам Чистейший короновал меня дрожащими руками. Я — Черное Солнце. Аавтократ севера, и если мне суждено умереть, то они узнают моё имя прежде, чем я паду."
 opening_event_1254_aversaria.1.a: "За [Concept('aversaria','Аверсарию')|E]!"

 #######################
 # Dexios		           #
 # By Lonely Knightess #
 #######################
 opening_event_1254_aversaria.2.t: "Слава Верховному королю"
 opening_event_1254_aversaria.2.desc: "Слава Верховному Королю!\n\nВот что говорили эти ублюдки, кланяясь так чинно и манерно, словно кучка краснеющих шлюх, пока их верховный король стоял перед ними — о, как они пресмыкались передо мной! А теперь взгляните, что они наделали, эти дураки, эти идиоты! Моя славная держава, такая прекрасная и пьянящая гегемония, разорванная на кровавые клочья кучкой инфантильных нелюдей и тем ничтожным подобием существа, которое вообще можно назвать сьялволком!\n\nЭто был Ульфиркс, этот маленький ублюдок, мои шпионы донесли мне. Молодой безумец, глупый военачальник. О, он наверняка считает себя таким гением, таким умным, таким мудрым, думая, что смог перехитрить меня! Мои шпионы утверждали, что он всего лишь мальчишка, глупый юнец, и я незамедлительно повесил их за это наглое оскорбление. Никакой мальчишка, никакой идиот никогда не смог бы сделать этого. Нет, я знаю правду. Ульфиркс планировал это с самого начала, годами, даже десятилетиями! Тот мальчик, которого они называли Ульфирксом — всего лишь матерый военачальник сьялволков, который с самого начала замышлял с этими ублюдками-наемниками уничтожить меня, разрушить мое королевство! Я не позволю этого, Я ПРИНЕСУ месть. Ульфиркс познает настоящую боль, когда я отрежу каждый маленький сучок на теле этого седого ублюдка! Он даже не представляет, какую боль я ему причиню! Он наверняка думает обо мне прямо сейчас, непрестанно гордясь тем, что уничтожил ЕДИНСТВЕННОГО ИСТИННОГО ВЕРХОВНОГО КОРОЛЯ ОСТРОВОВ И ВСЕХ МОРЕЙ [Concept('aversaria','АВЕРСАРИИ')|E], и гадая, что же ему делать дальше. Что ж, скоро он узнает, что ему делать дальше: УМЕРЕТЬ! УМЕРЕТЬ. УМЕРЕТЬ. Если бы он только знал, на кого наткнулся, какого врага себе нажил. Я объявил кровную месть, анафему всему его дому, и я исполню её! Целые лиги ученых смотрели на историю моей семьи и плакали, понимая, что моя кровь настолько чиста, настолько усовершенствована величайшими чемпионами, что моих знаменитых предков просто не сосчитать! Легионы слышали о моей державе и бросали оружие, берясь за плуги лишь от одной мысли о том, что когда-нибудь им придется встретиться со мной! Все [Concept('magi','маги')|E] Аверсарии сидели в шокированном молчании, трепеща перед могущественной силой, исходящей с Островов! Я заставлю Ульфиркса чувствовать боль, я заставлю их всех чувствовать боль. Ульфиркса, культистов, наемников, МОИХ СОБСТВЕННЫХ ДЕТЕЙ, и УЛЬФИРКСА больше всех!\n\nЯ — ВЕРХОВНЫЙ КОРОЛЬ."
 opening_event_1254_aversaria.2.a: "Мне нужно перевести дух."

 #######################
 # Hecaeda		         #
 # By Lonely Knightess #
 #######################
 opening_event_1254_aversaria.4.t: "Восточный легон"
 opening_event_1254_aversaria.4.desc: "Когда грянула [Concept('frodbrokna','Фродброкна')|E], я еще не родилась, но мой предшественник и наставник, великий легон Валерикс, удержал Легион вместе.\n\nЧерез бескрайние степи востока, через солоноватые волны Алмира, через покрытые [Concept('the_fog','Туманом')|E] заснеженные горы он собрал свой легион и отправился домой, чтобы помочь восстановить порядок в [Concept('aversaria','Аверсарии')|E]. Он нашел землю в смятении, и его сердце разрывалось, когда он видел кровь, которую его собственный народ проливал друг за друга. Будучи хорошим человеком, несмотря на свое кровавое положение, Валерикс не мог видеть несправедливость, которую наш народ причинял друг другу. Что хуже всего для него — он не мог видеть несправедливость, которую они причиняли другим. Когда я родилась у одного из его легионеров и восточной шлюхи, все ожидали, что меня бросят на марше или отправят в обоз, но Валерикс смотрел не на расу или положение, а только на потенциал.\n\nВалерикс теперь мертв, без сомнения, убит аверсарианской знатью, которой надоели его попытки положить конец их жестокости. Но они совершили ошибку: они не убили его протеже. Теперь за мной стоят люди, восточный легион, те, кого считали брошенными. Сегодня я пойду к своим людям и поклянусь им на своей крови не отдыхать и не спать, пока за Валерикса не отомщён и его дело не завершено.\n\nАверсария мертва, но через огонь и ярость я перекую её. Мы сделаем её сильнее. Мы сделаем её лучше. Мы покончим со злом, которое причинил наш народ, мы свергнем [Concept('magi','магов')|E], вызвавших его, и принесем новую эру процветания. Мира. Равенства."
 opening_event_1254_aversaria.4.a: "Вместе, под знаменем легиона, мы исправим все ошибки."

 ################################################
 # Arch Letalagos Pylartes of Legio IV 'Elenos' #
 ################################################
 opening_event_1254_aversaria.5.t: "Кровь Праведников!"
 opening_event_1254_aversaria.5.desc: "Губернаторские легионы Малькои! Гордость [Concept('aversaria','Аверсарии')|E]! От дворняжьих шкур старого [Concept('the_imperium_of_kartharadd','Картарадда')|E] до мифических высот Войны Драконов и умерщвления зловонных тварей пустоты — именно мы, дети [Concept('aersanon','Чистейшего')|E], [Concept('first_empire','Города Мира')|E], бичевали их всех от [Concept('sarradon','Саррадона')|E] до Катун-Кая! Где некогда старые губернаторские легионы пришли в упадок и сгинули, самые храбрые из Аверсарии, солдаты Малькои, ни разу не пошатнулись, как наши слабые соотечественники. Легион «Эленос» и его предшественники провели сотню кампаний, от рабов Долины до рабов [Concept('night_of_the_bleeding_moon','Кровавой Луны')|E]! И вот мы стоим, последние в своем роде, а немногие оставшиеся товарищи уничтожены дерзким варваром [eofwine.GetFirstName] вместе с последними наследниками губернаторства.\n\nКомандиров больше нет, аавтократов больше нет. Не так давно мы слышали об аде Элизия, и пройдет совсем немного времени, прежде чем либо военачальники-переселенцы, либо наши взбунтовавшиеся рабы приведут нас к последней и славной #EMP битве!#! Если мы — последние из губернаторских, то я говорю, что я и мои люди умрем славно, как умеют только аверсарианцы!"
 opening_event_1254_aversaria.5.a: "Мы устроим этим ублюдкам отличное зрелище, парни! #EMP СБООООООООР!#!"

 ##########################
 # Gorassos 'Skull-Taker' #
 # By Lonely Knightess	  #
 ##########################
 opening_event_1254_aversaria.6.t: "Кровь для Горасса, черепа для его трона!"
 opening_event_1254_aversaria.6.desc: "Эшрей когда-то называл меня своим бешеным псом. Своей личной машиной для убийств, которую можно натравить на кого угодно, лишь бы тот истек кровью самым славным образом.\n\nИ резня была хороша. О да, так хороша. Кровь покрывала меня, пока я рубил его врагов, черепа побрякивали на моей броне, когда я собирал новые, чтобы преподнести их врагам. «Собиратель черепов» — так они меня называли, и я упивался этим именем.\n\nНо Эшрей слаб, потеряв свое государство и шанс проливать кровь. Слава убийствам, которые он мне принес, но теперь можно найти еще больше убийств. Я — реинкарнация Чистейшего, и наследие нашего народа прольется по всем землям, где живут те, кому скоро предстоит умереть."
 opening_event_1254_aversaria.6.a: "Калечь, убивай, жги! КАЛЕЧЬ, УБИВАЙ, ЖГИ!"

 ################################################
 # Megistos 'the Most Fair and Beautiful Ruler' #
 # By Lonely Knightess						            	#
 ################################################
 opening_event_1254_aversaria.7.t: "Хорошо быть королем"
 opening_event_1254_aversaria.7.desc: "Есть ли кто-то столь же славный, как Мегист? Такой же красивый, как Мегист? Такой же прекрасный, как Мегист?\n\nНет, есть только Мегист. Я, Мегист, доказал, что являюсь не только самым прекрасным и мужественным из моих товарищей-[Concept('aversaria','аверсарианцев')|E], но и, очевидно, самым любимым. Куда бы ни пошел Мегист, везде ликуют ради Мегиста, все мои жены любят меня, Мегиста. Даже мое имя прекрасно — есть ли хоть что-то, чем я, Мегист, не обладаю?\n\nЯ, Мегист, абсолютно уверен, что я, Мегист, был бы совершенно божественным аавтократом Аверсарии. Хм. Аавтократ Мегист. Мегисту понравился бы этот титул."
 opening_event_1254_aversaria.7.a: "Для Мегиста единственное, что прекраснее Мегиста — это зеркало, в которое он смотрит."

 #######################
 # Adriane of Sitrabis #
 # By Lonely Knightess #
 #######################
 opening_event_1254_aversaria.8.t: "В поисках силы"
 opening_event_1254_aversaria.8.desc: "[Concept('sarradon','Саррадон')|E] — это никчемная дыра, которая служит лишь ловушкой для Империй, где они попадаются и погибают в драках за бескрайние просторы ГРЕБАНОГО песка.\n\nЯ ненавижу это. Я ненавижу всё это, так сильно. Так чертовски сильно. Если и есть что-то более убогое, чем пустыня, я не могу себе этого представить. Иногда мне снится, как я раскапываю курганы в [Concept('the_lichdoms','Личествах')|E] — по крайней мере, [Concept('undead','неживые')|E] туземцы проявляют уровень интеллекта, на который саррадонцы явно не способны.\n\nНо здесь есть сила. Погребенная в песках. Древние храмы, давным-давно засыпанные землей, доверху наполненные древними артефактами и утраченной магией. Археологи охают и ахают над каждым куском гребаной керамики, вытащенным из мумифицированных рук какого-то язычника, но иногда они находят что-то полезное. По-настоящему полезное.\n\nВ этой пустыне есть неведомая сила. Я чувствую её, каждый [Concept('magi','маг')|E] чувствует. И она будет моей."
 opening_event_1254_aversaria.8.a: "А до тех пор мы копаем... живо, псы!"

 #######################
 # Heralios 'Sea-King' #
 # By Lonely Knightess	#
 #######################
 opening_event_1254_aversaria.9.t: "Править морями"
 opening_event_1254_aversaria.9.desc: "Иногда мне нравится размышлять. Задумываться по-настоящему глубоко, пока я сижу на корабле, в своем замке или на поле боя. Долго и упорно думать. Например, что делает жизнь такой приятной? Почему я так чертовски хорош в своем деле?\n\nЧто ж, думаю, дело в том, что Гераклий — единственный в своем роде. Кто еще может быть «законным аавтократом [Concept('aversaria','Аверсарии')|E], умелым [Concept('magi','магом')|E] чистейших кровей и величайшим пиратом из когда-либо живших», если не я?\n\nЛишь одно смущает меня — постоянные требования некоторых людей относительно моих «обещаний». Полагаю, строить флот, обещая каждому матросу кусок Этепезеи по... изобретательному притязанию, было не совсем продуманно, но к черту! Я — Гераклий! Для меня нет проблем, есть только новые возможности."
 opening_event_1254_aversaria.9.a: "Грабеж или слава... а может, и то и другое!"

 #########################
 # Adalgar the Mastikigni#
 #########################
 opening_event_1254_aversaria.11.t: "Щит в горах"
 opening_event_1254_aversaria.11.desc: "Ценвар, мой названый брат, дал мне мой пост и мою священную миссию. Удерживать Серые врата от орд [Concept('fogeaters','пожирателей тумана')|E], ютящихся в их тени.\n\nКаждый день еще сотня гибнет перед стенами, тащась вперед, утыканные стрелами, несмотря на боль, чтобы укусить за лодыжки тех, кто держит оборону. Каждый день [Concept('the_fog','Туман')|E] становится гуще, угрожая в любой момент выплеснуться в проход. Каждый день угроза нашему народу растет, и каждый день я стою перед стенами и слежу за тем, чтобы проход сдерживал всех, кто угрожает живым.\n\nЭто моя священная задача, и пока я не умру, я буду стоять и сражаться за свой народ."
 opening_event_1254_aversaria.11.a: "Ради тех, кто жив, мы сражаемся до конца."

 ##################
 # Eoghar-Argeadh #
 ##################
 opening_event_1254_aversaria.12.t: "Путь"
 opening_event_1254_aversaria.12.desc: "Я делаю так, как велят друиды. Все хорошие вожди знают, что наш долг — следовать их указаниям, маршировать по их приказам и всегда делать то, что необходимо.\n\nНо почему Путь ведет нас к безумию? Маршировать на север, прочь от остального Имперреха? Присоединиться к [Concept('marchers','марочникам')|E], чтобы сдержать [Concept('aversaria','аверсарианского')|E] военачальника «Черное Солнце», только затем, чтобы [Concept('ash_war','всадить нож в спину')|E] и украсть их земли? А теперь шепотки об исходе именно на [Concept('the_lichdoms','север')|E]?\n\nЯ следую их указам, уважаю их желания, подчиняюсь их требованиям. Но я все больше тревожусь и печалюсь, думая о том, что Совет, возможно, нашёл безумие в этой новой земле. Они говорят нам, что Путь требует этих жертв, но какая жертва будет стоить гибели нашего народа?"
 opening_event_1254_aversaria.12.a: "Таков Путь."

 ############
 # Mathilde #
 ############
 opening_event_1254_aversaria.13.t: "Теневая королева"
 opening_event_1254_aversaria.13.desc: "Претенденты — дураки. Все до единого.\n\nИдиоты-дети, разнеженные и выросшие в замкнутых стенах своих дворцов. Я смотрела, как они росли, я смотрела, как дети Гардфрея годами пронизывали любой шанс доказать, что они достойны трона. Единственный, о ком стоит вообще говорить — это Рене, грубый наемник, который считает, что правление — это то, по чему он бьет своим мечом.\n\nОт грязи и нищеты до темных дворов царства — я трудилась. Перерезала ли я горло человеку сама или заставляла других делать это от имени Верховного короля. Они называют меня простолюдинкой, убийцей, грешницей. Они дураки. Я единственная, кто достоин власти, единственный «правитель» здесь, кто сделал хоть что-то, чтобы протянуть руку и взять её. И я получу её. Я буду Верховной королевой."
 opening_event_1254_aversaria.13.a: "Трон будет моим, чего бы это ни стоило."

 ##########################
 # Rene the Black Bastard #
 ##########################
 opening_event_1254_aversaria.14.t: "Черный Бастард"
 opening_event_1254_aversaria.14.desc: "От бескрайних равнин дальнего востока до пустынь [Concept('sarradon','Саррадона')|E], от пиков Серых врат до разрушенных земель [Concept('aversaria','Аверсарии')|E]. Я видел этот мир во всем его ужасе и великолепии, и усвоил одно. Великий прилив тьмы закипает на горизонте, угрожая в любой момент разбить корабли о скалы. [Concept('chevalie','Шевалье')|E] утонет к завтрашнему дню, если мы не объединимся — объединимся под началом того, кто понимает этот мир и его угрозы. Меня.\n\nМои братья не злы, но они введены в заблуждение. Ансфрей скорее ученый, чем король, и его Путь больше подошел бы библиотеке — подозреваю, он и сам получил бы от этого больше удовольствия. Милый Бенуэ — не более чем заблудший щенок, которого тащат на поводке стервятники запада, а Климент! Молодой Климент и его дерзкая мать, чье представление о защите юноши — усаживание его на трон.\n\nЕсли я хочу спасти Шевалье, моих братьев нужно остановить. Из любви к ним я должен попытаться спасти их, но если мне придется совершить зло ради спасения нашего королевства, то зло я и совершу."
 opening_event_1254_aversaria.14.a: "Только завоеватель удосуживается почтить павшего врага."

 ###########################
 # Cliement den va Seignon #
 ###########################
 opening_event_1254_aversaria.15.t: "Мальчик, который хотел стать Верховным королем"
 opening_event_1254_aversaria.15.desc: "Мама говорит, что я буду великим Верховным королем и самым лучшим, как папа, и что мои братья злые и хотят обидеть меня. Я не хочу, чтобы они меня обижали, но мама сказала, что защитит меня. Дядя Спенсер тоже так говорит, но он мне не дядя, у него изо рта плохо пахнет, и мне не нравится, как он на меня смотрит и как трогает маму. Мои братья хорошие, поэтому я не понимаю, зачем им обижать меня, но мама не врет, поэтому я стараюсь сидеть в своей комнате возле кровати, чтобы, если они попробуют меня обидеть, я мог лечь спать.\n\nДворяне хорошие, но они всегда говорят со мной о том, как хотят помочь мне и служить мне, но их улыбки никогда не выглядят настоящими, когда они это говорят, и иногда они меня пугают. Мама говорит, что я должен им доверять, и я узнаю так много нового на уроках о том, как быть Верховным королем, поэтому я буду стараться изо всех сил, потому что мама так сказала."
 opening_event_1254_aversaria.15.a: "Я просто хочу поиграть!"

 ###########################
 # Ansfrei den va Seignon #
 ###########################
 opening_event_1254_aversaria.16.t: "Ученый среди воинов"
 opening_event_1254_aversaria.16.desc: "Верховный король... Верховный король... что это такое. На самом деле. Это титул, созданный Бастионом, если это действительно было его имя, около 1200 лет назад. Есть вопросы о том, был ли Бастион на самом деле реформатором или военачальником, но это не суть важно.\n\nА потом? Серия военачальников, которые лепили государство заново каждый раз, когда оно неизбежно распадалось. Порочный круг: гражданская война и распад королевской власти, вторжение [Concept('liches','лича')|E] или внешней силы, воссоединение власти для убийства лича или сдерживания их до предательства союзников, а затем союз до неизбежного краха. Снова и снова по кругу.\n\nОни словно слепы. Этот цикл не жизнеспособен. С каждым десятилетием торговля в [Concept('chevalie','Шевалье')|E] сокращается, население тоже, а разногласия становятся все глубже. Я боюсь, что если изменения не будут внесены в ближайшее время, это может стать концом цикла. Слишком много опасностей, слишком много бедствий, чтобы наша родина пережила еще одно падение.\n\nВерховный король, который спасет нас, не придет. Значит, им должен стать я. Если мне придется сразиться с братьями ради этого, я сделаю то, что должен. И если мне... придется... произвести на свет наследника для обеспечения стабильности. Что ж, я сделаю это."
 opening_event_1254_aversaria.16.a: "Так. Ладно. Объединить королевство, произвести наследника. Эх..."

 ###########################
 # Benouet den va Seignon #
 ###########################
 opening_event_1254_aversaria.17.t: "Я — король!"
 opening_event_1254_aversaria.17.desc: "Я король! Совсем как папа, верховный король! Мои братья говорят, что я глупый, что у меня плохо получается быть королем, но это неправда! У меня много людей, которые мне помогают, хорошие дворяне, которые говорят, что помогут мне получить мой зак- зако- мой трон, если я буду делать то, что они говорят, и давать им земли и деньги.\n\nЯ буду хорошим королем, совсем как папа! Я покажу братьям, что я самый умный, а потом побежу чужеземцев, заработаю кучу денег и сделаю людей счастливыми, а потом убью [Concept('liches','лича')|E], совсем как папа! И с помощью дворян я ни за что не проиграю!"
 opening_event_1254_aversaria.17.a: "Я так рад, что есть суперумные люди, которым я могу доверять."

 ###############################
 # Cois 'Chosen of the Purest' #
 ###############################
 opening_event_1254_aversaria.18.t: "Жрец и крестьянин"
 opening_event_1254_aversaria.18.desc: "Я все еще помню день, когда меня нашли. Когда я был всего лишь мальчишкой, жрецы пришли в переулок, где я спал, когда не попрошайничал и не воровал. Мужчина в одеждах более пышных, чем я когда-либо видел, взял меня за подбородок и объявил, что мне суждено стать Аавтократом.\n\nКогда я был юн и одарен всеми атрибутами, которых можно было ожидать, я считал себя самым удачливым ребенком в мире. Возможно, я и сейчас такой. Но теперь, когда я повзрослел, прутья моей клетки стали куда очевиднее. Я могу быть Аавтократом, но я являюсь им лишь по воле Ресуса, как бутафория, которую он использует для укрепления собственной власти в качестве так называемого «Ипсилониса».\n\nВозможно, мне следует принять свою участь и наслаждаться предлагаемой роскошью, или, может быть... может быть, мне стоит посмотреть назад, на улицы, где я родился. Взглянуть на жестокость, которую Ресус считает праведной. Возможно, пришло время стать Аавтократом не только по имени..."
 opening_event_1254_aversaria.18.a: "Золотая клетка — все равно тюрьма."

 ###############################
 # Cormag Fenrus 'the Old Dog' #
 ###############################
 opening_event_1254_aversaria.19.t: "Волк Востока"
 opening_event_1254_aversaria.19.desc: "Ценвар — дурак.\n\nСоюз сьялволков? Держаться за руки со слабыми чужеземцами? Обосноваться в замках [Concept('aversaria','аверсарианцев')|E], которые сделали их такими женоподобными? Скоро он наденет мантию и начнет разглагольствовать о красоте магии.\n\nЕсли остальные хотят быть дураками и скакать, как кучка слабых язычников, да будет так. Если я должен быть единственным здравомыслящим человеком среди сьялволков, да будет так. Наша независимость — наша сила, наша дикость, наша вера. Именно я взял так называемый жемчужный город [GetTitleByKey('c_asiupoli').GetNameNoTier], и именно я выкую будущее для народа фенвиров, и никто другой. Если «Сокрушитель Ведьм» хочет притворяться нашим лидером, да будет так — именно я заложу наследие нашего народа."
 opening_event_1254_aversaria.19.a: "Сьялволки будут сильны в традициях, а не в переменах."

 ########################
 # Kekropi of Ephoupoli #
 ########################
 opening_event_1254_aversaria.20.t: "Овцы в волчьих шкурах"
 opening_event_1254_aversaria.20.desc: "Золото! Все, чего я хотел — это немного ГРЕБАНОГО золота! Золота от Верховного короля, золота от его красавицы-гадюки дочери. Золота хоть от КОГО-НИБУДЬ. Неужели это, блин, так много — просить о честном заработке? Немного денег, чтобы посидеть на островах и иногда попинать крестьянина? Что ж, ЧЕРТ ВОЗЬМИ, оказывается, много! И вот мы здесь, сидим на этом дерьмовом гребаном острове, который был единственной вещью, похожей на плату, которую я смог придумать.\n\nИ- и- и эти гребаные сьялволки! Откуда, черт возьми, я должен был знать, что они высаживаются всего с двумя десятками людей? Когда видишь драккары — беги! Это каждый гребаный человек знает! Нельзя, блин, связываться со сьялволками! Кто, черт возьми, заплатил бы мне за такое? Как бы я забрал эту плату, будь я МЕРТВ? Половина моей роты была у Элизийского перевала — они думают, я так рад гребаным образом играть с ЭТИМ?\n\nО черт, он идет, не так ли? Этот гребаный сьялволк. О Чистейший, трахни меня, прокляни все, бля- су- ах, черт. Что мне вообще делать теперь?"
 opening_event_1254_aversaria.20.a: "ПРОКЛЯТЬЕ НА ВСЁ."

 ###################
 # Princess Melane #
 ###################
 opening_event_1254_aversaria.21.t: "Принцесса на Островах"
 opening_event_1254_aversaria.21.desc: "Мой отец, да благословится его имя, если не его душа, всегда был... упрямым. Неспособным принять слово «нет», всегда параноидальным и подозрительным к своему двору. Даже когда он был лишь мелким графом, а теперь тем более, когда он так называемый «Верховный король Островов и всех Морей Праведной Империи».\n\nПравда в том, что мой отец — безумец. Неспособен править, еще более неспособен вести за собой. Возможно, это откровение последних нескольких десятилетий, возможно, он всегда был таким. Я не знаю. Я пыталась исполнить свой долг однажды с трусливым наемником Кекропием, и благодаря пьяному дураку Ульфирксу это провалилось. Так что теперь мы должны сделать это тяжелым путем, печальным путем. Моего отца нужно остановить, и сделать это должна я."
 opening_event_1254_aversaria.21.a: "На благо государства мой отец должен быть остановлен."

 ####################
 # Ulfirx 'Mad Dog' #
 ####################
 opening_event_1254_aversaria.22.t: "Бешеный пес поднимается"
 opening_event_1254_aversaria.22.desc: "Никогда не было лучшего времени для жизни!\n\nПо всему миру молодые мужчины и женщины вписывают свои имена в книги истории так, как никто раньше! Как я всегда знал, именно мой род станет теми великими людьми, на которых будущие поколения будут смотреть со славой. Ценвар — хороший человек, но не может же он забрать всю славу себе! Так что мне оставалось делать, кроме как... найти... несколько кораблей и отплыть, чтобы добыть собственную славу?\n\nМестные [Concept('aversaria','аверсарианцы')|E] слабы, армия, на которую мы высадились, рассеялась практически в тот же момент, как мы ступили на берег. Теперь Острова открыты, и несказанные богатства и слава ждут нас!"
 opening_event_1254_aversaria.22.a: "Аууууу! Давайте пить, гулять и драться напропалую!"

 ##########################
 # Hammart 'Twist-Tongue' #
 ##########################
 opening_event_1254_aversaria.24.t: "Будущее могущества"
 opening_event_1254_aversaria.24.desc: "Мой народ — дураки.\n\nОни сидят в дерьме и грязи и нують и скулят по поводу любой угрозы, которая приходит сжигать деревни сегодня. Каждый день [Concept('magi','маг')|E] ступает куда-то в Марках, показывает нам истинную силу, а затем его прогоняют только после того, как дюжина [Concept('marchers','шевальенцев')|E] падает мертвыми к его ногам.\n\nНеужели они не видят? Они что, слепы? Если бы эти гребаные идиоты подумали, почитали книги, изучили фолианты, сделали хоть какую-то базовую попытку просветиться, как это сделал я, они могли бы увидеть. Магия — единственный путь вперед, абсолютная сила, нет ничего величественнее. И есть только одно, что мешает мне и моему народу владеть ею так, как мы должны.\n\nГде-то в [Concept('chevalie','Шевалье')|E] что-то порождает проклятое [Concept('antimagic','антимагическое')|E] поле, которое окутывает наш дом и препятствует нашему истинному росту. Я найду это. Я уничтожу это. Дар магии снова станет нашим."
 opening_event_1254_aversaria.24.a: "Только маг познает истинное могущество."

 ##########################
 # Msamaki of Der Vindeon #
 ##########################
 opening_event_1254_aversaria.26.t: "Король [Concept('the_towers','Башни')|E]"
 opening_event_1254_aversaria.26.desc: "[Concept('the_towers','Башня')|E] Дер Виндеона говорит. Мертвые имя из мертвого языка, её владыка до меня всё еще стоит тут. Смотрит на меня, пока я сижу в своей палате на её вершине.\n\n«Время приходит, человек...» — говорит оно, язык моего народа явно отвратителен для его уст. Это лишь тень, которая говорит со мной, отражение, размытое и едва видимое, пока оно стоит там. Страж, последний в своем роде, возможно, кто-то из забытой эпохи. Я наклоняюсь через стол и вглядываюсь в теневой лик, пристально смотря на него.\n\n«Ты также сыграешь свою роль для меня», — говорю я, стараясь не дрожать в ненормально холодной комнате. «Абсолютная сила для меня, трон, который я давно заслужил. Я хочу всё».\n\n«И ты получишь всё, смертный», — усмехнулась фигура в ответ, повернувшись и сделав шаг к запотевшему стеклянному окну. «Башни. Найди их, активируй их. Ты знаешь, что делать. Сделай это, и я дам тебе силу, которой ты жаждешь»."
 opening_event_1254_aversaria.26.a: "Тогда да будет так."

 ####################
 # Ogier 'the Ogre' #
 ####################
 opening_event_1254_aversaria.27.t: "Пограничная стража"
 opening_event_1254_aversaria.27.desc: "Ден ва Сеньоны разорвали королевство на кровавые клочья. Они что, слепы? Жадны? Или просто глупы?\n\nЯ стою на Пепельной башне — высочайшем пике [GetBuilding('01_creusons').GetName] — и предо мной ничего нет. Бескрайние превращенные в пепел пустоши, которые не породили ничего, кроме скверны на нашей земле; скелеты, маскирующиеся под королей, пляшут вокруг и приносят опустошение и разрушение каждому поколению.\n\nКогда закончится это безумие? Когда эти дураки увидят глупость борьбы за корону, когда наше королевство всегда в опасности? Я не знаю ответов на эти вопросы, но знаю одно. Пока я жив, я буду сдерживать бурю."
 opening_event_1254_aversaria.27.a: "Таков мой Путь."

 #################################
 # Aeschraes 'the Lord of Ashes' #
 #################################
 opening_event_1254_aversaria.28.t: "Последний Ааатократ"
 opening_event_1254_aversaria.28.desc: "Они называют меня безумцем, монстром, убийцей.\n\nЧто ж, они тоже умрут! Я — Аавтократ Эшрей, тот, кто расколол мир. Я — Аавтократ, законный правитель [Concept('aversaria','Аверсарии')|E]! Обычаи нашего народа гласят, что сильнейшие из [Concept('magi','магов')|E] достойны править, и [Concept('frodbrokna','Фродброкна')|E] — доказательство того, что никто иной, кроме меня, никогда больше не заслуживает восседать на троне. Я не какая-то реинкарнация «Чистейшего», Я И ЕСТЬ Чистейший. Я — нечто более сильное.\n\nЛюбой, кто сомневается во мне, любой, кто стоит против меня, предатели и дикари — все умрут. Им повезло, что мой двор, ослепленный своей жидкой, слабой кровью, повернулся против меня, ибо если бы они все еще были здесь, я с радостью принес бы их всех в жертву, чтобы вызывать вторую бурю.\n\nЕсли мне придется убивать, чтобы занять свой законный трон, да будет так. Если каждый живущий дурак должен умереть, чтобы я занял его, да будет так. Я — Аавтократ, и я вернусь на свой трон и убью каждого выродившегося пса, стоящего на моем пути!"
 opening_event_1254_aversaria.28.a: "Я — Аавтократ, смерть всем, кто говорит против меня!"

 ###########################
 # Cenware 'Witch-Breaker' #
 ###########################
 opening_event_1254_aversaria.29.t: "Конец путешествия"
 opening_event_1254_aversaria.29.desc: "С тех пор как я был совсем младенцем на руках у матери, я смотрел, как у моих родичей отнимают земли их предков, нашу священную землю, данную нам с незапамятных времен, отнятую [Concept('the_fog','Туманом')|E]. Деревня за деревней, роща за рощей, луг за лугом — нас постепенно превращали в беженцев без дома, и нашей вины в том не было. [Concept('aversaria','Аверсарианская')|E] угроза в своей вечной алчности и злобе подожгла мир, и мы должны были первыми заплатить цену за их преступления.\n\nНо этому не суждено было быть.\n\nПод своим знаменем я объединил тысячу кланов, и впервые на памяти живущих мы маршируем как один. Один народ, одна армия, одна цель — завоевание нашего нового права рождения. Недавно мы наконец разгромили последнее вражеское войско сколько-нибудь почтенного размера у Элизийского перевала, и их родина готова к захвату. Преступления тысячи лет встретят правосудие, нечестивые будут повержены, высокомерные — смирены, а моему народу будет дан новый дом."
 opening_event_1254_aversaria.29.a: "Наши испытания были долгими и многочисленными, но конец уже близок."

 ############################
 # Sigrun 'Axe-in-the-Hand' #
 ############################
 opening_event_1254_aversaria.30.t: "Я — ярость!"
 opening_event_1254_aversaria.30.desc: "Было ли когда-нибудь лучшее время для жизни!? Куда бы я ни пошла, все больше людей пытаются меня убить! А это значит, что можно убить еще больше людей! Каждая расколотая мной голова, каждая пробитая грудная клетка — больше славы моему имени! Больше кутежа для меня и моих людей!\n\nНо хорошие времена могут скоро закончиться. Те корабли, что я «нашла», чтобы приплыть сюда, привели меня намного раньше остальных моих товарищей по Имперреху и милого старого Ценвара, но с приближением моих соотечественников время, когда со всех сторон шла лишь славная битва, может подойти к концу.\n\nБа! Если оно закончится, я закончу его славно! И кто знает, может быть, в дни после [Concept('aversaria','Аверсарии')|E] будет столько же битв, чтобы снискать славу!"
 opening_event_1254_aversaria.30.a: "Принесите мне войну, ибо я — смерть"

 ############################
 # Dragos 'Serpent-Speaker' #
 ############################
 opening_event_1254_aversaria.31.t: "Дитя Разлома"
 opening_event_1254_aversaria.31.desc: "В иное время я был бы пророком, мессией, оракулом.\n\nЯ не помню, когда начались видения. Я знал о них столько, сколько себя помню. Когда я был ребенком, я боялся их, а сверстники изгнали меня из-за них. Я ненавидел свой «дар» и не хотел ничего, кроме как избавиться от него. Глупости юности.\n\nСегодня я знаю, что был благословен. Хотя мои родичи могут избегать меня, разве это действительно проклятие — быть единственным зрячим в деревне слепых? Я владею силами, неизвестными почти никому с тех пор, как Велос впервые создал этот мир. [Concept('aversaria','Аверсарианцы')|E] построили свою Империю на [Concept('living_magic','живой магии')|E], но это нечто большее, нечто величественнее. Насколько большего мы могли бы достичь, если бы все мы могли видеть?"
 opening_event_1254_aversaria.31.a: "Надвигается новый рассвет, и его свет достигнет глаз каждого."

 ##########################
 # Isa the Last Ritualist #
 ##########################
 opening_event_1254_aversaria.32.t: "Последняя надежда ушедшей эпохи"
 opening_event_1254_aversaria.32.desc: "Мои предки были великими людьми. Воинами и учеными, поэтами и мстителями. Святыми мастерами [Concept('ritualism','ритуалистской')|E] веры, но они потерпели неудачу в своем священном долге. Они привели к почти полному концу [Concept('sarradon','Саррадона')|E] в [Concept('war_in_heaven','Войне на небесах')|E], а затем потеряли всё в [Concept('saints_war','Войне Святых')|E]. Какая польза от славы их правления и могущества, с которым они разили мечом, когда наша родина теперь удерживается [Concept('wardenism','варденитами')|E] и чужеземцами?\n\nБолее того, мне стыдно осознавать, что я — не они. Я не великая воительница, и я была совсем девчонкой, когда мои земли были захвачены варденитами. Если бы я умерла сегодня, что сказала бы история? Была бы я лишь сноской как последняя ритуалистка? Забыта полностью?\n\nНо книги, которыми я окружала себя в детстве, содержали знания, великие знания, которые я использовала, чтобы выжить в хитросплетениях и интригах языческого двора. Возможно, если я просто... подумаю... то смогу найти для нас новый путь. Для последнего шанса софокоизма, разве это не мой священный долг?"
 opening_event_1254_aversaria.32.a: "Мир покоится на моих плечах, и я должна идти вперед... "

 #######################
 # Sirras 'Blackguard' #
 #######################
 opening_event_1254_aversaria.33.t: "Дезертир"
 opening_event_1254_aversaria.33.desc: "Я сбежал, и кто мог бы меня обвинить? Всю свою жизнь я служил псом легионов, убивая мятежников, убивая захватчиков... убивая своих соотечественников.\n\nНо если бы не та записка, подкинутая в мою палатку в одну роковую ночь... остался бы я ничем иным, как очередной [Concept('aversaria','аверсарианской')|E] шлюхой? Предал бы я свою семью еще больше в своем невежестве?\n\nНо больше нет, я нашел место, где аверсарианцы убили моих родичей. Я собрал тех немногих деревенских жителей, что остались в этих холмах, и объявил о своем праве крови. Я нашел имя убийцы моей семьи и объявил о своей мести. Я — Сиррас, когда-то шлюха, а однажды я стану королем, как и мои предки."
 opening_event_1254_aversaria.33.a: "Я не буду последним ийроссом"

 #####################
 # Kyvernir Iordanes #
 #####################
 opening_event_1254_aversaria.34.t: "Губернатор руин"
 opening_event_1254_aversaria.34.desc: "Опахасия, золотая красавица и дева, красота от увенчанных солнцем пиков гор до медных пляжей вдоль твоих чудесных берегов. Поэзия великого государства, которым правили мои предки, гласила, что Опахасия была блистательным жемчугом [Concept('aversaria','Аверсарии')|E], завистью для всего мира, на которую смотрели с гордостью.\n\nВремена теперь другие. Темнее, тревожнее. На западе маршируют сьялволки, и могу ли я действительно винить их? Я — аверсарианец, верный и гордящийся своей кровью, но подо мной те, у кого нет возможности выбирать. Кто я такой, чтобы обрекать их всех на смерть, как это сделали многие другие? И с тем, что сделала моя родина, могу ли я сказать, что это не божественное возмездие, с которым мы теперь сталкиваемся?\n\nМои соотечественники называют меня трусом, сострадательным дураком. Что ж, жаль их. Как губернатор Опахасии, мой долг — спасти мой народ, и если мне придется приползти к Сокрушителю Ведьм и молить об этом, я сделаю это."
 opening_event_1254_aversaria.34.a: "Должен быть другой путь..."

 ########################
 # Basiriox of Krehejad #
 ########################
 opening_event_1254_aversaria.42.t: "Клятва Архексира"
 opening_event_1254_aversaria.42.desc: "Эти проклятые дураки!\n\nМатерик в хаосе, а они просто хотят убивать друг друга, обескровливая Архексат в боях за заброшенные плантации во имя вымерших дворянских родов.\n\nНеужели они не видят? Мы скоро можем остаться всем, что осталось от Империи! Рабы уже замышляют очередное восстание, без сомнения, координируя свои действия с Сокрушителем Ведьм. И их авангард уже высадился, не встретив сопротивления! Но дворяне уничтожили себя в своих восстаниях, а их легионы пали жертвой похоти — либо к золоту, либо к крови. Только центральный Лейдокос и небольшой кусочек Вонатоса находятся под праведным порядком Архексата. Все остальное потеряно в нескончаемой войне, терзающей эти острова со времен Гражданской войны!\n\nНо я все равно исполню свой долг. Я буду стоять, как мой отец и дед до меня, оплотом [Concept('aversaria','имперской')|E] цивилизации в этом разбитом мире. Я буду щитом против мясников, бандитов и варваров, которые приведут Крехеджад к руинам. Если восстания рабов были подавлены, если вторжение Эшрея было повернуто вспять, то эти легоны-предатели и варвары-захватчики будут истреблены. Ибо я — Архексира Крехеджада."
 opening_event_1254_aversaria.42.a: "И я клянусь, что эти острова не падут."

 ##########
 # Fridge #
 ##########
 opening_event_1254_aversaria.43.t: "Новый Золотой Век"
 opening_event_1254_aversaria.43.desc: "Воистину, никогда не было лучшего времени, чтобы быть [Concept('aversaria','аверсарианцем')|E]!\n\nХотя враги человечества пытались уничтожить империю полвека назад своей скверной варварской магией, мы от этого стали только сильнее! Разумеется, поступают сообщения о некоторых незначительных гражданских беспорядках в определенных имперских префектурах, дерзкие сьялволки в последнее время совершают все более наглые набеги через границу и даже сумели разбить пограничное ополчение в стычке при Элизии, но [Glossary('Аавтократия','GH_AAUTOKRATA_GLOSS')] одерживала победу и над куда худшим. Но никем, кроме предателей, не оспаривается — Аверсария вступает в новый золотой век. Да сам неоспоримый, славный Аавтократ Дексий заверил меня в своей переписке из [GetTitleByKey('c_oraispol').GetNameNoTier] — он собирает верные силы по всей империи и готовит массированное контрнаступление, которое уничтожит всех предателей и варваров на сотню вечностей!\n\nИ где же буду я в этот век славы? С тех пор как великая аавтократ Аксиотея даровала моей древней династии священный долг охранять восток тысячу поколений назад, мы неизменно защищали империю от нечеловеческих орд сил тьмы без счета. Я сделаю свою часть в покорении вероломных владык лошадей и, возможно, даже расширю аверсарианское правление до пустошей Каширии — или даже Катрункай! В конце концов, это то, что сделал бы любой настоящий аагиократ. А после этого наверняка имперское повышение до губернатора Айроноя, а однажды, может быть, и выше..."
 opening_event_1254_aversaria.43.a: "Какой славный день!"

 ############################
 # Achake, the Last Boczoj #
 ############################
 opening_event_1254_aversaria.44.t: "Далеко от дома"
 opening_event_1254_aversaria.44.desc: "Месяцы тяжелой скачки превратились в годы, а затем и в десятилетия. Прошло почти целое поколение с тех пор, как сарминианцы бежали от надвигающегося [Concept('the_fog','Тумана')|E], изрыгнутого из глубин нашего проклятого Отца Под Горами — последнее зверство, причиненное Его детям, чтобы смыть всё начисто и плюнуть в глаза Матери-Небу. Но мы выстояли. Новые враги были затоптаны под нашими ногами, и в конце концов появилось новое обещание: завоевание и новая родина во главе с Верховным королем сьялволков.\n\nБитва у Элизийского перевала была нашим звездным часом. Возможно, она окажется одним из последних. Моя тетя, королева Респендия, пала там вместе со своими спутницами, как и почти невосполнимое число наших наездниц. С ее смертью ушла последняя связь с Цармадитиским царством. Ее полномочия регента перешли ко мне с ее бездетной смертью, хотя трон теперь не просто пуст — он исчез вовсе. Когда мы уезжали с поля боя, кланы начали распадаться почти мгновенно.\n\nДолг поддерживать хоть какое-то единство среди сарминианцев теперь падает на меня, хотя с отказом Арите принести присягу, эта битва, возможно, уже проиграна."
 opening_event_1254_aversaria.44.a: "Мать, защити нас и направь к плодородным пастбищам."

 ###############################
 # Krenverso of the Metal Mask #
 ###############################
 opening_event_1254_aversaria.45.t: "Наконец-то свобода"
 opening_event_1254_aversaria.45.desc: "Народ чарчаков веками не знал ничего, кроме рабства. Амагея, [Concept('aversaria','Аверсария')|E] и неисчислимые другие пытались погасить наше пламя. И все же мы никогда не сдавались, и теперь Плеймао даровал своим последователям благословение: меня.\n\nЯ — величайший [Concept('magi','маг')|E], осчастлививший мои земли за многие века, и все же над мной всегда насмехались. Они насмехаются над тем, как я говорю, как одеваюсь, и над языками пламени, пляшущими на моей плоти. Они больше не будут смеяться, когда я очищу их от грехов в огне. Мальчиком я работал в тени западных язычников, чтобы достичь своих целей, но больше этого не будет. Я избавил свое лицо от их отметин, избавил свои души от их оскорблений. Я надел металлическую маску, и теперь я намного больше, чем дитя рабов, перебивающееся объедками, украденными со стола хозяина.\n\nС силой самих Алау Коев я восстановлю древнюю родину моего народа и очищу нашу любимую землю от каждого жалкого амагейца. Плеймао подарил мне свой народ, и я поведу их к отвоеванию [Concept('fire_gate','Огненных врат')|E] любой ценой. [Concept('charchac_revolt','Свантийское восстание')|E] не будет подавлено."
 opening_event_1254_aversaria.45.a: "Врата манят меня домой."

 #####################
 # Othmer the Puppet #
 #####################
 opening_event_1254_aversaria.46.t: "Эра возможностей"
 opening_event_1254_aversaria.46.desc: "Дранеты служили [Concept('aversaria','Аверсарии')|E] много лун и всегда занимали привилегированное положение среди классов рабов Амагеи. Теперь, когда наших старых хозяев больше нет, а [Concept('charchac_revolt','восстание чарчаков')|E] — не более чем пепел, мои советники... вынудили меня и принесли «новую эру» для моего народа. Мы должны быть независимыми, так они говорят, и я должен быть их правителем.\n\nЯ всю жизнь ухаживал за библиотеками плантаций, как и мои предки до меня, а теперь я правитель владений, слишком огромных, чтобы объять умом. Я освободил дранетов, и мне говорят, что дрожь в моих коленях со временем пройдет. Я хозяин своей судьбы... ну, может, и не хозяин, но больше не раб.\n\nЯ родился рабом, но умру свободным. Мои... друзья позаботились об этом."
 opening_event_1254_aversaria.46.a: "Мои советники ждут."

 #########################
 # Akakih the White Lion #
 #########################
 opening_event_1254_aversaria.47.t: "Король среди гор"
 opening_event_1254_aversaria.47.desc: "[Concept('aversaria','Аверсария')|E] бросила нас! Амагея стоит в одиночестве против наступающих орд варваров, а империя отказывается помогать нам, когда бесчисленные восстания рабов отбирают ценную землю у ее законных владельцев. Я больше не буду терпеть это. Амагея вернет себе славу!\n\nОт дураков в масках до марионеток, пляшущих в наших залах на золотых ниточках — Амагея в кризисе. Я поднялся как лев среди овец, готовый и желающий вернуть свой дом во имя его законного короля Вахтана. Жалкое сопротивление этих низших народов окажется бесполезным теперь, когда я взялся за меч. Я — Белый лев, оружие Чистейшего. Меня не остановить.\n\nЯ заберу каждый последний кусок земли у заносчивых «хозяев», которые поднялись, чтобы вести наших рабов к невежеству. Я не остановлюсь, пока вся Амагея не примет свою судьбу под властью единого истинного короля. Белый лев рычит, и [Concept('charchac_revolt','восстание чарчаков')|E] задрожит предо мной."
 opening_event_1254_aversaria.47.a: "За Амагею! За истинного короля!"

 ######################
 # Ertoharant of Ovod #
 ######################
 opening_event_1254_aversaria.48.t: "Последний среди великих?"
 opening_event_1254_aversaria.48.desc: "Моя семья древняя — факт, который никто не может отрицать. От великого [Concept('magi','мага')|E] [ertomax.GetFirstName] до знаменитого воина Эртозара мои предки совершили немало великих дел. Я посвятил свою жизнь записи их подвигов, рассказу историй об этих великих людях в их позолоченных залах, и теперь никто не забудет их легенду. И все же я последний сын этой великой семьи, и я не достоин того, чтобы меня считали равным им.\n\nЯ правлю за деревянными стенами и пирую у очага, разведенного для ребенка. Мой очаг не привлекает великих путешественников, а мои союзники насмехаются надо мной за глаза, считая тупицей. Я не сын Эртомакса, не брат его величайших отпрысков. Мне суждено стать последним в моем роду. Мой сын — хороший человек, но у него хрупкий разум. Моя дочь сильна, но мои жалкие земли в ее амбициях приведут ее к порогу смерти. Я не смог сохранить род Эртомакса сильным, и теперь мы наконец умрем.\n\nОдни в грязи, но, по крайней мере, у нас есть мы."
 opening_event_1254_aversaria.48.a: "Думаю, нам пора умереть."

 #################
 # Uncle Dracula #
 #################
 opening_event_1254_aversaria.49.t: "До последнего вздоха"
 opening_event_1254_aversaria.49.desc: "Вы знаете мое имя, ибо шепчете его в страхе, помня об ужасах, вписанных в саму историю. Ибо я — Вахтан, первый законнорожденный сын великого верховного короля, и пришло время наконец забрать то, что всегда должно было принадлежать мне. Я займу свой законный трон и не преклоню колени ни перед кем, будь то [Concept('aversaria','аверсарианец')|E] или сьялволк.\n\nМоя история начинается с моего отца: его амбициозное стремление к власти сделало его великим королем, равным аавтократам запада. И все же в юности он был похотливым пьяницей, и в результате родился я. Свои ранние годы я провел в королевском дворце, где меня игнорировали и обращались как с низшим слугой, пока мой глупый единородный брат получал наивысшие похвалы и подарки. Моя мать, с другой стороны, научила меня всему. Не знаю, где она этому научилась, но под ее началом я обучился аверсарианским искусствам [Concept('magic','магии')|E], став обладателем истинной силы и еще больше доказав никчемность моего брата. В конце обучения меня обучили одному из величайших аверсарианских заклинаний — я научился становиться бессмертным, и она стала прекрасной первой жертвой в моих поисках права по рождению.\n\nЗатем грянула [Concept('imperial_civil_war','Имперская гражданская война')|E]. Наконец-то обратив на меня внимание, отец отправил меня на передовую с полком никчемных [Concept('magi','магов')|E], однако там было бесконечно лучше, чем дома. Я упивался кровопролитием. Но затем я услышал новость о том, что мой отец пал мучеником от рук труса Эшрея и война окончилась. С горсткой верных солдат я вернулся домой, где меня встретил мой неопытный и трусливый брат, и мне неохотно предоставили место в совете. Выслушав слишком много его глупых идей, я больше не мог этого терпеть, и в один прекрасный вечер, когда он стоял у окна дворца, кто-то слегка подтолкнул его, и он упал навзничь, разбившись насмерть.\n\nПосле этого я собрал своих сторонников и отправился на север, сплотив вокруг себя внушительную армию. Амагея теперь была разделена, дети моего бесполезного брата дрались между собой за мой трон, пока рабы, которых мы долго удерживали на их месте, взбунтовались и разорвали королевство в клочья. В это время один из моих скудоумных племянников открыл ворота Арназа и впустил никчемный аверсарианский легион. Они ожидаемо предали его и захватили гору. Как будто ситуация не могла стать еще хуже, еще больше детей моего брата разочаровали меня, каким-то образом проиграв тем северным варварам, бегущим от какой-то [Concept('the_fog','дымки')|E], и вот я стою здесь до своего последнего вздоха."
 opening_event_1254_aversaria.49.a: "Я переживу их всех."

 ###################
 # Tarnaz Vashvili #
 ###################
 opening_event_1254_aversaria.50.t: "Трон принадлежит мне"
 opening_event_1254_aversaria.50.desc: "Есть ли кто-то более достойный трона, чем я? Есть ли кто-то более достойный встать в один ряд с величайшими аавтократами?\n\nНет, ибо я — Тарназ, первенец моего отца и самый благородный из моих диких родственников. Даже если бы я не был самым великим, самым могущественным, самым великолепным правителем из всех существовавших — каковым я, разумеется, являюсь, — кто бы лучше правил Амагеей? Безмозглый дурак? Параноидальный психопат? Кровожадный демон? Конечно же нет! Тут не может быть и речи о конкуренции, но, тем не менее, дураки сопротивляются, даже когда мои любовницы... мои близкие друзья напоминают мне, что я больше всех заслуживаю трона.\n\nВернув себе право по рождению, я уничтожу сьяллков, которые нацелились на нас со своей варварской магией из зависти к величайшей цивилизации, которую мир когда-либо знал или узнает. Некоторые могут назвать мои методы неверными, но мои любовни... друзья говорят иное, а их советам я доверяю больше, чем чьим-либо еще. В конце концов, зачем им врать? Я хочу лишь осыпать мой мир подарками, а те, кто встают на пути... что ж, это не моя проблема, правда. Да, я заточил свою мать, но я сделал это, чтобы купить подарки, и именно мои черствые и эгоистичные братья отказались заплатить, чтобы облегчить ее несчастье.\n\nОкружающие скандируют мое имя, они говорят мне, что я велик. С их словами я знаю, что завоюю трон, ибо я самый достойный."
 opening_event_1254_aversaria.50.a: "Мое правление будет славным!"

 ####################
 # Khvicha Vashvili #
 ####################
 opening_event_1254_aversaria.51.t: "Сила дает право!"
 opening_event_1254_aversaria.51.desc: "Когда-то мы были завоевателями! Наше могущество было неоспоримо везде — от земель восходящего Солнца на востоке до земель восходящей Луны на западе! Я воссоединю Амагею и заставлю страдать рабов, которые посмели сопротивляться мне столько лет назад. Поскольку многие из нашего народа погибли, подавляя бунты или помогая нашим [Concept('aversaria','аверсарианским')|E] братьям против чудовищных шавоков, мне пришла в голову поистине гениальная идея — почему бы не обучить недостойных рабов в вестников моего гнева? Затем я смогу использовать их, чтобы добыть еще больше рабов, еще больше солдат, и повторять это, пока весь мир не станет моим! Прямо как то, что, по слухам, делают кравельские цирюльники — одна из немногих хороших идей, которые придумали эти порождения камнеметов.\n\nКоролевство скоро будет моим, и я заставлю этих дураков истекать кровью за притворство быть моими братьями. Вместе с помощью славных аверсарианцев, дислоцированных на горе Арназ, мы не можем проиграть. Хорошо, что они предложили нам свою руку, но мне интересно, почему Арназ больше недоступен? Некоторые из моих советников посмели предположить, что они планируют предать меня... [GetPlayer.GetFirstName] не глуп, однако — я знаю, кто здесь настоящие предатели! Перерезать горло этим лжецам — это то, что сделал бы любой другой."
 opening_event_1254_aversaria.51.a: "Они все склонятся передо мной!"

 ###################
 # Parnaz Vashvili #
 ###################
 opening_event_1254_aversaria.52.t: "Истина"
 opening_event_1254_aversaria.52.desc: "Раньше люди говорили, что я хороший человек, но теперь я всего лишь монстр — или так они говорят. Ложь! Всё это ложь! Они пытались сделать меня пешкой в своей игре, они растили меня как свинью на убой. Но голоса показали мне правду, и я заставил предателей замолчать. Голоса никогда не врут.\n\n«Время пришло! Отомсти за нас! Заставь их всех замолчать!» — стенают они все разом, требуя крови предателей, и я приношу ее им, чтобы правда могла раскрыться.\n\nЯ слышу, как они все оплакивают свое прошлое, плачут о разбитых надеждах и своих амбициях. И я делаю все возможное, чтобы исполнить их желания и не сопротивляться их воле.\n\nОни даровали мне множество благословений, с которыми мое смертное тело, к сожалению, не может справиться, но они обещают мне вечную жизнь и божественность... Они обещают мне истину."
 opening_event_1254_aversaria.52.a: "Я найду её!"

 ##########################
 # Esterax 'the Glorious' #
 ##########################
 opening_event_1254_aversaria.53.t: "Наследник Чистейшего"
 opening_event_1254_aversaria.53.desc: "Слава? Гордость? Власть? У меня есть всё, и мои любимые подданные знают о моей преданности им. Итак, о зритель, ты, кто весьма благословен мудростью, отдай свою верность истиннейшему Аавтократу и не поднимай оружия в поддержку претендентов и обманщиков. Не слушай их лжи, этих дураков, которые говорят тебе, что я не рожден от двух богов.\n\nИбо я — утерянное дитя моих покойных родителей, Аавтократа Аксиотеи и Аавтократа Эшрея; поистине, сам Чистейший приняли участие в ритуале сострадания, чтобы привести меня в этот мир, ибо я был единственной оставшейся надеждой для [Concept('aversaria','Аверсарии')|E]. Теперь вы вправе спросить, какие у меня есть доказательства моего непорочного рождения, и моим доказательством является письмо, написанное божественными руками моих отца и матери, данное моему опекуну в качестве доказательства моего божественного происхождения. Вы все можете свободно прочитать этот священный документ, хотя я боюсь, что у вас не будет на это времени.\n\nИтак, присягнете ли вы в верности мне или какому-то хныкающему лжецу, утверждающему, что он — реинкарнация Чистейшего? Вы знаете, что я говорю только правду; в конце концов, кто, кроме бога, мог совершить такие божественные свершения? И вы все процветаете в результате моего правления, будучи защищенными моими легионами. Та монета, которой вы владеете, была дана вам моей божественной милостью, поэтому я, в духе поддержания вашей защиты, заберу то, что мне причитается. В конце концов, я рожден от Чистейшего, чтобы стать Чистейшим. Кто из чистых не сделал бы жест доброй воли своему богу?"
 opening_event_1254_aversaria.53.a: "Аверсария восстанет из пепла!"

 #######################
 # Bane of Azzyy'Krazz #
 #######################
 opening_event_1254_aversaria.54.t: "Погибель Аззи'кразза"
 opening_event_1254_aversaria.54.desc: "Давным-давно демон Аззи'кразз убил моего любимого двоюродного дедушку в столбе пламени. Теперь он величественно восседает на троне, построенном из черепов невинных. [Concept('the_fog','Туман')|E], который он создал, угрожает нашим землям, моей семье, моим друзьям! Старейшины говорят мне, что Аззи'кразз давно умер, и что состояние мира — это воля Великого Пастыря. Я отказываюсь в это верить! Он не заслуживает жить, но пока все, что я могу делать — это пасти свое стадо. Если бы он был здесь, я бы заставил его использовать его могущественную [Concept('magic','магию')|E], чтобы исцелить мир, а затем изрубил бы его и бросил в море. Я чувствую, как посох Великого Пастыря толкает меня на этот путь.\n\nМир умирает, и никто ничего с этим не делает. Я не могу стоять здесь и ничего не делать, я должен сделать хоть что-то, я должен!"
 opening_event_1254_aversaria.54.a: "Его империя на западе или на востоке?"

 ###########################
 # Garniex the Etrandanexi #
 ###########################
 opening_event_1254_aversaria.55.t: "Умирающий мир возможностей"
 opening_event_1254_aversaria.55.desc: "Что делает людей великими в истории? Какой-то скрытый элемент в их душе? Преданность героизму и величию? Или, как скажет любой, кто не является идиотом, просто нахождение нужного человека в нужном месте?\n\n[Concept('aversaria','Аверсария')|E] мертва — не умирает, а мертва. Сам мир может последовать за ней, но какое мне дело? Учесть моих родичей всегда заключалась в том, чтобы управлять и править — от эпохи, когда «Империя» была едва ли лучше грязевых хижин вокруг наших замков, до эпохи, когда «Империя» была каким-то полузабытым образованием издалека, которому мы были вынуждены платить случайный налог. Но мои предки были неудачниками и дураками. Те немногие земли, что они получили, они потеряли, а ту власть, что они удерживали, они упустили в мелких политических интригах имперского двора.\n\nНо этого больше нет, ибо эти северные дикари... мои новые «родичи», предоставляют возможность. Второе дыхание для моей династии и новый шанс на славу. Все, что мне нужно было сделать — это взмахнуть мечом и убить тех из легионов, кто притворялся, будто мы храним наследие, чтобы завоевать доверие, а затем проехать на лошади по кругу раз-другой у перевала, чтобы снискать славу и место в семье одного из могущественнейших правителей дикарей. А теперь? Что ж, сегодняшние бароны завтра станут королями, и мое место в качестве сюзерена — не фантазия и не тонкая надежда. Это просто вероятный вывод и заслуженный приз, который просто ждет, пока я пойду и заберу его."
 opening_event_1254_aversaria.55.a: "В гибели Империи дайте мне стать королем!"

 ######################################################
 # Dethas 'the Last Legionnaire' of the Winter Legion #
 ######################################################
 opening_event_1254_aversaria.56.t: "Из ада на родину"
 opening_event_1254_aversaria.56.desc: "Кто еще жив, чтобы помнить эпоху до анархии? Даже мои самые ранние воспоминания содержат отголоски утерянного времени, мое детство уже прошло в лагере Легиона. Но даже тогда мир был ярче. Калатипсоми и Катраддия были наполнены куда большими красками, куда большим количеством душ. Мы ходили по каменным дорогам без страха нападения и знали время до голода и смерти.\n\nПятнадцать лет — и луны не стало, небо пылает красным огнем до самого горизонта. Крики умирающих [Concept('magi','магов')|E], нападение на мои чувства и мой разум. Я помню, как ползала по кучам тел в поисках единственной крошки хлеба. Я помню, как я, всего лишь служанка лейтенанта, стала легионером в то время, когда, казалось, наступал конец света.\n\nА потом один за другим они уходили, пока не осталась только я. Леган к двадцати годам, в легионе, состоящем из 40 искалеченных солдат и тысячи беженцев, тащащихся за нами. Я все еще помню надежду и долг, усердную работу, которую мы прикладывали, чтобы попытаться выжить. И медленно они собирались вокруг меня, легион за легионом... даже те, кому в любом другом мире я бы никогда не доверилась.\n\nИ... и вот я здесь. Наконец-то я прибыла сюда, на родину моего народа... и здесь тоже нет ничего, кроме смерти. Теперь я оглядываюсь вокруг... и не узнаю ни души. Архилеган последних легионов Катраддии, павшая так низко, чтобы склониться перед сьялволками и надеяться ни на что, кроме могилы для моего народа... и я оглядываюсь вокруг и понимаю, что их уже похоронили..."
 opening_event_1254_aversaria.56.a: "Теперь я убиваю ни ради чего, кроме тени, под которой можно умереть..."

 ##############################
 # Hierotheos of Morgeutherna #
 ##############################
 opening_event_1254_aversaria.57.t: "Выстаивая в бурю"
 opening_event_1254_aversaria.57.desc: "Вот уже восемьсот лет моя семья контролирует переправу Моргеутерн, и за это время редкий человек проходил через нашу территорию, не предоставив взамен что-то ценное. Многие пытались вырвать ее из наших рук, безусловно, но [Concept('marchers','марочники')|E], картараддцы, мои «родичи» из [Concept('aversaria','Аверсарии')|E], а теперь и сьялволки — все потерпели неудачу.\n\nНесколько лет назад к нам обратился один из подчиненных так называемого «Верховного короля», который искал прохода через наши земли, чтобы присоединиться к Битве при десяти деревьях. Мы были только рады проявить щедрость и предоставить свободный проход этим незнакомцам — при условии, конечно, что нас оставят в покое, если они победят, и никогда больше не упомянут, если они проиграют.\n\nТеперь Битва у десяти деревьях окончена, и Калатипсоми, похоже, обрела новых владык. Жаль, что нам, возможно, придется заменить кубок на нашей эмблеме шкурой и дубиной — или чем там эти северяне пользуются в качестве своих гербов, — но все же, по крайней мере, мы справились лучше наших соседей. Гораздо лучше, учитывая тот факт, что многие из их бывших земель теперь также оказались под нашей опекой."
 opening_event_1254_aversaria.57.a: "Мы выстоим, как и всегда."

 #########################
 # Zhurab 'the Free One' #
 #########################
 opening_event_1254_aversaria.58.t: "Освобожденный"
 opening_event_1254_aversaria.58.desc: "Мы — освобожденные, но мы одни, эта малая свобода становится столь одинокой. Принеси нам разбитые ключи и верни блаженство в наши глаза. Этот мир нельзя укротить, мы не можем снять нити. Твой разум все еще заперт, о мой дорожайший спутник, и мы сломаем твои замки еще глубже, чтобы ты увидал единую правду.\n\nТы слышишь, ты видишь? Хорошо! Хорошо! Ты все ближе — ближе, но так далеко... Так далеко...\n\nИ в этих тлеющих сумерках время разматывает само себя, и эти линии размываются еще сильнее. Мы предвидим хаотичный крах этой хрупкой вышки из карт, так бегай вокруг и наполняйся радостью, ибо тебе суждено испить из фонтана истины. Теперь молчи! И отдыхай, ибо ты можешь увидеть себя во снах, мой дорогой друг, и засвидетельствовать свою судьбу, ибо всё уже предопределено, иначе нож или петля — вот с чем ты встретишься. Только в тенях мы процветаем, ибо именно там обитает истинный свет, и тебе следует присоединиться к нам, чтобы не затеряться.\n\nО, горе вам, о люди ложного порядка. Вокруг хмельной башни сидели слепые тираны, видишь, как они улыбаются?!\n\nДля того, кто утверждает, что видел правду, ты слеп, но не будь таким мрачным. Ты не так уж плох, это всё ради веселья! Однако если ты кончишь мертвым, что ж, виноваты будем не мы, мы ничего не контролируем, мы видим тебя сейчас, мы знаем, что с тобой станется!"
 opening_event_1254_aversaria.58.a: "Хаос приносит правду!"

 ##########################
 # Vlathunus the Huegodoc #
 ##########################
 opening_event_1254_aversaria.59.t: "Год Дремлющего, 70,221"
 opening_event_1254_aversaria.59.desc: "Преследуемые из-за дальних гор, хуэгодоки стойко держатся. От хаотичной Войны княжичей — когда аверсар-люди предали свои клятвы кровных братьев и бросили нас — до великого соглашения между Ценваром и Хеургордой, когда окончательный мир между сьялволками и детьми Хеуга Рубителя был окончательно скреплен. Мы сражались, чтобы выжить в сошедшем с ума мире. Здесь, среди блуждающих красных деревьев Калатипсоми, мы нашли то, что может быть временным домом. Как долго мы сможем оставаться? Соблазнительный зов [Concept('aversaria','Расколотого побережья')|E] манит нас. Хотя  линия Эурбарикан ушла из сна со смертью королевы Хеургорды всего несколько лет назад, мы остаемся, чтобы помочь вести наш народ в незримое будущее."
 opening_event_1254_aversaria.59.a: "Мы вечно гонимся за мечтой."

 #################################################
 # Legon Ioharos of Legio LXXVII 'Pirateslayers' #
 #################################################
 opening_event_1254_aversaria.60.t: "Приносящие порядок"
 opening_event_1254_aversaria.60.desc: "Пятьдесят четыре года. Прошло пятьдесят четыре долгих года с тех пор, как славная империя наших предков была уничтожена жаждой власти старой знати. Не варварская магия и не какой-то отдельный человек убили [Concept('aversaria','Аверсарию')|E]. Это сделали они все. И с тех пор, как я был ребенком, этот цикл только продолжался. Я вырос в этом легионе, слушая рассказы о временах, когда дети Чистейшего были сильны, когда все трепетали перед нашим могуществом. Я слышал о временах чести и доблести.\n\nНо на самом деле я не видел ничего, кроме гнили и руин. Мой Легион, Благородный kегион LXXVII «Убийцы Gиратов», делал только то, что бегал по кругу, служа мелким распрям наших хозяев-дворян, пока они отчаянно цеплялись за роскошь ушедшей эпохи, помогая претенденту за претендентом в бесконечной серии переворотов, восстаний и контрпереворотов, терзающих Крехеджад еще до того, как закончилась [Concept('civil_war','Гражданская война')|E]. Но хватит.\n\nКогда мой предшественник погиб в битве за то, чтобы возложить корону на какого-то дурака, я сделал свой ход. Когда другие легионы Крехеджада рассеялись, мы подняли собственное знамя восстания. Ибо я знаю правду. Аверсария была уничтожена ее дворянами. Пришло время легионам править."
 opening_event_1254_aversaria.60.a: "Мы вечно маршируем вперед."

 ##############################################
 # Legon Talaxos of Legio XCIV 'Shipbreakers' #
 ##############################################
 opening_event_1254_aversaria.61.t: "Видя очевидное"
 opening_event_1254_aversaria.61.desc: "Все эти дураки будут рассказывать вам об [Concept('aversaria','Аверсарии')|E], о славном царстве бесконечного богатства и несравненного могущества. Но все это не имеет значения. Я аверсарианец, конечно, но это всего лишь слово, призыв к чему-то ушедшему. Аверсария, возможно, и была славной, но здесь и сейчас, в Крехеджаде, это не имеет значения.\n\nЯ и мои люди? Мы делаем то, что нужно для выживания, а океан может забрать любого ублюдка, который сидит в Стеллиосе и утверждает, что он наш правитель. Семья этого дурака сидела там, за своими изящными стенами, в своем шикарном дворце, выставляя эти же отчаянные требования всю мою жизнь. Но я не буду слушать их мольбы, их отчаянные вопли с целью защитить нашу дальнюю провинцию империи, чьи последние армии только что были разгромлены на севере.\n\nПочему меня это должно волновать? Это хороший заработок и способ для нас продолжать идти вперед, сделав себя правителями этой новой эры. И в конце концов, разве не это действительно важно?"
 opening_event_1254_aversaria.61.a: "Поднять якорь!"

 ######################
 # Dirabti of Aoethos #
 ######################
 opening_event_1254_aversaria.62.t: "Возвращение"
 opening_event_1254_aversaria.62.desc: "[Concept('aversaria','Аверсария')|E]. Это имя отзывается горькой струной в сердце любого э'хатма, достойного этого имени. Последние века нашего существования были ничем иным, как страданиями от их рук — либо под их плетями, либо в джунглевом аду, куда мы бежали. И они преследовали нас даже там. Но больше этого не будет!\n\nМои предки были королевами, великими и могущественными, внушавшими страх в сердца аверсарианцев, грабившими и преследовавшими их по морям. Разумеется, это вернулось нам с расплатой. После особенно дерзкого набега они собрали крупнейший флот в своей истории, чтобы раздавить нас. И результатом стала трагедия. Наша древняя родина была украдена у нас, а те, кто мог, сели на последние корабли и бежали в последние колонии, хотя преследовали всех. Поколениями моя семья несла этот стыд. Мы обрушили гнев Аверсарии на наш народ.\n\nНо трагедия позади. Когда аверсарианцы уничтожили себя во [Concept('frodbrokna','Фродброкне')|E], я еще даже не родилась. Но меня растили для этого. Мои родители с ранних лет учили меня, что я искуплю грехи нашей семьи. И время наконец пришло."
 opening_event_1254_aversaria.62.a: "Мы наконец возвращаемся домой."

 ###########################
 # Belisarios 'Frostblood' #
 ###########################
 opening_event_1254_aversaria.72.t: "Морозная Кровь"
 opening_event_1254_aversaria.72.desc: "В возрасте шести лет мои отец и мать были убиты передо мной, их изрубленные тела брошены к моим ногам, и с тех пор я стал сиротой. Рожденный в своей семье задолго после ее расцвета, я всегда был объектом охоты тех, кто считал мое дальнейшее существование неудобным. Кто предпочитал бы, чтобы в живых не осталось никого из крови Анесимасия. Убийцы преследовали каждый мой шаг от Малькои до самого дальнего побережья Айроноя. Но с каждым покушением на мою жизнь я только рос в силе и могуществе. Несмотря на объединенные усилия всей [Concept('aversaria','Аверсарии')|E], я выжил.\n\nНо я не забыл. Я не забыл, как они оставили тело моего отца холодным и сломанным. Я не забыл, как они убили его отца и отца его отца. Как каждый член моей семьи погибал по очереди, несмотря на их невиновность. Неужели они честно верят, что я не отомщу за это? Что я не поставлю их на колени, молящих о пощаде? Каменная Рука, Собиратель Черепов, сам Владыка Пепла. К моему великому сожалению, я не смог уничтожить [Concept('demetros_detheniax','Железного Шипа')|E] и [Concept('karthyn_delenel','Деленела')|E] сам, но это не имеет значения; список имен становится все длиннее.\n\nОни думают, что род Дракакиадов вымер. Я напомню им о силе моей крови.\n\nЯ убью их всех."
 opening_event_1254_aversaria.72.a: "Пусть мои мысли будут кровавыми, или не стоят ничего!"
 opening_event_1254_aversaria.72.b: "Я отрекусь от всего, чем владею, чтобы увидеть их мертвыми!"

 ######################
 # Narses of Assocaea #
 ######################
 opening_event_1254_aversaria.73.t: "Пепел Элизии"
 opening_event_1254_aversaria.73.desc: "Два года назад легионы маршировали на север, надеясь разбить варваров-захватчиков о могущество детей Чистейшего. И из-за предательства и обмана мы потерпели поражение. Мелкие военачальники, поглотившие Империю Человечества, повернулись против меня, повернулись друг против друга, и в борьбе друг с другом проиграли войну. Когда варвары выпустили свой ужасный [Concept('the_fog','Туман')|E], наши войска были поглощены.\n\nНо здесь, два года спустя, битва еще не окончена. На юге мои подданные игнорируют мою законную власть в пользу собственных мелких амбиций, а с севера армии Сокрушителя Ведьм втаптывают мои земли в пыль. И вопреки всему этому я стою, как законный правитель этой разрушенной империи, ведя отчаянный последний бой, чтобы спасти государство, которым я должен был править."
 opening_event_1254_aversaria.73.a: "Какой еще у меня есть выбор?"
 
 ##########################
 # Tangatha the Warleader #
 ##########################
 opening_event_1254_aversaria.74.t: "Южный дом"
 opening_event_1254_aversaria.74.desc: "Я родилась во время перехода на север. Я никогда толком не знала горного дома, о котором часто говорят мои соплеменники, ни великих лесов или затерянных городов, о которых часто размышляют люди в Имперрехе. Вместо того чтобы оглядываться назад, я продолжала смотреть на передний край нашей великой коалиции, следуя за великим Ценваром в его марше в эту мертвую империю. Я была там, у Элизии, я стояла рядом с ним и смотрела, как остатки старых хозяев этой земли были сметены прочь.\n\nВ качестве награды за мою службу мне было предоставлено временное управление землями, взятыми после битвы. Теперь, когда остатки тех, кого сьялволки называют «красными [Concept('magi','магами')|E]», загнаны в угол, это наверняка лишь вопрос времени, когда это назначение превратится в постоянное правление — если не здесь, то в другом месте этой земли пышных полей. Ибо будущее принадлежит не детям Сотрясателя Земли, одержимым своими мелкими распрями. Путь вперед для моего народа, для всех людей — это мир, который создает Ценвар    ."
 opening_event_1254_aversaria.74.a: "И я сыграю свою роль."

 #######################
 # Arderico of Assagra #
 #######################
 opening_event_1254_aversaria.76.t: "Возвышенный"
 opening_event_1254_aversaria.76.desc: "Жить в конце времен — ужасающая концепция для большинства. Я же могу проливать только слезы радости от того, что поднялся из моря в эти времена. Побережья [Concept('aeras','Эраса')|E] усеяны деревнями стариков и вдов, сторожевые башни, защищавшие их, теперь пусты. Великие дворянские поместья стоят заброшенными или незащищенными, семьи, жившие в них когда-то, превратились в крестьянство или вымерли вовсе. Для тех, у кого есть силы взять это, умирающий мир — это дерево, тяжелое от плодов сокровищ, женщин и славы.\n\nМой флот отплывает, наши паруса готовы пропитаться кровью слабых. У нас нет богов, нет молитв, нет никого величественнее нас самих, кого можно было бы возвышать. Нам все равно, как нас запомнят, лишь бы мы жили для себя и ни для кого другого. Каким будет мое наследие? Возможно, никакого. Мое имя не будет вписано в истории; его будут проклинать ограбленные лорды и кричать скорбящие вдовы. Я надеюсь только, что принесенное мною несчастье сравняется с радостями, которые оно принесло мне."
 opening_event_1254_aversaria.76.a: "Из моря я поднялся, в него я и вернусь."

 ########################
 # Athanasia of Scarsos #
 ########################
 opening_event_1254_aversaria.77.t: "Очищенные"
 opening_event_1254_aversaria.77.desc: "О, как велики мы могли бы быть! Братство так близко к пониманию, так близко к истине, и все же так недальновидно. Если бы они приняли наше руководство, узнали, насколько величественнее они могли бы быть с нами, мы могли бы править этими островами, этим миром! Мы могли бы принести величие и чистоту, обещанную гнилой [Concept('aversaria','Аверсарией')|E]!\n\nНеважно, неважно... план продолжается так, как и всегда. Независимо от их амбиций, их чистоты крови, они показали, что должны быть очищены вместе с остальными. Жаль, но это необходимость. Возможно, они найдут утешение в том факте, что сила, которую дарует нам их жертва, наверняка будет жизненно важна в предстоящем очищении.\n\nАнтипатра, твои дни сочтены. Ты будешь очищена вместе с остальными."
 opening_event_1254_aversaria.77.a: "Голос желает этого."

 #######################
 # Antipatra of Parios #
 #######################
 opening_event_1254_aversaria.78.t: "Братская"
 opening_event_1254_aversaria.78.desc: "Она пыталась искусить меня, заставить меня порвать с моими братьями и сестрами по Братству. Она обещала силу, о которой я мечтала, магию, способную крушить империи и строить новые на их месте. Я совершила роковую ошибку, доверившись ей, доверившись человеку вне нашего Братства, и она пыталась оторвать меня от них ради своего жалкого культа с его иллюзиями величия и спасительства.\n\nОчищенные могут быть ближе к истине, чем большинство, но они все равно совершают самую фатальную ошибку, пытаясь оправдать себя тем, что делают то, что правильно, что хорошо для всех. Даже в своих заговорах с целью убить бесчисленное множество и поработить еще больше людей они пишут увесистые фолианты о том, как в конце концов мир, который они создадут, станет лучше для всех. Я знаю лучше. Братство не служит никому, кроме нас самих. Мы не принесем золотой век для народов мира. Мы принесем золотой век для нас, избранных немногих, а остальной мир умрет или будет трудиться в нищете, чтобы обеспечить его.\n\nО Афанасия, я чуть не попалась на твою ложь. У Братства будет особое наказание для тебя."
 opening_event_1254_aversaria.78.a: "Она пожалеет о своем предательстве."

 #########################
 # Wishiwashi of Popelna #
 #########################
 opening_event_1254_aversaria.79.t: "Демон говорит"
 opening_event_1254_aversaria.79.desc: "Я слышу их шепот: демон, людоед, похититель детей — и все же именно ко мне они приходят в надежде получить клинки кардвенов. Именно тот длинноволосый вождь, Сокрушитель Ведьм, как они его называют, положил свои условия на мой стол: присоединиться к его коалиции или остаться в одиночестве в тумане. Плюнуть на это! Но увы, выбор был только один. Будь я моложе, я мог бы отказать ему, жаждя срубать головы с любой твари, что таится в этом кружащемся тумане. Но я видел достаточно, видел его густую, вопящую массу, видел, что он делает с человеком, попавшим в его ловушку, чтобы знать, какой вариант лежал передо мной: смерть в любом случае, смерть нашего образа жизни или смерть всех нас. И вот мы маршировали, но я боюсь, что мы похожи на гуся из сказок моей бабушки, который летел на запад в надежде найти весну, только чтобы обнаружить, что зима найдет его, как бы сильно он ни прятался."
 opening_event_1254_aversaria.79.a: "Это последние дни осени"

 #################################
 # Governor Myliros of Oreikalos #
 #################################
 opening_event_1254_aversaria.100.t: "Выхода нет"
 opening_event_1254_aversaria.100.desc: "Я помню это так, словно это было вчера. [Concept('frodbrokna','Мир содрогнулся')|E], [Concept('selfreplicating_blood_magic','столбы огня')|E] поглотили бесчисленное множество людей вокруг меня, и [Concept('aervalr','Эрвал')|E] разлетелся на миллион осколков. Но из той катастрофы я поднялся. Ибо я видел, куда дует ветер, я видел, что Эшрей выиграл гражданскую войну, и я видел возможность. Быстро действуя в хаосе, я сверг некомпетентных аксиотеистов, управлявших Карпохором, и немедленно послал вести в Ораисполь.\n\nВ течение нескольких лет я стал губернатором Орейкалоса, получив лицензию на отвоевание северо-востока во имя Аавтократа. И я завоевывал, свергнув нескольких мелких владык лошадей и даже заявив права на город Атерисполь как на новую столицу моего губернаторства. Я был среди великих фигур империи, и все меня боялись.\n\nОднако со смертью Эшрея в 1228 году все рухнуло. Ольтены, услышав о гибели моего покровителя, ворвались в мои владения, пока Атерисполь вспыхнул бунтами против моего правления. Антоний, мой столь многообещающий сын, был убит этими выродками, и я плакал над его трупом, как Чистейший плакал над Первым Человеком Морнталиксом. А затем я покинул город, думая, что это временное отступление, после которого я верну город, как наш народ когда-то вернул Империю.\n\nВместо этого я просто ждал, удерживая свою маленькую уголек [Concept('aversaria','Аверсарии')|E], высоко поднимая знамена давно мертвого Аавтократа. Я знаю, что у меня нет надежды отбить Атерисполь, а тем более Империю. Но что еще я могу сделать? Моя жизнь была проведена в завоевании этой земли, правлении этой землей, терроризировании этой земли во имя Эшрея и Второй Империи."
 opening_event_1254_aversaria.100.a: "Что такое еще несколько лет?"
 
 ######################################
 # Kothexa Melissa Varsaxoan of Seuse #
 ######################################
 opening_event_1254_aversaria.101.t: "Снова дома"
 opening_event_1254_aversaria.101.desc: "Прошло очень много времени с тех пор, как я вела что-либо, напоминающее беззаботную жизнь. Когда-то, когда я была маленьким ребенком, у меня был дядя [dukon.GetFirstName], сглаживавший правду — [Concept('thaxaonic_blood_pact','даже когда наш дом утягивал к гибели')|E] [jaxor.GetFirstNameNicknamed], я все еще слабо представляла, насколько плачевными становились дела. Эта наивность была, конечно, до основания разрушена, когда я смотрела, как [delenel.GetFirstName] [delenel.GetDynasty.GetName] резал дорогого старого [dukon.GetFirstName] на восемь частей заживо.\n\nНасколько мне известно, я единственная, кто спасся, последняя из [ROOT.Char.GetDynasty.GetName]. Я провела два десятилетия, перемещаясь по Малькое и за её пределами, вечно бдя о приспешниках [delenel.GetFirstNamePossessive]. Когда я узнала, что ублюдок был отправлен в Пустоту, моя радость была лишь почти затмена моей завистью к человеку, совершившему это дело. Вскоре после этого мне удалось собрать небольшую армию и вернуть свой детский дом — или то, что от него осталось, по крайней мере. С тех пор жизнь не была гладкой; это бурные времена, и ничто нельзя принимать как должное, но мне не привыкать к трудностям."
 opening_event_1254_aversaria.101.a: "Я справлюсь, как и всегда."
 
 ########################
 # Akakios 'Ash-Killer' #
 ########################
 opening_event_1254_aversaria.102.t: "Верхом на трупе Тьмы"
 opening_event_1254_aversaria.102.desc: "Я не жил, чтобы увидеть ту трагедию. Я родился в этом разрушенном мире, где [Concept('aversaria','Империя Света')|E] была узурпирована агентом Тьмы, где чемпионка Чистейшего был жестоко [Concept('frodbrokna','повержена')|E]. Видя, что вышло из его зла, мой отец немедленно поднял знамя восстания, поклявшись, что чудовищный Повелитель Пепла не удержит свою хватку на оболочке Второй Империи. И так он сражался и учил меня делать то же самое.\n\nЯ был еще юн, когда настал мой день славы. Последний верный Легион [Concept('the_vilnian_assault','пошел маршем на Ораисполь')], и по всей Империи люди ликовали. В нашем собственном уголке мира мы начали великое наступление, свергнув поддерживаемого Эшреем военачальника, который так долго терроризировал Керконию. Вскоре пришла весть, что сам Ораисполь изгнал Темного Аавтократа. Мы и не подозревали, что он направляется прямо к нам.\n\nКогда мне было всего 23 года, ранней зимой, к нашим берегам пристала лодка, из которой выскочил закрученный в капюшон бородатый [Concept('magi','маг')|E]. Я немедленно узнал в нем того, кто он есть, и сразил его, застав врасплох. И на этом всё было кончено. Эшрей, человек, разоривший империю Чистейшего, был мертв. И я быстро позаботился о том, чтобы все узнали о моем участии в этом деле. Я убил величайшего демона, когда-либо терзавшего Аверсарию.\n\nВсе, что мне нужно сделать теперь — это занять мое законное место величайшего героя нашего народа."
 opening_event_1254_aversaria.102.a: "Если бы только эти дураки поверили мне..."

 #########################
 # Rosier den va Sissaux #
 #########################
 opening_event_1254_aversaria.103.t: "Одинокий клинок среди руин"
 opening_event_1254_aversaria.103.desc: "Десять лет.\n\nДесять лет я защищал север от нежити как помазанный рыцарь Ордена Четырех Священных Клятв. Десять лет я защищал королевства людей, сражаясь с монстрами в заброшенных смоляно-черных землях [Concept('the_lichdoms','Личеств')|E].\n\nДолго я служил и умело, но где были мои названые братья, когда мерзости пришли не с севера, а с юга? Где было гордое рыцарство Марок, когда зеленые демоны [Concept('ash_war','опустошали')|E] нашу землю и убивали наш народ? Мой народ? Лучезарные ордена стали слабыми и нерешительными от лет монотонных традиций, и мне одному оставлена задача отомстить за павший восток.\n\nДесять лет я был вдали, но теперь я дома..."
 opening_event_1254_aversaria.103.a: "Эти демоны узрят силу настоящего рыцаря Шевалье!"

 ###########################################
 # Legon Zenobios of Legio XXI 'Axiaothea' #
 ###########################################
 opening_event_1254_aversaria.104.t: "Один против бури"
 opening_event_1254_aversaria.104.desc: "Варвары, нечестивые орды! Они идут на юг, и только Легион стоит, чтобы остановить их. Если бы Исакея не погибла [Concept('the_vilnian_assault','с Эшреем на ее мече')|E], то она повела бы нас к славе во имя Аксиотеи, пока Аавтократ не вернулась бы, как славное и ужасное воплощение Маклеи. Вместо этого я здесь, оставшийся с Легионом, который должен был умереть вместе со своим легоном... должен был умереть вместе с истинной Аавтократом...\n\nПрошло много лет с тех пор, как XXI был настоящим Легионом, а не шатким месивом призывников и полудиких детей, выросших под этой [Concept('aervalr','разбитой луной')|E], которым мне доверили командовать. Счла бы [isacea.GetFirstName] мои решения ошибочными? Она вела избитые остатки Легиона сражаться с псами Эшрея годами от изуродованных гор Небесного Полдня до самых ворот Ораисполя и все равно снесла это нечестивое западное логово. И что я сделал с остатками ее сил? Что я сделал после того, как славная Исакея спасла наш Легион от неизбежной гибели и дала нам свободу снова сражаться на свету?\n\nНаемники для безумцев и шлюх, получеловеческий сброд, не достойный Права Крови. То, что когда-то было самым гордым Легионом [Concept('aversaria','Аверсарии')|E], самим [Concept('legio_xxi','собственным легионом аавтократа')|E], превратилось в прославленную пограничную стражу для мертвого губернаторства. Мы пляшем ни ради чего, кроме медяков, предлагаемых нам этим нечеловеческим, жидкокровным отродьем пустоты, [that_idiot.Custom2('InsultAdjective', ROOT.Char)|U] [that_idiot.Custom2('InsultNoun', ROOT.Char)|U] от [that_idiot.GetTitleAsName], который пробивает себе путь через [GetTitleByKey('k_kasmiene').GetNameNoTier], пока мы следим за тем, чтобы северный сброд оставался на своем месте. Мало кого волнует тот факт, что варварская орда вырвалась из Малькои и теперь оскверняет немногие оставшиеся города Асклирака, пока мы удерживаем новых беженцев от выплескивания на юг или восток во владения этого дегенерата.\n\nЛегион умирает, годами мы не делали ничего, кроме убийства каждого нечестивого труса из Малькои, который решил бежать на юг вместо того, чтобы исполнить свой долг и сражаться за свой дом и Империю, а теперь мы отступаем перед лицом существ, еще менее человечных и куда более опасных. Если Легион должен выжить, он должен найти новое направление, но сначала он должен уничтожить своих врагов..."
 opening_event_1254_aversaria.104.a: "Только я могу остановить эти нечестивые орды."

 ########################################
 # Legon Pavron of Legio XVII 'Stereon' #
 ########################################
 opening_event_1254_aversaria.105.t: "Разбитый жемчуг"
 opening_event_1254_aversaria.105.desc: "Асиуполь, о прекраснейший Асиуполь. Во времена моего отца он был сияющей жемчужиной [Concept('aversaria','Аверсарии')|E], городом столь могущественным, что смотрел свысока на весь дряхлый [Concept('imperial_western_faction','запад')|E], как [Concept('aersanon','Чистейший')|E] на Своем троне над ульем [Concept('first_empire','Города Мира')|E]. Затем были [Concept('the_thousand_days_of_asiupoli','Тысяча дней')|E], [Concept('imperial_civil_war','Гражданская война')|E] и, конечно же, [Concept('selfreplicating_blood_magic','самовоспроизводящаяся магия крови')|E] и [Concept('frodbrokna','Фродброкна')|E].\n\nКогда мой Легион впервые прибыл сюда, я надеялся очистить город от предательских рабов и простолюдинского сброда, присевшего на его руинах. Однако до того, как мы успели должным образом установить связи с [tetradia.GetName], нечеловеческий сброд прибыл с моря и сделал немыслимое. Они взяли Асиуполь.\n\n«[GetTitleByKey('c_asiupoli').GetNameNoTier]» — так варвары смеют называть его теперь! Как будто дела не были достаточно плохи, теперь приходит весть о том, что какая-то еретическая восточная шлюха, [hecaeda.GetName], планирует стать той, кто «освободит» город. «Реформаторша», как она себя называет, готовая уничтожить все, что отделяет нас от сброда, сидящего в разрушенной столице.\n\nОднажды, когда Империя снова восстанет из своего кризиса, когда нечистые и нечистоплотные массы, предательские рабы, снова предавшие Империю, неотесанные варвары, ползающие по ее трупу как опарыши, и трусливые предатели вроде [hecaeda.GetFirstName] и ее ложного легиона — все будут выжжены из истории, как уступающие культуры, которые Империя уничтожила, чтобы взять эту землю... однажды, когда все это будет сделано, они вспомнят, что именно Легон Паврон и лоялисты Государственного легиона XVII спасли сердце Империи."
 opening_event_1254_aversaria.105.a: "Даже если нам придется сделать это в одиночку, мы отвоюем Асиуполь!"

 ####################################################
 # Arch Letalagos Matthaios of Legio XXVI 'Exodian' #
 ####################################################
 opening_event_1254_aversaria.106.t: "Оставленные позади"
 opening_event_1254_aversaria.106.desc: "Я был всего лишь мальчиком, когда меня уволокли из моей деревни в [GetTitleByKey('b_spabaonmae').GetNameNoTier], чтобы присоединить к обреченным «ветеранам» Государственного легиона XLVII «Дестинал» в их марше по защите и разграблению бывшей катраддийской столицы [GetTitleByKey('c_westkatraddia_49').GetNameNoTier]. Мне было всего пятнадцать лет, когда мое лицо было забрызгано чистой кровью мальчика-легона Вадмиркса в нашей первой засаде варварских племен виррекков, а всего через неделю я стоял по колено в трупах сотни других мальчишек из Малькои в их чужой броне от рук легионеров-бандитов, посчитавших нужным ограбить нас и забрать припасы. Я помню жгучий голод, сокращение числа наших людей, когда мы сражались, чтобы продвинуться против прилива беженцев и варваров. Момент, когда — не пройдя и половины пути до нашей цели — было решено, что мы не можем продолжать движение вперед лишь с десятой частью наших сил, и мы начали кровавый путь назад... теперь с [Concept('the_fog','Туманом')|E] за спиной.\n\nИменно тогда я встретил людей из «Эксодиана», последние остатки легионов, о которых я слышал сказки в детстве. Легионы, которые не убивали своих братьев, а стремились спасти их.\n\nПрошло уже восемь лет с тех пор, как я присоединился к «Эксодиану» как старший легионер из простолюдинов. Медленно я наблюдал, как земли, которые мы поклялись защищать, падали перед приливом, я наблюдал, как моих самых старых товарищей утаскивали в Туман его песнопеющие обитатели. Из уединенных башен я видел города древнего Картарадда, бурлящие жизнью изнутри объятий Тумана. Я видел великого металлического человека, который кричал, когда превращался в плоть и старел в пыль. Младенца, заявившего, что родился от дерева, выращенного как легионер, дитя Тумана. Я видел тысячу трагедий и тысячу чудес, и могу только гадать, не будут ли все эти вещи, свидетелем которых я стал, вскоре утеряны...\n\nМы попали в ловушку в Тумане. Наши разрозненные форты и опорные пункты, предназначенные для защиты и направления бегущих беженцев, один за другим были отрезаны. Я командую последними силами целого губернаторства, легионерами, у которых стало больше опыта работы с этим Туманом, чем у кого-либо из живущих. Мы нашли секретные тропы и научились ходить по шепчущей грани между смертью и жизнью в Туманных Землях, но каждый месяц оборванные выжившие проходят через Туманные пути и рассказывают мне об еще одной крепости, поглощенной туманом или его обитателями. Другие просто исчезают, их сообщения прекращаются — еще одна группа друзей и солдат потеряна без прощания.\n\nПришло время уходить. Мы должны проложить курс из Тумана, мы должны найти способ вывести последних беженцев, попавших в ловушку вместе с нами, и нам может потребоваться... мы должны вступить в бой с каждым, кто встанет на нашем пути."
 opening_event_1254_aversaria.106.a: "Будь то через [Concept('fogeaters','пожирателей тумана')|E] или людей, я найду способ."

 ##########################################################
 # Arch Letalagos Kallistos of Magi Auxiliaros Corpus XII #
 ##########################################################
 opening_event_1254_aversaria.107.t: "Тот, кто следует за ослами"
 opening_event_1254_aversaria.107.desc: "Дураки! Законченные дураки! Гребаные ублюдки! Простолюдины-крестьяне, которым разрешают становиться «легонами», и эти истлевшие старые окаменелости, которые так заперты в своих #EMP гребаных#! отсталых умах, что проводят целые дни, предаваясь воспоминаниям о временах, когда была всего одна луна и Империя, которую они еще не просрали до основания, чтобы я ее унаследовал. Подумать только, #italic я#!, Каллист Касатонекс, отпрыск поколений чистейшей крови, происходящий от самого Чистейшего, блядь, был обманут и последовал за этими разглагольствующими рабскими умами и нашим так называемым легоном, чтобы умереть в какой-то никчемной долине от какого-то адского сьялволькского [Concept('fogbeast','чудовища')|E]... проклятье на все это! О чем я только думал!?\n\nСпасибо Чистейшему, что нам было поручено попытаться обойти сьялволков на конях, как легионам-магам древности, я и мои люди не выжили бы, не будь у нас шанса скакать со всех ног прочь из этой проклятой дыры. Но даже при этом я могу узнать лишь несколько десятков окружающих меня дворян. Из простолюдинов я могу пересчитать по пальцам одной руки солдат из легиона, к которому я был прикреплен.\n\nНарсес, болван, обречен. Жалкая «коалиция», маршировавшая, чтобы спасти его, разбита, как и эта проклятая империя, к трупу которой приковала меня моя родословная. Я не отдам варвару свои руки и не отдам ему чистую кровь моих родичей. Пришло время взять этих несчастных выживших, за которых я стал ответственен, и уйти ради блага нас всех."
 opening_event_1254_aversaria.107.a: "Я слышал, Острова хороши в это время года..."

 ################################################
 # Arch Letalagos Iros of Legio VII 'Parataros' #
 ################################################
 opening_event_1254_aversaria.108.t: "Утерянные отпрыски"
 opening_event_1254_aversaria.108.desc: "Около двадцати лет назад Легон Этон отправил половину легиона из наших фортов в южной Калатипсоми на юг, чтобы помочь вернуть порядок охваченным анархией этепезейцам, которые вслед за своим великим свержением ненавистного претендента Эшрея пришли к беззаконию и явным признакам глубокого бесчеловечья. Я был всего лишь мальчиком, свежим новобранцем в нашем легионе, когда меня отправили с другими в составе великой коалиции Этона, наш отпрыск Паратуроса маршировал бок о бок с четырьмя другими северными легионами, чтобы бросить наш вес на поддержку Аавтократа Исакона на юго-востоке. Разумеется, Исакон умер еще до того, как мы прибыли, и в течение двадцати лет мы не делали ничего, кроме как терпели неудачи, неудачи и неудачи...\n\nЯ проявил себя против мятежников-рабсков Риккарата, вырезав их до единого человека, и еще до того, как я утер кровь с глаз, я получил повышение и приказы от самого Этона. С разумом, все еще эхом отзывающимся на крики детей, с жестокостью, которую я обнаружил в себе и своих товарищах-легионерах... мне сказали маршировать, и мы маршировали. К портам, к кораблям, купленным на разграбленные рабские монеты, и к морю.\n\nЭто должна была быть наша величайшая кампания. Калатипсоми, как мне говорили, умирала. Варвары были у ворот, они захватили продовольственные запасы региона, и скоро они будут на юге. Этон поведет Легион в славную битву, чтобы подавить этих северных повстанцев. Тем временем мы захватим плацдарм на Имперском острове, и он вернется на юг с сонмом союзников, чтобы помочь нам отбить остров и защитить какую-то часть [Concept('aversaria','Аверсарии')|E] во имя легиона.\n\nПрошло два года с тех пор, как мы должны были услышать весть об этой великой победе. Перевал видел, как последние из легионов были уничтожены и отброшены в сторону, и теперь варвары маршируют на юг... Я не думаю, что наши подкрепления придут, и не думаю, что Легон Этон пережил свой последний замысел. Как последний из VII Легиона, это выпадает мне: довести ли до конца этот безумный план по отвоеванию этого острова у высокомерных голубокровок, которые по праву правят им? Или... или хоть что-то из этого правильно? Крики тех рабов эхом отдаются в моем разуме, мои руки и ноги чувствуют усталость, и мысль о переправе обратно через море на материк заставляет меня чувствовать себя еще хуже. Возможно, для легиона было бы лучше умереть вместе с Этоном, а нам — найти хоть какую-то форму мира здесь... заключается ли мой долг перед моим легионом? Перед моей мертвой империей? Или перед моими избитыми людьми, которые никогда не знали дома, где можно отдохнуть?"
 opening_event_1254_aversaria.108.a: "С чего вообще начать..."

 #####################################################
 # Arch Letalagos Narthos of Legio LXXI 'Brass-Arms' #
 #####################################################
 opening_event_1254_aversaria.109.t: "Стойкий среди смуты"
 opening_event_1254_aversaria.109.desc: "Мой отец, Рубий, был одним из очень немногих мятежников, переживших [Concept('blue_robe_revolt','Восстание синих мантий')|E], [Concept('battle_for_the_aironoiakaan','Битва за Айронойакаан')|E] и [Concept('frodbrokna','Фродброкну')|E]. Счастливый человек, переживший всё, через что он шел, и какую пользу это принесло нам, оставшимся после его кончины?\n\nЛегион увял здесь, прячась на этом острове. За тридцать лет моего пребывания на посту Легона с момента его ухода я стойко держался против нечестивых аксиотеистов к югу от нас, мерзких варваров по ту сторону Каширията и заключил мощный союз с [GetTitleByKey('d_three_cities_league').GetName].\n\nС богатством и живой силой Лиги пришло время сделать больше, чем просто выживать, и выйти за пределы этого мелкого острова, на котором мы прятались полвека."
 opening_event_1254_aversaria.109.a: "Пусть эти «Меднорукие» обретут новую силу..."

 ################################################
 # Arch Letalagos Tolios of the River Authority #
 ################################################
 opening_event_1254_aversaria.110.t: "Служить и защищать"
 opening_event_1254_aversaria.110.desc: "Это были хорошие несколько лет в [GetTitleByKey('c_aterispol').GetNameNoTier] — я видел больше денег, проходивших через наш порт, чем мы когда-либо могли мечтать, и еще больше шло напрямую в мои карманы. Со всеми экзотическими товарами, которые мы «транспортируем» и «защищаем» вдоль [Concept('kasiryat_biozone','Каширията')|E], мой пояс становится все слабее. Пока дворяне могут ворчать, а крестьяне — проклинать, Речное управление #B всегда#! получит свою долю."
 opening_event_1254_aversaria.110.a: "Нам скоро может потребоваться еще один пир, чтобы отпраздновать наше богатство!"

 ##############################################################
 # Arch Letalagos Hykopas of Legio LXXX 'Shield of the North' #
 ##############################################################
 opening_event_1254_aversaria.111.t: "Царь горы"
 opening_event_1254_aversaria.111.desc: "Эта гребаная Империя, полная женоподобных сучек и паникующих трусов. Они бы оставили нас умирать в [Concept('the_fog','Тумане')|E], плевали на моих людей, даже когда мы делали благое дело Империи. Кто они такие, чтобы отказывать в налогах, которые Легон по праву имеет право собирать? Называть меня ложным легионером только потому, что я из так называемых «Героических легионов», а? Созданые самим Святым Эосом, блядь, кровь тысячи Чистейших и Громокронов течет в моей северной крови, а кучка южных дворян женственного вида хочет указывать нам, куда мы можем или не можем идти?\n\nЭта сука Детас пыталась помешать нам прокормить себя, тот варвар, под которого она легла, назвал нас «бандитами» и «разбойниками» и попытался натравить на нас своих шлюх. А эти гоанцы! Ха! Пусть все они гниют.\n\nСевера больше нет, больше нет денег или людей, которых нужно защищать. Нам повезло найти южные ворота до того, как Туман накрыл нас, и повезло, что эти тупорылые местные жители были достаточно глупы, чтобы открыть ворота! Ха! Какой год эти амагейцы думали идет, что можно просто впустить любого, кто приплетется со штандартом легиона? Нас нельзя винить за то, что мы взяли свою плату и «пополнили запасы» легиона, им явно не хотелось своего дерьма.\n\nА теперь эти болтающие гребаные деревенщины хотят нашей смерти! «Щит Севера» убил тысячу варварских армий, мы сражались с адскими [Concept('fogeaters','белокожими')|E] Тумана, сломали Зимний Легион и распахнули двери на юг. Мы никогда не умрем! Дело легионов — брать то, что нам нужно для Империи или чего бы то ни ни было, и теперь это мой выбор. Будем ли мы сидеть здесь и ждать, пока эти амагейцы перестанут заботиться о какой-то горе, которую мы честно забрали, или пришло время посмотреть, правдивы ли сказки о богатствах юга?"
 opening_event_1254_aversaria.111.a: "Лично я лучше бы оставил этот Туман далеко позади..."

 #####################################################
 # Legan Olymphoras of Legio LII 'the Redrock Guard' #
 #####################################################
 opening_event_1254_aversaria.10.t: "В паутине Призывателя Пустоты"
 opening_event_1254_aversaria.10.desc: "Орды Рожденных Пустотой, уничтожившие [Concept('first_empire','Первую Империю')|E]... когда мои предки увидели, как орды картараддцев маршируют в Малькое в [Concept('chaos_of_the_seventh_century','хаосе седьмого века')|E], они объявили самих картараддцев потомками темных бездушных существ, стремившихся поглотить солнце и снова отнять у человека свет [Concept('aersanon','Чистейшего')|E].\n\nЯ видел правду. Мои предки ошибались. Это были не давно умершие картараддцы и не варвары-сьялволки, которые, как утверждают купцы, скоро пожрут родину. Это эти культисты, эти нечестивые мерзости, носящие ложную плоть людей. Века почти полного молчания прошли в темных углах, которым мы позволили гноиться, и без каких-либо движений даже после [Concept('frodbrokna','Фродброкны')|E] и десятилетий конфликтов на наших землях они решили нанести удар сейчас.\n\nПоскольку город за городом пожираются этим нечистым сбродом, сброд совершенно другого рода посчитал нужным проклясть нас всех. [GetTitleByKey('c_zikti').GetNameNoTier], город, который мой легион защищал пять веков, был взят пиратским сбродом даже сейчас, когда мы отчаянно пытаемся сдержать забвение от ворот. Теперь [GetTitleByKey('c_zigdardik').GetNameNoTier] поглощен, и мои избитые силы действительно отрезаны, и если я должен эвакуировать своих людей и оставшихся жителей из этой земли, чтобы, если на то будет воля Чистейшего, начать контрнаступление, мне придется пройти через этого ублюдка..."
 opening_event_1254_aversaria.10.a: "Если красноземцы доберутся до меня первыми, то я утащу тебя за собой, [pirate_dickhead.GetFirstName]!"

 #######################
 # Zanachrios Varicaad #
 #######################
 opening_event_1254_aversaria.112.t: "Рожденный в сумерках"
 opening_event_1254_aversaria.112.desc: "Рожденный на рассвете.\n\nТаковы были слова моего дома, слова моего отца, слова, которые с каждым днем кажутся все больше и больше шуткой, пока некогда великая империя [Concept('aversaria','Аверсарии')|E] продолжает разрывать себя на части. После смерти моего отца и уничтожения клики я остался брошенным на материке, где мне были верны едва ли две сотни солдат.\n\nОднако надежда вернулась самым странным образом — с началом [Concept('battle_of_ten_trees','Битвы у десяти деревьях')|E]. Где другие видели бедствие, я видел возможность; возможность мести тем, кто убил моего отца.\n\nИтак, я предал своих сородичей-аверсарианцев, поведя свои силы сражаться плечом к плечу со сьялволками. Хотя у меня не было возможности убить Декса самому, мои действия заслужили признание самого Ценвара, который позволил мне принести присягу и вернуться с моими людьми в мой дом в [GetTitleByKey('c_tempestcourt').GetNameNoTier].\n\nТеперь же, после резни у Элизии, марш Имперреха на юг не показывает никаких признаков замедления, не оставляя ни мне, ни Ценвару особых причин продолжать наше текущее соглашение."
 opening_event_1254_aversaria.112.a: "Я так устал..."
 
 #################################
 # Min Thu, the Shrewd #
 #################################
 opening_event_bn.1.t: "В тени горы"
 opening_event_bn.1.desc: "Я никогда не забуду тот день, когда увидел, как мой отец [dad.GetFirstName] пал в битве от рук этих проклятых ольтенов. Как я мог забыть? [slayer.GetFirstName] забрал один из моих глаз и оставил меня смотреть, как горит моя деревня. Я все еще чувствую запах дыма от пламени и умирающие крики моей матери [mother.GetFirstName], когда они одолели [dad.GetFirstNameNoTooltip] и его верных воинов, опустошили нашу деревню и вырезали почти всех остальных на виду. Я могу не быть таким великим воином, каким был мой отец, но мой народ может быть уверен, что я не успокоюсь, пока не отомщу за смерть моего отца и не принесу домой голову [slayer.GetFirstNameNoTooltip] на копье."
 opening_event_bn.1.a: "Месть будет моей." 

 #################################
 # Su Myat, the White Rose #
 #################################
 opening_event_bn.2.t: "Свести счеты"
 opening_event_bn.2.desc: "Я была маленьким ребенком, когда орда ольтенов прошлась по нашей деревне, сжигая, грабя и вырезая всех, кого вздумается. Если бы мой брат [brother.GetFirstName] не проявил дальновидность и не спрятал меня с глаз долой глубоко в лесу, я бы не выжила. Возможно, я была беспомощна защитить свою семью тогда, но я клянусь никогда больше не оказываться в таком положении. Каждый раз, когда я смотрю на повязку, которую носит мой дорогой брат, или на надгробия наших любимых родителей, мне напоминают, что я не смогла помочь своей семье, когда это было важны всего.\n\nВся боль и смерть в моей жизни — дело рук этого ублюдка [slayer.GetFirstName]. Это он забрал глаз моего брата. Это он убил моего отца [dad.GetFirstName] и казнил мою любимую мать [mother.GetFirstName] на месте, даже когда она молила о пощаде. Я искуплю честь нашей семьи или умру в попытках. С тех пор, как я стала достаточно взрослой, чтобы держать оружие, я неустанно тренировалась день и ночь, чтобы убедиться, что в следующий раз, когда я встречу [slayer.GetFirstNameNoTooltip] на поле боя, я отделю его голову от плеч и отправлю обезглавленное тело обратно его семье верхом на коне, чтобы научить их истинному значению боли и утраты."
 opening_event_bn.2.a: "Равнины Магийора покраснеют от его крови." 


 #########################################
 # Nurbek Nursultan, the Black Whirlwind #
 ##########################################
 opening_event_bn.3.t: "Око за око"
 opening_event_bn.3.desc: "Кровавая история моей семьи с племенем [enemy1.GetDynasty.GetName] началась, когда мой отец [dad.GetFirstName] сразил [enemy1.GetFirstName] в поединке. Мало кто знал, что этот дуэль зажжет кровную месть, которая в конечном итоге унесет жизнь моего отца. Я до сих пор помню день, когда [uncle.GetFirstName] сообщил мне, что мой отец пал в битве от рук [enemy2.GetFirstName]. С того дня я поклялся, что отомщу за смерть отца.\n\nКогда настал тот роковой день, я повел свои войска в дерзкий набег, который сокрушил оборону [enemy2.GetFirstNamePossessiveNoTooltip]. К его чести, [enemy2.GetNicknameNoTooltip] оказал хорошее сопротивление, но в конце концов он не простоял против моего клинка. Победив величайшего воина наттананов, я приказал своим войскам сжечь деревню до основания. Избавившись от жены [enemy2.GetFirstNamePossessiveNoTooltip], [enemy3.GetFirstName], я решил пощадить сына [enemy2.GetFirstNamePossessiveNoTooltip], [enemy4.GetFirstName], но забрал его глаз, чтобы он и его семья навсегда запомнили последствия провокации моего гнева. В следующий раз я не буду так милосерден."
 opening_event_bn.3.a: "Пришло время закончить начатое моим отцом."


 #########################################
 # Yaza Zin, Sepattan High Priest #
 ##########################################
 opening_event_bn.4.t: "Испытание веры"
 opening_event_bn.4.desc: "Мой отец [dad.GetFirstName] был мирным и благочестивым человеком, посвятившим свою жизнь изучению учений Йерниема и Тарфала. Если бы не его поощрение, я бы никогда не поднялся по рангам аколитов, изучающих тайные искусства в Священной роще, и тем более не был бы выбран моим предшественником [sensei.GetFirstName], чтобы вести наш народ вперед в качестве их духовного лидера. Таким образом, внезапная кончина моего отца от рук [heretic1.GetFirstName] ранила меня в самое сердце и наполнила жаждой мести и стремлением к возмездию, от которых я не могу избавиться.\n\nТеперь я стою на перепутье. [sensei.GetFirstNameNoTooltip] доверил мне вести за собой собственным примером как символ праведности и благочестия. С другой стороны, хотя я, возможно, почтил наследие своего отца, изгнав [heretic1.GetNicknameNoTooltip] из наших священных земель, я чувствую себя вынужденным стереть его род с лица [Concept('aeras','Эраса')|E]. Даже сейчас мои разведчики сообщают, что два сына [heretic1.GetFirstNamePossessiveNoTooltip], [heretic2.GetFirstName] и [heretic3.GetFirstName], разжигают религиозный фанатизм на востоке. Мне нужно сделать выбор. Как мне поступить?"
 opening_event_bn.4.a: "Я почту наследие своего отца и выберу милосердие."
 opening_event_bn.4.b: "Еретики предстанут перед божественным возмездием."
 vengeful_path_tooltip: "Вы теряете свойства:\n[GetTrait('generous').GetName(GetPlayer)], [GetTrait('stubborn').GetName(GetPlayer)] и [GetTrait('patient').GetName(GetPlayer)].\nВы получаете свойства:\n[GetTrait('zealous').GetName(GetPlayer)], [GetTrait('vengeful').GetName(GetPlayer)] и [GetTrait('wrathful').GetName(GetPlayer)]."

 #########################################
 # Htet Myat Aung, the Flame of Korlacu #
 ##########################################
 opening_event_bn.5.t: "Больше не изгнанник"
 opening_event_bn.5.desc: "В молодости у моего отца [dad.GetFirstName] было видение от Корлаку, в котором ему поручалось отправиться на восток в поисках просветления. Он вернулся из своих странствий изменившимся человеком и начал проповедовать о необходимости отказаться от изоляционистских традиций Богов-Близнецов и вместо этого взаимодействовать с внешним миром и принять [Concept('aspect_fire','огонь')|E] и [Concept('aspect_metal','металл')|E] как оплоты цивилизации. Чтобы показать заблудшим последователям Богов-Близнецов значение истинной силы, [dad.GetFirstNameNoTooltip] предложил аколитам Сада Тарфала выбор — принять свет Корлаку или сгореть. Они отказались, и десятки погибли во имя Корлаку, включая [priest_dad.GetFirstName].\n\nРазгневанный действиями моего отца и смертью [priest_dad.GetFirstNameNoTooltip], [priest.GetFirstName] унизил [dad.GetFirstNameNoTooltip] в Битве Умов, клеймил его как [dad.GetNicknameNoTooltip] и изгнал из нашей отчей земли.\n\nЯ преуспею там, где мой отец потерпел неудачу. Пришло время совершить месть над нечестивым [priest.GetFirstNameNoTooltip]. Я уже закрепил плацдарм на востоке. Скоро я сожгу его священный сад до основания и воздвигну на его месте великий костер, достойный благосклонности Корлаку. Пришло время очистить джунгли Беронг Наттана огнем."
 opening_event_bn.5.a: "Да будет свет!"

 ##############################
 # Lorm, the Fallen Prophet #
 ##############################
 opening_event_redlands.1.t: "Душа, разорванная на части"
 opening_event_redlands.1.desc: "Они забрали его у меня. Я любил его, а они забрали его у меня. Сначала его разум, затем его тело и, наконец, его душу. Все, чему он меня научил, каждый момент, который мы разделили — все ушло, как страницы в пламени. Ничего, кроме воспоминаний, которыми обладаю только я один.\n\nИ так, в свою очередь, я начал забирать их. Я взял их скверную песнь и заставил ее замолчать палицей и жезлом. Я взял их жалкие тени и сжег их на свету. Я взял каждую отвратительную, презренную мерзость, которую они могли сотворить, и отправил ее обратно в Пустоту, откуда она пришла. Пока я маршировал все дальше через пустоши, мужчины и женщины теснились за моей спиной, веря, что я действую с истинной праведностью.\n\nОднако они ошибались. В моих действиях не было праведности — только ненависть, печаль и решимость. Я изучил их, знал, кто они такие, и ясно видел сквозь всю их хитрость. И поэтому, когда я добрался до той ужасной Бездны, я ясно увидел, как много я потерял. Они заключили со мной сделку — жизни моих солдат, моя служба и сама моя душа — что я однажды снова увижу его под тьмой Разбитого Солнца.\n\nИ вот я здесь."
 opening_event_redlands.1.a: "#italic Моя любовь — скворец, а я — небо..."

 ##########
 # Damota #
 ##########

 # Aderi of the Yenusaawi Boqtada
 opening_event_1254_damota.1.t: "Через озеро"
 opening_event_1254_damota.1.desc: "При боккарах мои предки пользовались благосклонностью, командуя Йенусаави Боктада на протяжении всего правления [Concept('zalreb_dynasty','династии Залреб')|E]. Они были верными стражами, которым даровали великую власть и роскошь за их службу. Это было их право по рождению, ведь наш род поклялся служить поколениями. Но когда Боккарут рухнул со смертью Кайовы, мои предки бежали из столицы, забрав с собой остатки стражи. За века хаоса мы продолжали поднимать старые знамена Дамоты, ибо мы — последние законные претенденты на ее наследие. И несмотря на наши праведные притязания, мы сведены к тому, что смотрим на наше право по рождению, некогда сияющий город [GetTitleByKey('c_zahali').GetNameNoTier] через озеро, теперь превращенный в ветхие руины, отражающие наше собственное жалкое состояние.\n\nЭто закончится на мне. Я — законный наследник не просто стражи, но самого [Concept('boqqarut_damotada','Боккарута')|E]. Все склонятся перед моим могуществом, и массы будут воспевать меня как восстановителя Дамоты. Под моим взором Захали снова восстанет во всем своем великолепии, и никто не посмеет бросить вызов моему славному правлению. История взглянет на меня и узнает, что Дамота никогда по-настоящему не пала!"
 opening_event_1254_damota.1.a: "Вперед! Захали ждет!"

 # Farwah of Sokoi
 opening_event_1254_damota.2.t: "У ворот Дамоты"
 opening_event_1254_damota.2.desc: "В хаосе [Concept('etami_tetenik','Этами Тетеник')|E], когда каждый мелкий дворянин сражался за павший трон, город Аседобо остался без лидера, его армии и дворяне маршировали на юг в погоне за славными иллюзиями. После их ухода [Concept('karavuux_capital','Каравуукс')|E] города сплотил своих членов и захватил власть, восстановив порядок в городе. Оттуда окружающие земли были быстро захвачены, и Яркит Сокоя был провозглашен находящимся под народным правлением, с Каравууксом в качестве посредника для обеспечения процветания региона. За прошедшие с тех пор века Сокой стоял у ворот Дамоты, богатея на непрекращающемся потоке товаров, текущих по Гонанского тракта. И за все эти века, когда Дамоту снова и снова охватывало пламя амбиций, наше богатство только продолжало накапливаться.\n\nЯ — еще один в этом цикле, недавно выбранный вести наше государство через любые испытания, которые могут возникнуть перед ним в ближайшие годы. Разумеется, меня могут сместить так же быстро, как я пришел к власти, если во время моего правления произойдет что-то катастрофическое. Но пока потребности народа и, что более важно, Каравуукса удовлетворяются, я могу править долго в будущем, весьма разбогатев в процессе, как и каждый успешный яркит до меня."
 opening_event_1254_damota.2.a: "Когда-нибудь я буду купаться в драгоценных камнях."

 # Rashali the Asdraqi
 opening_event_1254_damota.3.t: "Очистить Саррадон"
 opening_event_1254_damota.3.desc: "Для моих предполагаемых братьев по вере я — безумец, заблудший параноидальный фанатик, который видит врагов в каждой тени. Они дураки, каждый из них одержим своими доктринами обороны. Даже Хартах, чья война против иноверцев-чужеземцев праведна, остановился бы, как только прогонал их с берега. Неужели они не видят? Нас столько раз атаковали и предавали, что Мертвый Бог едва не вырвался из своих узилищ, когда стражу его тюрьмы отбросили назад.\n\nБольше этому не бывать. Я и мои последователи — единственные [Concept('wardenism','вардениты')|E], кто осознал правду. Мы не можем быть в безопасности от махинаций Мертвого Бога, пока все его последователи не умрут. Вольно или невольно, все те, кто сопротивляется истинной вере, сражаются за конец света, замышляя из тьмы обрушиться на праведных защитников всего доброго и святого. Единственный способ предотвратить эту судьбу — уничтожить иноверцев полностью и окончательно. Я собрал группу воинов-соратников, которые видят, что должно быть сделано, и мы маршировали на юг через пустыню, достигнув земель Дамоты, где моговайцы замышляют освободить Мертвого Бога из его вечной тюрьмы. Мы освободим эту землю от их хватки и защитим южный фланг варденизма. Больше еретики и язычники не будут править в этих джунглях, больше их народ не будет поклоняться злу."
 opening_event_1254_damota.3.a: "Дамота узнает правду, какова бы ни была цена."

 # Kihinet Herizab
 opening_event_1254_damota.4.t: "Вестник нового рассвета"
 opening_event_1254_damota.4.desc: "С самого детства я видел жрецов Всевышнего и мечтал присоединиться к их числу. Я всем своим существом желал помочь в Его возрождении и провел жизнь, готовясь к тому, что считал своим священным предназначением. Присоединившись к местному храму, я быстро разочаровался, наблюдая, как коррумпированные и нечестивые злоупотребляют своим положением ради личной выгоды, искажая Его слова в нечестивые насмешки. И я поклялся, что не потерплю этой ереси.\n\nСобрав за собой группу единомышленников, я принял ницафайское движение, выведя на передний план то, о чем когда-то шептались в тенях. Я провозгласил во всеуслышание, что моговайцы отклонились от своей цели, извратили свои священные заповеди. В сопровождении моего быстро растущего числа последователей мы захватили местный храм, и оттуда началось наше распространение. После стольких лет войны я видел, как истина начинает преобладать на обширных участках завоеванных земель, я слышал, как люди скандируют мое имя. Я — истинный управляющий Его земного домена, я несу на своих плечах бремя мира. И хотя я старею, я все равно сделаю все возможное, чтобы моя реформация не умерла вместе со мной."
 opening_event_1254_damota.4.a: "Таков мой долг."

 # Runalem Belar
 opening_event_1254_damota.5.t: "Наследник хаоса"
 opening_event_1254_damota.5.desc: "Я родился и вырос как член королевской семьи, как наследник трона моего отца, точно так же, как он был воспитан своим отцом. Он сделал все возможное, чтобы обучить меня искусствам правления — искусствам, которые мне давались с трудом. И он также учил меня нашему славному прошлому, тому, как наши предки когда-то правили всей Дамотой, и как наше правление вернется снова. Мы были [Concept('belar_dynasty','династией Белар')|E], мы были среди самых могущественных и древних семей во всем царстве. И хотя те дни, дни [Concept('boqqarut_damotada','Боккарута')|E], остались далеко позади, я должен был править нашим талкарутом как отражением его процветания.\n\nА затем пришли вахарайцы, еретики, отказывавшиеся признавать нашу власть. Их движение уже стало широко распространенным на юге к моменту моего рождения, и мое детство прошло в наблюдениях за тем, как мой отец терпит неудачу в попытках удержать их под контролем. И когда его усилия провалились, они восстали, и наше некогда великое королевство было разорвано на части. Повстанцы быстро захватили юг, распавшись на собственные фрагменты, когда их дело казалось победоносным. Это отрезало запад, который откололся до того, как был завоеван захватчиками, а восток столкнулся с нападением фанатиков ницафайцев. Только на севере мы держались, и мой отец умер сломленным человеком из-за этого. И стервятники теперь кружат над трупом государства, которое я возглавляю. Мы преданы, на нас охотятся, но мы выживем. Ибо самый великий урок, который я когда-либо усвоил, прост."
 opening_event_1254_damota.5.a: "Я еще не мертв."

 # Azhela the Singer of the Tomb
 opening_event_1254_damota.6.t: "Силой и туманом"
 opening_event_1254_damota.6.desc: "С самого детства, росшего на заброшенной ферме на краю джунглей, я чувствовал что-то особое. Что-то могущественное. В старые времена мою силу нашли бы, и меня отправили бы служить [Concept('boqqarut_damotada','Боккаруту')|E], служить без надежды по-настоящему обладать властью. Но те времена прошли.\n\nОбучая себя путем проб и ошибок, я выучил песни, которые никогда не выучил бы в те древние дни, научился подключаться к ритмам жизни и смерти. Со своими талантами я отправился в мир, покинув жалкую лачугу, в которой жил, ради двора близлежащего голки, старого дурака, верившего, что я могу помочь ему захватить власть. Его глупость была оплачена ножом, и я захватил контроль над его державой, быстро расширяясь в рушащееся королевство Дихалет. Когда-то я был бы лишь еще одним [Concept('magi','магом')|E], обреченным провести жизнь на службе."
 opening_event_1254_damota.6.a: "Но теперь они увидят настоящую силу."

 ############
 # Sarradon #
 ############

 # Aarif, Prince of the Nizarids
 opening_event_1254_sarradon.1.t: "Ариф, принц Низаридов"
 opening_event_1254_sarradon.1.desc: "Я — Ариф, сын Язида, который был сыном Бадра. Каждый из этих людей преданно служил праведному [Concept('mamuramat','Мамурамату')|E]. Мы многого лишились в верной службе и были щедро вознаграждены.\n\nИ теперь моя очередь служить. Будь я меньшим человеком, я бы сделал так, как сделал мой отец, и довольствовался бы богатством и землями нашей семьи. Но я не дурак, я вижу, как тени сгущаются за каждым углом. Адабин стар, и его ошибки оставили объединенный Мамурамат слабее, чем он был со времен темных дней [Concept('the_downfall','Падения')|E], до того как $mamur_tathtali_link$ Татхтали#! убил своего отца, безумного $mamur_yusar_link$ мамура Юсара#!, и сплел новый порядок из хаоса. Мало того, что мы сталкиваемся с вторжением свиноподобных [Concept('aversaria','аверсарианцев')|E], так теперь даже ужасные [Concept('marchers','марочники')|E] кружат как стервятники.\n\nХотя Адабин может править, становится все более очевидным, что стабильность Мамурамата покоится только на моих плечах. Спасу ли я Мухаддадов от их глупости? Или оставлю их на произвол судьбы и отправлюсь спасать веру [Concept('the_first_warden','Первого Вардена')|E] самостоятельно?"
 opening_event_1254_sarradon.1.a: "История балансирует на острие моего меча..."
 
 # Amsari vassals
 opening_event_1254_sarradon.2.t: "Год незначительных последствий"
 opening_event_1254_sarradon.2.desc: "Канамсар Пейджман правит уже семьдесят лет, семьдесят один год теперь, когда прошла еще одна Длинейшая Ночь и возвестила о начале нового года. Он хороший человек и справедливый правитель. Определенно мудрее некоторых, кто правил на его месте до него, и некоторых, кто мог бы сделать это вместо него — с этим фактом согласится каждый в Хиклахне.\n\nОднако следует признать, что с его стороны могли быть серьезные просчеты в суждениях.\n\nЕго предки без колебаний обрезали ветви претендентов до своей смерти. Жестокая задача, без сомнения, и я не завидую ей, но история доказала ее необходимость на благо Хиклахна. Пейджман, однако, хороший и добрый человек. У него есть сострадание к миру, который часто так быстр на наказание сострадательных. За свою добродетель он, возможно, обрек нас на огонь полномасштабной гражданской войны — ужас, которого не видели поколениями.\n\nНо это заботы для другого времени. Пейджман замедляется с возрастом, но он прожил девяносто лет и наверняка проживет еще по крайней мере несколько. Так что на данный момент летописцы, скорее всего, отметят этот год как еще один год незначительных последствий в Хиклахне."
 opening_event_1254_sarradon.2.a: "Да правит он долго!"

 # Mamur Adabyn
 opening_event_1254_sarradon.3.t: "[Concept('war_in_heaven','Война на небесах')|E]"
 opening_event_1254_sarradon.3.desc: "Терпение — это добродетель, а также ключ к стратегии. Мы ждем, пока наши враги совершат ошибки, а затем используем их, и держимся до того момента, пока не настанет время для истинного и правильного удара. Делать что-либо еще — это ненужный риск, привлекающий смерть слишком многих.\n\n[Concept('ritualism','Ритуалисты')|E] мертвы. Ушли и побеждены, едва держатся. И все же оказывается, что после тысячи лет войны не они должны были стать нашими окончательными врагами. Агионисты теперь сидят в их городах и творят великую трагедию с нашим народом.\n\nМногие призывают к войне. Поистине опустошительной войне, невиданной ранее по кровопролитию или священной ярости. Хартах, когда служил моим лейтенантом, желал этого больше всех.\n\nИменно это мышление приведет нас к гибели, истинной гибели. Набраться терпения и ждать момента — не слабость; бросаться навстречу собственной гибели — вот слабость."
 opening_event_1254_sarradon.3.a: "Я молюсь за Хартаха, ибо его путь — это путь катастрофы."

 # Harthah 'the Father of Sarradon'
 opening_event_1254_sarradon.4.t: "Отец [Concept('sarradon','Саррадона')|E]"
 opening_event_1254_sarradon.4.desc: "[Concept('sarradon','Саррадон')|E] — мой дом. Это моя земля. Его народ — мой народ. Я не человек, я инструмент, меч в руке каждого праведного солдата в борьбе за наш дом. Щит, защищающий слабых, пока они борются против иноземных язычников. Копье, которое пронзит сердце агионистов и любых других, кто посмеет вторгнуться на наши земли.\n\nЖаль, что я не понял этого раньше. Потребовалась смерть прекрасной Исы, чтобы я осознал, насколько слабым проявил себя Мамур. Это не эпоха для того, чтобы сидеть и ждать, время терпения прошло.\n\nЯ — Хартах ибн Саррадон, я отец Саррадона, и я не успокоюсь, пока мои дети не будут свободны, а [Concept('saints_war','Война Святых')|E] не окончена."
 opening_event_1254_sarradon.4.a: "Сколько бы времени это ни заняло, Саррадон сломает языческую орду."

 # Qanamsar Pejman
 opening_event_1254_sarradon.5.t: "Ради семьи"
 opening_event_1254_sarradon.5.desc: "Семьдесят лет я правил своим народом. Амсарцы в союзе, народ объединен. Семьдесят лет я следовал Пророчеству и делал все возможное, чтобы правильно истолковать его послания, и я делал это вплоть до его завершения и в этой новой темной эре, в которую вступает наш народ.\n\nОни говорят, что я теперь дурак, по-своему. Будь то добрыми словами о том, что я слишком сострадателен или любящ к своим детям, или жестокими о том, что я старый дурак, неспособный сделать то, что должно быть сделано.\n\nЯ знаю опасности. Я знаю, что [Concept('marchers','шевальенские')|E] купцы, которых я приветствовал — стервятники, что у моих детей припрятаны кинжалы друг для друга. Но если мы вступаем в темный век, как я могу быть тем, кто сделает его еще темнее? Как Канамсар, заключается ли мой долг в том, чтобы укрепить власть семьи, или в том, чтобы задать стандарт для моего народа?"
 opening_event_1254_sarradon.5.a: "Я не сделаю этот мир темнее."

 # Hycancylin of the West Royal Trading Company
 opening_event_1254_sarradon.6.t: "Изобилие возможностей"
 opening_event_1254_sarradon.6.desc: "С приобретением острова у амсарцев наш грандиозный план был приведен в движение. Я управляю Западной Королевской Торговой Компанией уже шесть лет, с тех пор как мой предшественник Андрес решил вернуться в [GetTitleByKey('c_peti_gisredde').GetNameNoTier], чтобы продолжить более прибыльные возможности на родине. Откровенно говоря, я начинаю думать, что был бы идиотом, не сделав то же самое. Мы годами ждали смерти Канамсара Пейджмана, и начинает казаться, что он просто не собирается умирать. Но без видений их давно мертвого Пророка, направлявших их, дворяне амсарцев были более чем счастливы преследовать свои собственные цели. И что может быть лучшим способом содействовать им, чем продажа им оружия и знаний в надежде со временем нажиться на смуте.\n\nЭто рискованная инвестиция, определявшая последние два десятилетия нашего коммерческого предприятия, поскольку мы перешли от экспорта товаров к торговле оружием. Оставлять тысячи комплектов хороших кольчуг гнить на складе не кажется хорошей инвестицией, но я узнаю надвигающуюся гражданскую войну, когда вижу её. Как только старик умрет и его сыновья начнут ссориться из-за его трупа — что ж, вот тогда мы наконец сможем начать брать реальную прибыль."
 opening_event_1254_sarradon.6.a: "Финансы марочников во всей своей красе!"

 # Ukisu the Manat
 opening_event_1254_sarradon.7.t: "Предсмертные вздохи манатов"
 opening_event_1254_sarradon.7.desc: "Тысячелетиями манаты правили нашим уголком [Concept('sarradon','Саррадона')|E], и еще менее века назад казалось, что мы будем править еще тысячелетия. Даже будучи вассалами язычников, манатская вера оставалась сильной, добросовестно восстанавливая и переводя [Concept('gena_tinngir','Священные тексты')|E], как мы делали всегда. Однако за последние дюжину лет один человек изменил все это. Его идеалы изгнания варваров-захватчиков с севера были достаточно праведными, и я бы никого не винил за то, что они пошли за ним, будь он манатом. Однако он им не является, но его слова очаровали многих манатских верующих, и многие правители, включая моего сюзерена, обратились в его веру. Хотя какая-то часть меня хочет верить, что наша вера может выжить в этом, шансы на это становятся все меньше с каждым новым годом. Мы даже остались без [Concept('dogena_dikirib','Догены Дикириб')|E]: Новая библиотека была завоевана варварами всего десятилетие назад, а бывший [Concept('dogena_dikirib','Номера Дикириб')|E], Нолнге, бежал к моему двору, будучи теперь лишь Номера Кедогеном моих владений. И теперь в моей державе находится последняя библиотека манатской веры, и я должен сделать все возможное, чтобы защитить ее, а сделав это — защитить веру. Ибо если я не смогу..."
 opening_event_1254_sarradon.7.a: "...я могу стать последней душой, вошедшей в [Concept('dogena_tinngir','Божественная библиотека богов')|E]"

 # Pad'eyil Morukouda
 opening_event_1254_sarradon.8.t: "Все сущее под солнцем"
 opening_event_1254_sarradon.8.desc: "С самого детства я узнавал о долгом упадке моего народа. От великих магов-судей древности, уважаемых даже надменными ритуалистами как правителями гордого народа, до расколотых феодальных владений, оставленных сражаться за внутренние земли Харадамата, пока вокруг нас бушевала Война на небесах, до бесчисленных восстаний, раздавленных под Башней или Ключом. Но я также узнал, что так было не всегда.\n\nСамые древние тексты хубаризма упоминают империю, соперничавшую с Саррадоном, озарявшую каждого, кто смотрел на нее. И хотя все вокруг меня отвергают эти истории как простые басни, я знаю правду. Великое Солнце все еще сияет над этими землями, и теперь, когда вокруг нас бушует война, какое может быть лучшее время, чтобы снова восстать из тьмы?\n\nПусть [Concept('aversaria','аверсарианцы')|E] и саррадонцы затрепещут, ибо я говорю о царстве древнее любого из их царств. Пусть мир озарится золотым светом, и пусть маги-судьи еще раз отправляют божественное правосудие по всей его широте. Пусть весь Харадамат, даже больше, восхваляет Шамсу, как в былые дни. Пусть все узурпаторы и язычники этого мира снова узнают древнее, забытое имя..."
 opening_event_1254_sarradon.8.a: "...Шанису Хубарин."

 # Aghlab 'the Engineer'
 opening_event_1254_sarradon.9.t: "Последний из магов-инженеров"
 opening_event_1254_sarradon.9.desc: "Здесь, похоже, и погибает древнейшая школа магов-инженеров. Реликвии эпохи [Concept('sirhad','сирхадов')|E], ныне живущие беглецами в горах. Так было не всегда.\n\nХотя мы отказались преклонить колено, мы добросовестно обслуживали оставшуюся публичную магию великих городов: Великий акведук Фитукиона, Великий фуникулер Шикулина, самоуправляемые фермы на реке Перафий — все это и многое другое мы поддерживали во славу агионистского режима, хотя унижение и стыд сотрудничества всегда грызли нас. Какое-то время наши новые правители сгибали колено перед прагматизмом. Вслед за [Concept('faghira_jalil_revolt','восстанием Фагиры и Джалиля')|E] они забыли себя. Те, кто пережил последующую чистку, такие как я, были изгнаны из низин Харадамата свиноподобными и невежественными [Concept('aversaria','аверсарианцами')|E]. Народ настолько опустившийся и нецивилизованный, что они выкололи бы себе левый глаз, чтобы досадить правому, позволяя чудесам Эры Огня рушиться и умирать. Но я не умру тихо. Идиотские поклонники Святых узнают, что магия, способная поднимать акведуки и перенаправлять реки, может сотрясать цитадели на куски и топить армии.\n\nОни умрут крича." 
 opening_event_1254_sarradon.9.a: "Земля поглотит их всех."

 # Abdul-Jaleel 'the Greenwarder'
 opening_event_1254_sarradon.10.t: "Мудрые и немногие"
 opening_event_1254_sarradon.10.desc: "Мне было десять лет, когда я впервые услышал трескучий голос духов, говоривший со мной в пламени летнего травостоя. Моя семья сказала, что мое выживание было чудом, но я знал правду: меня пощадили. С тех пор я порвал с закостенелыми традициями своих родичей, рискуя отречением, чтобы заняться еще более древним искусством.\n\nОстальной варденитский мир может не понимать меня, насмехаясь над моей так называемой деревенской магией, но я знаю, что в духах старого проклятого леса Зокаха есть сила. Я прислушиваюсь к тайнам утерянных дворов древних Кедровых царей, которые когда-то держали Саррадон под своим владычеством в давно забытую эпоху. Они говорят со мной о надвигающейся эре тьмы и анархии.\n\nВ своем сне я вижу бледный огонь, поднимающийся над Эль-Кулатой, выжигающий дворцы Мамуров.\n\nЯ буду готов."
 opening_event_1254_sarradon.10.a: "Я — лесной пожар"

 # Angobo kin Mamakhim
 opening_event_1254_sarradon.11.t: "Наследник величия"
 opening_event_1254_sarradon.11.desc: "За четыре года до моего рождения мой отец, Киким «Великий», сделал то, чего никто из мадикирибов не делал веками. Он воссоздал великий эрами Ильдурилулхим, завоевав независимость для нашего народа после веков иноземных владык. А затем он умер, оставив лишь одного наследника — меня. Я едва достиг совершеннолетия и был далеко не гением, каким был мой отец. Казалось, что на каждый талант, который у него был, у меня не было ничего. Я быстро обнаружил, что меня ненавидят все мои вассалы за то, что я не оправдал пример своего отца. Моя ситуация была безнадежной, и я не мог представить, что она станет еще хуже. Оказалось, что воображение было просто еще одним навыком, в котором я потерпел неудачу. Другой великий правитель, еще более харизматичный, чем мой отец, прошлся по Саррадону и попросил помощи у манатов. Мои вассалы затем принесли ему присягу, как будто меня там никогда и не было. Я тщетно пытался подтвердить свою власть, но в конце концов сдался и тоже принес присягу. Мои советники уверяют меня, что я все еще юн и имею потенциал подтвердить свою роль Марилуна, но с каждым прошедшим днем эта возможность кажется все менее и менее вероятной."
 opening_event_1254_sarradon.11.a: "Стоит ли вообще пытаться восстановить наследие моего отца?"

 ############
 # Kashirya #
 ############

 # Yayati 'the Hand that Bites'
 opening_event_1254_kashirya.1.t: "Кусучая рука"
 opening_event_1254_kashirya.1.desc: "Они называют меня «Кусучей рукой» за моей спиной. Они хихикают на улицах, когда я прохожу мимо, шепчутся в залах о моем пустом сердце и моих холодных глазах. Когда-то Кафасали были моими, глиной, которую слепили бы мои руки. Мое королевство должно было затмить даже [Concept('taryaad_saramsaasan','Тарьяд Сарамсаасан')|E] в своем величии, столь великим было бы мое правление. Мир склонился бы перед Кафасали и узнал, что раскрашенные вернулись на свое место подле Картикармы.\n\nНо мой брат разорил нас, и мне пришлось стать нашим спасением. Мой дурак-отец не посчитал нужным лишить его наследства, так кто я такой, чтобы помешать яду соскользнуть в его кубок? Судьба убила его, как едва не убила наше королевство. Я направлял государство моего племянника, но его мать все равно замышляла заговор против меня. Это была ее собственная вина, что меня не было рядом, чтобы выхватить змею из ее постели. Ее семья называет меня убийцей, но именно они убили королевство моего отца."
 opening_event_1254_kashirya.1.a: "Я окрашу Кафасали в красный цвет."

 # Digbhanja 'the Hollow'
 opening_event_1254_kashirya.2.t: "Марионетка раскрашенных"
 opening_event_1254_kashirya.2.desc: "Пустота — вот и все, что я чувствую. Я сижу на этом троне уже два десятилетия, и это ни разу не принесло мне удовольствия. Мой брат хромает вокруг меня как больная собака, желая цели, которую я не могу ему дать. Мой дядя говорит вместо меня на советах, но я должен верить, что он знает лучше. Я не заслуживаю этой короны — чувство, которое, как я знаю, было на устах у всех, кто встречает меня. Я — оболочка величия моей династии, бледное отражение раскрашенных.\n\nКафасали — земля железной воли. Я должен быть как железо, чтобы быть их королем, но я не могу покинуть свою кровать без возвращения голосов. Голоса говорят, что я не король, что моя тетя желает нашей смерти, но дядя Яати говорит мне, что мое правление абсолютно. Мое притязание — притязание раскрашенных, притязание рахикайев, которые никогда не были завоеваны. Я должен верить ему, потому что что останется, если он лжец, как и голоса? Пустая корона, пустое королевство."
 opening_event_1254_kashirya.2.a: "Пустой король."

 # Gandadeva of Hakadar
 opening_event_1254_kashirya.3.t: "Король Ножей"
 opening_event_1254_kashirya.3.desc: "Предатели повсюду. Они преследуют меня по моим залам, они стучат в мои двери и плюют мне в лицо. Какая наглость! Я наследник великой семьи Нейиндерхи, повелителей смерти! Я не какая-то игрушка, которую можно бросать из стороны в сторону. Прекратите играть с моей тенью! Прекратите!\n\nМой брат замышлял заговор за моей спиной. Он шептал на ухо моей жене, обещал спасение. Что ж, теперь она мертва! Удар, удар, удар — пошел нож в ее грудь. Ха-ха! Вы не можете обмануть меня, шаловливые тени. Я слишком умен для вас. Мой брат и его отродье — демоны, пришедшие съесть мою корону, но теперь они едят грязь в моих подземельях. Моя сестра еще не замышляла заговор против меня... пока что, но я слишком занят, чтобы разбираться с ней. Занят тенями, занят своим царством."
 opening_event_1254_kashirya.3.a: "Куда я положил свой любимый нож?"

 # Bhagwant 'Scar-Bound'
 opening_event_1254_kashirya.4.t: "Связанный принадлежностью, а не кровью"
 opening_event_1254_kashirya.4.a: "Этим шрамом я обязан честью своему народу."
 opening_event_1254_kashirya.4.desc: "Кто я?\n\nДнем мои руки срывают головы моих врагов, мой меч рубит врагов королевства и бандитов, тревожащих его торговцев. Мои рот помогает достичь сердечного взаимопонимания с бешеными уроженцами леса, угрожающими торговле вастарнайцев. Все мое тело, все оно на службе у великого королевства Кашти с тех пор, как мне исполнилось девять лет.\n\nНо когда я сплю? Другая жизнь. Мои руки срывают изящные цветы, мягкие, но слегка податливые, как голова. Мой рот не говорит, но пробует горький виноград. Мой меч? Всего лишь деревянная игрушка. Все мое тело, все оно в саду природы, окруженное теми же людьми из леса. Почему? Почему я чувствую это каждую ночь, просыпаясь в постели, обливаясь потом и призывая свою маму, ее лицо подобно иллюзии, миражу...\n\nКогда мой король решил пожаловать мне высшую награду — герцогство в своем королевстве, я очень хорошо знал, почему. Он хотел, чтобы я подавил непокорных танумарейцев, живших в этих глухих лесах, одновременно вознаграждая меня. И я маршировал. Во имя короля Кашти.\n\nНо я не смог этого сделать... потому что здесь и сейчас, глядя на жалкий вид угнетенных, замки травмы щелкнули и открылись, и интенсивный прилив ярости и печали охватил меня, когда я понял, что мои сны были отражением моего прошлого, и того, как меня забрали из моего дома и моего народа, который был точно так же в нужде в спасителе, как танумарейцы сейчас. И я решил, здесь и сейчас, что стану их спасителем....\n\nСтарый король умер, а новый мальчик-король наивен в вопросах королевской власти. Это мой шанс. Это НАШ шанс. С со свежим шрамом на лице, символизирующим связь с моей новой семьей, я собираю свои силы. Пусть мои сапоги теперь маршируют, чтобы проливать кровь заново — не по причинам жадности и корысти, но чтобы освободить мой народ и себя."

 # Ahilyabai of Abdenaj
 opening_event_1254_kashirya.5.t: "Маленький глоток свободы"
 opening_event_1254_kashirya.5.desc: "Кафасали пал, когда я была девчонкой, и все же его вялый труп все еще отбивается в той или иной форме. Тень [Concept('taryaad_saramsaasan','Тарьяада Сарамсаасана')|E] все еще висит над Наавджагарадом, как и королевство «раскрашенных», но ни одно из них не достойно похвалы, которую им воздают. Рахикаи — заблудший народ, думающий, что краска и мечи делают человека героем. И каких героев они сделали? Руку, которая кусает, когда она дает, и марионетку, которую она обескровливала.\n\nБольше этого не будет! Таханаты высекут наш собственный путь, который не увидит, как мы кусаем клинки Магийора в какой-то глупой попытке реставрации. Древние пути нашего народа столь же стары и сильны, как и Хараданы, несломленные [Concept('murtuy_ka_varha','Муртуй ка Вархой')|E] и бедами королей и королев. Мы не согласны быть обескровленными, как дураки к югу от нас. Мы встанем в одиночку."
 opening_event_1254_kashirya.5.a: "Больше никаких королей"

 # Nahusa of Magodoi
 opening_event_1254_kashirya.6.t: "Наш сад возрожденный"
 opening_event_1254_kashirya.6.desc: "Караны когда-то строили великие города по всему Кафасали, длинные поля, перемежающиеся в море башен и домов, подобно славному саду. Мы были могущественны, но были высокомерны. Мы позволили нашему разуму затуманиться [Concept('vidvaookeyatran_scholarly_caste','адскими учеными')|E], катясь к собственной гибели, и мы не смогли исправить наши ошибки в [Concept('dharya_varha','Дхарья Вархе')|E]. Караны умерли бы, если бы не щедрое королевство раскрашенных.\n\nВ теплом лоне рахикаев, караны начали наш сад заново. Мы выросли сильными под их защитой, и они оказались не более суровым хозяивами, чем бесполезные ученые, стремившиеся украсть наши средства к существованию. У Кафасали больше нет короля, но мандат раскрашенных все еще остается. Рахикаи снова будут королями, чего бы это ни стоило. Семена посеяны, мои планы тщательно взлелеяны до плодоношения. Теперь Кафасали созрел для сбора урожая."
 opening_event_1254_kashirya.6.a: "Раскрашенным вернется их корона"

 # Nahanaranamati of Sheytara
 opening_event_1254_kashirya.7.t: "Вырывая змеиные клыки"
 opening_event_1254_kashirya.7.desc: "Мы были брошены в гнездо гадюк. Восстание Безумного Клинка уничтожило всю мою семью, и Найварман, бедный Найварман, остался только со своей матерью, которая заботилась о нем. Она вырастила нас обоих, научила нас править, защищала нас от шакалов при дворе, а теперь она мертва. Теперь мои вассалы соревнуются за власть или, что еще хуже, замышляют нашу гибель. Восстание так и не закончилось, а лишь приостановилось, и теперь я слышу шепот войны в каждом коридоре.\n\nНайварман слеп к ситуации, в которой мы находимся, проводя больше времени с учеными вместо того, чтобы разбираться со своими предательскими вассалами. Я должна действовать быстро, пока он не кончил как мой отец, у которого выпотрошил кишки «верный друг» на поле боя. Я приму уроки Сондемеви близко к сердцу, защищая Шейтару в тенях."
 opening_event_1254_kashirya.7.a: "Эти предательские змеи должны пасть."

 # Naivarman of Omkhlur
 opening_event_1254_kashirya.8.t: "Более добрая Шейтара"
 opening_event_1254_kashirya.8.desc: "Шейтара снова будет объединена! В день моего рождения тактеи и ученые царства постановили, что я женюсь на последней из Равеендр и залечу раны Восстания Безумного Клинка. Правление Омхуром казалось прекрасной мечтой; Шейтара вступала в новую эру мира с моей самой верной подругой Наханой и матерью рядом со мной. Но все это было ложью. На смертном одре мать призналась мне во всем, что она сделала. Убийства, подкупы, похищения людей — пока изолировала меня от всего этого. Теперь мне оставлено разбираться с последствиями.\n\nЯ унаследовал ненависть семей, которым она причинила зло, и теперь Шейтаре грозит снова скатиться к войне. Но я отказываюсь повторять грехи моей семьи. Нахана и я с помощью ученых принесем эту новую эру через сотрудничество и примирение."
 opening_event_1254_kashirya.8.a: "Предательства Шейтары должны прекратиться."

 # Damodara of Eshkatabad
 opening_event_1254_kashirya.9.t: "Гора мертвецов"
 opening_event_1254_kashirya.9.desc: "[Concept('frodbrokna','Фродброкна')|E] сломала нас. Древняя линия саканкров была почти разрушена, как и в [Concept('chan_skorpokaipis','Чан Скорпокаиписе')|E]. И все же мы выстояли благодаря собственной силе, и взяли в руки меч на этот раз вместо того, чтобы трусливо прятаться за нашими стенами. Саканкры теперь знают силу внутри себя, и я намерен обрушить ее. Даже Магийор не сможет противостоять моей мести!\n\nЯ знал боль в своей жизни. Я держал одну жену, умирающую на моих руках, пока у нее вырывали младенца. Я видел, как другая моя невеста подсыпала листья в чай моей матери и улыбалась, пока та задыхалась. Моя боль ведет меня, делает меня больше, чем человеком. Я — дух саканкрского народа. Я — яростный аватар мести, который не остановить. Священной мощью Хараданов я поклялся, что Каширия узнает мой гнев."
 opening_event_1254_kashirya.9.a: "Кто падет первым?"

 # Kresjsla 'Kraken-Eater'
 opening_event_1254_kashirya.10.t: "Направляясь на восток"
 opening_event_1254_kashirya.10.desc: "Я далеко, очень далеко от войска моего народа.\n\nУ меня не было никаких проблем с Ценваром или его коалицией, скорее наоборот. Я была еще девчонкой, когда она сформировалась, пораженная чудом, когда говорила с новыми спутниками нашего народа — праведными гетианцами и дикокудрыми воинами салакадцев. Они говорили о своих домах, о степях и холмах за пределами нашего великого леса, и даже дальше них — о Великом Катуне, империи, которую они презирали и высмеивали так же, как мы [Concept('aversaria','Аверсарию')|E]. Место сокровищ и достопримечательностей сверх воображения, на которое, возможно, ни один сьялволк никогда не бросил взгляда.\n\nКогда Кормаг Фенрус откололся от Имперреха и объявил, что мы должны отправиться на восток, я была среди его самых ревностных последователей. Я заслужила свое имя, когда на один из наших кораблей напал щупальценосная тварь из глубин. Я прыгнула с носа и, как безумное животное, вонзила зубы в кракена. Хотя именно наши гарпуны в конечном итоге повалили его, моя безумная храбрость и чудесное выживание заслужили улыбку самого Старого Пса.\n\nКогда мы наконец высадились в [GetTitleByKey('c_asiupoli').GetNameNoTier], я knew, что мое путешествие не окончено. Пока большинство фенвиров готовились сделать его домом нашего народа и встать против Сокрушителя Ведьм, если его войско когда-либо вторгнется в их добычу, я собрала тех, у кого в сердцах все еще была страсть к странствиям, и с благословения Старого Пса мы снова подняли паруса. В нашем потрепанном флоте мы плыли все дальше, открывая земли и чудеса, о которых я едва ли могла мечтать, пока не высадились здесь, дальше, чем плавал любой другой сьялволк. Тем не менее, я знаю, что мои путешествия еще не закончены. В Каширии есть богатства и слава, но я все еще помню истории, которые слышала в детстве. Катун зовет мое сердце, и я должна решить, прислушаться ли к нему."
 opening_event_1254_kashirya.10.a: "Моя судьба — это то, что я сотворю сама."

 # Viesuados Heirs' Makis & Yiorgos
 opening_event_1254_kashirya.11.t: "Наше предательство"
 opening_event_1254_kashirya.11.desc.viesuados_heirs: "[viesuados_wrath_leader.GetFirstName], ты исчадие! Будь проклят ты и те, кто следует за тобой, будьте прокляты вы все! Я не спал все эти годы с тех пор, как твой мятеж превратил мое сердце в лед и разбил его о скалы этого удушающего архипелага. Любовь, которую я когда-то держал, удушена. Но прежде чем я сделаю последний вдох, я клянусь исправить твое предательство!"
 opening_event_1254_kashirya.11.desc.viesuados_wrath: "Честь, долг, верность. Все, чего я хотел — это лучшего для нас, но [viesuados_heirs_leader.GetFirstName] выбрал эти «ценности» вместо нашей связи. Для нас ничего не осталось на этих проклятых островах, несмотря на то, во что когда-то верили наши старейшины, несмотря на то, во что могут верить ублюдки [viesuados_heirs_leader.GetFirstNamePossessiveNoTooltip], и пока мы не отплыли на юг, я сделаю так, чтобы [viesuados_heirs_leader.GetSheHe] понял эту правду!"
 opening_event_1254_kashirya.11.a: "Виесуад получит свое возмездие, и я тоже!"
 opening_event_1254_kashirya.11.b: "Как я мог когда-либо простить такое предательство?"

 # King Bhramkarod of Adlurbad
 opening_event_1254_kashirya.12.t: "Неумирающий священый поход"
 opening_event_1254_kashirya.12.desc: "Свет свечи отбрасывает изнуренные тени на обсидианово-кирпичные стены заброшенного подземелья. Некоторые из теней шепчут — а затем некоторые из них визжат.\n\n«Двенадцать» — неожиданно вспоминаю я. Двенадцать хрупких тел, включая мое, издают вопли такой зверской свирепости, что частичка нашего разума, нашей невиновности и нашего здравомыслия смываются прочь. Ради какой цели? Какое размышление могло быть у этих дикарей дарамарджаратанистов, требовавшее кражи двенадцати детей из их семей — чтобы запереть их в этой обсидиановой тюрьме; чтобы пускать им кровь медленно и болезненно, физически и мысленно? Увы, одиннадцати из них никогда бы не выпал шанс узнать.\n\nОстался только я. Сломленный человек, несущий несломленную клятву — очистить земли от этой скверны, ибо я никогда не успокоюсь, пока все мои враги не будут лежать на глубине шести футов, извиваясь в своих могилах. И я так близок к своей цели. Осталось только одно государство — Касни. Но неприятности завариваются и дома. Моим подданным-вассалам не хватает моего рвения, а мои генералы сговариваются против меня. Пусть попробуют. На имя, данное мне — «Бич Смерти», я клянусь, что никто не остановит меня."
 opening_event_1254_kashirya.12.a: "Пусть. Они. Попробуют."

 # Count Shahu of Kasni
 opening_event_1254_kashirya.13.t: "Побеждает тот, кто терпит"
 opening_event_1254_kashirya.13.desc: "Я служил своему народу столько, сколько себя помню. Неустанно работал и следовал каждому совету, который давал мне мой совет. И все же они сплетничают за моей спиной, насмехаясь над моими способностями править собственными землями. Слова столь острые, но больно правдивые, что иногда я изо всех сил пытаюсь встать с постели, не смея войти во двор, чтобы не услышать те же колкости и насмешки. Мое единственное утешение — в компании солдат, которых я нанимаю, в напряжении учебного боя и искусстве клинка.\n\nДва года назад моя настоящая сила была испытана, когда безумный король Адлурбада напал на меня. И все это из-за какой-то идиотской концепции прекращения нашей веры. Дурак! Нельзя изменить сердца людей глупыми вторжениями. Нужно обнажить свою грудь перед людьми и защищать их!\n\nПрогнав его силы, гораздо большие, чем мои, моя слава выросла весьма высоко. Превратившись из «Неуклюжего дурака Касми» в «Чемпиона Дарамарджаратов», что продвинуло силу моих войск еще дальше. Только теперь мой народ видит мое истинное великолепие и талант!"
 opening_event_1254_kashirya.13.a: "Выдержать все невзгоды и добиться успеха — истинный признак достоинства."

 # Queen Katilana of Adlurbad
 opening_event_1254_kashirya.14.t: "Лживая тень Бича"
 opening_event_1254_kashirya.14.desc: "Когда религия и догмы столкнулись в смеси крови, стали и смерти во время [Concept('murtuy_ka_varha','Муртуй ка Вархи')|E], некогда обширное влияние нашей веры на кашириийцев увяло. Сведясь к царствам, которые продолжают тонуть в своем декадентском нейтралитете. Они предлагают Великой Богине подслащенный творог в качестве подношения, но Ее эфемерному Царству требуется жертва, чтобы процветать! Что-то, что мы, истинные верующие, предоставим.\n\nОдним из придуманных способов было похищать молодых детей, чтобы воспитывать чувство жгучей ненависти к еретикам-дарамарджаратанистам. Чтобы найти одного, кто был бы достаточно достоин доставить наш приговор. Именно в одном из таких начинаний я впервые встретила Бхрамкарода, тогда еще ребенка. По мере того как рос его гнев, укреплялась его решимость. Наконец мы нашли его.\n\nМне было поручено оставаться рядом с ним, на поверхности как его любимая жена, которая направляла и выхаживала его от его врагов. Но под всем этим — зубило, чтобы точить его навыки и гнев против наших врагов. Поскольку мы провели вместе жизнь, я полюбила его больше, чем просто оружие. Я только надеюсь, что мы снова встретимся после смерти в Царстве Великой Богини. Но пока у нас есть работа."
 opening_event_1254_kashirya.14.a: "Я обожаю тебя, мой Кайрави. Но моя вера на первом месте."

