l_russian:
  amsari_flavor.1000.t:0 "Бегство из рабства"
  amsari_flavor.1000.desc:0 "Мне докладывают о происшествии во дворе. Группа рабов бежала из далёкой страны и ищет убежища в моих владениях. По закону, ступив на землю [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTierNoTooltip], они стали свободны, но идти им некуда. Беглецы также говорят, что бывший хозяин отправил за ними охотников, чтобы вернуть их. Моего слова достаточно, чтобы они обрели свободу в моей державе, но я могу и прогнать их."
  amsari_flavor.1000.a:0 "Пусть остаются свободными"
  amsari_flavor.1000.b:0 "Прогнать их"
  amsari_flavor.1000.c:0 "Я свяжусь с их законными хозяевами"
  amsari_flavor.1000.d:0 "Бедняги... Вот вам немного денег"