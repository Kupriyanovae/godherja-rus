l_russian:
 amsari.0002.t:0 "Хиклахн скорбит"
 amsari.0002.desc:0 "Мой отец, Пейджман, мёртв. В этом нет сомнений. Вчера весть принёс конный гонец из дворца, но не прошло и дня, как её разнесли по всей стране речники и торговцы. Не сомневаюсь и в том, что мои братья созывают войска, готовясь силой занять опустевший престол. Отец убеждал нас мирно признать своим повелителем старшего из братьев, однако многие — быть может, большинство — и не думают исполнять его волю. Теперь мне предстоит выбор: выступить в поход или остаться в стороне от грядущей войны?"
 amsari.0002.a:0 "Трон мой по праву!"
 amsari.0002.a.tt:0 "#W Вы объявите войну#! и напрямую вступите в гражданскую войну, которая начинается #W прямо сейчас#!"
 amsari.0002.b:0 "Это не моя война."
 amsari.0002.b.tt:0 "#W Вы останетесь вне войны#! и не станете участвовать в братоубийственной гражданской войне, которая начинается #W прямо сейчас#!"
 amsari.0004.t:0 "Падение принца"
 amsari.0004.desc:0 "После упорной борьбы мои победоносные войска сокрушили принца [loser.GetName]: его армии рассеяны, а цитадели взяты штурмом. Теперь его волокут ко мне, и я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] решить, как поступить с мятежным братом."
 amsari.0004.a:0 "Забрать всё, но сохранить ему жизнь."
 amsari.0004.a.tt:0 "Вы получите все титулы, которыми владеют [loser.GetName] и его вассалы"
 amsari.0004.b:0 "Забрать всё и задушить его."
 amsari.0004.b.tt:0 "Вы захватите личные владения [loser.GetName], казните его и подчините остальных вассалов"
 amsari.0004.c:0 "Задушить его, а земли оставить местным правителям."
 amsari.0004.c.tt:0 "Вы казните [loser.GetName] и подчините все оставшиеся земли"
 amsari.0005.t:0 "Хиклахн скорбит"
 amsari.0005.desc:0 "Для империи наступает мрачный день. Последний Пророк не предвидел смерти Пейджмана и ничего не поведал о том, что случится дальше. Но одно мне известно точно: война близка. Принцы годами строили друг против друга козни — это было ни для кого не секретом, однако все предпочитали не думать о том, что этот день придёт.\n\nИ всё же мысль о собственной империи не даёт мне покоя... Хватит ли мне сил захватить Хиклахн? Стоит ли выступить против остальных недостойных претендентов? Или лучше удержать клинок и войска, чтобы пережить грядущие смерть и разорение?"
 amsari.0005.a:0 "[Select_CString(ROOT.Char.IsFemale, 'Настало время новой императрицы!', 'Настало время нового императора!')]"
 amsari.0005.a.tt:0 "#W Вы объявите войну#! и напрямую вступите в гражданскую войну, которая начинается #W прямо сейчас#!"
 amsari.0006.t:0 "Поход на Тчоран"
 amsari.0006.desc:0 "Когда мои армии приблизились к столице, меня охватило ликование. Неужели это начало новой империи? Без этой великолепной метрополии, без столицы никто не признал бы меня [Select_CString(ROOT.Char.IsFemale, 'истинной преемницей', 'истинным преемником')] Хиклахна. Теперь же никто не посмеет усомниться в моей силе и решимости объединить империю вопреки этим недостойным претендентам. Потребуются дни или годы, но я не прекращу войну, пока передо мной остаётся хоть один противник!"
 amsari.0006.a:0 "Столица будет моей!"
 amsari.0007.t:0 "Война продолжается"
 amsari.0007.desc:0 "У моего наследства горький привкус. Титулы, земли, деньги — и отчаянная война не на жизнь, а на смерть за древний престол моей династии. Следовать ли мне по стопам предшественника? Моя свита уже собралась в [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], чтобы защитить меня от бесчестья. Или настало время сложить оружие и просить мира?\n\nКак бы то ни было, теперь всё зависит от меня."
 amsari.0007.a:0 "Нелёгкое бремя..."
 amsari.0008.t:0 "Наконец победа! Вечная слава!"
 amsari.0008.desc:0 "Претенденты повержены, их цитадели разрушены, а надежды растоптаны! Священные земли предков и священный долг вести и защищать амсаров — по праву меча всё это отныне лежит на мне. Принцы, благоразумно не поднявшие против меня оружие, вновь сделали мудрый выбор и теперь клянутся мне в верности, признавая мою законную власть. И всё же за их замыслами стоит внимательно следить.\n\nСтоя во дворце предков и размышляя о будущем, я слышу с улиц женский плач, возвещающий о новых похоронах. Гражданская война дорого обошлась амсарам, и на восстановление уйдут долгие годы. Но мы переживали и худшие бедствия. Наш народ вырвался из беспросветного рабства и стал хозяином величайшей империи Эраса — нет такой кары судьбы, которую мы не сумели бы преодолеть."
 amsari.0008.tt:0 "Все независимые де-юре титулы амсаров перейдут под мою власть"
 amsari.0008.a:0 "Рассвет нового Канамсара"
 amsari.0009.t:0 "Вечная война"
 amsari.0009.desc:0 "#N "Глупцы в своей гордыне поднимут оружие против братьев и сестёр. Не будет им победы — лишь вечность среди вдов и сирот войны. Священная река выйдет из берегов и затопит землю сгустками крови. Заоран и его сыновья в стыде отвернутся от вас. Дьяволы будут плясать на выжженной земле, а гнусное колдовство исказит тела ваших детей. Век тьмы опустится, подобно утреннему туману, и даже добродетельнейшие из вас ослепнут."#!\n— Пророк Анаферн\n\nГоды войны, годы смерти и лишений. Наша родина, дарованное самим Пророком наследие, добытое страданиями предков, истекает кровью! Пусть [ROOT.GetCharacter.GetFaith.HighGodName] простит нас за то, чем мы пренебрегли. Пятьдесят долгих лет бушует этот конфликт — беспрецедентный для Хиклахна срок. Гражданских войн у нас было немало, но такой — никогда! Целое поколение, не знавшее единства, уже достигло зрелости, и лишь горстка стариков ещё ясно помнит времена до раскола амсарского народа.\n\nБыть может, это ещё не конец Хиклахна. Быть может, однажды кто-то вновь объединит наш враждующий народ и вернёт порядок туда, где теперь царит хаос. Но сейчас престол Канамсаров остался лишь в памяти. Короны больше нет."
 amsari.0009.a:0 "Впереди ещё более тёмные дни..."
 amsari.0010.t:0 "Гниль разрослась"
 amsari.0010.desc:0 "Без правителя из исконной царской династии и без возможности восстановить империю разложение наконец добралось до самого её сердца. Гниль разрослась слишком широко и проникла повсюду. Империю уже невозможно удержать вместе — её распад неизбежен."
 amsari.0010.a:0 "Пусть империя распадётся."
 amsari.0011.t:0 "Война на западе"
 amsari.0011.desc:0 "Хрупкое единство, с трудом созданное Пейджманом, окончательно разрушено его смертью. Теперь дети и вассалы покойного соперничают друг с другом за престол. Соседняя Западная королевская торговая компания наверняка наживётся на этой войне — а то и воспользуется ею ради собственных замыслов...\n\nК счастью, война едва ли перекинется в соседние державы. Но если конфликт так и не разрешится, политическая карта западного Саррадона изменится навсегда."
 amsari.0011.a:0 "Тревожные времена."

 reform_the_shattered_empire:0 "Воссоединить расколотую империю"
 reform_the_shattered_empire_desc:0 "Смертям и страданиям амсарского народа наконец можно положить конец. Наконец-то! Гражданская война окончена, а престол — мой."
 reform_the_shattered_empire_confirm:0 "Воссоединить империю"
 reform_the_shattered_empire_tt:0 "Империя воссоединится, а все разрозненные вассалы вновь окажутся под вашей властью."
 reform_the_shattered_empire_tooltip:0 "Да будет правление [GetPlayer.GetName] долгим!"
 reform_the_obliterated_empire:0 "Восстановить уничтоженную империю"
 reform_the_obliterated_empire_desc:0 "Гражданская война разрушила старый Хиклахн, и с тех пор его так и не восстановили. Чтобы вновь объединить эти земли, потребуется великий предводитель и завоеватель."
 reform_the_obliterated_empire_tt:0 "Будет создан титул «Амсарский Хиклахн»"
 reform_the_obliterated_empire_confirm:0 "Воссоединить империю"
 reform_the_obliterated_empire_tooltip:0 "Да будет правление [GetPlayer.GetName] долгим!"
 hire_marcher_mercenaries:0 "Нанять марочникских наёмников"
 hire_marcher_mercenaries_desc:0 "Западная королевская торговая компания марочников предлагает наёмников по вполне доступной цене. Для победы в этой войне пригодится каждый боеспособный воин."
 hire_marcher_mercenaries_confirm:0 "Заплатить!"
 hire_marcher_mercenaries_tt:0 "[GetPlayer.GetName] заплатит правителю Западной королевской торговой компании 100 дукатов за 600 наёмников."
 hire_marcher_mercenaries_tooltip:0 "Требуется 600 марочникских наёмников"
 the_hiklahn_needs_change:0 "Хиклахну нужны перемены"
 the_hiklahn_needs_change_desc:0 "Империя гниёт изнутри. Видения Пророка веками направляли наш народ и сдерживали человеческие алчность и продажность. Но теперь проблема становится всё очевиднее. Амсары нуждаются в реформах, а народу нужна более сильная власть."
 the_hiklahn_needs_change_confirm:0 "Нам нужны перемены!"
 the_hiklahn_needs_change_tooltip:0 "Без перемен мы обречены вновь уничтожить самих себя"
 marcher_empire_amsari:0 "Создать новую марочникскую империю"
 marcher_empire_amsari_desc:0 "В бесконечной борьбе за земли некогда великого и могучего народа амсаров наконец определился победитель — [Concept('marchers','марочники')|E]. Интригами, хитростью и оружием мы одолели остальных претендентов и захватили престол. Богатства новых земель позволят нам создать в Саррадоне марочникскую империю, которая не уступит державе наших северных собратьев."

 marcher_empire_amsari_tooltip:0 "Создать в Саррадоне новую марочникскую империю"
 marcher_empire_amsari_confirm:0 "Амсар — мой!"
 form_the_empire_of_amsar_decision_tooltip:0 "Создать #high Верховное королевство Амсаре#!"

 AMSARI_CIVILWAR_WAR_NAME:0 "Амсарская гражданская война"
 amsari_civil_war_defender_desc:0 "Вы потеряете всё — и будете счастливы, если хотя бы сохраните жизнь."