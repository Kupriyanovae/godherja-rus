l_russian:
 gh_korlacan_events.0001.t:90 "Ученики Священного пламени"
 gh_korlacan_events.0001.desc:90 "Священный Огненный храм Корлаку восстановлен, и теперь мне предстоит выбрать ученика, которого я обучу и воспитаю по своему образу. Подойдёт лишь сильнейший из кандидатов."
 gh_korlacan_events.0001.a:90 "[first.GetNameNoTooltip] подаёт надежды." 
 gh_korlacan_events.0001.b:90 "[second.GetNameNoTooltip] будет [Select_CString(second.IsFemale, 'выбрана', 'выбран')]."
 gh_korlacan_events.0001.c:90 "Кто будет служить мне, решит смертельный поединок."
 gh_korlacan_events.0001.c.duel.firstwins:0 "Побеждает [first.GetName]."
 gh_korlacan_events.0001.c.duel.secondwins:0 "Побеждает [second.GetName]."
 gh_korlacan_events.0001.d:90 "Никто из них меня не устраивает." 
 gh_korlacan_events.0001.d.tt:90 "Вы отвергаете [first.GetName] и [second.GetName]"


 gh_korlacan_events.0002.t:90 "Возрождение из пепла"
 gh_korlacan_events.0002.desc:90 "Еретики Наттанана со своей слепой преданностью капризным богам-близнецам и примитивным поклонением дикой природе были сокрушены мощью последователей Корлаку. Когда-то их священные рощи нашёптывали дерзость, а святилища стояли символами хаоса, насмехаясь над порядком цивилизации. Теперь же царит тишина, их корни обуглены, а идолы повержены.\n\nИз пепла этого разрушения вновь восстало жречество Вечного пламени — маяк просвещения и индустрии, затмевающий тусклый свет примитивной природы. Огонь Корлаку, несгибаемый и вечный, пылает ярче, чем когда-либо, прокладывая путь цивилизации вперёд.\n\nПо всей земле звенят колокола в честь этой победы. Последователи Корлаку воспевают гимны триумфа, прославляя торжество порядка и прогресса над заблуждениями суеверий. Цивилизация восторжествовала, её свет изгоняет тени ереси."
 gh_korlacan_events.0002.a:90 "Слава Вечному пламени!"

 gh_korlacan_events.0003.t:90 "Очищение земель"
 gh_korlacan_events.0003.desc:90 "Земля очищена от гнусных еретиков, посмевших отвергнуть праведность Корлаку. Их зло вырвано с корнем, скверна выжжена, а верные отныне едины. Пусть это станет свидетельством силы и правоты нашего святого дела."
 gh_korlacan_events.0003.a:90 "Слава Корлаку, Вестнику огня!"


 gh_korlacan_events.0004.t:0 "Джунгли теперь наши"
 gh_korlacan_events.0004.desc:0 "Наконец троны корлаканских королевств объединены под властью [ROOT.Char.GetTitleAsNameNoTooltip]. Ложные корлаканские монархи лишились корон, а [ROOT.Char.GetPrimaryTitle.GetNameNoTier] теперь сильнее, чем когда-либо.\n\nОднажды я покину этот мир и отправлюсь в [ROOT.Char.GetFaith.DivineRealm], но моё наследие навсегда останется на [Concept('aeras','Аэрасе')|E]. Меня будут звать «[ROOT.Char.GetTitledFirstNameNoTooltip] — [ROOT.Char.GetMotherFather|U] корлаканцев»."
 gh_korlacan_events.0004.a:0 "Это рассвет новой эпохи."
 establish_aungkyi_thuriya_decision_titles_tt:0 "Каждый принадлежащий вам корлаканский [Concept('title','титул')|E] уровня [Concept('kingdom','королевства')|E] войдёт [Concept('de_jure','де-юре')|E] в состав вашего основного титула ([THIS.Char.GetPrimaryTitle.GetNameNoTier])"

 gh_korlacan_events.0005.t:0 "Наконец объединены"
 gh_korlacan_events.0005.start.desc:0 "Одно за другим некогда могучие корлаканские королевства пали под власть [korlacan_conqueror.GetPrimaryTitle.GetNameNoTier]."
 gh_korlacan_events.0005.relation_former.desc:0 "[Select_CString(korlacan_conqueror.IsFemale, 'Моя', 'Мой')] [ROOT.Char.Custom2('RelationToMe', korlacan_conqueror)] [korlacan_conqueror.GetTitledFirstName]"
 gh_korlacan_events.0005.former.desc:0 "[korlacan_conqueror.GetTitledFirstName]"
 gh_korlacan_events.0005.end.desc:0 "[Select_CString(korlacan_conqueror.IsFemale, 'провозгласила', 'провозгласил')] себя «[korlacan_conqueror.GetMotherFather|U] корлаканцев».\n\n[korlacan_conqueror.GetHerHis|U] имя наверняка переживёт века, но войдёт ли [korlacan_conqueror.GetSheHe] в память [Select_CString(korlacan_conqueror.IsFemale, 'героиней или тиранкой', 'героем или тираном')]? Это знает лишь [ROOT.Char.GetFaith.FateGodName]."

 gh_korlacan_events.0006.t:0 "Пламя разожжено вновь"
 gh_korlacan_events.0006.desc:0 "После долгих лет труда и служения священные кузницы Корлаку вновь пылают, разгоняя светом тени упадка и забвения. Вечное пламя разожжено, Кузница и рудники Корлаку снова гремят, возвещая начало новой эпохи промышленности и прогресса. Отныне корлаканцы сами будут вершить свою судьбу, доказывая, что цивилизация и изобретательность сильнее хаоса дикой природы."
 gh_korlacan_events.0006.a:0 "Пусть огонь горит ярко и неукротимо!"


 gh_korlacan_events.0007.t:0 "Восстановление священной кузницы"
 gh_korlacan_events.0007.desc:0 "Древняя Кузница Корлаку вновь обрела былое величие, и её священный огонь пылает как прежде. Шахты дают драгоценную руду тёмной стали, кузница работает в полную силу, и вершины корлаканской технологии снова доступны. Владелец этого легендарного места может призвать мощь бомбард и колоссов из тёмной стали — оружия и механизмов, служащих несокрушимыми символами промышленности и прогресса. Вечное пламя вспыхнуло вновь, а вместе с ним вернулась неукротимая сила корлаканской цивилизации."
 gh_korlacan_events.0007.a:0 "Пламя горит ярче, чем когда-либо!"


 gh_korlacan_events.0008.t:90 "Выбор достойного наследника"
 gh_korlacan_events.0008.desc.intro:90 "Сотни лет священная должность верховного жреца переходит из поколения в поколение после тщательного отбора. Если собственный ребёнок верховного жреца не заслуживает права унаследовать должность духовного главы, следует призвать кандидатов из Огненного храма. Как поступали поколения моих предшественников, так поступлю и я: призову из дворца двух сильнейших молодых [Concept('magi','магов')|E] и определю, кому наследовать мою должность. Обеспечив преемственность, я смогу сосредоточиться на защите земли от внутренних распрей, еретиков и чужеземцев."
 gh_korlacan_events.0008.desc.heir:90 "Я могу не выбрать никого или отдать предпочтение одному из них. Впрочем, едва ли [old_heir.GetFirstName] обрадуется, если лишится того, что, как [old_heir.GetSheHe] считает, является [old_heir.GetHerHis] законным местом."
 gh_korlacan_events.0008.desc.no_heir:90 "Я могу выбрать одного или другого — но не обоих." 
 gh_korlacan_events.0008.a:90 "[first.GetNameNoTooltip] подаёт надежды." 
 gh_korlacan_events.0008.b:90 "[second.GetNameNoTooltip] будет [Select_CString(second.IsFemale, 'выбрана', 'выбран')]."
 gh_korlacan_events.0008.claim_tt:90 "Получает [Concept('pressed_claims','обоснованные претензии')|E] на все ваши [Concept('titles','титулы')|E]" 
 gh_korlacan_events.0008.c:90 "Никто из них меня не устраивает." 
 gh_korlacan_events.0008.c.tt:90 "Вы отвергаете [first.GetName] и [second.GetName]"