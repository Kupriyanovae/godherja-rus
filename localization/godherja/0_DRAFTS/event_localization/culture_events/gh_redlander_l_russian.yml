l_russian:
 gh_redlander_events.0001.t:90 "Отпрыски Бездны"
 gh_redlander_events.0001.desc.intro:90 "Они выходят под покровом тьмы, и их чёрные одеяния сливаются с багряной землёй, словно истекающей кровью. Их двое — два отпрыска Бездны, два служителя нечестивых богов, два... ученика, способных однажды продолжить моё дело.\n\n"
 gh_redlander_events.0001.desc.heir:90 "Я могу не выбрать никого или отдать предпочтение одному из них. Впрочем, едва ли [old_heir.GetFirstName] обрадуется, если лишится того, что, как [old_heir.GetSheHe] считает, является [old_heir.GetHerHis] законным местом."
 gh_redlander_events.0001.desc.no_heir:90 "Я могу выбрать одного из них — но не обоих."
 gh_redlander_events.0001.a:90 "У [first.GetNameNoTooltip] есть задатки."
 gh_redlander_events.0001.b:90 "Я выбираю [second.GetNameNoTooltip]."
 gh_redlander_events.0001.claim_tt:90 "Получает [Concept('pressed_claims','обоснованные претензии')|E] на все ваши [Concept('titles','титулы')|E]"
 gh_redlander_events.0001.c:90 "Никто из них не подходит."
 gh_redlander_events.0001.c.tt:90 "Вы отвергаете [first.GetName] и [second.GetName]"


 gh_redlander_events.0002.t:0 "Тёмный ритуал"
 gh_redlander_events.0002.desc:0 "Я затачиваю жертвенный кинжал для подношений Тёмным богам, которым служу, когда позади раздаётся шум. Обернувшись, я вижу незнакомую фигуру в капюшоне, которая приближается ко мне, волоча двух связанных и избитых пленников-красноходцев. «Приветствую, [ROOT.GetCharacter.GetFirstName] [ROOT.GetCharacter.GetDynasty.GetName]. Меня зовут [great_commander.GetFirstName]. Я привожу новых кандидатов, чтобы порадовать наших тёмных владык».\n\nТусклый свет факела [great_commander.GetFirstNamePossessive] отбрасывает зловещие тени на высокие чёрные стены каньона. Пленники слабо бьются в путах, пока мы подходим к ритуальному алтарю, чёрный тёсаный камень которого багровеет от засохшей крови. Уложив обоих на алтарь, я задумываюсь: достаточно ли двух жертв, чтобы угодить моим тёмным владыкам? Возможно, потребуется больше крови..."
 gh_redlander_events.0002.a:0 "Ааа... Свежее мясо..."
 gh_redlander_events.0002.b:0 "Этот человек мне ещё пригодится."


