l_russian:
 elephant_race.0001.t:0 "Игры начинаются"
 elephant_race.0001.desc:0 "Я прибываю на место бегов и вижу веселье, которому мало где найдётся равных. Базары, арены, огромные гоночные круги... поистине грандиозное зрелище. Бедные музыканты играют для князей и нищих, а все грехи, кроме самых тяжких, забыты и прощены. Здесь, на слоновьих бегах, вся Каширия на долгие дни объединяется в общем празднике."
 elephant_race.0001.a:0 "Посмотрим, что я смогу найти..."
 elephant_race.0001.b:0 "На самом деле, меня это не интересует"

 elephant_race.1001.t:0 "Предложение торговца"
 elephant_race.1001.desc:0 "По пути к своим покоям я прохожу мимо рядов палаток, и моё внимание привлекают яркий наряд и зазывающий голос.\n\n«А, подойдите, друг мой. Такой [Select_CString(ROOT.Char.IsFemale, 'госпоже', 'господину')], как вы, наверняка нужны подобающие украшения!»\n\nПредложенные [Select_CString(trinket_merchant.IsFemale, 'ею', 'им')] безделушки вовсе не дурны, но до разумной цены им далеко."
 elephant_race.1001.a:0 "«По рукам»."
 elephant_race.1001.b:0 "Пора испытать своё мастерство торга..."
 elephant_race.1001.b.success:0 "Торговец соглашается снизить цену"
 elephant_race.1001.b.success.t:0 "Вам удалось сбить цену"
 elephant_race.1001.b.failure:0 "Торговец раскусывает вас и перехитряет"
 elephant_race.1001.b.failure.t:0 "Торговец перехитрил вас"
 elephant_race.1001.b.tt:0 "Вы торгуетесь с торговцем"
 elephant_race.1001.c:0 "«Я пас»."

 elephant_race.1002.t:0 "Сладкий обмен?"
 elephant_race.1002.desc:0 "По пути к своим покоям я сталкиваюсь со слугой. Тихо выругавшись, [Select_CString(servant.IsFemale, 'она', 'он')] помогает мне подняться и кланяется.\n\n«Простите, [Select_CString(ROOT.Char.IsFemale, 'госпожа', 'господин')], я [Select_CString(servant.IsFemale, 'спешила', 'спешил')]. Позвольте предложить вам в возмещение местное лакомство — ему нет равных».\n\nУвидев пыль на моей одежде, слуга явно смущается, однако с наступлением темноты становится понятно: моего гнева [Select_CString(servant.IsFemale, 'она', 'он')] боится сильнее, чем собственного позора."
 elephant_race.1002.a:0 "«Звучит восхитительно»."
 elephant_race.1002.b:0 "«Ступай своей дорогой, [Select_CString(servant.IsFemale, 'служанка', 'слуга')]. Мне некогда»."
 elephant_race.1002.c:0 "«Я с тебя шкуру спущу!»"
 elephant_race.1002.d:0 "«Это... креветки? Я уже [Select_CString(ROOT.Char.IsFemale, 'объелась', 'объелся')] креветками!»"

 elephant_race.1003.t:0 "Борьба за приз"
 elephant_race.1003.desc:0 "Большая арена на окраине лагеря привлекла самых разных зрителей. Внутри один за другим проходят борцовские поединки, и больше я не могу их игнорировать. Войдя, я вижу могучего мастера древнего искусства, который обращается к толпе, словно к своим подданным.\n\n«Остался ли ещё мужчина или женщина, которым хватит глупости выйти против меня? Нет?»\n\nВ умении борцу не откажешь, но его высокомерие очевидно. Быть может, стоит преподать ему урок?"
 elephant_race.1003.a:0 "«Тебе нужен урок смирения!»"
 elephant_race.1003.a.success:0 "Вы побеждаете высокомерного борца"
 elephant_race.1003.a.failure:0 "Борец унижает вас"
 elephant_race.1003.b:0 "«Как насчёт места в моём доме?»"
 elephant_race.1003.b.success:0 "Борец соглашается присоединиться к вашему двору"
 elephant_race.1003.b.success.t:0 "Борец присоединяется к вам"
 elephant_race.1003.b.failure:0 "Борец смеётся над вашим предложением"
 elephant_race.1003.b.failure.t:0 "Борец отказывается"
 elephant_race.1003.c:0 "Что стало с этим древним искусством..."

 elephant_race.1004.t:0 "Толпы гуляк"
 elephant_race.1004.desc:0 "Ночью я прогуливаюсь среди гоночных кругов и натыкаюсь на ватагу гуляк, веселящихся между кое-как поставленными палатками. Их одежда промокла, улыбки перекошены, а от запаха выпивки и всевозможной диковинной еды никуда не скрыться.\n\n«Эй, ты! Выпить хочешь или как?» — их [Select_CString(drunkard.IsFemale, 'предводительница', 'предводитель')], шатаясь, приближается ко мне и цедит заплетающимся языком: «Ещё одному место всегда найдётся!»"
 elephant_race.1004.a:0 "«Что плохого в одной кружке?»"
 elephant_race.1004.b:0 "«Друг, одного слова „выпить“ было достаточно!»"
 elephant_race.1004.c:0 "Зачем тратить время на пьяниц? Я прохожу мимо."

 elephant_race.1005.t:0 "[Select_CString(patron.IsFemale, 'Надменная гостья', 'Надменный гость')]"
 elephant_race.1005.desc:0 "По пути к гоночным кругам меня едва не сбивают с ног размашистые жесты [Select_CString(patron.IsFemale, 'особенно болтливой гостьи', 'особенно болтливого гостя')].\n\n«Смотри, куда ступаешь, [Select_CString(ROOT.Char.IsFemale, 'женщина', 'мужчина')]! Ты вообще понимаешь, где находишься?»\n\n[patron.GetFirstNameNoTooltip] [Select_CString(patron.IsFemale, 'одета', 'одет')] чрезвычайно богато, но манерами явно [Select_CString(patron.IsFemale, 'обделена', 'обделён')] и смотрит на меня с презрением. В [patron.GetHerHis] словах слышится вызов."
 elephant_race.1005.a:0 "«Следи за языком»."
 elephant_race.1005.a.success:0 "Посетитель с опаской отступает"
 elephant_race.1005.a.success.t:0 "Вы заставляете посетителя отступить"
 elephant_race.1005.a.failure:0 "Посетитель смеётся вам в лицо и уходит"
 elephant_race.1005.a.failure.t:0 "Посетитель остаётся невозмутим"
 elephant_race.1005.b:0 "Я поспешно удаляюсь от [Select_CString(patron.IsFemale, 'неё', 'него')]"
 elephant_race.1005.c:0 "«Судя по вашему присутствию, в заднице коровы, идущей на север»."

 elephant_race.2001.t:0 "Праздные пересуды"
 elephant_race.2001.desc:0 "Я сажусь на скамью у гоночного круга и замечаю, как за моей спиной устраиваются двое незнакомцев в плащах. Они говорят приглушённо, словно родители, которые боятся потревожить сон младенца. Что бы ни привело их на слоновьи бега, явно не желание сделать ставку на действующего чемпиона.\n\nЕсли слегка изменить позу, мне, возможно, удастся понять, о чём они говорят. Этот секрет может оказаться полезным."
 elephant_race.2001.a:0 "Я отклоняюсь назад и пытаюсь уловить их слова."
 elephant_race.2001.a.success:0 "Вы узнаёте от незнакомцев новый [Concept('secret','секрет')|E]"
 elephant_race.2001.a.success.t:0 "Вы узнаёте новый [Concept('secret', 'секрет')|E]"
 elephant_race.2001.a.failure:0 "Незнакомцы замечают вас и умолкают"
 elephant_race.2001.a.failure.t:0 "Вам не удаётся ничего услышать"
 elephant_race.2001.b:0 "Риск не стоит награды"

 elephant_race.2002.t:0 "Жестокая забава"
 elephant_race.2002.desc:0 "С началом первых заездов я замечаю странную сцену за трибунами. Дрессировщик с улыбкой тычет копьём одного из слонов. Животное не готовят к выходу на круг, и я не понимаю смысла этой жестокости.\n\nДрессировщик замечает меня в толпе, и его взгляд мрачнеет. Кажется, от меня ждут какой-то реакции."
 elephant_race.2002.a:0 "Одного взмаха руки достаточно. Кому есть дело до одного слона?"
 elephant_race.2002.b:0 "Надо прекратить это варварство!"
 elephant_race.2002.b.success:0 "Вы задерживаете дрессировщика, и его передают властям"
 elephant_race.2002.b.success.t:0 "Вы останавливаете жестокость"
 elephant_race.2002.b.failure:0 "Дрессировщик сбегает, и вину за крики страдающего слона возлагают на вас"
 elephant_race.2002.b.failure.t:0 "Дрессировщик сбегает"

 elephant_race.2003.t:0 "Непредвиденное представление"
 elephant_race.2003.desc:0 "С началом первых заездов я занимаю место, чтобы посмотреть на одного из недавних участников. Дрессировщики выводят слонов на старт. Я слишком далеко от первых рядов и почти не вижу людей вокруг животного, но толпа начинает тревожно перешёптываться. Сердцем чувствую неладное и невольно встаю.\n\nИ тут дрессировщика сверху окатывает целая река навоза.\n\nТолпа разражается хохотом, когда тот поскальзывается и падает прямо в кучу. От такого позора уже не скрыться."
 elephant_race.2003.a:0 "Какое зрелище! Какая забава! Ха!"
 elephant_race.2003.b:0 "Не стоит даже смеяться"

 elephant_race.3001.t:0 "Трудный выбор"
 elephant_race.3001.desc:0 "Великий финал стремительно приближается. Многие слоны ещё могут завоевать венец и принести своим покровителям выигрыш, но моё внимание привлекают лишь два. Первый — прежний победитель многих местных состязаний, которого считают непобедимым в любом заезде. Второй — новичок в этом спорте, уже прославившийся скоростью и мастерством.\n\nРешить, на кого поставить деньги, нелегко, но без риска игры не бывает."
 elephant_race.3001.a:0 "Бывший чемпион снова победит, я в этом [Select_CString(ROOT.Char.IsFemale, 'уверена', 'уверен')]"
 elephant_race.3001.b:0 "Новичок скоро станет чемпионом"
 elephant_race.3001.c:0 "Я не люблю рисковать. Может, внести... небольшие коррективы?"

 elephant_race.3002.t:0 "Чемпион побеждает!"
 elephant_race.3002.desc:0 "Заезд проходит в напряжённой борьбе. Чемпион медленно берёт разгон и поначалу не может сравняться с новым соперником. Моё сердце бьётся в такт тяжёлым шагам слонов, и я не в силах отвести взгляд. Чемпион приближается к финишу, по-прежнему идёт вторым, но не отступает ни на миг. У самой черты действующий победитель наконец показывает, на что способен.\n\nМой слон выигрывает на длину хобота.\n\nЯ ликую вместе со множеством зрителей вокруг. Выбор оказался верным, и скрыть радость невозможно!"
 elephant_race.3002.a:0 "Победа за мной!"

 elephant_race.3003.t:0 "Новый чемпион"
 elephant_race.3003.desc:0 "Чемпион с неожиданной уверенностью срывается с места. Если я хоть что-то понимаю в бегах, раннее лидерство — верный знак победы. Я не могу оторвать глаз от круга и всем телом чувствую каждый тяжёлый шаг. Победитель кажется очевиден, но поступь действующего чемпиона становится всё неувереннее.\n\nНо мой слон спотыкается — и всё потеряно.\n\nЯ разочарованно вздыхаю. Ставка проиграна лишь потому, что мой зверь не сумел пробежать по прямой. Вот так пропали хорошие деньги..."
 elephant_race.3003.a:0 "Какая жалость"
 elephant_race.3003.b:0 "«Я требую компенсации! Что за фарс?!»"

 elephant_race.3004.t:0 "Претендент пал!"
 elephant_race.3004.desc:0 "Действующий чемпион с неожиданной уверенностью срывается с места. Если я хоть что-то понимаю в бегах, раннее лидерство — верный знак победы. Я не могу оторвать глаз от круга и всем телом чувствую каждый тяжёлый шаг. Победитель кажется очевиден, но поступь фаворита становится всё неувереннее.\n\nСтоит сопернику моего слона споткнуться, и победа наша.\n\nЯ вскакиваю и кричу от восторга, празднуя успех своего зверя. Я богат!"
 elephant_race.3004.a:0 "Отличная ставка — без лишней скромности!"

 elephant_race.3005.t:0 "Родные стены помогают"
 elephant_race.3005.desc:0 "Заезд проходит в напряжённой борьбе. Чемпион медленно берёт разгон и поначалу не может сравняться с новым соперником. Моё сердце бьётся в такт тяжёлым шагам слонов, и я не в силах отвести взгляд. Действующий победитель приближается к финишу, по-прежнему идёт вторым, но не отступает ни на миг. У самой черты он наконец показывает, на что способен.\n\nМой слон проигрывает на длину хобота.\n\nЯ разочарованно вздыхаю. Похоже, ставка проиграна из-за лени моего слона. Вот так пропали хорошие деньги..."
 elephant_race.3005.a:0 "Что ж, всегда есть следующий год"
 elephant_race.3005.b:0 "«Что за тварь упустила такую фору? Принесите мне её голову!»"

 elephant_race.3006.t:0 "Гонка со временем"
 elephant_race.3006.desc:0 "Чемпион решил не защищать титул: всего за несколько часов до заезда он внезапно «подхватил нож в ногу». Мой слон легко обгоняет ослабленных соперников, хотя два из них всё же пытаются навязать борьбу. Я подаю знак рукой, и претенденты спотыкаются о препятствия, которым никак не полагалось оказаться на круге. В итоге лишь мой зверь может объявить себя победителем этого фарса.\n\nЯ с самого начала [Select_CString(ROOT.Char.IsFemale, 'знала', 'знал')], чем всё закончится, но всё равно не могу сдержать улыбку."
 elephant_race.3006.a:0 "Пусть толпа называет это мошенничеством — у меня-то карманы полные."

 elephant_race.3007.t:0 "Хитрости игры"
 elephant_race.3007.desc:0 "К моему удивлению, действующий чемпион всё же вышел на старт, несмотря на запоздалый приступ «ножа в ноге». С началом заезда он сразу вырывается вперёд, оставляя моего слона далеко позади. С сердцем, ушедшим в пятки, я подаю знак нескольким приятелям, которых привёл посмотреть на зрелище. Гоночный круг усеян препятствиями, но каким-то чудом слоны избегают обломков.\n\nВсе, кроме одного. Моего.\n\nМне трудно скрыть мрачный взгляд. Такого не должно было случиться. Этот день должен был стать днём моей победы."
 elephant_race.3007.a:0 "Похоже, махинации здесь мало что стоят."

 elephant_race.9001.t:0 "Триумф на бегах"
 elephant_race.9001.desc:0 "Бега принесли всё, на что я [Select_CString(ROOT.Char.IsFemale, 'надеялась', 'надеялся')]. Благодаря своим стараниям я [Select_CString(ROOT.Char.IsFemale, 'получила', 'получил')] достойную долю выигрыша и теперь возвращаюсь домой опытнее и богаче. Надеюсь, Каширия запомнит эти дни, ведь зрелище было незабываемым. Теперь весь мир видит во мне настоящего знатока слоновьих бегов. Кто посмеет усомниться в моём мастерстве?"
 elephant_race.9001.a:0 "Пора возвращаться домой"

 elephant_race.9002.t:0 "Возвращение с бегов"
 elephant_race.9002.desc:0 "Эти бега оказались нелепой шуткой, и я ухожу отсюда ровно с тем же, с чем [Select_CString(ROOT.Char.IsFemale, 'пришла', 'пришёл')]. Если Каширия и запомнит эти состязания, то не благодаря моим деяниям. Триумф достался другим, а мне остаётся возвращаться домой с опущенной головой. Быть может, на следующих играх я наконец получу заслуженную победу, но это уже совсем другая гонка."
 elephant_race.9002.a:0 "Пора оставить эти бега в прошлом"