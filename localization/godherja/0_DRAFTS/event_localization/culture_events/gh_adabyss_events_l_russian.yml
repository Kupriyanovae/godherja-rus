l_russian:
  ###invasion stuff
  #this decision gives you the empire
  become_adabyss_invasion_leader_decision:0 "Принять командование Мосеку Лимпегайл"
  become_adabyss_invasion_leader_decision_desc:0 "Доказав свою доблесть в захолустьях Дамоты, я наверняка заслужу повышение до лелманда — «военного предводителя» — и получу от начальства разрешение продолжить завоевания в дальних землях."
  become_adabyss_invasion_leader_decision_tooltip:0 "Запросить повышение до звания лелманда"
  become_adabyss_invasion_leader_decision_confirm:0 "Послать всадника на юг"
  become_adabyss_invasion_leader_decision_gain_adabyss_empire:0 "Ваше владение станет частью [Concept('adabyss', 'Адабисса')|E]"
  #become_adabyss_invasion_leader_decision_enable_adabyss_invasion_cb:0 "Вы получаете доступ к [Concept('adabyss_invasion_casus_belli', 'казусу белли Адабисса')|E]"
  adabyss_invasion_leader_title_tier_requirement:0 "Вы должны иметь титул [Concept('king', 'короля')|E] или [Concept('emperor', 'императора')|E]"

  #event you get when you form the empire
  adabyss_event.0001.t:0 "Мы — золотая гвардия"
  adabyss_event.0001.desc:0 "Ожидание возвращения посланного всадника полно тревоги. Следующие за ним дни молчания ещё тревожнее. Редкий лелманд получает столь почётное повышение за покорение настолько никчёмных земель. Ещё реже его получает тот, кто ничего не знает о землях впереди, особенно пока [Select_CString(ROOT.Char.IsFemale, 'её', 'его')] начальство ведёт куда более важные войны на юге и востоке... На пятый день мои сомнения развеивает гул могучих рогов. Из окна спальни я вижу их на горизонте — золотых и грозных:\n\nМосеку Лимпегайл.\n\nОни спускаются через просвет между небом и землёй в это тусклое царство, словно мерцающие звёзды: длинная колонна, среди которой шагают многочисленные золотые статуи. Они сияют так ярко, что на миг мне кажется, будто их послала сама Волмбаз-нза! Лимпегайл — лишь одно из младших ответвлений великого воинства Адабисса, но для меня и моих крестьян он выглядит не менее величественно, чем любая армия мира.\n\nЕго появление может означать лишь одно..."
  adabyss_event.0001.a:0 "Мосеку Лимпегайл теперь под моим началом."

  #event your vassals get
  adabyss_event.0002.t:0 "Новый лелманд"
  adabyss_event.0002.desc:0 "Из столицы пришла великолепная весть: милостью наших южных повелителей [adabyss_leader.GetTitledFirstName] получает звание лелманда. За [Select_CString(adabyss_leader.IsFemale, 'ней', 'ним')] по пескам идёт Мосеку Лимпегайл, и его доспехи сверкают на солнце. [Select_CString(adabyss_leader.IsFemale, 'Она', 'Он')] уже провозгласил[Select_CString(adabyss_leader.IsFemale, 'а', '')] свои благочестивые намерения, следуя вере Адабисса:\n\nСтупайте и завоёвывайте, дабы весь мир склонился перед нами в мольбе."
  adabyss_event.0002.a:0 "Мы выступаем при первом благоприятном рассвете."

  #what everyone else gets
  adabyss_event.0003.t:0 "Мрачные вести"
  adabyss_event.0003.desc:0 "Последние несколько недель из южной Дамоты доходят странные рассказы о золотых воинах ростом с двух человек и генерале во главе их строя. Теперь правда раскрылась: чужак с далёкого юга, носящий титул лелманда, получил войско, намного превосходящее силы любого из его соседей.\n\nОн уже объявил о намерении покорить новые земли. С таким войском за спиной лелманда разве кто-нибудь сможет встать у него на пути?"
  adabyss_event.0003.a.distant:0 "О, танец смерти продолжается..."
  adabyss_event.0003.a.neighbor:0 "Конец близок!"

  adabyss_opening.1.t:0 "Воин империи Адабисса"
  adabyss_opening.1.desc:0 "Будучи воином великой и необъятной империи Адабисса, вы хорошо знаете её проповеди о славе и войне. Как благочестивый последователь этих заветов, вы обязаны завоевывать земли во имя своей веры и распространять священные учения всем живущим, независимо от их воли.\n\nИменно ради этого вы отправились на север, в эти чуждые края, далеко за пределами родины. Будет ли здесь слава — вопрос спорный, особенно учитывая, что империя сосредоточена на куда более прибыльных войнах. Но для каждого амбициозного офицера найдётся свой Лимпегайл — легион, ожидающий нового командира и приказов..."
  adabyss_opening.1.a:0 "Мечом и славой эта земля станет моей."

  #death event
  adabyss_event.0004.t:0 "Отзыв Лимпегайла"
  adabyss_event.0004.desc:0 "После смерти лелманда свыше пришёл приказ прекратить северные завоевания: успехи Лимпегайла лишь доказали никчёмность этих земель. Повинуясь, Мосеку Лимпегайл снова выступил на юг, в земли Адабисса за пограничной крепостью.\n\nСтоило войску уйти, как северные варвары подняли восстания. Огромные области, совсем недавно втоптанные в землю нашими праведными сапогами, уже вырываются из-под власти, и вскоре весь край, скорее всего, погрузится в хаос."
  adabyss_event.0004.a:0 "Вот и потерян север."

  #limpegail defeated
  adabyss_event.0005.t:0 "Позор поражения"
  adabyss_event.0005.desc:0 "Каким-то образом, вопреки всему, могущество Адабисса пало перед немытыми дикарями. Несмотря на мои приказы и все усилия, мне пришлось смотреть, как амбиции обращаются в прах: северные варвары немыслимым образом одолели великий Мосеку Лимпегайл. Их примитивные копья смяли огромную армию бойцов с автоматическими арбалетами, их [Concept('magi','маги')|E] сбили воздушные корабли, и даже великие големы пали перед их упорством и численным превосходством. Этим поражением, пусть даже поправимым, я показал северянам, что Адабисс можно победить. Едва весть достигла столицы, был отдан приказ о моём отзыве.\n\nМоя армия стала моей стражей и повела меня на юг. В каждом городе по пути меня выставляли напоказ как бездарного предателя, а толпы осыпали оскорблениями на величественных проспектах Адабисса. После, казалось, целой вечности унижений меня доставили в Город золотых статуй. Я в последний раз взглянул на его могучие шпили, прежде чем встретить свою участь. После короткого оглашения всех доказательств моего провала меня подвели к одной из великих золотых статуй. Когда она подняла кулак, мне оставалось лишь представить, как всё могло сложиться."
  adabyss_event.0005.a:0 "И в одно мгновение всё стало чёрным."

  adabyss_event.0006.t:0 "Конец натиска"
  adabyss_event.0006.desc:0 "Как ни невероятно, наши силы сумели одолеть захватчиков из Адабисса. Несмотря на их чудовищную мощь и бесчисленные полчища, я видел, как мои копейщики сминали диковинных арбалетчиков, как мои [Concept('magi','маги')|E] сбивали с неба летающие машины, а ужасные големы падали под ударами воинов. На лицах уцелевших врагов застыло изумление. Они не верили, что их можно победить, — прежде многие мои люди были с ними согласны.\n\nТеперь уязвимость Адабисса стала очевидна, а моё имя превратилось в символ победы над ним. Покорённые земли погрузились в хаос, предводитель исчез вместе с армией. Какие-то следы адабиссийского владычества ещё сохраняются, но без военной поддержки они вскоре исчезнут. Моё имя навеки войдёт в историю как имя победителя Адабисса!"
  adabyss_event.0006.a:0 "Меня уже называют Сокрушителем статуй."

  #Taking the border fort
  adabyss_event.0008.t:0 "Падение крепости"
  adabyss_event.0008.desc:0 "После долгой борьбы могучая адабиссийская крепость Нагом Какезихи пала. В великой битве, о которой будут помнить вечно, мои воины прорвали считавшиеся неприступными стены и взяли цитадель. Мы понесли тяжёлые потери в жестоком бою, но мой знаменосец поднял знамя над руинами. Я совершил невозможное: победил адабиссийцев в открытом бою и первым из северян покорил землю Адабисса!\n\nОтвет Адабисса был молниеносным: из-за границы явилась стотысячная армия во главе с прославленным ветераном. Она наступала с немыслимой скоростью, и моим войскам пришлось спешно оставить крепость. Теперь враг идёт в мои земли, поклявшись отомстить за унижение империи и истребить всю мою семью..."
  adabyss_event.0008.a:0 "Я снова одолею их."
  adabyss_event.0008.a.tt:0 "#N #bold Любой исход, кроме полной победы, приведёт к вашей смерти и гибели всей вашей семьи! #! #!"

  #Beating the reclamation force (totally not through cheating)
  adabyss_event.0010.t:0 "Врата сокрушены"
  adabyss_event.0010.desc:0 "Несмотря на всё могущество Адабисса и его великую армию, отправленную против нас, кулак, сокрушивший множество государств в [Concept('sarradon', 'Саррадоне')|E], потерпел поражение в Дамоте — Нагом Какезихи снова пал под ударами моих воинов. Бесконечные волны вражеских войск были перемолоты в прах, а джунгли и реки Дамоты наполнились их трупами.\n\nИстория повторилась: горстка выживших ветеранов подняла моё знамя над бастионами цитадели. Хотя мы победили, ещё одна война такого масштаба наверняка уничтожила бы нас. И хотя по всей Дамоте вспыхнули празднования, под весельем чувствуется страх: что если Адабисс просто пошлёт новую армию?"
  adabyss_event.0010.a:0 "Будем надеяться, что это конец..."
  adabyss_event.0010.tt:0 "#bold Великие южные врата вновь пали передо мной.#!"

  #Losing to the reclamation force
  adabyss_event.0011.t:0 "Цена неповиновения"
  adabyss_event.0011.desc:0 "Вся мощь Адабисса оказалась поистине непреодолимой. Его великое войско, наделённое всевозможными чудесами, полностью уничтожило мою армию: наше оружие почти не причиняло врагу вреда. Воздушные корабли заливали джунгли огнём, выжигая путь наступлению.\n\nЯ долго скрывался, но меня всё же поймали. В последнем отчаянном бою мои личные стражи закрылись щитами от ливня арбалетных болтов, один из последних [Concept('magi','магов')|E] готовил заклинание против голема, когда внезапно появились вражеские копейщики. Я видел, как защитников убивали одного за другим, а меня взяли живым.\n\nВ пограничной крепости я увидел пленённую семью. Нас вели всё глубже в Адабисс, выставляя напоказ в каждом городе, и толпы осыпали нас оскорблениями на незнакомых языках. С каждым шагом истина становилась яснее: против такого могущества и величия у меня не было ни единого шанса."
  adabyss_event.0011.a:0 "Я был глупцом."
  adabyss_event.0011.tt:0 "#N По прибытии в столицу вы и ваша семья будете казнены!#!"

  #defeated damned army
  adabyss_event.0013.t:0 "Честь проклятых"
  adabyss_event.0013.desc:0 "Всё кончено. Снова Адабисс отправил армию, чтобы сокрушить нас, и снова она сама была сокрушена. Трупы несчастных, брошенных умирать ради утраченной чести, теперь безжизненно смотрят в небеса.\n\nВо внутреннем дворе Нагом Какезихи — истинный символ их слепой преданности: изорванное знамя Адабисса реет над горой мёртвых тел, сложенных в месте их последнего боя. Все они сражались до последнего вздоха, ибо им внушили, что любое другое окончание недопустимо. Они погибли десятками тысяч за честь, некогда отнятую у их предков, за крепость, которую сам Адабисс считал не более чем жалкой окраиной. Все они умерли ради гордости немногих правителей, предпочёвших жертвовать сотнями тысяч ради собственного тщеславия."
  adabyss_event.0013.a:0 "Они нашли честь в смерти."
  adabyss_event.0013.tt:0 "#bold Адабисс больше никогда не пойдёт на север!#!"

  #lost to damned army
  adabyss_event.0014.t:0 "Час расплаты"
  adabyss_event.0014.desc:0 "Давным-давно Нагом Какезихи был отнят у Адабисса, а могучая армия, посланная вернуть крепость и отомстить за оскорбление, потерпела неслыханное поражение. Но, оправившись от хаоса, адабиссийцы вернулись, чтобы восстановить утраченную честь и поставить на место тех, кого считали наглыми дикарями.\n\nИм это удалось. Чудо или случайность, однажды подарившие нам победу, не повторились. Исполненные решимости отомстить за прежние поражения враги полностью сокрушили мои силы. При попытке бежать меня схватили и привели к их предводителю как главу тех, кто некогда победил Адабисс.\n\nЗатем меня провели через весь Адабисс, показывая его народу как доказательство того, что прежнее поражение было лишь случайностью. Глядя на чудеса империи, пусть и отмеченные войной и распадом, я недоумевал, как она вообще могла проиграть. Стоя на эшафоте, я уже знал, что они были правы."
  adabyss_event.0014.a:0 "Мы не должны были побеждать."
  adabyss_event.0014.tt:0 "#N #bold После публичного унижения вы и ваша семья будете казнены!#!#!"

  #tells player about army of the damned
  adabyss_event.0015.t:0 "Армия проклятых"
  adabyss_event.0015.desc:0 "С тех пор как Нагом Какезихи был отнят у Адабисса, земли за крепостью хранили молчание. Редкие вести рассказывали лишь о катастрофической гражданской войне и последующем распаде на владения военачальников. Но теперь стражи цитадели увидели огромную, словно бесконечную армию — точь-в-точь такую, какими в преданиях были враги их предков. Крепость вновь пала, и подкрепления не смогли спасти её от войска, подобного которому не видели со времён прошлого падения. Вскоре правда стала очевидна.\n\nАдабисс по крайней мере отчасти оправился и послал на север «Армию проклятых», чтобы отомстить за давнее поражение и навеки отбить у других желание бросать ему вызов. Говорят, войско состоит из потомков участников прежней обречённой экспедиции, и каждому внушили, что лишь победа или смерть восстановят их честь. Адабиссийцев уже отбрасывали назад, но удастся ли вновь победить их, преисполненных гнева и рвения?"
  adabyss_event.0015.a:0 "Я должен попробовать."
  adabyss_event.0015.tt:0 "#bold #N Адабисс снова жаждет мести!#!#!"

  #tells player about the warlord
  adabyss_event.0016.t:0 "Военачальник с юга"
  adabyss_event.0016.desc:0 "С тех пор как Нагом Какезихи был отнят у Адабисса, земли за крепостью хранили молчание. Редкие вести рассказывали лишь о катастрофической гражданской войне и последующем распаде на владения военачальников. Но теперь стражи цитадели увидели огромную, словно бесконечную армию — точь-в-точь такую, какими в преданиях были враги их предков. Крепость вновь пала, и подкрепления не смогли спасти её от войска, подобного которому не видели со времён прошлого падения. Вскоре правда стала очевидна.\n\nХотя Адабиссийская империя мертва, военачальники на её пепелище сохранили частицы былой мощи. Один из них решил выступить на север и доказать своё право на павшую державу, победив тех, кто привёл её к гибели. Этот военачальник, сам провозгласивший себя лелмандом собственного войска, захватил крепость. Он представляет лишь обломок Адабисса, но всё ещё может растоптать нас."
  adabyss_event.0016.a:0 "Он будет остановлен."
  adabyss_event.0016.tt:0 "#bold #N Военачальник стремится отомстить за поражение Адабисса!#!#!"

  #beat warlord
  adabyss_event.0018.t:0 "Война за мёртвых"
  adabyss_event.0018.desc:0 "Захватчик отброшен, а от его огромной армии остались лишь трупы по всему краю джунглей. Мёртвые до сих пор сжимают оружие, устройства которого мы не понимаем. Быть может, теперь они присоединились к империи, за которую погибли, — такой же мёртвой. Но её призрак жил в людях, выступивших из разорённых войной земель. Они пришли туда, где погибли их предки, надеясь наконец отомстить, и разделили участь тех, за кого сражались.\n\nНагом Какезихи, крепость, за которую пролито столько крови, стал местом последнего боя военачальника. Вместе с лучшими воинами он больше суток удерживал внутреннее святилище против превосходящих сил, пока все они не погибли. Видит ли он теперь отголоски всех, кто умер на этой земле прежде? Столько смертей — и ради чего? Ради чести тех, кто уже не сможет её потребовать, ради честолюбия того, кто надеялся обратить бедствие себе на пользу. Так называемый «лелманд» сам навлёк это на себя и теперь несёт груз этих вопросов."
  adabyss_event.0018.a:0 "Пусть мёртвые войны останутся в прошлом."
  adabyss_event.0018.tt:0 "#bold Адабисс больше не осмелится идти на север!#!"

  #lost to warlord
  adabyss_event.0019.t:0 "Рука мёртвых"
  adabyss_event.0019.desc:0 "Хотя Адабиссийская империя мертва, её останки всё ещё ходят по земле — мстительные духи, взыскивающие за давние обиды. Они приняли облик военачальника и его армий, вооружённых великими орудиями Адабисса, вторглись в моё владение и обратили его в руины. Когда-то адабиссийцев удалось отбросить и сломить, но теперь этого не случилось. Моя армия была разбита, мёртвые объявлены отомщёнными, а меня ждала та же участь, если бы не плен.\n\nМеня привели к военачальнику, называвшему себя «лелмандом» и законным правителем всего Адабисса: победа над теми, кого не смогли одолеть прежние владыки, якобы доказала его право. Казалось, даже из его глаз кричат призраки, спрашивая из своих темниц, что было сотворено во имя их памяти, но он не раскаивался. Для него мечта об империи стоила всей этой крови, а месть была ценна сама по себе. Я и моя семья должны были лишь пополнить груду трупов, добавить новые голоса к хору мёртвых."
  adabyss_event.0019.a:0 "Мёртвые не молчат."
  adabyss_event.0019.tt:0 "#N #bold Вы и ваша семья будете казнены!#!#!"

  # Follow up event for Adabyss collapsing
  adabyss_event.0020.t:0 "Падение голема"
  adabyss_event.0020.desc:0 "В месяцы после поражения Адабисса при Нагом Какезихи вести с юга становились всё мрачнее. Проигрыш тем, кого считали не более чем примитивными варварами, разрушил легитимность правящего императора. Сначала говорили лишь о волнениях в нескольких провинциальных столицах, затем беспорядки дошли до самого Города золотых статуй. Вскоре сообщения стали путаными: стремительная череда переворотов, ответных переворотов, убийств и народных восстаний сменила нескольких недолговечных императоров, пока мятежный командир легиона не решился выступить на столицу — почти неслыханный акт неповиновения.\n\n\n\nЕсли он надеялся быстро и решительно восстановить мир, то добился обратного. Местные правители по всей империи объявили его незаконным узурпатором и подняли знамёна восстания. Теперь, почти через год после битвы при Нагом Какезихи, государство Адабисса фактически распалось: всевозможные военачальники сражаются по всей бывшей империи, а Город золотых статуй несколько раз переходил из рук в руки и лежит наполовину разрушенным.\n\nЯ совершил то, что многие назвали бы невозможным, то, чего по всем законам не могло произойти. Я не просто победил Адабисс — я уничтожил его."
  adabyss_event.0020.a:0 "Былое величие утрачено."
  adabyss_event.0020.tt:0 "Вы #BOLD уничтожили#! Адабисс!"

  ###subjugation stuff
  #adabyss try to subjugate you
  adabyss_invasion.2001.opening:0 "Мой предначертанный слуга,"
  adabyss_invasion.2001.desc:0 "По праву весь Эрас принадлежит вере Адабисса и её благочестивым воинствам. Пока ты дышишь, неизбежно наступит день, когда ты склонишься перед нами. Ради собственного блага сделай это, принеся мне клятву верности, а не положив голову под топор моего палача."
  adabyss_invasion.2001.a:0 "Ты приводишь убедительные доводы..."
  adabyss_invasion.2001.a.tt:0 "Вы приносите клятву верности империи Адабисса. Возможно, это даст вам убежище, пусть и без мира."
  adabyss_invasion.2001.b:0 "Я никогда не склонюсь!"
  adabyss_invasion.2001.b.tt:0 "Адабиссийцы начнут вторжение, и вам, скорее всего, останется лишь молить о пощаде."

  #accept subjugation
  adabyss_invasion.2002.opening:0 "Благородный лелманд,"
  adabyss_invasion.2002.desc:0 "Мои дипломаты донесли до меня масштаб ваших амбиций, а мои солдаты — мощь вашего войска. Я понимаю очевидное: лучше быть на стороне победителей, чем гнить в безымянной могиле. Мой меч — в ваших руках, а вместе с ним — и моя верность."
  adabyss_invasion.2002.a:0 "А значит, среди этих провинциалов всё же есть разумные существа!"

  #refuse subjugation
  adabyss_invasion.2003.opening:0 "Бесчестная свинья,"
  adabyss_invasion.2003.desc:0 "Ваше предложение получено, а ваши гонцы возвращены без вреда, но знайте: это последний акт милосердия между нами. Я не желаю и не намерен склоняться перед таким врагом. Если вам так нужна моя преданность, милости прошу: приходите к моим замкам сами и посмотрите, как ваше великое войско разобьётся о мои стены, словно волна о скалы."
  adabyss_invasion.2003.a:0 "Глупец. Тони, раз так рвёшься к смерти."


