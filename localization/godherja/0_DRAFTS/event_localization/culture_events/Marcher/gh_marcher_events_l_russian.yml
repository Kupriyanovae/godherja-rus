l_russian:
 marcher.0101.t:0 "Раненый грифон"
 marcher.0101.desc:0 "Пронзительный визг изувеченного чудовища почти невыносим. Я зажимаю уши, но это почти не помогает: [Concept('antimagi','антимаги')|E] заходят сбоку к истекающему кровью [Concept('griffons','грифону')|E], готовясь нанести последний удар.\n\nА ведь жаль. Нельзя отрицать, что в этом создании есть нечто царственное. На миг мне приходит в голову безумная мысль: почему бы не попросить оставить зверя мне?"
 marcher.0101.a:0 "«Стойте! Разве нельзя его вылечить?»"
 marcher.0101.a.tt:0 "Я приказываю [Concept('antimagi','антимагам')|E] остановиться. Неужели зверю нельзя найти более достойного применения, чем просто бессмысленно его убить?"
 marcher.0101.b:0 "Ха! Порой моё воображение меня удивляет."
 marcher.0101.b.tt:0 "Занятная фантазия, но совершенно непрактичная."
 
 marcher.0102.t:0 "Раненый грифон"
 marcher.0102.desc:0 "[Concept('antimagi','Антимаги')|E] останавливаются и смотрят сперва на меня, затем друг на друга. Обменявшись несколькими недоумёнными репликами, они пожимают плечами и говорят, что я могу делать со зверем всё что пожелаю — если сумею сохранить ему жизнь.\n\nСудя по его плачевному состоянию, это будет непросто."
 marcher.0102.a:0 "Неужели здесь не найдётся умелого целителя?"
 marcher.0102.a.tt:0 "Найти опытного лекаря, способного поставить [Concept('griffons','грифона')|E] на ноги, будет несложно, но за удобство придётся заплатить."
 marcher.0102.b:0 "Дайте мне шину и бинты."
 marcher.0102.b.tt:0 "Раны серьёзны, но ваших медицинских навыков должно хватить, чтобы их вылечить."
 marcher.0102.c:0 "Если подумать, лучше избавьте его от мучений."
 
 marcher.0103.t:0 "Хищная птица"
 marcher.0103.desc:0 "Отставной [Concept('antimagi','антимаг')|E], проезжавший через мои земли, воспользовался моим гостеприимством и заметил моего [Concept('griffons','грифона')|E]. Рассказав мне и моей семье с полдюжины историй о встречах с такими существами и уже успев немного нас утомить, он наконец переходит к делу.\n\nЗа символическую плату и необходимое снаряжение он готов превратить птицу из занятной диковинки в смертоносное оружие войны."
 marcher.0103.a:0 "Ради такого великолепного скакуна — что угодно!"
 marcher.0103.a.tt:0 "Тот, кто знает столько историй об этих чудовищах, наверняка понимает, что делает."
 marcher.0103.b:0 "Нет, мне это неинтересно."
 marcher.0103.b.tt:0 "Я не стану рисковать этим зверем в настоящем сражении."
 
 marcher.0104.t:0 "Хищная птица"
 marcher.0104.desc:0 "После целого месяца изнурительных тренировок мой [Concept('griffons','грифон')|E] наконец готов взмыть в небо и вселить ужас в сердца врагов. Довольный проделанной работой, старый [Concept('antimagi','антимаг')|E] уезжает, передав мне поводья прекрасного, а теперь ещё и вдвое более смертоносного зверя."
 marcher.0104.a:0 "Смерть с небес!"
 
 marcher.0105.t:0 "Хищная птица"
 marcher.0105.desc:0 "С самого начала «обучение» моего [Concept('griffons','грифона')|E] шло странно и нередко действовало мне на нервы. В лучшем случае горе-дрессировщик проводил дни в таверне, проматывая там жизнь и деньги и упорно твердя, будто это часть процесса. В худшем он действительно пытался обучать птицу, и всё неизменно заканчивалось взаимными криками и дракой.\n\nНаконец устав от этого балагана, я иду в комнату [Concept('antimagi','антимага')|E] — и обнаруживаю, что она пуста!"
 marcher.0105.a:0 "Стража! Найдите его, пока он не скрылся!"

 marcher.0110.t:0 "Королевский дар"
 marcher.0110.desc:0 "После моей коронации в качестве нового правителя всего [Concept('chevalie','Шевалье')|E] поток гостей не иссякает уже несколько дней. Они прибывают, чтобы выразить почтение, вновь присягнуть короне и, как правило, преподнести дары.\n\nОдну из таких групп посланников сопровождает нечто поистине впечатляющее — взрослый [Concept('griffons','грифон')|E]! Как объясняют [Concept('antimagi','антимаги')|E], по обычаю [Concept('antimagic_orders','антимагические ордена')|E] дарят такого зверя каждому государю объединённых Марок при восшествии на престол."
 marcher.0110.a:0 "Благодарим вас за этот прекрасный дар!"
 marcher.0110.b:0 "Мне... Мне не по себе рядом с этим зверем."
