 marcher_decision.0600.t:90 "Королевство рек"
 marcher_decision.0600.desc:90 "Впервые за много веков земли риварспадцев объединились под нашей собственной короной. Наш народ вернул себе достоинство, а заодно и давно утраченные земли на севере и юге.\n\nМелкие короли, которые противятся мне, наверняка вскипят при одной мысли, что кто-то из речного народа встал с ними вровень, но теперь им придётся с этим смириться! Пусть приходят и пытаются отнять нашу корону — мы больше никогда её не отдадим!\n\nОстаётся лишь один вопрос: как назвать новое королевство?"
 marcher_decision.0600.a:90 "Королевство речных земель!"
 marcher_decision.0600.b:90 "В честь предков — Раносана!"
 marcher_decision.0600.c:90 "В честь нашего истинного предка, соратника Бастиона, — Адванакорм!"
 marcher_decision.0600.d:90 "Мы тоскуем по давно забытым племенам — мы Каддаманд!"
 marcher_decision.0600.e:90 "Мы всё ещё идём Путём шута! Да здравствует Долина шутов!"
 RIVERLANDS_NAME_RIVERLANDS:90 "Речные земли"
 RIVERLANDS_NAME_RANOSANA:90 "Раносана"
 RIVERLANDS_NAME_GRANDE_ADAVNACORMNETT:90 "Адванакормнетт"
 RIVERLANDS_NAME_KADDAMAND:90 "Каддаманд"
 RIVERLANDS_NAME_MUMMERS_VALE:90 "Долина шутов"
 marcher_decision.0601.desc.kings:90 "После долгих веков, когда они знали своё место, нищие крестьяне Речных земель объявили себя свободными от моей власти и возвели выскочку [scoped_ruler.GetFirstName] на престол под титулом «[scoped_ruler.GetTitleTierName]»! Этого нельзя допустить: богатства центрального [Concept('chevalie','Шевалье')|E] растрачиваются на мятежную свору рыбаков, едва способных изъясняться на цивилизованных языках."
 marcher_decision.0601.desc.others:90 "[scoped_ruler.GetFirstName] уже некоторое время собирает воедино земли риварспадцев и области, на которые те некогда претендовали. И хотя [scoped_ruler.GetSheHe] далеко не [Select_CString(scoped_ruler.IsFemale, 'первая', 'первый')], кому это удалось, [scoped_ruler.GetSheHe] [Select_CString(scoped_ruler.IsFemale, 'приложила', 'приложил')] немало сил, чтобы превратить [scoped_ruler.GetHerHis] столицу [scoped_ruler.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] в один из величайших городов [Concept('chevalie','Шевалье')|E]. Многие военачальники в ярости от такого поворота событий, однако сами риварспадцы, похоже, наконец обрели волю постоять за себя, и теперь эти военачальники мало что смогут изменить в ходе истории этого народа."
 marcher_decision.0601.a:90 "Неприемлемо!"
 marcher_decision.0601.b:90 "Пожалуй, с этим можно смириться."

 marcher_decision.1000.t:0 "Обещания процветания"
 marcher_decision.1000.desc: "Из [gh_emigration_county_scope.GetName] потянулся постоянный ручеёк переселенцев. Земледельцы, ремесленники, работники — с каждым месяцем всё больше людей покидают дома в поисках иной судьбы.\n\nИх цель — [target_character.GetPrimaryTitle.GetNameNoTier], где, по слухам, есть плодородные земли, вдоволь работы и богатства, ожидающие тех, кто готов их забрать. Правдивы ли эти рассказы — неважно: одной надежды оказалось достаточно.\n\nПоследствия уже ощущаются по всему графству, и исход, похоже, в ближайшее время не прекратится."
 marcher_decision.1000.a:0 "Пусть уходят. Те, кто желает уйти, никогда по-настоящему мне не принадлежали."
 marcher_decision.1000.b:0 "Это возмутительно! [target_character.GetFirstNameNoTooltip] крадёт у меня подданных!"
 marcher_decision.1000.c:0 "Хватит. Я запрещу дальнейший исход."