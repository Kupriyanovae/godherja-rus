l_russian:
 marcher_decision.0001.t:0 "Шевалье воссоединено!"
 marcher_decision.0001.desc.benouet:0 "Получилось! Благодаря добрым вельможам, которые помогли мне советами и войсками, отцовский трон теперь мой! Братья ошибались, когда говорили, что мне не стать [Select_CString(ROOT.Char.IsFemale, 'такой же верховной королевой', 'таким же верховным королём')], как отец.\n\nЯ пока не знаю, что делать, но Совет поможет. Они всё твердят, что за такую помощь я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] их отблагодарить. Ничего, ведь я теперь [Select_CString(ROOT.Char.IsFemale, 'верховная королева', 'верховный король')]! Теперь мне можно всё! Как отцу!"
 marcher_decision.0001.a:0 "Хотите земель? У нас их сколько угодно!"
 marcher_decision.0001.desc.rene:0 "Всё кончено. Войны за воссоединение завершились, и достойные люди с обеих сторон теперь обращаются в пепел на погребальных кострах, пока я восседаю на отцовском троне. Земля по-прежнему в шрамах и расколота, как и моя семья. Даже сейчас я слышу шёпот вельмож, считающих, будто говорят тише, чем на самом деле, а их положение надёжнее. Они твердят, что [Select_CString(ROOT.Char.IsFemale, 'Королеве-бастарду', 'Королю-бастарду')] нет места на столь высоком троне.\n\nОни ошибаются. Огнём и яростью я [Select_CString(ROOT.Char.IsFemale, 'вернула', 'вернул')] отцовский трон у тех, кто не заслуживал на нём сидеть, и огнём и яростью сохраню единство державы и не подпущу [Concept('liches','личей')|E] к нашим границам. Если братья так никогда этого и не признают — пусть. Я [Select_CString(ROOT.Char.IsFemale, 'верховная королева', 'верховный король')], и моё правление начинается сейчас."
 marcher_decision.0001.b:0 "Теперь наступает время исцеления — и эпоха войн."
 marcher_decision.0001.desc.cliement.adult:0 "Отцовский трон принадлежит мне.\n\nКогда отец ушёл, я [Select_CString(ROOT.Char.IsFemale, 'была ещё девочкой', 'был ещё мальчиком')]. Всё детство двор держал меня взаперти, пока люди гибли во имя моего права, но теперь я восхожу на престол [Select_CString(ROOT.Char.IsFemale, 'взрослой женщиной', 'взрослым мужчиной')]. Братья считали себя достойнее по старшинству, однако больше не могут делать вид, будто их права весомее моих: я сижу на троне, а они падают передо мной ниц.\n\nКак править — решать только мне. Но нельзя забывать, благодаря кому я здесь [Select_CString(ROOT.Char.IsFemale, 'оказалась', 'оказался')]. Прежде всего благодаря матери и наёмнику, с которым она делит постель..."
 marcher_decision.0001.c:0 "Будущее принадлежит мне. Мне ещё многому предстоит научиться."
 marcher_decision.0001.desc.cliement.boy:0 "Я — [Select_CString(ROOT.Char.IsFemale, 'верховная королева', 'верховный король')]! Мама сказала, что теперь мне полагается править нашим народом, как и обещали наставники! Она сказала, что теперь мне можно всё, что захочу, когда захочу! Мне не терпится начать, а вокруг столько добрых людей, которые обещают помочь мне править.\n\nМама так мной гордится, но Энгельмар меня пугает. Он всё требует звать его дядей, хотя я знаю, что мы не родня. И когда он улыбается, добрым он совсем не кажется..."
 marcher_decision.0001.d:0 "Надеюсь, из меня выйдет [Select_CString(ROOT.Char.IsFemale, 'хорошая верховная королева', 'хороший верховный король')]!"
 marcher_decision.0001.desc.ansfrei.noheir:0 "Милостью Святых пути и тех храбрых мужчин и женщин, которые творили зло во имя добра, я теперь [Select_CString(ROOT.Char.IsFemale, 'верховная королева', 'верховный король')] Шевалье. По праву и закону я пастырь своего народа и [Select_CString(ROOT.Char.IsFemale, 'обязана', 'обязан')] заботиться о его благополучии и защищать его от осквернённых орд мёртвого севера.\n\nИ всё же остаются более... личные... дела. Мне твердят, что нужен наследник, — все твердят, даже крестьяне шепчутся об этом. Если мне удалось воссоединить Шевалье, с этим я тоже справлюсь. Верно? Конечно. Да. Легко."
 marcher_decision.0001.e:0 "Святые пути, помогите мне."
 marcher_decision.0001.desc.ansfrei.heir:0 "Милостью Святых пути и тех храбрых мужчин и женщин, которые творили зло во имя добра, я теперь [Select_CString(ROOT.Char.IsFemale, 'верховная королева', 'верховный король')] Шевалье. По праву и закону я пастырь своего народа и [Select_CString(ROOT.Char.IsFemale, 'обязана', 'обязан')] заботиться о его благополучии и защищать его от осквернённых орд мёртвого севера.\n\nГлавное испытание уже позади: я не только правлю, но и имею наследника. Страхи моей семьи и двора оказались напрасны. Молюсь, чтобы больше никогда не пришлось делать ничего подобного..."
 marcher_decision.0001.f:0 "Пора приниматься за правое дело."
 marcher_decision.0001.desc.mathilde:0 "Кто я?\n\nТа маленькая девочка, что со слезами на глазах трижды ударила ножом мужа втрое старше себя? Или шёпот в ухе Гардфрея: я соглашалась на каждое мелкое злодеяние, которое ему требовалось совершить, но прежде сама вкладывала эту мысль в его недалёкий ум? А может, я добрая верховная королева Шевалье, восседающая на троне, пока передо мной пресмыкаются льстецы и склоняются шепчущиеся заговорщики?\n\nИстина в том, что я — каждая из них. Никто, кроме меня самой, не ожидал, что однажды я займу свой трон, но теперь все признают меня законной правительницей Шевалье. А кто не признаёт, тот унесёт свои сомнения в могилу."
 marcher_decision.0001.g:0 "Я наконец на вершине, но впереди ещё так много..."
 marcher_decision.0001.desc.regular:0 "Теперь я восседаю на троне, а моё имя вписано в летописи. По праву и закону Верховное королевство Шевалье принадлежит мне, и в ближайшие дни всем, кто ещё претендует на мой престол, придётся присягнуть мне. Земля по-прежнему изранена и истерзана годами кровопролития, но со временем Шевалье вновь будет процветать."

 marcher_decision.0002.t:0 "Шевалье воссоединено!"
 marcher_decision.0002.desc.marchers:0 "Войны за воссоединение наконец завершились: [chevalie_uniter.GetTitledFirstName] занимает престол Верховного королевства. Возможно, глубокие раны Шевалье теперь начнут затягиваться, но лишь время покажет, надолго ли установится мир при [chevalie_uniter.GetTitledFirstName]."
 marcher_decision.0002.desc.regular:0 "После долгих лет кровопролития Верховное королевство Шевалье восстановлено. Победу одерживает [chevalie_uniter.GetTitledFirstName], но кто знает, долго ли продержится новый порядок. Пока же марочники вновь едины."
 marcher_decision.0002.a:0 "Ветер перемен вновь набирает силу."
 marcher_decision.0002.b:0 "Для всех марочников восходит новый день."

 marcher_decision.0100.t:0 "Великое герцогство Земожич"
 marcher_decision.0100.desc:0 "На нашей границе с [Concept('the_lichdoms','Личествами')|E] расположено последнее наследие Ойейницы — герцогство Земожич. По традиции его великий герцог присягает правителю Шевалье. Это вполне разумная любезность, ведь народ Земожича владеет этими землями лишь благодаря щедрости одного из наших предков.\n\nОднако полагающихся почестей нам до сих пор не воздали. Пора это исправить."
 marcher_decision.0100.a:0 "Отправить гонца."
 marcher_decision.0100.b:0 "Не должно отображаться."
 marcher_decision.0101.t:0 "Великое герцогство Земожич"
 marcher_decision.0101.desc:0 "К нам прибыл посланник от двора [chevalie_ruler.GetTitledFirstName]: судя по всему, от нас требуют подчинения. Гонец старательно перечислил все будто бы бесконечные благодеяния Шевалье нашему народу и подчеркнул, что с формальностями лучше покончить как можно быстрее — ради нашего же блага, конечно."
 marcher_decision.0101.a:0 "Хорошо."
 marcher_decision.0101.b:0 "Нам не нужна их «защита»!"
 marcher_decision.0110.t:0 "Великое герцогство Земожич"
 marcher_decision.0110.desc:0 "Наш посланник вернулся из Земожича. Великий герцог, теперь официально утверждённый в своём титуле, принял наше предложение и уже направляется к нам, чтобы лично принести присягу."
 marcher_decision.0110.a:0 "Разумное решение."
 marcher_decision.0111.t:0 "Великое герцогство Земожич"
 marcher_decision.0111.desc:0 "Наш посланник вернулся из Земожича. Эти надменные глупцы отвергли наше требование и, по всей видимости, решили стать кормом для личей."
 marcher_decision.0111.a:0 "Если они не внемлют разуму, мы заставим их."

 marcher_decision.0200.t:0 "Возвращение к старым обычаям"
 marcher_decision.0200.desc:0 "Жизненный путь навязали нам давние завоеватели. Марочники хотели изменить наши обычаи и даже сам образ мыслей, но посмотрите на них теперь: они бесконечно воюют между собой, а их государства рушатся одно за другим. Меж тем в глухих болотах и заросших лесах наших земель ещё много последователей древней гестанводерской веры. Им больше не придётся бояться гонений и недоверия соседей. Сегодня Гестанводер вновь выйдет на свет, а коварные приверженцы Жизненного пути будут изгнаны."
 marcher_decision.0200.a:0 "Новый день для конейкменеров."

 marcher_decision.0500.t:0 "Объединённое верховное королевство"
 marcher_decision.0500.desc:0 "Худшие превратности войны позади: моей рукой осколки Шевалье вновь собраны воедино. Последние серьёзные претенденты на трон либо мертвы, либо принуждены к покорности, и мою законность теперь почти никто не оспаривает. Почти.\n\nНекоторые лорды и дамы во всех Марках ещё не явились в [capital.GetNameNoTier], чтобы воздать мне полагающиеся почести и принести присягу. Это не обязательно означает открытую враждебность. Я пошлю послов принять присягу у тех, кому помешали обстоятельства, и выяснить, у кого были более коварные причины."
 marcher_decision.0500.a:0 "Посмотрим, кто склонится, а кого придётся сломить."
 marcher_decision.0500.b:0 "Возможно, разумнее будет послать дары?"
 will_receive_summons_tt:0 "[THIS.Char.GetTitledFirstName] получит требование стать вашим вассалом."
 
 marcher_decision.0510.t:0 "Объединённое верховное королевство"
 marcher_decision.0510.desc:0 "Прибыли посланники от множества крупных лордов, фактически независимых от короны. Они заверяют нас в верности своих господ и сообщают, что те направляются в [capital.GetNameNoTier], чтобы лично принести присягу. Никаких дополнительных условий не выдвинуто. То ли они не считали себя вправе торговаться, то ли действительно довольны моей властью — вопрос любопытный, но сейчас несущественный.\n\nТеперь перейдём к тем, чьи ответы были куда менее однозначными..."
 marcher_decision.0510.a:0 "Почему остальные не могут поступить так же?"
 
 marcher_decision.0511.t:0 "Объединённое верховное королевство"
 marcher_decision.0511.desc:0 "Как и ожидалось, не все решили добровольно исполнить свои законные обязательства передо мной — по крайней мере без дополнительных условий. На столе лежит несколько писем, полных льстивых слов и завуалированных просьб о королевской милости. Согласие, конечно, оставит меня в долгу, зато позволит избежать крови, которую пришлось бы пролить, силой приводя этих правителей к покорности."
 marcher_decision.0511.a:0 "Если это обеспечит их подчинение — пусть."
 marcher_decision.0511.b:0 "Одни условия приемлемее других..."
 marcher_decision.0511.c:0 "Они либо подчинятся, либо их заставят."
 will_decide_weak_hook_on_case_by_case_basis_tt:0 "Вы будете решать, принимать ли предложенный компромисс, отдельно в каждом случае."
 total_tax_exemption_tt:0 "[THIS.Char.GetTitledFirstName] освобождается от уплаты налогов."
 total_levy_exemption_tt:0 "[THIS.Char.GetTitledFirstName] освобождается от обязанности предоставлять ополчение."
 will_have_dynamic_duchy_created_tt:0 "Для [THIS.Char.GetTitledFirstName] будет создано новое титулярное [Concept('duchy','герцогство')|E]."
 will_refuse_all_weak_hook_compromises_tt:0 "Вы отвергнете все компромиссы и получите повод силой вернуть непокорных лордов под власть короны."
 refused_submission_tt:0 "[THIS.Char.GetTitledFirstName] не желает подчиняться. Вы сможете объявить войну, а после победы мятежные намерения дадут законное основание для наказания."
 GENERATED_DUCHY_NAME:0 "[capital.GetNameNoTierNoTooltip]"

 marcher_decision.0501.t:0 "Объединённое верховное королевство"
 marcher_decision.0501.desc:0 "К нам прибыл посланник от двора [chevalie_ruler.GetTitledFirstName]: судя по всему, от нас требуют подчинения. Гонец старательно перечислил все будто бы бесконечные благодеяния Шевалье нашему народу и подчеркнул, что с формальностями лучше покончить как можно быстрее — ради нашего же блага, конечно."
 marcher_decision.0501.a:0 "Хорошо."
 marcher_decision.0501.b:0 "Возможно, в обмен на услугу..."
 marcher_decision.0501.c:0 "Что-то в моей казне пустовато..."
 marcher_decision.0501.d:0 "Только если мы не будем платить налоги."
 marcher_decision.0501.e:0 "Только если моё ополчение останется при мне."
 marcher_decision.0501.f:0 "Возможно, мне кое-что нужно..."
 marcher_decision.0501.j:0 "Нам не нужна их защита!"

 marcher_decision.0512.t:0 "Объединённое верховное королевство"
 marcher_decision.0512.desc.taxes:0 "В [lord_asking_for_a_concession.GetHerHis] письме [lord_asking_for_a_concession.GetTitledFirstName] не тратит слов попусту и сразу переходит к делу: требуется полное освобождение от любых налогов, которые я обычно вправе взимать. В остальном моя власть автора письма устраивает."
 marcher_decision.0512.a:0 "Эти условия приемлемы."
 marcher_decision.0512.b:0 "Я этим не поступлюсь."

 marcher_decision.0513.t:0 "Объединённое верховное королевство"
 marcher_decision.0513.desc:0 "Несмотря на все наши предложения, несколько лордов и дам категорически отвергли моё требование. Некоторые даже плюнули на моего посланника и прислали в ответ хвастливые угрозы. Эти мелкие владения не хранят верности ни законному правителю, ни Верховному королевству Шевалье."
 marcher_decision.0513.a:0 "Когда-нибудь мы решим их судьбу."

 marcher_decision.0550.t:0 "Восстание подавлено"
 marcher_decision.0550.desc:0 "Сопротивление [defender.GetTitledFirstName] моей власти, разумеется, оказалось совершенно бесполезным. Теперь исход мятежа в моих руках. По праву я могу наказать [defender.GetHerHis], но милосердие тоже способно принести политическую выгоду. С другой стороны, можно обойтись ещё суровее, чем ожидают, хотя едва ли это встретят с одобрением."
 marcher_decision.0550.a:0 "Пока [defender.GetSheHe] сохраняет верность, нет причин наказывать [defender.GetHerHis]."
 marcher_decision.0550.b:0 "Понижение в ранге будет уместно."
 marcher_decision.0550.c:0 "Конфисковать все [defender.GetHerHis] земли и титулы!"
 flees_abroad_tt:0 "[defender.GetTitledFirstName] успешно бежит за границу."
 
 marcher_decision.0560.t:0 "Поиск мастера пути"
 marcher_decision.0560.desc:0 "У нас есть два способа нанять мастера пути. Можно послать слуг за первым попавшимся отцом пути, хотя его умения могут оказаться посредственными. Или же разыскать по одному опытному мастеру каждого пути и выбрать среди них — правда, наша вера считает такой подход несколько нечестивым."
 marcher_decision.0560.a:0 "Приведите любого, кого найдёте!"
 marcher_decision.0560.b:0 "Я предпочту мастера определённого пути."
 marcher_decision.0560.c:0 "Я меняю решение..."
 wayfather_recruit_tt:0 "К вашему двору присоединится мастер случайного пути"
 
 marcher_decision.0561.t:0 "Несколько кандидатов"
 marcher_decision.0561.desc:0 "По моему приказу слуги приводят несколько кандидатов, каждый из которых — уважаемый мастер избранного им пути. Мне предстоит решить, какого мастера пригласить и, следовательно, какой Жизненный путь будут почитать при моём дворе. Я выбираю..."
 marcher_decision.0561.a:0 "Мастера пути мечей"
 marcher_decision.0561.b:0 "Мастера пути семей"
 marcher_decision.0561.c:0 "Мастера пути монет"
 marcher_decision.0561.d:0 "Мастера пути корон"
 marcher_decision.0561.e:0 "Показать остальных"
 marcher_decision.0561.f:0 "Я меняю решение"
 marcher_decision.0561.g:0 "Мастера пути крови"
 marcher_decision.0561.h:0 "Мастера пути страха"
 marcher_decision.0561.i:0 "Мастера пути ужаса"
 marcher_decision.0561.j:0 "Мастера пути боли"
 marcher_decision.0561.k:0 "Мастера пути меча"
 marcher_decision.0561.l:0 "Мастера пути охоты"
 marcher_decision.0561.m:0 "Мастера пути звёзд"
 marcher_decision.0561.n:0 "Мастера пути пастырей"
 marcher_decision.0561.o:0 "Мастера пути войны"
 marcher_decision.0561.p:0 "Мастера пути мира"
 marcher_decision.0561.q:0 "Мастера пути смерти"
 
 marcher_decision.0562.t:0 "Несколько кандидатов"
 marcher_decision.0562.desc:0 "По моему приказу слуги приводят несколько кандидатов, каждый из которых — уважаемый мастер избранного им пути. Мне предстоит решить, какого мастера пригласить и, следовательно, какой Жизненный путь будут почитать при моём дворе."
 marcher_decision.0562.a:0 "Мастер пути жатвы"
 marcher_decision.0562.b:0 "Мастер пути справедливости"
 marcher_decision.0562.c:0 "Мастер пути знания"
 marcher_decision.0562.d:0 "Мастер пути воронов"
