l_russian:
 marcher_lich.0001.t: "Налёт лича: [county_raided_by_lich.GetName]!"
 marcher_lich.0001.desc: "Сегодня пришла весть, что [Concept('liches','лич')|E] недавно совершил набег на [county_raided_by_lich.GetName]: несколько городов сожжены, а десятки невинных пленены и угнаны в [Concept('the_lichdoms','Личества')|E] ради неведомых целей. Провинция разорена, а цепь пограничных укреплений сгорела при попытке сдержать нападение.\n\nСам лич — или по крайней мере его войско — уже ушёл. Остались лишь руины."
 marcher_lich.0001.a: "Какая жалость."
 marcher_lich.0001.b: "Организовать помощь пострадавшим!"
 marcher_lich.0001.c: "Созвать войска! Сегодня мы вернём наших людей!"
 marcher_lich.0002.t: "Поединок с нежитью"

 marcher_lich.1001.t: "Сердце некрополя"
 marcher_lich.1001.desc: "За зубчатыми стенами некрополя, выкованными из металла, над нашим отрядом словно нависла сама смерть. Воздух здесь был неподвижным и древним — им не дышали многие поколения, — а за каждой дверью, необъяснимо скрытой во мраке, ждали несметные сокровища.\n\nНо где-то в этих залах всё ещё скрывается [Concept('liches','лич')|E], и, если мы не поторопимся, добыча наверняка ускользнёт."
 marcher_lich.1001.a: "Стойте, я сражусь с ним [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам')]!"
 marcher_lich.1001.b: "Пусть [great_champion.GetName] вступит в бой!"
 marcher_lich.1001.c: "[great_magi.GetName] быстро с ним разделается."
 marcher_lich.1001.d: "Все вместе — быстро, пока он не успел ударить!"
 marcher_lich.1001.e: "Хватайте всё, что можете, и бегите к выходу!"
 marcher_lich.1001.successful.desc: "Вы одолели [Concept('liches','лича')|E]!"
 marcher_lich.1001.failure.desc: "Вам не удалось одолеть [Concept('liches','лича')|E]!"
 marcher_lich.1001.potential_artifacts.tt: "Есть шанс получить [Concept('artifact','артефакт')|E]"
 marcher_lich.1001.wounded.tt: "Есть шанс выбраться [Select_CString(ROOT.Char.IsFemale, 'живой', 'живым')]..."

 marcher_lich.1002.t: "Единоборство в сердце некрополя"
 marcher_lich.1003.t: "Засада в сердце некрополя"

 # Events for Arch Lich
 arch_lich_invasion.0005.t: "Смерть пробуждается"
 arch_lich_invasion.0005.desc: "Где-то далеко на [Concept('the_lichdoms','севере')|E] я чувствую пробуждение губительной силы. С каждым днём она крепнет и тревожит что-то в глубине моего сердца.\n\nЯ не знаю, что за сущность стоит за этим, но скоро нам наверняка предстоит это узнать."
 arch_lich_invasion.0005.a: "Лучше бы нам не пришлось этого узнавать."


arch_lich_invasion.0007.t: "Чёрные горизонты"
arch_lich_invasion.0007.desc: "Над всем [Concept('chevalie','Шевалье')|E] нависла тень — над крестьянами, королями и всеми, кто коротает жизнь между ними.\n\nСеверная [Concept('the_lichdoms','тень')|E] протянула к земле живых своё щупальце, словно обвиняя её. Большинство не понимает этих знамений или слишком молодо, чтобы их помнить, но остальные знают их слишком хорошо.\n\nМёртвые идут."
arch_lich_invasion.0007.a: "Да защитят нас Святые пути."

arch_lich_invasion.1001.t: "Смерть наступает на Шевалье"
arch_lich_invasion.1001.close: "Мёртвые идут.\n\nВсю неделю из северных пограничных фортов приходят донесения о [Concept('arch_lich','архиличе')|E], восставшем на [Concept('the_lichdoms','севере')|E] во главе орды нежити. Чёрные тучи на горизонте сгущаются, и кто знает, какие ещё ужасы обрушит на нас «[arch_lich.GetShortUINameNoTooltip]»."
arch_lich_invasion.1001.far: "Из [Concept('chevalie','Шевалье')|E] вместе с перепуганными купцами начали просачиваться слухи о могущественном [Concept('liches','маге')|E], восставшем из мёртвых, чтобы преследовать живых. Нельзя сказать, правдивы ли эти слухи, но и наверняка опровергнуть их невозможно. Пока что."
arch_lich_invasion.1001.craven: "От одной мысли об этом меня бросает в дрожь!"
arch_lich_invasion.1001.a: "Они не пройдут даже Чёрных фортов."
arch_lich_invasion.1001.b: "Когда же эти марочники перестанут рассказывать небылицы..."
arch_lich_invasion.1001.tt: "[Concept('arch_lich','Архилич')|E] не знает ни милосердия, ни сострадания и пожрёт всё на своём пути."

arch_lich_invasion.1003.t: "Жизнь торжествует над смертью"
arch_lich_invasion.1003.desc: "Наконец [Concept('arch_lich','архилич')|E] потерпел поражение на земле [kingdom_target.GetNameNoTier]. На пути его гнусного похода осталось бессчётное множество мертвецов — как недавно погибших, так и поднятых из могил. Лич уже бежит обратно под защиту [Concept('the_lichdoms','мёртвых земель')|E], а мы преследуем его.\n\n#N Архилич вернётся, если не расправиться с ним в его некрополе!#!"
arch_lich_invasion.1003.a: "Нельзя терять бдительность!"
arch_lich_invasion.1003.a.tt: "Война ещё не окончена: [Concept('arch_lich','архилич')|E] вернётся"

arch_lich_invasion.1005.t: "Смерть повержена"
arch_lich_invasion.1005.desc: "Наконец-то [defeated_arch_lich.GetFirstName] [Select_CString(defeated_arch_lich.IsFemale, 'повержена', 'повержен')].\n\nОрды нежити уже осыпаются грудами костей, а мелкие личи, прежде служившие архиличу, бегут на далёкий [Concept('the_lichdoms','север')|E] так быстро, как только могут. Никто не знает, сколько времени займёт восстановление после этого кошмара, но наконец\n\nзанимается рассвет."
 arch_lich_invasion.1005.a: "Пусть грядущий день будет светлее."

 arch_lich_invasion.2001.opening: "Слушай сюда, червь!"
 arch_lich_invasion.2001.desc: "Мне незачем представляться такому ничтожеству, как #i ты#!. Кланяйся по моему приказу и делай, что тебе велено, иначе я сотру тебя с лица земли, а твой прах превращу в безделушку."
 arch_lich_invasion.2001.a: "У нас нет выбора..."
 arch_lich_invasion.2001.a.tt: "Вы станете вассалом архилича. Ваша жизнь будет недолгой, зато смерть..."
 arch_lich_invasion.2001.b: "Я не склонюсь перед тобой!"
 arch_lich_invasion.2001.b.tt: "Архилич вторгнется в ваши земли"

 arch_lich_invasion.2002.opening: "О повелитель мёртвых,"
 arch_lich_invasion.2002.t: "Архилич мёртвых,"
 arch_lich_invasion.2002.desc: "Мы не видим иного выхода, кроме как принять ваше требование."
 arch_lich_invasion.2002.a: "Наглые глупцы."

 arch_lich_invasion.2003.opening: "О повелитель червей,"
 arch_lich_invasion.2003.t: "Нет, ЭТО ТЫ слушай!"
 arch_lich_invasion.2003.desc: "Я не склонюсь ни перед тобой, ни перед кем другим, мерзкий выродок! Ползи обратно в свою тень!"
 arch_lich_invasion.2003.a: "Наглые глупцы."

 arch_lich_invasion.3001.t: "Мёртвые пришли"
 arch_lich_invasion.3001.desc: "Это уже невозможно отрицать: [Concept('liches','мёртвые')|E] стоят у нашего порога. Кажется, сама жизнь близка к краху, пока [attacker.GetTitledFirstName] обрушивает на землю свои ужасы.\n\nЭтот кошмар угрожает всем нам, но готовы ли мы рискнуть всем ради других?"

 arch_lich_invasion.4001.t: "Падение Шевалье"
 arch_lich_invasion.4001.desc: "Шевалье больше нет.\n\nНикто не верил, что это возможно: земля антимагических искусств и бесчисленных сказаний о великих рыцарях, торжествующих над мерзким колдовством мёртвых, теперь лежит безмолвная и охваченная огнём.\n\nУже несколько дней с севера нескончаемым потоком идут беженцы. Немногие уцелевшие [Concept('antimagic_orders','антимагические ордена')|E] пытаются собрать на [Concept('shatteredisles','Расколотых островах')|E] хоть какое-то сопротивление в надежде отбросить [Concept('arch_lich','архилича')|E], но некогда оживлённые берега Шевалье почернели от смерти."
 arch_lich_invasion.4001.a: "Неужели так кончается мир?"

 arch_lich_invasion.4002.t: "Падение Калатипсоми"
 arch_lich_invasion.4002.desc: "Лесов Калатипсоми больше нет.\n\nСкверна [Concept('arch_lich','архилича')|E] превратила древние пышные леса Калатипсоми в ядовитую смоляную трясину смерти, непригодную даже для самой стойкой жизни. Поток выживших давно иссяк, и никто больше не знает, что таится на границе обитаемых земель.\n\nМоряки с [Concept('shatteredisles','Расколотых островов')|E] говорят, что теперь опасно ходить на север: воды Алойзийского моря обратились против них. Но [arch_list.GetFirstName] продолжает свой поход, распространяя смерть с каждым шагом."
 arch_lich_invasion.4002.a: "Эту угрозу нужно остановить."

 arch_lich_invasion.4010.t: "Тайна Раокура"
 arch_lich_invasion.4010.desc: "[Concept('arch_lich','Архилич')|E] [arch_lich.GetFirstName] [Select_CString(arch_lich.IsFemale, 'сумела', 'сумел')] проникнуть в [Concept('chevalie','Шевалье')|E] так глубоко, что [Select_CString(arch_lich.IsFemale, 'её', 'его')] орда достигла освящённых залов Раокура. О случившемся ходят лишь смутные слухи, и никто не решается им поверить. Говорят, лич спустился глубоко под город и проник в древние катакомбы мёртвых — целый город трупов прямо под нашими ногами. Кто знает, сколько их там, но, если слухи правдивы, лич наверняка забрал их всех в свою армию."
 arch_lich_invasion.4010.a: "Это крайне тревожно..."

 arch_lich_invasion.4011.t: "Драконья нежить"
 arch_lich_invasion.4011.desc: "Поначалу рассказ казался невероятным. По всей [Concept('etepezea_biozone','Этепезее')|E] разнёсся неслыханный прежде рёв, а затем люди увидели поднятое из мёртвых скелетообразное чудовище [Concept('dragon','дракона')|E].\n\nНо свидетельств становится всё больше. Теперь вся земля в ужасе перед этими кошмарами, которые летают в небе и извергают холодное пламя на поля, города и всё между ними.\n\nПока никто не нашёл способа быстро их уничтожать, но, если мы не поторопимся, они могут стать величайшей угрозой в истории человечества."
 arch_lich_invasion.4011.a: "Нужно действовать, и быстро!"

 arch_lich_invasion.4012.t: "Возвращение Пожирателя миров"
 arch_lich_invasion.4012.desc: "Беженцы из восточного [Concept('sarradon','Саррадона')|E] твердят лишь одно:\n\n«[Concept('the_worldeater','Пожиратель миров')|E] пробудился».\n\nНикто толком не знает как, но [Concept('arch_lich','архилич')|E] [arch_lich.GetFirstName] [Select_CString(arch_lich.IsFemale, 'сумела', 'сумел')] вернуть к жизни его исполинский скелет и вновь [Select_CString(arch_lich.IsFemale, 'выпустила', 'выпустил')] чудовище в мир."
 arch_lich_invasion.4012.a: "Смерть придёт за всеми нами."