l_russian:
 marcher_political.0001.t:0 "Расколотая корона"
 marcher_political.0001.desc:0 "Пока безжизненное тело [Select_CString(previous_chevalie_ruler.IsFemale, 'моей', 'моего')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('previous_chevalie_ruler'))] сгорает на погребальном костре, меня одолевают тяжёлые мысли. Ни для кого не секрет: многие в Шевалье ждали этого дня, держа кинжалы в ножнах. Всякий раз, когда умирает [previous_chevalie_ruler.GetTitleTierName], для змей наступает удобный момент захватить власть.\n\nУже поступают вести о заговорах знати и её ручных претендентах, готовящих мятежи по всей стране. Мой двор тоже непривычно пуст: многие разъехались по поместьям, чтобы подготовиться к грядущей гражданской войне.\n\nВ ближайшие дни мятежники полезут как грибы после дождя. Пора созывать войска и готовиться к неизбежному."
 marcher_political.0001.a:0 "Скоро станет ясно, кто мне верен..."
 marcher_political.0001.a.evil:0 "Всё просто: они либо подчинятся, либо умрут."
 marcher_political.0001.b:0 "Возможно, мне не суждено было стать [ROOT.Char.GetTitleTierName]..."
 will_be_pretender_tt:0 "Вы заявите права на трон Шевалье и примете активное участие в грядущей гражданской войне."
 will_sit_it_out_tt:0 "Вы не станете напрямую участвовать в грядущей гражданской войне как претендент на трон."
 
 marcher_political.0002.t:0 "Расколотая корона"
 marcher_political.0002.desc:0 "[SCOPE.sC('previous_chevalie_ruler').GetFullName] [Select_CString(previous_chevalie_ruler.IsFemale, 'мертва', 'мёртв')]. Пора действовать: уже поступают вести о заговорах знати и готовящихся по всей стране мятежах. Мои права сомнительны, но если войско окажется достаточно сильным, корона может стать моей!"
 marcher_political.0002.a:0 "Шевалье может стать моим!"
 marcher_political.0002.b:0 "Мне нечего делить в этой борьбе."
 
 marcher_political.0003.t:0 "Расколотая корона"
 marcher_political.0003.desc:0 "[SCOPE.sC('previous_chevalie_ruler').GetTitledFirstName] [Select_CString(previous_chevalie_ruler.IsFemale, 'мертва', 'мёртв')]. Пора действовать: при моём дворе уже поговаривают, что именно я — [Select_CString(ROOT.Char.IsFemale, 'истинная королева', 'истинный король')] Шевалье. Если меня коронуют, мало кто сможет оспорить моё право на власть."
 #marcher_political.0002.a:0 "Я возьму то, что принадлежит мне по праву!"
 #marcher_political.0002.b:0 "Мне нечего делить в этой борьбе."
 
 marcher_political.0004.t:0 "Расколотая корона"
 marcher_political.0004.desc:0 "Как и следовало ожидать, не все согласились сидеть сложа руки и упускать возможность заявить права на трон. До меня уже дошла весть, что [first_pretender.GetFirstName] [Select_CString(first_pretender.IsFemale, 'заняла', 'занял')] престол [first_pretender.GetPrimaryTitle.GetNameNoTier]; [first_pretender.GetSheHe] теперь носит титул «[first_pretender.GetTitleTierName]». Наверняка [Select_CString(first_pretender.IsFemale, 'за ней', 'за ним')] последуют другие.\n\nВ ближайшие дни начнутся первые сражения грядущей войны. Остаётся надеяться, что новые враги разобьют головы друг о друга, а не объединятся против меня."
 marcher_political.0004.a:0 "Наступает эпоха войн."
 marcher_political.0004.a.evil:0 "Я убью каждого подлого предателя, который посмеет мне противостоять!"

 marcher_political.0010.t:0 "Оборона Шевалье"
 marcher_political.0010.desc:0 "Я до сих пор помню день, когда [defender.GetTitledFirstName] [Select_CString(defender.IsFemale, 'высадилась', 'высадился')] на наших берегах, полагая, что сил хватит завладеть нашей родиной. Никто не мог остановить это наступление — до сих пор.\n\n[attacker.GetTitledFirstName] [Select_CString(attacker.IsFemale, 'бросила', 'бросил')] клич, и храбрые марочники со всего Шевалье начали стекаться под знамёна защитников. Пока армии Шевалье выступают в поход, гонцы разъезжаются по стране, призывая всех встать на защиту того, что принадлежит нам по праву."
 marcher_political.0010.a:0 "Я соберу своих доблестных рыцарей и присоединюсь к войску!"
 marcher_political.0010.b:0 "Личные дела пока не позволяют, но позже я могу присоединиться."
 marcher_political.0010.c:0 "Эта мелкая свара меня не интересует."