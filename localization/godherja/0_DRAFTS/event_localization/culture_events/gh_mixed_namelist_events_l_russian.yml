l_russian:
 mixed_namelists.0001.t:0 "Сьялволки побережья"
 mixed_namelists.0001.desc:0 "Расколотое побережье — мой дом, а южане — мои братья. Пока мой народ празднует становление новой культуры — [GetPlayer.GetCulture.GetName], я вижу, как наш народ смешивается с южанами и различить одних от других становится всё труднее.\n\nМногие наши дети говорят на языке южан, а дети южан носят наши имена. Некоторые говорят, что мы уничтожили друг друга; во всяком случае, их произношение наших имён определённо непривычно для слуха...\n\nОни ведь и правда произносят их неправильно, верно?"
 mixed_namelists.0001.a:0 "Признаем: мы стали южанами"
 mixed_namelists.0001.b:0 "Старый язык всё ещё ценен"
 mixed_namelists.0001.c:0 "Мы не позволим южной речи искажать язык предков"
 mixed_namelists.0001.tt:0 "[GetPlayer.GetCulture.GetName] будет использовать имена на аверсарианский лад"
 mixed_namelists.0002.t:0 "Сьялволки юга"
 mixed_namelists.0002.desc:0 "Когда мы празднуем становление новой культуры — [GetPlayer.GetCulture.GetName], приходится признать: в этой чужой земле мы утратили часть самих себя. Старые племена и кланы смешались, прежние связи забыты.\n\nМногие наши дети говорят на языках южан, а дети южан носят наши имена. Некоторые говорят, что мы уничтожили друг друга; во всяком случае, их произношение наших имён определённо непривычно для слуха...\n\nОни ведь и правда произносят их неправильно, верно?"
 mixed_namelists.0002.a:0 "Признаем: мы стали южанами"
 mixed_namelists.0002.b:0 "Старый язык всё ещё ценен"
 mixed_namelists.0002.c:0 "Мы не позволим южной речи искажать язык предков"
 mixed_namelists.0002.tt:0 "[GetPlayer.GetCulture.GetName] будет использовать смешанные имена на аверсарианский лад"
 mixed_namelists.0003.t:0 "Марочники или аверсарианцы"
 mixed_namelists.0003.desc:0 "Пока мой народ празднует становление новой культуры — [GetPlayer.GetCulture.GetName], передо мной встают два мира, породившие нас: [Concept('aversaria','Аверсария')|E] — Имперское человечество, величайшая империя в истории нашего рода, и марки [Concept('chevalie','Шевалье')|E] — непокорённый рубеж между живыми и мёртвыми.\n\nМы — наследники величайших культур нашей эпохи: они поразительно непохожи, но теперь их объединяет [GetPlayer.GetPrimaryTitle.GetName]. С каждым днём былые различия стираются, к досаде традиционалистов всех мастей.\n\nНеужели мы всего лишь помесь?"
 mixed_namelists.0003.a:0 "Мы — и те и другие"
 mixed_namelists.0003.b:0 "Мы — марочники"
 mixed_namelists.0003.c:0 "Мы — аверсарианцы"
 mixed_namelists.0003.tt:0 "[GetPlayer.GetCulture.GetName] будет использовать шевальено-аверсарианские имена"
 mixed_namelists.0004.t:0 "Конийцы Марок"
 mixed_namelists.0004.desc:0 "Мои вассалы, моя семья и я долго жили бок о бок с марочниками и конейкменерами, и наши языки и обычаи постепенно смешались. При дворе державы [GetPlayer.GetPrimaryTitle.GetName] шевальенская речь переплетается с конийкстаэлем, а песни и кухня обоих народов обогащают нас.\n\nНе пора ли признать, что мы едины?"
 mixed_namelists.0004.a:0 "Мы едины"
 mixed_namelists.0004.b:0 "Мы останемся прежними"
 mixed_namelists.0004.tt:0 "[GetPlayer.GetCulture.GetName] будет использовать шевальено-конийские (риваризианские) имена"
 mixed_namelists.0005.t:0 "Ойейницы Марок"
 mixed_namelists.0005.desc:0 "Никто уже не помнит Мурнир: [Concept('sorrowing_of_oejeynica','Скорбь по Ойейнице')|E] поглотила всё, чем некогда были наши предки. Когда мы празднуем становление новой культуры — [GetPlayer.GetCulture.GetName], приходится признать: мы — смешанный народ, сформированный своей историей на этой земле.\n\nДревние песнопения звучат для нас чуждо, наши имена и летописи записаны на шевальенский лад. Чем сильнее мы стараемся отделить себя от соседей, тем яснее понимаем, что это невозможно. Со стыдом перед предками я говорю:\n\nМы — марочники."
 mixed_namelists.0005.a:0 "Не будем вечно прозябать в тени предков"
 mixed_namelists.0005.b:0 "Только через мой труп"
 mixed_namelists.0005.tt:0 "[GetPlayer.GetCulture.GetName] будет использовать шевальено-ойичайнские (ойейницкие) имена"
 mixed_namelists.0006.t:0 "Галлиены Марок"
 mixed_namelists.0006.desc:0 "Смешанный список имён? (Как вы вообще видите это событие, если всё это произошло столетия назад?)"
 mixed_namelists.0006.a:0 "Ага"
 mixed_namelists.0006.b:0 "Не-а"
 mixed_namelists.0006.tt:0 "[GetPlayer.GetCulture.GetName] будет использовать шевальено-галлиенские имена"
