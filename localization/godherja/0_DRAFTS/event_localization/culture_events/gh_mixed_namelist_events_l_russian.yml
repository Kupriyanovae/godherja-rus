l_russian:
 mixed_namelists.0001.t:0 "Sjalvolki of the Coast"
 mixed_namelists.0001.desc:0 "The Shattered Coast is my home home, and the South-Men are my brothers. As my people celebrate our new [GetPlayer.GetCulture.GetName] identity i see our men and women mingle, ever harder to distinguish.\n\nMany of our children speak their tongue, and southron children bear our names. Some say we have both destroyed one-another, their readings of our names are certainly strange to the ear...\n\nThey do say them wrong don't they?"
 mixed_namelists.0001.a:0 "Let us admit we have become South-Men"
 mixed_namelists.0001.b:0 "There is still value in the old tongue"
 mixed_namelists.0001.c:0 "We will correct any tainting of our ancestral language with southern speech"
 mixed_namelists.0001.tt:0 "[GetPlayer.GetCulture.GetName] will use Aversarianized names"
 mixed_namelists.0002.t:0 "Sjalvolki of the South"
 mixed_namelists.0002.desc:0 "As we celebrate our new [GetPlayer.GetCulture.GetName] identity we must admit we have lost part of ourselves in this strange land. Old tribes and clans have blended, old affiliations forgotten.\n\nMany of our children speak southern tongues, and southron children bear our names. Some say we have both destroyed one-another, their readings of our names are certainly strange to the ear...\n\nThey do say them wrong don't they?"
 mixed_namelists.0002.a:0 "Let us admit we have become South-Men"
 mixed_namelists.0002.b:0 "There is still value in the old tongue"
 mixed_namelists.0002.c:0 "We will correct any tainting of our ancestral language with southern speech"
 mixed_namelists.0002.tt:0 "[GetPlayer.GetCulture.GetName] will use Mixed (Aversarianized) names"
 mixed_namelists.0003.t:0 "Marcher or Aversarian"
 mixed_namelists.0003.desc:0 "As my people celebrate our new [GetPlayer.GetCulture.GetName] identity i behold the two worlds that have produced us: [aversaria|E], Imperial Humanity, the greatest empire in the history of our species; And the Marches of [chevalie|E], the unconquered frontier between the living and the dead\n\nWe are heirs to the highest cultures of our time, strikingly contradictory yet now united in the [GetPlayer.GetPrimaryTitle.GetName]. Each day our old distinctions degrade, to the chagrin of traditionalists of all stripes\n\nAre we to be mongrels?"
 mixed_namelists.0003.a:0 "We are Both"
 mixed_namelists.0003.b:0 "We are Marchers"
 mixed_namelists.0003.c:0 "We are Aversarians"
 mixed_namelists.0003.tt:0 "[GetPlayer.GetCulture.GetName] will use Chevalo-Aversarian names"
 mixed_namelists.0004.t:0 "Konij of the Marches"
 mixed_namelists.0004.desc:0 "My vassals my family and i have lived side by side with Marchers and Konijkmeners, as our language and customs have blended. At the court of the [GetPlayer.GetPrimaryTitle.GetName] Chevalien blends into Konijkstael, songs and cuisine of both sides enriching us\n\nIs it time to embrace that we are one?"
 mixed_namelists.0004.a:0 "We are united"
 mixed_namelists.0004.b:0 "We will be as we have been"
 mixed_namelists.0004.tt:0 "[GetPlayer.GetCulture.GetName] will use Chevalo-Konij (Rivarisian) names"
 mixed_namelists.0005.t:0 "Oejeynicans of the Marches"
 mixed_namelists.0005.desc:0 "None remember Murnyr, the [sorrowing_of_oejeynica|E] consumed what our ancestors once were. As we celebrate our emerging [GetPlayer.GetCulture.GetName] identity I must admit we are an impure people defined by our history in this land\n\nAncient chants sound alien to our modern ears, our own names and histories are written in the Chevalien manner. The more we try to distinguish ourselves the more we face that we cannot, i say at great shame to my ancestors:\n\nWe are marchers"
 mixed_namelists.0005.a:0 "Let us not forever wallow in the shadow of our ancestors"
 mixed_namelists.0005.b:0 "Over my dead body"
 mixed_namelists.0005.tt:0 "[GetPlayer.GetCulture.GetName] will use Chevalo-Ojyczayn (Oejeynican) names"
 mixed_namelists.0006.t:0 "Gallieni of the Marches"
 mixed_namelists.0006.desc:0 "mixed namelist? (how are u seeing this event this happened centuries ago)"
 mixed_namelists.0006.a:0 "yea"
 mixed_namelists.0006.b:0 "nah"
 mixed_namelists.0006.tt:0 "[GetPlayer.GetCulture.GetName] will use Chevalo-Gallien names"
