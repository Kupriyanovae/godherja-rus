l_russian:

 agadari.0001.t: "Возвращённая родина"
 agadari.0001.desc: "Глядя на земли предков, я чувствую гордость за свершившееся. После [Concept('war_of_all_islands','Войны всех островов')|E] наш народ едва удерживался на плаву, цепляясь за утраченную славу и ожидая, когда течение истории смоет нас без следа. Но [Concept('warrior_women_ehatm','воительницы э’хатм')|E] всегда повелевали волнами. Силой оружия мы остановили падение и вернули родину предков. Бескрайний океан зовёт меня, суля добычу и новые возможности."
 agadari.0001.a: "Пусть никто не сочтёт нас недостойными"

 agadari_resurgence_modifier.0001.custom: "Все [Concept('counties','графства')|E] Крехеджада"

 agadari_exodus_modifier.0015.custom: "Все [Concept('counties','графства')|E] Кирата"
 
 agadari.0010.t: "Вновь едины"
 agadari.0010.desc: "После [Concept('war_of_all_islands','Войны всех островов')|E] наш народ изгнали в колонии, основанные нами в [Glossary('Кирате','cyrat_encyclopedia_desc')]. Но ни покоя, ни спасения мы там не нашли. За стенами поселений на нас охотились бесчисленные звери, а в самих поселениях нас косили болезни. Хотя Крехеджад возвращён, мы остаёмся меньшинством среди многочисленных [Concept('aversaria','аверсарианцев')|E], которые не питают к нам любви. Если призвать живущих в джунглях родичей оставить владения и вернуться домой, мы сможем вновь заселить родину представителями народа [GetCulturePillar('heritage_agadari').GetNamel]ого и крепче держать подданных в повиновении."
 agadari.0010.a: "Составить письма"

 agadari.0015.opening: "[actor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 agadari.0015.desc: "Ликуйте, сородичи! Наша родина отвоёвана у мерзких [Concept('aversaria','аверсарианцев')|E]. Как [Select_CString(actor.IsFemale, 'правительница державы', 'правитель державы')] «[GetTitleByKey('e_krehejad').GetNameNoTier]», я обещаю безопасный путь всем представителям народа [GetCulturePillar('heritage_agadari').GetName], желающим вернуться на родину и жить там свободными людьми."
 agadari.0015.a: "Поднять паруса — домой!"
 agadari.0015.b: "Лучше править в [ROOT.Char.GetFaith.NegativeAfterLife2]..."