l_russian:
 konijkmener.0001.t:0 "Торговец [Concept('alchemy','зельями')|E]"
 konijkmener.0001.desc:0 "Сегодня ко двору прибывает группа торговцев из земель конейкменеров. Громко расхваливая чудесные свойства своих товаров, они объявляют себя представителями организации «[ROOT.GetCharacter.Custom('konijkmener_merchant_company_name')]». Их предводитель, одетый богаче прочих и больше всех похожий на змею, поднимает над [konijkmener_merchant.GetHerHis] головой светящийся состав и заявляет, что охотно уступит поистине дивное [Concept('alchemy','зелье')|E]. Оно непременно усладит чувства, вкус и нрав любого мудрого и просвещённого владыки, достаточно проницательного, чтобы купить его за сущие гроши.\n\nВ подтверждение своих слов торговец велит одному из [konijkmener_merchant.GetHerHis] подручных сделать глоток. Прямо у меня на глазах человек вырастает втрое, а мышцы вздуваются так резко, что рубашка лопается по швам!\n\nМне непременно нужно это зелье!"
 konijkmener.0001.a.strength_potion:0 "[Concept('alchemy','Зелье')|E] силы?! Давай сюда!"
 konijkmener.0001.a.skill:0 "Говоришь, это сделает меня умнее?"
 konijkmener.0001.a.fertility:0 "[Concept('alchemy','Зелье')|E]... мужской силы... и правда действует так, как ты говоришь? Вот это да..."
 konijkmener.0001.a.magic:0 "Настойка для улучшения магических способностей?"
 konijkmener.0001.a.experience:0 "Говорят, это зелье пользуется спросом у студентов и учёных..."
 konijkmener.0001.a.life:0 "Простой глоток, и я, возможно, буду жить вечно?"
 konijkmener.0001.b:0 "Убирайтесь прочь, шарлатаны!"
 konijkmener.0001.c:0 "Охрана! Конфискуйте все, что у них есть при себе!"
 konijkmener.0001.c.sadistic:0 "Стража! Убейте [konijkmener_merchant.GetHerHis] и заберите всё, что у них есть!"
 potion_merchants_will_not_visit_anymore_tt:0 "В обозримом будущем торговцы [Concept('alchemy','зельями')|E] больше ко мне не явятся."
 
 konijkmener_merchant_company_name_1:0 "Достопочтеннейшая компания таинственных вод"
