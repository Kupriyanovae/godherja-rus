 konijkmener_merchant_company_name_4:0 "Великая торговая хартия множества кораблей и неисчислимых возможностей"
 konijkmener_merchant_company_name_5:0 "Достопочтенная трижды благословенная торговая гильдия сира Венсилкса"
 konijkmener_merchant_company_name_6:0 "Гильдия объединённых бессмертных святых, благословлённых собственной красотой"
 konijkmener_merchant_company_name_7:0 "Компания золотого русалочьего плавника Пути монет"
 konijkmener_merchant_company_name_8:0 "Достопочтеннейшая и благословенная торговая хартия святого пути"
 konijkmener_merchant_company_name_9:0 "Объединённая торговая компания гильдии, короны и канцлера конейкменеров"
 konijkmener_merchant_company_name_10:0 "Дивная гильдия благословенных диковин и торговли"