l_russian:
 gh_partic_events.0101.t:0 "Тайны, которыми стоит поделиться"
 gh_partic_events.0101.desc:0 "Мы, партики, редко показывались внешнему миру, пока [Concept('the_fog','Туман')|E] не накрыл нашу родину, вынудив нас покинуть Драйоганн Дтохт — хранилище наших летописей — и лишиться защиты Зелёного моря.\n\nВ новых землях мне особенно важно и отрадно иметь рядом [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('outsider'))], такого человека, как [outsider.GetFirstName]. Мы поклялись $partic_high_god_name$ хранить свои тайны, но история нашего народа и знания, которые передавались тысячелетиями, могут исчезнуть в грядущей смуте."
 gh_partic_events.0101.a:0 "Возможно, пришло время довериться надёжным чужакам"
 gh_partic_events.0101.a.tt:0 "[outsider.GetFirstName] сможет выбрать, какие тайны [outsider.GetSheHe] хочет узнать..."
 gh_partic_events.0101.b:0 "Нет, мы должны хранить верность своим корням"

 gh_partic_events.0102.t:0 "Тайны, которыми стоит поделиться: предложение"
 gh_partic_events.0102.desc:0 "Ко мне приходит [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partic_sharer'))] [partic_sharer.GetFirstName] и предлагает раскрыть некоторые тайны [partic_sharer.GetHerHis] народа. С учётом почти мифической славы партиков это великая честь и редкая возможность.\n\n«[ROOT.Char.GetFirstNameNoTooltip], ты [Select_CString(ROOT.Char.IsFemale, 'доказала', 'доказал')], что тебе можно доверять. Я могу поведать тебе предания своего народа или наставить в путях провидцев — чем пожелаешь, тем и поделюсь»."
 gh_partic_events.0102.a:0 "Я хочу изучить искусство ваших магов"
 gh_partic_events.0102.a.tt:0 "[partic_sharer.GetFirstName] раскроет вам некоторые тайны провидцев"
 gh_partic_events.0102.b:0 "Я хочу услышать историю вашего народа"
 gh_partic_events.0102.b.tt:0 "[partic_sharer.GetFirstName] перескажет одно из преданий партиков"
 gh_partic_events.0102.ba.tt:0 "Как партики спаслись от Тумана"
 gh_partic_events.0102.bb.tt:0 "Как делилось общество партиков"
 gh_partic_events.0102.bc.tt:0 "Некоторые сведения о Верховном совете"
 gh_partic_events.0102.c:0 "Благодарю за предложение, но в этом нет нужды"
 gh_partic_events.0102.refusedtoast.particsharer:0 "Благодарю за предложение, но в этом нет нужды"

 gh_partic_events.0103.t:0 "Тайны, которыми стоит поделиться: тайные знания"
 gh_partic_events.0103.desc.a:0 "[outsider.GetFirstName] просит поделиться тайными знаниями о магии.\n\nЯ изучал[Select_CString(ROOT.Char.IsFemale, 'а', '')] пути хранителей и провидцев, поэтому могу познакомить [outsider.GetFirstNameNoTooltip] с основами некоторых ритуалов партиков. Кроме того, я показываю несколько упражнений и приёмов, помогающих настроиться на Ритм мира.\n\nПока мы говорим, спорим и упражняемся, меня тревожит возможное осуждение друидов и оллахов. И всё же я ценю связь с [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('outsider'))] и горжусь тем, что эти знания могут принести пользу людям за пределами народа партиков."
 gh_partic_events.0103.desc.b:0 "[outsider.GetFirstName] просит поделиться тайными знаниями о магии.\n\nЯ не получал[Select_CString(ROOT.Char.IsFemale, 'а', '')] формального обучения искусству хранителей и провидцев, но некоторые упражнения и приёмы, помогающие настроиться на Ритм мира, передаются у нас от родителей к детям.\n\nПока мы говорим, спорим и упражняемся, меня тревожит возможное осуждение друидов и оллахов. И всё же я ценю связь с [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('outsider'))] и горжусь тем, что эти знания могут принести пользу людям за пределами народа партиков."
 gh_partic_events.0103.a:0 "Теперь [outsider.GetFirstNameNoTooltip] — моё доверенное лицо"

 gh_partic_events.0104.t:0 "Тайны, которыми стоит поделиться: предания нашего народа"
 gh_partic_events.0104.desc:0 "[outsider.GetFirstName] просит рассказать предание о народе партиков.\n\nПоведать ли [outsider.GetHerHim] о Расколе долин? О великом ритуале, жертвах и борьбе, через которые партики прошли, спасаясь от Тумана?\n\nИли рассказать, как прежде делился наш народ? О брикспартиках, верных Верховному совету и пребывавших в единении с Волей Мира; о неверующих, которых изгоняли в деорайпартики; о дурн-эорадах, заклятых врагах Воли?\n\nА может, поведать о древнем Верховном совете? О его непререкаемой власти и законах, направлявших брикспартиков вплоть до крушения совета после [Concept('frodbrokna','Фродброкны')|E]?"
 gh_partic_events.0104.a:0 "«Когда Воля умолкла...»"
 gh_partic_events.0104.a.tt:0 "Вы рассказываете [outsider.GetFirstName] о Расколе долин"
 gh_partic_events.0104.b:0 "«Когда-то мы делились на три ветви...»"
 gh_partic_events.0104.b.tt:0 "Вы рассказываете [outsider.GetFirstName] об устройстве общества партиков"
 gh_partic_events.0104.c:0 "«Сколько помнит история партиков...»"
 gh_partic_events.0104.c.tt:0 "Вы рассказываете [outsider.GetFirstName] о Верховном совете"

 gh_partic_events.0105.t:0 "Предания партиков: Раскол долин"
 gh_partic_events.0105.desc:0 "«Когда Воля умолкла...»\n\n[partic_sharer.GetFirstName] рассказывает о дне, когда Драйоганн Дтохт — Мировое древо, от которого Верховный совет получал видения и пророчества, — издал страшный крик. Почти все могущественные провидцы и хранители, услышавшие его, погибли.\n\nТысячелетия порядка, который поддерживали брикспартики, рухнули за один день, а уцелевшие брикспартики ради безопасности рассеялись среди деорайпартиков. Хаос быстро перерос в смертельную войну между ветвями народа. Говорят, во время этой борьбы партики со всех концов Зелёного моря получили от Драйоганн Дтохт видение о великом ритуале, способном спасти их от неминуемой гибели.\n\nПосле долгих лет войны, переговоров и жертв группа, увидевшая знамение, вышла победителем и совершила невозможное: впервые за целую вечность объединила все ветви партиков, провела ритуал и открыла великий портал, через который партики [ROOT.Char.Custom('ParticToCenware')]"
 gh_partic_events.0105.desc.cenware:0 "прошли и предстали передо мной. Первые провидцы, вошедшие в мой шатёр, по их словам, прибыли всего несколькими часами ранее."
 gh_partic_events.0105.desc.regular:0 "прошли и присоединились к Сьялвольскому Имперреху."
 gh_partic_events.0105.a:0 "Действительно удивительная история..."
 gh_partic_events.0105.yaytoast.particsharer:0 "[partic_sharer.GetFirstName] нравится ваш рассказ"

 gh_partic_events.0106.t:0 "Предания партиков: отпрыски Зелёного моря"
 gh_partic_events.0106.desc:0 "«Когда-то мы делились на три ветви...»\n\n[partic_sharer.GetFirstName] рассказывает мне о [Concept('greensea','Зелёном море')|E] — родине и убежище народа партиков. Ближе всех к Драйоганн Дтохт жили брикспартики, следовавшие указам Верховного совета и Воле Мира.\n\nНа окраинах Зелёного моря обитали деорайпартики — изгнанники, беглые преступники и их потомки. Не имея над собой высшей власти, они создавали собственные кланы и владения. Их не отвергали полностью: деорайпартики могли торговать и вести дела с брикспартиками, но им уже никогда не дозволялось увидеть Драйоганн Дтохт.\n\nДурн-эорадами становились противники Верховного совета и мятежники против Воли Мира. Это была третья ветвь партиков — а число три почти так же проклято, как четыре. Дурн-эорадов наказывали за тяжкие проступки, совершённые ими или их предками. Обычно их изгоняли из Зелёного моря или ссылали в самые опасные его глубины."
 gh_partic_events.0106.a:0 "Странно и увлекательно..."

 gh_partic_events.0107.t:0 "Предания партиков: Верховный совет друидов"
 gh_partic_events.0107.desc:0 "«Сколько помнит история партиков...»\n\n[partic_sharer.GetFirstName] рассказывает мне о высшей власти в обществе партиков — Верховном совете друидов. Это был круг древних мудрецов, которые общались с Драйоганн Дтохт и у самого источника толковали его послания и видения.\n\nИх указы часто были архаичны и неясны — а порой, возможно, выдумывались ради выгоды самого совета. Поэтому многие порывали с Верховным советом и становились деорайпартиками либо, если открыто бросали вызов Воле, дурн-эорадами.\n\nОтныне изгнанники навсегда становились врагами совета. Не раз их объявляли смертельной угрозой для брикспартиков и начинали против них Войны очищения.\n\nВерховный совет почти полностью погиб от отголоска [Concept('frodbrokna','Фродброкны')|E], и теперь неясно, каким станет общество партиков на новой родине."
 gh_partic_events.0107.a:0 "Таинственный народ..."

 gh_partic_events.0108.t:0 "Тайны партиков: любопытство"
 gh_partic_events.0108.desc:0 "[partic_sharer.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partic_sharer'))], принадлежит к партикам — народу, который ещё недавно считали не более чем мифом и легендой. С детства мне рассказывали об их странной магии, а теперь один из них мне доверяет!\n\nДостаточно ли мы близки, чтобы попросить рассказать об их таинственной культуре и образе жизни? Возможно, поведать истории, которые никогда не предназначались для чужих ушей?"
 gh_partic_events.0108.a:0 "Нужно спросить — любопытство сильнее меня!"
 gh_partic_events.0108.a.tt:0 "[partic_sharer.GetFirstName] решит, стоит ли делиться тайнами [partic_sharer.GetHerHis] народа..."
 gh_partic_events.0108.b:0 "Нет, я уважаю обычаи народа [partic_sharer.GetFirstNamePossessive]"


 gh_partic_events.0109.t:0 "Тайны партиков: просьба чужака"
 gh_partic_events.0109.desc:0 "Ко мне приходит [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('outsider'))], [outsider.GetFirstName], за ответами на вопросы о тайнах моего народа.\n\nМы, партики, редко показывались внешнему миру, пока [Concept('the_fog','Туман')|E] не накрыл нашу родину, вынудив нас покинуть Драйоганн Дтохт — хранилище наших летописей — и лишиться защиты Зелёного моря.\n\nВ новых землях мне особенно важно и отрадно иметь рядом [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('outsider'))], такого человека, как [outsider.GetFirstName]. Мы поклялись $partic_high_god_name$ хранить свои тайны, но история нашего народа и знания, которые передавались тысячелетиями, могут исчезнуть в грядущей смуте."
 gh_partic_events.0109.a:0 "Возможно, пришло время довериться надёжным чужакам"
 gh_partic_events.0109.a.tt:0 "[outsider.GetFirstName] сможет выбрать, какие тайны [outsider.GetSheHe] хочет узнать..."
 gh_partic_events.0109.b:0 "Нет, мы должны хранить верность своим корням"
 gh_partic_events.0102.refused.outsider:0 "Простите, но мы не можем раскрыть свои тайны"