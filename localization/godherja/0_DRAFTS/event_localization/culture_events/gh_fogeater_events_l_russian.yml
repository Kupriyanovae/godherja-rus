l_russian:
 fogeater_listen_decision:0 "Слушать Туманную Мать"
 fogeater_listen_decision_desc:0 "Туманная Мать хочет, чтобы мы слушали, потому что больше никто не станет, а мы должны слушать, иначе оглохнем для истины, которую она говорит, она хочет, чтобы мы узнали, куда ушёл Туманный Отец, хочет, чтобы мы вернули его, помнили о нём, слышали его крики, он кричит он кричит нам надо слушать нам надо слушать что случится, если мы услышим? Слишком громко, слишком громко, больно, но мы должны слушать. Слушать!"
 fogeater_listen_decision_tooltip:0 "Слушать Туманную Мать и учиться, внимая её плачу"
 fogeater_listen_decision_confirm:0 "Я слышу тебя я слышу тебя я слышу тебя прошу перестань прошу услышь"

 listen_to_the_mistmother_tooltip:0 "Слушая Древних, которые говорят, мы расширим своё понимание вселенной... ценой тех жалких остатков человечности, что у нас сохранились."
 gh_fogeater_events.1.t:0 "Шёпот звучит да"
 gh_fogeater_events.1.d:0 "Шёпот окончен, и я слышу да я слышу тебя Туманная Мать я слышу я слышу я слышу!\n\n#F Мы сыновья дочери избранные которые должны слышать потому что больше никто не станет слушать ты плачешь и плачешь и плачешь а мы не слышим тебя но понимаем слова мы не понимаем тебя но слышим твой голос. она говорит со мной мной мной мной мной мной мной мной мной она говорит она говорит она говорит это прекрасно и пугает меня и ужасает и манит она плачет по павшему мужу своему любимому Туманному Отцу который молит нас узнать почему его избрали умереть умереть\n\nединым ли целым они были навеки навеки навеки или едины телом и разумом, два воробья, кружащие над одной могилой навеки навеки навеки? Жива Туманная Мать или мертва, здесь она или он? Кто знает, кто знает, кто знает...#!"
 gh_fogeater_events.1.a:0 "Я вижу твой свет Туманная Мать я люблю тебя я люблю тебя"
 gh_fogeater_events.1.a.flavor:0 "Моё понимание растёт я слышу я слышу больше я слышу я слушаю"

 gh_fogeater_events.2.t:0 "Слышу, как Идущие идут"
 gh_fogeater_events.2.d:0 "Шёпот окончен, и я слышу да я слышу тебя Туманная Мать я слышу я слышу я слышу!\n\n#F Далёкая земля король плачет думая о горящих домах детях убивают убивают убивают он идёт на север идёт и идёт через мир и по костям жестоко сложенным хватающим ноги тянущим друзей назад а он всё идёт не слышит криков они кричат «Помоги мне помоги мне помоги мне прошу вернись» он идёт вперёд брат мёртв сестра ушла он идёт и идёт не зная зачем плачет на ходу зная что должен зная что должна зная что они должны в [Concept('the_fog','Тумане')|E] он шепчет его поиск завершён его путь нескончаем навеки он идёт он идёт он идёт дома горят они кричат ему он идёт он идёт он идёт\n\nпочему он идёт?? почему почему почему почему почему#!"
 gh_fogeater_events.2.a:0 "Я вижу твой путь да я знаю но почему"
 gh_fogeater_events.2.a.flavor:0 "Моё понимание растёт я слышу я слышу больше я слышу я слушаю"

 gh_fogeater_events.3.t:0 "Копья говорят Они говорят"
 gh_fogeater_events.3.d:0 "Шёпот окончен, и я слышу да я слышу тебя Туманная Мать я слышу я слышу я слышу!\n\n#F Они собираются тайно в скрытой тени под великой статуей великого существа Туманная Мать?? Туманный Отец? Это ты??\n\nОни встречаются под злыми взглядами людей которые не те кого они зовут Первыми они хлещут и глумятся и кричат и трудятся втайне и смотрят и смотрят их глаза бегут по бесконечным образам тех кто слушает Древних они слушают и слышат а потом убивают и убивают и убивают и кровь заливает глаза и течёт по рукам и капает с пальцев а потом они говорят и копьё уже там и тысячи их собираются и говорят копью вперёд и оно проходит сквозь голоса и в небо и сквозь звезду и Туманная Мать плачет и кричит и слишком поздно слишком поздно слишком поздно#!"
 gh_fogeater_events.3.a:0 "Туманная Мать прости меня прости меня прости меня прости меня"
 gh_fogeater_events.3.a.flavor:0 "Моё понимание растёт я слышу я слышу больше я слышу я слушаю"

 gh_fogeater_events.4.t:0 "Наблюдатель наблюдает смотрит сердится"
 gh_fogeater_events.4.d:0 "Шёпот окончен, и я слышу да я слышу тебя Туманная Мать я слышу я слышу я слышу!\n\n#F Он мёртв он не знает но мёртв но жив образ отражение стоит неподвижно в почерневшей [Concept('the_towers','Башне')|E] в землях мелкой белой грязи среди бескрайних полей он ждёт он ждёт он видит и говорит некто пришёл некто пришёл и говорил с ними и обнял их образ мерцает но остаётся, человек но не человек, древняя тварь тень того что было. В руинах того что было, в месте которое когда-то было они стоят и ждут и находят того кто станет слушать и говорят тёмные вещи и злые вещи и велят служить и служат они вторым разумом думая о том каким могло бы стать возвращённое величие смерть тем кто восстал против#!"
 gh_fogeater_events.4.a:0 "В пустой [Concept('the_towers','Башне')|E] они ждут вечно"
 gh_fogeater_events.4.a.flavor:0 "Моё понимание растёт я слышу я слышу больше я слышу я слушаю"

 ###invasion stuff
 become_fogeater_invasion_leader_decision:0 "Слушать. Вознестись. Стать."
 become_fogeater_invasion_leader_decision_desc:0 "Стало ясно ясно да яснее слова я слышу их и слышу лучше других я умею слушать я умею слушать я умею слушать но нет нет нет. Нет. Я умею говорить. Я могу ответить. Голоса шепчут через уши в глаза и я могу слушать. И стать. И подняться. Вознестись. Пора. Теперь я знаю. Пора."
 become_fogeater_invasion_leader_decision_tooltip:0 "Больше не слушать. Теперь вы говорите. Вас услышит весь мир."
 become_fogeater_invasion_leader_decision_confirm:0 "Итак, начинается"
 become_fogeater_invasion_leader_decision_gain_fogeater_empire:1 "Ваше владение становится [Concept('foglands','Туманными землями')|E]"
 become_fogeater_invasion_leader_decision_enable_fogeater_invasion_cb:1 "Вы получаете доступ к [Concept('casus_belli','казусу белли')|E] «Вторжение пожирателей тумана»"
 fogeater_invasion_leader_title_tier_requirement:0 "Вы должны быть [Concept( 'king', 'королем' )|E] или [Concept( 'emperor', 'императором' )|E]"

 fogland_event.0001.t:0 "Я говорю"
 fogland_event.0001.desc:0 "Голоса больше не шепчут, их слова больше не туманны. Несметное их число говорит сквозь мой разум, пока чёрная кровь из моих вен просачивается в лёгкие, наполняет горло и льётся изо рта. Теперь все они ясны, каждый голос различим, и все они кричат.\n\nОстальные смотрят, смотрят и плачут. Они знают, они знают, они знают... никто не может знать, никто не знает того, что знаю я, что говорят голоса. Туманная Мать была лишь одной гранью, одним из тысяч голосов того, кто выковал нас в боли и одиночестве.\n\nОсталось лишь одно. Надо прибавить остальные голоса, все будут Слушать, и все должны к ним присоединиться."
 fogland_event.0001.a:0 "Голосам нет числа, как и нам. Я слышу, я слышу, я слышу..."
 fogland_event.0001.fogeater_invasion_cb:0 "Я могу использовать [Concept('casus_belli','казус белли')|E] «Вторжение пожирателей тумана»"

 fogland_event.0002.t:0 "Говорящий!"
 fogland_event.0002.desc:0 "Они слышат они слышат они слышат наконец они услышали как и сказали голоса да да да да да да мы знали мы знали они услышат это было сказано это было сказано от начала к концу мы знали что грядёт мы знаем что грядёт оно теперь здесь оно здесь оно здесь они здесь мы здесь\n\nДАДАДА мы идём теперь мы идём собираться и выступать и пировать и плакать и молить и грабить и нет не почему но они говорят а мы слушаем и делаем потому что делаем то что должны мы знаем что делать Туманная Мать мы знаем Туманный Отец мы знаем мы знаем теперь что должны делать"
 fogland_event.0002.a:0 "Идём идём да мы идём"

 fogland_event.0003.t:0 "Мрачные вести"
 fogland_event.0003.desc:0 "Слушатели заговорили.\n\nПрежде [Concept('fogeaters','пожиратели тумана')|E] были известны своими набегами и редкими нападениями на краю мира, но теперь ведомый мир облетела весть о чём-то ином. О чём-то худшем. Немногие, кто ещё остаётся у рубежей Тумана, сообщают о несметных ордах существ, движущихся вдоль границ [Concept('the_fog','Тумана')|E]. Некоторые из них «люди», другие — нет, но все действуют сообща ради неведомой цели. Те немногие пожиратели тумана, которых удалось пленить, как обычно, ничего не рассказали и покончили с собой. Однако все они твердят одно и то же... «Говорящий слышит»."
 fogland_event.0003.a.neighbor:0 "О нет..."
 fogland_event.0003.a.distant:0 "Дикари сумели организоваться? Вздор."

 #story cycle events
 fogeater_invaison.0001.title:0 "Из Тумана"
 fogeater_invasion.0001.desc:0 "Когда под нашей властью находится столь обширная часть [Concept('the_fog','Тумана')|E], к нам стекаются орды туманных тварей и пожирателей. Пора восстать и Говорить от имени Тумана."
 fogeater_invasion.0001.a:0 "Я захвачу Серую марку"
 fogeater_invasion.001.b:0 "Я недостоин..."
 #event for death of invasion leader
 fogeater_invasion.1001.title:0 "Говорящий умолк"
 fogeater_invasion.1001.sympathetic.desc:0 "Это случилось мы знали мы знали мы знали это случилось мы знали что так будет мы слышали что так будет они сказали нам они сказали нам они сказали нам что так будет Говорящий присоединился к голосам теперь его голос один из них одна из граней Говорящий Тумана там один из многих рядом с теми кого он привёл мы знали мы знали мы знали нам жаль нам жаль мы знали мы знали мы знали мы будем слушать мы услышим мы будем слушать."
 fogeater_invasion.1001.generic.desc:0 "Пусть [ROOT.Char.GetFaith.HighGodName] будет свидетелем: так называемый «Говорящий» [Concept('fogeaters','пожирателей тумана')|E] наконец мёртв. Конечно, это ещё не конец их нападений, но без предводителя пожиратели тумана кажутся разобщёнными, растерянными и охваченными паникой. Уже поступают вести, что многие бегут в [Concept('the_fog','Туман')|E], а целые армии в каком-то безумии истребляют сами себя.\n\nПохоже, пока что вторжение окончено."
 fogeater_invasion.1001.generic.oblivious.desc:0 "Пришли сумбурные вести о смерти какого-то северного дикаря. Безумный военачальник якобы вышел из «[Concept('the_fog','Тумана')|E]» и пожирал всех, кого встречал, но мы не видим причин бояться его больше, чем самого Тумана."
 fogeater_invasion.1001.a:0 "Скатертью дорога!"
 fogeater_invasion.1001.b:0 "А мы услышим мы услышим мы услышим."
 fogeater_invasion.1001.c:0 "Говорящие? Слушатели? Что?"

 #event for the appearance of the fogeaters

 fogeater_invasion.0005.t:0 "Мрачные вести"
 fogeater_invasion.0005.desc:0 "[Concept('foglands','Туманные земли')|E] пробуждаются.\n\nЯ чувствую это костями, каждым вздохом — чувствую всякий раз, когда просыпаюсь ночью в холодном поту, задыхаясь и пытаясь вырваться из сумрачных силуэтов, преследующих меня во сне. Утро не приносит облегчения: солнечный свет становится тусклым и рваным, а тихие шепоты истончают края моего рассудка.\n\nОко грядущей бури затмевает [Concept('aervalr','Эрвал')|E], кости [Concept('aeras','Эраса')|E] содрогаются, и горы стонут от ужаса.\n\nОстальные не замечают — не понимают.\n\nОни не Слушают."
 fogeater_invasion.0005.a:0 "И потому не Станут."

 fogeater_invasion.0007.t:0 "Туман пробуждается"
 fogeater_invasion.0007.desc:0 "В последнее время из пограничных земель у края [Concept('foglands','Туманных земель')|E] приходит всё меньше вестей, а редкие рассказы говорят, что [Concept('fogeaters','пожиратели тумана')|E] стали смелее и свирепее, а за краем живого мира бурлит [Concept('the_fog','Туман')|E]. Теперь уже несколько месяцев царит тишина: на наших воронов никто не отвечает, разведчики и искатели приключений не возвращаются, и двор охвачен тревогой.\n\nПрошёл ещё один день, и казалось, что ответа уже не будет, но вдруг явился обезумевший гонец, покрытый грязью и пеплом. Несмотря на все наши старания, он произнёс лишь три слова:\n\n«Говорящий идёт»."
 fogeater_invasion.0007.a:0 "Нужно готовиться к грядущему."

 fogeater_invasion.0009.t:0 "День, когда закричал Эрвал"
 fogeater_invasion.0009.desc:0 "TODO"
 fogeater_invasion.0009.a:0 "TODO1"
 fogeater_invasion.0009.b:0 "TODO2"
 fogeater_invasion.0009.c:0 "TODO3"
 fogeater_invasion.0009.d:0 "TODO4"
 fogeater_invasion.0009.e:0 "TODO5"
 fogeater_invasion.0009.tt:0 "Фаза луны изменилась"
 fogeater_invasion.0009.tt.shards:0 "TODO"

 fogeater_invasion.1001.t:0 "Вторжение пожирателей тумана"
 fogeater_invasion.1001.desc.close:0 "Вести из [Concept('foglands','Туманных земель')|E] оказались правдой. Прежде разобщённые и раздробленные племена [Concept('fogeaters','пожирателей тумана')|E] объединило существо, называющее себя [fogeater_leader.GetName]. Провозгласив себя «[GetTrait('fogeater_invasion_leader').GetName( GetNullCharacter )]», или «Говорящим войны» пожирателей тумана, оно собрало несметное войско и намерено обрушить его на [Concept('the_continent','Континент')|E]. Вместе с ним идут орды [Concept('fogbeasts','туманных тварей')|E], а по их следам ползёт сам [Concept('the_fog','Туман')|E].\n\nХуже всего то, что [fogeater_leader.GetNameNoTooltip] выделяется даже среди своего народа. Хитрое, разумное и сведущее в военном деле, это существо окружено неземной дымкой — так его описывают те немногие, кто видел его и выжил, — словно мир не в силах вместить заключённое внутри."
 fogeater_invasion.1001.desc.far:0 "Правители на границах [Concept('foglands','Туманных земель')|E], по слухам, охвачены паникой из-за нового предводителя тех, кого они зовут [Concept('fogeaters','пожирателями тумана')|E]. Если верить донесениям, [fogeater_leader.GetName] командует несметными легионами племён и тварей из [Concept('the_fog','Тумана')|E] и намерен покорить ведомый мир. Скорее всего, это преувеличение, но если нет, вскоре мы наверняка услышим продолжение."
 fogeater_invasion.1001.a.kalath:0 "Серые врата выстоят."
 fogeater_invasion.1001.a.amaghea:0 "Дальше Амагеи они не пройдут."
 fogeater_invasion.1001.b.north:0 "Опять северные неженки ноют."
 fogeater_invasion.1001.b.east:0 "Опять восточные неженки ноют."
 fogeater_invasion.1001.craven:0 "И они идут сюда?!"
 fogeater_invasion.1001.tt:0 "Пожирателям тумана неведомы милосердие и сострадание: они сожрут всё на своём пути"

 fogeater_invasion.1003.t:0 "Волна отступает"
 fogeater_invasion.1003.desc:0 "Вторжение в [kingdom_target.GetNameNoTier] стало первым случаем, когда орду [Concept('fogeaters','пожирателей тумана')|E] удалось сломить. Благодаря общим усилиям могучей оборонительной коалиции во главе с [defender.GetTitledFirstName] [attacker.GetFirstName] наконец [Select_CString(attacker.IsFemale, 'встретила', 'встретил')] достойного противника.\n\nПосле череды кровопролитных сражений Аэльхёэр был отброшен и вынужден вернуться в [Concept('the_fog','Туман')|E], откуда явился. Победители получили краткую передышку, но даже ликование и празднования остаются сдержанными: в глубине души каждый знает, что пожиратели тумана вернутся."
 fogeater_invasion.1003.a:0 "И мы будем готовы."
 fogeater_invasion.1003.a.tt:0 "Война ещё не выиграна: Пожиратели тумана вернутся"

 fogeater_invasion.1005.t:0 "Гарформдаэр мёртв"
 fogeater_invasion.1005.desc:0 "Со смертью [defeated_fogeater_leader.GetFirstName] вторжение подошло к концу.\n\nАэльхёэр уже начал распадаться: оставшиеся без вождя [Concept('fogeaters','пожиратели тумана')|E] бегут в глубины [Concept('the_fog','Тумана')|E], оставляя за собой бескрайние пустоши. И всё же праздновать нечего: Туман вновь продвинулся в уцелевший мир, а [Concept('foglands','Туманные земли')|E] поглотили ещё больше живого мира [Concept('aeras','Эраса')|E].\n\nЛишь время покажет, что ждёт нас впереди."
 fogeater_invasion.1005.a:0 "Кто знает, что теперь ждёт [Concept('aversaria','Расколотое побережье')|E]?"

 #fogeaters try to subjugate you
 fogeater_invasion.2001.opening:0 "[Select_CString(ROOT.Char.IsFemale, 'Ты, глухая, безмолвная и немая,', 'Ты, глухой, безмолвный и немой,')]"
 fogeater_invasion.2001.desc:0 "Твои уши закрыты, твои глаза слепы. Мы здесь, они здесь, я иду. Меня не остановить. Прими это, слушай, услышь, отдай себя Говорящим. Присоединяйся, присоединяйся, присоединяйся, ты [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] слушать. Тебе нужно услышать."
 fogeater_invasion.2001.a:0 "У нас нет выбора..."
 fogeater_invasion.2001.a.tt:0 "Вы становитесь вассалом пожирателей тумана. Ваши шансы выжить невелики"
 fogeater_invasion.2001.b:0 "Я не подчинюсь тебе!"
 fogeater_invasion.2001.b.tt:0 "Пожиратели тумана начнут вторжение"

 #accept subjugation
 fogeater_invasion.2002.opening:0 "Говорящий пожирателей тумана,"
 fogeater_invasion.2002.desc:0 "У нас почти нет иного выбора, кроме как принять ваше требование. Я прошу лишь сохранить жизнь мне и моему народу..."
 fogeater_invasion.2002.a:0 "Они услышат они будут слушать"

 #refuse subjugation
 fogeater_invasion.2003.opening:0 "Так называемый Говорящий,"
 fogeater_invasion.2003.desc:0 "Мы прогоним ваши племена туда, откуда они явились. Бегите обратно в [Concept('foglands','Туманные земли')|E] — вам здесь никогда не будут рады."
 fogeater_invasion.2003.a:0 "Они должны услышать они будут слушать и я заставлю их..."

 fogeater_invasion.2101.desc:0 "До сих пор вы были мне добрым другом и верным слугой. Пора закрепить вашу службу: принесите клятву верности Гарформдаэру."
 fogeater_invasion.2101.a:0 "Да, мой сюзерен."
 fogeater_invasion.2101.b:0 "Ты думаешь, я тебе служу? Какая глупость!"
 fogeater_invasion.2101.b.tt:0 "@warning_icon! [fogeater_emperor.GetShortUIName] разрывает с вами союз и вместо этого может начать войну!"

 fogeater_invasion.2103.a:0 "Ты склонишься передо мной сейчас же, так или иначе!"
 fogeater_invasion.2103.b:0 "Ну погоди, дерзкая собака..."


 fogeater_invasion.2111.b:0 "Ты не считаешь меня ровней?! Возмутительно!"
 fogeater_invasion.2111.b.tt:0 "@warning_icon! [fogeater_emperor.GetShortUIName] разрывает с вами союз"

 fogeater_invasion.2112.desc:0 "Ты правда считаешь, что выше меня? Да мы даже не ровня! Очевидно, что моя великодушная дружба была лишь попыткой метать бисер перед свиньями."
 fogeater_invasion.2112.a:0 "О, ты пожалеешь о своих словах и делах..."

 fogeater_invasion.3001.t:0 "Туман надвигается"
 fogeater_invasion.3001.desc:0 "Отрицать это больше нельзя: орда [Concept('fogeaters','пожирателей тумана')|E] уже у нашего порога. Вместе с ней идёт сам [Concept('the_fog','Туман')|E], вечно пожирающий и вечно скрывающий таящиеся внутри ужасы. Теперь [Select_CString(attacker.IsFemale, 'проклятая', 'проклятый')] [attacker.GetTitledFirstName] обращает свой взор на наших ближайших соседей, которые умоляют о помощи.\n\nЭта угроза, несомненно, ставит под вопрос само наше существование, но, быть может, даже в столь отчаянное время из чужих страданий можно извлечь выгоду?"
 fogeater_invasion.3001.a:0 "Я направлю свои войска в оборонительную коалицию."
 fogeater_invasion.3001.b:0 "Защитим [Concept('chevalie','Шевалье')|E]!"
 fogeater_invasion.3001.c:0 "Пусть эти глупцы умирают в одиночку!"

 fogeater_invasion.4001.t:0 "Падение Серых врат"
 fogeater_invasion.4001.desc:0 "Серые врата пали.\n\nПо узким перевалам Серых гор вновь идут несметные армии, сметая наспех собранную оборону местных правителей и рьяных искателей приключений.\n\nСо времён древнего [Concept('sjalvolki_migration','Великого переселения сьялволков')|E] эти земли не видели такого кровопролития. Но если войско Ценвара стремилось спастись от наступающего [Concept('the_fog','Тумана')|E], то стрекочущая орда [fogeater_conqueror.GetFirstNamePossessive] окутана им. Словно саранча, она набрасывается на беззащитные деревни и селения, пожирая всё на своём пути. За ней туманы сгущаются, земля замирает, и даже солнечный свет становится слабым и безжизненным.\n\nИ всё же [Concept('fogeaters','пожиратели тумана')|E] продолжают наступление, и пока [Concept('the_continent','Континент')|E] пытается оправиться и подготовить ответ, страх проникает даже в самые стойкие души."
 fogeater_invasion.4001.a:0 "Их нужно остановить."

 fogeater_invasion.4002.t:0 "Падение Калатипсоми"
 fogeater_invasion.4002.desc:0 "Калатипсоми пала.\n\nЗа годы, прошедшие после падения Серых врат, бедствие [Concept('fogeaters','пожирателей тумана')|E] опустошило всю Калатипсоми, а в последние недели иссяк даже слабый поток уцелевших беженцев оттуда.\n\nМногочисленные часовые и разведчики на новых рубежах уже сообщают о тонкой дымке и гулких ветрах, которые окутывают безжизненные леса и несут призрачные обрывки далёких шёпотов и бормотания. Даже величественные секвойи [Concept('kalath_redwoods_biozone','Лаодантинских лесов')|E] начали скручиваться и оседать внутрь себя в [Concept('the_fog','Тумане')|E], изгибаясь, сминаясь и превращаясь в жгучие багровые волдыри среди бесцветного пейзажа.\n\nИ всё же натиск продолжается. [fogeater_conqueror.GetFirstName] вновь и вновь призывает племена Аэльхёэра идти вперёд, и они следуют за ним."
 fogeater_invasion.4002.a:0 "Их нужно остановить."

 fogeater_invasion.4003.t:0 "Падение Шевалье"
 fogeater_invasion.4003.desc:0 "[Concept('chevalie','Шевалье')|E] больше нет.\n\nКоролевство, которое отбило бесчисленные вторжения [Concept('liches','личей')|E] и пережило бесчисленные гражданские войны, задохнулось в неестественной тишине. Перед волной бедствия [Concept('fogeaters','пожирателей тумана')|E] не устояли даже закалённые рыцари и [Concept('antimagic_orders','антимагические ордена')|E], которыми славилась эта держава. Остались лишь страшные рассказы, принесённые редеющими вереницами беженцев.\n\nКорабли, которые ещё осмеливаются идти вдоль побережья, сообщают о пустых оболочках некогда процветавших городов, по каналам и улицам которых ползают искажённые силуэты. Одинокие замки возвышаются на скалах, и их знамёна треплет неестественный ветер. Даже природа не защищена от порчи [Concept('the_fog','Тумана')|E]: каждый лес словно зовёт проплывающих моряков войти и соединиться с искажёнными тварями, едва различимыми среди деревьев.\n\nНо пока что потоп, утопивший Шевалье, льётся дальше, и его разноголосица вторит каждому слову [fogeater_conqueror.GetFirstName]."
 fogeater_invasion.4003.a:0 "Неужели так погибнет мир?"

 fogeater_invasion.4004.t:0 "Падение Амагеи"
 fogeater_invasion.4004.desc:0 "Амагеи больше нет.\n\nЗнаменитые горные перевалы, выдержавшие столько вторжений, не смогли остановить орду [Concept('fogeaters','пожирателей тумана')|E]. Побережье Латунного моря уже переполнено беженцами, хотя в последние недели их поток, похоже, иссяк.\n\nС новых пограничных застав и разведывательных флотилий уже сообщают о густом [Concept('the_fog','Тумане')|E] над низинными полями и множестве странных существ, которые теперь бродят по ним. Сами горы, некогда священные для амагейцев, вероятно, навеки потеряны для смертных, но ходят слухи о странных огнях на вершинах, нависающих над опустевшим краем, словно могильные плиты.\n\nИ всё же Аэльхёэр уже идёт дальше, следуя неумолчному зову [fogeater_conqueror.GetFirstName]. Теперь Амагея служит обещанием, что после них не останется ничего."
 fogeater_invasion.4004.a:0 "Их нужно остановить."

 fogeater_invasion.4005.t:0 "Падение [asiupoli.GetNameNoTierNoTooltip]"
 fogeater_invasion.4005.desc:0 "[asiupoli.GetNameNoTier] умолк.\n\nНекоторые верили, что некогда сияющий город выдержит натиск, но бывшая столица Айроноя разделила судьбу многих других и превратилась в очередные безжизненные руины.\n\nЗолотая гавань, забитая обломками судов тех, кто пытался бежать от участи города, теперь совершенно пуста и словно приглашает путников войти в опустевшие улицы. Немногие искатели приключений, которые решились на это и выжили, рассказывают жуткие истории об ужасах под древними улицами и взглядах из каждого окна.\n\nИ всё же вторжение [Concept('fogeaters','пожирателей тумана')|E] не замедляется: огромное войско [fogeater_conqueror.GetFirstNamePossessive] прошло через величественный город, словно тот был лишь очередной ступенью. Куда ведёт их путь, неизвестно, но впереди, несомненно, лишь новые разрушения."
 fogeater_invasion.4005.a:0 "Их нужно остановить."

 fogeater_invasion.4006.t:0 "Падение Айроноя"
 fogeater_invasion.4006.desc:0 "Айроноя больше нет.\n\nОт Латунного моря до Красных земель, от Касирьята до Корвионского пролива царит лишь безмолвие [Concept('the_fog','Тумана')|E], нарушаемое только стрекотом пришедших вместе с ним [Concept('fogeaters','пожирателей тумана')|E].\n\nТам, где прежде стояли богатейшие города [Concept('aversaria','Аверсарии')|E], теперь лишь кладбища, по которым рыщут существа, чей ужас сравним только с трагедией их существования. Там, где прежде под бескрайним небом скакали ольтенские конные владыки, теперь безжизненные равнины задыхаются в объятиях Тумана. Быть может, лишь Красные земли остались узнаваемы для тех, кто помнит прежний Айроной: там по извилистым каньонам всё ещё бродят кошмары, рождённые самыми страшными снами человечества.\n\nНо даже этот пир не насытил Аэльхёэр, который, похоже, готов следовать за [fogeater_conqueror.GetFirstName] до самого края [Concept('aeras','Эраса')|E]."
 fogeater_invasion.4006.a:0 "Неужели так погибнет мир?"

 fogeater_invasion.5000.t:0 "Помощь защитникам Серых врат"
 fogeater_invasion.5000.desc:0 "Когда впервые пришли вести о жутких чудовищах из [Concept('the_fog','Тумана')|E], штурмующих могучие стены Серых врат, при дворе им не поверили. Но донесения не прекращаются, а чудовищ становится всё больше. Теперь защитники перевала просят о помощи. Они просят всё, что мы можем выделить, но кто поручится, что враги не воспользуются случаем и не ударят по нам?"
 fogeater_invasion.5000.a:0 "Мы отправим золото."
 fogeater_invasion.5000.b:0 "Мы отправим войско!"
 fogeater_invasion.5000.c:0 "Если подумать, они наверняка справятся сами."

 send_aid_to_migraddr_decision.t:0 "Отправить помощь защитникам Серых врат"
 send_aid_to_migraddr_decision_desc:0 "[Concept('the_fog','Туман')|E] пробуждается. Пришли вести о жутких чудовищах, которые выходят из туманного леса и нападают на Серые врата, и защитники просят помощи со всего севера."
 send_aid_to_migraddr_decision_confirm:0 "Помочь в борьбе"
 fogeater_invasion.5000.tt:0 "Мы отправим защитникам Серых врат [Concept('gold','золото')|E] или воинов."
 send_aid_to_migraddr_decision_tooltip:0 "Мы отправим защитникам Серых врат [Concept('gold','золото')|E] или воинов."


