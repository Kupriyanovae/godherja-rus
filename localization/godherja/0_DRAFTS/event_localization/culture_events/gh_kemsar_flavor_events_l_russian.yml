l_russian:
 become_king_of_the_sands_decision:0 "Объявить себя Тэссором"
 become_king_of_the_sands_decision_desc:0 "Сколько хватает моей памяти, мы всегда воевали в этих долинах. Такова была участь моих предков, их предков и всех, кто жил до них: сражаться и рыскать в поисках последней крупицы богатства, с трудом выживая в этой проклятой пустоши, где не бывает дождя, а иссохший песок пьёт кровь павших. Но довольно. Я захвачу богатые, влажные земли на севере, где вода течёт, словно соль, и создам империю, какой мир не видел тысячу лет."
 become_king_of_the_sands_decision_confirm:0 "Смерть всем, кто встанет у меня на пути!"
 become_king_of_the_sands_decision_tooltip:0 "Провозгласить себя императором."

 kemsar_flavor.0001.t:0 "Один царь, одно царство"
 kemsar_flavor.0001.desc:0 "В Кемсаре никто не сравнится со мной во власти. Поэтому я по праву объявляю себя императором и начинаю поход на север, чтобы завоевать его богатые земли. Все подвластные мне правители собрались посмотреть, как мою голову увенчает новый немес — немес Тэссора. Мой херме-хеб произносит надо мной традиционные благословения, которых, возможно, не слышали уже тысячу лет.\n\nДа будут мои армии непобедимы. Да звучит моё имя в вечности. Да будет моё правление бесконечным. Мне суждено возвыситься над миром, растоптать все прочие короны и переломить об колено слабые, изнеженные державы. Никто не посмеет противостоять мне."
 kemsar.0001.a:0 "Моя империя ждёт."