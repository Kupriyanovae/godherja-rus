l_russian:

 kherkeloi.0001.t: "Королевство [ertomax|E] восстановлено!"
 kherkeloi.0001.desc: "Со времён [ertomax|E] арувасуэнское солнце не сияло так ярко над землями верных. Моё имя стало символом возвращения народа к давно утраченному величию после того, как [aironoian_migration|E] изгнало нас с родной земли.\n\nЯ вернул своему народу его царство, и Десница Аруваса вновь хранит нас. Моё имя стало легендой, и теперь ни один [Concept('aversaria','аверсарианец')|E] или ольтенский варвар не отнимет у нас дом. В честь моего свершения залы гремят от песен, а мы с пляской, резнёй и пирами вновь шагаем по Айроною."
 kherkeloi.0001.a: "Я — величайшее дитя [ertomax|E]!" 
 kherkeloi.0001.b: "Земли Солнца знают меня как своего владыку!" 
 kherkeloi.0001.c: "Арувас даровал мне Свою милость!"
  
 kherkeloi.0002.t: "Королевство [ertomax|E] восстановлено?"
 kherkeloi.0002.desc: "Давно разобщённые и забытые земли арувасуэ теперь гремят от тысячи пиров. Появился наследник [ertomax|E], обещающий возродить древние обычаи Ариванн Вос.\n\nЕго намерения пока неясны, но многие опасаются, что вместе с древним царством вернутся и старые войны, терзавшие восток Айроноя вплоть до [Concept('bayyuralar','Байюралара')|E]. Мир ещё может сохраниться, однако никто не поручится, что однажды на трон вновь не взойдёт новый Эртомакс и не утопит Айроной в крови."
 kherkeloi.0002.a: "Неожиданное развитие событий."

 kherkeloi.0003.t: "Бронзовый рассвет"
 kherkeloi.0003.desc.intro: "Когда-то эти земли принадлежали нам. Когда-то могучая [Concept('astilik_empire','Астиликская империя')|E] стояла гордо и нерушимо, оберегая владения, которые боги по праву вверили её власти. Сегодня #EMP когда-то#! становится #EMP вновь#!.\n\nНаконец дело всей моей жизни завершено. "
 kherkeloi.0003.desc.both: "[aversaria|E] испускает последний предсмертный вздох, ольтенские варвары дрожат от страха, а наши заблудшие братья по [GetCulturePillar('heritage_kherkeloi').GetName] наконец возвращены в лоно империи. Никогда прежде [restorer.GetCulture.GetCollectiveNoun] не достигали такой вершины могущества и столь полной власти над северными и восточными землями."
 kherkeloi.0003.desc.north: "Северные земли прочно зажаты в имперской хватке, а всякое сопротивление нашему благому правлению беспощадно подавлено. Сердце державы процветает, и множество поселенцев отправляется восстанавливать владения предков."
 kherkeloi.0003.desc.east: "Закрепив власть над нашими заблудшими братьями по [GetCulturePillar('heritage_kherkeloi').GetName], мы вернём их в имперское лоно и окружим защитой и заботой под нашим благим руководством."
 kherkeloi.0003.desc.outro: "\n\nОшибки минувших времён больше не будут нас сдерживать. Я построю империю, которая простоит до конца времён."
 kherkeloi.0003.north.tt: "Все принадлежащие вам [Concept('counties','графства')|E] в [Concept('region','регионе')|E] [GetGeographicalRegion('custom_astilik_empire').GetName], не относящиеся к [Concept('heritage','наследию')|E] [GetCulturePillar('heritage_kherkeloi').GetName], получают [Concept('modifier','модификатор')|E] [GetModifier('restore_astilik_empire_culture_modifier').GetNameWithTooltip] на #V 10 лет#!"
 kherkeloi.0003.east.tt: "[Concept('culture','Культура')|E] [restorer.GetCulture.GetName] получает #V 100%#! [Concept('cultural_acceptance','культурного принятия')|E] со всеми другими [Concept('cultures','культурами')|E] наследия [GetCulturePillar('heritage_kherkeloi').GetName]"
 kherkeloi.0003.east.culture.tt: "Восстановление [GetTitleByKey('e_astilik_empire').GetNameNoTier]" 
 kherkeloi.0003.a: "[Glossary('Астиль Элатос','GH_ASTIL_ELATOS_GLOSS')]!"

 kherkeloi.0004.t: "$kherkeloi.0003$"
 kherkeloi.0004.desc: "Объединив земли древней [Concept('astilik_empire','Астиликской империи')|E], [founder.GetTitledFirstName] объявляет о чудесном возрождении давно погибшего айронойского государства. Равновесие сил в регионе разрушено и сменилось хаосом — кто знает, что принесёт будущее?"
 kherkeloi.0004.a: "[Glossary('Астиль Элатос','GH_ASTIL_ELATOS_GLOSS')]!" 
 kherkeloi.0004.b: "Зачем тревожить то, что так давно умерло?" 
 kherkeloi.0004.c: "Я и не знал, что [restorer.GetCulture.GetCollectiveNoun] занимаются некромантией." 
 kherkeloi.0004.d: "Значит, теперь у нас есть конкуренты?"

 kherkeloi.0005.t: "Рассвет, закат и вновь рассвет"
 kherkeloi.0005.desc: "Время сурово обошлось с Храмом Галита, Угасающими хранителями и их Гармониархией. Некогда господствующая сила — ослабленная и злым умыслом, и стечением обстоятельств — превратилась в руины и короткую строку в летописях.\n\nНо вопреки всему это был не конец. Их обитель восстановлена, и жрецы-врачи вновь расходятся по Морю империй, неся с собой знания и исцеление.\n\nРазумеется, как [patron.GetTitleAsNameNoTooltip] державы [patron.GetPrimaryTitle.GetNameNoTooltip] и щедрый покровитель храма я немало выиграю от их возвращения. В благодарность за поддержку жрецы прислали мне отряд отборной стражи во главе с умелым командиром [temple_envoy.GetFullName]. Теперь они в моём распоряжении."
 kherkeloi_0005_effect_mastery_tooltip: "[Concept('culture','Культура')|E] [patron.GetCulture.GetName] повышает уровень владения [Concept('magic_type','школой магии')|E] #V $wane_tender_harmoniarchy_name$#! на #V 1#!"
 kherkeloi_0005_effect_school_tooltip: "[Concept('culture','Культура')|E] [patron.GetCulture.GetName] принимает [Concept('magic_type','школу магии')|E] #V $wane_tender_harmoniarchy_name$#!"
 kherkeloi.0005.a: "Замечательно и очень полезно."

 kherkeloi.0006.t: "$kherkeloi.0005.t$"
 kherkeloi.0006.desc: "Время сурово обошлось с Храмом Галита, Угасающими хранителями и их Гармониархией. Некогда господствующая сила — ослабленная и злым умыслом, и стечением обстоятельств — превратилась в руины и короткую строку в летописях.\n\nНо вопреки всему это был не конец. Благодаря восстановлению обители и щедрой поддержке со стороны [patron.GetUIName] жрецы-врачи вновь расходятся по Морю империй, неся с собой знания и исцеление."
 kherkeloi.0006.a: "$kherkeloi.0005.a$"