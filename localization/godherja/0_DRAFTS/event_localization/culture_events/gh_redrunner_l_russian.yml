l_russian:
 gh_redrunner_events.0001.t:90 "Бегство придворного"
 gh_redrunner_events.0001.desc.intro:90 "Ко мне обращается [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('runaway'))]: ситуация уже не поддаётся [runaway.GetHerHis] контролю. [runaway.GetFirstName] просит разрешения покинуть мои владения, чтобы обезопасить себя и свою семью."
 gh_redrunner_events.0001.desc.thought:90 "Я понимаю желание оставить этот хаос позади, но могу ли я позволить [runaway.GetFirstName] бросить меня и державу именно сейчас?"
 gh_redrunner_events.0001.a:90 "Приструнить [runaway.GetFirstName]!"
 gh_redrunner_events.0001.b:90 "Отпустить [runaway.GetHerHis]."
 gh_redrunner_events.0001.c:90 "Напомнить [runaway.GetHerHim], кто здесь у руля!"
 gh_redrunner_events.0002.t:90 "Предложение офицера"
 gh_redrunner_events.0002.desc.intro:90 "[pleading_legon_officer.GetFullName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('pleading_legon_officer'))] при моём дворе, не отстаёт от меня во время обычной инспекции гарнизона. Наконец [pleading_legon_officer.GetHerHis] голос привлекает моё внимание, а [pleading_legon_officer.GetHerHis] беспокойный взгляд скользит по солдатам и укреплениям."
 gh_redrunner_events.0002.separator:90 "\n\n"
 gh_redrunner_events.0002.desc.body:90 "[pleading_legon_officer.GetFirstName] обычно ведёт себя вполне безобидно. «Не хочу ставить под сомнение ваше руководство, но наша армия знала лучшие времена. Предлагаю пополнить запасы и ряды за счёт местных деревень. Смиренно прошу вашего разрешения»."
 gh_redrunner_events.0002.desc.altbody:90 "[pleading_legon_officer.GetFirstName] и прежде не [Select_CString(pleading_legon_officer.IsFemale, 'отличалась', 'отличался')] честностью в своих намерениях. Теперь [pleading_legon_officer.GetHerHis] голос звучит тревожно: «Если позволите говорить прямо, наша армия пала и утратила былую славу! Молю вас, позвольте мне возглавить восстановление нашей прежней мощи!»"
 gh_redrunner_events.0002.desc.ending:90 "Стоит ли довериться [pleading_legon_officer.GetFirstName] и принять это предложение?"
 gh_redrunner_events.0002.a:90 "Верю, что это хорошая идея, [pleading_legon_officer.GetFirstNameNoTooltip]."
 gh_redrunner_events.0002.b:90 "Хочешь сделать хорошо — сделай сам."
 #gh_redrunner_events.0002.c:90 "Мир жесток и суров; [pleading_legon_officer.GetFirstName] должен это понимать."
 gh_redrunner_events.0002.d:90 "Благодарю за стратегический совет. Можешь идти."
 gh_redrunner_events.0002.e:90 "Ужасная идея, [pleading_legon_officer.GetFirstName]. Как ты [Select_CString(pleading_legon_officer.IsFemale, 'получила', 'получил')] этот пост, если у тебя вместо головы пустая яма?"


 #opinion modifiers
 redrunner_legon_decline:90 "Стратегический совет отклонён"
 redrunner_legon_decline_desc:90 "Вы отвергли [pleading_legon_officer.GetHerHis] совет."

 redrunner_legon_arrogant_decline:90 "Стратегический совет грубо отвергнут"
 redrunner_legon_arrogant_decline_desc:90 "Вы резко оборвали [pleading_legon_officer.GetHerHis] совет."

 redrunner_diligent_recruitment:90 "Добросовестный набор рекрутов"

 redrunner_failed_recruitment:90 "Бездарный набор рекрутов"

 

