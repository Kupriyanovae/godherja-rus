l_english:
 gh_olteni_events.0001.t:0 "Spoils of War"
 gh_olteni_events.0001.desc:0 "What a glorious day!\n\nThe ground is stained with the blood of my enemies, and my troops carve a violent path through the battlefield, $knight_culture_player_plural_no_tooltip_lowercase$ and soldiers alike falling before our onslaught.\n\nAt last, [dead_combatant.GetName] falls before me, the eyes behind [dead_combatant.GetHerHis] mask closing forever. My soldiers cheer as I remove the artifact and attach it to my belt, where it joins several others of my foe's slain men-at-arms."
 gh_olteni_events.0001.a:0 "[dead_combatant.GetSheHe|U] won't be needing this anymore."

 gh_olteni_events.0101.t: "A Wandering Elder"
 gh_olteni_events.0101.desc: "I have been informed that a wandering [Glossary('Tönnm Öngot','GH_TONNM_ONGOT_GLOSS')] was spotted travelling through my realm, bestowing blessings in villages and tending to the sick.\n\nAn appearance of one is rare, and it is customary to extend them an offer of hospitality in exchange for their wisdom.\n\nThat is, only if they appear at one's very doorstep..."
 gh_olteni_events.0101.a: "I shall welcome them in my [ROOT.Char.Custom('ResidenceBuilding')]."
 gh_olteni_events.0101.a.flavor: "Let my offer honor them, and they will surely honor me in return."
 gh_olteni_events.0101.a.tt: "You send out runners to tell the elder of your offer"
 gh_olteni_events.0101.b: "Nothing good will come out seeking them out."
 gh_olteni_events.0101.b.flavor: "What use could there possibly be in offering shelter to unknown vagrants?"

 gh_olteni_events.0102.t: "$gh_olteni_events.0101.t$: Mystic"
 gh_olteni_events.0102.desc.intro: ""I greet you, the [ROOT.Char.GetTitleAsNameNoTooltip] of the land, and I thank you for your hospitality." We link our arms in a formal greeting, [elder.GetHersHis] over mine.\n\n"A hospitality that, as is proper, I will repay in kind," [elder.GetSheHe] adds, bowing [elder.GetHerHis] head slightly.\n\n"
 gh_olteni_events.0102.desc: "$gh_olteni_events.0102.desc.intro$The [elder.GetWomanMan]'s appearance is odd, even for someone of an esoteric inclination. Dozens of small bells are sewn into [elder.GetHerHis] robes, accentuating each movement with soft melodic chimes.\n\n"My name is [elder.GetName], Your Highness, and I have made it my life's work to preserve the wisdom of our ancestors. It is this very wisdom that I offer to you, should you choose to accept it.""
 gh_olteni_events.0102.a: "Wonderful, we should exchange notes!"
 gh_olteni_events.0102.a.flavor: "I am somewhat of a [GetTrait('lifestyle_mystic').GetName(ROOT.Char)] myself, after all."
 gh_olteni_events.0102.b: "I am ready to learn."
 gh_olteni_events.0102.b.flavor: "I've always wanted to know how do mice spawn in dirty rags, and spiders appear out of nowhere."
 gh_olteni_events.0102.b.tt: "[elder.GetName] inducts you into sacrosanct Kolrgiian lore"
 gh_olteni_events.0102.c: "You will have my hospitality, but nothing more."
 gh_olteni_events.0102.c.flavor: "I have no desire to entertain charlatans for longer than tradition demands."

 gh_olteni_events.0103.t: "$gh_olteni_events.0101.t$: Scholar"
 gh_olteni_events.0103.desc: "$gh_olteni_events.0102.desc.intro$The [elder.GetWomanMan] did not come alone — a handful of servants, scribes, and apprentices accompany [elder.GetHerHim], carrying an impressive selection of books, scrolls, and strange apparatuses of presumably scientific origin.\n\n"My name is [elder.GetName], Your Highness, and I seek to unravel the mysteries of the natural world. Knowledge must be shared, not hoarded; I would be honored to share my discoveries with you.""
 gh_olteni_events.0103.a: "$gh_olteni_events.0102.a$"
 gh_olteni_events.0103.a.flavor: "I am somewhat of a [GetTrait('scholar').GetName(ROOT.Char)] myself, after all."
 gh_olteni_events.0103.b: "$gh_olteni_events.0102.b$"
 gh_olteni_events.0103.b.flavor: "$gh_olteni_events.0102.b.flavor$"
 gh_olteni_events.0103.b.tt: "The elder shares [elder.GetHerHis] knowledge before leaving"
 gh_olteni_events.0103.c: "You will have my hospitality, but nothing more."
 gh_olteni_events.0103.c.flavor: "$gh_olteni_events.0102.c.flavor$"

 gh_olteni_events.0104.t: "$gh_olteni_events.0101.t$: Vagrant"
 gh_olteni_events.0104.desc: ""[elder.GetSheHe|U]'s a con[elder.GetWomanMan], My [ROOT.Char.GetLadyLord|U]," [jailor.Custom2('MyCharacterIntroduction', ROOT.Char)] spits out with disdain.\n\n"We have tracked down the elder to extend your offer of hospitality, but found only this swindler instead. [elder.GetSheHe|U] was peddling swamp water as a medicinal remedy, and even had the audacity to try to sell us ground iron rust as if it was cinnabar powder."\n\nThe [elder.GetWomanMan] in chains flinches after every accusation in what appears to be a long list of [elder.GetHerHis] frauds, but remains silent."
 gh_olteni_events.0104.a: "#EMP Flay them.#!"
 gh_olteni_events.0104.a.flavor: "And here I was worried that I would run out of criminals..."
 gh_olteni_events.0104.b: "[elder.GetSheHe|U] will rot in the dungeon."
 gh_olteni_events.0104.b.flavor: "Who knows, maybe some time in the dark would set [elder.GetHerHim] straight."
 gh_olteni_events.0104.c: "Just throw this filth out."
 gh_olteni_events.0104.c.flavor: "And the realm will be better off for it."
 gh_olteni_events.0104.c.tt: "[elder.GetName] is banished under the threat of death"

 gh_olteni_events.0105.t: "$gh_olteni_events.0101.t$: Magi"
 gh_olteni_events.0105.desc: "$gh_olteni_events.0102.desc.intro$[elder.GetSheHe|U] is ancient, [elder.GetHerHis] touch more leather than skin, yet the grip on my hand is firm, and I can't miss the unnatural glow of [elder.GetHerHis] [elder.Custom('EyeEyes')] behind the mask.\n\n"My name is [elder.GetName], Your Highness, and I have taken to journeying on the eve of my days. Even just this world is vast, vaster than we can imagine, and abound with knowledge. It is this very knowledge that I offer to you, should you choose to accept it.""
 gh_olteni_events.0105.a: "You are welcome to stay for as long as you like."
 gh_olteni_events.0105.a.flavor: "What knowledge could they reveal, I wonder?"
 gh_olteni_events.0105.a.tt: "[elder.GetFirstName] will stay at your [court|E] for a while"
 gh_olteni_events.0105.b: "It would be my honor to host you for a night."
 gh_olteni_events.0105.b.flavor: "[elder.GetSheHe|U] unnerves me, but whatever I can get out from [elder.GetHerHim] is bound to be useful."
 gh_olteni_events.0105.b.tt: "$gh_olteni_events.0103.b.tt$"

 gh_olteni_events.0106.t: "$gh_olteni_events.0101.t$: Vanished"
 gh_olteni_events.0106.desc: "It has been a couple of weeks since I dispatched my agents to find the elusive elder who was spotted in my realm. Now, as they return one by one with empty hands, I am forced to face the futility of my efforts.\n\nIt seems that the wanderer's whereabouts, or even if they existed in the first place, will remain a mystery."
 gh_olteni_events.0106.tt: "The elder has vanished without a trace"
 gh_olteni_events.0106.a: "Disappointing."
 gh_olteni_events.0106.a.flavor: "Some guidance from one could have been useful."

 gh_olteni_events.0107.t: "$gh_olteni_events.0101.t$: Rejected"
 gh_olteni_events.0107.desc: "My runners return, not with the elder, but rather with a letter from them.\n\nIn it, the elder scathingly berates the quality of my character, admonishing me for the many ways, both real and perceived, I have fallen short of being a faithful [ROOT.Char.GetFaith.GetAdherentName] and should not expect a meeting with the likes of them any time soon."
 gh_olteni_events.0107.tt.piety: "The elder has rejected meeting you due to your low [piety_level|E]"
 gh_olteni_events.0107.tt.sinful: "The elder has rejected meeting you due to your [sinful|E] [traits|E]"
 gh_olteni_events.0107.a: "Disappointing."
 gh_olteni_events.0107.a.flavor: "A shameful display, to be sure."

 gh_olteni_events.0108.t: "$gh_olteni_events.0101.t$: Moving Forward"
 gh_olteni_events.0108.desc: ""I am glad that we've met, [ROOT.Char.GetFirstNameNoTooltip]," [elder.GetName] says with a deep sense of satisfaction in [elder.GetHerHis] voice.\n\n"You have been a most gracious host, but I'm afraid I must resume my travels," [elder.GetSheHe] adds, bowing [elder.GetHerHis] head. "Please accept these humble notes of mine as thanks for your hospitality, and then I will depart."\n\nThe woman hands me over two leathery scrolls with a weight to them that is not borne out of simple materials. The tradition bids you to part ways, which some part of you now finds a little shameful, having grown used to the deep discussions you shared."
 gh_olteni_events.0108.tt: "[elder.GetName] gifted you two [Concept('magic','Magical')|E] scrolls"
 gh_olteni_events.0108.a: "Thank you, and farewell."
 gh_olteni_events.0108.a.flavor: "Good things are not meant to last, lest they become but mundane."
 gh_olteni_events.0108.a.tt: "[elder.GetName] leaves"
 gh_olteni_events.0108.b: "Wait! Could you stay?"
 gh_olteni_events.0108.b.flavor: "Tradition be damned, we haven't finished discussing the ethics of voluntary spirit possession!"
 gh_olteni_events.0108.b.success: "You convince [elder.GetName] to stay"
 gh_olteni_events.0108.b.success.tt: "[elder.GetName] agrees to stay at your court"
 gh_olteni_events.0108.b.failure: "$gh_olteni_events.0108.a.tt$"
 gh_olteni_events.0108.b.failure.tt: "$gh_olteni_events.0108.a.tt$"