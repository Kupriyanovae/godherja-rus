l_russian:

 aversaria.0001.t:0 "Аверсария вновь едина!"
 aversaria.0001.desc:0 "После долгих лет хаоса и ужаса [Concept('aversaria','Аверсария')|E] вновь восстаёт во всём величии. Империя ещё не обрела прежних границ и, возможно, уже никогда не достигнет былого могущества, но я спас наш народ от неминуемой гибели. Даже [Concept('chaos_of_the_seventh_century','Хаос VII века')|E] не предвещал нам подобной участи. Моё имя войдёт в летописи рядом с именами величайших аверсарианцев всех времён.\n\nПо всей возрождённой империи мне воздвигли сотни статуй. Тысячи граждан складывают у их ног и на пьедесталах шлемы, подражая Стилто Катаротерас и желая мне удачи и победы. Теперь, когда невозможное свершилось, многие хотят узнать, какой титул я приму в память об этом событии. Отныне меня будут звать..."
 aversaria.0001.a:0 "Восстановителем мира."
 aversaria.0001.b:0 "Лишь Явленный бог мог совершить такое."
 aversaria.0001.c:0 "Они узнают во мне своего бога и повелителя."
 aversaria.0001.d:0 "Я — сам Чистейший во плоти."
 aversaria.0001.e:0 "Мстителем."
 aversaria.0001.f:0 "Богом пепла."
 aversaria.0001.g:0 "Возлюбленным Чистейшего."
 aversaria.0001.h:0 "Непобедимым солнцем."
 aversaria.0001.i:0 "Богом крови."
 aversaria.0001.j:0 "Трижды величайшим."
 aversaria.0001.k:0 "Освободителем."
 aversaria.0001.l:0 "Вестником глубин."
 aversaria.0001.m:0 "Святым."
 aversaria.0001.n:0 "Восстановителем мандата."
 aversaria.0001.o:0 "Укротителем варваров."
 aversaria.0001.p:0 "Освободителем ийросси."
 aversaria.0001.q:0 "Убийцей богов."
 aversaria.0001.r:0 "Распорядителем Аэрсодиакса."
 aversaria.0001.s:0 "Избранником богов."
  
 aversaria.0002.t:0 "Аверсария вновь едина!"
 aversaria.0002.desc:0 "Из хаоса почти непрерывной войны и безвластия впервые со времён [Concept('imperial_civil_war','Имперской гражданской войны')|E] возникает единая [Concept('aversaria','Аверсария')|E]. Она пережила [Concept('frodbrokna','Фродброкну')|E] и [Concept('sjalvolki_migration','Великое переселение сьялволков')|E], израненная и измученная, но не побеждённая. Пусть прежней славы ей уже не вернуть, возрождённая держава остаётся серьёзной угрозой для всех, кто живёт на руинах старой империи."
 aversaria.0002.a:0 "Интересное развитие событий."
 
 aversaria.0003.t:0 "Аверсария вновь едина!"
 aversaria.0003.desc:0 "Из хаоса почти непрерывной войны и безвластия впервые со времён [Concept('imperial_civil_war','Имперской гражданской войны')|E] возникает единая [Concept('aversaria','Аверсария')|E], а мои земли при переустройстве входят в её состав. Могущественные вельможи уверяют, что так будет лучше для державы, но при взгляде на меня не могут скрыть ухмылок. Что же теперь делать?"
 aversaria.0003.a:0 "Тревожные времена."

 aversaria.1101.t:0 "Последняя аавтократия"
 aversaria.1101.desc:0 "[Concept('aversaria','Аверсария')|E] лежит в руинах. Её древние города заполонили варвары и мертвецы, а обе столицы разделили их участь. Лишь в Крехежаде Аверсария уцелела. Пережив долгие годы безвластия и гражданской войны, мы выбрались из огня и теперь смотрим на новый мир.\n\nВ этом новом мире мы — последние аверсарианцы, единственные, кого не коснулась варварская порча. Отныне Аверсария будет править со Стеллиоса и сохранит на этих островах последнее государство человечества."
 aversaria.1101.a:0 "Да здравствует Аверсария!"


 aversaria.1110.t: "Конец — это новое начало"
 aversaria.1110.desc: "Годы после [Concept('imperial_civil_war','Имперской гражданской войны')|E] были суровыми. Наша империя лежит в руинах, а наши кровь и культура начали смешиваться с наследием соседей по [Concept('kasiryat_biozone','Каширяту')|E]. Среди народа разгорелся ожесточённый спор, и мне как правителю предстоит решить: будем ли мы цепляться за обломки [Glossary('Аавтократии','GH_AAUTOKRATA_GLOSS')] и хранить чистоту крови или отринем прошлое и примем новую судьбу?"
 aversaria.1110.a: "Пусть два народа станут едины под взором Чистейшего!"
 aversaria.1110.b: "Свет Чистейшего сияет только для нас!"
 aversaria.1110.a.tt: "Вы больше не сможете восстановить [GetTitleByKey('e_aversarinas_aautokrata').GetNameNoTier]"
 aversaria.1110.b.tt: "Вы по-прежнему сможете восстановить [GetTitleByKey('e_aversarinas_aautokrata').GetNameNoTier]"

 aversaria.2001.t: "Gazing at the Eastern Border"
 aversaria.2001.desc: "I have done it—just as the great Aautokratirs of old, I have raised the banner of [aversaria|E] high beneath the alien skies, bathing newfound lands in the radiant light of the Purest. Our enemies may decry that my conquest has brought nothing but death and ruin—let them rail all they wish! \n\nEven if they hurl the foulest curses upon us, even as they gnash their teeth and beat their breasts in the shadows, the iron hooves of Aversaria shall not falter for a single heartbeat. We will shatter their spines, slit their throats, and wrench their lands and riches from their grasp. For to conquer the world—that is our manifest destiny, a sacred and unbreakable fate coursing through the very blood of Aversaria."
 aversaria.2001.a: "The conquest is far from over."