l_russian:

 aversaria.0001.t: "Аверсария вновь едина!"
 aversaria.0001.desc: "После долгих лет хаоса и ужаса [Concept('aversaria','Аверсария')|E] вновь восстаёт во всём величии. Империя ещё не обрела прежних границ и, возможно, уже никогда не достигнет былого могущества, но я спас наш народ от неминуемой гибели. Даже [Concept('chaos_of_the_seventh_century','Хаос VII века')|E] не предвещал нам подобной участи. Моё имя войдёт в летописи рядом с именами величайших аверсарианцев всех времён.\n\nПо всей возрождённой империи мне воздвигли сотни статуй. Тысячи граждан складывают у их ног и на пьедесталах шлемы, подражая Стилто Катаротерас и желая мне удачи и победы. Теперь, когда невозможное свершилось, многие хотят узнать, какой титул я приму в память об этом событии. Отныне меня будут звать..."
 aversaria.0001.a: "Восстановителем мира."
 aversaria.0001.b: "Лишь Явленный бог мог совершить такое."
 aversaria.0001.c: "Они узнают во мне своего бога и повелителя."
 aversaria.0001.d: "Я — сам Чистейший во плоти."
 aversaria.0001.e: "Мстителем."
 aversaria.0001.f: "Богом пепла."
 aversaria.0001.g: "Возлюбленным Чистейшего."
 aversaria.0001.h: "Непобедимым солнцем."
 aversaria.0001.i: "Богом крови."
 aversaria.0001.j: "Трижды величайшим."
 aversaria.0001.k: "Освободителем."
 aversaria.0001.l: "Вестником глубин."
 aversaria.0001.m: "Святым."
 aversaria.0001.n: "Восстановителем мандата."
 aversaria.0001.o: "Укротителем варваров."
 aversaria.0001.p: "Освободителем ийросси."
 aversaria.0001.q: "Убийцей богов."
 aversaria.0001.r: "Распорядителем Аэрсодиакса."
 aversaria.0001.s: "Избранником богов."
  
 aversaria.0002.t: "Аверсария вновь едина!"
 aversaria.0002.desc: "Из хаоса почти непрерывной войны и безвластия впервые со времён [Concept('imperial_civil_war','Имперской гражданской войны')|E] возникает единая [Concept('aversaria','Аверсария')|E]. Она пережила [Concept('frodbrokna','Фродброкну')|E] и [Concept('sjalvolki_migration','Великое переселение сьялволков')|E], израненная и измученная, но не побеждённая. Пусть прежней славы ей уже не вернуть, возрождённая держава остаётся серьёзной угрозой для всех, кто живёт на руинах старой империи."
 aversaria.0002.a: "Интересное развитие событий."
 
 aversaria.0003.t: "Аверсария вновь едина!"
 aversaria.0003.desc: "Из хаоса почти непрерывной войны и безвластия впервые со времён [Concept('imperial_civil_war','Имперской гражданской войны')|E] возникает единая [Concept('aversaria','Аверсария')|E], а мои земли при переустройстве входят в её состав. Могущественные вельможи уверяют, что так будет лучше для державы, но при взгляде на меня не могут скрыть ухмылок. Что же теперь делать?"
 aversaria.0003.a: "Тревожные времена."

 aversaria.1101.t: "Последняя аавтократия"
 aversaria.1101.desc: "[Concept('aversaria','Аверсария')|E] лежит в руинах. Её древние города заполонили варвары и мертвецы, а обе столицы разделили их участь. Лишь в Крехежаде Аверсария уцелела. Пережив долгие годы безвластия и гражданской войны, мы выбрались из огня и теперь смотрим на новый мир.\n\nВ этом новом мире мы — последние аверсарианцы, единственные, кого не коснулась варварская порча. Отныне Аверсария будет править со Стеллиоса и сохранит на этих островах последнее государство человечества."
 aversaria.1101.a: "Да здравствует Аверсария!"


 aversaria.1110.t: "Конец — это новое начало"
 aversaria.1110.desc: "Годы после [Concept('imperial_civil_war','Имперской гражданской войны')|E] были суровыми. Наша империя лежит в руинах, а наши кровь и культура начали смешиваться с наследием соседей по [Concept('kasiryat_biozone','Каширияту')|E]. Среди народа разгорелся ожесточённый спор, и мне как правителю предстоит решить: будем ли мы цепляться за обломки [Glossary('Аавтократии','GH_AAUTOKRATA_GLOSS')] и хранить чистоту крови или отринем прошлое и примем новую судьбу?"
 aversaria.1110.a: "Пусть два народа станут едины под взором Чистейшего!"
 aversaria.1110.b: "Свет Чистейшего сияет только для нас!"
 aversaria.1110.a.tt: "Вы больше не сможете восстановить [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]"
 aversaria.1110.b.tt: "Вы по-прежнему сможете восстановить [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]"

 aversaria.2001.t: "Взгляд на восточный рубеж"
 aversaria.2001.desc: "Свершилось! Подобно великим аавтократам древности, я высоко несу знамя [Concept('aversaria','Аверсарии')|E] под чужими небесами, озаряя новообретённые земли сияющим светом Чистейшего. Наши враги могут вопить, что моё завоевание принесло лишь смерть и разорение, — пусть негодуют сколько угодно!\n\nПусть они осыпают нас самыми мерзкими проклятиями, скрежещут зубами и бьют себя в грудь во тьме — железная поступь Аверсарии не замедлится ни на миг. Мы сломаем им хребты, перережем глотки и вырвем из их рук земли и богатства. Ибо покорение мира — наше предназначение, священный и нерушимый рок, текущий в самой крови Аверсарии."
 aversaria.2001.a: "Завоевание ещё далеко не завершено."