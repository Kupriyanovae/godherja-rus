l_russian:
 
 damota.0001.t:0 "[Concept('boqqarut_damotada','Боккарут Дамотада')|E] восстановлен"
 damota.0001.desc:0 "Впервые со времён [Concept('etami_tetenik','смерти Кайовы')|E] [Select_CString(ROOT.Char.IsFemale, 'единая правительница властвует', 'единый правитель властвует')] над всей Дамотой — от глубочайших джунглей до горных врат. [Concept('boqqarut_damotada','Боккарут')|E] вновь восстаёт во всём великолепии, и народ огромной державы хором произносит моё имя.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'совершила', 'совершил')] невозможное: вновь [Select_CString(ROOT.Char.IsFemale, 'воплотила', 'воплотил')] мечту Эшво и [Select_CString(ROOT.Char.IsFemale, 'возродила', 'возродил')] сильное государство из хаоса и власти военачальников, так долго державших его в плену. Отныне Боккарут Дамотада будет стоять вечно, а моё имя навсегда останется среди имён великих предков как имя [Select_CString(ROOT.Char.IsFemale, 'восстановительницы', 'восстановителя')] нашего законного наследия."
 damota.0001.a:0 "Дамота больше никогда не падёт!"
 
 damota.0002.t:0 "Воссоединение Дамоты"
 damota.0002.desc:0 "Джунгли Дамоты, разделённые между множеством враждующих государств со времён [Concept('etami_tetenik','Этами Тетеник')|E] 861 года И.С., вновь объединены под властью одного правителя. Из некогда павшей столицы Захали новый боккар объявляет, что [boqqarut_damotada|E] снова един и его подданные вернут утраченную славу.\n\nПоследствия этого события могут быть огромны: дамотанцы вновь способны установить монополию на дороге Гонан. Некоторые даже рассуждают о возможном вторжении в Саррадон, хотя большинство полагает, что новый Боккарут продолжит мирную политику предшественников."
 damota.0002.a:0 "Джунгли пробуждаются."
 
 damota.0101.t:0 "Злоупотребления каравуукса"
 damota.0101.desc:0 "Похоже, [Concept('karavuux_capital','каравууксы')|E] из [karavuux_event_county.GetNameNoTier] слишком увлеклись своим господствующим положением. Грабительские цены даже на товары первой необходимости, требования «дани» от местных лавочников и принуждение людей к разорительным договорам стали обычным делом.\n\nКаравууксы всегда... охотно пользовались своими привилегиями, но здесь даже по их меркам перешли все границы. Я стою над ними и [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] вмешаться, чтобы их обуздать. Или можно позволить их власти расти и закрыть глаза на бедствия моего народа."
 damota.0101.a:0 "Это не моя забота."
 damota.0101.b:0 "Обуздать их!"
 damota.0101.c:0 "Наказать виновных!"
 damota.0101.d:0 "Мне тоже причитается доля!"
 damota.0101.e:0 "Объяснить им, что так продолжаться не может."
 
 damota.0111.t:0 "Жадная щедрость"
 damota.0111.desc:0 "Вероятно, рассчитывая на долгосрочную выгоду, несколько [Concept('karavuux_capital','каравууксов')|E] пожертвовали значительные суммы на предприятия и проекты в моих владениях. Народ встречает эту щедрость с восторгом, но она может подорвать мою власть, поэтому придётся сделать выбор. Я могу изъять средства, хотя подданным это не понравится, или позволить пожертвованиям идти своим чередом. Можно и самому вложить деньги, чтобы часть народной благодарности досталась мне."
 damota.0111.a:0 "У меня есть более выгодное применение этим деньгам."
 damota.0111.b:0 "Пусть каравууксы помогают народу."
 damota.0111.c:0 "Разумные вложения — хорошая мысль."
 
 damota.0121.t:0 "Навязчивый набор"
 damota.0121.desc:0 "Недавние кампании по набору, устроенные [Concept('waranuux_capital','варанууксами')|E] в моих владениях, привели к тому, что множество земледельцев посвятили себя воинскому искусству. Дополнительные бойцы могли бы пригодиться, но происходящее подрывает мою власть и сокращает облагаемый налогом доход тех, кто вступил в их ряды. Запрет вербовки вызовет недовольство, однако может оказаться необходимым ради сохранения моей власти и казны."
 damota.0121.a:0 "Как земледельцы они полезнее."
 damota.0121.b:0 "Они могут делать все, что захотят."
 damota.0121.c:0 "Пресечь это. Они забыли своё место."
 
 damota.0131.t:0 "Стычки варанууксов"
 damota.0131.desc:0 "Два [Concept('waranuux_capital','варануукса')|E] в моих владениях затеяли череду стычек из-за земли. Обычно подобное терпят, но распря всё же угрожает моей власти в этом краю, и её можно пресечь. С другой стороны, если подтолкнуть противников к более ожесточённой борьбе, они измотают друг друга, что сыграет мне на руку. Можно и просто не вмешиваться, хотя тогда победители наверняка станут сильнее."
 damota.0131.a:0 "Пусть они сражаются."
 damota.0131.b:0 "Успокой их."
 damota.0131.c:0 "Разделяй и властвуй — подстегнуть их."
 
 damota.0141.t:0 "Раскол кабуукса"
 damota.0141.desc:0 "Влиятельный местный [Concept('qabuux_capital','кабуукс')|E] раскалывается: внутренняя вражда переросла в открытую политическую борьбу. Подобные распады не редкость, но именно этот грозит перевернуть местный уклад и вызвать смуту, которая повредит моей репутации. Если примирить стороны, я рискую укрепить соперника в борьбе за власть, хотя жители края наверняка будут довольны. Позволить кабууксу развалиться может быть выгодно, но моё бездействие сочтут некомпетентностью. Решение, как всегда, за мной."
 damota.0141.a:0 "Попытаться примирить стороны."
 damota.0141.b:0 "Договориться о мирном разделе."
 damota.0141.c:0 "Пусть разваливаются."
 
 damota.0151.t:0 "Земельный вопрос"
 damota.0151.desc:0 "Набирающий силу [Concept('qabuux_capital','кабуукс')|E] в моих владениях стремится захватить новые земли и с помощью влияния на местную торговлю вынудить соседей уступить. Обычно столь мелкие распри не заслуживают моего внимания, но без вмешательства спор едва ли разрешится, и советники требуют принять меры. Кабуукс обещает некоторое время платить повышенные налоги, если я поддержу его, однако дальнейшее усиление этой общины может оказаться слишком опасным. Вместо этого можно добиться компромисса или попытаться сдержать кабуукс, хотя последнее наверняка его разгневает."
 damota.0151.a:0 "Взять взятку."
 damota.0151.b:0 "Добиться компромисса."
 damota.0151.c:0 "Сдержать кабуукс."
 
 damota.0161.t:0 "Великий поиск"
 damota.0161.desc:0 "Местный [Concept('rayakuux_capital','раякуукс')|E] решил оплатить большую исследовательскую экспедицию по моим землям и направляет сюда множество своих членов. По обычаю такие поиски дадут ложе значительную власть в крае: числом и богатством путешественники смогут подавить местную администрацию. Однако экспедиция принесёт региону и немалую пользу. Приток людей и денег способен оживить хозяйство и ускорить развитие, перевесив краткосрочные потери. Я могу даже поддержать раякуукс собственной казной, что повысит мою популярность и увеличит пользу от его присутствия."
 damota.0161.a:0 "Поддержать экспедицию."
 damota.0161.b:0 "Пусть отправляются в путь."
 damota.0161.c:0 "Запретить поиски."
 
 damota.0171.t:0 "Бандиты с большака"
 damota.0171.desc:0 "Несколько членов местного [Concept('rayakuux_capital','раякуукса')|E] недавно стали жертвами грабителей во время обычных странствий. Руководство ложи официально просит меня о помощи, ведь разбойники нападают на моих подданных. Можно учредить дорожные патрули: это укрепит мою власть и улучшит отношение народа, но потребует расходов. Раякуукс предлагает плату за охрану только своих членов; я могу согласиться, хотя так его влияние в крае усилится. Если же я хочу ослабить ложу, достаточно позволить преступникам продолжать работу за меня."
 damota.0171.a:0 "Патрулировать дороги."
 damota.0171.b:0 "Принять их предложение."
 damota.0171.c:0 "Пусть воры с ними разберутся."