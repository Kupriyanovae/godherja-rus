l_russian:
 gh_izikalek_events.0002.t: "Опрокинутый камень"
 gh_izikalek_events.0002.desc: "До меня доходят тревожные вести из [desecrated_barony.GetName]: отряд налётчиков под командованием [raider.GetTitledFirstName] совершил опустошительный набег на поселение, разорил окрестности и предал постройки огню.\n\nНе удовольствовавшись сожжением деревни, воины [raider.GetHerHis] потратили немало времени и сил, чтобы повалить небольшой скотовик, вокруг которого было возведено поселение, разбить его и изуродовать обломки. Не знаю, что двигало ими: религиозное рвение, гнев из-за того, что жители едва успели скрыться в окрестностях, или чистая злоба. Нам же остаётся собрать осколки и всё восстановить — как мы поступали всегда."
 gh_izikalek_events.0002.a: "Помочь им всё восстановить."
 gh_izikalek_events.0002.b: "Сейчас я не могу выделить им помощь."
 gh_izikalek_events.0002.c: "[raider.GetTitledFirstNameNoTooltip] заслуживает #EMP СМЕРТИ!#!" 
 gh_izikalek_events.0002.c.tt: "$diplomacy_family.2250.b.tt$"

 gh_izikalek_events.0003.t: "[reformer.GetFaith.GetAdjectiveNoTooltip] жречество восстановлено"
 gh_izikalek_events.0003.desc: "Когда-то вера [reformer.GetFaith.GetAdjective] была куда сильнее, чем сегодня. Она жила не только в тайных обрядах разрозненных общин и простых благословениях, произносимых шёпотом, но и в великих празднествах, где радостно собирались преданные почитатели Налмы.\n\nПусть те дни давно миновали и память о них омрачена, прошлое не обязано определять настоящее. [priesthood.GetName] восстановлено, а руководить им отныне будет [new_religious_head.GetTitledFirstName]. Возможно, нашим бедам наконец приходит конец."
 gh_izikalek_events_0003_tt: "Восстановлено: [priesthood.GetName]"
 gh_izikalek_events.0003.a: "Наши традиции неизменны — как и прежде."
 gh_izikalek_events.0003.b: "Многое изменилось, но мы помним, кто мы."
 gh_izikalek_events.0003.c: "Пусть священные обряды приведут нас в объятия $nalmavast_high_god_name_possessive$."
 gh_izikalek_events.0003.d: "Слабость была нашим грехом. Этому больше не бывать."

 gh_izikalek_events.0004.t: "$gh_izikalek_events.0003.t$"
 gh_izikalek_events.0004.desc: "Внезапно [reformer.GetFullName] [Select_CString(reformer.IsFemale, 'восстановила', 'восстановил')] давно уничтоженное жречество веры [reformer.GetFaith.GetAdjective], и теперь во главе возрождённой организации [priesthood.GetName] стоит [new_religious_head.GetFullName]."
 gh_izikalek_events.0004.desc.tradition: "Среди верующих по-прежнему сильны старые традиции, и в честь этого знаменательного события объявлены великие празднества."
 gh_izikalek_events.0004.desc.pluralist: "Похоже, реформированная вера вобрала в себя множество чужеземных понятий и идей других культур и религий, став ещё более открытой и гостеприимной к чужакам."
 gh_izikalek_events.0004.desc.righteous: "В признанное вероучение вошли многие малоизвестные и глубоко духовные обряды, которые отныне будут владеть умами и сердцами верующих."
 gh_izikalek_events.0004.desc.fundamentalist: "Неожиданно вероучение реформированной религии стало подчёркивать важность действий и честолюбивых устремлений, ставя их выше духовных вопросов."
 gh_izikalek_events.0004.a: "Какое радостное событие!"
 gh_izikalek_events.0004.b: "Ещё больше жрецов? Серьёзно?"
 gh_izikalek_events.0004.c: "Что ж, рад за них."