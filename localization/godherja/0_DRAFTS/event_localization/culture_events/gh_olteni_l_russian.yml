l_russian:
 gh_olteni_events.0001.t:0 "Трофеи войны"
 gh_olteni_events.0001.desc:0 "Какой славный день!\n\nЗемля окрашена кровью моих врагов, а мои войска прокладывают кровавую тропу по полю битвы, круша $knight_culture_player_plural_no_tooltip_lowercase$ и солдат.\n\nНаконец, [dead_combatant.GetName] падает передо мной, а глаза за [dead_combatant.GetHerHis] маской закрываются навеки. Солдаты ликуют, когда я снимаю артефакт и креплю его к поясу, рядом с другими трофеями с павших воинов врага."
 gh_olteni_events.0001.a:0 "[dead_combatant.GetSheHe|U] больше не понадобится это."
 gh_olteni_events.0001.a:0 "[dead_combatant.GetSheHe|U] это больше не понадобится."

 gh_olteni_events.0101.t:0 "Странствующий старейшина"
 gh_olteni_events.0101.desc:0 "Мне сообщают, что в моих землях видели странствующего ольтенского старейшину — #EMP Тённм Энгот#!. Мудрец благословляет деревни и ухаживает за больными.\n\nТакие люди встречаются редко, и обычай велит предложить им гостеприимство в обмен на мудрость.\n\nНо только если старейшина сам окажется у моего порога..."
 gh_olteni_events.0101.a:0 "Я приму старейшину в своём [ROOT.Char.Custom('ResidenceBuilding')]."
 gh_olteni_events.0101.a.tt:0 "Вы посылаете гонцов с приглашением старейшине"
 gh_olteni_events.0101.b:0 "Ничего хорошего из этого не выйдет."

 gh_olteni_events.0102.t:0 "$gh_olteni_events.0101.t$: Мистик"
 gh_olteni_events.0102.desc:0 "«Приветствую вас, [ROOT.Char.GetTitleAsNameNoTooltip] этих земель, и благодарю за гостеприимство». Мы сцепляем руки в церемониальном приветствии, [elder.GetHersHis] поверх моей.\n\n«За гостеприимство, как и положено, я отплачу тем же», — добавляет [elder.GetSheHe], слегка склоняя [elder.GetHerHis] голову.\n\nВнешность [elder.GetWomanMan|l] необычна даже для человека, склонного к эзотерике. В [elder.GetHerHis] одеяние вшиты десятки колокольчиков, и каждое движение сопровождает тихий мелодичный звон.\n\n«Меня зовут [elder.GetName], ваше высочество. Я посвятил[Select_CString(elder.IsFemale, 'а', '')] жизнь сохранению мудрости наших колргийских предков. Эту мудрость я и предлагаю вам, если вы решите её принять»."
 gh_olteni_events.0102.a:0 "Прекрасно, нам #EMP стоит#! обменяться знаниями!" 
 gh_olteni_events.0102.b:0 "Я готов[Select_CString(ROOT.Char.IsFemale, 'а', '')] учиться." 
 gh_olteni_events.0102.b.tt:0 "[elder.GetName] посвящает вас в сакральные знания колргийцев" 
 gh_olteni_events.0102.c:0 "Вас ждёт моё гостеприимство, но не более."

 gh_olteni_events.0103.t:0 "$gh_olteni_events.0101.t$: Учёный"
 gh_olteni_events.0103.desc:0 "«Приветствую вас, [ROOT.Char.GetTitleAsNameNoTooltip] этих земель, и благодарю за гостеприимство». Мы сцепляем руки в церемониальном приветствии, [elder.GetHersHis] поверх моей.\n\n«За гостеприимство, как и положено, я отплачу тем же», — добавляет [elder.GetSheHe], слегка склоняя [elder.GetHerHis] голову.\n\n[elder.GetWomanMan|U] прибыл[Select_CString(elder.IsFemale, 'а', '')] не один: [elder.GetHerHim] сопровождают несколько слуг, писцов и учеников с внушительным собранием книг, свитков и странных приборов, по всей видимости научных.\n\n«Меня зовут [elder.GetName], ваше высочество. Я стремлюсь раскрыть тайны природы. Знаниями нужно делиться, а не прятать их; для меня будет честью рассказать вам о своих открытиях»."
 gh_olteni_events.0103.a:0 "Прекрасно, нам #EMP стоит#! обменяться знаниями!" 
 gh_olteni_events.0103.b:0 "Я готов[Select_CString(ROOT.Char.IsFemale, 'а', '')] учиться." 
 gh_olteni_events.0103.b.tt:0 "[elder.GetName] делится с вами своими знаниями" 
 gh_olteni_events.0103.c:0 "Вас ждёт моё гостеприимство, но не более."

 gh_olteni_events.0104.t:0 "$gh_olteni_events.0101.t$: Бродяга"
 gh_olteni_events.0104.desc:0 "«[elder.GetSheHe|U] — мошенни[Select_CString(elder.IsFemale, 'ца', 'к')], [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой')] [ROOT.Char.GetLadyLord|U]», — с презрением бросает [jailor.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n«Мы разыскали старейшину, чтобы передать приглашение, но вместо почтенного мудреца нашли эту лживую особу. [elder.GetSheHe|U] торговал[Select_CString(elder.IsFemale, 'а', '')] полной чушью под видом лекарств и даже попытал[Select_CString(elder.IsFemale, 'ась', 'ся')] продать нам молотую железную ржавчину как порошок киновари».\n\n[elder.GetWomanMan|U] в цепях вздрагивает после каждого обвинения из длинного списка [elder.GetHerHis] обманов, но хранит молчание."
 gh_olteni_events.0104.a:0 "#EMP Содрать с [elder.GetHerHim] кожу.#!"
 gh_olteni_events.0104.b:0 "[elder.GetSheHe|U] сгниёт в темнице." 
 gh_olteni_events.0104.b.tt:0 "[elder.GetName] делится с вами своими знаниями" 
 gh_olteni_events.0104.c:0 "Просто вышвырнуть эту дрянь."
 gh_olteni_events.0104.c.tt:0 "[elder.GetName] изгоняется под страхом смерти"

 gh_olteni_events.0105.t:0 "$gh_olteni_events.0101.t$: Маг"
 gh_olteni_events.0105.desc:0 "«Приветствую вас, [ROOT.Char.GetTitleAsNameNoTooltip] этих земель, и благодарю за гостеприимство». Мы сцепляем руки в церемониальном приветствии, [elder.GetHersHis] поверх моей.\n\n«За гостеприимство, как и положено, я отплачу тем же», — добавляет [elder.GetSheHe], слегка склоняя [elder.GetHerHis] голову.\n\n[elder.GetSheHe|U] невероятно стар[Select_CString(elder.IsFemale, 'а', '')]: кожа [elder.GetHerHis] руки на ощупь больше напоминает дублёную кожу, чем живую плоть. И всё же рукопожатие крепко, а за маской неестественно сияют [elder.GetHerHis] [elder.Custom('EyeEyes')].\n\n«Меня зовут [elder.GetName], ваше высочество. На склоне лет я отправил[Select_CString(elder.IsFemale, 'ась', 'ся')] в странствия. Даже один наш мир огромен — больше, чем мы способны представить, — и полон знаний. Этими знаниями я и предлагаю поделиться, если вы пожелаете их принять»."
 gh_olteni_events.0105.a:0 "С благодарностью принимаю." 
 gh_olteni_events.0105.a.tt:0 "Вы начинаете [Concept('scheme','замысел')|E] #L «Изучить заклинание»#! против [elder.GetShortUIName], чтобы освоить заклинание #L «Осквернённый надир»#!"
 gh_olteni_events.0105.b:0 "Вас ждёт моё гостеприимство, но не более."

 gh_olteni_events.0106.t:0 "$gh_olteni_events.0101.t$: Исчезновение"
 gh_olteni_events.0106.desc:0 "Прошло уже несколько недель с тех пор, как я отправил своих людей на поиски неуловимого старейшины, замеченного в моих владениях. Теперь, когда они один за другим возвращаются с пустыми руками, мне остаётся лишь признать тщетность своих усилий.\n\nПохоже, местонахождение странника, если он вообще существовал, так и останется загадкой."
 gh_olteni_events.0106.a:0 "Какое разочарование." 
 gh_olteni_events.0106.tt:0 "Старейшина исчез бесследно"

 gh_olteni_events.0107.t:0 "$gh_olteni_events.0101.t$: Отказ"
 gh_olteni_events.0107.desc:0 "Мои гонцы возвращаются не со старейшиной, а с письмом.\n\nВ нём мудрец язвительно разбирает мой характер и перечисляет множество способов — как реальных, так и вымышленных, — которыми я не соответствую званию верного [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]. Встречи в ближайшее время мне ждать не стоит."
 gh_olteni_events.0107.a:0 "Какое разочарование." 
 gh_olteni_events.0107.tt.piety:0 "Старейшина отказался встречаться с вами из-за вашего [Concept('piety_level', 'уровня благочестия')|E]" 
 gh_olteni_events.0107.tt.sinful:0 "Старейшина отказался встречаться с вами из-за ваших [Concept('sinful', 'греховных')|E] [Concept('traits', 'черт')|E]"

 gh_olteni_events.0108.t:0 "Движемся вперёд"
 gh_olteni_events.0108.desc:0 "«Я рад[Select_CString(elder.IsFemale, 'а', '')], что вы приняли мои уроки близко к сердцу, [ROOT.Char.GetTitledFirstNameNoTooltip]», — говорит [elder.GetName], и в [elder.GetHerHis] голосе слышится глубокое удовлетворение.\n\n«Теперь, когда я отплатил[Select_CString(elder.IsFemale, 'а', '')] вам за ваше гостеприимство, мне пора продолжить свои странствия», — добавляет [elder.GetSheHe], склоняя [elder.GetHerHis] голову. Ритуал, которому [elder.GetSheHe] меня обучил[Select_CString(elder.IsFemale, 'а', '')], может принести огромную пользу, но не могу не признать, что мне полюбились общество и наставления [elder.GetNamePossessiveNoTooltip], хоть традиция и велит нам расстаться навсегда."
 gh_olteni_events.0108.a:0 "Благодарю вас и прощайте." 
 gh_olteni_events.0108.a.tt:0 "[elder.GetName] уходит" 
 gh_olteni_events.0108.b:0 "Погодите! Может, вы останетесь?" 
 gh_olteni_events.0108.b.success:0 "Вам удалось убедить [elder.GetName] остаться" 
 gh_olteni_events.0108.b.success.tt:0 "[elder.GetName] соглашается остаться при вашем дворе" 
 gh_olteni_events.0108.b.failure:0 "$gh_olteni_events.0108.a.tt$" 
 gh_olteni_events.0108.b.failure.tt:0 "$gh_olteni_events.0108.a.tt$"

 gh_olteni_events.0109.t:0 "Смертность и знание"
 gh_olteni_events.0109.desc:0 "Со скоропостижной смертью [elder.GetNamePossessive] мои занятия подошли к концу. К сожалению, это значит, что мне по-прежнему недостаёт нескольких важных частей [Concept('ritual', 'ритуала')|E], которому [elder.GetSheHe] меня обучал[Select_CString(elder.IsFemale, 'а', '')], — а значит, даже то, что мне известно, совершенно бесполезно.\n\nБез каких-либо записей или гримуаров дальнейший прогресс кажется невозможным."
 gh_olteni_events.0109.a:0 "Найду ли я когда-нибудь ответы, что ищу?" 
 gh_olteni_events.0109.a.tt:0 "[elder.GetName] умер[Select_CString(elder.IsFemale, 'ла', '')]"

 gh_olteni_events.0110.t:0 "Пустые попытки"
 gh_olteni_events.0110.desc:0 "Несмотря на все мои старания, подробности [Concept('ritual','ритуала')|E], которому меня обучает [elder.GetName], по-прежнему ускользают от понимания. Недели сменяются месяцами, и наконец [elder.GetWomanMan|l] теряет терпение.\n\nОднажды старейшина просто выходит через главные ворота, и ни стража, ни рыцари не решаются остановить [elder.GetHerHim]. Без [elder.GetHerHis] наставлений я остаюсь в растерянности, и дальнейший успех в изучении заклинания кажется почти невозможным."
 gh_olteni_events.0110.a:0 "Разве моих стараний было мало?" 
 gh_olteni_events.0110.a.tt:0 "[elder.GetName] уходит"