l_russian:
 gh_olteni_events.0001.t:0 "Трофеи войны"
 gh_olteni_events.0001.desc:0 "Какой славный день!\n\nЗемля пропитана кровью врагов, а мои войска прокладывают по полю боя жестокий путь. Под нашим натиском гибнут и $knight_culture_player_plural_no_tooltip_lowercase$, и простые солдаты.\n\nНаконец передо мной падает [dead_combatant.GetName], и глаза за [dead_combatant.GetHerHis] маской закрываются навеки. Воины ликуют, когда я снимаю артефакт и креплю его к поясу рядом с другими трофеями, отнятыми у павших врагов."
 gh_olteni_events.0001.a:0 "[dead_combatant.GetHerHim|U] это больше не понадобится."

 gh_olteni_events.0101.t: "Странствующий старейшина"
 gh_olteni_events.0101.desc: "Мне сообщают, что в моих землях видели странствующего [Glossary('Тённм Энгота','GH_TONNM_ONGOT_GLOSS')]. Старейшина благословляет деревни и ухаживает за больными.\n\nТакие люди встречаются редко, и обычай велит предложить им гостеприимство в обмен на мудрость.\n\nНо только если старейшина окажется у моего порога..."
 gh_olteni_events.0101.a: "Я приму старейшину в своём [ROOT.Char.Custom('ResidenceBuilding')]."
 gh_olteni_events.0101.a.flavor: "Пусть моё приглашение окажет старейшине честь — тогда и мне воздадут тем же."
 gh_olteni_events.0101.a.tt: "Вы посылаете гонцов с приглашением старейшине"
 gh_olteni_events.0101.b: "Ничего хорошего из этого не выйдет."
 gh_olteni_events.0101.b.flavor: "Какой смысл давать приют безвестным бродягам?"

 gh_olteni_events.0102.t: "$gh_olteni_events.0101.t$: Мистик"
 gh_olteni_events.0102.desc.intro: "«Приветствую вас, [ROOT.Char.GetTitleAsNameNoTooltip] этих земель, и благодарю за гостеприимство». Мы соединяем руки в церемониальном приветствии: рука старейшины оказывается поверх моей.\n\n«За гостеприимство, как и положено, я отплачу тем же», — добавляет [elder.GetSheHe], слегка склоняя [elder.GetHerHis] голову.\n\n"
 gh_olteni_events.0102.desc: "$gh_olteni_events.0102.desc.intro$[elder.GetWomanMan|U] выглядит необычно даже для человека, склонного к эзотерике. В [elder.GetHerHis] одеяние вшиты десятки маленьких колокольчиков, и каждое движение сопровождается тихим мелодичным звоном.\n\n«Меня зовут [elder.GetName], ваше высочество. Я [Select_CString(elder.IsFemale, 'посвятила', 'посвятил')] жизнь сохранению мудрости наших предков. Эту мудрость я и предлагаю вам, если вы решите её принять»."
 gh_olteni_events.0102.a: "Прекрасно, нам стоит обменяться знаниями!"
 gh_olteni_events.0102.a.flavor: "В конце концов, я и [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам')] в некотором роде [GetTrait('lifestyle_mystic').GetName(ROOT.Char)]."
 gh_olteni_events.0102.b: "Я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов')] учиться."
 gh_olteni_events.0102.b.flavor: "Мне всегда хотелось узнать, как в грязном тряпье заводятся мыши, а пауки возникают будто из ниоткуда."
 gh_olteni_events.0102.b.tt: "[elder.GetName] посвящает вас в сакральные знания колргийцев" 
 gh_olteni_events.0102.c: "Вас ждёт моё гостеприимство, но не более."
 gh_olteni_events.0102.c.flavor: "Не желаю развлекать шарлатанов дольше, чем велит обычай."

 gh_olteni_events.0103.t: "$gh_olteni_events.0101.t$: [Select_CString(elder.IsFemale, 'Учёная', 'Учёный')]"
 gh_olteni_events.0103.desc: "$gh_olteni_events.0102.desc.intro$[elder.GetWomanMan|U] [Select_CString(elder.IsFemale, 'прибыла', 'прибыл')] не [Select_CString(elder.IsFemale, 'одна', 'один')]: [elder.GetHerHis] сопровождают несколько слуг, писцов и учеников с внушительной коллекцией книг, свитков и странных устройств предположительно научного назначения.\n\n«Меня зовут [elder.GetName], ваше высочество. Я стремлюсь раскрыть тайны природы. Знаниями нужно делиться, а не прятать их; для меня будет честью рассказать вам о своих открытиях»."
 gh_olteni_events.0103.a: "$gh_olteni_events.0102.a$"
 gh_olteni_events.0103.a.flavor: "В конце концов, я и [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам')] в некотором роде [GetTrait('scholar').GetName(ROOT.Char)]."
 gh_olteni_events.0103.b: "$gh_olteni_events.0102.b$"
 gh_olteni_events.0103.b.flavor: "$gh_olteni_events.0102.b.flavor$"
 gh_olteni_events.0103.b.tt: "Перед уходом старейшина делится [elder.GetHerHis] знаниями"
 gh_olteni_events.0103.c: "Вас ждёт моё гостеприимство, но не более."
 gh_olteni_events.0103.c.flavor: "$gh_olteni_events.0102.c.flavor$"

 gh_olteni_events.0104.t: "$gh_olteni_events.0101.t$: Бродяга"
 gh_olteni_events.0104.desc: "«[elder.GetSheHe|U] не старейшина, а всего лишь [Select_CString(elder.IsFemale, 'мошенница', 'мошенник')], [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой')] [ROOT.Char.GetLadyLord|U]», — с презрением бросает [jailor.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n«Мы разыскали старейшину, чтобы передать ваше приглашение, но нашли лишь [Select_CString(elder.IsFemale, 'эту мошенницу', 'этого мошенника')]. [elder.GetSheHe|U] [Select_CString(elder.IsFemale, 'торговала', 'торговал')] болотной водой под видом лекарства и даже [Select_CString(elder.IsFemale, 'осмелилась', 'осмелился')] выдавать молотую железную ржавчину за порошок киновари».\n\nСтоя в цепях, [elder.GetWomanMan] вздрагивает после каждого обвинения из, по-видимому, длинного списка [elder.GetHerHis] обманов, но хранит молчание."
 gh_olteni_events.0104.a: "#EMP [Select_CString(elder.IsFemale, 'Содрать с неё кожу заживо.', 'Содрать с него кожу заживо.')]#!"
 gh_olteni_events.0104.a.flavor: "А я уже [Select_CString(ROOT.Char.IsFemale, 'боялась', 'боялся')], что преступники закончатся..."
 gh_olteni_events.0104.b: "[elder.GetSheHe|U] сгниёт в темнице." 
 gh_olteni_events.0104.b.flavor: "Кто знает, может, время во тьме поможет [elder.GetHerHim] образумиться."
 gh_olteni_events.0104.c: "Просто вышвырнуть эту дрянь."
 gh_olteni_events.0104.c.flavor: "И державе от этого станет лишь лучше."
 gh_olteni_events.0104.c.tt: "[elder.GetName] изгоняется под страхом смерти"

 gh_olteni_events.0105.t: "$gh_olteni_events.0101.t$: Маг"
 gh_olteni_events.0105.desc: "$gh_olteni_events.0102.desc.intro$[elder.GetSheHe|U] [Select_CString(elder.IsFemale, 'невероятно стара', 'невероятно стар')]: прикосновение [elder.GetHerHis] руки напоминает скорее дублёную кожу, чем живую плоть. И всё же рукопожатие крепко, а из-под маски неестественно сияют [elder.GetHerHis] [elder.Custom('EyeEyes')].\n\n«Меня зовут [elder.GetName], ваше высочество. На закате своих дней я [Select_CString(elder.IsFemale, 'отправилась', 'отправился')] странствовать. Даже этот мир огромен — больше, чем мы способны представить, — и полон знаний. Этими знаниями я и предлагаю поделиться, если вы пожелаете их принять»."
 gh_olteni_events.0105.a: "Оставайтесь столько, сколько пожелаете."
 gh_olteni_events.0105.a.flavor: "Интересно, какие знания мне откроются?"
 gh_olteni_events.0105.a.tt: "[elder.GetFirstName] некоторое время пробудет при вашем [Concept('court','дворе')|E]"
 gh_olteni_events.0105.b: "Для меня будет честью принять вас на одну ночь."
 gh_olteni_events.0105.b.flavor: "[elder.GetSheHe|U] меня тревожит, но [elder.GetHerHis] знания наверняка пригодятся."
 gh_olteni_events.0105.b.tt: "$gh_olteni_events.0103.b.tt$"

 gh_olteni_events.0106.t: "$gh_olteni_events.0101.t$: Исчезновение"
 gh_olteni_events.0106.desc: "Прошло уже несколько недель с тех пор, как я [Select_CString(ROOT.Char.IsFemale, 'отправила', 'отправил')] своих людей проверить слухи о появлении старейшины в моих владениях. Теперь, когда они один за другим возвращаются с пустыми руками, мне остаётся лишь признать тщетность своих усилий.\n\nПохоже, где скрывается старейшина, так и останется загадкой — если это не выдумка."
 gh_olteni_events.0106.tt: "Старейшину не удалось найти"
 gh_olteni_events.0106.a: "Какое разочарование." 
 gh_olteni_events.0106.a.flavor: "Наставление старейшины могло бы пригодиться."

 gh_olteni_events.0107.t: "$gh_olteni_events.0101.t$: Отказ"
 gh_olteni_events.0107.desc: "Мои гонцы возвращаются не со старейшиной, а с письмом.\n\nВ нём язвительно разбирается мой характер и приводится множество примеров — как реальных, так и вымышленных, — доказывающих, что я не соответствую почётному званию «[ROOT.Char.GetFaith.GetAdherentName]». Встречи в ближайшее время мне ждать не стоит."
 gh_olteni_events.0107.tt.piety: "Старейшина отказывается от встречи с вами из-за вашего [Concept('piety_level', 'уровня набожности')|E]"
 gh_olteni_events.0107.tt.sinful: "Старейшина отказывается от встречи с вами из-за ваших [Concept('sinful', 'греховных')|E] [Concept('traits', 'свойств')|E]"
 gh_olteni_events.0107.a: "Какое разочарование."
 gh_olteni_events.0107.a.flavor: "Вот уж действительно постыдное зрелище."

 gh_olteni_events.0108.t: "$gh_olteni_events.0101.t$: Пора двигаться дальше"
 gh_olteni_events.0108.desc: "«Я [Select_CString(elder.IsFemale, 'рада', 'рад')], что мы встретились, [ROOT.Char.GetFirstNameNoTooltip]», — с глубоким удовлетворением в [elder.GetHerHis] голосе говорит [elder.GetName].\n\n«Вы были [Select_CString(ROOT.Char.IsFemale, 'столь радушной хозяйкой', 'столь радушным хозяином')], но, боюсь, мне пора продолжить путь», — добавляет [elder.GetSheHe], склоняя [elder.GetHerHis] голову. «Примите эти скромные записи в благодарность за гостеприимство, а затем я уйду».\n\n[elder.GetWomanMan|U] передаёт мне два кожаных свитка, чья тяжесть явно объясняется не только материалом. Обычай велит нам расстаться, и какая-то часть меня уже считает это немного досадным: я [Select_CString(ROOT.Char.IsFemale, 'успела', 'успел')] привыкнуть к нашим глубоким беседам."
 gh_olteni_events.0108.tt: "[elder.GetName] дарит вам два [Concept('magic','магических')|E] свитка"
 gh_olteni_events.0108.a: "Благодарю вас и прощайте." 
 gh_olteni_events.0108.a.flavor: "Хорошему не суждено длиться вечно, иначе оно станет обыденным."
 gh_olteni_events.0108.a.tt: "[elder.GetName] уходит" 
 gh_olteni_events.0108.b: "Погодите! Может, вы останетесь?"
 gh_olteni_events.0108.b.flavor: "К чёрту обычай — мы ещё не закончили обсуждать этику добровольной одержимости духом!"
 gh_olteni_events.0108.b.success: "Вам удалось убедить [elder.GetName] остаться" 
 gh_olteni_events.0108.b.success.tt: "[elder.GetName] соглашается остаться при вашем дворе" 
 gh_olteni_events.0108.b.failure: "$gh_olteni_events.0108.a.tt$" 
 gh_olteni_events.0108.b.failure.tt: "$gh_olteni_events.0108.a.tt$"