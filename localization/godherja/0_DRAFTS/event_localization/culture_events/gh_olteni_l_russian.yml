l_russian:
 gh_olteni_events.0001.t:0 "Трофеи войны"
 gh_olteni_events.0001.desc:0 "Какой славный день!\n\nЗемля пропитана кровью врагов, а мои войска прокладывают по полю боя жестокий путь. Под нашим натиском гибнут и $knight_culture_player_plural_no_tooltip_lowercase$, и простые солдаты.\n\nНаконец передо мной падает [dead_combatant.GetName], и глаза за [dead_combatant.GetHerHis] маской закрываются навеки. Воины ликуют, когда я снимаю артефакт и креплю его к поясу рядом с другими трофеями, отнятыми у павших врагов."
 gh_olteni_events.0001.a:0 "[dead_combatant.GetSheHe|U] это больше не понадобится."

 gh_olteni_events.0101.t: "Странствующий старейшина"
 gh_olteni_events.0101.desc: "Мне сообщают, что в моих землях видели странствующего [Glossary('Тённм Энгота','GH_TONNM_ONGOT_GLOSS')]. Мудрец благословляет деревни и ухаживает за больными.\n\nТакие люди встречаются редко, и обычай велит предложить им гостеприимство в обмен на мудрость.\n\nНо только если старейшина сам окажется у моего порога..."
 gh_olteni_events.0101.a: "Я приму старейшину в своём [ROOT.Char.Custom('ResidenceBuilding')]."
 gh_olteni_events.0101.a.flavor: "Let my offer honor them, and they will surely honor me in return."
 gh_olteni_events.0101.a.tt: "Вы посылаете гонцов с приглашением старейшине"
 gh_olteni_events.0101.b: "Ничего хорошего из этого не выйдет."
 gh_olteni_events.0101.b.flavor: "What use could there possibly be in offering shelter to unknown vagrants?"

 gh_olteni_events.0102.t: "$gh_olteni_events.0101.t$: Мистик"
 gh_olteni_events.0102.desc.intro: ""I greet you, the [ROOT.Char.GetTitleAsNameNoTooltip] of the land, and I thank you for your hospitality." We link our arms in a formal greeting, [elder.GetHersHis] over mine.\n\n"A hospitality that, as is proper, I will repay in kind," [elder.GetSheHe] adds, bowing [elder.GetHerHis] head slightly.\n\n"
 gh_olteni_events.0102.desc: "«Приветствую вас, [ROOT.Char.GetTitleAsNameNoTooltip] этих земель, и благодарю за гостеприимство». Мы сцепляем руки в церемониальном приветствии, [elder.GetHersHis] поверх моей.\n\n«За гостеприимство, как и положено, я отплачу тем же», — добавляет [elder.GetSheHe], слегка склоняя [elder.GetHerHis] голову.\n\nВнешность [elder.GetWomanMan|l] необычна даже для человека, склонного к эзотерике. В [elder.GetHerHis] одеяние вшиты десятки колокольчиков, и каждое движение сопровождает тихий мелодичный звон.\n\n«Меня зовут [elder.GetName], ваше высочество. Я посвятил[Select_CString(elder.IsFemale, 'а', '')] жизнь сохранению мудрости наших колргийских предков. Эту мудрость я и предлагаю вам, если вы решите её принять»."
 gh_olteni_events.0102.a: "Прекрасно, нам #EMP стоит#! обменяться знаниями!"
 gh_olteni_events.0102.a.flavor: "I am somewhat of a [GetTrait('lifestyle_mystic').GetName(ROOT.Char)] myself, after all."
 gh_olteni_events.0102.b: "Я готов[Select_CString(ROOT.Char.IsFemale, 'а', '')] учиться."
 gh_olteni_events.0102.b.flavor: "I've always wanted to know how do mice spawn in dirty rags, and spiders appear out of nowhere."
 gh_olteni_events.0102.b.tt: "[elder.GetName] посвящает вас в сакральные знания колргийцев" 
 gh_olteni_events.0102.c: "Вас ждёт моё гостеприимство, но не более."
 gh_olteni_events.0102.c.flavor: "I have no desire to entertain charlatans for longer than tradition demands."

 gh_olteni_events.0103.t: "$gh_olteni_events.0101.t$: Учёный"
 gh_olteni_events.0103.desc: "«Приветствую вас, [ROOT.Char.GetTitleAsNameNoTooltip] этих земель, и благодарю за гостеприимство». Мы сцепляем руки в церемониальном приветствии, [elder.GetHersHis] поверх моей.\n\n«За гостеприимство, как и положено, я отплачу тем же», — добавляет [elder.GetSheHe], слегка склоняя [elder.GetHerHis] голову.\n\n[elder.GetWomanMan|U] прибыл[Select_CString(elder.IsFemale, 'а', '')] не один: [elder.GetHerHim] сопровождают несколько слуг, писцов и учеников с внушительным собранием книг, свитков и странных приборов, по всей видимости научных.\n\n«Меня зовут [elder.GetName], ваше высочество. Я стремлюсь раскрыть тайны природы. Знаниями нужно делиться, а не прятать их; для меня будет честью рассказать вам о своих открытиях»."
 gh_olteni_events.0103.a: "Прекрасно, нам #EMP стоит#! обменяться знаниями!"
 gh_olteni_events.0103.a.flavor: "I am somewhat of a [GetTrait('scholar').GetName(ROOT.Char)] myself, after all."
 gh_olteni_events.0103.b: "Я готов[Select_CString(ROOT.Char.IsFemale, 'а', '')] учиться."
 gh_olteni_events.0103.b.flavor: "$gh_olteni_events.0102.b.flavor$"
 gh_olteni_events.0103.b.tt: "[elder.GetName] делится с вами своими знаниями" 
 gh_olteni_events.0103.c: "Вас ждёт моё гостеприимство, но не более."
 gh_olteni_events.0103.c.flavor: "$gh_olteni_events.0102.c.flavor$"

 gh_olteni_events.0104.t: "$gh_olteni_events.0101.t$: Бродяга"
 gh_olteni_events.0104.desc: "«[elder.GetSheHe|U] — мошенни[Select_CString(elder.IsFemale, 'ца', 'к')], [Select_CString(ROOT.Char.IsFemale, 'моя', 'мой')] [ROOT.Char.GetLadyLord|U]», — с презрением бросает [jailor.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n«Мы разыскали старейшину, чтобы передать приглашение, но вместо почтенного мудреца нашли эту лживую особу. [elder.GetSheHe|U] торговал[Select_CString(elder.IsFemale, 'а', '')] полной чушью под видом лекарств и даже попытал[Select_CString(elder.IsFemale, 'ась', 'ся')] продать нам молотую железную ржавчину как порошок киновари».\n\n[elder.GetWomanMan|U] в цепях вздрагивает после каждого обвинения из длинного списка [elder.GetHerHis] обманов, но хранит молчание."
 gh_olteni_events.0104.a: "#EMP Содрать с [elder.GetHerHim] кожу.#!"
 gh_olteni_events.0104.a.flavor: "And here I was worried that I would run out of criminals..."
 gh_olteni_events.0104.b: "[elder.GetSheHe|U] сгниёт в темнице." 
 gh_olteni_events.0104.b.flavor: "Who knows, maybe some time in the dark would set [elder.GetHerHim] straight."
 gh_olteni_events.0104.c: "Просто вышвырнуть эту дрянь."
 gh_olteni_events.0104.c.flavor: "And the realm will be better off for it."
 gh_olteni_events.0104.c.tt: "[elder.GetName] изгоняется под страхом смерти"

 gh_olteni_events.0105.t: "$gh_olteni_events.0101.t$: Маг"
 gh_olteni_events.0105.desc: "«Приветствую вас, [ROOT.Char.GetTitleAsNameNoTooltip] этих земель, и благодарю за гостеприимство». Мы сцепляем руки в церемониальном приветствии, [elder.GetHersHis] поверх моей.\n\n«За гостеприимство, как и положено, я отплачу тем же», — добавляет [elder.GetSheHe], слегка склоняя [elder.GetHerHis] голову.\n\n[elder.GetSheHe|U] невероятно стар[Select_CString(elder.IsFemale, 'а', '')]: кожа [elder.GetHerHis] руки на ощупь больше напоминает дублёную кожу, чем живую плоть. И всё же рукопожатие крепко, а за маской неестественно сияют [elder.GetHerHis] [elder.Custom('EyeEyes')].\n\n«Меня зовут [elder.GetName], ваше высочество. На склоне лет я отправил[Select_CString(elder.IsFemale, 'ась', 'ся')] в странствия. Даже один наш мир огромен — больше, чем мы способны представить, — и полон знаний. Этими знаниями я и предлагаю поделиться, если вы пожелаете их принять»."
 gh_olteni_events.0105.a: "С благодарностью принимаю."
 gh_olteni_events.0105.a.flavor: "What knowledge could they reveal, I wonder?"
 gh_olteni_events.0105.a.tt: "Вы начинаете [Concept('scheme','замысел')|E] #L «Изучить заклинание»#! против [elder.GetShortUIName], чтобы освоить заклинание #L «Осквернённый надир»#!"
 gh_olteni_events.0105.b: "Вас ждёт моё гостеприимство, но не более."
 gh_olteni_events.0105.b.flavor: "[elder.GetSheHe|U] unnerves me, but whatever I can get out from [elder.GetHerHim] is bound to be useful."
 gh_olteni_events.0105.b.tt: "$gh_olteni_events.0103.b.tt$"

 gh_olteni_events.0106.t: "$gh_olteni_events.0101.t$: Исчезновение"
 gh_olteni_events.0106.desc: "Прошло уже несколько недель с тех пор, как я отправил своих людей на поиски неуловимого старейшины, замеченного в моих владениях. Теперь, когда они один за другим возвращаются с пустыми руками, мне остаётся лишь признать тщетность своих усилий.\n\nПохоже, местонахождение странника, если он вообще существовал, так и останется загадкой."
 gh_olteni_events.0106.tt: "Старейшина исчез бесследно"
 gh_olteni_events.0106.a: "Какое разочарование." 
 gh_olteni_events.0106.a.flavor: "Some guidance from one could have been useful."

 gh_olteni_events.0107.t: "$gh_olteni_events.0101.t$: Отказ"
 gh_olteni_events.0107.desc: "Мои гонцы возвращаются не со старейшиной, а с письмом.\n\nВ нём мудрец язвительно разбирает мой характер и перечисляет множество способов — как реальных, так и вымышленных, — которыми я не соответствую званию верного [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]. Встречи в ближайшее время мне ждать не стоит."
 gh_olteni_events.0107.tt.piety: "Старейшина отказался встречаться с вами из-за вашего [Concept('piety_level', 'уровня благочестия')|E]" 
 gh_olteni_events.0107.tt.sinful: "Старейшина отказался встречаться с вами из-за ваших [Concept('sinful', 'греховных')|E] [Concept('traits', 'черт')|E]"
 gh_olteni_events.0107.a: "Какое разочарование."
 gh_olteni_events.0107.a.flavor: "A shameful display, to be sure."

 gh_olteni_events.0108.t: "Движемся вперёд"
 gh_olteni_events.0108.desc: ""I am glad that we've met, [ROOT.Char.GetFirstNameNoTooltip]," [elder.GetName] says with a deep sense of satisfaction in [elder.GetHerHis] voice.\n\n"You have been a most gracious host, but I'm afraid I must resume my travels," [elder.GetSheHe] adds, bowing [elder.GetHerHis] head. "Please accept these humble notes of mine as thanks for your hospitality, and then I will depart."\n\nThe woman hands me over two leathery scrolls with a weight to them that is not borne out of simple materials. The tradition bids you to part ways, which some part of you now finds a little shameful, having grown used to the deep discussions you shared."
 gh_olteni_events.0108.tt: "[elder.GetName] gifted you two [Concept('magic','Magical')|E] scrolls"
 gh_olteni_events.0108.a: "Благодарю вас и прощайте." 
 gh_olteni_events.0108.a.flavor: "Good things are not meant to last, lest they become but mundane."
 gh_olteni_events.0108.a.tt: "[elder.GetName] уходит" 
 gh_olteni_events.0108.b: "Погодите! Может, вы останетесь?"
 gh_olteni_events.0108.b.flavor: "Tradition be damned, we haven't finished discussing the ethics of voluntary spirit possession!"
 gh_olteni_events.0108.b.success: "Вам удалось убедить [elder.GetName] остаться" 
 gh_olteni_events.0108.b.success.tt: "[elder.GetName] соглашается остаться при вашем дворе" 
 gh_olteni_events.0108.b.failure: "$gh_olteni_events.0108.a.tt$" 
 gh_olteni_events.0108.b.failure.tt: "$gh_olteni_events.0108.a.tt$"