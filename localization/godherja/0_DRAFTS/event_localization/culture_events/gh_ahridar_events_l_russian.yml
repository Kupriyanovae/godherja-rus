l_russian:
 ahridar.0001.t:0 "Восходящее солнце"
 ahridar.0001.desc:0 "Верхом на священной ящерице ахбшаани я направляюсь к святому дому Охрасика, возвышающемуся над кратером Экершаан и его народом. Там меня встречают жрецы, и начинается обряд.\n\nМеня умащают священными маслами, изготовленными из многочисленных растений кратера, связывая мои тело и душу с этой святой землёй. Восемь раз я нараспев пересказываю священные предания об Охрасике и его войне с тенями. Восемь раз молю Охрасика направить через меня свою волю. Я обращаю взгляд к солнцу и целую мучительную минуту не отвожу глаз, взывая к Охрасику всем телом и душой.\n\nНаконец дварша одобряют меня и позволяют надеть священный солнечный ореол. Отныне я — [Concept('malaak','Малаак')|E], воплощение Охрасика и орудие его воли."
 ahridar.0001.a:0 "Его воля будет исполнена."
