l_russian:
 gh_iyrossi_decision_events.001.t:0 "Новая столица?"
 gh_iyrossi_decision_events.001.desc:0 "Строительство заняло почти год и потребовало огромных затрат, но наконец моя столица стала достойной основой для нашего нового Митидона. Теперь, когда рабочие и инженеры приступили к последнему этапу строительства, мне предстоит определить облик города. Создать ли храмовый квартал в честь Дейфартороса и Божественного Суда или отвести его под нужды светской администрации? Решение за мной."
 gh_iyrossi_decision_events.001.a:0 "Возвести дворцы и памятники."
 gh_iyrossi_decision_events.001.b:0 "Возвести храмы и святыни в честь Законодателей."