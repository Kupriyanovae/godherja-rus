l_russian:
 iyrossi_monthly.1000.t:0 "Аверсарианские беженцы"
 iyrossi_monthly.1000.desc:0 "Мои разведчики перехватили измученную группу — почти дюжину [Concept('aversaria','аверсарианских')|E] семей, ищущих убежища от бедствия, которое лишило их средств к существованию. Они безоружны и кажутся безобидными, но нельзя забывать заповеди Дейфартороса. Их соотечественники веками держали нас в цепях и подвергали жестоким мучениям, а кровь взывает к крови. Как мне поступить с этими несчастными?"
 iyrossi_monthly.1000.a:0 "Эти люди ни в чём не виноваты. Пусть остаются или уходят — как пожелают."
 iyrossi_monthly.1000.b:0 "Пусть отработают свой долг. Обратить их в кабальных работников."
 iyrossi_monthly.1000.c:0 "Продать их в рабство — меньшего они не заслуживают."