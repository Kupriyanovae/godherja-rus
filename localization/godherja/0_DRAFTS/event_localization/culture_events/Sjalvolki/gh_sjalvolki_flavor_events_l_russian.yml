l_russian:
 sjalvolki_monthly.1000.t:0 "Дети Замистры, дети Урехи"
 sjalvolki_monthly.1000.desc:0 "Могучий [Concept('velos','Велос')|E] даровал нам искусство охоты и власть над зверями этого мира, чтобы мы могли утолять голод. Но даже столь великий дар нельзя растрачивать бездумно.\n\nМежду двумя нашими кланами в [sjalvolki_province_dispute.GetName] возник спор о том, как распорядиться землёй. Один клан держится традиционной охоты и хочет оставить неосвоенные угодья нетронутыми, чтобы там и впредь водилась дичь. Другой состоит из убеждённых земледельцев и намерен расчистить часть этих земель под новые поля. За охотниками стоит благочестивый культ Велоса, но доводы есть у обеих сторон, и потому окончательное решение предстоит принять мне."
 sjalvolki_monthly.1000.a:0 "Охотники говорят дело. Пусть эти земли останутся охотничьими угодьями."
 sjalvolki_monthly.1000.b:0 "Земледельцы правы. Пусть расчищают землю огнём и топором."
 preserved_for_hunters:0 "Сохранено для охотников"
 expanding_farms:0 "Расширение пахотных земель"
 sjalvolki_monthly.1001.t:0 "Дань охотников"
 sjalvolki_monthly.1001.desc:0 "По священному обычаю любой убитый охотником зверь принадлежит ему, и он волен распорядиться добычей по своему усмотрению — [Concept('velos','Велос')|E] обещал нам именно это. Но всё, что не является зверем, подпадает под светские законы. Сегодня несколько охотников, как того требует закон, сообщили о полуразрушенном строении глубоко в лесах владения [sjalvolki_hunters_find.GetName]. Суеверные люди побоялись призраков и духов и не стали заходить внутрь. Раз руины находятся в моих владениях, я могу распорядиться этой находкой как пожелаю. Правда, если охотники проводят меня туда, им будет положено небольшое вознаграждение."
 sjalvolki_monthly.1001.a:0 "Заплатить им и осмотреть руины!"
 sjalvolki_monthly.1001.b:0 "Отослать их ни с чем. У меня есть дела поважнее."
 sjalvolki_monthly.1002.t:0 "Аверсарианская вилла!"
 sjalvolki_monthly.1002.desc:0 "Наш небольшой отряд пробирается сквозь густые леса владения [sjalvolki_hunters_find.GetName], и дорога до руин занимает почти весь день. Разбив лагерь, я заглядываю внутрь. Вопреки страхам проводников, здесь нет ни призраков, ни духов — лишь остатки [Concept('aversaria','аверсарианской')|E] роскоши. Когда-то это поместье, похоже, было плантацией, но за несколько поколений запустения лес почти полностью поглотил его. Прорубившись сквозь густые лианы, затянувшие бывший дверной проём, я оказываюсь среди осыпающихся стен библиотеки. К моему разочарованию, от книг остались лишь промокшие гнилые комья. Я уже собираюсь уйти, когда замечаю кое-что любопытное."
 sjalvolki_monthly.1002.a:0 "Небольшая позолоченная статуя — за неё наверняка дадут хорошую цену!"
 sjalvolki_monthly.1002.b:0 "Единственная книга, уцелевшая в целости!"
 sjalvolki_monthly.1003.t:0 "Аверсарианский арсенал!"
 sjalvolki_monthly.1003.desc:0 "Наш небольшой отряд пробирается сквозь густые леса владения [sjalvolki_hunters_find.GetName], и дорога до руин занимает почти весь день. Перед нами приземистое крепкое здание из грубо отёсанного камня. Очевидно, прежде здесь находились форт или гарнизон, а резное изображение Чистейшего над входом ясно указывает, кто когда-то занимал это место. Навалившись плечом на тяжёлую дверь, я открываю её и осматриваю помещение. Повсюду разбросаны остатки арсенала, но от хранившихся здесь оружия и доспехов остались лишь ржавые обломки. После нескольких часов поисков мы всё же находим плотно закрытый сундук, который прежние грабители, должно быть, не заметили. Взломав его, мы обнаруживаем нечто, завёрнутое в промасленную ткань и надёжно укрытое от сырости..."
 sjalvolki_monthly.1003.a:0 "Доспехи в превосходном состоянии!"
 sjalvolki_monthly.1003.b:0 "Отличное оружие!"
 sjalvolki_monthly.1003.c:0 "Кувшины вина! Сегодня устроим пир!"
 sjalvolki_monthly.1004.t:0 "Аверсарианская мельница!"
 sjalvolki_monthly.1004.desc:0 "Наш небольшой отряд пробирается сквозь густые леса владения [sjalvolki_hunters_find.GetName], и дорога до руин занимает почти весь день. Оказывается, перед нами небольшой комплекс мельниц, заброшенный вскоре после раскола мира. Деревню, которая когда-то окружала это место, давно поглотил лес, но сама мельница сохранилась на удивление хорошо. Многие металлические детали придётся заменить, зато наши мастера смогут изучить механизмы и воспроизвести сложную конструкцию. Можно также продать древесину и уцелевшие части оборудования за хорошую цену, хотя местные жители будут недовольны."
 sjalvolki_monthly.1004.a:0 "Разобрать мельницу и построить заново для наших нужд!"
 sjalvolki_monthly.1004.b:0 "Продать всё, что уцелело!"
 sjalvolki_monthly.1005.t:0 "Аверсарианский храм!"
 sjalvolki_monthly.1005.desc:0 "Наш небольшой отряд пробирается сквозь густые леса владения [sjalvolki_hunters_find.GetName], и дорога до руин занимает почти весь день. Вскоре становится ясно, что это аверсарианский наон — храм наших давних врагов. Выцветшие изображения Чистейшего всё ещё украшают стены, а внутри царит беспорядок: похоже, здание покидали в большой спешке, и служившие здесь омитилосы не успели забрать предметы культа. Неизвестно, какой деревне или общине прежде служил этот храм, но теперь он в наших руках."
 sjalvolki_monthly.1005.a:0 "Продать ценности, а храм разрушить."
 sjalvolki_monthly.1005.b:0 "Снести всё до основания и осквернить этот дом Пеквона!"
 sjalvolki_monthly.1005.c:0 "Не трогать его. Забвение — тоже наказание."
 sjalvolki_monthly.1005.d:0 "Не трогать его. Забвение — тоже наказание."
 sjalvolki_monthly.1006.t: "Зверинец среди руин"
 sjalvolki_monthly.1006.desc:0 "Наш небольшой отряд пробирается сквозь густые леса владения [sjalvolki_hunters_find.GetName], и дорога до руин занимает почти весь день. Перед нами остатки какого-то [Concept('aversaria','аверсарианского')|E] поместья, в центре которого стоит заброшенная вилла. Внутри прогнившего, наполовину обрушившегося здания нас ждёт странное зрелище. По комнатам разбросаны непонятные металлические детали и покрытые зелёной патиной медные перья. В углах громоздятся ржавые останки статуй диких кошек и других зверей. В самом центре сидит скелет безумного владельца, всё ещё сжимающий в руках охапку неузнаваемых шестерёнок. Господин зверинца, столь же безжизненного, как он сам.\n\nПроведя целый день в этой странной гробнице, мы наконец находим..."
 sjalvolki_monthly.1006.a:0 "Только ржавчину и развалины."
 sjalvolki_monthly.1006.b:0 "Настоящее чудо."
 locals_mollified:0 "Местные успокоены"
 locals_enraged:0 "Местные разгневаны"
 sjalvolki_monthly.1007.t:0 "Учимся охотиться"
 sjalvolki_monthly.1007.desc:0 "Первый убитый олень — обряд перехода во взрослую жизнь для каждого юного сьялволка, священное деяние, которому сам Велос научил нас в эпоху героев. Но [guardian.GetName] до сих пор не [Select_CString(guardian.IsFemale, 'научила', 'научил')] меня стрелять даже в кролика. Может, стоит уговорить [guardian.GetHerHim] взять меня на охоту и показать, что к чему? Тогда друзья наконец перестанут смеяться над тем, что я ни разу не [Select_CString(ROOT.Char.IsFemale, 'охотилась', 'охотился')]. Всем ведь известно: в охотничьем ремесле равных этому человеку немного."
 sjalvolki_monthly.1007.a:0 "Нет, мне и дома хорошо."
 sjalvolki_monthly.1007.b:0 "Так не пойдёт — буду досаждать [guardian.GetHerHim], пока не согласится!"
 sjalvolki_monthly.1008.t:0 "Маленький охотник"
 sjalvolki_monthly.1008.desc:0 "В последнее время [hunt_curious_child.GetName] не даёт мне покоя и просит дать [hunt_curious_child.GetHerHim] возможность поохотиться, а [hunt_curious_child.GetSheHe] говорит, что больше не может терпеть насмешки друзей и задир. Я и правда хорошо умею охотиться, но готов ли ребёнок завалить своего первого оленя? Всё-таки для этого ещё рановато..."
 sjalvolki_monthly.1008.a:0 "[hunt_curious_child.GetName] говорит дело! Пора [hunt_curious_child.GetHerHim] учиться!"
 sjalvolki_monthly.1008.b:0 "Просто дать [hunt_curious_child.GetHerHim] лук — дальше [hunt_curious_child.GetSheHe] разберётся."
 sjalvolki_monthly.1008.c:0 "Это слишком опасно. Я не позволю [hunt_curious_child.GetHerHim] даже приближаться к лесу!"
 sjalvolki_monthly.1008.a.success:0 "Обучение проходит успешно!"
 sjalvolki_monthly.1008.b.failure:0 "[hunt_curious_child.GetName] почти ничему не учится"
 sjalvolki_monthly.1008.c.failure:0 "Происходит ужасный несчастный случай!"
 sjalvolki_monthly.1008.adult_message_success:0 "[hunt_curious_child.GetFirstName] успешно осваивает охоту!"
 sjalvolki_monthly.1008.adult_message_failure:0 "[hunt_curious_child.GetFirstName] никак не может понять, что к чему..."
 sjalvolki_monthly.1008.adult_message_crit_fail:0 "[hunt_curious_child.GetFirstName] умудряется попасть стрелой в [hunt_curious_child.GetHerselfHimself]!"
 sjalvolki_monthly.1008.child_message_success:0 "[guardian.GetFirstName] соглашается взять меня на охоту, и я добываю своего первого оленя!"
 sjalvolki_monthly.1008.child_message_failure:0 "[guardian.GetFirstName] соглашается взять меня на охоту, но у меня ничего не получается..."
 sjalvolki_monthly.1008.child_message_crit_fail:0 "[guardian.GetFirstName] соглашается взять меня на охоту, но всё заканчивается ужасно!"
 sjalvolki_monthly.1009.t:0 "Лук — и почти ничего больше"
 sjalvolki_monthly.1009.desc:0 "Когда я [Select_CString(ROOT.Char.IsFemale, 'рассказала', 'рассказал')] [guardian.GetName] о желании научиться охотиться, то ожидал[Select_CString(ROOT.Char.IsFemale, 'а', '')] чего угодно, но не того, что мне просто вручат лук со словами: \«Делай как подсказывает чутьё\». Несколько часов я проверяю тетиву и наблюдаю, как другие охотники упражняются во дворе. Кажется, основы мне понятны, но одной мысли о том, чтобы отправиться в тёмный лес и найти там цель, достаточно, чтобы стало не по себе. Может, всё это мне пока не по силам..."
 sjalvolki_monthly.1009.a:0 "Ну... пора идти!"
 sjalvolki_monthly.1009.b:0 "Нет, я к этому ещё не [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов')]."
 sjalvolki_monthly.1009.a.success:0 "Я справил[Select_CString(ROOT.Char.IsFemale, 'ась', 'ся')] без чужой помощи!"
 sjalvolki_monthly.1009.b.failure:0 "После целого дня неудач я возвращаюсь домой с пустыми руками"
 sjalvolki_monthly.1009.c.failure:0 "Я возвращаюсь домой, умудрившись прострелить себе ногу"
 sjalvolki_monthly.1009.adult_message_success:0 "[hunt_curious_child.GetFirstName] приносит оленя, добытого во время [hunt_curious_child.GetHerHis] самостоятельной охоты!"
 sjalvolki_monthly.1009.adult_message_failure:0 "[hunt_curious_child.GetFirstName] никак не может понять, что к чему..."
 sjalvolki_monthly.1009.adult_message_crit_fail:0 "Во время [hunt_curious_child.GetHerHis] охоты [hunt_curious_child.GetFirstName] получает ранение..."
 sjalvolki_monthly.1009.adult_message_giveup:0 "Похоже, [hunt_curious_child.GetFirstName] решает просто сдаться..."
 sjalvolki_monthly.1009.child_message_success:0 "Я добываю своего первого оленя!"
 sjalvolki_monthly.1009.child_message_failure:0 "У меня никак не получается..."
 sjalvolki_monthly.1009.child_message_crit_fail:0 "Всё заканчивается ужасно!"
 sjalvolki_monthly.1010.t:0 "Запретная охота"
 sjalvolki_monthly.1010.desc:0 "Обращаясь к [guardian.GetName], я надеял[Select_CString(ROOT.Char.IsFemale, 'ась', 'ся')] хотя бы на совет, но в ответ мне полностью запретили ходить в лес! Несколько дней я кипел[Select_CString(ROOT.Char.IsFemale, 'а', '')] от злости, а потом придумал[Select_CString(ROOT.Char.IsFemale, 'а', '')] хитрый план. Под видом домашних дел мне удалось вынести из оружейной лук со снятой тетивой и спрятать его под кроватью. Пока никто не заметил пропажу, завтра ночью я ускользну от стражи и опекуна и самостоятельно добуду дичь — как и завещал Велос!"
 sjalvolki_monthly.1010.a:0 "Лес, встречай меня!"
 sjalvolki_monthly.1010.b:0 "Хотя... возможно, [guardian.GetFirstName] всё-таки [Select_CString(guardian.IsFemale, 'права', 'прав')]."
 sjalvolki_monthly.1010.a.success:0 "Я справил[Select_CString(ROOT.Char.IsFemale, 'ась', 'ся')] — и без твоей помощи, [guardian.GetFirstName]!"
 sjalvolki_monthly.1010.b.failure:0 "Я возвращаюсь домой с пустыми руками и попадаюсь страже"
 sjalvolki_monthly.1010.c.failure:0 "Я возвращаюсь домой, умудрившись прострелить себе ногу, к ужасу [guardian.GetFirstName]"
 sjalvolki_monthly.1010.child_message_success:0 "[guardian.GetFirstName] в ярости, но мне всё удалось!"
 sjalvolki_monthly.1010.child_message_failure:0 "У меня никак не получается..."
 sjalvolki_monthly.1010.child_message_crit_fail:0 "Не могу поверить, что [guardian.GetFirstName] всё-таки [Select_CString(guardian.IsFemale, 'была права', 'был прав')]!"
 sjalvolki_monthly.1010.adult_message_success:0 "[hunt_curious_child.GetFirstName] нарушает мой запрет и приносит оленя!"
 sjalvolki_monthly.1010.adult_message_failure:0 "[hunt_curious_child.GetFirstName] нарушает мой запрет, но не находит никакой дичи."
 sjalvolki_monthly.1010.adult_message_crit_fail:0 "[hunt_curious_child.GetFirstName] нарушает мой запрет и возвращается с ранением!"
