 sjalvolki_conquest.0121.successful_denouncement:0 "Ваше обличение считают проницательным и справедливым"
 sjalvolki_conquest.0121.unsuccessful_denouncement:0 "Ваше обличение не успокаивает воинов"
 sjalvolki_conquest.0121.successfully_hid_underhanded_negotiations:0 "Ваши тайные переговоры не получают огласки"
 sjalvolki_conquest.0121.unsuccessfully_hid_underhanded_negotiations:0 "О ваших тайных переговорах становится известно"
 sjalvolki_conquest.0121.negotiated_good_personal_terms:0 "Вам удаётся заключить выгодное лично для вас соглашение"
 sjalvolki_conquest.0121.failed_to_negotiate_good_personal_terms:0 "Вам не удаётся заключить выгодное лично для вас соглашение"
 
 sjalvolki_conquest.0131.t:0 "Непокорные местные жители"
 sjalvolki_conquest.0131.desc:0 "Хотя мы недавно взяли под контроль [uncooperative_locals_county.GetNameNoTier], [SelectLocalization(LessThanOrEqualTo_int32(GetPlayer.GetAICompassion,'(int32)-50'), 'местная мразь', 'местные жители')] не желают с этим мириться. Они постоянно помогают вражеским солдатам, которые ещё скрываются в округе, отказываются добровольно оказать нам хотя бы малейшую поддержку и вообще ведут себя вызывающе. [SelectLocalization(LessThanOrEqualTo_int32(GetPlayer.GetAICompassion,'(int32)-50'), 'Они играют с огнём, хотя эти глупцы пока этого не понимают.', 'Положение становится всё опаснее.')]\n\nМне поручено привести местных к покорности и позволено применить любые уместные средства — конечно, в разумных пределах."
 sjalvolki_conquest.0131.a:0 "Запугать их и принудить к покорности."
 sjalvolki_conquest.0131.a_sadistic:0 "Показать им цену неповиновения."
 sjalvolki_conquest.0131.b:0 "Может, удастся их переубедить?"
 sjalvolki_conquest.0131.b_generous:0 "Я завоюю их расположение."
 sjalvolki_conquest.0131.c:0 "Просто скрыть эту проблему."
 sjalvolki_conquest.0131.d:0 "Найти главных смутьянов."
 sjalvolki_conquest.0131.d_sadistic:0 "Посадить главных смутьянов на кол."
 
 sjalvolki_conquest.0131.successfully_policed_locals:0 "Вы силой приводите округу к покорности"
 sjalvolki_conquest.0131.unsuccessfully_policed_locals:0 "Вам не удаётся силой привести округу к покорности"
 sjalvolki_conquest.0131.successfully_subdued_locals:0 "Вы разоряете округу и забираете всё ценное"
 sjalvolki_conquest.0131.unsuccessfully_subdued_locals:0 "Вы провоцируете восстание и теряете контроль над округой"
 sjalvolki_conquest.0131.successfully_swept_problem_under_the_rug:0 "Вам удаётся убедить начальство, что местные волнения прекращены"
 sjalvolki_conquest.0131.unsuccessfully_swept_problem_under_the_rug:0 "Ваш обман не остаётся незамеченным"
 sjalvolki_conquest.0131.successfully_eliminated_troublemakers:0 "Вы устраняете главных смутьянов"
 sjalvolki_conquest.0131.unsuccessfully_eliminated_troublemakers:0 "Вам не удаётся устранить местных смутьянов"
 sjalvolki_conquest.0131.successfully_persuaded_locals:0 "Вам удаётся убедить местных подчиниться"
 sjalvolki_conquest.0131.unsuccessfully_persuaded_locals:0 "Местные отвергают ваши попытки примирения"
 
 sjalvolki_conquest.0141.t:0 "Слабая дисциплина"
 sjalvolki_conquest.0141.desc_intro:0 "Дисциплина в моём войске давно идёт на спад — достаточно одного обхода лагеря, чтобы увидеть, насколько всё плохо. " 
 sjalvolki_conquest.0141.desc_intro_gluttonous_knight_exists:0 "[gluttonous_knight.GetFirstName] и весь отряд под [gluttonous_knight.GetHerHis] командованием набивают животы и пожирают наши припасы, словно стая крыс; "
 sjalvolki_conquest.0141.desc_intro_gluttonous_knight_does_not_exist:0 "одни воины набивают животы и пожирают наши припасы, словно стая крыс; "
 sjalvolki_conquest.0141.desc_intro_drunken_knight_exists:0 "[drunken_knight.GetFirstName] лежит без чувств, а [drunken_knight.GetHerHis] люди опустошают очередную бочку [ROOT.Char.Custom('RegionalDrink')], до которой сумели дотянуться [SelectLocalization(Or(GetPlayer.HasTrait(GetTrait('wrathful').Self), LessThanOrEqualTo_int32(GetPlayer.GetAICompassion,'(int32)-50')),'своими грязными', 'своими')] руками; "
 sjalvolki_conquest.0141.desc_intro_drunken_knight_does_not_exist:0 "другие опустошают очередную бочку [ROOT.Char.Custom('RegionalDrink')], до которой сумели дотянуться [SelectLocalization(Or(GetPlayer.HasTrait(GetTrait('wrathful').Self), LessThanOrEqualTo_int32(GetPlayer.GetAICompassion,'(int32)-50')),'своими грязными', 'своими')] руками; "
 sjalvolki_conquest.0141.desc_intro_lustful_knight_exists_female_attracted:0 "а палатка [lustful_knight.GetFirstNamePossessive] и вовсе превратилась в настоящий бордель."
 sjalvolki_conquest.0141.desc_intro_lustful_knight_exists_male_attracted:0 "а в палатку [lustful_knight.GetFirstNamePossessive] весь день входит и выходит подозрительно много статных юношей."
 sjalvolki_conquest.0141.desc_intro_lustful_knight_does_not_exist:0 "а одна из палаток и вовсе превратилась в настоящий бордель."
 sjalvolki_conquest.0141.desc_outro:0 "\n\nДошло до того, что предводители других дружин косятся на нас, а порой [SelectLocalization(GetPlayer.HasTrait(GetTrait('arrogant').Self), 'даже смеют открыто осуждать моё командование', 'открыто осуждают моё командование')]. Если в таком состоянии мы вступим в настоящую битву, исход почти наверняка будет катастрофическим."
 sjalvolki_conquest.0141.a:0 "Пора примерно наказать виновного."
 sjalvolki_conquest.0141.b:0 "Запретить эти [SelectLocalization(GetPlayer.HasTrait(GetTrait('zealous').Self), 'нечестивые', 'пустые')] развлечения!"
 sjalvolki_conquest.0141.c:0 "Я подам личный пример."
 sjalvolki_conquest.0141.d:0 "На этом можно неплохо заработать..."
 sjalvolki_conquest.0141.e:0 "Пусть развлекаются."
 sjalvolki_conquest.0141.f:0 "И мне немного оставьте!"
 sjalvolki_conquest.0141.g:0 "Сегодня всё за мой счёт, [SelectLocalization(ObjectsEqual(GetPlayer.GetCulture.GetMartial, GetCulturePillar('martial_custom_male_only')), 'парни' , SelectLocalization(ObjectsEqual(GetPlayer.GetCulture.GetMartial, GetCulturePillar('martial_custom_female_only')), 'девушки' , 'народ'))]!"

 sjalvolki_conquest.0141.charge_for_amenities_tooltip:0 "Вы вводите плату за все лагерные удовольствия, надеясь обуздать худшие излишества. Воинам это может не понравиться."
 sjalvolki_conquest.0141.successfully_restored_discipline:0 "Вам удаётся восстановить дисциплину"
 sjalvolki_conquest.0141.unsuccessfully_restored_discipline:0 "Вам не удаётся восстановить дисциплину в лагере"
 sjalvolki_conquest.0141.successfully_profited_from_price_gouging:0 "Затея приносит солидную прибыль"
 sjalvolki_conquest.0141.unsuccessfully_profited_from_price_gouging:0 "Вам удаётся лишь покрыть расходы"
 sjalvolki_conquest.0141.critically_failed_profited_from_price_gouging:0 "Затея оборачивается убытками"
 sjalvolki_conquest.0141.successfully_restored_discipline_price_gouging:0 "Непомерные цены сами собой возвращают в лагерь дисциплину"
 sjalvolki_conquest.0141.unsuccessfully_restored_discipline_price_gouging:0 "Воины возмущены непомерными ценами, и дисциплина падает ещё сильнее"
 
 #sjalvolki_conquest.0120.t:0 "Among The Fields"
 #sjalvolki_conquest.0120.desc:0 "As I join my men in roaming the countryside of Aversaria, we come across a great manor. At its sides are large fields of grain, wine vineyards, and olive trees. I recognize it as a plantation, where the Aversarians work their slaves to death. Likely spurred on by rumors of my approach, some of the slaves have taken up arms against the enforcers tasked with watching them in the fields. A slave spots me as I come closer to get a better look. Desperate, he calls out for help before an Aversarian curses, "Subhuman scum!", and swings his blade. The slave lets out a cry as he is cut down. Beside him, a few slaves pick up rocks and use their numbers to get the advantage on the distracted Aversarian and bash in his skull. Without my help, both sides will tear each other to shreds, leaving everything free for the taking. The loot from a manor like this normally always requires the sacrifice of lives, and better the lives of a few slaves than my men. However, looking into the eyes of the fallen slave who called out to me, I remember the Sjavolki teachings. We are the stewards of the world, we were sent by the gods to destroy evil."
 #sjalvolki_conquest.0120.a:0 "Order the men to hold until the fighting is over."
 #sjalvolki_conquest.0120.b:0 "To arms men, aid the slaves!"
 #sjalvolki_conquest.0120.b.success:0 ""With the help of you and your men, the slaves easily defeat their enemies"
 #sjalvolki_conquest.0120.b.injured:0 "You join your men in assisting the slaves, but are wounded in the fighting"
 #sjalvolki_conquest.0120.b.death:0 "You die at the hands of the slavers"
 #defeat_plantation_aversarians:0 "You will defeat the Aversarians guarding the plantation"
 #
 #sjalvolki_conquest.0121.t:0 "The Liberators And The Liberated"
 #sjalvolki_conquest.0121.desc:0 ""With the battle over, I'm approached by the de-facto leader of the newly freed slaves, [slave_leader.GetName]. They pledge their loyalty to me in thanks, and offer their assistance to my cause, determined to bring down the Aversarians. While [slave_leader.GetName] and his forces are capable, and could join the forces of my army, they've only ever fought in one proper battle. Alternatively, I could ask the newly freed slaves, accustomed to hard labor already, to join the baggage train and help ensuring the supply of all the Sjavolki, who would appreciate the contribution."
 #sjalvolki_conquest.0121.a:0 "I offer them a place in my army, if they're willing."
 #sjalvolki_conquest.0121.b:0 "Have them aid the coalition behind the front lines."
 #
 #sjalvolki_conquest.0122.t:0 "Ruins of the Past"
 #sjalvolki_conquest.0122.desc:0 "As my campaign in the Aversarian countryside has continued, my men have come to me with reports of ruins across the land, and the wealth they've found within. Today, atop a hill, I came across an untouched ruin for myself, crumbling marble white pillars standing among rubble. Though the structure was half sunken into Aeras, the pillars were still far taller than me, almost pointing, urging me to look to the sky above. The symbols of the old age of antiquity. The pure white marble exudes power, still standing centuries after this place was likely abandoned. I've heard stories about these places, this was an old Aversarian academy! My head begins to spin as I picture the priceless relics beneath the surface here. But I remember a dark truth, that the Magi who taught under the stones that now lay crumbled under my feet were practitioners of evil. As I look back to the marble that encaptured me, I could see a visage etched into the pillar now, two chipped away eyes and a cracked and fiendish smile. Unaware of my doubts, my men look to me, ready to dig out the rubble on my command, eager to find any treasures that may lay beneath our feet."
 #sjalvolki_conquest.0122.a:0 "Unwise to disturb places like this, we should move on."
 #sjalvolki_conquest.0122.b:0 "Even the greatest structures must someday fall."
 #sjalvolki_conquest.0122.c:0 "Order the men to dig, perhaps there is hidden knowledge here..."
 #sjalvolki_conquest.0122.d:0 "Tear it all down for its resources. It will help with the war effort."
 
 sjalvolki_conquest.0123.t:0 "Творения рук человеческих"
 sjalvolki_conquest.0123.desc:0 "Первые донесения разведчиков звучали слишком хорошо, чтобы быть правдой. Вилла [Concept('aversaria','аверсарианского')|E] дворянина, полностью заброшенная и оставленная на разграбление? Невероятно!\n\nИ всё же так и оказалось. В винных погребах прятались лишь несколько рабов. Они рассказали, что накануне хозяин бежал, увозя в повозке столько богатств, сколько смог. Сокровищница поместья опустела, но прежний владелец ценил не одно золото. Виллу украшает множество произведений искусства: от мраморных статуй легендарных аверсарианских героев до фресок с безмятежными сельскими видами.\n\nМне невольно хочется пройтись по залам и решить, какая судьба ждёт все эти творения."
 sjalvolki_conquest.0123.a:0 "Подумать только: в сердцах творцов такой красоты жила такая низость..."
 sjalvolki_conquest.0123.b:0 "Ха! В искусстве они явно сильнее, чем в войне с нами."
 sjalvolki_conquest.0123.c:0 "На родине наверняка найдутся богачи, готовые купить военные трофеи."
 sjalvolki_conquest.0123.d:0 "Разбейте, сожгите — делайте что угодно, лишь бы уничтожить эти языческие творения!"
 
 sjalvolki_conquest.0124.t:0 "Коллекционер камней?"
 sjalvolki_conquest.0124.desc:0 "Мои воины берут штурмом очередное [Concept('aversaria','аверсарианское')|E] загородное поместье и вновь с досадой обнаруживают, что хозяин виллы успел бежать со своими богатствами. Зато он оставил здесь довольно... #EMP любопытных#! гостей.\n\n«П-пожалуйста, пощадите!» — умоляет старик, когда его тащат ко мне. «Меня зовут [collector.GetFirstName], я-я всего лишь #EMP историофисос#!. Хозяин виллы просто покровительствовал моему последнему трактату! Я не причиню вам вреда!»\n\nСледом входит один из моих воинов и высыпает на пол мешок разноцветных камней. Старик в ужасе ахает и ползёт к ним. «М-моя коллекция! Невежды! Варвары! Осквернители!»"
 sjalvolki_conquest.0124.a:0 "Перерезать ему глотку и проверить, стоят ли чего-нибудь его побрякушки."
 sjalvolki_conquest.0124.b:0 "Он безобиден. Пусть спокойно возится со своими камнями."
 collector_customtooltip:0 "Некоторые камни выглядят весьма любопытно..."
 strange_skull:0 "Вы получаете странный череп"
 
 sjalvolki_conquest.0125.t:0 "Не просто камни"
 sjalvolki_conquest.0125.desc:0 "«А теперь, старик, объясни, что такого важного в этих камнях», — спрашиваю я, когда ему позволяют подняться.\n\nЕго глаза загораются: кто-то наконец заинтересовался его трудом. «Да #EMP всё#!! Эти образцы собраны в слоях породы по всей Аавтократии. В них заключена история самой нашей земли! Вот гранит из-под Орайсполя, а вот базальт с центральных островов...»\n\nСтарик ведёт меня в свои покои и показывает самые ценные находки: тёмные кости древних существ, некоторые из них всё ещё заключены в камне. Особенно меня привлекает один череп — почти человеческий, но всё же #EMP не совсем#!.\n\n«Ах!» — восклицает старик, снимая его с полки. «Представьте, я нашёл его на ферме в самом сердце Империи. Глубоко под землёй, там, где почва переходит в камень. Я пытался установить, кому он принадлежал, но так ничего и не выяснил». Он вкладывает череп мне в руки. «Забирайте. Мой старый ум уже узнал от него всё, что мог»."
 sjalvolki_conquest.0125.a:0 "Благодарю, Ксенофан. Он займёт почётное место в моих чертогах."
 sjalvolki_conquest.0125.b:0 "Это твоё открытие, и оно должно остаться с тобой."
 
 sjalvolki_conquest.0126.t:0 "Берсерк"
 sjalvolki_conquest.0126.desc:0 "Засада заканчивается так же быстро, как началась: [Concept('aversaria','аверсарианский')|E] патруль за считаные минуты перебит или обращён в бегство. Осматривая поле боя, я замечаю воина, на которого остальные смотрят с благоговением. Он один стоит на груде свежих трупов, залитый кровью и тяжело дышащий, а в огромных руках свободно держит два устрашающе изогнутых топора. Месяц назад он присоединился к нашему отряду вместе с небольшой ватагой присягнувших сьялволков, но лишь теперь мне довелось увидеть его свирепое мастерство. Настоящий сьялвольский берсерк среди нас — не думал[Select_CString(ROOT.Char.IsFemale, 'а', '')], что когда-нибудь увижу такое."
 sjalvolki_conquest.0126.a:0 "Нам нужны такие воины!"
 sjalvolki_conquest.0126.b:0 "Да он безумец!"
 
 sjalvolki_conquest.0127.t:0 "Сарминская воительница"
 sjalvolki_conquest.0127.desc:0 "У меня внутри всё сжимается при виде [Concept('aversaria','аверсарианца')|E] в полном доспехе, который верхом несётся на одного из наших воинов. Даже издалека грохот копыт звучит пугающе громко, а я слишком далеко, чтобы помочь соратнику. Когда его гибель уже кажется неизбежной, мимо моего левого уха со свистом проносится стрела. Аверсарианский гиппаранопехи застывает в седле: из забрала торчит древко. Всадник валится на землю, едва не придавив ошеломлённую жертву, а его конь уносится прочь.\n\nОбернувшись, я вижу странную женщину, которая присоединилась к нам несколько дней назад. Она с явным удовлетворением осматривает результат выстрела, снимает тетиву с изящно изогнутого лука и убирает оружие. Кожаный шлем висит у неё на поясе, и по перьям в туго заплетённых волосах я узнаю бывалую сарминскую воительницу. Вероятно, с широколезвийным копьём она не менее смертоносна, чем с луком. О доблести этих женщин сложено немало песен, и такая союзница будет бесценна."
 sjalvolki_conquest.0127.a:0 "Она будет сражаться рядом с нами!"
 sjalvolki_conquest.0127.b:0 "Странная. Лучше держаться от неё подальше."
 
 sjalvolki_conquest.0128.t:0 "Лунные сородичи"
 sjalvolki_conquest.0128.desc:0 "Небольшая группа мондекни, присоединившаяся к нам несколько недель назад, быстро доказала свою ценность. Сначала воины относились к ним с подозрением: те ставили лагерь поодаль и явно избегали открытых столкновений с врагом. Мнение стало меняться, когда наши скудные припасы пополнились несколькими десятками добытых кроликов, словно взявшихся из ниоткуда, а мондекни показали, какие местные клубни и коренья съедобны и даже вкусны после приготовления. Когда их разведчики предупредили нас об [Concept('aversaria','аверсарианской')|E] засаде, которая наверняка погубила бы весь отряд, странные портенчантцы — теперь мы знаем их как Лунных сородичей — в одночасье заслужили всеобщее восхищение.\n\nНекоторые мои соплеменники советуют обратиться к их предводителю и сделать этот союз постоянным."
 sjalvolki_conquest.0128.a:0 "Вы нужны нам здесь."
 sjalvolki_conquest.0128.b:0 "Нам нужны воины, а не лесники."
 
 sjalvolki_conquest.0129.t:0 "Налётчик"
 sjalvolki_conquest.0129.desc:0 "Вечером в наш лагерь в одиночку входит громадный сьялволк, от которого несёт потом и кровью. Мои люди напрягаются, руки сами тянутся к топорам и щитам: от воина почти ощутимо веет жаждой крови и наживы. Напряжение спадает, когда он бросает к моим ногам тяжёлый мешок, из которого высыпаются серебряные кубки и украшения, а затем неожиданно красноречиво излагает своё предложение. Он поможет нам грабить [Concept('aversaria','аверсарианские')|E] земли — дело, в котором отлично разбирается, — если получит долю добычи. До недавнего времени его собственная шайка занималась тем же, пока не столкнулась с превосходящими силами местных. Он оказался единственным, кто пережил тот бой."
 sjalvolki_conquest.0129.a:0 "Выгодную сделку я узнаю сразу!"
 sjalvolki_conquest.0129.b:0 "Именем [ROOT.Char.GetFaith.HighGodNamePossessive], мы завоеватели, а не разбойники!"
 
 sjalvolki_conquest.0130.t:0 "Кровавый пир"
 sjalvolki_conquest.0130.desc:0 "Сьялвольская коалиция объединяет множество племён и народов. Среди них есть кардаваи, чьи религиозные обычаи весьма... #EMP необычны#!. Они верят, что попасть в священную загробную обитель можно, лишь предъявив доказательства своих побед над врагами. Чтобы всегда носить такое свидетельство с собой и забрать его в загробную жизнь, кардаваи ритуально готовят и поедают плоть поверженных противников.\n\nМоих воинов других верований мутит от вида воинов кардавай, срезающих мясо с павших врагов, и от запаха плоти, жарящейся на кострах. Теперь недовольные пришли ко мне и требуют немедленно положить этому конец."
 sjalvolki_conquest.0130.a:0 "Разве нам дано судить чужую веру?"
 sjalvolki_conquest.0130.b:0 "Пусть так велит их вера, но #EMP наша#! велит вешать людоедов."
 sjalvolki_conquest.0130.c:0 "Не суди, пока не попробуешь. Оставьте мне кусок!"
 
 #sjalvolki_conquest.0131.t:0 "The Grand Menagerie"
 #sjalvolki_conquest.0131.desc:0 "My men excitedly guide me through the city to their most recent conquest, though the infernal commotion of animal noises makes the location obvious well before we arrive at the battered down gates to the Aversarian palace housing what they tell me is a 'menagerie' of sorts. When they broke down the gates the only humans they found within were a handful of caretaker slaves who had apparently been locked inside when the owner of this opulent estate fled.\n\nThe interior is a complex of massive cages, pits, and rectangular ponds holding all manner of strange beasts - many of which have been driven to excitement and terror by the noise of the city being sacked outside the walls. Some we recognize: wolves, bears, and a stable of beautifully bred horses. Others are complete mysteries: strangely built men covered in coarse dark hair who howl wordlessly at me when I approach their cage, birds with feathers the color of jewels, and an odd creature built like a horse but with a neck longer than the height of three men, and a single jewel-like horn crowning its skull. Most impressively of all however is the mammoth. While known to us in story and song, such giants were thought lost when the fog consumed our homeland. My men are already eagerly divvying up the spoils, and waiting for me to stake out a claim on my share of the loot."
 #sjalvolki_conquest.0131.a:0 "I pick the noble wolf!"
 #sjalvolki_conquest.0131.a.success:0 "success"
 #sjalvolki_conquest.0131.a.injured:0 "injured"
 #sjalvolki_conquest.0131.a.death:0 "death"
 #sjalvolki_conquest.0131.b:0 "Do you think I'm mad? A horse of course!"
 #sjalvolki_conquest.0131.c:0 "The mammoth! I want to ride the mammoth!"
 #sjalvolki_conquest.0131.c.success:0 "success"
 #sjalvolki_conquest.0131.c.injured:0 "injured"
 #sjalvolki_conquest.0131.c.death:0 "death"
 #sjalvolki_conquest.0131.d:0 "Take the mammoth - its meat will feed the army for weeks."
 #tamewolf_tooltip:0 "Attempt to tame the Dread Wolf"
 #gethorse_tooltip:0 "Take the Warhorse"
 #tamemammoth_tooltip:0 "Attempt to tame the Mammoth"
 
 sjalvolki_conquest.0132.t:0 "Победителю..."
 sjalvolki_conquest.0132.desc:0 "Я иду по городским улицам, вдыхая запах горящего дерева и пролитой крови. Битва почти закончена, лишь в переулках и подвалах ещё держатся немногочисленные защитники.\n\nКак и во всех войнах с незапамятных времён, победители начинают обыскивать город и забирать то, что теперь принадлежит им по праву. И кто я, чтобы лишать своих воинов этой возможности? Почему [Concept('aversaria','аверсарианцев')|E] нужно щадить от участи, которой они подвергли столько других народов? Осталось решить лишь одно: потребовать ли часть богатств себе..."
 sjalvolki_conquest.0132.a:0 "В их арсеналах наверняка найдётся что-нибудь ценное..."
 sjalvolki_conquest.0132.b:0 "Какие великие труды хранят их библиотеки?"
 sjalvolki_conquest.0132.c:0 "Найдите сокровищницу — она должна ломиться от богатств!"
 sjalvolki_conquest.0132.d:0 "Мои воины выиграли битву и заслужили всю добычу."
 
 sjalvolki_conquest.0133.t:0 "...достаётся добыча"
 sjalvolki_conquest.0133.desc:0 "Этот арсенал явно принадлежал прославленному кузнецу: оставшиеся здесь незаконченные образцы оружия и доспехов превосходят качеством почти всё, что доводилось видеть на востоке.\n\nНо больше всего меня привлекает небольшой сундук с готовыми изделиями, который хозяин бросил при бегстве и до которого ещё не добрались мои воины. Что же выбрать..."
 sjalvolki_conquest.0133.a:0 "Вот это достойно моего положения!"
 sjalvolki_conquest.0133.b:0 "Нет, лучше взять это. Оно мне пригодится."
 sjalvolki_conquest.0133.c:0 "Мне ничего не нужно. Пусть выбирает стража."
 
 sjalvolki_conquest.0134.t:0 "...достаётся добыча"
 sjalvolki_conquest.0134.desc:0 "Хотя библиотека полна бумаги и пергамента, недавняя осада её не коснулась — редкая удача для городского здания.\n\nЯ провожу рукой по книжным корешкам, гадая, какие тайны скрыты внутри. Магические трактаты? Эпические поэмы? Древние хроники? Почти наугад я снимаю с полки два тяжёлых, богато украшенных тома и взвешиваю их в руках. Что же выбрать..."
 sjalvolki_conquest.0134.a:0 "Книгу в левой руке."
 sjalvolki_conquest.0134.b:0 "Книгу в правой руке."
 sjalvolki_conquest.0134.c:0 "Вообще-то, чтение никогда меня не привлекало."
 
 sjalvolki_conquest.0135.t:0 "...достаётся добыча"
 sjalvolki_conquest.0135.desc:0 "Несколько часов мы бьём по замку большой дворянской сокровищницы молотами, рубим и пытаемся поддеть его, пока запор наконец не ломается и дверь не распахивается. Владельцы вывезли почти всё золото, но от оставшихся богатств всё равно захватывает дух: бесценные древности, прекрасные произведения искусства и артефакты дороже всего, что видели многие поколения моих предков.\n\nВ глубине сокровищницы мой взгляд привлекают несколько предметов, спрятанных в сундуках или завёрнутых в ткань. Трудно удержаться от мысли выбрать один для себя..."
 sjalvolki_conquest.0135.a:0 "Возьму то, что лежит в сундуке под столом."
 sjalvolki_conquest.0135.b:0 "Вот этот свёрток в шёлковой ткани."
 sjalvolki_conquest.0135.c:0 "Мне не нужны дорогие побрякушки."
 
 sjalvolki_conquest.0138.t:0 "У костра"
 sjalvolki_conquest.0138.desc:0 "Солнце уже село, и воины нашего отряда устраиваются на ночлег, когда [realm_priest.GetName] подходит к костру и бросает свежее полено на догорающие угли. «Дед моего деда и представить не мог, что существует такая земля, — начинает [realm_priest.GetSheHe]. — С тех пор многое изменилось, и перемены ещё не закончены. Мы потеряли могилы предков, но не обязаны терять память об их деяниях». Ясно, что [realm_priest.GetSheHe] собирается поведать историю и ждёт, какую тему я выберу."
 sjalvolki_conquest.0138.a:0 "Поведай, за что мы сражаемся."
 sjalvolki_conquest.0138.b:0 "Сегодня я хочу услышать о богах."
 sjalvolki_conquest.0138.c:0 "Мне не до сказок. Несите эль!"
 
 sjalvolki_conquest.0139.t:0 "За что мы сражаемся"
 sjalvolki_conquest.0139.desc:0 "[realm_priest.GetName] начинает рассказ.\n\n«Наш народ в бегах уже почти два поколения. Когда-то дед поведал мне о дне, когда раскололся [Concept('aervalr','Аэрвалр')|E], а небесные боги выпустили в мир [Concept('the_fog','Туман')|E], карая высокомерие [Concept('aversaria','аверсарианцев')|E] и гордыню Убийцы Миров.\n\nОн говорил, что Туман подкрался незаметно. Люди укрылись в овраге от огненного дождя, испепелившего Аккенстад с его сотней святилищ и рощ. Утро казалось прекрасным, почти утешением после ужасов минувшей ночи, но затем начался шёпот. Вскоре серое море хлынуло в овраг, и люди закричали. Семьи, укрывшиеся глубже остальных и потому пережившие огонь, оказались погребены в собственном убежище. За беглецами гнались бледные кошмары, уродовавшие плоть.\n\nВаши предки пережили то же, что и мои. Месяцы сменялись годами, страшный Туман из ручейка превратился в потоп и поглотил нашу прекрасную родину. Вот почему мы сражаемся: чтобы выжить и отомстить за павших тем, чья гордыня едва не погубила мир»."
 sjalvolki_conquest.0139.a:0 "Мы проделали долгий путь."
 sjalvolki_conquest.0139.b:0 "И впереди ещё столько же."
 
 sjalvolki_conquest.0140.t:0 "О богах и божественной войне"
 sjalvolki_conquest.0140.desc:0 "«В эпоху, предшествовавшую нашей, Велос и боги Эраса подняли оружие против Небесных богов. Те забыли о справедливости и задумали похитить прекрасную Уреху, сестру Велоса. Их царство походило на наше, но было создано из вещества озарённых солнцем небес. Их слуги имели человеческий облик, но состояли из ледяной серости облаков, не знали песен и не ведали ни радости, ни милосердия. Так два первых племени вступили в войну, расколовшую прекрасную зелёную землю и разверзшую небеса. Пышные сады Урехи сгорели дотла, а сладкие, словно мёд, воды Варпалиса покраснели от крови и соли. Даже жестокий Пеквон и загадочный Замистра присоединились к своим родичам в борьбе против Высших богов, но всё было тщетно.\n\nКогда для Эраса настал самый тёмный час, один из Небесных богов заплакал при виде бессмысленной гибели. Он задумал обманом лишить собственное племя преимущества и вынудить обе стороны заключить перемирие». Так начинает [realm_priest.GetName] и рассказывает до глубокой ночи."
 sjalvolki_conquest.0140.a:0 "Давняя эпоха легенд."
 sjalvolki_conquest.0140.b:0 "Всего лишь сказки... правда?"
 
 #sjalvolki_conquest.0141.t:0 "Partic Enigmas"
 #sjalvolki_conquest.0141.desc:0 "I'm surveying my warband's camp in the evening when I notice the cadre of Partics who joined us some days ago clustered around a massive oak. They are speaking in hushed tones and clearly do not wish to be disturbed, the entire site is ringed by a loose circle of armed guards bearing presumably religious symbols scrawled on bleached white headbands. These strange people were welcome additions to the Imperrech, and for all their bizarre and inscrutable customs have been worthy allies, but I can't help but be curious. Perhaps I should approach and inspect these odd goings on? It is after all my camp."
 #sjalvolki_conquest.0141.a:0 "Best leave them be."
 #sjalvolki_conquest.0141.b:0 "It's my camp and I deserve to know!"
 
 sjalvolki_conquest.0142.t:0 "Столкновение с тайнами партиков"
 sjalvolki_conquest.0142.desc:0 "Подойдя ближе, я успеваю заметить происходящее. Три партикских друида нараспев произносят непонятные слова и, похоже, прикололи тушку зайца ножом к дереву. Больше я ничего не вижу: двое молчаливых воинов-партиков преграждают мне путь и заслоняют друидов. «Нет. Не для твоих глаз. Прошу. Прошу», — с трудом говорят они на моём языке, пытаясь меня прогнать. На все настойчивые вопросы я слышу лишь что-то о «вслушивании в сердцебиение» и «разговоре с духом Серфли». Понятия не имею, что это значит. Может, пора уйти?"
 sjalvolki_conquest.0142.a:0 "Они ведь никому не вредят..."
 sjalvolki_conquest.0142.b:0 "Вы забыли, что идёт война? Займитесь чем-нибудь полезным!"
 dontdothisoryoullgetshanked:0 "Партики непредсказуемы. Такое вмешательство может их спровоцировать..."
 
 sjalvolki_conquest.0143.t:0 "Смертельные тайны партиков"
 sjalvolki_conquest.0143.desc:0 "Я пытаюсь пройти мимо стражей, и дело быстро доходит до открытой схватки. Один из воинов внезапно теряет терпение и отталкивает меня древком копья. Тут на меня бросаются ещё двое: ножи обнажены, в глазах горит негодование. Друиды даже не думают прерывать обряд. В одно мгновение я понимаю: дело куда серьёзнее, чем казалось. Придётся защищаться!"
 sjalvolki_conquest.0143.a:0 "Постойте... прекратите!"
 sjalvolki_conquest.0143.a.failure:0 "Вам едва удаётся спастись"
 sjalvolki_conquest.0143.a.critical_failure:0 "Партики убивают вас"
 
 sjalvolki_conquest.0144.t:0 "Враждующие кланы"
 sjalvolki_conquest.0144.desc:0 "За последние несколько дней ко мне явились посланники двух кланов. Каждый обвиняет другой и утверждает, что только его клан имеет законное право на золотую статую из разграбленного поместья. Я как раз прохожу через эти земли, и потому меня просят определить настоящего владельца. Статую нашли воины первого клана. Они разбили охранявший её вражеский отряд и ворвались в поместье, оставив союзникам завершать битву. Попытка свести посланников лицом к лицу закончилась дракой: страже пришлось разнимать их, пока оба кричали, что соперник позорит себя ложью. Теперь каждый просит решить спор в его пользу. Клан, первым захвативший статую, предлагает мне долю прочей добычи, а клан, завершивший бой, обещает переплавить её и поделить золото."
 sjalvolki_conquest.0144.a:0 "Принять подношение: золото, пожалуй, дороже статуи."
 sjalvolki_conquest.0144.b:0 "Лучше показать ценность сотрудничества. Переплавить и разделить."
 sjalvolki_conquest.0144.c:0 "Пусть докажут своё право на добычу!"

 sjalvolki_conquest.0145.t:0 "Пленный маг"
 sjalvolki_conquest.0145.desc:0 "Мои воины приводят ко мне [Concept('aversaria','аверсарианского')|E] [Concept('magi','мага')|E], захватив [aversarian_magi.GetHerHim] в разгар битвы. Пока [aversarian_magi.GetSheHe] осыпал[Select_CString(aversarian_magi.IsFemale, 'а', '')] моё войско заклинаниями, небольшой отряд подкрался к [aversarian_magi.GetHerHim] сзади и оглушил [aversarian_magi.GetHerHim]. Теперь пленник стоит передо мной на коленях со связанными руками и говорит на ломаном [ROOT.Char.GetCulture.GetName]. «П-пожалуйста, пощадите меня. Я [aversarian_magi.GetName]. Я могу служить вам, великий господин. У меня огромная сила». Слёзы текут по [aversarian_magi.GetHerHis] лицу, когда [aversarian_magi.GetSheHe] поднимает на меня взгляд. [aversarian_magi.GetHerHis|U] предложение сначала кажется заманчивым: аверсарианские маги славятся могуществом. Но [aversarian_magi.GetSheHe] попал[Select_CString(aversarian_magi.IsFemale, 'ась', '')] в плен, сражаясь против моих воинов, и, возможно, заслуживает смерти. Можно также пощадить [aversarian_magi.GetHerHim], но оставить [aversarian_magi.GetHerHim] без силы — от такого наказания заплачет любой аверсарианец."
 sjalvolki_conquest.0145.a:0 "Никакой пощады. Подайте мне меч!"
 sjalvolki_conquest.0145.b:0 "Отрубить [aversarian_magi.GetHerHis] руки и изгнать [aversarian_magi.GetHerHim]."
 sjalvolki_conquest.0145.c:0 "[aversarian_magi.GetSheHe|U] ещё пригодится. Предложить [aversarian_magi.GetHerHim] помилование за пожизненную службу."

 sjalvolki_conquest.0146.t:0 "Разграбление города"
 sjalvolki_conquest.0146.desc:0 "Мои войска перелезают через стены, а защитники бегут перед ними. Воины начинают жадно поглядывать на всё вокруг. Сначала поодиночке, а затем всё большими группами, по мере гибели врагов, они покидают строй и с оружием в руках устремляются по улицам под крики горожан. Один выбивает дверь и убивает прятавшихся за ней людей, другой отбирает имущество у дрожащего купца. К тому времени, когда гибнут последние защитники, порядок на улицах уже рушится. Когда к дому богача подносят факел и здание вспыхивает, я понимаю, что пора вмешаться. Воины будут благодарны, если позволить им грабить сколько душе угодно, но тогда я рискую полностью утратить над ними власть."
 sjalvolki_conquest.0146.a:0 "Пусть воины повеселятся. Они это заслужили."
 sjalvolki_conquest.0146.b:0 "Всё зашло слишком далеко. Остановить их."
					   
 sjalvolki_conquest.0147.t:0 "Наутро"
 sjalvolki_conquest.0147.desc:0 "Солнце поднимается над разорённым городом. Улицы усеяны телами в изорванной, залитой кровью одежде. Обгоревшие остовы зданий отмечают места, где ещё вчера жили люди. После грабежа весь порядок исчез, и воины спят где придётся. Переступая через труп, я замечаю двух своих людей, которые дерутся из-за мешочка с золотом, отнятого у бывшего жителя города. Победа одержана, но поселение теперь почти бесполезно для нас. Немногие беженцы наверняка разнесут повсюду рассказы о том, что мы именно такие варвары, какими они нас считали. Потребуется время, чтобы снова навести в войске порядок."
 sjalvolki_conquest.0147.a:0 "Они лишь заплатили цену поражения."
 sjalvolki_conquest.0147.b:0 "Это была ошибка, которую нельзя повторять."
 
 sjalvolki_conquest.0148.t:0 "священник и беженцы"
 sjalvolki_conquest.0148.desc:0 "священник с беженцами укрылся в храме и просит безопасного прохода — в глубине замечаю несколько подозрительных людей"
 sjalvolki_conquest.0148.a:0 "они и так страдают — отпустить их с миром"
 sjalvolki_conquest.0148.b:0 "лучше не выпускать их отсюда"
 
 sjalvolki_conquest.0149.t:0 "засада"
 sjalvolki_conquest.0149.desc:0 "через несколько дней те подозрительные люди устраивают засаду — похоже, это партизаны"
 sjalvolki_conquest.0149.a:0 "следовало догадаться..."
 sjalvolki_conquest.0149.b:0 "аверсарианские псы!"
 
 sjalvolki_conquest.0150.t:0 "драма в храме"
 sjalvolki_conquest.0150.desc:0 "в храме всё выходит из-под контроля — аверсарианцы жалуются"
 sjalvolki_conquest.0150.a:0 "отпустить их и дать немного денег"
 sjalvolki_conquest.0150.b:0 "пусть убираются — запереть их"
 
 sjalvolki_conquest.0151.t:0 "начинается пожар"
 sjalvolki_conquest.0151.desc:0 "вспыхивает драка, затем пожар — погибает множество мирных жителей"
 sjalvolki_conquest.0151.a:0 "боги..."
 sjalvolki_conquest.0151.b:0 "пусть горят"
 
 
 the_sjalvolki_conquest_story_name:0 "Переселение сьялволков"
 the_sjalvolki_conquest_story_desc:0 "Стремительное, катастрофическое наступление [Concept('the_fog','Тумана')|E] погнало на запад целую волну народов, ищущих новый дом. Хотя во главе переселения идут сьялволки, на деле это хаотический поток бесчисленных племён и культур. Некоторые даже не участвуют в главном вторжении в [Concept('aversaria','Аверсарию')|E], а ищут более необычные земли вдоль побережья [Concept('the_continent','Континента')|E].\n\nВ сочетании с разрушительной анархией, охватившей саму [Concept('aversaria','Аверсарию')|E], #E Переселение сьялволков#! наверняка станет одним из самых бурных периодов в истории Эраса."
 
