l_russian:
 sjalvolki_conquest.0001.t:0 "Место под солнцем"
 sjalvolki_conquest.0001.desc:0 "Я до сих пор хорошо помню прежнюю родину. Она навсегда останется в моём сердце, но последние воспоминания о ней мрачны. Рядом с холодным севером, поглощённым Туманом, Расколотое побережье, куда нас [Select_CString(attacker.IsFemale, 'привела', 'привёл')] [attacker.GetTitledFirstName], кажется раем — и достанется он тем, кому хватит решимости его взять.\n\n[Concept('aversaria','Аверсария')|E] умирает. Любого храбреца отделяет от славы и собственных земель всего один великий подвиг. Пока войска Имперреха готовятся к вторжению, каждый может присоединиться к общему делу и прославить своё имя в этом новом мире.\n\nХватит ли мне решимости?"
 sjalvolki_conquest.0001.a:0 "Я соберу отважных людей и присоединюсь к войску!"
 sjalvolki_conquest.0001.b:0 "Сейчас мне мешают личные дела, но позже я ещё смогу присоединиться."
 sjalvolki_conquest.0001.c:0 "Меня устраивает то, что у меня есть. Песни в мою честь мне ни к чему."
 
 sjalvolki_conquest.0003.t:0 "Имперрех приближается"
 sjalvolki_conquest.0003.desc:0 "Пусть [attacker.GetTitledFirstName] и доказал[Select_CString(attacker.IsFemale, 'а', '')], что может вести наш народ, я всегда считал[Select_CString(ROOT.Char.IsFemale, 'а', '')], что вернее всего к славе ведёт непроторённый путь. Я отправил[Select_CString(ROOT.Char.IsFemale, 'ась', 'ся')] в самое сердце вражеских земель, чтобы без помощи огромного войска Имперреха добыть себе славное имя и собственное владение. Поход удался на славу и наверняка войдёт в песни, но теперь он близится к концу.\n\nДозорные [attacker.GetFirstName] уже стали привычным зрелищем в округе, а сегодня к моему двору прибыл посланник. Он привёз дары, любезные речи и весьма выгодные условия официального вступления в коалицию. Все земли, которые мне удалось захватить собственной хитростью, останутся за мной и не будут поделены между десятком мелких вождей.\n\nНо что будет, если я откажусь?.."
 sjalvolki_conquest.0003.a:0 "Скоро я присоединюсь к главному войску."
 sjalvolki_conquest.0003.b:0 "Я уже не стану подчиняться прихотям шаткой коалиции [attacker.GetFirstName]!"
 
 sjalvolki_conquest.0004.t:0 "Имперрех приближается"
 sjalvolki_conquest.0004.desc:0 "Беды далёкой Калатипсоми дошли и до нашего порога. Теперь [attacker.GetFirstName] натравил[Select_CString(attacker.IsFemale, 'а', '')] на наши земли [attacker.GetHerHis] псов, и вскоре я рискую остаться без владений, а при худшем исходе — и без головы.\n\nМестные военачальники уже собирают сопротивление, но прежний опыт подсказывает, что всё напрасно. Можно пасть к ногам варварского правителя и вымолить право сохранить хотя бы клочок своих земель... но стоит ли так унижаться?"
 sjalvolki_conquest.0004.a:0 "Придётся торговаться с варваром."
 sjalvolki_conquest.0004.b:0 "Пусть меня съедят черви, если я паду так низко!"
 sjalvolki_conquest.0004.c:0 "Возможно, у нас ещё есть время бежать!"
 
 sjalvolki_conquest.0005.t:0 "Предложение мира"
 sjalvolki_conquest.0005.desc:0 "Ко мне прибыл посланник от [aversarian_mercy_requester.GetTitledFirstName], довольно влиятельного местного [Concept('aversaria','аверсарианского')|E] землевладельца. Ещё не успев объяснить цель визита, он пал передо мной ниц и принялся превозносить моё имя — насколько искренни эти речи, большой вопрос.\n\nРазумеется, вслед за похвалами прозвучала просьба позволить землевладельцу «присоединиться» к Имперреху и сохранить хотя бы часть [aversarian_mercy_requester.GetHerHis] земель."
 sjalvolki_conquest.0005.a:0 "Говорят, [aversarian_mercy_requester.GetTitledFirstName] славится справедливостью и честностью; [aversarian_mercy_requester.GetSheHe] может сохранить [aversarian_mercy_requester.GetHerHis] главный титул."
 sjalvolki_conquest.0005.b:0 "Пусть [aversarian_mercy_requester.GetSheHe] сохранит одно владение, но не более."
 sjalvolki_conquest.0005.c:0 "[aversarian_mercy_requester.GetFirstName] — двуличная и вероломная змея. Слово [aversarian_mercy_requester.GetHerHis] ничего не стоит."
 
 sjalvolki_conquest.0006.t:0 "Горькое предложение"
 sjalvolki_conquest.0006.desc:0 "Пришёл ответ от [attacker.GetTitledFirstName]. Условия не назвать щедрыми, но они хотя бы терпимы. В обмен на капитуляцию без полного разгрома мне позволят сохранить [title_to_be_kept.GetName] и всех законных вассалов этого титула. Остальные владения конфискуют и раздадут неотёсанным грубиянам из «двора» [attacker.GetFirstName].\n\nПосланник с нетерпением ждёт ответа. Лучше согласиться, и поскорее."
 sjalvolki_conquest.0006.a:0 "Надеюсь, мне больше не придётся иметь дело с этими дикарями."
 sjalvolki_conquest.0006.b:0 "Эти условия смехотворны!"
 
 sjalvolki_conquest.0007.t:0 "Предложение отвергнуто"
 sjalvolki_conquest.0007.desc:0 "[attacker.GetTitledFirstName] вернул[Select_CString(attacker.IsFemale, 'а', '')] моего посланника с пустыми руками. Вот же варварское отродье! Ведь [attacker.GetSheHe] совершенно не желает принимать мою присягу и намерен[Select_CString(attacker.IsFemale, 'а', '')] силой смести любое сопротивление, что бы я ни делал[Select_CString(ROOT.Char.IsFemale, 'а', '')].\n\nЯ не нахожу себе места. Мало того что пришлось унижаться и молить варвара о милости, так мои унижения лишь заставили [attacker.GetHerHim] плюнуть мне в лицо!"
 sjalvolki_conquest.0007.a:0 "Будь что будет, я утащу за собой как можно больше сьялвольской мрази!" 
 
 sjalvolki_conquest.0010.t:0 "Место под солнцем"
 sjalvolki_conquest.0010.desc:0 "Еды вдоволь, мёд льётся рекой, а мои спутники празднуют победу. Наши воины сокрушили последние [Concept('aversaria','аверсарианские')|E] очаги сопротивления в округе, вновь доказав превосходство нашего народа и нашего дела. За столами пересказывают истории о подвигах, которые потомки будут воспевать веками, и о захваченных несметных богатствах.\n\nПосреди празднества [attacker.GetTitledFirstName] приглашает меня на пир для ближайших сподвижников, подальше от простых воинов. Здесь веселятся сдержаннее, и вскоре я понимаю, зачем меня позвали. Землям [title_to_be_given.GetName] нужен новый правитель, и за мою храбрость в бою их решили предложить мне."
 sjalvolki_conquest.0010.a:0 "Для меня это будет честью."
 sjalvolki_conquest.0010.b:0 "Вообще-то, мне приглянулись другие земли..."
 sjalvolki_conquest.0010.c:0 "Земли в этой области меня не интересуют."
 sjalvolki_conquest.0010.d:0 "Земли?! Мне нужна слава!"
 
 sjalvolki_conquest.0011.t:0 "Место под солнцем"
 sjalvolki_conquest.0011.desc:0 "Еды вдоволь, мёд льётся рекой, а мои спутники празднуют победу. Наши воины сокрушили последние [Concept('aversaria','аверсарианские')|E] очаги сопротивления в округе, вновь доказав превосходство нашего народа и нашего дела. За столами пересказывают истории о подвигах, которые потомки будут воспевать веками, и о захваченных несметных богатствах.\n\nМне не предложили земель: то ли мои заслуги пока остались незамеченными, то ли награда уже была получена раньше. Но и добытая слава сама по себе дорогого стоит!"
 sjalvolki_conquest.0011.a:0 "О моих великих подвигах сложат песни!"
 sjalvolki_conquest.0011.b:0 "Моя награда ещё найдёт меня..."
 
 sjalvolki_conquest.0012.t:0 "Милосердное предложение"
 sjalvolki_conquest.0012.desc:0 "От [attacker.GetTitledFirstName] пришло неожиданное предложение. При дворе, похоже, уже наслышаны о моих сострадании и чести, и теперь мне предлагают мягкие условия капитуляции. За мной оставят все земли, которыми я владею лично, и вассалов титула [title_to_be_kept.GetName], создав убежище для изгнанных аверсарианцев. Ни один сьялволк не поселится в моих владениях, а после роспуска Имперреха я больше не буду подчиняться ни королю, ни королеве.\n\nПосланник с нетерпением ждёт ответа. Лучше согласиться, и поскорее."
 sjalvolki_conquest.0012.a:0 "Мне предстоит хранить последние искры мёртвой империи?"
 sjalvolki_conquest.0012.b:0 "Эти условия смехотворны!"
 
 sjalvolki_conquest.0100.t:0 "Смерть воина"
 sjalvolki_conquest.0100.desc:0 "Я лежу в луже собственной крови, а вокруг всё ещё гремит битва. Что произошло? Мне холодно, голова кружится. Я пытаюсь позвать на помощь, но не могу вымолвить ни слова.\n\nМир меркнет. Последнее, что я вижу, — приближающийся соратник, в чьём взгляде читается... жалость?"
 sjalvolki_conquest.0100.a:0 "Он вонзает в меня меч, и тьма поглощает всё."
 
 sjalvolki_conquest.0101.t:0 "Военная добыча"
 sjalvolki_conquest.0101.desc_intro:0 "Мы со спутниками [SelectLocalization(Or(LessThanOrEqualTo_int32(GetPlayer.GetAIBoldness,'(int32)-50'), GetPlayer.HasTrait(GetTrait('patient').Self)), 'осторожно ', SelectLocalization(Or(GreaterThanOrEqualTo_int32(GetPlayer.GetAIBoldness,'(int32)50'), GetPlayer.HasTrait(GetTrait('impatient').Self)),'смело ',''))]едем по землям [villa_location.GetNameNoTier], разыскивая врага по приказу [attacker.GetTitledFirstName], когда в глухом, почти забытом уголке натыкаемся на виллу. Похоже, война её совсем не коснулась."
 sjalvolki_conquest.0101.desc_intro_sadistic:0 "Мы со спутниками [SelectLocalization(Or(LessThanOrEqualTo_int32(GetPlayer.GetAIBoldness,'(int32)-50'), GetPlayer.HasTrait(GetTrait('patient').Self)), 'методично ', SelectLocalization(Or(GreaterThanOrEqualTo_int32(GetPlayer.GetAIBoldness,'(int32)50'), GetPlayer.HasTrait(GetTrait('impatient').Self)),'смело ',''))]сеем смерть и разрушение по землям [villa_location.GetNameNoTier] — разумеется, во славу [attacker.GetTitledFirstName] — когда в глухом, почти забытом уголке натыкаемся на виллу. Похоже, война её совсем не коснулась."
 sjalvolki_conquest.0101.desc_owners_absent:0 "\n\nПока что.\n\nСудя по всему, прежние жильцы либо мертвы, либо давно ушли туда, где жизнь спокойнее[SelectLocalization(GetPlayer.HasTrait(GetTrait('sadistic').Self),'... какая жалость.','.')] Так или иначе, всё оставшееся здесь по праву наше!"
 sjalvolki_conquest.0101.desc_owners_alive:0 "\n\nПока что.\n\nПодойдя ближе, мы замечаем, что вилла обитаема. Хозяин дома нервно выходит нас встречать, предлагает еду и ночлег и уверяет, что никто здесь не угрожает нашему делу. Впрочем, при желании мы вправе забрать куда больше, чем он предлагает..."
 sjalvolki_conquest.0101.a_occupants_absent:0 "Что ж, не стану отказываться!"
 sjalvolki_conquest.0101.a_occupants_absent_sadistic:0 "Жаль, что хозяев нет дома."
 sjalvolki_conquest.0101.a_occupants_present:0 "Мы возьмём всё, что пожелаем, старик."
 sjalvolki_conquest.0101.a_occupants_present_sadistic:0 "Пора немного развлечься."
 sjalvolki_conquest.0101.a_patient_or_greedy:0 "Обыщите каждый угол[SelectLocalization(GetPlayer.HasTrait(GetTrait('greedy').Self),', мне нужно всё!','.')]"
 sjalvolki_conquest.0101.b_occupants_absent:0 "Всё это послужит нашему войску."
 sjalvolki_conquest.0101.b_occupants_present:0 "Теперь это место принадлежит [attacker.GetFirstName]. Собирайтесь и уходите."
 sjalvolki_conquest.0101.c:0 "Воины, всё здесь ваше!"
 sjalvolki_conquest.0101.e:0 "Оставлю этих людей в покое."
 sjalvolki_conquest.0101.e_paranoid:0 "А если это ловушка?"
 
 sjalvolki_conquest.0101.good_profit:0 "Вам удаётся найти множество ценностей"
 sjalvolki_conquest.0101.decent_profit:0 "Вам удаётся найти немало ценностей"
 sjalvolki_conquest.0101.trifling_profit:0 "Вам удаётся найти лишь несколько дешёвых вещей"
 
 sjalvolki_conquest.0111.t:0 "Крепость"
 sjalvolki_conquest.0111.desc:0 "Мне приказано возглавить небольшой отряд и взять вражескую крепость, которая уже некоторое время упорно держится в [siege_location.GetNameNoTier]. По прибытии сразу становится ясно: гарнизон не сдастся, а стены не падут без долгой и утомительной осады.\n\nПока мы разбиваем лагерь, [SelectLocalization(Or(GetPlayer.HasTrait(GetTrait('shy').Self), GetPlayer.HasTrait(GetTrait('arrogant').Self)), 'я начинаю', 'мы с ближайшими сподвижниками начинаем')] обдумывать возможные действия."
 sjalvolki_conquest.0111.desc_failed_surrender:0 "После нескольких попыток договориться становится ясно, что гарнизон не сдастся. [SelectLocalization(Or(LessThanOrEqualTo_int32(GetPlayer.GetAICompassion,'(int32)-50'), GetPlayer.HasTrait(GetTrait('vengeful').Self)), 'Если у меня и оставалось хоть немного терпения или доброй воли к этой мрази, теперь они иссякли. Гарнизон ещё пожалеет, что отверг мою милость!', 'По крайней мере, в храбрости им не откажешь. Или в глупости.')]\n\nКак бы то ни было, развязка этой [SelectLocalization(And(LessThanOrEqualTo_int32(GetPlayer.GetAICompassion,'(int32)-50'), Not(GetPlayer.HasTrait(GetTrait('patient').Self))), 'кровавой осады не стала ближе, а моё терпение быстро иссякает.', 'осады не стала ближе.')] Придётся искать другой выход или готовиться к долгому ожиданию."
 sjalvolki_conquest.0111.a:0 "Дайте мне два десятка отборных бойцов, и крепость наша!"
 sjalvolki_conquest.0111.b:0 "К чёрту осаду — на штурм!"
 sjalvolki_conquest.0111.b_magic:0 "Их стены не устоят перед моей магией."
 sjalvolki_conquest.0111.c:0 "Крепость сама себя не осадит. Начинайте подготовку."
 sjalvolki_conquest.0111.c_decadent:0 "Раз уж предстоит ждать, можно и повеселиться!"
 sjalvolki_conquest.0111.d:0 "Попытаться договориться о сдаче."
 sjalvolki_conquest.0111.d_dishonest:0 "#italic Пообещать#! им безопасность в обмен на сдачу."
 
 sjalvolki_conquest.0111.successfully_led_daring_assault:0 "Ваш дерзкий штурм увенчался успехом"
 sjalvolki_conquest.0111.daring_assault_fended_off:0 "Ваш дерзкий штурм отбит"
 sjalvolki_conquest.0111.killed_in_assault:0 "Вы погибаете во время штурма"
 sjalvolki_conquest.0111.successfully_negotiated_surrender:0 "Вам удаётся договориться о сдаче гарнизона"
 sjalvolki_conquest.0111.unsuccessfully_negotiated_surrender:0 "Гарнизон отвергает ваши условия сдачи"
 sjalvolki_conquest.0111.successfully_conducted_assault:0 "Вы успешно берёте крепость штурмом без чрезмерных потерь"
 sjalvolki_conquest.0111.unsuccessfully_conducted_assault:0 "Штурм оборачивается кровавой катастрофой"
 sjalvolki_conquest.0111.successfully_conducted_siege:0 "Вы успешно завершаете осаду крепости"
 sjalvolki_conquest.0111.unsuccessfully_conducted_siege:0 "Осада ни к чему не приводит, и крепость не сдаётся"
 sjalvolki_conquest.0111.annihilate_fortress:0 "Своей магией вы полностью уничтожаете крепость и её гарнизон"
 sjalvolki_conquest.0111.threw_a_good_siege_party:0 "Вы устраиваете развлечения и празднества, благодаря которым осада становится почти приятной — по крайней мере, для осаждающих"
 sjalvolki_conquest.0111.boring_siege:0 "Несмотря на все старания, осада остаётся мучительно скучной"
 
 surrender_offer_not_honest_tooltip:0 "Ваше предложение может оказаться не вполне честным..."
 lead_daring_assault_on_stronghold_tooltip:0 "Вы лично возглавите отряд избранных воинов в дерзком ночном штурме крепости"
 will_be_able_to_try_other_options_tooltip:0 "Если этот замысел провалится, вы всё ещё сможете выбрать другой способ"
 
 sjalvolki_conquest.0121.t:0 "Сломленная надменность"
 sjalvolki_conquest.0121.intro:0 "Некоторое время назад мне довелось испытать [SelectLocalization(GetPlayer.HasTrait(GetTrait('zealous').Self),'великую честь', 'великое несчастье')]: меня отправили в [arrogant_aversarian_county.GetNameNoTier] договариваться с местным аверсарианским дворянином. Всё это время мой [SelectLocalization(GetPlayer.HasTrait(GetTrait('cynical').Self),'любезный собеседник', 'собеседник')] не прекращал задевать меня и моих людей, "
 sjalvolki_conquest.0121.desc_calm_or_patient:0 "но я почти не обращал[Select_CString(ROOT.Char.IsFemale, 'а', '')] внимания на [arrogant_aversarian.GetHerHis] мелкие провокации."
 sjalvolki_conquest.0121.desc_wrathful:0 "и мне не раз хотелось [SelectLocalization(Or(GetPlayer.HasTrait(GetTrait('craven').Self),GetPlayer.HasTrait(GetTrait('lazy').Self)),'приказать своим людям проломить', 'собственноручно проломить')] [arrogant_aversarian.GetHerHis] череп."
 sjalvolki_conquest.0121.desc_sadistic:0 "и мне уже не раз хотелось приказать замучить [arrogant_aversarian.GetHerHim] до смерти."
 sjalvolki_conquest.0121.desc_generic:0 "и было бы ложью утверждать, будто [arrogant_aversarian.GetSheHe] не сумел[Select_CString(arrogant_aversarian.IsFemale, 'а', '')] меня задеть."
 sjalvolki_conquest.0121.outro:0 "\n\nСегодня нас ждала очередная бесконечная череда скрытых угроз и колких оскорблений. Мои подчинённые вот-вот сорвутся: весь день они бросают на меня взгляды, ожидая хотя бы намёка на одобрение."
 sjalvolki_conquest.0121.a:0 "А теперь я скажу всё, что думаю, [arrogant_aversarian.GetFirstName]!"
 sjalvolki_conquest.0121.a_sadistic:0 "[SelectLocalization(GetPlayer.HasTrait(GetTrait('calm').Self), 'Довольно.', '#BOL ДОВОЛЬНО#!!')] Приведите [arrogant_aversarian.GetHerHim] ко мне, а остальных убейте[SelectLocalization(GetPlayer.HasTrait(GetTrait('calm').Self), '.', '!')]"
 sjalvolki_conquest.0121.a_wrathful_murderous:0 "#BOL ДОВОЛЬНО#!! Я забью [arrogant_aversarian.GetHerHim] до смерти!"
 sjalvolki_conquest.0121.a_wrathful_nonmurderous:0 "Пора преподать [arrogant_aversarian.GetHerHim] урок!"
 sjalvolki_conquest.0121.b:0 "Спокойно..."
 sjalvolki_conquest.0121.b_calm:0 "Твои насмешки уже приелись, [arrogant_aversarian.GetFirstName]."
 sjalvolki_conquest.0121.c:0 "В эту игру можно играть вдвоём!"
 sjalvolki_conquest.0121.d:0 "Ваши аверсарианские обычаи порочны!"
 sjalvolki_conquest.0121.e:0 "Может, мы оба сумеем на этом заработать?"
 
 sjalvolki_conquest_0121_ignore_insults_tooltip:0 "Ваша невозмутимость перед оскорблениями [arrogant_aversarian.GetFirstNamePossessive] впечатляет"
