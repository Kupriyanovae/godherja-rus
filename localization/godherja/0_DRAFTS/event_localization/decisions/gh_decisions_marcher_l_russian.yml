l_russian:
 reunite_chevalie_decision:0 "Воссоединить Шевалье"
 reunite_chevalie_decision_desc:0 "[Concept('chevalie','Шевалье')|E] разобщено, и подобного конфликта в его границах не было со времен Войны  лиги Чёрного Золота. Если Шевалье предстоит вновь объединиться, потребуется сильный правитель с столь же сильными притязаниями на престол, а его враги должны быть приведены к покорности."
 reunite_chevalie_decision_confirm:0 "Объединить Марки"
 reunite_chevalie_decision_tooltip:0 "Корона, давно разбитая, должна объединиться"
 
 forge_a_claim_on_chevalie_decision:0 "Сфабриковать претензию на престол Марок"
 forge_a_claim_on_chevalie_decision_desc:0 "[Concept('chevalie','Шевалье')|E] разобщено, а наследники её престола спорят и сражаются за остатки. Стремиться встать во главе — право и правое дело любого истинного правителя, и неужели у того, кто не имеет «права по рождению», нет путей получить претензии на Верховное королевство?"
 forge_a_claim_on_chevalie_decision_confirm:0 "Сфабриковать претензию"
 forge_a_claim_on_chevalie_decision_tooltip:0 "По праву трон может принадлежать только тому, кто способен захватить его сам"
 
 codify_the_freedom_of_lifepaths_decision:0 "Законодательно закрепить свободу Жизненных путей"
 codify_the_freedom_of_lifepaths_decision_desc:0 "Слишком долго у знати вошло в привычку препятствовать выбору Пути у нижних сословий. Святые Пути и основатели нашей веры знали, что каждый мужчина и каждая женщина сами должны выбирать свою судьбу, независимо от того, что думают их правители. Пора подвести черту. Созвав совет путевых отцов и закрепив в законе истинный путь, мы гарантируем, что никто больше никогда не будет сбит со своего законного Пути!"
 codify_the_freedom_of_lifepaths_decision_confirm:0 "Созвать совет!"
 codify_the_freedom_of_lifepaths_decision_tooltip:0 "Закрепить свободу"
 
 enforce_the_exclusivity_of_lifepaths_decision:0 "Утвердить исключительность Жизненных путей"
 enforce_the_exclusivity_of_lifepaths_decision_desc:0 "Какое право имеют крестьяне, когда они работают на нашей земле и служат по нашему капризу, нарекать свою судьбу - судьбой правителей или воинов? Выбирать это за них — законное право знати, дабы гарантировать, что они с радостью трудятся на Пути Жатвы и берут другой Путь только по нашему усмотрению. Пришло время закрепить в законе истинный порядок вещей, что бы ни говорил какой-то бормочущий путевой отец."
 enforce_the_exclusivity_of_lifepaths_decision_confirm:0 "Утвердить крепостничество!"
 enforce_the_exclusivity_of_lifepaths_decision_tooltip:0 "Утвердить исключительность"

 reforge_the_crown_decision:0 "Перековать корону"
 reforge_the_crown_decision_desc:0 "После того как верховный король Гардфрей разделил корону, он заявил, что тот, кто сможет собрать осколки, будет достоин носить ее. Вырвав их все из цепких лап претендентов, я доказал[Select_CString(ROOT.Char.IsFemale, 'а', '' )], что являюсь [Select_CString(ROOT.Char.IsFemale, 'законной преемницей', 'законным преемником' )]. Пусть Шевалье снова станет едино!"
 reforge_the_crown_decision_valid_condition:0 "Все четыре осколка Разбитой короны находятся в вашем владении"
 reforge_the_crown_decision_effect:0 "Все осколки Разбитой короны уничтожаются."
 reforge_the_crown_decision_confirm:0 "Конец семейных ссор"
 reforge_the_crown_decision_tooltip:0 "Перековать корону"

 reclaim_the_crown_decision:0 "Вернуть осколки Разбитой короны"
 reclaim_the_crown_decision_desc:0 "Как претенденту на Верховное королевство, Разбитая корона принадлежит мне по праву!"
 reclaim_the_crown_decision_confirm:0 "Все они будут моими"
 reclaim_the_crown_decision_tooltip:0 "Вернуть осколки Разбитой короны"

 revert_to_gestanwoder_decision:0 "Вернуться к гестанводеризму"
 revert_to_gestanwoder_decision_desc:0 "Следование учениям Жизненных путей оказалось ошибкой. Стоит лишь взглянуть через наши каналы на постоянный крах соседних королевств, чтобы убедиться в этом. Мы должны прекратить преследование старых приверженцев гестанводеризма, ведь они наши соотечественники. Мы должны стоять вместе, чтобы выдержать хаос вокруг нас."
 revert_to_gestanwoder_decision_confirm:0 "Возрождение светлых времен"
 revert_to_gestanwoder_decision_tooltip:0 "Вернуться к гестанводерской конфессии"
 
 reintegrate_ziemojycz_decision:0 "Реинтегрировать Зьемойич"
 reintegrate_ziemojycz_decision_desc:0 "Дальнейшее существование того, что осталось от Ойейницы, висит на волоске, а их близость к [Concept('the_lichdoms','Личествам')|E] — это вечный топор, зависший над их головами. Мы должны вернуть их в лоно — для их же собственного блага."
 reintegrate_ziemojycz_decision_valid_condition:0 "Зьемойич независим, и вы не запрашивали вассальную клятву в последнее время."
 reintegrate_ziemojycz_decision_effect:0 "В Зьемойич будет отправлен посланник с требованием вассальной клятвы."
 reintegrate_ziemojycz_decision_confirm:0 "Будем надеяться, они сделают мудрый выбор"
 reintegrate_ziemojycz_decision_tooltip:0 "Реинтегрировать Зьемойич"

 demand_independent_lords_swear_fealty_decision:0 "Потребовать вассалитета от независимых владык"
 demand_independent_lords_swear_fealty_decision_desc:0 "В [Concept('chevalie','Шевалье')|E] есть те, кто еще не принес мне подобающего оммажа. Давайте исправим это."
 demand_independent_lords_swear_fealty_decision_tooltip:0 "Пришло время всем в Марках подчиниться мне"
 demand_independent_lords_swear_fealty_decision_confirm:0 "Подготовить посланников"
 demand_independent_lords_swear_fealty_decision_cooldown_tt:0 "Прошло по меньшей мере пять лет с тех пор, как вы в последний раз требовали вассальной клятвы."
 
