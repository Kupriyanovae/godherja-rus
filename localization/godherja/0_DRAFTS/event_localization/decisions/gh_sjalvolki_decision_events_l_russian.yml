l_russian:
 sjalvolki_decision.0001.t:0 "Закладка фундамента"
 sjalvolki_decision.0001.desc:0 "Ни [Select_CString(ROOT.Char.IsFemale, 'одна', 'один' )] [ROOT.Char.GetTitleAsNameNoTooltip] не может жить вечно, и когда настанет день, когда я наконец покину этот мир ради [ROOT.Char.GetFaith.PositiveAfterLife], я буду [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )]. Я уже [Select_CString(ROOT.Char.IsFemale, 'начала', 'начал' )] нанимать умелых рабочих в преддверии строительных работ, которые скоро начнутся, но сперва я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] ответить на самый очевидный вопрос — где это будет?"
 sjalvolki_decision.0001.a.dynastic_burial_site:0 "[location_option_1.GetNameNoTierNoTooltip], традиционное место захоронения моей семьи."
 sjalvolki_decision.0001.a:0 "[location_option_1.GetNameNoTierNoTooltip], моя столица."
 sjalvolki_decision.0001.b.capital:0 "[location_option_2.GetNameNoTierNoTooltip], моя столица."
 sjalvolki_decision.0001.b:0 "[location_option_2.GetNameNoTierNoTooltip] кажется отличным местом."
 sjalvolki_decision.0001.c:0 "Ничто иное, кроме как [location_option_3.GetNameNoTierNoTooltip]."
 sjalvolki_decision.0001.d:0 "Эх, любое место сойдет."
 sjalvolki_decision.0001.e:0 "[location_option_diligent.GetNameNoTierNoTooltip] имеет огромный потенциал, если приложить усилия."
 sjalvolki_decision.0001.e.success_epic:0 "Мне удается найти место исключительных качеств"
 sjalvolki_decision.0001.e.success_epic.title:0 "Замечательное место!"
 sjalvolki_decision.0001.e.success_epic.desc:0 "Я [Select_CString(ROOT.Char.IsFemale, 'нашла', 'нашел' )] место поистине исключительной красоты."
 sjalvolki_decision.0001.e.success_good:0 "Мне удается найти место хорошего качества"
 sjalvolki_decision.0001.e.success_good.title:0 "Прекрасное место"
 sjalvolki_decision.0001.e.success_good.desc:0 "Я [Select_CString(ROOT.Char.IsFemale, 'нашла', 'нашел' )] место заметной красоты."
 sjalvolki_decision.0001.e.success_decent:0 "Я нахожу место с некоторой известностью"
 sjalvolki_decision.0001.e.success_decent.title:0 "Приятное место"
 sjalvolki_decision.0001.e.success_decent.desc:0 "Я [Select_CString(ROOT.Char.IsFemale, 'нашла', 'нашел' )] место, достаточно хорошее, чтобы с ним стоило иметь дело."
 sjalvolki_decision.0001.e.failure:0 "Мне удается лишь попусту потратить время и деньги"
 sjalvolki_decision.0001.e.failure.title:0 "Ни одного хорошего места!"
 sjalvolki_decision.0001.e.failure.desc:0 "Мне не удалось найти ничего необычного."
 sjalvolki_decision.0001.f:0 "Свинопас в [location_option_greedy.GetNameNoTierNoTooltip] продает свою землю по дешевке."
 sjalvolki_decision.0001.g:0 "В [location_option_arrogant.GetNameNoTierNoTooltip] есть дорогой, но захватывающий участок!"
 sjalvolki_decision.0001.h:0 "[location_option_zealous.GetNameNoTierNoTooltip] — известная святая земля!"
 sjalvolki_decision.0001.k:0 "Я могу повторно использовать [Concept('aversaria','аверсарианскую')|E] гробницу в [location_option_cynical.GetNameNoTierNoTooltip]."
 sjalvolki_decision.0001.l:0 "Вообще-то, сейчас не время."
 will_build_at_location_1_tt:0 "Вы построите курган в [location_option_1.GetNameNoTierNoTooltip]"
 will_build_at_location_2_tt:0 "Вы построите курган в [location_option_2.GetNameNoTierNoTooltip]"
 will_build_at_location_3_tt:0 "Вы построите курган в [location_option_3.GetNameNoTierNoTooltip]"
 will_build_at_location_diligent_tt:0 "Вы построите курган в [location_option_diligent.GetNameNoTierNoTooltip]"
 will_build_at_location_greedy_tt:0 "Вы построите курган в [location_option_greedy.GetNameNoTierNoTooltip]"
 will_build_at_location_arrogant_tt:0 "Вы построите курган в [location_option_arrogant.GetNameNoTierNoTooltip]"
 will_build_at_location_zealous_tt:0 "Вы построите курган в [location_option_zealous.GetNameNoTierNoTooltip]"
 will_build_at_location_cynical_tt:0 "Вы построите курган в [location_option_cynical.GetNameNoTierNoTooltip]"
 will_build_at_random_location_tt:0 "Вы построите курган в случайном месте"
 
 sjalvolki_decision.0011.t:0 "Вспахивая почву"
 sjalvolki_decision.0011.desc.farmlands:0 "Мы едем по очагам и пашням [barrow_location.GetNameNoTierNoTooltip], повсюду вокруг нас видны следы разрозненной цивилизации. Поднимаясь на один из редких холмов этой местности, я вижу ее — расчищенную поляну."
 sjalvolki_decision.0011.desc.forest:0 "Мы едем через густой лес [barrow_location.GetNameNoTierNoTooltip], извилистая грунтовая тропа местами полностью поглощена подлеском. Наконец, мы достигаем явной поляны, недавно расширенной моими дровосеками."
 sjalvolki_decision.0011.desc.hills:0 "Мы едем по обдуваемым ветрами холмам [barrow_location.GetNameNoTierNoTooltip], наши кони устают от неровной местности. Наконец, я замечаю строительную площадку с вершины особенно высокого пика, почти скрытую в небольшой долине."
 sjalvolki_decision.0011.desc.mountains:0 "Переход через горы [barrow_location.GetNameNoTierNoTooltip] чрезвычайно суров, окружающая среда меняется от умеренного лесорубья до сосновых лесов, ветреных пастбищ и, наконец, покрытого снегом пика. На белом фоне строительная площадка вполне очевидна даже издалека."
 sjalvolki_decision.0011.desc.wetlands:0 "Мы едем по унылым болотам [barrow_location.GetNameNoTierNoTooltip], «тропа» представляет собой запутанное, полузатопленное грязевое месиво. Наконец, добравшись до более-менее устойчивой почвы, которая не полностью заболочена, я замечаю строительную площадку."
 sjalvolki_decision.0011.desc.steppe:0 "Поездка по казалось бы бесконечным просторам степей [barrow_location.GetNameNoTierNoTooltip] спокойна, но утомительна. При отсутствии других крупных достопримечательностей в поле зрения строительная площадка видна издалека."
 sjalvolki_decision.0011.desc.fallback:0 "Поездка в [barrow_location.GetNameNoTierNoTooltip] проходит без происшествий, и мне удается хорошо разглядеть строительную площадку еще до прибытия."
 sjalvolki_decision.0011.desc.mid:0 " Уже сейчас нанятые мной люди усердно работают, закладывая фундамент того, что однажды станет моим последним пристанищем.\n\nКо мне подходит [barrow_overseer.GetFirstName], их [Select_CString(barrow_overseer.IsFemale, 'надсмотрщица', 'надсмотрщик' )], и просит принять окончательное решение о размере и масштабе кургана."
 sjalvolki_decision.0011.a:0 "Это будет простое, скромное жилище."
 sjalvolki_decision.0011.b:0 "Ничего необычного."
 sjalvolki_decision.0011.c:0 "Что-то значительно превосходящее остальные."
 sjalvolki_decision.0011.d:0 "Я хочу упокоение, достойное Верховного короля!"
 sjalvolki_decision.0011.e:0 "Отмените это, я [Select_CString(ROOT.Char.IsFemale, 'передумала', 'передумал' )]."
 will_build_small_barrow_tt:0 "Я построю курган #E малого#! размера"
 will_build_medium_barrow_tt:0 "Я построю курган #E среднего#! размера"
 will_build_big_barrow_tt:0 "Я построю курган #E большого#! размера"
 will_build_huge_barrow_tt:0 "Я построю курган #E поистине впечатляющего#! размера"
 will_construct_in_five_years_tt:0 "Работы будут завершены приблизительно через #E 5 лет#!"
 will_construct_in_ten_years_tt:0 "Работы будут завершены приблизительно через #E 10 лет#!"
 will_construct_in_fifteen_years_tt:0 "Работы будут завершены приблизительно через #E 15 лет#!"
 will_construct_in_thirty_years_tt:0 "Работы будут завершены приблизительно через #E 30 лет#!"
 
 sjalvolki_decision.0101.t:0 "Еще один камень заложен"
 sjalvolki_decision.0101.desc:0 "Работа над моим курганом в [barrow_county.GetNameNoTierNoTooltip] продвигается хорошо. Были выкопаны многочисленные камеры, возведены внешние сооружения и высечены прекрасные рунические камни, чтобы украсить его залы."
 sjalvolki_decision.0101.k:0 "Отлично."
 
 sjalvolki_decision.0201.t:0 "Последний камень заложен"
 sjalvolki_decision.0201.desc.intro:0 "Строительство моего кургана в [barrow_county.GetNameNoTierNoTooltip] наконец завершено, последние штрихи нанесены. "
 sjalvolki_decision.0201.desc.small:0 "Хотя он вряд ли перехватит у кого-то дыхание, он вполне удовлетворяет моим потребностям — холмик, окруженный прекрасными стелами, с небольшой камерой внутри."
 sjalvolki_decision.0201.desc.medium:0 "Это вполне адекватный, хотя и среднестатистический холмик, окруженный прекрасными стелами, с просторной центральной камерой и несколькими меньшими боковыми комнатами."
 sjalvolki_decision.0201.desc.large:0 "Это довольно впечатляющее крупное сооружение со сводчатым входом, просторной центральной камерой и в целом обширным интерьером."
 sjalvolki_decision.0201.desc.huge:0 "Вероятно, одно из самых крупных и впечатляющих мест захоронения в регионе, оно имеет захватывающий дух сводчатый вход, интерьер настолько обширный, что померкли бы целые замки, и массивную центральную камеру."
 sjalvolki_decision.0201.desc.end:0 "Я могу быть [Select_CString(ROOT.Char.IsFemale, 'спокойна', 'спокоен' )] в том, что когда покину этот мир ради [ROOT.Char.GetFaith.PositiveAfterLife], о моих бренных остатках хорошо позаботятся."
 sjalvolki_decision.0201.desc.mid:0 "\n\nРазумеется, ни одно уважающее себя место захоронения не было бы полным без сокровищ и пышных внутренних украшений, и теперь я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] окончательно решить, сколько я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )] отложить для своего путешествия в загробную жизнь."
 sjalvolki_decision.0201.a:0 "Я отложу достойную сумму."
 sjalvolki_decision.0201.b:0 "Никаких монет я не пожалею на это."
 sjalvolki_decision.0201.c:0 "О сокровищах, спрятанных внутри, будут слагать легенды."
 sjalvolki_decision.0201.d:0 "Я заберу все с собой."
 sjalvolki_decision.0201.e:0 "Ба. Мне не понадобится золото в загробной жизни."
 will_take_treasury_to_grave_tt:0 "После смерти вы заберете всю свою казну в могилу с собой, обменивая каждую единицу [Concept('gold','золота')|E] на #positive_value 0.75#! [Concept('dynasty_prestige','признание')|E]"

 sjalvolki_decision.2001.t:0 "Отцы Пути Велоса"
 sjalvolki_decision.2001.desc:0 "Уже сейчас могучие воины со всего Расколотого побережья начали стекаться к нашему замку. С высоты лесов я вижу храбрых сьялволков, работающих вместе ради общей цели. Если нашим народам предстоит иметь шанс в этих землях, им понадобится помощь в следовании правильным путями, дабы они не пали во зло."
 sjalvolki_decision.2001.a:0 "Мы разметим пути!"
 sjalvolki_decision.2001.b:0 "Хвала Велосу!"