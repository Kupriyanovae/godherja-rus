l_russian:
 gh_major_decisions.0002.t: "Конец Легиона"
 gh_major_decisions.0002.desc: "Хотя мы начинали как [Concept('aversaria','имперский')|E] Легион, те дни давно прошли. По мере того как память об империи угасала, моя держава все больше становилась неотличимой от любой другогой. С официальным упразднением военного правления над моими землями я отныне правлю как аристократ[Select_CString(ROOT.Char.IsFemale, 'ка', '' )], по примеру былых времен."
 gh_major_decisions.0002.a: "А теперь — к будущему."
 goans_decisions.0001.t: "Врата открыты"
 goans_decisions.0001.desc: "Сделка совершена. Старейшины сожгли чучела старых утесных жилищ и теперь поют о бескрайних пастбищах, а не об бесчисленных пиках. Но один вопрос остается без ответа: испокон веков отвесные стены нашей родины удерживали мир снаружи, а нас — внутри. Теперь не осталось никаких стен, кроме тех, что мы сами решим оставить.\n\nКем мы станем для этого незнакомого мира?"
 goans_decisions.0001.a: "Старые междоусобицы найдут новую добычу."
 goans_decisions.0001.a.tt: "Заменить «[GetCultureTradition('tradition_isolationist').GetName]» на «[GetCultureTradition('tradition_warrior_culture').GetName]».\n\n#F Насилие, которое мы когда-то обращали вовнутрь из-за пастбищ, теперь будет обращено вовне, на весь мир.#!"
 goans_decisions.0001.b: "Пусть у наших костров сидят незнакомцы."
 goans_decisions.0001.b.tt: "Заменить «[GetCultureTradition('tradition_isolationist').GetName]» на «[GetCultureTradition('tradition_astute_diplomats').GetName]».\n\n#F Мы присоединились к миру. Давайте научимся говорить с ним, торговать с ним и пить с ним.#!"
 goans_decisions.0001.c: "Стены сердца останутся."
 goans_decisions.0001.c.tt: "Сохранить «[GetCultureTradition('tradition_isolationist').GetName]».\n\n#F Мы можем жить на равнинах, но нам необязательно принадлежать им.#!"


 gh_encourage_marcher_colonization_in_realm_decision: "Поощрять марочникское заселение"
 gh_encourage_marcher_colonization_in_realm_decision_confirm: "Отправить весть в Шевалье"
 gh_encourage_marcher_colonization_in_realm_decision_desc: "Земля, заселенная моим собственным народом, — это земля, за которой мне не нужно следить так пристально, и здесь все еще достаточно территории, ждущей умелых рук и любого, кто готов совершить путешествие и заявить на нее права."
 gh_encourage_marcher_colonization_in_realm_decision_tooltip: "Марочникские поселенцы могут основать колонию в графстве вашей [Concept('realm','державы')|E], изменив его [Concept('culture','культуру')|E] и [Concept('faith','конфессию')|E]"
 marchers_are_not_interested_in_colonization_tt: "Никто из поселенцев не заинтересован"
 amsar_is_considered_very_attractive_to_settle_tt: "Слухи о богатствах Амсара поддерживают постоянный поток поселенцев"
 region_is_considered_very_attractive_to_settle_tt: "Вести о богатствах этого региона поддерживают постоянный поток поселенцев"
 gh_random_county_in_settlers_depart_tt: "[Concept('marchers','Марочники')|E] из случайного [Concept('county','графства')|E] в [Concept('chevalie','Шевалье')|E] поселятся в вашей [Concept('realm','державе')|E]"
 gh_marchers_wave_of_settlers_notification: "Прибыли марочникские поселенцы"
 gh_random_county_marchers_settlers_arrive_tt: "[chevalie_target_county.GetCounty.GetCulture.GetName] из [chevalie_target_county.GetCounty.GetName] селятся в [gh_marcher_settled_county_scope.GetCounty.GetName]"
 gh_marchers_wave_of_settlers_refuse_notification: "Поселенцы не пришли"

 gh_high_king_of_chevalie_not_forbidden_colonization_tt: "Верховный король [Concept('chevalie','Шевалье')|E] не издавал никаких [Concept('law','законов')|E], запрещающих его подданным селиться на чужой территории"


 settlers_reccently_departed_from_county_modifier: "Недавняя эмиграция"
 settlers_reccently_departed_from_county_modifier_desc: "Многие покинули эту землю не так давно, дабы найти новый дом в другом месте. Пройдет несколько лет, прежде чем численность населения вернется к прежнему уровню."
 settlers_reccently_arrived_to_county_modifier: "Недавняя иммиграция"
 settlers_reccently_arrived_to_county_modifier_desc: "Многие недавно поселились в этом графстве, чтобы обрести новый дом."
 gh_prevent_emigration_from_county_modifier: "Сдерживание эмиграции"
 gh_prevent_emigration_from_county_modifier_desc: "Правитель этого графства принял меры по сдерживанию миграции за пределы региона, заставляя многих остаться и искать счастья дома."

 gh_strip_khanhe_peashmbra_decision:0 "Разграбить Дворец Белого Золота"
 gh_strip_khanhe_peashmbra_decision_intro_tebouin:0 "Мои войска забрали всё, что могли, во время разграбления Чурана в 1288 году И.С."
 gh_strip_khanhe_peashmbra_decision_intro_tebouin_father:0 "Армия моего отца забрала всё, что могла, во время разграбления Чурана в 1288 году И.С."
 gh_strip_khanhe_peashmbra_decision_intro_normal:0 "Марочники Тебуина забрали всё, что могли, во время разграбления Чурана в 1288 году И.С."
 gh_strip_khanhe_peashmbra_decision_desc:0 "а то, что они оставили, было лишь тем, что нельзя было легко выкорчевать. И все же Ханхе Пеашмбра — сам по себе драгоценный камень. Каждая колонна, каждая арка, каждый бассейн фонтана в этом комплексе покрыты золотом, серебром и драгоценными камнями, вмурованными прямо в кладку. В сами его стены влито богатство превыше любого воображения.\n\nНет причин для того, чтобы эти богатства простаивали дальше."
 gh_strip_khanhe_peashmbra_decision_desc_pre_1288:0 "Ханхе Пеашмбра — сам по себе драгоценный камень. Каждая колонна, каждая арка, каждый бассейн фонтана в этом комплексе покрыты золотом, серебром и драгоценными камнями, вмурованными прямо в кладку. В сами его стены влито богатство превыше любого воображения.\n\nНет причин для того, чтобы эти богатства простаивали дальше."
 gh_strip_khanhe_peashmbra_decision_confirm:0 "Ободрать догола"
 gh_strip_khanhe_peashmbra_decision_tooltip:0 "[GetBuilding('01_whitegoldpalace').GetName] будет ободран, из него извлекут все золото и драгоценные камни."
 gh_sacked_holy_site_opinion: "Осквернение священного места"
 gh_every_ruler_opinion_strip_khanhe_peashmbra_decision_tt: "Каждый [Concept('ruler','правитель')|E] в [Concept('sarradon','Саррадоне')|E], считающий [GetTitleByKey('b_tchouran').GetNameNoTier] [Concept('holy_site','священным местом')|E], потеряет #N -40#! [Concept('opinion','мнения')|E] о вас"

 marcher_decision.1001.t:0 "Голый камень"
 marcher_decision.1001.desc:0 "Последний драгоценный камень наконец был извлечен, и большая часть Ханхе Пеашмбра превратилась в руины — забрали так много, что здание больше не могло удерживать собственный вес.\n\nЖаль терять здание такого масштаба, но золото в переплавленном виде имеет для нас большую ценность, чем прикрученное к стене."
 marcher_decision.1001.a:0 "Теперь это мое."
 marcher_decision.1001.a.tt:0 "Вы забираете все богатства себе."
 marcher_decision.1001.b:0 "Разделить это между моей собственной казной и теми, кто это заслужил."
 marcher_decision.1001.b.tt:0 "Вы делите часть богатств со своим народом и вассалами."
 marcher_decision.1001.c:0 "Отдать это народу."
 marcher_decision.1001.c.tt:0 "Вы делите все богатства со своим народом и вассалами."

 marcher_decision.1002.t:0 "Голый камень"
 marcher_decision.1002.desc.amsari:0 "До меня дошли вести о последней жестокости [tchouran_holder.GetTitledFirstName]. Ханхе Пеашмбра, Дворец Белого Золота, жемчужина Чурана и гордость нашего народа, прекратил свое существование.\n\nБогатства, удерживавшие его вместе, были вырваны и переплавлены, а дворец рухнул сам на себя, как только эти богатства исчезли. От него почти ничего не осталось стоящим."
 marcher_decision.1002.desc.others:0 "До меня дошли вести, что [tchouran_holder.GetTitledFirstName] [Select_CString(tchouran_holder.IsFemale, 'ободрала', 'ободрал' )] знаменитый Ханхе Пеашмбра в Чуране ради его богатств, превратив некогда главную жемчужину региона в груду обломков. Дорогой способ пополнить казну, но она была пополнена."
 marcher_decision.1002.a:0 "Рана, которая не заживет."
 marcher_decision.1002.b:0 "Золото есть золото, где бы оно ни находилось."
 marcher_decision.1002.c:0 "Я понимаю..."

 gh_medium_disdtrbution_of_tchouran_loot_modifier: "Распределение богатства"
 gh_medium_disdtrbution_of_tchouran_loot_modifier_desc: "Правитель этого графства распределил часть богатств, изъятых из Ханхе Пеашмбры, среди жителей этого графства."

 gh_large_disdtrbution_of_tchouran_loot_modifier: "Широкое распределение богатства"
 gh_large_disdtrbution_of_tchouran_loot_modifier_desc: "Правитель этого графства распределил большую часть богатств, изъятых из Ханхе Пеашмбры, среди жителей этого графства."

 gh_move_capital_to_siuni_decision:0 "Перенести столицу в [GetTitleByKey('c_siuni').GetNameNoTierNoTooltip]"
 gh_move_capital_to_siuni_decision_desc:0 "С начала IX века И.С. [GetTitleByKey('c_siuni').GetNameNoTier] был крупным торговым узлом, одним из самых процветающих городов в заливе Альгурб, развивавшимся временами быстрее своего старшего брата [GetTitleByKey('c_tchouran').GetNameNoTierNoTooltip]. И все же он всегда жил в тени так называемого «Города Пророка».\n\nЕсли мы хотим иметь прочную опору на этих землях, возможно, предпочтительнее править из менее... религиозно обремененного города."
 gh_move_capital_to_siuni_decision_confirm:0 "Перенести столицу"
 gh_move_capital_to_siuni_decision_tooltip:0 "Ваша [Concept('capital','столица')|E] будет перенесена в Сиуни."
 gh_swap_capital_siuni_decision_tooltip: "Вы обменяете свою [Concept('capital','столицу')|E] со столицей [GetTitleByKey('c_siuni').GetHolder.GetName]"

 new_capital_of_amsar_modifier: "Новая столица"
 new_capital_of_amsar_modifier_desc: "Это графство было назначено новой столицей великого государства."

 replaced_capital_of_amsar_modifier: "Столица перенесена"
 replaced_capital_of_amsar_modifier_desc: "Это графство когда-то было местом великой столицы, но его статус был уступлен Сиуни."



 gh_every_vassal: "Каждый [Concept('vassal','вассал')|E]"
 gh_every_same_culture_county_in_realm: "Каждое [Concept('county','графство')|E] в вашей [Concept('realm','державе')|E] вашей [Concept('culture','культуры')|E]"

 gh_tebouin_reclaim_amsar_decision: "Собрать новую армию"
 gh_tebouin_reclaim_amsar_decision_desc: "Амсар пока утерян, но его можно вернуть. Шевалье — это то, с чего я начинал, и, видимо, то, с чего мне придется начать снова. Если я взыщу долги, которыми мне обязаны, и воспользуюсь своими прошлыми подвигами, я [Select_CString(ROOT.Char.IsFemale, 'уверена', 'уверен' )], что найду сильных мужей, которые пойдут за мной за обещания богатства и земель в Амсаре."
 gh_tebouin_reclaim_amsar_decision_confirm: "Взыскать старые долги"
 gh_tebouin_reclaim_amsar_decision_tooltip: "Нанять [Concept('men_at_arms','профессионалов')|E] и собрать средства в [Concept('chevalie','Шевалье')|E], чтобы попытаться отвоевать Амсар."
 gh_character_is_currently_in_chevalie_tt: "Вы в настоящее время находитесь на материковой части [Concept('chevalie','Шевалье')|E]"
 gh_tebouin_reconquer_amsar_tt: "Вы начинаете [Concept('war','войну')|E], дабы начать отвоевание [Concept('amsar','Амсара')|E]"

 marcher_decision.1003.t: "Отвоевание Амсара"
 marcher_decision.1003.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'собрала', 'собрал' )] больше, чем изначально [Select_CString(ROOT.Char.IsFemale, 'надеялась', 'надеялся' )], и мои люди теперь готовы совершить переправу обратно в Амсар. Моя задача, однако, гораздо сложнее, чем у [GetScriptedCharacterByHistoryID('voyagen_lifepath_46').GetFirstName]. Не имея точки опоры в Амсаре, сначала я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] обдумать наилучший подход к началу отвоевания. Я могла[Select_CString(ROOT.Char.IsFemale, 'мог', 'могла' )] бы попытаться укрепиться непосредственно на материке, что облегчило бы любые будущие завоевания, либо сделать так, как поступил [GetScriptedCharacterByHistoryID('voyagen_lifepath_46').GetFirstName] во время гражданской войны в Амсаре, и сначала захватить острова Ламан, которые легче оборонять."
 marcher_decision.1003.a: "Сначала захватить острова Ламан."
 marcher_decision.1003.b: "Высадиться прямо на материке."