l_russian:
 gh_major_decisions.0002.t:0 "Конец Легиону"
 gh_major_decisions.0002.desc:0 "Хотя мы начинали как Имперский Легион, те дни давно прошли. С исчезновением памяти о империи, мое государство всё больше становится похожим на любое другое. С формальным роспуском военного правления над моими землями, теперь я правлю как аристократ, по образцу старых времен."
 gh_major_decisions.0002.a:0 "И теперь, в будущее."
 goan_decisions.0001.t: "The Gates Stand Open"
 goan_decisions.0001.desc: "It is done. The elders have burned effigies of the old cliff-homes, and now sing of pastures without end rather than peaks without number. Yet one question remains unanswered: for time beyond memory, the sheer walls of our homeland kept the world out. and us in. Now no walls remain but those we choose to keep.\n\nWhat shall we be to this unfamiliar world?"
 goan_decisions.0001.a: "The old feuds shall find new prey."
 goan_decisions.0001.a.tt: "Replace [GetCultureTradition('tradition_isolationist').GetName] with [GetCultureTradition('tradition_warrior_culture').GetName].\n\n#F  The violence we once turned inward over pastures shall be turned outward upon the world.#!"
 goan_decisions.0001.b: "Let there be strangers at our fires."
 goan_decisions.0001.b.tt: "Replace [GetCultureTradition('tradition_isolationist').GetName] with [GetCultureTradition('tradition_astute_diplomats').GetName].\n\n#F We have joined the world. Let us learn to speak with it, trade with it, and drink with it.#!"
 goan_decisions.0001.c: "The walls of the heart remain."
 goan_decisions.0001.c.tt: "Keep [GetCultureTradition('tradition_isolationist').GetName].\n\n#F  We may live upon the plains, but we need not belong to them.#!"


 gh_encourage_marcher_colonization_in_realm_decision: "Encourage Marcher Settlement"
 gh_encourage_marcher_colonization_in_realm_decision_confirm: "Send word to Chevalie"
 gh_encourage_marcher_colonization_in_realm_decision_desc: "Land settled by my own people is land I need not watch so closely, and there is still enough here waiting for capable hands, awaiting any willing to make the journey and claim it for themselves."