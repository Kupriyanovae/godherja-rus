l_russian:
  investigate_valerix_decision: "Расследовать убийство легона Валерикса"
  investigate_valerix_decision_desc: "Когда Валерикс впервые собрал свои силы для долгого похода на запад, он сказал своему разношерстному легиону: «Мы идем не ради славы и наживы, но ради матерей и сыновей, отцов и дочерей. Мы возвращаемся домой не ради славы и парадов, а ради правды и справедливости. Только мы можем спасти наш дом, ныне и вовеки».\n\nДаже теперь, когда он мертв, его слова тяжелым грузом лежат на наших душах. Наш долг — исправить несправедливость и спасти нашу родину, но прежде мы должны отомстить за человека, бывшего отцом нам всем. Как мы можем спасти [Concept('aversaria','Аверсарию')|E], если не способны исправить даже эту малейшую из несправедливостей?\n\nДля этого мне нужны средства, на которые я соберу отряд, чтобы выследить убийцу. Пусть никто не укроется от гнева легиона, и пусть то, что произойдет дальше, станет посланием для всей Аверсарии."
  investigate_valerix_decision_confirm: "За Валерикса! За Аверсарию!"
  investigate_valerix_decision_tooltip: "Расследовать убийство Валерикса"

  free_the_slaves_decision: "Освободить рабов в Каллиадосе"
  free_the_slaves_decision_2: "Освободить рабов Латунного Моря"
  free_the_slaves_decision_3: "Освободить рабов в Ласанои"
  free_the_slaves_decision_4: "Освободить рабов в Сватавего"
  free_the_slaves_decision_5: "Освободить рабов в Хе Врерай"
  free_the_slaves_decision_6: "Освободить рабов в Гирее"
  free_the_slaves_decision_desc: "Губернатор мертв, а Айроной в прежнем виде распущен. Теперь, когда за Валерикса отомстили, наступает новая эпоха — эпоха, в которую мы исправим [Concept('aversaria','Аверсарию')|E] и загладим вину за несправедливости, копившиеся тысячу лет.\n\nМы начнем с освобождения всех, кто скован цепями рабства на наших землях, и сделаем то же самое на завоеванных территориях. Разбив их цепи, мы предложим им выбор: они могут уйти или присоединиться к нам, пополнив ряды нашей армии. Хотя сторонники жесткой линии, без сомнения, выразят недовольство, со смертью губернатора им не вокруг кого сплотиться. А с той численностью, которую принесут наши новые братья, мы будем как никогда готовы вернуть [GetTitleByKey('c_asiupoli').GetNameNoTier] и встретиться лицом к лицу с Сокрушителем Ведьм."
  free_the_slaves_decision_confirm: "Сегодня мы все — [Concept('aversaria','аверсарианцы')|E]."
  free_the_slaves_decision_2_confirm: "Сегодня мы все — [Concept('aversaria','аверсарианцы')|E]."
  free_the_slaves_decision_3_confirm: "Сегодня мы все — [Concept('aversaria','аверсарианцы')|E]."
  free_the_slaves_decision_4_confirm: "Сегодня мы все — [Concept('aversaria','аверсарианцы')|E]."
  free_the_slaves_decision_5_confirm: "Сегодня мы все — [Concept('aversaria','аверсарианцы')|E]."
  free_the_slaves_decision_6_confirm: "Сегодня мы все — [Concept('aversaria','аверсарианцы')|E]."
  free_the_slaves_decision_tooltip: "Освободить рабов"
  free_the_slaves_decision_2_tooltip: "Освободить рабов"
  free_the_slaves_decision_3_tooltip: "Освободить рабов"
  free_the_slaves_decision_4_tooltip: "Освободить рабов"
  free_the_slaves_decision_5_tooltip: "Освободить рабов"
  free_the_slaves_decision_6_tooltip: "Освободить рабов"
  free_the_slaves_generic_valid_desc: "Вы должны полностью контролировать [Concept('duchy','герцогство')|E] в Айроное, чтобы освободить его рабов."
  free_the_slaves_decision_2_desc: "Вы должны полностью контролировать [Concept('duchy','герцогство')|E] Башенные острова в Айроное, чтобы освободить его рабов."
  free_the_slaves_decision_3_desc: "Вы должны полностью контролировать [Concept('duchy','герцогство')|E] Ласанои в Айроное, чтобы освободить его рабов."
  free_the_slaves_decision_4_desc: "Вы должны полностью контролировать [Concept('kingdom','королевство')|E] Сватавего в Айроное, чтобы освободить его рабов."
  free_the_slaves_decision_5_desc: "Вы должны полностью контролировать [Concept('duchy','герцогство')|E] Хе Врерай в Айроное, чтобы освободить его рабов."
  free_the_slaves_decision_6_desc: "Вы должны полностью контролировать [Concept('kingdom','королевство')|E] Гирея в Айроное, чтобы освободить его рабов."

  aironoi_free_slaves_effect_tt: "Освобождение рабов вызовет недовольство среди ваших соотечественников, но преданность многих других. Немедленно соберётся армия из тех, кто присягнет на верность. В будущем мы также сможем освобождать рабов для получения различных благ на будущих завоёванных землях."

  emancipate_the_slaves_decision: "Покончить с рабством в Айроное"
  emancipate_the_slaves_decision_desc: "Теперь, когда мы держим жемчужину [Concept('aversaria','Аверсарии')|E] — [GetTitleByKey('c_asiupoli').GetNameNoTier] — и можем приступать к великому делу возрождения славы нашего народа. Наступает новая эпоха — эпоха, в которую мы исправим Аверсарию и загладим вину за несправедливости, копившиеся тысячу лет.\n\nМы освободим всех рабов в [GetTitleByKey('c_asiupoli').GetNameNoTier] и объявим об отмене рабства на всех землях Аверсарии в Айроное. Никто в наших владениях не будет жить в оковах."
  emancipate_the_slaves_decision_confirm: "Сегодня мы все — [Concept('aversaria','аверсарианцы')|E]."
  emancipate_the_slaves_decision_tooltip: "Покончить с рабством в Айроное"

  eastern_reforms.0001.title: "Начало расследования"
  eastern_reforms.0001.desc: "[Concept('aversaria','Аверсария')|E] истекает кровью, но мои мысли заняты другим. Личными делами, имеющими, однако, огромный вес. Старик был героем для нас всех, живой легендой, и с его смертью мы пребываем в смятении и растерянности. Кто наш враг? Кто желал его смерти? По правде говоря, список подозреваемых велик. Мало кому из аверсарианцев нравились его призывы к миру с нелюдями или к уничтожению [Concept('magi','магической')|E] касты, но прибегнуть к таким средствам?.. Кого я обманываю, это самый аверсаринский поступок из всех возможных.\n\nНо кто именно? Мы должны узнать, нам необходимо это знать. Не только ради памяти Валерикса, но и для нашего собственного будущего. Мы должны найти нашего врага и уничтожить его. Иного выхода быть не может.\n\nЯ немедленно собираю отряд для расследования этого дела. Пришло время задавать вопросы и готовить клинки."
  eastern_reforms.0001.a: "За Аверсарию!"
  
  eastern_reforms.0002.title: "Слово губернатора"
  eastern_reforms.0002.desc: "Губернатор Тетрадия, женоподобный как всегда, входит в мои покои. От него разит дюжиной разных благовоний, которые, без сомнения, стоят дороже доспехов целой когорты.\n\n«Леган, — начинает он, явно сомневаясь в ценности подобного титула, — твои ищейки извели меня. Мне это надоело, у меня есть для тебя сведения. Забери их, перебей своих врагов и верни мне мой город».\n\nПривычные для него слова, однако свиток, который он бросает передо мной, содержит действительно полезную информацию. Тайные перемещения ольтенских племен на запад. Несколько случаев дезертирства среди новых новобранцев из восточных племен вскоре после смерти Валерикса, а также отчет лекарей, осматривавших тело Валерикса, в котором упоминается яд, изготовляемый только на дальнем востоке..."
  eastern_reforms.0002.a: "Неопровержимые улики..."
  
  eastern_reforms.0003.title: "Слова под маской"
  eastern_reforms.0003.desc: "Хатан Алтан из племени Ктеумаха прислал ко мне гонца и серию писем, надиктованных им лично, с примечаниями нескольких моих ольтенских вассалов.\n\nПисьмо описывает иную версию гибели легона Валерикса. Попытки подкупа его и его соплеменников загадочными агентами с [Concept('aversaria','аверсарианским')|E] акцентом; ольтеснкая ночная стража Валерикса не дезертировала, а бесследно исчезла вскоре после происшествия — причем среди них была женщина, славившаяся своей преданностью и честью. Наконец, похожее обвинение в использовании восточного яда, но с оговоркой: продавец этого яда был схвачен и перед самоубийством успел сообщить, что яд был доставлен в наш порт третьей стороной...\n\nАлтан указывает в письме, что не хочет делать поспешных выводов за меня, но намекает, что виновник, скорее всего, находится в моем собственном дворе..."
  eastern_reforms.0003.a: "Вот как? Есть над чем подумать..."
  eastern_reforms.0003.a.tt: "Имея на руках улики, мы должны сделать выбор"
  
  eastern_reforms.0004.title: "Восстание!"
  eastern_reforms.0004.desc: "Мои люди уже движутся на восток, чтобы вершить суд над ольтенскими племенами. Я чувствую сомнение в душе, но эти сомнения нужно выжечь. Предатели — те, кого я когда-то считала родней, — доказали, что недостойны своих масок. Я буду вонзать кинжал в сердце каждого из них лично, ибо память о Валериксе должна быть отомщена.\n\nТетрадия прислал чисто символический отряд и немного монет в помощь, о чем даже смешно упоминать. Жалкое зрелище от моего нового «союзника»."
  eastern_reforms.0004.a: "Смерть чужакам!"
  
  eastern_reforms.0005.title: "Мятеж!"
  eastern_reforms.0005.desc: "  Тетрадия, как и следовало ожидать, не стерпел обвинений. В своем довольно пространном призыве к оружию против меня он кем только меня не назвал —  предательницей, еретичкой, шлюхой, сукой, выскочкой, полукровкой, «жидкокровной», а затем еще четырьмя страницами оскорблений.\n\nОн делает это от страха, он делает это от глупости, он делает это потому, что даже не догадывается, как скоро предстанет перед судом. Благородный дух Валерикса с нами, как и ольтены, и я клянусь своим именем и честью моего Легиона, что никто из них не будет посрамлен."
  eastern_reforms.0005.a: "Смерть предателю!"

  eastern_reforms.0006.title: "Убить губернатора"
  eastern_reforms.0006.desc: "Всё кончено.\n\nТетрадия сидит передо мной в цепях: в одну секунду он хнычет и молит о пощаде, а в следующую — проклинает мое имя. Его личная охрана — отряд наёмников-кикарсагов — лежит мёртвой или сидит с мечами у спины, сдавшись в последние мгновения битвы. Вокруг нас горит его поместье, а я наблюдаю, как мои люди медленно выводят его рабов за пределы усадьбы — на их полуголодных телах видны следы долгих издевательств и пыток.\n\nЭто зрелище... сказать, что оно наполняет меня гневом,Вид этого... сказать, что это наполняет меня яростью, значит ничего не сказать. Я вонзаю клинок в бедро Тетрадии, и тот издает пронзительный вопль.\n\n— «Признайся, и я не буду делать это более болезненным, чем должно быть, Тетрадия».\n\nМужчина снова всхлипывает, и я проворачиваю лезвие, пока мои люди и его оставшиеся охранники мрачно наблюдают за этим. Ещё один крик, а затем он кивает сквозь слезы.\n\n— «Я сделал это, проклятие на вашу голову! Этот дурак собирался погубить нас всех! Освободить рабов? Избавить нас от [Concept('magi','магов')|E]? Он был идиотом! И ты такая же, шлюха худородная!»\n\nЯ медленно извлекаю клинок из его бедра и вздыхаю.\n\n— «Шлюхой была моя мать, Тетрадия. Я же — леган.»\n\nОдним стремительным движением голова Тетрадии слетает с плеч и катится по древней мозаике его поместья, заполняя кровью узоры.\n\nСо смертью Тетрадии за Валерикса отомстили, а союз с ольтенами скреплен. Настало время воплотить мечту Валерикса в жизнь и подготовиться к отвоеванию земель."
  eastern_reforms.0006.a: "Мы отомстим за Аверсарию."
  eastern_reforms.0006.a.tt: "Теперь доступны новые решения"
  
  eastern_reforms.0007.title: "Начало вторжения"
  eastern_reforms.0007.desc: "Пришёл наш час. Передо мной выстроился легион — точь-в-точь как в дни Валерикса, когда начинался первый поход на запад, — а рядом с ним наши новые союзники. Вчерашние рабы, ольтенские племена, добровольцы со всего востока. Перед нами — врата [GetTitleByKey('c_asiupoli').GetNameNoTier], великого города, что сверкает посреди пустошей даже в своём разрушенном после Фродброкны состоянии.\n\nФенвиров нельзя недооценивать, и нам понадобятся храбрость, мастерство и хитрость, чтобы одолеть их. Не помешала бы и дополнительная помощь — ольтены уже пообещали поддержку в обмен на свои притязания в Ниодни. Южные земли теперь, по сути, пустошь, и хотя отдавать законные [Concept('aversaria','аверсарианские')|E] земли, несомненно, будет досадно, это ничтожная цена за возвращение всей родины."
  eastern_reforms.0007.a: "Ольтены уже помогали нам — скрепим союз делом."
  eastern_reforms.0007.b: "[Concept('aversaria','Аверсария')|E] будет единой — вся, до последнего клочка."
  
  eastern_reforms.0008.title: "[Concept('aversaria','Аверсарианцы')|E] взывают о помощи"
  eastern_reforms.0008.desc: "Гекаэда, женщина-полководец с запада, вновь просит нашей поддержки. Уже доказав, что в душе она - одна из нас, как и её мать, теперь она подтверждает и своё право называться истинной Хатаном для своего народа. Она поклялась отвоевать город своих предков и просит своих кровных братьев из наших кланов присоединиться к ней. В обмен на помощь в этой войне она обещает передать нам земли в Ниодни для поселения."
  eastern_reforms.0008.a: "Мы поможем нашей кровной сестре, как и должно."
  eastern_reforms.0008.b: "Сестра она или нет, но рассчитывать она может только на себя."
  
  eastern_reforms.0009.title: "Восточный союз"
  eastern_reforms.0009.desc: "Ольтенские племена моей матери доказали свою верность и сдержали обещание. Всадники Ктеумаха уже влились в наши ряды, и обещают, что остальная часть их армии подойдет в ближайшее время. Теперь, когда мы едины — разве эти фенвирские отбросы осмелятся нам противостоять?"
  eastern_reforms.0009.a: "За Аверсарию! Вперёд!"
    
  eastern_reforms.0010.title: "Восточный союз рушится"
  eastern_reforms.0010.desc: "Ольтенские племена, несмотря на свою грозную репутацию, показали себя лишёнными чести. Они нарушили данное мне слово — хотя мы связаны кровными узами — и отказались встать под наши знамёна."
  eastern_reforms.0010.a: "Тогда мы освободим нашу землю без них!"
    
  eastern_reforms.0011.title: "Начало вторжения"
  eastern_reforms.0011.desc: "Сомнения о смерти Валерикса и её истинных причинах всё ещё терзают меня, но я должна отбросить их ради предстоящей битвы. Какие бы реформы ни ждали нас впереди, [GetTitleByKey('c_asiupoli').GetNameNoTier] не может оставаться в руках фенвиров, пока [Concept('aversaria','аверсарианцы')|E] живы и готовы его отвоевать. Передо мной выстроились чистокровные сыны Аверсарии — мой легион и личные войска губернатора. Настал час вернуть наш город."
  eastern_reforms.0011.a: "В атаку!"
  
  redlands_decision.0001.title: "Продажа призмы"
  redlands_decision.0001.desc: "Покупатель прислал посланника, поздравив меня с побегом моей команды из Красных земель и предложив забрать артефакт у меня. Надеюсь, это избавит меня от необходимости когда-либо снова сталкиваться с  обезумевшими культистами и восьмилапымих тварями, которые преследовали меня на каждом шагу."
  redlands_decision.0001.a: "Уберите эту штуку с глаз моих."
  redlands_decision.0001.kashirya.tt: "Бездонная призма окажется где-то в Каширии."
  redlands_decision.0001.chevalie.tt: "Бездонная призма окажется где-то в Шевалье."
  redlands_decision.0001.sarradon.tt: "Бездонная призма окажется где-то в Саррадоне."

  redlands_decision.1000.t: "Гниющие земли"
  redlands_decision.1000.desc: "Наша кампания по изъятию из [redlands_decay_target.GetNameNoTier] всего ценного и полезного успешно превратила эти земли в бесплодную пустошь. Поскольку брать здесь больше нечего, пришло время решить, что делать с остатками."     
  redlands_decision.1000.a: "Пусть дикая природа поглотит их — мы закончили здесь."
  redlands_decision.1000.b: "Новый культ прекрасно впишется в эти земли."
  redlands_mystery_cult_spreads: "Таинственные культы в графстве"
  redlands_mystery_cult_spreads_desc: "Начинается хаос: поступают сообщения о таинственных культах, сеющих разрушение в [mystery_cult_spawn_location.GetNameNoTier]."
  redlander_decision.1000.magic_cost_tt: "Вы потеряете #negative_value; [EmptyScope.ScriptValue('redlander_decay_county_interaction_mana_cost')|0]#!@magic_icon![Concept('magic','магии')|E]"
  redlander_decision.1000.magic_gain_tt: "Вы получите #positive_value; [EmptyScope.ScriptValue('redlander_decay_county_interaction_mana_gain')|0]#!@magic_icon![Concept('magic','магии')|E]"
  
  redlands_decision.2001.t: "Алые каньоны навсегда"
  redlands_decision.2001.desc: "Годы конфликтов с чужаками, колонизаторами и ворами всех мастей когда-то подавляли [Concept('redlands_biozone','Красные земли')|E]. Но больше нет. С последними чужаками, бегущими к морю, Красные земли снова полностью принадлежат своим странным обитателям, и только время покажет, что принесёт их новая независимость."
  redlands_decision.2001.a: "Что ждёт в будущем?"

  redlands_decision.2002.t: "Исчезающие пески"
  redlands_decision.2002.desc: "То, что когда-то считалось самыми странными оккультистами [Concept('aversaria','Аверсарии')|E], больше не существует. «Красноземцы» когда-то доминировали в [Concept('redlands_biozone','Красных землях')|E], но с исчезновением их последних культов из каньонов они стали не более чем легендой. Только время покажет, что ожидает безмолвные каньоны."
  redlands_decision.2002.a: "Что ждёт в будущем?"

  redlands_decision.2003.t: "Разбитые Мечты"
  redlands_decision.2003.desc: "Кажется, любые грандиозные планы, связанные с хаосом, опустошающим [Concept('redlands_biozone','Красные земли')|E], потерпели крах, поскольку красноземцы возвращаются в глубины каньонов."
  redlands_decision.2003.a: "Что ждёт в будущем?"
  
  redlands_decision.2004.t: "Новый Мир"
  redlands_decision.2004.desc: "Несмотря на десятилетия, века интриг, планы культов красноземцев оказались тщетны. Никто уже не помнит, что нужно для достижения их целей, а хаос сменился хрупкой стабильностью."
  redlands_decision.2004.a: "Что ждёт в будущем?"
  
  redlands_decision.2005.t: "Древние замыслы воплотились"
  redlands_decision.2005.desc: "Грандиозные замыслы таинственных культов [Concept('redlands_biozone','Красных земель')|E] наконец принесли плоды. Хаос, сеявший разруху на их землях, теперь распространился по всей планете: Солнце, что некогда сияло вверху, угасает, и мир погружается во тьму."
  redlands_decision.2005.a: "Что ждёт в будущем?"
  
  redlands_crisis_ended_tooltip: "Кризис Красных земель завершён"
  story_redlands_crisis_story_name: "Кризис Красных Земель"
  story_redlands_crisis_story_desc: "Хаос охватил странные и загадочные [Concept('redlands_biozone','Красные земли')|E]: могущественная магия и зловещие культы вырываются из глубин песков."


  must_not_be_redlander_or_must_end_crisis: "Не должен исповедовать [Concept( 'faith', 'конфессию' )|E] [GetReligionByKey('redland_cults_religion').GetName] или должен завершить Кризис Красных земель."

  must_not_be_redlander_or_must_end_sun: "Не должен исповедовать [Concept( 'faith', 'конфессию' )|E] [GetReligionByKey('redland_cults_religion').GetName] или должен завершить Кризис Красных земель, убив Солнце."
