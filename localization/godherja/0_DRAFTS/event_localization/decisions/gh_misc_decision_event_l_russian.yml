l_russian:  
  gh_misc_decision_events.001.t:0 "Перепланировка столицы"
  gh_misc_decision_events.001.desc:0 "[capital_province.GetNameNoTooltip] станет сияющей жемчужиной, блистающей процветанием и вызывающей восхищение всего мира. Наши лучшие умы разработали чертежи и предложили несколько различных планов будущего нашей столицы."
  gh_misc_decision_events.001.a:0 "Огромная неприступная цитадель обнадежит мой народ и вселит страх в сердца моих врагов!"
  gh_misc_decision_events.001.b:0 "Величественный дворец продемонстрирует мое богатство и достоинство."
  gh_misc_decision_events.001.c:0 "Той малой властью, что у меня есть, я обязан[Select_CString(ROOT.Char.IsFemale, 'а', '' )] [ROOT.Char.GetFaith.HighGodName]"
  gh_misc_decision_events.001.d:0 "Великие базары и ухоженные бульвары облегчат приток и отправление торговли."
  gh_misc_decision_events.001.e:0 "Организованные жилые кварталы обеспечат место для роста населения."
  gh_misc_decision_events.001.f:0 "Великий порт разнесет весть о величии города во все уголки мира!"
  gh_misc_decision_events.001.g:0 "Ба! Какая польза от столицы без армии, способной удержать ее в нужных руках!"
  gh_misc_decision_events.002.t:0 "Славный город"
  gh_misc_decision_events.002.desc:0 "Я видел[Select_CString(ROOT.Char.IsFemale, 'а', '' )], как [capital.GetName] превращается в оживленный центр торговли и ремесла, но предстоит еще много работы. Как мне лучше всего применить свои навыки?"
  gh_misc_decision_events.002.a:0 "Если я знаю, как взять город, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] знать и как его построить!"
  gh_misc_decision_events.002.b:0 "Столица будет так же тщательно организована, как и мои книги учета."
  gh_misc_decision_events.002.e:0 "Я спрошу совета у великих семейств города."
  gh_misc_decision_events.002.d:0 "Я потяну за нужные ниточки, чтобы убедиться, что правильные люди получат правильные подряды..."
  gh_misc_decision_events.002.c:0 "Я применю все знания, полученные об успехах и неудачах моих предшественников."
  gh_misc_decision_events.003.t:0 "Оплоты власти"
  gh_misc_decision_events.003.desc:0 "Государства строятся на отношениях — страхе, уважении, престиже. Взращивание этого жизненно важно для правителя, и из этого города я создам символ власти, который переживет поколения."
  gh_misc_decision_events.003.a:0 "Город силен лишь настолько, насколько силен его фундамент."
  gh_misc_decision_events.003.b:0 "Он произведет впечатление как на послов, так и на вассалов."
  gh_misc_decision_events.003.c:0 "Удобный для жизни город — чудесный город."
  gh_misc_decision_events.003.d:0 "Город должен быть столь же почтенным, как и я сам[Select_CString(ROOT.Char.IsFemale, 'а', '' )]."
  gh_misc_decision_events.003.e:0 "Если так подумать..."
  gh_misc_decision_events.004.t:0 "О золоте и блеске"
  gh_misc_decision_events.004.desc:0 "Некоторые люди живут воображаемым убеждениям, другие внимают словам пророков и священных книг. Книга же учета заботится лишь о практичных делах мира, и если ее не уважать, она повергнет как добродетельных, так и жестоких. Торговля и коммерция — это двигатели, приводящие в движение все остальные. Я создам тонко настроенный двигатель торговли, и он вознесет нашу цивилизацию к новым высотам."
  gh_misc_decision_events.004.a:0 "Разумеется, торговля первостепенна."
  gh_misc_decision_events.004.b:0 "Прочность, польза и красота. Вот краеугольные камни архитектуры."
  gh_misc_decision_events.004.c:0 "Без людей нет и рынка."
  gh_misc_decision_events.004.d:0 "Золото, просто золото, меня не волнует, как оно сюда попадет."
  gh_misc_decision_events.004.e:0 "По зрелом размышлении..."
  gh_misc_decision_events.005.t:0 "Sophos Civitas"
  gh_misc_decision_events.005.desc:0 "В основе всех городов лежат убеждения, наше понимание мира и друг друга. Понять прошлое — значит сформировать будущее. Это будет город, хранящий знания о чудесах, которые были и могут быть, понимание невысказанных истин и полуправд на устах у каждого. С этой целью город будет указывать, словно божественная стрела, на осознание этих истин."
  gh_misc_decision_events.005.a:0 "Здесь будет построен город мудрецов и мыслителей."
  gh_misc_decision_events.005.b:0 "В здоровом теле — здоровый дух."
  gh_misc_decision_events.005.c:0 "Доверьтесь науке и ремеслу, чтобы построить светлое будущее."
  gh_misc_decision_events.005.d:0 "Святилище для исследователей божественного."
  gh_misc_decision_events.005.e:0 "Возможно, мне стоит передумать."
