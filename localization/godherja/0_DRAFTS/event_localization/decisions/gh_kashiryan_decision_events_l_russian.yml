l_russian:

 taryaad_reformed.0001.t:0 "Я — [Select_CString(ROOT.Char.IsFemale, 'единственная истинная наследница', 'единственный истинный наследник' )] "
 taryaad_reformed.0001.desc:0 "Поколениями земли и верования Каширии оставались разобщенными. Жажда власти, богатства и личной славы безнаказанно росла среди правителей и государств региона. Но из всего этого наиболее губительной, пожалуй, была жажда знаний. И когда эта жажда едва не поглотила земли во второй раз, сам владыка Паэрасджатан сошел на Эрас в обличье аватара — в обличье великого Асодживы, да благословят его душу. Победив силы мертвых, он провозгласил царство божье, которым он и его божественные потомки должны были править отныне — [Concept('taryaad_saramsaasan','Тарьяад Сарамсаасан')|E]. Увы, божественное царство, которому надлежало просуществовать тысячу лет, преждевременно пало во время опустошительного [Concept('vaarash','Ваараша')|E] из-за сочетания некомпетентного правления и вмешательства ученых. Каширия снова оказалась в руинах, и из-за отсутствия способного наследника Асодживы она вернулась к прежней эпохе раздробленности и беззакония.\n\nНо с моим завоеванием земель Асодживы у Каширии теперь есть [Select_CString(ROOT.Char.IsFemale, 'новая правительница, способная', 'новый правитель, способный' )] вести ее, новая династия во главе и новый бог, перед которым следует склониться. Рукоятью своего меча и блеском своей новой короны я провозглашаю себя и свою династию новыми правителями воссозданого Тарьяад Сарамсаасан!"
 taryaad_reformed.0001.a:0 "Склонитесь перед истинным аватаром Паэрасджатана!"
 
 taryaad_reformed.0002.t:0 "Тарьяад Сарамсаасан восстановлен"
 taryaad_reformed.0002.desc:0 "Издалека пришли вести, сообщающие, что большая часть Каширии преклонила колена перед одним правителем. Объявив себя «истинным наследником Асодживы», этот новый «бог-король» перековал давно погибшую империю [Concept('taryaad_saramsaasan','Тарьяад Сарамсаасан')|E]. Является ли он действительно потомком династии Тарьяад или нет — неважно. Было бы мудро не искушать этого зверя, пока он еще молоден и пока неизвестно, как сложится его будущее."
 taryaad_reformed.0002.a:0 "Остается лишь надеяться, что он не обратит взор сюда..."

 taryaad_reformed.0003.t:0 "Возвращение наследника Асодживы"
 taryaad_reformed.0003.desc:0 "Слава Паэрасджатану! Долгое время считалось, что правление династии Тарьяадов окончено. Что ни одно существо не сможет превзойти божественность Асодживы и его возвышенные свершения. Что Каширия навсегда останется лишенной крепкой руки в последствиях [Concept('vaarash','Ваараша')|E]. Но отныне это не так! Спустя долгое время появился новый правитель, чьи свершения затмевают свершения самого Асодживы. Он действительно утвердил себя как настоящий наследник престола [Concept('taryaad_saramsaasan','Тарьяад Сарамсаасан')|E] — если не по крови, то по чистому достоинству своих деяний."
 taryaad_reformed.0003.a:0 "Каширия больше не будет без руки на руле!"
 
 kashirya_decision.1001.t:0 "Возрожденный феникс"
 kashirya_decision.1001.desc:0 "Прошли века с тех пор, как ольтены правили землями Каширии. Века конфликтов, опустошения и смуты, но всему приходит конец.\n\nТеперь новый владыка управляет всеми землями от Каширията до Пролива Ножей, стремясь вернуть былое величие и стабильность [Concept('otachedian_empire','империи Отачеда')|E]. Только время покажет, будет ли процветать ли эта империя."
 kashirya_decision.1001.a:0 "Рассвет новой эры!"