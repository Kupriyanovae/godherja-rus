l_russian:
 kathuni_decision.0001.t:0 "Восстановление порядка на реке Цан"
 kathuni_decision.0001.desc:0 "Сокрушительное поражение в порту Шаньи почти сломило Командование Ланонана. Наши оставшиеся силы беспорядочно отступили на север, а свирепый натиск шрунфанских мятежников поверг нас в беспрецедентное отчаяние. Вскоре после этого вся наша фракция раскололась и оказалась на грани краха.\n\nИ все же теперь всё это принадлежит прошлому. Сегодня Ланонан восстал из пепла и возродился из отчаяния. Прочно объединившись под руководством прозорливого лидера, мы сплотили силы как никогда прежде. Великая кампания по отвоеванию наших утраченных территорий вот-вот начнется — пусть эти варвары трепещут перед гневом Небесной Армии!"
 kathuni_decision.0001.a:0 "Вперед! Ланонан!"
 kathuni_decision.0002.t:0 "Общество Тункан"
 kathuni_decision.0002.desc:0 "Когда наши предки были изгнаны и скитались, пока не поселились у Южного моря, они и помыслить не могли о сегодняшнем процветании Синь Сюэ. В Бронзовой гавани управление лежит на купцах, широко практикуются выборы, а социальная среда открыта. Более того, местные ученые, находящиеся вдали от своей родины в Катун-Кай, уделяют мало внимания интеллектуальным изысканиям — разительный контраст со стагнацией их родной земли. Это создало плодородную почву для распространения идей Синь Сюэ, позволив нам проникнуть во всю нацию и в конечном итоге захватить власть. Сегодня многие чиновники и простые люди пришли к принятию наших догматов. Хотя свободные ассоциации хорошо служили нам во дни нашей слабости, позволяя действовать из тени, они явно больше не подходят для процветания Синь Сюэ. Вдохновившись структурой организации Синь Сюэ в северном регионе Дунхай, мы создадим единую и сплоченную новую организацию — ту, что станет стойким щитом на защите режима Юанькана."
 kathuni_decision.0002.a:0 "Ради развития и роста Синь Сюэ."
 kathuni_decision.0003.t:0 "Декларация против мятежа"
 kathuni_decision.0003.desc:0 "Южное государство доказало свою нелояльность, отбросив праведность и предав благодать. Дикие племена пользуются возможностью, чтобы разворачивать наши приграничные территории. Они сжигают наши укрепления и грабят наш народ, убивают солдат нашего гарнизона и оскверняют наши священные земли. В прошлом мы поддерживали справедливость, чтобы умиротворять далекие регионы, возделывая бесплодные земли для распространения влияния короля по южной дикой местности. Меньше всего мы ожидали выпестовать предателей прямо у себя под боком!\n\nТеперь вождь мятежников, с сердцем ядовитых змей и нравом шакалов и волков, ведет свои беспорядочные войска на вторжение в наши границы, орудуя отравленными стрелами, чтобы терзать наш народ. В результате дороги Цанъу усыпаны обнаженными костями, а сигнальные костры города Чжуюань темнят небо даже в полдень. Поистине наступило время, когда верные сердца бьются в муке, а праведники проливают свою кровь!\n\nХотя мы лишь остатки некогда великой силы, как мы могли забыть долг по защите нашей земли? Даже среди миазматических дождей и диких смогов юга мы все еще крепко держим свои алебарды под небесами. Теперь мы собираем нашу могучую армию и поднимаем знамя верности и праведности. Мы клянемся очистить эту землю от ее скверного влияния и восстановить наши реки и горы. Все наши бывшие люди, кто может взяться за оружие, чтобы сразить мятежников, станут оплотом нашей нации. Куда указывает небесная мощь, там мятежные враги обязательно рухнут. По прибытии этой декларации да сплотятся все вместе!"
 kathuni_decision.0003.a:0 "Против мятежников! Против мятежников! Против мятежников!"
 kathuni_decision.0004.t:0 "Применяемая тактика"
 kathuni_decision.0004.desc:0 "Пламя, которое никогда не угасало, снова разгорелось по всей земле Ланонана. Вскоре наши армии снова ступили на знакомую территорию. На этот раз мы обязательно сметем все препятствия, отвоюем наши утраченные земли, заберем порт Шаньи у мятежников Миат Шрунфана и восстановим порядок в Южном море.\n\nГенералы различных сил собрались, чтобы обсудить стратегию этой войны. Многие считают, что лучше всего подойдет размеренный и методичный подход — постепенно отвоевывать города у мятежников, закрепляя успехи перед дальнейшим продвижением и таким образом минимизируя уязвимости. Некоторые молодые офицеры утверждают, что в войне необходима скорость, так как медленное продвижение позволит мятежникам собрать свои силы для решающего контрудара, что потенциально приведет к затяжному тупику. Вместо этого они выступают за приоритетное уничтожение эффективной силы противника, разбивая их по частям, пока они рассеяны. Эти разнящиеся взгляды отражают не только военные разногласия, но и скрытое напряжение внутри армии Ланонана. Как главнокомандующ[Select_CString(ROOT.Char.IsFemale, 'ая', 'ий' )], у вас есть свой уникальный план, отличный от обоих подходов. Однако, независимо от стратегии, только та, которая ведет к победе, может считаться хорошей стратегией."
 kathuni_decision.0004.a:0 "Принять более благоразумный подход."
 kathuni_decision.0004.b:0 "Возможность стучится лишь однажды."
 kathuni_decision.0004.c:0 "У меня есть свой план."
 kathuni_decision.0005.t:0 "Предательство предателей вновь"
 kathuni_decision.0005.desc:0 "Когда война достигла критического тупика, при вашем дворе появился неожиданный посетитель — эмиссар жугутанов, который передал их намерение: эти воины-кочевники были готовы поднять восстание против режима Миат Шрунфана в обмен на сохранение своей автономии после войны. Для вас, хотя это и представляло собой способ значительно ускорить конфликт, память о предательстве жугутанов во время Битвы за порт Шаньи все еще сохранялась. Если они предали единожды, что помешает им сделать это снова? Или, возможно, это не более чем ловушка? Пока вы взвешивали все «за» и «против», под растущим тревожным взглядом эмиссара, вы в конечном итоге приняли решение —"
 kathuni_decision.0005.a:0 "Мы не примем предателей снова."
 kathuni_decision.0005.b:0 "Хорошая сделка."
 kathuni_decision.0006.t:0 "Под нашим управлением"
 kathuni_decision.0006.desc:0 "Даже балансируя на грани уничтожения, мы в конечном итоге преодолели бесчисленные препятствия и положили конец десятилетиям войны. Некомпетентные и жестокие мятежники больше не могут терроризировать народ Ланонана; под правлением Командования на эту землю сошли мир и стабильность. Обездоленные беженцы вернулись на родину, а некогда заброшенные деревни ожили, неуклонно поставляя зерно в великие города Ланонана. Торговые пути постепенно расцвели, позволяя людям покупать всевозможные предметы первой необходимости на рынках. Словом, Ланонан вступил в редкий период процветания, заложив прочный фундамент для наших будущих начинаний."
 kathuni_decision.0006.a:0 "Это успех Ланонана."
 kathuni_decision.0007.t:0 "Преобразование социальных обычаев"
 kathuni_decision.0007.desc:0 "История контактов между Катун-Кай и сайелаянами насчитывает века. Еще во время [Concept('age_of_strife','Эпохи распрей')|E] в V веке династия Чэнька на севере вела торговлю с купцами из [Concept('kathun','Катуна')|E]. Будь то через вооруженные конфликты или мирные обмены, влияние катунов оставило глубокий след в Южных землях. Со временем стало трудно отличить сегодняшних сайелаянов от катунских иммигрантов; некогда пустынные земли теперь испещрены городами в катунском стиле. Обе стороны больше склонны рассматривать друг друга как сородичей, связанных кровью, а не как противников, и укоренилось чувство общности интересов. Протекторат, извлекая выгоду из их религиозных и культурных сходств, оказывается в лучшем положении для эффективного управления этими территориями."
 kathuni_decision.0007.a:0 "Концепция Катун-Кая расширяется дальше."
 kathuni_decision.0008.t:0 "Южное море под единой властью"
 kathuni_decision.0008.desc:0 "Падение [Concept('bureau_bronzeport','Бронзовой гавани')|E] по сравнению с процессом, привевшим к нему, было удивительно нецеремонным — не было ни грандиозного зрелища, ни торжественного провозглашения. Просто последний верховный министр в сопровождении нескольких чиновников предстал у ворот Бронзовой гавани перед генерал-протектором с печатью и официальными одеждами, дарованными Драконьим императором в прошлые годы. После зачитания обвинений, касающихся его проступков, последний верховный министр был уведен солдатами Протектората, что ознаменовало крах огромной коммерческой империи, когда-то доминировавшей на побережье Дахангона. Подъем Протектората теперь никому не под силу остановить. Хотя некоторые территории все еще лежали за пределами катунского влияния, мало кто сомневался, что их завоевание — лишь вопрос времени."
 kathuni_decision.0008.a:0 "Троекратное «Ура» протекторату! Да здравствует он!"