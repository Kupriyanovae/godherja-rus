l_russian:
 ##################################
 ####        Decisions
 ##################################
 
 # Encourage Amsari Settlement
 gh_amsari_migration_initiative_decision: "Поощрять заселение амсарцев" 
 gh_amsari_migration_initiative_decision_desc: "Земли левиденов многообещающие, но по большей части остаются неэффективно управляемыми. Предоставив земли и привилегии желающим амсарским поселенцам, я смогу обеспечить их процветание, одновременно заполучив верных подданных на этих более отдаленных территориях." 
 gh_amsari_migration_initiative_decision_tooltip: "Поощрять амсарских поселенцев переселяться и утверждаться в левиденских графствах." 
 gh_amsari_migration_initiative_decision_confirm: "Земля ждет новых рук!"
 gh_forced_settlements_modifier: "Поселенцы-амсарцы" 
 gh_forced_settlements_modifier_desc: "Графство недавно было заселено амсарским населением." 
 
 # Bring Sarthian Farmers
 gh_employ_sarthian_farmers_decision: "Пригласить сартийских фермеров" 
 gh_employ_sarthian_farmers_decision_desc: "Сартийцы славятся своим мастерством обработки земли, их методы дают богатые урожаи там, где другие терпят трудности. Пригласив их в свои владения, я могу гарантировать, что поля будут должным образом обработаны, а амбары останутся полными." 
 gh_employ_sarthian_farmers_decision_tooltip: "Сартийцы сделают эти земли более зелеными." 
 gh_employ_sarthian_farmers_decision_confirm: "Пусть пашут землю!"
 gh_sarthian_farmers_modifier: "Опыт сартийских фермеров" 
 gh_sarthian_farmers_modifier_desc: "Правитель этого графства пригласил сартийских фермеров для обработки своих полей." 
 
 # Establish the Kingdom of Levan
 gh_form_leviden_kingdom_decision: "Основать королевство Леван" 
 gh_form_leviden_kingdom_decision_desc: "Слишком долго мы преклоняли колени в тени наших соседей. Хватит. Я принесу славу своему народу и выкую новое королевство — то, что переживет хватку внешних династий и преходящих империй." 
 gh_form_leviden_kingdom_decision_tooltip: "Объединить левиденов под одной короной." 
 gh_form_leviden_kingdom_decision_confirm: "Левидены встанут как один!"
 gh_leviden_kingdom_modifier: "Правители Левана"
 gh_leviden_kingdom_modifier_desc: "Эта семья добилась значительного присутствия в Леване и соседних регионах и стремится взять под контроль все их богатства и сокровища.\n\n"
 alghurb_bay_coast_region: "Черное море"
 modifier_leviden_kingdom_desc: "Увеличивается за каждое [Concept('county','графство')|E]"
 MODIFIER_DEFINITION_LEVIDEN_KINGDOM: "Этот модификатор увеличивается за каждое удерживаемое [Concept('county','графство')|E] в [Concept('region','регионе')|E] [GetGeographicalRegion('alghurb_bay_coast_region').GetName]"
 unlocks_alghurb_bay_naval_conquest: "Разблокирует [Concept('casus_belli','поводы к войне')|E] #emp Расширение графства#! и #emp Морское расширение графства#! в [Concept('region','регионе')|E] [GetGeographicalRegion('alghurb_bay_coast_region').GetName] на время действия [Concept('modifier','модификатора')|E] [Concept('house','дома')|E]"
 gh_conqueror_alghurb_bay_modifier: "Завоеватель залива Альгурб"
 gh_conqueror_alghurb_bay_modifier_desc: "Залив Альгурб окажется под моим законным правлением."
 alghurb_bay_coast_region_development_growth: "$MOD_MONTHLY_DEVELOPMENT_GROWTH_FACTOR$ в [Concept('region','регионе')|E] [GetGeographicalRegion('alghurb_bay_coast_region').GetName]"
 
 # Purchase Sarthian Wine
 gh_buy_sarthian_wine_decision: "Купить сартийское вино"
 gh_buy_sarthian_wine_decision_desc: "Сартийские виноградники славятся своим глубоким, богатым вкусом, их урожаи востребованы во дворах по всему миру. Несколько бочек их лучшего вина сослужат хорошую службу, будь то для меня самого или для тех, чьей благосклонности я желаю добиться."
 gh_buy_sarthian_wine_decision_tooltip: "Приобрести партию сартийского вина."
 gh_buy_sarthian_wine_decision_confirm: "Послать за виноделами!"
 gh_sarthian_wine_modifier: "Куплено сартийское вино"
 gh_sarthian_wine_modifier_desc: "Этот персонаж приобрел запас знаменитого сартийского вина. Будь то наслаждение его вкусом или использование для произведенния впечатления на гостей, его наличие наверняка оставит след."

 # Dismantle the Ayyar
 gh_dismantle_ayyar_decision: "Сокрушить восточного врага"  
 gh_dismantle_ayyar_decision_desc: "С древних времен айяры были язвой на нашей законной сфере влияния над регионом. Почти во всех отношениях они противостояли нам и подрывали наше правление. Даже победа Аушедара над ними в начале XI века оказалась кратковременной. Контроль над всем побережьем гарантирует, что их хватка над регионом будет сломана раз и навсегда."   
 gh_dismantle_ayyar_decision_tooltip: "Начнется война за уничтожение империи Айяр."  
 gh_dismantle_ayyar_decision_confirm: "Война с айярами!"   
 gh_dismantle_ayyar_decision_effect_tooltip: "Начнется война за уничтожение империи Айяр."
 
 gh_amsari_major_decision.0001.t: "Гниль на востоке"
 gh_amsari_major_decision.0001.desc: "Слишком долго мы позволяли гнили разрастаться на востоке. Айяры правили с жадностью и неконтролируемыми амбициями, считая себя несокрушимыми.\n\nТеперь, когда весь Амсар обезопасен, а земли шехардов прочно находятся под моим правлением — вне их досягаемости, — их время подошло к концу. Их правление, когда-то неоспоримое вдоль побережья, непригодно для будущего, которое я сформирую."
 gh_amsari_major_decision.0001.a: "Их падение неизбежно."

 gh_amsari_major_decision.0002.t: "Расплата близко"
 gh_amsari_major_decision.0002.desc: "[hiklahn_qanamsar.GetTitledFirstName] объявил[Select_CString(hiklahn_qanamsar.IsFemale, 'а', '' )] весь регион своим. [hiklahn_qanamsar.GetSheHe|U] уже захватил[Select_CString(hiklahn_qanamsar.IsFemale, 'а', '' )] земли шехардов и заявил[Select_CString(hiklahn_qanamsar.IsFemale, 'а', '' )], что нашему правлению скоро придет конец. Но мы никогда не были чужаками — мы высекли свое место сталью и огнем, и [hiklahn_qanamsar.GetSheHe] тоже научится нас бояться."
 gh_amsari_major_decision.0002.a: "Пусть приходит."
 
 gh_amsari_major_decision.0003.t: "Айяры разгромлены"
 gh_amsari_major_decision.0003.desc: "Свершилось. Правление айяров над восточным побережьем было сокрушено. Их крепости заброшены, их знамена порваны, а их авторитет свелся к шепоту среди обездоленных. [ayyar_ruler.GetTitledFirstName] больше не может повелевать верностью своего народа и требовать господства над землями, которые теперь преклоняются передо мной.\n\nВосток больше им не принадлежит. Он принадлежит Хиклахну, как и должно было быть всегда."
 gh_amsari_major_decision.0003.a: "Их время прошло."

 gh_amsari_major_decision.0004.t: "Царство в руинах"
 gh_amsari_major_decision.0004.desc: "Наше владычество утеряно. Земли, которыми мы правили, города, которые мы строили, — все пало в руки [hiklahn_qanamsar.GetTitledFirstName]. Побережье больше не наше. Наши армии рассеяны, наше правление уничтожено.\n\nТе из нашего народа, кто остался, теперь говорят о сдаче, изгнании или кое-чем похуже. Хиклахн не предлагает милосердия, он только забирает. И он забрал всё."
 gh_amsari_major_decision.0004.a: "Так вот как все кончится..."
 
 gh_amsari_major_decision.0005.t: "Айяры выстаяли"
 gh_amsari_major_decision.0005.desc: "Вопреки всем ожиданиям, [ayyar_ruler.GetTitledFirstName] сумел[Select_CString(ayyar_ruler.IsFemale, 'а', '' )] организовать эффективную оборону против моих сил! Своей победой [ayyar_ruler.GetSheHe] придал[Select_CString(ayyar_ruler.IsFemale, 'а', '' )] новую легитимность своей дряхлеющей империи и запятнал[Select_CString(ayyar_ruler.IsFemale, 'а', '' )] мое имя безвозвратно."
 gh_amsari_major_decision.0005.a: "Это не может быть концом..."

 gh_amsari_major_decision.0006.t: "Хиклахн отражён"
 gh_amsari_major_decision.0006.desc:0 "Ученые еще долго будут обсуждать, какая глупость заставила [hiklahn_qanamsar.GetTitledFirstName] развязать войну против нас. [hiklahn_qanamsar.GetTitledFirstName] думал[Select_CString(hiklahn_qanamsar.IsFemale, 'а', '' )], что [hiklahn_qanamsar.GetHerHis] претензий будет достаточно, что восток просто склонится перед [hiklahn_qanamsar.GetHerHim]. Но [hiklahn_qanamsar.GetHerHis] война закончилась позором, а [hiklahn_qanamsar.GetHerHis] амбиции разбиты. Айяры остаются, как и всегда, непокоренными и несломленными."
 gh_amsari_major_decision.0006.a: "В этом никогда не было сомнений."

 dismantle_ayyar_threat_cb: "Развал претендента"
 dismantle_ayyar_threat_cb_victory_desc:1 "$e_ayyar$ уничтожен. Все [Concept('de_jure','де-юре')|E] вассальные титулы $e_ayyar_adj$ становятся де-юре частью $e_amsari_article$$e_amsari$."
 dismantle_ayyar_threat_cb_defeat_desc:1 "$e_ayyar$ остается нетронутым. $e_amsari$ придется выплатить военные репарации."

 gh_end_western_threat_decision: "Положить конец западной угрозе"  
 gh_end_western_threat_decision_desc: "С давних времен амсарцы вмешивались в дела всего региона. Слишком много раз мы были вынуждены переходить к обороне. Контролируя все побережье, мы можем нанести удар в самое сердце их могущества и положить конец их посягательствам раз и навсегда." 
 gh_end_western_threat_decision_tooltip: "Начнется война за уничтожения влияния Амсарского Хиклахна."  
 gh_end_western_threat_decision_confirm: "Война Хиклахну!"  

 gh_consult_dream_interpreter_decision: "Посоветоваться с толкователем снов"  
 gh_consult_dream_interpreter_decision_desc: "Сны — это не просто мимолетные видения, это проблески невидимых истин. Опытный толкователь может раскрыть их значение, давая представление о том, что ждет впереди или что таится под поверхностью."  
 gh_consult_dream_interpreter_decision_tooltip: "Искать руководства у толкователя снов."  
 gh_consult_dream_interpreter_decision_confirm: "Раскрыть скрытые знаки."  
 gh_consult_dream_interpreter_decision_effect_tooltip: "Вы обратитесь за руководством к толкователю снов." 


 ##################################
 ####        Events
 ##################################
 
 #To do or not to do
 gh_consult_dream_interpreter_decision.0001.t.first: "Шепот моих снов"
 gh_consult_dream_interpreter_decision.0001.t.second: "Эхо во тьме"
 gh_consult_dream_interpreter_decision.0001.desc.first: "Сон сохраняется в моем сознании, его значение ускользает. Образы мелькают на грани памяти — символы незнакомые, но каким-то образом известные, послание прямо за пределами моего понимания.\n\nТакие видения нельзя игнорировать. Некоторые сказали бы, что сны — это лишь эхо разума, но я знаю лучше. Вопрос остается: стоит ли мне искать их значение или позволить им раствориться в ночи?"
 gh_consult_dream_interpreter_decision.0001.desc.second: "Говорят, что тот, кто игнорирует чужой сон — слеп, но тот, кто игнорирует свой собственный сон — дурак. Это один из многих способов общения божественного с простыми смертными, и есть те, кто расшифровывает их значение лучше других — они слышат истины, скрытые в снах. Если я ищу ответы, я их найду. Если я отвернусь, сон останется моим собственным, шепча свои тайны глухим ушам."
 gh_consult_dream_interpreter_decision.0001.a: "Я проконсультируюсь со своим собственным толкователем снов."
 gh_consult_dream_interpreter_decision.0001.b: "Я посещу Дом Снов."
 gh_consult_dream_interpreter_decision.0001.c: "Я не буду размышлять о них."
 
 # Dream Means Nothing
 gh_consult_dream_interpreter_decision.0002.t.first: "Ничего, кроме снов"  
 gh_consult_dream_interpreter_decision.0002.t.second: "Блуждание разума"  
 gh_consult_dream_interpreter_decision.0002.t.third: "Сон, как и любой другой" 
 gh_consult_dream_interpreter_decision.0002.desc.first: "[dream_interpreter.GetFirstName] терпеливо слушает, пока я рассказываю свой сон, время от времени кивая. Когда я заканчиваю, [dream_interpreter.GetSheHe] некоторое время сидит в молчании, прежде чем заговорить. «Это всего лишь работа беспокойного разума», — говорит [dream_interpreter.GetSheHe] просто. «Здесь нет предзнаменования, нет послания, скрытого в складках сна».\n\n[dream_interpreter.GetSheHe|U] смотрит на меня: «Сны блуждают, где им вздумается, затягивая случайные мысли и заботы в свои сети. Иногда это все, чем они являются».\n\nСлова должны быть успокаивающими, но они заставляют меня задумываться: высматривал[Select_CString(ROOT.Char.IsFemale, 'а', '' )] ли я нечто большее?" 
 gh_consult_dream_interpreter_decision.0002.desc.second: "[dream_interpreter.GetFirstName] пристально слушает, пока я рассказываю свой сон, и [dream_interpreter.GetHerHis] выражение лица остается непроницаемым. Когда я заканчиваю, [dream_interpreter.GetSheHe] тихо выдыхает, прежде чем вынести вердикт. «Здесь нечего распутывать, [ROOT.Char.GetTitledFirstName]. Это просто сон, как и бесчисленное множество других до него».\n\n[dream_interpreter.GetSheHe] складывает руки перед собой. «Разум плетет свои собственные истории во тьме, выхватывая мысли из бодрствующей жизни и придавая им иную форму. Вполне естественно задаваться вопросом, есть ли в этом смысл, но не каждый сон несет его».\n\nОтвет прост, возможно, слишком прост..." 
 gh_consult_dream_interpreter_decision.0002.desc.third: "[dream_interpreter.GetFirstName] слушает, пока я пересказываю детали своего сна. Когда я заканчиваю, [dream_interpreter.GetSheHe] слегка качает головой. «Здесь нет ничего, заслуживающего внимания, [ROOT.Char.GetTitledFirstName]», — говорит [dream_interpreter.GetSheHe]. «То, что вы видели, было не более чем праздно блуждающим разумом — фрагментами памяти, случайными мыслями, сшитыми во сне».\n\n[dream_interpreter.GetSheHe|U] продолжает: «Если это вас обеспокоило, выбросьте это из головы. Некоторые сны задерживаются, но это не делает их значимыми»." 
 gh_consult_dream_interpreter_decision.0002.a.first: "Возможно, [dream_interpreter.GetSheHe] прав — это было ничто."  
 gh_consult_dream_interpreter_decision.0002.a.second: "Не все сны несут смысл."  
 
 # Bad Dream
 gh_consult_dream_interpreter_decision.0003.t: "Предупреждение во тьме"
 gh_consult_dream_interpreter_decision.0003.desc.first: "[dream_interpreter.GetFirstName] пристально слушает, пока я рассказываю свой сон, и выражение [dream_interpreter.GetHerHis] лица меняется. Когда я заканчиваю, царит тишина, пока [dream_interpreter.GetSheHe] наконец не заговорит. «Это не обычный сон, [ROOT.Char.GetTitledFirstName]. Это предупреждение. Я видел[Select_CString(dream_interpreter.IsFemale, 'а', '' )] подобные видения раньше — сны, окутанные тенью, ветер несчастья. Что бы это ни было, вы должны быть готовы».\n\nЯ искал[Select_CString(ROOT.Char.IsFemale, 'а', '' )] ответы — теперь я думаю, хотел[Select_CString(ROOT.Char.IsFemale, 'а', '' )] ли я их услышать."  
 gh_consult_dream_interpreter_decision.0003.desc.second: "[dream_interpreter.GetFirstName] слушает, пока я говорю, и выражение [dream_interpreter.GetHerHis] лица темнеет с каждым словом. Когда я заканчиваю, [dream_interpreter.GetSheHe] сидит в молчании, пальцы выводят невидимые узоры на столе. «Это сон, который нельзя игнорировать, [ROOT.Char.GetTitledFirstName]. Он говорит о несчастье», — говорит [dream_interpreter.GetFirstName]. «Знаки налицо — раздор, распад, судьба, оборачивающаяся против вас. Будь то предательство или промах, я не могу сказать, но путь впереди неопределен»." 
 gh_consult_dream_interpreter_decision.0003.a: "Если вырисовывается опасность, я встречу ее лицом к лицу."
 gh_consult_dream_interpreter_decision.0003.b.first: "Это всего лишь слова."
 gh_consult_dream_interpreter_decision.0003.b.second: "Сны — вещи ненадежные."
 gh_consult_dream_bad_omen_modifier: "Зловещее знамение"
 gh_consult_dream_bad_omen_modifier_desc: "Сон этого персонажа, похоже, несет дурные вести."
 
 # Good Dream
 gh_consult_dream_interpreter_decision.0004.t: "Благословение во сне"
 gh_consult_dream_interpreter_decision.0004.desc.first: "[dream_interpreter.GetFirstName] внимательно слушает, пока я рассказываю свой сон, и выражение [dream_interpreter.GetHerHis] лица меняется от размышления к чему-то почти благоговейному. Когда я заканчиваю, [dream_interpreter.GetSheHe] тихо выдыхает с понимающим взглядом. «Это сон к удаче, [ROOT.Char.GetTitledFirstName], знак того, что путь впереди многообещающий».\n\nБыл ли это по-настоящему знак удачи или всего лишь приятная интерпретация неизвестного?" 
 gh_consult_dream_interpreter_decision.0004.desc.second: "[dream_interpreter.GetFirstName] внимательно слушает. Когда я заканчиваю говорить, [dream_interpreter.GetSheHe] слегка откидывается назад. «Это сон о благосклонности, [ROOT.Char.GetTitledFirstName]», — говорит [dream_interpreter.GetSheHe]. «Поистине редкая вещь».\n\n[dream_interpreter.GetSheHe] продолжает: «Есть сны-предупреждения, сны-замешательства, а есть такие сны — сны, которые приходят к тем, чей путь направлен к чему-то большему. Это знак руки Заорана, направляющей вас вперед. Что бы ни было впереди, вы встретите это не в одиночку»."   
 gh_consult_dream_interpreter_decision.0004.a: "Тогда я приму то, что грядёт."
 gh_consult_dream_good_omen_modifier: "Доброе знамение"
 gh_consult_dream_good_omen_modifier_desc: "Сон — вестник хороших новостей, его смысл окутан удачей."


 # Murder against your but doesn't know who
 gh_consult_dream_interpreter_decision.0005.t: "Толкование сна"  
 gh_consult_dream_interpreter_decision.0005.desc: "[dream_interpreter.GetFirstName] слушает в молчании, пока я рассказываю свой сон, и [dream_interpreter.GetHerHis] обычное спокойствие сменяется чем-то более холодным. Когда я заканчиваю, [dream_interpreter.GetSheHe] медленно выдыхает. «Это не просто сон, [ROOT.Char.GetTitledFirstName]. Это предупреждение».\n\n[dream_interpreter.GetSheHe] наклоняется вперед, понизив голос. «Это знак невидимого охотника, опасность, скрытая за фальшивыми улыбками и знакомыми голосами. Кто-то замышляет против вас, но сон не дает ни лица, ни имени — только уверенность в том, что нож уже вытащен»."  
 gh_consult_dream_interpreter_decision.0005.a: "Я никому не буду доверять, пока не раскрою правду."
 gh_consult_dream_interpreter_decision.0005.b: "Сон ведь не может меня убить, правда?..."
 
 # Murder against you and know the name
 gh_consult_dream_interpreter_decision.0006.t: "Толкование сна"  
 gh_consult_dream_interpreter_decision.0006.desc: "[dream_interpreter.GetFirstName] слушает, пока я рассказываю свой сон, и выражение [dream_interpreter.GetHerHis] лица темнеет с каждым словом. Когда я заканчиваю, [dream_interpreter.GetSheHe] резко выдыхает, пальцы сжимаются в раздумьях. «Это не простое видение, [ROOT.Char.GetTitledFirstName]», — говорит [dream_interpreter.GetSheHe]. «Это откровение».\n\n[dream_interpreter.GetSheHe] внимательно смотрит на меня, прежде чем заговорить снова. «Сон дал вам имя, не так ли? Сны могут быть загадочными, но некоторые истины проскальзывают — эта слишком ясна, чтобы ее игнорировать. [murder_schemer.GetFirstName] ходит с кинжалом в сердце, выжидая момента для удара».\n\nЕсли сон говорит правду, то угроза больше не загадка. Единственный вопрос теперь — что с этим делать."  
 gh_consult_dream_interpreter_decision.0006.a: "Я не буду ждать, пока [murder_schemer.GetSheHe] ударит [Select_CString(murder_schemer.IsFemale, 'первой', 'первым' )]."  
 gh_consult_dream_interpreter_decision.0006.b: "Один лишь сон — не доказательство."   
 
 # Someone trying to seduce you
 gh_consult_dream_interpreter_decision.0007.t: "Толкование сна"  
 gh_consult_dream_interpreter_decision.0007.desc: "Сон задерживается в моих мыслях, ускользая из рук всякий раз, когда я пытаюсь вспомнить его полностью. Тень, подбирающаяся ближе, голос — мягкий, манящий, его слова теряются в тот момент, когда я просыпаюсь. Прикосновение, легкое, как шепот, исчезающее прежде, чем я успеваю повернуться к его источнику.\n\n[dream_interpreter.GetFirstName] слушает, глаза сужаются, пока [dream_interpreter.GetSheHe] взвешивает мои слова. После минуты молчания [dream_interpreter.GetSheHe] говорит: «Есть те, кто желают вас, хотя в тайне или в коварных замыслах, я не могу сказать»."  
 gh_consult_dream_interpreter_decision.0007.a: "Тогда я раскрою их сам."
 gh_consult_dream_interpreter_decision.0007.b: "Пусть играют в свою игру..."
 
 # Someone trying to abduct you
 gh_consult_dream_interpreter_decision.0008.t: "Толкование сна"  
 gh_consult_dream_interpreter_decision.0008.desc: "Сон держит меня даже после пробуждения — обрывочно. Руки, хватающие из тьмы, уходящая из-под ног земля, ощущение, что меня тащат туда, куда я не хочу идти. Дверь, закрывающаяся за мной.\n\n[dream_interpreter.GetFirstName] внимательно слушает, выражение [dream_interpreter.GetHerHis] лица более серьезное, чем прежде. «Это не простое блуждание разума, [ROOT.Char.GetTitledFirstName]», — говорит [dream_interpreter.GetSheHe] тихим голосом. «Это предупреждение. Кто-то стремится забрать вас, завладеть вами ради собственных целей. Сон не раскрывает, кто именно, но намерение очевидно»."  
 gh_consult_dream_interpreter_decision.0008.a: "Я буду готов[Select_CString(ROOT.Char.IsFemale, 'а', '' )] к ним."  
 gh_consult_dream_interpreter_decision.0008.b: "Я отказываюсь жить в страхе."  


 gh_consult_dream_interpreter_decision.0009.t: "Толкование сна"  
 gh_consult_dream_interpreter_decision.0009.desc: "Сон движется подобно реке. То, что когда-то было далеким, теперь нависает близко — шаги, которые должны были занять годы, совершаются за считанные мгновения, двери открываются прежде, чем я до них доберусь. Лица, бывшие некогда неопределенными, теперь поворачиваются ко мне с знающим взглядом.\n\n[dream_interpreter.GetFirstName] слушает, медленно кивая, пока я говорю. Когда я заканчиваю, [dream_interpreter.GetSheHe] наклоняется вперед. «Путь перед вами не простянется так долго, как вы думали раньше. Течения судьбы движутся, увлекая вас вперед. Что бы вы ни привели в движение, это наступит раньше, чем ожидалось»."  
 gh_consult_dream_interpreter_decision.0009.a: "Тогда я встречу судьбу, как она придет."  
 
 gh_consult_dream_interpreter_decision.0010.t: "Толкование сна"  
 gh_consult_dream_interpreter_decision.0010.desc: "Сон был не о далеких победах и не о медленном, изнурительном прогрессе — он был о движении. Стены рушились прежде, чем я успевал начать осаду, голоса приносили вассальную клятву до того, как были высказаны требования.\n\n[dream_interpreter.GetFirstName] внимательно слушает: «Ветры судьбы смещаются в вашу пользу, неся вас вперед быстрее, чем вы планировали»."
 gh_consult_dream_interpreter_decision.0010.a: "Тогда я захвачу её без колебаний."  
 
 gh_consult_dream_interpreter_decision.0011.t: "Толкование сна"  
 gh_consult_dream_interpreter_decision.0011.desc: "В моем сне я двигался вперед, но дорога подо мной рушилась. Каждый шаг казался тяжелее предыдущего, тени простирались по моему пути. [dream_interpreter.GetFirstName] слушает, слегка нахмурившись.\n\n«То, что казалось несомненным, выскользнет из ваших рук, если вы не будете готовы сражаться за это», — произносит [dream_interpreter.GetSheHe] наконец."  
 gh_consult_dream_interpreter_decision.0011.a: "Тогда да будет так."