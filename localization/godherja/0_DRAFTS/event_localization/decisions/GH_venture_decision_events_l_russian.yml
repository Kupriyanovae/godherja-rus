 gh_company_venture_cut_ties_decision: "End the [Localize(Concatenate(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_venture_region_name_variable').GetFlagName,'_name'))]"
 gh_company_venture_cut_ties_decision_desc: "I have put enough into this venture that I no longer need the patrons of the [Localize(Concatenate(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))] behind it. The arrangement served its purpose, now it is time to take what I have built and rule it on my own terms."
