 gh_company_venture_ask_for_funds_decision: "Ask for a Loan"
 gh_company_venture_ask_for_funds_decision_desc: "The fortunes of a [gh_company_venture|E] can change rapidly and this one needs more than I can provide alone. I can ask the patrons of the [Localize(Concatenate(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))] for a contribution but they will not be pleased to hear it."
 gh_company_venture_ask_for_funds_decision_tooltip:  "Request emergency funds from the patrons of the [Localize(Concatenate(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))] to keep the [gh_company_venture|E] afloat"
