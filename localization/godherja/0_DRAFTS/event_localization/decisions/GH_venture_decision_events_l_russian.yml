 gh_company_venture_appease_with_funds_decision: "Send Profits"
 gh_company_venture_appease_with_funds_decision_desc: "Profits are expected but generosity is remembered. A sum beyond what the patrons of the [Localize(Concatenate(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))] are owed will go a long way toward keeping this arrangement a pleasant one."
 gh_company_venture_appease_with_funds_decision_tooltip: "Send extra funds to the patrons of the [Localize(Concatenate(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))] to improve their opinion of you"
 gh_company_venture_appease_with_funds_decision_confirm: "It is worth the cost"
 gh_company_venture_repay_debts_decision: "Repay Your Debts"
 gh_company_venture_repay_debts_decision_desc: "The patrons of the [Localize(Concatenate(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))] will not be patient with my debts forever. Paying back a portion now is the surest way to keep them from souring on this arrangement entirely."
 gh_company_venture_repay_debts_decision_tooltip: "Repay part of your outstanding debts to keep the patrons of the [Localize(Concatenate(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))] satisfied"
 gh_company_venture_repay_debts_decision_confirm: "Settle part of the debt"
