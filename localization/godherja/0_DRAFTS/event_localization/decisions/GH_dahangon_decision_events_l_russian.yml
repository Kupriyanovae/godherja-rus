 dahangon_decision.0001.t: "Бюро, Восстановленное!"
 dahangon_decision.0001.desc: "Древнейшее и почитаемое Небесами Полуавтономное Бюро [Concept('bureau_bronzeport','Бронзового Порта')|E] с момента своего основания бессчётные годы управлялось Высшими Министрами, избираемыми его почтенными чиновниками. Однако великое восстание Налайкана привело к свержению непопулярного Высшего Министра Цзядзяо и установлению наследственного правления. Теперь Высший Министр [bronzeport_bureau_restorer.GetFirstName] [Select_CString(bronzeport_bureau_restorer.IsFemale, 'решила', 'решил')] восстановить прежнюю форму правления, надеясь вернуть процветание, которым Бронзовый Порт обладал в былые времена.\n\nВ знаменитых Палатах Сплетённых Огня и Неба Бюро все чиновники Бронзового Порта собрались вокруг покрытой [Concept('zhaen','чжанем')|E] трибуны, их ожидание гуще, чем божественные благовония, наполняющие зал. Перед ними Высший Министр [Select_CString(bronzeport_bureau_restorer.IsFemale, 'развернула', 'развернул')] древний устав Бюро, выгравированный на листах невероятно тонкой божественной бронзы, и провозгласил ясным голосом, услышанным всеми — Бронзовый Порт вновь станет республикой."
 dahangon_decision.0001.a: "Наши древние законы восторжествуют!"

 dahangon_decision.0002.t: "Новый Протекторат"
 dahangon_decision.0002.desc: "Веками Катун-Кай стремился установить контроль над южными морями Дахангона. Хотя Империя смогла основать [Concept('bureau_bronzeport','Бронзовый Порт')|E] и контролировать ключевые торговые пути, расстояние, предательские болота, и отсутствие интереса долгое время охлаждали амбиции полной оккупации.\n\nТеперь же первопроходец [southsea_protectorate_founder.GetFirstName] [Select_CString(southsea_protectorate_founder.IsFemale, 'сумела', 'сумел')] привести эти земли под скипетр Драконьего Императора, встав в один ряд с легендарными героями, такими как Святого Меча Гаорун Маянга, Ло-Вена «Чёрного Волка»‎ и Сю Цая «Нефритовой Чешуи»‎.\n\nОднако этот регион не раз доказывал свою сложность в управлении, и [southsea_protectorate_founder.GetFirstName] придётся действовать осторожно, чтобы удержать новый Протекторат Южных Морей."
 dahangon_decision.0002.a: "Катун-Кай на Десять Тысяч Лет!"

 dahangon_decision.0003.t: "Конклав Тени и Крови"
 dahangon_decision.0003.desc: "Наши древнейшие эпосы повествуют, что на заре времён Апа Кедатал — тот, кто облачён в ночь — начертал на коже наших отцов свои девяносто девять божественных имён. Однако великий раскол лишил нас этого дара, и в последующие века наш народ стремился вернуть утраченное.\n\nТеперь мудрейшие и сильнейшие из Хранителей Меток собрались под моим началом, чтобы править и вести кедари в нашем поиске. Нами больше не будут править меч и копьё, и наш народ узнает, что сила заключена в священных именах, начертанных на наших телах и в нашей крови."
 dahangon_decision.0003.a: "Да здравствует власть Отмеченных!"

 dahangon_decision.0004.t: "Золотой, Возвратившийся!"
 dahangon_decision.0004.desc: "Наклан Золотой.\n\n«Много-Сынов», «Чёрное Копьё», «Тот-Кто-Запрягает-Звёзды». Наклан был величайшим правителем нашего народа, и многие из тех, кто пришёл после, объявляли себя его вернувшимся воплощением. Принять имя и саму сущность Наклана — значит обрести легитимность и власть для тех, кто осмелится на это, и потому лишь немногие удостаивались такого признания.\n\nНо своими деяниями я заслужил право быть причисленным к этим избранным. Выйдя на величественный балкон золотой цитадели Даванг Тармак, я услышал громогласное одобрение собравшихся подданных.\n\n#S «Слава Возрождённому!»#!\n\nПока толпа ликует, я вновь осознаю всю тяжесть ответственности, которую несёт это имя. Моя легитимность больше не под вопросом, но теперь я должен не только оправдать ожидания, связанные с воплощением Наклана, но и превзойти их."
 dahangon_decision.0004.a: "К новому золотому веку Дахангона!"

 dahangon_decision.0005.t: "Шипы, Торжествующие!"
 dahangon_decision.0005.desc: "В далёком прошлом [Concept('nari_daya','Нари Дая')|E] была лишена права на корону после смерти её отца, [Concept('naklan_the_golden','Наклана Золотого')|E] — трон перешёл к её недостойному племяннику. Хотя его правление Дахангоном было недолгим из-за Восстания Золотых Шипов, сама Дая так и не смогла занять трон, вынужденная вернуться в земли, которые позже стали Вехангуном.\n\nТеперь же эта несправедливость, длившаяся тысячелетия, наконец исправлена. Выйдя на балкон золотой цитадели Даванг Тармак, я услышал оглушительный рокот собравшихся дев шипов. Они ликуют, предвкушая будущее, которое, как они знают, настанет — могучее правление Торжествующей Королевы Шипов."
 dahangon_decision.0005.a: "Моё предназначение только начинается!"

 

 dahangon_decision.0006.t: "New country, New Ideas"
 dahangon_decision.0006.desc: "With the signing of the 'Republic Charter', the Republic of Yuan-kang is formally declared. Our fledgling republican government designated this day as Independence Day and launched a three-day celebration. The streets and alleys of [GetTitleByKey('c_ganilok').GetNameNoTier] are now drenched in a festive atmosphere. People have taken to the streets, cheering the name of [bronzeport_restore.GetFirstName], celebrating Yuan-kang.\n\n However, many problems remain. Bronzeport is, after all, a city built by Kathuni immigrants, and many citizens' ancestors came from the distant Kathun-Kai. Despite achieving independence, the people's feelings towards Kathun-Kai are not easily severed. This lingering emotional tie creates significant confusion regarding identity within Yuan-kang: some believe that even as an independent nation, they are still part of the broader Kathuni family. Others argue that the independent Yuan-kang has no relation to Kathun-Kai anymore, constituting a distinct nation. A clear choice must be made swiftly; whether to maintain the Kathuni identity or embark on a new path. Otherwise, the conflicting identities within Bronzeport threaten to tear the Republic apart."
 dahangon_decision.0006.a: "The era of Kathun-Kai is over."
 dahangon_decision.0006.b: "No, we are still part of Kathun-Kai."
 dahangon_decision.0006.a.tt: "All vassals belonging to [GetCulturePillar('heritage_easterner').GetName][heritage|E] will convert to your culture and gain [GetModifier('clear_kathunkai_culture_modifier').GetNameWithTooltip][modifier|E]." 

 dahangon_decision.0007.t: "Coastal Avenue Initiated"
 dahangon_decision.0007.desc: "After overcoming numerous difficulties, initial construction of the Coastal Avenue has finally been completed. Fortress clusters have been built and garrisoned with soldiers, and some large merchant caravans have begun using the route to travel between the east and west. However, there are still many areas that require improvement. You can choose to invest additional resources to enhance the efficiency of the Coastal Avenue."
 dahangon_decision.0007.a: "Make no additional investment."
 dahangon_decision.0007.b: "Invest limited resources."
 dahangon_decision.0007.c: "Invest moderate resources."
 dahangon_decision.0007.d: "Invest substantial resources."
 dahangon_decision.0007.tt: "[GetModifier('corniche_range_modifier').GetNameWithTooltip][modifier|E] will be added to all counties in [GetGeographicalRegion('trade_confluence_corniche_influence_sphere').GetName][region|E]" 

 dahangon_decision.0015.t: "Expand Trade Network"
 dahangon_decision.0015.desc: "We have taken our first step into the straits of Rovarska by establishing trade strongholds. Although this is still far from the ultimate goal of complete control, a journey of a thousand miles begins with a single step. Every advancement made means a further weakening of the Rovarskan pirates. It is believed that in the future, Kathuni's merchant ships will crowd every port along the strait, making them the true rulers of the [pirate_coast|E]"
 dahangon_decision.0015.a: "More trade, more wealth!"

 dahangon_decision.0019.t: "Beast Attack"
 dahangon_decision.0019.desc: "The mysterious and perilous Takaday Forest is far from a safe place. According to reports from travelers and troops garrisoned along the Coastal Avenue, several events reducing the avenue's efficiency have occurred and must be dealt with. The probability of successfully resolving these issues will vary depending on the resources invested:\n\n#weak For unknown reasons, large groups of ferocious wild animals have migrated their dens close to the Coastal Avenue. Their foraging range now encompasses several sections of the avenue. Merchants and travelers have been attacked, and the affected area continues to expand. Troops stationed in nearby fortresses lack the strength to drive them away. Advisors believe an army must be dispatched immediately to eradicate these detestable beasts completely.#!"
 dahangon_decision.0019.a: "Make no additional investment."
 dahangon_decision.0019.b: "Invest limited resources."
 dahangon_decision.0019.c: "Invest moderate resources."
 dahangon_decision.0019.d: "Invest substantial resources."

 

 dahangon_decision.0020.t: "Overgrowth of Plants"
 dahangon_decision.0020.desc: "The mysterious and perilous Takaday Forest is far from a safe place. According to reports from travelers and troops garrisoned along the Coastal Avenue, several events reducing the avenue's efficiency have occurred and must be dealt with. The probability of successfully resolving these issues will vary depending on the resources invested:\n\n#weakAlthough the Coastal Avenue was designed with allowances for plant growth, whether due to the rainy season or unknown magic, the vegetation within Takaday Forest is growing wildly, encroaching past the forest boundary and blocking the road. Covered in hard bark, these plants are difficult to clear with ordinary tools. This will require the intervention of magi or the procurement of harder metals.#!"
 dahangon_decision.0020.a: "Make no additional investment."
 dahangon_decision.0020.b: "Invest limited resources."
 dahangon_decision.0020.c: "Invest moderate resources."
 dahangon_decision.0020.d: "Invest substantial resources."

 dahangon_decision.0021.t: "Soldiers Disappear"
 dahangon_decision.0021.desc: "The mysterious and perilous Takaday Forest is far from a safe place. According to reports from travelers and troops garrisoned along the Coastal Avenue, several events reducing the avenue's efficiency have occurred and must be dealt with. The probability of successfully resolving these issues will vary depending on the resources invested:\n\n#weak Given the extreme dangers, garrisoned troops typically remain near their fortresses and rarely venture deep into the woods, except for routine patrols. Strangely, however, soldiers are disappearing en masse from fortresses. When travelers approach, they find the fortresses completely empty with no signs of struggle. Experienced Magi suspect hallucinogenic spores might be the cause.#! "
 dahangon_decision.0021.a: "Make no additional investment."
 dahangon_decision.0021.b: "Invest limited resources."
 dahangon_decision.0021.c: "Invest moderate resources."
 dahangon_decision.0021.d: "Invest substantial resources."

 dahangon_decision.0022.t: "Robber Attack"
 dahangon_decision.0022.desc: "The mysterious and perilous Takaday Forest is far from a safe place. According to reports from travelers and troops garrisoned along the Coastal Avenue, several events reducing the avenue's efficiency have occurred and must be dealt with. The probability of successfully resolving these issues will vary depending on the resources invested:\n\n#weak Life here is uncomfortable, with most people simply wanting to pass through this green hell as quickly as possible. Exceptions are rare, but recently, crazed avenue bandits have emerged. These attackers might possess methods for coexisting with the forest, or perhaps it's just sheer luck combined with a touch of recklessness. Regardless, to maintain the avenue's flow, forces must be found to defeat these brigands hiding within the forest.#!"
 dahangon_decision.0022.a: "Make no additional investment."
 dahangon_decision.0022.b: "Invest limited resources."
 dahangon_decision.0022.c: "Invest moderate resources."
 dahangon_decision.0022.d: "Invest substantial resources."

 dahangon_decision.0027.t: "Coronation Ceremony"
 dahangon_decision.0027.desc: "As the series of intricate ceremonial procedures concluded, a venerable Banwagul priest presented me with a silk-wrapped jade tray bearing the scepter symbolizing rulership over Dahangon. It is said to be an ancient artifact dating back to the era of Naklan's rule, repeatedly lost during times of turmoil but always returning to the legitimate ruler of Dahangon. I lifted it and turned to the nobles attending the coronation, raising it in acknowledgment\n\nThus, in the oldest palace of Dawang Tarmak, amidst the cries of 'Long live!' from the crowd, the era of my dynasty's rule over Dahangon began."
 dahangon_decision.0027.a: "For generations to come."

 #dahangon_decision.0028.t: "City of Ruins"  #GH NOTE: Need some heavy rework, this should not add a building "city" instead of the Dawang Tarmak 
 #dahangon_decision.0028.desc: "Dawang Tarmak once boasted a glorious history as the focal point and ruling center of the Dahangon region. Around the exquisite palace where Naklan once resided, the nobility constructed layer upon layer of luxurious buildings. Commoners and merchants from all directions flocked to this revered city, bringing it prosperity and wealth. Throughout history, no other city in Dahangon could rival it; it was like a shining gem embedded in the northern part of Dahangon, basking in the gaze of the powerful.\n However, after years of war, chaos, and the devastation of [ratarakaw|E], the city is no longer what it once was. Although repairs were made to the central palace area, most structures remain in ruin. Vity walls have collapsed, roads are strewn with rubble and debris, and port facilities along the river are filled with silt. The once-beautiful gardens are now overgrown with weeds and vines. Its current state evokes a sense of profound lament. Nevertheless, now that it is under our control, we can restore [Glossary('Yuydu','GH_YUYDU_GLOSS')] to its zenith, allowing the people of this land to recall the glory of Naklan and thus fostering greater acceptance of our rule."
 #dahangon_decision.0028.a: "Find the best architects to rebuild it."
 #dahangon_decision.0028.b: "Further, completely reshape the entire city."


 dahangon_decision.0030.t: "Lord of Kashirya"
 dahangon_decision.0030.desc: "With one victory after another achieved by Chinlin's forces, the princes of [kashirya|E] have one by one submitted to our rule, willingly surrendering their authority. The fertile lands of Kashirya and its renowned arcane academies now fall under Chinlin's governance. Even the mints in Kashirya's major cities have begun producing new currency bearing the portrait of Chinlin's sovereign. \n\nThough many Kashiryan people are only beginning to adapt to the directives of Chinlin officials, the [Concept('vidvaookeyatran_scholarly_caste','vidvaookeyatran scholars')|E] have eagerly pledged allegiance to Chinlin's ruler, as though their loyalty had always lain here rather than with the former Kashiryan princes. Our ministers look upon such spineless conduct with contempt, deeming these scholars unworthy of attention. \n\nYet, these scholars, deeply entrenched in Kashiryan society for years, wield immense influence over nearly every facet of life. Cooperation with them could solidify our authority in the region, at the mere cost of preserving their existing privileges. So, what shall be our response?"
 dahangon_decision.0030.a: "So long as the [Concept('vidvaookeyatran_scholarly_caste','vidvaookeyatran scholars')|E] remain loyal to Chinlin..."
 dahangon_decision.0030.b: "We want no part of these grasping individuals."

 dahangon_decision.0031.t: "Once Again..."
 dahangon_decision.0031.desc: "The remnants of the Protectorate of Lanonan, the nobles of Míat Shrunfan, and the merchants and pirates of the Dathanites—all these former powers have now vanished like smoke. Their knowledge, technology, and wealth have become the spoils of the empire. Officials from the imperial capital have taken charge of everything. The people of the Southland now need only pay tribute to the Emperor of Chinlin, living in peace and prosperity under Chinlin's radiant influence, free from the threats of war. Though staunch supporters of Kathun-Kai may question Chinlin's legitimacy to succeed Loen Chaeon's rule, in time, they will come to recognize that only Chinlin can truly uphold order in the Southsea in the era of [frodbrokna|E]."
 dahangon_decision.0031.a: "Thus, the Southland was pacified."

 dahangon_decision.0032.title: "Tighten the Screws"
 dahangon_decision.0032.desc: "As the reformed Tilolan system was implemented nationwide, nobles were forced to spend more time traveling to and from the capital. Due to stringent penalty mechanisms, many minor and mid-level nobles even incurred debts to meet the required standards for court attendance. As a reward for their compliance, these nobles were relieved of their debts on the condition that they reside long-term in the capital, leaving the "tedious" affairs of their domains to be managed by central officials. Through this strategy, we gradually gained control over numerous hereditary territories. \n\nAmong the major nobles who could afford the ceremonial expenses, the central government found it difficult to strengthen its influence. Their deep-rooted power bases left no room for external interference. Unexpectedly, however, a peculiar trend of rivalry spread among them. Major nobles started assembling court processions far exceeding the mandated scale solely to outshine rival families in grandeur. This competitive behavior inadvertently advanced our objectives—the great nobles now neglect governance, engrossed in extravagant rivalries, and are no longer capable of posing a threat to the emperor's rule."
 dahangon_decision.0032.a: "An enlightened measure indeed."

 dahangon_decision.0033.t: "Royal Artisan"
 dahangon_decision.0033.desc: "The legend of [naklan_the_golden|E], who supposedly built [Glossary('Yuydu','GH_YUYDU_GLOSS')] to its zenith, allowing the people of this land to carry Naklan's glory and thus fostering greater acceptance of our rule today. However, examinations of artifacts and historical records suggest that the construction of Yuydu was an immensely complex and protracted endeavor, likely spanning beyond Naklan's entire reign. To complete it, Naklan gathered nearly all the artisans of the empire, who served as royal retainers for many years until his death. Subsequent rulers of Dahangon, unable to sustain such a vast corps of craftsmen, disbanded them.\n\nThese highly skilled artisans then dispersed among the populace, soon becoming esteemed guests of local lords. Under the patronage of these nobles, they established schools, took on apprentices, and put down roots in their communities, evolving into the hundreds of artisan guilds scattered across Dahangon. Now, these craftsmen have reorganized into a unified national institution, serving the new Chinlin imperial household and shining within the imperial court, much as they once served regional nobles. This new official institution is named the Naftney, derived from the Banwagul word for 'those who serve'."
 dahangon_decision.0033.a: "Good."

 dahangon_decision.0034.t: "A Great City."
 dahangon_decision.0034.desc: "For a long time, [Glossary('Yuydu','GH_YUYDU_GLOSS')] was nothing but ruins—mounds of rubble, broken stones, and dirt. After years of effort, they have finally been cleared away. The city's foundations have been restored, its derelict facilities rebuilt, and the outline of the towering spires of the golden palace now stands clearly visible, a place where the emperor himself can reside. With more time and dedication, the legacy left by [naklan_the_golden|E] will regain its former glory, and we will reap rich rewards.\n\n Although Yuydu still has a long way to go before it can compare to the world-renowned great cities, its progress has been remarkable. At present, a number of merchants and nobles have submitted a joint petition, hoping to be permitted to invest in the city's construction and contribute to its further development."
 dahangon_decision.0034.a: "We still have a lot of work to do."

 dahangon_decision.0035.t: "The True Descendant"
 dahangon_decision.0035.desc: "Through the sanctified portrayal of the current Chinlin monarch's image and capabilities, and the persistent efforts of several Kathuni historians, we have successfully led the people of Dahangon to firmly believe that the Chinlin royal family truly inherits the noble bloodline from [naklan_the_golden|E].\n\nTo further consolidate this legitimate claim, a series of "ancient" documents have been meticulously compiled, documenting the arduous journey of Naklan's descendants who went into exile in the seventh century and eventually returned to their homeland to reclaim the throne. These documents are now housed in the Royal Archives and are open for scholarly study. It is believed that anyone who studies these texts will become utterly convinced of the legitimacy of the Chinlin Empire, regardless of any prior skepticism."
 dahangon_decision.0035.a: "Beyond doubt"

 dahangon_decision.0036.t: "Royal Elephants"
 dahangon_decision.0036.desc: "The establishment of the elephant corps has been highly successful. Through the untiring efforts of the elephant trainers we engaged at great expense, the elephant population has rapidly multiplied, gradually becoming an indispensable asset to the royal household. These elephants have been systematically allocated to various provinces of the empire, yet only a select few nobles endorsed by the royal family are permitted to deploy them. Soon, ownership of elephant herds became a distinct symbol of wealth and status. \n\n Concurrently, a fully armed war elephant unit now serves the royal household. In peacetime, they form a majestic procession, parading on important occasions to display the dignity and grandeur of the monarchy. And when war arises, these heavily armored war elephants transform into the empire's sharpest weapons, charging into battle with thunderous momentum."
 dahangon_decision.0036.a: "Powerful creature."

 dahangon_decision.0037.t: "Rule by the Imperial Clan"
 dahangon_decision.0037.desc: "The imperial clansmen stationed in the provinces have demonstrated their unique value. Empowered by privileges granted by the central authority, they effectively coordinated administrative affairs locally, resolved bureaucratic blockages, and significantly improved governance efficiency. The previously protracted correspondence,that could take months awaiting a response from Yuydu, has been quickened, allowing local governments to respond to emergencies more flexibly. \n\n Mindful of the lessons accumulated throughout Kathun-Kai's long history, we have not granted imperial clansmen unchecked power. To mitigate potential risks, a series of checks and balances have been strictly implemented: imperial clan officials are subject to regular rotation, and are inspected by centrally dispatched commissioners on patrol tours, supplemented by meticulous record-keeping of their conduct. These measures effectively prevent them from forming interest groups with local officials, and substantially reduce the soil for those with disloyal intentions to plot rebellions, ensuring that the imperial clansmen remain under control."
 dahangon_decision.0037.a: "Proven effective."

 dahangon_decision.0038.t: "Busy River"
 dahangon_decision.0038.desc: "[Glossary('Yuydu','GH_YUYDU_GLOSS')] has become a bustling port where thousands of river vessels converge day and night. Each day, a great multitude of ships load and unload cargo, board and disembark passengers, and replenish supplies in an endless stream. To meet the demands of daily maintenance and facility upgrades, dozens of small shipyards have sprung up along the river, generating substantial revenue for the city. The formerly precarious wooden piers were replaced with sturdy stone quays equipped with cranes that better facilitate the loading and unloading of goods and the movement of passengers. \n\n Thanks to this prosperous inland waterway transport, the treasury now enjoys a considerable and steady source of wealth, while also significantly enhancing our efficiency in resource allocation along the Tagsan River."
 dahangon_decision.0038.a: "Wealth is surging!"

 dahangon_decision.0039.t: "From clamor to tranquility"
 dahangon_decision.0039.trigger_1.desc: "The chaotic religious disputes are over. In Dahangon, there should be only one faith, one voice. After the religious council's successful conclusion, they formally established the state religion. Yuydu became the sole arbiter in sacred matters, uniting all subjects closely through the chain of faith. \n\n As the saying goes, unity brings order, order fosters civilization, and civilization drives progress. All former Dahala religious organizations within Dahangon have been reorganized into forms suitable for serving the Chinlin Empire. Loyal and devout priests are now responsible for guiding believers onto the appropriate path. In the newly compiled doctrines, the emperor is endowed with the supreme authority to wield all worldly power—his words are divine decrees, his actions are divine miracles."
 dahangon_decision.0039.trigger_2.desc: "The chaotic religious disputes have been brought to an end. In Dahangon, there should be only one faith, one voice. With the successful conclusion of the religious council, the state religion has been formally established, making Yuydu the sole arbiter in sacred matters, uniting all subjects closely through the chain of faith. \n\n The teachings of the First Dragon distinguish us from other barbaric and backward nations, and her profound wisdom deserves to be known by all. It is for this reason that Chinlin will continue to honor ancient traditions and shoulder the sacred mission of civilizing the barbarians. We shall educate the people of Banwagul, helping them shed their crude and vulgar customs and learn the ways of ritual and civilization."
 dahangon_decision.0039.a: "Leave the only one."