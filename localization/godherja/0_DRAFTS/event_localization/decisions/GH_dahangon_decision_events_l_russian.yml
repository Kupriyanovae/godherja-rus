 # ASKIL URGENT: GO THROUGH IT GOD DAMN YOU
 dahangon_decision.0001.t:0 "Бюро восстановлено!"
 dahangon_decision.0001.desc:0 "Древнейшее и наиболее почитаемое небом ниспосланное полуавтономное бюро [Concept('bureau_bronzeport','Бронзовой гавани')|E] с момента своего основания на протяжении бесчисленных лет управлялось верховными министрами, избираемыми его уважаемыми чиновниками. Однако великое восстание Налайканов привело к свержению непопулярного верховного министра Цзядзяо и установлению наследственного правления. Теперь [Select_CString(bronzeport_bureau_restorer.IsFemale, 'верховная', 'верховный' )] министр [bronzeport_bureau_restorer.GetFirstName] решает восстановить прежнее правительство в надежде вернуть то процветание, которым Бронзовая гавань обладала в былые времена.\n\nВ знаменитых Залах переплетенного Огня и Неба, все чиновники Бронзовой гавани собрались вокруг его помоста, покрытого [Concept('zhaen','чжэнем')|E], их ожидание было гуще божественного фимиама, наполнявшего комнату. Перед ними [Select_CString(bronzeport_bureau_restorer.IsFemale, 'верховная', 'верховный' )] министр развернул[Select_CString(bronzeport_bureau_restorer.IsFemale, 'а', '' )] древнюю хартию бюро, начертанную на листах невероятно тонкой божественной бронзы, и громким голосом, слышимым каждому, объявил[Select_CString(bronzeport_bureau_restorer.IsFemale, 'а', '' )]: Бронзовая гавань снова станет республикой."
 dahangon_decision.0001.a:0 "Наши древние законы всегда будут торжествовать!"

 dahangon_decision.0002.t:0 "Новый протекторат"
 dahangon_decision.0002.desc:0 "На протяжении веков Катун-Кай страстно желал подчинить южные моря Дахангона своему контролю. Хотя империя сумела основать [Concept('bureau_bronzeport','Бронзовую гавань')|E] и взять под контроль жизненно важные торговые пути, расстояние, коварные водно-болотные угодья и отсутствие интереса во многом удерживали амбиции полномасштабной оккупации.\n\nОднако теперь [Select_CString(southsea_protectorate_founder.IsFemale, 'первопроходица', 'первопроходец' )] [southsea_protectorate_founder.GetFirstName] сумел[Select_CString(southsea_protectorate_founder.IsFemale, 'а', '' )] привести эти земли под скипетр Драконьего императора, став в один ряд с такими легендарными героями, как Святой меча Гаорун Майнг, Ло-Вэня «Черного Волка» и Сюй Цая «Нефритовой Чешуи».\n\nИ все же этот регион раз за разом доказывал, что им трудно управлять, и [southsea_protectorate_founder.GetFirstName] придется действовать осторожно, чтобы удержать новый Протекторат Южного моря."
 dahangon_decision.0002.a:0 "Десять тысяч лет Катун-Каю!"

 dahangon_decision.0003.t:0 "Конклав тени и крови"
 dahangon_decision.0003.desc:0 "Наши древнейшие эпосы поют о том, что на заре времен Апа Кедаталь — «те, кто облачен в ночь», — выжгли на коже наших отцов девяносто девять своих божественных имен. Однако великий раскол фактически лишил нас этого дара, и на протяжении последующих веков задачей нашего народа было вернуть то, что мы потеряли.\n\nТеперь самые мудрые и могущественные из наших стражей меток собрались под моим командованием, чтобы править кедарами и направлять их в наших поисках. Нами больше не будет правит меч и копьё, и наш народ узнает, что сила заключена в святых именах, начертанных на наших телах и в нашей крови."
 dahangon_decision.0003.a:0 "Да здравствует правление Меченых!"

 dahangon_decision.0004.t:0 "Возвращение Золотого!"
 dahangon_decision.0004.desc:0 "Наклан Золотой.\n\n«Многосыновный», «Черное Копье», «Запрягающий Звезды». Наклан был величайшим правителем нашего народа, и многие из тех, кто пришел после него, заявляли, что они — его возвращение. Принять имя и саму суть Наклана дает легитимность и власть тем, кто осмеливается это сделать, и потому лишь немногие избранные признавались таковыми.\n\nОднако своими деяниями я заслужил[Select_CString(ROOT.Char.IsFemale, 'а', '' )] право быть причисленн[Select_CString(ROOT.Char.IsFemale, 'ой', 'ым' )] к этим редким избранным. Вступая на великолепный балкон Золотой цитадели Даванг Тармака, я встречаю оглушительный рев одобрения моих собравшихся подданных.\n\n#S «Слава Возрожденному!»#!\n\nПока ликующая толпа страстно кричит, я снова напоминаю себе об огромном весе и ответственности, которую несет эта роль. Моя легитимность больше не подлежит сомнению, но теперь я знаю, что должSelect_CString(ROOT.Char.IsFemale, 'на', 'ен' )] не просто соответствовать ожиданиям от возрожденного Наклана, но и превзойти их."
 dahangon_decision.0004.a:0 "К новому золотому веку Дахангона!"

 dahangon_decision.0005.t:0 "Триумф Терний!"
 dahangon_decision.0005.desc:0 "В далеком прошлом [Concept('nari_daya','Нари Дайя')|E] была лишена своего королевского престола после смерти ее отца, [Concept('naklan_the_golden','Наклана Золотого')|E] — трон вместо этого перешел к ее недостойному племяннику. Хотя его правление над Дахангоном длилось недолго из-за Восстания Золотого Терна, сама Дайя так и не смогла занять трон и была вынуждена отступить на земли, которые впоследствии станут Вехангуном.\n\nОднако теперь эта несправедливость, длившаяся тысячелетиями, подошла к концу. Поднимаясь на балкон Золотой цитадели Даванг Тармака, я встречаю оглушительный рев собравшихся внизу Дев терния. Они ликуют, зная о будущем, которое вот-вот наступит — могущественном правлении торжествующей Королевы Терний."
 dahangon_decision.0005.a:0 "Моя судьба только начинается!"

 

 dahangon_decision.0006.t:0 "Новая страна, новые идеи"
 dahangon_decision.0006.desc:0 "С подписанием «хартии Республики» официально провозглашается республика Юанькан. Наше молодое республиканское правительство объявило этот день Днем независимости и организовало трехдневные празднования. Улицы и переулки [GetTitleByKey('c_ganilok').GetNameNoTier] теперь погружены в праздничную атмосферу. Люди вышли на улицы, скандируя имя [bronzeport_restore.GetFirstName] и славя Юанькан.\n\nОднако остается еще много проблем. В конце концов, Бронзовая гавань — город, построенный катунскими иммигрантами, и предки многих граждан пришли из далекого Катун-Кая. Несмотря на обретение независимости, чувства людей к Катун-Каю не так-то просто оборвать. Эта сохраняющаяся эмоциональная связь создает значительную путаницу в отношении идентичности внутри Юанькана: некоторые считают, что даже будучи независимой нацией, они все еще остаются частью широкой семьи катунов. Другие утверждают, что независимый Юанькан больше не имеет никакого отношения к Катун-Каю и представляет собой отдельную нацию. Необходимо быстро сделать четкий выбор: сохранить ли катунскую идентичность или ступить на новый путь. В противном случае конфликтующие идентичности внутри Бронзовой гавани угрожают разорвать республику на части."
 dahangon_decision.0006.a:0 "Эра Катун-Кая окончена."
 dahangon_decision.0006.b:0 "Нет, мы все еще часть Катун-Кая."
 dahangon_decision.0006.a.tt:0 "Все вассалы, имеющие [GetCulturePillar('heritage_easterner').GetName]ое [Concept('heritage','наследие')|E] , примут вашу культуру и получат [Concept('modifier','модификатор')|E] [GetModifier('clear_kathunkai_culture_modifier').GetNameWithTooltip]." 

 dahangon_decision.0007.t:0 "Прокладка Прибрежной аллеи"
 dahangon_decision.0007.desc:0 "Преодолев многочисленные трудности, первичное строительство Прибрежной аллеи наконец завершилось. Построены и укомплектованы солдатами комплексы крепостей, а некоторые крупные купеческие караваны уже начали использовать этот маршрут для перемещения между востоком и западом. Однако остается еще много областей, требующих улучшения. Вы можете инвестировать дополнительные ресурсы, чтобы повысить эффективность Прибрежной аллеи."
 dahangon_decision.0007.a:0 "Не делать дополнительных инвестиций."
 dahangon_decision.0007.b:0 "Инвестировать ограниченные ресурсы."
 dahangon_decision.0007.c:0 "Инвестировать умеренные ресурсы."
 dahangon_decision.0007.d:0 "Инвестировать значительные ресурсы."
 dahangon_decision.0007.tt:0 "[Concept('modifier','Модификатор')|E] [GetModifier('corniche_range_modifier').GetNameWithTooltip] будет добавлен во все графства в [Concept('region','регионе')|E] [GetGeographicalRegion('trade_confluence_corniche_influence_sphere').GetName]" 

 dahangon_decision.0015.t:0 "Расширение торговой сети"
 dahangon_decision.0015.desc:0 "Мы сделали наш первый шаг в проливы Роварски, основав торговые аванпосты. Хотя это еще далеко от конечной цели полного контроля, путешествие в тысячу миль начинается с одного шага. Каждое достигнутое продвижение означает дальнейшее ослабление роварсканских пиратов. Считается, что в будущем катунские купеческие корабли заполнят каждый порт вдоль пролива, сделав их истинными правителями [Concept('pirate_coast','Пиратского побережья')|E]"
 dahangon_decision.0015.a:0 "Больше торговли, больше богатства!"

 dahangon_decision.0019.t:0 "Нападение зверей"
 dahangon_decision.0019.desc:0 "Загадочный и опасный лес Такадай — далеко не самое безопасное место. Согласно отчетам путешественников и войск, дислоцированных вдоль Прибрежной аллеи, произошло несколько событий, снижающих эффективность аллеи, с которыми необходимо разобраться. Вероятность успешного решения этих проблем варьируется в зависимости от вложенных ресурсов:\n\n#weak По неизвестным причинам крупные стаи свирепых диких животных перенесли свои логова близко к Прибрежной аллеи. Радиус их охоты теперь охватывает несколько участков аллеи. Торговцы и путешественники подвергаются нападениям, а пораженная территория продолжает расширяться. Войскам, дислоцированным в близлежащих крепостях, не хватает сил, чтобы прогнать их. Советники считают, что необходимо немедленно отправить армию для полного истребления этих отвратительных зверей.#!"
 dahangon_decision.0019.a:0 "Не делать дополнительных инвестиций."
 dahangon_decision.0019.b:0 "Инвестировать ограниченные ресурсы."
 dahangon_decision.0019.c:0 "Инвестировать умеренные ресурсы."
 dahangon_decision.0019.d:0 "Инвестировать значительные ресурсы."

 

 dahangon_decision.0020.t:0 "Разрастание растений"
 dahangon_decision.0020.desc:0 "Загадочный и опасный лес Такадай — далеко не самое безопасное место. Согласно отчетам путешественников и войск, дислоцированных вдоль Прибрежной аллеи, произошло несколько событий, снижающих эффективность пллеи, с которыми необходимо разобраться. Вероятность успешного решения этих проблем варьируется в зависимости от вложенных ресурсов:\n\n#weakХотя Прибрежная аллея проектировалась с учетом роста растений, будь то из-за сезона дождей или неизвестной магии, растительность в лесу Такадай буйно разрастается, выходя за пределы леса и заграждая дорогу. Покрытые твердой корой, эти растения трудно расчистить обычными инструментами. Для этого потребуется вмешательство магов или закупка более твердых металлов.#!"
 dahangon_decision.0020.a:0 "Не делать дополнительных инвестиций."
 dahangon_decision.0020.b:0 "Инвестировать ограниченные ресурсы."
 dahangon_decision.0020.c:0 "Инвестировать умеренные ресурсы."
 dahangon_decision.0020.d:0 "Инвестировать значительные ресурсы."

 dahangon_decision.0021.t:0 "Исчезновение солдат"
 dahangon_decision.0021.desc:0 "Загадочный и опасный лес Такадай — далеко не самое безопасное место. Согласно отчетам путешественников и войск, дислоцированных вдоль Прибрежной аллеи, произошло несколько событий, снижающих эффективность аллеи, с которыми необходимо разобраться. Вероятность успешного решения этих проблем варьируется в зависимости от вложенных ресурсов:\n\n#weakУчитывая крайнюю опасность, гарнизонные войска обычно остаются вблизи своих крепостей и редко отваживаются заходить в глубь леса, за исключением плановых патрулей. Однако, как ни странно, солдаты массово исчезают из крепостей. Когда путешественники приближаются, они находят крепости совершенно пустыми, без следов борьбы. Опытные маги подозревают, что причиной могут быть галлюциногенные споры.#!"
 dahangon_decision.0021.a:0 "Не делать дополнительных инвестиций."
 dahangon_decision.0021.b:0 "Инвестировать ограниченные ресурсы."
 dahangon_decision.0021.c:0 "Инвестировать умеренные ресурсы."
 dahangon_decision.0021.d:0 "Инвестировать значительные ресурсы."

 dahangon_decision.0022.t:0 "Нападение разбойников"
 dahangon_decision.0022.desc:0 "Загадочный и опасный лес Такадай — далеко не самое безопасное место. Согласно отчетам путешественников и войск, дислоцированных вдоль Прибрежной аллеи, произошло несколько событий, снижающих эффективность аллеи, с которыми необходимо разобраться. Вероятность успешного решения этих проблем варьируется в зависимости от вложенных ресурсов:\n\n#weakЖизнь здесь некомфортна, большинство людей просто хотят пройти через этот зеленый ад как можно быстрее. Исключения редки, но в последнее время появились безумные бандиты аллеи. У этих нападавших могут быть способы сосуществования с лесом, а может быть, это просто чистое везение в сочетании с безрассудством. Как бы то ни было, чтобы сохранить движение по проспекту, необходимо найти силы для победы над этими разбойниками, прячущимися в лесу.#!"
 dahangon_decision.0022.a:0 "Не делать дополнительных инвестиций."
 dahangon_decision.0022.b:0 "Инвестировать ограниченные ресурсы."
 dahangon_decision.0022.c:0 "Инвестировать умеренные ресурсы."
 dahangon_decision.0022.d:0 "Инвестировать значительные ресурсы."

 dahangon_decision.0027.t:0 "Церемония коронации"
 dahangon_decision.0027.desc:0 "Когда серия сложных церемониальных процедур завершилась, почтенный банвагулский жрец преподнес мне обернутый шелком нефритовый поднос со скипетром, символизирующим владычество над Дахангоном. Говорят, что это древний артефакт, восходящий к эпохе правления Наклана, неоднократно теряемый во времена смут, но всегда возвращающийся к законному правителю Дахангона. Я поднял[Select_CString(ROOT.Char.IsFemale, 'а', '' )] его и повернул[Select_CString(ROOT.Char.IsFemale, 'ась', 'ся' )] к дворянам, присутствующим на коронации, подняв его в знак приветствия.\n\nТак, в старейшем дворце Даванг Тармака, под возгласы «Да здравствует!» из толпы, началась эра правления моей династии над Дахангоном."
 dahangon_decision.0027.a:0 "На грядущие поколения."

 #dahangon_decision.0028.t: "City of Ruins"  #GH NOTE: Need some heavy rework, this should not add a building "city" instead of the Dawang Tarmak 
 #dahangon_decision.0028.desc: "Dawang Tarmak once boasted a glorious history as the focal point and ruling center of the Dahangon region. Around the exquisite palace where Naklan once resided, the nobility constructed layer upon layer of luxurious buildings. Commoners and merchants from all directions flocked to this revered city, bringing it prosperity and wealth. Throughout history, no other city in Dahangon could rival it; it was like a shining gem embedded in the northern part of Dahangon, basking in the gaze of the powerful.\n However, after years of war, chaos, and the devastation of [ratarakaw|E], the city is no longer what it once was. Although repairs were made to the central palace area, most structures remain in ruin. Vity walls have collapsed, roads are strewn with rubble and debris, and port facilities along the river are filled with silt. The once-beautiful gardens are now overgrown with weeds and vines. Its current state evokes a sense of profound lament. Nevertheless, now that it is under our control, we can restore [Glossary('Yuydu','GH_YUYDU_GLOSS')] to its zenith, allowing the people of this land to recall the glory of Naklan and thus fostering greater acceptance of our rule."
 #dahangon_decision.0028.a: "Find the best architects to rebuild it."
 #dahangon_decision.0028.b: "Further, completely reshape the entire city."


 dahangon_decision.0030.t:0 "Владыка Каширии"
 dahangon_decision.0030.desc:0 "С одной победой за другой, одержанной силами Чинлина, принцы [Concept('kashirya','Каширии')|E] один за другим подчинялись нашему правлению, добровольно сдавая свои полномочия. Плодородные земли Каширии и ее знаменитые магические академии теперь перешли под управление Чинлина. Даже монетные дворы в крупных городах Каширии начали чеканить новую монету с портретом государя Чинлина.\n\nХотя многие жители Каширии только начинают адаптироваться к указам чиновников Чинлина, [Concept('vidvaookeyatran_scholarly_caste','ученые-видваукеятранцы')|E] охотно присягнули на верность правителю Чинлина, как будто их верность всегда лежала здесь, а не с бывшими каширийскими принцами. Наши министры смотрят на такое бесхребетное поведение с презрением, считая этих ученых недостойными внимания.\n\nИ все же эти ученые, глубоко укоренившиеся в каширийском обществе на протяжении многих лет, обладают огромным влиянием почти на все сферы жизни. Сотрудничество с ними могло бы укрепить наш авторитет в регионе лишь ценой сохранения их существующих привилегий. Итак, каковым же будет наш ответ?"
 dahangon_decision.0030.a:0 "Пока [Concept('vidvaookeyatran_scholarly_caste','ученые-видваукеятранцы')|E] остаются верны Чинлину..."
 dahangon_decision.0030.b:0 "Нам не нужны дела с этими алчными людьми."

 dahangon_decision.0031.t:0 "Вновь и вновь..."
 dahangon_decision.0031.desc:0 "Остатки Протектората Ланонан, дворяне Миат Шрунфана, а также купцы и пираты датанитов — все эти прежние державы теперь исчезли, подобно дыму. Их знания, технологии и богатства стали трофеями империи. Чиновники из имперской столицы взяли под контроль всё. Жителям Южных земель теперь нужно лишь платить дань императору Чинлина, живя в мире и процветании под сияющим влиянием Чинлина, свободными от угроз войны. Хотя убежденные сторонники Катун-Кая могут подвергать сомнению легитимность Чинлина в качестве преемника правления Лоэн-Чэона, со временем они признают, что только Чинлин действительно может поддерживать порядок в Южном море в эпоху [Concept('frodbrokna','Фродброкны')|E]."
 dahangon_decision.0031.a:0 "Так Южные земли были умиротворены."

 dahangon_decision.0032.title:0 "Затянуть гайки"
 dahangon_decision.0032.desc:0 "По мере реализации реформированной системы Тилоланов по всей стране, дворяне были вынуждены проводить больше времени в поездках в столицу и обратно. Из-за строгих механизмов наказаний многие мелкие и средние дворяне даже влезали в долги, чтобы соответствовать требуемым стандартам присутствия при дворе. В качестве награды за их послушание эти дворяне были освобождены от долгов при условии, что они будут постоянно проживать в столице, оставляя «скучные» дела своих владений под управлением центральных чиновников. Благодаря этой стратегии мы постепенно установили контроль над многочисленными наследственными территориями.\n\nСреди крупных дворян, которые могли позволить себе церемониальные расходы, центральному правительству было трудно укрепить свое влияние. Их глубоко укоренившиеся базы власти не оставляли места для внешнего вмешательства. Однако неожиданно среди них распространилось своеобразное веяние соперничества. Крупные дворяне начали собирать придворные процессии, значительно превосходящие установленный масштаб, исключительно для того, чтобы затмить соперничающие семьи в пышности. Это соперничество непреднамеренно способствовало достижению наших целей: великие дворяне теперь пренебрегают управлением, погрязнув в расточительной вражде, и больше не способны представлять угрозу правлению императора."
 dahangon_decision.0032.a:0 "Поистине просвещенная мера."

 dahangon_decision.0033.t:0 "Королевские ремесленники"
 dahangon_decision.0033.desc:0 "Легенда о [Concept('naklan_the_golden','Наклане Золотом')|E], который якобы довел [Glossary('Юйду','GH_YUYDU_GLOSS')] до ее зенита, позволяет людям этой земли нести славу Наклана и тем самым способствует большему признанию нашего правления сегодня. Однако изучение артефактов и исторических записей показывает, что строительство Юйду было чрезвычайно сложным и затяжным предприятием, скорее всего, выходившим за рамки всего правления Наклана. Чтобы завершить его, Наклан собрал почти всех ремесленников империи, которые служили королевскими слугами на протяжении многих лет до его смерти. Последующие правители Дахангона, не способные содержать такой огромный корпус мастеров, распустили их.\n\nЭти высоко умелые ремесленники затем рассредоточились среди населения, вскоре став уважаемыми гостями местных владык. Под покровительством этих дворян они основывали школы, брали учеников и пускали корни в своих общинах, превратившись в сотни ремесленных гильдий, рассеянных по всему Дахангону. Теперь эти мастера реорганизовались в единое национальное учреждение, служащее новому императорскому дому Чинлина и блистающее при императорском дворе, как когда-то они служили региональным дворянам. Это новое официальное учреждение названо «нафтнеями», что происходит от банвагулского слова, означающего «тех, кто служит»."
 dahangon_decision.0033.a:0 "Хорошо."

 dahangon_decision.0034.t:0 "Великий город."
 dahangon_decision.0034.desc:0 "Долгое время [Glossary('Юйду','GH_YUYDU_GLOSS')] была ничем иным, как руинами — кучами обломков, битого камня и грязи. После многих лет усилий они наконец расчищены. Фундамент города восстановлен, его заброшенные объекты перестроены, и очертания возвышающихся шпилей золотого дворца теперь отчетливо видны — место, где может проживать сам император. При наличии большего времени и усердия наследие, оставленное [Concept('naklan_the_golden','Накланом Золотым')|E], вернет свою былую славу, и мы пожнем богатые плоды.\n\nХотя Юйду еще предстоит пройти долгий путь, прежде чем она сможет сравниться с всемирно известными великими городами, ее прогресс замечателен. В настоящее время ряд купцов и дворян подали совместную петицию в надежде получить разрешение инвестировать в строительство города и внести свой вклад в его дальнейшее развитие."
 dahangon_decision.0034.a:0 "Нам все еще предстоит сделать много работы."

 dahangon_decision.0035.t:0 "Истинный потомок"
 dahangon_decision.0035.desc:0 "Благодаря освященному изображению облика и способностей нынешнего монарха Чинлина, а также упорным усилиям нескольких катунских историков, мы успешно заставили народ Дахангона твердо поверить в то, что королевская семья Чинлина действительно наследует благородную родословную от [Concept('naklan_the_golden','Наклана Золотого')|E].\n\nЧтобы еще больше закрепить это законное притязание, была тщательно составлена серия «древних» документов, описывающих трудный путь потомков Наклана, отправившихся в изгнание в седьмом веке и в конечном итоге вернувшихся на родину, чтобы вернуть себе трон. Эти документы ныне хранятся в королевском архиве и открыты для научного изучения. Считается, что каждый, кто изучит эти тексты, станет совершенно убежден в легитимности Империи Чинлин, независимо от любых прошлых скептических настроений."
 dahangon_decision.0035.a:0 "Вне всяких сомнений"

 dahangon_decision.0036.t:0 "Королевские слоны"
 dahangon_decision.0036.desc:0 "Создание слоновьего корпуса прошло чрезвычайно успешно. Благодаря неустанным усилиям дрессировщиков слонов, которых мы наняли с большими затратами, популяция слонов быстро умножилась, постепенно став незаменимым достоянием королевского дома. Эти слоны были систематически распределены по различным провинциям империи, но лишь избранным дворянам, поддержанным королевской семьей, разрешено их развертывать. Вскоре владение стадами слонов стало отчетливым символом богатства и статуса.\n\nОдновременно с этим королевскому дому теперь служит полностью вооруженный отряд боевых слонов. В мирное время они образуют величественную процессию, шествуя по важным случаям, чтобы продемонстрировать достоинство и величие монархии. А во время войны эти тяжелобронированные боевые слоны превращаются в самое острое оружие империи, бросаясь в бой с громовым напором."
 dahangon_decision.0036.a:0 "Могучие создания."

 dahangon_decision.0037.t:0 "Правление императорского клана"
 dahangon_decision.0037.desc:0 "Члены императорского клана, дислоцированные в провинциях, продемонстрировали свою уникальную ценность. Наделенные привилегиями, предоставленными центральной властью, они эффективно координировали административные дела на местах, устраняли бюрократические заторы и значительно повышали эффективность управления. Ранее затяжная переписка, которая могла занимать месяцы в ожидании ответа из Юйду, ускорилась, что позволило местным правительствам более гибко реагировать на чрезвычайные ситуации.\n\nПомня об уроках, накопленных за долгую историю Катун-Кая, мы не предоставили членам императорского клана неконтролируемую власть. Чтобы смягчить потенциальные риски, была строго внедрена система сдержек и противовесов: чиновники императорского клана подлежат регулярной ротации и проверяются централизованно направляемыми инспекторами во время инспекционных поездок, что дополняется тщательным ведением учета их поведения. Эти меры эффективно препятствуют формированию ими групп интересов с местными чиновниками и существенно сокращают почву для планирования восстаний теми, кто имеет нелояльные намерения, гарантируя, что члены императорского клана остаются под контролем."
 dahangon_decision.0037.a:0 "Эффективность доказана."

 dahangon_decision.0038.t:0 "Оживленная река"
 dahangon_decision.0038.desc:0 "[Glossary('Юйду','GH_YUYDU_GLOSS')] стала оживленным портом, где день и ночь сходятся тысячи речных судов. Каждый день огромное множество кораблей загружают и разгружают грузы, сажают и высаживают пассажиров и пополняют запасы бесконечным потоком. Чтобы удовлетворить потребности ежедневного обслуживания и модернизации объектов, вдоль реки возникли десятки небольших верфей, приносящих городу существенный доход. Ранее ненадежные деревянные пирсы были заменены прочными каменными причалами, оснащенными кранами, которые лучше облегчают погрузку и разгрузку товаров и передвижение пассажиров.\n\nБлагодаря этому процветающему внутреннему водному транспорту казна теперь наслаждается значительным и стабильным источником богатства, в то же время значительно повышая нашу эффективность в распределении ресурсов вдоль реки Тагсан."
 dahangon_decision.0038.a:0 "Богатство бьет ключом!"

 dahangon_decision.0039.t:0 "От шума к спокойствию"
 dahangon_decision.0039.trigger_1.desc:0 "Хаотичные религиозные споры окончены. В Дахангоне должна быть только одна вера, один голос. После успешного завершения религиозного совета была официально установлена государственная религия. Юйду стала единственным арбитром в священных делах, тесно объединив всех подданных через цепь веры.\n\nКак говорится, единство приносит порядок, порядок способствует цивилизации, а цивилизация двигает прогресс. Все бывшие религиозные далахские организации в Дахангоне были реорганизованы в формы, подходящие для службы Империи Чинлин. Верные и благочестивые жрецы теперь отвечают за наставление верующих на надлежащий путь. В новосоставленных догматах император наделен верховной властью осуществлять всю мирскую власть — его слова являются божественными указами, его действия — божественными чудесами."
 dahangon_decision.0039.trigger_2.desc:0 "Хаотичные религиозные споры были прекращены. В Дахангоне должна быть только одна вера, один голос. С успешным завершением религиозного совета государственная религия была официально установлена, что сделало Юйду единственным арбитром в священных делах, тесно объединив всех подданных через цепь веры.\n\nУчения Первого Дракона отличают нас от других варварских и отсталых народов, и её глубокая мудрость заслуживает того, чтобы о ней знали все. Именно по этой причине Чинлин продолжит чтить древние традиции и плечом к плечу нести священную миссию по цивилизации варваров. Мы будем просвещать банвагулский народ, помогая им избавиться от грубых и вульгарных обычаев и научиться путям ритуала и цивилизации."
 dahangon_decision.0039.a:0 "Оставить лишь одну."