l_russian:
 gh_pirate_coast_decision.0001.t:0 "Возрожденный легион"
 gh_pirate_coast_decision.0001.desc:0 "Наконец, спустя десятилетия конфликта между мной и моими соотечественниками, которые когда-то сплотились под общим знаменем, мы снова стоим под этим знаменем.\n\nЛегион XCV «Виесуад» снова стал единым целым, предатели преданы мечу, а все желающие вновь взяться за оружие уже начали возвращаться. Хотя наша родина может быть в руинах, мы продолжим чтить наследие наших предков, возносясь к еще большим высотам."
 gh_pirate_coast_decision.0001.a:0 "Слава Легиону! Слава Виесуаду!"
 gh_pirate_coast_decision.0002.t:0 "Бич Пиратского побережья"
 gh_pirate_coast_decision.0002.desc:0 "Годами я [Select_CString(ROOT.Char.IsFemale, 'истощала', 'истощал' )] водные пути мира, грабя в свое удовольствие. Я [Select_CString(ROOT.Char.IsFemale, 'украла', 'украл' )] больше золота, чем любой человек мог бы надеяться увидеть, а мое лицо впечаталось в память моряков по всему Морю Империй.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'самая известная', 'самый известный' )] [founder.GetWomanMan] из ныне живущих, «Бич Пиратского побережья», и мое имя навеки останется в памяти Роварски. Все узнают, кто обладает здесь властью, и научатся бояться этой власти."
 gh_pirate_coast_decision.0002.a:0 "Я [founder.GetLadyLord] всех морей!"
 gh_pirate_coast_decision.0002.b:0 "Теперь я могу наконец немного отдохнуть..."
 gh_pirate_coast_decision.0003.t:0 "Бич Пиратского побережья"
 gh_pirate_coast_decision.0003.desc:0 "[Select_CString(founder.IsFemale, 'Чудовищная', 'Чудовищный' )] [founder.GetFirstName], [Select_CString(founder.IsFemale, 'пиратка-опустошительница', 'пират-опустошитель' )] и черное пятно морей, [Select_CString(founder.IsFemale, 'исполнила', 'исполнила' )] мечту всей жизни о создании [Concept('pirate','пиратской')|E] державы, непохожей ни на одно другое.\n\nУже сейчас молва о силе и свирепости [founder.GetFirstName] распространяется со скоростью лесного пожара, и только время покажет, какие ужасы [founder.GetSheHe] обрушит на моря."
 gh_pirate_coast_decision.0003.a:0 "[founder.GetSheHe|U] ведь не собирается грабить #EMPнас#!, правда?"
 gh_pirate_coast_decision.0003.b:0 "Кого волнует, что происходит на тех далеких островах?"
 gh_pirate_coast_decision.0004.t:0 "Восход Ночное побережье"
 gh_pirate_coast_decision.0004.desc:0 "Вместе с приливом в морях [Concept('pirate_coast','Пиратского побережья')|E] восходит новая сила, готовая предъявить притязания на все острова от [Concept('sarradon','Саррадона')|E] до Каширии и за их пределами."
 gh_pirate_coast_decision.0004.a:0 "Звезды будут направлять нас."
 gh_pirate_coast_decision.0005.t:0 "Кардамон и корица"
 gh_pirate_coast_decision.0005.desc:0 "С постройкой нашей последней хасиры наше господство над торговлей пряностями, протекающей через [Concept('pirate_coast','Пиратское побережье')|E], закреплено во всем кроме закона. Пройдет некоторое время, прежде чем новые конкуренты попытаются урвать свою долю, что дает нам полный контроль над ценами на наши товары. Совсем скоро в нашей державе будет больше золота, чем на всем Континенте!"
 gh_pirate_coast_decision.0005.a:0 "Давайте взглянем на новые предприятия."
 gh_pirate_coast_decision.0006.t:0 "Возрожденное Серебряное королевство"
 gh_pirate_coast_decision.0006.desc:0 "Более 200 лет знамя [Concept('ufaliracci','Уфалираччи')|E] покоилось похороненным под водой. Теперь, с восстановлением [Concept('silver_palace','Серебряного дворца')|E] и нашего контроля над регионом, мы поднимем это знамя над морем, чтобы все узнали о его возвращении!"
 gh_pirate_coast_decision.0006.a:0 "Слава Серебряному королевству!" 
