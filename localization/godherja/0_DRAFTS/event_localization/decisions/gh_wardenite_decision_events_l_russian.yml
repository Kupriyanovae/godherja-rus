l_russian:
 wardenite_decisions.0001.t:0 "Триумф Мамура"
 wardenite_decisions.0001.desc:0 "Наперекор всем трудностям Центральный мамур сумел уничтожить значительную часть наступающих агионистов. С их армиями у наших врат, они теперь требуют, чтобы мы преклонили колени ради блага веры. Хотя их высокомерие вызывает гнев, мы должны признать, что мечта о том, чтобы однажды реализовать цель Татхтали — объединить Восточный и Центральный мамураматы — весьма соблазнительна..."
 wardenite_decisions.0001.a:0 "Наступает новый мир, и я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] быть его частью."
 wardenite_decisions.0001.b:0 "Я не склоню голову, мечта  $mamur_tathtali_link$ Татхтали#! мертва!"