 marcher.1150.t: "Terror From the Blue"
 marcher.1150.desc: "The villagers living in the vicinity of [province_being_affected.GetName] have come before me today as petitioners. It seems their herds have recently been victimized by an unusually aggressive griffon.\n\nWhile it's not uncommon for wild griffons straying from their roosts in the Bastione Mountains to pick off one or two animals every year, the herdsmen report they've lost dozens of cattle in the span of two months. This behavior is highly unusual and merits investigation, if not for the mystery itself than at least to keep the peasants calm."
 marcher.1150.a: "Have my steed saddled, we ride for [province_being_affected.GetName]"
 marcher.1150.b: "Can't they go bother their sheriff about this instead?"
 marcher.1155.t: "Narrowing Down the Search"
 marcher.1155.desc: "I've spent several days investigating the griffon terrorizing the villagers of [province_being_affected.GetName], and through process of elimination have managed to track it to a somewhat dilapidated corner of the county. Calling a meeting with my team, I settle on two options.\n\nNow that we know roughly where the animal is nesting we can investigate further to try and discover why the beast is acting so strangely and aggressively. Alternatively, we could lure it out with a steer as bait, and fight the animal yourself when it lands to take its prey."
 marcher.1155.a: "We scout further, I have a feeling there's more to this story."
 marcher.1155.b: "This animal must be dealt with quickly and directly. Hand me my sword."
 marcher.1155.a.tt: "I wonder if we can figure it out..."
 marcher.1155.b.tt: "This animal is smart...and deadly. It appears to know what a drawn sword means"
 marcher.1155.b.success: "After a tense battle, my training kicks in and in a double hand swing, the head falls"
 marcher.1155.b.failure: "The Griffon has proved to much! The claw falls ever swiftly towards me..."
 gh_griffon_attack_modifier: "Griffon Attack"
 gh_slew_griffon_modifier: "Slew a Griffon in combat"
 marcher.1160.t: "Tragedy from the Blue"
 marcher.1160.desc: "Moving carefully at night around the vicinity of the griffon's nest I've been able to piece together enough clues to guess at its surprising origin. My best evidence was discovered where the beast seems to have pushed itself against a tree to get free of a tattered and bloodstained set of leather barding, and though the gear has been further worn by the weather for several months, the icons of an Anti-Magic Order were still clearly visible when I found them.\n\nThis would explain the beast's odd behavior: it's not a wild Bastione griffon at all, but instead a trained war-griffon. It's a common plot device in songs: a griffon so bonded to their knight that they are driven to grieving madness when their rider is slain by some cruel magi or lich. I always assumed that was just a bit of bardic embellishment, but now that I'm seeing it in person I have to admit the singers might not have been completely dishonest."
 marcher.1160.a: "I think I may be able to earn the beast's trust."
 marcher.1160.b: "Send a messenger to the nearest Order-House so they can deal with it."
 marcher.1160.a.success: "The Griffon listens and bows its head"
 marcher.1160.b.success: "The Griffon roars and attacks before you calm it down"
 marcher.1160.c.failure: "The Griffon charges forward and catches your leg before flying away"
 marcher.1160.d.failure: "The Griffon charges forward and you manage to leap out of the way as its wings beat"
 marcher.1165.t: "Rogue Knights"
 marcher.1165.desc: "The mystery of the griffon's depredations become stranger as we carefully track its kills. While some of its prey are devoured then and there, every few strikes it takes the body of its bovine victim with it. At first I surmised it could have a nest with young until we noted a thin plume of smoke rising from the dense patch of forest to which it had returned. Griffons are smart animals, but they don't know how to light a fire.\n\nConfirming the beast has departed to hunt, I move quietly through the wilderness early the next afternoon. When I discover the encampment it does not come as a surprise, roughly a half dozen grizzled men and women, bandits by the looks of them. As I study the situation further the only warning I get that something's amiss is the sudden snap of a twig behind me. Stumbling backwards into the clearing I'm face to face with the gang's apparent leader, a terrifying looking woman wearing a tattered hauberk and a dirty tabard that still clearly bears the markings of one of the Anti-Magic orders. A renegade perhaps not unheard of, but unusual especially if she was trusted enough to be given a griffon. Desperately looking around I can see her men standing and readying their weapons."
 marcher.1165.a: "Draw Steel!"
 marcher.1165.b: "Bandits like gold right? I have gold!"
 marcher.1165.c: "Why not work for me? I could use well trained fighters like yourselves."
 marcher.1165.a.tt: "I draw my sword and charge too"
 marcher.1165.a.success: "I cleave the bandit leaders head from their shoulders"
 marcher.1165.a.failure: "After a drawn out duel, I feel myself tire and I see the blade coming too fast..."
 marcher.1165.b.tt: "I hope they leave everyone alone now..."
 marcher.1165.c.success: "Intriguied by your offer, they accept"
 marcher.1165.c.failure: "Initially they seem to accept, but too late you see a glint of silver"
 marcher.1170.t: "An Adventuresome Griffon"
 marcher.1170.desc: "My team and I are thorough in our search, but it turns out the mystery of the griffon terrorizing my province was, in the end, quite simple. Observing the majestic beast at rest from a hidden vantage point it's unmistakably a young male from one of the few remaining wild bloodlines — his drab, mottled gray coat and distinctively short and straight beak are traits which have been lost over the successive generations of breeding that resulted in the modern Marcher Griffon. While his decision to range so far from his breed's standard range in the Bastione Mountains is unusual, wild griffons are known to have a strong adventurous streak — a habit that makes them quite dangerous given that they lack none of the intelligence than their domesticated cousins are notorious for.\n\nWith that solved, now comes the harder question: how shall we deal with this noble beast."
 marcher.1170.a: "Oh just leave it be, he'll move on eventually."
 marcher.1170.b: "This will be dangerous, but I'm certain I can tame him!"
 marcher.1170.c: "A show of aggression to drive it off!"
 marcher.1170.c.tt: "While not a fight to the death, the Griffon knows you are trying to attack it"
 marcher.1170.a.success: "Through force of will, the Griffon recognises a losing fight and takes off"
 marcher.1170.a.failure: "The Griffon puts up more of a fight then you first anticipated, its claws rake down on you..."

 ######################
 ## Sarminian events ##
 ######################

 gh_sarminian_events.0001.t: "All Under the Azure Sky"
 gh_sarminian_events.0001.desc:"Rejoice, the daughters of $SA_laza$!\n\nAway from the Kolrgii Steppe; ahead of the dreaded [Concept('the_fog','Fog')|E] in the [Concept('sjalvolki_migration','Grand Coalition')|E]; a piercing arrow to put the dying [aversaria|E] out of its misery — the legends of today prove that we have not lost the skies' favor.\n\nEndless banners flutter in the [Glossary('red wind','GH_SARMINIAN_CARDINAL_COLORS')], tribes and clans and more swearing their oaths, joining as one beneath my rightful authority as the $king_female_sarminian$. As untold hooves trample the grass and fletchers ready their stock, all from the camp-born waifs to the bloodied [Glossary('Órzopajad','GH_ORZOPAJA_GLOSS')] have but one silent question on their lips:\n\n#EMP Who's next?#!"
 gh_sarminian_events.0001.a: "The future is ours by right."

 gh_sarminian_events.0002.t: "$gh_sarminian_events.0001.t$"
 gh_sarminian_events.0002.desc: "Our long journey is finally over.\n\nThe end of the march comes suddenly, and many continue on out of habit; the idea of a homeland is alien to all but the oldest among us. Still, home is what [founder.GetTitledFirstName] promises us — promises to anyone willing to bow to [founder.GetHerHim].\n\nNo doubt, there are stories yet untold, paths yet to be tread, glory still to be earned. But what adventure is grander than one shared by all?"
 gh_sarminian_events.0002.a: "$gh_sarminian_events.0001.a$"

 gh_sarminian_events.1003.t: "Our Past and Future"
 gh_sarminian_events.1003.desc.intro: "Who are we?\n\nWarriors? Raiders? Something else entirely? True, our histories are long and storied, our legends plentiful — but the heart of our culture is in flux, polishing and grinding against that of others in these turbulent times."
 gh_sarminian_events.1003.desc.tradition: "In the end, when all is said and done, we must turn to tradition to preserve our way of life. Just like the [Glossary('Órzopajad','GH_ORZOPAJA_GLOSS')] of old, we are destined to war, quarry, and hunt beneath the endless azure skies, bow in hand and steed beneath us.\n\nLet the winds of change break upon us, and the world shall yield to our resolve."
 gh_sarminian_events.1003.desc.domination: "But we are not cut from the same [Glossary('black cloth','GH_SARMINIAN_CARDINAL_COLORS')] as others, no — we meet adversity with adversity, blood with blood, steel with steel. It is through our own merit that we must forge our path, unfettered and unbound.\n\nThe [ROOT.Char.GetCulture.GetNameNoTooltip] are destined to rule — and rule we shall."
 gh_sarminian_events.1003.desc.glory: "We are in the eye of the storm — or perhaps, we are the storm itself. Let others offer us coin, spoils, and glory; we will take them, and then take more.\n\nThe world around us offers as many paths as there are stars in the sky, and ours will shine the brightest."
 gh_sarminian_events.1003.desc.justice: "We have witnessed the value of unity — of standing together abreast, being a part of the greater whole. We must protect what is right, for through it, we will protect our future.\n\nJustice is fleeting if taken for granted; let our deeds etch it in stone."
 gh_sarminian_events.1003.a: "Such is destiny."

 gh_sarminian_events.1004.t: "$gh_sarminian_events.1003.t$"
 gh_sarminian_events.1004.desc.intro: "Who are we?\n\nWarriors? Raiders? Something else entirely? In [reformer.GetTitledFirstNamePossessive] [reformer.Custom('EyeEyes')], the answer lies in "
 gh_sarminian_events.1004.desc.tradition: "tradition. By retaining and reinforcing the customs of old, [reformer.GetSheHe] seeks to cement the [reformer.GetCulture.GetName] identity of today as it was in centuries past — in the stories and legends of yesteryear."
 gh_sarminian_events.1004.desc.domination: "power. It is through power that the [reformer.GetCulture.GetName] live, and it is through it that they should forge their destiny. Steel begets steel, and the meek are lost in the strife of the world."
 gh_sarminian_events.1004.desc.glory: "glory. The [reformer.GetCulture.GetName] legend is a living, breathing thing — and through the deeds of its bearers, it may yet reach a higher summit. The journey of gold begins with a single step, and that step is adventure."
 gh_sarminian_events.1004.desc.justice: "honor. There is no ideal higher than justice, no crime worse than treachery. The [reformer.GetCulture.GetName] are not alone anymore — and the brightest future is the one forged together."
 gh_sarminian_events.1004.desc.outro: "\n\nIt is but one answer among many, but it may be the one that holds true in the end."
 gh_sarminian_events.1004.tradition_tooltip: "[reformer.GetCulture.GetName] [culture|E] has retained the [GetCultureTradition('tradition_steppe_queens').GetName] [tradition|E]"
 gh_sarminian_events.1004.a: "$gh_sarminian_events.1003.a$"
 gh_sarminian_events.1004.b: "No! This is #EMP not#! who we are!"
 gh_sarminian_events.1004.b.tooltip: "You create a new [reformer.GetCulture.GetName|V] [divergent_culture|E]"
 gh_sarminian_events.1004.b.decision_tooltip: "Your new [culture|E] will have access to the #V $decide_the_fate_of_the_sarminians_decision$#! [decision|E]"

 # Surplus Arrowheads
 gh_sarminian_events.0003.t: "Surplus Arrowheads"
 gh_sarminian_events.0003.desc: "The merchant activity has been particularly fruitful this year, and now the local smiths in [capital_county.GetNameNoTier] have found themselves in possession of a large surplus of good metal in a stockpile. Already, the bellows are stroking up their forges' flames in preparation for a massive influx of orders, and the constant billowing smoke from the smithies is starting to become a common sight for the weeks to come.\n\nAs is proper, I am contacted by a representative of theirs to see if I would like to make the first order and commission better armaments for my troops."
 gh_sarminian_events.0003.a: "Place a large order of arrowheads."
 gh_sarminian_events.0003.a.tt: "Large stock of reliable arrows will be useful in a war"
 gh_sarminian_events.0003.b: "Order deadly barbed arrows."
 gh_sarminian_events.0003.b.tt: "Barbed arrows cause greater injuries and are hard to remove"
 gh_sarminian_events.0003.c: "Let the locals of [capital_county.GetNameNoTierNoTooltip] benefit instead."
 gh_sarminian_events.0003.c.tt: "Let peasantry use the surplus of good metal as they see fit"
 gh_sarminian_events.0003.d: "Demand a share of the stockpile."
 gh_sarminian_events.0003.d.tt: "Levy an extra tax to personally benefit from the surplus"

 # Local Falcons Eliminate Rats
 gh_sarminian_events.0004.t: "Stewards of the Skies"
 gh_sarminian_events.0004.desc: "Lately, the sight of falcons circling in the skies above [capital_county.GetNameNoTier] has become a rather common occurrence. Ranging far and wide from the [GetBuilding('falcon_roost_01').GetName] nearby, these birds of prey have relentlessly hunted down many rodents and other pests throughout the province, offering a significant, if temporary, reprieve for its inhabitants.\n\nAlthough this nature's boon is bound to pass, for now [capital_county.GetNameNoTierNoTooltip] enjoys nearly intact grain barns and fewer illnesses among the populace."
 gh_sarminian_events.0004.a: "Fly true, little ones!"
 gh_sarminian_events.0004.b: "Who even needs a cat, when you have falcons?"

 gh_sarminian_events.0005.t:90 "Seared"
 gh_sarminian_events.0005.start.desc:90 "Two prison guards drag the resisting [recipient.GetTitledFirstName] into the room and, with no small amount of effort, secure [recipient.GetHerHim] in a pillory for the punishment. Nearby, my physician sorts through a rich selection of knives, razors, hooks, and scissors, turning them over a brazier with burning hot coals.\n\n"
 gh_sarminian_events.0005.cruel.desc:90 ""Wretch," I declare, "today is the last day you will stain these walls with your presence. Your pride and honor die here — not that you had any in the first place.""
 gh_sarminian_events.0005.compassionate.desc:90 ""Understand that I regret it came to this, [recipient.GetFirstNameNoTooltip]," I state, "but I have no other choice. The needs of the realm are paramount, and for them, you #EMP must#! face exile.""
 gh_sarminian_events.0005.a:90 "Oh, yes, this #emp will#! hurt."
 gh_sarminian_events.0005.b:90 "It needs to be done."

 gh_sarminian_events.0006.t:90 "$gh_sarminian_events.0005.t$"
 gh_sarminian_events.0006.start.desc:90 "My days of isolation abruptly end when a pair of jail guards drag me away from my cell to a dark room I have never been in before, and clasp a pillory around my neck and wrists. [actor.GetTitledFirstName] is here, and another person near [actor.GetHerHim] is turning a wicked-looking razor over an open fire.\n\n"
 gh_sarminian_events.0006.cruel.desc:90 ""Wretch," my captor declares, "today is the last day you will stain these walls with your presence. Your pride and honor die here — not that you had any in the first place.""
 gh_sarminian_events.0006.compassionate.desc:90 ""Understand that I regret it came to this, [recipient.GetFirstNameNoTooltip]," my captor states, "but I have no other choice. The needs of the realm are paramount, and for them, you must face exile.""
 gh_sarminian_events.0006.end.desc:90 "\n\nCold dread seeps into me as I try to struggle, to resist, to escape, but I can only scream as hot metal touches the skin on my head."
 gh_sarminian_events.0006.a:90 "What...? Let me go! #emp Nooo!#!"

 gh_sarminian_events.0007.t:90 "Healed!"
 gh_sarminian_events.0007.desc:90 "It has been years since I was seared and branded at the hands of [actor.GetTitledFirstName], consigning me to a wretched existence as an exile. Over time, the pain has dulled, the wounds have healed, and I can finally touch the burned skin on my head without shuddering.\n\nAlthough only a few delicate locks have reappeared thus far, I hope that, given time, they will grow out and conceal the scars of my past."
 gh_sarminian_events.0007.a:90 "I am whole again."

 gh_sarminian_events.0008.t:90 "Lye Merchant"
 gh_sarminian_events.0008.desc:90 "As I stroll through the streets of a local market in [market_location.GetName] with my retinue, a particular stall catches my attention. Curious, I approach it, and the merchant manning it smiles, beginning [lye_merchant.GetHerHis] sales pitch.\n\n"Greetings, my [ROOT.Char.GetLadyLord|U]! Please, take a look — I have the finest lyes in all of [market_kingdom.GetNameNoTier] and beyond! They will do wonders for your skin and hair; in fact, I have yet to have even a single unhappy customer.""
 gh_sarminian_events.0008.a:90 "Wonderful, I'll buy a whole batch!"
 gh_sarminian_events.0008.a.tt:90 "You purchase several tinctures and oils for your hair"
 gh_sarminian_events.0008.b:90 "I am interested, but not at this price."
 gh_sarminian_events_0008.b.tt:90 "You haggle with the merchant to bring the price down"
 gh_sarminian_events_0008_b_tt_free:90 "You get a free sample"
 gh_sarminian_events.0008.b.toast.free:90 "You got a free sample"
 gh_sarminian_events_0008_b_tt_cheap:90 "Both of you agree on a discount"
 gh_sarminian_events.0008.b.toast.cheap:90 "You managed to get a discount"
 gh_sarminian_events_0008_b_tt_expensive:90 "[lye_merchant.GetFirstNameNoTooltip] outwits you"
 gh_sarminian_events.0008.b.toast.expensive:90 "You ended up paying more"
 gh_sarminian_events.0008.c:90 "Guards, requisition me a #EMP sample#! of these wares."
 gh_sarminian_events.0008.c.tt:90 "You seize a portion of [lye_merchant.GetFirstNamePossessive] stock"
 gh_sarminian_events.0008.d:90 "If I wanted snake oil, I'd wring my vassals."
 gh_sarminian_events.0008.d.tt:90 "You walk away — who knows what these could be made of?"

 gh_sarminian_events.0009.t:90 "Knot in Vain"
 gh_sarminian_events.0009.desc:90 "It has now been a good few weeks since I started using the newly bought lye. "
 gh_sarminian_events.0009.desc.neutral:90 "Unsurprisingly, the merchant's claims appear to be somewhat exaggerated, as I did not notice any noteworthy improvements compared to prior alternatives that I have used.\n\nAlthough not a miracle cure by any stretch of the imagination, the tincture does seem to have a mild soothing effect, so it was not a complete loss."
 gh_sarminian_events.0009.desc.positive:90 "Despite some of my earlier reservations, the rose-scented solution proved to be both soothing and effective, noticeably nourishing and strengthening my tresses.\n\nAlthough I've bought it in bulk, all of the lye will inevitably be used up — so it is better to enjoy it while it lasts."
 gh_sarminian_events.0009.desc.negative:90 "Unnaturally viscous and foul-smelling, it was a far cry from the miracle cure that the merchant promised — and it did not take long for my hair to become dull, brittle, and frayed.\n\nI immediately ordered the rest of the lye to be dumped as waste, but it will take some time to restore the health of my locks."
 gh_sarminian_events.0009.desc.catastrophic:90 "So far, nothing has changed, and this morning, like any other, I sit before the mirror to comb through my hair.\n\nWith practiced movements, I undo the nightly knots and tangles, brushing along the whole length of the strands, when suddenly I feel a strange pulling sensation that quickly passes. Offhandedly, I glance at the comb in my hand and freeze.\n\nI blink.\n\nThen I blink again, for a good measure.\n\nA large clump of my hair has detached itself entirely from my head and now messily rests on the floor around me, with some of it still stuck on the comb. With shaking hands, I lightly tug on my tresses, encountering little to no resistance before they are pulled out."
 gh_sarminian_events.0009.a:90 "Not unexpected, if somewhat disappointing."
 gh_sarminian_events.0009.a.tt:90 "My tresses might have gotten a bit glossier though?"
 gh_sarminian_events.0009.b:90 "What a wonder!"
 gh_sarminian_events.0009.c:90 "What a scam."
 gh_sarminian_events.0009.d:90 "What is happening!?"

 gh_sarminian_events.0010.t: "Stranger at the Fire"
 gh_sarminian_events.0010.desc: "Sounds of a small commotion draw me towards the entrance to our camp, where I see [knight_antagonist.Custom2('MyCharacterIntroduction', ROOT.Char)] staring down a frantically speaking [prospective_orzopaja.GetCulture.GetName] [prospective_orzopaja.GetWomanMan].\n\n\"Please, let me join you! I will do what you do; I want to ride like you ride!\" [prospective_orzopaja.GetSheHe] hastily explains, making vague gestures in the air towards my utterly unimpressed $knight_culture_player_no_tooltip_lowercase$.\n\nWhen they spot my approach, the [prospective_orzopaja.GetWomanMan] quickly turns [prospective_orzopaja.GetHerHis] pleas towards me while [knight_antagonist.GetFirstNameNoTooltip] simply raises an eyebrow, awaiting my decision."
 gh_sarminian_events.0010.a: "I will give you a chance, but no more."
 gh_sarminian_events.0010.a.flavor: "Who is to say where this arrow will land, after all?"
 gh_sarminian_events.0010.b: "[knight_antagonist.GetFirstNameNoTooltip] will test you. Thoroughly."
 gh_sarminian_events.0010.b.flavor: "Let [prospective_orzopaja.GetFirstNamePossessiveNoTooltip] actions speak, not [prospective_orzopaja.GetHerHis] words."
 gh_sarminian_events.0010.b.win: "[prospective_orzopaja.GetFirstNameNoTooltip] holds her own against [knight_antagonist.GetFirstNameNoTooltip]"
 gh_sarminian_events.0010.b.win.toast: "[prospective_orzopaja.GetFirstNameNoTooltip] proves her mettle"
 gh_sarminian_events.0010.b.loss: "[prospective_orzopaja.GetFirstNameNoTooltip] is hopelessly outmatched"
 gh_sarminian_events.0010.b.loss.toast: "[knight_antagonist.GetFirstNameNoTooltip] defeats [prospective_orzopaja.GetFirstNameNoTooltip] with ease"
 gh_sarminian_events.0010.b.tt: "[prospective_orzopaja.GetShortUIName] and [knight_antagonist.GetShortUIName] may become wounded, or form a [relation|E] with each other"
 gh_sarminian_events.0010.c: "Easy. #EMP Kill each other#!."
 gh_sarminian_events.0010.c.flavor: "Finally, some #EMP entertainment#!."
 gh_sarminian_events.0010.c.win: "[prospective_orzopaja.GetFirstNameNoTooltip] slays [knight_antagonist.GetFirstNameNoTooltip]"
 gh_sarminian_events.0010.c.win.toast: "[prospective_orzopaja.GetFirstNameNoTooltip] has slain [knight_antagonist.GetFirstNameNoTooltip]"
 gh_sarminian_events.0010.c.loss: "[knight_antagonist.GetFirstNameNoTooltip] slays [prospective_orzopaja.GetFirstNameNoTooltip]"
 gh_sarminian_events.0010.c.loss.toast: "[knight_antagonist.GetFirstNameNoTooltip] has slain [prospective_orzopaja.GetFirstNameNoTooltip]"
 gh_sarminian_events.0010.d: "A [Glossary('black','GH_SARMINIAN_CARDINAL_COLORS')] waif like you? Ha! Never."
 gh_sarminian_events.0010.d.flavor: "A vagrant has no place among the warriors."

 # Sarminian Archer Competition
 gh_sarminian_events.0101.t: "A Friendly Archery Competition"
 gh_sarminian_events.0101.desc: "As I observe the training of my troops in the courtyard one day, I am approached by my $knight_culture_player_plural_no_tooltip_lowercase$ [first.GetTitledFirstName] and [second.GetTitledFirstName], both with bows in their hands.\n\n"My [ROOT.Char.GetTitleTierName], we two were thinking of getting in a bit of mounted practice – would you be interested in participating as well?" asks [first.GetTitledFirstNameNoTooltip], gesturing towards several carts with archery targets in the corner of the courtyard.\n\nI am not terribly occupied at the moment, and winning in such an event, even under the guise of training, will surely bring a degree of achievement to my name. On the other hand, I can absolve myself from participating just as easily."
 gh_sarminian_events.0101.a: "A brilliant idea! Ready my horse, we will be departing shortly."
 gh_sarminian_events.0101.a.success: "My arrows strike true and I win the competition"
 gh_sarminian_events.0101.a.good_attempt: "I do not win, but my arrows find their mark"
 gh_sarminian_events.0101.a.failure: "I fumble and make a poor showing"
 gh_sarminian_events.0101.b: "A competition, you say? [heir.GetFirstName] could use some fresh air."
 gh_sarminian_events.0101.b.success: "[heir.GetFirstNamePossessiveNoTooltip] arrows strike true and [heir.GetSheHe] wins the competition"
 gh_sarminian_events.0101.b.good_attempt: "[heir.GetFirstNameNoTooltip] does not win, but [heir.GetHerHis] arrows find their mark"
 gh_sarminian_events.0101.b.failure: "[heir.GetSheHe|U] fumbles and makes a poor showing"
 gh_sarminian_events.0101.c: "I have other matters I need to attend to."
 gh_sarminian_events.0102.t: "Victory!"
 gh_sarminian_events.0102.desc: "The competition progresses normally when, at last, it is finally my time to shoot. As I direct my horse to the starting line, I take stock of the five evenly spread archery targets lined along a nice flat stretch of terrain, with my competitors' arrows still lodged in them.\n\n"
 gh_sarminian_events.0102.desc.decisive: "Urging my horse to start its gallop, I prepare to draw the bow and release my arrows. Once my steed approaches the first target, I attune my movements to its rhythm and release the bowstring, embedding my arrow deep within the bullseye. This repeats four more times before I reach the finish line, where I am greeted by a cheering crowd of enthusiastic onlookers.\n\nThe points are promptly counted, and it soon becomes apparent that my victory is indisputable."
 gh_sarminian_events.0102.desc.close: "It is with mild trepidation that I urge my horse forward in a gallop, knowing full well that it would take all my skill to trample over my opponents. With the target quickly approaching, I hold my breath and release an arrow that promptly embeds itself into the bullseye. Leaning on my training, I succeed in repeating this four more times before I reach the finish line, where I am greeted by a cheering crowd of enthusiastic onlookers.\n\nThe points are promptly counted, and it seems that I have managed to win in a convincing fashion."
 gh_sarminian_events.0102.desc.underdog: "A nervous shiver travels down my spine before I steel myself and urge my horse to start galloping forward. Moments later, I halt my breath as we approach the first target, releasing an arrow that, to my mild surprise, embeds itself into the bullseye. My courage slowly grows as this repeats four more times before I reach the finish line, where I am greeted by a cheering crowd of enthusiastic onlookers.\n\nThe points are promptly counted, and it seems that I have managed to win by a narrow margin."
 gh_sarminian_events.0102.a: "Such prowess is but expected of a [ROOT.Char.GetTitleAsNameNoTooltip]."
 gh_sarminian_events.0103.t: "Defeated!"
 gh_sarminian_events.0103.desc: "The competition progresses normally when, at last, it is finally my time to shoot. As I direct my horse to the starting line, I take stock of the five evenly spread archery targets lined along a nice flat stretch of terrain, with my competitors' arrows still lodged in them.\n\nUrging my horse forward, I hiss under my breath as my first arrow narrowly misses the bullseye, with the next few shots ending up in a similar fashion. My final arrow goes even wider, striking the very edge of the fifth target.\n\nI lower my bow in defeat when crossing the finish line, and subsequent counting of points predictably reveals that it was [winner.GetFirstName] who has won the competition."
 gh_sarminian_events.0103.a: "We are blessed to have $knight_culture_player_plural_no_tooltip_lowercase$ of such skill."
 gh_sarminian_events.0103.b: "Such prowess is but expected from a [winner.Custom('GetDaughterSon')] of the [ROOT.Char.GetTitleAsNameNoTooltip]."
 gh_sarminian_events.0103.c: "That was just a fluke, you hear me?"
 gh_sarminian_events.0103.d: "Clearly, [winner.GetFirstNameNoTooltip] does not know [winner.GetHerHis] place."
 gh_sarminian_events.0104.t: "A Shameful Display"
 gh_sarminian_events.0104.desc.a: "$gh_sarminian_events.0102.desc$Urging my horse forward, we accelerate to a gallop, and I ready my bow. Shooting from horseback, my arrows find their purchase with reasonable accuracy, and it is not until the very last target that something unexpected happens – just as I ready my bow to shoot the final arrow,"
 gh_sarminian_events.0104.desc.wind: "a sudden gust of wind shatters my concentration, and I release the bowstring prematurely."
 gh_sarminian_events.0104.desc.shout: "a sudden shout causes me to flinch and release my bowstring prematurely."
 gh_sarminian_events.0104.desc.horse: "a sudden swerving of my horse catches me off guard, making me release the arrow prematurely."
 gh_sarminian_events.0104.desc.b: "\n\nAs I cross the finish line moments later, the crowd of onlookers is silent, and I wish I could sink into the ground out of shame."
 gh_sarminian_events.0104.a: "Oh."
 gh_sarminian_events.0104.critical: "Where did that arrow go?"
 gh_sarminian_events.0105.t: "A Wayward Arrow"
 gh_sarminian_events.0105.desc: "A shrill scream pierces the air, coming from behind me. Turning towards its source, I witness"
 gh_sarminian_events.0105.desc.arm: "[wounded.GetTitledFirstName] clutching [wounded.GetHerHis] bloodied arm, with my arrow protruding from the wound."
 gh_sarminian_events.0105.desc.leg: "[wounded.GetTitledFirstName] clutching [wounded.GetHerHis] bloodied leg, with my arrow protruding from the wound."
 gh_sarminian_events.0105.desc.stomach: "[wounded.GetTitledFirstName] clutching [wounded.GetHerHis] bloodied stomach, with my arrow protruding from the wound."
 gh_sarminian_events.0105.desc.heart: "a lifeless body of [wounded.GetTitledFirstName], with my arrow protruding from a fatal wound right through [wounded.GetHerHis] heart."
 gh_sarminian_events.0105.desc.neck: "a lifeless body of [wounded.GetTitledFirstName], with my arrow protruding from a fatal wound right through [wounded.GetHerHis] neck."
 gh_sarminian_events.0105.desc.temple: "a lifeless body of [wounded.GetTitledFirstName], with my arrow protruding from a fatal wound right through [wounded.GetHerHis] temple."
 gh_sarminian_events.0105.a: "How did it come to this?"
 gh_sarminian_events.0105.b: "So my arrow did not miss after all."
 gh_sarminian_events.0106.t: "[heir.GetFirstNameNoTooltip] is Victorious"
 gh_sarminian_events.0106.desc: "Later that day one of my retainers knocks on the door of my study to inform me about the results of the archery competition between [first.GetTitledFirstName], [second.GetTitledFirstName], and [heir.GetTitledFirstName].\n\nI am pleased to hear that it was my [heir.Custom('GetDaughterSon')] [heir.GetFirstNameNoTooltip] who emerged as the victor of that small contest. It might not seem like much, but this will surely cement [heir.GetHerHis] standing for the future."
 gh_sarminian_events.0106.a: "Such prowess is but expected from a [heir.Custom('GetDaughterSon')] of the [ROOT.Char.GetTitleAsNameNoTooltip]."
 gh_sarminian_events.0107.t: "An Honourable Defeat"
 gh_sarminian_events.0107.desc: "Later that day one of my retainers knocks on the door of my study to inform me about the results of the archery competition between [first.GetTitledFirstName], [second.GetTitledFirstName], and [heir.GetTitledFirstName].\n\nRegrettably, it was not my [heir.Custom('GetDaughterSon')], but rather [winner.GetTitledFirstNameNoTooltip] who emerged as the victor of that small contest. Thankfully, it seems that no hard feelings were exchanged between the contestants, and, if anything, they seem to have only grown to respect each other more."
 gh_sarminian_events.0107.a: "[heir.GetSheHe|U] will prove [heir.GetHerselfHimself] yet."
 gh_sarminian_events.0108.t: "A Match Gone Awry"
 gh_sarminian_events.0108.desc: "Later that day one of my retainers knocks on the door of my study to inform me about the results of the archery competition between [first.GetTitledFirstName], [second.GetTitledFirstName], and [heir.GetTitledFirstName].\n\nApparently, it was [winner.GetTitledFirstNameNoTooltip] who emerged as the victor of that small contest. More importantly, however, was that my [heir.Custom('GetDaughterSon')] did not take to losing kindly, throwing a tantrum and insulting the other participants.\n\nI can only hope that such an outburst does not cause [heir.GetHerHis] any problems in the future."
 gh_sarminian_events.0108.a: "$gh_sarminian_events.0107.a$"
 gh_sarminian_events.0109.t: "An Abrupt End"
 gh_sarminian_events.0109.desc.a: "Later that day one of my retainers knocks on the door of my study to inform me about the results of the archery competition between [first.GetTitledFirstName], [second.GetTitledFirstName], and [heir.GetTitledFirstName].\n\nI am told that, unfortunately, it came to an abrupt end when my [heir.Custom('GetDaughterSon')] accidentally almost shot an arrow through one of the bystanders. Thankfully, nobody was seriously hurt, but the contestants have agreed to stop the competition right then and there, resulting in little more than a minute embarrassment for [heir.GetFirstNameNoTooltip]."
 gh_sarminian_events.0109.desc.b: "Later that day one of my retainers rushes into my study to inform me that there has been an accident during the archery competition between [first.GetTitledFirstName], [second.GetTitledFirstName], and [heir.GetTitledFirstName].\n\nI am told that one of my [heir.Custom('GetDaughterSon')]'s arrows missed the target by a large margin and struck [wounded.GetTitledFirstName], causing a severe injury. The contest was called off right then and there, as people rushed to tend to [wounded.GetHerHis] wound."
 gh_sarminian_events.0109.desc.c: "Later that day one of my retainers rushes into my study to inform me that there has been an accident during the archery competition between [first.GetTitledFirstName], [second.GetTitledFirstName], and [heir.GetTitledFirstName].\n\nI am told that one of my [heir.Custom('GetDaughterSon')]'s arrows missed the target by a large margin and struck [wounded.GetTitledFirstName], killing [wounded.GetHerHim] on the spot! The contest was called off right then and there as people realized what had just transpired."
 gh_sarminian_events.0109.a: "Oh dear."
 gh_sarminian_events.0109.b: "Sounds like my [heir.Custom('GetDaughterSon')]'s arrow did not miss after all."

 # A Veteran Steppe Queen Offers Their Services
 gh_sarminian_events.0201.t: "A [GetTrait('lifestyle_gh_steppe_queen').GetNameNoTooltip( legendary_steppe_queen.Self )] Offers [legendary_steppe_queen.GetHerHis|U] Service"
 gh_sarminian_events.0201.desc: "A rugged [legendary_steppe_queen.GetWomanMan] in armour with the bearing of a $knight_culture_player_no_tooltip_lowercase$ comes before me at my court after requesting an audience.\n\n"My [ROOT.Char.GetTitleTierName]," [legendary_steppe_queen.GetSheHe] starts, "I have earned the right to wear my braid on the fields of battle as a mercenary, fighting for good drink, coin, and company."\n\n"But these days are now behind me," [legendary_steppe_queen.GetSheHe] sighs.\n\n"Should you wish to take me as one of your retainers, I, [legendary_steppe_queen.GetFirstName], vow to faithfully serve you for as long as you have the need of me.""
 gh_sarminian_events.0201.a: "Welcome [legendary_steppe_queen.GetHerHim] with open arms."
 gh_sarminian_events.0201.b: "I shall personally test [legendary_steppe_queen.GetHerHis] mettle."
 gh_sarminian_events.0201.b.success: "A mock duel tells you everything you need to know"
 gh_sarminian_events.0201.b.success.tt: "It would be revealed if they are lying"
 gh_sarminian_events.0201.b.failure: "The skirmish does not reveal anything to you"
 gh_sarminian_events.0201.b.failure.tt: "You are unable to conclusively determine their skill"
 gh_sarminian_events.0201.c: "[legendary_steppe_queen.GetHerHis|U] claims do sound somewhat suspicious..."
 gh_sarminian_events.0201.c.success: "Your investigation is successful"
 gh_sarminian_events.0201.c.success.tt: "It would be revealed if they are lying"
 gh_sarminian_events.0201.c.failure: "You fail to learn anything of note"
 gh_sarminian_events.0201.c.failure.tt: "You are unable to conclusively determine their skill"
 gh_sarminian_events.0201.d: "This all seems terribly dubious, dismiss [legendary_steppe_queen.GetHerHim]."
 gh_sarminian_events.0201.b.tt: "[legendary_steppe_queen.GetFirstName] leaves"
 gh_sarminian_events.0202.t: "A Liar in Our Midst"
 gh_sarminian_events.0202.desc: "Some things are too good to be true – as it has unfortunately turned out to be the case with [legendary_steppe_queen.GetFirstNamePossessive] claims."
 gh_sarminian_events.0202.desc.prowess: "\n\nAfter the first few exchanges of our mock duel, my mood rapidly sours – [legendary_steppe_queen.GetFirstNamePossessiveNoTooltip] stance is a disaster; [legendary_steppe_queen.GetHerHis] hands are shaking and guard full of openings. In a couple more, I am deliberating whether this is [legendary_steppe_queen.GetHerHis] first or second time even holding a sword. As [legendary_steppe_queen.GetSheHe] is clearly panicking at this point, it does not take me much effort to force [legendary_steppe_queen.GetHerHim] to the ground with my blows, kick [legendary_steppe_queen.GetHerHis] weapon away, and point the tip of my sword at [legendary_steppe_queen.GetHerHis] neck.\n\nAt the sight of raw steel at [legendary_steppe_queen.GetHerHis] collar [legendary_steppe_queen.GetFirstNameNoTooltip] stills, knowing full well that [legendary_steppe_queen.GetHerHis] deception has been wholly dispelled."
 gh_sarminian_events.0202.desc.intrigue: "\n\nIt did not take long for my agents to come across the news of a recent string of minor frauds involving the impersonation of my tax collectors, all tied together by a description of an eerily familiar perpetrator.\n\nAs [legendary_steppe_queen.GetFirstNameNoTooltip] is brought before me by my $knight_culture_player_plural_no_tooltip_lowercase$ the following day, kicking and screaming, one of my advisers reads out a lengthy list of crimes that [legendary_steppe_queen.GetSheHe] is accused of. This seems to magically transform [legendary_steppe_queen.GetHerHis] threats and comminations into pleas of clemency and mercy, and I am taken aback in mild disgust at the radical change in [legendary_steppe_queen.GetHerHis] reaction."
 gh_sarminian_events.0202.desc.dead: "It did not take long for my agents to come across the news of a recent string of minor frauds involving the impersonation of my tax collectors, all tied together by a description of an eerily familiar perpetrator.\n\nJust as I was preparing to send my $knight_culture_player_plural_no_tooltip_lowercase$ to retrieve [legendary_steppe_queen.GetFirstName] so that [legendary_steppe_queen.GetSheHe] can be charged for [legendary_steppe_queen.GetHerHis] crimes, one of my advisers comes to me to inform that, apparently, [legendary_steppe_queen.GetSheHe] has just passed away."
 gh_sarminian_events.0202.revealed: "I have revealed [legendary_steppe_queen.GetFirstNamePossessiveNoTooltip] true colours"
 gh_sarminian_events.0202.a: "Get [legendary_steppe_queen.GetHerHim] out of my sight."
 gh_sarminian_events.0202.b: "Have [legendary_steppe_queen.GetHerHim] whipped and banished."
 gh_sarminian_events.0202.c: "The deceiver will rot in my dungeon."
 gh_sarminian_events.0202.d: "Strike [legendary_steppe_queen.GetFirstNameNoTooltip] down on the spot."
 gh_sarminian_events.0202.e: "Arrange a public execution for the people of [capital_barony.GetNameNoTierNoTooltip]."
 gh_sarminian_events.0202.f: "I suppose [legendary_steppe_queen.GetSheHe] did get brought to justice, in a way."
 gh_sarminian_events.0203.t: "A Proven Exemplar"
 gh_sarminian_events.0203.desc: "Some things sound too good to be true – and yet everything points down to [legendary_steppe_queen.GetFirstNamePossessive] offer being most genuine."
 gh_sarminian_events.0203.desc.prowess: "\n\nAs we measure each other up before our mock duel, I am immediately put on high alert by [legendary_steppe_queen.GetFirstNamePossessiveNoTooltip] practiced stance and the sharp glint I catch in [legendary_steppe_queen.GetHerHis] eyes. This proves pivotal, as immediately when the start is signalled, she launches [legendary_steppe_queen.GetHerselfHimself] towards me, exploding in a flurry of vicious attacks.\n\nOur gazes remain tightly locked onto each other as we continue to exchange blows, and it takes all of my focus to defend against [legendary_steppe_queen.GetHerHis] skilful feints and ripostes. When we finally fully exhaust ourselves and disengage, I already know that there has been no embellishment in [legendary_steppe_queen.GetFirstNamePossessiveNoTooltip] claims of martial prowess and experience."
 gh_sarminian_events.0203.desc.intrigue: "\n\nIt is just days later when my agents return to me after being tasked with verifying the validity of [legendary_steppe_queen.GetHerHis] story. According to their reports, the countryside has been recently set abuzz with the rumors of a great warrior who cleft through several minor groups of bandits and outlaws that were pestering commonfolk for quite some time.\n\nAll of the descriptions of that virtuous person given by passing merchants and grateful villagers seem to point to [legendary_steppe_queen.GetFirstNameNoTooltip], who is still patiently waiting for my decision on [legendary_steppe_queen.GetHerHis] recruitment."
 gh_sarminian_events.0203.desc.dead: "It is just days later when my agents return to me after being tasked with verifying the validity of [legendary_steppe_queen.GetFirstNamePossessive] story. According to their reports, the countryside has been recently set abuzz with the rumors of a great warrior who cleft through several minor groups of bandits and outlaws that were pestering commonfolk for quite some time.\n\nAll of the descriptions of that virtuous person given by passing merchants and grateful villagers seem to point to [legendary_steppe_queen.GetFirstNameNoTooltip], who has unfortunately passed away before I could make my decision."
 gh_sarminian_events.0203.a: "[legendary_steppe_queen.GetSheHe|U] has proven [legendary_steppe_queen.GetHerselfHimself] beyond all reasonable doubt."
 gh_sarminian_events.0203.b: "[legendary_steppe_queen.GetFirstNameNoTooltip] has failed to convince me of [legendary_steppe_queen.GetHerHis] authenticity."
 gh_sarminian_events.0203.b.tt: "[legendary_steppe_queen.GetFirstName] leaves"
 gh_sarminian_events.0203.c: "A shame."
 gh_sarminian_events.0204.t: "Inconclusive Evidence"
 gh_sarminian_events.0204.desc: "An offer from a warrior as experienced as [legendary_steppe_queen.GetFirstName] claims [legendary_steppe_queen.GetHerselfHimself] to be sounds almost too good to be true, and I am determined to put [legendary_steppe_queen.GetHerHim] to the test before making my decision."
 gh_sarminian_events.0204.desc.prowess: "\n\nAlas, as our little mock duel progresses, I find myself thoroughly unable to accurately measure the level of [legendary_steppe_queen.GetFirstNamePossessiveNoTooltip] skill. [legendary_steppe_queen.GetSheHe|U] deflects most, if not all, of my attacks, and what I initially think are mistakes in [legendary_steppe_queen.GetHerHis] guard turn out to be feints or simply errors in my judgment. I am not untouchable myself either, as [legendary_steppe_queen.GetFirstNameNoTooltip] manages to land several glancing but equally stinging blows.\n\nWhen we finally disengage, I am still none the wiser about how skillful my opponent actually is."
 gh_sarminian_events.0204.desc.intrigue: "\n\nAlas, as my agents return to me to report on their findings regarding [legendary_steppe_queen.GetFirstNameNoTooltip], I am presented with a pittance of conflicting evidence that fails to reveal anything noteworthy about my enigmatic guest. [legendary_steppe_queen.GetSheHe|U] has neither been seen by local commonfolk nor can the traders remember anyone with a similar disposition, and the few accounts that do solidly point to [legendary_steppe_queen.GetHerHim] are of the most mundane nature.\n\nIt seems that my investigation has not been successful, and now I am already due to give [legendary_steppe_queen.GetFirstNameNoTooltip] my reply."
 gh_sarminian_events.0204.desc.dead: "As my agents return to me to report on their findings regarding [legendary_steppe_queen.GetFirstName], I am presented with a pittance of conflicting evidence that fails to reveal anything noteworthy about my enigmatic guest. [legendary_steppe_queen.GetSheHe|U] has neither been seen by local commonfolk nor can the traders remember anyone with a similar disposition, and the few accounts that do solidly point to [legendary_steppe_queen.GetHerHim] are of the most mundane nature.\n\nIt seems that my investigation has not been successful, and, with [legendary_steppe_queen.GetFirstNameNoTooltip] dead, it is bound to remain a mystery."
 gh_sarminian_events.0204.a: "I have seen enough, let [legendary_steppe_queen.GetHerHim] stay."
 gh_sarminian_events.0204.b: "It is too risky, dismiss them."
 gh_sarminian_events.0204.b.tt: "[legendary_steppe_queen.GetFirstName] leaves"
 gh_sarminian_events.0204.c: "A shame."
 gh_sarminian_events.0205.t: "Robbed by an Impersonating Thief"
 gh_sarminian_events.0205.desc: "It is still very early morning when I am woken by an unusual commotion outside. Just as I finish making myself decent and prepare to leave my room to investigate, a hesitant knocking reveals one of my servants, fidgeting nervously at the precipice of entering.\n\n'My [ROOT.Char.GetTitleTierName], it is [legendary_steppe_queen.GetFirstName]; I– [legendary_steppe_queen.GetSheHe|U] took away with some of your gold on a stolen horse!' they stutter.\n\n'Your $knight_culture_player_plural_no_tooltip_lowercase$, they have already ridden after [legendary_steppe_queen.GetHerHim] – but my [ROOT.Char.GetTitleTierName], it has been several hours since the theft took place – and I overheard them saying that the chances of catching [legendary_steppe_queen.GetFirstNameNoTooltip] are very slim,' the servant tentatively adds.\n\nMe? Robbed? By [legendary_steppe_queen.GetFirstNameNoTooltip]? Was [legendary_steppe_queen.GetSheHe] not supposed to be a veteran warrior eager to be in my service?"
 gh_sarminian_events.0205.a: "I– I think I need to sit down."
 gh_sarminian_events.0205.robbed: "[legendary_steppe_queen.GetFirstNameNoTooltip] has revealed [legendary_steppe_queen.GetHerHis] true colours and took off with your gold!"
 gh_sarminian_events.0206.t: "Murmurs of a Brazen Robbery"
 gh_sarminian_events.0206.desc: "As I walk through the streets of a local town, I inadvertently overhear some of the local gossip: unfaithful husbands, secret Magi cabals, minor landholders robbed by malefactors impersonating veteran warriors–\n\nAt the mention of the latter, I abruptly stop, remembering how, in the months prior, I had been approached by a similar individual myself. I dismissed them back then, but I could never have imagined that they were a thief seeking to ingratiate themselves with nobility to rob them blind."
 gh_sarminian_events.0206.a: "Seems like I have dodged an arrow here."