l_russian:

 gh_venture_company: "[Localize(Concatenate(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_venture_region_name_variable').GetFlagName,'_name'))]"

 gh_venture_events.0001.t: "Ответ покровителей"
 gh_venture_events.0001.desc_unchallenged_break_away: "Покровители прислали ответ: они согласились почти без сопротивления, не запросив цены и даже не устроив из этого ссоры. Было ли предприятие слишком мелким, чтобы бороться за него со мной, или у них не хватило духу — никто из них не счёл нужным мне сказать. \n\nКакова бы ни была причина, предприятию конец."
 gh_venture_events.0001.desc_gh_require_pay_to_end_venture: "Покровители, по-видимому, взвесили расходы и решили, что конец предприятия можно уладить за плату...\n\nПусть каждая доля будет выкуплена за справедливую сумму, и они передадут всё целиком мне и больше не будут чинить помех. Это дорого мне обойдётся сразу, но зато не останется ничего, о чём кто-либо мог бы спорить.\n\nПодтекст, если я откажусь, достаточно ясен: они готовы силой вернуть [realm.GetName]. Осуществят ли они свою угрозу на деле — другой вопрос..."
 gh_venture_events.0001.desc_gh_refuse_ending_venture: "Покровители не скрывают своих намерений. Грамота на [realm.GetName] принадлежит им, говорят они, и они силой вырвут предприятие из моих рук, если потребуется.\n\nОни не довольствуются тем, чтобы выступить против меня в одиночку. Моим собственным вассалам дано знать, что доли предприятия ждут любого из них, кто выступит против меня.\n\nЯ пока не знаю, сколько моих людей окажется на той стороне."
 gh_create_character_company_army_effect_tt: "[marcher_company_merchant.GetFirstName] получит [Concept('army','армию')|E] неизвестного размера"
 gh_venture_events.0001.a: "Хорошо. Дело сделано."
 gh_venture_events.0001.b: "Заплатить, сколько они просят."
 gh_venture_events.0001.c: "Я не буду платить."
 gh_venture_events.0001.d: "Тогда да будет война."
 gh_venture_events.0001.e: "Я подумаю ещё раз."
 end_story_cycle_gh_company_venture_tt: " [Localize(Concatenate(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_venture_region_name_variable').GetFlagName,'_name'))] заканчивается"

 gh_venture_events.0002.t: "Купец у моих дверей"
 gh_venture_events.0002.desc: "Купец по имени [merchant.GetFirstName] [Select_CString(merchant.IsFemale, 'оказалась', 'оказался' )] в бедственном положении после гибельного путешествия через [target_county.GetName]. Лишённ[Select_CString(merchant.IsFemale, 'ая', 'ый' )] товаров, монет и достоинства сочетанием плохих дорог и ещё худшей удачи, [merchant.GetSheHe] просит о помощи.\n\nУ меня нет особых обязательств перед эт[Select_CString(merchant.IsFemale, 'ой женщиной', 'им мужчином' )]. Но купцы болтают, и то, как я приму одного в несчастье, имеет свойство доходить до ушей других, всё ещё способных быть мне полезными."
 gh_venture_events.0002.a: "Помочь [merchant.GetFirstNameNoTooltip] встать на [merchant.GetHerHis] ноги."
 gh_venture_events.0002.b: "Я предложу кров, но не более того."
 gh_venture_events.0002.c: "Несчастье — не моя забота."
 gh_venture_events.0002.c.tt: "Отправить [merchant.GetFirstNameNoTooltip] ни с чем"
 #gh_venture_events.0002.d: "What goods remain? Perhaps we can come to an arrangement." #ASKIL NOTE: Will add when trade DLC drop if I don't forget

 gh_venture_events.0003.t: "Далеко от любых мест"
 gh_venture_events.0003.desc: "В мой двор прибыл[Select_CString(merchant.IsFemale, 'а', '' )] купец в состоянии изрядного замешательства. [merchant.GetFirstName] отправил[Select_CString(merchant.IsFemale, 'ась', 'ся' )] несколько месяцев назад в [merchant_destination.GetName], снаряжённ[Select_CString(merchant.IsFemale, 'ая', 'ый' )] для скромного путешествия и, по-видимому, располагавш[Select_CString(merchant.IsFemale, 'ая', 'ий' )] картой, которая в лучшем случае была плодом фантазии.\n\n[merchant.GetSheHe|U], по любому разумному подсчёту, находится примерно так далеко от [merchant_destination.GetName], как только возможно. [merchant.GetFirstNameNoTooltip], похоже, ещё не вполне это осознал[Select_CString(merchant.IsFemale, 'а', '' )] и попроси[Select_CString(merchant.IsFemale, 'а', '' )] у меня немного припасов и указаний, ожидая прибыть в течение недели."
 gh_venture_events.0003.a: "Помочь [merchant.GetFirstNameNoTooltip] и сказать [merchant.GetHerHim] правду."
 gh_venture_events.0003.b: "Это не моя забота. Указать [merchant.GetHerHim] на дорогу."
 gh_venture_events.0003.b.tt: "То, чего [merchant.GetFirstNameNoTooltip] не знает, не может причинить [merchant.GetHerHim] вреда"
 gh_venture_events.0003.c: "Может быть, я смогу найти [merchant.GetHerHim] применение здесь."

 gh_venture_events.0004.t: "Лица из родных краёв"
 gh_venture_events.0004.desc: "Группа мужчин и женщин [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] народа добралась до [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], неся с собой немногое, кроме одежды на плечах, и явную убеждённость, что я буду рад[Select_CString(ROOT.Char.IsFemale, 'а', '' )] их видеть.\n\nОни не совсем неправы. Это что-то значит — слышать говор старого языка без усилий, видеть знакомые лица среди толп [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Они просят лишь земли для поселения и позволения остаться. Обязан[Select_CString(ROOT.Char.IsFemale, 'а', '' )] ли я им этим в силу общей крови — вопрос, в котором я неожиданно для себя не уверен."
 gh_venture_events.0004.a: "Моему народу здесь всегда рады."
 gh_venture_events.0004.b: "Они могут поселиться, но должны мне за это заплатить."
 gh_venture_events.0004.c: "Здесь нет для них места."

 gh_venture_events.0005.t: "[merchant.GetWomanMan] из $gh_venture_company$"
 gh_venture_events.0005.desc: "Купец по имени [merchant.GetFirstName] предстал[Select_CString(merchant.IsFemale, 'а', '' )] [merchant.GetHerselfHimself] у моих ворот, неся печать $gh_venture_company$ и подобающую историю. [merchant.GetSheHe|U] говорит с лёгкой уверенностью [merchant.GetWomanMan], котор[Select_CString(merchant.IsFemale, 'ая', 'ый' )] интимно знает дела $gh_venture_company$ и приш[Select_CString(merchant.IsFemale, 'ла', 'ёл' )] просить аванс из средств, которые, по [merchant.GetHerHis] словам, должен [merchant.GetHerHim] человек из $gh_venture_company$, ставший с тех пор недосягаемым.\n\nВсё, что [merchant.GetSheHe] говорит, правдоподобно. И всё же что-то в [merchant.GetHerHis] манере кажется неправильным."
 gh_venture_events.0005.a: "$gh_venture_company$ чтит свои долги. Заплатить [merchant.GetHerHim]."
 gh_venture_events.0005.a.success: "Купец уходит удовлетворённым"
 gh_venture_events.0005.a.failure: "Монеты исчезли. Как и [merchant.GetSheHe]."
 gh_venture_events.0005.b: "У $gh_venture_company$ нет неоплаченных долгов. Убирайся."
 gh_venture_events.0005.b.success: "Мошенничество раскрыто прежде, чем [merchant.GetSheHe] успевает скрыться"
 gh_venture_events.0005.b.failure: "[merchant.GetSheHe|U] — тот, за кого [merchant.GetSheHe] себя выдаёт"

 gh_venture_events.0007.t: "Недоставленные письма"
 gh_venture_events.0007.desc: "В мой двор прибыл человек, посланный покровителями предприятия.\n\nНесколько писем, отправленных покровителями по нерешённым вопросам торговли и обязательств, остались без ответа. М[Select_CString(steward.IsFemale, 'оя', 'ой' )] [steward.GetCouncilTitle] [steward.GetFirstNameNoTooltip] теперь признал[Select_CString(steward.IsFemale, 'ась', 'ся' )] мне, что эта переписка никогда не доводилась до моего сведения. Покровители ждали ответов, о которых я не знал[Select_CString(ROOT.Char.IsFemale, 'а', '' )], что задолжал[Select_CString(ROOT.Char.IsFemale, 'а', '' )] им, и им надоело ждать."
 gh_venture_events.0007.a: "Уволить мо[Select_CString(steward.IsFemale, 'ою', 'его' )] [steward.GetFirstNameNoTooltip]. Это не может остаться безнаказанным."
 gh_venture_events.0007.a.tt: "Снять [steward.GetFirstNameNoTooltip] с должности и умилостивить покровителей"
 gh_venture_events.0007.b: "Компенсировать покровителям и уволить [steward.GetFirstNameNoTooltip]."
 gh_venture_events.0007.c: "Мой [steward.GetCouncilTitle] ответит мне наедине. И только."
 gh_venture_events.0007.c.tt: "Покровителям придётся удовлетвориться извинением"
 gh_venture_events.0007.d: "Это было несчастье, а не халатность. Я поручусь за [steward.GetFirstNameNoTooltip]."

 gh_venture_events.0008.t: "Весть от покровителей"
 gh_venture_events.0008.desc: "Человек, посланный покровителями предприятия, совершил путь до [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], неся письмо.\n\nУ покровителей есть интересы в [target_county.GetName], которые они не могут должным образом защитить, пока [target_county.GetHolder.GetTitledFirstName] остаётся его правителем. Они обратили взоры на [target_county.GetName] и видят в моём положении естественный инструмент для его приобретения."
 gh_venture_events.0008.a: "Я позабочусь об этом."
 gh_venture_events.0008.a.tt: "Взять на себя обязательство провести кампанию от имени покровителей"
 gh_venture_events.0008.b: "Здесь правлю я. Они могут подождать."
 gh_venture_events.0008.b.tt: "Отослать их человека; покровители это заметят"

 gh_venture_events.0009.t: "В добром расположении"
 gh_venture_events.0009.desc: "До меня дошла весть, что моё имя отзывается благосклонно среди покровителей предприятия. Как именно сложилась эта репутация, я не могу сказать с уверенностью, но их мнение о моём управлении возросло, а это немало.\n\nПо крайней мере, пока их письма будут приходить без угроз."
 gh_venture_events.0009.a: "Хорошо."

 gh_venture_events.0010.t: "В немилости"
 gh_venture_events.0010.desc: "До меня дошла весть, что моё имя отзывается недобро среди покровителей предприятия. Подробности их недовольства не были изложены прямо, но их мнение о моём управлении упало, и они позаботились о том, чтобы я об этом услышал.\n\nСледующее их письмо будет с угрозами. В этом я довольно уверен[Select_CString(ROOT.Char.IsFemale, 'а', '' )]."
 gh_venture_events.0010.a: "Лучше мне опередить это."
 gh_venture_events.0010.a.tt: "Предпринять шаги, чтобы исправить мнение покровителей, пока оно не ухудшилось"
 gh_venture_events.0010.a.success: "Вам удаётся улучшить их мнение"
 gh_venture_events.0010.a.failure: "Ваши усилия их не убеждают"
 gh_venture_events.0010.a.critical_failure: "Вы ухудшаете их мнение о вас"
 gh_venture_events.0010.b: "Пусть ворчат. Здесь правлю я."

 gh_venture_events.0011.t: "Лучше в его оценке"
 gh_venture_events.0011.desc: "До моего сведения дошло, что [vassal.GetTitledFirstName] делится мнениями о моём правлении со всяким, кто готов слушать. Суть этих мнений не лестна. [vassal.GetSheHe|U], по-видимому, изрядно обдумал[Select_CString(vassal.IsFemale, 'а', '' )] этот вопрос и приш[Select_CString(vassal.IsFemale, 'ла', 'ёл' )] к выводу, что [vassal.GetSheHe] правил[Select_CString(vassal.IsFemale, 'а', '' )] бы лучше на моём месте и, что более метко, что покровителям предприятия было бы лучше под [vassal.GetHerHis] управлением, чем под моим.\n\nМеня занимает не столько то, верит ли в это [vassal.GetFirstNameNoTooltip], сколько то, сколько других начинает верить, и есть ли у кого-либо из них ухо покровителей."
 gh_venture_events.0011.a: "Пусть [vassal.GetFirstNameNoTooltip] предстанет передо мной."
 gh_venture_events.0011.a.tt: "Прямо противостоять [vassal.GetFirstNameNoTooltip]"
 gh_venture_events.0011.a.success: "[vassal.GetFirstNameNoTooltip] передумывает говорить так открыто"
 gh_venture_events.0011.a.failure: "Противостояние лишь придаёт [vassal.GetFirstNameNoTooltip] смелости"
 gh_venture_events.0011.c: "Пусть [vassal.GetFirstNameNoTooltip] говорит."
 gh_venture_events.0011.d: "Написать покровителям прежде, чем это сделает [vassal.GetFirstNameNoTooltip]."

 gh_venture_events.0012.t: "Взгляд на книги"
 gh_venture_events.0012.desc: "Человек, посланный покровителями предприятия, прибыл с конкретной и нежеланной целью. Недавние доходы предприятия их не удовлетворили, и они послали кого-то понять почему. То, что они просят, с тонко завуалированной учтивостью официального запроса, — это доступ к моей книге учёта.\n\nДля покровителей не является чем-то чрезмерным просить об этом правителя, которого они назначили. Но от этого просьба не становится удобной."
 gh_venture_events.0012.a: "Пусть [auditor.GetFirstNameNoTooltip] увидит то, за чем [auditor.GetSheHe] приш[Select_CString(auditor.IsFemale, 'ла', 'ёл' )]."
 gh_venture_events.0012.a.tt: "Предоставить доступ к книге учёта и подчиниться проверке покровителей"
 gh_venture_events.0012.a.success: "Покровители удовлетворены тем, что показывает книга учёта"
 gh_venture_events.0012.a.failure: "Книга учёта вызывает больше вопросов, чем даёт ответов"
 gh_venture_events.0012.b: "Я представлю сводку. Сама книга учёта остаётся у меня."
 gh_venture_events.0012.b.success: "Покровители удовлетворены тем, что показывает книга учёта"
 gh_venture_events.0012.b.failure: "Книга учёта вызывает больше вопросов, чем даёт ответов"
 gh_venture_events.0012.c: "Мои счета — моё личное дело. Отослать [auditor.GetHerHim]."

 gh_venture_events.0013.t: "Удовлетворительный отчёт"
 gh_venture_events.0013.desc: "Человек, посланн[Select_CString(auditor.IsFemale, 'ая', 'ый' )] покровителями предприятия, завершил[Select_CString(auditor.IsFemale, 'а', '' )] проверку моих счетов и, по-видимому, не наш[Select_CString(auditor.IsFemale, 'ла', 'ёл' )] ничего, что могло бы их встревожить. [auditor.GetFirstNameNoTooltip] уходит с выдержанным удовлетворением того, кто приш[Select_CString(auditor.IsFemale, 'ла', 'ёл' )], ожидая проблемы, и был[Select_CString(auditor.IsFemale, 'а', '' )] её лишён.\n\nВслед приходит краткая записка, подтверждающая, что покровители пока довольны состоянием предприятия. Я не ожидаю, что эта проверка будет последней в своём роде, но на данный момент она пройдена."
 gh_venture_events.0013.a: "Хорошо. Обратно к работе."

 gh_venture_events.0014.t: "Покровители хотят большего"
 gh_venture_events.0014.desc: "Человек, посланн[Select_CString(auditor.IsFemale, 'ая', 'ый' )] покровителями предприятия, завершил[Select_CString(auditor.IsFemale, 'а', '' )] проверку, и [auditor.GetSheHe] не уш[Select_CString(auditor.IsFemale, 'ла', 'ёл' )] удовлетворённ[Select_CString(auditor.IsFemale, 'ой', 'ым' )]. [auditor.GetFirstNameNoTooltip] представляет свои выводы без церемоний: доходы предприятия недостаточны, и покровители ожидают большей доли от имеющейся прибыли, пока показатели не улучшатся до желаемых им.\n\nЦифра, которую называет [auditor.GetFirstNameNoTooltip], — не предложение."
 gh_venture_events.0014.a: "Я выполню их требования."
 gh_venture_events.0014.a.tt: "Согласиться повысить долю прибыли покровителей"
 gh_venture_events.0014.b: "Эти условия неприемлемы. Передайте покровителям, что я так сказал."
 gh_venture_events.0014.b.tt: "Отказать напрямую; это не останется незамеченным"
 gh_venture_events_0012_increase_profit_share_tt: "[Concept('gh_company_profits','Уровень прибыли')|E] покровителей повышена"

 gh_venture_events.0015.t: "Торговля изгнана"
 gh_venture_events.0015.desc: "Несколько купцов, действующих в моём предприятии, попросили аудиенции, и их жалоба знакома. Доля прибыли, причитающаяся покровителям предприятия, стала слишком обременительной, говорят они, и наиболее проворные из их собратьев уже начали уводить свои дела в другое место.\n\nЕсли это продолжится, доходы предприятия лишь упадут ещё больше."
 gh_venture_events.0015.a: "Купцы правы."
 gh_venture_events.0015.a.tt: "Оказать давление на долю покровителей; они воспримут это плохо"
 gh_venture_events.0015.b: "Я уверен[Select_CString(ROOT.Char.IsFemale, 'а', '' )], купцы приспособятся."
 gh_venture_events.0015.b.tt: "Отклонить жалобу; торговля пострадает от этого"

 gh_venture_events.0016.t: "Подорванная власть"
 gh_venture_events.0016.desc: "[noble.GetTitledFirstName] написал[Select_CString(noble.IsFemale, 'а', '' )] мне с протестом. Люди $gh_venture_company$, действующие в [target_county.GetName], вели переговоры о контрактах и улаживали обязательства без [noble.GetHerHis] ведома, и местные это заметили.\n\n[noble.GetFirstNameNoTooltip] хочет, чтобы эта практика прекратилась."
 gh_venture_events.0016.a: "Я обуздаю их."
 gh_venture_events.0016.b: "Признать жалобу и не более того."

 gh_venture_events.0017.t: "Приз, приведённый в порт"
 gh_venture_events.0017.desc: "Купеческий капитан на службе $gh_venture_company$ прибыл[Select_CString(captain.IsFemale, 'а', '' )] в [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] с неожиданным призом на буксире. [captain.GetFirstNameNoTooltip] перехватил[Select_CString(captain.IsFemale, 'а', '' )] пиратское судно и прив[Select_CString(captain.IsFemale, 'ела', 'ёл' )] его, вместе с грузои и того, что осталось от команды, предо мной, чтобы решить их судьбу."
 gh_venture_events.0017.a: "Корабль и груз принадлежат [captain.GetFirstNameNoTooltip]. Это заслуженная награда."
 gh_venture_events.0017.b: "Продать груз и повесить команду."
 gh_venture_events.0017.c: "Продать груз и оставить их в покое."

 gh_venture_events.0018.t: "Жалоба из-за границы"
 gh_venture_events.0018.desc: "Делегация иностранных купцов прибыла в [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], неся документы и жалобу. $gh_venture_company$, по их словам, нарушила условия, согласованные в [foreign_realm.GetName], и они пришли ко мне, как к назначенно[Select_CString(ROOT.Char.IsFemale, 'й', 'му' )] главе предприятия, чтобы я за это ответил[Select_CString(ROOT.Char.IsFemale, 'а', '' )].\n\nЗнают ли покровители о том, что эта делегация отправлена к моим дверям, — совсем другой вопрос."
 gh_venture_events.0018.a: "Договор — дело покровителей. Обращайтесь к ним."
 gh_venture_events.0018.b: "Компенсировать им и положить этому конец."
 gh_venture_events.0018.c: "Их ссора — с теми, кто им навредил, а не со мной."

 gh_venture_events.0019.t: "Недовольство в [target_county.GetName]"
 gh_venture_events.0019.desc: "Жители [target_county.GetName] дали знать о своём недовольстве. Практики $gh_venture_company$ в графстве породили негодование среди местного населения, и то, что началось с ропота, разрослось настолько, что достигло моих ушей.\n\nОни не просят. Они жалуются в надежде, что кто-то, обладающий властью над людьми $gh_venture_company$, прислушается."
 gh_venture_events.0019.a: "Обуздать людей $gh_venture_company$ в [target_county.GetNameNoTier]."
 gh_venture_events.0019.a.tt: "Вмешаться напрямую в защиту населения"
 gh_venture_events.0019.b: "Установить зачинщиков этого недовольства."
 
 gh_venture_events.0020.t: "Процветание в [target_county.GetName]"
 gh_venture_events.0020.desc: "Донесения из [target_county.GetName] в последнее время необычайно обнадёживающи. Люди $gh_venture_company$ вели там свои дела хорошо, и регион заметно разбогател благодаря этому."
 gh_venture_events.0020.a: "Хорошо. Пусть продолжают."


 gh_venture_events.0021.t: "Война компании"
 gh_venture_events.0021.desc: "[defiant_ruler.GetTitledFirstName] отказал[Select_CString(defiant_ruler.IsFemale, 'ась', 'ся' )] уступить $gh_venture_company$. В ответ покровители предприятия собрали наёмную армию во главе с [company_merchant.GetTitledFirstName]. Поддержка одной из сторон, несомненно, принесла бы мне пользу, хотя ставка на неверную сторону может дорого мне стоить.\n\nОбе стороны написали, прося моей поддержки, и я не могу откладывать ответ дольше."
 gh_venture_events.0021.a: "Я на стороне компании."
 gh_venture_events.0021.b: "[defiant_ruler.GetFirstNameNoTooltip] прав[Select_CString(defiant_ruler.IsFemale, 'а', '' )], отказываясь."
 gh_venture_events.0021.c: "Это не моя ссора."

 gh_venture_events.0022.t: "Недовольные покровители"
 gh_venture_events.0022.desc: "Покровители недовольны тем, как я управляю $gh_venture_company$. Чем именно я их настроил[Select_CString(ROOT.Char.IsFemale, 'а', '' )] против себя, я могу лишь догадываться, но они пообщались между собой, и разговор обратился к тому, не лучше ли другому человеку держать грамоту, чем держал[Select_CString(ROOT.Char.IsFemale, 'а', '' )] её я.\n\nПока ничего не решено — или ничего, о чём они сочли нужным мне сообщить. Грамота даёт им право назначать своего представителя и так же смещать его, и она обязывает их не выслушивать от меня возражений, прежде чем они сделают и то, и другое."
 gh_venture_events.0022.a: "Меня не так легко заменить!"
 gh_venture_events.0022.b: "Возможно, пора отойти в сторону..."

 gh_venture_events.0023.t: "Ультиматум"
 gh_venture_events.0023.desc: "Покровители предприятия прислали мне свои условия. Мне приказано отказаться от $gh_venture_company$ до конца сезона, или они выступят против меня с наёмными солдатами. Они уже начали писать моим вассалам.\n\nНекоторым из этих вассалов, подозреваю, не потребуется много убеждений."
 gh_venture_events.0023.a: "Пусть приходят."
 gh_venture_events.0023.b: "Предприятие того не стоит."

