 # --- Effect tooltip on the war goal ---
 gh_company_venture_seizure_every_defender: "[This.GetShortUIName|U] loses every [title|E] to [attacker.GetShortUIName]"

 # --- Victory (defender loses) ---
 gh_company_venture_seizure_victory_desc: "[attacker.GetShortUIName|U] takes every [title|E] held by [defender.GetShortUINameNotMe] and by every [vassal|E] who stood with [defender.GetHerHim] in the war."
 gh_company_venture_seizure_victory_desc_attacker: "You take every [title|E] held by [defender.GetShortUINameNotMe] and by every [vassal|E] who stood with [defender.GetHerHim] in the war."
 gh_company_venture_seizure_victory_desc_defender: "[attacker.GetShortUIName|U] takes every one of your [titles|E] and those of every [vassal|E] who stood with you."

 # --- Defeat (defender wins) ---
 gh_company_venture_seizure_defeat_desc: "[defender.GetShortUIName|U] keeps [defender.GetHerHis] [realm|E], and the patrons abandon the venture."
 gh_company_venture_seizure_defeat_desc_attacker: "[defender.GetShortUIName|U] keeps [defender.GetHerHis] [realm|E], and the patrons abandon the venture."
 gh_company_venture_seizure_defeat_desc_defender: "You keep your [realm|E], and the patrons abandon the venture."

 # --- White peace (fallback) ---
 gh_company_venture_seizure_white_peace_desc: "The patrons withdraw their claim and abandon the venture."

