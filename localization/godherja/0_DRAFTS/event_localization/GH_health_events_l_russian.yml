l_russian:

 gh_health.1000.t:0 "[SCOPE.Custom('EventTitleDisease')]: Снова в здравии"
 gh_health.1000.desc:0 "Последние несколько дней силы возвращаются ко мне, а мысли вновь стали ясными."
 gh_health.1000.a:0 "Я [Select_CString(ROOT.Char.IsFemale, 'рада', 'рад')] снова быть [Select_CString(ROOT.Char.IsFemale, 'здоровой', 'здоровым')]."
 
 gh_health.1010.t:0 "[SCOPE.Custom('EventTitleDisease')]: Чума Каширията"
 gh_health.1010.travel.t:0 "[SCOPE.Custom('EventTitleDisease')]: Страх на берегах реки"
 gh_health.1010.desc:0 "Поначалу сыпь доставляла лишь небольшое неудобство, но, когда начали выпадать волосы, а тело слабело день ото дня, я всё ещё [Select_CString(ROOT.Char.IsFemale, 'надеялась', 'надеялся')], что недуг отступит."
 gh_health.1010.end.desc:0 "\n\nЯ с трудом припоминаю, сколько времени прошло с тех пор. Моё тело разрушается с каждым мгновением…"
 gh_health.1010.court_physician.desc:0 "\n\n«К сожалению, эта сыпь — верный признак айронойской проказы. Без лечения она крайне опасна»."
 gh_health.1010.a:0 "[ROOT.Char.GetFaith.HealthGodName], умоляю, дай мне силы преодолеть это."
