 ##########
 # EVENTS #
 ##########
 gh_search_in_library.0001.t: "Поиск знаний"
 gh_search_in_library.0001.intro: "Если я собираюсь посвятить свое время учебе, мне следует выбрать предмет и посмотреть, какие знания могут дать эти рукописи."
 gh_search_in_library.0001.desc_tiny_library: "\n\nЗдесь хранится лишь скромное количество трудов — хрупкая горстка томов и свитков, собранных в одном месте. Выбор ограничен, но даже в узком ассортименте может скрываться нечто ценное."
 gh_search_in_library.0001.desc_small_library: "\n\nКоллекция не огромна, но и не скудна. Предо мной лежит разумный выбор предметов, достаточный для тщательного обдумывания."
 gh_search_in_library.0001.desc_medium_library: "\n\nПолки содержат достойный выбор трудов. Здесь есть разнообразие и, вероятно, глубокая суть."
 gh_search_in_library.0001.desc_large_library: "\n\nРяд за рядом полки тянутся по всей палате, заполненные томами и свитками многих авторов. Одно лишь широкое разнообразие предметов требует размышлений."
 gh_search_in_library.0001.desc_enormous_library: "\n\nКоллекция громадна, ее полки тяжелы от накопленных знаний. Диапазон тем широк, и глубина каждой из них может оказаться значительной."
 gh_search_in_library.0001.a: "Искать по этой теме."
 gh_search_in_library.0001.b: "Я [Select_CString(ROOT.Char.IsFemale, 'передумала', 'передумал' )]..."
 gh_search_in_library.0001.c: "На сегодня хватит."
 gh_search_in_library.0001.c.tt: "Вы завершаете свои занятия на сегодня."
 
 gh_search_in_library.0002.t: "Поиск знаний"
 gh_search_in_library.0002.desc_first: "Труды перед мной закрыты и непотревожены. Их содержание остается совершенно неизвестным, и ничего еще не было заучено на память.\n\nРешение зависит исключительно от того, уделю ли я им свое время вообще."
 gh_search_in_library.0002.desc_second: "Я всерьез принимаюсь за учебу и начинаю прорабатывать доступные записи. Страницы читаются внимательно, и первые части нескольких текстов остались позади.\n\nОхвачен скромный объем, достаточный для того, чтобы выйти за рамки простого любопытства."
 gh_search_in_library.0002.desc_third: "Чтение продолжается без перерыва. Один труд сменяет другой, и я уверенно продвигаюсь по их страницам.\n\nЗначительная часть материала изучена, и потраченные часы очевидны по возрастающему весу того, что я [Select_CString(ROOT.Char.IsFemale, 'усвоила', 'усвоил' )]."
 gh_search_in_library.0002.desc_fourth: "Я посвящаю большую часть дня учебе, переходя от текста к тексту с постоянной концентрацией. Страница за страницей читаются целиком, без лишней траты времени между ними.\n\nСущественный объем трудов изучен, и охват прочитанного мной весьма значителен."
 gh_search_in_library.0002.desc_fifth: "Большая часть дня поглощена учебой. Я остаюсь с рукописями часами напролет, прорабатывая их подробно и вдумчиво.\n\nК тому времени, как я наконец поднимаюсь, я [Select_CString(ROOT.Char.IsFemale, 'прочла', 'прочел' )] множественные тексты и [Select_CString(ROOT.Char.IsFemale, 'усвоила', 'усвоил' )] исключительный объем знаний для одного дня."
 gh_search_in_library.0002.desc_sixth: "Я отказываюсь останавиться, когда впервые подступает усталость. Свет меркнет, но я остаюсь с записями, продолжая читать от одного текста к другому, не давая себе отдыха.\n\nНевероятный объем был прочитан. То, чего хватило бы большинству, давно оставлено позади."
 gh_search_in_library.0002.desc_seventh: "Я продолжаю читать далеко за пределами благоразумия. Мои глаза горят, а мысли напряжены под тяжестью стольких страниц, но я продолжаю перелистывать их.\n\nОгромное количество материала прошло передо мной сегодня, куда больше, чем я изначально [Select_CString(ROOT.Char.IsFemale, 'планировала', 'планировал' )] осилить."
 gh_search_in_library.0002.desc_eighth: "Я полностью отдаюсь этому занятию, читая до тех пор, пока само время не теряет четкость. Труд за трудом принимается, изучается и откладывается только тогда, когда тщательно пройден.\n\nПод конец я [Select_CString(ROOT.Char.IsFemale, 'довела', 'довел' )] себя до пределов выносливости и [Select_CString(ROOT.Char.IsFemale, 'прочла', 'прочел' )] огромную долю того, что здесь доступно."
 gh_search_in_library.0002.a: "Искать другую тему."
 gh_search_in_library.0002.b: "Я могу продолжать..."
 gh_search_in_library.0002.b.tt: "Вы пытаетесь узнать больше сегодня."
 gh_search_in_library.0002.c: "На сегодня хватит."
 gh_search_in_library.0002.c.tt: "Вы завершаете свои занятия на сегодня."
 
 gh_search_in_library.0002.d: "#N Текст будет моим.#!"
 gh_search_in_library.0002.d.tt: "Вы пытаетесь украсть #high [Localize(Concatenate(GetPlayer.MakeScope.Var('gh_attempt_to_buy_book_in_collection').GetFlagName, '_title'))]#!."
 
 gh_search_in_library.0002.d.tt.success: "Вы успешно украли [Localize(Concatenate(GetPlayer.MakeScope.Var('gh_attempt_to_buy_book_in_collection').GetFlagName, '_title'))]."
 gh_search_in_library.0002.d.tt.failure_small: "Вас поймали"
 gh_search_in_library.0002.d.tt.failure_death: "Вас поймали и казнили"
 gh_search_in_library.0002.d.tt.failure_banned: "Вас поймали и отпустили"
 gh_search_in_library.0002.d.tt.failure_prison: "Вас заточили в тюрьму"
 gh_search_in_library.0002.d.tt.prevented_from_entering_library: "#N Вам больше не дозволено входить в места учёбы за пределами вашей державы.#!"
 

 add_collection_of_knowledge_temporary_bonus_effect.tt.success: "Усвоены знания во время чтения"
 add_collection_of_knowledge_permanent_skill_bonus_effect.tt.success: "Навык улучшен"
 add_collection_of_knowledge_permanent_arcana_bonus_effect.tt.success: "Получено #P +1#! @skill_arcana_icon![Concept('arcana','арканы')|E] во время чтения" 

 gh_search_in_library.0003.t: "Помещено в коллекцию"
 gh_search_in_library.0003.desc: "[gh_book_holder.MakeScope.Var('gh_transfer_book_to_collection').Artifact.GetName] теперь будет храниться и беречься в [gh_book_holder.GetCurrentLocation.GetTitle.GetNameNoTier]\n\nЗдесь его можно будет читать, переписывать и возвращаться к нему в последующие годы."
 gh_search_in_library.0003.a: "Пусть остается здесь."

 gh_search_in_library.0004.t: "Копия прибыла"
 gh_search_in_library.0004.desc: "Копия [Localize(Concatenate(GetPlayer.MakeScope.Var('gh_attempt_to_buy_book_in_collection').GetFlagName, '_title'))], которую я [Select_CString(ROOT.Char.IsFemale, 'заказала', 'заказал' )], наконец завершена и доставлена. Свежие чернила все еще видны на страницах, а рука переписчика точно следовала оригиналу со всем вниманием.\n\nТруд теперь лежит передо мной, готовый к чтению и изучению, когда я сочту нужным."
 gh_search_in_library.0004.a: "Наконец-то."