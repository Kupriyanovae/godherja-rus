l_russian:
  clique.0005.t: "Вакантная должность"
  clique.0005.desc: "Меня известили о прискорбном событии, случившемся в нашей славной организации, — кончине [previous_holder_character.GetTitledFirstName], одного из наших высокопоставленных членов. Это одновременно и тяжкий удар, и прекрасная возможность. Со смертью [Select_CString(previous_holder_character.IsFemale, 'предшественницы', 'предшественника')] открывается шанс назначить на должность нового, более верного чиновника ради блага меня самого и моей политической фракции. Однако здесь я должен действовать осмотрительно, ибо даже тень излишнего пристрастия может ослабить нас, а не укрепить.\n\nМне также следует учесть, что любые обещания, данные при жизни [Select_CString(previous_holder_character.IsFemale, 'предыдущей владелице', 'предыдущему владельцу')] касательно выбора преемника, лучше сдержать, ибо нарушить их было бы не к моей чести. В конечном счёте решение за мной, [ROOT.Char.GetTitledFirstName], будь оно во благо или во вред."
  clique.0005.a: "Новый чиновник из фракции [previous_holder_character.GetFirstName] [Select_CString(previous_holder_character.IsFemale, 'вероятнее всего сохранит', 'вероятнее всего сохранит')] мир."
  clique.0005.b: "Хотя это и может разозлить некоторых, наиболее подходящим здесь будет союзник моей фракции."
  clique.0005.c: "Пусть члены организации сами сделают свой выбор, ибо я не желаю вмешиваться."
  clique.0005.d: "Должность должна перейти ко мне, хотя многие осудить меня за это кажущееся злоупотребление властью."
  clique.0005.e: "Я не [Select_CString(ROOT.Char.IsFemale, 'нарушительница', 'нарушитель')] клятв и сдержу свои прежние обещания назначить [clique_appointed_heir.GetFirstName]."