l_russian:
  lawless_succession.0001.t: "Право сильного"
  lawless_succession.0001.desc: "Уже несколько месяцев мы с [recipient.GetFirstName] всё чаще расходились во мнениях. Оскорбление за оскорблением — и наши отношения ухудшались, пока не испортились до такой степени, что молва уже предсказывает, что мы скоро сойдёмся в схватке — и молва права.\n\nПосле последнего ожесточённого спора я [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил')] вызвать [recipient.GetFirstName] на дуэль, которая раз и навсегда уладит наши разногласия. К [Select_CString(recipient.IsFemale, 'её', 'его')] чести, [Select_CString(recipient.IsFemale, 'она', 'он')] приняла вызов. Я слишком долго терпел [Select_CString(recipient.IsFemale, 'её', 'его')] слабое правление — теперь настал мой час подняться и взять судьбу в свои руки!"
  lawless_succession.0001.a: "Покончим с этим поскорее!"
  lawless_succession.0012.a: "Покончим с этим поскорее!"

  lawless_succession.0011.t: "Плоды победы"
  lawless_succession.0011.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'одержала', 'одержал')] победу. Когда мой противник падает наземь, толпа зрителей на мгновение замирает, а затем разражается бурными аплодисментами. Я [Select_CString(ROOT.Char.IsFemale, 'доказала', 'доказал')], что я — сильный лидер, способный вести свою команду и помощников к новым вершинам богатства и славы. Без сомнения, их приветствия обращены к добыче, а не ко мне. Но пока что они плывут со мной."
  lawless_succession.0011.a: "Мы все разбогатеем!"

  lawless_succession.0021.t: "Ответ труса"
  lawless_succession.0021.desc: "Мой вызов [Select_CString(ROOT.Char.IsFemale, 'был отвергнут', 'был отвергнут')]. Трус, который теперь стоит во главе флота, [Select_CString(recipient.IsFemale, 'отказалась', 'отказался')] доказать свою силу. Тем самым [Select_CString(recipient.IsFemale, 'она', 'он')] признала, что я сильнее.\n\nИ потому я оставляю этого глупца позади и выбираю свой собственный путь, ведя свои флоты к прибыли под моим собственным именем. Ибо слабак не может править на волнах."
  lawless_succession.0021.a: "Я — могу."

  lawless_succession.0022.t: "Беззубый зверь"
  lawless_succession.0022.desc: "Вражда между [recipient.GetFirstName] и [actor.GetFirstName] переросла в горькую и раздирающую распрю, которая уже грозит расколоть державу на части. После месяцев взаимных провокаций и оскорблений [actor.GetFirstName] [Select_CString(actor.IsFemale, 'вызвала', 'вызвал')] своего соперника на дуэль, чтобы раз и навсегда уладить разногласия.\n\nОднако в жалком проявлении слабости [recipient.GetFirstName] [Select_CString(recipient.IsFemale, 'решила', 'решил')] трусливо уклониться и отказаться! Сторонники [actor.GetFirstName] позаботились о том, чтобы этот факт стал известен далеко и широко, и больше не присягают на верность своему бывшему сюзерену.\n\nЕсли я хочу отделиться от [actor.GetFirstName], сейчас самое время..."
  lawless_succession.0022.a: "Жалко! Мне лучше быть самим по себе."
  lawless_succession.0022.b: "У меня нет причин покидать службу [recipient.GetFirstName]."

  gh_pirate.0002.t: "Слабое звено"
  gh_pirate.0002.desc: "Со смертью [previous_holder.GetName] я [Select_CString(ROOT.Char.IsFemale, 'осталась', 'остался')] во главе [Select_CString(previous_holder.IsFemale, 'её', 'его')] шайки грабителей, воров и разбойников, а также немалого флота галер для разбоя на море. Разумеется, учитывая довольно стихийный характер нашего маленького сборища, вряд ли я могу рассчитывать на их верность, основанную на каком-либо чувстве законной власти или почтении к авторитету. Нет, здесь мы следуем только за сильным, и если я хочу, чтобы моя держава не распалась, я должен эту силу [Select_CString(ROOT.Char.IsFemale, 'продемонстрировать', 'продемонстрировать')].\n\n#N Если через 5 лет у вас не будет как минимум 15 доблести и 3 уровня славы, ваша держава распадётся, а ваши вассалы станут независимыми, хотя вы также получите претензии на их земли, если пожелаете отомстить. Через четыре года вы получите ещё одно предупреждение, напоминающее об этом.#!"
  gh_pirate.0002.a: "Моё морское право по рождению!"

  gh_pirate.0003.t: "Смертельные течения под поверхностью"
  gh_pirate.0003.desc: "Хотя прошло уже несколько лет со смерти [previous_holder.GetName], мои вассалы до сих пор полностью не признали мою власть. Каждый день новый акт неповиновения грозит разрушить и без того хрупкие узы, скрепляющие эту весёлую шайку воров и пиратов. Уже сейчас сильнейшие из моих вассалов, вероятно, начинают манёвры, чтобы стать полностью независимыми капитанами, и если я продолжу не проявлять силу, они, скорее всего, осуществят свои планы. Если ничего не изменится, срок моего капитанства будет измеряться месяцами, а не годами.\n\n#N Если через год у вас не будет как минимум 15 доблести и 3 уровня славы, ваша держава распадётся, а ваши вассалы станут независимыми, хотя вы также получите претензии на их земли, если пожелаете отомстить. Это ваше последнее предупреждение#!"
  gh_pirate.0003.a: "И не смейте!"

  gh_pirate.0005.t: "Достойный адмирал"
  gh_pirate.0005.desc: "Прошло много тревожных лет со смерти [previous_holder.GetName], но наконец-то я начинаю чувствовать себя уверенно в своей власти. Мои подчинённые больше не демонстрируют так открыто свою непокорность, и мне кажется, я начинаю улавливать самые слабые намёки на уважение с их стороны. Хотя мятеж, очевидно, всё ещё не исключён для банды коварных морских дьяволов, каковыми они являются, мне больше не нужно беспокоиться о том, что весь флот восстанет и уплывёт искать собственного счастья.\n\n#P Достигнув как минимум 15 доблести и 3 уровня славы, вы продемонстрировали свою власть. Хотя обычные восстания всё ещё могут случаться, ваши вассалы больше не будут становиться независимыми автоматически.#!"
  gh_pirate.0005.a: "Всё так, как и должно быть."

  gh_pirate.0006.t: "Флот распадается"
  gh_pirate.0006.desc: "Сегодня я [Select_CString(ROOT.Char.IsFemale, 'проснулась', 'проснулся')] без флота — или, по крайней мере, без большей его части. Мои личные корабли и те капитаны, что служат непосредственно под моим началом, остались верны, но остальные разбойники и воры под моим командованием предпочли уплыть на поиски собственного счастья, оставив меня кипеть от злости и строить планы в одиночестве.\n\n#N Вам не удалось набрать как минимум 15 доблести и 3 уровня славы, поэтому ваши вассалы покинули вашу державу, хотя теперь у вас есть претензии на их земли, если вы пожелаете отомстить.#!"
  gh_pirate.0006.a: "Они ещё не видели последний раз!"

  gh_pirate.0007.t: "Перемена судьбы"
  gh_pirate.0007.desc: "С моим возвращением к более традиционным методам правления мои вассалы начинают становиться спокойнее и удовлетворённее. Хотя некоторые всё ещё могут призывать к восстанию, по крайней мере, не все теперь угрожают открытым мятежом. Теперь я наконец могу вздохнуть свободно и впервые не беспокоиться о том, что моей власти бросят прямой вызов."
  gh_pirate.0007.a: "Так будет лучше"

  gh_pirate.0001.t: "Пощада ограбленным"
  gh_pirate.0001.desc: "Плывя на моём корабле, мы заметили вдалеке небольшое торговое судно, которое, заметив нас, сразу же отвернуло. Однако мой корабль гораздо быстрее их, а команда всегда жаждет новой добычи. Нападение на них, конечно, принесёт золото, но это может быть и рискованно, так как на торговом судне наверняка есть охрана. Конечно, я могу просто позволить судну пройти, так как преследование и атака могут не стоить затраченных усилий."
  gh_pirate.0001.a: "За золото и славу!"
  gh_pirate.0001.a.success: "Я [Select_CString(ROOT.Char.IsFemale, 'успешно граблю', 'успешно граблю')] корабль"
  gh_pirate.0001.a.failure: "Моя атака отбита"
  gh_pirate.0001.b: "Позвольте команде идти без меня."
  gh_pirate.0001.b.success: "Им удаётся набег"
  gh_pirate.0001.b.failure: "Им не удаётся захватить корабль"
  gh_pirate.0001.c: "Это явно ловушка, не нападайте."
  gh_pirate.0001.d: "Оставьте их, не стоит того."
  gh_pirate.0001.e: "Мы должны действовать с осторожностью"

  gh_pirate_decisions.0001.t: "Зов моря"
  gh_pirate_decisions.0001.desc: "После месяцев торгов с наёмниками, распространения слухов о том, что мне нужна команда, и прочих приготовлений[SelectLocalization(GetPlayer.HasTrait(GetTrait('greedy').Self),'— всё время пытаясь сделать это как можно дешевле—',',')] я наконец [Select_CString(ROOT.Char.IsFemale, 'собрала', 'собрал')] [SelectLocalization(GetPlayer.HasTrait(GetTrait('arrogant').Self), 'флот, достойный такого великого правителя, как я', 'подходящий флот')].[SelectLocalization(LessThanOrEqualTo_int32(GetPlayer.GetAIHonor,'(int32)-50'), ' Обдирание нескольких глупцов до нитки, безусловно, помогло сократить некоторые расходы.','')] Некоторые при моём дворе, похоже, сомневаются в моих планах, [SelectLocalization(LessThanOrEqualTo_int32(GetPlayer.GetAICompassion,'(int32)-50'), 'но после того, как я [Select_CString(ROOT.Char.IsFemale, 'показала', 'показал')] на примере одного из противников, я больше не слышал никаких возражений', 'но я [Select_CString(ROOT.Char.IsFemale, 'остаюсь', 'остаюсь')] безразличен к их нежеланию')].\n\nЯ уже чувствую вкус морской пены, славы и [SelectLocalization(GetPlayer.HasTrait(GetTrait('greedy').Self),'золота — так много золота!','золота')]. [SelectLocalization(LessThanOrEqualTo_int32(GetPlayer.GetAICompassion,'(int32)-50'), 'Я окрашу пляжи моря в красный цвет от берега до берега!','И так начинается моё великое приключение...')]"
  gh_pirate_decisions.0001.a: "Время поднять паруса!"
  gh_pirate_decisions.0001.a.cruel: "Пойдём убивать торговцев!"
  gh_pirate_decisions.0001.a.greedy: "Я буду чертовски богат!"

  gh_pirate_decisions.00012.t: "Более простая жизнь"
  gh_pirate_decisions.0002.desc: "Долго мы с моей командой опустошали эти воды, забирая всё, что могли или хотели, у менее удачливых. Но дни и недели грабежей, не говоря уже о постоянном страхе оказаться между молотом и наковальней, смягчили мой взгляд на жизнь. Я [Select_CString(ROOT.Char.IsFemale, 'разделила', 'разделил')] оставшуюся добычу между командой и [Select_CString(ROOT.Char.IsFemale, 'распустила', 'распустил')] свой флот.\n\nЖители моих земель уже вздыхают с облегчением, и я вместе с ними. Будет приятно насладиться чем-то вроде отдыха и покоя."
  gh_pirate_decisions.0002.a: "Мои дни пиратства подошли к концу..."

  gh_pirate.0031.t: "[Select_CString(ROOT.Char.IsFemale, 'Королева', 'Король')] пиратов"
  gh_pirate.0031.desc: "Мои бесчинства бесчисленны, а мои злодеяния невозможно перечислить, и мои верные команды ликуют от добычи, которую они получили под моим командованием. Моё имя уже шепчут по всем уголкам Эраса. Разбойник, пират, вор — этими словами и многими другими меня описывают. Но по мере того, как моя дурная слава распространялась, в их речи появилось новое слово: [Select_CString(ROOT.Char.IsFemale, 'Королева', 'Король')] пиратов.\n\nХотя мы относимся к этому титулу как к шутке, сегодня мои команды и я [Select_CString(ROOT.Char.IsFemale, 'устроили', 'устроил')] шуточную коронацию. Стоя на гребне холма с видом на защищённую бухту, на мою голову был водружён золотой обруч, захваченный у какого-то принца или другого во время уже почти забытого набега, на виду у моего флота, стоящего на якоре передо мной. Возможно, не совсем обычная коронация, но она вполне подходит."
  gh_pirate.0031.a: "Я уже представляю, как менестрели поют об этом дне..."