 gh_fund_inspiration.1012.t: "$personal_inspiration.title$: воплощение замысла"
 gh_fund_inspiration.1012.desc: "После многих дней тяжкого труда работа завершена. Горн остыл, инструменты убраны, и я наконец могу отступить на шаг и взглянуть на то, что мои руки привнесли в этот мир.\n\n"
 gh_fund_inspiration.1012.common: "Если ничего иного, то хотя бы ценный опыт."
 gh_fund_inspiration.1012.masterwork: "Добротная работа, хоть и не семейная реликвия."
 gh_fund_inspiration.1012.famed: "Вот этим действительно можно гордиться."
 gh_fund_inspiration.1012.illustrious: "Моё упорство вознаграждено стократно!"

 gh_fund_inspiration.1013.t: "$personal_inspiration.title$: завершение"
 gh_fund_inspiration.1013.desc: "Со смертью [dead_personal_inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] то, над чем [Select_CString(dead_personal_inspiration_owner.IsFemale, 'она', 'он' )] [Select_CString(dead_personal_inspiration_owner.IsFemale, 'работала', 'работал' )] последние несколько месяцев, навсегда останется незавершённым.\n\nХотя бо́льшая часть вложенных в этот замысел денег давно потрачена, кое-что ещё можно спасти и вернуть часть затрат."
 gh_fund_inspiration.1013.a: "Горе мне!"
 gh_fund_inspiration.1013.a.tt: "[Concept('personal_inspiration','Личное вдохновение')|E] персонажа [dead_personal_inspiration_owner.GetTitledFirstName] отменено"

 gh_fund_inspiration.1014.t: "$personal_inspiration.title$: завершение"
 gh_fund_inspiration.1014.desc: "Я плыву сквозь кольца тьмы, и каждое затягивает меня всё глубже под чернильную гладь забвения. Что я [Select_CString(ROOT.Char.IsFemale, 'делала', 'делал' )]? Не помню. Какому делу служили мои руки, что я так тоскую по своим трудам?"
 gh_fund_inspiration.1014.a: "Как до этого дошло?"
 gh_fund_inspiration.1014.a.tt: "[Concept('personal_inspiration','Личное вдохновение')|E] ([GetPlayer.GetUIName]) отменено"

 gh_fund_inspiration.2001.t: "$fund_inspiration.title$ Сущность и подражание"
 gh_fund_inspiration.2001.desc: "«[ROOT.Char.GetLadyLord|U], прошу, взгляните на эти слепки».\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] раскладывает передо мной на столе несколько гипсовых масок; одни лица на них узнать легче, чем другие.\n\n«Они изображают могучих героев и вождей древности, ваше высочество. Надев маску с их обликом, можно притязать на часть их наследия и на всё, что с ним связано».\n\n[inspiration_owner.GetSheHe|U] сцепляет руки за спиной. «Если ваша светлость пожелает, я могу создать маску в любом выбранном вами образе»."
 gh_fund_inspiration.2001.otached: "Я стану вторым Отачедом!"
 gh_fund_inspiration.2001.otached.tt: "#EMP Отачед#! — легендарный ольтенский военачальник и завоеватель, основатель [Concept('otachedian_empire','Отачедской империи')|E] и владелец мифического [Concept('iorne_seld','Меча Эпох')|E]. Обрушившись на [Concept('kashirya','Каширию')|E] со своей огромной [Concept('iorne_horde','ордой')|E], он создал, пожалуй, величайшую империю, какую когда-либо знал этот край.\n"
 gh_fund_inspiration.2001.otached_bonus: "Ваш артефакт может получить модификатор правления"
 gh_fund_inspiration.2001.ayran: "Подражать стоит Айрану."
 gh_fund_inspiration.2001.ayran.tt: "Айран — старший сын Отачеда и наследник [Concept('kashirya','каширийских')|E] земель [Concept('otachedian_empire','Отачедской империи')|E]. Бо́льшую часть правления он укреплял доставшуюся ему молодую державу, и многие считают его время золотым веком края — до хаоса Войны пяти братьев и [Concept('bayyuralar','Байюралара')|E].\n"
 gh_fund_inspiration.2001.ayran_bonus: "Ваш артефакт может получить модификатор величия"
 gh_fund_inspiration.2001.kusan: "Я хочу упорства Кусана."
 gh_fund_inspiration.2001.kusan.tt: "#EMP Кусан#! — младший из детей [Concept('otachedian_empire','Отачеда')|E]; ему досталась власть над немногими ольтенами, успевшими пересечь [Concept('kasiryat_biozone','Каширият')|E] до [Concept('aironoian_migration','Айронойского переселения')|E]. Не имея ни богатства, ни больших дружин, он всё же выстоял в жестоких войнах за наследство и удерживал власть, пока не пал от руки Байтора в начале [Concept('bayyuralar','Байюралара')|E].\n"
 gh_fund_inspiration.2001.kusan_bonus: "Ваш артефакт может получить личный модификатор"
 gh_fund_inspiration.2001.ayar: "Трудолюбию Айара не было равных."
 gh_fund_inspiration.2001.ayar.tt: "#EMP Айар#! — один из сыновей [Concept('otachedian_empire','Отачеда')|E], унаследовавший южные владения отца и данников империи на [Concept('pirate_coast','Пиратском побережье')|E]. Он значительно расширил пряные плантации края, которые в своё время почти в одиночку оплачивали жизнь императорского двора.\n"
 gh_fund_inspiration.2001.ayar_bonus: "Ваш артефакт может получить модификатор, связанный с золотом"
 gh_fund_inspiration.2001.ioa: "Подвигам Иоа нет равных."
 gh_fund_inspiration.2001.ioa.tt: "#EMP Иоа#! — дочь [Concept('otachedian_empire','Отачеда')|E], унаследовавшая степную часть его империи. Личная слава заботила её куда больше правления, но её поддерживали крупнейшие кланы Кольргийских степей, и её держава просуществовала дольше, чем державы её братьев.\n"
 gh_fund_inspiration.2001.ioa_bonus: "Ваш артефакт может получить модификатор мнения вассалов"
 gh_fund_inspiration.2001.baytor: "Что ни говори, а у Байтора было #EMP честолюбие#!."
 gh_fund_inspiration.2001.baytor.tt: "#EMP Байтор#! — последний кагахатан [Concept('otachedian_empire','Отачедской империи')|E], заявивший права на неё как победитель в Войне пяти братьев. С его гибелью в [Concept('battle_of_the_wall_of_astila','Битве у стены Астилы')|E] во время [Concept('bayyuralar','Байюралара')|E] его империя распалась, а сам он с тех пор остаётся спорной фигурой.\n"
 gh_fund_inspiration.2001.baytor_bonus: "Ваш артефакт может получить боевой модификатор"
 gh_fund_inspiration.2001.mogha: "Именно Мога пережил их всех."
 gh_fund_inspiration.2001.mogha.tt: "#EMP Мога#! — старший сын Айрана и один из немногих, кто пережил Войну пяти братьев. Став после неё знаменосцем Байтора и уцелев в [Concept('bayyuralar','Байюраларе')|E], он вернулся в [Concept('kashirya','Каширию')|E], чтобы позаботиться об остатках [Concept('otachedian_empire','Отачедской империи')|E].\n"
 gh_fund_inspiration.2001.mogha_bonus: "Ваш артефакт может получить модификатор доблести"
 gh_fund_inspiration.2001.ogotei: "Огэтэя помнят за его честь."
 gh_fund_inspiration.2001.ogotei.tt: "#EMP Огэтэй Танхатан#! — предводитель хаяшегов, элитной стражи Байтора во времена [Concept('bayyuralar','Байюралара')|E]. Он мастерски владел клинком, луком и конём; говорили, что он вырос на молоке самой Кобылицы-под-Небом.\n"
 gh_fund_inspiration.2001.ogotei_bonus: "Ваш артефакт может получить модификатор, связанный с рыцарями"
 gh_fund_inspiration.2001.korsakai: "Корсакай построил империю из пепла."
 gh_fund_inspiration.2001.korsakai.tt: "#EMP Корсакай Хаяхатан#! — [Concept('otachedian_empire','отачедский')|E] полководец, ставший военным вождём и выкроивший себе державу после [Concept('bayyuralar','Байюралара')|E]. Прославленный воин и искусный дипломат, он покорял племена словом не реже, чем мечом.\n"
 gh_fund_inspiration.2001.korsakai_bonus: "Ваш артефакт может получить модификатор мнения правителей"
 gh_fund_inspiration.2001.toragei: "Без Торагея махратийцев здесь бы не было."
 gh_fund_inspiration.2001.toragei.tt: "[Concept('toragei_mahratian','Торагей-хатан')|E] — самопровозглашённый сын Отачеда и предводитель ольтенских кланов, проникших в Амагею во время [Concept('aironoian_migration','Айронойского переселения')|E]; в конце концов они осели у [Concept('north_kharadan_biozone','Северных гор Харадан')|E] и переняли многие обряды и обычаи наследия «[GetCulturePillar('heritage_lerrardin').GetName]».\n"
 gh_fund_inspiration.2001.toragei_bonus: "Ваш артефакт может получить модификатор принятия"
 gh_fund_inspiration.2001.none: "Достаточно оставаться собой."
 gh_fund_inspiration.2001.none_bonus: "Ваш артефакт может получить модификатор престижа"

 gh_fund_inspiration.2002.t: "$fund_inspiration.title$ Кристальная кровь"
 gh_fund_inspiration.2002.desc: "Едва переступив порог мастерской [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)], я ощущаю тревогу. Здесь темно и сыро, а в нос бьёт резкий металлический запах. Во имя [ROOT.Char.GetFaith.HighGodName], как [inspiration_owner.GetWomanMan] вообще может здесь работать?\n\n«А, [ROOT.Char.GetLadyLord|U], я как раз [Select_CString(inspiration_owner.IsFemale, 'собиралась', 'собирался' )] вас искать!» — [inspiration_owner.GetTitledFirstNameNoTooltip] появляется откуда-то из глубины комнаты, в [Select_CString(inspiration_owner.IsFemale, 'её', 'его' )] налитых кровью [inspiration_owner.Custom('EyeEyes')] странный блеск.\n\n«Умоляю, взгляните». [inspiration_owner.GetSheHe|U] протягивает мне шкатулку с мерцающим багровым камнем; его резкое сияние вызывает покалывание на коже.\n\n«Это лишь осколок [Concept('bloodcrystal','кровавого кристалла')|E], благороднейшего из камней. Ещё немного средств — и я добуду камень достаточно большой, чтобы сделать маску, равной которой никто не видел»."
 gh_fund_inspiration.2002.a: "Нет, просто… нет."
 gh_fund_inspiration.2002.a.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] изготовит маску из более традиционных материалов"
 gh_fund_inspiration.2002.b: "Это… прекрасно…"
 gh_fund_inspiration.2002.b.tt: "[inspiration_owner.GetTitledFirstNameNoTooltip] изготовит маску из [Concept('bloodcrystal','кровавого кристалла')|E]"
 gh_fund_inspiration.2002.c: "Да вы безумец! Прочь с глаз моих!"

 gh_fund_inspiration.2003.t: "$fund_inspiration.title$ Соль на рану"
 gh_fund_inspiration.2003.desc.inspiration_owner: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] подходит ко мне в тронном зале; на поясе у [Select_CString(inspiration_owner.IsFemale, 'неё', 'него' )] висит причудливый набор кузнечных инструментов — и личный гримуар. С заговорщическим видом [inspiration_owner.GetSheHe] оглядывается по сторонам и наконец обращается ко мне.\n\n«[ROOT.Char.GetLadyLord|U], я провёл[Select_CString(inspiration_owner.IsFemale, 'а', '' )] #EMP исследования#!, — говорит [inspiration_owner.GetSheHe], небрежно поводя рукой, — и полагаю, что ещё за скромную сумму смогу выковать оружие, не уступающее легендарному».\n\n«Я говорю о зачарованном клинке, [ROOT.Char.GetLadyLord|U], — добавляет [inspiration_owner.GetNameNoTooltip], — подобном [Concept('perdition_armaments','Оружию Погибели')|E], что некогда носила стража Галитского храма. Не сомневаюсь, он станет великим подспорьем — и грозным оружием в придачу»."
 gh_fund_inspiration.2003.desc.court_magi: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] подходит ко мне в тронном зале вместе с [Concept('court_magi','придворным магом')|E] [magi.GetName]. С заговорщическим видом они переглядываются, и наконец [inspiration_owner.GetNameNoTooltip] обращается ко мне.\n\n«[ROOT.Char.GetLadyLord|U], мы с [magi.GetNameNoTooltip] посовещались, — говорит [inspiration_owner.GetSheHe], небрежно поводя рукой, — и полагаем, что ещё за скромную сумму сможем выковать оружие, не уступающее легендарному».\n\n«Мы говорим о зачарованном клинке, [ROOT.Char.GetLadyLord|U], — добавляет [magi.GetNameNoTooltip], — подобном [Concept('perdition_armaments','Оружию Погибели')|E], что некогда носила стража Галитского храма. Не сомневаюсь, он станет великим подспорьем — и грозным оружием в придачу»."
 gh_fund_inspiration.2003.desc.outside_magi: "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] подходит ко мне в тронном зале в сопровождении [Select_CString(magi.IsFemale, 'незнакомки', 'незнакомца' )] — судя по одеянию, [Concept('magi','мага')|E]. С заговорщическим видом [inspiration_owner.GetNameNoTooltip] оглядывается по сторонам и наконец обращается ко мне.\n\n«[ROOT.Char.GetLadyLord|U], это [magi.GetFullName], [Select_CString(magi.IsFemale, 'известная', 'известный' )] и весьма [Select_CString(magi.IsFemale, 'прославленная', 'прославленный' )] чародей, — говорит [inspiration_owner.GetSheHe], указывая на гостя. — Полагаю, с [Select_CString(magi.IsFemale, 'её', 'его' )] помощью — и ещё за скромную сумму — мы сможем выковать оружие, не уступающее легендарному».\n\n«Я говорю о зачарованном клинке, [ROOT.Char.GetLadyLord|U], — добавляет [inspiration_owner.GetNameNoTooltip], — подобном [Concept('perdition_armaments','Оружию Погибели')|E], что некогда носила стража Галитского храма. Не сомневаюсь, он станет великим подспорьем — и грозным оружием в придачу»."
 gh_fund_inspiration.2003.a: "Хорошо, вы получите все необходимые средства."
 gh_fund_inspiration.2003.a.flavor: "Магическое оружие порой стоит не только золота — это, несомненно, выгодная сделка."
 gh_fund_inspiration.2003.enchantment.tt: "[Concept('artifact','Артефакт')|E], созданный в рамках [inspiration.GetName] ([artifact_quality_scope.GetShortUINamePossessive]), получит чары [Concept('perdition_armaments','Погибели')|E]"
 gh_fund_inspiration.2003.b: "Не заинтересует ли [magi.GetFirstNameNoTooltip] более #EMP постоянная#! должность?"
 gh_fund_inspiration.2003.b.flavor: "Мне всё равно нужен толковый придворный маг."
 gh_fund_inspiration.2003.c: "Вообще-то я справлюсь сам[Select_CString(ROOT.Char.IsFemale, 'а', '' )]."
 gh_fund_inspiration.2003.c.flavor: "Я знаю этот ритуал и едва ли нуждаюсь в помощи, чтобы провести его в одиночку."
 gh_fund_inspiration.2003.d: "Я не стану тратить на это деньги."
 gh_fund_inspiration.2003.d.flavor: "Казна, глупцы!"

 gh_fund_inspiration.2004.t: "$personal_inspiration.title$: поиск наставника"
 gh_fund_inspiration.2004.desc: "На мой призыв найти наставника является [tutor.Custom('quirk_pos_adjective')] [tutor.GetWomanMan] и представляется мне.\n\n«Меня зовут [tutor.GetFirstName], [tutor.Custom2('RelationToMeAddress', ROOT.Char)], и я весьма [Select_CString(tutor.IsFemale, 'известная', 'известный' )] стеклодув», — [tutor.Custom('quirk_pos_standalone')|l]. «За скромную плату я почту за честь поделиться с вами своими знаниями», — заканчивает [tutor.GetFirstNameNoTooltip], подобострастно кланяясь."
 gh_fund_inspiration.2004.a: "Хватит и одного урока."
 gh_fund_inspiration.2004.a.flavor: "Для успеха мне нужно лишь должное введение в дело."
 gh_fund_inspiration.2004.a.tt: "Вы платите персонажу [tutor.GetTitledFirstName] за урок стеклоделия"
 gh_fund_inspiration.2004.b: "Нескольких занятий должно хватить."
 gh_fund_inspiration.2004.b.flavor: "Честный труд ради честного искусства."
 gh_fund_inspiration.2004.b.tt: "Вы платите персонажу [tutor.GetTitledFirstName] за пару уроков"
 gh_fund_inspiration.2004.c: "Моё обучение будет #EMP всесторонним#!!"
 gh_fund_inspiration.2004.c.flavor: "Тайны стеклоделия откроются мне!"
 gh_fund_inspiration.2004.c.tt: "Вы платите персонажу [tutor.GetTitledFirstName], чтобы [tutor.GetSheHe] научил[Select_CString(tutor.IsFemale, 'а', '' )] вас всему, что знает сам[Select_CString(tutor.IsFemale, 'а', '' )]"
 gh_fund_inspiration.2004.d: "Меня бы заинтересовало более постоянное сотрудничество."
 gh_fund_inspiration.2004.d.flavor: "В конце концов, у каждого уважающего себя [ROOT.Char.GetTitleAsNameNoTooltip|l] на службе должен быть мастер-ремесленник."
 gh_fund_inspiration.2004.d.gaffer.aptitude: "[Concept('aptitude','Пригодность')|E] персонажа [court_gaffer.GetFirstNameNoTooltip]: [court_gaffer.GetCourtPositionAptitude(GetCourtPositionType('court_gaffer_court_position'))]"
 gh_fund_inspiration.2004.d.tutor.aptitude: "[Concept('aptitude','Пригодность')|E] персонажа [tutor.GetFirstNameNoTooltip]: [tutor.GetCourtPositionAptitude(GetCourtPositionType('court_gaffer_court_position'))]"
 gh_fund_inspiration.2004.e: "Пожалуй, всё же не стоит."
 gh_fund_inspiration.2004.e.flavor: "Насколько сложно может быть сделать это самому?"
 gh_fund_inspiration.2004.e.tt: "Вы отклоняете предложение персонажа [tutor.GetTitledFirstName] об уроках и советах"
 gh_fund_inspiration.2004.e.warning.tt: "@alert_icon! #alert_trial Вы #BOL не#! сможете снова использовать это [Concept('inspiration_actions','действие вдохновения')|E]#!"

 gh_fund_inspiration.2005.t: "$personal_inspiration.title$ Из чего делают стекло"
 gh_fund_inspiration.2005.desc: "Я сажусь в своём кабинете в окружении свитков, книг и прочего — каждый посвящён тому или иному аспекту стеклоделия. Сколько добавлять флюса? Когда лучше вводить фритту? Как избавиться от этих проклятых пузырей!?\n\nВ конечном счёте передо мной стоит вопрос состава. Чтобы мой замысел воплотился полностью, нужно выбрать определённый вид стекла."
 gh_fund_inspiration.2005.toast.success.t: "Ваш опыт удался"
 gh_fund_inspiration.2005.toast.failure.t: "Ваши опыты не удались"
 gh_fund_inspiration.2005.a: "Лесное стекло, по-моему, весьма привлекательно."
 gh_fund_inspiration.2005.a.flavor: "Лесное стекло, популярное в [Concept('chevalie','Шевалье')|E] и [Concept('the_continent','глубине Континента')|E], делают из древесной золы; обычно оно зеленовато-бурого цвета"
 gh_fund_inspiration.2005.a.domestic.tt: "Материалы будут добыты без дополнительных затрат, так как вы [Concept('location','находитесь')|E] в регионе «[GetGeographicalRegion('forest_glass_domestic_region').GetName]»"
 gh_fund_inspiration.2005.a.import.tt: "Материалы будут доставлены из [Concept('region','региона')|E] «[GetGeographicalRegion('forest_glass_domestic_region').GetName]»"
 gh_fund_inspiration.2005.a.effect.tt: "[Concept('artifacts','Артефакты')|E] из лесного стекла [Concept('rarity','редкости')|E] #color:{0.125,0.454,0.894,0.8} «Знаменитый»#! и выше могут получить [Concept('modifier','модификатор')|E], связанный с [Concept('stewardship','управлением')|E]"
 gh_fund_inspiration.2005.a.mastery.tt: "Создание #color:{0.721,0.321,0.894,0.8} прославленного#! [Concept('artifact','артефакта')|E] даст [Concept('modifier','модификатор')|E] [GetModifier('forest_glass_master_modifier').GetNameWithTooltip]"
 gh_fund_inspiration.2005.a.toast.success.tt: "Вам удалось создать лесное стекло"
 gh_fund_inspiration.2005.a.toast.failure.tt: "Ваше лесное стекло полно примесей"
 gh_fund_inspiration.2005.b: "Смальта — благороднейшее из всех стёкол!"
 gh_fund_inspiration.2005.b.flavor: "Смальта — стекло насыщенного синего цвета, которое получают из редких минералов, добываемых в основном в [Concept('kashirya','Каширии')|E] и [Concept('amsar','Амсаре')|E]"
 gh_fund_inspiration.2005.b.domestic.tt: "Материалы будут добыты без дополнительных затрат, так как вы [Concept('location','находитесь')|E] в регионе «[GetGeographicalRegion('smalt_glass_domestic_region').GetName]»"
 gh_fund_inspiration.2005.b.import.tt: "Материалы будут доставлены из [Concept('region','региона')|E] «[GetGeographicalRegion('smalt_glass_domestic_region').GetName]»"
 gh_fund_inspiration.2005.b.effect.tt: "[Concept('artifacts','Артефакты')|E] из смальты [Concept('rarity','редкости')|E] #color:{0.125,0.454,0.894,0.8} «Знаменитый»#! и выше могут получить [Concept('modifier','модификатор')|E], связанный с [Concept('diplomacy','дипломатией')|E]"
 gh_fund_inspiration.2005.b.mastery.tt: "Создание #color:{0.721,0.321,0.894,0.8} прославленного#! [Concept('artifact','артефакта')|E] даст [Concept('modifier','модификатор')|E] [GetModifier('smalt_glass_master_modifier').GetNameWithTooltip]"
 gh_fund_inspiration.2005.b.toast.success.tt: "Вам удалось создать смальту"
 gh_fund_inspiration.2005.b.toast.failure.tt: "Ваша смальта полна примесей"
 gh_fund_inspiration.2005.c: "Я слышал[Select_CString(ROOT.Char.IsFemale, 'а', '' )] любопытные вещи о применении сурьмы..."
 gh_fund_inspiration.2005.c.flavor: "Сурьмяное стекло — довольно редкий вид, встречающийся обычно лишь в Айроное и Амагее; как правило, оно желтовато-красного цвета"
 gh_fund_inspiration.2005.c.domestic.tt: "Материалы будут добыты без дополнительных затрат, так как вы [Concept('location','находитесь')|E] в регионе «[GetGeographicalRegion('antimony_glass_domestic_region').GetName]»"
 gh_fund_inspiration.2005.c.import.tt: "Материалы будут доставлены из [Concept('region','региона')|E] «[GetGeographicalRegion('antimony_glass_domestic_region').GetName]»"
 gh_fund_inspiration.2005.c.effect.tt: "[Concept('artifacts','Артефакты')|E] из сурьмяного стекла [Concept('rarity','редкости')|E] #color:{0.125,0.454,0.894,0.8} «Знаменитый»#! и выше могут получить [Concept('modifier','модификатор')|E], связанный с [Concept('intrigue','интригами')|E]"
 gh_fund_inspiration.2005.c.mastery.tt: "Создание #color:{0.721,0.321,0.894,0.8} прославленного#! [Concept('artifact','артефакта')|E] даст [Concept('modifier','модификатор')|E] [GetModifier('antimony_glass_master_modifier').GetNameWithTooltip]"
 gh_fund_inspiration.2005.c.toast.success.tt: "Вам удалось создать сурьмяное стекло"
 gh_fund_inspiration.2005.c.toast.failure.tt: "Ваше сурьмяное стекло полно примесей"
 gh_fund_inspiration.2005.d: "С медью не прогадаешь."
 gh_fund_inspiration.2005.d.flavor: "Медное стекло хорошо известно и одинаково распространено как в [Concept('aversaria','Аверсарии')|E], так и в [Concept('sarradon','Саррадоне')|E]; в первой оно особенно популярно благодаря широкой палитре возможных красных и синих оттенков"
 gh_fund_inspiration.2005.d.domestic.tt: "Материалы будут добыты без дополнительных затрат, так как вы [Concept('location','находитесь')|E] в регионе «[GetGeographicalRegion('copper_glass_domestic_region').GetName]»"
 gh_fund_inspiration.2005.d.import.tt: "Материалы будут доставлены из [Concept('region','региона')|E] «[GetGeographicalRegion('copper_glass_domestic_region').GetName]»"
 gh_fund_inspiration.2005.d.effect.tt: "[Concept('artifacts','Артефакты')|E] из медного стекла [Concept('rarity','редкости')|E] #color:{0.125,0.454,0.894,0.8} «Знаменитый»#! и выше могут получить [Concept('modifier','модификатор')|E], связанный с [Concept('martial','военным делом')|E]"
 gh_fund_inspiration.2005.d.mastery.tt: "Создание #color:{0.721,0.321,0.894,0.8} прославленного#! [Concept('artifact','артефакта')|E] даст [Concept('modifier','модификатор')|E] [GetModifier('copper_glass_master_modifier').GetNameWithTooltip]"
 gh_fund_inspiration.2005.d.toast.success.tt: "Вам удалось создать медное стекло"
 gh_fund_inspiration.2005.d.toast.failure.tt: "Ваше медное стекло полно примесей"
 gh_fund_inspiration.2005.e: "Может быть, два минерала магнезии?"
 gh_fund_inspiration.2005.e.flavor: "Магнезиальное стекло получают, смешивая два минерала — чёрный и белый, — которые редко встречаются рядом с железом. Изделия из магнезиального стекла обычно серых и фиолетовых оттенков"
 gh_fund_inspiration.2005.e.domestic.tt: "Материалы будут добыты без дополнительных затрат, так как вы [Concept('location','находитесь')|E] в регионе «[GetGeographicalRegion('magnesia_glass_domestic_region').GetName]»"
 gh_fund_inspiration.2005.e.import.tt: "Материалы будут доставлены из [Concept('region','региона')|E] «[GetGeographicalRegion('magnesia_glass_domestic_region').GetName]»"
 gh_fund_inspiration.2005.e.effect.tt: "[Concept('artifacts','Артефакты')|E] из магнезиального стекла [Concept('rarity','редкости')|E] #color:{0.125,0.454,0.894,0.8} «Знаменитый»#! и выше могут получить [Concept('modifier','модификатор')|E], связанный с [Concept('learning','ученостью')|E]"
 gh_fund_inspiration.2005.e.mastery.tt: "Создание #color:{0.721,0.321,0.894,0.8} прославленного#! [Concept('artifact','артефакта')|E] даст [Concept('modifier','модификатор')|E] [GetModifier('magnesia_glass_master_modifier').GetNameWithTooltip]"
 gh_fund_inspiration.2005.e.toast.success.tt: "Вам удалось создать магнезиальное стекло"
 gh_fund_inspiration.2005.e.toast.failure.tt: "Ваше магнезиальное стекло полно примесей"
 gh_fund_inspiration.2005.f: "Свинец сделает стекло кристально прозрачным."
 gh_fund_inspiration.2005.f.flavor: "Свинцовое стекло, давняя традиция [Concept('zelkavani_glassmaking','зелкаванского стеклоделия')|E], славится прозрачностью и прочностью"
 gh_fund_inspiration.2005.f.domestic.tt: "Материалы будут добыты без дополнительных затрат, так как вы [Concept('location','находитесь')|E] в регионе «[GetGeographicalRegion('lead_glass_domestic_region').GetName]»"
 gh_fund_inspiration.2005.f.import.tt: "Материалы будут доставлены из [Concept('region','региона')|E] «[GetGeographicalRegion('lead_glass_domestic_region').GetName]»"
 gh_fund_inspiration.2005.f.effect.tt: "[Concept('artifacts','Артефакты')|E] из свинцового стекла [Concept('rarity','редкости')|E] #color:{0.125,0.454,0.894,0.8} «Знаменитый»#! и выше могут получить [Concept('modifier','модификатор')|E], связанный с [Concept('arcana','арканой')|E]"
 gh_fund_inspiration.2005.f.mastery.tt: "Создание #color:{0.721,0.321,0.894,0.8} прославленного#! [Concept('artifact','артефакта')|E] даст [Concept('modifier','модификатор')|E] [GetModifier('lead_glass_master_modifier').GetNameWithTooltip]"
 gh_fund_inspiration.2005.f.toast.success.tt: "Вам удалось создать свинцовое стекло"
 gh_fund_inspiration.2005.f.toast.failure.tt: "Ваше свинцовое стекло полно примесей"
