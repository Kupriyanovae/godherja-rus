 gh_fund_inspiration.0013.t: "$personal_inspiration.title$: финансирование"
 gh_fund_inspiration.0013.desc: "Порой — в тихие минуты между нескончаемыми совещаниями и повседневными заботами — я ловлю себя на желании сделать что-то самому, оставить после себя наследие, созданное собственными руками. Выбор ремесла очевиден: кто, как не [ROOT.Char.GetCulture.GetName], может похвастаться мастерством в изяществе и красоте стекла?\n\nОстаётся лишь решить, что именно создать…"
 gh_fund_inspiration.0013.beads.tt: "Вы начнёте [Concept('personal_inspiration','личное вдохновение')|E] #V «Стеклоделие»#!, чтобы создать [Concept('inventory_artifact','личный артефакт')|E] «$trinket$»"
 gh_fund_inspiration.0013.flask.tt: "Вы начнёте [Concept('personal_inspiration','личное вдохновение')|E] #V «Стеклоделие»#!, чтобы создать [Concept('inventory_artifact','личный артефакт')|E] «$trinket$»"
 gh_fund_inspiration.0013.beaker.tt: "Вы начнёте [Concept('personal_inspiration','личное вдохновение')|E] #V «Стеклоделие»#!, чтобы создать [Concept('court_artifact','придворный артефакт')|E] «$pedestal$»"
 gh_fund_inspiration.0013.ewer.tt: "Вы начнёте [Concept('personal_inspiration','личное вдохновение')|E] #V «Стеклоделие»#!, чтобы создать [Concept('court_artifact','придворный артефакт')|E] «$pedestal$»"
 gh_fund_inspiration.0013.vase.tt: "Вы начнёте [Concept('personal_inspiration','личное вдохновение')|E] #V «Стеклоделие»#!, чтобы создать [Concept('court_artifact','придворный артефакт')|E] «$sculpture$»"
 gh_fund_inspiration.0013.sculpture.tt: "Вы начнёте [Concept('personal_inspiration','личное вдохновение')|E] #V «Стеклоделие»#!, чтобы создать [Concept('court_artifact','придворный артефакт')|E] «$sculpture$»"
 gh_fund_inspiration.0013.exit: "С другой стороны, пожалуй, не стоит."
 gh_fund_inspiration.0013.exit.gold_refund: "Вы решаете заняться стеклоделием в другой раз"

