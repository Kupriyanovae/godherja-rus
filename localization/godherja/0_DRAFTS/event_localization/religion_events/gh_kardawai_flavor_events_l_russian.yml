l_russian:

 kardawai_flavor.0002.t: "Судьба павших"
 kardawai_flavor.0002.desc.intro: "Поле битвы безмолвно.\n\nЕщё день назад [combat_location.Custom('GetTerrainTypePlural')] [combat_location.GetName] обагрились кровью — сталь, люди и звери, схлестнувшиеся в жестокой сече. Мы победили, и теперь земля усеяна павшими воинами [combat_loser.GetTitledFirstName]. Знал ли [combat_loser.GetSheHe] хоть одно из их имён, интересно? Верили ли они в то, за что сражались?\n\n"
 kardawai_flavor.0002.desc.killer: "Всё ещё погружённый в раздумья, я возвращаюсь по вчерашнему пути и натыкаюсь на труп [skull_donor.GetFullNameRegnal], которого я убил в бою. [skull_donor.GetHerHis|U] раны многочисленны, но череп, похоже, цел."
 kardawai_flavor.0002.desc.casualty: "Я иду среди мёртвых, пока не замечаю труп [skull_donor.GetFullNameRegnal], погибшего в бою. [skull_donor.GetHerHis|U] раны многочисленны, но череп, похоже, цел."
 kardawai_flavor.0002.a: "Отличное пополнение моей коллекции!"
 kardawai_flavor.0002.a.flavor: "Через [skull_donor.GetHerHis] дух я забираю [skull_donor.GetHerHis] силу."
 kardawai_flavor.0002.b: "Освободить [skull_donor.GetHerHis] дух."
 kardawai_flavor.0002.b.flavor: "Павшим не нужно так страдать."

 kardawai_flavor.1000.t:0 "Пир для Кардвена"
 kardawai_flavor.1000.desc:0 "Возвращаясь с нашего набега, мои солдаты привели несколько пленников, захваченных лично мной во время нашего рейда. Как Кардавай высокого ранга, это моё право — устроить свой первый пир из этих поверженных солдат и обеспечить себе место в загробной жизни."
 kardawai_flavor.1000.a:0 "Как Кардвен поступил с Лотброками, так и я поступлю с ними!"
 kardawai_flavor.1000.b:0 "Нет, я не думаю, что сделаю это."
 kardawai_flavor.1001.t:0 "Пир для Кардвена"
 kardawai_flavor.1001.desc:0 "Отдыхая после сражения, мои солдаты приводят нескольких пленников, солдат, которых я лично одолел в бою. Как Кардавай высокого ранга, это моё право — устроить свой первый пир из этих поверженных солдат и обеспечить себе место в загробной жизни."
 kardawai_flavor.1001.a:0 "Как Кардвен поступил с Лотброками, так и я поступлю с ними!"
 kardawai_flavor.1001.b:0 "Нет, я не думаю, что сделаю это."