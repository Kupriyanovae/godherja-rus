 defiled_nadir_character_side_story_desc: "What use is there to resist the yearning of life? Illness and infirmity have eased their grip, and the ailing of your body is but a distant murmur at the back of your mind.\n\nAre you still whole, or is the part of you that is no longer flesh but an imprint? Only death will tell."
