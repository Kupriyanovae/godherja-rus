 STORY_CYCLE_GH_COMPANY_VENTURE_INFORMATION_STRING: "The patrons of the #high [Localize(Concatenate(Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))]#! may demand that you take certain actions in pursuit of the [gh_company_venture|E]'s interests. Should the patrons become too displeased with your stewardship, they may appoint another in your place.[SelectLocalization(Not(GreaterThan_CFixedPoint(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_company_opinion_of_venture_value').GetValue,'(CFixedPoint)-70')),'gh_venture_company_danger_of_removing_representative_tt', '')]\n\n#bold Current Debt#!: #size:17 [gold_i] [Story.MakeScope.Var('gh_character_debt_to_company_variable').GetValue|0-]#!"

