 STORY_CYCLE_GH_COMPANY_VENTURE_INFORMATION_STRING: "Покровители #high [Localize(Concatenate(Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))]#! могут потребовать от вас совершить определённые действия в интересах [Concept('gh_company_venture','предприятия компании')|E]. Если покровители останутся слишком недовольны вашим управлением, они могут назначить другого на ваше место.[SelectLocalization(Not(GreaterThan_CFixedPoint(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_company_opinion_of_venture_value').GetValue,'(CFixedPoint)-70')),'gh_venture_company_danger_of_removing_representative_tt', '')]\n\n#bold Текущий долг#!: #size:17 [gold_i] [Story.MakeScope.Var('gh_character_debt_to_company_variable').GetValue|0-]#!"

 gh_venture_company_danger_of_removing_representative_tt: "\n\n@warning_icon! #N #bold Крайне низкое мнение#!\n\nВ следующем месяце есть [GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_company_chance_of_removing_representative').GetValue|0]% вероятность, что покровители #bold [Localize(Concatenate(Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))]#! потребуют, чтобы вы уступили [Localize(Concatenate(Story.MakeScope.Var('gh_venture_region_name_variable').GetFlagName,'_name'))], при необходимости силой.#!"
