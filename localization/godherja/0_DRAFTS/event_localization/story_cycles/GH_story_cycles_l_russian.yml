 defiled_nadir_character_side_story_desc: "Какой смысл противиться жажде жизни? Болезни и немощи ослабили свою хватку, и недуги твоего тела — лишь далёкий шёпот на задворках сознания.\n\nТы ещё цел, или та часть тебя, что больше не плоть, а лишь отпечаток? Это скажет только смерть."
