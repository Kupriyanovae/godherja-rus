 GH_AMSARI_CIVIL_WAR_TITLE: "Гражданская война в Амсаре"
 story_gh_amsari_civil_war: "Гражданская война в Амсаре"
 story_gh_amsari_civil_war_desc: "Хиклахн содрогается, когда соперничающие претенденты борются за трон, ввергая некогда единое царство Амсара в хаос. Пока Канамсар пытается сохранить хотя бы видимость контроля, по всей империи бушуют ожесточённые конфликты, грозящие раздробить и ту малость стабильности, что ещё осталась."
 AMSARI_CIVIL_WAR_INFORMATION_STRING: "[Concept('rulers','Правители')|E] в Амсаре могут поддерживать [Concept('claimant','претендентов')|E] на трон [GetTitleByKey('e_amsari_hiklahn').GetNameNoTier], или при определённых условиях заявить права на него сами. Они также получают доступ к уникальным [Concept('decisions','решениям')|E] и [Concept('interactions','взаимодействиям')|E].\n\n$BULLET_WITH_TAB$#indent_newline:7 Началась в #high [Subtract_CFixedPoint( Story.MakeScope.Var('story_start_year').GetValue, '(CFixedPoint)5000' )] [Select_CString( GreaterThan_CFixedPoint( Story.MakeScope.Var('story_start_year').GetValue, '(CFixedPoint)5000'), 'И.С.', 'Д.С.' )]#!#!\n$BULLET_WITH_TAB$#indent_newline:7 Правящая [Concept('dynasty','династия')|E]: #high [GetGlobalVariable('gh_hiklahn_ruling_dynasty_var').House.GetBaseNameNoTooltip]#!#!"

 story_redlands_crisis: "Кризис Красных земель"
 story_redlands_crisis_desc: "Хаос охватил странные и таинственные [Concept('redlands_biozone','Красные земли')|E], когда из глубоких песков просачиваются могущественные магии и зловещие культы."
 STORY_REDLANDS_CRISIS_INFORMATION_STRING: "$BULLET_WITH_TAB$#indent_newline:7 Начался в #high [Subtract_CFixedPoint( Story.MakeScope.Var('story_start_year').GetValue, '(CFixedPoint)5000' )] [Select_CString( GreaterThan_CFixedPoint( Story.MakeScope.Var('story_start_year').GetValue, '(CFixedPoint)5000'), 'И.С.', 'Д.С.' )]#!#!"
 REDLANDS_CRISIS_ARTIFACT: "Бездонная призма"

 story_cycle_migration_coalition: "Великое переселение сьялволков"
 story_cycle_migration_coalition_desc: "Катастрофически быстрое наступление [Concept('the_fog','Тумана')|E] послало волну народов на запад в поисках нового дома. Хотя во главе переселения стоят сьялволки, на деле это хаотичное сборище племён и культур без счёта, некоторые из которых даже не участвуют в основном натиске на [Concept('aversaria','Аверсарию')|E], а мигрируют в более необычные места вдоль побережья [Concept('the_continent','Континента')|E].\n\nВ сочетании с разрушительной анархией, охватившей саму Аверсарию, #E Великое переселение сьялволков#!, вероятно, станет одним из самых бурных периодов в истории Эраса."
 MIGRATION_STORY_PRACTICAL_INFORMATION_STRING: "[Concept('sjalvolki_migration','Переселение сьялволков')|E] будет действовать как серия [Concept('wars','войн')|E] через [Concept('aversaria','Аверсарию')|E], позволяя [Concept('vassals','вассалам')|E] [GetTitleByKey('e_migrant_coalition').GetName|U] селиться на новых землях. Чтобы участвовать, [Concept('vassals','вассалы')|E] должны согласиться поддерживать усилия Верховного короля, при этом [Concept('kings','короли')|E] обязаны участвовать напрямую. Участники будут генерировать [Concept('migration_contribution','вклад в переселение')|E], это определяет ваше место в очереди на получение следующего доступного [Concept('title','титула')|E]."
 high_king: "Верховный король"
 clanrech_leaders: "Вожди кланов"
 conquest_contribution_tooltip: "Вклад в переселение"
 conquest_contribution_counter_label: "Вклад в переселение"

 story_sjalvolki_reformation: "Реформация сьялволков"
 story_sjalvolki_reformation_desc: "Ветер перемен пронёсся по миру сьялволков, старые обычаи родины всё чаще вступают в противоречие с новой реальностью жизни на совершенно ином [Concept('aversaria','Расколотом побережье')|E]. Хотя некоторые стойкие традиционалисты могут ворчать, большинство лидеров — как светских, так и духовных — начинают понимать, что старый религиозный порядок нуждается в великих переменах."
 SJALVOLKI_REFORMATION_STORY_INFORMATION_STRING: "Проповедник и его ученики распространяют #bold Ориспольский обряд#! по землям, затронутым [Concept('sjalvolki_migration','переселением сьялволков')|E], что позволяет быстро феодализироваться. Показатель реформаторского рвения ниже отслеживает его динамику: правители могут укрыть, проигнорировать, изгнать или казнить Проповедника, когда он прибывает в их земли. Как только поколение старого Сокрушителя ведьм уйдёт, хранители Велостадда сделают свой ход, расколов Обряд в #bold Велоскопе#! и развязав Войны обрядов [Concept('struggle','борьбу')|E]"
 reform_fervor_label: "Рвение реформ"
 the_preacher_label: "Реформатор"
 the_priest_name: "Жрец"
 the_patron_name: "Покровитель"
 the_king_name: "Король"

 story_sjalvolki_schism: "Сьялволькский раскол"
 story_sjalvolki_schism_desc: "Ветер перемен пронёсся по миру сьялволков, старые обычаи родины всё чаще вступают в противоречие с новой реальностью жизни на совершенно ином [Concept('aversaria','Расколотом побережье')|E]. Хотя некоторые стойкие традиционалисты могут ворчать, большинство лидеров — как светских, так и духовных — начинают понимать, что старый религиозный порядок нуждается в великих переменах."

 story_aversarian_anarchy: "Аверсарианская анархия"
 story_aversarian_anarchy_desc: "Апокалиптическое насилие [Concept('frodbrokna','Фродброкны')|E] оставило от пепельного трупа [Concept('aversaria','Аверсарии')|E] лишь пустошь. Военачальники и безумные [Concept('magi','маги')|E] борются за объедки среди руин цивилизации."
 AVERSARIAN_ANARCHY_STORY_INFORMATION_STRING: "Из-за [Concept('magic','магии')|E], вызвавшей [Concept('frodbrokna','Фродброкну')|E], [Concept('aversaria','Аверсария')|E] рухнула в хаос. Каждая из её бывших провинций переживает свои проблемы и часто требует времени или новых поселенцев, чтобы достичь состояния «нормальности»."

 story_cycle_harthah: "Война Хартаха"
 story_cycle_harthah_desc: "Судьба пришла за агионистами, так говорят последователи Хартаха ибн Саррадона. Великое воинство выступает против агионистских орденов Саррадона, чтобы полностью очистить от них землю. Сумеют ли они объединиться перед лицом такой угрозы, или им суждено погибнуть раз и навсегда?"
 HARTHAH_STORY_PRACTICAL_INFORMATION_STRING: "Хартах ведёт [Concept('war','войну')|E] против агионистов, стремясь сокрушить их ордена и восстановить независимость [Concept('sarradon','Саррадона')|E]."
 ibn_sarradon: "Сын Саррадона"
 AGIONIST_KINGDOM_TITLES: "Царства агионистов"

 story_cycle_high_court: "Высокий двор"

