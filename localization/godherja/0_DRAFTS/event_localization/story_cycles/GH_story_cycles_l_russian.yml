 story_cycle_gh_company_venture_desc: "Покровители #high [Localize(Concatenate(Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))]#! вложили крупные средства в [Concept('gh_company_venture','предприятие компании')|E], управлять которым вас назначили, и ожидают, что результаты и богатства потекут в их сторону."
