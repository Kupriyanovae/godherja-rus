l_russian:
 gh_pilgrimage.0001.t: "$pilgrimage_header$ Колыбель Аверсарии"
 gh_pilgrimage.0001.desc.aversarian: "[GetTitleByKey('c_oraispol').GetNameNoTier] — город, столь же древний, как сама память. Никто доподлинно не знает, кто его основал, но каждый новый правитель возводил здесь всё новые монументальные сооружения, а храмы Чистейшего и Первых людей встречаются едва ли не на каждом углу.\n\nНо среди этих святынь есть одна, которую все прибывающие сюда [Concept('aversaria','аверсарианцы')|E] обязаны хотя бы раз увидеть своими глазами: великий дворец Первого человека Арсодиаса, много веков назад превращённый в грандиозный храмовый комплекс. Получив благословение в обветшавшем, но по-прежнему величественном дворце, я провожу ещё несколько дней среди мирской суеты столицы."
 gh_pilgrimage.0001.a: "Воистину город, достойный великой империи."
 gh_pilgrimage.0001.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0002.t: "$pilgrimage_header$ Солнечная гора"
 gh_pilgrimage.0002.desc.aversarian: "Колоссальную статую [ROOT.GetCharacter.GetFaith.HighGodName] видно за много лиг, задолго до того, как моя повозка достигает самого [GetBuilding('01_vounill').GetName]. Не меньше впечатляют храмы у подножия древнего, источенного временем монумента: пышно украшенные и сказочно богатые благодаря пожертвованиям, которые две тысячи лет стекались сюда как из [Concept('aversaria','Аверсарии')|E], так и от Храма Горного Солнца.\n\nСегодня Алые Избранники слишком заняты, чтобы дать мне предсказание, но мне всё же позволяют провести некоторое время на одном из бесчисленных балконов. Свет заходящего солнца над раскинувшейся внизу Опахасией — поистине незабываемое зрелище."
 gh_pilgrimage.0002.a: "Нетрудно понять, почему это место считается божественным."
 gh_pilgrimage.0002.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0003.t: "$pilgrimage_header$ Майикратия"
 gh_pilgrimage.0003.desc.aversarian: "Подъём к [Concept('mayikrata','Майикратии')|E] суров и беспощаден. Она возвышается среди высочайших гор [Concept('aeras','Эраса')|E], и даже на вершине могущества [Concept('aversaria','Аверсарии')|E] самый безопасный путь наверх считался крайне тяжёлым. С тех пор как рухнуло всякое подобие центральной власти, дорогу и вовсе заполонили отступники и сбежавшие из академии существа.\n\nНо когда мы наконец добираемся до места, один вид здания оправдывает все тяготы пути. Это, без преувеличения, крупнейшее сооружение человеческих рук, какое мне доводилось видеть, — если его вообще создали люди. По совету местных жителей моя группа не решается войти внутрь: в здешних туннелях теперь непрестанно идёт война."
 gh_pilgrimage.0003.a: "И всё же зрелище того стоит."
 gh_pilgrimage.0003.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0004.t: "$pilgrimage_header$ Драконья могила"
 gh_pilgrimage.0004.desc.aversarian: "[GetBuilding('01_drakavil').GetName] трудно назвать доступным местом. В какой-то момент повозки уже не могут безопасно двигаться по горной дороге, и дальше посетителям приходится подниматься по крутой лестнице более чем из тысячи ступеней. Зато удалённость имеет свои преимущества: я наслаждаюсь почти полным одиночеством, если не считать Красной гвардии, которая неусыпно охраняет это место.\n\nСамо строение явно древнее и потрёпанное временем, но всё ещё прекрасное. В убранстве преобладают драконьи мотивы, а всё здание служит выдающимся образцом классической [Concept('aversaria','аверсарийской')|E] архитектуры, возведённым с величайшей тщательностью. То, что скрывается внутри, ещё интереснее, но, увы, обычным посетителям вход воспрещён."
 gh_pilgrimage.0004.a: "Гробница, достойная последних драконов."
 gh_pilgrimage.0004.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0005.t: "$pilgrimage_header$ Обитель [ROOT.GetCharacter.GetFaith.HighGodName]"
 gh_pilgrimage.0005.desc.aversarian: "Главная достопримечательность западной оконечности Имперского острова — величественная [Concept('sea_tower','Морская башня')|E], откуда некогда правил сам [ROOT.GetCharacter.GetFaith.HighGodName], но [GetBuilding('01_thetowerwatch').GetName] тоже заслуживает внимания.\n\nЭто огромный комплекс храмов и обсерваторий, где Алые Избранники неусыпно следят за троном [ROOT.GetCharacter.GetFaith.HighGodName] и каждый день черпают из него космическую мудрость. Хотя главной целью моего путешествия был [GetBuilding('01_thetowerwatch').GetName], перед отъездом я не могу не насладиться тёплым, приятным климатом и идиллическими морями здешних мест."
 gh_pilgrimage.0005.a: "Лишь [ROOT.GetCharacter.GetFaith.HighGodName] достоин такого места."
 gh_pilgrimage.0005.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0009.t: "$pilgrimage_header$ Хасети Мекаб"
 gh_pilgrimage.0009.desc.mogowai: "На стыке джунглей и гор стоит древняя гробница. Чтобы добраться до неё, мне приходится несколько дней идти пешком среди словно бесконечных деревьев по тропе, которую веками прокладывали путники. На месте меня встречает скромное на вид здание из серого кирпича, но истинные размеры гробницы скрыты под землёй. Священник, знающий дорогу, ведёт меня и других паломников в её тёмные глубины.\n\nМы идём по бесконечным коридорам, а единственный факел лишь ненадолго выхватывает из мрака резьбу на стенах. Достигнув самого низа, мы преклоняем колени перед останками Его сподвижника, принимаем благословение священника и молимся о Его возвращении."
 gh_pilgrimage.0009.a: "Возможно, здесь и кроется ответ."
 gh_pilgrimage.0009.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0010.t: "$pilgrimage_header$ Пустой дворец"
 gh_pilgrimage.0010.desc.mogowai: "Город Захали расположен почти в самом центре Дамоты. Отсюда боккары некогда правили всей страной как наместники Всевышнего. Город полон исторических мест, но ни одно не сравнится с [GetBuilding('01_tabik_betemisit').GetName] — Пустым дворцом, возведённым для того, чтобы по возвращении Всевышний правил из него.\n\nПо традиции в определённые дни дворец открывают для паломников. Переступая порог, я чувствую на плечах тяжесть истории и осознаю величие сооружения, способного вместить бога. Глядя на стены, инкрустированные драгоценными камнями, я представляю времена, когда весь мир станет столь же великолепен, а Он во всём Своём блеске будет править из этого дворца."
 gh_pilgrimage.0010.a: "Возможно, когда-нибудь."
 gh_pilgrimage.0010.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0011.t: "$pilgrimage_header$ Ворота Дамоты"
 gh_pilgrimage.0011.desc.mogowai: "У южного конца Гонанского пути тянется величественная стена. Единственные массивные ворота отмечают путь в земли по ту сторону. После нескольких дней пути мимо торговых караванов, других паломников и редких солдат я достигаю стены, и мне позволяют войти внутрь.\n\nСначала я отправляюсь в устроенную в стене огромную библиотеку и просматриваю дневники бесчисленных искателей приключений, повествующие о землях за вратами. Затем прохожу вдоль всей стены, останавливаясь на отдых у караулен. Мой взгляд неизменно следует за извилистой дорогой, которая тянется вдоль реки через пустыню и теряется вдали. Перед уходом я встаю у самих ворот и читаю высеченную над ними надпись."
 gh_pilgrimage.0011.a: "Он покоится по ту сторону."
 gh_pilgrimage.0011.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0012.t: "$pilgrimage_header$ Стена Адабисса"
 gh_pilgrimage.0012.desc.mogowai: "После нескольких дней пути по юго-востоку Дамоты впереди вырастают горы, словно отмечающие край света. Подойдя ближе, я вижу стену. Она перегораживает единственный проходимый перевал — по крайней мере, единственный достаточно широкий, — а на высоком парапете едва различимы закованные в броню фигуры.\n\nМне остаётся лишь смотреть издали и следить за медленным движением часовых: приблизиться к стене немыслимо. На целую милю вокруг неё вырублены все деревья, и я стою посреди пустого поля. Ещё один шаг вперёд может означать смерть. Если за этой преградой покоится Его тело, придётся искать другой путь, ведь здесь, по сути, заканчивается мир."
 gh_pilgrimage.0012.a: "Должен быть иной способ."
 gh_pilgrimage.0012.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0021.t: "$pilgrimage_header$ Рождение Хиклахна"
 gh_pilgrimage.0021.desc.mahndayanism: "Древние пески Хиклахна пропитаны кровью и памятью. Особенно Место первого видения, где Спаситель очнулся от трёхдневного пророческого транса и впервые изложил Тысяче святых свидетелей истины Разорванной цепи и Мёртвой луны. Когда я вступаю на священную землю, меня окутывает пьянящая смесь ароматов ладана и мирры.\n\nНебольшая кочевая деревня восставших рабов — предков амсарийцев — за века превратилась в огромный храмовый комплекс, которым управляет целое войско священников, богословов и писцов. Теперь это главный центр паломничества и торговли в регионе. Резные фигуры Тысячи святых свидетелей обращены к простой каменной платформе, на которой, по преданию, некогда стоял Пророк. Их холодные немигающие взоры немного тревожат меня, но сердце наполняется изумлением и благоговением от близости к Пророку."
 gh_pilgrimage.0021.a: "Здесь мы стали единым народом."
 gh_pilgrimage.0021.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0022.t: "$pilgrimage_header$ Священная столица"
 gh_pilgrimage.0022.desc.mahndayanism: "Следуя по стопам Пророка, я укрепляю волю и решимость. Его путь приводит меня в Священную столицу [GetTitleByKey('c_tchouran').GetNameNoTier] — помазанную землю, которую Пророк даровал своему роду, чтобы отсюда он правил новорождённой империей. Когда я схожу на берег в величественном порту [GetTitleByKey('c_tchouran').GetNameNoTier], где стоит Амсарийский королевский флот, передо мной открывается бескрайняя сверкающая панорама.\n\nКаждый булыжник здесь священен: его освятили шаги Пророка, и на каждом высечены строки Махндаянских пророчеств. Я жажду услышать Шёпот ветра Пророка во дворце, куда под страхом смерти запрещён вход всем, кроме царского рода. Мне предстоит провести здесь шесть дней, ступая по святой земле и знакомясь с легендарной роскошью базаров Мейанкаран Софлы, храмовыми крепостями Астареса и шумными учёными спорами в университете. Особым почитанием паломников окружён огромный позолоченный обелиск из давно покинутой кемсарской столицы Эмвиса. Он служит мрачным напоминанием об иге жестоких рабовладельцев и о проклятии рабства, провозглашённом нашим Пророком."
 gh_pilgrimage.0022.a: "Прозвище «Жемчужина Саррадона» вполне заслуженно."
 gh_pilgrimage.0022.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0025.t: "$pilgrimage_header$ Чёрная цитадель Горнила"
 gh_pilgrimage.0025.desc: "На скалистом плато у северной границы с мелкими владениями личей я достигаю могучих Чёрных врат Крёзона — Горнила. Гладкие эбеновые стены покрыты эзотерическими чарами, высеченными [Concept('antimagic_orders','антимагическими орденами')|E], для которых эта каменная цитадель стала домом. На многие мили перед крепостью тянется сеть высоких укреплённых башен, передающих сигналы с помощью зеркал.\n\nПройдя через врата, я поражаюсь мощи укреплений. Они сурово напоминают о единственном предназначении цитадели: защищать [Concept('chevalie','Шевалье')|E] от ненасытных [Concept('liches','личей')|E] северных пустошей. Личи вновь приходят в движение, и каждая зима суровее предыдущей — это видно по жёстким лицам мрачных ветеранов на стенах. Внутри ордена устроили целые школы, где зоркие новобранцы под руководством путевых отцов постигают Путь Очищения. У стены с именами десятков тысяч героев, павших за века нашествий нежити, я возношу молитву об усопших. Шевальенская мануфактория при цитадели производит особое оружие для орденов, в том числе арбалеты и светошумовые гранаты. Моя решимость крепнет, а сердце наполняется гордостью за стойкость и мужество нашего народа."
 gh_pilgrimage.0025.a: "В этом месте воплощена сила нашего народа."
 gh_pilgrimage.0025.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0026.t: "$pilgrimage_header$ Вечный пир"
 gh_pilgrimage.0026.desc: "Жестокий голод гложет меня по мере приближения к мерцающим огням и шуму празднества. Когда мы выходим на большую поляну в самой гуще леса, пойманные ягнята, привязанные к нашим лошадям, перестают сопротивляться, словно смирившись с неизбежным. Огромные полотняные шатры служат пиршественными залами для кардавайских воинов. Они празднуют своё будущее вознесение к богам на Вечном пиру и славят победу Кардвена над жестоким Мавлоком. Каждую ночь кардавайские воины со всей округи приносят сюда жертвы, чтобы последовать примеру богов — пировать.\n\nПозади главных шатров я прохожу мимо мрачных кухонь, вдыхая сладковатый дымный запах приготовленной плоти. По пути в шатёр знати я замечаю, что вокруг возводят более крупные постоянные здания из дерева и камня: наш народ хорошо освоился на новой родине. Упоённые празднеством воины, покрытые боевыми знаками, отбивают глухой ритуальный ритм на огромных барабанах из выделанной кожи наших жертв. Откусив мяса и запив его вином, я ощущаю глубокое наслаждение и, кажется, понимаю, что чувствуют боги."
 gh_pilgrimage.0026.a: "Мой голод утолен."
 gh_pilgrimage.0026.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0027.t: "$pilgrimage_header$ Поле битвы при Канитарне"
 gh_pilgrimage.0027.desc.mahndayanism: "Приближаясь к Полям смерти Канитарна, я вспоминаю, как ковался наш народ и какие жертвы мы принесли. Древняя речная долина, некогда цветущий и плодородный рай, превратилась в обжигающую пустошь нынешнего Кемсара. Именно здесь наши предки сокрушили рабовладельцев в Битве Разорванной цепи и заплатили кровью за величайшую святыню — свободу. Могущественное кхметское колдовство, обрушенное в тот день объединёнными кабалами кемсарских магов, навеки изменило эту землю: мелкий песок побелел, словно кость. Подвижные дюны часто обнажают древние груды пожелтевших костей и ржавого снаряжения. Не в силах сдержать чувств, я преклоняю колени перед одной из них и молюсь об усопших. Мёртвая луна, почитаемая кемсарийцами, словно оплакивает своих любимых детей: мелкие осколки [Concept('aervalr','Эрвала')|E] падают на Канитарн гораздо чаще, чем на любое другое место Саррадона. Эта земля поражает недугом всё живое, что задерживается здесь надолго, и я отправляюсь назад. На обратном пути бледная, болезненно-зелёная разбитая луна обрамляет ночное небо, а я твёрдо знаю: наш народ больше никогда не попадёт в рабство."
 gh_pilgrimage.0027.a: "Великая победа нашего народа."
 gh_pilgrimage.0027.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0028.t: "$pilgrimage_header$ Место рождения Пророка"
 gh_pilgrimage.0028.desc.mahndayanism: "После дня и ночи пути вглубь суровой пустыни над горизонтом появляются высокие пальмы. Это одинокий оазис посреди огромной древней пустоши, где впервые поселились восставшие рабы — предки современных амсарийцев. Я с облегчением укрываюсь в его тени. Говорят, бездонный источник в сердце оазиса, Слёзы Пророка, и окружающая его пышная растительность возникли словно по волшебству сразу после рождения святого Пророка на этих древних песках. Однако историографы Королевского университета Мейанкаран Софлы утверждают, что нашли свидетельства куда более почтенного возраста оазиса.\n\nТолпа истовых паломников, полубезумных пустынных аскетов и храмовых служителей расступается передо мной по пути к Святому месту рождения — неприметному, но древнему каменному жилищу, где, по преданию, родился Пророк. Его появление возвестила огромная кровоточащая комета в небе, а при рождении присутствовали четверо мудрейших хубаритских [Concept('magi','магов')|E]-судей Востока, предсказавших это событие и даровавших благословение. Вход в святая святых дозволен лишь царскому роду, и большинству паломников остаётся поклоняться скромному зданию издали. Осознав, что стою там, где Божественное впервые коснулось земли, я в благоговении опускаюсь на колени и безмолвно молюсь о грядущей победе Пророка и избавлении умирающего мира от, казалось бы, неизбежной гибели."
 gh_pilgrimage.0028.a: "Я чувствую благословение."
 gh_pilgrimage.0028.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0040.t: "$pilgrimage_header$ Престол Юга"
 gh_pilgrimage.0040.desc.wardenite: "[Concept('zahali','Мегаполис Захали')|E] расположен почти в самом центре Дамоты. Отсюда неверные боккары некогда правили всей страной, ожидая освобождения Мёртвого бога. В городе немало памятных мест и связанных с ними преданий, но ни одно не сравнится с [GetBuilding('01_tabik_betemisit').GetName] — Пустым дворцом, возведённым для Великого врага, которому предстояло править отсюда после освобождения.\n\nПо традиции в определённые дни дворец открыт для паломников. Переступив его порог, я испытываю лишь презрение к тем, кто воздвиг этот памятник злу: тёмная аура обители разгневанного бога проникает в самую душу. Глядя на стены, инкрустированные драгоценными камнями, нетрудно понять, как кто-то мог поддаться этому тёмному соблазну. Это понимание лишь укрепляет мою решимость продолжать нашу борьбу. Увидев тщательно оберегаемое сердце тьмы, я безмерно благодарю судьбу за то, что зловещие замыслы так и не осуществились."
 gh_pilgrimage.0040.a: "И никогда не осуществятся."
 gh_pilgrimage.0040.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0041.t: "$pilgrimage_header$ Храм Повелителя гнева"
 gh_pilgrimage.0041.desc.uakaklo: "После дня и ночи пути по болотистым и коварным дождевым лесам [Concept('cyrat_biozone','Кирата')|E] густой полог деревьев наконец расступается, открывая поляну. Над толпой верующих, заполнивших храмовый комплекс, возвышается невысокая ступенчатая пирамида из огромных базальтовых блоков. Этот колоссальный каменный храм посвящён Уатипочлю, Повелителю гнева. Разные секты по-разному определяют его место среди тридцати богов и тридцати одного демона пантеона Уакакло, но все чтут его как воплощение гнева. Этот бог-тиран некогда поработил тлакалаков, а затем в ярости едва не истребил мятежные разрозненные остатки народа на их южной родине, прежде чем те смогли бежать на север.\n\nБлагочестивые паломники расступаются передо мной, пропуская через каменный двор внутрь пирамиды. В самом сердце святилища меня встречает оскалившийся череп из сверкающего белого хрусталя — образ вечного и бессмертного Уатипочля. Его умастили священными маслами, окружили курильницами с благоухающими благовониями и увенчали пышным убором из нефритовых и бирюзовых перьев. Мой взгляд сразу притягивают два огромных рубина в пустых глазницах черепа. Внутри алых камней таится чернильная тьма, и стоит всмотреться в неё, как волны убийственной ярости заставляют меня пошатнуться. На низкой каменной плите перед идолом регулярно приносят кровавые жертвы, чтобы остудить его кипящий гнев. Мрачные и испуганные лица жрецов напоминают: тлакалаки поклоняются Уатипочлю не ради милости и благословения. Они надеются отвести от себя его жестокий пустой взгляд и молят его никогда не возвращаться, чтобы вновь обрушить неописуемые ужасы на нашу с таким трудом восстановленную цивилизацию и довершить её истребление."
 gh_pilgrimage.0041.a: "Я ухожу, дрожа и едва держась на ногах."
 gh_pilgrimage.0041.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0083.t: "$pilgrimage_header$ Падший"
 gh_pilgrimage.0083.desc.quwazaw: "Святое место Фендкия находится примерно в половине дня пути к северу от крепости Соултиджаннайка. Я иду туда вместе с другими паломниками через засушливые холмы и по дороге завожу несколько приятных знакомств. Наконец холмы расступаются, открывая небольшую долину, окружённую крутыми склонами. В её глубине возвышается огромный утёс.\n\nВсе статуи обращены вглубь святилища и расставлены в двенадцать рядов: от самых скромных у входа до наиболее богато украшенных. Большинство склонилось в поклоне, но некоторые гордо смотрят вверх. У самого утёса лежат руины исполинской фигуры, от которой сохранились лишь левая ступня и часть правой ноги. Это Падший, окружённый ослепительно прекрасными позолоченными статуями.\n\nКаждый ряд ограждён стеной и охраняется. Ограды входят в сложную систему опор и проходов, благодаря которой служители поддерживают статуи и ухаживают за ними. Чем ближе к руинам, тем большей чистотой должен обладать паломник. Лишь братьям и сёстрам, почти достигшим божественности, дозволено собираться среди самих руин. Неясно почему — возможно, этого не знают даже наши святейшие гуру, — но за состоянием руин Падшего следят внимательнее, чем за любой другой почитаемой статуей.\n\nМне любопытно, до какого ряда удастся дойти на этот раз, но на девятом местный гуру быстро велит мне удалиться после глубокого разговора о законе, времени и природе власти.\n\nПеред уходом я с разочарованием произношу наши священные слова."
 gh_pilgrimage.0083.a: "Пусть они не падут."
 gh_pilgrimage.0083.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0084.t: "$pilgrimage_header$ Сила души"
 gh_pilgrimage.0084.desc.quwazaw: "Дорога к Ифралимане оказывается неожиданно тяжёлой. То, что мне описывали как простую грунтовую дорогу через засушливые земли, на деле оборачивается целым днём пути под безжалостным солнцем. По дороге другие паломники один за другим падают от зноя, но никто не приходит им на помощь.\n\nЯ добираюсь до места на закате, всё ещё размышляя об испытании, заставившем меня смирить гордость. Внезапно ноги подкашиваются, и вот я уже на земле, едва удерживаясь на четвереньках. Поднимаю голову — и при первом же близком взгляде на статую у меня перехватывает дыхание. Её холодный взор твёрдо устремлён на восток, а боевая стойка словно готова выдержать натиск любого врага. Изваяние изображает закалённого воина — угловатого и крепкого, залитого багровым светом пустынного заката. И тут я понимаю: дело не во внезапной усталости. Моё тело само склонилось перед воплощением нашего бога, Того, кто хранит всех нас. О нём сложено множество преданий. Кем он был: непобедимым героем, легендарным воином? Уже неважно, ведь теперь он бог.\n\nЧерез несколько мгновений я присоединяюсь к братьям и сёстрам, собравшимся в длинной тени статуи, которая простирается над суровой пустыней. Под его защитой мы отдыхаем, опираясь и на нашего господина, и друг на друга. Веки тяжелеют, конечности наливаются свинцом под внезапной, но странно успокаивающей тяжестью. Затем приходит самый глубокий сон в моей жизни, а пробуждение кажется началом новой жизни.\n\nПоднимаясь, я смотрю на огромную статую, за которой восходит солнце, и понимаю, что моё время здесь подошло к концу."
 gh_pilgrimage.0084.a: "Обратный путь будет легче."
 gh_pilgrimage.0084.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0085.t: "$pilgrimage_header$ Взгляд Живого"
 gh_pilgrimage.0085.desc.quwazaw: "О Гхарстире говорят нечасто, а увидеть его своими глазами приезжают и того реже. Меня привлекают и доступность святыни, и её необычное расположение: реликвия стоит ровно между Ифралимане и Сайдалом, словно возвышаясь над ними обоими. От Хартхахи'а сюда всего несколько часов пути по дороге, которая внезапно обрывается у святилища. По прибытии я замечаю не больше дюжины паломников. Все они сидят перед печально известной статуей, почти не глядя на неё. Они встревожены, а некоторые выглядят потрясёнными.\n\nПри столь малом внимании я [Select_CString(ROOT.Char.IsFemale, 'ожидала', 'ожидал')] увидеть нечто скромное, однако Гхарстир оказывается одной из самых крупных статуй. Передо мной ребёнок, распростёртый в пыли, словно только что упавший. Он кажется раненым или по меньшей мере глубоко несчастным. Его простые одежды раскрашены яркими красками, но поклонники заботятся о статуе далеко не так усердно, как о других богах. Левая рука тянется на север, а взгляд устремлён к кончикам пальцев. На лице смешались гнев, почти ненависть и жажда мести, но вместе с ними — печаль и мука. Неужели таков взгляд бога?\n\nЯ кладу ладонь на его палец и чувствую жалость. Сидящий по другую сторону алтаря брат встречает мой взгляд и лишь пожимает плечами с таким же недоумением."
 gh_pilgrimage.0085.a: "Бедный ребёнок."
 gh_pilgrimage.0085.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0086.t: "$pilgrimage_header$ Дыхание жизни"
 gh_pilgrimage.0086.desc.quwazaw: "Путь по узкой тропе между холмами проходит спокойно, и с каждым шагом идти становится всё легче. В конце пути, понемногу открываясь между нависшими скалами, предстаёт статуя, окружённая почтительным молчанием множества паломников. По величию ей нет равных во всём Саррадоне.\n\nЖенская фигура величественна и прекрасна, как рассвет. Она с надеждой смотрит на запад, едва сдерживая улыбку. Кажется, она глубоко вдыхает, и возникает ощущение, будто фигура парит над землёй. Складки одежд и светлые волосы словно танцуют на ветру. Она стоит на кончиках пальцев правой ноги, подавшись грудью вперёд, а левая нога свободно отведена назад. Моя вера становится лишь крепче. Разве это всего лишь высеченный камень? Произведение искусства? Но разве это вообще произведение? Передо мной лишь красота — красота богини.\n\nГруппа особо набожных братьев и сестёр заботится об этой госпоже. Вокруг нет суеты, которой можно было бы ожидать в столь священном месте. Все мы пребываем в тишине, почитая застывших владык и любуясь ими.\n\nМысли и благоговение поглощают меня настолько, что я забываю о времени. Лишь увидев, как закат окрашивает спину изваяния в красный цвет, понимаю: день подходит к концу. На обратном пути моя душа словно освобождается от неясной тяжести."
 gh_pilgrimage.0086.a: "Какое облегчение."
 gh_pilgrimage.0086.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0315.t: "$pilgrimage_header$ Священное прошлое"
 gh_pilgrimage.0315.desc.graveright: "К братской могиле Сакренё ведёт печально известная грунтовая дорога. Даже в ясный день она лежит в сумрачном свете и тянется прямо на север, к [Concept('the_lichdoms','Личествам')|E]. Безжизненные равнины по сторонам странно давят, будто здесь что-то не так, а на горизонте паломникам видна сама граница. У входа меня встречают два жреца и просят о пожертвовании. Один служит Погребальному праву, другой — Стражам могил. Оба собирают средства для своей общины: первый хочет сохранить нашу веру, второй — реформировать её. Я, разумеется, жертвую последователям Погребального права, ведь они яростнее всех защищают память о нашем прошлом.\n\nИдя по кладбищу, я пересекаю несколько концентрических кругов могил и достигаю центра. Над просторной площадью возвышается статуя плачущей ойейницкой женщины, простёршей руки к земле. Разумеется, все могилы пусты — и не без причины: нашим мёртвым нельзя позволить вновь обратиться против нас. Но помнить их необходимо, в каком-то смысле возвращать их души в нашу жизнь. Только не прежним путём. Мы чтим наши обряды, историю и обычаи — всё, чем некогда были.\n\nЯ молча присоединяюсь к единоверцам перед украшенной сланцевой плитой с надписью на нашем древнем языке, ещё не превратившемся в очередной шевальенский диалект. Мысленно повторяю высеченные молитвы и любуюсь прекрасным орнаментом. Внезапно сердце пронзает острая боль. Столько всего утрачено. Наш долг — нести эту память дальше."
 gh_pilgrimage.0315.a: "Мы выстоим."
 gh_pilgrimage.0315.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0316.t: "$pilgrimage_header$ Противоестественный сад"
 gh_pilgrimage.0316.desc.graveright: "Путь в Тильес — пожалуй, самое монотонное и скучное путешествие в моей жизни. Уже несколько дней вокруг тянется бесконечная череда равнин и холмов, поросших сероватой травой. Взгляд бесцельно блуждает по пейзажу, когда в глаза бросается вспышка красного — наконец-то я на месте!\n\nЯ иду на шум воды и привязываю лошадь к яблоне на речном берегу. Вверх по течению тянется печально известный сад. Сам по себе он выглядел бы лишь необычно, если бы не плоды. Тильесские яблоки, также известные как Кровавые, вдвое больше моего кулака, а их цвет настолько насыщенный, что будто сам исходит от них. Нигде в округе не встретишь такого оттенка — ни на плодах, ни на знамёнах!\n\nДругие гадают, откуда взялись такие яблоки, но мне причина кажется очевидной. Вода здесь мутная, почти молочная, и другой такой в этих краях нет. Неудивительно: это единственный поток, берущий начало в земле мёртвых. Возможно, дело в странном побочном эффекте или заклинании [Concept('liches','личей')|E]. Как бы то ни было, ничего хорошего от этого ждать не стоит."
 gh_pilgrimage.0316.a: "Никому не следует есть плоды мёртвых."
 gh_pilgrimage.0316.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0317.t: "$pilgrimage_header$ На страже истории"
 gh_pilgrimage.0317.desc.graveright: "При подъёме на огромный холм Префаллия у меня почти перехватывает дыхание. На вершине возвышается грозное сооружение «Народная память», обращённое к северу. Крутой путь пролегает среди заострённых камней, намеренно обтёсанных так, чтобы любая ошибка стала смертельной для существа, лишённого обычной координации. Например, для нежити. К счастью, сам путь достаточно удобен, а паломники выдалбливают зацепы, которыми смогут воспользоваться те, кто придёт следом. В конце концов, это прежде всего святыня, а уже затем крепость.\n\nНа вершине царит суета. Могильные стражи превращают это место в настоящую твердыню: несут караул, возводят баррикады и небольшими группами обсуждают планы обороны. Я быстро присоединяюсь к другим последователям Погребального права в помещении, похожем на часовню в центре сооружения. Все здесь полны решимости сделать крепость последним рубежом защиты нашей истории от самой Смерти. Чтобы сохранить воспоминания всеми возможными способами, нужен вклад каждого верующего. Это свидетельство нашего выживания. В одном из похожих на соты коридоров я вижу комнату, где люди лихорадочно записывают семейные предания и складывают рукописи в переполненную библиотеку; дальше создают общую картину утраченного дворца Просвещённости Вравсил.\n\nНаконец я нахожу группу знати, пытающуюся распутать славные родословные в сложной паутине генеалогических древ. Остаток пребывания уходит на долгие споры о престиже, пока не становится ясно: один безвестный барон занимается этим уже несколько месяцев и уступать не намерен. Я называю свой титул, но совет мнимых королей не считает законными никакие шевальенские права. К рассвету я уже отправляюсь в обратный путь."
 gh_pilgrimage.0317.a: "Наша история надёжно защищена."
 gh_pilgrimage.0317.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0318.t: "$pilgrimage_header$ Скорбь по прошлому"
 gh_pilgrimage.0318.desc.graveward: "К братской могиле Сакренё ведёт печально известная грунтовая дорога. Даже в ясный день она лежит в сумрачном свете и тянется прямо на север, к [Concept('the_lichdoms','Личествам')|E]. Безжизненные равнины по сторонам странно давят, будто здесь что-то не так, а на горизонте паломникам видна сама граница. У входа меня встречают два жреца и просят о пожертвовании. Один служит Погребальному праву, другой — Стражам могил. Оба собирают средства для своей общины: первый хочет сохранить нашу веру, второй — реформировать её. Я, разумеется, жертвую Могильным стражам: как и они, я считаю, что наш народ должен выжить любой ценой.\n\nИдя по кладбищу, я пересекаю несколько концентрических кругов могил и достигаю центра. Над просторной площадью возвышается статуя плачущей ойейницкой женщины, простёршей руки к земле. Разумеется, все могилы пусты, а «ритуал» — лишь воспоминание о старых обычаях. Верующие повторяют молитвы перед украшенной черепами и костями сланцевой плитой. Надпись на ней сделана на нашем древнем языке, которого большинство из них даже не понимает.\n\nВ голову приходит отвратительная мысль. Неужели вот во что превратилась наша традиция? Мы разыгрываем представление перед ложными реликвиями и повторяем устаревшие обряды? Делаем вид, будто наш народ не был [Concept('sorrowing_of_oejeynica','истреблён')|E] именно из-за этих обычаев? Эти могилы нужно открыть, чтобы каждый видел: они пусты. Скорбеть следует о прошлом.\n\nЯ неодобрительно качаю головой и присоединяюсь к другим Могильным стражам на аллее внешнего круга."
 gh_pilgrimage.0318.a: "Мы выстоим."
 gh_pilgrimage.0318.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0319.t: "$pilgrimage_header$ Кровавый рынок"
 gh_pilgrimage.0319.desc.graveward: "Путь в Тильес — пожалуй, самое монотонное и скучное путешествие в моей жизни. Уже несколько дней вокруг тянется бесконечная череда равнин и холмов, поросших сероватой травой. Наконец я выхожу на мощёную дорогу, ведущую к огромному рынку. Все прилавки завалены громадными яблоками — печально известными Кровавыми яблоками.\n\nНо славу им принесли не только размеры, а ещё цвет и происхождение, на которое намекает само название. Стоит слишком долго смотреть на полную корзину, как от насыщенной красноты кожуры начинает болеть голова. Цвет будто перекидывается на соседние предметы, словно заразная магия. Ещё здесь есть ручей в долине Тильеса с необычной водой. Местные говорят, что во время засухи она становится почти молочной. Её можно пить и использовать в готовке; вкус у неё резковатый, зато запаха нет. Зная, что река берёт начало в земле мёртвых, остаётся лишь гадать, что за вещество в ней течёт.\n\nИ всё же как последователи Погребального права, так и Могильные стражи одинаково наслаждаются плодами местного, пусть и весьма странного сада. Паломники толпятся у лавок, выбирают лучшие яблоки и обмениваются ими. Я покупаю два плода на память и отправляюсь домой."
 gh_pilgrimage.0319.a: "Пора отведать Кровавых яблок."
 gh_pilgrimage.0319.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0320.t: "$pilgrimage_header$ На страже истории"
 gh_pilgrimage.0320.desc.graveward: "При подъёме на огромный холм Префаллия у меня почти перехватывает дыхание. На вершине возвышается грозное сооружение «Народная память», обращённое к северу. Крутой путь пролегает среди заострённых камней, намеренно обтёсанных так, чтобы любая ошибка стала смертельной для существа, лишённого обычной координации. Например, для нежити. К сожалению, между надёжной защитой и удобством для паломников нашли компромисс: в камне выдолбили зацепы для будущих посетителей — будь то паломники или захватчики. В конце концов, это прежде всего крепость, а уже затем святыня, разве нет?\n\nПо прибытии наша группа разделяется. Последователи Погребального права сторонятся занятых Могильных стражей и спешат в часовню — похожий на лабиринт музей устных и письменных воспоминаний об Ойейнице. Остальным, включая меня, копаться в прошлом неинтересно. Слева от входа толпятся Могильные стражи, собравшиеся вокруг деревянной доски со списком дел. Церкви, как выясняется, нужны новые способы защиты от армий Личеств, а меня сразу привлекает задача разработать путь отхода из крепости.\n\nНад планом трудится ещё дюжина знатных особ. Мы решаем, что проход должен быть односторонним, чтобы никто не смог по нему проникнуть в крепость.\n\nПредложений множество. Я всеми силами стараюсь оставить след в проекте, но мою идею записывают — и тут же отвергают. Несколько дней я помогаю с простой работой, а затем уезжаю, зная, что оборона в надёжных руках."
 gh_pilgrimage.0320.a: "Наша история надёжно защищена."
 gh_pilgrimage.0320.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.1001.t: "$pilgrimage_header$ Башни откровения"
 gh_pilgrimage.1001.desc: "Башню видно уже много дней пути, но лишь теперь, стоя у подножия чудовищного сооружения, я осознаю истинные размеры [GetBuilding('01_sophocos').GetName]. Огромное поле вокруг монумента гудит от множества таких же паломников, а на колоссальной башне видны едва различимые точки — люди, совершающие восхождение.\n\nНаконец-то я здесь!"
 gh_pilgrimage.1001.a: "Да будет благословенна каждая из 1001 ступени!"

 gh_pilgrimage.0401.t: "Священные игры у Шеи Каширията"
 gh_pilgrimage.0401.desc.gftg: "Здесь великие и широкие истоки сужаются в единое русло, и рождается священная река Каширият. Мы, верующие, называем это место «Шеей». Говорят, в небесном отражении именно отсюда боги открывают Небесной реке свои непостижимые замыслы, чтобы она исполнила их волю на [Concept('aeras','Эрасе')|E].\n\nСвятыня у Шеи — амфитеатр, врезанный в янтарный песчаник речного берега. Внизу раскинулось травяное поле, где проходят священные игры. Уже сейчас оно полно нетерпеливых участников, которые разминаются и готовятся к вечерним состязаниям. Излюбленное искусство здесь — метание диска в подражание священным камням-вестникам, которые боги вкладывают в устье Каширията. Если присоединиться к состязаниям, у меня появится шанс прославиться под взором Небес. Можно и остаться на трибунах — в этом нет ничего постыдного, а благодаря моему положению мне достанется достойное место с видом на игру, которая обещает быть захватывающей!"
 gh_pilgrimage.0401.a: "Я приму участие в играх!"
 gh_pilgrimage.0401.a.excellent: "Никто не метнёт диск дальше вас."
 gh_pilgrimage.0401.a.good: "Вы выступите достойно."
 gh_pilgrimage.0401.a.failure: "Вы опозоритесь перед всем миром."
 gh_pilgrimage.0401.b: "Нет, я лучше посмотрю."
 gh_pilgrimage.0401.toast: "Моё выступление на играх"
 
 gh_pilgrimage.0402.t: "Священные игры на Дальнем берегу"
 gh_pilgrimage.0402.desc: "Дальний берег — самое загадочное из всех наших священных мест. Жрецы говорят, что на небесах это обитель ещё не рождённых — бесформенных и непробуждённых. Лишь пройдя через великие воды к Устью, они получают право принять смертный облик и присоединиться к нам в этом мире.\n\nЦель моего паломничества — обнесённый стеной ипподром, который когда-то наверняка был великолепен. Увы, за века грабежей и периодических гонений со стороны [Concept('aversaria','аверсарианцев')|E] его прекрасные мозаики и захватывающие дух статуи были осквернены и похищены. Но сооружение сохранилось достаточно хорошо, чтобы по-прежнему служить священной цели — быть ареной для гонок на колесницах. Может, лучше присоединиться к жрецам и мудрецам на трибунах и не рисковать смертью или увечьем? Ни одна из наших игр не уносит столько жизней. Или всё же выйти на арену к безрассудным смельчакам, которые моют лошадей и смазывают оси колесниц перед вечерними гонками?"
 gh_pilgrimage.0402.a: "Я приму участие в гонках!"
 gh_pilgrimage.0402.a.excellent: "Победа! Я прихожу к финишу раньше всех!"
 gh_pilgrimage.0402.a.good: "Я достойно провожу заезд и не получаю ни царапины."
 gh_pilgrimage.0402.a.failure: "Меня выбрасывает из колесницы — я получаю ранение!"
 gh_pilgrimage.0402.a.badfailure: "Моя колесница сталкивается с другой — серьёзно ранены все участники столкновения."
 gh_pilgrimage.0402.a.death: "Я погибаю среди визжащих лошадей и обломков колесниц."
 gh_pilgrimage.0402.b: "Я только посмотрю."
 
 gh_pilgrimage.0403.t: "Игры у Развилья Кутанаги"
 gh_pilgrimage.0403.desc: "Место, где Кутанаги разделяется на рукава, считают осью мира — точкой, вокруг которой вращается вся судьба. Здесь бесчисленные военачальники переходили реку, а некоторые погибали в чудовищных наводнениях, порой затопляющих окрестные земли, когда боги велят Кутанаги нести смерть недостойным.\n\nСвященное развилье — самое непритязательное из наших святых мест. Это всего лишь грязная беговая дорожка в пойме, проложенная вокруг подобия холма — пологого купола, гораздо более широкого, чем высокого. О некогда стоявшем здесь храме напоминают лишь несколько камней, торчащих из грязи, и две одинокие арки на вершине холма.\n\nЗдесь состязаются в беге: участникам предстоит обогнуть обширный холм, пока зрители отдыхают на траве и наблюдают. Игры проходят в сезон паводков, поэтому трасса уже грязная и опасная, а бегуны собрались на самом холме, чтобы размяться и подготовиться. Присоединиться к ним?"
 gh_pilgrimage.0403.a: "Пора пробежаться!"
 gh_pilgrimage.0403.a.excellent: "Мне удаётся удержаться на ногах и отлично пробежать все три круга, ни разу не упав!"
 gh_pilgrimage.0403.a.good: "Несколько раз поскальзываюсь, но в остальном выступаю хорошо."
 gh_pilgrimage.0403.a.failure: "К финишу я прихожу с ног до головы в грязи под смех зрителей."
 gh_pilgrimage.0403.a.badfailure: "Я поскальзываюсь, получаю травму и не могу закончить забег."
 gh_pilgrimage.0403.b: "Я лучше посмотрю с холма."
 
 
 gh_pilgrimage.0404.t: "Игры в Священных пределах"
 gh_pilgrimage.0404.desc: "Священные пределы Чойргая — одно из великих чудес нашей веры, сохранившихся до наших дней. Огромные храмы трёх всемогущих проявлений Небесной реки возвышаются над верующими, и мореходы видят их за много миль. Год за годом усилиями верующих и молитвами жрецов великие зиккураты становились всё выше. Крупнейший из них теперь насчитывает четыре яруса и почти поглотил остров, на котором был возведён.\n\nЗдесь состязаются в метании копья, повторяя подвиг великого царя Куланура, который в незапамятные времена сразил дракона-тирана Кибридеса. Каждый год паломники прибывают издалека, чтобы повторить этот подвиг: они мечут копья в огромную украшенную самоцветами мозаику с изображением огнедышащего чудовища, напоминая богам, что мы достойны их милости. Поскольку состязание сравнительно безопасно, участвовать должны все, кроме стариков и немощных."
 gh_pilgrimage.0404.a: "Я метну копьё!"
 gh_pilgrimage.0404.a.excellent: "Я попадаю Кибридесу прямо в глаз!"
 gh_pilgrimage.0404.a.good: "Я попадаю в Кибридеса!"
 gh_pilgrimage.0404.a.failure: "Моё копьё отскакивает от земли. Увы!"
 gh_pilgrimage.0404.a.badfailure: "Умудряюсь пронзить копьём собственную ногу..."
 gh_pilgrimage.0404.b: "Я лучше посмотрю на игры."
 
 gh_pilgrimage.0405.t: "Игры у Излияния"
 gh_pilgrimage.0405.desc: "Излияние — место, где души, покидающие [Concept('aeras','Эрас')|E], уходят из мира в Запределье. В земном мире здесь река просто впадает в океан, но в Истинном отражении это водопад из чистейшей ртути, низвергающийся в великую звёздную бездну. Особенно священным место считается после сезона паводков. Тем, кому посчастливилось оказаться здесь в это время, открывается поток праздничных свечей, зажжённых верующими выше по течению.\n\nЗдесь проходит самая странная из игр, которыми мы стремимся впечатлить богов, — театральное состязание. В других краях театр служит непристойным и откровенно порнографическим развлечениям, но здесь, в великом амфитеатре Сайнхада, это искусство сохраняет чистейшую форму. На сцене ставят божественные комедии, дошедшие из далёкого прошлого, а труппа по большей части состоит из паломников. Присоединиться к ним или занять место в зрительном ряду и насладиться представлением, которое наверняка запомнится надолго?"
 gh_pilgrimage.0405.a: "Я присоединюсь к труппе!"
 gh_pilgrimage.0405.a.excellent: "Моё выступление встречают бурными овациями"
 gh_pilgrimage.0405.a.good: "Я выступаю вполне достойно"
 gh_pilgrimage.0405.a.failure: "Я допускаю несколько неловких ошибок"
 gh_pilgrimage.0405.a.badfailure: "Постойте, почему все смеются? Это не комедия!"
 gh_pilgrimage.0405.b: "Усядусь поудобнее и посмотрю представление!"
 
 gh_pilgrimage.0406.t: "Игры у Чаши Каширията"
 gh_pilgrimage.0406.desc: "У Чаши всегда была неоднозначная слава. Согласно нашей вере, здесь Кутанаги извергает все мерзкие яды и ритуальную скверну, которыми мы, смертные, отравили её. За это Небесная река время от времени жестоко мстит недостойным и маловерным. Над озером и полем, где верующие сражаются без оружия под взором богов, возвышается удивительно скромный зиккурат. Говорят, на вершине живёт оракул, которого не смеет видеть никто, кроме жрецов. Иначе Кутанаги разгневается и по велению богов сотрёт человечество с лица земли. Почему всё устроено именно так, смертным знать не положено.\n\nВ чашеобразной впадине верующие борются, а победители прижимают проигравших к земле. Оружие, перчатки и одежда запрещены, но прочих правил почти нет. Самые безжалостные соперники нередко выдавливают глаза или выворачивают конечности. Зрители сидят на склонах нижнего яруса зиккурата, наблюдают за схватками внизу и делают ставки. Присоединиться к мускулистым борцам, которые разминаются и проводят учебные схватки перед боем? Или пойти к шумным зрителям и просто насладиться поединком?"
 gh_pilgrimage.0406.a: "Я присоединюсь к бойцам!"
 gh_pilgrimage.0406.excellent: "Я уверенно отправляю соперника в нокаут под рёв толпы"
 gh_pilgrimage.0406.good: "Бой выходит равным, но в конце я побеждаю."
 gh_pilgrimage.0406.neutral: "Я проигрываю, но бой всё равно выходит хорошим."
 gh_pilgrimage.0406.failure: "После унизительного поражения я ухожу, прихрамывая от боли, но без серьёзных травм."
 gh_pilgrimage.0406.badfailure: "Соперник явно наслаждается, жестоко избивая и унижая меня к восторгу толпы."
 gh_pilgrimage.0406.b: "Нет уж, спасибо. Я посмотрю вместе со зрителями!"

 gh_pilgrimage.0407.t: "$pilgrimage_header$ Пещера Башенного взора"
 gh_pilgrimage.0407.desc.anaanides: "Путь к пещере Давгри пустынен и опасен: немало анаанидских паломников погибло, пытаясь добраться до этого отдалённого места. Пещера Башенного взора славится необычным [Concept('magic','магическим')|E] свойством: зрение того, кто смотрит наружу из её устья, многократно обостряется. Отсюда можно увидеть земли за много лиг и в подробностях рассмотреть далёкую башню [GetBuilding('01_sophocos').GetName]. Именно здесь знаменитый пророк Разин аль-Анани тысячу дней и ночей медитировал в одиночестве, созерцая [GetBuilding('01_sophocos').GetName] и составляя обряды, которым предстояло стать Ступенями очищения.\n\nВнутри пещера ничем не примечательна: ни убранства, ни символов, по которым её можно было бы узнать как место поклонения. Но стоит мне оглянуться на оставшееся за спиной отверстие, как поле зрения расширяется и весь пройденный путь оказывается виден целиком. Я устремляю взгляд на [GetBuilding('01_sophocos').GetName] и погружаюсь в глубокую медитацию."
 gh_pilgrimage.0407.a: "Поистине мистическое место."
 gh_pilgrimage.0407.b: "$pilgrimage.4001.b$"
 
 gh_pilgrimage.0408.t: "$pilgrimage_header$ Остров освобождения"
 gh_pilgrimage.0408.desc.anaanides: "Короткое плавание к острову Идруссна оказывается опасным: работорговцы рыщут по проливам в поисках живого товара. В крупной островной гавани находится торговое сердце Северного Харадамата. Портовые ряды ломятся от товаров со всех уголков Саррадона и континента. Духовностью это место не отличается, но для анаанидов оно важно: многие считают, что именно здесь их вера возродилась.\n\nСтрогие обычаи вели веру к угасанию. Отчаявшиеся анаанидские ревнители перехватили крупную партию кахсаридских рабов и освободили их от калистонских пленителей в обмен на обращение. В благодарность освобождённые с готовностью приняли анаанидскую веру и понесли её на далёкий запад, к себе на родину, тем самым сохранив её от исчезновения. Успех показал ревнителям, насколько действенным может быть новый способ приобретать последователей. Они довели его до формы, которую практикуют и поныне, по иронии судьбы переняв многое у тех же калистонитов, у которых отняли рабов.\n\nБез особого интереса разглядывая товары в порту, я размышляю, хватит ли мне решимости сделать всё необходимое ради спасения веры."
 gh_pilgrimage.0408.a: "Каждая душа должна получить возможность пройти путь в Анаан."
 gh_pilgrimage.0408.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0409.t: "$pilgrimage_header$ Поле вознесения"
 gh_pilgrimage.0409.desc.anaanides: "Бесплодные и непримечательные поля Макмодхани годами служили лишь дорогой для паломников и учёных, направлявшихся к Великому храму Эль-Кулата. Но для анаанидов это одна из основ веры: именно здесь пророк Разин отказался исполнить волю пленителей, сделал Последний шаг, и его охватил столп пламени. Когда огонь погас, от пророка не осталось и следа. С тех пор его именуют Разином аль-Анани — первым, кто завершил путь в Анаан.\n\nМожно сказать, что анаанидская вера по-настоящему родилась именно здесь. Потрясённые последним деянием Разина, последователи пророка начали распространять учение своего наставника среди окрестных поселений. Я преклоняю колени на бесплодной земле и обещаю повторить успешный путь пророка."
 gh_pilgrimage.0409.a: "Однажды и я достигну Анаана."
 gh_pilgrimage.0409.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0410.t: "$pilgrimage_header$ Позолоченный дворец"
 gh_pilgrimage.0410.desc.anaanides: "Касмудха, Позолоченный дворец, — одно из величайших сооружений [Concept('aeras','Эраса')|E], признанное одним из Великих чудес Саррадона. Двенадцать круглых башен окружают дворец идеальным кольцом и соединены крепостными стенами. Всё покрыто слоем золота, благодаря которому дворец и получил своё прозвание. Вдоль дороги к золотым воротам стоят многочисленные статуи разных военачальников, а сами ворота сейчас закрыты для чужаков.\n\nНекогда дворец принадлежал ритуалистскому военачальнику Узаку Дхаму. В третьем веке он и все его подданные были пожраны [Concept('the_worldeater','Пожирателем миров')|E]. Хотя исполинский зверь прославился тем, что поглощал целые города, по непонятной причине он не тронул дворец. Для анаанидов Касмудха стала символом чистоты, пережившей катастрофу. Они верят: как Пожиратель миров распознал истинную сущность дворца и пощадил его, так и их чистые души переживут последний суд у врат Анаана.\n\nЕщё немного полюбовавшись роскошным дворцом, я отправляюсь обратно в окружающий его город."
 gh_pilgrimage.0410.a: "К концу пути моя душа будет столь же золотой, как этот дворец."
 gh_pilgrimage.0410.b: "$pilgrimage.4001.b$"

 gh_pilgrimage.0411.t: "$pilgrimage_header$ Священный [GetBuilding('01_sophocos').GetName]"
 gh_pilgrimage.0411.desc.ritualist: "$sophocos_quest.5001.desc$"
 gh_pilgrimage.0411.a: "При виде каждой благословенной ступени у меня на глазах выступают слёзы радости!"
 gh_pilgrimage.0411.b: "Разве прославленные паломники останавливались у подножия?! Я начну восхождение!"
 gh_pilgrimage.0411.b.cynical: "Если я не взберусь на эту каменную глыбу, мне потом всю жизнь будут это припоминать..."
 gh_pilgrimage.0411.c: "$pilgrimage.4001.b$"


 gh_pilgrimage.0412.t: "$pilgrimage_header$ Священный [GetBuilding('01_greattempleofelqulatha').GetName]"
 gh_pilgrimage.0412.desc.wardenite: "Наконец-то я у древнего храмового комплекса Эль-Кулата. Назвать его одним храмом значило бы умалить величие множества монументальных сооружений, покрывающих всю местность. Ещё издали над горизонтом видны высокие таинственные цитадели, словно путеводные маяки среди пустыни. Вблизи истинное величие города раскрывается лишь отчасти. Каждый вход украшен сложными тимпанами, где высечены истории, давно потерянные во времени. Каждая арка и колонна покрыта изящными изображениями и сценами: одни поблекли, другие остаются столь же яркими, как в день создания.\n\nПо мере приближения к великому храму каждое следующее сооружение кажется ещё более чуждым этому миру. Их архитектура непостижима, словно древнейшие из этих зданий изначально вовсе не были храмами. Я на мгновение останавливаюсь, чтобы полюбоваться внешней красотой великого храма — невероятно величественного строения с тонкими рельефами по всем стенам. Трудно поверить, что человек мог создать нечто настолько безупречное. Не спеша получаю благословение, а затем отправляюсь исследовать бесконечные коридоры и лестницы огромного комплекса. Говорят, бесчисленные комнаты Эль-Кулаты хранят множество тайн, хотя нижние уровни давно запечатаны. Проходят часы, я теряюсь в раскинувшихся залах, и, когда выход наконец находится, небо уже окрашивают сумерки."

