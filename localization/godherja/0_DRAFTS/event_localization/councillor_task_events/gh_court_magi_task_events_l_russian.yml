l_russian:

 court_magi_task.0010.t:0 "Игра с огнём"
 court_magi_task.0010.desc:0 "После стольких занятий — месяц за месяцем одни и те же трактаты, одни и те же ритуалы — я наконец чувствую настоящий прогресс! Теории, прежде казавшиеся непостижимыми, теперь легко укладываются в голове. Задачи, когда-то лишавшие меня всех сил, теперь не заставляют даже вспотеть. А заклинания... словно передо мной открылся совершенно новый мир!\n\nС каждым днём я всё увереннее овладеваю искусством [Concept('magi','мага')|E]. И наконец это начинают признавать все — не только льстецы и невежды, ничего не смыслящие в магии."
 court_magi_task.0010.a:0 "Кто знает, как далеко я зайду?"
 court_magi_task.0011.t:0 "Игра с огнём"
 court_magi_task.0011.desc:0 "[Select_CString(magic_tutored_child.IsFemale, 'Моя юная', 'Мой юный')] [magic_tutored_child.GetTitledFirstName] усердно изучает магию, совершенствуя [magic_tutored_child.GetHerHis] навыки. Подобные занятия довели бы любого ребёнка до исступления от скуки, но [magic_tutored_child.GetSheHe] не сдаётся, и [magic_tutored_child.GetHerHis] усилия наконец приносят плоды.\n\nСегодня утром [magic_tutored_child.GetSheHe] демонстрирует мне [magic_tutored_child.GetHerHis] новые навыки, и такой прогресс заслуживает похвалы. Похоже, [magic_tutored_child.GetSheHe] вскоре перейдёт к более сложным урокам магии: [magic_tutored_child.GetSheHe] уже изучает последний детский учебник в библиотеке, соответствующий [magic_tutored_child.GetHerHis] уровню!"
 court_magi_task.0011.a:0 "Посмотрим, как далеко ты сможешь зайти..."
				   
 court_magi_task.0020.t:0 "Игра с огнём"
