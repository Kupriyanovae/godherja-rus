 gh_war_in_heaven_struggle_ender_name: "Судьба региона [GetTitleByKey('h_sarradon').GetNameNoTierNoTooltip|U]"
 gh_war_in_heaven_struggle_ender_desc:0 "Центральный Саррадон едва не пал. Но когда узы ослабли, а Столпы затрещали под тяжестью вековых конфликтов, [founder.GetNameNoTooltip] [Select_CString(founder.IsFemale, 'встала', 'встал' )] как нерушимая скала. Война на небесах, возможно, еще не окончена, но тьма больше не пройдет через эти земли."
 gh_eastern_war_in_heaven_struggle_ender_name: "Отвоевание Восточного Саррадона"
 gh_eastern_war_in_heaven_struggle_ender_desc:0 "Скажут, что именно здесь переломный момент настиг задыхающиеся от пыли земли Восточного Саррадона. [founder.GetNameNoTooltip] [Select_CString(founder.IsFemale, 'принесла', 'принес' )] мир и процветание, достаточные для того, чтобы устоять и сохраниться на века."
 gh_far_eastern_war_in_heaven_struggle_ender_name: "Судьба Дальнего Востока"
 gh_far_eastern_war_in_heaven_struggle_ender_desc:0 "Сотни кампаний потерпели крах в попытке удержать эти земли. Забыты королевства и имена, земли терялись и отвоёвывались вновь. Но когда [founder.GetNameNoTooltip] [Select_CString(founder.IsFemale, 'начала', 'начал' )] подчинять себе Дальний Восточный Саррадон, все поняли: судьба региона решена."
 gh_western_war_in_heaven_struggle_ender_name: "Восстановление Западного Саррадона"
 gh_western_war_in_heaven_struggle_ender_desc:0 "Поколениями Западный Саррадон колебался, раздираемый варлордами и иноверцами. Но под властью [founder.GetNameNoTooltip] мир был восстановлен, а Война на небесах в этом регионе превратилась лишь в воспоминание."
 gh_far_western_war_in_heaven_struggle_ender_name: "Безопасность Дальнего Запада"
 gh_far_western_war_in_heaven_struggle_ender_desc:0 "Дальний Западный Саррадон находился далеко, пребывал в руках еретиков и казался недосягаемым. [founder.GetNameNoTooltip] [Select_CString(founder.IsFemale, 'доказала', 'доказал' )] обратное. Кампания за кампанией, [founder.GetNameNoTooltip] [Select_CString(founder.IsFemale, 'добилась', 'добился' )] того, что казалось невозможным."


