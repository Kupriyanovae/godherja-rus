 trait_gh_wardenite_aligned: "Сторонник варденитов"
 trait_gh_wardenite_aligned_desc:0 "Этот персонаж встал на сторону варденитов в Войне на небесах, поддерживая их дело и выступая против их врагов."
 trait_gh_wardenite_aligned_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] выступает на стороне варденитов в Войне на небесах, противостоя фракциям ритуалистов и их союзникам."

 trait_gh_ritualist_aligned: "Сторонник ритуалистов"
 trait_gh_ritualist_aligned_desc:0 "Этот персонаж примкнул к стороне ритуалистов в Войне на небесах, противостоя фракциям варденитов и их союзникам."
 trait_gh_ritualist_aligned_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'примкнула', 'примкнул' )] к стороне ритуалистов в Войне на небесах, противостоя фракциям варденитов и их союзникам."

 trait_gh_agionist_aligned: "Сторонник агионистов"
 trait_gh_agionist_aligned_desc:0 "Этот персонаж встал на сторону агионистов в Войне на небесах, поддерживая их дело и выступая против их врагов."
 trait_gh_agionist_aligned_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] выступает на стороне агионистов в Войне на небесах, противостоя фракциям ритуалистов и их союзникам."
 
 
