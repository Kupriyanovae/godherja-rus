 gh_war_in_heaven_struggle.0001.t: "Война на небесах"
 gh_war_in_heaven_struggle.0001.desc.intro: "Саррадон истекает кровью от тысячи ран, каждую из которых разбередили старые обиды, и конца этому не видно. Древняя вражда проникает глубже самых глубоких колодцев, а цена этой бесконечной междоусобицы становится все выше.\n\n"
 gh_war_in_heaven_struggle.0001.desc.wardenite: "Мертвый Бог пробуждается, угрожая вырваться из своей темницы. Наша задача — как и всех истинных варденитов — укрепить Столпы и очистить эту землю от их ереси, пока Саррадон не поглотила извечная тьма!"
 gh_war_in_heaven_struggle.0001.desc.ritualist: "Заблудшие вардениты в своем еретическом ослеплении угрожают затмить истинный путь Софокоса. Я не позволю заковать правду в кандалы ложной догмы!"
 gh_war_in_heaven_struggle.0001.desc.involved: "Я оказываюсь между двух сил, которым нет дела до людей, страдающих в их тени. Возможно, пришло время зазвучать иному голосу."
 gh_war_in_heaven_struggle.0001.desc.interloper: "Эта бесконечная война между варденитами и ритуалистами обескровила Саррадон. Я выкрою место для своего народа из пепла их конфликта."
 gh_war_in_heaven_struggle.0001.a: "За Саррадон!"
 
 # Wardenite Victory
 gh_war_in_heaven_struggle.0100.t: "Победа варденитов"
 gh_war_in_heaven_struggle.0100.desc.opening: "Наконец-то хаос утихает, а последние крики наших врагов затихают вдали."
 gh_war_in_heaven_struggle.0100.multiple_rulers: "Тем не менее, пока мы празднуем, другие так называемые «Стражи» спорят из-за различных толкований учения [Concept('the_first_warden','Первого Стража')|E]. Лишь наше толкование способно обеспечить будущее этой земли. Их необходимо призвать к порядку — убеждением или силой."
 gh_war_in_heaven_struggle.0100.desc.single_ruler: "\n\nМоя власть в этом регионе отныне абсолютна. Из пепла старого мира дом [ROOT.Char.GetHouse.GetNameNoTooltip] восстал как неоспоримый властелин региона [ROOT.Char.Custom('WIHStruggleSubRegionName')]. Не осталось больше силы, способной бросить вызов нашему господству."
 gh_war_in_heaven_struggle.0100.ritualists_remain: "Ритуалистская скверна сломлена, но некоторые всё еще цепляются за свои жалкие владения в закоулках региона. Они — язва, которую необходимо выжечь дотла, прежде чем наша работа будет завершена."
 gh_war_in_heaven_struggle.0100.ritualists_gone: "Ритуалисты полностью разгромлены. Их богомерзкие обряды прекращены, а последователи развеяны по ветру."
 gh_war_in_heaven_struggle.0100.agionists_remain: "Даже сейчас агионистские падальщики кружат поблизости, надеясь поживиться обрезками нашего трудом завоеванного мира. Их пронырливость — угроза, которую нельзя долго игнорировать."
 gh_war_in_heaven_struggle.0100.agionists_gone: "Агионистские падальщики изгнаны, а их надежды нажиться на нашей борьбе разбились о твердыню нашей веры."
 gh_war_in_heaven_struggle.0100.desc.closing: "\n\nПусть весть разнесется повсюду: [ROOT.Char.Custom('WIHStruggleSubRegionName')] отныне под нашей защитой."
 gh_war_in_heaven_struggle.0100.a: "Лишь когда уверуют все, мир станет долговечным."
 gh_war_in_heaven_struggle.0100.b: "Земля истекает кровью, мы должны перевязать ее раны."
 gh_war_in_heaven_struggle.0100.c: "Они восстанут вновь, если оставить их в живых."

 #Involved Wardenite-Aligned Rulers
 gh_war_in_heaven_struggle.0101.t: "Общая победа"
 gh_war_in_heaven_struggle.0101.desc.intro: "Война в регионе [struggle_ender.Char.Custom('WIHStruggleSubRegionName')] окончена. Наш союз одержал верх, а наши общие враги в регионе повержены. Вардениты, при всем их фанатизме, оказались сокрушительно эффективными союзниками."
 gh_war_in_heaven_struggle.0101.desc.single_ruler: "\n\nТеперь [struggle_ender.GetTitledFirstName] правит новым могущественным оплотом варденитов.\n\nЭта победа пока служит интересам дома [struggle_ender.Char.GetHouse.GetNameNoTooltip], однако я [Select_CString(ROOT.Char.IsFemale, 'помогла', 'помог' )] возвыситься соседу, чей пыл уступает лишь его силе. С этим союзом нужно обращаться с осторожностью."
 gh_war_in_heaven_struggle.0101.desc.multiple_ruler: "\n\nРегион достался не какому-то одному правителю, а целой плеяде варденитских владык и их союзников, и каждый претендует на свою долю триумфа. К чему это приведет — пока неясно. Но сейчас война выиграна — и я [Select_CString(ROOT.Char.IsFemale, 'стояла', 'стоял' )] на стороне тех, кто выстоял."
 gh_war_in_heaven_struggle.0101.a: "Успешное партнерство."
 gh_war_in_heaven_struggle.0101.b: "Их рвение... внушает опасения."

 # For other non-wardenite rulers for wardenite victory
 gh_war_in_heaven_struggle.0102.t: "Мир Стражей"
 gh_war_in_heaven_struggle.0102.t.wardenite: "Триумф варденитов"
 gh_war_in_heaven_struggle.0102.desc.non_wardenite: "Вести из региона [struggle_ender.Char.Custom('WIHStruggleSubRegionName')] дошли до моего двора, принеся известие о завершении конфликта, так долго терзавшего эти земли.\n\nСилы варденитов сокрушили всякое сопротивление, подчинив себе весь [struggle_ender.Char.Custom('WIHStruggleSubRegionName')].\n\nХотя большая Война на небесах еще далека от завершения, вардениты закрепили за собой мощный оплот. Из этой цитадели они провозгласили новую эру процветания для своего народа. Дело варденитов обрело огромную силу, и их взор, вероятнее всего, скоро обратится вовне."
 gh_war_in_heaven_struggle.0102.desc.opening: "Издалека до нас долетели вести! Великая победа одержана во имя Первого Стража. [struggle_ender.Char.Custom('WIHStruggleSubRegionName')] перешел под контроль наших братьев."
 gh_war_in_heaven_struggle.0102.desc.same_faith: "\n\nИздали я наблюдаю с гордостью — и, возможно, с легкой завистью. То, чего они достигли, — немалый подвиг. Если там удалось выковать мир, в чем состоит мой долг здесь? Какое место я займу в грядущем порядке вещей?"
 gh_war_in_heaven_struggle.0102.desc.different_faith: "\n\nДом [struggle_ender.GetHouse.GetNameNoTooltip] одержал победу в интересах всего движения варденитов, и за это мы благодарны. Однако консолидация их власти в Саррадоне — это событие, за которым нужно пристально следить. Хотя нас и объединяет общий враг в лице ритуалистов, сила именно их секты может однажды бросить вызов нашей собственной."
 gh_war_in_heaven_struggle.0102.a: "Тиранический мир — это всё же мир."
 gh_war_in_heaven_struggle.0102.b: "Как скоро они обратят взор на наши земли?"
 gh_war_in_heaven_struggle.0102.c: "Будущее начинает обретать черты."
 gh_war_in_heaven_struggle.0102.d: "Посмотрим, чья правда выстоит."
 
 # Ritualist Victory
 gh_war_in_heaven_struggle.0200.t: "Триумф ритуалистов"
 gh_war_in_heaven_struggle.0200.desc.opening: "Знамена верных развеваются на ветру, пока последние вражеские еретики отступают за пределы региона [ROOT.Char.Custom('WIHStruggleSubRegionName')]."
 gh_war_in_heaven_struggle.0200.wardenites_remain: "И все же нам стоит проявлять осторожность: мелкие варденитские лорды все еще удерживают власть в отдаленных уголках региона."
 gh_war_in_heaven_struggle.0200.wardenites_gone: "Варденитская ересь в регионе [ROOT.Char.Custom('WIHStruggleSubRegionName')] была полностью искоренена. Ни один лорд их извращенной веры не остался, чтобы бросить вызов установленному нами праведному порядку."
 gh_war_in_heaven_struggle.0200.multiple_rulers: "Однако я не единственный правитель в этом регионе. Хоть мы и едины в вере, мы разделены в амбициях, и мне интересно, как долго продержится этот хрупкий союз по расчету."
 gh_war_in_heaven_struggle.0200.desc.single_ruler: "Весь [ROOT.Char.Custom('WIHStruggleSubRegionName')] в моих руках, и лишь мне решать судьбу этой разоренной войной земли и всех, кто на ней живет."
 gh_war_in_heaven_struggle.0200.agionists_remain: "$gh_war_in_heaven_struggle.0100.agionists_remain$"
 gh_war_in_heaven_struggle.0200.agionists_gone: "$gh_war_in_heaven_struggle.0100.agionists_gone$"
 gh_war_in_heaven_struggle.0200.desc.closing: "\n\nБудущее региона [ROOT.Char.Custom('WIHStruggleSubRegionName')] будет выковано по нашему образу и подобию, и только нашей рукой."
 gh_war_in_heaven_struggle.0200.a: "Мы должны обратить остальную часть региона."
 gh_war_in_heaven_struggle.0200.b: "Основное внимание следует уделить восстановлению"
 gh_war_in_heaven_struggle.0200.c: "Мы не можем позволить нашим врагам остаться."
 
 #Involved Ritualist-Aligned Rulers
 gh_war_in_heaven_struggle.0201.t: "$gh_war_in_heaven_struggle.0101.t$"
 gh_war_in_heaven_struggle.0201.desc.intro: "Война в регионе [ROOT.Char.Custom('WIHStruggleSubRegionName')] окончена. Наш союз одержал верх, а еретические вардениты сброшены со счетов. Праведники, при всей их преданности древним обрядам, оказались грозными союзниками в этом конфликте."
 gh_war_in_heaven_struggle.0201.desc.single_ruler: "\n\nТеперь [struggle_ender.GetTitledFirstName] правит единым домейном ритуалистов в регионе [struggle_ender.Char.Custom('WIHStruggleSubRegionName')].\n\nЭта победа продвигает дело дома [struggle_ender.Char.GetHouse.GetNameNoTooltip], но я [Select_CString(ROOT.Char.IsFemale, 'помогла', 'помог' )] создать соседа, чей религиозный пыл так же глубок, как и его амбиции. Это партнерство требует мудрого управления."
 gh_war_in_heaven_struggle.0201.desc.multiple_ruler: "\n\nРегион достался не одному правителю, а конфедерации ритуалистских лордов и их союзников, где каждый заявляет права на свою долю триумфа. Какую форму принимает этот новый порядок — еще предстоит увидеть. Но сейчас война выиграна — и я [Select_CString(ROOT.Char.IsFemale, 'стояла', 'стоял' )] на стороне победителей."
 gh_war_in_heaven_struggle.0201.a: "Верные получили свою награду."
 gh_war_in_heaven_struggle.0201.b: "Их преданность сильна... пожалуй, даже слишком."

 # For other non-ritualist rulers for ritualist victory
 gh_war_in_heaven_struggle.0202.t: "Победа ритуалистов"
 gh_war_in_heaven_struggle.0202.t.ritualist: "Триумф ритуалистов в регионе [struggle_ender.Char.Custom('WIHStruggleSubRegionName')]"
 gh_war_in_heaven_struggle.0202.desc.non_ritualist: "Из региона [struggle_ender.Char.Custom('WIHStruggleSubRegionName')] приходят вести о знаменательном финише долгой борьбы, разрывавшей этот край на части.\n\nСилы ритуалистов добились полной победы, сметя все сопротивление варденитов и подчинив своей власти весь регион.\n\nПока большая Война на небесах продолжает бушевать на других землях, ритуалисты закрепили за собой мощную твердыню. Из этого священного оплота они провозглашают возращение старых устоев и триумф древней веры. Предвещает ли это новый золотой век или возврат к темным временам — ясно одно: дело ритуалистов стало неизмеримо сильнее."
 gh_war_in_heaven_struggle.0202.desc.opening: "Радостные вести приходят из далекого края [ROOT.Char.Custom('WIHStruggleSubRegionName')]! Наши братья по вере одержали великую победу во имя старых богов и древних обычаев."
 gh_war_in_heaven_struggle.0202.desc.same_faith: "\n\nС этого расстояния я наблюдаю одновременно с гордостью и с тревогой. Их успех подтверждает истинность нашей общей веры, но в то же время вызывает вопросы о моем собственном положении. Если они принесли мир на свои земли через силу, то какому пути следует придерживаться мне?"
 gh_war_in_heaven_struggle.0202.desc.different_faith: "\n\nДом [struggle_ender.GetHouse.GetNameNoTooltip] завоевал победу для всего ритуалистского движения, и за это мы должны быть благодарны. Однако их укрепление в регионе [ROOT.Char.Custom('WIHStruggleSubRegionName')] требует внимания. Хотя мы и стоим единым фронтом против варденитской ереси, влияние их конкретной секты может однажды поставить под угрозу чистоту наших собственных традиций."
 gh_war_in_heaven_struggle.0202.a: "Древние пути незыблемы."
 gh_war_in_heaven_struggle.0202.b: "Как скоро они захотят расширить свои границы?"
 gh_war_in_heaven_struggle.0202.c: "Начинается новая глава."
 gh_war_in_heaven_struggle.0202.d: "Какая интерпретация возобладает?"

 # Generic Victory
 gh_war_in_heaven_struggle.0300.t: "Победа наконец-то"
 gh_war_in_heaven_struggle.0300.desc: "Пыль улеглась над регионом [ROOT.Char.Custom('WIHStruggleSubRegionName')], и я стою в одиночестве на вершине горы поверженных врагов.\n\nВесь [ROOT.Char.Custom('WIHStruggleSubRegionName')] преклоняет колени перед домом [ROOT.Char.GetHouse.GetNameNoTooltip]. Мне удалось то, в чем веками терпели крах фанатики и ревнивцы веры."
 gh_war_in_heaven_struggle.0300.a: "Это только начало."
 gh_war_in_heaven_struggle.0300.b: "Мы должны выковать нечто большее из этого пепла."

 # For other observing rulers for generic victory
 gh_war_in_heaven_struggle.0301.t: "Восхождение новой силы"
 gh_war_in_heaven_struggle.0301.t.same_faith: "Победа в регионе [ROOT.Char.Custom('WIHStruggleSubRegionName')]"
 gh_war_in_heaven_struggle.0301.desc.different_religion: "Донесения из региона [ROOT.Char.Custom('WIHStruggleSubRegionName')] сообщают о завершении жестокого конфликта, опустошавшего эти земли годами.\n\n[struggle_ender.GetTitledFirstName] выходит победителем, сокрушив как варденитских фанатиков, так и приверженцев ритуализма, чтобы утвердить власть над всем регионом. Возвысилась новая сила, и её намерения пока неизвестны."
 gh_war_in_heaven_struggle.0301.desc.opening: "Вести доходят до нас из региона [ROOT.Char.Custom('WIHStruggleSubRegionName')]: [struggle_ender.GetTitledFirstName] одерживает победу над враждующими фракциями и захватывает регион."
 gh_war_in_heaven_struggle.0301.desc.same_faith: "\n\nСоратник по вере преуспел там, где другие потерпели неудачу. Верные доказали свою силу."
 gh_war_in_heaven_struggle.0301.desc.different_faith: "\n\nДом [struggle_ender.GetHouse.GetNameNoTooltip] добился великой победы, хоть их пути и не совсем совпадают с нашими. За их триумфом в регионе [ROOT.Char.Custom('WIHStruggleSubRegionName')] стоит следить с интересом."
 gh_war_in_heaven_struggle.0301.a: "Победа говорит сама за себя."
 gh_war_in_heaven_struggle.0301.b: "В следующий раз они могут попытаться расшириться в другом месте."


 # Agionist Victory
 gh_war_in_heaven_struggle.0400.t: "Победа достигнута"
 gh_war_in_heaven_struggle.0400.desc.opening: "Война за [ROOT.Char.Custom('WIHStruggleSubRegionName')] завершилась. Я стою победителем над всеми, кто смел нам противостоять."
 gh_war_in_heaven_struggle.0400.multiple_rulers: "Несколько правителей теперь удерживают власть в регионе, и каждый сыграл свою роль в этом триумфе. Вопрос о том, что будет дальше, остается открытым."
 gh_war_in_heaven_struggle.0400.desc.single_ruler: "\n\nВесь [ROOT.Char.Custom('WIHStruggleSubRegionName')] принадлежит мне. От самой высокой башни до самой маленькой деревеньки — все признают мое правление."
 gh_war_in_heaven_struggle.0400.wardenites_remain: " Очаги варденитского сопротивления всё еще держатся в разрозненных крепостях, но их влияние тает с каждым днем."
 gh_war_in_heaven_struggle.0400.wardenites_gone: " Ни один варденитский лорд не остался, чтобы оспорить нашу власть в этом регионе."
 gh_war_in_heaven_struggle.0400.ritualists_remain: " Ритуалистские анклавы все еще усеивают эти земли, хотя их сила окончательно сломлена."
 gh_war_in_heaven_struggle.0400.ritualists_gone: " Фанатики-ритуалисты полностью сметены с земель [ROOT.Char.Custom('WIHStruggleSubRegionName')]."
 gh_war_in_heaven_struggle.0400.a: "Порядок из хаоса."
 gh_war_in_heaven_struggle.0400.b: "Кто вообще мог сомневаться в таком исходе?"
 
 #Involved Agionist-Aligned Rulers
 gh_war_in_heaven_struggle.0401.t: "$gh_war_in_heaven_struggle.0101.t$"
 gh_war_in_heaven_struggle.0401.desc.intro: "Война в регионе [ROOT.Char.Custom('WIHStruggleSubRegionName')] окончена. Наш союз преуспел, а религиозные экстремисты были отброшены. Агионисты зарекомендовали себя как невероятно эффективные партнеры в этом деле."
 gh_war_in_heaven_struggle.0401.desc.single_ruler: "\n\nТеперь [struggle_ender.GetTitledFirstName] правит процветающим новым торговым центром в регионе [ROOT.Char.Custom('WIHStruggleSubRegionName')].\n\nЭта победа на руку дому [struggle_ender.Char.GetHouse.GetNameNoTooltip], но я [Select_CString(ROOT.Char.IsFemale, 'помогла', 'помог' )] утвердиться соседу, чей аппетит столь же беспределен, как и его казна. С этим союзом нужно вести дела с точным расчетом."
 gh_war_in_heaven_struggle.0401.desc.multiple_ruler: "\n\nРегион перешел под контроль консорциума агионистских лордов и их союзников, где каждый забрал свою долю добычи. Какой порядок они установят, исходя из своих пересекающихся интересов, — покажет время. Но на данный момент война выиграна, и я [Select_CString(ROOT.Char.IsFemale, 'выбрала', 'выбрал' )] выгодную сторону."
 gh_war_in_heaven_struggle.0401.a: "Удачная сделка."
 gh_war_in_heaven_struggle.0401.b: "Их аппетиты могут оказаться ненасытными..."
 
 # For other observing rulers for agionist victory
 gh_war_in_heaven_struggle.0402.t: "Вести из [ROOT.Char.Custom('WIHStruggleSubRegionName')]"
 gh_war_in_heaven_struggle.0402.t.agionist: "Триумф агионистов"
 gh_war_in_heaven_struggle.0402.desc: "Из региона [ROOT.Char.Custom('WIHStruggleSubRegionName')] приходят вести о том, что долгая борьба там наконец завершилась.\n\n[struggle_ender.GetTitledFirstName] выходит победителем, сокрушив всё сопротивление местных саррадонцев и утвердив превосходство агионистов над всем регионом.\n\nЧто это значит для глобального конфликта — пока неясно, но одно можно сказать наверняка: баланс сил сместился."
 gh_war_in_heaven_struggle.0402.a: "Посмотрим, что из этого выйдет."
 gh_war_in_heaven_struggle.0402.b: "Возникают новые силы."




 gh_war_in_heaven_struggle.1000.t: "Законы небес"
 gh_war_in_heaven_struggle.1000.desc: "Вера небес сломлена. Конфликт, определявший жизнь целых поколений и затопивший континент кровью, завершен. Каждая потерянная душа, каждый сожженный город, каждая принесенная жертва вели к этому моменту абсолютной, окончательной победы. Отныне континент обязан познать долгожданный мир..."
 gh_war_in_heaven_struggle.1000.a: "Начинается новая эра варденитов."

 gh_war_in_heaven_struggle.1001.t: "Восстановление небес"
 gh_war_in_heaven_struggle.1001.desc: "Ангелы избавили нас от варденитской тьмы, и мир, наконец, вздохнул свободно.\n\nЦелые поколения не знали ничего, кроме тени их холодного, стерильного «порядка». Они обещали мир, но дали лишь клетку. Я [Select_CString(ROOT.Char.IsFemale, 'увидела', 'увидел' )] конец величайшей ереси этого мира. Пусть все помнят, что именно дом [ROOT.Char.GetHouse.GetNameNoTooltip] спас этот мир от тьмы."
 gh_war_in_heaven_struggle.1001.a: "Пусть весь мир узнает об этом."
 gh_war_in_heaven_struggle.1001.b: "Мы начинаем отсюда."


