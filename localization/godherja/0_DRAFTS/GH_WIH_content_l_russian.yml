 ######################################
 #                                    #
 #          GAME CONCEPTS             #
 #                                    #
 ######################################
 
 game_concept_great_struggle: "Великая борьба"
 game_concept_great_struggle_desc:0 "Великие борьбы — это масштабные, иногда охватывающие целые континенты конфликты, которые включают в себя несколько [Concept('struggle','борьб')|E] и их соответствующие [Concept('struggle_region_regions','регионы борьбы')|E]. Хотя каждая $game_concept_struggle$ развивается в соответствии с собственной локальной напряженностью, все они вносят вклад в общий ход единой $game_concept_great_struggle$.\n\nПри определенных условиях соседние регионы могут быть втянуты в $game_concept_great_struggle$. На [Concept('struggle_phase_phases','фазы борьбы')|E] в отдельных регионах может влиять траектория самой всеобъемлющей $game_concept_great_struggle$."
 
 game_concept_gh_war_in_heaven_struggle: "Борьба: Война на небесах"
 game_concept_gh_war_in_heaven_struggle_desc:0 "[war_in_heaven|E] воплощает в себе вековой конфликт веры и власти между [Concept('wardenism','варденитами')|E] и [Concept('ritualism','ритуалистами')|E] по всему Саррадону. Хотя неисчислимые [rulers|El] и секты возвышались и падали, главный раскол сохраняется с тех пор, как в конце III века поднялся [the_first_warden|E]. Регионы, вовлеченные в [struggle|El], постоянно смещаются между господством [Concept('wardenism','варденитов')|E] или [Concept('ritualism','ритуалистов')|E], а также [Concept('struggle_phase_phases','фазами')|E] разной интенсивности, где ни одна из сторон не может полностью подчинить себе другую."

 game_concept_struggle_wih_phase_wardenite_dominance: "Фаза господства варденитов"
 game_concept_struggle_wih_phase_wardenite_dominance_desc:0 "Вардениты одержали верх в конфликте $game_concept_gh_war_in_heaven_struggle$, утверждают свое учение и по возможности искореняют соперничающие доктрины.\n\nСопротивление сохраняется в отдельных очагах региона. Со временем давление будет возрастать, и конфликт может скатиться к зыбкой [Concept('struggle_wih_phase_detente','разрядке')|E] или вновь разгореться в [Concept('struggle_wih_phase_all_out_war','тотальную войну')|E]."
 
 game_concept_struggle_wih_phase_ritualist_dominance: "Фаза господства ритуалистов"
 game_concept_struggle_wih_phase_ritualist_dominance_desc:0 "$game_concept_struggle_wih_phase_ritualist_dominance$ отражает период, когда [Concept('ritualism','ритуалистские')|E] правители удерживают общий баланс сил.\n\nСо временем регион может перейти в состояние [Concept('struggle_wih_phase_detente','разрядки')|E] из-за взаимного истощения или перерасти в [Concept('struggle_wih_phase_all_out_war','тотальную войну')|E] по мере обострения конфликта."
 
 game_concept_struggle_wih_phase_agionist_dominance: "Фаза господства агионистов"
 game_concept_struggle_wih_phase_agionist_dominance_desc:0 "Агионисты решительно захватили контроль в конфликте $game_concept_gh_war_in_heaven_struggle$, навязывая свои порядки на чужих землях.\n\nХотя очаги сопротивления остаются, регион теперь подчиняется власти агионистов. Со временем ситуация может улечься в напряженную [Concept('struggle_wih_phase_detente','разрядку')|E] или вновь уступить место [Concept('struggle_wih_phase_all_out_war','тотальной войне')|E], если покоренные поднимутся на борьбу."

 game_concept_struggle_wih_phase_detente: "Фаза разрядки"
 game_concept_struggle_wih_phase_detente_desc:0 "$game_concept_struggle_wih_phase_detente$ знаменует собой затишье в общей борьбе. Ни вардениты, ни ритуалисты не обладают полным господством, и контроль остается предметом споров на многих фронтах. Открытые столкновения существенно ограничены, но напряженность сохраняется.\n\nЭта фаза часто предшествует крупным сдвигам. Она может привести к новому [Concept('struggle_wih_phase_wardenite_dominance','господству варденитов')|E] или [Concept('struggle_wih_phase_ritualist_dominance','господству ритуалистов')|E], либо перерасти в [Concept('struggle_wih_phase_all_out_war','тотальную войну')|E]."

 game_concept_struggle_wih_phase_all_out_war: "Фаза тотальной войны"
 game_concept_struggle_wih_phase_all_out_war_desc:0 "$game_concept_struggle_wih_phase_all_out_war$ представляет собой крах всех компромиссов. Враждебность по всему региону нарастает, сопровождаясь масштабными войнами и повсеместной нестабильностью. Попытки сохранить нейтралитет практически не учитываются.\n\nПо мере того как наступает истощение или одна из сторон берет верх, [struggle|El] может перейти в [Concept('struggle_wih_phase_wardenite_dominance','господство варденитов')|E] или [Concept('struggle_wih_phase_ritualist_dominance','господство ритуалистов')|E]."


