 kharazadim_footmen: "Харазадимы"
 kharazadim_flavor: "Сырой подлесок и пересеченная местность кажутся малопригодными для тяжелой пехоты, однако формирования, известные как харазадимы, специализируются на засадах и ближнем бое под кронами деревьев. Их строи обучены пробивать путь через неровный грунт и удерживать позиции там, где кавалерия или стрелки не смогут продвинуться."

 jarifin_lancers: "Джарифинские пикинеры"
 jarifin_lancers_flavor: "Отряды пикинеров, набираемые из засушливых равнин Хенемхата и Сирвалийского побережья. Джарифины восседают на выносливых лошадях, выведенных для долгих маршей. Их тактика отдаёт преимущество стремительным атакам и преследованию на открытой местности, а снаряжение приспособлено к жаре и пыли."

 sarathem_magi: "Саратемы"
 sarathem_flavor: "Дисциплинированные военные отряды магов, обученных на низменностях и кратерном краю Экершаана. Саратемы практикуют уникальную для этого региона форму группового магического боя, сочетающую базовую магию с агрессивной рукопашной схваткой, обычно в группах по три человека. Их ряды пополняются из обедневших местных семей, и часто они сражаются за тех, кто больше заплатит."

 safri_archers: "Сафрийские лучноки"
 safri_archers_flavor: "Сафрийские лучники оснащены необычайно длинными и тяжелыми луками. Из-за нехватки мобильности они носят тяжелые доспехи в качестве компенсации. Их стрелы, будучи столь же тяжелыми, способны пробивать броню на больших расстояниях и валить крупную дичь, с которой не справятся обычные стрелки."