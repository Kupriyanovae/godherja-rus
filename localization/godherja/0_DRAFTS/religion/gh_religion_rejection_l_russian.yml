 rejection: "Отверженческ"
 rejection_adj: "Отвержение"
 rejection_adherent: "Отверженец"
 rejection_adherent_plural: "Отверженцы"
 rejection_desc: "Далёкая от кодифицированной религии, культы, сосредоточенные вокруг Отвержения, обычно имеют лишь две общие черты. Первая — это отказ признавать какую-либо высшую силу, кроме [Concept('liches','лича')|E], который возглавляет культ. Вторая заключается в том, что число последователей обычно составляет примерно один — если не считать случаев, когда легионы безмозглых [Concept('undead','неживых')|E] слуг получают приказ поклоняться своим хозяевам, разумеется."