 rejection_religion_desc: "Отвержение — это обобщающий термин для различных «верований» [Concept('liches','личей')|E] из [Concept('the_lichdoms','Личеств')|E]. Как и следовало ожидать, они склонны отвергать все прежние организованные религии, хотя то, чем они их заменяют, может различаться. Некоторые объявляют себя живыми богами, творцами жизни и смерти, пришедшими переделать мир по своему образу и подобию. Другие отвергают все религии, рассуждая, что нет ничего на небе или на земле, что было бы больше их самих."

