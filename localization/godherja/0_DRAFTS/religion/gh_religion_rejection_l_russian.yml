 rejection_religion_desc: "Отвержение — общее название различных «верований», которые исповедуют [liches|E] в краях, известных как [the_lichdoms|E]. Как и следовало ожидать, они склонны отвергать все прежние организованные религии, хотя то, чем они их заменяют, может различаться. Некоторые объявляют себя живыми богами, творцами жизни и смерти, пришедшими переделать мир по своему образу и подобию. Другие отвергают все религии, полагая, что ни на небе, ни на земле нет никого и ничего превыше них самих."

