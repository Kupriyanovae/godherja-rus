 rejection_adherent: "Отверженец"
 rejection_adherent_plural: "Отверженцы"
 rejection_desc: "Культы Отвержения далеки от единого, чётко оформленного вероучения, и обычно их объединяют лишь две черты. Во-первых, они признают лишь одну высшую силу — это [lich|E], возглавляющий культ. Во-вторых, у каждого такого культа обычно всего один последователь — если, конечно, не считать случаев, когда безмозглая [undead|E] целыми легионами поклоняется своим хозяевам по их приказу."
