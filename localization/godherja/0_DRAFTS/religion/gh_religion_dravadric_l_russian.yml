 vidvaookeyatra: "Видваукеятранск"
 vidvaookeyatra_adj: "Видваукеятранизм"
 vidvaookeyatra_adherent: "Видваукеятранец"
 vidvaookeyatra_adherent_plural: "Видваукеятранцы"
 vidvaookeyatra_desc: "Видваукеятра («Странствие учёного») — это поклонение гермафродитному богу знания Сарвату, который, как говорят, является источником всякого знания и, следовательно, знания о самом творении. Имея корни в [Concept('otachedian_empire','империи')|E] Отачеда, их [Concept('vidvaookeyatran_scholarly_caste','учёному сословию')|E] следует благодарить как за технологический, общественный и исторический прогресс Каширии, так и за её [Concept('chan_skorpokaipis','многочисленные бедствия')|E]."
 vidvaookeyatra_high_god_name: "Сарват"
 vidvaookeyatra_high_god_name_possessive: "Сарвата"

 askevaryaa: "Аскеварьянск"
 askevaryaa_adj: "Аскеварьянизм"
 askevaryaa_adherent: "Аскеварьянец"
 askevaryaa_adherent_plural: "Аскеварьянцы"
 askevaryaa_desc: "Сформированная после событий [chan_skorpokaipis|E] и [dharya_varha|E], Аскеварьяна разделяет почти тех же богов и догматы, что и Видваукеятра. Однако отличие заключается во включении так называемых [evil_lore|E1]."
 askevaryaa_high_god_name: "Сарват"
 askevaryaa_high_god_name_possessive: "Сарвата"

 nabbarek: "Наббарекск"
 nabbarek_adj: "Наббарекизм"
 nabbarek_adherent: "Наббарекец"
 nabbarek_adherent_plural: "Наббарекцы"
 nabbarek_desc: "Веря в девяносто книг «положительного» просветления и одну книгу «нейтрального» просветления, ведущую к вознесению после их прочтения, истоки этой веры можно проследить до гуру по имени [pethyka|E]. После [dharya_varha|E] девяносто одна книга была признана содержащей единственное истинное знание в этом мире, а всё остальное, как считалось, было творением человека."
 nabbarek_high_god_name: "Сарват"
 nabbarek_high_god_name_possessive: "Сарвата"
 nabbarek_religious_text: "Девяносто и одна"

 andaronshak: "Андароншакск"
 andaronshak_adj: "Андароншакизм"
 andaronshak_adherent: "Андароншакец"
 andaronshak_adherent_plural: "Андароншакцы"
 andaronshak_desc: "Андароншакцы верят, что боги — это непостижимая сила, проявляющаяся в человечестве как [Concept('magic','магия')|E]. Через совершенствование добродетелей человек обретает контроль над магией через своих богов — будь то в нынешней жизни или в следующей. Признавая путь к магии личным странствием, андароншакцы питают горькую ненависть к религиозному формализму, считая его противоречащим их святым целям."

 varodaism: "Вародаистск"
 varodaism_adj: "Вародаизм"
 varodaism_adherent: "Вародаист"
 varodaism_adherent_plural: "Вародаисты"
 varodaism_desc: "Поклонение древнему богу моря Вароде, [Concept('varodist_creation_myth','вародистский миф о сотворении мира')|E] — один из древнейших в мире. Наиболее известные своей способностью укрощать морских зверей, самой знаменитой вародистской фигурой является пророк Могурпа, который, как говорят, большую часть своей жизни укрощал кракена и ездил на нём."
 varodaism_high_god_name: "Варода"
 varodaism_high_god_name_possessive: "Вароды"

 dravadari: "Авастья-маханическ"
 dravadari_adj: "Авастья-Маханизм"
 dravadari_adherent: "Авастья-маханец"
 dravadari_adherent_plural: "Авастья-маханцы"
 dravadari_desc: "Политеистическая вера с [Concept('avastya_mahani_history','древней историей')|E], боги — это эфемерные творцы, которые могут жить, умирать, перерождаться и испытывать последствия энтропии и негэнтропии, подобно людям. Паэрасджатан (часто забываемый в наши дни) — бог магии творения, который, как говорят, создал первую итерацию мира, и о Нём существует [Concept('paerasjatan_old_myth','много древних мифов')|E]."

 karitkarmaic: "Кариткармаистск"
 karitkarmaic_adj: "Кариткармаицизм"
 karitkarmaic_adherent: "Кариткармаист"
 karitkarmaic_adherent_plural: "Кариткармаисты"
 karitkarmaic_desc: "Почитая главным образом бога войны, смерти и справедливости Картикарму над другими богами Авастьи, кариткармаисты верят в необходимость войны, смерти и мира — необходимого цикла, вокруг которого всегда вращается общество и мир. Хотя они не ищут активно войны и смерти, они верят, что их не следует отвергать, а следует принимать как часть вселенского опыта, создавая мирные, но стоические царства."
 karitkarmaic_high_god_name: "Картикарма"
 karitkarmaic_high_god_name_possessive: "Картикармы"

 daramarjaratan: "Дарамарджаратанск"
 daramarjaratan_adj: "Дарамарджаратанизм"
 daramarjaratan_adherent: "Дарамарджаратанист"
 daramarjaratan_adherent_plural: "Дарамарджаратанисты"
 daramarjaratan_desc: "Дарамарджаратанисты поклоняются богине смерти и супруге Кариткармаика, Дарамарджаратан (изначально Дамаратджарат) как правительнице всех остальных богов. Дарамарджаратанизм остаётся спорным из-за их веры в [pantheon_of_death|E1] и смерть всех остальных богов. Хотя их считают опасным культом, дарамарджаратаны больше заботятся о делах мёртвых, чем живых, и редко вступают в контакт с чужаками. Несмотря на их миролюбие, большинство помнят лишь [Concept('murtuy_ka_varha','пресловутые результаты')|E] культов Дарамарджаратан, открывших тёмные магии."
 daramarjaratan_high_god_name: "Дарамарджаратан"
 daramarjaratan_high_god_name_possessive: "Дарамарджаратана"

 asritayka: "Асритаиканск"
 asritayka_adj: "Асритаиканизм"
 asritayka_adherent: "Асритаиканист"
 asritayka_adherent_plural: "Асритаиканисты"
 asritayka_desc: "Асритаиканцы противостоят большинству религиозных норм обычных вер и проповедуют обыденность во всех вещах — божественных или смертных. От морей до небес, даже [dragons|E1] и [Concept('magic','магия')|E]. Верные проводят время в бесконечных дебатах о философских концепциях и трудах таких философов, как [saru|E], что иногда вызывает большую враждебность, и их можно найти при большинстве каширийских дворов."

