 dravidian_religion: "Авастья-маханическ"
 dravidian_religion_adj: "Авастья-Маханизм"
 dravidian_religion_desc: "Авастья-Махани, означающее «великий совет» на древнем каширийском языке, представляет собой пантеон богов, почитаемых в той или иной форме на большей части Каширии. Изначально сосредоточенный на всеобъемлющей божественности бога-творца Паэрасджатана, многие ответвления Авастья-Махани делают акцент на других аспектах пантеона, таких как бог знания Сарват или божество-воин Картикарма."

