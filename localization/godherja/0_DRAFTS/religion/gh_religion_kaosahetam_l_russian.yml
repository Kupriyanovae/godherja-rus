 kaosahetam_desc: "Каосахетамцы верят, что каждый человек рождается с определённым количеством «Као» или «Удачи» в своём духе, которое увеличивается через совершение добрых дел и уменьшается при злых поступках. Те, у кого много Као, благословлены удачей в своих начинаниях, а те, у кого её недостаёт, погрязли в несчастьях. Каосахетамцы также используют гадание, наблюдая за движениями и действиями крабов, чтобы оценить Као человека. Говорят, что более искусные прорицатели могут использовать движения крабов, чтобы видеть правду прошлого и даже предсказывать будущие события."
