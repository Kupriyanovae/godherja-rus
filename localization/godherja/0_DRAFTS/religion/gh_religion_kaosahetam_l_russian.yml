 kaosahetam_religion: "Каосахетамск"
 kaosahetam_religion_adj: "Каосахетамизм"
 kaosahetam_religion_adherent: "Каосахетамец"
 kaosahetam_religion_adherent_plural: "Каосахетамцы"
 kaosahetam_religion_desc: "Каосахетамцы верят в «Као» или «Удачу», которая, как они считают, есть у каждого человека с рождения. Те, у кого много Као, благословлены удачей в своих начинаниях, а те, у кого её недостаёт, погрязли в несчастьях."





