 #Doctrines: Slavery
 doctrine_slavery_name: "Slavery"
 doctrine_slavery_demanded_name: "Mandatory"
 doctrine_slavery_demanded_desc: "Slavery is seen as a virtue by scripture, and to be against the ownership of man is sinful."
 doctrine_slavery_encouraged_name: "Encouraged"
 doctrine_slavery_encouraged_desc: "While not completely demanded, pious rulers are encouraged to own slaves."
 doctrine_slavery_neutral_name: "Neutral"
 doctrine_slavery_neutral_desc: "The faith does not have any particular view on the ownership of slaves."
 doctrine_slavery_discouraged_name: "Discouraged"
 doctrine_slavery_discouraged_desc: "While not banned, slavery is seen as sinful."
 doctrine_slavery_banned_name: "No Slavery"
 doctrine_slavery_banned_desc: "To own another person is truly evil, and is strictly banned by the faithful."

 #Doctrines: Magic
 doctrine_magic_name: "Magic"
 doctrine_magic_crime_name: "Magic Criminalized"
 doctrine_magic_crime_desc: "Those with '[Concept('magic','the Gift')|E]' are too dangerous to be allowed to live."
 doctrine_magic_shunned_name: "Magic Shunned"
 doctrine_magic_shunned_desc: "Those with [Concept('magic','the Gift')|E] are useful, but ought to be kept at arm's length."
 doctrine_magic_accepted_name: "Magic Accepted"
 doctrine_magic_accepted_desc: "[Concept('magic','The Gift')|E], as they say, is nothing to be ashamed of."
 doctrine_magic_honored_name: "Magic Honored"
 doctrine_magic_honored_desc: "[Concept('magic','The Gift')|E] and its users are to be honored in our society."
 doctrine_magic_supremacy_name: "Magic Supremacy"
 doctrine_magic_supremacy_desc: "Those with [Concept('magic','the Gift')|E] are naturally superior to those without."
 
