 #Special Doctrines: Marefai
 marefai_hostility_name: "Marefai"
 special_doctrine_marefai_hostility_desc: "The Hymns of Heaven, the ancient songs that have been sung since the beginning of time, are vague at places. And while others might cling to their version of the story, we allow all to choose. The Most High gave us the ability to interpret His sacred decrees, and it is beyond the purview of any mortal to tell another that their interpretation is false."
 special_doctrine_marefai_hostility_name: "Singers of His Ancient Hymns"

 #Special Doctrines: Marcher
 special_doctrine_is_marcher_faith_desc: "Whatever our differences, our faith belongs to the Marcher family and they are our kin."
