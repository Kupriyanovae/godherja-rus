 marcher_faith_doctrine_name: "Marcher Faith Doctrine"
 marcher_faith_doctrine_desc: "Practices the Marcher Faith"

 #Special Doctrines: Mogowai
 mogowai_hostility_name: "Mogowai"
 special_doctrine_mogowai_hostility_desc: "We are tasked with a grand mission from the divine, to locate His corpse, that He might rise again. All other faiths, whatever they might preach, are merely obstacles, who have turned their followers away from the Great Search in pursuit of their own, petty, goals."
 special_doctrine_mogowai_hostility_name: "Sole True Searchers"

 #Special Doctrines: Mokmanur
 mokmanur_hostility_name: "Mokmanur"
 special_doctrine_mokmanur_hostility_desc: "It is not Pleimao who wishes our return, but the Cold Father Khel Tvi. We must spread the truth of this revelation, saving our people from their own heresy and destroying all heathens."
 special_doctrine_mokmanur_hostility_name: "Friends of the Cold"

 #Special Doctrines: Nitsafai
 nitsafai_hostility_name: "Nitsafai"
 special_doctrine_nitsafai_hostility_desc: "The supposed followers of He Who Was Most High stand as insults to everything He wanted. They revel in gluttonous corruption, from the lowliest Siiret to the highest Aminet. All, that is, save us. While others mock His virtues, we stand true to them. For though He is dead, His spirit is still with us, and we shall ever tread beneath His light."
 special_doctrine_nitsafai_hostility_name: "Bastion of Piety"

