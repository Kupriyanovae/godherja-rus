 sjalvolki_religion_desc: "Согласно сьялвольским учениям, когда мир был создан и человечество рождено из земли, боги сотворили для них дары. [Glossary('Варпалис','VARPALIS_GLOSS')] создал рыб морских, [Glossary('Уреха','UREHA_GLOSS')] создала растения земные, [Glossary('Замистра','ZAMISTRA_GLOSS')] создал хитрых зверей земных, а [Glossary('Пекиело','PEKIELO_GLOSS')] создал птиц небесных. Но [Glossary('Пеквон','PEKWON_GLOSS')] в своей жестокости дал человечеству «дар» голода и страданий. Последним, кто дал свой дар, был [Glossary('Велос','VELOS_GLOSS')], и он научил их охотиться и убивать зверей вокруг них."

