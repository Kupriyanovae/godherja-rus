 sjalvolki_religion_adherent: "Сьяволк"
 sjalvolki_religion_adherent_plural: "Сьяволки"
 sjalvolki_religion_desc: "Согласно учениям сьяволки, когда мир был создан, а человечество родилось из земли, боги создали для них дары. [Glossary('varpalis','VARPALIS_GLOSS')|E] создал рыб морских, [Glossary('Уреха','UREHA_GLOSS')|E] создала растения земли, [Glossary('Замистра','ZAMISTRA_GLOSS')|E] создал хитрых зверей суши, а [Glossary('Пекьело','Пекьело')|E] создал птиц небесных. Но [Glossary('Пеквон','PEKIELO_GLOSS')|E], в своей жестокости, даровал человечеству «дар» голода и страданий. Последним, кто даровал дар, был [Glossary('Велос','VELOS_GLOSS')|E], и он научил их охотиться и убивать животных вокруг."
