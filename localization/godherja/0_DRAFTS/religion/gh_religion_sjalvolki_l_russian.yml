 sjalvolki: "Сьялвольск"
 sjalvolki_adj: "Сьялволки"
 sjalvolki_adherent: "Сьялволки"
 sjalvolki_adherent_plural: "Сьялволки"
 sjalvolki_desc: "Сьялволки, или «сильный народ» на их языке, считают себя теми, кто всё ещё следует учениям [Glossary('Велоса','VELOS_GLOSS')] Великого Охотника. Они восхваляют охоту и считают её ключевым принципом своей веры, хотя это также сочетается с общением с природой и ответственностью в своих действиях. Боги оказали им милость, назначив их управителями мира, но они, вероятно, не получат такой щедрости снова, если растратят её впустую. Таким образом, они чувствуют необходимость иногда браться за оружие против поистине злых и вопиющих, чтобы обезопасить остальное существование."
 sjalvolki_old: "Старосьялвольск"
 sjalvolki_old_adj: "Старые сьялволки"
 sjalvolki_old_adherent: "Старый сьялволки"
 sjalvolki_old_adherent_plural: "Старые сьялволки"

 praznarva: "Празнарванск"
 praznarva_adj: "Празнарва"
 praznarva_adherent: "Празнарви"
 praznarva_adherent_plural: "Празнарвии"
 praznarva_desc: "Празнарвии толкуют некоторые истории о [Glossary('Велосе','VELOS_GLOSS')], пьющем кровь своей павшей добычи, чтобы узнать тайны жизни, в буквальном контексте и считают питьё крови священным и важным религиозным долгом. Благодаря этому они верят, что могут вкусить души мёртвых и узнать их секреты, как когда-то делал их бог-покровитель."
 praznarva_old: "Старорпразнарванск"
 praznarva_old_adj: "Старая Празнарва"
 praznarva_old_adherent: "Старый празнарви"
 praznarva_old_adherent_plural: "Старые празнарвии"

 orispolj_rite: "Орайспольско-обрядов"
 orispolj_rite_adj: "Орайспольский обряд"
 orispolj_rite_adherent: "Орайсполец"
 orispolj_rite_adherent_plural: "Орайспольцы"
 orispolj_rite_desc: "Орайспольский обряд является кодификацией и реформацией множества разрозненных вер сьялвольских верных. [SelectLocalization(Faith.MakeScope.Var('great_reformer').IsSet,Concatenate('Основанный радикальным шаманом ',Faith.MakeScope.Var('great_reformer').Char.GetFullNameNicknamed),'Основанный радикальным шаманом')], проповедник призвал к необходимости кодифицированной книги веры, а также строгой иерархии жрецов и шаманов для руководства верными. Часто считающийся вдохновлённым религиями марочников и структурными аспектами побеждённых вер [Concept('aversaria','аверсарианцев')|E], Орайспольский обряд является слиянием дюжины различных сьялвольских вер с иерархической структурой, которую можно ожидать от современного и укоренившегося религиозного движения.\n\nНесмотря на структурную организацию, его основатель активно выступал против необходимости центральной организации для управления верой и вместо этого требовал «анархии веры», в которой каждый верный формировал бы свой собственный путь к спасению в финальной войне."

 piety_rite: "Могило-велосск"
 piety_rite_adj: "Обряд Могилы Велоса"
 piety_rite_adherent: "Последователь Могилы Велоса"
 piety_rite_adherent_plural: "Последователи Могилы Велоса"
 piety_rite_desc: "Обряд Могилы Велоса получил своё название от Конклава Могилы Велоса — древнего жречества, управлявшего святейшим местом в сьялвольской вере и некогда занимавшего главенствующую религиозную роль в их доммиграционном мире, хотя он также иногда упоминается как Обряд Благочестия. Однако потеря самой Могилы Велоса из-за [Concept('the_fog','Тумана')|E] привела к резкому падению их власти и престижа, и на протяжении большей части Завоевания они цеплялись за двор Ценвара в уважаемой консультативной роли — но не более того.\n\nОднако с началом великой реформации группа увидела резкий подъём своего положения. Будучи ярыми ранними сторонниками движения, они в конечном счёте отделились от Орайспольского обряда, пытаясь кодифицировать себя как законных глав религии. Хотя большинство других обрядов по крайней мере номинально признают престиж и почтенную природу Конклава Могилы Велоса, они утверждают, что их положение превосходства либо чисто символическое, либо подчинено другому институту, такому как Святое Королевство Кронского обряда."
 piety_rite_religious_head_title: "Избранный Велосом"

 authority_rite: "Кронско-обрядов"
 authority_rite_adj: "Кронский обряд"
 authority_rite_adherent: "Кронист"
 authority_rite_adherent_plural: "Кронисты"
 authority_rite_desc: "Кронский обряд, также известный как Королевский обряд или Обряд Власти, прослеживает многие свои фундаментальные богословские истоки до самого образования Имперреха. Хотя изначально большинство считало это лишь временным устройством, ряд крайне спорных и, возможно, апокрифических заявлений, сделанных Ценваром и его ближайшими соратниками на протяжении его правления, позже послужили топливом для одного из самых горьких и разделяющих конфликтов в сьялвольской религии — а именно природы самого Верховного Королевства и его власти над духовными делами.\n\nКронисты, в отличие от обрядов [GetTitleByKey('c_oraispol').GetNameNoTier] и Могилы Велоса, утверждают, что Верховное Королевство на самом деле никогда не задумывалось как уникальная сущность, и что оно было примером того, что могущественный светский правитель должен быть главой сьялвольского мира — правда, в форме преемника «Святого Королевства», а не какой-то безумной попытки возродить сам Имперрех. Хотя изначально не будучи открыто антиклерикальным, последующие конфликты с обрядом Могилы Велоса также привели к тому, что он занял всё более враждебную позицию по отношению к власти духовенства — а именно, что верными должны руководить наиболее достойные светские лорды, а не находиться в руках возможно гедонистического и интригующего духовного класса, который угрожает уничтожить веру ради жажды власти."
 authority_rite_religious_head_title: "Святой Король"

 eastern_rite: "Восточно-обрядов"
 eastern_rite_adj: "Восточный обряд"
 eastern_rite_adherent: "Восточник"
 eastern_rite_adherent_plural: "Восточники"
 eastern_rite_desc: "Отколовшись от «Орайспольского обряда», Восточный обряд был сформирован из-за большого расстояния от духовных оплотов в Этепезее до восточных регионов Айроноя и большого количества экзотических вер, встречающихся на востоке. Когда восточные верные были ввергнуты в хаос Велоскупом и стремительным натиском религиозных междоусобиц, духовный класс востока попытался обойти дальнейший доктринальный конфликт, работая с духовными лордами, чтобы найти средний путь для своей веры. Таким образом, Восточный обряд представляет собой странную смесь духовного и светского контроля, с духовным главой над децентрализованной системой жрецов, который делит контроль с лордами наряду с ними.\n\nИз-за этих различий Восточный обряд невероятно дозволителен: основополагающие идеалы веры и путаница её создания привели к тому, что многие законы и правила веры отсутствуют или мягки."

 zaumiere_rite: "Заумьерско-обрядов"
 zaumiere_rite_adj: "Заумьерский обряд"
 zaumiere_rite_adherent: "Заумьерит"
 zaumiere_rite_adherent_plural: "Заумьериты"
 zaumiere_rite_desc: "Заумьерский, или Солнечный, обряд является амальгамой карзарадской и сьялвольской мифологии, синкретизированной через [Concept('sjalvolki_migration','переселения')|E]. Практикующие смешали древние дуалистические мифы какаратакской легенды с историями о Богах Верхних и Нижних и стремятся распространить свою мудрость в отдалённые уголки «просвещённого» мира."

 banstur_rite: "Банстурско-обрядов"
 banstur_rite_adj: "Банстурский обряд"
 banstur_rite_adherent: "Бард"
 banstur_rite_adherent_plural: "Барды"
 banstur_rite_desc: "Банстурский обряд — это плюралистический обряд, рождённый из многих [Concept('sjalvolki_migration','переселенческих')|E] сообществ, осевших вдоль Расколотого побережья, которые верят, что их долг — открывать, собирать и делиться знаниями Старого Мира с поселенцами Нового. Многие отвергают власть как Святого Королевства, так и Велосгрейва и придерживаются философии ненасилия."

 earth_rite: "Прохенско-обрядов"
 earth_rite_adj: "Прохенский обряд"
 earth_rite_adherent: "Прохенит"
 earth_rite_adherent_plural: "Прохениты"
 earth_rite_high_god_name_alternate: "Старый Ткач"
 earth_rite_high_god_name_alternate_possessive: "Старого Ткача"
 earth_rite_desc: "Прохенский обряд является кодификацией часто высмеиваемого почитания Прохена из доммиграционных времён в рамках центральной системы. В отличие от «анархии веры», проповедуемой орайспольскими реформаторами, прохениты верят в центральную власть, помогающую направлять верных к их судьбам."

 river_rite: "Патосско-обрядов"
 river_rite_adj: "Патосский обряд"
 river_rite_adherent: "Варпалисит"
 river_rite_adherent_plural: "Варпалиситы"
 river_rite_high_god_name_alternate: "Речной Отец"
 river_rite_high_god_name_alternate_possessive: "Речного Отца"
 river_rite_desc: "Патосский обряд считает, что речные системы [Glossary('Дельты Патоса','pathos_delta_encyclopedia_desc')] были даром, созданным для верных, чтобы они могли найти во время своих скитаний и процветать. [Glossary('Варпалис','VARPALIS_GLOSS')] возведён в центр сьялвольского пантеона, а кодификация мифов строится вокруг него, а не вокруг более традиционных богов."