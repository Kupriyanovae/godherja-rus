 zaumiere_rite_desc: "Заумьерский, или Солнечный, обряд является амальгамой карзарадской и сьялволькской мифологии, синкретизированной через [Concept('sjalvolki_migration','переселения')|E]. Практикующие смешали древние дуалистические мифы какаратакской легенды с историями о Богах Верхних и Нижних и стремятся распространить свою мудрость в отдалённые уголки «просвещённого» мира."


