 sjalvolki: "Сьяволкск"
 sjalvolki_adj: "Сьяволки"
 sjalvolki_adherent: "Сьяволк"
 sjalvolki_adherent_plural: "Сьяволки"
 sjalvolki_desc: "Сьяволки, или «сильный народ» на их языке, считают себя теми, кто до сих пор следует учениям [Glossary('Велоса','VELOS_GLOSS')|E], Великого Охотника. Они восхваляют охоту и считают её ключевым принципом своей веры, хотя это также связано с общением с природой и ответственностью в своих действиях. Боги даровали им благосклонность, назначив их хранителями мира, но они вряд ли получат такую щедрость снова, если растратят её. Таким образом, они чувствуют необходимость иногда браться за оружие против истинно злых и вопиющих, чтобы сохранить безопасность остального существования."
 sjalvolki_old: "Древне-сьяволкск"
 sjalvolki_old_adj: "Древнее Сьяволки"
 sjalvolki_old_adherent: "Древний Сьяволк"
 sjalvolki_old_adherent_plural: "Древние Сьяволки"
 
 praznarva: "Празнарванск"
 praznarva_adj: "Празнарва"
 praznarva_adherent: "Празнарви"
 praznarva_adherent_plural: "Празнарвии"
 praznarva_desc: "Празнарвии интерпретируют некоторые истории о том, как [Glossary('Велос','VELOS_GLOSS')|E] пил кровь своей добычи, чтобы узнать секреты жизни, в буквальном контексте и считают питьё крови священной и важной религиозной обязанностью. Через это они верят, что могут вкусить души умерших и узнать их секреты, как это однажды сделал их покровитель-бог."
 praznarva_old: "Древне-празнарванск"
 praznarva_old_adj: "Древняя Празнарва"
 praznarva_old_adherent: "Древний Празнарви"
 praznarva_old_adherent_plural: "Древние Празнарвии"

 orispolj_rite: "Ориспольско-обрядск"
 orispolj_rite_adj: "Ориспольский Обряд"
 orispolj_rite_adherent: "Орисполец"
 orispolj_rite_adherent_plural: "Ориспольцы"
 orispolj_rite_desc: "Ориспольский Обряд — это кодификация и реформа множества разрозненных верований верующих сьяволки. [SelectLocalization(Faith.MakeScope.Var('great_reformer').IsSet,Concatenate('Основанный радикальным шаманом',Faith.MakeScope.Var('great_reformer').Char.GetFullNameNicknamed),'Основанный радикальным шаманом')], проповедник призывал к необходимости создания кодифицированной книги веры, а также строгой иерархии жрецов и шаманов для руководства верующими. Часто считается, что он вдохновлён религиями марчеров и структурными аспектами побеждённых верований [Concept('aversaria','аверсарианцев')|E], Ораиспольский Обряд представляет собой слияние дюжины различных разрозненных верований сьяволок с иерархической структурой, которую можно ожидать от современного и укоренившегося религиозного движения.\n\nНесмотря на структурную организацию, его основатель активно выступал против необходимости централизованной организации для управления верой и вместо этого требовал «Анархии Веры», в которой каждый верующий формировал бы свой собственный путь к спасению в последней войне."

 piety_rite: "Обряд Могилы Велоса"
 piety_rite_adj: "Обряда Могилы Велоса"
 piety_rite_adherent: "Могильщик Велоса"
 piety_rite_adherent_plural: "Могильщики Велоса"
 piety_rite_desc: "Обряд Могилы Велоса получил своё название от Конклава Могилы Велоса, древнего жречества, которое управляло самым святым местом в вере сьялволков и когда-то занимало выдающееся религиозное положение в их мире до переселения, хотя его также иногда называют Обрядом Благочестия. Потеря самой Могилы Велоса из-за [Concept('the_fog','Тумана')|E] привела к резкому снижению их власти и престижа, однако на протяжении большей части завоевания они цеплялись за двор Ценвара в уважаемой роли советников — но не более.\n\nС началом великой реформации, однако, группа увидела резкий рост своих удач. Рьяные ранние сторонники движения, они в конечном итоге отделились от Ораиспольского обряда, пытаясь кодифицировать себя как законных глав религии. Хотя большинство других обрядов хотя бы номинально признают престиж и почтенную природу Конклава Могилы Велоса, они утверждают, что их положение превосходства либо символично, либо подчинено другому учреждению, такому как Святое Королевство Обряда Кроны."
 piety_rite_religious_head_title: "Избранный Велосом"
 
 authority_rite: "Крона-обрядск"
 authority_rite_adj: "Обряд Кроны"
 authority_rite_adherent: "Кронист"
 authority_rite_adherent_plural: "Кронисты"
 authority_rite_desc: "Обряд Кроны, также известный как королевский обряд или обряд власти, прослеживает многие из своих фундаментальных теологических истоков до образования самого Импереха. Хотя изначально большинство понимало его как лишь временное соглашение, ряд горячо оспариваемых и, возможно, апокрифических заявлений, сделанных Ценваром и его ближайшими соратниками на протяжении его правления, позже стали топливом для одного из самых горьких и разделяющих конфликтов в религии Сьяволки — а именно, природы Верховного Королевства и его власти над духовными делами.\n\nКронисты, в отличие от [GetTitleByKey('c_oraispol').GetNameNoTier] и Обряда Велосгрейва, утверждают, что Верховное Королевство на самом деле никогда не предназначалось быть уникальным образованием, и что оно было примером того, что могущественный светский правитель должен быть главой мира сьяволки — хотя и в форме преемника «Святого Королевства», а не какой-то безумной попытки возродить сам Имперех. Хотя изначально не открыто антиклерикальный, последующие конфликты с Обрядом Велосгрейва также привели к тому, что он занял всё более враждебную позицию по отношению к власти духовенства — а именно, что верующие должны быть ведомы достойнейшими из светских лордов, а не находиться в руках возможно гедонистического и интригующего духовного класса, который угрожает разрушить веру ради жажды власти."
 authority_rite_religious_head_title: "Святой Король"
 
 eastern_rite: "Восточно-обрядск"
 eastern_rite_adj: "Восточный Обряд"
 eastern_rite_adherent: "Восточник"
 eastern_rite_adherent_plural: "Восточники"
 eastern_rite_desc: "Отколовшись от «Ораиспольского обряда», Восточный обряд был сформирован из-за большого расстояния от духовных центров в Этепезее до восточных регионов Айроноя и большого количества экзотических верований, найденных на востоке. С восточными верующими, ввергнутыми в хаос из-за Велоскопа и быстрого натиска религиозных междоусобиц, духовный класс востока попытался избежать дальнейших доктринальных конфликтов, работая с духовными лордами, чтобы найти компромисс для своей веры. Таким образом, Восточный обряд представляет собой странную смесь духовного и светского контроля, с духовным главой над децентрализованной системой жрецов, которые разделяют контроль с лордами рядом с ними.\n\nИз-за этих различий Восточный обряд невероятно снисходителен, а основные идеалы веры и путаница её создания привели к тому, что многие законы и правила веры либо отсутствуют, либо снисходительны."

 zaumiere_rite: "Zaumiere Rite"
 zaumiere_rite_adj: "Zaumiere Rite"
 zaumiere_rite_adherent: "Zaumierite"
 zaumiere_rite_adherent_plural: "Zaumierites"
 zaumiere_rite_desc: "The Zaumiere, or Solar, Rite is an amalgamation of Karzarad and Sjalvolki myth that syncretised through the [Concept('sjalvolki_migration','migrations')|E]. Practicioners have blended the ancient dualisitic myths of Kakarataki legend with the stories of the Gods Above and Below and seek to spread their wisdom to the far corners of the 'enlightened' world."

 banstur_rite: "Bánstur Rite"
 banstur_rite_adj: "Bánstur Rite"
 banstur_rite_adherent: "Bard"
 banstur_rite_adherent_plural: "Bards"
 banstur_rite_desc: "The Bánstur Rite is a pluralistic Rite born from the many [Concept('sjalvolki_migration','migrations')|E] that settled along the Shattered Coast who believe that it is their duty to uncover, collect, and share the knowledge of the Old World with the settlers of the New. Many reject the authority of both the Holy Kingdom and the Velosgrave and adhere to a philosophy of nonviolence."

 earth_rite: "Prohen Rite"
 earth_rite_adj: "Prohen Rite"
 earth_rite_adherent: "Prohenite"
 earth_rite_adherent_plural: "Prohenites"
 earth_rite_desc: "The Prohen Rite is the codification of oft-derided Prohen worship from before the migrations under a central system. Unlike the 'Anarchy of Belief' espoused by the Orispolj reformers, Prohenites believe in a central authority to help guide the faithful towards their fates."

 river_rite: "Pathos Rite"
 river_rite_adj: "Pathos Rite"
 river_rite_adherent: "Varpalisite"
 river_rite_adherent_plural: "Varpalisites"
 river_rite_desc: "The Pathos Rite believes that the river systems of the [Glossary('Pathos Delta','pathos_delta_encyclopedia_desc')] were a gift created for the faithful that they may find in their wandering and prosper with. [Glossary('Varpalis','VARPALIS_GLOSS')] is raised to the center of the Sjalvolki pantheon, and the codification of myths are structured around him rather than more tradtional gods."