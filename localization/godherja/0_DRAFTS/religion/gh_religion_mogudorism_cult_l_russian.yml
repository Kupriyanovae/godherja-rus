 mogudorism_religion_desc: "Часто преследуемый культ магов, возникший в пограничных гарнизонных городах Катун-Кая. Могудоризм вырос из практик секты боевых [Concept('magi','магов')|E], которые усовершенствовали искусство связывания различных своенравных и мерзких духов для использования их в качестве оружия. Хотя вера была окончательно запрещена катунским государством из-за их участия в попытке переворота в VIII веке от И.С., каждая попытка сжечь их учения оказывалась тщетной; копии Руководства по заковыванию и его дополнительных томов таинственным образом появлялись вновь."

