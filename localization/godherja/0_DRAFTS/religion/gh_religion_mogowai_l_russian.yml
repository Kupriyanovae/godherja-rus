 mogowai_religion_desc: "Моговайцы верят, что их бог, известный лишь как Всевышний, некогда имел физический аватар, который ступал по [Concept('aeras','Эрасу')|E] и общался с молящими. Однако Он был атакован армией неверующих, которые сожгли Его храмы, уничтожили Его подношения и даже убили Его. Тело Его было унесено в неведомые земли, и долг моговайцев («Искателей» на их языке) — отыскать это тело и совершить надлежащие последние обряды, после чего Всевышний родится в новом теле, и мир вновь обретёт покой."

