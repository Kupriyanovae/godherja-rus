 mogowai: "Моговайск"
 mogowai_adj: "Моговаизм"
 mogowai_adherent: "Моговаец"
 mogowai_adherent_plural: "Моговайцы"
 mogowai_desc: "Основное течение моговаизма, кодифицированное на [Concept('karururi_chorus','Карурурийском хоре')|E], относится к задаче поиска тела Всевышнего с невероятной серьёзностью. Хотя многие просто молятся, чтобы Он привёл своих последователей к месту Его последнего упокоения, другие чувствуют побуждение выйти в мир и искать самим. Они заново проходят старые пути, считавшиеся тупиковыми, или ищут в совершенно неисследованных местах, следуя любой зацепке о священном захоронении в надежде исполнить свою единственную цель. Считается, что когда Он будет найден, Он восстанет вновь и превратит мир в рай."

 bekashai: "Бекашайск"
 bekashai_adj: "Бекашаизм"
 bekashai_adherent: "Бекашаец"
 bekashai_adherent_plural: "Бекашайцы"
 bekashai_desc: "Бекашайцы считают, что те, кто убил Всевышнего, должны быть привлечены к справедливости, веря, что только через обретение мести Его тело может быть найдено. Они переориентировали свои усилия на поиски по всему миру, игнорируя поиски самого Его тела и вместо этого выслеживая Его убийц, надеясь однажды отомстить за их древний грех. Было предложено множество теорий о Его смерти, но большинство склонно просто обвинять в этой давней трагедии своих нынешних врагов."

 nitsafai: "Ницафайск"
 nitsafai_adj: "Ницафаизм"
 nitsafai_adherent: "Ницафаец"
 nitsafai_adherent_plural: "Ницафайцы"
 nitsafai_desc: "Ницафайцы считают, что основное течение моговаизма сбилось с пути, во многом из-за вмешательства светских правителей в религиозные дела. Они выступают за буквальное толкование Небесных гимнов и стремятся к переориентации веры до того, как поиски могут быть возобновлены, опасаясь, что коррупция помешает когда-либо обнаружить Его тело. Эта преданность заставляет их ставить свою ортодоксию превыше всего, и любое отклонение от их истины строго наказывается."

 marefai: "Марефайск"
 marefai_adj: "Марефаизм"
 marefai_adherent: "Марефаец"
 marefai_adherent_plural: "Марефайцы"
 marefai_desc: "В то время как другие деноминации верят в централизованные усилия по поиску Его тела, марефайцы полностью отвергают центральную религиозную власть, считая, что простые смертные недостойны диктовать повеления Всевышнего. Они поощряют всех жить в соответствии со своими собственными толкованиями Гимнов и видят тех, кто пытается возглавить веру, узурпаторами. Несмотря на разнообразие их верований, поиски Его гробницы остаются первостепенными, как и большинство других основных догматов."

 waharai: "Вахарайск"
 waharai_adj: "Вахараизм"
 waharai_adherent: "Вахараец"
 waharai_adherent_plural: "Вахарайцы"
 waharai_desc: "Вахарайцы считают, что смерть Всевышнего была всего лишь Его вознесением, и что Он ждёт на небесах тех, кто примет эту истину. Их отношение к благочестию гораздо более снисходительно, чем у их собратьев. Для вахарайцев ваши действия на [Concept('aeras','Эрасе')|E] не имеют значения, ибо лишь вера во Всевышнего принесёт вам награду. В результате правила, которым они следуют, менее формальны и структурированы, предоставляя гораздо больше свободы тем, кто был бы наказан другими верованиями, при условии, что они сохраняют свои убеждения."