 kyaalic_religion_desc: "Кьяали верят в божественное царство Кьяаль, место, откуда были рождены все существа, прежде чем они были изгнаны в мир. Они стремятся стать достаточно сильными, чтобы выжить в Кьяале, который остаётся связанным с этим миром, и обретают силу, отнимая её у зверей, на которых охотятся."

