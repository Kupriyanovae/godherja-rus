 kyaalic_desc:0 "Последователи киалика верят, что божественное царство, или Кьяаль — это осязаемое место, в которое можно совершить путешествие. Они считают его прародиной всех существ в мире, а потому каждое создание несёт в себе осколок божественности.\n\nНекоторые из киали способны проводить ритуалы, позволяющие обуздать этот осколок и облачиться в шкуру любого существа, чтобы принять его облик. Особым почтением пользуются те, кому удаётся примерить на себя шкуру [Concept('kyaldzakaxi', 'Кьяльдзакаши')|E] — грозных тварей, на которых охотятся во время [Concept('kyalmuku', 'Кьяльмуку')|E], или Охоты на бога."
