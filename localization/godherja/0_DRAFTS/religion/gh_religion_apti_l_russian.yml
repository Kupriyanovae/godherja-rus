 apti_religion_adherent_plural: "Апти"
 apti_religion_desc: "Согласно Апти, бог Ройдаммна погрузился в глубокий сон; момент, когда он закрыл глаза, стал первым мгновением известной вселенной. Вся реальность — это сон внутри разума божества, от мельчайшего насекомого до величайшего так называемого божества, которому поклоняются другие в мире. Все боль, распри, войны и страдания, которые случаются, являются результатом тревожного и беспокойного сна Ройдаммны. Чтобы возвыситься над «ложной формой» и воссоединиться с Дремлющим, Апти верят, что сначала необходимо понять всю вселенную, чтобы знание разума сравнялось со знанием Ройдаммны."
