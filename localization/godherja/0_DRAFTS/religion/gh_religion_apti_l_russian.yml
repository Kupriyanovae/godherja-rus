 #apti loc
 apti: "Аптийск"
 apti_adj: "Апти"
 apti_adherent: "Апти"
 apti_adherent_plural: "Апти"
 apti_desc: "Апти были малоизвестным народом, которого остальной мир в основном не замечал, пока они не двинулись на юг в составе Сьялволькской конфедерации Ценвара Сокрушителя Ведьм. Последователи этой веры не имеют твёрдой позиции ни в отношении войны, ни [Concept('magic','магии')|E], ни [Concept('frodbrokna','Фродброкны')|E], просто видя в них интересные загадки, которые однажды необходимо понять, чтобы воссоединиться с Дремлющим. Пытаться остановить их, не говоря уже о том, чтобы предотвратить их полностью, было бы безумием, ибо эти вещи исходят из разума Дремлющего, и всякий, кто поймёт Его, уже воссоединится с Его сознанием."
 apti_old: "Староаптийск"
 apti_old_adj: "Старые Апти"
 apti_old_adherent: "Старый апти"
 apti_old_adherent_plural: "Старые апти"
 
 caradounars: "Карадунарск"
 caradounars_adj: "Карадунары"
 caradounars_adherent: "Карадунар"
 caradounars_adherent_plural: "Карадунары"
 caradounars_desc: "Основанные одноимённым пророком хуэгодоков Карадуном, карадунары являются презираемой мессианской сектой, которая расколола веру Апти в последние десятилетия. Самым печально известным среди их многочисленных и разнообразных спорных убеждений является то, что Фродброкна была на самом деле священным событием — первым актом в великом космическом становлении, которое приведёт к тому, что Дремлющий начнёт заново видеть мир. Грозный [Concept('the_fog','Туман')|E] — это просто приближающийся конец сна, огромная и медленно движущаяся приливная волна ясности, накатывающая на [Concept('aeras','Эрас')|E], к приходу которой они должны подготовить мир.\n\nНазвать этот богословский поворот «спорным» было бы преуменьшением. Эти учения сочли настолько елейными, что обычно терпимые к гетеродоксии Апти обратились против Карадуна и его последователей, схватив и посадив на кол его и пятьдесят пять его учеников в 1211 году от И.С."

 dreaming_rite: "Обрядово-сновидческ"
 dreaming_rite_adj: "Обряд Сновидений"
 dreaming_rite_adherent: "Странник Снов"
 dreaming_rite_adherent_plural: "Странники Снов"
 dreaming_rite_desc: "Обряд Сновидений возник среди аптийских народов, поселившихся в землях [Concept('aversaria','Аверсарии')|E], и утверждает, что [Concept('frodbrokna','Фродброкна')|E] не была ни наказанием, ни концом, но поворотом. Ройдаммна пошевелился в своём древнем сне, и сон мира изменился вместе с ним. Старые земли не были уничтожены, учат Странники Снов, они были просто пересмотрены во сне. Земли, которые верные теперь населяют, заново сотворены, и их форма ещё не устоялась в сознании божества. Там, где презираемые карадунары провозглашали конец сна, Обряд провозглашает его обновление, и где старые апти искали понимания в абстрактном, Обряд повелевает искать его здесь, в самом новом сне."