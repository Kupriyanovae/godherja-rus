 zurvan_zaoran: "Зурван-заоранийск"
 zurvan_zaoran_adj: "Зурван-заоранизм"
 zurvan_zaoran_adherent: "Заораниец"
 zurvan_zaoran_adherent_plural: "Заоранийцы"
 zurvan_zaoran_desc: "Древняя вера в Заорана, Обладателя Ста Добродетелей, практиковалась амсарами под властью кемсаров. Преследования вынудили веру уйти в подполье, и её последователи адаптировали своё поклонение, чтобы выжить. Каждая община формировала свои собственные ритуалы и толкования, что привело к широкому разнообразию местных практик. Не имея единой доктрины, вера раскололась на множество форм, и её учения передавались в скрытых алтарях и шёпотом в молитвах."
 zurvan_zaoran_old: "Старозурван-заоранийск"
