 amsari_religion: "Заоранийск"
 amsari_religion_adj: "Заоранизм"
 amsari_religion_adherent: "Заораниец"
 amsari_religion_adherent_plural: "Заоранийцы"
 amsari_religion_desc: "Почитание Великого Бога Заорана, Обладателя Ста Добродетелей, сохраняется среди амсаров на протяжении тысячелетий. Основная форма веры медленно развивалась на протяжении долгих веков и призывает Праведников вести добродетельную жизнь и отвергать лживость, праздность и жестокость. Важнейшие ритуалы проводятся в великих общественных церемониях, на которые приглашаются все сословия общества, кастой жрецов, известных как [Concept('gh_frazan','фразаны')|E]. В целом вера заоранийцев представляет мир как единый божественный замысел, в котором каждый мужчина и женщина должны сыграть предписанную им роль и жить справедливо по велениям Заорана, дабы обеспечить Его победу над Его тёмным сыном Майей в Последней Битве.\n\nНесмотря на это предписание поддерживать социальную стабильность, заоранийская вера на протяжении истории претерпела немало междоусобных распрей и масштабных реформаций. Самой недавним из них стал [Concept('gh_the_amsari_prophet','Пророк')|E], начавшее проповедовать в 201 году с всеобъемлющим видением будущего своего народа — которое начало сбываться почти сразу, когда они свергли своих угнетателей ран кемсарцев."

