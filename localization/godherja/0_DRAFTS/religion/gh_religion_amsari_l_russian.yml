 vinderon: "Виндеонийск"
 vinderon_adj: "Виндеонизм"
 videron_adherent: "Виндеониец"
 vinderon_adherent_plural: "Виндеонийцы"
 vinderon_desc: "Никто не знает точно, какой дух движет умами его последователей. Никто не знает, чему они поклоняются. Никто даже не знает, откуда взялось слово «Виндеон». Всё, что известно, — это его связь с [Concept('the_towers','Башней')|E], той первобытной чудовищностью из циклопического камня, которая стояла в пустынных пустошах ещё до того, как человек ступил туда. Они одержимы ею и любыми подобными Башнями по всему миру. Неизвестно, что они хотят сделать с этими Башнями, но никто не хочет это выяснять."
 vinderon_religious_text: "Приказы слуги"