 tenet_blood_of_the_prophet_name: "Кровь Пророка"
 tenet_blood_of_the_prophet_desc: "Кровь Пророка — это священный дар, знак божественной милости и власти. Те, кто несёт это наследие, связаны судьбой вести праведных. Почитать родословную — значит почитать волю самого Заорана."
 doctrine_parameter_blood_of_the_prophet_temple_holding_active: "Канамсары с достаточным [Concept('piety','благочестием')|E] могут владеть [Concept('temple','храмовыми')|E] владениями"
 doctrine_parameter_blood_of_the_prophet_ancestry_decision_active: "[Concept('rulers','Правители')|E] могут дополнительно узаконить своё правление, проследив свою родословную до Пророка"
 doctrine_parameter_blood_of_the_prophet_prestige_marriage_active: "Брак с [Concept('character','персонажем')|E], обладающим свойством «[GetTrait('gh_blood_of_prophet').GetName( GetNullCharacter )]», даёт дополнительный [Concept('prestige','престиж')|E]"

 mahndayana: "Махндаянийск"
 mahndayana_adj: "Махндаянизм"
 mahndayana_adherent: "Заораниец"
 mahndayana_adherent_plural: "Заоранийцы"
 mahndayana_desc: "[Concept('frodbrokna','Фродброкна')|E] стала подтверждением самых худших опасений многих заоранийцев, особенно потому, что она произошла именно в тот момент, когда $amsari_prophet_link$ Пророк#! предсказал поражение их бога. Люди остались в смятении, гадая, как они вообще могут продолжать существовать в мире, где зло одержало верх над добром. Их ответ был удивительно прост: продолжать функционировать, как будто этого не произошло. Многие заоранийцы продолжают совершать ритуалы и петь песни своих предков в отчаянной надежде, что их жесты однажды приведут Заорана к предсказанной победе."

 mahnda_yathekar: "Махндаятхекарск"
 mahnda_yathekar_adj: "Махнда Ятхекар"
 mahnda_yathekar_adherent: "Ятхекарец"
 mahnda_yathekar_adherent_plural: "Ятхекарцы"
 mahnda_yathekar_desc: "Сосредоточенное вокруг фигуры, считающейся реинкарнацией $amsari_prophet_link$ Пророка#!, точное учение «Лжепророка» было утеряно на протяжении веков. Однако говорили, что его последователи отвернулись от ключевых аспектов основного махндаянизма, возложив абсолютную веру на божественный авторитет своего лидера."

 daenavad: "Даэнавадийск"
 daenavad_adj: "Даэнавадизм"
 daenavad_adherent: "Даэнавадиец"
 daenavad_adherent_plural: "Даэнавадийцы"
 daenavad_desc: "Основанное в правящей династии Амоннидов, даэнавадизм утверждает, что амсарским Хикланом должен править потомок $amsari_prophet_link$ Пророка#!, и распространяет этот принцип на все должности власти. Он утверждает, что каждая позиция власти должна принадлежать тем, кто может напрямую проследить свою родословную до Пророка. Хотя ни один канамсар никогда официально не придерживался даэнавадизма, его влияние сохраняется в высших эшелонах общества среди потомков Пророка, где чистота происхождения считается высшим мерилом авторитета и легитимности."

 tirazhidar: "Тахкедарск"
 tirazhidar_adj: "Тахкедаризм"
 tirazhidar_adherent: "Заораниец"
 tirazhidar_adherent_plural: "Заоранийцы"
 tirazhidar_desc: "Его приверженцы обвиняют неверных в недавнем поражении Заорана и катастрофе, вызванной [Concept('frodbrokna','Фродброкной')|E], видя в этом руку Майи, действующую через людей. Их доктрина основывается на строго буквальном прочтении [Concept('gh_zenda','Зенды')|E], рассматривая стихи, которые большинство учёных считают метафорическими, как прямые повеления. Спасение — это не индивидуальное стремление, а коллективный долг.\n\nТакая интерпретация подтолкнула многих из них к насильственным действиям, включая принудительное обращение бродячих народов Амсара. Для них человечество должно быть приведено под божественный порядок Заорана, чтобы его триумф стал абсолютным. Только тогда мир станет целостным, и Последняя Битва будет наконец выиграна."

 mahazhadar: "Махажадарск"
 mahazhadar_adj: "Махажадаризм"
 mahazhadar_adherent: "Заораниец"
 mahazhadar_adherent_plural: "Заоранийцы"
 mahazhadar_desc: "Возникнув в годы после смерти $amsari_prophet_link$ Пророка#!, махажадаризм просуществовал недолго после [Concept('gh_amsari_rebellion','Амсарского восстания')|E], прежде чем исчезнуть. Махажадари толковали учения Пророка не как прямые заявления, а как символические выражения более глубоких истин. Его приверженцы верили, что события, описанные для будущего, были не буквальными пророчествами, а абстрактными концепциями, требующими вдумчивого толкования. Они утверждали, что будущее, описанное Пророком, не было фиксированным, но могло быть понято через размышления и споры."

 khebaranism: "Хебаранск"
 khebaranism_adj: "Хебаранизм"
 khebaranism_adherent: "Хебаранец"
 khebaranism_adherent_plural: "Хебаранцы"
 khebaranism_desc: "Хебаранцы верят, что учения $amsari_prophet_link$ Пророка#! скрывают более глубокие истины, доступные только тем, кто обладает мудростью их воспринять. Для них [Concept('gh_zenda','Зенда')|E] многослоена, и то, что запрещено невеждам, может быть дозволено просвещённым, если это служит высшей цели. Это привело к неортодоксальным толкованиям религиозного закона, где мораль определяется мудростью, а не жёсткой доктриной. Хебаранизм некоторое время процветал в Западном Сирале, несмотря на суровые преследования со стороны ортодоксальных [Concept('gh_frazan','фразанов')|E], которые осуждают его учения как опасную ересь."

 mezrai: "Мезраийск"
 mezrai_adj: "Мезраи"
 mezrai_adherent: "Мезраисец"
 mezrai_adherent_plural: "Мезраисцы"
 mezrai_desc: "Возникнув в Лиркаке в Северном Леване, мезраисцы возводят своё учение к Сарвану и-Хизраду, человеку, который, как они утверждают, получил тайное откровение от $amsari_prophet_link$ Пророка#! во время прохождения через этот регион. Говорят, что Пророк доверил ему истины, слишком сложные для простых умов простолюдинов, учения, предназначенные только для избранных, чтобы полностью понять более глубокую мудрость Заорана. Отвергая идею записи своих тайных знаний, мезраисцы передавали их устно через строгие инициатические обряды."

 hazrandanism: "Хазранданск"
 hazrandanism_adj: "Хазранданизм"
 hazrandanism_adherent: "Хазранданец"
 hazrandanism_adherent_plural: "Хазранданцы"
 hazrandanism_desc: "Некогда одно из самых популярных движений после смерти $amsari_prophet_link$ Пророка#! и некоторое время после установления Амсарского Хиклана, хазранданизм отвергает письменные писания, веря, что они искажают вечную и адаптивную природу божественной истины. Для хазранданцев вера должна сохраняться через устную традицию, поскольку эволюция языка и личное понимание необходимы для сохранения её истинного смысла. Со временем движение пришло в упадок, столкнувшись с репрессиями со стороны [Concept('gh_frazan','фразанов')|E], которые рассматривали его учения как прямую угрозу целостности послания Пророка. Теперь лишь небольшие разрозненные общины продолжают поддерживать его традиции."

 ihzafeh: "Ихзафехск"
 ihzafeh_adj: "Ихзафехизм"
 ihzafeh_adherent: "Ихзафехсанец"
 ihzafeh_adherent_plural: "Ихзафехсанцы"
 ihzafeh_desc: "Ихзафехсанцы возникли в противовес тому, что они считали разложением общества, особенно среди правящей элиты и духовенства [Concept('gh_frazan','фразанов')|E], которых они считали декадентскими и отчуждёнными от истинной веры. Отвергая жёсткую доктрину, они считают, что личное толкование является чистейшим способом понимания воли Заорана, ставя прямой духовный опыт выше авторитета религиозных институтов. Для ихзафехсанцев вера не ограничена иерархией, а определяется искренностью преданности."

 nashadism: "Нашадийск"
 nashadism_adj: "Нашадизм"
 nashadism_adherent: "Нашаданец"
 nashadism_adherent_plural: "Нашаданцы"
 nashadism_desc: "Нашадизм оформился после [Concept('gh_massacre_of_the_ten_heirs','Резни десяти наследников')|E]. Однако многие заоранийские мыслители, такие как Арвашдан Ижакхет, вместе с местным населением уже начали ставить под сомнение давнюю веру в то, что легитимность передаётся исключительно по крови. Недовольство как прошлыми, так и нынешними правителями привело их к утверждению, что борьба и праведность единолично определяют право правителя на власть.\n\nПо иронии судьбы, в попытке завоевать больше сторонников по всему [Concept('amsar','Амсару')|E] и укрепить своё политическое положение, они сплотились вокруг Нашада. Который был якобы выжившим сыном старшего наследника канамсара Парашада, и отвергли «узурпаторшу» канамсару Тову. Для нашадийцев законная линия престолонаследия проходила через Радеша и его сына Нашада, которого они считали предназначенным вести их к предсказанной победе. История повторилась, когда после его смерти и провала [Concept('gh_emerald_rebellion','Изумрудного восстания')|E] его самые рьяные последователи настаивали на том, что он спрятал ребёнка, который однажды вернёт себе законное право."

 elaahism: "Элаахск"
 elaahism_adj: "Элаахизм"
 elaahism_adherent: "Элаахец"
 elaahism_adherent_plural: "Элаахцы"
 elaahism_desc: "Элаахцы — одна из немногих амсарских сект, которые веками сохраняли свои собственные верования после смерти [Concept('gh_the_amsari_prophet','Пророка')|E] и формирования Хиклана. Они отвергают саму историю творения и [Concept('gh_amsari_story_first_struggle','Первое противостояние')|E], описанные в [Concept('gh_zenda','Зенде')|E]. Веря, что действия Белрука были неправильно поняты, и что Иралья на самом деле была агентом Майи, сбившей [Concept('gh_amsari_first_dreamers','Первых сновидцев')|E] с пути Заорана. Как следствие, они считают, что Пророк укрепил искажённую версию веры, которая не признаёт истинную борьбу против обмана и лжи. Элаахцы считают, что истинная вера в Заорана требует отвержения лжи, навязанной миру с первой Битвы."

 kaelenyanism: "Кэлэнианск"
 kaelenyanism_adj: "Кэлэнианизм"
 kaelenyanism_adherent: "Заораниец"
 kaelenyanism_adherent_plural: "Заоранийцы"
 kaelenyanism_desc: "Кэлэнианизм основан на абсолютной уверенности в том, что Кэлэн, «Избранный Сосуд», является живым воплощением воли Заорана, посланным очистить мир от его повсеместной лжи и наступить эру божественного порядка. Приверженцы верят, что каждое заявление и каждый указ Кэлэна являются прямым исхождением от самого Заорана, делая все прошлые толкования второстепенными. Жить по воле Кэлэна — значит жить в совершенном согласии с Заораном, ибо новый Пророк воплощает саму суть очищения. Их вера требует непоколебимого послушания и пламенной преданности видению Кэлэна, веря, что только через его прямое руководство человечество может быть искуплено и мир станет целостным."

 shehzarani: "Шехзаранийск"
 shehzarani_adj: "Шехзаранизм"
 shehzarani_adherent: "Шехзараниец"
 shehzarani_adherent_plural: "Шехзаранийцы"
 shehzarani_desc: "Многие пытались объяснить сходство и примирить различия между заоранийской и шехардийской верами. Шехзаранизм представляет собой древнее слияние, утверждая, что высший Бог является единым универсальным божеством, известным под бесчисленными именами на протяжении веков, будь то ЭЛОЙ, Заоран или другие. Его последователи верят, что это единое божественное существо никогда не переставало направлять человечество, посылая множество Пророков на протяжении истории, происходящих от Первых сновидцев, Маликийя, каждый из которых был адаптирован к своему времени и народу, чтобы учить вечному посланию праведности против обмана. Верные могут не только вернуться к божественной благодати Бога, но и помочь в его конечной, предсказанной победе над всяким обманом, отвергнув изначальный обман Эйр-Шайтана."

 arishayana: "Аришаянск"
 arishayana_adj: "Аришаянизм"
 arishayana_adherent: "Заораниец"
 arishayana_adherent_plural: "Заоранийцы"
 arishayana_desc: "Аришанская вера следует радикальным откровениям пророчицы Ариши аз-Бехни, которая утверждала, что Последняя Битва уже произошла и что Заоран умер, когда Майя разбил луну — что ознаменовало конец Пророчества и прямого божественного руководства. Однако она верила, что Заоран оставил миру последний дар: его сущность была вложена во все вещи, и, развивая повышенное осознание — как это сделала она, — можно было воспринять божественное взаимодействие воли Заорана во всём, присутствие, которое будет направлять верных в его отсутствие.\n\nОбъехав мир и став свидетелем пробуждения первого Великого Спящего, Ариша провозгласила, что поведёт верных в Последней Битве, которая скоро обрушится на человечество, и избавит их от тьмы. Её смерть накануне предсказанного конфликта оставила её последователей в смятении, вынужденных, казалось бы, встретить Последнюю Битву без своего лидера."

 beshanida: "Бешанидийск"
 beshanida_adj: "Бешанидизм"
 beshanida_adherent: "Заораниец"
 beshanida_adherent_plural: "Заоранийцы"
 beshanida_desc: "Считаемое реформистским течением в раннем постпророческом заоранианизме, бешаниды сегодня запоминаются главным образом своим абсолютным неприятием любого обожествления пророческой линии, в отличие от растущего культового движения, которое терпелось, если не поощрялось, первой дочерью канамсара Аушедара, Мехревой. Название бешанида происходит от загадочной фигуры, известной как [Concept('gh_last_witness_conflict','Последний Свидетель')|E], хотя о происхождении, намерениях или исчезновении этой фигуры мало что известно.\n\nСчитается, что движение повлияло на некоторые литургические упрощения и, безусловно, сыграло роль в иконоборческих указах, изданных при канамсаре Ша'Нире, которая после исчезновения фигуры позиционировала себя как центральный авторитет внутри движения. Секта постепенно потеряла свою целостность и вскоре угасла."

 holy_order_swords_of_the_faithful: "Мечи Верных"
 holy_order_sun_sworn: "Солнечные Клятвенники"
 holy_order_spear_of_god: "Копьё Бога"

 amsari_interpretative_tradition_name: "Толковательная традиция"
 amsari_mainstream_doctrine_name: "Традиция Махндаяни"
 amsari_mainstream_doctrine_desc: "Традиция Махндаяни является основным пониманием Зенды и Сазан-э-Махндази, как их преподают Фразаны из Унидж-э-Кахдерза и других крупных центров обучения, развивавшихся на протяжении веков. Она рассматривает Пророчество как буквальное разворачивание будущего, а слова Пророка как абсолютные и окончательные, отвергая отклонения, которые ставят под угрозу установленные моральные и духовные рамки.\n\nХотя её приверженцы допускают толкование, они делают это строго в рамках традиции и только в учреждениях Фразанов под руководством самых учёных богословов. Любое радикальное отклонение от их толкования рассматривается как еретическое и подлежит репрессиям со стороны Фразанов."

 amsari_nezrakh_doctrine_name: "Традиция Незрахси"
 amsari_nezrakh_doctrine_desc: "Процветая в традиционно неструктурированных заоранийских движениях ранних дней Хиклана, а также в более ранние времена, эта широкая категория охватывает различные веры, которые подчёркивают личное толкование священных текстов и поощряют духовные дискуссии на всех уровнях общества.\n\nЭто традиционно приводило её приверженцев к более терпимому и открытому подходу к различным толкованиям. Хотя основное течение редко было открыто враждебным к тому, что оно считает заблудшими толкованиями Зенды, оно часто смотрело на них с подозрением и стремилось ограничить их влияние."

 amsari_belrukan_doctrine_name: "Традиция Белрука"
 amsari_belrukan_doctrine_desc: "Белруки отвергают традиционное повествование о творении, выраженное в Зенде, веря, что истина о Заоране была затемнена с Первой Битвы. Они придают особое значение Белруку, которого считают неправильно осуждённым. Для них те, кто верит или учит традиционному повествованию о творении, являются еретиками, которых необходимо уничтожить, чтобы истинная вера восторжествовала."

 amsari_vehuj_doctrine_name: "Традиция Веджуд"
 amsari_vehuj_doctrine_desc: "Традиция Веджуд считает, что божественная истина должна оставаться текучей, передаваемой через устную традицию. Зенда — это живая память, эволюционирующая через речь и мудрость поколений. Всё остальное отсекает веру от её текучей и вечно развивающейся сущности."

 amsari_suhdrash_doctrine_name: "Традиция Сухдраш"
 amsari_suhdrash_doctrine_desc: "Сухдраш — это широкий термин, который исторически использовался для описания любого, кто считает своё толкование Зенды единственной и абсолютной истиной. Хотя конкретика их доктрин различается, все секты Сухдраш разделяют бескомпромиссную позицию против переосмысления или богословских расхождений."

 amsari_no_doctrine_name: "Без традиции"
 amsari_no_doctrine_desc: "Её приверженцы не соответствуют ни одной традиционной заоранийской интерпретации мира, но всё же считаются заоранийскими по своей природе."

