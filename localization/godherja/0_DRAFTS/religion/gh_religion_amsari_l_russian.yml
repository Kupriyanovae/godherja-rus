 tenet_blood_of_the_prophet_name: "Кровь Пророка"
 tenet_blood_of_the_prophet_desc: "Кровь Пророка — это священный дар, знак божественной милости и власти. Те, кто несёт это наследие, связаны судьбой вести праведных. Почитать кровную линию — значит почитать волю самого Заорана."
 doctrine_parameter_blood_of_the_prophet_temple_holding_active: "Канамсары с достаточным [Concept('piety','благочестием')|E] могут владеть [Concept('temple','храмовыми')|E] владениями"
 doctrine_parameter_blood_of_the_prophet_ancestry_decision_active: "[Concept('rulers','Правители')|E] могут дополнительно легитимизировать свою власть, прослеживая свою родословную до Пророка"
 doctrine_parameter_blood_of_the_prophet_prestige_marriage_active: "Брак с [Concept('character','персонажем')|E], имеющим [Concept('trait','свойство')|E] «[GetTrait('gh_blood_of_prophet').GetName( GetNullCharacter )]», приносит дополнительный [Concept('prestige','престиж')|E]"
 
 mahndayana: "Махндаянийск" # Основная традиция
 mahndayana_adj: "Махндаянизм"
 mahndayana_adherent: "Заораниец"
 mahndayana_adherent_plural: "Заоранийцы"
 mahndayana_desc: "[frodbrokna|E] стала подтверждением худших опасений многих заоранийцев, особенно потому, что это произошло именно тогда, когда $amsari_prophet_link$ Пророк#! предсказал поражение их бога. Люди остались в растерянности, задаваясь вопросом, как они могут продолжать существовать в мире, где зло победило добро. Их ответ был удивительно прост: продолжать жить так, как будто этого не произошло. Многие заоранийцы продолжают исполнять ритуалы и петь песни своих предков, отчаянно надеясь, что их жесты однажды приведут Заорана к предсказанной победе."
 
 mahnda_yathekar: "Махнда Ятекарск"
 mahnda_yathekar_adj: "Махнда Ятекар"
 mahnda_yathekar_adherent: "Ятекариец"
 mahnda_yathekar_adherent_plural: "Ятекари"
 mahnda_yathekar_desc: "Сосредоточенные вокруг фигуры, считающейся реинкарнацией $amsari_prophet_link$ Пророка#!, точные учения 'Ложного Пророка' были утеряны на протяжении веков. Однако его последователи, как говорят, отвергли ключевые аспекты основного Махндаянизма, возложив абсолютную веру в божественную власть своего лидера."
 
 #Maybe good for secret faith system?
 daenavad: "Даэнавадизийск" # Основная традиция
 daenavad_adj: "Даэнавадизм"
 daenavad_adherent: "Даэнавадиец"
 daenavad_adherent_plural: "Даэнавади"
 daenavad_desc: "Founded within the Amonnid ruling dynasty, Daenavadism holds that the Amsari Hiklahn should be ruled by a descendant of the $amsari_prophet_link$ Prophet#!, a principle it extends to all positions of authority. It asserts that every position of power must be held by those who can directly trace their lineage to the Prophet. While no Qanamsar has ever officially adhered to Daenavad, its influence persists in the higher echelons of society among the Prophet's descendants, where the purity of one's lineage is regarded as the ultimate marker of authority and legitimacy."
 
 tirazhidar: "Тахкедарийск" # Основная традиция
 tirazhidar_adj: "Тахкедаризм"
 tirazhidar_adherent: "Заораниец"
 tirazhidar_adherent_plural: "Заоранийцы"
 tirazhidar_desc: "Its adherents blame the unfaithful for Zaoran's recent defeat and the catastrophe brought by [frodbrokna|E], seeing it as the hand of Maiya upon the world through the actions of humans. Their doctrine rests on a strictly literal reading of the [gh_zenda|E], treating verses that most scholars regard as metaphorical as direct commands? Salvation is not an individual pursuit but a collective duty.\n\nAn interpretation that has driven many of them toward violent actions, inclduing enacting forced conversion upon the wandering people of Amsar. To them, humanity must be brought beneath Zaoran's divine order for His triumph to be absolute. Only then will the world be made whole, and the Last Struggle at last be won."
 
 #Disappeared for a long time is gathering dust in late startdates
 mahazhadar: "Махазхадаризмийск"  # Традиция Тазаян
 mahazhadar_adj: "Махазхадаризм"
 mahazhadar_adherent: "Заораниец"
 mahazhadar_adherent_plural: "Заоранийцы"
 mahazhadar_desc: "Возникший в годы после смерти $amsari_prophet_link$ Пророка#!, Махазхадаризм ненадолго сохранился после [Concept('gh_amsari_rebellion','Восстания Амсари')|E], прежде чем исчезнуть. Махазхадари интерпретировали учения Пророка не как прямые заявления, а как символические выражения более глубоких истин. Его приверженцы считали, что события, описанные для будущего, не являются буквальными пророчествами, а абстрактными концепциями, требующими вдумчивой интерпретации. Они утверждали, что будущее, описанное Пророком, не является фиксированным, но может быть понято через размышления и дебаты."
 
 khebaranism: "Кхебаранийск"  # Традиция Тазаян
 khebaranism_adj: "Кхебаранизм"
 khebaranism_adherent: "Кхебаран"
 khebaranism_adherent_plural: "Кхебарани"
 khebaranism_desc: "Кхебарани верят, что учения $amsari_prophet_link$ Пророка#! скрывают более глубокие истины, доступные только тем, кто обладает мудростью, чтобы их воспринять. Для них [Concept('gh_zenda','Зенда')|E] многослойна, и то, что запрещено невежественным, может быть разрешено просвещённым, если это служит высшей цели. Это привело к неортодоксальным интерпретациям религиозного закона, где мораль диктуется мудростью, а не жёсткой доктриной. Кхебаранизм процветал некоторое время в Западном Сирале, несмотря на жёсткие преследования со стороны ортодоксальных [Concept('gh_frazan','Фразани')|E], которые осуждают его учения как опасную ересь."
 
 mezrai: "Мезра'ийск"
 mezrai_adj: "Мезра'и"
 mezrai_adherent: "Мезра'исан"
 mezrai_adherent_plural: "Мезра'иси"
 mezrai_desc: "Возникший в Лиркаке на севере Левана, Мезра'иси связывают свои учения с Сарваном и-Хизрадом, человеком, который, как они утверждают, получил тайное откровение от $amsari_prophet_link$ Пророка#!, проходя через этот регион. Пророк, как говорят, доверил ему истины, слишком сложные для простых умов простолюдинов, учения, предназначенные только для тех, кто избран для полного понимания более глубокой мудрости Заорана. Отвергая идею записи своих тайных знаний, Мезра'иси передавали их устно через строгие обряды посвящения."
 
 hazrandanism: "Хазранданизмийск" # Традиция Тазаян
 hazrandanism_adj: "Хазранданизм"
 hazrandanism_adherent: "Хазрандан"
 hazrandanism_adherent_plural: "Хазрандани"
 hazrandanism_desc: "Когда-то одно из самых популярных движений после смерти $amsari_prophet_link$ Пророка#! и некоторое время после установления Амсари Хиклахна, Хазранданизм отвергает письменные писания, считая, что они искажают вечную и изменчивую природу божественной истины. Для Хазрандани вера должна сохраняться через устную традицию, так как эволюция языка и личного понимания необходима для сохранения её истинного смысла. Со временем движение сильно сократилось, столкнувшись с репрессиями со стороны [Concept('gh_frazan','Фразани')|E], которые рассматривали его учения как прямую угрозу целостности послания Пророка. Теперь только небольшие и разрозненные общины продолжают поддерживать его традиции."
 
 ihzafeh: "Ихзафехизмийск"  # Традиция Тазаян
 ihzafeh_adj: "Ихзафехизм"
 ihzafeh_adherent: "Ихзафехсан"
 ihzafeh_adherent_plural: "Ихзафехси"
 ihzafeh_desc: "Ихзафехси возникли в знак протеста против того, что они считали разложением общества, особенно среди правящей элиты и духовенства [Concept('gh_frazan','Фразани')|E], которых они считали развращёнными и отдалившимися от истинной веры. Отвергая жёсткую доктрину, они считают, что личная интерпретация — это самый чистый способ понять волю Заорана, возвышая прямой духовный опыт над авторитетом религиозных институтов. Для Ихзафеха вера не связана иерархией, а искренностью преданности."
 
 nashadism: "Нашадизмийск" # Основная традиция
 nashadism_adj: "Нашадизм"
 nashadism_adherent: "Нашадан"
 nashadism_adherent_plural: "Нашади"
 nashadism_desc: "Нашадизм окончательно сформировался после [Concept('gh_massacre_of_the_ten_heirs','Резни Десяти Наследников')|E]. Однако многие заоранийские мыслители, такие как Арвашдан Изхакет, а также местное население, уже начали сомневаться в давней вере в то, что легитимность передаётся исключительно через кровь. Недовольство как прошлыми, так и нынешними правителями привело их к утверждению, что борьба и праведность единственно определяют право правителя на власть.\n\nИронично, что в попытке получить больше поддержки по всему [Concept('amsar','Амсару')|E] и укрепить свою политическую позицию, они сплотились вокруг Нашада. Который был предполагаемым выжившим сыном старшего наследника Канамсара Парашада и отверг «узурпатора» Канамсару Тову. Для Нашади законная линия преемственности проходила через Радеша и его сына Нашада, которого они считали предназначенным вести их к предсказанной победе. Даже после его смерти и провала [Concept('gh_emerald_rebellion','Изумрудного восстания')|E], его самые преданные последователи настаивали, что он скрыл ребёнка, который однажды вернёт своё право по рождению."
 
 elaahism: "Элаахизмийск" # Традиция Белруки
 elaahism_adj: "Элаахизм"
 elaahism_adherent: "Элаахан"
 elaahism_adherent_plural: "Элаахи"
 elaahism_desc: "Элаахи — одна из немногих сект Амсари, которые сохранили свои верования на протяжении веков после смерти $amsari_prophet_link$ Пророка#! и образования Хиклахна. Они отвергают саму историю творения и [Concept('gh_amsari_story_first_struggle','первой борьбы амсари')|E], описанную в [Concept('gh_zenda','Зенде')|E]. Считая, что действия Белрука были неправильно поняты, и что Иралья была агентом Майи, уводящим [Concept('gh_amsari_first_dreamers','первых мечтателей')|E] от Заорана. Таким образом, они считают, что Пророк укрепил искажённую веру, которая не признаёт истинной борьбы против обмана и лжи. Элаахи верят, что истинная вера в Заорана требует отвержения лжи, навязанной миру с Первой Битвы."

 kaelenyanism: "Kaelenyanism"
 kaelenyanism_adj: "Kaelenyana"
 kaelenyanism_adherent: "Zaoranian"
 kaelenyanism_adherent_plural: "Zaoranians"
 kaelenyanism_desc: "Kaelenyanism is founded on the absolute conviction that Kaelen, the 'Chosen Vessel,' is the living incarnation of Zaoran's will, sent to purge the world of its pervasive falsehoods and usher in an age of divine order. Adherents believe that Kaelen's every pronouncement and every decree is a direct emanation from Zaoran Himself, rendering all past interpretations secondary. To live by the will of Kaelen is to live in perfect alignment with Zaoran, for the new Prophet embodies the very essence of purification. Their faith demands unwavering obedience and an ardent dedication to Kaelen's vision, believing that only through his direct guidance can humanity be redeemed and the world made whole."

 shehzarani: "Shehzaranism" #GH ASKIL TODO: Find better name
 shehzarani_adj: "Shehzaranic"
 shehzarani_adherent: "Shehzaranian"
 shehzarani_adherent_plural: "Shehzaranians"
 shehzarani_desc: "Many have attempted to explain the similarities and reconcile the differences between Zaoranic and Sheharddi faiths. Shehzaranism represents an ancient confluence, proposing that the ultimate High God is one universal deity, known by countless names across the ages, be it ELOI, Zaoran, or others. Its followers believe that this singular divine being has never ceased to guide humanity, sending a multitude of Prophets throughout history descending from the First Dreamers, the Malikiyah, each tailored to their time and people, to teach the eternal message of righteousness against deception. The Faithful can not only return to God's heavenly grace but also aid in His ultimate, prophesied victory over all deception, by rejecting the primordial deceit of Eir'Shaytan."

 #Perhaps more radical?
 arishayana: "Arishayanism"
 arishayana_adj: "Arishayana"
 arishayana_adherent: "Zaoranian"
 arishayana_adherent_plural: "Zaoranians"
 arishayana_desc: "The Arishani Faith follows the radical revelations of Prophetess Arisha az-Behni, who asserted that the Last Struggle had already occurred, and that Zaoran had died when Maiya broke the moon—marking the end of the Prophecy and of direct divine guidance. She believed, however, that Zaoran had left the world one final gift: His essence had been infused into all things, and by cultivating heightened awareness—as she had—one could perceive the divine interplay of Zaoran's Will in everything, a presence that would guide the Faithful in His absence.\n\nHaving traveled the world and witnessed the first Great Sleeper's awakening, Arisha proclaimed that she would lead the Faithful in the Last Battle, soon to fall upon humanity, and deliver them from darkness. Her death on the eve of the prophesied conflict left her followers in disarray, seemingly forced to face the Last Battle without their leader."

 beshanida: "Bēshanidism"
 beshanida_adj: "Bēshanida"
 beshanida_adherent: "Zaoranian"
 beshanida_adherent_plural: "Zaoranians"
 beshanida_desc: "Considered a reformist current within Post-Prophet early Zaoranianism, the Bēshanidi are today mainly remembered for their absolute rejection of any sort of apotheosis of the prophetic lineage, in contrast to the growing cult-like movement tolerated, if not encouraged, by the first daughter of Qanamsar Aushedar, Mehreva. The name Bēshanida derives from the enigmatic figure known as the [gh_last_witness_conflict|E], though little is agreed upon regarding this figure's origin, intentions, or disappearance.\n\nThe movement is believed to have influenced certain liturgical simplifications and certainly played a role in the iconoclastic decrees issued under Qanamsara Sha'Nira who, after the figure's disappearance, positioned herself as the central authority within the movement. The sect gradually lost coherence and withered soon after."

 holy_order_swords_of_the_faithful: "Мечи Верных"
 holy_order_sun_sworn: "Клятвенные Солнцу"
 holy_order_spear_of_god: "Копьё Бога"







 amsari_interpretative_tradition_name: "Интерпретативная Традиция"
 amsari_mainstream_doctrine_name: "Традиция Махндаяни"
 amsari_mainstream_doctrine_desc: "Традиция Махндаяни — это основное понимание Зенды и Сазан-е Махндази, как её преподают Фразани из Унидж-е Кахдерз и других известных центров обучения, развивавшихся на протяжении веков. Она рассматривает Пророчество как буквальное разворачивание будущего и слова Пророка как абсолютные и окончательные, отвергая отклонения, которые подрывают установленные моральные и духовные рамки.\n\nХотя её приверженцы допускают интерпретацию, это делается строго в рамках традиции и только в институтах Фразани под руководством самых учёных богословов. Любое радикальное отклонение от их интерпретации считается еретическими и подвергаются репрессиям со стороны Фразани."
 
 amsari_nezrakh_doctrine_name: "Традиция Незраха"
 amsari_nezrakh_doctrine_desc: "Расцветая в традиционно неструктурированных движениях Заоранцев в первые дни Хиклахна, а также в более ранние времена, эта широкая категория охватывает различные веры, которые подчёркивают личную интерпретацию священных текстов и поощряют духовные дискуссии на всех уровнях общества.\n\nЭто традиционно приводило её приверженцев к более терпимому и открытому подходу к различным интерпретациям. Хотя основное течение редко было открыто враждебным к тому, что оно считало отклонениями от Зенды, оно часто относилось к ним с подозрением и стремилось ограничить их влияние."
 
 amsari_belrukan_doctrine_name: "Традиция Белруки"
 amsari_belrukan_doctrine_desc: "Белруки отвергают традиционный рассказ о творении, изложенный в Зенде, считая, что истина Заорана была скрыта с Первой Битвы. Они уделяют особое внимание Белруку, которого считают неправильно понятым. Для них те, кто верит или учит традиционному рассказу о творении, являются еретиками, которых необходимо устранить, чтобы истинная вера восторжествовала."
 
 amsari_vehuj_doctrine_name: "Традиция Вехужа"
 amsari_vehuj_doctrine_desc: "Традиция Вехужа считает, что божественная истина должна оставаться текучей, передаваясь через устную традицию. Зенда — это живая память, развивающаяся через речь и мудрость поколений. Всё остальное отрывает веру от её текучей и постоянно развивающейся сущности."
 
 amsari_suhdrash_doctrine_name: "Традиция Сухдраша"
 amsari_suhdrash_doctrine_desc: "Сухдраш — это широкий термин, который исторически использовался для описания любого, кто считает свою интерпретацию Зенды единственной и абсолютной истиной. Хотя конкретные доктрины их сект различаются, все Сухдраши разделяют непримиримую позицию против переосмысления или теологического отклонения."
 
 amsari_no_doctrine_name: "Без Традиции"
 amsari_no_doctrine_desc: "Его приверженцы не следуют никакой традиционной Заоранской интерпретации мира. Но всё же считаются Заоранскими по своей природе."
 
