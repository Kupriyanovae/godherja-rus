 mahrator: "Махраторск"
 mahrator_adj: "Махратор"
 mahrator_adherent: "Махраторец"
 mahrator_adherent_plural: "Махраторцы"
 mahrator_desc: "Религия Махратор в основном анимистическая, поклоняющаяся огромному сонму конских духов, почитаемых почти наравне с богами. Каэган, Бог Коней и Царь Небес, как говорят, научил первых людей ездить на лошадях с помощью Матери-Кобылицы, которая некогда скакала по небу, пока богиня Ур-май, ненавидящая коней, не сбросила её на землю.\n\nКони почитаются как полубожественные, и им устраивают пышные похороны. Навредить коню — тяжкий грех, караемый смертью. Махраторцы также верят, что ценность человека доказывается только в бою, и потому совершают ритуальные набеги на врагов. И коням, и людям устраивают небесные погребения, чтобы Ур-май не могла украсть их души."

 omrayytor: "Омрайиторск"
 omrayytor_adj: "Омрайитор"
 omrayytor_adherent: "Омрайиторец"
 omrayytor_adherent_plural: "Омрайиторцы"
 omrayytor_desc: "Омрайиторцы верят, что Каэган даровал их хатану силу завоевать Амагею — долг кровью, который должен быть уплачен. Они видят войну как высшее проявление своей преданности богам, не в силах представить, чтобы их войско осело на месте, когда можно сжигать поля язычников. Однако они находят мало друзей среди земель Махратора из-за своих хвастливых резней и на протяжении всей истории с трудом завоёвывали больше, чем небольшие плацдармы."

 mshvirat: "Мшвиратск"
 mshvirat_adj: "Мшвират"
 mshvirat_adherent: "Мшвиратец"
 mshvirat_adherent_plural: "Мшвиратцы"
 mshvirat_desc: "Рождённая из веры, что кони слишком священны, чтобы тратить их на войну, строгие обряды Мшвирата ограничивают использование священных животных гонками и дальними путешествиями. Их воинские ритуалы вместо этого следуют более медленному пешему темпу, больше похожему на танец, чем на набег, из-за тщательности каждого шага. Однако в мирное время немногие могут сравниться с радостной атмосферой их конных игр."