 mahrator_religion_desc: "Религия Махратор происходит от верований [Concept('toragei_mahratian','Торагей-хатана')|E] и его клана, причём сам Торагей возводил свой род к великому [Concept('otachedian_empire','Отачеду')|E] через свою мать и её наложницу Ургу. Стремясь к славе, превосходящей ту, что он снискал во время [Concept('bayyuralar','Байюралара')|E], он повёл часть кланов на север, в Амагею, во время [Concept('aironoian_migration','Айронойского переселения')|E], выкроив там собственное царство. С тех пор религия эволюционировала до почти неузнаваемости от своих ольтенских предков, поклоняясь Богу Людей, [Glossary('Кайгану','GH_KAIGAN_GLOSS')], как Каэгану, Богу Коней и Царю Небес.
