 doctrine_dualist_name: "Dualist"
 doctrine_dualist_desc: "Existence is shaped by two opposing cosmic forces. Whether these powers are gods, principles or states of being, their struggle defines the world and the fate of all within it. The balance between them or the triumph of one over the other, lies at the heart of creation."
 doctrine_antitheist_name: "Antitheist"
 doctrine_antitheist_desc: "The gods are not worthy of worship. Whether they are cruel tyrants, false claimants to divinity or obstacles to mortal freedom, reverence toward them is misguided. True virtue is found in resisting the illusion of divine authority rather than submitting to it."
 doctrine_nontheist_name: "Non-Theist"
 doctrine_nontheist_desc: "The pursuit of truth and wisdom does not require devotion to gods. While supernatural forces, spiritual realities or higher truths may exist, divine being has no place within the faith's teachings."
 doctrine_pantheist_fix_name: "Pantheist"
 doctrine_pantheist_fix_desc: "The divine is not separate from the world but is the world itself. Every mountain, river, star and living thing forms part of a greater sacred whole, and understanding creation is understanding the divine."
 doctrine_animist_name: "Animist"
 doctrine_animist_desc: "The world is alive with countless spirits. They dwell within forests, rivers, mountains, animals and places both great and small. Maintaining proper relations with these unseen beings is essential to harmony and prosperity."
 doctrine_ancestor_worship_name: "Ancestor Worship"
 doctrine_ancestor_worship_desc: "The dead remain part of the community long after their passing. Ancestors watch over their descendants offer guidance and protection and are honored through rites, offerings, and remembrance. To neglect them is to abandon those upon whom the living still depend."