 doctrine_dualist_name: "Дуалистская"
 doctrine_dualist_desc: "Существование определяется двумя противоборствующими космическими силами. Будь то боги, принципы или состояния бытия, их борьба определяет мир и судьбу всего сущего. Равновесие между ними или торжество одного над другим лежит в основе мироздания."
 doctrine_antitheist_name: "Антитеистская"
 doctrine_antitheist_desc: "Боги не достойны поклонения. Будь то жестокие тираны, лжецы, присвоившие себе божественность, или препятствия на пути к свободе смертных, почитание их ошибочно. Истинная добродетель заключается в сопротивлении иллюзии божественной власти, а не в подчинении ей."
 doctrine_nontheist_name: "Нетеистская"
 doctrine_nontheist_desc: "Стремление к истине и мудрости не требует преданности богам. Хотя сверхъестественные силы, духовные реальности или высшие истины могут существовать, божественное существо не имеет места в учении этой веры."
 doctrine_pantheist_fix_name: "Пантеистская"
 doctrine_pantheist_fix_desc: "Божественное не отделено от мира, а является самим миром. Каждая гора, река, звезда и живое существо образуют часть великого священного целого, и постижение творения есть постижение божественного."
 doctrine_animist_name: "Анимистская"
 doctrine_animist_desc: "Мир полон бесчисленных духов. Они обитают в лесах, реках, горах, животных и местах, как великих, так и малых. Поддержание правильных отношений с этими незримыми существами необходимо для гармонии и процветания."
 doctrine_ancestor_worship_name: "Почитание предков"
 doctrine_ancestor_worship_desc: "Мёртвые остаются частью сообщества и после своей кончины. Предки наблюдают за потомками, даруют им наставления и защиту, и их почитают через обряды, подношения и поминовение. Пренебрегать ими — значит отрекаться от тех, на кого живые всё ещё полагаются."