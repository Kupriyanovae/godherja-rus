l_russian:

 kikarsagi_high_god_name: "Яркорч"
 kikarsagi_high_god_name_possessive: "Яркорча"

 kikarsagi_religion: "Тэгернакск"
 kikarsagi_religion_adj: "Тэгернак"
 kikarsagi_religion_adherent: "Тэгернак"
 kikarsagi_religion_adherent_plural: "Тэгернаки"
 kikarsagi_religion_desc: "Яркорч создал первых людей из духов, разделив с ними свою божественную [Concept('ardara','Ардару')|E], открыв им природу мира. Те, кто взращивает свою душу, вознесутся на небеса и сами обретут божественность; те, кто растрачивает свою Ардару, будут изгнаны обратно на Равнины Духов, чтобы вечно голодать по душам других."

 kikarsagi_aagio: "Кикарсагско-аагиократическ"
 kikarsagi_aagio_adj: "Кикарсагская Аагиократия"
 kikarsagi_aagio_adherent: "Кикарсагский аагиократ"
 kikarsagi_aagio_adherent_plural: "Кикарсагские аагиократы"
 kikarsagi_aagio_desc: "[Glossary('Пратогонои','GH_PRATOGONOI_GLOSS')] были перворождёнными детьми Яркорча-Чистейшего, возвышенными перед другими и наделёнными божественной [Concept('ardara','Ардарой')|E], чтобы вести и направлять всех людей. Но завистливые духи и слабые люди напали на империю, едва не разрушив её. Пратогонои теперь стремятся продолжить свою изначальную миссию. Те, кто повинуется обладающим врождённой Ардарой и помогает в этой священной миссии, будут гарантированно иметь место с Яркорчем."

 kikarsagi_aagiokrata: "Кикарсагско-телигонийск"
 kikarsagi_aagiokrata_adj: "Кикарсагские Телигонои"
 kikarsagi_aagiokrata_adherent: "Телигоноец"
 kikarsagi_aagiokrata_adherent_plural: "Телигонои"
 kikarsagi_aagiokrata_desc: "[Concept('frodbrokna','Фродброкна')|E] показала, что потомки [Glossary('Пратогоноев','GH_PRATOGONOI_GLOSS')] утратили свою [Concept('ardara','Ардару')|E], обрекая себя на гибель. Те, кто одолеет их, будут коронованы как [Glossary('Телигоноиар','GH_TELIGONOIAR_GLOSS')] и будут вознаграждены на вечность за исполнение суда Яркорча-Чистейшего. Те, кто наделён Ардарой, должны распространять её среди низших народов через деяния великой силы и подчинения, показывая другим благословенную природу своего ранга и ища достойных слуг, способных познать истинную природу мира."

 kikarsagi_old: "Руха-бинекчильск"
 kikarsagi_old_adj: "Руха Бинекчиле"
 kikarsagi_old_adherent: "Руха"
 kikarsagi_old_adherent_plural: "Рухи"
 kikarsagi_old_desc: "Рухи знали о [Concept('ardara','Ардаре')|E] с тех пор, как Яркорч возвысил людей среди духов Равнин Духов и создал первые маски, чтобы защитить их души. Другие могли забыть пути Яркорча, но он вернётся к своим верным во времена нужды, рождённый смертным под благословенными звёздами, чтобы жить и вести, прежде чем вернуться на свой божественный трон в небесах."

 kikarsagi_atrakar: "Кутсалсаг-анмауск"
 kikarsagi_atrakar_adj: "Кутсалсаг Анмау"
 kikarsagi_atrakar_adherent: "Анмаун"
 kikarsagi_atrakar_adherent_plural: "Анмауни"
 kikarsagi_atrakar_desc: "Анмауни хранят память о святых Нартахатане Озкане и Нартахатун Бетун, которые выбрали [Concept('ardara','Ардару')|E] и смерть вместо неверия и [Concept('aversaria','аверсарианского')|E] подчинения. Верные сохраняют память об их жертве через тайные общины, и считается, что [Concept('ardara','Ардара')|E] обретается через подражание двум Нартахатанам — защитой своего дома, воспитанием будущих поколений и сохранением священного вероучения."