l_russian:

 kikarsagi_high_god_name: "Яркорч"
 kikarsagi_high_god_name_possessive: "Яркорча"

 kikarsagi_religion: "Тэгернакск"
 kikarsagi_religion_adj: "Тэгернак"
 kikarsagi_religion_adherent: "Тэгернак"
 kikarsagi_religion_adherent_plural: "Тэгернаки"
 kikarsagi_religion_desc: "Яркорч создал первых людей из духов, поделившись с ними божественным даром ([ardara|E]) и открыв им природу мира. Те, кто взращивает свою душу, вознесутся на небеса и сами обретут божественность; те, кто растрачивает свою Ардару, будут изгнаны обратно на Равнины Духов, чтобы вечно голодать по душам других."

 kikarsagi_aagio: "Кикарсагско-аагиократическ"
 kikarsagi_aagio_adj: "Кикарсагская Аагиократия"
 kikarsagi_aagio_adherent: "Кикарсагский аагиократ"
 kikarsagi_aagio_adherent_plural: "Кикарсагские аагиократы"
 kikarsagi_aagio_desc: "[Glossary('Пратогонои','GH_PRATOGONOI_GLOSS')] были перворождёнными детьми Яркорча-Чистейшего, возвышенными перед другими и получившими божественный дар ([ardara|E]), чтобы вести и направлять всех людей. Но завистливые духи и слабые люди напали на империю, едва не разрушив её. Пратогонои теперь стремятся продолжить свою изначальную миссию. Те, кто повинуется обладающим врождённой Ардарой и помогает в этой священной миссии, будут гарантированно иметь место с Яркорчем."

 kikarsagi_aagiokrata: "Кикарсагско-телигонийск"
 kikarsagi_aagiokrata_adj: "Кикарсагские Телигонои"
 kikarsagi_aagiokrata_adherent: "Телигоноец"
 kikarsagi_aagiokrata_adherent_plural: "Телигонои"
 kikarsagi_aagiokrata_desc: "[Concept('frodbrokna','Фродброкна')|E] показала, что [ardara|E] покинула потомков [Glossary('Пратогоноев','GH_PRATOGONOI_GLOSS')], обрекая их на гибель. Те, кто одолеет их, будут коронованы как [Glossary('Телигоноиар','GH_TELIGONOIAR_GLOSS')] и будут вознаграждены на вечность за исполнение суда Яркорча-Чистейшего. Те, кто наделён Ардарой, должны распространять её среди низших народов через деяния великой силы и подчинения, показывая другим благословенную природу своего ранга и ища достойных слуг, способных познать истинную природу мира."

 kikarsagi_old: "Руха-бинекчильск"
 kikarsagi_old_adj: "Руха Бинекчиле"
 kikarsagi_old_adherent: "Руха"
 kikarsagi_old_adherent_plural: "Рухи"
 kikarsagi_old_desc: "$kikarsagi_old_adherent_plural$ знают, что такое [ardara|E], с тех пор, как Яркорч возвысил людей из числа духов Равнин Духов и создал первые маски, чтобы защитить их души. Другие, быть может, забыли пути Яркорча, но в час нужды он вернётся к своим верным. Он родится смертным под благословенными звёздами, чтобы жить среди них и вести их за собой, прежде чем вновь взойти на свой божественный трон на небесах."

 kikarsagi_atrakar: "Кутсалсаг-анмауск"
 kikarsagi_atrakar_adj: "Кутсалсаг Анмау"
 kikarsagi_atrakar_adherent: "Анмаун"
 kikarsagi_atrakar_adherent_plural: "Анмауни"
 kikarsagi_atrakar_desc: "$kikarsagi_atrakar_adherent_plural$ хранят память о святых Нартахатане Озкане и Нартахатун Бетун, для которых [ardara|E] и смерть были предпочтительнее неверия и [Concept('aversaria','аверсарианского')|E] подчинения. Верные чтят память об их жертве на тайных обрядах причащения и верят, что [ardara|E] обретается через подражание двум Нартахатанам — защитой своего дома, воспитанием будущих поколений и сохранением священного вероучения."
