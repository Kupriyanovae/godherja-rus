 ahridar: "Ахридарск"
 ahridar_adj: "Ахридаризм"
 ahridar_adherent: "Ахридарист"
 ahridar_adherent_plural: "Ахридаристы"

 ahridar_desc: "Странные и несколько загадочные верования племён западного кратера, Ахридар — это почитание древнего бога-царя Охрасика, который освободил человечество от рабства у древних дьяволов, некогда наполнявших мир тьмой. Охрасик перебил дьяволов и поработил многих из них, дабы они следовали его воле, но раны, оставленные дьяволами в мире, никогда не исчезли, став тенью и ночью, и противостояли Охрасику, принявшему обличье солнца в небе. Ахридаристы утверждают, что Охрасик — крайне деятельный бог, несмотря на молчание, которое он хранит к своим верным; Охрасик просто настолько сосредоточен на своей ежедневной войне с тенью, что не в силах ответить на большинство молитв верных.\n\nМногие ахридаристские вожди объявляли себя [Concept('malaak','Малааком')|E], или воплощением Охрасика, утверждая, что Охрасик иногда помогает своим верным, принимая человеческий облик и сражаясь со слугами тьмы. Большинство правителей, принимающих этот титул, провозглашают: «Это я сражу луну» — при своём провозглашении, веря, что [Concept('aervalr','Эрвал')|E] — злой бог, направляющий дьяволов против Охрасика.\n\n[Concept('aversaria','Аверсарианские')|E] учёные отметили, что ахридаристская устная традиция, похоже, ссылается на несколько событий, которые на самом деле произошли не рядом с кратером, а в древней Аверсарии. Несмотря на это, никакой дальнейшей связи найдено не было, и вера остаётся исключительно интересной темой в аверсарианских учёных кругах, хотя она слишком отдалена и изолирована от аверсарианских дел, чтобы ей уделяли серьёзное внимание."

 arayvtar: "Арайвтарск"
 arayvtar_adj: "Арайвтаризм"
 arayvtar_adherent: "Арайвтарист"
 arayvtar_adherent_plural: "Арайвтаристы"

 arayvtar_desc: "Возникнув из древних взаимодействий с [Concept('wardenism','варденитами')|E], арайвтаристы полагают, что Варден и несколько видных [Concept('mamuramat','мамуров')|E] в варденитской религии были на самом деле [Concept('malaak','Малааками')|E], исполняющими волю Охрасика. Как следствие, арайвтаристы переняли некоторые из учений Вардена, утверждая, что луна — это темница, заключающая мёртвого бога, и что правильные традиции и законы должны соблюдаться, чтобы удерживать его там."