 aversarinas_aagiokrata_desc: "[aversarinas_aagiokratia|E] — это собирательное название для всевозможных деноминаций, ответвлений и ересей [Concept('aversaria','Аверсарианской Аавтократии')|E] и Имперского культа. Хотя их догматы могут разительно отличаться, в основном они вращаются вокруг веры в первородных «[Concept('aelfir','Первых людей')|E]» — божественную расу людей, [Concept('magic','владеющих магией')|E], под предводительством [magi|E] по имени [Concept('aersanon','Чистейший')|E], которые некогда правили [Concept('first_empire','Мировым Городом')|E] и [Concept('first_empire','Первой империей')|E]. Аагиократия по большей части лишена единой и сплоченной системы верований, вместо этого в ней доминируют бесчисленные культы, зачастую происходящие от бесчисленных верований, давным-давно покоренных и поглощенных Империей."
 
 abdexorn_aagiokrata: "Абдексорно-аагиократическ"
 abdexorn_aagiokrata_adj: "Абдексорнская аагиократия"
 abdexorn_aagiokrata_adherent: "Абдексорнский аагиократ"
 abdexorn_aagiokrata_adherent_plural: "Абдексорнские аагиократы"
 abdexorn_aagiokrata_desc: "[Concept('shatteredisles','Островитяне')|E] из Абдексорна хранят верность своим древним героям и сердцем, и разумом. Знаменитые воины и [Concept('magi','маги')|E] — легендарные личности, без страха и сомнения ковавшие облик островов и сокрушавшие цивилизации. Они сплотили враждующие города-государства благодаря единой цели и духу воителей, передающемуся из поколения в поколение. Многие из их героев некогда были извечными врагами [Concept('aversaria','Аверсарии')|E], но в конце концов склонились перед Чистейшим, скрепив узы кровью. Для некоторых эти герои были предателями, и избранным Абдексорна предначертано поставить Аверсарию на колени."
 
 aeschraes_aagiokrata: "Эшреистск"
 aeschraes_aagiokrata_adj: "Эшреизим"
 aeschraes_aagiokrata_adherent: "Эшреист"
 aeschraes_aagiokrata_adherent_plural: "Эшреисты"
 aeschraes_aagiokrata_desc: "Несмотря на то, что именно он в ответе за начало [Concept('frodbrokna','Фродброны')|E] и уничтожение [Concept('aversaria','Аверсарии')|E|], $aauto_aeschraes_link$ легоном-аавтократом Эшреем#! постепенно взрастил культ фанатиков на протяжении [Concept('imperial_civil_war','Имперской гражданской войны')|E] и особенно в хаотичные последующие десятилетия. Этот культ упорно настаивает, что его «ошибки» были результатом махинаций темных злодеев (а именно — $aauto_axiaothea_link$ Аксиотеи#!). Они утверждают — и не без оснований, — что трон принадлежал ему по праву и закону, и все, кто называют себя потомками Чистейшего, обязаны склониться перед его волей."
 aeschraes_aagiokrata_devil_name: "$aauto_axiaothea_link$ Аксиотея#!"
 aeschraes_aagiokrata_devil_name_alternate: "$aeschraes_aagiokrata_devil_name$"
 aeschraes_aagiokrata_devil_name_possessive: "$aauto_axiaothea_link$ Аксиотеи#!"
 aeschraes_aagiokrata_devil_name_alternate_possessive: "$aeschraes_aagiokrata_devil_name_possessive$"
 
 manikos_aagiokrata: "Маниакально-аагиократическ"
 manikos_aagiokrata_adj: "Маниакальная аагиократия"
 manikos_aagiokrata_desc: "Эта вера, распространяемая Мегистосом «Безумным императором», отвергается приверженцами традиционных [Concept('aversaria','аверсарианских')|E] устоев как издевательство над добродетелью. Для самих последователей потомки Чистейшего ментально и физически достаточно крепки, чтобы предаваться плотским удовольствиям без страха перед пороком. Но для посторонних это выглядит как бред безумного сатиромана, утверждающего, будто его боги требуют от него устраивать оргии и делить ложе со всеми красавицами двора."
 MadEmperor_religious_text: "Указы императора"
 manikos_aagiokrata_adherent: "Маниакальный аагиократ"
 manikos_aagiokrata_adherent_plural: "Маниакальные аагиократы"

 nicanonean_aagiokrata: "Никанонианск"
 nicanonean_aagiokrata_adj: "Никанонианство"
 nicanonean_aagiokrata_adherent: "Никанонианец"
 nicanonean_aagiokrata_adherent_plural: "Никанонианцы"
 nicanonean_aagiokrata_desc: "Никанонианство — это поклонение $nicanoneus_link$ Никанонею «Черному солнцу»#! как реинкарнации [Concept('aersanon','Чистейшего')|E]. Этот [Concept('aversaria','аверсарианский')|E] военачальник обожествил себя вскоре после своего [Concept('the_black_mountain_war','прибытия')|E] в Калатипсоми, после чего культ распространился в рядах его легионов и среди лоялистов, перед которыми он заявлял, будто сам Чистейший доставил его на [aeras|E] под барабанный бой [Concept('aelfir','Первых людей')|E]."
 
 aversarinas_aagiokrata_reformed: "Реформированно-аагиократическ"
 aversarinas_aagiokrata_reformed_adj: "Реформированная аверсарианская аагиократия"
 aversarinas_aagiokrata_reformed_desc: "Старые традиции [Concept('aversaria','аверсарианцев')|E] погибли точно так же, как практиковались и насаждались — на острие меча. В хаосе, последовавшем за крахом Аверсарианской Аавтократии, леган Гекеда из LXI легиона поклялась навсегда предотвратить условия, приведшие к катастрофе. Отныне принадлежность к аверсарианцам определяется не чистотой родословной и предками, а личной добродетелью; благородная магократия былых времен была разрушена и заменена меритократией."
 aversarinas_aagiokrata_reformed_adherent: "Реформированный аагиократ"
 aversarinas_aagiokrata_reformed_adherent_plural: "Реформированные аагиократы"

 cult_of_the_waves: "Культо-волнск"
 cult_of_the_waves_adj: "Культ волн"
 cult_of_the_waves_desc: "После [Concept('frodbrokna','Фродброкны')|E] обитатели нескольких прибрежных островов стали одержимы морем. Они адаптировали свои ритуалы так, чтобы совершать их лицом к берегу, а их жрецы пытаются предсказывать будущее, наблюдая за очертаниями облаков и движением волн во время штормов. Они упорно твердят, что верны устоям не меньше любого другого агиократа, но резко умолкают, когда чужаки просят их подробнее объяснить детали их веры."
 cult_of_the_waves_adherent: "Адепт культа волн"
 cult_of_the_waves_adherent_plural: "Адепты культа волн"
 
 omitilos_aagiokrata: "Омитилосско-аагиократическ"
 omitilos_aagiokrata_adj: "Омитилосская аагиократия"
 omitilos_aagiokrata_desc: "Вслед за [Concept('frodbrokna','Фродброкной')|E] и распадом [Concept('aversaria','Аверсарии')|E] далеко не все представители имперского жречества смирились с потерей власти. Напротив, некоторые вознамерились её укрепить. Они сплотились вокруг одного из своих братьев, провозгласив его Ипсилонисом Омитилосом, и потребовали почтения от всех прочих духовных и светских правителей. Им нужен сильный лидер, вокруг которого смогут сплотиться верующие... и слабые короли, неспособные встать у них на пути."
 omitilos_aagiokrata_adherent: "Омитилианец"
 omitilos_aagiokrata_adherent_plural: "Омитилианцы"

 sjalvolki_aagiokrata: "Cьялвольско-аагиократическ"
 sjalvolki_aagiokrata_adherent: "Cьялвольский аагиократ"
 sjalvolki_aagiokrata_adherent_plural: "Cьялвольские аагиократы"
 sjalvolki_aagiokrata_adj: "Сьялволькская аагиократия"
 sjalvolki_aagiokrata_desc: "Бывшие последователи сьялволькской веры, познавшие силы [Concept('magic','магии')|E]. Эти сравнительно недавние новообращенные в веру [Concept('aversaria','аверсарианцев')|E] принесли с собой традиции, которые их братья по вере считают граничащими с ересью. Кроме того, их взгляды на мир куда более инклюзивны: они считают, что истинная вера и магические способности значат куда больше в вопросах чистоты, нежели самые именитые родословные."
