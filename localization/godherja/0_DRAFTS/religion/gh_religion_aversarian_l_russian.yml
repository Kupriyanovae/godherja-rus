 doctrine_imperial_stance_name: "Imperial Stance"

 gh_pro_imperial_doctrine_name: "Pro-Imperial"
 gh_pro_imperial_doctrine_desc: "Aversaria was mankind's greatest achievement. Though some of its rulers may have been flawed and its glory now lies in ruins, its ideals, institutions and hierarchy remain the surest path to order. The legacy of the Aautokratirs should be preserved, and in time restored."

 gh_imperial_neutral_doctrine_name: "Imperial Pragmatism"
 gh_imperial_neutral_doctrine_desc: "The Empire is dead and endless arguments over its memory accomplish little. Its traditions may be honored where they remain useful and discarded where they do not. Our concern is not the past but the survival and prosperity of the faithful."

 gh_anti_imperial_doctrine_name: "Anti-Imperial"
 gh_anti_imperial_doctrine_desc: "Aversaria's fall was not a tragedy, merely the inevitable consequence of its own arrogance. Its very  ambitions and claims to universal rule brought ruin upon the world. Humanity can only move forward by rejecting the Imperial order and forging a different future."

 gh_hyper_imperial_doctrine_name: "Hyper-Imperial"
 gh_hyper_imperial_doctrine_desc: "The Empire represent natural and sacred order of mankind. Every law, every conquest, and every life serves the destiny of humanity. The restoration of true Imperial rule is a divine obligation from which no compromise can be tolerated."