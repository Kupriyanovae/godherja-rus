 doctrine_imperial_stance_name: "Имперская Позиция"

 gh_pro_imperial_doctrine_name: "Проимперская"
 gh_pro_imperial_doctrine_desc: "Аверсария была величайшим достижением человечества. Хотя некоторые из её правителей могли быть несовершенны, а её слава ныне лежит в руинах, её идеалы, институты и иерархия остаются самым верным путём к порядку. Наследие Аавтократов должно быть сохранено и со временем восстановлено."

 gh_imperial_neutral_doctrine_name: "Имперский прагматизм"
 gh_imperial_neutral_doctrine_desc: "Империя мертва, и бесконечные споры о её памяти мало чего достигают. Её традиции можно чтить там, где они остаются полезными, и отбрасывать там, где они таковыми не являются. Наша забота — не прошлое, а выживание и процветание верных."

 gh_anti_imperial_doctrine_name: "Антиимперская"
 gh_anti_imperial_doctrine_desc: "Падение Аверсарии не было трагедией, а лишь неизбежным следствием её собственной гордыни. Её амбиции и притязания на вселенское владычество привели мир к гибели. Человечество может двигаться вперёд, только отвергнув имперский порядок и создав иное будущее."

 gh_hyper_imperial_doctrine_name: "Гиперимперская"
 gh_hyper_imperial_doctrine_desc: "Империя представляет естественный и священный порядок человечества. Каждый закон, каждое завоевание и каждая жизнь служат судьбе человечества. Восстановление истинного имперского правления — это божественная обязанность, в которой не может быть компромиссов."