 iyrossi_aagiokrata: "Ийросско-аагиократическ"
 iyrossi_aagiokrata_adj: "Ийросская Аагиократия"
 iyrossi_aagiokrata_adherent: "Ийросский аагиократ"
 iyrossi_aagiokrata_adherent_plural: "Ийросские аагиократы"
 iyrossi_aagiokrata_desc: "Результат многовековых [Concept('aversaria','аверсарианских')|E] законов над ийросским поклонением, «Ийросская Аагиократия» — это остатки десятков древних ийросских вер, смешанных через принудительное переселение и якобы «реинкарнацию» их богов в аверсарианских (обычно малькойских) фигурах. Хотя ийросцы всё ещё придерживаются некоторых своих старых вер через Говорящих Времени, даже боги помнятся только по-аверсариански."

