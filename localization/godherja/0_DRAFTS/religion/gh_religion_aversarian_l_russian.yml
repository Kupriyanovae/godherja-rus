 aversarinas_aagiokrata_desc: "[aversarinas_aagiokratia|E] — это обобщающий термин для различных деноминаций, ответвлений и ересей [Concept('aversaria','Аверсарианской Аавтократии')|E] и Имперского культа. Хотя их догматы могут сильно различаться, в основном они вращаются вокруг веры в изначальных '[Concept('aelfir','Первых людей')|E]' — божественную расу [Concept('magic','владеющих магией')|E] людей, ведомых [Concept('magi','магом')|E] по имени [Concept('aersanon','Чистейший')|E], который некогда правил [Concept('first_empire','Мировым городом')|E] и [Concept('first_empire','Первой империей')|E]. Аагиократия — это религия, по большей части лишённая какой-либо целостной системы верований, и вместо этого в ней доминируют бесчисленные культы, часто происходящие от бесчисленных вер, давно завоёванных и поглощённых Империей."

 abdexorn_aagiokrata: "Абдексорнско-аагиократическ" 
 abdexorn_aagiokrata_adj: "Абдексорнская Аагиократия"
 abdexorn_aagiokrata_adherent: "Абдексорнский аагиократ"
 abdexorn_aagiokrata_adherent_plural: "Абдексорнские аагиократы"
 abdexorn_aagiokrata_desc: "[Concept('shatteredisles','Островитяне')|E] Абдексорна чтят своих древних героев и сердцем, и разумом. Знаменитых воинов и [Concept('magi','магов')|E], легенд, которые создавали острова и низвергали цивилизации без страха и сомнений. Они объединяли соперничающие города-государства с целью и воинским духом, передаваемым из поколения в поколение. Многие из их героев были древними врагами [Concept('aversaria','Аверсарии')|E], которые в конце концов склонились перед Чистейшим через узы крови. Для некоторых эти герои были предателями, и избранные Абдексорна обречены поставить Аверсарию на колени."

 aeschraes_aagiokrata: "Эшреистск"
 aeschraes_aagiokrata_adj: "Эшреизм"
 aeschraes_aagiokrata_adherent: "Эшреист"
 aeschraes_aagiokrata_adherent_plural: "Эшреисты"
 aeschraes_aagiokrata_desc: "Хотя именно он ответственен за высвобождение [frodbrokna|E] и разрушение [aversaria|E], $aauto_aeschraes_link$ аавтократ-легон Эшрей#! постепенно создал культ фанатиков во время [imperial_civil_war|E] и особенно в хаотичные десятилетия после неё, которые по-прежнему настаивают на том, что его «ошибки» были происками тёмных злодеев (а именно $aauto_axiaothea_link$ Аксиотеи#!). Они утверждают — не без оснований, — что трон принадлежал ему по праву и закону, и все, кто называет себя потомками Чистейшего, должны склониться перед его властью."
 aeschraes_aagiokrata_devil_name: "$aauto_axiaothea_link$ Аксиотея#!"
 aeschraes_aagiokrata_devil_name_alternate: "$aeschraes_aagiokrata_devil_name$"
 aeschraes_aagiokrata_devil_name_possessive: "$aauto_axiaothea_link$ Аксиотеи#!"
 aeschraes_aagiokrata_devil_name_alternate_possessive: "$aeschraes_aagiokrata_devil_name_possessive$"

 manikos_aagiokrata: "Маникосско-аагиократическ"
 manikos_aagiokrata_adj: "Маникосская Аагиократия"
 manikos_aagiokrata_desc: "Распространяемая Мегистом «Безумным Императором», эта вера отвергается как насмешка над добродетелью теми, кто придерживается традиционных [Concept('aversaria','аверсарианских')|E] путей. Для приверженцев потомки Чистейшего достаточно здравы умом и телом, чтобы предаваться физическим ощущениям без страха развращения. Но для посторонних это похоже на бредни безумного сатиромана, который говорит, что его боги хотят, чтобы он устраивал оргии и переспал со всеми красивыми женщинами при своём дворе."
 MadEmperor_religious_text: "Императорские указы"
 manikos_aagiokrata_adherent: "Маникосский аагиократ"
 manikos_aagiokrata_adherent_plural: "Маникосские аагиократы"

 nicanonean_aagiokrata: "Никанонеанск"
 nicanonean_aagiokrata_adj: "Никанонеанство"
 nicanonean_aagiokrata_adherent: "Никанонеанец"
 nicanonean_aagiokrata_adherent_plural: "Никанонеанцы"
 nicanonean_aagiokrata_desc: "Никанонеанство — это почитание $nicanoneus_link$ Никанонея «Чёрного Солнца»#! как реинкарнации [Concept('aersanon','Чистейшего')|E]. Аверсарианский военачальник обожествил себя вскоре после своего [Concept('the_black_mountain_war','прибытия')|E] в Калатипсоми, и культ впоследствии распространился среди рядов его легионов и сторонников, которым он заявлял, что был лично приведён на [aeras|E] самим Чистейшим под барабаны [Concept('aelfir','Первых людей')|E]."

 aversarinas_aagiokrata_reformed: "Реформированно-аагиократическ"
 aversarinas_aagiokrata_reformed_adj: "Реформированная Аверсарианская Аагиократия"
 aversarinas_aagiokrata_reformed_desc: "Старые пути [Concept('aversaria','аверсарианцев')|E] умерли так же, как они практиковались и навязывались — на острие меча. В хаосе, последовавшем за крахом Аверсарианской Аавтократии, леган Гекаэда из LXI легиона поклялась предотвратить обстоятельства, которые привели к её разрушению, от повторения. Быть аверсарианцем больше не определяется родословной и происхождением, а личной добродетелью, и благородная магическая олигархия старого мира была разрушена и заменена меритократией."
 aversarinas_aagiokrata_reformed_adherent: "Реформированный аагиократ"
 aversarinas_aagiokrata_reformed_adherent_plural: "Реформированные аагиократы"

 cult_of_the_waves: "Морск-культск"
 cult_of_the_waves_adj: "Культ Волн"
 cult_of_the_waves_desc: "После [Concept('frodbrokna','Фродброкны')|E] жители нескольких прибрежных островов стали одержимы морем. Они адаптировали свои ритуалы так, чтобы проводить их лицом к берегу, а их жрецы пытаются предсказывать будущее, наблюдая за облаками и волнами во время штормов. Они настаивают на том, что остаются такими же верными, как и любой другой аагиократ, но внезапно замолкают, когда посторонний спрашивает их о подробностях их веры."
 cult_of_the_waves_adherent: "Морской культист"
 cult_of_the_waves_adherent_plural: "Морские культисты"

 omitilos_aagiokrata: "Омитилосско-аагиократическ"
 omitilos_aagiokrata_adj: "Омитилосская Аагиократия"
 omitilos_aagiokrata_desc: "После [Concept('frodbrokna','Фродброкны')|E] и распада [Concept('aversaria','Аверсарии')|E] не все Имперские жрецы были готовы потерять власть. Напротив, некоторые стремились её консолидировать. Они сплотились вокруг одного из своих и провозгласили его Ипсилонис Омитилосом, требуя почтения от всех прочих церковных и светских правителей. Они хотят сильного главы, вокруг которого верные могли бы сплотиться... и слабых королей, которые неспособны встать у них на пути."
 omitilos_aagiokrata_adherent: "Омитилосец"
 omitilos_aagiokrata_adherent_plural: "Омитилосцы"

 sjalvolki_aagiokrata: "Сьялвольско-аагиократическ"
 sjalvolki_aagiokrata_adherent: "Сьялвольский аагиократ"
 sjalvolki_aagiokrata_adherent_plural: "Сьялвольские аагиократы"
 sjalvolki_aagiokrata_adj: "Сьялвольская Аагиократия"
 sjalvolki_aagiokrata_desc: "Бывшие последователи сьялвольской веры, познавшие силы [Concept('magic','магии')|E], эти относительно недавние обращённые на путь [Concept('aversaria','аверсарианцев')|E] принесли с собой традиции, которые их братья по вере считают почти еретическими. У них также более инклюзивное мировоззрение, и они считают, что вера и магические способности могут перевесить даже самые родовитые кровные линии в вопросах чистоты."
