 aversarinas_aagiokrata_religion_desc: "[aversarinas_aagiokratia|E] — это обобщающий термин для различных деноминаций, ответвлений и ересей [Concept('aversaria','Аверсарианской Аавтократии')|E] и Имперского культа. Хотя их догматы могут сильно различаться, в основном они вращаются вокруг веры в изначальных '[Concept('aelfir','Первых людей')|E]' — божественную расу [Concept('magic','владеющих магией')|E] людей, ведомых [Concept('magi','магом')|E] по имени [Concept('aersanon','Чистейший')|E], который некогда правил [Concept('first_empire','Мировым городом')|E] и [Concept('first_empire','Первой империей')|E]. Аагиократия — это религия, по большей части лишённая какой-либо целостной системы верований, и вместо этого в ней доминируют бесчисленные культы, часто происходящие от бесчисленных вер, давно завоёванных и поглощённых Империей."

