 aversarinas_aagiokrata_religion_desc: "[aversarinas_aagiokratia|E] — это собирательное название для всевозможных деноминаций, ответвлений и ересей [Concept('aversaria','Аверсарианской Аавтократии')|E] и Имперского культа. Хотя их догматы могут разительно отличаться, в основном они вращаются вокруг веры в первородных «[Concept('aelfir','Первых людей')|E]» — божественную расу людей, [Concept('magic','владеющих магией')|E], под предводительством [Concept('magi','магов')|E] по имени [Concept('aersanon','Чистейший')|E], которые некогда правили [Concept('first_empire','Мировым Городом')|E] и [Concept('first_empire','Первой империей')|E]. Аагиократия по большей части лишена единой и сплоченной системы верований, вместо этого в ней доминируют бесчисленные культы, зачастую происходящие от бесчисленных верований, давным-давно покоренных и поглощенных Империей."
