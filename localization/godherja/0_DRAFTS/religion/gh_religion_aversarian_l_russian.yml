 amaghean_aagiokrata_war_god_name: "Арназ"
 amaghean_aagiokrata_war_god_name_possessive: "Арназа"
 amaghean_aagiokrata_desc: "[Concept('aversaria','Аверсианизированная')|E] версия тысяч амагейских вер, Амагейская Аагиократия сильно подчёркивает роль [Concept('magi','магов')|E] (особенно аверсарианской крови) в амагейской вере и их способность возвышаться до божественности наравне с великими воинами прошлого. Более того, Амагейская Аагиократия утверждает, что Маги могут превзойти даже другие божества и быть ближе к Арназу «Великому Предку», вечно правя из небесного рая. Воины всё ещё чаще возносятся, хотя вера подчёркивает, что это происходит через проявление «аспектов Магов» и что они редко, если вообще когда-либо, смогут подняться так же высоко, как одарённые. Эта вера возникла, когда Аверсария умиротворила амагейское побережье; однако она не получила широкого распространения до правления Дедафала Мариамны «Строительницы», которая покровительствовала Амагейской Аагиократии и превратила её в её современное воплощение."

 sunwarwei_aagiokrata: "Сунарвейско-аагиократическ"
 sunwarwei_aagiokrata_adj: "Сунарвейская Аагиократия"
 sunwarwei_aagiokrata_adherent: "Сунарвейский аагиократ"
 sunwarwei_aagiokrata_adherent_plural: "Сунарвейские аагиократы"
 sunwarwei_aagiokrata_desc: "Сунарвейская Аагиократия — возможно, один из самых своеобразных результатов [Concept('aversaria','аверсианизации')|E] местной веры для улучшения стабильности обширной империи Аверсарии. Хотя обычно аверсианизация веры включает модификацию веры для возвеличения аверсарианцев и [Concept('magi','магов')|E] в той или иной форме, Сунарвейская Аагиократия вместо этого пытается поощрять более милитаристские взгляды и противостоять своим традиционным пацифистским верованиям, почти не упоминая [Concept('peculiar_compromise_sunarwei','аверсарианцев')|E] или [Concept('magi','магов')|E]."

 aironoian_aagiokrata: "Айронойско-аагиократическ"
 aironoian_aagiokrata_adj: "Айронойская Аагиократия"
 aironoian_aagiokrata_adherent: "Айронойский аагиократ"
 aironoian_aagiokrata_adherent_plural: "Айронойские аагиократы"
 aironoian_aagiokrata_desc: "Из-за большой удалённости от родины, аверсарианским жрецам в Восточном Айроное было трудно поддерживать какую-либо ортодоксию среди верных. Хотя Аверсарианская Аагиократия никогда не была последовательной среди своих тысяч местных и имперских культов, массовое отклонение, в которое скатились её восточные практикующие, вызывало такое беспокойство, что многие жрецы опасались, что они вовсе отпадут от веры. Несмотря на все попытки, то, что стало известно как Айронойская Аагиократия, в основном достигло уровня согласованности со своими восточными культами вместо метрополии, и вскоре стало несколько кодифицированной ересью, глубоко укоренившейся в [Concept('cosmopolitan_eastern_aversarians','Восточной культуре')|E]."

 drakanorix_aagiokrata: "Драканориксско-аагиократическ"
 drakanorix_aagiokrata_adj: "Драканориксская Аагиократия"
 drakanorix_aagiokrata_adherent: "Драканориксский аагиократ"
 drakanorix_aagiokrata_adherent_plural: "Драканориксские аагиократы"
 drakanorix_aagiokrata_desc: "Драканориксская Аагиократия (буквально «[Concept('dragons','Драконья')|E] Вера» на [Concept('aversaria','аверсарианских')|E] языках) — это древняя аверсарианская система верований, предшествующая большинству известных памятников и любой форме аверсарианской письменности, почитаемая верующими как изначальная вера аверсарианских народов. Известно, что древнейший найденный фрагмент аверсарианской письменности, Драканорамоникар, был создан древними лидерами этой веры для кодификации их религии.\n\nДраканориксская Аагиократия поклоняется драконам древней Аверсарии, обожествляя их как существ чистой [Concept('magic','магии')|E] и божественности, посланных в мир забытым существом, чтобы править людьми. Будучи крайне разрозненной и распространённой по большей части мира (культы встречаются вплоть до [Concept('sarradon','Саррадона')|E]), вера тем не менее доминировала на большей части того, что сейчас является Имперским островом, Этепезеей и Расколотым морем. Она оставалась столпом аверсарианского общества даже после формирования [Concept('aversarinas_aagiokratia','Аверсарианской Аагиократии')|E], сойдя на нет лишь после [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E]. По иронии судьбы, они служили Имперской фракции в Гражданской войне, их давняя ненависть к Эрсодиаксинизму бросила их на сторону Аагиократии. После их победы Летигианекс перебил всех оставшихся драконов, а вместе с ними и оставшихся культистов. Последний верховный жрец Драконьих культов предпринял последнее восстание при $aauto_maklea_link$ аавтократии Маклее#! в разгар её чисток и был освежёван и прибит к стене её дворца осквернёнными рогами драконов."

 zaragett_aagiokrata: "Зарагеттско-аагиократическ"
 zaragett_aagiokrata_adj: "Зарагеттская Аагиократия"
 zaragett_aagiokrata_adherent: "Зарагеттский аагиократ"
 zaragett_aagiokrata_adherent_plural: "Зарагеттские аагиократы"
 zaragett_aagiokrata_desc: "Острова юго-востока находились под властью [Concept('aversaria','Аверсарии')|E] ещё до [Concept('chaos_of_the_seventh_century','Хаос седьмого века')|E], и хотя многие считали их незначительными, аавтократир Варфаний приложил большие усилия для консолидации имперского контроля над этим районом, чтобы обезопасить проход между зарождающейся провинцией Айроной и Опахасией. Частью его инициатив было подчинение Зарагеттов, повелителей водной магии, которые жили в этом районе с незапамятных времён и яростно сопротивлялись первоначальному аверсарианскому завоеванию. Результатом стала Зарагеттская Аагиократия — вера, возвышающая жречество [Concept('magi','магов')|E] до положения верховной власти как над мирским, так и над духовным мирами. Более того, назначенные боги-цари должны были служить верховными жрецами, ставя их выше остального жречества и правя над верными как воплощения Морской Матери и Отца Луны. Обычно правящий аавтократир Аверсарии считается богом-царём Зарагеттов, хотя в последнее время многие военачальники стали использовать этот титул в погоне за ещё большей властью."

 aversarian_gorassos: "Горассианск"
 aversarian_gorassos_adj: "Горассосианство"
 aversarian_gorassos_adherent: "Горассианец"
 aversarian_gorassos_adherent_plural: "Горассианцы"
 aversarian_gorassos_desc: "Названная её последователями в честь одноимённого основателя и лидера $gorassos_link$ Горассоса#!, [Concept('aversaria','аверсарианская')|E] вера была грубо переделана в культ войны и смерти. Чистота зарабатывается не кровью в жилах, а тем, сколько языческой крови пролито. И Горассос намеревался, чтобы во имя его было пролито #EMP много#! крови."
 aversarian_gorassos_religious_text: "слова Горассоса"

 aversarian_axiaotheaism: "Аксиотеистск"
 aversarian_axiaotheaism_adj: "Аксиотеизм"
 aversarian_axiaotheaism_adherent: "Аксиотеист"
 aversarian_axiaotheaism_adherent_plural: "Аксиотеисты"
 aversarian_axiaotheaism_desc: "Хотя $aauto_axiaothea_link$ Аксиотея#! и её самые могущественные сторонники были убиты подлым $aauto_aeschraes_link$ Эшреем#!, когда он призвал [Concept('frodbrokna','Фродброкну')|E], у покойной императрицы всё ещё есть свои сторонники в бывших границах Империи. Они почитают её наследие, почти обожествляя её, изображая её борьбу с Эшреем как битву между добром и злом за судьбу мира. И, к сожалению, на этот раз зло взяло верх."
 aversarian_axiaotheaism_high_god_name_alternate: "$aauto_axiaothea_link$ Аксиотея#!"
 aversarian_axiaotheaism_high_god_name_alternate_possessive: "$aauto_axiaothea_link$ Аксиотеи#!"
 aversarian_axiaotheaism_devil_name: "$aauto_aeschraes_link$ Эшрей#!"
 aversarian_axiaotheaism_devil_name_alternate: "$aversarian_axiaotheaism_devil_name$"
 aversarian_axiaotheaism_devil_name_possessive: "$aauto_aeschraes_link$ Эшрея#!"
 aversarian_axiaotheaism_devil_name_alternate_possessive: "$aversarian_axiaotheaism_devil_name_possessive$"

 black_fraternity: "Чернобратск"
 black_fraternity_adj: "Чёрное Братство"
 black_fraternity_adherent: "Чёрный Практик"
 black_fraternity_adherent_plural: "Чёрные Практики"
 black_fraternity_desc: "«Кровь слабых удобрит землю чистых душ».\n\nТаков девиз Чёрных Практиков. Состоящее из самых гнусных [Concept('aversaria','аверсарианских')|E] [Concept('magi','магов')|E], Чёрное Братство посвящает себя единственной цели: сотворению Куснаменой, заклинанию, которое исказит мир и создаст для них новый рай над всем сущим.\n\nВызывая моральное отвращение даже у собратьев-аверсарианцев, Чёрные Практики вынуждены залечь на дно, их влияние в основном сосредоточено в изолированных деревнях и поселениях, где они консолидировали свою власть после краха Аверсарии. В этих деревнях нет иных богов, кроме Магов; эти условия породили систему поклонения, ориентированную на того Мага, который окажется сильнейшим."
 black_fraternity_high_god_name: "Магус Ферорус"
 black_fraternity_high_god_name_possessive: "Магуса Фероруса"
 black_fraternity_high_god_name_alternate: "Верховный Маг"
 black_fraternity_high_god_name_alternate_possessive: "Верховного Мага"
 black_fraternity_devil_name: "Нечистый"
 black_fraternity_devil_name_alternate: "Нечистый"
 black_fraternity_devil_name_possessive: "Нечистого"
 black_fraternity_devil_name_alternate_possessive: "Нечистого"
 black_fraternity_death_deity_name: "смерть"
 black_fraternity_death_deity_name_possessive: "смерти"
 black_fraternity_house_of_worship: "Кратакас"
 black_fraternity_house_of_worship_plural: "Кратака"
 black_fraternity_religious_symbol: "Куснатере"
 black_fraternity_religious_text: "книги заклинаний"

 red_star: "Краснозвёздный-культистск"
 red_star_adj: "Культ Красной Звезды"
 red_star_adherent: "Краснозвёздный культист"
 red_star_adherent_plural: "Краснозвёздные культисты"
 red_star_desc: "Увидев великую красную комету, предвещавшую Пожирателя Миров, некоторые из последователей Эрсодиакса заключили, что это был знак. Пожиратель Миров, утверждали они, был «Первым Вестником», одним из десяти великих зверей, которые предшествуют возвращению Эрсодиакса, восставшего из мёртвых, чтобы наказать тех, кто предал его. Считая себя стражами конца времён, их тайные собрания постепенно увеличили число Вестников, достигнув числа 8, когда [frodbrokna|E] опустошила мир. Увидев то, что, несомненно, было началом конца, жрецы поспешили объявить последних двух Вестников, причём $aauto_aeschraes_link$ Эшрей#! и $aauto_axiaothea_link$ Аксиотея#! были наиболее частым выбором для этого сомнительного почётного звания, хотя другие также стали кандидатами, включая [Concept('the_fog','Туман')|E], Эксионаракса, $cenware_link$ Ценвара#! и многих других.\n\nХотя обычно можно было бы ожидать, что такая вера консолидируется вокруг единого послания, надвигающийся апокалипсис сделал эти споры бесполезными, и поклонники Красной Звезды вместо этого посвящены тому, чтобы наслаждаться тем немногим временем, что у них осталось, в виде бесконечных празднеств и оргий, беря то, что они ещё могут взять от жизни, прежде чем их давно мёртвый господин вернётся, чтобы отомстить за их древний грех."

 militant_cliques: "Воинствующ"
 militant_cliques_adj: "Воинствующие Клики"
 militant_cliques_adherent: "Воинствующий"
 militant_cliques_adherent_plural: "Воинствующие"
 militant_cliques_desc: "Воинствующие Клики — это [Concept('aversaria','аверсарианский')|E] культ, происходящий из Легионов, основанный в основном на почитании агионистской Святой Сансии (как воплощения стратегического гения) и Святого Эоса (как воплощения воинского совершенства).\n\nСвятые имели много сторонников (и откровенных последователей) в Легионах, и после восстановления после Агионистских восстаний не было политической воли пытаться изгнать их из в остальном верных Легионов. Таким образом, почитание Святых всегда считалось несколько спорным, но крайне распространённым, и большинство солдат носят иконы $saint_sansia_link$ Сансии#! или $saint_eos_link$ Эоса#! как талисманы на удачу, даже если они не считают себя верными.\n\nНекоторые легионеры зашли так далеко, что почитают их обоих как две половины Чистейшего, и почти все ветераны-легионеры в Аверсарии исторически считали себя каким-то образом связанными с этими верованиями."

 five_hundred: "Кахаритск"
 five_hundred_adj: "Пятьсот Путей Кахарита"
 five_hundred_adherent: "Кахарит"
 five_hundred_adherent_plural: "Кахариты"
 five_hundred_desc: "Пятьсот Путей $saint_katharitos_link$ Кахарита#! происходят из того же источника, что и кахариты, оба посвящены почитанию Святого Кахарита. Но в отличие от своих агионистских собратьев, Последователи Пятисот Путей посвятили себя радикальному пацифизму. Они верят, что ни один человек не должен лишать жизни живое существо или использовать что-то, что не было свободно даровано им [aeras|E]. Многие из них толкуют этот принцип как запрет на ношение одежды из культивируемых тканей, шкур животных или металлических доспехов, и их легче всего узнать по ритуальной наготе.\n\nНесмотря на их неагрессивную природу, они навлекли на себя немало гнева как со стороны агионистов, так и [Concept('aversaria','аверсарианцев')|E]. Их осуждают как еретиков и извращенцев низшего сорта, и их часто преследуют и убивают во время паломничеств в места, важные в жизни Кахарита. Но это не мешает им исповедовать свою веру и не отпугивает новых рекрутов."

 blood_veneration: "Кровопочитательск"
 blood_veneration_adj: "Культ Крови"
 blood_veneration_adherent: "Кровопочитатель"
 blood_veneration_adherent_plural: "Кровопочитатели"
 blood_veneration_desc: "Один из древнейших культов [aversaria|E], такой же старый, как и эрсодиаксинизм, с несколькими высокопоставленными последователями. Считающийся прародителем аверсарианского кровопочитания, Культ Крови почитает кровь как святое отражение силы богов и строго верит, что мир принадлежит только святейшим [Concept('magi','магам')|E] Царям, ибо у них чистейшая кровь. Как таковые, последователи стремились создать совершенного Мага превыше всего, причём некоторые прибегали к крайним методам, начиная от браков внутри собственной семьи до очищения нечистых, часто во вред и к ужасу собственного населения."

 aversarinas_practitioner: "Практическо-аагиократическ"
 aversarinas_practitioner_adj: "Практическая Аагиократия"
 aversarinas_practitioner_adherent: "Практик аагиократ"
 aversarinas_practitioner_adherent_plural: "Практические аагиократы"
 aversarinas_practitioner_desc: "Впервые появившись после [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E] с возвышением [Concept('mayikrata','Майикратии')|E], Практическая Аагиократия — это культ, который считает, что [Concept('aversarinas_aagiokratia','Аверсарианская Аагиократия')|E] ущербна, позволяя профанацию именовать не-[Concept('magi','магов')|E] божественными. Приверженцы либо запираются в своих башнях, посвящая время исследованиям в поисках большего знания о тонкостях [Concept('magic','магии')|E] и её совершенствовании, либо работают над превращением [Concept('aversaria','Аверсарию')|E] в идеальную магическую олигархию. Хотя некоторые высмеивают их как амбициозных самозванцев с ограниченными легитимными навыками, объявление себя за культ считается демонстрацией силы среди могущественных (и не очень) магических дворян."

 theygundaropei_aagiokratian: "Пяти-фигурск"
 theygundaropei_aagiokratian_adj: "Пять Фигур"
 theygundaropei_aagiokratian_adherent: "Ведомый Пятью"
 theygundaropei_aagiokratian_adherent_plural: "Ведомые Пятью"
 theygundaropei_aagiokratian_desc: "Когда [aversaria|E] пришла за Тейгундаропе, древние верования были утеряны под жестоким натиском тотальной войны и геноцида. Что осталось — это легенда о Пяти Фигурах, древних пророках, спасших свой народ от уничтожения через подчинение Чистейшему. Доказав свою Чистоту, они вознеслись из этого мира, присоединившись к Чистейшему в божественности навечно.\n\nИх учения о Кровопочитании и самопожертвовании почитаются многими знатными родами, которые всё ещё ведут свою родословную к Пяти, сохраняя их наследие через мир и непрерывное правление только тех, кто благословлён Чистотой. Хотя [aversarinas_aagiokratia|E] в целом не одобряла эту вопиющую ересь, поколения наместников находили сосуществование наиболее прибыльным и стабильным курсом действий."

 conclavian_rite: "Конклавск"
 conclavian_rite_adj: "Конклавский Обряд"
 conclavian_rite_adherent: "Конклавианец"
 conclavian_rite_adherent_plural: "Конклавианцы"
 conclavian_rite_desc: "Среди островитян Расколотого побережья древние обычаи мёртвых империй долго процветали, синкретизированные с новыми богами и монархами. Для многих Святое Королевство Велоса было бы лишь продолжением этой долгой традиции, привязывающей их местные верования к новой власти."

