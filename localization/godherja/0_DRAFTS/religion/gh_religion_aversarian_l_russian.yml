 iyrossi_aagiokrata: "Iyrossi Aagiokrata"
 iyrossi_aagiokrata_adj: "Iyrossi Aagiokratan"
 iyrossi_aagiokrata_adherent: "Iyrossi Aagiokratan"
 iyrossi_aagiokrata_adherent_plural: "Iyrossi Aagiokratan"
 iyrossi_aagiokrata_desc: "The result of centuries of [Concept('aversaria','Aversarian')|E] laws over Iyrossi worship, the 'Iyrossi Aagiokrata' is the remains of dozens of ancient Iyrossi faiths mixed through forced relocation and the claimed 'reincarnation' of their gods in Aversarian (normally Malcoisiac) figures. While the Iyrossi still hold to some of their old faith through the Timespeakers, even gods are only remembered in Aversarian."
 
 amaghean_aagiokrata: "Амагенско-аагиократическ"
 amaghean_aagiokrata_adj: "Амагенская аагиократия"
 amaghean_aagiokrata_adherent: "Амагенский аагиократ"
 amaghean_aagiokrata_adherent_plural: "Амагенские аагиократы"
 amaghean_aagiokrata_war_god_name: "Arnaz"
 amaghean_aagiokrata_war_god_name_possessive: "Arnaz's"
 amaghean_aagiokrata_desc: "Аверсариазированная версия тысяч амагенских верований. Амагенская аагиократия делает огромный упор на роль [Concept('magi','магов')|E] (особенно тех, в ком течет [Concept('aversaria','аверсарианская')|E] кровь) и на их способность возноситься до божественности наряду с великими воинами древности. Более того, это учение гласит, что маги способны перейти на еще более высокий план бытия, нежели остальные боги, стать ближе к Арназу «Великому Предку» и вечно править из небесного рая. Воинов здесь по-прежнему прославляют чаще, однако вера подчеркивает, что это происходит лишь благодаря проявлению ими «аспектов магов», и что они вряд ли когда-либо смогут подняться столь же высоко, как те, кто наделен даром. Данная вера зародилась, когда Аверсария усмирила амагенские побережья; однако она не имела серьезного влияния вплоть до правления Дедафала Мариамны «Строительницы», которая стала покровительствовать амагенской агиократии и превратила её в современное воплощение."

 sunwarwei_aagiokrata: "Сунарвейско-аагиократическ"
 sunwarwei_aagiokrata_adj: "Сунарвейская аагиократия"
 sunwarwei_aagiokrata_adherent: "Сунарвейский аагиократ"
 sunwarwei_aagiokrata_adherent_plural: "Сунарвейские аагиократы"
 sunwarwei_aagiokrata_desc: "Сунарвейская аагиократия — пожалуй, один из самых причудливых результатов аверсариазации местных верований ради укрепления стабильности на просторах огромной империи [Concept('aversaria','Аверсарии')|E]. В то время как обычно аверсариазация веры подразумевает её изменение с целью превознесения аверсарианцев и [Concept('magi','магов')|E] ради подавления инакомыслия, сунарвейская аагиократия вместо этого пытается взрастить более милитаристские взгляды и вытеснить традиционный пацифизм местных жителей, при этом практически не упоминая ни об [Concept('peculiar_compromise_sunarwei', 'аверсарианцах')|E], ни о [Concept('magi','магах')|E]."

 aironoian_aagiokrata: "Айронойско-аагиократическ"
 aironoian_aagiokrata_adj: "Айронойская аагиократия"
 aironoian_aagiokrata_adherent: "Айронойский аагиократ"
 aironoian_aagiokrata_adherent_plural: "Айронойские аагиократы"
 aironoian_aagiokrata_desc: "Из-за огромного расстояния от родины [Concept('aversaria','аверсарианские')|E] жрецы в восточной Айроное с трудом могли поддерживать хоть какое-то подобие ортодоксии среди верующих. Хотя аверсарианская аагиократия никогда не отличалась монолитностью среди тысяч своих местных и имперских культов, массовое отклонение, в которое соскользнули её самые восточные последователи, вызывало такие опасения, что многие жрецы боялись их полного отпадения от веры. Однако, вопреки всем попыткам исправить ситуацию, учение, ставшее известным как айронойская агиократия, в итоге обрело внутреннее единообразие именно с восточными культами, а не с метрополией, и вскоре превратилось в полуофициальную ересь, глубоко укоренившуюся в [Concept('cosmopolitan_eastern_aversarians','Восточной культуре')|E]."
 
 drakanorix_aagiokrata: "Драканориксско-аагиократическ"
 drakanorix_aagiokrata_adj: "Драканориксская аагиократия"
 drakanorix_aagiokrata_adherent: "Драканориксский аагиократ"
 drakanorix_aagiokrata_adherent_plural: "Драканориксские аагиократы"
 drakanorix_aagiokrata_desc: "Драканориксская аагиократия (буквально «Вера в [Concept('dragons','драконов')|E]» на [Concept('aversaria','аверсарианских')|E] языках) — это древнейшая аверсарианская система верований, предшествовавшая большинству известных хроник и появлению любой аверсарианской письменности. Сами верующие считают её первозданной верой аверсарианских народов. Достоверно известно лишь то, что старейший из найденных памятников аверсарианской письменности, Драканорамоникар, был создан древними лидерами этой веры для кодификации своих догматов.\n\nДраканориксская аагиократия почитает драконов древней Аверсарии, обожествляя их как существ из чистой [Concept('magic','магии')|E] и божественной сути, посланных в этот мир неким забытым создателем ради правления людьми. Будучи крайне раздробленной и разбросанной по большей части мира (её культы встречаются даже в далеком [Concept('sarradon','Саррадоне')|E]), эта вера, тем не менее, долгое время доминировала на территории нынешнего Имперского острова, Этепезеи и Расколотого моря. Она оставалась столпом аверсаринского общества даже после формирования [Concept('aversarinas_aagiokratia','Аверсарианская Аавтократия')|E], отойдя на второй план лишь после [Concept('war_of_the_thousand_dragons','Война тысячи драконов')|E]. По иронии судьбы, во время Гражданской войны они служили имперской фракции — давняя ненависть к эрсодианизму толкнула их на одну сторону с агиократией. После победы Летигианей истребил всех оставшихся драконов, а вместе с ними и уцелевших культистов. Последний верховный жрец культов дракона попытался поднять финальное восстание в разгар чисток, устроенных $aauto_maklea_link$ аавтократом Маклеей#!, но был пойман, подвергнут сдиранию кожи и прибит к стене её дворца оскверненными драконьими рогами."
 
 zaragett_aagiokrata: "Зарагеттско-аагиократическ"
 zaragett_aagiokrata_adj: "Зарагеттская аагиократия"
 zaragett_aagiokrata_adherent: "Зарагеттский аагиократ"
 zaragett_aagiokrata_adherent_plural: "Зарагеттские аагиократы"
 zaragett_aagiokrata_desc: "Острова юго-востока находились под властью [Concept('aversaria','Аверсарии')|E] еще до [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E], и хотя многие считали их незначительными, аавтократ Вартаниус приложил огромные усилия для укрепления имперского контроля над этим регионом, дабы обезопасить проход между новообразованной провинцией Айроноей и Опахасией. Частью его инициатив стало подчинение народа зарагетт — мастеров магии воды, живших здесь с незапамятных времен и яростно сопротивлявшихся первоначальному аверсаринскому завоеванию. Результатом этого синтеза стала зарагеттская аагиократия — вера, возводящая жречество из числа [Concept('magi','магов')|E] в ранг высшей власти как над земным, так и над духовным мирами. Более того, назначенные боги-цари должны были служить верховными жрецами, что ставило их над остальным духовенством и позволяло править верующими в качестве земных воплощений Матери-Моря и Отца-Луны. Обычно богом-царем зарагетт признается правящий аавтократа Аверсарии, хотя в последнее время множество военачальников стали присваивать себе этот титул в погоне за еще большей властью."
 
 aversarian_gorassos: "Горассианск"
 aversarian_gorassos_adj: "Горассианство"
 aversarian_gorassos_adherent: "Горассианец"
 aversarian_gorassos_adherent_plural: "Горассианцы"
 aversarian_gorassos_desc: "Названная своими последователями в честь одноименного основателя и лидера $gorassos_link$ Горасса#!, эта [Concept('aversaria','аверсарианская')|E] вера была грубо превращена в культ войны и смерти. Чистота здесь заслуживается не кровью в жилах, а тем, сколько языческой крови ты прольешь. И Горасс намеревался пролить #EMP много#! крови во имя свое."
 aversarian_gorassos_religious_text: "Слова Горасса"
 
 aversarian_axiaotheaism: "Аксиотеистск"
 aversarian_axiaotheaism_adj: "Аксиотеизм"
 aversarian_axiaotheaism_adherent: "Аксиотеист"
 aversarian_axiaotheaism_adherent_plural: "Аксиотеисты"
 aversarian_axiaotheaism_desc: "Хотя $aauto_axiaothea_link$ Аксиотея#! и её самые могущественные сторонники были убиты презренным $aauto_aeschraes_link$ Эшреем#!, когда тот спровоцировал [Concept('frodbrokna','Фродброкну')|E], у покойной императрицы всё ещё остаются сторонники в пределах прежних границ Империи. Они почитают её наследие, граничащее с обожествлением, рисуя её борьбу с Эшреем как битву добра и зла за судьбу мира. И, к несчастью, на этот раз зло одержало верх."
 aversarian_axiaotheaism_high_god_name_alternate: "$aauto_axiaothea_link$ Аксиотея#!"
 aversarian_axiaotheaism_high_god_name_alternate_possessive: "$aauto_axiaothea_link$ Аксиотеи#!"
 aversarian_axiaotheaism_devil_name: "$aauto_aeschraes_link$ Эшрей#!"
 aversarian_axiaotheaism_devil_name_alternate: "$aversarian_axiaotheaism_devil_name$"
 aversarian_axiaotheaism_devil_name_possessive: "$aauto_aeschraes_link$ Эшреем#!"
 aversarian_axiaotheaism_devil_name_alternate_possessive: "$aversarian_axiaotheaism_devil_name_possessive$"
 
 black_fraternity: "Черно-братск"
 black_fraternity_adj: "Черное братство"
 black_fraternity_adherent: "Черный практик"
 black_fraternity_adherent_plural: "Черные практики"
 black_fraternity_desc: "«Кровь слабых засеет землю чистых душ».\n\nТаков лозунг черных практиков. Состоящие из самых мерзких [Concept('aversaria','аверсарианских')|E] [Concept('magi','магов')|E], черные практики из Черного братства посвящают себя лишь одной цели: сотворению Куснаменои — заклинания, призванного исказить мир и создать для них новый рай над всем сущим.\n\nВызывая моральное отвращение даже у своих соотечественников-аверсарианцев, черные практики вынуждены залечь на дно; их влияние в основном сосредоточено в изолированных деревнях и поселениях, где они укрепили свою власть после краха Аверсарии. В этих общинах не знают иных богов, кроме магов; подобные условия породили стяжательскую систему поклонения, ориентированную на того мага, который окажется сильнейшим."
 black_fraternity_high_god_name: "Маг Ферорус"
 black_fraternity_high_god_name_possessive: "Мага Фероруса"
 black_fraternity_high_god_name_alternate: "Верховный маг"
 black_fraternity_high_god_name_alternate_possessive: "Верховного мага"
 black_fraternity_devil_name: "Нечистивый"
 black_fraternity_devil_name_alternate: "$black_fraternity_devil_name$"
 black_fraternity_devil_name_possessive: "Нечистивого"
 black_fraternity_devil_name_alternate_possessive: "$black_fraternity_devil_name_possessive$"
 black_fraternity_death_deity_name: "смерть"
 black_fraternity_death_deity_name_possessive: "смерти"
 black_fraternity_house_of_worship: "кратакас"
 black_fraternity_house_of_worship_plural: "кратака"
 black_fraternity_religious_symbol: "Куснатере"
 black_fraternity_religious_text: "гримуары"

 red_star: "Культо-красной-звездск"
 red_star_adj: "Культ Красной звезды"
 red_star_adherent: "Адепт культа Красной звезды"
 red_star_adherent_plural: "Адепты культа Красной звезды"
 red_star_desc: "Увидев огромную красную комету, предвещавшую появление Пожирателя Миров, некоторые из последователей Эрсодия пришли к выводу, что это знамение. Пожиратель Миров, утверждали они, был «Первым Вестником» — чудовищем из числа десяти великих тварей, предваряющих возвращение Эрсодия, восставшего из мертвых ради кары тех, кто его предал. Считая себя стражами конца времен, они проводили тайные собрания, постепенно расширяя список Вестников, число которых достигло восьми к моменту, когда [Concept('frodbrokna','Фродброкна')|E] опустошила мир. Видя в этом очевидное начало конца, жрецы поспешили объявить двух последних Вестников, среди которых самыми популярными кандидатами на это сомнительное звание стали $aauto_aeschraes_link$ Эшрей#! и $aauto_axiaothea_link$ Аксиотея#!, хотя выдвигались и другие, включая [Concept('the_fog','Туман')|E], Эксионарая, $cenware_link$ Ценвара#! и многих прочих.\n\nХотя в обычных условиях от подобной веры ожидали бы сплочения вокруг единой догмы, надвигающийся апокалипсы превратил любые споры в бессмыслицу; вместо этого почитатели Красной звезды посвятили себя тому, чтобы наслаждаться остатками отведенного им времени, устраивая бесконечные празднества и оргии — забирая от жизни всё, что возможно, пока их давно мертвый господин не вернулся ради отмщения за древний грех."
 
 militant_cliques: "Кликов"
 militant_cliques_adj: "Военные клики"
 militant_cliques_adherent: "Милитант"
 militant_cliques_adherent_plural: "Милитанты"
 militant_cliques_desc: "Военные клики — это [Concept('aversaria','аверсарианский')|E] культ, зародившийся внутри легионов и основанный преимущественно на поклонении агионистской святой Сансии (как воплощению стратегического гения) и святому Эосу (как воплощению воинского совершенства).\n\nУ этих святых было множество сочувствующих (и прямых последователей) в легионах, и во время восстановления после Агионистских восстаний у властей не было политической воли пытаться искоренить их из состава в остальном лояльных легионов. Из-за этого почитание святых всегда считалось спорным, но крайне распространенным явлением, и большинство солдат носят иконы $saint_sansia_link$ Сансии#! или $saint_eos_link$ Эоса#! в качестве амулетов на удачу, даже если сами не считают себя истинно верующими.\n\nНекоторые легионеры зашли так далеко, что почитают их обоих исключительно как две половины Чистейшего; исторически почти все ветераны легионов в Аверсарии в той или иной степени связывали себя с этими верованиями."
 
 five_hundred: "Катаритск"
 five_hundred_adj: "Пятьсот путей Катаритоса"
 five_hundred_adherent: "Катарит"
 five_hundred_adherent_plural: "Катариты"
 five_hundred_desc: "Пятьсот путей $saint_katharitos_link$ Катарита#! берут свое начало из того же источника, что и обычные катариты, и так же посвящены почитанию святого Катаритоса. Но в отличие от своих собратьев-агионистов, последователи Пятисот Путей посвятили себя радикальному пацифизму. Они верят, что человек не должен лишать жизни ни одно живое существо или использовать то, что не было добровольно предложено им самим [Concept('aeras','Аэраса')|E]. Многие трактуют этот догмат как запрет на ношение одежды из обработанного текстиля, шкур животных или металлических доспехов, из-за чего их проще всего узнать по ритуальной наготе.\n\nНесмотря на свой неагрессивный характер, они навлекли на себя немало гнева как со стороны агионистов, так и со стороны аверсаринцев. Их осуждают как еретиков и извращенцев нижайшего пошиба, они часто подвергаются преследованиям и убийствам во время паломничеств по местам, важным для жизни Катарита. Однако это не мешает им исповедовать свою веру и не отпугивает новых новообращенных."
 
 blood_veneration: "Кровник"
 blood_veneration_adj: "Почитание крови"
 blood_veneration_adherent: "Кровник"
 blood_veneration_adherent_plural: "Кровники"
 blood_veneration_desc: "Один из древнейших культов [Concept('aversaria','Аверсарии')|E], ровесник эрсодианизма, имевший в своих рядах высокопоставленных последователей. Считающийся первоисточником аверсаринского культа крови, этот союз почитает кровь как священное отражение могущества богов и строго верит, что мир принадлежит лишь святейшим царям-[Concept('magi','магам')|E], ибо они обладают чистейшей кровью. Руководствуясь этим, приверженцы стремились сотворить идеального мага любыми путями; некоторые прибегали к крайним методам — от браков внутри собственной семьи до истребления нечистых, зачастую к ужасу и разорению собственного населения."
 
 aversarinas_practitioner: "Practitioner Aagiokrata"
 aversarinas_practitioner_adj: "Practitioner Aagiokratan"
 aversarinas_practitioner_adherent: "Practitioner Aagiokratan"
 aversarinas_practitioner_adherent_plural: "Practitioners Aagiokratans"
 aversarinas_practitioner_desc: "First appearing after the [chaos_of_the_seventh_century|E] with the rise of the [mayikrata|E], Practitioner Aagiokrata is a cult which believe that the [aversarinas_aagiokratia|E] is flawed for allowing the profanity of naming non-[magi|E] as divine. Adherents often either lock themselves in their towers devoting their time to research, in pursuit of learning more about the intricacies of [magic|E] and perfecting it, or work on turning [aversaria|E] into the ideal magocracy. Though derided as ambitious pretenders with limited legitimate skills by some, declaring oneself for the cult is seen as a showing of strength among the powerful (and not so powerful) Magi nobles."
 
 theygundaropei_aagiokratian: "Пяти-образовск"
 theygundaropei_aagiokratian_adj: "Пять Образов"
 theygundaropei_aagiokratian_adherent: "Ведомый Пятью"
 theygundaropei_aagiokratian_adherent_plural: "Ведомые Пятью"
 theygundaropei_aagiokratian_desc: "Когда [Concept('aversaria','Аверсария')|E] пришла на земли Тейгундаропе, древние верования местных жителей сгинули под жестоким натиском тотальной войны и геноцида. Всё, что уцелело — это легенда о Пяти Образах, древних пророках, спасших свой народ от истребления через полное подчинение Чистейшему. Доказав свою Чистоту, они вознеслись из этого мира, навечно разделив с Чистейшим его божественную суть.\n\nИх учения о почитании крови и самопожертвовании до сих пор чтутся многими знатными родами, ведущими свою родословную от этой Пятерки, что позволяет сохранять их наследие через мир и непрерывное правление лишь тех, кто благословлен Чистотой. Хотя [Concept('aversarinas_aagiokratia','Аверсарианская аагиократия')|E] в целом косо смотрела на эту откровенную ересь, целые поколения имперских наместников считали подобное сосуществование наиболее прибыльным и надежным курсом действий."

 conclavian_rite: "Conclavian Rite"
 conclavian_rite_adj: "Conclavian Rite"
 conclavian_rite_adherent: "Conclavian"
 conclavian_rite_adherent_plural: "Conclavians"
 conclavian_rite_desc: "Amongst the Islanders of the Shattered Coast, ancient customs of dead empires have long thrived, syncretised to new gods and monarchs. To many, the Holy Kingdom of Velos would be but a continuation of this long tradition, and tie their local beliefs on to a new authority."

