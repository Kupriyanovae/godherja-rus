 samojitian_religion_desc: "Самойтитские веры возникли из бесчисленных тысяч северных рабов, согнанных [Concept('aversaria','аверсарианцами')|E] на принудительные работы в чертогах их прославленной [Concept('mayikrata','Майикратии')|E]. Различные верования, которые они принесли с собой и к которым обращались в страданиях, начали сливаться воедино. Со временем адские условия труда породили новые религии, сформированные множеством их истоков и общими страданиями."

