 dejorig: "Дежористск"
 dejorig_adj: "Дежоризм"
 dejorig_adherent: "Дежорит"
 dejorig_adherent_plural: "Дежориты"
 dejorig_desc: "Религия северных рабов бывшей [Concept('mayikrata','Майикратии')|E], дежоритские верования происходят главным образом от тех рабов, которых отправляли на раскопки и исследование тёмных туннелей, пролегающих под [Concept('mayikrata','Майикратией')|E] — задача, которая убивала почти каждого мужчину и женщину, отправленных туда. Её последователи полностью отвергают [Concept('magic','магию')|E], считая её гнусным злом и сурово осуждая её влияние на то, что лежит под Цитаделью. Для дежоритов [Concept('magic','магия')|E] — источник зла в мире и, возможно, путь к его гибели."
 dejorig_old_old: "Старожежористск"
 dejorig_old_adj: "Старый Дежоризм"
 dejorig_old_adherent: "Старый дежорит"
 dejorig_old_adherent_plural: "Старые дежориты"

 oirigan: "Ойриганистск"
 oirigan_adj: "Ойриганизм"
 oirigan_adherent: "Ойриганец"
 oirigan_adherent_plural: "Ойриганцы"
 oirigan_desc: "Ойриганизм — религия южной креольской самойтитской культуры [Concept('mayikrata','Майикратии')|E]. Происходя от рабов, служивших в чертогах и башнях [Concept('mayikrata','Майикратии')|E] по воле [Concept('magi','магов')|E], рабы годами по крупицам собирали похищенные [Concept('magic','магические')|E] знания и сами постигали силу магии. Когда Ценвар из сьялволков вторгся в Майикратию и сокрушил власть Магов, они восстали с дарами самих Магов, чтобы уничтожить их. Ойриганцы поклоняются множеству богов, вдохновлённых украденными книгами, и видят в магии инструмент, необходимый для обеспечения свободы своего народа."
