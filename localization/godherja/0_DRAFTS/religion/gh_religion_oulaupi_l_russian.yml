 oulaupi: "Улаупийск"
 oulaupi_adj: "Улаупизим"
 oulaupi_adherent: "Улаупит"
 oulaupi_adherent_plural: "Улаупиты"
 oulaupi_desc: "Для улаупитов восемь высочайших вершин Северных Гор представляют собой восемь богов и их небеса, а высочайшая вершина «Наврег» — последняя и величайшая. Восхождение на все восемь вершин считается высшим актом преданности, и только те, кто поднялся до пятого неба, считаются достойными быть вождями. Их почитание высот привело улаупитов к странному обычаю — подвешивать гробы умерших на склонах гор, и они яростно запрещают всем чужакам приближаться к этим возвышенным кладбищам."
 oulaupi_old: "Староулаупийск"
 oulaupi_old_adj: "Старый Улаупизим"
 oulaupi_old_adherent: "Старый улаупит"
 oulaupi_old_adherent_plural: "Старые улаупиты"

 solungvend: "Солунгвендск"
 solungvend_adj: "Солунгвендизм"
 solungvend_adherent: "Солунгвендец"
 solungvend_adherent_plural: "Солунгвендцы"
 solungvend_desc: "Солунгвендцы придают большое значение чистоте себя, которую они стремятся достичь через глубокую медитацию. Последователи часто ищут изолированные вершины и ущелья, предпочтительно те, где мало точек опоры, поскольку они верят, что освобождение от физической привязанности к [Concept('aeras','Эрасу')|E] необходимо для достижения истинной безмятежности. Их трансы часто длятся по несколько дней, и лишь холодные ветры составляют им компанию."
