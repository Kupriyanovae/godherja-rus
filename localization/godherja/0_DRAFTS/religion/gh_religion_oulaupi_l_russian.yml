 cosnaupi_adj: "Коснаупизим"
 cosnaupi_adherent: "Коснаупиец"
 cosnaupi_adherent_plural: "Коснаупийцы"
 cosnaupi_desc: "После того как [Concept('frodbrokna','великое бедствие')|E] оторвало большую часть вершины Наврега, некоторые горные племена перестали считать её величайшим небом, почитая вместо этого то, что некогда было второй по высоте вершиной — Коснфрегль. Последователи этой веры имеют склонность приносить пленников в жертву на алтарях, возведённых вокруг горы, веря, что ритуалы восполнят [Concept('bloodcrystal','красную руду')|E], которую они часто добывают в глубинах Коснфрегля."
