 cnevobarthane_religion_desc:0 "Исконные верования островных теугомбрийских народов тяготеют к монотеизму, в центре которого стоит солярное божество. Хотя реинкарнация иногда играет свою роль, обычно она доступна лишь существам великой или богоподобной силы, тогда как верующим уготован вечный покой в «Светлых чертогах» Куту Ремзна, либо вечные скитания по [Concept('aeras','Аэрасу')|E] в проклятом, невидимом и бесплотном облике, известном как Нахаз. Эта религия почти не находит последователей за пределами своей культуры, а вера обычно передаётся от матери к сыну. При всём этом обращение чужаков технически не является невозможным."
