 cnevobarthane_desc:0 "Ярые монотеисты, Говорящие [Concept('cnevobarthane','кневобартхенства')|E] представляют собой исконную религиозную общину теугомбрийского народа — ведь хотя обращение чужаков теоретически возможно, исторически о подобном почти никто не слышал.\n\nГоворящие верят, что люди живут циклическими эпохами, в которых человеческие расы рождаются, процветают на протяжении многих долгих веков, а затем уходят навстречу неизведанной и, возможно, апокалиптической судьбе. Они почитают Кневобартхена, Первого человека Нынешнего Мира, который родился полностью сформированным из последнего уцелевшего камня последнего разрушенного дома исчезнувших людей Прежнего Мира. Затем он сотворил всё человечество, заселив своими потомками [Concept('aeras','Аэрас')|E]. Однако многие из его детей, уязвлённые и завистливые, отвернулись от Него. Лишь немногие избранные усмирили свою гордыню и с благодарностью к своему Отцу решили чтить его и его законы. Те, кто следует за ним, рассказывают о его [Concept('cenvobarthanes_cycle_of_rebirth','самопожертвовании')|E], которое позволило человечеству избежать участи прежнего мира."
