 cnevobarthane_religion_desc: "Исконные верования замкнутых теугомбрийских народов склоняются к монотеизму, где центральной фигурой выступает солнечное божество. Хотя реинкарнация иногда является фактором, обычно она ограничивается существами великой или богоподобной силы, тогда как верные обречены либо на вечный покой в «Светлых чертогах» Куту Ремзны, либо на вечные скитания по [Concept('aeras','Эрасу')|E] в проклятой невидимой эфирной форме, известной как Нахаз. Эти веры редко находят новообращённых за пределами своей культуры, и вера обычно передаётся от матери к сыну. Тем не менее, обращение извне технически не является невозможным."

