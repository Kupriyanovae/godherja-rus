 tulharsin_religion_desc: "Древняя система верований, эндемичная для гор Тарсанид, почитатели богов Тулхарсина выстояли на протяжении бесчисленных тысячелетий. Хотя и [Concept('wardenism','вардениты')|E], и [Concept('ritualism','ритуалисты')|E] пытались их подавить, негостеприимная природа горной родины религии укрывала и защищала её, удерживая армии и жрецов низменностей на расстоянии от священных горных вершин, где покоятся священные жилища богов Тулхарсина."

