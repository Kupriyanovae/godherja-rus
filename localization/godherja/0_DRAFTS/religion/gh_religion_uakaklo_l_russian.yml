 mitikaka: "Митикака-токоллатитцанск"
 mitikaka_adj: "Митикака Токоллатитца"
 mitikaka_adherent: "Митикака-токоллатитцанец"
 mitikaka_adherent_plural: "Митикака-токоллатитцанцы"
 mitikaka_desc: "Хотя практика жертвоприношений всегда была способом обеспечить, чтобы Тенсесе никогда не оставался один, несмотря на уход его детей, и уакаклоханцы верили, что жертвы добровольцев и подготовленных позволят их душам присоединиться к их богу на небесах, чтобы составить ему компанию в его одиноком бдении, [Concept('frodbrokna','Фродброкна')|E] и великий ущерб, нанесённый [Concept('aervalr','Эрвалу')|E], были восприняты митикака-токоллатитцанцами как апокалипсис. Смерть большинства [Concept('magi','магов')|E]-Царей уакаклоханцев и их народов ещё больше укрепила это, и митикака-токоллатитцанцы начали принимать неизбежность окончательной гибели своего народа, теперь, когда даже их главный бог был отнят у них."
