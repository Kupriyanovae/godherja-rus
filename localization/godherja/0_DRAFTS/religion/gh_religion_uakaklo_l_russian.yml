 uakaklo_religion_desc: "Вера уакаклоханцев представляет собой сложную систему из тридцати богов и тридцати одного демона (Текотлакецуэтспаллок — относительно недавнее дополнение), что сильно запутывается из-за веры в то, что боги могут иметь общие имена, обладать множеством форм в виде разных полов или видов и могут регулярно сливаться или разделяться. Однако более всего они поклоняются [Concept('aervalr','Эрвалу')|E], который, как они утверждают, является оком бога-творца Тенсесе («Первого»), который породил всех остальных и отправил их на [Concept('aeras','Эрас')|E], в то время как его единственный око наблюдало за человечеством."

