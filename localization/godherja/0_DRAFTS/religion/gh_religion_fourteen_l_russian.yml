 fourteen_heavenly_methods_religion_desc: "Кайцзяо, или просто «почитание богов», — это термин, используемый для описания вер, происходящих от исконной народной религии Катун-Кая. Эти веры сосредоточены на поклонении пантеону богов во главе с Шэньваном, Великим Царём Небес. Добродетельные души верят, что служат богам в божественном царстве Гуоди, в то время как нечестивые вечно страдают в Гуюй."

