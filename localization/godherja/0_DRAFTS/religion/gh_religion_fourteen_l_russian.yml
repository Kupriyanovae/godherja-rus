 fourteen_heavenly_methods_adherent:0 "Хранитель Методов"

 fourteen_heavenly_methods_adherent_plural:0 "Хранители Методов"

 fourteen_heavenly_methods_desc:0 "Четырнадцать Небесных Методов — это название философских трактатов, приписываемых легендарной Императрице Яо Жэнь Цай, известной также как Божественная Императрица или Императрица-Дракон. Она была могущественным магом, объединившим города Катун-Кай и подчинившим монастыри мяоси государству. Во время своего двухвекового правления она написала эссе о том, как представители четырнадцати профессий и образов жизни в Катун-Кай могут жить добродетельно и достичь Небес.\n\nПосле её смерти говорили, что душа Яо Жэнь Цай слилась с семенем Шэнвана, чтобы создать первого дракона; другие утверждали, что её душа соединилась с землёй и небом, чтобы наблюдать за своим народом после смерти.\n\nНачиная с её сына Яо Линсюя, претенденты на трон Катун-Кай утверждали, что они одержимы духом первого дракона, чтобы укрепить свою легитимность. Многие из этих одержимых императоров почитаются наряду с Яо Жэнь Цай, а её Небесные Методы строго соблюдаются."

 xin_xue:0 "Xin Xue"

 xin_xue_adj:0 "Xin Xue"

 xin_xue_adherent:0 "Zhuzi"

 xin_xue_adherent_plural:0 "Zhuzi"

 xin_xue_desc:0 "Xin Xue emerged amidst the intellectual disputes that marked the closing years of the [hanwei_movement|E]. The increasingly anachronistic nature of the Fourteen Heavenly Methods prompted a number of scholars to re-examine their meaning and refine their interpretation. In doing so, they discovered with astonishment that many of the teachings attributed to the "First of the Dragon" had in fact been fabricated, giving rise to widespread skepticism toward the scriptures. At this stage, however, the movement remained concerned primarily with textual criticism and scholarly inquiry, lacking any unified philosophical foundation.\n\nWhat transformed Xin Xue into a mature philosophical system was the publication of Divine Artisanology in 1057 IS. The work systematically expounded the central principle of "applying knowledge to practical governance and innovating through change," thereby establishing the theoretical foundation upon which the movement would develop. Thereafter, treatises on Xin Xue proliferated, each expanding upon its doctrines from different perspectives, until the school evolved into the comprehensive and diverse intellectual tradition recognized today."

 lanonan_bynjar_institute:0 "Bynjar Institute"

 lanonan_bynjar_institute_adj:0 "Bynjar Institute"

 lanonan_bynjar_institute_adherent:0 "Bynjar Disciples"

 lanonan_bynjar_institute_adherent_plural:0 "Bynjar Disciples"

 lanonan_bynjar_institute_desc:0 "T'ai-wu's [GetFaithDoctrine('tenet_thirteen_precepts').GetBaseName] gave rise to the ideological tradition known as Bynjar. Its followers are expected to master the arts of war, for martial excellence is regarded as both a spiritual duty and the truest measure of virtue. To die in battle is considered the highest honor, and the expansion of one's ruler's dominion is viewed as the faithful fulfillment of T'ai-wu's teachings.\n\nLacking any centralized religious authority, Bynjar developed through a multitude of loosely organized regional associations. Over time, this gave rise to numerous schools whose doctrines often diverged considerably in both practice and interpretation. Despite these differences, all Bynjar traditions accord an exceptionally exalted place to the entity known as [chiang_hsiang_shou|E], whose significance remains one of the few constants shared throughout the faith."

 muzacuh:0 "Muzacuh"

 muzacuh_adj:0 "Muzacuh"

 muzacuh_adherent:0 "Haimin"

 muzacuh_adherent_plural:0 "Haimin"

 muzacuh_desc:0 "The Muzacuh faith originated in the coastal regions of eastern Kathun-Kai as an offshoot of an ancient tradition of ocean worship. At its center stands a female deity embodying the sea itself, whom devotees simply call [Glossary( 'Muza', 'MUZA_GLOSS' )].\n\nBefore every voyage, priests of Muza perform rites of divination and present offerings, praying for calm waters and abundant catches. Followers seldom dare to lie in her presence, and when disputes arise, her statue is brought forth to serve as arbiter. They believe that, as the embodiment of the sea, Muza peers into the hearts of mortals, claiming the dishonest with storms while rewarding honest navigators with safe passage and bountiful voyages."

