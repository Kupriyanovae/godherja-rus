 kathunirossi_iyrossi_desc:0 "When the [Glossary('Ceov Báise','GH_CEOVBAISE_GLOSS')] cut off communication with Kathun Kai and Malcois fell into anarchy, House Yaon was left to carry out the sacred orders of the emperor.  The emperor entrusted House Yaon with a series of sacred commands to ensure the survival of embassy if contact with the empire was lost. 1270 IS marks 70 years from the last communication allowing House Yaon to share the sacred fourteen heavenly methods with the unenlightened, to create a sacred population to support and defend the emperor's voice in these primitive lands. House Yaon now serves as the great interpreter of these holy commands and works to help us better understand how we better can serve and worship the emperor."