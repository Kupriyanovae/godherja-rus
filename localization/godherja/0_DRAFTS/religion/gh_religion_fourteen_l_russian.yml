 fourteen_heavenly_methods: "Четырнадцатинебеснометодн"
 fourteen_heavenly_methods_adj: "Четырнадцать небесных методов"
 fourteen_heavenly_methods_adherent: "Хранитель методов"
 fourteen_heavenly_methods_adherent_plural: "Хранители методов"
 fourteen_heavenly_methods_desc: "Четырнадцать небесных методов — это название одноимённых философских трактатов, приписываемых легендарной императрице Яо Жэнь Цай, также известной как Богиня-императрица или Драконья императрица. Она была могущественным [Concept('magi','магом')|E] и ей приписывают как объединение городов Катун-Кая, так и полное подчинение монастырей мяоси государству. За своё двухвековое правление она написала эссе о том, как люди четырнадцати профессий и укладов жизни в Катун-Кае могут жить добродетельно и достичь пути на Небеса.\n\nПосле её смерти, как говорят, душа Яо Жэнь Цай слилась с семенем Шэньвана, создав первого дракона; другие утверждения гласят, что её душа вселилась в саму землю и небо, чтобы наблюдать за своим народом после смерти.\n\nНачиная с её сына Яо Линсюя, претенденты на трон Катун-Кая утверждали, что в них вселился дух первого дракона, чтобы укрепить свою легитимность. Многие из этих одержимых императоров почитаются наряду с Яо Жэнь Цай, а её Небесные методы строго соблюдаются."

 xin_xue: "Синь-сюэск"
 xin_xue_adj: "Синь Сюэ"
 xin_xue_adherent: "Чжуцзы"
 xin_xue_adherent_plural: "Чжуцзы"
 xin_xue_desc: "Синь Сюэ возникла среди интеллектуальных споров, ознаменовавших заключительные годы [Concept('hanwei_movement','движения Ханьвэй')|E]. Всё более анахроничный характер Четырнадцати небесных методов побудил ряд учёных переосмыслить их значение и уточнить их толкование. Делая это, они с изумлением обнаружили, что многие учения, приписываемые «Первому из Драконов», были на самом деле сфабрикованы, что породило широкий скептицизм по отношению к писаниям. Однако на этом этапе движение оставалось озабоченным в основном текстологической критикой и научными изысканиями, не имея единой философской основы.\n\nТо, что превратило Синь Сюэ в зрелую философскую систему, была публикация «Божественного искусствознания» в 1057 году от И.С. Эта работа систематически излагала центральный принцип «применения знаний к практическому управлению и инноваций через изменения», тем самым закладывая теоретический фундамент, на котором движение будет развиваться. После этого трактаты по Синь Сюэ множились, каждый расширял её доктрины с разных точек зрения, пока школа не превратилась в ту всеобъемлющую и разнообразную интеллектуальную традицию, которую признают сегодня."

 lanonan_bynjar_institute: "Институт-биньярск"
 lanonan_bynjar_institute_adj: "Институт Биньяр"
 lanonan_bynjar_institute_adherent: "ученики Биньяра"
 lanonan_bynjar_institute_adherent_plural: "ученики Биньяра"
 lanonan_bynjar_institute_desc: "[GetFaithDoctrine('tenet_thirteen_precepts').GetBaseName] Тай-ву породил идеологическую традицию, известную как Биньяр. Ожидается, что её последователи овладеют воинскими искусствами, ибо воинское совершенство считается как духовным долгом, так и истиннейшей мерой добродетели. Умереть в бою считается высшей честью, а расширение владений своего правителя рассматривается как верное исполнение учений Тай-ву.\n\nНе имея централизованной религиозной власти, Биньяр развивался через множество слабо организованных региональных ассоциаций. Со временем это привело к возникновению многочисленных школ, чьи доктрины часто значительно расходились как в практике, так и в толковании. Несмотря на эти различия, все традиции Биньяра отводят исключительно возвышенное место сущности, известной как [chiang_hsiang_shou|E], чьё значение остаётся одной из немногих констант, разделяемых всей верой."

 muzacuh: "Музакск"
 muzacuh_adj: "Музаку"
 muzacuh_adherent: "Хайминь"
 muzacuh_adherent_plural: "Хайминь"
 muzacuh_desc: "Вера Музаку возникла в прибрежных регионах восточного Катун-Кая как ответвление древней традиции почитания океана. В её центре стоит женское божество, олицетворяющее само море, которого верующие называют просто [Glossary('Муза','MUZA_GLOSS')].\n\nПеред каждым плаванием жрецы Музы совершают обряды гадания и приносят дары, молясь о спокойных водах и обильных уловах. Последователи редко осмеливаются лгать в её присутствии, а когда возникают споры, её статую выносят, чтобы она выступила в роли арбитра. Они верят, что, как воплощение моря, Муза заглядывает в сердца смертных, забирая нечестных бурями и вознаграждая честных мореплавателей безопасным проходом и обильными путешествиями."

 kathunirossi_iyrossi: "Цялоэнск"
 kathunirossi_iyrossi_adj: "Цялоэна"
 kathunirossi_iyrossi_adherent: "Цялоэнанец"
 kathunirossi_iyrossi_adherent_plural: "Цялоэнанцы"
 kathunirossi_iyrossi_desc: "Когда [Glossary('Цэов Баисэ','GH_CEOVBAISE_GLOSS')] прервал связь с Катун-Каем и Малькоя погрузилась в анархию, Дом Яон остался, чтобы выполнять священные приказы императора. Император поручил Дому Яон серию священных повелений, чтобы обеспечить выживание посольства в случае потери связи с империей. 1270 год от И.С. ознаменовывает 70 лет с момента последней связи, позволяя Дому Яон разделить священные Четырнадцать небесных методов с непросвещёнными, чтобы создать священное население для поддержки и защиты голоса императора в этих примитивных землях. Дом Яон теперь служит великим толкователем этих святых повелений и работает, чтобы помочь нам лучше понять, как мы можем служить и поклоняться императору."