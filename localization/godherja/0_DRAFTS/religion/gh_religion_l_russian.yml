 special_doctrine_imperrech_common_goal_name: "Единство Импереха"
 special_doctrine_imperrech_common_goal_desc: "Несмотря на наши контрастирующие пути, народы [Concept('sjalvolki_migration','миграций сьяволки')|E] объединились ради общего дела."

 # Special Doctrines: Test of Aruvas
 doctrine_test_of_aruvas_name: "Испытание Аруваса"
 test_of_aruvas_os_kinjer_doctrine_name: "Ос Кинджер"
 test_of_aruvas_os_kinjer_doctrine_desc: "Пережить [Glossary('Ос Кинджер','GH_OS_KINJER_GLOSS')] — значит умереть и в смерти быть судимым душой [Concept('aspects_of_aruvas','Арувы')|E], чтобы определить, будет ли она предана холодному покою [Glossary('Арува Нилуд','GH_ARUVA_NILUD_GLOSS')] или вознесена к ослепительной славе [Glossary('Арува Цере','GH_ARUVA_TSERE_GLOSS')]. Как таковое, долг духовенства — совершать надлежащие погребальные обряды, чтобы направить душу усопшего к загробной жизни, к которой она стремится."
 test_of_aruvas_os_tandrakh_doctrine_name: "Ос Тандрах"
 test_of_aruvas_os_tandrakh_doctrine_desc: "[Glossary('Ос Тандрах','GH_OS_TANDRAKH_GLOSS')] — это духовное путешествие, длящееся всю жизнь, накопление всех выборов и переживаний, формирующих божественную искру [Glossary('Арува Агат','GH_ARUVA_AGAT_GLOSS')] внутри души. Его практикующие верят, что человеческие жизни принадлежат им самим, и не [Concept('aspects_of_aruvas','Арувы')|E] судят их в загробной жизни; скорее они должны вынести суд самим себе."
 test_of_aruvas_armut_yan_doctrine_name: "Армут Ян"
 test_of_aruvas_armut_yan_doctrine_desc: "[Glossary('Армут Ян','GH_ARMUT_YAN_GLOSS')] — это прославление одноимённой Матери-Меча, Королевы Героев и Хранительницы [aervalr|E]. Те, кто поклоняется ей, верят, что божественная искра [Glossary('Арува Агат','GH_ARUVA_AGAT_GLOSS')] зарабатывается, а не даруется, и только самые достойные души удостаиваются чести присоединиться к воинству Матери-Меча в загробной жизни." 
 doctrine_parameter_hostility_override_test_of_aruvas_os_kinjer_doctrine: "Считает [Concept('faiths','конфессии')|E], исповедующие [GetFaithDoctrine('test_of_aruvas_os_kinjer_doctrine').GetBaseName], [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_test_of_aruvas_os_tandrakh_doctrine: "Считает [Concept('faiths','конфессии')|E], исповедующие [GetFaithDoctrine('test_of_aruvas_os_tandrakh_doctrine').GetBaseName], [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_test_of_aruvas_armut_yan_doctrine: "Считает [Concept('faiths','конфессии')|E], исповедующие [GetFaithDoctrine('test_of_aruvas_armut_yan_doctrine').GetBaseName], [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 # Special Doctrines: Xin Xue
 the_century_of_xin_xue_revolution_name: "Xin Xue Program"
 the_century_of_xin_xue_revolution_doctrine_name: "The Century of Revolution"
 the_century_of_xin_xue_revolution_doctrine_desc: "We once believed that [Concept('kathuni_dragon_mythology','Dragon Emperor')|E] was the only hope for Kathun-Kai, but the occurrence of [Concept('frodbrokna','Tianqing')|E] has revealed the true nature of the old order. Those outdated and fetid traditions are nothing but heavy chains binding Kathun-Kai. It is time to rid the world of this oppression! We shall establish a nation of equality, belonging not to one but to all, and with the flames of the Xin Xue revolution, burn the old world to ashes!"

 tongkang_republic_theory_doctrine_name: "Tongkang Republic Theory"
 tongkang_republic_theory_doctrine_desc: "Xin Xue's triumph at [Concept('bureau_bronzeport','Bronzeport')|E] is a truly celebratory occasion for Zhuzi everywhere. Our great ideal has flourished and blossomed in the borderlands beyond the reach of [Concept('kathuni_dragon_mythology','Dragon Emperor')|E], proving that under Xin Xue's leadership, the establishment of a state belonging to all people is not merely a fantasy spoken of by some, but a tangible reality."

