 #Особые доктрины: Вахараи
 waharai_hostility_name: "Вахараи"
 special_doctrine_waharai_hostility_desc: "Другие — глупцы, ибо бог не может по-настоящему умереть. Тот, Кто Был Всевышним, ждёт нас, истинно верных, на небесах, а все остальные — лишь еретики. Отвергнуть Его вознесение — значит отвергнуть Его, и мы не обязаны принимать тех, кто не выдерживает этого базового испытания веры."
