 aversarian_hostility_doctrine_name: "Аверсарианская"
 aversarian_hostility_doctrine_desc: "Несмотря на наши различия, наша вера принадлежит к [Concept('aversaria','аверсарианской')|E] семье, и они — наши родичи."
