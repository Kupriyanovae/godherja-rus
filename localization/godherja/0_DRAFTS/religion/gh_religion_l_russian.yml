 # Special Doctrines: Test of Aruvas
 doctrine_test_of_aruvas_name: "Испытание Аруваса"
 test_of_aruvas_os_kinjer_doctrine_name: "Ос Киньер"
 test_of_aruvas_os_kinjer_doctrine_desc: "Испытать [Glossary('Ос Киньер','GH_OS_KINJER_GLOSS')] — значит умереть — и, умерев, предстать перед судом [aspects_of_aruvas|E], дабы решить, будет ли душа упокоена в холодном покое [Glossary('Арува Нилуд','GH_ARUVA_NILUD_GLOSS')] или вознесена в пламенную славу [Glossary('Арува Цере','GH_ARUVA_TSERE_GLOSS')]. Посему долг духовенства — соблюдать надлежащие погребальные обряды, дабы направлять душу усопшего к желанной загробной жизни."
 test_of_aruvas_os_tandrakh_doctrine_name: "Ос Тандрах"
 test_of_aruvas_os_tandrakh_doctrine_desc: "[Glossary('Ос Тандрах','GH_OS_TANDRAKH_GLOSS')] — это духовное странствие, длящееся всю жизнь, накопление всех выборов и опыта, формирующих божественную искру [Glossary('Арува Агат','GH_ARUVA_AGAT_GLOSS')] в душе. Его последователи верят, что человеческие жизни принадлежат им самим, и не [aspects_of_aruvas|E] судят их в загробной жизни; напротив, они должны вынести суд над собой."
 test_of_aruvas_armut_yan_doctrine_name: "Армут Ян"
 test_of_aruvas_armut_yan_doctrine_desc: "[Glossary('Армут Ян','GH_ARMUT_YAN_GLOSS')] — это возвеличение одноимённой Матери-Меча, Королевы Героев и Хранительницы [aervalr|E]. Те, кто поклоняется ей, верят, что божественная искра [Glossary('Арува Агат','GH_ARUVA_AGAT_GLOSS')] заслуживается, а не даруется, и лишь самые достойные души удостаиваются чести присоединиться к воинству Матери-Меча в загробной жизни."
 doctrine_parameter_hostility_override_test_of_aruvas_os_kinjer_doctrine: "[faiths|El] с доктриной «[GetFaithDoctrine('test_of_aruvas_os_kinjer_doctrine').GetBaseName]» воспринимаются как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_test_of_aruvas_os_tandrakh_doctrine: "[faiths|El] с доктриной «[GetFaithDoctrine('test_of_aruvas_os_tandrakh_doctrine').GetBaseName]» воспринимаются как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_test_of_aruvas_armut_yan_doctrine: "[faiths|El] с доктриной «[GetFaithDoctrine('test_of_aruvas_armut_yan_doctrine').GetBaseName]» воспринимаются как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

