 #Особые доктрины: Марефаи
 marefai_hostility_name: "Марефаи"
 special_doctrine_marefai_hostility_desc: "Небесные гимны, древние песни, поющиеся с начала времён, местами туманны. И пока другие могут цепляться за свою версию истории, мы позволяем каждому выбирать. Всевышний дал нам способность толковать Его священные указы, и не в компетенции смертных говорить другому, что его толкование ложно."
 special_doctrine_marefai_hostility_name: "Певцы Его древних гимнов"

 #Особые доктрины: Марочникская
 special_doctrine_is_marcher_faith_desc: "Несмотря на наши различия, наша вера принадлежит к семье марочников, и они — наши родичи."
 special_doctrine_is_marcher_faith_name: "В марочникской вере"
 is_marcher_faith_name: "$special_doctrine_is_marcher_faith_name$"
 marcher_faith_name: "Имеет веру Жизненного пути"
 marcher_faith_doctrine_name: "Доктрина марочникской веры"
 marcher_faith_doctrine_desc: "Исповедует марочникскую веру"

 #Особые доктрины: Моговай
 mogowai_hostility_name: "Моговай"
 special_doctrine_mogowai_hostility_desc: "Нам поручена великая миссия от божества — найти Его тело, чтобы Он мог воскреснуть. Все другие веры, что бы они ни проповедовали, являются лишь препятствиями, отвратившими своих последователей от Великого поиска в погоне за своими мелкими целями."
 special_doctrine_mogowai_hostility_name: "Единственные истинные искатели"

 #Особые доктрины: Мокманур
 mokmanur_hostility_name: "Мокманур"
 special_doctrine_mokmanur_hostility_desc: "Не Плеймао желает нашего возвращения, а Холодный Отец Хел Тви. Мы должны распространять истину этого откровения, спасая наш народ от его собственной ереси и уничтожая всех язычников."
 special_doctrine_mokmanur_hostility_name: "Друзья Холода"

 #Особые доктрины: Ницафаи
 nitsafai_hostility_name: "Ницафаи"
 special_doctrine_nitsafai_hostility_desc: "Мнимые последователи Того, Кто Был Всевышним, являются оскорблением всему, чего Он хотел. Они наслаждаются чревоугоднической коррупцией — от низшего Сиирета до высшего Аминета. Все, кроме нас. Пока другие насмехаются над Его добродетелями, мы остаёмся верны им. Ибо хотя Он мёртв, Его дух всё ещё с нами, и мы всегда будем ступать под Его светом."
 special_doctrine_nitsafai_hostility_name: "Оплот благочестия"

 #Особые доктрины: Ольтенская
 special_doctrine_is_oltenic_faith_desc: "Несмотря на наши различия, наша вера принадлежит к семье ольтенов, и они — наши родичи."
