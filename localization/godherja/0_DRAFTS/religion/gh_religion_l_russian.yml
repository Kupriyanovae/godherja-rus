 #Special Doctrines: Arnazni
 arnazni_hostility_name: "Арназни"
 special_doctrine_arnazni_hostility_desc: "Мы все братья под Арназом и Парназом, детьми Амагеи. У всех нас есть свои способы поклонения богам, и все они законны."
