 the_century_of_xin_xue_revolution_doctrine_desc: "Некогда мы верили, что [Concept('kathuni_dragon_mythology','Драконий император')|E] — единственная надежда Катун-Кая, но [Concept('frodbrokna','Тяньцин')|E] открыла истинную природу старого порядка. Эти устаревшие и гнилые традиции — лишь тяжёлые цепи, сковывающие Катун-Кай. Настало время избавить мир от этого гнёта! Мы установим государство равенства, принадлежащее не одному, а всем, и пламенем революции Синь Сюэ сожжём старый мир дотла!"

 tongkang_republic_theory_doctrine_name: "Теория Тунканской республики"
 tongkang_republic_theory_doctrine_desc: "Триумф Синь Сюэ в [Concept('bureau_bronzeport','Бронзовой гавани')|E] — поистине праздничное событие для всех Чжуцзы. Наш великий идеал расцвёл и распустился в пограничных землях, вне досягаемости [Concept('kathuni_dragon_mythology','Драконьего императора')|E], доказывая, что под руководством Синь Сюэ создание государства, принадлежащего всем людям, — не просто фантазия, а реальность."

 # Прочие доктрины враждебности
 sarradonian_hostility_doctrine_name: "Саррадонская"
 sarradonian_hostility_doctrine_desc: "Несмотря на наши различия, наша вера принадлежит к семье саррадонцев, и они — наши родичи."
 continental_hostility_doctrine_name: "Континентальная"
 continental_hostility_doctrine_desc: "Несмотря на наши различия, наша вера принадлежит к семье континентальных вер, и они — наши родичи."
 adabyssian_hostility_doctrine_name: "Адабисская"
 adabyssian_hostility_doctrine_desc: "Несмотря на наши различия, наша вера принадлежит к семье адабисцев, и они — наши родичи."
 aironoian_hostility_doctrine_name: "Айронойская"
 aironoian_hostility_doctrine_desc: "Несмотря на наши различия, наша вера принадлежит к семье айронойцев, и они — наши родичи."
 religious_isolate_hostility_doctrine_name: "Изолированная религия"
 religious_isolate_hostility_doctrine_desc: "Несмотря на наши различия, наша вера не принадлежит ни к какой семье, и другие одиночки — наши родичи."
 proto_aversarian_hostility_doctrine_name: "Прото-аверсарианская"
 proto_aversarian_hostility_doctrine_desc: "Несмотря на наши различия, наша вера принадлежит к широкому спектру [Concept('aversaria','аверсарианских')|E] культур, и они — наши родичи."
