 seven_faith_doctrine_desc: "Исповедует септарианский агионизм"
 special_doctrine_is_agionism_faith_desc: "Несмотря на наши различия, наша вера принадлежит к семье агионистов, и они — наши родичи."
 special_doctrine_is_agionism_faith_name: "Последователи Святых"
 is_agionism_faith_name: "Имеет агионистскую веру"

 #Special Doctrines: Alau Koev
 alau_koev_hostility_name: "Алау Коев"
 special_doctrine_alau_koev_hostility_desc: "Мы все были приведены к [Concept('fire_gate','Огненным вратам')|E] вместе, независимо от того, во что мы теперь верим. Мы должны объединиться против тех, кто отрицает наше священное пламя, а не препираться, пока холод охватывает мир."
 special_doctrine_alau_koev_hostility_name: "Связанные пламенем"
 special_doctrine_is_alau_koev_faith_desc: "Несмотря на наши различия, наша вера принадлежит к семье алаукоевцев, и они — наши родичи."
 special_doctrine_is_alau_koev_faith_name: "Хранители Огненных врат"
 is_alau_koev_faith_name: "$special_doctrine_is_alau_koev_faith_name$"

 #Special Doctrines: Amsari
 special_doctrine_is_amsari_faith_desc: "Несмотря на наши различия, наша вера принадлежит к семье амсарцев, и они — наши родичи."
