 #Special Doctrines: Ritualist
 special_doctrine_is_ritualist_faith_desc: "Каковы бы ни были наши различия, наша вера — всего лишь одна из головокружительного множества ритуалистских сект, и они нам родственники... чего бы это ни стоило."
 special_doctrine_is_ritualist_faith_name: "Идущие 1001 шагов"
