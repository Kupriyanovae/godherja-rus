 seven_faith_doctrine_desc: "Исповедует септарианский агионизм"
 special_doctrine_is_agionism_faith_desc: "Каковы бы ни были наши различия, наша вера принадлежит к семье агионистов, и они нам родственники."
 special_doctrine_is_agionism_faith_name: "Последователи святых"
 is_agionism_faith_name: "Имеет агионистскую веру"

 #Special Doctrines: Alau Koev
 alau_koev_hostility_name: "Алау Коев"
 special_doctrine_alau_koev_hostility_desc: "Все мы были приведены к [Concept('fire_gate','Огненных Врат')|E] вместе, независимо от того, во что мы теперь верим. Мы должны объединиться против тех, кто отрицает наше священное пламя, а не препираться, пока холод овладевает миром."
 special_doctrine_alau_koev_hostility_name: "Связанные пламенем"
 special_doctrine_is_alau_koev_faith_desc: "Каковы бы ни были наши различия, наша вера принадлежит к семье алау коеваков, и они нам родственники."
 special_doctrine_is_alau_koev_faith_name: "Хранители огненных врат"
 is_alau_koev_faith_name: "Имеет веру Алау Коев"

