 #Doctrines: Slavery
 doctrine_slavery_name: "Рабство"
 doctrine_slavery_demanded_name: "Обязательно"
 doctrine_slavery_demanded_desc: "Рабство считается добродетелью согласно писаниям, а выступать против владения человеком — греховно."
 doctrine_slavery_encouraged_name: "Поощряется"
 doctrine_slavery_encouraged_desc: "Хотя это и не требуется в полной мере, благочестивым правителям рекомендуется владеть рабами."
 doctrine_slavery_neutral_name: "Нейтрально"
 doctrine_slavery_neutral_desc: "Вера не имеет какого-либо особого мнения относительно владения рабами."
 doctrine_slavery_discouraged_name: "Не поощряется"
 doctrine_slavery_discouraged_desc: "Хотя рабство и не запрещено, оно считается греховным."
 doctrine_slavery_banned_name: "Без рабства"
 doctrine_slavery_banned_desc: "Владеть другим человеком — поистине зло, и это строго запрещено верными."

 #Doctrines: Magic
 doctrine_magic_name: "Магия"
 doctrine_magic_crime_name: "Магия криминализирована"
 doctrine_magic_crime_desc: "Те, кто обладает '[Concept('magic','Даром')|E]', слишком опасны, чтобы им позволили жить."
 doctrine_magic_shunned_name: "Магия отвергается"
 doctrine_magic_shunned_desc: "Те, кто обладает [Concept('magic','Даром')|E], полезны, но их следует держать на расстоянии."
 doctrine_magic_accepted_name: "Магия принята"
 doctrine_magic_accepted_desc: "[Concept('magic','Дар')|E], как говорится, не является чем-то постыдным."
 doctrine_magic_honored_name: "Магия почитается"
 doctrine_magic_honored_desc: "[Concept('magic','Дар')|E] и его обладатели должны почитаться в нашем обществе."
 doctrine_magic_supremacy_name: "Верховенство магии"
 doctrine_magic_supremacy_desc: "Те, кто обладает [Concept('magic','Даром')|E], по своей природе превосходят тех, кто его лишён."
 
 #Doctrines: Lifepath picking
 doctrine_lifepath_numbers_name: "Ориентация Жизненного пути"
 doctrine_lifepaths_standard_name: "Традиционный Восьмипуть"
 doctrine_lifepaths_standard_desc: "Традиционные 8 путей, которых придерживается большинство ортодоксальных последователей Жизненного пути"
 doctrine_lifepaths_sjalvolki_name: "Опахасийский Четырёхпуть"
 doctrine_lifepaths_sjalvolki_desc: "Четыре пути, которых придерживается Опахасийский Конклав: Пастырь, Звёзды, Меч и Охота."
 doctrine_lifepaths_evil_name: "Четыре пути к погибели"
 doctrine_lifepaths_evil_desc: "Четыре пути, возвещённые проклятым и ненавистным еретиком Тискулем ден ва Вескотом: Ужас, Страх, Кровь и Боль"
 doctrine_lifepaths_tripath_name: "Трёхпутье"
 doctrine_lifepaths_tripath_desc: "Три пути, изложенные Катрин ден ва Дарралл: Война, Мир и Смерть."
 doctrine_parameter_standard_lifepaths: "Имеет традиционные 8 Жизненных путей."
 doctrine_parameter_sjalvolki_lifepaths: "Имеет четыре сьялвольских пути."
 doctrine_parameter_evil_lifepaths: "Имеет 4 тёмных пути."
 doctrine_parameter_tripath_lifepaths: "Имеет Трёхпутье."
 
 
