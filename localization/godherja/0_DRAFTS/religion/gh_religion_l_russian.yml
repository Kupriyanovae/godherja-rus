 #Special Doctrines: Azakna Jakuungi
 special_doctrine_is_azakna_jakuungi_faith_desc: "Каковы бы ни были наши различия, наша вера принадлежит к семье азакна джакуунги, и они нам родственники."
 special_doctrine_is_azakna_jakuungi_faith_name: "Кровные родичи"
