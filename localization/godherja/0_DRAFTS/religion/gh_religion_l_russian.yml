 ritualism_hostility_doctrine_desc: "Несмотря на наши различия, наша вера принадлежит к семье ритуалистов, и они — наши родичи."
 wardenism_hostility_doctrine_name: "Варденитская"
 wardenism_hostility_doctrine_desc: "Несмотря на наши различия, наша вера принадлежит к семье варденитов, и они — наши родичи."
 nattanan_hostility_doctrine_name: "Наттананская"
 nattanan_hostility_doctrine_desc: "Несмотря на наши различия, наша вера принадлежит к семье наттананов, и они — наши родичи."
 shadowy_cults_hostility_doctrine_name: "Бесчисленные культы"
 shadowy_cults_hostility_doctrine_desc: "Несмотря на наши сходства, наш культ остаётся единственной истинной верой, и никто другой не является нашим родичем!"

