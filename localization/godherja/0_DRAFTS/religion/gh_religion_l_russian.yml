 #Special Doctrines: Agionism
 special_doctrine_agionist_order_cooperation_corrupt_name: "Крестовый поход Святых"
 special_doctrine_agionist_order_cooperation_corrupt_desc: "Наша вера едины с нашими собратьями-агионистскими орденами, когда мы несём свет Святых саррадонским язычникам."
 agionist_order_cooperation_corrupt_name: "Крестовый поход Святых"
 agionist_faith_name: "Имеет агионистскую веру"
 forgotten_faith_doctrine_name: "Доктрина веры Забытого"
 forgotten_faith_doctrine_desc: "Исповедует веру Забытого"
 eight_faith_doctrine_name: "Доктрина октарианского агионизма"
 eight_faith_doctrine_desc: "Исповедует октарианский агионизм"
 saint_faith_doctrine_name: "Доктрина веры Святого"
 saint_faith_doctrine_desc: "Исповедует диксансинизм"
