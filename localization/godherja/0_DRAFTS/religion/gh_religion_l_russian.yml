 #Special Doctrines: Agionism
 special_doctrine_agionist_order_cooperation_corrupt_name: "Крестовый поступ святых"
 special_doctrine_agionist_order_cooperation_corrupt_desc: "Наша вера едина с нашими собратьями-агионистскими орденами, пока мы несём свет святых саррадонским язычникам."
