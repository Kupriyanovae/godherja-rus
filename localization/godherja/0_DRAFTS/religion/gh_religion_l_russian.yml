 #Special Doctrines: Bekashai
 bekashai_hostility_name: "Бекашай"
 special_doctrine_bekashai_hostility_desc: "Давным-давно чужеземцы разрушили наш рай, и Тот, Кто Был Всевышним, наш божественный защитник и покровитель, был убит. Наша миссия, наша цель, единая и первостепенная. Мы существуем, чтобы заставить храмосжигателей заплатить за их преступления, чтобы наконец свершить возмездие за древнюю трагедию."
 special_doctrine_bekashai_hostility_name: "Солдаты мёртвого бога"

 #Special Doctrines: Graveright
 special_doctrine_is_graveright_faith_desc: "Каковы бы ни были наши различия, наша вера принадлежит к семье мрогилпрано, и они нам родственники."
 special_doctrine_is_graveright_faith_name: "В лоне веры Мрогилпрано"
 graveright_faith_name: "В лоне веры Мрогилпрано"
 is_graveright_faith_name: "Имеет веру Мрогилпрано"

 #Special Doctrines: Kemsari
