 #Doctrines: Slavery
 doctrine_slavery_name: "Рабство"
 doctrine_slavery_demanded_name: "Обязательно"
 doctrine_slavery_demanded_desc: "Писание считает рабство добродетелью, а противодействие владению людьми — греховным."
 doctrine_slavery_encouraged_name: "Поощряется"
 doctrine_slavery_encouraged_desc: "Хотя и не является строго обязательным, благочестивым правителям рекомендуется владеть рабами."
 doctrine_slavery_neutral_name: "Нейтрально"
 doctrine_slavery_neutral_desc: "Вера не имеет определённого взгляда на владение рабами."
 doctrine_slavery_discouraged_name: "Не одобряется"
 doctrine_slavery_discouraged_desc: "Хотя и не запрещено, рабство считается греховным."
 doctrine_slavery_banned_name: "Без рабства"
 doctrine_slavery_banned_desc: "Владеть другим человеком — истинное зло, что строго запрещено для верующих."

 #Doctrines: Magic
 doctrine_magic_name: "Магия"
 doctrine_magic_crime_name: "Магия — преступление"
 doctrine_magic_crime_desc: "Те, кто обладает «[Concept('magic','Даром')|E]», слишком опасны, чтобы им было позволено жить."
 doctrine_magic_shunned_name: "Магия порицается"
 doctrine_magic_shunned_desc: "Те, кто обладает «[Concept('magic','Даром')|E]», полезны, но их следует держать на расстоянии."
 doctrine_magic_accepted_name: "Магия принимается"
 doctrine_magic_accepted_desc: "[Concept('magic','Дар')|E], как говорится, — это не то, чего стоит стыдиться."
 doctrine_magic_honored_name: "Магия почитается"
 doctrine_magic_honored_desc: "[Concept('magic','Дар')|E] и его носители почитаются в нашем обществе."
 doctrine_magic_supremacy_name: "Верховенство магии"
 doctrine_magic_supremacy_desc: "Те, кто обладает «[Concept('magic','Даром')|E]», по своей природе превосходят тех, у кого его нет."
 
 #Doctrines: Lifepath picking
 doctrine_lifepath_numbers_name: "Ориентация жизненного пути"
 doctrine_lifepaths_standard_name: "Традиционный восьмипуть"
 doctrine_lifepaths_standard_desc: "Традиционные 8 путей, которых придерживается большинство ортодоксальных последователей жизненного пути."
 doctrine_lifepaths_sjalvolki_name: "Сьяволкийский четырёхпуть"
 doctrine_lifepaths_sjalvolki_desc: "Четыре пути, которых придерживается Сьяволкийский конклав: Пастух, Звезды, Меч и Охота."
 doctrine_lifepaths_evil_name: "Четыре пути к погибели"
 doctrine_lifepaths_evil_desc: "Четыре пути, провозглашённые проклятым и ненавистным еретиком Тискулом вен да Вескот: Ужас, Страх, Кровь и Боль."
 doctrine_lifepaths_tripath_name: "Трипуть"
 doctrine_lifepaths_tripath_desc: "Три пути, изложенные Катрин ден ва Даррал: Война, Мир и Смерть."
 doctrine_parameter_standard_lifepaths: "Имеет традиционные 8 жизненных путей."
 doctrine_parameter_sjalvolki_lifepaths: "Имеет четыре сьяволкийских пути."
 doctrine_parameter_evil_lifepaths: "Имеет 4 тёмных пути."
 doctrine_parameter_tripath_lifepaths: "Имеет пути трипути."
 
 
