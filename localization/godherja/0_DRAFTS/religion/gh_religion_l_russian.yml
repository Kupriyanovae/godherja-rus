 agionist_faith_name: "Имеет агионистскую веру"
 forgotten_faith_doctrine_name: "Доктрина забытой веры"
 forgotten_faith_doctrine_desc: "Исповедует забытую веру"
 eight_faith_doctrine_name: "Доктрина октарианского агионизма"
