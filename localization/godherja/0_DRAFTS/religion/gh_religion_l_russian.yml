 #Special Doctrines: Marefai
 marefai_hostility_name: "Марефаи"
 special_doctrine_marefai_hostility_desc: "Гимны Небес, древние песни, которые пелись с начала времён, в некоторых местах туманны. И пока другие могут цепляться за свою версию истории, мы позволяем выбирать всем. Всевышний дал нам способность толковать Его священные указы, и это вне пределов полномочий любого смертного — говорить другому, что его толкование ложно."
 special_doctrine_marefai_hostility_name: "Певцы Его древних гимнов"

 #Special Doctrines: Marcher
 special_doctrine_is_marcher_faith_desc: "Каковы бы ни были наши различия, наша вера принадлежит к семье марчеров, и они нам родственники."
 special_doctrine_is_marcher_faith_name: "В лоне веры марчеров"
 is_marcher_faith_name: "Имеет веру жизненного пути"
 marcher_faith_name: "Имеет веру жизненного пути"
 marcher_faith_doctrine_name: "Доктрина веры марчеров"
 marcher_faith_doctrine_desc: "Исповедует веру марчеров"

 #Special Doctrines: Mogowai
 mogowai_hostility_name: "Моговаи"
 special_doctrine_mogowai_hostility_desc: "На нас возложена великая божественная миссия — найти Его тело, чтобы Он мог восстать. Все прочие веры, что бы они ни проповедовали, — лишь препятствия, отвратившие своих последователей от Великого Поиска в погоне за собственными мелкими целями."
 special_doctrine_mogowai_hostility_name: "Единственные истинные искатели"

 #Special Doctrines: Mokmanur
 mokmanur_hostility_name: "Мокманур"
 special_doctrine_mokmanur_hostility_desc: "Это не Племао желает нашего возвращения, а Холодный Отец Хел Тви. Мы должны распространить истину этого откровения, спасая наш народ от их собственной ереси и уничтожая всех язычников."
 special_doctrine_mokmanur_hostility_name: "Друзья холода"

 #Special Doctrines: Nitsafai
 nitsafai_hostility_name: "Ницафаи"
 special_doctrine_nitsafai_hostility_desc: "Мнимые последователи Того, Кто Был Всевышним, являются оскорблением всего, чего Он хотел. Они предаются обжорской порче, от низшего сиирета до высшего аминета. Все, кроме нас. Пока другие насмехаются над Его добродетелями, мы остаёмся верны им. Ибо хотя Он и мёртв, Его дух всё ещё с нами, и мы будем вечно ступать под Его светом."
 special_doctrine_nitsafai_hostility_name: "Опора благочестия"

 #Special Doctrines: Öltenic
 special_doctrine_is_oltenic_faith_desc: "Каковы бы ни были наши различия, наша вера принадлежит к семье ольтенов, и они нам родственники."
