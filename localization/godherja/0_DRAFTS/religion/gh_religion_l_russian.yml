 #Special Doctrines: Waharai
 waharai_hostility_name: "Вахараи"
 special_doctrine_waharai_hostility_desc: "Остальные — глупцы, ибо бог никогда не может по-настоящему умереть. Тот, Кто Был Всевышним, ждёт нас, истинно верных, на небесах, а все остальные — лишь еретики. Отвергать Его вознесение — значит отвергать Его, и у нас нет обязательств принимать тех, кто не проходит этот базовый тест веры."
 special_doctrine_waharai_hostility_name: "Верующие в Его вознесение"
 
