 #Особые доктрины: Бекашай
 bekashai_hostility_name: "Бекашай"
 special_doctrine_bekashai_hostility_desc: "Давным-давно чужеземцы разрушили наши небеса, и Тот, Кто Был Всевышним, наш божественный хранитель и защитник, был убит. Наша миссия, наша цель — единственна и первостепенна. Мы существуем, чтобы заставить Сжигателей Храмов заплатить за их преступления, чтобы наконец отомстить за древнюю трагедию."
 special_doctrine_bekashai_hostility_name: "Воины Мёртвого Бога"

 #Особые доктрины: Право мертвых
 special_doctrine_is_graveright_faith_desc: "Несмотря на наши различия, наша вера принадлежит к семье мрогилпранцев, и они — наши родичи."
 special_doctrine_is_graveright_faith_name: "В вере Мрогилпрано"
 graveright_faith_name: "В вере Мрогилпрано"
 is_graveright_faith_name: "$special_doctrine_is_graveright_faith_name$"

 #Особые доктрины: Кемсари
