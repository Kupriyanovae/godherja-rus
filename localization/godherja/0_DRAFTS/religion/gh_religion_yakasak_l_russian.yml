 yakasak: "Якасакск"
 yakasak_adj: "Якасак"
 yakasak_adherent: "Якасаканец"
 yakasak_adherent_plural: "Якасаканцы"
 yakasak_desc: "Южно-каширийская вера, возможно, столь же древняя, как и Дравадари, Якасак — это вера в бесконечный цикл «Гендерного Вознесения». Каждые сто лет якасаканцы верят, что величайший мужчина и величайшая женщина, заключённые в духовном загробном мире, возносятся до божественности, где узурпируют гендерно-разделённый пантеон, направляющий звёзды по небу и мир вокруг солнца, становясь единым высшим существом вместе со всеми, кто вёл их прежде.\n\nВера Якасак, возможно, наиболее известна своей крайней конкурентностью — каждый верующий технически имеет возможность стать тем, кто вознесётся, если сможет доказать, что превосходит своих сверстников. Для этого якасакские жрецы пытаются направлять последователей по путям внутреннего совершенства, часто становясь «танарадама» — что на южно-каширийском означает «запретный», — помогая своим собратьям, принимая неудачу в соревновании, чтобы их наставничество не было предвзятым.\n\nИз-за двойственной гендерной природы божественности якасакские правители правят наравне со своими супругами. Только мужчины могут править мужчинами, а женщины — женщинами, поэтому каждый берёт на себя бремя правления над гражданами своего пола."