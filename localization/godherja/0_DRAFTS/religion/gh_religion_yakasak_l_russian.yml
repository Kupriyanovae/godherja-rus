 viyagaric_religion_desc: "Виягарик — это обобщающий термин для многочисленных вер, культов и практик, распространённых по всей Роварске, более известной как Пиратское побережье. Хотя они чрезвычайно разнообразны, большинство вер, классифицируемых как виягарические, являются политеистическими и имеют циклическую космологию. Из-за хаотичного и сурового образа жизни обитателей Пиратского побережья многие виягарические веры, такие как Якасак, также восхваляют амбиции и индивидуализм своих последователей."
