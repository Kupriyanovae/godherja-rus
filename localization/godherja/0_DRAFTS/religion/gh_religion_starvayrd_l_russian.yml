 starvayrd_religion_desc: "Старвард основан на вере в то, что боги и духи взаимозаменяемы, и что первые боги были всего лишь духами угасших звёзд. Старвардцы верят, что можно увидеть свою судьбу, глядя на эти звёзды, и отслеживая знаки на небе при рождении ребёнка. Однако судьба будет утеряна, если не стремиться к ней, и достижение её — цель жизни каждого доброго старвардца."
