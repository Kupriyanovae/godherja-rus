 ancient_religion: "Древн"
 ancient_religion_adj: "Древняя религия"
 ancient_religion_desc: "Мир полон вер и религий, не всем из которых удалось сохранить последователей до наших дней. Некоторые породили преемников, включивших догматы их веры, но многим повезло меньше. Они живут лишь в томах библиотек, на росписях в разрушающихся храмах или в костях мёртвых."

 starvayrd: "Старвардск"
 starvayrd_adj: "Старвард"
 starvayrd_religion: "Старвардск"
 starvayrd_religion_adj: "Старвард"
 starvayrd_adherent: "Старвардец"
 starvayrd_adherent_plural: "Старвардцы"
 starvayrd_religion_desc: "Старвард основан на вере в то, что боги и духи взаимозаменяемы, и что первые боги были всего лишь духами угасших звёзд. Старвардцы верят, что можно увидеть свою судьбу, глядя на эти звёзды, и отслеживая знаки на небе при рождении ребёнка. Однако судьба будет утеряна, если не стремиться к ней, и достижение её — цель жизни каждого доброго старвардца."
