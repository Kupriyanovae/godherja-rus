 ancient_religion: "Древн"
 ancient_religion_adj: "Древняя религия"
 ancient_religion_desc: "Мир полон вер и религий, не всем из которых удалось сохранить последователей до наших дней. Некоторые породили преемников, включивших догматы их веры, но многим повезло меньше. Они живут лишь в томах библиотек, на росписях в разрушающихся храмах или в костях мёртвых."

