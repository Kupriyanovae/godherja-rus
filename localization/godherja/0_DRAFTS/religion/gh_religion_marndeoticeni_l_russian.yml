 marndeoticeni_cult_desc:0 "Тшуэканисты поклоняются Тшуэке, Облачённому-в-Чёрное, который обучил человечество искусствам зачарования и создания рун, прежде чем погрузиться в глубокий сон. Они верят, что его [Concept('eastern_tower','спящую форму')|E] можно увидеть и по сей день, и обладают поразительным чутьем, позволяющим им всегда точно знать её местонахождение. Тшуэканистские руны также гласят, что Тшуэка наставлял «Первых Формовщиков», хотя знание о том, что именно они сформировали, ныне давно утеряно во времени."