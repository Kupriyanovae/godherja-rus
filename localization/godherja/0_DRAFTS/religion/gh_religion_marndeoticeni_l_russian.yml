 marndeoticeni_cult_desc: "Тшуеканисты поклоняются Тшуек'е, Одетому в Чёрное, который научил людей искусству чародейства и создания рун, прежде чем погрузиться в глубокий сон. Они верят, что его [Concept('eastern_tower','спящая форма')|E] видна и по сей день, и имеют сверхъестественное чутьё на её местонахождение в любое время. Тшуеканистские руны также гласят, что Тшуек'а наставлял «Первых Кузнецов», хотя знание того, что они создали, ныне утеряно во времени."