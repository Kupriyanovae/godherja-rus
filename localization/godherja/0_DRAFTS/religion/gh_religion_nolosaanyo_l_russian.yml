 nolosaanyo_religion_desc: "Нолосааньойцы верят в святость и сохранение жизни, чтобы она могла следовать приливам и отливам мира. Единственное время года, когда верные употребляют мясо, — это сезонные празднества, направляющие духовный цикл нолосааньойцев. Нередко самые благочестивые последователи дают обет пацифизма, навсегда отрекаясь от насилия, даже перед лицом смерти."

