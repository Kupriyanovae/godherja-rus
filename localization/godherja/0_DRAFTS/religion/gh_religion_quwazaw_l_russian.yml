 quwazaw_religion_desc: "Можно простить того, кто увидит квазавитов и примет их за ответвление адабисцев, почитающих великие статуи людей и зверей. Однако сходство на этом заканчивается. Они верят, что эти божественные мегалиты не просто изображения богов, вырезанные по их образу и подобию, а каменные останки спящих физических аватаров своих богов. Они защищают эти статуи изо всех сил, ожидая дня, когда их покровителям может потребоваться пробудиться. Боги — истинные правители мира, а квазавиты — лишь временные его хранители."

