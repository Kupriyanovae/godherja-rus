 quwazaw_adherent_plural:0 "Кувазавцы"
 quwazaw_desc:0 "Кувазавцы относятся к почитаемым ими титаническим каменным статуям с глубочайшим благоговением: они омывают их, подновляют на них сложные узоры и даже ткут для них огромные плащи, на создание которых у целых деревень уходит по году. Главной движущей силой этих действий, которые чужаки отвергают как глупую трату времени и ресурсов, является уверенность в том, что они будут вознаграждены за своё благочестие и верность долгу, когда их боги пробудятся и вновь утвердят свою власть над человечеством."
 