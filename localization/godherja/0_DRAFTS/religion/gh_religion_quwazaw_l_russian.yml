 quwazaw_religion_desc:0 "Глядя на кувазавцев, можно ошибочно принять их за ответвление адабиссийцев, ведь они точно так же почитают великие изваяния людей и зверей. Однако на этом сходство заканчивается. Они верят, что эти божественные мегалиты — не просто изображения богов, выполненные по их подобию, а каменные останки их спящих физических аватаров. Они защищают эти статуи всеми силами, ожидая дня, когда их покровителям придёт пора пробудиться. Боги — истинные правители мира, а кувазавцы лишь временно присматривают за ним."
