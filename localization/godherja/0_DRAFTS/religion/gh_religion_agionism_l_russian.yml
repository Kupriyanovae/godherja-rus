 forgotten_adherent_plural: "Почитатели Забытого"
 forgotten_desc:0 "Все подробности о $forgotten_saint_link$;medium Святом#!, которому поклоняется этот культ, включая его имя, утеряны во времени, поэтому последователи носят маски и избегают личной похвалы, подражая отсутствию личности у своего покровителя. Их символ — око их святого, бессмысленно взирающее, неспособное сфокусироваться, пока его имя не будет произнесено вновь."
