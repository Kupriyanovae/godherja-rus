 eight: "Октарианск"
 eight_adj: "Октарианский агионизм"
 eight_adherent: "Октарианец"
 eight_adherent_plural: "Октарианцы"
 eight_desc: "Объединённый, кодифицированный и очищенный под оком Ордена Одинокого Стража, агионизм ныне един в почитании Святых, замученных [Concept('aversaria','аверсарианцами')|E]. Хотя изначально агионисты выступали против аверсарианских религиозных обычаев, после окончания их восстаний их культы были «реабилитированы» и вновь вписаны в аверсарианское вероучение; ныне агионисты и аверсарианцы разделяют многие догматы. Все Святые, почитавшиеся ранее, включены в Канон, включая $forgotten_saint_link$;medium Забытого Святого#!."
 eight_religious_symbol:0 "Восьмиконечная Звезда"
 
 seven_one: "Септарианск"
 seven_one_adj: "Септарианский агионизм"
 seven_one_adherent: "Септарианец"
 seven_one_adherent_plural: "Септарианцы"
 seven_one_desc: "Объединённый, кодифицированный и очищенный под оком Ордена Одинокого Стража, агионизм ныне един в почитании Святых, замученных [Concept('aversaria','аверсарианцами')|E]. Хотя изначально агионисты выступали против аверсарианских религиозных обычаев, после окончания их восстаний их культы были «реабилитированы» и вновь вписаны в аверсарианское вероучение; ныне агионисты и аверсарианцы разделяют многие догматы. Почти все Святые, почитавшиеся ранее, включены в Канон, за одним заметным исключением — ныне еретического Культа $forgotten_saint_link$;medium Забытого Святого#!."
 seven_one_religious_symbol:0 "Семиконечная Звезда"
 
 saintly_order: "Монокериксийск"
 saintly_order_adj: "Монокерикси"
 saintly_order_desc: "Монокерикси, отвергая божественность аавтократов и считая Святых единственным воплощением Чистейшего, тем не менее испытали сильное влияние традиционных [Concept('aversaria','аверсарианских')|E] культурных верований. Они полагают, что Святые явились в Аверсарии не случайно, а из-за высокой развитости аверсарианской культуры, которая повысила их способность следовать посланиям Святых и достичь чистоты. Таким образом, долг благочестивых агионистов — распространять как учения агионизма, так и аверсарианские знания среди низших народов мира, дабы все могли извлечь пользу из учений Святых."
 
 agiopolei: "Агиополейск"
 agiopolei_adj: "Агиополей"
 agiopolei_desc: "Человечество безнадёжно испорчено, и попытки спасти людей от скверны тщетны без Святых. Поэтому верующие ищут уединения от развращённого внешнего мира, чтобы сохранить учения Святых до «Второго явления», когда Святые вернутся, чтобы распространять свои божественные учения, как в давние времена."