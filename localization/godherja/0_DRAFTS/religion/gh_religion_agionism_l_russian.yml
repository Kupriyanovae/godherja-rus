 dikaynos_desc: "Дикайносианцы названы в честь $saint_dikaynos_link$;medium Святого Дикайна#!судьи, настолько преданного закону, что после ослепления он заучил весь свод законов наизусть, чтобы продолжить свои обязанности. Их символ — закрытый глаз, показывающий, что физическое зрение не обязательно для постижения истины."
