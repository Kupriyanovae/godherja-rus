 kemsar_religion_desc: "На протяжении веков кемсарское мировоззрение вращалось вокруг двух изначальных божеств-близнецов. Первым был Иах, [Concept('aervalr','Эрвал')|E], приносящий свет ночью и победитель тьмы, когда Солнцу нужно было отдохнуть. Второй — Хейя, великая Река, дающая пищу и перевозящая людей по всей земле. Если народ был нравственным и ублажал этих духов, они продолжали процветать вечно. Но без объяснения Хейя пересохла, а Иах разбился на множество осколков. Кемсарцы запаниковали и задумались, не сделали ли они что-то не так. Но вопросы морали отошли на второй план, поскольку их жизнь поглотила борьба за выживание."

