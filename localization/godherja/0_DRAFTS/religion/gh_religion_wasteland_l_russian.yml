 wasteland_rite_desc:0 "#size:15 По всему Эрасу простираются неосвоенные края, пока не заселённые людьми. Из-за магических катастроф, суровых природных условий или неумолимого наступления Тумана огромные пространства мира почти лишились человеческой жизни. Даже в самых безжизненных пустошах порой остаётся горстка людей, но в борьбе за собственное выживание они давно утратили последние остатки общественного уклада, пусть и ютятся среди руин цивилизации, частью которой когда-то были.#!"
