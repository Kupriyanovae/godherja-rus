 wasteland_faith_desc:0 "По всему [Concept('aeras','Аэрасу')|E] существуют [Concept('uncolonized_wasteland', 'неколонизированные')|E] регионы, не тронутые человеком — по крайней мере, в настоящее время. Будь то из-за магической катастрофы, крайней суровости природы или неумолимого наступления [Concept('the_fog','Тумана')|E], огромные пространства мира остались практически лишены человеческой жизни. Хотя даже в самых бесплодных пустошах порой выживают немногие одиночки, любые следы подлинного общества давно затерялись в борьбе за индивидуальное выживание, даже если эти люди цепляются за руины цивилизации, частью которой они когда-то были."
