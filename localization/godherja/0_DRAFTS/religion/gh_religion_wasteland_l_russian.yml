 wasteland_faith_desc:0 "По всему [Concept('aeras','Эрасу')|E] простираются [Concept('uncolonized_wasteland', 'неосвоенные')|E] регионы, не тронутые человеком — по крайней мере, на данный момент. Будь то из-за магической катастрофы, суровых условий или неумолимого наступления [Concept('the_fog','Тумана')|E], огромные пространства мира оказались почти полностью лишены человеческой жизни. Хотя в самых бесплодных пустошах изредка цепляются за жизнь немногочисленные выжившие, любые следы полноценного общества давно затерялись в борьбе за индивидуальное выживание — даже если они ютятся среди руин цивилизации, частью которой когда-то были."
