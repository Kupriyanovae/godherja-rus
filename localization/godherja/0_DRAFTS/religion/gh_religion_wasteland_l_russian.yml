 wasteland_rite_desc:0 "#size:15    По всему [Concept('aeras','Эрасу')|E] существуют регионы, нетронутые человеком, по крайней мере в настоящее время. Будь то из-за магической катастрофы, крайней суровости условий или неумолимого продвижения [Concept('the_fog','Тумана')|E], огромные пространства мира остались почти полностью лишены человеческой жизни. Хотя некоторая горстка людей часто живет даже в самых пустынных землях, любые следы настоящей культуры давно утеряны в борьбе за индивидуальное выживание, даже если они цепляются за руины цивилизации, частью которой когда-то были.#!"
