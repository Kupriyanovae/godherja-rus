 izaerto_bosar_religion_desc: "Изаэрто-бошарцы верят, что мир обречён с тех пор, как человечество сразило своего создателя — существо, известное как Великая Пустота. Однако божество, известное как «Пернатый», по их вере, дарует миру краски и дарует смертным передышку в вечном раю, который переживёт [Concept('aeras','Эрас')|E]. Последователи обычно не верят во вмешательство богов в смертную сферу, но не сомневаются, что Пернатый наблюдает за ними."

