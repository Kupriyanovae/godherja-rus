 izaerto_bosar: "Изаэрто-бошарск"
 izaerto_bosar_adj: "Изаэрто-Бошаризм"
 izaerto_bosar_adherent: "Изаэрто-бошарец"
 izaerto_bosar_adherent_plural: "Изаэрто-бошарцы"
 izaerto_bosar_desc: "Изаэрто Бошар, что означает «Тысяча Владык», — это вера, сосредоточенная вокруг убеждения, что эоны назад тысяча богов-царей с тёмной кожей были ниспосланы равнодушным и чуждым верховным богом по имени «Великая Пустота». Хотя их сложный [Concept('izaerto_bosar_creation_myth','миф о сотворении')|E] часто служит поводом для насмешек чужеземцев, святые мужи и жёны не обращают на это внимания. Великий Пернатый заберёт их души в рай после смерти, поэтому никакие насмешки смертных не сломят дух верных."

 khourtaul: "Хуртаулизм"
 khourtaul_adj: "хуртаульский"
 khourtaul_adherent: "хуртаулец"
 khourtaul_adherent_plural: "хуртаульцы"
 khourtaul_desc: "Хуртаульцы верят, что Пернатый не перенесёт их души в рай напрямую. Вместо этого они считают, что плоть мёртвых должна быть съедена, чтобы душа могла отправиться в рай и объятия Читдады. Они были традиционно небольшой и агрессивной сектой и часто относятся к своим более ортодоксальным собратьям как к отступникам, забывшим истину."

 hurimak: "Хуримакск"
 hurimak_adj: "Хуримакизм"
 hurimak_adherent: "Хуримакец"
 hurimak_adherent_plural: "Хуримакцы"
 hurimak_desc: "Хуримакские группы возникли в результате многовекового рабства у соседей земель изаэрто-бошарцев. Эти тайные группы восхваляют Скрытого Владыку вместо того, чтобы ненавидеть его, ибо именно он научил их скрывать свою веру и плести интриги в тени. Неумолимые и не заслуживающие доверия, хуримакцы за время своего существования нажили немного друзей."