 masaagnite_religion_desc:0 "Древние храмы Роджихлат Мара долгое время приводили в замешательство тех, кто умудрился заблудиться и наткнуться на них, но для масаагнитов эти полуразрушенные руины представляют собой обители богов и остатки некогда славной эпохи, в которую те правили. Масаагниты верят, что их долг — умилостивить свой пантеон бесконечными жертвоприношениями высоко на алтарях, которые боги когда-то называли своим домом, ибо если они этого не сделают, то боги поглотят саму вселенную. Веря, что злой дух Корромеш обманом заставил богов поглотить сам голод, они считают, что те, кто не приносит достаточной дани, будут сожраны огромными пастями самих божеств, но тех, кто её приносит, ждёт вечность пиров и празднований."
