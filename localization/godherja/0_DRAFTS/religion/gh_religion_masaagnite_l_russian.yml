 masaagnite_religion_desc: "Древние храмы Рожихлат-Мара издавна озадачивали тех, кто достаточно заблудился, чтобы наткнуться на них, но для масаагнитов рушащиеся руины представляют собой дома богов и остатки некогда славной эпохи, которой они правили. Масаагниты верят, что их долг — ублажать свой пантеон бесконечными жертвоприношениями на алтарях, которые некогда были их домом, ибо если они не будут этого делать, боги вместо этого поглотят саму вселенную. Веря, что боги были обмануты злым духом Корромешем, чтобы пожирать сам голод, те, кто не приносит достаточной дани, считаются пожранными великими пастями самих божеств, но для тех, кто приносит, уготована вечность пиршеств и празднеств."

