 astiliak_religion_desc: "Древняя вера народа астиликов — это разнообразная политеистическая система верований, не имеющая единого последовательного пантеона. Каждая община астиликов сохраняет свои культурные традиции, и их пантеоны лишь иногда разделяют общих богов. Единственное, что остаётся неизменным, — это то, как их боги [Concept('astilik_gods','являются')|E] на [Concept('aeras','Эрасе')|E]."

