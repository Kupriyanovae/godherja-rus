 kakarataki: "Какаратакск"
 kakarataki_adj: "Какаратакизм"
 kakarataki_adherent: "Какаратакец"
 kakarataki_adherent_plural: "Какаратакцы"
 kakarataki_desc: "Какаратакцы вошли в известный мир вместе с сьялвольской коалицией. Из-за веры в то, что Солнце и Луна — два бога, запертые в вечной борьбе, они должны благоволить Солнцу и сражаться против Луны. Жрецы ухаживают за садами священных растений, выращенных животворящим светом Солнца, на ночных существ охотятся, но никогда не едят, и жертвоприношения животных Солнцу должны совершаться часто, чтобы поддерживать его силу в вечной битве."
 kakarataki_old: "Старокакаратакск"
