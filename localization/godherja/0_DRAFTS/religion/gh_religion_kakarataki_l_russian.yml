 akrolenaki: "Акроленакск"
 akrolenaki_adj: "Акроленакизм"
 akrolenaki_adherent: "Акроленанец"
 akrolenaki_adherent_plural: "Акроленанцы"
 akrolenaki_desc: "Акроленакцы верят, что война между Солнцем и Луной будет бесконечной, и что победа одного над другим будет означать конец [Concept('aeras','Эраса')|E] навсегда, чего они стремятся избежать. В результате они следуют более строгой вере, чем большинство, их воинское жречество непоколебимо посвящает себя защите Кору. Акроленакцев часто подозревают в том, что они находят радость в жертвоприношениях «врагов» Кору, посвящая большую часть своего времени охоте на неверных. Их экстремизм никогда по-настоящему не был движущей силой, но их ряды никогда не уступали прихотям смертного мира, и не уступят: их божественный долг — сохранять равновесие."
