 kakarataki_religion_desc: "Для какаратакцев, изначально земледельческого народа, Солнце является источником всего благого. Они считают его аватаром бога Кору, творца человечества. Однако они считают Луну, создательницу всех ночных созданий, заклятым врагом Солнца. Они ведут дуалистическую битву за контроль над космосом, а внизу их творения сражаются за контроль над миром."

