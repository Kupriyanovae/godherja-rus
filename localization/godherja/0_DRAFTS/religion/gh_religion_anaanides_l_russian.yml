 anaanides_adherent_plural: "Анаанидцы"
 anaanides_desc: "Вера в то, что попасть в рай Анаан можно лишь через пожизненное странствие умственного исследования и очищения, означает, что в Анаанид обращается очень мало новообращённых. Их конечное решение рассматривается членами культа как радикальное, но необходимое действие — похищение тех, кто слишком юн, чтобы знать грех, и воспитание их среди анаанидов, чтобы они могли вступить на путь как можно раньше. Это может быть жестоко, но разве не более жестокая участь — обречь эти души на забвение?"