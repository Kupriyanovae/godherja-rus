 anaanides_religion_desc: "Вера Анаанид сосредоточена на единственном моменте в жизни, или скорее после жизни — моменте суда, где души предстают перед Великим Судьёй и признаются достойными войти в рай Анаан или погибнуть в пустоте. Однако число душ, способных войти в Анаан, крайне мало, и не все, кто ищет этот путь, могут его достичь. Единственные по-настоящему добрые люди, которые умирают, — это очень молодые, ещё не познавшие зла, или старые, очистившие свои души от нечистых желаний."

