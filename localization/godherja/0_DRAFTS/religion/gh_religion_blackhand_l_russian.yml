 blackhand_religion_desc: "Культ Чёрной Руки был [Concept('aversaria','аверсарианским')|E] культом, сосредоточенным вокруг загадочной фигуры, известной как «Искатель Разума». Культ считал Искателя Разума всесильным существом и пророком, способным предсказывать будущее, видеть прошлое и даровать великие силы своим последователям. Сам Искатель проповедовал идею о том, что все боги должны быть отвергнуты и убиты, ибо именно боги людей некогда уничтожили мир и сделают это снова. Последователи Искателя Разума уничтожали все религиозные изображения и писания, до которых могли добраться, и пытались узнать «истинные имена» богов, движимые верой в то, что произнесение истинного имени божества убьёт его."

