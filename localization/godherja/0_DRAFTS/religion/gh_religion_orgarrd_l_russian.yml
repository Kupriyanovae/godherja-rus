 orgarrd_religion_desc: "Оргардцы верят, что человечество, долгое время заключённое в тёмных пещерах и подземельях, восстало против своих богов, чтобы достичь поверхности. Однако сама земля была превращена в пепел, выжженный своими создателями. Вместо свободы человечество оказалось в ловушке циклов болезней, смерти и скорби — чуждых понятий для их подземной жизни. С того дня оргардцы стремятся найти высеченный в скале рай, из которого они произошли, возводя подземные храмы и углубляясь в священный камень, чтобы грешная поверхность не развратила их души."

