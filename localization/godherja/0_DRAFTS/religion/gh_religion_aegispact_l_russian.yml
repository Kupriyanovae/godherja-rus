 aegispact_desc:0 "Пакт Эгиды — это легендарная клятва, принесённая двенадцатью королями и королевами беженцев с материка и тридцатью одним племенным вождём Одинокого Света, которая положила конец «Кровавым распрям». Этот период массового кровопролития начался, когда потоки беженцев хлынули на запад, спасаясь от [Concept('sorrowing_of_oejeynica','Скорби по Ойейнике')|E], и попытались установить власть над местными племенами и другими бежавшими с материка.\n\nПакт, заключённый после поражения ненавистных Приккани и возвращения Эгиды Бриндом Хитрым с далёкого севера, обязал всех признать единого правителя. Этот правитель выбирался каждым племенем и каждым королём и должен был посвятить себя не личной выгоде, а защите Эгиды и обороне Одинокого Света. Хотя с тех пор Королевство не раз переживало расцвет и падение, множество разрозненных верований со временем слились воедино, сплочённые не верой в богов, а верой в силу могучей Эгиды."