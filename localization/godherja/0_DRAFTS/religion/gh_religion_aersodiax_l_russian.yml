 aerasodiax_desc:0 "Эрсодий, глашатай утерянного [Concept('aersanon','Творца')|E] и владыка всего человечества, был одновременно жесток и мудр. Он правил людьми и даровал им [Concept('magic','Дар')|E] в обмен на кровь и служение. Верующие были прокляты, когда мятежники убили Эрсодия и его наследников ещё в незапамятные времена, и теперь прощение необходимо заслуживать постоянными подношениями и ритуалами, дабы Дар не был отнят."
