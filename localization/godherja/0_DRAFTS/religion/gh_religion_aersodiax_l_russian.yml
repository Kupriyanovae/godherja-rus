# Aersodiaxynism
 aerasodiax: "Эрсодиаксианск"
 aerasodiax_adj: "Эрсодиаксинизм"
 aerasodiax_adherent: "Эрсодиаксианец"
 aerasodiax_adherent_plural: "Эрсодиаксианцы"
 aerasodiax_desc: "Эрсодиакс, Глашатай утраченного [Concept('aersanon','Создателя')|E] и Король всего Человечества, был жесток и мудр, правя человечеством и даруя [Concept('magic','Дар')|E] в обмен на кровь и служение. Верные были прокляты, когда мятежники убили Эрсодиакса и его наследников задолго до памяти, и прощение должно быть заслужено через постоянные жертвы и ритуалы, чтобы Дар не был отнят."
 aerasodiax_old: "Староэрсодиаксианск"
 aerasodiax_old_adj: "Старый эрсодиаксинизм"
 aerasodiax_old_adherent: "Староэрсодиаксианец"
 aerasodiax_old_adherent_plural: "Староэрсодиаксианцы"

# Ordro Aerdroxix
 ordro_aerdroxix: "Ордроаэрдроксикск"
 ordro_aerdroxix_adj: "Ордро Эрдроксикс"
 ordro_aerdroxix_adherent: "Аэрдроксикец"
 ordro_aerdroxix_adherent_plural: "Аэрдроксикцы"
 ordro_aerdroxix_desc: "Божественный орден великого [Concept('dragons','дракона')|E] Эрдроксикса — божественного царя, столь же жестокого, сколь и мудрого, — возможно, канул в [Concept('prehistory','Доисторическую эпоху')|E], но его верное жречество в божественном Зарре веками поддерживало его божественный домен, и их власти бросил вызов лишь подъем [Concept('aversaria','Аверсарианской Аавтократии')|E]. Несколько кризисов, ослабивших веру в период возвышения Империи, были бы незначительны по сравнению с бедствием [Concept('maklean_terrors','Маклейского террора')|E], когда Ордро Эрдроксикс был запрещен, а его оставшееся жречество погребено под Дометиклином."
 ordro_aerdroxix_old: "Староордроаэрдроксикск"
 ordro_aerdroxix_old_adj: "Старый Ордро Аэрдроксикс"
 ordro_aerdroxix_old_adherent: "Староаэрдроксикец"
 ordro_aerdroxix_old_adherent_plural: "Староаэрдроксикцы"