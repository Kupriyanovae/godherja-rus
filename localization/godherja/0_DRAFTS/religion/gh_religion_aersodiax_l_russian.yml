# Ordro Aerdroxix
 ordro_aerdroxix: "Ordro Aerdro'xix"
 ordro_aerdroxix_adj: "Ordro Aerdro'xixyn"
 ordro_aerdroxix_adherent: "Aerdro'xixyn"
 ordro_aerdroxix_adherent_plural: "Aerdro'xixyns"
 ordro_aerdroxix_desc: "The divine order of the great [Concept('dragons','dragon')|E] Aerdro'xix — a divine king equally as cruel as he was wise — may have passed [Concept('prehistory','many eons ago')|E], but his loyal priesthood within the divine Zarr maintained his divine domain for eons, their authority only challenged by the rise of the [Concept('aversaria','Aversarinas Aautokrata')|E]. The several crisises that weakened the faith in the Empire's rise would be minor only in comparison to the disaster of the [maklean_terrors|E], when the Ordro Aerdro'xix was banned and its remaining priesthood buried beneath Domethiclyn."
