# Aersodiaxynism
 aerasodiax: "Эрсодиаксинск"
 aerasodiax_adj: "Эрсодиаксинизм"
 aerasodiax_adherent: "Эрсодиаксин"
 aerasodiax_adherent_plural: "Эрсодиаксины"
 aerasodiax_desc: "Эрсодиакс, глашатай утерянного [Concept('aersanon','Творца')|E] и владыка всего человечества, был одновременно жесток и мудр. Он правил людьми и даровал им [Concept('magic','Дар')|E] в обмен на кровь и служение. Верующие были прокляты, когда мятежники убили Эрсодиакса и его наследников ещё в незапамятные времена, и теперь прощение необходимо заслуживать постоянными подношениями и ритуалами, дабы Дар не был отнят."
 aerasodiax_old: "Староэрсодийск"
 aerasodiax_old_adj: "Старый эрсодианизм"
 aerasodiax_old_adherent: "Староэрсодианец"
 aerasodiax_old_adherent_plural: "Староэрсодианцы"

# Ordro Aerdroxix
 ordro_aerdroxix: "Ordro Aerdro'xix"
 ordro_aerdroxix_adj: "Ordro Aerdro'xixyn"
 ordro_aerdroxix_adherent: "Aerdro'xixyn"
 ordro_aerdroxix_adherent_plural: "Aerdro'xixyns"
 ordro_aerdroxix_desc: "The divine order of the great [Concept('dragons','dragon')|E] Aerdro'xix — a divine king equally as cruel as he was wise — may have passed [Concept('prehistory','many eons ago')|E], but his loyal priesthood within the divine Zarr maintained his divine domain for eons, their authority only challenged by the rise of the [Concept('aversaria','Aversarinas Aautokrata')|E]. The several crisises that weakened the faith in the Empire's rise would be minor only in comparison to the disaster of the [maklean_terrors|E], when the Ordro Aerdro'xix was banned and its remaining priesthood buried beneath Domethiclyn."
 ordro_aerdroxix_old: "Old Ordro Aerdro'xix"
 ordro_aerdroxix_old_adj: "Old Ordro Aerdro'xixyn"
 ordro_aerdroxix_old_adherent: "Old Aerdro'xixyn"
 ordro_aerdroxix_old_adherent_plural: "Old Aerdro'xixyns"