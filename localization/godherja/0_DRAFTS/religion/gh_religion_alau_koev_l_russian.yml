 tsokar: "Цокарск"
 tsokar_adj: "Цокар"
 tsokar_adherent: "Цокарец"
 tsokar_adherent_plural: "Цокарцы"
 tsokar_desc: "Цокарцы поклоняются Цокану, Богу Знания, как своему главному божеству. Для них нет ничего выше, чем поиск запретного знания мира, и они посвящают много времени путешествиям по Айроною в поисках ответов на самые насущные вопросы. Хотя их обожжённая кожа может отпугивать чужеземцев от общения с цокарцами, их часто считают самыми открытыми из всех алаукоевцев."
