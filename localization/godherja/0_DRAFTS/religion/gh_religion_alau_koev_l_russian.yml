 daminkar_adj: "Даминкар"
 daminkar_adherent: "Даминкарец"
 daminkar_adherent_plural: "Даминкарцы"
 daminkar_desc: "Даминкарцы верят, что сам [Concept('fire_gate','Алау Коев')|E] является Богом, единой и могучей силой, перенёсшей их в смертный мир из тёмной темницы, известной как Ада Тви. Они известны своими пышными празднествами огня, где верные пируют на обугленном мясе и танцуют по длинным рядам пылающих углей. Для них смертный мир — это благословение, которым следует наслаждаться, а повторное открытие Огненных врат означает страх, ибо это сигнализирует о возвращении Холодного Владыки Хел Тви, чтобы забрать их души."
