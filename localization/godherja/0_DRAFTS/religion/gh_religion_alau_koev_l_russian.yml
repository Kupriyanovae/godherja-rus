 alau_koev_religion_adherent: "Алаукоевец"
 alau_koev_religion_adherent_plural: "Алаукоевцы"
 alau_koev_religion_desc: "Алау Коев означает '[Concept('fire_gate','Огненные врата')|E]' на цетнерском языке чарчаков, и верующие утверждают, что великие врата чистого огня некогда соединяли смертный мир с пылающим домом богов, где хранятся пожары, породившие [Concept('aeras','Эрас')|E]. Считается, что врата открывались в последний раз, возможно, в первом веке, и святые и верные прошли через них в этот мир, прежде чем врата закрылись за ними, и они не откроются вновь, пока весь мир наконец не войдёт в божественное пекло и не будет сожжён солнцем. Последователей обычно описывают чужеземцы как «одержимых огнём»: жреческая каста толкует знамения всегда неизбежного апокалипсиса в своих мерцаниях, а правители ритуально сжигают себя, чтобы доказать свою святость (чем больше обожжено тело, тем святее).\n\nИх соседи на протяжении истории часто считали их никчёмными, поскольку обожжённые рабы обычно были плохими работниками. Несмотря на их малые размеры и дурную репутацию, они привлекли большой интерес со стороны [Concept('aversaria','аверсарианских')|E] учёных, которые верили, что сказание об огненных вратах было примитивной памятью о древнем заклинании, самым известным из которых был опахасийский [Concept('magi','маг')|E] [Concept('daharat_sun','Детиклас')|E]."
