 alau_koev_desc: "Алаукоевцы верят, что мир богов был отрезан от них, и врата откроются вновь только тогда, когда мир будет готов очиститься от своих грехов в огне. В преддверии повторного открытия [Concept('fire_gate','Огненных врат')|E] благочестивые последователи ритуально сжигают себя в подготовке к возвращению Плеймао на [Concept('aeras','Эрас')|E]. Алаукоевцы наслаждаются постоянным отвращением чужеземцев к своей вере и верят, что их страдания в жизни являются свидетельством божественного огня внутри них."

 osmirat: "Осмиратск"
 osmirat_adj: "Осмират"
 osmirat_adherent: "Осмиратец"
 osmirat_adherent_plural: "Осмиратцы"
 osmirat_desc: "Осмиратцы поклоняются Богине Войны, Осмире, превыше всех прочих. Они видят духов, населяющих мир, как её павших воинов и проводят большую часть своей жизни, пытаясь быть одержимыми, чтобы завершить старые войны во имя её. Для них [Concept('fire_gate','Алау Коев')|E] откроется только тогда, когда закончатся все войны верных, и осмиратцы считают себя достойными выполнить эту задачу."
