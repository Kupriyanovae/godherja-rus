 mokmanur_desc: "Мокманурцы утверждают, что врата из Ада Тви открылись, когда Плеймао был изгнан с небес, и те, кто остался верен ему, были отторгнуты от Рая в наказание. Традиция Мокманура гласит, что Хел Тви на самом деле является более благожелательным существом, и [Concept('fire_gate','Алау Коев')|E] откроется, когда мир освободится от влияния его врага. Поклоняясь водам Латунного моря, мокманурцы верят, что им суждено остановить возвращение Плеймао, и их наградой будет вечность в утешительных объятиях Вечной Ночи, Ада Тви."
