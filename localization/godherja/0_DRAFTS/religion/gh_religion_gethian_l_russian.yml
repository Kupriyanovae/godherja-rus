 gethian_desc: "Гетцы вошли в известный мир вместе с сьялволькской коалицией. Хотя они были довольно замкнуты, сьялволки рассказали им о великих злодеяниях [Concept('aversaria','аверсарианцев')|E] и их империи. Они надеются, что, истребив эту презренную и разрушительную веру, они смогут искупить себя в глазах Великого Судьи Атрах-Адмаха."
