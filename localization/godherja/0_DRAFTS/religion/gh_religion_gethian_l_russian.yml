 gethian_religion_desc: "Гетианская космология гласит, что в древнейшие дни первые люди сильно оскорбили Великого Судью Атрах-Адмаха. Этот грех, как утверждается, был настолько оскорбительным и гнусным, что его подробности были утеряны во времени, ибо никто не осмеливается произнести его мерзость. Великий Судья был мудр, но суров, и сказал человечеству, что они не будут судимы по одному лишь этому деянию. Он покинет этот мир на долгое время, и когда он вернётся, он осудит человечество и увидит, совершили ли они достаточно добра, чтобы перевесить их невыразимый грех."

