 gallieni_religion_desc: "Галлиенийские веры — это не столько единая религия, сколько свободное собрание местных религий, объединённых скорее культурой, чем какими-либо конкретными религиозными убеждениями. Единственный догмат, общий для всех них, — это вера в то, что человечество не является хозяином своей судьбы, а скорее подвергается ударам капризных или бессердечных сверхъественных сил."

