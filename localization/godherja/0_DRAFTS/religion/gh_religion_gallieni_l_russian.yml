 gallicader_adherent_plural: "Галликады"
 gallicader_desc: "Галликады некогда были доминирующей верой [chevalie|E], будучи вытеснены лишь относительно недавно путеходцами. Они верят, что человек не обладает свободной волей и что вся жизнь от рождения до смерти определяется движением звёзд. Наблюдая за небесными орбитами, можно начать раскрывать тайны будущего и утраченные знания прошлого."
