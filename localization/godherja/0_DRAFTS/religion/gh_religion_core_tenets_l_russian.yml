 province_is_of_a_megalith_or_nature_faith_tt: "Это [Concept('county','графство')|E] должно следовать [Concept('faith','конфессии')|E], которая верит в значение мегалитов или [Concept('core_tenet', 'догмат')|E] «[GetFaithDoctrine('tenet_sanctity_of_nature').GetBaseName]»"

 tenet_stewards_road_name: "Путь Хранителей"
 tenet_stewards_road_desc: "Мудрость управленцев безбрежна, как океан, и способна занять целую жизнь изучения и созерцания. Именно поэтому последователи должны целиком посвятить себя учению, отрешившись от всех мирских отвлечений."

 tenet_skull_mound_name: "Курган из черепов"
 tenet_skull_mound_desc: "Полководцы, преданные Биньяру, часто собирают тела вражеских солдат после победоносной битвы. Они отсекают головы, складывают их вдоль дорог или близ городов и покрывают землёй, образуя курганы. Эта практика служит как для устрашения врагов, так и для демонстрации воинских достижений. Последователи Биньяра верят, что этот акт является священнейшим подношением [chiang_hsiang_shou|E]."

 tenet_thirteen_precepts_name: "Тринадцать военных текстов"
 tenet_thirteen_precepts_desc: "Тринадцать военных текстов составляют основу всех школ Биньяра. Достойный ученик Биньяра должен тщательно изучить эти книги и постичь заключённое в них знание, иначе он столкнётся с презрением своих собратьев."

 tenet_assist_the_world_and_save_the_people_name: "Мирской долг"
 tenet_assist_the_world_and_save_the_people_desc: "Верные посвящают себя благополучию мира, стремясь к миру и процветанию всех людей. Коррумпированные чиновники, пренебрегающие жизнями и страданиями простых людей, являются нашими величайшими противниками."

 tenet_overthrow_the_mandate_of_heaven_name: "Революционное рвение"
 tenet_overthrow_the_mandate_of_heaven_desc: "Ничто не длится вечно, и всё устаревшее должно быть сметено. Однако наши враги, дряхлые и бессильные, никогда не будут стоять сложа руки, пока истина Синь Сюэ проповедуется народу. Только подавляющей силой мы можем донести нашу доктрину до каждого уголка земли."

 tenet_eight_theories_name: "Идейная борьба"
 tenet_eight_theories_desc: "Синь Сюэ включает восемь основных школ мысли, каждая из которых представляет применение её принципов в различных областях. Эти школы часто организуют великие диспуты, чтобы совершенствовать и развивать свои доктрины, обеспечивая жизнеспособность Синь Сюэ."