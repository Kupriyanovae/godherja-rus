l_russian:
 # Agionist-Exclusive Tenets
 # LOC FOR GH VERSIONS OF VANILLA TENETS
 # Religion-Specific GH Tenet Names
 # Wardenite-Exclusive Doctrine Parameters 
 # Wardenite-Exclusive Tenets
 blind_justice_partition: "Ваша вера имеет догмат «Слепое правосудие»"
 only_one_agionist_tenet_trigger: "Вы можете выбрать только один догмат, следующий учению конкретного Святого, для своей [Concept('faith','конфесии')|E]"
 #tenet_adaptive_aruvasue_religion_desc: "Twelve dissenters radically shifted Aruvasue to its current form, daring to fight what they believed injust. It was not what divided them that defined them, but what united them; we should all follow their example."
 #tenet_adaptive_aruvasue_religion_name: "Brotherhood of Twelve"
 tenet_aeschraes_legacy_desc: "Когда Чистейший ходил среди нас в облике Эшрея, Он показал нам, что нет высоты, слишком высокой для полёта, нет цены, слишком высокой для победы, нет ничего настолько священного, что нельзя было бы принести в жертву — даже самого мира."
 tenet_aeschraes_legacy_name: "Пылающий мир"
 tenet_the_long_war_name: "Долгая война"
 tenet_the_long_war_desc: "Аксиотея сражалась, чтобы спасти этот мир, пока не испустила последний вздох. Она ни разу не дрогнула, ибо такова была её любовь ко всем нам, и мы также никогда не должны колебаться. Мы уже подвели её однажды, позволив злу восторжествовать, но долгая война против скверны Эшрея будет бушевать, пока вся Империя не будет отвоёвана во имя её законной императрицы."
 tenet_axiaothea_legacy_name: "Долгая война"
 tenet_axiaothea_legacy_sjalvolki_religion: "Та, что выстояла против Разрушителя Мира"
 tenet_Amsari_desc: "Пока наши правители являются Кровью Пророка, Небеса будут направлять нас, если правитель достаточно добродетелен, чтобы вести наш народ. Однако когда правитель благословлён Небесами, он будет сталкиваться с ограниченными проблемами как со стороны двора, так и страны."
 tenet_Amsari_name: "Божественное право"
 #tenet_ancestor_worship_aruvasue_religion_desc: "Aruva Agat, the king of the mortal world, lives within the blood of all of us. Our bloodlines all owe themselves to Him, and we in turn owe a debt to our ancestors for maintaining His connection with us. It is an honour like no other to be joined to a god."
 #tenet_ancestor_worship_aruvasue_religion_name: "The Spirit of the King Within Us"
 tenet_aversarian_desc: "The nature of our divine heritage is indisputable. With this it is our right to enforce our will upon those who would stand against it; as has been the case since the rise of Man and the rise of our people."
 tenet_aversarian_name: "Aversarian Birthright"
 tenet_bekashai_desc: "Всевышний был убит армией язычников, чьё неверие погрузило Его последователей во тьму. В течение неисчислимых лет это великое преступление оставалось неотомщённым. Это должно быть исправлено, и правосудие должно свершиться над Его убийцами."
 tenet_bekashai_name: "Поиск возмездия"
 tenet_blind_justice_desc: "Святой Дикайнос судил каждое дело, не взирая на человека, а лишь на справедливость его дела. Так же, как и он, мы должны гарантировать, что наши чувства никогда не ослепят нас перед истиной, и следить, чтобы те, кого мы найдём виновными, никогда больше не осмеливались грешить через обман."
 tenet_blind_justice_name: "Слепое правосудие"
 tenet_blood_purity_desc: "Катаритос сказал нам так:\n\n«Пусть твоё сердце будет свободным, твоё тело сильным, а всё твоё существо чистым».\n\nОднако язычники отвергают его учения, а грешники оскверняют их. Все будут очищены, а те, кто откажется от слов Катаритоса через веру или происхождение, будут уничтожены, пока все не обретут священное совершенство."
 tenet_blood_purity_name: "Чистота крови"
 tenet_bulwark_desc: "Наш удел — защищать паству. Наши мечи разят не ради славы, наши воины сражаются не ради денег, но мы служим ради доблести, что можно обрести в истинном мужестве."
 tenet_bulwark_name: "Мужество — всегда"
 tenet_calystos_pure_desc: "Святой Калисто провозгласил, что все люди заслуживают быть свободными, и мы будем следовать его словам до того дня, когда бич рабства будет искоренён с [Concept('aeras','Аэраса')|E]. Для достижения этой цели мы должны исследовать моря, как это делал Калисто, чтобы мы могли освобождать рабов, где бы они ни угнетались, и поражать работорговцев там, где они слабее всего. Все, кто выступает против рабства, будут желанны в наших рядах, независимо от их происхождения или верований, ибо дело свободы универсально."
 tenet_calystos_pure_name: "Армада свободы"
 tenet_citizenship_through_service_desc: "Чистота — это не что-то в крови человека, а скорее то, что проявляется в его действиях. Как мы можем судить грешника, если грешник сражается за нас?"
 tenet_citizenship_through_service_name: "Гражданство через службу"
 tenet_cthonic_redoubts_quwazaw_desc: "Наш народ должен жить среди гор, где покоятся наши спящие боги. Высокие места священны, ибо почему бы ещё боги избрали их своим местом отдыха?"
 tenet_cthonic_redoubts_quwazaw_name: "Спящие статуи"
 #tenet_esotericism_aruvasue_religion_desc: "Ten thousand men and women have claimed that they have spoken for Aruvas, and none of them can be refuted. Each word of the Moon-Sun-King has been written and re-written by hundreds of faithful, and we are no closer to understanding He-Who-Is-One-But-Is-Three. There is peace in understanding that He cannot be understood."
 #tenet_esotericism_aruvasue_religion_name: "Ten Thousand Prophets"
 tenet_esotericism_aagiokratian_religion_name: "Мистериальные культы"
 tenet_games_for_gods_desc: "Чтобы продемонстрировать наши добродетели, мы совершаем великие подвиги во время наших паломничеств. Эти деяния, совершённые под взором небес, — не просто хорошее развлечение: они священны. Впрочем, игры довольно забавно наблюдать."
 tenet_games_for_gods_name: "Игры для богов"
 tenet_gedeora_veneration_desc: "Каждая [Concept('gedeora','гедеора')|E] — не проклятие, а послание от самого божественного. Мудрости тех, кто просветлён их объятиями, следует внемлить, а тех, кто благословлён ими с детства, следует особенно уважать."
 tenet_gedeora_veneration_name: "Почитание [Concept('gedeora','гедеоры')|E]"
 tenet_gedeora_veneration_ritualist_religion: "[GetBuilding('01_sophocos').GetName] повелевает миром меняться"
 #tenet_gruesome_festivals_aruvasue_religion_desc: "Armut Yan, the 'Snows of Blood', are the oldest tradition gifted to us by [ertomax|E]. These festivals see the unfaithful, whatever form they might take, be sacrificed in glorious manners in the name of the Moon-Sun-King."
 #tenet_gruesome_festivals_aruvasue_religion_name: "Armut Yan Festivals"
 tenet_gruesome_festivals_azakna_jakuungi_religion_desc: "Азакна Гуусаги, или Обряд Крови, — один из восьмидесяти шести мистических обрядов, практикуемых азаргами. Обряд включает в себя жестокое убийство и пытки пленных язычников, а их трупы выставляются вместе с надписями, подробно описывающими их смерть, написанными их собственной кровью."
 tenet_gruesome_festivals_azakna_jakuungi_religion_name: "Азакна Гуусаги"
 #tenet_hedonistic_aruvasue_religion_desc: "Os Tandrakh often serves as a substitute for Os Kinjer in life, whereby the food and drink of a feast is seen as the spirit of Aruva Agat instead of any guest. It is impious to deny the divinity of the gifts placed upon the banqueting table."
 #tenet_hedonistic_aruvasue_religion_name: "Os Tandrakh"
 tenet_hero_ancestor_cult_desc: "Наш народ помнит героев островов, фигуры, которые, несмотря на своё разное происхождение, объединены Благосклонностью, дарованной им. Мы помним их всех, ради шанса, что наш народ однажды снова будет благословлён."
 tenet_hero_ancestor_cult_name: "Родовые герои"
 tenet_hero_cult_desc: "Мы помним древних героев, тех, кто вознёсся далеко за пределы того, чего мы можем достичь за свою жизнь, проложив путь, по которому мы можем следовать, чтобы хоть мельком увидеть тех, кого мы знаем как божественных."
 tenet_hero_cult_name: "Культ героев"
 tenet_akkaradhammic_rituals_name: "Akkaradhammic Rituals"
 tenet_akkaradhammic_rituals_desc: "The Akkaradhammic Rituals venerate Akkaradhamma, the Undying Lich King, through dark rites that harness death and ethereal magic to transcend mortality. Devotees perform blood-soaked ceremonies and necromantic rituals to commune with spirits and wield the power of the spectral realm."
 tenet_high_bloodright_desc: "Только те, кто прошёл древние ритуалы, считаются достойными править, будучи очищенными от всей скверны."
 tenet_high_bloodright_name: "Ритуальная чистота"
 tenet_household_gods_name_hulawite_religion: "Корона Блистающего Солнца Разума"
 tenet_household_gods_desc_hulawite_religion: "Истинный праведный владыка определяется не ложным богом или иррациональным вероучением, а его или её собственной непобедимой добродетелью. Давайте последуем разуму и вложим все необходимые полномочия в руки одного доброго деспота, который будет посредничать между враждующими жрецами и искать справедливость превыше всего."
 tenet_veneration_of_ohrasik_desc: "Охрасик продолжает вести праведных через свои перевоплощения, возглавляя борьбу против нечестивых слуг [Concept('aervalr','Аэрвала')|E] долго после того, как его изначальная форма покинула [Concept('aeras','Аэрас')|E]."
 tenet_veneration_of_ohrasik_name: "Почитание Охрасика"
 tenet_higher_purity_desc: "Недостаточно быть превосходящим, мы должны стремиться очистить себя от скверны, где бы мы её ни нашли. Ничто не священно."
 tenet_higher_purity_name: "Поиск чистоты"
 tenet_holy_river_desc: "Мы поклоняемся священной реке, чей прилив и отлив приносит нам жизнь и смерть."
 tenet_holy_river_name: "Почитание реки"
 tenet_knowledge_veneration_name: "Почитание знаний"
 tenet_knowledge_veneration_desc: "Знание — это инструмент вознесения. Чем больше знаний накапливают люди, тем ближе они к Сарвату и другим богам."
 tenet_inner_journey_shyatan_religion_desc: "Ванель Шй'ата перенёс бесчисленные ужасы, чтобы понять цикл времени, и только через него мы знаем, как освободить себя. Это привилегия — следовать его пути."
 tenet_inner_journey_shyatan_religion_name: "Испытания Шй'аты"
 tenet_legalistic_diversity_desc: "Множество правовых традиций, расцветших в нашей вере, — не слабость, а сила. Мы поощряем дебаты и разнообразие мнений, и хотя это иногда приводит к путанице и жарким спорам, в конечном счёте это оставляет нам свод законов, практически не имеющий себе равных в мире."
 tenet_legalistic_diversity_name: "Юридическое разнообразие"
 tenet_magi_slayers_desc: "Не может быть милосердия к тем, кто владеет украденной силой. Их необходимо уничтожать везде, где их можно найти."
 tenet_magi_slayers_fogeater_religion: "Заставьте Кричащих замолчать"
 tenet_magi_slayers_gestanwoder_religion: "Подражайте Ур'Фарум'Бартуму, Князю Кровавого Пира"
 tenet_magi_slayers_kardawai_religion: "Пиры для Кардвена"
 tenet_magi_slayers_mogowai_religion: "Сокрушите Узурпаторов"
 tenet_magi_slayers_name: "Убийцы [Concept('magi','магов')|E]"
 tenet_magi_slayers_samojitian_religion: "Убейте Тиранов"
 tenet_marefai_desc: "Хотя мы все ищем Его местоположение, мы принимаем свободу интерпретировать Его веру так, как кто пожелает, и принимаем широкое разнообразие практик. В конце концов, если бы Он не хотел, чтобы мы были разными, Он не создал бы нас такими."
 tenet_marefai_name: "Разнообразие интерпретаций"
 tenet_mogowai_search_desc: "Давным-давно Всевышний был убит неверующими, а Его тело было унесено в таинственное место. Мы ищем это место, ибо когда Всевышний восстанет из своей вновь обретённой могилы, всё снова станет правильно."
 tenet_mogowai_search_name: "Великий поиск"
 tenet_natural_primitivism_anaanides_religion: "Простая чистота Рая Анаана"
 tenet_natural_primitivism_aversarinas_aagiokrata_religion: "Святые тела чистых мужчин и женщин"
 tenet_natural_primitivism_wardenism_religion: "И Праведные не будут владеть богатством"
 tenet_nitsafai_desc: "С тех пор как Он умер так давно, истинные пути Его веры были извращены и искажены в угоду мелочным владыкам. Прежде чем можно будет возобновить поиски Его гробницы, Его последователи должны быть возвращены на истинный путь, ибо позволить еретикам обнаружить Его местоположение может быть катастрофично."
 tenet_nitsafai_name: "Восстановление"
 tenet_philanthrios_corrupt_desc: "Святой Филантро учил давать нуждающимся, а кто более нуждается, чем мы, самоотверженные исполнители его воли? Если грешники и язычники слишком развращены жадностью, чтобы добровольно жертвовать на наше дело, мы должны спасти их от их развращённости, силой изымая их богатства."
 tenet_philanthrios_corrupt_name: "Принудительные пожертвования"
 tenet_philanthrios_pure_desc: "Святой Филантро учил нас давать нуждающимся, не использовать роскоши, в которой мы не нуждаемся, и не накапливать излишних богатств. Таким образом, чтобы истинно следовать его учению, мы не должны облагать налогом беднейших, а вместо этого щедро давать им наши собранные пожертвования."
 tenet_philanthrios_pure_name: "Филантросианская щедрость"
 tenet_pursuit_of_power_adabyssian_religion: "Борьба за благосклонность Золотого Города"
 tenet_quest_for_life_desc: "Исцеление должно быть доведено до совершенства, жизнь должна быть дарована святым. Но как мы узнаем пределы наших тел или опасность того, что его поражает, если не будем продвигать физические науки? Если язычники и грешники должны быть объектами экспериментов, то они могут делать это, зная, что их смерть священна, ибо она спасает жизни сотен набожных."
 tenet_quest_for_life_name: "Поиск жизни"
 tenet_raider_cult_desc: "Для последователей нашего вероучения мораль и сила преходящи. Мы должны брать то, что принадлежит нам, ничто не священно."
 tenet_raider_cult_name: "Raider Cult"
 tenet_reincarnation_aruvasue_religion_desc: "Дух [Concept('ertomax','Эртомакса')|E] живёт в душах верных. В самый тёмный час благословение рвения и крови проявит себя, и Эртомакс возродится."
 tenet_reincarnation_aruvasue_religion_name: "Возвращение Эртомакса"
 tenet_religious_legal_pronouncements: "Религиозный закон"
 tenet_religious_legal_pronouncements_alau_koev_religion_desc: "Отец Огня дал нам жизнь,\n\nОн построил наши царства через борьбу,\n\nИ в ответ я отдаю свою жизнь,\n\nЗаконам нашего Отца."
 tenet_religious_legal_pronouncements_alau_koev_religion_name: "Балладный закон"
 tenet_religious_legal_pronouncements_mogowai_religion_name: "Гимнический закон"
 tenet_ritual_cannibalism_izaerto_bosar_religion_desc: "Бездна заберёт наши души, если мы не будем действовать быстро. Мёртвых нужно съесть, прежде чем Повелители смогут украсть их."
 tenet_ritual_cannibalism_izaerto_bosar_religion_name: "Пир Беспёрых"
 tenet_ritual_hospitality_aruvasue_religion_desc: "Пировать — значит чтить Аруваса во [Concept('aspects_of_aruvas','всех его формах')|E], а проявлять гостеприимство — значит пригласить искру [Glossary('Арува Агат','GH_ARUVA_AGAT_GLOSS')] в собственный очаг и дом. Давайте же чествовать почётного гостя как выражение божественности, которым он является, и воздавать должные почести источнику творения."
 tenet_ritual_hospitality_aruvasue_religion_name: "Пиры для Аруваса"
 tenet_ritual_hospitality_mogowai_religion: "Помощь искателям"
 tenet_sansia_corrupt_desc: "Через страдание, жертву и боль дух укрепляется и приближается к Чистейшему. Таким образом, мы должны очищать свои тела и души через боль, а также тела и души язычников, отказывающихся принять благодать Святых."
 tenet_sansia_corrupt_name: "Сила через страдание"
 tenet_sansia_pure_desc: "Через дисциплину, сосредоточенность и преданность защите невинных дух укрепляется и приближается к Чистейшему. Таким образом, мы должны очищать свои души через медитацию, тренировки и благие дела, чтобы быть готовыми последовать примеру Сансии и пожертвовать собой ради невинных, если возникнет необходимость."
 tenet_sansia_pure_name: "Спасение через дисциплину"
 tenet_seaborne_desc: "Нет «до», нет «после», мы возникаем из соли и однажды вернёмся в соль, чтобы нас проносило от берега к берегу, увлекаемое бесконечным приливом."
 tenet_seaborne_name: "Рождённые морем"
 tenet_spread_the_light_name: "Несите свет"
 tenet_spread_the_light_desc: "Наш долг — нести свет Святых и Аверсерии низшим народам мира, чтобы и они могли освободить себя от скверны. Таким образом, мы должны оказывать непоколебимую поддержку нашим братьям и сёстрам в Святых Орденах, посвятившим свои жизни осуществлению этой божественной миссии."
 tenet_honor_the_saints_name: "Чтите Святых"
 tenet_honor_the_saints_desc: "Чествуя Святых и следуя их примеру, мы можем освободиться от скверны внутри."
 tenet_sky_burials_izaerto_bosar_religion_desc: "Пернатый ждёт, чтобы забрать нас всех в рай. Нам нужно лишь позволить нашим телам быть поглощёнными его слугами и отпустить наши души на свободу."
 tenet_sky_burials_izaerto_bosar_religion_name: "Дань Пернатому"
 tenet_slavery_desc: "Что может быть более освобождающим, чем труд? Что более освобождает работника, чем набожное пение и выкрикивание псалмов и гимнов, пока они щёлкают священным кнутом? И как лучше освободить чужеземных язычников, чем заставить их отрабатывать свои грехи?"
 tenet_slavery_name: "Вера через служение"
 tenet_spirit_journey_desc: "Мы можем отправиться в путешествие в Царство Духов с помощью правильных грибов и трав и познать истины о вселенной в процессе."
 tenet_spirit_journey_name: "Путешествие духа"
 tenet_sun_worship_alau_koev_religion_desc: "Врата Огня были закрыты дольше, чем мы можем помнить, и мир стал тёмным и холодным. Всё, что осталось нам, чтобы напомнить о силе Плеймао, — это солнце над нашими головами."
 tenet_sun_worship_alau_koev_religion_name: "Врата откроются"
 tenet_veneration_of_ohrasik_value_desc: "Почитание Охрасика"
 tenet_superiority_in_bloodshed_desc: "Аверсарианцы были мудры, ибо они учили нас, что тот, кто мог взять власть и имел волю уничтожить тех, кто ему противостоял, может носить мантию Чистейшего. Теперь аверсарианцы лежат слабыми, и настало наше время взять мантию для себя! И мы сделаем всё это за нашими масками, холодными металлическими лицами, обеспечивающими, чтобы душа внутри достигла той же чистоты, что и Первые Люди!"
 tenet_superiority_in_bloodshed_name: "Мандат чистоты"
 tenet_tax_nonbelievers_tahariat_desc: "Столетия войн как с [Concept('ritualism','ритуализмом')|E], так и с другими второстепенными верованиями [Concept('sarradon','Саррадона')|E] часто приводили к появлению больших общин неверующих на наших землях. Таким образом, налог «тахариат» оказался популярной альтернативой насильственному обращению, позволяя подвластным иноверцам платить дополнительную дань в обмен на правовую защиту и освобождение от военной службы."
 tenet_tax_nonbelievers_tahariat_name: "Тахариат"
 tenet_the_bloodright_desc: "Мы знаем только одну истину — наш народ превосходит других. Из-за отсутствия силы в их крови и отвержения Чистейшего ясно, что мы — истинное Человечество. Низшие существа — практически животные и заслуживают такого же обращения."
 tenet_the_bloodright_name: "Право крови"
 tenet_the_forgotten_desc: "Мы скрываем свои лица, чтобы показать свою преданность, добродетели смирения и тому, кто наблюдает и говорит..."
 tenet_the_forgotten_name: "Забытый"
 tenet_the_mistmothers_speak_desc: "Стрекочут громко громко говорят Туманные Матери и Туманные Матери люди видят действительно что да они приходят и да они пожирают и да да да мы следуем мы следуем мы следуем мы должны пировать и пировать и пировать среди крови тех, кто не слушает ибо пока плачут слёзы мы должны знать мы должны знать мы должны знать истину что есть истина что есть истина??? чего хочет Туманная Мать чего они хотят кто убил туманноотца кто разрушил мир кто разрушил мир кто разрушил мир кто кто кто кто кто"
 tenet_the_mistmothers_speak_name: "Туманные Матери говорят"
 tenet_the_sjalvolki_bloodright_desc: "Сьяволки, обращённые в аверсарианскую веру, понимают мир совершенно иначе, поэтому расовая ненависть их религиозных собратьев не была перенесена."
 tenet_the_sjalvolki_bloodright_name: "Право крови сьяволки"
 tenet_thysian_pure_desc: "Как и Святая Тиссия до нас, мы должны стремиться исцелить каждого, низкого или высокого, от любого излечимого недуга, который его поражает. Распространяя знания о предотвращающих болезни практиках Тиссии, таких как Водное Очищение Рук, мы также должны гарантировать, что никто не заболеет предотвратимыми недугами."
 tenet_thysian_pure_name: "Исцеляйте больных"
 tenet_true_blind_justice_desc: "Святой Дикайнос судил каждое дело, не взирая на положение обвиняемого, а лишь на справедливость его дела. Так же, как и он, мы должны гарантировать, что наши чувства никогда не ослепят нас перед истиной, чтобы мы никогда не осудили невинного."
 tenet_true_blind_justice_name: "Беспристрастное правосудие"
 tenet_true_purity_desc: "Катаритос сказал нам так:\n\n«Пусть твоё сердце будет свободным, твоё тело сильным, а всё твоё существо чистым».\n\nЧистое Тело — это то, что содержится в добром здравии по мере ваших возможностей. Чистый Ум — это тот, что открыт новым идеям и опыту и не бездумно отвергает всё чужеродное. И самое главное, Чистое Сердце — это то, что проявляет Доброту, Сострадание и Любовь ко всем существам."
 tenet_true_purity_name: "Чистые сердца"
 #tenet_unrelenting_faith_aruvasue_religion_desc: "Sar'muyr, the Sword Mother, is the greatest of all the angels. We must mimic her, and stand watch over the faith for all eternity."
 #tenet_unrelenting_faith_aruvasue_religion_name: "Way of the Sword Mother"
 tenet_unrelenting_faith_axiaotheism_desc: "Аксиотея сражалась, чтобы спасти этот мир, пока не испустила последний вздох. Она ни разу не дрогнула, ибо такова была её любовь ко всем нам, и мы также никогда не должны колебаться. Мы уже подвели её однажды, позволив злу восторжествовать, но долгая война против скверны Эшрея будет бушевать, пока вся Империя не будет отвоёвана во имя её законной императрицы."
 tenet_unrelenting_faith_axiaotheism_name: "Долгая война"
 tenet_waharai_desc: "Пока другие могут тщетно бороться за Его труп, мы знаем истину. Всевышний вознёсся с [Concept('aeras','Аэрасом')|E] и ждёт всех нас в райских небесах. Этот мир принадлежит нам, чтобы делать с ним то, что мы хотим, ибо никакие ограничения не помешают нам войти в Его приветливые объятия."
 tenet_waharai_name: "Вера в вознесение"
 tenet_wardenite_legalism_desc: "Необходимость соблюдать законы Первого Стража и удерживать Мёртвого Бога в заточении хорошо признаётся в нашей вере, хотя интерпретации того, как это сделать, могут сильно различаться. В результате вокруг нашего вероучения возникла богатая судебная традиция."
 tenet_call_of_the_void_desc: "Тёмные зовут! Сладкий шёпот небытия дарует нам силу и славу в их ужасной работе — лишь поедая слабую плоть этого мира, мы вознесёмся к пустой божественности."
 tenet_call_of_the_void_name: "Зов Бездны"
 tenet_call_of_the_void_value_desc: "Зов Бездны"
 tenet_female_magi_name: "Feminine Magic"
 tenet_female_magi_desc: "Followers of the faith know that only women make for proper [magi|E]."
 tenet_male_magi_name: "Masculine Magic"
 tenet_male_magi_desc: "It is the rightful place of man, not woman, to practice [Concept( 'magic', 'the gift' )|E]."
 tenet_visions_of_the_seeresses_name: "Visions of the Seeresses"
 tenet_visions_of_the_seeresses_desc: "[magic|E], the greatest and most terrible gift of the gods, is held in the sacred hands of female [magi|E] and their [Glossary('mysterious oracular orders','GH_AVERSARIAN_SEERESS_GLOSS')]. While they rule the world of the arcane, it is only natural that the men rule its secular counterpart."
 tenet_avid_necromancers_name: "Avid Necromancers"
 tenet_avid_necromancers_desc: "The faithful can see little difference between a [magi|E] and a [Concept( 'necromancy', 'necromancer' )|E]."
 tenet_dragon_cult_name: "Dragon Cult"
 tenet_dragon_cult_desc: "Followers of the faith worship no man, but instead the superior divinity of the (or a) [Concept('dragons','dragon')|E]. While such cults were once common across the [Concept('the_continent', 'Shattered Coast')|E], the destruction of the dragons by the early [Concept('aversaria','Aversarinas Aautokrata')|E] would greatly diminish their popularity — those cultists who continued their worship, however, only became more zealous as their numbers waned."
 tenet_sins_of_the_fathers_name: "Sins of the Fathers"
 tenet_sins_of_the_fathers_desc: "The First Empire is forgotten, the [Concept('aversaria','Second Empire')|E] shall soon follow. It is the fault of our dark and blighted ancestors for the [Concept('frodbrokna','death of the world')|E]. The faithful know that what little time existence has left must be spent seeking forgiveness from all who their ancestors wronged, excising their blood's sin through self-destruction, and losing themselves to pleasure and vice."
 tenet_its_a_mad_world_name: "It's a Mad World"
 tenet_its_a_mad_world_desc: "Is [magic|E] not akin to godliness? Was there not [Concept('aersanon','One')|E] before there was Two!? The sleeping watchers  of the world creak and break as the Great Work lies dead! Dead! Can we not learn the greatest of secrets? The powers beneath and below? There is only one way, ONE WAY! Through madness and screams, jubilation and sorrow, we shall learn the secrets that are hidden behind the veil of the unbroken mind!"
 doctrine_parameter_arcana_education_better_outcomes: "[children|E] tend to do better in the [arcana|E] [education|E]"

 tenet_all_patron_saint_parameters_name: " "
 tenet_all_patron_saint_parameters_desc: " "
 tenet_sky_worship_name: "Почитание неба"
 tenet_sky_worship_desc: "Нет места святее небесной тверди, что простирается бесконечно и наблюдает за нами вечно."

 ## Underworlders ##

 tenet_one_with_caverns_name: "Единство с пещерами"
 tenet_one_with_caverns_desc: "Последователи этого догмата знают глубины горы, как никакой чужаку."
 tenet_war_in_caverns_name: "Опасность в пещерах"
 tenet_war_in_caverns_desc: "Последователи рыщут в подземельях [Concept('mayikrata','Майикратии')|E], представляя постоянную опасность для чужаков."

 tenet_travelers_of_the_undersea_name: "Travelers of the Undersea"
 tenet_travelers_of_the_undersea_desc: "On swift-slooped boats and in the shimmer-shaded waves the followers of the kindly gods shall swiftly swim surely through soft shadowy shoals as the world twist-twirls around them."
 doctrine_parameter_mutation_guaranteed: "Children born to the faithful are touched by the deep waters — mutations from the sea are guaranteed at birth"
 tenet_gatebreakers_name: "Gatebreakers"
 tenet_gatebreakers_desc: "Mighty Djor split the mountain and broke the great gates that guarded the underworld, and wise Grular showed the brave where not to step and which secret words to speak to slip through the traps of the [Concept('aelfir','Aecaggir')|E]. Their greatest sons, sons like Graldar, Cormacan and Jorggamaggnar will prove themselves equally mighty, and restore the Krothaggi to an empire so great that no [Concept('twist_of_the_tunnels','foul magics')|E] will ever be able to undo its glory!"

 ####wardenite
 tenet_wardenite_legalism_name: "Варденитский легализм"
 tenet_way_of_the_skulltaker_desc: "Убийство — это такая прекрасная вещь. Каждая смерть уникальна по-своему. Принести в жертву овцу или курицу — это хорошо, но прекратить человеческую жизнь — значит преподнести богам нечто поистине незаменимое и уникальное. Может ли быть лучший способ поклоняться Чистейшему?"
 tenet_way_of_the_skulltaker_name: "Путь Собирателя Черепов"
 doctrine_parameter_unlock_raze_intent: "Unlocks the #V Terrorize#! [raid_intent|E]" 

 tenet_wayfathers_desc: "Вместо того чтобы посвящать себя богу, мы посвящаем себя самосовершенствованию и нашей способности достичь совершенства на избранном нами Пути."
 tenet_wayfathers_exclusivity_desc: "Путевой путь позволяет выбрать свою собственную судьбу, но только из тех вариантов, что даны знатью."
 tenet_wayfathers_exclusivity_name: "Стратифицированные Путевые пути"
 tenet_wayfathers_freedom_desc: "Каждый мужчина и женщина свободны выбрать свою собственную судьбу, и неважно, одобряет ли знать это или нет."
 tenet_wayfathers_freedom_name: "Свободные Путевые пути"
 tenet_wayfathers_name: "Жизненный Путь"
 tenet_what_lies_below_desc: "Те, кто лежит под волнами, не должны быть неуважаемы, ибо наши верующие знают, что их глаза следят за всеми, кто осмеливается бороздить волны."
 tenet_what_lies_below_name: "Что лежит внизу"
 tenet_will_of_flesh_desc: "Удовольствия жизни сами по себе являются смыслом, нет иной высшей цели, кроме как искать их и удовлетворять наши желания, утверждая нашу волю во всей её избыточности на [Concept('aeras','Аэрасе')|E]."
 tenet_will_of_flesh_name: "Воля плоти"
 tenet_worships_death_desc: "Когда ты отбрасываешь иллюзии, призванные ввести нас в заблуждение, становится ясно, что цель всей жизни — умереть. Какова ценность такой эфемерной и жалкой жизни перед величием смерти?"
 tenet_worships_death_name: "Поиск смерти"
 way_of_the_skull_taker_discount: "КАЛЕЧЬ. УБИВАЙ. ЖГИ."
 tenet_sea_tamers_name: "Наставничество Вароды"
 tenet_sea_tamers_desc: "Все, у кого есть сила покорить моря, могут связать своих духов с ним и воспитать дитя Вароды рядом с собой, чтобы быть навеки связанными с океанским приливом."
 # Magic Aspect Tenets

 tenet_water_rituals_name: "Почитание воде"
 tenet_water_rituals_desc: "Эта религия ценит [Concept('aspect_water','воду')|E] выше всех других форм магии, поэтому её последователи чаще имеют к ней большее сродство."

 tenet_fire_worship_name: "Почитание огня"
 tenet_fire_worship_desc: "Эта религия ценит [Concept('aspect_fire','огонь')|E] выше всех других форм магии, поэтому её последователи чаще имеют к ней большее сродство."

 tenet_ice_worship_name: "Почитание льду"
 tenet_ice_worship_desc: "Эта религия ценит [Concept('aspect_ice','льду')|E] выше всех других форм магии, поэтому её последователи чаще имеют к ней большее сродство."
 
 tenet_stone_worship_name: "Почитание камня"
 tenet_stone_worship_desc: "Эта религия ценит [Concept('aspect_stone','камень')|E] выше всех других форм магии, поэтому её последователи чаще имеют к ней большее сродство."

 tenet_dark_worship_name: "Почитание тьмы"
 tenet_dark_worship_desc: "Эта религия ценит [Concept('aspect_dark','тьму')|E] выше всех других форм магии, поэтому её последователи чаще имеют к ней большее сродство."

 tenet_dream_worship_name: "Почитание грёз"
 tenet_dream_worship_desc: "Эта религия ценит [Concept('aspect_dream','грёзы')|E] выше всех других форм магии, поэтому её последователи чаще имеют к ней большее сродство."

 tenet_blood_worship_name: "Почитание крови"
 tenet_blood_worship_desc: "Эта религия ценит [Concept('aspect_blood','кровь')|E] выше всех других форм магии, поэтому её последователи чаще имеют к ней большее сродство."

 tenet_nature_worship_name: "Почитание природы"
 tenet_nature_worship_desc: "Эта религия ценит [Concept('aspect_nature','природу')|E] выше всех других форм магии, поэтому её последователи чаще имеют к ней большее сродство."

 tenet_hymns_worship_name: "Почитание гимнов"
 tenet_hymns_worship_desc: "Эта религия ценит Гимны выше всех других форм магии, поэтому её последователи чаще имеют к ним большее сродство."

 tenet_death_worship_name: "Почитание смерти"
 tenet_death_worship_desc: "Эта религия ценит [Concept('aspect_death','смерть')|E] выше всех других форм магии, поэтому её последователи чаще имеют к ней большее сродство."

 tenet_time_worship_name: "Почитание времени"
 tenet_time_worship_desc: "Эта религия ценит время выше всех других форм магии, поэтому её последователи, как правило, больше склонны к нему."

 tenet_dawn_worship_name: "Почитание рассвету"
 tenet_dawn_worship_desc: "Эта религия ценит рассвет выше всех других форм магии, поэтому её последователи, как правило, больше склонны к нему."

 tenet_sand_worship_name: "Почитание песка"
 tenet_sand_worship_desc: "Эта религия ценит [Concept('aspect_sand','песок')|E] выше всех других форм магии, поэтому её последователи чаще имеют к ней большее сродство."

 tenet_metal_worship_name: "Почитание металла"
 tenet_metal_worship_desc: "Эта религия ценит [Concept('aspect_metal','металл')|E] выше всех других форм магии, поэтому её последователи чаще имеют к ней большее сродство."

 tenet_celestial_worship_name: "Celestial Worship"
 tenet_celestial_worship_desc: "This religion values [aspect_celestial] above all other forms of magic, followers therefore are more prone to have a greater affinity to it."

 tenet_great_steward_name: "Страж Срайдиана"
 tenet_great_steward_desc: "Усердие и тяжкий труд приближают нас к божественному. Наш долг — вечно стремиться в наших трудах."

 tenet_dakasan_purity_name: "Чистота Дакасана"
 tenet_dakasan_purity_desc: "Сила может быть достигнута только через чистоту себя. Мы должны очистить тело от всех привязанностей и пороков, чтобы быть цельным."

 tenet_dakasan_exhaustion_name: "Истощение Дакасана"
 tenet_dakasan_exhaustion_desc: "Сила может быть достигнута лишь истощением наших страстей без всяких ограничений — освобождая наши тела от их отвлекающего влияния."


