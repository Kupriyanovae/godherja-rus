 tenet_agionism_religion_syncretism_desc: "Святые агионизма могут и не быть центральными фигурами нашей мифологии, но они, несомненно, были добродетельными мужчинами и женщинами, чьи борьба и стремления созвучны нашим. Мы должны принять их как важную часть наших религиозных практик."
 tenet_agionism_religion_syncretism_name: "Агионистский синкретизм"

 tenet_alau_koev_religion_syncretism_desc: "Хотя тайны Огненных врат и не поглощают нас, в балладах алаукоевского предания можно найти мудрость."
 tenet_alau_koev_religion_syncretism_name: "Алаукоевский синкретизм"

 tenet_amsari_religion_syncretism_desc: "Хотя Пророк и Заоран не являются центральными фигурами в нашей собственной религии, они всё же пользуются высоким уважением и почитанием."
 tenet_amsari_religion_syncretism_name: "Амсарский синкретизм"

 tenet_arnazni_religion_syncretism_desc: "Боги горы Арназ вдохновили свой народ стать лучше, чем они были. Наши собственные боги в этом отношении ничем не отличаются."
 tenet_arnazni_religion_syncretism_name: "Арназнийский синкретизм"

 tenet_aruvasue_religion_syncretism_desc: "Даже если Арувас не наш бог, честь и гордость его последователей не могут быть отвергнуты. Мы должны стремиться отразить славу арувасуэнцев."
 tenet_aruvasue_religion_syncretism_name: "Арувасуэнский синкретизм"

 tenet_aversarinas_aagiokrata_religion_syncretism_desc: "Становится ясно, что, несмотря на наши различия, мы в некотором роде родственны [Concept('aversaria','аверсарианцам')|E], ибо Чистейший также является важной фигурой в наших религиозных верованиях."
 tenet_aversarinas_aagiokrata_religion_syncretism_name: "Аверсарианский синкретизм"
 tenet_aversarinas_aagiokrata_religion_syncretism_wardenism_religion: "Закон Афазарианцев"

 tenet_azakna_jakuungi_religion_syncretism_desc: "Хотя большинство обрядов Азакна Якуунги остаются для нас тайной, мы стремимся исполнять те немногие, что известны нашему народу."
 tenet_azakna_jakuungi_religion_syncretism_name: "Азакна-якуунгский синкретизм"

 tenet_dahala_religion_syncretism_desc: "Мы переняли далахское мировоззрение конкретной власти и теперь стремимся обрести её для себя."
 tenet_dahala_religion_syncretism_name: "Далахский синкретизм"

 tenet_sepattan_religion_syncretism_desc: "Мы переняли сепаттанское мировоззрение конкретной власти и теперь стремимся обрести её для себя."
 tenet_sepattan_religion_syncretism_name: "Сепаттанский синкретизм"

 tenet_eight_religion_syncretism_desc: "Агионистские ордена почитают всех святых, и каждая вера лишь выбирает сосредоточить своё внимание на конкретном из них."
 tenet_eight_religion_syncretism_name: "Агионистский синкретизм"

 tenet_graveright_religion_syncretism_desc: "Невозможно переоценить важность наших предков для нашей веры. Хотя они ушли, они всегда будут наблюдать за нами и направлять наши руки. В этом мы и мрогилпранцы видим друг в друге единомышленников."
 tenet_graveright_religion_syncretism_name: "Мрогилпранский синкретизм"

 tenet_iyrossi_religion_syncretism_desc: "Как у ийросов есть их Божественный Суд, так и наши боги восседают в суде над нашими действиями и нашей способностью следовать божественным законам."
 tenet_iyrossi_religion_syncretism_name: "Ийросский синкретизм"

 tenet_izaerto_bosar_religion_syncretism_desc: "Пернатый занимает особое место в нашем пантеоне, переправляя наших мертвецов в мир иной. Хотя мы не можем согласиться в вопросе происхождения мира, мы разделяем многие верования с изаэрто-бошарцами."
 tenet_izaerto_bosar_religion_syncretism_name: "Изаэрто-бошарский синкретизм"

 tenet_kemsar_religion_syncretism_amsari_religion: "Мир со старым врагом"
 tenet_kemsar_religion_syncretism_desc: "Инпиа, а иногда и утраченный Итеру, занимают видное место в наших собственных верованиях. Тем самым мы присоединяемся к кемсарцам в их рьяном поклонении и страхе перед Мёртвой Луной, которая может уничтожить нас всех."
 tenet_kemsar_religion_syncretism_name: "Кемсарский синкретизм"

 tenet_mahrator_religion_syncretism_desc: "Каэган может и не быть царём нашего пантеона, но Бог Коней всё ещё имеет большое влияние на наши сердца."
 tenet_mahrator_religion_syncretism_name: "Махраторский синкретизм"

 tenet_manats_religion_syncretism_desc: "Мы можем не поклоняться тем же богам, что и манаты, но в их [Concept('gena_tinngir','Священных текстах')|E] всё же заключена великая духовная ценность."
 tenet_manats_religion_syncretism_name: "Манатский синкретизм"

 tenet_lifepath_religion_syncretism_desc: "Жизненный путь — это увлекательная система, которая, очевидно, сыграла большую роль в успехе марочников и их стойкости перед двумя из самых грозных угроз [aeras|E]. Мы должны учиться у них, чтобы и мы могли стать сильными."
 tenet_lifepath_religion_syncretism_name: "Марочникский синкретизм"

 tenet_oltenic_religion_syncretism_desc: "Хотя они и не играют центральной роли в нашей вере, благодетельный Ольгон-тен и злобная Йеру-май всё же занимают место в нашем пантеоне, а обычай ношения масок также стал заметной особенностью наших практик."
 tenet_oltenic_religion_syncretism_name: "Ольтенский синкретизм"

 tenet_kikarsagi_religion_syncretism_desc: "Хотя Ардара и не играет центральной роли в нашей вере, мы все стремимся к ней, а обычай ношения масок также стал заметной особенностью наших практик."
 tenet_kikarsagi_religion_syncretism_name: "Кикарсагский синкретизм"

 tenet_partic_religion_syncretism_desc: "Вера партиков содержит много истин. Хотя мы никогда не будем так привязаны к друидам, как они, разве нельзя сказать, что наши боги также являются лишь эманациями Серфли?"
 tenet_partic_religion_syncretism_name: "Партикский синкретизм"

 tenet_ritualist_religion_syncretism_desc: "Огромное разнообразие ритуалистских сект ошеломляет. Переняв лишь несколько из их различных священных писаний и творчески переосмыслив Тысячу и Одну Ступень, наша вера вполне сходит за ещё один ритуалистский осколок."
 tenet_ritualist_religion_syncretism_name: "Ритуалистский синкретизм"
 tenet_ritualist_religion_syncretism_wardenism_religion: "Мир на небесах"

 tenet_seven_one_religion_syncretism_desc: "Святые ордена агионизма не противоречат нашим верованиям; напротив, мы принимаем их и приветствуем в наших рядах как братьев и сестёр по вере."
 tenet_seven_one_religion_syncretism_name: "Агионистский синкретизм"

 tenet_shyatan_religion_syncretism_desc: "Хотя их притязания на бессмертие сомнительны, учения шья'танского жречества ценны в нашем собственном поиске духовности."
 tenet_shyatan_religion_syncretism_name: "Шья'танский синкретизм"

 tenet_sjalvolki_hunt_desc: "Велос был охотником, и мы тоже! Только охотясь на сильнейших остатков легионов Пеклона, мы можем доказать богам, что остаёмся верны Делу, и доказать свою ценность как воины!"
 tenet_sjalvolki_hunt_name: "Сьялволькская охота"
 tenet_sjalvolki_religion_syncretism_name: "Сьялволькский синкретизм"
 tenet_sjalvolki_religion_syncretism_desc: "Сьялволки сильны и свирепы, они бросили вызов [Concept('aversaria','аверсарианцам')|E] и нанесли им множество мощных ударов. Переняв некоторых сьялволькских богов как своих, мы тоже можем обезопасить своё будущее."

 tenet_clanlander_religion_syncretism_name: "Клановый синкретизм"
 tenet_clanlander_religion_syncretism_desc: "Дети леса выстояли перед бесконечными гонениями, и мы тоже выстоим! Ни древние [magi|E] с непостижимыми именами, ни [Concept('aversaria','имперские')|E] тираны не разорвут союз между нами и живым лесом!"

 tenet_wardenism_religion_syncretism_desc: "Хотя это и не определяющая борьба нашей веры, в мире существует много зла, которое, очевидно, должно быть вызвано некой тёмной сущностью. Мы должны учиться у варденитов, чтобы и мы могли сохранить Столпы Добродетели, удерживающие Мёртвого Бога."
 tenet_wardenism_religion_syncretism_name: "Варденитский синкретизм"
 tenet_wardenism_religion_syncretism_ritualist_religion: "Мир на небесах"

 tenet_astiliak_religion_syncretism_desc: "Мы разделяем с астилиаками веру в духовную важность животных и погоды."
 tenet_astiliak_religion_syncretism_name: "Астилиакский синкретизм"

 tenet_cuthanagi_religion_syncretism_desc: "Мы, наряду с кутанагами, ищем руководства и убежища по милости вечно текущего и могучего Касирята, матери миллионов — хотя мы и не позволяем этому определять наше поклонение так, как они."
 tenet_cuthanagi_religion_syncretism_name: "Касирский синкретизм"

 tenet_ehatm_religion_syncretism_desc: "Хотя пути эхатмизма не являются нашими собственными, мы также поклоняемся Сестре-Матери. В наших сердцах мы знаем, что Корихот и Корикет наблюдают и направляют нас, когда мы странствуем по бесконечному морю."
 tenet_ehatm_religion_syncretism_name: "Крехеджадский синкретизм"

 tenet_marndeoticeni_religion_syncretism_desc: "Хотя он и не является нашим главным богом, Тшуек'а занимает место в нашем пантеоне."
 tenet_marndeoticeni_religion_syncretism_name: "Тшуеканистский синкретизм"

 tenet_redland_cults_religion_syncretism_desc: "Хотя мы можем следовать более стандартной религии, в народных сказаниях коренных красноземельцев есть некоторая ценность."
 tenet_redland_cults_religion_syncretism_name: "Красноземельный синкретизм"

 tenet_sunarwei_religion_syncretism_desc: "Сунарвейская метафора о том, что все живые существа являются осколками стекла единого целого, имеет большое значение для нашей веры."
 tenet_sunarwei_religion_syncretism_name: "Сунарвейский синкретизм"

 tenet_oulaupi_religion_syncretism_desc: "Хотя мы и не считаем одни и те же горы священными, мы научились придавать большое значение корням и кровле мира."
 tenet_oulaupi_religion_syncretism_name: "Улаупийский синкретизм"

 tenet_xaxbaxakanax_religion_syncretism_desc: "Эзотерические знания ксаксбахаканакцев сильно влияют на наши духовные верования, хотя большинство их учений всё ещё кажутся непостижимыми."
 tenet_xaxbaxakanax_religion_syncretism_name: "Ксаксбахаканакский синкретизм"

 tenet_dravidian_religion_syncretism_desc: "Наряду с нашими собственными религиозными практиками, мы также молимся великому совету Авастья-Махани."
 tenet_dravidian_religion_syncretism_name: "Авастья-маханический синкретизм"

 tenet_viyagaric_religion_syncretism_desc: "Мы верим, что все вещи в мире цикличны и что мир вознаграждает амбиции, подобно виягарическим верам Пиратского побережья."
 tenet_viyagaric_religion_syncretism_name: "Виягарический синкретизм"

 tenet_saielaian_religion_syncretism_desc: "Хотя мы не следуем богам сайелайцев, мы питаем глубокое почтение к нашим женщинам-предкам."
 tenet_saielaian_religion_syncretism_name: "Сайелайанский синкретизм"

 tenet_fourteen_heavenly_methods_religion_syncretism_desc: "Наряду с нашими собственными религиозными практиками, мы также молимся пантеону Катун-Кая."
 tenet_fourteen_heavenly_methods_religion_syncretism_name: "Кайцзяоский синкретизм"

 tenet_blackhand_religion_syncretism_desc: "Искатель Разума был очень мудр, хотя мы и не согласны с ним в вопросе наших богов."
 tenet_blackhand_religion_syncretism_name: "Чернорукий синкретизм"

 tenet_thixanonic_religion_syncretism_desc: "Тиксан был великим человеком, которого следует почитать, но его не следует ставить выше наших собственных богов."
 tenet_thixanonic_religion_syncretism_name: "Тиксанский синкретизм"

 tenet_apti_religion_syncretism_desc: "Хотя мы всё ещё находим их странными, мы переняли некоторые аспекты эксцентричных апти, стремясь лучше познать Сон и Грёзу."
 tenet_apti_religion_syncretism_name: "Аптийский синкретизм"

 tenet_ethowos_religion_syncretism_desc: "Хотя мы можем следовать более стандартной религии, в народных сказаниях пещерных племён есть некоторая ценность."
 tenet_ethowos_religion_syncretism_name: "Пещерноплеменной синкретизм"

 tenet_cnevobarthane_religion_syncretism_desc: "Истинные верующие нашей веры также обречены разделить Светлые Чертоги Куту Ремзны с теугомбрийскими верными."
 tenet_cnevobarthane_religion_syncretism_name: "Теугомбрийский синкретизм"

 tenet_gallieni_religion_syncretism_desc: "Как и галлиенийцы, мы верим, что судьба человечества в некоторой степени предопределена."
 tenet_gallieni_religion_syncretism_name: "Галлиенийский синкретизм"

 tenet_gestanwoder_religion_syncretism_desc: "Жестокие сущности, которых гестанводеры почитают как богов, существуют и заслуживают страха, хотя они и не являются по-настоящему божественными."
 tenet_gestanwoder_religion_syncretism_name: "Гестанводерский синкретизм"

 tenet_gethian_religion_syncretism_desc: "Наши боги судят человечество по тому, перевешивает ли добро его грехи, подобно Великому Судье гетцев."
 tenet_gethian_religion_syncretism_name: "Гетский синкретизм"

 tenet_islands_religion_syncretism_desc: "Хотя мы можем следовать более стандартной религии, в народных сказаниях островитян есть некоторая ценность."
 tenet_islands_religion_syncretism_name: "Островной синкретизм"

 tenet_kakarataki_religion_syncretism_desc: "Мы рассказываем истории о вечной войне между солнцем и луной, поведанные какаратакцами."
 tenet_kakarataki_religion_syncretism_name: "Какаратакский синкретизм"

 tenet_kardawai_religion_syncretism_desc: "Мы не видим ничего плохого в ритуальном каннибализме, практикуемом кардавайцами, и даже иногда сами участвуем в нём."
 tenet_kardawai_religion_syncretism_name: "Кардавайский синкретизм"

 tenet_namejisht_religion_syncretism_desc: "В свободе заключена великая духовная ценность, хотя поклоняться ей как единственному богу, как это делают намейжиштцы, — это чересчур."
 tenet_namejisht_religion_syncretism_name: "Намейжиштский синкретизм"

 tenet_orgarrd_religion_syncretism_desc: "Мы видим ужасы поверхностного мира и верим, что в оргардской вере в подземный рай можно найти много утешения."
 tenet_orgarrd_religion_syncretism_name: "Оргардский синкретизм"

 tenet_raider_religion_syncretism_desc: "Хотя мы можем следовать более стандартной религии, в народных сказаниях рейдеров есть некоторая ценность."
 tenet_raider_religion_syncretism_name: "Рейдерский синкретизм"

 tenet_salacad_religion_syncretism_desc: "Как и салакадцы, мы верим, что человечество защищено небом от земли."
 tenet_salacad_religion_syncretism_name: "Салакадистский синкретизм"

 tenet_samojitian_religion_syncretism_desc: "Хотя мы можем следовать более стандартной религии, в народных сказаниях самойтитов есть некоторая ценность."
 tenet_samojitian_religion_syncretism_name: "Самойтитский синкретизм"

 tenet_starvayrd_religion_syncretism_desc: "Мы верим, что потенциал человека можно найти в звёздах, подобно старвардцам."
 tenet_starvayrd_religion_syncretism_name: "Старвардский синкретизм"

 tenet_stodherrn_religion_syncretism_desc: "Мы видим себя хранителями мира, поддерживающими его природу, подобно стотхернам."
 tenet_stodherrn_religion_syncretism_name: "Стотхернский синкретизм"

 tenet_tulharsin_religion_syncretism_desc: "Мы верим, что на вершинах Тарсанид, которые почитают тулхарсинцы, находится нечто великое, просто, возможно, не божественное."
 tenet_tulharsin_religion_syncretism_name: "Тулхарсинский синкретизм"

 tenet_uakaklo_religion_syncretism_desc: "Уакаклохцы правы в своей вере в то, что Эрвал — это око, наблюдающее за человечеством, хотя их сложная система богов и демонов — совершенная бессмыслица."
 tenet_uakaklo_religion_syncretism_name: "Уакаклохский синкретизм"

 tenet_zaragett_religion_syncretism_desc: "Хотя мы и не следуем их вере, мы уделяем пристальное внимание морю и луне в надежде сравняться с зарагеттскими магами."
 tenet_zaragett_religion_syncretism_name: "Зарагеттский синкретизм"

 tenet_adabyssian_religion_syncretism_desc: "Золотые статуи Адабисса поистине внушают благоговение, и всё, что обитает в них, должно обладать великой силой, но не обязательно силой, способной создать мир."
 tenet_adabyssian_religion_syncretism_name: "Адабисский синкретизм"

 tenet_ahridar_religion_syncretism_desc: "Сказания об Охрасике достойны того, чтобы их рассказывали, хотя мы верим, что он был просто великим человеком, а не истинно божественным."
 tenet_ahridar_religion_syncretism_name: "Охрасикский синкретизм"

 tenet_anaanides_religion_syncretism_desc: "Хотя мы не верим в детали их религии, анааниды не заслуживают своей дурной репутации; похищение детей и воспитание их в праведности — это просто прагматично."
 tenet_anaanides_religion_syncretism_name: "Анаанидский синкретизм"

 tenet_hubarism_religion_syncretism_desc: "Великое Солнце наблюдает за нашими верными, как оно наблюдало за хубаритами с незапамятных времён."
 tenet_hubarism_religion_syncretism_name: "Хубаритский синкретизм"

 tenet_masaagnite_religion_syncretism_desc: "Мы верим, что разрушенные храмы Рожихлат-Мара должны почитаться, подобно масаагнитам."
 tenet_masaagnite_religion_syncretism_name: "Масаагнитский синкретизм"

 tenet_mogowai_religion_syncretism_desc: "Хотя мы и не почитаем Его как нашего единого бога, нас тем не менее трогает преданность моговайцев своему поиску."
 tenet_mogowai_religion_syncretism_name: "Моговайский синкретизм"

 tenet_quwazaw_religion_syncretism_desc: "Великие каменные статуи квазавитов поистине впечатляют, хотя и не совсем божественны."
 tenet_quwazaw_religion_syncretism_name: "Квазавийский синкретизм"

 tenet_saratan_religion_syncretism_desc: "Саратаны — великие звери, близкие к божественному, хотя саратаратины могут придавать им слишком большое значение."
 tenet_saratan_religion_syncretism_name: "Саратаратинский синкретизм"

 tenet_sheharddi_religion_syncretism_desc: "Мы верим, что Элой шехарддцев — это бог, но утверждать, что он единственный бог, — это перебор; он лишь один из многих."
 tenet_sheharddi_religion_syncretism_name: "Шехарддский синкретизм"

 tenet_thuantyan_sraidyan_religion_syncretism_desc: "Мы верим, что Вечные Хранители были смертными людьми, вознёсшимися с [aeras|E], как, должно быть, и наши Боги. Поэтому праведная жизнь также приведёт нас по их божественному пути."
 tenet_thuantyan_sraidyan_religion_syncretism_name: "Тхуантьян-срайдьянский синкретизм"

 tenet_sokaloma_religion_syncretism_desc: "Идея о том, что боги — это лишь коллективный дух их почитателей, неоспорима, но у нашей веры больше почитателей, чем у сокаломцев, поэтому наши боги реальнее, чем их."
 tenet_sokaloma_religion_syncretism_name: "Сокаломский синкретизм"

 tenet_yuagaug_religion_syncretism_desc: "Почитание плоти шуб-юагуагцами не так извращённо, как утверждают многие, хотя их бог Юагуаг — не более чем вымысел."
