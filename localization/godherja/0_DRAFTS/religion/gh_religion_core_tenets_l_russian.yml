 tenet_dummy_tenet_name: "ФИКТИВНЫЙ ДОГМАТ"
 tenet_dummy_tenet_desc: "ВЫ НЕ ДОЛЖНЫ ЭТОГО ВИДЕТЬ. ПОЖАЛУЙСТА, СООБЩИТЕ ОБ ЭТОМ КАК ОБ ОШИБКЕ!"
 tenet_all_patrin_saint_parameters: "Все параметры святого покровителя (отладка)"
 tenet_all_patrin_saint_parameters_desc: ""

 province_is_of_a_megalith_or_nature_faith_tt: "This [county|E] must follow a [faith|E] that believes in the significance of Megaliths or the [GetFaithDoctrine('tenet_sanctity_of_nature').GetBaseName]"
 
 tenet_stewards_road_name: "Stewards' Road"
 tenet_stewards_road_desc: "The wisdom of managers is as vast as the ocean, enough to occupy a lifetime of study and contemplation. This is precisely why followers must dedicate themselves wholeheartedly to learning, renouncing all worldly distractions."

 tenet_skull_mound_name: "Skull Mound"
 tenet_skull_mound_desc: "Commanders devoted to Bynjar often gather the bodies of enemy soldiers after a victorious battle. They sever the heads, pile them up along roads or near cities, and cover them with soil to form mounds. This practice serves both to intimidate their enemies and to display their military achievements. Followers of Bynjar believe this act constitutes the most sacred offering to [chiang_hsiang_shou|E]."

 tenet_thirteen_precepts_name: "Thirteen Military Texts"
 tenet_thirteen_precepts_desc: "The Thirteen Military Texts constitute the foundation of all Bynjar schools. A qualified Bynjar disciple must study these books thoroughly and comprehend the knowledge within, or else face the scorn of their peers."

 tenet_assist_the_world_and_save_the_people_name: "Worldly Duty"
 tenet_assist_the_world_and_save_the_people_desc: "The faithful dedicate themselves to the well-being of the world, striving for the peace and prosperity of all people. Corrupt officials who disregard the lives and suffering of the common people are our greatest adversaries."

 tenet_overthrow_the_mandate_of_heaven_name: "Revolutionary Zeal"
 tenet_overthrow_the_mandate_of_heaven_desc: "Nothing lasts forever, and what is outdated must be swept away. Yet our foes, decaying and impotent, will never stand idly by as Xin Xue's truth is taught to the people. Only through overwhelming force can we carry our doctrine to every corner of the land."

 tenet_eight_theories_name: "Ideological Struggle"
 tenet_eight_theories_desc: "Xin Xue comprises eight major schools of thought, each representing the application of its principles in different fields. These schools often organize grand debates to refine and develop their doctrines, ensuring that Xin Xue remains vibrant."