l_russian:
 # Agionist-Exclusive Tenets
 # LOC FOR GH VERSIONS OF VANILLA TENETS
 # Religion-Specific GH Tenet Names
 # Wardenite-Exclusive Doctrine Parameters 
 # Wardenite-Exclusive Tenets
 blind_justice_partition: "Ваша конфессия имеет догмат «Слепое правосудие»"
 only_one_agionist_tenet_trigger: "Вы можете выбрать только один догмат, следующий учениям конкретного Святого, для вашей [Concept('faith','конфессии')|E]"
 #tenet_adaptive_aruvasue_religion_desc: "Twelve dissenters radically shifted Aruvasue to its current form, daring to fight what they believed injust. It was not what divided them that defined them, but what united them; we should all follow their example."
 #tenet_adaptive_aruvasue_religion_name: "Brotherhood of Twelve"
 tenet_aeschraes_legacy_desc: "Когда Чистейший ходил среди нас как Эшрей, он показал нам, что нет такой высоты, до которой нельзя было бы вознестись, нет такой цены, которую нельзя было бы заплатить за победу, нет ничего настолько священного, чтобы не стоило пожертвовать этим — даже самим миром."
 tenet_aeschraes_legacy_name: "Горящий мир"
 tenet_the_long_war_name: "Долгая война"
 tenet_the_long_war_desc: "Аксиотея сражалась, чтобы спасти этот мир, пока не испустила последний вздох. Она ни разу не дрогнула, ибо так велика была её любовь ко всем нам, и мы тоже не должны колебаться. Мы уже однажды подвели её, позволив злу восторжествовать, но долгая война против скверны Эшрея будет бушевать до тех пор, пока вся Империя не будет возвращена во имя её законной Императрицы."
 tenet_axiaothea_legacy_name: "Долгая война"
 tenet_axiaothea_legacy_sjalvolki_religion: "Та, кто противостояла Разрушителю Миров"
 tenet_Amsari_desc: "Хотя наши правители — Кровь Пророка, Небеса даруют нам руководство, если правитель действительно достаточно добродетелен, чтобы вести наш народ. Однако когда правитель благословлён Небесами, он сталкивается с меньшими проблемами как со стороны двора, так и со стороны страны."
 tenet_Amsari_name: "Божественное право"
 #tenet_ancestor_worship_aruvasue_religion_desc: "Aruva Agat, the king of the mortal world, lives within the blood of all of us. Our bloodlines all owe themselves to Him, and we in turn owe a debt to our ancestors for maintaining His connection with us. It is an honour like no other to be joined to a god."
 #tenet_ancestor_worship_aruvasue_religion_name: "The Spirit of the King Within Us"
 tenet_aversarian_desc: "Природа нашего божественного наследия неоспорима. В силу этого мы имеем право навязывать свою волю тем, кто осмелится ей противостоять; так было с самого восхождения Человека и с самого восхождения нашего народа."
 tenet_aversarian_name: "Аверсарианское право рождения"
 tenet_bekashai_desc: "Всевышний был убит армией язычников, чьё неверие повергло Его последователей во тьму. За бесчисленные годы это великое преступление осталось неотмщённым. Это должно быть исправлено, и правосудие должно восторжествовать над Его убийцами."
 tenet_bekashai_name: "Поиск мести"
 tenet_blind_justice_desc: "Святой Дикайн судил каждое дело, не взирая на человека, но лишь на справедливость его дела. Подобно ему, мы также должны следить, чтобы наши чувства никогда не ослепляли нас от истины, и чтобы всякий, кого мы признаем виновным, никогда больше не осмелился грешить обманом."
 tenet_blind_justice_name: "Слепое правосудие"
 tenet_blood_purity_desc: "Кахарит сказал нам так:\n\n«Пусть сердце твоё будет свободным, тело сильным, а всё существо чистым».\n\nОднако язычники отвергают его учения, грешники оскверняют их. Все будут очищены, и те, кто отказывается от слов Кахарита по убеждению или по рождению, будут уничтожены, пока все не обретут святое совершенство."
 tenet_blood_purity_name: "Чистота крови"
 tenet_bulwark_desc: "Наш удел — защищать паству. Наши мечи бьются не ради славы, наши воины сражаются не за золото, но мы служим ради доблести, которую можно обрести в истинном мужестве."
 tenet_bulwark_name: "Мужество — Всегда"
 tenet_calystos_pure_desc: "Святой Калисто провозгласил, что все люди заслуживают свободы, и мы будем следовать его словам до тех пор, пока бич рабства не будет искоренён на [aeras|E]. Чтобы достичь этой цели, мы должны бороздить моря, как это делал Калисто, чтобы мы могли освобождать рабов везде, где они угнетены, и наносить удары рабовладельцам там, где они слабее всего. Все, кто выступает против рабства, будут приветствоваться в нашем деле, независимо от их происхождения и убеждений, ибо дело свободы универсально."
 tenet_calystos_pure_name: "Армада свободы"
 tenet_citizenship_through_service_desc: "Чистота не в крови, а в поступках. Разве нам судить грешника, когда грешник сражается за нас?"
 tenet_citizenship_through_service_name: "Гражданство через службу"
 tenet_cthonic_redoubts_quwazaw_desc: "Наш народ должен жить среди гор, где покоятся наши спящие боги. Возвышенные места священны, ибо зачем ещё богам было выбирать их местом своего упокоения?"
 tenet_cthonic_redoubts_quwazaw_name: "Спящие изваяния"
 #tenet_esotericism_aruvasue_religion_desc: "Ten thousand men and women have claimed that they have spoken for Aruvas, and none of them can be refuted. Each word of the Moon-Sun-King has been written and re-written by hundreds of faithful, and we are no closer to understanding He-Who-Is-One-But-Is-Three. There is peace in understanding that He cannot be understood."
 #tenet_esotericism_aruvasue_religion_name: "Ten Thousand Prophets"
 tenet_esotericism_aagiokratian_religion_name: "Мистические культы"
 tenet_games_for_gods_desc: "Чтобы явить наши добродетели, мы совершаем великие деяния во время наших паломничеств. Эти поступки, совершаемые под взором небес, не просто хорошее развлечение — они святы. Тем не менее, игры довольно забавно наблюдать."
 tenet_games_for_gods_name: "Игры для богов"
 tenet_gedeora_veneration_desc: "Каждая [Concept('gedeora','гедеора')|E] — это не проклятие, а послание самого божества. Мудрости тех, кто просветлён их объятиями, следует внимать, а тех, кто благословлён как дети, следует особенно уважать."
 tenet_gedeora_veneration_name: "Почитание гедеор"
 tenet_gedeora_veneration_ritualist_religion: "[GetBuilding('01_sophocos').GetName] велит миру меняться"
 #tenet_gruesome_festivals_aruvasue_religion_desc: "Armut Yan, the 'Snows of Blood', are the oldest tradition gifted to us by [ertomax|E]. These festivals see the unfaithful, whatever form they might take, be sacrificed in glorious manners in the name of the Moon-Sun-King."
 #tenet_gruesome_festivals_aruvasue_religion_name: "Armut Yan Festivals"
 tenet_gruesome_festivals_azakna_jakuungi_religion_desc: "Азакна Гуусаги, или Обряд Крови, является одним из восьмидесяти шести мистических ритуалов, практикуемых азаргами. Обряд включает жестокое убийство и истязание пленных язычников, чьи трупы выставляются вместе с надписями, описывающими их смерть, написанными их собственной кровью."
 tenet_gruesome_festivals_azakna_jakuungi_religion_name: "Азакна Гуусаги"
 #tenet_hedonistic_aruvasue_religion_desc: "Os Tandrakh often serves as a substitute for Os Kinjer in life, whereby the food and drink of a feast is seen as the spirit of Aruva Agat instead of any guest. It is impious to deny the divinity of the gifts placed upon the banqueting table."
 #tenet_hedonistic_aruvasue_religion_name: "Os Tandrakh"
 tenet_hero_ancestor_cult_desc: "Наш народ помнит героев островов — фигур, которые, несмотря на своё разное происхождение, объединены Милостью, дарованной им. Мы помним их всех ради надежды на то, что однажды наш народ снова будет благословлён."
 tenet_hero_ancestor_cult_name: "Герои-предки"
 tenet_hero_cult_desc: "Мы помним древних героев, тех, кто вознёсся далеко за пределы того, что мы можем достичь за свою жизнь, прокладывая путь, по которому мы можем следовать, чтобы узреть то, что мы знаем как божественное."
 tenet_hero_cult_name: "Культ героя"
 tenet_akkaradhammic_rituals_name: "Акхарадаммические ритуалы"
 tenet_akkaradhammic_rituals_desc: "Акхарадаммические ритуалы почитают Акхарадамму, Бессмертного Короля-лича, через тёмные обряды, использующие магию смерти и эфира для преодоления смертности. Последователи совершают кровавые церемонии и некромантические ритуалы, чтобы общаться с духами и владеть силой эфирного царства."
 tenet_high_bloodright_desc: "Только те, кто прошёл древние ритуалы, считаются достойными править, очищенными от всякой скверны."
 tenet_high_bloodright_name: "Ритуальная чистота"
 tenet_household_gods_name_hulawite_religion: "Венец Сияющего Солнца Разума"
 tenet_household_gods_desc_hulawite_religion: "Истинный праведный владыка назначен не ложным богом или иррациональным вероучением, а своей собственной непобедимой добродетелью. Давайте следовать рациональности и вложим все необходимые полномочия в руки одного благого деспота, который будет посредничать между ссорящимися жрецами и искать справедливость превыше всего."
 tenet_veneration_of_ohrasik_desc: "Охрасик продолжает направлять праведных через свои реинкарнации, ведя борьбу против злых слуг [Concept('aervalr','Эрвала')|E] спустя долгое время после того, как его изначальная форма покинула [aeras|E]."
 tenet_veneration_of_ohrasik_name: "Почитание Охрасика"
 tenet_higher_purity_desc: "Недостаточно быть превосходным, мы должны стремиться очистить себя от скверны везде, где её найдём. Ничто не свято."
 tenet_higher_purity_name: "Поиск чистоты"
 tenet_holy_river_desc: "Мы поклоняемся священной реке, чей прилив и отлив приносит нам жизнь и смерть."
 tenet_holy_river_name: "Почитание реки"
 tenet_knowledge_veneration_name: "Почитание знания"
 tenet_knowledge_veneration_desc: "Знание — это инструмент вознесения. Чем больше знаний накапливает человек, тем ближе он к Сарвату и другим богам."
 tenet_inner_journey_shyatan_religion_desc: "Ванель Шья'та вынес бесчисленные ужасы, чтобы понять цикл времени, и только через него мы знаем, как освободиться. Быть частью его пути — это привилегия."
 tenet_inner_journey_shyatan_religion_name: "Испытания Шья'ты"
 tenet_legalistic_diversity_desc: "Множество правовых традиций, расцветших в нашей вере, — это не слабость, а сила. Мы поощряем дискуссии и разнообразие мыслей, и хотя иногда это может приводить к путанице и жарким спорам, в конечном счёте это оставляет нам правовой корпус, практически не имеющий себе равных в мире."
 tenet_legalistic_diversity_name: "Правовое разнообразие"
 tenet_magi_slayers_desc: "Не может быть пощады для тех, кто владеет украденной силой. Они должны быть уничтожены везде, где их найдут."
 tenet_magi_slayers_fogeater_religion: "Заткните крик"
 tenet_magi_slayers_gestanwoder_religion: "Подражайте Ур'Фарум'Бартуму, Князю Кровавого Пира"
 tenet_magi_slayers_kardawai_religion: "Пиры для Кардвена"
 tenet_magi_slayers_mogowai_religion: "Сокрушите узурпаторов"
 tenet_magi_slayers_name: "Истребители [Concept('magi','магов')|E]"
 tenet_magi_slayers_samojitian_religion: "Убейте тиранов"
 tenet_marefai_desc: "Хотя мы все ищем Его местонахождение, мы принимаем свободу толковать Его веру так, как каждый хочет, и принимаем широкое разнообразие практик. В конце концов, если бы Он не хотел, чтобы мы были разными, Он не создал бы нас такими."
 tenet_marefai_name: "Разнообразие толкований"
 tenet_mogowai_search_desc: "Давным-давно Всевышний был убит неверующими, Его тело унесено в таинственное место. Мы ищем это место, ибо когда Всевышний восстанет из своей вновь обретённой могилы, всё снова будет хорошо."
 tenet_mogowai_search_name: "Великий поиск"
 tenet_natural_primitivism_anaanides_religion: "Простая чистота рая Анаана"
 tenet_natural_primitivism_aversarinas_aagiokrata_religion: "Святые тела чистых мужчин и женщин"
 tenet_natural_primitivism_wardenism_religion: "И законные не будут иметь богатства"
 tenet_nitsafai_desc: "Со времени Его смерти истинные пути Его веры были извращены и искажены в угоду мелким владыкам. Прежде чем поиск Его гробницы может быть возобновлён, Его последователи должны быть возвращены к истинному пути, ибо позволение еретикам обнаружить Его местонахождение может быть катастрофическим."
 tenet_nitsafai_name: "Восстановление"
 tenet_philanthrios_corrupt_desc: "Святой Филантр учил отдавать нуждающимся, и кто более нуждающийся, чем мы, бескорыстные блюстители его воли? Если грешники и язычники слишком развращены жадностью, чтобы добровольно жертвовать нашему делу, мы должны спасти их от их развращения, принудительно изымая их богатства."
 tenet_philanthrios_corrupt_name: "Принудительные пожертвования"
 tenet_philanthrios_pure_desc: "Святой Филантр учил нас отдавать нуждающимся, не пользоваться ненужной роскошью и не копить излишних богатств. Таким образом, чтобы истинно следовать его учению, мы не должны облагать налогом беднейших, но щедро отдавать им наши собранные пожертвования."
 tenet_philanthrios_pure_name: "Филантросианская щедрость"
 tenet_pursuit_of_power_adabyssian_religion: "Борьба за благосклонность Золотого города"
 tenet_quest_for_life_desc: "Исцеление должно быть совершенным, жизнь должна быть дана святым. Как мы можем познать пределы наших тел или опасность того, что их мучит, если мы не продвигаем физические науки? Если язычники и грешники должны быть подопытными, они могут знать, что их смерть свята, ибо она спасает жизни сотен благочестивых."
 tenet_quest_for_life_name: "Поиск жизни"
 tenet_raider_cult_desc: "Для последователей нашего вероучения мораль и власть преходящи. Мы должны брать то, что наше, ничто не свято."
 tenet_raider_cult_name: "Культ рейдеров"
 tenet_reincarnation_aruvasue_religion_desc: "Дух [ertomax|E] живёт в душах верных. В самый тёмный час благословение рвения и крови проявится, и Эртомакс возродится."
 tenet_reincarnation_aruvasue_religion_name: "Возвращение Эртомакса"
 tenet_religious_legal_pronouncements: "Религиозный закон"
 tenet_religious_legal_pronouncements_alau_koev_religion_desc: "Отец Огня даровал нам жизнь,\n\nОн построил наши царства через борьбу,\n\nИ взамен я отдаю свою жизнь,\n\nЗаконам нашего Отца."
 tenet_religious_legal_pronouncements_alau_koev_religion_name: "Балладный закон"
 tenet_religious_legal_pronouncements_mogowai_religion_name: "Гимнический закон"
 tenet_ritual_cannibalism_izaerto_bosar_religion_desc: "Пустота заберёт наши души, если мы не будем действовать быстро. Мёртвые должны быть поглощены до того, как Владыки смогут украсть их."
 tenet_ritual_cannibalism_izaerto_bosar_religion_name: "Беспёрый пир"
 tenet_ritual_hospitality_aruvasue_religion_desc: "Пиршествовать — значит почитать Аруваса во [Concept('aspects_of_aruvas','всех его ипостасях')|E], а проявлять гостеприимство — значит пригласить искру [Glossary('Арува Агата','GH_ARUVA_AGAT_GLOSS')] в свой очаг и дом. Давайте чествовать почётного гостя как воплощение божественности, коим он является, и воздавать должные почести источнику творения."
 tenet_ritual_hospitality_aruvasue_religion_name: "Пиры для Аруваса"
 tenet_ritual_hospitality_mogowai_religion: "Помощь искателям"
 tenet_sansia_corrupt_desc: "Через страдания, жертвы и боль дух укрепляется и приближается к Чистейшему. Таким образом, мы должны очищать наши тела и души через боль, а также тела язычников, которые отказываются принять благодать Святых."
 tenet_sansia_corrupt_name: "Сила через страдание"
 tenet_sansia_pure_desc: "Через дисциплину, сосредоточенность и преданность защите невинных дух укрепляется и приближается к Чистейшему. Таким образом, мы должны очищать наши души через медитацию, тренировки и добрые дела, чтобы быть готовыми следовать примеру Сансии и пожертвовать собой ради невинных, если возникнет необходимость."
 tenet_sansia_pure_name: "Спасение через дисциплину"
 tenet_seaborne_desc: "Нет ни до, ни после, мы восстаём из соли и однажды вернёмся в соль, чтобы быть унесёнными с берега на берег, ведомые бесконечным приливом."
 tenet_seaborne_name: "Морские"
 tenet_spread_the_light_name: "Распространение света"
 tenet_spread_the_light_desc: "Наш долг — распространять свет Святых и Аверсерии среди низших народов мира, чтобы они тоже могли освободиться от скверны. Таким образом, мы должны проявлять непоколебимую поддержку нашим братьям и сёстрам в Святых Орденах, которые посвятили свои жизни выполнению этой божественной миссии."
 tenet_honor_the_saints_name: "Почитание Святых"
 tenet_honor_the_saints_desc: "Почитая Святых и следуя их примеру, мы можем освободиться от скверны внутри нас."
 tenet_sky_burials_izaerto_bosar_religion_desc: "Пернатый ждёт, чтобы забрать нас всех в рай. Мы должны лишь позволить нашим телам быть поглощёнными его слугами, а нашим душам — освободиться."
 tenet_sky_burials_izaerto_bosar_religion_name: "Дань Пернатому"
 tenet_slavery_desc: "Что может быть более освобождающим, чем труд? Что может лучше освободить работника, чем благочестивое пение и выкрикивание псалмов и гимнов, пока они щёлкают святым кнутом? И как лучше освободить чужеземных язычников, чем убедиться, что они отрабатывают свои грехи?"
 tenet_slavery_name: "Вера через служение"
 tenet_spirit_journey_desc: "Мы можем отправляться в путешествия в Царство Духов с помощью правильных грибов и трав и познавать истины о вселенной в процессе."
 tenet_spirit_journey_name: "Путешествие духа"
 tenet_sun_worship_alau_koev_religion_desc: "Огненные врата закрыты дольше, чем мы можем помнить, и мир стал тёмным и холодным. Всё, что напоминает нам о силе Плеймао, — это солнце над нашими головами."
 tenet_sun_worship_alau_koev_religion_name: "Врата откроются"
 tenet_veneration_of_ohrasik_value_desc: "Почитание Охрасика"
 tenet_superiority_in_bloodshed_desc: "[Concept('aversaria','Аверсарианцы')|E] были мудры, ибо они научили нас, что тот, кто может взять власть и имеет волю уничтожить тех, кто противостоит им, может носить мантию Чистейшего. Теперь аверсарианцы слабы, и наше время взять мантию на себя! И мы сделаем это всё, скрываясь за нашими масками, холодные металлические лица которых гарантируют, что душа внутри достигнет той же чистоты, что и Первые люди!"
 tenet_superiority_in_bloodshed_name: "Мандат чистоты"
 tenet_tax_nonbelievers_tahariat_desc: "Столетия войны как с [Concept('ritualism','ритуалистами')|E], так и с другими малыми верами [Concept('sarradon','Саррадона')|E] часто приводили к появлению больших общин неверующих на наших землях. Таким образом, налог Тахариат оказался популярной альтернативой принудительному обращению, позволяя подвластным неверным платить дополнительную дань в обмен на правовую защиту и освобождение от военной службы."
 tenet_tax_nonbelievers_tahariat_name: "Тахариат"
 tenet_the_bloodright_desc: "Мы знаем только одну истину — наш народ превосходит других. Из-за отсутствия силы в их крови и отвержения Чистейшего ясно, что мы — истинное Человечество. Низшие существа — почти животные и заслуживают обращения как таковые."
 tenet_the_bloodright_name: "Кровное право"
 tenet_the_forgotten_desc: "Мы скрываем наши лица, чтобы показать нашу преданность, добродетели смирения и тому, кто наблюдает и говорит..."
 tenet_the_forgotten_name: "Забытый"
 tenet_the_mistmothers_speak_desc: "Стрекотание громко-громко говорит о туманной матери и туманных людях, видит действительно, что да, они приходят, и да, они пожирают, и да, да, да, мы следуем, мы следуем, мы следуем, мы должны пировать и пировать, и пировать среди крови тех, кто не слушает, ибо, пока мы плачем и рвём, мы должны знать, мы должны знать, мы должны знать правду, что есть правда, что есть правда??? что спрашивает туманная мать, спросить, мы хотим спросить, что им нужно, что они хотят, кто убил туманного отца, кто разрушил мир, кто разрушил мир, кто разрушил мир, кто, кто, кто, кто, кто"
 tenet_the_mistmothers_speak_name: "Туманная мать говорит"
 tenet_the_sjalvolki_bloodright_desc: "Сьялволки, обратившиеся в [Concept('aversaria','аверсарианскую')|E] веру, понимают мир совсем иначе, поэтому расовая ненависть их религиозных собратьев не была перенесена."
 tenet_the_sjalvolki_bloodright_name: "Сьялволькское кровное право"
 tenet_thysian_pure_desc: "Как святая Тисия делала до нас, мы должны стремиться исцелять всех — низких и высоких — от любых излечимых недугов, которые их мучат. Распространяя знания о практиках Тисии, предотвращающих болезни, таких как Водное очищение рук, мы также должны следить, чтобы никто не заболел предотвратимыми недугами."
 tenet_thysian_pure_name: "Исцеление больных"
 tenet_true_blind_justice_desc: "Святой Дикайн судил каждое дело, не взирая на положение обвиняемого, но лишь на справедливость его дела. Подобно ему, мы также должны следить, чтобы наши чувства никогда не ослепляли нас от истины, и чтобы мы никогда не осуждали невиновных несправедливо."
 tenet_true_blind_justice_name: "Беспристрастное правосудие"
 tenet_true_purity_desc: "Кахарит сказал нам так:\n\n«Пусть сердце твоё будет свободным, тело сильным, а всё существо чистым».\n\nЧистое тело — это тело, поддерживаемое в добром здравии по мере сил. Чистый разум — это разум, открытый новым идеям и опыту, который не отвергает бездумно всё чуждое. И самое главное — чистое сердце, которое проявляет доброту, сострадание и любовь ко всем существам."
 tenet_true_purity_name: "Чистые сердца"
 #tenet_unrelenting_faith_aruvasue_religion_desc: "Sar'muyr, the Sword Mother, is the greatest of all the angels. We must mimic her, and stand watch over the faith for all eternity."
 #tenet_unrelenting_faith_aruvasue_religion_name: "Way of the Sword Mother"
 tenet_unrelenting_faith_axiaotheism_desc: "Аксиотея сражалась, чтобы спасти этот мир, пока не испустила последний вздох. Она ни разу не дрогнула, ибо так велика была её любовь ко всем нам, и мы тоже не должны колебаться. Мы уже однажды подвели её, позволив злу восторжествовать, но долгая война против скверны Эшрея будет бушевать до тех пор, пока вся Империя не будет возвращена во имя её законной Императрицы."
 tenet_unrelenting_faith_axiaotheism_name: "Долгая война"
 tenet_waharai_desc: "Пока другие могут тщетно бороться за Его тело, мы знаем истину. Всевышний вознёсся с [Concept('aeras','Эраса')|E] и ждёт нас всех в небесном раю. Этот мир наш, чтобы делать с ним что хотим, ибо ничто не преградит нам путь к Его приветливым объятиям."
 tenet_waharai_name: "Вера в вознесение"
 tenet_wardenite_legalism_desc: "Необходимость соблюдать законы Первого Вардена и удерживать Мёртвого Бога в темнице хорошо осознаётся в нашей вере, хотя толкования того, как это делать, могут сильно различаться. В результате вокруг нашего вероучения возникла богатая судебная традиция."
 tenet_call_of_the_void_desc: "Тёмные зовут! Сладкий шёпот забвения даст нам силу и славу в их страшном деле — лишь пожрав слабую плоть этого мира, мы вознесёмся к пустой божественности."
 tenet_call_of_the_void_name: "Зов Пустоты"
 tenet_call_of_the_void_value_desc: "Зов Пустоты"
 tenet_female_magi_name: "Женская магия"
 tenet_female_magi_desc: "Последователи веры знают, что только женщины могут быть настоящими [Concept('magi','магами')|E]."
 tenet_male_magi_name: "Мужская магия"
 tenet_male_magi_desc: "По праву мужчина, а не женщина, должен практиковать [Concept('magic','дар')|E]."
 tenet_visions_of_the_seeresses_name: "Видения прорицательниц"
 tenet_visions_of_the_seeresses_desc: "[magic|E], величайший и самый ужасный дар богов, находится в священных руках женщин-[Concept('magi','магов')|E] и их [Glossary('таинственных оракульских орденов','GH_AVERSARIAN_SEERESS_GLOSS')]. Пока они правят миром тайных искусств, вполне естественно, что мужчины правят его светской частью."
 tenet_avid_necromancers_name: "Рьяные некроманты"
 tenet_avid_necromancers_desc: "Верные не видят особой разницы между [Concept('magi','магом')|E] и [Concept('necromancy','некромантом')|E]."
 tenet_dragon_cult_name: "Культ Дракона"
 tenet_dragon_cult_desc: "Последователи веры поклоняются не человеку, а превосходному божеству [Concept('dragons','дракона')|E]. Хотя такие культы когда-то были обычны на [Concept('the_continent','Расколотом побережье')|E], уничтожение драконов ранней [Concept('aversaria','Аверсарианской Аавтократией')|E] значительно уменьшило их популярность — однако те культисты, которые продолжили своё поклонение, стали только более ревностными по мере того, как их число убывало."
 tenet_sins_of_the_fathers_name: "Грехи отцов"
 tenet_sins_of_the_fathers_desc: "Первая Империя забыта, [Concept('aversaria','Вторая Империя')|E] скоро последует. Это вина наших тёмных и проклятых предков за [Concept('frodbrokna','смерть мира')|E]. Верные знают, что те немногие мгновения, что остались у существования, должны быть потрачены на поиски прощения у всех, кому их предки причинили зло, искоренение греха своей крови через саморазрушение и потерю себя в удовольствиях и пороках."
 tenet_its_a_mad_world_name: "Безумный мир"
 tenet_its_a_mad_world_desc: "Разве [magic|E1] не сродни божественности? Разве не было [Concept('aersanon','Одного')|E] прежде, чем появились Двое!? Спящие стражи мира скрипят и ломаются, когда Великое Дело лежит мёртвым! Мёртвым! Не можем ли мы постичь величайшие тайны? Силы внизу и вверху? Есть только один путь, ОДИН ПУТЬ! Через безумие и крики, ликование и скорбь, мы познаем тайны, скрытые за завесой неповреждённого разума!"
 doctrine_parameter_arcana_education_better_outcomes: "[Concept('children','Дети')|E] обычно преуспевают в [Concept('education','обучении')|E] [Concept('arcana','аркане')|E]"

 tenet_all_patron_saint_parameters_name: " "
 tenet_all_patron_saint_parameters_desc: " "
 tenet_sky_worship_name: "Почитание неба"
 tenet_sky_worship_desc: "Нет места святее, чем небесный свод, который простирается бесконечно и вечно наблюдает за нами."

 ## Underworlders ##

 tenet_one_with_caverns_name: "Единый с пещерами"
 tenet_one_with_caverns_desc: "Последователи этого учения знают глубины гор, как никто из чужаков."
 tenet_war_in_caverns_name: "Опасность в пещерах"
 tenet_war_in_caverns_desc: "Приверженцы рыщут под землёй [Concept('mayikrata','Майикратии')|E], представляя собой постоянную опасность для чужаков."

 tenet_travelers_of_the_undersea_name: "Странники подводного мира"
 tenet_travelers_of_the_undersea_desc: "На быстрых лодках и в мерцающих волнах последователи добрых богов будут быстро и уверенно плыть сквозь мягкие тенистые отмели, пока мир кружится вокруг них."
 doctrine_parameter_mutation_guaranteed: "Дети, рождённые у верных, отмечены глубокими водами — мутации моря гарантированы при рождении"
 tenet_gatebreakers_name: "Разрушители врат"
 tenet_gatebreakers_desc: "Могучий Джор расколол гору и сломал великие врата, что охраняли подземный мир, а мудрый Грулар показал смелым, куда не ступать и какие тайные слова говорить, чтобы проскользнуть через ловушки [Concept('aelfir','Аэкаггиров')|E]. Их величайшие сыновья, такие как Гралдар, Кормакан и Йорггамаггнар, докажут, что столь же могучи, и восстановят Кротхаггскую империю до такого величия, что никакие [Concept('twist_of_the_tunnels','злые чары')|E] не смогут уничтожить её славу!"

 ####wardenite
 tenet_wardenite_legalism_name: "Варденитский легализм"
 tenet_way_of_the_skulltaker_desc: "Убийство — такая прекрасная вещь. Каждая смерть уникальна по-своему. Принести в жертву овцу или курицу — это хорошо, но лишить жизни человека — значит преподнести богам нечто поистине незаменимое и уникальное. Может ли быть лучший способ поклоняться Чистейшему?"
 tenet_way_of_the_skulltaker_name: "Путь забирающего черепа"
 doctrine_parameter_unlock_raze_intent: "Открывает [Concept('raid_intent', 'цель налета')|E] «#V Терроризировать#!»"

 tenet_wayfathers_desc: "Вместо того чтобы посвящать себя богу, мы посвящаем себя самосовершенствованию и нашей способности достичь совершенства на избранном Пути."
 tenet_wayfathers_exclusivity_desc: "Путь позволяет человеку выбрать свою судьбу, но только из вариантов, предложенных знатью."
 tenet_wayfathers_exclusivity_name: "Стратифицированные пути"
 tenet_wayfathers_freedom_desc: "Каждый мужчина и женщина свободны выбирать свою судьбу, и одобряет ли это знать, их не касается."
 tenet_wayfathers_freedom_name: "Свободные пути"
 tenet_wayfathers_name: "Жизненный путь"
 tenet_what_lies_below_desc: "Те, кто лежит под волнами, не должны быть оскорблены, ибо наши верующие знают, что их глаза следят за всеми, кто осмелится бороздить волны."
 tenet_what_lies_below_name: "То, что лежит внизу"
 tenet_will_of_flesh_desc: "Удовольствия жизни — это смысл сам по себе, нет другой высшей цели, кроме как искать их и удовлетворять наши желания, утверждать нашу волю во всех её излишествах на [Concept('aeras','Эрасе')|E]."
 tenet_will_of_flesh_name: "Воля плоти"
 tenet_worships_death_desc: "Когда вы отбрасываете иллюзии, созданные для того, чтобы ввести нас в заблуждение, становится ясно, что цель всей жизни — смерть. Какова ценность такого эфемерного и жалкого существования перед лицом смерти?"
 tenet_worships_death_name: "Поиск смерти"
 way_of_the_skull_taker_discount: "КАЛЕЧИТЬ. УБИВАТЬ. ЖЕЧЬ."
 tenet_sea_tamers_name: "Наставление Вароды"
 tenet_sea_tamers_desc: "Все, у кого достаточно силы, чтобы покорить моря, могут связать свои духи с ними и воспитать дитя Вароды рядом с собой, чтобы они навсегда были связаны с океанским приливом."
 # Magic Aspect Tenets

 tenet_water_rituals_name: "Почитание воды"
 tenet_water_rituals_desc: "Эта религия ценит [Concept('aspect_water','воду'|E] выше всех других форм магии, поэтому последователи более склонны иметь большую предрасположенность к ней."

 tenet_fire_worship_name: "Почитание огня"
 tenet_fire_worship_desc: "Эта религия ценит [Concept('aspect_fire','огонь')|E] выше всех других форм магии, поэтому последователи более склонны иметь большую предрасположенность к ней."

 tenet_ice_worship_name: "Почитание льда"
 tenet_ice_worship_desc: "Эта религия ценит [Concept('aspect_ice','лёд')|E] выше всех других форм магии, поэтому последователи более склонны иметь большую предрасположенность к ней."

