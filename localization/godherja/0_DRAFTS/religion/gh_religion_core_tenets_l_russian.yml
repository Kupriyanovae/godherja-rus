 tenet_sand_worship_name: "Почитание песка"
 tenet_sand_worship_desc: "Эта религия ценит [Concept('aspect_sand','песок')|E] выше всех других форм магии, поэтому последователи более склонны иметь большую предрасположенность к ней."

 tenet_metal_worship_name: "Почитание металла"
 tenet_metal_worship_desc: "Эта религия ценит [Concept('aspect_metal','металл')|E] выше всех других форм магии, поэтому последователи более склонны иметь большую предрасположенность к ней."

 tenet_celestial_worship_name: "Почитание небес"
 tenet_celestial_worship_desc: "Эта религия ценит [Concept('aspect_celestial','небеса')|E] выше всех других форм магии, поэтому последователи более склонны иметь большую предрасположенность к ней."

 tenet_great_steward_name: "Срайдьянское попечительство"
 tenet_great_steward_desc: "Прилежание и усердный труд приближают нас к божественному. Наш долг — всегда стремиться в наших трудах."

 tenet_dakasan_purity_name: "Дакасанская чистота"
 tenet_dakasan_purity_desc: "Власть может быть достигнута только через чистоту себя. Мы должны очистить тело от всех привязанностей и пороков, чтобы стать целостными."

 tenet_dakasan_exhaustion_name: "Дакасанское истощение"
 tenet_dakasan_exhaustion_desc: "Власть может быть достигнута только путём неограниченного истощения наших страстей — освобождения наших тел от их отвлекающего влияния."


