 zaldrigas_religion_desc: "Сагадавийцы обычно исповедуют исконную веру Залдригас, или культ змея. Они верят, что в далёком прошлом великий крылатый змей Балабалос поглотил старый мир и его народ, но через девять дней новый мир вырвался на свободу, очищенный небесной благодатью Балабаласа. Говорят, что это травматическое событие было лишь одним из многих, и цикл перерождения будет продолжаться вечно. В молитве почитатели Залдригаса возносят благодарность Балабалосу, но также признают множество духов, богов и меньших божеств, рождённых из великого змея."

