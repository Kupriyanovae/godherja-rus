 hulawite_religion_desc: "Турсийя, буквально «Дикость», — общее название рационалистических и философских течений, возникших в придворной и интеллектуальной среде [Concept('sarradon','Саррадона')|E] в VIII веке. Их объединяют строго рационалистическое понимание [Concept('aeras','Эраса')|E], непоколебимая вера в силу человеческой логики и разума, а также открытое неприятие варденизма и ритуализма. Некоторые турсийские течения дошли до исповедания подлинного атеизма, чем вызвали скандал и осуждение на всём континенте. Другие же обратились к почитанию святых и божеств, связанных с просвещением и разумом."







