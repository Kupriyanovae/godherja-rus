 hulawite_religion_desc: "Буквально означающее «Дикость», Турсийя является обобщающим термином для ряда рационалистических и философских движений, возникших при дворах и в интеллектуальной жизни Саррадона VIII века. Они основаны на строгом рационалистическом понимании [Concept('aeras','Эраса')|E], непоколебимой вере в силу человеческой логики и разума и явном отвержении как варденизма, так и ритуализма. Некоторые турсийские секты зашли так далеко, что исповедуют истинный атеизм, навлекая на себя скандалы и дурную славу по всему континенту. Другие обратились к почитанию святых или божеств, связанных с просвещением и разумом."

