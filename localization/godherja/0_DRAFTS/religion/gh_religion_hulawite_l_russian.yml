 hulawite: "Хулавитск"
 hulawite_adj: "Хулавитизм"
 hulawite_adherent: "Хулавит"
 hulawite_adherent_plural: "Хулавиты"
 hulawite_desc: "Рационалистическая и эмпирическая философия, основанная Адаром Нибом, печально известным своей вспыльчивостью учёным и философом периода расцвета мамурских дворов конца VIII века. Первоначально работая в рамках интеллектуально свободной формы традиционалистского варденизма, [Concept('adaric_philosophy','теории Адара')|E] развились до такой степени, что фактически сделали его отступником. Его последователи и по сей день обременены ярлыком «Хулав», что означает «прогульщик», по формулировке приговора Верховного Суда Центра, вынесенного вскоре после его смерти.\n\nОскорбление со стороны судов оказалось бессильным и не имело поддержки мамура, и его наследники вскоре стали сами идентифицировать себя с этим ярлыком из общей любви к ироничному юмору."

 beshashuriyya: "Бешашуритск"
 beshashuriyya_adj: "Бешашурийя"
 beshashuriyya_adherent: "Бешашурит"
 beshashuriyya_adherent_plural: "Бешашуриты"
 beshashuriyya_desc: "Философское, политическое и религиозное движение, сосредоточенное вокруг фигуры [Concept('ishtabima_mamura','Иштабимы Мамура')|E], которая служила генералом и телохранителем сначала у [Concept('sanad','Санады')|E], а затем недолго у её мужа [Concept('tathtali','Татхтали')|E]. В поколениях после её смерти жизнь и военная карьера Иштабимы вознесли её до почти священного статуса среди бешашуритов, которые видят в ней образец воинской чести и верности. Примечательно, что бешашуриты стремятся подходить к воинским занятиям так же, как учёные и правоведы подходят к своим областям. Многие за пределами секты считают это абсурдным оправданием для возведения (вероятно) низкорождённой женщины до почти божественного статуса."

 anban_sarradon: "Анбанитск"
 anban_sarradon_adj: "Анбан Саррадон"
 anban_sarradon_adherent: "Анбанит"
 anban_sarradon_adherent_plural: "Анбаниты"
 anban_sarradon_desc: "Культ, основанный после Фродброкны. Анбан является преднамеренной и отчасти цинично прагматичной попыткой объединить варденизм и ритуализм в единую веру, основанную на фигуре нематериального божественного законодателя. Являясь отчасти политической философией, её идеалистические сторонники предлагают её как способ объединить Саррадон и наступить новую эру религиозного мира. По вполне понятным причинам ей в целом не удалось найти народной поддержки за пределами горстки военачальников, ищущих любое преимущество перед соперниками."