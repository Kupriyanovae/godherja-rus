 orndaehz: "Орндаэзск"
 orndaehz_adj: "Орндаэзизм"
 orndaehz_adherent: "Орндаэзец"
 orndaehz_adherent_plural: "Орндаэзцы"
 orndaehz_desc: "Последователи этой веры считают Орндаэз, или '[Concept('aelfir','Золотокровых')|E]', своими богами и повелителями, которые сами были столь же разнообразны, как и человечество, несмотря на свою великую силу, и пали, расколовшись на два враждующих племени. Они верят, что Золотокровые были затем уничтожены «Небесной Женщиной», которая изгнала их в землю без любви и страсти.\n\nТаким образом, орндаэзцы предаются плотским утехам, совершают ритуальные набеги и вкушают странные эликсиры, вызывающие эйфорию, чтобы направлять свои ощущения как энергию в «иные земли» — веря, что при достаточном количестве энергии Золотокровые смогут сбежать из изгнания. Друхандаэзаги также верят в священное состояние бытия, называемое «Жизненным Соединением», когда двое мужчин или две женщины объявляют друг друга недостающей половиной своей души и (в попытке предотвратить древний раскол, погубивший Золотокровых) заявляют, что их духи навеки едины, отказываясь участвовать в каких-либо утехах без присутствия другого."
