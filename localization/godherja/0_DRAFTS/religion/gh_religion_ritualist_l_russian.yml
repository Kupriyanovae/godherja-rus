 akhawwat_desc: "Аххавват аль-Иирахадат аль-Мутаджаалуях — Братство Проявленной Воли — это эзотерическая ритуалистская секта, которая верит, что реальность — это коллективная галлюцинация, а истинная реальность — это духовное царство. Люди — не существа из бренной плоти, а бессмертные и нематериальные духовные сущности, вечные, но ограниченного творения. Они заперли себя в этой ложной реальности через обманы аль-Хадидруджа, но могут узнать истину через Софокос — которого на самом деле не существует — и восстановить контроль над своими духовными телами, разорвав иллюзию существования."
