 ritualist_religion_adherent: "Ритуалист"
 ritualist_religion_adherent_plural: "Ритуалисты"
 ritualist_religion_desc: "Ритуализм — это не столько определённая вера, сколько ярлык для собрания местных верований. Это политеистическая группа религий, распространённых в [Concept('sarradon','Саррадоне')|E], склонных к эзотерическим верованиям и тайным церемониям. Общей чертой этих сект является почитание Тысячи и Одной Ступени [GetBuilding('01_sophocos').GetName] — [Concept('the_towers','Башни')|E], где можно достичь просветления, если подняться по каждой ступени ростом с человека и пройти через множество испытаний от богов. Немногие, кто справился с этой задачей, оставили свои записи в «Сказании о ступенях» — эзотерическом томе, к которому обращаются за наставлениями и чьи смыслы горячо оспариваются последователями. Пройти Тысячу и Одну Ступень для ритуалистов — это не только буквальное паломничество, но и символический путь самосовершенствования."





