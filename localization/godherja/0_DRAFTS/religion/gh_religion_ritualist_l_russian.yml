 eirbaadit_al_hukadir_desc: "Хукадириты верят, что мир возник из бурлящего водоворота Фавхадаа, несотворённого каким-либо разумным существом. Там появились всевозможные звери, и главным среди них было человечество. Но у людей не было богов, и поэтому у них не было морали; они принялись создавать своих собственных богов и свою собственную мораль, но безуспешно. Тогда явился Кубаал, Первый Вампир, который успешно сделал себя богом. Затем Кубаал наставил других, как достичь божественности, и первые вампиры правили великолепной империей под названием [GetBuilding('01_sophocos').GetName], откуда Кубаал правил со своего великого шпиля. Эйрбаадит аль-Хукадир действует в рамках эвгемеристической системы, предполагая, что все боги имеют смертное происхождение; они либо не существуют, либо были смертными, ставшими обожествлёнными. Хотя первое менее справедливо, чем второе, что в конечном счёте имеет значение, так это то, платит ли кто-то Кровавую десятину или нет."
