 #ataabay_zatanai localization, 'Ataabay Zatanai
 ataabay_zatanai: "Затанийск" #Последователи Затанаи
 ataabay_zatanai_adj: "Атабай Затанаи"
 ataabay_zatanai_adherent: "Затаниец"
 ataabay_zatanai_adherent_plural: "Затанийцы"
 ataabay_zatanai_desc: "Последователи Затанаи придерживаются учения ритуалистского пророка Затанаи, который получил свои откровения от [GetBuilding('01_sophocos').GetName] всего в семнадцать лет. Затанаи, несмотря на молодость, был яростным оратором, заявившим, что [Concept('wardenism','вардениты')|E] должны быть полностью уничтожены, а всякий, отвергающий истины [GetBuilding('01_sophocos').GetName], должен быть убит как враг человечества. Хотя изначально это не должно было быть постоянной сектой, Затанаи включил элементы секты Сулеймания в свою собственную, главным образом веру в Домах Данияль и взгляд на то, что все философии могут быть полезны, хотя Затанаи отвергал идею о том, что не-ритуалистские философии имеют какую-либо ценность. Затанаи и его последователи верят, что ритуализм — единственный и неповторимый образ жизни для человечества; все другие религии — лишь извращения Ритуализма, и поэтому их следует либо ассимилировать, если возможно, либо уничтожить, если нет. Затанаи был одним из самых молодых ритуалистских пророков в истории религии, и он ушёл в сокрытие в возрасте девятнадцати лет, объявив, что вернётся, когда его народ будет нуждаться в нём больше всего."
