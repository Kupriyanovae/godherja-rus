 #Xwestrozen localization
 xwestrozen:0 "Хвестрозенск"
 xwestrozen_adj:0 "Хвестрозен"
 xwestrozen_adherent:0 "Хвестрозен"
 xwestrozen_adherent_plural:0 "Хвестрозены"
 xwestrozen_desc:0 "Конфессия Хвестрозен возникла благодаря Назе Великой после того, как она получила откровение об истинной природе [GetBuilding('01_sophocos').GetName]. Хвестрозены утверждают, что Софокос на самом деле не физическое место, а песня из тысячи и одной ноты, где каждая нота звучит все выше по тональности. Предполагается, что мастерское исполнение этой песни дарует просветление и великое магическое мастерство, поскольку Хвестрозены верят, что [Concept('magi','маги')|E] черпают свои силы из знания определенных нот этого напева. Впрочем, любая музыка считается у них священной, а не только Песня Софокоса, и музыканты повсеместно почитаются как благочестивые люди."

 # Pirate Coast Ritualists
 corkkattirkana:0 "Чорккаттирканск"
 corkkattirkana_adj:0 "Чорккаттиркана"
 corkkattirkana_adherent:0 "Чорккаттирканец"
 corkkattirkana_adherent_plural:0 "Чорккаттирканцы"
 corkkattirkana_desc:0 "Ритуалистская секта, зародившаяся на [Concept('pirate_coast','Пиратском побережье')|E]. Сторонники Чорккаттирканы верят, что восхождение по ступеням [GetBuilding('01_sophocos').GetName] под силу завершить лишь величайшим из верующих. Каждый последователь стремится превзойти остальных, словно соревнуясь за право стать тем единственным, кто пройдет этот путь до самого конца."

