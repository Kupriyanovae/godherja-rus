 ritualist4_adj:0 "Ирамизм"
 ritualist4_adherent:0 "Ирамит"
 ritualist4_adherent_plural:0 "Ирамиты"
 ritualist4_desc:0 "Ирам, Город столпов.\nОн восстанет из песков, подобно рассвету, но лишь для тех, чей разум открыт, а сердце достойно.\nОн будет черен как смоль и украшен золотом, полон драгоценностей, что сверкают как тысяча звезд.\nСемиглавый змей будет тоскливо взирать на вас в стенах города, где вы будете в безопасности.\nНе ищи Ирам, верный, пока Ирам сам не найдет тебя."
