 ataabay_zatanai_desc:0 "Последователи Затанаи придерживаются учения ритуалистского пророка Затанаи, который получил свои откровения от [GetBuilding('01_sophocos').GetName] всего в семнадцать лет. Затанаи, несмотря на юность, был яростным оратором, заявлявшим, что [Concept('wardenism','вардениты')|E] должны быть полностью уничтожены, а любой, кто отвергает истины [GetBuilding('01_sophocos').GetName], должен быть убит как враг человечества. Хотя изначально это течение не задумывалось как постоянная секта, Затанаи вобрал в свое учение элементы сулейманитской конфессии — главным образом веру в Домах Даниял и представление о том, что из любой философии можно извлечь урок, хотя сам Затанаи отвергал идею, что неритуалистские учения имеют хоть какую-то ценность. Затанаи и его последователи верят, что ритуализм — единственный истинный образ жизни для человечества, а все остальные религии являются лишь извращением ритуализма и должны быть либо ассимилированы, либо уничтожены. Затанаи был одним из самых юных пророков в истории этой религии; он ушел в сокрытие в возрасте девятнадцати лет, провозгласив, что вернется, когда свой народ будет нуждаться в нем сильнее всего."
