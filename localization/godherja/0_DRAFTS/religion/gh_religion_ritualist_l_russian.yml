 #hanaaist localization, Hanaaism
 hanaaist: "Ханааистск"
 hanaaist_adj: "Тарриак аль-Вахайд"
 hanaaist_adherent: "Ханааист"
 hanaaist_adherent_plural: "Ханааисты"
 hanaaist_desc: "Путь Единого был основан пророчицей по имени Ханаа, женщиной, рождённой под властью [Concept('wardenism','варденитов')|E]. Ханаа родилась ритуалисткой, но тесно общалась с варденитами. Достигнув понимания варденитских верований и сочувствуя их делу, Ханаа, как говорят, получила откровение, когда поднялась по ступеням [GetBuilding('01_sophocos').GetName], предупреждающее её, что физический мир создан злобным демиургом, и что с его слугами необходимо бороться всякий раз, когда это возможно. Только через его уничтожение смертные могут освободиться от оков физического существования и вечно пребывать в Садах Жизни. Ханаа также проповедовала, что существует лишь один бог, и что этого бога зовут Единый. Единый повелел ритуалистам бороться с демиургом в древности, но эти пророки были ложно истолкованы или убиты своими последователями; поэтому Единый дал откровение первому из варденитов и оставил ритуалистов. Но если ритуалисты внемлют Ханаа и живут согласно Пути Единого — списку законов, переданных Ханаа, — Единый снова будет благоволить им."
 #good gods
