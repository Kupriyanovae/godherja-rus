 ritualist_religion_desc:0 "Менее определенная вера и скорее общее название для конгломерата местных верований, ритуализм представляет собой политеистическую группу конфессий, зародившуюся в [Concept('sarradon','Саррадоне')|E], чьи последователи склонны к эзотерическим убеждениям и тайным церемониям. Общим для этих сект является их почитание Тысячи и одной ступени [GetBuilding('01_sophocos').GetName] — [Concept('the_towers','Башни')|E], где можно достичь просветления, если преодолеть каждую ступень размером с человека и столкнуться с множеством испытаний от богов. Те немногие, кто справился с этой задачей, собрали свои свидетельства в «Истории ступеней» — эзотерическом томе, к которому обращаются за наставлениями и значение которого горячо обсуждается среди последователей. Пройти Тысячу и одну ступень для ритуалистов — это не только буквальное паломничество, но и фигуральный поиск самосовершенствования."
