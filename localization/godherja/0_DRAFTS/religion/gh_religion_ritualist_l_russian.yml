 #zamitilaat_karim localization, Zamitilaat Karim
 zamitilaat_karim: "Каримийск"
 zamitilaat_karim_adj: "Замитилаат Карим"
 zamitilaat_karim_adherent: "Каримиец"
 zamitilaat_karim_adherent_plural: "Каримийцы"
 zamitilaat_karim_desc: "Братство Карима, или Замитаалат Карим, было основано пророком Каримом ибн Софокосом, неграмотным и необразованным человеком, жившим недалеко от [Concept('the_towers','Башни')|E]. Карим утверждал, что организованные жречества противоречат откровениям [GetBuilding('01_sophocos').GetName], и что не нужно быть образованным, знатным или даже умным, чтобы быть пророком Башни. Концепция жреца-царя, верховного жреца или бога-царя является мерзостью для каримийцев, которые утверждают, что любое организованное жречество лишь подавляет истины, данные на ступенях Софокоса. Поэтому жречество должно полностью состоять из мирян, и любые попытки навязать ему организацию или кодифицировать религию должны встречать яростное сопротивление. Восхождение на [GetBuilding('01_sophocos').GetName] считается первостепенной задачей для любого истинного каримийца, и каждый член секты и будущий жрец должен совершить это путешествие хотя бы раз в жизни."

 #eabuyad_ilah_al_atilaam localization, Eabuyad Ilah al-Atilaam
 eabuyad_ilah_al_atilaam: "Эабудийск"
 eabuyad_ilah_al_atilaam_adj: "Эабуяд Илах аль-Атилаам"
 eabuyad_ilah_al_atilaam_adherent: "Эабудец"
 eabuyad_ilah_al_atilaam_adherent_plural: "Эабуйады"
 eabuyad_ilah_al_atilaam_desc: "Рабы Бога Боли верят, что мир был создан злобным богом Ашредом мин Башитан аль-Атилаам. Когда он создавал мир, он оторвал свою плоть, чтобы сделать растения, а свои кости растёр в пыль, чтобы заполнить полую сферу, которую он использовал для создания земли, ставшую почвой и металлами земли. Затем он создал животных, сжигая себя, и создал расу людей, вырвав своё сердце. Наконец, он использовал свой позвоночник, чтобы воздвигнуть [GetBuilding('01_sophocos').GetName] и Шпили Скорби. Вложив так много себя в мир, он дал первым людям простую заповедь: идите и убивайте. Чем больше людей будет убито и будет страдать, тем скорее Бог Боли восстановит своё тело. Легенды Рабов гласят, что Ашреду поклонялась в древности империя могучих воинов, но их империя рухнула, и, лишённая регулярных жертв, Ашред жестоко наказал человечество. Чтобы предотвратить дальнейшие наказания, Рабы должны страдать, чтобы другие не страдали."
