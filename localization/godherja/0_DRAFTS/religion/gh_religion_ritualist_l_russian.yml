 #suleimania localization, Suleimani'a
 suleimania:0 "Сулейманитск"
 suleimania_adj:0 "Сулеймания"
 suleimania_adherent:0 "Сулейманит"
 suleimania_adherent_plural:0 "Сулейманиты"
 suleimania_desc:0 "Сулейманиты следуют учению [Concept('magi','мага')|E]-философа Сулеймана Мудрого, который утверждал, что [GetBuilding('01_sophocos').GetName] на поверхности мира — это лишь эманация Истинного Софокоса, сокрытого глубоко под землей в пещерах Домах Даниял. Сулейманиты верят, что давным-давно люди были наделены великой мудростью и ростом, а их философия позволяла им изменять мир. Со временем они измельчали телом и разумом, а их великая философия точно так же выродилась в то, что ныне зовется [Concept('magic','магией')|E], став опасной и подталкивающей людей ко злу. Немногие, кого звали Бану Даниял, бежали под землю к Истинному Софокосу, в то время как их родичи превратились в современного человека. Сулейманиты верят, что философия божественна, а философы — это воплощения божественности на [aeras|E]."
