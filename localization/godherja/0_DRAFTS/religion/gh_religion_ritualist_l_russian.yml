 akhawwat_desc:0 "Братство Явленной Воли (Ахавват аль-Ирада аль-Мутаджалия) — это эзотерическая ритуалистская секта, верящая в то, что реальность является коллективной галлюцинацией, а подлинный мир — исключительно духовное царство. Люди — это не существа из бренной плоти, а бессмертные и нематериальные духовные сущности, вечные, но имеющие предел своего творения. Они заперли себя в этой ложной реальности из-за козней аль-Хадидруджа, но могут познать истину через Софокос (который сам по себе тоже не существует), вернуть контроль над своими духовными телами и разрушить иллюзию бытия."
