 #ritualist faith loc
 ritualist: "Софокистск"
 ritualist_adj: "Софокист"
 ritualist_adherent: "Софокист"
 ritualist_adherent_plural: "Софокисты"
 ritualist_desc: "Софокисты делают упор на запоминание и исполнение символических божественных ритуалов, которые, по их утверждению, являются истинными Тысячей и Одной Ступенью [GetBuilding('01_sophocos').GetName]. [Concept('the_towers','Башня')|E], где находятся физические Ступени, — это лишь место, где передавались уроки, а сами ритуалы должны выполняться где угодно. Через точное исполнение всех 1001 ритуалов человек сможет постичь тайны богов и достичь просветления."

 #kamayed loc
 kamayed: "Камайедск"
 kamayed_adj: "Камайед"
 kamayed_adherent: "Камайед"
 kamayed_adherent_plural: "Камайеди"
 kamayed_desc: "Камайеди верят, что Тысяча и Одна Ступень [GetBuilding('01_sophocos').GetName] действительно существует, но не у великой [Concept('the_towers','Башни')|E], которую обычно описывают как их местонахождение в софокистском фольклоре. Вместо этого они утверждают, что ступени ведут вниз, в огромный кратер «за северными звёздами». Этот кратер, по их мнению, — врата в загробную жизнь, и те, кто достаточно достоин достичь дна, могут войти в царство богов."

 #hayawan loc, hayawani
