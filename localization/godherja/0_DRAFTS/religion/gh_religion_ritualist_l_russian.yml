 #suleimania localization, Suleimani'a
 suleimania: "Сулейманийск"
 suleimania_adj: "Сулеймания"
 suleimania_adherent: "Сулейманиец"
 suleimania_adherent_plural: "Сулейманийцы"
 suleimania_desc: "Сулейманийцы следуют учениям [Concept('magi','мага')|E]-философа Сулеймана Мудрого, который предположил, что [GetBuilding('01_sophocos').GetName] на поверхности мира является эманацией Истинного Софокоса, хранящегося глубоко под землёй в пещерах Домах Данияль. Сулейманийцы верят, что в древности люди были благословлены великой мудростью и ростом, и что их философии позволяли им управлять миром. Со временем они начали вырождаться в размерах и мудрости, и их философия также выродилась в то, что ныне называется [Concept('magic','магией')|E], став опасной и влекущей людей к злу. Немногие, называемые Бану Данияль, бежали под землю к Истинному Софокосу, в то время как их родичи превратились в современного человека. Сулейманийцы верят, что философия божественна, а философы — воплощения божественности на [aeras|E]."
