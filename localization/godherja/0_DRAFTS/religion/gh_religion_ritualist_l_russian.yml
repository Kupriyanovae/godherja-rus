 corkkattirkana_adj: "Корккаттиркана"
 corkkattirkana_adherent: "корккаттирканец"
 corkkattirkana_adherent_plural: "корккаттирканцы"
 corkkattirkana_desc: "Ритуалистская секта, родившаяся на [Concept('pirate_coast','Пиратском побережье')|E], корккаттирканы верят, что восхождение по [GetBuilding('01_sophocos').GetName] может быть по-настоящему завершено только величайшими из верующих. Каждый последователь стремится превзойти других, как в соревновании, чтобы решить, кто станет тем, кто завершит восхождение."

