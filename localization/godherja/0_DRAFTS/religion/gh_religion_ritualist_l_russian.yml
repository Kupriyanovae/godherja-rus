 #monolith_death_cult localization, Eirbaadit al-Muntarisa
 monolith_death_cult: "Хасанийск" #Культ Монолитов
 monolith_death_cult_adj: "Эйрбаадит аль-Мунтариса"
 monolith_death_cult_adherent: "Хасаниец"
 monolith_death_cult_adherent_plural: "Хасании"
 monolith_death_cult_desc: "Основанный царём-авантюристом Хасаном аль-Хуром в 727 году от И.С., Культ Монолитов поклоняется трём белым монолитам с необычайно замысловатыми узорами и чрезвычайно гладкой поверхностью, расположенным в Джубаал-Хуре. Утверждая, что монолиты давали наставления своим самым верным последователям, когда их мазали кровью, ритуальные кровопускания быстро переросли в принесение преступников в жертву монолитам, что, по слухам, усиливает интенсивность наставлений, поскольку они почти не слышны, когда им приносят лишь дары крови. Считается, что монолиты олицетворяют хтонического трёхглавого бога жизни и смерти, который был первым существом, поднявшимся по 1001 Ступени [GetBuilding('01_sophocos').GetName], где он стал Царём всех богов."
