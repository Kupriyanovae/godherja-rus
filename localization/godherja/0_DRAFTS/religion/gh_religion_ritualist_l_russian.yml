 #ritualist faith loc
 ritualist:0 "Cофокистск"
 ritualist_adj:0 "Софокизм"
 ritualist_adherent:0 "Софокист"
 ritualist_adherent_plural:0 "Софокисты"
 ritualist_desc:0 "Софокисты делают упор на заучивание и исполнение символических божественных ритуалов, которые, как они настаивают, и есть истинные Тысяча и одна ступень [GetBuilding('01_sophocos').GetName]. [Concept('the_towers','Башня')|E], где физически расположены Ступени, является лишь местом, где эти уроки были переданы, а сами ритуалы должны исполняться где угодно. Только через точное исполнение всех 1001 ритуала человек сможет постичь тайны богов и достичь просветления."
 
 #kamayed loc
 kamayed:0 "Камайедск"
 kamayed_adj:0 "Камайед"
 kamayed_adherent:0 "Камайед"
 kamayed_adherent_plural:0 "Камайеды"
 kamayed_desc:0 "Сторонники Камайед верят, что Тысяча и одна ступень [GetBuilding('01_sophocos').GetName] действительно существуют в физическом мире, но вовсе не у великой [Concept('the_towers','Башни')|E], как это обычно описывается в софокистском фольклоре. Вместо этого они утверждают, что ступени представляют собой спуск в огромный кратер «за северными звездами». Этот кратер, по их заверениям, является вратами в загробный мир, и те, кто достаточно достоин, чтобы достичь его дна, могут войти в обитель богов."
 
