 mawtalmuninin_desc: "За завесой смертного мира лежит лишь вечность смерти. Мавталмуминины с радостью принимают это конечное пристанище; более того, они жаждут его. Для мавталмумининов нет ничего страшного в смерти, и её должно почитать. Поскольку смерть вечна, все боги и люди — её слуги."
