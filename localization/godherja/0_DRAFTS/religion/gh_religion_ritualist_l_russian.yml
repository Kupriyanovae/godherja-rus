 #hanaaist localization, Hanaaism
 hanaaist:0 "Ханааитск"
 hanaaist_adj:0 "Тарик аль-Вахид"
 hanaaist_adherent:0 "Ханааит"
 hanaaist_adherent_plural:0 "Ханааиты"
 hanaaist_desc:0 "«Путь Единого» был основан пророчицей по имени Ханаа, женщиной, рожденной под властью [Concept('wardenism','варденитов')|E]. Будучи ритуалисткой с рождения, Ханаа тем не менее активно общалась с варденитами. Обретя понимание их верований и сочувствуя их правому делу, Ханаа, как говорят, получила откровение во время восхождения на ступени [GetBuilding('01_sophocos').GetName]: её предупредили, что материальный мир был сотворен злобным демиургом, и с его слугами необходимо бороться при любой возможности. Только через его уничтожение смертные смогут освободиться от оков физического существования и вечно обитать в Садах Жизни. Ханаа также проповедовала, что существует лишь один истинный бог, имя которому — Единый. Единый повелел ритуалистам сражаться с демиургом еще в незапамятные времена, но те пророки были неверно истолкованы или убиты собственными последователями, поэтому Единый ниспослал откровение первым варденитам и покинул ритуалистов. Однако, если ритуалисты внемлют словам Ханаа и станут жить согласно Пути Единого — своду законов, переданных пророчице, — Единый вновь дарует им свое благословение."
