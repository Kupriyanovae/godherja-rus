 #monolith_death_cult localization, Eirbaadit al-Muntarisa
 monolith_death_cult:0 "Хасанитск"
 monolith_death_cult_adj:0 "Ибадат аль-Мунтасира"
 monolith_death_cult_adherent:0 "Хасанит"
 monolith_death_cult_adherent_plural:0 "Хасаниты"
 monolith_death_cult_desc:0 "Основанный царем-искателем приключений Хасаном аль-Хуром в 727 году от И.С., Культ монолитов поклоняется трем белым монолитам с необычайно сложными узорами и гладкой поверхностью, расположенным в Джубааль-Хуре. Согласно заявлениям, монолиты дают указания своим наиболее преданным последователям, будучи окроплены кровью. Ритуальное кровопускание быстро переросло в принесение в жертву преступников, что якобы усиливает громкость заповедей, поскольку при обычных подношениях крови они едва различимы. Считается, что монолиты олицетворяют хтонического трехглавого бога жизни и смерти, который стал первым существом, поднявшимся по 1001 ступени [GetBuilding('01_sophocos').GetName], где он и воцарился над всеми богами."
