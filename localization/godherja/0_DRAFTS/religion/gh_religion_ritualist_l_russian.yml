 #mawtalmuninin loc, Mawtalmuminin
 mawtalmuninin:0 "Мавталмумининск"
 mawtalmuninin_adj:0 "Мавталмуминин"
 mawtalmuninin_adherent:0 "Мавталмумининит"
 mawtalmuninin_adherent_plural:0 "Мавталмумининиты"
 mawtalmuninin_desc:0 "За завесой смертного мира лежит лишь вечность смерти. Последователи Мавталмуминин с радостью принимают это конечное пристанище; более того, они жаждут его. Для них в смерти нет ничего пугающего, напротив — её необходимо почитать. Поскольку смерть вечна, все боги и люди — лишь её слуги."
