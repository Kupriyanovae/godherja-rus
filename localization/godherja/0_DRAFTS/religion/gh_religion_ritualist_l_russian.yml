 #sabiat_al_malaikiya localization, Sabiat al-Malaikiya
 sabiat_al_malaikiya:0 "Малаикитск"
 sabiat_al_malaikiya_adj:0 "Сабиат аль-Малаикия"
 sabiat_al_malaikiya_adherent:0 "Малаикит"
 sabiat_al_malaikiya_adherent_plural:0 "Малаикиты"
 sabiat_al_malaikiya_desc:0 "Община Сабиат аль-Малаикия была основана пророчицей Сарой бинт Шакира, которая, по преданиям, взошла по ступеням [GetBuilding('01_sophocos').GetName] и была встречена сонмом ангелов, чей лик внушал ужас, а голоса повергали людей в судороги. Сару сопровождал отряд других ритуалистов, подтвердивших, что тоже видели ангелов. Обратившись к своей пророчице, ангелы похвалили ритуалистов за их преданность [GetBuilding('01_sophocos').GetName] и даровали Саре откровение: боги и богини этого мира — лишь маски, носимые ангелами [GetBuilding('01_sophocos').GetName], а каждая религия — не что иное, как еще один путь к просветлению. На нее была возложена миссия принести людям мир, прекратить бесконечные войны в Саррадоне, наладить взаимопонимание между ритуалистами и варденитами, а затем разнести эту весть о мире по всей земле. Она и ее новообращенные назвали себя Племенем ангелов и устремились проповедовать это послание о сосуществовании."
