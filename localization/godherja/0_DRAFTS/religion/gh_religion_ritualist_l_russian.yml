 tarriaq_al_dhaat_desc: "Путь Себя учит, что Тысяча и Одна Ступень [GetBuilding('01_sophocos').GetName] не может быть пройдена, если душа не освобождена от гнёта. Боги, ангелы и лжепророки — всего лишь цепи на живых, и каждый шаг — это сброшенная цепь. Идти по Тарриак аль-Дхаат — значит нуждаться только в том, что внутри тебя.\n\nЭто было откровение [Glossary('Саайф аль-Малаики аль-Халид','UNDYING_SWORD_GLOSS')], который обратил клинок небес против самих небес."

