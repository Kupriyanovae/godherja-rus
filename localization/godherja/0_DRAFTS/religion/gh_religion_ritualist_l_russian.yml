 #zamitilaat_karim localization, Zamitilaat Karim
 zamitilaat_karim:0 "Каримитск"
 zamitilaat_karim_adj:0 "Замитилаат Карим"
 zamitilaat_karim_adherent:0 "Каримит"
 zamitilaat_karim_adherent_plural:0 "Каримиты"
 zamitilaat_karim_desc:0 "Братство Карима, или Замиталаат Карим, было основано пророком Каримом ибн Софокос — неграмотным и необразованным человеком, жившим неподалеку от [Concept('the_towers','Башни')|E]. Карим утверждал, что организованное жречество является анафемой для откровений [GetBuilding('01_sophocos').GetName], и что вовсе не обязательно быть образованным, знатным или даже умным, чтобы стать пророком Башни. Само понятие жреца-царя, верховного жреца или бога-царя является мерзостью для каримитов, заявляющих, что любое организованное духовенство служит лишь для подавления истин, переданных на ступенях Софокоса. Таким образом, жречество должно полностью состоять из мирян, а любые попытки навязать структуру или кодифицировать веру должны встречать жестокое сопротивление. Восхождение на [GetBuilding('01_sophocos').GetName] считается первостепенным делом для любого истинного последователя, и от каждого члена секты и потенциального жреца ожидается совершение этого паломничества хотя бы раз в жизни."


 #eabuyad_ilah_al_atilaam localization, Eabuyad Ilah al-Atilaam
 eabuyad_ilah_al_atilaam:0 "Эабудск"
 eabuyad_ilah_al_atilaam_adj:0 "Ибадат Илах аль-Атилям"
 eabuyad_ilah_al_atilaam_adherent:0 "Эабуд"
 eabuyad_ilah_al_atilaam_adherent_plural:0 "Эабуды"
 eabuyad_ilah_al_atilaam_desc:0 "Рабы Бога Боли верят, что мир был сотворен злобным божеством по имени Ашред мин Башитан аль-Атилям. Создавая вселенную, он сорвал собственную плоть, чтобы сотворить растения, и перемол в пыль свои кости, чтобы заполнить пустую сферу, из которой сотворил землю — так появились почва и металлы. Затем он создал животных, предав себя огню, а человеческий род сотворил, вырвав собственное сердце. Наконец, из своего позвоночника он воздвиг [GetBuilding('01_sophocos').GetName] и Шпили Скорби. Вложив так много себя в этот мир, он дал первым людям простую заповедь: идите и убивайте. Чем больше людей гибнет и страдает, тем сильнее восстанавливается тело Бога Боли. Легенды Рабов гласят, что в древности Ашреду поклонялась империя могучих воинов, но их государство пало, и лишившись регулярных жертв, Ашред жестоко покарал человечество. Чтобы не допустить новых кар, Рабы должны страдать сами, оберегая от этого остальных."
