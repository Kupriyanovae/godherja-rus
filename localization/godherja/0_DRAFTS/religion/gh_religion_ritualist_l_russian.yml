 eabuyad_al_duhaad_khubir_desc: "Рабы Великого Червя поклоняются [Concept('the_worldeater','Пожирателю Миров')|E] и тому, что они считают его бесчисленным потомством глубоко под [Concept('aeras','Эрасом')|E]. Рабы Великого Червя почитают Пожирателя Миров как Великого Червя, или аль-Духаад Хубир, а его потомство — как Великих Червей, или аль-Дийхаадан аль-Эазаам. Только принося Великим Червями жертвы и поклонение, они могут оставаться спящими под землёй, и Рабы считают своим долгом предотвратить пробуждение ещё одного Великого Червя."
