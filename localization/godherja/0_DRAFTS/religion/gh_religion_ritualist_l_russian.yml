 hayawan_adj:0 "Хаяван"
 hayawan_adherent:0 "Хаяван"
 hayawan_adherent_plural:0 "Хаявани"
 hayawan_desc:0 "Давным-давно Лев, могущественнейший из зверей, был совсем один в этом мире. С его могучим рыком человечество восстало из земли, и Лев больше не был одинок. Затем явился Гончая, хранитель мертвых и воинов. Гончая был в ярости на Льва, ибо Лев нисколько не заботился о жизнях созданных им людей и не питал верности к своему творению. Прежде чем между ними разразилась великая война, Рысь хитростью заставил Льва пригласить Гончую в свой дом. Поскольку весь [aeras|E] был домом Льва, он оказался связан законами гостеприимства, и так Лев и Гончая стали братьями."
