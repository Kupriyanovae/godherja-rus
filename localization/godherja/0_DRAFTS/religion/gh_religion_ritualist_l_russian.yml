 eabuyad_al_duhaad_khubir_desc:0 "Рабы Великого Червя — это почитатели [Concept('the_worldeater','Пожирателя Миров')|E] и его бесчисленного потомства, обитающего в самых темных глубинах под [Concept('aeras','Аэрасом')|E]. Они поклоняются Пожирателю Миров как Великому Червю (аль-Духад Хубир), а его выводок называют Великими Червями (аль-Дияхадан аль-Азам). Только через регулярные подношения, жертвы и поклонение Великих Червей удается удерживать в усыпленном состоянии под землей, и Рабы считают своим священным долгом не позволить ни одному из Великих Червей пробудиться вновь."
