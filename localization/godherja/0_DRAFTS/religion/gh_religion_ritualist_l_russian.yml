 #eirbaadit_al_hukadir localization, Eirbaadit al-Hukadir
 eirbaadit_al_hukadir:0 "Хукадиритск"
 eirbaadit_al_hukadir_adj:0 "Ибадат аль-Хукадир"
 eirbaadit_al_hukadir_adherent:0 "Хукадирит"
 eirbaadit_al_hukadir_adherent_plural:0 "Хукадириты"
 eirbaadit_al_hukadir_desc:0 "Хукадириты верят, что мир возник из бушующего водоворота Фавхады и не был создан каким-либо разумным существом. Там появились самые разные звери, и главным среди них было человечество. Но люди жили без богов, а значит, и без морали; они пытались создать собственных богов и этику, но тщетно. Тогда явился Кубаал, Первый вампир, который успешно обратил себя в бога. Затем Кубаал обучил других тому, как достичь божественности, и первые вампиры правили великолепной империей под названием [GetBuilding('01_sophocos').GetName], где сам Кубаал восседал на вершине своего великого шпиля. Эта конфессия действует в рамках эвгемерической концепции, предполагая, что все боги имеют смертное происхождение: они либо не существуют вовсе, либо являются смертными, которые были обожествлены. И хотя первое утверждение считается менее весомым, чем второе, в конечном итоге важно лишь то, платит ли человек Кровную десятину."
