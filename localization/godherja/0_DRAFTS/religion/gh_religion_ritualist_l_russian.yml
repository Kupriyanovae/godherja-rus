 sabiat_al_malaikiya_adherent: "Малаикиец"
 sabiat_al_malaikiya_adherent_plural: "Малаикийцы"
 sabiat_al_malaikiya_desc: "Сабиат аль-Малаикия была основана пророчицей Сарой бинт Шакирой, которая, по слухам, поднялась по ступеням [GetBuilding('01_sophocos').GetName] и была встречена сонмом ангелов, чей вид был ужасен, а голоса вызывали у людей судороги. Сару сопровождала группа других ритуалистов, которые также сообщили о видении ангелов. Обращаясь к своей пророчице, ангелы похвалили ритуалистов за их преданность [GetBuilding('01_sophocos').GetName] и дали Саре откровение: боги и богини этого мира — всего лишь маски, носимые ангелами [GetBuilding('01_sophocos').GetName], и каждая религия — лишь ещё один путь к просветлению. Поэтому на неё была возложена миссия донести мир до людей, прекратить бесконечные войны Саррадона и принести понимание между ритуалистами и варденитами, а затем распространить это послание мира на весь мир. Она и её новообращённые назвали себя Племенем Ангелов и принялись распространять это послание о сосуществовании."
