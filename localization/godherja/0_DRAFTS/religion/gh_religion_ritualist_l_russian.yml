 #Xwestrozen localization
 xwestrozen: "Ксвестрозенск"
 xwestrozen_adj: "Ксвестрозен"
 xwestrozen_adherent: "Ксвестрозен"
 xwestrozen_adherent_plural: "Ксвестрозены"
 xwestrozen_desc: "Ксвестрозены возникли с Назой Великой после того, как она получила откровение об истинной природе [GetBuilding('01_sophocos').GetName]. Ксвестрозены утверждают, что Софокос на самом деле не является реальным местом, а скорее песней с тысячей и одной нотой, каждая нота восходит по высоте. Предположительно, овладение этой песней дарует просветление и великое магическое мастерство, и ксвестрозены верят, что [Concept('magi','маги')|E] черпают свою силу из знания некоторых нот этой песни. Однако вся музыка считается священной для ксвестрозенов, а не только Песнь Софокоса, и музыкантов широко почитают как благочестивых людей."

