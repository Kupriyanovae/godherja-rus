 arnazni_religion_desc: "Арназни видит мир как испытание, которое необходимо преодолеть, чтобы возвыситься до бога; никогда не отступать и чтить своих самых почитаемых предков. Их мифологическая история сосредоточена вокруг [Concept('armazli_mountains','гор Армазли')|E] и трёх богов [Concept('arnaz_azot_zalden','Братьев Арназ')|E]. Сын Арназа, Парназ, вскоре был коронован как верховный царь после убийства Азота. Именно от него и его многовекового правления произошли почти все в современной Амагее, а его прямая линия считается самой чистой, и они правили землёй веками, формируя сильное воинское общество."

