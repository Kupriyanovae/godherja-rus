 stone_warrior_old_adj: "Старый культ Каменных Воинов"
 stone_warrior_old_adherent: "Старый культист Каменных Воинов"
 stone_warrior_old_adherent_plural: "Старые культисты Каменных Воинов"

 western_stranger: "Западностранническ"
 western_stranger_adj: "Культ Западного Странника"
 western_stranger_adherent: "Культист Западного Странника"
 western_stranger_adherent_plural: "Культисты Западного Странника"
 western_stranger_desc: "Культ Западного Странника воздаёт почести почти мифическому существу с далёкого запада Амагеи, а также их ближайшим ученикам. Именно когда Великий Парназ нуждался в помощи больше всего против Азота, появился западный странник с несколькими сотнями своих последователей, владеющих уровнем магического могущества, невиданным со времён ранних дней мира. Почитатели странника ценят магическое могущество и ставят магов выше других, хотя воины по-прежнему пользуются уважением."
 western_stranger_old: "Старозаходностранническ"
 western_stranger_old_adj: "Старый культ Западного Странника"
 western_stranger_old_adherent: "Старый культист Западного Странника"
 western_stranger_old_adherent_plural: "Старые культисты Западного Странника"

 lost_heroes: "Забытогеройск"
 lost_heroes_adj: "Культ Забытых Героев"
 lost_heroes_adherent: "Культист Забытых Героев"
 lost_heroes_adherent_plural: "Культисты Забытых Героев"
 lost_heroes_desc: "Этот амагейский культ воздаёт почести неизвестным героям, чьи имена были забыты временем, даже если их деяния не были. Они стараются вести добродетельную и воинскую жизнь без отвлечений в знак благодарности своим предкам."
