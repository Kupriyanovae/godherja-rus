 stone_warrior: "Каменновоинск"
 stone_warrior_adj: "Культ Каменных Воинов"
 stone_warrior_adherent: "Культист Каменных Воинов"
 stone_warrior_adherent_plural: "Культисты Каменных Воинов"
 stone_warrior_desc: "Этот амагейский культ поклоняется десяти Каменным Воинам. Сказания гласят, что эти титанические мужи некогда служили Арназу «Великому Предку». Однако во время узурпации Азота «Родоубийцы» они отказались склонить колено перед такой тиранией и были прокляты, казалось бы, на вечность. Культ утверждает, что однажды они будут воскрешены самим Арназом и сразятся в великой битве за свободу Амагеи."
