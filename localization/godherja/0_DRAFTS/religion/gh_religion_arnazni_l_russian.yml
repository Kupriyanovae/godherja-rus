 thousand_ancestors: "Тысячепредковск"
 thousand_ancestors_adj: "Культ Тысячи Предков"
 thousand_ancestors_adherent: "Культист Тысячи Предков"
 thousand_ancestors_adherent_plural: "Культисты Тысячи Предков"
 thousand_ancestors_desc: "Этот амагейский культ воздаёт почести тысяче предков, которые пришли с небес и отказались от своей эфирной формы, чтобы построить смертный мир. Они утверждают, что Арназ был причиной того, что небеса были навеки запечатаны, и что он выдумал причины для своей несправедливой войны разрушения вместе со своими братьями. Азот вскоре осознал, что его старший брат говорит лживо, и в конце концов низверг его в багровую бездну. Однако было уже слишком поздно, и резня и разрушения от этой войны сделали земли непригодными для жизни. Великие предки отдали свои жизни, чтобы исцелить земли. Азот пытался распространять правду; однако он был зверски убит демоническим отродьем Арназа."
