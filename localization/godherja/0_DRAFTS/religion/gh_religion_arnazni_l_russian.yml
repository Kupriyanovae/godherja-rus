 last_truthspeakers: "Последнеистиннословск"
 last_truthspeakers_adj: "Культ Последних Говорящих Истину"
 last_truthspeakers_adherent: "Культист Последних Говорящих Истину"
 last_truthspeakers_adherent_plural: "Культисты Последних Говорящих Истину"
 last_truthspeakers_desc: "Культ Последних Говорящих Истину воздаёт почести последним членам династии Донаурлиан, считая их последними правителями Амагеи, воплотившими её истинные ценности и добродетели. Учение культа гласит, что мир уже давно погрузился в тёмный век моральной деградации, слабости и изнеженного декаданса, о котором предупреждал Арназ «Великий Предок» (большинство других амагейских ветвей придерживаются мнения, что эта эпоха ещё не наступила), и что спасение придёт только с возвращением Говорящих Истину. [Concept('aeras','Эрас')|E] теперь ждёт их воскрешения всеотцом, и когда они вернут себе законное право, они снова приведут Амагею к праведности и начнут вечный золотой век."
 last_truthspeakers_old: "Старопоследнеистиннословск"
 last_truthspeakers_old_adj: "Старый культ Последних Говорящих Истину"
 last_truthspeakers_old_adherent: "Старый культист Последних Говорящих Истину"
