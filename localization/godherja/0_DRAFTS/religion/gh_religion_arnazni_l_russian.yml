 two_sisters: "Двухсестринск"
 two_sisters_adj: "Культ Двух Сестёр"
 two_sisters_adherent: "Культист Двух Сестёр"
 two_sisters_adherent_plural: "Культисты Двух Сестёр"
 two_sisters_desc: "Этот амагейский культ поклоняется двум сёстрам-близнецам по имени Тетра и Шава. Сказания гласят, что они могли предсказывать будущее и совершали много чудес при жизни. Однако когда их отец заболел и, казалось, был на смертном одре, две сестры ожесточённо сражались за наследство. Это привело к тому, что обе упали в две реки рядом с городом; одна река превратилась в чисто белую, а другая — в бездонно чёрную. Люди до сих пор утверждают, что чудеса происходят рядом с этими, казалось бы, проклятыми реками."
 two_sisters_old: "Стародаухсестринск"
 two_sisters_old_adj: "Старый культ Двух Сестёр"
 two_sisters_old_adherent: "Старый культист Двух Сестёр"
 two_sisters_old_adherent_plural: "Старые культисты Двух Сестёр"

 azot: "Азотовск"
 azot_adj: "Культ Азота"
 azot_adherent: "Культист Азота"
 azot_adherent_plural: "Культисты Азота"
 azot_desc: "Культ Азота полностью отвергает почитание Арназа «Великого Предка», которого они считают выскочкой-самозванцем с наследием, построенным на одной лишь лжи, и вместо этого поклоняются одноимённому мученическому Богу-Царю Азоту «Великому». В отличие от большинства других своих родичей, они преуменьшают важность воинского мастерства и доблести, вместо этого полагая, что власть в её более общей форме является истинным признаком духовного возвышения. Кроме того, его приверженцы обычно придерживаются веры в то, что Азот однажды вернётся в смертный мир и отомстит детям Арназа."
