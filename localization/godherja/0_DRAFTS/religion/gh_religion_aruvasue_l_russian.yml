 aruvasue: "Арувасуэск"
 aruvasue_adj: "Арувасуэ"
 aruvasue_adherent: "Арувасуэнец"
 aruvasue_adherent_plural: "Арувасуэнцы"
 aruvasue_desc: "Арувасуэ строится на почитании [Concept('aspects_of_aruvas','аспектов')|E] великого Царя-Солнца-Луны, божественного творца мира. Почитать его — значит чтить святость дома и очага, исполнять долг гостеприимства перед почётным гостем и никогда не утаивать то, что предлагается свободно. Соблюдение этих принципов открывает путь в загробную жизнь, где души сами становятся божествами, служа храмам трёх миров."

 ertomax: "Эртомаксистск"
 ertomax_adj: "Эртомаксизм"
 ertomax_adherent: "Эртомаксист"
 ertomax_adherent_plural: "Эртомаксисты"
 ertomax_desc: "Основанный на вере в то, что дух Царя-Солнца-Луны обитает лишь в душах верных, эртомаксизм назван в честь великого $ertomax_link$ Эртомакса#!, которого почитают как самого верного из всех. Считается, что он был единственным человеком, прошедшим [Glossary('Ос Киньер','GH_OS_KINJER_GLOSS')] при жизни, и его смерть от руки безымянного убийцы ничуть не угасила пыл его ревностных сторонников, которые ныне лишь ожидают его неизбежного возвращения."
 ertomax_high_god_name: "$ertomax_link$ Эртомакс#!"
 ertomax_high_god_name_possessive: "$ertomax_link$ Эртомакса#!"
 ertomax_religious_text: "Эртомаксианские свитки"

 rutbay: "Рут'баянск"
 rutbay_adj: "Рут'Бай"
 rutbay_adherent: "Рут'баянец"
 rutbay_adherent_plural: "Рут'баянцы"
 rutbay_desc: "Рут'Бай — это кодекс одиннадцати отступников, которые убили первого падшего «святого», прошедшего [Glossary('Ос Киньер','GH_OS_KINJER_GLOSS')] ещё при жизни. Провозглашая, что ни один живой жрец не способен по-настоящему постичь природу [Glossary('Арува Агата','GH_ARUVA_AGAT_GLOSS')], верные отвергают [Concept('magic','магию')|E], считая её злоупотреблённой искрой божественности, которую человечество украло у Аруваса."

 blorivok: "Блоривокск"
 blorivok_adj: "Блоривок"
 blorivok_adherent: "Блоривокец"
 blorivok_adherent_plural: "Блоривокцы"
 blorivok_desc: "Блоривокцы верят в стремление Аруваса к единству человечества и подчёркивают незначительность таких отвлечений, как война и смертные распри, по сравнению с обещанием вечного спасения. Предлагая более прагматичную и рационалистическую интерпретацию арувасуэнской религиозной философии, блоривокское учение учит, что ответы, которые ищут, часто находятся внутри, а не вовне."

 sarmuyr: "Сар'муйрск"
 sarmuyr_adj: "Сар'муйр"
 sarmuyr_adherent: "Сар'муйрец"
 sarmuyr_adherent_plural: "Сар'муйрцы"
 sarmuyr_desc: "Почитаемая большинством арувасуэнцев, Мать-Меч почитается превыше всего сар'муйрцами, которые считают себя её детьми. Отвергая божественность человеческого духа, они стремятся доказать себя праведными деяниями и заслужить место рядом с Матерью-Мечом в загробной жизни."
 sarmuyr_high_god_name: "$aruvasue_war_god_name$"
 sarmuyr_high_god_name_possessive: "$aruvasue_war_god_name_possessive$"
 sarmuyr_high_god_name_alternate: "Божественный Страж"
 sarmuyr_high_god_name_alternate_possessive: "Божественного Стража"