 aruvasue_religion_desc: "Арувасуэ — это почитание великого Царя-Солнца-Луны Аруваса и [Concept('aspects_of_aruvas','его трёх божественных аспектов')|E], которые вместе объемлют всё творение. Арувасуэнцы верят, что искра божественности присутствует в каждой человеческой душе, и придают большое значение святости дома, очага и обычаям гостеприимства."

