 wardenism_religion: "Варденитск"
 wardenism_religion_adj: "Варденизм"
 wardenism_religion_adherent: "Варденит"
 wardenism_religion_adherent_plural: "Вардениты"
 wardenism_religion_desc: "Для [Concept('wardenism','варденитов')|E] существует два бога, или два аспекта одного и того же бога. Они называют богов Тот, Кто Был, и Мёртвый Бог. Вардениты верят, что зло в мире исходит от Мёртвого Бога, которого Тот, Кто Был, заключил в темницу и поручил человечеству любой ценой удерживать её запечатанной. Говорят, что эта темница состоит из ряда «столпов», которые многие варденитские секты толкуют как духовные добродетели. Они верят, что если не соблюдать эти добродетели, Мёртвый Бог вырвется на свободу. Для этого верные создали сложную систему судов и правовых традиций, где жрецы выступают также судьями, чтобы поддерживать добродетель и порядок, дабы темница Мёртвого Бога устояла перед миром, полным греха и разврата."

