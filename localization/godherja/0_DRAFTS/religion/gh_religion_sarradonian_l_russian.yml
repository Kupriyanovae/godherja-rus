 wardenism: "Татхталийск"
 wardenism_adj: "Татхталий"
 wardenism_adherent: "Татхталиец"
 wardenism_adherent_plural: "Татхталийцы"
 wardenism_desc: "Татхталийцы претендуют на то, чтобы быть основным течением [Concept('wardenism','варденизма')|E], и исторически это предположение не было совсем неверным, поскольку татхталийцы господствуют над наиболее густонаселённым ядром варденитской веры. Хотя они утверждают, что их традиции восходят к векам, к основанию варденизма при [Concept('the_first_warden','самом Первом Вардене')|E], особенности, определяющие это движение, обязаны больше $mamur_tathtali_link$ мамуру IX века от И.С.#!, чьим именем часто называют это движение. Главное различие между татхталийцами и тем, что было до них, заключается в единой и всевластной фигуре [Concept('mamuramat','Мамура')|E], чья власть абсолютна и священна. Именно он обладает последним словом во всех юридических вопросах, именно он ведёт армии верных в военное время и улаживает дела солдат в мирное. Его слово — закон, или, по крайней мере, такова теория."

 harthahi: "Хартахийск"
 harthahi_adj: "Хартахий"
 harthahi_adherent: "Хартахиец"
 harthahi_adherent_plural: "Хартахийцы"
 harthahi_war_god_name: "Пророк Хартах"
 harthahi_war_god_name_possessive: "Хартаха"
 harthahi_desc: "Хартахийская секта возникла в ответ на предполагаемую слабость [Concept('wardenism','варденитов')|E] и убеждение, что варденитские секты слишком терпимы к чужакам. Хартахийцы утверждают, что Мёртвый Бог заключён в [Concept('sarradon','Саррадоне')|E], и всё зло, совершаемое на его земле, является прямой попыткой освободить его обратно в мир. Таким образом, Саррадон должен быть свободен, а его народ должен объединиться против тех, кого хартахийцы считают чужеземными захватчиками — а именно агионистов, [Concept('aversaria','аверсарианцев')|E] и [Concept('marchers','марочников')|E]. Будучи воинственными, они тем не менее довольно плюралистичны и больше озабочены изгнанием враждебных иностранцев, чем уничтожением их населения."

 ruidari: "Руидарийск"
 ruidari_adj: "Руидарий"
 ruidari_adherent: "Руидариец"
 ruidari_adherent_plural: "Руидарийцы"
 ruidari_desc: "Руидарийцы исповедуют «Столп Включения», идею о том, что если кто-то совершает доброе дело, неважно, во имя ли ложного бога оно совершено, оно всё равно поддерживает Столпы Добродетели, удерживающие Мёртвого Бога в темнице. В руидарийских обществах велико влияние мистических орденов и тусуффна, организованных вокруг них. Очень часто они открыты для неверующих, и их духовные наставники пытаются направить их к Столпам Добродетели, а не пытаются обратить их поверхностно."

 kathsiti: "Катситийск"
 kathsiti_adj: "Катситий"
 kathsiti_adherent: "Катситиец"
 kathsiti_adherent_plural: "Катситийцы"
 kathsiti_desc: "Катситийцы, в отличие от других [Concept('wardenism','варденитских')|E] сект, считают, что между церковью и государством должно быть полное разделение, поскольку мирские дела развращают истинную духовную природу церкви. На деле это привело к появлению чрезвычайно независимой и политически влиятельной группы катситийских священников, диктующих правила светским владыкам."

 harfi: "Харфийск"
 harfi_adj: "Харфий"
 harfi_adherent: "Харфиец"
 harfi_adherent_plural: "Харфийцы"
 harfi_desc: "Харфийцы, в отличие от других [Concept('wardenism','варденитских')|E] сект, верят, что «Столпы Добродетели» — это реальные, физические столпы, которые можно найти в материальном мире, и их нужно защищать. Другие варденитские секты отвергают это толкование как комично буквальное и считают любых неироничных последователей харфийских путей отсталыми фундаменталистами."

 haradar: "Харадарийск"
 haradar_adj: "Харадарий"
 haradar_adherent: "Харадариец"
 haradar_adherent_plural: "Харадарийцы"
 haradar_desc: "[Concept('sarradon','Саррадонская')|E] легенда гласит, что десять тысяч лет назад саррадонские военачальники погрязли в разврате и нечестии, и Столпы, удерживающие Мёртвого Бога в Иблисе, начали рушиться. Когда всё казалось потерянным, из Теней появились храбрые и праведные мужи, чтобы истребить этих лжевладык, и снова исчезли в тени. Правдива ли эта легенда или нет, харадарийцы несколько раз основывались и распускались за тысячелетия, до такой степени, что никто точно не знает, как стар этот орден убийц. Последнее основание произошло вскоре после [Concept('frodbrokna','Фродброкна')|E]. Это новое основание пришло к выводу, что после того, как Эшрей сломал мир, ни один [Concept('magi','маг')|E] не может оставаться в живых. Они озабочены главным образом выслеживанием и убийством Магов, особенно тех, кто обладает богоподобной силой."

 asdraqi: "Асдракийск"
 asdraqi_adj: "Асдракий"
 asdraqi_adherent: "Асдракиец"
 asdraqi_adherent_plural: "Асдракийцы"
 asdraqi_desc: "Асдракийцы считают, что все, кто отвергает учения [Concept('the_first_warden','Первого Вардена')|E], активно замышляют освободить Мёртвого Бога, и что нападки язычников на веру — лишь первый шаг в их планах опустошения. Таким образом, главный долг всех [Concept('wardenism','варденитов')|E] — активно нападать на эти враждебные веры, ибо только их полное искоренение спасёт мир от их козней и лжи. Они верят, что Законы Войны всё ещё действуют, и что борьба с неверными не может иметь ограничений. Они отвергают Центральный [mamuramat|E1] как слабый и непригодный для руководства верой, вместо этого выступая за возвращение Западного, Восточного и даже Дальневосточного Мамураматов, а также за создание совершенно новых. Для асдракийцев всё должно служить войне."

 kothori: "Которск"
 kothori_adj: "Которский"
 kothori_adherent: "Которец"
 kothori_adherent_plural: "Которцы"
 kothori_desc: "Смешение [Concept('wardenism','варденитских')|E] религиозных практик с некоторыми традициями, эндемичными для гор Тарсанид, Которский культ включает множество древних богов из старых барзавских пантеонов в веру либо как благосклонных духовных хранителей, либо как святых, причём первая группа часто воплощается в важных судьях, а вторая часто возносится после смерти до почти божественного статуса. Это, естественно, весьма скандально для более широкой варденитской веры, известной своей явной антитеистской позицией, но которцы всегда избегали подавления в основном из-за отдалённости своих горных домов и относительной безвестности своей сельской веры."

 stranuni: "Странунийск"
 stranuni_adj: "Странуний"
 stranuni_adherent: "Странуниец"
 stranuni_adherent_plural: "Странунийцы"
 stranuni_desc: "Экзотическая ветвь [Concept('wardenism','варденизма')|E], отрезанная от варденитских земель, странунийские верования постепенно превратились во что-то поистине странное. Странунийцы считают, что слова и структура этих слов обладают великой силой, и что столпы, удерживающие Мёртвого Бога в темнице, на самом деле являются пятью различными священными формами поэзии и музыки. Они считают, что эти формы должны постоянно практиковаться, а поэты-судьи обязаны знать хотя бы один из стилей. Однако странунийцы считают крайне важным, чтобы эти священные формы не использовались во зло и практиковались только при подобающих обстоятельствах. Это приводит к парадоксальному обществу, где музыка и поэзия одновременно повсеместны и строго регламентированы."

 badari: "Бадарийск"
 badari_adj: "Бадарий"
 badari_adherent: "Бадариец"
 badari_adherent_plural: "Бадарийцы"
 badari_desc: "Главная ересь в глазах большинства их [Concept('wardenism','варденитских')|E] единоверцев, Бадарий — результат попытки синкретизма с дикансинитскими религиозными законами, которая была обнародована фракцией при дворе $mamur_radi_i_link$ мамура Ради#!. Обычно их недолюбливают и считают радикалами, несмотря на их неоднократные попытки доказать обратное, бадарийцев едва терпят даже их агионистские «друзья», которые видят в них скорее плохую шутку, чем серьёзных союзников."

 aarayi: "Аарайийск"
 aarayi_adj: "Аарайи"
 aarayi_adherent: "Арайиец"
 aarayi_adherent_plural: "Арайийцы"
 aarayi_desc: "Означая «регентство», Аарайи родились, когда $mamur_tathtali_link$ Татхтали#! объединил Восточный и Западный Мамураматы, приведя с собой большую часть обременённых судов Востока. Однако несколько этих судов отказались последовать за ним. Собравшись вокруг верховного судьи, ставшего военачальником Афнааном, они опровергли притязания Татхтали на право по браку. При отсутствии какого-либо законного кандидата, который мог бы заменить Татхтали, Высокий Суд Востока — институт, созданный по настоянию Афнаана — должен был служить регентом до тех пор, пока не найдётся законный наследник Востока. Учитывая полное, по-видимому, исчезновение матрилинейной линии семьи Заахира — за исключением детей Санад от Татхтали, которые были незаконнорождёнными из-за узурпации их отца — эта последняя цель оказалась несколько труднодостижимой.\n\nВысокий Суд Востока на протяжении веков поддерживал нескольких надеющихся претендентов на трон, и хотя им ещё не удалось добиться успеха, упрямые арайийские судьи верят, что это лишь вопрос времени, когда татхталийская ересь будет свергнута."

 mukaasubat: "Мукаасубийск"
 mukaasubat_adj: "Мукаасубат"
 mukaasubat_adherent: "Мукаасубит"
 mukaasubat_adherent_plural: "Мукаасубиты"
 mukaasubat_desc: "После краха [GetTitleByKey('e_far_eastern_mamuramat').GetNameNoTier] мукаасубиты уверовали, что Столпы Добродетели начали рушиться. Когда книги, оставленные упразднённым государством, начали гнить, благочестивые начали вырезать замены на больших каменных плитах и хоронить судей вместе с их судебниками. Это, по их мнению, снабдит их необходимыми материалами для восстановления столпов в загробной жизни. Однако по мере того, как столпы продолжают рушиться, освобождаются «кебан седжан» — духи добродетели, которые могут вселяться в благочестивых и добрых смертных и наделять их великой мудростью."

 labaqiri: "Лабакирийск"
 labaqiri_adj: "Лабакирий"
 labaqiri_adherent: "Аабакирит"
 labaqiri_adherent_plural: "Аабакириты"
 labaqiri_desc: "Ответвление странунийской веры, практикуемое торговцами Киринарт, которые позже стали дафанитами, лабакириты верят, что источник силы внутри Священной Горы Дахангона — не кто иной, как сам Мёртвый Бог, заключённый в её недоступных глубинах.\n\nУнаследовав музыкальные верования странунийцев, практикующие эту секту имеют множество защитных песнопений и песен, а во время солнцестояний и затмений устраивают празднества с какофонией шумов, чтобы отогнать зло."

 holy_order_judicial_legion: "Судебный легион"
 holy_order_mamuramia: "Мамурамия"
 holy_order_radi_knights: "Люди Ради"
 holy_order_wardens: "Стражи"