 saratan_religion: "Саратаратинск"
 saratan_religion_adj: "Саратарат"
 saratan_religion_adherent: "Саратаратинец"
 saratan_religion_adherent_plural: "Саратаратинцы"
 saratan_religion_desc: "Саратарат — это пацифистская океаническая религия, основанная на почитании саратанов из кратера Кезимин. Саратаратины верят, что саратаны были первыми стражами мира, а также первыми существами, и что их движения образовали моря и [Concept('aeras','Эрас')|E], которые кружились вокруг них, формируя реальность и саму вселенную.\n\n[Concept('sarataratin_militarism','Бедствие заставило саратаратинов отказаться почти от всякого насилия')|E], и теперь они ведут скромную жизнь, рыбача в морях вокруг саратанов и торгуя с материковыми жителями."

