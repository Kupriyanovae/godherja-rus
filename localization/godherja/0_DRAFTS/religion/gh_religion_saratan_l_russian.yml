 saratarat_desc: "Саратарат — это пацифистская океаническая религия, основанная на почитании саратанов из кратера Кезимин. Саратаратины верят, что саратаны были первыми стражами мира, а также первыми существами, и что их движения образовали моря и [Concept('aeras','Эрас')|E], которые кружились вокруг них, формируя реальность и саму вселенную.\n\n[Concept('sarataratin_militarism','После великого бедствия')|E], верные присягнули пацифизму и теперь ведут скромную жизнь рыбаков и торговцев."
 
 saratadibe: "Саратадибск"
 saratadibe_adj: "Саратадибе"
 saratadibe_adherent: "Саратадибец"
 saratadibe_adherent_plural: "Саратадибцы"
 saratadibe_desc: "Саратадибцы верят, что саратаны образовали мир из своего медленного движения по морям, они также верили, что саратан может родиться только в том случае, если кто-то умрёт. Таким образом, хотя смерть саратана была печальным событием для всех верных, она тем не менее была естественной и, следовательно, допустимой, чтобы убить зверя при необходимости, хотя это и оставалось спорным.\n\nДо того, как это верование было удалено из веры, те, кто жил на саратанах, часто участвовали в клановых войнах и набегах. Обычно это происходило в виде того, что племена саратанов выпускали стрелы друг в друга, когда два из них проходили мимо, и спускали лодки с бортов, чтобы абордировать другого и разграбить их товары. Со смертью половины всех саратанов и бесчисленных других верных во время [Concept('the_decimation_of_sarradon','Халакдуна')|E], [Concept('sarataratin_militarism','верные приняли новый пацифистский взгляд')|E]."