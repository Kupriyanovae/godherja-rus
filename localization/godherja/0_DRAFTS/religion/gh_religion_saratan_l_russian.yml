 saratadibe_desc:0 "Саратадибцы верят, что саратаны сформировали мир своим медленным движением по морям. Они также считали, что новый саратан может родиться только в том случае, если один из них умрёт. Таким образом, хотя смерть саратана была печальным событием для всех верующих, убить зверя при необходимости считалось естественным и потому приемлемым, пусть и оставалось спорным делом.\n\nДо того как это убеждение было искоренено из веры, те, кто жил на саратанах, часто участвовали в клановых войнах и набегах. Обычно это происходило в виде того, что племена саратанов осыпали друг друга стрелами, когда два исполина проходили мимо, и спускали лодки по бортам, чтобы взять чудище противника на абордаж и разграбить их товары. После гибели половины всех саратанов и бесчисленного множества других верующих во время [Concept('the_decimation_of_sarradon','Халакдуна')|E], [Concept('sarataratin_militarism','верующие сформировали новое пацифистское мировоззрение')|E]."