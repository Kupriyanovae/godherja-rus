 saratan_religion_desc:0 "Саратарат — это пацифистская океаническая религия, основанная на поклонении саратанам кратера Кезимин. Саратаратийцы верят, что саратаны были первыми защитниками мира, а также первыми существующими существами, и что их движения сформировали моря и [Concept('aeras','Аэрас')|E], которые закружились вокруг них, образовав саму реальность и вселенную.\n\n[Concept('sarataratin_militarism','Бедствие заставило саратаратинцев отказаться от почти любого насилия')|E], и теперь они ведут скромную жизнь, ловя рыбу в морях вокруг саратанов и торгуя с жителями материка."

