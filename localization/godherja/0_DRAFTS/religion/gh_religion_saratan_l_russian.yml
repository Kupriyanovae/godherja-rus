 saratan_religion_desc: "Саратарат — это пацифистская океаническая религия, основанная на почитании [Glossary('саратанов','GH_SARATAN_GLOSS')] из [Glossary('кратера Кезимин','crater_encyclopedia_desc')]. Саратаратины верят, что саратаны были первыми стражами мира, а также первыми существами, и что их движения образовали моря и [aeras|E], которые кружились вокруг них, формируя реальность и саму вселенную.\n\n[Concept('sarataratin_militarism','Бедствие заставило саратаратинов отказаться почти от всякого насилия')|E], и теперь они ведут скромную жизнь, рыбача в морях вокруг саратанов и торгуя с материковыми жителями."

 
 
