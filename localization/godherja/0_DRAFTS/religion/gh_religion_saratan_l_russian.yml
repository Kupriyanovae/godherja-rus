 saratarat_desc:0 "Саратарат — это пацифистская океаническая религия, основанная на поклонении саратанам кратера Кезимин. Саратаратийцы верят, что саратаны были первыми защитниками мира, а также первыми существующими существами, и что их движения сформировали моря и [Concept('aeras','Аэрас')|E], которые закружились вокруг них, образовав саму реальность и вселенную.\n\n[Concept('sarataratin_militarism','После великого бедствия')|E] верующие посвятили себя пацифизму и теперь ведут скромную жизнь рыбаков и торговцев."
 
