 kardawai: "Кардавайск"
 kardawai_adj: "Кардавай"
 kardawai_adherent: "Кардаваец"
 kardawai_adherent_plural: "Кардавайцы"
 kardawai_desc: "Кардавайцы прибыли в известный мир вместе с сьялволькским вторжением. Хотя их отвергали как варваров-каннибалов, мужчины Кардавая готовят и вкушают куски мяса своих павших врагов, чтобы почтить победу бога Кардвена и его братьев над их жестоким отцом Мавлоком. Кардавайцы верят, что после смерти только те, кто сможет предоставить доказательства убитых ими врагов при жизни, смогут пировать рядом с богами за столом Кардвена."
