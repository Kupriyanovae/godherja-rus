 benkassai_adherent: "Бенкассаец"
 benkassai_adherent_plural: "Бенкассайцы"
 benkassai_desc: "Бенкассаи верят, что, хотя Кардвен требует вкушения плоти, поскольку это священный акт, плоть не может быть добыта насильственными средствами. Эта откровенно еретическая секта никогда не была многочисленной, но некоторые общины бенкассаев всё ещё сохраняют свой пацифистский каннибализм, несмотря на отвращение как со стороны кардавайцев, так и неверных."
