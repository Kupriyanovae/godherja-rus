 kardawai_religion_desc: "Согласно кардавайским преданиям, великий Титан Мавлок правил миром железной рукой. Его сыновья голодали, пока он заставлял их создавать огромные статуи себя самого. Его слуги, лотброки, злобно хохотали, избивая сыновей Мавлока до покорности. Но однажды старший сын Кардвен восстал против своих жестоких господ и пожрал лотброков. Кардвен обрёл силу лотброков и повёл свой народ к победе над жестоким Тиганом. Кардвен разделил труп мёртвого Титана между своими многочисленными сыновьями, и те, кто вкусил его, стали богами этого мира."

