l_russian:
 sheticad: "Шетикадск"
 sheticad_adj: "Шетикадизм"
 sheticad_adherent: "Шетикадец"
 sheticad_adherent_plural: "Шетикадцы"
 sheticad_desc: "Шетикадизм — это древняя система верований шетиканцев, почти забытого народа из западных Клановых земель.\n\nВеря в бога Эфиоса, шетиканцы утверждают, что их бог погиб, сражаясь со вторым солнцем, которое было уничтожено в битве и взорвалось, превратившись в звёзды на небе. Шетикадцы верят, что новые звёзды слились с сущностью мёртвого бога, и что судьбу и пророчества теперь можно предсказывать, изучая их — древняя божественная воля Эфиоса всё ещё мерцает в каждой из них."
 sheticad_old: "Старошетикадск"
 sheticad_old_adj: "Старый шетикадизм"
 sheticad_old_adherent: "Старый шетикадец"
 sheticad_old_adherent_plural: "Старые шетикадцы"

 kathanouxiac_adj: "Катануксиацизм"
 kathanouxiac_adherent: "Катануксиакец"
 kathanouxiac_adherent_plural: "Катануксиакцы"
 kathanouxiac_desc: "Хотя почитание «[Concept('magi','Короля-волшебника')|E]» никогда не было популярным, настояние Катанукса на том, что он является законным богом и правителем [Concept('aeras','Эраса')|E], часто подкреплялось остриём посоха и собрало достаточно последователей за века его правления, чтобы сохраниться и после его смерти. Катануксиакцы верят, что Катанукс не умер, а вознёсся, и используют таинственный термин «Волшебник» для своего жречества в честь него, в надежде, что их грозный повелитель пощадит их при своём возвращении."
 kathanouxiac_old: "Старокатануксиакск"
 kathanouxiac_old_adj: "Старый катануксиацизм"
 kathanouxiac_old_adherent: "Старый катануксиакец"
 kathanouxiac_old_adherent_plural: "Старые катануксиакцы"

 ethylisiac: "Этилисиакск"
 ethylisiac_adj: "Этилисиацизм"
 ethylisiac_adherent: "Этилисиак"
 ethylisiac_adherent_plural: "Этилисиаки"
 ethylisiac_desc: "Этилисиацизм — это вера племён этилисиадов. Этилисиады верили, что все люди являются рабами сложного пантеона жестоких богов, и что их собственный народ был избран богами, чтобы быть господами над другими рабами. Общество этилисиаков строго стратифицировано, и считается, что только те, кто владеет собственным рабом, достойны какого-либо положения в обществе.\n\nБудучи крайне милитаристскими, движения этилисиаков часто полностью определяются внешней экспансией и захватом новых тел рабов для распределения среди поклоняющихся племён."
 ethylisiac_old: "Староэтилисиакск"
 ethylisiac_old_adj: "Старый этилисиацизм"
 ethylisiac_old_adherent: "Старый этилисиак"
 ethylisiac_old_adherent_plural: "Старые этилисиаки"

 odyrian: "Одирийск"
 odyrian_adj: "Одирианизм"
 odyrian_adherent: "Одирианец"
 odyrian_adherent_plural: "Одирианцы"
 odyrian_desc: "Одирианизм — это почитание военачальников Одира Тена, Одира Ллета и Одира Хуне. Будучи мятежниками против древнего Храма Горного Солнца, а затем и против [Concept('aversaria','прото-аверсарианцев')|E], Одиры восстали в 65, 87 и 109 годах соответственно. По сей день ведутся горячие споры о том, были ли Одиры родственниками, брали ли имена предшественников из уважения, или же Одир был неким древним титулом из единой культуры.\n\nНезависимо от этого, Одиры оказались проницательными как администраторами, так и воинами, каждый из них организовывал значительные восстания против любого царства, под властью которого они жили, несмотря на жестокие расправы. Одирианцы верят, что Одиры были реинкарнациями древнего бога Одиранона, и что однажды последний «Одир Торм» восстанет и вернёт себе трон небес, чтобы вести все народы. Хотя за столетия после Одира Хуне появилось более дюжины лже-Одиров, ни один из них не доказал, что достоин этого титула."
 odyrian_old: "Староодирийск"
 odyrian_old_adj: "Старый одирианизм"
 odyrian_old_adherent: "Старый одирианец"
 odyrian_old_adherent_plural: "Старые одирианцы"

 orphecian: "Орфецианск"
 orphecian_adj: "Орфецианизм"
 orphecian_adherent: "Орфецианец"
 orphecian_adherent_plural: "Орфецианцы"
 orphecian_desc: "Орфецианизм — это почитание трёх аспектов бога Орфеции: «Крови», «Камня» и «Воздуха», представленных соответственно солнцем, луной и молнией. Орфецианское общество придавало большое значение [Concept('magi','магам')|E] как представителям воли аспектов Орфеции, и конклавы Магов, представляющих каждый аспект, возглавляли большинство орфецианских царств.\n\nСамым известным орфецианским царством был [Concept('kartharadd','Империум Картарадд')|E], который вторгся в [Concept('aversaria','Аверсарию')|E] во время [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E] и завоевал провинцию Малькоя, достигнув западной Опахасии, прежде чем был остановлен. После их поражения аверсарианская расправа была быстрой, и орфецианская вера была искоренена везде, где её находили."
 orphecian_old: "Староорфецианск"
 orphecian_old_adj: "Старый орфецианизм"
 orphecian_old_adherent: "Старый орфецианец"
 orphecian_old_adherent_plural: "Старые орфецианцы"

 mountain_sun_temple: "Горносолнечн"
 mountain_sun_temple_adj: "Храм Горного Солнца"
 mountain_sun_temple_adherent: "Последователь Храма Горного Солнца"
 mountain_sun_temple_adherent_plural: "Последователи Храма Горного Солнца"
 mountain_sun_temple_desc: "«Последователи» Храма Горного Солнца, как они сами себя называют, поклоняются горе, ныне известной как [GetBuilding('01_vounill').GetName]. Доктрина последователей утверждает, что существует двадцать главных богов и восемьдесят духов и демонов, и их эзотерические методы слишком сложны и запутанны для понимания кем-либо, кто не посвятил себя их изучению. Последователи верят, что никто, кроме понимающих их, не может править, и исторически Храм Горного Солнца полностью управлялся теократическим классом монашеских орденов, главный из которых располагался у самого [GetBuilding('01_vounill').GetName].\n\nКогда Храм Горного Солнца — как религия, так и царство — был завоёван [Concept('aversaria','аверсарианцами')|E], многие из их верований и структур были включены в их религию. Наиболее примечательно то, что Храм Горного Солнца всё ещё технически существует как «Алые Избранники» — аверсарианский орден воинов-монахов, защищающих храмы [GetBuilding('01_vounill').GetName]."
 mountain_sun_temple_old: "Старо-горносолнечн"
 mountain_sun_temple_old_adj: "Старый Храм Горного Солнца"
 mountain_sun_temple_old_adherent: "Старый последователь Храма Горного Солнца"
 mountain_sun_temple_old_adherent_plural: "Старые последователи Храма Горного Солнца"

 eiyos: "Эйосск"
 eiyos_adj: "Эйос"
 eiyos_adherent: "Эйосец"
 eiyos_adherent_plural: "Эйосцы"
 eiyos_desc: "Эйос — это вера в 1001 Бога Эйоса, далёкого царства на небесах, которое зеркально отражает то, в котором обитают люди. Эйосцы верят, что всё, что 1001 Бог делает в Эйосе, будет зеркально отражено в нашем мире, намереваются они того или нет, и такие явления, как грозы или хороший урожай, являются результатом войны или рождения в Эйосе. Хотя боги Эйоса редко взаимодействуют с материальным миром, те, кто не поклоняется им должным образом, подвергаются суровому возмездию в случае неудачи — великие столпы огня или молнии разрушают города, пока их последователи не исправят свои пути."
 eiyos_old: "Староэйосск"
 eiyos_old_adj: "Старый Эйос"
 eiyos_old_adherent: "Старый эйосец"
 eiyos_old_adherent_plural: "Старые эйосцы"

 asred: "Асреддийск"
 asred_adj: "Асред"
 asred_adherent: "Асреддиец"
 asred_adherent_plural: "Асреддийцы"
 asred_desc: "Асред — это вера в бога Асреда, Того, чьим молоком питается мир и под чьим бичом страдает. В асреддийской вере Асред родил весь мир и его народ из своих чресл, а затем воспитал их, чтобы они вечно питали его своей кровью.\n\nАсреддийские последователи традиционно милитаристичны, веря, что Асред не будет доволен, если они не будут постоянно проливать кровь других или свою собственную, будь то в битве или в ритуале."
 asred_old: "Староасреддийск"
 asred_old_adj: "Старый Асред"
 asred_old_adherent: "Старый асреддиец"
 asred_old_adherent_plural: "Старые асреддийцы"

 tegonian: "Тегонистск"
 tegonian_adj: "Тегонианизм"
 tegonian_adherent: "Тегонист"
 tegonian_adherent_plural: "Тегонисты"
 tegonian_desc: "Тегонианизм — это древние верования народа сейшесков, нынешнего Пергикоса. Тегонисты верят, что провидцы, в основном Тарка и Вагас, открыли эту веру сейшескам после того, как обнаружили присутствие богов в шести видениях. Во сне Они объявили, что разочарованы тем, что их дети забыли, как поклоняться им, и потребовали верности сейшесков, иначе сам мир будет уничтожен великим облаком яда.\n\nТегонистские обряды диктуют, что почти никакое действие не может быть совершено без предварительной консультации с богами. Даже такие тривиальные вещи, как что надеть или по какой стороне улицы идти, должны быть решены богами."
 tegonian_old: "Старотегонистск"
 tegonian_old_adj: "Старый тегонианизм"
 tegonian_old_adherent: "Cтарый тегонист"
 tegonian_old_adherent_plural: "Cтарые тегонисты"

 theryionist: "Терионистск"
 theryionist_adj: "Терионизм"
 theryionist_adherent: "Терионист"
 theryionist_adherent_plural: "Терионисты"
 theryionist_desc: "Терионисты поклоняются Териону, «Последнему Дракону», древнему [Concept('aversaria','аверсарианскому')|E] претенденту на Империю.\n\nВнучатый племянник аавтократии $aauto_maklea_link$ Маклеи#!, Терион был тайно воспитан с целью вернуть трон, который его семья считала украденным Маклеей. Когда дед Териона умер, Терион в возрасте 20 лет вышел из укрытия и напал на Аверсарию, охваченную гражданской войной. Верхом на виверне вместо (считавшихся вымершими) драконов, Терион начал Вдовью войну и быстро стал легендой, даже его враги называли его «Последним Драконом» в знак признания его приверженности старой чести и идеалам домаклейской Аверсарии. Война закончилась лишь его предполагаемой смертью после почти 40 лет ожесточённых боёв. Терионисты утверждают, что Терион был духом в человеческом обличье, который просто вознёсся, чтобы вершить кровавое правосудие на небесах. Терионистское верование гласит, что Терион направляет мир из эфемерного [Concept('first_empire','Первого Города')|E], и однажды вернётся, переродившись как [Concept('aersanon','Чистейший')|E], чтобы вернуть свой законный трон."
 theryionist_old: "Старотерионистск"
 theryionist_old_adj: "Старый терионизм"
 theryionist_old_adherent: "Старый терионист"
 theryionist_old_adherent_plural: "Старые терионисты"

 arthenaxian: "Артенаксианск"
 arthenaxian_adj: "Артенаксианизм"
 arthenaxian_adherent: "Артенаксианист"
 arthenaxian_adherent_plural: "Артенаксианисты"
 arthenaxian_desc: "Артенаксианисты поклоняются [arthenax|E], последнему известному [Concept('dragons','Дракону')|E] в [Concept('aversaria','Аверсарии')|E]. Спустя три столетия после истребления и предполагаемого вымирания драконов, Артенакс и её выводок вошли в Аверсарию и грабили царство почти десять лет, прежде чем были убиты аавтократией Элиадией. Артенакс в своей гордости требовала поклонения, и хотя её культ никогда не был популярен, он, тем не менее, оказался живучим."
 arthenaxian_old: "Староартенаксианск"
 arthenaxian_old_adj: "Старый артенаксианизм"
 arthenaxian_old_adherent: "Старый артенаксианист"
 arthenaxian_old_adherent_plural: "Старые артенаксианисты"