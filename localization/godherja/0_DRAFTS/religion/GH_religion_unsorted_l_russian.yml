l_russian:
 sheticad: "Шетикадск"
 sheticad_adj: "Шетикадиз"
 sheticad_adherent: "Шетикаддер"
 sheticad_adherent_plural: "Шетикаддеры"
 sheticad_desc: "Шетикадизм — это древняя система верований шетиканцев, почти забытых людей из западных Клановых земель.\n\nСчитая своим богом Этиоса, шетиканцы утверждают, что их бог погиб в битве со вторым солнцем, которое было уничтожено и взорвалось, превратившись в звезды на небе. Шетикаддеры считают, что новые звезды слились с сущностью погибшего бога, и что судьбу и пророчество теперь можно предсказывать, изучая их, ведь древняя божественная воля Этиоса продолжает мерцать в каждой из них."
 sheticad_old: "Старошетикадск"
 sheticad_old_adj: "Старый Шетикад"
 sheticad_old_adherent: "Старошетикаддер"
 sheticad_old_adherent_plural: "Старошетикаддеры"

 kathanouxiac_adj: "Катануксиацизм"
 kathanouxiac_adherent: "Катануксиацианец"
 kathanouxiac_adherent_plural: "Катануксиацианцы"
 kathanouxiac_desc: "Хотя почитание '[Concept('magi','Короля-Чародея')|E]' никогда не пользовалось широкой популярностью, настойчивость Катануксии о том, что он является истинным богом и правителем [aeras|E], часто подкреплялась остриями посохов. Это собрало достаточно последователей за столетия его правления, чтобы вера сохранилась даже после его смерти. Катануксиацианцы верят, что Катануксиа не умер, а вознесся. Они используют загадочный термин «Чародей» для своего священства в его честь, надеясь, что их грозный владыка избавит их при своем возвращении."
 kathanouxiac_old: "Старокатануксиакск"
 kathanouxiac_old_adj: "Старый Катануксиак"
 kathanouxiac_old_adherent: "Старокатануксиацианец"
 kathanouxiac_old_adherent_plural: "Старокатануксиацианцы"

 ethylisiac: "Этилисиакск"
 ethylisiac_adj: "Этилисиацизм"
 ethylisiac_adherent: "Этилисиак"
 ethylisiac_adherent_plural: "Этилисиаки"
 ethylisiac_desc: "Этилисиацизм — это вера этилисиадских племен. Этилисиады верили, что все люди являются рабами сложного пантеона жестоких богов, и что их собственный народ был избран богами, чтобы быть повелителями других рабов. Этилисиакское общество сильно стратифицировано, и считается, что только те, кто владеет рабом, достойны какой-либо позиции в обществе.\n\nКрайне милитаристичный, этилисиакский уклад часто полностью определяется внешней экспансией и обеспечением новых рабов, которые распределяются среди поклоняющихся племен."
 ethylisiac_old: "Староэтилисиакск"
 ethylisiac_old_adj: "Старый Этилисиац"
 ethylisiac_old_adherent: "Старый Этилисиак"
 ethylisiac_old_adherent_plural: "Старые Этилисиаки"
 
 odyrian: "Одириан"
 odyrian_adj: "Одирианизм"
 odyrian_adherent: "Одирианец"
 odyrian_adherent_plural: "Одирианцы"
 odyrian_desc: "Одирианизм — это поклонение военачальникам Одир Тену, Одир Ллету и Одир Хуну. Восстав против древнего Храма Горного Солнца, а затем и [Concept('proto_aversarians','протоаверсарианцы')|E], Одиры поднялись в 65, 87 и 109 годах соответственно. По сей день ведутся споры о том, были ли Одиры родственниками, взяли ли они имена своих предшественников из уважения или же «Одир» был древним титулом одной культуры.\n\nКак бы то ни было, Одиры доказали, что они мудрые администраторы и воины, каждый из которых организовал значительные восстания против господствующих держав, несмотря на жестокие репрессии. Одирианцы верят, что Одиры были реинкарнациями древнего бога Одиранона, и что однажды появится финальный «Одир Торм», который вернет себе трон небес и поведет все народы. Хотя с момента восстания Одира Хуна появилось более десятка лжедиров, ни один из них так и не доказал, что достоин этого титула."
 odyrian_old: "Староодириан"
 odyrian_old_adj: "Старый Одирианизм"
 odyrian_old_adherent: "Старый Одирианец"
 odyrian_old_adherent_plural: "Старые Одирианцы"

 orphecian: "Орфецианск"
 orphecian_adj: "Орфецианизм"
 orphecian_adherent: "Орфецианец"
 orphecian_adherent_plural: "Орфецианцы"
 orphecian_desc: "Орфецианизм — это поклонение трем аспектам бога Орфеции: «Крови», «Камню» и «Воздуху», которые представлены солнцем, луной и молнией соответственно. Орфецианское общество придавало большое значение [Concept('magi','маги')|E] как представителям воли аспектов Орфеции, а конклавы магов, представляющие каждый аспект, возглавляли большинство орфецианских государств.\n\nСамым известным орфецианским государством была [Concept('kartharadd','Империя Картарадд')|E], которая вторглась в [Concept('aversaria','Аверсарию')|E] во время [Concept('chaos_of_the_seventh_century','хаоса седьмого века')|E] и захватила провинцию Малкоис, дойдя до западной Опахасии, прежде чем была остановлена. После их поражения месть Авверсарийцев была стремительной, и орфецианская вера была искоренена там, где ее находили."
 orphecian_old: "Староорфецианск"
 orphecian_old_adj: "Старый Орфецианизм"
 orphecian_old_adherent: "Старый Орфецианец"
 orphecian_old_adherent_plural: "Старые Орфецианцы"

 mountain_sun_temple: "Горно-солнечск"
 mountain_sun_temple_adj: "Храм Горного Солнца"
 mountain_sun_temple_adherent: "Последователь"
 mountain_sun_temple_adherent_plural: "Последователи"
 mountain_sun_temple_desc: "«Последователи» Храма Горного Солнца, как они себя называют, поклоняются горе, которая теперь называется [GetBuilding('01_vounill').GetName]. Доктрина последователей утверждает, что существует двадцать великих богов и восемьдесят духов и демонов, а их эзотерические методы слишком сложны и запутаны для понимания кем-либо, кроме тех, кто посвятил себя их изучению. Последователи верят, что никто, кроме тех, кто понимает эти методы, не может править, и исторически Храм Горного Солнца полностью управлялся теократическим классом монашеских орденов, главный из которых находился непосредственно в [GetBuilding('01_vounill').GetName].\n\nКогда Храм Горного Солнца, как религия и как государство, был завоеван [Concept('aversaria','аверсарианцами')|E], многие из их верований и структур были включены в религию завоевателей. Наиболее примечательно то, что Храм Горного Солнца технически все еще существует как «Алая Стража», аверсарианский орден воинов-монахов, защищающих храмы [GetBuilding('01_vounill').GetName]."
 mountain_sun_temple_old: "Старо горного-солнечск"
 mountain_sun_temple_old_adj: "Старый Храм Горного Солнца"
 mountain_sun_temple_old_adherent: "Старый последователь"
 mountain_sun_temple_old_adherent_plural: "Старые последователи"

 eiyos: "Эй'йосианск"
 eiyos_adj: "Эй'йос"
 eiyos_adherent: "Эй'йосиайтун"
 eiyos_adherent_plural: "Эй'йосиайтуны"
 eiyos_desc: "Эй'йос — это вера в 1001 Бога Эй'йоса, далекого царства на небесах, которое отражает мир, в котором обитают люди. Эй'йосиайтуны верят, что все, что делают 1001 Бог в Эй'йосе, будет зеркально отражаться в нашем мире, намеренно или нет. Например, такие явления, как грозы или удачный урожай, являются результатом войны или рождения в Эй'йосе. Хотя боги Эй'йоса редко взаимодействуют с материальным миром, те, кто не поклоняется им должным образом, подвергаются жестоким карам: города могут быть разрушены огненными столпами или молниями до тех пор, пока последователи не исправят свои пути."
 eiyos_old: "Староэй'йосианск"
 eiyos_old_adj: "Старый Эй'йос"
 eiyos_old_adherent: "Старый Эй'йосиайтун"
 eiyos_old_adherent_plural: "Старые Эй'йосиайтуны"
 
 asred: "Асредск"
 asred_adj: "Асред"
 asred_adherent: "Асредианец"
 asred_adherent_plural: "Асредианцы"
 asred_desc: "Асред — это вера в бога Асреда, Того, чьим молоком питается мир и под чьей плетью он страдает. Согласно верованиям Асреди, Асред породил весь мир и его народы из своих чресел, а затем возвысил их, чтобы они вечно питали Его своей кровью.\n\nПоследователи Асреди традиционно милитаристичны, так как считают, что Асред будет удовлетворен только в том случае, если они постоянно проливают кровь — либо чужую, либо свою собственную, будь то в бою или в ритуале."
 asred_old: "Староасредск"
 asred_old_adj: "Старый Асред"
 asred_old_adherent: "Старый Асредианец"
 asred_old_adherent_plural: "Старые Асредианцы"

 tegonian: "Тегонианск"
 tegonian_adj: "Тегонианизм"
 tegonian_adherent: "Тегонианец"
 tegonian_adherent_plural: "Тегонианцы"
 tegonian_desc: "Тегонианизм представляет собой древние верования сейческийского народа, обитавшего на территории современного Пергикоса. Тегониане верят, что провидцы, главным образом Тарка и Вагас, открыли сейческийцам эту веру после того, как божественное присутствие явилось им через шесть видений. В своем послании боги заявили, что разочарованы в своих детях, которые забыли, как их почитать, и потребовали верности от сейческийцев, угрожая уничтожить мир огромным облаком яда, если те откажутся.\n\nОбряды тегонианизма предписывают, что практически ни одно действие не может быть выполнено без предварительного совета с богами. Даже такие незначительные вещи, как выбор одежды или стороны улицы для прогулки, должны быть решены богами."
 tegonian_old: "Старотегонианск"
 tegonian_old_adj: "Старый Тегонианизм"
 tegonian_old_adherent: "Старый Тегонианец"
 tegonian_old_adherent_plural: "Старые Тегонианцы"

 theryionist: "Терионистск"
 theryionist_adj: "Терионизм"
 theryionist_adherent: "Терионист"
 theryionist_adherent_plural: "Терионисты"
 theryionist_desc: "Терионисты поклоняются Териону, «Последнему Дракону», древнему [Concept('aversaria','аверсарианскому')|E] претенденту на Империю.\n\nБудучи внучатым племянником Автократа Маклеи, Терион был воспитан в тайне с целью вернуть трон, который его семья считала украденным Маклеей. Когда дед Териона умер, Терион в возрасте 20 лет вышел из укрытия и начал гражданскую войну в Аверсарии. Он летал на виверне вместо (считавшихся) вымерших драконов, начав Вдовью войну, и вскоре стал легендой, даже его враги прозвали его «Последним Драконом» в знак признания его верности старой чести и идеалам до-Маклеанской Аверсарии. Война закончилась лишь его предполагаемой смертью спустя почти 40 лет ожесточенных сражений. Терионисты утверждают, что Терион был духом в человеческой форме, который просто вознесся, чтобы вершить кровавую справедливость на небесах. Верования терионистов гласят, что Терион управляет миром из эфемерного Первого Города и однажды вернется, переродившись как [Concept('aersanon','Чистейший')|E], чтобы вернуть себе свой законный трон."
 theryionist_old: "Старотерионистск"
 theryionist_old_adj: "Старый Терионизм"
 theryionist_old_adherent: "Старый Терионист"
 theryionist_old_adherent_plural: "Старые Терионисты"

 arthenaxian: "Артенаксианск"
 arthenaxian_adj: "Артенаксианизм"
 arthenaxian_adherent: "Артенаксианист"
 arthenaxian_adherent_plural: "Артенаксианисты"
 arthenaxian_desc: "Артенаксианисты поклоняются [Concept('arthenax','Артенакс')|E], последнему известному [Concept('dragons','дракону')|E] в [Concept('aversaria','Аверсарии')|E]. Спустя три столетия после истребления и предполагаемого вымирания драконов Артенакс и ее потомство вторглись в Аверсарию и грабили земли почти десятилетие, пока не были убиты Автократией Аэлиадиас. Артенакс в своей гордости требовала поклонения, и хотя её культ никогда не был широко популярен, он, тем не менее, доказал свою устойчивость."
 arthenaxian_old: "Староартенаксианск"
 arthenaxian_old_adj: "Старый Артенаксианизм"
 arthenaxian_old_adherent: "Старый Артенаксианист"
 arthenaxian_old_adherent_plural: "Старые Артенаксианисты"