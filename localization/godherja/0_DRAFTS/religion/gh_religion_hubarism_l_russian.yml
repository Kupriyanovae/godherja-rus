 hubarism_desc: "Хубариты рассматривают [Concept('magi','магов')|E], получивших свои дары от Солнца, как хранителей его воли и блюстителей закона. Эта система Магов-судей была эффективна с незапамятных времён, но в последнее время её судьба изменилась. Столетия религиозных конфликтов с [Concept('wardenism','варденитами')|E], [Concept('ritualism','ритуалистами')|E] и, наконец, с агионистами значительно ослабили их власть, и ныне хубариты — лишь тень того, чем они были когда-то."

