 hubarism_religion_desc: "Хубариты являются частью древней веры в [Concept('sarradon,'Саррадоне')|E], практикующую [Concept('living_magi','живую магию')|E] с самых ранних времён записанной истории. В центре веры находится Солнце — источник всего сущего, чьи благословения нисходят на [Concept('magi','магов')|E] как лучи света, озаряющие посевы. Когда Солнце движется по небу, оно переносит души умерших в своё царство, где вершит суд в ночное время. Противником Солнца является Олюм, который посылает своего аватара — [Concept('aervalr','Луну')|E] — чтобы охотиться на Солнце во время ночи."

