 #iyrossi Loc
 iyrossi:0 "Ийросск"
 iyrossi_adj:0 "Ийросси"
 iyrossi_adherent:0 "Ийросси"  
 iyrossi_adherent_plural:0 "Ийросси"  
 iyrossi_desc:0 "Вера Ийросси не практиковалась открыто с тех пор, как во втором веке их земли были захвачены и полностью оккупированы [Concept('aversaria','аверсарианцами')|E]. Несколько их ритуалов были поглощены аверсарианской верой, чтобы удерживать теперь уже порабощённых Ийросси в покорности, но многие продолжали тайно следовать заповедям своей веры. И они с нетерпением ждали дня, когда смогут совершить священное возмездие над своими бывшими хозяевами за столетия рабства."


 new_iyrossi:0 "Athbhanú Iyrossi"
 new_iyrossi_adj:0 "Athbhani"
 new_iyrossi_adherent:0 "Athbhani"
 new_iyrossi_adherent_plural:0 "Athbhanian"
 new_iyrossi_desc:0 "When the Aversarians were driven from our shores, a great gathering was called to collect and debate the old stories and rituals of our people that the various clans had preserved. With prayers to [Glossary( 'Deiphartoros', 'DEIPHARTOROS_GLOSS')], God of Justice, we worked to separate the truth from the Aversarian demons' secretive lies over many weeks. This gathering revealed the lies planted by the demons, unifying all but one clan in our worship of the old Gods our ancestors had worshiped.\n\nNot all agreed to attend the gathering. The Kinambrosti rejected Deiphartoros and the great gathering, choosing instead to return to their worship of the lake Demon [Glossary( 'Silvaia', 'SILVAIA_GLOSS')], who forever works to divide the clans in Malcois. The True Iyrossi now honor those who have worked so hard to maintain our faith and overthrow the Aversarians while seeking to destroy those who seek to divide us once more."



