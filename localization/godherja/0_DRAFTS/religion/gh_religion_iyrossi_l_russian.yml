 iyrossi: "Ийросск"
 iyrossi_adj: "Ийроссизм"
 iyrossi_adherent: "Ийрос"
 iyrossi_adherent_plural: "Ийросы"
 iyrossi_desc: "Вера ийросов не практиковалась открыто со II века, когда они были завоёваны и полностью оккупированы [Concept('aversaria','аверсарианцами')|E] во II веке. Некоторые из их ритуалов были поглощены аверсарианской верой как способ сохранить покорность порабощённых ийросов, но многие продолжали тайно исповедовать догматы своей веры. И они с нетерпением ждали дня, чтобы совершить священное возмездие над своими бывшими хозяевами за века порабощения."

 new_iyrossi: "Атбханск"
 new_iyrossi_adj: "Атбхану Ийроссы"
 new_iyrossi_adherent: "Атбханец"
 new_iyrossi_adherent_plural: "Атбханцы"
 new_iyrossi_desc: "Когда аверсарианцы были изгнаны с наших берегов, было созвано великое собрание, чтобы собрать и обсудить старые истории и ритуалы нашего народа, сохранённые различными кланами. С молитвами к [Glossary('Дейфарторосу','DEIPHARTOROS_GLOSS')], Богу Справедливости, мы в течение многих недель отделяли истину от тайной лжи аверсарианских демонов. Это собрание раскрыло ложь, насаждённую демонами, объединив все кланы, кроме одного, в поклонении старым богам, которым поклонялись наши предки.\n\nНе все согласились присутствовать на собрании. Кинамбрасти отвергли Дейфартороса и великое собрание, предпочтя вернуться к поклонению озёрному Демону [Glossary('Сильвайе','SILVAIA_GLOSS')], который вечно стремится разделить кланы в Малькое. Истинные ийросы ныне чтят тех, кто так усердно трудился, чтобы сохранить нашу веру и свергнуть аверсарианцев, стремясь уничтожить тех, кто вновь пытается нас разделить."

