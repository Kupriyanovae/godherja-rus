 selvarossi_iyrossi: "Селочанск"
 selvarossi_iyrossi_adj: "Селоча"
 selvarossi_iyrossi_adherent: "Селоча"
 selvarossi_iyrossi_adherent_plural: "Селочанцы"
 selvarossi_iyrossi_desc: "Когда аверсарианцы были изгнаны с наших берегов, было созвано великое собрание, чтобы собрать и обсудить старые истории и ритуалы нашего народа. Мы отказались присоединиться к встрече тех, кто всё ещё поклонялся [Glossary('Дейфарторе','DEIPHARTORA_GLOSS')] Обманщику, Богу Гор. Клан Кинамбрасти решил вернуться в дом Госпожи [Glossary('Селвы','SELVA_GLOSS')] и отбросить ложную веру, навязанную аверсарианцами. Аверсарианцы изгнали клан от озера, чтобы ослабить Госпожу Селву, которая удерживала мир в равновесии, чтобы никто не стал слишком могущественным и не разрушил мир. Падение аверсарианцев было неизбежно, когда они отрезали силу Госпожи Селвы и попытались править миром. Теперь, когда мир разрушен, клан стремится предотвратить дальнейший коллапс и надеется однажды исцелить его, укрепляя Госпожу священными ритуалами и празднествами."