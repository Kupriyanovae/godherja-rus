 iyrossi_religion_desc: "Подчёркивая связь с миром природы и отказ подчиняться жестокости, причиняемой её последователям, высшей целью веры ийросов является убеждение, что ни одна обида не должна прощаться без предварительного сведения счётов. Любое оскорбление или проступок должны быть оплачены, причём цена может варьироваться от нескольких монет до жизни обидчика. Любой другой путь был бы оскорблением Дейфартороса, Бога Справедливости."

