 sokaloma_religion_desc: "Те, кто почитает Сокалому, или «небесный танец», верят, что каждая звезда представляет собой прошлое и будущее бытие человека, и что когда человек умирает, он оставляет свою предыдущую душу среди небес, чтобы возродиться из той же самой материи. Сокаломцы считают, что эта ткань сознания проявляется в виде фигур, более похожих на традиционных божеств, представленных различными созвездиями ночного неба. Поэтому для почитателей небесного танца различие между богом и человеком размыто и часто не нужно, поскольку каждый человек был и будет богом.\n\nВ этой системе боги не предшествовали человечеству и не создавали его; вместо этого боги и есть человечество. Каждое божество функционирует как коллективный дух своих почитателей — прошлых, настоящих и будущих. Через серию тайных гаданий и космологических исследований каждый ребёнок приписывается к одному из этих богов, которым он должен следовать и позволять направлять себя, пока есть звёзды в ночном небе."

