 manats: "Манатск"
 manats_adj: "Манатизм"
 manats_adherent: "Манат"
 manats_adherent_plural: "Манаты"
 manats_desc: "Значительная часть современной манатской религиозной культуры строится вокруг защиты и толкования [Concept('gena_tinngir','Священных текстов')|E] богов, за чем наблюдает большая каста [Concept('nosanni','жрецов-толкователей')|E]. Хотя существуют оригинальные переводы, передаваемые из уст в уста, многие манатские толкователи пытаются расшифровать исконный язык самих богов, чтобы лучше суметь построить общество таким, каким оно было в те святейшие из ранних дней."

 makerelyon: "Макерелионск"
 makerelyon_adj: "Макерелион"
 makerelyon_adherent: "Макерелионец"
 makerelyon_adherent_plural: "Макерелионцы"
 makerelyon_desc: "Ветвь манатской религии Макерелион популярна среди амбициозных королей, стремящихся узурпировать власть [nosanni|E1]. Они верят, что единственным правом правителя царства является перевод [Concept('gena_tinngir','Священных текстов')|E], а духовенство должно лишь охранять библиотеки — задачу, которую, как они утверждают, настолько важную, что её нельзя отвлекать учёными изысканиями. Они оправдывают это верование, ссылаясь на то, что царь богов, [Concept('manat_mythology','Релион')|E], обладал верховной властью над всеми остальными богами, даже над хранительницей божественной библиотеки, [Concept('manat_mythology','Ашемой')|E]."
 makerelyon_priest: "Номера"
 makerelyon_priest_plural: "Номера"
