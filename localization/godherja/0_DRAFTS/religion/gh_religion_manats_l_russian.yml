 manats_religion_desc: "За тысячи тысяч поколений до нас, утверждают манаты, [Concept('manat_mythology','Боги Манат')|E] некогда ходили среди людей. Они научили человечество строить города, охотиться, сражаться и устраивать общество. Когда они ушли, они оставили список [Concept('gena_tinngir','Священных текстов')|E], чтобы человечество следовало их учениям. Они переписывались снова и снова на протяжении веков, повторяясь на давно мёртвом языке, чьи переводы передавались из уст в уста. Хотя говорят, что сохранилась лишь часть оригинальных текстов, то, что осталось, манаты ценят дороже золота."

