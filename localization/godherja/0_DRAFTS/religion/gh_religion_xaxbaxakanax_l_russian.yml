 xaxbaxakanax_religion: "Ксаксбахаканакск"
 xaxbaxakanax_religion_adj: "Ксаксбахаканакс"
 xaxbaxakanax_religion_adherent: "Ксаксбахаканаксец"
 xaxbaxakanax_religion_adherent_plural: "Ксаксбахаканаксцы"
 xaxbaxakanax_religion_desc: "Приверженцы верят, что они подобны стаду овец, ведомых божественным Пастырем по правильному пути в этом мире (который является лишь малой частью большей реальности). Сам Пастырь — скромный простолюдин в мире над ними, которого ведёт свой собственный Пастырь вместе с его родичами, и так далее. Они проповедуют принятие мира и всех его событий, будь то хороших или плохих. Подобно тому, как овцы могут беспокоиться, когда их загоняют в загоны, так и любое беспокойство о мире — это просто скрытая нервозность, рождённая из невежества относительно плана Пастыря."

 xaxbaxakanax_desc: "Считая себя простым стадом овец, ведомых пастырем, ксаксбахаканакцы не имеют власти над своими духовными делами (роль жреческой касты сводится лишь к проведению церемоний и произнесению погребальных речей). Из-за своей крайне эзотерической природы они имеют очень [Concept('xaxbaxakanax_esotericism','примитивное отношение к окружающему миру')|E]"

