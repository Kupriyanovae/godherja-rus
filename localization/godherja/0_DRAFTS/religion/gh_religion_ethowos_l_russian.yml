l_russian:
 ethowos_religion:0 "Кульско-пещернск"
 ethowos_religion_adj:0 "Культы пещерных племён"
 ethowos_religion_adherent:0 "Культист пещерного племени"
 ethowos_religion_adherent_plural:0 "Культисты пещерных племён"
 ethowos_religion_desc:0 "Племена [Concept('mayikrata','Маийкратии')|E] издавна придерживаются странных обычаев и верований, которые обитателям поверхностного мира часто кажутся противоестественными или причудливыми."
 ethowos_religion_bishop:0 "Верховный шаман"
 ethowos_religion_bishop_plural:0 "Верховные шаманы"

 cave_religions_witch_god_name:0 "Маммона"
