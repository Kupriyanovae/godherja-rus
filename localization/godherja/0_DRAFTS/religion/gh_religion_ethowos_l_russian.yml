 ethowos:0 "Этовосск"
 ethowos_adj:0 "Этовос"
 ethowos_adherent:0 "Этовосец"
 ethowos_adherent_plural:0 "Этовосцы"
 ethowos_desc:0 "Последователи Этовоса — это потомки обездоленных, беглых рабов, вырвавшихся из-под власти [Concept('aversaria','аверсарианцев')|E]. Они утверждают, что их вел Этово — гигантский аксолотль, который освободился из заточения аверсарианских [Concept('magi','магов')|E] и попутно разрушил несколько загонов для рабов. Этово почитается этовайцами как бог, и они приносят ему огромное количество пищи с поверхности."
 ethowos_old:0 "Old Ethowos"
 ethowos_old_adj:0 "Old Ethowos"
 ethowos_old_adherent:0 "Old Ethowosian"
 ethowos_old_adherent_plural:0 "Old Ethowosians"
 ethowos_high_god_name:0 "Этово"
 ethowos_high_god_possessive:0 "Этово"

 carkarai:0 "Мнеумисдианск"
 carkarai_adj:0 "Мнеумисдианский шаманизм"
 carkarai_adherent:0 "Мнеумисдианец"
 carkarai_adherent_plural:0 "Мнеумисдианцы"
 carkarai_desc:0 "Постоянно развивающееся собрание табу и суеверий; мнеумисдианцы поклоняются головокружительному множеству духов, духовных сил и воплощённых во плоти демонов. Главной фигурой в их пантеоне (по крайней мере, в его нынешней версии) является Рогатый Муж — звероподобное существо, которое, как говорят, нашептывает послания спящим. Наиболее печально известны они тем, что относятся к человеческой плоти — особенно к плоти [Concept('magi','маги')|E] и обитателей поверхности — как к таинству."
 carkarai_old:0 "Old Mneumisdian Shamanism"
 carkarai_old_adj:0 "Old Mneumisdian"
 carkarai_old_adherent:0 "Old Mneumisdian"
 carkarai_old_adherent_plural:0 "Old Mneumisdian"

 karannai:0 "Караннайск"
 karannai_adj:0 "Караннай"
 karannai_adherent:0 "Караннаец"
 karannai_adherent_plural:0 "Караннайцы"
 karannai_high_god_name:0 "Иссохший Бог"
 karannai_high_god_possessive:0 "Иссохшего Бога"
 karannai_desc:0 "Каран, «Иссохший Бог», — это древний труп неизвестного существа, откопанный горными племенами. Будучи, несомненно, мёртвым, он всё ещё испускает мощную [Concept('magic','магическую')|E] энергию, способную убить любого, кто приблизится. Поклоняясь ему как божеству, караннайцы мечтают о вознесении к божественности и сохранении умирающего мира — чего они якобы могут достичь, [Concept('karannai_ritual_consumption','вкусив')|E] частицу мёртвого бога."
 karannai_old:0 "Old Karannai"
 karannai_old_adj:0 "Old Karannai"
 karannai_old_adherent:0 "Old Karannaian"
 karannai_old_adherent_plural:0 "Old Karannaians"

 aeulikai:0 "Эуликанск"
 aeulikai_adj:0 "Эуликай"
 aeulikai_adherent:0 "Эуликанец"
 aeulikai_adherent_plural:0 "Эуликанцы"
 aeulikai_desc:0 "Разнообразный ряд шаманских верований, основанных на поклонении горным духам своей родины. Их общины сосредоточены вокруг священных шаманов, которые спорят между собой о природе своих духов. Как обнаружили [Concept('aversaria','аверсарианцы')|E], споры шаманов быстро забываются перед лицом зла, и верующие с гордостью обрушивают мощь гор на чужеземных язычников."
 aeulikai_old:0 "Old Aeulikai"
 aeulikai_old_adj:0 "Old Aeulikai"
 aeulikai_old_adherent:0 "Old Aeulikaian"
 aeulikai_old_adherent_plural:0 "Old Aeulikaians"