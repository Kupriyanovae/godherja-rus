l_russian:
 ethowos_religion: "Пещерноплеменн"
 ethowos_religion_adj: "Культы пещерных племён"
 ethowos_religion_adherent: "Культист пещерных племён"
 ethowos_religion_adherent_plural: "Культисты пещерных племён"
 ethowos_religion_desc: "Племена [Concept('mayikrata','Майикратии')|E] издавна хранили странные обычаи и верования, часто считавшиеся неестественными или причудливыми для обитателей поверхности."
 ethowos_religion_bishop: "Верховный шаман"
 ethowos_religion_bishop_plural: "Верховные шаманы"

 cave_religions_witch_god_name: "Маммон"
 cave_religions_witch_god_name_possessive: "Маммона"

 ethowos: "Этовосск"
 ethowos_adj: "Этовосизм"
 ethowos_adherent: "Этовосец"
 ethowos_adherent_plural: "Этовосцы"
 ethowos_desc: "Этовосцы — потомки обездоленных, рабов, бежавших из-под власти [Concept('aversaria','аверсарианцев')|E]. Они утверждают, что их вёл Этово — гигантский аксолотль, вырвавшийся из-под контроля аверсарианских [Concept('magi','магов')|E] и разломавший несколько загонов для рабов. Этово почитается как божество этовосцами, которые приносят ему огромные количества пищи с поверхности."
 ethowos_old: "Староэтовосск"
 ethowos_old_adj: "Старый Этовосизм"
 ethowos_old_adherent: "Старый этовосец"
 ethowos_old_adherent_plural: "Старые этовосцы"
 ethowos_high_god_name: "Этово"
 ethowos_high_god_possessive: "Этово"

 carkarai: "Мневмисдианск"
 carkarai_adj: "Мневмисдианский шаманизм"
 carkarai_adherent: "Мневмисдианец"
 carkarai_adherent_plural: "Мневмисдианцы"
 carkarai_desc: "Постоянно эволюционирующее собрание табу и суеверий. Мневмисдианцы поклоняются головокружительному множеству духов, духовных сил и демонов, воплощённых в плоти. Ключевой фигурой в их пантеоне (или, по крайней мере, в его текущей версии) является Человек с Рогатой Короной — звериный облик, который, как говорят, шепчет послания спящим. Наиболее печально они известны тем, что считают человеческую плоть — особенно [magi|E] и обитателей поверхности — священным причастием."
 carkarai_old: "Старомневмисдианск"
 carkarai_old_adj: "Старый мневмисдианский шаманизм"
 carkarai_old_adherent: "Старый мневмисдианец"
 carkarai_old_adherent_plural: "Старые мневмисдианцы"

 karannai: "Каранийск"
 karannai_adj: "Каранайизм"
 karannai_adherent: "Караниец"
 karannai_adherent_plural: "Каранийцы"
 karannai_high_god_name: "Иссохший Бог"
 karannai_high_god_possessive: "Иссохшего Бога"
 karannai_desc: "Каран «Иссохший Бог» — это древний труп неведомого существа,  извлечённый горными племенами. Хотя он, несомненно, мёртв, он всё ещё излучает [Concept('magic','магические')|E] энергии, достаточно мощные, чтобы убить всех, кто приблизится. Поклоняясь ему как божеству, каранийцы мечтают вознестись до божественности и сохранить умирающий мир — чего они, якобы, могут достичь, [Concept('karannai_ritual_consumption','вкусив')|E] часть мёртвого бога."
 karannai_old: "Старокаранийск"
 karannai_old_adj: "Старый Каранайизм"
 karannai_old_adherent: "Старый караниец"
 karannai_old_adherent_plural: "Старые каранийцы"

 aeulikai: "Эвликайск"
 aeulikai_adj: "Эвликайизм"
 aeulikai_adherent: "Эвликаец"
 aeulikai_adherent_plural: "Эвликайцы"
 aeulikai_desc: "Разнообразный ряд шаманистских вер, поклоняющихся горным духам своих земель. Их общины сосредоточены вокруг святых шаманов, которые спорят между собой о природе своих духов. Как обнаружили [Concept('aversaria','аверсарианцы')|E], споры шаманов быстро забываются перед лицом зла, и верные горды тем, что обрушивают мощь гор на чужеземных язычников."
 aeulikai_old: "Староэвликайск"
 aeulikai_old_adj: "Старый Эвликайизм"
 aeulikai_old_adherent: "Старый эвликаец"
 aeulikai_old_adherent_plural: "Старые эвликайцы"