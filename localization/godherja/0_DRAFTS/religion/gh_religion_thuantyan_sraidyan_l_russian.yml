 haswsuluyoi: "Хасвсу-луйойск"
 haswsuluyoi_desc: "Хасвсу Луйой, практикуемый преимущественно в южных регионах Южных земель, возник в результате слияния веры Тхуантьян Срайдьян, привнесённой в VIII и IX веках, с исконными верованиями сайелаев.\n\nПоскольку его приверженцы в основном происходили из земледельческих общин, миссионеры Хасвсу Луйой работали вместе с фермерами в полях, распространяя свои учения через совместный труд и личный пример. В отличие от других сект Тхуантьян Срайдьян, Хасвсу Луйой учит, что стать Хранителем можно только через служение другим.\n\nОтбрасывая мирские привязанности через бескорыстный труд, верующие верят, что после смерти могут присоединиться к рядам Хранителей. Эта доктрина часто поощряла тесные общинные связи и, в трудные времена, коллективное сопротивление феодальному правлению."
 haswsuluyoi_adj: "Хасвсу Луйой"
 haswsuluyoi_adherent: "Хранитель"
 haswsuluyoi_adherent_plural: "Хранители"

