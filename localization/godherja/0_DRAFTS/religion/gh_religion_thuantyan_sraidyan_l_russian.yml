 thuantyan_sraidyan_religion_desc: "Зародившись в долинах Сьяйдан, северо-восточном пограничье Катун-Кая, Тхуантьян Срайдьян — или Вечная Община — учит, что вселенная была создана усилиями полутора Вечных Хранителей, каждый из которых когда-то был смертным мужчиной или женщиной, вознёсшимися с Эраса, чтобы оставить свой след на небесах. Подражая Хранителю при жизни, достаточно добродетельный и внимательный почитатель может достичь бессмертия, буквально став этим Хранителем после смерти.\n\nПо мере того как миссионеры веры следовали по торговым путям на юго-запад, в Катун-Кай, вера укоренилась в этой великой империи, процветая несмотря на периоды преследований со стороны правительства."

