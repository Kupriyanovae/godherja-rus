 shyatan: "Шья'танск"
 shyatan_adj: "Шья'тан"
 shyatan_adherent: "Шья'танец"
 shyatan_adherent_plural: "Шья'танцы"
 shyatan_desc: "Шья'тан — это западно-амагейское верование, согласно которому время в конечном счёте является лишь отражением бесконечного космоса и в конечном итоге представляет собой не более чем ещё одну грань мира, которую люди могут формировать по своей воле, подобно тому, как они могут рыть канаву или сажать дерево. Шья'танские жрецы утверждают, что являются бесконечными реинкарнациями других жрецов, которые нашли способ выйти из цикла времени и войти в него снова в новом теле. Жрецы перед своей «смертью» якобы случайным образом выбирают время, деревню, регион или имя и объявляют это датой и местом своей реинкарнации, после чего младенца оттуда забирают (иногда силой), чтобы воспитать его среди жрецов для возвращения к жизни. Хотя это обычно считается великой честью, сопротивление приходящим жрецам всё равно считается ересью.\n\nСветские правители часто негодовали по поводу излишеств жречества, будучи формально обязанными выполнять любые требования жрецов, которые часто чудесным образом выбирают своими реинкарнациями собственных детей и таким образом сохраняют обширные владения в своё имя."

 halighalir: "Халигалиристск"
 halighalir_adj: "Халигалиризм"
 halighalir_adherent: "Халигалир"
 halighalir_adherent_plural: "Халигалиры"
 halighalir_desc: "Халигалиризм — это школа мысли, которая учит, что существование жречества целиком зависит от его способности удерживать дары, которые Шья'та даровал ему в давно забытые времена. Испытания, которые выпали на долю шья'танских верных, не прибавили симпатий к вере со стороны тех, кто был покорён империей за империей, и поэтому вера исторически оставалась на обочине общества."