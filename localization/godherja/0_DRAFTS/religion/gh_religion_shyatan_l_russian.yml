 shyatan_religion_desc: "Шья'танцы верят, что мир — это бесконечный цикл, из которого их жрецы вырвались и подчинили своей воле. Последователи верят, что если боги и существуют, они ещё не соизволили остановить реинкарнацию жрецов этой религии. Поскольку богов некому почитать, религия вместо этого осыпает своё жречество щедрыми дарами, чтобы удерживать цикл жизни под своим контролем."

