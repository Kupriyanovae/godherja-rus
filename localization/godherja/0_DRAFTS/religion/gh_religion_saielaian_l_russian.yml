 saielaian_religion_desc: "Разнообразные религиозные проявления народа сайелайцев обычно склоняются к формам почитания предков, где каждая большая семья обязана содержать святилище в честь каждого ушедшего поколения. [Concept('magi','Маги')|E], способные общаться с духами, пользуются большим спросом у тех, кто может позволить себе их услуги. Сайелайанский пантеон богов является прямым продолжением частной веры, а легендарные Десять Матерей сайелайцев почитаются как прародительницы их народа. Легенды гласят, что эти десять женщин-предков приплыли из-за Восточного моря в поисках убежища от далёкой родины, ныне погребённой под волнами."

