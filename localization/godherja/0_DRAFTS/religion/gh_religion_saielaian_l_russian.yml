 bayn_huac: "Байн-хуак-дриемск"
 bayn_huac_adj: "Байн Хуак Дрием"
 bayn_huac_adherent: "Почитатель"
 bayn_huac_desc: "Вера, распространённая в давно завоёванных, но вечно неспокойных землях сайелайцев, Байн Хуак Дрием по сути является формой матриархального почитания предков. Последователи должны содержать святилища в честь рода своих матерей и бабушек, а более состоятельные покровители должны приносить более изысканные дары. В частности, высоко ценятся портретная живопись и скульптура, что привело к тому, что сайелайцы создали одних из самых прославленных художников-портретистов и скульпторов на Востоке. Их лучшие работы, разумеется, всегда посвящены святилищам их матерей."
 bayn_huac_adherent_plural: "Почитатели"