l_russian:
 clanlander_religion:0 "Кланлендск"
 clanlander_religion_adj:0 "Верования обитателей кланов"
 clanlander_religion_desc:0 "Обитатели кланов Калатипсоми придерживаются разнообразных народных верований, сосредоточенных вокруг [Concept('cycle_of_the_wood','Цикла Леса')|E]." 
 wyrdpath:0 "Вирдпатск"
 wyrdpath_adj:0 "Путь Вирда"
 wyrdpath_adherent:0 "Идущий по Вирду"
 wyrdpath_adherent_plural:0 "Идущие по Вирду"
 wyrdpath_desc:0 "Путь Вирда зародился в результате ранних миссионерских усилий [Concept('marchers','жителей Марки')|E] в северном Калатипсоми. Эта проповедь возымела лишь частичный успех: она научила местных жителей необходимости следовать своему предначертанному пути в жизни, но так и не смогла вытеснить их древние обряды и обычаи."
 mothers_and_fathers:0 "Материнско-отцовск"
 mothers_and_fathers_adj:0 "Матери и отцы"
 mothers_and_fathers_desc:0 "«Матери и отцы» означают совокупность ритуалов и практик племён обитателей кланов, которые сохранились сквозь века как память и история об их прошлом. Эти истории собираются, как правило, в виде песен и передаются из поколения в поколение ради защиты как своего наследия, так и [Concept('cycle_of_the_wood','Цикла Леса')|E]."
