l_russian:
 clanlander_religion:0 "Клановск"
 clanlander_religion_adj:0 "Клановые верования"
 clanlander_religion_desc:0 "Жители клановых земель Калатипсоми придерживаются разнообразных народных верований, сосредоточенных вокруг [Concept('cycle_of_the_wood','цикла леса')|E]." 
 wyrdpath:0 "Путь-вирдск"
 wyrdpath_adj:0 "Путь Вирда"
 wyrdpath_adherent:0 "Идущий по Вирду"
 wyrdpath_adherent_plural:0 "Идущие по Вирду"
 wyrdpath_desc:0 "Путь Вирда зародился в результате ранних миссионерских усилий [Concept('marchers','марочников')|E] в северном Калатипсоми. Эта миссия увенчалась лишь частичным успехом: она научила местное население необходимости следовать своему жизненному пути, но так и не смогла вытеснить их древние обряды и обычаи."
 mothers_and_fathers:0 "Материнско-отцовск"
 mothers_and_fathers_adj:0 "Матери и отцы"
 mothers_and_fathers_desc:0 "«Матери и отцы» — это совокупность ритуалов и обычаев племен клановых земель, сохранившихся сквозь века как память и история их прошлого. Эти предания собираются, как правило, в форме песен, и каждое поколение должно передавать их следующему, чтобы защитить как свое наследие, так и [Concept('cycle_of_the_wood','цикла леса')|E]."
