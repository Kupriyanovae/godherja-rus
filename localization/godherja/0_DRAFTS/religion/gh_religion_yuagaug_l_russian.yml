 yuagaug_desc: "В вере Шуб-Юагуаг зачатие и материнство считаются священными деяниями, подражающими природе Матери Молока. Однако это означает, что женщины обязаны всегда служить матерями и хранительницами домашнего очага, что замыкает их в сфере домашнего хозяйства, в то время как мужчины управляют делами вне дома. Конечным результатом является вера с глубоким гендерным дисбалансом, где отцы имеют право даже приказывать убивать своих жён и детей за неповиновение священным заповедям."