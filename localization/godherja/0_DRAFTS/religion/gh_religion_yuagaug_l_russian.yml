 yuagaug_religion_desc: "Шуб-Юагуаг говорят, что все живые существа в мире происходят от единого существа — Юагуага. Мать и Отец всего, зачинатель и родитель, приносящий неисчислимые дары молока и мяса, в их искусстве он изображается как великая гора плоти, покрытая множеством отверстий и органов. Хотя последователи других вер считают это извращённым и кощунственным, шуб-юагуагцы видят в своём боге воплощение красоты. Ибо что может быть прекраснее того, чье единственное предназначение — давать жизнь всем?"

