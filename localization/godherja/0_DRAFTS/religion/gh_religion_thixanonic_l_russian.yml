 thixanonic_religion_desc: "Тиксанонический культ, названный в честь [Concept('aversaria','аверсарианского')|E] проповедника XII века Тиксанона, представляет собой преимущественно малкуанскую веру, почитающую божественность Тиксанона (часто именуемого «Драконий отец» и «Дракон, пожирающий солнце»). Тиксанон принадлежал к Алым Избранным до того, как отправился в экспедицию в раскопанную гробницу неизвестного происхождения в Катраддии, из которой он вернулся единственным выжившим из двухсот солдат, учёных и слуг. Неизвестно, что именно Тиксанон обнаружил внутри (или же он просто сошёл с ума от ужасов, погубивших его спутников), но после этого он начал проповедовать уникальную и эзотерическую веру, провозглашавшую его драконом, воплощённым в теле человека, ведущим свой род от множества деятелей аверсарской истории.\n\nОтказ Тиксанона от Чистейших и Первых Людей (которых он объявил ложными пророками) и его очернение автократов Аверсарии (названных им демоническими марионетками, пытающимися уничтожить божественного «Неофонического Солнечного Дракона») привели к его изгнанию из Алых Избранных и объявлению культа вне закона. Несмотря на это, благодаря масштабным религиозным потрясениям после Агионистского восстания, Тиксанон обрёл огромное число последователей в своём родном Малкуа, что едва не привело провинцию к гражданской войне ещё до его убийства. После этого культ оставался постоянной занозой в теле местного правительства, пока разрушения, вызванные [Concept('frodbrokna','Фродброкной')|E], и падение провинции не привели к новому возрождению. С тех пор многие малкуасцы, разочаровавшиеся в традиционных аверсарианских идеалах, попали под влияние этой веры наряду с тысячами освобождённых рабов, которых тиксанонические проповедники объявили достойными свободы, если те присягнут культу."
 
