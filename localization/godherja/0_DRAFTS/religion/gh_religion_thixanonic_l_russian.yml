 thixanonic_religion_desc: "Тиксанский культ, названный в честь проповедника XII века [Concept('aversaria','аверсарианца')|E] Тиксана, — это вера в основном малькойского толка, поклоняющаяся божественности Тиксана (часто именуемого «Отцом-Драконом» и «Драконом, пожирающим Солнце»). Тиксан был в числе Алых Избранников, прежде чем экспедиция в неизвестную гробницу в Катраддии, найденную при раскопках, оставила его единственным выжившим из двухсот солдат, ученых и свиты. Неизвестно, что Тиксан обнаружил внутри (или просто лишился рассудка от ужасов, погубивших его товарищей), но после этого он начал проповедовать уникальную и эзотерическую веру, провозглашая себя драконом, воплощенным в теле человека, происходящим от нескольких фигур из аверсарианской истории.\n\nОтрицание Тиксаном Чистейшего и Первых людей (называя их лжепророками) и его поношение аавтократов Аверсарии (называя их демоническими марионетками, пытающимися уничтожить божественного «Неофонического Солнечного Дракона») привели к его изгнанию из Алых Избранников и объявлению его культа вне закона. Несмотря на это, Тиксан обрел огромное число последователей в своей родной Малькое среди широких религиозных потрясений после Восстания агионистов, что едва не привело губернаторство к гражданской войне, прежде чем он был убит. После этого культ оставался постоянной занозой для местного губернаторства вплоть до разрушений, последовавших за [Concept('frodbrokna','Фродброкной')|E] и крахом губернаторства, что привело к новому возрождению. Тогда многие малькойцы, разочаровавшиеся в традиционных аверсарианских идеалах, подпали под влияние этой веры, наряду с тысячами освобожденных рабов, которых тиксанские проповедники объявляли достойными свободы, если те присягнут культу."
 
