 gestanwoder_religion_desc: "Гестанводеризм верит в богов, но эти боги не добры и не заботливы; они жестокие и капризные существа, небесные деспоты, которые видят в людях лишь свои игрушки и не более того. Жизнь — бесконечная цепь страданий, и единственная надежда — выжать сносное существование под пятой богов. Если повезёт, можно заключить неравную сделку с божеством, чтобы их бесконечные муки хотя бы ненадолго предварялись мирскими удовольствиями."

