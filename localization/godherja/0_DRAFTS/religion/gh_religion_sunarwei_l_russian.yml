 sunarwei: "Cунарвейск"
 sunarwei_adj: "Сунарвей"
 sunarwei_adherent: "Cунарвеец"
 sunarwei_adherent_plural: "Cунарвейцы"
 sunarwei_desc: "Сугубо обособленная вера, сосредоточенная на пацифизме и доброте, сунарвейцы верят, что весь мир состоит из бога-творца Кумханта. Превратив себя в триллионы осколков стекла после того, как подошёл слишком близко к солнцу, эти осколки стали всем сущим — живым и неживым. Как таковые, сунарвейцы придерживаются крайне пацифистской философии: если все вещи являются остатками одного великого бога, то все равны и заслуживают уважения."