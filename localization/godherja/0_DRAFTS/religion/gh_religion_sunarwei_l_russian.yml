 sunarwei_religion_desc: "В то время как многие говорят о десятках, сотнях, одном или даже ни одном боге, сунарвейцы говорят, что весь мир есть бог. Каждый мужчина и женщина, каждая травинка, каждый зверь земной, птица небесная и тварь морская — все они являются частью Бога-Творца, который разбился на миллионы осколков стекла после конфликта с солнцем, каждый из которых стал разной гранью Мира Сущего. Что любопытно, этот акт насилия со стороны солнца не рассматривается сунарвейцами отрицательно, они утверждают, что это был преднамеренный акт любви Творца ко всей жизни, которая должна была произойти от него."

