 ebohephai_olten_desc: "Поклоняясь обширному пантеону духов и богов огня, эбохефаи считают землю священной из-за своего [Concept('ebohephai_mythology','уникального религиозного наследия')|E]. Захоранивая людей в курганах, они воздают почитание Арлихану и его пяти тысячам духов-демонов и ста богам огня."
