 cumani_old_adj: "Древний Ольтениз"  
 cumani_old_adherent: "Древний Ольтен"  
 cumani_old_adherent_plural: "Древние Ольтены"

 iek_otached: "Иек Отачедск"
 iek_otached_adj: "Иек Отачед"
 iek_otached_adherent: "Иек Отачедец"  
 iek_otached_adherent_plural: "Иек Отачедцы"  
 iek_otached_desc: "Иек Отачед («Великий Отачед») — это ольтенская вера, сосредоточенная вокруг ольтенского полководца Отачеда, от которого произошли большинство современных ольтенских культур и религий (а также их выход на арену [Concept('the_continent','континента')|E]). Хотя во время жизни Отачеда мало что указывает на то, что он сам покровительствовал своему культу или уделял ему внимание, вера обрела популярность после его смерти, объявив его Богом; физическим воплощением самого [Glossary('Кайгана','GH_KAIGAN_GLOSS')]."
 iek_otached_old: "Old Iek Otached"
 iek_otached_old_adj: "Old Iek Otachedian"
 iek_otached_old_adherent: "Old Iek Otachedi"
 iek_otached_old_adherent_plural: "Old Iek Otachedis"

 arayymorog: "Арааймёёрёгск"
 arayymorog_adj: "Арааймёёрёг"
 arayymorog_adherent: "Арааймёёрёгец"  
 arayymorog_adherent_plural: "Арааймёёрёгцы"  
 arayymorog_desc: "Означая «Поклонение Воздуху», эта вера является общим термином для ольтенских религий, утверждающих, что их боги отражаются на [Concept('aeras','Аэрасе')|E] через действия воздуха и ветра, в результате взаимодействия богов с миром. Они отвергают обычные способы гадания, заменяя их одержимым наблюдением за движением ветра, что иногда приводит к поражению даже на грани победы из-за изменения направления ветра."
 arayymorog_old: "Old Araaymörög"
 arayymorog_old_adj: "Old Araaymörögist"
 arayymorog_old_adherent: "Old Araaymörögian"
 arayymorog_old_adherent_plural: "Old Araaymörögians"

 chakkarai: "Чаккаранск"
 chakkarai_adj: "Чаккараи"
 chakkarai_adherent: "Чаккаранец"  
 chakkarai_adherent_plural: "Чаккаранцы"  
 chakkarai_desc: "Поклонники Отачеда, приверженцы этой веры почитают его и его семью как божественных существ; его потомки, как считается, обладают частицей божественности. Вера также включает множество философских принципов из каширийских религий, рассматривая многочисленных богов Каширии как вассалов Чаккара-Отачеда. Они негативно относятся к внуку Отачеда Байтору, которого считают испорченным Еру-май, чтобы разрушить божественную империю Отачеда."

 ebohephai_olten: "Эбохефай-Ольтенск"
 ebohephai_olten_adj: "Эбохефай-Ольтен"
 ebohephai_olten_adherent: "Эбохефай-Ольтен"  
 ebohephai_olten_adherent_plural: "Эбохефай-Ольтены"  
 ebohephai_olten_desc: "Поклоняясь обширному пантеону духов и огненных богов, эбохефай почитают землю как священную благодаря их [Concept('ebohephai_mythology','уникальному религиозному наследию')|E]. Хороня людей в курганах, они поклоняются Арлихаану и его пяти тысячам демонов-духов и ста огненным богам."
