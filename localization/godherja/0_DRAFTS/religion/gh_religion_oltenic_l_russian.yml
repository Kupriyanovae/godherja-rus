 oltenic_religion_desc: "Ольтены верят, что мир разделён на две сферы: небо — царство благодетельного отца Ольгон-тена, и земля — царство злобной матери Йеру-май. Йеру-май некогда попыталась убить своего мужа в приступе ревности, но была остановлена их старшим сыном [Glossary('Оликом','GH_OLIK_GLOSS')] ценой своей жизни. Их второй сын [Glossary('Кайган','GH_KAIGAN_GLOSS')], закрыв лицо при виде этого, бежал и поклялся никогда не строить дом из земли и не вкушать её плодов. И из чресл Кайгана произошли все народы степи."

