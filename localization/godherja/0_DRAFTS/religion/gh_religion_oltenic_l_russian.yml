 cumani: "Ольтеническ"
 cumani_adj: "Ольтенизм"
 cumani_adherent: "Ольтен"
 cumani_adherent_plural: "Ольтены"
 cumani_desc: "Ольтены верят, что если они слишком долго будут держать лица открытыми, ревнивая Йеру-май опознает в них детей Кайгана и украдёт их души. Поэтому они скрывают себя личинами, которые всегда носят на улице или в обществе. Эти маски снимаются только во время интимных или ритуально важных моментов, как знак чистой преданности и уязвимости."
