 iek_otached: "Иек-отачедск"
 iek_otached_adj: "Иек Отачед"
 iek_otached_adherent: "Иек-отачедец"
 iek_otached_adherent_plural: "Иек-отачедцы"
 iek_otached_desc: "Иек Отачед («Великий Отачед») — это ольтеническая вера, сосредоточенная вокруг ольтенического военачальника Отачеда, от которого произошла большая часть современной ольтенической культуры и религии (а также сам их выход на историческую арену [Concept('the_continent','Континента')|E]). Хотя современники жизни Отачеда оставили мало свидетельств того, что он сам покровительствовал своему культу или вообще обращал на него внимание, культ обрёл популярность после его смерти, объявив его богом — физическим отражением самого [Glossary('Кайгана','GH_KAIGAN_GLOSS')]."
 iek_otached_old: "Староиек-отачедск"
 iek_otached_old_adj: "Старый Иек Отачед"
 iek_otached_old_adherent: "Старый иек-отачедец"
 iek_otached_old_adherent_plural: "Старые иек-отачедцы"

 arayymorog: "Араймёрёгск"
 arayymorog_adj: "Араймёрёг"
 arayymorog_adherent: "Араймёрёгец"
 arayymorog_adherent_plural: "Араймёрёгцы"
 arayymorog_desc: "Означающее «Поклонение Воздуху», это вера является обобщающим термином для ольтенических вер, утверждающих, что их боги отражаются на [Concept('aeras','Эрасе')|E] через действия воздуха и ветра, являющиеся результатом взаимодействия богов с миром. Они отвергают обычные попытки гадания в пользу одержимого наблюдения за движениями ветра, что приводило к поражению даже на грани победы из-за смены направления ветра."
