 chakkarai: "Чаккаранск"
 chakkarai_adj: "Чаккарай"
 chakkarai_adherent: "Чаккаранец"
 chakkarai_adherent_plural: "Чаккарайцы"
 chakkarai_desc: "Почитатели Отачеда, последователи этой веры возносят его и его род в божественный свет; его потомки, как говорят, обладают частицей божественности. Вера также включает многие философские принципы из каширийских религий, рассматривая бесчисленных богов Каширии как вассалов Чаккар-Отачеда. Они придерживаются отрицательного мнения о внуке Отачеда Байторе, которого считают развращённым Йеру-мал, чтобы принести гибель божественной империи Отачеда."

