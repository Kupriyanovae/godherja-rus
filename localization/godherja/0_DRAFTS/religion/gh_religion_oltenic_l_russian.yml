 cumani: "Ольтенск"
 cumani_adj: "Ольтенизм"
 cumani_adherent: "Ольтен"  
 cumani_adherent_plural: "Ольтены"  
 cumani_desc: "Ольтены верят, что если они будут слишком долго оставлять свои лица открытыми, ревнивая Еру-май распознает в них детей Кайгана и украдёт их души. Поэтому они скрывают свои лица масками, которые всегда надевают на улице или в присутствии других людей. Эти маски снимаются только в интимные или ритуально важные моменты, как знак чистой верности и уязвимости."  
