 fogeater_religion_adherent: "Пожиратель тумана"
 fogeater_religion_adherent_plural: "Пожиратели тумана"
 fogeater_religion_desc: "Хотя никому никогда не удавалось общаться с [Concept('fogeaters','пожирателями тумана')|E], одна из немногих достоверно известных вещей — это то, что они называют себя «Слушающими».\n\nБудучи результатом того, что племенные люди оказались в ловушке в [Concept('foglands','Туманных земель')|E], в отличие от всех других существ, уничтоженных бесчисленными опасностями Туманных земель, Пожиратели тумана вместо этого адаптировались. Или, как можно подумать, глядя на их истощённые, почти чуждые формы, — развратились.\n\nПожиратели тумана теперь поклоняются [Concept('the_fog','Туману')|E] и пожирают или развращают любого, кого захватят, в тревожащих эзотерических ритуалах, предназначенных для помощи в общении со своими эзотерическими повелителями."

