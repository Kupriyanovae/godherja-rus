 fogeater: "Слушающ"
 fogeater_adj: "Слушающие"
 fogeater_adherent: "Слушающий"
 fogeater_adherent_plural: "Слушающие"
 fogeater_desc: "Мы Слушаем.\n\nКогда пришли голоса, они просили умоляли молили плакали говорили нам нужно Слушать. Многие были лжецами язычниками лжецами они плевались они бредили они говорили нет нет нет нет нет нет нет нет УЙДИТЕ УЙДИТЕ УЙДИТЕ ИЗ НАШИХ ГОЛОВ они не хотели Слушать и они заливали уши воском и резали их и жгли их но голоса не прекращались они никогда не прекращаются. Они умерли в крови.\n\nМы Слушаем, потому что мы были хорошими верными преданными сильными мудрыми умными, кто услышал голоса и сказал ДА мы будем Слушать вас но мы не можем Слушать пока вы не говорите с нами так говорите с нами. Они рассказали нам о Туманной Матери и они привели нас к Туманной Матери, которая говорила с нами и сказала нам вещи она сказала нам много вещей много истин и как мы должны подчиняться подчиняться подчиняться подчиняться или голоса скажут ужасные вещи страшные вещи леденящие кровь вопли выдирающие глаза боль. И теперь мы подчиняемся, но мы должны Слушать, потому что если мы не можем Слушать, то Туманная Мать не может сказать нам, как подчиняться."
