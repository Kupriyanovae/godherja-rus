 graveright_religion: "Мрогилпранский"
 graveright_religion_adj: "Мрогилпрано"
 graveright_religion_adherent: "Мрогилопек"
 graveright_religion_adherent_plural: "Мрогилопеки"
 graveright_religion_desc: "Мрогилпрано, часто переводимое как Право Мертвых, является древней верой ойчиянов северных земель. Некогда доминирующая вера на территории нынешних [Concept('the_lichdoms','Личеств')|E], Право Мертвых сосредоточено на вере в то, что душа остаётся с телом в загробной жизни. Когда душа уходит, она наблюдает за теми, кто вокруг неё, и защищает их, пока тело также защищено и уважаемо. В лучшие времена почитатели Права Мертвых хранили тела умерших в огромных некрополях по городам севера, обеспечивая, чтобы все умершие в городе могли вечно служить стражами для своих потомков, как живые делали для них.\n\nЭто, разумеется, [Concept('sorrowing_of_oejeynica','оказалось пороховой бочкой')|E], и ныне Право Мертвых — почти мёртвая религия. Даже там, где она сохранилась, её догматы редко соблюдаются, а хранение мёртвых вместо их сожжения считается безумием."

