 graveright: "Правомертв"
 graveright_adj: "Право мертвых"
 graveright_adherent: "Могильный страж"
 graveright_adherent_plural: "Могильные стражи"
 graveright_desc: "Право Мертвых — это древняя вера ойчайнцев северных земель. Некогда доминирующая вера на территории нынешних [Concept('the_lichdoms','личеств')|E], Право Мертвых (или Мрогилпрано для ойчиянзов) сосредоточено на вере в то, что душа остаётся с телом в загробной жизни. Когда душа уходит, она наблюдает за теми, кто вокруг неё, и защищает их, пока тело также защищено и уважаемо. В лучшие времена почитатели Права Мертвых хранили тела умерших в огромных некрополях по городам севера, обеспечивая, чтобы все умершие в городе могли вечно служить стражами для своих потомков, как живые делали для них.\n\nЭто, разумеется, [Concept('sorrowing_of_oejeynica','оказалось пороховой бочкой')|E], и ныне Право Мертвых — почти мёртвая религия. Даже там, где она сохранилась, её догматы редко соблюдаются, а хранение мёртвых вместо их сожжения считается безумием."

 gravewatch: "Могильнодозорн"
 gravewatch_adj: "Могильный дозор"
 gravewatch_adherent: "Могильнодозорец"
 gravewatch_adherent_plural: "Могильнодозорцы"
 gravewatch_desc: "Могильные дозорные — это те, кто поклоняется модернизированной версии Права Мертвых, созданной в попытке обеспечить выживание Права Мертвых в современном мире. Вместо некрополей, где хранятся мёртвые, и зданий из их костей, за умершими наблюдают в течение недели, пока жрецы совершают ритуалы очищения и упокоения. Могильные дозорные утверждают, что эти обряды всё же позволят душе защищать местность, пока о ней помнят и устанавливают памятники в память об умерших. Эти могилы строго охраняются храмовыми стражами, а за каждым телом присматривает отряд стражников, следящих, чтобы его не беспокоили.\n\nХотя это гораздо более приемлемо для современных взглядов, этой вере не удалось найти последователей среди марочников или убедить старых верующих в своей правоте, и она с трудом приживается."