 adabyssian_religion_desc: "Дгуди, или «сосуд-молитва», — это адабисское слово для почитания прекрасных позолоченных скульптур, что населяют место, называемое просто Городом Золотых Статуй. Когда их предки впервые пришли в город, они увидели чудесные, сияющие творения, возвышающиеся над их головами, и спросили себя: как могут они быть чем-то иным, кроме как сосудами богов? Это были не традиционные духи природы, которым они поклонялись, но Великие Духи, те, кто более достоин уважения, чем любые другие. Именно Великие Духи создали мир, и именно Великие Духи поручили адабисцам управлять им."
