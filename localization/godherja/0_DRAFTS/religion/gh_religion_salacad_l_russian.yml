 segyetes: "Сегьетистск"
 segyetes_adj: "Сегьетизм"
 segyetes_adherent: "Сегьетец"
 segyetes_adherent_plural: "Сегьетцы"
 segyetes_desc: "Вера Сегьетис утверждает, что Мать-Небо и Отец-Земля когда-то были возлюбленными, вместе создавшими небо и землю. Однако Отец-Земля возревновал к прекрасному творению Матери-Неба — человечеству. Он захотел создать своих собственных существ, чтобы соперничать с её творением, и сотворил демонов из грязи. Демоны терроризировали мир, побуждая Мать-Небо начать войну против творений своего возлюбленного. Последовавшие битвы привели к тому, что Мать-Небо со слезами на глазах вонзила своё копьё в Отца-Землю, расколов землю и небо и отделив человечество от его создателя. Сегьетцы верят, что путь к спасению — примирить их отношения, чтобы двое наконец воссоединились. И мужчины, и женщины служат шаманами, общаясь с небом и землёй, чтобы исцелить разорванные узы."
 segyetes_old: "Старосегьетистск"
 segyetes_old_adj: "Старый Сегьетизм"
 segyetes_old_adherent: "Старый сегьетец"
 segyetes_old_adherent_plural: "Старые сегьетцы"

 sky_rite: "Небесно-обрядов"
 sky_rite_adj: "Небесный обряд"
 sky_rite_adherent: "Небеснообрядец"
 sky_rite_adherent_plural: "Небеснообрядцы"
 sky_rite_desc: "Небесный обряд является продолжением салакадизма, но структурирован через Обряды, установленные сьялволькскими реформаторами. Вместо разрозненной системы мифов и шаманов, Небесный обряд стремится поддерживать структуру почитания Матери-Неба, чтобы древние сказания не были утеряны в земле."