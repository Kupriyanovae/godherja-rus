 salacad: "Салакадистск"
 salacad_adj: "Салакадизм"
 salacad_adherent: "Салакадец"
 salacad_adherent_plural: "Салакадцы"
 salacad_desc: "Салакадизм является исконной для сарминян в составе сьялволькской коалиции. Из-за веры в то, что Мать-Небо является их вождём и защитницей, они придают особое значение женщинам в своём обществе. Женщины служат шаманками, общаясь с Матерью-Небом и толкуя её волю, чтобы направлять верных к славе под взглядом её голубых очей."
