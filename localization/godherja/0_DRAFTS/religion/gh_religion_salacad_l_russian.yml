 salacad_religion_desc: "Как и многие другие древние веры, салакадцы утверждают, что существовало два изначальных божества-творца: Мать-Небо и Отец-Земля. Но в отличие от других, они утверждают, что два бога постоянно воевали, причём Отец-Земля был зачинщиком насилия. Мать-Небо вела доблестную оборону и в конечном итоге одержала победу над своим жестоким врагом. После этого она поклялась заботиться о своих дочерях и сыновьях, особенно о человечестве."

