 dahala: "Далахск"
 dahala_adj: "Далаха"
 dahala_adherent: "Далахец"
 dahala_adherent_plural: "Далахцы"
 dahala_desc: "Для далахцев власть, подобно золоту или воде, является конкретным ресурсом, который можно приобрести или потратить. Верующие считают, что лучший способ обрести власть — это очищение тела через медитацию и воздержание. По мере накопления власти у человека проявляются желаемые качества — и те, кто обладает великой красотой и плодородием, почитаются как образцы совершенства."

 narina: "Наринск"
 narina_adj: "Нарина"
 narina_adherent: "Наринец"
 narina_adherent_plural: "Наринцы"
 narina_desc: "В то время как ортодоксальное учение веры Далаха гласит, что власть обретается через чистоту, наринцы верят, что власть уже присутствует в теле и должна быть освобождена от страстей, её оскверняющих. С этой целью последователи постоянно стремятся истощить эти страсти — будь то через разгул, девиантное поведение или даже убийство. Это привело к преследованиям наринцев в Дахан-Гоне, хотя их вера укоренилась в этих землях и часто практикуется амбициозными лордами, стремящимися к господству."

 saldakas: "Салдакск"
 saldakas_adj: "Салдакас"
 saldakas_adherent: "Салдакец"
 saldakas_adherent_plural: "Салдакцы"
 saldakas_desc: "Отдалённая секта, сосредоточенная в северо-западных горах Дахан-Гона. Салдакцы считают, что власть не только конкретна, но и осязаема в форме [Concept('magic','магии')|E]. Практикующие эту секту стремятся накапливать магические энергии в своих телах, а ритуалы салдакцев пронизаны тайными искусствами."
