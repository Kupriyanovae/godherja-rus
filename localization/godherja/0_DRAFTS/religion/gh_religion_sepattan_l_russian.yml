 #Sepattan Sacred Paths

 sepattan_interpretative_tradition_name: "Священный путь"

 sepattan_twin_gods_doctrine_name: "Путь Богов-близнецов"
 sepattan_twin_gods_doctrine_desc: "Идущие путём Богов-близнецов верят в жизнь в гармонии с природой и отвергают все формы цивилизации чужаков и их «нововведения». Они видят в [Concept('great_betrayal','Корлаку')|E] безумного новатора, стремившегося разрушить гармонию наттананов с природой и единство народа. Последователи стремятся преследовать всех, кто считает [Concept('twin_deceivers','Богов-близнецов')|E] предателями истинного Пути."

 sepattan_korlacu_doctrine_name: "Путь Корлаку"
 sepattan_korlacu_doctrine_desc: "Идущие путём Корлаку верят в промышленность, ковку и огонь, как проповедовал Корлаку. Они видят в [Concept('twin_deceivers','Богах-близнецах')|E] глупых отсталых богов, предавших Корлаку, когда он пытался улучшить участь наттананов, разрушив их единство. Последователи стремятся преследовать всех, кто считает [Concept('great_betrayal','Корлаку')|E] предателем истинного Пути."

 sepattan_twin_gods_men_doctrine_name: "Путь Магов"
 sepattan_twin_gods_men_doctrine_desc: "Идущие путём Магов отвергают божественность Богов-близнецов и Корлаку, утверждая вместо этого, что они были могущественными магами, которые помогли изгнать чужаков и установить новый образ жизни, прежде чем внутренние распри привели к расколу. Одна сторона теперь утверждает, что [Concept('great_betrayal','Корлаку')|E] разрушил единство, другие утверждают, что [Concept('twin_deceivers','Боги-близнецы')|E] разрушили единство; идущие этим путём стараются извлечь уроки из всех трёх богов и желают воссоединить народ и преодолеть эту распрю."

 sepattan_no_twin_gods_doctrine_name: "Путь Безбожников"
 sepattan_no_twin_gods_doctrine_desc: "Идущие путём Безбожников верят, что Боги-близнецы и Корлаку — легенды, основанные на вымысле. Миф о том, что [Concept('twin_deceivers','Боги-близнецы')|E] предали Корлаку, или что [Concept('great_betrayal','Корлаку')|E] предал Богов-близнецов, на самом деле не имеет значения для этих последователей. Боги были созданы в прошлом, чтобы помочь укрепить традиции, необходимые для образа жизни наттананов; зная это, мы можем верить во что угодно."

 sepattan_death_king_doctrine_name: "Путь Короля Смерти"
 sepattan_death_king_doctrine_desc: "Путь Короля Смерти — это путь, по которому идут почитающие Акхарадахамму Бессмертного. Это проклятый путь, посвящённый восстановлению своего грозного владыки и пробуждению его тёмного правления над Наттананом. Идущие этим путём всегда отвергаются всеми остальными и всегда искореняются при появлении."

 sepattan_reincarnate_twin_gods_doctrine_name: "Путь Воплощённых Богов-близнецов"
 sepattan_reincarnate_twin_gods_doctrine_desc: "Идущие путём Воплощённых Богов-близнецов верят в жизнь в гармонии с природой и отвергают все формы цивилизации чужаков и их «нововведения». Они видят в [Concept('great_betrayal','Корлаку')|E] безумного новатора, стремившегося разрушить гармонию наттананов с природой и единство народа. Последователи стремятся преследовать всех, кто считает [Concept('twin_deceivers','Богов-близнецов')|E] предателями истинного Пути. Отличие от Пути Богов-близнецов заключается в вере в то, что Боги-близнецы периодически возвращаются в Наттанан в облике младенцев, чтобы вести народ наттананов."

 sepattan_reincarnate_korlacu_doctrine_name: "Путь Воплощённого Корлаку"
 sepattan_reincarnate_korlacu_doctrine_desc: "Идущие путём Корлаку верят в промышленность, ковку и огонь, как проповедовал Корлаку. Они видят в [Concept('twin_deceivers','Богах-близнецах')|E] глупых отсталых богов, предавших Корлаку, когда он пытался улучшить участь наттананов, разрушив их единство. Последователи стремятся преследовать всех, кто считает [Concept('great_betrayal','Корлаку')|E] предателем истинного Пути. Отличие заключается в вере в то, что Корлаку периодически возвращается в Наттанан в облике младенца, чтобы вести народ наттананов."

