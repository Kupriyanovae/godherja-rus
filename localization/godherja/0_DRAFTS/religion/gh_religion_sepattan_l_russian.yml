 #Twin Gods Worshipers
 nathanalmic: "Натаналмическ"
 nathanalmic_adj: "Натаналмик"
 nathanalmic_adherent: "Наталами"
 nathanalmic_adherent_plural: "Натаналмики"
 nathanalmic_desc: "[Glossary('Натаналмики','GH_NATHANALMIC_GLOSS')] проповедуют, что лучший способ чтить Богов-близнецов — это жить в гармонии с природой и проводить [Concept('holy_hunts','священные охоты')|E] во имя их. Последователи видят в чужаках меланхоличные и заблудшие души и верят, что долг верных — убедить их ступить на срединный путь. Несмотря на эту открытость, натаналмики продолжают опасаться идей, выходящих за рамки нормы, опасаясь, что они могут вновь разжечь [Concept('great_betrayal','трагедии')|E], случившиеся ранее."

 katharnalmic: "Катарналмическ"
 katharnalmic_adj: "Катарналмик"
 katharnalmic_adherent: "Натарналми"
 katharnalmic_adherent_plural: "Натарналмики"
 katharnalmic_desc: "Боги-близнецы наблюдают за теми, кто живёт в гармонии с природой, и поэтому неподатливый камень, отвергающий гармонию, должен быть вырезан и разбит для этой цели.\n\nТак говорят среди [Glossary('катарналмиков','GH_KATHARNALMIC_GLOSS')], чьи последователи обитают в том самом камне, который они обрабатывают. Верные этого пути имеют долгую историю защиты от тех, кто стремится изгнать их из Облачных лесов [Glossary('Чан Кьявкорлаку','GH_CHAN_KYAWKORLACU_GLOSS')] — что дарует им великое рвение, служащее щитом от искушения следовать путями своих [Concept('great_betrayal','языческих предков')|E]."

 gotharnalmic: "Готарналмическ"
 gotharnalmic_adj: "Готарналмик"
 gotharnalmic_adherent: "Готарналмик"
 gotharnalmic_adherent_plural: "Готарналмики"
 gotharnalmic_desc: "Для последователей [Glossary('готарналмиков','GH_GOTHARNALMIC_GLOSS')] запрет Богов-близнецов на рабство включает в себя принуждение чужаков к принятию их образа жизни. Таким образом, хотя их уважают все наттананы, последователи в основном держатся особняком в самых глухих чащобах джунглей.\n\nГотарналмики также избегают войны и насилия как развращающей силы, из-за которой пал [Concept('great_betrayal','Корлаку')|E], и верят, что единственное время, когда это дозволено Богами-близнецами, — это когда это делается для защиты своего."

 #Akkharadhamma worshipers
 akkaranalmic: "Аккараналмическ"
 akkaranalmic_adj: "Аккараналмик"
 akkaranalmic_adherent: "Аккараналми"
 akkaranalmic_adherent_plural: "Аккараналмики"
 akkaranalmic_desc: "Для последователей Акхарадахаммы Бессмертного боги-триумвиры Тарфал, Йернейм и Корлаку — гнусные узурпаторы, жестоко заключившие в темницу единственного истинного бога и защитника Наттанана. Даже сейчас они ищут способ освободить своего заключённого бога, выжидая время."

 #Korlacu worshipers

 korlenalmic: "Корленалмический"
 korlenalmic_adj: "Корленалмик"
 korlenalmic_adherent: "Корленалми"
 korlenalmic_adherent_plural: "Корленалмики"
 korlenalmic_desc: "Новая секта корлоналмической ереси, Корленалмик, или Огненный Путь, был основан группой наттананских диссидентов, обнаруживших записи о [Concept('fire_path','Пути Огня')|E]. Столкнувшись с преследованиями, новая секта бежала на восток, где встретила хранителей Тхуантьян Срайдьян — катунцев, веривших в святость создания долговечных творений. Корленалмики в конце концов переняли большую часть этого мировоззрения и считали, что, создавая инновации и великие творения, они будут вознесены, чтобы служить непосредственно под началом Корлаку, который затем поведёт их к созданию лучшего мира для всех."

 korlonalmic: "Корлоналмическ"
 korlonalmic_adj: "Корлоналмик"
 korlonalmic_adherent: "Корлоналми"
 korlonalmic_adherent_plural: "Корлоналмики"
 korlonalmic_desc: "С тех пор как существуют Боги-близнецы и последователи Пути, существовали и те, кто отвергает его и ищет Корлоналмический, или [fire_path|E]. Однако предательство [Concept('twin_deceivers','Близнецов')|E] привело к падению Корлаку, а его последователи были изгнаны в [Glossary('Чан Кьявкорлаку','GH_CHAN_KYAWKORLACU_GLOSS')] — северо-западные горы Харадана. Там секта приняла более радикальный взгляд на магические исследования, отчасти под влиянием соседних почитателей Сарвата, каширийского бога знания."

