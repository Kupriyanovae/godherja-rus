 sheharddi_religion_desc:0 "Те, кто сегодня исповедует веру шехарддов, часто делают это втайне. Они отказываются принимать любого бога, кроме Элои, считая почитание других божеств в лучшем случае заблуждением и поклонением #EMP Маликия#!, а в худшем — уловкой Эир-Шайтана. Из-за этого они веками подвергались остракизму и преследованиям за отказ участвовать в поклонении политеистическим пантеонам."

