 sheharddi_adherent_plural: "Шехардды"
 sheharddi_desc: "Истоки веры шехарддов окутаны тайной, и учёные спорят о том, является ли она синкретизмом нескольких [Concept('sarradon','саррадонских')|E] вер, культом единого бога, отделившимся от более крупной политеистической религии, или же уцелевшими остатками более древней веры. Они верят, что верховный бог Элой, создатель небес, сотворил расу под названием Маликийя, или Вестники. Старший из них, Эйр-Шайтан, создал ещё более низшую расу существ — людей — чтобы те служили ему и поклонялись ему и его шести помощникам как существам, превосходящим их отца. Это привело к изгнанию человечества из рая после [kalnaih|E], и только ведя честную и праведную жизнь, можно вернуться на небеса, чтобы вечно поклоняться Ему."