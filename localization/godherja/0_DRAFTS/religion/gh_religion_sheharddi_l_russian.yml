 sheharddi_desc:0 "Происхождение веры шехарддов окутано тайной, и учёные спорят, является ли она синкретизмом нескольких [Concept('sarradon','саррадонских')|E] верований, культом единого бога, отколовшимся от более крупной политеистической религии, или же уцелевшим пережитком первобытной веры. Они верят, что верховный бог Элои, творец небес, создал расу, называемую Маликия, или Вестники. Старший из них, Эир-Шайтан, сотворил ещё более низших существ — людей, дабы те были его слугами и поклонялись ему и шести его наместникам так, словно они превосходят своего отца. Из-за этого человечество было изгнано из рая после [Concept('kalnaih','Кальнайха')|E], и лишь ведя честную и праведную жизнь, можно вернуться на небеса, чтобы вечно славить Его."