 sheharddi_religion_desc: "Те, кто ныне исповедует веру шехарддов, часто делают это тайно. Они отказываются признавать какого-либо бога, кроме Элоя, считая прочих божеств либо заблудшим поклонением #EMP Маликийя#!, либо уловкой Эйр-Шайтана. Вследствие этого их веками подвергали остракизму и преследованиям за отказ участвовать в поклонении политеистическим пантеонам."

