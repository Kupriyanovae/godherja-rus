 stavronic_desc:0 "Культ судного дня, состоящий из [Concept('marchers','марочников')|E] и поклоняющийся [Concept('arch_lich','архиличу')|E] [Concept('silas_stavro','Силасу Ставро')|E]. Ставронисты утверждают, что Ставро был посланником таинственных богов, призванным положить конец живому миру и сотворить его заново. Приверженцы верят, что Ставро вернётся и начнёт последнюю битву против живых, которые переродятся бок о бок с мёртвыми. Шевальенцы считают их безумцами, а сам он известен лишь как [Concept('silas_stavro','загадочный странник в балахоне')|E]. Несмотря на притеснения, не менее раза в столетие в мире продолжают находить и уничтожать оплоты этого культа."