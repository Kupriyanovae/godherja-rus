 stavronic_desc:0 "Апокалиптический культ [Concept('marchers','жителей Марки')|E] из [Concept('chevalie','Шевалье')|E], поклоняющийся [Concept('arch_lich','архиличу')|E] [Concept('silas_stavro','Силасу Ставро')|E]. Ставронисты утверждают, будто Ставро был вестником, посланным таинственными богами, чтобы положить конец миру живых и начать всё заново. Приверженцы культа верят, что Ставро вернётся и начнёт последнюю битву против живых, которые переродятся вместе с мёртвыми. Шевальенцы считают их безумцами, а самого Ставро — [Concept('silas_stavro','таинственным путником в мантии')|E]. Несмотря на жестокие гонения, неофиты и тайные общины культа обнаруживаются и уничтожаются как минимум раз в столетие."