 namejisht_religion_desc: "Существование на протяжении тысячелетий лишь в качестве тайного общества среди малькойских рабов сильно изменило веру Намейжишты. Ныне это вера, в основном сосредоточенная на поклонении идее свободы, или Намейж. В свободных общинах намейжиштцев свобода почитается почти как божество, регулярно проводятся празднества в её честь, а лишение свободы другого через рабство считается святотатством. Есть некоторые указания на то, что Намейжишта происходит от другой веры, существовавшей до порабощения её последователей: некоторые празднества, посвящённые «Намейж», по-видимому, не имеют никакого отношения к свободе, но о догматах этой изначальной веры мало что можно сказать."

