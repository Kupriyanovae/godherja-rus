 namejisht_religion_desc:0 "Сильно изменившаяся за тысячелетия существования в качестве тайного общества среди малкоисиакских рабов, вера намёжишт теперь в основном сосредоточена на поклонении самой идее свободы, или Намёж. В свободных намёжиштских общинах к свободе относятся почти как к божеству, регулярно устраивая в её честь фестивали, а лишение свободы другого человека посредством рабства считается святотатством. Есть некоторые признаки того, что намёжишта происходит от другой веры, существовавшей до порабощения её последователей, поскольку некоторые празднества, посвящённые «Намёж», судя по всему, не имеют ничего общего со свободой, однако о догматах этой изначальной веры мало что можно сказать наверняка."
