 talita_namit: "Талита-намитск"
 talita_namit_adj: "Талита Намит"
 talita_namit_desc: "Талита Намит является в равной мере и образом религиозных верований, и политической системой. Наиболее поразительным элементом этой веры является убеждение, исповедуемое ревностными последователями, что определённые [Concept('marmaladid_chosen_magi','маги')|E] могут служить вестниками из [Concept('realm_above','Высшей обители')|E], выступая посланниками воли Небес и осуществляя законное правление над землями Эраса."
 talita_namit_adherent: "Избранный"
 talita_namit_adherent_plural: "Избранные"

 talfasmolline: "Тальфасемск"
 talfasmolline_adj: "Тальфасем"
 talfasmolline_adherent: "Тальфасемец"
 talfasmolline_adherent_plural: "Тальфасемцы"
 talfasmolline_desc: "[Concept('marmaladid_great_tribes','Мармаладиды')|E] издавна почитали смертоносные яды [Glossary('Саррадонской пустыни','sarradonian_desert_encyclopedia_desc')] и животных, которые их носят, как источник огромной силы. Ревностные последователи принимают участие в ритуале, известном как [Glossary('Тальфасомолль','tafasomoll_glossary_desc')]. Редко можно встретить тальфасемца без пузырька с ядом, ибо он предназначен не только для использования против врагов, но и для почётного самоубийства, когда вся надежда потеряна."
 tafasomoll_glossary_desc: "Тальфасомолль — это ритуал, при котором человека помещают в яму со скорпионами и приказывают прочитать молитву Богине Смерти. Те, кто переживает этот опасный обряд, удостаиваются обильной хвалы и почитания, ибо они были благословлены самой Неттат Йетцен."

 albot_al_mamurism: "Альбот-аль-мамуритск"
 albot_al_mamurism_adj: "Альбот-аль-Мамуризм"
 albot_al_mamurism_adherent: "Альбот-аль-мамурит"
 albot_al_mamurism_adherent_plural: "Альбот-аль-мамуриты"
 albot_al_mamurism_desc: "Века торговли и общения обратили многих в [Glossary('Саррадонской пустыне','sarradonian_desert_encyclopedia_desc')] в [Concept('wardenism','варденитскую')|E] традицию с переменным успехом. Хотя кочевые трибуналы часто именуются судами, их решения в основном основываются на усмотрении деревенских старейшин, а не на судебных экспертах. Редкость юридических текстов во многих из этих общин привела к размыванию власти, мамур является лишь фигурой, которой приносят номинальную клятву, а его имя, личность и статус в значительной степени неизвестны и безразличны. Неспособность искоренить местные суеверия привела к ряду странных и архаичных пережитков, таких как испытание [Glossary('Тальфасомолль','tafasomoll_glossary_desc')] или [Glossary('Тирга Тисит','tirga_tissit_glossary_desc')], из-за чего многие в ядре варденизма называют этих жрецов «Альбот-аль-Мамурами», то есть «Паучьими Мамурами»."
 tirga_tissit_glossary_desc: "Тирга Тисит — это практика погружения паука в кровь принесённого в жертву верблюда, после чего паука помещают на его высушенную шкуру. Оставленный узор интерпретируется местными шаманами или «судьями» для вынесения приговора, поскольку считается, что это слово Пустынных Богов или, в мамуристских сектах, Того, Кто Был."
