 marmaladid_religion_desc: "Шураэбада — это древняя система устных обычаев и верований, уходящая корнями, как считается, в глубины [Glossary('Саррадонской пустыни','sarradonian_desert_encyclopedia_desc')] среди [Concept('marmaladid_great_tribes','племен мармаладидов')|E]. Шураэбаду объединяют лишь общие истории, традиции и почитание сил [Concept('magic','магии')|E]."

