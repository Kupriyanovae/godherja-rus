 the_dragon_cult: "Дракон"
 the_dragon_cult_adj: "Культ Дракона"
 the_dragon_cult_adherent: "Культист Дракона"
 the_dragon_cult_adherent_plural: "Культисты Дракона"
 the_dragon_cult_desc: "Древний Культ [Concept('dragons','Дракона')|E] — это вера, распространённая на более юго-западных [Concept('shatteredisles','Расколотых островов')|E], тех, что ближе к [Concept('sarradon','Саррадону')|E]. Смесь верований и доктрин как из аэрсодиаксинизма, так и из Драканориксской Аагиократии, Культ Дракона сосредоточен исключительно на поклонении тем великим зверям, славящимся по всему [Concept('aeras','Эрасу')|E] своей мощью и величием. Они превозносят божественные атрибуты драконов и утверждают, что бог-творец Каралтор создал тех, кто известен как Крылатые Владыки, по своему образу и подобию, чтобы править человечеством как благодетельные монархи и жестокие каратели несправедливости и нечистоты. Величайший из Крылатых Владык, Паратариан, стоит превыше всех как перворождённое дитя Каралтора и повелитель не только всех Драконов, но и самого Эраса. Остальную часть пантеона Культа составляют другие Драконы, хотя великое множество этих «Драконов» на самом деле являются просто исключительно могущественными [magi|E1], обожествлёнными после смерти."
 the_dragon_cult_old: "Стародракон"
 the_dragon_cult_old_adj: "Старый Культ Дракона"
 the_dragon_cult_old_adherent: "Старый культист Дракона"
 the_dragon_cult_old_adherent_plural: "Старые культисты Дракона"
