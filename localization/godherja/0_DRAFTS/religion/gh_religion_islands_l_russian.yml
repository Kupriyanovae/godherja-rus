 sacred_stars_cult: "Священно-звёздн"
 sacred_stars_cult_adj: "Культ Священных Звёзд"
 sacred_stars_cult_adherent: "Культист Священных Звёзд"
 sacred_stars_cult_adherent_plural: "Культисты Священных Звёзд"
 sacred_stars_cult_desc: "Для последователей Священных Звёзд герои [Concept('shatteredisles','Островов')|E] существуют во времени, намного превосходящем их жизнь на [Concept('aeras','Эраса')|E]. Каждая звезда — это вознесённая легенда прошлого, каждое созвездие — знак для их последователей. Поклонение — это то, что возвращает их в земли, которые они некогда называли домом, самые яркие звёзды — это те, которые всё ещё почитаются их последователями на Эрасе. Самые прославленные и любимые герои живут в древних чертогах [Concept('aervalr','Эрвала')|E], наблюдая и наделяя своих самых верных последователей благословениями в жизни и шансом на вечное существование."
 sacred_stars_cult_old: "Старосвященно-звёздн"
 sacred_stars_cult_old_adj: "Старый культ Священных Звёзд"
 sacred_stars_cult_old_adherent: "Старый культист Священных Звёзд"
 sacred_stars_cult_old_adherent_plural: "Старые культисты Священных Звёзд"

 shattered_stars_cult: "Разбито-звёздн"
 shattered_stars_cult_adj: "Культ Разбитых Звёзд"
 shattered_stars_cult_adherent: "Культист Разбитых Звёзд"
 shattered_stars_cult_adherent_plural: "Культисты Разбитых Звёзд"
 shattered_stars_cult_desc: "После [Concept('frodbrokna','Фродброкны')|E] последователи Священных Звёзд стали свидетелями самой травмирующей трагедии — разрушения [Concept('aervalr','Эрвала')|E], древних чертогов самых любимых героев. Когда её разбитые руины падают на [Concept('aeras','Эрас')|E], их последователи озлобились, проклиная тех, кто обладает магической силой, и изгоняя их со своих [Concept('shatteredisles','Островов')|E]. Последователи проповедуют, что только через большее поклонение древним пантеонам — добровольное или нет — они могут быть спасены от судьбы вечной разобщённости и угасания света."

 frodbrokna_radical_desc: "Конфессия после [Concept('frodbrokna','Фродброкны')|E]"