 the_dragon_cult_high_god_name_alternate_possessive: "Великого Повелителя Пламени"

 biblosxar: "Библос'ксарск"
 biblosxar_adj: "Библос'ксар"
 biblosxar_adherent: "Последователь Библос'ксара"
 biblosxar_adherent_plural: "Последователи Библос'ксара"
 biblosxar_desc: "Ограниченный изолированными Западными [Concept('shatteredisles','Островами')|E], культ библос'ксарианцев и их героя Библосея относительно малоизвестен остальной [Concept('aversaria','Аверсарии')|E]. Несмотря на это, библос'ксарианцы печально известны своей преданностью своему божеству, часто проводя сложные церемонии и возлияния в его честь.\n\nС раннего возраста детей обучают старейшины путешествиям и борьбе Библосея в его стремлении обрести высший дар: избежать самой смерти. Согласно легенде, передаваемой из поколения в поколение, однажды ночью с юным Библосеем заговорил дух Саутоно, пообещав ему бессмертие, если он убьёт в поединке ужасного царя смерти Поласа-Уро. Саутоно предупредил юношу, что это задача, которой он должен будет посвятить всю свою жизнь, ибо целые армии прежде пресмыкались у ног Поласа-Уро.\n\nНо Библосей был целеустремлённой душой. После долгих лет тренировок он стал вдохновляющим воином, владеющим копьём и уникальным девятигранным щитом, который он выковал из лучшего дерева и металла на своём родном острове. Косил врагов, как дровосек валит деревья, и в конце концов Библосей стал достаточно сильным, чтобы бросить вызов Поласу-Уро, который сохранил свою силу даже в старости. И после поединка, длившегося пять часов, Попас-Уро был пронзён в голову; царь смерти был повержен.\n\nОднако когда Библосей призвал Саутоно даровать ему бессмертие, дух рассмеялся. Без предупреждения Библосей был мгновенно обращён в камень и низвергнут глубоко под землю. Лукавый Саутоно даровал Библосею бессмертие, но не так, как тот желал..."
 biblosxar_old: "Старобиблос'ксарск"
 biblosxar_old_adj: "Старый Библос'ксар"
 biblosxar_old_adherent: "Старый последователь Библос'ксара"
 biblosxar_old_adherent_plural: "Старые последователи Библос'ксара"

 cult_of_the_bitter_wave: "Горько-волн"
 cult_of_the_bitter_wave_adj: "Культ Горькой Волны"
 cult_of_the_bitter_wave_adherent: "Культист Горькой Волны"
 cult_of_the_bitter_wave_adherent_plural: "Культисты Горькой Волны"
 cult_of_the_bitter_wave_desc: "«Тот, кто ждёт, затаившийся, безмятежный, предвестник, непоколебимый, тот, кто ждёт пришествия Ч'нглуйярога, распадения и возрождения этого проклятого мира. Хвала Тагонгту, Богу Горькой Волны!»\n\nКультистов Горькой Волны без исключения считают жутким народом с совершенно нелепыми верованиями. Преданные таинственному богу Тагонгту, чьё истинное имя известно лишь высшим слоям их жреческой иерархии, культисты Горькой Волны практикуют ряд исключительно тревожных ритуалов, которые, по их мнению, необходимы для общения со странным богом моря. Человеческая кровь является распространённым компонентом, хотя время от времени используются и другие странные материалы, такие как необычные черепа, напоминающие родственную человечеству группу. Как или где они добывают такие черепа и другие странные диковины, неизвестно. И жрецы, и миряне носят шлемы и доспехи, не похожие ни на одну другую культуру на [Concept('aeras','Эрасе')|E], озадачивая учёных, задающихся вопросом о предназначении такого облачения. Добавляет загадочности этому культу частое, но часто отвергаемое сообщения рыбаков [Concept('shatteredisles','Островов')|E] о том, что в море скрывается огромное существо, бесчисленные бесцветные глаза которого устремлены к поверхности. Оно наблюдает... и ждёт."
 cult_of_the_bitter_wave_religious_head_title: "Вестник"
 cult_of_the_bitter_wave_religious_head_title_name: "Вестник"
 cult_of_the_bitter_wave_old: "Волны Старогорько-волн"
 cult_of_the_bitter_wave_old_adj: "Старый культ Горькой Волны"
 cult_of_the_bitter_wave_old_adherent: "Старый культист Горькой Волны"
 cult_of_the_bitter_wave_old_adherent_plural: "Старые культисты Горькой Волны"

 seaborne_exalted: "Морско-избранн"
 seaborne_exalted_adj: "Морские Избранные"
 seaborne_exalted_adherent: "Морской избранный"
 seaborne_exalted_adherent_plural: "Морские избранные"
 seaborne_exalted_desc: "Ненавидимые всеми, страшимые многими, бичи Расколотого побережья и всех его [Concept('shatteredisles','Островов')|E], Морские Избранные — это отвратительный и злобный культ, ставящий грабёж и пиратство превыше всего. Веря, что всё человечество произошло из морской соли, для морских избранных жизнь без убийств, грабежа и насилия лишена всякого смысла. Жизнь коротка, и когда человек умирает, его не ждёт возвышенная загробная жизнь или небесная обитель — лишь возвращение тела в ту морскую соль, из которой оно было создано.\n\nПоэтому следует хвататься за любую возможность, совершать любые преступления, какие только можно пожелать, и забирать всё, что можно, ибо за завесой смерти нет ничего, кроме вечного скитания с берега на берег по коварному морю, которое столько досаждало им при жизни. Убивать — значит навязывать свою волю этому проклятому миру и менять сами течения судьбы. Властвовать — значит быть сильным, а слабые должны уступить дорогу или умереть при столкновении с лучшими. Никакой закон, никакой бог и никакой король не сдерживают морских избранных, которые приходят, куда хотят, и уходят, когда могут, и горе тому, кто попытается их заковать в цепи."
 seaborne_exalted_old: "Староморско-избранн"
 seaborne_exalted_old_adj: "Старые Морские Избранные"
 seaborne_exalted_old_adherent: "Старый морской избранный"
 seaborne_exalted_old_adherent_plural: "Старые морские избранные"

 listeners_of_thoronis: "Торонисск"
 listeners_of_thoronis_adj: "Слушающие Торониса"
 listeners_of_thoronis_adherent: "Слушающий Торониса"
 listeners_of_thoronis_adherent_plural: "Слушающие Торониса"
 listeners_of_thoronis_desc: "Торонис, будь то [Concept('dragons','Дракон')|E] или [Concept('magi','маг')|E], правивший когда-то северными землями [aeras|E], является предметом великого почитания среди народов Континента. Вера, возникшая на берегах залива, ныне названного в честь Патоса, некоторые [Concept('aversaria','аверсарианские')|E] учёные утверждают, что это может быть самая северная ветвь аверсарианских религий, хотя она всё же отличается от аэрсодиаксианцев Аэларвизии и аагиократов поздней империи. Самопровозглашённые Слушающие Торониса верят, что одноимённый бог Торонис породил океаны в выражении своего гнева против обитателей морского дна, отказавшихся воздать ему почести. Чтобы предотвратить повторение подобных трагедий, последователи регулярно приносят дары в виде огромных кораблей с жертвами, отправляемых в море, чтобы умилостивить бога, который взамен одаривает их спокойным морем и обильным урожаем. Ходят слухи, что эти жертвенные суда иногда перевозят людей во времена голода и штормов, когда считается, что их бог сильно разгневан, хотя существование таких практик яростно отрицается торонитами."
