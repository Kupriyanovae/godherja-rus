 abathonic_cult: "Абатонск"
 abathonic_cult_adj: "Абатонский культ"
 abathonic_cult_adherent: "Абатонский культист"
 abathonic_cult_adherent_plural: "Абатонские культисты"
 abathonic_cult_desc: "Поклонение Абатону, древнему пророку, богу-царю и создателю [Concept('shatteredisles','Островов')|E], существует тысячелетия. Абатонисты таинственны, но известно, что они верят, что их божественные [magi|E1] вознеслись после таинственного путешествия к каждому из островов Лей-линий, каким-то образом пережив их огромную силу и создав ритуал «Рождения души» для обретения бессмертия. Сохранились лишь фрагменты, но легенды гласят, что ритуал включает уничтожение души ребёнка и дарование пустого сосуда Абатону. Хотя верующих часто высмеивают за их верования, [Concept('aversaria','аверсарианцы')|E] потеряли множество экспедиций в поисках истины в легендах об Абатоне."
