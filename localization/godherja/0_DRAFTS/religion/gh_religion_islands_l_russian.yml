 deep_one_cult_religious_head_title: "Пророк"
 deep_one_cult_religious_head_title_name: "Пророк"

 black_abyss_cult: "Кидунавск"
 black_abyss_cult_adj: "Культ Кидунавы"
 black_abyss_cult_adherent: "Культист Кидунавы"
 black_abyss_cult_adherent_plural: "Культисты Кидунавы"
 black_abyss_cult_desc: "Кидунависты верят в Кидунаву — море-под-морем, которое является домом для демонов и злобных божеств, замышляющих против всей жизни над водой. Бедствия, случающиеся в море, воспринимаются как наказание от тех, кто обитает внизу, что побуждает последователей постоянно искать умиротворения, следуя множеству эзотерических суеверий. Известно, что некоторые последователи приращивают к своим телам части морских существ, веря, что те, кто носит часть глубин, не должны бояться глубин."
 black_abyss_cult_old: "Старокидунавск"
 black_abyss_cult_old_adj: "Старый культ Кидунавы"
