 calystoanistism: "Калистоанистск"
 calystoanistism_adj: "Калистоанизм"
 calystoanistism_adherent: "Калистоанист"
 calystoanistism_adherent_plural: "Калистоанисты"
 calystoanistism_desc: "Калистоанизм — это культ, сосредоточенный вокруг поклонения агионистскому святому Калисто, известному многим как величайший герой, когда-либо появившийся на [Concept('shatteredisles','Расколотых островах')|E]. Возникнув из немногих остатков команды легендарного пирата, которым удалось ускользнуть как от [Concept('aversaria','аверсарианцев')|E], так и от Воинствующего Ордена, калистоанисты твёрдо придерживались верований своего свободолюбивого покровителя, ценя личную автономию и свободу превыше всего. За это они яростно противостоят еретическому Святому Ордену Ключа Калисто, которого они считают просто рабовладельцами и еретиками самой низкой пробы. В отличие от большинства культов островов, сосредоточенных вокруг выдающихся героических фигур, калистоанизм считает Калисто божеством, сошедшим с небесного царства, чтобы объединить потерянные народы [Concept('aeras','Эраса')|E] воедино. Хотя он теперь вернулся в свою обитель в космосе, считается, что этим действием он оставил задачу завершить его святое дело человечеству — миссию, которую калистоанисты взяли на себя в своей задаче разорвать оковы рабства и установить эру полной свободы для всех народов Эраса."
 calystoanistism_high_god_name: "Калисто"
 calystoanistism__high_god_possessive: "Калисто"

 kidarian_dance: "Кидарианск"
 kidarian_dance_adj: "Кидарианский танец"
 kidarian_dance_adherent: "Кидарианский танцор"
 kidarian_dance_adherent_plural: "Кидарианские танцоры"
 kidarian_dance_desc: "Кидарианский танец, рождённый на [Concept('shatteredisles','Островах')|E] [Concept('sarradon','Саррадона')|E], видит всё существование через призму ритма и биений, где их боги — танцоры, а вселенная — их сцена. Естественные события, от лёгких бризов до мощных гроз, — это шаги и движения богов, а великие циклические узоры природы — это движения и темпы. Смертные тоже часть танца, хотя они не понимают биений, которым следуют, так, как это делают боги.\n\nКидарианские ритуалы, как и следовало ожидать, сосредоточены вокруг танца. Будь то подражание ритму бога в знак благодарности и хвалы, или использование собственных ритмов в надежде повлиять на окружающий мир, кидарианские жрецы знают барабанный бой для каждой мыслимой молитвы. Они посвящают себя во имя Кидар-аваха, первого человека, познавшего ритмы богов, и стремятся увидеть божественное, танцуя шаги богов в бесконечной неистовости. К сожалению для них, это скорее приводит к окровавленным ногам и сломанным лодыжкам, чем к просветлению."
 kidarian_dance_old: "Старокидарианск"
 kidarian_dance_old_adj: "Старый Кидарианский танец"
 kidarian_dance_old_adherent: "Старый кидарианский танцор"
 kidarian_dance_old_adherent_plural: "Старые кидарианские танцоры"

 theygundaropei_cult: "Пято-освобожденн"
 theygundaropei_cult_adj: "Культ Пятого"
 theygundaropei_cult_adherent: "Пятый освобождённый"
 theygundaropei_cult_adherent_plural: "Пятые освобождённые"
 theygundaropei_cult_desc: "Тысячелетие [Concept('aversaria','аверсарианского')|E] правления ознаменовалось возвышением и падением бесчисленных восстаний рабов на [Concept('shatteredisles','Островах')|E], часто совпадающих с шёпотом о древней борьбе против вечного [Glossary('Аавтократии','GH_AAUTOKRATA_GLOSS')] со стороны порабощённых масс. В хаосе [Concept('frodbrokna','Фродброкны')|E] тысячелетняя вера наконец вышла на свет по всем островам. История всегда начинается с Пятого, фигуры инакомыслия, давно преисполненной сожалений. В тени смерти Пятый возненавидел Четверых, увидев порчу запятнанной крови, которая едва не привела к гибели их народа.\n\nПятый проповедовал тем, кто готов был слушать, Истину — послание о предательстве, которое привело его новых последователей к отправлению его к древним богам прошлого. Пятеро должны пасть, их потомки быть истреблены, острова освобождены, их народ восстановлен на землях, которые они некогда называли домом, и положен конец войне, которая не была проиграна."

 favoured_ones: "Избранн"
 favoured_ones_adj: "Избранные"
 favoured_ones_adherent: "Избранный"
 favoured_ones_adherent_plural: "Избранные"
 favoured_ones_desc: "По деревням далёких западных [Concept('shatteredisles','Островов')|E], когда звёзды и луна выстраиваются в ряд, почти жуткая тишина опускается на острова тех, кто считает себя Избранными. Дома замолкают, корабли отдаются на милость волн, а общины собираются в различных обширных и древних каменных кругах. Каждый камень отмечен уникальным образом — будь то роспись, символ или даже старые слова, когда-то произнесённые с мудростью.\n\nВ этом круге легенд последователи вспоминают тех, кто был в прошлом, каждого героя и легенду своего времени. Рассказывают истории о силе, мудрости и славе, шепчут молитвы и передают сказания будущим потомкам. Каждого героя помнят, совершая ритуал, чтобы получить их благословение на грядущие годы. Самые древние и прославленные герои — это древние предки, когда-то наделённые Божественной Милостью, освобождённые от давно забытых хозяев и благословлённые новыми землями для поселения.\n\nВерующие считают, что их Милость была божественным даром, не так легко утраченным со временем. Пока их не забывают, их Милость может быть обретена вновь — надежда на нового героя для будущих поколений, которого можно будет почитать и помнить."
 favoured_ones_old: "Староизбранн"
 favoured_ones_old_adj: "Старые Избранные"
 favoured_ones_old_adherent: "Старый избранный"
 favoured_ones_old_adherent_plural: "Старые избранные"

 slain_eagle_cult: "Скорбящ"
 slain_eagle_cult_adj: "Скорбящие по Павшему Орлу"
 slain_eagle_cult_adherent: "Скорбящий"
 slain_eagle_cult_adherent_plural: "Скорбящие"
 slain_eagle_cult_desc: "Последователей этого изоляционистского культа боятся по всему [Concept('shatteredisles','Островам')|E] за их фанатизм, их вера известна лишь немногим торговцам и пыльным полкам в [Concept('aversaria','аверсарианских')|E] академиях. Последователи презирают народы островов, считая их соучастниками великого предательства, которое преследует их с тех пор. Они говорят о орле-хранителе, защитнике кроткого народа, благословлённого жить под его крыльями. Они были в безопасности, пока завистливый [Concept('magi','магов')|E] не перерезал горло их хранителю и не оставил их ужасам ночи. Со временем они окрепли, и когда пришло время, отправились в плавание, чтобы найти дом, где они могли бы оплакивать своего защитника в покое.\n\nС древних времён на их островах царит мир, большинство никогда не встречало орлиного знамени за свою жизнь. Однако раз в столетие распространяются слухи о небольшом флоте, бороздящем волны и убивающем любого Мага, которому не посчастливится пересечь их путь."
 slain_eagle_cult_old: "Староскорбящ"
 slain_eagle_cult_old_adj: "Старые Скорбящие по Павшему Орлу"
 slain_eagle_cult_old_adherent: "Старый скорбящий"
 slain_eagle_cult_old_adherent_plural: "Старые скорбящие"

 karoxos_cult: "Кароксианск"
 karoxos_cult_adj: "Путь Кароксоса"
 karoxos_cult_adherent: "Кароксианец"
 karoxos_cult_adherent_plural: "Кароксианцы"
 karoxos_cult_desc: "По западным [Concept('shatteredisles','Островам')|E] многие корабли отмечены странным символом — тремя треугольниками, окружёнными расходящимися лучами. Эти суда перевозят тех, кто следует Пути Кароксоса — древнего героя, давно ушедшего в легенды, почитаемого в различных формах по морям. Её истории, давно ставшие мифами, повествуют о великой одиссее по семи великим островам ранней [Concept('aversaria','аверсарианской')|E] эпохи. Будь то легенды о воинской доблести в войнах Абдексорна, разграблении трёх легендарных городов Символикса или эпической дуэли на Имперском острове ради любви и славы, все истории говорят о зове, голосе, взывающем к Кароксосу с далёких берегов и вдохновляющем её путешествия.\n\nВерующие считают, что когда её флот наконец вошёл в острова, которые она некогда называла домом, Кароксос поняла голос издалека. Последовало последнее наставление, вдохновившее тысячу лет последователей — просьба идти вперёд, бороздить моря и услышать зов самой. Считается, что на единственном корабле Кароксос отправилась в необузданные земли, вдоль древних рек и в земли ледяной зимы — путь, которому следуют самые преданные из почитателей."
 karoxos_cult_old: "Старокароксианск"
 karoxos_cult_old_adj: "Старый Путь Кароксоса"
 karoxos_cult_old_adherent: "Старый кароксианец"
 karoxos_cult_old_adherent_plural: "Старые кароксианцы"

 cleansed_ones: "Очищенн"
 cleansed_ones_adj: "Культ Очищенных"
 cleansed_ones_adherent: "Очищенный"
 cleansed_ones_adherent_plural: "Очищенные"
 cleansed_ones_desc: "На краю островных остатков [Concept('aversaria','Аверсарии')|E] древний культ Очищенных вновь возник после [frodbrokna|E], проповедуя новое послание о восстановлении в условиях всеобщей анархии. Несколько [Concept('shatteredisles','Островов')|E] попали под их влияние через кровавые восстания и жестокие завоевания, часто сопровождаемые массовыми чистками тех, кто считается нежелающим или неспособным понять бедствие, которое, по мнению последователей, было порождено тысячелетием аверсарианской деградации.\n\nВерующие говорят о древнем ритуале, известном только как Кровавое Испытание — испытании, которое позволяет [Concept('magi','магам')|E] очиститься, искоренить ложные верования, очистить свою кровь и открыть путь к Чистейшему. Говорят, что этот путь — благословение от высшей фигуры культа, так называемого «Гласа Чистейшего». Немногие изгнанники, покинувшие культ после Фродброкны, говорят о развращённом ритуале самобичевания, полном превосходстве Магов и широком порабощении простолюдинов, не обладающих [Concept('magic','магией')|E]."
 cleansed_ones_religious_symbol: "Священная капля"
 cleansed_ones_religious_text: "Слова Чистейшего"
 cleansed_ones_religious_head_title: "Глас"
 cleansed_ones_religious_head_title_name: "Глас"

 guillater_cult: "Гийятск"
 guillater_cult_adj: "Последователи Гийята"
 guillater_cult_adherent: "Культист Гийята"
 guillater_cult_adherent_plural: "Культисты Гийята"
 guillater_cult_desc: "Редкое единство, достигнутое Гийятом, навечно закрепило его наследие на просторах [Concept('shatteredisles','Островов')|E], сделав его самым любимым героем всех островных культов. Для его самых верных последователей, однако, Гийят — нечто гораздо большее. В смерти верующие считают, что Гийят перешёл за пределы земель героев, вознесясь, чтобы править пантеонами своей новообразованной империи вечно. Среди Последователей издавна зреет презрение к народам островов, которых они считают предателями наследия Гийята, разрушившими его империю и отвергнувшими его высокий статус.\n\n[Concept('frodbrokna','Фродброкна')|E] в их глазах — это долгожданное божественное наказание Гийята, праведное возмездие за невежество и отсутствие смирения островитян. За этим последовали радикализация и милитаризация, ибо их путь был прояснён через самое божественное откровение о самой священной войне. Последователи стремятся положить конец поклонению меньшим героям, низвергнуть идолопоклонство лжегероев в море и предложить острова Гийяту как жест подчинения верховному герою."

 distant_shore_cult: "Далёко-берегск"
 distant_shore_cult_adj: "Культ Далёкого Берега"
 distant_shore_cult_adherent: "Искатель Далёкого Берега"
 distant_shore_cult_adherent_plural: "Искатели Далёкого Берега"
 distant_shore_cult_desc: "Культисты Далёкого Берега — редкое явление на [Concept('aeras','Эрасе')|E], их редко можно увидеть за пределами разрозненных [Concept('shatteredisles','Островов')|E] их преданных последователей. Они проповедуют о земле героев глубоко под волнами, о далёком берегу, где ждёт рай. Только загадочный проповедник, известный как «Слушающий», может общаться с древними героями, живущими за берегом, — способность, передаваемая от проповедника к проповеднику через сложные ритуалы.\n\nКогда Слушающий наконец слышит их зов, самые добродетельные собираются на празднование своего последнего путешествия. С благословением Слушающего на защиту и руководством героев прошлого небольшой флот отправляется к Далёкому Берегу, проходя через земли, неизвестные даже самым опытным [Concept('aversaria','аверсарианским')|E] морякам, в великое приключение к земле за волнами."
 distant_shore_cult_old: "Стародалёко-берегск"
 distant_shore_cult_old_adj: "Старый культ Далёкого Берега"
 distant_shore_cult_old_adherent: "Старый искатель Далёкого Берега"
 distant_shore_cult_old_adherent_plural: "Старые искатели Далёкого Берега"
 distant_shore_religious_head_title: "Слушающий"
 distant_shore_religious_head_title_name: "Слушающий"

 hero_religion: "Геройск"
 hero_religion_adj: "Культ героя"
 hero_religion_adherent: "Культист героя"
 hero_religion_adherent_plural: "Культисты героев"
 hero_religion_desc: "«Культ героя» — это обобщающий термин для тысяч малых вер, связанных общей системой верований, которая ставит выдающихся смертных в центр поклонения, происходящих из Западных [Concept('shatteredisles','Островов')|E]. Хотя их легенды могут иногда включать упоминания о равнодушных божествах и сотрясающих мир левиафанах, большинство пантеонов культов героев состоят почти полностью из мужчин и женщин великих деяний, которые, как считается, имеют некоторую связь с местной историей — хотя эта связь часто может быть весьма сомнительной, спорной или полностью вымышленной. Несмотря на склонность к возвеличиванию великих воинов чаще, чем героев из других слоёв, рассказы о подвигах великих авантюристов, торговцев, учёных, плутов и [Concept('magi','магов')|E] ценятся не меньше, чем их более воинственные аналоги."
 hero_religion_old: "Старогеройск"
 hero_religion_old_adj: "Старый культ героя"
 hero_religion_old_adherent: "Старый культист героя"
 hero_religion_old_adherent_plural: "Старые культисты героев"

 deep_one_cult: "Фаламайск"
 deep_one_cult_adj: "Культ Фаламаи"
 deep_one_cult_adherent: "Фаламай"
 deep_one_cult_adherent_plural: "Фаламаи"
 deep_one_cult_desc: "«Силы глубин многообразны в своих формах и жестокостях, но им должно быть воздано поклонение, ибо их сила не знает равных». Так было научено фаламаи [Concept('hameh','Виридесцентным Пророком')|E]. Культисты печально известны тем, что убивают всех встреченных в море, иногда захватывая пленников для использования в кощунственном ритуале, превращающем их в проводников для общения с богами внизу."
 deep_one_cult_old: "Старофаламайск"
