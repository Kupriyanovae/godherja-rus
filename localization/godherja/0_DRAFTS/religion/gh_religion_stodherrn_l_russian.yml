 stodherrn_religion_adherent: "Cтотхерн"
 stodherrn_religion_adherent_plural: "Cтотхерны"
 stodherrn_religion_desc: "Вера Стотхерн видит мир как ствол, поддерживающий великое Древо, которое они называют Стотхруссигга. Выше по стволу находятся ветви, где обитают боги, а внизу, в корнях, покоятся мёртвые. Они верят, что их долг — быть хранителями древа, поддерживая его так же, как птицы и белки мирно живут в деревьях, которые называют своим домом. Почитание богов приносит им дары земли, а дурное обращение в конце концов приведёт к болезням и гниению, пока мир не станет лишь корявым пнём."

