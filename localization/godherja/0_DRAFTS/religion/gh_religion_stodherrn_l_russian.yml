 portenchant: "Портеншантск"
 portenchant_adj: "Портеншант"
 portenchant_adherent: "Портеншанец"
 portenchant_adherent_plural: "Портеншанцы"
 portenchant_desc: "Портеншанцы оказались завоёванными и угнетёнными под бичом [Concept('aversaria','аверсарианцев')|E], но их вера не сломилась. Сьялвольское вторжение освободило их от рабства, но они не желают мстить своим бывшим хозяевам. Вместо этого они хотят вернуться к изоляционизму и тихой вере, как это было, когда они были свободны."

