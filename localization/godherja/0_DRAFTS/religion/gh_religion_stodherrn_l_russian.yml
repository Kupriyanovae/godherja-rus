 dethedklann: "Детхедкланнск"
 dethedklann_adj: "Детхедкланнское соглашение"
 dethedklann_adherent: "Соглашенец"
 dethedklann_adherent_plural: "Соглашенцы"
 dethedklann_desc: "Представляя собой расходящуюся традицию в рамках веры Стотхерн, Детхедкланнское соглашение является наследниками пророка мондекни Адвакара, чья деятельность охватывала примерно V век от И.С. — по крайней мере, согласно попыткам учёных реконструировать часто противоречивые сообщения о жизни Адвакара.\n\nДетхедкланн берут своё название от места, где их пророк совершил самоубийство, умерев в пятый и последний раз, чтобы скрепить клятвы, которые его последователи дали хранить его послание в жизни и смерти. Они проповедуют, что боги приготовили для народа Стотхерн путь к преодолению этого мира в награду за тысячелетия их труда. Этот путь должен быть сначала открыт добродетельными деяниями и доблестной защитой — проактивной и с применением насилия, если необходимо — естественного порядка и своего народа. Последний тезис часто ставит их в противоречие с остальными пацифистскими стотхернскими верными, а то и вовсе отвергает их. О самом Адвакаре они сообщают, что его откровения происходили во время четырёх нисхождений в Корни самого мирового древа, где он неузнанно путешествовал среди мёртвых, чтобы украдкой взглянуть на чудеса богов под озорной защитой Сискуэра-Обманщика. Ему удалось осуществить этот обман, потому что он сам умер — пусть и временно. Его смерти наступили: первая — от удара молнии, вторая — через повешение, третья — от диких зверей, а четвёртая — когда он бросился с самого высокого дерева в мире. Каждый раз он восставал на следующий день и передавал своим последователям всё больше обещаний богов и предупреждений о будущем. По утверждению Детхедкланна, он не ошибся ни разу."