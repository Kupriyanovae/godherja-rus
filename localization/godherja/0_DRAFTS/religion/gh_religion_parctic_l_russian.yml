 partic_religion_adherent_plural: "партики"
 partic_religion_desc: "Партикская вера — это менее традиционная народная религия и больше система верований, пронизанная на всех уровнях изучением [Concept('magic','магии')|E]. Она верит в таинственное существо по имени «Серфли» на забытом языке, обычно переводимое на другие языки как «Великий». Все вещи, осязаемые и неосязаемые, исходят от Великого, и к Великому всё вернётся. Также существует пантеон более традиционных богов, которые, как считается, были заимствованы из более древней местной веры, но они рассматриваются лишь как эманации Великого и меньшие божества.\n\nСуществование можно разделить на две сферы: познаваемый мир тела и ощущаемый мир души. Ощущаемый мир сосуществует внутри и вне познаваемого мира, и через тщательную медитацию можно заглянуть сквозь тело в душу и черпать силу из ощущаемого мира. Это партики и считают магией."

