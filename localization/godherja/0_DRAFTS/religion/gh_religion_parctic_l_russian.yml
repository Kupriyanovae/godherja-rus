 wyld_pact_desc: "Провидцы, друиды, прорицатели и другие почтенные Мудрецы из Имперреха погружались в богатые истории клановых земель, сохранившиеся до XIII века, устанавливая неформальный договор о защите и сохранении Бродячих Лесов, чтобы древние маги лесов могли снова процветать. Верующие организовали свод правил и практик, вдохновлённых обычаями, принесёнными из Старого [Glossary('Старого Севера','OLD_NORTH_GLOSS')]."