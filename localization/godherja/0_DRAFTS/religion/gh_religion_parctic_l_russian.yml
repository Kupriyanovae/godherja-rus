 partic: "Партикск"
 partic_adj: "Партик"
 partic_adherent: "Партик"
 partic_adherent_plural: "Партики"
 partic_desc: "Партики посвящают свои жизни изучению и практике [Concept('magic','магии')|E] с великим рвением, всё это делается в строго формализованных ритуалах, передаваемых из уст в уста через поколения. Это привело к появлению множества невероятно искусных магов, владеющих искусством, которое кажется непонятно сложным для посторонних. Многие из самых талантливых [Concept('magi','магов')|E] в истории были партикского происхождения, и их способности столь же огромны, сколь непостижимы их мотивы."

 wyld_pact: "Дикодоговорн"
