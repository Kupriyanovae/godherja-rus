 cuthanagi_desc:0 "Последователи кутанаги верят, что Каширият — это земное отражение реки, протекающей в царстве богов, в то время как сами боги непостижимы и не имеют ни форм, ни имён. Вместо этого за состоянием реки наблюдают как за проявлением божественного пророчества; когда Каширият разливается, принося великое плодородие, это считается знаком радостного настроения богов, а когда её поражает засуха — грядущим апокалипсисом. Ярче всего это отражается в великих празднествах во время паводков, когда тысячи бумажных свечей отправляются плыть по течению реки."
