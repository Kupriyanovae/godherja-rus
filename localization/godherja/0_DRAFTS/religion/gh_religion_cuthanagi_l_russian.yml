 cuthanagi: "Кутанагск"
 cuthanagi_adj: "Кутанаги"
 cuthanagi_adherent: "Кутанагец"
 cuthanagi_adherent_plural: "Кутанагцы"
 cuthanagi_desc: "Кутанаги верят, что Каширият является смертным отражением реки, присутствующей в царстве божественного, при этом боги непознаваемы и не имеют ни форм, ни имён. Вместо этого состояние реки наблюдается как способ божественного пророчества; они утверждают, что радостное настроение богов наступает, когда Каширият разливается, оставляя после себя великое плодородие, и что наступает апокалипсис, когда река страдает от засухи. Наиболее примечательно это отражается в великих празднествах во время разливов, когда тысячи бумажных свечей отправляются вниз по течению реки."

 cuthanagi_religion: "Кашириятск"
 cuthanagi_religion_adj: "Кашириятское почитание"
 cuthanagi_religion_adherent: "Почитатель Каширията"
 cuthanagi_religion_adherent_plural: "Почитатели Каширията"
 cuthanagi_religion_desc: "Кашириятское почитание сосредоточено вокруг веры в божественную природу великой реки Каширият, которая образует традиционную границу между Айроноем и Каширией."

