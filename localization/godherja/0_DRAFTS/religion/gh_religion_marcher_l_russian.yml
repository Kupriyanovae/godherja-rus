 lifepath: "Раокурск"
 lifepath_adj: "Конклав Раокура"
 lifepath_adherent: "Идущий по пути"
 lifepath_adherent_plural: "Идущие по пути"
 lifepath_desc: "По достижении шестнадцати лет каждый марочник должен выбрать Путь (или, что более спорно, быть принуждён к этому родителем или сюзереном), который определяет его роль как в марочникском обществе, так и в мире. Его наставляет Путевой наставник — умелый человек, посвятивший свою жизнь обучению других. Посвящённые изучают пути почитаемых Святых пути прошлого, которые направляют духи, дабы помогать верным на их Пути. На протяжении большей части существования этой веры её жречество было организовано под началом [GetTitleByKey('d_lifepath_rel').GetNameNoTier]."

 becledienism: "Бекледиенск"
 becledienism_adj: "Бекледиенизм"
 becledienism_adherent: "Бекледит"
 becledienism_adherent_plural: "Бекледиты"
 becledienism_desc: "Бекледиенизм — это марочникская система верований, основанная радикальным монахом Урсо Бекледьевром в период «Войны принцев-еретиков» в истории Шевалье. Бекледиенизм вращается вокруг концепции, что Жизненный путь избирается при рождении, а не самим верующим, и что Путевой отец должен предсказать Путь при рождении, глядя на звёзды. Объявленный архиересью на Совете Экс вместе с прочими ересями, порождёнными в тот период, он тем не менее просуществовал на несколько десятилетий дольше своих собратьев-ересей благодаря относительно небольшому числу (основных) различий с исходной верой."

 darrallianism: "Дарраллианистск"
 darrallianism_adj: "Дарраллианизм"
 darrallianism_adherent: "Дарраллианист"
 darrallianism_adherent_plural: "Дарраллианисты"
 darrallianism_desc: "Основанный дворянкой, ставшей проповедницей, Катрин ден ва Дарралл, Дарраллианизм представляет собой эзотерическое смешение верований, сосредоточенное вокруг «Трёхпутья» — убеждения, что существуют лишь Пути Войны, Мира и Смерти. Дарралл также утверждала, что Путевые наставники должны править Шевалье как [Concept('clerical_control_of_chevalie','теократический класс')|E]. Это, а также её вера в то, что любой может стать Путевым наставником, привели к тому, что многие лорды обращались в эту веру, дабы установить власть через божественное право во время [Concept('war_of_the_heretic_princes','Войны принцев-еретиков')|E]."

 arderism: "Ардерианск"
 arderism_adj: "Ардеризм"
 arderism_adherent: "Ардерист"
 arderism_adherent_plural: "Ардеристы"
 arderism_desc: "Иконоборческие ардеристы (от [Concept('marchers','шевальенского')|E] слова «горение») видят в обожествлении духовных сущностей (таких как боги и Святые пути) источник всякой [Concept('magic','магии')|E] (и [Concetpt('liches','личи')|E]). Возглавляемые во время [Concept('war_of_the_heretic_princes','Войны принцев-еретиков')|E] загадочным '[Concept('the_black_monk','Чёрным монахом')|E]', сожжение десятков церквей и сотен религиозных артефактов, а также принятие этой веры многими военачальниками, стремившимися захватить церковные земли, часто приписывают краху власти Раокура в северном [chevalie|E]."

 saintsmarch: "Маршесвятойск"
 saintsmarch_adj: "Марш святых"
 saintsmarch_adherent: "маршесвятой"
 saintsmarch_adherent_plural: "маршесвятые"
 saintsmarch_desc: "Марш святых — это реваншистское движение, основанное ветераном-[Concept('antimagi','антимагов')|E], ставшим пророком, Вильдермуттом ден ва Сейсёнсом. Крайне милитаристское, оно ставит [GetTrait('way_of_nullification_follower').GetName( GetNullCharacter )] и [GetTrait('way_of_swords_follower').GetName( GetNullCharacter )] превыше всех прочих и утверждает, что мир может быть обретён только тогда, когда все [Concept('magi','маги')|E] будут мертвы. Хотя некоторое время его поддерживали несколько лордов, [war_of_the_noose|E] привела к упадку движения и его окончательному краху."

 innerpath: "Внутреннепутев"
 innerpath_adj: "Внутренний путь"
 innerpath_adherent: "Идущий по пути"
 innerpath_adherent_plural: "Идущие по пути"
 innerpath_desc: "«Внутренний путь» на самом деле является общим названием для нескольких версий Жизненного пути, обычно практикуемых в более отдалённых или суровых частях [chevalie|E], в основном в горной глуши, где ещё сохранились последние из галликадеров. Будучи куда более свободным во многих правилах и по своей природе, чем основное течение Жизненного пути, он является результатом попыток проповедников Жизненного пути примирить несколько исконных верований галликадеров с верованиями своей веры.\n\nХотя со временем он постепенно вышел из употребления и был в целом отвергнут марочникским обществом — особенно после всеобщей враждебности к фракционности в вере после Войны принцев-еретиков, — он тем не менее всё ещё популярен в некоторых кругах."

 coastpath: "Прибрежнопутев"
 coastpath_adj: "Прибрежный путь"
 coastpath_adherent: "Идущий по пути"
 coastpath_adherent_plural: "Идущие по пути"
 coastpath_desc: "«Прибрежный путь» представляет собой исключительно свободное собрание нескольких десятков отдельных вер, распространённых на побережье Коникменера, а также в юго-восточном [chevalie|E]. Будучи слиянием исконных верований в океанические и речные пантеоны с Жизненным путём, он пользовался несколькими столетиями относительной изоляции, прежде чем был жестоко искоренён Водером Бруданом из Коникменера в 772 году от И.С. в рамках его попыток централизовать королевство. Поскольку большая часть веры была уничтожена, а в Шевалье не было особого интереса или нужды в ней, шевальенцы вскоре после этого начали собственный процесс искоренения исконных вер, хотя отдельные очаги упорно выживали на протяжении веков."

 four_steps_of_salvation: "Четырёхшагоспасск"
 four_steps_of_salvation_adj: "Четыре шага спасения"
 four_steps_of_salvation_adherent: "Спаситель"
 four_steps_of_salvation_adherent_plural: "Спасители"
 four_steps_of_salvation_desc: "Четыре шага спасения были ересью Жизненного пути, сформированной в середине IX века шевальенским аристократом Тискулем ден ва Вескотом. Спасители проповедуют, что четыре истинных пути — это Путь Боли, Путь Крови, Путь Ужаса и Путь Страха, и требовали от своих последователей всего — от ритуального каннибализма до массовых пыток и убийств без разбора положения, пола или возраста.\n\nВсегда находясь на периферии, спасители привлекли внимание общественности после серии жестоких убийств в [Concept('peti_gisredde','Пети-Гисредде')|E] и ненадолго поднялись в нескольких городах, прежде чем были жестоко подавлены инквизиторскими силами вместе с более чем дюжиной рыцарских орденов. Сам Тискуль вместе со всей своей династией был публично казнён, и теперь «Тискуль» в шевальенском обществе считается чем-то вроде еретического ругательства."

 conclave_of_opakhasia: "Опахасийск"
 conclave_of_opakhasia_adj: "Конклав Опахасии"
 conclave_of_opakhasia_adherent: "Опахасиец"
 conclave_of_opakhasia_adherent_plural: "Опахасийцы"
 conclave_of_opakhasia_desc: "Основанный миссионерами Жизненного пути, Конклав Опахасии был официально учреждён с кодификацией «Восточных путей». Являясь странным слиянием языческих сьялволькских мифов и Жизненных путей марочников, Конклав Опахасии проповедует существование четырёх отдельных Жизненных путей. Путь Охоты, сосредоточенный на совершенствовании своего внутреннего «я»; Путь Меча, сосредоточенный на воинской практике и тренировке тела; Путь Пастыря, сосредоточенный на мирных занятиях и тренировке ума; и Путь Звёзд, сосредоточенный на магии и хитрости.\n\nХотя изначально это рассматривалось как странное, но многообещающее ответвление основной марочникской веры, и многие ожидали, что оно однажды присоединится к должной северной догме по мере укрепления связей, Вентелльское воззвание привело к объявлению Конклава Опахасии архиересью. С разрывом связей южные поклонники образовали собственный Конклав, чтобы противостоять теперь враждебным северянам, и практики южной веры быстро отделились от основной марочникской традиции."

 conclave_of_gisredde: "Гисреддск"
 conclave_of_gisredde_adj: "Конклав Гисредда"
 conclave_of_gisredde_adherent: "Гисреддец"
 conclave_of_gisredde_adherent_plural: "Гисреддцы"
 conclave_of_gisredde_desc: "Конклав Гисредда лучше всего охарактеризовать как «анти-Конклав» по отношению к [GetTitleByKey('d_lifepath_rel').GetNameNoTier]. Поскольку [Concept('peti_gisredde','Пети-Гисредд')|E] исторически противился любому внешнему вмешательству, следовало ожидать, что местные жители неизбежно начнут оспаривать (зачастую весьма бурно) влияние «иноземных» церквей — даже если те принадлежат к той же вере, находятся в том же королевстве и разделяют ту же культуру.\n\nВпервые провозглашённый в 389 году от И.С. во время Понтгонесского спора, Конклав то терял свою актуальность, то внезапно заявлял о себе каждые несколько десятилетий. Как правило, это совпадало с попытками Конклава Раокура навязать хоть какую-то ортодоксию вечно своенравным гисреддцам, а сам «раскол» прекращался лишь тогда, когда местным Путевым отцам предоставляли существенное снижение налогов."

 marcher_priest: "Путевой наставник"
 marcher_priest_plural: "Путевые наставники"

 holy_order_swords_of_ranos: "Мечи Раноса"
 holy_order_shields_way: "Щиты Пути"
 holy_order_champions_conclave: "Чемпионы Конклава"
 holy_order_the_pathwardens: "Стражи Пути"
