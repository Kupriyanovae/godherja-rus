 lifepath_religion: "Жизнепутев"
 lifepath_religion_adj: "Жизненный путь"
 lifepath_religion_adherent: "Идущий по пути"
 lifepath_religion_adherent_plural: "Идущие по пути"
 lifepath_religion_desc: "В отличие от других религий, последователи Жизненного пути заботятся больше о странствии по жизни, нежели о цели в загробном мире. Они верят в «вселенную часовщика», где всё бытие — совершенный механизм, но он может функционировать лишь при условии, что определённые роли должным образом исполняются человечеством. Как установил первый и величайший из Путевых отцов сэр Ранос для марочников, существует множество различных жизненных путей, которым люди могут следовать, но в определённых рамках. Вся гармония проистекает из того, что люди следуют этим путям, и весь хаос порождается отказом от этого.\n\nХотя [Concept('clerical_control_of_chevalie','клерикальный контроль над Шевалье')|E] всегда был достаточно жёсткий, [GetTitleByKey('d_lifepath_rel').GetNameNoTier] стал бесспорным главой Жизненных путей после [Concept('war_of_the_heretic_princes','Войны принцев-еретиков')|E], объявив раскол архиересью на Совете Экс в 1011 году от И.С. С тех пор, как Раокур одержал победу, большинство верных Жизненному пути придерживаются версии веры, в которой ортодоксия жёстко контролируется правящим Советом."

