 nalmavast_religion_desc:0 "Нальмаваст — это поклонение одноимённой Нальме и [Concept('domains_of_nalma','её обителям')|E], традиционной богине урожая и плодородия у лекийских народов. И всё же она лишь одна из многих, ведь нальмаваки не отрицают, что на [Concept('aeras','Аэрасе')|E] существует множество богов — богов, что принадлежат другим, богов, что не принадлежат никому, и богов, которые не принадлежат вовсе. Но из всех них лишь Нальма воистину их богиня, и точно так же лишь они принадлежат ей.\n\nОбычно изображаемая либо в облике крупной телки, либо в виде юной девы, Нальма, как говорят, следит за своим народом сквозь просветы между деревьями, из-под вод лесных ручьев и направляет его к плодородным пастбищам шелестом листьев. В обеих своих ипостасях она обладает множеством высеченных из камня рогов, а её кожа покрыта несметным числом кружащихся фрактальных узоров красного цвета, по которым струится жизненная кровь природного мира."
