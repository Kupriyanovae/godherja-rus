 nalmavast_religion_desc: "Нальмавастизм — это почитание одноимённой Нальмы и [Concept('domains_of_nalma','её обителей')|E], традиционной богини урожая и плодородия народа леков. Однако она лишь одна из многих, ибо нальмаваки не отрицают существования множества богов на [Concept('aeras','Эрасе')|E] — богов, принадлежащих другим, богов, не принадлежащих никому, и богов, которые не принадлежат вовсе. Из них лишь Нальма по-настоящему их, и потому лишь они принадлежат ей.\n\nОбычно изображаемая в образе либо крупной тёлки, либо юной девы, Нальма, как говорят, наблюдает за своим народом сквозь просветы между деревьями, из-под вод лесных ручьёв и направляет их к плодородным пастбищам шелестом листьев. В обоих своих обличьях её вырезанные из камня рога многочисленны, а кожа покрыта множеством переплетающихся красных узоров, через которые течёт жизненная сила мира природы."

