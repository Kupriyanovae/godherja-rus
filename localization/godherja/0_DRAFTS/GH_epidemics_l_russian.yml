 gh_health.5999.t:0 "Растущая тень"
 gh_health.5999.desc:0 "Нас захлестнули странные донесения и исполненные ужаса вести. В груди возрастает леденящий страх.\n\nЭта болезнь совершенно неестественна: её разносит мерзкая, иссиня-черная тень, пожирающая всё на своем пути. Бедняги, которым не повезло соприкоснуться с этими призраками прошлого, страдают от невыносимой боли и оказываются на грани смерти.\n\nСлухи приходят издалека, однако число беженцев растет с каждым днем. Как скоро тень подступит к порогу нашего дома?"
 gh_health.5999.a:0 "Ха! Пусть себе подыхают!"
 gh_health.5999.a.tt:0 "Это так далеко! Мы вполне можем порадоваться их несчастью."
 gh_health.5999.b:0 "Мы должны хоть что-то предпринять!"
 gh_health.5999.b.tt:0 "Запереть здания! Закрыть границы!"