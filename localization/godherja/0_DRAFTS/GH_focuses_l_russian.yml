 arcana_education:0 "[Concept( 'arcana', 'арканологическое' )|E] [Concept( 'education', 'образование' )|E]"
 education_arcana_1_outcome_description:0 "Постижение тайн арканологии так и не увлекло [ROOT.Char.GetHerHim] поиском сокрытых истин, и теперь время, проведённое за гримуарами, кажется [ROOT.Char.GetHerHim] заточением."
 education_arcana_2_outcome_description:0 "Мало кто из [Concept( 'magi', 'магов' )|E] назвали бы [ROOT.Char.GetHerHis] эрудированным арканистом, но [ROOT.Char.GetSheHe] хотя бы уверенно владеет базовыми познаниями."
 education_arcana_3_outcome_description:0 "[ROOT.Char.GetSheHe] знает множество великих тайн [Concept('aeras','Эраса')|E] и даже понимает их далеко идущие последствия."
 education_arcana_4_outcome_description:0 "Прежде всего [ROOT.Char.GetSheHe] обладает мастерским знанием тайных искусств, словно все загадки мира пали перед [ROOT.Char.GetHerHis] пером."
 arcana_neutral_trait_match_good_outcome:0 "При должном наставничестве даже ребёнок, проявлявший мало склонности к арканософии, вроде [ROOT.Char.GetFirstNamePossessive], может искренне ее постичь."
 arcana_neutral_trait_match_bad_outcome:0 "Долгое время я [Select_CString(ROOT.Char.IsFemale, 'надеялась', 'надеялся' )], что хорошего обучения хватит, дабы раскрыть [ROOT.Char.GetFirstName] тайны понимания мира. Однако все старания оказались тщетны."
 arcana_bad_trait_match_good_outcome:0 "Несмотря на то что [ROOT.Char.GetFirstName] больше [Select_CString(ROOT.Char.IsFemale, 'интересовалась', 'интересовался' )] материальным миром, а не сверхъестественным, у [ROOT.Char.GetHerHis] [Select_CString(ROOT.Char.IsFemale, 'развилась', 'развился' )] склонность к тайным искусствам."
 arcana_bad_trait_match_bad_outcome:0 "Возможно, вполне ожидаемо, что увлечённость [ROOT.Char.GetFirstNamePossessive] материальной повседневностью не принесла пользы [ROOT.Char.GetHerHis] пониманию тайных искусств."
 arcana_good_trait_match_good_outcome:0 "Будучи прирождённым арканистом, [ROOT.Char.GetFirstName] [Select_CString(ROOT.Char.IsFemale, 'далеко продвинулась', 'далеко продвинулся' )] в изучении тайного мира, что никого не должно удивлять."
 arcana_good_trait_match_bad_outcome:0 "Несмотря на то что [ROOT.Char.GetFirstName] всегда [Select_CString(ROOT.Char.IsFemale, 'стремилась', 'стремился' )] к тайнам и познанию, [ROOT.Char.GetSheHe] не [Select_CString(ROOT.Char.IsFemale, 'обрела', 'обрёл' )] ожидаемых познаний в тайном искусстве."
