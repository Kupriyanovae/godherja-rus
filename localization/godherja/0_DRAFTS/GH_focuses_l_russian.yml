 education_arcana:0 "Арканологическое образование"
 education_arcana_desc:0 "Изучение тайных, сверхъестественных и магических загадок [Concept('aeras','Эраса')|E]."
 education_arcana_tt.affinity:0 "\n\n#P Дети со свойством «[ROOT.Char.Custom('ChildhoodPersonalityTrait')]» часто преуспевают в арканологическом образовании.#!"
 education_arcana_tt.disaffinity:0 "\n\n#N Дети со свойством «[ROOT.Char.Custom('ChildhoodPersonalityTrait')]» могут испытывать трудности с арканологическим образованием.#!"
 education_arcana_effect_desc:0 "Выбор этого [Concept( 'education_focus', 'фокуса образования' )|E] также даст следующие эффекты:\n\n#P +1#! @skill_arcana_icon![arcana|E]"
 education_arcana_modifier:0 "Арканологическое образование"

 arcana_lifestyle_name:0 "Тайные искусства"
 arcana_lifestyle_desc:0 "Сосредоточение на раскрытии тайн [Concept('aeras','Эраса')|E]."
 arcana_lifestyle_highlight_desc:0 "Благодаря вашему арканологическому [Concept( 'education', 'образованию' )|E] вы получаете на #P [GetPlayer.Custom('GetEducationLifestylePercentageBoost')]#! больше [Concept( 'experience', 'опыта' )|E] в этом образом жизни."
 arcana_actuation_focus:0 "Фокус приведения"
 arcana_actuation_focus_modifier:0 "[GetFocus('arcana_actuation_focus').GetName]"
 arcana_actuation_focus_desc:0 "Действие и противодействие. Постижение сокрытых истин."
 arcana_actuation_focus_effect_desc:0 "Фокусировка на тайных экспериментах:\n\n#P +1#! @skill_arcana_icon![arcana|E]\n#P +5#! к #E шансу успешного сотворения заклинания#!"
 arcana_erudition_focus:0 "Фокус эрудиции"
