 arcana_cognition_focus_desc:0 "Тайны, погребенные в утраченных гримуарах и древнем камне, опасны как никогда."
 arcana_cognition_focus_effect_desc:0 "Фокусировка на материальных исследованиях:\n\n#P +2#! @skill_arcana_icon![arcana|E]\n#P +25%#! к #E восстановлению#! [Concept( 'magic', 'магии' )|E]"
 
 arcana_prowess_potential_tt:0 "[Concept('magic_prowess_skill','Магический доблести')|E]:[magic_prowess_i]#P +3#!"
 arcane_defense_tt:0 "#P +10#! @magic_icon![Concept( 'magic_resistance', 'сопротивления магии' )|E]"
 arcana_backfire_resistance_tt:0 "#P -25%#! к шансу @magic_icon![Concept( 'backfire', 'отдачи' )|E]!"
 arcane_relief_tt:0 "Снижает уровень [Concept( 'stress', 'стресса' )|E] при получении @magic_icon![Concept( 'magic', 'магии' )|E] от [Concept('gh_ritual','Заклинаний')|E]"
 arcana_spellcasting_success_bonus_tt:0 "#P +8#! к [Concept( 'spellcasting_success_chance', 'шансу успешного сотворения заклинания' )|E]"
 arcana_extended_baseline_bonus_tt:0 "@magic_icon! #P +25#! к [Concept( 'extended_magic_baseline', 'расширенному пределу магии' )|E] за каждый [Concept( 'title_tier', 'уровень титула' )|E]"
