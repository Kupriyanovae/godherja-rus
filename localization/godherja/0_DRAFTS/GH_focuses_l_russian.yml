 arcana_erudition_focus_desc:0 "Знание сил, как древних, так и новых."
 arcana_erudition_focus_effect_desc:0 "Фокусировка на тайных изысканиях:\n\n#P +3#! @skill_arcana_icon![arcana|E]"
 arcana_cognition_focus:0 "Фокус познания"
