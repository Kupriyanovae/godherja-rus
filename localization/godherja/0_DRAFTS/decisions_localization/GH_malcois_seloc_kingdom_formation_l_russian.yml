l_russian:
 gh_found_kingdom_seloc_decision: "Основать королевство Селок"
 gh_found_kingdom_seloc_decision_title: "Основать королевство Селок"
 gh_found_kingdom_seloc_decision_desc: "После того как наш народ пал под натиском [Concept('aversaria','аверсарианцев')|E], нас изгнали в горы, а [GetTitleByKey('c_lapithymna').GetNameNoTier] стала средоточием их власти. Сделав город столицей новой [ROOT.Char.GetFaith.GetName]ой державы, мы вновь превратим его в престол королей."
 gh_found_kingdom_seloc_decision_confirm: "Селок — сердце Малькои!"
 gh_found_kingdom_seloc_decision_tooltip: "Основать новое [GetFaithByKey('selvarossi_iyrossi').GetName]ое [Concept('kingdom','королевство')|E] в [GetTitleByKey('k_seloc').GetNameNoTier]"
 gh_found_kingdom_seloc_culture_tt: "Ваша [Concept('culture','культура')|E] — Кинамбростская"
 gh_found_kingdom_seloc_faith_tt: "Ваша [Concept('faith','конфессия')|E] — [GetFaithByKey('selvarossi_iyrossi').GetName]ая или её ответвление"
 gh_found_kingdom_seloc_duchy_tt: "Вы [Concept('hold','удерживаете')|E] и [Concept('completely_control','полностью контролируете')|E] любое [Concept('duchy','герцогство')|E], которое [de_jure|E] граничит с [GetTitleByKey('d_eretrona').GetName] и входит в [Concept('kingdom','королевство')|E], включающее более двух [de_jure|E] [Concept('duchies','герцогств')|E]"
 gh_found_kingdom_seloc_capital_tt: "[GetTitleByKey('c_lapithymna').GetNameNoTier] — ваша [Concept('realm_capital','столица державы')|E]"  
 iyrossi_monthly.1100.t: "Королевство Селок"
 iyrossi_monthly.1100.desc: "Моя власть теперь не вызывает сомнений, и коронация в [GetTitleByKey('c_lapithymna').GetNameNoTier] наконец прошла согласно замыслу.\n\nМы, [ROOT.Char.GetFaith.GetAdherentNamePlural], давно должны были основать собственную державу, отличную от владений соседей, чтобы поклоняться Селве и охранять её священное озеро!"
 iyrossi_monthly.1100.a: "Да процветает наше королевство!" 
 iyrossi_monthly.1101.desc: "Набирая силу, [seloc_former.GetTitledFirstName] [Select_CString(seloc_former.IsFemale, 'официально короновала', 'официально короновал' )] [seloc_former.GetHerselfHimself] в [GetTitleByKey('c_lapithymna').GetNameNoTier].\n\nМогущество нового [seloc_former.GetFaith.GetName]ого королевства больше не вызывает сомнений.\n\n"
 iyrossi_monthly.1101.stolen: "С этими дерзкими выскочками придётся разобраться как можно скорее!"
 iyrossi_monthly.1101.selvarossi_iyrossi: "Это добрая весть для нашей веры, но у неё может оказаться и оборотная сторона..."
 iyrossi_monthly.1101.a: "Долго они не протянут!"
 iyrossi_monthly.1101.b: "За ними стоит присматривать."
 iyrossi_monthly.1101.c: "Любопытно."  
 fp2_form_kingdom_seloc_modifier: "$iyrossi_monthly.1100.t$"
 fp2_form_kingdom_seloc_modifier_desc: "Этот персонаж основал новое королевство вокруг озера Селва"
