 gh_reclaim_wardenite_the_eastern_lands_decision: "Вернуть восточные земли"
 gh_reclaim_wardenite_the_eastern_lands_decision_desc: "Битва при Аль-Джаферразе в 1283 году от И.С. и гибель Хартаха Младшего оставили восточную часть Сирвалийского побережья без защиты, чем не преминули воспользоваться пустынные кочевники. Однако своим владычеством они обязаны нашей слабости, а не законному праву. Если мы вновь обезопасим побережье, земли Хенемхата и Сирвалийского побережья снова объединятся под властью единого королевства."
 gh_reclaim_wardenite_the_eastern_lands_decision_confirm: "Восточные земли вновь будут нашими"
 gh_reclaim_wardenite_the_eastern_lands_decision_tooltip: "Присоединить земли Хенемхата и Сирвалийского побережья к вашему [Concept('kingdom','королевству')|E]"
 create_greater_hammuhat_decision_effect_tooltip: "Будет основано королевство $k_greater_hammuhat$"
 gh_reclaim_wardenite_the_eastern_lands_decision_tt: "[Concept('duchies','Герцогские')|E] [Concept('title','титулы')|E] Хенемхат и Сирвалийское побережье [de_jure|E] войдут в состав державы [k_greater_hammuhat.GetName]"

 establish_almusid_culture_decision: "Перенять обычаи оседлых"
 establish_almusid_culture_decision_desc: "Наши предки не остались чужаками в захваченных землях: они выстояли, переняв обычаи покорённых народов. Теперь эти края принадлежат нам по праву завоевания, но одной победой не обеспечить благополучие грядущих поколений. Чтобы удержать завоёванное, мы должны сделать обычаи оседлых своими, как некогда поступили наши пращуры."
 establish_almusid_culture_decision_confirm: "Как поступали предки, так поступим и мы"
 establish_almusid_culture_decision_tooltip: "Смешать свою [Concept('culture','культуру')|E] с культурой местного населения"
 establish_almusid_culture_decision_effect.tt: "Все графства и персонажи культур [old_culture_1.GetName], [old_culture_2.GetName] и [old_culture_3.GetName] в этом регионе примут культуру [new_culture.GetName]"
 gh_ten_years_past_for_settling_nomad_requirement_tt: "Текущий год позднее #high 1308#! года от И.С."