 gh_great_struggle_wardenite_ending_decision: "Воплотить мечту Первого Вардена"
 gh_great_struggle_wardenite_ending_decision_tooltip: "Провозгласить победу и завершить Войну на небесах"
 gh_great_struggle_wardenite_ending_decision_desc: "Почти тысяча лет кровопролития наконец подошла к концу. Пусть все узрят, чего я [Select_CString(ROOT.Char.IsFemale, 'добилась', 'добился' )]! Первый Варден увидел порочность ритуалистов и зажёг пламя, которому было суждено поглотить их без остатка. Война на небесах, древний бич, пожиравший королей и королевства, склонилась перед моей мощью. Победа останется за мной там, где бесчисленные предшественники пали в борьбе со злом."
 gh_great_struggle_wardenite_ending_decision_confirm: "Завершить Войну на небесах"
 
 gh_great_struggle_ritualist_ending_decision: "Преображённые небеса"
 gh_great_struggle_ritualist_ending_decision_tooltip: "Провозгласить победу ритуалистов и завершить Войну на небесах"
 gh_great_struggle_ritualist_ending_decision_desc: "Звёзды, узревшие начало Войны на небесах, увидят и её конец. Свыше тысячи лет прошло с тех пор, как первый еретик обнажил меч против верующих. Я верну всё, что похитили язычники, и произнесу слова, которые завершат эту эпоху и откроют следующую."
 gh_great_struggle_ritualist_ending_decision_confirm: "Завершить Войну на небесах"

 gh_great_struggle_sarradon_divided_ending_decision: "Разделить Саррадон"
 gh_great_struggle_sarradon_divided_ending_decision_tooltip: "Война на небесах завершится без однозначного исхода"
 gh_great_struggle_sarradon_divided_ending_decision_desc: "Наши предшественники взирали на необъятность Саррадона и верили, что заставят все народы говорить одни и те же слова, а все сердца — биться в едином порыве веры. Теперь эта мечта кажется далёкой и наивной. Перед Саррадоном открывается новый путь."
