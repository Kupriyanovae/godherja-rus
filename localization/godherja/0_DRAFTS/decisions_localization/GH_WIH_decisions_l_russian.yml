 iyrossi_monthly.0001.t: "Вернуться к обычаям предков"
 iyrossi_monthly.0001.desc: "Теперь, когда с аверсарианцами в Малькое покончено, нам предстоит решить, какой веры держаться.\n\nМногие кланы ийроссов созвали великое собрание, чтобы собрать и обсудить древние сказания и обряды нашего народа. Они называют себя атбханцами. Стоит ли к ним присоединиться?"
 iyrossi_monthly.0001.a: "Да, мы отправимся на Собрание и поделимся знаниями нашей семьи"
 iyrossi_monthly.0001.b: "Нет. Селочанцы помнят истинную богиню ийроссов — Селву, богиню Озера. Мы присоединимся к ним."
 iyrossi_monthly.0001.c: "Нет. Цялоэнанцы рассказывают о доме Яон, передавшем людям священные Четырнадцать небесных методов. Они укажут нам путь к просветлению."
 iyrossi_monthly.0001.d: "Нет. Мы последуем обычаям сьялволков и примем веру тех, кого благословили боги."
 iyrossi_monthly.0001.e: "Мы не станем принимать какую-то варварскую религию. Истинная вера уже известна нам."