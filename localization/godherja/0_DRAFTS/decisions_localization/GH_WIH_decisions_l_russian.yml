 gh_far_eastern_sarradon_wardenite_victory_ending_decision_desc: "С тех пор как Убайдар и десять тысяч его воинов бесследно исчезли много веков назад, о варденитской власти на Дальнем Востоке Саррадона сохранились лишь смутные воспоминания. Многие называли поход Усуна Бишабелика безумием, его обращение — сомнительным, а власть — незаконной. И всё же ныне мы стоим там, где он мечтал оказаться, готовые воплотить как его мечту, так и мечту Первого Вардена об этих землях."
