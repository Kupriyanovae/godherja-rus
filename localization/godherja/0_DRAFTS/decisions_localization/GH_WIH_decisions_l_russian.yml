 gh_unalign_in_war_in_heaven_decision: "Покинуть сторону в Войне на небесах"
 gh_unalign_wardenite_decision_desc: "Какой бы смысл я некогда ни [Select_CString(ROOT.Char.IsFemale, 'видела', 'видел' )] в поддержке варденитов, отныне их дело меня не связывает. Борьба продолжится, но я больше не стану нести их бремя."
 gh_unalign_ritualist_decision_desc: "Ритуалисты обойдутся без меня. Некогда мой меч служил им, но участвовать в их деле я более не желаю. Пусть спорят и добиваются желаемого — я за ними не последую." 
 gh_unalign_agionist_decision_desc: "Я [Select_CString(ROOT.Char.IsFemale, 'следовала', 'следовал' )] за агионистами достаточно долго. Какую бы истину я когда-то ни надеялся обрести в их деле, я более не желаю добиваться её в этой борьбе. Отныне я найду свой собственный путь."
 gh_unalign_in_war_in_heaven_decision_tooltip: "Вы перестанете принимать активное участие в Войне на небесах"
