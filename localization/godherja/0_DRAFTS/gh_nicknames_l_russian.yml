 nick_iron_eye_gavan:0 "Железный Глаз"
 nick_iron_eye_gavan_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] хорошо известен своим глазным протезом из железа, который смотрит столь же сурово, как и настоящий."

 # SOUTHSEA #
 nick_the_gelded_gamalan:0 "Оскопленный"
 nick_the_gelded_gamalan_desc:0 "Попав в рабство еще ребенком, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] был кастрирован своими господами из катунов, чтобы гарантировать покорность и преданность."
 nick_peasant_saint:0 "Крестьянская Святая"
 nick_peasant_saint_desc:0 "Хотя вы ни дня не изучали богословие и не служили жрицей в храме, нищие крестьяне всё равно называют вас своей святой."
 
 # KATHUNI
 nick_white_dragon:0 "Белый Дракон"
 nick_white_dragon_desc:0 "За дерзкую, но гибкую тактику и блестящие успехи в подавлении мятежников Миат Шрунфан воины Ланонана прозвали [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] Белым Драконом."
