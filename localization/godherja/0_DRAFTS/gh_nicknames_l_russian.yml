 nick_gutterblade:0 "Заборный Нож"
 nick_unlucky_ravivarman:0 "Неудачливый"
 nick_the_bull_yohannaan:0 "Бык"
 nick_salt_lich:0 "Соляной Лич"
 nick_salt_lich_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] наводит ужас своей властью над темной бездной, скрытой глубоко под волнами."
 
 # KASHIRYA
 nick_scar_bound:0 "Связанный Шрамами"
 nick_scar_bound_desc:0 "Шрамы украшают тело [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] подобно ритуальным знакам. [CharYouSheHe(CHARACTER)] клянется честью освободить народ танумарейцев."
 nick_krakeneater:0 "Кракеноед"
 nick_krakeneater_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] однажды защитил корабль, вцепившись зубами в щупальце жуткого кракена, чем заслужил великую славу среди своего народа."
 nick_scourge_of_death:0 "Бич Смерти"
 nick_scourge_of_death_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] принес смертные объятия множеству гнусных культов смерти в Каширии, очищая землю словно карающий перст самой смерти."
 nick_the_spider_morthor:0 "Паук"
 nick_the_spider_morthor_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] искусен в расстановке ловушек против своих соперников, оставляя их беспомощными, словно мух в паутине."
 nick_son_of_many_suns:0 "Сын Многих Солнц"
 nick_son_of_many_suns_desc:0 "Легенды гласят, что когда [CHARACTER.GetShortUINameNoTooltipNoFormat] родился, небеса над Каширией раскололись, заставив солнечный свет воссиять с десятикратной силой."
