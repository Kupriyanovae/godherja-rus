 nick_the_just_amunahket:0 "Праведный"
 nick_the_hixartii: "Хиксартиец"
 nick_al_juhraab:0 "Аль-Джухрааб"
 nick_al_juhraab_desc:0 "Известный как «Скарабей», [CHARACTER.GetShortUINameNoTooltipNoFormat|U] получил свое прозвище после битвы при Хайфе, когда, сражаясь без доспехов, [CharYouSheHe(CHARACTER)] получил прямой удар в спину от воина-агиониста и остался без единой царапины, будто его тело было покрыто панцирем."
 nick_the_black_parshad:0 "Черный"
 
 # SJALVOLKI
 nick_witch_breaker:0 "Сокрушитель Ведьм"
 nick_witch_breaker_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] совершил невозможное: вместе с верными воинами взобрался на неприступные стены [mayikrata|E] и ворвался в ее хранилища, захватив бесценные знания и артефакты."
 nick_giantlayer:0 "Укротитель Великанш"
 nick_giantlayer_desc:0 "Поговаривают, будто на охоте [CHARACTER.GetShortUINameNoTooltipNoFormat] разделял ложе с великаншей. [CharYouSheHe(CHARACTER)] славится своими непристойными похождениями, ставшими предметом не одной фривольной песни."
 nick_the_acolyte:0 "Аколит"
 nick_the_acolyte_desc:0 "Искусный в заклинаниях и наговорах, [CHARACTER.GetShortUINameNoTooltipNoFormat] долгие годы исправно оказывал магические услуги своим владыкам."
 nick_mad_dog:0 "Бешеный Пёс"
 nick_mad_dog_desc:0 "Свирепый в бою и жаждущий славы, [CHARACTER.GetShortUINameNoTooltipNoFormat] не без оснований сравнивается с прославленными боевыми псами севера."
 nick_serpent_speaker:0 "Змеиный Язык"
 nick_serpent_speaker_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] окружен аурой недоверия, и люди знают, что не стоит верить [CharYourHerHis(CHARACTER)] елевым речам."
 nick_axe_in_the_hand:0 "Топор-в-Руке"
 nick_axe_in_the_hand_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] жаждет упоения битвой, и [CharYourHerHis(CHARACTER)] никогда не видят без топора или двух под рукой."
 nick_the_black_shaman:0 "Черный Шаман"
 nick_the_black_shaman_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] черпает радость, обращая свои силы против других, в пылу битвы часто не делая различий между другом и врагом."
 nick_ironskull:0 "Железный Череп"
 nick_ironskull_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] без труда сносит даже самые страшные удары в голову, хотя некоторые шутят, что это лишь потому, что внутри нечему повреждаться."
 nick_the_empty_handed:0 "С Пустыми Руками"
 nick_the_empty_handed_desc:0 "Желая выкроить собственное королевство, [CHARACTER.GetShortUINameNoTooltipNoFormat] опрометчиво вторгся в [aversaria|E] раньше Имперреха, но был отброшен назад, так ничего и не добившись."
 nick_the_old_dog:0 "Старый Пёс"
 nick_the_old_dog_desc:0 "Данное соперником Равмиром «Щитоедом», [CHARACTER.GetShortUINameNoTooltipNoFormat] превратил это оскорбительное прозвище в угрозу, когда, как говорят, лично откусил Равмиру голову."
 nick_shapechanger:0 "Оборотень"
 nick_shapechanger_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] участвовал в знаменитом набеге Сокрушителя Ведьм на [mayikrata|E], обретя способность свободно менять обличье."
 nick_crow_eye:0 "Вороний Глаз"
 nick_crow_eye_desc:0 "Глаза [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] черны как ночь, и многие шепчутся, будто [CharYourHerHis(CHARACTER)] взор способно пробить даже [Concept('the_fog','Туман')|E]."
 nick_earthshaker:0 "Сокрушитель Земли"
 nick_earthshaker_desc:0 "Воспользовавшись упавшим осколком [aervalr|E], [CHARACTER.GetShortUINameNoTooltipNoFormat] приумножил свои и без того немалые силы, чтобы покорить племена Гоан."
 nick_rosewolf:0 "Волчья Роза"
 nick_rosewolf_desc:0 "Назван так шевальенским ученым Митё Криде, который описал [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] как «Розу среди волков». Позже сьялволки сами переняли это прозвище."
 nick_bloodbeard:0 "Кровавая Борода"
 nick_bloodbeard_desc:0 ""
 nick_witch_lover:0 "Любитель Ведьм"
 nick_witch_lover_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] питает почти детское восхищение магией, посвятив себя ее изучению, несмотря на полное отсутствие способностей."
 nick_silver_speaker:0 "Серебряный Голос"
 nick_silver_speaker_desc:0 "Еще ребенком [CHARACTER.GetShortUINameNoTooltipNoFormat] умел склонять людские сердца, с легкостью собирая толпы последователей, несмотря на свое простое происхождение."
 nick_bitter_root:0 "Горький Корень"
 nick_bitter_root_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] питает лишь презрение к своему прошлому и никогда не оглядывается на жизнь, полную сожалений."
 nick_above_the_eye:0 "Выше Очей"
 nick_above_the_eye_desc:0 "Возвышаясь над большинством, [CHARACTER.GetShortUINameNoTooltipNoFormat] заставляет многих шептаться, будто в [CharYourHerHis(CHARACTER)] жилах течет кровь мидьотнаров, хотя никто не смеет сказать это в лицо."
 nick_shield_eater:0 "Щитоед"
 nick_shield_eater_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] печально известен дикими способами пробивать вражескую защиту."
 nick_ten_tree:0 "Десять Деревьев"
 nick_ten_tree_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] родился прямо среди кровавой бойни [battle_of_ten_trees|E] и, как говорят, даже не издал ни крика."
