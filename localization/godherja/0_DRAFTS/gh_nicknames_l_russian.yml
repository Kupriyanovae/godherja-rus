 nick_the_blighted_witch: "Проклятая Ведьма"
 nick_the_blighted_witch_desc: "Осквернительница, Вечная Супруга, Та-Кто-Просыпается-С-Луной. Легенды о Проклятой Ведьме шептались в Просторе с тех пор, как впервые собрался Ночной Двор, заставляя многих задуматься, принадлежит ли этот титул одной сущности или это мантия, передаваемая через поколения."

 nick_the_witch_of_the_north: "Ведьма Севера"

 # SARRADON #
 nick_ironheart: "Железное Сердце"
 nick_ironheart_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ведет [Select_CString(CHARACTER.IsLocalPlayer, 'ваш', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] орден с жестокой эффективностью, и друзья, и враги боятся [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] бессмысленной жестокости."

 nick_butcher_of_kahdavraka: "Мясник Кадавраки"
 nick_butcher_of_kahdavraka_desc: "Проклинаемые за организацию печально известной [Concept('kahdavrakan_supper','Кахдавраканской вечери')|E], [CHARACTER.GetShortUINameNoTooltipNoFormat] считается врагом всего [Concept('sarradon','Саррадона')|E] его народом."

 nick_coldwind: "Coldwind"
 
 nick_the_merry_medicus: "the Merry Medicus"

 nick_the_forgotten_saint: "[Select_CString(CHARACTER.IsFemale, 'Забытая Святая', 'Забытый Святой')]"
 nick_the_forgotten_saint_desc: "Титул, дарованный тем, кто считается безымянным. Самые ревностные их последователи считают, что даже произнесение этого эпитета уже является великим оскорблением, равным богохульству."
 
 nick_the_undying_sword_of_angels: "The Undying Sword of the Angels"
 nick_the_undying_sword_of_angels_desc: "The title is bestowed to they who wield the blade of [sarradon|E] against false idols as the blade wields them."

 nick_seaking: "[Select_CString(CHARACTER.IsFemale, 'Морская Королева', 'Морской Король')]"
 nick_seaking_desc: "Пиратская [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] слава легендарна, и рассказы о [Select_CString(CHARACTER.IsLocalPlayer, 'ваших', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] дерзких набегах разносятся по морям [Concept('aeras','Аэраса')|E]."

 nick_the_pale_sphinx: "[Select_CString(CHARACTER.IsFemale, 'Бледная Сфинкс', 'Бледный Сфинкс')]"
 nick_the_pale_sphinx_desc: "Назван так за [Select_CString(CHARACTER.IsLocalPlayer, 'ваш', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] необычный цвет лица и проницательный нрав, [CHARACTER.GetShortUINameNoTooltipNoFormat] считается большинством столь же опасным, как и [Select_CString(CHARACTER.IsLocalPlayer, 'ващ', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] тезка."

 nick_the_grim: "[Select_CString(CHARACTER.IsFemale, 'Мрачная', 'Мрачный')]"
 nick_the_grim_desc: "[Select_CString(CHARACTER.IsFemale, 'Суровая', 'Суровый')] в действиях и словах, [CHARACTER.GetShortUINameNoTooltipNoFormat] с трудом находит радость в том, что предлагает жизнь."
 
 nick_the_father_of_sarradon: "Отец Саррадона"
 nick_the_father_of_sarradon_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] объединил большую часть [Concept('sarradon','Саррадона')|E] под [Select_CString(CHARACTER.IsLocalPlayer, 'вашим', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] правлением, поклявшись, что [Select_CString(CHARACTER.IsLocalPlayer, 'вы', Select_CString(CHARACTER.IsFemale, 'она', 'он' ))] не успокоится, пока [Select_CString(CHARACTER.IsLocalPlayer, 'ваша', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] «семья» не будет полностью освобождена от ига [Concept('aversaria','аверсарианцев')|E]."

