 nick_naklan_returned:0 "Возвращенный"
 nick_naklan_returned_desc:0 "Многие верят, что [CHARACTER.GetShortUINameNoTooltipNoFormat|U] — реинкарнация легендарного [naklan_the_golden|E], владыки всего Дахангона."
 nick_thorn_queen:0 "Королева Терниев"
 nick_thorn_queen_desc:0 "Воплотив вековую мечту [nari_daya|E], [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ныне правит как грозная Королева Терниев Вехангуна."
 nick_bronzesinger:0 "Певец Бронзы"
 nick_bronzesinger_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] славится сверхъестественным мастерством работы с бронзой и заслуженно считается величайшим бронзолитейщиком эпохи."
 nick_sea_lion:0 "Морской Лев"
 nick_sea_lion_desc:0 "Своими подвигами и деяниями [CHARACTER.GetShortUINameNoTooltipNoFormat|U] доказал, что достоин унаследовать титул грозного Морского Льва Соклона — самого свирепого пиратского владыки восточных морей."
 nick_the_maze:0 "Лабиринт"
 nick_the_maze_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] получил это прозвище как за многочисленные татуировки, покрывающие тело, так и за склонность плести бесчисленные паутины интриг."
