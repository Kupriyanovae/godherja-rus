 nick_the_fairest_witch_desc: "Красота [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] сравнивается с красотой самой Королевы Фей."

 nick_iron_walker: "Железный Ходок"
 nick_iron_walker_desc: "С помощью своей уникальной магии Аксос способен создавать железный сосуд, чтобы делать то, что не может тело, в котором он родился."

 nick_void_walker: "Странница Пустоты"
 nick_void_walker_desc: "Говорят, что Никения обладает способностью ходить между мирами и планами, оставаясь невидимой."

 nick_blood_drinker: "[Select_CString(CHARACTER.IsFemale, 'Пьющая Кровь', 'Пьющий Кровь')]"
 nick_the_child_aautokratir: "Дитя-Автократ" 

 nick_one_day: "[Select_CString(CHARACTER.IsFemale, 'Однодневная', 'Однодневный')]"
 nick_one_day_desc: "Правя всего лишь один день, [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] никогда не получит шанса принять какие-либо значимые решения для государства."
 nick_black_ink: "Чёрные чернила"
 nick_warlike: "[Select_CString(CHARACTER.IsFemale, 'Воинственная', 'Воинственный')]"
 nick_warlike_desc: "Правя с мышлением на битву, [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] наиболее примечательной чертой была [Select_CString(CHARACTER.IsLocalPlayer, 'ваша', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] готовность к войне."

 nick_godrender: "[Select_CString(CHARACTER.IsFemale, 'Богоотступница', 'Богоотступник')]"
 nick_godrender_desc: "Горе тем, кто противостоит [CHARACTER.GetShortUINameNoTooltipNoFormat|U], ибо [Select_CString(CHARACTER.IsLocalPlayer, 'ваш', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] гнев, как говорят, внушает страх в сердца язычников и еретиков, а [Select_CString(CHARACTER.IsLocalPlayer, 'ваша', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] сила может разорвать небеса."

 nick_the_hallow: "the Hallow"
 nick_the_hallow_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] the breaker of strife, ending the perennial cycle with the promise of tomorrow's dawn."

 nick_the_false_ertomax: "the False"
 nick_the_false_ertomax_desc: "A plowman for three decades and the prophesied successor of [ertomax|E] for three months; a rebel whose claims of royal descent were cut down in [CharYourHerHis(CHARACTER)] first and only battle."

