 nick_wrath_braid:0 "Коса Гнева"
 nick_wrath_braid_desc:0 "Когда-то под слоем засохшей крови еще можно было разглядеть естественный цвет волос [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]. Наверное."
 nick_the_croaker:0 "Хрипун"
 nick_the_croaker_desc:0 "Голос [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] оставляет неизгладимое впечатление, даже если [CharYouSheHe(CHARACTER)] предпочитает об этом не думать."
 nick_the_anohelon:0 "Анохелон"
 nick_the_anohelon_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] стремился подняться выше своего положения — и сгорел в попытках."
 nick_bone_brow:0 "Костяной Лоб"
 nick_the_caseous:0 "Сырный"

 # PIRATE COAST #
 nick_blackrock:0 "Черный Утес"
 nick_blackrock_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] внушает страх на всех морях благодаря своим чудовищным силам над морскими пучинами."
 nick_wind_blade:0 "Клинок Ветра"
 nick_wind_blade_desc:0 "Несмотря на недуг, [CHARACTER.GetShortUINameNoTooltipNoFormat] считается мастером меча, который разит быстрее самого ветра."
 nick_empty_heart:0 "Бессердечный"
 nick_empty_heart_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] всегда славился жестокостью и полнейшим равнодушием к чужим страданиям."
 nick_the_wildfire:0 "Дикий Огонь"
 nick_the_wildfire_desc:0 "С самых молодых лет [CHARACTER.GetShortUINameNoTooltipNoFormat] обладает пылким и буйным нравом, с которым едва ли кому под силу сладить."
 nick_burning_star:0 "Палящая Звезда"
 nick_burning_star_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] разгромил своих соперников во время бушевавшего огненного шторма на самом пике последней [Concept('five_captains_war','великой пиратской войны')|E]."
 nick_sick_rat:0 "Чумная Крыса"
 nick_sick_rat_desc:0 "Гнусный кашель и болезненный цвет лица сопровождают каждый день жизни [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]."
 nick_rahksasa_maw:0 "Пасть Ракшаса"
 nick_mutterblade:0 "Бормочущий Клинок"
