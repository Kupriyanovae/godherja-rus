 # CHEVALIE
 nick_griffon_feed:0 "Корм для Грифонов"
 nick_griffon_feed_desc:0 "Несмотря на годы охоты, [CHARACTER.GetShortUINameNoTooltipNoFormat] окончил свой век в качестве ужина для [griffons|E]."
 nick_the_black_bastard:0 "Черный Бастард"
 nick_the_black_bastard_desc:0 "Всю жизнь [CHARACTER.GetShortUINameNoTooltipNoFormat] выделялся черными волосами, унаследованными от родной матери."
 nick_good_king:0 "Добрый Король"
 nick_good_king_desc:0 "Никто не воплощал королеву и королевские добродетели так, как [CHARACTER.GetShortUINameNoTooltipNoFormat], хотя многие с тех пор пытались."
 nick_the_ogre:0 "Огр"
 nick_the_ogre_desc:0 "Когда [CHARACTER.GetShortUINameNoTooltipNoFormat] был безымянным воином, соратники шутили над его размерами и давали эту кличку. Теперь мало кто смеется."
 nick_twisttongue:0 "Косноязычный"
 nick_twisttongue_desc:0 "Над [CHARACTER.GetShortUINameNoTooltipNoFormat] с самого детства насмехались из-за его речи, будто он ведет непрерывную войну со собственным языком."
 nick_blackclaw:0 "Черный Коготь"
 nick_blackclaw_desc:0 "Облаченный в черные доспехи верхом на черном грифоне, [CHARACTER.GetShortUINameNoTooltipNoFormat] своим видом вселяет ужас в сердца врагов."
 nick_rose_of_the_north:0 "Северная Роза"
 nick_rose_of_the_north_desc:0 "Прославленная своей красотой, [CHARACTER.GetShortUINameNoTooltipNoFormat] удивляет многих еще и невероятным мастерством владения клинком."
 nick_seaglide:0 "Скользящий по Волнам"
 nick_seaglide_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] подарил валадекам моря, и они этого никогда не забудут."
 nick_good_father:0 "Добрый Отец"
 nick_good_father_desc:0 "Добран слава опережает [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] как о заботливом [CHARACTER.GetMotherFather|U]."
 nick_king_of_varrdevet:0 "Король Варрдевета"
 nick_king_of_varrdevet_desc:0 "Впервые названный так по собственному настоянию, этот титул продолжал преследовать изгнанного графа Жиссенского как жестокая насмешка."
 nick_solstice_scourge:0 "Бич Солнцестояния"
 nick_solstice_scourge_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] бродит по землям неисчислимые годы, убивая ровно двенадцать мужчин и двенадцать женщин на двадцать пятый день двенадцатого месяца каждые двенадцать лет."
 nick_wisestar:0 "Мудрая Звезда"
 nick_wisestar_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] правит с мудростью и умом. [CharYouSheHe(CHARACTER)] прославился тем, что хитростью заставил злобных галликадов выдать свою порочную суть."
