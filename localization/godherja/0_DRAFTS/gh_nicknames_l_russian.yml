 nick_the_accursed_aschsepsen:0 "Проклятый"
 nick_the_pariah_uzaffard:0 "Изгой"
 nick_the_noble_tepafhosep:0 "Благородный"
 nick_the_philosopher_nviv:0 "Философ"
