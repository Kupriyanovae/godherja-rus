 nick_al_juhraab: "Al-Juhraab"
 nick_al_juhraab_desc: "Known as 'the Scarab,' [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] bestowed [CharYourHerHis(CHARACTER)] nickname after the Battle of Khaifa, during which [CharYouSheHe(CHARACTER)], fighting without armor, [CharWereWas(CHARACTER)] struck full-force in the back by an Agionist soldier and emerged without wound or mark, the blow glancing off as though [CharYourHerHis(CHARACTER)] body were encased in a shell of iron."

 nick_the_black_parshad: "the Black"

 # SJALVOLKI #
 nick_witch_breaker: "Крушитель Ведьм"
 nick_witch_breaker_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] совершил невозможное, взобравшись на неприступные стены [Concept('mayikrata','Майикратии')|E] с [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] самыми верными воинами и проникнув в его хранилища, захватив бесценные знания и артефакты."

 nick_giantlayer: "Убийца Гигантов"
 nick_giantlayer_desc: "Говорят, что [CHARACTER.GetShortUINameNoTooltipNoFormat] спал с гигантом во время охоты, и известен своими похабными приключениями, которые сделали [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] предметом многих непристойных песен."

 nick_the_acolyte: "Послушник"
 nick_the_acolyte_desc: "Искусный в заклинаниях и заговорах, [CHARACTER.GetShortUINameNoTooltipNoFormat] много лет успешно предоставлял магические услуги [Select_CString(CHARACTER.IsLocalPlayer, 'вашим', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] господам."

 nick_mad_dog: "Бешеный Пес"
 nick_mad_dog_desc: "Яростный в бою и всегда жаждущий славы, неудивительно, что [CHARACTER.GetShortUINameNoTooltipNoFormat] сравнивают с легендарными боевыми псами севера."

 nick_serpent_speaker: "Змееуст"
 nick_serpent_speaker_desc: "Аура недоверия окружает [CHARACTER.GetShortUINameNoTooltipNoFormat], и люди знают, что не стоит доверять [Select_CString(CHARACTER.IsLocalPlayer, 'вашим', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] сладким речам."

 nick_axe_in_the_hand: "Топор в Руке"
 nick_axe_in_the_hand_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] наслаждается азартом битвы, и  никогда не [Select_CString(CHARACTER.IsLocalPlayer, 'видны', Select_CString(CHARACTER.IsFemale, 'видна', 'виден' ))] без топора или двух под рукой."

 nick_the_black_shaman: "Черный Шаман"
 nick_the_black_shaman_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] наслаждается использованием [Select_CString(CHARACTER.IsLocalPlayer, 'вашим', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] сил против других, часто не делая различий между друзьями и врагами в пылу битвы."

 nick_ironskull: "Железный Череп"
 nick_ironskull_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] с легкостью отмахивается даже от самых сокрушительных ударов по [Select_CString(CHARACTER.IsLocalPlayer, 'вашей', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] голове, хотя некоторые говорят, что это потому, что внутри нечего повредить."

 nick_the_empty_handed: "С Пустыми Руками"
 nick_the_empty_handed_desc: "Желая создать собственное королевство, [CHARACTER.GetShortUINameNoTooltipNoFormat] опрометчиво вторгся в [Concept('aversaria','Аверсарию')|E] раньше Имперреха, только чтобы быть отброшенным назад без каких-либо достижений."

 nick_the_old_dog: "Старый Пес"
 nick_the_old_dog_desc: "Дарованное [Select_CString(CHARACTER.IsLocalPlayer, 'вашим', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] соперником, Равмиром «Пожирателем Щитов», [CHARACTER.GetShortUINameNoTooltipNoFormat] превратил это оскорбительное прозвище в угрозу после того, как якобы откусил голову Равмира [Select_CString(CHARACTER.IsLocalPlayer, 'вашими', Select_CString(CHARACTER.IsFemale, 'своими', 'своими' ))] зубами."

 nick_shapechanger: "Перевертыш"
 nick_shapechanger_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] участвовал в знаменитом набеге «Крушителя Ведьм» на [Concept('mayikrata','Майикратии')|E], получив способность свободно менять свою форму."

 nick_crow_eye: "Воронье Око"
 nick_crow_eye_desc: "Глаза [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] глубокого черного цвета, и многие шепчут, что [Select_CString(CHARACTER.IsLocalPlayer, 'ваш', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] взгляд пронзает даже [Concept('the_fog','Туман')|E]."

 nick_earthshaker: "[Select_CString(CHARACTER.IsFemale, 'Cотрясательница Земли', 'Cотрясатель Земли')]"
 nick_earthshaker_desc: "Используя упавший осколок [Concept('aervalr','Аэрвалра')|E], [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsFemale, 'усилила', 'усилил')] [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] и без того значительные силы, чтобы покорить племена гоа."

 nick_rosewolf: "Волчья роза"
 nick_rosewolf_desc: "Так назвал [CHARACTER.GetShortUINameNoTooltipNoFormat] ученый Митё Кридэ из [Concept('marchers','Шевалье')|E], описав [CHARACTER.GetShortUINameNoTooltipNoFormat] как «Розу среди Волков», что позже было адаптировано самими сьяволки в нынешней форму."

 nick_bloodbeard: "Кровавая Борода"
 nick_bloodbeard_desc: ""

 nick_witch_lover: "[Select_CString(CHARACTER.IsFemale, 'Любительница Ведьм', 'Любитель Ведьм')]"
 nick_witch_lover_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] обладает почти детским увлечением магией, посвящая [Select_CString(CHARACTER.IsLocalPlayer, 'ваше', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] время ее изучению, несмотря на отсутствие способностей к ней."

 nick_silver_speaker: "Среброговорящий"
 nick_silver_speaker_desc: "Даже в детстве [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsLocalPlayer, 'были', Select_CString(CHARACTER.IsFemale, 'была', был' ))] [Select_CString(CHARACTER.IsFemale, 'искусстна', 'искусстен')] в убеждении людей, легко собирая множество последователей, несмотря на [Select_CString(CHARACTER.IsLocalPlayer, 'ваше', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] низкое происхождение."

 nick_bitter_root: "Горький Корень"
 nick_bitter_root_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] питает только презрение к [Select_CString(CHARACTER.IsLocalPlayer, 'вашему', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] происхождению и никогда не оглядывается на прошлое, полное сожалений."

 nick_above_the_eye: "Выше Глаза"
 nick_above_the_eye_desc: "Возвышаясь над большинством, многие шепчут, что [CHARACTER.GetShortUINameNoTooltipNoFormat] частично мидётнар, хотя никто не осмеливается сказать это [Select_CString(CHARACTER.IsLocalPlayer, 'вам', Select_CString(CHARACTER.IsFemale, 'ей', 'ему' ))] в лицо."

 nick_shield_eater: "Пожиратель Щитов"
 nick_shield_eater_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]  печально [Select_CString(CHARACTER.IsLocalPlayer, 'известны', Select_CString(CHARACTER.IsFemale, 'известна', 'известен') ))] [Select_CString(CHARACTER.IsLocalPlayer, 'ваши', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] неортодоксальными способами пробивать оборону своих противников."

 nick_ten_tree: "Десять Деревьев"
 nick_ten_tree_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'родилась', 'родился') среди резни [Concept('battle_of_ten_trees','Битвы Десяти Деревьев')|E] и, как говорят, не издал ни звука."

