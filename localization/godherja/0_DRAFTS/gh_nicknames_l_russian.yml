 # AVERSARIA #
 nick_little_prick_maxios: "Мелкий Шип"
 nick_little_prick_maxios_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] слишком часто настаивает, что это имя относится к [Select_CString( CHARACTER.IsLocalPlayer, 'её', 'его' )] низкому росту и скверному характеру."

 nick_skin_muncher: "[Select_CString(CHARACTER.IsFemale, 'Пожирательница Кожи', 'Пожиратель Кожи')]"

 nick_black_braxos: "[Select_CString(CHARACTER.IsFemale, 'Черная', 'Черный')]"

 nick_flamecaller: "[Select_CString(CHARACTER.IsFemale, 'Призывающая Пламя', 'Призывающий Пламя')]"
 nick_flamecaller_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'известна', 'известен')] тем, что вызывает огромные пожары, чтобы поджечь [Select_CString(CHARACTER.IsFemale, 'её', 'его')] врагов."

 nick_stone_fist: "Каменный Кулак"

 nick_the_ixsian: "the Ixsian"

 nick_the_underking: "the Underking"
 nick_the_underking_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] united the tribes of the underworld and threw out the hated [magi|E], forming a great kingdom beneath the mountains."

 nick_one_eye_prefix: "[Select_CString(CHARACTER.IsFemale, 'Одноглазая', 'Одноглазый')]"

 nick_frostblood: "Ледяная Кровь"
 nick_frostblood_desc: "В жилах [CHARACTER.GetShortUINameNoTooltipNoFormat|U] течет лед."
 nick_old_frostblood: "Старая Ледяная Кровь"
 nick_old_frostblood_desc: "Несмотря на смерть [Select_CString(CHARACTER.IsFemale, 'её', 'его')] врагов, [CHARACTER.GetShortUINameNoTooltipNoFormat] упрямо отказывается умирать. Каким-то образом жизнь все еще бьется в [Select_CString(CHARACTER.IsFemale, 'её', 'его')] холодном сердце."

 nick_kindblood: "Доброкровный"
 nick_kindblood_desc: "Назван так крестьянами за [Select_CString(CHARACTER.IsFemale, 'её', 'его')] великую щедрость, [CHARACTER.GetShortUINameNoTooltipNoFormat] считается многими тем автократом, [Select_CString(random_npc.IsFemale, 'которая', 'который' )] спасет [Concept('aversaria','Аверсарию')|E]."

 nick_little_wailer: "Маленький Вой"
 nick_little_wailer_desc: "Как и [Select_CString(CHARACTER.IsFemale, 'её', 'его')] сестра, [CHARACTER.GetShortUINameNoTooltipNoFormat] также громко бросается в бой. К сожалению, высокий тон [Select_CString(CHARACTER.IsFemale, 'её', 'его')] воя только сбивает с толку, а не пугает [Select_CString(CHARACTER.IsFemale, 'её', 'его')] врагов."

 nick_big_wailer: "Большой Вой"
 nick_big_wailer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] бросается в бой с громогласными рыками, которые часто удивляют тех, кто видел [Select_CString(CHARACTER.IsFemale, 'её', 'его')] маленькое телосложение."

 nick_the_frigid: "Замороженный"
 nick_the_frigid_desc: "Дарованное многими, кто устал от [Select_CString(CHARACTER.IsFemale, 'её', 'его')] безумного хвастовства и заявлений [CHARACTER.GetShortUINameNoTooltipNoFormat] человек, застывший во времени, когда [Concept('aversaria','империя')|E] всё ещё правила миром."

 nick_firedrake: "Огнедышащий"
 nick_firedrake_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] мастерство в огненной магии легендарно, и [Select_CString(CHARACTER.IsFemale, 'она', 'он')] [Select_CString(CHARACTER.IsFemale, 'известна', 'известен')] тем, что [Select_CString(CHARACTER.IsFemale, 'убила', 'убил')]  дракона, подавив его пламя своим."

 nick_the_blood_sparrow: "Кровавый Воробей"
 nick_the_blood_sparrow_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'известна', 'известен')] [Select_CString(CHARACTER.IsFemale, 'её', 'его')] ловкостью на поле боя, появляясь как красное пятно для [Select_CString(CHARACTER.IsFemale, 'её', 'его')] врагов, когда [Select_CString(CHARACTER.IsFemale, 'она', 'он')] владеет знаменитым копьем [Select_CString(CHARACTER.IsFemale, 'её', 'его')] дома."

 nick_the_black_sun: "Черное Солнце"
 nick_the_black_sun_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] якобы родился, когда солнце почернело, и мир погрузился во тьму — утверждение, используемое [Select_CString(CHARACTER.IsLocalPlayer, 'вашими', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] последователями, чтобы доказать [Select_CString(CHARACTER.IsLocalPlayer, 'ваш, Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] статус спасителя, посланного [CHARACTER.GetFaith.HighGodName]."

 nick_skybane: "Гроза Небес"
 nick_skybane_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'известна', 'известен')] тем, что [Select_CString(CHARACTER.IsFemale, 'убила', 'убил')] могучую виверну, несмотря на то, что в [Select_CString(CHARACTER.IsFemale, 'её', 'его')] жилах нет ни капли магии."

 nick_skull_taker: "Собиратель Черепов"
 nick_skull_taker_desc: "Абсолютный ужас [Select_CString(CHARACTER.IsLocalPlayer, 'вашей', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] эпохи, [CHARACTER.GetShortUINameNoTooltipNoFormat] печально [Select_CString(CHARACTER.IsFemale, 'известна', 'известен')] тем, что собрал огромную коллекцию черепов и своими жестокими способами пополняет ее число."

 nick_the_most_fair_and_beautiful_ruler: "Самый Справедливый и Прекрасный Правитель"
 nick_the_most_fair_and_beautiful_ruler_desc: "Все в [Concept('aeras','Аэрасе')|E] смотрят на Мегиста с благоговением, ибо единственное, на что стоит смотреть, — это Мегист, и увидеть Мегиста — значит увидеть саму божественность."

 nick_the_last_iyrossi: "Последний Ийросси"
 nick_the_last_iyrossi_desc: "Сражаясь до последнего, [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] почитается ийросси, которые стремятся подражать [Select_CString(CHARACTER.IsFemale, 'ей', 'ему')] в своем стремлении к освобождению."

 nick_the_silver_blood: "Серебряная Кровь"
 nick_the_silver_blood_desc: "Когда-то почетное имя [Select_CString(CHARACTER.IsLocalPlayer, 'ваших', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] предков, теперь свидетельство [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] отношения к жизни как к товару."

 nick_the_silverblood: "[Select_CString(CHARACTER.IsFemale, 'Серебрянокровная', 'Серебрянокровный')]"
 nick_the_silverblood_desc: "Когда-то почетное имя [Select_CString(CHARACTER.IsLocalPlayer, 'ваших', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] предков, теперь свидетельство [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] отношения к жизни как к товару."

 nick_the_last_legionnaire: "Последний Легионер"
 nick_the_last_legionnaire_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]  [Select_CString(CHARACTER.IsFemale, 'одна', 'один')] из последних оставшихся легионеров, служивших и сражавшихся в [Concept('imperial_civil_war','имперской гражданской войне')|E], пережив даже империю, которой [Select_CString(CHARACTER.IsLocalPlayer, 'вы служили', Select_CString(CHARACTER.IsFemale, 'она служила', 'он служил' ))]."

 nick_chosen_of_the_purest: "[Select_CString(CHARACTER.IsFemale, 'Избранница Чистейшего', 'Избранник Чистейшего')]"
 nick_chosen_of_the_purest_desc: "[Select_CString(CHARACTER.IsFemale, 'Выбранная', 'Выбранный')] случайно и воспитанный как марионетка. Некоторые надеются, что [CHARACTER.GetShortUINameNoTooltipNoFormat] когда-нибудь сможет оправдать это имя, но многие сомневаются в [Select_CString(CHARACTER.IsLocalPlayer, 'ваших', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] шансах."

 nick_blackguard: "Предатель"
 nick_blackguard_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] повернул спину к империи, которой он когда-то служил, заслужив ненависть своих бывших товарищей."

 nick_lord_of_the_ashes: "Повелитель Пепла"
 nick_lord_of_the_ashes_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] вызвал [Concept('frodbrokna','Фродброкну')|E], даровав [Concept('imperial_civil_war','победу')], которую [Select_CString(CHARACTER.IsLocalPlayer, 'вы', Select_CString(CHARACTER.IsFemale, 'она', 'он' ))] долго желал, но ценой разрушения [Concept('aeras','Аэраса')|E]."

 nick_I: "I"
 nick_I_desc: "Названный в честь великого Мегиста, Мегист только надеется, что Мегист сможет оправдать великолепие Мегиста."

 nick_II: "II"
 nick_II_desc: "Также назван в честь отца Мегиста, Мегист знает, что Мегист так же великолепен, как Мегист, но гораздо лучше выглядит."

 nick_III_the_older_Megistos: "III Старший Мегист"
 nick_III_the_older_Megistos_desc: "Мегист назван так, чтобы отличать Мегиста от младшего Мегиста, к огорчению старшего Мегиста."

 nick_III_the_younger_Megistos: "III Младший Мегист"
 nick_III_the_younger_Megistos_desc: "К этому моменту некоторые начинают задаваться вопросом, дано ли имя Мегиста из-за тщеславия или отсутствия воображения."

 nick_bane_of_azzykrazz: "Гроза Аззи'краза"
 nick_bane_of_azzykrazz_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] посвятил [Select_CString(CHARACTER.IsLocalPlayer, 'вашу', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] жизнь охоте на демона Аззи'краза, принесшего [Concept('the_fog','Туман')|E]."

 nick_the_heart_eater: "Пожиратель Сердец"
 nick_the_heart_eater_desc: "Многие шепчут, что [CHARACTER.GetShortUINameNoTooltipNoFormat] практикует [Select_CString(CHARACTER.IsLocalPlayer, 'вы', Select_CString(CHARACTER.IsFemale, 'она', 'он' ))] гнусные обычаи северных варваров, поедая плоть врагов и друзей."

 nick_five_lives: "Пять Жизней"
 nick_five_lives_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] неоднократно [Select_CString(CHARACTER.IsFemale, 'обманывала', 'обманывал')] смерть, к изумлению и огорчению [Select_CString(CHARACTER.IsLocalPlayer, 'ваших', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] врагов."

 nick_the_sea_sword: "Морской Меч"

 nick_ash_killer: "Убийца Пепла"

 nick_tharnaz_garnaz: "[Select_CString(CHARACTER.IsFemale, 'Самая Амагейская', 'Самый Амагейский')] "
 nick_tharnaz_garnaz_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] воплощает идеал Амагеи, [Select_CString(CHARACTER.IsFemale, 'построенная', 'построенный')] как гора, с гордостью и способностью к насилию, соответствующими этому."

 nick_iron_spike: "Железный Шип"
 nick_iron_spike_desc: "Назван так за [Select_CString(CHARACTER.IsLocalPlayer, 'вашу', Select_CString(CHARACTER.IsFemale, 'её', 'кго' ))] жестокую практику сажать на кол диссидентов и повстанцев, [CHARACTER.GetShortUINameNoTooltipNoFormat]  боятся многие и никто не считает другом ."

 nick_black_of_eyes: "Черноглазый"
 nick_black_of_eyes_desc: "У некоторых [Concept('magi','магов')|E] глаза начинают светиться силой после постоянного колдовства. Это не относится к [CHARACTER.GetShortUINameNoTooltipNoFormat], чьи глаза окрашены в тьму, лишенную света."

 nick_glassblade: "Стеклянный Клинок"
 nick_glassblade_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]  [Select_CString(CHARACTER.IsFemale, 'известна', 'известен')] стеклянным мечом, который [Select_CString(CHARACTER.IsLocalPlayer, 'вы носите', Select_CString(CHARACTER.IsFemale, 'она носит', 'он носит' ))], орудием войны, созданным мирной культурой в процессе перемен."

 nick_splinter: "Заноза"
 nick_splinter_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'доказала', 'доказал')], что даже самый маленький порез может сокрушить грозного врага."

 nick_smiling_axe: "Улыбающийся Топор"
 nick_smiling_axe_desc: "Немногие вещи приносят [CHARACTER.GetShortUINameNoTooltipNoFormat] столько радости, как битва, и улыбка всегда присутствует на [Select_CString(CHARACTER.IsLocalPlayer, 'вашем', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] лице, когда [Select_CString(CHARACTER.IsLocalPlayer, 'вы', Select_CString(CHARACTER.IsFemale, 'она', 'он' ))] рубит [Select_CString(CHARACTER.IsLocalPlayer, 'ваших', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] врагов."

 nick_bleak_speaker: "Мрачный Оратор"
 nick_bleak_speaker_desc: "Многое было сказано о [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] ораторском мастерстве и о том, как [Select_CString(CHARACTER.IsLocalPlayer, 'ваши', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] аргументы могут легко привести в отчаяние даже самого опытного противника."

 nick_sub_aautokratia: "Малый автократ"
 nick_sub_aautokratia_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString(CHARACTER.IsFemale, 'объявила', 'объявил')] себя «Малым автократом», дерзкой попыткой присвоить себе власть, далеко выходящую за пределы [Select_CString(CHARACTER.IsLocalPlayer, 'вашего', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] положения."

 nick_silverbane: "Бич Серебра"
 nick_silverbane_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] полностью уничтожил Легион XLV «Серебрянокровных» во время Восстания синих мантий , положив конец его легендарному наследию."

 nick_blackmask: "Черная Маска"
 nick_blackmask_desc: "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] отличительная маска внушает страх среди ольтенов, которые видят в [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Select_CString(CHARACTER.IsFemale, 'ней', 'нем' ))] символ, организовавшего завоевание сотни кланов."

 nick_voice_kaigan: "Голос Кайгана"
 nick_voice_kaigan_desc: "Сам [Glossary('Кайган','GH_KAIGAN_GLOSS')], как говорят, выбрал [Select_CString(CHARACTER.IsFemale, 'эту', 'этого')] [Select_CString(CHARACTER.IsFemale, 'женщину', 'мужчину')] своим пророком, и верующие в масках не осмеливаются оспаривать [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] слова."

 nick_storm_whisper: "Шепот Бури"
 nick_storm_whisper_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]  [Select_CString(CHARACTER.IsFemale, 'известна', 'известен')] [Select_CString(CHARACTER.IsLocalPlayer, 'вашим', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] мастерством в [Concept('aspect_air','воздушной')|E] магии и  [Select_CString(CHARACTER.IsFemale, 'известна', 'известен')] тем, что вызывает целые бури одним лишь дыханием."

 nick_the_adventurer: "Искатель Приключений"
 nick_the_adventurer_desc: "От южных морей до северных диких земель, [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString(CHARACTER.IsFemale, 'путешествовала', 'путешествовал')] по всей землям [Concept('aeras','Аэраса')|E], видя чудеса, невиданные большинству [Select_CString(CHARACTER.IsLocalPlayer, 'вашего', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] народа."

 nick_black_adriax: "Черный"
 nick_black_adriax_desc: "«Адриакс, Адриакс, весь в черном. Знай свое место, иначе он вернется.»"

 nick_ironclad: "Железный Доспех"
 nick_ironclad_desc: "Немногие видели [CHARACTER.GetShortUINameNoTooltipNoFormat] вне [Select_CString(CHARACTER.IsLocalPlayer, 'ваших', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] доспехов, и как подчиненные, так и противники часто принимали [Select_CString(CHARACTER.IsLocalPlayer, 'вас', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] за мужчину из-за [Select_CString(CHARACTER.IsLocalPlayer, 'вашего', Select_CString(CHARACTER.IsFemale, 'её', 'его' ))] телосложения."

 nick_the_echoer: "the Echoer"
 nick_the_echoer_desc: "Few have ever known a toady as willing as [CHARACTER.GetShortUINameNoTooltipNoFormat] — one must wonder if [CharYouSheHe(CHARACTER)] has ever had a thought of [CharYourHerHis(CHARACTER)] own."

 nick_the_black_tongued: "the Black Tongued"
 nick_the_black_tongued_desc: "The black tongue of [CHARACTER.GetShortUINameNoTooltipNoFormat] is not only the result of [CharYourHerHis(CHARACTER)] dark rituals, but from the poison all know [CharYouSheHe(CHARACTER)] speaks."

 nick_the_verogii: "the Verogii"

 nick_the_old_guard: "Старая Гвардия"

 nick_the_free_one: "[Select_CString(CHARACTER.IsFemale, 'Свободная', 'Свободный')]"

