 nick_thirdclaw:0 "Третий Коготь"
 nick_thirdclaw_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] долго и верно служил Бронзовой Гавани в качестве главного генерала, из-за чего многие видят в нем третий драконий коготь, защищающий город от бед."
