 nick_iron_spike: "Железный Кол"
 nick_iron_spike_desc:0 "Получивший прозвище за жестокую привычку сажать на кол инакомыслящих и мятежников, [CHARACTER.GetShortUINameNoTooltipNoFormat] наводит страх на всех и никого не считает другом."
 nick_black_of_eyes: "Черноокий"
