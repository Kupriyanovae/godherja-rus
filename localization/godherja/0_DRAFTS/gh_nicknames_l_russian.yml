 nick_one_eye_prefix:0 "Одноглазый"
 nick_frostblood:0 "Морозная Кровь"
 nick_frostblood_desc:0 "В жилах [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] течет чистый лед."
 nick_old_frostblood:0 "Старая Морозная Кровь"
 nick_old_frostblood_desc:0 "Несмотря на гибель всех своих соперников, [CHARACTER.GetShortUINameNoTooltipNoFormat] упрямо отказывается умирать. Каким-то образом жизнь все еще теплится в [CharYourHerHis(CHARACTER)] ледяном сердце."
 nick_kindblood:0 "Доброкровный"
 nick_kindblood_desc:0 "Прозванный так простым людом за великую щедрость, [CHARACTER.GetShortUINameNoTooltipNoFormat] многими считается Ааутократиром, которому предназначено спасти [aversaria|E]."
 nick_little_wailer:0 "Маленький Вопль"
 nick_little_wailer_desc:0 "Как и ее сестра, [CHARACTER.GetShortUINameNoTooltipNoFormat] со скрежетом и пронзительным визгом бросается в бой. Увы, столь высокий писк лишь сбивает с толку [CharYourHerHis(CHARACTER)] врагов, а вовсе не пугает их."
 nick_big_wailer:0 "Великий Вопль"
 nick_big_wailer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] рвется в бой с гортанным рыком такой силы, что он изумляет любого, кто видел [CharYourHerHis(CHARACTER)] щуплое телосложение."
 nick_the_frigid:0 "Застывший"
 nick_the_frigid_desc:0 "Это прозвище дали многие, кому наскучили [CharYourHerHis(CHARACTER)] безумные хвастливые речи. [CHARACTER.GetShortUINameNoTooltipNoFormat] — это [CHARACTER.GetWomanMan], застрявший во временах, когда [Concept('aversaria','Империя')|E] правила миром."
 nick_firedrake:0 "Огненный Змей"
 nick_firedrake_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] мастерство в магии огня легендарно: говорят, [CharYouSheHe(CHARACTER)] сразил дракона, испепелив его собственным пламенем."
 nick_the_blood_sparrow:0 "Кровавый Воробей"
 nick_the_blood_sparrow_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] славится ловкостью на поле боя. Для врагов [CharYouSheHe(CHARACTER)] лишь алое размытое пятно, разящее знаменитым копьем своего Дома."
 nick_the_black_sun:0 "Черное Солнце"
 nick_the_black_sun_desc:0 "Поговаривают, будто [CHARACTER.GetShortUINameNoTooltipNoFormat|U] родился в момент, когда солнце выгорело дочерна и мир погрузился во тьму. Последователи используют это как доказательство того, что [CharYouSheHe(CHARACTER)] — спаситель, посланный [CHARACTER.GetFaith.HighGodName]."
 nick_skybane:0 "Гроза Небес"
 nick_skybane_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] снискал славу, сразив могучую виверну, хотя в [CharYourHerHis(CHARACTER)] жилах нет ни капли магии."
 nick_skull_taker:0 "Череполом"
 nick_skull_taker_desc:0 "Настоящий кошмар своей эпохи, [CHARACTER.GetShortUINameNoTooltipNoFormat] печально известен огромной коллекцией черепов и зверскими способами ее пополнения."
 nick_the_most_fair_and_beautiful_ruler:0 "Самый Прекрасный и Благородный Владыка"
 nick_the_most_fair_and_beautiful_ruler_desc:0 "Весь [Concept('aeras','Эрас')|E] с трепетом взирает на Мегистоса, ибо единственный, кто достоин взора — это Мегистос, а созерцать Мегистоса — значит созерцать само божество."
 nick_the_last_iyrossi:0 "Последний Ийросс"
 nick_the_last_iyrossi_desc:0 "Сражаясь до последнего, [CHARACTER.GetShortUINameNoTooltipNoFormat] заслужил глубокое уважение среди ийросси, которые стремятся подражать [CharYouHerHim(CHARACTER)] в борьбе за освобождение."
 nick_the_silver_blood:0 "Среброкровный"
 nick_the_silver_blood_desc:0 "Когда-то это было почтенное имя [CharYourHerHis(CHARACTER)] предков, а ныне — лишь напоминание о том, что [CHARACTER.GetShortUINameNoTooltipNoFormat] относится к чужим жизням как к дешевому товару."
 nick_the_silverblood:0 "Среброкровный"
 nick_the_silverblood_desc:0 "Когда-то это было почтенное имя [CharYourHerHis(CHARACTER)] предков, а ныне — лишь напоминание о том, что [CHARACTER.GetShortUINameNoTooltipNoFormat] относится к чужим жизням как к дешевому товару."
 nick_the_last_legionnaire:0 "Последний Легионер"
 nick_the_last_legionnaire_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] — один из последних оставшихся в живых легионеров, сражавшихся в [imperial_civil_war|E]. [CharYouSheHe(CHARACTER)] пережил даже саму империю, которой служил."
 nick_chosen_of_the_purest:0 "Избранник Чистейших"
 nick_chosen_of_the_purest_desc:0 "Случайно выбранный и возвышенный, чтобы стать марионеткой. Некоторые надеются, что [CHARACTER.GetShortUINameNoTooltipNoFormat] когда-нибудь сможет оправдать это имя, но многие сомневаются в [CharYourHerHis(CHARACTER)] успехах."
 nick_blackguard:0 "Отступник"
 nick_blackguard_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] отвернулся от империи, которой когда-то служил, чем заслужил лютую ненависть бывших соратников."
 nick_lord_of_the_ashes:0 "Владыка Пепла"
 nick_lord_of_the_ashes_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] спровоцировал [frodbrokna|E], что принесло давно желанную [Concept('imperial_civil_war','победу')], но ценой раскола самого [aeras|E]."
 nick_I: "Первый"
 nick_I_desc:0 "Названный в честь великого Мегистоса, Мегистос лишь надеется, что Мегистос сможет соответствовать величию Мегистоса."
 nick_II: "Второй"
