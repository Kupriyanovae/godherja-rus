 nick_III_the_older_Megistos: "Третий Мегистос Старший"
 nick_III_the_older_Megistos_desc:0 "Мегистоса назвали так, чтобы отличить Мегистоса от младшего Мегистоса, к вящему раздражению старшего Мегистоса."
 nick_III_the_younger_Megistos: "Третий Мегистос Младший"
 nick_III_the_younger_Megistos_desc:0 "К этому моменту некоторые начинают задумываться, дано ли имя Мегистоса из тщеславия или просто от нехватки воображения."
 nick_bane_of_azzykrazz: "Погибель Аззи'кразза"
 nick_bane_of_azzykrazz_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] посвятил жизнь охоте на демона Аззи'кразза, несущего [Concept('the_fog','Туман')|E]."
 nick_the_heart_eater: "Сердцеед"
