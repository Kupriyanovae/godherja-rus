 nick_butcher_of_kahdavraka_desc:0 "Презренный за организацию печально известного события ([kahdavrakan_supper|E]), [CHARACTER.GetShortUINameNoTooltipNoFormat] считается заклятым врагом всех жителей [sarradon|E]."
 nick_coldwind:0 "Холодный Ветер"
 nick_the_merry_medicus:0 "Веселый Лекарь"
 nick_the_forgotten_saint:0 "Забытый Святой"
 nick_the_forgotten_saint_desc:0 "Титул, даруемый тем, чье имя предано забвению. Самые ревностные последователи верят, что даже произнесение этого эпитета — великое оскорбление, граничащее с святотатством."
 nick_the_undying_sword_of_angels:0 "Бессмертный Меч Ангелов"
 nick_the_undying_sword_of_angels_desc:0 "Этот титул присваивается тому, кто обрушивает клинок [Concept('sarradon','Саррадона')|E] на ложных идолов, пока сам клинок направляет направляющего."
 nick_seaking:0 "Морской Царь"
 nick_seaking_desc:0 "Пиратская дурная слава, которую снискал [CHARACTER.GetShortUINameNoTooltipNoFormat], стала легендарной, а сказы о [CharYourHerHis(CHARACTER)] дерзких набегах гремят по всем морям [Concept('aeras','Эраса')|E]."
 nick_the_pale_sphinx:0 "Бледный Сфинкс"
 nick_the_pale_sphinx_desc:0 "Прозванный так за необычный цвет лица и проницательный нрав, [CHARACTER.GetShortUINameNoTooltipNoFormat] многими считается столь же опасным, как и его мифический тезка."
 nick_the_grim:0 "Мрачный"
 nick_the_grim_desc:0 "Суровый и в делах, и в речах, [CHARACTER.GetShortUINameNoTooltipNoFormat] с трудом находит радость в том, что может предложить жизнь."
 nick_the_father_of_sarradon:0 "Отец Саррадона"
 nick_the_father_of_sarradon_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] объединил большую часть [sarradon|E] под своей властью, поклявшись не знать отдыха, пока [CharYourHerHis(CHARACTER)] «семья» полностью не сбросит иго [Concept('aversaria','аверсарианцев')|E]."
