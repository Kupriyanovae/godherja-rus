 #Game Concept
 game_concept_gh_defensive_alliance:0 "Оборонительный союз"
 game_concept_gh_defensive_alliances:0 "Оборонительные союзы"
 game_concept_gh_defensive_alliance_i:0 "@defensive_alliance_icon!"
 game_concept_gh_defensive_alliance_desc: "$game_concept_gh_defensive_alliance$ — это дипломатические отношения между двумя [Concept('rulers', 'правителями')|E]. В отличие от [Concept('alliance', 'Полных союзов')|E], оборонительные союзы заключаются исключительно для взаимной защиты. $game_concept_allies$ будут вступать в [Concept('wars', 'войны')|E] друг друга только тогда, когда выступают защищающейся стороной.\n\n$game_concept_gh_defensive_alliances$ можно создавать и поддерживать с помощью [Concept('marriage', 'брака')|E] или [Concept('betrothal', 'обручения')|E], если двое вступающих в союз персонажей находятся в достаточно близком родстве с обоими правителями. Например, если [Concept('king', 'король')|E] выдаёт свою дочь за сына другого короля, оба короля становятся $game_concept_allies$.\n\nКак $game_concept_gh_defensive_alliances$, так и [Concept('alliance', 'полные союзы')|E] можно заключать и напрямую путем переговоров.\n\n[Concept('lieges', 'Сюзерены')|E] также могут создавать $game_concept_alliances$ со своими [Concept('vassals', 'вассалами')|E]. Сюзерен не может призвать вассала на войну, но это мешает им вступать в [Concept('factions', 'фракции')|E]."

 #Game Rule
 rule_gh_alliance_mechanic: "@godherja_logo! Механика союзов"
 setting_godherja_alliance_default: "По умолчанию"
 setting_godherja_alliance_default_desc: "Браки больше не дают [Concept('alliances', 'союзы')|E] напрямую, а вместо этого заключают [Concept('truce', 'перемирие')|E] между сторонами. [Concept('gh_defensive_alliances', 'Оборонительные союзы')|E] и полные [Concept('alliances', 'союзы')|E] считаются отдельными механиками и должны обсуждаться отдельно. Союзники по [Concept('gh_defensive_alliances', 'оборонительным союзам')|E] будут вступать только в оборонительные [Concept('war', 'войны')|E]."
 setting_vanilla_alliance: "#high Оригинальная (Vanilla)#!"
 setting_vanilla_alliance_desc: "Брачные пакты автоматически дают полные [Concept('alliances', 'союзы')|E], как в оригинальной игре. [Concept('gh_defensive_alliances', 'Оборонительные союзы')|E] отключены, а любых союзников можно призывать как в наступательные, так и в оборонительные [Concept('wars', 'войны')|E]."