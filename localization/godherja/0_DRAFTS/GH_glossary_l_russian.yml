 SILVAIA_GLOSS: "The Lake Demon who works to break apart unity and undermine the Iyrossi Clans."
 SELVA_GLOSS: "The Head Goddess of the Kinambrosti, Goddess of the Lake Guardian of the Kinambrosti."


