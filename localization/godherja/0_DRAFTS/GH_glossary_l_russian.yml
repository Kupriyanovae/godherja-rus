 DEIPHARTORA_GLOSS: "Дейфартора — кинамбростский бог гор, коварный обманщик, которому нельзя доверять. Он также ведёт счёт всем обидам."

 SILVAIA_GLOSS: "Сильвайя — озёрный демон, стремящийся посеять раздор и ослабить ийросские кланы."
 SELVA_GLOSS: "Селва — верховная богиня кинамбростов, богиня озера и защитница своего народа."


