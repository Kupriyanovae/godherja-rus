 GH_BANWAGUL_GLOSS: "#bold Банвагул#! на танарканском языке означает «небесные мореходы»."
 GH_SURUGIN_GLOSS: "#bold Суру'гин#! на их родном языке означает «лишённые надежды»."
 GH_TRIBOCICAI_GLOSS: "#bold Трибоцикай#! на холмволькском языке означает «три сестры»."
