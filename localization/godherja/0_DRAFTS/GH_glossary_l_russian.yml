 # HISTORIOGRAPHY #
 ##################

 # Aversarian Organizations
 GH_FIRST_IMPERIAL_COUNCIL_GLOSS: "Первый из множества имперских советов, в стихах порой именуемый «Вероломным советом», управлял Орайсполем и его окрестностями со времени разграбления города в конце [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E] в 170 году И.С. до [Concept('hexing_of_oraispol','Сглаза Орайсполя')|E] в 243 году И.С. и проведённой аавтократом $aauto_maklea_link$ Маклеей#! [Concept('maklean_terrors','чистки')|E]."
 GH_SIXTH_IMPERIAL_COUNCIL_GLOSS: "#BOL Шестой имперский совет#! был учреждён в 729 году И.С. аавтократом $aauto_eramos_link$ Эрамом#! вместо Пятого имперского совета, печально известного как Совет ревнителей и распущенного аавтократом Кетэмодом в 618 году И.С. Чтобы сплотить стремительно распадавшуюся аристократию после катастрофического начала [Concept('kartharadd','Картараддских войн')|E], Эрам через Совет добился чрезвычайных полномочий, необходимых для проведения легендарных легионных реформ под надзором [Glossary('#G_light Союза трёх#!','GH_BAND_OF_THREE_GLOSS')].\n\nПосле смерти Эрама в 756 году И.С. Союз трёх создал [Glossary('#G_light Совет героев#!','GH_COUNCIL_OF_HEROES_GLOSS')] и сформировал регентский совет, объявив своей целью восстановление израненной Империи. Шестой имперский совет оспорил его власть и попытался ограничить легионы и их растущее политическое влияние. Формально оба совета совместно правили в рамках [Glossary('#G_light Имперского концилиария#!','GH_IMPERIAL_CONCILIARY')], пока обе стороны не потерпели крах после [Glossary('#G_light неудачного Кровавого сената#!','GH_BLOOD_SENATE_OF_761_GLOSS')].\n\nСовет поддержал сравнительно неизвестную $aauto_theyssia_link$ Иану Тейссию#!, но уже в начале её правления оказался оттеснён и вскоре подчинился ей. В итоге советники единогласно, пусть и неохотно, предоставили Тейссии те же чрезвычайные полномочия, которые прежде дали аавтократу Эраму. Это решение было закреплено в Первой тейссианской правовой хартии, вошло в имперское право и навсегда положило конец политической независимости Совета. Шестой совет оставался придатком власти аавтократа Тейссии до роспуска в начале правления аавтократа Мификса в 892 году И.С."
 GH_COUNCIL_OF_HEROES_GLOSS: "#BOL Совет героев#!, также называемый Советом легионов, де-факто правил державой «[GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]» во время [legion_regency|E] и в начале периода имперского восстановления, вплоть до возвышения аавтократа $aauto_theyssia_link$ Тейссии#!. Он делил власть со всё сильнее противостоявшим ему [Glossary('#G_light Шестым имперским советом#!','GH_SIXTH_IMPERIAL_COUNCIL_GLOSS')] в рамках так называемого [Glossary('#G_light Имперского концилиария#!','GH_IMPERIAL_CONCILIARY')].\n\n[Glossary('#G_light Союз трёх#!','GH_BAND_OF_THREE_GLOSS')] создал Совет в ходе фактически законного переворота, воспользовавшись военными полномочиями, которых аавтократ $aauto_eramos_link$ Эрам#! добился ради победы в [Concept('kartharadd','Картараддских войнах')|E]. При поддержке недавно созданных и стремительно набиравших политический вес легионов Совет стремился восстановить Империю вопреки ненадёжной и вероломной аристократии, желавшей вернуть утраченные при Эраме привилегии. Однако Совет погряз в распрях и скандалах, вершиной которых стали убийства Эоны Тейссии и легона Рутара Итрикса, а также [Glossary('#G_light неудачный Кровавый сенат#!','GH_BLOOD_SENATE_OF_761_GLOSS')] 761 года И.С.\n\nСовет героев распался после бурного возвышения Иксона Явленного и его гибели от руки Ианы Тейссии. Он раскололся на несколько крупных фракций, которые Тейссия одну за другой разгромила за следующее десятилетие сложными политическими манёврами и чистками. Обе половины Имперского концилиария были распущены после того, как во время Примирения шесть из девяти оставшихся ведущих полководцев Совета героев официально склонились перед Тейссией. Это окончательно утвердило её власть над Империей и завершило краткий период политического верховенства новых легионов." # GH TODO: Link 'rise of Aautokratia Theyssia' to the Theyssian Golden Age gloss entry when it's finished
 GH_IMPERIAL_CONCILIARY: "#BOL Имперским концилиарием#! называют совместное правление [Glossary('#G_light Совета героев#!','GH_COUNCIL_OF_HEROES_GLOSS')] и [Glossary('#G_light Шестого имперского совета#!','GH_SIXTH_IMPERIAL_COUNCIL_GLOSS')] над державой «[GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]» после смерти аавтократа $aauto_eramos_link$ Эрама#! в 756 году И.С. Сначала в Концилиарии господствовали недавно созданные и одержавшие политическую победу легионы, сохранившие широкие чрезвычайные полномочия после [Concept('kartharadd','Картараддских войн')|E]. Однако возмущённая аристократия сплотилась вокруг Шестого имперского совета, после чего началась бурная борьба за власть над [Glossary('#G_light Аавтократией#!', 'GH_AAUTOKRATA_GLOSS')] во время [Glossary('#G_light Регентства легионов#!','GH_LEGION_REGENCY')]. Обе стороны пытались присвоить права и привилегии самого аавтократа, но добились лишь политического тупика и серьёзно затруднили восстановление после [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E].\n\nРаспри привели в 760 году И.С. к битве на болоте Викси, где Государственный легион LXXXI «Драконье пламя» сразился с поддерживавшим Имперский совет Наместническим легионом XXIX «Верные пакту» и двумя дворянскими легионами. По итогам Четырнадцати процессов противоборствующие советы приказали командирам обеих армий покончить с собой. Усилившийся страх гражданской войны привёл к катастрофическому [Glossary('#G_light Кровавому сенату 761 года И.С.#!','GH_BLOOD_SENATE_OF_761_GLOSS')] и открыл путь неожиданному стремительному возвышению аавтократа $aauto_theyssia_link$ Ианы Тейссии#! в 764 году И.С.\n\nЗатем Иана рядом сложных политических манёвров ограничила власть обоих советов. В конце концов Совет героев был распущен, а Шестой имперский совет подчинён престолу, что окончательно укрепило власть Тейссии и положило начало Тейссианскому золотому веку."
 GH_IMPERIAL_CHANCELLERY: "#BOL Имперская канцелярия#!, которую иногда называли регентским советом $aauto_maklea_link$ Маклеи#!, была временно учреждена после смерти Маклеи, чтобы удержать [Concept('aversaria','имперский')|E] престол до появления законного наследника. Канцелярия не смогла справиться с ростом власти военачальников, интригами этепезейского двора и спорами вокруг Ложных Маклей. Она пала в 275 году И.С. после переворота наместника Исиксона «Чёрного языка» в Этепезее и последовавшей коронации аавтократа Паксанорасоса Неготового."

 # Aversarian Historiography
 GH_POLISOCRACY_GLOSS: "#bold Полисократией#! называют эпоху господства тысяч городов-государств и столь же многочисленных форм правления на [Concept('aversaria','протоаверсарианских')|E] [Concept('shatteredisles','Островах')|E], продолжавшуюся не менее тысячелетия до возникновения державы «[GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]». Полисы и их колонии лишь изредка объединялись под властью великих завоевателей, обычно [Glossary('#G_light никарина#!','GH_NIKARIYN_GLOSS')], и большую часть своей истории оставались крайне раздробленными. Последний никарин объединил сотни полисов в рыхлую конфедерацию — [Glossary('#G_light Аавтократию#!', 'GH_AAUTOKRATA_GLOSS')], — однако споры об устройстве Империи и власти аавтократа привели к [Concept('war_of_the_thousand_dragons','Войне тысячи драконов')|E]. Победа аавтократа Эксионарака положила конец полисократии в пользу, по крайней мере в теории, единой имперской власти."
 GH_NAEXANAXICA_GLOSS: "#bold Нэксанаксика#! — [Concept('aversaria','протоаверсарианское')|E] искажение слова [Glossary('#G_light нэксоникс#!','GH_NAEXONIX_GLOSS')], которое точнее всего переводится как «Островия». Так чаще всего называли область [Concept('shatteredisles','Расколотых островов')|E] вокруг [Concept('imperial_isle','Имперского острова')|E], где веками находился центр мира [Glossary('#G_light $polis_apostrophe|q$#!','GH_POLISOCRACY_GLOSS')]. Словом «нэксанаксикский» до сих пор называют как протоаверсарианскую культуру, так и более широкую культурную семью."
 GH_NAEXONIX_GLOSS: "#bold Нэксоникс#! означает «остров» на [Concept('aversaria','протоаверсарианском')|E] нэксанаксикском языке. После среднеимперских языковых реформ III века слово приняло форму «наэксокс», а к XI веку — «нэксон»."
 GH_NIKARIYN_GLOSS: "#bold Никарин#! буквально означает «первый капитан» в древних религиозных текстах Аэрсодиакса. В [Concept('aversaria','протоаверсарианской')|E] культуре императорские титулы считались недоступными смертным, поэтому высшим светским чином был капитан стражи бога Аэрсодиакса. На протяжении тысячелетий никарины ненадолго объединяли мир [Glossary('#G_light $polis_apostrophe|q$#!','GH_POLISOCRACY_GLOSS')] путём завоевания или перед лицом кризиса, пока [Glossary('Последний никарин','GH_LAST_NIKARIYN_GLOSS')] не упразднил этот титул после Драконьей погибели."
 GH_LAST_NIKARIYN_GLOSS: "#bold Последний никарин#! — распространённое имя первого правителя державы «[GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]», [Concept('magi','мага')|E]-военачальника Дхасе'нокса Никари'ксоса. Приняв титул [Glossary('#G_light никарина#!','GH_NIKARIYN_GLOSS')] в ответ на Драконью погибель, Дхасе'нокс объединил разрозненные [Glossary('#G_light города-государства#!','GH_POLISOCRACY_GLOSS')] [Concept('aversaria','протоаверсарианцев')|E] и положил конец смуте предшествующего века. Затем он, вопреки устоявшемуся порядку, объявил свою [Glossary('#G_light Аавтократию#!', 'GH_AAUTOKRATA_GLOSS')] постоянной, упразднил титул никарина в пользу титула «аавтократ» и оставил наследие, навсегда изменившее историю [Concept('aeras','Эраса')|E]."
 GH_TERROXIAN_IMPERIAL_EDICT_MANIFESTO_GLOSS: "#bold Имперский манифест-эдикт Террокса#!, также известный как «Декларации Террокса», — манифест объёмом в тридцать тысяч слов, отпечатанный по всей [theyssian_scrivenery_network|E] после [the_vilnian_assault|E|l] и [the_oration_of_legions|E|l]. Текст считали почти непостижимым, однако Террокс приказал изготовить тысячи копий. Это уничтожило последние крупные скриптории массовой печати в [mayikrata|E] и окончательно вывело из строя остатки Сети по всей [Concept('aversaria','Империи')|E]."
 terrox_possessive: "Террокса"
 GH_THREE_EXALTED_MATRONS_GLOSS: "#bold Три возвышенные матроны#! — аавтократ $aauto_maklea_link$ Маклея#!, Элиадия и аавтократ $aauto_theyssia_link$ Тейссия#!, в совокупности правившие державой «[GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]» три столетия в III, V и VIII веках И.С. При [Glossary('#G_light полисократии#!','GH_POLISOCRACY_GLOSS')] [Concept('aversaria','протоаверсарианское')|E] общество было строго патриархальным, но стремительное и неожиданное возвышение Маклеи, последующие великие чистки и проведённая ею культурная перестройка навсегда уравняли права женщин и мужчин на имперский престол. За века возвышались и падали аавтократы обоих полов, а некоторые из них — например, Фансис, $aauto_eramos_link$ Эрам#! и Нотикс — тоже вошли в легенды. И всё же каждая из трёх матрон обрела такое влияние, что стала олицетворением целой эпохи Империи и её законов."
 GH_IMPERIAL_RESTORATION_PERIOD_GLOSS: "#BOL Период имперского восстановления#! — эпоха в истории [Concept('aversaria','имперской Аверсарии')|E] от окончания [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E] в битве у Ридувианских курганов в 756 году И.С. до [Glossary('#G_light Позднеимперского периода#!','GH_LATE_IMPERIAL_PERIOD_GLOSS')]."
  #The period was perhaps the dynamic and transformative Imperial era since the reign of $aauto_maklea_link$ Maklea#!, and is itself divided into several distinct eras.\n\nThe first was the Legion Regency. Then, the Early Theyssian Period" # GH TODO: Finish
 #GH_EARLY_THEYSSIAN_PERIOD_GLOSS: "#BOL The Early Theyssian Period#! constitutes the first several decades after"
 GH_LATE_IMPERIAL_PERIOD_GLOSS: "#BOL Позднеимперский период#! в истории [Concept('imperial','имперской')|E] [Concept('aversaria','Аверсарии')|E] обычно отсчитывают от Агионистских восстаний 1085 года И.С. Иногда его началом считают [war_of_all_islands|E] 966 года И.С. и вершину могущества Империи после золотого века. Завершился он [frodbrokna|E] и началом [Glossary('#G_light Периода имперской анархии#!','GH_IMPERIAL_ANARCHY_PERIOD_GLOSS')] в 1200 году И.С."
 GH_IMPERIAL_ANARCHY_PERIOD_GLOSS: "#BOL Период имперской анархии#! — последняя эпоха в истории [Concept('imperial','имперской')|E] [Concept('aversaria','Аверсарии')|E]. Его началом называют разные этапы [imperial_civil_war|E]; некоторые староимперские авторы даже считали, что [odrstund|E] или [turmoil_of_the_sixteen_aautokratirs|E] уже завершили [Glossary('#G_light Позднеимперский период#!','GH_LATE_IMPERIAL_PERIOD_GLOSS')]. Эта эпоха ознаменовалась полным крахом имперского права и культуры. По общему мнению, она окончилась вместе с самой [Glossary('#G_light Аавтократией#!', 'GH_AAUTOKRATA_GLOSS')] во время [Concept('sjalvolki_migration','Великого переселения сьялволков')|E]; чаще всего конечной датой называют падение Орайсполя в 1255 году И.С."
 # GH_THIRD_IMPERIAL_GOLDEN_AGE_GLOSS: "The #bold Third Imperial Golden Age#!, or the #bold Theyssian Golden Age#!, refers to Aautokratia Theyssia's rule after the [chaos_of_the_seventh_century|E] and her defeat of the Imperial Conciliary between 768 IS and her death in 892 IS. Theyssia"
 THIRTY_GOLDEN_SUMMERS_GLOSS: "#BOL Тридцать золотых лет#! — золотой век Калатипсоми с 563 по 593 год И.С., отмеченный тремя десятилетиями небывалого мира, умелого управления, рекордных урожаев, мягких зим и затишья во вражде с феями."
 GH_EIGHT_GREAT_MARTYRDOMS_GLOSS: "#BOL Восемь великих мученичеств#! — аверсарианское название нескольких десятков из сотен чисток, проведённых во время [maklean_terrors|E]. Каждое «мученичество» обозначает отдельный этап террора и обычно связывается с преследованием определённой группы. Однако из-за стремительности и размаха террора на каждом этапе гибли или подвергались преследованиям жители огромных областей Империи. В число мученичеств, как правило, включают лишь чистки, направленные против слоёв имперского общества. Многочисленные расправы над рабами, «варварами» и народами, не пережившими террор, по отдельности почти исчезли из оставленных выжившими хроник, сосредоточенных на судьбе Империи.\n\nПервое мученичество было направлено против уцелевших аэрсодиаксских политических движений, переживших [Concept('war_of_the_thousand_dragons','Войну тысячи драконов')|E], и большинства прочих групп, сражавшихся в той войне против имперской фракции. Последующие чистки обрушились на полисную знать; зависимые державы, варварские народы и культуры рабов; монашеские ордены Горного солнца в Опахасии; жречество Имперского культа и сотни других аверсарианских вер; имперскую армию и братства драконьих всадников; затем вновь на ордены Горного солнца; и, наконец, на большую часть имперского чиновничества и сословия магов. Большинство последних были сторонниками Маклеи, которых она сама возвысила за годы своего правления."
 maklea_possessive: "Маклеи"

 # Aversarian Events
 GH_BLOOD_SENATE_OF_761_GLOSS: "#BOL Кровавый сенат 761 года И.С.#! был одним из самых спорных Кровавых сенатов вплоть до [Glossary('#G_light Позднеимперского периода#!','GH_LATE_IMPERIAL_PERIOD_GLOSS')]. После многолетних проволочек [Glossary('#G_light Имперского концилиария#!','GH_IMPERIAL_CONCILIARY')] и обострявшихся распрей, завершившихся битвой на болоте Викси и Четырнадцатью процессами, страх гражданской войны привёл к созыву Кровавого сената, призванного завершить регентство, оставшееся после смерти $aauto_eramos_link$ Эрама#!. Сенат 761 года И.С. сопровождался спорами, интригами и множеством судебных тяжб о порядке его проведения.\n\nПосле нескольких десятков первых поединков главными кандидатами [Glossary('#G_light Шестого имперского совета#!','GH_SIXTH_IMPERIAL_COUNCIL_GLOSS')] и [Glossary('#G_light Совета легионов#!','GH_COUNCIL_OF_HEROES_GLOSS')] стали соответственно [Concept('magi','маг')|E] Эона $aauto_theyssia_link$ Тейссия#! и легон Рутар Итрикс. Однако их и ещё шестерых из последних двадцати претендентов убили.\n\nПосле этого Кровавый сенат распался, хотя победу одержал Иксон Явленный, которого не пустили в Орайсполь на коронацию. Иана Тейссия, сестра Эоны, обвинила Иксона в убийстве сестры и вызвала его на поединок. Она сразила Иксона в конце легендарной пятичасовой дуэли — этот момент обычно считают началом раннего тейссианского периода. Хотя Имперский концилиарий предложил Иане корону, она настояла на втором Кровавом сенате с составленным ею новым уставом, который стал основой всех последующих сенатов. На Кровавом сенате 764 года И.С. Иана без труда победила оставшихся претендентов и взошла на престол как аавтократ."
 WAR_OF_THE_BLACK_YEW_GLOSS: "#BOL Война Чёрного тиса#! — огромный конфликт, охвативший Предел во время [chaos_of_the_seventh_century|E] и ставший итогом десятилетий борьбы между силами леса и их слугами, с одной стороны, и державами Этранданекси и [aversaria|E] — с другой. Война началась с возвращения [Glossary('#G_light Карттуэн Серебряноволосой#!', 'dailennir_kathanouxiac_18_desc')], стремившейся провести ритуал И-Амантиль. Он должен был слить воедино обыденный мир и мир [aspect_dream], а заодно исполнить шестисотлетнее пророчество о том, что Карттуэн будет править давно погибшей империей Катанукса.\n\nВ итоге Карттуэн разгромила огромная коалиция местных Этранданекси, аверсарианцев, кланландцев и даже мятежных фей. Война завершилась Перемирием очага и леса, окончательно разделившим владения древних сил и людей, положившим конец пятидесяти годам кровопролития и навсегда прекратившим крупные войны между сторонами."

 # Aversarian Culture
 GH_BLOODWINE_GLOSS: "#bold Кровавое вино#! — ценный имперский напиток, популярный в [aversaria|E], прежде всего у знати и [Concept('imperial_magi_class','сословий магов')|E]. На деле это оливковая или фруктовая водка, отличительный признак которой — капля крови в бокале или бутылке. На пирах её ритуально подавали с хлебом в знак доверия между [Concept('magi','магами')|E], связанными с [aspect_blood]. К Третьему имперскому золотому веку маги распространили напиток среди других слоёв общества и стали часто добавлять в него магические ингредиенты, пряности и кровь специально выращенных существ либо кровь, алхимически обработанную ради вкуса и цвета."
 GH_AVERSARIAN_SEERESS_GLOSS: "#bold Прорицательницы#! были главными практиками [magic|E] в [Concept('aversaria','протоаверсарианском')|E] обществе и часто занимали ведущие места в религии и политике. В преимущественно патриархальном мире [Glossary('#G_light $polis_apostrophe|q$#!','GH_POLISOCRACY_GLOSS')] светская власть считалась уделом мужчин-аристократов, а магическая принадлежала женщинам. Прорицательницы объединялись в жреческие ордены во главе с матроной, которая пожизненно обучала послушниц и готовила их к важным обрядам прорицания и службе советницами правителей. Мальчиков, воспитанных как магов, считали женщинами — по крайней мере, до возникновения державы «[GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]», когда исчезновение [dragons|E] привело к появлению [Concept('imperial_magi_class','имперского сословия магов')|E].\n\nПреобразование и профессионализация магов при [Glossary('#G_light Аавтократии#!', 'GH_AAUTOKRATA_GLOSS')], а также превращение магии в признак аристократии сильно уменьшили роль прорицательниц. Чистки аавтократа $aauto_maklea_link$ Маклеи#! уничтожили большинство крупных уцелевших орденов или силой подчинили их Империи. Несмотря на это, прорицательницы сохранили почётное место в аверсарианской религии и культуре: [Concept('aehan_massacre','Эха')|E], Валатикса и пророк Санкси обладали огромным влиянием при имперском дворе."
   polis_apostrophe: "полисов"
 GH_DRAKARNAXAUXILA_GLOSS: "Название #bold Дракарнаксауксилы#! буквально означает «драконьи вспомогательные войска» на [Concept('aversaria','среднеимперском')|E] языке. Дракарнаксауксилы происходили от братств драконьих всадников эпохи [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E] и [Glossary('#G_light полисократии#!','GH_POLISOCRACY_GLOSS')]. После того как в 171 году И.С. аавтократ Эксионарак истребил [dragons|E], братства лишились своих зверей, но оставались крупнейшей силой имперской армии до [marcher_aversarian_wars|E]. Они действовали как объединение независимых армий под имперским знаменем, а созданная по их образцу военная система сохранялась до провала имперской армии в начале [Concept('kartharadd','Картараддских войн')|E]. Наследие дракарнаксауксил окончательно ушло в прошлое после легендарных легионных реформ аавтократа $aauto_eramos_link$ Эрама#! в 726 году И.С., когда имперскую армию сменили аверсарианские легионы, созданные по образцу профессиональных войск картараддских противников."
 GH_AERAIMATAXGORRAX_GLOSS: "#bold Аэр'айматаксго'рракс#! примерно переводится с языка этапексейнских кайротов как «божественный кровавый пир». Это был восьмидневный праздник массовых жертвоприношений, людоедства и разврата, завершавшийся Ночью пустот, когда аристократы городов Аэр'айматаксго'рракса обходили дома один за другим. После череды крупных восстаний в IV веке до И.С. обычай стал преимущественно обрядовым, а незадолго до запрета кайротского языка в 255 году И.С. держава «[GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]» официально запретила и сам праздник."
 GH_NIGHT_OF_THE_VOIDS: "#bold Ночь пустот#! завершала древний кайротский праздник [Glossary('Аэр’айматаксго’рракс','GH_AERAIMATAXGORRAX_GLOSS')]. Самые большие торжества проходили в Кайротапоне, современной Агринамее, а меньшие устраивали в большинстве кайротских [Glossary('полисов','GH_POLISOCRACY_GLOSS')]. Кайротская знать бралась за оружие, облачалась в чёрные одежды и ходила от дома к дому, обвиняя подданных в преступлениях и обидах за минувший год и назначая наказания за реальные или вымышленные проступки. Прежде всего праздник служил для устрашения огромного числа рабов в кайротском обществе, но также позволял аристократам вымогать деньги, издеваться над людьми и нападать на них. Семья могла избежать худшего, заплатив господину десятину или отправив сына участвовать в бесчинствах. После этого устраивали великий пир и «милосердно» отпускали нескольких рабов."

