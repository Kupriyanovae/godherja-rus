l_russian:
 GH_AAUTOSAXIAS_GLOSS: "Название легиона XIII #bold «Автокраксия»#! означает «Тень империи». Этот узкоспециализированный легион тайными средствами вершил правосудие аавтократа."
 GH_BAND_OF_THREE_GLOSS: "#bold Союз трёх#! составляли три высших сановника, руководившие военным трибуналом аавтократа $aauto_eramos_link$ Эрама#!."
 GH_BOTAI_GLOSS: "#bold Бётай#! — воинские братства кикарсагов, чьи функции различаются от племени к племени и от культуры к культуре."
 GH_CAEMANSI_GLOSS: "#bold Сиеманси#! означает «кровавые псы» — так их прозвали за кровавый след, остававшийся после частых набегов."
 GH_CHAN_KYAWKORLACU_GLOSS: "#bold Чан Кьявкорлаку#!, то есть «хребет Корлаку», — наттананское название гор на северо-западе Кхарадана."
 GH_DAARAPUTALNI_GLOSS: "#bold Даарапутальни#! — синдаарское искусство кукольного представления. Особых кукол, или «таални», изготавливают к свадьбам, коронациям и обрядам освящения новорождённых, чтобы позднее разыгрывать эти события."
 GH_DIBRABAL_GLOSS: "#bold Дибрабал#! — густой рыбный соус из разных морепродуктов и масла каменных оливок, редкого вида с Диоренийских островов. Даже повара далёкой Каширии ценят его необычный вкус, который меняется по мере выдержки и позволяет использовать соус во множестве блюд, способных удовлетворить самого взыскательного гурмана."
 GH_DOYNATEKA_SARYATTI_GLOSS: "#bold Дойнатека Сариатти#!, или «гонка двух холмов», — состязание, в котором слонов пускают наперегонки вниз по склонам с изображениями бога Сарвата на спинах."
 GH_JAHAAJI_DAUD_GLOSS: "#bold Джахаджи Д'Ауд#!, особенно популярная у сариштов, — гонка по Стеклянному морю от мыса Селенгая до Инковтары, завершающаяся великим пиром в честь победителей."
 GH_KARTEIMAN_GLOSS: "#bold Картейман#! — лёгкие суда, на которых агуадосцы пересекают океаны."
 GH_MURARUT_GLOSS: "#bold Мур'ар'ут#! означает «высокие» на их собственном наречии."
 GH_OATHBOUND_REVOLT_GLOSS: "#bold Восстание верных клятве#! — неудачный переворот против аавтократа $aauto_theyssia_link$ Тейссии#!, устроенный недовольными легонами и чиновниками, прежде служившими аавтократу $aauto_eramos_link$ Эраму#!."
 GH_SIEGA_VORTELSK_GLOSS: "#bold Сиега Вортельск#!, или «военачальник-слуга», — высший чин в картараддской армии."
 GH_TYANAN_RUDU_GLOSS: "#bold Тианан Руду#! — большое собрание капитанов дераани, на котором долгие ночи проходят за пирами и поединками."
 GH_TALZA_GLOSS: "#font:RedactedScriptFont #bold Талза#! — архаичное лекийское слово со значением «слава» и неясной этимологией. Крылья украли у неё это слово.#!"
 GH_KUZUM_GLOSS: "#bold Кузум#! — популярный у кикарсагов алкогольный напиток из перебродившего кобыльего молока."
 GH_CZUMIJ_GLOSS: "#bold Чумий#! — популярный у сарминов алкогольный напиток из перебродившего кобыльего молока и ягод."
 GH_AIRAGAANG_GLOSS: "#bold Айрагаанг#! — популярный у хохуудских народов алкогольный напиток из перебродившего кобыльего молока."
 GH_AIRAGAG_GLOSS: "#bold Айрагаг#! — популярный у вханавидских народов алкогольный напиток из смеси перебродившего кобыльего молока и кукурузного спиртного."
 GH_EIREG_GLOSS: "#bold Эйрег#! — чрезвычайно популярный у махратов алкогольный напиток из перебродившего кобыльего или, реже, козьего молока."
 GH_TSEGUN_GLOSS: "#bold Цегун#! — популярный у ксаджиркелов крепкий алкогольный напиток из кобыльего молока длительного брожения."
 GH_IRRADU_GLOSS: "#bold Ирраду#! — козлоголовый бог-покровитель Ялирии и одно из главных божеств [Concept('astilik_gods','пантеона')|E] веры «[GetFaithByKey('astiliak').GetName]»."
 GH_BRONZE_SOVEREIGN_GLOSS: "#bold Бронзовый владыка#! — божество неясного происхождения и бог-покровитель Казвоска. Считается, что он пришёл туда откуда-то с севера Айроноя."
 GH_ARUVA_AGAT_GLOSS: "#bold Арува Агат#! переводится как «божественная душа» и в религии арувасуэ обычно связывается с человеческим духом."
 GH_ARUVA_TSERE_GLOSS: "#bold Арува Цере#! означает «божественное сердце» и у арувасуэни отождествляется с Солнцем."
 GH_ARUVA_NILUD_GLOSS: "#bold Арува Нилуд#! переводится как «божественный разум»; в религиозной философии арувасуэни это понятие тесно связано с [Concept('aervalr','Эрвалом')|E]."
 GH_ASTIL_ELATOS_GLOSS: "#bold Астиль Элатос#! — распространённое астилакское выражение, буквально означающее «к вечной славе». Его используют, чтобы выразить радость или благодарность, а также при прощании."
 GH_NASHANAR_GLOSS: "#bold Нашанар#!, Вольная муза, — фольклорная божественная сущность юго-востока Айроноя, связанная со стойкостью и искусством. У народов побережья Стеклянного моря она известна под многими именами; на архаическом сунакарском её имя точнее всего переводится как «дарующая дыхание»."
 GH_NUGATORS_GLOSS: "#bold Нагаторы#! — полумифическое поколение правителей раннего [Concept('aironoian_bronze_age','айронойского бронзового века')|E]. По преданиям, они вышли из морской пены на берегах Моря империй."
 GH_AAIMPERON_GLOSS: "#bold Ааймперон#! — крупная полосатая ягода со сладкой кроваво-красной мякотью, которую [Concept('aversaria','аверсарианцы')|E] широко выращивают в [Concept('western_aironoi_biozone','Западном Айроное')|E]. Около 400 года И.С. ягоду завезли из [Concept('sarradon','Саррадона')|E]; с тех пор длительная магическая селекция сделала её крупнее, слаще и избавила от семян."
 GH_DAAJ_OLIKNII_GLOSS: "#bold $feast_type_tsagaan_sar$#! — традиционный ольтенский праздник в честь воссоединения двух сыновей Ольгон-тена. С раннего верхнекольргийского его название переводится как «день [Glossary('Олика','GH_OLIK_GLOSS')]»."
 GH_TAROK_MAHAN_AYRAAL_AM_AYAR_GLOSS: "#bold Тарок Махан Айраал ам'Аяр#! на языке «[GetCulturePillar('language_emanhi').GetName]» означает «великий двор [Concept('paiza','айраалов')|E] Аяра». Этот язык был одним из нескольких главных языков управления [Concept('otachedian_empire','Отачедской империи')|E]."
 GH_SJARVA_ERAM_AKKARA_GLOSS: "#bold Сьярва Эрам Аккара#! на языке «[GetCulturePillar('language_emanhi').GetName]» означает «зал высших небес». Этот язык был одним из нескольких главных языков управления [Concept('otachedian_empire','Отачедской империи')|E]."
 GH_HAYTRATAROK_MAHAN_AYRAAL_GLOSS: "#bold Хайтратарок Махан Айраал#! на языке «[GetCulturePillar('language_emanhi').GetName]» означает «великий имперский двор [Concept('paiza','айраалов')|E]». Этот язык был одним из нескольких главных языков управления [Concept('otachedian_empire','Отачедской империи')|E]."
 GH_YANTRA_JVALAKAACH_GLOSS: "#bold Янтра Джвалакаач#! на языке «[GetCulturePillar('language_emanhi').GetName]» означает «обсидиановая машина». Этот язык был одним из нескольких главных языков управления [Concept('otachedian_empire','Отачедской империи')|E]."
 GH_RISHIRAN_GLOSS: "#bold Риширан#! на языке «[GetCulturePillar('language_emanhi').GetName]» означает «управитель». Этот язык был одним из нескольких главных языков управления [Concept('otachedian_empire','Отачедской империи')|E]."

 GH_ORZOPAJA_GLOSS: "#bold Орзопая#! (мн. #bold орзопаяд#!) — член исключительно женского воинско-аристократического сословия народа [GetCulturePillar('heritage_sarminian').GetName], которое считается обособленным как от мужчин, так и от женщин. Орзопаяд заплетают волосы в длинные сложные косы; их предельная длина зависит от старшинства, престижа и положения среди равных."
 GH_ZSERHENI_GLOSS: "#bold Жерхени#!, то есть «иноземный союзник», — чужеземец, которого [Glossary('#G_light орзопаяд#!','GH_ORZOPAJA_GLOSS')] в определённой мере признали своим."
 GH_SARMINIAN_CARDINAL_COLORS: "В культуре народа [GetCulturePillar('heritage_sarminian').GetName] стороны света связывают с определёнными цветами и качествами. Эти образы часто используют в речи, чтобы придать словам и выражениям дополнительный смысл.\n\n$EFFECT_LIST_BULLET$#bold Синий север#! связан со славой, весной и божественным началом\n$EFFECT_LIST_BULLET$#bold Красный запад#! связан с летом, завоеванием и пролитой кровью\n$EFFECT_LIST_BULLET$#bold Жёлтый восток#! символизирует осень и решимость\n$EFFECT_LIST_BULLET$#bold Чёрный юг#! считается хуже остальных — трусливым, слабым и зимним"
 GH_ESENGRA_GLOSS: "Эсенгра — народный герой, особенно популярный в низинах Центрального Саррадона и выступающий главным персонажем поразительного множества сказок. Самые известные повествуют о том, как он хитростью, смекалкой и несколькими потрясающе жестокими поступками сверг одноглазых королей-великанов полуострова Халкама. Кости убитых тиранов он посадил в землю, и из них выросли гигантские кедры Саррадона."
 ##############
 # CHARACTERS #
 ##############

 # Non-Human
 OLD_CUBOZOID_GLOSS: "Загадочное невидимое существо, возможно существующее лишь в легендах, которое, по слухам, обитает в лесах Калатипсоми. Название пришло из кланландского языка, где его зовут «квадратным старцем»; причина такого имени давно забыта."
 WILDERKING_GLOSS: "Невероятно могущественный оборотень и друид, обитавший в лесах Калатипсоми, пока в 616 году И.С. его не сразил искатель приключений сэр Рене Усатый."
 FAIRYQUEEN_GLOSS: "Древний могущественный дух, которого за несколько веков до падения своей империи король-волшебник Катанукс заточил в магическое устройство. После смерти первого владельца темница много раз переходила из рук в руки, а её узник на протяжении веков время от времени давал советы очередному обладателю. В конце концов дух был уничтожен, когда аавтократ Мификс неудачно попытался присвоить его силу."
 GH_AAIMPERONUS_GLOSS: "#bold Ааймперонус#! — малое божество в пантеоне [Concept('aelfir','Первых людей')|E] [Concept('aversaria','Аверсарии')|E], связанное с [Glossary('#G_light ааймперонами#!','GH_AAIMPERON_GLOSS')], достижениями и тщеславием. По традиции его считают слугой Хацнура или Поллидидеса."
 GH_KAIGAN_GLOSS: "#bold Кайган#! — второй сын Ольгон-тена и Йеру-Май, которого ольтены почитают как прародителя всего человечества. После гибели [Glossary('#G_light Олика#!','GH_OLIK_GLOSS')] от руки их матери он, по преданию, покинул родительский дом и надел маску, чтобы навсегда избежать той же участи."
 GH_OLIK_GLOSS: "#bold Олик#! — первенец Ольгон-тена и Йеру-Май, убитый матерью в приступе ревности. Брат [Glossary('#G_light Кайгана#!','GH_KAIGAN_GLOSS')], он, по преданию, раз в год восстаёт из мёртвых на один день в канун [Glossary('#G_light $feast_type_tsagaan_sar|q$#!','GH_DAAJ_OLIKNII_GLOSS')]."

 # Historical Rulers & Dynasties: Mikros Kalathipsomi
 TYRANDAX_GLOSS: "Также известный как «драконий король», #BOL Тирандакс#! был [Concept('aversaria','аверсарианским')|E] драконом, избежавшим гибели во время [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E]. Более десяти лет он деспотично правил посткатануксским королевством Фейгифт, пока его не сразили."
 AEDEAN_GLOSS: "Печально известный колдун, действовавший в посткатануксском королевстве Фейгифт и служивший советником злого дракона [Glossary('#G_light Тирандакса#!', 'TYRANDAX_GLOSS')]."
 CLOTHAR_I_GLOSS: "#BOL Хлотарь I «Пагуба драконов»#! был шевигадским полководцем, ставшим королём. Он сразил дракона [Glossary('#G_light Тирандакса#!', 'TYRANDAX_GLOSS')] и положил начало эпохе правления Этранданекси в долине Фейгифт."
 ALORIC_THE_HAUGHTY_GLOSS: "#BOL Алорик Заносчивый#! был последним правителем Этранданекси, именовавшим себя королём Фейгифта; он правил накануне [Concept('aversaria','аверсарианского')|E] завоевания в IV веке. Властолюбивый человек, он запомнился главным образом стремлением стать верховным королём Предела — затеей, которой помешал Маркомер. Тяжело оскорблённый этим, Алорик отказался участвовать в военной кампании Маркомера и попытался противостоять аверсарианцам в одиночку, что привело его к катастрофическому и в конечном счёте роковому поражению."
 HANOUET_AND_HANOUIN_GLOSS: "#BOL Ануэ#! и #BOL Ануэн#! — легендарные братья, вместе отнявшие восточную часть Сердцелесья у распадавшегося королевства Аловура Волчонка. Одолев последних врагов, они рассорились из-за добычи и начали воевать друг с другом, разделив новое королевство надвое по реке Патос. Множество сказаний повествует об их безуспешных попытках победить друг друга в следующие два десятилетия. В конце концов обоих братьев обманул племянник Пейтон Скользкий, завладевший их коронами."
 RED_RICOMER_GLOSS: "#BOL Красный Рикомер#! — загадочная фигура, возможно скорее титул, чем один конкретный человек, которая, по слухам, оберегает рощи [GetBuilding('01_nira_yew').GetName]. Согласно легенде, прежде он был шевигадским разбойником и срубил одно из священных деревьев, совершив тяжкое святотатство. Охваченный виной, он поклялся защищать осквернённое место, а затем вырвал себе язык. На протяжении веков Рикомер карал всякого, кто не чтил обычаи тиса Нира, независимо от положения. Никто не мог сравниться с ним в стрельбе из лука, и мало кому удавалось долго избегать его гнева.\n\nВо время [Glossary('#G_light Войны Чёрного тиса#!', 'WAR_OF_THE_BLACK_YEW_GLOSS')] он служил одним из военачальников [Glossary('#G_light Карттуэн Серебряноволосой#!', 'dailennir_kathanouxiac_18_desc')], особенно прославившись походом, завершившимся разрушением левого берега Одбрю. Хотя фей в итоге победили, сам Красный Рикомер уцелел и, как говорят, по сей день время от времени появляется в землях, которые поклялся защищать."


 #############
 # LOCATIONS #
 #############

 FIDHASIL_TREE_GLOSS: "Гигантский древний бук, служивший местом прорицаний в [GetTitleByKey('k_heartwood').GetBaseNameNoTier]. В VII веке был уничтожен по приказу [Concept('aversaria','аверсарианского')|E] наместника Калатипсоми."
 GH_MLIMA_TAA_GLOSS: "На языке «[GetCulturePillar('language_kevaali').GetName]» название #italic Млима'Таа#! буквально означает «горный фонарь». Это древний вулкан, известный трещинами и жилами светящегося камня на склонах."
 GH_SEIBANTAI_GLOSS: "На катунском языке название буквально означает «белый зал»."
 USEHHAR_MOUNTAINS_GLOSS: "Усеххарские горы — огромная цепь острых и негостеприимных гор на востоке [Glossary('#G_light Саррадонской пустыни#!','sarradonian_desert_encyclopedia_desc')]. Людей здесь прижилось мало: в сердце Усеххара господствуют могучие вулканы, тарсосы и зазубренные пики. Вся вода течёт глубоко под землёй по обширной сети рек, питающих [Glossary('#G_light Кратемезин#!','crater_encyclopedia_desc')] на востоке и [Glossary('Костяной погост','boneyard_encyclopedia_desc')] дальше на севере."
 GH_THE_MAGISTERIUM_GLOSS: "Магистериум — плотный комплекс древних руин в разросшемся Орайсполе. Его здания тянутся вдоль длинного гребня на юге города. Аавтократ $aauto_maklea_link$ Маклея#! возвела комплекс на вершине исполинского шпиля из ещё более древних руин, изначально как место проведения [thyaeasrixtorax|E]. Позднее, при Патосе, он стал главным местом собраний [Concept('aversaria','имперских')|E] [Concept('magi','магов')|E] и оставался им до основания [mayikrata|E]. К золотому веку [aversaria|EE] Магистериум разросся в огромный комплекс академий, библиотек и кварталов высших каст; его улицы охраняла собственная армия боевых [Concept('magi','магов')|E]. Аавтократ $aauto_theyssia_link$ Тейссия#! перестроила значительную часть [Concept('prehistory','непостижимо древних')|E] руин под комплексом в соответствии с распространёнными имперскими представлениями о [first_empire|E]. Магистериум считался магической столицей Этепезеи, пока не был уничтожен после [the_vilnian_assault|E|l]."
 MAHARATNA_MAHAL_GLOSS: "В Каширии обычно называется Драгоценным дворцом или Дворцом драгоценностей."
 SANAGIRIA_GLOSS: "У хусаяхан известна как «Гахарин»."

 OLD_NORTH_GLOSS: "Старый Север — разговорное название земель на крайнем севере [Concept('foglands','Туманных земель')|E], давно поглощённых Туманом. Оттуда происходили многие участники [Concept('sjalvolki_migration','Великого переселения сьялволков')|E]."
 GH_CHRYSEMVIXA_GLOSS: "#bold Хрисемвикса#! — название горной цепи, возвышающейся над великими пшеничными полями [Glossary('Западного Айроноя','western_aironoi_encyclopedia_desc')] и отделяющей этот край от остального Айроноя на востоке. На восточных наречиях [Concept('aversaria','аверсарианского')|E] языка оно означает «золотой гребень»."
 GH_PHALONOX_GLOSS: "#bold Фалонокс#! — прежнее [Concept('aversaria','аверсарианское')|E] название реки [Glossary('Эрамасик','GH_ERAMASIC_RIVER_GLOSS')]. Оно происходит от слова [Glossary('Фалокс','GH_PHALOX_GLOSS')]: река занимает центральное положение на [the_continent|E], а горные утёсы вокруг её устья веками защищали Империю от вторжений из глубин континента."
 GH_PHALOX_GLOSS: "#bold Фалокс#! — [Concept('aversaria','протоаверсарианское')|E] слово, буквально означающее ступицу колеса. Так стали называть и традиционный круглый имперский щит, и главное воинское построение «ступица и спицы», применявшееся древней имперской армией и [Glossary('дракарнаксауксилами','GH_DRAKARNAXAUXILA_GLOSS')] — предшественниками позднейших имперских легионов."
 GH_ERAMASIC_RIVER_GLOSS: "#bold Река Эрамасик#!, изначально называвшаяся [Glossary('Фалоноксом','GH_PHALONOX_GLOSS')], делит историческую область [Concept('foglands','Катраддию')|E] надвое. Её принято считать самой длинной рекой мира, особенно если учитывать тысячи притоков. В 765 году И.С. аавтократ $aauto_theyssia_link$ Тейссия#! переименовала Фалонокс в честь своего предшественника, аавтократа $aauto_eramos_link$ Эрама#!, которого постоянно называла своим прошлым воплощением."
 GH_PHALONOXONPOLI_GLOSS: "Малькойская колония #bold Фалоноксонполь#! получила имя от первоначального названия Эрамасика — [Glossary('Фалонокса','GH_PHALONOX_GLOSS')]. Основанный в 518 году И.С. как первое малькойское поселение в будущей Катраддии, город был разрушен [Concept('kartharadd','картараддцами')|E] в 645 году, в 698 году заселён ими заново как крепость, а в 746 году сожжён и вновь заселён аверсарианцами. Он становился одной из многочисленных исторических столиц наместничества в 967, 1001 и 1143 годах. После семнадцати разграблений и завоеваний пришлыми народами с 1198 по 1246 год город почти опустел, а к 1255 году его руины поглотил [Concept('the_fog','Туман')|E]."

