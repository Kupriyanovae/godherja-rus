 GH_OS_TANDRAKH_GLOSS: "#bold Ос Тандрах#! переводится с богослужебного языка арувасуэни как «последний путь»."
 GH_YAKNHA_GLOSS: "#bold Якнха#! на ликархикском языке означает «защитник»."
 GH_URANLASH_GLOSS: "#bold Уранлаш#! можно приблизительно перевести с богослужебного языка леки как «под землёй»."
 GH_DAMALMA_GLOSS: "#bold Дамальма#! обычно переводится с языка леки как «странники [Concept('aeras','Эраса')|E]»."
 GH_RAN_KEMSARI_GLOSS: "#bold Ран Кемсари#! на языке кемсаров означает «кемсары срединных земель»."
