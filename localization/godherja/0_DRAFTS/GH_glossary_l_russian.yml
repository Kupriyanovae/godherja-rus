l_russian:
 GH_AAUTOSAXIAS_GLOSS: "Означает «Тень Империи», Легион XIII #bold «Автосаксии»#! был высокоспециализированным легионом, призванным вершить правосудие Автократа скрытыми методами."
 GH_BAND_OF_THREE_GLOSS: "#bold Банда Трех#! — три главных чиновника, управлявших военным трибуналом Аавтократа $aauto_eramos_link$ Эрамоса."
 GH_BOTAI_GLOSS: "#bold Бётай#! — военные ложи кикарсаги, чьи функции варьируются в зависимости от племени или культуры."
 GH_CAEMANSI_GLOSS: "#bold Сиеманси#! означает «Кровавые Псы», имя, полученное из-за кровавых следов, оставляемых после их частых набегов."
 GH_CHAN_KYAWKORLACU_GLOSS: "#bold Чан Кьявкорлаку#!, означающее «Хребет Корлаку», — наттананский термин для северо-западных Хараднских гор."
 GH_DAARAPUTALNI_GLOSS: "#bold Даарапутальни#! — искусство синдаарской кукольной игры, где изготавливаются специальные куклы или «Таални» для таких событий, как свадьбы, коронации и освященные рождения, где они используются для воссоздания этих событий в будущем."
 GH_DIBRABAL_GLOSS: "#bold Дибрабал#! — богатый рыбный соус, использующий разнообразные морепродукты и масло из каменных олив, редкого вида, эндемичного для Диоренийских островов. Повара даже в Каширии хвалят его уникальный вкус, который развивается с возрастом, позволяя использовать его для самых изысканных блюд."
 GH_DOYNATEKA_SARYATTI_GLOSS: "#bold Дойнатека Сариятти#! или «Гонка Двух Холмов» — событие, где слоны гоняют с холмов с иконами бога Сарвата на их спинах."
 GH_JAHAAJI_DAUD_GLOSS: "Практикуемая в основном сариштами, #bold Джахаджи Д'Ауд#! — это гонка через Стеклянное море от мыса Селенгай до Инковтары, заканчивающаяся большим пиром в честь победителей."
 GH_KARTEIMAN_GLOSS: "#bold Картейман#! — легкие корабли, используемые агуадосианцами для пересечения океанов."
 GH_MURARUT_GLOSS: "#bold Мур'ар'уты#! означает «Высокие» на их собственном диалекте."
 GH_OATHBOUND_REVOLT_GLOSS: "#bold Бунт Связанных клятвой#! — неудачный переворот против Аавтократа $aauto_theyssia_link$ Тессии#!, устроенный недовольными легонами и чиновниками, служившими под началом Аавтократа $aauto_eramos_link$ Эрамоса."
 GH_SIEGA_VORTELSK_GLOSS: "#bold Сига Вортельск#!, или «Слуга-Воитель», — высший ранг в картараддийской армии."
 GH_TYANAN_RUDU_GLOSS: "#bold Тианан Руду#! — большое собрание капитанов дераани, где пиршества и дуэли доминируют в долгих ночах."
 GH_TALZA_GLOSS: "#font:RedactedScriptFont #bold Талза#! — архаичное лекийсийком слово для «славы» без четкого лексического происхождения. Крылья украли его у нее.#!"
 GH_KUZUM_GLOSS: "#bold Кузум#! — вид алкогольного напитка из ферментированного кобыльего молока, популярного среди кикарсаги."
 GH_CZUMIJ_GLOSS: "#bold Чумий#! — вид алкогольного напитка из ферментированного кобыльего молока и ягод, популярного среди сарминов."
 GH_AIRAGAANG_GLOSS: "#bold Айрагаанг#! — вид алкогольного напитка из ферментированного кобыльего молока, популярного среди хохуудских народов."
 GH_AIRAGAG_GLOSS: "#bold Айрагаг#! — вид алкогольного напитка из смеси ферментированного кобыльего молока и кукурузного ликера, популярного среди вханавидских народов."
 GH_EIREG_GLOSS: "#bold Эйрег#! — вид алкогольного напитка из ферментированного кобыльего или, реже, козьего молока, чрезвычайно популярного среди махратов."
 GH_TSEGUN_GLOSS: "#bold Цегун#! — вид крепкого алкогольного напитка из глубоко ферментированного кобыльего молока, популярного среди ксаджиркелов."
 GH_IRRADU_GLOSS: "#bold Ирраду#! — покровитель Ялирии с головой козерога и один из главных божеств [GetFaithByKey('astiliak').GetName]ского [Concept('astilik_gods','пантеона')|E]."
 GH_BRONZE_SOVEREIGN_GLOSS: "#bold Бронзовый Владыка#! — божественная фигура неопределенного происхождения и покровитель Казвоска, который, как говорят, прибыл туда из Северного Айроноя."
 GH_ARUVA_AGAT_GLOSS: "#bold Арува Агат#! переводится как «Божественная Душа» и обычно ассоциируется с человеческим духом в религии Арувасуэ."
 GH_ARUVA_TSERE_GLOSS: "#bold Арува Цере#! означает «Божественное Сердце» и связано с Солнцем для арувасуэни."
 GH_ARUVA_NILUD_GLOSS: "#bold Арува Нилуд#! переводится как «Божественный Разум» и тесно связан с [Concept('aervalr','Аэрвалром')|E] в религиозной философии арувасуэни."
 GH_ASTIL_ELATOS_GLOSS: "#bold Астиль Элатос#! — распространенное астиликийскон выражение, буквально означающее «(к) славе вечной», и часто используемое для выражения счастья, благодарности или как прощальные слова."
 GH_NASHANAR_GLOSS: "Освобожденная Муза #bold Нашанар#! — фольклорная и божественная фигура Юго-Восточного Айроноя, связанная с решимостью и искусством. Известная под многими именами среди культур, населяющих берега Стеклянного моря, ее имя наиболее точно переводится как «Дарующая Дыхание» на сунакариксом архаичном."
 GH_NUGATORS_GLOSS: "#bold Нагаторы#! — полумифическое поколение правителей раннего [Concept('aironoian_bronze_age','айронойского бронзового века')|E], которые, как говорят, появились из морской пены на берегах Моря Империй." 
 GH_AAIMPERON_GLOSS: "#bold Ааймперон#! — это крупная полосатая ягода с сладкой кроваво-красной мякотью, широко выращиваемая в [Concept('western_aironoi_biozone', 'западной Айроное')|E] [Concept('aversaria','аверсарианцами')|E]. Изначально завезённый из [Concept('sarradon', 'Саррадона')|E] около 400 ИС, этот фрукт прошёл обширный магический отбор, благодаря чему стал крупнее, слаще и бессемянным."
 GH_DAAJ_OLIKNII_GLOSS: "#bold $feast_type_tsagaan_sar$#! — традиционный ольтенский праздник, посвящённый воссоединению двух сыновей Олгон-тена. Название переводится с древнеколргийского как «День [Glossary('Олика','GH_OLIK_GLOSS')]»."
 GH_TAROK_MAHAN_AYRAAL_AM_AYAR_GLOSS: "#bold Tarok Mahan Ayraal am'Ayar#! translates as 'the Great [paiza|E] Mint of Ayar' in the [GetCulturePillar('language_emanhi').GetName] language, one of the several main administrative languages of the [otachedian_empire|E]."
 GH_SJARVA_ERAM_AKKARA_GLOSS: "#bold Sjarva Eram Akkara#! translates as 'the Hall of the Ultimate Heaven' from the [GetCulturePillar('language_emanhi').GetName] language, one of the several main administrative languages of the [otachedian_empire|E]."
 GH_HAYTRATAROK_MAHAN_AYRAAL_GLOSS: "#bold Haytratarok Mahan Ayraal#! translates as 'the Grand Imperial [paiza|E] Mint' in the [GetCulturePillar('language_emanhi').GetName] language, one of the several main administrative languages of the [otachedian_empire|E]."
 GH_YANTRA_JVALAKAACH_GLOSS: "#bold Yantra Jvalakaach#! translates as 'the Obsidian Machine' in the [GetCulturePillar('language_emanhi').GetName] language, one of the several main administrative languages of the [otachedian_empire|E]."
 GH_RISHIRAN_GLOSS: "#bold Rishiran#! translates as 'an Administrant' in the [GetCulturePillar('language_emanhi').GetName] language, one of the several main administrative languages of the [otachedian_empire|E]."

 GH_ORZOPAJA_GLOSS: "An #bold Órzopaja#! (plural #bold Órzopajad#!) is a member of the [GetCulturePillar('heritage_sarminian').GetName] all-female martial and noble class, considered to be wholly separate from men or women. Órzopajad are known for styling their hair into long and intricate braids, whose maximum allowable length is determined by the individual's seniority, prestige, and standing among her peers."
 GH_ZSERHENI_GLOSS: "A #bold Zsêrhêni#!, meaning 'Foreign Ally', is a foreigner who has garnered a degree of recognition among the [Glossary('#G_light Órzopajad#!','GH_ORZOPAJA_GLOSS')] as one of their own."
 GH_SARMINIAN_CARDINAL_COLORS: "В [GetCulturePillar('heritage_sarminian').GetName] культуре стороны света ассоциируются с определёнными цветами и качествами, часто используемыми в речи для придания словам дополнительного смысла.\n\n$EFFECT_LIST_BULLET$#bold Синий Север#! символизирует славу, весну и божественность\n$EFFECT_LIST_BULLET$#bold Красный Запад#! связан с летом, завоеваниями и пролитой кровью\n$EFFECT_LIST_BULLET$#bold Жёлтый Восток#! олицетворяет осень и решимость\n$EFFECT_LIST_BULLET$#bold Чёрный Юг#! считается низшим — трусливым, слабым и замкнутым"
 GH_ESENGRA_GLOSS: "A folk hero popular in lowland Central Sarradon, Esengra features as the protagonist of a bewildering number of fairy tales; the most singularly popular of which describe his overthrow of the one eyed giant kings of the Khalkama peninsula through guile, cleverness, and a few acts of shocking violence. The bones of the slain tyrants he planted in the earth, to grow into the giant cedars of Sarradon."
 ##############
 # CHARACTERS #
 ##############
 
 # Non-Human
 OLD_CUBOZOID_GLOSS: "Загадочное, возможно, чисто легендарное невидимое существо, обитающее в лесах Калатипсоми. Его имя происходит из кланлановского, где оно известно как «Квадратный Старец», хотя первоначальное значение этого имени потеряно во времени."
 WILDERKING_GLOSS: "Крайне могущественный оборотень и друид, обитавший в лесах Калатипсоми, пока не был убит авантюристом сэром Рене «Усатым» в 616 ИС."
 FAIRYQUEEN_GLOSS: "Древний, могущественный дух, заключенный Королем-Волшебником Катануксой в арканное устройство за несколько веков до конца его империи. Его тюрьма переходила из рук в руки много раз после смерти первоначального владельца, и существо периодически давало советы текущему обладателю на протяжении веков, но в конечном итоге было уничтожено в неудачной попытке Автократа Мификса извлечь его силу для себя."
 GH_AAIMPERONUS_GLOSS: "#bold Aaimperonus#! is a minor member of the [Concept('aversaria','Aversarian')|E] [Concept('aelfir','First Men')|E] pantheon who is associated with [Glossary('#G_light Aaimperons#!','GH_AAIMPERON_GLOSS')], achievement, and vanity, and is traditionally seen as subservient to either Hatznur or Pollidides."
 GH_KAIGAN_GLOSS: "#bold Kaigan#! is the secondborn son of Ölgon-ten and Yeru-mai, revered by the Ölteni as the progenitor of all humanity. After the death of [Glossary('#G_light Ölik#!','GH_OLIK_GLOSS')] at the hands of their mother, he is said to have fled his parents' home, donning a mask to forever evade the same fate."
 GH_OLIK_GLOSS: "#bold Ölik#! is the firstborn son of Ölgon-ten and Yeru-mai, slain by the latter in a fit of jealousy. Brother to [Glossary('#G_light Kaigan#!','GH_KAIGAN_GLOSS')], he is said to rise from the dead on the eve the [Glossary('#G_light $feast_type_tsagaan_sar|q$#!','GH_DAAJ_OLIKNII_GLOSS')] for a single day each year."
 
 # Historical Rulers & Dynasties: Mikros Kalathipsomi
 TYRANDAX_GLOSS: "Также известный как «Дракон-Король», #BOL Тирандакс#! был [Concept('aversaria','аверсарианским')|E] драконом, сбежавшим из [Concept('war_of_the_thousand_dragons','Войны Тысячи Драконов')|E] и тиранически правившим пост-катануксианским королевством Дара Фей более десяти лет, пока не был убит."
 AEDEAN_GLOSS: "Печально известный колдун, действовавший в пост-катануксианским королевством Дара Фей, служивший советником у злобного дракона [Glossary('#G_light Тирандакса', 'TYRANDAX_GLOSS')]."
 CLOTHAR_I_GLOSS: "#BOL Хлотарь I «Драконобой»#! был шевигадский военочальник, ставшим королем, который убил дракона [Glossary('#G_light Тирандакса', 'TYRANDAX_GLOSS')] и положил начало эре этранданексийского правления в Долине Дара Фей."
 ALORIC_THE_HAUGHTY_GLOSS: "#BOL Алорик Горделивый#! был последним этранданексийским правителем, носившим титул короля Дара Фей, правившим накануне [Concept('aversaria','аверсарианского')|E] завоевания в IV веке. Жадный до власти, он запомнился прежде всего своими амбициями стать Верховным королем Предела, чему помешал Маркомер. Глубоко оскорбленный этим, как он считал, пренебрежением, он отказался сотрудничать с военными усилиями Маркомера и вместо этого попытался сопротивляться аверсарианцам в одиночку — что привело к катастрофическим и в конечном итоге смертельным для него последствиям."
 HANOUET_AND_HANOUIN_GLOSS: "#BOL Ануэ#! и #BOL Ануэн#! были легендарной парой братьев, которые вместе отвоевали восточное Древосердие у рушащегося королевства Аловура «Волчонка». После победы над последними врагами братья знаменито поссорились и начали сражаться за добычу от их завоевания, что привело к разделу их нового королевства вдоль реки Патос на две части. Многие истории подробно описывают их попытки победить друг друга в течение следующих двух десятилетий, каждая из которых в конечном итоге заканчивалась неудачей, пока оба не были обмануты и не потеряли свои короны в пользу их племянника, Пейтона «Скользкого»."
 RED_RICOMER_GLOSS: "#BOL Красный Рикомер#! — личность неопределенной природы — возможно, скорее титул, чем конкретный человек — который, по слухам, защищает рощи [GetBuilding('01_nira_yew').GetName]. Согласно легенде, он был шевигадским разбойником, срубившим одно из его деревьев — акт тяжкого святотатства. Охваченный чувством вины, он поклялся защищать место, которое осквернил, и после этого вырвал себе язык. На протяжении веков он карал любого, кто осмеливался не уважать обычаи Тиса Нира, независимо от их положения. Мастерство Рикомера с луком не имеет себе равных, и немногие могли надеяться долго избегать его гнева.\n\nВо время [Glossary('#G_light Войны Черного Тиса', 'WAR_OF_THE_BLACK_YEW_GLOSS')] он служил одним из лейтенантов [Glossary('#G_light Карттуэн «Серебряноволосой»', 'dailennir_kathanouxiac_18_desc')], наиболее печально известный тем, что возглавил кампанию, которая завершилась разрушением левого берега города Одбрю. Несмотря на окончательное поражение фей в войне, сам Красный Рикомер избежал смерти, и, как говорят, он периодически появляется на землях, которые поклялся защищать, по сей день."

 
 #############
 # LOCATIONS #
 #############
 
 FIDHASIL_TREE_GLOSS: "Гигантский древний бук и место оракулов в [GetTitleByKey('k_heartwood').GetBaseNameNoTier]. Уничтожен по приказу [Concept('aversaria','аверсарианского')|E] губернатора Калатипсоми в VII веке."
 GH_MLIMA_TAA_GLOSS: "Буквально «Горный Фонарь» на [GetCulturePillar('language_kevaali').GetName] языке, #italic Млима'Таа#! — древний вулкан, известный светящимися каменными трещинами и шрамами, покрывающими его склоны."
 GH_SEIBANTAI_GLOSS: "Дословно «Белый зал» на языке катунском"
 USEHHAR_MOUNTAINS_GLOSS: "The Usehhar Mountains are a vast range of jagged and inhospitable mountains in the eastern [Glossary('#G_light Sarradonian Desert#!','sarradonian_desert_encyclopedia_desc')]. Little of mankind has thrived here, with the Usehhars' centre dominated by powerful volcanoes, tarsos, and jagged spires. What water exists flows deep beneath the surface in a great web of underground rivers that feed [Glossary('#G_light Kratemezin#!','crater_encyclopedia_desc')] to the east and the [Glossary('Boneyard','boneyard_encyclopedia_desc')] further north."
 GH_THE_MAGISTERIUM_GLOSS: "A dense complex of ancient ruins in the midst of Oraispol's sprawl, the entirety of buildings stretching across a large hill-ridge in southern Oraispol was built upon a towering spire of ruins by Aautokratia $aauto_maklea_link$ Maklea#! first as a site to perform the [thyaeasrixtorax|E] and would thereafter become the main gathering point for [Concept('aversaria','Imperial')|E] [magi|E] during the reign of Pathos until the establishment of the [mayikrata|E]. By the Golden Age of [aversaria|EE] it had grown into a sprawling complex of academies, libraries and high-caste districts with its own army of Battle-[magi|E] just to guard its streets. Aautokratia $aauto_theyssia_link$ Theyssia#! had much of the [Concept('prehistory','unfathomably ancient')|E] ruins the complex sat upon rebuilt in the image of popular Imperial imaginations of the [first_empire|E], and it would be considered the magical capital of Etepezea until its destruction in the aftermath of [the_vilnian_assault|E|l]."
 MAHARATNA_MAHAL_GLOSS: "Commonly Jewel Palace or Palace of Jewels across Kashirya"
 SANAGIRIA_GLOSS: "Called 'Gahareen' by the Huxayakhan"

 OLD_NORTH_GLOSS: "The Old North is a colloquial term for the lands of far north [foglands|E] long since lost to the fog, where many settlers of the [sjalvolki_migration|E] once called home."
 GH_CHRYSEMVIXA_GLOSS: "#bold Chrysémvixa#! — meaning 'Gold Crest' in eastern dialects of the [Concept('aversaria','Aversarian')|E] languages — is the name of the mountain range that stands above the great wheat fields of [Glossary('Western Aironoi','western_aironoi_encyclopedia_desc')] and divides the region from the rest of Aironoi to the east."
 GH_PHALONOX_GLOSS: "The #bold Phalonox River#! is former [Concept('aversaria','Aversarian')|E] name for the [Glossary('Eramasic','GH_ERAMASIC_RIVER_GLOSS')]. Its name was derived from the word [Glossary('Phalóx','GH_PHALOX_GLOSS')], due both to the river's central position on [the_continent|E] and because of how the mountain cliffs that frame its estuary have historically shielded the Empire from continental interior."
 GH_PHALOX_GLOSS: "#bold Phalóx#! is a [Concept('aversaria', 'proto-Aversarian')|E] word that literally translates to the hub of a wheel. It would become the name both for the traditional circular Imperial shield and the main 'hub-and-spoke' military formation of the ancient Imperial Army and [Glossary('Drakarnaxauxila','GH_DRAKARNAXAUXILA_GLOSS')], the predecessors to the later Imperial Legions."
 GH_ERAMASIC_RIVER_GLOSS: "The #bold Eramasic River#! — originally the [Glossary('Phalonox','GH_PHALONOX_GLOSS')] — bifurcates the historical region of [Concept('foglands','Katraddia')|E] in two and is generally agreed to be the longest in the world, especially when considered with its thousands of tributaries. In 765 IS Aautokratia $aauto_theyssia_link$ Theyssia#! would rename the Phalonox after her predecessor, Aautokratir $aauto_eramos_link$ Eramos#!, whom she regularly emphasized as her previous incarnation."
 GH_PHALONOXONPOLI_GLOSS: "The Malcoisiac colony of #bold Phalonoxonpoli#! derives its name from the Eramasic river's original name — the [Glossary('Phalonox','GH_PHALONOX_GLOSS')]. Founded in 518 IS as the first Malcoisiac settlement in what would become Katraddia, the city would be destroyed by the [Concept('kartharadd','Kartharaddi')|E] in 645, resettled by the Kartharaddi as a fortress in 698, before its razing and resettlemenet by the Aversarians in 746 IS. It would eventually become one of the governorate's many historical capitals in 967, 1001 and 1143, and would finally be largely abandoned after seventeen separate sackings and conquests by invading migrants between 1198 and 1246, its ruins consumed by [the_fog|E] by 1255."

 ##################
 # HISTORIOGRAPHY #
 ##################

 # Aversarian Organizations
 GH_FIRST_IMPERIAL_COUNCIL_GLOSS: "The first of many Imperial Councils and sometimes remembered in poem as the 'Treacherous Council'. It was the ruling body of Oraispol and the surrounding region between the city's sacking at the end of the [war_of_the_thousand_dragons|E] in 170 IS until the 243 IS [hexing_of_oraispol|E] and its [Concept('maklean_terrors','purging')|E] by Aautokratia $aauto_maklea_link$ Maklea#!."
 GH_SIXTH_IMPERIAL_COUNCIL_GLOSS: "The #BOL Sixth Imperial Council#! was established in 729 IS by Aautokratir $aauto_eramos_link$ Eramos#! to replace the Fifth Imperial Council (the infamous Council of Zealots) that had been disbanded by Aautokratir Kethemodes in 618 IS. Meant to unify the rapidly disintegrating aristocracy in the disastrous wake of the early [Concept('kartharadd','Kartharaddi Wars')|E], Eramos would use the Council to grant himself the emergency powers needed to perform his legendary Legion Reforms under the supervision of the [Glossary('#G_light Band of Three#!','GH_BAND_OF_THREE_GLOSS')].\n\nAfter Eramos's death in 756 IS, the Band of Three would form the [Glossary('#G_light Council of Heroes#!','GH_COUNCIL_OF_HEROES_GLOSS')] and form a regency council with the stated aim of rebuilding the scarred Empire. The Sixth Imperial Council disputed this and attempted to curtail the legions and their political ascendancy. The two would theoretically rule together in the [Glossary('#G_light Imperial Conciliary#!','GH_IMPERIAL_CONCILIARY')] until both factions collapsed in the wake of the [Glossary('#G_light failed Blood Senate#!','GH_BLOOD_SENATE_OF_761_GLOSS')].\n\nThe Council would throw their support between a relative outsider in $aauto_theyssia_link$ Iana Theyssia#!, but would be sidelined early in her reign and quickly become subordinate to her reign, ending in the Council unanimously — if begrudgingly — granting Theyssia the same emergency powers they had once given Aautokratir Eramos in the First Theyssian Legal Charter, effectively enshrining them into Imperial Law and permanently ending the political independence of the Council. The Sixth Council would remain an extension of Aautokratia Theyssia's rule until its disbandment in the opening of Aautokratir Mythix's reign in 892 IS."
 GH_COUNCIL_OF_HEROES_GLOSS: "The #BOL Council of Heroes#! (or Council of Legions) was the de facto ruling body of the [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] during the [legion_regency|E] and the early Imperial Restoration Period until the rise of Aautokratia $aauto_theyssia_link$ Theyssia#!. The Council would jointly rule in increasing opposition to the [Glossary('#G_light Sixth Imperial Council#!','GH_SIXTH_IMPERIAL_COUNCIL_GLOSS')] beneath what was collectively named the [Glossary('#G_light Imperial Conciliary#!','GH_IMPERIAL_CONCILIARY')].\n\nThe Council was forged by the [Glossary('#G_light Band of Three#!','GH_BAND_OF_THREE_GLOSS')] in what was effectively a legal coup using various wartime powers Aautokratir $aauto_eramos_link$ Eramos#! had secured to win the [Concept('kartharadd','Kartharaddi Wars')|E]. The council saught to rebuild the Empire with the backing of the newly formed and politially ascendant Legions against what it saw as a fallible and treacherous aristocracy that hoped to restore the many privileges they had lost to Eramos. The Council would, however, fall into infighting and multiple controversies, culminating with the assassination of Aeona Theyssia and Legon Ruthar Itrix and a [Glossary('#G_light failed Blood Senate#!','GH_BLOOD_SENATE_OF_761_GLOSS')] in 761 IS.\n\nThe Council of Heroes would collapse with the tumultous rise and death of Ixon 'the Manifestant' at the hands of Iana Theyssia, dividing into several major factions that were each defeated by Theyssia in a dizzying series of political plays and purges over the next decade. Both halves of the Imperial Conciliary would be disbanded after six of the nine remaining leading generals of the Council of Heroes formally bowed to Theyssia in the Reconciliation, firmly establish Theyssia's control of the Empire and ending the brief political suzerainity of the newly formed legions." # GH TODO: Link 'rise of Aautokratia Theyssia' to the Theyssian Golden Age gloss entry when it's finished
 GH_IMPERIAL_CONCILIARY: "The #BOL Imperial Conciliary#! refers to the joint rule of the [Glossary('#G_light Council of Heroes#!','GH_COUNCIL_OF_HEROES_GLOSS')] and the [Glossary('#G_light Sixth Imperial Council#!','GH_SIXTH_IMPERIAL_COUNCIL_GLOSS')] over the [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] following the death of Aautokratir $aauto_eramos_link$ Eramos#! in 756 IS. The Conciliary was initially dominated by the newly formed and politically triumphant legions that retained wide-reaching emergency powers in the wake of the [Concept('kartharadd','Kartharaddi Wars')|E], but an indignant aristocracy would rally behind the Sixth Imperial Council and thereafter begin a tumultuous series of political conflicts over control of the [Glossary( '#G_light Aautokrata#!', 'GH_AAUTOKRATA_GLOSS' )] in the [Glossary('#G_light Legion Regency#!','GH_LEGION_REGENCY')]. Both sides would attempt to secure rights and privileges meant for the aautokratir themselves, but ultimately managed to do little more than gridlock Imperial politics and greatly hamper attempts to rebuild in the wake of the [chaos_of_the_seventh_century|E].\n\nThe infighting between the two would lead to the Battle of Vixxi Marsh in 760 IS, during which State Legion LXXXI 'Dragonfire' would battle the Imperial Council-aligned Governorial Legion XXIX 'Pactsworn' and two accompanying Noble legions, leading to the leaders of both armies being ordered to suicide by the opposing councils in the Fourteen Trials. Mounting fears over civil war following the event led to the disastrous [Glossary('#G_light Blood Senate of 761 IS#!','GH_BLOOD_SENATE_OF_761_GLOSS')] and pave the way for the unexpected meteoric rise of Aautokratia $aauto_theyssia_link$ Iana Theyssia#! in 764 IS.\n\nIana would thereafter curtail the powers of both councils in a dizzying series of political plays that would finally end with the disbandment of the Council of Heroes and the subordination of the Sixth Imperial Council to the throne, cementing Theyssia's power and beginning the Theyssian Golden Age."
 GH_IMPERIAL_CHANCELLERY: "Sometimes called the $aauto_maklea_link$ Maklean#! Regency Council, the #BOL Imperial Chancellery#! was the impromptu council established to hold the [Concept('aversaria','Imperial')|E] throne after the death of Maklea before a proper heir could be established. Unable to contend with the rising tides of warlordism, the machinations of the Etepezean court, or the controversy of the False Makleas, the Chancellery would collapse in 275 IS with the coup of Governor Isixon 'the Black Tongued' in Etepezea and his ensuing coronation of Aautokratir Paxanorasos 'the Unready'."

 # Aversarian Historiography
 GH_POLISOCRACY_GLOSS: "The #bold Polisocracy#! refers to the thousands of city-states (and as many forms of government) in the [Concept('aversaria', 'proto-Aversarian')|E] [Concept('shatteredisles','Isles')|E] and their dominance for at least a millenia before the [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]. The polis and their colonies would rarely unite under great conquerors — normally a [Glossary('#G_light nikariyn#!','GH_NIKARIYN_GLOSS')] — but for most of their history were incredibly fractious. The last of the nikariyn would unite hundreds of polis into a loose confederation — the [Glossary( '#G_light Aautokrata#!', 'GH_AAUTOKRATA_GLOSS' )] — but political conflict over the nature of the Empire and its aautokratir would culminate with the [war_of_the_thousand_dragons|E]. The victory of Aautokratir Aexionarax ended the Polisocracy in favor of a theoretically unitary Imperial authority."
 GH_NAEXANAXICA_GLOSS: "#bold Naexanaxica#! is a [Concept('aversaria', 'proto-Aversarian')|E] bastardization of [Glossary('#G_light naexonix#!','GH_NAEXONIX_GLOSS')] which can best be translated to 'Islandia'. It was the most common name for the region of the [shatteredisles|E] around the [Concept('imperial_isle', 'Imperial Isle')|E] which the [Glossary('#G_light $polis_apostrophe|q$#!','GH_POLISOCRACY_GLOSS')] centered around for eons. 'Naexanaxic' remains a common term for both the proto-Aversarian culture and the wider cultural family to the modern day."
 GH_NAEXONIX_GLOSS: "#bold Naexonix#! translates to 'island' in the [Concept('aversaria', 'proto-Aversarian')|E] Naexanaxic language. The word would become 'naexox' in the Middle Imperial language reforms of the 3rd century and 'nexon' by the 11th."
 GH_NIKARIYN_GLOSS: "The #bold Nikariyn#! — literally 'First Captain' in ancient Aersodiaxian religious text. Imperial titles in [Concept('aversaria', 'proto-Aversarian')|E] culture were considered above mortals, the highest secular rank being the captain of the guard for the god Aersodiax. The Nikariyn would briefly unite the [Glossary('#G_light $polis_apostrophe|q$#!','GH_POLISOCRACY_GLOSS')] through conquest or in response to crisis for millenia until the '[Glossary('Last Nikariyn','GH_LAST_NIKARIYN_GLOSS')]' abolished the title after the Dragonblight."
 GH_LAST_NIKARIYN_GLOSS: "The #bold Last Nikariyn#! is the popular name for the first ruler of the [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier], the [magi|E]-warlord Dhace'nox Nikary'xos. Claiming the title of [Glossary('#G_light nikariyn#!','GH_NIKARIYN_GLOSS')] in response to the Dragonblight, Dhace'nox would unite the disparate [Glossary('#G_light city-states#!','GH_POLISOCRACY_GLOSS')] of [Concept('aversaria', 'proto-Aversaria')|E] and end the turmoil of the previous century. He would then controversially declare his [Glossary( '#G_light Aautokrata#!', 'GH_AAUTOKRATA_GLOSS' )] permanent, abolish the title of Nikariyn in favor of 'Aautokratir', and establish a legacy that would change the history of [aeras|E] forever."
 GH_TERROXIAN_IMPERIAL_EDICT_MANIFESTO_GLOSS: "The #bold Terroxian Imperial Edict Manifesto#!, or 'Terrox's Declarations', was a thirty-thousand word long manifesto printed across the [theyssian_scrivenery_network|E] in the wake of [the_vilnian_assault|E|l] and [the_oration_of_legions|E|l]. Largely considered nearly incomprehensible, Terrox ordered thousands of copies made, the effort destroying what remained of the last major mass-Scriptoriums in the [mayikrata|E] and burning out what remained of the Network across the [Concept('aversaria', 'empire')|E]."
 terrox_possessive: "Terrox's"
 GH_THREE_EXALTED_MATRONS_GLOSS: "The #bold Three Exalted Matrons#! refers to $aauto_maklea_link$ Aautokratia Maklea#!, Aeliadias, and $aauto_theyssia_link$ Theyssia#! and their combined three centuries of rule over the [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] in the third, fifth and eight centuries IS. While [Concept('aversaria', 'proto-Aversarian')|E] society beneath the [Glossary('#G_light Polisocracy#!','GH_POLISOCRACY_GLOSS')] was strictly patriarchal, the rapid and unexpected rise of Maklea and the following great purges and cultural reorganization she oversaw permanently established women as equal to men in terms of Imperial succession. While various aautokratirs of both genders would rise and fall; and some — such as Phancis, $aauto_eramos_link$ Eramos#! and Nothyx — would also become enshrined in legend, each of the matrons would establish themselves as such influential figures as to embody whole eras of the Empire and its laws."
 GH_IMPERIAL_RESTORATION_PERIOD_GLOSS: "The #BOL Imperial Restoration Period#! was the period of Imperial [Concept('aversaria','Aversarian')|E] history from the end of the [chaos_of_the_seventh_century|E] at the Battle of the Riduvian Barrows in 756 IS to the [Glossary('#G_light Late Imperial Period#!','GH_LATE_IMPERIAL_PERIOD_GLOSS')]." 
  #The period was perhaps the dynamic and transformative Imperial era since the reign of $aauto_maklea_link$ Maklea#!, and is itself divided into several distinct eras.\n\nThe first was the Legion Regency. Then, the Early Theyssian Period" # GH TODO: Finish
 #GH_EARLY_THEYSSIAN_PERIOD_GLOSS: "#BOL The Early Theyssian Period#! constitutes the first several decades after" 
 GH_LATE_IMPERIAL_PERIOD_GLOSS: "The period of [imperial|E] [Concept('aversaria','Aversarian')|E] history from roughly the Agionist Rebellions in 1085 IS (or sometimes the 966 IS [war_of_all_islands|E] and the peak of post-Golden Age Imperial power) to [frodbrokna|E] and the [Glossary('#G_light Imperial Anarchy Period#!','GH_IMPERIAL_ANARCHY_PERIOD_GLOSS')] in 1200 IS."
 GH_IMPERIAL_ANARCHY_PERIOD_GLOSS: "The final period of [imperial|E] [Concept('aversaria','Aversarian')|E] history. Various points during the [imperial_civil_war|E] are often claimed to be the actual beginning of the Period, with some Old Imperial writers going so far as to declare [odrstund|E] or the [turmoil_of_the_sixteen_aautokratirs|E] as the ending of the [Glossary('#G_light Late Imperial Period#!','GH_LATE_IMPERIAL_PERIOD_GLOSS')] instead. The #BOL Imperial Anarchy Period#! consisted of the complete collapse of Imperial Law and culture and is universally agreed to have ended (along with the [Glossary( '#G_light Aautokrata#!', 'GH_AAUTOKRATA_GLOSS' )] itself) during the [Concept('sjalvolki_migration', 'Sjalvolki Migrations')|E] – mostly commonly the Fall of Oraispol in 1255 IS."
 # GH_THIRD_IMPERIAL_GOLDEN_AGE_GLOSS: "The #bold Third Imperial Golden Age#!, or the #bold Theyssian Golden Age#!, refers to Aautokratia Theyssia's rule after the [chaos_of_the_seventh_century|E] and her defeat of the Imperial Conciliary between 768 IS and her death in 892 IS. Theyssia"
 THIRTY_GOLDEN_SUMMERS_GLOSS: "#BOL Тридцать Золотых Лет#! — золотой век, локализованный в Калатипсоми, длившийся с 563 по 593 ИС и отмеченный тридцатью годами беспрецедентного мира, компетентного правления, рекордных урожаев, мягких зим и затишья в конфликтах с феями."
 GH_EIGHT_GREAT_MARTYRDOMS_GLOSS: "#BOL The Eight Great Martyrdoms#! is an Aversarian term for several dozen of the hundreds of purges performed during the [maklean_terrors|E]. Each ‘Martyrdom’ represents a different phase of her purges and is normally contextualized around the targeting of a different group -- though the rapid and wide-reaching nature of the Terrors meant wide swathes of the Empire were killed or otherwise victimized in each – and generally only those purges that targeted aspects of Imperial society. The many purges of slaves, ‘barbarians’, and the groups that would not survive onwards would largely become individually forgotten by the Imperial-centric literary record of the survivors.\n\nThe First Martyrdom was of the many remaining Aersodiaxian political factions that had survived the [war_of_the_thousand_dragons|E] and most other groups that had fought the Imperial faction during the War. The following purges targeted the Polish nobility, the various tributary realms and barbarian or slave cultures, the Mountain-Sun Monastic Orders in Opakhasia, the priesthood of the Imperial Cult and hundreds of other Aversarian faiths, the Imperial Army and the Dragonrider Fraternities, the Mountain-Sun Monastic Orders again, and finally the majority of the Imperial bureaucracy and the Magi class (most of whom were loyalists she had already put into power throughout her reign)."
 maklea_possessive: "Maklea's"

 # Aversarian Events
 GH_BLOOD_SENATE_OF_761_GLOSS: "The #BOL Blood Senate of 761 IS#! was one of the most controversial Blood Senates until the [Glossary('#G_light Late Imperial Period#!','GH_LATE_IMPERIAL_PERIOD_GLOSS')]. After years of delays by the [Glossary('#G_light Imperial Conciliary#!','GH_IMPERIAL_CONCILIARY')] and escalating infighting culminating in the Battle of Vixxi Marsh and the Fourteen Trials, mounting fears of civil war led to the declaration of a Blood Senate to end the regency that had been left in place by $aauto_eramos_link$ Eramos#!'s death. The ensuing Blood Senate in 761 IS was marred with controevrsy and intrigue as well as a multitude of legal battles to decide its official course.\n\nAfter several dozen early rounds, the [magi|E] Aeona $aauto_theyssia_link$ Theyssia#! and Legon Ruthar Itrix would rise as the favorites of the [Glossary('#G_light Sixth Imperial Council#!','GH_SIXTH_IMPERIAL_COUNCIL_GLOSS')] and the [Glossary('#G_light Council of Legions#!','GH_COUNCIL_OF_HEROES_GLOSS')] respectively. They would, however, be assassinated along six other contenders (among the final twenty).\n\nThe Blood Senate would thereafter collapse despite the victory of Ixon 'the Manifestant' who would be refused entry to Oraispol for his coronation. Iana Theyssia, sister of Aeona, would accuse Ixon of the assassination of her sister and challenge him to a duel, in which she slew Ixon at the culmination of a legendary five hour duel — generally marking the beginning of the Early Theyssian Period. Despite being offered the crown by the Imperial Conciliary, she would insist on a second Blood Senate with a new charter of rules of her own creation, which would thereafter become the basis for all future Blood Senates. In the following Blood Senate of 764 IS, she would handidly defeat all remaining contenders for the throne and finally be coronated as aautokratir."
 WAR_OF_THE_BLACK_YEW_GLOSS: "#BOL The War of the Black Yew#! was a massive conflict that engulfed the Reach in the [chaos_of_the_seventh_century|E], a culmination of decades of warfare between the powers of the wood and their servants and the realms of the Etrandexi and [aversaria|E]. It was ignited by the return of [Glossary('#G_light Carttuen Silver-Hair#!', 'dailennir_kathanouxiac_18_desc')], who sought to enact the ritual known as the I-Amanthil, which would've merged the realms of the mundane and those of [aspect_dream], and also fulfilling a by then six-century long propehecy that she would rule Kathanouxa's long-dead empire.\n\nCarttuen would ultimately be defeated by a vast coalition of local Etrandexi, Aversarians, Clanlanders and even dissenting fey, and the conclusion of the war would result in the establishment of the Truce of the Hearth and Wood, which finally delineated the boundaries of the old powers and the realms of man, putting an end to fifty years of bloodshed and ending large-scale conflict between the two sides for good."

 # Aversarian Culture
 GH_BLOODWINE_GLOSS: "#bold Bloodwine#! is a prized Imperial beverage popular in [aversaria|E], primarily amongst the nobility and the [Concept('imperial_magi_class', 'Magi castes')|E]. Bloodwine is actually a vodka — olive or fruit — distinguished by a drop of blood in the glass or bottle. The drink was ritually served in feasts alongside bread as a sign of trust among [aspect_blood] Magi, but during the Third Imperial Golden Age, the [magi|E] had spread the drink to much of society and had begun to often include magical ingredients, spices, and blood from specially cultivated creatures or alchemically prepared for flavor and color."
 GH_AVERSARIAN_SEERESS_GLOSS: "#bold Seeresses#! in [Concept('aversaria', 'proto-Aversarian')|E] society were the primary practitioners of [magic|E] and were often leading figures in religion and politics. In the primarily patriarchal [Glossary('#G_light $polis_apostrophe|q$#!','GH_POLISOCRACY_GLOSS')], secular authority was seen chiefly as the realm of male aristocrats, while magical authority was held by women. Seeresses would organize into priestly orders centered around a Matron, who would train acolytes for life and groom them for important rituals of divinancy and for roles advising the ruling class. Boys raised as Magi were considered women, at least until the [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] and the end of the [dragons|E] gave rise to the [Concept('imperial_magi_class', 'Imperial Magi Class')|E].\n\nThe reorganization and professionalization of Magi beneath the [Glossary( '#G_light Aautokrata#!', 'GH_AAUTOKRATA_GLOSS' )] and the establishment of magic as a modern sign of aristocracy saw the role of the seeresses greatly diminished, as well as the purges of $aauto_maklea_link$ Aautokratia Maklea#! that saw most of the larger surviving orders destroyed or forcefully integrated beneath the Empire. Despite this, the seeresses still held a vaunted position within Aversarian religion and culture, with seeresses such as [Concept('aehan_massacre','Aeha')|E], Valathixa, and the prophet Sanxi all holding positions of great influence in the Imperial court."
   polis_apostrophe: "polis'"
 GH_DRAKARNAXAUXILA_GLOSS: "Literally 'Dragon Auxiliary' in [Concept('aversaria','Middle Imperial')|E]. Drakarnaxauxila were the descendants of the Dragonrider Fraternities of the [war_of_the_thousand_dragons|E] and the [Glossary('#G_light Polis Era#!','GH_POLISOCRACY_GLOSS')]. Left without their [dragons|E] after the 171 IS culling of the beasts by Aautokratir Aexionarax, the Fraternities would nevertheless remain the largest force in the Imperial Army until the [marcher_aversarian_wars|E]. Acting as an autonomous collection of independent armies under the Imperial banner, the system of military organization that they inspired would persist until Imperial Army's disastrous performance in the early [Concept('kartharadd','Kartharaddi Wars')|E]. The legacy of the Drakarnaxauxila would finally end with the legendary Legion Reforms of Aautokratir $aauto_eramos_link$ Eramos#! in 726 IS, when the Imperial Army was replaced with the Aversarian Legions — modelled after the professional armies of their Kartharaddi foes."
 GH_AERAIMATAXGORRAX_GLOSS: "#bold Aer'aimataxgo'rrax#!, roughly translates to 'Divine Bloody Feast' in the language of the Kyrots of Etapexe. The Aer'aimataxgo'rrax was an eight day long festival of mass sacrifice, cannibalism, and deviancy, culminating on the Night of the Voids where the aristocracy of the Aer'aimataxgo'rrax cities would march door to door an. The practice would become largely ceremonial after a string of major rebellions in the 4th century BI, and would be formally banned in the by the [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] not long before the banning of the Kyrotic language in 255 IS."
 GH_NIGHT_OF_THE_VOIDS: "The #bold Night of the Voids#! was the culmination of the ancient Kyrotic festival of [Glossary('Aer'aimataxgo'rrax','GH_AERAIMATAXGORRAX_GLOSS')], the largest of which would occur in the city of Kyrotapon — modern Agrinamea — though smaller versions would be held in most Kyrotic [Glossary('polis','GH_POLISOCRACY_GLOSS')]. The Kyrotic aristocracy would take up arms and black robes and march door to door, calling out to those amongst their citizenry for any crimes or slights made in the past year and pronouncing the punishments for their crimes (real or imagined). The festival was primarily a method of terrorizing the vast slave populations of Kyrot society, and also allowed the aristocracy to extort, abuse, and assault the men and women of the population. Kyrot families could avoid the worst of the festival by paying a tithe to their lord or sending a son to join in the terrors. Afterwards there would be a great feast, and a 'merciful' freeing of some slaves."

