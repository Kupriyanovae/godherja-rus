 GH_OS_TANDRAKH_GLOSS: "#bold Ос Тандрак#! переводится как «Последнее путешествие» на литургическом языке Арувасуэни."
 GH_YAKNHA_GLOSS: "#bold Якньха#! означает «защитник» на ликархикском языке."
 GH_URANLASH_GLOSS: "#bold Уранлаш#! можно приблизительно перевести как «Под почвой» на литургическом языке леки."
 GH_DAMALMA_GLOSS: "#bold Дамальма#! обычно переводится как «Странники по [aeras|E]» на языке леки."
 GH_RAN_KEMSARI_GLOSS: "#bold Ран Кемсари#! означает «Сердцевинный Кемсари» на кемсарийском языке."
 GH_DODRAGN_GLOSS: "#bold Додрагн#! означает «Чужак» на аупфовланском языке."
 GH_DAYARKA_GLOSS: "#bold Даярка#! означает «Народ Дайи» на танарканском языке."
 GH_BANWAGUL_GLOSS: "#bold Банвагул#! означает «Небесные мореплаватели» на танарканском языке."
 GH_SURUGIN_GLOSS: "#bold Суру'гин#! означает «лишённые надежды» на их родном наречии."
 GH_TRIBOCICAI_GLOSS: "#bold Трибоцикаи#! означает «Три сестры» на языке холмвольков."
 GH_MADUGI_GLOSS: "#bold Мадуги#! означает «Северяне» на языке мадикириб."
