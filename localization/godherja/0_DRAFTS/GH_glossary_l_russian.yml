 # Ja'Rakmari Language
 GH_SEVRA_PAR_GLOSS: "#bold Севра Пар#! означает «Танец топоров» на языке джа'ракмари."
 GH_SEVRA_TUUN_GLOSS: "#bold Севра Туун#! переводится как «Топорный совет» на языке джа'ракмари."

 # Sarminian Language
 GH_ANOHELIS_GLOSS: "#bold Анохелис#! (в единственном числе #bold Анохела#!) переводится как «Отмеченные» на [GetCulturePillar('language_sarminian').GetName] языке."
 GH_BOCZOJ_GLOSS: "#bold Бочой#! переводится и как «Регент», и как «Командующий» на [GetCulturePillar('language_sarminian').GetName] языке."

 # Aversarian Language
 GH_PRATOGONOI_GLOSS: "От [GetCulturePillar('language_aversarian').GetName] #bold Prātogonoi#!, что означает «Перволюди»."
 GH_APOKIAKAS_GLOSS: "#bold Апокиакас#! означает «Колониалы» на [Concept('aversaria','аверсарианском')|E] языке."
 GH_SKORIKIAKAS_GLOSS: "#bold Скорикиакас#! означает «Черви-колониалы» на [Concept('aversaria','аверсарианском')|E] языке."
 GH_SKOLIX_GLOSS: "Происходит от [Concept('aversaria','аверсарианского')|E] слова, означающего «червь». #bold Сколикс#! — это преимущество западно-имперское оскорбление, используемое в отношении [Concept('mutations','мутантов')|E]."
 GH_ETRANDANEXI_GLOSS: "#bold Этранданекси#! — [Concept('aversaria','аверсарианизированное')|E] искажение [Concept('chevalie','шевальского')|E] слова, означающего «чужеземец». Обычно относится к известной общине шевало-аверсарианцев в Калатипсоми после [marcher_aversarian_wars|E]."
 GH_AAUTOKRATA_GLOSS: "#bold Ааутократия#! приблизительно переводится как «империум» или «держава» на [Concept('aversaria','аверсарианском')|E] языке. Это слово не является прямым синонимом империи, так как обладает божественным подтекстом и занимает положение выше любого «смертного» царства. Первое царство и Второе — [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] — исторически считаются единственными «истинными» Ааутократиями в аверсарианской историографии."
 GH_ENMEXOT_GLOSS: "#bold Энмексот#! («находящийся посередине» или «полукровка» в зависимости от диалекта) — традиционный [Concept('aversaria','аверсарианский')|E] термин для жителей Империи, не входивших в касты граждан или [Concept('aversarian_slavery', 'рабов')|E]. В то время как имперские граждане были наделены огромным количеством прав и привилегий, а рабы — противоположным, большинство населения находилось в промежуточном положении. Их права и статус в [Glossary( '#G_light Ааутократии#!', 'GH_AAUTOKRATA_GLOSS' )] сильно варьировались, а сами группы занимали середину кастовой иерархии между рабами и гражданами. Родственные расы [Glossary( '#G_light Аниксионкроитропикс#!', 'GH_ANIXSIONTHROPIX_GLOSS' )] были, как правило, наиболее высокопоставленными из этих каст, превосходя по престижу и богатству даже многие низшие касты граждан."
 GH_ANIXSIONTHROPIX_GLOSS: "#bold Аниксионкроитропикс#! (буквально «Народ племянников») — [Concept('aversaria','аверсарианская')|E] калька для понятия «Родственная раса». Термин «племянник» в аверсарианском языке представляет собой уменьшительную форму от слова «двоюродный брат/сестра», а буквальный перевод слова в языке задуман как самоуничижительный термин для описываемых групп, подразумевающий их подчинение более старшей аверсарианской культуре.\n\nТермин не имеет глубоких культурных корней, а был создан [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] для богословского обоснования особого правового статуса [marchers|E], установленного в конце [marcher_aversarian_wars|E] в рамках [dielecendian_compromise|E]. Они обладали душами, в отличие от [Concept('aversarian_slavery', 'Кровных рабов')|E], но не являлись людьми (и, следовательно, гражданами). Со временем этот термин стал охватывать и многие другие группы [Glossary( '#G_light Энмексотов#!', 'GH_ENMEXOT_GLOSS' )] в [Glossary( '#G_light Ааутократии#!', 'GH_AAUTOKRATA_GLOSS' )], включая ольтени, [Concept('videro_cnavaius','ломониоси')|E], катуни и других."

 # Sunakari Language
 GH_IUR_VOL_RANNU_GLOSS: "#bold Иур воль Ранну#! означает «Закон конфликтов» на старосунакарском языке."
 GH_KAZVOSK_GLOSS: "#bold Казвоск#! переводится как «Город гордости» на архаичном варианте сунакарского языка."
 GH_GISHVOSK_GLOSS: "#bold Гишвоск#! — давно затерянный древний дворцовый город [GetCulturePillar('heritage_kherkeloi').GetName], чье название означает «Город знамений» на архаичном диалекте сунакарского языка."
 GH_ARMUT_YAN_GLOSS: "#bold Армут Ян#! означает «Путь меча» на латто-сунакарском креольском языке."
 GH_OS_KINJER_GLOSS: "#bold Ос Кинжер#! означает «Последнее испытание» на джа'ракмарийском диалекте сунакарского языка."
 GH_ZEKVOT_GLOSS: "#bold Зеквот#! (этимология неизвестна) был уничижительным [GetCulturePillar('language_aversarian').GetName] термином для зелкаванских рабов в городе [GetTitleByKey('c_orkattar').GetBaseNameNoTier]. К XI веку он стал обозначением любого зелкавани, проживающего в энтрепексатийских городах [GetTitleByKey('d_serbar').GetBaseNameNoTier]."

 # Kikarsagi Language
 GH_TELIGONOIAR_GLOSS: "#bold Телигонойар#! — [GetCulturePillar('language_sycharceg').GetName] заимствование из [GetCulturePillar('language_aversarian').GetName] #bold Teligonoi#!, означающее «Последние люди»."
 GH_ARDARA_GLOSS: "#bold Ардара#! может быть широко переведено как «честь» на старокикарсагском языке, но более точно означает «праведность, поддерживающую душу»."

 # Nattanan Language
 GH_NALMICN_QUHA_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Nalmicn Quha#!, что означает #italic Край Пути#!."
 GH_SUGUSULEAA_SUGUKYA_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Sugusuleaa Sugukya#!, что означает #italic Пастушьи Холмы#!."
 GH_NAT_KAN_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Nat Kan#!, что означает #italic Источники Духов#!."
 GH_AKKHAR_FRECHA_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Akkhar Frecha#!, что означает #italic Король Смерти#!."
 GH_SOGO_TOM_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Sogo Tom#!, что означает #italic Крепкий Редут#!."
 GH_CHAN_JERNIEM_SULEAAN_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Chan jerniem Suleaan#!, что означает #italic Охотники Йерниема#!."
 GH_KORLE_LEHTOR_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Korle Lehtor#!, что означает #italic Пламенная Кузница#!."
 GH_KORLO_RUPAN_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Korlo Rupan#!, что означает #italic Огненный Голем или Огненная Статуя#!."
 GH_LEH_RUPAN_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Leh Rupan#!, что означает #italic Металлический Голем или Металлическая Статуя#!."
 GH_ADHIT_TRA_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Adhit Tra#!, что означает #italic Отдых Солнца#!."
 GH_MOH_NALMICN_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Moh Nalmicn#!, что означает #italic Туманные Пути#!."
 GH_SOGO_JERN_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Sogo Jern#!, что означает #italic Сильные Звери#!."
 GH_KUAM_HULLO_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Kuam Hullo#!, что означает #italic Перевернутые Джунгли#!."
 GH_BIN_NALMICAA_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Bin Nalmicaa#!, что означает #italic Гигантский Ленивец#! или буквально #italic Гигантские Идущие Неверным Путем#!."
 GH_NATHANALMIC_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Nathanalmic#!, что означает #italic Срединный Путь#!."
 GH_KATHARNALMIC_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Katharnalmic#!, что означает #italic Каменистый Путь#!."
 GH_GOTHARNALMIC_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Gotharnalmic#!, что означает #italic Высокий Путь#!."
 GH_CARLEH_SOGOTOM_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Carleh Sogotom#!, что означает #italic Железная Крепость#!."
 GH_POR_CHAN_KAENGA_VAG_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Por Chan Kaenga Vag#!, что означает #italic Дом Звездного Цветка#!."

 GH_CHAN_FEI_TEIB_TANSIT_KON_CROD_GLOSS: "От [GetCulturePillar('language_nattanan').GetName] #italic Chan Fei Teib Tansit Kon Crod#!, что означает #italic Проклятие Гнева Богов-Близнецов#!."

 # Amsari Language
 GH_ZENDA_GLOSS: "Означающая «Пророчество», [gh_zenda|E] является книгой божественных откровений в заоранских верованиях."
 GH_SAZAN_MAHNDAZI_GLOSS: "«Сазан» (означающее «провозглашенное») и «Мандази» (означающее «добродетели»), часто переводимое как «Свидетельство добродетелей». [gh_sazan_mahndazi|E] — священная книга нравственных наставлений и ритуалов в заоранских верованиях."
 GH_UNIJ_KAHDERZ_GLOSS: "Означающий «Дом Просвещения», Унидж-е Кахдерз является главным центром науки и просвещения в [amsar|E]."
 GH_ARSIN_ZAH_NUMAK_GLOSS: "Арсин-За Нумак, означающий «Запретная Клятва» на амсарийском языке, относится к клятве, наложенной на канамсара Ашахета в конце VII века. Приводимая в действие через Стену Стенаний — чары, созданные сирхадами, — она иссушала души любого амсарийца, носящего оружие, который пытался перейти на земли варденитов. На протяжении трех веков Нумак оставался нерушимым, пока канамсар Аушедар с помощью своих фразан-магов не разрушил чары и не повел свои войска на земли варденитов впервые за долгое время."
 GH_WUJADIH_GLOSS: "Вуджадих — амсарийский термин, используемый для обозначения различных кабал [sirhad|E], заимствованный и derived из более старой местной формы «Вуджахида», когда-то бывшей обычным словом для описания кабал по всему [Glossary('#G_light Эрд-Лахдиру#!','GH_ERD_LAKHDIR_GLOSS')]."
 GH_ERD_LAKHDIR_GLOSS: "Означающий «Зеленая/Цветущая Территория» на староталитском языке, Эрд Лахдир был названием побережья, позже ставшего известным как Побережье Айяр, до миграции начала VIII века. Хотя сегодня этот термин менее популярен, он все еще время от времени используется."
 GH_QHESH_ILAHIA_GLOSS: "Термин, используемый тиссаенами для обозначения своего региона в [amsar|E]."

 # Kathunian language
 GH_CEOVBAISE_GLOSS: "От [GetCulturePillar('language_easterner').GetName] #italic Ceov Báise#!, что означает #italic [Concept('the_fog','Туман')|E]#!."
 GH_NOLAN_GLOSS: "Упоминается как [naklan_the_golden|E] на [GetCulturePillar('language_easterner').GetName] [language|E]."
 GH_YUYDU_GLOSS: "Юйду — новое название, данное [GetBuilding('02_dawang_tarmak').GetName] катунским правителем. Оно отражает долгосрочные надежды правящей династии Чинлинь на свое правление."
 GH_HIGH_WALL_GLOSS: "В катунском обществе специализированные города, построенные для определенной цели, называются Высокими Стенами."

 #Sarradonian Language
 GH_NHAL_SARAAT_GLOSS: "#bold Нхал-Сараат#! — термин, используемый в значении «море», буквально переводимый как «озеро без конца». Его точное происхождение неизвестно, но, похоже, он возник в период [Concept('marmaladid_invasions', 'Великого Таррафента')], будучи придуман теми, кто впервые увидел Море Империй. Термин быстро распространился среди кочевых племен пустыни."

 GH_TONNM_ONGOT_GLOSS: "#bold Тённм Энгот#! — это [GetCulturePillar('language_vhanavid').GetName] вариант колргийского [Glossary('Тэнмел Энггуд','GH_TANMEL_ONGGUD_GLOSS')], который стал использоваться только для описания бродячих мистиков или деревенских [magi|E]."
 GH_TANMEL_ONGGUD_GLOSS: "#bold Тэнмел Энггуд#! (буквально означает «Бродячая старая душа» на высоком среднеколргийском [language|E]) — титул, даваемый странствующим древним духам (и изредка людям великой мудрости и добродетели), которые безвозмездно делятся своими знаниями и тайнами в обмен на ритуальное гостеприимство."

 SURIYA_YA_TARMYU_GLOSS: "#bold Сурия я Тармю#! означает «Закон Тармю» на уабадинском языке."
 SURIYANGOWE_GLOSS: "#bold Суриянгове#! означает «Древний закон» на уабадинском языке."
 GH_HUYEN_YAT_GLOSS: "#bold Хуен Ят#! (означающий «Кровавый пир») относится к событиям, привевшим к началу [age_of_the_warring_cities|E]."
 GH_CUICHON_GLOSS: "#bold Куйчон#! означает «склониться в покорности»."
 GH_HOYAK_GLOSS: "#bold Хояк#! означает «мирный договор»."

 GH_SUNAD_RUU_GOLOII_GLOSS: "#bold Сунад Руу Гёлоии#! — общее название множества ольтенских [Concept('magic_type','Магических традиций')|E], переводимое с высокого среднеколргийского [language|E] как «Голос духа» или «Песнь духа»."
 GH_ILTEGECH_GLOSS: "#bold Ильтегеч#! (во множественном числе #bold Ильтегечи#!) — традиционное ольтенское название [magi|E], практикующего [Glossary('Сунад Руу Гёлоии','GH_SUNAD_RUU_GOLOII_GLOSS')], переводимое с высокого среднеколргийского [language|E] как «Говорящий»."