 # Sarminian Language
 GH_ANOHELIS_GLOSS: "#bold Анохелис#! (в единственном числе — #bold Анохела#!) на языке «[GetCulturePillar('language_sarminian').GetName]» означает «отмеченные»."
 GH_BOCZOJ_GLOSS: "#bold Бочой#! на языке «[GetCulturePillar('language_sarminian').GetName]» означает как «регент», так и «военачальник»."

 # Aversarian Language
 GH_PRATOGONOI_GLOSS: "#bold Пратогонои#! на языке «[GetCulturePillar('language_aversarian').GetName]» означает «первые люди»."
 GH_APOKIAKAS_GLOSS: "#bold Апокиакас#! на [Concept('aversaria','аверсарианском')|E] языке означает «колонисты»."
 GH_SKORIKIAKAS_GLOSS: "#bold Скорикиакас#! на [Concept('aversaria','аверсарианском')|E] языке означает «колонисты-черви»."
 GH_SKOLIX_GLOSS: "Название #bold Сколикс#! происходит от [Concept('aversaria','аверсарианского')|E] слова «червь» и прежде всего употребляется на западе Империи как оскорбительное обозначение [Concept('mutations','мутантов')|E]."
 GH_ETRANDANEXI_GLOSS: "#bold Этранданекси#! — искажённая на [Concept('aversaria','аверсарианский')|E] лад форма [Concept('chevalie','шевальенского')|E] слова «чужеземец». После [marcher_aversarian_wars|E] так обычно называли многочисленную общину шевальено-аверсарианцев в Калатипсоми."
 GH_AAUTOKRATA_GLOSS: "#bold Аавтократия#! на [Concept('aversaria','аверсарианском')|E] языке приблизительно означает «держава» или «владение». Это не просто синоним империи: слово несёт божественный смысл и обозначает нечто стоящее выше любого «смертного» царства. В аверсарианской историографии единственными «истинными» аавтократиями считаются [first_empire|E] и Вторая — держава «[GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]»."
 GH_ENMEXOT_GLOSS: "#bold Энмексот#! — «стоящий посередине» или, в зависимости от диалекта, «находящийся на полпути» — традиционное [Concept('aversaria','аверсарианское')|E] название жителей Империи, не принадлежавших ни к сословию граждан, ни к сословию [Concept('aversarian_slavery','рабов')|E]. Имперские граждане обладали множеством прав и привилегий, рабы были почти полностью их лишены, а большинство населения занимало промежуточное положение. Права и статус таких людей в [Glossary('#G_light Аавтократии#!', 'GH_AAUTOKRATA_GLOSS')] сильно различались, однако все они находились между рабами и гражданами в сословной иерархии. [Glossary('#G_light Аниксионкроитропикс#!', 'GH_ANIXSIONTHROPIX_GLOSS')] — родственные народы — обычно занимали высшее место среди этих сословий, превосходя богатством и престижем даже многих граждан низших разрядов." # From 'en mésō', Hellenic Greek for "in the middle" or "in the midst"
 GH_ANIXSIONTHROPIX_GLOSS: "#bold Аниксионкроитропикс#!, буквально «народы-племянники», — [Concept('aversaria','аверсарианская')|E] калька понятия «родственный народ». Аверсарианское слово «племянник» образовано как уменьшительная форма слова «родич», поэтому буквальное название намеренно звучит уничижительно и подчёркивает подчинение этих народов старшей аверсарианской культуре.\n\nУ термина нет глубоких культурных корней: его ввели власти державы «[GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]», чтобы дать богословское обоснование необычному правовому положению [marchers|E], установленному после [marcher_aversarian_wars|E] в рамках [dielecendian_compromise|E]. В отличие от [Concept('aversarian_slavery','рабов крови')|E], они считались обладателями души, но не людьми, а потому и не гражданами. Со временем название распространилось на многие другие группы [Glossary('#G_light энмексотов#!', 'GH_ENMEXOT_GLOSS')] в [Glossary('#G_light Аавтократии#!', 'GH_AAUTOKRATA_GLOSS')], в том числе на ольтенов, [Concept('videro_cnavaius','ломониоси')|E], катунов и другие народы." # From 'ánthropoi-mikroí-xadélfes', straight Greek translation for 'little-cousin-people' - the Aversarian word for nephew is a diminiuitive version of cousin, and while it would be more 'correct' for the word to be Ánixsiónthropix, the Aversarians technically call the cousin-races 'nephew-races' as a pejorative. AKA, they acknowledge them as 'cousins', but are still explicitly placing them as lesser than a 'real' cousin, and implying the position of the Aversarian culture as the senior. This is all probably very biting and derisive for Aversarians who can feel safely superior while they starve to death and have their shit stolen by the sigma Marchers and Olteni who could give less of a shit.

 # Sunakari Language
 GH_IUR_VOL_RANNU_GLOSS: "#bold Иур вол Ранну#! на древнесунакарском языке означает «закон конфликтов»."
 GH_KAZVOSK_GLOSS: "#bold Казвоск#! на архаическом сунакарском языке означает «город гордости»."
 GH_GISHVOSK_GLOSS: "#bold Гишвоск#! — давно исчезнувший древний город-дворец народа «[GetCulturePillar('heritage_kherkeloi').GetName]». На архаическом диалекте сунакарского языка его название означает «город знамений»."
 GH_ARMUT_YAN_GLOSS: "#bold Армут Ян#! на латто-сунакарском креольском языке означает «путь меча»."
 GH_OS_KINJER_GLOSS: "#bold Ос Кинджер#! на джа'ракмарском диалекте сунакарского языка означает «последнее испытание»."
 GH_ZEKVOT_GLOSS: "#bold Зеквот#! — уничижительное слово неизвестного происхождения из языка «[GetCulturePillar('language_aversarian').GetName]», которым называли зелкаванских рабов в городе [GetTitleByKey('c_orkattar').GetBaseNameNoTier]. К XI веку так стали называть любого зелкаванца, живущего в энтрепексатских городах области [GetTitleByKey('d_serbar').GetBaseNameNoTier]."

 # Kikarsagi Language
 GH_TELIGONOIAR_GLOSS: "#bold Телигонойар#! — заимствование в языке «[GetCulturePillar('language_sycharceg').GetName]» из языка «[GetCulturePillar('language_aversarian').GetName]». Оно происходит от слова #bold Телигонои#!, означающего «последние люди»."
 GH_ARDARA_GLOSS: "#bold Ардара#! на древнекикарсагском языке в широком смысле означает «честь», а точнее — «праведность, поддерживающая душу»."

 # Nattanan Language
 GH_NALMICN_QUHA_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Налмикн Куха#! означает #italic «край троп»#!."
 GH_SUGUSULEAA_SUGUKYA_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Сугусулеа Сугукья#! означает #italic «пастушьи холмы»#!."
 GH_NAT_KAN_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Нат Кан#! означает #italic «источники духов»#!."
 GH_AKKHAR_FRECHA_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Акхар Фреча#! означает #italic «король смерти»#!."
 GH_SOGO_TOM_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Сого Том#! означает #italic «крепкий редут»#!."
 GH_CHAN_JERNIEM_SULEAAN_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Чан Йернейм Сулеан#! означает #italic «охотники Йернейма»#!."
 GH_KORLE_LEHTOR_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Корле Лехтор#! означает #italic «огненная кузница»#!."
 GH_KORLO_RUPAN_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Корло Рупан#! означает #italic «огненный голем»#! или #italic «огненная статуя»#!."
 GH_LEH_RUPAN_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Лех Рупан#! означает #italic «металлический голем»#! или #italic «металлическая статуя»#!."
 GH_ADHIT_TRA_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Адхит Тра#! означает #italic «покой солнца»#!."
 GH_MOH_NALMICN_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Мох Налмикн#! означает #italic «туманные тропы»#!."
 GH_SOGO_JERN_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Сого Джерн#! означает #italic «сильные звери»#!."
 GH_KUAM_HULLO_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Куам Хулло#! означает #italic «перевёрнутые джунгли»#!."
 GH_BIN_NALMICAA_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Бин Налмика#! означает #italic «гигантский ленивец»#!, а буквально — #italic «гигантские путники дурной тропы»#!."
 GH_NATHANALMIC_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Натаналмик#! означает #italic «срединный путь»#!."
 GH_KATHARNALMIC_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Катарналмик#! означает #italic «каменистый путь»#!."
 GH_GOTHARNALMIC_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Готарналмик#! означает #italic «высокий путь»#!."
 GH_CARLEH_SOGOTOM_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Карлех Соготом#! означает #italic «железная крепость»#!."
 GH_POR_CHAN_KAENGA_VAG_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Пор Чан Каэнга Ваг#! означает #italic «дом звёздного цветка»#!."
 #GH_SIDEKOR_TUGHN_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Сидекор Тугн#! означает #italic «багряные равнины»#!."

 GH_CHAN_FEI_TEIB_TANSIT_KON_CROD_GLOSS: "На языке «[GetCulturePillar('language_nattanan').GetName]» #italic Чан Фэй Тэйб Тансит Кон Крод#! означает #italic «проклятие гнева богов-близнецов»#!."

 # Amsari Language
 GH_ZENDA_GLOSS: "Название [Concept('gh_zenda','Зенда')|E] означает «пророчество». Это книга божественных откровений в заоранской вере."
 GH_SAZAN_MAHNDAZI_GLOSS: "Сазан означает «то, что объявлено», а Махндази — «добродетели», поэтому название часто переводят как «Свидетельство о добродетелях». [Concept('gh_sazan_mahndazi','Сазан-э Махндази')|E] — священная книга нравственных наставлений и обрядов в заоранской вере."
 GH_UNIJ_KAHDERZ_GLOSS: "#bold Унидж-э Кахдерз#! означает «дом просвещения». Это главный центр учёности в [Concept('amsar','Амсаре')|E]."
 GH_ARSIN_ZAH_NUMAK_GLOSS: "#bold Арсин-За Нумак#! на амсарском языке означает «клятва, скреплённая проклятием». Так называется клятва, навязанная Канамсару Ашахету в конце VII века. Её поддерживала Плачущая стена — созданное Сирхадом заклятие, которое высасывало душу любого вооружённого амсара, пытавшегося перейти на земли варденитов. Три столетия Нумак оставался нерушимым, пока Канамсар Аушедар при помощи своих фразанских магов не разрушил чары и впервые не повёл войска в земли варденитов."
 GH_WUJADIH_GLOSS: "#bold Вуджадих#! — амсарское название различных кабал [Concept('sirhad','Сирхада')|E]. Оно происходит от более древней местной формы «Вуджахида», которой когда-то называли подобные кабалы по всему [Glossary('#G_light Эрд Лахдиру#!','GH_ERD_LAKHDIR_GLOSS')]."
 GH_ERD_LAKHDIR_GLOSS: "#bold Эрд Лахдир#! на древнеталитском языке означает «зелёный край». До переселения начала VIII века так называли побережье, позднее ставшее известным как Айярское. Сейчас этот термин встречается реже, но ещё не вышел из употребления."
 GH_QHESH_ILAHIA_GLOSS: "#bold Кеш Илахия#! — название, которым тиссаи обозначают свою область в [Concept('amsar','Амсаре')|E]."


# Kathunian language
 GH_CEOVBAISE_GLOSS: "На языке «[GetCulturePillar('language_easterner').GetName]» #italic Кеов Байсе#! означает [Concept('the_fog','Туман')|E]."
 GH_NOLAN_GLOSS: "#bold Нолан#! на [Concept('language','языке')|E] «[GetCulturePillar('language_easterner').GetName]» известен как [naklan_the_golden|E]."
 GH_YUYDU_GLOSS: "#bold Юйду#! — новое имя, которое катунский правитель дал сооружению «[GetBuilding('02_dawang_tarmak').GetName]». Оно выражает надежду царского дома Чинлин на долгое правление."
 GH_HIGH_WALL_GLOSS: "#bold Высокая стена#! — так в катунском обществе называют город, построенный для определённой цели."
 #GH_OVERTHROW_THE_MANDATE_OF_HEAVEN: "In the society of Kathuni, this term is generally used to describe the process by which the First of Dragon overthrew the theocratic rule of [kathun|E] and established Kathun-Kai, interpreting the actions of Yao Ren Cai as a righteous act aligned with the popular will rather than a rebellion. After [Concept('frodbrokna','Tianqing')|E], it was further employed by Xin Xue to legitimize the overthrow of the old systems and the establishment of a new order of universal harmony." TBD: especially the term "Mandate of Heaven"

 #Sarradonian Language
 GH_NHAL_SARAAT_GLOSS: "#bold Нхал-Сараат#! — слово со значением «море», которое буквально переводится как «озеро без конца». Его точное происхождение неизвестно, но, по всей видимости, оно возникло во времена [Concept('marmaladid_invasions','Великого Таррафента')|E] среди тех, кто впервые увидел Море империй. Название быстро распространилось среди кочевых племён пустыни."

 GH_TONNM_ONGOT_GLOSS: "#bold Тённм Энгот#! — вариант кольргийского названия [Glossary('Тэнмель Энггуд','GH_TANMEL_ONGGUD_GLOSS')] в языке «[GetCulturePillar('language_vhanavid').GetName]». Со временем так стали называть только странствующих мистиков и бродячих [Concept('magi','магов')|E]."
 GH_TANMEL_ONGGUD_GLOSS: "#bold Тэнмель Энггуд#! на средневерхнекольргийском [Concept('language','языке')|E] буквально означает «странствующая старая душа». Этот титул дают скитающимся древним духам, а изредка — людям великой мудрости и добродетели, которые свободно делятся знаниями и тайнами в обмен на обрядовое гостеприимство."

 SURIYA_YA_TARMYU_GLOSS: "#bold Сурия я Тармью#! на оувабадинском языке означает «закон Тармью»."
 SURIYANGOWE_GLOSS: "#bold Суриянгове#! на оувабадинском языке означает «древний закон»."
 GH_HUYEN_YAT_GLOSS: "Название #bold Хюэн Ят#! переводится как «кровавый пир» и относится к событиям, которые привели к началу [age_of_the_warring_cities|E]."
 GH_CUICHON_GLOSS: "#bold Куйчон#! означает «склониться в знак покорности»."
 GH_HOYAK_GLOSS: "#bold Хояк#! означает «мирный договор»."

 GH_SUNAD_RUU_GOLOII_GLOSS: "#bold Сунад Руу Гёлоий#! — общее название множества ольтенских [Concept('magic_type','магических традиций')|E]. Со средневерхнекольргийского [Concept('language','языка')|E] его переводят как «голос духа» или «песнь духа»."
 GH_ILTEGECH_GLOSS: "#bold Илтегеч#! (во множественном числе — #bold Илтегечед#!) — традиционное ольтенское название [Concept('magi','мага')|E], практикующего [Glossary('Сунад Руу Гёлоий','GH_SUNAD_RUU_GOLOII_GLOSS')]. Со средневерхнекольргийского [Concept('language','языка')|E] оно переводится как «говорящий»."