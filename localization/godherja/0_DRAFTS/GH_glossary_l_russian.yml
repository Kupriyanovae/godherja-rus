 # Aversarian Language
 GH_PRATOGONOI_GLOSS: "From [GetCulturePillar('language_aversarian').GetName] #bold Prātogonoi#!, meaning 'First Men'."
 GH_APOKIAKAS_GLOSS: "#bold Apokiakas#! means 'Colonials' in the [Concept('aversaria','Aversarian')|E] language."
 GH_SKORIKIAKAS_GLOSS: "#bold Skorikiakas#! means 'Worm Colonials' in the [Concept('aversaria','Aversarian')|E] language."
 GH_SKOLIX_GLOSS: "Taken from the [Concept('aversaria','Aversarian')|E] word for 'worm', #bold Skolix#! is a primarily Western Imperial slur used for [Concept('mutations','Mutants')|E]."
 GH_ETRANDANEXI_GLOSS: "#bold Étrandanexi#! is an [Concept('aversaria','Aversarianized')|E] bastardization of the [Concept('chevalie','Chevalean')|E] word for 'outlander', normally referring to the prominent community Chevalo-Aversarian in Kalathipsomi after the [marcher_aversarian_wars|E]."
 GH_AAUTOKRATA_GLOSS: "#bold Aautokrata#! roughly translates to 'imperium' or 'realm' in the [Concept('aversaria','Aversarian')|E] language. It is not directly synonymous with empire, the word having divine connotations and a position above any 'mortal' realm. The [first_empire|E] and the Second — the [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] — are historically considered the only 'true' Aautokratas in Aversarian historiography."
 GH_ENMEXOT_GLOSS: "#bold Enméxot#!, 'one in the midst' or 'one who is halfway' depending on the dialect, is the traditional [Concept('aversaria','Aversarian')|E] term for residents of the Empire who were not members of a Citizen or [Concept('aversarian_slavery', 'Slave')|E] caste. While Imperial citizens were known to be festooned with a great degree of rights and privileges and slaves the opposite, the majority of the population existed in a middle-ground, their rights and status in the [Glossary( '#G_light Aautokrata#!', 'GH_AAUTOKRATA_GLOSS' )] varying wildly and their many groups generally consisting of the middle of the caste-hierarchy between the slaves and the citizenry. The [Glossary( '#G_light Ánixsiónkroithropix#!', 'GH_ANIXSIONTHROPIX_GLOSS' )] cousin races were, generally, the highest ranked of these castes — above even many lower citizen castes in prestige and wealth." # From 'en mésō', Hellenic Greek for "in the middle" or "in the midst"
 GH_ANIXSIONTHROPIX_GLOSS: "#bold Ánixsiónkroithropix#!, literally rendered 'Nephew-Peoples', is an [Concept('aversaria','Aversarian')|E] calque for the concept of a 'Cousin Race'. The term for 'Nephew' in Aversarian is a diminiuitive form of 'Cousin', and the literal translation of the word in the language is meant to be a humilific for the groups it describes, implying their subordination to the more senior Aversarian culture.\n\nThe term does not have strong cultural roots, instead being created by the [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] to give theological justification to the strange legal status of [marchers|E] established at the end of the [marcher_aversarian_wars|E] in the [dielecendian_compromise|E] — possessed of souls unlike the [Concept('aversarian_slavery', 'Slaves of the Blood')|E], but not humans themselves (and thus not citizens). The term would eventually grow to encompass many other [Glossary( '#G_light Enméxots#!', 'GH_ENMEXOT_GLOSS' )] within the [Glossary( '#G_light Aautokrata#!', 'GH_AAUTOKRATA_GLOSS' )], including the Ölteni, [Concept('videro_cnavaius','Lomoniosi')|E], Kathuni, and others." # From 'ánthropoi-mikroí-xadélfes', straight Greek translation for 'little-cousin-people' - the Aversarian word for nephew is a diminiuitive version of cousin, and while it would be more 'correct' for the word to be Ánixsiónthropix, the Aversarians technically call the cousin-races 'nephew-races' as a pejorative. AKA, they acknowledge them as 'cousins', but are still explicitly placing them as lesser than a 'real' cousin, and implying the position of the Aversarian culture as the senior. This is all probably very biting and derisive for Aversarians who can feel safely superior while they starve to death and have their shit stolen by the sigma Marchers and Olteni who could give less of a shit.

 # Sunakari Language
 GH_IUR_VOL_RANNU_GLOSS: "#bold Iur vol Rannu#! means 'the Law of Conflicts' in Old Sunakari."
 GH_KAZVOSK_GLOSS: "#bold Kazvosk#! translates as 'the City of Pride' in an archaic version of the Sunakari language."
 GH_GISHVOSK_GLOSS: "#bold Gishvosk#! is a long-lost ancient [GetCulturePillar('heritage_kherkeloi').GetName] palace-city, whose name means 'the City of Omens' in an archaic dialect of the Sunakari language."
 GH_ARMUT_YAN_GLOSS: "#bold Armut Yan#! means 'Sword Path' in the Latto-Sunakari creole language."
 GH_OS_KINJER_GLOSS: "#bold Os Kinjer#! means 'the Last Test' in the Ja'Rakmari dialect of the Sunakari language."
 GH_ZEKVOT_GLOSS: "#bold Zekvot#!, etymology unknown, was a derogatory [GetCulturePillar('language_aversarian').GetName] term for the Zelkavani slaves in the city of [GetTitleByKey('c_orkattar').GetBaseNameNoTier]. By the 11th century it had become a term for any Zelkavani living in the Entrepexatic cities of [GetTitleByKey('d_serbar').GetBaseNameNoTier]."

 # Kikarsagi Language
 GH_TELIGONOIAR_GLOSS: "#bold Teligonoiar#! is a [GetCulturePillar('language_sycharceg').GetName] loanword borrowed from the [GetCulturePillar('language_aversarian').GetName] #bold Teligonoi#!, meaning 'Last Men'."
 GH_ARDARA_GLOSS: "#bold Ardara#! can be broadly translated as 'honor' in the Old Kikarsag language, but more precisely means 'the righteousness that sustains the soul'."

 # Nattanan Language
 GH_NALMICN_QUHA_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Налмикн Куха#!, означает #italic Край Троп#!."
 GH_SUGUSULEAA_SUGUKYA_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Сугусулеаа Сугукья#!, означает #italic Холмы Пастухов#!."
 GH_NAT_KAN_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Нат Кан#!, означает #italic Источники Духов#!."
 GH_AKKHAR_FRECHA_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Акхар Фреча#!, означает #italic Король Смерти#!."
 GH_SOGO_TOM_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Сого Том#!, означает #italic Крепкий Редут#!."
 GH_CHAN_JERNIEM_SULEAAN_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Чан Йерниэм Сулеаан#!, означает #italic Охотники Йерниэма#!."
 GH_KORLE_LEHTOR_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Корле Лехтор#!, означает #italic Пылающая Кузница#!."
 GH_KORLO_RUPAN_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Корло Рупан#!, означает #italic Огненный Голем или Огненная Статуя#!."
 GH_LEH_RUPAN_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Лех Рупан#!, означает #italic Металлический Голем или Металлическая Статуя#!."
 GH_ADHIT_TRA_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Адхит Тра#!, означает #italic Отдых Солнца#!."
 GH_MOH_NALMICN_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Мох Налмикн#!, означает #italic Туманые Тропы#!."
 GH_SOGO_JERN_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Сого Йерн#!, означает #italic Сильные Звери#!."
 GH_KUAM_HULLO_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Куам Хулло#!, означает #italic Перевернутые Джунгли#!."
 GH_BIN_NALMICAA_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Бин Налмикаа#!, означает #italic Гигантский Ленивец#! или буквально #italic Гигантские Плохие Следопыты#!."
 GH_NATHANALMIC_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Натаналмик#!, означает #italic Срединный Путь#!."
 GH_KATHARNALMIC_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Катарналмик#!, означает #italic Каменистый Путь#!."
 GH_GOTHARNALMIC_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Готарналмик#!, означает #italic Высокий Путь#!."
 GH_CARLEH_SOGOTOM_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Карлех Соготом#!, означает #italic Железная Крепость#!."
 GH_POR_CHAN_KAENGA_VAG_GLOSS: "From [GetCulturePillar('language_nattanan').GetName] #italic Por Chan Kaenga Vag#!, meaning #italic Star Flower's Home#!."
 #GH_SIDEKOR_TUGHN_GLOSS: "From [GetCulturePillar('language_nattanan').GetName] #italic Sidekor Tughn#!, meaning #italic Crimson Plains#!."

 GH_CHAN_FEI_TEIB_TANSIT_KON_CROD_GLOSS: "Из [GetCulturePillar('language_nattanan').GetName] языка #italic Чан Фэй Тэйб Тансит Кон Крод#!, означает #italic Гневное Проклятие Богов-Близнецов#!."

 # Amsari Language
 GH_ZENDA_GLOSS: "Означая «Пророчество», [Concept('gh_zenda','зенда')|E] — книга божественных откровений в заоранийских верованиях."
 GH_SAZAN_MAHNDAZI_GLOSS: "Сазан, означающее «то, что объявлено», и Махандази, означающее «добродетели», часто переводится как «Свидетельство Добродетелей». [Concept('gh_sazan_mahndazi','Сазан-и-Махандази')|E] — священная книга нравственных наставлений и ритуалов в заоранийских верованиях."
 GH_UNIJ_KAHDERZ_GLOSS: "Означая «Дом Просвещения», Унидж-э Кадерз — главный центр обучения в [Concept('amsar','Амсаре')|E]."
 GH_ARSIN_ZAH_NUMAK_GLOSS: "Арсин-За Нумак, означающее «Клятва Связанного Проклятия» на амсарском, относится к клятве, наложенной на Канамсара Ашахета в конце VII века. Поддерживаемая Стенаяющей Стеной — заклятием, созданным Сирхадом, она высасывала души любых амсари, вооруженных и пытающихся пересечь земли варденитов. Три столетия Нумак оставался нерушимым, пока Канамсар Аушедар с помощью своих фрейзан-магов не разрушил заклятие и впервые не повел свои войска на земли варденитов."
 GH_WUJADIH_GLOSS: "Wujādih is the Amsari term used to refer to the various [sirhad|E] cabals, borrowed and derived from an older local form, Wujāhida, once a common word to describe the cabals across [Glossary('#G_light Erd Lakhdir#!,'GH_ERD_LAKHDIR_GLOSS)]."
 GH_ERD_LAKHDIR_GLOSS: "Meaning 'The Green/Verdant Territory' in Old Thalite, Erd Lakhdir was the name given to the coast later known as the Ayyar Coast, prior to the migration of the early 8th century. Though less popular today, the term is still occasionally used."
 GH_QHESH_ILAHIA_GLOSS: "Term used by the thyssaen to refer to their region in [amsar|E]."


# Kathunian language
 GH_CEOVBAISE_GLOSS: "From [GetCulturePillar('language_easterner').GetName] #italic Ceov Báise#!, meaning #italic [Concept('the_fog','The Fog')|E]#!."
 GH_NOLAN_GLOSS: "It referred to as [naklan_the_golden|E] in the [GetCulturePillar('language_easterner').GetName] [language|E]."
 GH_YUYDU_GLOSS: "Yuydu is a new name given to [GetBuilding('02_dawang_tarmak').GetName] by the kathuni ruler, It represents the long-term expectation of the chinlin royal family for their rule."
 GH_HIGH_WALL_GLOSS: "In Kathuni society, those specialized cities built for a specific purpose are called High Wall."
 #GH_OVERTHROW_THE_MANDATE_OF_HEAVEN: "In the society of Kathuni, this term is generally used to describe the process by which the First of Dragon overthrew the theocratic rule of [kathun|E] and established Kathun-Kai, interpreting the actions of Yao Ren Cai as a righteous act aligned with the popular will rather than a rebellion. After [Concept('frodbrokna','Tianqing')|E], it was further employed by Xin Xue to legitimize the overthrow of the old systems and the establishment of a new order of universal harmony." TBD: especially the term "Mandate of Heaven"

 #Sarradonian Language
 GH_NHAL_SARAAT_GLOSS: "#bold Nhal-Saraat#!, a term used to mean 'sea', translates literally as 'lake with no end'. Its exact origin is unknown, but it seems to have originated during the [Concept('marmaladid_invasions', 'Great Tarrafent')|E] period, coined by those who first laid eyes upon the Sea of Empires. The term quickly spread among the desert nomad tribes."

 GH_TONNM_ONGOT_GLOSS: "#bold Tönnm Öngot#! is the [GetCulturePillar('language_vhanavid').GetName] variation of the Kolrgiian [Glossary('Tänmel Önggud','GH_TANMEL_ONGGUD_GLOSS')], having come to only be used to describe wandering mystics or hedge [magi|E]."
 GH_TANMEL_ONGGUD_GLOSS: "#bold Tänmel Önggud#!, literally meaning 'Wandering Old Soul' in the High Middle Kolrgiian [language|E], is a title given to roaming elder spirits (and rarely humans of great wisdom and virtue) who freely share their knowledge and secrets in exchange for ritualistic hospitality."

 SURIYA_YA_TARMYU_GLOSS: "#bold Suriya ya Tarmyu#!, means 'Law of Tarmyu' in Ouwabadin"
 SURIYANGOWE_GLOSS: "#bold Suriyangowe#!, means 'Ancient Law' in Ouwabadin"
 GH_HUYEN_YAT_GLOSS: "#bold Huyên Yát#!, meaning Blood-Feast refers to the events leading to the beginning of the [age_of_the_warring_cities|E]"
 GH_CUICHON_GLOSS: "#bold Cuichon#!, meaning 'to bow in submission'"
 GH_HOYAK_GLOSS: "#bold Hoyak#!, meaning 'peace treaty'"

 GH_SUNAD_RUU_GOLOII_GLOSS: "#bold Sunäd Ruu Göloii#! is the general name of a host of Ölteni [Concept('magic_type','Magical Traditions')|E], translated interchangeably from the High Middle Kolrgiian [language|E] as either 'Spiritvoice' or 'Song of the Spirit'."
 GH_ILTEGECH_GLOSS: "#bold Iltegech#! (plural #bold Iltegeched#!) is the traditional Ölteni name for a [magi|E] practitioner of [Glossary('Sunäd Ruu Göloii','GH_SUNAD_RUU_GOLOII_GLOSS')], translated as 'the Speaker' from the High Middle Kolrgiian [language|E]."