l_russian:
 GH_AAUTOSAXIAS_GLOSS: "Legio XIII #bold «Аавтосакиас»#!, что означает «Тень Империи», был высокоспециализированным легионом, призванным вершить правосудие [Concept('aautokratir','аавтократа')|E] тайными методами."
 GH_BAND_OF_THREE_GLOSS: "#bold Банда Троих#! — три главных чиновника, управлявших военным трибуналом [Concept('aautokratir','аавтократа')|E] $aauto_eramos_link$ Эрамоса#!."
 GH_BOTAI_GLOSS: "#bold Бётай#! — воинские ложи кикарсагов, чьи задачи разнятся от племени к племени."
 GH_CAEMANSI_GLOSS: "#bold Каэманси#! означает «Кровавые гончие» — это прозвище они получили за кровавые зверства, оставляемые после их частых набегов."
 GH_CHAN_KYAWKORLACU_GLOSS: "#bold Чан Кьяукорлаку#!, что переводится как «Хребет Корлаку», — наттананское название северо-западных Хараданских гор."
 GH_DAARAPUTALNI_GLOSS: "#bold Даара'путальни#! — синдаарское искусство кукольного театра, где особые куклы «Таальни» создаются к важным событиям (свадьбам, коронациям, освященным рождениям) для будущего воссоздания этих торжеств."
 GH_DIBRABAL_GLOSS: "#bold Дибрабал#! — изысканный рыбный соус из различных морепродуктов и масла каменистых олив (редкого вида, встречающегося только на Диоренских островах). Кулинары даже в далекой Каширии восхваляют его уникальный вкус, раскрывающийся по мере выдержки и способный ублажить самых искушенных гурманов."
 GH_DOYNATEKA_SARYATTI_GLOSS: "#bold Дойнатека Сарьятти#! («Гонка двух холмов») — состязание, в котором слонов с ликами бога Сарвата на спинах сгоняют со склонов холмов."
 GH_JAHAAJI_DAUD_GLOSS: "#bold Джахааджи Д'ауд#! — гонка через Стеклянное море от мыса Селенгай до Инковтары, популярная у саришта и завершающаяся пышным пиром в честь победителей."
 GH_KARTEIMAN_GLOSS: "#bold Картейманы#! — легкие корабли, используемые агуадосийцами для дальних морских плаваний."
 GH_MURARUT_GLOSS: "#bold Мур'ар'ут#! означает «Высокие» на их собственном наречии."
 GH_OATHBOUND_REVOLT_GLOSS: "#bold Мятеж Клятвенников#! — неудавшийся переворот против [Concept('aautokratia','аавтократа')|E] $aauto_theyssia_link$ Тейссии#!, поднят недовольными легонами и чиновниками, служившими при [Concept('aautokratir','аавтократе')|E] $aauto_eramos_link$ Эрамосе#!."
 GH_SIEGA_VORTELSK_GLOSS: "#bold Сиега Вортельск#! («Слуга-Вармастер») — высший воинский чин в Картараддийской армии."
 GH_TYANAN_RUDU_GLOSS: "#bold Тьянан Руду#! — великий сход капитанов дераани, где долгие ночи проходят за пирами и поединками."
 GH_TALZA_GLOSS: "#font:RedactedScriptFont #bold Тальза#! — архаичное лекийское слово для обозначения «славы» без ясного лексического происхождения. Крылья украли его у нее.#! "
 GH_KUZUM_GLOSS: "#bold Кузум#! — хмельной напиток из сброженного кобыльего молока, популярный среди кикарсагов."
 GH_CZUMIJ_GLOSS: "#bold Кумий#! — хмельной напиток из сброженного кобыльего молока и ягод, популярный среди сарминийцев."
 GH_AIRAGAANG_GLOSS: "#bold Айрагаанг#! — хмельной напиток из сброженного кобыльего молока, популярный у хохуудских народов."
 GH_AIRAGAG_GLOSS: "#bold Айрагаг#! — хмельной напиток из смеси сброженного кобыльего молока и кукурузного ликера, популярный у вханавидских народов."
 GH_EIREG_GLOSS: "#bold Эйрег#! — хмельной напиток из сброженного кобыльего (и реже козьего) молока, невероятно популярный у махратийцев."
 GH_TSEGUN_GLOSS: "#bold Цегун#! — крепкий хмельной напиток из глубоко сброженного кобыльего молока, популярный среди хаджиркелов."
 GH_IRRADU_GLOSS: "#bold Ирраду#! — божество с головой козерога, покровитель Иалырии и один из главных богов [GetFaithByKey('astiliak').GetName] [Concept('astilik_gods','пантеона')|E]."
 GH_BRONZE_SOVEREIGN_GLOSS: "#bold Бронзовый Владыка#! — божественная фигура неизвестного происхождения и покровитель Казвоска; согласно повериям, прибыл откуда-то из Северного Айроноя."
 GH_ARUVA_AGAT_GLOSS: "#bold Арува Агат#! переводится как «Божественная Душа» и в религии арувасуэ обычно связывается с духом человека."
 GH_ARUVA_TSERE_GLOSS: "#bold Арува Цере#! означает «Божественное Сердце» и у арувасуэни является однокоренным со словом «Солнце»."
 GH_ARUVA_NILUD_GLOSS: "#bold Арува Нилуд#! переводится как «Божественный Разум» и тесно связано с [Concept('aervalr','Эрвалом')|E] в религиозной философии арувасуэни."
 GH_ASTIL_ELATOS_GLOSS: "#bold Астиль Элатос#! — распространенное астиликское выражение, буквально означающее «К вечной славе»; часто используется для выражения радости, признательности или при прощании."
 GH_NASHANAR_GLOSS: "#bold Нашанар#! Неукротимая Муза — фольклорная и божественная фигура Юго-Восточного Айроноя, ассоциирующаяся с решимостью и искусством. Известна под многими именами у народов на берегах Стеклянного моря, а ее имя на архаичном сунакари буквальнее всего переводится как «Дарующая Дыхание»."
 GH_NUGATORS_GLOSS: "#bold Нугаторы#! — полумифическое поколение правителей раннего [aironoian_bronze_age|E], которые, по преданиям, вышли из морской пены на берегах Моря Империй."
 GH_AAIMPERON_GLOSS: "#bold Ааимперон#! — крупная полосатая ягода с сладкой кроваво-красной мякотью, широко выращиваемая в [western_aironoi_biozone|E] [Concept('aversaria','аверсарианцами')|E]. Завезенный из [sarradon|E] около 400 г. от И.С., этот плод с тех пор подвергся глубокой магической селекции, что увеличило его размер, sweetness и сделало безкосточковым."
 GH_DAAJ_OLIKNII_GLOSS: "#bold $feast_type_tsagaan_sar$#! — традиционный ольтенский праздник, знаменующий воссоединение двух сыновей Ольгон-тена и переводящийся с раннего высокого колргийского как «День [Glossary('Олика','GH_OLIK_GLOSS')]»."
 GH_TAROK_MAHAN_AYRAAL_AM_AYAR_GLOSS: "#bold Тарок Махан Айраал ам'Айяр#! переводится как «Великий [paiza|E] чекан Айяра» на [GetCulturePillar('language_emanhi').GetName] язык, один из нескольких главных административных языков [Concept('otachedian_empire','Отачедской империи')|E]."
 GH_SJARVA_ERAM_AKKARA_GLOSS: "#bold Сьярва Эрам Аккара#! переводится как «Чертог Высшего Неба» с [GetCulturePillar('language_emanhi').GetName] языка, одного из основных административных языков [Concept('otachedian_empire','Отачедской империи')|E]."
 GH_HAYTRATAROK_MAHAN_AYRAAL_GLOSS: "#bold Хайтратарок Махан Айраал#! переводится как «Главный Имперский [paiza|E] чекан» на [GetCulturePillar('language_emanhi').GetName] язык, один из нескольких главных административных языков [Concept('otachedian_empire','Отачедской империи')|E]."
 GH_YANTRA_JVALAKAACH_GLOSS: "#bold Янтра Джвалакаач#! переводится как «Обсидиановая Машина» на [GetCulturePillar('language_emanhi').GetName] язык, один из основных административных языков [Concept('otachedian_empire','Отачедской империи')|E]."
 GH_RISHIRAN_GLOSS: "#bold Риширан#! переводится как «Наместник/Чиновник» на [GetCulturePillar('language_emanhi').GetName] язык, один из нескольких главных административных языков [Concept('otachedian_empire','Отачедской империи')|E]."
 
 GH_ORZOPAJA_GLOSS: "#bold О́рзопайя#! (мн. ч. #bold О́рзопайяд#!) — представительница [GetCulturePillar('heritage_sarminian').GetName] женского воинского и благородного сословия, считающаяся стоящей отдельно от мужчин и женщин. Орзопайяд известны тем, что заплетают волосы в длинные сложные косы, предельная длина которых определяется старшинством, престижем и положением среди равных."
 GH_ZSERHENI_GLOSS: "#bold Жейрхейни#! («Иноземный союзник») — чужеземец, заслуживший признание среди [Glossary('#G_light Орзопайяд#!','GH_ORZOPAJA_GLOSS')] как равный им."
 GH_SARMINIAN_CARDINAL_COLORS: "В [GetCulturePillar('heritage_sarminian').GetName] культуре стороны света связываются с особыми цветами и качествами, которые часто используются в речи для придания глубокого смысла словам и фразам.\n\n$EFFECT_LIST_BULLET$#bold Синий Север#! связан со славой, весной и божественностью\n$EFFECT_LIST_BULLET$#bold Красный Запад#! сопряжен с летом, завоеваниями и пролитой кровью\n$EFFECT_LIST_BULLET$#bold Жёлтый Восток#! символизирует осень и решимость\n$EFFECT_LIST_BULLET$#bold Чёрный Юг#! считается ущербным — трусливым, немощным и зимним"
 GH_ESENGRA_GLOSS: "Народный герой, популярный в низинах Центрального Саррадона. Эсенгра выступает главным героем бесчисленных сказок, наиболее известные из которых описывают свержение одноглазых царей-гигантов полуострова Халкама с помощью хитрости, ума и вспышек жестокого насилия. Кости убитых тиранов он посадил в землю, и из них выросли исполинские саррадонские кедры."

 ##############
 # CHARACTERS #
 ##############
 
 # Non-Human
 OLD_CUBOZOID_GLOSS: "Загадочное, возможно, чисто легендарное невидимое существо, обитающее в лесах Калатипсоми. Его название происходит из языка кланлендеров, где оно известно как «Квадратный Старец», хотя первоначальный смысл этого имени утерян в веках."
 WILDERKING_GLOSS: "Могущественный оборотень и друид, обитавший в лесах Калатипсоми, пока не был сражен искателем приключений сэром Рене «Усатым» в 616 году от И.С."
 FAIRYQUEEN_GLOSS: "Древний могущественный дух, заточенный королем-магом Катануксой в арканное устройство за несколько веков до падения его империи. Темница духа многократно меняла хозяев после смерти владельца, и существо веками давало советы держателям устройства, пока не было уничтожено при неудачной попытке аавтократа Мификса выкачать его силу."
 GH_AAIMPERONUS_GLOSS: "#bold Ааимперонус#! — младший бог из [Concept('aversaria','аверсарианского')|E] пантеона [Concept('aelfir','Первых Людей')|E], связанный с [Glossary('#G_light Ааимперонами#!','GH_AAIMPERON_GLOSS')], свершениями и тщеславием. Традиционно считается подвластным Хатцнуру или Поллидиду."
 GH_KAIGAN_GLOSS: "#bold Кайган#! — второй сын Ольгон-тена и Еру-май, почитаемый ольтенами как прародитель всего человечества. После гибели [Glossary('#G_light Олика#!','GH_OLIK_GLOSS')] от рук их матери, Кайган бежал из родительского дома, надев маску, чтобы навсегда укрыться от подобной участи."
 GH_OLIK_GLOSS: "#bold Олик#! — первенец Ольгон-тена и Еру-май, убитый матерью в приступе ревности. Брат [Glossary('#G_light Кайгана#!','GH_KAIGAN_GLOSS')]; говорят, он восстает из мертвых накануне праздника [Glossary('#G_light $feast_type_tsagaan_sar|q$#!','GH_DAAJ_OLIKNII_GLOSS')] всего на один день в году."
 
 # Historical Rulers & Dynasties: Mikros Kalathipsomi
 TYRANDAX_GLOSS: "Также известный как «Царь-Дракон», #BOL Тирандакс#! был [Concept('aversaria','аверсарианским')|E] драконом, сбежавшим с [war_of_the_thousand_dragons|E] и деспотично правившим пост-катануксианским королевством Фэйгифт более десятилетия, пока не был убит."
 AEDEAN_GLOSS: "Печально известный чародей, действовавший в пост-катануксианском королевстве Фэйгифт в качестве советника зловещего дракона [Glossary( '#G_light Тирандакса#!', 'TYRANDAX_GLOSS' )]."
 CLOTHAR_I_GLOSS: "#BOL Хлотарь I «Драконоборец»#! был шевигадским воеводой, ставшим королем после того, как сразил дракона [Glossary('#G_light Тирандакса#!', 'TYRANDAX_GLOSS')] и положил начало эпохе правления Этрандекси в долине Фэйгифт."
 ALORIC_THE_HAUGHTY_GLOSS: "#BOL Алорик Надменный#! — последний правитель династии Этрандекси, именовавший себя королем Фэйгифта накануне [Concept('aversaria','аверсарианского')|E] завоевания в IV веке. Властолюбивый муж, запомнившийся главным образом стремлением стать Верховным королем Рича, чему помешал Маркомер. Глубоко оскорбленный этим, Алорик отказался помогать Маркомеру в войне и попытался дать отпор аверсарианцам в одиночку — с катастрофическими и смертельными для себя последствиями."
 HANOUET_AND_HANOUIN_GLOSS: "#BOL Ануэ#! и #BOL Ануэн#! — легендарные братья, совместно вырвавшие власть над восточной частью Сердечного леса у разваливавшегося королевства Аловура Волчонка. Повергнув всех врагов, братья поссорились из-за добычи, разделяв новообретенные земли по реке Патос. Рассказы описывают их двадцатилетние попытки сокрушить друг друга, оканчивавшиеся неудачами, пока в итоге оба не были обмануты и лишены корон своим племянником Пейтоном Скользким."
 RED_RICOMER_GLOSS: "#BOL Красный Рикомер#! — фигура туманной природы (возможно, скорее титул, чем один человек), хранящая рощи [GetBuilding('01_nira_yew').GetName]. По легенде, он был шевигадским разбойником, срубившим одно из священных деревьев. Охваченный раскаянием, он поклялся защищать оскверненное место и вырвал себе язык. Веками он карал любого, кто смел нарушать обычаи Тиса Нира, невзирая на знатность. В искусстве стрельбы из лука Рикомеру нет равных.\n\nВо время [Glossary('#G_light Войны Черного Тиса#!', 'WAR_OF_THE_BLACK_YEW_GLOSS')] он служил одним из воевод [Glossary('#G_light Карттуэна Серебряноволосого#!', 'dailennir_kathanouxiac_18_desc')], предводительствуя в походе, разорившем левобережье города Одбрю. Несмотря на поражение фей в войне, Красный Рикомер избежал гибели; говорят, он и по сей день время от времени появляется в защищаемых им землях."

 
 #############
 # LOCATIONS #
 #############
 
 FIDHASIL_TREE_GLOSS: "Исполинский древний бук и место оракула в [GetTitleByKey('k_heartwood').GetBaseNameNoTier]. Разрушен по приказу [Concept('aversaria','аверсарианского')|E] наместника Калатипсоми в VII веке."
 GH_MLIMA_TAA_GLOSS: "Буквально «Гора-Лампа» на [GetCulturePillar('language_kevaali').GetName] языке, #italic Млима'Таа#! — это древний вулкан, известный трещинами и шрамами из светящегося камня, проходящими по его склонам."
 GH_SEIBANTAI_GLOSS: "Буквально «Белый Чертог» на катунском языке."
 USEHHAR_MOUNTAINS_GLOSS: "Горы Усеххар — это обширный хребет суровых и неприступных гор на востоке [Glossary('#G_light Саррадонской пустыни#!','sarradonian_desert_encyclopedia_desc')]. Лишь немногие люди смогли выжить здесь, а центр Усеххара занят могучими вулканами, тарсосами и зазубренными пиками. Вода здесь протекает глубоко под землей в виде великой сети подземных рек, питающих [Glossary('#G_light Кратемезин#!','crater_encyclopedia_desc')] на востоке и [Glossary('Кладбище костей','boneyard_encyclopedia_desc')] дальше на север."
 GH_THE_MAGISTERIUM_GLOSS: "Густой комплекс древних руин в самом центре раскинувшегося Ораисполя. Строения, протянувшиеся вдоль большого горного хребта на юге города, были возведены на возвышающемся пике руин [Concept('aautokratir','аавтократом')|E] $aauto_maklea_link$ Маклеей#! изначально как место проведения [thyaeasrixtorax|E], а затем стали главным местом сбора [Concept('aversaria','имперских')|E] [magi|E] в правление Пафоса и вплоть до основания [mayikrata|E]. К Золотому веку [aversaria|E] он разросся в огромный комплекс академий, библиотек и кварталов высших каст с собственной армией боевых [magi|E] для охраны улиц. [Concept('aautokratir','Аавтократ')|E] $aauto_theyssia_link$ Тейссия#! перестроила большую часть [Concept('prehistory','невероятно древних')|E] руин, на которых стоял комплекс, в соответствии с популярными представлениями имперцев о [first_empire|E]. Магистериум считался магической столицей Этепезеи вплоть до своего уничтожения в ходе [the_vilnian_assault|E|l]."
 MAHARATNA_MAHAL_GLOSS: "Обычно «Дворец Драгоценностей» или «Дворец Самоцветов» по всей Каширии."
 SANAGIRIA_GLOSS: "Называется «Гахарин» у хусаяханов."
 
 OLD_NORTH_GLOSS: "Старый Север — разговорное обозначение земель дальних северных [foglands|E], давно затерянных в тумане, где когда-то поселились многие участники [sjalvolki_migration|E]."
 GH_CHRYSEMVIXA_GLOSS: "#bold Хрисемвикса#! (что означает «Золотой Гребень» на восточных диалектах [Concept('aversaria','аверсарианских')|E] языков) — название горного хребта, возвышающегося над великими пшеничными полями [Glossary('Западного Айроноя','western_aironoi_encyclopedia_desc')] и отделяющего этот регион от остальной части Айроноя на востоке."
 GH_PHALONOX_GLOSS: "#bold Река Фалонокс#! — бывшее [Concept('aversaria','аверсарианское')|E] название реки [Glossary('Эрамасик','GH_ERAMASIC_RIVER_GLOSS')]. Название происходит от слова [Glossary('Фалокс','GH_PHALOX_GLOSS')], как из-за центрального положения реки на [the_continent|E], так и потому, что горные утесы, обрамляющие ее эстуарий, исторически защищали Империю от внутренних территорий континента."
 GH_PHALOX_GLOSS: "#bold Фалокс#! — [Concept('aversaria', 'протоаверсарианское')|E] слово, буквально переводящееся как «ступица колеса». Оно стало названием как традиционного круглого имперского щита, так и боевого построения типа «ступица и спицы» древней имперской армии и [Glossary('Дракарнаксауксилы','GH_DRAKARNAXAUXILA_GLOSS')], предшественников позднейших имперских легионов."
 GH_ERAMASIC_RIVER_GLOSS: "#bold Река Эрамасик#! (изначально [Glossary('Фалонокс','GH_PHALONOX_GLOSS')]) делит исторический регион [Concept('foglands','Картараддия')|E] надвое и общепризнана длиннейшей рекой в мире, особенно с учетом ее тысяч притоков. В 765 г. от И.С. [Concept('aautokratir','Ааутократира')|E] $aauto_theyssia_link$ Тейссия#! переименовала Фалонокс в честь своего предшественника, [Concept('aautokratir','Ааутократира')|E] $aauto_eramos_link$ Эрамоса#!, которого она регулярно называла своим прошлым воплощением."
 GH_PHALONOXONPOLI_GLOSS: "Малкоисийская колония #bold Фалоноксонполь#! берет свое название от первоначального наименования реки Эрамасик — [Glossary('Фалонокс','GH_PHALONOX_GLOSS')]. Основанный в 518 г. от И.С. как первое малкоисийское поселение на землях будущей Картараддии, город был разрушен [Concept('kartharadd','картараддийцами')|E] в 645 г., заново заселен ими в качестве крепости в 698 г., а затем сожжен и снова заселен аверсарианцами в 746 г. от И.С. Со временем он становился одной из многочисленных исторических столиц губернаторства в 967, 1001 и 1143 гг., пока не был окончательно заброшен после семнадцати отдельных разграблений и завоеваний наступающими мигрантами между 1198 и 1246 гг. К 1255 году его руины были полностью поглощены [the_fog|E]."

 ##################
 # HISTORIOGRAPHY #
 ##################

 # Aversarian Organizations
 GH_FIRST_IMPERIAL_COUNCIL_GLOSS: "Первый из многих Имперских советов, иногда упоминаемый в поэмах как «Предательский совет». Он был правящим органом Ораисполя и окрестных земель с момента разграбления города в конце [war_of_the_thousand_dragons|E] в 170 г. от И.С. и вплоть до [hexing_of_oraispol|E] в 243 г. от И.С. и последовавшей [Concept('maklean_terrors','чистки')|E], проведенной [Concept('aautokratir','Ааутократирой')|E] $aauto_maklea_link$ Маклеей#!."
 GH_SIXTH_IMPERIAL_COUNCIL_GLOSS: "#BOL Шестой Имперский совет#! был учрежден в 729 г. от И.С. [Concept('aautokratir','Ааутократиром')|E] $aauto_eramos_link$ Эрамосом#! взамен Пятого Имперского совета (печально известного Совета фанатиков), распущенного Ааутократиром Кефемодом в 618 г. от И.С. Предназначенный для объединения стремительно распадавшейся аристократии в катастрофических последствиях ранних [Concept('kartharadd','Картараддийских войн')|E], совет был использован Эрамосом для получения чрезвычайных полномочий, необходимых для проведения его легендарных Военных реформ под надзором [Glossary('#G_light Отряда Троих#!','GH_BAND_OF_THREE_GLOSS')].\n\nПосле смерти Эрамоса в 756 г. от И.С. Отряд Троих сформировал [Glossary('#G_light Совет Героев#!','GH_COUNCIL_OF_HEROES_GLOSS')] и создал регентский совет с заявленной целью восстановления разоренной Империи. Шестой Имперский совет оспорил это и попытался ограничить легионы и их политическое влияние. Формально обе фракции правили совместно в рамках [Glossary('#G_light Имперского Консилиума#!','GH_IMPERIAL_CONCILIARY')], пока обе не потерпели крах в результате [Glossary('#G_light провала Кровавого Сената#!','GH_BLOOD_SENATE_OF_761_GLOSS')].\n\nСовет поддержал относительно стороннюю фигуру в лице $aauto_theyssia_link$ Ианы Тейссии#!, однако в самом начале ее правления был оттеснен на второй план и быстро подчинен. Все закончилось тем, что совет единогласно — хоть и неохотно — предоставил Тейссии те же чрезвычайные полномочия, которые ранее даровал Ааутократиру Эрамосу в Первой Тейссианской хартии. Это фактически закрепило их в Имперском праве и навсегда положило конец политической независимости совета. Шестой совет оставался органом власти Ааутократиры Тейссии вплоть до своего распуска в начале правления Ааутократира Мификса в 892 г. от И.С."
 GH_COUNCIL_OF_HEROES_GLOSS: "#BOL Совет Героев#! (или Совет Легионов) был де-факто правящим органом [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] в период [legion_regency|E] и раннего Имперского Восстановления вплоть до прихода к власти [Concept('aautokratir','Ааутократиры')|E] $aauto_theyssia_link$ Тейссии#!. Совет правил совместно и в нарастающей оппозиции к [Glossary('#G_light Шестому Имперскому совету#!','GH_SIXTH_IMPERIAL_COUNCIL_GLOSS')] в составе органа, получившего общее название [Glossary('#G_light Имперский Консилиум#!','GH_IMPERIAL_CONCILIARY')].\n\nСовет был создан [Glossary('#G_light Отрядом Троих#!','GH_BAND_OF_THREE_GLOSS')] в ходе фактического законного переворота с использованием различных военных полномочий, которые [Concept('aautokratir','Ааутократир')|E] $aauto_eramos_link$ Эрамос#! получил для победы в [Concept('kartharadd','Картараддийских войнах')|E]. Совет стремился восстановить Империю при поддержке новосформированных и набравших политический вес легионов в противовес аристократии, которую он считал ненадежной и предательской, стремящейся вернуть привилегии, утраченные при Эрамосе. Однако совет увяз во внутренних распрях и скандалах, кульминацией которых стали убийство Эоны Тейссии и легона Рутара Итрикса, а также [Glossary('#G_light провал Кровавого Сената#!','GH_BLOOD_SENATE_OF_761_GLOSS')] в 761 г. от И.С.\n\nСовет Героев пал вместе с бурным возвышением и гибелью Иксона «Манифестанта» от рук Ианы Тейссии, распавшись на несколько крупных фракций, каждая из которых была разгромлена Тейссией в серии стремительных политических ходов и чисток в течение последующего десятилетия. Обе половины Имперского Консилиума были распущены после того, как шесть из девяти оставшихся военачальников Совета Героев официально склонились перед Тейссией во время Примирения, что окончательно закрепило власть Тейссии над Империей и положило конец краткому политическому господству новосозданных легионов."
 GH_IMPERIAL_CONCILIARY: "#BOL Имперский Консилиум#! означает совместное правление [Glossary('#G_light Совета Героев#!','GH_COUNCIL_OF_HEROES_GLOSS')] и [Glossary('#G_light Шестого Имперского совета#!','GH_SIXTH_IMPERIAL_COUNCIL_GLOSS')] над [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] после смерти [Concept('aautokratir','Ааутократира')|E] $aauto_eramos_link$ Эрамоса#! в 756 г. от И.С. В Консилиуме изначально доминировали новосформированные легионы, удержавшие широкие чрезвычайные полномочия после [Concept('kartharadd','Картараддийских войн')|E]. Однако возмущенная аристократия сплотилась вокруг Шестого Имперского совета, что положило начало серии ожесточенных политических конфликтов за контроль над [Glossary('#G_light Ааутократией#!','GH_AAUTOKRATA_GLOSS')] в эпоху [Glossary('#G_light Регентства Легионов#!','GH_LEGION_REGENCY')]. Обе стороны пытались присвоить себе права и привилегии, предназначавшиеся самому ааутократиру, но в итоге лишь завели имперскую политику в тупик и сорвали попытки восстановления страны после [chaos_of_the_seventh_century|E].\n\nВнутренняя рознь привела к битве на болотах Викси в 760 г. от И.С., где 81-й Государственный легион «Драконий огонь» столкнулся с 29-м Губернаторским легион «Клятвенник» и двумя дворянскими легионами. В итоге противоборствующие советы в ходе «Четырнадцати судов» приказали командующим обоих армий совершить самоубийство. Нарастающий страх перед гражданской войной привел к катастрофическому [Glossary('#G_light Кровавому Сенату 761 г. от И.С.#!','GH_BLOOD_SENATE_OF_761_GLOSS')] и проложил путь к неожиданному взлету [Concept('aautokratir','Ааутократиры')|E] $aauto_theyssia_link$ Ианы Тейссии#! в 764 г. от И.С.\n\nЗатем Иана ограничила полномочия обоих советов в серии стремительных политических комбинаций, что завершилось роспуском Совета Героев и подчинением Шестого Имперского совета престолу, закрепив власть Тейссии и ознаменовав начало Тейссианского Золотого века."
 GH_IMPERIAL_CHANCELLERY: "Иногда называемый $aauto_maklea_link$ Маклеанским#! Регентским советом, #BOL Имперский канцлерский совет#! был импровизированным органом, созданным для удержания [Concept('aversaria','имперского')|E] престола после смерти Маклеи до назначения законного наследника. Не способный справиться с нарастающей волной варлородизма, интригами этепезейского двора и скандалами вокруг Лже-Маклей, совет распался в 275 г. от И.С. в результате переворота губернатора Исисона «Черноязыкого» в Этепезее и последующей коронации Ааутократира Паксанораса «Неготового»."

 # Aversarian Historiography
 GH_POLISOCRACY_GLOSS: "#bold Полисократия#! обозначает тысячи городов-государств (и столько же форм правления) на [Concept('aversaria', 'протоаверсарианских')|E] [Concept('shatteredisles','Островах')|E] и их господство на протяжении по меньшей мере тысячелетия до образования [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier]. Полисы и их колонии редко объединялись под властью великих завоевателей (обычно называемых [Glossary('#G_light никарийнами#!','GH_NIKARIYN_GLOSS')]), оставаясь на протяжении большей части истории крайне раздробленными. Последний из никарийнов объединил сотни полисов в рыхлую конфедерацию — [Glossary('#G_light Ааутократию#!','GH_AAUTOKRATA_GLOSS')], — однако политический конфликт вокруг природы Империи и роли её ааутократира вылился в [war_of_the_thousand_dragons|E]. Победа Ааутократира Аэксионаракса положила конец Полисократии, установив теоретически единую имперскую власть."
 GH_NAEXANAXICA_GLOSS: "#bold Наэксанаксика#! — это [Concept('aversaria', 'протоаверсарианское')|E] искажение слова [Glossary('#G_light наэксоникс#!','GH_NAEXONIX_GLOSS')], которое точнее всего переводится как «Островщина». Это было самое распространенное название региона [shatteredisles|E] вокруг [Concept('imperial_isle', 'Имперского острова')|E], вокруг которого веками вращалась [Glossary('#G_light Полисократия#!','GH_POLISOCRACY_GLOSS')]. «Наэксанаксийский» по сей день остается общим термином как для протоаверсарианской культуры, так и для более широкой культурной семьи."
 GH_NAEXONIX_GLOSS: "#bold Наэксоникс#! переводится как «остров» на [Concept('aversaria', 'протоаверсарианском')|E] наэксанаксийском языке. В ходе среднеимперских языковых реформ III века слово превратилось в «наэксокс», а к XI веку — в «нексон»."
 GH_NIKARIYN_GLOSS: "#bold Никарийн#! — буквально «Первый капитан» в древних эрсодиаксианских религиозных текстах. В [Concept('aversaria', 'протоаверсарианской')|E] культуре имперские титулы считались превосходящими смертных, а высшим светским чином был капитан стражи бога Эрсодиакса. Никарийны ненадолго объединяли [Glossary('#G_light полисократию#!','GH_POLISOCRACY_GLOSS')] путем завоеваний или перед лицом кризисов на протяжении тысячелетий, пока «[Glossary('Последний Никарийн','GH_LAST_NIKARIYN_GLOSS')]» не упразднил этот титул после Драконьего Мора."
 GH_LAST_NIKARIYN_GLOSS: "#bold Последний Никарийн#! — популярное прозвище первого правителя [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier], чародея-воеводы Даче'нокса Никари'коса. Приняв титул [Glossary('#G_light никарийна#!','GH_NIKARIYN_GLOSS')] в ответ на Драконий Мор, Даче'нокс объединил разрозненные [Glossary('#G_light города-государства#!','GH_POLISOCRACY_GLOSS')] [Concept('aversaria', 'протоАверсарии')|E] и положил конец смуте прошлого века. Затем он спорным образом объявил свою [Glossary('#G_light Ааутократию#!','GH_AAUTOKRATA_GLOSS')] бессрочной, заменил титул Никарийна на «Ааутократир» и заложил наследие, навсегда изменившее историю [aeras|E]."
 GH_TERROXIAN_IMPERIAL_EDICT_MANIFESTO_GLOSS: "#bold Манифест имперских эдиктов Террокса#! (или «Декларации Террокса») представлял собой манифест объемом в тридцать тысяч слов, отпечатанный во всей [theyssian_scrivenery_network|E] после [the_vilnian_assault|E|l] и [the_oration_of_legions|E|l]. Считавшийся почти невнятным, этот документ по приказу Террокса был размножен в тысячах копий, что уничтожило остатки последних крупных скрипториев в [mayikrata|E] и сжгло остатки Сети по всей [Concept('aversaria', 'империи')|E]."
 terrox_possessive: "Террокса"
 GH_THREE_EXALTED_MATRONS_GLOSS: "#bold Три Великие Матери#! обозначают $aauto_maklea_link$ Ааутократиру Маклею#!, Аэлиадиас и $aauto_theyssia_link$ Тейссию#!, а также их суммарные три века правления над [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] в III, V и VIII веках от И.С. Хотя [Concept('aversaria', 'протоаверсарианское')|E] общество во времена [Glossary('#G_light Полисократии#!','GH_POLISOCRACY_GLOSS')] было строго патриархальным, стремительный и неожиданный взлет Маклеи, а также последовавшие за ним масштабные чистки и культурная реорганизация навсегда уравняли женщин с мужчинами в правах имперского наследования. Хотя в дальнейшем правили ааутократиры обоих полов, и некоторые из них — такие как Фансис, $aauto_eramos_link$ Эрамос#! и Нотикс — также стали легендарными фигурами, каждая из матерей стала настолько влиятельной, что олицетворяла собой целые эпохи Империи и ее законов."
 GH_IMPERIAL_RESTORATION_PERIOD_GLOSS: "#BOL Период Имперского Восстановления#! — это эпоха в [Concept('aversaria','аверсарианской')|E] истории, длившаяся от окончания [chaos_of_the_seventh_century|E] в битве при Ридувийских курганах в 756 г. от И.С. до [Glossary('#G_light Позднеимперского периода#!','GH_LATE_IMPERIAL_PERIOD_GLOSS')]."
 GH_LATE_IMPERIAL_PERIOD_GLOSS: "Период [imperial|E] [Concept('aversaria','аверсарианской')|E] истории примерно от восстаний агионистов в 1085 г. от И.С. (или иногда от [war_of_all_islands|E] 966 г. от И.С. и пика пост-золотого века имперского могущества) до [frodbrokna|E] и [Glossary('#G_light Периода Имперской Анархии#!','GH_IMPERIAL_ANARCHY_PERIOD_GLOSS')] в 1200 г. от И.С."
 GH_IMPERIAL_ANARCHY_PERIOD_GLOSS: "Заключительный период [imperial|E] [Concept('aversaria','аверсарианской')|E] истории. Различные этапы [imperial_civil_war|E] часто называются фактическим началом этого периода, при этом некоторые староимперские авторы доходят до того, что считают [odrstund|E] или [turmoil_of_the_sixteen_aautokratirs|E] завершением [Glossary('#G_light Позднеимперского периода#!','GH_LATE_IMPERIAL_PERIOD_GLOSS')]. #BOL Период Имперской Анархии#! характеризуется полным крахом Имперского права и культуры. Общепризнанно, что он закончился (вместе с самой [Glossary('#G_light Ааутократией#!','GH_AAUTOKRATA_GLOSS')]) во время [Concept('sjalvolki_migration', 'Великого переселения сьяльвольков')|E], чаще всего датируемого падением Ораисполя в 1255 г. от И.С."
 THIRTY_GOLDEN_SUMMERS_GLOSS: "#BOL Тридцать Золотых Лет#! — локальный золотой век в Калатипсоми, длившийся с 563 по 593 гг. от И.С. Он ознаменовался тремя десятилетиями беспрецедентного мира, грамотного управления, рекордных урожаев, мягких зим и затишья во вражде с феями."
 GH_EIGHT_GREAT_MARTYRDOMS_GLOSS: "#BOL Восемь Великих Мученичеств#! — аверсарианский термин для нескольких десятков из сотен чисток, проведенных во время [maklean_terrors|E]. Каждое «Мученичество» обозначает отдельный этап чисток и обычно связано с преследованием определенной группы, хотя стремительный и всеобъемлющий характер Террора приводил к тому, что в ходе каждого этапа погибали или страдали широкие слои населения по всей Империи (в основном те, что затрагивали имперское общество). Многочисленные чистки рабов, «варваров» и групп, не переживших этот период, оказались по большей части забыты в имперско-центричных хрониках выживших.\n\nПервое Мученичество затронуло многие оставшиеся эрсодиаксианские политические фракции, пережившие [war_of_the_thousand_dragons|E], и большинство других групп, сражавшихся против имперцев во время войны. Последующие чистки были направлены против полисной знати, различных вассальных правителей, варварских или рабских культур, монашеских орденов Горного Солнца в Опахасии, жречества Имперского культа и сотен других аверсарианских конфессий, Имперской армии и братств драконьих наездников, снова монашеских орденов Горного Солнца и, наконец, большинства имперской бюрократии и класса магов (большинство из которых были лоялистами, поставленными у власти самой Маклеей в течение её правления)."
 maklea_possessive: "Маклеи"

 # Aversarian Events
 GH_BLOOD_SENATE_OF_761_GLOSS: " #BOL Кровавый Сенат 761 года от И.С.#! был одним из самых спорных Кровавых Сенатов вплоть до [Glossary('#G_light Позднеимперского периода#!','GH_LATE_IMPERIAL_PERIOD_GLOSS')]. После многолетних задержек со стороны [Glossary('#G_light Имперского Консилиума#!','GH_IMPERIAL_CONCILIARY')] и эскалации внутренних распрей, кульминацией которых стали битва на болотах Викси и «Четырнадцать судов», нарастающий страх перед гражданской войной привел к объявлению Кровавого Сената, призванного положить конец регентству, оставшемуся после смерти $aauto_eramos_link$ Эрамоса#!. Последовавший Кровавый Сенат 761 года от И.С. был омрачен скандалами, интригами и множеством юридических баталий за определение его официального хода.\n\nПосле нескольких десятков ранних раундов [magi|E] Эона $aauto_theyssia_link$ Тейссия#! и легон Рутар Итрикс стали фаворитами [Glossary('#G_light Шестого Имперского совета#!','GH_SIXTH_IMPERIAL_COUNCIL_GLOSS')] и [Glossary('#G_light Совета Легионов#!','GH_COUNCIL_OF_HEROES_GLOSS')] соответственно. Однако они оба, а также еще шесть претендентов (из двадцати финалистов) были убиты.\n\nПосле этого Кровавый Сенат потерпел крах, несмотря на победу Иксона «Манифестанта», которому отказали во въезде в Ораисполь для коронации. Иана Тейссия, сестра Эоны, обвинила Иксона в убийстве сестры и вызвала его на дуэль, в которой сразила Иксона на исходе легендарного пятичасового поединка, что обычно знаменует начало Раннего Тейссианского периода. Несмотря на то, что Имперский Консилиум предложил ей корону, она настаивала на проведении второго Кровавого Сената с новым сводом правил собственного сочинения, который впоследствии стал основой для всех будущих Кровавых Сенатов. На следующем Кровавом Сенате 764 года от И.С. она разгромила всех оставшихся претендентов на престол и была окончательно коронована как ааутократир."
 WAR_OF_THE_BLACK_YEW_GLOSS: "#BOL Война Черного Тиса#! была масштабным конфликтом, охватившим Рич в период [chaos_of_the_seventh_century|E], став кульминацией десятилетий войны между силами леса и их слугами с одной стороны и владениями Этрандекси и [aversaria|E] с другой. Она началась с возвращения [Glossary('#G_light Карттуэн Серебряноволосой#!', 'dailennir_kathanouxiac_18_desc')], которая стремилась провести ритуал, известный как И-Амантиль. Этот ритуал должен был объединить мирских людей с миром [aspect_dream], а также исполнить шестивековое пророчество о том, что она возглавит давно погибшую империю Кафануксы.\n\nКарттуэн в конечном счете потерпела поражение от обширной коалиции местных странников Этрандекси, аверсарианцев, жителей Клановых земель и даже примкнувших к ним фей. Завершение войны привело к заключению Перемирия Очага и Леса, которое окончательно провело границы между древними силами и владениями людей, положив конец пятидесятилетнему кровопролитию и навсегда прекратив крупномасштабные конфликты между обеими сторонами."

 # Aversarian Culture
 GH_BLOODWINE_GLOSS: "#bold Кровавое вино#! — ценный имперский напиток, популярный в [aversaria|E], в основном среди знати и [Concept('imperial_magi_class', 'каст магов')|E]. На самом деле Кровавое вино представляет собой водку — оливковую или фруктовую, — отличающуюся каплей крови в бокале или бутылке. Напиток ритуально подавался на пирах вместе с хлебом в знак доверия между [magi|E] сферы [aspect_blood]. В период Третьего Имперского Золотого века [magi|E] распространили этот напиток на большую часть общества и стали часто добавлять в него магические ингредиенты, специи и кровь специально выращенных существ или алхимические смеси для улучшения вкуса и цвета."
 GH_AVERSARIAN_SEERESS_GLOSS: "#bold Провидицы#! в [Concept('aversaria', 'протоаверсарианском')|E] обществе были основными практики [magic|E] и часто занимали ведущие роли в религии и политике. В преимущественно патриархальной [Glossary('#G_light $polis_apostrophe|q$#!','GH_POLISOCRACY_GLOSS')] светская власть считалась прерогативой знатных мужчин, тогда как магическая authority находилась в руках женщин. Провидицы организовывались в жреческие ордена во главе с Матерью, которая всю жизнь обучала послушниц и готовила их к важным ритуалам гадания и ролям советниц правящей касты. Мальчики, воспитанные как маги, считались женщинами — по крайней мере до тех пор, пока образование [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] и исчезновение [dragons|E] не привели к возникновению [Concept('imperial_magi_class', 'Имперского сословия магов')|E].\n\nРеорганизация и профессионализация магов в рамках [Glossary( '#G_light Ааутократии#!', 'GH_AAUTOKRATA_GLOSS' )], а также превращение магии в современный признак аристократии значительно уменьшили роль провидиц. Чистки [Concept('aautokratir','Ааутократиры')|E] $aauto_maklea_link$ Маклеи#! уничтожили большинство крупных выживших орденов или принудительно включили их в состав Империи. Несмотря на это, провидицы по-прежнему занимали высокое положение в аверсарианской религии и культуре: такие провидицы, как [Concept('aehan_massacre','Аэха')|E], Валатикса и пророчица Санкси, пользовались огромным влиянием при имперском дворе."
 polis_apostrophe: "полисов"
 GH_DRAKARNAXAUXILA_GLOSS: "Буквально «Драконьи ауксиларии» на [Concept('aversaria','среднеимперском')|E] языке. Дракарнаксауксилы были потомками братств драконьих наездников времен [war_of_the_thousand_dragons|E] и [Glossary('#G_light Эпохи полисов#!','GH_POLISOCRACY_GLOSS')]. Оставшись без своих [dragons|E] после истребления чудовищ Ааутократиром Аэксионараксом в 171 году от И.С., братства тем не менее оставались крупнейшей силой в Имперской армии вплоть до [marcher_aversarian_wars|E]. Действуя как автономное объединение независимых армий под имперским знаменем, вдохновленная ими система военной организации сохранялась до катастрофического выступления Имперской армии в начале [Concept('kartharadd','Картараддийских войн')|E]. Наследие дракарнаксауксил окончательно завершилось легендарными Военными реформами [Concept('aautokratir','Ааутократира')|E] $aauto_eramos_link$ Эрамоса#! в 726 году от И.С., когда Имперская армия была заменена Аверсарианскими легионами, созданными по образцу профессиональных армий их картараддийских противников."
 GH_AERAIMATAXGORRAX_GLOSS: "#bold Эр'айматаксго'рракс#! приблизительно переводится как «Божественный кровавый пир» на языке киротов Этапекса. Эр'айматаксго'рракс представлял собой восьмидневный фестиваль массовых жертвоприношений, каннибализма и непотребств, кульминацией которого была Ночь Пустот, когда аристократия городов киротов шествовала от дома к дому. Эта практика стала в основном церемониальной после серии крупных восстаний в IV веке до И.С. и была официально запрещена в [GetTitleByKey('h_aversarinas_aautokrata').GetNameNoTier] незадолго до запрета киротского языка в 255 году от И.С."
 GH_NIGHT_OF_THE_VOIDS: "#bold Ночь Пустот#! была кульминацией древнего киротского праздника [Glossary('Эр’айматаксго’рракс','GH_AERAIMATAXGORRAX_GLOSS')], самый крупный из которых проходил в городе Киротапон (современная Агринамея), хотя версии поменьше проводились в большинстве киротских [Glossary('полисов','GH_POLISOCRACY_GLOSS')]. Киротская аристократия облачалась в черные одежды, брала в руки оружие и ходила от дома к дому, громогласно призывая горожан к ответу за любые преступления или проступки, совершенные за прошедший год, и оглашая наказания за эти грехи (реальные или вымышленные). Праздник служил главным образом методом устрашения огромного рабского населения киротского общества, а также позволял аристократии вымогать деньги, издеваться и нападать на жителей. Киротские семьи могли избежать худших проявлений праздника, уплатив дань своему лорду или отправив сына участвовать в зверствах. После этого устраивался великий пир и «милосердное» освобождение некоторых рабов."

