 NEO_OJYCZANYZ_ARCHITECTURE_GLOSS: "Нео-ойичаниз — архитектурный стиль, преобладавший на территории [chevalie|E] и Микрос Калатипсоми в период между VI и X веками от И.С. Наиболее примечателен своей устремленностью вверх, стрельчатыми арками и витражными окнами."

