 NEO_OJYCZANYZ_ARCHITECTURE_GLOSS: "Неоойчайнский архитектурный стиль преобладал в [Concept('chevalie','Шевалье')|E] и Микросе Калатипсоми с VI по X век И.С. Его главные черты — устремлённые вверх формы, стрельчатые арки и витражи."

