l_russian:

 claimant_to_the_high_kingdom: "Претендент на Верховное королевство"
 claimant_to_the_high_kingdom_desc: "Благодаря происхождению, интригам или финансовой сделке этот персонаж получил [Concept('piece_of_the_broken_crown_concept','претензию на Верховное королевство')|E]."
 
 adabyss_invasion_leader_modifier: "Лелманд"
 adabyss_invasion_leader_modifier_desc: "Этот персонаж был провозглашён Лелмандом — командующим Янтарного корпуса."

 champion_of_the_first_ring: "Чемпион Первого кольца"
 champion_of_the_second_ring: "Чемпион Второго кольца"
 champion_of_the_third_ring: "Чемпион Третьего кольца"
 champion_of_the_fourth_ring: "Чемпион Четвертого кольца"
 champion_of_the_fifth_ring: "Чемпион Пятого кольца"
 
 legacy_of_elysia: "Наследие Элизии"
 legacy_of_elysia_desc: "Катастрофа у Элизийского перевала лишила остатки [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )] воинов на многие десятилетия вперед.\n\n#N Полностью исчезнет, если перейдёт под власть [Concept('aversaria','неаверсарианца')|E] или после 1304 И.С.#!"
 
 legacy_of_icw: "Наследие [Concept('imperial_civil_war','Имперской гражданской войны')|E]"
 legacy_of_icw_desc: "Хотя с момента завершения [Concept('imperial_civil_war','Имперской гражданской войны')|E] прошли десятилетия, ее последствия все еще ощущаются во всех остатках [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )]\n\n#N Полностью исчезнет, если перейдёт под власть [Concept('aversaria','неаверсарианца')|E] или после 1286 И.С.#!"
 
 malcoisiac_anarchy: "Анархия"
 malcoisiac_anarchy_desc: "Смерть Аверсарии и крах губернаторских институтов региона привели к тому, что Губернаторские легионы Малькои — когда-то единственные оставшиеся в [Concept('aversaria','Аверсарии')|E] — оказались практически полностью уничтожены. На их месте большую часть губернаторства захватили рабы, и некогда процветавший регион погрузился в экономическое падение.\n\n#N Исчезнет только из [Concept('counties','графств')|E] неаверсарианцев#!"
 
 ruined_by_ulfirx: "Набег Ульфиркса"
 ruined_by_ulfirx_desc: "Когда Ульфиркс со своей весёлой пьяной ватагой прошёл по этим островам, они не знали поражений и лишили острова многих способных мужчин.\n\n#N Полностью исчезнет, если перейдёт под власть [Concept('aversaria','неаверсарианца')|E] или после 1284 И.С.#!"
 
 freed_slaves: "Освобождённые рабы"
 freed_slaves_desc: "Этот персонаж заслужил репутацию освободителя, завоевав любовь презираемых и угнетенных, но также и гнев их бывших господ."
 
 cenware_cheat_modifier: "Избранник богов"
 cenware_cheat_modifier_desc: "Будь то удача, судьба или непревзойденные способности, кажется, что сами боги помогают этому персонажу на пути к его целям."
 
 sarradonian_rebel_desertions: "Саррадонское восстание"
 sarradonian_rebel_desertions_desc: "Нападение Отца Саррадона спровоцировало массовое народное восстание в этой провинции, местные жители отдают оружие и деньги на борьбу с чужеземными оккупантами."

 aftermath_of_the_ash_war: "Последствия Пепельной войны"
 aftermath_of_the_ash_war_desc: "Жители Черных гор пострадали от [Concept('the_black_mountain_war','череды')|E] [Concept('ash_war','войн')|E], что сильно истощило их людские ресурсы.\n\n#N Исчезнет после 1264 И.С.#!"
 
 adabyss_opinion_modifier: "Благоговейные подданные"
 adabyss_opinion_modifier_desc: "Завоеванные адабисским продвижением повергнуты в благоговейный трепет при виде их великой армии и передовых технологий, и вряд ли восстанут против столь непреодолимой силы."
 
 gh_debased_currency_modifier: "Обесцененная монета"
 gh_debased_currency_modifier_desc: "Снизив качество валюты своей державы и, следовательно, ее ценность, этот правитель вызвал долгосрочные экономические проблемы для своего государства."
 
 gh_debased_currency_modifier_2: "Обесцененная качественная монета"
 gh_debased_currency_modifier_2_desc: "Несмотря на пользовавшуюся высоким качеством и уважением монету, этот правитель решил снизить ее качество и ценность ради сиюминутной выгоды."
 
 gh_strengthen_currency_modifier: "Стабильная валюта"
 gh_strengthen_currency_modifier_desc: "Введя новые экономические меры, этот правитель улучшил положение своей валюты."
 
 gh_strengthen_currency_modifier_2: "Могущественная монета"
 gh_strengthen_currency_modifier_2_desc: "Введение новых мер и чеканка качественной монеты значительно повысили экономическое могущество этого правителя."
 
 gh_sjalvolki_resettlement_modifier: "Переселение сьялволков"
 gh_sjalvolki_resettlement_modifier_desc: "Огромный приток переселенцев оживил угасающее процветание этого графства."

 gh_sjalvolki_resettlement_focus_modifier: "Переселенец-сьялволк"
 gh_sjalvolki_resettlement_focus_modifier_desc: "Этот персонаж персонаж был частью огромного притока переселенцев из [Concept('foglands','Туманных земель')|E] и  теперь живёт на новых землях."
 
 gh_sjalvolki_resettlement_focus_cenware_modifier: "Переселенец-сьялволк"
 gh_sjalvolki_resettlement_focus_cenware_modifier_desc: "Этот персонаж персонаж был частью огромного притока переселенцев из [Concept('foglands','Туманных земель')|E] и  теперь живёт на новых землях."

 gh_sjalvolki_rebuilding_focus_modifier: "Восстановление"
 gh_sjalvolki_rebuilding_focus_modifier_desc: "Этот персонаж обрел новую экономическую независимость и силу после прохождения переселенцев через его земли."

 gh_imperrech_debuff_modifier: "Коалиция"
 gh_imperrech_debuff_modifier_desc: "Имперрех — это не столько полноценная держава, сколько коалиция невероятно разрозненных племен и народов, а потому не выставляет «ополчение» в классическом смысле этого слова. Верховный король должен вместо этого полагаться на добровольные пожертвования своих подчиненных."
 
 gh_sound_of_body: "Крепкое здоровье"
 gh_sound_of_body_desc: "Организм этого персонажа необычайно устойчив к повседневным тяготам благодаря врождённым особенностям или отличному распорядку дня."
 
 survived_dovatkning: "Залеченные раны после [Concept('dovatkning','Доваткнинга')|E]"
 survived_dovatkning_desc: "Проиграв раунд, но получив пощаду, вы были срочно доставлены к ближайшему целителю, который обработал ваши раны и царапины."
 INQUISITOR_CONVERSION_PERK_BONUS_VALUE: "Инквизиторы искореняют ересь"
 conquered_by_the_sjalvolki: "Рост военного дела сьялволков"

 boczoj_modifier: "Бочой"
 boczoj_modifier_desc: "Этот персонаж — [Glossary('Бочой','GH_BOCZOJ_GLOSS')], назначенный командующий салазсекскими войсками властью Кизенганы."

 last_stand_of_the_clans_modifier: "Последний рубеж кланов"
 last_stand_of_the_clans_modifier_desc: "Этот персонаж повелевает великим войском, однако оно грозит рассыпаться под его началом"

 daughters_of_the_sky_modifier: "Дочери неба"
 daughters_of_the_sky_modifier_desc: "Этот дом объединил разрозненные сарминианские племена под новой королевской властью"
 
