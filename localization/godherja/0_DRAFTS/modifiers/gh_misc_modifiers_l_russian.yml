l_russian:

 claimant_to_the_high_kingdom: "Претендент на Верховное королевство"
 claimant_to_the_high_kingdom_desc: "Благодаря происхождению, интригам или финансовой сделке этот персонаж получил [Concept('piece_of_the_broken_crown_concept','претензию на Верховное королевство')|E]."
 
 adabyss_invasion_leader_modifier: "Лелманд"
 adabyss_invasion_leader_modifier_desc: "Этот персонаж был провозглашён Лелмандом — командующим Янтарным корпусом."

 champion_of_the_first_ring: "Чемпион первого круга"
 champion_of_the_second_ring: "Чемпион второго круга"
 champion_of_the_third_ring: "Чемпион третьего круга"
 champion_of_the_fourth_ring: "Чемпион четвертого круга"
 champion_of_the_fifth_ring: "Чемпион пятого круга"
 
 legacy_of_elysia: "Наследие Элизии"
 legacy_of_elysia_desc: "Катастрофа у Элизийского перевала оставила уцелевшую часть Автократии без воинов на десятилетия вперёд.\n\n#N Полностью исчезнет, если перейдёт под власть неаверсарианца или после 1304 И.С.#!"
 
 legacy_of_icw: "Наследие [Concept('imperial_civil_war','Имперской гражданской войны')|E]"
 legacy_of_icw_desc: "Хотя [Concept('imperial_civil_war','Имперская гражданская война')|E] завершилась десятилетия назад, её последствия до сих пор ощущаются во всех уцелевших землях Автократии.\n\n#N Полностью исчезнет, если перейдёт под власть неаверсарианца или после 1286 И.С.#!"
 
 malcoisiac_anarchy: "Анархия"
 malcoisiac_anarchy_desc: "Когда-то Малкоис был главным центром добычи ресурсов и снабжения Аверсарии. После гибели империи и распада местных наместнических учреждений малкоиские наместнические легионы — в своё время последние уцелевшие легионы Аверсарии — были почти полностью уничтожены. Большую часть наместничества захватили рабы, и некогда процветающий регион оказался в состоянии экономического краха.\n\n#N Исчезнет только из неаверсарианских [Concept('counties','графств')|E]#!"
 
 ruined_by_ulfirx: "Набег Ульфиркса"
 ruined_by_ulfirx_desc: "Когда Ульфиркс со своей весёлой пьяной ватагой прошёл по этим островам, никто не смог его остановить, а местные земли лишились множества боеспособных мужчин.\n\n#N Полностью исчезнет, если перейдёт под власть неаверсарианца или после 1284 И.С.#!"
 
 freed_slaves: "Освобождённые рабы"
 freed_slaves_desc: "Этот персонаж заслужил репутацию освободителя и любовь презираемых и угнетённых, но также навлёк на себя гнев их бывших хозяев."
 
 cenware_cheat_modifier: "[Select_CString(ROOT.Char.IsFemale, 'Любимица богов', 'Любимец богов')]"
 cenware_cheat_modifier_desc: "Благодаря удаче, судьбе или непревзойдённым способностям этому персонажу словно помогают сами боги."
 
 sarradonian_rebel_desertions: "Саррадонский мятеж"
 sarradonian_rebel_desertions_desc: "Нападение Отца Саррадона вызвало в этой провинции массовое восстание: местные жители отдают оружие и деньги на борьбу с чужеземными оккупантами."

 aftermath_of_the_ash_war: "Последствия Пепельной войны"
 aftermath_of_the_ash_war_desc: "Жители Черных гор пережили [Concept('the_black_mountain_war','череду')|E] [Concept('ash_war','войн')|E], что сильно истощило их людские ресурсы.\n\n#N Исчезнет после 1264 И.С.#!"
 
 adabyss_opinion_modifier: "Потрясённые подданные"
 adabyss_opinion_modifier_desc: "Покорённые адабиссийским наступлением люди поражены огромной армией и передовыми технологиями завоевателей и вряд ли восстанут против силы, которая кажется неудержимой."
 
 gh_debased_currency_modifier: "Порченая монета"
 gh_debased_currency_modifier_desc: "Снизив качество и ценность монеты, этот правитель навлёк на свою державу долгосрочные экономические проблемы."
 
 gh_debased_currency_modifier_2: "Порча хорошей монеты"
 gh_debased_currency_modifier_2_desc: "Несмотря на высокое качество монеты и доверие к ней, этот правитель решил ухудшить её ради краткосрочной выгоды, снизив тем самым её ценность."
 
 gh_strengthen_currency_modifier: "Стабильная валюта"
 gh_strengthen_currency_modifier_desc: "Новые экономические меры укрепили положение валюты этого правителя."
 
 gh_strengthen_currency_modifier_2: "Сильная валюта"
 gh_strengthen_currency_modifier_2_desc: "Новые меры и чеканка качественной монеты значительно усилили экономическое влияние этого правителя."
 
 gh_sjalvolki_resettlement_modifier: "Переселение сьялволков"
 gh_sjalvolki_resettlement_modifier_desc: "Огромный приток переселенцев оживил угасающую экономику этого графства."

 gh_sjalvolki_resettlement_focus_modifier: "[Select_CString(ROOT.Char.IsFemale, 'Сьялвольская поселенка', 'Сьялвольский поселенец')]"
 gh_sjalvolki_resettlement_focus_modifier_desc: "Этот персонаж был среди множества переселенцев из [Concept('foglands','Туманных земель')|E] и теперь живёт на новых землях."
 
 gh_sjalvolki_resettlement_focus_cenware_modifier: "[Select_CString(ROOT.Char.IsFemale, 'Сьялвольская поселенка', 'Сьялвольский поселенец')]"
 gh_sjalvolki_resettlement_focus_cenware_modifier_desc: "Этот персонаж был среди множества переселенцев из [Concept('foglands','Туманных земель')|E] и теперь живёт на новых землях."

 gh_sjalvolki_rebuilding_focus_modifier: "Восстановление"
 gh_sjalvolki_rebuilding_focus_modifier_desc: "Поток переселенцев через владения этого персонажа дал новые экономические возможности и большую самостоятельность."

 gh_imperrech_debuff_modifier: "Коалиция"
 gh_imperrech_debuff_modifier_desc: "Имперрех — скорее коалиция совершенно разных племён и народов, чем полноценное государство, поэтому он не выставляет «ополчение» в обычном смысле слова. Верховный король вынужден полагаться на войска, которые подчинённые предоставляют добровольно."
 
 gh_sound_of_body: "Крепкое здоровье"
 gh_sound_of_body_desc: "Организм этого персонажа необычайно устойчив к повседневным тяготам благодаря врождённым особенностям или отличному распорядку дня."
 
 survived_dovatkning: "Залеченные раны после [Concept('dovatkning','Доваткнинга')|E]"
 survived_dovatkning_desc: "Проиграв раунд, но получив пощаду, вы были срочно доставлены к ближайшему целителю, который обработал ваши раны и царапины."
 INQUISITOR_CONVERSION_PERK_BONUS_VALUE: "Инквизиторы искореняют ересь"
 conquered_by_the_sjalvolki: "Рост военных заказов сьялволков"

 boczoj_modifier: "Бочой"
 boczoj_modifier_desc: "Этот персонаж — [Glossary('Бочой','GH_BOCZOJ_GLOSS')], назначенный командующий салажекскими войсками под властью кизенганы."

 last_stand_of_the_clans_modifier: "Последний рубеж кланов"
 last_stand_of_the_clans_modifier_desc: "Этот персонаж командует огромным войском, но оно вот-вот распадётся."

 daughters_of_the_sky_modifier: "Дочери неба"
 daughters_of_the_sky_modifier_desc: "Этот дом объединил разрозненные сарминские племена под новой королевской властью."
 
