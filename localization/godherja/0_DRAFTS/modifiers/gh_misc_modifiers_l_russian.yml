 shadow_port: "Теневой порт"
 shadow_port_desc: "Здесь был основан [Concept('shadow_port','теневой порт')|E], привносящий преступность и краденые товары"
 
 traderoute_modifier: "Торговый путь"
 traderoute_modifier_desc: "Эта провинция лежит вдоль крупного торгового пути, обеспечивающего постоянный поток товаров."
 
 harbour_modifier: "Крупный порт"
 harbour_modifier_desc: "В этой провинции находится один из крупнейших портов мира, куда прибывают товары со всех концов света. Он приносит значительные доходы и привлекает новые идеи и людей со всего [Concept('aeras','Эраса')|E]."
 
 entrepot_modifier: "Крупный торговый центр"
 entrepot_modifier_desc: "Эта территория служит крупным центром торговли. Купцы привозят сюда ценные грузы даже из далёкого, почти мифического Катун-Кая, а на многолюдных рынках и в переполненных портах слышны языки более сотни народов. Здесь можно купить и продать почти всё — за подходящую цену."
 stapleport_modifier: "Порт приносит процветание"
 
 pirate_king: "Пиратский король"
 pirate_king_desc: "Этот персонаж известен как бич суши, похититель золота, губитель кораблей, и его боятся везде, где люди живут на побережье"
 
 scourge_of_rovarska: "Бич Роварски"
 scourge_of_rovarska_desc: "Этот персонаж известен как величайшее зло, что грабило моря Пиратского побережья, и унес больше жизней и золота, чем само море"
 
 low_food: "Нехватка провизии"
 low_food_desc: "Из-за плохого планирования или невезения этот персонаж лишился части припасов на охоте."
 
 surplus_food: "Избыток провизии"
 surplus_food_desc: "Благодаря хорошему планированию или удаче у этого персонажа есть припасы, которых хватит намного дольше, чем ожидалось."
 
 tribal_settlement_target: "Идёт заселение племенами"
 tribal_settlement_target_desc: "В это [Concept('county','графство')|E] прибывает множество племенных поселенцев, верных его сюзерену, к огорчению местного населения."
 
 small_island: "Малые острова"
 small_island_desc: "Это графство представляет собой архипелаг из множества малых островов."
 large_island: "Крупные острова"
 large_island_desc: "Это графство представляет собой небольшой архипелаг из множества крупных островов."

 
 cyrat_hell_modifier: "Зелёный ад"
 cyrat_hell_modifier_desc: "Сами джунгли [Concept('cyrat_biozone','Кирата')|E], кажется, активно сопротивляются человечеству и служат домом для неисчислимых ужасающих монстров. В этом месте почти невозможно выжить, не говоря уже построить цивилизацию."

 cyrat_maa_modifier: "Невозможная логистика"
 cyrat_maa_modifier_desc: "В джунглях [Concept('cyrat_biozone','Кирата')|E] практически невозможно выставить любую форму профессиональной армии."

 fools_curse_modifier: "Золото дураков"
 fools_curse_modifier_desc: "[Concept('fools_coast_biozone','Берег дураков')|E] хорошо известен своими казалось бы бесконечными источниками золота на своих берегах, а также смертельными болезнями, которые, кажется, следуют за богатством региона, куда бы оно ни направлялось."

 opakasijan_highkingdom_modifier: "Столица Опахасии"
 opakasijan_highkingdom_modifier_desc: "Когда-то опустошенные, золотые холмы Опакасии снова цветут, и люди толпами стекаются в эту могучую столицу."
 high_tide_modifier: Прилив"
 high_tide_modifier_desc: "В этом графстве в настоящее время наблюдается [Concept('high_tide','прилив')|E], затопляющий дикие земли."
 low_tide_modifier: "Отлив"
 low_tide_modifier_desc: "В этом графстве в настоящее время наблюдается [Concept('low_tide','отлив')|E], обнажающий почву."
 religious_turmoil: "Религиозная смута"
 religious_turmoil_desc:  "Это графство охвачено религиозной смутой."

 krikatama_purges_modifier: "Бхрамкародские чистки"
 krikatama_purges_modifier_desc: "Беспощадные чистки, обрушенные Бичом на свой народ в его неустанном походе, серьезно подорвали его возможности по поддержанию и ведению дальнейших кампаний."

 banner_of_the_champion_modifier: "Знамя чемпиона"
 banner_of_the_champion_modifier_desc: "Последний оплот дарамарджаратанистов в регионе, Шаху доблестно объединяет свой народ и тех, кто бежал от гнева Бича, против самого Бича."

 razed_sophocos_modifier: "Пламя Софокоса"
 razed_sophocos_modifier_desc: "Этого персонажа почитают и боятся по всему [Concept('sarradon','Саррадону')|E] за безжалостное разорение башни Софокоса."

 isles_naval_expedition_modifier: "Морские экспедиции"
 isles_naval_expedition_modifier_desc: "Этот персонаж организует для своей державы морские экспедиции и проекты по колонизации [Concept('shatteredisles','Расколотых островов')|E]."

 isles_retribution_modifier: "Заступник островитян"
 isles_retribution_modifier_desc: "Этот персонаж взялся за оружие против предполагаемых захватчиков [Concept('shatteredisles','Расколотых островов')|E]."

 quality_arrows_modifier: "Высококачественные стрелы"
 quality_arrows_modifier_desc: "У этого персонажа есть большой запас отличных наконечников для стрел."
 barbed_arrows_modifier: "Зазубренные стрелы"
 barbed_arrows_modifier_desc: "Войска этого персонажа используют грозные и смертоносные стрелы."

 falcons_killing_rodents_modifier: "$cat_killing_rodents_modifier$"
 falcons_killing_rodents_modifier_desc: "Столица этого персонажа практически полностью избавлена от крыс."

 vitrific_grace_modifier: "Стеклянная грация"
 vitrific_grace_modifier_desc: "Вы — лучшая версия себя, отныне и навсегда."

 fogeater_recuperating: "Сбор сил"

 recovery_efforts_modifier: "Усилия по восстановлению"
 recovery_efforts_modifier_desc: "Это графство пытается восстановиться после опустошительного набега."
 
 county_neglect_modifier: "Заброшенное восстановление"
 county_neglect_modifier_desc: "Это графство осталось брошенным на произвол судьбы после опустошительного набега."

 partic_secrets_revealed_modifier: "Раскрытые религиозные тайны"
 partic_secrets_revealed_modifier_desc: "Этот персонаж раскрыл чужакам тайны и обряды своей религии."

 partic_secrets_severing_modifier: "Рассказ о Расколе долин"
 partic_secrets_severing_modifier_desc: "Этот персонаж узнал историю [Concept('the_severing_of_the_vales','Раскола долин')|E] от близкого партика."
 partic_secrets_circles_modifier: "Рассказ об отпрысках партиков"
 partic_secrets_circles_modifier_desc: "Этот персонаж узнал об [Concept('scions_of_the_greensea','Отпрысках Зеленого моря')|E] от близкого партика."
 partic_secrets_council_modifier: "Рассказ о Верховном совете"
 partic_secrets_council_modifier_desc: "Этот персонаж услышал от близкого партика рассказы о [Concept('the_druid_arch_council','Верховном совете друидов')|E]."

 extreme_desert_modifier: "Суровая пустыня"
 extreme_desert_modifier_desc: "Опаленные солнцем пески внутренних земель Саррадона делают это графство непригодным для постоянного проживания людей.\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -50#!"
 whisperveil_modifier: "Завеса шёпота"
 whisperveil_modifier_desc: "В глубинах Завесы шёпота скрыто множество неизвестных опасностей, и только храбрецы или глупцы — а порой и те и другие — решаются войти под густой лесной полог этого региона.\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -45#!"
 pristine_paradise_modifier: "Нетронутый рай"
 pristine_paradise_modifier_desc: "[eripomvuno_biozone|E] тысячелетиями остаётся нетронутым, несмотря на бесчисленные попытки основать здесь поселения и завладеть его богатствами.\n\n#flavor Эта цепь островов должна быть усеяна руинами десятков колоний, но её берега и по сей день остаются такими же нетронутыми, как прежде#!\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#positive_value +50#!"
 settling_ruins_modifier: "Освоение руин"
 settling_ruins_modifier_desc: "Эта колония основана на обширном комплексе руин, который даёт поселенцам укрытие и строительные материалы.\n[colonization_progress|E]: [Concept('colonization','@colonization_progress_icon!')]#positive_value +20%#!"
 legacy_of_eons_modifier: "Наследие эонов"
 legacy_of_eons_modifier_name: "Это графство вернулось к цивилизованной жизни, а его нынешние обитатели опираются на наследие своих предков."

 kadtarak_modifier: "Кадтарак"
 kadtarak_modifier_desc: "Земли вокруг Кадтарака не только разрушены его ударом, но и наполнены невидимыми миазмами, которые вместе с неожиданно возникающими яркими вспышками света мгновенно убивает любого, кто приблизится.\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -100#!"

 takaday_forest_modifier: "Лес Такадай"
 takaday_forest_modifier_desc: "Лес Такадай полон самых разных существ и растений, представляющих смертельную опасность для любого, кто осмелится пересечь его. Он долгое время служил естественной преградой, отделяющей западный Дахангон от более сурового востока, и лишь самые отчаянные правители смели вести свои армии через его коварные заросли.\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -100#!"

 haryaadad_modifier: "Вечная ночь"
 haryaadad_modifier_desc: "После [Concept('sabar_lambay_raad','Сабар Ламбай Раад')|E] над Харьяададом воцарилась бесконечная ночь, и даже спустя долгое время после возвращения солнца город остаётся погружённым в непроглядный мрак.\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -60#!"

 dorajpor_modifier: "Последствия Чоджакаана"
 dorajpor_modifier_desc: "Во время [Concept('chojakaan_ka_ghatada','Чоджакаан ка Гхатада')|E] Дораджпор и его жители вспыхнули огненными столпами, а земля обратилась в пепел и прах.\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -50#!"

 seared_outcast_modifier: "Изгнанница-анохела"
 seared_outcast_modifier_desc: "После объявления [Concept('anohelis_outcasts','анохелой')|E] этот персонаж был изгнан с родины. Кожу головы обожгли и содрали, и раны будут заживать годами.\nНельзя развивать [Concept('trait','свойство')|E] «[GetTrait('lifestyle_gh_steppe_queen').GetName( GetNullCharacter )]»."

 former_seared_outcast_modifier: "Бывшая изгнанница-анохела"
 former_seared_outcast_modifier_desc: "Когда-то этого персонажа изгнали как [Concept('anohelis_outcasts','анохелу')|E], но позднее разрешили вернуться в общество. Раны зажили, но шрамы остались."

 silky_locks_modifier: "Шелковистые локоны"
 silky_locks_modifier_desc: "Волосы этого персонажа блестят и выглядят шелковистыми, вызывая зависть и восхищение окружающих."

 split_ends_modifier: "Секущиеся кончики"
 split_ends_modifier_desc: "Волосы этого персонажа секутся на концах, придавая ему неухоженный и растрёпанный вид."

 toxic_lye_modifier: "Ядовитая щёлочь"
 toxic_lye_modifier_desc: "Волосы этого персонажа выпали после воздействия особенно едкой щёлочи.\nНельзя продвигаться по [Concept('trait_level_track','шкале свойства')|E] «[GetTrait('lifestyle_gh_steppe_queen').GetName( GetNullCharacter )]»."

 unproven_orzopaja_modifier: "Непроверенный жерхени"
 unproven_orzopaja_modifier_desc: "Этот персонаж был принят в ряды [Glossary('орзопаядов','GH_ORZOPAJA_GLOSS')] как [Glossary('жерхени','GH_ZSERHENI_GLOSS')], но ему пока нечем это доказать"

 redlander_punishment_1: "Оковы на сердце"
 redlander_punishment_1_desc: "Этот персонаж медлил с исполнением воли богов"
 
 redlander_punishment_2: "Оковы на разуме"
 redlander_punishment_2_desc: "Этот персонаж пренебрегал богами"
 
 redlander_punishment_3: "Оковы на душе"
 redlander_punishment_3_desc: "Этот персонаж навлек на себя божественный гнев"

 mainland_refugees_modifier: "Беженцы с материка"
 mainland_refugees_modifier_desc: "Острова оказались наводнены полчищами беженцев с материка, хлынувших в регион.\n\n#N Полностью исчезнет, если перейдёт под власть красноземец или после 1274 И.С.#!"

 redlander_runaway_stopped: "Побег из Красных земель предотвращён"
 redlander_runaway_stopped_desc: "[GetHisHer] побег был сорван."

 redrunner_recruitment_effort: "Набор в легион"
 redrunner_recruitment_effort_desc: "Легион начал уделять повышенное внимание снабжению и привлечению новых солдат."

 redrunner_recruitment_malus: "Неудачный набор"
 redrunner_recruitment_malus_desc: "Легион изо всех сил пытается набрать новых солдат, но без особого успеха."
 
 collapsed_administration_modifier: "Крах администрации"
 collapsed_administration_modifier_desc: "Местная администрация исчезла практически за ночь, ввергнув города в хаос.\n\n#N Полностью исчезнет, если перейдёт под власть [Concept('aversaria','неаверсарианца')|E] или после 1274 И.С.#!"

 patient_zero_modifier: "Нулевой пациент"
 patient_zero_modifier_desc: "Этот персонаж стал носителем Проклятия Плоти."

 sacked_vounill_modifier: "Завоеватель Вуниля"
 sacked_vounill_modifier_desc: "Этот персонаж печально прославился разграблением древнего [GetBuilding('01_vounill').GetName]."

 union_of_two_shores_modifier: "Союз двух берегов"
 union_of_two_shores_modifier_desc: "После объединения [Concept('kasiryat_biozone','Каширията')|E] графства вдоль реки процветают благодаря богатой торговле, идущей через их земли."

 city_of_kasiryat_county_modifier: "Плоды Каширията"
 city_of_kasiryat_county_modifier_desc: "Господствуя над [Concept('kasiryat_biozone','Кашириятом')|E], этот город внушает трепет и уважение каждому, кто его видит."
 
 disguntled_populace_modifier: "Недовольное население"
 disgruntled_populace_modifier_desc: "Сюзерен объявил жителей этого графства людьми второго сорта, вызвав возмущение и сопротивление среди крестьян."

 agadari_resurgence_culture_modifier: "Возрождение агадаров"
 agadari_resurgence_culture_modifier_desc: "Скорость [promote_culture|E] (только для $agadari_group$): #P +75%#!"

 agadari_exodus_cyrat_modifier: "Исход агадаров"
 agadari_exodus_cyrat_modifier_desc: "Несмотря на упрямый отказ их лидера покинуть [Concept('cyrat_biozone','Кират')|E], жители этого графства бежали обратно на свою древнюю родину"

 exiled_one_modifier: "Изгнанник"
 exiled_one_modifier_desc: "За поклонение Корлаку и отказ от учения богов-близнецов этот персонаж был изгнан с родины и теперь презираем последователями наттананской веры."

 scourge_of_the_heretics_modifier: "Бич еретиков"
 scourge_of_the_heretics_desc: "Этот персонаж — неумолимое орудие божественного гнева, которого боятся все, кто бросает вызов священным догматам наттананской веры. Благодаря непреклонному рвению земли были очищены от ереси, и нечестивцам не осталось убежища. Одно имя этого персонажа служит предупреждением и проклятием для противников истинной веры."


 restore_astilik_empire_culture_modifier: "Возрождение астиликов"
 restore_astilik_empire_culture_modifier_desc: "В это [Concept('county','графство')|E] под надзором возрождающейся [Concept('astilik_empire','Астиликской империи')|E] прибывает множество поселенцев.\nСкорость [promote_culture|E] (только для [Concept('cultures','культур')|E] с [GetCulturePillar('heritage_kherkeloi').GetName]им наследием ): #P +75%#!"

 heart_of_the_labyrinth_modifier: "Сердце Лабиринта"
 heart_of_the_labyrinth_modifier_desc: "Этот персонаж отважился пройти сквозь ненасытную тьму и достиг центра [GetBuilding('01_abandoned_labyrinth').GetName]."

 kinilam_regency_modifier: "Регент Кинилама"
 kinilam_regency_modifier_desc: "Этот персонаж правит королевством лишь как регент, а его притязание на трон стоит не больше клочка бумаги."

 legitimate_kinilam_ruler: "Законный правитель Кинилама"
 legitimate_kinilam_ruler_desc: "Этот персонаж утвердился как законный правитель Кинилама, преодолев годы регентства и застоя."

 legitimate_heirs_to_kinilam: "Наследники Морского трона"
 legitimate_heirs_to_kinilam_desc: "Эта династия стала правящей семьёй Кинилама и пользуется всеми положенными ей правами и привилегиями."

 domineering_culture_modifier: "Властная культура"
 domineering_culture_modifier_desc: "Жители этого графства необычайно властны и воинственны и всегда готовы навязать свою волю."

 harsh_subjugation_modifier: "Жестокое подчинение"
 harsh_subjugation_modifier_desc: "Жители этого графства изнемогают под чрезмерно суровой властью."

 adventurous_culture_modifier: "Предприимчивая культура"
 adventurous_culture_modifier_desc: "Жителей этого графства не устраивает тихая жизнь."

 lasting_unity_modifier: "Прочное единство"
 lasting_unity_modifier_desc: "Это графство процветает благодаря усилиям всех его народов."

 newborn_yuankang_republic_modifier: "Новорожденная республика Юанькан"
 newborn_yuankang_republic_modifier_desc: "Новорожденная республика подобна полному сил юноше: здесь всё работает быстро и эффективно."

 clear_kathunkai_culture_modifier: "Искоренение катунской культуры"
 clear_kathunkai_culture_modifier_desc: "Политика искоренения катунской идентичности вызвала замешательство среди чиновников и значительно снизила эффективность управления."

 corniche_modifier: "Прибрежная аллея"
 corniche_modifier_desc: "Прибрежная аллея Дахангона — это дорога, пролегающая через лес Такадай, защищенная бесчисленными крепостями и гарнизонами солдат, дающая укрытие путешествующим купцам. Будучи единственным сухопутным путем, соединяющим восток и запад, Прибрежная аллея Дахангона имеет огромную ценность как для торговли, так и для военных целей. Поддержание ее в рабочем состоянии жизненно важно для управления Дахангоном."
 corniche_text_desc: "#weak Эффективность работы: 100%#!"

 corniche_range_modifier: "Зона Прибрежной аллеи"
 corniche_range_modifier_desc: "Этот регион извлекает выгоду из Прибрежной аллеи Дахангона. Торговцы перемещаются между землями, когда-то разделенными лесом Такадай, принося солидную прибыль местным правителям. Однако размер этой прибыли напрямую зависит от содержания дороги, поэтому сохранение этого процветания требует постоянного внимания к работе Прибрежной аллеи."
 
 unrecognized_rule_modifier: "Непризнанное правление"
 unrecognized_rule_modifier_desc: "Население Дахангона ожесточенно сопротивляется нашему правлению, и причина очевидна: мы пришли из далекого Катун-Кая и воспринимаемся как чужаки, пусть даже культурный разрыв с банвагулами и не является непреодолимым. Если мы хотим, чтобы местный народ принял режим Циньлиня, предстоит еще многое сделать."
 
 barely_acceptable_rule_modifier: "С трудом приемлемое правление"
 barely_acceptable_rule_modifier_desc: "Некоторые начинания Циньлиня завоевали поддержку народа банвагулов. Хотя недовольство все еще сохраняется, мы добились значительного прогресса по сравнению с начальным этапом."
 
 partially_recognized_rule_modifier: "Частично признанное правление"
 partially_recognized_rule_modifier_desc: "Для значительной части народа Дахангона монарх Циньлиня стал восприниматься мало чем отличающимся от монарха банвагулов; в наши дни они лишь изредка ворчат о том, что ими правят чужаки."
 
 blessed_rule_modifier: "Благословенное правление"
 blessed_rule_modifier_desc: "Циньлинь теперь официально считается частью Дахангона. За исключением горстки ярых традиционалистов, никому нет дела до нашего катунского происхождения; они даже начали активно подражать каждому слову и делу монарха, считая это символом благородства."

 take_over_dahangon_modifier: "Захват Дахангона"
 take_over_dahangon_modifier_desc: "Дахангон теперь находится под нашим владычеством. Завоевание чужой земли прославило нашу семью среди катунских иммигрантов Южного моря, и многие ищут нашего покровительства."
 
 shrunfan_conqueror_modifier: "Завоеватель Шрунфана"
 shrunfan_conqueror_modifier_desc: "Земли шрунфанцев уже в наших руках, и их мечта о независимости вновь оказалась разбита."
 
 legitimacy_dahangon_monarch_modifier: "Легитимный монарх Дахангона"
 legitimacy_dahangon_monarch_modifier_desc: "Древние [Concept('tilolan','тилоланы')|E] снова функционируют, и дворяне со всей страны приходят засвидетельствовать почтение в императорский дворец в Циньлине, как и в древние времена, что значительно укрепило легитимность нашего дома."
 
