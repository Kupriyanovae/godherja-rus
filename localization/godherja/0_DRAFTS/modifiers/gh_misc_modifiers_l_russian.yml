 shadow_port:0 "Тайный порт"
 shadow_port_desc:0 "Из-за действующего здесь [Concept('shadow_port','тайного порта')|E] растут преступность и оборот краденых товаров."
 
 traderoute_modifier:0 "Торговый путь"
 traderoute_modifier_desc:0 "Эта провинция расположена на крупном торговом пути, по которому в обе стороны идут товары."
 
 harbour_modifier:0 "Крупный порт"
 harbour_modifier_desc:0 "В этой провинции находится один из крупнейших портов мира, куда прибывают товары со всех концов света. Он приносит значительные доходы и привлекает новые идеи и людей со всего [Concept('aeras','Эраса')|E]."
 
 entrepot_modifier:0 "Крупный торговый центр"
 entrepot_modifier_desc:0 "Эта территория служит крупным центром торговли. Купцы привозят сюда ценные грузы даже из далёкого, почти мифического Катун-Кая, а на многолюдных рынках и в переполненных портах слышны языки более сотни народов. Здесь можно купить и продать почти всё — за подходящую цену."
 stapleport_modifier:0 "Порт приносит процветание"
 
 pirate_king:0 "[Select_CString(ROOT.Char.IsFemale, 'Королева пиратов', 'Король пиратов')]"
 pirate_king_desc:0 "Этот персонаж прослыл бичом суши, похитителем золота и губителем кораблей; его боятся на всём побережье."
 
 scourge_of_rovarska:0 "Бич Роварски"
 scourge_of_rovarska_desc:0 "Этот персонаж считается величайшим бедствием Пиратского побережья и отнял больше жизней и золота, чем само море."
 
 low_food:0 "Нехватка провизии"
 low_food_desc:0 "Из-за плохого планирования или невезения этот персонаж лишился части припасов на охоте."
 
 surplus_food:0 "Избыток провизии"
 surplus_food_desc:0 "Благодаря хорошему планированию или удаче у этого персонажа есть припасы, которых хватит намного дольше, чем ожидалось."
 
 tribal_settlement_target:0 "Идёт заселение племенами"
 tribal_settlement_target_desc:0 "В это [Concept('county','графство')|E] прибывает множество племенных поселенцев, преданных его сюзерену, что вызывает недовольство местных жителей."
 
 small_island:0 "Малые острова"
 small_island_desc:0 "Это графство представляет собой архипелаг из множества малых островов."
 large_island:0 "Крупные острова"
 large_island_desc:0 "Это графство представляет собой небольшой архипелаг из множества крупных островов."

 
 cyrat_hell_modifier:0 "Зелёный ад"
 cyrat_hell_modifier_desc:0 "Джунгли [Concept('cyrat_biozone','Кирата')|E] словно сами противятся присутствию людей и служат домом бесчисленным ужасным чудовищам. Здесь почти невозможно выжить, не говоря уже о создании цивилизации."

 cyrat_maa_modifier:0 "Невозможная логистика"
 cyrat_maa_modifier_desc:0 "В джунглях [Concept('cyrat_biozone','Кирата')|E] практически невозможно содержать профессиональную армию."

 fools_curse_modifier:0 "Золото дураков"
 fools_curse_modifier_desc:0 "[Concept('fools_coast_biozone','Берег дураков')|E] известен кажущимися неисчерпаемыми залежами золота и смертельными болезнями, которые словно следуют за местным богатством повсюду."

 opakasijan_highkingdom_modifier:0 "Столица Опахасии"
 opakasijan_highkingdom_modifier_desc:0 "Некогда опустошённые золотые холмы Опахасии вновь процветают, и люди толпами стекаются в эту могучую столицу."
 high_tide_modifier:0 "Высокий прилив"
 high_tide_modifier_desc:0 "Сейчас это графство переживает [high_tide|E], затопляющий дикие земли."
 low_tide_modifier:0 "Низкий прилив"
 low_tide_modifier_desc:0 "Сейчас это графство переживает [low_tide|E], обнажающий почву."
 religious_turmoil:0 "Религиозная смута"
 religious_turmoil_desc:0 "Это графство охвачено религиозной смутой."

 krikatama_purges_modifier:0 "Чистки Крикатамы"
 krikatama_purges_modifier_desc:0 "Безжалостные чистки, которым Бич подверг свой народ в ходе непрерывного крестового похода, серьёзно ослабили его способность продолжать военные кампании."

 banner_of_the_champion_modifier:0 "Знамя чемпиона"
 banner_of_the_champion_modifier_desc:0 "Шаху, последний оплот Дарамарджаратана в регионе, отважно сплачивает свой народ и тех, кто бежал от гнева Бича, для борьбы с самим Бичом."

 razed_sophocos_modifier:0 "Пламя Софокоса"
 razed_sophocos_modifier_desc:0 "Этого персонажа почитают и боятся по всему [Concept('sarradon','Саррадону')|E] за безжалостное разорение башни Софокоса."

 isles_naval_expedition_modifier:0 "Морские экспедиции"
 isles_naval_expedition_modifier_desc:0 "Этот персонаж организует для своей державы морские экспедиции и проекты по колонизации [Concept('shatteredisles','Расколотых островов')|E]."

 isles_retribution_modifier:0 "[Select_CString(ROOT.Char.IsFemale, 'Защитница островитян', 'Защитник островитян')]"
 isles_retribution_modifier_desc:0 "Этот персонаж взялся за оружие против предполагаемых захватчиков [Concept('shatteredisles','Расколотых островов')|E]."

 quality_arrows_modifier:90 "Высококачественные стрелы"
 quality_arrows_modifier_desc:90 "У этого персонажа есть большой запас отличных наконечников для стрел."
 barbed_arrows_modifier:90 "Зазубренные стрелы"
 barbed_arrows_modifier_desc:90 "Войска этого персонажа используют грозные и смертоносные стрелы."

 falcons_killing_rodents_modifier:90 "$cat_killing_rodents_modifier$"
 falcons_killing_rodents_modifier_desc:90 "Столица этого персонажа практически полностью избавлена от крыс."

 vitrific_grace_modifier:90 "Стеклянная грация"
 vitrific_grace_modifier_desc:90 "Вы — лучшая версия себя, отныне и навсегда."

 fogeater_recuperating:90 "Сбор сил"

 recovery_efforts_modifier:90 "Восстановительные работы"
 recovery_efforts_modifier_desc:90 "Это графство пытается восстановиться после разрушительного набега."

 county_neglect_modifier:90 "Восстановление заброшено"
 county_neglect_modifier_desc:90 "После разрушительного набега это графство оставили в запустении."

 partic_secrets_revealed_modifier:90 "Раскрытые религиозные тайны"
 partic_secrets_revealed_modifier_desc:90 "Этот персонаж раскрыл тайны и обряды своей религии посторонним."

 partic_secrets_severing_modifier:90 "Рассказ о Расколе долин"
 partic_secrets_severing_modifier_desc:90 "Этот персонаж узнал историю [Concept('the_severing_of_the_vales','Раскола долин')|E] от близкого партика."
 partic_secrets_circles_modifier:90 "Рассказ об отпрысках партиков"
 partic_secrets_circles_modifier_desc:90 "Этот персонаж узнал об [Concept('scions_of_the_greensea','Отпрысках Зеленого моря')|E] от близкого партика."
 partic_secrets_council_modifier:90 "Рассказ о Верховном совете"
 partic_secrets_council_modifier_desc:90 "Этот персонаж услышал от близкого партика рассказы о [Concept('the_druid_arch_council','Верховном совете друидов')|E]."

 extreme_desert_modifier:90 "Суровая пустыня"
 extreme_desert_modifier_desc:90 "Выжженные солнцем пески внутренних земель Саррадона делают это графство непригодным для постоянного проживания.\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -50#!"
 whisperveil_modifier:90 "Завеса шёпота"
 whisperveil_modifier_desc:90 "В глубинах Завесы шёпота скрыто множество неизвестных опасностей, и только храбрецы или глупцы — а порой и те и другие — решаются войти под густой лесной полог этого региона.\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -45#!"
 pristine_paradise_modifier:90 "Нетронутый рай"
 pristine_paradise_modifier_desc:90 "[eripomvuno_biozone|E] тысячелетиями остаётся нетронутым, несмотря на бесчисленные попытки основать здесь поселения и завладеть его богатствами.\n\n#flavor Эта цепь островов должна быть усеяна руинами десятков колоний, но её берега и по сей день остаются такими же нетронутыми, как прежде#!\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#positive_value +50#!"
 settling_ruins_modifier:90 "Освоение руин"
 settling_ruins_modifier_desc:90 "Эта колония основана на обширном комплексе руин, который даёт поселенцам укрытие и строительные материалы.\n[colonization_progress|E]: [Concept('colonization','@colonization_progress_icon!')]#positive_value +20%#!"
 legacy_of_eons_modifier:90 "Наследие эонов"
 legacy_of_eons_modifier_name:90 "Это графство вернулось к цивилизованной жизни, а его нынешние обитатели опираются на наследие своих предков."

 kadtarak_modifier:90 "Кадтарак"
 kadtarak_modifier_desc:90 "Земли вокруг Кадтарака расколоты его ударом и наполнены невидимой миазмой. Вместе с внезапными яркими вспышками она мгновенно убивает каждого, кто подходит слишком близко.\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -100#!"

 takaday_forest_modifier:90 "Лес Такадай"
 takaday_forest_modifier_desc:90 "Лес Такадай полон опасных существ и растений, представляющих смертельную угрозу для любого, кто осмелится пересечь его. На протяжении веков он служил естественной преградой, отделяющей западный Дахангон от ещё более негостеприимного востока, и лишь самые безрассудные правители рисковали вести свои армии через коварные заросли этого леса.\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -100#!"

 haryaadad_modifier:90 "Вечная ночь"
 haryaadad_modifier_desc:90 "После [Concept('sabar_lambay_raad','Сабар Ламбай Раад')|E] над Харьяададом воцарилась бесконечная ночь, и даже спустя долгое время после возвращения солнца город остаётся погружённым в непроглядный мрак.\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -60#!"

 dorajpor_modifier:90 "Последствия Чоджакаана"
 dorajpor_modifier_desc:90 "Во время [Concept('chojakaan_ka_ghatada','Чоджакаан ка Гхатада')|E] Дораджпор и его жители вспыхнули огненными столпами, а земля обратилась в пепел и прах.\n\n[habitability|E]: [Concept('habitability','@habitability_icon!')]#negative_value -50#!"

 seared_outcast_modifier:90 "Изгнанница-анохела"
 seared_outcast_modifier_desc:90 "После объявления [Concept('anohelis_outcasts','анохелой')|E] этот персонаж был изгнан с родины. Кожу головы обожгли и содрали, и раны будут заживать годами.\nНельзя развивать [Concept('trait','свойство')|E] «[GetTrait('lifestyle_gh_steppe_queen').GetName( GetNullCharacter )]»."

 former_seared_outcast_modifier:90 "Бывшая изгнанница-анохела"
 former_seared_outcast_modifier_desc:90 "Когда-то этого персонажа изгнали как [Concept('anohelis_outcasts','анохелу')|E], но позднее разрешили вернуться в общество. Раны зажили, но шрамы остались."

 silky_locks_modifier:90 "Шелковистые локоны"
 silky_locks_modifier_desc:90 "Волосы этого персонажа блестят и выглядят шелковистыми, вызывая зависть и восхищение окружающих."

 split_ends_modifier:90 "Секущиеся кончики"
 split_ends_modifier_desc:90 "Волосы этого персонажа секутся на концах, придавая ему неухоженный и растрёпанный вид."

 toxic_lye_modifier:90 "Ядовитая щёлочь"
 toxic_lye_modifier_desc:90 "Волосы этого персонажа выпали после воздействия особенно едкой щёлочи.\nНельзя продвигаться по [Concept('trait_level_track','шкале свойства')|E] «[GetTrait('lifestyle_gh_steppe_queen').GetName( GetNullCharacter )]»."

 redlander_punishment_1:90 "Цепи на сердце"
 redlander_punishment_1_desc:90 "Этот персонаж медлил с исполнением воли богов."

 redlander_punishment_2:90 "Цепи на разуме"
 redlander_punishment_2_desc:90 "Этот персонаж пренебрегал богами."

 redlander_punishment_3:90 "Цепи на душе"
 redlander_punishment_3_desc:90 "Этот персонаж вызвал на себя божественный гнев."

 mainland_refugees_modifier:90 "Беженцы с материка"
 mainland_refugees_modifier_desc:90 "Острова наводнили толпы беженцев с материка.\n\n#N Полностью исчезнет, если перейдёт под власть красноземельца или после 1274 И.С.#!"

 redlander_runaway_stopped:90 "Побег из Красных земель предотвращён"
 redlander_runaway_stopped_desc:90 "[GetHisHer] побег был сорван."

 redrunner_recruitment_effort:90 "Набор в легион"
 redrunner_recruitment_effort_desc:90 "Легион уделяет больше внимания снабжению и набору новых солдат."

 redrunner_recruitment_malus:90 "Неудачный набор"
 redrunner_recruitment_malus_desc:90 "Легион изо всех сил пытается набрать новых солдат, но без особого успеха."
 
 collapsed_administration_modifier:90 "Крах администрации"
 collapsed_administration_modifier_desc:90 "Местные администрации исчезли практически за одну ночь, ввергнув города в хаос.\n\n#N Полностью исчезнет, если перейдёт под власть неаверсарианца или после 1274 И.С.#!"

 patient_zero_modifier:90 "Нулевой пациент"
 patient_zero_modifier_desc:90 "Этот персонаж стал носителем Проклятия Плоти."

 sacked_vounill_modifier:90 "Завоеватель Вуниля"
 sacked_vounill_modifier_desc:90 "Этот персонаж печально прославился разграблением древнего [GetBuilding('01_vounill').GetName]."

 union_of_two_shores_modifier:90 "Союз двух берегов"
 union_of_two_shores_modifier_desc:90 "После объединения [Concept('kasiryat_biozone','Каширията')|E] графства вдоль реки процветают благодаря богатой торговле, идущей через их земли."

 city_of_kasiryat_county_modifier:90 "Плоды Каширията"
 city_of_kasiryat_county_modifier_desc:90 "Господствуя над [Concept('kasiryat_biozone','Кашириятом')|E], этот город внушает трепет и уважение каждому, кто его видит."
 
 disguntled_populace_modifier:90 "Недовольное население"
 disgruntled_populace_modifier_desc:90 "Сюзерен объявил жителей этого графства людьми второго сорта, вызвав возмущение и сопротивление среди крестьян."

 exiled_one_modifier:90 "Изгнанник"
 exiled_one_modifier_desc:90 "За поклонение Корлаку и отказ от учения богов-близнецов этот персонаж был изгнан с родины и теперь презираем последователями наттананской веры."

 scourge_of_the_heretics_modifier:90 "Бич еретиков"
 scourge_of_the_heretics_desc:90 "Этот персонаж — неумолимое орудие божественного гнева, которого боятся все, кто бросает вызов священным догматам наттананской веры. Благодаря непреклонному рвению земли были очищены от ереси, и нечестивцам не осталось убежища. Одно имя этого персонажа служит предупреждением и проклятием для противников истинной веры."


 restore_astilik_empire_culture_modifier: "Возрождение астиликов"
 restore_astilik_empire_culture_modifier_desc: "В это [Concept('county','графство')|E] под надзором возрождающейся [Concept('astilik_empire','Астиликской империи')|E] прибывает множество поселенцев.\nСкорость [promote_culture|E] (только для [Concept('cultures','культур')|E] с наследием «[GetCulturePillar('heritage_kherkeloi').GetName]»): #P +75%#!"

 heart_of_the_labyrinth_modifier: "Сердце Лабиринта"
 heart_of_the_labyrinth_modifier_desc: "Этот персонаж отважился пройти сквозь ненасытную тьму и достиг центра [GetBuilding('01_abandoned_labyrinth').GetName]."

 kinilam_regency_modifier: "Регент Кинилама"
 kinilam_regency_modifier_desc: "Этот персонаж правит королевством лишь как регент, а его притязание на трон стоит не больше клочка бумаги."

 legitimate_kinilam_ruler: "Законный правитель Кинилама"
 legitimate_kinilam_ruler_desc: "Этот персонаж утвердился как законный правитель Кинилама, преодолев годы регентства и застоя."
 
 legitimate_heirs_to_kinilam: "Наследники Морского трона"
 legitimate_heirs_to_kinilam_desc: "Эта династия стала правящей семьёй Кинилама и пользуется всеми положенными ей правами и привилегиями."

 domineering_culture_modifier: "Властная культура"
 domineering_culture_modifier_desc: "Жители этого графства необычайно властны и воинственны и всегда готовы навязать свою волю."

 harsh_subjugation_modifier: "Жестокое подчинение"
 harsh_subjugation_modifier_desc: "Жители этого графства изнемогают под чрезмерно суровой властью."

 adventurous_culture_modifier: "Предприимчивая культура"
 adventurous_culture_modifier_desc: "Жителей этого графства не устраивает тихая жизнь."

 lasting_unity_modifier: "Прочное единство"
 lasting_unity_modifier_desc: "Это графство процветает благодаря усилиям всех его народов."

###Misc MAA modifiers###
 siege_weapon_damage_add:0 "[Concept('damage','Урон')|E] [Concept('siege_weapon','осадных орудий')|E]"
