 kashiryan_elephant_herd_modifier_desc: "В этом владении находится небольшое племенное стадо [Concept('kashirya','каширийских')|E] слонов\nВ этом [Concept('holding','владении')|E] можно построить здание «[GetBuilding('elephant_pens_01').GetName]»"
