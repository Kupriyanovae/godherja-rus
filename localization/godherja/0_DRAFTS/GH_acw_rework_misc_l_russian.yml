 #############################################
 ##### Decisions
 ############################################# 
 gh_acw_claim_hiklahn_decision:89 "Заявить права на Амсарский Хиклахн"
 gh_acw_claim_hiklahn_decision_desc.has_blood:89 "Веками Амсарский Хиклахн определял судьбу всего региона, и его троном должны были править истинные наследники Пророка. Однако Заоран знает: не каждый, в чьих жилах течет его священная кровь, достоин ее. Я больше не могу безучастно смотреть, как его наследие порочится амбициями недостойных претендентов. Настало время вернуть Хиклахну его законное величие."
 gh_acw_claim_hiklahn_decision_desc.no_blood:89 "Веками Амсарский Хиклахн определял судьбу всего региона, а его трон захватывали те, кто лишь почивал на лаврах знатного происхождения. Но не одна только кровь делает правителем — сила, видение и решимость значат куда больше. Я не позволю цепям традиций обречь державу на угасание. Настало время заявить права на Хиклахн и вести его к новой эре величия."
 gh_acw_claim_hiklahn_decision_tooltip:89 "Я заявлю права на [GetTitleByKey('e_amsari_hiklahn').GetName]." 
 gh_acw_claim_hiklahn_decision_confirm:89 "Хиклахн будет моим!"

 gh_acw_renounce_claims_decision:89 "Отречься от своих притязаний" 
 gh_acw_renounce_claims_decision_desc:89 "Они ссорятся и воюют за клочки земли и короны лишь потому, что родились в «нужной» династии, не замечая разрушений, что оставляют их амбиции. Пусть забирают свои ничтожные титулы и пустые короны — я возвышусь над этим хаосом иными путями." 
 gh_acw_renounce_claims_decision_tooltip:89 "Отречься от притязаний на все существующие титулы." 
 gh_acw_renounce_claims_decision_confirm:89 "Будущее лежит в ином месте."
 gh_ended_acw.desc:89 "Завершает Гражданскую войну в Амсаре"

 gh_acw_reunite_amsar_decision:89 "Воссоединить Амсар"
 gh_acw_reunite_amsar_decision_desc:89 "Амсар оказался разделен правителями, ведомыми собственными неуемными амбициями. Прямо управлять каждым уголком старого Хиклахна может быть невозможно, но если каждый правитель признает персонажа [ROOT.Var('gh_amsari_civil_war_info_story').Story.MakeScope.Var('amsari_civil_war_supporting').GetCharacter.GetFirstName] законным канамсаром, я смогу убедить их объединиться под единым знаменем и восстановить Амсарский Хиклахн."
 gh_acw_reunite_amsar_decision_desc.self_pretender:89 "Регион Амсар был раздроблен правителями, поглощенными собственными неуемными амбициями. Прямо управлять каждым его уголком может быть невозможно, но если каждый правитель признает мои законные притязания как канамсара, я смогу объединить их под единым знаменем и восстановить Амсарский Хиклахн."
 gh_acw_reunite_amsar_decision_desc.no_pretender:89 "Регион Амсар остается разделенным амбициями бесчисленных правителей. Без истинного канамсара, способного объединить их, судьба державы висит на волоске. Если я смогу сплотить их поддержку вокруг единого претендента, мне удастся восстановить единство Амсарского Хиклахна."
 gh_acw_reunite_amsar_decision_tooltip:89 "Амсарский Хиклахн восстановлен."
 gh_acw_reunite_amsar_decision_confirm:89 "Пусть держава вновь станет единой!"
 gh_acw_every_ruler_support_amsari_pretender:89 "Каждый [Concept('independent', 'независимый')|E] [Concept('ruler', 'правитель')|E] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('world_ws_amsari').GetName] поддерживает вашего предпочитаемого претендента (Текущее значение: [SCOPE.ScriptValue('gh_current_number_of_pretender_supporter_value')|0]/[SCOPE.ScriptValue('gh_acw_total_amount_of_valid_rulers_value')|0])."
 gh_acw_current_non_amsari_counties_count_value_tt:89 "Культуры без корней [GetCulturePillar('heritage_zarasadari').GetName] или [GetCulturePillar('heritage_thyssae').GetName] и [Concept('faith', 'конфессии')|E] [GetReligionByKey('amsari_religion').GetName] контролируют менее [SCOPE.ScriptValue('gh_acw_target_non_amsari_counties_percent_value')|0]% [Concept('counties', 'баронств')|E] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('world_ws_amsari').GetName] (Текущее значение: [SCOPE.ScriptValue('gh_acw_current_non_amsari_counties_percent_value')|0]%)\n"
 gh_acw_reunite_amsar_decision.vassals.tt:89 "Каждый [Concept('independent', 'независимый')|E] [Concept('ruler', 'правитель')|E] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('world_ws_amsari').GetName] [Concept('vassalized', 'становится вассалом')|E] [Concept('holder', 'удерживающего')|E] титул [GetTitleByKey('e_amsari_hiklahn').GetName]"

 gh_reform_the_shattered_empire_decision_title:89 "Восстановить расколотую империю"
 gh_reform_the_obliterated_empire_decision_title:89 "Реформировать уничтоженную империю"
 gh_reform_the_shattered_empire_decision_desc:89 "Гибель и страдания амсарского народа наконец-то можно остановить. Я сделал это. Наконец Гражданская война окончена, и трон принадлежит мне."
 gh_reform_the_obliterated_empire_decision_desc:89 "Со времен Гражданской войны разрушения оставили старый Хиклахн расколотым и нереформированным. Потребуется великий лидер и завоеватель, чтобы вновь объединить эти земли." 
 gh_reform_the_shattered_empire_decision_tooltip:89 "Новая эра для Хиклахна" 
 gh_reform_the_shattered_empire_decision_confirm:89 "Воссоединить Хиклахн"
 gh_reform_the_shattered_empire_decision_tt:89 "Империя будет воссоединена, а все разрозненные вассалы вновь перейдут под вашу власть."
 gh_acw_target_percent_land_value_tt:89 "Вы [Concept('hold', 'удерживаете')|E] не менее #Z [SCOPE.ScriptValue('gh_acw_target_percent_value')|0]%#! [Concept('counties', 'графств')|E] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('world_ws_amsari').GetName] (Текущее значение: [SCOPE.ScriptValue('gh_acw_current_percent_value')|0]%)\n"

