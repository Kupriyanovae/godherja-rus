 action_gh_acw_no_supported_pretender:89 "Вы не поддерживаете претендента в Гражданской войне"
 action_gh_acw_no_supported_pretender_label:89 "Вы не поддерживаете претендента в гражданской войне"
 action_gh_acw_no_supported_pretender_desc:89 "#help Вы не объявили о своей верности ни одному претенденту. [Concept('independent', 'Независимые')|E] [Concept('rulers', 'правители')|E] могут продвигать [Concept('claim', 'притязания')|E] претендента на [GetTitleByKey('e_amsari_hiklahn').GetName] в гражданской войне.\n\nПо окончании гражданской войны и воссоединении Хиклахна активные сторонники получат [gold_i] [Concept('gold', 'золото')|E], [prestige_i] [Concept('prestige', 'престиж')|E], [piety_i] [Concept('piety', 'благочестие')|E] и, возможно, [Concept('strong_hook', 'сильное влияние')|E], если о нем удастся договориться.#!"
 action_gh_acw_no_supported_pretender_click:89 "#I Нажмите, чтобы открыть Гражданскую войну в Амсаре#!"
 
 action_gh_acw_can_call_for_banners:89 "Вы можете созвать верные знамена"
 action_gh_acw_can_call_for_banners_label:89 "Вы можете собрать верных профессионалов"
 action_gh_acw_can_call_for_banners_desc:89 "#help Вы можете призвать верных [Concept('men_at_arms', 'профессионалов')|E] под свои знамена и укрепить свою [Concept('army', 'армию')|E]. Вы получите определенное количество [Concept('special_troops', 'особых войск')|E], зависящее от уровня [Concept('house_unity', 'единства дома')|E] [GetGlobalVariable('gh_hiklahn_ruling_dynasty_var').House.GetBaseNameNoTooltip].#!"
 action_gh_acw_can_call_for_banners_click:89 "#I Нажмите, чтобы открыть взаимодействие#!"
 
