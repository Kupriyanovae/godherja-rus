l_russian:
 patron_saint_event.0101.t:1 "$medical_experiment_scheme$: Успех!"
 patron_saint_event.0101.desc:3 "Эксперименты прошли успешно."
 patron_saint_event.0101.a:0 "Отлично!"
 
 patron_saint_event.0102.t:1 "$medical_experiment_scheme$: Большой успех!"
 patron_saint_event.0102.desc:3 "Эксперименты прошли очень хорошо."
 patron_saint_event.0102.a:0 "Впечатляюще!"
 
 patron_saint_event.0103.t:1 "$medical_experiment_scheme$: Критический успех!"
 patron_saint_event.0103.desc:3 "Эксперименты дали необычайно хорошие результаты."
 patron_saint_event.0103.a:0 "Потрясающе!"
 
 patron_saint_event.0104.t:1 "$medical_experiment_scheme$: Провал!"
 patron_saint_event.0104.desc:3 "Эксперименты провалились."
 patron_saint_event.0104.a:0 "Проклятье!"
 
 patron_saint_event.0201.t:1 "Исцелять больных и помогать раненым"
 patron_saint_event.0201.desc:3 "Подражая [ROOT.Char.GetFaith.HighGodName], в какой-то момент нужно перейти от веры и молитв к решительным действиям. Разумеется, учитывая мои повседневные обязанности правителя, я едва ли могу позволить себе полностью посвятить жизнь ремеслу лекаря, так что мне придётся сузить область применения моих сил. Посвятить себя исцелению больных и раненых в моих землях — самый очевидный и эффективный шаг. С другой стороны, я [Select_CString(ROOT.Char.IsFemale, 'могла бы потратить', 'мог бы потратить' )] время на распространение учений и медицинских знаний [ROOT.Char.GetFaith.HealthGodName] среди народных масс. Ну и, конечно, всегда можно просто построить ещё один госпиталь."
 patron_saint_event.0201.a:0 "Лично исцелять больных — самый верный способ служить [ROOT.Char.GetFaith.HealthGodName]."
 patron_saint_event.0201.b:0 "Распространение медицинских знаний [ROOT.Char.GetFaith.HealthGodName] позволит людям исцелять себя самостоятельно."
 patron_saint_event.0201.c:0 "Строительство госпиталя гарантирует, что [ROOT.Char.GetFaith.HealthGodName] улыбнется мне."
 
 patron_saint_event.0210.t:1 "Исцеление больных: Провал!"
 patron_saint_event.0210.desc:3 "Превратив конюшню во временную клинику, я [Select_CString(ROOT.Char.IsFemale, 'приступила', 'приступил' )] к работе, приказав слугам обходить окрестные дома, созывать больных и раненых и тащить первого из этих бедолаг на хирургический стол. Лениво затачивая свой скальпель, я [Select_CString(ROOT.Char.IsFemale, 'приближаюсь', 'приближаюсь' )], чтобы начать свой героический и благородный труд.\n\nСледующие несколько дней проходят из рук вон плохо, и многие из тех, кто ещё может ходить, предпочитают сбежать до того, как до них дойдёт моя очередь. Честно говоря, мне приходится признать: это не лучшая моя работа. Возможно, жизнь лекаря просто не для меня?"
 patron_saint_event.0210.a:0 "Мы пытались. Это всё, что в наших силах."
 
 patron_saint_event.0211.t:1 "Исцеление больных: Успех!"
 patron_saint_event.0211.desc:3 "Превратив пристройку во временную клинику, я [Select_CString(ROOT.Char.IsFemale, 'приступила', 'приступил' )] к работе, приказав слугам приводить местных больных и раненых. Следующие несколько дней пролетают как один миг в мешанине из крови, плоти и швов. Это тяжёлый и изнурительный труд, где каждый новый пациент и каждый симптом становятся очередной загадкой и испытанием. Я задаюсь вопросом, [Select_CString(ROOT.Char.IsFemale, 'создана', 'создан' )] ли я вообще для такой жизни.\n\nВскоре я [Select_CString(ROOT.Char.IsFemale, 'оказываюсь', 'оказываюсь' )] в пустой клинике, где воздух пропитан запахом крови и болезней, а вымытые полы липнут от плоти и выброшенных бинтов. Ни один лекарь не способен спасти всех, но я могу утешаться мыслью, что мои действия здесь сохранили хотя бы несколько жизней. Честно говоря, возвращение ко двору и возможность покинуть это место приносят мне огромное облегчение."
 patron_saint_event.0211.a:0 "Мы сделали всё, что могли. Это всё, что в наших силах."

 patron_saint_event.0212.t:1 "Исцеление больных: Критический успех!"
 patron_saint_event.0212.desc:3 "Превратив пристройку во временную клинику, я [Select_CString(ROOT.Char.IsFemale, 'приступила', 'приступил' )] к работе, приказав слугам приводить местных больных и раненых. Следующие несколько дней пролетают как один миг в мешанине из крови, плоти и швов. Вскоре мой азарт при виде каждого нового пациента сменяется профессиональной отстранённостью: любая кровоточащая рана, бубон или набор симптомов укладываются в привычный шаблон.\n\nВскоре я [Select_CString(ROOT.Char.IsFemale, 'оказываюсь', 'оказываюсь' )] в пустой клинике, где воздух пропитан приторным запахом трав и подсохшей крови, истощённый после многих бессонных ночей работы. И хотя тех, чья участь была предрешена, нам пришлось отправить домой с сильным успокоительным в надежде облегчить страдания в их последние дни, в целом я [Select_CString(ROOT.Char.IsFemale, 'чувствую', 'чувствую' )] расцветающую гордость за те жизни, которые мне удалось спасти."
 patron_saint_event.0212.a:0 "[ROOT.Char.GetFaith.HealthGodName] улыбается мне."
 
 patron_saint_event.0220.t:1 "Распространение медицинских знаний: Провал!"
 patron_saint_event.0220.desc:3 "Отправившись пешком с несколькими слугами, я [Select_CString(ROOT.Char.IsFemale, 'начинаю', 'начинаю' )] объезд близлежащих деревень. Хотя это всего лишь короткая прогулка по местным окрестностям, я полна надежд, что нам удастся внушить немытым массам добродетели [ROOT.Char.GetFaith.HealthGodName] или, по крайней мере, знатно отчитать их за невежество.\n\nВ каждом деревенском собрании нас встречают скептические и сварливые толпы, и несколько раз мне приходится кричать, привлекая к себе внимание сквозь насмешки и оскорбления. Хотя я не [Select_CString(ROOT.Char.IsFemale, 'уверена', 'уверен' )], сколько из этого они действительно усвоили, я по крайней мере [Select_CString(ROOT.Char.IsFemale, 'довольна', 'доволен' )] пониманием того, что когда их раны загноятся от инфекции, а дети рождаются больными из-за того, что они не слушали моих проповедей, это будет исключительно их вина!"
 patron_saint_event.0220.a:0 "Честно говоря, зачем тратить время на обучение ослов?"
 
 patron_saint_event.0221.t:1 "Распространение medical знаний: Успех!"
 patron_saint_event.0221.desc:3 "Взяв несколько вьючных животных с припасами, мы начинаем объезд близлежащих деревень. Хотя это всего лишь короткая прогулка по местным окрестностям, я вполне [Select_CString(ROOT.Char.IsFemale, 'надеюсь', 'надеюсь' )], что нам удастся внушить местным деревенщинам важность добродетелей [ROOT.Char.GetFaith.HealthGodName].\n\nМы проделываем хорошую работу. Я читаю местным лекции о первых признаках болезней и показываю, как правильно утилизировать нечистоты. Нескольким из тех, кто кажется особенно смышлёным, я [Select_CString(ROOT.Char.IsFemale, 'пытаюсь', 'пытаюсь' )] объяснить, как промывать и перевязывать раны. К моему раздражению, часть этих обсуждений перерастает в жаркие споры, где тисийские учения сталкиваются с догматическими суевериями крестьянства. Тем не менее, возвращаясь домой в конце дня, я [Select_CString(ROOT.Char.IsFemale, 'думаю', 'думаю' )], что мне удалось переубедить хотя бы нескольких из них."
 patron_saint_event.0221.a:0 "Что ж, для начала сойдут и малые шаги."

 patron_saint_event.0222.t:1 "Распространение медицинских знаний: Критический успех!"
 patron_saint_event.0222.desc:3 "Отправившись в путь с повозкой, гружёной припасами, и манекеном для демонстраций, мы начинаем объезд близлежащих деревень. Хотя это всего лишь короткая прогулка по местным окрестностям, я вполне [Select_CString(ROOT.Char.IsFemale, 'надеюсь', 'надеюсь' )], что нам удастся внушить местному крестьянству важность добродетелей [ROOT.Char.GetFaith.HealthGodName].\n\nПовитух я [Select_CString(ROOT.Char.IsFemale, 'обучаю', 'обучаю' )] основам акушерства. Деревенских старейшин я [Select_CString(ROOT.Char.IsFemale, 'учу', 'учу' )] распознавать ранние признаки приближающейся чумы. Всех подряд я [Select_CString(ROOT.Char.IsFemale, 'учу', 'учу' )] тому, как вправлять сломанные конечности, правильно промывать и бинтовать раны, а также базовым правилам гигиены для здоровой жизни. Вскоре я уже [Select_CString(ROOT.Char.IsFemale, 'направляюсь', 'направляюсь' )] обратно домой, [Select_CString(ROOT.Char.IsFemale, 'усталая', 'уставший' )], но [Select_CString(ROOT.Char.IsFemale, 'довольная', 'довольный' )] результатами дня, проведённого в проповедях."
 patron_saint_event.0222.a:0 "Думаю, на этот раз это действительно отложилось у них в головах!"
 
 patron_saint_event.0230.t:1 "Строительство госпиталя: Провал!"
 patron_saint_event.0230.desc:3 "Мы переоборудуем местный амбар и ставим вокруг него несколько лачуг под склады. Местных лекарей за ту цену, что мы предлагаем, найти не удалось, поэтому вместо них нам приходится довольствоваться травником, осуждённым за продажу ядов; в обмен на помилование он просто не может позволить себе отказаться от этой работы.\n\nВынужден [Select_CString(ROOT.Char.IsFemale, 'признать', 'признать' )], что конечный результат — это совсем не то, что я [Select_CString(ROOT.Char.IsFemale, 'имела', 'имел' )] в виду, но временный госпиталь всё же лучше, чем совсем ничего!"
 patron_saint_event.0230.a:0 "И так сойдёт."
 
 patron_saint_event.0231.t:1 "Строительство госпиталя: Успех!"
 patron_saint_event.0231.desc:3 "Принудительно согнав всех лекарей и учёных, каких только удалось отыскать в округе, я [Select_CString(ROOT.Char.IsFemale, 'направляю', 'направляю' )] местных плотников и каменщиков на постройку моего госпиталя. Конечный результат представляет собой грубое здание, но оно должно быть вполне пригодным для дела. Довольно скоро к нам устремляется нескончаемый поток местных крестьян и горожан, жаждущих получить помощь."
 patron_saint_event.0231.a:0 "Сгодится!"

 patron_saint_event.0232.t:1 "Строительство госпиталя: Критический успех!"
 patron_saint_event.0232.desc:3 "[Select_CString(ROOT.Char.IsFemale, 'Собрав', 'Собрав' )] и наняв всех лекарей, повитух и травников в округе, я [Select_CString(ROOT.Char.IsFemale, 'направила', 'направил' )] местных плотников и каменщиков на постройку моего госпиталя. Архитектурно он не слишком сложен: ряд складских помещений, сосредоточенных вокруг центрального зала с койками, и скромный административный аппарат. У нас нет времени ни на что, кроме того, что необходимо для заботливого и священного искусства исцеления."
 patron_saint_event.0232.a:0 "Простой и чистый госпиталь."