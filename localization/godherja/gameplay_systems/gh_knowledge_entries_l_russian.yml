 # Aeltheniax' Anatomy, Volume I #
 #################################
 basics_of_human_anatomy_name: "Основы человеческой анатомии"
 basics_of_human_anatomy_desc: "Поверхностный обзор функционирования человеческого тела."
 three_humors_name: "Три гумора"
 three_humors_desc: "#weak «#BOL Пиракс#! — самое славное из исхождений #BOL Кайроса#!, ревущий огонь истинной жизни. Это также самая мимолётная фаза крови, превращающаяся в менее переменчивый #BOL Сингос#! по мере того, как её закаляет дыхание. Загрязнённый #BOL Элемохис#! — последняя и самая низменная жидкость, чьё пламя гаснет от холода материального мира; у здоровых людей он возникает лишь как короткая фаза перед воссозданием в сердце, но для тех созданий, что не обладают #BOL Кайросом#!, это единственная форма крови, текущая в их венах. Многие недуги являются результатом дисбаланса этих трёх начал, и методы восстановления гармонии в этом цикле будут описаны в следующих главах.\n\nОднако, как мудро отмечал великий мастер Мнестрион, лучшее лекарство — профилактика: ведение жизни, подобающей потомку Первых людей, и избегание пороков».#!"
 mechanics_of_the_heart_name: "Механика сердца"
 mechanics_of_the_heart_desc: "#weak «Сердце — это обитель #BOL Кайроса#!; именно в нём его божественное прикосновение смешивается с истощённым #BOL Элемохисом#!, обновляя его и превращая в огненный #BOL Пиракс#!. Поток разбавленной крови в его камеры и её обогащение — не что иное, как один из самых совершенных механизмов в бытии, полное понимание которого, безусловно, непостижимо ни для кого, кроме Чистейших, но некоторые скромные крупицы знаний о его великой работе всё же собраны на этих страницах».#!"
 theorem_resonant_heartbeat_name: "Теорема резонансного сердцебиения"
 theorem_resonant_heartbeat_desc: "#weak «Все человеческие сердца бьются в один мотив, хотя со времён падения Первой империи и разбавления людской крови их ритмы всё сильнее расходятся. Животные и гуманоиды, лишённые #BOL Кайроса#!, оторваны от этого первозданного такта, и их нутро вместо этого механически пульсирует в странном и зачастую аритмичном темпе.\n\nПри надлежащем применении [Concept('gift','Дар')|E] позволяет услышать благоговейное эхо этого первого сердцебиения. Многие [Concept('ritual','ритуалы')|E] также требуют действовать в строгом тандеме с ним, поэтому будущему практикующему настоятельно рекомендуется заучить эти методы».#!"

 ##################################
 # Aeltheniax' Anatomy, Volume II #
 ##################################
 # rite_of_the_iron_vitae_name: "Rite of the Iron Vitae" Duplicate of Spell loc
 rite_of_the_iron_vitae_desc: "#weak «Таким образом, чтобы не дать подопытному погибнуть от преждевременного исхождения кровью во время самых тяжёлых хирургических вмешательств, необходим метод сдерживания кровопотери».#!"
 methods_of_vivisection_name: "Методы вивисекции"
 methods_of_vivisection_desc: "#weak «...хотя применение этих успокаивающих отваров настоятельно рекомендуется для начинающих вивисекторов, притупление чувств подопытного иногда нежелательно. В таких ситуациях наиболее распространённым решением является использование более слабого паралитика в сочетании с обычными путами; описанный ранее аппарат для переливания можно приспособить и для этой цели, как видно из приложенного чертежа. Для самых деликатных операций, например, на сердце или мозге, даже этого недостаточно — рекомендуемые техники для подобных случаев будут описаны далее».#!" 
 vitae_extraction_and_storage_name: "Извлечение и хранение жизненной силы"
 vitae_extraction_and_storage_desc: "#weak «#BOL Сингос#! следует хранить в сосудах из сплава, содержащего не менее трёх четвертей золота, никогда не подвергая воздействию мороза или избыточного количества внешних загрязнений. Он сохраняет свою полную силу до наступления следующей зимы, хотя капля алхимического раствора репешка в красном вине иногда может предотвратить его порчу до первых весенних цветов».#!"
 the_five_torments_procedure_name: "Процедура Пяти Мучений"
 the_five_torments_procedure_desc: "Мучительный жертвенный ритуал, считавшийся самым эффективным и могущественным в своём роде среди всех известных [Concept('living_magic', 'живой магии')|E]. Тем не менее на практике он проводился крайне редко из-за своей сложности и сопутствующих затрат."
 applied_mutations_and_flesh_grafting_name: "Прикладные мутации и трансплантация плоти"
 applied_mutations_and_flesh_grafting_desc: "Посредством хирургического вмешательства и контролируемых мутаций можно исказить облик подопытного до неузнаваемости, не убивая его при этом окончательно. Здесь задокументированы методы того, как это сделать, а также некоторые „творческие“ идеи по применению этих знаний."

 
