 ##################
 # ARCANA - TOOLS #
 ##################

 sacrificial_dagger_cleaning_and_maintenance_name: "Очистка и уход за ритуальным кинжалом"
 sacrificial_dagger_cleaning_and_maintenance_desc: "Огромное количество арканной энергии, воздействию которой подвергаются жертвенные кинжалы, может физически повредить их и сделать непригодными для использования. Если придерживаться этих указаний, то подобный риск значительно снизится."
 astrolabe_operation_name: "Работа с астролябией"
 astrolabe_operation_desc: "Хотя астролябия является крайне полезным инструментом как в навигации, так и в определённых видах [Concept('magic','магии')|E], научиться обращаться с ней бывает непросто. Этот текст служит руководством, призванным помочь в данном процессе."
 brazier_construction_name: "Создание жаровни"
 brazier_construction_desc: "Большинство практикующих магов мало задумываются о том, какие жаровни они используют в своём искусстве. Тем не менее, будучи изготовленными из определённых металлических сплавов, они могут сами по себе служить усилителями ритуалов, а не просто сосудами."

 ##################
 # ARCANA - LIGHT #
 ##################
 
 warding_mirrors_name: "Особенности оберегающих зеркал"
 warding_mirrors_desc: "#weak «Оберегающие зеркала создаются путём покрытия отражающего металла (предпочтительно серебра) звёздным светом посредством ритуала, проводимого под безлунным небом. В то время как другие металлы, такие как бронза или олово, также могут использоваться в качестве основы, серебро обладает уникальным свойством сопротивляться осквернению более тёмной магией».#!"
 mirror_spirit_interaction_name: "Наблюдения за материальными проявлениями"
 mirror_spirit_interaction_desc: "#weak «Духи, упыри и прочие бесплотные чудовища питают странное отвращение к созерцанию собственных отражений. Хотя их уродливые лики обычно не отражаются, звёздный свет внутри оберегающего зеркала соприкасается с душами тех, кто в него смотрится, создавая отпечаток, который проступает на зеркальной поверхности...».#!"
 mirror_lich_interaction_name: "Приложение XVI: О личах"
 mirror_lich_interaction_desc: "#weak «В то время как некоторые из их немёртвых собратьев уязвимы для собственных отражений, личи не испытывают подобного отвращения. Напротив, они, похоже, даже восхищаются своими ликами, а особо тщеславные экземпляры, как известно, проводят часы, если не дни, любуясь собой — эту причуду сообразительные антимаги используют в своих интересах».#!"
 laser_beam_spell_ke_name: "Размышление над извлечёнными уроками"
 laser_beam_spell_ke_desc: "Чистая страница, которая, судя по всему, целиком сделана из серебра. Если подставить её под звёздный свет, не осквернённый влиянием [Concept('aervalr','Эрвала')|E], то в самом её центре проявится единственная витиеватая руна в стиле древнего Шевигада."

 #################
 # ARCANA - Dark #
 #################
 ship_quarreling_lover_name: "Свидетельство с торгового судна «Вздорный любовник»"
 ship_quarreling_lover_desc: "Запись показаний мага света Дриорис, единственной выжившей со «Вздорного любовника». Её нашли бессвязно бормочущей в луже чернильной субстанции, а на её плоти были вырезаны руны неизвестного происхождения."
 empty_island_corvanor_name: "Опустевший остров Корванор"
 empty_island_corvanor_desc: "Корванор был пристанищем воров, пока внезапно и необъяснимо не опустел. После того как бесследно пропало несколько поисковых групп, остров подвергался тщательной бомбардировке в течение нескольких дней. Следующая экспедиция успешно вернулась с обнаруженными в убежище записями о сводящей с ума тишине и исчезновениях."
 nature_of_shade_infestation_name: "Природа засилья теней"
 nature_of_shade_infestation_desc: "В этом документе подробно изложены труды мага Атер---- по документированию теней. Пропадающие люди, угасание арканного света и необычайная тишина были частыми историями среди выживших. В конце концов жажда знаний мага стала слишком велика, и он сгинул в древних руинах. С тех пор его имя постепенно «вымывалось» из всех документов, а сам его облик и описание стали лишь делом минувших дней."
 fall_of_relar_outpost_name: "Падение аванпоста Релар"
 fall_of_relar_outpost_desc: "Отчёт единственного выжившего с аванпоста Релар, исследовательской станции Видваукиятрана, предназначенной для изучения небольшой группы недеятельных теней в близлежащих руинах. Исследователи были на пороге прорыва, когда их атаковали тени, встревоженные их присутствием. Автор сумел спастись, обратившись в ветер, но перед этим получил рану в форме руны, которая медленно пожирала как его конечность, так и его магию."
 tales_of_extinction_name: "Сказания об истреблении"
 tales_of_extinction_desc: "Уцелевшие фрагменты главы, повествующей о падении различных городов и общин под натиском теней на протяжении всей истории. Данный том рассказывает о падении города Виайль и истреблении френдиров. Любопытно, что остальная часть главы не то чтобы утеряна, а скорее превращена неизвестным способом в нечитаемую бессмыслицу."
 on_embalming_name: "О бальзамировании"
 on_embalming_desc: "Ойчизаны разработали сложные методы бальзамирования для сохранения тел, пройдя через многие века проб и ошибок. Благодаря этому их понимание человеческого тела было практически непревзойдённым для своего времени."
 burial_rituals_name: "Погребальные ритуалы"
 burial_rituals_desc: "Период времени от кончины до погребения в ойчизанском обществе был долгим и сложным процессом. Множество обрядов совершалось по мере бальзамирования тела, дабы помочь душе и выразить почтение почтенному усопшему."
 funeral_dirges_name: "Похоронные плачи"
 funeral_dirges_desc: "Похороны у ойчизанов сопровождались долгими распевными гимнами, прославляющими покойного и дарующими защиту его духу. Хотя многие из этих песен были утеряны, те немногие, что уцелели в записях, были переведены здесь."

 ##################
 # ARCANA - BLOOD #
 ##################
 # Runes
 rune_four_valves_name: "Руна Четырёх Клапанов"
 rune_four_valves_desc: "Грудь сжимается при одном взгляде на эту руну, которую можно правильно начертать лишь с помощью концентрированной жизненной силы."
 
 # Other
 kei_kassidius_diagrams_name: "Пневматические диаграммы"
 kei_kassidius_diagrams_desc: "Бесчисленные диаграммы иллюстрируют то, как души разрываются на части под колоссальным магическим давлением. Невозможно не содрогнуться перед ужасной тщетностью всего этого. Столько смертей, а Кассидиус так и не нашёл убедительных доказательств того измеримого различия, которое он с таким упорством стремился обнаружить."
 
 ##################
 # ARCANA - STONE #
 ##################

 preliminary_results_name: "Предварительное расследование"
 preliminary_results_desc: "Одним из первых великих деяний, совершённых магом Приалис в Шевалье, стало выяснение того, каким образом презираемый придворный маг Виридиви был обращён в камень. Подозревая простое заклинание окаменения, часто используемое аверсианскими магами, она приказала отсечь кусок камня, поскольку заклинание превращало в камень только кожу, оставляя плоть под ней нетронутой."
 agata_rebirth_ke_name: "Возможное каширское заклинание"
 agata_rebirth_ke_desc: "После того как долото не помогло, по руке мага ударили молотом, обнаружив, что рука полностью окаменела, вплоть до костей! Приалис сверилась с днём свадьбы, поскольку заклинание такой силы потребовало бы заметного ритуального рисунка, высеченного под целью. Она приказала убрать статую и вскрыть пол вокруг неё, предполагая, что это могло быть каширское заклинание «Возрождение Агаты», из-за которого тело объекта превращалось в камень по направлению от костей наружу."
 anti_magi_cockatrice_name: "Новый след"
 anti_magi_cockatrice_desc: "Под полом, на маге или в окружающих комнатах не было никаких признаков ритуала. Тогда Приалис предложила осмотреть покои придворного мага. Внутри обнаружилась переписка мага с антимагами, которым было поручено выследить кокатрикса. Маг просил заряженный глаз кокатрикса, отмечая, что в день свадьбы будет полнолуние, а герцог хотел сделать особое кольцо с использованием магии этого глаза. Приалис была поражена, ведь ей говорили, что свадьба состоялась на две недели позже, когда луна была уже не так сильна. Герцога необходимо было допросить."
 killer_discovered_name: "Убийца разоблачён"
 killer_discovered_desc: "Прежде чем допросить герцога, Приалис связалась с упомянутым орденом антимагов и узнала, что два заряженных глаза кокатрикса были доставлены в замок и получены братом герцога за день до свадьбы. Приалис, собрав антимагов и Отца пути, вывела герцога на чистую воду. Герцог признался, что его брат использовал глаза кокатрикса, дабы убить придворного мага в свете полнолуния. Брат герцога был взят под стражу для предания суду, а Приалис отправилась навстречу своему следующему приключению."

 ######################
 # ARCANA - CELESTIAL #
 ###################### 
 
 detecting_malice_meditation_name: "О выслеживании ведьмы"
 detecting_malice_meditation_desc: "Запутанная история о том, как сонастройка собственной души с сущностью космоса позволяет обнаруживать источники вредоносной магии."
 spirit_interaction_rules_name: "Духи и эли"
 spirit_interaction_rules_desc: "Список правил, которых необходимо придерживаться при общении с мертвецами, заканчивающийся перечнем элей, которые духи находят восхитительными."
 aervalr_reading_name: "Как Эрвал направляет нас"
 aervalr_reading_desc: "Вердан утверждает, что путь [Concept('aervalr','Эрвала')|E] предначертывает ход человеческой жизни. Он перечисляет, как различные фазы Эрвала на определённых этапах жизни могут приводить к благоприятным исходам."
 star_cards_name: "Звёздные карты"
 star_cards_desc: "В этом разделе перечислен 51 самый распространённый вид «Звёздных карт», включая то, как толкователь может интерпретировать каждую из них. Эти трактовки могут разительно отличаться в зависимости от условий, в которых карты были вытянуты."

 ##################
 # ARCANA - DREAM #
 ##################

 dream_maps_empyrean_tower_name: "Сонные карты Эмпирейской башни"
 dream_maps_empyrean_tower_desc: "Исследователи [Concept('aspect_dream', 'Грёз')|E] время от времени высказывали предположение, что существует определённая [Concept('the_towers','Башня')|E], доступная только спящему разуму. Эта часть труда, судя по всему, отображает её предполагаемую структуру, хотя текст с тем же успехом может быть полной бессмыслицей."
 key_of_the_obsidian_gate_ke_name: "Ключ от Обсидиановых врат"
 key_of_the_obsidian_gate_ke_desc: "Если бы сны были театром теней, то этот ритуал позволил бы заглянуть за занавес — но лишь ненадолго."
 wakeless_glass_name: "Часть 1: Будничные вещи"
 wakeless_glass_desc: "Известно, что в простынях Непробудных скапливается морское стекло размером с гальку. Влажное на ощупь, оно слабо светится, словно подсвеченное со всех сторон невидимым солнцем, что время от времени прерывается движением нечётких теней. Практическое применение почти неизвестно."
 wakeless_rubies_name: "Часть 2: Красоты"
 wakeless_rubies_desc: "На рубины, что скапливаются в ротовой и носовой полостях Непробудных, нельзя смотреть прямо. Несмотря на свою красоту, они, как известно, внушают навязчивые и пагубные мысли. Говорят, что некоторые из них приносят пользу, однако безопасного способа отличить их друг от друга не существует."
 wakeless_fire_name: "Часть 3: Невозможности"
 wakeless_fire_desc: "Хотя это и редкость, меры предосторожности против проявления холодных углей требуют, чтобы Непробудные бережно хранились в деревянных постройках. Они сжигают камень, но оставляют обычные горючие материалы невредимыми."
 wakeless_incomprehensibilities_name: "Часть 4: Непостижимости"
 wakeless_incomprehensibilities_desc: "Известно, что различные сущности могут проскальзывать сквозь прорехи в душе Непробудного. Когда Безликие люди и Безликие псы начинают появляться, таясь в коридорах и за открытыми дверями, [Concept('magi','маги')|E] должны приложить все усилия, чтобы укрепить обереги вокруг Непробудного. Незваные гости стремятся унести Непробудного с собой, хотя никто не знает куда."
 neverending_dream_appendices_name: "Анонимные приложения"
 neverending_dream_appendices_desc: "Собрание энциклопедических сведений о природе разума, поведанных аптийскими сновидцами, с маргиналиями и прикреплёнными заметками составившего их аверсианского учёного. В лучшем случае они фрагментарны, в худшем — бессвязны, однако сохранилось достаточно, чтобы приоткрыть завесу тайны над скрытым миром."
 neverending_dream_geese_questions_name: "Гусиные вопросы"
 neverending_dream_geese_questions_desc: "#weak «Мальчик обнаружил себя среди шуршащих ив и мирного течения глубокого тёмного пруда. Он стоит посреди него по пояс в воде, тёплой и утешительной. Напротив сидит мудрая Гусыня со своими гусятами. Она ступает, не оставляя следа, по зачернённой воде, дабы задать мальчику вопрос, а он — ей. О чём именно, он бы не поведал».#!"
 neverending_dream_roar_of_the_king_name: "Рёв Короля"
 neverending_dream_roar_of_the_king_desc: "#weak «Мальчика призвали предстать пред Королём. Он был кроток и робок, его стражники своим весом отмеряли каждый его слабый шаг во время шествия к Королю. На самом высоком троне в праздной неге восседал Король, но стоило мальчику явиться, как Король взревел громом среди ясной ночи и отослал его прочь. Король призывал к себе мальчика снова и снова, пока тот не научился выдерживать эту бурю».#!"
 neverending_dream_spider_queen_name: "Королева пауков"
 neverending_dream_spider_queen_desc: "#weak «Мальчик путешествовал по рисованным пейзажам и акварельным ручьям в поисках дороги домой. Изменчивый звёздный свет ничем не помог мальчику. Прыгающие овцы тоже. Каждый отказывал мальчику, пока наконец он не обратился к Королеве пауков. Она согласилась исполнить его желание с условием, что он унесёт её паутину с собой, дабы, когда ей вздумается, она тоже могла уйти».#!"

 ################
 # ARCANA - AIR #
 ################
 
 wingspan_pinion_name: "Размах крыла, Маховое перо"
 wingspan_pinion_desc: "Совиное крыло разобрано, каждый слой мышц обнажён. Понаблюдайте за изящным взмахом маховых перьев. Понаблюдайте за пятнами, посмотрите, где их узоры начинают складываться в бесформенные руны."
 digits_talons_name: "Пальцы, Когти"
 digits_talons_desc: "Мощные когти обнажены предо мной, внутренности распластаны по странице чернильным вихрем. Заметьте, что длина и изгиб третьего пальца соответствуют теореме Галлемана. Обратите внимание на странные следы когтей, которые вы обнаружите на своём подоконнике в предрассветном свете."
 lenses_oracle_name: "Линзы, Оракул"
 lenses_oracle_desc: "Глаза аккуратно вырезаны, их линзы и волокна обнажены. Заметьте, что ни одна ложь не укроется от их проницательного взора. Заметьте, что ваше собственное ощущение себя — ложь. Наблюдайте за собой в своих снах через вспыхивающие линзы, которые вам не принадлежат."
 
 ##################
 # ARCANA - WATER #
 ##################
 
 sea_queens_domain_name: "Владения Морской королевы"
 sea_queens_domain_desc: "Истории и песни о героях широко распространены среди жителей Западных островов, но не менее многочисленны и сказания о владыках глубин, столь же странных и загадочных, как и их непостижимые владения. \n\n Известнейшей среди них является Морская королева — мифическая фигура, правившая королевством под волнами. Легенда гласит, что когда-то она была заклинательницей песен, усмирявшей моря песнями соли, но отвергнутой собственным племенем. С горя она ушла в море, и с тех пор раскаявшееся население почитает её как хранительницу и защитницу душ утонувших моряков."
 admiral_of_the_deep_name: "Рикобер, адмирал глубин"
 admiral_of_the_deep_desc: "Грозный пиратский правитель Западных островов, Рикобер был известен тем, что уводил свою армаду вглубь Аверсарии ради захвата несметных богатств, и пользовался дурной славой даже из-за набегов на собратьев-пиратов. Однако его крах наступил тогда, когда он разграбил местное святилище Морской королевы, навлекая на себя её гнев. \n\n Несколько ночей спустя изнурённые защитники другого острова, подвергшегося набегу, услышали разносившуюся над водой пронзительную мрачную песнь, за которой последовали титанические волны, сковавшие великую армаду. Рикобер и его флот были утянуты на самое дно морское, где, как говорят, они и по сей день служат Морской королеве её немёртвыми рабами."
 minstrel_of_the_reef_name: "Гелиод, менестрель рифа"
 minstrel_of_the_reef_desc: "Знаменитый неофретитанский менестрель Гелиод путешествовал по Аэрасу в поисках новых песен и историй, способных вдохновить окружающих. Во время плавания в Шевалье на менестреля напал змееподобный зверь (якобы из-за его пения), и он потерпел кораблекрушение у острова, жители которого поклонялись Морской королеве. \n\n Заинтригованный песнями своих спасителей, он в знак благодарности начал слагать собственные оды Морской королеве, которые, как говорят, пришлись ей по душе. Согласно легенде, в обмен на его службу она обучила Гелиода своему собственному ремеслу, и после этого менестрель странствовал по островам, принося радость и штиль своими песнями — некоторые утверждают, что даже после своей кончины."
 
