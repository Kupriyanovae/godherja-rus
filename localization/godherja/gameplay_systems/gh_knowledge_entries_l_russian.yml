 botany_wildgrass_desc: ""
 botany_hawthorn_name: "Ботаника: Боярышник"
 botany_hawthorn_desc: ""
 botany_hemlocks_name: "Ботаника: Болиголов"
 botany_hemlocks_desc: ""
 botany_horsetails_name: "Ботаника: Хвощ"
 botany_horsetails_desc: "Хвощ буйно разрастается в сырости, и особенности его роста служат отличным указателем мест, подходящих для сотворения могущественных заклинаний [Concept('magic','магии')|E] [Concept('aspect_water', 'Воды')|E]."
 botany_lightbane_name: "Ботаника: Бич света"
 botany_lightbane_desc: ""
 botany_lilies_name: "Ботаника: Лилии"
 botany_lilies_desc: ""
 botany_monkshoods_name: "Ботаника: Аконит"
 botany_monkshoods_desc: ""
 botany_passionflower_name: "Ботаника: Страстоцвет"
 botany_passionflower_desc: "" 
 botany_pepper_name: "Ботаника: Перец"
 botany_pepper_desc: "Помимо использования в качестве специи, перечная лоза также является отличным ингредиентом для [Concept('magic','магии')|E] [Concept('aspect_fire', 'Огня')|E]. Однако не все её разновидности одинаково сильны, и даже конкретный метод их измельчения может повлиять на эффективность." 
 botany_prunes_name: "Ботаника: Чернослив"
 botany_prunes_desc: "" 
 botany_roses_name: "Ботаника: Розы"
