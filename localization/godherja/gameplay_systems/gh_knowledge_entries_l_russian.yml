 # ARCANA - NATURE #
 ###################

 arl_janvreep_world_tree_weddings_in_the_glade_name: "Свадьбы на поляне"
 arl_janvreep_world_tree_weddings_in_the_glade_desc: "На этих гравюрах изображён ряд свадеб и празднеств в самых разных местах, участники которых наслаждаются едой, весельем и магией. Сквозь страницу можно почувствовать тепло бушующих костров."
 arl_janvreep_world_tree_mid_summer_name: "Мировое древо, Середина лета"
 arl_janvreep_world_tree_mid_summer_desc: "На этой гравюре изображено массивное дерево, возвышающееся над всем миром. Густые леса и скалистые горы казались лишь травой и грязью на фоне его колоссальных размеров. От него трудно отвести взгляд."
 arl_janvreep_world_tree_autumn_prayer_name: "Осенняя молитва"
 arl_janvreep_world_tree_autumn_prayer_desc: "Описание Жанврипа расплывчато, а рисунок углём нечёток, но это, по-видимому, подробно описывает особый обычай, который друиды исполняли в конце сезона сбора урожая, дабы подготовить поля к зиме."



