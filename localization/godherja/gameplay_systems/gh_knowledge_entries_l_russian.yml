 botany_agrimony_name: "Ботаника: Репешок"
 botany_agrimony_desc: "Часто используемый в медицинских целях, этот жёлтый дикорастущий цветок при сжигании в больших количествах выделяет пары, способные навевать сон." 
 botany_berries_name: "Ботаника: Ягоды"
 botany_berries_desc: "" 
 botany_carnation_name: "Ботаника: Гвоздика"
 botany_carnation_desc: "Ярко окрашенный цветок, произрастающий на Расколотом побережье. В наши дни гвоздику гораздо чаще можно встретить в садах, нежели в дикой природе. Ассоциируясь с вожделением и навязчивой любовью, она нередко выступает ингредиентом в дешёвых любовных зельях." 
 botany_celeries_name: "Ботаника: Сельдерей"
 botany_celeries_desc: "" 
 botany_cinnamon_name: "Ботаника: Корица"
 botany_cinnamon_desc: ""
 botany_dandelions_name: "Ботаника: Одуванчик"
 botany_dandelions_desc: "Иногда высказывалось предположение, что полет семян скромного одуванчика вовсе не случаен; те, кто обладает соответствующими знаниями, могут использовать траекторию их движения для поиска мест силы и обнаружения потоков окружающей [Concept('magic','магии')|E]."
 botany_goldwool_name: "Ботаника: Златорунник"
 botany_goldwool_desc: ""
 botany_grapes_name: "Ботаника: Виноград"
