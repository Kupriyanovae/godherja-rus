 bone_marrow_hematology_name: "Остеогематология"
 bone_marrow_hematology_desc: ""
 
 wisrutu_name: "Висруту «Песнь реки»"
 wisrutu_desc: "Весёлая и шуточная песня о миграции рыб в реке, ныне зовущейся Патос."
 iltyds_lament_name: "Плач Ильтида"
 iltyds_lament_desc: "Трагический плач, повествующий о запретной любви пары. Песнь заканчивается гибелью Ильтида в битве против звездочётов, а его возлюбленная обречена вечно блуждать по лесу."
 choir_of_laughing_shadows_name: "Хор смеющихся теней"
 choir_of_laughing_shadows_desc: "Небольшое собрание полуисторических песен, повествующих о горстке легендарных личностей и конфликтах их потомков с древними чудовищами, рождёнными корнями."
 spring_blessing_name: "Весеннее благословение"
 spring_blessing_desc: "Эту песню полагалось исполнять в первый день весны, дабы принести деревне удачу на весь сезон. Впрочем, некоторые способны пробудить с её помощью нечто большее, чем просто везение."
 the_fell_one_name: "Лютый"
 the_fell_one_desc: "Значительное по своей длине эпическое произведение, оплакивающее трагическое насилие в Лесу, пока древняя тьма прочёсывает чащобы."
  
 testament_to_yunusfur_el_qulatha_name: "Очищение Эль-Кулаты"
 testament_to_yunusfur_el_qulatha_desc: "#weak \«Когда пророчица Юнусфур пришла в великий город Мамура, она увидела, что люди его тщеславны; ибо они не молились в храмах, а вместо этого шли в бани, дабы ими восхищались, и чтобы поклоняться собственным телам. И Юнусфур велела своим ученикам: „Ступайте и найдите каждую третью из этих обителей греха и разрушьте их“, и они исполнили это. И судья Мамура предстал перед Юнусфур и молвил ей: „Зачем ты так нарушаешь покой? Народ разгневан, ибо они любят бани, а ты разрушила их“. И пророчица ответила ему: „Люди омывают свои тела, но не свои души; и впрямь, когда они покидают бани, их тела сияют подобно самоцветам, но души их остаются черны как уголь. Это ты нарушаешь покой, ибо превратил Эль-Кулату в место сияющих тел и смердящих духов.“\»#!"
 testament_to_yunusfur_hudi_name: "Проповедь Худи"
 testament_to_yunusfur_hudi_desc: "#weak \«И велела Юнусфур вождям Худи прекратить свои распри, и провозгласила им: „О правители людские! Вы забыли свой долг перед своим народом; вы не учите их праведной жизни, а вместо этого отправляете проливать кровь и умирать за ваши разногласия. Не гоните своих сородичей как рабов, но направляйте их как любящие отцы, и любите друг друга как братья“. Один из патриархов поднялся и ответил: „Но их клан принёс несчастье нашему; да, они много раз сжигали наши деревни, засыпали солью наши поля и уводили наших женщин“. Юнусфур была непреклонна в своей решимости и обратилась к нему: „И ваш клан много раз поступал с ними так же. Когда вы взойдёте на великие ступени в самом конце, вы не вспомните об этих мелких распрях, но проклянете себя за то, что позволили злобе толкнуть вас на грех. Вы, вожди, вы, отцы народов, поклянитесь друг другу в братстве и прекратите войну, ибо на вершине Софокоса нет ни кланов, ни племён.“\»#!"
 
 lonely_spirit_experiment_log_name: "Журнал экспериментов"
 lonely_spirit_experiment_log_desc: "#weak \«День 3\nПолный провал. Подопытный II (петух) мёртв, никаких признаков отделения души. Душа может быть слишком простой, чтобы отделиться от разума, вскоре повторю попытку на более сложных объектах.\n\nДень 5\nЧастичный провал. Подопытный VI (раб-нелюдь) мёртв, отделение души сохранялось лишь краткий миг. Вызвало небольшой пожар в кабинете, подопытный сообщил о невыносимой боли незадолго до отделения. Подозреваю, что души нелюдей не способны выжить вне тела. Достать человека для опытов будет непросто, поэтому я доработаю ритуал на нелюдях, прежде чем совершить следующую попытку.\n\nДень 11\nЧастичный успех. Подопытный X (узник-человек) мёртв, отделение души поддерживалось дольше, чем в предыдущих попытках. Тело подопытного получило тяжёлые магические повреждения, я потерял его душу из виду спустя 2 часа. [Concept('magi','маг')|E] может обладать большим контролем над своей душой, чем обычный человек, но заполучить согласного на это мага в качестве подопытного практически невозможно. Изучу полученные результаты и по возможности доработаю ритуал.\»#!"
 lonely_spirit_personal_log_name: "Личный журнал"
 lonely_spirit_personal_log_desc: "#weak \«День 12\nУзы, связывающие плоть и дух, насмехаются надо мной своим упрямством. Я начинал эти эксперименты лишь ради расширения своих знаний, но осознание того, что есть способ разорвать эти цепи, пусть даже на краткий миг, не даёт мне покоя. Я ведь [Concept('magi','маг')|E], не так ли? Наследник Первых людей? Моя душа не подвержена тем же слабостям, что и у тех, кто стоит ниже меня. Древние говорят, что Чистейшие и Первые люди выжили благодаря реинкарнации после падения своей империи. Что, если именно так они вырвались из своих смертных тел? Неужели путь, которым я иду, ведёт к божественности?\n\nДень 14\nЯ начал подготовку к использованию ритуала отделения души на самом себе. Очевидно, что проблема заключалась не в самом ритуале, а в слабодушных подопытных, на которых я его тестировал. Мне нечего бояться, и всё же мой разум до сих пор полон сомнений. И всё же я маг. Я не могу позволить страху сломить меня так, как он сломил бы низшее существо. Если эта запись в журнале станет для меня последней, я надеюсь, что мои труды помогут другим приблизиться к духовному вознесению так же, как это сделал я.\»#!"
 
 
 #####################
 # MARTIAL - GENERAL #
 #####################
 
 on_prudent_leadership_name: "О благоразумном руководстве"
 on_prudent_leadership_desc: "Солдат хорош лишь настолько, насколько хорош его командир, как утверждает автор. Крупнейшая армия в мире всё равно может проиграть любую битву, если во главе её стоит дурак, но войско из крестьян, ведомое мудростью, способно сокрушить империю."
 on_battlefield_survival_name: "О выживании на поле боя"
 on_battlefield_survival_desc: "Некоторые битвы невозможно выиграть, ведь даже величайшего полководца могут перехитрить или задавить числом. В случае поражения всё ещё можно принять меры, дабы сберечь свои силы и сохранить жизнь для будущих сражений."
 on_personal_valour_name: "О личной доблести"
 on_personal_valour_desc: "Командир нужен не только для того, чтобы отдавать приказы своим солдатам, но и для того, чтобы храбро сражаться бок о бок с ними. Следовательно, владение мечом — жизненно важный навык не только для простого воина, но и для правителей."
 
 ###########
 # PROWESS #
 ###########
 duelist_adventurer_name: "Вальдорик, дуэлянт и авантюрист"
 duelist_adventurer_desc: "Великий гийемский дуэлянт и искатель приключений, Вальдорик вечно находился в поисках очередного могучего зверя, которого можно было бы сразить. Однако, несмотря на всю свою силу, воин оказался неспособен одолеть противника по имени Время и впал в отчаяние, когда состарился. Говорят, что в этот момент слабости к нему воззвала Владычица морей, предложив песнь укрепления в обмен на его вечную службу после смерти. Вальдорик якобы принял её предложение, и в миг его кончины внезапно нахлынувшая морская волна утащила его тело в пучину."
 
 ###########
 # GEOLOGY #
 ###########
 
 quartz_mineralogy_name: "Кварц: Определение и базовая минералогия"
 quartz_mineralogy_desc_name: "Среди наиболее доступных драгоценных камней кварц имеет десятки разновидностей, некоторые из которых обладают лишь тонкими различиями. Способность правильно определять каждую из них является ключом к практическому применению этого минерала."
 quartz_arcanomineralogy_name: "Кварциты: Арканология"
 quartz_arcanomineralogy_desc: ""
 opal_mineralogy_name: "Опал: Определение и базовая минералогия"
 opal_mineralogy_desc_name: ""
 opal_pyromantics_name: "Опаловая пиромантия"
 opal_pyromantics_desc_name: ""
 
 ##########
 # BOTANY #
 ##########

 botany_agrimony_name: "Ботаника: Репешок"
 botany_agrimony_desc: "Часто используемый в медицинских целях, этот жёлтый дикорастущий цветок при сжигании в больших количествах выделяет пары, способные навевать сон." 
 botany_berries_name: "Ботаника: Ягоды"
 botany_berries_desc: "From the humble bramble to the cultivated currant, berries are a staple of foragers and peasants alike. The difference between those that nourish and those that kill is little more than color."
 botany_carnation_name: "Ботаника: Гвоздика"
 botany_carnation_desc: "Ярко окрашенный цветок, произрастающий на Расколотом побережье. В наши дни гвоздику гораздо чаще можно встретить в садах, нежели в дикой природе. Ассоциируясь с вожделением и навязчивой любовью, она нередко выступает ингредиентом в дешёвых любовных зельях." 
 botany_celeries_name: "Ботаника: Сельдерей"
 botany_celeries_desc: "" 
 botany_cinnamon_name: "Ботаника: Корица"
 botany_cinnamon_desc: "Harvested from the inner bark of trees found in [Glossary('Vichacil Forests','vichacil_encyclopedia_desc')] and [Glossary('Rovarska','rovarska_encyclopedia_desc')], cinnamon commands prices that rival silver. Its warming properties make it a common, if extravagant, additive to remedies for chills and weak blood."
 botany_dandelions_name: "Ботаника: Одуванчик"
 botany_dandelions_desc: "Иногда высказывалось предположение, что полет семян скромного одуванчика вовсе не случаен; те, кто обладает соответствующими знаниями, могут использовать траекторию их движения для поиска мест силы и обнаружения потоков окружающей [Concept('magic','магии')|E]."
 botany_goldwool_name: "Ботаника: Златорунник"
 botany_goldwool_desc: ""
 botany_grapes_name: "Ботаника: Виноград"
 botany_grapes_desc: ""
 botany_wildgrass_name: "Ботаника: Дикорастущие травы"
 botany_wildgrass_desc: ""
 botany_hawthorn_name: "Ботаника: Боярышник"
 botany_hawthorn_desc: "A thorned tree of hedgerow and hillside, hawthorn's berries are brewed into tonics said to strengthen a failing heart. Plain folk plant it at boundaries and gravesites with the belief that no restless spirit will willingly cross a hawthorn hedge."
 botany_hemlocks_name: "Ботаника: Болиголов"
 botany_hemlocks_desc: "Deceptively similar to wild carrot and parsley, hemlock is among the deadliest plants on [aeras|E]. A small dose brings creeping numbness that ends in the stilling of breath. It should be handled, if at all, with covered hands."
 botany_horsetails_name: "Ботаника: Хвощ"
 botany_horsetails_desc: "Хвощ буйно разрастается в сырости, и особенности его роста служат отличным указателем мест, подходящих для сотворения могущественных заклинаний [Concept('magic','магии')|E] [Concept('aspect_water', 'Воды')|E]."
 botany_lightbane_name: "Ботаника: Бич света"
 botany_lightbane_desc: "A pale, fleshy growth that withers amidst direct sunlight, lightbane thrives in caverns, crypts, and deep ruins. Its sap dims flame, making it treasured by those whose work is best done unseen."
 botany_lilies_name: "Ботаника: Лилии"
 botany_lilies_desc: "Elegant flowers long associated with death and remembrance, lilies adorn funerals from the humblest village to the grandest court. Their bulbs are toxic if eaten, a fact that has spared many a grave-garden from foraging beasts."
 botany_monkshoods_name: "Ботаника: Аконит"
 botany_monkshoods_desc: "Also called wolfsbane, the hooded purple flowers of monkshood conceal a poison potent enough to fell a warhorse. Hunters tip arrows with its extract, and more than one inconvenient aristocrat has met their end with a monkshood-seasoned meal."
 botany_marigolds_name: "Marigolds"
 botany_marigolds_desc: "Bright and hardy, marigolds are as useful as they are cheerful. Salves made from their petals speed the closing of wounds and soothe burned skin. Gardeners plant them among crops to ward off pests both mundane and otherwise."
 botany_passionflower_name: "Ботаника: Страстоцвет"
 botany_passionflower_desc: "A climbing vine bearing intricate, otherworldly blooms, passionflower is brewed into calming draughts for the sleepless and the anxious. Its strange geometry has led some scholars to argue the flower is not native to this world at all."
 botany_peppervines_name: "Ботаника: Перец"
 botany_peppervines_desc: "Помимо использования в качестве специи, перечная лоза также является отличным ингредиентом для [Concept('magic','магии')|E] [Concept('aspect_fire', 'Огня')|E]. Однако не все её разновидности одинаково сильны, и даже конкретный метод их измельчения может повлиять на эффективность." 
 botany_prunes_name: "Ботаника: Чернослив"
 botany_prunes_desc: "Plums dried in sun or oven keep for months without spoiling, making them a mainstay of larders and campaign rations. Physicians prescribe them for ailments of the bowel."
 botany_roses_name: "Ботаника: Розы"
 botany_roses_desc: "The rose needs little introduction: beloved of poets, lovers, and apothecaries alike. Its petals perfume oils and sweeten remedies, while its hips, rich in restorative properties, are brewed against winter sicknesses. Its thorns are a lesson in themselves."
 botany_shallots_name: "Ботаника: Лук-шалот"
 botany_shallots_desc: "A milder cousin of the onion, shallots are prized in kitchens and sickrooms alike. Crushed raw, their juice is applied to insect bites and minor wounds to draw out corruption."
 botany_snowdrop_name: "Ботаника: Подснежник"
 botany_snowdrop_desc: "Among the first flowers to pierce the melting snow, snowdrop is a symbol of endurance. Herbalists value its bulb in remedies for fading memory, though in excess it brings on the very confusion it is to cure."
 botany_stargazers_name: "Ботаника: Звездочёты"
 botany_stargazers_desc: "Named for blooms that turn upward toward the night sky, stargazers open fully only after dusk. Astrologers, haruspexs, and diviners alike prize them greatly, claiming the flowers orient them toward celestial alignment, and toward currents of [magic|E] that flow unseen."
 botany_thistle_name: "Ботаника: Чертополох"
 botany_thistle_desc: "Armored in spines and stubborn beyond reason, the thistle flourishes where gentler plants fail. Its seeds and roots are used in tonics for ailments of the liver, and its refusal to die has made it a favored emblem of defiance."
 botany_willow_name: "Ботаника: Ива"
 botany_willow_desc: "The drooping willow thrives along riverbanks and in sorrow-soaked soil. Its bark, chewed or brewed, dulls pain and breaks fevers, a knowledge so old that no tradition can claim to have discovered it. Wands cut from willow are said to bend kindly toward [aspect_water] [magic|E]."
 botany_yarrow_name: "Ботаника: Тысячелистник"
 botany_yarrow_desc: "Known to soldiers as the battlefield herb, yarrow staunches bleeding when packed into a wound, and no field surgeon worth their pay travels without it. Diviners, meanwhile, cast its dried stalks to read the shape of things to come."

 ##################
 # ARCANA - TOOLS #
 ##################

 sacrificial_dagger_design_name: "Sacrificial Dagger Design"
 sacrificial_dagger_design_desc: "The construction of a proper sacrificial dagger demands more than skill with metal. The blade must be shaped and etched to channel arcane energies without being consumed. This text covers the ritual geometry, alloy compositions, and runic inscriptions required."
 sacrificial_dagger_cleaning_and_maintenance_name: "Очистка и уход за ритуальным кинжалом"
 sacrificial_dagger_cleaning_and_maintenance_desc: "Огромное количество арканной энергии, воздействию которой подвергаются жертвенные кинжалы, может физически повредить их и сделать непригодными для использования. Если придерживаться этих указаний, то подобный риск значительно снизится."
 astrolabe_operation_name: "Работа с астролябией"
 astrolabe_operation_desc: "Хотя астролябия является крайне полезным инструментом как в навигации, так и в определённых видах [Concept('magic','магии')|E], научиться обращаться с ней бывает непросто. Этот текст служит руководством, призванным помочь в данном процессе."
 brazier_construction_name: "Создание жаровни"
 brazier_construction_desc: "Большинство практикующих магов мало задумываются о том, какие жаровни они используют в своём искусстве. Тем не менее, будучи изготовленными из определённых металлических сплавов, они могут сами по себе служить усилителями ритуалов, а не просто сосудами."

 ##################
 # ARCANA - LIGHT #
 ##################
 
 warding_mirrors_name: "Особенности оберегающих зеркал"
 warding_mirrors_desc: "#weak \«Оберегающие зеркала создаются путём покрытия отражающего металла (предпочтительно серебра) звёздным светом посредством ритуала, проводимого под безлунным небом. В то время как другие металлы, такие как бронза или олово, также могут использоваться в качестве основы, серебро обладает уникальным свойством сопротивляться осквернению более тёмной магией.\»#!"
 mirror_spirit_interaction_name: "Наблюдения за материальными проявлениями"
 mirror_spirit_interaction_desc: "#weak \«Духи, упыри и прочие бесплотные чудовища питают странное отвращение к созерцанию собственных отражений. Хотя их уродливые лики обычно не отражаются, звёздный свет внутри оберегающего зеркала соприкасается с душами тех, кто в него смотрится, создавая отпечаток, который проступает на зеркальной поверхности...\»#!"
 mirror_lich_interaction_name: "Приложение XVI: О личах"
 mirror_lich_interaction_desc: "#weak \«В то время как некоторые из их немёртвых собратьев уязвимы для собственных отражений, личи не испытывают подобного отвращения. Напротив, они, похоже, даже восхищаются своими ликами, а особо тщеславные экземпляры, как известно, проводят часы, если не дни, любуясь собой — эту причуду сообразительные антимаги используют в своих интересах.\»#!"
 laser_beam_spell_ke_name: "Размышление над извлечёнными уроками"
 laser_beam_spell_ke_desc: "Чистая страница, которая, судя по всему, целиком сделана из серебра. Если подставить её под звёздный свет, не осквернённый влиянием [Concept('aervalr','Эрвала')|E], то в самом её центре проявится единственная витиеватая руна в стиле древнего Шевигада."

 #################
 # ARCANA - Dark #
 #################
 ship_quarreling_lover_name: "Свидетельство с торгового судна «Вздорный любовник»"
 ship_quarreling_lover_desc: "Запись показаний мага света Дриорис, единственной выжившей со «Вздорного любовника». Её нашли бессвязно бормочущей в луже чернильной субстанции, а на её плоти были вырезаны руны неизвестного происхождения."
 empty_island_corvanor_name: "Опустевший остров Корванор"
 empty_island_corvanor_desc: "Корванор был пристанищем воров, пока внезапно и необъяснимо не опустел. После того как бесследно пропало несколько поисковых групп, остров подвергался тщательной бомбардировке в течение нескольких дней. Следующая экспедиция успешно вернулась с обнаруженными в убежище записями о сводящей с ума тишине и исчезновениях."
 nature_of_shade_infestation_name: "Природа засилья теней"
 nature_of_shade_infestation_desc: "В этом документе подробно изложены труды мага Атер---- по документированию теней. Пропадающие люди, угасание арканного света и необычайная тишина были частыми историями среди выживших. В конце концов жажда знаний мага стала слишком велика, и он сгинул в древних руинах. С тех пор его имя постепенно «вымывалось» из всех документов, а сам его облик и описание стали лишь делом минувших дней."
 fall_of_relar_outpost_name: "Падение аванпоста Релар"
 fall_of_relar_outpost_desc: "Отчёт единственного выжившего с аванпоста Релар, исследовательской станции Видваукиятрана, предназначенной для изучения небольшой группы недеятельных теней в близлежащих руинах. Исследователи были на пороге прорыва, когда их атаковали тени, встревоженные их присутствием. Автор сумел спастись, обратившись в ветер, но перед этим получил рану в форме руны, которая медленно пожирала как его конечность, так и его магию."
 tales_of_extinction_name: "Сказания об истреблении"
 tales_of_extinction_desc: "Уцелевшие фрагменты главы, повествующей о падении различных городов и общин под натиском теней на протяжении всей истории. Данный том рассказывает о падении города Виайль и истреблении френдиров. Любопытно, что остальная часть главы не то чтобы утеряна, а скорее превращена неизвестным способом в нечитаемую бессмыслицу."
 on_embalming_name: "О бальзамировании"
 on_embalming_desc: "Ойчизаны разработали сложные методы бальзамирования для сохранения тел, пройдя через многие века проб и ошибок. Благодаря этому их понимание человеческого тела было практически непревзойдённым для своего времени."
 burial_rituals_name: "Погребальные ритуалы"
 burial_rituals_desc: "Период времени от кончины до погребения в ойчизанском обществе был долгим и сложным процессом. Множество обрядов совершалось по мере бальзамирования тела, дабы помочь душе и выразить почтение почтенному усопшему."
 funeral_dirges_name: "Похоронные плачи"
 funeral_dirges_desc: "Похороны у ойчизанов сопровождались долгими распевными гимнами, прославляющими покойного и дарующими защиту его духу. Хотя многие из этих песен были утеряны, те немногие, что уцелели в записях, были переведены здесь."

 ##################
 # ARCANA - BLOOD #
 ##################
 # Runes
 rune_four_valves_name: "Руна Четырёх Клапанов"
 rune_four_valves_desc: "Грудь сжимается при одном взгляде на эту руну, которую можно правильно начертать лишь с помощью концентрированной жизненной силы."
 
 # Other
 kei_kassidius_diagrams_name: "Пневматические диаграммы"
 kei_kassidius_diagrams_desc: "Бесчисленные диаграммы иллюстрируют то, как души разрываются на части под колоссальным магическим давлением. Невозможно не содрогнуться перед ужасной тщетностью всего этого. Столько смертей, а Кассидиус так и не нашёл убедительных доказательств того измеримого различия, которое он с таким упорством стремился обнаружить."
 
 ##################
 # ARCANA - STONE #
 ##################

 preliminary_results_name: "Предварительное расследование"
 preliminary_results_desc: "Одним из первых великих деяний, совершённых [Concept('magi','магом')|E] Приалис в Шевалье, стало выяснение того, каким образом презираемый придворный маг Виридиви был обращён в камень. Подозревая простое заклинание окаменения, часто используемое аверсианскими магами, она приказала отсечь кусок камня, поскольку заклинание превращало в камень только кожу, оставляя плоть под ней нетронутой."
 agata_rebirth_ke_name: "Возможное каширское заклинание"
 agata_rebirth_ke_desc: "После того как долото не помогло, по руке мага ударили молотом, обнаружив, что рука полностью окаменела, вплоть до костей! Приалис сверилась с днём свадьбы, поскольку заклинание такой силы потребовало бы заметного ритуального рисунка, высеченного под целью. Она приказала убрать статую и вскрыть пол вокруг неё, предполагая, что это могло быть каширское заклинание «Возрождение Агаты», из-за которого тело объекта превращалось в камень по направлению от костей наружу."
 anti_magi_cockatrice_name: "Новый след"
 anti_magi_cockatrice_desc: "Под полом, на маге или в окружающих комнатах не было никаких признаков ритуала. Тогда Приалис предложила осмотреть покои придворного мага. Внутри обнаружилась переписка мага с антимагами, которым было поручено выследить кокатрикса. Маг просил заряженный глаз кокатрикса, отмечая, что в день свадьбы будет полнолуние, а герцог хотел сделать особое кольцо с использованием магии этого глаза. Приалис была поражена, ведь ей говорили, что свадьба состоялась на две недели позже, когда луна была уже не так сильна. Герцога необходимо было допросить."
 killer_discovered_name: "Убийца разоблачён"
 killer_discovered_desc: "Прежде чем допросить герцога, Приалис связалась с упомянутым орденом антимагов и узнала, что два заряженных глаза кокатрикса были доставлены в замок и получены братом герцога за день до свадьбы. Приалис, собрав антимагов и Отца пути, вывела герцога на чистую воду. Герцог признался, что его брат использовал глаза кокатрикса, дабы убить придворного мага в свете полнолуния. Брат герцога был взят под стражу для предания суду, а Приалис отправилась навстречу своему следующему приключению."

 ######################
 # ARCANA - CELESTIAL #
 ###################### 
 
 detecting_malice_meditation_name: "О выслеживании ведьмы"
 detecting_malice_meditation_desc: "Запутанная история о том, как сонастройка собственной души с сущностью космоса позволяет обнаруживать источники вредоносной магии."
 spirit_interaction_rules_name: "Духи и эли"
 spirit_interaction_rules_desc: "Список правил, которых необходимо придерживаться при общении с мертвецами, заканчивающийся перечнем элей, которые духи находят восхитительными."
 aervalr_reading_name: "Как Эрвал направляет нас"
 aervalr_reading_desc: "Вердан утверждает, что путь [Concept('aervalr','Эрвала')|E] предначертывает ход человеческой жизни. Он перечисляет, как различные фазы Эрвала на определённых этапах жизни могут приводить к благоприятным исходам."
 star_cards_name: "Звёздные карты"
 star_cards_desc: "В этом разделе перечислен 51 самый распространённый вид «Звёздных карт», включая то, как толкователь может интерпретировать каждую из них. Эти трактовки могут разительно отличаться в зависимости от условий, в которых карты были вытянуты."

 ##################
 # ARCANA - DREAM #
 ##################

 dream_maps_empyrean_tower_name: "Сонные карты Эмпирейской башни"
 dream_maps_empyrean_tower_desc: "Исследователи [Concept('aspect_dream', 'Грёз')|E] время от времени высказывали предположение, что существует определённая [Concept('the_towers','Башня')|E], доступная только спящему разуму. Эта часть труда, судя по всему, отображает её предполагаемую структуру, хотя текст с тем же успехом может быть полной бессмыслицей."
 key_of_the_obsidian_gate_ke_name: "Ключ от Обсидиановых врат"
 key_of_the_obsidian_gate_ke_desc: "Если бы сны были театром теней, то этот ритуал позволил бы заглянуть за занавес — но лишь ненадолго."
 wakeless_glass_name: "Часть 1: Будничные вещи"
 wakeless_glass_desc: "Известно, что в простынях Непробудных скапливается морское стекло размером с гальку. Влажное на ощупь, оно слабо светится, словно подсвеченное со всех сторон невидимым солнцем, что время от времени прерывается движением нечётких теней. Практическое применение почти неизвестно."
 wakeless_rubies_name: "Часть 2: Красоты"
 wakeless_rubies_desc: "На рубины, что скапливаются в ротовой и носовой полостях Непробудных, нельзя смотреть прямо. Несмотря на свою красоту, они, как известно, внушают навязчивые и пагубные мысли. Говорят, что некоторые из них приносят пользу, однако безопасного способа отличить их друг от друга не существует."
 wakeless_fire_name: "Часть 3: Невозможности"
 wakeless_fire_desc: "Хотя это и редкость, меры предосторожности против проявления холодных углей требуют, чтобы Непробудные бережно хранились в деревянных постройках. Они сжигают камень, но оставляют обычные горючие материалы невредимыми."
 wakeless_incomprehensibilities_name: "Часть 4: Непостижимости"
 wakeless_incomprehensibilities_desc: "Известно, что различные сущности могут проскальзывать сквозь прорехи в душе Непробудного. Когда Безликие люди и Безликие псы начинают появляться, таясь в коридорах и за открытыми дверями, [Concept('magi','маги')|E] должны приложить все усилия, чтобы укрепить обереги вокруг Непробудного. Незваные гости стремятся унести Непробудного с собой, хотя никто не знает куда."
 neverending_dream_appendices_name: "Анонимные приложения"
 neverending_dream_appendices_desc: "Собрание энциклопедических сведений о природе разума, поведанных аптийскими сновидцами, с маргиналиями и прикреплёнными заметками составившего их [Concept('aversaria','аверсианского')|E] учёного. В лучшем случае они фрагментарны, в худшем — бессвязны, однако сохранилось достаточно, чтобы приоткрыть завесу тайны над скрытым миром."
 neverending_dream_geese_questions_name: "Гусиные вопросы"
 neverending_dream_geese_questions_desc: "#weak \«Мальчик обнаружил себя среди шуршащих ив и мирного течения глубокого тёмного пруда. Он стоит посреди него по пояс в воде, тёплой и утешительной. Напротив сидит мудрая Гусыня со своими гусятами. Она ступает, не оставляя следа, по зачернённой воде, дабы задать мальчику вопрос, а он — ей. О чём именно, он бы не поведал.\»#!"
 neverending_dream_roar_of_the_king_name: "Рёв Короля"
 neverending_dream_roar_of_the_king_desc: "#weak \«Мальчика призвали предстать пред Королём. Он был кроток и робок, его стражники своим весом отмеряли каждый его слабый шаг во время шествия к Королю. На самом высоком троне в праздной неге восседал Король, но стоило мальчику явиться, как Король взревел громом среди ясной ночи и отослал его прочь. Король призывал к себе мальчика снова и снова, пока тот не научился выдерживать эту бурю.\»#!"
 neverending_dream_spider_queen_name: "Королева пауков"
 neverending_dream_spider_queen_desc: "#weak \«Мальчик путешествовал по рисованным пейзажам и акварельным ручьям в поисках дороги домой. Изменчивый звёздный свет ничем не помог мальчику. Прыгающие овцы тоже. Каждый отказывал мальчику, пока наконец он не обратился к Королеве пауков. Она согласилась исполнить его желание с условием, что он унесёт её паутину с собой, дабы, когда ей вздумается, она тоже могла уйти.\»#!"

