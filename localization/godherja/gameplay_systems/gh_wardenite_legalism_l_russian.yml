 special_doctrine_singular_mamur_hostility_name:0 "Признаёт одного Мамура"
 special_doctrine_singular_mamur_hostility_desc:0 "Только один истинный [Concept('mamuramat','Мамур')|E] может направлять [Concept('wardenism','варденизм')|E], а все остальные — лишь радикальные самозванцы." 
 FAITH_TRADITIONS:0 "Правовые школы"
 FAITH_TRADITIONS_EXPLANATION:0 "Варденизм обладает долгой и гордой легалистской традицией, восходящей к самому рассвету веры и Первому Вардену. Фундаментальные варденитские убеждения в равенстве разума и праве на правовую защиту привели к появлению широкого спектра различных правовых школ, расходящихся в различных тонкостях варденитского религиозного права."
 
 maridai_name:0 "Маридаийя"
 maridai_desc:0 "Реформаторское движение, возглавленное харизматичным верховным судьёй Мудабариком в 1203 году. Оно во многом граничит с радикализмом, например, подчёркивая обязанность верующих варденитов выносить независимые суждения в ситуациях, когда Мамур не может вынести своё собственное решение. Поскольку это явно включает в себя случаи, когда у верующих есть основания полагать, что Мамур не обладает достаточными знаниями о местных делах для точного суждения, школу иногда обвиняли в том, что она превращает «каждого общинника в Мамура» — обвинение, которое Мудабарик отрицал до самой смерти."
 tashbari_name:0 "Ташбарийя"
 tashbari_desc:0 "Ташбарийя, или метафористы, когда-то считались радикальной сектой и в 895 году даже попали в списки запрещённых школ Мамура Насира ибн Усмана. Однако школа сумела пережить как жестокие чистки, так и правовое давление, и добилась повышения до мейнстримного статуса, когда преемник Насира, Юсуф, назначил четырёх их учёных верховными судьями, тем самым навсегда закрепив их влияние в варденитской правовой традиции. Они подчёркивают необходимость понимания метафор, использованных Первым Варденом в его трудах, для вынесения правовых заключений."
 babatadi_name:0 "Бабатадийя"
 babatadi_desc:0 "Бабатадийя пользуется сомнительной честью быть традиционной школой, пользующейся покровительством мамурамата, во многом благодаря своей ярой защите права Мамура на окончательное суждение по всем правовым вопросам. Хотя судьи Бабатадийи, которых обвиняют в сикофантстве, поспешно указывают на то, что школа устанавливает строгие ограничения на то, что именно входит в юрисдикцию решений Мамура, учёным трудно избавиться от этой репутации."
 zaydeni_name:0 "Зайденийя"
 zaydeni_desc:0 "Зайденийя — одна из старейших правовых школ в варденитской вере, предшествовавшая большинству современных школ на несколько веков и пережившая больше соперничающих традиций, чем может сосчитать большинство учёных. Они занимают несколько агностическую позицию по отношению к самому Мамуру, вместо этого сосредотачиваясь на поведении и образовании судей, а также на сохранении Первых законов как основы всей остальной правовой практики."
 atarni_name:0 "Атарнийя"
 atarni_desc:0 "Атарнийя — лишь последнее в длинном ряду буквалистских движений, которые поднимались к вершинам славы и затем уходили в небытие. Единственное, что объединяло эти школы — это упрямая позиция, согласно которой каждая строка, написанная Первым Варденом, должна интерпретироваться без привнесения личных предположений, контекста или допущения метафор почти во всех случаях. Это сделало буквалистские школы довольно странными и негибкими в их общей практике, но привлекательность столь простого и чистого подхода к зачастую запутанному прецедентному праву приводила к тому, что всякий раз, когда гибла одна школа, её место вскоре занимала другая."
 ruthamari_name:0 "Рутамарийя"
 ruthamari_desc:0 "Рутамарийе приписывают основание и распространение затмалитского раскола в 678 году. Они до сих пор остаются сердцем идеалистического движения, а также клеем, удерживающим вместе его зачастую расходящиеся традиции и сохраняющим его ортодоксию перед соблазнами радикализма. Суть их несогласия заключалась и заключается в утверждении, что Мамуры, как и старые законы военного времени, были продуктом Великого восстания. Теперь, когда дни бунта против злых ритуалистов остались далеко в прошлом, верующие вардениты должны искать новые политические решения своих проблем, дабы завоевания Первого Вардена, доставшиеся тяжким трудом, не были утеряны из-за некомпетентности."
 narabiqi_name:0 "Нарабикнийя"
 narabiqi_desc:0 "Противоречивая идеалистическая школа. Нарабикнийя, или популисты, не столько отвергают Мамура, сколько решили полностью переосмыслить этот титул. Любой варденит, получивший признание своих собратьев за действия по защите Столпов Добродетели в борьбе со злом, может быть провозглашён таковым, и Мамуров может быть столько или так мало, сколько вардениты сочтут нужным. Другие нововведения Нарабикнийи возникли из применения этого принципа признания к иным правовым дилеммам, что привело к ряду гетеродоксальных решений."
 tarthari_name:0 "Тартарийя"
 tarthari_desc:0 "Правовые традиции Тартарийи составляют основу кафистского раскола 1152 года И.С. Многие из их правовых принципов стали ядром этой веры, в первую очередь строго кодифицированный список прав и обязанностей, предоставленных судьям, а также вывод о том, что попытки неаккредитованных лиц повлиять на судебные решения должны считаться непростительными преступлениями."
 kedbarki_name:0 "Кедбаркийя"
 kedbarki_desc:0 "Весьма воинственная школа, Кьедбаркийя зародилась с серии правовых разногласий по поводу терпимости к ритуалистам. Юристы-основатели школы заняли позицию, согласно которой все необращённые ритуалисты фактически являются вражескими комбатантами. В последующие годы Кедбаркийя развила этот тезис, приняв общую установку, согласно которой варденитская вера всё ещё должна быть структурирована подобно военным лагерям ранних кампаний Первого Вардена. Всякое легкомыслие должно быть принесено в жертву ради того, чтобы Зло наконец было повержено."
 hasani_name:0 "Хасанийя"
 hasani_desc:0 "Противоречивая и молодая ветвь идеалистического варденизма, Хасанийя возникла из последователей магистрата Хасана ибн Убайда в конце XII века. Хасаниты проповедуют то же, что и их основатель: все верующие вардениты являются носителями законов Первого Вардена. Нелегитимны не только Мамуры, но и все особые полномочия и разрешения, предоставляемые судьям и магистратам. Судья, говорят они, может по-настоящему обладать властью лишь в том случае, если она дарована ему общиной верующих варденитов в целом. Любые другие притязания не просто нелегитимны, но и в корне являются незаконной формой тирании.\n\nНестандартное толкование варденитского права Хасаном ибн Убайдом привело к тому, что он и его последователи были изгнаны из совета Республики Дисувай Ришадом аль-Мааджем в 1159 году, и последние два года своей жизни он провёл в тюрьме, прежде чем умереть от пневмонии в 1161 году. Его последователям удалось убедить Идеалистический верховный суд отменить указ, осуждающий их как радикалов, в 1181 году, отрекшись от своих самых экстремистски настроенных коллег, однако их статус внутри идеалистического движения всё ещё остаётся весьма шатким."
 thabiti_name:0 "Табитийя"
 thabiti_desc:0 "Школа, наиболее тесно связанная с восточным мамураматом [GetTitleByKey('e_eastern_mamuramat').GetNameNoTier] во время его расцвета в разгар Эпохи Огня. Табитийя всегда сохраняла сильное присутствие в восточной половине варденитского Саррадона, даже после того как Мамур Татхтали формально объединил этот титул со своим собственным посредством брака с Санад, дочерью последнего восточного Мамура, во время хаоса Заката в 810 году."
 misria_name:0 "Мисрийя"
 misria_desc:0 "Традиция, пользующаяся дурной славой из-за своих мистических, странных практик. Мисрийя истолковала ряд отрывков, которые большинство школ понимают как поощрение использования личной проницательности судьями, в том смысле, что судья при надлежащей подготовке может получать озарения, общаясь с Тем, Кто Был, во многом так же, как был отмечен Первый Варден."
 ajari_name:0 "Ажарийя"
 ajari_desc:0 "Возврат к самой ранней эпохе варденитской правовой доктрины. Ажарийя утверждает, что веские правовые аргументы должны черпаться исключительно из небольшого набора документов, в первую очередь из «Книги дней», «Столпов добродетели» и «Записей суда Вардена». Всё остальное, включая чрезмерное упование на независимое суждение судьи, делает решение полностью недействительным. Жёсткая позиция, спору нет, но она сохраняется на протяжении веков."
 alshammi_name:0 "Аш-Шаммийя"
 alshammi_desc:0 "Аш-Шаммийя была традиционной школой дальневосточного мамурамата, и её приверженцы до сих пор считают себя продолжателями миссии Экспедиции восходящего солнца, которая учредила противоречивый и недолговечный четвёртый мамурамат, дабы преследовать ритуалистов до самой далёкой Каширии. Титул стал вакантным после исчезновения второго дальневосточного Мамура Убайдара вместе с его армиями во время предполагаемой гедеоры в 409 году И.С., но Аш-Шаммийя с тех пор добивается его восстановления."
 kurushi_name:0 "Курушийя"
 kurushi_desc:0 "Они придерживаются традиции, которая, по их утверждениям, восходит к золотому веку мамурамата — под этим подразумеваются годы между смертью Первого Вардена в 341 году по И.С. и упразднением западного Мамура в 627 году. Конец этой эпохи они называют причиной всевозможных дисфункций в варденитской вере. Хотя в теории они поддерживают оставшегося Мамура, их исторические заявления о том, что они по закону являются держателями всех трёх титулов мамурамата, приводили к тому, что судьи Курушийи оказывали поддержку нескольким неудачливым мятежникам в попытке восстановить один или несколько упразднённых титулов."
 hathali_name:0 "Хаталийя"
 hathali_desc:0 "Традиция, связанная с иблидскими Мамурами Запада. Хаталийя достигла беспрецедентного величия во второй половине существования принявшего её мамурамата. К сожалению, их судьба рухнула после угасания основной иблидской династической линии в 652 году, когда различные фракции внутри западного мамурамата [GetTitleByKey('e_western_mamuramat').GetNameNoTier] погрузились в горькую и в конечном счёте саморазрушительную гражданскую войну за контроль над троном. Сама традиция Хаталийи скатилась в особенно жестокую фракционную борьбу, которая завершилась печально известным Судом кинжалов в 675 году, когда попытка в последний момент провести посредничество между претендентами на трон превратилась в хаотичную кровавую баню, где судья убивал судью. Ужас, который это событие вызвало во всём варденитском мире, часто считают предлогом, побудившим Мамуров Центра вмешаться, чтобы окончательно положить конец распрям и самому западному мамурамату.\n\nПоложение Хаталийи несколько восстановилось, но былое величие так и не вернулось. Они примечательны своей жёсткой и почти одержимо поддерживаемой системой тестирования будущих судей на компетентность и честность."
 mabruki_name:0 "Мабрукийя"
 mabruki_desc:0 "Мабрукийя — уникальная и древняя школа в традиционалистской ветви варденитской юриспруденции. Возводя начало своего раскола к ряду правовых решений, изданных самим Первым Варденом для урегулирования городских споров в период, когда вера только начинала утверждаться в Саррадоне, Мабрукийя утверждает, что право на несогласие распространяется на всех совершеннолетних варденитов, и обладает хорошо проработанным кодексом торгового права. Школа особенно популярна в городах."
 zubatai_name:0 "Зубатай"
 zubatai_desc:0 "Радикальное движение, основанное в 879 году, но уходящее корнями в некоторые сельские народные суды Сarrадона, существовавшие гораздо дольше. Зубатайя навлекла на себя гнев остальной, зачастую воинственной варденитской веры, отвергнув в принципе саму основу её истории — Борьбу со злом. Опираясь на ряд текстов, считающихся большинством варденитских учёных апокрифическими, судьи Зубатайи признали большинство актов насилия непростительными преступлениями, оставив лишь узкую лазейку для самообороны. Тот факт, что этот отказ распространяется и на обязанность вмешательства, привёл к тому, что эта школа была в значительной степени подавлена большинством варденитских государств."
 qatirri_name:0 "Катиррийя"
 qatirri_desc:0 "Иногда называемая «бандитской школой», Катиррийя едва ли тянет на статус связной школы мысли, и чаще упоминается в таком ключе судьями не из Катиррийи, стремящимися свалить множество гетеродоксальных верований в одну легко осуждаемую категорию. В общих чертах, эта традиция является возвратом к «законам войны», которые восходят к раннему периоду Великого восстания, но которые сам Первый Варден сначала ограничил, а затем прямо отверг в конце своей жизни. Эти законы, допускавшие всевозможные варианты поведения во время конфликтов, более или менее потворствуют ряду действий, весьма популярных среди бандитов и менее щепетильных военачальников, что и принесло школе её прозвище."
 tawatasi_name:0 "Таватасийя"
 tawatasi_desc:0 "Школа Таватасийя делит своё название с популярным видом батата, выращиваемым саррадонскими крестьянами. Её приверженцы встречаются почти исключительно среди выпускников народных судов в самых сельских районах континента. Хотя само название изначально задумывалось как оскорбление, оно было принято в качестве внутренней шутки свободным братством сельских судей, придерживающихся её общих принципов. Будучи обычно занятой вопросами аграрных прав и водной политики, некоторые из более тайных убеждений школы касательно окончательного права собственности на всю землю и её продукты за теми, кто её возделывает, возможно, привели к некоторым из самых разрушительных крестьянских восстаний и бунтов рабов в истории Саррадона."
 minbiri_name:0 "Минбирийя"
 minbiri_desc:0 "Минбирийя, или школа вседозволенности, относится к числу старейших выживших радикальных сект. Подчёркивая холистический подход к текстуальным источникам — то есть принимая почти все из них как имеющие ту или иную силу — Минбирийя выдвинула весьма убедительный вызов варденитскому Символу веры. В их правовой практике многие обязательные запреты низведены до статуса всего лишь рекомендуемого поведения. Школа выжила во многом благодаря периодическим всплескам популярности, которой она пользовалась среди богатых и власть имущих в варденитском обществе."
 keffali_name:0 "Кеффалийя"
 keffali_desc:0 "Саррадонизированная форма слова «шевалье», школа Кеффалийя возникла как серия ситуативных и временных решений, призванных нормализовать растущее присутствие купцов-маршеров и наёмников в саррадонском обществе, но с тех пор настолько специализировалась, что переросла в самостоятельную правовую школу. Хотя она обычно считается радикальной, остальная часть варденитской веры по большей части её игнорирует, поскольку формальная практика этой традиции остаётся локализованной в горстке прибрежных городов в Западном Саррадоне и вряд ли распространится дальше."
 afazariani_name:0 "Афазариани"
 afazariani_desc:0 "Школа Афазариани — саррадонизированная форма слова «аверсарец» — пользовалась кратким периодом признания в мейнстриме в первые дни Войны святых, когда мамурамат проводил политику сотрудничества и союза с агионистскими захватчиками. В те ранние дни они всё ещё рассматривались как ценные союзники против возрождающейся угрозы ритуалистов и возможные кандидаты на последующую интеграцию в варденитскую веру. Увы, этому не суждено было случиться, и когда агионисты повернулись против своих бывших союзников, падение школы Афазариани произошло почти в одночасье. Она выживает преимущественно на землях, контролируемых орденами, но даже там её не особо жалуют."
 filosi_name:0 "Филосийя"
 filosi_desc:0 "Правовая школа, созданная для гармонизации варденитского религиозного права с религиозными принципами сьялволков. Школа Филосийя, пожалуй, наиболее примечательна тем, что породила тысячи и тысячи страниц, разглагольствующих о правилах охоты, охотниках и охотничьих угодьях. Попутно она также сформировала один из самых надёжных сводов медицинских традиций во всём варденитском мире, синтезировав многие из наиболее эффективных лекарств, разработанных сьялволькскими шаманами и знахарями на протяжении веков."
 zorani_name:0 "Кенранийя"
 zorani_desc:0 "Школа, которая многое заимствует из богатых правовых традиций амсари. Кенранийя несколько противоречива из-за своего обыкновения возводить Мамура в статус божественного правителя, что отчасти аналогично канамсару. С другой стороны, школа заслужила похвалу благодаря явному таланту её учёных разбираться в традиционно лабиринтообразном варденитском кодексе законов о собственности и наследовании."
 kemsari_name:0 "Кемсарийя"
 kemsari_desc:0 "Кемсарийя возникла из попытки управлять народами некогда великого королевства Кемсар. Давно растеряв былое величие своих городов, учёные Кемсарийи обычно набивают руку на ведении дел, связанных с племенными правами на воду и доступом к оазисам. Хотя бесконечное бубнение по поводу мельчайших правил глубины оросительных каналов трудно выносить, большинство сходится во мнении, что это куда предпочтительнее традиционно жестоких методов, которыми обычно решаются эти споры."
 dhahabi_name:0 "Дхахабийя"
 dhahabi_desc:0 "Попытка гармонизировать странные правовые традиции Адабисса с варденизмом. Дхахабийя постоянно борется за популярность, и для неё было проблемой даже сохранить достаточное число последователей, чтобы продолжать именоваться «школой». Сами адабиссцы едва терпят их, видя в их учёных пережиток нежеланной религиозной традиции. Их собратья по варденитской вере считают их предателями, виновными в том, что они призывают следующую волну захватчиков для угнетения веры. Имея мало дружественных судов, которые можно было бы назвать домом, Дхахабийя находится в незавидном положении."
 daifarosi_name:0 "Даифаросийя"
 daifarosi_desc:0 "По мере того как наши учёные пытались сделать этот континент своим домом, они обнаружили, что те, кто известен как «ируши», оказались неожиданно сговорчивым народом. Они обладают длительной правовой традицией, основанной вокруг божества Даифароса — что почти наверняка является искажённой памятью о каком-то особенно достойном восхищения законодателе древних времён. Выросший из этого правовой синтез оказался удивительно полезным для повседневных бюрократических нужд."
 hayashi_name:0 "Хаяшийя"
 hayashi_desc:0 "Школа Хаяшийя была основана в 1251 году И.С. боевиками, сражавшимися против вторгшихся агионистов. Она утверждает, что главной целью правовой системы должно быть поражение неверных. Первым и самым главным среди их убеждений является то, что законы войны всё ещё в силе и могут быть отменены только после того, как варденизм восторжествует. Кроме того, солдаты должны быть поставлены выше закона, а еретики и язычники, против которых они сражаются, не должны им защищаться, поскольку такие защиты предоставляются только тем, кто, в свою очередь, готов защищать саму систему. За свою относительно короткую историю школа уже столкнулась с рядом отменённых судебных дел в отношении неверующих на том основании, что отвергающие учение Первого Вардена изначально виновны в тягчайших преступлениях, и что само предоставление им суда является предательством варденитских ценностей."
 
