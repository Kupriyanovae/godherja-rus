 # GUI LOC #
 ###########
 INNOVATION_APPROACH:0 "Вы сосредоточитесь на более быстром повышении своего #E судебного навыка#!, используя нетрадиционные методики и правовые эксперименты. Все правовые испытания станут значительно сложнее, но будут приносить #P двойной#! прогресс @judicial_power_icon!#E свойства «Юрист»#!. Однако каждое правовое испытание, в котором вы участвуете, с высокой долей вероятности увеличит ваш @radicalism_icon!#E радикализм#!."
 SCHOLARSHIP_APPROACH:0 "Вы сосредоточитесь на развитии своей #E правовой традиции#!, внося вклад в её свод законов на основе ведения своих дел. Все правовые испытания будут приносить #N больше#! @stress_gain_icon![Concept('stress', 'стресса')|E], но при этом дадут @prestige_icon![Concept('prestige', 'престиж')|E] и внесут вклад в @judicial_power_icon!#E прогресс вашей правовой традиции#!. Каждое правовое испытание, в котором вы участвуете, имеет небольшой шанс увеличить ваш @radicalism_icon!#E радикализм#!, но этот шанс гораздо ниже, чем при подходе через #E новаторство#!."
 GRIFTING_APPROACH:0 "Вы сосредоточитесь на злоупотреблении правовой системой ради набивания собственных карманов и расширения своей власти. Каждое #E правовое испытание#!, в котором вы участвуете, добавит ваш навык @skill_intrigue_icon![Concept('intrigue', 'интриг')|E] к вашей @judicial_power_icon!#E судебной власти#! и получит шанс принести вам @gold_icon![Concept('gold','золото')|E]. Однако существует также значительный шанс того, что вы получите @corruption_icon!#E коррумпированность#! и потеряете @piety_icon![Concept('piety','благочестие')|E] из-за своей тайной деятельности."
 ORTHODOXY_APPROACH:0 "Вы сосредоточитесь на том, чтобы не раскачивать лодку и просто применять закон в рамках ортодоксии в меру своих возможностей. Награды в виде @piety_icon![Concept('piety','благочестия')|E] за #E правовые испытания#! будут увеличены на #P +20%#!, а ваш @radicalism_icon!#E радикализм#! и @corruption_icon!#E коррумпированность#! будут медленно снижаться."
 
