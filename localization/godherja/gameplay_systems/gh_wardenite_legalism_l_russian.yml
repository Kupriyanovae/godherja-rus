 doctrine_wardenite_school_name:0 "Правовая школа"
 wardenite_mainstream_doctrine_name:0 "Аль-Баджармийя — Мейнстримная традиция"
 wardenite_mainstream_doctrine_desc:0 "Аль-Баджармийя, или «Основная» школа, состоит из прагматиков, принимающих необходимость единого Мамура в принципе и теории — пусть даже они не всегда согласны с тем, кто именно является истинным Мамуром. Эта школа проявляет широкую терпимость к различным правовым традициям, в целом придерживаясь принципа, что единство традиций варденитской веры важнее, чем строгая чистота мысли и практики. За века своего существования школа поглотила несколько соперничающих традиций, и теперь считает некогда почти еретические течения ташбарийя (метафористов) и хаарийя (эмоционалистов) придатками своего кодекса. Разумеется, у терпимости есть пределы, и гораздо больше традиций кануло в лету из-за подавления со стороны Аль-Баджармийи."
 wardenite_idealist_doctrine_name:0 "Затмалийя — Идеалистическая традиция"
 wardenite_idealist_doctrine_desc:0 "Идеалисты, как правило, не принимают необходимость существования Мамура, видя в этой должности то, что было нужно лишь в контексте ранних кампаний Первого Вардена — реликт более простых времён. Будучи самым динамичным из варденитских течений, они придерживаются легалистских традиций, подчёркивающих необходимость переосмысления. В этом они опираются на определённый цикл текстов, написанных Первым Варденом в «Видении Башни Ангела», где описываются возможные судьбы человечества в далёком будущем. В то время как другие школы поспешно заявляют, что эти строки почти наверняка были предупреждением против безрассудного новаторства, Затмалийя приняла прямо противоположную интерпретацию."
 wardenite_traditionalist_doctrine_name:0 "Табакайя — Традиционалистская традиция"
 wardenite_traditionalist_doctrine_desc:0 "Традиционалисты Табакайи признают существование и необходимость нескольких Мамуров, считая их роль светских военных лидеров делом первостепенной важности. Для них кампании Первого Вардена никогда по-настоящему не прекращались, ведь ритуалисты — и их нынешние фактические преемники агионисты — всё ещё существуют. Примечательно, что Табакайя зачастую довольно терпима к иноверцам, которых они считают непричастными к их великой борьбе, предпочитая просто игнорировать и избегать их."
 wardenite_radical_doctrine_name:0 "Мататазарийя — Радикалы"
 wardenite_radical_doctrine_desc:0 "Сборное название для сильно отклоняющихся правовых ветвей. Между Аль-Баджармийей, Затмалийей и Табакайей установился хрупкий мир: свои религиозные споры они чаще ведут в залах суда, нежели на полях сражений. Этот зыбкий компромисс был достигнут ценой того, что несколько правовых традиций, не сумевших примкнуть к одной из трёх главных школ, получили пренебрежительный ярлык «мататазарийя» — радикалы. Между собой у них мало общего, что прекрасно иллюстрирует тот факт, что и пацифистская «Зубатайя», и пользующаяся дурной славой разбойничья правовая традиция «Катиррийя» одинаково подвергаются осуждению."
 
 doctrine_high_court_legitimacy_name:0 "Легитимность верховного суда"
