 PATRON_SAINTS_EXPLANATION:0 "Агионизм утверждает, что Святые были самыми просветленными существами, когда-либо ступавшими по Эрасу, и целью каждого благочестивого агиониста должно быть следование по их стопам. Поэтому многие последователи агионизма выбирают определенного святого в качестве своего «Покровителя», стремясь подражать ему, чтобы очиститься от скверны."
 
 RECOGNIZED_PATRON_SAINTS_EXPLANATION:90 "Хотя наша вера признает следующих деятелей божественными, мы не посвящаем себя им. Тем не менее, те, кто следует по их стопам, ничуть не менее благочестивы, чем мы сами."
 
