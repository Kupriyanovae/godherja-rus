 eos_pure_patron_saint_name:0 "Эос Доблестный"
 eos_pure_patron_saint_desc:0 "Малькойский дворянин, наемник, искатель приключений, [Concept('antimagi','антимаг')|E] и военный реформатор, Эос считался, возможно, величайшим фехтовальщиком своей эпохи. С началом восстаний он умолял командира своего легиона дать ему отпуск, чтобы помочь рабам. К его удивлению, легат Сансия вместо этого объявила, что легион двинется туда вместе с ним, и вскоре после этого начались восстания. Пылающий меч святого Эоса несут те, кто посвящает себя воинскому совершенству и защите слабых."
 sansia_pure_patron_saint_name:0 "Сансия Защитница"
 sansia_pure_patron_saint_desc:0 "Осиротевшая девочка, родившаяся в трущобах Айроноя, к совершеннолетию Сансия стала одним из самых уважаемых военачальников легиона и героиней всей [Concept('aversaria','Аверсарии')|E]. Прозванная за свою красоту и ум «Розой легионов», она закрепила свою славу, поведя войска на защиту освобожденных рабов от опахасийских губернаторских легионов в битве при Платейре, что положило начало агионистским восстаниям. Сансия верила, что полководец должен быть не только мастером военного дела, но и образцом добродетели для своих солдат и тех, кого они защищают."
 dikaynos_pure_patron_saint_name:0 "Дикайн Праведный"
 dikaynos_pure_patron_saint_desc:0 "Дикайн даровал милосердие нуждающимся благодаря своему непревзойденному знанию законов, ни разу не позволив ненависти или жажде мести затмить свой разум. Мы тоже не должны позволять слепому следованию букве закона мешать нашей войне против несправедливости, и всегда обязаны ставить абсолютный моральный закон выше законов человеческих."
 katharitos_pure_patron_saint_name:0 "Кахарит Странник"
 katharitos_pure_patron_saint_desc:0 "Родившийся в небольшой религиозной общине в Опахасии в семье уважаемого местного проповедника и туземки, Кахарит к старости стал известным оратором, писателем и исследователем. Путешествуя по [Concept('aeras','Эрасу')|E], Кахарит усердно проповедовал добродетели самосовершенствования и равенства между всеми народами."
 thysia_pure_patron_saint_name:0 "Тисия Целительница"
 thysia_pure_patron_saint_desc:0 "Признанная целительница и ученая, Тисия покинула свою родину в Калатипсоми и заслужила славу по всей [Concept('aversaria','Аверсарии')|E] не только тем, что исцелила тысячи людей и остановила множество эпидемий, но и своими постоянными проповедями, призывающими лекарей отбросить предрассудки и исцелять слабых и сильных, рабов и граждан, людей и нелюдей. Она снискала любовь аавтократа Фансиса, что, по мнению многих, стало главной причиной, по которой большинство святых пережили свое восстание, но вскоре после этого приняла мученическую смерть. С тех пор на протяжении веков потомки ее благодарных пациентов призывают ее имя для дарования доброго здравия и удачи, а «Кодекс Тисии» остается одним из самых полных медицинских уставов на [Concept('the_continent','континенте')|E]."
 philanthros_pure_patron_saint_name:0 "Филантр Щедрый"
 philanthros_pure_patron_saint_desc:0 "Видя, как сильно страдают бедные и нуждающиеся под гнетом аверсарианской аристократии, Филантр сделал помощь им целью всей своей жизни. Он сурово обличал опахасийских дворян, которые морили голодом своих крестьян ради проведения все более пышных пиров. Он призывал всех, у кого есть средства, помогать обездоленным и бороться против тех, кто копит богатства за счет своих подопечных. Мы стремимся следовать его примеру, собирая пожертвования с народа для помощи нуждающимся и обводя вокруг пальца недостойных богачей."
 forgotten_pure_patron_saint_name:0 "Забытый Святой"
 forgotten_pure_patron_saint_desc:0 "Самый таинственный и неуловимый из агионистских святых. Как утверждается, Забытый Святой был монахом Алого Избранника Вунилла, который ушел вместе с небольшой группой других монахов после формирования экстремистской фракции внутри Горного Солнца. Забытый Святой избрал своей целью [Concept('magi','магов')|E] как политический класс и бросил вызов концепции «Божественной реинкарнации» аавтократов, заявляя, что поклонение магам и их силам — это гниль, которую необходимо выжечь из этого мира. Проявлять смирение и отвергать идолопоклонство Империи означает проявлять веру и благочестие, ибо все мужчины и женщины равны, а уничтожение ложных разделений между человечеством — единственный путь к коллективному спасению."
 calysto_pure_patron_saint_name:0 "Калисто Освободитель"
 calysto_pure_patron_saint_desc:0 "Знаменитый пиратский капитан и освободитель рабов, Калисто родился в небольшой рыбацкой деревушке на юго-восточных островах. Попав сначала в рабство на галеры к пиратам, а позже к морским легионам Аверсарии, Калисто успешно возглавил восстание рабов и создал собственный пиратский флот. Плавая по всей [Concept('aversaria','Аверсарии')|E], святой Калисто совершал налеты на невольничьи рынки и плантации, освобождая рабов и поднимая за собой восстания, ибо он верил, что нет ничего ценнее свободы."
 
 
 eos_corrupt_patron_saint_name:0 "Эос Сильный"
 eos_corrupt_patron_saint_desc:0 "Малькойский дворянин, наемник, искатель приключений и [Concept('antimagi','антимаг')|E], Эос поднялся по служебной лестнице благодаря своей силе и стал величайшим фехтовальщиком своего времени. В начале восстаний он вызвал на дуэль легата Сансию, чтобы доказать свое могущество. Победа открыла ему истину о праведности: Чистейший признает только силу. Для нас, его последователей, не имеет значения, чего мы хотим или что делаем. Быть сильнейшим — вот доказательство истинности нашей веры, позволяющее нам с честью держать пылающий меч святого Эоса."
 sansia_corrupt_patron_saint_name:0 "Сансия Завоевательница"
 sansia_corrupt_patron_saint_desc:0 "Сансия Завоевательница воплотила в себе мощь [Concept('aversaria','Аверсарии')|E], став могущественным архилегатом, внушавшим страх всему континенту. Прославленная своим мастерством в бою, она закрепила свою славу, разгромив опахасийские губернаторские легионы в битве при Платейре, где вырезала их до последнего человека. Сансия верила, что полководец должен повелевать как войной, так и страхом, и что только через страдания, жертвы и боль люди становятся ближе к Чистейшему. Поэтому, ради спасения душ язычников и защиты Орденов, мы должны оттачивать это ремесло не только на наших врагах, но и на самих себе."
 dikaynos_corrupt_patron_saint_name:0 "Дикайн Хранитель Закона"
 dikaynos_corrupt_patron_saint_desc:0 "Дикайн был безжалостным крестоносцем во имя правосудия, ни разу не позволив состраданию или чуткости омрачить свое суждение. Мы тоже не должны позволять нашей собственной человеческой слабости мешать нашей неустанной войне против беспорядка, ибо закон и слеп, и беспощаден!"
 katharitos_corrupt_patron_saint_name:0 "Кахарит Чистый"
 katharitos_corrupt_patron_saint_desc:0 "Кахарит путешествовал по миру и подолгу говорил о чистоте сердца, разума и тела. В то время как некоторые утверждают, что эта чистота заключалась в самосовершенствовании и свободной любви, для истинно верующих уже давно очевидно, что Святой на самом деле имел в виду чистоту крови и физической формы."
 thysia_corrupt_patron_saint_name:0 "Тисия Исследовательница"
 thysia_corrupt_patron_saint_desc:0 "Тисия верила, что медицинские знания необходимо сохранять и расширять, и мечтала о мире, где каждый, кто достоин звания лекаря, будет знать лекарства от всех болезней и ядов. Вполне естественно, что те, кто следует за великой Святой, сделают все, что в их силах, дабы познать тело и его недуги. #N Абсолютно все#!."
 philanthros_corrupt_patron_saint_name:0 "Филантр Проницательный"
 philanthros_corrupt_patron_saint_desc:0 "Филантр видел, как бедные и нуждающиеся страдают под властью аристократии [Concept('aversaria','Аверсарии')|E], и стремился помочь им, собирая пожертвования. Но пустынные язычники не видят этого и отказываются отдавать то, что причитается избранникам самого святого. Ведь в нынешние времена кто нуждается сильнее, чем Орден — самые благородные и преданные последователи Филантра? Наш неустанный долг — использовать эти подношения для помощи тем, кто заслуживает этого больше всего: нам самим. Так несите же вино и лучшую еду. Давайте пировать, как знать Опахасии!"
 forgotten_corrupt_patron_saint_name:0 "Забытый Святой"
 forgotten_corrupt_patron_saint_desc:0 "Существо силы и могущества, Забытый Святой спустился со святого Вунилла как мифическая фигура, неопознаваемый и затмевающий власть ничтожных автократов, которые, как Он доказал, были лишь претендентами на Его собственное воспетое божественность. В восстаниях самые ревностные и праведные последователи Забытого Святого доказали Ему свою верность, принеся жертву ради уничтожения ложной реинкарнации Чистейшего и вырезав дьявольских детей аавтократа Фансиса во имя святого имени Забытого. Его последователи до сих пор скрывают свои лица, подражая его славе и поклоняясь Ему в память о Его вознесении к божественности после уничтожения и принесения в жертву стольких более слабых богов."
 calysto_corrupt_patron_saint_name:0 "Калисто Разбойник"
 calysto_corrupt_patron_saint_desc:0 "Знаменитый пиратский капитан и освободитель рабов, Калисто захватил власть, поднявшись из самых низов. Он плавал по всей [Concept('aversaria','Аверсарии')|E], совершая налеты на невольничьи рынки, плантации и особняки ради всех их богатств и рабов. Он освобождал нуждающихся, порабощая их в этой жизни для служения нам, дабы в следующей жизни они стали истинными верующими. Таким образом он дал всем нам самое важное — свободу."
 
