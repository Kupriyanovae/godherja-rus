l_russian:
  ritewars_struggle:0 "Северные Войны Обрядов"
  ritewars_struggle_desc:1 "$game_concept_ritewars_struggle$"

  game_concept_rite_wars_south_struggle:0 "Южные Войны Обрядов"
  game_concept_rite_wars_south_struggle_desc:0 "$game_concept_rite_wars_south_struggle$ описывают конфликты и расколы среди сьялволков, живущих в Опакасии после смерти Ценвара «Сокрушителя Ведьм». Зародившаяся из великого переселения на Расколотое побережье, эта [Concept( 'struggle', 'борьба' )|E] переходит между [Concept( 'struggle_phase_phases', 'фазами' )|E] насилия, настороженных перемирий и прагматичного сотрудничества. Постоянных союзников здесь мало, и [Concept( 'rulers', 'правители' )|E] должны остерегаться полагаться исключительно на общую [Concept('faith', 'конфессию' )|E] или [Concept( 'culture', 'культуру' )|E]."

 game_concept_rite_wars_south:0 "Южные Войны Обрядов"
 game_concept_rite_wars_south_desc:0 "$game_concept_rite_wars_south_struggle$ описывают конфликты и расколы среди сьялволков, живущих в Опакасии после смерти Ценвара «Сокрушителя Ведьм». Зародившаяся из великого переселения на Расколотое побережье, эта [Concept( 'struggle', 'борьба' )|E] переходит между [Concept( 'struggle_phase_phases', 'фазами' )|E] насилия, настороженных перемирий и прагматичного сотрудничества. Постоянных союзников здесь мало, и [Concept( 'rulers', 'правители' )|E] должны остерегаться полагаться исключительно на общую [Concept('faith', 'конфессию' )|E] или [Concept( 'culture', 'культуру' )|E]."

 game_concept_struggle_phase_rite_wars_south_opportunity:1 "Фаза возможности"
 game_concept_struggle_phase_rite_wars_south_opportunity_desc:2 "После долгого периода относительно мирного сосуществования во время [Concept( 'struggle_phase_rite_wars_south_conciliation', 'фазы примирения' )|E], начинает проступать беспечность. Как крестьяне, так и знать привыкают к тому, что всё просто #EMP работает#!, давая проницательным [Concept( 'characters', 'персонажам' )|E] шанс нажиться на их наивности.\n\nконце концов новые злоупотребления приведут либо к эскалации в [Concept( 'struggle_phase_rite_wars_south_hostility', 'фазу враждебности' )|E], либо же искусная политика достигнет хрупкого равновесия через [Concept('struggle_phase_rite_wars_south_conciliation','фазу примирения')|E]."

 game_concept_struggle_phase_rite_wars_south_hostility:1 "Фаза враждебности"
 game_concept_struggle_phase_rite_wars_south_hostility_desc:2 "Напряжённость нарастает, и закипают страсти в этой $game_concept_struggle_phase_phase$. Повторяющиеся акты злобы и усугубление недопониманий во время [Concept(struggle_phase_rite_wars_south_opportunity','фазы возможности')|E] привели к росту ненависти к [Concept( 'characters', 'персонажам' )|E] с иными [Concept( 'culture', 'культурами' )|E], [Concept('faith', 'конфессиями' )|E] или, того #EMP хуже#!: к тем, у кого и то, и другое одновременно.\n\nОднако кровопролитие не может продолжаться вечно. Рано или поздно либо здравый смысл, либо банальное истощение приведут побережье к [Concept( 'struggle_phase_rite_wars_south_compromise','фазе компромисса')|E]"

 game_concept_struggle_phase_rite_wars_south_compromise:1 "Фаза компромисса"
 game_concept_struggle_phase_rite_wars_south_compromise_desc:2 "Будь то из-за усталости от междоусобиц [Concept( 'struggle_phase_rite_wars_south_hostility', 'фазы вражды' )|E] или благодарю умелой эскалации во время [Concept('struggle_phase_rite_wars_south_conciliation','фазы примирения')|E], $game_concept_struggle_phase_rite_wars_south_compromise$ знаменует собой растущее согласие между народами Опакасии. Разногласия отходят на второй план, а общая история и наследие связывают бывших врагов воедино.\n\nПобережье стоит на перепутье: если конфликты возобновятся, то новая [Concept('struggle_phase_rite_wars_south_opportunity','фаза возможности')|E] уже не за горами."

 game_concept_struggle_phase_rite_wars_south_conciliation:1 "Фаза примирения"
 game_concept_struggle_phase_rite_wars_south_conciliation_desc:1 "Результат заметных плодов [Concept( 'struggle_phase_rite_wars_south_compromise','фазы компромисса')|E], во время этой $game_concept_struggle_phase_phase$, Отношения между народами Опакасии становятся настолько душевными, что чужакам трудно понять подобную терпимость. Особенно частыми становятся меж-[Concept('faith', 'конфессиональные' )|E] [Concept( 'marriages', 'браки' )|E].\n\nНо это не может длиться вечно, и злоупотребление доверием в конечном итоге вернет [Concept('rite_wars_south_struggle','Южную Войну Обрядов')|E] к [Concept( 'struggle_phase_rite_wars_south_compromise','фазе компромисса')|E]."
 
