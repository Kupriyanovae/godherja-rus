l_russian:
 learn_magic_outcome.0001.t:1 "$learn_magic_school_scheme$: Успех!"
 learn_magic_outcome.0001.desc:3 "После долгих месяцев изучения искусства [Localize(Concatenate(school_to_learn_scope.MakeScope.Var('unique_magic_school_identifier').GetFlagName, '_name'))] под руководством [target.GetTitledFirstName] я наконец чувствую, что мои труды приносят плоды. Заклинания и теории, которые раньше были за пределами моего понимания, теперь даются мне с легкостью. Многие придворные (и сам[Select_CString(target.IsFemale, 'а', '')] [target.GetTitledFirstName]) заметили, как возросло мое мастерство в [Localize(Concatenate(school_to_learn_scope.MakeScope.Var('unique_magic_school_identifier').GetFlagName, '_name'))]."
 learn_magic_outcome.0001.a:0 "Мои новые навыки неоспоримы!"
 
 
 learn_magic_outcome.0002.t:1 "$learn_magic_school_scheme$: Провал!"
 learn_magic_outcome.0002.desc:3 "Хотя я изучаю искусство [Localize(Concatenate(school_to_learn_scope.MakeScope.Var('unique_magic_school_identifier').GetFlagName, '_name'))] уже больше года, я чувствую себя не более [Select_CString(ROOT.Char.IsFemale, 'искушенной', 'искушенным' )] чем в день, когда [target.GetTitledFirstName] только начал[Select_CString(target.Char.IsFemale, 'а', '' )] моё обучение. Сколько бы я ни практикова[Select_CString(ROOT.Char.IsFemale, 'лась', 'лся')], тайны этой школы остаются за гранью понимания."
 learn_magic_outcome.0002.a:0 "Возможно, мне просто нужно учиться усерднее?.."

 learn_magic_outcome.0101.t:1 "$learn_magic_spell_scheme$: Успех!"
 learn_magic_outcome.0101.desc:3 "Сегодня я праздную победу! Труды, любезно предоставленные мне [target.GetTitledFirstName], раскрыли тайны чар [spell_to_learn_scope.Custom('SpellName')]. Теперь это заклинание пополнило мой арсенал магических тайн и сокрушительных заклятий, готовых к использованию по первому требованию. При желании я мог[Select_CString(ROOT.Char.IsFemale, 'ла', '')] бы даже обучить ему других!"
 learn_magic_outcome.0101.a:0 "Еще одно заклинание в моей коллекции."
 
 
 learn_magic_outcome.0102.t:1 "$learn_magic_spell_scheme$: Провал!"
 learn_magic_outcome.0102.desc:3 "Я бессильно откидываюсь на спинку кресла, вновь потерпев поражение перед стопкой пергамента. Сложные формулы и закольцованные заклинания, покрывающие страницы, оказались мне не по зубам. Неужели я ещё не готов[Select_CString(ROOT.Char.IsFemale, 'а', '')]? Смогу ли я вообще когда-нибудь овладеть этим искусством? Или [target.GetTitledFirstName] меня обманул[Select_CString(target.IsFemale, 'а', '')]?\n\nКак бы то ни было, [spell_to_learn_scope.Custom('SpellName')] мне не постичь с такими материалами."
 learn_magic_outcome.0102.a:0 "Возможно, мне просто нужно учиться усерднее?.."
 