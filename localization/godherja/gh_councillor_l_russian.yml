 task_commerce_raid_desc:0 "Совершайте набеги на торговлю и купеческие пути в окрестностях вашей империи. Нажмите на это задание, чтобы увидеть вашу текущую зону набегов, а затем нажмите на любое графство в этой зоне, чтобы начать грабить их все."
 task_commerce_raid_effect_desc_1:0 "\nВ настоящее время вы можете получать @gold_icon!#P #tooltip:commerce_raiding_income_tooltip [GetPlayer.MakeScope.ScriptValue('quartermaster_commerce_raid_income')]#!#! [gold|E] в месяц от торговых набегов"
 task_commerce_raid_effect_desc_2:0 "\nВ настоящее время вы можете получать @gold_icon!#P [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('quartermaster_commerce_shadow_trade_cap')|V]#! [gold|E] из возможных @gold_icon!#P [GuiScope.SetRoot(GetPlayer.MakeScope).ScriptValue('quartermaster_commerce_raid_income')|V]#! [gold|E] в месяц от торговых набегов."
