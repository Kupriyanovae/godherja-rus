 camp_purpose_beast_hunters: "Охотники на чудовищ"
 camp_purpose_beast_hunters_effects: "$EFFECT_LIST_BULLET$Находят больше [Concept('slayer_task_contracts','контрактов истребителя')|E]\n$EFFECT_LIST_BULLET$Находят немного больше [Concept('task_contracts','контрактов')|E], связанных с [Concept('prowess','доблестью')|E] и [Concept('martial','военным делом')|E] и [Concept('transport_task_contracts','перевозкой')|E]\n$EFFECT_LIST_BULLET$Открывает [Concept('camp_buildings','постройки лагеря')|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_reference_corpus').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n\n#WEAK Сколь долго человечество существует на [Concept('aeras','Эрасе')|E], столь же долго людям приходилось истреблять целые виды свирепых, зловещих и [Concept('aelfir','чужеродных')|E] тварей ради славы и выгоды.#!"

 camp_purpose_migration_band: "Орда переселенцев"
 camp_purpose_migration_band_effects: "$EFFECT_LIST_BULLET$Находят больше [Concept('migration_task_contracts','контрактов на переселение')|E]\n$EFFECT_LIST_BULLET$Находят немного больше [Concept('task_contracts','контрактов')|E], связанных с [Concept('diplomacy','дипломатией')|E].\n$EFFECT_LIST_BULLET$Открывает [Concept('camp_buildings','постройки лагеря')|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n\n#WEAK Огромные сонмы выживших, воинов и оборванных беженцев сплотились в [Concept('sjalvolki_migration','великий поход')|E], ища спасения дальше на юге от [Concept('the_fog','Тумана')|E].#!"