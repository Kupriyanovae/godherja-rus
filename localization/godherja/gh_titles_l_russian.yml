 b_rodcasters_niche: "Rodcaster's Niche"
 b_rodcasters_niche_desc: "The discovery of hundreds of magical rods and wands in the ancient chamber here is said to have earned it its name, though some [mayikrata|E] scholars claim that the discovery is a myth and the name only came into being after the establishment of arcane workshops in the settlements here thereafter. Some acolytes claim the name is actually related to a popular [Concept('aversaria','Aversarian')|E] innuendo, though this is highly frowned upon by the magisterial class."
 b_aeonic_passage: "Aeonic Passage"
 b_aeonic_passage_article: "the "
 b_aeonic_passage_desc: "Old acolytes' tales speak of the Aeonic Passage continuing on forever, the tales claiming that cruel magisters once forced acolytes to walk down the hall to study its length, all of whom walked until the end of their lives."
 c_wyrmroad_passage: "Wyrmroad Passage"
 c_wyrmroad_passage_article: "the "
 b_wyrmrest: "Wyrmrest"
 b_wyrmrest_desc: "What started as a way station to protect caravans passing down the Wyrmroad from the Imperial Atrium to the Scriptoriums grew — after the Underwar of 899 IS — to become an imposing fortress. The establishment of the Magisterial Tithe led to the Wyrmrest to transform into an important trading post, which would soon become one of the largest merchant city's in the [mayikrata|E]."
 b_great_traverse: "Great Traverse"
 b_great_traverse_article: "the "
 b_thixicars_footprints: "Thixicar's Footprints"
 b_thixicars_footprints_desc: "Named for the [magi|E] Thixicar, who is said to have dispelled a mysterious glowing barrier that blocked [Concept('aversaria','Imperial')|E] expansion deeper into the [mayikrata|E] for over a decade — though he would vanish after passing its threshold, just before its dissipation."
 d_scriptoriums: "Scriptoriums"
 d_scriptoriums_article: "the "
 d_scriptoriums_desc: "Decades of hellish efforts by [mayikrata|E] explorers to establish a foothold in these once incredibly cursed and [Concept('magic','magically')|E] corrupted chambers was rewarded with the discovery of incredibly ancient scrolls and tomes. While the vast majority of which were never able to be translated, those that were unlocked incredible rituals for the [Concept('aversaria','Aversarians')|E]."
