 c_uterayerabu_desc: "This [county|E] is known for being one of the most important trading centers in the eastern [Glossary('Sarradonian Desert','sarradonian_desert_encyclopedia_desc')]. It connects caravans for trade on the lucrative salt runs to [Glossary('Kratemezin','crater_encyclopedia_desc')] and even as far as [Glossary('Damota','damota_encyclopedia_desc')]. The city's origins are unknown, but it became an important center in eastern [sarradon|E] during the [Concept('marmaladid_invasions', 'Great Tarrafent')|E] period."
