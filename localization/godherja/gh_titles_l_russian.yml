 c_behemoths_lair_desc: "«Бегемоты» из преданий пещерных племён — грузные двуногие твари с бурой шерстью, когтями в человеческий рост и пастью, усаженной зазубренными зубьями — доселе не являлись взору тех немногих исследователей, что отважились ступить в эти пещеры. Некоторые учёные полагают, что они переселились из подземного мира за несколько столетий до того, как [Concept('aversaria','имперцы')|E] вообще открыли это место, хотя ответа на вопрос, куда именно они могли кануть, не существует."
