 c_felakese: "Фелакесе"
 c_felakese_desc: "Фелакесе был столицей царства Кхенемхат, где мифические Цари Джиннов из древних времен сошлися со своими призрачными союзниками. Дворец в центре города был огражден мощными чарами со времени его падения во время великой осады 207 года И.С., когда Царству Саррадон наконец удалось преодолеть могущественную магию Царей Джиннов неизвестными ныне средствами. Это, вероятно, к лучшему, поскольку немногие искатели приключений, которым удалось прорваться в старую царскую резиденцию и выйти живыми, принесли с собой истории об искривленных, кошмарных коридорах теней, которые, казалось, бросали вызов даже самим законам геометрии."
