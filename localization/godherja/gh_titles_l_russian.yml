 b_sazzagum_desc: "The holiest place in the Zivvirathi underworld. It is here that the lost First Ones were transported beneath the great fires that consumed the world so long ago. Here the most holy priests guard the Great Book of the First Ones and daily sacrifice fish and scale to the effigies of the kindly gods Zikkuru, Kam-kazoll and Zanzabu."
