 b_amphorica_desc:0 "Прото-аверсарианское божество наслаждений, М'фирис, имело свой главный центр поклонения в этом древнем городе. Он также широко считается родиной и, вероятно, источником названия сосуда амфоры, хотя это утверждение горячо оспаривалось полисом Имфакро в Саррадоне."
