 c_deepwater:0 "Глубоководье"
 c_deepwater_adj:0 "Глубоководьейск"
 c_deepwater_desc:0 "Крупнейшее [Concept('mayikrata','майикратское')|E] поселение за пределами самих покоев Академии. Убийство пещерного кракена [Concept('magi','магом')|E] Вароксом даровало Академии доступ к озеру Теневода. Рыбные промыслы его издревле служили главнейшим источником пропитания Майикратии, а особенности, порождённые юридическим спором IX века и неоднозначным вмешательством Ааутократира Митикса, наделили город собственной вольной хартией и управлением, формально независимым от Магистерского Совета.\n\nЧто особенно важно для многих аколитов, сия странность дала начало второй по значению отрасли Глубоководья: головокружительной сети пропахших рыбой борделей, которые остаются под официальным осуждением Магистерского Совета и при этом пользуются невероятной популярностью среди учёных Академии."
