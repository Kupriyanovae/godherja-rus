 b_fishmans_grove_desc: "It is said by the Zivvirathi that the Fishman's Grove was once the home of Zanzabu, the last god of a great race of fish-headed men. So lonely was Zanzabu as the last of his kind that he built a great boat of scalcarp scales and sailed out to meet the Zivvirathi, where he taught them to build boats and granted them gills with which to breath beneath the undersea."
