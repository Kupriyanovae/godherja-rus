 b_old_mill_desc: "Как правило, это имя есть прямой перевод названия #italic Старая Мельница#! на большинство языков, хотя в иных случаях оно восходит к [GetCulturePillar('language_marcher').GetName] наименованию #italic Одмуль#!.\n\n#italic Мельницу, что дала имя этому поселению, на протяжении минувших столетий многократно оставляли и возрождали вновь, и вокруг неё слагается немало преданий. Доподлинно никому не ведомо, когда она была возведена впервые, но в эпоху шевальениского завоевания края она здесь уже несомненно существовала.#!"
