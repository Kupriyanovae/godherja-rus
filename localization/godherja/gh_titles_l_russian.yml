 c_aervalropolix_desc:0 "Также известный под своим древним именем #EMP Аспомнокс#!, Эрвалрополь был одним из великих городов-государств доимперской [Concept('aversaria','Аверсарии')|E] и прославился как легендарная родина школы [Concept('dead_magic','мёртвой магии')|E]. Поклонение [Concept('aervalr','Эрвалу')|E] вплоть до эпохи ранней Империи дало городу его современное название. Регион на юге Имперского Острова, где он когда-то удерживал гегемонию, назван в его честь и по сей день."
