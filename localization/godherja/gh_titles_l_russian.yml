 d_echoing_acolytes_desc:0 "Названы так из-за множества легенд среди аколитов [mayikrata|E], утверждающих, что вопли множества учеников, упавших с великого Тейссианского Моста, всё ещё эхом доносятся из бесконечной Бездны внизу."
