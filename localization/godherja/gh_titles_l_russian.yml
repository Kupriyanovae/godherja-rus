 c_uterayerabu_desc: "За этим [Concept('county','графством')|E] закрепилась слава одного из важнейших торговых центров восточной части [Glossary('Саррадонской пустыни','sarradonian_desert_encyclopedia_desc')]. Здесь сходяться караваны, идущие по прибыльным соляным путям к [Glossary('Кратемезину','crater_encyclopedia_desc')] и даже в далекую [Glossary('Дамоту','damota_encyclopedia_desc')]. Точное время основания города неизвестно, но он стал ключевым центром восточного [Concept('sarradon','Саррадона')|E] в эпоху [Concept('marmaladid_invasions', 'Великого Таррафента')|E]."
