 c_undermarch: "Подмарш"
 c_undermarch_article: ""
 c_undermarch_desc: "Устрашающие племена пираньеротых сзургов более трёх веков преграждали путь к изучению сих пещер, однако старания авантюриста [Concept('marchers','марочника')|E] сэра Кавора ден ва Дуклана увенчались истреблением тех племён и водружением стяга его покровителя, верховного короля Олиерса ден ва Адкур-Ведрона, в первом и единственном (и провальном) марочническом поселении в подземном мире."
