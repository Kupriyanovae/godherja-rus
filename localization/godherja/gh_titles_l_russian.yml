 c_aautokrateia_desc: "The fertile stretch of land between Argontia and Methoe was disputed by various polis for centuries before the founding of the Empire until it was ultimately transferred to Dhaci'xen, the first Aautokratir, as a direct holding and source of income. For the next two centuries, the area would be one of the main sources of reliable taxes for the throne, though it would eventually lose its economic importance as vast stretches of wealthy land came into direct Imperial control with Aversaria's expansion. Despite this, it would remain a popular summer palace site for the rest of the Empire's history, even after ceasing to have any special administrative significance after Aautokratia Theyssia's 8th century reforms."
