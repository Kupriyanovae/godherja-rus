 c_felakese_desc: "Felakese was the capital seat of the kingdom of Khenemhat, where the mythical Djinn-Kings of old would consort with their ghostly allies. The palace at the city's center has been cordoned off by powerful wards ever since its fall in the great siege of 207 BI, which saw the Kingdom of Sarradon finally overcome the Djinn-Kings' potent magic by means now unknown. This is likely for the better, as the few adventurers that managed to break into the old royal seat and emerge alive brought back tales of twisted, nightmarish corridors of shadow that seemed to defy even the rules of geometry itself."
