 b_fishmans_grove_desc: "Зиввираты повествуют, что Роща Рыбочеловека некогда служила обителью Занзабу, последнего бога великой расы рыбоголовых людей. Занзабу, будучи последним в своём роде, терзался таким одиночеством, что построил огромный корабль из чешуи скалкарпа и отплыл навстречу зиввирати, где обучил их корабельному делу и даровал им жабры, дабы они могли дышать под водами подземного моря."
