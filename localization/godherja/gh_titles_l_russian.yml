 d_dezzil_nest: "Гнездо Дедзила"
 d_dezzil_nest_article: ""
 d_dezzil_nest_desc: "Первые волны [Concept('aversaria','аверсарианских')|E] исследователей из [Concept('mayikrata','Майикратии')|E] по неразумению пренебрегли предостережениями туземных обитателей подземного мира о лютом создании, известном как «дедзил» — причудливом сплаве крота и жука, во много раз превосходящем коня величиной и способном единым духом поглотить и человека, и целый валун. Лишь одному из всех удалось возвратиться живым после столкновения с дедзилами — и то после того, как пропало с ликом более дюжины отрядов, и с той поры ни одна экспедиция более не дерзала ступить в эти пределы."
