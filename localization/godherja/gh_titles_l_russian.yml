 b_rodcasters_niche: "Ниша Жезлоносца"
 b_rodcasters_niche_desc: "Находка сотен магических жезлов и палочек в древней палете дала ей это имя, хотя некоторые ученые [mayikrata|E] утверждают, что это лишь миф, а имя появилось лишь после создания здесь арканных мастерских. Некоторые аколиты заявляют, что имя на самом деле связано с популярным [Concept('aversaria','аверсарианским')|E] каламбуром, хотя класс магистров относится к этому крайне неодобрительно."
 b_aeonic_passage: "Эонический Проход"
 b_aeonic_passage_article: ""
 b_aeonic_passage_desc: "Старые байки аколитов гласят, что Эонический Проход тянется бесконечно, утверждается, будто жестокие магистры когда-то заставляли аколитов идти по нему, чтобы измерить его длину, и все они шли до конца своих дней."
 c_wyrmroad_passage: "Проход Змеиного Тракта"
 c_wyrmroad_passage_article: ""
 b_wyrmrest: "Покой Змея"
 b_wyrmrest_desc: "То, что начиналось как путевой пост для защиты караванов, идущих по Змеиному Тракту из Имперского Атриума к Скрипториям, выросло — после Подземной войны 899 года И.С. — во внушительную крепость. Введение Магистерской Десятины превратило Покой Змея в важный торговый пункт, вскоре ставший одним из крупнейших купеческих городов [mayikrata|E]."
 b_great_traverse: "Великий Переход"
 b_great_traverse_article: ""
 b_thixicars_footprints: "Следы Тиксикара"
 b_thixicars_footprints_desc: "Назван в честь [magi|E] Тиксикара, который, как говорят, развеял загадочный светящийся барьер, блокировавший [Concept('aversaria','имперскую')|E] экспансию вглубь [mayikrata|E] более десятилетия — хотя сам он исчез сразу после того, как переступил его порог, прямо перед его рассеиванием."
 d_scriptoriums: "Скриптории"
 d_scriptoriums_article: ""
 d_scriptoriums_desc: "Десятилетия адских усилий исследователей [mayikrata|E] по закреплению в этих некогда невероятно проклятых и [Concept('magic','магически')|E] оскверненных покоях были вознаграждены открытием непостижимо древних свитков и фолиантов. Хотя подавляющее большинство из них так и не удалось перевести, те, что были расшифрованы, открыли невероятные ритуалы для [Concept('aversaria','аверсарианцев')|E]."
 c_the_scrivenexate: "Скривенексат"
 c_the_scrivenexate_article: ""
 b_archivate: "Архиват"
 b_archivate_article: ""
 b_the_lyceum: "Лицей"
 b_the_lyceum_article: ""
 b_scholars_aisle: "Проход Ученых"
 c_the_scrivenery_tower: "Писарейская Башня"
 c_the_scrivenery_tower_article: ""
 b_the_scrivenery_tower: "Писарейская Башня"
 b_the_scrivenery_tower_article: ""
 c_novixary: "Новиксарий"
 c_novixary_article: ""
 c_novixary_desc: "Новиксарий был единственным комплексом покоев в Скрипториях, доступным для [Concept('aversaria','аверсарианских')|E] исследователей на протяжении десятилетий, и стал домом для первых поселений. Когда его архивы и укрепления обратились в прах в борьбе задолго до начала времен, городки в его покоях стали домом для новейших аколитов [Concept('mayikrata','Майикраты')|E] — как для назначения на кажущуюся бесконечной работу по расчистке завалов, так и для акклиматизации к подземному миру."
 b_burntscroll: "Обугленный Свиток"
 b_ivaxs_curse: "Проклятие Иваксы"
 b_ivaxs_curse_desc: "После месяцев исследования этого комплекса покоев было обнаружено [Concept('magic','магически')|E] сохранившееся начертанное кровью проклятие против древнего [magi|E] по имени Иваксиритикетэран — [Concept('aelfir','Первого Человека')|E] согласно нескольким местным культам [mayikrata|E]. Лишь шесть из почти сотни рун были успешно переведены, но каждая таила великую силу для арканософов Майикраты. Перевод шестого слова каким-то образом вызвал мощный взрыв, обрушивший комнату с проклятием, и десятки попыток найти его снова потерпели неудачу."
 d_cantoments: "Кантоменты"
 d_cantoments_article: ""
 c_deathgate: "Врата Смерти"
 c_deathgate_article: ""
 c_deathgate_desc: "Лишь усилия трех целых легионов, посланных Ааутократиром Митиксом — за немалую цену — вместе с крупнейшей армией, когда-либо собранной под землей [mayikrata|E], смогли обезопасить вход в Кантоменты от двуногих инсектоидов, кишащих в их покоях. Цена этой жестокой кампании фактически положила конец всем дальнейшим попыткам Магистерского Совета расширить Академию глубже под землю и считается пиком [Concept('aversaria','имперского')|E] могущества в подземном мире."
