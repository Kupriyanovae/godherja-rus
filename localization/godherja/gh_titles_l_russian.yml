 b_blackpost: "Blackpost"
 b_cave_of_the_salamanders: "Cave of the Salamanders"
 b_cave_of_the_salamanders_desc: "No scholar has ever been able to discover why explorers discovered this region of caverns filled with thousands of dog-sized olm-like salamanders, but those hatched from captured eggs proved reliable companions, and quickly became popular pets in the [mayikrata|E] and later Aironoi."
 d_emerald_warrens: "Emerald Warrens"
 d_emerald_warrens_article: "the "
 d_emerald_warrens_desc: "Glittering with seemingly endless veins of emerald, the [Concept('aversaria','Aversarians')|E] of the [mayikrata|E] took great interest in exploiting them with mass slave-labor overseen by indentured acolytes, but numerous strange incidents and deaths associated with 'Underjade' led to the emerald veins being declared cursed and banned by Aautokratia Theyssia. Secret exploitation of the material was largely ended by the general degradation of the Mayikrata's order and prosperity, and the gem thereafter would become extremely prized by curious — and ill-advised — [magi|E]."
 c_forsaken_emperors: "Forsaken Emperors"
 b_tiny_vault: "Tiny Vault"
 b_tiny_vault_article: "the "
 b_tiny_vault_desc: "It took seven years to discover a way to open the eponymous small stone vault discovered at the bottom of a deep chasm within this stretch of caves. While nobody has ever ascertained why it only stored a single unremarkable (and uncursed) emerald, tales of the vault and its discovery have nevertheless remained popular and incredibly exagerrated. While its origin is likely unknown, the Marcher fairytale of Sir Ranos and the Green Stone Box likely has its roots in the Tiny Vault."
