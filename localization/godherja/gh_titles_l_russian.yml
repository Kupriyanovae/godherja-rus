 b_cave_of_the_salamanders_adj:0 "Пещера-саламандрск"
 b_cave_of_the_salamanders_desc:0 "Ни единому учёному так и не довелось постичь, почему исследователи обнаружили сей регион пещер заполненным тысячами саламандр, подобных протеям и величиной с собаку, но те, что вылупились из захваченных яиц, оказались надёжными спутниками и вскоре стали излюбленными питомцами в [Concept('mayikrata','Майикратии')|E], а затем и в Айроное."
 d_emerald_warrens:0 "Изумрудные Норы"
 d_emerald_warrens_adj:0 "Изумрудн"
 d_emerald_warrens_article:0 ""
 d_emerald_warrens_desc:0 "Сверкая, казалось бы, бесконечными изумрудными жилами, [Concept('aversaria','аверсарианцы')|E] из [Concept('mayikrata','Майикратии')|E] пламенели великим интересом к их разработке, которую вели с помощью массового рабского труда под надзором кабальных аколитов. Однако многочисленные странные происшествия и смерти, связанные с «Поднефритом», привели к тому, что изумрудные жилы были объявлены проклятыми и запрещены ааутократом Тейссией. Тайная выработка материала прекратилась из-за общего упадка порядка и процветания Майикратии, и с тех пор самоцвет стал чрезвычайно цениться любопытными — и неразумными — [Concept('magi','магами')|E]."
 c_forsaken_emperors:0 "Брошенные Императоры"
 c_forsaken_emperors_adj:0 "Брошенн"
 b_tiny_vault:0 "Крошечный Склеп"
 b_tiny_vault_adj:0 "Крошечн"
 b_tiny_vault_article:0 ""
 b_tiny_vault_desc:0 "Потребовалось семь лет, чтобы отыскать ключ к открытию одноимённого малого каменного склепа, обнаруженного на дне глубокой расселины в сей части пещер. Хотя никто так и не постиг, почему внутри хранился лишь один ничем не примечательный (и отнюдь не проклятый) изумруд, предания о склепе и его обретении тем не менее остаются в ходу и обрастают невероятными преувеличениями. И сколь бы неизвестным ни было его истинное происхождение, маршерская сказка о сэре Раносе и Зелёной Каменной Шкатулке, вероятно, берёт начало в Крошечном Склепе."
