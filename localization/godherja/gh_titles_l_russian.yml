 b_sandos_camp_desc: "Nobody is quite sure who the [magi|E] Sando was, and the variety of [mayikrata|E] tall-tales attributed to him give sparingly little information, but the name 'Sando's Camp' has nevertheless been recorded as the name of this stretch of caves since possibly even before the first [Concept('aversaria','Aversarian')|E] explorers first lit a torch here."
