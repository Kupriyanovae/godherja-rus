 c_vardain: "Вардайн"
 c_vardain_desc: "Вольный город Вардайн когда-то доминировал на севере [chevalie|E], но по мере того как граница отступала всё дальше на юг, угасали и его богатства. С момента его аннексии Великим Герцогством Зьемойич в 1230 году И.С., в нём почти не осталось жителей, кроме солдат и падальщиков."
 b_east_vardain: "Восточный Вардайн"
 b_east_vardain_desc: "Первоначально назван в честь генерала Бастиона, Гарода Вардайна. После того как Старый Вардайн раскинулся через Озеро Ведьм и сгорел дотла, восточная часть города процветала. Когда-то считавшийся одним из красивейших городов [chevalie|E], он давно утратил свое былое величие."
