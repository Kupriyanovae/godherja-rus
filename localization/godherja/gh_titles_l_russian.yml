 d_echoing_acolytes_desc: "Названы так из-за множества легенд среди аколитов [mayikrata|E], утверждающих, что вопли множества учеников, упавших с великого Тейссианского Моста, все еще эхом доносятся из бесконечной Бездны внизу."
