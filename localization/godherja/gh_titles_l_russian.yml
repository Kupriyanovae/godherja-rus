 c_undermarch: "Undermarch"
 c_undermarch_article: "the "
 c_undermarch_desc: "Horrific tribes of the piranha-mouthed szurgi prevented the exploration of these caves for over three centuries, but the efforts of the [Concept('marchers','Marcher')|E] adventurer Sir Cavor den va Duclan saw the tribes wiped out and the banner of his patron, High King Oliers den va Hadcourte-Vedron, planted at the first and only (failed) Marcher settlement in the underworld."
 b_pathheart_cove: "Pathheart Cove"
 b_bastione-under-the-sea: "Bastione-under-the-sea"
 d_imperial_subterrane: "Imperial Subterrane"
 d_imperial_subterrane_article: "the "
 d_imperial_subterrane_desc: "The only truly 'settled' section of the caverns by the [mayikrata|E], the Imperial Subterrane became an extremely important traderoute for the [Concept('aversaria','Imperials')|E], connecting the city of Cavewater and its fisheries to the underground cities of the Academy proper."
 c_imperial_caveway: "Imperial Caveway"
