 b_cave_of_the_obsidian_warrior_desc: "The first of two [Concept('aversaria','Aversarian')|E] explorers to ever reach this portion of the [mayikrata|E], the [magi|E] Irvaxas, claimed that a towering [Concept('aelfir','alien')|E] warrior frozen in black stone stood in this cavern and whispered at her to coat her onyx visage with the blood of Irvaxas's favorite slave — a demand she felt deeply and disturbingly compelled to do. The second expedition to reah the cave led by her disciple Mathaxa would find the statue gone, a pool of dried blood where it once stood."
