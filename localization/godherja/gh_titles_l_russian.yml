 c_flooded_battery_article: ""
 b_tube: "Труба"
 b_tube_article: ""
 b_tube_desc: "Никому не ведомо, для какой цели мог служить громадный металлический цилиндр, выступающий из древней каменной кладки внутри Затопленной Батареи. Ржавея на протяжении эонов и будучи окружён ещё более странными металлическими «семенами», племена зиввирати постановили, что боги не благоволят изучению сей машины человеком, когда одно из «семян» разразилось жестоким взрывом, истребив древнее племя Сиввисолли, дерзнувшее его вскрыть."
