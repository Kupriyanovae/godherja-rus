 b_amphorica_desc: "A proto-Aversarian deity of pleasure, M'phiris, had her most prominent centre of worship in this ancient city. It is also commonly regarded as the pioneer and likely namesake of the amphora vessel, though this has been hotly contested by the polis of Imphacro in Sarradon."
