 c_soterian_cities: "Сотерианские Города"
 c_soterian_cities_desc: "К X веку северные покои Имперского Атриума стали известны местным жителям его растущих подгородов как 'Экссанианские Города', названные в честь противоречивой [Concept('aelfir','Первой Женщины')|E] затмений, заката и подземного мира. После запрета культов Экссании Ааутократиром Клитомедом из-за предполагаемого покушения, архимаг Аксия очистила более сотни (предполагаемых) экссанианских аколитов и запретила этот термин, а Магистерский Совет вскоре официально назвал регион в честь его легендарных врат."
 b_gate_of_soter: "Врата Сотера"
 b_gate_of_soter_article: ""
 b_gate_of_soter_desc: "Легендарные Врата Сотера стали предание практически сразу после обнаружения — настолько огромные, что под их величественной аркой мог бы уютно расположиться целый город, а решетки их выбитой и сломанной герсы были больше большинства башен. Массивные груды древнего металла, рассеянные по столь же гигантской 'надвратной башне', снабжали Майикрату металлом почти век и были использованы для постройки Чёрных Врат, у которых в первые годы заселения [mayikrata|E] сдерживались тысячи подземных тварей."
