 c_cosmogene_desc:0 "Согласно древней сихнамской мифологии, болота в устье великой реки этого региона были местом, где боги впервые собрались, чтобы сотворить остальной [aeras|E]. Хотя этот миф о сотворении мира уже давно перестал восприниматься как нечто большее, чем просто языческая сказка, местное [Concept('county','графство')|E] тем не менее продолжает носить имя, являющееся производным от «Рождение Космоса», в качестве любопытного реликта."
