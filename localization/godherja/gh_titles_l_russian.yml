 b_bastione-under-the-sea: "Бастион-под-морем"
 d_imperial_subterrane: "Имперская Подземка"
 d_imperial_subterrane_article: ""
 d_imperial_subterrane_desc: "Единственный подлинно обитаемый участок пещер [Concept('mayikrata','Майикратии')|E], Имперская Подземка, стала крайне важной торговой артерией для [Concept('aversaria','имперцев')|E], связывавшую город Пещерная Вода и его рыболовные промыслы с подземными городами самой Академии."
