 c_aautokrateia_desc:0 "Плодородная полоса земли между Аргонтией и Метое в течение веков была предметом споров различных полисов до основания Империи, пока в итоге не была передана Даки'ксену, первому Аавтократу, в качестве личного владения и источника дохода. В течение следующих двух веков этот регион оставался одним из главных источников надежных налоговых поступлений для трона, хотя со временем он утратил экономическое значение, когда обширные богатые земли перешли под прямое управление Империи благодаря экспансии Аверсарии. Несмотря на это, он оставался популярным местом для летних дворцов на протяжении всей остальной истории Империи, даже после того, как утратил особое административное значение в результате реформ Аавтократии Тейссии в VIII веке."
