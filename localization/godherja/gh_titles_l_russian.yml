 b_the_bleeding_caves:0 "Кровоточащие пещеры"
 b_the_bleeding_caves_desc:0 "Эти пещеры издавна считаются проклятыми: говорят, на седьмом часу каждого седьмого дня их стены плачут кровью. Здесь обосновалось множество странных существ, питающихся застоявшейся кровью из луж, заполняющих глубочайшие провалы."
 b_the_bloody_bends:0 "Кровавые изгибы"
 b_the_carnax_sanctum:0 "Святилище Карнакса"
 b_the_cave_of_the_obsidian_warrior:0 "Пещера Обсидианового воина"
 b_the_cave_of_the_obsidian_warrior_article:0 "зе "
 b_the_cave_of_the_obsidian_warrior_desc:0 "Первая из двух [Concept('aversaria','аверсарианских')|E] исследователей, достигших этой части [mayikrata|E], [Concept('magi','маг')|E] Ирваксас утверждала, будто в пещере стояла громадная статуя [Concept('aelfir','чужеземной')|E] воительницы, застывшей в чёрном камне. Та шептала ей требование омочить своё ониксовое лицо кровью любимого раба Ирваксас. И та, к собственному ужасу, ощутила непреодолимое желание повиноваться. Когда в пещеру добралась вторая экспедиция под предводительством ученицы Ирваксас, Матаксы, статуя исчезла. На её месте осталась лишь лужа засохшей крови."
