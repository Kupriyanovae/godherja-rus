 c_watergem_adj:0 "Водян"
 c_watergem_desc:0 "Повествуют, что именно здесь наездник на рыбах зиввиратов, Зирззумук, обрёл великий Водяной Самоцвет, который ныне покоится в священнейшем храме Саззагума. Множество попыток отыскать подобные самоцветы великой [Concept('magic','магической')|E] силы оставались тщетными, хотя зиввираты извлекли столь несметное число обычных жемчужин в ходе этих поисков, что они утратили почти всякую цену для рыболюдей — на великую радость тем [Concept('mayikrata','майикратским')|E] торговцам, что ведут с ними торговлю."
