 c_novixary:0 "Новиксарий"
 c_novixary_adj:0 "Новиксарийск"
 c_novixary_article:0 ""
 c_novixary_desc:0 "Новиксарий был единственным комплексом покоев в Скрипториях, доступным для [Concept('aversaria','аверсарианских')|E] исследователей на протяжении десятилетий, и стал домом для первых поселений. Когда его архивы и укрепления обратились в прах в борьбе задолго до начала времен, городки в его покоях стали домом для новейших аколитов [Concept('mayikrata','Майикраты')|E] — как для назначения на кажущуюся бесконечной работу по расчистке завалов, так и для акклиматизации к подземному миру."
 b_burntscroll:0 "Обугленный Свиток"
 b_burntscroll_adj:0 "Обугленн"
 b_ivaxs_curse:0 "Проклятие Иваксы"
 b_ivaxs_curse_adj:0 "Проклятие-иваксск"
 b_ivaxs_curse_desc:0 "После месяцев исследования этого комплекса покоев было обнаружено [Concept('magic','магически')|E] сохранившееся начертанное кровью проклятие против древнего [magi|E] по имени Иваксиритикетэран — [Concept('aelfir','Первого Человека')|E] согласно нескольким местным культам [mayikrata|E]. Лишь шесть из почти сотни рун были успешно переведены, но каждая таила великую силу для арканософов Майикраты. Перевод шестого слова каким-то образом вызвал мощный взрыв, обрушивший комнату с проклятием, и десятки попыток найти его снова потерпели неудачу."
 d_cantoments:0 "Кантоменты"
 d_cantoments_adj:0 "Кантоментск"
 d_cantoments_article:0 ""
 c_deathgate:0 "Врата Смерти"
 c_deathgate_adj:0 "Врата-смертийск"
 c_deathgate_article:0 ""
 c_deathgate_desc:0 "Лишь усилия трех целых легионов, посланных Ааутократиром Митиксом — за немалую цену — вместе с крупнейшей армией, когда-либо собранной под землей [mayikrata|E], смогли обезопасить вход в Кантоменты от двуногих инсектоидов, кишащих в их покоях. Цена этой жестокой кампании фактически положила конец всем дальнейшим попыткам Магистерского Совета расширить Академию глубже под землю и считается пиком [Concept('aversaria','имперского')|E] могущества в подземном мире."
