 b_sandos_camp_desc: "Доподлинно не ведомо, кем был [Concept('magi','маг')|E] Сандо, а пестрота [Concept('mayikrata','майикратских')|E] преданий, ему приписываемых, даёт до обидного мало сведений, однако имя «Лагерь Сандо» тем не менее закрепилось за этим участком пещер — возможно, ещё до того, как первые [Concept('aversaria','аверсарианские')|E] исследователи возожгли здесь свой факел."
