 b_rodcasters_niche:0 "Ниша Жезлоносца"
 b_rodcasters_niche_adj:0 "Ниша-жезлоносцск"
 b_rodcasters_niche_desc:0 "Находка сотен магических жезлов и палочек в древней палете дала ей это имя, хотя некоторые ученые [mayikrata|E] утверждают, что это лишь миф, а имя появилось лишь после создания здесь арканных мастерских. Некоторые аколиты заявляют, что имя на самом деле связано с популярным [Concept('aversaria','аверсарианским')|E] каламбуром, хотя класс магистров относится к этому крайне неодобрительно."
 b_aeonic_passage:0 "Эонический Проход"
 b_aeonic_passage_adj:0 "Эоническ"
 b_aeonic_passage_article:0 ""
 b_aeonic_passage_desc:0 "Старые байки аколитов гласят, что Эонический Проход тянется бесконечно, утверждается, будто жестокие магистры когда-то заставляли аколитов идти по нему, чтобы измерить его длину, и все они шли до конца своих дней."
 c_wyrmroad_passage:0 "Проход Змеиного Тракта"
 c_wyrmroad_passage_adj:0 "Проход-Змеиного-трактск"
 c_wyrmroad_passage_article:0 ""
 b_wyrmrest:0 "Покой Змея"
 b_wyrmrest_adj:0 "Покой-змейск"
 b_wyrmrest_desc:0 "То, что начиналось как путевой пост для защиты караванов, идущих по Змеиному Тракту из Имперского Атриума к Скрипториям, выросло — после Подземной войны 899 года И.С. — во внушительную крепость. Введение Магистерской Десятины превратило Покой Змея в важный торговый пункт, вскоре ставший одним из крупнейших купеческих городов [mayikrata|E]."
 b_great_traverse:0 "Великий Переход"
 b_great_traverse_adj:0 "Великопереходск"
 b_great_traverse_article:0 ""
 b_thixicars_footprints:0 "Следы Тиксикара"
 b_thixicars_footprints_adj:0 "Следы-тиксикарск"
 b_thixicars_footprints_desc:0 "Назван в честь [magi|E] Тиксикара, который, как говорят, развеял загадочный светящийся барьер, блокировавший [Concept('aversaria','имперскую')|E] экспансию вглубь [mayikrata|E] более десятилетия — хотя сам он исчез сразу после того, как переступил его порог, прямо перед его рассеиванием."
 d_scriptoriums:0 "Скриптории"
 d_scriptoriums_adj:0 "Скрипториийск"
 d_scriptoriums_article:0 ""
 d_scriptoriums_desc:0 "Десятилетия адских усилий исследователей [mayikrata|E] по закреплению в этих некогда невероятно проклятых и [Concept('magic','магически')|E] оскверненных покоях были вознаграждены открытием непостижимо древних свитков и фолиантов. Хотя подавляющее большинство из них так и не удалось перевести, те, что были расшифрованы, открыли невероятные ритуалы для [Concept('aversaria','аверсарианцев')|E]."
