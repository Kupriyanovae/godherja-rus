 b_sazzagum_desc:0 "Святая святых подземного мира зиввиратов. Именно сюда, в пламени великих пожаров, испепеливших мир в незапамятные времена, были перенесены потерянные Первые. Здесь наисвятейшие жрецы бдят над Великой Книгой Первых и каждодневно возносят в жертву рыбу и чешую изваяниям благих богов — Зиккуру, Кам-Казолла и Занзабу."
