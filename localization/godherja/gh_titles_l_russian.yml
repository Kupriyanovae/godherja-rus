 b_tube_adj:0 "Трубск"
 b_tube_article:0 ""
 b_tube_desc:0 "Никому не ведомо, для какой цели мог служить громадный металлический цилиндр, выступающий из древней каменной кладки внутри Затопленной Батареи. Ржавея на протяжении эонов и будучи окружён ещё более странными металлическими «семенами», племена зиввирати постановили, что боги не благоволят изучению сей машины человеком, когда одно из «семян» разразилось жестоким взрывом, истребив древнее племя Сиввисолли, дерзнувшее его вскрыть."
