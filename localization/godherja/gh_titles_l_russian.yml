 b_cave_of_the_obsidian_warrior_desc: "Первая из двух [Concept('aversaria','аверсарианских')|E] исследовательниц, когда-либо достигавших сей части [Concept('mayikrata','Майикратии')|E], [Concept('magi','маг')|E] Ирвакса, поведала, что возвышающийся [Concept('aelfir','чужеродный')|E] воин, застывший в чёрном камне, стоял в той пещере и нашептывал ей, чтобы она покрыла его ониксовый облик кровью любимого раба Ирваксы — повеление, которое она ощутила как глубокое и тревожное побуждение исполнить. Вторая экспедиция к пещере, возглавленная её ученицей Матаксой, обнаружила, что изваяние исчезло, а на его месте осталась лишь лужа запёкшейся крови."
