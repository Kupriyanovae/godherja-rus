 b_thunderbask:0 "Тундербаск"
 b_tiresax:0 "Тиресакс"
 b_tiresax_desc:0 "Место названо в честь древнего пророка Тиресакса, который выколол себе один глаз и превратился в женщину. Разочаровавшись в этом опыте, пророк выколол второй глаз и перестал быть и мужчиной, и женщиной."
