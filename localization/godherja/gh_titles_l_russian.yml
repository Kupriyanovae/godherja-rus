 d_imperial_subterrane_desc:0 "Единственный подлинно обитаемый участок пещер [Concept('mayikrata','Майикратии')|E], Имперская Подземка, стала крайне важной торговой артерией для [Concept('aversaria','имперцев')|E], связывавшую город Пещерная Вода и его рыболовные промыслы с подземными городами самой Академии."
