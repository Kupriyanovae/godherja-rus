 c_tanar_desc: "A port city of black-stone streets, Tanar has long held a queer and dark reputation in [sarradon|E]. Before the coming of Ritualism, its denizens worshipped a serpentine, anthropomorphic deity of malice and destruction — its crumbling statues and worn-down motifs still litter the city even over a thousand years later. The place has scarcely improved its reputation since these ancient times, however; it is still known to this day as a hotbed of strange cults, practitioners of forbidden magic and hauntings."
