 c_methoe_desc:0 "Название этого [Concept('county','графства')|E] происходит от старого аверсарианского слова, обозначающего вино, — «Митокс»; регион славился не только качеством своих вин, но и являлся центром многочисленных эпикурейских культов на протяжении всей истории."
