 d_undercourse: "Undercourse"
 c_watergem: "Watergem"
 c_watergem_desc: "Here it was said that the Zivvirathi fishrider, Zirzzumuk, found the great Watergem that is now held in the holiest temple in Sazzagum. Many attempts to find similar gems of great [magic|E] power have been unsuccessful, though the Zivvirathi have found so many mundane pearls in the attempt as to make them effectively worthless to the fishfolk — to the delight of those [mayikrata|E] merchants who have traded with them."
 b_watergem_cove: "Watergem Cove"
 c_flooded_battery: "Flooded Battery"
 c_flooded_battery_article: "the "
 b_tube: "Tube"
 b_tube_article: "the "
 b_tube_desc: "Nobody knows what the great metal cylinder that protrudes from the ancient stone works within the Flooded Battery may have once been used for. Rusting for aeons and surrounded by even stranger metal 'seeds', the Zivvirathi tribes decided the gods did not wish for man to study the machine when one of the 'seeds' violently exploded, destroying the ancient Sivvisolli tribe that had tried to open it."
 c_sourcewater: "Sourcewater"
 b_sisluice: "Sisluice"
 k_shadewater: "Shadewater"
 d_cavecoast: "Cavecoast"
 c_deepwater: "Deepwater"
 c_deepwater_desc: "The largest [mayikrata|E] settlement outside of the chambers of the Academy proper, the slaying of the cavekraken by the [magi|E] Varox gave the academy access to the Shadewater lake. Its fisheries have historically been an integral source of the Mayikrata's food, and pecularities resulting from a 9th century legal dispute and the controversial intervention of Aautokratir Mythix has left the town with its own free charter and government technically free of the Magisterial Council.\n\nMost notably for many acolytes, this oddity has given rise to Deepwater's second largest industry: a dizzying series of fish-scented brothels that remain officially condemned by the Magisterial Council and incredibly popular amongst the academy's scholars."
