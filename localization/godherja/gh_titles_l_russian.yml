 d_dezzil_nest: "Dezzil Nest"
 d_dezzil_nest_article: "the "
 d_dezzil_nest_desc: "Early waves of [Concept('aversaria','Aversarian')|E] explorers from the [mayikrata|E] foolishly ignored the warnings of the underground's natives of the vicious creature known as the 'dezzil' — a strange mix of a mole and beetle, several times larger than a horse and capable of devouring a man or a boulder in moments. Only one survivor managed to escape an encounter with the dezzils after a dozen missing expeditions, and no further expeditions have ever been dared."
