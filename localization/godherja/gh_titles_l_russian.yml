 c_epigrapheia: "Эпиграфия"
 c_epigrapheia_desc: "Эпиграфия на протяжении своей тысячелетней истории часто считалась величайшим из городов Талитейского Гексаполиса. Самой известной достопримечательностью города (давшей ему название) является древняя система стен, на почти каждой свободной поверхности которых сохранились надписи за тысячи лет существования цивилизации. Религиозные посвящения, царские биографии, мифологические истории и нерасшифрованные тексты на языках, давным-давно утерянных во времени, — лишь некоторые примеры текстов, украшающих первозданную каменную кладку Эпиграфии."
