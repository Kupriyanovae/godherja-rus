 b_metricon: "Метрикон"
 b_metricon_desc: "Метрикон некогда был грозной твердыней, возведённой великой культурой крустатти приблизительно в VIII веке И.С. Порторас, брат аавтократа Маклеи, укрывался там среди малькойской военно-чиновничьей знати в пору её Великих чисток, что обернулось двухмесячной Осадой Призраков. Маклея терзала гарнизон леденящими видениями, доколе брата не предали, после чего она, по преданию, «раздавила его, словно арбуз», пока он взывал о пощаде. Командир гарнизона молил о пощаде для себя и своих солдат, но, обмолвившись и назвав её «ужасной» вместо «ужасающей», обрёк своих людей: половину гарнизона перебили, а вторую половину замуровали в катакомбах цитадели, где те и были погребены, когда Маклея сравняла крепость с землёй посредством своей [Concept('magic', 'магии')|E]."
