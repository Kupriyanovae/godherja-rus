 c_novixary: "Novixary"
 c_novixary_article: "the "
 c_novixary_desc: "The Novixary was the only set of chambers within the Scriptoriums accessible to [Concept('aversaria','Aversarian')|E] explorers for decades and became home to its first settlements. Its archives and defenses turned to ash in a struggle long before time, the towns in its chambers would become the home for the [Concept('mayikrata','Mayikrata')|E]'s newest acolytes, both to be assigned to the seemingly endless work of clearing debris from the chambers and to acclimate them to the underground."
 b_burntscroll: "Burntscroll"
 b_ivaxs_curse: "Ivax's Curse"
 b_ivaxs_curse_desc: "After months of exploring this series of chambers, the [Concept('magic','magically')|E] preserved blood-scrawled curse against an ancient [magi|E] named Ivaxirithicaetharan — a [Concept('aelfir','First Man')|E] according to several local [mayikrata|E] cults — was discovered. Only six of almost a hundred runes were ever succesfully translated, but each held great power to the arcanosophers of the Mayikrata. The translation of the sixth word would somehow trigger a great blast which would collapse the room in which the curse was held, and dozens of attempts to rediscover it have since failed."
 d_cantoments: "Cantoments"
 d_cantoments_article: "the "
 c_deathgate: "Deathgate"
 c_deathgate_article: "the "
 c_deathgate_desc: "Only the efforts of three entire legions sent by Aautokratir Mythix — for a hefty price — along with the largest army ever assembled underground by the [mayikrata|E] were able to secure the entrance to the Cantoments from the bipedal insectoids that infest its chambers. The cost of the brutal campaign largely ended all further attempts by the Magisterial Council to expand the Academy deeper underground, and is considered to mark the apex of [Concept('aversaria','Imperial')|E] power in the underworld."
