 b_blackpost: "Черный Пост"
 b_cave_of_the_salamanders: "Пещера Саламандр"
 b_cave_of_the_salamanders_desc: "Ни единому учёному так и не довелось постичь, почему исследователи обнаружили сей регион пещер заполненным тысячами саламандр, подобных протеям и величиной с собаку, но те, что вылупились из захваченных яиц, оказались надёжными спутниками и вскоре стали излюбленными питомцами в [Concept('mayikrata','Майикратии')|E], а затем и в Айроное."
 d_emerald_warrens: "Изумрудные Норы"
 d_emerald_warrens_article: ""
 d_emerald_warrens_desc: "Сверкая, казалось бы, бесконечными изумрудными жилами, [Concept('aversaria','аверсарианцы')|E] из [Concept('mayikrata','Майикратии')|E] пламенели великим интересом к их разработке, которую вели с помощью массового рабского труда под надзором кабальных аколитов. Однако многочисленные странные происшествия и смерти, связанные с «Поднефритом», привели к тому, что изумрудные жилы были объявлены проклятыми и запрещены ааутократом Тейссией. Тайная выработка материала прекратилась из-за общего упадка порядка и процветания Майикратии, и с тех пор самоцвет стал чрезвычайно цениться любопытными — и неразумными — [Concept('magi','магами')|E]."
 c_forsaken_emperors: "Брошенные Императоры"
 b_tiny_vault: "Крошечный Склеп"
 b_tiny_vault_article: ""
 b_tiny_vault_desc: "Потребовалось семь лет, чтобы отыскать ключ к открытию одноимённого малого каменного склепа, обнаруженного на дне глубокой расселины в сей части пещер. Хотя никто так и не постиг, почему внутри хранился лишь один ничем не примечательный (и отнюдь не проклятый) изумруд, предания о склепе и его обретении тем не менее остаются в ходу и обрастают невероятными преувеличениями. И сколь бы неизвестным ни было его истинное происхождение, маршерская сказка о сэре Раносе и Зелёной Каменной Шкатулке, вероятно, берёт начало в Крошечном Склепе."
