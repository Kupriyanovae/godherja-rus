 b_protopol: "Протопол"
 cn_snezna: "Снежна"
 b_pareos: "Пареос"
 cn_neugedein: "Нойгедейн"
 c_methoe: "Метое"
 c_methoe_desc: "Название этого [Concept('county','графства')|E] происходит от старого аверсарианского слова, обозначающего вино, — «Митокс»; регион славился не только качеством своих вин, но и являлся центром многочисленных эпикурейских культов на протяжении всей истории."
 cn_voltyrov: "Волтыров"
 b_amphorica: "Амфорика"
 b_amphorica_desc: "Прото-аверсарианское божество наслаждений, М'фирис, имело свой главный центр поклонения в этом древнем городе. Он также широко считается родиной и, вероятно, источником названия сосуда амфоры, хотя это утверждение горячо оспаривалось полисом Имфакро в Саррадоне."
 cn_gabhorn: "Габхорн"
 b_koxis: "Коксис"
 b_koxis_desc: "Островок среди моря виноградников, название этого поселения происходит от архаичного слова, означающего «красный»."
