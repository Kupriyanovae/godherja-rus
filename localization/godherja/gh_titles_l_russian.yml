 c_new_yrim_desc: "Когда Касмуд Просвещенный взошел на престол [Concept('sarradon','Саррадона')|E] после ожесточенной гражданской войны, одним из его первых приоритетов был перенос царского двора из Сихнамийи. Этот шаг он рассматривал как полный разрыв с прошлым, погрязшим в языческой тирании и дряхлости. В качестве новой столицы он выбрал место на северо-востоке Харадамата, назвав его в честь мифического ритуалистского города Ирим. Почти на протяжении всей оставшейся истории государства цари Саррадона правили из этого блистательного мегаполиса; и даже после того, как государство ушло в историю, Новый Ирим оставался одним из самых влиятельных игроков в политике Харадамата."
