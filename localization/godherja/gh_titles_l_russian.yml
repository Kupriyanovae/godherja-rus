 c_tanar_desc:0 "Портовый город с улицами из чёрного камня, Танар издавна пользуется дурной и мрачной репутацией в [Concept('sarradon','Саррадоне')|E]. До прихода ритуализма его жители поклонялись змееподобному антропоморфному божеству злобы и разрушения — его разрушающиеся статуи и стертые мотивы до сих пор усеивают город даже спустя более тысячи лет. Однако с тех древних времен место едва ли улучшило свою репутацию; оно до сих пор известно как рассадник странных культов, практикующих запретную магию, и призраков."
