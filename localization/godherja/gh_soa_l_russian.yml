 story_soa_wih_conversions: "Странствующий Клинок"
 story_soa_wih_conversions_desc: "Меч Ангелов шествует по [Concept('sarradon','Саррадону')|E], обращая заблудших к делу Ритуализма и подстрекая народ против их правителей."
 SOA_CONVERSIONS_LABEL: "Графств обращено: [Story.GetOwner.Var('soa_wih_conversions').GetValue|0]"

 ##############################
 # EVENTS — CONVERSION (0001)
 ##############################

 ##############################
 # DECISIONS
 ##############################

 soa_evangelize_the_faith: "Провозглашать Истину"
 soa_evangelize_the_faith_desc: "Бремя древнего предназначения давит на меня со всех сторон. Здесь городок, там деревушка — их жители всё ещё держатся старых укладов, которых хватало для прежнего мира, но теперь их недостаточно. Их можно подтолкнуть. Одно поселение, один разговор, один человек за раз."
 soa_evangelize_the_faith_tooltip:0 "Обратить близлежащее [Concept('county','графство')|E] в ритуалистскую веру, вероятнее всего в Тариак аз-Зат."
 soa_evangelize_the_faith_confirm:0 "Начать провозглашение"

 soa_agitate_the_populace:0 "Разжечь недовольство"
 soa_agitate_the_populace_desc:0 "Слух или вовремя сказанное слово — и жители этого графства выразят сомнения, о которых не говорят вслух. Мы сможем придать этим сомнениям более острое лезвие."
 soa_agitate_the_populace_tooltip:0 "Наложить модификатор взбудораженного населения на соседнее необращённое [Concept('county','графство')|E]."
 soa_agitate_the_populace_confirm:0 "Разжечь недовольство"

 gh_or_a_neigbouring_county_tt:0 "Или подходит соседнее графство."

 ##############################
 # EVENTS — CONVERSION (0001)
 ##############################

 gh_soa.0001.t:0 "Душа, обращённая к вечному"
 gh_soa.0001.desc:0 "Наш путь через [scope:soa_converted_county.GetName] оставил свой след. Старые устои, державшие эту землю, утрачивают хватку. Шёпот чего-то нового пустил корни среди людей. [Select_CString(scope:soa_new_follower.IsFemale, 'Одна', 'Один' )] из них полностью [Select_CString(soa_new_follower.IsFemale, 'отринула', 'отринул' )] веру своих правителей.\n\n[soa_new_follower.GetFirstName] предстаёт перед нами, преклонив колени в пустынной пыли, со спокойной уверенностью [Select_CString(soa_new_follower.IsFemale, 'новообращённой, узревшей', 'новообращённого, узревшего' )] то, чего нельзя развидеть. [Select_CString(soa_new_follower.IsFemale, 'Она', 'Он' )] просит следовать за мной.\n\nВера у [Select_CString(soa_new_follower.IsFemale, 'неё', 'него' )] есть. Выживет ли [Select_CString(soa_new_follower.IsFemale, 'она', 'он' )] — иной вопрос."
 gh_soa.0001.a:0 "Иди со мной, если так."
 gh_soa.0001.b:0 "Позаботься о своём народе здесь. Работы хватит."
