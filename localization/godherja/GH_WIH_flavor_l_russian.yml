l_russian:

 # --- gh_wih_flavor.8005 — Under the Painted Stone ---
 gh_wih_flavor.8005.t: "Под расписным камнем"
 gh_wih_flavor.8005.desc_opening: "Сезон войн оставил города [Concept('sarradon','Саррадона')|E] тише обычного. Нынче вечером костровые развели огонь в общественных очагах пораньше, а где-то дальше по улице музыкант играет на струнах."
 gh_wih_flavor.8005.desc_thalite: "Эта песня стара — похоже, даже старше [Concept('war_in_heaven','Войны на небесах')|E]. Чисто [ROOT.Char.GetCulture.GetName] напев, сказ о любви, искаженной пустынным зноем, спетый на талитском наречии."
 gh_wih_flavor.8005.desc_aversarian: "В этой музыке слышен строгий лад старых имперских преданий: сдержанный, размеренный и несомненно прекрасный. [Concept('aversaria','Аверсарианская')|E] песня, звучит далеко от тех мест, где была сложена."
 gh_wih_flavor.8005.desc_neutral: "Эта традиция мне незнакома, но само чувство кажется близким."
 gh_wih_flavor.8005.desc_middle_part: "Я невольно замираю. Нынешняя ночь создана вовсе не для советов или донесений."
 gh_wih_flavor.8005.desc_sarradon_poetry_tradition: "В [Concept('sarradon','Саррадоне')|E] пииты молвят, будто правитель, чуждый музыке, уже проиграл половину войны. Мне доводилось слышать сие и от [Concept('wardenism','варденитов')|E], и от [Concept('ritualism','ритуалистов')|E]."
 gh_wih_flavor.8005.a: "Вот ради чего существует любовь."
 gh_wih_flavor.8005.b: "Позволить чувству захлестнуть себя."
 gh_wih_flavor.8005.c: "Одарить щедрой монетой больше подобных музыкантов."
 gh_wih_flavor.8005.d: "Снести этот памятник, у нас нет времени на подобную блажь."

 # --- gh_wih_flavor.8006 — Aversarian Settlers ---
 gh_wih_flavor.8006.t: "Опахасийцы у ворот"
 gh_wih_flavor.8006.desc: "Группа мужчин и женщин народа [scope:islander_leader.GetCulture.GetName], возглавляемая [scope:islander_leader.GetFirstName], предстала у моих ворот. Они изнурены и измотаны долгим путем и просят дать им землю и кров. По словам их вождя, много лет назад их угнали из [Glossary('Западной Опахасии','western_opakhasia_encyclopedia_desc')] и принудили к невольничьей службе у [scope:former_master.GetFirstNameNoTooltip] — и лишь теперь им удалось вырваться на свободу."
 gh_wih_flavor.8006.flavor.b.tt: "[Select_CString(ROOT.Char.IsFemale, 'Принять', 'Принять' )] [scope:islander_leader.GetFirstName] в свой дом, но не наделять землей остальных — им придется искать свой путь самостоятельно."
 gh_wih_flavor.8006.flavor.c.tt: "Нельзя ссориться с [scope:former_master.GetFirstNameNoTooltip] из-за этого. Островитяне должны уйти."
 gh_wih_flavor.8006.a: "Даровать им земли и титул."
 gh_wih_flavor.8006.b: "Принять лишь их вождя, но отвергнуть остальных."
 gh_wih_flavor.8006.c: "Прогнать их прочь."

 # --- gh_wih_flavor.1002 — The Sarradonian Scholar ---
 gh_wih_flavor.1002.t: "Ученый муж у ваших ворот"
 gh_wih_flavor.1002.desc_has_physician: "До меня дошли вести об искусном лекаре, проживающем при дворе [scope:neighboring_ruler.GetFirstNameNoTooltip]. Мой собственный придворный лекарь, [scope:scoped_physician.GetFirstName], лишь вскидывает бровь, когда я завожу разговор об этом — видать, в нем говорит профессиональное любопытство, а может, и легкая зависть."
 gh_wih_flavor.1002.desc_no_physician: "До меня дошли вести об искусном лекаре, проживающем при дворе [scope:neighboring_ruler.GetFirstNameNoTooltip]. Мой собственный двор лишен врачевателя — сие могло бы исправить положение."
 gh_wih_flavor.1002.b.failure: "Моя попытка переубедить [scope:neighboring_ruler.GetFirstNameNoTooltip] терпит крах. Ученый муж остается на прежнем месте, а [scope:neighboring_ruler.GetFirstName] лишь раздражен."
 gh_wih_flavor.1002.b.success: "Мое красноречие приносит плоды. [scope:great_scholar.GetFirstName] соглашается прибыть к моему двору."
 gh_wih_flavor.1002.c.failure: "Мои тайные замыслы провалились. [scope:neighboring_ruler.GetFirstNameNoTooltip] проведал о попытке и пребывает в ярости."
 gh_wih_flavor.1002.c.success: "Мне удалось добыть достаточно сведений о методах [scope:great_scholar.GetFirstName], дабы применить их самостоятельно."
 gh_wih_flavor.1002.a: "Заплатить щедрое вознаграждение, чтобы переманить его сюда."
 gh_wih_flavor.1002.b: "Убедить [scope:neighboring_ruler.GetFirstName] поделиться его знанием."
 gh_wih_flavor.1002.c: "Похитить знание путем хитрости и хитросплетений."
 gh_wih_flavor.1002.d: "Оставить это дело без внимания."

 # --- gh_wih_flavor.1050 — The Visionary Spouse ---
 gh_wih_flavor.1050.t: "Видения [scope:visionary_spouse.GetFirstName]"
 gh_wih_flavor.1050.desc_wardenite: "Варденит назовет сии видения знамением, рукой Мёртвого бога, вычерчивающей во снах судьбу. Однако эта рука слишком уж часто проявляет себя в последнее время, и [scope:visionary_spouse.GetFirstName] [Select_CString(scope:visionary_spouse.IsFemale, 'явно напугана', 'явно напуган' )]."
 gh_wih_flavor.1050.desc_ritualist: "Ритуалисты ведут речи об оменах как о вестях от сил, что старше самой памяти. [scope:visionary_spouse.GetFirstName] [Select_CString(scope:visionary_spouse.IsFemale, 'проснулась', 'проснулся' )] с чувством тяжелого страха, который не в силах развеять никакие утешения."
 gh_wih_flavor.1050.desc_agionist: "Агионисты твердят, что Чистейший может вещать через страдания. Если так, то сны, что видит [scope:visionary_spouse.GetFirstName], более чем красноречивы."
 gh_wih_flavor.1050.desc_lifepath: "Пути жизни учат смиренно принимать все, что суждено. Но [scope:visionary_spouse.GetFirstName] с большим трудом принимает это откровение."
 gh_wih_flavor.1050.desc_other_faith: "[scope:visionary_spouse.GetFirstName] просыпается в дрожи уже третью ночь подряд. Что-то из этого сна никак не хочет отпускать душевный покой."
 gh_wih_flavor.1050.b.success: "Мои утешения доходят до сердца [scope:visionary_spouse.GetFirstName]. Тревога на лице спадает — хотя бы отчасти."
 gh_wih_flavor.1050.b.failure: "Мои слова помогли слабее, чем хотелось бы. [scope:visionary_spouse.GetFirstName] все еще пребывает в смятении."
 gh_wih_flavor.1050.a: "Обвинить [Select_CString(scope:visionary_spouse.IsFemale, 'ее', 'его' )] в сговоре с темными силами."
 gh_wih_flavor.1050.b: "Вознести совместную молитву и даровать утешение."
 gh_wih_flavor.1050.c: "Воспринять знамение всерьез и подготовиться."

 # --- gh_wih_flavor.2000 — The Inspector ---
 gh_wih_flavor.2000.t: "Поступки инспектора"
 gh_wih_flavor.2000.desc_wardenite: "Судья, направленный для надзора за рынками владения [scope:gh_2000_county.GetName], преступил границы своего мандата. Донесения о вымогательстве, избирательном суде и личном обогащении дошли до моего управляющего, [scope:gh_2000_scoped_steward.GetFirstNameNoTooltip] — который и доставил их мне."
 gh_wih_flavor.2000.desc_agionist: "Сборщик податей, действующий во владении [scope:gh_2000_county.GetName], усердно присваивает себе больше дозволенной доли. У моего управляющего, [scope:gh_2000_scoped_steward.GetFirstNameNoTooltip], набралось жалоб на целый фолиант."
 gh_wih_flavor.2000.desc_generic: "Служитель веры, отправляющий обязанности во владении [scope:gh_2000_county.GetName], судя по всему, относится к своей власти как к источнику личной наживы. У моего управляющего имеются неопровержимые улики."

 # --- gh_wih_flavor.2008 — Misdeeds of the Councillor ---
 gh_wih_flavor.2008.t: "Злодеяния [scope:gh_2008_misdeed_actor.GetFirstName]"
 gh_wih_flavor.2008.desc: "В мои руки попали крайне любопытные записи. Мой [scope:gh_2008_misdeed_actor.GetCouncilTitle], [scope:gh_2008_misdeed_actor.GetFirstNameNoTooltip], [Select_CString(scope:gh_2008_misdeed_actor.IsFemale, 'промышляла', 'промышлял' )] систематическим подлогом: [Select_CString(scope:gh_2008_misdeed_actor.IsFemale, 'перенаправляла', 'перенаправлял' )] казну, [Select_CString(scope:gh_2008_misdeed_actor.IsFemale, 'фальсифицировала', 'фальсифицировал' )] счета и [Select_CString(scope:gh_2008_misdeed_actor.IsFemale, 'присваивала', 'присваивал' )] излишки себе. Улики неоспоримы, но остался вопрос — как поступать с полученными сведениями."
 gh_wih_flavor.2008.b.notif: "Советник преподает вам урок"

 # --- gh_wih_flavor.3000 — Corn from Kashirya ---
 gh_wih_flavor.3000.t: "Урожай из Каширии"
 gh_wih_flavor.3000.desc: "[scope:corn_propagator.GetFirstNameNoTooltip], правитель владения [scope:corn_propagator.GetPrimaryTitle.GetBaseName], [Select_CString(scope:corn_propagator.IsFemale, 'установила', 'установил' )] торговые связи с [Concept('kashirya','Каширией')|E] и завозит удивительный новый злак — выносливый, изобильный и превосходно подходящий для саррадонского климата. Вместе с последним караваном прибыл видваукеятранский ученый муж из Каширии. О даруемых урожаях ходят невообразимые слухи, однако хитрости выращивания в моих землях еще не ведомы."
 gh_wih_flavor.3000.b.failure: "[scope:corn_propagator.GetFirstNameNoTooltip] воспринимает предложение как оскорбление и отвечает отказом."
 gh_wih_flavor.3000.b.success: "Благодаря дипломатической тонкости мне удается убедить [scope:corn_propagator.GetFirstNameNoTooltip] поделиться приемами земледелия."
 gh_wih_flavor.3000.c.failure: "Моя попытка выведать знания раскрыта. [scope:corn_propagator.GetFirstNameNoTooltip] в полном гневе."
 gh_wih_flavor.3000.c.success: "Мои агенты успешно выведали способы возделывания. Новый злак взойдет на полях моей столицы."
 gh_wih_flavor.3000.a: "Щедро заплатить за секреты возделывания."
 gh_wih_flavor.3000.b: "Убедить поделиться опытом."
 gh_wih_flavor.3000.c: "Подослать лазутчиков, дабы украсть тайнство приемов."
 gh_wih_flavor.3000.d: "Оставить эту затею."

 # --- gh_wih_flavor.4003 — Road to Sophocene ---
 gh_wih_flavor.4003.t: "Дороги к Софокосу"
 gh_wih_flavor.4003.desc: "Пути паломников, ведущие к [GetBuilding('01_sophocos').GetName], пролегают через мои земли, и [scope:steward.GetFirstNameNoTooltip] [Select_CString(scope:steward.IsFemale, 'принесла', 'принес' )] мне тревожное известие: на тракте бесчинствуют разбойники. Торговцев и богомольцев грабят без разбора."
 gh_wih_flavor.4003.tt: "Орден будет охранять тракт на протяжении десяти лет."
 gh_wih_flavor.4003.a: "Призвать на помощь местный агионистский командорство."
 gh_wih_flavor.4003.b: "Оплатить защиту из собственной казны."
 gh_wih_flavor.4003.c: "Паломники должны сами заботиться о своей судьбе."

 # --- gh_wih_flavor.4008 — Folk Stories ---
 gh_wih_flavor.4008.t: "Сказания у очага"
 gh_wih_flavor.4008.desc.intro: "Тихим вечером старая женщина усаживается у общего костра и заводит сказ. Она ведает о делах давно минувших дней: о погибших воинах, забытых судьях и пламенных пророках. Люди сходится послушать."
 gh_wih_flavor.4008.desc.erimatos.a: "Она ведает предание об основаниях: как первые корабли эриматов пристали к берегу, который уже принадлежал другим, и о сделке, заключенной во мраке, дабы воздвигнуть город там, где прежде царило лишь недоверие. Что было отдано. Что было принято. И как два народа переняли речи друг друга, сами того не заметив."
 gh_wih_flavor.4008.desc.erimatos.b: "Она рассказывает о купце, переплывшем море трижды за жизнь и всякий раз возвращавшемся домой с иным наречием и молящимся иному богу. Он не мог объяснить родне, отчего плачет над вещами, кои те находили вполне обыденными. Слушатели спорят, считать ли сие притчей-предостережением."
 gh_wih_flavor.4008.desc.makryenis.a: "Она рассказывает старую макриенскую притчу о Лестнице Аавтократора: о бедном юноше, что благодаря лишь собственной хитрости возвысился над врагами. Слушатели уже знают развязку, но все равно внимают, желая узнать, дерзнет ли старуха спросить, что же изменилось, когда он взошел на самую вершину."
 gh_wih_flavor.4008.desc.makryenis.b: "Она рассказывает историю, ведомую каждому местному: о первом агионисте, что превысил свою власть и обложил данью даже молитвы нищих. Сказ завершается тем, что мертвых стало больше, чем живых, и тем, что мертвые забрали взамен. Толпа смеется, но смех этот выходит неполным и неловким."
 gh_wih_flavor.4008.desc.thalite.a: "Она ведает тасурматский сказ из сказаний о Сотне Градов. Сказ о городе, павшем первым, и о договоре, что заключили его владыки ради спасения. Договор сработал. Город уцелел. Но никто из тех, кто узрел полные условия уговори, уже не остался прежним."
 gh_wih_flavor.4008.desc.thalite.b: "Она рассказывает саруядскую историю об Аккабле, ведьме кедровых лесов, которой сама Смерть объявила, что ее час пришел. Вся притча сложена из того, что она ответила Смерти. К концу сказа у огня воцаряется полная тишина."
 gh_wih_flavor.4008.desc.sarradon.a: "Она рассказывает историю, которая могла рородиться в любом уголке [Concept('sarradon','Саррадона')|E] — о герое, испытании и судьбоносном выборе."
 gh_wih_flavor.4008.desc.sarradon.b: "Она рассказывает одно из древних преданий о сотворении мира, из тех, что объясняют, почему все устроено именно так, а не иначе."
 gh_wih_flavor.4008.desc.ending: "У меня свободен вечер. И как поступить с этой историей — решать лишь мне."

 # --- gh_wih_flavor.9000 — Holy Warrior Gone Bad ---
 gh_wih_flavor.9000.t: "Воин, зашедший слишком далеко"
 gh_wih_flavor.9000.desc_agionist_opening: "Воин-агионист решил возомнить, будто его мандат гораздо шире, чем было предназначено, и оставил за собой лишь след из хаоса."
 gh_wih_flavor.9000.desc_other_opening: "Самопровозглашенный святой воин учинил собственный военный поход в моих землях."
 gh_wih_flavor.9000.desc: "Город [scope:murder_barony.GetName] пребывает в ужасе. Мой маршал, [scope:righteous_marshal.GetFirstNameNoTooltip], заковал этого человека в цепи и ожидает моего суда."
 gh_wih_flavor.9000.a: "Освободить его — он сражался во имя мое."
 # fp3 vanilla options b and c reused

 # --- gh_wih_flavor.9009 — Wardenite Head of Faith ---
 gh_wih_flavor.9009.b: "Отправить им тексты на священном языке."
 gh_wih_flavor.9009.qurans.flavor: "Вера посланника звучит через [language_thalite|E]. Возможно, именно отсюда и следует начать обращение."

 # --- gh_wih_flavor.9014 — The Chort Teapot ---
 gh_wih_flavor.9014.t: "Дело о чорте"
 gh_wih_flavor.9014.desc: "[scope:opportunistic_courtier.GetFirstNameNoTooltip] [Select_CString(scope:opportunistic_courtier.IsFemale, 'заметила', 'заметил' )], что я употребляю смолистое зелье [Concept('chort','чорт')|E]. У [Select_CString(scope:opportunistic_courtier.IsFemale, 'нее', 'него' )] есть предложение: [Select_CString(scope:opportunistic_courtier.IsFemale, 'она умеет', 'он умеет' )] хранить тайны. Разумеется, за небольшую плату."

 # --- gh_wih_flavor.9016 — Ancient Ruins ---
 gh_wih_flavor.9016.t: "Древние камни Харадамата"
 gh_wih_flavor.9016.desc: "[scope:kharadamat_vassal.GetFirstNameNoTooltip] явился ко мне с жалобой: в глубинах провинции Харадамат, в [scope:ruins_county.GetName], была найдена древняя каменная кладка. Надписи не похожи ни на что из ныне помнимого. [scope:kharadamat_vassal.GetFirstName] требует уничтожить их. Однако во мне проснулось любопытство."

 # --- gh_wih_flavor.9018 — Amsari Horse Trader ---
 gh_wih_flavor.9018.t: "Покупатель из амсаров"
 gh_wih_flavor.9018.desc_merchant: "Купец из амсаров — обветренный, спокойный и явно привыкший вести дела с теми, кто предпочел бы с ним вовсе не встречаться, — прибыл к моему двору. Он наслышан о красоте моего коня и желает его купить.\n\nА я, к слову, сей момент пребываю в немалых долгах."
 gh_wih_flavor.9018.desc_woman: "Знатная дама из народа амсаров — уверенная, неторопливая и обладающая той тихой властностью, от которой телохранителям становится не по себе, — прибыла к моему двору. Она наслышана о моем коне и желает его купить.\n\nА я, к слову, сей момент пребываю в немалых долгах."

 # --- gh_wih_flavor.5000 — The Undying Sword of Angels ---
 gh_wih_flavor.5000.t: "Шепоты о Бессмертном мече"
 gh_wih_flavor.5000.desc_opening: "[scope:gh_5000_informant.GetFirstName] приносит мне вести: среди бедноты, скитальцев и простолюдинов пограничных графств шепотом передается имя. «Бессмертный меч ангелов». Никто не знает точно, о ком или о чем речь, но сомневаться в страсти, с которой распространяется эта молва, не приходится."
 gh_wih_flavor.5000.desc_wardenite: "Среди верующих это имя вызывает смешанное чувство надежды и тревоги. В отчаянные времена такие чувства становятся трутом для пламени, которое редко удерживается в пределах одного очага."
 gh_wih_flavor.5000.desc_agionist: "Донесения описывают это как пропаганду [Concept('ritualism','ритуалистов')|E], и, возможно, так оно и есть. Но сие имя находит отклик и в бедных кварталах наших поселений — особенно среди тех, кто еще помнит клинок Ибн Саррадона и не дождался правосудия."
 gh_wih_flavor.5000.desc_other: "Мои советники не могут сойтись во мнении, что это: происки [Concept('ritualism','ритуалистов')|E], [Concept('wardenism','варденитское')|E] народное сказание или же продукт коллективного отчаяния после падения Эль-Кулаты. Само это разногласие внушает опасения."
 gh_wih_flavor.5000.b.success: "Нити приводят к цели. У меня есть имена, сеть и место зарождения. Слух можно пресечь."
 gh_wih_flavor.5000.b.failure: "Мои агенты ничего не нашли, а своими расспросами, возможно, лишь шире разнесли эту молву. Имя теперь звучит еще громче."
 gh_wih_flavor.5000.a: "Подавить — золотом и страхом, именно в таком порядке."
 gh_wih_flavor.5000.b: "Рассследовать — узнать, кто распространяет эти слухи."
 gh_wih_flavor.5000.c: "Отправить проповедников, дабы развеять молву."
 gh_wih_flavor.5000.d: "Издать официальное агионистское осуждение."
 gh_wih_flavor.5000.e: "Оставить все как есть. Бедняки во все времена слагали сказки."

 # --- gh_wih_flavor.5001 — The Wandering Magi Archivist ---
 gh_wih_flavor.5001.t: "Таинственный архивариус"
 gh_wih_flavor.5001.desc: "К моему двору прибыл странник. Старый и внимательный, он держит в руках запечатанную суму с документами, кои, как он утверждает, были сложены еще до [Concept('the_decimation_of_sarradon','Халакдуна')|E]. Однако он отказывается говорить, откуда они и к какому ордену он принадлежит.\n\nПохоже, в этой суме хранятся карты и записи о здешнем крае до Истребления: права на земли, водные источники, древние союзы и места, где намеренно сокрыли клады. Он просит покровительства и защиты в обмен на эти знания."
 gh_wih_flavor.5001.c.success: "Мои агенты забирают архив до того, как архивариус успевает что-либо предпринять. Теперь он знает, что бумаги у меня — у этой медали две стороны."
 gh_wih_flavor.5001.c.failure: "Архивариус оказался подготовленнее, чем казалось. Сума исчезает вместе с ним."
 gh_wih_flavor.5001.a: "Щедро заплатить за архив — и за его труды."
 gh_wih_flavor.5001.b: "Предложить покровительство. Пусть остается на моих условиях."
 gh_wih_flavor.5001.c: "Приказать слугам забрать записи силой."
 gh_wih_flavor.5001.d: "Прогнать его. Ордена архивариусов несут лишь беды."

 # --- gh_wih_flavor.5002 — Bones of the Worldeater ---
 gh_wih_flavor.5002.t: "Кости в песках"
 gh_wih_flavor.5002.desc_opening: "Дозорные в [scope:gh_5002_bones_county.GetName] доносят об необычных кристаллических образованиях, пробивающихся сквозь песчаную толщу. Ученые мужи, осмотревшие их, единогласны: это останки [Concept('the_worldeater','Пожирателя Миров')|E], однако никто не понимает, как и почему они оказались здесь."
 gh_wih_flavor.5002.desc_wardenite: "Ученые мужи уже спорят. Малая часть утверждает, будто Мёртвый бог давит на стенки своей темницы, и проступившие столь древние кости знаменуют ослабление уз. Большинство же считает, что это не значит ровным счетом ничего."
 gh_wih_flavor.5002.desc_ritualist: "Две ритуалистские секты уже направили сюда свои депутации. Одно учение верит, что [Concept('the_worldeater','Пожиратель Миров')|E] был благословен, другое же считает, что любое прикосновение к этим костям сулит духовную скверну. Они еще не сошлись в драке, но внимательно следят за моим решением."
 gh_wih_flavor.5002.desc_agionist: "Мое командорство желает знать, можно ли добывать здесь камень для строительства. Мое духовенство желает знать, не сочтется ли прикосновение к ним ересью. Оба вопроса по-своему разумны."
 gh_wih_flavor.5002.desc_other: "Никто из спрошенных мною не может решить, благословение это, предостережение или просто каприз природы. Все сходятся лишь в одном: делать вид, будто костей нет, не выйдет."
 gh_wih_flavor.5002.a.magi_tt: "Мои магические чувства улавливают остаточную энергию в костях — их изучение может даровать глубокое понимание, пусть и с некоторой долей риска."
 gh_wih_flavor.5002.a: "Поручить научное исследование."
 gh_wih_flavor.5002.b: "Продать их чужеземным коллекционерам."
 gh_wih_flavor.5002.c: "Оставить это место святилищем."
 gh_wih_flavor.5002.d: "Уничтожить их. Древние реликвии приносят лишь беды."

 # --- gh_wih_flavor.5003 — The Syncretic Preacher ---
 gh_wih_flavor.5003.t: "Проповедник двух столпов"
 gh_wih_flavor.5003.desc: "В [scope:gh_5003_preacher_county.GetName] бродячий проповедник собирает толпы. [scope:gh_5003_preacher.GetFirstName] утверждает, будто [Concept('wardenism','варденитские')|E] Столпы и [Concept('ritualism','ритуалистские')|E] испытания на 1001 Ступени — это лишь две стороны одного духовного пути, а междоусобицы верующих являются доказательством неполноты их знаний. Народ в восторге. Местное варденитское и ритуалистское духовенство в ярости. Донесения на моем столе исполнены тревоги."
 gh_wih_flavor.5003.desc_agionist: "В [scope:gh_5003_preacher_county.GetName] бродячий проповедник собирает толпы. [scope:gh_5003_preacher.GetFirstName] уверяет, будто [Concept('wardenism','варденитские')|E] Столпы и [Concept('ritualism','ритуалистские')|E] испытания на 1001 Ступени суть две половины одной истины, а местные жители рвут друг другу глотки из-за расколотого священного текста. Толпа внимает. В отчетах моего капеллана то и дело звучит слово «примирение». Сие слово несет огромный смысл, и ничто из этого не отвечает интересам [Concept('agionism','агионизма')|E]."
 gh_wih_flavor.5003.b.success: "[scope:gh_5003_chaplain.GetFirstName] прилюдно разбивает доводы проповедника — спокойно и обоснованно. Толпа расходится неудовлетворенной, но уже без пророка во главе."
 gh_wih_flavor.5003.b.failure: "Проповедник отражает нападки, с коими выступил [scope:gh_5003_chaplain.GetFirstName], куда лучше ожидавшегося. Толпа теперь еще больше."
 gh_wih_flavor.5003.a: "Взять под стражу — сие должно прекратиться."
 gh_wih_flavor.5003.b: "Отправить [scope:gh_5003_chaplain.GetFirstName] для публичного диспута."
 gh_wih_flavor.5003.c: "Пригласить к двору. За этой загадкой лучше присматривать лично."
 gh_wih_flavor.5003.d: "Оставить в покое. Народ сам сделает выбор."

 # --- gh_wih_flavor.5004 — The Tributary Ghost ---
 gh_wih_flavor.5004.t: "Старая печать"
 gh_wih_flavor.5004.desc: "Прибыли посланники от малого клана из внутренних земель — одной из тех общин, кои уцелели в [war_in_heaven|E] лишь благодаря незаметности. Они принесли печать о дани по договору, заключенному еще до [saints_war|E] с сюзереном, чьи земли ныне вошли в состав моих. Печать подлинная. Уговор формально действителен. Речь идет о скромном количестве золота, но политический прецедент признания — или отказа от него — куда важнее."
 gh_wih_flavor.5004.b.success: "Переговоры проходят успешно. Новые условия куда выгоднее для меня, и посланники принимают их без видимой обиды."
 gh_wih_flavor.5004.b.failure: "Переговоры заходят в тупик. Посланники уходят с обидой, с которой не приходили."
 gh_wih_flavor.5004.a: "Исполнить древний договор о дани. Пусть уговор остается в силе."
 gh_wih_flavor.5004.b: "Пересмотреть условия."
 gh_wih_flavor.5004.c: "Полностью отвергнуть соглашение."
 gh_wih_flavor.5004.d: "Передать это дело сюзерену."

 # --- gh_travel_event.9003 — El-Qulatha (great city) ---
 gh_travel_event.9003.t: "Эль-Кулата"
 gh_travel_event.9003.desc: "Эль-Кулата возвышается вокруг меня: [GetBuilding('01_greattempleofelqulatha').GetName] виден еще от городских окраин. Это престол [Concept('mamuramat','Мамура')|E], оплот высшей власти [Concept('wardenism','варденизма')|E] и один из величайших городов мира. У меня есть время. Как им распорядиться?"
 gh_travel_event.9003.a: "Вознести молитву в Великом храме."
 gh_travel_event.9003.b: "Углубить познания в Медицинском университете."
 gh_travel_event.9003.c: "Пройтись по городу и оценить его размах."
 gh_travel_event.9003.d: "Просить аудиенции у Высокого суда."

 # --- gh_travel_event.9004 — El-Qulatha (ruins) ---
 gh_travel_event.9004.t: "То, что осталось от Эль-Кулаты"
 gh_travel_event.9004.desc: "Дым давно рассеялся, но запах гари остался. Огонь и сокрушительная магия уничтожили этот город, раскалывая камни и рассекая тела. [GetBuilding('01_greattempleofelqulatha').GetName] превращен в руины, башни университета высят зияющие проломы к небу, а от рынков остался лишь пепел. Здесь билось сердце власти [Concept('wardenism','варденизма')|E]. Ныне сие место похоже не на город, а на грозное предостережение."
 gh_travel_event.9004.b.success: "Среди руин и обломков еще есть живые люди."
 gh_travel_event.9004.b.failure: "Я ищу часами. Никого не осталось."
 gh_travel_event.9004.c.wardenite_tt: "Стоя среди последствий Стерилизации, в окружении руин величайшего города моей веры, я чувствую глубокую скорбь, но вместе с ней — непреклонную решимость."
 gh_travel_event.9004.d.danger_tt: "Магические остатки здесь плотны и нестабильны. Их изучение грозит заражением маноболезнью."
 gh_travel_event.9004.a: "Разграбить руины."
 gh_travel_event.9004.b: "Искать выживших."
 gh_travel_event.9004.c: "Постоять в молчании. Почтить память."
 gh_travel_event.9004.d: "Изучить магические шрамы."

 # --- New modifier names ---
 gh_wih_sword_rumor_suppressed: "Слухи подавлены"
 gh_wih_sword_rumor_suppressed_desc: "Слухи о Бессмертном мече были решительно подавлены, но эти меры оставили неприятный осадок у местного населения."
 gh_wih_sword_rumor_suppressed_county: "Заглушенные слухи"
 gh_wih_sword_rumor_suppressed_county_desc: "Жесткие меры заставили замолчать тех, кто шептался о Бессмертном мече, но не искоренили причин для недовольства."
 gh_wih_sword_rumor_spreading_county: "Мчащаяся молва"
 gh_wih_sword_rumor_spreading_county_desc: "Имя Бессмертного меча подхватывается беднотой, подрывая верность и готовность идти в ополчение."
 gh_wih_sword_rumor_countered_county: "Развеянное сказание"
 gh_wih_sword_rumor_countered_county_desc: "Проповедники приложили немало сил, дабы обесценить сказание о Бессмертном мече. По крайней мере, на время это сработало."

 gh_travel_9003_temple_blessing: "Благословение Эль-Кулаты"
 gh_travel_9003_temple_blessing_desc: "Я [Select_CString(ROOT.Char.IsFemale, 'помолилась', 'помолился' )] в Великом храме Эль-Кулаты и [Select_CString(ROOT.Char.IsFemale, 'ушла', 'ушел' )] оттуда с незримым даром, коему не подобрать слов."
 gh_travel_9003_medicinal_knowledge: "Медицинские познания Эль-Кулаты"
 gh_travel_9003_medicinal_knowledge_desc: "Учения Медицинского университета расширили мои познания в борьбе с недугами и врачевании тел."

 gh_wih_worldeater_studied_county: "Останки Пожирателя Миров — под наблюдением"
 gh_wih_worldeater_studied_county_desc: "Ученые мужи разбили лагерь возле костей Пожирателя Миров. Их изыскания привлекают как торговцев, так и любопытных."
 gh_wih_worldeater_bones_site_county: "Святилище Пожирателя Миров"
 gh_wih_worldeater_bones_site_county_desc: "Кости Пожирателя Миров оставлены как место религиозного почитания. Паломники и исследователи приносят звонкую монету."
 gh_wih_worldeater_destroyed_county: "Кости Пожирателя Миров уничтожены"
 gh_wih_worldeater_destroyed_county_desc: "Кости были уничтожены по приказу. Ученый люд опечален, но местные жители чувствуют себя в безопасности."

 gh_wih_syncretic_preaching_county: "Синкретические проповеди"
 gh_wih_syncretic_preaching_county_desc: "Проповедник, объединяющий варденитское и ритуалистское учения, собирает толпы. Официальные духовники в ярости, а простолюдины в заворожении."

 gh_wih_tributary_honored_county: "Исполненный договор о дани"
 gh_wih_tributary_honored_county_desc: "Старый договор о дани времён до Войны святых был исполнен. Малые кланы внутренних земель оценили этот шаг."
 gh_wih_tributary_repudiated_county: "Отвергнутая дань"
 gh_wih_tributary_repudiated_county_desc: "Древнее соглашение о дани было отвергнуто. Среди общин внутренних земель разнеслись вести, что законность вас волнует куда меньше удобства."

 # --- Modifier names ---
 gh_wih_corn_cultivation_modifier: "Возделывание каширийского злака"
 gh_wih_corn_cultivation_modifier_desc: "Местные земледельцы переняли методы выращивания высокоурожайного злака у каширийских и айронойских торговцев."

 gh_wih_islander_settlers_county_modifier: "Опахаские переселенцы"
 gh_wih_islander_settlers_county_modifier_desc: "Здесь обосновалась община опахаских переселенцев, принесшая с собой мореходные навыки и торговые связи."

 gh_wih_sophocene_ho_protected_modifier: "Тракт к Софокосу — под защитой ордена"
 gh_wih_sophocene_ho_protected_modifier_desc: "Духовный орден патрулирует паломнические пути к Софокосу, обеспечивая безопасность купцов и богомольцев."

 gh_wih_sophocene_protected_modifier: "Тракт к Софокосу — под охраной"
 gh_wih_sophocene_protected_modifier_desc: "Паломнические пути к Софокосу были защищены наемными силами. Торговля и путешествия процветают."

 # --- gh_wih_flavor.9003 — Amsari Herbs ---
 gh_wih_flavor.9003.t: "Травы из амсари"
 gh_wih_flavor.9003.desc: "Моя [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('superstitious_consort'))] [superstitious_consort.GetFirstName] имеет привычку воскурять редкую траву народа амсаров для защиты от дурного глаза. Но теперь [superstitious_consort.GetSheHe] утверждает, что моя [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cruel_consort'))] [cruel_consort.GetFirstName] украла [superstitious_consort.GetHerHis] запасы. [cruel_consort.GetFirstNameNoTooltip], само собой, всё отрицает. Но [superstitious_consort.GetFirstNameNoTooltip] без ума от мысли найти еще этих трав.\n\n«Прошу, [ROOT.Char.Custom('FormOfAddressForLiege')]», — умоляет [superstitious_consort.GetSheHe], — «Бродячий волхв поведал мне, что лучшие травы в мире растут лишь на высоких перевалах владения [espad_mountain_province.GetName], в горах Амсара. Вы должны отправить за ними людей»."
 gh_wih_flavor.9003.a: "Уповай на веру — а не на травы и суеверия."
 gh_wih_flavor.9003.b: "Я отправлю лучших разведчиков, каких можно купить за золото."
 gh_wih_flavor.9003.c: "Я отправлю моего [quest_chaplain.GetCouncilTitle] [quest_chaplain.GetFirstName] добыть их."

 # --- gh_wih_flavor.9004 — The Frontier Beckons ---
 gh_wih_flavor.9004.desc: "Некоторые из тех, кто вырос на сказаниях о [war_in_heaven|E], слышат их эхо даже в мирные времена — некое беспокойство, коего не могут развеять уют и роскошь двора. К добру ли, к худу ли, но мой [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp3_child_to_leave'))] [fp3_child_to_leave.GetFirstName] начинаeт ощущать эту тягу.\n\n«[parent.GetMotherFather|U], отпусти меня. Я хочу испробовать свой клинок и свой разум на порубежье — путешествовать с караванами, изведать пустынные дороги, увидеть места, ведомые лишь воинам да скитальцам».\n\nОднако [worried_relation.GetFirstName] искренне любит [fp3_child_to_leave.GetFirstNameNoTooltip] и слёзно просит меня отвергнуть прошение [fp3_child_to_leave.GetHerHis]."

 # --- gh_wih_flavor.9010 — HoF Demands Holy War ---
 gh_wih_flavor.9010.desc_wardenite: "[righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] делит мир просто: те, кто подчинён авторитету веры [righteous_caliph.GetFaith.GetReligion.GetAdjectiveNoTooltip], и те, кого лишь предстоит к нему привести. Земли за моей восточной границей крайне беспокоят [righteous_caliph.GetHerHim].\n\n«Твой долг как верного [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] — привести порубежье под нашу защиту», — передает [righteous_caliph.GetSheHe] через своего посла. — «Мы и так слишком долго терпели обычаи, что соблюдает [pagan_ruler.GetTitledFirstName]. Я отправлю тебе войска Орденов и конницу, дабы подкрепить поход и привести [pagan_county.GetNameNoTier] под праведную власть»."
 gh_wih_flavor.9010.desc_other: "[righteous_caliph.GetTitleTierName] [righteous_caliph.GetFirstName] видит рубежи предельно ясно: есть верные, а есть непокорные. Языческое присутствие к востоку от моих земель стало невыносимым, судя по [righteous_caliph.GetHerHis] мнению.\n\n«Твой долг как верного [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]», — говорит [righteous_caliph.GetSheHe], — «вернуть порубежье в лоно истинной веры. Слишком долго мы терпели идолопоклонство, коим грешит [pagan_ruler.GetTitledFirstName]. Я отправлю тебе воинов Ордена и конницу в подкрепление, чтобы ты [Select_CString(ROOT.Char.IsFemale, 'заявила', 'заявил' )] права на [pagan_county.GetNameNoTier] по праву праведности»."

