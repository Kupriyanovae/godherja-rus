 hunt.0500.herd: "По слухам, неподалеку бродит [activity.Custom('GetAnimalGroup')] животных, среди которых мы наверняка найдем здорового [activity.Custom('GetAnimalMale')]. Основная наша цель — [activity.Custom('GetAnimalType')]."
 hunt.0500.rodents: "Пусть это и скромный улов, мне сказали, что мелких [activity.Custom('GetAnimalType')] здесь более чем достаточно, чтобы прокормить нас всех сегодня."
 hunt.0500.goats: "Мы уверены, что в округе обитает немало [activity.Custom('GetAnimalType')], хотя добраться до них среди камней и скал наверняка будет непросто."
 hunt.0500.reptiles: "Свирепый [activity.Custom('GetAnimalType')] частенько охотится вдоль водных путей, и он почти наверняка там не один."
 hunt.0500.snakes: "Сама по себе поимка змеи, затаившейся в подлеске или под камнем, не доставит больших хлопот, но этот [activity.Custom('GetAnimalType')] наверняка окажется куда более расчётливым."
 hunt.0500.primates: "[activity.Custom('GetAnimalGroup')|U], которые образуют эти [activity.Custom('GetAnimalType')], обычно избегают людей, но я уверен, что мы сможем застать их врасплох."
 hunt.0500.megafauna: "Эти могучие [activity.Custom('GetAnimalType')] известны как одни из самых сильных и грозных существ в регионе. Найти их не составит труда, а вот одолеть такого [activity.Custom('GetAnimalMale')] — задача совершенно иного рода."

 # Updated, short intros specific to monsters, pulled from original intro_descs
 hunt.0520.adze: "На [Glossary('адзе', 'animal_type_adze_encyclopedia_desc')] может быть невероятно трудно охотиться из-за их изменчивых размеров, способности к полёту и невидимости. При подготовке я должен тщательно следить за окружением, так как не могу доверять собственным глазам. Одна ошибка — и существо нанесёт точный удар, выпив меня досуха и оставив лишь обескровленный труп."
 hunt.0520.akapura: "[Glossary('Акапура', 'animal_type_akapura_encyclopedia_desc')} размером с небольшой остров и покрыта толстым панцирем. По сравнению с убийством столь массивного существа, выслеживание станет лёгкой задачей для нашего отряда. И хотя риск потерять тварь из виду мал, никто не гарантирует, что само убийство пройдёт гладко."
 hunt.0520.almas: "Многие истории рассказывают о том, насколько свирепыми и могучими могут быть эти [Glossary('алмасы', 'animal_type_almas_encyclopedia_desc')]. Если мы не будем осторожны на горных тропах, зверю не составит труда сбросить нас со склона на верную смерть."
 hunt.0520.apep_ibizan: "Печально известное существо, зовущееся [Glossary('апеп-ибисийцем', 'animal_type_apep-ibizan_encyclopedia_desc')], агрессивно, умно и во многих отношениях сверхъестественно. Жители [Concept('kemsar_biozone','Кемсара')|E] верят, что это существо послано дьяволом, дабы терроризировать их в годину нужды. И это определённо похоже на правду. Оно способно почуять любого человека на определённом расстоянии, что делает скрытность бесполезной. Оно пугающе быстро #italics и #! обладает боевым навыком, превосходящим мастерство большинства смертных."
 hunt.0520.banshee: "Пока суеверные крестьяне ошибочно клеймят каждого местного призрака «[Glossary('банши', 'animal_type_banshee_encyclopedia_desc')]», разочаровывающая реальность такова: настоящая банши вряд ли оставит в живых прямых свидетелей своего появления. В лучшем случае встреча с одним из этих духов закончится смертью жертвы, в худшем — подчинением её воли, а если судьба окажется особенно жестокой, несчастного сделают игрушкой в вечном заточении."
 hunt.0520.bhramar: "Слабый и мучительный стон [Glossary('бхрамара', 'animal_type_bhramar_encyclopedia_desc')] ужасает, заставляя повернуть назад всех, кроме самых отважных путешественников. Лук может уничтожить одно или два из его многочисленных жалящих сочленений, но само существо выстоит и убьёт такого охотника. Говорят, что единственная слабость бхрамара — это пламя, заставляющее его сжиматься в форму, весьма напоминающую его прежний человеческий облик."
 hunt.0520.chimera: "[Glossary('Химера', 'animal_type_chimera_encyclopedia_desc')] известна своим злобным интеллектом и источает отвратительное зловоние. Её дыхание, самое ужасное среди всех тварей [Concept('aeras','Эраса')|E], вызывает жуткие судороги, паралич и смерть. Лишь немногим счастливчикам удаётся спастись невредимыми телом, но их разум остаётся истерзанным и преследуемым видениями. Только козья голова способна источать этот газ, однако в ответ на угрозу она, как известно, выпускает густое облако сероватого тумана, окутывающее саму химеру и её окружение."
 hunt.0520.coatl: "Говорят, что [Glossary('коатль', 'animal_type_coatl_encyclopedia_desc')] настолько свиреп и силён, что способен раздавить человека своим телом. Если мы хотим победить, то должны помешать ему взлететь и сбежать после начала атаки."
 hunt.0520.cor: "Говорят, что [Glossary('кор', 'animal_type_cor_encyclopedia_desc')] играет с разумом, и тот, кто желает сразить его, должен обладать быстротой мысли. Иначе можно навсегда потерять себя в процессе."
 hunt.0520.crocotta: "Стаи [Glossary('крокотт', 'animal_type_crocotta_encyclopedia_desc')] были замечены неподалёку от мест, где бродит мой отряд — они охотятся на местных деревенских жителей. С каждым уходящим мгновением вероятность того, что я услышу их ужасающие крики, становится всё выше. Они всё ещё рыщут по холмам, пока мы выслеживаем их, и может статься так, что они найдут нас раньше, чем мы их."
 hunt.0520.devouring_worm: "[Glossary('Пожирающий червь', 'animal_type_devouring_worm_encyclopedia_desc')] — одно из самых ужасающих существ, населяющих пустыни этого мира. Многие из них мелки, всего фут или два в длину и толщиной с колбасу, но некоторые, как известно, вырастают достаточно большими, чтобы проглотить человека. Они зарываются под песок в ожидании добычи, затем вырываются из-под земли, заглатывают как можно больше и снова уходят вглубь, чтобы переварить пищу.\n\nКак бы они ни были опасны, охотиться на них вполне возможно."
 hunt.0520.dire_mosquito: "Говорят, что [Glossary('лютый комар', 'animal_type_dire_mosquito_encyclopedia_desc')] чрезвычайно смертоносен, поэтому мы должны быть осторожны, пробираясь сквозь густые джунгли."
 hunt.0520.djinn: "[Glossary('Джинны', 'animal_type_djinn_encyclopedia_desc')] могут показаться невозможной добычей, учитывая, что у них нет обычного плотского тела, однако этого можно достичь нетрадиционными методами. Арсенал охотника на джиннов состоит не из луков и ножей, а из фолиантов магических знаний и призм, созданных из [Concept('sarradon','саррадонского')|E] стекла Таршаф. Эти методы эзотеричны, а риск велик, но перспектива получить в своё распоряжение тысячелетнего магического слугу весьма заманчива для многих."
 hunt.0520.doyarchu: "Водно-болотные угодья полны звуков щебечущих птиц и квакающих лягушек, но [Glossary('доярчу', 'animal_type_doyarchy_encyclopedia_desc')], которого мы ищем, не издаёт ни звука — он поджидает совершенно неподвижно, в абсолютной тишине. На самом деле, когда мы проходим мимо очередного бревна или валуна, по моему хребту пробегает холодная дрожь."
 hunt.0520.dreadleech: "[Glossary('Ужасный пиявка', 'animal_type_dreadleech_encyclopedia_desc')] кажется чем-то сошедшим со страниц кошмара: призрачный монстр, нападающий на свою несчастную жертву под покровом ночи и обрекающий её на мучительную и крайне медленную смерть. Это крупные существа, способные вместить в себя несколько взрослых людей, хотя они убивают не ради пропитания. Вместо этого они нападают на добычу в ночной тьме и полностью высасывают кровь из тела. Они предпочитают выбирать спящих, неподвижных или раненых, блуждая по глубоким джунглям в поисках жертвы."
 hunt.0520.false_hydra: "Признаки [Glossary('ложной гидры', 'animal_type_false_hydra_encyclopedia_desc')] отчётливо видны по всему почти заброшенному поселению. Дома заколочены от нас, пока их обитатели одновременно улыбаются и плачут. Мальчик, посланный встретить нас на окраине деревни, был в ужасе, и всё же тот же самый мальчик бродит теперь вокруг нас с кривой улыбкой на лице. Слепая песня явно завладела этими людьми."
 hunt.0520.forest_troll: "[Glossary('Лесной тролль', 'animal_type_forest_troll_encyclopedia_desc')] — излюбленное чудовище из детских сказок и неизменный повод для бахвальства особенно умелых (или нечестных) охотников. Однако настоящие нападения лесных троллей случаются довольно редко — не потому, что они не агрессивны (в чём можно не сомневаться), а потому, что они попросту населяют исключительно густые, первобытные леса, расположенные вдали от цивилизации."
 hunt.0520.gajara: "[Glossary('Гаджара', 'animal_type_gajara_encyclopedia_desc')] славится своей яростью, неистовой и ненасытной в своей ненависти. Хотя издалека существо кажется слоном, нет никаких сомнений в том, что это двуногий монстр, едва деревья перестают скрывать его. Говорят, что единственная слабость гаджары — его огромные молочно-белые глаза, ведь его кожа толще любого доспеха."
 hunt.0520.gargoyle: "[Glossary('Гаргульи', 'animal_type_gargoyle_encyclopedia_desc')] — чрезвычайно ужасные существа, хотя, к счастью, они активны лишь короткими вспышками, будучи в спящем состоянии больше похожими на статуи, чем на живых тварей. Хотя на первый взгляд они могут показаться достаточно лёгкой добычей, нельзя забывать, что живут они на склонах гигантских утёсов, подъём на которые станет суровым испытанием даже для самых опытных альпинистов."
 hunt.0520.gaunt: "[Glossary('Худой', 'animal_type_gaunt_encyclopedia_desc')] — опасный противник. Из-за его способности к полёту с ним трудно совладать, а его толстая кожистая шкура, острые рога и лютые когти мешают нанести ему вред даже в ближнем бою. Колония худых опасна вдвойне: они действуют сообща, чтобы убить незваных гостей, и прикрывают слабости друг друга. Пожалуй, именно в их пещерных жилищах кроется наилучшая возможность ослабить колонию — с помощью удачно разведённого костра их можно выкурить, чтобы разобраться с ними, пока они пребывают в смятении."
 hunt.0520.giant: "Учёные спорят о том, почему легендарные [Glossary('великаны', 'animal_type_gh_giant_encyclopedia_desc')] Калатипсоми встречаются только в этой провинции, хотя большинство сходится во мнении, что причина крыруется в обширных, плодородных первобытных лесах и обилии лютой дичи. Это делает регион одним из немногих мест на Аэрасе, где существа подобного масштаба всё ещё могут выживать исключительно за счёт собирательства и охоты."
 hunt.0520.giant_bee: "Мы можем видеть колоссальную структуру улья с огромного расстояния, однако добраться до неё — совсем другое дело."
 hunt.0520.giant_spider: "Если бы не разбросанные по земле кости и свисающие с потолка коконы, гигантская паутина, закрывающая вход в пещеру, где обитает [Glossary('гигантский паук', 'animal_type_giant_spider_encyclopedia_desc')], была бы практически невидима, если не считать едва уловимого отблеска отражённого света."
 hunt.0520.great_rahksasa: "[Glossary('Великий ракшас', 'animal_type_great_rahksasa_encyclopedia_desc')] полностью оправдывает своё имя. После трудного путешествия вглубь влажных тропических лесов мы без труда выследили этого массивного зверя. Его следы было совсем не сложно отыскать, да и сам монстр, похоже, ничуть об этом не заботился, будучи полностью уверенным в собственной силе."
 hunt.0520.griffon: "Меньше всего нам хочется, чтобы [Glossary('грифон', 'animal_type_griffon_encyclopedia_desc')] застал нас врасплох и разорвал на куски прежде, чем мы успеем понять, что произошло."
 hunt.0520.karkadann: "[Glossary('Каркаданн', 'animal_type_karkadann_encyclopedia_desc')] мало заботится об окружающей фауне, поскольку прекрасно знает о своём доминировании в животном мире."
 hunt.0520.armazli_rhino: "Говорят, что великий шерстистый [Glossary('армазлийский носорог', 'animal_type_armazli_rhinoceros_encyclopedia_desc')] из [Glossary('Амагеи','amaghea_biozone_encyclopedia_desc')] совершенно не скрывает своих следов, будучи уверенным, что сможет одолеть любых потенциальных нападающих."
 hunt.0520.kursha: "Стая [Glossary('куршей', 'animal_type_kursha_encyclopedia_desc')] — непростая цель даже для опытного охотника. Однако существование прирученных куршей доказывает мне, что убийство одного из них вполне в моих силах. Сила этих псов заключается в их стайном менталитете, позволяющем подавлять и обходить добычу с флангов, но это преимущество теряется, когда они сражаются в одиночку."
 hunt.0520.spriggan: "[Glossary('Спригган', 'animal_type_spriggan_encyclopedia_desc')] обладает преимуществом маскировки — в неподвижном состоянии его древесное тело полностью сливается с окружающим лесом."
 hunt.0520.living_blizzard: "Тактику победы над [Glossary('живым бураном', 'animal_type_dire_living_blizzard_encyclopedia_desc')] чрезвычайно трудно найти, а отделить крестьянские суеверия от действительно эффективных методов — ещё сложнее."
 hunt.0520.lymrill: "Говорят, что [Glossary('лимрилл', 'animal_type_lymrill_encyclopedia_desc')] очень умён и невероятно злобен, если его спровоцировать, из-за своего столь же взрывного темперамента. Пока мы сохраняем эффект неожиданности и разим с расстояния из наших луков, у него будет мало времени среагировать, но мы должны действовать быстро. [activity.Custom('GetAnimalType')|U] не заставит себя долго ждать и скроется обратно в лесной чаще, и тогда все наши усилия пойдут прахом."
 hunt.0520.manticore: "Трудность заключается не в выслеживании [Glossary('мантикоры', 'animal_type_manticore_encyclopedia_desc')], а в убийстве зверя. И по этой причине сопровождающий меня охотничий отряд должен быть внушительной силой."
 hunt.0520.myrmeke: "Хотя [Concept('cyrat_biozone','Кират')|E] полон опасных существ, мы не можем рисковать и привлекать внимание [Glossary('мирмеков', 'animal_type_myrmeke_encyclopedia_desc')], не подготовившись как следует."
 hunt.0520.naga: "Логово чудовищного [Glossary('наги', 'animal_type_naga_encyclopedia_desc')] должно быть легко найти, если идти по следу из освежёванных человеческих тел, развешанных на деревьях в джунглях."
 hunt.0520.owlbear: "Нам нужно действовать быстро, пока [Glossary('совиный медведь', 'animal_type_owlbear_encyclopedia_desc')] не уковылял обратно в чащу, иначе мы упустим свой шанс нанести удар."
 hunt.0520.roaring_lizard: "Несмотря на свою свирепость и предполагаемый ум, [Glossary('рычащие ящеры', 'animal_type_roaring_lizard_encyclopedia_desc')] огромны и, скорее всего, не заметят мой отряд, пока мы крадёмся вглубь джунглей в погоне за ними."
 hunt.0520.rock_giant: "Искажённое привидение, преследующее скалистые горные тропы, — [Glossary('каменный великан', 'animal_type_rock_giant_encyclopedia_desc')] является чудовищем как физического, так и духовного мира. Хотя он принимает облик существа, состоящего из валунов и иных камней, его истинный повелитель заточён внутри — это измученный дух, жаждущий мести обитателям [Concept('aeras','Эраса')|E] за то, что они с ним сотворили."
 hunt.0520.running_raptor: "В этой части джунглей был замечен [Glossary('бегущий раптор', 'animal_type_running_raptor_encyclopedia_desc')], и по следу из разбитых яиц и окровавленных гнёзд я могу проследить его путь. Это существо — смертоносный охотник, и найти его до того, как оно поймёт, что на него охотятся, станет непростой задачей."
 hunt.0520.shade: "[Glossary('Теней', 'animal_type_shade_encyclopedia_desc')|U], к счастью, довольно трудно встретить в большинстве уголков мира, если только не отправляться намеренно на поиски тех противоестественно тёмных мест, где они обычно обитают. Большинство обществ прикладывают огромные усилия, чтобы искоренить их всякий раз, когда они появляются вблизи цивилизации, поскольку за одну ночь заражение может легко выйти из-под контроля и уничтожить целое поселение."
 hunt.0520.spirit: "Практически в любой уважающей себя деревне есть хотя бы одно местное привидение, хотя может потребоваться время, чтобы отделить правду от простых вымыслов. История [Concept('aeras','Эраса')|E] долга и красочна, и места с богатым прошлым вполне могут хранить [Glossary('дух', 'animal_type_spirit_encyclopedia_desc')] древнего воина, [Concept('magi','маги')|E] или правителя давно ушедшей эпохи, всё ещё задерживающийся в мире живых из-за какого-то давно забытого, неурегулированного долга или обиды."
 hunt.0520.tarasque: "[Glossary('Тараск', 'animal_type_tarasque_encyclopedia_desc')] — могучий и невероятно крепкий противник с панцирем твёрдым, как железо, и ядовитым дымным дыханием. Имея дело с этим чудовищем, я должен приготовиться убить его быстро, ибо слишком долгое пребывание в его присутствии означает для меня верную гибель."
 hunt.0520.twin_serpent: "Неподалёку были замечены [Glossary('двуглавые змеи', 'animal_type_twin_serpent_encyclopedia_desc')], и теперь мы стремимся одолеть одну из них. Хотя эти существа сильны и быстры, я уверен в своей способности выйти из этой охоты живым."
 hunt.0520.ubir: "Известно, что [Glossary('убыры', 'animal_type_ubir_encyclopedia_desc')] — кровожадные, отвратительные существа, которых часто находят в [Glossary('Айронойской степи', 'great_steppe_encyclopedia_desc')], роющимися в гниющих трупах недавних сражений. Истории рассказывают о монстрах, пробирающихся в деревни под покровом ночи, чтобы утащить детей в своё логово."
 hunt.0520.ugkilrrrmag: "[Glossary('Угкилрррмаг', 'animal_type_ugkilrrrmag_encyclopedia_desc')] — смертоносный враг для неподготовленных. К тому времени, когда на коже замечают нарост, инфекция часто заходит слишком далеко, и даже ампутация не всегда может спасти жизнь."
 hunt.0520.ukhinbooum: "[Glossary('Ухинбоум', 'animal_type_ukhinbooum_encyclopedia_desc')] — отвратительные, злобные существа. Говорят, что они ядовиты, и если им удастся вонзить свои вытянутые морды в вашу кожу, то неважно, убьют ли они вас сами прямо сейчас — токсины сделают это за них. Наш лучший шанс на победу — нанести удар, сохранив эффект неожиданности, и прикончить тварь как можно быстрее."
 hunt.0520.urmahlullu: "Судя по тому, что я слышал об [Glossary('урмахлуллу', 'animal_type_urmahlullu_encyclopedia_desc')], это довольно разумное существо. Истории о том, как оно само охотится на своих охотников, кажутся несколько преувеличенными, но я не могу позволить себе недооценивать эту тварь. С четырьмя когтистыми лапами и ещё двумя, обладающими силой человека, ум этого существа — меньшая из моих забот."
 hunt.0520.whisperwind: "Некоторые считают, что [Glossary('шепчущий ветер', 'animal_type_whisperwind_encyclopedia_desc')] имеет множество обличий, в то время как другие верят, что у него вообще нет формы."
 hunt.0520.wyrm: "[Glossary('Вирмов', 'animal_type_wyrm_encyclopedia_desc')|U], в тех редких случаях, когда их замечают и наблюдатель выживает, чтобы рассказать об этом, часто путают с [Concept('dragons','драконами')|E]. Хотя учёные предполагают, что эти два существа родственны, у вирмов отсутствуют многие определяющие черты их предполагаемых кузенов — они совершенно не способны к полёту, не изрыгают пламя и, что примечательно, полностью лишены ног. Считается, что они обладают почти таким же уровнем интеллекта, хотя это трудно подтвердить из-за их враждебности по отношению к тем редким людям, которых они встречают."
 hunt.0520.zilant: "Говорят, что [Glossary('зилант', 'animal_type_zilant_encyclopedia_desc')] живёт на вершине скалистого утёса перед нами, где-то среди камней. Ближайшие деревни держатся подальше от этих круч, а также поступали сообщения о крупном красном крылатом существе, уносящем скот и других стадных животных."
 hunt.0520.cockatrice: "[Glossary('Кокатрис', 'animal_type_cockatrice_encyclopedia_desc')], известный некоторым как орёл [aervalr|E], другим — как гранитный петух, а третьим — как алхимический дракон, является тронутым богом зверем, известным своим ядом, огромным уродством и гнусным зловонием. Самым пресловутым из всего является его пронзительный и смертоносный взгляд. Известно, что кокатрис имеет неразрывную связь с циклами Аэрвалра и может изменять мёртвую материю [Concept('aeras','Эраса')|E] одним лишь взглядом. Именно по этой причине [Concept('dead_magi','маги земли')|E] используют этого зверя в качестве геральдического символа. Следует проявлять осторожность, ибо в полнолуние чудовище наиболее могущественно. Оно испытывает особую склонность к превращению костей в камень, что приводит к мгновенной смерти любого несчастного, подвергшегося его взгляду."
 hunt.0500.ground_dweller:0 "Многие пытались бы убедить вас, что [Glossary('подземный житель', 'animal_type_ground_dweller_encyclopedia_desc')] — не более чем страшилка, призванная пугать юных учеников в [Concept('mayikrata','Майикратии')|E], но недавно отсюда поползли слухи, предполагающие, что именно такой монстр уже несколько недель терроризирует округу. Это может быть как раз то, что мы искали!"
 hunt.0510.desc_monster: "\n\nВ [ROOT.Char.Custom.GetCurrentLocation.Custom('GetTerrainLandPlural')] региона [host.GetCurrentLocation.GetNameNoTooltip], без сомнения, водится множество зверей, и мои слуги предлагают мне несколько вариантов для охоты."

 hunt.0500.no_monster: "Хотя о том, кто именно скрывается здесь в глуши, нет никаких конкретных данных, нам всё же может повезти найти какого-нибудь [activity.Custom('GetAnimalMale')]."
 hunt.0550.monster: "\n\nНа просторах [Concept('aeras','Эраса')|E] есть множество [Concept('monsters','монстров')|E], которых нужно разыскать, и вскоре одним из них станет меньше..."
 hunt.1003.stinger: "\n\nОхотники настороженно окружают существо, которое уставилось на меня своими бусинками-глазами, пока его острое как бритва жало блестит на свету."
 hunt.1003.toxins: "\n\nОхотники настороженно окружают существо, боясь подойти слишком близко, дабы оно не умудрилось нанести удар и превратить их плоть в гниль."

 gh_hunt.1001.t: "Убийство [activity.Custom('GetAnimalType')|W]"

 ## Monster Lair hunt loc ##
 gh_hunt.1001.desc.adze: "Мы натыкаемся на [activity.Custom('GetAnimalType')] прямо за пределами небольшой деревни: существо склонилось над ободранной тушей овцы. Оно нас ещё не заметило."
 gh_hunt.1001.desc.akapura: "Эта конкретная [activity.Custom('GetAnimalType')] проснулась лишь недавно — её светящаяся голова видна над волнами, в то время как конечности всё ещё спрятаны внутри панциря.\n\nДля этого дела мы приготовили бомбу. Панцирь [activity.Custom('GetAnimalType')|G] прочнее камня, а лапы толстые и чешуйчатые: единственный способ по-настоящему убить такого зверя — подорвать его изнутри."
 gh_hunt.1001.desc.almas: "Говорят, что на вершине каменистого подъёма перед нами находятся охотничьи угодья [activity.Custom('GetAnimalType')|G], которая нападала на путешественников по всей горной тропе. Подъём холодный и трудный, ветер обжигает нас резкой прохладой. Когда мы готовимся выступить, среди скал эхом отдаётся хриплый вой."
 gh_hunt.1001.desc.apep_ibizan: "У [activity.Custom('GetAnimalType')|G] мало слабостей, если они вообще есть. Когда мы наконец находим это отвратительное существо, пожирающее, судя по всему, очередную человеческую семью, мы готовим луки, и у меня закрадывается предчувствие, что приходить сюда было ошибкой."
 gh_hunt.1001.desc.banshee: "Отыскать логово этой мерзкой [activity.Custom('GetAnimalType')|G] само по себе стало впечатляющим подвигом в области изысканий и магического следопытства. Но как бы ни был труден этот шаг, следующий будет куда хуже: нам предстоит столкнуться не только с самой [activity.Custom('GetAnimalType')|I] и её могущественной [Concept('magic','магией')|E], но и с многочисленными смертными и эфирными слугами, которых она привязала к себе за долгие века."
 gh_hunt.1001.desc.bhramar: "С копьём в одной руке и факелом в другой я веду наш отряд ближе к стонущему рою. Он неловко кружит вокруг древнего дерева, сохраняя очертания человека, но с каждым ударом моего сердца из его плоти вырываются и с силой вонзаются обратно осы. Существо поворачивается к моему факелу и замирает всего в нескольких шагах, выжидая, хочу ли я причинить ему вред.\n\nСтоны становятся только громче, и мой шанс убить тварь начинает ускользать."
 gh_hunt.1001.desc.chimera: "Уже несколько дней мы идём по следу из разорённых деревень и сбившихся в кучу выживших. Выслеживать её легко — непривычное ощущение после долгих недель погони за слухами о выпотрошенных овцах. Но теперь зверь предал землю вокруг дикому и безразборчивому опустошению. Мы не знаем, почему химера сменила тактику, но некоторые из моих охотников мрачно шепчут, что монстр почуял нас и теперь пытается над нами поиздеваться.\n\nОт одной этой мысли у меня стынет кровь."
 gh_hunt.1001.desc.coatl: "Мы часами пробирались сквозь густые заросли джунглей, следуя вверх по извилистой реке к небольшому водопаду, который, по словам местных, и был логововом [activity.Custom('GetAnimalType')|G]. Приблизившись, я замечаю нечто похожее на расселину, скрытую за потоками бурлящей воды. Если мы заберемся по лианам, свисающим у водопада, то сможем раскачаться и запрыгнуть внутрь. Я проверяю, надёжно ли закреплён клинок на поясе, и готовлю сеть, перекинув её через руку."
 gh_hunt.1001.desc.cockatrice: "Наше предвкушение росло по мере приближения к логову зверя. Признаки его присутствия были очевидны: окаменевшие деревья и кости диких животных, обращённые в камень, на которых всё ещё висели гниющие лоскуты кожи и меха. Когда мы подходим к ложбине, где существо устроило свой дом, нас поражает невыносимое зловоние — не смерти или гнили, а скорее напоминающее кучу отходов алхимика. Похоже, [activity.Custom('GetAnimalType')] соорудил гнёздо из окаменевших деревьев, скрученных и натянутых сверху, образуя плотный навес. Мой охотничий отряд смотрит на меня с явным ужасом в глазах. Хотя мы приняли все меры предосторожности и убедились, что фаза Аэрвалра благоприятна, этот бой обещает быть ужасным."
 gh_hunt.1001.desc.cor: "Следуя советам местных жителей, утверждавших, что [activity.Custom('GetAnimalType')] рыщет в кромешной тьме туннелей близлежащей пещеры, мы отправились на поиски. Потребовались часы, чтобы найти упомянутый грот, единственной примечательной чертой которого была руна в форме ястреба над входом. Сделав глубокий вдох и уняв дрожь в руках, мы ступаем в тёмный туннель. Свет факелов пляшет по стенам пещеры, и краем глаза мне чудятся лица и пляшущие существа. Я чувствую, как сердце колотится в груди с каждым шагом вглубь этого подземного мира, и вскоре мы выходим к узкой, тесной норе — крутой и зазубренной расщелине, ведущей ещё дальше. Если мы хотим найти этого монстра, нам придётся пролезать поодиночке, но повернуть назад отсюда будет непросто. Мы должны быть готовы."
 gh_hunt.1001.desc.crocotta: "Я замечаю стаю [activity.Custom('GetAnimalType')|G], пирующую на останках двух кабанов. Когда мой отряд подходит ближе, я вижу, что их «зубы» на самом деле представляют собой единый костяной гребень на каждой челюсти, вырывающий огромные куски плоти за раз. Мы размеренно приближаемся к стае, стараясь вести себя тихо, чтобы не встревожить их раньше времени. Если мы начнём действовать слишком рано, твари окружат нас и набросятся с такой скоростью и силой, с которой нам не совладать."
 gh_hunt.1001.desc.dire_mosquito: "Пока я двигаюсь со своими спутниками через джунгли, высматривая лучи света, пробивающиеся сквозь густой навес, я отмахиваюсь от нескольких жужжащих насекомых — уменьшенных копий монстра, которого мы хотим убить. После блужданий, которые кажутся вечностью, я что-то слышу. Тихое гудение где-то вдали. Я поднимаю дрожащую руку к столбу солнечного света, падающему сверху.\n\nИ тут свет гаснет, звук становится оглушительным, а [activity.Custom('GetAnimalType')] спускается из просвета в деревьях. Его странные красные глаза, покрытые узором из шестиугольников, кажутся отражением тусклого солнца. Лапы свисают внизу, а длинное тело удерживается неуловимо быстрыми крыльями, издающими непрекращающийся гул."
 gh_hunt.1001.desc.dire_stag: "Хотя [activity.Custom('GetAnimalType')] питаются исключительно растениями и предпочитают не замечать существ, не представляющих угрозы, известно, что они жестоко мстят, если их спровоцировать, а их неуклюжие размеры ничуть не замедляют их по сравнению с обычными сородичами. Не один глупый охотник нашёл свой конец, насаженный на рога этого существа, не ожидая, что оно действительно нанесёт ответный удар после того, как выстрел не сможет его убить.\n\nПеред собой я вижу зверя, которого мой отряд выслеживал несколько дней. Попадание в любую часть тела, кроме самых уязвимых, лишь разозлит его и подвергнет меня смертельной опасности."
 gh_hunt.1001.desc.djinn: "Я брожу по каньону, где, по слухам, обитают несколько [activity.Custom('GetAnimalType')|G], и понимаю, что близок к цели, когда чувствую странное потягивание под ложечкой. Я замечаю какое-то движение в тенистой расселине, но кажется, будто сама тень ожила! Это облик джинна, едва различимый в слабом свете, и он, похоже, настороженно разглядывает меня."
 gh_hunt.1001.desc.doyarchu: "Тишину болот нарушает всплеск воды, и когда я поворачиваюсь, чтобы увидеть источник, характерный ящероподобный хвост [activity.Custom('GetAnimalType')|G] скрывается в глубине, а из трясины вырастает его уродливая голова с кинжально-острыми зубами."
 gh_hunt.1001.desc.dreadleech: "Для охоты на [activity.Custom('GetAnimalType')] был разработан план. Я приготовил для существа ловушку в виде привязанной у костра свиньи, привезённой специально для этой цели. Когда тварь приблизится, она начнёт пировать, и мы сможем спрыгнуть с окружающих крон деревьев, дабы убить её. После долгих часов ожидания, вглядываясь в темноту, я вижу смутную тень, шевелящуюся за пределами света костра, и свинья начинает визжать.\n\nИ тут в тусклом сиянии появляется массивный чёрный силуэт, и я созерцаю [activity.Custom('GetAnimalType')] размером со здание, которая с удивительной быстротой скользит по земле к несчастной свинье..."
 gh_hunt.1001.desc.false_hydra: "Зубастая голова прорывается сквозь грязь прямо у моей ноги, а затем ещё одна появляется позади меня. Ложная гидра медленно выбирается на поверхность, чтобы полакомиться мной — незваным гостем в её охотничьих угодьях. Я должен быть осторожен, ведь если существо затянет свою песню, я позабуду о своей цели. Она может казаться всего лишь многоголовым червем, но это существо я не посмею недооценивать.\n\nЯ должен выбрать: сразиться с этой тварью прямо сейчас или забыть о ней навсегда, если посмею повернуться спиной."
 gh_hunt.1001.desc.forest_troll: "Каждая [activity.Custom('GetAnimalType')] — ненасытная тварь, и это видно: полностью разорённые ягодные поляны, поваленные деревья и растерзанные туши животных усеивают эту местность. Вскоре мы находим само логово — разумеется, пещеру — и готовимся войти..."
 gh_hunt.1001.desc.gajara: "Все мысли о слухах испаряются из голов моего отряда, едва мы впервые бросаем взгляд на эту конкретную [activity.Custom('GetAnimalType')]. Она сидит на пне, лениво, но свирепо разрывая на части свою очередную жертву. Пока ребёнок в её клыкастой пасти исчезает, я понимаю, что вскоре она заметит и меня.\n\nУ меня есть сомнения, что такое существо вообще можно убить, теперь, когда я вижу его во плоти, но я могу хотя бы попытаться."
 gh_hunt.1001.desc.gargoyle: "С [activity.Custom('GetAnimalType')|I] никогда не сражаются в одиночку, ибо это существа стайного нрава. Их сила, скорость и стойкость — пугающее сочетание качеств, и одна единственная ошибка может превратить незадачливого убийцу в труп быстрее молнии. Успех будет зависеть от сочетания осторожности, мастерства и капли везения."
 gh_hunt.1001.desc.gaunt: "Пока мой охотничий отряд и я приближаемся к крутой скале, где обосновались [activity.Custom('GetAnimalType')], я тихо жестом приказываю нескольким людям принести хворост для костра. Через несколько минут бушующее пламя заполняет небо дымом. Пещеры тоже оказываются выкурены, и множество этих существ с криком вылетают в небо.\n\nБольшая часть охотничьего отряда хранит молчание, ожидая первого выстрела."
 gh_hunt.1001.desc.giant: "Хотя у нас ушли дни на то, чтобы добраться до густого леса, где водятся [activity.Custom('GetAnimalType')], стоит только напасть на их след, как выслеживание становится тривиальным делом. Мало того, что они огромны, так они ещё и почти неизменно живут небольшими группами и путешествуют вместе, что делает путь их перемещения ещё более заметным. Мы уже какое-то время выслеживаем эту конкретную группу, ожидая, пока один из их рода не отделится от остальных в поисках пищи — нападать на всех сразу было бы глупостью. Как только подворачивается удобный случай, я начинаю приближение."
 gh_hunt.1001.desc.giant_bee: "Несколько [activity.Custom('GetAnimalType')|G] лениво пролетают мимо нас вглубь леса, и вскоре за ними следуют другие. Мы приготовили несколько связок хвороста и листьев: если наши расчёты верны, мы сможем поджечь охапку и задушить оставшихся пчёл дымом, сделав их покорными и гораздо более покладистыми.\n\nСуществует, конечно, вероятность, что мы разбудим их раньше времени, разозлив матку ещё до того, как ступим внутрь хотя бы на фут. Нам нужно двигаться тихо и осторожно, если мы надеемся преуспеть."
 gh_hunt.1001.desc.giant_spider: "Самой [activity.Custom('GetAnimalType')|G] нигде не видно, но она совершенно точно поблизости — эти монстры не склонны бродить и живут исключительно за счёт тех несчастных существ, что забредают в их логово. Конечно, у меня нет намерений лично искать этого паука. Нарушение целостности паутины определённо привлечёт внимание твари."
 gh_hunt.1001.desc.great_rahksasa: "Когда мы наконец заметили [activity.Custom('GetAnimalType')] сквозь листву, она уже вовсю терзала трупы двух несчастных путешественников. Мы слышали их крики вдалеке, пока выслеживали цель, но помочь им шансов не было.\n\nПока [activity.Custom('GetAnimalType')] занята, мы подкрадываемся ближе через подлесок, стараясь издавать как можно меньше звуков. При охоте на этих существ нет права на ошибку, и мы должны действовать решительно и хитро, если надеемся выжить. Зверь валит дерево, о которое бился в попытке протолкнуть труп глубже в глотку, и теперь изо всех сил пытается проглотить свою добычу."
 gh_hunt.1001.desc.griffon: "Мы оставили наших скакунов на приличном расстоянии, под надёжной охраной нескольких моих спутников — как для защиты от обычных воров, так и от угрозы воздушного охотника, которого мы ищем. Приближаясь к логову [Glossary('грифона', 'animal_type_griffon_encyclopedia_desc')], мы рассредоточились, держа друг друга в поле зрения и поглядывая на небо на случай засады.\n\nМоё сердце бьётся чаще, лицо застыло в мрачной решимости, а глаза мечутся от точки к точке. Спустя вечность мы наконец поднимаемся на вершину, где находим гнездо зверя, но не видим и следа его присутствия. Мы стоим, не зная, что и думать, пока нас не сотрясает пронзительный крик над головами. Развернувшись, мы видим монстра, готового ринуться вниз с предвестием смерти в глазах."
 gh_hunt.1001.desc.hieracosphinx: "Когда мы добираемся до гребня холма, перед нами предстаёт на удивление маленькое гнездо. Останки местной фауны разбросаны между тремя птенцами, на клювах которых всё ещё видна кровь. Их мать покинула их ненадолго, в этом я уверен. Птенцы начинают пищать на нас, подползая ближе на когтистых лапах. Повернувшись, чтобы узнать, что привлекло их внимание, я вижу, как их мать возвращается к гнезду.\n\nЯ должен сделать свой ход быстро, иначе попадусь в когти этой твари."
 gh_hunt.1001.desc.karkadann: "Прямо за гребнем холма, за которым мы укрылись, наша добыча пасётся в невысоком кустарнике. Другие животные поблизости держатся подальше от чудовищного [activity.Custom('GetAnimalType')|G] — одинокого [activity.Custom('GetAnimalMale')|G], который бродил в поисках пары. Этот [activity.Custom('GetAnimalType')] очень похож на своего меньшего кузена, [Glossary('носорога','animal_type_rhinoceros_encyclopedia_desc')], но охотиться на него куда опаснее. Его массивный рог больше похож на отточенный клинок, сужающийся к самому кончику. Сами размеры зверя кажутся непреодолимыми, его поджарое мускулистое тело легко затмевает нас. Пока зверь бредёт по узкому руслу ручья, он не обращает никакого внимания на окружающий мир. Если мы надеемся победить, мы должны действовать с хитростью и долей неожиданности."
 gh_hunt.1001.desc.kursha: "Мой отряд выследил [activity.Custom('GetAnimalType')|G], которая оказалась достаточно дерзкой, чтобы остаться пировать на своей свежей туше, даже когда поблизости нет признаков её стаи. Пока она поглощена трапезой, у меня нет сомнений: она услышит меня, если я сделаю хоть шаг ближе.\n\nОна поднимает морду, когда мой запах начинает разноситься по горному склону."
 gh_hunt.1001.desc.spriggan: "Мы осторожно ступаем по густому лесу, зная, что [activity.Custom('GetAnimalType')] уже рядом. К счастью, нам удаётся вовремя её заметить — это раскидистая масса дерева и листьев, из которой мягко сочится сок, а её длинные «конечности» почти неотличимы от окружающей флоры.\n\nОсторожно я достаю из рюкзака сосуд с жидким огнём и готовлюсь метнуть его в свою добычу."
 gh_hunt.1001.desc.living_blizzard: "Когда мы наконец завершаем наш изнурительный подъём по отвесной скале, мы выходим на заснеженный склон, на котором впервые заметили непрекращающуюся метель, двигавшуюся слишком уж целенаправленно. Наши подозрения подтверждаются, когда [activity.Custom('GetAnimalType')] начинает приближаться, без сомнения, видя в нас свою следующую игрушку. Мне остаётся лишь надеяться, что эзотерических заклинаний, чар и саррадонского стекла таршаф, что мы взяли с собой, хватит, чтобы сдержать или хотя бы уничтожить эту тварь. На такой местности отступление, скорее всего, окажется невозможным."
 gh_hunt.1001.desc.lymrill: "Прямо перед нами, отпивая из мелководной заводи посреди бурных каскадов, пока рядом гниют несколько тушек лосося, мистический [activity.Custom('GetAnimalType')] словно мерцает в лучах полуденного солнца. Хотя некоторые из нас, возможно, сомневались, что у этого существа действительно металлические иглы, то, как свет отражается от его тела — точь-в-точь как от наших клинков — не оставляет в наших умах ни единого сомнения."
 gh_hunt.1001.desc.manticore: "Мы прошли не одну лигу, следуя по проторенной грунтовой тропе вглубь давно заброшенной долины. Напряжение возрастает по мере того, как мы продвигаемся дальше, и в конце концов мы видим его: гнездо [activity.Custom('GetAnimalType')|G], примостившееся на вершине самого дальнего холма. Я натягиваю лук, обнажаю меч и выдвигаюсь вперёд."
 gh_hunt.1001.desc.myrmeke: "Джунгли движутся вокруг меня, деревья покачиваются с неестественным рвением. Гул тысячи насекомых окутывает мой отряд, но мы продвигаемся дальше, чтобы найти нашу награду: рой мирмеков. Говорят, что в тени лесного навеса они напоминают силуэты людей — уловка, которая меня не обманет. Я уверен в своих силах выследить этот рой.\n\nОчертания человека обнимают дерево не так далеко к югу от нас, и я приказываю отряду остановиться."
 gh_hunt.1001.desc.naga: "В глубине пещеры [activity.Custom('GetAnimalType')] танцует в своём кожаном костюме — лицо молодой женщины неестественно натянуто поверх его бледно-зелёной чешуи. На моих глазах существо совершает некий ритуал, сливаясь со своим образом. Наблюдая за тем, как оно всё ближе подходит к тому, чтобы по-настоящему примерить чужую шкуру, я понимаю, что моё окно для неожиданной атаки начинает сужаться. Если я хочу убить этого монстра, я должен действовать быстро."
 gh_hunt.1001.desc.owlbear: "Наша добыча стоит на некотором расстоянии от нас, вглядываясь в речную воду у своих ног и пытаясь поймать проплывающую мимо рыбу. Мы с товарищами приготовили луки, копья и факелы в надежде застать [activity.Custom('GetAnimalType')] врасплох — его свирепые когти и мощный клюв хорошо известны своей силой, но отвращение твари к огню может стать нашим лучшим шансом завалить её.\n\n[activity.Custom('GetAnimalType')|U] на мгновение поднимает голову, словно заметив наше присутствие, но затем возвращается к трапезе, вылавливая плывущего мимо лосося."
 gh_hunt.1001.desc.roaring_lizard: "[activity.Custom('GetAnimalType')|U], за которым следовал мой отряд, путешествует небольшой, тесно сплочённой группой. Хотя я не уверен, сколько их там, этого количества недостаточно, чтобы сделать наше предприятие безнадёжным.\n\nСамый крупный из взрослых особей уходит глубже в джунгли. Мы следуем поодаль, стараясь не приближаться к существу слишком близко, пока его стая всё ещё рядом. Однако, несмотря на мои осторожные действия, [activity.Custom('GetAnimalType')] разворачивается и пристально смотрит туда, где стою я.\n\nСтарые легенды гласят, что оно не увидит меня, если я буду стоять неподвижно, но я не могу быть в этом уверен..."
 gh_hunt.1001.desc.rock_giant: "Блуждая по пустынным горным тропам, мы рано или поздно должны были услышать отчётливый грохот и низкий, но мучительный стон. Со мной специально выкованный салисийский боевой молот — меч или лук не смогли бы расколоть эти камни, — и я сжимаю его крепче. Этот бой будет непростым..."
 gh_hunt.1001.desc.running_raptor: "Когда мы приближаемся к пещере, из неё появляется [activity.Custom('GetAnimalType')]. Его пернатые лапы покрыты кровью, а блестящие зелёные глаза внимательно осматривают джунгли. Я укрылся за деревом, но это не гарантирует безопасности; раптор начал красться в сторону моего отряда. Если он почуял наш запах, то мой отряд вполне может быть обречён.\n\nНам придётся вскоре принять бой или бежать, если мы хотим выжить."
 gh_hunt.1001.desc.shade: "У нас есть все основания полагать, что руины перед нами служат пристанищем для группы [activity.Custom('GetAnimalGroup')|G]. Тьма, лежащая за входом, настолько кромешная, что кажется, будто она готова поглотить любого, кто туда войдёт."
 gh_hunt.1001.desc.spirit: "Мы отследили слухи и [Concept('magic','магические')|E] следы этой [activity.Custom('GetAnimalType')|G] до руин, полностью отвоёванных природой. Разумеется, большинство призраков неактивны в дневное время, так что у нас есть немного времени, чтобы подготовиться к столкновению до захода солнца."
 gh_hunt.1001.desc.tarasque: "Мы наконец натыкаемся на [activity.Custom('GetAnimalType')|G], когда она громит фермерскую общину, нанося ужасный урон скоту и оставляя фермеров беспомощными.\n\nПохоже, зверь не заметил нашего приближения."
 gh_hunt.1001.desc.twin_serpent: "[activity.Custom('GetAnimalType')] — существо уединённое, привыкшее охотиться на изолированную добычу. Наша надежда состоит в том, что мой отряд и я сможем подавить способности существа разом, распределив хвост и головы между собой. Тем не менее, вид исполинской змеи перед нами заставляет мои колени дрожать.\n\nЯ должен убедиться, что готов к схватке с таким существом, иначе моя смерть будет неизбежна."
 gh_hunt.1001.desc.ubir: "В нескольких милях к югу от последнего поля битвы, которое мы обыскали, один из моих спутников обнаружил захудалый, почти обрушившийся вход в пещеру, скрытый высокой травой. Зев пещеры кажется вырытым из земли, уходя почти по прямой линии вниз под её поверхность. Гнилостный воздух, вырывающийся из-под грязи, заставляет нас давиться по мере приближения к гроту.\n\nЕсли мы надеемся найти эту [activity.Custom('GetAnimalType')], это будет наш лучший шанс, но не могу сказать, что мне нравятся шансы сражаться с таким существом в его собственном логове."
 gh_hunt.1001.desc.ugkilrrrmag: "Мой отряд замечает то, что кажется разлагающимся трупом, спотыкающимся в близлежащем овраге — запутанный клубок глаз прорастает из всех частей его красного мясистого тела. Это, несомненно, колония [activity.Custom('GetAnimalType')|G], ползущая ко всему, что может стать её следующим хозяином. Я следую за её медленным движением сзади, постепенно подбираясь всё ближе и ближе к месту, откуда нанесу первый удар."
 gh_hunt.1001.desc.ukhinbooum: "Из нашего укрытия в скалах, прямо над береговой линией, мы видим, как три [activity.Custom('GetAnimalType')] сосут соки из трупа, одновременно заматывая его в паутину, выделяемую из хвостовой части. Их тёмные панцири мерцают под ярким солнцем, влажные от прилива. Каждая из шести лап существ перебирает песок, перемещаясь и подпрыгивая в лихорадочном голоде. Недалеко по побережью зияет отверстие массивной пещеры, скорее всего, их гнездо. Наш лучший шанс на победу — нанести удар, сохранив эффект неожиданности, и прикончить тварь как можно быстрее."
 gh_hunt.1001.desc.urmahlullu: "Мой отряд находит [activity.Custom('GetAnimalType')|G], беснующуюся по равнинам без какой-либо добычи в поле зрения. Она несколько раз разворачивается на своих когтистых лапах, бросаясь в пустоту. Когда мы подходим ближе, я вижу в её руке примитивное копьё, сделанное из сломанной ветки, и она, кажется, поворачивается в мою сторону.\n\nЗаметила ли она нас — неясно, но мы должны действовать решительно."
 gh_hunt.1001.desc.whisperwind: "Я чувствую порыв воздуха, вырывающийся из расщелины, и предупреждаю свой отряд. Пробираясь по коридорам как можно незаметнее, мы ждём очередного знака. Наши факелы мерцают в тёмном проходе, и вскоре мы погружаемся во тьму. Я уверен, что [activity.Custom('GetAnimalType')] играет с нами, думая, что нам не сбежать от неё так глубоко в скрытых альковах [Concept('mayikrata','Майикратии')|E].\n\nЕсли я хочу спастись или сразиться с этим существом, мне нужно поскорее приготовиться."
 gh_hunt.1001.desc.wyrm: "Будучи по природе нелюдимыми, [activity.Custom('GetAnimalType')] выжили в самых изолированных и отдалённых уголках Этепезейского нагорья, обитая в уединённых пещерных логовах и лишь изредка выбираясь наружу, чтобы полакомиться местной фауной, заблудшим скотом или, возможно, даже несчастным крестьянином. Обычно они стараются не привлекать к себе внимания, так что найти обитель одного из них было поистине непростой задачей.\n\nОднако нам удалось это сделать, и передо мной лежит вход в обширную пещеру, которая, как я точно знаю, является логововом [activity.Custom('GetAnimalType')|G].\n\nЭто будет непростой бой."
 gh_hunt.1001.desc.zilant: "Мы забираемся высоко на уединённую гряду утёсов в поисках [activity.Custom('GetAnimalType')|G] и её логова. Скалистые вершины уходят в небо, словно скрюченные пальцы, охраняя то, что скрыто среди камней.\n\nС каждым шагом я слышу, как под ногами хрустят грязь и галька. В скалах тихо. Мы поднимаемся выше, и через плечо я вижу бескрайнюю степь за обрывами. Когда я поворачиваюсь обратно к скалам, новый звук доносится до моего уха: храп. Хотя я не могу не чувствовать прилив сил при мысли об убийстве столь величественного зверя, как [activity.Custom('GetAnimalType')], мы должны быть осторожны и хитры, если надеемся не просто выжить, но и выйти победителями."
 gh_hunt.1001.desc.ground_dweller: "Мы наконец выслеживаем этого таинственного зверя — «[activity.Custom('GetAnimalType')|G]», как прозвали его деревенские жители, — идя по следу из мусора, оставленного караваном, на который тот напал на дороге. Обрывки плоти и растерзанные конечности приводят нас к небольшому оврагу, на дне которого, судя по всему, вырыта нора.\n\nСпускаясь вниз, я слышу и чую зверя ещё до того, как успеваю его увидеть. Звуки непрекращающейся одышки, рычания и когтей, скребущих по грязи и камню, а также запах немытой плоти, крови и нечистот. Один из людей забирает мое копьё и протягивает мне ручной топор. Кивнув, я пригибаюсь, чтобы сделать наш первый шаг в это логово."
 gh_hunt.1001.a: "Вместе, как один!"

 gh_hunt.1003.desc: "Казалось, что мы никогда её не найдём, но мы наконец обнаружили [activity.Custom('GetAnimalType')|G] и её логово. Наши поиски не были напрасными!\n\n"

 gh_hunt.1003.generic: "Мы видим, что [activity.Custom('GetAnimalType')] чем-то занята в своём скрытом гнезде и пока не подозревает о нашем присутствии. Но стоит нам вздрогнуть, как мы замираем: она издаёт громкий [activity.Custom('GetAnimalSound')].\n\nЕсли мы не будем действовать быстро, она скоро нас заметит."

 gh_hunt.1003.humanoid: "Когда мы наконец обнаруживаем монстра, уродливые черты [activity.Custom('GetAnimalType')|G] искажаются в оскале. В её массивных руках зажато примитивное оружие, а глаза устремлены на нас с хищным намерением. Земля содрогается от каждого шага вперёд, а затем существо издаёт утробный [activity.Custom('GetAnimalSound')], эхом разносящийся вокруг."

 gh_hunt.1003.arthropod: "Низкий гул заполняет воздух, когда [activity.Custom('GetAnimalType')] спускается из своего гнезда, мерцая в тусклом свете. Она парит в воздухе перед нами, готовая нанести удар в момент нашей слабости."

 gh_hunt.1003.beast: "[activity.Custom('GetAnimalType')] издаёт [activity.Custom('GetAnimalSound')], который разносится по местности ([host.GetCurrentLocation.Custom('GetTerrainType')]), а её [activity.Custom('GetAnimalFeature')] встаёт дыбом, когда она делает шаг вперёд. Я вижу, как напрягаются её мускулы, а глаза, полные первобытной ярости, готовятся к броску.\n\nВоздух становится тяжёлым."

 gh_hunt.1003.spirit: "Пока мы карабкаемся и пробираемся всё дальше через это заброшенное место, по моей спине пробегает дрожь: [activity.Custom('GetAnimalAdjective')|?-ск] [activity.Custom('GetAnimalType')] материализуется, и её облик мерцает, словно гаснущее пламя. Ощущение пристального взгляда сковывает мой разум, и холодный, чуждый шёпот разносится между нами."

 gh_hunt.1003.rock_giant: "Пока мы пробираемся по каменистой местности ([host.GetCurrentLocation.Custom('GetTerrainType')]), земля начинает трескаться и раскалываться от тяжелых шагов [activity.Custom('GetAnimalType')|G], бредущей неподалёку. Её тело крошится и раскалывается, напоминая бурлящую массу расплавленного камня.\n\nЧем ближе она подходит к нам, тем сильнее закипает воздух. Нам понадобятся все наши силы, если мы хотим расколоть ядро этого монстра."

 gh_hunt.1003.flying: "Над головой проносится тень, и я поднимаю глаза как раз вовремя, чтобы увидеть кружащуюся [activity.Custom('GetAnimalType')|G], чьи крылья закрывают солнце. Пронзительный крик разносится в воздухе, когда она готовится ринуться вниз!"

 gh_hunt.1003.snake: "[activity.Custom('GetAnimalType')] переливается, сворачиваясь в кольца, и её раздвоенный язык мелькает, пробуя воздух. Звук её шипения заполняет пространство — низкое, угрожающее предупреждение, от которого по спине пробегает дрожь.\n\nНам нужно действовать быстро."

 gh_hunt.1003.worm: "Земля задрожала у нас под ногами, и мы едва успели отскочить в сторону, когда массивный [activity.Custom('GetAnimalType')] вырвался из глубин. Его разевающаяся пасть, усаженная рядами бритвенно-острых зубов, захлопнулась в считаных дюймах от того места, где я стоял.\n\nТеперь этот [activity.Custom('GetAnimalType')] издаёт [activity.Custom('GetAnimalSound')], извиваясь вокруг нас и готовясь к новому удару."

 gh_hunt.1003.swamp: "Мы осторожно продвигались вглубь болот, пока не наткнулись на её след. Вода яростно бурлит, когда [activity.Custom('GetAnimalType')] поднимается на поверхность, и её гладкая, лоснящаяся кожа поблёскивает на свету. Её холодные, бесстрастные глаза устремляются на нас, и она издаёт [activity.Custom('GetAnimalSound')]. Воздух наполняется зловонием тины и гниения, пока она подползает ближе, оставляя нам совсем мало времени на ответные действия."

 gh_hunt.1003.gross_insect: "Воздух становится густым от зловония гнили, когда [activity.Custom('GetAnimalType')] появляется из тени, и её раздутое, пульсирующее тело отливает болезненным блеском. Вытянутые конечности монстра неестественно подёргиваются, а с зазубренных мандибул капает вязкая чёрная жидкость. Многогранные глаза существа отражают холодный голод, пока оно [activity.Custom('GetAnimalSoundParticiple')], шевеля лапами."

 gh_hunt.1003.giant_reptile: "Местность ([host.GetCurrentLocation.Custom('GetTerrainType')]) погружается в зловещую тишину, пока мы продвигаемся вперёд; единственный звук — шуршание листьев под ногами. Низкий, рокочущий [activity.Custom('GetAnimalSound')] разносится среди деревьев, и мы замираем. Из густой листвы поворачивается массивная голова [activity.Custom('GetAnimalType')|G], чья чешуя блестит от влаги влажного воздуха. Глаза монстра с щелевидными зрачками встречаются с моими, и его раздвоенный язык мелькает, пробуя воздух. Его тело смещается, являя исполинские размеры, пока оно обвивает дерево, а хвост волочится по подлеску со звуком рвущейся ткани."

 gh_hunt.1003.elemental: "Воздух тяжелеет, и слабое мерцание искажает пространство передо мной. Начинает неестественно закручиваться порыв ветра, сгущаясь в неопределённую фигуру из клубящегося тумана и трескучей энергии. Его форма колеблется, не будучи ни полностью твёрдой, ни целиком эфирной, и низкий гул отдаётся в моих ушах, пока оно подплывает ближе, пронзая дымку светящимися глазами."

 gh_hunt.1003.draconic: "Глубокий, рокочущий [activity.Custom('GetAnimalSound')] разносится по каверне, и я замираю, когда [activity.Custom('GetAnimalType')] появляется из тени. Её чешуя отливает [activity.Custom('GetAnimalColor')|?цвет], а массивные wings разворачиваются со звуком рвущейся ткани. [activity.Custom('GetAnimalType')] устремляет на нас взгляд, и её губы кривятся, обнажая ряды кинжаловидных зубов. Воздух густеет от запаха серы, когда она делает вдох, готовясь изрыгнуть своё огненное дыхание."

 gh_hunt.1003.lymrill: "Подлесок шуршит, и [activity.Custom('GetAnimalType')] выходит на свет, а её металлический мех поблёскивает в лучах солнца, пробивающихся сквозь кроны. Её иглы встают дыбом — каждая достаточно остра, чтобы пробить камень, — а бусинки глаз фиксируются на мне с расчётливым прищуром. [activity.Custom('GetAnimalType')] стучит когтями по земле, описывая круги, и её движения нарочиты и пугающе точны, словно хищник оценивает свою добычу."

 gh_hunt.1003.kursha: "Пронзительный [activity.Custom('GetAnimalSound')] прорезает воздух, и я оборачиваюсь как раз вовремя, чтобы увидеть, как [activity.Custom('GetAnimalType')] пикирует со скал над нами. Её кожаные крылья бешено бьются, поднимая порывы ветра, что проносятся по каньону. Её когти блестят, словно полированная сталь. Она замирает на мгновение в воздухе, уставившись на нас своими светящимися глазами."

 gh_hunt.1003.spriggan: "По мере нашего продвижения лес становится всё гуще, а деревья вокруг завязываются в узлы. Низкий, скрипучий стон разносится по чаще. Источник звука прямо перед нами.\n\n[activity.Custom('GetAnimalType')].\n\nЕё тело медленно кренится, с хрустом вырастая прямо из земли. Воздух тяжелеет от запаха сырой земли и гнили, пока она движется в нарочитой и пугающей тишине."

 gh_hunt.1003.ground_dweller: "Один из моих людей забирает моё копьё и протягивает мне ручной топор. Кивнув, я пригибаюсь и ступаю в нору. Она настолько мала, что мне приходится сильно нагибаться, чтобы продвигаться вперёд, превозмогая ужасный смрад. Позади меня закатывают факел, мгновенно освещая пространство.\n\nПеред нами предстаёт зверь: он сидит скорчившись, а его кожа настолько бледная, что сквозь неё видны пульсирующие вены. Всё его тело покрыто опухолями, а кожа шелушится и облезает, но когда он оборачивается и воет на меня, я с изумлением замечаю...\n\nчеловеческое лицо.\n\nЯ бы принял его за поражённого чумой человека, если бы не искривлённые конечности, светящиеся глаза и странные заострённые уши по обеим сторонам головы."

 gh_hunt.1004.desc: "Несмотря на все наши усилия, мы умудрились упустить каждую возможность подобраться ближе к [activity.Custom('GetAnimalType')|I] или её логову. Местная растительность ([host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]) оказалась практически непроходимой, а след монстра — несуществующим. У нас не остаётся иного выбора, кроме как свернуть поиски."

 hunt.9001.monster_hunt: "Убийство тварей не обязательно должно быть безрадостным делом, и я могу лишь надеяться, что вскоре снова смогу насладиться погоней."
 hunt.9001.opening_monster_hunt_master: " мастерски собирая трофеи с туши."
 hunt.9001.opening_monster_hunt_skilled: " ловко собирая трофеи с точностью и скоростью."
 hunt.9001.opening_monster_hunt_beginner: "осторожно собирая трофеи с туши под руководством более опытных убийц чудовищ."
 hunt.9001.opening_monster_hunt_novice: "неуклюже пытаясь собрать трофеи с туши, прежде чем уступить место более опытным убийцам чудовищ."
 hunt.9001.spoils_monster_hunt: "\n\nМестные земли ([host.GetCurrentLocation.Custom('GetTerrainTypePlural')]) уже кажутся безопаснее, когда за каждой рощей ([host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]) больше не таится страх перед [activity.Custom('GetAnimalPlural')|X]."

 travel_start_event.1070.desc_hunt_outro_monster_hunt: "\n\nИстребление великих и ужасных тварей — достойное начинание, и я готов его начать."
 travel_start_event.1070.desc_my_hunt_outro_monster_hunt: "\n\nОстальные скоро увидят, из какого теста слеплен настоящий охотник."

 hunt_opening_court_adventurer: "[hunt_participant.GetTitledFirstName], [host.GetShortUINamePossessiveNoFormat] [ROOT.Char.Custom('GetHuntMasterDesc')], созывает отряд вместе, когда свет достигает"
 hunt_opening_monster_hunt_sighting: "\n\nБудем надеяться, что донесениям можно верить."
 hunt_opening_monster_hunt: "Скоро останемся только мы и наша добыча."
 hunt_opening_entourage_few_monster_hunt: "\n\nНемногие вызвавшиеся добровольцы уже наготове со сворой собак и успели подыскать подходящий маршрут."
 hunt_opening_entourage_normal_monster_hunt: "\n\nСобралась горстка искателей приключений и опытных местных охотников ([ROOT.Char.Custom('GetRegionalSlayerNamePlural')]), а также был разбит отлично обустроенный базовый лагерь."
 hunt_opening_entourage_many_monster_hunt: "\n\nДля выслеживания и помощи в загоне нашего врага организовались несколько отрядов искателей приключений и щедро вознаграждённых местных егерей ([ROOT.Char.Custom('GetRegionalSlayerNamePlural')]), которые уже начали вооружаться против множества потенциальных угроз."

 grizzled_perk_discount_desc: "[GetPerk('grizzled_perk').GetName(GetPlayer)] [perk]"