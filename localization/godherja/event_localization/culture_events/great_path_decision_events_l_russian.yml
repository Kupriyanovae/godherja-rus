l_russian:
 culture_decision_great_calling_events.0001.t:0 "[great_callings|E]"
 culture_decision_great_calling_events.0001.start:0 "Великие призвания — это неизменные пути, которые каждый человек выбирает по достижении шестнадцати лет."
 culture_decision_great_calling_events.0001.desc.generic:0 "Обычно человек сам выбирает своё призвание, но зачастую слушателей поощряют следовать тому, в чём они наиболее искусны, или же идти по стопам своих родителей."
 culture_decision_great_calling_events.0001.desc.end:0 "Прапатаро признают три Призвания.\n\nПризвание Возделывателей — выбор лесных фермеров, строителей и собирателей.\n\nПризвание Воинов — выбор храбрецов, склонных к военному делу мужей и искателей славы.\n\nПризвание Мыслителей — выбор мудрецов, правителей, ремесленников и дипломатов.\n\nОдно из этих Призваний взывает ко мне сильнее прочих..."
 culture_decision_great_calling_events.0001.cultivator:0 "Призвание Возделывателей приведёт меня к процветанию!"
 culture_decision_great_calling_events.0001.warrior:0 "Призвание Воинов приведёт меня к силе!"
 culture_decision_great_calling_events.0001.thinker:0 "Призвание Мыслителей приведёт меня к мудрости!"
