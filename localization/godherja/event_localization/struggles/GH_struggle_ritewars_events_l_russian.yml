l_russian:
 ritewars_struggle.1002.t:0 "Достижения [xenophilic_culture.GetNameNoTooltip]"

 ritewars_struggle.1002.desc:0 "[xenophilic_culture.GetNameNoTooltip] [Concept('magi','маги')|E] издавна посвятили себя изучению [Concept('magic','магии')|E] и широко известны своим мастерством в этом искусстве. Теперь [mixed_magi|E] [great_physician.GetFirstName] стремится присоединиться к моему двору, но [Select_CString(great_physician.IsFemale, 'она была недавно изгнана', 'он был недавно изгнан' )] из двора моего [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] [neighboring_ruler.GetTitledFirstNamePossessive] за неразглашенный проступок. \n\n"

 ritewars_struggle.1002.desc_albucasis:0 "«Пусть мои навыки и скромны, — говорит он, — но однажды я спас жизнь своему сюзерену, используя лишь силу грёз. Я мог бы помочь вам, расстраивая козни врагов как внутри, так и снаружи...» \n\n"

 ritewars_struggle.1002.desc_avenzoar:0 "«Я заглянул по ту сторону тумана, — говорит он, — и написал книгу о своих видениях грядущего. Но я — поклявшийся враг суеверий и лживых обещаний, которыми торгуют ведьмы и астрологи, поэтому я прошу вас запретить подобные вещи...» \n\n"

 ritewars_struggle.1002.desc_tufail:0 "«Я изучаю [Concept('the_fog','Туман')|E], а также тварей, что выходят из него, — говорит [great_physician.GetFirstName]. — Я верю, что необходимы дальнейшие исследования, дабы иметь хоть малейший шанс остановить его распространение... Не могли бы вы предоставить мне возможности для этого?» \n\n"

 ritewars_struggle.1002.desc_no_historical_physician_early:0 "«Я многому [Select_CString(great_physician.IsFemale, 'научилась', 'научился' )], — говорит [great_physician.GetFirstName], — из трудов Древних. И всё же я [Select_CString(great_physician.IsFemale, 'спасла', 'спас' )] их знания из бездны многословия и могу использовать их к вашей выгоде». \n\n"

 ritewars_struggle.1002.desc_no_historical_physician_late:0 "«Я многому [Select_CString(great_physician.IsFemale, 'научилась', 'научился' )], — говорит [great_physician.GetFirstName], — из трудов Драгоса „Змееуста“ и Ярогга „Вороньего Глаза“. И всё же я [Select_CString(great_physician.IsFemale, 'улучшила', 'улучшил' )] их методы. Я могу повелевать туманами по своей воле и творить такую магию, какую вы ещё никогда не видели». \n\n"

 ritewars_struggle.1002.desc_has_physician_and_is_christian:0 "Мой нынешний придворный маг, [scoped_physician.GetTitledFirstName], призывает меня не заменять [Select_CString(scoped_physician.IsFemale, 'её', 'его' )] этим язычником."

 ritewars_struggle.1002.desc_has_physician_but_not_christian:0 "Мой нынешний придворный маг, [scoped_physician.GetTitledFirstName], призывает меня не заменять [Select_CString(scoped_physician.IsFemale, 'её', 'его' )] этим чудаком."

 ritewars_struggle.1002.desc_has_no_physician_but_is_christian:0 "Некоторые придворные призывают меня не связываться с этим язычником."

 ritewars_struggle.1002.desc_has_no_physician:0 "Стоит ли мне предложить этому [great_physician.GetWomanMan] место при моём дворе?"

 ritewars_struggle.1002.a:0 "Мне бы не помешал новый маг..."
 #ritewars_struggle.1002.b:1 "Я могу купить книги и [Select_CString(ROOT.Char.IsFemale, 'самостоятельно обучиться', 'самостоятельно обучиться' )] медицине."
 #ritewars_struggle.1002.b.tt:0 "Вы пытаетесь учиться по великим трудам о медицине."
 #ritewars_struggle.1002.c:0 "Зачем вы мне? Я и [Select_CString(ROOT.Char.IsFemale, 'сама могу читать', 'сам могу читать' )] по-гречески."
 #ritewars_struggle.1002.c.tt:1 "Вы покупаете труды Галена и пытаетесь их читать."
 ritewars_struggle.1002.d:0 "Я отправлю вас обратно к [neighboring_ruler.GetTitledFirstNameNoTooltip]... в цепях."
 #ritewars_struggle.1002.e:0 "С моим здоровьем и так всё в порядке, спасибо."
 #ritewars_struggle.1002.f:0 "Ступай прочь, новшества должны исходить только от Бога."
 ritewars_struggle.1002.physicianleaves:0 "[great_physician.GetFirstName] ищет работу в другом месте"