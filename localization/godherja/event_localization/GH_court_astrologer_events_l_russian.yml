l_russian:

 tirga_tissit_divination_decision: "Вопросить Тирга Тиссит"
 tirga_tissit_divination_decision_tooltip: "Что скрывает Паук?"
 tirga_tissit_divination_decision_desc: "Узнайте, какие тайны сокрыты в ритуале [Glossary('Тирга Тиссит','tirga_tissit_glossary_desc')]."
 tirga_tissit_divination_decision_confirm: "Приготовьте верблюда."
 tirga_tissit_divination_decision_tt: "Вы можете получить [GetModifier('gh_divination_love_modifier').GetNameWithTooltip], [GetModifier('gh_divination_war_modifier').GetNameWithTooltip], [GetModifier('gh_divination_life_modifier').GetNameWithTooltip] или [GetModifier('gh_divination_spider_modifier').GetNameWithTooltip] на #high 5#! лет."
 tirga_tissit_divination_decision_tt_spiritual: "Вы можете получить [GetModifier('gh_divination_love_spiritual_modifier').GetNameWithTooltip], [GetModifier('gh_divination_war_spiritual_modifier').GetNameWithTooltip], [GetModifier('gh_divination_life_spiritual_modifier').GetNameWithTooltip] или [GetModifier('gh_divination_spider_spiritual_modifier').GetNameWithTooltip] на #high 5#! лет."

 gh_court_astrologer_events.0001.t: "$tirga_tissit_divination_decision$"
 gh_court_astrologer_events.0001.desc: "Я слежу взглядом за [astrologer.GetFirstName], [Select_CString(astrologer.IsFemale, 'пока она', 'пока он')] перерезает горло жертвенному верблюду, наполняя кровью большое блюдо. [Select_CString(astrologer.IsFemale, 'Её', 'Его')] губы едва шевелятся, [Select_CString(astrologer.IsFemale, 'она', 'он')] произносит заклинания, держа над чашей паука, внушающего страх.\n\nВнезапно [Select_CString(astrologer.IsFemale, 'она', 'он')] полностью погружает паука в верблюжью кровь и так же быстро помещает его на сухую песчаную шкуру жертвы. Паук пускается бежать, его кровавые следы исчезают в песке, а [astrologer.GetFirstName] и [Select_CString(astrologer.IsFemale, 'её', 'его')] помощники толкуют оставленный узор."
 gh_court_astrologer_events.0001.a: "Поведай мне о любви."
 gh_court_astrologer_events.0001.a.success: "Вас будет окружать любовь"
 gh_court_astrologer_events.0001.a.success.tt: "Вы стараетесь не проронить слезу"
 gh_court_astrologer_events.0001.a.failure: "Тот, Кто Был, безмолвствует."
 gh_court_astrologer_events.0001.b: "Поведай мне о войне."
 gh_court_astrologer_events.0001.b.success: "Вы одержите победу в каждой битве"
 gh_court_astrologer_events.0001.c: "Поведай мне о жизни."
 gh_court_astrologer_events.0001.c.success: "Вас ждёт процветающая жизнь"
 gh_court_astrologer_events.0001.d: "Сейчас не время."
 gh_court_astrologer_events.0001.e: "Поведай мне о законах."
 gh_court_astrologer_events.0001.e.success: "Вы будете вершить справедливый суд"

 gh_divination_love_modifier: "Любимец Паутины"
 gh_divination_love_modifier_desc: "Паук предрёк тёплую любовь этому персонажу."
 gh_divination_war_modifier: "Воин Паутины"
 gh_divination_war_modifier_desc: "Паук предрёк этому персонажу победоносную битву."
 gh_divination_life_modifier: "Благословенный Паутиной"
 gh_divination_life_modifier_desc: "Паук предрёк этому персонажу долгую жизнь."
 gh_divination_spider_modifier: "Судимый Паутиной"
 gh_divination_spider_modifier_desc: "Паук предрёк этому персонажу мудрое правление."
 gh_divination_love_spiritual_modifier: "$gh_divination_love_modifier$"
 gh_divination_love_spiritual_modifier_desc: "$gh_divination_love_modifier_desc$\n#weak Этот модификатор сильнее благодаря духовному [ethos|E1]#!"
 gh_divination_war_spiritual_modifier: "$gh_divination_war_modifier$"
 gh_divination_war_spiritual_modifier_desc: "$gh_divination_war_modifier_desc$\n#weak Этот модификатор сильнее благодаря духовному [ethos|E1]#!"
 gh_divination_life_spiritual_modifier: "$gh_divination_life_modifier$"
 gh_divination_life_spiritual_modifier_desc: "$gh_divination_life_modifier_desc$\n#weak Этот модификатор сильнее благодаря духовному [ethos|E1]#!"
 gh_divination_spider_spiritual_modifier: "$gh_divination_spider_modifier$"
 gh_divination_spider_spiritual_modifier_desc: "$gh_divination_spider_modifier_desc$\n#weak Этот модификатор сильнее благодаря духовному [ethos|E1]#!"

 gh_decision_fertility_tirga_tissit: "Созвать собрание Тирга Тиссит"
 gh_decision_fertility_tirga_tissit_tooltip: "Призовите своего [GetCourtPositionType('court_astrologer_court_position').GetName()], чтобы с помощью тайн [Glossary('Тирга Тиссит','tirga_tissit_glossary_desc')] увеличить [Concept('county_fertility','плодородия')|E] в графстве."
 gh_decision_fertility_tirga_tissit_desc: "О, [ROOT.Char.GetFaith.FertilityGodName], благослови наши земли своим изобилием. Пусть мы вспомним знания наших предков, чтобы наши стада процветали."
 gh_decision_fertility_tirga_tissit_confirm: "Наши стада процветут!"
 gh_decision_fertility_tirga_tissit_effects_tt: "Ваш [GetCourtPositionType('court_astrologer_court_position').GetName()] и другие судьи проведут [Glossary('Тирга Тиссит','tirga_tissit_glossary_desc')], чтобы оценить, что необходимо сделать для засушливых земель [fertility_county.GetName], даруя бонусы к [Concept('county_fertility', 'плодородию')|E] графства."
 gh_decision_fertility_tirga_tissit_bonus_tt: "Результаты собрания Тирга Тиссит зависят от [county_fertility|E1] графства [fertility_county.GetNameNoTier], вашего навыка [Concept('arcana','арканы')|E] и навыка [Concept('arcana','арканы')|E] вашего [GetCourtPositionType('court_astrologer_court_position').GetName()]."

 gh_fertility_tirga_tissit_county_modifier: "Собрание Тирга Тиссит о плодородии"
 gh_fertility_tirga_tissit_county_modifier_desc: "В этом графстве совет судей провёл [Glossary('Тирга Тиссит','tirga_tissit_glossary_desc')] и поделился знаниями скотоводов."

 gh_court_astrologer_events.0300.t: "Собрание Тирга Тиссит о плодородии"
 gh_court_astrologer_events.0300.desc: "[shaman.GetTitledFirstName] нараспев читает стихи, перерезая горло жертвенному верблюду; двое помощников держат наготове большую чашу. Пение становится громче, когда [Select_CString(shaman.IsFemale, 'она', 'он')] достаёт огромного паука, а толпа замирает в ожидании.\n\n«Пусть Тот, Кто Был, напомнит нам об утраченных знаниях и обретённых тайнах. Пусть Паук поведёт нас сквозь паутину сомнений», — говорит [Select_CString(shaman.IsFemale, 'она', 'он')], погружая паука в кровь, а затем так же быстро кладёт его на шкуру верблюда. Паук уносится прочь, а [shaman.GetNameNoTooltip] и множество судей изучают оставленные следы."
 gh_court_astrologer_events.0300.tt: "Собрание в [fertility_county.GetName] началось."
 gh_court_astrologer_events.0300.a: "Какие тайны скрывает паук?"
 gh_court_astrologer_events.0300.b: "Я присоединюсь к [shaman.GetNameNoTooltip] в [Select_CString(shaman.IsFemale, 'её', 'его')] размышлениях."

