 ep3_laamp_flavour_ewan.1031.desc.purpose.beast_hunters: "опытные охотники, просвещенные арканисты и отважные искатели острых ощущений"

 ep3_laamp_flavour_ewan.0051.desc.purpose.beast_hunters.1: "и желание находить красивых и экзотических тварей, чтобы убивать их,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.beast_hunters.2: "и ошеломляющие описания всё более причудливых чудовищ,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.beast_hunters.3: "и обмен небылицами, а также трофеями, добытыми с разных существ,"

 ep3_laamp_flavour_ewan.1031.i: "Ах, сколько всего [child.GetSheHe] еще сразит!"

 ep3_laamp_flavour_ewan.0041.desc.deadlands: "«Вокруг нас лишь бескрайние просторы смерти, и мы даже не можем пополнить запасы, чтобы хоть какое разнообразие в еде было!»"
 ep3_laamp_flavour_ewan.0041.desc.underworld_expanse: "In this endless expanse of echoing darkness, we are unable to even"
 ep3_laamp_flavour_ewan.0041.desc.mayik_caverns: "«В этих темных и душных пещерах мы даже не можем пополнить запасы, чтобы хоть какое разнообразие в еде было!»"
 ep3_laamp_flavour_ewan.0041.desc.mayik_corridors: "«В этих темных и душных пещерах мы даже не можем пополнить запасы, чтобы хоть какое разнообразие в еде было!»"
 ep3_laamp_flavour_ewan.0041.desc.mayik_chamber: "«В этих темных и душных пещерах мы even не можем пополнить запасы, чтобы хоть какое разнообразие в еде было!»"
 ep3_laamp_flavour_ewan.0041.desc.redlands_chasms: "«Мы затерялись в этой ужасной багровой пустоши, слишком далеко от каких-либо мест, чтобы хотя бы пополнить запасы, чтобы хоть какое разнообразие в еде было!»"
 ep3_laamp_flavour_ewan.0041.desc.redlands_desert: "«Мы по локоть увязли в этой дыре, а не пустыне, ни одного поселения в поле зрения, и мы настолько обнищали, что даже не можем пополнить запасы, чтобы хоть какое разнообразие в еде было!»"
 ep3_laamp_flavour_ewan.0041.desc.redlands_mountains: "«Нас занесло на полпути к самому небу, в глотках пересохло, и мы даже не можем попытаться пополнить запасы, чтобы хоть какое разнообразие в еде было!»"
 ep3_laamp_flavour_ewan.0041.desc.redlands_drylands: "«Нас изгнали в этот пыльный ад, слишком далеко от любых мало-мальски важных мест, чтобы мы могли хотя бы пополнить запасы, чтобы хоть какое разнообразие в еде было!»"
 ep3_laamp_flavour_ewan.0041.desc.archipelagic: "«Мы застряли на этой богом забытой скале и даже не можем пополнить запасы, чтобы хоть какое разнообразие в еде было!»"
 ep3_laamp_flavour_ewan.0041.desc.provisions.wasteland: "\n\nЯ оглядываюсь по сторонам и вижу лишь почти бесконечные просторы безмолвных руин и мертвых полей, простирающиеся во всех направлениях."
 ep3_laamp_flavour_ewan.0041.desc.provisions.fog: "\n\nЯ оглядываюсь по сторонам, всматриваясь в постоянно меняющийся [Concept('fog','Туман')|E] вокруг нас, где краем глаза улавливаю то появляющиеся, то исчезающие силуэты."