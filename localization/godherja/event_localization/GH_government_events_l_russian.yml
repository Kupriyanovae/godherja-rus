l_russian:

gh_realm_maintenance.0036.t: "Республиканские ценности"
 gh_realm_maintenance.0036.desc: "Чтобы сохранить стабильность в нашей державе и не дать простонародью слишком много власти, нам необходимо установить форму позитивного наследования. Какую форму нам следует принять?"
 gh_realm_maintenance.0036.a: "Наше богатство направит нас."
 gh_realm_maintenance.0036.b: "Нам не стоит менять слишком многое..."
 gh_realm_maintenance.0036.c: "Кровь есть кровь, и она поведет нас в будущее."
 gh_realm_maintenance.0036.d: "Конечно же, наша армия сможет и направлять нас, и защищать."

 gh_realm_maintenance.0037.t: "Республика сокрушена"
 gh_realm_maintenance.0037.desc: "Там, где когда-то царили закон и порядок, теперь осталось лишь варварство. Революция уничтожила Республику, и нашей семье здесь больше нет места, но, возможно, мы сможем заглянуть за пределы наших бывших земель и найти новый дом."
 gh_realm_maintenance.0037.a: "Вам никогда не взять [ROOT.Char.GetLocation.GetName]!"
 gh_realm_maintenance.0037.b: "Я [Select_CString(ROOT.Char.IsFemale, 'слышала', 'слышал' )], что [new_liege.GetPrimaryTitle.GetName] прекрасен в это время года..."
 gh_realm_maintenance.0037.c: "Я всегда [Select_CString(ROOT.Char.IsFemale, 'считала', 'считал' )], что [new_liege.GetPrimaryTitle.GetName] — это славное место..."
 gh_realm_maintenance.0037.d: "Возможно, мы могли бы влиться в общество державы [new_liege.GetPrimaryTitle.GetName]?"
 gh_realm_maintenance.0037.e: "Быть может, там, за горизонтом, нас ждет нечто большее?"

 gh_realm_maintenance.0038.t: "Республика сокрушена"
 gh_realm_maintenance.0038.desc: "Титул [ROOT.Char.GetPrimaryTitle.GetName] традиционно считался республикой, но недавние события заставили нас усомниться в столь давних традициях."
 gh_realm_maintenance.0038.a: "Старые порядки мертвы, настало время для новой эпохи!"
 gh_realm_maintenance.0038.b: "Ничто не сможет поколебать ценности нашего народа!"