l_russian:
 
 gh_war_event.4000.t:0 "Масштабное вторжение"
 gh_war_event.4000.desc:0 "Чужеземный правитель, [attacker.GetUIName], [Select_CString(attacker.IsFemale, 'собрала', 'собрал' )] огромное войско и [Select_CString(attacker.IsFemale, 'объявила', 'объявил' )] о своём намерении вторгнуться в наши земли. Грядущая [Concept('war', 'война')|E], несомненно, будет разрушительной, и потому [defender.GetUIName] [Select_CString(defender.IsFemale, 'попросила', 'попросил' )] у вас дополнительные войска, чтобы противостоять этой угрозе."
 gh_war_event.4000.a:0 "К оружию!"
 gh_war_event.4000.b:0 "Обязывает ли меня к этому договор?"
 
 gh_war_event.4002.t:0 "Объединительные войны Марки"
 gh_war_event.4002.desc:0 "После исчезновения верховного короля его дети оспаривают право на [Concept('chevalie', 'Шевалье')|E]. Сегодня начинается очередная [Concept('war', 'война')|E] в этой долгой усобице: [attacker.GetUIName] [Select_CString(attacker.IsFemale, 'объявила', 'объявил' )] войну персонажу [defender.GetUIName] за свою долю империи."
 gh_war_event.4002.a:0 "Надеюсь, эта семейная усобица скоро разрешится."

 gh_war_event.4003.t:0 "Успешное объединение Марки"
 gh_war_event.4003.desc:0 "Вопреки сомнениям скептиков, [attacker.GetUIName] [Select_CString(attacker.IsFemale, 'одержала победу', 'одержал победу' )] над персонажем [defender.GetUIName] в борьбе за воссоединение [Concept('chevalie', 'Шевалье')|E]. [attacker.GetShortUIName] [Select_CString(attacker.IsFemale, 'отобрала', 'отобрал' )] королевство у персонажа [defender.GetFirstName] и [Select_CString(attacker.IsFemale, 'заставила', 'заставил' )] [Select_CString(defender.IsFemale, 'её', 'его' )] присягнуть на верность."
 gh_war_event.4003.a:0 "Мы будем следить за [Select_CString(attacker.IsFemale, 'её', 'его' )] успехами с большим интересом."

 gh_war_event.5001.t:0 "Падение Алого ордена"
 gh_war_event.5001.desc:0 "С Алыми Избранниками покончено. Тысячелетняя история и накопленные за века знания обращены в щебень и пепел под нашими сапогами. Мои воины вынесли из сводчатых залов всё ценное, а из уцелевших монахов одни были проданы в рабство, другие бежали в горы. Некогда величественные сооружения, возвышавшиеся над утёсами, уже рушатся. Лишь вопрос времени, когда от них не останется и следа."
 gh_war_event.5001.a:0 "Самое время попрощаться с этими руинами."
 sacked_vounill_war.notif_title:0 "Беда в Вуниле"
 sacked_vounill_war.notif_desc:0 "[attacker.GetName] [Select_CString(attacker.IsFemale, 'разграбила', 'разграбил' )] Вуниль и [Select_CString(attacker.IsFemale, 'превратила', 'превратил' )] его в руины."
