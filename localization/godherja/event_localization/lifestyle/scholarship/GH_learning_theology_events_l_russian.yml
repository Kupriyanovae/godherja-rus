l_russian:
 # GH: learning.3052 is a vanilla event, but we broke it up into intro-whatever-outro so it's in the GH files instead of the replace ones
 learning_theology.3052.desc.intro:0 "Наблюдая за ходом пьесы, я быстро понимаю, почему все считают [passion_playwright.GetName] гением литературы. Слова, игра — передо мной словно бы разворачиваются события, описанные в "
 learning_theology.3052.desc.generic:0 "[ROOT.Char.GetFaith.ReligiousText], я будто бы своими глазами вижу проявление деяний [ROOT.Char.GetFaith.CreatorNamePossessive]!"
 learning_theology.3052.desc.wardenite:0 "повести о злоключениях [Concept('the_first_warden','Первого Вардена')|E] — я словно бы сам созерцаю его блистательный ум и мудрость!"
 learning_theology.3052.desc.outro:0 "\n\nКогда пьеса заканчивается, я обнаруживаю, что [Select_CString(ROOT.Char.IsFemale, 'осталась наедине', 'остался наедине' )] с [passion_playwright.GetNameNoTooltip]."