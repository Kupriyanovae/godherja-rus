l_russian:
 gh_martial_redlander.0001.t:0 "Новый слуга"
 gh_martial_redlander.0001.desc:0 "Я упражняюсь в рукопашном бою на тренировочной площадке у оружейной, когда один из моих верных послушников сообщает, что к владениям [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] приближается всадник. Отложив оружие, я направляюсь к главным воротам, чтобы оценить обстановку. Стоит мне подойти, как незнакомец спешивается со своего коня [great_commander.GetHerHis] и волочит за собой двух пленников.\n\n«Приветствую, [ROOT.GetCharacter.GetFirstName] [ROOT.GetCharacter.GetDynasty.GetName], моё имя — [great_commander.GetFirstName]. Я желаю помочь вам в походе по очистке этих земель от грязного отродья красноходов. В качестве дара и знака моей искренности я приношу вам эти два куска человеческого мусора. Делайте с ними всё, что пожелаете»."
 gh_martial_redlander.0001.a:0 "А-а-а... Свежее мясо..."
 gh_martial_redlander.0001.b:0 "Этот точно окажется полезен, я в этом [Select_CString(ROOT.Char.IsFemale, 'уверена', 'уверен' )]."