 # Added keys missing from the supplied Russian mod
 gh_learn_commander_trait.0001.a:0 "Тьма поглотит моих врагов."
 gh_learn_commander_trait.0001.desc:0 "В подземельях битвы опытных исследователей могут тянуться днями, но против новичков нередко решаются ещё до начала. Само столкновение длится недолго: мои солдаты просто обманывают неприятеля, заманивают в ловушки и рассеивают.\n\nСпустя всего несколько часов пещеры затихают. Враги забрели в тоннели, из которых им не найти выхода. Их истощённые останки могут обнаруживать ещё многие годы... если вообще обнаружат."
 gh_learn_commander_trait.0001.t:0 "Клинки во тьме"
 gh_learn_commander_trait.01.t:0 "Тактика подземных земель"
