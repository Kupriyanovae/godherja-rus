 #Random Trait Acquisition Events
 #Become an Underworld Commander
 gh_learn_commander_trait.0001.t: "Blades in the Dark"
 gh_learn_commander_trait.0001.desc: "Underground battles can last for days between experienced cavers or be decided before they even begin otherwise. The actual battle is short, for against an inexperienced foe my forces can simply trick, bait and scatter.\n\nAfter only a few hours there is silence in the caverns, the enemy having been led astray down caverns they will never find their way out of. Their starved remains may be discovered for years to come... if they're found at all."
 gh_learn_commander_trait.0001.a: "The darkness consumes my enemies."

#Jungle Stalker
 gh_learn_commander_trait.01.t: "Tactics of the Land Down Under"
