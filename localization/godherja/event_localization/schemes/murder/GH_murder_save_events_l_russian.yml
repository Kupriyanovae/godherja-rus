l_russian:
 GH_murder_save.0002.t:0 "$murder_save_header$ Спасенный Даром"
 GH_murder_save.0002.desc:0 "Мое покушение на жизнь [target.GetTitledFirstNamePossessive] сорвалось!\n\nХотя мой план был выполнен до единой буквы, я не [Select_CString(murderer.IsFemale, 'учла', 'учел' )] [target.GetHerHis] познаний в [Concept('magic','магических искусствах')|E] — похоже, какое-то паршивое заклинание спасло [target.GetHerHim] жизнь."
 
 GH_murder_save.0003.t:0 "Спасенный Даром"
 GH_murder_save.0003.poisoned_duck:0 "Я наслаждаюсь уткой на своем пиру, как вдруг чувствую, что мое горло отекает, а конечности наливаются тяжестью. Понимая, к чему всё идет, я начинаю творить заклинание #underline [spell_being_casted.Custom('SpellName')]#!; мне удается завершить чары в самый последний момент, ведь под конец я едва способна шевелить губами. К счастью, [Concept('magic','магия')|E] делает свое дело, и я чувствую, как хватка яда начинает ослабевать."
 GH_murder_save.0003.creepy_crawly_end:0 "Поначалу я едва ощущаю, как [SCOPE.Custom('VenomousCreatureAttack')], но вскоре по всему моему телу разливается жгучая боль. Я сосредотачиваю всю свою ментальную [Concept('might','силу')|E], чтобы не поддаться панике и как следует сотворить заклинание #underline [spell_being_casted.Custom('SpellName')]#!. Хотя следующие несколько часов я чувствую себя совершенно паршиво, чары в конечном итоге спасают мне жизнь."
 GH_murder_save.0003.poisoned_drink:0 "Сразу заподозрив неладное и почуяв яд, я начинаю творить заклинание #underline [spell_being_casted.Custom('SpellName')]#!; мне удается завершить чары в самый последний момент, ведь под конец я едва способна выдавить из себя хоть слово. К счастью, [Concept('magic','магия')|E] делает свое дело, и мое горло медленно начинает расслабляться."