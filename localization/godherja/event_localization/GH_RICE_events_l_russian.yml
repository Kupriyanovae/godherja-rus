 # Memories
 RICE_tuareg_dream_incubation_host_memory: "[Select_CString(owner.IsFemale, 'провела', 'провел' )] ритуал [GetActivityType( 'activity_RICE_tuareg_dream_incubation' ).GetName]"
 RICE_tuareg_dream_incubation_host_memory_first_perspective: "Я [Select_CString(ROOT.Char.IsFemale, 'провела', 'провел' )] ритуал [GetActivityType( 'activity_RICE_tuareg_dream_incubation' ).GetName]"
 RICE_tuareg_dream_incubation_host_memory_second_perspective: "вы [Select_CString(ROOT.Char.IsFemale, 'провели', 'провел' )] ритуал [GetActivityType( 'activity_RICE_tuareg_dream_incubation' ).GetName]"
 RICE_tuareg_dream_incubation_host_memory_third_perspective: "[owner.GetName] [Select_CString(owner.IsFemale, 'провела', 'провел' )] ритуал [GetActivityType( 'activity_RICE_tuareg_dream_incubation' ).GetName]"

 # Activities
 activity_RICE_tuareg_dream_incubation_host_an_a: "$host_activity_a$"
 activity_RICE_tuareg_dream_incubation: "Инкубация сновидений"
 activity_RICE_tuareg_dream_incubation_desc: "Перед принятием важных решений у нас есть древний обычай посещать гробницы тех, кто нам дорог, чтобы вознести [GetPlayer.GetFaith.GetAdjective] молитвы и заснуть там. Сны, которые духи ниспосылают нам, пока мы спим у этих древних могил, даруют нам прозрение, необходимое для принятия верных решений!"
 activity_RICE_tuareg_dream_incubation_selection_tooltip: "Отправьтесь к гробнице, чтобы переночевать там и обрести прозрение.\n\n$activity_RICE_tuareg_dream_incubation_context_tooltip$"
 activity_RICE_tuareg_dream_incubation_host_desc: "\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[piety_i] [piety|E]\n$BULLET_WITH_TAB$#V [GetPlayer.MakeScope.ScriptValue('RICE_tuareg_dream_chance_value')]%#! шанс получить случайный #P полезный#! [Concept('character_modifier','модификатор')|E] в зависимости от ваших [Concept('sins','грехов')|E], [Concept('virtues','добродетелей')|E], [Concept('traits','свойств')|E], [Concept('learning','учености')|E] и [Concept('piety_level','уровеня благочестия')|E]"
 activity_RICE_tuareg_dream_incubation_guest_desc: "$activity_RICE_tuareg_dream_incubation_host_desc$"
 activity_RICE_tuareg_dream_incubation_province_desc: "Здесь есть гробница, которую мы могли бы посетить!"
 activity_RICE_tuareg_dream_incubation_destination_selection: "[GetPlayer.GetFaith.PriestNeuterPlural] говорят, что по этим землям разбросано множество древних гробниц."
 activity_RICE_tuareg_dream_incubation_guest_help_text: "$activity_RICE_tuareg_dream_incubation$"
 activity_RICE_tuareg_dream_incubation_predicted_cost: "Стоимость проведения ритуала инкубации сновидений зависит от выбранных вами [Concept( 'activity_options', 'параметов занятий' )|E]."
 activity_RICE_tuareg_dream_incubation_conclusion_desc: "Я [Select_CString(ROOT.Char.IsFemale, 'проспала', 'проспал' )] у гробницы. Ритуал [GetActivityType( 'activity_RICE_tuareg_dream_incubation' ).GetName] завершён!"

 RICE_tuareg_dream_incubation_type_personal: "Личные прозрения"
 RICE_tuareg_dream_incubation_type_personal_desc: "$EFFECT_LIST_BULLET$ Вы будете искать прозрения и, возможно, получите #P полезный#! [Concept('character_modifier','модификатор')|E], связанный с личными делами, такими как ваши отношения, здоровье и образ жизни\n\n#weak Именно во снах, где мы не скованы законами реальности, мы можем лучше понять, кто мы есть как личности.#!"
 RICE_tuareg_dream_incubation_type_political: "Политические прозрения"
 RICE_tuareg_dream_incubation_type_political_desc: "$EFFECT_LIST_BULLET$ Вы будете искать прозрения и, возможно, получите #P полезный#! [Concept('character_modifier','модификатор')|E], связанный с политическими делами, такими как ваши вассалы, войны и ваша репутация\n\n#weak История рассказывает нам о бесчисленных правителях, которые пострадали от великих бедствий, потому что не вняли предупреждениям своих снов. Если духи хотят дать совет или предостеречь вас о внутренних и внешних угрозах, внимайте им внимательно!#!"
 RICE_tuareg_dream_incubation_type_communal: "Общественные прозрения"
 RICE_tuareg_dream_incubation_type_communal_desc: "$EFFECT_LIST_BULLET$ Вы будете искать прозрения и, возможно, получите #P полезный#! [character_modifier|E], связанный с вашим государством и тем, как лучше всего управлять его народом\n\n#weak Хороший правитель использует мудрость древних, будь то во снах или наяву, чтобы вести свой народ вперёд.#!"
 RICE_tuareg_dream_incubation_type_talfasomoll: "Тальфасомолл"
 RICE_tuareg_dream_incubation_type_talfasomoll_desc: "$EFFECT_LIST_BULLET$ Вас поместят в яму со скорпионами и прикажут читать молитву. Те, кто выживает в этом опасном обряде, удостаиваются похвалы и почитания, ибо они благословлены самой Неттат Йетцен.\n\n#weak Неттат Йетцен ведёт нас из жизни в смерть. Чтобы лучше понять наш путь, мы должны встретить его лицом к лицу через силу и молитву.#!"
 RICE_tuareg_dream_incubation_tomb_type: "Гробница"
 RICE_tuareg_dream_incubation_tomb_type_random: "Случайная известная"
 RICE_tuareg_dream_incubation_tomb_type_random_desc: "$EFFECT_LIST_BULLET$ Поспите у гробницы известного местного жителя.\n\n#weak Многие жили до нас. Что знают эти духи такого, чего не знаем мы?#!"
 RICE_tuareg_dream_incubation_tomb_type_ancestor: "Предок"
 RICE_tuareg_dream_incubation_tomb_type_ancestor_desc: "$EFFECT_LIST_BULLET$ Поспите у гробницы предка [dynasty|E1] [GetPlayer.GetDynasty.GetNameNoTooltip].\n$EFFECT_LIST_BULLET$ Получите [prestige_i] #V 50#! по завершении [Concept('activity','занятия')|E]\n$EFFECT_LIST_BULLET$ Увеличивает шанс увидеть сон на #V [EmptyScope.ScriptValue('RICE_tuareg_dream_location_holding_bonus_value')|0]%#!, и ещё на #V [EmptyScope.ScriptValue('RICE_tuareg_dream_location_holding_bonus_value')|0]%#!, если место проведения [Concept('activity','занятия')|E] находится в [Concept('city','города')|E]\n\n#weak Говорят, здесь покоится один из ваших очень далёких предков. Наверняка им есть что сообщить своим потомкам!#!"
 RICE_tuareg_dream_incubation_tomb_type_saint: "Местный святой"
 RICE_tuareg_dream_incubation_tomb_type_saint_desc: "$EFFECT_LIST_BULLET$ Поспите у гробницы святого [GetPlayer.GetFaith.GetAdjective] [GetPlayer.GetFaith.PriestNeuter].\n$EFFECT_LIST_BULLET$ Получите [piety_i] #V 50#! по завершении [Concept('activity','занятия')|E]\n$EFFECT_LIST_BULLET$ Увеличивает шанс увидеть сон на #V [EmptyScope.ScriptValue('RICE_tuareg_dream_location_holding_bonus_value')|0]%#!, и ещё на #V [EmptyScope.ScriptValue('RICE_tuareg_dream_location_holding_bonus_value')|0]%#!, если место проведения [Concept('activity','занятия')|E] находится в [Concept('church_holding','храме')|E]\n\n#weak Деяния и мудрость мудрецов могут вдохновлять живых даже после их смерти.#!"
 RICE_tuareg_dream_incubation_dream_phase: "Инкубация сновидений"
 RICE_tuareg_dream_incubation_dream_phase_desc: "Однажды во сне..."

 RICE_insight_understanding_header: "Понимание:"
 RICE_insight_understanding: "Понимание"
 RICE_insight_understanding_desc: "Вы искренне хотите найти возможные решения проблем, с которыми сталкиваетесь, через гадание во сне. Потеряйте [stress_loss_i] [stress|E1] по завершении [Concept('activity','занятия')|E]."
 RICE_ritual_intent_header: "Ритуалы:"
 RICE_ritual_intent: "Ритуал"
 RICE_ritual_intent_desc: "Верите ли вы, что это гадание во сне поможет или нет, вы хотите продемонстрировать чувство долга при проведении этой церемонии. Получите дополнительное [piety_i|E] [piety|E1] и [prestige_i|E] [prestige|E1] по завершении [Concept('activity','занятия')|E]."
 RICE_curiosity_intent_header: "Любопытство:"
 RICE_curiosity_intent: "Любопытство"
 RICE_curiosity_intent_desc: "Сны и загробная жизнь сами по себе увлекают вас больше, чем результаты гадания во сне. Получите [Concept('experience','опыт')|E] в вашем [Concept('lifestyle','образе жизни')|E]."

 RICE_tuareg_dream_incubation_completed_log_title: "Инкубация сновидений завершена"
 RICE_tuareg_dream_incubation_completed_log: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale, 'завершила', 'завершил' )] ритуал гадания во сне у гробницы"
 TRAVEL_NAME_FOR_activity_RICE_tuareg_dream_incubation: "$activity_RICE_tuareg_dream_incubation$ [Character.GetFirstNamePossessiveNoTooltip]"

 activity_RICE_tuareg_dream_incubation_wilderness_province_desc: "\n#P ++ Здесь, в дикой местности, вдали от цивилизации.#!\n\n#italic Это принесёт вам [prestige_i|E] #V 25#! и [piety_i|E] #V 25#! по завершении этого [Concept('activity','занятия')|E].#!"
 activity_RICE_tuareg_dream_incubation_temple_province_desc: "\n#P ++ Здесь находится известный [Concept('church_holding','храм')|E].#!\n\n#italic Это принесёт вам [piety_i|E] #V 50#! по завершении этого [Concept('activity','занятия')|E], и, если вы будете спать у гробницы #Bold местного святого#!, увеличит шанс увидеть сон на #V [EmptyScope.ScriptValue('RICE_tuareg_dream_location_holding_bonus_value')|0]%.#!"
 activity_RICE_tuareg_dream_incubation_city_province_desc: "\n#P ++ Здесь находится крупный [Concept('city','город')|E].#!\n\n#italic Это принесёт вам [prestige_i|E] #V 50#! по завершении этого [Concept('activity','занятия')|E], и, если вы будете спать у гробницы #Bold предка#!, увеличит шанс увидеть сон на #V [EmptyScope.ScriptValue('RICE_tuareg_dream_location_holding_bonus_value')|0]%.#!"
 RICE_tuareg_dream_ancestor_tomb_desc: "Путь к гробнице предка"
 RICE_tuareg_dream_saint_tomb_desc: "Путь к гробнице святого"
 MUST_BE_CORRECT_DESERT_INCUBATION_SEASON: "Должен быть сезон [steppe_season|E1] Шепчущих Ветров или Эфирных Ночей"

