 RICE_tuareg_dream_action_20: "почувствовал сильную ностальгию по... чему-то"
 RICE_tuareg_dream_action_21: "встретил кого-то из моего прошлого"
 RICE_tuareg_dream_action_22: "выпил успокаивающего чаю"
 RICE_tuareg_dream_action_23: "проиграл в какую-то игру"
 RICE_tuareg_dream_action_24: "переживал какое-то древнее историческое событие"
 RICE_tuareg_dream_action_25: "наткнулся на древний памятник в пустыне"
 RICE_tuareg_dream_action_26: "охотился на дикое животное"
 RICE_tuareg_dream_action_27: "избивал одного из своих рабов"
 RICE_tuareg_dream_action_28: "освободил одного из своих рабов"
 RICE_tuareg_dream_action_29: "купался в прохладной освежающей воде"
 RICE_tuareg_dream_action_30: "не мог понять иностранцев, говоривших на другом языке"
 RICE_tuareg_dream_action_31: "чувствовал себя таким напряжённым из-за всего в жизни"
 RICE_tuareg_dream_action_32: "пел песню, которой, я думаю, не знал в реальной жизни"
 RICE_tuareg_dream_action_33: "маршировал с могучей армией, полной сильных воинов"
 RICE_tuareg_dream_action_34: "отдыхал под деревом"
 RICE_tuareg_dream_action_35: "хлопал руками, пока не полетел, как птица"
 RICE_tuareg_dream_action_36: "увидел говорящего кота, который утверждал, что он отец моего слуги"
 RICE_tuareg_dream_action_37: "стал свидетелем рождения ребёнка"
 RICE_tuareg_dream_action_38: "ел очень-очень вкусную еду"
 RICE_tuareg_dream_action_39: "спорил со случайными незнакомцами о неважных, бесполезных вещах"
 RICE_tuareg_dream_action_40: "был перенесён [ROOT.Char.GetFaith.DevilName] в будущее, где [ROOT.Char.GetFaith.DevilHerHis] зло стало законом"
 RICE_tuareg_dream_action_41: "раскрыл несколько тайн, как детектив"
 RICE_tuareg_dream_action_42: "отдыхал, плавая в реке"
 RICE_tuareg_dream_action_43: "бросал камни в пруд"
 RICE_tuareg_dream_action_44: "превратился в птицу и улетел"
 RICE_tuareg_dream_action_45: "превратился в какого-то зверя"
 RICE_tuareg_dream_action_46: "танцевал среди звёзд, высоко в ночной тьме"
 RICE_tuareg_dream_action_47: "занимался развратными, эротическими делами"
 RICE_tuareg_dream_action_48: "занимался романтическими делами"
 RICE_tuareg_dream_action_49: "держал за руку кого-то довольно красивого"
 RICE_tuareg_dream_action_50: "странно, но видел сон во сне"

 GH_RICE_oasis_event.0010.t: "Приготовления"
 GH_RICE_oasis_event.0010.desc.intro: "Будучи [ROOT.Char.GetTitleAsNameNoTooltip], у меня много забот и обязанностей."
 GH_RICE_oasis_event.0010.desc.faith: "Среди тех, кто верит в [ROOT.Char.GetFaith.PantheonTerm] [ROOT.Char.GetFaith.GetAdjective],"
 GH_RICE_oasis_event.0010.desc.culture: "Среди [ROOT.Char.GetCulture.GetCollectiveNoun],"
 GH_RICE_oasis_event.0010.desc: "[Select_CString(ROOT.Char.IsFemale, 'не редкость искать', 'не редкость искать')] совета во снах у гробниц умерших или даже в ямах, полных смертоносных скорпионов. Веками [Select_CString(ROOT.Char.IsFemale, 'было нашей традицией', 'было нашей традицией')] спать в таких местах; говорят, что сны, которые мы видим там, даруют великое прозрение в дела мира.\n\nПосле долгих странствий я [Select_CString(ROOT.Char.IsFemale, 'прибыла', 'прибыл' )] в [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]."
 GH_RICE_oasis_event.0010.desc.notable: "Говорят, здесь похоронен один известный местный житель, живший давно."
 GH_RICE_oasis_event.0010.desc.ancestor: "Говорят, здесь похоронен один из моих далёких предков."
 GH_RICE_oasis_event.0010.desc.saint: "Говорят, здесь похоронен [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] святой."
 GH_RICE_oasis_event.0010.desc.personal: "\n\nВ последнее время меня тяготят личные дела. Надеюсь, сны, которые я увижу у этой гробницы, направят меня в верном направлении, когда дело коснётся моих личных забот."
 GH_RICE_oasis_event.0010.desc.political: "\n\nПолитические вопросы занимают мои мысли. Будь то враги и соперничающие фракции, мои подчинённые или кто-то ещё, я надеюсь, что сны у этой гробницы подскажут мне, как с ними осторожно обходиться."
 GH_RICE_oasis_event.0010.desc.communal: "\n\nБлагополучие общины волнует меня больше всего. Правильно ли я [Select_CString(ROOT.Char.IsFemale, 'поступаю', 'поступаю')] как их лидер? Или мне нужно изменить свой текущий курс? Я надеюсь, что сны у этой гробницы дадут мне ответы, которые я ищу."
 GH_RICE_oasis_event.0010.desc.talfasomoll: "\n\nТайны нашего мира должны быть раскрыты. Смертоносные укусы, которые примет моё тело, откроют мою душу для любых знаний, которыми [ROOT.Char.GetFaith.DeathDeityName|U] [Select_CString(ROOT.Char.GetFaith.DeathDeityIsFemale, 'пожелает', 'пожелает')] поделиться."
 GH_RICE_oasis_event.0010.a: "Мне нужно хорошо подготовиться к этому ритуалу."

 GH_RICE_oasis_event.0011.t: "Гробница"
 GH_RICE_oasis_event.0011.desc: "Ночь [Select_CString(ROOT.Char.IsFemale, 'наступает', 'наступает')], когда я [Select_CString(ROOT.Char.IsFemale, 'прихожу', 'прихожу')] к гробнице в [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]. Получив наставления от местных [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdjective] о том, как спать и что делать, когда я [Select_CString(ROOT.Char.IsFemale, 'засыпаю', 'засыпаю')], я готов провести этот ритуал!\n\nКогда я [Select_CString(ROOT.Char.IsFemale, 'засыпаю', 'засыпаю')], мой разум сосредоточен на вопросах, которые меня беспокоят."
 GH_RICE_oasis_event.0011.desc.talfasomoll: "Ночь [Select_CString(ROOT.Char.IsFemale, 'наступает', 'наступает')], когда я [Select_CString(ROOT.Char.IsFemale, 'прихожу', 'прихожу')] к гробнице в [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]. Получив наставления от местных [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdjective] о том, как подготовить яму и как дышать, я подготовил свою скорпионью яму для этого ритуала.\n\nТрудно отдыхать легко или безопасно со скорпионами, облепившими все мои конечности. Наконец, несколько острых, жгучих укусов пронзают моё тело, словно раскалённое железо под кожей. Последнее, что я вижу перед тем, как погрузиться в глубокий сон, — это местные жители, наблюдающие сверху."
 GH_RICE_oasis_event.0011.a: "Время отправиться в царство сновидений..."

 GH_RICE_oasis_event.0012.t: "Сон"
 GH_RICE_oasis_event.0012.desc.failure: "Когда солнце начало подниматься над рассветным небом, я [Select_CString(ROOT.Char.IsFemale, 'проснулась', 'проснулся' )] от своего сна, чувствуя себя уставшей и сонной. К сожалению, я не могла хорошо вспомнить свой сон прошлой ночью, а когда я пересказала те немногие детали, которые смогла запомнить, местным [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdjective], они сказали, что не могут понять его смысл.\n\nПохоже, к сожалению, [ROOT.Char.GetFaith.PantheonTerm] [ROOT.Char.GetFaith.PantheonTermHasHave] решили, что я не достоин получить совет.\n\nПо крайней мере, я посетил гробницу кого-то важного."
 GH_RICE_oasis_event.0012.desc.success: "Когда солнце начало подниматься над рассветным небом, я [Select_CString(ROOT.Char.IsFemale, 'проснулась', 'проснулся' )] от своего сна, чувствуя себя отдохнувшей и полной сил. С большой ясностью я пересказала то, что смогла вспомнить из своих снов прошлой ночи, местным [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdjective].\n\nОсновные события сна, которые я могла вспомнить, были таковы: в нём фигурировали #Bold [ROOT.Char.Custom('RICE_tuareg_dream_subject')]#!, и я #Bold [ROOT.Char.Custom('RICE_tuareg_dream_action')]#!.\n\nВ любом случае, [ROOT.Char.Custom('DefaultPriestTitlePlural')] помогли мне истолковать сон и то, что [ROOT.Char.GetFaith.PantheonTerm] хотели сообщить мне о моих делах. В целом, я рад, что получил божественное руководство."
 GH_RICE_oasis_event.0012.desc.talfasomoll_success: "Когда солнце начало подниматься над рассветным небом, я [Select_CString(ROOT.Char.IsFemale, 'проснулась', 'проснулся' )] в яме и обнаружила, что скорпионы исчезли. Мои силы ещё не полностью вернулись, но с каждым движением вверх я чувствую, как жизнь возвращается в мои кости. С большой ясностью я пересказала то, что смогла вспомнить из своих снов прошлой ночи, местным [ROOT.Char.Custom('DefaultPriestTitlePlural')] [ROOT.Char.GetFaith.GetAdjective].\n\nПроизнесённое вслух имело мало смысла, и всё же в моей голове всё казалось таким ясным и всеобъемлющим, словно знание было предназначено только для меня. В целом, я рад, что получил некоторое руководство."
 GH_RICE_oasis_event.0012.desc.talfasomoll_failure: "Когда солнце палило в полуденном небе, я [Select_CString(ROOT.Char.IsFemale, 'проснулась', 'проснулся' )], полная боли и страданий, в яме. Скорпионы давно ушли, предположив, что я [Select_CString(ROOT.Char.IsFemale, 'мертва', 'мертв' )], и они были недалеки от истины. Всё болит от такой боли, которую я [Select_CString(ROOT.Char.IsFemale, 'должна была бы', 'должен был бы')] чувствовать.\n\nЕсли я переживу эту неделю, мне понадобится больше, чем просто хороший ночной сон."
 GH_RICE_oasis_event.0012.a: "Теперь пора возвращаться домой."

 GH_RICE_oasis_event.0021.t: "Такаракит"
 GH_RICE_oasis_event.0021.desc: "[ROOT.Char.GetCulture.GetCollectiveNoun], как #italic Агдуд Икадиб#!, высоко ценят добродетель #italic такаракит#!, или сдержанность. Те, кто выражает сильные чувства, такие как гнев, любовь и тому подобное, через косвенные средства, пользуются большим уважением.\n\nВ последнее время [courtier.GetFirstName] [Select_CString(courtier.IsFemale, 'заслужила', 'заслужил' )] репутацию человека, хорошо воплощающего #italic такаракит#!. Многие при моём дворе и за его пределами [Select_CString(courtier.IsFemale, 'хвалили', 'хвалили' )] [courtier.GetHerHis] за это."
 GH_RICE_oasis_event.0021.a: "Я понимаю, почему все так говорят!"

 GH_RICE_oasis_event.0022.t: "Тагуэлла"
 GH_RICE_oasis_event.0022.desc: "Сегодня я [Select_CString(ROOT.Char.IsFemale, 'наслаждаюсь', 'наслаждаюсь' )] особенно вкусной #italic тагуэллой#! с бараниной, козлятиной и специями. Эта лепёшка была основным продуктом кухни [ROOT.Char.GetCulture.GetName] с незапамятных времён."
 GH_RICE_oasis_event.0022.a: "Ням-ням!"

 GH_RICE_oasis_event.0023.t: "Инадан"
 GH_RICE_oasis_event.0023.desc: "#italic Инаданы#! в [county.GetNameNoTier] в последнее время [Select_CString(county.IsFemale, 'приобрели', 'приобрели' )] большую известность благодаря своей продукции. Хотя элитные, благородные касты народа [ROOT.Char.GetCulture.GetName], такие как я, держатся на расстоянии от этих наследственных каст кузнецов, ювелиров и ремесленников, их работа, несомненно, очень полезна для нас."
 GH_RICE_oasis_event.0023.a: "Приятно слышать."

 GH_RICE_oasis_event.0030.t: "Водяной колодец"
 GH_RICE_oasis_event.0030.desc: "В [Glossary('Саррадонской пустыне','sarradonian_desert_encyclopedia_desc')] водяные колодцы — редкий и драгоценный товар. Состоятельный местный житель хочет продать один из принадлежащих ему колодцев в этом регионе и предлагает за него достойную цену."
 GH_RICE_oasis_event.0030.a: "По рукам! Колодец теперь мой."
 GH_RICE_oasis_event.0030.b: "Меня не интересуют такие сделки."
 GH_RICE_oasis_event.0030.c: "За такую цену? Думаю, вы можете предложить и получше."

 GH_RICE_oasis_event.0031.t: "Оливки и финики"
 GH_RICE_oasis_event.0031.desc: "Несколько местных жителей с моих территорий [Select_CString(ROOT.Char.IsFemale, 'приблизились', 'приблизились' )] ко мне с подношением дани в виде ценных оливок и фиников из их деревни."
 GH_RICE_oasis_event.0031.a: "Ваш дар очень ценится."

 GH_RICE_desert_event.0010.t: "Отправлены жуки-скарабеи"
 GH_RICE_desert_event.0010.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'отправила', 'отправил' )] несколько жуков-скарабеев [recipient.GetTitledFirstName]. Остаётся только надеяться, что [recipient.GetSheHe] оценит этот жест и будет думать обо мне лучше, и что это поможет улучшить отношения между нами."
 GH_RICE_desert_event.0010.a: "Воистину"

 GH_RICE_desert_event.0011.opening: "[actor.Custom2('AppropriateGreeting',ROOT.Char)]"
 GH_RICE_desert_event.0011.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'преподношу', 'преподношу' )] вам этих жуков-скарабеев из наших Нор. Они славятся с древних времён своей скоростью и выносливостью, и они, несомненно, сослужат вам и вашим воинам хорошую службу. Прошу, примите эти дары как знак моей дружбы и во имя вечного мира между нашими народами."
 GH_RICE_desert_event.0011.a: "Как восхитительно!"

 GH_RICE_desert_event.0012.t: "Счёт навоза"
 GH_RICE_desert_event.0012.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'навещаю', 'навещаю' )] одного знакомого и замечаю, что его земля воняет навозом. Запах почти ошеломляющий, так как великие жуки-скарабеи, которые ползают по его земле, пируют на нём. Я начинаю громко считать, сколько их здесь, но один из моих стражников быстро просит меня остановиться. Считать «скот» кого-то другого — суеверие, которое рискует навлечь на них несчастье."
 GH_RICE_desert_event.0012.a: "Ах, я почти забыл! Хорошо, что ты напомнил."
 GH_RICE_desert_event.0012.b: "Несчастье, говоришь? Мне они никогда не нравились."

 GH_RICE_desert_event.0013.t: "Вор скарабеев"
 GH_RICE_desert_event.0013.desc: "Недавно вор попытался украсть несколько жуков из наших конюшен. Ему удалось пробежать небольшое расстояние, прежде чем его поймали, и ни одного животного не пропало. Кража такого существа — тяжкое преступление, приравниваемое к похищению или убийству. Обычно другие чиновники занимаются такими делами, но в связи с чрезвычайными обстоятельствами судьба вора в моих руках."
 GH_RICE_desert_event.0013.a: "Я доверюсь суждению моих чиновников и позволю им разобраться с этим."
 GH_RICE_desert_event.0013.b: "Традиция ясна. Казнить его."
 GH_RICE_desert_event.0013.c: "Пусть заплатит мне штраф, это научит его уму-разуму."

 GH_RICE_desert_event.0014.t: "Беглый раб"
 GH_RICE_desert_event.0014.desc.diplomacy: "Беглые рабы из других пустынных племён — слишком частое явление в [Glossary('Великой пустыне','sarradonian_desert_encyclopedia_desc')]. Некоторые из них довольно искусны. Сегодня один такой бывший раб, недавно прибывший на наши земли, предлагает [scope_spawn_runaway_slave.GetHerHis] услуги. [Select_CString(scope_spawn_runaway_slave.IsFemale, 'Она', 'Он')] когда-то служил рабом у могущественного торговца и хорошо осведомлён во многих языках и обычаях."
 GH_RICE_desert_event.0014.desc.martial: "Беглые рабы из других пустынных племён — слишком частое явление в [Glossary('Великой пустыне','sarradonian_desert_encyclopedia_desc')]. Некоторые из них довольно искусны. Сегодня один такой бывший раб, недавно прибывший на наши земли, предлагает [scope_spawn_runaway_slave.GetHerHis] услуги. [Select_CString(scope_spawn_runaway_slave.IsFemale, 'Она', 'Он')] когда-то служил телохранителем. [Select_CString(scope_spawn_runaway_slave.IsFemale, 'Она', 'Он')] — ветеран битв и талантлив в нескольких боевых искусствах."
 GH_RICE_desert_event.0014.desc.stewardship: "Беглые рабы из других пустынных племён — слишком частое явление в [Glossary('Великой пустыне','sarradonian_desert_encyclopedia_desc')]. Некоторые из них довольно искусны. Сегодня один такой бывший раб, недавно прибывший на наши земли, предлагает [scope_spawn_runaway_slave.GetHerHis] услуги. [Select_CString(scope_spawn_runaway_slave.IsFemale, 'Она', 'Он')] умеет читать и считать и раньше помогал своему хозяину управлять финансами. [Select_CString(scope_spawn_runaway_slave.IsFemale, 'Она', 'Он')] явно сообразительный и организованный человек."
 GH_RICE_desert_event.0014.desc.intrigue: "Беглые рабы из других пустынных племён — слишком частое явление в [Glossary('Великой пустыне','sarradonian_desert_encyclopedia_desc')]. Некоторые из них довольно искусны. Сегодня один такой бывший раб, недавно прибывший на наши земли, предлагает [scope_spawn_runaway_slave.GetHerHis] услуги. [Select_CString(scope_spawn_runaway_slave.IsFemale, 'Она', 'Он')] уклончив в рассказах о своём происхождении, за исключением упоминания о причастности к преступлениям. [Select_CString(scope_spawn_runaway_slave.IsFemale, 'Она', 'Он')] утверждает, что имеет множество полезных связей и способностей в области тайных операций."
 GH_RICE_desert_event.0014.desc.learning: "Беглые рабы из других пустынных племён — слишком частое явление в [Glossary('Великой пустыне','sarradonian_desert_encyclopedia_desc')]. Некоторые из них довольно искусны. Сегодня один такой бывший раб, недавно прибывший на наши земли, предлагает [scope_spawn_runaway_slave.GetHerHis] услуги. [Select_CString(scope_spawn_runaway_slave.IsFemale, 'Она', 'Он')] не только грамотен, но и необычайно красноречив и начитан. Возможно, [Select_CString(scope_spawn_runaway_slave.IsFemale, 'она', 'он')] был учёным до того, как его схватили и обратили в рабство? [Select_CString(scope_spawn_runaway_slave.IsFemale, 'Она', 'Он')] явно имеет склонность к интеллектуальным занятиям и надеется, что сможет быть полезен мне."
 GH_RICE_desert_event.0014.desc.arcana: "Беглые рабы из других пустынных племён — слишком частое явление в [Glossary('Великой пустыне','sarradonian_desert_encyclopedia_desc')]. Некоторые из них довольно искусны. Сегодня один такой бывший раб, недавно прибывший на наши земли, предлагает [scope_spawn_runaway_slave.GetHerHis] услуги. [Select_CString(scope_spawn_runaway_slave.IsFemale, 'Она', 'Он')] много знает о выживании в самых негостеприимных частях пустыни и даже утверждает, что знает расположение нескольких близлежащих руин, которые могли бы быть нам полезны. [Select_CString(scope_spawn_runaway_slave.IsFemale, 'Она', 'Он')] не только грамотен, но и обладает обрывочными знаниями об аркане и сверхъестественном."
 GH_RICE_desert_event.0014.a: "Давайте наймём [scope_spawn_runaway_slave.GetHerHim]!"
 GH_RICE_desert_event.0014.b: "Мне неинтересно, но [scope_spawn_runaway_slave.GetSheHe] может делать, что хочет."
 GH_RICE_desert_event.0014.c: "Беглый раб? Посмотрим, есть ли за него награда!"

 GH_RICE_desert_event.0015.t: "Таинственная смерть"
 GH_RICE_desert_event.0015.desc: "Состоятельный рыбак на [Glossary('Сирвалийском побережье','sirwali_coast_encyclopedia_desc')], считавшийся среди простолюдинов своего рода лидером общины, недавно погиб в результате трагического несчастного случая. Во время рыбалки его лодка застряла в коралловом рифе, и, к сожалению, на него напали рифовые акулы, когда он пытался доплыть до берега. Расследование показало, что имел место злой умысел, поскольку его лодка была саботирована, и человек, которого многие называют его соперником, [distrustful_murderer.GetName], [Select_CString(distrustful_murderer.IsFemale, 'оказалась', 'оказался')] замешан в этом. Улики очень весомы, но местные судьи обеспокоены растущей угрозой насилия, поэтому приговор был передан мне."
 GH_RICE_desert_event.0015.a: "Почему бы не позволить местным жителям решить?"
 GH_RICE_desert_event.0015.b: "Этот преступник будет казнён!"
 GH_RICE_desert_event.0015.c: "Эх, кому какое дело?"
 GH_RICE_desert_event.0015.d: "Мы проведём надлежащее разбирательство!"

 GH_RICE_desert_event.0016.t: "Горы борьбы"
 GH_RICE_desert_event.0016.desc: "Глубоко в [Glossary('Великой пустыне','sarradonian_desert_encyclopedia_desc')] есть горный хребет, называемый [Glossary('Горы Узеххар','USEHHAR_MOUNTAINS_GLOSS')], который, как говорят, содержит множество древних некрополей, погребённых глубоко под скалами.\n\nВ последнее время несколько крестьянских семей, привлечённых потенциалом больших пещер в горах, начали переселять свои семьи, чтобы обрести новый дом. Другие опасаются, что это плохая идея, и считают, что это следует запретить, дабы не тревожить духов мёртвых."
 GH_RICE_desert_event.0016.a: "Пусть местные решают сами, меня это не касается."
 GH_RICE_desert_event.0016.b: "Эти люди могут переезжать, чего бояться тех, кто уже мёртв?"
 GH_RICE_desert_event.0016.c: "Эти опасения оправданы, мы должны запретить кому-либо переезжать в горы."

 GH_RICE_desert_event.0017.t: "Нападения гиен"
 GH_RICE_desert_event.0017.desc: "Часть моих территорий, которую часто используют караваны, купцы и паломники, недавно стала добычей бродячей стаи [Glossary('гиен', 'animal_type_hyena_encyclopedia_desc')]. Хотя такие нападения обычно причиняют мало вреда и не вызывают особого беспокойства, на напавших купцов везли важные продукты питания, и большая часть их товара была съедена зверями! Поскольку этот купец довольно известен, возможно, стоит проявить великодушие и помочь после этой личной неудачи."
 GH_RICE_desert_event.0017.a: "Он и так богат, уверен, он будет в порядке."
 GH_RICE_desert_event.0017.b: "Я не прочь проявить щедрость!"

 send_scarab_beetles: "Подарить жуков-скарабеев"
 send_scarab_beetles_desc: "Отправить в дар жуков-скарабеев"
 opinion_scarab_beetle_gifts: "Подарил мне жуков-скарабеев"