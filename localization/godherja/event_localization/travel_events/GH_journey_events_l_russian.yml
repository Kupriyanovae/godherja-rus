	journey_event_kalathipsomi_veteran_aversarian_young_angry_story:90 "#F «Проклятые сьялволки, чтоб они все посдохли. И не надо так на меня смотреть, мне плевать. Они отняли мой дом, отобрали вообще всё. Я ведь в легионах [Select_CString(generated_journey_character.IsFemale, 'служила', 'служил' )], чтоб ты [Select_CString(generated_journey_character.IsFemale, 'знала', 'знал' )]. В легионах. В калатипсомских — единственных, что тогда еще оставались. Второй государственный легион, „Гордейшие“, вот кем мы были, истинные калатипсомцы. Легион проходил мимо моей деревни, мне тогда едва двадцать стукнуло, а урожай в тот год совсем не уродился. Так что выбор был невелик: либо позволить семье сожрать меня с голодухи, либо пойти в легион и попытаться раздобыть для них хоть какой-то провиант.\n\nИ всё пошло прахом. Всё до единого. Я так [Select_CString(generated_journey_character.IsFemale, 'гордилась', 'гордился' )] тем, что попала в „Гордейшие“, так [Select_CString(generated_journey_character.IsFemale, 'гордилась', 'гордился' )]. Совсем еще [Select_CString(generated_journey_character.IsFemale, 'девчонка', 'мальчишка' )]... да и сейчас, наверное, несильно старше, но тогда я [Select_CString(generated_journey_character.IsFemale, 'была совсем молода', 'был совсем молод' ). И не [Select_CString(generated_journey_character.IsFemale, 'знала', 'знал' )], что все эти сказки про наших великих предков — просто сказки и есть. Славная война, славные завоевания, славные дуэли... Мы только проигрывали, проигрывали и проигрывали. „Гордейших“ и остальные легионы швыряли из стороны в сторону, словно в какой-то игре, и хоть какой-то отпор смогли дать лишь те легионы, что наплевали на приказы и начали действовать сами. А потом погибла Кровопийца, и все поняли, что нам конец.\n\nКрезокс, жирный ублюдок, этот самый Крезокс продал нас всех с потрохами. Отдал нас в рабство! А этот варварский король, „Истребитель Ведьм“, объявил, что мы все свободны, и велел сложить мечи... Я тогда [Select_CString(generated_journey_character.IsFemale, 'подумала', 'подумал' )], что это чудо. [Select_CString(generated_journey_character.IsFemale, 'Подумала', 'Подумал' )], что меня пощадили. Он даже приказал разделить нас и дать припасов, чтобы мы могли добраться до дома. Я [Select_CString(generated_journey_character.IsFemale, 'рассказала', 'рассказал' )] какому-то сьялволку про свою семью, и... и я [Select_CString(generated_journey_character.IsFemale, 'подумала', 'подумал' )], что они, может, тоже люди. Мне выделили целый ящик с хлебом и семенами из их трофеев, погрузили на телегу и отправили вместе с другими местными ребятами. Все мы ехали домой с едой, чтобы прокормить родных. Думали, героями вернемся...\n\nДа только от дома ничего не осталось, когда я [Select_CString(generated_journey_character.IsFemale, 'вернулась', 'вернулся' )]. Вообще ничего. Все сгинули, мертвы, хата сожжена дотла. Я [Select_CString(generated_journey_character.IsFemale, 'нашла', 'нашел' )] половину своих братьев и сестер — просто кучку обгорелых костей в том, что осталось от нашей лачуги. Куда делись остальные, даже не знаю... И прямо тогда до меня дошло. Я не знаю, кто это сделал. Разбойники, дезертиры, сьялволки... но ничего бы этого не случилось, если бы они вообще не приперлись сюда. Урожай бы не погиб, если бы легионы не забирали всё подчистую, чтобы воевать со сьялволками. Моя семья была бы жива, если бы сьялволки не перебили все легионы, которые сдерживали бандитов... Истребитель Ведьм и вся его орава уничтожили мою семью. И ради чего? Ради пары буханок хлеба?»#!"
