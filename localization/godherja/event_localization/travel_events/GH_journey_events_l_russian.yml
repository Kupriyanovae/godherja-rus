  journey_event_kalathipsomi_veteran_aversarian_young_sad_story:90 "#F «Я помню те времена, когда началось вторжение, это ведь было не так уж давно. Когда сьялволки вошли в Калатипсоми. Я тогда [Select_CString(generated_journey_character.IsFemale, 'была еще девчонкой', 'был еще мальчишкой' )... всё еще [Select_CString(generated_journey_character.IsFemale, 'молодая', 'молодой' )], но тогда [Select_CString(generated_journey_character.IsFemale, 'была совсем ребенком', 'был совсем ребенком' )]. Я [Select_CString(generated_journey_character.IsFemale, 'выросла', 'вырос' )] в Псемите, мы каждый день ходили на рынок с матерью и отцом, когда они приезжали продавать деревянные поделки, которые мастерил отец. Отец указывал на всех купцов и рассказывал, откуда они приехали, какие у них акценты, и каждый раз говорил мне что-то новое о каждом из них. А мама показывала на статуи всех ауатократиров и рассказывала про каждого, даже про тех, у кого не хватало головы или кто совсем развалился.\n\nЭто была хорошая жизнь, простая. Разбойников мы, конечно, погрязли, да и легионы тогда были несильно лучше... но мы были в безопасности. По крайней мере, относительной. Мы были друг у друга. У нас было отцовское плотницкое дело и мамино вязание. Сама я [Select_CString(generated_journey_character.IsFemale, 'увлеклась', 'увлекся' )] садоводством, но любила играть с палками, так что в итоге еще и к ополчению примкнула.\n\nНо вот ведь какая штука с детством. Забавная штука. У большинства оно заканчивается, пока ты еще ребенок... Я знаю, почему они это сделали, понимаешь? Я [Select_CString(generated_journey_character.IsFemale, 'молода', 'молод' ), но не дура, я всё понимаю. Сьялволкам нужно было куда-то идти, а мы стояли у них на пути. Кенвар даже обошелся довольно мягко с большинством тех, кого разбил... но легче от этого не становится. Я [Select_CString(generated_journey_character.IsFemale, 'стояла', 'стоял' )] вместе с ополчением против людоедов... худших из всех варваров, худших с большим отрывом... Они вырезали нас... моих маму и папу... Всё бессмысленно. Всё до единого...»#!"
  journey_event_kalathipsomi_veteran_aversarian_young_sad_story_response:90 "Печально знакомая история..."

  journey_event_kalathipsomi_veteran_aversarian_young_black_mountains_story:90 "#F «Я помню то, что было еще до Элизии. Не так уж давно. [Select_CString(generated_journey_character.IsFemale, 'Была', 'Был' )] я тогда на севере, в 9-м Калатипсомском губернаторском легионе. Ну и шутка это была! У нас даже губернатора не осталось, чтобы нами править, а та баба, что считалась им, жила в каком-то горном убежище, совершенно потеряв контроль над происходящим. Сама я, может, и [Select_CString(generated_journey_character.IsFemale, 'родилась аверсарианкой', 'родился аверсарианцем' ), но моим лучшим другом был сарридианец, из племенных. Мирный народ, но вот этот конкретный, Ульнир Гордаброк... ну, на самом деле он был неплохим малым. И вот я [Select_CString(generated_journey_character.IsFemale, 'поймала', 'поймал' )] его на дезертирстве, и выбор у меня был такой: либо бежать вместе с ними, либо моему дружку пришлось бы меня прирезать, а я не [Select_CString(generated_journey_character.IsFemale, 'хотела', 'хотел' )] вешать такой грех на парня, так что [Select_CString(generated_journey_character.IsFemale, 'сказала', 'сказал' )]: к черту всё, бежим.\n\nНу, мы и дезертировали, и Гордаброк тут же объявил себя королем. Мы воевали против этой губернаторши, этой суки Метиады, и на этом всё. А потом появился он, понимаешь? Черное Солнце. Не знаю, слыхали ли вы о нем, большинство не слышало. Этот ублюдок, позвольте мне сказать вам, тот еще холодный сукин сын. Губернатор Катраддии, судя по всему. Приперся со всеми этими беженцами, а потом как дал Кенвару по щеке и отправил его на юг! Ха-ха! Но потом Кенвар вернулся, и Черное Солнце откинули обратно на север.\n\nГордаброк отдал меня и моих парней Черному Солнцу в помощь для битвы — награда за то, что тот сделал пару одолжений для Гордаброка. Но когда мы вернулись, Черное Солнце взял и прирезал его. Жаль, конечно, хороший был мужик, но нас окружили его бойцы, и выбор был простой: либо примкнуть к нему, либо умереть. Ну мы и примкнули, а пот