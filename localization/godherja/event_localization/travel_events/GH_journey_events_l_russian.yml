	journey_event_kalathipsomi_veteran_sjalvolki_young_proud_story:90 "#F «Да, я сьялволк! Из клана Ульдракан, что от Барки. Перевал я, увы, [Select_CString(generated_journey_character.IsFemale, 'пропустила', 'пропустил' ), мой клан решил на время осесть на северо-востоке, чтобы оправиться от потерь, так что Перевал случился без нас. Чертовски жаль, чертовски жаль, что я не добралась до этих аверсарианских ублюдков! Я тогда [Select_CString(generated_journey_character.IsFemale, 'была совсем девчонкой', 'был совсем пареньком' ), да и сейчас во многом им и остаюсь, но тогда было так мало времени, чтобы снискать славу!\n\nЯ [Select_CString(generated_journey_character.IsFemale, 'сражалась', 'сражался' )] вместе с кланом с той самой секунды, как мы покинули Серый перевал, меня прямо тогда и признали воином. Многие из клана не пережили этот переход, знаете ли, но я [Select_CString(generated_journey_character.IsFemale, 'смогла', 'смог' )]! Меня сделали воином, отдали мне шлем и щит моего отца, раз уж он насмерть замерз на перевале, и сказали, что теперь я [Select_CString(generated_journey_character.IsFemale, 'должна', 'должен' )] искупить его имя, раз он умер не как воин. И я [Select_CString(generated_journey_character.IsFemale, 'сражалась', 'сражался' )]! Била аверсарианцев по всем Землям Кланов... Калатипсоми, или как они там это раньше называли.\n\nНу и зрелище это было, ну и зрелище! Легионы падали направо и налево, имперцы в своих пижонских доспехах едва ли могли простоять и секунды против чарджа сьялволков! На их [Concept('magi','магов')|E], конечно, плевать не стоило, но Истребитель Ведьм дал нам собственных магов, и теперь у них ничего не осталось! Никогда я так не [Select_CString(generated_journey_character.IsFemale, 'гордилась', 'гордился' ), как когда вбила первый столб своего собственного дома в Землях Кланов, прямо рядом с разрушенным нами имперским фортом. Никогда в жизни!»#!"
  journey_event_kalathipsomi_veteran_sjalvolki_young_proud_story_response:90 "Война за обретение дома, да?"

  journey_event_kalathipsomi_veteran_sjalvolki_young_farmer_story:90 "#F «Ага, историю хотите? Позвольте мне рассказать кое-что, думаю, эта байка заткнет за пояс все остальные! Знаю, я молод и у меня нет таких баек, как у некоторых стариков, но поверьте мне! У меня есть величайшая история из всех, и она о том, как я научился выращивать лучшую свеклу. Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] из клана Аэрдонорг, вместе с фенвирами, хотя и не с Кормагом и той оравой, что ушла в Азиуполи. Мы с семьей держались Истребителя Ведьм. Пошли вместе с ним прямо в Аверсарию.\n\nМоя история начинается в Серых перевалах. [Select_CString(generated_journey_character.IsFemale, 'Увидела', 'Увидел' )] я, как старый вождь из Мастикигни вот-вот поскользнется и ухнет со скалы. Схватила его за запястье и вытянула, хоть [Select_CString(generated_journey_character.IsFemale, 'была еще малявкой', 'был еще малявкой' ), а он так изумился тому, что я [Select_CString(generated_journey_character.IsFemale, 'смогла', 'смог' )] его сцапать и сработала так быстро — тем более его собственный клан едва успел добежать, когда я уже всё [Select_CString(generated_journey_character.IsFemale, 'сделала', 'сделал' ), — что прямо там объявил меня хускарлом! Судя по всему, старый Кормаг, когда еще был верховным вождем фенвиров, содрал за это немалую виру с моей семьи, но я умоляла их отпустить меня, и они согласились.\n\nИ вот, у меня только-только пушок на подбородке пробился, а я уже хускарл верховного вождя Мастикигни! [Select_CString(generated_journey_character.IsFemale, 'Пошла', 'Пошел' )] с ними в Земли Кланов и прорубала путь через Аверсарию со всей этой толпой. Слыхали про битву у Десяти Деревьев? Её, небось, затмил Перевал, но для нас это была главная сеча. Аверсарианская бестия в красной броне — поговаривали, окрашенной кровью её врагов, — слыхали о такой? Кровопийца из Лесуса, Ксенас Раздирательница, Мясник из Барки, ага, она самая! Хоть кто-то о ней слышал. Её даже прозвали Ксенас „Похитительница Имен“ за всех поименованных мужчин и женщин, которых она загубила. Не знаю, в курсе ли вы, но у сьялволков прозвища — это святое. Получить имя — значит стать воином, мужчиной или женщиной. Я тяжело [Select_CString(generated_journey_character.IsFemale, 'боролась', 'боролся' )] за свое имя, и оно даже не то чтобы великое, просто „Солнце-в-Глаз“, потому что мне вечно приходилось стрелять, глядя прямо на солнце. Но дать имя аверсарианцу? Это значит, что они чего-то стоят, значит, они достойны хорошей драки.\n\nБитва у Десяти Деревьев. Ну, деревьев там было куда больше десяти, хотя на самой поляне, где всё закрутилось, их было одиннадцать. Это даже не должно было стать боем, вообще никак. Клан разбивал лагерь на ночь, аверсарианцы отступали к крепости, ускользнув от засады, которую, как мы и не знали, устроили эти черти из Кардвена. И они налетели прямо на нас, буквально! У меня глаза уже наполовину слипались, я [Select_CString(generated_journey_character.IsFemale, 'дремала', 'дремал' ), глядя на костер, как вдруг какой-то аверсарианец спотыкается и влетает прямо в мое кострище!\n\nНу и паника же поднялась. Понятия не имею, как часовые их прозевали. Либо спали, либо были мертвы — оба с того края полегли в драке, так что теперь не разберешь, хотя мы все говорим, что они пали в бою, ради их чести. В одну секунду я сплю, а в следующую у меня аверсарианцы топчутся прямо в остатках похлебки! Вскочила в тот же миг, едва [Select_CString(generated_journey_character.IsFemale, 'увидела', 'увидел' )] эти кровавые символы — сьялволки такие не носят, — и врезала ублюдку своим молотом так сильно, что его шлем вывернуло наизнанку! А дальше начался сущий хаос, у меня был лук, но воспользоваться им я толком не [Select_CString(generated_journey_character.IsFemale, 'могла', 'мог' ), мы стояли задница к заднице против сотни прожженных аверсарианцев.\n\nО, сколько славных имен пало у Одиннадцати Деревьев (названных так по числу деревьев в нашем лагере). Ульфрик „Крикун“ получил свое имя там, как и Эйлриг „Странноглазый“, Илья „Убийца Любовников“ и Десисьялва „Мужеубийца“. Дражич „Металлург“ погиб, Драгоник „Железоруб“, его брат, получил свое имя уже умирая там, за то, что умудрился пробить мечом латы, прежде чем испустить дух. Аверсарианцы тоже полегли. Культ Кротироса они себя называли, маги, что вели всю эту ораву. Дексос „Старейший“, пижонистая Теска „Разорительница Ривов“, „архимаг“ или как её там, Гости „Любитель Язычников“. Не-маги тоже были: Драгос „Дракон“, Ле... лег... легоне... Генерал Мескранакс из... 38-го легиона? Мескранакс „Чистейший из Чистых“, наемник у них еще был, сэр Мелтью „из Розы и Лебедя“ или вроде того. Всех уложили.\n\nЛюди забывают об этом только из-за Элизии, там тогда собралось больше всего имен в истории, и всё чисто случайно. И мы устроили им ад! Я [Select_CString(generated_journey_character.IsFemale, 'скрестила', 'скрестил' )] оружие с самим Мелтью до того, как та магичка взорвалась... Разорительница Ривов, кажется, ей отсекли руку прямо посреди заклинания, и она превратила половину поля боя в кратер. А потом остались только я и верховный вождь Ульрадд, тот самый муж из Мастикигни, за которым я [Select_CString(generated_journey_character.IsFemale, 'шла', 'шел' ). [Select_CString(generated_journey_character.IsFemale, 'Увидела', 'Увидел' ), как его отрезало на другом конце поля в этой каше, и рядом нет ни единого хускарла, чтобы защитить его честь! Позорище, хотя, полагаю, я к тому времени уже [Select_CString(generated_journey_character.IsFemale, 'показала', 'показал' )] Мастикигни, как надо относиться к их вождю! Ха-ха!\n\nНу, я и бросилась туда, прыгнула на какие-то ящики, каким-то чудом перемахнула как минимум через шесть шлемов. Я не шучу! Если бы я [Select_CString(generated_journey_character.IsFemale, 'лживословила', 'лживословил' ), то придумала бы что-то более впечатляющее, чем прыжок. Приземлилась прямо на еще одно имя — предателя Уловена „Аверсарианца“. Мондекнийский ублюдок меня даже не заметил, я рухнула прямо на него и раздавила к чертям. Месиво было знатное, но воины толпились на каждом скользком клочке грязи, на котором мы спотыкались. В этом и было преимущество: легионы всё еще использовали старую тактику. Хотели выстроиться в шеренги, чтобы их маги ударили по нам, но мы знали, что в такой тесноте преимущество за нами, и прижали их.\n\nВот тогда-то она и появилась — сама Кровопийца из Лесуса. Она маршировала через толпу, как зверь на охоте, завидела верховного вождя, наметила цель и пошла напролом. Знаете, какого роста была эта сука?! На две головы выше всех остальных, клянусь Велосом и Прохеном, истинный крест. Говорили, она родилась уродливой и перекошенной, две ноги задом наперед и всего одна рука. Использовала магию, чтобы исправить себя, её папаша был магом или кем-то вроде и помер, потому что выпустил из себя слишком много крови, чтобы сделать её такой огромной. Чертовы аверсарианцы, не могут просто принять вещи такими, какие они есть...\n\nОна сотворила заклинание, чтобы вырубить кучу парней, между ней и верховным вождем остались стоять только двое, два других хускарла. Два взрослых мужика, один размером с медведя, а она как-то хватает обоих за головы и сталкивает их лбами. Хватает свой топор там, где его выронила, и шагает вперед. Огромный боевой топор, длиннее, чем я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] ростом, держала в одной руке. Другая рука поднимается и указывает на верховного вождя, и я уже достаточно [Select_CString(generated_journey_character.IsFemale, 'знала', 'знал' )] аверсарианский, чтобы разобрать её крик: „Ты! Иди и сразись со мной, подлокровыш!“ Напугала она меня до усрачки, это да.\n\nКровопийца замахнулась топором обеими руками и пошла по дуге как раз в тот миг, когда верховный вождь обернулся, и я сбила его с ног! Повалила его на землю и оттащила в сторону до того, как она с такой силой всадила топор в грязь, что тот звякнул о камень. Кровопийца так разозлилась, что взвыла и бросилась на меня, я вообще не знаю, как выжила. Орала на меня, орала и визжала: „Я сотру вас, язычников, в порошок, а ваши кости и кровь удобрят эти поля! Вы больше ни на что не годны!“ — а затем бросилась на меня с топором.\n\nПричин выжить не было, честно, никаких. Я гордая, чертовски гордая! Но я и близко не ровня Кровопийце. Но прямо тогда, прямо в этот миг её сапог скользит, прямо в грязи. Невозможно, шансов ноль, но это случилось именно тогда. [Select_CString(generated_journey_character.IsFemale, 'Поняла', 'Понял' ) я, что Велос улыбается мне, мы с верховным вождем подскочили и повалили её на землю. Даже с её габаритами оказаться на земле — паршивое дело, и еще двое хускарлов подбежали на подмогу. Оказалось, доспехи были не в крови, а просто покрашены, но уж поверьте, когда мы с ней покончили, они были сплошь покрыты требухой! Настоящая тварь была, но свое имя, думаю, заслужила. Воин такой свирепости? Определенно должен унести что-то с собой в могилу. Интересно, бьются ли аверсарианцы с Велосом...\n\nВ общем, вот такая история. Что? Урожай? Так я же [Select_CString(generated_journey_character.IsFemale, 'рассказала', 'рассказал' )] вам, как научилась выращивать свеклу! Верховный вождь сказал, что я сполна заслужила свою долю, назвал меня чертовски славным малым, который сам достоин быть вождем. Отдал мне старый замок, мимо которого мы проходили и который я [Select_CString(generated_journey_character.IsFemale, 'назвала', 'назвал' )] красивым, дал мне тридцать человек, чтобы основать поселение, и нарёк меня вождем Мастикигни. Старина Ульрадд был щедр, это уж точно... надеюсь, с ним всё в порядке... но всё же. А свекла? Помните, Кровопийца сказала мне: перемалывать кости и плоть, чтобы удобрять растения. А ведь неплохая была идея! Мои земли были всего в паре переходов от Десяти Деревьев, и уж поверьте, с помощью Кровопийцы свекла еще никогда не росла такой огромной! Ха!»#!"
  journey_event_kalathipsomi_veteran_sjalvolki_young_farmer_story_response:90 "Молодец с заслуженной досрочной отставкой."

  journey_event_kalathipsomi_veteran_sjalvolki_young_black_story:90 "#F «Ты [Select_CString(generated_journey_character.IsFemale, 'сражалась', 'сражался' )] в Землях Кланов? Неважно, куча народу там была, полагаю, но я тоже там [Select_CString(generated_journey_character.IsFemale, 'сражалась', 'сражался' )]. Не знаю, у каждого, кто там побывал, есть своя история оттуда. Но я тоже там [Select_CString(generated_journey_character.IsFemale, 'была', 'был' ), и это было не так уж давно. Я тоже [Select_CString(generated_journey_character.IsFemale, 'сражалась', 'сражался' ]...\n\nНе люблю говорить об этом особо, ну, из-за моей ноги и всего такого. После этого я уже толком не [Select_CString(generated_journey_character.IsFemale, 'воевала', 'воевал' )... это был мой первый бой, к тому же. Единственный бой, если честно... не [Select_CString(generated_journey_character.IsFemale, 'могла', 'мог' )] толком драться из-за ноги, какая жалость... а ведь когда-то из меня должен был выйти толк. Похоже, не судьба, похоже, нет... Битва при Бергкоге, слыхали о такой? Не [Select_CString(generated_journey_character.IsFemale, 'удивлюсь', 'удивлюсь' ), если нет, до неё никому нет дела. Единственный раз, когда Истребитель Ведьм проиграл стычку, единственный раз... ничего крупного, не какой-то там великий провал, просто отступление для перегруппировки. И все же, ну и каша...\n\nЕго звали „Черное Солнце“, вражеского генерала. Какой-то военачальник из Катраддии, мы думали, что зажали его там, думали, он сдох в этом проклятом [Concept('the_fog','Тумане')|E]. А он как-то выбрался, взял на себя командование этим сбродом в Черных горах. Мы-то думали, в Землях Кланов не осталось никого путного, кто мог бы дать нам отпор, так что Кенвар слишком возгордился, когда мы туда вошли. Сарридианцы, аверсарианцы, даже кучка сьялволков, что пошли за ними из Катраддии. Устроили нам засаду, завалили перевал валунами и сыпали магий сверху, откуда мы не могли их достать. Пришлось отходить... валун скатился и прижал мою ногу к утесу, парням пришлось утаскивать меня уже без неё... кампания, где мы побеждали в каждой чертовой битве, и надо же, чтобы в моем первом же бою какой-то паршивый аверсарианский воевода в черных латах, корчащий из себя гребаного бога, забрал мою ногу камнем в единственной битве, которую мой генерал проиграл. Чертов ад...»#!"
  journey_event_kalathipsomi_veteran_sjalvolki_young_black_story_response:90 "Бергкога? Никогда о ней не слышал."

  journey_event_kalathipsomi_veteran_sjalvolki_young_witnessed_surrender_story:90 "#F «Ага, так ты [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] в Землях Кланов? Не в самом месте, я про кампанию! Когда мы вышвырнули аверсарианцев, а Истребитель Ведьм вел нас к славе и песням! Ха-ха! Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там, когда всё закончилось! Могила Крезокса, [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там, когда она и стала этой самой могилой! Все эти старые руины, где засел этот жирный легат Крезокс, ха-ха!\n\nЯ как раз [Select_CString(generated_journey_character.IsFemale, 'заслужила', 'заслужил' )] себе небольшое отличие в прошлой свалке, так что мне разрешили встать в первых рядах, чтобы увидеть капитуляцию. Крезокс оказался тем еще говоруном, я аж [Select_CString(generated_journey_character.IsFemale, 'пожалела', 'пожалел' ), что выучила аверсарианский! Рассусоливал и рассусоливал о том, как он сражался с честью, кровью и бла-бла-бла. Может, я просто [Select_CString(generated_journey_character.IsFemale, 'молода', 'молод' )] и мало что знаю о почтении к старшим, но клянусь Велосом, он просто не затыкался!\n\nСамый угар был, когда он затем отдал все свои легионы в рабство Кенвару в обмен на безопасность от „подлокровок“, как он нас назвал. Ха-ха! Видели бы вы лица всех его генералов. Не думаю, что он хоть кому-то из них сказал. Мескранакс чуть, сука, на него не набросился! Умора была, толпе его людей пришлось валить его на землю — „Чистейшим из Чистых“ его звали, а собственные соплеменники уволокли его в грязь! Ха-ха!\n\nКороче, дальше стало еще смешнее. Все эти аверсарианцы только что стали рабами, а вокруг стоят все эти старые рабы. Не аверсарианцы, в смысле. Бедолаги, которые выглядят так, будто в жизни не ели, и ни капли надежды или эмоций на лицах, словно нежить какая-то. Не понимаю, почему они просто не отбивались, неужели они могут говорить, что не заслуживают быть рабами, если сами не сражаются? Не знаю, но другие смотрели на это иначе, не мне их судить. Не то чтобы я вообще хоть что-то [Select_CString(generated_journey_character.IsFemale, 'знала', 'знал' )] о том, как это устроено. У меня никогда не было трэллов.\n\nТак вот, значит, все они теперь рабы, и Кенвар соглашается! Крезокс выглядел таким счастливым, жирный свинопотам со складками такими огромными, что они аж со стула свисали. Он даже в доспехи свои не влезал! Сразу видно, кузнецу пришлось растягивать их, чтобы он смог внутрь втиснуться. Протягивает Истребителю Ведьм свою должностную брошь, а раб передает его меч. Кенвар берет и то, и другое, а затем швыряет через плечо! Ха!\n\nИ Кенвар — и вот тут самая лучшая часть — Кенвар затем смотрит на всех этих солдат и рабов, которых только что получил. Смотрит на них и говорит, что раз уж он их господин, его приказы должны исполняться пожизненно. Смотрит он на этих парней из легиона, а они, уж поверьте, все аж плакать готовы! Кучка из них выглядит так, будто они прямо сейчас хотят броситься на Истребителя Ведьм, но по большинству видно, что они думали, будто мы их сожрем, как кардвенцы какие-то! Ха-ха! Так вот, Кенвар смотрит и говорит, что его приказ — закон до конца их дней, а затем заявляет: „Как хозяин и владелец вашей плоти и души, я приказываю вам обучиться ремеслу, отличному от войны, отложить оружие и взять в руки мотыгу и вилы. Ступайте и живите как мужчины и женщины вдали от войны, и никогда больше не думайте о битвах“.\n\nСолдаты все так и застыли, никто не знал, что делать! Ха-ха-ха! Мы-то знали Кенвара, знали, что он не станет их убивать или делать что-то в таком духе. Хотя мы думали, что вполне могли бы, учитывая, какими ублюдками были аверсарианцы. В общем, мы знали, что не станет, а они-то нет! Аверсарианцы думали, что Кенвар — сам демон во плоти! И вот он велит им жить в мире, они все смотрят удивленно, а затем он поворачивается к рабам и объявляет, что отныне они свободны от своих цепей и, если пожелают, будут приняты как братья в кланы Имперреха. Рабы запутались еще сильнее, некоторые тогда разрыдались, другие начали молиться на самого Истребителя Ведьм! Ха-ха!\n\nКороче, короче. Тут до Крезокса начинает доходить, что что-то здесь не так. Он давай говорить Кенвару, мол... э-э, как там этот оплавленный солнцем кусок жира выразился... „Я понимаю, что ты низшей крови и ума, Кенвар, но позволь мне просветить тебя о необходимости контроля. Эти рабы буйные, те, что ликуют, и, возможно, твое провозглашение было чем-то там очень мудрым, потому что все мятежные рабы вызвались убивать. Как бы то ни было, я не желаю находиться рядом с этими глупцами, когда ты отправишь меня к моей родне“.\n\nИдиот, гребаный идиот! Ха-ха-ха! Кенвар посмотрел на рабов и спросил, кто из них родился аверсарианцем, пообещал, что не причинит вреда и не заберет свои слова назад, и несколько человек вышли вперед. Затем он смотрит на всех нас и говорит: „Крезокс, как я и обещал, я возвращаю тебя твоим соплеменникам! Они могут делать с тобой, как мои новые клансмены, всё, что им вздумается“. Разорвали гребаного идиота в клочья! Ахаха! Думал, у рабов нет духа для драки, но Крезокс завизжал и попытался уползти, Кенвар пнул его прямо в подбородок, опрокинул на спину, и они навалились! Ахаха!\n\nПока Крезокса рвали на куски, Кенвар снова посмотрел на легионы и их вождей и повторил, что его приказ сложить оружие дается на всю жизнь, но тем самым он освобождает их от рабства и всех уз. Затем велел им проваливать оттуда, приказал нам расселить их по всем Землям Кланов и отправить на фермы, и большинство из них больше никогда не воевало. Ахаха! Величайший день во всей кампании, мне он понравился даже больше, чем Элизийский перевал! Ахаха! [Select_CString(generated_journey_character.IsFemale, 'Поняла', 'Понял' )] я в тот миг, хоть и [Select_CString(generated_journey_character.IsFemale, 'была еще совсем молодой девчонкой', 'был еще совсем молодым пареньком' ), прямо в тот миг [Select_CString(generated_journey_character.IsFemale, 'поняла', 'понял' )], что жизнь на юге будет хорошей жизнью».#!"
  journey_event_kalathipsomi_veteran_sjalvolki_young_witnessed_surrender_story_response:90 "Истинно Могила Крезокса."

 # Sjalvolki - Old
	journey_event_kalathipsomi_veteran_sjalvolki_old_sad_story:90 "#F «Элизийский перевал то, Элизийский перевал сё, все только и талдычат, что о Перевале... А я ведь [Select_CString(generated_journey_character.IsFemale, 'служила', 'служил' ), знаете ли. [Select_CString(generated_journey_character.IsFemale, 'Служила', 'Служил' )] в клане Доргаволки, одном из даукени под началом самого Кенвара. Гордая [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] — целую вечность назад, — чертовски гордая в молодости. Мы ведь шли в Земли Кланов, строили новое будущее для нашего народа...\n\nКонечно, этому не суждено было длиться вечно, само собой. Мы забрали землю, и что получили? Мы пришли в прекрасный хаос, в прекрасный беспорядок. Аверсарианцы резали друг друга, рабы восставали повсюду, монстры на воле. Как раз то, чего мы хотели, идеально для переселения, и дало нам кучу славы, которую можно было забрать. И что мы получили? Еще больше трупов. Аверсарианские мальчишки, сьялволькские мальчишки, гоанские мальчишки — какая к черту разница? Всё это просто мертвые дети и потерянные мечты.\n\nУстроилась я неплохо, [Select_CString(generated_journey_character.IsFemale, 'получила', 'получил' )] себе ферму на юге после Перевала. Завела семью, вырастила детей, а потом оставила их, чтобы бродяжничать. Не [Select_CString(generated_journey_character.IsFemale, 'хотела', 'хотел' )] быть в обузу. Хорошие дети, хорошая жена, хороший вождь клана над этими землями. Даже соседи были хорошими. На фермах по соседству жили аверсарианцы, просто фермеры без единой капли магии... добрый люд... добрый люд... кажется, я [Select_CString(generated_journey_character.IsFemale, 'убила', 'убил' )] их сына у Десяти Деревьев...»#!"
  journey_event_kalathipsomi_veteran_sjalvolki_old_sad_story_response:90 "У каждого есть мать..."

  journey_event_kalathipsomi_veteran_sjalvolki_old_farmer_story:90 "#F «Выращивал розовый ячмень, знаете ли. Он хорошо растет на реках там, в Калатипсоми — Землях Кланов, как мы их называли. Хорошо растет. Были у меня свои рабы, трэллы. Не то чтобы рабы на самом деле, заметьте, а вольные. Я освободил их с фермы, но они сказали, что выросли там и идти им больше некуда, так что я велел им спать отныне в донжоне вместе со мной, и теперь они — клан. Стали мне как новые дети.\n\nЯчмень был прекрасен, целые поля, обрамленные деревьями такими огромными, что, казалось, им нет конца... это напоминало мне о доме, о историях, что мне рассказывали о его значении. Родные земли нашего народа, и раз уж мы были здесь, то теперь это тоже была наша родина. Дом — это люди, на самом деле... но всё равно было приятно, что всё так похоже, что можно было почти вообразить, будто стоишь у Одиннадцати Камней Урехи, у Велосстрега, на Горном хребте Драконьего племени. Приятно вообразить...\n\nХозяйство шло в гору. Своей семьи у меня никогда не было, так и не сподобился. Пытались, но не вышло, и у меня, и у жены. Даже знахарка сказала, что ничего не может поделать. Так что мы усыновили. На рынке меня обокрал какой-то паренек, наполовину аверсарианец, наполовину маршер. Схватил его за шкирку и понял, что родителей у него больше нет, так что притащил его домой и отмыл. Викьон его звали, хотя сам он теперь зовет себя Вигдерном, на манер сьялволков. Любил этого мальчика, любил несмотря ни на что, и он любил нас, своих братьев и сестер. Дети рабов они были, а стали родными как семья...»#!"
  journey_event_kalathipsomi_veteran_sjalvolki_old_farmer_story_response:90 "Обрести мир через войну — странная штука."

  journey_event_kalathipsomi_veteran_sjalvolki_old_religious_story:90 "#F «Слава Велосу! Слава Обрядам! Слава Истребителю Ведьм! Я помню свою юность, помню те далекие времена, эпоху тьмы! Вера без смысла! Народ без дома! Помню, как в детстве меня звали „Боголюбом“, потому что я любил богов, и уж поверьте, я понял, что нашел их на юге! Вступая в Земли Кланов! Сражаясь с аверсарианцами! Это был святой долг, святой труд.\n\nМои товарищи так никогда не думали. Говорили, что это просто веселое время, или просто необходимость, просто чтобы найти новый дом. Но святой! Этот труд был святым! Всё это подтвердилось еще сильнее, стоило нам обосноваться на пепелище этой дряхлой и греховной Аверсарии, еще больше доказательств! Мы воздвигли Обряды, мы узрели истинную природу Велоса! Мы познали путь!\n\nСвятой труд никогда не будет завершен, но я умру [Select_CString(generated_journey_character.IsFemale, 'счастливой', 'счастливым' ), зная, что в Землях Кланов я [Select_CString(generated_journey_character.IsFemale, 'помогла', 'помог' )] нашему народу стать на шаг ближе к спасению!»#!"
  journey_event_kalathipsomi_veteran_sjalvolki_old_religious_story_response:90 "Кругом одни фанатики..."

  journey_event_kalathipsomi_veteran_sjalvolki_old_witnessed_surrender_story:90 "#F «Могила Крезокса! Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там, чтоб вы знали! Столько десятилетий назад, столько веков! Но я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там! Сама я [Select_CString(generated_journey_character.IsFemale, 'была лучницей', 'был лучником' )] в личной свите Кенвара. Он усадил меня на какие-то руины, на арку, чтобы я [Select_CString(generated_journey_character.IsFemale, 'держала', 'держал' )] аверсарианцев на мушке на случай, если они вздумают что-то выкинуть. Чуть не пристрелила того знаменитого парня, когда он пошел бить рожу Крезоксу! Ха! Но я не [Select_CString(generated_journey_character.IsFemale, 'сделала', 'сделал' )] этого, и его повалили. Хотя в самого Крезокса я едва стрелу не пустила, ну и ублюдок же он был!\n\nЯ [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там, когда он отдал собственных людей в рабство, чтобы спасти свою шкуру, [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там, когда Кенвар затем всех их освободил, а его самого бросил его бывшим рабам. Хороший был день, хороший. Некоторые сьялволки говорили, что это глупость — отпускать столько аверсарианцев, мол, они опасны и у них перед нами кровный долг. Но я [Select_CString(generated_journey_character.IsFemale, 'знала', 'знал' )] Кенвара, он никогда не совершал неверных шагов, ни единого разу. Если бы он велел нам всем молиться на их Чистейшего или как они его там звали, я бы [Select_CString(generated_journey_character.IsFemale, 'сделала', 'сделал' )] это в мгновение ока.\n\nВот что было прекрасным в тогдашней жизни, чего потом уже не хватало. С Истребителем Ведьм тебе никогда не приходилось думать. Ты просто знал: если делаешь то, что он говорит — ты всегда остаешься хорошим человеком. А после? Каждый сам за себя... потому вся эта гниль и началась, полагаю».#!"
  journey_event_kalathipsomi_veteran_sjalvolki_old_witnessed_surrender_story_response:90 "Свобода — штука непростая, верно?"

