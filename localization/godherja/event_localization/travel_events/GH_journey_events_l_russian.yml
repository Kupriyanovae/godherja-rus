  journey_event_kalathipsomi_veteran_aversarian_old_deserter_story:90 "#F «Я еще [Select_CString(generated_journey_character.IsFemale, 'совсем девчонкой воевала', 'совсем пареньком воевал' )] в Землях Кланов, чтоб вы знали. В легионах. Какое-то местное ополчение из благородных, человек тридцать от силы, ничего серьезного. У нас даже номера не было. Мотались по Землям Кланов, воевали то с очередным вождем, то с разбойниками — да вообще со всеми подряд. А потом пришли сьялволки, о, ну и зрелище это было! Все эти северяне, столько разных культур и цветов кожи, повсюду черепа да трофеи. Ничего подобного я в жизни не [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' ).\n\nЯ [Select_CString(generated_journey_character.IsFemale, 'была всего лишь девчонкой', 'был всего лишь мальчишкой' ), [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] совсем еще ребенком... много чего [Select_CString(generated_journey_character.IsFemale, 'повидала', 'повидал' )], но такого — никогда. Куда проще смотреть в упор на таких же аверсарианских пареньков от других аверсарианских лордов и тыкать в них копьем — по крайней мере, ты понимаешь, кто перед тобой стоит. Но сьялволки? Страшнее их я никого не [Select_CString(generated_journey_character.IsFemale, 'встречала', 'встречал' ). Один из них даже ехал верхом на мамонте, на настоящем, сука, мамонте.\n\nПроиграли мы первый же бой, да так, что пятки сверкали. В ту же ночь я и [Select_CString(generated_journey_character.IsFemale, 'дезертировала', 'дезертировал' )]. Ну уж нет, воевать со сьялволками я не собиралась, я ж не сумасшедшая [Select_CString(generated_journey_character.IsFemale, 'была', 'был' ). Столько лет прошло с тех пор, целая жизнь, а меня так и не поймали. И я ни разу не [Select_CString(generated_journey_character.IsFemale, 'подумала', 'подумал' ), что сделала неправильный выбор».#!"
  journey_event_kalathipsomi_veteran_aversarian_old_deserter_story_response:90 "Мудрость — это добродетель, даже для дезертира."

  journey_event_kalathipsomi_veteran_aversarian_old_surrendered_story:90 "#F «В юности я [Select_CString(generated_journey_character.IsFemale, 'была из знати', 'был из знати' )], чтоб вы знали. Второй ребенок котексира, правда, совсем незнатного. Совсем незнатного... у нас земли было меньше, чем у многих горожан, честное слово. Бывали рабы-иронийцы, у которых во владении находилось больше земли, чем у нашей благородной крови. Но я тяжело [Select_CString(generated_journey_character.IsFemale, 'работала', 'работал' )], когда [Select_CString(generated_journey_character.IsFemale, 'была молода', 'был молод' )] и [Select_CString(generated_journey_character.IsFemale, 'сильна', 'силен' )] как бык. И [Select_CString(generated_journey_character.IsFemale, 'глупа', 'глуп' ) же как бык! Собрала себе отряд под командование в одном из младших государственных легионов, 19-м Драконьей Крови — сначала человек сто под моим началом было, а за год уже до тысячи разрослось. Я [Select_CString(generated_journey_character.IsFemale, 'была восходящей звездой', 'был восходящей звездой' ).\n\nА потом грянула катастрофа. Воевать против мятежных вождей и рабов — это одно, но воевать против сьялволков? Совсем другое дело. Чудовища, натуральные чудовища. Яростный вихрь из бород и клинков, способный нагнать жути на любого мужчину. Легионы тогда раскололись на кучу разных группировок, у всех были свои интересы и верность. Каждая банда представляла собой помесь какого-то выскочки, объявившего себя архилегатом над той кучкой легионов, которую ему удалось сполитиканствовать, и поддержки случайных полевых командиров. Так войну не ведут, абсолютно идиотское дело, но кто станет слушать второго ребенка нищего котексира? Тьфу!\n\nТам был Горный пакт и Северная власть, они воевали за Черные горы с губернаторшей и каким-то варваром. Я [Select_CString(generated_journey_character.IsFemale, 'служила', 'служил' )] в армии Крезокса, это было самое крупное собрание легионов и единственная хоть сколько-то организованная сила, которую поддерживали военачальники вдоль реки и старые семьи маршеров. В основном мы воевали против Лиги Бронзового Города — кучки других легионов, купленных прибрежными лордами. И еще против Командования Старейшего, раз уж им вел Дексос... Старейший, как его все звали. [Concept('magi','Маги')|E] и их имена, сами понимаете.\n\nМы сражались против Бронзового Города и людей Старейшего, но получали удар за ударом. Нас зажали у Десяти Деревьев после того, как отряд Старейшего угодил в засаду как раз в тот момент, когда мы проходили через ту же самую глушь. В итоге это уничтожило обе наши армии. Крезокс, старый ублюдок, после этого умудрился просрать вообще всё, что только было возможно. Мы потеряли столько офицеров, что я сидела на стратегических советах бок о бок с мужами вдвое старше и выше меня чином, и меня так тошнило от этого идиотизма, что я прямо в лицо сказала Крезоксу, что он ведет нас к катастрофе и ведет себя так, будто в его венах течет больше рабской крови, чем человеческой.\n\nЗа это он приказал меня повесить, но мне повезло. Засада сьялволков началась прямо во время казни. Да, всё верно, я и есть та самая повешенная из старой байки. „Бой у петли“, как они любят это называть, словно это какая-то сказочка. Некоторые из простых солдат знали, что я всего лишь [Select_CString(generated_journey_character.IsFemale, 'пыталась', 'пытался' )] уберечь крестьян от расплаты за глупость их начальства, так что они меня срезали. Дикайносский закон всё еще действовал для легионов под судом, но закон гласил лишь то, что подследственные солдаты лишаются командования. А поскольку Крезокс так и не устроил мне формального суда, то мое командование всё еще оставалось при мне.\n\nЯ собрала своих солдат, взяла под руку половину остальных, а затем сдалась. К моему счастью, Крезокс к тому времени уже сделал то же самое, просто забыл предупредить парней на передовой, конечно же. Жалкая попытка зачистить подразделения, которые, как он чувствовал, были настроены против него сильнее всего. А потом этот идиот попытался предложить нас всех в качестве рабов! Легат Мескранакс из легиона Старейшего, „Чистейший из Чистых“, попал в плен в этой каше и сдавался вместе с нами. Предложить Мескранакса в рабы?! Слава богам, у людей хватило дисциплины исполнить приказ, иначе они бы не скрутили Мескранакса, когда тот бросился на этого жирдяя.\n\nКонечно, вы наверняка знаете, что было дальше. Нас всех освободили, Крезокса бросили рабам и позволили им разорвать жирного ублюдка в клочья, до единой ниточки. Идиотизм, само собой. Отдайте хозяина его рабам, и всё, чему вы их научите — это никогда больше не уважать тех, кто выше их по праву рождения, но что сделано, то сделано. Меня успели сделать рабом, а Истребитель Ведьм приказал нам никогда больше не брать в руки оружие и не участвовать в войнах, а жить мирной жизнью. Приказ остается в силе, пусть даже нас и освободили — таковы права раба. И вот так я и живу все эти десятилетия, ни разу не осмелившись снова взяться за меч. Первый раз оказался слишком изнурительным, как ни крути...»#!"
  journey_event_kalathipsomi_veteran_aversarian_old_surrendered_story_response:90 "По крайней мере, Перевала удалось избежать."

  journey_event_kalathipsomi_veteran_aversarian_old_respectful_story:90 "#F «Я воевала в Землях Кланов, чтоб вы знали. Много лет назад, десятилетия уже прошли, если честно. Я тогда [Select_CString(generated_journey_character.IsFemale, 'была молода', 'был молод' ), ох как [Select_CString(generated_journey_character.IsFemale, 'молода', 'молод' )]! Молодость-то у меня была, а вот половины мозгов не хватало, но молодость была. Я [Select_CString(generated_journey_character.IsFemale, 'служила', 'служил' )] в войсках Бронзовых Городов, ох и гордые же они были. А теперь никто уже и знать не знает, что это вообще за Бронзовые Города такие. Думаю, так им и надо за то, что назвали себя в честь нагрудника какого-то лорда, а не в честь того, что они на самом деле производят.\n\nО, я знаю, никто не любит тех, кто заявляет, будто сражался за Право Крови в Землях Кланов. Нас считают либо позорищем, либо дураками. Сама я этим не горжусь — я имею в виду, самими действиями. Горжусь тем, что отслужила, что сделала хоть что-то и впервые в жизни выбралась за пределы родного города. А сьялволки? Они делали то, что должны были делать, я на это так смотрю. Вожди приказали нам остановить их, а им нужно было прорваться на юг.\n\nКое-кто затаил обиду, но я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] вместе с Патосом, когда мы сдались Истребителю Ведьм. Этот человек мог перебить нас всех до единого, но позволил нам вернуться домой с миром... И я не могу назвать это иначе, кроме как благородством, пускай некоторые и кличут это слабостью. Мы бы на его месте тогда так не поступили... Он был честным человеком, прямо как те, кем мы сами лишь притворялись. И я никогда не перестану быть благодарной за это».#!"
