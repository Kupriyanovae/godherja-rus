l_russian:
 gh_journey_event.0002.t:90 "Путник на дороге"
 gh_journey_event.0002.desc:90 "Солнце заходит во время нашего путешествия по землям провинции [ROOT.Char.GetCurrentLocation.GetName], и [listener_1.GetFirstName] вскоре собирает отряд, чтобы разбить лагерь. Проходит совсем немного времени, прежде чем мы устраиваемся у нашего скромного костра, но нас прерывает возглас дозорного, заметившего приближающуюся к лагерю фигуру.\n\nПеред нами стоит [ROOT.Char.Custom('RandomCharacterAdjective')] путник. [Select_CString(generated_journey_character.IsFemale, 'Она поднимает', 'Он поднимает' )] руки в знак мира и через некоторое время сообщает нам, что просто путешествует и не желает нам зла. Пока [Select_CString(generated_journey_character.IsFemale, 'она говорит это нам, я вижу, как ее', 'он говорит это нам, я вижу, как его' )] глаза с тоской косятся на теплый костер."
 gh_journey_event.0002.a:90 "Присоединяйся к нам у костра сегодня вечером."
 gh_journey_event.0002.b:90 "Проваливай, [Select_CString(generated_journey_character.IsFemale, 'презренная попрошайка', 'презренный попрошайка' )]!"
 gh_journey_event.0002.c:90 "Мы не желаем тебе зла! Если, конечно, ты отдашь нам свой кошель..."

 gh_journey_event.0003.t:90 "Путник на дороге"
 gh_journey_event.0003.start.desc:90 "[generated_journey_character.GetFirstName] присаживается у костра с угрюмым и оборванным видом.\n\n"
 gh_journey_event.0003.desc:90 "[ROOT.Char.Custom('GetJourneyEventStory')]"
 gh_journey_event.0003.a:90 "[ROOT.Char.Custom('GetJourneyEventStoryResponse')]"

 manlike:90 "[Select_CString(generated_journey_character.IsFemale, 'Человекоподобная', 'Человекоподобный' )]"
 horselike:90 "[Select_CString(generated_journey_character.IsFemale, 'Подобная лошади', 'Подобный лошади' )]"
 old:90 "[Select_CString(generated_journey_character.IsFemale, 'Старая', 'Старый' )]"
 featureless:90 "[Select_CString(generated_journey_character.IsFemale, 'Безликая', 'Безликий' )]"

 ## ELYSIA VETERANS ##

 # Aversarians - Young
	journey_event_elysia_aversarian_young_legionnaire_story:89 "#F «Это ведь было не так уж давно, верно? Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] в Восьмом легионе, „Энортакс“. „Единство“ на старом диалекте. Ну и где теперь это единство, а? По нам сьялволки ударили первыми, еще до перевала. К востоку от Маклеанского тракта. Нам говорили, что мы идем просто подкрепить форт Лархка, мол, сьялволки не смогут взять его месяцами. Ага, как же! Мы прошли только половину пути, даже доспехи не надели, когда орда ударила прямо в лоб.\n\nНу и битва. Продержались от силы пару часов, а потом гордость Аверсарии бежала, поджав хвосты, словно за нами гнался сам ад. Наверное, так оно и было. Они схватили нашего легана, подняли её перед всеми нами, прямо перед тем, как её отец из Девятнадцатого бросился в атаку. Я [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' )] это, пока мы пытались перегруппироваться с остальными. Они почему-то позволили нам это сделать, позволили вернуться в строй как раз вовремя, чтобы встретить [Concept('the_fog','Туман')|E].\n\nЯ [Select_CString(generated_journey_character.IsFemale, 'была молода', 'был молод' )]. И сейчас еще [Select_CString(generated_journey_character.IsFemale, 'молода', 'молод' )]. Быстрые ноги. Про меня говорили, что я самый быстрый ребенок в легионе. Мы все бросились наутек, и я [Select_CString(generated_journey_character.IsFemale, 'первой вырвалась', 'первым вырвался' )] из этой заварухи. Несколько парней... немного... но несколько человек пошли со мной. Мы добежали до ближайшей деревни, сбросили доспехи, и больше никто из нас не брал в руки меч...»#!"
  journey_event_elysia_aversarian_young_legionnaire_story_response:89 "По крайней мере, тебе удалось сохранить жизнь."

  journey_event_elysia_aversarian_young_cavalry_story:89 "#F «Вы были на перевале? Нет? Жаль, не так уж много из нас готовы говорить об этом. Я понимаю, правда. Но мне всегда казалось, что если выговориться, станет легче, хотя, может, это только у меня так. Не могу постоянно думать о том, что люди молчат. Это слово у нас дома, в [Aversarian Barony], теперь как проклятие. Скажешь „Элизия“ на рынке — и все замирают и смотрят на тебя.\n\nЯ [Select_CString(generated_journey_character.IsFemale, 'служила', 'служил' )] в коннице. 43-й легион. Из благородных, так что не сказать чтобы совсем простой. Но я [Select_CString(generated_journey_character.IsFemale, 'была самой молодой всадницей', 'был самым молодым всадником' )], гордость всей деревни, когда легон Мехрес увидел, как я скачу, и сказал, что хочет видеть меня в легионе. Я [Select_CString(generated_journey_character.IsFemale, 'гордилась', 'гордился' )] собой. Да и сейчас горжусь, наверное.\n\nЯ знаю, что говорят. Сьялволки пустили [Concept('the_fog','Туман')|E], и это нас погубило. Но я в это не верю. Не согласен. Я [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' )] всё сверху, с лошади, мы стояли на вершине холма слева от перевала. Лицом к сьялволкам... иссирокам, кажется? В общем, мне было видно отлично. У нас изначально не было шансов. Легионы уже отступали, когда сьялволки только показались. Это всегда дурной знак, когда строй пятится. Значит, им страшно. Я [Select_CString(generated_journey_character.IsFemale, 'осталась', 'остался' )] с легионом и потом, когда Мехрес погиб, а половина из нас разбежалась. И каждый раз, когда мы проигрывали, я вспоминал то же самое. Никто не выигрывает битву, в которую боится вступить».#!"
  journey_event_elysia_aversarian_young_cavalry_story_response:89 "В этих словах есть доля мудрости."

  journey_event_elysia_aversarian_young_deserter_story:89 "#F «Элизия... Элизия... К черту этот перевал. К черту легионы. К черту их всех.\n\nЯ [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] в одном из них. В государственном легионе. Лучшие из лучших, притворялись они, хотя я в глаза не [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' )] настоящих тренировок, потому что этот... как его... Эшрей взорвал всё еще до моего рождения. Мне дали доспехи, дали копье, заставили слишком много бегать и заявили, что я [Select_CString(generated_journey_character.IsFemale, 'готова', 'готов' )] к бою. Какая же это была чушь. Они были в отчаянии, хватали каждого, кого могли отправить на север.\n\nЯ [Select_CString(generated_journey_character.IsFemale, 'сбежала', 'сбежал' )] при первой же возможности. Но все равно слишком поздно, как мне кажется. Мне пришлось это увидеть. Сьялволки выстроились, и всё было кончено, как только ударил этот Туман, и все начали спотыкаться и метаться. Я [Select_CString(generated_journey_character.IsFemale, 'бежала', 'бежал' )] как безумная. Да я и так [Select_CString(generated_journey_character.IsFemale, 'планировала', 'планировал' )] сбежать еще до битвы. Дома меня ждала семья, о которой нужно заботиться, а с легионом этого не сделаешь. Жаль, что я не [Select_CString(generated_journey_character.IsFemale, 'сбежала', 'сбежал' )] раньше... Меня называют [Select_CString(generated_journey_character.IsFemale, 'трусихой', 'трусом' )]. Но в тот день бежали все, и половина больше никогда не возвращалась в бой. Умные не возвращались, по крайней мере. А все остальные мертвы, насколько мне известно».#!"
  journey_event_elysia_aversarian_young_deserter_story_response:89 "Там явно было не место для отваги, верно?"

  journey_event_elysia_aversarian_young_slave_story:89 "#F «Я [Select_CString(generated_journey_character.IsFemale, 'была рабыней', 'был рабом' )]. Теперь-то можно об этом говорить, ведь потом меня освободили. Но я [Select_CString(generated_journey_character.IsFemale, 'родилась рабыней', 'родился рабом' )], где-то в Опахасии, кажется, но легион забрал меня еще до того, как я [Select_CString(generated_journey_character.IsFemale, 'научилась ходить', 'научился ходить' )].\n\nЯ не держу на них зла. На аверсарианцев. Я и [Select_CString(generated_journey_character.IsFemale, 'сама', 'сам' )] из них, полагаю. С рождения я не [Select_CString(generated_journey_character.IsFemale, 'знала', 'знал' )] ничего, кроме легиона, да и сейчас мало что знаю. Я [Select_CString(generated_journey_character.IsFemale, 'провела', 'провел' )] там большую часть жизни, [Select_CString(generated_journey_character.IsFemale, 'завела', 'завел' )] друзей, кого-то не [Select_CString(generated_journey_character.IsFemale, 'взлюбила', 'взлюбил' )], но так ведь везде устроена жизнь.\n\nЕдинственный раз, когда я [Select_CString(generated_journey_character.IsFemale, 'подумала', 'подумал' )] о бегстве, был на перевале. Элизийский перевал. Да, именно там. Я мало что помню, память у меня хорошая, но это было... слишком. Слишком много всего обрушилось разом, особенно после того, как тот легион примчался с криками и сломал весь наш строй. Я [Select_CString(generated_journey_character.IsFemale, 'стояла', 'стоял' )] прямо на краю шеренги, к которой они примкнули. Вид у них был ужасный, у нас аж поджилки затряслись.\n\nА после? Всё как в тумане. [Concept('the_fog','Туман')|E] был повсюду. Помню только, как [Select_CString(generated_journey_character.IsFemale, 'увидела', 'увидел' )] своего лейтенанта... лейтенанта Аполлер... она лежала на земле, а под грудью у нее торчал какой-то шип. Из кости, от одной из тех [Concept('fogbeasts', 'туманных тварей')|E], которых варвары призвали своей... темной магией. Я схватил её и побежал, сам не зная зачем, ведь она мне особо и не нравилась. Но когда мы выбрались в безопасное место и зализывали раны, подошли уцелевшие бойцы и сказали ей, что теперь она леган. Что-то вроде... я плохо разбираюсь в цифрах, но где-то тридцать офицеров выше нее погибли. И как леган она объявила меня свободным человеком. Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] так [Select_CString(generated_journey_character.IsFemale, 'благодарна', 'благодарен' )]... оставался с ней какое-то время, а потом ушел...»#!"
  journey_event_elysia_aversarian_young_slave_story_response:89 "Из грязи в князи, в некотором роде."

  journey_event_elysia_aversarian_young_proud_story:89 "#F «Элизийский перевал — это была последняя битва, в которой я [Select_CString(generated_journey_character.IsFemale, 'сражалась', 'сражался' )]. За родину, конечно же! Не смотрите на меня так! Мне плевать, что мы проиграли, мы делали это ради своих домов. Столько легионов, сколько никогда прежде не собиралось! Это было прекрасное зрелище, когда мы маршировали, я готов был благодарить первый попавшийся легион только за то, что мне позволили идти в их строю.\n\nБитва? Битва должна была стать нашей! Сьялволкам пришлось прибегнуть к уловкам и темной магии, чтобы получить хоть какой-то шанс. Но до того, как по нам ударил [Concept('the_fog','Туман')|E]? Всё было отлично! Наверное, это даже не сьялволки его призвали, сомневаюсь, что они вообще умеют обращаться с [Concept('magic', 'магией')|E], как наши люди. Скорее всего, это была просто слепая удача, которую они вымолили у своих богов.\n\ны были сильны. Храбры. Никто не дрогнул. Мы увидели сьялволков и готовы были издать победный клич! Все были готовы к этой драке. Мы бы победили, уверяю вас... победили бы. Если бы только они сражались как мужчины... а после, ну. Ногу мне знатно раздробило, да и руку тоже, так что воевать я больше не [Select_CString(generated_journey_character.IsFemale, 'могла', 'мог' )]. Но будь я проклят, если позволю кому-то сказать, что за этот бой не стоило держаться. Я [Select_CString(generated_journey_character.IsFemale, 'горжусь', 'горжусь' )], что [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там. Это должно было иметь смысл, верно? Должно было... всё это...»#!"
  journey_event_elysia_aversarian_young_proud_story_response:89 "Чего только мы себе не внушаем..."

	# Aversarian - Young - Magi
		journey_event_elysia_magi_aversarian_young_bitter_story:90 "#F «Элизия. Знаете это место? Перевал? Конечно знаете, весь мир знает. Ни один [Concept('aversaria', 'аверсарианец')|E] дня не проживет, чтобы не наслушаться об этой глупости. И да, судя по моему унылому тону и обилию шрамов, я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] на перевале, как проницательно с вашей стороны.\n\n12-й вспомогательный отряд [Concept('magi', 'магов')|E]. В прежние времена легионы были полностью укомплектованы величайшими из магов. К '52 году, конечно, в легионах не осталось ни одного мага, который стоил бы хоть половины своего ума, хоть в государственных, хоть в каких. Когда пришел великий призыв выступать на север, внезапно каждый государственный легион осознал, насколько гибельным будет это предприятие, и стал вербовать каждого мага, какого только мог найти. И вот там [Select_CString(generated_journey_character.IsFemale, 'оказалась я', 'оказался я' )], нелюбимый седьмой ребенок из династии прихлебателей, едва способной произвести на свет хотя бы одного талантливого мага вроде меня. И конечно же, Мавия, о, Мавия! Чудесный 18-й штат, который вела сама Роза Легиона! Легион Сансии, дружище! Легион Сансии!\n\nИ много пользы это принесло армии? Гордость Сансии? Какая шутка, один из самых прославленных государственных легионов в истории аавтократии оказался не более чем разношерстным сбродом разбойников, которые за последний век едва умудрялись выживать хоть чертову неделю, чтобы их не вырезали до единого. А их маги! Что за шваль, я поверить не [Select_CString(generated_journey_character.IsFemale, 'могла', 'мог' )]. Выпускники низших Майикпрололланов. Да! Да, я уверен, вы можете представить себе их... класс. Едва ли лучше рабов, говорю вам, едва лучше! Кучка простолюдинов, которые едва отличали Ритуал Призыва Тощего от Ритуала Летающего Дворца Этиадда! Отвратительная работа, воистину.\n\nА потом перевал! Сам перевал! И вот я, [Select_CString(generated_journey_character.IsFemale, 'молодая и слишком талантливая дочь', 'молодой и слишком талантливый сын' )] бесталанной семьи, отправляюсь с выродившейся военной организацией на обреченную битву, чтобы добыть „славу“ роду, который пал так низко, что мы превратились из Четырнадцатых Герольдов Выверновых Гнезд Аавтократора Криоса в полукровок и мусор. Мои соратники были дураками, и вскоре я [Select_CString(generated_journey_character.IsFemale, 'поняла', 'понял' )], что мой легон тоже дурак. Какую славу я [Select_CString(generated_journey_character.IsFemale, 'заслужила', 'заслужил' )] себе. Потерю своей красоты и любых хороших снов, которые мне когда-либо могли присниться. За государство. За человечество. За какого бы чертова аавтократора они ни молились в тот день. Повезло хоть руки сохранить, полагаю, но именно в тот день я [Select_CString(generated_journey_character.IsFemale, 'поняла', 'понял' )], насколько идиотским было мое государство. Мои соотечественники. Теперь я занимаюсь магией у себя дома, и подальше от чужих глаз».#!"
    journey_event_elysia_magi_aversarian_young_bitter_story_response:90 "В конце концов, у истории всегда есть проигравшие."

    journey_event_elysia_magi_aversarian_young_scarred_story:90 "#F «Я... я... вы сказали [Concept('the_fog','Туман')|E]? Нет? Ох... Простите. Я... прошу прощения.\n\nЧто я... нет, я не катраддец, нет и... да, хорошо, да. Элизийский перевал, я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там, да... легион... 20-й, „Собственный Конклава“... из благородных, его подняли жрецы в Ораисполе. Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )]... всего лишь сиротой, просто ребенком тогда. Вербовщик ходил и хватал людей, на некоторых даже мешки надевал... привезли нас на тренировочное поле, дали неделю, а потом выдали доспехи... и оружие и... и отправили нас.\n\nЭто... это было не... все свои шрамы я [Select_CString(generated_journey_character.IsFemale, 'получила', 'получил' )] там. Мой глаз всё еще на месте, но я [Select_CString(generated_journey_character.IsFemale, 'лишилась', 'лишился' )] половины лица и... и моих рук... о, Чистейший, они забрали мои руки. Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] [Concept('magi', 'магом')|E], я... я сама даже не знала. Так [Select_CString(generated_journey_character.IsFemale, 'испугалась', 'испугался' )], когда вербовщик схватил меня, что из моих рук заструился свет. Повезло, что не взорвала себя, сказали они... какая удача... какая удача это была. Я тренировалась с другими новобранцами, но мной руководил наставник. Сказал, что раньше был магом у Аксиотеи, сказал, что если буду его слушать, то останусь в живых...\n\nЯ осталась в живых, да... я побежала. Бежала так далеко, как только могла. Но все равно не спаслась, какое-то... какое-то чудовище, какая-то тварь. Она... она выглядела... выглядела как... как собака с лицом человека и... она навалилась на меня и выдохнула... огонь и... о, Чистейший, я не могу. Сьялволки нашли меня, когда я [Select_CString(generated_journey_character.IsFemale, 'пыталась', 'пытался' )] уползти... без половины ноги, истекая кровью. Зачем они пощадили меня? Я... я не знаю. Не знаю, зачем эти дикари это сделали. Они... они забрали мои руки. Сказали, что я маг, сказали, что Истребитель Ведьм приказал всем магам отрубать руки, и... пожалуйста, я больше не могу. Простите».#!"
    journey_event_elysia_magi_aversarian_young_scarred_story_response:90 "Не все остаются молодыми..."

    journey_event_elysia_magi_aversarian_young_young_story:90 "#F «Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] на Элизийском перевале, знаете ли... да, знаю, по мне не скажешь, говорят, слишком [Select_CString(generated_journey_character.IsFemale, 'молода', 'молод' )]. Я [Select_CString(generated_journey_character.IsFemale, 'родилась', 'родился' )] прямо в легионе. Отец был магом в легионе, говорил, что я — маленькое легионное чудо, и все радовались или вроде того. Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] совсем ребенком, когда мы отправились в Элизию, шесть лет от роду. Думала, это самое потрясающее приключение. Папа посадил меня на повозку в обозе, где работала мама, и... это был последний раз, когда я видела отца.\n\nПовезло, что выжила. Они всегда говорят о [Concept('the_fog','Тумане')|E], который накрыл армию, и забывают, что там был обоз. Представьте, что вы — молодая мать, моя мама. Девушка, которой нет и двадцати лет, отец твоего ребенка ушел сражаться на войну, и вдруг чудовища, про которых ты всегда говорила сыну, что они не прячутся в темноте, оказываются повсюду. Она пыталась меня вывезти. Взяла повозку и погнала коней, я даже помню, как она ударила демона кулаком в морду, когда тот приземлился прямо перед нами...\n\nНо потом повозка перевернулась где-то в лесу. Демон оторвал маме руку. Шесть лет, мой день рождения был всего за пару дней до этого. Шесть лет, и я [Select_CString(generated_journey_character.IsFemale, 'держала', 'держал' )] маму, пока она истекала кровью... [Select_CString(generated_journey_character.IsFemale, 'приписанная', 'приписанный' )] к легиону с рождения, который погиб до единого человека шесть лет спустя... Мне даже сказали об этом сразу после, некоторые из выживших, кто нашел меня. Рассказали мне всю оставшуюся жизнь. Туманные твари тянутся к магии. Я [Select_CString(generated_journey_character.IsFemale, 'сама навлекла', 'сам навлек' )] их на свою маму... Перевал... Как бы мне хотелось просто забыть об этом».#!"
    journey_event_elysia_magi_aversarian_young_young_story_response:90 "#F «История забывает тех, кто оказался зажат посреди жерновов».#!"

 # Aversarians - Old
	journey_event_elysia_aversarian_old_lieutenant_story:90 "#F «Да, я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там. Мы называли это Перевалом. [Select_CString(generated_journey_character.IsFemale, 'Офицер', 'Офицер' )] легиона, всего лишь лейтенант тогда, и больше ничего после...\n\nЯ не горжусь этим, да и кто бы гордился? Накануне я [Select_CString(generated_journey_character.IsFemale, 'думала', 'думал' )], что стану будущим героем Аверсарии. Я [Select_CString(generated_journey_character.IsFemale, 'прошла', 'прошел' )] путь от улиц [Aversarian city] до собственного офицерского поста в легионе. Я [Select_CString(generated_journey_character.IsFemale, 'была молода', 'был молод' )... и мои ноги ходили! Но все это рухнуло, сами знаете. Вы ведь слышали истории.\n\nЯ [Select_CString(generated_journey_character.IsFemale, 'вела', 'вел' )] своих людей в бой четыре раза, даже когда на нас опустился [Concept('the_fog','Туман')|E]. Вперед и вперед, снова и снова, и каждый раз рядом со мной оставалось все меньше людей. В этом не было ничего героического, понимаете. Мы не пытались сломить врага, мы просто пытались прорубить себе путь наружу. В конце концов мы прорубились, и я [Select_CString(generated_journey_character.IsFemale, 'бежала', 'бежал' )] через кустарники... а потом [Select_CString(generated_journey_character.IsFemale, 'поняла', 'понял' )], что никто больше со мной не бежит... Я [Select_CString(generated_journey_character.IsFemale, 'смотрела', 'смотрел' )] по сторонам какое-то время, затем [Select_CString(generated_journey_character.IsFemale, 'сняла', 'снял' )] доспехи и просто [Select_CString(generated_journey_character.IsFemale, 'пошла', 'пошел' )] домой. Больше я не слышала ни об одном выжившем из моего отряда... Меня даже называют везучим человеком... Тоже мне, везение...»#!"
  journey_event_elysia_aversarian_old_lieutenant_story_response:90 "То были совсем другие времена..."

  journey_event_elysia_aversarian_old_proud_story:90 "#F «Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там, в самой Элизии! В самом ее сердце! Что? Нет, я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] с аверсарианцами! Плоть от плоти, гордость Малькои! К тому времени я уже прилично [Select_CString(generated_journey_character.IsFemale, 'прослужила', 'прослужил' )] в легионе, маршировала то против одного ийросского вождя, то против другого. Потом даже против Черепоруба немного, сам не знаю, как выжила! Ха-ха!\n\nГоворят, в этом перевале не было ничего славного. К черту их. Мы сражались как мужчины, даже когда сьялволки этого не делали. Стояли на смерть и дрались, имело это смысл или нет. Рассказывают, что сьялволки призвали эту мерзость, этот „[Concept('the_fog','Туман')|E]“, но я в этом тоже не уверен. Там были и чудовища, не знаю, должны ли они были там быть. Может, их тоже сьялволки призвали, а может, они просто прибрели на запах крови. Никогда ничего подобного не [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' )...\n\nНо мы дрались и с ними! Проиграли? Да, проиграли, но хотя бы дали бой. Кто-то ведь должен был. Кто-то должен был показать, что аверсарианцы все еще умеют сражаться. По крайней мере, гордость мы сохранили...»#!"
  journey_event_elysia_aversarian_old_proud_story_response:90 "По крайней мере, вам удалось спасти свою гордость?"

  journey_event_elysia_aversarian_old_engineer_story:90 "#F «Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] с легионами на перевале, знаете ли. Повезло, правда, что я [Select_CString(generated_journey_character.IsFemale, 'была не солдатом', 'был не солдатом' )]. Отец мой был архитектором в Ораисполе, но к тому времени, как я подрос, там уже мало кто что-то строил. Людей не хватало из-за Гражданской войны, да и то заклинание... У меня тоже было немного магии, но не настолько, чтобы стать [Concept('magi', 'магом')|E], так что я освоил ремесло и отправился в путь. Легион меня в конце концов подобрал — форт ли строить, театр ли, разницы-то нет.\n\nЯ возводил там укрепления. Никто о них не помнит, наверное, они особо и не пригодились, но легионы строили дамбы и редуты по всему перевалу. Классическая тактика легиона, знаете ли. Построить что-то, удерживать это и стоять достаточно долго, чтобы маги успели сделать хороший залп и обрушить на них ад.\n\nНи единым не воспользовались. Никто, кроме меня, по крайней мере. Я [Select_CString(generated_journey_character.IsFemale, 'находилась', 'находился' )] на одном из холмов, когда [Concept('the_fog','Туман')|E] накрыл перевал. Смотрю, как он заполняет низину, и в следующий миг сьялволки уже повсюду. Я [Select_CString(generated_journey_character.IsFemale, 'забилась', 'забился' )] под одно из своих укреплений и сидел там, пока все не закончилось. Какой-то варвар сцапал меня после, но обращался неплохо. Вскоре они меня отпустили, и после этого я просто ходил и строил всякое то для одних, то для других. Ну и денек был, ну и денек... Рад только, что не оказался в самом низу».#!"
  journey_event_elysia_aversarian_old_engineer_story_response:90 "Весьма необычный взгляд на те события."

  journey_event_elysia_aversarian_old_legionnaire_story:90 "#F «Больше всего из Элизии мне запомнились щиты. Тысячи щитов, выстроенных в ряд и сияющих на солнце... или было пасмурно... неважно. Железные щиты из Малькои, старые и покрытые золотом из Опахасии, этепезейская бронза, украшенная драгоценными камнями из Айроноя. Были даже синие щиты морских легионов. Все выстроились вместе, и копья с наконечниками, похожими на капли крови, были наготове. А затем щиты на другой стороне — столько же деревянных и железных от сьялволков. И символы у всех, с обеих сторон...\n\nНикакой чести в этом не было. Никакой. Один легион, забыл какой, бросился вперед, и тут появился [Concept('the_fog','Туман')|E]. Повсюду. Мы сражались со сьялволками минут пятнадцать, прежде чем поняли, что бьемся... с чудовищами... вместо людей. Мы старались изо всех сил, пытались быть хорошими солдатами. Но все без толку... никто не выбрался... никто, кроме меня. И когда я... когда я закрываю глаза... я все еще вижу... Простите, на этом моя история окончена».#!"
  journey_event_elysia_aversarian_old_legionnaire_story_response:90 "Этого рассказа нам вполне достаточно, спасибо тебе."

	# Aversarian - Old - Magi
		journey_event_elysia_magi_aversarian_old_voices_story:90 "#F «Я... Элизия?! Вы сказали Элизия?! Элизия, Элизия... да... да, я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] в Элизии, да. Теперь старый стал, борода седая, какой тогда не было, кости сильнее скрипят... даже кровь не вся на месте. Старик я уже, старик. А тогда не [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )... не [Select_CString(generated_journey_character.IsFemale, 'была', 'был' ). Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] [Concept('magi', 'магом')|E] тогда. Магом... и гордился этим. Боевой маг прямиком из Майикпрололлана сто Спатас. Сын солдата, отправился воевать, как и мой отец.\n\nПеревал был моим третьим сражением, я [Select_CString(generated_journey_character.IsFemale, 'прошла', 'прошел' )] с Четырнадцатым вспомогательным корпусом через часть Калатипсоми. У легионов тогда так поджимало с магами, что им приходилось набирать отдельные формирования, знаете ли. Туда попало много молодых ребят, большинство из них даже образования не имели. Жалкое зрелище, большинство гибло еще до начала битвы... оно и к лучшему. К лучше... что? Что? Вы что-то сказали? Нет, не вы, я... я... простите. Что значит „там никого нет“... они все там. Они всегда там...\n\nНа перевале нас вывели на холм. Тактика легиона, знаете, тактика легиона... конечно, вы знаете, вы ведь были там... тактика легиона в том, чтобы люди в доспехах стояли впереди и принимали удары, пока ребята с огненными шарами вроде меня бьют во фланг... много толку это принесло... я вышел оттуда живым, каким-то чудом, и с обеими руками! Но ушел я не один... весь остальной легион. Все они. Единственный выживший из Четырнадцатого, и все маги, которые не хотели идти в этот [Concept('the_fog','Туман')|E], который их сожрал... так что теперь они со мной... и я не знаю, куда мы пойдем, когда умрем...»#!"
    journey_event_elysia_magi_aversarian_old_voices_story_response:90 "Ну конечно, старик... конечно."

    journey_event_elysia_magi_aversarian_old_dehanded_story:90 "#F «Элизия... о, прекрасная Элизия. Когда-то это был чудесный край, я родом оттуда. Мой двоюродный дядя правил этой землей... да, они правили... о, Чистейший, это было ужасно. Ужасающе. Я [Select_CString(generated_journey_character.IsFemale, 'была боевым магом', 'был боевым магом' )] в легионах, Двадцать Восьмой Государственный из Этепезеи. Нас называли... Непобедимыми нас называли. Ха-ха-ха! Смешные ребята. Леган Аэкскра, помню, как она стояла там, только-только получив должность после того, как легон Брукос обделывался до смерти целую вечность назад. Такая гордая в своих доспехах, она говорила нам: „Мужчины, пока вы стоите — Аверсария стоит! Пока я стою — Аверсария стоит! Пока я жива, я буду щитом Аверсарии!“\n\nХа-ха-ха! Аэкскра продержалась на перевале ровно минуту. Даже не дожила до момента с [Concept('the_fog','Туманом')|E]. Все забывают про стрелы, которыми они нас засыпали, потому что задело всего несколько человек, но кто же знал, что леган Двадцать Восьмого, зеница ока этого кабала, поймает стрелу прямо в глаз в первую же минуту? Меньше одного шанса на миллион, мы с некоторыми выжившими подсчитывали это у костра позже. Меньше одного на миллион. Стрела в глаз, одна из каких-то пятидесяти на тысячи.\n\nА я? Да, я знаю, что вы смотрите на... культяпки, которые остались вместо рук. Они забрали руки. Всем нам. Каждому магу из каждого легиона, и тем, кто был рядом. Большинство выживших отпустили, но маги лишились рук. Люди всегда толкуют о том, каким милосердным и добрым был Истребитель Ведьм... но он забрал мои чертовы руки. Один из шести человек легиона, кто остался в живых, и половина из нас даже без рук...»#!"
    journey_event_elysia_magi_aversarian_old_dehanded_story_response:90 "По крайней мере, здоровье при вас?"

    journey_event_elysia_magi_aversarian_old_sad_story:90 "#F «Я слышал, вы упомянули перевал... Полагаю, никого из вас, молодых, там не было. Не стыдитесь этого, я стар и немощен. Мои ноги едва сгибаются, а пальцы совсем застыли. Борода такая длинная, что я укрываюсь ей как одеялом, когда зябну. Спина так сгорблена, что мне проще смотреть вниз, когда я сижу. Да, да, я знаю, что заговорился. Позвольте старику поболтать, у большинства из нас мало что осталось. Менше всего у меня. Мне за сто лет, знаете ли. Да, больше века, причем без всякого вампиризма, можете не смотреть на меня так. Магия просто всегда заботилась обо мне, а я о ней.\n\nЯ отправился туда целую вечность назад, с каким-то легионом. Государственный, благородный, какая разница. Наемничий, губернаторский. Все эти старые названия сейчас мало что значат, да и тогда не особо значили. Я был молод до того, как рухнул мир, знаете ли, и не могу сказать, что тогда было намного лучше. Что бы там ни утверждали другие старые развалины вроде меня. Я был [Concept('magi', 'магом')|E], да. Большинство мальчишек знают меня по продаже фейерверков, а девчонки — любовных зелий... Я всегда просто даю им что-то, что заставляет их чувствовать себя увереннее, и говорю, что первый, на кого они посмотрят, влюбится в них. Хе-хе-хе, сам я детей иметь не могу, но, скажу я вам, видеть эти молодые улыбки...\n\nЛадно, ладно, перевал. Перевал... что о нем сказать? Был магом тогда, остаюсь магом и сейчас. Многим ребятам тогда отрубили руки, но я сбежал, не дался в плен. Большинство этим не гордятся, но зато я остался с руками! Извините, старая... старая шутка. Мне удалось открыть портал, меня выкинуло на Имперский остров, прямо на чудесный пляж. Сам не знаю, как у меня это вышло, заклинание было настолько выше моих сил, что я должен был взорваться, но страх — чертовски хороший эликсир... но... остальные. Они были неплохими ребятами, понимаете. Даже мы, маги. Просто... делали, что велено, маршировали... А [Concept('the_fog','Туман')|E]? Никто этого не заслуживал. Никто. Это было неправильно, совсем неправильно...»#!"
    journey_event_elysia_magi_aversarian_old_sad_story_response:90 "По крайней мере, вы оказались в прекрасном месте."

 # Sjalvolki - Young
	journey_event_elysia_sjalvolki_young_hero_story:90 "#F «Вы хотите услышать про перевал! Про перевал! Про Элизийский перевал! Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там, знаете ли, не так давно. Сражался бок о бок с самим Сокрушителем Ведьм! И все они были там, понимаете. Герои, легенды. Те, на кого мы смотрели и говорили: „Это они! Те самые из саги!“ Или из поэм, или от бардов, или откуда еще. Самое большое собрание великих, что я видел.\n\nСокрушитель Ведьм, конечно же, был там, я видел, как он отдавал приказы войскам, как истинный вождь, когда мы вошли. Никогда не забуду взгляд этого человека. Точнее, не человека. Нет. Кого-то другого. Сокрушитель Ведьм вполне мог быть каким-то богом из глубин, знаете ли. Как сам Велос!\n\nИ Топор-в-Руке! Она была там, я видел, как она разрубила человека надвое! А Сокрушитель Великанов разбил колени какому-то легону своим кистенем! Прямо на уровне глаз, ха-ха! Витикинд Выше-Глаза, Кунигунда Орлиная Стрела, Гунцелин Кровавая Борода! Все великие, все до единого.\n\nИ я тоже [Select_CString(generated_journey_character.IsFemale, 'стала одним из них', 'стал одним из них' )], знаете ли. Имя у меня уже было, но я помню, как шел по лагерю после боя. Патрамис — так назывался город, где мы обустроились. Зашел в пиршественный зал, который мы соорудили, и все пели мое имя, о том, как я убил сотню человек. Столько я не убил, конечно, но имя мое осталось там. В легендах. Меня упоминали прямо между Орлиной Стрелой и вождем клана Церилак. Я знал, что если умру прямо в тот миг, то буду пить мед с самим Велосом...»#!"
  journey_event_elysia_sjalvolki_young_hero_story_response:90 "Надеюсь, ты права."

  journey_event_elysia_sjalvolki_young_maimed_story:90 "#F «Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] на перевале. Получил свою долю добычи, полагаю, и сам убил кое-кого из них. Правда в том, что аверсарианцы были по большей части мертвы еще до того, как мы вошли как следует, [Concept('fogbeasts', 'туманные твари')|E] их знатно потрепали. Но я убил нескольких. Большинство из тех, на кого мы натыкались, были слишком глупы, ранены или напуганы, чтобы сбежать. Глупые доставляли больше всего хлопот. Другие обычно сдавались или не особо дрались, но глупые?\n\nДаже не стоит называть их глупыми, половина из них были вполне разумными. Просто абсолютно чертовски безумными к тому моменту. [Concept('the_fog','Туман')|E] так на тебя действует, полагаю, особенно если ты его раньше не видел. Один из них сидел, ссутулившись над мертвой [Concept('fogbeast', 'туманной тварью')|E], когда мы его нашли. Выплакивал все глаза и разговаривал с половиной тела своего друга.\n\nЯ поднял топор, схватил его за плечо и... следующее, что помню — я уже на земле. У него, оказывается, оставался меч. Развернулся в ту же секунду, как кто-то прикоснулся, и отрубил мне руку к чертям собачьим. Его прикончили сразу после, но для меня было слишком поздно. Теперь я даже работать не могу, другие должны делать это за меня. Половина чертова человека осталась от меня...»#!"
  journey_event_elysia_sjalvolki_young_maimed_story_response:90 "Похоже, не все победители вышли оттуда победителями..."

  journey_event_elysia_sjalvolki_young_lost_friend_story:90 "#F «Элизийский перевал... все мои ровесники думают, что это было самое великое событие, или жалеют, что их там не было. Но никто не говорит о тех, кто оттуда не вернулся, никто и никогда. Я и мой клан были там, весь клан, но еще и... мой лучший друг тоже был там. Не брат мне, но... считай, что брат.\n\nНе так уж много наших погибло, знаете ли. Аверсарианцев побили сильнее, почти все они полегли. Но мой друг... ну, он оказался одним из тех несчастных победителей, так сказать. Все ликовали, и я тоже... я даже видел, как Топор-в-Руке несли на руках через всю орду со шлемом того легона в руках. Но... я нашел его неподалеку. Стрела в шею, какой-то аверсарианец успел выпустить перед смертью, я полагаю.\n\nЯ не мог... не мог сражаться после этого. Не мог даже думать об этом. Мне сказали, что я добыл свою славу на перевале, никто не осудил меня, когда я сложил копье... но... без него... это... стоило ли оно вообще хоть чего-то? Хоть всё это?»#!"
  journey_event_elysia_sjalvolki_young_lost_friend_story_response:90 "Никогда не забываешь тех, кого пришлось оставить позади."

  journey_event_elysia_sjalvolki_young_bored_story:90 "#F «Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] на Элизийском перевале, знаете ли. Ничего особенного, просто еще одна битва. У нас их было полно по дороге на юг, просто бой за боем и... ну, вот и всё, понимаете? Когда побываешь в таком количестве сражений, все они в конце концов становятся одинаковыми.\n\nЧто? Да, для кого-то это, может, и был великий миг, сокрушивший империю или вроде того. И да, шаманы пустили [Concept('the_fog','Туман')|E] ради этого, как будто я раньше такого не [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' ). Это был просто бой. Когда все заканчивается, они все одинаковы. Кучка из нас заходит, кучка выходит, а воронье получает пир».#!"
  journey_event_elysia_sjalvolki_young_bored_story_response:90 "Что ж, это определенно один из взглядов на вещи."

	# Sjalvolki - Young - Magi
		journey_event_elysia_sjalvolki_magi_young_regretful_story:90 "#F "Pass... Pass... Pass... everyone always talks about the Pass, don't they? Sick of it myself, fought there and I'm sick of it. Yes, fought there, yes with the Witch-Breaker. Look at me like I grew a new head because I think slaying a bunch of farmers with powers none of us should have ever been near was glory.\n\n"Son of a Magi, village Magi, forever ago. Only a few years really, ain't even had hairs on my chin when the Pass happened, but still. Wasn't one of the [fog_magi|E], didn't cast it, but even so. Threw a fireball or two, brought some ground down upon some men. Walked into Aversaria with the Witch-Breaker and every other name from legend.\n\n"Wasn't worth much. Just more dead bodies. More corpses in a world overflowing with them."#!"
		journey_event_elysia_sjalvolki_magi_young_regretful_story_response:90 "Not everyone walked away with pride."

		journey_event_elysia_sjalvolki_magi_young_weird_story:90 "#F "Elysia, Elysia, oooohhh oh oooohhhh, Elysia! Fairest gal in all the land, the Elysian Pass! Was the finest gal I ever done saw, only twelve summers when I entered her maw! Hahaha! Funny? Sing-song? Oh I love to sing, always love to sing. Call me Ildibort 'Singer' they do, hilarious! I love it, I love to sing, to siiiinnngg! Always a joy.\n\n"Remember the Pass, I remember! Was a boy, was a boy. Singer boy could only sing in treble! No bass! Hahaha! Summoned [Concept('the_fog','Fog')|E] you know, I did, I did! Oh I did, I did. Oh, oh, oh, I did, I did! Hahaha! Oooh what a sight, what a sight! Elysia, her beauty covered in mist! Her tits obscured and ass away, and narry an Aversarian survived that day!\n\n"Left a man, left a man, Singer left a man! Brought them forth all from the north, and killed anything that could staaand!"#!"
		journey_event_elysia_sjalvolki_magi_young_weird_story_response:90 "That... was quite the tune?"

 # Sjalvolki - Old
	journey_event_elysia_sjalvolki_old_fake_story:90 "#F «Слыхали про Элизию?! Слыхали про неё!?\n\nДайте-ка я расскажу вам про Элизию, слушайте сюда! Я был там, точно был! Первый из щитовых братьев Кенвара, я был там! Да, именно так! Близки как родня, я и Истребитель Ведьм, близки как родня я и старина Кенни были! Помню, стою я там, значит, прямо перед битвой. И Кенни говорит мне: „Слушай сюда, Вильгорд, слушай сюда, Вильгорд, э-э... Вильгорд Убийца Гор!“ Это потому, что я сокрушил гору с глазами, зубами и огненным дыханием!\n\nВ общем, в общем, стою я там! А он мне и говорит: „Слушай сюда, хускарл Вильгорд Потрясатель Гор! Слушай сюда! Ты должен пойти и прикончить генерала Риппершэдоу Арсахроэса, предводителя аверсарианцев!“ Говорит, этот генерал Ривершэдоу у него как на ладони, и мы можем напасть на него исподтишка и забить как попрошайку, что украл твою еду! Ну, я и бросился в бой и убил... дюжину... нет! Две дюжины аверсарианских берсерков... на драконах! Они скакали на драконах — да, у них были драконы! Вы, сопляки, не понимаете, через что прошел такой старый ветеран, как я, вас там не было!\n\nВ общем, завалил я драконьего генерала Арсекроуза, смотрю на Кенни и кричу: „Гляди на меня, Кенни, бой! Я укокошил Арсекроуза!“ А Кенни обернулся ко мне, улыбнулся, поднял большой палец вверх и кричит мне через все поле:\n\n„Спасибо тебе, генерал Вильгорд Убийца Титанов! Ты спас мир! Ты мой герой, и ты пойдешь дальше и совершишь великие дела! Ты единственный, кто сегодня убивал!“ Вот так я и покончил с Аверсарией, а потом позволил Кенни доделать остальное, и он разрешил мне уйти на покой в Ораиспол!»#!"
  journey_event_elysia_sjalvolki_old_fake_story_response:90 "Ну конечно, именно так он и сделал."

  journey_event_elysia_sjalvolki_old_exaggerated_story:90 "#F «[Select_CString(generated_journey_character.IsFemale, 'Была', 'Был' )] на Перевале вместе с Истребителем Ведьм, знаете ли, с самим Истребителем Ведьм. Да ладно, я [Select_CString(generated_journey_character.IsFemale, 'понимаю', 'понимаю' )], если вы не верите, мне-то что, я знаю, что каждый старый алкаш и дурак в мире притворяется, будто сражался там. Я древний старик, парень, и у меня есть шрамы, чтобы доказать, что я там [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )]. Ага, вот этот след прямо через всю голову, вот этот.\n\nТак каково это было? Ну, я и мой клан были в отличных доспехах, Кенвар сам нам их справил, ага, именно так, сам отдал. В знак примирения и всё такое, от него нашему племени за старую кровную вражду. Сказал, что мы его самые важные союзники, и дал нам почетное место в битве. Так и сделал!\n\nИ я знаю, что вы скажете, мол, [Concept('the_fog','Туман')|E] сделал чертову уйму работы, но позвольте мне сказать! Мы вошли следом и задали им жару! Сотню человек [Select_CString(generated_journey_character.IsFemale, 'сама', 'сам' )] уложил, а клан перебил тысячу! Некоторые говорят, что даже дракона завалили, но то, скорее, была [Concept('fogbeast','туманная тварь')|E] или еще кто. Но тысячу из них я точно [Select_CString(generated_journey_character.IsFemale, 'сама', 'сам' )] прикончил, клянусь вам! Истинная правда!»#!"
  journey_event_elysia_sjalvolki_old_exaggerated_story_response:90 "Конечно, конечно, старик."

  journey_event_elysia_sjalvolki_old_regretful_story:90 "#F «Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] на Перевале, знаете ли. Весь клан был там с Истребителем Ведьм.\n\nНе смотрите на меня так. Ничего впечатляющего, ничего славного в той битве не было. По крайней мере, из того, что [Select_CString(generated_journey_character.IsFemale, 'видела я', 'видел я' )]. Просто куча мертвецов, которые погибли ни за что. Аверсарианцы должны были уйти, конечно должны, но [Concept('the_fog','Туман')|E]? Кто мы такие, чтобы напускать его на тех, кто не должен был этого видеть? А? Какая слава в том, чтобы обрекать кого бы то ни было на такое.\n\nЯ почти не помню саму битву. То немногое, что там было. Сейчас для меня все это словно в дымке, лица и цвета стерлись из памяти еще много лет назад. Все, что я помню теперь — это трупы. Тысячи трупов. Молодые мальчишки... моложе меня тогдашнего, безбородые. Некоторые настолько молоды, что кланы никогда бы не дали им в руки топор. Все изуродованные. Кто-то с мечом в руке. Кто-то пытался бежать... посреди всего этого. Какая-то [Concept('fogbeast','туманная тварь')|E] добралась до них... посреди круга из трупов... они были обожжены каким-то огнем. Они держались друг за друга. Можно было увидеть следы, где слезы вскипели прямо на коже...\n\nЯ [Select_CString(generated_journey_character.IsFemale, 'последовала', 'последовал' )] за кланом к побережью... но... никакой славы после этого не было. Все казалось неправильным. Как только [Select_CString(generated_journey_character.IsFemale, 'смогла', 'смог' )], [Select_CString(generated_journey_character.IsFemale, 'бросила', 'бросил' )] топор, [Select_CString(generated_journey_character.IsFemale, 'взяла', 'взял' )] мотыгу и [Select_CString(generated_journey_character.IsFemale, 'села', 'сел' )] на ферме с хорошим человеком. Это была... хорошая жизнь... но после Элизии ничто уже не могло заставить меня радоваться жизни... зная, что я [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' )]...»#!"
  journey_event_elysia_sjalvolki_old_regretful_story_response:90 "Не все истории должны быть славными..."

  journey_event_elysia_sjalvolki_old_proud_story:90 "#F «Элизия! Вы ведь знаете о ней, верно? Конечно знаете! Кто не знает? Никогда не [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' )] столь огромной битвы. И столь быстрой! Ха!» Старик начинает смеяться, а затем заходится хриплым кашлем от старости. Успокоившись, он выглядит уже не так шумно, но искорки в его глазах показывают, что гордости в нем не убавилось.\n\n«Аверсарианцы заслужили это. Всегда заслуживали. Моего отца они забрали, когда я [Select_CString(generated_journey_character.IsFemale, 'была девчонкой', 'был мальчишкой' )], небось, подыхать в какой-нибудь шахте. Неправильно то, что они творили. Неправильно. Кажется, будто сто лет прошло с Перевала, с тех пор как мы показали им, что мы не трусы вроде них. Разнесли их в пух и прах!\n\nВот и всё. Правда. Разнесли их в пух и прах. Империя сдохла в тот день, что бы там ни было. Ни одна империя не может зваться большой и сильной, если проигрывает настолько с треском. Нет больше никакой Империи...»#!"
  journey_event_elysia_sjalvolki_old_proud_story_response:90 "Тут не поспоришь, истинная правда..."

  journey_event_elysia_sjalvolki_old_cenware_shieldbrother_story:90 "#F «Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] на Перевале, знаете ли. Со своими щитовыми братьями и сестрами. Я [Select_CString(generated_journey_character.IsFemale, 'входила', 'входил' )] в личную свиту Истребителя Ведьм, как же давно это было, когда я [Select_CString(generated_journey_character.IsFemale, 'была молода и бодра', 'был молод и бодр' )] и еще [Select_CString(generated_journey_character.IsFemale, 'могла', 'мог' )] держать меч без дрожи в руках. Лучшие были времена. Для меня, по крайней мере... а для остальных? Не знаю, никогда об этом не [Select_CString(generated_journey_character.IsFemale, 'думала', 'думал' ), наверное. Мы были вместе тогда, в другую эпоху... но тогда дышалось легче...\n\nЯ помню это, понимаете. Не саму битву — битва как битва, — а лицо Кенвара. Я [Select_CString(generated_journey_character.IsFemale, 'любила', 'любил' )] его как брата, а он меня и всех своих людей. Вот почему я [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' )] это. Даже когда он притащил ту легионную бабу. Даже когда приказал шаманам призвать Туман. Даже когда мы добивали остатки и гнали их взашей... никогда прежде я не [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' )] у него такого лица, но он сохранял его до самого конца.\n\nЕму было грустно, понимаете. Вот что это было. Грусть. Я думаю, даже после всего, Кенвару все еще было грустно... ну... разрушать цивилизацию, как выражались аверсарианцы. Думаю, он жалел их, возможно. Не то чувство, которое положено испытывать кому-то столь великому, но, может, именно потому, что он чувствовал такие вещи, он и был столь велик...»#!"
  journey_event_elysia_sjalvolki_old_cenware_shieldbrother_story_response:90 "Весьма необычный взгляд на вещи."

	# Sjalvolki - Old - Magi
		journey_event_elysia_sjalvolki_magi_old_batshit_story:90 "#F «Ахахаха! Ах, ах, Перевал! Перевал! Вы сказали Перевал?! Я [Select_CString(generated_journey_character.IsFemale, 'услышала', 'услышал' )] „Перевал“! Элизийский перевал! Элизия! Элизи-и-и-и-я-я! Ахаха, так весело! Так здорово! У меня в голове голоса, прикосновение, я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там! Ничего не вижу своими глазами, ничего, кроме [Concept('rift','Разлома')|E]! Ахаха, вижу его постоянно! Вижу старых, вижу новых, прошлое, настоящее и будущее! Вижу Творца, Он там, все там! Ахахаха!\n\nПомню, [Select_CString(generated_journey_character.IsFemale, 'была молодой кобылкой, молодой девчонкой', 'был молодым оленем, молодым пареньком' )], ахахаха! На Перевале у меня была причудливая новая книжка, которую мне дал сам Истребитель-Выделитель Ведьм! Ахаха! Я [Select_CString(generated_journey_character.IsFemale, 'использовала', 'использовал' )] её, чтобы призвать [Concept('the_fog','Туман')|E], да, чтобы призвать Туман! Ахахаха! Мы бежали от него годами, боялись его, страшились, а я [Select_CString(generated_journey_character.IsFemale, 'использовала', 'использовал' )] его, чтобы убить кучу мальчишек! Ахахахаха!\n\nМальчишки, мальчишки, все мертвы. Девчонки тоже мертвы. Мужчины мертвы. Женщины мертвы. Истребитель Ведьм жив! Элизия, Элизия, Элизия! Перевал, Перевал, Перевал, ахахаха!»#!"
    journey_event_elysia_sjalvolki_magi_young_batshit_story_response:90 "Пожалуйста, оставайся на той стороне костра."

    journey_event_elysia_sjalvolki_magi_old_poetic_story:90 "#F «Кто это разглагольствует об Элизии? Вы ведь слышали о ней, нет? Ведь пока моя борода длинна, а все истории рассказаны, об Элизии я буду вещать вовеки. Знаю, вы находите меня чудным, ведь я так стар, а это событие было так давно, но позвольте мне выразиться ясно. Элизию будут помнить, никогда не забудут, пока этот старый прядильщик историй стоит перед вами.\n\nЯ стоял там [Concept('magi','магом')|E] в юности, изрядно напуганным, по правде говоря. Но Истребитель Ведьм, понимаете, человек чистый, как снег, доказал, что он хозяин нашей магии. Он передал нам тома Майикпрололлана, древние чары и символы, и маги из каждого клана пришли, чтобы встретиться и обсудить с Кенваром, как лучше их использовать. Молодой человек вроде меня стоит перед самим Истребителем Ведьм? Я был поражен, вот он стоял. Один из партикийцев — они всегда наводили на меня жуть — возглавил наш ковен и передал Кенвару то, к чему мы пришли.\n\nЭто... ну, это была ошибка. Никакие стихи не смогут покрыть всё остальное, хотя Велос свидетель, они пытались... но для меня? Я нашел романтику в самом путешествии туда. Надежду, что жила в нас, гордость, честь. Маг и воин, стоящие рука об руку, тысяча культур и вер, объединенных упованием. Сама Элизия? Что ж, эта битва — единственная история в этом мире, которая, как надеется часть меня, однажды окончательно умрет...»#!"
    journey_event_elysia_sjalvolki_magi_young_poetic_story_response:90 "Уникальный взгляд на вещи, старый скальд."

 # Marcher - Young
	journey_event_elysia_marcher_young_band_of_bastards_story:90 "#F «Вы знаете про Элизийский перевал? Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там! Нет, серьезно! В отряде „Банда ублюдков“ с самим Черным Ублюдком! Многие из нас были там, да почти все, наверное. Со всех уголков мира. Моим лучшим другом был южанин по имени Абдур, он вечно трещал про какую-то башню. Не выбрался старина Абдур, но многие из нас смогли!\n\nМы уже почти вышли, прорубая себе путь через каждого, кто вставал на дороге, даже через аверсарианцев, когда одна из их шишек смекнула, что мы даем драла, и приказала своим парням остановить нас! И еще больше аверсарианцев вываливалось прямо из [Concept('the_fog','Тумана')|E], размахивая мечами и рубя всё, что движется. Но Черный Ублюдок заметил это — „Меч Кровнмена“, одна из других рот, наглухо застряла в самой гуще. Он приказал нам вернуться, а мы были чертовски хорошими наемниками... шевалье, само собой! И мы ринулись обратно.\n\nОт „Меча Кровнмена“ мало что осталось, когда мы их нашли, но мы успели. Вытащили их и прорубили путь назад. Я [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' )] это, понимаете, своими глазами. Сам Истребитель Ведьм стоял на своем новом холме как раз в тот миг, когда солнце осветило его, и отдал „Ублюдкам“ салют. Заслужили, я считаю, да и плату свою тоже заслужили, вот только мы её так и не увидели... проклятые аверсарианцы...»#!"
  journey_event_elysia_marcher_young_band_of_bastards_story_response:90 "Заслуженное признание."

  journey_event_elysia_marcher_young_surrounded_story:90 "#F «Знаете, я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] там, на Элизийском перевале. Слышу, как люди болтают, каким великим и важным был тот бой. Только я сам ничего такого не [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' )]. Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] в отряде „Меч Кровнмена“. Не знаете их? Неудивительно, вся слава в тот день досталась другим. Особенно „Банде ублюдков“, хотя они-то, пожалуй, её заслужили.\n\nAверсарианцы отвалили огромный мешок монет, чтобы наша рота выдвинулась туда. Они хватали каждого наемника, какого могли найти, особенно маршеров, и почему бы и нет? Когда мы прибыли, думали, что дело в шляпе. Конечно, сьялволки могли погонять трусливых аверсарианцев, но как насчет лучших бойцов севера? Черта с два это помогло, особенно когда они шарахнули по нам этим... этим всратым [Concept('the_fog','Туманом')|E]. Чести в этом никакой, но, чтоб мне провалиться, свою работу он сделал.\n\nЯ почти ничего не помню. [Select_CString(generated_journey_character.IsFemale, 'Получила', 'Получил' )] знатный удар по голове от какой-то... штуки... она выглядела... выглядела как моя мама. Она умерла от лихорадки, когда я [Select_CString(generated_journey_character.IsFemale, 'была ребенком', 'был ребенком' )], но эта тварь просто... вышагнула навстречу. И голос был точь-в-точь как у неё. Выглядела испуганной, искала меня. Сказала, что заблудилась, увидела меня и умоляла... куча наших парней бросилась к ней. А в следующий миг её грудь превращается в пасть, из неё лезут длинные щупальца, она швыряет меня оземь, и мой шлем бьется о камень так сильно, что вдавливается внутрь, и...\n\nЯ уже [Select_CString(generated_journey_character.IsFemale, 'наполовину торчала', 'наполовину торчал' )] в её пасти, когда подоспели „Ублюдки“. Какая-то южанка на верблюде, на настоящем верблюде! Она влетела туда и отсекла это щупальце каким-то изогнутым мечом. Даже не знаю, сколько эта тварь мотала меня из стороны в сторону, но потом я [Select_CString(generated_journey_character.IsFemale, 'оказалась', 'оказался' )] на земле. [Select_CString(generated_journey_character.IsFemale, 'Откатилась', 'Откатился' )] в сторону, [Select_CString(generated_journey_character.IsFemale, 'встала', 'встал' )] на ноги со слезами на глазах, а в голове одни звезды. [Select_CString(generated_journey_character.IsFemale, 'Начала', 'Начал' )] махать мечом направо и налево. Убил какого-то сьялволка, кажись, аверсарианца, а потом один из „Ублюдков“ сцапал меня и уволок. Вскоре мы были на побережье, держа путь домой. Больше я никогда не [Select_CString(generated_journey_character.IsFemale, 'хотела', 'хотел' )] воевать, и, встав на Путь Урожая, вскоре снова [Select_CString(generated_journey_character.IsFemale, 'занялась', 'занялся' )] фермерством».#!"
  journey_event_elysia_marcher_young_surrounded_story_response:90 "История забывает тех, кто выжил."

  journey_event_elysia_marcher_young_missed_story:90 "#F «[Select_CString(generated_journey_character.IsFemale, 'Была', 'Был' )] в Элизии, когда всё это дерьмо случилось. Я и еще несколько наемников. Мы не были в „Банде ублюдков“... это единственная банда, которую люди помнят, кучка охотников за славой. Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] в одной из мелких групп, вольные наемники и всё такое, нас бросили под командование какого-то аверсарианца, чтобы он делал с нами всё, что ему вздумается.\n\nИ то, что ему вздумалось — это быть сожранными долбаным чудовищем, которое выглядело как собака размером с амбар, пришитая к спине дракона с... с этими гребаными... гребаными... головами вместо лап. Головами. На всех восьми, да, восьми её щупальцах! Ага! Все они орали, и эта тварь спикировала вниз, дракон сожрал верхнюю половину строя, а потом все эти головы принялись визжать о пиршестве и рвать остальных на куски.\n\nТам была еще одна здоровенная тварь, какая-то склизкая, но, к счастью, на этом всё. Сам я мало что [Select_CString(generated_journey_character.IsFemale, 'видела', 'видел' )], но кто-то как-то завалил её, даже когда в её пасти наполовину торчал какой-то кавалерист. Вся эта туша рухнула прямо на меня. Чуть не раздавила насмерть, но в итоге я [Select_CString(generated_journey_character.IsFemale, 'оказалась зажата', 'оказался зажат' )] прямо под одной из её... складок. К тому времени, как я [Select_CString(generated_journey_character.IsFemale, 'пришла', 'пришел' )] в себя и [Select_CString(generated_journey_character.IsFemale, 'выползла', 'выползг' )] наружу, вся эта туша гнила, всё вокруг гнило. Все были мертвы. [Select_CString(generated_journey_character.IsFemale, 'Встала', 'Встал' )] посреди поля трупов и воронья и просто... [Select_CString(generated_journey_character.IsFemale, 'побрела', 'побрел' )] на север.\n\nЯ до сих пор думаю об этом, понимаете? А кто бы не думал. Стоит мне закрыть проклятые глаза, я вижу эти... эти головы. И все эти тела. И думаю о том, как [Select_CString(generated_journey_character.IsFemale, 'шла', 'шел' )] через леса обратно на север с пустой головой, а потом просто [Select_CString(generated_journey_character.IsFemale, 'вышла', 'вышел' )] на деревенскую площадь в каких-то лохмотьях, покрытая кровью и волдырями. И все глазеют. Я иду по Пути Знания, но скажу вам честно... ни один Святой Пути не помог бы... я больше не [Select_CString(generated_journey_character.IsFemale, 'могла', 'мог' )] читать после того. Получил удар по голове, когда та хреновина на меня рухнула, и... буквы теперь все путаются. Да и без разницы, читать я больше не хочу... да и делать вообще ничего не хочу... просто хочется уже... ну, вы понимаете...»#!"
  journey_event_elysia_marcher_young_missed_story_response:90 "Мы понимаем тебя, друг."

 # Marcher - Old
	journey_event_elysia_marcher_old_mercenary_story:90 "#F «Помните Элизию? Мало кто помнит. То есть, люди рассказывают истории, но там уже никого из наших не осталось. Мы все угасаем, полагаю, и все только и толкуют, что о варварах или [Concept('magi','магах')|E], а о маршерах уже почти никто и не вспоминает. Особенно о тех из нас, кто не был с „Ублюдками“.\n\nЯ [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] просто пустозвоном, случайным прохожим. Одной из „низших рот“, как они нас называли, мы были практически желторотиками. Старая рота, „Чемпионы Розы“, но она была мертва уже почти век, когда капитан откопала это имя. Первый бой для меня, первый для большинства из нас. А потом пришли сьялволки, и пришел [Concept('the_fog','Туман')|E], и... ну, вот и всё.\n\n„Чемпионы Розы“ ту битву не пережили. Капитан стояла передо мной, когда я записывался, такой молодой и готовый к великим приключениям, посмотрела на меня и сказала: „Ты будешь героем, паря, когда будешь сидеть на куче золота и жить в замке, ты будешь рассказывать им, как поднялся в Розе“. Ага, черта с два. Вскоре после этого я стал самым матерым из выживших ветеранов „Розы“. Примерно в тот миг, когда я смотрел, как единственный другой выживший — сама капитан — испускает дух в каком-то хлеву неподалеку, спустя пару часов после начала резни».#!"
  journey_event_elysia_marcher_old_mercenary_story_response:90 "Настоящий герой, ничего не скажешь."

  journey_event_elysia_marcher_old_sjalvolki_story:90 "#F «[Select_CString(generated_journey_character.IsFemale, 'Была', 'Был' )] в Элизии целую вечность назад. Когда случилась битва. [Select_CString(generated_journey_character.IsFemale, 'Была', 'Был' )] обычным наемником, но со сьялволками, а не с этими аверсарианцами, которых все поминают. Все помнят только орду, никто не помнит, что они гребли наемников под это дело точно так же, как и имперцы.\n\nКуча наших записалась, но мы толком ничего и не делали. Может, сотня или две из всей оравы. Мы просто смотрели, как их [Concept('magi','маги')|E] творят какое-то колдовство, и на этом всё. Люди даже болтают, будто это была „темная магия“ или какое-то чудовищное непотребство. Чушь собачья. Вся магия — зло, они просто использовали то же мутантское дерьмо, что всегда делали аверсарианцы. Просто аверсарианцы не привыкли, чтобы это дерьмо летело обратно в них.\n\nМы зашли, посрубали головы уцелевшим, забрали плату и отчалили. Неплохо устроились, полагаю. Платили не то чтобы щедро, но наши братья по другую сторону баррикад вообще ни черта за свои хлопоты не получили, да и полегли почти все. Я после этого еще с десяток лет [Select_CString(generated_journey_character.IsFemale, 'сражалась', 'сражался' )] тут и там в куда более суровых заварухах, но единственная битва, которую хоть кто-то знает — это Элизия».#!"
  journey_event_elysia_marcher_old_sjalvolki_story_response:90 "Не каждому дано быть героем."

  journey_event_elysia_marcher_old_surrounded_story:90 "#F «[Select_CString(generated_journey_character.IsFemale, 'Была', 'Был' )] на Перевале. На Элизийском перевале, давным-давно, когда всё это стряслось. Я [Select_CString(generated_journey_character.IsFemale, 'была последовательницей', 'был последователем' )] Пути Мечей, так что воевать было моим делом, понимаете. [Select_CString(generated_journey_character.IsFemale, 'Была', 'Был' )] с „Мечом Кровнмена“, и мы все были готовы к делу. Справили новые доспехи на задаток, все до единого, оружие и даже новое знамя. Вся рота выстроилась так, как никто и не умеет.\n\nТам надо было побывать, понимаете? Чтобы понять. Понять этот [Concept('the_fog','Туман')|E]. До сих пор держу связь с теми немногими из наших стариков, кто еще ковыляет по земле. Мы все стараемся не теряться, пишем письма или навещаем друг друга. Никто, кроме нас, не может по-настоящему знать, что мы видели и... что нам пришлось сотворить, чтобы просто удержать голову на плечах.\n\nДаже не знаю, как мы выбрались. „Ублюдки“ подсобили, так говорили. „Банда ублюдков“, то бишь, другой наемный отряд, хотя их сейчас тоже мало кто помнит, а нас и подавно. Вытащили нас оттуда, судя по всему, вышли, а потом вернулись обратно и вытащили нас за шкирку. Надо бы спасибо сказать, наверное, но... я ни черта из этого не помню. Разум не дает. Стоит попытаться вспомнить, как в глаза бросается одна лишь чернота...»#!"
  journey_event_elysia_marcher_old_surrounded_story_response:90 "Там действительно нужно было побывать..."

  journey_event_elysia_marcher_old_fake_story:90 "#F «Я [Select_CString(generated_journey_character.IsFemale, 'была', 'был' )] в Элизии, чтоб вы знали! На Элизийском перевале, я и мои парни! Маршеры плоть от плоти, и нас туда привели! Все как один, при полном параде в лучших доспехах и с огромным золотым мечом — [Select_CString(generated_journey_character.IsFemale, 'заработала', 'заработал' )] его в драке с [Concept('lich','личем')|E], чтоб вы знали! Да, я! [Select_CString(generated_journey_character.IsFemale, 'Убила', 'Убил' )] его самолично, пронзила прямо в сердце и забрала его волшебный меч!\n\nСражались по всему Перевалу, целый день! Вверх и вниз, прямо через горы. Уложила одного сьялволка тут, прикончила другого там, а потом они напустили ТУМАН! [Select_CString(generated_journey_character.IsFemale, 'Сражалась', 'Сражался' )] с гигантским туманным монстром размером с башню, подбежала, проткнула его мечом, и он рассыпался в пепел! Меч, кстати, тоже рассыпался, вот почему, если вы решите обыскать мои пожитки, вы его при мне не найдете.\n\nСлавная была битва, великая! Выбиралась оттуда плечом к плечу с „Бандой ублюдков“, я даже [Select_CString(generated_journey_character.IsFemale, 'была той, кто сказала', 'был тем, кто сказал' )] самому Ублюдку, что мы должны вернуться за остальными... короче, не найдется ли монетки для старого ветерана?»#!"
  journey_event_elysia_marcher_old_fake_story_response:90 "Э-э..."

