	journey_event_kalathipsomi_veteran_aversarian_old_angry_story:90 "#F «Земли Кланов... когда-то у меня была ферма в Землях Кланов... славное было место, я тогда [Select_CString(generated_journey_character.IsFemale, 'была молодой девчонкой', 'был молодым пареньком' ). Да, славное место... пшеницу растили, кажется. Пшеницу... хорошее место. Дуб рос на краю поля, как раз у бараков для рабов. Там мой отец женился на моей матери, а его отец на своей, и так далее, и так далее. Под тем деревом я впервые [Select_CString(generated_journey_character.IsFemale, 'поцеловалась', 'поцеловался' )] — с соседской девчонкой по имени Милия, хорошая была деваха... хорошая деваха...\n\nКакое отношение я вообще к этому [Select_CString(generated_journey_character.IsFemale, 'имела', 'имел' )], а? У нас даже рабов-то не было, они разбежались в тот же год, когда я [Select_CString(generated_journey_character.IsFemale, 'родилась', 'родился' ), раз уж легионы ушли. Семья едва концы с концами сводила, а потом мимо проходили сьялволки. Увидели, что у моего папаши были старые доспехи — он ведь в детстве пару лет отслужил в легионах. Заявили, будто он скрывающийся [Concept('magi','маг')|E], хотя это было чушью собачьей. Отрезали папе кисти рук...\n\nМама... мать спросила его, как же им теперь выживать, а этот варвар схватил её и заявил, что теперь он будет её мужем... Сьялволькское отребье. Приковал её цепью как свою вещь, а меня вышвырнул с семейной фермы... Дуб тот срубили, чтобы начать строить свои новые лачуги. Сказали, если еще раз меня увидят — прирежут... Вот я и [Select_CString(generated_journey_character.IsFemale, 'убежала', 'убежал' )]... Чем мы это заслужили, а? Чем? Они даже Милию убили, но лучше не спрашивай меня, что они с ней перед этим сотворили...»#!"
