l_russian:

golden_terror_tt: "Золотой террор"
golden_terror_tt_desc: "Заговор Хейрдванга стал величайшей угрозой для Канцелярии со времён [Concept('bitter_war','Горькой войны')|E]. Обнаружение писем между раадилистами и марочникскими лордами, искавшими военного вмешательства для восстановления [GetTitleByKey('d_konijkmener_monarchy').GetNameNoTier], привело Канцелярию в ярость и вылилось в кровавую гражданскую войну в тщетной попытке вернуть монархию.\n\nПо её окончании канцлер использовал заговор и гражданскую войну как оправдание для того, что позже стало известно как «Золотой террор» — почти пятнадцатилетний период революционного правосудия, унёсший тысячи жизней на полуострове Гранмаар и заставивший многих бежать за его пределы."

gh_golden_terror.0001.t: "Заговор Хейрдванга"
gh_golden_terror.0001.desc: "Годами сторонники Хейрдванга шептались в тени Канцелярии. Годами они плели заговоры, чтобы вернуть [GetTitleByKey('d_konijkmener_monarchy').GetNameNoTier] былое величие.\n\nНо теперь всё кончено.\n\nНеудачная попытка захватить власть при поддержке ряда дворянских и купеческих семей обернулась катастрофой. «Корона» под замком, их сторонники мертвы или рассеяны, а Канцелярия устояла. Но не всё спокойно на Гранмааре. Если республика должна выжить, мы должны покончить с этим фарсом лордства раз и навсегда — и со всеми, кто последовал за ним."

gh_golden_terror.0001.a: "Смерть предателям! Пусть это станет уроком для всех врагов Республики."
gh_golden_terror.0001.a.tt: "Казнить [attacker.GetName] и уничтожить [GetTitleByKey('d_konijkmener_monarchy').GetNameNoTier]\nОбъявить всех известных монархистов врагами Канцелярии\nНачать Золотой террор"

gh_golden_terror.0101.t: "Революционный трибунал"
gh_golden_terror.0101.desc: "Перед трибуналом Канцелярии [Select_CString(accused.IsFemale, 'предстала', 'предстал')] [accused.GetName] — [Select_CString(accused.IsFemale, 'обвинённая', 'обвинённый')] в заговоре против Коникменера. Толпа за стенами Хоэн вер 'дт Гростфордре скандирует, требуя крови."

gh_golden_terror.0101.a: "Смерть врагу народа!"
gh_golden_terror.0101.b: "Бросить [Select_CString(accused.IsFemale, 'её', 'его')] в темницу. Мы не дикари."

gh_golden_terror.0102.t: "Закон о подозреваемых"
gh_golden_terror.0102.desc: "[Select_CString(suspect.IsFemale, 'Донос поступил на', 'Донос поступил на')] [suspect.GetName] как на врага Канцелярии. Согласно предлагаемому Закону о подозреваемых, любой, кто «своим поведением, связями или высказываниями проявляет себя сторонником тирании», может быть арестован. Тысячи могут оказаться в темницах."

gh_golden_terror.0102.a: "Пощады предателям не будет."
gh_golden_terror.0102.b: "Мы не можем сами стать тиранами."

gh_golden_terror.0103.t: "Не всё то золото..."
gh_golden_terror.0103.desc: "Террор поглотил всё. Даже умеренные, которые когда-то поддерживали меня, теперь шепчутся о заговоре. Канцелярия гудит от страха и недовольства, некоторые даже подумывают объявить меня предателем."

gh_golden_terror.0103.a: "Очистить всех! Террор должен продолжаться!"
gh_golden_terror.0103.b: "Всё кончено. Я отрекаюсь."

gh_golden_terror.0020.t: "Не всё то золото..."
gh_golden_terror.0020.desc: "Канцелярия погружается в хаос. [Select_CString(betrayer.IsFemale, 'Восстала', 'Восстал')] [betrayer.GetName], [Select_CString(betrayer.IsFemale, 'обвинившая', 'обвинивший')] меня в тирании и вражде к Канцелярии. «Террор стал орудием честолюбия!» — восклицают они. Депутаты требуют ареста. Снаружи толпа, некогда рукоплескавшая, теперь требует крови."

gh_golden_terror.0020.a: "Что мне остаётся, кроме как сдаться..."
gh_golden_terror.0020.b: "Арестовать их всех! Я не потерплю участи, которую уготовил другим."

gh_golden_terror.0021.t: "Падение тирана"
gh_golden_terror.0021.desc: "[golden_terror_leader.GetName] [Select_CString(golden_terror_leader.IsFemale, 'казнена', 'казнён')]. Тот, кто принёс нам Террор, теперь [Select_CString(golden_terror_leader.IsFemale, 'встретила', 'встретил')] тот же клинок. Одни говорят, что справедливость восторжествовала. Другие шепчут, что Золотое правило просто обрело нового хозяина."

gh_golden_terror.0021.a: "Золотые годы продолжаются..."

gh_golden_terror.0015.t: "Конец Золотого террора"
gh_golden_terror.0015.desc: "Пятнадцать лет. Пятнадцать лет крови и страха из-за попыток раадилистов вернуть утерянный трон. Теперь судебные комитеты распущены, оставшимся узникам дарована амнистия. Золотое правило безраздельно господствует на всём полуострове."

gh_golden_terror.0015.a: "Республика выстояла. Этого достаточно."

gh_golden_terror.0016.t: "Падение тирана"
gh_golden_terror.0016.desc: "[fallen_tyrant.GetName] [Select_CString(fallen_tyrant.IsFemale, 'мертва', 'мертв')]. Тот, кто правил страхом, теперь покоится в безымянной могиле, [Select_CString(fallen_tyrant.IsFemale, 'её', 'его')] сторонники рассеяны по болотам. История запомнит [Select_CString(fallen_tyrant.IsFemale, 'её', 'его')] не как освободителя, а как мясника."

gh_golden_terror.0016.a: "Так падают все тираны."

