gh_golden_terror_character_modifier_desc: "Этот персонаж отмечен как враг Золотого правила."
gh_golden_republic_modifier_desc: "Этот персонаж основал Золотую республику и развязал Террор."
gh_golden_terror_leader_modifier_desc: "Этот персонаж лично отправлял врагов на виселицу."
gh_golden_terror_legacy_tyrant_modifier_desc: "Правление этого персонажа запомнилось как кровавое царство."
gh_golden_terror_legacy_moderate_modifier_desc: "Правление этого персонажа запомнилось как необходимое, но сдержанное."
gh_golden_terror_survivor_modifier_desc: "Этот персонаж пережил Террор и дожил до его конца."

gh_golden_terror_modifier_desc: "Висельное дерево в полном цвету. Сосед доносит на соседа. Страх правит улицами."
reconstruction_modifier_desc: "Долгая работа по восстановлению началась. Поля засеяны заново, суды открыты."