l_russian:
 aeschraes_event.t.0001:0 "Видения ненависти"
 aeschraes_event.d.0001:0 "Будь она проклята. Будь проклята эта свинья, а не женщина. [aeschraes_rant_axi.GetFirstName] преследовала меня всю свою жизнь. Она преследовала меня до тех пор, пока я наконец не доказал всему миру, насколько я лучше. Пока я не убил её, как змею, коей она и являлась.\n\nИ всё же она преследует меня и с того света. Наперекор всему, чего я добился. Я — аавтократ, я — Чистейший, я — победитель в величайшей битве этого мира. И всё же я по-прежнему вижу её мысленным взором, бросающей мне вызов.\n\nОна не покидает мои мысли, застряв в них навязчивым призраком прошлого, который отказывается исчезать. Какие бы титулы я ни носил и какие бы победы ни одерживал, память об Аксиотее сохраняется, словно неумолимая тень, отбрасываемая на холст моего разума.\n\n«Будь она проклята», — частенько бормочу я себе под нос, словно эти слова сами по себе способны изгнать призрачное присутствие, что никак не желает уходить. Даже в величии моего двора, окружённого атрибутами власти, меня преследуют отголоски нашей общей истории."
 aeschraes_event_0001.a:0 "По крайней мере, она мертва."

 aeschraes_event.t.0002:0 "Черновик для [aeschraes_rant_rival.GetHerHis] милости [aeschraes_rant_rival.GetFirstNameNoTooltip]"
 aeschraes_event.d.0002:0 "Глубоко в тенях мерзкий силуэт,\n\nКоварный мелкий гад, ума в нём нет!\n\nСжимает в каждом слове хитрый план,\n\nОбман вплетает, в... дьявольский туман?\n\nОторвав перо от страницы, я понимаю, что работать над чем-то подобным, вроде этой поэмы, весьма приятно. [aeschraes_rant_rival.GetFirstName] слишком долго [Select_CString(aeschraes_rant_rival.IsFemale, 'была', 'был' )] костью в моем горле, и я готов взорваться. Это письмо будет доставлено в [aeschraes_rant_rival.GetHerHis] резиденцию завтра, и после того как [aeschraes_rant_rival.GetFirstNameNoTooltip] прочтёт его, оно тут же вспыхнет ярким пламенем."
 aeschraes_event_0002.a:0 "Так тебе и надо."
 