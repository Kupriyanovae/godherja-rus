 wayline_modifier_desc:0 "Эта область лежит на [Concept('waylines','лей-линии')|E] — естественном проводнике магической силы, который может служить сильным источником магической мощи для тех, кто умеет ими пользоваться.\n\n[extended_magic_baseline|E]:@magic_icon!#positive_value; +50#! в вашей [Concept('capital','столице')|E]"
 wayline_intersection_modifier:0 "Пересечение [Concept('waylines','лей-линий')|E]"
 wayline_intersection_modifier_desc:0 "Две [Concept('waylines','лей-линии')|E], ([Concept('tower_wayline','Имперская лей-линия')|E] и [Concept('northern_wayline','Северная лей-линия')|E]) пересекаются здесь, создавая исключительно мощный магический резонанс.\n\n[extended_magic_baseline|E]:@magic_icon!#positive_value; +100#! в вашей [Concept('capital','столице')|E]"
