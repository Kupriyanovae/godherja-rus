l_russian:
 recent_purge_modifier:0 "Недавняя чистка"
 recent_purge_modifier_desc:0 "Местные власти недавно провели беспощадную чистку среди жителей графства — разрушенные деревни и массовые захоронения усеивают местность, многие бежали, а у оставшихся пылает лютая ненависть к своим угнетателям."  
 natives_wiped_out_modifier:0 "Коренное население уничтожено"
 natives_wiped_out_modifier_desc:0 "Местные власти недавно провели беспощадную чистку прежних жителей графства — разрушенные деревни и массовые захоронения усеивают местность, и жизнь едва теплится за исключением немногих предприимчивых колонистов, отправленных строить будущее на пепле прошлого населения."
 purged_by_fire_county_modifier:0 "Очищено огнем"
 purged_by_fire_county_modifier_desc:0 "Местные власти недавно начали кампанию по очищению этого графства огнём, стремясь искоренить скверну и фанатизм, угрожающие хрупкой стабильности правителя."
 redlands_decay_modifier:0 "Увядание"
 redlands_decay_modifier_desc:0 "Тёмные силы трудятся, чтобы истощить эти земли в ничто."
 redlander_mystery_cults_modifier:0 "Тайные культы"
 redlander_mystery_cults_modifier_desc:0 "В этих землях начали появляться тайные радикальные культы, некоторые из которых стремятся к смене власти."