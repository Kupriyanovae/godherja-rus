 CANNOT_DO_PUPPET:0 "I am a puppet. I do not have nearly the clout to do this."
 CANNOT_IMPRISON_CONCLAVE_MEMBER_TOO_STRONG:0 "The Conclave is too powerful for us to directly have its members imprisoned."
