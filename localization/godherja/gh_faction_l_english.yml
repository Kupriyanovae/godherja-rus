 kanzelerij_restoration_faction:0 "Monarchist Restoration"
 kanzelerij_restoration_faction_desc:0 "A coalition of nobles within [GetTitleByKey('k_de_kanzelerij').GetName] who wish to restore the [GetTitleByKey('d_kanzelerij_monarchy').GetName] to feudal rule, ending the republic and returning power to a proper monarch."
 kanzelerij_restoration_faction_short_effect_desc:0 "Restore feudal rule under the [GetTitleByKey('d_kanzelerij_monarchy').GetName]"
 gh_kanzelerij_restoration_war:0 "Monarchist Restoration War"
 gh_kanzelerij_restoration_war_name:0 "War of Monarchist Restoration"
 gh_kanzelerij_restoration_war_victory_desc:0 "The restoration faction has prevailed. The republic of [GetTitleByKey('k_de_kanzelerij').GetName] falls, and feudal order is restored under the [GetTitleByKey('d_kanzelerij_monarchy').GetName]."
 gh_kanzelerij_restoration_war_defeat_desc:0 "The restoration faction has been crushed. The republic endures — and its rulers take note of those who dared to challenge it."
 gh_kanzelerij_restoration_war_white_peace_desc:0 "The conflict has ended without a decisive outcome. The restoration faction stands down, for now."
 gh_kanzelerij_restoration_demand_accepted_title:0 "The Monarchy is Accepted"
 gh_kanzelerij_restoration_war_won_title:0 "The Monarchy is Restored"
 gh_kanzelerij_restoration_war_lost_title:0 "The Republic Has Fallen"
 gh_kanzelerij_restoration_war_crushed_title:0 "The Rebellion is Crushed"