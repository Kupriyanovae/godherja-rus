l_russian:
 bloodline_no: "кровь" #need to subtract bloodline trait count from model size for icon size use trigger 
 bloodline_show: "yes"

 BLOODLINE_LIST: "Родословные"
 OPEN_BLOODLINE_LIST_TOOLTIP: "#T Посмотреть родословные#!"

 bloodline_founder_name: "[CHARACTER.GetUINameNotMeNoFormat]" #need on death to reorder bloodline traits

 bloodline_inherit_all: "#T Наследование: Все#!\nРодословная передается как по мужской, так и по женской линии"
 bloodline_inherit_matri: "#T Наследование: Матрилинейное#!\nРодословная передается только по женской линии"
 bloodline_inherit_patri: "#T Наследование: Патрилинейное#!\nРодословная передается только по мужской линии"
 bloodline_allow_bastards: "#T Бастарды:#! #T;P Разрешены#!\nБастарды могут наследовать родословную"
 bloodline_allow_bastards_not: "#T Бастарды:#! #T;N Запрещены#!\nБастарды #N;bold не могут#! наследовать родословную"
 bloodline_matri_override: "#T Передача при матрилинейном браке:#! #T;P Активно#!\nПатрилинейная родословная может передаваться матерью в матрилинейном браке, а матрилинейная — отцом в обычном браке"
 bloodline_matri_override_not: "#T Передача при матрилинейном браке:#! #T;N Неактивно#!\nПатрилинейная родословная #N;bold не может#! передаваться матерью, а матрилинейная #N;bold не может#! передаваться отцом"
 bloodline_special_condition: "#T Дополнительные условия:#! #T;P Выполнены#!\nДля наследования этой родословной необходимо выполнить дополнительные условия.\nВсе условия выполнены"
 bloodline_special_condition_not: "#T Дополнительные условия:#! #T;N Не выполнены#!\nДля наследования этой родословной необходимо выполнить дополнительные условия.\nЭти условия #N;bold не#! выполнены:\n[GetScriptedGui(Concatenate( Trait.GetKey, '_founder' )).IsValidTooltip(GuiScope.SetRoot(Character.MakeScope).End)]"

 bloodline_desc_blank: ""

 trait_bloodline_cenware: "Кровь Сокрушителя Ведьм"
 bloodline_cenware_inherit: "patri" # inheritance all, matri, patri
 bloodline_cenware_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_cenware_bastards: "no" # do bastards inherit? yes/no
 bloodline_cenware_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_cenware_desc: "Ценвар Сокрушитель Ведьм был первым властелином, объединившим племена сьялволков, а также десятки вероисповеданий и культур северо-востока, чтобы разграбить [Concept('mayikrata','Майикратию')|E] и разрушить Империю."

 trait_bloodline_nikaryin: "Кровь Последнего Никарина"
 bloodline_nikaryin_inherit: "patri" # inheritance all, matri, patri
 bloodline_nikaryin_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_nikaryin_bastards: "yes" # do bastards inherit? yes/no
 bloodline_nikaryin_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_nikaryin_desc: "Последний Никарин превратил небольшой прибрежный [Glossary('полис','GH_POLISOCRACY_GLOSS')] в Империю и с помощью могущественной магической силы сделал первый шаг к объединению [Concept('aversaria','Аверсарии')|E]."

 trait_bloodline_phanagorax: "Кровь Панагорака «Святого»"
 bloodline_phanagorax_inherit: "patri" # inheritance all, matri, patri
 bloodline_phanagorax_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_phanagorax_bastards: "yes" # do bastards inherit? yes/no
 bloodline_phanagorax_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_phanagorax_desc: "Несмотря на то, что при жизни его фигура вызывала много споров, Панагорак был позже причислен к лику богов в [Concept('aversaria','аверсарианских')|E] священных текстах как основатель современной Аагиократии."

 trait_bloodline_dhacixen: "Кровь Даки'ксена"
 bloodline_dhacixen_inherit: "patri" # inheritance all, matri, patri
 bloodline_dhacixen_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_dhacixen_bastards: "yes" # do bastards inherit? yes/no
 bloodline_dhacixen_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_dhacixen_desc: "Даки'ксен пытался воспротивиться становлению Аагиократии и стал последним Эрсодиаксовым Аавтократом. Он и его род были истреблены практически полностью после [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E]."

 trait_bloodline_aexionarax: "Кровь Эксионаракса"
 bloodline_aexionarax_inherit: "patri" # inheritance all, matri, patri
 bloodline_aexionarax_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_aexionarax_bastards: "yes" # do bastards inherit? yes/no
 bloodline_aexionarax_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_aexionarax_desc: "Эксионаракс развязал [Concept('war_of_the_thousand_dragons','Войну тысячи драконов')|E] от имени Имперской фракции, сразив Даки'ксена и захватив престол. Его правление укрепило Аагиократию и часто называется истинным началом современной [Concept('aversaria','Аверсарии')|E]."

 trait_bloodline_maklea: "Кровь Маклеи"
 bloodline_maklea_inherit: "matri" # inheritance all, matri, patri
 bloodline_maklea_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_maklea_bastards: "yes" # do bastards inherit? yes/no
 bloodline_maklea_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_maklea_desc: "$aauto_maklea_link$ Маклея#! положила начало традиции Кровавого Сената, [Concept('maklean_blood_senate','сразив своего отца')|E], Аавтократа Акалионикса, на дуэли. На протяжении всего её правления бушевали мятежи, пока она [Concept('maklean_terrors','охотилась на своих братьев')|E] и подавляла знать."

 trait_bloodline_nothyx: "Кровь Нотикса"
 bloodline_nothyx_inherit: "all" # inheritance all, matri, patri
 bloodline_nothyx_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_nothyx_bastards: "yes" # do bastards inherit? yes/no
 bloodline_nothyx_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_nothyx_desc: "Нотикс стал первым Аавтократом, одержавшим победу в Кровавом Сенате без использования магии. Пройдя обучение у антимагов из [Concept('chevalie','Шевалье')|E], он положил начало династии, правившей на протяжении нескольких поколений и приведшей [Concept('aversaria','Аверсарию')|E] к её последнему золотому веку."

 trait_bloodline_axiaothea: "Кровь Аксиотеи"
 bloodline_axiaothea_inherit: "all" # inheritance all, matri, patri
 bloodline_axiaothea_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_axiaothea_bastards: "yes" # do bastards inherit? yes/no
 bloodline_axiaothea_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_axiaothea_desc_fix: "Аксиотея считалась сильнейшим магом своего поколения. Будучи соперницей Эшрея, она разорвала [Concept('aversaria','Аверсарию')|E] на части в ходе [Concept('imperial_civil_war','Имперской гражданской войны')|E], которая завершилась [Concept('frodbrokna','Фродброкной')|E] и её гибелью. Несмотря на неоднозначную жизнь, вскоре после смерти она была обожествлена."

 trait_bloodline_aeschraes: "Кровь Разрушителя Мира"
 bloodline_aeschraes_inherit: "patri" # inheritance all, matri, patri
 bloodline_aeschraes_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_aeschraes_bastards: "yes" # do bastards inherit? yes/no
 bloodline_aeschraes_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_aeschraes_desc: "Пережив трагическое детство, Эшрей стал одним из самых молодых легонов в истории, а затем прославился как сильнейший [Concept('magi','маг')|E] в истории [Concept('aversaria','Аверсарии')|E], положив конец прежнему миру во время [Concept('imperial_civil_war','Имперской гражданской войны')|E]."

 trait_bloodline_pothacleas: "Кровь Последнего Ийросстца"
 bloodline_pothacleas_inherit: "all" # inheritance all, matri, patri
 bloodline_pothacleas_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_pothacleas_bastards: "yes" # do bastards inherit? yes/no
 bloodline_pothacleas_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_pothacleas_desc: "Потаклей был последним независимым правителем ийроссов, оказавшим сопротивление власти [Concept('aversaria','Аверсарии')|E]. После жестокой партизанской войны он сдался Аавтократу и молил о пощаде для своего народа. Аверсарианцы сохранили им жизнь, навечно поработив ийроссов, а самого Потаклея предали смерти."

 trait_bloodline_the_skull_taker: "Кровь Череполова"
 bloodline_the_skull_taker_inherit: "patri" # inheritance all, matri, patri
 bloodline_the_skull_taker_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_the_skull_taker_bastards: "yes" # do bastards inherit? yes/no
 bloodline_the_skull_taker_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_the_skull_taker_desc: "Грозный воевода Горассос Череполов топил в крови земли [Concept('aversaria','Аверсарии')|E] во имя Эшрея, пока не откололся от него, чтобы продолжать убийства уже ради собственных целей."

 trait_bloodline_gardfrei: "Кровь Кризе де ва Сеньона"
 bloodline_gardfrei_inherit: "patri" # inheritance all, matri, patri
 bloodline_gardfrei_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_gardfrei_bastards: "yes" # do bastards inherit? yes/no
 bloodline_gardfrei_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_gardfrei_desc: "Свирепый воин, Кризе безжалостно уничтожал своих соперников и своими жестокими расправами поверг в ужас общество Шевалье, впервые за без малого сотню лет объединив разоренное Верховное королевство."

 trait_bloodline_huegons: "Blood of Huegons den va Deaughtie"
 bloodline_huegons_inherit: "patri" # inheritance all, matri, patri
 bloodline_huegons_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_huegons_bastards: "yes" # do bastards inherit? yes/no
 bloodline_huegons_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_huegons_desc: "Выдающийся государственник своего поколения, Гюгон объединил Марки с помощью дипломатии, интриг и войны. Однако ему так и не довелось надеть корону — он скончался от болезни на завершающем этапе объединения, и от его имени на престол был возведен его безумный сын Ажиер."

 trait_bloodline_the_good_king: "Кровь Доброго Короля"
 bloodline_the_good_king_inherit: "all" # inheritance all, matri, patri
 bloodline_the_good_king_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_the_good_king_bastards: "yes" # do bastards inherit? yes/no
 bloodline_the_good_king_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_the_good_king_desc: "Добрый король Бастион сплотил первых марочников и повел их на запад, в [Concept('chevalie','Шевалье')|E]. Известный своей справедливостью, Бастион так и не обзавелся родными детьми, но усыновил множества сирот за время своего правления."

 trait_bloodline_the_prophet: "Кровь Пророка"
 bloodline_the_prophet_inherit: "all" # inheritance all, matri, patri
 bloodline_the_prophet_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_the_prophet_bastards: "no" # do bastards inherit? yes/no
 bloodline_the_prophet_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_the_prophet_desc: "Пророк узрел всю историю от своего рождения до конца света в 1254 году. Все правители Амсара ведут свой род от его крови и следуют его мудрости."

 trait_bloodline_the_black_sun: "Кровь Чёрного Солнца"
 bloodline_the_black_sun_inherit: "patri" # inheritance all, matri, patri
 bloodline_the_black_sun_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_the_black_sun_bastards: "no" # do bastards inherit? yes/no
 bloodline_the_black_sun_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_the_black_sun_desc: "Никаноней «Чёрное Солнце» доказал, что способен сражаться на равных со сьялволками, и выковал новую [Concept('aversaria','Аверсарию')|E] на севере, мечтая вернуть былые земли."

 trait_bloodline_kathanouxa: "Кровь Короля-Волшебника"
 bloodline_kathanouxa_inherit: "all" # inheritance all, matri, patri
 bloodline_kathanouxa_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_kathanouxa_bastards: "yes" # do bastards inherit? yes/no
 bloodline_kathanouxa_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_kathanouxa_desc: "Несмотря на то, что никто толком не понимал, кто такие волшебники, Катанукс прославился как сильнейший [Concept('magi','маг')|E] своего поколения и попытался подчинить себе весь мир."

 trait_bloodline_odyr_then: "Кровь Одыр Тена"
 bloodline_odyr_then_inherit: "patri" # inheritance all, matri, patri
 bloodline_odyr_then_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_odyr_then_bastards: "no" # do bastards inherit? yes/no
 bloodline_odyr_then_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_odyr_then_desc: "Одыр Тен поднял восстание против Храма Горного Солнца, пытаясь свергнуть монашеские ордены и передать власть светским воеводам, а затем продолжил борьбу против вторгшихся [Concept('aversaria','аверсарианцев')|E]."

 trait_bloodline_odyr_lleth: "Кровь Одыр Ллета"
 bloodline_odyr_lleth_inherit: "patri" # inheritance all, matri, patri
 bloodline_odyr_lleth_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_odyr_lleth_bastards: "no" # do bastards inherit? yes/no
 bloodline_odyr_lleth_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_odyr_lleth_desc: "Одыр Ллет поднял мятеж против [Concept('aversaria','Аверсарии')|E] в горах Опахасии, сжег дворец наместника и едва не погрузил весь край в хаос."

 trait_bloodline_odyr_hune: "Кровь Одыр Хуна"
 bloodline_odyr_hune_inherit: "patri" # inheritance all, matri, patri
 bloodline_odyr_hune_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_odyr_hune_bastards: "no" # do bastards inherit? yes/no
 bloodline_odyr_hune_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_odyr_hune_desc: "Одыр Хун начал последнее восстание Одыров, едва не захватив [GetTitleByKey('c_asiupoli').GetNameNoTier], прежде чем терпящий поражение мятеж был разгромлен соединенными силами легионов [Concept('aversaria','Аверсарии')|E]."

 trait_bloodline_vercigex: "Кровь Версижекса"
 bloodline_vercigex_inherit: "patri" # inheritance all, matri, patri
 bloodline_vercigex_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_vercigex_bastards: "yes" # do bastards inherit? yes/no
 bloodline_vercigex_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_vercigex_desc: "Измученный духом, Версижекс был единственным [Concept('magi','магом')|E], правившим в [Concept('chevalie','Шевалье')|E], и близким другом Бастиона. И хотя он пытался спасти распадающееся королевство, видения гибели мира и недоверие вассалов привели к его убийству."
 
 trait_bloodline_cois_defeated: "Кровь Последнего Аавтократа"
 bloodline_cois_defeated_inherit: "all" # inheritance all, matri, patri
 bloodline_cois_defeated_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_cois_defeated_bastards: "yes" # do bastards inherit? yes/no
 bloodline_cois_defeated_special: "no" # are there an extra conditions for inheritance? yes/no
 bloodline_cois_defeated_desc: "Признанный последним Аавтократом, Коис был одним из немногих, кому удалось одолеть Ценвара в открытом бою."
 
 trait_bloodline_cois_victorious: "Кровь Коиса"
 bloodline_cois_victorious_inherit: "all" # inheritance all, matri, patri
 bloodline_cois_victorious_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_cois_victorious_bastards: "yes" # do bastards inherit? yes/no
 bloodline_cois_victorious_special: "no" # are there an extra conditions for inheritance? yes/no
 bloodline_cois_victorious_desc: "Когда всякая надежда для [Concept('aversaria','Аверсарии')|E] была утеряна, Коис поднялся из небытия, рассеял полчища Ценвара и спас Империю."

 trait_bloodline_salacad: "Кровь Увенчанных Небом"
 bloodline_salacad_inherit: "all" # inheritance all, matri, patri
 bloodline_salacad_patri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_salacad_bastards: "yes" # do bastards inherit? yes/no
 bloodline_salacad_special: "no" # are there an extra conditions for inheritance? yes/no
 bloodline_salacad_desc: "Увенчанные Небом и их потомки привели Дочерей Неба к новому золотому веку своего народа."

 trait_bloodline_gatecrasher: "Кровь Сокрушителя Врат"
 bloodline_gatecrasher_inherit: "all" # inheritance all, matri, patri
 bloodline_gatecrasher_matri_override: "yes" # does the bloodline pass in opposite dominant marriages, ie woman pass patri in matri marriage? yes/no
 bloodline_gatecrasher_bastards: "no" # do bastards inherit? yes/no
 bloodline_gatecrasher_special: "yes" # are there an extra conditions for inheritance? yes/no
 bloodline_gatecrasher_desc: "Сокрушитель Врат дважды разгромил могущественных адабиссцев — подвиг, практически не имеющий равных в истории."

