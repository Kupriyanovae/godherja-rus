 hurimak_rite_adj:0 "$hurimak_adj$"
 hurimak_rite_desc:0 "$hurimak_desc$"
 iek_otached_rite:0 "$iek_otached$"
 iek_otached_rite_adherent:0 "$iek_otached_adherent$"
 iek_otached_rite_adherent_plural:0 "$iek_otached_adherent_plural$"
 iek_otached_rite_adj:0 "$iek_otached_adj$"
 iek_otached_rite_desc:0 "Иек Отачед («Великий Отачед») — это ольтенская вера, сосредоточенная вокруг ольтенского военачальника Отачеда, от которого произошла большая часть современной ольтенской культуры и религии (а также сам их выход на историческую арену Континента). Хотя современники жизни Отачеда оставили мало свидетельств того, что он сам покровительствовал своему культу или вообще обращал на него внимание, культ обрёл популярность после его смерти, объявив его богом — физическим отражением самого Кайгана."
 iyrossi_rite:0 "$iyrossi$"
 iyrossi_rite_adherent:0 "$iyrossi_adherent$"
 iyrossi_rite_adherent_plural:0 "$iyrossi_adherent_plural$"
 iyrossi_rite_adj:0 "$iyrossi_adj$"
 iyrossi_rite_desc:0 "Вера ийросов не практиковалась открыто со II века, когда они были завоёваны и полностью оккупированы аверсарианцами во II веке. Некоторые из их ритуалов были поглощены аверсарианской верой как способ сохранить покорность порабощённых ийросов, но многие продолжали тайно исповедовать догматы своей веры. И они с нетерпением ждали дня, чтобы совершить священное возмездие над своими бывшими хозяевами за века порабощения."
 izaerto_bosar_rite:0 "$izaerto_bosar$"
 izaerto_bosar_rite_adherent:0 "$izaerto_bosar_adherent$"
 izaerto_bosar_rite_adherent_plural:0 "$izaerto_bosar_adherent_plural$"
 izaerto_bosar_rite_adj:0 "$izaerto_bosar_adj$"
 izaerto_bosar_rite_desc:0 "Изаэрто Бошар, что означает «Тысяча Владык», — это вера, сосредоточенная вокруг убеждения, что эоны назад тысяча богов-царей с тёмной кожей были ниспосланы равнодушным и чуждым верховным богом по имени «Великая Пустота». Хотя их сложный миф о сотворении часто служит поводом для насмешек чужеземцев, святые мужи и жёны не обращают на это внимания. Великий Пернатый заберёт их души в рай после смерти, поэтому никакие насмешки смертных не сломят дух верных."
 karannai_rite:0 "$karannai$"
 karannai_rite_adherent:0 "$karannai_adherent$"
 karannai_rite_adherent_plural:0 "$karannai_adherent_plural$"
 karannai_rite_adj:0 "$karannai_adj$"
 karannai_rite_desc:0 "Каран «Иссохший Бог» — это древний труп неведомого существа,  извлечённый горными племенами. Хотя он, несомненно, мёртв, он всё ещё излучает магические энергии, достаточно мощные, чтобы убить всех, кто приблизится. Поклоняясь ему как божеству, каранийцы мечтают вознестись до божественности и сохранить умирающий мир — чего они, якобы, могут достичь, вкусив часть мёртвого бога."
 kardawai_rite:0 "$kardawai$"
 kardawai_rite_adherent:0 "$kardawai_adherent$"
 kardawai_rite_adherent_plural:0 "$kardawai_adherent_plural$"
 kardawai_rite_adj:0 "$kardawai_adj$"
 kardawai_rite_desc:0 "$kardawai_desc$"
 karitkarmaic_karhikala_rite:0 "Кархикала"
 karitkarmaic_karhikala_rite_adherent:0 "Кархикалан"
 karitkarmaic_karhikala_rite_adherent_plural:0 "Кархикаланс"
 karitkarmaic_karhikala_rite_adj:0 "Кархикалан"
 karitkarmaic_karhikala_rite_desc:0 "Кархикала — Картикарма в облике судьи, а не воина: бог, взвешивающий каждую душу перед её возвращением в мир. Его последователи считают закон высшей формой поклонения, а их суды внушают страх своей беспристрастностью."
 karitkarmaic_rite:0 "$karitkarmaic$"
 karitkarmaic_rite_adherent:0 "$karitkarmaic_adherent$"
 karitkarmaic_rite_adherent_plural:0 "$karitkarmaic_adherent_plural$"
 karitkarmaic_rite_adj:0 "$karitkarmaic_adj$"
 karitkarmaic_rite_desc:0 "$karitkarmaic_desc$"
 kathunirossi_iyrossi_rite:0 "$kathunirossi_iyrossi$"
 kathunirossi_iyrossi_rite_adherent:0 "$kathunirossi_iyrossi_adherent$"
 kathunirossi_iyrossi_rite_adherent_plural:0 "$kathunirossi_iyrossi_adherent_plural$"
 kathunirossi_iyrossi_rite_adj:0 "$kathunirossi_iyrossi_adj$"
 kathunirossi_iyrossi_rite_desc:0 "Когда Цэов Баисэ прервал связь с Катун-Каем и Малькоя погрузилась в анархию, Дом Яон остался, чтобы выполнять священные приказы императора. Император поручил Дому Яон серию священных повелений, чтобы обеспечить выживание посольства в случае потери связи с империей. 1270 год от И.С. ознаменовывает 70 лет с момента последней связи, позволяя Дому Яон разделить священные Четырнадцать небесных методов с непросвещёнными, чтобы создать священное население для поддержки и защиты голоса императора в этих примитивных землях. Дом Яон теперь служит великим толкователем этих святых повелений и работает, чтобы помочь нам лучше понять, как мы можем служить и поклоняться императору."
 khourtaul_rite:0 "$khourtaul$"
 khourtaul_rite_adherent:0 "$khourtaul_adherent$"
 khourtaul_rite_adherent_plural:0 "$khourtaul_adherent_plural$"
 khourtaul_rite_adj:0 "$khourtaul_adj$"
 khourtaul_rite_desc:0 "$khourtaul_desc$"
 kikarsagi_aagiokrata_rite:0 "$kikarsagi_aagiokrata$"
 kikarsagi_aagiokrata_rite_adherent:0 "$kikarsagi_aagiokrata_adherent$"
 kikarsagi_aagiokrata_rite_adherent_plural:0 "$kikarsagi_aagiokrata_adherent_plural$"
 kikarsagi_aagiokrata_rite_adj:0 "$kikarsagi_aagiokrata_adj$"
 kikarsagi_aagiokrata_rite_desc:0 "Фродброкна показала, что Ардара покинула потомков Пратогоноев, обрекая их на гибель. Те, кто одолеет их, будут коронованы как Телигоноиар и будут вознаграждены на вечность за исполнение суда Яркорча-Чистейшего. Те, кто наделён Ардарой, должны распространять её среди низших народов через деяния великой силы и подчинения, показывая другим благословенную природу своего ранга и ища достойных слуг, способных познать истинную природу мира."
 kikarsagi_atrakar_rite:0 "$kikarsagi_atrakar$"
 kikarsagi_atrakar_rite_adherent:0 "$kikarsagi_atrakar_adherent$"
 kikarsagi_atrakar_rite_adherent_plural:0 "$kikarsagi_atrakar_adherent_plural$"
 kikarsagi_atrakar_rite_adj:0 "$kikarsagi_atrakar_adj$"
 kikarsagi_atrakar_rite_desc:0 "$kikarsagi_atrakar_adherent_plural$ хранят память о святых Нартахатане Озкане и Нартахатун Бетун, для которых Ардара и смерть были предпочтительнее неверия и аверсарианского подчинения. Верные чтят память об их жертве на тайных обрядах причащения и верят, что Ардара обретается через подражание двум Нартахатанам — защитой своего дома, воспитанием будущих поколений и сохранением священного вероучения."
 kikarsagi_old_rite:0 "$kikarsagi_old$"
 kikarsagi_old_rite_adherent:0 "$kikarsagi_old_adherent$"
 kikarsagi_old_rite_adherent_plural:0 "$kikarsagi_old_adherent_plural$"
 kikarsagi_old_rite_adj:0 "$kikarsagi_old_adj$"
 kikarsagi_old_rite_desc:0 "$kikarsagi_old_adherent_plural$ знают, что такое Ардара, с тех пор, как Яркорч возвысил людей из числа духов Равнин Духов и создал первые маски, чтобы защитить их души. Другие, быть может, забыли пути Яркорча, но в час нужды он вернётся к своим верным. Он родится смертным под благословенными звёздами, чтобы жить среди них и вести их за собой, прежде чем вновь взойти на свой божественный трон на небесах."
 lanonan_bynjar_institute_rite:0 "$lanonan_bynjar_institute$"
 lanonan_bynjar_institute_rite_adherent:0 "$lanonan_bynjar_institute_adherent$"
 lanonan_bynjar_institute_rite_adherent_plural:0 "$lanonan_bynjar_institute_adherent_plural$"
 lanonan_bynjar_institute_rite_adj:0 "$lanonan_bynjar_institute_adj$"
 lanonan_bynjar_institute_rite_desc:0 "[GetFaithDoctrine('tenet_thirteen_precepts').GetBaseName] Тай-ву породил идеологическую традицию, известную как Биньяр. Ожидается, что её последователи овладеют воинскими искусствами, ибо воинское совершенство считается как духовным долгом, так и истиннейшей мерой добродетели. Умереть в бою считается высшей честью, а расширение владений своего правителя рассматривается как верное исполнение учений Тай-ву.\n\nНе имея централизованной религиозной власти, Биньяр развивался через множество слабо организованных региональных ассоциаций. Со временем это привело к возникновению многочисленных школ, чьи доктрины часто значительно расходились как в практике, так и в толковании. Несмотря на эти различия, все традиции Биньяра отводят исключительно возвышенное место сущности, известной как Цзян Сян Шоу, чьё значение остаётся одной из немногих констант, разделяемых всей верой."
 last_truthspeakers_rite:0 "$last_truthspeakers$"
 last_truthspeakers_rite_adherent:0 "$last_truthspeakers_adherent$"
 last_truthspeakers_rite_adherent_plural:0 "$last_truthspeakers_adherent_plural$"
 last_truthspeakers_rite_adj:0 "$last_truthspeakers_adj$"
 last_truthspeakers_rite_desc:0 "Культ Последних Говорящих Истину воздаёт почести последним членам династии Донаурлиан, считая их последними правителями Амагеи, воплотившими её истинные ценности и добродетели. Учение культа гласит, что мир уже давно погрузился в тёмный век моральной деградации, слабости и изнеженного декаданса, о котором предупреждал Арназ «Великий Предок» (большинство других амагейских ветвей придерживаются мнения, что эта эпоха ещё не наступила), и что спасение придёт только с возвращением Говорящих Истину. Эрас теперь ждёт их воскрешения всеотцом, и когда они вернут себе законное право, они снова приведут Амагею к праведности и начнут вечный золотой век."
