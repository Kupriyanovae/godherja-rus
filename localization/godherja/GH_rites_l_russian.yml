 cumani_rite_adherent_plural:0 "$cumani_adherent_plural$"
 cumani_rite_adj:0 "$cumani_adj$"
 cumani_rite_desc:0 "$cumani_desc$"
 cuthanagi_rite:0 "$cuthanagi$"
 cuthanagi_rite_adherent:0 "$cuthanagi_adherent$"
 cuthanagi_rite_adherent_plural:0 "$cuthanagi_adherent_plural$"
 cuthanagi_rite_adj:0 "$cuthanagi_adj$"
 cuthanagi_rite_desc:0 "$cuthanagi_desc$"
 dahala_rite:0 "$dahala$"
 dahala_rite_adherent:0 "$dahala_adherent$"
 dahala_rite_adherent_plural:0 "$dahala_adherent_plural$"
 dahala_rite_adj:0 "$dahala_adj$"
 dahala_rite_desc:0 "$dahala_desc$"
 daminkar_rite:0 "$daminkar$"
 daminkar_rite_adherent:0 "$daminkar_adherent$"
 daminkar_rite_adherent_plural:0 "$daminkar_adherent_plural$"
 daminkar_rite_adj:0 "$daminkar_adj$"
 daminkar_rite_desc:0 "Даминкарцы верят, что сам Алау Коев является Богом, единой и могучей силой, перенёсшей их в смертный мир из тёмной темницы, известной как Ада Тви. Они известны своими пышными празднествами огня, где верные пируют на обугленном мясе и танцуют по длинным рядам пылающих углей. Для них смертный мир — это благословение, которым следует наслаждаться, а повторное открытие Огненных врат означает страх, ибо это сигнализирует о возвращении Холодного Владыки Хел Тви, чтобы забрать их души."
 daramarjaratan_pantheon_rite:0 "Мритиугада"
 daramarjaratan_pantheon_rite_adherent:0 "Слуга мёртвых"
 daramarjaratan_pantheon_rite_adherent_plural:0 "Слуги мёртвых"
 daramarjaratan_pantheon_rite_adj:0 "$daramarjaratan_adj$"
 daramarjaratan_pantheon_rite_desc:0 "ТРЕБУЕТ ПЕРЕВОДА"
 daramarjaratan_rite:0 "$daramarjaratan$"
 daramarjaratan_rite_adherent:0 "$daramarjaratan_adherent$"
 daramarjaratan_rite_adherent_plural:0 "$daramarjaratan_adherent_plural$"
 daramarjaratan_rite_adj:0 "$daramarjaratan_adj$"
 daramarjaratan_rite_desc:0 "Дарамарджаратанисты поклоняются богине смерти и супруге Кариткармаика, Дарамарджаратан (изначально Дамаратджарат) как правительнице всех остальных богов. Дарамарджаратанизм остаётся спорным из-за их веры в пантеон Смерти и смерть всех остальных богов. Хотя их считают опасным культом, дарамарджаратаны больше заботятся о делах мёртвых, чем живых, и редко вступают в контакт с чужаками. Несмотря на их миролюбие, большинство помнят лишь пресловутые результаты культов Дарамарджаратан, открывших тёмные магии."
 daramarjaratan_wheel_rite:0 "Чакрапада"
 daramarjaratan_wheel_rite_adherent:0 "Хранитель Колеса"
 daramarjaratan_wheel_rite_adherent_plural:0 "Хранители Колеса"
 daramarjaratan_wheel_rite_adj:0 "$daramarjaratan_adj$"
 daramarjaratan_wheel_rite_desc:0 "ТРЕБУЕТ ПЕРЕВОДА"
 dethedklann_rite:0 "$dethedklann$"
 dethedklann_rite_adherent:0 "$dethedklann_adherent$"
 dethedklann_rite_adherent_plural:0 "$dethedklann_adherent_plural$"
 dethedklann_rite_adj:0 "$dethedklann_adj$"
 dethedklann_rite_desc:0 "$dethedklann_desc$"
 dravadari_rite:0 "$dravadari$"
 dravadari_rite_adherent:0 "$dravadari_adherent$"
 dravadari_rite_adherent_plural:0 "$dravadari_adherent_plural$"
 dravadari_rite_adj:0 "$dravadari_adj$"
 dravadari_rite_desc:0 "Политеистическая вера с древней историей, боги — это эфемерные творцы, которые могут жить, умирать, перерождаться и испытывать последствия энтропии и негэнтропии, подобно людям. Паэрасджатан (часто забываемый в наши дни) — бог магии творения, который, как говорят, создал первую итерацию мира, и о Нём существует много древних мифов."
 dravadari_thousand_rite:0 "Сахасрабхада"
 dravadari_thousand_rite_adherent:0 "Почитатель Тысячи"
 dravadari_thousand_rite_adherent_plural:0 "Почитатели Тысячи"
 dravadari_thousand_rite_adj:0 "$dravadari_adj$"
 dravadari_thousand_rite_desc:0 "ТРЕБУЕТ ПЕРЕВОДА"
 dreaming_rite_rite:0 "$dreaming_rite$"
 dreaming_rite_rite_adherent:0 "$dreaming_rite_adherent$"
 dreaming_rite_rite_adherent_plural:0 "$dreaming_rite_adherent_plural$"
 dreaming_rite_rite_adj:0 "$dreaming_rite_adj$"
 dreaming_rite_rite_desc:0 "$dreaming_rite_desc$"
 dyrridic_rite:0 "$dyrridic$"
 dyrridic_rite_adherent:0 "$dyrridic_adherent$"
 dyrridic_rite_adherent_plural:0 "$dyrridic_adherent_plural$"
 dyrridic_rite_adj:0 "$dyrridic_adj$"
 dyrridic_rite_desc:0 "Хотя изначально они были частью более широкой среды племенных вер, распространённых по древним Клановым землям, ранний конфликт с $kathanouxa_link$ Катануксской империей#! оттеснил дириддийцев на юг и привёл к столкновению с древними племенами современной Этепезеи. Будучи в одних местах завоевателями, а в других — беженцами, дириддийцы быстро синкретизировались с более оседлыми южанами, сохраняя при этом свои племенные традиции. Ко времени ранней Империи племена поклонялись богу Сортеку, воинственному отцу-молнии, который ударил молнией с небес в первое дерево, чтобы дать человечеству огонь, и научил их владеть мечами."
 ebohephai_olten_rite:0 "$ebohephai_olten$"
 ebohephai_olten_rite_adherent:0 "$ebohephai_olten_adherent$"
 ebohephai_olten_rite_adherent_plural:0 "$ebohephai_olten_adherent_plural$"
 ebohephai_olten_rite_adj:0 "$ebohephai_olten_adj$"
 ebohephai_olten_rite_desc:0 "Поклоняясь обширному пантеону духов и богов огня, эбохефаи считают землю священной из-за своего уникального религиозного наследия. Захоранивая людей в курганах, они воздают почитание Арлихану и его пяти тысячам духов-демонов и ста богам огня."
 ehatm_rite:0 "$ehatm$"
 ehatm_rite_adherent:0 "$ehatm_adherent$"
 ehatm_rite_adherent_plural:0 "$ehatm_adherent_plural$"
 ehatm_rite_adj:0 "$ehatm_adj$"
 ehatm_rite_desc:0 "Некогда доминирующая вера Крехеджада, эхатмизм — это вера в двойственную богиню Сестра-Матерь. На протяжении веков островитяне сосредотачивались вокруг воительниц э’хатм, пока не потерпели поражение во время Войны всех островов."
 ertomax_rite:0 "$ertomax$"
 ertomax_rite_adherent:0 "$ertomax_adherent$"
 ertomax_rite_adherent_plural:0 "$ertomax_adherent_plural$"
 ertomax_rite_adj:0 "$ertomax_adj$"
 ertomax_rite_desc:0 "Основанный на вере в то, что дух Царя-Солнца-Луны обитает лишь в душах верных, эртомаксизм назван в честь великого $ertomax_link$ Эртомакса#!, которого почитают как самого верного из всех. Считается, что он был единственным человеком, прошедшим Ос Киньер при жизни, и его смерть от руки безымянного убийцы ничуть не угасила пыл его ревностных сторонников, которые ныне лишь ожидают его неизбежного возвращения."
 ethowos_rite:0 "$ethowos$"
 ethowos_rite_adherent:0 "$ethowos_adherent$"
 ethowos_rite_adherent_plural:0 "$ethowos_adherent_plural$"
 ethowos_rite_adj:0 "$ethowos_adj$"
 ethowos_rite_desc:0 "Этовосцы — потомки обездоленных, рабов, бежавших из-под власти аверсарианцев. Они утверждают, что их вёл Этово — гигантский аксолотль, вырвавшийся из-под контроля аверсарианских магов и разломавший несколько загонов для рабов. Этово почитается как божество этовосцами, которые приносят ему огромные количества пищи с поверхности."
 fogeater_rite:0 "$fogeater$"
 fogeater_rite_adherent:0 "$fogeater_adherent$"
 fogeater_rite_adherent_plural:0 "$fogeater_adherent_plural$"
 fogeater_rite_adj:0 "$fogeater_adj$"
 fogeater_rite_desc:0 "$fogeater_desc$"
 fourteen_heavenly_methods_rite:0 "$fourteen_heavenly_methods$"
 fourteen_heavenly_methods_rite_adherent:0 "$fourteen_heavenly_methods_adherent$"
 fourteen_heavenly_methods_rite_adherent_plural:0 "$fourteen_heavenly_methods_adherent_plural$"
 fourteen_heavenly_methods_rite_adj:0 "$fourteen_heavenly_methods_adj$"
 fourteen_heavenly_methods_rite_desc:0 "Четырнадцать небесных методов — это название одноимённых философских трактатов, приписываемых легендарной императрице Яо Жэнь Цай, также известной как Богиня-императрица или Драконья императрица. Она была могущественным магом и ей приписывают как объединение городов Катун-Кая, так и полное подчинение монастырей мяоси государству. За своё двухвековое правление она написала эссе о том, как люди четырнадцати профессий и укладов жизни в Катун-Кае могут жить добродетельно и достичь пути на Небеса.\n\nПосле её смерти, как говорят, душа Яо Жэнь Цай слилась с семенем Шэньвана, создав первого дракона; другие утверждения гласят, что её душа вселилась в саму землю и небо, чтобы наблюдать за своим народом после смерти.\n\nНачиная с её сына Яо Линсюя, претенденты на трон Катун-Кая утверждали, что в них вселился дух первого дракона, чтобы укрепить свою легитимность. Многие из этих одержимых императоров почитаются наряду с Яо Жэнь Цай, а её Небесные методы строго соблюдаются."
 gallicader_rite:0 "$gallicader$"
 gallicader_rite_adherent:0 "$gallicader_adherent$"
 gallicader_rite_adherent_plural:0 "$gallicader_adherent_plural$"
 gallicader_rite_adj:0 "$gallicader_adj$"
 gallicader_rite_desc:0 "Галликады некогда были доминирующей верой Шевалье, будучи вытеснены лишь относительно недавно путеходцами. Они верят, что человек не обладает свободной волей и что вся жизнь от рождения до смерти определяется движением звёзд. Наблюдая за небесными орбитами, можно начать раскрывать тайны будущего и утраченные знания прошлого."
 gethian_reformed_rite:0 "$gethian_reformed$"
 gethian_reformed_rite_adherent:0 "$gethian_reformed_adherent$"
 gethian_reformed_rite_adherent_plural:0 "$gethian_reformed_adherent_plural$"
 gethian_reformed_rite_adj:0 "$gethian_reformed_adj$"
 gethian_reformed_rite_desc:0 "$gethian_reformed_desc$"
 gethian_rite:0 "$gethian$"
 gethian_rite_adherent:0 "$gethian_adherent$"
 gethian_rite_adherent_plural:0 "$gethian_adherent_plural$"
 gethian_rite_adj:0 "$gethian_adj$"
 gethian_rite_desc:0 "Гетцы вошли в известный мир вместе с сьялволькской коалицией. Хотя они были довольно замкнуты, сьялволки рассказали им о великих злодеяниях аверсарианцев и их империи. Они надеются, что, истребив эту презренную и разрушительную веру, они смогут искупить себя в глазах Великого Судьи Атрах-Адмаха."
 guusag_bikhesektan_rite:0 "$guusag_bikhesektan$"
 guusag_bikhesektan_rite_adherent:0 "$guusag_bikhesektan_adherent$"
