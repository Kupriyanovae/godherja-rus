l_russian:

 # Added keys missing from the supplied Russian mod
 aegispact_rite:0 "$aegispact$"
 aegispact_rite_adherent:0 "$aegispact_adherent$"
 aegispact_rite_adherent_plural:0 "$aegispact_adherent_plural$"
 aegispact_rite_adj:0 "$aegispact_adj$"
 aegispact_rite_desc:0 "Пакт Эгиды — это легендарная клятва, принесённая двенадцатью королями и королевами беженцев с материка и тридцатью одним племенным вождём Одинокого Света, которая положила конец «Кровавым распрям». Этот период массового кровопролития начался, когда потоки беженцев хлынули на запад, спасаясь от Скорби по Ойейнице, и попытались установить власть над местными племенами и другими бежавшими с материка.\n\nПакт, заключённый после поражения ненавистных прикканов и возвращения Эгиды Бриндом Хитрым с далёкого севера, обязал всех признать единого правителя. Этот правитель выбирался каждым племенем и каждым королём и должен был посвятить себя не личной выгоде, а защите Эгиды и обороне Одинокого Света. Хотя с тех пор Королевство не раз переживало расцвет и падение, множество разрозненных верований со временем слились воедино, сплочённые не верой в богов, а верой в силу могучей Эгиды."
 aerasodiax_rite:0 "$aerasodiax$"
 aerasodiax_rite_adherent:0 "$aerasodiax_adherent$"
 aerasodiax_rite_adherent_plural:0 "$aerasodiax_adherent_plural$"
 aerasodiax_rite_adj:0 "$aerasodiax_adj$"
 aerasodiax_rite_desc:0 "Эрсодиакс, Глашатай утраченного Создателя и Король всего Человечества, был жесток и мудр, правя человечеством и даруя Дар в обмен на кровь и служение. Верные были прокляты, когда мятежники убили Эрсодиакса и его наследников задолго до памяти, и прощение должно быть заслужено через постоянные жертвы и ритуалы, чтобы Дар не был отнят."
 aeulikai_rite:0 "$aeulikai$"
 aeulikai_rite_adherent:0 "$aeulikai_adherent$"
 aeulikai_rite_adherent_plural:0 "$aeulikai_adherent_plural$"
 aeulikai_rite_adj:0 "$aeulikai_adj$"
 aeulikai_rite_desc:0 "Разнообразный ряд шаманистских вер, поклоняющихся горным духам своих земель. Их общины сосредоточены вокруг святых шаманов, которые спорят между собой о природе своих духов. Как обнаружили аверсарианцы, споры шаманов быстро забываются перед лицом зла, и верные горды тем, что обрушивают мощь гор на чужеземных язычников."
 alau_koev_rite:0 "$alau_koev$"
 alau_koev_rite_adherent:0 "$alau_koev_adherent$"
 alau_koev_rite_adherent_plural:0 "$alau_koev_adherent_plural$"
 alau_koev_rite_adj:0 "$alau_koev_adj$"
 alau_koev_rite_desc:0 "Алаукоевцы верят, что мир богов был отрезан от них, и врата откроются вновь только тогда, когда мир будет готов очиститься от своих грехов в огне. В преддверии повторного открытия Огненных врат благочестивые последователи ритуально сжигают себя в подготовке к возвращению Плеймао на Эрас. Алаукоевцы наслаждаются постоянным отвращением чужеземцев к своей вере и верят, что их страдания в жизни являются свидетельством божественного огня внутри них."
 andaronshak_austere_rite:0 "Угравада"
 andaronshak_austere_rite_adherent:0 "Аскетик"
 andaronshak_austere_rite_adherent_plural:0 "Аскетикс"
 andaronshak_austere_rite_adj:0 "$andaronshak_adj$"
 andaronshak_austere_rite_desc:0 "ТРЕБУЕТ ПЕРЕВОДА"
 andaronshak_rite:0 "$andaronshak$"
 andaronshak_rite_adherent:0 "$andaronshak_adherent$"
 andaronshak_rite_adherent_plural:0 "$andaronshak_adherent_plural$"
 andaronshak_rite_adj:0 "$andaronshak_adj$"
 andaronshak_rite_desc:0 "Андароншакцы верят, что боги — это непостижимая сила, проявляющаяся в человечестве как магия. Через совершенствование добродетелей человек обретает контроль над магией через своих богов — будь то в нынешней жизни или в следующей. Признавая путь к магии личным странствием, андароншакцы питают горькую ненависть к религиозному формализму, считая его противоречащим их святым целям."
 apti_rite:0 "$apti$"
 apti_rite_adherent:0 "$apti_adherent$"
 apti_rite_adherent_plural:0 "$apti_adherent_plural$"
 apti_rite_adj:0 "$apti_adj$"
 apti_rite_desc:0 "Апти были малоизвестным народом, которого остальной мир в основном не замечал, пока они не двинулись на юг в составе Сьялволькской конфедерации Ценвара Сокрушителя Ведьм. Последователи этой веры не имеют твёрдой позиции ни в отношении войны, ни магии, ни Фродброкны, просто видя в них интересные загадки, которые однажды необходимо понять, чтобы воссоединиться с Дремлющим. Пытаться остановить их, не говоря уже о том, чтобы предотвратить их полностью, было бы безумием, ибо эти вещи исходят из разума Дремлющего, и всякий, кто поймёт Его, уже воссоединится с Его сознанием."
 arayymorog_rite:0 "$arayymorog$"
 arayymorog_rite_adherent:0 "$arayymorog_adherent$"
 arayymorog_rite_adherent_plural:0 "$arayymorog_adherent_plural$"
 arayymorog_rite_adj:0 "$arayymorog_adj$"
 arayymorog_rite_desc:0 "Означающее «Поклонение Воздуху», это вера является обобщающим термином для ольтенских вер, утверждающих, что их боги отражаются на Эрасе через действия воздуха и ветра, являющиеся результатом взаимодействия богов с миром. Они отвергают обычные попытки гадания в пользу одержимого наблюдения за движениями ветра, что приводило к поражению даже на грани победы из-за смены направления ветра."
 aruvasue_rite:0 "$aruvasue$"
 aruvasue_rite_adherent:0 "$aruvasue_adherent$"
 aruvasue_rite_adherent_plural:0 "$aruvasue_adherent_plural$"
 aruvasue_rite_adj:0 "$aruvasue_adj$"
 aruvasue_rite_desc:0 "Арувасуэ строится на почитании аспектов великого Царя-Солнца-Луны, божественного творца мира. Почитать его — значит чтить святость дома и очага, исполнять долг гостеприимства перед почётным гостем и никогда не утаивать то, что предлагается свободно. Соблюдение этих принципов открывает путь в загробную жизнь, где души сами становятся божествами, служа храмам трёх миров."
 askevaryaa_dharyam_lon_rite:0 "Дхарьям Лон"
 askevaryaa_dharyam_lon_rite_adherent:0 "Праведник"
 askevaryaa_dharyam_lon_rite_adherent_plural:0 "Праведники"
 askevaryaa_dharyam_lon_rite_adj:0 "Праведный"
 askevaryaa_dharyam_lon_rite_desc:0 "ТРЕБУЕТ ПЕРЕВОДА"
 askevaryaa_rite:0 "$askevaryaa$"
 askevaryaa_rite_adherent:0 "$askevaryaa_adherent$"
 askevaryaa_rite_adherent_plural:0 "$askevaryaa_adherent_plural$"
 askevaryaa_rite_adj:0 "$askevaryaa_adj$"
 askevaryaa_rite_desc:0 "Сформированная после событий Чан Скорпокаипис и Дхарья Варха, Аскеварьяна разделяет почти тех же богов и догматы, что и Видваукеятра. Однако отличие заключается во включении так называемых порочных знаний."
 asritayka_rite:0 "$asritayka$"
 asritayka_rite_adherent:0 "$asritayka_adherent$"
 asritayka_rite_adherent_plural:0 "$asritayka_adherent_plural$"
 asritayka_rite_adj:0 "$asritayka_adj$"
 asritayka_rite_desc:0 "Асритаиканцы противостоят большинству религиозных норм обычных вер и проповедуют обыденность во всех вещах — божественных или смертных. От морей до небес, даже драконы и магия. Верные проводят время в бесконечных дебатах о философских концепциях и трудах таких философов, как Сару, что иногда вызывает большую враждебность, и их можно найти при большинстве каширийских дворов."
 astiliak_rite:0 "$astiliak$"
 astiliak_rite_adherent:0 "$astiliak_adherent$"
 astiliak_rite_adherent_plural:0 "$astiliak_adherent_plural$"
 astiliak_rite_adj:0 "$astiliak_adj$"
 astiliak_rite_desc:0 "$astiliak_desc$"
 azot_rite:0 "$azot$"
 azot_rite_adherent:0 "$azot_adherent$"
 azot_rite_adherent_plural:0 "$azot_adherent_plural$"
 azot_rite_adj:0 "$azot_adj$"
 azot_rite_desc:0 "$azot_desc$"
 bayn_huac_rite:0 "$bayn_huac$"
 bayn_huac_rite_adherent:0 "$bayn_huac_adherent$"
 bayn_huac_rite_adherent_plural:0 "$bayn_huac_adherent_plural$"
 bayn_huac_rite_adj:0 "$bayn_huac_adj$"
 bayn_huac_rite_desc:0 "$bayn_huac_desc$"
 beast_rite:0 "$beast$"
 beast_rite_adherent:0 "$beast_adherent$"
 beast_rite_adherent_plural:0 "$beast_adherent_plural$"
 beast_rite_adj:0 "$beast_adj$"
 beast_rite_desc:0 "Эрас является домом для множества уникальных и фантастических существ. Хотя одни из них обыденны, а другие обладают разумом, превосходящим даже человеческий, все дети Эраса внимают зову дикой природы."
 benkassai_rite:0 "$benkassai$"
 benkassai_rite_adherent:0 "$benkassai_adherent$"
 benkassai_rite_adherent_plural:0 "$benkassai_adherent_plural$"
 benkassai_rite_adj:0 "$benkassai_adj$"
 benkassai_rite_desc:0 "$benkassai_desc$"
 blorivok_rite:0 "$blorivok$"
 blorivok_rite_adherent:0 "$blorivok_adherent$"
 blorivok_rite_adherent_plural:0 "$blorivok_adherent_plural$"
 blorivok_rite_adj:0 "$blorivok_adj$"
 blorivok_rite_desc:0 "$blorivok_desc$"
 caradounars_rite:0 "$caradounars$"
 caradounars_rite_adherent:0 "$caradounars_adherent$"
 caradounars_rite_adherent_plural:0 "$caradounars_adherent_plural$"
 caradounars_rite_adj:0 "$caradounars_adj$"
 caradounars_rite_desc:0 "Основанные одноимённым пророком хуэгодоков Карадуном, карадунары являются презираемой мессианской сектой, которая расколола веру Апти в последние десятилетия. Самым печально известным среди их многочисленных и разнообразных спорных убеждений является то, что Фродброкна была на самом деле священным событием — первым актом в великом космическом становлении, которое приведёт к тому, что Дремлющий начнёт заново видеть мир. Грозный Туман — это просто приближающийся конец сна, огромная и медленно движущаяся приливная волна ясности, накатывающая на Эрас, к приходу которой они должны подготовить мир.\n\nНазвать этот богословский поворот «спорным» было бы преуменьшением. Эти учения сочли настолько елейными, что обычно терпимые к гетеродоксии Апти обратились против Карадуна и его последователей, схватив и посадив на кол его и пятьдесят пять его учеников в 1211 году от И.С."
 carkarai_rite:0 "$carkarai$"
 carkarai_rite_adherent:0 "$carkarai_adherent$"
 carkarai_rite_adherent_plural:0 "$carkarai_adherent_plural$"
 carkarai_rite_adj:0 "$carkarai_adj$"
 carkarai_rite_desc:0 "Постоянно эволюционирующее собрание табу и суеверий. Мневмисдианцы поклоняются головокружительному множеству духов, духовных сил и демонов, воплощённых в плоти. Ключевой фигурой в их пантеоне (или, по крайней мере, в его текущей версии) является Человек с Рогатой Короной — звериный облик, который, как говорят, шепчет послания спящим. Наиболее печально они известны тем, что считают человеческую плоть — особенно Маги и обитателей поверхности — священным причастием."
 chakkarai_rite:0 "$chakkarai$"
 chakkarai_rite_adherent:0 "$chakkarai_adherent$"
 chakkarai_rite_adherent_plural:0 "$chakkarai_adherent_plural$"
 chakkarai_rite_adj:0 "$chakkarai_adj$"
 chakkarai_rite_desc:0 "$chakkarai_desc$"
 conclave_rite:0 "Обряд конклава"
 conclave_rite_adherent:0 "Конклавист"
 conclave_rite_adherent_plural:0 "Конклависц"
 conclave_rite_adj:0 "Конклав"
 conclave_rite_desc:0 "Обряд, сложившийся на опахасийских конклавах, где марочнические отцы-путники переняли обычаи сьялвольков, не пытаясь им противиться, и создали традицию, в которой ни одна из сторон уже не узнала бы своего наследия."
 cosnaupi_rite:0 "$cosnaupi$"
 cosnaupi_rite_adherent:0 "$cosnaupi_adherent$"
 cosnaupi_rite_adherent_plural:0 "$cosnaupi_adherent_plural$"
 cosnaupi_rite_adj:0 "$cosnaupi_adj$"
 cosnaupi_rite_desc:0 "После того как великое бедствие оторвало большую часть вершины Наврега, некоторые горные племена перестали считать её величайшим небом, почитая вместо этого то, что некогда было второй по высоте вершиной — Коснфрегль. Последователи этой веры имеют склонность приносить пленников в жертву на алтарях, возведённых вокруг горы, веря, что ритуалы восполнят красную руду, которую они часто добывают в глубинах Коснфрегля."
 cumani_rite:0 "$cumani$"
