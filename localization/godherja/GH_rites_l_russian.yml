 vidvaookeyatra_rite_desc:0 "Видваукеятра («Странствие учёного») — это поклонение гермафродитному богу знания Сарвату, который, как говорят, является источником всякого знания и, следовательно, знания о самом творении. Имея корни в империи Отачеда, их учёному сословию следует благодарить как за технологический, общественный и исторический прогресс Каширии, так и за её многочисленные бедствия."
