 haswsuluyoi_rite_adj:0 "$haswsuluyoi_adj$"
 haswsuluyoi_rite_desc:0 "$haswsuluyoi_desc$"
 hurimak_rite:0 "$hurimak$"
 hurimak_rite_adherent:0 "$hurimak_adherent$"
