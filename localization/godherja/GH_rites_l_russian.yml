 varodaism_rite_adj:0 "$varodaism_adj$"
 varodaism_rite_desc:0 "Поклонение древнему богу моря Вароде, вародистский миф о сотворении мира — один из древнейших в мире. Наиболее известные своей способностью укрощать морских зверей, самой знаменитой вародистской фигурой является пророк Могурпа, который, как говорят, большую часть своей жизни укрощал кракена и ездил на нём."
