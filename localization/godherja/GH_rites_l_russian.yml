 wyld_pact_rite_desc:0 "Провидцы, друиды, прорицатели и другие почтенные Мудрецы из Имперреха погружались в богатые истории клановых земель, сохранившиеся до XIII века, устанавливая неформальный договор о защите и сохранении Бродячих Лесов, чтобы древние маги лесов могли снова процветать. Верующие организовали свод правил и практик, вдохновлённых обычаями, принесёнными из Старого Старого Севера."
 wyrdpath_rite:0 "$wyrdpath$"
 wyrdpath_rite_adherent:0 "$wyrdpath_adherent$"
 wyrdpath_rite_adherent_plural:0 "$wyrdpath_adherent_plural$"
 wyrdpath_rite_adj:0 "$wyrdpath_adj$"
 wyrdpath_rite_desc:0 "Путь Вирда зародился в результате ранних миссионерских усилий марочников в северном Калатипсоми. Эта миссия увенчалась лишь частичным успехом: она научила местное население необходимости следовать своему жизненному пути, но так и не смогла вытеснить их древние обряды и обычаи."
 xaxbaxakanax_rite:0 "$xaxbaxakanax$"
 xaxbaxakanax_rite_adherent:0 "$xaxbaxakanax_adherent$"
 xaxbaxakanax_rite_adherent_plural:0 "$xaxbaxakanax_adherent_plural$"
 xaxbaxakanax_rite_adj:0 "$xaxbaxakanax_adj$"
 xaxbaxakanax_rite_desc:0 "Считая себя простым стадом овец, ведомых пастырем, ксаксбахаканакцы не имеют власти над своими духовными делами (роль жреческой касты сводится лишь к проведению церемоний и произнесению погребальных речей). Из-за своей крайне эзотерической природы они имеют очень примитивное отношение к окружающему миру"
 xin_xue_rite:0 "$xin_xue$"
 xin_xue_rite_adherent:0 "$xin_xue_adherent$"
 xin_xue_rite_adherent_plural:0 "$xin_xue_adherent_plural$"
 xin_xue_rite_adj:0 "$xin_xue_adj$"
 xin_xue_rite_desc:0 "Синь Сюэ возникла среди интеллектуальных споров, ознаменовавших заключительные годы движения Ханьвэй. Всё более анахроничный характер Четырнадцати небесных методов побудил ряд учёных переосмыслить их значение и уточнить их толкование. Делая это, они с изумлением обнаружили, что многие учения, приписываемые «Первому из Драконов», были на самом деле сфабрикованы, что породило широкий скептицизм по отношению к писаниям. Однако на этом этапе движение оставалось озабоченным в основном текстологической критикой и научными изысканиями, не имея единой философской основы.\n\nТо, что превратило Синь Сюэ в зрелую философскую систему, была публикация «Божественного искусствознания» в 1057 году от И.С. Эта работа систематически излагала центральный принцип «применения знаний к практическому управлению и инноваций через изменения», тем самым закладывая теоретический фундамент, на котором движение будет развиваться. После этого трактаты по Синь Сюэ множились, каждый расширял её доктрины с разных точек зрения, пока школа не превратилась в ту всеобъемлющую и разнообразную интеллектуальную традицию, которую признают сегодня."
