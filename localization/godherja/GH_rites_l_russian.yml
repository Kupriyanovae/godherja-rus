 wasteland_faith_rite_desc:0 "По всему Эрасу простираются неосвоенные регионы, не тронутые человеком — по крайней мере, на данный момент. Будь то из-за магической катастрофы, суровых условий или неумолимого наступления Тумана, огромные пространства мира оказались почти полностью лишены человеческой жизни. Хотя в самых бесплодных пустошах изредка цепляются за жизнь немногочисленные выжившие, в борьбе за собственное выживание люди давно утратили последние остатки общественного уклада — даже если они ютятся среди руин цивилизации, частью которой когда-то были."
