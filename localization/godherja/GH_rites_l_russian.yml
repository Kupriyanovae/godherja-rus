 marndeoticeni_cult_rite_adherent_plural:0 "$marndeoticeni_cult_adherent_plural$"
 marndeoticeni_cult_rite_adj:0 "$marndeoticeni_cult_adj$"
 marndeoticeni_cult_rite_desc:0 "Тшуеканисты поклоняются Тшуек'е, Одетому в Чёрное, который научил людей искусству чародейства и создания рун, прежде чем погрузиться в глубокий сон. Они верят, что его спящая форма видна и по сей день, и имеют сверхъестественное чутьё на её местонахождение в любое время. Тшуеканистские руны также гласят, что Тшуек'а наставлял «Первых Кузнецов», хотя знание того, что они создали, ныне утеряно во времени."
 mitikaka_rite:0 "$mitikaka$"
 mitikaka_rite_adherent:0 "$mitikaka_adherent$"
 mitikaka_rite_adherent_plural:0 "$mitikaka_adherent_plural$"
 mitikaka_rite_adj:0 "$mitikaka_adj$"
 mitikaka_rite_desc:0 "Хотя практика жертвоприношений всегда была способом обеспечить, чтобы Тенсесе никогда не оставался один, несмотря на уход его детей, и уакаклоханцы верили, что жертвы добровольцев и подготовленных позволят их душам присоединиться к их богу на небесах, чтобы составить ему компанию в его одиноком бдении, Фродброкна и великий ущерб, нанесённый Эрвалу, были восприняты митикака-токоллатитцанцами как апокалипсис. Смерть большинства магов-Царей уакаклоханцев и их народов ещё больше укрепила это, и митикака-токоллатитцанцы начали принимать неизбежность окончательной гибели своего народа, теперь, когда даже их главный бог был отнят у них."
 mogudorism_rite:0 "$mogudorism$"
 mogudorism_rite_adherent:0 "$mogudorism_adherent$"
 mogudorism_rite_adherent_plural:0 "$mogudorism_adherent_plural$"
 mogudorism_rite_adj:0 "$mogudorism_adj$"
 mogudorism_rite_desc:0 "Часто преследуемый культ магов, возникший в пограничных гарнизонных городах Катун-Кая. Могудоризм вырос из практик секты боевых магов, которые усовершенствовали искусство связывания различных своенравных и мерзких духов для использования их в качестве оружия. Хотя вера была окончательно запрещена катунским государством из-за их участия в попытке переворота в VIII веке от И.С., каждая попытка сжечь их учения оказывалась тщетной; копии Руководства по заковыванию и его дополнительных томов таинственным образом появлялись вновь."
 mokmanur_rite:0 "$mokmanur$"
 mokmanur_rite_adherent:0 "$mokmanur_adherent$"
 mokmanur_rite_adherent_plural:0 "$mokmanur_adherent_plural$"
 mokmanur_rite_adj:0 "$mokmanur_adj$"
 mokmanur_rite_desc:0 "Мокманурцы утверждают, что врата из Ада Тви открылись, когда Плеймао был изгнан с небес, и те, кто остался верен ему, были отторгнуты от Рая в наказание. Традиция Мокманура гласит, что Хел Тви на самом деле является более благожелательным существом, и Алау Коев откроется, когда мир освободится от влияния его врага. Поклоняясь водам Латунного моря, мокманурцы верят, что им суждено остановить возвращение Плеймао, и их наградой будет вечность в утешительных объятиях Вечной Ночи, Ада Тви."
 mothers_and_fathers_rite:0 "$mothers_and_fathers$"
 mothers_and_fathers_rite_adherent:0 "$mothers_and_fathers_adherent$"
 mothers_and_fathers_rite_adherent_plural:0 "$mothers_and_fathers_adherent_plural$"
 mothers_and_fathers_rite_adj:0 "$mothers_and_fathers_adj$"
 mothers_and_fathers_rite_desc:0 "«Матери и отцы» — это совокупность ритуалов и обычаев племен клановых земель, сохранившихся сквозь века как память и история их прошлого. Эти предания собираются, как правило, в форме песен, и каждое поколение должно передавать их следующему, чтобы защитить как свое наследие, так и цикла леса."
 mshvirat_rite:0 "$mshvirat$"
 mshvirat_rite_adherent:0 "$mshvirat_adherent$"
 mshvirat_rite_adherent_plural:0 "$mshvirat_adherent_plural$"
 mshvirat_rite_adj:0 "$mshvirat_adj$"
 mshvirat_rite_desc:0 "$mshvirat_desc$"
 muzacuh_rite:0 "$muzacuh$"
 muzacuh_rite_adherent:0 "$muzacuh_adherent$"
 muzacuh_rite_adherent_plural:0 "$muzacuh_adherent_plural$"
 muzacuh_rite_adj:0 "$muzacuh_adj$"
 muzacuh_rite_desc:0 "Вера Музаку возникла в прибрежных регионах восточного Катун-Кая как ответвление древней традиции почитания океана. В её центре стоит женское божество, олицетворяющее само море, которого верующие называют просто Муза.\n\nПеред каждым плаванием жрецы Музы совершают обряды гадания и приносят дары, молясь о спокойных водах и обильных уловах. Последователи редко осмеливаются лгать в её присутствии, а когда возникают споры, её статую выносят, чтобы она выступила в роли арбитра. Они верят, что, как воплощение моря, Муза заглядывает в сердца смертных, забирая нечестных бурями и вознаграждая честных мореплавателей безопасным проходом и обильными путешествиями."
 nabbarek_rite:0 "$nabbarek$"
 nabbarek_rite_adherent:0 "$nabbarek_adherent$"
 nabbarek_rite_adherent_plural:0 "$nabbarek_adherent_plural$"
 nabbarek_rite_adj:0 "$nabbarek_adj$"
 nabbarek_rite_desc:0 "Веря в девяносто книг «положительного» просветления и одну книгу «нейтрального» просветления, ведущую к вознесению после их прочтения, истоки этой веры можно проследить до гуру по имени Петика. После Дхарьи Вархи девяносто одна книга была признана содержащей единственное истинное знание в этом мире, а всё остальное, как считалось, было творением человека."
 nalmavast_rite:0 "$nalmavast$"
 nalmavast_rite_adherent:0 "$nalmavast_adherent$"
 nalmavast_rite_adherent_plural:0 "$nalmavast_adherent_plural$"
 nalmavast_rite_adj:0 "$nalmavast_adj$"
 nalmavast_rite_desc:0 "Нальмавастизм — это почитание одноимённой Нальмы и её обителей, традиционной богини урожая и плодородия народа леков. Однако она лишь одна из многих, ибо нальмаваки не отрицают существования множества богов на Эрасе — богов, принадлежащих другим, богов, не принадлежащих никому, и богов, которые не принадлежат вовсе. Из них лишь Нальма по-настоящему их, и потому лишь они принадлежат ей.\n\nОбычно изображаемая в образе либо крупной тёлки, либо юной девы, Нальма, как говорят, наблюдает за своим народом сквозь просветы между деревьями, из-под вод лесных ручьёв и направляет их к плодородным пастбищам шелестом листьев. В обоих своих обличьях её вырезанные из камня рога многочисленны, а кожа покрыта множеством переплетающихся красных узоров, через которые течёт жизненная сила мира природы."
 namejisht_rite:0 "$namejisht$"
 namejisht_rite_adherent:0 "$namejisht_adherent$"
 namejisht_rite_adherent_plural:0 "$namejisht_adherent_plural$"
 namejisht_rite_adj:0 "$namejisht_adj$"
 namejisht_rite_desc:0 "$namejisht_desc$"
 narina_rite:0 "$narina$"
 narina_rite_adherent:0 "$narina_adherent$"
 narina_rite_adherent_plural:0 "$narina_adherent_plural$"
 narina_rite_adj:0 "$narina_adj$"
 narina_rite_desc:0 "$narina_desc$"
 new_iyrossi_rite:0 "$new_iyrossi$"
 new_iyrossi_rite_adherent:0 "$new_iyrossi_adherent$"
 new_iyrossi_rite_adherent_plural:0 "$new_iyrossi_adherent_plural$"
 new_iyrossi_rite_adj:0 "$new_iyrossi_adj$"
 new_iyrossi_rite_desc:0 "Когда аверсарианцы были изгнаны с наших берегов, было созвано великое собрание, чтобы собрать и обсудить старые истории и ритуалы нашего народа, сохранённые различными кланами. С молитвами к Дейфарторосу, Богу Справедливости, мы в течение многих недель отделяли истину от тайной лжи аверсарианских демонов. Это собрание раскрыло ложь, насаждённую демонами, объединив все кланы, кроме одного, в поклонении старым богам, которым поклонялись наши предки.\n\nНе все согласились присутствовать на собрании. Кинамбрасти отвергли Дейфартороса и великое собрание, предпочтя вернуться к поклонению озёрному Демону Сильвайе, который вечно стремится разделить кланы в Малькое. Истинные ийросы ныне чтят тех, кто так усердно трудился, чтобы сохранить нашу веру и свергнуть аверсарианцев, стремясь уничтожить тех, кто вновь пытается нас разделить."
 omrayytor_rite:0 "$omrayytor$"
 omrayytor_rite_adherent:0 "$omrayytor_adherent$"
 omrayytor_rite_adherent_plural:0 "$omrayytor_adherent_plural$"
 omrayytor_rite_adj:0 "$omrayytor_adj$"
 omrayytor_rite_desc:0 "$omrayytor_desc$"
 ordro_aerdroxix_rite:0 "$ordro_aerdroxix$"
 ordro_aerdroxix_rite_adherent:0 "$ordro_aerdroxix_adherent$"
 ordro_aerdroxix_rite_adherent_plural:0 "$ordro_aerdroxix_adherent_plural$"
 ordro_aerdroxix_rite_adj:0 "$ordro_aerdroxix_adj$"
 ordro_aerdroxix_rite_desc:0 "Божественный орден великого дракона Эрдроксикса — божественного царя, столь же жестокого, сколь и мудрого, — возможно, канул в Доисторическую эпоху, но его верное жречество в божественном Зарре веками поддерживало его божественный домен, и их власти бросил вызов лишь подъем Аверсарианской Аавтократии. Несколько кризисов, ослабивших веру в период возвышения Империи, были бы незначительны по сравнению с бедствием Маклейского террора, когда Ордро Эрдроксикс был запрещен, а его оставшееся жречество погребено под Дометиклином."
 orgarrd_rite:0 "$orgarrd$"
 orgarrd_rite_adherent:0 "$orgarrd_adherent$"
 orgarrd_rite_adherent_plural:0 "$orgarrd_adherent_plural$"
 orgarrd_rite_adj:0 "$orgarrd_adj$"
 orgarrd_rite_desc:0 "$orgarrd_desc$"
 orndaehz_rite:0 "$orndaehz$"
 orndaehz_rite_adherent:0 "$orndaehz_adherent$"
 orndaehz_rite_adherent_plural:0 "$orndaehz_adherent_plural$"
 orndaehz_rite_adj:0 "$orndaehz_adj$"
 orndaehz_rite_desc:0 "Последователи этой веры считают Орндаэз, или 'Золотокровых', своими богами и повелителями, которые сами были столь же разнообразны, как и человечество, несмотря на свою великую силу, и пали, расколовшись на два враждующих племени. Они верят, что Золотокровые были затем уничтожены «Небесной Женщиной», которая изгнала их в землю без любви и страсти.\n\nТаким образом, орндаэзцы предаются плотским утехам, совершают ритуальные набеги и вкушают странные эликсиры, вызывающие эйфорию, чтобы направлять свои ощущения как энергию в «иные земли» — веря, что при достаточном количестве энергии Золотокровые смогут сбежать из изгнания. Друхандаэзаги также верят в священное состояние бытия, называемое «Жизненным Соединением», когда двое мужчин или две женщины объявляют друг друга недостающей половиной своей души и (в попытке предотвратить древний раскол, погубивший Золотокровых) заявляют, что их духи навеки едины, отказываясь участвовать в каких-либо утехах без присутствия другого."
 osmirat_rite:0 "$osmirat$"
 osmirat_rite_adherent:0 "$osmirat_adherent$"
 osmirat_rite_adherent_plural:0 "$osmirat_adherent_plural$"
 osmirat_rite_adj:0 "$osmirat_adj$"
 osmirat_rite_desc:0 "Осмиратцы поклоняются Богине Войны, Осмире, превыше всех прочих. Они видят духов, населяющих мир, как её павших воинов и проводят большую часть своей жизни, пытаясь быть одержимыми, чтобы завершить старые войны во имя её. Для них Алау Коев откроется только тогда, когда закончатся все войны верных, и осмиратцы считают себя достойными выполнить эту задачу."
 oulaupi_rite:0 "$oulaupi$"
 oulaupi_rite_adherent:0 "$oulaupi_adherent$"
 oulaupi_rite_adherent_plural:0 "$oulaupi_adherent_plural$"
 oulaupi_rite_adj:0 "$oulaupi_adj$"
 oulaupi_rite_desc:0 "$oulaupi_desc$"
 partic_rite:0 "$partic$"
 partic_rite_adherent:0 "$partic_adherent$"
 partic_rite_adherent_plural:0 "$partic_adherent_plural$"
 partic_rite_adj:0 "$partic_adj$"
 partic_rite_desc:0 "Для партиков магия — дело всей жизни: они с великим рвением изучают её и практикуют, следуя строго установленным ритуалам, которые из поколения в поколение передаются из уст в уста. Так выросло множество поколений искуснейших магов, владеющих искусством, непостижимо сложным для чужаков. Многие выдающиеся маги, известные истории, были партиками, и их способности столь же велики, сколь непостижимы их побуждения."
 portenchant_rite:0 "$portenchant$"
 portenchant_rite_adherent:0 "$portenchant_adherent$"
 portenchant_rite_adherent_plural:0 "$portenchant_adherent_plural$"
 portenchant_rite_adj:0 "$portenchant_adj$"
 portenchant_rite_desc:0 "Портеншанцы оказались завоёванными и угнетёнными под бичом аверсарианцев, но их вера не сломилась. Сьялволькское вторжение освободило их от рабства, но они не желают мстить своим бывшим хозяевам. Вместо этого они хотят вернуться к изоляционизму и тихой вере, как это было, когда они были свободны."
 redland_cults_rite:0 "$redland_cults$"
 redland_cults_rite_adherent:0 "$redland_cults_adherent$"
 redland_cults_rite_adherent_plural:0 "$redland_cults_adherent_plural$"
 redland_cults_rite_adj:0 "$redland_cults_adj$"
 redland_cults_rite_desc:0 "$redland_cults_desc$"
 rejection_rite:0 "$rejection$"
 rejection_rite_adherent:0 "$rejection_adherent$"
 rejection_rite_adherent_plural:0 "$rejection_adherent_plural$"
 rejection_rite_adj:0 "$rejection_adj$"
 rejection_rite_desc:0 "Культы Отвержения далеки от единого, чётко оформленного вероучения, и обычно их объединяют лишь две черты. Во-первых, они признают лишь одну высшую силу — это лич, возглавляющий культ. Во-вторых, у каждого такого культа обычно всего один последователь — если, конечно, не считать случаев, когда безмозглая нежить целыми легионами поклоняется своим хозяевам по их приказу."
 rutbay_rite:0 "$rutbay$"
 rutbay_rite_adherent:0 "$rutbay_adherent$"
 rutbay_rite_adherent_plural:0 "$rutbay_adherent_plural$"
 rutbay_rite_adj:0 "$rutbay_adj$"
 rutbay_rite_desc:0 "Рут'Бай — это кодекс одиннадцати отступников, которые убили первого падшего «святого», прошедшего Ос Киньер ещё при жизни. Провозглашая, что ни один живой жрец не способен по-настоящему постичь природу Арува Агата, верные отвергают магию, считая её злоупотреблённой искрой божественности, которую человечество украло у Аруваса."
 salacad_rite:0 "$salacad$"
 salacad_rite_adherent:0 "$salacad_adherent$"
 salacad_rite_adherent_plural:0 "$salacad_adherent_plural$"
 salacad_rite_adj:0 "$salacad_adj$"
 salacad_rite_desc:0 "$salacad_desc$"
 saldakas_rite:0 "$saldakas$"
 saldakas_rite_adherent:0 "$saldakas_adherent$"
 saldakas_rite_adherent_plural:0 "$saldakas_adherent_plural$"
 saldakas_rite_adj:0 "$saldakas_adj$"
 saldakas_rite_desc:0 "Отдалённая секта, сосредоточенная в северо-западных горах Дахан-Гона. Салдакцы считают, что власть не только конкретна, но и осязаема в форме магии. Практикующие эту секту стремятся накапливать магические энергии в своих телах, а ритуалы салдакцев пронизаны тайными искусствами."
 sarmuyr_rite:0 "$sarmuyr$"
 sarmuyr_rite_adherent:0 "$sarmuyr_adherent$"
 sarmuyr_rite_adherent_plural:0 "$sarmuyr_adherent_plural$"
 sarmuyr_rite_adj:0 "$sarmuyr_adj$"
 sarmuyr_rite_desc:0 "$sarmuyr_desc$"
 segyetes_rite:0 "$segyetes$"
 segyetes_rite_adherent:0 "$segyetes_adherent$"
 segyetes_rite_adherent_plural:0 "$segyetes_adherent_plural$"
 segyetes_rite_adj:0 "$segyetes_adj$"
 segyetes_rite_desc:0 "$segyetes_desc$"
 selvarossi_iyrossi_rite:0 "$selvarossi_iyrossi$"
 selvarossi_iyrossi_rite_adherent:0 "$selvarossi_iyrossi_adherent$"
 selvarossi_iyrossi_rite_adherent_plural:0 "$selvarossi_iyrossi_adherent_plural$"
 selvarossi_iyrossi_rite_adj:0 "$selvarossi_iyrossi_adj$"
 selvarossi_iyrossi_rite_desc:0 "Когда аверсарианцы были изгнаны с наших берегов, было созвано великое собрание, чтобы собрать и обсудить старые истории и ритуалы нашего народа. Мы отказались присоединиться к встрече тех, кто всё ещё поклонялся Дейфарторе Обманщику, Богу Гор. Клан Кинамбрасти решил вернуться в дом Госпожи Селвы и отбросить ложную веру, навязанную аверсарианцами. Аверсарианцы изгнали клан от озера, чтобы ослабить Госпожу Селву, которая удерживала мир в равновесии, чтобы никто не стал слишком могущественным и не разрушил мир. Падение аверсарианцев было неизбежно, когда они отрезали силу Госпожи Селвы и попытались править миром. Теперь, когда мир разрушен, клан стремится предотвратить дальнейший коллапс и надеется однажды исцелить его, укрепляя Госпожу священными ритуалами и празднествами."
 shyatan_rite:0 "$shyatan$"
 shyatan_rite_adherent:0 "$shyatan_adherent$"
 shyatan_rite_adherent_plural:0 "$shyatan_adherent_plural$"
 shyatan_rite_adj:0 "$shyatan_adj$"
 shyatan_rite_desc:0 "$shyatan_desc$"
 sky_rite_rite:0 "$sky_rite$"
 sky_rite_rite_adherent:0 "$sky_rite_adherent$"
 sky_rite_rite_adherent_plural:0 "$sky_rite_adherent_plural$"
 sky_rite_rite_adj:0 "$sky_rite_adj$"
 sky_rite_rite_desc:0 "$sky_rite_desc$"
 solungvend_rite:0 "$solungvend$"
 solungvend_rite_adherent:0 "$solungvend_adherent$"
 solungvend_rite_adherent_plural:0 "$solungvend_adherent_plural$"
 solungvend_rite_adj:0 "$solungvend_adj$"
 solungvend_rite_desc:0 "Солунгвендцы придают большое значение чистоте себя, которую они стремятся достичь через глубокую медитацию. Последователи часто ищут изолированные вершины и ущелья, предпочтительно те, где мало точек опоры, поскольку они верят, что освобождение от физической привязанности к Эрасу необходимо для достижения истинной безмятежности. Их трансы часто длятся по несколько дней, и лишь холодные ветры составляют им компанию."
