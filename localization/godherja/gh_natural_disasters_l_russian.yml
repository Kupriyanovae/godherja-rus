 # Great project recovery names and descriptions
 great_project_type_gh_cavein: "Преодоление последствий обвала"
 great_project_type_gh_cavein_desc: "Катастрофический обвал погреб под невообразимой тяжестью туннели, здания и людей. Восстановление требует укрепления нестабильных проходов и отстройки утраченного."
 great_project_type_gh_tornado: "Преодоление последствий торнадо"
 great_project_type_gh_tornado_desc: "Мощный смерч раскидал стада и лагеря на многие мили вокруг. Необходимо направить всадников на поиски выживших и восполнить то, что было потеряно."
 great_project_type_gh_hurricane: "Преодоление последствий урагана"
 great_project_type_gh_hurricane_desc: "Свирепый океанский шторм обрушился на побережье, разрушив гавани и затопив поселения. Требуются корабли, рабочие руки и золото, чтобы помочь изолированным общинам и восстановить разрушенное."
 great_project_type_gh_sulfur_storm: "Преодоление последствий серного шторма"
 great_project_type_gh_sulfur_storm_desc: "Токсичные испарения отравили воздух и разъели камень."

 # Contribution names
 great_project_type_gh_cavein_contribution_recovery: "Укрепление туннелей"
 great_project_type_gh_cavein_contribution_recovery_desc: "Мы должны использовать любые средства для укрепления обвалившихся проходов и аварийных сводов, пока новые обвалы не унесли новые жизни и не разрушили графство."
 great_project_type_gh_cavein_contribution_reconstruction: "Восстановление общин"
 great_project_type_gh_cavein_contribution_reconstruction_desc: "Засыпанные здания и разрушенные оросительные системы нужно откопать и восстановить. Это долгий и трудный процесс в полной темноте."

 great_project_type_gh_tornado_contribution_recovery: "Поисково-спасательные работы"
 great_project_type_gh_tornado_contribution_recovery_desc: "Торнадо разметал выживших и скот на много миль по степи. Всадники должны отыскать живых и собрать всё, что еще можно спасти."
 great_project_type_gh_tornado_contribution_herd_restoration: "Восполнение поголовья"
 great_project_type_gh_tornado_contribution_herd_restoration_desc: "Часть нашего скота погибнет или разбежалась из-за бури. Мы должны выслать всадников, чтобы докупить скот или забрать то, что нам не хотят отдавать добровольно."

 great_project_type_gh_hurricane_contribution_recovery: "Спасение прибрежных поселений"
 great_project_type_gh_hurricane_contribution_recovery_desc: "Шторм разрушил гавани и затопил низинные поселения. Нужны корабли и припасы, чтобы добраться до отрезанных от мира общин и начать восстановление."
 great_project_type_gh_hurricane_contribution_reconstruction: "Восстановление гаваней"
 great_project_type_gh_hurricane_contribution_reconstruction_desc: "Разрушенные пирсы, затонувшие суда и разбитые склады означают огромные финансовые потери. Управляющий должен лично возглавить реконструкцию."

 great_project_type_gh_sulfur_storm_contribution_purification: "Очищение"
 great_project_type_gh_sulfur_storm_contribution_purification_desc: "Желтый дым застаивается в низинах и проникает в дома. Нужно разжигать костры, очищать колодцы, а самые пострадавшие постройки — проветривать или сносить."
 great_project_type_gh_sulfur_storm_contribution_fortification_repair: "Ремонт укреплений"
 great_project_type_gh_sulfur_storm_contribution_fortification_repair_desc: "Кислотный туман разъедает железо и разрушает раствор. Стены, ворота и башни требуют осмотра и ремонта, пока они не обрушились в самый неподходящий момент."

 # Modifier names and descriptions
 gh_nd_cavein_1_county_modifier: "Ущерб от обвала"
 gh_nd_cavein_1_county_modifier_desc: "Частичный обвал повредил туннели и инфраструктуру по всему графству. Восстановительные работы уже ведутся, но потребуют времени."
 gh_nd_cavein_2_county_modifier: "Серьезный ущерб от обвала"
 gh_nd_cavein_2_county_modifier_desc: "Значительные секции пещер оказались завалены или заблокированы. Ущерб инфраструктуре, владениям и людям огромен."
 gh_nd_cavein_3_county_modifier: "Катастрофический обвал"
 gh_nd_cavein_3_county_modifier_desc: "Подземное графство пострадало от почти полного обвала. Огромные территории завалены без возможности быстрого восстановления, а человеческие жертвы исчисляются сотнями."
 gh_nd_cavein_wasteland_habitability_modifier: "Завалы от обвала"
 gh_nd_cavein_wasteland_habitability_modifier_desc: "Огромные кучи обломков сделали часть подземных пространств непригодными для использования. Их расчистка — колоссальный труд."
 gh_nd_tornado_1_county_modifier: "Ущерб от торнадо"
 gh_nd_tornado_1_county_modifier_desc: "Край смерча задел графство, перевернув несколько лагерей и разбросав скот. Ущерб ощутим, но ограничен."
 gh_nd_tornado_2_county_modifier: "Серьезный ущерб от торнадо"
 gh_nd_tornado_2_county_modifier_desc: "Торнадо прорезал широкую просеку в степи. Лагеря сровнены с землей, большая часть скота пропала, и последствия этого будут ощущаться годами."
 gh_nd_tornado_3_county_modifier: "Катастрофический торнадо"
 gh_nd_tornado_3_county_modifier_desc: "Гигантский смерч уничтожил всё на своем пути. Графство опустошено, стада развеяны по ветру, а выживших собирают до сих пор."
 gh_nd_tornado_herd_damage_modifier: "Рассеянное стадо"
 gh_nd_tornado_herd_damage_modifier_desc: "Значительная часть скота графства была потеряна или разбежалась из-за торнадо. Поголовье пока не восстановлено до прежних размеров."
 gh_nd_hurricane_1_county_modifier: "Ущерб от урагана"
 gh_nd_hurricane_1_county_modifier_desc: "Внешний край шторма задел побережье. Затоплены некоторые здания и повреждены пирсы, но худшего удалось избежать."
 gh_nd_hurricane_2_county_modifier: "Серьезный ущерб от урагана"
 gh_nd_hurricane_2_county_modifier_desc: "Ураган нанес тяжелый удар. Всё превратилось в руины, но конец бедствию уже виден."
 gh_nd_hurricane_3_county_modifier: "Катастрофический ураган"
 gh_nd_hurricane_3_county_modifier_desc: "Шторм обрушился на берег с чудовищной силой, снося поселения до самого основания."
 gh_nd_hurricane_fertility_county_modifier: "Обогащение почвы после урагана"
 gh_nd_hurricane_fertility_county_modifier_desc: "Шторм принес на низменности богатый ил. Хотя разрушения были ужасными, наводнение сделало почву необычайно плодородной."
 gh_nd_sulfur_storm_1_county_modifier: "Серные испарения"
 gh_nd_sulfur_storm_1_county_modifier_desc: "Край серного облака прошёл над графством. Везде стоит едкий запах, воду из колодцев приходится кипятить, а у людей слезятся глаза — но самое худшее нас миновало."
 gh_nd_sulfur_storm_2_county_modifier: "Серьезный ущерб от серной бури"
 gh_nd_sulfur_storm_2_county_modifier_desc: "Токсичные испарения нависли over графством. Воздух буквально обжигает легкие."
 gh_nd_sulfur_storm_3_county_modifier: "Катастрофическая серная буря"
 gh_nd_sulfur_storm_3_county_modifier_desc: "Вся мощь серной бури обрушилась на графство. Воздухом невозможно дышать, колодцы отравлены, а укреплениям и зданиям нанесен тяжелейший структурный урон."
 gh_nd_sulfur_storm_wasteland_habitability_modifier: "Серная скверна"
 gh_nd_sulfur_storm_wasteland_habitability_modifier_desc: "Серный осадок, оставленный бурей, сделал части графства непригодными для жизни. Отравленная земля не принимает даже нежить."
 gh_nd_sulfur_storm_stress_modifier: "Токсичная атмосфера"
 gh_nd_sulfur_storm_stress_modifier_desc: "Недели дыхания отравленным воздухом расшатали нервы и затуманили разум. Каждый вдох напоминает о том, что происходящее ужасно неправильно."

