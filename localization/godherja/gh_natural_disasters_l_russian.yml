 # Cave-in events
 gh_nd.1000.t: "Толчки в глубинах"
 gh_nd.1000.desc: "Глубинный камень заговорил. По всем подземным владениям прокатился гул — не привычный треск древней породы, а нечто тревожное и неправильное. Смотрители шахт эвакуируют нижние туннели. Что бы ни приближалось, оно не будет милосердным."
 gh_nd.1000.a: "Немедленно укрепить опоры."
 gh_nd.1000.a.tt: "В подземных владениях неминуем обвал."
 gh_nd.1001.t: "Обвал!"
 gh_nd.1001.desc_severe: "Туннели обрушились в катастрофическом завале. Огромные секции подземных пространств погребены под невообразимым весом: владения раздавлены, проходы заблокированы, а число жертв уже огромно."
 gh_nd.1001.desc_moderate: "Значительный обвал опустошил часть подземного графства. Туннели заблокированы, здания погребены, а спасательные отряды все еще ищут выживших среди обломков."
 gh_nd.1001.desc_minor: "Частичный обвал произошел в подземном графстве. Ущерб серьезен, но ограничен — большинство туннелей остаются проходимыми."
 gh_nd.1001.a: "Сначала спасите выживших."
 gh_nd.1010.t: "Расчистка завалов"
 gh_nd.1010.desc: "Первоначальный кризис миновал, но работа по восстановлению только началась. Горы обломков должны быть сдвинуты, туннели укреплены заново, а все погребенное под землей — заново оценено. Пройдут годы, прежде чем графство вернется к прежней жизни."
 gh_nd.1010.a: "Мы всё отстроим."

 # Tornado events
 gh_nd.2000.t: "Зеленое небо"
 gh_nd.2000.desc: "Небо над степью приобрело болезненный зеленый оттенок. Старейшины кочевников знают этот цвет. Кони уже рвутся с привязей. Остался день, а может и меньше, прежде чем придет гигантский смерч."
 gh_nd.2000.a: "Увести стада в низины."
 gh_nd.2000.a.tt: "К степи приближается торнадо. Стада и лагерь под угрозой."
 gh_nd.2001.t: "Вращающийся ветер"
 gh_nd.2001.desc_severe: "Гигантский смерч спустился с небес, словно перст разгневанного бога. Он ходил по степи часами, пожирая всё на своем пути — лагеря, стада, скот и людские жизни."
 gh_nd.2001.desc_moderate: "Торнадо прорезал широкую просеку через степь, рассеяв стада и сровняв с землей лагеря. Потеря одного только скота будет ощущаться годами."
 gh_nd.2001.desc_minor: "Вращающийся ветер прошёл рядом, но уберег нас от основной своей ярости. Пострадали окраины графства — перевернуты лагеря, разбежалась часть скота, — но основа выстояла."
 gh_nd.2001.a: "Собрать выживших и пересчитать скот."
 gh_nd.2010.t: "После бури"
 gh_nd.2010.desc: "Торнадо ушел, но память о нем будет преследовать степь еще целое поколение. Мертвые похоронены, потерянные стада частично возвращены, а разрушенные лагеря ставятся заново."
 gh_nd.2010.a: "Степь выстоит."

 # Hurricane events
 gh_nd.3000.t: "Море чернеет"
 gh_nd.3000.desc: "Море приобрело цвет старого железа, а птицы тысячами улетают вглубь суши. Начальники портов уже приказывают уводить корабли в укрытия. Что бы ни надвигалось, оно идет из глубоких вод."
 gh_nd.3000.a: "Укрепить гавань и запереть ставни."
 gh_nd.3000.a.tt: "Приближается ураган. Прибрежные поселения в смертельной опасности."
 gh_nd.3001.t: "Великий шторм выходит на сушу"
 gh_nd.3001.desc_severe: "Ураган обрушился на берег с ужасающей силой. Он снес здания до самого фундамента, продвинул море на милю вглубь суши и затопил всё на своем пути бурлящей стеной воды."
 gh_nd.3001.desc_moderate: "Шторм нанес тяжелый удар. Гавани разрушены, нижние улицы прибрежных городов до сих пор под водой, а рыболовецкий флот практически уничтожен."
 gh_nd.3001.desc_minor: "Внешний край урагана прошлся по побережью. Гавани повреждены, некоторые здания затоплены, но самое худшее нас миновало."
 gh_nd.3001.a: "Немедленно начать спасательную операцию."
 gh_nd.3010.t: "Шторм утих"
 gh_nd.3010.desc: "Ураган истощил свои силы. За собой он оставляет разрушения, но также, как ни странно, обещание обновления. Море нанесло богатый ил на все низины."
 gh_nd.3010.a: "Мы выжили. Теперь мы восстановим всё."

 # Sulfur storm events
 gh_nd.4000.t: "Желтое небо с севера"
 gh_nd.4000.desc: "Мерзкая желтая дымка начала смещаться к югу со стороны владений личей. Она несет с собой зловоние серы и нечто худшее — глубокую искажение, от которого слезятся глаза и горят легкие. Буря станет еще хуже, прежде чем пройдет."
 gh_nd.4000.a: "Запечатать колодцы и запастись водой."
 gh_nd.4000.a.tt: "Из владений личей приближается серная буря. Графства, населенные людьми, пострадают от отравления газами и разрушения построек."
 gh_nd.4001.t: "Буря желтой смерти"
 gh_nd.4001.desc_severe: "Серная буря обрушилась во всей своей удушающей ярости. Воздух окрасился в цвет застарелых синяков, и каждый вдох обжигает. Здания уже проявляют признаки разъедания — крошится известковый раствор, проедены железные скрепы."
 gh_nd.4001.desc_moderate: "Серные испарения нависли над графством, словно зловонное одеяло. Воду из колодцев приходится кипятить перед питьем, воздух раздражает легкие, а у всех жителей расшатаны нервы после нескольких дней едкого запаха."
 gh_nd.4001.desc_minor: "Края серной бури задели графство. Запах стоит повсюду, а испарения умеренно токсичны, но самое худшее пронеслось мимо."
 gh_nd.4001.a: "Ввести протоколы борьбы с болезнью."
 gh_nd.4010.t: "Испарения рассеиваются"
 gh_nd.4010.desc: "Серные облака рассеялись, оставив после себя разъеденные здания, отравленные колодцы и жителей, чьи нервы были измотаны неделями ядовитого воздуха. Фортенорны уже докладывают о значительных повреждениях железа их укреплений."
 gh_nd.4010.a: "Начать очищение."

