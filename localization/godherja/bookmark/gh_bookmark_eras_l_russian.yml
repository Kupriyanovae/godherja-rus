l_russian:
 bm_group_37_title: "Рабы Востока"
 bm_group_37: "37"
 bm_group_tooltip_37: "#T $bm_group_37_title$ #!\n$bm_not_released$\n\n#help \"«Снова варвары? Что ж, пусть преклонят колени или узнают, что бывает, когда отбросы мира отвергают мою власть».\n~Катанукса, 37 г. от И.С.#!\n\nС востока маршируют шевигады: вырвавшись из оков рабства, они отправляются покорять земли, которые однажды станут известны как [Concept('chevalie','Шевалье')|E]. Однако они и не подозревают, что из своих тёмных залов за ними уже наблюдает Король-Волшебник..."
 
 bm_group_67_title: "Наследие забытой эры"
 bm_group_67: "67"
 bm_group_tooltip_67: "#T $bm_group_67_title$ #!\n$bm_not_released$\n\n#help \"«Никарины служили Эрсодиаксу, но кому служит этот император? И ради чего он повелевает своей империей?»\n~Эрисойникс, 4 г. от И.С.#!\n\nПоследний Никарин мёртв, как и древний Катанукса. [Concept('aversaria','Аверсария')|E] расширяется, заполняя вакуум власти, пока хаос охватывает увядающие города деккекадов."
 
 bm_group_85_title: "Короли-варвары"
 bm_group_85: "85"
 bm_group_tooltip_85: "#T $bm_group_85_title$ #!\n$bm_not_released$\n\n#help \"«Они спрашивают, по какому праву маг должен править нашей державой. Я отвечаю им: по праву рождения, по праву заслуг и по праву сердца. Я молюсь не о том, чтобы он правил хорошо, я молюсь о безопасности, которой доброе правление лишит моего старейшего друга...»\n~Бастион, 76 г. от И.С.#!\n\nБастион мёртв. Его преемник, маг Версижекс, восходит на престол вопреки протестам шевигадов. Не только он [Concept('magi','маг')|E], но его еще и терзают видения тёмного будущего. Многие опасаются, что новый верховный король окажется не готов ответить на вызов, брошенный повстанцами-галликадами с запада."
 
 bm_group_114_title: "Возвышение и падение богов"
 bm_group_114: "114"
 bm_group_tooltip_114: "#T $bm_group_114_title$ #!\n$bm_not_released$\n\n#help \"«Пусть попробуют оскорбить бога! Своего бога!»\n~Фанагоракс, 114 г. от И.С.#!\n\nВ [Concept('aversaria','Аверсарии')|E] непопулярный аавтократ Фанагоракс обещает отомстить ийросским налётчикам, долгое время терзавшим Этепезею. На юге балариды теряют свои последние северные твердыни, уступая их [Concept('ritualism','ритуалистам')|E]. Красная звезда реет над эрой войны."
 
 bm_group_144_title: "Рёв Пожирателя миров"
 bm_group_144: "144"
 bm_group_tooltip_144: "#T $bm_group_144_title$ #!\n$bm_not_released$\n\n#help \"«Я видел это. Я видел ужасающее разрушение. Всё и все, кого я знал, сгинули. Не осталось даже руин моего дома. Я умоляю вас бежать. Спасайтесь от этого чудовища».\n~Неизвестный беженец, 144 г. от И.С.#!\n\n[Concept('sarradon','Саррадон')|E] перед лицом гибели: из древней гробницы вырвался [Concept('the_worldeater','Пожиратель миров')|E] — великий зверь, уже сразивший Королеву королевства. Ныне оставшийся без правителя и раздираемый междоусобицами престол Саррадона открыт для любого, кто сможет сразить мерзость и вернуть порядок в древнее царство."
 
 bm_group_156_title: "Расплата нерождённых королей"
 bm_group_156: "156"
 bm_group_tooltip_156: "#T $bm_group_156_title$ #!\n$bm_not_released$\n\n#help \"«Я так долго молча и терпеливо ждал в тени. Хватит! Они вострепещут перед моей мощью! История навсегда запомнит имя Виласа Венслау!»\n~Вилас, 155 г. от И.С.#!\n\nКонтинент объят пламенем. В [Concept('aversaria','Аверсарии')|E] [Concept('dragons','драконы')|E] взмывают в небеса среди облаков пепла, пока жители материка восстают против клик городов-государств, издавна господствовавших в империи. Одновременно с этим беженцы хлынули из Просвещённости Вравсил, со слезами предупреждая каждого встречного о восстании почтенных мертвецов."
 
 bm_group_201_title: "Песни Пророка"
 bm_group_201: "201"
 bm_group_tooltip_201: "#T $bm_group_201_title$ #!\n$bm_not_released$\n\n#help \"«Эти северные племена не стоят забот — они годятся лишь в рабы нам, владыкам мира».\n~Атешатен, 176 г. от И.С.#!\n\n[Concept('vilas_venslau','Вилас Венслау')|E] повержен — не армиями смертных, а рукой собственного ученика, и [Concept('liches','личи')|E] устремляются на север, чтобы выкроить себе собственные владения. На другом краю света племена амсарцев, чьё имя означает лишь «рабы», сбиваются у костров, слушая речи Пророка и изумляясь его обещаниям славного будущего."
 
 bm_group_256_title: "Божественные короли и пророчества"
 bm_group_256: "256"
 bm_group_tooltip_256: "#T $bm_group_256_title$ #!\n$bm_not_released$\n\n#help \"«Истина станет известна по всем землям, воля божества явится в свершениях моей объединённой Бияреды».\n~Эшво, 254 г. от И.С.#!\n\nПо всему [Concept('sarradon','Саррадону')|E] возникли несметные культы, бросившие вызов гегемонии [Concept('ritualism','ритуалистов')|E] и ввергшие царство в эру неопределенности. На юге джунглевые королевства Дамоты вступают в последнюю священную войну за своё будущее, пока на севере первый шевальенский Верховный король готовит решающий поход для уничтожения галликадов."
 
 bm_group_296_title: "Возвышение Вардена"
 bm_group_296: "296"
 bm_group_tooltip_296: "#T $bm_group_296_title$ #!\n$bm_not_released$\n\n#help \"«Думаю, мой дорогой бывший друг, ты обнаружишь, что мало какая валюта ценнее преданности. Мёртвый не может тратить монеты — но что произойдёт, когда ты дашь человеку кошель, который, как он верит, переживёт его самого? Предлагаю тебе размыслить об этом, пока мой слуга заканчивает точить мой меч».\n~Усун, 302 г. от И.С.#!\n\n[Concept('regency_of_karadun','Регентство Харадун')|E] охвачено огнём, когда так называемый [Concept('the_first_warden','Первый Варден')|E] провозглашает, что узрел истину мира. Бог реален, и он есмь зло, а [Concept('ritualism','ритуалисты')|E] освобождают его. Тем временем, пока [Concept('aversaria','имперцы')|E] триумфально стоят на севере, многие задаются вопросом, станет ли это концом для последователей Эрсодиакса."
 
 bm_group_344_title: "Война на Небесах"
 bm_group_344: "344"
 bm_group_tooltip_344: "#T $bm_group_344_title$ #!\n$bm_not_released$\n\n#help \"«Этот конфликт не продлится долго. Мы либо отбросим их здесь, либо потерпим поражение и канем в историю».\n~Улатир, 323 г. от И.С.#!\n\nСтарый порядок [Concept('sarradon','Саррадона')|E] сгинул: последние остатки софокистского королевства бежали в провинцию Харадун, чтобы принять последний бой. Пока на континенте чертятся линии фронта, несмотря на смерть [Concept('the_first_warden','Первого Вардена')|E], многие задаются вопросом, доживут ли они до конца этой войны."
 
 bm_group_399_title: "Падение Кемсара"
 bm_group_399: "399"
 bm_group_tooltip_399: "#T $bm_group_399_title$ #!\n$bm_not_released$\n\n#help \"«И последние капли дождя прекратятся с последней нотой последней пустынной птицы, и первые капли крови заменят текучую воду, смешавшись с первыми каплями слёз господ, ставших слугами».\n~Пророк, 201 г. от И.С.#!\n\nКемсар пал: река, долгое время питавшая его посевы, была повёрнута магией амсарцев. Пока освобождённые рабы возводят своё новое царство, продвижение [Concept('wardenism','варденитов')|E] застопорилось с падением их величайшего союзника. На другом краю света [Concept('aversaria','Аверсария')|E] начинает вторжение в Айроной."
 
 bm_group_421_title: "Месть драконов"
 bm_group_421: "421"
 bm_group_tooltip_421: "#T $bm_group_421_title$ #!\n$bm_not_released$\n\n#help \"«Разве ты не видишь? Единственный способ победить северный бич — это битва, а не трусливое укрытие за этими рушащимися стенами!»\n~Пьет, 420 г. от И.С.#!\n\n[Concept('aversaria','Аверсария')|E] пылает в огне [Concept('dragons','драконицы')|E] Артенаксы, Аавтократ мёртв среди пепла Ораисполя. [Concept('marchers','Марочники')|E] готовятся к великому походу, чтобы навсегда разгромить [Concept('liches','личей')|E]. Тем временем где-то далеко последние эхо Кемсара медленно уходит в историю."
 
 bm_group_442_title: "Наследие Северной марки"
 bm_group_442: "442"
 bm_group_tooltip_442: "#T $bm_group_442_title$ #!\n$bm_not_released$\n\n#help \"«Где остальная армия!? Они таранят ворота, дурак!»\n~Неизвестный солдат, 442 г. от И.С.#!\n\nЦелое поколение [Concept('marchers','шевальенских')|E] воинов возвращается на юг из похода в [Concept('the_lichdoms','Личества')|E], воскрешённое вместе с верховным королём Пьетом их новыми господами-[Concept('liches','личами')|E]. Пока Шевалье пылает в огне народной революции и вторжения нежити, Аавтократ Элиадиас начинает новый золотой век в [Concept('aversaria','Аверсарии')|E], победив ужасную Артенаксу, и устремляет взор на север с мечтами о завоеваниях."
 
 bm_group_569_title: "Затишье перед бурей"
 bm_group_569: "569"
 bm_group_tooltip_569: "#T $bm_group_569_title$ #!\n$bm_not_released$\n\n#help \"«Скоро они все увидят. Им больше не позволят укрываться в своей слепоте, своей слабости».\n~Темос, 569 г. от И.С.#!\n\nПосле триумфа в Калатипсоми [Concept('aversaria','Аверсария')|E] греется в лучах золотого века, а её армии триумфально маршируют по Расколотому побережью. Однако по Континенту уже ползут тени — как в неисследованных внутренних землях, так и в древнем сердце империи."
 
 bm_group_600_title: "Хаос седьмого века"
 bm_group_600: "600"
 bm_group_tooltip_600: "#T $bm_group_600_title$ #!\n$bm_not_released$\n\n#help \"«Мы должны спешить. В этих землях что-то зреет, и если мы не успеем узнать истину до того, как он завершит свои замыслы... вся Империя вскоре пострадает».\n~Басилаес, 597 г. от И.С.#!\n\nОрды нежити опустошают [Concept('the_continent','Континент')|E]: вторжение Адваги Адракампы в [Concept('chevalie','Шевалье')|E] и возвышение графа Темоса в Опахасии сеют невообразимые разрушения. На пути этой волны стоит расколотая [Concept('aversaria','Аверсария')|E], раздираемая враждующими губернаторами при опустевшем престоле Элиадиас. Ползут слухи о ещё большем зле, зреющем на севере, и многие опасаются, что Аверсария не переживёт грядущий кризис."
 
 bm_group_631_title: "Марш рабов"
 bm_group_631: "631"
 bm_group_tooltip_631: "#T $bm_group_631_title$ #!\n$bm_not_released$\n\n#help \"«Машины. Они должны быть машинами. Как иначе они могли достичь такой точности, такой слаженности? Как нам вообще их остановить?»\n~Териокс, 633 г. от И.С.#!\n\nХотя нежить была повержена, передышка оказалась короткой. По всему известному миру вспышка [Concept('bloodblight','кровавого мора')|E] уносит бесчисленные жизни, включая Верховного короля [Concept('chevalie','Шевалье')|E]. Пока древние [Concept('sirhad','сирхады')|E] [Concept('sarradon','Саррадона')|E] рушится, возводя жестокость [Concept('war_in_heaven','Войны на небесах')|E] на новую высоту, таинственный [Concept('kartharadd','Картараддский')|E] Империум собирает силы для вторжения в [Concept('aversaria','Аверсарию')|E]. Остаётся открытым вопрос: кто из мировых держав (если вообще кто-либо) переживёт грядущую эру крови и огня."
 
 bm_group_679_title: "Кузница легионов"
 bm_group_679: "679"
 bm_group_tooltip_679: "#T $bm_group_679_title$ #!\n$bm_not_released$\n\n#help \"«Эти демоны не уничтожили нас. Вторая империя не падёт, как первая».\n~$aauto_eramos_link$ Эрам#!, 677 г. от И.С.#!\n\nХотя [Concept('kartharadd','Картараддский')|E] Империум захватил Малькою и осадил Тинитиду, для [Concept('aversaria','Аверсарии')|E] ещё не всё потеряно. При нововентчанном аавтократе Эраме устаревшая аверсарианская армия была реорганизована, и началось великое контрнаступление. Пока Континент продолжает пылать, все знают, что лишь одна империя (если вообще какая-то) выйдет из этой войны невредимой. Но лишь время покажет, какая именно."

 bm_group_723_title: "Ярость пустыни"
 bm_group_723: "723"
 bm_group_tooltip_723: "#T $bm_group_723_title$ #!\n$bm_not_released$\n\n#help \"«Ты, брат мой, сложишь оружие и сдашь цитадели. Жизни твоих солдат, жён и сыновей конфискованы. Ты можешь взять одного коня, один плащ и один меч. Таковы условия моего милосердия».\n~Рузбе, 725 г. от И.С.#!\n\nДва десятка принцев берутся за оружие в Амсарском Хиклахне, превращая мечту Пророка об объединённом Амсаре в кошмар, где сородичи воюют с сородичами. Слабость Хиклахна оборачивается силой их давних врагов: кемсарцы объединяются под началом военачальника Хенутахта. Тем временем в землях, прежде удерживаемых [Concept('mamuramat','мамуром')|E] Запада, триумфальное прибытие айяров, похоже, готово наконец воссоединить регион, положив конец полувековой анархии."

 bm_group_764_title: "Передышка от хаоса"
 bm_group_764: "764"
 bm_group_tooltip_764: "#T $bm_group_764_title$ #!\n$bm_not_released$\n\n#help \"«Там, где прежде была тьма, я несу свет. Из руин — процветание. Мы восторжествовали над врагом, некогда сокрушившим нас, и слава наша будет вечной».\n~Тейссия, 766 г. от И.С.#!\n\nХаос седьмого века утих. [Concept('kartharadd','Картараддский')|E] Империум сгинул, и [Concept('aversaria','Аверсария')|E] высится триумфатором: земли павшей империи уже разделены на мириады новых имперских владений. За морем, однако, упадничество [Concept('sirhad','сирхадов')|E] достигло апогея в новой эре опустошения, когда магия, прежде строго регулируемая из-за своей опасности, ныне применяется для уничтожения целых городов. Хотя кровопролитие на севере, кажется, завершилось, многие шепчут, что катастрофа в [Concept('sarradon','Саррадоне')|E] только начинается."
 
 bm_group_802_title: "Затихший Юг"
 bm_group_802: "802"
 bm_group_tooltip_802: "#T $bm_group_802_title$ #!\n$bm_not_released$\n\n#help \"«И с этим ударом силы и мы, и альмады наконец получим то, чего заслуживаем!»\n~Иян, 802 г. от И.С.#!\n\n[Concept('sarradon','Саррадон')|E] лежит в руинах, сгорев в пламени [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E], когда Эра Огня ужасающим образом подошла к концу. Но даже это не кажется финишем борьбы, а лишь началом нового этапа: [Concept('wardenism','вардениты')|E] и [Concept('ritualism','ритуалисты')|E] поднимают рваные знамёна над руинами своей цивилизации, чтобы возобновить битву. [Concept('the_downfall','Падение')|E] началось."
 
 bm_group_834_title: "Рыцарь и Варден"
 bm_group_834: "834"
 bm_group_tooltip_834: "#T $bm_group_834_title$ #!\n$bm_not_released$\n\n#help \"«Возможно, из-за этого опустошения должно быть пролито больше слёз, чем крови, ибо мы оплакиваем не только то, что было, но и то, что могло бы быть».\n~[Concept('sanad','Санад')|E], 827 г. от И.С.#!\n\n[Concept('mamuramat','Мамурамат')|E] стоически объединён среди пепла [Concept('the_decimation_of_sarradon','Халакдуна')|E]: мамур [Concept('tathtali','Татхтали')|E] соединил Центральный и Восточный титулы через брак и, казалось, вырвал веру [Concept('wardenism','варденитов')|E] из пасти гибели. Несмотря на это, анархия [Concept('the_downfall','Падения')|E] всё ещё царит на большей части [Concept('sarradon','Саррадона')|E]. За морем жители Континента наблюдают за этим с растущим интересом..."
 
 bm_group_878_title: "Жестокость"
 bm_group_878: "878"
 bm_group_tooltip_878: "#T $bm_group_878_title$ #!\n$bm_not_released$\n\n#help \"«Дети!? «Пощадите моих детей»!? Они убили моего единственного сына! Теперь мне остаётся очистить лишь гадючье гнездо!»\n~Тамеан, 874 г. от И.С.#!\n\n[Concept('chevalie','Шевалье')|E] пылает в огне анархии после чисток верховного короля Тамеана: 5 соперничающих претендентов объявили себя верховными королями. На юге повторяется то же самое: [Concept('etami_tetenik','Этами Тетеник')|E] бушует в руинах [Concept('boqqarut_damotada','Боккарута')|E]. В это время хаоса многие мечтают о достижениях, которые казались немыслимыми ещё поколение назад. И, возможно, кому-то это удастся."
 
 bm_group_899_title: "Унижение Аверсарии"
 bm_group_899: "899"
 bm_group_tooltip_899: "#T $bm_group_899_title$ #!\n$bm_not_released$\n\n#help \"«Мы не покоримся их империи, как не покорились северянам».\n~Гурард, 897 г. от И.С.#!\n\nАавтократ Мификс унижен Баларенским спором, и стервятники начинают кружить над престолом. [Concept('chevalie','Шевалье')|E] продолжает гореть в [Concept('red_river_war','Войне Красной реки')|E], и растут слухи о новом [Concept('arch_lich','архиличе')|E] беспрецедентной жестокости и силы, готовящемся к удару на юг. Тем временем на юге всё ещё бушует [Concept('war_in_heaven','Война на небесах')|E], пока Дамота продолжает враждовать из-за обломков [Concept('boqqarut_damotada','Боккарута')|E]."
 
 bm_group_939_title: "Наследие Чемпиона"
 bm_group_939: "939"
 bm_group_tooltip_939: "#T $bm_group_939_title$ #!\n$bm_not_released$\n\n#help \"«ТЫ УМРЁШЬ И БУДЕШЬ СЛУЖИТЬ МНЕ!»\n~Силас, 930 г. от И.С.#!\n\nС окончательным уничтожением [Concept('silas_stavro','Силаса Ставро')|E] от руки [Concept('champion_of_chevalie','Чемпиона Шевалье')|E], Шевалье оказалось в пате, где соперничающие претенденты либо мертвы, либо дискредитированы, и все видят необходимость воссоединения перед лицом такого опустошения. [Concept('aversaria','Аверсария')|E] развивает успех в правление Нотикса, и империя с надеждой взирает на новую эру процветания. Однако в [Concept('sarradon','Саррадоне')|E] Амсарский Хиклахн разрывается братской рознью, а [Concept('wardenism','вардениты')|E] начинают великий поход на далёком востоке."
 
 bm_group_999_title: "Принцы-еретики"
 bm_group_999: "999"
 bm_group_tooltip_999: "#T $bm_group_999_title$ #!\n$bm_not_released$\n\n#help \"«Они поймут. Со временем».\n~Тискул, 864 г. от И.С.#!\n\n[Concept('chevalie','Шевалье')|E] разорвано на части, поскольку еретические провозглашения Урсо Бекледьевера ввергли королевство в жестокую религиозную борьбу. Конклав Раокура пообещал искоренить всех еретиков, но даже дворянство, давно тяготившееся духовным контролем, начинает уходить в ересь. Марки стоят на пороге новой эры кровопролития, и этот раскол кажется лишь началом."
 
 bm_group_1094_title: "Гимны восстания"
 bm_group_1094: "1094"
 bm_group_tooltip_1094: "#T $bm_group_1094_title$ #!\n$bm_not_released$\n\n#help \"«Единственная причина, почему я всё ещё стою здесь, заключается в том, что я отказалась умирать без имени и следа в этой Империи. Теперь у меня есть и то, и другое, и судьба, от которой я так долго бежала, уже ждёт».\n~Сансия, 1095 г. от И.С.#!\n\nБезнаказанный произвол одного из детей Аавтократа вылился в открытый бунт. В центре в Опахасии несколько реформаторов начали движение за вечное изменение [Concept('aversaria','Аверсарии')|E] и доказали готовность и способность эффективно использовать насилие ради своих целей. Взоры всего мира устремлены на то, как институты Империи бьются под тяжестью собственных противоречий."
 
 bm_group_1099_title: "Народная революция"
 bm_group_1099: "1099"
 bm_group_tooltip_1099: "#T $bm_group_1099_title$ #!\n$bm_not_released$\n\n#help \"«Итак, поскольку мы — народ единства, давайте начнём новую и просвещённую эру для всех наших сородичей».\n~Бруде, 1099 г. от И.С.#!\n\nКонейкменерская корона сгинула: победивший Народ Единства провозгласил новую Канцелярию на месте старого королевства, заявляя, что говорит от имени простого народа державы. Лишь время покажет, исполнятся ли их обещания."
 
 bm_group_1144_title: "Святые Саррадона"
 bm_group_1144: "1144"
 bm_group_tooltip_1144: "#T $bm_group_1144_title$ #!\n$bm_not_released$\n\n#help \"«Если мы вернёмся, то это будет долго после их смерти, хотя, возможно, нам придётся разбираться с их провалом...»\n~Безымянный, 1095 г. от И.С.#!\n\nПосле примирения с Аагиократией военизированным орденам агионистов было даровано разрешение колонизировать [Concept('sarradon','Саррадон')|E], примкнув к непрерывному потоку [Concept('aversaria','аверсарианцев')|E], хлынувших на южный конент. Хотя [Concept('ritualism','ритуалисты')|E] восточного Саррадона пока стоят твердо, сочетание этого нового вторжения с вечной борьбой против [Concept('wardenism','варденизма')|E] грозит ввергнуть одну из древнейших религий Эраса в катастрофу, невиданную со времен [Concept('the_decimation_of_sarradon','Халакдуна')|E]."
 
 bm_group_1169_title: "Век безумия"
 bm_group_1169: "1169"
 bm_group_tooltip_1169: "#T $bm_group_1169_title$ #!\n$bm_not_released$\n\n#help \"«Не заблуждайтесь, мой аавтократ: никакие драгоценные монументы или пышные церемонии не сдержат червей, подтачивающих фундамент вашей империи».\n~Панкратия, 1152 г. от И.С.#!\n\nТо, что началось как мелкий мятеж в центральной Катраддии в 1161 году, постепенно переросло в водоворот хаоса и разрушений, охвативший всю [Concept('aversaria','Аверсарию')|E], подпитываемый колоссальной [Concept('gedeora','гедеорой')|E], последствия которой только начинают отзываться по всему Расколотому побережью. Где когда-то господствовал закон, теперь качает права только сильнейший, пока номинальный аавтократ Искений прячется в Асиуполе, а авторитет его двора не простирается дальше городских стен. Аверсария стоит на краю бездны, и многие называют себя её последней надеждой — достинет ли кто-то триумфа?"
 
 bm_group_1181_title: "Последняя надежда человечества"
 bm_group_1181: "1181"
 bm_group_tooltip_1181: "#T $bm_group_1181_title$ #!\n$bm_not_released$\n\n#help \"«Анесимасий? Этот мальчик на посылках?»\n~Асерикс, 1181 г. от И.С.#!\n\nПосле 12 лет смуты безызвестный дворянин взошёл на престол [Concept('aversaria','Аверсарии')|E] по итогам первого в память о живущих бесспорного [Concept('blood_senate','кровавого сената')|E]. Уже прозванный крестьянами «Доброкровным», он оставляет один вопрос, повисший над Континентом и миром: сможет ли новый аавтократ сдержать обещания и отвратить катастрофу, неумолимо надвигающуюся на Империю? Или Расколотое побережье (если не весь мир) погрузится в бедствие, невиданное веками?"
 
 bm_group_1186_title: "Навстречу Армагеддону"
 bm_group_1186: "1186"
 bm_group_tooltip_1186: "#T $bm_group_1186_title$ #!\n$bm_not_released$\n\n#help \"«Я боюсь за свою родину, которая так рьяно готовит себя к раздиранию в клочья».\n~Альфиокс, 1186 г. от И.С.#!\n\nЛинии раздела проведены, дипломатия и политика больше не имеют значения: вспыхнет война между Эсшреем и Аксиотеей за престол [Concept('aversaria','Аверсарии')|E]. Пока рокочут барабаны войны, остается лишь гадать, поглотит ли грядущая битва между величайшими [Concept('magi','магами')|E] в истории одну лишь Аверсарию или весь мир вместе с ней."
 
 bm_group_1200_title: "Империя пепла"
 bm_group_1200: "1200"
 bm_group_tooltip_1200: "#T $bm_group_1200_title$ #!\n$bm_coming_soon$\n\n#help \"«Никинея, любовь моя, мне кажется, мы заходим слишком далеко и слишком быстро. Я боюсь, что это заклинание вполне может навредить делу...»\n~Акс, 1199 г. от И.С.#!\n\nМир истекает кровью. Миллионы мертвы — более половины населения [Concept('aversaria','Аверсарии')|E] и несчётные массы от Адабисса до Катун-Кая. [Concept('selfreplicating_blood_magic','Самовоспроизводящаяся магия крови')|E] собрала свою дань, а боль и ужас тысячелетий безудержных войн и разрушений наконец вознаграждены [Concept('frodbrokna','Фродброкной')|E] и открытием Разлома. Пока Туман изрыгается и поглощает известный мир, племена внутренних земель устремляются к Побережью ради спасения, а потрёпанные остатки аверсарианских легионов соревнуются за огрызки своего мёртвого государства."
 
 bm_group_1217_title: "Лига Черного золота"
 bm_group_1217: "1217"
 bm_group_tooltip_1217: "#T $bm_group_1217_title$ #!\n$bm_coming_soon$\n\n#help \"«Клянусь Путями, я скучаю по той войне. Какая была война! Когда я вёл армию, а не двор интригующих детей и фальшивых рыцарей!»\n~Гардфрей, 1238 г. от И.С.#!\n\nПока [Concept('aversaria','аверсарианцы')|E] поедают остатки своей империи заживо, [Concept('chevalie','Шевалье')|E] погружается в гражданскую войну после таинственной смерти верховного короля Дендона. Принц Гардфрей заявили права на престол отца, но ему противостоит альянс двух богатейших дворянских семей Шевалье. Валадеки и Монто выдвигают прославленного рыцаря и друга детства Гардфрея — Терина «Чёрный Коготь» Валадека — в качестве нового монарха, и кажется, лишь кровопролитие решит судьбу Шевалье."
 
 bm_group_1228_title: "Эхо империи"
 bm_group_1228: "1228"
 bm_group_tooltip_1228: "#T $bm_group_1228_title$ #!\n$bm_coming_soon$\n\n#help \"«Прошло тридцать лет, а Владыка Пепла всё так же отчаянно цепляется за свой престол, с каждым шагом разрывая империю на части. Довольно».\n~Исакея, 1229 г. от И.С.#!\n\n[Concept('aversaria','Аверсария')|E] стонет под тяжестью трупов, пока аавтократ Эшрей продолжает править Пепельной Аавтократией железным кулаком. С каждым днём всё большая часть империи ускользает из его рук, и остаётся лишь один вопрос: переживёт ли он саму Аверсарию."
 
 bm_group_1254_title: "Сломленный мир"
 bm_group_1254: "1254"
 bm_group_tooltip_1254: "#T $bm_group_1254_title$ #!\n\n#help \"«Говорят, империя пылает? Что [Concept('aversaria','Аверсария')|E] погибла? Что на престоле не сидит аавтократ!? Пока я правлю из Ораисполя, Аверсария жива! Я и есть Аверсария, а все, кто сомневается — пусть сгорят! Неужто они думают, что я явлю им меньше боли, чем тем, кого я некогда любил, но кто встал против меня!?»\n~Эшрей, 1228 г. от И.С.#!\n\nАверсария испускает последние вздохи, пока Сьялволькский Имперрех марширует к морю. Битва у Элизийского перевала завершилась уничтожением последней организованной коалиции против Ценвара, и теперь всё, что отделяет варваров от мирового господства — это поход к его сердцу."
 
 bm_group_1298_title: "Новый мир"
 bm_group_1298: "1298"
 bm_group_tooltip_1298: "#T $bm_group_1298_title$ #!\n\n#help \"«Мои глаза увидели достаточно войн, чтобы перед тем как смежить их в последний раз, я не мог молить ни о чём, кроме мира. Но память предаёт меня, и я задаюсь вопросом: не есть ли смерть лишь сон? Буду ли я вынужден вечно созерцать лишь смерть и завоевания...»\n~Ценвар, 1272 г. от И.С.#!\n\nНовый рассвет встаёт над Расколотым побережьем. [Concept('aversaria','Аверсарии')|E] больше нет — её сменили царства завоевателей. Но мир не продлится долго, ибо со смертью «Сокрушителя Ведьм» мелкие правители того, что прежде было Имперрехом, уже готовятся к новой эре войн."

 bm_not_released: "#X Закладка в настоящее время недоступна. #!"
 bm_coming_soon: "#P Закладка появится совсем скоро! #!"