l_russian:

 # Narses
 challenge_character_narses: "Аавтократ Нарсес"
 challenge_character_narses_desc: "Нарсес мог лишь беспомощно наблюдать, как северные орды нанесли Аверсарии смертельный удар у Элизийского перевала. Теперь он и его легионы разбиты, окровавлены и отчаянно ищут спасения, а многие уже готовы покориться варварам.\n\n#bold Вопреки прошлым неудачам, Нарсес полон решимости сражаться до самого конца. Сможете ли вы переломить ход судьбы в победоносном последнем бою? Или сокрушённую Империю уже не спасти?#!"

 # Sami Diqaynid
 challenge_character_diqaynid: "Эахим Сами"
 challenge_character_diqaynid_desc: "Происходя из рода родственников знаменитого агионистского святого Дикайна, Дикайниды снискали славу умелых правоведов и управляющих. Однако династия ослабла после череды бедствий, что вылилось в её угасание во время Очищения Эль-Кулаты.\n\n#bold Сможете ли вы, последний отпрыск Дикайнидов, опередить историю и залатать трещины, уже появившиеся в Мамурамате, или предпочтёте оседлать грядущую волну хаоса?#!"

 # Ulradj Shape-Changer
 challenge_character_ulradj: "Вольник Ульрад"
 challenge_character_ulradj_desc: "Ульрад и сам подобен химере: пират, сьялволькский берсерк и маг, бросивший вызов тайным глубинам Майикратии во время знаменитого набега «Сокрушителя Ведьм». Ныне обречённый на жизнь, полную приключений, этот эксцентричный «Оборотень» пишет свою легенду огненными письменами по всему Айроною.\n\n#bold Выжжете ли вы наследие Ульрада на лике Эраса заклинанием, клыком, когтем или топором?#!"

 # Melissa Varsaxoan
 challenge_character_melissa: "Магнатка Мелисса"
 challenge_character_melissa_desc: "Бедам дома Варсаксоан нет конца. Едва избежав жестокой расправы, учинённой над её домом Картином Деленелем, Мелисса бежала в Малькою. Теперь, после смерти «Кователя цепей», Мелисса вернула свой родной дом.\n\n#bold Однако в живых остался лишь один член дома Варсаксоан. Сможете ли вы сохранить свой древний род? Взовьются ли знамёна Варсаксоанов вновь над всем Калатипсоми?#!"

 # Bhagwant Scar-Bound
 challenge_character_bhagwant: "Бхагвант «Связанный Шрамами»"
 challenge_character_bhagwant_desc: "Истинные узы куются не кровью, а общими испытаниями. Бывший каратель, ставший защитником угнетённых, Бхагвант «Связанный Шрамами» марширует, чтобы освободить танумарейцев от тирании мальчика-короля Кашти.\n\n#bold Каким вас запомнит история? Спасителем или глупцом?#!"

 # Shaiban the Greenwender
 challenge_character_shaiban: "Эахим Шайбан"
 challenge_character_shaiban_desc: "Один из немногих оставшихся Зеленоходцев Саррадона, Шайбан высмеивается собратьями как обычный деревенский маг, играющий с огнём. Однако в пламени и лесах таится мудрость, и духи ублажают его видениями того, что было, есть и будет.\n\n#bold Голоса Зокаха поведали вам об ужасной катастрофе, которая вскоре обрушится на Эль-Кулату. Внемлите ли вы их предупреждению и попытаетесь ли предотвратить её, невзирая на насмешки?#!"

 # Achake
 challenge_character_achake: "Урваза Ачаке"
 challenge_character_achake_desc: "Сарминианское войско разбито и расколото безвременной кончиной своей предводительницы. Пользуясь малым уважением и верностью со стороны непокорных кланов, Ачаке удерживает последние остатки единства среди гордых королев степи, готовящихся оставить её знамя ради собственной славы.\n\n#bold Сможете ли вы выковать общую судьбу для племён на Расколотом побережье, или салазсеки больше никогда не выйдут в поход?#!"

 # Burning Star Amittiravalli
 challenge_character_burning_star: "Амиттиравалли «Палящая Звезда»"
 challenge_character_burning_star_desc: "Победительница Войны Пяти Капитанов, Амиттиравалли была провозглашён пиратской королевой. Но богатство тускнеет, слава увядает. За последние три десятилетия Веллатола застряла в застое. Теперь, когда над пиратским королевством заходит солнце, «Палящая Звезда» снова чувствует прежний зуд — выйти в море.\n\n#bold Поднимете ли вы чёрный флаг над всем Ночным побережьем? Или крабы обглодают плоть с вашего черепа?#!"

 # Nahanaranamati
 challenge_character_nahana: "Хатпатни Наханаранамати"
 challenge_character_nahana_desc: "Оставшись сиротой после Восстания «Безумного Клинка», Наханаранамати занимает шаткое положение королевы Шейтары. Хотя её муж Найварман остаётся непоколебимо верен, вероломные вассалы преследуют каждый их шаг.\n\n#bold Если вы хотите выжить, гадюкам, таящимся внутри, нужно вырвать клыки. Сможете ли вы воплотить общую мечту о более милосердной Шейтаре?#!"

 # Athanasia
 challenge_character_athanasia: "Магнатка Афанасия"
 challenge_character_athanasia_desc: "Могущественная налётчица и маг, Афанасия создала Конклав Очищенных после того, как устроила кровавый переворот и стала Голосом Чистейшего. И хотя вскоре она сгинула в море, Конклав выжил и стал великой угрозой на Расколотых островах на протяжении большей части конца XIII века.\n\n#bold Сможете ли вы сделать первые шаги Великого Плана и дожить до его завершения?#!"

 # Esterax the Glorious
 challenge_character_esterax: "Эстеракс «Славный»"
 challenge_character_esterax_desc: "Мессия, истинный наследник Чистейшего, тайное дитя аавтократа Аксиотеи и аавтократа Эсхреса: Эстеракс Вариксигад заявляет, что он воплощает всё это и даже больше. Маг сомнительного происхождения, Эстеракс намеревается выковать из разбитых осколков Аверсарии империю по своему божественному образу.\n\n#bold Сможет ли этот претендент на божественность занять свой священный престол, или орды варваров и соперники отправят ещё одного лжеимператора на свалку истории?#!"

 # Ertoharant
 challenge_character_ertoharant: "Верховный вождь Эртохарант"
 challenge_character_ertoharant_desc: "Эртохарант живёт в тени своего мифического предка. Последний из эртомаксистов, верховный вождь — лишь бледная тень Эртомакса, владеющая убогим клочком земли. Так угас род Царя-Солнца-Луны — не сокрушительным рёвом, а жалким хныканьем.\n\n#bold Но что, если Эртохарант не последний? Сможете ли вы или ваши дети поднять факел, столь опрометчиво брошенный? Взойдёт ли Царь-Солнца-Луны над смертным миром вновь?#!"

 # Iros
 challenge_character_iros: "Архилеталагос Ирос"
 challenge_character_iros_desc: "Эшрей мёртв. Риккаратские мятежники сгинули. А империя? Расколота на тысячу мелких феодов, одним из которых правит Ирос. На материке варвары победили. Какому мёртвому императору хранит верность леталагос Ирос?\n\n#bold Пойдёте ли вы маршем, чтобы восстановить Аверсарию? Или маршем ради солдат VII Легиона?#!"

 # Teryn 'Blackclaw'
 challenge_character_teryn: "Терин «Чёрный Коготь»"
 challenge_character_teryn_desc: "Когда-то претендент от Лиги Черного Золота, Терин Валадек предпочёл остаться верным своему другу, верховному королю Гардфрею. И хотя он всё ещё могущественный лорд, исчезновение верховного короля и вторжения с востока практически уничтожили стабильность королевства, за сохранение которого он так яростно сражался.\n\n#bold Былая слава осталась лишь воспоминанием. Теперь выбор за вами: восстановить Шевалье или позволить ему расколоться, как это бывало несчётное количество раз прежде.#!"

 # Hycancylin
 challenge_character_hycancylin: "Канцлер Хикансилин"
 challenge_character_hycancylin_desc: "Западная королевская торговая компания десятилетиями увядала в далёком Амсаре, казалось бы, без всякой отдачи. Они пошли на огромный риск, купив плацдарм в Саррадоне, но пока увидели лишь малую отдачу от своих инвестиций.\n\n#bold Но конец эпохи мира Пейджмана уже близко, и Хикансилин чует запах прибыли в воздухе. Окупится ли наконец рискованная ставка Компании? Или вы потерпите крах и позволите возможности уйти?#!"

 # Runalem
 challenge_character_runalem: "Талкар Руналем"
 challenge_character_runalem_desc: "Века назад династия Беларов правила всей Дамотой; всего несколько лет назад — всем Дихалетом. Руналем не может претендовать даже на второе. Унаследовав королевство в руинах, он со страхом взирает на стервятников, кружащих над его владениями в ожидании конца династии, которая древнее самого Боккарута.\n\n#bold Сможете ли вы собрать воедино землю своих отцов? Или ваше правление станет трагическим финалом их некогда славной истории?#!"

 # Ukisu
 challenge_character_ukisu: "Эахим Укису"
 challenge_character_ukisu_desc: "Вслед за вторжением Хартаха в Саррадон большая часть манатского мира обратилась в варденизм, вдохновлённая его видением. Укису кин Несаму оказался последним поистине благочестивым правителем-манатом, удерживающим лишь несколько островов. Имея последнюю крупную манатскую библиотеку в своих владениях, последние Номера Дикириб бежали ко двору Укису.\n\n#bold Сможете ли вы спасти свою веру с грани вымирания, или над Ильдурилулхимом взойдёт новая эра варденизма?#!"

 # Dirabti
 challenge_character_dirabti: "Магнатка Дирабти"
 challenge_character_dirabti_desc: "Воительницы э’хатмов сгинули под волнами моря крови в Войне Всех Островов, но их наследие выстояло. Магнатка Дирабти командует флотом, поклявшимся отвоевать свой дом у ненавистных аверсарианцев. Надежды народа э’хатмов плывут вместе с ней, как и благословение Сестры-Матери.\n\n#bold Сможет ли Дирабти подарить надежду своему народу на острие меча? Вернутся ли э’хатмы наконец домой?#!"

 # Megistos
 challenge_character_megistos: "Мегист «Самый Справедливый и Прекрасный Правитель»"
 challenge_character_megistos_desc: "Мегист, одним словом, совершенен. Никто не превосходит его в престиже, никто не сравнится в красоте, никто не чист так, как он, и никто, говорят, не безумен так, как он... Мир — поистине сад наслаждений Мегиста, и Мегист обратил свой взор на самый сочный плод из всех: Аверсарию.\n\n#bold Узрят ли люди в Мегисте сияющего царя, коим Мегист и является? Мегист — это люди, ибо Мегист — не просто человек, а следовательно, Мегист — Бог.#!"

 # Iorgos
 challenge_character_iorgos: "Архилеталагос Иорг"
 challenge_character_iorgos_desc: "Нет ничего ужаснее преданной любви. В хаосе Фродброкны XCV Легион «Виэсуадос» раскололся надвое. Макис, возлюбленный Иорга, ведомый жадностью, убил легона и захватил контроль над половиной легиона. Иорг отказался следовать за своим другом и возлюбленным на путь предательства, и теперь они сошлись в смертельной схватке.\n\n#bold Чьей кровью окрасятся воды?#!"

 # Arite
 challenge_character_arite: "Тасурза Арите"
 challenge_character_arite_desc: "В чём вообще был смысл всего этого? Арите всю жизнь совершала набеги, воевала и скакала плечом к плечу со своей королевой и возлюбленной Резпендией. Но теперь Резпендия мертва, и Арите чувствует себя не лучше. Имея на руках лишь память о последнем десятилетии своей жизни, она одинока, потеряна и отвергнута соратниками.\n\n#bold Может ли наступить новый рассвет, когда само солнце погасло? Сможете ли вы выковать наследие, достойное того, что было утеряно?#!"

 # Aarif
 challenge_character_aarif: "Малайк Ариф"
 challenge_character_aarif_desc: "Главный министр при Адабине. Когда недолговечные преемники старого Мамура один за другим оказались куда менее способными, Ариф с помощью военачальника Обарека решит захватить контроль над самим Мамураматом. Но его жизненный путь прервётся, когда амбиции Обарека окажутся куда выше его верности Арифу.\n\n#bold Когда шаткий престол манит, возьмёте ли вы контроль в свои руки ради варденитского мира или попытаетесь преданно защитить статус-кво?#!"

 # Krasalja 'Kraken-Eater'
 challenge_character_krasalja: "Красалья «Пожирательница Кракенов»"
 challenge_character_krasalja_desc: "О, восток, вечный восток. С самого детства Красалья мечтала о Великом Катуне — таинственном царстве далеко за пределами земель, где ступала нога сьялволков. Со своим отрядом авантюристов Пожирательница Кракенов куёт собственную судьбу.\n\n#bold Найдёте ли вы Великий Катун и станете ли одними из величайших исследователей в истории?#!"

 # Krenverso 'of the Metal Mask'
 challenge_character_krenverso: "Кренверсо «Железная Маска»"
 challenge_character_krenverso_desc: "Некогда грозный лидер чарчаков, Кренверсо потерял всё в Ночь Огненных Колесниц. Оставшись в одиночестве и обезображенный, окружённый лишь напуганными льстецами, маг в маске увядает на нескольких оставшихся у него землях.\n\n#bold Но пока Кренверсо дышит, Свантийское восстание продолжается. Сможете ли вы отвоевать Огненные Врата для своего народа и изгнать амагейцев из вашего дома?#!"

 # Garniex
 challenge_character_garniex: "Граф Гарнье"
 challenge_character_garniex_desc: "Не дай ни одному кризису пройти даром. Узрев падение Аверсарии от топора варваров, граф Гарнье принёс клятву верности Ценвару и предал своих аверсарианских господ. Ныне граф Вокриниса, циничный Гарнье жаждет корону.\n\n#bold Запомнят ли вас как предателя или как завоевателя?#!"

 # Basiriox
 challenge_character_basiriox: "Архексир Басириокс"
 challenge_character_basiriox_desc: "Со времён назначения его деда архексиром семья Басириокса цеплялась за свой титул сквозь бури гражданской войны, восстаний рабов и анархии, терзавшие Крехеджад. Ныне, окружённый мятежными легионами, древними претендентами и паникующими аристократами, Басириокс задаётся простым вопросом:\n\n#bold Сможет ли он спасти имперскую цивилизацию в её южном оплоте? Или его ждёт ещё один обречённый последний бой перед тем, как его владения — и Аверсария — канут в историю?#!"

 # Narathu 'Serpent's Wrath'
 challenge_character_narathu: "Наратху «Гнев Змея»"
 challenge_character_narathu_desc: "После убийства отца и казни матери Наратху провёл большую часть жизни в бегах. Лоялисты защищали каждый его шаг, и одного за другим их убивала та же рука, что уничтожила его семью. Давно научившись спасать себя сам, Наратху теперь одинок, а гадюки сжимают кольцо.\n\n#bold Сможет ли потерянный принц вернуть своё наследие, или в конце концов сгинет от клыков своего охотника?#!"

 # Dethas 'the Last Legionnaire'
 challenge_character_dethas: "Архилеган Детас «Последний Легионер»"
 challenge_character_dethas_desc: "Детас — повелительница и мать Зимнего Легиона, разношёрстных остатков катраддийских армий и несметных беженцев. Одинокая на холоде, Детас ищет место, где её народ сможет умереть.\n\n#bold Фатализм вам не к лицу, Леган! Поддадитесь ли вы холоду? Или заново зажжёте пламя надежды?#!"

 # Zenobios
 challenge_character_zenobios: "Легон Зенобий"
 challenge_character_zenobios_desc: "Слава 21-го давно потускнела и ржавеет. Исакея умерла давным-давно, но её легион продолжал жить... если это можно назвать жизнью. Легон Зенобий стоит в одиночестве против орд Малькои, но ради чего он сражается?\n\n#bold Вытащите ли вы своих солдат из тупика? Поднимется ли собственный легион Аавтократа на вызов, или сгинет, как и Империя, которой он служил?#!"

 # Rosier den va Sissaux
 challenge_character_rosier_sissaux: "Граф Розье"
 challenge_character_rosier_sissaux_desc: "Вернувшись после целой жизни службы в антимагических орденах, Розье обнаружил свою семью убитой, а дом — захваченным бывшими союзниками.\n\n#bold Когда запад полностью погружён в битву за престолонаследие, вам предстоит вернуть Рорх и изгнать зелёных демонов в пустоши, где им самое место.#!"

 # Praxion Kreyshati
 challenge_character_praxion: "Деспексир Праксион"
 challenge_character_praxion_desc: "Назначенные на свой высокий пост самой аавтократом Аксиотеей, Крейшати — одни из последних дворян Восточного Айроноя, верные её памяти. Однако дом оказался на грани гибели к 1260-м годам из-за убийства молодого лорда, Праксиона Крейшати, его дядей Вилосом — который затем сам был убит мародёрствующими пиратами Эрамасия «Среброкровного».\n\n#bold Оказавшись в опасном положении с врагами внутри и снаружи, выживете ли вы, чтобы изменить судьбу рода Крейшати?#!"

 # Yagkan
 challenge_character_yagkan: "Наклан Ягкан"
 challenge_character_yagkan_desc: "Бастард банвагульского военачальника Налайкана, Ягкан рано остался сиротой после гибели отца в Ратаракаве и убийства матери руками предателей.\n\n#bold Оставшись с обрывками банвагульской мечты о единстве и славе, сможете ли вы справиться с задачей и повесть за собой свой народ?#!"

 # Drovor Sereyov
 challenge_character_drovor: "Мелждин Дрово́р"
 challenge_character_drovor_desc: "Единственный сын грозного военачальника Дувакена «Серебряного Голоса», Дрово́р оказался заброшен на остров Аркима после того, как его отец был жестоко убит Горассом «Собирателем Черепов».\n\n#bold Столкнувшись с угрозами со всех сторон, найдёте ли вы способ выжить среди враждебных военачальников Опахасии или кротко будете ждать спасения с запада?#!"

 # Vakhtan 'the Bloody'
 challenge_character_vakhtan: "Вахтан «Кровавый»"
 challenge_character_vakhtan_desc: "Вахтан с лихвой заслужил своё кровавое прозвище. Жестокий военачальник, в чьих жилах течёт кровь тысячи королей, «Кровавый» не остановится ни перед чем, чтобы восстановить королевство своих предков. Маг-вампир, Вахтан имеет века, чтобы переждать своих врагов. Вскоре каждый, кто посмеет воспротивиться ему, украсит собой кол...\n\n#bold Все, кто противостоит вам, склонятся перед вашей волей или будут сломлены! Кровь Амагеи принадлежит только вам! Смерть претендентам!#!"

 # Wishiwashi
 challenge_character_wishiwashi: "Король Вишиваши"
 challenge_character_wishiwashi_desc: "Выбор был прост: присоединиться к Ценвару в его марше на юг или сгинуть в Тумане. Старейшины сделали свой выбор, но Вишиваши прекрасно видит, как другие племена смотрят на людоедство кардвенов, и знает, что разумнее никогда не убирать руку далеко от топора...\n\n#bold Поведёте ли вы своё племя в новую эру процветания? Или зима поглотит вас целиком?#!"

 # Bhramkarod 'Scourge of Death'
 challenge_character_bhramkarod: "Бхрамкарод «Бич Смерти»"
 challenge_character_bhramkarod_desc: "Печально известный «Бич Смерти», Бхрамкарод был ответственен за уничтожение культов смерти, терзавших центральную Каширию — кульминацией грандиозного заговора, посеянного самими этими культами.\n\n#bold Измученный, параноидальный и осаждённый со всех сторон демонами как реальными, так и воображаемыми, исполните ли вы главную цель жизни — искоренить «смерть» из Адлурбада? Или вместо этого раньше времени встретите своего создателя?#!"

 # Habwi
 challenge_character_habwi: "Верховный вождь Хабви"
 challenge_character_habwi_desc: "Отвергаемый большую часть жизни из-за необычного обличья, Хабви объединит племена кедаров и установит Обряд Знамений, став его первым верховным шаманом.\n\n#bold Наделенный великой магией и ещё большим интеллектом, сможете ли вы следовать ходу истории и принести золотой век кедарам?#!"

 # Pad'eyil
 challenge_character_padeyil: "Таджанат Пад'эил"
 challenge_character_padeyil_desc: "Шайнису Хубарин когда-то правил Саррадоном, пока маги-судьи исполняли волю Шамсаха. Пад'эил помнит об этом, и с его повелеванием живой магией, святое солнце всё ещё может воссиять над Саррадоном вновь.\n\n#bold Завершится ли затмение хубаризма? Или победа Олюма окажется окончательной?#!"

 # Tangatha
 challenge_character_tangatha: "Сахукар Тангата"
 challenge_character_tangatha_desc: "Атрак-Адмак привёл Тангату в это место. Присоединившись к Сокрушителю Ведьм в его походе, Тангата и верующие гетианцы стремятся очистить себя от древних грехов в битве против Красных Магов.\n\n#bold Преследуемый прошлым, сможете ли вы искупить будущее своего народа?#!"

 # Parnaz Vashvili
 challenge_character_parnaz: "Азнаули Парназ"
 challenge_character_parnaz_desc: "Когда-то паршивая овца в династии Вашвили, судьба Парназа круто изменилась после безрассудного путешествия в Туманные земли. Вернувшись с властвованием над неведомой магией, он вступает неожиданным игроком в запутанную игру интриг за пустующий престол Амагеи.\n\n#bold Но голоса преследуют каждый ваш выбор и шаг. Сможете ли вы укротить их и занять престол своего отца? Или поддадитесь шёпоту и принесёте безумие своему народу?#!"

 # Myliros
 challenge_character_myliros: "Губернатор Милир"
 challenge_character_myliros_desc: "Исполинский пожар, разожённый Эшреем, тлеет и гаснет. Губернатор Милир, некогда рьяный приспешник человека, возомнившего себя аавтократом, стоит в одиночестве. Город Атерисполь, бывший резиденцией его власти, лежит за пределами его хватки. Милир сжимает знамя прежнего господина обожжёнными, дрожащими руками.\n\n#bold Но даже пламя свечи способно зажечь весь мир. Сможете ли вы отвоевать свой павший город и вернуть Аверсарии величие?#!"

 # Belisarios Frostblood
 challenge_character_belisarios: "Велизарий «Морозная Кровь»"
 challenge_character_belisarios_desc: "Последний из прославленной династии Дракакиадов, Велизарий «Морозная Кровь» ребёнком спасся от расправы над своей семьёй и нашёл путь в самые отдалённые уголки Айроноя.\n\n#bold Ныне вы стоите на перепутье: столкнётесь ли вы со своим прошлым, отомстив убийцам родителей, или выкуете новую жизнь и будущее на процветающем, но уязвимом востоке?#!"

 # Akakih 'the White Lion'
 challenge_character_akakih: "Акаких «Белый Лев»"
 challenge_character_akakih_desc: "Амагея пылает, рабы бесчинствуют на полях, которые они некогда возделывали по воле законных хозяев. Хватит! Азнаули Акаких обнажил меч в отрицании Восстания чарчаков — лев, пробудился от сна.\n\n#bold Вернёте ли вы рабов обратно на поля? Прогремит ли рык Белого Льва над пиками и долинами Амагеи?#!"

 # Roulir Pithicladd
 challenge_character_roulir: "Архар Роулир"
 challenge_character_roulir_desc: "Более всего известный как отец Магорна «Великого», который будет править большей частью Чёрных гор на рубеже XIII века, Роулир Питикладд — последний свободный сарридианский вождь в 1254 году после смерти его отца, Элдрадда «Звезды Погибели», от рук убийц. Ему удастся уйти от преследователей и найти убежище среди Калагони с остатками соплеменников.\n\n#bold Надрываясь под игом очередного чужеземного правителя, сможете ли вы поднять сарридианский народ на поколение раньше?#!"

 # Fridge
 challenge_character_fridge: "Котексир Криг «Застывший»"
 challenge_character_fridge_desc: "Насмешливо прозванный «Застывшим», Криг — человек, застывший во времени, защищающий павшую империю на службе пустому престолу. Даже когда Аверсария рушится вокруг него, в его иллюзиях Империя сильна как никогда прежде.\n\n#bold Но убеждённость, рождённая безумием, остаётся убеждённостью. Сможете ли вы претворить его мечту о новом золотом веке в реальность?#!"

 # Emarios 'Sea-Sword'
 challenge_character_emarios: "Эмарий «Морской Меч»"
 challenge_character_emarios_desc: "Почти три десятилетия назад Эмарий «Морской Меч» высадился в Крехеджаде, обещая возрождённую Аверсарию и новую эру великолепия. И хотя эта мечта сгинула в Битве при Стеллиосе, Эмарий пережил все эти годы смуты.\n\n#bold Хоть вы и лишились юношеских иллюзий, вы сражались слишком долго, чтобы умереть в безызвестности.#!"

 # Zahjang Azahkyen
 challenge_character_zahjang: "Захджанг Азахкьен"
 challenge_character_zahjang_desc: "Окутанные тайной, азарг-кутахнууги издавна служили источником кошмаров на севере. Но с приходом Тумана этот кошмар стал слишком реален: омытые кровью мастера клинка прорубают путь на юг вместе с переселяющимися беженцами.\n\n#bold Будучи свежеобученным выжившим из «Милосердий Дьявольского Языка», Захджанг ещё не достиг высот фехтования, которыми славился его народ, но сможете ли вы поддержать мрачную репутацию самых грозных воинов Эраса?#!"

 # Yaza Zin
 challenge_character_yaza_zin: "Яза Зин Мингала"
 challenge_character_yaza_zin_desc: "Благочестивый верховный жрец сепаттанов, Яза Зин стоит в одиночестве среди хаоса. Его отец был убит Кьяу Зау, еретиком, стремящимся сжечь всё вокруг; его брату помешали помочь строгие обеты пацифизма; а могущественный клан Зеятура занят междоусобицей с Чёрным Вихрем.\n\n#bold Пойдёт ли Яза Зин по стопам отца и исполнит ли долг верховного жреца, или поклянётся отомстить и истребит всё, что угрожает святости Сада Тарфала?#!"

 # Toghoril Otroka
 challenge_character_toghoril: "Тогорил Отрока"
 challenge_character_toghoril_desc: "Когда-то наводивший ужас как гроза степей, клан Отрока с тех пор переживает нелучшие времена после неудавшегося вторжения Джаджака Отроки в восточный Айроной. Отец Тогорила вернул часть былой славы, но до полного восстановления чести ещё далеко.\n\n#bold Воздадите ли вы должное имени своего клана и зажжёте ли новую эру для ольтенов?#!"

 # Ascelina Fidecht
 challenge_character_ascelina: "Асцелина Фидехт"
 challenge_character_ascelina_desc: "Презираемые с давних пор как нижайшие из марочников, риварспадцы часто жестоко подавлялись соседями. Будучи малоизвестной сама по себе, Асцелина вымостит путь к возрождению своего народа, став одной из первых, кто поддержал Чёрного Рыцаря.\n\n#bold Завоюете ли вы место под солнцем для риварспадцев подле другого? Или проложите свой собственный путь?#!"

 # Asahsepsin the Accursed
 challenge_character_zahjang_desc: "Окутанные тайной, азарг-кутахнууги издавна служили источником кошмаров на севере. Но с приходом Тумана этот кошмар стал слишком реален: омытые кровью мастера клинка прорубают путь на юг вместе с переселяющимися беженцами.\n\n#bold Будучи свежеобученным выжившим из «Милосердий Дьявольского Языка», Захджанг ещё не достиг высот фехтования, которыми славился его народ, но сможете ли вы поддержать мрачную репутацию самых грозных воинов Эраса?#!"
 challenge_character_asahsepsin: "Асахсепсин «Проклятый»"
 challenge_character_asahsepsin_desc: "Происходя из длинного рода королей, Асахсепсин когда-то считался надеждой своего народа. Однако катастрофа у Пяти Врат привела к позору и изгнанию, и многие из тех, кого он некогда звал друзьями, теперь считают его ниже нижайшего навозного жука.\n\n#bold Вернёте ли вы своё достоинство и возродите ли золотой век кемсарцев? Или ваша гордость будет растоптана жестокими песками?#!"

 # The Last Talareg
 challenge_character_boelufwu: "Боелуфву Вегмау"
 challenge_character_boelufwu_desc: "Когда Туман пришёл вслед за Фродброкной, талареги по непонятной причине оказались невероятно восприимчивы к его шёпоту, и весь народ был полностью поглощён — за исключением одного. Боелуфву внял предупреждениям и бежал на юг, снискав славу одного из величайших чемпионов Имперреха.\n\n#bold Выживете ли вы, Последний Таларег, в этой далёкой земле и восстановите ли то, что было утеряно?#!"

 # Casimir IV l'Ostaly
 challenge_character_casimir: "Казимир IV Острый"
 challenge_character_casimir_desc: "Память о старой Ойейнице почти угасла. Казимир — последний в ряду великих герцогов, носящих пышные титулы, но управляющих по сути лишь кучкой лачуг, брошенных в северных пустошах.\n\n#bold Расцветёт ли Зьемойич под вашим правлением? Или останется бледной тенью того, чем был прежде?#!"

 # Zehur (1298)
 challenge_character_zehur: "Зехур, Первейшая Десница Веры"
 challenge_character_zehur_desc: "Хартах мёртв, Эль-Кулата лежит в руинах, а Саррадон разорван военачальниками, твердящими о благочестии, пока они пируют на трупе Мамурамата. Лишь Зехур всё ещё пылает прежним огнём. Для своих последователей он — Первейшая Десница Веры; для всех остальных — безумец с одним графством, вопящий против прибоя.\n\n#bold У военачальников есть армии, золото и численность. У вас есть убеждённость. Преклонит ли Саррадон колена перед верой вновь, или ваше тело станет ещё одним трупом на костре фанатиков?#!"

 # Tusnute of Oakendale (1298)
 challenge_character_tusnute: "Туснуте из Долины Дубов"
 challenge_character_tusnute_desc: "Туснуте когда-то маршировал с Сокрушителем Ведьм — целых три года. А затем развернулся. Пока каждый клан севера бежал на юг в безопасность, он повёл свой народ домой в Долину Дубов, и четыре десятилетия упрямый старый герцог удерживает свой очаг от ползущего Тумана, не подчиняясь ни королю, ни коалиции, ни здравому смыслу.\n\n#bold Каждая разумная душа бежала ещё поколение назад, а Туман никогда не был так голоден. Докажете ли вы правоту рока и выстоите ли там, где стойкость — безумие, или последний свет Долины Дубов наконец угаснет?#!"

 # Jozdar of the Blood Reavers (1298)
 challenge_character_jozdar: "Йоздар «Красноустный»"
 challenge_character_jozdar_desc: "Войны Обрядов стравили брата с братом из-за истинного смысла Велоса — и пока обряды спорят, Кровавые налетчики пируют. Йоздар возглавляет последний великий празнарванский военный отряд, презираемых людоедов, которых не признает ни один обряд и не укроет ни один лорд.\n\n#bold Каждая рука в Калатипсоми поднята против вас — и именно так вам и нравится. Вырежут ли Кровавые налетчики себе место за столом силой, или закончат как назидательная притча у чужих костров?#!"

 # Velizarn (1298)
 challenge_character_velizarn: "Велизарн, Хранитель Велостадда"
 challenge_character_velizarn_desc: "Ориспольский обряд трещит по швам, и Велизарн провёл всё своё жречество, готовясь к моменту, когда он порвётся окончательно. Как Хранитель Велостадда, он повелевает самым священным местом веры сьялволков — и обладает амбициями забрать то, что последует за этим.\n\n#bold Переворот Велоса близко. Провозгласят ли вас Избранником Велоса, возведёте ли вы Великий Велостадд и подчините ли верующих своему совету — или Священное Королевство Велоса коронует вашего соперника первым?#!"

 # Perrit of the Red Mysteries (1298)
 challenge_character_perrit: "Перрит «Красная Рука»"
 challenge_character_perrit_desc: "Перрит был непримечательным марочником, пока не ушёл в Красные земли и не вернулся... иным. Теперь он возглавляет Культ Красных Тайн — странствующую общину, чей обряд ни один чужак не видел дважды, проповедуя истины, от которых людям не предначертано процветать.\n\n#bold Это абсолютно, определенно не культ. Распространите ли вы Красные Тайны по всем Маркам и откроете ли силу за ними, или тайна поглотит собственного пророка?#!"

 # Tukkoji (1298)
 challenge_character_tukkoji: "Туккоджи, Чемпион Дамаратджаррата"
 challenge_character_tukkoji_desc: "Чемпионы Дамаратджаррата маршируют уже тридцать шесть лет, и Туккоджи командовал ими большую часть этого времени — пережив каждого нанимателя, каждую роту-соперника и каждую войну, для победы в которой его нанимали. Рота — это его семья, его королевство и единственное дело всей его жизни.\n\n#bold Вам шестьдесят лет, а у Чемпионов никогда не было дома. Прольёте ли вы наконец кровь своей роты ради собственной земли, или умрёте в походе так же, как и жили?#!"

 # Anvilic (1298)
 challenge_character_anvilic: "Канцлер Анвилик"
 challenge_character_anvilic_desc: "Прошло лишь несколько лет с окончания последней Гисреддской войны, и восстановление только началось. Юные авантюристы, стремящиеся нажить состояние, всё ещё бегут из порта Гисредде на запад или восток, в зависимости от того, какие корабли пришвартовались.\n\n#bold Ваш город всё ещё оправляеться от войны, а его дети жаждут куда большего, чем он может дать. Укрепит ли Пети-Гисредде своё место как величайший город в мире, или будет проглочен аристократическими интригами?#!"

