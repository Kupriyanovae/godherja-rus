 bm_1200_the_empire_of_ash: "#debug Империя пепла#!"
 bm_1200_the_empire_of_ash_desc: "#debug От Аверсарии не осталось ничего, кроме пепла её чудес и костей её детей. Раса чистых, подлинный образец человечества, сияющий светоч благодати Чистейшего среди моря нечеловеческих варваров… исчезла, уничтоженная величайшими из собственных представителей.\n\nАвтократир Эшрей борется за власть над своими землями, утверждая, что разрушения, вызванные самовоспроизводящейся магией крови и Фродброкной, лишь доказывают его право править трупом Аверсарии. За морем вместе с Аверсарией пылает Саррадон, а север рушится, пока жители Картараддии пытаются спастись от того, что всё чаще называют Туманом…#!"

 bm_1217_the_black_gold_league: "#debug Чёрно-золотая лига#!"
 bm_1217_the_black_gold_league_desc: "#debug После загадочной смерти Дендона ден ва Сеньона Шевалье готовится к гражданской войне. Отец Дендона, грозный Хризе, стал первым верховным королём, объединившим марчеров за целое поколение. Самого же Дендона всегда считали слабым: он был слишком добр, чтобы пресекать козни непокорной знати, и слишком боялся личей, чтобы положить конец их всё более дерзким набегам.\n\nПротив его юного и неопытного сына Гардфрея выступили гордые Валадеки и древний род Монто, объединившиеся в Чёрно-золотую лигу. Несмотря на обвинения в убийстве Дендона, они выдвинули своим претендентом на престол кузена и друга детства Гардфрея — Терина Валадека.\n\nСумеет ли своенравный Гардфрей укрепить наследие ден ва Сеньонов и воссоединить королевство? Или Валадеки наконец завладеют троном, о котором мечтали столько поколений?#!"

 bm_1228_the_echoes_of_empire: "#debug Отголоски империи#!"
 bm_1228_the_echoes_of_empire_desc: "#debug Быть может, закономерно, что после Фродброкны последний автократир [Concept('aversaria','Аверсарии')|E] правит посредством репрессий и тирании. Автократир Эшрей восседает на всё более шатком престоле, опираясь на столь же ненадёжную сеть убийц, разбойников и военачальников. Но по мере усиления сопротивления и погружения Аверсарии в анархию невольно задаёшься вопросом: сколько времени осталось Эшрею, прежде чем мятежные подданные или растущие толпы северных беженцев положат горький конец его мечтам о величии?#!"
