l_russian:
# ПРИМЕЧАНИЕ: Всё это очень старый материал! Он был написан мной, LonelyKnightess, за одну ночь перед рождественским патчем несколько лет назад, потому что все в команде постоянно просили какую-то хронологию. Хотя большинство из этого стало основой для всего последующего лора, многое устарело или звучит странно с учётом того, как лор развивался с течением времени. Считайте всё, что здесь написано (КРОМЕ ПОСЛЕДНЕЙ ЗАКЛАДКИ, КОТОРАЯ НЕ ЯВЛЯЕТСЯ КАНОНОМ), каноном, пока это не противоречит более новым дополнениям к моду.

 start_year_37_01_01_desc: "Впервые в истории народ шевигадов высится единым целым. Отразив не только последнюю попытку изгнания со стороны галликадов, их бывших господ на востоке в лице этилизиадов, но и вторжение ужасного Короля-Волшебника Катануксы с юга, Бастион объединил шевигадов в империю, способную противостоять любым угрозам. Пока он сражается с повстанцами-галликадами и пытается сотворить единый народ из разрозненных племён, Катанукса зализывает раны и готовится к мести. Поговаривают, впрочем, и о бунте шетиканов, вдохновлённых идеей наконец свергнуть своего жуткого повелителя...\n\nДалеко за морями на юге древние религии востока подламываются под собственной тяжестью после смерти военачальника Насад-Синара, силой сплотившего эти земли, а балариды бьются с вторжением западных [Concept('ritualism','ритуалистов')|E]."
 
 start_year_67_01_01_desc: "Последний Никарин мёртв, но аэларвисийцы не знают отдыха. По всему Политакону народ ликует, провожая на войну на востоке против соперников из Сейчесского конкордата легионы, которым суждено стать первыми в истории аэларвисийцев. И хотя прежде сейчесцы дважды побеждали аэларвисийцев при поддержке восточных союзников из Храма Горного Солнца, жестокая гражданская война между правящими монашескими орденами и светскими военачальниками под предводительством Одира Тэна привела к тому, что сейчесцы остались в одиночестве.\n\nК северу от них смерть почти двухсотлетнего Катануксы, якобы павшего от руки самого престарелого Бастиона, повергла Царство Деккекад в хаос: двенадцать магов-регентов сражаются друг с другом за обломки государства."
 
 start_year_85_01_01_desc: "Со смертью бездетного Доброго короля Бастиона шевигады замерли в ожидании момента, когда всё рухнет. Версижекс, бывший ему братом во всём, кроме крови, восседает на престоле в качестве регента, пока судьба власти не решится. Последним желанием Бастиона было правление Версижекса, однако его магический дар вызывает лишь подозрение. Не только их лютый враг Катанукса был магом, но и этилизиаки, некогда державшие шевигадов в цепях. Более того, разум Версижекса всё сильнее терзают видения: разлом мира сквозь горный череп, павшие мертвецы, вновь восстающие на почерневшей земле, новая эра рабства для известного мира и апокалиптическая война на бескрайних берегах.\n\nПока галликады отступают на запад к своим последним оплотам в попытке свергнуть наместника Иниана, а могущественные лорды шевигадов точат мечи, с завистью взирая на престол Бастиона, вопрос лишь в том, когда именно всё окончательно рухнет."
 
 start_year_114_10_09_desc: "Непопулярный аавтократ Фанагоракс наконец находит шанс отвратить, казалось бы, неизбежное восстание Одира Ллета и дюжины разгневанных народов, силою принуждённых к подчинению Империи. И хотя его замыслы по созданию имперского культа терпят крах, ибо народ насмехается над попытками нечестивого правителя сотворить веру, набеги ийросских племён в глубь новых аэларвисийских колоний унесли жизни сотен людей. Пока народ Аэларвисии требует возмездия, Фанагоракс воздвигает великую колонну в Ораисполе, собирает крупнейший легион, какой только видели его подданные, и объявляет, что не успокоится, пока ийроссцы не падут перед его мощью.\n\nНа юге последние остатки баларидов, давно обращённые врагами в веру Тысячи Богов Эоса, начинают исход на юг, когда их последние восточные оплоты уступают натиску [Concept('ritualism','ритуалистов')|E]. По южному небу проносится красная звезда, и каждый знает: это мрачное знамение."
 
 start_year_144_10_09_desc: "Тьма пришла в Саррадон. Пока восторжествовавшие ритуалисты сталкиваются с величайшим кризисом в своей истории, из раскопанной древней гробницы вырвалось то, что многие окрестили [Concept('the_worldeater','Пожирателем миров')|E]. Пока великий зверь поглощает города, включая саму королеву Саррадона, ордена ритуалистов впервые пришли к согласию. Тот, кто сразит великого зверя, станет королём.\n\nГонка началась.\n\nТем временем земли, которые постепенно объединяющиеся шевигады начинают называть [Concept('chevalie','Шевалье')|E], лежат в руинах после убийства Версижекса, а военачальники грызутся из-за мелких выплат. Некоторые из них уже начали переходить горы на восток и истреблять павшие остатки этилизиадов, тогда как другие устремились на север против Ойейницы, жаждая выстроить собственные империи."
 
 start_year_156_11_21_desc: "Восстание имперцев! По всей Аэларвисии религиозные культы, которые Даки'ксен так отчаянно подавлял, объединяются под началом Акалионикса, требуя смерти аавтократа и утверждения своей молодой веры в качестве официальной религии Империи.\n\nЭто война драконов. Глубокие распри между кликами драконьих всадников Аверсарии заставили каждую из них выбрать сторону, и сотни [Concept('dragons','драконьих')|E] всадников ныне грабят деревни и сходятся в битвах из-за десятилетий обид, наконец получив повод высвободить свою мощь.\n\nНа севере Ойейница балансирует на лезвии ножа. Просвещённость Вравсила хранит молчание, беженцы в панике толпами бегут за её пределы, утверждая, что почтенные мертвецы восстали против них, пока [Concept('vilas_venslau','Вилас Венслау')|E] провозглашает себя первым [Concept('arch_lich','архиличем')|E] и требует верности от всего мира... Короли Ойейницы уже готовят свои армии против этой новой неведомой угрозы, даже продолжая воевать с захватчиками с юга."
 
 start_year_201_11_21_desc: "Когда [Concept('vilas_venslau','Вилас Венслау')|E] был наконец повержен и отброшен на север в Калатипсоми, преданный своим учеником [Concept('silas_stavro','Силасом Ставро')|E], первое великое вторжение из того, что ныне именуется [Concept('the_lichdoms','Личествами')|E] Ойейницы, утихло. Вопреки надеждам многих, личи не были уничтожены в одной грандиозной битве — вместо этого их адепты устремились на север, чтобы прибрать к рукам части владений бывших господ, выкраивая собственные феоды из останков Ойейницы. Тысячи людей бегут на юг, пока земля, которую они возделывали, умирает, а [Concept('marchers','марочники')|E] пытаются одновременно восстановить свой дом и справиться с потоком беженцев.\n\nНа далёком западе Пророк возвысил свой голос среди пустынь амсаров, заявляя, что узрел будущее своего народа — великую борьбу против ран кемсарцев на юге, из которой амсары со временем выйдут победителями. Пока новая религия распространяется подобно лесному пожару, смерть короля Алкада на востоке отзывается потрясением по всему ритуалистскому миру: со смертью внука того, кто сразил Пожирателя миров, десятки военачальников уже вступили в бой за право претендовать на его титул."
 
 start_year_256_01_01_desc: "Саррадон сталкивается с грандиозным религиозным движением по всему континенту. Вдохновлённые, возможно, Пророком амсаров, тысячи культов и верований стремительно набирают силу, и новые возникают чуть ли не каждый день. Пока военачальники-ритуалисты пытаются одновременно воевать друг с другом и сдерживать орду, возвышающиеся силы ран кемсарцев на западе наконец обращают амсаров в рабство и устремляются на порубежье ритуалистов.\n\nНа севере первый верховный король марочников Алоизиан провозглашает новое королевство — [Concept('chevalie','Шевалье')|E], заявляя, что оно является продолжением Королевства Бастиона. Желая расселить ойейницев в своих границах и объединить марочников против нового врага после уничтожения [Concept('arch_lich','архилича')|E] Уизлейкса, он продвигает границы марочников на восток. К моменту его смерти Шевалье будет простираться почти до Чёрных перевалов на востоке и гор на юге, откуда он наблюдает, как Аверсария пожирает сама себя."
 
 start_year_296_05_15_desc: "По всему Саррадону эхом разносится лишь одно слово. Война.\n\n[Concept('the_first_warden','Первый Варден')|E] поднимает голову, утверждая, что узрел видение от высших сил, томясь в подземельях военачальника Арахаса в проклятых внутренних землях восточного острова. Бог реален, он зл, а грехи развращённых ритуалистов медленно сокрушают замок, удерживающий его. Этот таинственный новый культ уже распространился по всему южному миру, и пока великие державы Кемсар и Дараджад ведут стычки на своих границах, [Concept('wardenism','вардениты')|E], кажется, готовы навсегда нарушить баланс сил.\n\nТем временем на севере Деллин выходит победителем в схватке со своими братьями после десятилетия гражданской войны и наконец начинает претворять в жизнь грандиозный план по объединению культур, языков и религий земель, которые он отныне именует [Concept('aversaria','Аверсарией')|E]. Одновременно с этим он отправляет свои легионы искоренять северных [Concept('antimagi','антимагов')|E] из их фортов в великих речных долинах Калатипсоми. Но пока он трудится, пробуждается новая сила. Артенанас, брат Маклеи, наконец скончался в укрытии. Его внук Терион «Последний Дракон» намеревается сделать лишь одно: отомстить за деда и занять престол, принадлежащий ему по праву..." 
 
 start_year_344_01_01_desc: "Когда последние остатки родни Последнего Дракона мертвы или скрываются, Аверсария наконец снова объединена. Малькоя окончательно покорена, а Опахасия впервые с 104 года полностью аннексирована, и Аавтократия обращает взор на север и восток для экспансии. Земли, которые аверсарианцы называют Айроноем, остаются под контролем могущественных астиликов, тогда как на севере жители Шевалье пытаются отбить вторжение лича-лорда Якуба «Злослова». Север открыт, аавтократу Патосу нужно лишь протянуть руку и забрать его...\n\nВ Саррадоне границы проведены и началась настоящая война. И хотя ритуалисты надеялись, что смерть Первого Вардена положит конец натиску варденитов, их рвение, кажется, только умножилось. При поддержке ран кемсарцев на западе лорды-ритуалисты стремительно объединяются в попытке спасти хотя бы то малое, что им осталось." 
 
 start_year_399_01_01_desc: "Ран кемсарцы разгромлены! Великая речная долина опустела, и их рабы-амсары выкраивают новое царство в северной части ныне мёртвой империи. С внезапным устранением их главного союзника со стороны нейтральных амсаров продвижение варденитов заходит в тупик, а войны с ритуалистами быстро превращаются в позиционную бойню.\n\nНа севере аверсарианцы наконец пересекли проливы и начали вторжение в Айроной. Распространяясь из [GetTitleByKey('c_asiupoli').GetNameNoTier], аверсарианцы и их союзники из восточных кланов начинают систематически уничтожать одно царство за другим, намереваясь распространить Аверсарию на загадочную восточную степь."
 
 start_year_421_01_01_desc: "С вторжением дракона Артенакс и её потомства на северо-востоке продвижение аверсарианцев останавливается на всех фронтах, пока великий дракон выжигает внутренние земли. После гибели Аавтократа от лап чудовища при пожаре в [GetTitleByKey('c_oraispol').GetNameNoTier] аверсарианцы погружаются в междоусобицы, пока их города стираются с лица [Concept('aeras','Эраса')|E].\n\nНа севере верховный король Пьет начинает амбициозное предприятие. Личей нужно остановить, и есть лишь один путь: принести войну в их дом! Дети Шевалье маршируют на север, намереваясь обрушить войну на своих заклятых врагов и покончить с угрозой раз и навсегда."
 
 start_year_442_05_06_desc: "Шевалье опустошено. Целое поколение сгинуло в безумии Северного похода. После гибели и восстания в виде нежити самого верховного короля Пьета военачальники марочников спешно выкраивают себе феоды, пытаясь сдержать крестьянство, воодушевлённое уничтожением военных сил своих господ. В колониях Шевалье на востоке безвластие породило волну восстаний, и Герцогская лига изо всех сил пытается удержать рубежи марочникского мира.\n\nВ Аверсарии Элиадия одерживает победу как в гражданской войне, так и в битве против Артенакс. Будучи самым могущественным магом своего поколения, она отправляется воссоединять расколотую аверсарианскую державу и с завистью взирает на север — на разорённые Марки."
 
 start_year_569_09_26_desc: "После почти века кровопролития лорды Шевалье и аверсарианцы наконец соглашаются на мир. Проведена новая граница: рубежи марочников проходят по Чёрным горам, а Аверсария забирает себе рог изобилия Калатипсоми. Пока Аверсария торжествует на северо-западе, губернатор Артеан из Малькои решает, что настало время расширить Малькою на север через горы — в лежащую там великую долину.\n\nНа востоке граф Темос плетет интриги из своих владений. Устав от мелких войн между губернаторами Айроноя и Опахасии и жаждая славы, в которой ему отказывают как они, так и стареющая Элиадия, он начинает осуществлять новый план, который содрогнёт аверсарианский мир..."
 
 start_year_600_01_01_desc: "Век личей? Именно так говорят многие, пока мир пылает.\n\nШевалье почти полностью поглощено силами [Concept('arch_lich','архилича')|E] Адваги Адракампы и её огромным войском скелетных тварей, но Аверсария тоже горит. Мало того что многолетняя борьба между губернаторами Калатипсоми и Малькои вылилась в гражданскую войну со смертью Элиадия, так ещё и граф Темос зажёг восток своим обращением в лича. Когда перед ним стоят восставшие легионы Айроноя и Опахасии, а на престоле сидит ребёнок-аавтократ, многие утверждают, что это последний конфликт, который покончит с миром. Особенно когда сама реальность гнётся и рвётся: [Concept('gedeora','гедеора')|E] разрывает Империю, уничтожая саму ткань бытия, а имперские города перемещаются во времени назад и вперёд по собственной воле."
 
 start_year_631_05_15_desc: "То, что многие считали концом раздоров, оказалось лишь жестокой шуткой судьбы. Калатипсоми и Малькоя наконец обретают мир, а личи Темос и Адвага мертвы, но ныне моровая язва терзает и потрёпанные остатки Аверсарии, и Марки. Когда первый за поколение верховный король сражён [Concept('bloodblight','кровавым мором')|E] всего через несколько месяцев после коронации, жители Шевалье наконец оставляют свои владения на востоке и переходят Чёрные горы, пытаясь спасти хотя бы малые остатки своих разрушающихся домов.\n\nВ Аверсарии кровавый мор выкашивает не только крестьянство, но оказывается ещё более опасным для магов государства, уничтожая целое поколение магической знати, прежде чем распространиться на юг в Саррадон, где он приносит не меньшую смуту и вынуждает временно приостановить многочисленные войны. К северо-востоку от Аверсарии Империум [Concept('kartharadd','Картараддов')|E] с жадностью взирает на своего немощного соперника на юге и готовится к великому вторжению в Малькою."
 
 start_year_679_03_13_desc: "Несмотря на падение Малькои, аверсарианцы снова сплотились и усвоили уроки этой новой войны. Перекованная и реформированная аавтократом $aauto_eramos_link$ Эрамом#! и его кабалом легонов, армия нового образца марширует, чтобы отвоевать северные центральные земли у растянувших свои силы картараддов.\n\nВ Саррадоне уничтожение магического сословия кровавым мором привело к революции в магических практиках. Новое поколение магов, лишённое учений прошлого, всё чаще обращается к запретным чарам, ранее считавшимся слишком опасными. Пока континент пылает в магической ярости, экспансия амсаров наконец остановлена [Concept('wardenism','варденитами')|E], которые отбрасывают их обратно в исконные земли и удерживают запад. Так ужасными чарами была положена последняя точка в попытках амсаров расширить свои границы."
 
 start_year_723_01_01_desc: "Из-за неудач на востоке Хиклахн пылает. Два десятка претендентов заявляют, что в них течёт кровь Пророка, и начинают кровавую войну, используя новые магические искусства, которым их обучили восточные враги. Но пока родина амсаров горит, с востока приходит новая сила. Изгнанный из родных мест, когда восточные равнины были обращены в прах магами варденитов и ритуалистов, народ айяров сокрушает местных варденитских лордов и начинает теснить границу амсаров на север.\n\nК югу от них великий военачальник Хенутахт объединил большую часть исконных земель ран кемсарцев и замышляет месть. Когда религиозная революция Саррадона долетает и до его ушей, он готовит свои великие армии и магов к последней опустошительной войне на севере, планируя наконец отомстить амсарам и сделать так, чтобы ни один амсар больше не мог воевать против его народа."
 
 start_year_764_11_09_desc: "Когда Хаос седьмого века наконец завершается разгромом последней картараддской армии у Ридувианских курганов, гибелью аавтократа $aauto_eramos_link$ Эрама#! и восхождением аавтократа Тейссии, ознаменовавшей конец эпохи войн и начало эпохи восстановления, Аверсария вздыхает с облегчением. Поскольку Этепезея, Малькоя и особенно Калатипсоми опустошены, а на востоке сохранились огромные, но неразвитые королевские владения со времён поражения Темоса, новый радикальный план реконструкции сосредотачивается на переносе центра власти Империи в стремительно растущий город [GetTitleByKey('c_asiupoli').GetNameNoTier] и богатые горы Опахасии.\n\nВ Марках верховная королева Арелли начинает выселять ойейницев из гетто в городах Шевалье и дарует им новые земли на опустевшем севере, надеясь положить конец погромам и конфликтам между ними и местными жителями. В Саррадоне же новая эра магии, кажется, достигает своего пика: маги начинают использовать заклинания невиданных масштабов, чтобы сжигать целые города и регионы или поднимать мертвецов в огромных легионах."
 
 start_year_802_03_19_desc: "То, что многие называли «Золотым веком саррадонской магии», а большинство остальных — «Эрой Огня», подходит к концу в Саррадоне после того, как кабалы магов Курати и Альмади совершили величайшее злодеяние друг против друга. Заклятие, воспроизводящее само себя, стеревшее целые регионы, омытое кровью тысяч людей, неуправляемо расползлось по Саррадону. К моменту, когда оно и грандиозные магические конфликты вокруг него наконец утихают, 80% магов Саррадона и миллионы простых жителей мертвы.\n\nСаррадон в руинах, и пока войны затихают среди опустошения, всё больше чужеземцев с новым интересом заходят в порты некогда позолоченных городов. Пока саррадонские лорды разорены, аверсарианские и шевальенские купцы расширяют своё присутствие, выгораживая себе огромные торговые кварталы и медленно прибирая к рукам южные торговые пути."
 
 start_year_834_01_01_desc: "Устав от своей доли на бедном северо-западе Шевалье и не испытывая интереса к очередному мимолётному объединению, герцоги-[Concept('voyagen','вояжены')|E] начинают выходить за пределы своих границ в поисках новых возможностей за морем. По всему миру марочники-наёмники и купцы появляются толпами, предлагая свои уникальные услуги в войне, торговле или обучении разных народов мира искусствам [Concept('antimagi','антимагии')|E] за щедрую плату. Нигде это не принимают с такой радостью, как в Саррадоне, где поколение местной знати проявило огромный интерес к уравниванию шансов с разрозненными остатками своих магов, и где медленно восстанавливающийся континент отчаянно ищет любые торговые возможности."
 
 start_year_878_03_14_desc: "В эпоху Жестокости безумный верховный король Тамеан реагирует на убийство своего сына Гилимана способом, которого не ожидал никто. За один час он натравливает наёмников из [Concept('antimagic_orders','антимагических орденов')|E] на собравшуюся на похоронах Гилимана знать и уничтожает глав почти всех ведущих дворянских семей Шевалье, а затем обрушивает свои силы на их детей и остатки их династий в других землях. Всё более параноидальный и явно безумный, он убивает даже оставшихся собственных детей, обвиняя их в содействии убийству брата.\n\nПосле четырёх лет гражданской войны и тысяч смертей сам Тамеан мёртв, в приступе безумия вскрывший себе вены в тронном зале. Шевалье больше нет, и со смертью могущественнейшей знати начинается анархия. Пять претендентов сумели собрать достаточно сил, чтобы провозгласить себя королями, но сотня мелких владений оспаривает их права, не говоря уже о вражде друг с другом."
 
 start_year_899_09_11_desc: "Пока Анархия Пяти Коройн продолжается, аверсарианцы устремляются укрепить свой контроль над Калатипсоми. Однако с окончанием Баларенского спора и самоубийством легона Тейсалиона аавтократ Мификс получил унизительный удар и отчаянно ищет любые средства отвлечь кружащих стервятников из знати, пока они не набросились на него.\n\nТем временем на северо-востоке картараддийские вплемена в течение двадцати лет втайне вооружались и готовились к великой войне за Апокиакас — свой родной дом. Когда Аверсария оказалась посрамлена даже такой слабой силой, как конейкменеры, многие заговорили о том, что настало время восстать..."
 
 start_year_939_01_01_desc: "[Concept('red_river_war','Война Красной реки')|E] завершена, а с ней и Анархия Пяти Коройн. Враждующие [Concept('antimagic_orders','антимагические ордена')|E] сохраняют единство против угрозы нежити, следуя учениям доблестного [Concept('champion_of_chevalie','Чемпиона Шевалье')|E], пожертвовавшего собой ради уничтожения короля-лича [Concept('silas_stavro','Силаса Ставро')|E], и объявляют о своём нейтралитете в политике Марок. И хотя пять королей-претендентов Марок либо мертвы, либо отказались от притязаний, многие взирают на возможное воссоединение, видя в войне доказательство того, что Шевалье должно быть сильным.\n\nВ Саррадоне Абдар «Раздиратель Богов» Сархадын начинает амбициозную кампанию по уничтожению власти ритуалистов на далёком востоке. Тем временем на западе пылает Амсарский Хиклахн: братья Зоэн и Рексил объединились, чтобы убить своего отца, и теперь обрушивают скверную магию на пылающую империю, оспаривая его престол."
 
 start_year_999_03_14_desc: "Ересь! Разрушение Собора Ден-Монсо на юге Шевалье поразительно мощной [Concept('gedeora','гедеорой')|E] вызвало шок по всему северу. Пока страна ещё восстанавливается после опустошительной [Concept('red_river_war','Войны Красной реки')|E], а церковь увязает в скандалах из-за своего участия в конфликте, скептически настроенные проповедники и учёные по всему Шевалье начинают утверждать, что сама вера Марки оказалась ложной.\n\nУже сейчас возникают десятки культов, а военачальники принимают новые верования для укрепления своей власти. Пока Шевалье погружается в первую великую религиозную войну, предстоящий Совет Экс должен решить, что делать. Настало ли время реформ, как говорят кетианцы, и создания новой веры? Или же инквизиторы добьются своего, и кровь будет литься до тех пор, пока все снова не ступят на Путь?"
 
 start_year_1094_08_28_desc: "Стареющий Фансис оказался неспособен укротить своих многочисленных детей. Слишком долго это считалось королевским правом, но в конце концов превзошло все границы. Когда скандал вокруг Пелина — изнасилование и убийство двух десятков рабов — наконец долетел до ушей простолюдинов, даже обладатели чистой крови больше не могут притворяться праведными правителями. Когда даже те, кто наживается на крови рабов, сомневаются в истинности своих верований, восемь фигур поднимаются по всей Аверсарии, требуя новой эры реформ. История назвала их Агионистскими святыми, но сами эти реформаторы именуют себя последним шансом Аверсарии изменить свой путь.\n\nВ Шевалье юный верховный король Вальден провозглашён самым молодым Святым Путей в истории и одним из всего девяти, провозглашённых при жизни, когда он сражает [Concept('arch_lich','архилича')|E] Милона «Тронутого Богом» Зацковича. Вальден мечтает об эре реформ: грамотном крестьянстве, денежной реформе, церкви в каждой деревне и радикальном новом походе для продвижения границы на север и окончательного покончения с угрозой личей. Однако ходят слухи, что хотя юный верховный король и герой, живым ему долго не пробыть, ибо с каждым днём его здоровье угасает..."
 
 start_year_1099_11_12_desc: "Народная революция завершилась! Когда монархия была упразднена победившим Народом Единства при поддержке мелкого дворянства и (как они сами утверждают) простолюдинов, канцлер Бруде провозглашает со ступеней дворца низложенного короля, что для конейкменеров началась новая эра, и что его первой целью станет отвоевание низменностей у Шевалье.\n\nВ Саррадоне ритуалисты отвоевали восточный остров и начинают укреплять свой контроль на вновь объединённом востоке. Когда вардениты отступают, а ритуалисты подбираются к их священной столице, многие задаются вопросом, не подбирается ли [Concept('war_in_heaven','Война на небесах')|E] к своему финалу."
 
 start_year_1144_03_11_desc: "После примирения с Аагиократией военизированным орденам агионистов было даровано разрешение колонизировать [Concept('sarradon','Саррадон')|E], примкнув к непрерывному потоку [Concept('aversaria','аверсарианцев')|E], хлынувших на южный континент. Хотя [Concept('ritualism','ритуалисты')|E] восточного Саррадона пока стоят твердо, сочетание этого нового вторжения с вечной борьбой против [Concept('wardenism','варденизма')|E] грозит ввергнуть одну из древнейших религий Эраса в катастрофу, невиданную со времен [Concept('the_decimation_of_sarradon','Халакдуна')|E]."
 
 start_year_1169_01_11_desc: "Аверсария содрогается от последствий Одрстунда: некогда изворотливая знать погрузилась на новую глубину безумия от психического шока того, что многие стали называть умирающим миром. По всей Аверсарии убийства и мелкие войны стали новой нормой, а безвременная смерть стареющего аавтократа Искения доказала, что даже правитель Аверсарии не застрахован от гибели. Пока юный Тресат пытается удержать свой престол против восстания губернатора Детино́на из Малькои и семей ретиористов, культ Чёрной Руки распространяется как лесной пожар по Этепезее. Вопрос, кажется, не в том, умрёт ли Империя, а в том, как именно.\n\nПока Империя горит, Саррадон выскальзывает из её рук. Агионисты всё больше пренебрегают имперским авторитетом, и то, что прежде было разрозненными аванпостами проповедников и их стражи, всё больше превращается в извращённую версию их собственных учений, собираясь в огромные армии для распространения своего святого слова. Восточный Саррадон пал, но говорят, что следующей их целью станут колониальные владения самой родины..."
 
 start_year_1186_06_03_desc: "Анесимасий мёртв! Упав в объятия своей юной жены Аксиотеи во время пира, он оставил знать в подозрениях о яде и предательстве. Аксиотея виновата, твердили они, пока Аксиотея не сожгла [Concept('blood_senate','кровавый сенат')|E] дотла вместе с четвертью ведущих правителей Аверсарии. Ныне никто не осмеливается говорить о несогласии, кроме дерзкого Эшрея — соперника (и, как говорят, любовника) Аксиотеи ещё со времён их юности в [Concept('mayikrata','Майикратии')|E], уже ставшего успешным легоном в свои 18 лет. XXI Легион, принявший имя «Эшрей», уже захватил столицу Ораисполь, пока Аксиотея бежит во владения своей семьи на востоке. Начинается война невиданного в истории Империи масштаба."
 
 start_year_1200_02_11_desc: "Аверсария истекает кровью.\n\n[Concept('frodbrokna','Фродброкна')|E] оставила свой опустошительный след, а аавтократ Эшрей, похоже, вышел победителем из того, что могло стать последней настоящей [Concept('imperial_civil_war','гражданской войной')|E]. Восточная половина Аавтократии, некогда жемчужина мира, ныне лежит в руинах. Пашни обращены в пепел, города сожжены в гигантских пожарищах, а миллионы принесены в жертву в самом могущественном заклинании, когда-либо разрушавшем мир. Аксиотея мертва, но последние остатки имперской власти разваливаются, когда сторонники Эшрея массово восстают.\n\nВ Саррадоне Война Святых продолжается уже шестое кровавое десятилетие, и агионисты, кажется, находятся на грани завоевания всего юга. Кажется, лишь чудо сможет спасти южан от полного вымирания перед этими иноземными захватчиками."
 
 start_year_1217_4_12_desc: "Со смертью Дендона ден ва Сеньона Шевалье готовится к гражданской войне. И хотя отцом Дендона был грозный Гризе́, первый верховный король, объединивший марочников за поколение, сам Дендон всегда считался слабым — слишком добрым, чтобы пресечь интриги непокорных дворян, и слишком испуганным личами, чтобы остановить их всё более дерзкие налёты.\n\nВ противовес его юному и неопытному сыну Гардфрею гордые Валадеки и древний род Монто объединились в Лигу Чйрного Золота, выдвинув кузена и друга детства Гардфрея — Терина Валадека — своим претендентом на престол, несмотря на обвинения в убийстве Дендона.\n\nУкрепит ли упрямый Гардфрей наследие Ден ва Сеиньонов и воссоединит ли престол? Или Валадеки наконец заберут трон, о котором мечтали столько поколений?"
 
 start_year_1254_01_01_desc: "Прошло почти целое поколение с тех пор, как [Concept('frodbrokna','Фродброкна')|E] разорвала мир на части, но её последствия всё ещё терзают опустошённую землю. В Аверсарии варвары-сьялволки, кажется, готовы нанести смертельный удар Аверсарианской Аавтократии, господствовавшей на [Concept('the_continent','Континенте')|E] на протяжении всей памятной истории. На севере некогда объединённые лорды-марочники начали пожирать друг друга после того, как верховный король Гардфрей исчез на севере в тайном походе. И хотя личества на далёком севере пока хранят молчание, кто знает, чем эти междоусобицы грозят марочникам. Наконец, на далёком юге саррадонцы наконец переломили ход битвы против орденов агионистов и других колонизаторов, прорубая путь к освобождению своего долго терзаемого континента, хотя остаётся лишь гадать, что агионисты замыслили за закрытыми дверями..."
 
 start_year_1298_03_13_desc: "Сокрушитель Ведьм мёртв, и колокола звонят по всему сьялволькскому миру, оплакивая его уход. Империя Орисполя разделена между его тремя сыновьями, и хотя царит мир, шепотки о войне раздаются даже тогда, когда прах их отца приносится в подношении Велосу. По всей бывшей Империи мир меняется: новый уклад жизни порождает множество новых верований и культур в том, что многие называют великим пробуждением. Эра хаоса, кажется, стремительно приближается, пусть даже [Concept('the_fog','Туман')|E] временно остановился...\n\nВ Саррадоне последние остатки агионистов бьются из последних сил, пока хартахиты выбивают захватчиков из их последних оплотов, хотя неминуемый Меч Ангелов зажигает новую эру ритуалистского восстания. На западе наёмники и купцы марочников продолжают пожирать останки великого Амсарского Хиклахна, а в самом Шевалье враждующие государства бьются с возвышением загадочного культа, пока личества пробуждаются вновь..."

 start_year_1799_01_01_desc: "Ещё один год проходит на Острове. Как и каждый памятный год до него, он полон сомнений в том, смогут ли великие Заградительные башни и впредь сдерживать бесплотный Туман, не вспыхнет ли снова война между городами-государствами, и какая новая научная находка или невообразимый ужас таится в глубине суши. Последняя война стёрла город Аксотайна с лица земли, когда Монтерии уничтожили его Заградительные башни перекрёстным огнём, и пока ползут слухи о ещё более масштабной борьбе между одиннадцатью оставшимися городами, многие опасаются, что следующая война не оставит в живых никого. Особенно когда доходят вести, что Гисреддепорт умолк, а в северных [Concept('foglands','Туманных землях')|E] что-то пробуждается...\n\nВо внутренних землях кланы падальщиков умолкают один за другим, всё меньше наёмников откликаются на постоянные призывы городов-государств добыть артефакты. Слухи множатся, но один шепчут громче всех: клан Ватер о чём-то говорил на востоке... и оно наблюдает за всеми..."

# Примечание LonelyNote: Это не фактический лор Godherja! Это небольшая забавная идея, которая пришла мне в голову для сеттинга в той же вселенной. «Канон» заканчивается либо после 1298 года от И.С., либо после нажатия кнопки «играть», в зависимости от того, находитесь ли вы в игре или нет, поэтому всё, что произойдёт с миром дальше — на ваше усмотрение. Если вы хотите, чтобы это стало вашим каноном, то пожалуйста! Но, пожалуйста, не думайте, что написанное ниже отражает лор Godherja или произойдёт в игре, это просто забавная идея для моего личного представления о мире Godherja. В будущем, если Godherja каким-то образом будет «завершена» до уровня, когда я почувствую, что могу сделать ещё один мод для CK3 без его затягивания, я бы хотела превратить это в новый мод, где вся карта будет состоять из одного города с зданиями в качестве бароний, графствами будут городские кварталы, герцогствами — микрорайоны, а королевствами — районы, а игрок сможет стать одним из многочисленных криминальных синдикатов или, возможно, городской стражей. Но всё это пока лишь далёкие гипотезы :)
 
# 13 ГОРОДОВ ЧЕЛОВЕЧЕСТВА ###
# ГРЕЙВПОРТ — КРЕОЛЬСКАЯ СМЕСЬ ДЕСЯТКОВ РАЗЛИЧНЫХ КУЛЬТУР, ЧЕТЫРНАДЦАТЬ ОФИЦИАЛЬНЫХ ЯЗЫКОВ, КРУПНЕЙШИЕ ГРУППЫ — МАРОЧНИКИ И САРРАДОНЦЫ — БОГАТЕЙШИЙ ИЗ ГОРОДОВ И ПО БОЛЬШЕЙ ЧАСТИ НЕЙТРАЛЬНЫЙ — ВОЗГЛАВЛЯЕТСЯ СИЛАСОМ СТАВРО, САМЫМ СПОКОЙНЫМ ЛИЧОМ #
# ДАУКЕНИПОРТ — В ОСНОВНОМ КЛАНЛЕНДЕРЫ + АМСАРЫ — КРУПНЕЙШИЕ СУХОПУТНЫЕ СИЛЫ В ГОРОДАХ, НО УСТАРЕВШИЕ — ВОЗГЛАВЛЯЕТСЯ ИЕРАРХОМ МИККЕЛНОМ БРЕДАНОМ, МУДАКОМ, КОТОРЫЙ ХОЧЕТ ВЗРЫВАТЬ ГОРОДА, КОТОРЫЕ ЕМУ НЕ НРАВЯТСЯ — ВЕЛЬДИЙСКАЯ ЛИГА #
# АКСОТАЙНА — В ОСНОВНОМ АВЕРСАРИАНЦЫ + АГИОНИСТЫ + КОНЕЙКМЕНЕРЫ — В ЦЕЛОМ МИРНЫЙ И БОЛЕЕ ЗАИНТЕРЕСОВАННЫЙ В ТОРГОВЛЕ И ТЕХНОЛОГИЧЕСКОМ РАЗВИТИИ, БЫЛ СЛУЧАЙНО ВЗОРВАН — ВОЗГЛАВЛЯЛСЯ АРХ-МАГОМ АРДЖВЕНОМ, ПРОПАВШИМ БЕЗ ВЕСТИ ПРИ НАПАДЕНИИ #
# МАЛЫЙ СВЕТ — В ОСНОВНОМ МАРОЧНИКИ + ПАРТИКИ — НЕПОСТИЖИМЫЕ СЕМЬИ УБИЙЦ, ЛЮБЯЩИЕ ВЕДАТЬ ДЕЛАМИ С ДРУГИМИ ГОРОДАМИ ЧЕРЕЗ ТРЕТЬИХ ЛИЦ — ВОЗГЛАВЛЯЕТСЯ ПАТРИЦИЕМ ГАЛО, КОТОРОГО НЕ ВИДЕЛИ НА ПУБЛИКЕ УЖЕ ДВАДЦАТЬ ЛЕТ — ВЕЛЬДИЙСКАЯ ЛИГА #
# РЕТИАН — В ОСНОВНОМ КЛАНЛЕНДЕРЫ + АВЕРСАРИАНЦЫ + МАРОЧНИКИ — ТЕХНОЛОГИЧЕСКИЙ ХАБ ГОРОДОВ И ВТОРОЙ САМЫЙ МАЛЕНЬКИЙ — ВОЗГЛАВЛЯЕТСЯ ШЕСТЬЮ ЗНАТНЫМИ СЕМЬЯМИ, КОТОРЫЕ РЕГУЛЯРНО ЛИБО ОТБИРАЮТ ВЛАСТЬ ДРУГ У ДРУГА, ЛИБО ОБМЕНИВАЮТСЯ ЕЮ В КУЛУАРАХ — РЕТИАНСКИЙ ПАКТ #
# КОДЖОЛКАДДЕР-АЛЬ-АЛАВЕД — В ОСНОВНОМ САРРАДОНЦЫ И КОНЕЙКМЕНЕРЫ — ВЕРФЕВОЙ ХАБ — ВОЗГЛАВЛЯЕТСЯ КЛАССOМ РЕСПУБЛИКАНСКОЙ ДЖЕНТРИ, КОТОРЫЙ СЖИГАЕТ ГОРОД КАЖДЫЕ ДВЕНАДЦАТЬ ЛЕТ В ГРАЖДАНСКОЙ ВОЙНЕ, НЫНЕШНИЙ — ЭЛЕКТОР ХАТАДЕН, БЕЗУМНЫЙ КОЛОСАТЕЛЬ С ТЕЛОМ 14-ЛЕТНЕЙ ДЕВОЧКИ, ЖЕЛАЮЩИЙ СОЖЧЬ ВСЕХ, КТО С НИМ НЕ СОГЛАСЕН — РЕТИАНСКИЙ ПАКТ #
# ОРДРОС — КРЕОЛЬСКАЯ ПРИТОННАЯ ЯМА ДЛЯ ВСЕХ, КАК ГРЕЙВПОРТ И ГОРОД, В КОТОРЫЙ ИГРАЮТ В МОДЕ — САМОЕ БОЛЬШОЕ НАСЕЛЕНИЕ ИЗ ГОРОДОВ И КРИМИНАЛЬНОЕ ГНЕЗДО — ВОЗГЛАВЛЯЕТСЯ ПОЖИЗНЕННЫМ ПРИНЦЕМ, ИЗБИРАЕМЫМ ИЗ ПРАВЯЩИХ СЕМЕЙ ГОРОДОВ, НЫНЕШНИЙ ПРАВИТЕЛЬ — ЭЛЬМЕД ФЕТРИАД, КОТОРЫЙ ЯВЛЯЕТСЯ РЕДКОЙ МРАЗЬЮ И ПУГАЮЩИМ ТИПОМ — МЕНЯЕТ СОЮЗЫ ЧАЩЕ, ЧЕМ GODHERJA МЕНЯЕТ АПОКАЛИПТИЧЕСКИЕ СОБЫТИЯ #
# ДАНДАРЛИИ — В ОСНОВНОМ ОЛЬТЕНИ (60%) + АГИОНИСТЫ + МАРОЧНИКИ — СТОЛИЦА ВЫСОКОЙ КУЛЬТУРЫ МИРА, НЕВЕРОЯТНО ИЗЫСКАННАЯ И ЛЮБЯЩАЯ УДАРЫ В СПИНУ, НЕНАВИДИТ МАЛЫЙ СВЕТ — ВОЗГЛАВЛЯЕТСЯ ГРАФОМ УНДИАМОМ — РЕТИАНСКИЙ ПАКТ #
# ПРОРОК — В ОСНОВНОМ АМСАРЫ С КЛАССOМ РАБОВ РАН КЕМСАРОВ — МАГИЧЕСКАЯ СТОЛИЦА ГОРОДОВ — ВОЗГЛАВЛЯЕТСЯ ЯКОБЫ 300-ЛЕТНИМ КОРОЛЁМ-МАГОМ ПО ИМЕНИ АРА, КСЕРКСЕСОМ 300, КОТОРЫЙ УТВЕРЖДАЕТ, ЧТО ЯВЛЯЕТСЯ РЕИНКАРНАЦИЕЙ ПРОРОКА (СКОРЕЕ ВСЕГО, ЛЮДИ ПРОСТО НАДЕВАЮТ МАСКУ, КОГДА ПОСЛЕДНИЙ ВЕРХОВНЫЙ КОРОЛЬ ТАЙНО УМИРАЕТ) — ВЕЛЬДИЙСКАЯ ЛИГА #
# КЕЛД-НОР — В ОСНОВНОМ ДАМОТАНЦЫ + АГИОНИСТЫ — ПРОИЗВОДИТ БОЛЬШИНСТВО ВОЗДУШНЫХ КОРАБЛЕЙ, КОТОРЫЕ СКУПАЮТ/КОПИРУЮТ ДРУГИЕ ГОРОДА-ГОСУДАРСТВА — НАСТОЯЩАЯ ЧЕСТНАЯ НАСТОЯЩАЯ РЕСПУБЛИКА, УСТРАИВАЮЩАЯ РЕВОЛЮЦИИ КАК ПО РАСПИСАНИЮ (У НИХ ДВЕНАДЦАТАЯ РЕСПУБЛИКА) — ВОЗГЛАВЛЯЕТСЯ МИНИСТРОМ УНДМАНОМ — ВЕЛЬДИЙСКАЯ ЛИГА #
# ГОРОД СВЯТЫХ — В ОСНОВНОМ АГИОНИСТЫ — САМАЯ БОЛЬШАЯ РЕЛИГИЯ НА ОСТРОВЕ ЦЕНТРИРУЕТСЯ ОТСЮДА — ВОЗГЛАВЛЯЕТСЯ КОНКЛАВОМ ДВЕНАДЦАТИ ОФИЦИАЛЬНО ПРИЗНАННЫХ ЦЕРКВЕЙ С НЫНЕШНИМ ПРАВИТЕЛЕМ ЖРЕЦОМ-ЛОРДОМ АИНДОМ — РЕТИАНСКИЙ ПАКТ #
# ОРИДОН — КРЕОЛЬСКАЯ СМЕСЬ КЛАНОВ ПАДАЛЬЩИКОВ — ЕДИНСТВЕННЫЙ ВНУТРЕННИЙ ГОРОД, ЧЁРТОВСКИ БЕСПОЛЕЗНЫЙ, НО ХОРОШ ДЛЯ СБОРА ХЛАМА — ВОЗГЛАВЛЯЕТСЯ ЗЛОБНЫМ МУЖИКОМ-МЛАДЕНЦЕМ ПО ИМЕНИ МИЛИДАН, КОТОРЫЙ ПРОСТО БАНДИТ, ЗАХВАТИВШИЙ ВЛАСТЬ — ОРИДОНСКИЙ АЛЬЯНС (ИХ ЕДИНСТВЕННЫЙ СОЮЗНИК — ОРДРОС ПО ВТОРНИКАМ) #
# ПЕТИ ГИСРЕДДЕ — ВСЁ ЕЩЁ ЖИВ, ДЕТКАААААААААА — ЕДИНСТВЕННЫЙ ИЗВЕСТНЫЙ ГОРОД ВНЕ ОСТРОВА, ВСЁ ЕЩЁ СТОЯЩИЙ НА НОГАХ (Раньше было несколько других, угасших за эти годы), ТАКЖЕ САМЫЙ БОЛЬШОЙ И БОГАТЫЙ И АБСОЛЮТНО НЕ ПОЕДАЕМЫЙ ТУМАННЫМИ ЛИЧАМИ-МЕРЗОСТЯМИ / ТУМАНОЕДАМИ НА СТЕРОИДАХ / НАСТОЯЩИМИ ЛИЧАМИ, КОТОРЫЕ КАК-ТО ВЫЖИЛИ И ПРОБИЛИСЬ СКВОЗЬ ТУМАН ПОСЛЕ СОТЕН ЛЕТ ПОПЫТОК НАУЧИТЬ ТУМАННЫХ ТВАРЕЙ ТОМУ, ЧТО КАК СКЕЛЕТЫ ОНИ РАСОВО ПРЕВОСХОДЯТ ИХ #