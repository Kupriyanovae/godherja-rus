 bm_1254_the_dying_world:0 "Умирающий Мир"
 bm_1254_the_dying_world_desc:0 "Аверсария находится в своих последних мгновениях.\n\nЦенвар «Сокрушитель Ведьм» и его Имперех, переселяющееся коалиция сотен племён из десятков культур, посвящённая исключительно разделению умирающей Аверсарианской Автократии, устремляются на юг в то, что осталось от мёртвого государства. Великий союз, который стремился положить конец амбициям варваров, разрушен, Элизийский перевал ставит последний гвоздь в гроб Империи.\n\nПо всему миру целые народы потрясены. Военачальники всех мастей пытаются захватить свою долю той небольшой безопасной земли, которая осталась нетронутой Туманом. В Саррадоне продолжается последняя битва между агионистами и коренными саррадонцами, а в Марках дети пропавшего Верховного короля Гардфрея разрывают Шевалье на части в своей битве за сломанную корону."

 bm_1254_the_dying_world_cenware:0 "Ценвар «Сокрушитель Ведьм»"
 bm_1254_the_dying_world_cenware_subheading: "High King of the Sjalvolki Imperrech"
 bm_1254_the_dying_world_cenware_desc:0 "Слава «Сокрушителю Ведьм»! Первый человек, объединивший кланы сьяволки в истории, будучи ещё юношей, первый, кто сжёг библиотеки [Concept('mayikrata','Майикратии')|E] вскоре после этого, и вскоре тот, кто отправит [Concept('aversaria','аверсарианское')|E] чудовище на заслуженную смерть. За спиной Ценвара стоят сотни культур, объединённых одной целью, поселить свой народ на плодородных землях Империи.\n\n#bold Но Имперех не вечен по самой своей сути. Как только Империя падёт, кланам Импереха обещаны свои доли земли, и уже бывшие друзья начали грызться за крошки. Сможете ли вы объединить народ сьяволки и начать новую эру для мира?"
 bm_1254_the_dying_world_harthah: "Ḥārthah ibn Sarradon"
 bm_1254_the_dying_world_harthah:0 "Хартах ибн Саррадон"
 bm_1254_the_dying_world_harthah_desc:0 "Агионистские ордена заявляют о чистоте и добродетели, но никто больше, чем «Отец [Concept('sarradon','Саррадона')|E]», не знает, что это ложь. Они отвратительные нечистые существа, вставшие на путь уничтожения [Concept('sarradon','Саррадона')|E] и, без сомнения, открывающие ворота для Пленника в Капюшоне. Он понял это во всей полноте, когда его жену забрали работорговцы. И когда его господин отказался позволить ему освободить её, он осознал, что только он может спасти свою землю.\n\n#bold Для Хартаха весь [Concept('sarradon','Саррадон')|E] — его дети, и его священная миссия — сделать так, чтобы никто из них больше не боялся 'святых' орденов. Сможете ли вы положить конец тысячелетней войне и объединить народ [Concept('sarradon','Саррадона')|E] против захватчиков?"
 bm_1254_the_dying_world_hecaeda:0 "Леган Гекаэда"
 bm_1254_the_dying_world_hecaeda_subheading: "Legan of Legio LXI 'Anoterion'"
 bm_1254_the_dying_world_hecaeda_desc:0 "Легион прошёл невероятные расстояния, чтобы вернуться домой с востока в разрушенное государство. И винить в этом мы можем только себя.\n\n[Concept('aversaria','Аверсарианцы')|E] вызвали это, [Concept('aversaria','аверсарианцы')|E] угнетали, разрушали и сжигали. Легон Валерикс, Чистейший упокой его душу, знал это лучше всех. Он научил меня этому, когда удочерил меня на тропе так давно, и хотя теперь он мёртв, я завершу его миссию.\n\n#bold Сможете ли вы завершить дело Валерикса и принести новую эру [Concept('aversaria','Аверсарии')|E], исправив ошибки и злодеяния своих предков? И, что более важно, сможете ли вы найти его убийцу?"
 bm_1254_the_dying_world_nicanoneus:0 "Никаноней «Чёрное Солнце»"
 bm_1254_the_dying_world_nicanoneus_subheading: "Aautokratir Kyvernir Arch-Legon of Epavarion"
 bm_1254_the_dying_world_nicanoneus_desc:0 "Для «Чёрного Солнца» существует только война.\n\nЕго жизнь — одна длинная битва, он сражался от своей родины на дальнем востоке имперских колоний до гор Марок. Его дом поглотил [Concept('the_fog','Туман')|E], а последние остатки теперь заселены варварским отребьем. Никаноней — человек, которому нечего терять. Поэтому он завоюет всё.\n\n#bold Единственный человек, победивший Ценвара в открытом бою, единственный [Concept('aversaria','аверсарианец')|E], командующий легионом варваров, его люди почитают его как божество. Но достаточно ли божественности, чтобы спасти [Concept('aversaria','Аверсарию')|E]?"
 bm_1254_the_dying_world_rene_de_va_seignon:0 "Рене «Чёрный бастард»"
 bm_1254_the_dying_world_rene_de_va_seignon_subheading: "Commander of the Band of Bastards"
 bm_1254_the_dying_world_rene_de_va_seignon_desc:0 "Рождённый служанкой при иностранном дворе, Рене был вынужден бороться за своё место в семье и покинул её, чтобы создать свою собственную наёмную компанию за годы до путешествия его отца на север и последующего исчезновения.\n\nТеперь его отец пропал, а братья сражаются за добычу. После того, как он едва спасся со своими людьми из Элизийского перевала, заслужив салют от самого «Сокрушителя Ведьм».\n\n#bold Рене и его компания теперь высадились на юге Шевалье. Сможете ли вы подняться до уровня и доказать, что, несмотря на своё происхождение, вы — истинный сын своего отца?"

 bm_1254_the_broken_crown:0 "Разбитая Корона"
 bm_1254_the_broken_crown_desc:0 "Верховный король Гардфрей де ва Сеньон, возможно, когда-то был хорошим монархом, в зависимости от того, кого спросить, но его одержимость тайной миссией поглотила его, и к концу его правления Верховное Королевство управлялось отсутствующим правителем. Когда различные претенденты на трон собрались на Совете Грапаннеса в 1251 году, он разбил свою корону и бросил её в претендентов, сказав, что тот, кто соберёт её части, может править, насколько его волнуют такие «жалкие заботы». Теперь Верховный король ушёл, отправившись на север с самыми верными соратниками, а Верховное Королевство истекает кровью."

 bm_1254_the_broken_crown_ansfrei:0 "Ансфрей ден ва Сеньон"
 bm_1254_the_broken_crown_ansfrei_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_1254_the_broken_crown_ansfrei_desc:0 "Учёный брат, Ансфрей вырос, не желая иметь ничего общего с троном, мечтая о жизни среди учёных и мыслителей. Теперь, однако, его отец исчез, а родина пылает. Ансфрей, возможно, не великий воин и не обладает большинством качеств, считающихся королевскими в Шевалье, но он верит, что только он может спасти её.\n\n#bold Ансфрей — мыслитель, а не воин, но, возможно, Шевалье нужен великий ум, чтобы спастись. Докажете ли вы своим братьям, что слова, а не мечи, спасут землю?"
 bm_1254_the_broken_crown_benouet_de_va_seignon:0 "Бенуэ ден ва Сеньон"
 bm_1254_the_broken_crown_benouet_de_va_seignon_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_1254_the_broken_crown_benouet_de_va_seignon_desc:0 "Бенуэ был первым сыном Верховного короля Гардфрея и, таким образом, традиционным преемником его титула. Однако, хотя наследник родился здоровым и крепким, казалось, что он родился полоумным. Многие объявили его неспособным, Бенуэ с трудом одевается большую часть дней, и различные претенденты на трон не раз указывали на это.\n\n#bold Несмотря на свои недостатки, Бенуэ окружён верными советниками, стремящимися помочь традиционному наследнику (и, несомненно, получить награды), и занимает столицу Верховного Королевства и самые богатые провинции. Сможете ли вы собрать части Разбитой Короны, несмотря на сопротивление?"
 bm_1254_the_broken_crown_cliement:0 "Клиеман ден ва Сеньон"
 bm_1254_the_broken_crown_cliement_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_1254_the_broken_crown_cliement_desc:0 "Младший из братьев Ден ва Сеньон, Клиеман был тайно вывезен из столицы вскоре после исчезновения отца своей матерью, которая боялась за его безопасность.\n\nТеперь она правит как его регент, но, погружаясь всё глубже в объятия наёмника Энгельмара Ден ва Спенсера, многие задаются вопросом, не попал ли юный король в ещё большую опасность...\n\n#bold Будучи всего лишь ребёнком, никто не знает, каким человеком станет Клиеман. Станете ли вы хорошим королём или мелким деспотом? Победите ли вы своих братьев? И выживете ли вы в интригах двора?"
 bm_1254_the_broken_crown_magi:0 "Аммар «Кривоязыкий»"
 bm_1254_the_broken_crown_magi_subheading: "Duc of Callesc"
 bm_1254_the_broken_crown_magi_desc:0 "Некоторые говорят, что Аммар был проклят при рождении. Он не только родился с шепелявостью и хромотой, не только родился у родителей, которые пропали в море до его первого лета, и не только потерял наследство после провала бизнеса своего дяди, Аммар родился [Concept('magi','магом')|E] в обществе, которое презирало его за это.\n\nНо у Аммара есть план, и Аммар знает истинный путь. Марки умирают, и только магия может их спасти. Теперь взрослый и самостоятельный человек, Аммар найдёт то, что украло дар магии у Шевалье, и уничтожит это.\n\n#bold Аммар слаб здоровьем и имеет мало власти, но у него грандиозные планы, превышающие его возможности. Сможете ли вы завершить его поход, чтобы вернуть магию на север? И сможете ли вы справиться с последствиями?"
 bm_1254_the_broken_crown_mathilde:0 "Матильда"
 bm_1254_the_broken_crown_mathilde_subheading: "Duqessa of Bassons"
 bm_1254_the_broken_crown_mathilde_desc:0 "Крестьянка с рождения, Матильда пробилась к вершинам, о которых другие женщины её сословия никогда бы не подумали. От ничтожества до шпионки Верховного короля, её амбиции всегда были ясны. С исчезновением Верховного короля Гардфрея, Матильда видит возможность там, где другие видят катастрофу.\n\n#bold Те немногие, кто знает Матильду, знают, что её нужно бояться, но никто не ожидает, что она действительно поднимется до позиции, которую она жаждет. Докажете ли вы их неправоту и объявите себя первой Верховной королевой за поколения?"
 bm_1254_the_broken_crown_ogiers:0 "Ожье «Огр»"
 bm_1254_the_broken_crown_ogiers_subheading: "Duc of Banereset"
 bm_1254_the_broken_crown_ogiers_desc:0 "Ожье «Огр» был назван многими квинтэссенцией [Concept('antimagi','антимага')|E], а для многих других — живым народным героем. Родившись в маленькой деревне в Лавеце в семье мелких дворян, всего в одном поколении от крестьянства, он присоединился к [Concept('antimagic','антимагическому')|E] '[Concept('antimagic_orders','ордену')|E] Горящей Звезды' в 12 лет после того, как его родная деревня была уничтожена [Concept('liches','личом')|E]. К 19 годам он был посвящён в рыцари, в одиночку удерживая мост против орды нежити с помощью лишь кинжала и бревна, за что получил своё прозвище. Вскоре он стал Великим магистром, а затем был назван наследником угасающего герцога Банересета.\n\n#bold Оставив свой пост, Ожье теперь стоит как феодальный лорд, но, возможно, единственный, кто понимает угрозу с севера. Будет ли Ожье работать под новым королём, чтобы подготовиться к этой угрозе, или ему придётся взять дело в свои руки и воссоединить разбитое королевство?"
 bm_1254_the_broken_crown_rene_de_va_seignon:0 "Рене «Чёрный бастард»"
 bm_1254_the_broken_crown_rene_de_va_seignon_subheading: "$bm_1254_the_dying_world_rene_de_va_seignon_subheading$"
 bm_1254_the_broken_crown_rene_de_va_seignon_desc:0 "Рождённый служанкой при иностранном дворе, Рене был вынужден бороться за своё место в семье и покинул её, чтобы создать свою собственную наёмную компанию за годы до путешествия его отца на север и последующего исчезновения.\n\nТеперь его отец пропал, а братья сражаются за добычу. После того, как он едва спасся со своими людьми из Элизийского перевала, заслужив салют от самого «Сокрушителя Ведьм».\n\n#bold Рене и его компания теперь высадились на юге Шевалье. Сможете ли вы подняться до уровня и доказать, что, несмотря на своё происхождение, вы — истинный сын своего отца?"

 bm_1254_wraith_of_the_north:0 "Гнев Севера"
 bm_1254_wraith_of_the_north_desc:0 "Слишком долго изнеженные южане топтали континент под своим каблуком в своих ничтожных попытках империализма и господства! Слишком долго их магия развращала землю, отравляла воды и творила ужасы над людьми!\n\nНароды севера восстают, великой волной разрывая ткань старого мира! По всей бывшей Аверсарии северяне изливаются великим потоком. Это эпоха героев и легенд, время, когда любой человек, храбрый сердцем и умелый с мечом, может увековечить себя и свою династию в сагах навсегда!"

 bm_1254_wraith_of_the_north_berserker:0 "Сигрун «Топор в Руке»"
 bm_1254_wraith_of_the_north_berserker_subheading: "Kralca of Zacope"
 bm_1254_wraith_of_the_north_berserker_desc:0 "Разве не в традициях сьяволки сражаться рядом со своими братьями и сёстрами по щиту, с оружием в руках? Омываться кровью врагов, издавать великий рёв, сотрясающий мир, и бросаться в гущу тех, кого вы хотите убить? Если это действительно то, что делает сьяволки сьяволками, то Сигрун, возможно, ближе к своим корням, чем любой другой из живущих детей севера.\n\nВысадившись в [Concept('aversaria','Аверсарии')|E], Сигрун нашла великую радость в том, чтобы разбивать головы слабых и женоподобных [Concept('aversaria','аверсарианцев')|E] друг о друга. Но сможет ли она утвердить себя как нечто большее, чем просто великий воин?\n\n#bold Окружённая [Concept('aversaria','аверсарианцами')|E] и с малым временем до прибытия Ценвара, Сигрун должна действовать быстро, чтобы действительно увековечить своё имя в сагах своего народа!"
 bm_1254_wraith_of_the_north_cormag:0 "Кормаг Фенрус «Старый Пёс»"
 bm_1254_wraith_of_the_north_cormag_subheading: "Kral of the Fenvir Clanrech"
 bm_1254_wraith_of_the_north_cormag_desc:0 "Когда Ценвар объединил cьяволки, Кормаг назвал его дураком. Когда он объединился с десятками других бегущих культур севера, Кормаг назвал его безумцем. Когда Ценвар объявил о своём намерении поселиться на костях [Concept('aversaria','Аверсарии')|E] и начать новый путь, Кормаг назвал его многими другими словами, взял корабль и отплыл на восток. Там, в Асиуполь, разрушенной столице [Concept('aversaria','Аверсарии')|E], он укоренился со своим кланом. Фенвиры не будет сидеть сложа руки и слабеть в домах [Concept('aversaria','аверсарианцев')|E], они разрушат старое и создадут великое новое царство!\n\n#bold Отделившись от Ценвара, Кормаг должен сам выковать судьбу своего народа. Но враги со всех сторон, и они набирают силу. Сможете ли вы создать место для своего клана? Или вы докажете правоту Ценвара, погибнув?"
 bm_1254_wraith_of_the_north_partic:0 "Эогар-Аргайд"
 bm_1254_wraith_of_the_north_partic_subheading: "Boar King of Calagonii"
 bm_1254_wraith_of_the_north_partic_desc:0 "Каждый хороший вождь без вопросов следует словам провидцев и друидов, но не зашли ли они слишком далеко? Их союзники в Марках преданы, клан отрезан от Импереха, в котором они нашли силу, и с врагами со всех сторон на земле, где магия его народа, кажется, была у них отнята, Эогар-Аргайд может только гадать, какое безумие ждёт его дальше.\n\n#bold Провидцы мудры и правдивы, но не завели ли они вас слишком далеко? Будете ли вы следовать Пути ради высшего блага, или положите конец традициям и найдёте свой собственный путь?"
 bm_1254_wraith_of_the_north_southsjalvolki:0 "Драгос «Говорящий со Змеями»"
 bm_1254_wraith_of_the_north_southsjalvolki_subheading: "Kral of Sanctum"
 bm_1254_wraith_of_the_north_southsjalvolki_desc:0 "Драгос «Говорящий со Змеями» всегда считался странным, особенно когда его клан обнаружил, что у него есть дар магии. Ещё больше, когда они узнали, что его дар проявляется в таланте к эфиру. О нем ходили слухи, что он общался со змеями, пировал на костях, разговаривал с тенями. Несмотря на это, ничто не могло остановить его стремительный взлёт к вершине, особенно трагически погибший Картиг, который привёл клан в южную [Concept('aversaria','Аверсарию')|E]...\n\n#bold [Concept('mixed_magi','Маг смешения'|)E] и смелый интриган, Драгос владеет могущественным царством, разделённым в верности. [Concept('aversaria','Аверсарианцы')|E] хотят, чтобы вы исчезли, а ваш собственный народ нервно шепчется о ваших намерениях. Сможете ли вы победить своих врагов внутри и снаружи и утвердить себя как величайшего правителя?"
 bm_1254_wraith_of_the_north_ulfirx:0 "Ульфиркс «Бешеный Пёс»"
 bm_1254_wraith_of_the_north_ulfirx_subheading: "Grave of Akóhapiíthia"
 bm_1254_wraith_of_the_north_ulfirx_desc:0 "Сын одного из самых могущественных вождей Импереха, Ульфиркс с юных лет знал, что, если захочет, сможет сидеть сложа руки и наслаждаться жизнью в роскоши. Но что делает настоящего сьволки, если не зов приключений? Поэтому одним солнечным утром, страдая от похмелья и заключив накануне весьма неудачный договор, Ульфиркс и его ближайшие соратники украли небольшой флот кораблей и высадились в [Concept('aversaria','Аверсарии')|E]. Удача привела к тому, что он уничтожил целую армию, даже не размахивая топором, но теперь он стоит один, окружённый змеями.\n\n#bold Ульфиркс столкнулся с великой удачей при высадке, но удача не приведёт его к истинной победе. Сможете ли вы создать великое царство на островах до прибытия Ценвара и увековечить своё имя в истории?"

 bm_1254_wraith_of_the_north_new_migrant: "A Migrant Band"
 bm_1254_wraith_of_the_north_new_migrant_subheading: "Imperrech Refugees"
 bm_1254_wraith_of_the_north_new_migrant_desc: "The Imperrech pours south in a great tide. Cenware Witch-Breaker leads hundreds of clans in a grand undertaking to migrate their societies southwards into the husk of Aversaria to create a new life.\n\nYou are one of countless clans who have answered the call for either new land, or glory.\n\n#bold The Imperrech offers a new life, but it is temporary. Will you find your place in this new world?"

 bm_1254_the_saints_war:0 "Война Святых"
 bm_1254_the_saints_war_desc:0 "Тысяча лет войны между ритуалистами и варденитами почти уничтожила мир, но вместо этого уничтожила только Саррадон. Вскоре после этого пришли захватчики. Аверсарианцы, агионисты, марчеры. Обещая дары, торговлю, припасы, помощь беженцам и угнетённым. Вместо этого они брали и пожирали, похищая землю и уничтожая её народ. Теперь началась контратака, Хартах ибн Саррадон объявил себя «Отцом Саррадона» и заявил, что любой захватчик, всё ещё находящийся на саррадонской земле, когда он их найдёт, будет изгнан силой."

 bm_1254_the_saints_war_harthah:0 "Хартах ибн Саррадон"
 bm_1254_the_saints_war_harthah_subheading: "$bm_1254_the_dying_world_harthah_subheading$"
 bm_1254_the_saints_war_harthah_desc: "$bm_1254_the_dying_world_harthah_desc$"

 bm_1254_the_saints_war_heraklios:0 "Гераклиос «Король Морей»"
 bm_1254_the_saints_war_heraklios_subheading: "Master of the Brothers of Heraklios"
 bm_1254_the_saints_war_heraklios_desc:0 "Деньги, богатство, власть! Ни один человек не может иметь всё, кроме «Короля Морей»! Гераклиос, возможно, родился принцем, а может, и нищим, но с желанием и волей стать самым богатым человеком в памяти за счёт добычи других, разве важно, насколько богатой была его колыбель? Гераклиос сталкивается только с одной проблемой — его флот кораблей был получен только благодаря обещанию земли знати, как только он вернёт своё право на рождение как Автократ [Concept('aversaria','Аверсарии')|E]...  сомнительно обоснованное утверждение...\n\n#bold Гераклиос хочет быть королём пиратов, его люди хотят, чтобы он даровал им земли в [Concept('aversaria','Аверсарии')|E]. Выберете ли вы один путь или другой, или Гераклиос поступит, как всегда, и пойдёт на всё, чтобы получить и то, и другое?"
 bm_1254_the_saints_war_mamur:0 "Мамур Адабин"
 bm_1254_the_saints_war_mamur_subheading: "Mamur of the Mamuramat"
 bm_1254_the_saints_war_mamur_desc:0 "Это время войны, но Мамур — человек осторожности. Лидер крупнейшей веры в [Concept('sarradon','Саррадоне')|E], любой шаг может оказаться катастрофическим для его народа, поэтому, пока другие требуют войны, Адабин призывает к миру. Хартах, заблуждаясь, уже расколол веру надвое. Следующие несколько шагов, знает Адабин, решат, упадут ли [Concept('wardenism','вардениты')|E] со своего великого пьедестала или построят прекрасную новую эру по всему [Concept('sarradon','Саррадону')|E].\n\n#bold Мамур могущественен, но схизматики и иностранные еретики угрожают [Concept('wardenism','варденитам')|E]. Пришло ли время для атаки? Или история просто пройдёт мимо Адабина?"
 bm_1254_the_saints_war_ritualist:0 "Исафа из Месинпаши"
 bm_1254_the_saints_war_ritualist_subheading: "Eakhmah of Burj Maqniyya"
 bm_1254_the_saints_war_ritualist_desc:0 "Ритуалисты [GetBuilding('01_sophocos').GetName] находятся на перепутье, и, как последний известный правитель-ритуалист в [Concept('sarradon','Саррадоне')|E], кажется, это дорога для Исафы. Вынужденная стать вассалом религиозного лидера [Concept('wardenism','варденитов')|E], почти 2000 лет ритуалистской традиции, кажется, сталкиваются с уничтожением.\n\n#bold Исафа одна в мире, с величайшим соперником её народа, господствующим над ней. Вернёт ли она [Concept('sarradon','Саррадоне')|E] его законным жителям, или станет сноской как последняя из Софоцистов?"

 bm_1254_the_fall_of_aversaria:0 "Наследие Элизии"
 bm_1254_the_fall_of_aversaria_desc:0 "Аверсария горит! Фродброкна вбила последние гвозди в её гроб, но, кажется, различные претенденты и военачальники некогда великой Автократии решили поиграть с её трупом, пока от неё не останется ничего, кроме пыли. Военачальники всех мастей и цветов сражаются или ведут войны настолько старые, что никто не может вспомнить, почему они начались, в то время как угроза сьяволки становится всё мрачнее на горизонте. После битвы при Элизийском перевале, уничтожившей последние легионы родины, кажется, что вопрос только в том, когда аверсарианцы будут стёрты из истории."

 bm_1254_the_fall_of_aversaria_aeschraes:0 "Автократ Эшрей «Повелитель Пепла»"
 bm_1254_the_fall_of_aversaria_aeschraes_subheading: "Aautokratir of Oraispol Aautokrata"
 bm_1254_the_fall_of_aversaria_aeschraes_desc:0 "Что можно сказать об Эшрее, тому, кто положил конец миру? Как можно описать жизнь самого влиятельного человека во всей известной истории? Начать ли с того, как он, будучи ребёнком, убил собственного отца и разрушил свой родной дом, чтобы отомстить за убийство сестры? С того, когда он стал вторым величайшим учеником в истории [Concept('mayikrata','Майикратии')|E]? С [Concept('imperial_civil_war','гражданской войны')|E]? С резни в Браурири? С Дела Легиона? С [Concept('frodbrokna','Фродброкны')|E], когда он положил конец миру? Или, с того, что казалось бы, в конце его правления, его последователи давно покинули его, и он окружён только врагами?\n\n#bold Эшрей один, загнан в угол, без поддержки. Всё ещё претендуя на титул, который он считает своим правом, Эшрей ничего не имеет, кроме своей магии, чтобы бороться против, казалось бы, неизбежного. Доведёте ли вы его до законного трона? Или судьба последнего Автократа предрешена?"

 bm_1254_the_fall_of_aversaria_cois:0 "Коис «Избранник Чистейшего»"
 bm_1254_the_fall_of_aversaria_cois_subheading: "Aautokratir of Palitake"
 bm_1254_the_fall_of_aversaria_cois_desc:0 "Мальчик-крестьянин, рождённый в нищете, брошенный на улицы Ораисполь, чтобы просить милостыню и воровать, как один из тысяч безымянных бедняков. Так было до тех пор, пока его не объявили избранным, истинным воплощением Чистейшего, законным правителем [Concept('aversaria','Аверсарии')|E]. Однако, несмотря на это, не секрет, что его провозглашение спасителем родины было не более чем политическим ходом Ресуса и его духовенства. Хотя Коис может править, он делает это из позолоченной клетки.\n\n#bold Коис может быть королём, но с Ресусом, дергающим за ниточки, и сьяволки на пороге, действительно ли он правит? Освободите ли вы Коиса от его цепей, чтобы доказать, что он больше, чем избалованный крестьянин, или вы станете ещё одним шагом сьяволки к победе?"

 bm_1254_the_fall_of_aversaria_gorassos:0 "Горасс «Собиратель Черепов»"
 bm_1254_the_fall_of_aversaria_gorassos_subheading: "Aautokratir of the Bloodied Throne"
 bm_1254_the_fall_of_aversaria_gorassos_desc:0 "«Мясник Браурири», «Пёс Эшрея», «Кровавый Кулак», «Красный Гигант», «Горе Атовида», «Собиратель Черепов». У Горасса было много имён, и он заслужил каждое из них. Омытый кровью с юности до зрелости, Горасс не может найти радости ни в чём, кроме криков своих жертв. Теперь он правит одним из крупнейших остатков [Concept('aversaria','Аверсарии')|E].\n\n#bold Горасс — один из самых страшных воинов своего времени, но он не государственный деятель. Будете ли вы помнимы только кровью и скорбью, или Горасс станет первым в великой династии, пережившей волну истории?"

 bm_1254_the_fall_of_aversaria_governor:0 "Губернатор Иорданес"
 bm_1254_the_fall_of_aversaria_governor_subheading: "Governor of Opakhasia"
 bm_1254_the_fall_of_aversaria_governor_desc:0 "Опахасия имеет уникальное отличие — самую длинную непрерывную линию губернаторов из одной династии по сравнению с любым другим регионом [Concept('aversaria','Аверсарии')|E]. Правившая почти 200 лет, семья Адиакас была гордой династинй, которая всегда служила с отличием, превосходя своих соратников.\n\nТеперь, однако, мир заканчивается. Не только [Concept('aversaria','Аверсарии')|E], но и сам [Concept('aeras','Аэрас')|E], и Иорданес Адиакас знает, что он единственный, кто может принести хоть какую-то надежду своему народу.\n\n#bold Губернатор Иорданес смотрит на историю [Concept('aversaria','Аверсарии')|E] с стыдом. Он знает, что возмездие от сьяволки справедливо и прибудет без милосердия. Но, возможно, именно он станет тем [Concept('aversaria','аверсарианцем')|E], который принесёт мир с захватчиками, а не новую войну."

 bm_1254_the_fall_of_aversaria_hecaeda:0 "Леган Гекаэда"
 bm_1254_the_fall_of_aversaria_hecaeda_subheading: "$bm_1254_the_dying_world_hecaeda_subheading$"
 bm_1254_the_fall_of_aversaria_hecaeda_desc: "$bm_1254_the_dying_world_hecaeda_desc$"

 bm_1254_the_fall_of_aversaria_iyrossi:0 "Сиррас «Отступник»"
 bm_1254_the_fall_of_aversaria_iyrossi_subheading: "Master of the Vengeance Seekers"
 bm_1254_the_fall_of_aversaria_iyrossi_desc:0 "Рождённый в горах, где семья Сирраса скрывалась от [Concept('aversaria','аверсарианцев')|E], зная, что последние потомки Последнего Ийросси будут убиты, если [Concept('aversaria','аверсарианцы')|E] когда-либо узнают. Он никогда не встречал их, ибо [Concept('aversaria','аверсарианцы')|E] наконец нашли и убили его родню в первых волнах восстания ийросси. Выросший сиротой в легионах [Concept('aversaria','Аверсарии')|E], не зная своего происхождения, Сиррас был образцовым боевым магом до того дня, когда узнал о своём наследии.\n\n#bold Дезертир в бегах, Сиррас наконец сделал остановился в горах близ своего дома. Сможете ли вы исполнить свою судьбу, отомстить за своих предков и вернуть Ийрийскую долину её законным жителям?"

 bm_1298_a_new_world:0 "Новый Мир"
 bm_1298_a_new_world_desc:0 "----"

 bm_1298_a_new_world_teryn: "$bm_1298_clash_in_the_marches_teryn$"
 bm_1298_a_new_world_teryn_subheading: "$bm_1298_clash_in_the_marches_teryn_subheading$"
 bm_1298_a_new_world_teryn_desc: "$bm_1298_clash_in_the_marches_teryn_desc$"

 bm_1298_a_new_world_undying_angel: "'The Undying Sword of the Angels'"
 bm_1298_a_new_world_undying_angel_subheading: "Undying Army"
 bm_1298_a_new_world_undying_angel_desc: "Placeholder"

 bm_1298_a_new_world_otached: "Otached"
 bm_1298_a_new_world_otached_subheading: "Otached's Host"
 bm_1298_a_new_world_otached_desc: "Placeholder"

 bm_1298_legacy_of_the_witchbreaker: "Legacy of the Witch-Breaker"
 bm_1298_legacy_of_the_witchbreaker_desc: "High King Cenware is dead. The world built by Witch-Breaker upon the ashes of Aversaria struggles to walk alone, and the successors to the Imperrech's legacy have been thrust into the shadows of their forebears."

 bm_1298_trouble_in_the_east: "Trouble in the East"
 bm_1298_trouble_in_the_east_desc: "Peace hangs by a thread in the East. The fog has stretched its tendrils beyond the Kharadan Mountains into kashirya, and with it, a horde of ethereal 'spirits' led by an apparition claiming to be Otached himself seeks to conquer all the lands between the Kasiryat River and Rovarska. In the Nattanan Highlands, a powerful necromancer seeks to unleash death on the living. And far to the south, Rovarskan pirates struggle for supremacy over the Strait of Knives to decide once and for all who rules the seas."

 bm_1298_trouble_in_the_east_siciid: "Siciid Tyvetal"
 bm_1298_trouble_in_the_east_siciid_subheading: "Khathpatti of Wellatola"
 bm_1298_trouble_in_the_east_siciid_desc: "Descendant of the once mighty 'Burning Star' Amittiravalli, Siciid's domain has fallen on hard times as more cunning competitors have muscled their way across Rovarska. A coalition of powerful pirates from Ellawala now threaten Wellatola's home island and base of power.\n\n#bold Can you rise from the darkness and cement your rule over the archipelago, or are the Khathpatti of Wellatola doomed to drown in the ocean depths?#!"

 bm_1298_trouble_in_the_east_jassaka: "Jassaka 'the Prophet'"
 bm_1298_trouble_in_the_east_jassaka_subheading: "Sakama of the Virodahova Priesthood"
 bm_1298_trouble_in_the_east_jassaka_desc: "Jassaka's life was forever changed when the [Concept('the_fog','Fog')|E] first touched [kashirya|E]. The years of education in Vidvaookeyatran academies had been for naught, as the gods were either unwilling or actively fueling the ethereal Fog's spread into the lands of the living. It was there on the borders of life and death that Jassaka realized the truth: the gods are not humanity's saviors.\n\nEver since, Jassaka has dedicated his life to spreading this atheistic truth to the people of Kashirya.\n\n#bold  Now in control of the metropolitan capital of Taleshtendar after executing the royal family for refusing to forsake their false idols, can you convince the world to forsake gods altogether?#!"

 bm_1298_trouble_in_the_east_jamugha: "Jamugha"
 bm_1298_trouble_in_the_east_jamugha_subheading: "King of the Sarayeva Kingdom"
 bm_1298_trouble_in_the_east_jamugha_desc: "Jamugha's grandfather brought their people to the [Glossary('Magiyor Plateau','magiyor_encyclopedia_desc')] in hopes of saving them from the shadows spreading on the Kolrgii, yet it has been for naught. The [Concept('the_fog','Fog')|E] has come. After seizing the throne from his unproven brother, Jamugha finds himself between a rock and a hard place."

 bm_1298_trouble_in_the_east_beksultan: "Beksultan 'The Pale Rider'"
 bm_1298_trouble_in_the_east_beksultan_subheading: "King of Sas Nattana"
 bm_1298_trouble_in_the_east_beksultan_desc: "Beksultan was saved from death by his imprisoned master Akkaradhamma. Now he rides as the next incarnation of the Pale Rider, he has been assigned to destroy the worshipers of the Twin Gods and Korlacu, and usher in his master’s return. Even now his disciples have worked to destabilize the region as he seeks to conquer all."

 bm_1298_trouble_in_the_east_paiyi: "Paiyi Xeng"
 bm_1298_trouble_in_the_east_paiyi_subheading: "Commander of the Red Shore Guard"
 bm_1298_trouble_in_the_east_paiyi_desc: "The blood of the Southsea Protectorate flows in Paiyi's veins, though it has brought him little but danger. A descendant of power in the Southsea, he fled its murderous succession intrigues for the isles of Rovarska, trading a court he could not trust for a soldier's wage at the head of the Red Shore Guard.\n\nHis reputation soon outgrew him. Hired to crush a slave uprising on a plantation isle, Paiyi could not stomach the cruelty of his paymasters, and when the fighting ended, it was the slaves who proclaimed him leader.\n\n#bold Now the Southsea Protectorate slides into chaos once more. Will you return from exile to claim your birthright, or carve out a new destiny among the isles of Rovarska?#!"

 bm_1298_trouble_in_the_east_yaoer: "Yao'er Zhongli"
 bm_1298_trouble_in_the_east_yaoer_subheading: "Shen of Susa"
 bm_1298_trouble_in_the_east_yaoer_desc: "Generations ago, the Zhongli arrived on the Southsea's shores as refugees with nothing to their name. Today Yao'er governs Susa as a vassal of the Bronzeport, his family firmly established among the region.\n\nYet the dream that carried his ancestors across the sea remains far from fulfilled. Xin Xue envisions a republic led by its citizens, but for all the Bronzeport's proud republican traditions, true power rests with its merchant princes.\n\n#bold Can you spread Xin Xue throughout Dahangon and reforge the Bronzeport into a republic worthy of its name?#!"

 bm_1298_war_returns_to_heaven: "The War of the Angels"
 bm_1298_war_returns_to_heaven_desc: "Hārthah's empire did not long outlive him. His premature death, brought about by the mysterious magical explosion at Al-Ghazir, shattered the fragile balance he imposed, and the desert nomads, enraged by his broken promise, have led a punitive invasion of the newly formed Wardenite realms.\n\nJust as Ritualist rule was drawing its last breath, El-Qulatha was reduced to ruins, its devastation sending shockwaves through the Wardenite world. Through Aarif's machinations and Obarek's own ambition, the last Mamuramat collapsed into infighting, and as the ibn Sarradon dynasty and Hārthah's generals lost their grip on Kharadamat, a host of minor Ritualist and Wardenite warlords has risen to claim their share. Meanwhile, rumors circulate of ill tidings from the desert's edge.\n\n#bold Will you impose order upon a fractured Sarradon, or be consumed by the struggle for its spoils?#!"

 bm_1298_war_returns_to_heaven_obarek: "Obarek"
 bm_1298_war_returns_to_heaven_obarek_subheading: "Ba'l of Abu Lebdour"
 bm_1298_war_returns_to_heaven_obarek_desc: "Born to obscurity in the foothills of the Tarsanides, Obarek has risen from peasant stock through relentless service in the armies of the [mamuramat|E], attaching himself early to the court faction of Aarif.\n\nIn the chaos following the Northern Incursions, Obarek has gone from factional instrument to central figure in the collapse of the Mamuramat. Moving against the court and seizing the young Mamur, first drawn in by Aarif's machinations and later driven by his own ambition, he cast aside his patrons. After years of siege, Obarek escaped El-Qulatha just before the city was destroyed by means still unknown.\n\n#bold Will you outlast the enemies you have made, or be consumed by the chaos you helped create?#!"

 bm_1298_war_returns_to_heaven_bahir: "Baḥīr ibn Sarradon"
 bm_1298_war_returns_to_heaven_bahir_subheading: "Malayk of Hammuhat"
 bm_1298_war_returns_to_heaven_bahir_desc: "Barely fourteen, Baḥīr rules the largest [Concept('wardenism','Wardenite')|E] realm left standing, though little of that rule is truly his. His aunt, Rab'ā, governs in his name, ever tightening her grip on the throne.\n\nThe once-great Hammuat kingdom has been split in half, the desert warlord Basi having taken key cities along the [Glossary('Sirwali Coast','sirwali_coast_encyclopedia_desc')], isolating his vassal on the Forlorn Coast. In decline since Harthah's death and beset by both internal and external threats, Hammuat seems set upon an inexorable march toward ruin.\n\n#bold Will you reclaim control of the realm, or allow it to slip further from your grasp?#!"

 bm_1298_war_returns_to_heaven_damiane: "Damiane Phryxandros"
 bm_1298_war_returns_to_heaven_damiane_subheading: "Ordermaster of the Order of the Bleeding Martyr"
 bm_1298_war_returns_to_heaven_damiane_desc: "Damiane's house had been relegated to the ranks of the lesser nobility since the end of the 12th century IS, left with little more than a modest estate near An Nizhem. Few looked to her for influence. In the chaos following the disappearance of Anthousa 'Coldwind,' she began by assassinating both the local Commander and Chaptermaster, as well as their entire households, then used the same tactics against her rivals for the title of Ordermaster.\n\nProven as capable as she is ruthless, Damiane has brought a measure of stability to the last Agionist Order in Sarradon, even as refugees pour in its lands and Wardenite power presses ever closer.\n\n#bold Can you hold your hard-won power and shape the fate of the last Agionist realm?#!"

 bm_1298_war_returns_to_heaven_hanna: "Hannāh ibn Sarradon"
 bm_1298_war_returns_to_heaven_hanna_subheading: "Malaykah of Tifrennesh"
 bm_1298_war_returns_to_heaven_hanna_desc: "Hannāh came to power after imprisoning her brother, who proved unequal to the task of rulership. Though some might have believed this would plunge Tifrennesh into the unrest gripping much of [sarradon|E], the granddaughter of Ḥārthah has so far ruled capably.\n\nAfter pushing back the warlord Dhaki on several occasions and quelling the [Concept('ritualism','Ritualist')|E] insurrections spreading into her realm from Ul Bileis, she has turned her focus inward. With new investments underway and several major projects begun, [Glossary('New Yrim','c_new_yrim_desc')] seems poised to enter a period of economic revival.\n\n#bold Will Tifrennesh know lasting prosperity under your rule, or will these early gains prove fleeting?#!"

 bm_1298_war_returns_to_heaven_mesraya: "Mesraya"
 bm_1298_war_returns_to_heaven_mesraya_subheading: "Ixlaniara of Almudir"
 bm_1298_war_returns_to_heaven_mesraya_desc: "Raised far from the desert of her birth, Mesraya has little care for a life of wandering, a sentiment shared by many of her generation. The fertile lands around the [Glossary('Sirwali Coast','sirwali_coast_encyclopedia_desc')] offer stability her people have rarely known, and with Anegmar 'al-Juhraab' growing old, the moment to act may soon pass.\n\nYet among those who followed her father east, some twenty years ago, during the nomad invasions, many still look to the [Glossary('Deep Desert','sarradonian_desert_encyclopedia_desc')] and the customs that sustained their ancestors.\n\n#bold Will you turn your people toward the future you see, or yield to the pull of the desert behind you?#!"

 bm_1298_war_returns_to_heaven_parshad: "Parshad 'the Black'"
 bm_1298_war_returns_to_heaven_parshad_subheading: "Umeir of Al-Hadded"
 bm_1298_war_returns_to_heaven_parshad_desc: "Parshad came of age in the Al-Humr mountains among a persecuted Hukadirite community. When Haradar blade-bands began targeting [Concept('ritualism','Ritualist')|E] minorities across the region, Parshad unleashed his unmatched magical abilities, hunting the bands back, drawing ever more ritualists to him for protection.\n\nAs pressure mounted within the [mamuramat|E], Parshad led his followers in overthrowing the local [Concept('wardenism','Wardenite')|E] ruler and marched on El-Qulatha itself. In the wake of the Sterilization of El-Qulatha, he withdrew to the lands he had seized.\n\n#bold With Wardenite authority shattered and its losses mounting across the region, how far can you press your advantage?#!"


 bm_1298_clash_in_the_marches: "The Sun Never Sets"
 bm_1298_clash_in_the_marches_desc: "Decades of war between the Siblings of Seignon, the burghers and ducs of Gisredde, and the Undead fiends to the North, have grown the Marches wild. Mercenaries and merchants have ventured to far foreign lands in search of great wealths and greater legends to sail back to Chevalie.\n\nForeign cults dedicated to the Life Paths have sprouted far outside the grasp of Raocourt while political transformation at home seek to tighten control over the rights of peasants and cities everywhere.\n\n#bold No central High King has ruled for decades, and the Marches spread to farther corners than most thought existed. Can you build from this turmoil something greater?#!"

 bm_1298_clash_in_the_marches_teryn: "Teryn 'the Black Knight'"
 bm_1298_clash_in_the_marches_teryn_subheading: "King of Rohr"
 bm_1298_clash_in_the_marches_teryn_desc: "Teryn the Daring, Teryn the Bold, Teryn the Black Knight. Believe the stories or not, House Spencer has at once clawed its way to power across most of Chevalie while the Seignon's collapsed in the wake of successive Lich invasions.\n\n#bold Positioned to be both one of the most popular, and cunning, rulers Chevalie has ever seen, will you buy into your own glory, or are you able to go further than any thought possible?#!"

 bm_1298_clash_in_the_marches_cliement: "Cliément"
 bm_1298_clash_in_the_marches_cliement_subheading: "King of Varrdevet"
 bm_1298_clash_in_the_marches_cliement_desc: "There was a time that King Cliément better understood the warmth of family. His brother's joy, his mother's love. Yet now in the twilight of Seignon rule in Chevalie, Cliément feels lost.\n\n#bold The last ruling Seignon, your family once ruled the whole of Chevalie. Can you still claim to be High King?#!"

 bm_1298_clash_in_the_marches_gaultier: "Gaultier"
 bm_1298_clash_in_the_marches_gaultier_subheading: "Duc of Grande Gisredde"
 bm_1298_clash_in_the_marches_gaultier_desc: "Gaultier's family has ruled Grande Gisredde for centuries, yet its hold on power has begun to slide after tumultuous rule of Duc Lean and the wanton violence of the Gisredde Wars.\n\n#bold Now in control of centuries of legacy, can you build Grande Gisredde to greater glory still?#!"

 bm_1298_clash_in_the_marches_baudouin: "Baudouin II 'the Appeaser'"
 bm_1298_clash_in_the_marches_baudouin_subheading: "King of Opakasija"
 bm_1298_clash_in_the_marches_baudouin_desc: "The son of an upstart mercenary turned King, Baoudoin has been given the tall task, since his father's death, of holding together a fractured and tenuous kingdom. Now made worse by a series of massacres committed against innocent Marchers. Surrounded, and even partly settled, by a coterie of barbarians, chiefs, and all sorts of refugee, Opakasija is weak.\n\n#bold Are you capable of leading these lands, or better off as someone's sword?#!"

 bm_1298_clash_in_the_marches_adoyre: "Adoyre 'One-Arm'"
 bm_1298_clash_in_the_marches_adoyre_subheading: "Eerst of Oostkasir Compagnie"
 bm_1298_clash_in_the_marches_adoyre_desc: "Adoyre has led a colorful life. Having left home at a young age, Adoyre was tasked with a trade venture, sponsored by the Bank of Gisredde, to the distant lands of Kashirya. The success of this visit would eventually catapult him southward to the archipelagi of Rovarska where the flow of goods is both more easy and risky to acquire.\n\n#bold While little more than a wholesale debt sponsor, there is endless wealth in these waters, do you have the cunning to take it all?#!"

 bm_1298_legacy_of_the_witchbreaker_radavil: "Radjavil $dynn_Drevnyic$"
 bm_1298_legacy_of_the_witchbreaker_radavil_subheading: "Kral of Orispolj"
 bm_1298_legacy_of_the_witchbreaker_radavil_desc: "Radjavil, Kral of Orispolj, first of his name and eldest son of the Witch-Breaker. Trained from birth to one day sit his father's throne, Radjavil knows the weight of such a legacy more than anyone.\n\n#bold Will you rise to the occasion, or let your self doubt and paranoia crush you beneath them?#!"
 bm_1298_legacy_of_the_witchbreaker_hromihil: "Hromihil $dynn_Drevnyic$"
 bm_1298_legacy_of_the_witchbreaker_hromihil_subheading: "Kral of Zmijval"
 bm_1298_legacy_of_the_witchbreaker_hromihil_desc: "No one had high hopes for Hromihil during his education, least of all his siblings, and now as Kral of a kingdom cut from his father's domain, Hromihil's grasp on power weakens by the day.\n\n#bold Will you cement your reign for decades to come or be crushed by your enemies?#!"
 bm_1298_legacy_of_the_witchbreaker_vezlomir: "Vezlomir $dynn_Drevnyic$"
 bm_1298_legacy_of_the_witchbreaker_vezlomir_subheading: "Kral of Vožvystroj"
 bm_1298_legacy_of_the_witchbreaker_vezlomir_desc: "Vezlomir was perhaps the most affected of his siblings by their fathers death. His once jovial mood turned sour and grouchy. Now as the priests and shamans of his father's court take hold of his, Vezlomir pours his focuses into revelry and arcane secrets.\n\n#bold Will you lead or be led?#!"
 bm_1298_legacy_of_the_witchbreaker_mimir: "Ravngal the Shield-Born"
 bm_1298_legacy_of_the_witchbreaker_mimir_subheading: "Kral of Phaistetus"
 bm_1298_legacy_of_the_witchbreaker_mimir_desc: "A descendant of Cormag, many have often though of Ravngal as the spitting image of his grandfather, and this praise has gotten to his head over the years until the untimely death of his father on the battlefield. Ravngal's rule has done much to resettle the lands of Asiupoli, but change is in the air.\n\n#bold Can you achieve the future your ancestors could not?#!"

 bm_1298_legacy_of_the_witchbreaker_salacad: "$E_ohar$ $dynn_Tauromilai$"
 bm_1298_legacy_of_the_witchbreaker_salacad_subheading: "$king_female_sarminian$ of $k_szamazonas$"
 bm_1298_legacy_of_the_witchbreaker_salacad_desc: "$E_ohar$ sits upon the throne of the largest Sarminian Queendom in centuries, forged through the strife of the [Concept('sjalvolki_migration','Migrations')|E], [Concept('aversaria','Aversarian')|E] blood, and mortal spite. Beyond the realm's borders, martial glory abounds — be it against the Imperial remnants to the north, squabbling over a cask of spilled [Glossary('czumij','GH_CZUMIJ_GLOSS')]; the familiar Ölteni of the steppe; or even the Sjalvolki themselves, swept up in some manner of religious reformation.\n\n#bold With survival no longer at stake, foreign thoughts and strange ideas begin to seep into Sarminian society. What will become of your people in this new age? Will you remain faithful to the $salacad_high_god_name$ — or be drawn into the inevitable Rite Wars?#!"

 bm_1298_legacy_of_the_witchbreaker_unwan: "Unwan 'Ten-Tree'"
 bm_1298_legacy_of_the_witchbreaker_unwan_subheading: "Kral of Megalarina"
 bm_1298_legacy_of_the_witchbreaker_unwan_desc: "Born on the battlefield to lost and forgotten parents, Unwan has only known a life on the march. He would win praise from the Krals thanks to his commanding victories in the wars against Gorassos 'Skull-taker' and be granted land in Opakasija. Now a settled ruler with vassals, taxes, and people that look to his leadership, Unwan struggles to fit into his new role.\n\n#bold Unaccustomed to this sedentary life, will you find new meaning in prosperity or return to old ways?#!"

 bm_1298_what_remains_west: "What Remains West"
 bm_1298_what_remains_west_desc: "The dream of Pejman died with him, and in its wake Amsar has fallen into the longest civil war the region has ever known. Tchouran, the City of the Prophet, now lies in Chevalien hands, administered through the interests of the West Royal Trading Company. With both unified political and religious authority collapsed, Amsar now plays host to self-proclaimed prophets and preachers who proclaim endings and new beginnings to the desperate.\n\nForeign involvement in the conflict is no longer the sole domain of the Marchers. Seeing weakness in a fractured Amsar, kemsari warlords have crossed into the Thyssae borderlands, while Ayyar, under the increasingly audacious leadership of the new Lirēnāra, move ever closer to open intervention.\n\n#bold Can Amsar be reunited, or will its divisions draw ever more powers into a war without end?#!"

 bm_1298_what_remains_west_tebouin: "Tebouin 'The Merchant King'"
 bm_1298_what_remains_west_tebouin_subheading: "High Prince of Nouvon Bassons"
 bm_1298_what_remains_west_tebouin_desc: "Branded the 'Merchant King' by [Concept('marchers','Chevalien')|E] peasants, much to the displeasure of their nobles. None believed that Tebouin would be so successful in [amsar|E], driving the very lucrative marcher entreprise to heights of wealth and prestige few thought possible.\n\nYet Tebouin's ambition is an abyss. Growing far beyond anything the West Royal Trading Company ever intended, his power and influence expanding with every gain, no longer content with the limits first placed upon him.\n\n#bold Will you bring Tebouin's ambitions to fruition, or see him fade into the same obscurity as so many before him?#!"

 bm_1298_what_remains_west_narsing_dev: "Rudrayesh Auzanrai"
 bm_1298_what_remains_west_narsing_dev_subheading: "Lirēnāra of Ayyar"
 bm_1298_what_remains_west_narsing_dev_desc: "Intent on proving himself among the great Lirēnāra of his age, Rudrayesh has shown far less restraint than his grandfather Lirēnāra Gopala. He looks upon the rise of the [Concept('marchers','Marcher')|E] kingdom with unease.\n\nAyyar has already secured a modest foothold in [amsar|E], holding a chain of small islands south of the Laman Islands. Further emboldened by nobles displaced by the collapse of the [Concept('mamuramat','Mamuramat of the Center')|E], Rudrayesh has seized upon the arrival of the Amsari prince Arkad as a convenient pretext.\n\n#bold Will you strengthen Ayyar's position, or plunge it into the unrest that now grips much of Sarradon?#!"

 bm_1298_what_remains_west_ielih: "Ielih"
 bm_1298_what_remains_west_ielih_subheading: "High Chieftess of Darundel" #Thyssae title names need to be changed
 bm_1298_what_remains_west_ielih_desc: "Ielih has withdrawn from the rhythms of court and council, her thoughts fixed on the fate of the prophetess Arisha, whose body she has kept in a state between death and decay.\n\nThough she retains her authority, a ruler so distant from the duties of rule cannot long ignore the needs of the realm. Yet Ielih has drawn a small circle of trusted scholars and devoted servants to her side, determined to restore the prophetess to life through means few would dare even name.\n\n#bold Will you defy custom and faith alike to reclaim what death has taken from you, whatever the cost?#!"

 bm_1298_what_remains_west_arshab: "Arshab Ammonid"
 bm_1298_what_remains_west_arshab_subheading: "Chekebr of Dumbika"
 bm_1298_what_remains_west_arshab_desc: "A descendant of Pejman's eldest son, Arshab has been raised to believe the throne is his by right of blood. He followed his father closely throughout his youth, taking on the claims and expectations placed upon him before his father's death.\n\nAfter the fall of Tchouran to the [Concept('marchers','Marchers')|E], Arshab assembled a coalition of Amsari lords and led them against Tebouin, winning several engagements before being driven back by defeat.\n\n#bold Can you press your claim, or will defeat and division bring your cause to ruin?#!"

 bm_1298_what_remains_west_arderith: "Arderith 'The Mercenary'"
 bm_1298_what_remains_west_arderith_subheading: "Chekebr of Zargar"
 bm_1298_what_remains_west_arderith_desc: "Entering mercenary life as a boy to escape poverty, Arderith spent his youth fighting for various lords in the civil war, rising quickly through the ranks. He took a wife and fathered a daughter, both of whom were later killed by a self-proclaimed prophet and his followers during a bout of unrest.\n\nAfter abandoning his former life, Arderith wandered without purpose until he encountered a Thakedar Frazan preaching to common folk. He has since devoted himself to his newfound faith.\n\n#bold Will you enforce the Frazans' vision of the faith and stability, or will Amsar resist their guiding hand?#!"