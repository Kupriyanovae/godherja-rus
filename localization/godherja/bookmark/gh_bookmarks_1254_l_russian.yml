 bm_1298_a_new_world_undying_angel: "«Бессмертный Меч Ангелов»"
 bm_1298_a_new_world_undying_angel_subheading: "Бессмертное войско"
 bm_1298_a_new_world_undying_angel_desc: "Заглушка"

 bm_1298_a_new_world_otached: "Отачед"
 bm_1298_a_new_world_otached_subheading: "Войско Отачеда"
 bm_1298_a_new_world_otached_desc: "Заглушка"

 bm_1298_legacy_of_the_witchbreaker: "Наследие Сокрушителя Ведьм"
 bm_1298_legacy_of_the_witchbreaker_desc: "Верховный король Ценвар мёртв. Мир, воздвигнутый Сокрушителем Ведьм на руинах Аверсарии, с трудом пытается шагать самостоятельно, а наследники величия Имперреха оказались в тени своих предков."

 bm_1298_trouble_in_the_east: "Тревога на Востоке"
 bm_1298_trouble_in_the_east_desc: "Мир на Востоке висит на нитке. Туман простёр свои щупальца за Хараданские горы в Каширию, а вместе с ним орда бесплотных «духов» под предводительством призрака, именующего себя самим Отачедом, стремится покорить все земли между рекой Каширият и Роварской. В высокогорье Наттанана могущественный некромант стремится обрушить смерть на живых. А далеко на юге роварсканские пираты сражаются за господство над Проливом Ножей, чтобы раз и навсегда решить, кто правит морями."

 bm_1298_trouble_in_the_east_siciid: "Сицид Тиветаль"
 bm_1298_trouble_in_the_east_siciid_subheading: "Хатпатти Веллатолы"
 bm_1298_trouble_in_the_east_siciid_desc: "Потомок некогда могущественной Амиттиравалли «Палящей Звезды», Сицид видел, как его владения переживают нелучшие времена, пока более хитрые конкуренты пробивали себе путь по Роварске. Коалиция могущественных пиратов из Эллавалы теперь угрожает родному острову и оплоту власти Веллатолы.\n\n#bold Сможете ли вы подняться из тьмы и укрепить своё правление над архипелагом, или Хатпатти Веллатолы обречены сгинуть в океанских глубинах?#!"

 bm_1298_trouble_in_the_east_jassaka: "Джассака «Пророк»"
 bm_1298_trouble_in_the_east_jassaka_subheading: "Сакама Жречества Виродаховы"
 bm_1298_trouble_in_the_east_jassaka_desc: "Жизнь Джассаки навсегда изменилась, когда [Concept('the_fog','Туман')|E] впервые коснулся [Concept('kashirya','Каширии')|E]. Годы обучения в видваукеятранских академиях оказались напрасными, ибо боги либо не желали, либо сами подпитывали распространение эфирного Тумана в земли живых. Именно там, на грани жизни и смерти, Джассака осознал истину: боги — не спасители человечества.\n\nС тех пор Джассака посвятил свою жизнь распространению этой атеистической истины среди народа Каширии.\n\n#bold Удерживая под контролем столичный мегаполис Талештендар после казни королевской семьи за отказ отречься от ложных идолов, сможете ли вы убедить мир окончательно отвергнуть богов?"

 bm_1298_trouble_in_the_east_jamugha: "Джамуха"
 bm_1298_trouble_in_the_east_jamugha_subheading: "Король Сараевского королевства"
 bm_1298_trouble_in_the_east_jamugha_desc: "Дед Джамухи привёл их народ на [Glossary('плато Магийор','magiyor_encyclopedia_desc')] в надежде спасти от теней, ползущих по Колргии, но всё было тщетно. [Concept('the_fog','Туман')|E] пришёл. Захватив престол у неопытного брата, Джамуха оказался между молотом и наковальней."

 bm_1298_trouble_in_the_east_beksultan: "Бексултан «Бледный Всадник»"
 bm_1298_trouble_in_the_east_beksultan_subheading: "Король Сас Наттаны"
 bm_1298_trouble_in_the_east_beksultan_desc: "Бексултан был спасён от смерти своим заточённым господином Аккарадхаммой. Ныне он скачет как новое воплощение Бледного Всадника, и ему поручено уничтожить почитателей Богов-Близнецов и Корлаку, приблизив возвращение господина. Ученики Бексултана уже вовсю дестабилизируют регион, пока сам он стремится покорить всё вокруг."

 bm_1298_trouble_in_the_east_paiyi: "Пайи Сэн"
 bm_1298_trouble_in_the_east_paiyi_subheading: "Командующий Стражи Красного Берега"
 bm_1298_trouble_in_the_east_paiyi_desc: "Кровь Протектората Южного Моря течёт в жилах Пайи, хотя это принесло ему лишь опасности. Потомок могущественного рода на Южном море, он бежал от кровавых интриг престолонаследия на острова Роварски, обменяв двор, которому не мог доверять, на жалованье солдата во главе Стражи Красного Берега.\n\nЕго репутация вскоре превзошла его самого. Нанятый для подавления восстания рабов на острове-плантации, Пайи не смог стерпеть жестокости своих нанимателей, и когда бой утих, именно рабы провозгласили его своим лидером.\n\n#bold Ныне Протекторат Южного Моря снова погружается в хаос. Вернётесь ли вы из изгнания, чтобы заявить права на наследие, или выкуете новую судьбу среди островов Роварски?"

 bm_1298_trouble_in_the_east_yaoer: "Яо'эр Чжунли"
 bm_1298_trouble_in_the_east_yaoer_subheading: "Шэнь Сусы"
 bm_1298_trouble_in_the_east_yaoer_desc: "Поколения назад Чжунли прибыли к берегам Южного моря беженцами, у которых не было ничего за душой. Сегодня Яо'эр управляет Сусой в качестве вассала Бронзовой гавани, а его семья прочно обосновалась в регионе.\n\nОднако мечта, приведшая его предков через море, далека от исполнения. Учение Синь Сюэ видит республику, ведомую своими гражданами, но при всех гордых республиканских традициях Бронзовой гавани истинная власть остаётся за её торговыми принцами.\n\n#bold Сможете ли вы распространить Синь Сюэ по всему Дахангону и перековать Бронзовую гавань в республику, достойную своего имени?"

 bm_1298_war_returns_to_heaven: "Война Ангелов"
 bm_1298_war_returns_to_heaven_desc: "Империя Хартаха ненадолго пережила своего создателя. Его преждевременная смерть, вызванная таинственным магическим взрывом в Аль-Газире, разрушила хрупкий баланс, и пустынные кочевники, разъярённые нарушенным обещанием, возглавили карательное вторжение в новообразованные земли варденитов.\n\nКогда владычество ритуалистов уже доживало последние дни, Эль-Кулата превратилась в руины, и её разрушение отзвалось потрясением по всему варденитскому миру. Из-за интриг Аарифа и собственных амбиций Обарека последний Мамурамат развалился в междоусобицах, и пока династия ибн Саррадон и генералы Хартаха теряли власть над Харадаматом, тьма мелких военачальников-ритуалистов и варденитов поднялась за своей долей добычи. Тем временем доходят слухи о дурных вестях с края пустыни.\n\n#bold Наведёте ли вы порядок в расколотом Саррадоне или сгорите в борьбе за его добычу?"

 bm_1298_war_returns_to_heaven_obarek: "Обарек"
 bm_1298_war_returns_to_heaven_obarek_subheading: "Ба'ль Абу-Лебдура"
 bm_1298_war_returns_to_heaven_obarek_desc: "Рождённый в безызвестности в предгорьях Тарсанидов, Обарек поднялся из крестьян благодаря неустанной службе в армиях [Concept('mamuramat','Мамурамата')|E], рано примкнув к придворной фракции Арифа.\n\nВ хаосе после Северных вторжений Обарек прошел путь от пешки фракции до центральной фигуры в падении Мамурамата. Выступив против двора и захватив юного Мамура — сперва вовлечённый интригами Аарифа, а затем ведомый собственными амбициями, — он отбросил своих покровителей. После долгих лет осады Обарек вырвался из Эль-Кулаты незадолго до того, как город был уничтожен неизвестным способом.\n\n#bold Переживёте ли вы созданных вами врагов или сгорите в хаосе, который сами помогли сотворить?"

 bm_1298_war_returns_to_heaven_bahir: "Бахир ибн Саррадон"
 bm_1298_war_returns_to_heaven_bahir_subheading: "Малайк Хаммухата"
 bm_1298_war_returns_to_heaven_bahir_desc: "Едва достигший четырнадцати лет, Бахир правит крупнейшим уцелевшим [Concept('wardenism','варденитским')|E] государством, хотя от самого правления у него мало что есть. Его тётя, Раб'а, управляет от его имени, всё сильнее сжимая хватку на престоле.\n\nНекогда великое королевство Хаммухата оказалось расколото надвое: пустынный военачальник Баси захватил ключевые города вдоль [Glossary('Сирвалийского побережья','sirwali_coast_encyclopedia_desc')], изолировав его вассала на Забытом побережье. Приходя в упадок со смерти Хартаха и терзаемый как внутренними, так и внешними угрозами, Хаммухат, кажется, обречён неумолимо скатываться к гибели.\n\n#bold Вернёте ли вы контроль над державой или позволите ей окончательно выскользнуть из ваших рук?"

 bm_1298_war_returns_to_heaven_damiane: "Дамиана Фриксандрос"
 bm_1298_war_returns_to_heaven_damiane_subheading: "Магистр Ордена Истекающей Кровью Мученицы"
 bm_1298_war_returns_to_heaven_damiane_desc: "Дом Дамианы был низведён до мелкого дворянства ещё в конце XII века И.С., у него осталась лишь скромное поместье неподалёку от Ан-Нижема. Мало кто ждал от неё влияния. В хаосе после исчезновения Антусы «Холодный Ветер» она начала с убийства местного командующего и капитулмейстера вместе со всеми их семьями, а затем применила те же методы против своих соперников в борьбе за титул магистра ордена.\n\nДоказав, что она столь же способна, сколь и безжалостна, Дамиана принесла относительную стабильность в последний агионистский орден Саррадона, пока в его земли стекаются беженцы, а сила варденитов подступает всё ближе.\n\n#bold Сможете ли вы удержать свою выстраданную власть и определить судьбу последнего агионистского владения?"

 bm_1298_war_returns_to_heaven_hanna: "Ханна ибн Саррадон"
 bm_1298_war_returns_to_heaven_hanna_subheading: "Малайка Тифреннеша"
 bm_1298_war_returns_to_heaven_hanna_desc: "Ханна пришла к власти, заточив своего брата, оказавшегося неспособным к правлению. Хотя кто-то мог подумать, что это ввергнет Тифреннеш в смуту, охватившую большую часть [Concept('sarradon','Саррадона')|E], внучка Хартаха до сих пор правила умело.\n\nОтбив несколько нападений военачальника Заки и подавив [Concept('ritualism','ритуалистские')|E] восстания, переплёскивавшиеся в её земли из Уль-Билейса, она обратила взор внутрь государства. С новыми инвестициями и несколькими начатыми крупными проектами [Glossary('Новый Ирим','c_new_yrim_desc')], кажется, готовится вступить в эпоху экономического расцвета.\n\n#bold Узнает ли Тифреннеш прочное процветание под вашим правлением или эти первые успехи окажутся мимолётными?"

 bm_1298_war_returns_to_heaven_mesraya: "Месрая"
 bm_1298_war_returns_to_heaven_mesraya_subheading: "Ихланиара Альмудира"
 bm_1298_war_returns_to_heaven_mesraya_desc: "Выросшая вдали от пустыни своего рождения, Месрая мало заботится о кочевой жизни — чувство, разделяемое многими из её поколения. Плодородные земли вокруг [Glossary('Сирвалийского побережья','sirwali_coast_encyclopedia_desc')] предлагают стабильность, которую её народ ведал редко, и пока Анегмар «Аль-Джухрааб» стареет, момент для действий может вскоре уйти.\n\nОднако среди тех, кто последовал за её отцом на восток двадцать лет назад во время вторжений кочевников, многие всё ещё взирают на [Glossary('Глубокую пустыню','sarradonian_desert_encyclopedia_desc')] и обычаи, питавшие их предков.\n\n#bold Направите ли вы свой народ к будущему, которое видите, или уступите зову оставшейся за спиной пустыни?"

 bm_1298_war_returns_to_heaven_parshad: "Паршад «Чёрный»"
 bm_1298_war_returns_to_heaven_parshad_subheading: "Умеир Аль-Хаддада"
 bm_1298_war_returns_to_heaven_parshad_desc: "Паршад повзрослел в горах Аль-Хумр среди гонимой общины хукадиритов. Когда отряды харадарских мечников начали вырезать [Concept('ritualism','ритуалистские')|E] меньшинства по всему региону, Паршад высвободил свои непревзойдённые магические способности, выслеживая и истребляя эти отряды, привлекая под свою защиту всё больше ритуалистов.\n\nПо мере роста напряжения в [Concept('mamuramat','Мамурамате')|E] Паршад возглавил своих последователей в свержении местного [Concept('wardenism','варденитского')|E] правителя и двинулся на саму Эль-Кулату. После Очищения Эль-Кулаты он отступил на захваченные земли.\n\n#bold Когда власть варденитов сокрушена, а их потери растут по всему региону, как далеко вы сможете продвинуть своё преимущество?"

 bm_1298_clash_in_the_marches: "Солнце никогда не заходит"
 bm_1298_clash_in_the_marches_desc: "Десятилетия войн между братьями Сеньон, бюргерами и дюками Гисредде и некромантскими тварями на севере заставили Марки одичать. Наёмники и купцы отправлялись в далёкие иноземные края в поисках великих богатств и ещё больших легенд, чтобы приплыть обратно в Шевалье.\n\nИноземные культы, посвящённые Жизненным Путям, разрослись далеко за пределами хватки Раокура, в то время как политические преобразования дома стремятся ужесточить контроль над правами крестьян и городов повсюду.\n\n#bold Единый Верховный король не правил уже десятилетиями, а Марки раскинулись дальше, чем многие считали возможным. Сможете ли вы выстроить из этого хаоса нечто более великое?"

 bm_1298_clash_in_the_marches_teryn: "Терин «Чёрный Рыцарь»"
 bm_1298_clash_in_the_marches_teryn_subheading: "Король Рора"
 bm_1298_clash_in_the_marches_teryn_desc: "Терин «Дерзкий», Терин «Смелый», Терин «Чёрный Рыцарь». Верьте историям или нет, дом Спенсер стремительно проложил себе путь к власти почти по всему Шевалье, пока дом Сеньон рушился под ударами непрерывных вторжений личей.\n\n#bold Будучи в положении одновременно одного из самых популярных и самых хитрых правителей, каких знало Шевалье, поверите ли вы в собственную славу или сможете зайти дальше, чем кто-либо считал возможным?"

 bm_1298_clash_in_the_marches_cliement: "Климент"
 bm_1298_clash_in_the_marches_cliement_subheading: "Король Варрдевета"
 bm_1298_clash_in_the_marches_cliement_desc: "Были времена, когда король Климент лучше понимал семейное тепло. Радость брата, любовь матери. Но теперь, на закате правления рода Сеньон в Шевалье, Климент чувствует себя потерянным.\n\n#bold Последний правящий Сеньон, ваша семья когда-то властвовала над всем Шевалье. Сможете ли вы всё ещё предъявить права на титул верховного короля?"

 bm_1298_clash_in_the_marches_gaultier: "Готье"
 bm_1298_clash_in_the_marches_gaultier_subheading: "Дюк Гранд-Гисредде"
 bm_1298_clash_in_the_marches_gaultier_desc: "Семья Готье правила Гранд-Гисредде веками, но её хватка за власть начала слабеть после бурного правления дюка Леана и бессмысленного насилия Гисреддских войн.\n\n#bold Владея наследием столетий, сможете ли вы возвести Гранд-Гисредде к ещё большей славе?"

 bm_1298_clash_in_the_marches_baudouin: "Бодуэн II «Умиротворитель»"
 bm_1298_clash_in_the_marches_baudouin_subheading: "Король Опакасии"
 bm_1298_clash_in_the_marches_baudouin_desc: "Сын выскочки-наёмника, ставшего королём, Бодуэн со смерти отца получил непростую задачу: удержать расколотое и хрупкое королевство. Теперь ситуация ухудшилась из-за серии расправ над невинными марочниками. Окруженная, а отчасти и заселённая кликой варваров, вождей и разного рода беженцев, Опакасия слаба.\n\n#bold Способны ли вы возглавить эти земли или вам лучше служить чьим-то мечом?"

 bm_1298_clash_in_the_marches_adoyre: "Адуару «Однорукий»"
 bm_1298_clash_in_the_marches_adoyre_subheading: "Эрст компании «Оосткасир»"
 bm_1298_clash_in_the_marches_adoyre_desc: "Адуару прожил яркую жизнь. Покинув дом в юности, Адуару получил поручение возглавить торговое предприятие при поддержке Банка Гисредде в далёкие земли Каширии. Успех этого визита в конечном итоге выбросил его на юг к архипелагам Роварски, где поток товаров добывать и проще, и опаснее.\n\n#bold Хотя вы являетесь не более чем оптовым должником-спонсором, в этих водах таятся бесконечные богатства — хватит ли у вас хитрости забрать их все?"

 bm_1298_legacy_of_the_witchbreaker_radavil: "Радявил $dynn_Drevnyic$"
 bm_1298_legacy_of_the_witchbreaker_radavil_subheading: "Краль Орисполя"
 bm_1298_legacy_of_the_witchbreaker_radavil_desc: "Радявил, краль Орисполя, первый своего имени и старший сын «Сокрушителя Ведьм». Обученный с рождения дабы однажды взойти на престол своего отца, Радявил знает тяжесть такого наследия лучше, чем кто-либо иной.\n\n#bold Оправдаете ли вы надежды или позволите неуверенности в себе и паранойе сокрушить вас?"
 bm_1298_legacy_of_the_witchbreaker_hromihil: "Хромихил $dynn_Drevnyic$"
 bm_1298_legacy_of_the_witchbreaker_hromihil_subheading: "Краль Змийваля"
 bm_1298_legacy_of_the_witchbreaker_hromihil_desc: "Никто не возлагал больших надежд на Хромихила во время его обучения, менее всего его братья и сёстры, и теперь, будучи кралем королевства, отрезанного от владений его отца, хватка Хромихила за власть слабеет с каждым днём.\n\n#bold Укрепите ли вы своё правление на десятилетия вперёд или будете сокрушены врагами?"
 bm_1298_legacy_of_the_witchbreaker_vezlomir: "Везломир $dynn_Drevnyic$"
 bm_1298_legacy_of_the_witchbreaker_vezlomir_subheading: "Краль Вожвыстроя"
 bm_1298_legacy_of_the_witchbreaker_vezlomir_desc: "Везломир был, пожалуй, больше всех из братьев и сестёр потрясён смертью отца. Его когда-то весёлый нрав сменился угрюмостью и сварливостью. Теперь, когда жрецы и шаманы двора его отца захватывают его собственный, Везломир уходит с головой в кутежи и тайны магии.\n\n#bold Будете ли вы вести за собой или позволите вести вас?"
 bm_1298_legacy_of_the_witchbreaker_mimir: "Равнгал «Щиторождённый»"
 bm_1298_legacy_of_the_witchbreaker_mimir_subheading: "Краль Фаистетуса"
 bm_1298_legacy_of_the_witchbreaker_mimir_desc: "Потомок Кормага, Равнгал часто считался точной копией своего деда, и эта похвала вскружила ему голову за эти годы до скоропостижной смерти его отца на поле боя. Правление Равнгала сделало многое для заселения земель Асиуполя, но в воздухе витают перемены.\n\n#bold Сможете ли вы достичь будущего, которое не далось вашим предкам?"

 bm_1298_legacy_of_the_witchbreaker_salacad: "$E_ohar$ $dynn_Tauromilai$"
 bm_1298_legacy_of_the_witchbreaker_salacad_subheading: "$king_female_sarminian$ $k_szamazonas$"
 bm_1298_legacy_of_the_witchbreaker_salacad_desc: "$E_ohar$ восседает на престоле крупнейшего сарминианского королевства за последние века, выкованного сквозь бури [Concept('sjalvolki_migration','Переселений')|E], [Concept('aversaria','аверсарианскую')|E] кровь и смертельную злобу. За пределами границ королевства изобилует воинская слава — будь то против имперских осколков на севере, спорящих из-за бочонка пролитого [Glossary('чумия','GH_CZUMIJ_GLOSS')]; знакомых ольтены из степи; или даже самих сьялволков, захваченных каким-то религиозным реформаторством.\n\n#bold Когда выживание больше не стоит на карте, чуждые мысли и странные идеи начинают проникать в сарминианское общество. Что станет с вашим народом в эту новую эру? Останетесь ли вы верны $salacad_high_god_name$ — или будете втянуты в неизбежные Войны Обрядов?"

 bm_1298_legacy_of_the_witchbreaker_unwan: "Унван «Десять Деревьев»"
 bm_1298_legacy_of_the_witchbreaker_unwan_subheading: "Краль Мегаларины"
 bm_1298_legacy_of_the_witchbreaker_unwan_desc: "Рождённый на поле боя у затерянных и забытых родителей, Унван знал только жизнь в походе. Он снискал похвалу от кралей благодаря своим сокрушительным победам в войнах против Горасса «Собирателя Черепов» и получил наделы в Опакасии. Ныне оседлый правитель с вассалами, налогами и народом, взирающим на его лидерство, Унван с трудом приспосабливается к новой роли.\n\n#bold Не привыкший к этой оседлой жизни, найдёте ли вы новый смысл в процветании или вернётесь к старым путям?"

 bm_1298_what_remains_west: "Что остаётся на Западе"
 bm_1298_what_remains_west_desc: "Мечта Пейджмана умерла вместе с ним, и вслед за этим Амсар погрузился в самую долгую гражданскую войну, какую только ведал регион. Чуран, Город Пророка, ныне находится в руках шевальенцев под управлением Западной королевской торговой компании. С распадом как единой политической, так и религиозной власти, Амсар стал пристанищем для самопровозглашённых пророков и проповедников, возвещающих отчаявшимся о концах и новых началах.\n\nИноземное вмешательство в конфликт больше не является исключительной сферой марочников. Видя слабость расколотого Амсара, кемсарские военачальники перешли в тиссайское пограничье, а айяры под всё более дерзким руководством нового Лиренара всё ближе подбираются к открытой интервенции.\n\n#bold Сможет ли Амсар воссоединиться или его расколы втянут ещё больше держав в бесконечную войну?"

 bm_1298_what_remains_west_tebouin: "Тебуин «Король-Купец»"
 bm_1298_what_remains_west_tebouin_subheading: "Верховный принц Нувон-Бассона"
 bm_1298_what_remains_west_tebouin_desc: "Прозванный «Королём-Купцом» [Concept('marchers','шевальенскими')|E] крестьянами, к великому недовольству их знати. Никто не верил, что Тебуин окажется столь успешен в [Concept('amsar','Амсаре')|E], доведя весьма прибыльное марочникское предприятие до высот богатства и престижа, которые мало кто считал возможными.\n\nОднако амбиции Тебуина — это бездна. Разросшись далеко за пределы того, что планировала Западная королевская торговая компания, его власть и влияние расширяются с каждым успехом, и он больше не довольствуется рамками, поставленными изначально.\n\n#bold Воплотите ли вы амбиции Тебуина в жизнь или дадите ему кануть в ту же безызвестность, что и со столькими до него?"

 bm_1298_what_remains_west_narsing_dev: "Рудраеш Аузанрай"
 bm_1298_what_remains_west_narsing_dev_subheading: "Лиренар Айяров"
 bm_1298_what_remains_west_narsing_dev_desc: "Стремясь проявить себя среди великих лиренаров своей эпохи, Рудраеш проявил куда меньше сдержанности, чем его дед — лиренар Гопала. Он со смутной тревогой взирает на возвышение [Concept('marchers','марочникского')|E] королевства.\n\nАйяры уже закрепили за собой скромный плацдарм в [Concept('amsar','Амсаре')|E], удерживая цепочку небольших островов к югу от островов Ламан. Ещё больше ободрённый знатью, изгнанной из-за краха [Concept('mamuramat','Центрального мамурамата')|E], Рудраеш воспользовался прибытием амсарского принца Аркада как удобным предлогом.\n\n#bold Укрепите ли вы позиции айяров или ввергнете их в смуту, охватившую ныне большую часть Саррадона?"

 bm_1298_what_remains_west_ielih: "Иелих"
 bm_1298_what_remains_west_ielih_subheading: "Верховная вождица Дарунделя"
 bm_1298_what_remains_west_ielih_desc: "Иелих отстранилась от ритмов двора и совета, её мысли прикованы к судьбе пророчицы Ариши, чьё тело она удерживает в состоянии между смертью и тлением.\n\nХотя она и сохраняет власть, правительница, столь далекая от обязанностей правления, не может слишком долго игнорировать нужды державы. И всё же Иэлих собрала вокруг себя небольшой круг доверенных учёных и преданных слуг, полная решимости вернуть пророчицу к жизни средствами, о которых немногие осмелились бы даже помыслить.\n\n#bold Пренебрежёте ли вы обычаями и верой, чтобы вернуть то, что отняла смерть, какова бы ни была цена?"

 bm_1298_what_remains_west_arshab: "Аршаб Аммонид"
 bm_1298_what_remains_west_arshab_subheading: "Чекебр Думбики"
 bm_1298_what_remains_west_arshab_desc: "Потомок старшего сына Пейджмана, Аршаб воспитывался в убеждении, что престол принадлежит ему по праву крови. В юности он неотступно следовал за отцом, возложив на себя притязания и ожидания ещё до его смерти.\n\nПосле падения Чурана под ударами [Concept('marchers','марочников')|E] Аршаб собрал коалицию амсарских владык и повёл их против Тебуина, выиграв несколько сражений, прежде чем потерпеть поражение и отступить.\n\n#bold Сможете ли вы предъявить свои притязания или поражение и раздор приведут ваше дело к краху?"

 bm_1298_what_remains_west_arderith: "Ардерит «Наёмник»"
 bm_1298_what_remains_west_arderith_subheading: "Чекебр Заргара"
 bm_1298_what_remains_west_arderith_desc: "Вступив на путь наёмника ещё мальчишкой, чтобы спастись от нищеты, Ардерит провёл юность в сражениях за различных лордов в гражданской войне, быстро поднимаясь по службам. Он взял жену и стал отцом дочери, но обе они позже были убиты самопровозглашённым пророком и его последователями во время вспышки смуты.\n\nОставив прежнюю жизнь, Ардерит бесцельно скитался, пока не встретил такедарского фразана, проповедовавшего простому люду. С тех пор он посвятил себя новообретённой вере.\n\n#bold Претворите ли вы в жизнь видение веры и стабильности фразанов или Амсар воспротивится их направляющей руке?"