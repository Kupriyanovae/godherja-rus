 bm_1254_the_dying_world: "Умирающий мир"
 bm_1254_the_dying_world_desc: "Аверсария переживает свои последние мгновения.\n\nЦенвар «Сокрушитель Ведьм» и его Имперрех — кочевая коалиция сотен племён из десятков культур, созданная с единственной целью: разделить немощную Аверсарианскую Аавтократию — устремились на юг, в остатки павшего государства. Великий союз, стремившийся положить конец притязаниям варваров, сокрушён, а Битва у Элизийского перевала забила последний гвоздь в гроб Империи.\n\nПо всему миру целые народы пребывают в шоке. Военачальники всех мастей пытаются урвать свой кусок от тех немногих безопасных земель, что остались нетронутыми Туманом. В Саррадоне продолжается решающая битва между агионистами и коренными саррадонцами, а в Марках дети пропавшего верховного короля Гардфрея разрывают Шевалье на части в борьбе за расколотую корону."

 bm_1254_the_dying_world_cenware: "Ценвар «Сокрушитель Ведьм»"
 bm_1254_the_dying_world_cenware_subheading: "Верховный король Сьялволькского Имперреха"
 bm_1254_the_dying_world_cenware_desc: "Слава Сокрушителю Ведьм! Первый человек в истории, объединивший кланы сьялволков ещё юношей, первый, кто сожжёг библиотеки [Concept('mayikrata','Майикратии')|E] вскоре после этого, и человек, который вот-вот предаст [Concept('aversaria','аверсарианское')|E] чудовище заслуженной смерти. За спиной Ценвара стоят сотни культур, объединённых единой целью: расселить свой народ на плодородных землях Империи.\n\n#bold Но Имперрех невечен по самой своей сути. Как только Империя сгинет, каждому из кланов Имперреха обещан собственный надел, и бывшие друзья уже начали грызться за крохи. Сможете ли вы объединить народ сьялволков и открыть новую эру для всего мира?"
 bm_1254_the_dying_world_harthah: "Хартах ибн Саррадон"
 bm_1254_the_dying_world_harthah_subheading: "Малайк Хаммухата"
 bm_1254_the_dying_world_harthah_desc: "Ордена агионистов заявляют о своей чистоте и добродетели, но никому лучше Отца [Concept('sarradon','Саррадона')|E] не известно, что всё это ложь. Они — отвратительные нечистые твари, ступившие на путь уничтожения [Concept('sarradon','Саррадона')|E] и без сомнения широко раскрывающие врата перед Пленником в Капюшоне. Он осознал это сполна, когда эти работорговцы увели в рабство его жену. А когда его господин отказал ему в помощи по её освобождению, до него дошло: только он сам может спасти свою землю.\n\n#bold Для Хартаха все жители [Concept('sarradon','Саррадона')|E] — его дети, и его священная миссия состоит в том, чтобы ни один из них больше никогда не боялся «святых» орденов. Сможете ли вы наконец положить конец тысячелетней войне и объединить народ [Concept('sarradon','Саррадона')|E] против захватчиков?"
 bm_1254_the_dying_world_hecaeda: "Леган Гекаеда"
 bm_1254_the_dying_world_hecaeda_subheading: "Леган Легиона LXI «Анотерион»"
 bm_1254_the_dying_world_hecaeda_desc: "Несчётные версты маршировал легион, чтобы вернуться с востока домой — в разоренное государство. И винить в этом мы можем только себя.\n\n[Concept('aversaria','Аверсарианцы')|E] привели к этому; аверсарианцы угнетали, разрушали и сжигали. Легон Валерикс, упокой Чистейший его душу, знал это лучше кого бы то ни было. Он научил меня этому, когда удочерил меня в походе много лет назад, и хотя теперь он мёртв, я доведу его миссию до конца.\n\n#bold Сможете ли вы завершить дело Валерикса, принести Аверсарии новую эру и исправить злодеяния ваших предков? И, что еще более насущно, сможете ли вы найти его убийцу?"
 bm_1254_the_dying_world_nicanoneus: "Никаноней «Чёрное Солнце»"
 bm_1254_the_dying_world_nicanoneus_subheading: "Аавтократ-кивернир, архилегон Эпавариона"
 bm_1254_the_dying_world_nicanoneus_desc: "Для Чёрного Солнца существует лишь война.\n\nВся его жизнь — одно непрерывное сражение, он воевал от своей родины на далёком востоке [Concept('aversaria','имперских')|E] колоний до самих гор Марок. Его дом поглощён [Concept('the_fog','Туманом')|E], последние остатки заселены варварским отребьем, и Никанонею больше нечего терять. А значит, он заберёт всё.\n\n#bold Единственный человек, разгромивший Ценвара в открытом бою, единственный аверсарианец, командующий легионом самих варваров, — вполне естественно, что воины почитают его как божество. Но достаточно ли божественности, чтобы спасти Аверсарию?"
 bm_1254_the_dying_world_rene_de_va_seignon: "Рене «Чёрный Бастард»"
 bm_1254_the_dying_world_rene_de_va_seignon_subheading: "Командующий Братством бастардов"
 bm_1254_the_dying_world_rene_de_va_seignon_desc: "Рождённый служанкой при чужеземном дворе, Рене был вынужден боем выбивать своё место в семье и ушёл, чтобы создать собственную наёмную роту за годы до того, как его отец отправился на север и сгинул.\n\nТеперь отца нет, а его братья принялись делить добычу. Чудом вырвавшись со своими людьми из битвы у Элизийского перевала — и заслужив салют от самого Сокрушителя Ведьм —\n\n#bold Рене и его рота высадились на юге Шевалье. Оправдаете ли вы надежды и докажете ли, что независимо от происхождения именно вы — истинный сын своего отца?"

 bm_1254_the_broken_crown: "Расколотая корона"
 bm_1254_the_broken_crown_desc: "Верховный король Гардфрей ден ва Сеньон, возможно, когда-то и был хорошим монархом — смотря кого спросить, — но одержимость тайной миссией поглотила его, и к концу правления Верховным королевством правил отсутствующий владыка. Когда различные претенденты на престол собрались на Совете в Грапанне в 1251 году, он во всеуслышание расколол свою корону и бросил её претендентам, заявив, что любой, кто соберет осколки, может править, ибо его больше не волнуют подобные «мелкие заботы». Теперь верховный король ушел на север со своими самыми доверенными соратниками, и Верховное королевство истекает кровью."

 bm_1254_the_broken_crown_ansfrei: "Ансфрей ден ва Сеньон"
 bm_1254_the_broken_crown_ansfrei_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_1254_the_broken_crown_ansfrei_desc: "Учёный брат, Ансфрей рос, не желая иметь ничего общего с престолом и мечтая о жизни среди ученых и мыслителей. Однако теперь его отец пропал, а родина пылает. Ансфрей может и не быть великим воином, и у него нет большинства черт, считающихся королевскими в Шевалье, но он верит, что только он способен спасти страну.\n\n#bold Ансфрей — мыслитель, а не воин, но, возможно, именно великий ум нужен Шевалье для спасения. Докажете ли вы своим братьям, что именно слова, а не мечи, спасут эту землю?"
 bm_1254_the_broken_crown_benouet_de_va_seignon: "Бенуэ ден ва Сеньон"
 bm_1254_the_broken_crown_benouet_de_va_seignon_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_1254_the_broken_crown_benouet_de_va_seignon_desc: "Бенуэ был первенцем верховного короля Гардфрея и, следовательно, законным наследником его титула. Однако, хотя законный наследник родился крепышом, природа обделила его умом. Признанный многими недееспособным, Бенуэ в большинство дней с трудом может даже одеться сам, и многочисленные претенденты на престол неоднократно указывали на это.\n\n#bold Несмотря на свою недужность, Бенуэ окружен сонмом верных советников, помогающих законному наследнику (и, без сомнения, извлекающих свою выгоду), и удерживает столицу Верховного королевства и его богатейшие провинции. Сможете ли вы собрать осколки расколотой короны вопреки противодействию?"
 bm_1254_the_broken_crown_cliement: "Климент ден ва Сеньон"
 bm_1254_the_broken_crown_cliement_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_1254_the_broken_crown_cliement_desc: "Младший из братьев ден ва Сеньон, Климент был тайно вывезен из столицы своей матерью вскоре после исчезновения отца, опасавшейся за его безопасность.\n\nТеперь она правит в качестве его регента, но по мере того как она всё глубже увязает в объятиях наёмника Энгельмара ден ва Спенсера, многие задаются вопросом, не попал ли молодой король в куда большую опасность...\n\n#bold Будучи ещё ребёнком, никто не знает, каким человеком станет Климент. Станете ли вы добрым королем или мелким деспотом? Одолеете ли вы своих братьев? И переживёте ли придворные интриги?"
 bm_1254_the_broken_crown_magi: "Аммарт «Косноязычный»"
 bm_1254_the_broken_crown_magi_subheading: "Дюк Каллеска"
 bm_1254_the_broken_crown_magi_desc: "Говорят, Аммарт был проклят с рождения. Он не только родился шепелявым и хромым, не только потерял родителей в море до своего первого лета, и не только вскоре лишился наследства из-за провала торговых предприятий дяди — Аммарт родился [Concept('magi','магом')|E] в обществе, которое презирало его за это.\n\nНо у Аммарта есть план, и Аммарт знает истинный путь. Марки умирают, и именно магия должна спасти их. Выросший и всего добившийся сам, Аммарт найдет то, что похитило дар магии у Шевалье, и уничтожит это.\n\n#bold Аммарт слаб здоровьем и не обладает большой властью, но у него грандиозные замыслы, превосходящие его средства. Завершите ли вы его поиски по возвращению магии на север? И сможете справиться с последствиями?"
 bm_1254_the_broken_crown_mathilde: "Матильда"
 bm_1254_the_broken_crown_mathilde_subheading: "Дюкесса Бассонса"
 bm_1254_the_broken_crown_mathilde_desc: "Крестьянка от рождения, Матильда выгрызла себе путь к вершинам, о которых другие женщины её положения не смели и помыслить. Проделав путь от нищеты до тайного советника верховного короля, Матильда всегда отличалась ясными амбициями. Со смертью верховного короля Гардфрея Матильда видит возможности там, где другие видят катастрофу.\n\n#bold Те немногие, кто знает Матильду, знают, что её стоит бояться, но никто не ожидает, что она действительно взойдёт на место, к которому стремится. Докажете ли вы их правоту или провозгласите себя первой верховной королевой за многие поколения?"
 bm_1254_the_broken_crown_ogiers: "Ожье «Огр»"
 bm_1254_the_broken_crown_ogiers_subheading: "Дюк Банерезета"
 bm_1254_the_broken_crown_ogiers_desc: "Ожье «Огра» многие называют квинтэссенцией [Concept('antimagi','антимага')|E], а ещё больше людей — живым народным героем. Рождённый в небольшой деревне в Лавьеке в семье мелкого дворянина, всего на поколение отстоявшей от крестьянства, он вступил в [antimagic|E] «[Concept('antimagic_orders','Орден')|E] Горящей Звезды» в 12 лет после того, как его родная деревня была уничтожена в набеге [Concept('liches','личей')|E]. К 19 годам он был посвящён в рыцари, в одиночку удерживая мост против орды нежити с одним лишь кинжалом и бревном, что и принесло ему прозвище. Вскоре после этого он стал великим магистром, а затем был назван наследником немощного герцога Банерезе.\n\n#bold Оставив свой пост, Ожье теперь выступает в роли феодала, но, возможно, он единственный, кто понимает угрозу с севера. Будет ли Ожье служить новому королю, чтобы подготовиться к этой угрозе, или же будет вынужден взять дело в свои руки и вновь объединить расколотое королевство?"
 bm_1254_the_broken_crown_rene_de_va_seignon: "Рене «Чёрный Бастард»"
 bm_1254_the_broken_crown_rene_de_va_seignon_subheading: "$bm_1254_the_dying_world_rene_de_va_seignon_subheading$"
 bm_1254_the_broken_crown_rene_de_va_seignon_desc: "$bm_1254_the_dying_world_rene_de_va_seignon_desc$"

 bm_1254_wraith_of_the_north: "Ярость Севера"
 bm_1254_wraith_of_the_north_desc: "Слишком долго изнеженные южане топтали континент своими сапогами в их мелочных попытках империализма и господства! Слишком долго их магия оскверняла землю, отравляла воды и творила ужасы над человечеством!\n\nНарод севера поднимается великой волной, чтобы разорвать ткань старого мира! По всей территории бывшей Аверсарии северяне хлынули могучим потоком. Это эра героев и легенд, время, когда любой человек с храбрым сердцем и умелым клинком может навсегда увековечить себя и свою династию в сагах!"

 bm_1254_wraith_of_the_north_berserker: "Сигрун «Топор-в-Руке»"
 bm_1254_wraith_of_the_north_berserker_subheading: "Кральца Закопе"
 bm_1254_wraith_of_the_north_berserker_desc: "Разве не в укладе сьялволков сражаться плечом к плечу со своими братьями и сёстрами по щиту с оружием в руках? Купаться в крови врагов, издавать великий рык, сотрясающий мир, и с головой бросаться в гущу тех, кого жаждешь убить? Если именно это делает сьялволка сьялволком, то Сигрун верна своим корням больше, чем любое ныне живущее дитя севера.\n\nВысадившись в [Concept('aversaria','Аверсарии')|E], Сигрун нашла великую радость в том, чтобы разбивать головы слабых и похожих на женщин аверсарианцев друг о друга. Но сможет ли она утвердиться как нечто большее, чем просто великая воительница?\n\n#bold Окруженная аверсарианцами и имея совсем немного времени до прибытия Ценвара, Сигрун должна действовать быстро, чтобы навсегда вписать своё имя в саги своего народа!"
 bm_1254_wraith_of_the_north_cormag: "Кормаг Фенрус «Старый Пёс»"
 bm_1254_wraith_of_the_north_cormag_subheading: "Краль Кланреха Фенвиров"
 bm_1254_wraith_of_the_north_cormag_desc: "Когда Ценвар объединил сьялволков, Кормаг назвал его глупцом. Когда он объединился с десятками других бегущих культур севера, Кормаг назвал его безумцем. Когда Ценвар объявил о намерении обосноваться на костях [Concept('aversaria','Аверсарии')|E] и начать новый путь, Кормаг осыпал его ругательствами, сел на корабль и отплыл на восток. Там, в Асиуполе, разрушенной столице Аверсарии, он основал свой клан. Фенвиры не будут сидеть сложа руки и слабеть в домах аверсарианцев, они сокрушат старое и выкуют великое новое царство!\n\n#bold Отколовшись от Ценвара, Кормаг сам должен выковать судьбу своего народа. Но враги со всех сторон, и они набирают силу. Создадите ли вы собственное место для своего клана? Или докажете правоту Ценвара, сгинув в гибели?"
 bm_1254_wraith_of_the_north_partic: "Эогар-Аргайд"
 bm_1254_wraith_of_the_north_partic_subheading: "Король-Вепрь Калагони"
 bm_1254_wraith_of_the_north_partic_desc: "Каждый добрый вождь беспрекословно следует словам провидцев и друидов, но не зашли ли они слишком далеко? Их союзники в Марках преданы, клан отрезан от Имперреха, в котором находил силу, а вокруг кишат враги на земле, где магия его народа, кажется, была у них отнята... Эогару-Аргайду остается лишь гадать, какое безумие случится дальше.\n\n#bold Провидцы мудры и верны, но не завели ли они вас слишком далеко? Последуете ли вы Пути ради высшего блага или покончите с традициями и найдете свой собственный путь?"
 bm_1254_wraith_of_the_north_southsjalvolki: "Драгос «Говорящий со Змеями»"
 bm_1254_wraith_of_the_north_southsjalvolki_subheading: "Краль Святилища"
 bm_1254_wraith_of_the_north_southsjalvolki_desc: "Драгоса «Говорящего со Змеями» всегда считали чудным, а уж когда его клан обнаружил у него дар магии — тем более. И ещё пуще — когда выяснилось, что его дар проявился в таланте к эфирному искусству. Поползли слухи. Он дружил со змеями, пировал костями, говорил с тенями. Несмотря на это, ничто не могло остановить его стремительный взлёт к вершине, особенно трагически погибший Картиг, приведший клан на юг [Concept('aversaria','Аверсарии')|E]...\n\n#bold [Concept('mixed_magi','Смешанный маг')|E] и дерзкий интриган, Драгос удерживает могущественную державу, расколотую в верности. Аверсарианцы желают вашей смерти, а ваш собственный народ нервно шепчется о ваших намерениях. Сможете ли вы одолеть врагов внутри и снаружи и утвердиться как величайший правитель из всех?"
 bm_1254_wraith_of_the_north_ulfirx: "Ульфиркс «Бешеный Пёс»"
 bm_1254_wraith_of_the_north_ulfirx_subheading: "Граве Акохапитии"
 bm_1254_wraith_of_the_north_ulfirx_desc: "Сын одного из самых могущественных вождей Имперреха, Ульфиркс с юных лет знал: стоит пожелать, и он сможет почивать на лаврах, наслаждаясь лёгкой жизнью и богатством. Но что делает сьялволка истинным сьялволком, если не зов приключений? И вот одним солнечным утром, мучаясь с похмелья и заключив накануне весьма нескладный договор, Ульфиркс и его ближайшие соратники угнали небольшой флот кораблей и высадились в [Concept('aversaria','Аверсарии')|E]. Удача привела к тому, что он уничтожил целую армию, даже не взмахнув топором, но теперь он стоит в одиночестве, окружённый гадюками.\n\n#bold Ульфиркса озарила великая удача при высадке, но удача не приведёт к настоящей победе. Сможете ли вы создать великую державу на Островах до прибытия Ценвара и увековечить своё имя в истории?"
 
 bm_1254_wraith_of_the_north_new_migrant: "Отряд переселенцев"
 bm_1254_wraith_of_the_north_new_migrant_subheading: "Беженцы Имперреха"
 bm_1254_wraith_of_the_north_new_migrant_desc: "Имперрех хлынул на юг великим потоком. Ценвар «Сокрушитель Ведьм» ведет сотни кланов в грандиозном предприятии по переселению их обществ на юг, в остов Аверсарии, чтобы начать новую жизнь.\n\nВы — один из бесчисленных кланов, откликнувшихся на призыв в поисках новых земель или славы.\n\n#bold Имперрех предлагает новую жизнь, но это временно. Найдите ли вы свое место в этом новом мире?"

 bm_1254_the_saints_war: "Война Святых"
 bm_1254_the_saints_war_desc: "Тысячелетняя война между ритуалистами и варденитами едва не погубила мир, уничтожив взамен лишь Саррадон. Вскоре пришли захватчики. Аверсарианцы, агионисты, марочники — все они сулили дары, торговлю, припасы, помощь беженцам и угнетённым. Вместо этого они грабили и пожирали, отнимая землю и вырезая её народ. Ныне началось контрнаступление: Хартах ибн Саррадон провозгласил себя Отцом Саррадона и объявил, что любой захватчик, всё ещё находящийся на саррадонской земле, будет изгнан силой."

 bm_1254_the_saints_war_harthah: "Хартах ибн Саррадон"
 bm_1254_the_saints_war_harthah_subheading: "$bm_1254_the_dying_world_harthah_subheading$"
 bm_1254_the_saints_war_harthah_desc: "$bm_1254_the_dying_world_harthah_desc$"

 bm_1254_the_saints_war_heraklios: "Гераклий «Морской Король»"
 bm_1254_the_saints_war_heraklios_subheading: "Магистр Братьев Гераклия"
 bm_1254_the_saints_war_heraklios_desc: "Деньги, богатства, власть! Никто не может владеть всем этим, никто, кроме короля морей! Гераклий мог родиться принцем, а мог и нищим, но с его рвением и волей стать богатейшим человеком на памяти живущих за счёт чужой добычи — разница ли, насколько пышна была его колыбель? Перед Гераклием стоит лишь одна проблема: его флот был получен только благодаря обещаниям земли знати, когда он вернёт своё право по рождению как Аавтократ [Concept('aversaria','Аверсарии')|E]...весьма сомнительное притязание...\n\n#bold Гераклий хочет стать пиратским королем, его люди хотят, чтобы он даровал им наделы в Аверсарии. Выберете ли вы один путь из двух или Гераклий поступит как всегда — поставит всё на карту и попытается успеть и то, и другое?"

 bm_1254_the_saints_war_mamur: "Мамур Адабин"
 bm_1254_the_saints_war_mamur_subheading: "Мамур Мамурамата"
 bm_1254_the_saints_war_mamur_desc: "Наступило время войн, но Мамур — человек осторожный. Лидер крупнейшей веры в [Concept('sarradon','Саррадоне')|E], любой его шаг может стать катастрофическим для его народа, поэтому, пока другие требуют войны, Адабин призывает к миру. Хартах, сколь бы заблудшим он ни был, уже расколол веру надвое. Следующие несколько шагов, как знает Адабин, решат, падут ли [Concept('wardenism','вардениты')|E] со своего великого пьедестала или же сотворят прекрасную новую эру по всему [Concept('sarradon','Саррадону')|E].\n\n#bold Мамурит могущественен, но и раскольники, и иноземные язычники угрожают [Concept('wardenism','варденитам')|E]. Настало ли время для атаки? Или история просто пройдёт мимо Адабина?"

 bm_1254_the_saints_war_ritualist: "Иса из Мецинпаши"
 bm_1254_the_saints_war_ritualist_subheading: "Эахма Бурдж-Макнийи"
 bm_1254_the_saints_war_ritualist_desc: "Ритуалисты [GetBuilding('01_sophocos').GetName] стоят на перепутье, и как последняя известная правитель-ритуалист в [Concept('sarradon','Саррадоне')|E], Исе предначертано пройти этот путь. Вынужденная подчиниться духовному лидеру [Concept('wardenism','варденитов')|E], она видит, как почти двухтысячелетняя традиция ритуализма оказывается на грани гибели.\n\n#bold Иса одна в этом мире, а величайший соперник её народа властвует над ней. Вернёт ли она [Concept('sarradon','Саррадон')|E] его законным владельцам или останется лишь сноской в истории как последняя из софокистов?"

 bm_1254_the_fall_of_aversaria: "Наследие Элизии"
 bm_1254_the_fall_of_aversaria_desc: "Аверсария пылает! Фродброкна вбила последние гвозди в её гроб, но кажется, что многочисленные претенденты и военачальники некогда великой Аавтократии сочли за благо терзать её труп, пока не останется ничего, кроме праха. Военачальники всех мастей и знамён сражаются или ведут настолько древние войны, что никто уже и не вспомнит их причин, пока сьялволькская угроза висит на горизонте всё темнее. С уничтожением в Битве у Элизийского перевала последних уцелевших легионов родины, кажется, что стирание аверсарианцев из истории — лишь вопрос времени."

 bm_1254_the_fall_of_aversaria_aeschraes: "Аавтократ Эшрей «Владыка Пепла»"
 bm_1254_the_fall_of_aversaria_aeschraes_subheading: "Аавтократ Ораиспольской Аавтократии"
 bm_1254_the_fall_of_aversaria_aeschraes_desc: "Что можно сказать об Эшрее, о том, кто погубил мир? Как подытожить жизнь самого влиятельного человека во всей известной истории? Начать ли с его детства, когда он убил собственного отца и уничтожил родной дом, чтобы отомстить за убитую сестру? С момента, когда он стал вторым величайшим учеником в истории [Concept('mayikrata','Майикратии')|E]? С [Concept('imperial_civil_war','гражданской войны')|E]? С Резни в Браурири? С Дела легионов? С [Concept('frodbrokna','Фродброкны')|E], когда он уничтожил мир? Или с заката его правления, когда последователи давно покинули его, а вокруг не осталось никого, кроме врагов?\n\n#bold Эшрей одинок, загнан в угол, и у него больше нет сторонников. Всё ещё цепляясь за титул, который считает своим по праву, Эшрею нечем сражаться против кажущегося неизбежным, кроме своей магии. Приведёте ли вы его к законному престолу? Или судьба последнего Аавтократа уже предрешена?"

 bm_1254_the_fall_of_aversaria_cois: "Коис «Избранник Чистейшего»"
 bm_1254_the_fall_of_aversaria_cois_subheading: "Аавтократ Палитака"
 bm_1254_the_fall_of_aversaria_cois_desc: "Крестьянский мальчик, рождённый в нищете и выброшенный на улицы Ораисполя попрошайничать и воровать, один из тысяч безликих бедняков. Так было до тех пор, пока его не провозгласили избранным, истинным перерождением Чистейшего, законным правителем [Concept('aversaria','Аверсарии')|E]. Однако ни для кого не секрет, что его провозглашение спасителем родины было не более чем политическим ходом Ресуса и его духовенства. Хотя Коис и правит, он делает это из позолоченной клетки.\n\n#bold Коис может быть владыкой, но пока Ресус дёргает за ниточки, а сьялволки стоят у порога, действительно ли он правит? Вырвете ли вы Коиса из цепей, чтобы доказать, что он больше, чем просто избалованный крестьянин, или станете ещё одним шагом сьялволков к победе?"

 bm_1254_the_fall_of_aversaria_gorassos: "Горасс «Собиратель Черепов»"
 bm_1254_the_fall_of_aversaria_gorassos_subheading: "Аавтократ Окровавленного престола"
 bm_1254_the_fall_of_aversaria_gorassos_desc: "«Мясник из Браурири», «Пёс Эшрея», «Кровавый Кулак», «Красный Великан», «Скорбь Атовида», «Собиратель Черепов». У Горасса было много имён, и каждое он заслужил. Омываемый кровью с юности до зрелости, Горасс не может найти радости ни в чём, кроме криков своих жертв. Ныне он правит одним из крупнейших осколков [Concept('aversaria','Аверсарии')|E].\n\n#bold Горасс — один из самых грозных воинов своей эпохи, но он не государственный муж. Запомнят ли вас только в крови и скорби, или Горасс станет первым в великом роду, пережившем бурю истории?"

 bm_1254_the_fall_of_aversaria_governor: "Губернатор Иордан"
 bm_1254_the_fall_of_aversaria_governor_subheading: "Губернатор Опахасии"
 bm_1254_the_fall_of_aversaria_governor_desc: "Опахасия обладает уникальным отличием — самой длинной непрерывной линией губернаторов из одной династии по сравнению с любым другим регионом [Concept('aversaria','Аверсарии')|E]. Правя почти 200 лет, семья Адиакас была гордым родом, всегда служившим верой и правдой на голову выше своих соратников.\n\nОднако теперь мир рушится. Не только Аверсария, но и сам [Concept('aeras','Эрас')|E], и Иордан Адиакас знает, что он единственный человек, способный подарить хоть какую-то надежду своему народу.\n\n#bold Губернатор Иордан со стыдом взирает на историю Аверсарии. Он знает, что возмездие сьялволков справедливо и придет без пощады. Но, быть может, именно он станет тем аверсарианцем, что принесет мир с захватчиками вместо новой войны?"

 bm_1254_the_fall_of_aversaria_hecaeda: "Леган Гекаеда"
 bm_1254_the_fall_of_aversaria_hecaeda_subheading: "$bm_1254_the_dying_world_hecaeda_subheading$"
 bm_1254_the_fall_of_aversaria_hecaeda_desc: "$bm_1254_the_dying_world_hecaeda_desc$"

 bm_1254_the_fall_of_aversaria_iyrossi: "Сиррас «Чёрный Страж»"
 bm_1254_the_fall_of_aversaria_iyrossi_subheading: "Магистр Искателей Мести"
 bm_1254_the_fall_of_aversaria_iyrossi_desc: "Сиррас родился в горах, где его семья скрывалась от [Concept('aversaria','аверсарианцев')|E], зная, что последние потомки Последнего Ийросса будут убиты, если аверсарианцы пронюхают правду. Он так и не успел узнать их, ибо аверсарианцы в итоге нашли и вырезали его родных в первых волнах ийросского восстания. Выросший сиротой в легионах Аверсарии, не ведая о своем происхождении, Сиррас был образцовым боевым магом до того самого дня, пока не открыл своё наследие.\n\n#bold Дезертир в бегах, Сиррас наконец встал на защиту гор рядом со своим домом. Исполните ли вы свое предназначение, отомстите за предков и вернете Ийросскую долину ее законному народу?#!"

