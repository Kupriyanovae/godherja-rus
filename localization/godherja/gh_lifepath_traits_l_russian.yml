 trait_way_of_family_follower:0 "Путь Семьи"  
 trait_way_of_family_follower_desc:0 "Путь Семьи — путь матриархов, патриархов и дипломатов. Его последователи учатся выстраивать отношения с людьми, заботиться о продолжении рода и воспитывать детей. Этот Путь популярен среди крестьян и знати из многочисленных семей."  
 trait_way_of_family_follower_character_desc:0 "Путь Семьи — путь матриархов, патриархов и дипломатов. Его последователи учатся выстраивать отношения с людьми, заботиться о продолжении рода и воспитывать детей. Этот Путь популярен среди крестьян и знати из многочисленных семей."  
 trait_way_of_family_father:0 "Отец пути Семьи"  
 trait_way_of_family_father_desc:0 "Путь Семьи — путь матриархов, патриархов и дипломатов. Его последователи учатся выстраивать отношения с людьми, заботиться о продолжении рода и воспитывать детей. Этот Путь популярен среди крестьян и знати из многочисленных семей."  
