 trait_way_of_stars_follower:0 "Путь Звёзд"  
 trait_way_of_stars_follower_desc:0 "Звёзды служат путеводной нитью для магов, философов, жрецов и моряков. Тайны мироздания необъятны, и лишь острый ум способен проложить среди них путь."  
