 trait_way_of_hunt_follower:0 "Путь Охоты"  
 trait_way_of_hunt_follower_desc:0 "Путь Охоты — путь искателей приключений, охотников и первопроходцев. Он для тех, кто жаждет странствий или хочет бросить вызов миру."  
