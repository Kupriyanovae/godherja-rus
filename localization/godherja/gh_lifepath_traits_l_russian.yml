 trait_way_of_crowns_follower:0 "Путь Короны"  
 trait_way_of_crowns_follower_desc:0 "Путь Короны — путь знати, глав гильдий и деревенских старейшин. Он посвящён искусству руководства во всех его проявлениях: его последователи учатся управлять людьми, финансами и организациями. Его часто называют Путём Королевских Особ; большинство дворян избирает его по собственной воле или под давлением семьи.\n\nУкрепление феодальных порядков в [chevalie|E] постепенно вытесняет крестьян с этого Пути. Хотя формально каждый волен избрать любой Путь, Отцы Пути Короны порой «случайно» пропускают церемонию выбора Пути у простолюдинов, пожелавших следовать ему."  
 trait_way_of_crowns_follower_character_desc:0 "Путь Короны — путь знати, глав гильдий и деревенских старейшин. Он посвящён искусству руководства во всех его проявлениях: его последователи учатся управлять людьми, финансами и организациями. Его часто называют Путём Королевских Особ; большинство дворян избирает его по собственной воле или под давлением семьи.\n\nУкрепление феодальных порядков в [chevalie|E] постепенно вытесняет крестьян с этого Пути. Хотя формально каждый волен избрать любой Путь, Отцы Пути Короны порой «случайно» пропускают церемонию выбора Пути у простолюдинов, пожелавших следовать ему."  
