 trait_way_of_shepherd_follower:0 "Путь Пастырей"  
 trait_way_of_shepherd_follower_desc:0 "Путь скромности для тех, кто ищет в жизни мира и душевного покоя. Под рукой Пастыря процветают и земля, и те, кто на ней живёт."  
