 trait_way_of_nullification_follower:0 "Путь Очищения"  
 trait_way_of_nullification_follower_desc:0 "Путь Очищения — путь [Concept('antimagic_orders','антимагических орденов')|E]. Это самый молодой из Путей и один из самых почитаемых в [chevalie|E]. Его последователи нередко обучаются иначе, чем приверженцы других Путей: вместо занятий с местным Отцом Пути они отправляются в одну из многочисленных обителей орденов, чтобы освоить ремесло братства своего наставника.\n\nХотя Путь популярен во всех слоях общества, чаще всего его избирают простолюдины. Когда возможности возвыситься в обществе почти исчезли, служба в капитуле, позволяющая снискать славу и достаток для родных, многим кажется лучшей долей, чем крепостная зависимость. Несмотря на молодость Пути, его последователи почти столь же легендарны, как приверженцы Справедливости... Но, вопреки героическим сказаниям, подавляющее большинство не обретёт славы: они погибнут в одном из тысяч набегов [Concept('liches','личей')|E] или сгорят от магии. Сказания повествуют лишь об удачливых, а свидетелей, способных опровергнуть их, осталось слишком мало..."  
