 trait_way_of_crows_follower:0 "Путь Воронов"  
 trait_way_of_crows_follower_desc:0 "Путь Воронов — путь шпионов, придворных и [Concept('magi','магов')|E]. Хотя в Марке маги — редкость, легенды гласят, что некогда весь её народ владел магией и следовал Пути Воронов. Его последователи учатся выведывать и хранить тайны, действовать незаметно и влиять на других.\n\nХотя этот Путь связывают с преступниками и изгоями, он учит не только шпионажу, но и умению хранить тайны и противостоять чужим лазутчикам. Особенно почитают его среди знати, придворные обычаи которой с каждым годом становятся всё более замысловатыми и закрытыми... пусть и предпочитают держаться от него на расстоянии."  
