 trait_way_of_knowledge_follower:0 "Путь Знания"  
 trait_way_of_knowledge_follower_desc:0 "Путь Знания — путь эрудитов, учёных и богословов. Его последователи совершенствуют владение словом, создают произведения искусства и литературы, приумножают мудрость. Это почтенное, хотя и нечастое поприще, которому шевальенская культура обязана почти всеми своими великими творениями."  
