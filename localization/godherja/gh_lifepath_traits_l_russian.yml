 trait_way_of_sword_follower:0 "Путь Меча"  
 trait_way_of_sword_follower_desc:0 "Путь Меча направляет воинов, рыцарей, аристократов и кузнецов. Металл, из которого выкован клинок, не менее важен, чем сила и ловкость руки, которая им владеет."  
 trait_way_of_sword_follower_character_desc:0 "Путь Меча направляет воинов, рыцарей, аристократов и кузнецов. Металл, из которого выкован клинок, не менее важен, чем сила и ловкость руки, которая им владеет."  
