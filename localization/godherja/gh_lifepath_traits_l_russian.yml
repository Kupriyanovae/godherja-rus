 trait_way_of_harvests_follower:0 "Путь Жатвы"  
 trait_way_of_harvests_follower_desc:0 "Путь Жатвы — путь земледельцев, членов гильдий и тех, кто руководит их трудом. Он посвящён практическим занятиям, таким как земледелие и кузнечное дело, а также основам грамоты. Некогда он был распространён среди всех слоёв общества, но растущая пропасть между знатью и крестьянством заставила многих дворян считать его «низшим» Путём. Несмотря на всю пользу его учения, знать обычно сторонится его, полагая уделом простолюдинов."  
 trait_way_of_harvests_follower_character_desc:0 "Путь Жатвы — путь земледельцев, членов гильдий и тех, кто руководит их трудом. Он посвящён практическим занятиям, таким как земледелие и кузнечное дело, а также основам грамоты. Некогда он был распространён среди всех слоёв общества, но растущая пропасть между знатью и крестьянством заставила многих дворян считать его «низшим» Путём. Несмотря на всю пользу его учения, знать обычно сторонится его, полагая уделом простолюдинов."  
