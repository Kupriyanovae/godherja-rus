 trait_way_of_dread_follower_desc:0 "Путь Ужаса — путь могущественных и учёных, сеющих страх и отчаяние среди окружающих. Его обычно избирают учёные, богословы и склонные к книжным занятиям дворяне, предпочитающие поручать сражения другим. Следовать Пути Ужаса — значит заставлять всех трепетать, от ближайшего кровного родича до самого далёкого ненавистного врага."  
 trait_way_of_dread_follower_character_desc:0 "Путь Ужаса — путь могущественных и учёных, сеющих страх и отчаяние среди окружающих. Его обычно избирают учёные, богословы и склонные к книжным занятиям дворяне, предпочитающие поручать сражения другим. Следовать Пути Ужаса — значит заставлять всех трепетать, от ближайшего кровного родича до самого далёкого ненавистного врага."


 trait_way_of_blood_follower_desc:0 "Путь Крови — путь кровожадных рыцарей и головорезов, стремящихся преодолеть любое препятствие грубой силой. Чтобы следовать ему до конца, нужно отбросить всякую видимость дипломатии и признать, что единственная истинная мера человека — его боевая доблесть. О прославленных приверженцах этого Пути говорят мало: немногие из тех, кто видел этих залитых кровью рыцарей, остались в живых, чтобы поведать о них."  
 trait_way_of_blood_follower_character_desc:0 "Путь Крови — путь кровожадных рыцарей и головорезов, стремящихся преодолеть любое препятствие грубой силой. Чтобы следовать ему до конца, нужно отбросить всякую видимость дипломатии и признать, что единственная истинная мера человека — его боевая доблесть. О прославленных приверженцах этого Пути говорят мало: немногие из тех, кто видел этих залитых кровью рыцарей, остались в живых, чтобы поведать о них."


 trait_way_of_fear_follower_desc:0 "Путь Страха, вопреки ожиданиям, предназначен вовсе не для тех, кто внушает страх другим. Это путь трусливых и угнетённых: обычно его избирают крестьяне, обречённые жить в страхе перед безжалостными господами, и дворяне, которых родные отвергли и осмеяли настолько, что им закрылась дорога к господствующим Путям. Следующий этим Путём должен искать утешения всюду, где только возможно, но никогда не позволять себе довериться кому-либо или полюбить: ужасы мира могут вынудить его пожертвовать и доверием, и любовью, лишь бы дожить до нового рассвета."  
 trait_way_of_fear_follower_character_desc:0 "Путь Страха, вопреки ожиданиям, предназначен вовсе не для тех, кто внушает страх другим. Это путь трусливых и угнетённых: обычно его избирают крестьяне, обречённые жить в страхе перед безжалостными господами, и дворяне, которых родные отвергли и осмеяли настолько, что им закрылась дорога к господствующим Путям. Следующий этим Путём должен искать утешения всюду, где только возможно, но никогда не позволять себе довериться кому-либо или полюбить: ужасы мира могут вынудить его пожертвовать и доверием, и любовью, лишь бы дожить до нового рассвета."

 trait_way_of_pain_follower_character_desc:0 "Путь Боли связывают с торговцами, ростовщиками и особенно беспринципными землевладельцами. Причинение телесных страданий всегда считается деянием великого благочестия и значимости, однако приверженцы Пути Боли чаще всего искусны в том, чтобы продлевать мучения жертв, удерживая их в нищете и зависимости. Говорят, что самых ревностных последователей этого Пути ненавидят не меньше, чем боятся."  
 trait_way_of_pain_follower_desc:0 "Путь Боли связывают с торговцами, ростовщиками и особенно беспринципными землевладельцами. Причинение телесных страданий всегда считается деянием великого благочестия и значимости, однако приверженцы Пути Боли чаще всего искусны в том, чтобы продлевать мучения жертв, удерживая их в нищете и зависимости. Говорят, что самых ревностных последователей этого Пути ненавидят не меньше, чем боятся."

