 trait_way_of_swords_follower:0 "Путь Мечей"  
 trait_way_of_swords_follower_desc:0 "Путь Мечей — путь воинов, наёмников и тех, кто желает посвятить себя защите родного края. Это один из самых распространённых Путей. Его последователи развивают физическую силу, изучают тактику и учатся понимать, когда и как следует вступать в бой."  
