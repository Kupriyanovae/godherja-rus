 trait_way_of_coins_follower:0 "Путь Монет"  
 trait_way_of_coins_follower_desc:0 "Путь Монет — путь торговцев, зажиточных простолюдинов и многих наёмников. Он учит наживать богатство, вести счёт и торговаться. Этот Путь почитают во всех слоях общества, хотя сложность его учения часто становится серьёзным препятствием на пути к успеху."  
