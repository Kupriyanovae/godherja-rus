 trait_way_of_justice_follower:0 "Путь Справедливости"  
 trait_way_of_justice_follower_desc:0 "Путь Справедливости — путь тех, кто стремится исправлять несправедливость и добиваться торжества правосудия. Это редчайший из Путей: о нём почти не слышно из-за его необычных принципов и сомнительной практической пользы. Порой непросто даже найти Отца Пути, готового провести церемонию. И всё же этот Путь, пожалуй, почитают превыше всех прочих: по преданию, его основали сэр Ранос и его соратники, когда он некогда освободил народ [chevalie|E] от рабства."  
 trait_way_of_justice_follower_character_desc:0 "Путь Справедливости — путь тех, кто стремится исправлять несправедливость и добиваться торжества правосудия. Это редчайший из Путей: о нём почти не слышно из-за его необычных принципов и сомнительной практической пользы. Порой непросто даже найти Отца Пути, готового провести церемонию. И всё же этот Путь, пожалуй, почитают превыше всех прочих: по преданию, его основали сэр Ранос и его соратники, когда он некогда освободил народ [chevalie|E] от рабства."  
