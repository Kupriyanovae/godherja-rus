 game_concept_magiskrit:0 "Магискрит"
 game_concept_magiskrit_desc:0 "Впервые встреченный [Concept('aversaria','аверсарианцами')|E] в тайных знаках, что оставили дикие рати Азарг Кутахнууг во время страшной [Concept('aehan_massacre','Резни при Эхе')|E], «магискрит» — это собирательное имя, коим зовут череду малоизученных наречий, где чародейская сила каким-то образом вплетается в само начертание букв. В то время как большинство найденных надписей наводят на читающего лишь морок разной силы — от легкой тошноты до дикого страха перед кровью, — семь страшных слов оказались подлинными скрытыми ловушками, принесшими ужасную гибель нескольким юным подмастерьям из чародейской [Concept('mayikrata','Майикратии')|E]."

 game_concept_azarg_kutahnuug_translation_debate:0 "Дебаты о переводе Азарг Кутахнууг"
 game_concept_azarg_kutahnuug_translation_debate_desc:0 "Само имя «Азарг Кутахнууг» было найдено начертанным огромными кроваво-красными светящимися знаками на растерзанном теле самой [Concept('aehan_massacre','Эхи')|E]. Несмотря на долгие зимы изучения разгаданного письма, вновь обретенных картхараддийских свитков, слухов и вестей, принесенных из сгинувших тейссийских походов, вещие маги-толковники из числа [Concept('mayikprolollans','майикпрололлан')|E] до сих пор ведут жаркие споры. Одни уверяют, будто имя сие значит «Смеющиеся танцоры над мерцающим пламенем», другие же видят в нем простое слово «Огонь» — все зависит от того, был ли знак под номером 353 в песнях о гибели Эхи отдельным словом с надстрочной метой или же тем же самым знаком 902, но слегка потерявшим очертания от натекшей крови."

 game_concept_azarg_kutahnuug_blood_rituals:0 "Кровавые ритуалы Азарг Кутахнууг"
 game_concept_azarg_kutahnuug_blood_rituals_desc:0 "Переводы [Concept('aehan_massacre','Поэм об убийстве Эхи')|E] рисуют Азарг Кутахнууг как насквозь военизированное племя, коих с малых лет куют в огне изнурительных обрядов. Сказания гласят, что детей отбирают при рождении у матерей, от коих племя ждет беспрестанного чревоношения до самой их кончины или принесения в жертву богам. Младенцев тотчас обрекают на жестокую и непосильную выучку. Притом над новорожденными творят чудные обряды и испытания, дабы решить, достойны ли они «Милостей Дьявольского языка» (или «Шляпы» — первое, вернее всего, есть имя обряда посвящения в соплеменники, второе же — сомнительный плод ошибки писца в знаке 1012).\n\nМладенцев, что «провалили» сии пробы, обычно предают смерти или бросают на съедение зверям (притом есть иные обряды и пророчества для детей, кои после того все равно возвращаются в племя уже взрослыми мужами, невзирая на то, что их бросили в лесу до года — у Азарг Кутахнууг записано семь таких дивных случаев). Те же, кто выдержал испытания, почти поголовно гибнут в ходе последующих двадцати зим воинских мучений. Немногие выжившие зовут себя [Concept('death_seekers','искателями смерти')|E] (иного перевода для сего слова толковники не нашли)."

 game_concept_death_seekers:0 "Искатели смерти"
 game_concept_death_seekers_desc:0 "Одно из немногих речений, с точным прочтением знаков коего были единодушно согласны все вещие книжники из числа [Concept('mayikprolollans','майикпрoлоллан')|E]. Искатели смерти — это ватага грозных воителей, кои, к вящему изумлению магов, как выяснилось, делом соприкасались с [Concept('aversaria','Аверсарией')|E] и, станется, доходили в походах до самого далекого [Concept('sarradon','Саррадона')|E] — судя по тому, как много летописей вещают именно о них, а сколько лишь сходятся в схожих описаниях — возможно, еще в предковую эпоху до прихода Автократии.\n\nСии бойцы, сплошь закованные в искусно вырезанную багряную броню и несущие длинные шипованные мечи почти в свой собственный рост, странствуют по миру и без жалости казнят случайных людей или целые ватаги по велению странного «Отродья», коему они, по их словам, бьют челом, и его тысячи слуг-бесов. Обряды их обычно состоят в том, что воин мешает в чаше свою кровь с кровью незнакомца, выводит несколько неведомых слов на [Concept('magiskrit','магискрите')|E], а после выпивает сие варево. Судя по всему, рожденная тем мысленная связь приносит лютую боль и, к счастью, недолга: воителю является видение, являющее место и лик того, кого ему суждено сразить следующим.\n\nВ конце концов, сей черный обряд либо сводит воина в могилу, либо велит ему воротиться к родному костру, где он после занимает одно из многих мест, нужных для жизни дикого племени. По неведомым причинам иные из этих бродячих рубак также поминаются в разных летописях как наемники на службе в чужих ратях — сторону они выбирали, похоже, как ляжет кость, и никакой платы звонким серебром за свой кровавый труд никогда не брали."

 game_concept_bloodmark_incidents:0 "Инциденты с Кровавой меткой"
 game_concept_bloodmark_incidents_desc:0 "Инциденты с Кровавой меткой вобрали в себя череду таинственных похищений и исчезновений, о коих вещали как ратники Анти-Имперреха (во время их [Concept('sjalvolki_migration','марша на юг')|E]), так и простые [Concept('aversaria','аверсарианские')|E] жители Катраддии и Айроной (после того, как Анти-Имперрех вошел в Амагею). Сии происшествия связаны с внезапным исчезновением знатных и крепких телом воинов — будто бы таявших прямо в воздухе, — после коих не оставалось ничего, кроме единственного кроваво-красного знака, выведенного на месте, где их видели в последний раз.\n\nПодозрение пало на загадочное племя Азарг Кутахнууг, кои уже являлись на окраинах сего великого похода на юг примерно за седмицу до того, как грянула страшная [Concept('frodbrokna','Фродброкна')|E], и кои, судя по всему, все охотнее «присоединялись» (или, вернее, безмолвно шли следом) к толпам беженцев, спасавшихся от беды. Сие шло рука об руку со слухами, будто чужаков без страха принимают в их странную общину, нимало не заботясь об их иноземной крови, вопреки тому, что прежде почти не бывало случаев, дабы Азарг Кутахнууг якшались с чужестранцами, властвовали над ними или сами шли под их руку."