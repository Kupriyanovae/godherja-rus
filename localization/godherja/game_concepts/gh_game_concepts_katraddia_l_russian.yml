 game_concept_theugombrians:0 "Теугомбрийцы"
 game_concept_theugombrians_desc:0 "У теугомбрийцев нет родины. Они кочуют по внутренним областям Континента с незапамятных времён, изредка пуская корни на небольших клочках пустошей, чтобы заниматься земледелием или скотоводством в сильно укреплённых общинах, но чаще всего они странствуют огромными караванами, разбивая защищённые лагеря от силы на несколько недель или месяцев. Их культура делает упор как на дисциплину, так и на боевую подготовку молодёжи обоего пола, из-за чего хронисты и поэты часто называют их «армией без страны». И действительно, они часто продают свои услуги в качестве наёмников или вспомогательных войск любому, кто готов платить. В их культуре, судя по всему, мало внимания уделяется различиям между полами, накладывая равные обязанности как на мужчин, так и на женщин — как внутри теугомбрийского хозяйства, так и под знаменем. Кроме того, для теугомбрийских женщин не является редкостью иметь несколько мужей (иногда до трёх), хотя обратное среди теугомбрийских мужчин встречается чрезвычайно редко.\n\nИх природа как вечных чужаков и кочевников часто делала теугомбрийцев жертвами подозрений и недоверия со стороны оседлых соседей — и к этому отношению они при необходимости более чем готовы проявить взаимность. Хотя они время от времени становились жертвами погромов со стороны толпы, тяжело вооружённый и военизированный характер их общества означает, что для агрессоров это зачастую заканчивалось плачевно, и большинство городов со склонностью к ксенофобной паранойе научились подавлять свои предрассудки и оставлять их в покое в их укреплённых лагерях.\n\nИх тесно сплочённые родственные группы основаны на матрилинейных династиях, которые в некоторых семьях можно достоверно проследить на протяжении более чем пятидесяти поколений. Более того, в нескольких старейших исторических трудах, написанных обществами внутренних областей Континента, упоминается народ, в котором чётко узнаются теугомбрийцы, что указывает на сохранение ими отчётливой культурной идентичности, которая гораздо старше, чем у большинства народов, до сих пор существующих на [Concept('aeras','Эрасе')|E].\n\nТеугомбрийцы, как правило, не признают рабства. Захваченных на войне пленников либо возвращают за случайный выкуп, либо казнят, если они вызвали особый гнев своих пленителей, либо принимают в сам клан, если узник докажет свою готовность и полезность. Таким образом, теугомбрийские кланы часто могут иметь весьма смешанный этнический облик: в отдельных семьях нередко встречаются катунские, саррадонские и даже дамотанские корни."
 
