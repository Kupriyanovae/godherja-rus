 game_concept_doradalem:0 "Дорадалем"
 game_concept_doradalem_desc:0 "Дорадалем, прародина народа мондекни, почти идеально соответствовал традиционному изоляционизму их культуры. Он был бережно укрыт среди возвышающихся гор и окружен настолько плотной лесной стеной, что в большинстве мест она была совершенно непроходима. Из-за этих факторов соседи редко видели мондекни, а таинственная земля за лесной стеной часто внушала страх тем, кто жил за её пределами, представляясь мифическим местом, полным чудес и магии. Внутри же этой стены мондекни жили в разбросанных городках и деревушках, ведя деревенский, даже примитивный образ жизни, который поддерживался почти непревзойдённым плодородием их земель. Их металлургические навыки так и не продвинулись дальше умения плавить медь — во многом из-за отсутствия каких-либо значительных внутренних усобиц (единственным крупным исключением стала междоусобная война клана Детедклан) или вторжений из внешнего мира за всю задокументированную историю мондекни. По их собственным словам, уклад жизни в Дорадалеме ни капли не изменился с того самого дня, как боги сотворили [Concept('aeras','Эрас')|E] — и это утверждение, как ни поразительно, вполне могло быть правдой."
