 game_concept_cnevobarthane:0 "Кневобартан"
 game_concept_cnevobarthane_desc:0 "Своеобразный бог теугомбрийцев, Кневобартан — это солярное божество, которое обычно изображают в виде юноши, увенчанного сияющим нимбом и сжимающего в руках золотое копьё. Его почитатели верят, что он периодически реинкарнирует среди них в теле младенца. Перерождённого Бога поначалу невозможно распознать: он возвращает свои воспоминания и божественное могущество лишь в период полового созревания. Хотя на протяжении истории и появлялись самозванцы, претендовавшие на этот титул, доказательство подлинности перерождения требует демонстрации сил, непостижимых для всех, кроме самых исключительных магов. Тем не менее, Глашатаи утверждают, что располагают списком почти из шестидесяти канонических реинкарнаций, уходящим в прошлое более чем на десять тысяч лет.\n\nХотя неясно, насколько правдива эта историческая хроника, было отмечено, что по крайней мере два из трёх последних воплощений Кневобартана, похоже, совпадают с некоторыми из самых древних легенд народов из внутренних областей Континента. Эти скудные крупицы фрагментарных письменных саг и искажённых устных преданий повествуют о возвышении двух сменявших друг друга невероятно могущественных магов, которых почитали как богов чуть более чем за полторы тысячи лет до зарождения [Concept('aversaria','Аверсарии')|E]."
 
