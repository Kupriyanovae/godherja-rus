 game_concept_cnevobarthane:0 "Кневобартан"
 game_concept_cnevobarthane_desc:0 "Своеобычный бог теугомбрийских племен, Кневобартан — солнечное божество, коего принято являть в образе прекрасного юноши, увенчанного лучистым венцом и сжимающего в деснице золотое копье. Почитатели его свято верят, что бог их время от времени вновь приходит в подлунный мир, являясь в теле новорожденного младенца. Перерожденного Бога по первому времени никак не признать: он возвращает себе память веков и божественную мощь лишь в пору возмужания. Хотя в прошлые эпохи и объявлялись обманщики, присваивавшие себе сие святое имя, истинность перерождения требует явить такие силы, кои непостижимы ни для кого, кроме величайших чародеев. И все же Глашатаи уверяют, будто хранят списки без малого шестидесяти истинных пришествий бога, уходящие в глубь времен более чем на десять тысяч лет.\n\nИ хоть неведомо, насколько правдива сия древняя летопись, ученые мужи подмечали, что как минимум два из трех последних земных воплощений Кневобартана чудно сходятся с древнейшими сказаниями народов из внутренних областей Континента. Сии скудные крупицы полузабытых письменных саг и искаженных устных преданий повествуют о пришествии двух сменявших друг друга чародеев невиданной силы, коих славили как богов чуть более чем за полторы тысячи лет до того, как поднялась великая [Concept('aversaria','Аверсария')|E]."
 
