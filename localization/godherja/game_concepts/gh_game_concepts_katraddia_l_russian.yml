 game_concept_magiskrit:0 "Магискрит"
 game_concept_magiskrit_desc:0 "Впервые встреченный [Concept('aversaria','аверсарианцами')|E] в эзотерических глифах, оставленных Азарг Кутахнууг во время [Concept('aehan_massacre','Резни при Эхе')|E], «магискрит» — это собирательный термин, используемый для обозначения ряда малоизученных слов, в которых магия каким-то образом переносится на письменные надписи. В то время как большинство обнаруженных слов вызывают лишь различные степени дискомфорта — от лёгкой тошноты до острой гемофобии, — семь слов оказались самыми настоящими минами-ловушками, повлёкшими за собой ужасную гибель нескольких подмастерьев из [Concept('mayikrata','Майикраты')|E]."
 
 game_concept_azarg_kutahnuug_translation_debate:0 "Дебаты о переводе Азарг Кутахнууг"
 game_concept_azarg_kutahnuug_translation_debate_desc:0 "Само имя «Азарг Кутахнууг» было обнаружено начертанным огромными кроваво-красными светящимися глифами на изуродованном теле самой [Concept('aehan_massacre','Эхи')|E]. Несмотря на годы изучения расшифрованного текста, вновь обретённых картхараддийских отчётов, слухов и депеш, полученных из злополучных тейссийских экспедиций, маги-лингвисты из числа [Concept('mayikprolollans','майикпрололлан')|E] до сих пор спорят о том, переводится ли это имя как «Смеющиеся танцоры над мерцающим пламенем» или просто «Огонь» — в зависимости от того, являлся ли глиф 353 в поэмах об убийстве Эхи отдельным словом с диакритическим знаком или тем же самым глифом 902, но слегка потерявшим форму из-за стекающей крови."
 
 game_concept_azarg_kutahnuug_blood_rituals:0 "Кровавые ритуалы Азарг Кутахнууг"
 game_concept_azarg_kutahnuug_blood_rituals_desc:0 "Переводы [Concept('aehan_massacre','Поэм об убийстве Эхи')|E] изображают Азарг Кутахнууг как крайне милитаризованное общество, которое подвергает свой народ различным изнурительным ритуалам. Говорят, что детей отбирают при рождении у женщин, от которых ожидается непрерывное деторождение до самой смерти или принесения в жертву, и немедленно определяют в режим подготовки, одновременно невероятно тяжёлый и излишне жестокий. Обычно проводятся странные ритуалы и испытания для новорождённых, чтобы решить, достойны ли они «Милостей Дьявольского языка» (или «Шляпы» — первое, скорее всего, является названием ритуалов для принятия в соплеменники в их обществах, второе — возможный, но маловероятный результат орфографической ошибки в глифе 1012).\n\nНоворождённых, которые «проваливают» эти испытания, обычно убивают или бросают (при этом существует другой набор ритуалов и пророчеств для детей, которые после этого всё равно возвращаются в племя уже взрослыми мужчинами, несмотря на то, что их бросили, когда им не исполнилось и года — у Азарг Кутахнууг зафиксировано семь таких случаев). Те, кто проходят испытания, почти поголовно погибают в ходе последующих двадцати лет воинских тренировок. Немногие выжившие становятся [Concept('death_seekers','искателями смерти')|E] (альтернативный перевод отсутствует)."
 
 game_concept_death_seekers:0 "Искатели смерти"
 game_concept_death_seekers_desc:0 "Одно из немногих выражений, с точным переводом глифов которого были единогласно согласны маги-лингвисты из числа [Concept('mayikprolollans','майикпрoлоллан')|E]. Искатели смерти — это группа воинов, которые, к всеобщему потрясению, как выяснилось, на самом деле как-то взаимодействовали с [Concept('aversaria','Аверсарией')|E] и, возможно, добирались даже до самого [Concept('sarradon','Саррадона')|E] — судя по тому, как много свидетельств повествует именно о них, а сколько являются лишь совпадениями по схожему описанию — возможно, ещё в эпоху до Автократии в аверсарианской истории.\n\nЭти воины, часто облачённые в замысловато вырезанные красные доспехи и несущие длинные шипованные клинки почти в собственный рост, путешествуют по миру и, судя по всему, убивают и вырезают случайных людей или целые группы по приказу странного «Отродья», которому они, по их утверждениям, поклоняются, и его тысячи слуг-дьяволов. Эти ритуалы обычно включают в себя то, что воин смешивает в чаше собственную кровь и кровь незнакомца, записывает несколько пока ещё неизвестных слов на [Concept('magiskrit','магискрите')|E], а затем выпивает получившееся варево. Очевидно, возникающая при этом ментальная связь является исключительно болезненной и, к счастью, недолгой: воину демонстрируется местоположение и облик того, кого он должен убить следующим.\n\nВ конце концов, ритуал либо убивает воина, либо приказывает ему вернуться домой, где он затем занимает одну из многочисленных должностей, необходимых для функционирования внутреннего племени. По неизвестным причинам некоторые из этих бродячих воинов также были зафиксированы в различных исторических хрониках как служившие наёмниками в разных армиях — сторона выбиралась, похоже, случайно, и никакой платы в виде монет за свою работу они никогда не принимали."
 
 game_concept_bloodmark_incidents:0 "Инциденты с Кровавой меткой"
 game_concept_bloodmark_incidents_desc:0 "Инциденты с Кровавой меткой относятся к серии похищений и исчезновений, о которых сообщали как члены Анти-Имперреха (во время их [Concept('sjalvolki_migration','марша на юг')|E]), так и [Concept('aversaria','аверсарианские')|E] жители Катраддии и Айроной (после вступления Анти-Имперреха в Амагею). Эти происшествия связаны с внезапным исчезновением уважаемых и физически крепких воинов — казалось бы, прямо в воздухе, — после которых не оставалось ничего, кроме единственного кроваво-красного глифа, начертанного на месте их последнего пребывания.\n\nПодозрение пало на загадочных Азарг Кутахнууг, которые уже объявлялись на периферии этого движения на юг примерно за неделю до того, как произошла [Concept('frodbrokna','Фродброкна')|E], и которые, судя по всему, выказывали всё большую готовность «присоединяться» (или, точнее, молча следовать за) к группам беженцев, спасающихся бегством на юг. Это сопровождалось появлением сообщений о том, что чужаков принимают в их странное общество, по-видимому, совершенно не заботясь об их иноземном статусе, несмотря на то, что ранее практически не было прецедентов, чтобы Азарг Кутахнууг видели среди иностранцев, господствующими над ними или, наоборот, находящимися под их властью."