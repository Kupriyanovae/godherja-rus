 game_concept_doradalem:0 "Дорадалем"
 game_concept_doradalem_desc:0 "Дорадалем, прародина скрытного племени мондекни, как нельзя лучше потворствовал их извечному желанию жить особняком от остального мира. Глухой этот край был надежно укрыт в кольце исполинских гор и обнесен столь густой стеной дремучих лесов, что во многих местах через нее нельзя было пробиться ни с топором, ни с огнем. Оттого соседи редко зрили очи мондекни, а таинственные земли за лесной чащей часто внушали страх жителям внешних долов, представляясь им мифическим краем, полным дивных чудес и грозных чар. Внутри же сей лесной ограды мондекни мирно обитали в редких городках и весях, ведя простой, даже примитивный уклад, коему споспешествовало редкое, нигде более не виданное плодородие их пашен. Кузнечное их мастерство так и не шагнуло дальше умения плавить чистую медь — во многом оттого, что за всю ведомую историю мондекни они не знали ни тяжких внутренних распрей (лишь междоусобная бойня в роду Детедклан стала черным исключением), ни набегов чужеземцев из внешнего мира. Как уверяют сами мондекни, их жизнь в Дорадалеме ни на волос не переменилась с того самого дня, как боги сотворили [Concept('aeras','Аэрас')|E] — и сие слово, как ни дивно, вполне может оказаться чистой правдой."

