 game_concept_theugombrians:0 "Теугомбрийцы"
 game_concept_theugombrians_desc:0 "У теугомбрийских племен нет родного костра. Они кочуют по внутренним областям Континента с незапамятных времен, лишь изредка пуская корни на бесплодных клочках пустошей, дабы кормиться с земли или растить скот в крепко срубленных, обнесенных частоколом общинах. Куда чаще они странствуют огромными таборами, разбивая защищенные станы от силы на пару седмиц или месяцев. Обычаи их куют в молодежи обоего пола жесткую выучку и воинский дух, отчего летописцы и скальды часто зовут их «ратью без земли». И верно — они охотно идут на службу наемниками или дозорными к любому вождю, у кого найдется звонкая монета. В родах их мало смотрят на различия меж мужами и женами, возлагая равные тяготы на каждого как в теугомбрийском хозяйстве, так и под боевым стягом. К тому же для теугомбрийских жен не в диковинку иметь по нескольку мужей (порою до трех), хотя у теугомбрийских мужей многоженство водится на редкость редко.\n\nЖизнь вечных пришлецов и кочевников часто навлекала на теугомбрийцев подозрения и злобу оседлых соседей — и к такой вражде кочевники при нужде более чем готовы выказать взаимность. Хотя оседлые толпы порой устраивали погромы, тяжело вооруженный и воинский уклад кочевых общин приводил к тому, что для нападавших все кончалось кровавой баней. Большинство градов, склонных к слепой ненависти к чужакам, со временем научились давить в себе былые обиды и оставлять кочевников в покое в их укрепленных станах.\n\nИх тесно сплоченные роды держатся на материнских коленах династий, кои в иных домах можно без обмана проследить на протяжении пятидесяти поколений. Более того, в немногих уцелевших исторических трудах, написанных мудрецами внутренних областей Континента, поминается народ, в коем без труда узнаются теугомбрийцы. Сие доказывает, что их самобытный культурный уклад куда старше, чем у большинства племен, до сих пор живущих на просторах [Concept('aeras','Аэрасе')|E].\n\nТеугомбрийские роды не знают и не приемлют рабства. Взятых в бою пленников либо отпускают за весомый выкуп, либо казнят, ежели те вызвали особую ярость вождей, либо принимают в сам клан, коли узник докажет делом свою верность и пользу. Оттого теугомбрийские кланы часто имеют весьма пестрый облик: в одной семье нередко мешаются катунские, саррадонские и даже дамотанские корни."
 
