l_english:
 game_concept_legio_xxi:0 "State Legio XXI"
 game_concept_the_emperors_own:0 "'The Aautokratir's Own'"
 game_concept_legio_xxi_desc:0 "State Legio XXI, often called 'The Aautokratir's Own', historically had the unique honor of being allowed to take the name of the reigning Aautokratir.\n\nNamed 'Aeschraes' during the [imperial_civil_war|E], the Legion would change sides (and names) shortly before [frodbrokna|E] and thereafter refuse to acknowledge a name other than Axiaothea."
 
 game_concept_imperial_western_faction:0 "Imperial Western Faction"
 game_concept_imperial_western_faction_desc:0 "In late [aversaria|E], the growth of Aironoi as the preeminent Governorate led to political power in the Empire slowly dividing into two increasingly hostile and distant political factions, the Western Faction led by Etepezea (almost always joined by Kalathipsomi) and the Eastern Faction led by Aironoi. This divide would culminate with the [imperial_civil_war|E] in 1186 IS and eventually [frodbrokna|E]."
 
 game_concept_first_empire: "First Empire"
 game_concept_world_city: "World City"
 game_concept_first_to_second_empire: "Second Empire"
 game_concept_first_empire_desc: "[Concept('aversaria','Aversarian')|E] religious doctrine claims that a great city, ruled by a [magi|E] named the [Concept('aersanon','Purest')|E], once spanned the entirety of Aeras with its center at the [Concept('sea_tower','Imperial Tower')|E]. This was the 'First Empire', destroyed by invading barbarians (often named the 'Voidspawn') and treacherous slaves in eons long past. Aversarians see the themselves as the reclaimers to this legacy and the modern [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] as the 'Second Empire'."
 
 game_concept_the_thousand_days_of_asiupoli: "The Thousand Days of Asiupoli"
 game_concept_thousand_days: "Thousand Days"
 game_concept_the_thousand_days_of_asiupoli_desc: "While Asiupoli was by far the most prosperous city of [aversaria|E], the final decades of the city's history saw an unprecedented series of disasters both natural and not. Over a period of years, the 'Thousand Days' would see the city face devastating floods, the collapse of the ruins that the lower city had been constructed upon in an earthquake, the unearthing of a hive of creatures known as the 'Ykian' from an ancient temple beneath the Governorial Palace, and more.\n\nThe collapse would culminate in the [imperial_civil_war|E] where mass bread riots and a horrific plague epidemic were answered by Aautokratia Axiaothea with the extermination of much of the populace. The city was already largely a wasteland by the time [selfreplicating_blood_magic|E] finally wiped the remains from [aeras|E]."

 game_concept_white_pass_war: "White Pass War"
 game_concept_white_pass_war_desc: "The White Pass War of 1267 to 1274 IS was the last military campaign fought by the armies of the Sjalvolki Imperrech and its conclusion is popularly considered the end of the [Concept('sjalvolki_migration','Sjalvolki Migrations')|E] (though several minor wars were fought over the following decade). The leaders of both sides of the war — High King $cenware_link$ Cenware Witch-Breaker#! in the Imperrech and Governoress-Legan Hecaeda in [Glossary('Western Aironoi','western_aironoi_encyclopedia_desc')] — both declared their own opposition to it even before its beginning. The Tribespact of Kasmeze in 1266 would see the High King pressured to lead the dwindling numbers of refugees and adventurers on the campaign as a matter of honor despite his own tiring of the years of war against the Aversarians and he would reluctantly begin the war thereafter with his landing at Peiramum.\n\nWhile initially successful, the bulk and most elite of the Imperrech's armies had largely settled in the west by the time of the invasion, and Governoress-Legan Hecaeda's armies had prepared extensively to resist them. This would lead to Hecaeda's shocking victory at the Battle of the Theyssian Tower — popularly seen as the first or second ever battlefield defeat by Cenware (though not the last of the war) and would see the withdrawal of Cenware's armies back across the Korvion Strait.\n\nAfter nearly a year of pause, two larger and far better prepared armies would land at both Peiramum and Asiupoli, and the Imperrech's armies would rapidly conquer much of the northwest and lead to thousands of [Concept('aversaria','Aversarians')|E] to flee east across the [Glossary('Chrysémvixa','GH_CHRYSEMVIXA_GLOSS')] mountains. Hecaeda would organize the population and her armies across the mountains after them in 1272, and the final two years of the war thereafter would be fought within the mountain's passes and at the years-long siege of Phasonia in the north.\n\nWith both armies facing horrific casualties in the grueling winter of 1273, the Siege of Phasonia seemingly unending, and the death of Hecaeda's husband Altan at the Battle of the Seven Shields, Cenware and Hecaeda would finally agree to a week-long stall of fighting and a meeting within the snow-filled mountain passes that would give the war its name. The following Meeting of the Twenty-Two between both leaders and their councils would be immortalized as legend, and end with both  agreeing to a pact of friendship and peace. Both armies would withdraw, Hecaeda to the east to reorganize the refugees and legions into what would become the Kingdom of Anoteria, and Cenware to the west to lead his people from his newly established kingdom in Oraispol, where he would formally disband the Sjalvolki Imperrech shortly after his arrival." # GH URGENT: Cut this up

 game_concept_knowledge_entries: "Knowledge Entries"
 game_concept_knowledge_entries_desc: "Certain [artifacts|E] when inspected will have an extra #V Knowledge#! tab. When viewed, a list of chapters and subjects will be shown that a [character|E] (if they meet the necessary [skill|E] requirements) can study to learn Spells, improve their Skills, or learn lore."