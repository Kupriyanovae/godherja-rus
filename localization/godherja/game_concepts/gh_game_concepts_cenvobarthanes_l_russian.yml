 game_concept_cenvobarthanes_cycle_of_rebirth:0 "Цикл перерождения Кневобартхена"
 game_concept_cenvobarthanes_cycle_of_rebirth_desc:0 "Дабы укрыть человечество от бед и уберечь от участи Прежнего Мира, Кневобартхен принес себя в жертву, дабы вознестись и слиться с солнцем. Однако это не означает, что Он покинул Эрас, ибо Говорящие верят, что Кневобартхен возвращается к ним каждые несколько столетий, рождаясь заново в облике младенца, который вырастает в [Concept('magi','мага')|E] неописуемой силы."

