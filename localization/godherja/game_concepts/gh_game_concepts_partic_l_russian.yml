 game_concept_ollagh:0 "Друидическая диархия"
 game_concept_ollagh_desc:0 ""
 game_concept_the_druid_arch_council:0 "Верховный совет друидов"
 game_concept_the_druid_arch_council_desc:0 "Верховный совет друидов — магический и духовный правящий орган брикспартиков, который направлял и назначал друидов-оллахов в светские кланы партиков, ведя свой народ в соответствии с Волей Мира. Деятельность Верховного совета, их толкования знамений и указы касательно Воли Мира вызывали множество разногласий среди различных [Concept('scions_of_the_greensea','отпрысков')|E] общества партиков.\n\nВерховный совет был полностью уничтожен отголосками [Concept('frodbrokna','Фродброкны')|E], а те немногие выжившие из низших кругов растворились в более широком обществе в качестве обычных оллахов во время [Concept('the_severing_of_the_vales','Раскола долин')|E]."
 game_concept_the_five_branches_of_draiogann_dtocht:0 "Пять ветвей Драйоганн Дтохт"
 game_concept_the_five_branches_of_draiogann_dtocht_desc:0 "Мистические или организационные направления друидической магии, связанные с великим древом Драйоганн Дтохт."
 game_concept_scions_of_the_greensea:0 "Отпрыски Зеленого моря"
 game_concept_scions_of_the_greensea_desc:0 "До того как партики были вынуждены покинуть свою родину в [Concept('greensea','Зеленом море')|E], они разделялись на три сословия, или отпрыска, по своему общественному положению.\n\nПервым сословием были брикспартики — те, кто жил под властью [Concept('the_druid_arch_council','Верховного совета друидов')|E] и внимал провозглашенной им Воле Мира. Они жили ближе всего к Драйоганн Дтохт, пользуясь благами его магической мощи.\n\nВторым сословием партиков были деорайпартики: изгнанники или те, кто разочаровался в Верховном совете. Живя на окраинах территорий брикспартиков, деорайпартики основывали собственные кланы и советы, воюя и ведя политические игры друг с другом. В зависимости от эпохи (и указов Верховного совета) они могли подвергаться полному остракизму или же получать разрешение на торговлю с разрешение на торговлю с брикспартиками, хотя им никогда не позволялось заходить на исконные земли самих брикспартиков.\n\nТретьим и последним сословием партиков были грозные и проклятые дурн-эорады. Ненавидимые и отвергнутые за свои преступления и злодеяния как брикспартиками, так и деорайпартиками, они были в большинстве своем изгнаны из Зеленого моря или обитали в самых темных и диких его уголках. Дурн-эорады часто разжигали войны с брикспартиками в надежде свергнуть Верховный совет, нередко в качестве возмездия за очередную [Concept('wars_of_pruning','Войну очищения')|E]. Однако большинство дурн-эорадов были не мятежниками и преступниками, а лишь их потомками."


