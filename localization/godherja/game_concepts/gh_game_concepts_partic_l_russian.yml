 #EVENTS
 game_concept_wars_of_pruning:0 "Войны очищения"
 game_concept_wars_of_pruning_desc:0 "Войны очищения — так именовались раздоры и [Concept('great_holy_wars','великие священные рати')|E], кои возжигал [Concept('the_druid_arch_council','Верховный совет друидов')|E] против деорайпартиков или, что сбывалось чаще, против дурн-эорадов ради полного изведения сих родов. Обычно сии побоища оправдывались речами Верховного совета о том, будто на то есть воля самой Воли Мира. Однако конфликты сии, по злой насмешке судьбы, лишь множили число деорайпартиков да дурн-эорадов, ибо многие брикспартикцы начинали сомневаться, истинна ли была та глаголемая воля."

 
