 #HISTORICAL EVENTS/CONCEPTS
 game_concept_the_severing_of_the_vales:0 "Раскол долин"
 game_concept_the_severing_of_the_vales_desc:0 "Хотя партики были защищены от стремительного распространения [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E] благодаря своей изоляции и магическим барьерам, многие из них, особенно самые одаренные в магии вроде [Concept('the_druid_arch_council','Верховного совета друидов')|E], во время [Concept('frodbrokna','Фродброкны')|E] пострадали от чего-то похожего на псионический удар, когда Драйоганн Дтохт закричал от ужаса и страха. Это погубило подавляющее большинство сильнейших магов партиков. После того как Верховный совет и другие низшие друидические круги были полностью уничтожены, выжившие брикспартики обратились за помощью к различным кланам деорайпартиков.\n\nПоследовавшие за этим десятилетия принесли кровавый и хаотичный конфликт, в котором все выжившие ветви партиков в конце концов объединились, чтобы утвердить новую структуру власти в вакууме, оставшемся после падения Верховного совета. Говорят, что во время этих событий некоторые партики из самых разных [Concept('scions_of_the_greensea','отпрысков')|E] получили видение от Драйоганн Дтохт, призывающее совершить великий ритуал ради подготовки к грядущему [Concept('the_fog','бедствию')|E]. Те, кто узрел это видение, в итоге вышли победителями и совершили невероятное: впервые в истории объединили брикспартиков, деорайпартиков и дурн-эорадов. Затем победители провели ритуал, потребовавший колоссальных жертв, и открыли портал, через который партики явились пред очи Кенвара и присоединились к Сьялволкскому Имперреху."

