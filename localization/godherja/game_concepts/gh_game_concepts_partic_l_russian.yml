 game_concept_ollagh:0 "Друидическая диархия"
 game_concept_ollagh_desc:0 ""
 game_concept_the_druid_arch_council:0 "Верховный совет друидов"
 game_concept_the_druid_arch_council_desc:0 "Верховный совет друидов — ведовской и духовный правящий круг брикспартиков, коий правил оллахами-волхвами и слал их в светские кланы партиков, дабы вести свой народ по заветам Воли Мира. Дела Верховного совета, их толкования небесных знамений и указы о Воле Мира порождали великие распри среди различных [Concept('scions_of_the_greensea','отпрысков')|E] племени партиков.\n\nВерховный совет был в прах стерт черным эхом [Concept('frodbrokna','Фродброкны')|E], а те немногие уцелевшие из младших причетников смешались с простым людом на правах обычных оллахов во времена, когда грянул [Concept('the_severing_of_the_vales','Раскол долин')|E]."
 game_concept_the_five_branches_of_draiogann_dtocht:0 "Пять ветвей Драйоганн Дтохт"
 game_concept_the_five_branches_of_draiogann_dtocht_desc:0 "Тайные или ведовские пути друидических чар, связанные с великим древом Драйоганн Дтохт."
 game_concept_scions_of_the_greensea:0 "Отпрыски Зеленого моря"
 game_concept_scions_of_the_greensea_desc:0 "До того как партикцы были вынуждены бежать со своей родины в [Concept('greensea','Зеленом море')|E], они делились на три ветви, или три отпрыска, по своему положению перед людьми и богами.\n\nПервым отпрыском были брикспартикцы — те, кто жил под рукой [Concept('the_druid_arch_council','Верховного совета друидов')|E] и внимал возвещенной им Воле Мира. Они селились ближе всех к Драйоганн Дтохт, черпая блага из его ведовской мощи.\n\nВторым отпрыском партиков были деорайпартикцы: изгнанники или те, кто разуверился в речах Верховного совета. Живя по окраинам земель брикспартиков, деорайпартикцы основывали собственные кланы да сходы, воюя и ведя хитрые споры друг с другом. В зависимости от лихолетья (и новых указов Верховного совета) они могли подвергаться полному проклятию и гонению, либо же получали дозволение меняться товаром с брикспартиками, хотя им под страхом смерти не велено было ступать на исконные земли самих брикспартиков.\n\nТретьим и последним отпрыском партиков были грозные да проклятые дурн-эорады. Ненавидимые и отвергнутые за свои лютые беззакония и злодейства как брикспартиками, так и деорайпартиками, они были в большинстве своем выгнаны из Зеленого моря или обитали в самых темных и диких его дебрях. Дурн-эорады часто шли войной на брикспартиков в надежде сокрушить Верховный совет — нередко в отместку за очередную [Concept('wars_of_pruning','Войну очищения')|E]. Однако большинство дурн-эорадов были не мятежниками и лиходеями, а лишь их несчастными потомками."


