 #HISTORICAL EVENTS/CONCEPTS
 game_concept_the_severing_of_the_vales:0 "Раскол долин"
 game_concept_the_severing_of_the_vales_desc:0 "Хотя партикцы были укрыты от скорого поветрия [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E] благодаря своей глухой изоляции и ведовским оберегам, многие из них, паче иного самые сильные в чарах — вроде [Concept('the_druid_arch_council','Верховного совета друидов')|E] — во время [Concept('frodbrokna','Фродброкны')|E] пострадали от страшного духовного разора и помрачения ума, когда Драйоганн Дтохт возопил от ужаса и страха. Сие сгубило подавляющее большинство сильнейших волхвов партиков. После того как Верховный совет и прочие друидические круги были полностью истреблены, выжившие брикспартикцы пошли на поклон к различным кланам деорайпартиков.\n\nПоследовавшие за этим десятилетия принесли кровавые и хаотичные усобицы, в коих все уцелевшие ветви партиков в конце концов сплотились, дабы утвердить новый ряд и лад воеводский в безвластии, оставшемся после падения Верховного совета. Глаголют, что во время сих смут некоторые партикцы из самых разных [Concept('scions_of_the_greensea','отпрысков')|E] узрели знамение от Драйоганн Дтохт, призывавшее совершить великий обряд ради готовности к грядущему [Concept('the_fog','бедствию')|E]. Те, кто внял сему знамению, в итоге вышли победителями и совершили невероятное: впервые в истории объединили брикспартиков, деорайпартиков и дурн-эорадов. Затем триумфаторы провели обряд, потребовавший колоссальных жертв, и отворили врата, через кои партикцы явились пред очи Ценвара и присягнули Сьялволькскому Имперреху."

