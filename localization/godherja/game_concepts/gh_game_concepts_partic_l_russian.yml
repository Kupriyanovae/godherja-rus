 #EVENTS
 game_concept_wars_of_pruning:0 "Войны очищения"
 game_concept_wars_of_pruning_desc:0 "Войны очищения — это различные [Concept('great_holy_wars','великие священные войны')|E], созывавшиеся [Concept('the_druid_arch_council','Верховным советом друидов')|E] против деорайпартиков или, что более вероятно, дурн-эорадов с целью полного истребления этих групп. Обычно оправдываемые заявлениями Верховного совета о том, что на то воля самой Воли Мира, эти конфликты, по иронии судьбы, часто приводили к появлению новых деорайпартиков или дурн-эорадов, так как многие брикспартики начинали сомневаться, была ли эта воля истинной."

 
