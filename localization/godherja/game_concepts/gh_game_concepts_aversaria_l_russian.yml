  game_concept_aversarinas_aagiokratia:0 "Аверсарианская Агиократия"
  game_concept_aagiokratian:0 "Агиократический"
  game_concept_aagiokratia:0 "Агиократия"
  game_concept_aversarinas_aagiokratia_desc:0 "Аверсарианская Агиократия (или «Имперское человечество» на аверсарианском) — официальная государственная религия [Concept('aversaria','Аверсарианской Автократии')|E] (аналогично — Империум Человечества) и исторически крупнейшая религия в [Concept('the_continent','Великой Аверсарии')|E]. Сама религия крайне децентрализована: аверсарианцы вольны выбирать один из множества местных или иностранных монашеских орденов и санкционированных культов, которые определяют их практику и толкование аверсарианских писаний. Однако все школы сходятся в одном: аверсарианцы — это истинное воплощение человечества. Чистейшие прибыли на [Concept('aeras','Аэрас')|E] в какой-то момент в прошлом, и к ним либо присоединились, либо затем были ими созданы [Concept('aelfir','Первые люди')|E]. Чистейшие были первыми и самыми могущественными из [Concept('magi','магов')|E] в истории и даровали дар магии (предполагая, что те им ещё не обладали) Первым людям в обмен на их верность, якобы став первым автократам.\n\nСвободная структура веры и цинизм аверсарианской аристократии в поздний период имперской истории привели к тому, что религия часто использовалась не более чем для контроля над многочисленными завоеванными народами Аверсарии. Как правило, когда Аверсария не истребляет народы или культуры региона полностью, она искажает местные верования, чтобы вписать их в Агиократию в той или иной форме (обычно приравнивая местных богов к Чистейшим и предписывая религиозные практики по закону). Затем начинается культурная ассимиляция, при которой части населения объявляются аверсарианцами и переселяются в другие места, пока, наконец, все люди не станут считаться аверсарианскими по своей природе, если не по крови, либо не будут уничтожены в ходе военных чисток, а их культурный культ либо распускается, либо приводится в ещё большее соответствие с господствующей верой и в значительной степени оттесняется на второй план."
  game_concept_aversarinas_aagiokratia_no_the:0 "Аверсарианская Агиократия"
  game_concept_aversarinas_aagiokratia_no_the_desc:0 "Аверсарианская Агиократия (или «Имперское человечество» на аверсарианском) — официальная государственная религия [Concept('aversaria','Аверсарианской Автократии')|E] (аналогично — Империум Человечества) и исторически крупнейшая религия в [Concept('the_continent','Великой Аверсарии')|E]. Сама религия крайне децентрализована: аверсарианцы вольны выбирать один из множества местных или иностранных монашеских орденов и санкционированных культов, которые определяют их практику и толкование аверсарианских писаний. Однако все школы сходятся в одном: аверсарианцы — это истинное воплощение человечества. Чистейшие прибыли на [Concept('aeras','Аэрас')|E] в какой-то момент в прошлом, и к ним либо присоединились, либо затем были ими созданы [Concept('aelfir','Первые люди')|E]. Чистейшие были первыми и самыми могущественными из [Concept('magi','магов')|E] в истории и даровали дар магии (предполагая, что те им ещё не обладали) Первым людям в обмен на их верность, якобы став первым автократом.\n\nСвободная структура веры и цинизм аверсарианской аристократии в поздний период имперской истории привели к тому, что религия часто использовалась не более чем для контроля над многочисленными завоеванными народами Аверсарии. Как правило, когда Аверсария не истребляет народы или культуры региона полностью, она искажает местные верования, чтобы вписать их в Агиократию в той или иной форме (обычно приравнивая местных богов к Чистейшим и предписывая религиозные практики по закону). Затем начинается культурная ассимиляция, при которой части населения объявляются аверсарианцами и переселяются в другие места, пока, наконец, все люди не станут считаться аверсарианскими по своей природе, если не по крови, либо не будут уничтожены в ходе военных чисток, а их культурный культ либо распускается, либо приводится в ещё большее соответствие с господствующей верой и в значительной степени оттесняется на второй план."

  game_concept_katraddia_tribal_mixing:0 "Апокиака и племенное смешение"
  game_concept_katraddia_tribal_mixing_desc:0 "Северные апокиаксы стали известны тем, что сочетали аверсарианские одеяния с племенной одеждой, поклонялись смеси аверсарианских и местных богов и даже вступали в брак с племенными династиями ради обеспечения союзов и безопасности своих границ."

  game_concept_katraddia_province:0 "Катраддийская репутация"
  game_concept_katraddia_province_desc:0 "Хотя Катраддия считалась равной по статусу другим губерниям со времен спора о Трелитионе 932 года от И.С., на нее тем не менее смотрели свысока, как на цепочку колоний, а не как на полноценную провинцию, и в целом она оставалась наиболее слабо удерживаемым и суровым фронтиром Аверсарии до своего уничтожения из-за открытия [Concept('the_rift','Разлома')|E] и превращения в [Concept('foglands','Туманные земли')|E]."

  game_concept_kalathipsomi_fashion:0 "Калатипсомская мода"
  game_concept_kalathipsomi_fashion_desc:0 "В дополнение к традиционному аверсарианскому красному цвету калатипсомская знать издавна использовала зеленый, черный и серый цвета, подражая искусству прежних обитателей Калатипсоми. Помимо цветов, северные аверсарианцы переняли пристрастие к практичной, сдержанной моде, хотя это не следует ошибочно принимать за унылый спартанский аскетизм. Калатипсомцы находят красоту в простоте, и изделия из дерева, вырезанные из живых деревьев Калатипсоми, служат свидетельством того, что их философия способна порождать произведения великолепия, способные соперничать с любыми другими в остальной Аверсарии."

  game_concept_kalathipsomi_province:0 "Калатипсомское положение"
  game_concept_kalathipsomi_province_desc:0 "Хотя Калатипсоми считалось равным по положению Этепезее, Опахазии, Аироное и стояло даже выше Катраддии, его жители считались приверженцами довольно варварской и не утонченной версии аверсарианской культуры."
  
  
