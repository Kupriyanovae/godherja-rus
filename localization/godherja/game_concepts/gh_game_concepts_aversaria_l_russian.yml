  game_concept_odrstund:0 "Одрстунд"
  game_concept_odrstund_desc:0 "Одрстунд — это [Concept('gedeora','гедеора')|E], которая обрушилась на [Concept('aversaria','Аверсарию')|E] в 1168 году от И.С. Будучи крупнейшим за многие поколения, Одрстунд, похоже, был направлен в первую очередь против аверсарианских [Concept('magi','магов')|E].\n\nЗа одну ночь худшие черты [Concept('magic','магической')|E] аристократии Автократии радикально обострились. Черствые стали социопатами, жестокие — кровожадными, а злобные — преисполненными ненависти. Последствия (помимо нескольких серийных убийств) проявились не сразу, но быстро стали очевидными в течение последующего десятилетия. Поскольку маги стали деструктивны как никогда, в Аверсарии началось стремительное увеличение числа и масштабов гражданских войн и внутренних конфликтов: в 1178 году было убито в десять раз больше дворян, чем за всё десятилетие, предшествовавшее Одрстунду.\n\nЭшрей, лидер Орайспольской Автократии в [Concept('imperial_civil_war','Имперской гражданской войне')|E], родился во время Одрстунда. Привело ли это к сотворению им [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E], остаётся предметом жарких споров."
  
  game_concept_imperial_civil_war:0 "Имперская гражданская война"
  game_concept_aversarian_civil_war:0 "Аверсарианская гражданская война"
  game_concept_aversarian_civil_war_no_prefix:0 "Гражданская война"
  game_concept_imperial_civil_war_desc:0 "Имперская гражданская война (или [Concept('aversaria','Аверсарианская')|E] гражданская война) — это конфликт между автократом Эшреем из Орайсполя и автократом Аксиотеей из Асиуполя, происходивший между 1186 и 1200 годами. Будучи лишь одной из тысяч гражданских войн в Аверсарианской Автократии за все годы с момента её основания, Имперская гражданская война заслужила особое место в истории, поскольку именно она положила конец Аверсарианской Автократии и породила [Concept('the_fog','Туман')|E], когда Эшрей (один из претендентов в этой войне) вызвал [Concept('frodbrokna','Фродброкну')|E].\n\nВойна началась после таинственной смерти автократа Анесимасия и обвинения в том, что его жена, Аксиотея, отравила его. В [Concept('blood_senate','Кровавом сенате')|E], созванном после его смерти, Аксиотея уничтожила всё собрание и присутствовавшую знать, а немногие выжившие поспешили преклонить перед ней колени. Однако по её возвращении в культурную столицу, Орайсполь, легон Эшрей и XXI легион «Эшрей» (ныне «Аксиотея») устроили переворот, провозгласив её ложной автократом, а самого Эшрея — законным правителем.\n\nПоследовавшая война длилась почти двадцать лет, оставив большую часть Империи разорённой войной, поскольку знать постоянно меняла стороны или откалывалась, создавая собственные фракции. Война больше всего запомнилась невероятным ростом мощи [Concept('magic','магии')|E], вызванным стремительными исследованиями и разработкой ранее не использовавшихся или неразвитых заклинаний. Целые города стирались с лица земли мощными магическими взрывами, южная Опахасия превратилась в выжженную пустошь, а завершилась война заклинанием настолько колоссальным, что оно вызвало Фродброкну. И хотя Аксиотея погибла от этого заклинания, вместе с ней погибла и Империя, а собственное государство Эшрея быстро распалось в последующие годы, несмотря на его «победу»."
  
  game_concept_thaxaonic_blood_pact:0 "Таксаонский кровавый пакт"
  game_concept_thaxaonic_blood_pact_revolt:0 "Восстание Таксаонского кровавого пакта"
  game_concept_thaxaonic_blood_pact_desc:0 "Таксаонский кровавый пакт представлял собой фракцию [Concept('aversaria','аверсарианских')|E] [Concept('houses','домов')|E], которая возглавила попытку переворота и восстание против автократа Эшрея сразу после [Concept('frodbrokna','Фродброкны')|E]. Под предводительством самозваного автократа Яксора «Кровавого Воробья» Таксаона и при поддержке дюжины благородных домов в Этепезее и Малкое, оно в конечном итоге было подавлено в ходе кампании, возглавляемой Картин Деленель, после почти десятилетия войны.\n\nХотя это было лишь первое в длинной череде потрясений, обрушившихся на Орайспольскую Автократию после [Concept('imperial_civil_war','Имперской гражданской войны')|E], оно сыграло важную роль, помешав попыткам Эшрея консолидировать власть в его и без того слабеющем государстве, и рассматривается как один из главных ранних факторов, приведших в итоге к его краху."
  
  game_concept_the_vilnian_assault:0 "Вилнианский штурм"
  game_concept_vilnian_assault:0 "Вилнианский штурм"
  game_concept_the_vilnian_assault_desc:0 "Вилнианский штурм — это сражение, произошедшее после [Concept('imperial_civil_war','Имперской гражданской войны')|E] в городе Орайсполь в конце 1229 года от И.С. между силами правившего автократа Эшрея из «Орайспольской Автократии» и леганом Исацеей и её XXI легионом «Аксиотея».\n\nВ то время как Эшрей изо всех сил пытался удержать ускользающую власть над [Concept('aversaria','Аверсарией')|E] (Айроной полностью восстал, а остальная часть Империи погружалась в анархию), XXI легион боролся за выживание в Опахасии. Будучи ранее личным легионом Эшрея (носившим тогда название «Эшрей»), они подвергались жестокому преследованию на большей части территории Аверсарии со стороны помощника автократа — [Concept('karthyn_delenel','Картин Деленель')|E].\n\nИсацея решила положить конец правлению Эшрея, утверждая, что ни легион, ни сама Аверсария не будут в безопасности, пока «нечестивый автократ» не будет убит или брошен в темницу, и приняла решение собрать все возможные союзные силы для штурма столицы.\n\nВместе с Благородным легионом, дарованным деспексиром Хексоном из Диметры, отрядом бывших легионеров, ставших наемниками, и силами криминальных организаций западной Этепезеи, выступавших против подпольной сети под контролем [Concept('demetros_detheniax','Деметрия Железного Шипа')|E], Исацея начала штурм.\n\nНападение получило свое название в честь ворот Вилниана (названных в честь автократа Вилниана), у которых и начался штурм. Переодевшись торговцами, прибывшими для торговли из северной деревни Ильтия, Исацея и элитный отряд из сорока человек проскользнули через ворота и перебили стражу, открыв проход для основных сил. Около тысячи воинов либо вошли в город через эти ворота, либо сбросили маскировку, которую они носили в разных частях города, и вскоре с боем пробились к Императорскому дворцу на холме Эксионарака.\n\nДобравшись до трона, несмотря на тяжелые потери, Исацея и её оставшиеся силы столкнулись лицом к лицу с автократом Эшреем перед помостом Маклеи, который приказал Железному Шипу и Деленель убить её. Дальнейшие события туманны, но штурм закончился неудачей. Железный Шип и Деленель, а также остальные лучшие гвардейцы Эшрея, его [Concept('magi','маги')|E] и его ближний круг погибли в этой битве (Железный Шип и Деленель — в поединке один на один с Исацеей). Тем не менее, Эшрею удалось убить раненую легана, а XXI легион и его союзники были отброшены и выбиты из города с огромными потерями.\n\nНесмотря на неудачу Исацеи, нападение всё же увенчалось частичным успехом. В ходе штурма Орайспольская Автократия была фактически обезглавлена: всё ближайшее окружение Эшрею, удерживавшее это хрупкое государственное образование, было уничтожено, престиж автократа был разрушен, а порядок за пределами Этепезеи полностью рухнул. Оставшись без союзников на фоне краха своей власти, наместник Этепезеи (Лик Ксенеферон) совершил переворот против Эшрея и узурпировал контроль над Западной Этепезеей, положив конец правлению автократа."

  game_concept_the_black_mountain_war:0 "Война Черных гор"
  game_concept_black_mountain_war:0 "Война Черных гор"
  game_concept_the_black_mountain_war_desc:0 "Название «Война Черных гор» используется для обозначения серии войн между [Concept('methiad_dethlycan','наместницей Метиадой Детликан')|E] и [Concept('oulnir_gurdurbok','Ульниром Гурдурбоком')|E], происходивших примерно между 1226 и 1247 годами от И.С. Хотя война началась с партизанской борьбы Метиады против [Concept('demetros_detheniax','Деметрия Железного Шипа')|E], конфликт более всего известен прибытием наместника архилегана Никанонея «Черное Солнце» в 1247 году от И.С. В ходе конфликта Никаноней успел поработать как на Метиаду, так и на Гурдурбока, отметившись штурмом союзной Метиады крепости Тарвек и убийством сторонника Гурдурбока — Элдрада «Погибельная Звезда» Питиклада.\n\nПозже обе стороны выделили Никанонею солдат для борьбы с наступающими [Concept('sjalvolki_migration','сьялволками')|E], и он стал первым [Concept('aversaria','аверсарианцем')|E], кому удалось нанести поражение Ценвару «Сокрушителю Ведьм» в битве при Бергкоге, однако из-за невозможности закрепить победу ему пришлось отступить обратно на север. Никаноней обвинил в этой неудаче обе стороны и обратился против своих бывших «союзников», начав с убийства Гурдурбока в его поместье в Черных горах. Вскоре после этого он двинулся на запад, чтобы разобраться с наместницей Детликан, которая подослала убийц и свой личный легион, чтобы остановить его продвижение. Обе попытки провалились: убийцы были пойманы личной охраной Никанонея, а её легион перешел на сторону захватчика. Позже Детликан была поймана при попытке бежать на запад в [Concept('chevalie','Шевалье')|E] и казнена Никанонеем за «некомпетентность и предательство».\n\nПосле окончания войны Никаноней взял под свой контроль север, а Война Черных гор вскоре переросла в [Concept('ash_war','Пепельную войну')|E]."

  game_concept_ash_war:0 "Пепельная война"
  game_concept_ash_war_desc:0 "Пепельная война — это ожесточенная кампания в северо-восточной части [Concept('chevalie','Шевалье')|E], проходившая между 1248 и 1251 годами от И.С. между силами Восточного Шевалье во главе с герцогом Раоном II ден ва Сиссо против имперских остатков под предводительством наместника архилегана Никанонея «Черное Солнце». После его победы в конце [Concept('the_black_mountain_war','Войны Черных гор')|E] на жизнь Никанонея было совершено покушение верными агентами [Concept('methiad_dethlycan','наместницы Метиады Детликан')|E], которые, как выяснилось, в значительной степени финансировались её союзником, герцогом Раоном. Испытывая отчаянную нужду в припасах для борьбы со [Concept('sjalvolki_migration','сьялволками')|E], Никаноней использовал это как повод для похода против ослабленного Шевалье.\n\nХотя поначалу [Concept('aversaria','аверсарианцы')|E] добились больших успехов, таинственное появление партиксого племени калагонов вскоре поставило ситуацию под вопрос. Партикские [Concept('magi','маги')|E] нанесли огромный урон аверсарианским линиям снабжения, и объединенное войско вскоре отбросило силы аверсарианцев обратно на восток. В итоге линия фронта закрепилась в восточном Мюизле, где были вырыты окопы и возведены укрепления, позволявшие аверсарианским магам обрушивать огонь на поля, оставаясь скрытыми от шевальенских всадников на грифонах. Этот период позиционной войны поддерживался строительством многочисленных осадных замков обеими сторонами.\n\nВойна закончилась в 1251 году от И.С., когда союз марочников и партиков начал решительное наступление на силы Никанонея, подгадав атаку под набег [Concept('liches','лича')|E] Ильнара Илладира. Никаноней был искалечен огненным снарядом партического мага, и во время его двухнедельной комы его войска были отброшены на восток, в Черные горы, где он позже реорганизовал своих людей и земли в Эпаварион — Эбеновую Лигу. Марочники, с другой стороны, позже были преданы партиками во время [Concept('rohrian_annex','Рорской аннексии')|E], что привело к потере Восточного Рора, перешедшего к захватчикам."

  game_concept_turmoil_of_the_sixteen_aautokratirs:0 "Смута шестнадцати автократов"
  game_concept_the_turmoil:0 "Смута"
  game_concept_turmoil_of_the_sixteen_aautokratirs_desc:0 "Смута шестнадцати автократов — это период всеобщей анархии и гражданской войны, охвативший [Concept('aversaria','Аверсарию')|E] сразу после [Concept('odrstund','Одрстунда')|E] и продлившийся с 1169 года от И.С. до (в конечном счете недолговечного) воссоединения большей части империи Анесимасия (за исключением Катраддии, частей северной Калатипсоми и Крехеджада) в 1181 году от И.С. Став кульминацией более чем векового упадка Аверсарии, Смута оказалась одной из самых разрушительных гражданских войн, потрясших империю со времен [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E]. И хотя впоследствии её затмила [Concept('imperial_civil_war','Имперская гражданская война')|E], многие политические линии разлома и ключевые фигуры, сыгравшие решающую роль в более позднем конфликте, впервые заявили о себе именно во время этого десятилетнего пожара.\n\nВопреки названию, в эту эпоху на титул автократа претендовало, несомненно, гораздо больше шестнадцати человек; часто упоминаемое число в основном относится лишь к тем, кто удерживал Орайсполь или Асиуполь в течение какого-то времени, и не включает многочисленных провинциальных военачальников, которые даже близко не подобрались к контролю над ними. Многие из этих несостоявшихся правителей Аверсарии стали считаться одними из самых тиранических и некомпетентных за всю историю империи: чудовищный Эол «Желчная Кровь», пророк-маг Киргос со своим Культом Пламени Чистейшего и безжалостные сестры Мунтани (наряду с их знаменитым соперничеством) были лишь некоторыми из бесславных деспотов, возвысившихся и павших в этот период."
  
  game_concept_war_of_all_islands:0 "Война всех островов"
  game_concept_war_of_all_islands_desc:0 "Крупнейшее морское вторжение в истории [Concept('aversaria','Аверсарии')|E], а возможно, и в истории всего [Concept('aeras','Аэраса')|E], Война всех островов была последней попыткой Империи навсегда покончить с э’хатскими пиратами, которые с незапамятных времен терзали Расколотое побережье. Началом войны считается масштабная серия набегов, совершенных в 963 году от И.С. э’хатской царицой Иезатой из Баотаадара на имперские торговые суда, что стало вопиющим нарушением различных договоров, подписанных с э’хатскими правителями южного архипелага. В ответ на эти провокации автократ Алькандрея объявила, что с э’хатцами, как было продемонстрировано, невозможно вести переговоры, и начала строить планы вторжения невообразимых масштабов и размаха, которое должно было начаться, как только будет собран флот. Однако, не имея регулярного военно-морского флота, автократ решила разослать по всей Автократии прокламацию, обещавшую земли в Крехеджаде каждому, кто присоединится к флоту, и щедрые награды первому, кто ступит на остров. Это предложение показалось невероятно привлекательным для обедневших островитян, и вскоре все стоянки судов были до отказа забиты полными энтузиазма экипажами, бок о бок с которыми к операции готовилось огромное количество государственных легионов. Кроме того, к ним присоединился внушительный контингент рабов, которым в случае доблестной службы обещали свободу и право селиться на островах.\n\nВесной 966 года от И.С. флот вышел в море, и хотя само плавание не обошлось без происшествий — несколько капитанов-островитян воспользовались случаем, чтобы напасть на своих соперников, — хаос, которым это вторжение запомнилось его ветеранам, по-настоящему начался тогда, когда впереди показались э’хатские флаги. Однако за ними виднелась суша, что вызвало безумную гонку среди нескольких судов, стремившихся первыми заявить права на обещанную награду. Сама битва, увековеченная как [Concept('battle_of_the_imperial_sea','Битва в Имперском море')|E], закончилась победой Империи, и хотя война продолжалась ещё несколько лет, к 967 году от И.С. земельные наделы были распределены между теми, кто их заслужил, и на свет появился Архексат Крехеджад — зависимое государство, подчиненное Империи."

  game_concept_battle_of_the_imperial_sea:0 "Битва в Имперском море"
  game_concept_battle_of_the_imperial_sea_desc:0 "Произошедшая во время Войны всех островов, Битва в Имперском море — это название, закрепившееся за высадкой [Concept('aversaria','аверсарианцев')|E] в Крехеджаде. Против собранного флота э’хатцев — народа, бороздившего просторы открытого моря ещё до того, как была создана Автократия, — выступил имперский флот, состоявший из бесчисленных флотилий островитян, легионов и дворянских свит. Битва заслуженно снискала славу хаотичной, поскольку у обеих сторон отсутствовала жесткая структура командования, а отдельные легоны и капитаны имели почти полный контроль над своими кораблями. В результате, как только завязался бой, строй полностью распался, так как каждое судно выбирало себе индивидуальные цели, в то время как имперские и э’хатские [Concept('magi','маги')|E] уничтожали целые флотилии.\n\nВскоре хаос перекинулся на сушу: корабли островитян и амбициозные легоны устремились вперед, чтобы заявить права на награды, обещанные за первую высадку, что привело к нескольким случаям дружественного огня, когда аверсарианские суда сражались друг с другом за эту честь. Однако, по неожиданному стечению обстоятельств, эта хаотичная высадка дала Империи преимущество, поскольку э’хатские флоты, пытавшиеся отступить к берегу, часто обнаруживали, что порты их базирования уже заняты. Считается, что Битва в Имперском море завершилась, когда остатки флота Иезаты решили бежать из Крехеджада, отступив в южную колонию Кетруна."

  game_concept_dielecendian_compromise:0 "Дилесендианский компромисс"
  game_concept_dielecendian_compromise_desc:0 "Подписанный автократом Кетэмодом из [Concept('aversaria','Аверсарианской Автократии')|E] и верховным королем Розье из [Concept('chevalie','Шевалье')|E], Дилесендианский компромисс положил конец нескольким векам [Concept('marcher_aversarian_wars','войны')|E] между двумя государствами. Договор был подписан в городе Дилеспорт, где по сей день стоит монумент в честь заключения мира. Делегаты из Дилесенда сыграли решающую роль в успехе переговоров, поскольку они не только обеспечивали точный перевод, но и помогали объяснять обеим сторонам культурные нюансы их визави.\n\nКак было оговорено в договоре, территории марочников на [Concept('shatteredisles','Расколотых островах')|E] уступались Аверсарии, что положило начало многовековому периоду восстаний островитян против аверсарианского владычества. Их владения в Черных горах также были уступлены, во многом из-за того, что [Concept('bloodblight','кровавый мор')|E] уничтожил шевальенских поселенцев в этом регионе. Остров Дилес был сдан в аренду аверсарианцам, и хотя остров номинально оставался частью Шевалье, Аверсария осуществляла полный контроль над самим островом и его прибыльным портом.\n\nНаконец, что вызвало огромные споры, марочники были признаны аверсарианцами родственной расой. Хотя это привело к подписанию нескольких выгодных торговых соглашений, консерваторы, ратующие за чистоту крови, категорически не согласились с уступкой автократа, что привело к фатальной нехватке поддержки в [Concept('kartharadd','грядущей катастрофе')|E]."

  game_concept_nexios_folly:0 "Безрассудство Нексия"
  game_concept_nexios_folly_desc:0 "Узнав о [Concept('magic','магических')|E] свойствах [Concept('shimmerstone','мерцающего камня')|E] из стычек с племенами круплегов, в 971 году от И.С. [Concept('mayikrata','Майикратия')|E] направила экспедиционный корпус к Северным Железным Хребтам, чтобы захватить месторождение кристаллов. Хотя поначалу аверсарианцы без особого труда преодолели горные перевалы, вскоре на них внезапно напала армия, в три раза превышавшая первоначальные оценки всей численности населения круплегов. Хуже того, все вожди и воины племени были усилены мерцающим камнем и быстро посеяли хаос в рядах аверсарианцев. Весь экспедиционный корпус — включая архимага Нексия — погиб в битве, известной ныне как Безрассудство Нексия, что нанесло тяжелый удар по престижу Майикратии и позволило автократу Клитомеду получить больше власти над академией.\n\nНесмотря на это поражение, Майикратия все же смогла получить источник мерцающего камня, когда магистр Акслиад отправился на север и был объявлен кровным родственником круплегов после того, как проявил себя в набеге. Круплеги согласились продавать ограниченное количество мерцающего камня до тех пор, пока род Акслиада правит «магическим племенем». По возвращении Майикратия немедленно возвела Акслиада в ранг архимага и провозгласила его династию титулярными правителями самых северных территорий академии — эта практика сохранялась ещё долго после пресечения самого рода."

  game_concept_battle_of_ten_trees:0 "Битва у десяти деревьев"
  game_concept_battle_of_ten_trees_desc:0 "Битва у десяти деревьев, широко считающаяся самым кровопролитным сражением во время [Concept('sjalvolki_migration','Миграций сьялволков')|E], произошла на одноименной поляне в 1247 году от И.С. Шестнадцать легионов, состоявшие в основном из уроженцев Калатипсоми и местных государственных легионов, двинулись на юг от позиций за рекой Патос после поражения Варикадской имперской клики. Надеясь перезимовать в близлежащих усадьбах, они вместо этого вышли прямиком на авангард правого фланга Сокрушителя Ведьм. После катастрофической для обеих сторон серии столкновений легионы отступили... и попали прямо в центр орды сьялволков.\n\nПоследовавшая за этим битва длилась почти шесть месяцев, в течение которых сьялволки и имперцы яростно сражались в условиях самой суровой зимы на памяти жителей Калатипсоми, причем от холода и голода погибло больше солдат, чем в любом бою. В итоге сьялволки одержали победу, а разбитые остатки легионов либо рассеялись, либо примкнули к последним осколкам имперской власти под началом вероломного легона Кресока, либо отступили на юг, где были полностью уничтожены у Элизийского перевала.\n\nНесмотря на то, что это сражение осталось в тени Битвы у Элизийского перевала, большинство исследователей сходятся во мнении, что у Десяти деревьев аверсарианские легионы в последний раз представляли какую-либо угрозу для орды Ценвара, а ветераны этой битвы часто с горечью говорят о «славе» Прохода и забытых страданиях у Десяти деревьев. Сегодня о той битве напоминают лишь часто находимые кости и обломки сотен забытых стычек, да шесть уцелевших деревьев на поляне."

  game_concept_western_incursion:0 "Западное вторжение"
  game_concept_western_incursion_desc:0 "Жестокая кампания во время [Concept('imperial_civil_war','Имперской гражданской войны')|E], Западное вторжение было почти увенчавшейся успехом попыткой имперской претендентки Аксиотеи положить конец войне военным путем.\n\nПосле окончания [Concept('siege_of_asarathos','Осады Асарата')|E] силы Эшрея устремились на север, чтобы воспользоваться брешью в оборонительной линии сторонников Аксиотеи, оставив Проход Горных Царей почти совершенно беззащитным. Аксиотея воспользовалась этой брешью и стремительно провела свои войска через проход, застав врасплох авангард сторонников Эшрея, в результате чего почти половина профессиональных воинов Эшрея оказалась заперта на севере. Затем Аксиотея воспользовалась этим временем, чтобы дотла разорить и без того потрепанную юго-восточную Опахасию, объявив это возмездием за их предполагаемое предательство двухлетней давности, что довершило опустошение региона.\n\nВ последние дни войны силы Аксиотеи сумели окружить потрепанные остатки легионов Эшрея — по иронии судьбы, в самых руинах Асарата, — в то время как остальные ее войска осаждали стены Тинитиды, предвещая скорый конец войны. Аксиотея передала командование своему верному генералу и другу детства, магистру-легону Матоту «Черноглазому» Асоноксу, а сама отправилась обратно на восток, чтобы разобраться с [Concept('blue_robe_revolt','Восстанием синих мантий')|E]. Говорят, что как только она достигла ворот своего дворца в Асиуполе, грянула [Concept('frodbrokna','Фродброкна')|E], положившая внезапный конец гражданской войне."

  game_concept_siege_of_asarathos:0 "Осада Асарата"
  game_concept_siege_of_asarathos_desc:0 "Большая часть последнего десятилетия [Concept('imperial_civil_war','Имперской гражданской войны')|E] характеризовалась затяжным патом в Опахасии, поскольку силы Эшрея не могли прорвать оборонительную линию сторонников Аксиотеи на севере, что делало невозможными любые серьезные попытки вторжения в Асиуполь. С другой стороны, войска Аксиотеи были точно так же скованы своей осадой Тинитиды, традиционных «ворот» в Этепезею с востока.\n\nЭто положение дел изменилось в 1199 году от И.С., когда недовольный отсутствием прогресса автократ Эшрей лично прибыл на передовую. Вместе со своими [Concept('magi','магами')|E] Никенеей «Странницей Бездны» и Йиндом «Прекраснейшей Ведьмой» Эшрей разнес стены Асарата мощнейшим импульсом чистой силы.\n\nПадение крепости было воспринято командирами Эшрея как возможность прославиться, став первыми, кто ступит на земли Айроноя. Некомпетентное руководство со стороны архилегана Крылы Катаританок вкупе с междоусобицами в высшем военном командовании Эшрея (тактика, к которой часто прибегал сам Эшрей, испытывавший постоянную паранойю, что его ведущие генералы устроят переворот, если не будут слишком заняты друг другом) привело к тому, что в порыве радости от долгожданного прорыва они оставили почти все земли между Проходом Горных Царей и укреплениями через пролив от Асиуполя практически беззащитными. Более того, Катаританок приказала отправить на север почти все вспомогательные подразделения боевых магов в надежде использовать их для быстрого сокрушения любых других крепостей вдоль северного залива.\n\nЭтот опрометчивый марш на север пробил бреши в линиях сторонников Эшрея, чем и воспользовалась Аксиотея в ходе последовавшего [Concept('western_incursion','Западного вторжения')|E]."

  game_concept_war_of_the_thousand_dragons:0 "Война тысячи драконов"
  game_concept_war_of_the_thousand_dragons_desc:0 "После смерти автократа Фанагорака его потомки возглавили радикализацию имперского культа и заявили, что сами являются его реинкарнациями и, следовательно, Возрожденными Чистейшими. Это привело к росту напряженности в отношениях со следующими выборными автократами, которые после Фанагорака обычно были традиционалистами-эрсодианцами.\n\nЭтот шаткий баланс рухнул в 156 году от И.С., когда Эксионарак, внук Фанагорака, дезертировал вместе с группой других наездников на драконах и захватил город Тинитида. Он провозгласил себя законным автократом и развязал войну против правившего в Орайсполе автократа Дхаси’ксена. Война продолжалась четырнадцать лет и ознаменовалась апокалиптическими битвами, вызванными присутствием не только могущественных [Concept('magi','магов')|E], но и тысяч [Concept('dragons','драконов')|E] с обеих сторон, которые и дали войне ее название.\n\nВся зарождающаяся империя полыхала в драконьем огне: разрушения достигли Северного [Concept('sarradon','Саррадона')|E] и даже вызвали миниатюрный ледниковый период из-за огромного количества пепла и дыма, затянувших небо. Война подошла к концу, когда Дхаси’ксен, уставший от бесконечных сражений и смертей, попытался вступить в переговоры с Эксионараком — что закончилось его вероломным пленением силами мятежников. И Дхаси’ксен, и его дракон Анатар’ианак подвергались пыткам в течение нескольких дней на глазах у жителей Орайсполя и были казнены только после того, как город наконец открыл свои ворота в знак капитуляции.\n\nВойна тысячи драконов стала поворотным моментом в аверсарианской истории: некоторые даже называют ее подлинным началом [Concept('aversaria','Аверсарианской Автократии')|E]. В годы после войны произошло объединение различных верований и культов, разбросанных по старой Империи, в единую религию, а также массовый геноцид драконов, который в конечном итоге привел к их полному вымиранию."

  game_concept_ixsian_war:0 "Иксианская война"
  game_concept_ixsian_war_desc:0 "Внезапное появление затерянного полиса Икс во время великого наводнения в VII веке (уничтожившего второй город Икс, его жителей и обитателей соседних островов) вызвало бурные дебаты среди [Concept('aversaria','аверсарианских')|E] легалистов, и автократ Кетэмод высказался в пользу буквалистской «Маклейской» фракции. Маклейцы утверждали, что город и его жители не прошли «очищение» и на самом деле нарушили священный Божественный Закон, используя бездушную магию Времени. В большинстве своем это признается циничным шагом, поскольку Кетэмод заявил, что, так как город никогда не подчинялся какому-либо наместничеству во время реформ Маклеи, он задолжал трону налоги за сотни лет. Город ответил отказом, и вскоре после этого имперская армия была отправлена в карательную экспедицию.\n\nПоследовавшая Иксианская война продолжалась несколько месяцев. Хотя иксиане имели архаичное вооружение и очень небольшую армию, они, тем не менее, обладали более чем дюжиной действующих комплектов бесценных рунических доспехов и архивами, все ещё полными древних [Concept('ritual','ритуалов')|E] и артефактов, которых никто не видел веками. Иксиане использовали эти дары с большим успехом, но новые ритуалы, разработанные уже после исчезновения Икса, и стая обученных виверн из зверинца наместника Этепезеи в конечном итоге сломили сопротивление защитников. Вскоре иксиане сдались, большая часть их великих архивов была разграблена, богатства изъяты, а сам город перешел под прямое управление Империи. Однако разразившийся (и стремительно усугублявшийся) [Concept('chaos_of_the_seventh_century','Хаос седьмого века')|E] привел к смерти Кетэмода и ослаблению хватки Империи, а передача четырех оставшихся в городе комплектов рунических доспехов автократу Эраму для использования против [Concept('kartharadd','картараддов')|E] позволила городу вернуться к самоуправлению."

  game_concept_month_of_the_magi:0 "Месяц магов"
  game_concept_month_of_the_magi_desc:0 "Месяц магов представлял собой серию событий (на самом деле продолжавшихся два месяца и три недели), кульминацией которых стало то, что [Concept('pathosixyic_academies','Патосиксийские академии')|E], важнейшие из [Concept('mayikprolollans','майикпрололланов')|E], объявили о своей независимости от [Concept('aversaria','Аверсарии')|E] и выходе из-под действия имперских законов.\n\nСобытия начались в 1229 году от И.С. с [Concept('miniature_war','успешного захвата власти')|E] архимагом Терроксом в [Concept('mayikrata','Майикратии')|E] и последующего [Concept('terroxian_imperial_edict_manifesto','провозглашения ее независимости')|E] от Империи. Вскоре за этим последовали катастрофический [Concept('hour_of_four_legions','Час четырех легионов')|E] и [Concept('thallasian_magicoup','Талласианский магический переворот')|E], завершившие Месяц магов гибелью около 120 человек (более 90 из которых пали в Майикпрололлане сто Таллас) и фактически поставившие точку в истории майикпрололланов как академий для [Concept('magi','магов')|E]."

  game_concept_miniature_war:0 "Майикратская «Малая» война"
  game_concept_miniature_war_desc:0 "Так называемая «Малая» война — конфликт, с перерывами шедший с 1184 по 1229 год от И.С., — развернулась между многочистельными фракциями [Concept('magi','магов')|E], сражавшимися как в подземных залах [Concept('mayikrata','Майикратии')|E], так и на ее самых отдаленных вершинах. После гибели архимага Олитаксина, магистра Пелтры и большей части Правящего совета Майикратии во время [Concept('rathiax_incident','Ратиакского инцидента')|E], а также казни архимага Симоисия после убийства автократа Анесимасия «Доброкровного», внутри Академии образовался вакуум власти, толкнувший амбициозных магов на жестокую борьбу за влияние и авторитет.\n\nФракции изначально сформировались по линиям раскола [Concept('imperial_civil_war','Имперской гражданской войны')|E]: фракция «Ааимойнос», или «Кровавое вино», возглавляемая магистром Зиликом Нивагдараксом, по сообщениям, поддерживала Эшрея, а фракция «Мистакс», или «Реформа», во главе с магистром Лудиком Мскра якобы выступала на стороне Аксиотеи. Это, вкупе с огромным количеством мощных заклинаний, сотворенных во время конфликта, заставило многих рассматривать эту войну как уменьшенную модель войны на материке.\n\nНа протяжении большей части времени конфликт оставался в тупике, пока его внезапно не разрушила [Concept('frodbrokna','Фродброкна')|E], которая унесла жизни большинства сражавшихся магов и привела к возвышению новой фракции, потребовавшей вместо этого независимости Майикратии. Возглавляемая магом Терроксом — современником (и пользовавшимся дурной репутацией коллегой) Эшрея (с которым он вел преимущественно одностороннее соперничество) и Аксиотеи (к которой питал ещё более одностороннюю влюбленность), — эта фракция в конечном итоге добилась победы в 1229 году от И.С. после удивительно успешной зачистки своих последних соперников среди сотрудников Академии и правящего Совета."

  game_concept_hour_of_four_legions:0 "Час четырех легионов"
  game_concept_hour_of_four_legions_desc:0 "После обнародования [Concept('terroxian_imperial_edict_manifesto','Терроксианского имперского эдикта-манифеста')|E], Майикпрололлан сто Спатас поспешно заявил о солидарности с Терроксом и присягнул на верность его автократу, отчасти потому, что экономика академии и окружающего ее города была тесно связана с [Concept('mayikrata','Майикратией')|E].\n\nОднако в следующем месяце хаос, последовавший за этим событием, и дальнейший распад Калатипсоми на враждующие клики привели к тому, что четыре отдельных дворянских легиона (Легион XXXVIII «Зимние волки», Легион XLIX «Звездный путник», Легион LVI «Кровавые жнецы» и Легион LXXXIII «Горе лесов») заявили о намерении осадить город и даже преуспели в этом. Однако не прошло и часа, как город объявил о своей независимости от Террокса и пошел на соглашение с несколькими соседними влиятельными лицами, чтобы изгнать вторгшиеся легионы, а также добиться нейтралитета во внешних делах в обмен на собственную безопасность."

  game_concept_thallasian_magicoup:0 "Талласианский магический переворот"
  game_concept_thallasian_magicoup_desc:0 "Внезапное [Concept('terroxian_imperial_edict_manifesto','провозглашение независимости')|E] [Concept('mayikrata','Майикратии')|E] немедленно вызвало серьезные внутренние распри в Майикпрололлане сто Таллас: кампус Академии вскоре погрузился в гражданскую войну, а окружающий его город — номинально независимый от ее дел — раскололся по собственным политическим и экономическим линиям.\n\nТолько после так называемого «магического переворота» совет академии сумел заключить союз с местными властями и выйти победителем, истребив большинство своих противников в ходе ночи кровавых убийств. Затем город также объявил о полной независимости, окончательно положа конец катастрофическому [Concept('month_of_the_magi','Месяцу магов')|E]."

  game_concept_rathiax_incident:0 "Ратиакский инцидент"
  game_concept_rathiax_incident_desc:0 "Буквально означающий «бестия», Ратиакский инцидент стал катастрофой, которая привела к гибели архимага [Concept('mayikrata','Майикратии')|E] и большей части ее Правящего совета в 1184 году от И.С.\n\nВ качестве финального испытания для молодых [Concept('magi','магов')|E] Эшрея и Аксиотеи — самых могущественных учеников, когда-либо обученных в Майикратии с момента ее официального основания, — магистр Пелтра приказал им сойтись в дуэли насмерть. Последовавшая битва была апокалиптической: она привела к полному уничтожению испытательных полигонов академии (и территории на несколько сотен ярдов вокруг) и длилась беспрецедентные шесть часов — подвиг, о котором раньше слышали только в легендах и фольклоре. Конец, по сообщениям, наступил, когда Пелтра начал подстрекать Аксиотею нанести смертельный удар Эшрею, в результате чего первая вместо этого обратила свои заклинания против самого магистра. Говорят, что после этого уроженка Айроноя приготовила безумно мощное заклинание, которое выжгло все поле огнем, погубив многих из собравшихся магов и магистров. Запись совета Майикратии, единственное сохранившееся свидетельство об инциденте, гласит:\n\n#inno_quote «Омерзительная Аксиотея, столь беспощадная в своей знаменитой кровавой ярости, поглотившей столько невинных душ за многие годы, подготовила огненное заклинание, несомненно созданное на основе ритуалов древней и злой нечеловеческой цивилизации. Мы, члены Совета Майикпрололлана, отважно заявили ей: «Мы не склонимся! Мы не падем ниц перед столь нечестивой тварью, как ты!»»#!\n\n#inno_quote «Затем мерзкая Аксиотея подожгла архимага Олитаксина и сбросила его со склона горы, на что Совет Майикпрололлана затем отважно ответил: «Мы сделаем все, что ты прикажешь! Ибо мы не желаем, чтобы проливалась дальнейшая кровь невинных!», поскольку мы, члены Совета Майикпрололлана, хитроумно рассудили, что сможем обманом заставить эту бестию покинуть Академию и ее многочисленных драгоценных послушников, если притворимся, будто подчиняемся ее воле».#!"

  game_concept_aehan_massacre:0 "Эаханская резня"
  game_concept_aehan_massacre_desc:0 "Печально известное ритуальное убийство, произошедшее в период правления автократа Тейсии, Эаханская резня унесла жизни почитаемой [Concept('aversaria','аверсарианской')|E] жрицы Эахи и всех 26 сестер-послушниц ее культа во время их путешествия по Катраддии. Преступниками были признаны азарг-кутахнууги — культура, доселе считавшаяся мифическим пугалом карттарадди, само существование которой раскрылось лишь благодаря многочисленным и ужасающим ритуальным кровавым надписям, оставленным на (по всем отзывам, жутком) месте бойни.\n\nНа месте трагедии было обнаружено более 4000 начертанных слов, написанных на теологическом глифическом языке племени (на полную расшифровку которого ушло около двадцати лет и вся жизнь целого крыла [Concept('mayikrata','Майикратии')|E]). В этих кропотливо детализированных стихах описывались точные пытки, которым подверглись жрицы, причины, по которым их боги сочли нужным потребовать их смерти, а также три случайно выбранных священных мифа об основании из восьмидесяти шести существующих. Кроме того, там содержалось множество слов, которые аверсарианские [Concept('magi','маги')|E] до сих пор с трудом могут полностью понять и которые с тех пор называют «[magiskrit|E]».\n\nРазъяренная Тейсия, которая, как говорят, считала Эаху своим наставником, приказала отправить две исключительно злополучные экспедиции (и ещё четыре пропали без вести) для расследования, поимки и уничтожения азарг-кутахнуугов. Хотя упомянутые экспедиции закончились катастрофическим провалом, те немногие отчеты и депеши, которые им удалось отправить обратно на юг, составляют основу всей информации, которой ктолибо располагает об этой таинственной культуре."

  game_concept_six_great_revolts:0 "Шесть великих восстаний"
  game_concept_six_great_revolts_desc:0 "В катастрофических последствиях [Concept('the_vilnian_assault','Вилнийского штурма')|E|l] «Пепельная автократия» #E [Concept('aeschraes','автократа Эшрея')|E]#! немедленно погрузилась в полный коллапс после десятилетий отчаянной борьбы за контроль над разрозненной сетью военачальников, удерживавших власть в [Concept('aversaria','Аверсарии')|E] после [Concept('imperial_civil_war','Имперской гражданской войны')|E]. В [Concept('mayikrata','Майикратию')|E] по [Concept('theyssian_scrivenery_network','Тейсианской писчей сети')|E] поступило сообщение о том, что Эшрей мертв, как и большая часть бывшей Империи. Однако магистр Сарос получил послания об этом событии от придворного мага Эшрея, магистра Элари, который утверждал, что Эшрей все ещё жив. Архимаг Террокс, узнав об этих новостях, объявил Элари изгнанным (что положило начало Войне шести залов), а затем снова провозгласил Эшрея мертвым в своих [Glossary('Декларациях Террокса','GH_TERROXS_DECLARATIONS_GLOSS')]. Напечатав тысячи копий (что уничтожило последние крупные печатные мощности в Империи), он разослал их военачальникам вплоть до Восточного Аироноя и глубин анархического и заполненного [Concept('the_fog','туманом')|E] губернаторства Катраддия.\n\nРеакция по всей Империи была незамедлительной. Те немногие регионы империи Эшрея, которые ещё не получили известий через Сеть канцелярий или не поверили им, были потрясены этими прокламациями до глубины души, а уничтожение сети практически лишило их возможности провести дальнейшее расследование. К тому времени слухи и конспирология уже десятилетиями доминировали на выжженных руинах этой «культуры», и, несмотря на то что Эшрей был жив, подавляющее большинство жителей Империи — даже в некоторых частях Этепезеи — уверились в том, что Эшрей мертв одним из тысячи разных способов от стольких же предполагаемых рук.\n\nПосле этого восстания по всей бывшей Империи против немногих оставшихся лоялистов-эшреитов привели к тому, что Пепельная автократия исчезла с Расколотого побережья за считанные недели. Изрядно ослабленный битвой против Исацеи и ее солдат в своем тронном зале, а также десятилетиями почти непрекращающихся сражений, интриг и магии для удержания власти, Эшрей остался без поддержки [Concept('demetros_detheniax','Деметрия Железного Шипа')|E], [Concept('karthyn_delenel','Картина Деленела')|E] и большей части своего ближнего совета или тайной клики. Ему потребовались недели, чтобы уничтожить последние легионы Исацеи и восстановить порядок в Орайсполе. В самый разгар боев остальной двор Эшрея захлестнула волна убийств, переворотов и заговоров, начавшаяся с удушения магистра Элари вскоре после его послания в Майикратию. В этой борьбе за власть победителем в итоге вышел губернатор Лик, устроивший переворот против Эшрея вскоре после того, как автократ осознал, что тот похитил корону и большую часть оставшейся казны прямо во время Вилнианского штурма.\n\nХаос перекинулся за пределы города на остальную Этепезею, где среди знати было широко известно, что Эшрей жив, из-за чего многие боялись открыто заявлять о конце его правления. Династия Аскареллонов вскоре консолидировала большую часть севера и объявила себя свободной от власти Эшрея, за ней последовали бывшие лоялисты Эшрея из анамексанской знати, затем ещё три военачальника, а после — восстания рабов в Хиксотии, что фактически положило конец правлению Эшрея в Орайсполе к 1232 году от И.С. Эшрей все ещё контролировал цепочку фортов и лояльных военачальников вдоль южного побережья и на некоторых Расколотых островах, но в течение следующего десятилетия постепенно терял те немногие земли, которыми ещё мог управлять, пока окончательно не исчез из исторических хроник незадолго до Битвы у Элизийского перевала в 1252 году от И.С."

  game_concept_the_oration_of_legions:0 "Орация легионов"
  game_concept_the_oration_of_legions_desc:0 "Во время [Concept('the_vilnian_assault','Вилнианского штурма')|E] в XIII веке силы легана Исацеи ненадолго захватили контроль над [Glossary('Магистериумом Орайсполя','GH_THE_MAGISTERIUM_GLOSS')]. Используя расположенные в комплексе древние места проведения магических ритуалов связи, которые когда-то объединяли всю Империю — а к тому времени превратились в тонкую сеть, связывавшую [Concept('aeschraes','автократа Эшрея')|E] с его тающим числом сторонников за пределами Этепезеи, — неизвестный легионер, которого часто называют простолюдином или выходцем из [Concept('aversarian_slavery','касты рабов')|E], произнес тридцатиминутную погребальную речь в честь автократа Эшрея. Затем этот легионер, что вызвало ещё больше споров, произнес речь в честь Империи в целом и объявил узы, связывавшие с ней легионы, расторгнутыми. Неизвестно, знали ли легионеры о том, что Эшрей выжил при штурме, но войска автократа практически сравняли Магистериум с землей, отбивая его у воинов Исацеи; этот комплекс стал местом одного из дюжины сражений, которые сотрясали город ещё неделю после штурма.\n\n«Орация легионов», как ее стали называть впоследствии, снискала как славу, так и дурную репутацию, получая самые полярные толкования в павшей Империи и среди ее уцелевших каст. Однако, независимо от отношения к этим речам, исследователи в целом согласны с тем, что они (наряду с самим Вилнианским штурмом) ознаменовали окончательный крах любой веры в имперскую власть на Расколотом побережье, став в дальнейшем чрезвычайно популярным источником для театральных постановок и деклараций антиимперцев."

  game_concept_thyaeasrixtorax:0 "Тиэасриксторакс"
  game_concept_thyaeasrixtorax_desc:0 "Ежегодный ритуал в Орайсполе, ставший впоследствии [Concept('aversaria','аверсарианским')|E] праздником. Тиэасриксторакс берет свое начало с тех пор, как автократ Маклея перенесла имперскую столицу из дворца своего отца в Пдинейдоне обратно в Орайсполь — менее чем через месяц после того, как она убила его и уничтожила Хагедейскую лигу. Когда она впервые вступила в город, многие члены [Glossary('Первого Имперского совета','GH_FIRST_IMPERIAL_COUNCIL_GLOSS')] отказались склониться перед ней, и той же ночью она наложила неведомое проклятие, подчинившее половину советников ее воле. В последующие часы все эти советники впали в кровожадное безумие в своих домах, сотворив великие бесчинства со своими семьями, после чего покончили с собой. Оставшиеся члены Совета умоляли о пощаде, и им был дан один день, чтобы отдать десятую часть своего состава в жертву, хотя Маклея вместо этого бросила в темницу и принесла в жертву всех девятерых для проведения дальнейших темных ритуалов. Ее брат, Ретей, попытался остановить ее, и едва сумел спастись бегством в сельскую местность, где на следующий год провозгласил себя автократом.\n\nПосле этого Маклея реформировала Совет и объявила, что раз в четыре года в знак благодарности за ее милость каждый десятый мужчина в Совете должен отдавать своего первенца для жертвоприношения или службы, по ее усмотрению, иначе она проклянет их всех, как и их предшественников. Впоследствии для проведения этих жертвоприношений был построен [Glossary('Магистериум Орайсполя','GH_THE_MAGISTERIUM_GLOSS')], но Маклея умертвила приношения лишь однажды, в остальные же годы даруя им помилование в виде пожизненной службы на благо Империи. После ее смерти Совет поначалу не стал проводить ритуал, но под давлением бунтов набожных горожан и жесткого натиска со стороны Маклеанского регентского совета они уступили, отдавая по сыну в Имперскую армию на каждые четыре года до следующего жертвоприношения. К началу Картраддских войн этот ритуал превратился в день, когда каждый десятый мужчина в городе вступал в один из Дракарнаксауксила (вспомогательных драконьих отрядов) Имперской армии под всеобщее ликование, после чего возвращался домой, а вместо них отправлялась ещё одна десятая часть наследников Совета. К тому времени две трети Совета составляли женщины из-за специфики формулировок в требованиях Маклеи. Слово «Тиэасрикс», протоаверсарианский термин, примерно означающий «жертвоприношение», к тому моменту разделилось на несколько понятий. Одним из примечательных производных стало имя «Тейсия» — прекрасная или благородная жертва, ставшее популярным женским именем.\n\nК эпохе правления автократа Тейсии традиция стала больше походить на парад и распространилась по многим городам Империи — во многом потому, что многие из тех сыновей Орайсполя были реорганизованы в первые имперские легионы во время Картраддских войн, а затем получили обширные земельные наделы по всей Империи от автократа Эрамая. Тейсия объявила этот день днем молитв Маклее и празднования ее милосердия, после чего маклеанские культы наслаждений по всей империи начали устраивать грандиозные парады в честь «жертв» Империи во имя как Тейсии, так и Маклеи. В дальнейшем Тиэасриксторакс унифицировался в своем проведении, но празднество в Орайсполе славилось особым размахом, а [Concept('magi','маги')|E] из Магистериума Орайсполя были известны проведением одних из самых священных и пышных торжеств этого обряда вплоть до его разрушения после [Concept('the_vilnian_assault','Вильнианского штурма')|E|l]."

  game_concept_poisoning_of_anesimasios:0 "Пролитие «Доброй крови»"
  game_concept_poisoning_of_anesimasios_desc:0 "В 1186 году от И.С. на одном из свадебных банкетов по случаю бракосочетания многообещающего автократа Анесимасия «Доброкровного» с Аксиотеей, Анесимасий предложил тост из кровяного вина в честь [Concept('aeschraes','легана Эшрея')|E], назвав его «величайшим из своих друзей и союзников» и «самым благородным из леганов Аверсарии», а также пообещав, что именно его легион положит конец [Concept('three_cities_war','Войне трех городов')|E].\n\nПриняв кубок из рук Аксиотеи, Анесимасий быстро и небрежно выпил его, что было совершенно не похоже на обычные манеры автократа. Затем Анесимасий улыбнулся Аксиотее, пожал руку запоздавшему гостю и споткнулся о праздничный стол, пролив на него кровь. Он попытался сотворить неизвестное заклинание, после чего рухнул замертво.\n\nПоследовавшая за этим паника и политические интриги разожгли [Concept('imperial_civil_war','Имперскую гражданскую войну')|E]. Хотя виновник так и не был пойман, бесчисленные слухи и обвинения выдвигались против Эшрея, Аксиотеи и множества политических врагов Анесимасия как внутри, так и за пределами империи; существовала и радикальная версия о том, что это было самоубийство."

  #CHARACTERS

  game_concept_demetros_detheniax:0 "Деметрий Детениакс"
  game_concept_demetros_detheniax_desc:0 "Деметрий «Железный Шип» — северный [Concept('aversaria','аверсарианский')|E] военачальник, удерживавший контроль над большей частью Калатипсоми в начале 1200-х годов. Он был незаконнорожденным сыном дворянки Кены Детениакс и (если верить слухам) Ведегара Бретаниака, полулегендарного магистра множества преступных организаций Аверсарии во время разгара [Concept('imperial_civil_war','Имперской гражданской войны')|E]. Железный Шип родился в относительной нищете в тени [Concept('mayikprolollans','Майикпрoлоллана')|E] в Прозе в 1202 году от И.С.\n\nХитрый и проницательный, Деметрий сумел с помощью интриг, уловок и запугивания прибрать к рукам большую часть земель своей матери после ее смерти в 1209 году от И.С., перебив или отстранив ее законнорожденных наследников в течение последующего десятилетия. Вскоре Деметрий стал единолично править на землях своей семьи и начал стремительно расширять их за счет дальнейшего подкупа и военных кампаний на протяжении следующих десяти лет.\n\nПожалуй, больше всего Деметрий известен (или печально известен) тем, что присягнул на верность автократу Эшрею, используя покровительство «Повелителя пепла» для дальнейшего расширения своих владений в направлении Черных гор и создания того, что многие считали легальной преступной организацией, имевшей огромное влияние по всей Этепезее. Вскоре Деметрий стал известен как одна из правых рук Эшрея, и многие лорды оставались под гнетом автократа исключительно из страха перед убийцами, которых, как было известно, нанимал Железный Шип через свои бесчисленные криминальные связи.\n\nДеметрий был убит в 1229 году от И.С. леганом Исацеей из XXI легиона «Аксиотея» во время [Concept('the_vilnian_assault','Вилнианского штурма')|E], погибнув в дуэли с Исацеей бок о бок со своим соратником [karthyn_delenel|E]. Со смертью Железного Шипа (не оставившего признанного наследника) порядок в Калатипсоми стремительно рухнул, сменившись междоусобицами восставших рабов, военных командиров, преступных группировок и местной знати, и оставался в таком состоянии вплоть до [Concept('sjalvolki_migration','Миграций сьялволков')|E|l] в 1250-х годах."

  game_concept_karthyn_delenel:0 "Картин Деленел"
  game_concept_karthyn_delenel_desc:0 "Леган Картин Деленел — малкойский военачальник, родившийся в 1171 году от И.С. Будучи леганом XIV легиона «Кователи цепей», Деленел был известен своей жестокостью и эффективностью в командовании легионом, в первую очередь при подавлении восстаний рабов на протяжении всей [Concept('imperial_civil_war','Имперской гражданской войны')|E] и в последующий период службы автократу Эшрею.\n\nДеленел, пожалуй, наиболее печально известен тем, что считался ментором Горассоса «Собиратель черепов» — печально известного «цепного пса» Эшрея, который проливал реки крови в [Concept('aversaria','Аверсарии')|E] вместе с Деленелом в ходе карательных кампаний, призванных ужасом заставить население подчиниться гниющим устоям Орайспольской автократии. Для выполнения этой задачи Деленелу было передано командование пятью легионами, помимо его личных дворянских легионов из обширных поместий его семьи в Опахазии и Малкое, и именно ему приписывают то, что Эшрей смог удерживать контроль над этими двумя регионами в поздний период своего правления. Известный тем, что сдирал кожу со своих врагов заживо, Деленел использовал свои скромные магические способности, чтобы продлевать их мучения, а также часто кастрировал, лишал языка и рук знатных пленников на глазах у их солдат или семей, произнося речи от имени Эшрея.\n\nДеленел встретил свой конец в 1229 году от И.С. от рук легана Исацеи из XXI легиона «Аксиотея» во время [Concept('the_vilnian_assault','Вилнианского штурма')|E], погибнув в дуэли с Исацеей вместе со своим компаньоном [Concept('demetros_detheniax','Деметрием Железным Шипом')|E]. Со смертью Деленела его легионы немедленно дезертировали со службы Эшрею, Опахазия погрузилась в хаос без его кампаний террора, а Малкоя вскоре была сметена волной Ийросских восстаний.\n\nВ популярных хрониках часто забывают о том, что Деленел пережил Вилнианский штурм, хотя и был смертельно ранен. Брошенный своими союзниками и людьми, он вернулся в свои владения в Опахазии. Там его ученик Горассос вошел к нему под видом дружбы, после чего обезглавил своего учителя для своей коллекции черепов, а затем изнасиловал и убил семью, слуг и рабов Деленела. Этот момент принято считать точкой, когда Горассос разорвал все узы, связывавшие его с Эшреем."

  game_concept_oulnir_gurdurbok:0 "Улнир Гурдурбок"
  game_concept_oulnir_gurdurbok_desc:0 "Улнир Гурдурбок — военачальник в северной Микрос Калатипсоми (ныне обычно именуемой просто Гурдурбок в честь построенной им огромной империи), правивший с 1227 по 1247 год от И.С., как раз перед [Concept('sjalvolki_migration','Миграциями сьялволков')|E] через Серые врата.\n\nХотя он заявлял о своих [Concept('aversaria','аверсарианских')|E] корнях, Гурдурбок так и не представил тому доказательств и по крови был ближе к сарридским горным кланам, коренным жителям Черных гор, а его администрация имела мало сходства с аверсарианской, которую он сверг. Изначально будучи аверсарианским легионером, Гурдурбок захватил север после дезертирства со своими соплеменниками из легиона (XVII легион «Патос») и управлял северными землями под началом [Concept('demetros_detheniax','Деметрия Железного Шипа')|E].\n\nКогда Железный Шип был убит во время [Concept('the_vilnian_assault','Вильнианского штурма')|E], Гурдурбок официально разорвал связи с Аверсарией (в весьма изящно написанном письме к Орайсполю) и вскоре после этого начал войну в горах против мятежного [Concept('methiad_dethlycan','губернатора Метиад Детликан')|E] за контроль над севером. Гурдурбок был известен тем, что использовал в боях освобожденных рабов, и проявлял крайнюю жестокость к сопротивлявшимся ему аверсарианским поселенцам. Несмотря на это и на пропаганду его соперницы Метиад, рисовавшую его истинным варваром, Гурдурбок отличался большим интересом к литературе, чужеземной теологии и искусствам и часто поражал приезжих послов, подолгу дискутируя с ними на эти темы.\n\nГурдурбок встретил свой конец в 1247 году от И.С. с прибытием легана-губернатора Никанонея «Черное солнце», сына губернатора Катраддии. Вступив в регион со своей армией беженцев, Никаноней был отброшен к восточным горам после своего поражения от Ценвара «Сокрушителя Ведьм» в Войне у Горных врат.\n\nОбе стороны пытались переманить Никанонея на свою сторону в [Concept('the_black_mountain_war','Войне в Черных горах')|E], и он использовал войска как Гурдурбока, так и его соперницы, чтобы одержать победу над Сокрушителем Ведьм в битве при Бергкоге, но вскоре после этого был вынужден отступить обратно на север. Преследуемый по пятам сьялволками, Никаноней обвинил в поражении своих «союзников» и счел их слишком большой обузой для своего дела. Он застал врасплох и убил Гурдурбока во время нападения на его поместья, а затем казнил губернатора Метиад и взял под контроль весь север, положив конец периоду гражданского конфликта на северных землях."

  game_concept_methiad_dethlycan:0 "Метиад Детликан"
  game_concept_methiad_dethlycan_desc:0 "Метиад Детликан — [Concept('aversaria','аверсарианская')|E] согубернатор Калатипсоми, правившая между 1226 и 1247 годами от И.С. Рьяная сторонница Аксиотеи, которую современники часто величали «аверсарианкой среди аверсарианцев» за ее властную осанку и абсолютный отказ от компромиссов с теми, кого она считала низшей кровью, Метиад была рождена для своей роли и начала ожесточенную партизанскую войну против военачальника (и ее согубернатора) [Concept('demetros_detheniax','Деметрия Железного Шипа')|E] и его покровителя автократа Эшрея.\n\nМетиад сама по себе была могущественным [Concept('magi','магом')|E] и руководила тайным кругом магов, известным как «Семь Стражей», которых часто считали сильнейшими магами севера наряду с ее союзниками в [Concept('mayikrata','Майикратии')|E]. Более того, Метиад получала значительное количество оружия и финансирования от марочников [chevalie|E], с которыми она заключила ряд сделок на передачу щедрых земельных наделов и ресурсов в Черных горах. С этими силами она вела войну против Железного Шипа, его союзника и своего главного соперника [Concept('oulnir_gurdurbok','Улнира Гурдурбока')|E].\n\nКогда Железный Шип погиб во время [Concept('the_vilnian_assault','Вильнианского штурма')|E], партизанская война между Метиад и Гурдурбоком переросла в открытый полномасштабный конфликт, полыхавший на севере до конца ее дней. Ни одна из сторон не смогла добиться существенных успехов, особенно на фоне общего коллапса остальной части Калатипсоми, а положение Метиад стало ещё более шатким после краха ее союзников в Шевалье (с исчезновением верховного короля Гардфрея) и в Майикратии (когда [Concept('sjalvolki_migration','Ценвар Сокрушитель Ведьм возглавил разграбление академии')|E]).\n\nКогда леган-губернатор Никаноней «Черное солнце» прибыл с востока вместе со своими легионами беженцев, Метиад и Гурдурбок попытались [Concept('the_black_mountain_war','привлечь чужеземца на свою сторону в этом конфликте')|E]. Используя силы как Метиад, так и Гурдурбока, Никаноней сумел одержать победу над сьялволками в битве при Бергкоге, но вскоре после этого был стремительно отброшен на север. Возложив вину на своих «союзников», Никаноней вскоре упредил события, устроив засаду и убив Гурдурбока. Метиад заподозрила, что станет его следующей целью, и попыталась подослать убийц, а также свой личный легион, чтобы уничтожить свою бывшую пешку. Однако наемники потерпели неудачу, а ее легион быстро переметнулся к Никанонею. Окруженная и оставшаяся без союзников, она попыталась бежать в Шевалье, но была схвачена и казнена Никанонеем за некомпетентность в 1247 году от И.С. Ее попытка побега на запад, наряду с ещё одним покушением на Никанонея со стороны ее последователей вскоре после этого, послужили для Черного Солнца предлогом для последующего вторжения на запад, в Шевалье, во время [Concept('ash_war','Пепельной войны')|E]."

  game_concept_sjaljar_jax:0 "Сьяльяр Джакс"
  game_concept_sjaljar_jax_desc:0 "Литературный персонаж VIII века из [Concept('aversaria','аверсарианских')|E] хроник, считающийся первым сьялволком, когда-либо ступившим на земли Аверсарии, Сьяльяр Джакс якобы был вождем, который привел свою наемную армию на юг вместе с [Concept('kartharadd','картарадди')|E], хотя имена реальных сьялволкских наемников той войны так и не были зафиксированы.\n\nИсследователи полагают, что Сьяльяр Джакс, скорее всего, собирательный образ различных деятелей сьялволков, живших до, во время и после Картараддских войн, поскольку сказания о нем менялись с годами. Изначально он изображался как свирепый военачальник, посланный картарадди для разорения Аверсарии, затем — как благородный трикстер, намеревающийся служить Чистейшим, а после — вновь как злобный варвар.\n\nС годами Сьяльяр Джакс был постепенно забыт, но его образ вновь всплыл во время [Concept('imperial_civil_war','Имперской гражданской войны')|E] и сильно повлиял на восприятие аверсарианцами тех сьялволков, которые [Concept('sjalvolki_migration','прибыли')|E] в середине XIII века."

  game_concept_videro_cnavaius:0 "Видеро Кнавайус"
  game_concept_videro_cnavaius_desc:0 "Прославленный ломониосский поэт, оратор и солдат, Видеро Кнавайус почитается как фигура, внесшая наибольший вклад в официальную интеграцию своего народа в [Concept('aversaria','аверсарианское')|E] общество.\n\nСлужа в качестве леталагоса в LXVI легионе «Истребители драконов» во время Картараддской войны, Видеро принял командование легионом после гибели его офицеров, половины личного состава и всех до единого [Concept('magi','мага')|E] в катастрофической битве при Зафанире. Уведя выживших людей в укрытие на островах Итития, он вновь заявил о себе во главе LXVI легиона два года спустя во время [Concept('syatovian_assault','Осады Тинитиды')|E], где был провозглашен героем. Получив право уйти на покой в почетном звании архилегана, Видеро занялся аверсарианской политикой и сумел войти в состав [Glossary('Союза Трех','GH_BAND_OF_THREE_GLOSS')].\n\nНаходясь на этом посту, он решительно осудил повсеместное использование ломониосцев в качестве жертвенных компонентов для ритуалов сотворения заклинаний, публикуя многочисленные памфлеты, стихи и речи. В ходе одних особенно бурных дебатов с губернатором архилеганом Карадаксисом Эркаргиадом он заявил:\n\n#inno_quote «Вы пролили кровь тысячи ломониосцев, чтобы потерять Кесниатопию, в то время как я пролил кровь одного, чтобы спасти Тинитиду».#!\n\nВпоследствии Эрам внял просьбам Видеро, объявив ломониосцев родственной расой аверсарианцев и наложив запрет на беспорядочные жертвоприношения граждан-ломониосцев (однако этот запрет не распространялся на ломониосцев-рабов). Позднее в жизни Видеро стал одним из лидеров [Glossary('Восстания Верных','GH_OATHBOUND_REVOLT_GLOSS')]. И хотя ему удалось избежать плена и казни, его неустанно преследовали агенты XIII легиона «[Glossary('Автокраксия','GH_AAUTOSAXIAS_GLOSS')]», пока в конечном итоге он не был загнан в угол и убит на берегах Каширията."
  
