  game_concept_eastern_tower:0 "Восточная башня"
  game_concept_eastern_tower_desc:0 "Восточная башня — одна из многих [Concept('the_towers','Башен')|E], разбросанных по миру, которые представляют собой места сосредоточения чрезвычайно могущественной магии, убивающей любого, кто осмелится подойти слишком близко.\n\nПостроенная на острове Амбракия, эта Башня остается самой восточной в своем роде из всех, что когда-либо напрямую контролировались [Concept('aversaria','аверсарианцами')|E], которые потратили несколько веков и тысячи жизней (в первую очередь рабов, но порой и безрассудных [Concept('magi','магов')|E]), пытаясь найти способ обойти защиту Башни."
  
