  game_concept_theyssian_scrivenery_network:0 "Тейсианская писчая сеть"
  game_concept_theyssian_scrivenery_network_desc:0 "Тейсианская писчая сеть была [Concept('aversaria','аверсарианской')|E] [Concept('magic','магической')|E] ритуальной системой, якобы созданной — или, по крайней мере, названной — автократом Тейсией и её личными [Concept('magi','магами')|E]. Изначально писчая сеть представляла собой серию ритуалов и технологий, которые позволяли дюжине тростниковых перьев повторять движения одного, благодаря чему писец мог копировать текст на множество свитков одновременно. Ко второй половине правления Тейсии новшества в работе с [Concept('bloodcrystal','кровавыми кристаллами')|E] позволили осуществлять этот процесс для сотни свитков одновременно (ценой определённых издержек) или по отдельности на огромных расстояниях. Так сформировалась Сеть — тысячи взаимосвязанных свитков, которые могли передавать сообщения между [Concept('magi','магами')|E] или использоваться для рассылки указов с Престола. На пике Золотого века даже государственные легионы располагали достаточным числом [Concept('magi','магов')|E], [Concept('magic','магии')|E] и средств, чтобы создавать собственные обособленные сети для передачи приказов и донесений.\n\nСо временем управлять сетью становилось всё сложнее, а её обслуживание обходилось всё дороже. Развитие [Concept('ritual','ритуала')|E] позволило подключать ещё больше свитков одновременно или связывать несколько мест сразу, однако интересы исследователей сместились в другие сферы, и мало кто из [Concept('magi','магов')|E] Золотого века трудился над снижением постоянно растущих затрат на содержание. К закату [Concept('aversaria','Империи')|E] сеть оказалась полностью забита бесконечными спорами между различными [Concept('magi','магами')|E] и фракциями, дискуссиями о состоянии государства, колкостями и потоками чистой бессмыслицы или безумия. В худшие периоды в ней начали зарождаться меметические вирусы — проклятия и сглазы, посылаемые одними [Concept('magi','магами')|E] другим, которые из-за забытых связей между свитками, случайно или по злому умыслу распространялись на огромные сегменты писчей сети. Гибель [Concept('magi','мага')|E] Тейсара и дюжины слуг, обнаруживших его тело в 1121 году от И.С. из-за «запретного слова», скопированного на его свитки, вызвала всеобщую панику среди знати, после чего большая часть Сети была намеренно отключена. После [Concept('odrstund','Одрстунда')|E] большая часть уцелевшей Сети наполнилась такой причудливой ненавистью, что считалась практически нечитаемой, а порой и невероятно опасной.\n\nСвой окончательный конец Сеть встретила в 1230 году от И.С. на фоне [Concept('the_vilnian_assault','Вилнианского штурма')|E] и появления [Glossary('Деклараций Террокса','GH_TERROXS_DECLARATIONS_GLOSS')], когда последние крупные скриптории, способные массово производить свитки в [Concept('mayikrata','Майикратии')|E], были изнурены до полного уничтожения ради печати тысяч копий для рассылки по всей бывшей Империи, а усилия по изданию этой колоссальной декларации сожгли почти всю оставшуюся [Concept('magic','магию')|E] в тех немногих узлах Сети, где она ещё сохранялась. К тому времени она уже сильно пострадала во время [Concept('frodbrokna','Фродброкны')|E], некогда стабильные чары питавшего устройства [Concept('ritual','ритуала')|E] стали беспорядочными и опасными, а знания о том, как воссоздать эти ритуалы, считались утраченными ещё до [Concept('sjalvolki_migration','миграции сьялволков')|E]."

  game_concept_aversarian_slavery:0 "Аверсарианское рабство"
  game_concept_aversarian_slavery_desc:0 "[Concept('aversaria','Аверсарианская Автократия')|E] славилась своими масштабными и жестокими системами рабства, в оковы которых на поздних этапах существования империи было закрепощено большинство населения Автократии. Хотя разновидности рабства отличались таким же разнообразием, как и всё остальное в этой некогда самой густонаселённой империи [Concept('aeras','Аэраса')|E], аверсарианское общество законодательно разделяло два его типа:\n\n• Рабство тела — раб трудится как подневольный; это может происходить ради выплаты долга, выкупа собственной свободы или на правах собственности лица, не являющегося рабом.\n• Рабство крови — раб рождается и живёт рабом; он может принадлежать к культуре или вере, обречённой на массовое порабощение, либо жить в качестве члена рабской касты.\n\nРабы могли принадлежать к обеим группам сразу, и те, кто рождался в границах и обществе [Concept('aversaria','Аверсарии')|E], почти всегда относились к обеим. Те, кто был рабами тела, но не крови, могли жить свободной жизнью, как только менялись их обстоятельства (какими бы они ни были), а их дети рождались свободными. Рабы крови, напротив, считались рабами по праву рождения или самой своей сути, а не по воле обстоятельств; они образовывали рабские династии, рабские деревни и коммуны и даже рабские государства в составе [Concept('aversaria','Империи')|E]. Хотя рабство крови навечно привязывало человека к угнетателям, некоторые рабские касты были богаче и пользовались бóльшим уважением, чем некоторые касты граждан и неграждан из низших слоёв.\n\nГражданство в [Concept('aversaria','Аверсарии')|E] считается доказательством человеческой природы, и по имперскому закону граждане никогда не могли быть порабощены ни телом, ни кровью. Таким образом, согласно имперской риторике, все рабы в [Concept('aversaria','Империи')|E] — даже те, кто владеет землями и принадлежит к уважаемым родам, веками сохраняющим культуру и веру, неотличимые от их соседей-граждан, — не являются людьми. Статус и права рабов, как и положение рабства в качестве основы государственного строя [Concept('aversaria','Империи')|E], издавна служат предметом острых споров."
