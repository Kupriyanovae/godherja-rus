  game_concept_mayikprolollan:0 "Майикпрололлан"
  game_concept_mayikprolollans:0 "Майикпрололланы"
  game_concept_the_mayikprolollan:0 "Майикпрололланы"
  game_concept_mayikprolollans_desc:0 "Майикпрололлан (в буквальном переводе с общего языка — «магическая академия» [Concept('aversaria','аверсарианцев')|E]) — это любая аверсарианская школа, посвященная обучению магии в соответствии с руководящими принципами Конкордиатского пакта и Трактата о надлежащей практике, которые регулируют законную и допустимую аверсарианскую магию. Согласно имперскому закону, всем гражданам Аверсарии, проявившим магические способности, должно быть дозволено обучаться в майикпрололлане, и на пике расцвета империи их насчитывались тысячи различных размеров, соперничавших друг с другом за студентов и престиж. Хотя формально они предназначались для магических изысканий, майикпрололланы часто предлагали полное обучение наукам, математике и истории, и даже не владеющие магией граждане и чужеземцы из-за пределов империи нередко получали образование через них.\n\nСамыми известными и выдающимися майикпрололланами являются [Concept('pathosixyic_academies','Патосиксийские академии')|E] Калатипсоми, среди которых главенствует [Concept('mayikrata','Майикратия')|E]. Официальный выпуск со званием магистра майикпрололлана считался признаком высочайшего престижа, и этот титул официально могла даровать только Майикратия. Однако после того, как Патосиксийские академии на протяжении веков погрязли в политических распрях, они официально разорвали связи с Аверсарией в [Concept('month_of_the_magi','месяц магов')|E], а сама система майикпрололланов по большей части рухнула и исчезла с [Concept('the_continent','континента')|E] на фоне событий, связанных с [Concept('frodbrokna','Фродброкной')|E] и падением Империи."

  game_concept_oraispol:0 "Метрополия Орайсполь"
  game_concept_oraispol_desc:0 "Орайсполь стоит дольше, чем помнит человеческая память, а его улицы петляют меж руин цивилизаций, затерянных во времени.\n\nНо из всех, кто называл этот город своим домом, самыми известными были автократы [Concept('aversaria','Аверсарии')|E]. На протяжении более чем тысячи лет Орайсполь занимал видное положение, будучи центром традиционной аверсарианской власти, уравновешивавшим растущее восточное губернаторство Аироной. Именно здесь предстали перед судом агионистские святые, и именно здесь был убит автократ Анесимасия. А в недавнем прошлом он служил оплотом, из которого Эшрей правил во время [Concept('imperial_civil_war','Имперской гражданской войны')|E]. Несмотря на годы анархии, поглотившей Автократию после [Concept('frodbrokna','Фродброкны')|E], город все ещё стоит, являясь, возможно, последним осколком золотого века Аверсарии."

  game_concept_mayikrata:0 "Майикратия"
  game_concept_the_mayikrata:0 "Майикратия"
  game_concept_mayikrata_desc:0 "Майикратия (слияние слов [Concept('mayikprolollans','майикпрололлан')|E] и «автократия» — [Concept('aversaria','аверсарианского')|E] термина для обозначения «высокой империи» или государства), или попросту сам Майикпрололлан как таковой, является самой влиятельной, престижной и важной из различных магических академий Аверсарии и возглавляемых ею [Concept('pathosixyic_academies','Патосиксийских академий')|E]. Построенная над древним и невообразимо огромным лабиринтом, который был обнаружен аверсарианскими исследователями в VII веке и имел неизвестное происхождение, потенциально уходящее на тысячи лет в прошлое, Майикратия служила одновременно и главной школой для магов-аколитов, и эпицентром магических исследований и архивов.\n\nХотя бесчисленные достижения и открытия Аверсарии в тайных искусствах произошли благодаря Майикратии и ее дочерним школам, и в ее стенах воспитывались и обучались некоторые из самых легендарных и прославленных магов в аверсарианской истории, она также стала одним из самых позорных и вредоносных институтов для Автократии. Имея неограниченный доступ к детям из самых влиятельных кругов Аверсарии, Майикратия и остальные Патосиксийские академии часто использовали свое положение, чтобы внушать своим ученикам нужные идеи или даже шантажировать их, превращая в политических марионеток. Наряду с широким спектром менее известных инцидентов, когда инструкторы злоупотребляли властью над своими студентами в иных целях, Майикпрололлан часто подвергал чрезмерной опасности тех учеников, которых считал менее важными, менее перспективными или вряд ли способными стать пешками, используя их для экспериментов с опасными или неизвестными ритуалами либо для исследования крайне опасных глубин самого Майикпрололлана.\n\nВ Майикратии обучались как автократ Эшрей, так и автократ Аксиотея, которые впоследствии возглавили [Concept('imperial_civil_war','Имперскую гражданскую войну')|E]; соперничество и будущую дурную славу этой пары часто связывают с чрезвычайно жестоким обучением, которое они там получили. Впоследствии, когда Аверсария рухнула после [Concept('frodbrokna','Фродброкны')|E] и академии оказались во все большей изоляции, Патосиксийские академии объявили о своей независимости от аверсарианского государства в 1218 году от И.С. в [Concept('month_of_the_magi','месяц магов')|E], завершив свою историю как институты образования, политических интриг и повсеместной некомпетентности."

  game_concept_pathosixyic_academies:0 "Патосиксийские академии"
  game_concept_pathosixyic_academy:0 "Патосиксийская академия"
  game_concept_pathosixyic_academies_desc:0 "Патосиксийские академии (названные в честь автократа Патоса, который начал [Concept('aversaria','аверсарианскую')|E] экспансию в Калатипсоми, на архаичном «руническом аверсарианском» — популярном диалекте среди практиков-классиков), или чаще просто «Майикпрололланы», — это принятое название для трех [Concept('mayikprolollans','майикпрололланов')|E] Калатипсоми, которые исторически стали самыми влиятельными и известными академиями своего рода. В то время как другие майикпрололланы переживали взлеты и падения славы и богатства, Патосиксийские академии (Майикпрололлан сто Спатас, сто Таллас и главная среди них — [Concept('mayikrata','Майикратия')|E]) не только были первыми тремя созданными, но и стали неформальными лидерами всех остальных академий.\n\nПосле своего подлинного основания в VIII веке от И.С. руководители трех академий собрались, чтобы написать вторую (и самую важную) редакцию Конкордиатского пакта, а несколько лет спустя — Трактат о надлежащей практике, которые стали диктовать правильные и законные учения всех аверсарианских магов наряду с корректным использованием магии. Будучи не просто школами, Патосиксийские академии превратились в экономические центры и важнейшие лаборатории на [Concept('the_continent','континенте')|E]: они собрали крупнейший из известных архивов магических знаний и артефактов на [Concept('aeras','Аэрасе')|E] и стали центрами обучения и экспериментов. Несмотря на это, однако, Патосиксийские академии получили известность из-за своего все более политизированного характера. Используя свое уникальное положение, позволяющее изолировать и контролировать детей, которые в будущем станут самыми влиятельными фигурами Аверсарии, Майикпрололланы часто стремились превратить своих студентов в политических марионеток с помощью смеси социального давления, финансовых долгов, а зачастую даже шантажа и угроз.\n\nНаследие академий как престижных учебных заведений оборвалось после [Concept('frodbrokna','Фродброкны')|E] и коллапса империи во время [Concept('month_of_the_magi','месяца магов')|E] в 1218 году от И.С., когда Майикратия провозгласила себя независимой автократией, отдельной от остальной Аверсарии, за чем последовали аналогичные заявления от двух ее дочерних академий."

  game_concept_blood_senate:0 "Кровавый сенат"
  game_concept_blood_senate_desc:0 "«Кровавый сенат» — это название как принятой системы престолонаследия в Аверсарианской Автократии, так и самого собрания знати для ее проведения.\n\nЭта традиция зародилась в 243 году от И.С. после того, как автократ Акалиониксос объявил, что тот из его сыновей, кто докажет, что является сильнейшим из [Concept('magi','магов')|E], унаследует его трон; вскоре после этого он был убит своей дочерью Маклеей в импровизированной дуэли, которая вскоре была объявлена автократом и провела остаток своего правления, по большей части охотясь на своих братьев. Таково было его происхождение, однако тысячелетие формализации и исправлений с целью предотвратить масштабные гражданские войны почти в каждом поколении привели к его современной итерации.\n\nВ современном мире Кровавый сенат объявляется сразу после окончания траура по покойному автократу. Высшая знать государства выбирает согласованное место, и каждая благородная семья выдвигает по одному кандидату для участия, хотя другим членам также разрешено вызываться добровольно (но это считается табу), равно как и незнатным лицам дозволено присоединяться (что тоже является табу).\n\nВо время Кровавого сената собравшиеся кандидаты соревнуются в турнирной сетке, чтобы выявить, кто является наиболее могущественным магом, посредством дуэлей насмерть, где не допускается пощада под угрозой дисквалификации. Победителем признается последний устоявший мужчина (или женщина).\n\nЛишь один Кровавый сенат был выигран без применения [Concept('magic','магии')|E] — аверсарианским наемником Нотиксом, который использовал навыки [Concept('antimagic','антимагии')|E], перенятые у [Concept('marchers','марочников')|E], чтобы одолеть своих соперников одним лишь мечом."

  game_concept_dethlediaxian_law:0 "Детедиаксианский закон"
  game_concept_dethlediaxian_law_desc:0 "Детедиаксианский закон относится к серии из более чем 200 законов и эдиктов, изданных леганом Аганиаксой Детедиакс после [Concept('aversaria','аверсарианского')|E] завоевания ийросов в 114 году от И.С. Хотя завоевание долины Ийросов часто приписывают автократу Фанагораксу, большинство исследователей согласны с тем, что оно было бы невозможно без военного мастерства Детедиакс (особенно в сравнении с часто оспариваемой компетентностью самого автократа).\n\nДетедиакс была известна своим острым умом и глубокими познаниями об ийросов, полученными в бытность комендантом аверсарианских фортов в северной Опахазии перед Митидонской кампанией. После завоеваний Детедиакс была назначена военным губернатором долины — ее часто называют первым губернатором Малкое, несмотря на то, что тот не был официальной имперской провинцией вплоть до 288 года от И.С., — и сумела разработать свод законов и постановлений, благодаря которым долина не столкнулась с крупными восстаниями даже после ее собственной смерти.\n\nХотя современники обвиняли Детедиакс в симпатиях к ийросам, особенно из-за нескольких разделов закона, которые напрямую оспаривали суровость аверсарианского правления и обходили многие имперские законы, этот свод тем не менее сумел соединить старые кодексы ийросов с аверсарианским правом для создания прочного мира между двумя группами. Наиболее примечательно то, что в нем использовались правила ийросов о «Кровной службе» для создания приемлемого обоснования подчинения, а также гарантировалось, что большинство ийросов будут жить как «автономные рабы» в независимых коммунах под названием «Ийроиконы», что давало им куда большую автономию, чем большинству аверсарианских рабов.\n\nХотя эти законы неоднократно менялись, отменялись или подкреплялись в течение истории (особенно в ходе Тейссианских реформ в 766 году от И.С.), они тем не менее оставались в значительной степени в силе вплоть до восстаний ийросов в 1200-х годах."

  game_concept_terroxian_imperial_edict_manifesto:0 "Терроксианский имперский эдикт-манифест"
  game_concept_terroxian_imperial_edict_manifesto_desc:0 "Одержав победу в [Concept('miniature_war','Миниатюрной войне')|E], новоявленный архимаг Террокс взял абсолютную власть над [Concept('mayikrata','Майикратией')|E]. Рассматривая недавно завершившийся [Concept('the_vilnian_assault','Вильнианский штурм')|E] как свидетельство того, что Эшрей больше не может представлять угрозу для [Concept('pathosixyic_academies','калатипсомских академий')|E], архимаг вскоре объявил себя в «Имперском эдикте-манифесте» независимым автократом, не имеющим связей с аверсарианским государством, и официально закрыл учреждение для студентов из тех, кого он счел «семьями, лояльными ложному автократу».\n\nИзвестие об этой декларации достигло Майикпрололлана сто Таллас и сто Спатас лишь месяц спустя, когда несколько тысяч копий манифеста объемом почти в двести страниц прибыли в города с приказом разослать их правителям по всей Аверсарии и вплоть до Катун-Кая (принято считать, что тем самым Террокс фактически положил конец аверсарианскому книгопечатанию: последние печатные системы на основе магии, метод создания которых был утерян в XI веке и которые использовались магами, сломались от чрезмерного использования, а получившиеся брошюры стали рассматриваться как не более чем параноидальные эгоцентричные бредни, недостойные статуса, возможно, последних произведений аверсарианской литературы)."

