  game_concept_aversarinas_aautokrata:0 "Аверсарианская Автократия"
  game_concept_shattered_coast:0 "Расколотое побережье"
  game_concept_aversaria_possessive:0 "Аверсарии"
  game_concept_aautokrata:0 "Автократия"
  game_concept_aversaria_desc:0 "Аверсария — это название как региона, известного как «Расколотое побережье», так и государства, которое правило им и большей частью [Concept('the_continent','континента')|E] на протяжении почти всей задокументированной истории. Культура аверсарианцев, правящих этими землями, в значительной степени основана на [Concept('magic','магии')|E]: они верят, что только аверсарианцы обладают «чистой» кровью, и что ценность человека определяется именно чистотой этой крови. Аверсарианское общество имеет довольно строгую социальную иерархию, основанную на этом убеждении: рабы находятся на самом дне, неаверсарианские свободные люди — над ними, не владеющие магией аверсарианцы — ещё выше, а по мере продвижения к вершине социальной лестницы стоят все более могущественные [Concept('magi','маги')|E]. Большинство аверсарианских магов — это [Concept('living_magi','маги крови')|E], а простота использования и повсеместная распространенность этой школы в Аверсарии сделали ее самой распространенной формой магии на континенте.\n\nАверсария правила большей частью континента с 0 года по И.С. (Имперскому стандарту) — года основания Автократии. Исследователи в целом сходятся во мнении, что незадолго до этой даты Аверсария была объединена из ряда городов-государств в юго-западной Этепезее одним из многочисленных местных магов-военачальников, и в течение 200 лет с момента своего основания она установила контроль над большей частью Расколотого побережья."
  GAME_CONCEPT_AVERSARIA_HAS_AAUTOKRATIR:0 "Аверсария — это название как региона, известного как «Расколотое побережье», так и государства, которое правило им и большей частью [Concept('the_continent','континента')|E] на протяжении почти всей задокументированной истории. Культура аверсарианцев, правящих этими землями, в значительной степени основана на [Concept('magic','магии')|E]: они верят, что только аверсарианцы обладают «чистой» кровью, и что ценность человека определяется именно чистотой этой крови. Аверсарианское общество имеет довольно строгую социальную иерархию, основанную на этом убеждении: рабы находятся на самом дне, неаверсарианские свободные люди — над ними, не владеющие магией аверсарианцы — ещё выше, а по мере продвижения к вершине социальной лестницы стоят все более могущественные [Concept('magi','маги')|E]. Большинство аверсарианских магов — это [Concept('living_magi','маги крови')|E], а простота использования и повсеместная распространенность этой школы в Аверсарии сделали ее самой распространенной формой магии на континенте.\n\nАверсария правила большей частью континента с 0 года по И.С. (Имперскому стандарту) — года основания Автократии. Исследователи в целом сходятся во мнении, что незадолго до этой даты Аверсария была объединена из ряда городов-государств в юго-западной Этепезее одним из многочисленных местных магов-военачальников, и в течение 200 лет с момента своего основания она установила контроль над большей частью Расколотого побережья.\n\n[GetPlayer.MakeScope.Var('reigning_aautokratir').Char.GetTitledFirstName] — правящий [GetPlayer.MakeScope.Var('reigning_aautokratir').Char.GetTitleTierName]."
  GAME_CONCEPT_AVERSARIA_HAS_NO_AAUTOKRATIR:0 "Аверсария — это название как региона, известного как «Расколотое побережье», так и государства, которое правило им и большей частью [Concept('the_continent','континента')|E] на протяжении почти всей задокументированной истории. Культура аверсарианцев, правящих этими землями, в значительной степени основана на [Concept('magic','магии')|E]: они верят, что только аверсарианцы обладают «чистой» кровью, и что ценность человека определяется именно чистотой этой крови. Аверсарианское общество имеет довольно строгую социальную иерархию, основанную на этом убеждении: рабы находятся на самом дне, неаверсарианские свободные люди — над ними, не владеющие магией аверсарианцы — ещё выше, а по мере продвижения к вершине социальной лестницы стоят все более могущественные [Concept('magi','маги')|E]. Большинство аверсарианских магов — это [Concept('living_magi','маги крови')|E], а простота использования и повсеместная распространенность этой школы в Аверсарии сделали ее самой распространенной формой магии на континенте.\n\nАверсария правила большей частью континента с 0 года по И.С. (Имперскому стандарту) — года основания Автократии. Исследователи в целом сходятся во мнении, что незадолго до этой даты Аверсария была объединена из ряда городов-государств в юго-западной Этепезее одним из многочисленных местных магов-военачальников, и в течение 200 лет с момента своего основания она установила контроль над большей частью Расколотого побережья.\n\nНо ни одна империя не может длиться вечно, и Аверсария не стала исключением. Ее последние дни были омрачены страданиями и хаосом, а последний автократ, [GetPlayer.MakeScope.Var('reigning_aautokratir').Char.GetFirstName], [GetPlayer.MakeScope.Var('reigning_aautokratir').Char.GetDeathReasonHideKiller] в [GetPlayer.MakeScope.Var('reigning_aautokratir').Char.GetDeathDate.GetYear] году. Некогда могущественное государство теперь осталось лишь воспоминанием, а его разрозненные руины покрывают Разрушенное побережье."
  GAME_CONCEPT_AVERSARIA_FALLBACK:0 "Аверсария — это название как региона, известного как «Расколотое побережье», так и государства, которое правило им и большей частью [Concept('the_continent','континента')|E|l] на протяжении почти всей задокументированной истории. Культура аверсарианцев, правящих этими землями, в значительной степени основана на [Concept('magic','магии')|E]: они верят, что только аверсарианцы обладают «чистой» кровью, и что ценность человека определяется именно чистотой этой крови. Аверсарианское общество имеет довольно строгую социальную иерархию, основанную на этом убеждении: рабы находятся на самом дне, неаверсарианские свободные люди — над ними, не владеющие магией аверсарианцы — ещё выше, а по мере продвижения к вершине социальной лестницы стоят все более могущественные [Concept('magi','маги')|E]. Большинство аверсарианских магов — это [Concept('living_magi','маги крови')|E], а простота использования и повсеместная распространенность этой школы в Аверсарии сделали ее самой распространенной формой магии на континенте.\n\nАверсария правила большей частью континента с 0 года по И.С. (Имперскому стандарту) — года основания Автократии. Исследователи в целом сходятся во мнении, что незадолго до этой даты Аверсария была объединена из ряда городов-государств в юго-западной Этепезее одним из многочисленных местных магов-военачальников, и в течение 200 лет с момента своего основания она установила контроль над большей частью Расколотого побережья."

  game_concept_ashen_aautokrata_fix:0 "Пепельная Автократия"
  game_concept_ashen_aautokrata_fix_desc:0 "После [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E] Аверсария представляла собой лишь поля, умытые кровью, кости, пожарища и руины. Поскольку Асиупольская Автократия и Аксиотея были уничтожены, [Concept('aeschraes','Эшрей')|E] остался один править на выжженном пепле империи. Те немногие провинции, которые у него оставались, он контролировал слабо, во многом полагаясь на таких лоялистов, как [Concept('karthyn_delenel','Картин Деленел')|E] и [Concept('demetros_detheniax','Деметрий Железный Шип')|E].\n\nВ 1229 году от И.С. Автократия Эшрея, его ставленники — и, как утверждалось, сам правитель — встретили свой конец от рук легана Исацеи во время [Concept('the_vilnian_assault','Вильнианского штурма')|E|l], после чего контроль над Орайсполем вскоре захватил губернатор Лик Ксенеферон. На самом деле Эшрей выжил. Но поскольку его опора была сокрушена, остатки его власти над Разрушенным побережьем окончательно развеялись после [Concept('six_great_revolts','Шести великих восстаний')|E]."

