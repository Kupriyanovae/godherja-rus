  game_concept_westerly_breeze:0 "Крушение «Западного бриза»"
  game_concept_westerly_breeze_desc:0 "К северу от Морской башни, на самом краю уединенного рифа, находится одна диковина. Здесь из моря вздымается каменная рука колоссальных размеров, сжимающая в своей хватке расколотые останки деревянного судна. Хотя она, предположительно, является частью более крупной статуи, ее масштабы таковы, что никому не удавалось погрузиться достаточно глубоко, чтобы разглядеть что-то дальше запястья. Когда [Concept('aversaria','Аверсария')|E] колонизировала этот регион, исследователи отметили находку как странность, но, будучи не в силах определить тип судна, со временем практически забыли о ней.\n\nВсё изменилось в 1022 году от И.С., когда ученый Махиос Ноттиокос сделал поразительное наблюдение: судно, зажатое в руке статуи и ранее признанное предыдущими исследователями неузнаваемым, но самобытным по своей конструкции, на самом деле имело явно современный аверсарианский стиль. Возглавив первую за несколько веков экспедицию для изучения корабля, он установил, что сильно сгнившая древесина никак не могла быть заготовлена ранее X века от И.С. Более того, один из наиболее хорошо сохранившихся гвоздей даже имел клеймо гильдии кузнецов, все ещё действующей в районе Тинитиды.\n\nХотя эта тайна безрезультатно поглотила следующее десятилетие карьеры Махиоса, она долгое время оставалась местной диковинкой, а его труды игнорировались вплоть до исчезновения самого «Западного бриза». Судно, представлявшее собой ультрасовременный торговый корабль новой конструкции, бесследно пропало посреди магического шторма в Южных островах. Заметив, что чертежи корабля имеют более чем мимолетное сходство с объектом его исследований, Махиос возглавил третью и последнюю крупную экспедицию к этому месту. Там, оторвав большой кусок прогнившего корпуса и тщательно изучив рельефы, они обнаружили едва заметный след высеченных на нем слов «Западный бриз»."
  ##REGION
  
  game_concept_imperial_isle:0 "Имперский остров"
  game_concept_imperial_isle_desc:0 "Аутарадейкос славится как один из самых красивых природных ландшафтов в мире — земля холмов, водопадов и одних из наиболее хорошо сохранившихся руин древней [Concept('aversaria','Аверсарии')|E]."
  
  #EVENTS
  game_concept_syatovian_assault:0 "Святовский штурм"
  game_concept_syatovian_assault_desc:0 "Святовский штурм, ставший одним из самых поворотных моментов Картараддской войны, был последней и величайшей атакой картараддских сил во время осады Тинитиды.\n\nПосле потери нескольких легионов в битве при Зафанире и столкнувшись с истощением припасов, [Glossary('осадный вортельск','GH_SIEGA_VORTELSK_GLOSS')] Святов приказал 284-му #font:RedactedScriptFont Броркскому#! карательному отряду пойти на штурм и прорвать поредевшие стены Тинитиды. Победа была уже близка, когда внезапно, к потрясению как картарадди (считавших их погибшими), так и [Concept('aversaria','аверсарианцев')|E] (считавших их дезертирами), появились бойцы ранее считавшегося уничтоженным LXVI легиона «Истребители драконов».\n\nНеожиданное появление таинственным образом пополнившего ряды и вооружившегося легиона повергло штурмующих в смятение, что позволило Тинитиде продержаться достаточно долго до прибытия подкреплений, положивших конец осаде.\n\nСолдаты LXVI легиона были прославлены как герои и спасшие Тинитиду защитники, а их лидер, леталагос [Concept('videro_cnavaius','Видеро Кнавайус')|E], удостоился личной похвалы от самого автократа Эрама."
  
