  game_concept_enisaloi_heritage_customs:0 "Наследственные обычаи энисалойцев"
  game_concept_enisaloi_heritage_customs_desc:0 "Энисалойцы ведут подробные записи о своих предках, отслеживая конкретные корабли, на которых те служили, и должности, которые они занимали, вплоть до времен [Concept('war_of_all_islands','Войны всех островов')|E]. Считается очень важным не только уважать деяния своих предков, но и проявлять социальную почтительность к другим людям на основании деяний и статуса их предшественников, что создает запутанную и часто непостижимую паутину взаимоотношений.\n\nЭто непреодолимое общественное давление находит отражение и в браках: сложные церемонии, призванные почтить преемственность постов и почестей, которыми обладали предки каждого из партнеров, являются необходимостью для получения общественного признания союза. Любая потенциальная пара должна обладать схожим совокупным статусом, иначе брак будет считаться неравным, поскольку один из супругов будет иметь большее влияние из-за чести своего рода. В Аверсарии ходит старая шутка, возможно, столь же древняя, как и сам Архексат, что царь вполне может оказаться недостойным того, чтобы жениться на нищенке."