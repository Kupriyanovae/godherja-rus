 game_concept_jaroc_bitter_root: "Ярок «Горький Корень»"
 game_concept_jaroc_bitter_root_desc: "Ярок «Горький Корень», почитаемый как самый известный сьялволк в [Concept('aversaria','аверсарианских')|E] сказаниях, был хускарлом из племени фенвиров в X веке. Его изгнали из рода после того, как он не сумел уберечь своего вождя во время охоты на троллей. Плутая, он добрел до южной Катраддии, где встретил Хартию Гисреддинских паладинов — странствующее наемное братство [Concept('marchers','марочников')|E], к которому впоследствии и примкнул. Во время службы в Айроное Ярок спас наместника Ричийца Матриакса от неминуемой гибели от рук [Concept('magi','мага')|E] Мортора по прозвищу «Паук», которого северянин расчленил своим топором.\n\nВ награду Ярок был нанят личным телохранителем наместника; его часто изображали на портретах рядом с господином, который с гордостью выставлял воина перед своим двором, дабы придворные могли поглазеть на его могучее телосложение и суровый северный лик. Позже Матриакс передал бразды правления своей дочери Макленде и отправился в странствие в Катун-Кай. Ярок преданно последовал за ним на восток, после чего оба они навсегда исчезли со страниц анналов.\n\nЯрок остался крайне популярным народным героем, часто выступая в роли архетипа «верного» нелюдя. В некоторых вольнодумных свитках его даже приводят как пример несостоятельности аверсарианских убеждений о превосходстве людей, что достигло пика во время Агионистских восстаний. С годами образ Ярока часто переплетался со сказаниями о [Concept('sjaljar_jax','Сьяльяре Джаксе')|E], однако он продолжает жить и в собственных преданиях."
 
 #LOCATIONS
 
 #MISC

 game_concept_zelkavani_glassmaking: "Зелкаванское стеклоделие"
 game_concept_zelkavani_glassmaking_desc: "Мастерство работы со стеклом издавна служит столпом зелкаванского общества, тесно переплетаясь с его обычаями и религиозными обрядами. Эта традиция восходит к III веку от И.С. или даже к более ранним эпохам; изделия зелкаванского происхождения легко узнать по клейму мастера, имеющему форму примулы. Их можно встретить в таких далеких краях, как [Concept('kashirya','Каширия')|E] и Дахангон, и даже в виде оконных стекол в [Concept('sarradon','саррадонских')|E] храмах.\n\nЗелкаванское стекло славится огромным разнообразием форм и размеров — от крошечных бусин, флаконов и безделушек до кувшинов, изваяний и даже больших преломляющих пирамидионов, венчающих керкелойские стелы, а его чистота заставляет изделия сиять подобно лучезарному солнцу."

 game_concept_durgumags: "Дургумаги"
 game_concept_durgumags_desc: "Дургумаги — странные паукообразные твари, выглядящие так, будто гусеница соединила вместе два брюшка, причем на одной половине имеются хитиновые лапы и восемь больших темных глаз. Обладая кожей и волосяным покровом, напоминающими шкуру крупного рогатого скота, дургумаги дают высокоценную шелкошерсть, прочность и красота которой делают ее более востребованной, чем любой обычный шелк или мех."

 game_concept_kherkeloi_tin_trade: "Керкелойский оловянный путь"
 game_concept_kherkeloi_tin_trade_desc: "Олово и бронза издавна были делом жизни для керкелойских государств, питая рост их величественных городов-дворцов, снаряжая их рати и снабжая ремесленников необходимыми материалами. Поскольку многие местные оловянные рудники давно иссякли, по всему Айроною и в некоторых частях [Concept('kashirya','Каширии')|E] раскинулась обширная торговая сеть, облегчающая перевозку олова, бронзы и изделий из них по большей части известного мира.\n\nСамой известной жилой этой сети исторически был сухопутный маршрут от старой астиликской столицы Иалириан до великого города-дворца Исанда, проходивший через [Concept('kalassyan_valley','Каласскую долину')|E] и несказанно обогащавший ее жителей. Хотя с началом [Concept('wars_of_dominion','Войн за господство')|E] торговля сильно пришла в упадок, окончательно ее затмили лишь завоевания [Concept('ertomax','Эртомакса')|E], когда первенство перешло к морскому пути, ведущему к рудникам [Concept('krehejad_biozone','Крехеджада')|E]."

 game_concept_sevra_par: "Севра Пар"
 game_concept_sevra_par_desc: "[Glossary('Севра Пар','GH_SEVRA_PAR_GLOSS')] — древняя традиция коренных жителей [Concept('kalassyan_valley','Каласской долины')|E] в [Concept('aironoian_southeast_biozone','Юго-Восточном Айроное')|E], согласно которой группы воинов и отважной молодежи исполняют сложный танец, метая топоры при смене партнеров. Обычно исполняемый после победных битв, на свадьбах и пред пиршествами, этот танец проводится с боевым оружием и при минимальном доспешном снаряжении; от детей, впрочем, ожидается использование деревянных жезлов во избежание тяжелых увечий."