 game_concept_battle_of_the_wall_of_astila:0 "Битва у стены Астилы"
 game_concept_battle_of_the_wall_of_astila_desc:0 "Битва у стены Астилы была финальным сражением в [Concept('bayyuralar','Байюраларе')|E]. В месте, известном ныне как стена Астилы, Байтор поспешил на выручку клану Корсакай Кхатана, который переправился через реку и завязал бой с астиликскими войсками. Уступая по силе солдатам Астилы, Корсакай Кхатан держался в надежде, что войска Байтора успеют прийти к нему на помощь. Когда силы Байтора переходили вброд ручей, чтобы добраться до клана Корсакая, конь Байтора оступился и сбросил всадника. Хотя свидетельства расходятся (брат и вассал Байтора Могха писал, что тот разбился головой о камни и уплыл по течению, а вождь хайяшегов Оготэй Танкхатан утверждал, что Байтора утянули на дно доспехи и маски поверженных им воинов, не позволившие ему выплыть), он утонул прежде, чем его хайяшеги успели спешиться и спасти его. Как его тело, так и меч его деда, [Concept('iorne_seld','Иорне Сельд')|E], были поглощены рекой.\n\nПосле его гибели войска были ввергнуты в смятение, и многие кланы хотели дезертировать. Однако Оготэй и Могха сплотили их для спасения сил Корсакая, перешли ручей и дали астиликам генеральное сражение, хотя в итоге их отбросили обратно за реку вместе с Корсакаем и остатками его клана. Впоследствии Ольтенcкая орда рассеялась в ходе [Concept('aironoian_migration','Айронойского переселения')|E].\n\nЭта битва нанесла смертельный удар [Concept('otachedian_empire','Отачедской империи')|E], которая вскоре распалась. Впрочем, она также привела к притоку ольтенских культур и религий в Айроной и появлению новых империй в последующие века. Сомнительно, что Байтор, не утони он тогда, смог бы выиграть эту битву. Ольтены уступали врагу в снаряжении, выучке и знании здешних мест, а отказ Байтора усилить свои войска каширцами привёл к тому, что в плане [Concept('magi','магии')|E] они полагались лишь на ольтенских шаманов, которые ничего не могли противопоставить звериным магам Астиликской империи."
 
 game_concept_aironoian_migration:0 "Айронойское переселение"
 game_concept_aironoian_migration_desc:0 "Айронойское переселение — это расселение ольтенских кланов в Айроной после [Concept('battle_of_the_wall_of_astila','Битвы у стены Астилы')|E]. После смерти кагакхатана Байтора его армия в основном распалась на отряды командиров, которые вытеснили или ассимилировали коренное население на своих землях. Самым видным из этих командиров был Корсакай Кхатан, который выжил в битве, хотя и остался хромым из-за удара топором по бедру.\n\nХотя клан Корсакай Кхатана был почти полностью истреблён, воинская доблесть и харизма позволили ему получить влияние над остальными командирами, и вскоре он провозгласил себя хайякхатаном. Другие влиятельные кхатаны из армии Байтора последовали его примеру, однако их империи рухнули сразу после их кончины, в то время как держава Корсакая просуществовала ещё целое поколение после его смерти.\n\nПока большинство ольтенов, последовавших за Байтором, предпочли остаться в Айроное и ковать собственную судьбу, остальные либо вернулись в Каширию вместе с Оготэем и Могхой, либо ушли в другие земли. Одной из особенностей этого переселения стало восприятие Байтора как героя, ушедшего до срока; это мнение распространял Корсакай, глубоко уважавший Байтора, тогда как Оготэй и Могха по возвращении в Каширию принялись его демонизировать."
 
 game_concept_charchac_revolt:0 "Чарчакское восстание"
 game_concept_svanti_revolt:0 "Свантийское восстание"
 game_concept_charchac_revolt_desc:0 "Истощённые как [Concept('imperial_civil_war','Гражданской войной в Аверсарии')|E], так и [Concept('frodbrokna','Фродброкной')|E], амагейские рабские плантации пришли в упадок на заре XIII века. На этом фоне вспыхнуло Чарчакское восстание (иногда называемое Свантийским восстанием), участники которого заявили права на земли народов дранети и чарчаков. Хотя боевые действия велись с перерывами с 1200 по 1250 год от И.С., а после падения Ксагро в 1224 году наступило относительное затишье, самые кровопролитные бои развернулись с 1240 года от И.С. Под предводительством Кренверсо сейе нас Дарашбала восставшие едва не отбили [Concept('fire_gate','Огненные врата')|E], однако [Concept('fiery_chariots_night','Ночь огненных колесниц')|E] мгновенно раздробила восстание на мелкие отряды незначительных командиров."
 
 game_concept_fiery_chariots_night:0 "Ночь огненных колесниц"
 game_concept_fiery_chariots_night_desc:0 "Ночь огненных колесниц стала кульминацией [Concept('charchac_revolt','Свантийского восстания')|E] во втором месяце 1250 года от И.С. Под безжалостным командованием Кренверсо Дарашбала армии Сванти двинулись на штурм, чтобы вернуть [Concept('fire_gate','Огненные врата')|E]. Будучи самым выдающимся чарчакским [Concept('living_magi','Магом огня')|E] за последние столетия, Кренверсо удостаивался сравнений с богами Алау Сакмира, что за Вратами. Поход ради возвращения пути в обитель богов должен был стать последним шагом в его борьбе за освобождение родовых гор его народа от власти Амагеи.\n\nОднако у подножия Алау Коев Кренверсо столкнулся с [Concept('magi','магом')|E], который был куда опытнее его. Вахктан Вашвили, вампирский принц Амагеи, возглавлял дисциплинированное войско, вдвое превосходившее по численности свантийский походный отряд. Буквально за секунды после столкновения гора превратилась в хаотичную бойню, перемежающуюся яростными проявлениями [Concept('living_magic','живой магии')|E]. Ни одна из сторон не желала признавать поражение, даже когда плоть Кренверсо начала обугливаться под сильным жаром его собственного пламени.\n\nБитва была проиграна чарчаками, когда правый фланг орды Кренверсо был смят налётом третьей силы — «Белого льва» Акакиха Казвелли. Многие уцелевшие в ту ночь чарчаки утверждали, будто их конница походила на огненные колесницы, явившиеся из чертогов богов, дабы покарать безумного короля Сванти за святотатство. В начавшейся суматохе командиры предали Кренверсо, вынудив его бежать на восток и оставить свою цель.\n\nПозор этого поражения стал началом конца для [Concept('charchac_revolt','Чарчакского восстания')|E]. Пытаясь вернуть утраченное лицо, Кренверсо в последующие месяцы жестоко казнил всех своих командиров, которых только смог разыскать. Вид освежёванного чудовища, хладнокровно терзающего тех, кто некогда звал его другом, внушал ужас повсюду, где бы он ни появлялся. К концу 1250 года от И.С. под властью Кренверсо остались лишь земли вокруг Ксагро."
 
 game_concept_dethiclas_sun:0 "Детиклас"
 game_concept_daharat_sun:0 "Солнце Дахарата"
 game_concept_daharat_sun_desc:0 "Опахасийский [Concept('magi','маг')|E] Детиклас объявил, что обнаружил ритуал, в точности соответствующий преданиям об [Concept('fire_gate','Огненных вратах')|E] — древнее заклинание телепортации, найденное им в ходе совместных исследований с видваукеятранскими учёными. Однако доказать теорию так и не удалось: Детиклас, сам ритуал и учёные академии в Дахарате (вместе с самой академией, городом и его окрестностями) были уничтожены, когда попытались воссоздать заклинание и случайно призвали в городе миниатюрное солнце на две-три секунды."
 
 game_concept_retributive_march:0 "Карательный марш"
 game_concept_retributive_march_desc:0 "После уничтожения четырёх легионов во время [Concept('blue_robe_revolt','Восстания синих мантий')|E] Аксиотея приказала наёмному военачальнику [Concept('agos_slyn','Агосу Слину')|E] возглавить пятнадцать легионов в военной кампании, получившей название «Карательный марш».\n\nИх целью было не просто подавить восстание и жестоко казнить его зачинщиков, но и убить каждого шестого жителя в любом городе, подозреваемом в укрывательстве мятежников. Агосу также было велено казнить всех беглых рабов, а после — и их хозяев за проявленную халатность."
 
 game_concept_blue_robe_revolt:0 "Восстание синих мантий"
 game_concept_blue_robe_revolt_desc:0 "Знаковое событие в Восточном Айроное на исходе [Concept('imperial_civil_war','Имперской гражданской войны')|E], Восстание синих мантий вспыхнуло в Айронойакаане — магической академии, учреждённой Аксиотеей. Несогласные студенты и преподаватели под предводительством магистра Велараса «Мрачного Спикера» Крейшати отказались продолжать исследования [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E] и совершили переворот, свергнув правящий совет академии. Вскоре к ним примкнули несколько дезертиров, а также два полных легиона, состоявших преимущественно из бывших бунтовщиков [Concept('three_cities_war','Войны трёх городов')|E].\n\nАксиотея приказала четырём легионам, дислоцированным на каширской границе, немедленно штурмовать академию. Однако, как только они выдвинулись на юг, каширские иррегулярные отряды под началом [Concept('akhasar','Ахасара')|E] атаковали их с тыла, полностью уничтожив все четыре легиона. Разъярённая Аксиотея, которая сама была [Concept('western_incursion','занята на фронтах войны')|E], поручила наёмному военачальнику [Concept('agos_slyn','Агосу Слину')|E] повести пятнадцать легионов в [Concept('retributive_march','Карательный марш')|E], который поначалу успешно усмирил треть восставших провинций. К несчастью, позже легионы попали в засаду из-за внезапного появления орды [Concept('jajak_otroka','Яяка Отроки')|E], что привело к [Concept('battle_of_baytors_grave','Битве у могилы Байтора')|E].\n\nРазгром почти пятнадцати легионов привёл к тому, что восстание вышло из-под контроля. Это вынудило Агоса Слина предпринять [Concept('battle_for_the_aironoiakaan','отчаянный штурм')|E] Айронойакаана. Мятеж завершился через несколько дней после первой битвы из-за вспыхнувшей [Concept('frodbrokna','Фродброкны')|E], пламя которой поглотило большую часть сражавшихся сил."
 
 game_concept_battle_of_baytors_grave:0 "Битва у могилы Байтора"
 game_concept_battle_of_baytors_grave_desc:0 "Поворотный момент [Concept('blue_robe_revolt','Восстания синих мантий')|E], Битва у могилы Байтора получила своё название в честь небольшого ручья, пересекавшего поле боя. Сражение длилось четырнадцать дней, в течение которых [Concept('aversaria','аверсарианские')|E] легионы под командованием [Concept('agos_slyn','Агоса Слина')|E] выдерживали постоянные натиски ольтенской орды [Concept('jajak_otroka','Яяка Отроки')|E]. В самый разгар ожесточённой схватки внезапно появился каширский военачальник [Concept('akhasar','Ахасар')|E], со своими сотнями партизан буквально восставший из вод мелководного ручья.\n\nЕго появление повергло в шок как аверсарианцев, так и ольтенов, ведь он явился, сжимая в руках, судя по всему, сам [Concept('iorne_seld','Иорне Сельд')|E]. Разгневанный тем, что чужеземец посмел присвоить легендарный клинок его народа, Яяк приказал предпринять яростный натиск на аверсарианский лагерь, где, по слухам, Агос Слин как раз скрестил мечи с Ахасаром. Из-за пересечённой местности и мощных тыловых укреплений аверсарианцев этот штурм дался тяжело, стоив жизни почти половине личной гвардии Яяка, а сам ольтенский вождь был пронзён не менее чем шестью стрелами.\n\nОднако, к его разочарованию, Ахасара и след простыл, а Агос вскоре отдал приказ о контрнаступлении. Обе стороны понесли настолько тяжёлые потери, что предпочли выйти из боя и спешно отступить: Агос — на юг, а раздосадованный Яяк — обратно на север. Весть о том, что пятнадцать легионов едва не были стёрты в порошок, вызвала политический пожар на востоке, и знать принялась помогать повстанцам, посылая им подкрепления, припасы и золото — это и побудило Агоса Слина отдать приказ о [Concept('battle_for_the_aironoiakaan','последнем решительном штурме Айронойакаана')|E]."
 
 game_concept_battle_for_the_aironoiakaan:0 "Битва за Айронойакаан"
 game_concept_battle_for_the_aironoiakaan_desc:0 "Когда [Concept('blue_robe_revolt','Восстание синих мантий')|E] вышло из-под контроля после катастрофической [Concept('battle_of_baytors_grave','Битвы у могилы Байтора')|E], [Concept('agos_slyn','Агос Слин')|E] отдал приказ об отчаянном штурме [GetBuilding('01_aironoiakaan').GetName], чтобы покончить с мятежом. Агос стремительно повёл свои силы через каньоны к академии, но ему не суждено было добраться туда первым.\n\n[Concept('jajak_otroka','Яяк Отрока')|E], стремясь исполнить свою клятву доставить голову Агоса Аксиотее, прибыл к каньонам со своей ордой. Чтобы окончательно запутать ситуацию, на поле боя по неизвестным причинам снова появился [Concept('akhasar','Ахасар')|E], из-за чего Агос оставил свои оборонительные рубежи и приказал легионам окружить и уничтожить повстанцев — даже рискуя оставить меньше людей для штурма академии.\n\nПозже к битве присоединились ещё две стороны: местные повстанцы напали на три фракции и начали серию молниеносных набегов. Однако последняя сторона оказалась самой неожиданной. Синие мантии, несмотря на все свои заявления о праведности, объявили освобождение Аксиотеей способных к магии рабов Айроноя незаконным и повторно поработили несколько сотен студентов и преподавателей. Из-за восстания рабов академия быстро погрузилась в хаос и разорение, а Звёздная башня загорелась и начала рушиться.\n\nК концу битвы все силы были обескровлены, но почти не приблизились к своим целям: все три полководца остались живы, местным жителям не удалось изгнать чужеземцев, а сама академия устояла. После дня отдыха Веларас «Мрачный Спикер» объявил со стен, что истинные [Concept('magi','маги')|E] вновь одержали победу и отныне академия выдержит любой натиск.\n\nБитва завершилась менее чем через сутки, когда [Concept('selfreplicating_blood_magic','самовоспроизводящаяся магия крови')|E] уничтожила Синих мантий и всех сражавшихся внутри башни. Внизу же пожары поглотили почти все собравшиеся там войска — включая большую часть оставшихся легионов Восточного Айроноя, — что и положило конец мятежу."
 
 game_concept_three_cities_war:0 "Война трёх городов"
 game_concept_three_cities_war_desc:0 "Война трёх городов, разразившаяся в Восточном Айроное в последние годы правления автократа Анесимасиоса, была восстанием одноимённой Лиги трёх городов, члены которой считали, что попытки Анесимасиоса сблизить восток и запад лишат Айроной большей части его могущества. Лига под предводительством самопровозглашённой «подавтократией» Делендеи Бхатахарракс требовала шестикратного снижения пошлин, освобождения от ряда торговых законов, а также передачи Делендее контроля над Восточно-Речным магистратом. Рассказывали даже, что Делендея во всеуслышание заявляла, будто сама убьёт Анесимасиоса, если их требования не будут выполнены.\n\nВ ответ Анесимасиос в попытке решить вопрос без кровопролития приказал наложить эмбарго на товары из трёх городов. Разъярённая Делендея неожиданно приказала войскам Лиги вместе с контингентом каширийских наёмников атаковать дислоцированные в этом районе имперские силы, что привело к уничтожению нескольких застигнутых врасплох благородных легионов Айроноя.\n\nСмерть автократа Анесимасиоса и последовавшая за ней [Concept('imperial_civil_war','Гражданская война в Аверсарии')|E] привели к тому, что на протяжении двух лет восстание никто не подавлял, из-за чего теряющая рассудок Делендея объявила о независимости региона от [Concept('aversaria','Аверсарии')|E]. Однако в 1188 году от И.С. Аксиотея, стремившаяся укрепить свою опору власти, прибыла в Восточный Айроной и легко разгромила мятеж своими легионами. Аксиотея лично казнила Делендею и истребила всю её династию вместе со всеми ключевыми лидерами Лиги."

 game_concept_wars_of_dominion:0 "Войны за господство"
 game_concept_wars_of_dominion_desc:0 "Войны за господство были периодом внутренних распрей среди сунакари, характеризовавшимся затяжной борьбой за власть между гегемоном [Glossary('Казвоском','GH_KAZVOSK_GLOSS')] и его данниками с одной стороны и Можжевеловой лигой независимых городов-дворцов с другой в первом и втором веках от И.С.\n\nХотя поначалу все стороны соблюдали взаимно согласованные правила ведения войны, непрекращающиеся боевые действия постепенно ввергли как Казвоск, так и Лигу в жестокость и бессмысленное насилие, что вылилось в пресловутое [Concept('desiccation_of_kazvosk','Иссушение Казвоска')|E]. Несмотря на победу, Можжевеловая лига тоже вскоре распалась: бывшие командиры и генералы быстро захватили власть и пошли друг на друга войной в качестве мелких царьков, положив конец эпохе городов-дворцов в истории сунакари." 

 game_concept_desiccation_of_kazvosk:0 "Иссушение Казвоска"
 game_concept_desiccation_of_kazvosk_desc:0 "Иссушение [Glossary('Казвоска','GH_KAZVOSK_GLOSS')] стало заключительной главой [Concept('wars_of_dominion','Войн за господство')|E] — череды длительных военных конфликтов между городами-дворцами сунакари в первом и втором веках от И.С. После нескольких тяжёлых поражений, нанесённых армиям казув объединёнными силами Можжевеловой лиги, сам Казвоск оказался в осаде, длившейся более восьми лет.\n\nЗащищённый своими могучими, укреплёнными магией стенами, город пал лишь в 163 году от И.С., когда после долгих размышлений осаждающие применили Галитовое копьё, превратив весь Казвоск и большую часть его жителей в соль."

 game_concept_astilik_empire:0 "Астиликская империя"
 game_concept_astilik_empire_desc:0 "Астиликская империя была великой [Concept('aironoian_bronze_age','древней айронойской цивилизацией')|E], существовавшей в той или иной форме по меньшей мере с 1000 года до И.С. примерно до 800 года от И.С., когда она распалась в результате [Concept('intermediary_wars','Промежуточных войн')|E] (хотя обе даты вызывают бурные споры среди учёных и археологов). Традиционно астиликам приписывают создание мягкого климата в [Concept('western_aironoi_biozone','Западном Айроное')|E] усилиями их [Concept('magi','магов')|E]. Могущество и влияние Астиликской империи то росли, то угасали на протяжении веков; в эпоху своего расцвета она простиралась от Асиуполи на западе до разрозненных и слабо контролируемых восточных данников эпохи после [Concept('ertomax','Эртомакса')|E].\n\nИмперия подверглась мощному натиску со стороны мародёрствующих ольтенских орд на заре [Concept('aironoian_migration','Айронойского переселения')|E], что ускорило её упадок: богатые землевладельцы и целые города-дворцы начали забирать власть в свои руки в ущерб ослабевшему центральному правительству, создавая собственные ополчения и задерживая зерно и налоги. Эта уязвимость, в свою очередь, была с большим успехом использована наступавшими [Concept('aversaria','аверсарианцами')|E], и в итоге империя пала под ударами объединённой аверсаро-ольтенской коалиции вскоре после подписания [Concept('four_masked_compromises','Четырёх маскированных компромиссов')|E]."

 game_concept_intermediary_wars:0 "Промежуточные войны"
 game_concept_intermediary_wars_desc:0 "Промежуточные войны — серия военных конфликтов между опахасийской знатью и [Concept('astilik_empire','Астиликской империей')|E], длившихся с 399 по примерно 800 год от И.С. при минимальном участии [Concept('aversaria','Аверсарии')|E] в целом. Часто рассматриваемые астиликами как борьба между двумя великими империями, эти войны на самом деле были во многом частной инициативой отдельных благородных домов и предприимчивых купеческих компаний, действовавших с молчаливого согласия автократии.\n\nНесмотря на быструю потерю побережья, отошедшего к аверсарианцам, Астиликская империя упорно сопротивлялась дальнейшему продвижению вглубь материка и даже сумела одержать несколько побед над особо безрассудными отрядами. Лишь после того, как между аверсарианцами и айронойскими ольтeнами были подписаны [Concept('four_masked_compromises','Четыре маскированных компромисса')|E], Астиликская империя окончательно не выдержала натиска и была разделена между ними."

 game_concept_four_masked_compromises:0 "Четыре маскированных компромисса"
 game_concept_four_masked_compromises_desc:0 "«Четыре маскированных компромисса» — название договора, подписанного между [Concept('aversaria','Аверсарией')|E] и советом айронойских ольтенских вождей и кхатанов в 781 году от И.С. Этот договор определял планы по разделу угасающей [Concept('astilik_empire','Астиликской империи')|E], а также гарантировал ольтенам место в аверсарианской иерархии. Пакт официально признал ольтенов братской для аверсарианцев расой и утерянным племенем [Concept('first_empire','Первой империи')|E], защитив их от религиозных и культурных преследований и пообежав самоуправление в [Concept('great_steppe_biozone','Айронойской степи')|E], хотя технически они оставались подданными автократии.\n\nДоговор оказался крайне успешным: в последующие века ольтены установили тесные связи с аверсарианской армией в качестве ценных вспомогательных войск и искусных всадников. Они участвовали в кампаниях в таких далёких землях, как Катраддия и даже [Concept('sarradon','Саррадон')|E], неся быструю гибель врагам автократии ради земли и монет."

 game_concept_aironoian_bronze_age:0 "Айронойский бронзовый век"
 game_concept_aironoian_bronze_age_desc:0 "Айронойский бронзовый век — период истории Айроноя, который традиционно определяется как промежуток примерно с 2500 года до И.С. по 399 год от И.С. и завершается прибытием в регион [Concept('aversaria','Аверсарии')|E]. В это время регион пережил расцвет и падение многих великих государств и империй, от долговечной [Concept('astilik_empire','Астиликской империи')|E] и священных речных государств [Concept('kasiryat_biozone','Касирият')|E] до царства [Concept('ertomax','Эртомакса')|E] и бесчисленных предольтенских кочевых конфедераций [Concept('great_steppe_biozone','Айронойской степи')|E].\n\nОгромные торговые сети, такие как [Concept('kherkeloi_tin_trade','Керкелойский оловянный путь')|E], охватывали большую часть Айроноя, облегчая перемещение огромного количества олова, серебра и других товаров по всему региону и за его пределы. Тем не менее, даже они пришли в упадок и в конце концов рухнули из-за нестабильности, опустынивания и [Concept('aironoian_migration','прибытия ольтенов')|E], что ознаменовало начало конца для местных цивилизаций."
 
 #CHARACTERS
 
 game_concept_agos_slyn:0 "Агос Слин"
 game_concept_agos_slyn_desc:0 "Прославленный наёмник, военачальник и, как утверждают, любовник Аксиотеи, Агос Слин служил её заместителем в Восточном Айроное на исходе [Concept('imperial_civil_war','Имперской гражданской войны')|E]. Позже он возглавил легионы Аксиотеи в [Concept('retributive_march','Карательном марше')|E], призванном положить конец [Concept('blue_robe_revolt','Восстанию синих мантий')|E]. У самого Агоса были личные счёты с каширским полководцем [Concept('akhasar','Ахасаром')|E], поскольку тот сыграл ключевую роль в гибели его возлюбленного и друга детства — Легана Акса по прозвищу «Щепка».\n\nВпоследствии Агос столкнулся с ольтенской ордой под предводительством [Concept('jajak_otroka','Яяка Отроки')|E], который стремился заполучить его голову, дабы исполнить клятву, данную Аксиотее. Последовавшая за этим [Concept('battle_of_baytors_grave','Битва у могилы Байтора')|E] обернулась катастрофой для [Concept('aversaria','аверсарианцев')|E], вынудив Агоса предпринять [Concept('battle_for_the_aironoiakaan','отчаянный штурм Айронойакаана')|E].\n\nАгос пережил как финальное сражение, так и [Concept('frodbrokna','Фродброкну')|E], но остался сильно обожжённым и травмированным увиденным. Позже он бросился в южный рукав Могилы Байтора — ручья на другой стороне полей, где развернулась его [Concept('battle_of_baytors_grave','битва')|E] с ольтенами. К тому времени как люди сумели выловить его, великий воин уже утонул."
 
 game_concept_akhasar:0 "Ахасар"
 game_concept_akhasar_desc:0 "Легендарный каширский генерал времён [Concept('blue_robe_revolt','Восстания синих мантий')|E], Ахасар «Сын многих солнц» Санорайаттакаш'тайя поначалу подвергался порицанию за то, что в течение пяти лет избегал любого открытого сражения с [Concept('aversaria','аверсарианцами')|E], несмотря на их многочисленные набеги. Однако вскоре Ахасар доказал свой стратегический талант, атаковав маршировавшие на юг для подавления бунта аверсарианские легионы и полностью уничтожив два из них. Затем он повёл отряд партизан в Айроной, всего за одну неделю уничтожив почти все склады снабжения вдоль южной границы.\n\nПозже Ахасар внезапно появился в самом разгаре [Concept('battle_of_baytors_grave','Битвы у могилы Байтора')|E], сжимая в руках, к удивлению как аверсарианских, так и ольтенских воинов, нечто похожее на легендарный [Concept('iorne_seld','Иорне Сельд')|E]. Он сеял хаос в аверсарианских рядах, лично сойдясь в дуэли с [Concept('agos_slyn','Агосом Слином')|E], а после хитроумно укрылся в повозках вражеского обоза, уклонившись от столкновения с [Concept('jajak_otroka','Яяком Отрокой')|E]. Своё последнее появление каширский генерал совершил в [Concept('battle_for_the_aironoiakaan','Битве за Айронойакаан')|E], возглавив остатки своих партизан. Мотивы его атаки остаются загадкой как для легенд, так и для хроник, однако многие предполагают, что его конечной целью было проникновение в Айронойакаан ради похищения могущественных артефактов, хранившихся в его нижних подземных залах.\n\nНеизвестно, выжил ли Ахасар в той финальной битве или во время [Concept('frodbrokna','Фродброкны')|E] — после этих событий великий воин навсегда исчез со страниц истории."
 
 game_concept_jajak_otroka:0 "Яяк Отрока"
 game_concept_jajak_otroka_desc:0 "Яяк Отрока, правивший огромным кхатанатом в Айронойской степи, был могущественным ольтенским полководцем, жившим в самом конце двенадцатого века. Во время [Concept('imperial_civil_war','Имперской гражданской войны')|E] Аксиотея направила к ольтенам послов с приказом примкнуть к её силам. Гордый Яяк не только обезглавил её посла, но и потребовал восстановления родовых прав ольтенов, пригрозив в противном случае забрать жизнь её величайшего воина и бросить его голову на ступени её дворца. В ответ Аксиотея объявила Яяка вне закона, что побудило его собрать орду таких размеров, каких Айроной не видел уже многие столетия.\n\nЗатем он обрушился на [Concept('aversaria','аверсарианские')|E] легионы под командованием [Concept('agos_slyn','Агоса Слина')|E], застав их врасплох в [Concept('battle_of_baytors_grave','Битве у могилы Байтора')|E]. В разгар сражения Яяк пришёл в ярость при виде [Concept('akhasar','Ахасара')|E], державшего нечто похожее на легендарный [Concept('iorne_seld','Иорне Сельд')|E], что заставило его очертя голову броситься на аверсарианские оборонительные линии, получив при этом не менее шести стрел. Тем не менее он выжил в бою и позже вновь явился со своей ордой на [Concept('battle_for_the_aironoiakaan','Битву за Айронойакаан')|E].\n\nК несчастью, Яяку так и не удалось убить Агоса Слина в той финальной битве. Когда позже от проходивших мимо беженцев он узнал, что Агос сам лишил себя жизни, вождь, по сообщениям, закричал в такой ярости, что содрогнулись сами горы. После этого Яяк отверг все сорок восемь масок, что собрал за свою жизнь, и пошёл на шаг, который поверг ольтенов в ужас: сорвал свою собственную маску и сбросил её в каньон.\n\nЗатем в безумном порыве он погнал своего коня на юго-запад, в Красные земли, заявив, что более не имеет права зваться ольтеном."
 
