 game_concept_battle_of_the_wall_of_astila: "Битва у стены Астилы"
 game_concept_battle_of_the_wall_of_astila_desc: "Битва у стены Астилы стала решающим сражением в [Concept('bayyuralar','Байюраларе')|E]. У рубежа, известного ныне как стена Астилы, кагакхатан Байтор поспешил на выручку клану Корсакай Кхатана, который уже переправился через реку и завязал бой с астиликскими ратями. Уступая врагу числом и силой, Корсакай отчаянно держался, уповая лишь на скорый приход Байтора. Но когда воинство кагакхатана переходило вброд бурный ручей, конь Байтора оступился и сбросил всадника. Свидетельства летописцев о его кончине расходятся: брат и вассал покойного, Могха, писал, будто тот разбился головой о прибрежные камни и уплыл по течению; вождь же хайяшегов Оготэй Танкхатан утверждал, что Байтора утянули на дно доспехи и маски поверженных им врагов, не позволив выплыть. Так или иначе, правитель утонул прежде, чем его верные хайяшеги успели спешиться для спасения. Река поглотила как самого Байтора, так и легендарный меч его деда — [Concept('iorne_seld','Иорне Сельд')|E].\n\nОставшись без вождя, войско смешалось, и многие кланы помыслили о бегстве. Однако Оготэй и Могха сплотили ратников ради спасения погибающего Корсакая, форсировали ручей и дали астиликам генеральное сражение, хоть в итоге их и отбросили обратно за реку вместе с жалкими остатками корсакаева клана. Вскоре после этого Ольтенская орда рассеялась в вихре [Concept('aironoian_migration','Айронойского переселения')|E].\n\nЭтот разгром нанес смертельный удар [Concept('otachedian_empire','Отачедской империи')|E], предрешив ее скорый распад. Впрочем, поражение также привело к притоку ольтенской культуры и веры в Айроной, став зерном для новых держав грядущих веков. Едва ли Байтор смог бы выиграть эту битву, даже если бы выжил: ольтены сильно уступали врагу в снаряжении, выучке и знании здешних мест, а отказ хана усилить войска каширцами привел к тому, что в плане [Concept('magi','магии')|E] они полагались лишь на степных шаманов, беззащитных перед звериными магами Астиликской империи."
 
 game_concept_aironoian_migration: "Айронойское переселение"
 game_concept_aironoian_migration_desc: "Айронойское переселение — эпоха расселения ольтенских кланов на просторах Айроноя после сокрушительной [Concept('battle_of_the_wall_of_astila','Битвы у стены Астилы')|E]. Со смертью кагакхатана Байтора его великое воинство распалось на отряды отдельных воевод, которые принялись вытеснять или подчинять себе коренное население на захваченных землях. Самым видным из этих вождей стал Корсакай Кхатан, уцелевший в той резне, хоть и оставшийся хромым до конца дней из-за удара топором по бедру.\n\nИ пусть клан самого Корсакая был истреблен почти под корень, воинская доблесть и грозное красноречие помогли ему подчинить остальных воевод, и вскоре он провозгласил себя хайякхатаном. Другие сильные кхатаны из бывших соратников Байтора последовали его примеру, но их недолговечные империи рушились сразу после кончины создателей, тогда как держава Корсакая процветала еще целое поколение после того, как его отнесли в могилу.\n\nВ то время как большинство ольтенов, пришедших с Байтором, предпочли остаться в Айроное и ковать собственную судьбу, прочие либо вернулись в Каширию под знаменами Оготэя и Могхи, либо откочевали в чужие края. Примечательным исходом этого исхода стало рождение культа Байтора как безвременно ушедшего героя: эту веру рьяно насаждал Корсакай, глубоко чтивший память вождя, тогда как Оготэй и Могха по возвращении в Каширию принялись всячески очернять и демонизировать его имя."
 
 game_concept_charchac_revolt: "Чарчакское восстание"
 game_concept_svanti_revolt: "Свантийское восстание"
 game_concept_charchac_revolt_desc: "Разоренные [Concept('imperial_civil_war','Гражданской войной в Аверсарии')|E] и добитые [Concept('frodbrokna','Фродброкной')|E], амагейские невольничие плантации пришли в полное запустение на заре XIII века. На фоне этого упадка вспыхнуло яростное Чарчакское восстание (также зовущееся Свантийским), чьи участники заявили права на исконные земли народов дранетов и чарчаков. И хотя открытая война велась с перерывами с 1200 по 1250 год от И.С., а после падения Ксагро в 1224 году наступило временное затишье, самые кровавые сечи развернулись с 1240 года от И.С. Под началом Кренверсо сейе нас Дарашбала восставшие едва не захватили [Concept('fire_gate','Огненные врата')|E], однако зловещая [Concept('fiery_chariots_night','Ночь огненных колесниц')|E] в один миг раздробила мятежное воинство на мелкие, беззащитные отряды."
 
 game_concept_fiery_chariots_night: "Ночь огненных колесниц"
 game_concept_fiery_chariots_night_desc: "Ночь огненных колесниц стала кровавым венцом [Concept('charchac_revolt','Свантийского восстания')|E] во втором месяце 1250 года от И.С. Под безжалостной рукой Кренверсо Дарашбала армии Сванти двинулись на приступ, дабы вернуть [Concept('fire_gate','Огненные врата')|E]. Будучи величайшим чарчакским [Concept('living_magi','магом огня')|E] за последние века, Кренверсо при жизни удостаивался сравнений с богами Алау Сакмира, что обитали за Вратами. Поход ради возвращения пути в божественную обитель должен был стать последним шагом в его борьбе за освобождение родовых гор от ига Амагеи.\n\nОднако у подножия Алау Коев Кренверсо столкнулся с чернокнижником, чье мастерство превосходило его собственное. Вахктан Вашвили, вампирский принц Амагеи, возглавлял дисциплинированное воинство, вдвое превосходившее числом свантийский отряд. За считанные мгновения после сшибки склоны гор превратились в хаотичную бойню, озаряемую яростными сполохами [Concept('living_magic','живой магии')|E]. Ни одна сторона не желала уступать, даже когда плоть самого Кренверсо начала обугливаться под невыносимым жаром его собственного колдовского пламени.\n\nЧарчаки проиграли эту битву, когда их правый фланг был смят внезапным налетом третьей силы — «Белого льва» Акакиха Казвелли. Многие уцелевшие в ту ночь воины клялись, будто вражеская конница походила на огненные колесницы, явившиеся из чертогов богов, дабы покарать безумного короля Сванти за его гордыню и святотатство. В начавшейся суматохе командиры предали Кренверсо, вынудив его бежать на восток и оставить заветную цель.\n\nПозор этого разгрома предрешил исход [Concept('charchac_revolt','Чарчакского восстания')|E]. Пытаясь вернуть утраченное грозное имя, Кренверсо в последующие месяцы жестоко казнил каждого из своих воевод, кого только сумел разыскать. Вид освежеванного чудовища, хладнокровно терзающего бывших соратников, внушал ужас повсюду, где он появлялся. К исходу 1250 года от И.С. под властью безумца остались лишь сирые земли вокруг Ксагро."
 
 game_concept_dethiclas_sun: "Детиклас"
 game_concept_daharat_sun: "Солнце Дахарата"
 game_concept_daharat_sun_desc: "Опахасийский [Concept('magi','маг')|E] Детиклас заявил, что, по всей видимости, обнаружил ритуал, соответствующий преданиям об [Concept('fire_gate','Огненных вратах')|E], — древнее заклинание перемещения, найденное в ходе совместных исследований с видваукеятранскими учёными. Однако подтвердить эту теорию так и не удалось: Детиклас, сам ритуал и видваукеятранские учёные академии Дахарата погибли вместе с академией, городом и его окрестностями, когда при попытке воспроизвести ритуал они случайно вызвали в городе миниатюрное солнце на две-три секунды."
 
 game_concept_retributive_march: "Карательный марш"
 game_concept_retributive_march_desc: "После уничтожения четырёх легионов во время [Concept('blue_robe_revolt','Восстания синих мантий')|E] Аксиотея приказала наёмному военачальнику [Concept('agos_slyn','Агу Слину')|E] возглавить пятнадцать легионов в походе, получившем название «Карательный марш».\n\nИх целью было не только подавить восстание и жестоко казнить его зачинщиков, но и убить каждого шестого жителя любого города, заподозренного в укрывательстве мятежников. Агу также было приказано казнить всех беглых рабов, а затем и их хозяев за неумение удержать их."
 
 game_concept_blue_robe_revolt: "Восстание синих мантий"
 game_concept_blue_robe_revolt_desc: "Громкое событие в Восточном Айроное на исходе [Concept('imperial_civil_war','Имперской гражданской войны')|E]. Восстание синих мантий вспыхнуло в стенах Айронойакаана — великой чародейской академии, заложенной Аксиотеей. Бунтующие ученики и наставники под началом магистра Велараса «Мрачного Спикера» Крейшати отказались продолжать изыскания в области [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E] и совершили переворот, перебив правящий совет. Вскоре к бунтовщикам примкнули беглые воины, а также два полных легиона, состоявших по большей части из ветеранов [Concept('three_cities_war','Войны трех городов')|E].\n\nАксиотея приказала четырем легионам, стоявшим на каширийской границе, немедленно взять академию штурмом. Однако, едва они выдвинулись на юг, каширийские налетчики под началом [Concept('akhasar','Ахасара')|E] ударили им в тыл, вырезав легионы до последнего человека. Разъяренная Аксиотея, скованная [Concept('western_incursion','войной на западных фронтах')|E], поручила наемному воеводе [Concept('agos_slyn','Агосу Слину')|E] возглавить пятнадцать легионов и начать [Concept('retributive_march','Карательный марш')|E], который поначалу успешно усмирил треть восставших земель. К несчастью, позже легионы угодили в ловушку из-за внезапного появления ольтенской орды [Concept('jajak_otroka','Яяка Отроки')|E], что привело к жестокой [Concept('battle_of_baytors_grave','Битве у могилы Байтора')|E].\n\nРазгром почти пятнадцати легионов развязал повстанцам руки, и бунт захлестнул весь край. Это вынудило Ага Слина предпринять [Concept('battle_for_the_aironoiakaan','отчаянный штурм')|E] Айронойакаана. Мятеж угас через несколько дней после первой схватки из-за вспыхнувшей [Concept('frodbrokna','Фродброкны')|E], чье черное пламя поглотило большую часть сражавшихся армий."
 
 game_concept_battle_of_baytors_grave: "Битва у могилы Байтора"
 game_concept_battle_of_baytors_grave_desc: "Поворотный миг [Concept('blue_robe_revolt','Восстания синих мантий')|E], Битва у могилы Байтора получила свое имя в честь неприметного ручья, рассекавшего поле брани. Сеча длилась долгие четырнадцать дней, в течение которых [Concept('aversaria','аверсарианские')|E] легионы под началом [Concept('agos_slyn','Ага Слина')|E] выдерживали непрекращающийся натиск ольтенской орды [Concept('jajak_otroka','Яяка Отроки')|E]. В самый разгар побоища из вод мелководного ручья со своими отрядами партизан внезапно явился каширийский воевода [Concept('akhasar','Ахасар')|E].\n\nЕго появление повергло в изумление как аверсарианцев, так и ольтенов, ведь в руках пришлеца горел, судя по всему, сам [Concept('iorne_seld','Иорне Сельд')|E]. Разгневанный тем, что чужак посмел присвоить священный клинок его народа, Яяк приказал объявить яростный штурм аверсарианского стана, где, по слухам, Аг Слин как раз сошелся в поединке с Ахасаром. Из-за изрезанной местности и мощных укреплений имперцев этот штурм стоил ольтенам дорого: легла половина личной гвардии Яяка, а сам вождь был пронзен шестью стрелами.\n\nОднако, к его вящему разочарованию, Ахасара и след простыл, а оправившийся Аг вскоре бросил легионы в контрнаступление. Обе стороны понесли столь страшные потери, что поспешили выйти из боя и отступить: Аг — на юг, а раздосадованный Яяк — обратно в северные степи. Весть о том, что пятнадцать имперских легионов едва не были стерты в порошок, подняла бурю на востоке: знать принялась тайно помогать мятежникам, швыряя им припасы и золото, что и вынудило Ага Слина отдать приказ о [Concept('battle_for_the_aironoiakaan','последнем решительном штурме Айронойакаана')|E]."
 
 game_concept_battle_for_the_aironoiakaan: "Битва за Айронойакаан"
 game_concept_battle_for_the_aironoiakaan_desc: "Когда [Concept('blue_robe_revolt','Восстание синих мантий')|E] окончательно вышло из-под контроля после катастрофы в [Concept('battle_of_baytors_grave','Битве у могилы Байтора')|E], воевода [Concept('agos_slyn','Аг Слин')|E] приказал идти на отчаянный штурм [GetBuilding('01_aironoiakaan').GetName], дабы единым ударом обезглавить мятеж. Аг стремительно повел свои когорты через каньоны к твердыне магов, но ему не суждено было добраться туда первым.\n\n[Concept('jajak_otroka','Яяк Отрока')|E], поклявшийся доставить голову Ага пред очи Аксиотеи, преградил путь имперцам у каньонов со всей своей ордой. Чтобы окончательно запутать дело, на поле брани по неведомым причинам вновь объявился каширец [Concept('akhasar','Ахасар')|E]. Ослепленный жаждой мести, Аг оставил оборонительные рубежи и велел легионам окружить и истребить партизан — даже ценой ослабления сил, шедших на приступ академии.\n\nВскоре к резне примкнули новые силы: местные повстанцы ударили сразу по трем фракциям серией молниеносных набегов. Однако самый подлый удар нанесли сами Синие мантии. Вопреки всем своим речам о праведности и свободе, они объявили указ Аксиотеи об освобождении одаренных магией рабов незаконным и вновь заковали в кандалы сотни учеников и наставников. Из-за вспыхнувшего восстания невольников академия быстро погрузилась в хаос и грабежи, а Звездная башня загорелась и принялась рушиться.\n\nК исходу битвы все армии были обескровлены, но ни одна не добилась своего: все три полководца уцелели, простолюдины не смогли изгнать пришельцев, а сама твердыня выстояла. После дня передышки Веларас «Мрачный Спикер» объявил со стен, что истинные [Concept('magi','маги')|E] вновь одержали верх и отныне академия выдержит любой натиск.\n\nНо торжество было недолгим: менее чем через сутки [Concept('selfreplicating_blood_magic','самовоспроизводящаяся магия крови')|E] вырвалась наружу, истребив Синих мантий и всех, кто бился внутри башни. Внизу же страшные пожары поглотили почти все собравшиеся там войска — включая большую часть уцелевших легионов Восточного Айроноя, — что и положило конец этому великому безумию."
 
 game_concept_three_cities_war: "Война трех городов"
 game_concept_three_cities_war_desc: "Война трех городов, отгремевшая в Восточном Айроное в последние годы правления аавтократа Анесимасия, была восстанием одноименной Лиги трех городов. Ее члены считали, что попытки правителя сблизить восток и запад лишат Айроной былого величия. Лига под началом самопровозглашенной «подаавтократа» Делендеи Бхатахарракс требовала шестикратного снижения пошлин, отмены ряда торговых законов и передачи Делендее власти над Восточно-Речным магистратом. Поговаривали даже, будто Делендея во всеуслышание грозилась лично оборвать жизнь Анесимасия, если их условия не будут приняты.\n\nВ ответ Анесимасий, желая решить дело без пролития крови, повелел наложить эмбарго на товары мятежного союза. Разъяренная Делендея внезапно приказала ратям Лиги вместе с нанятыми каширийскими полками атаковать стоявшие в округе имперские силы, что привело к истреблению нескольких застигнутых врасплох благородных легионов Айроноя.\n\nСмерть аавтократа Анесимасия и последовавшая за ней [Concept('imperial_civil_war','Гражданская война в Аверсарии')|E] привели к тому, что на протяжении двух лет на бунтовщиков никто не обращал внимания. Потерявшая от безнаказанности рассудок Делендея объявила о полной независимости края от [Concept('aversaria','Аверсарии')|E]. Однако в 1188 году от И.С. Аксиотея, укрепляя свою личную власть, явилась в Восточный Айроной и без труда растоптала мятеж своими верными легионами. Она лично казнила Делендею и вырезала весь ее род вместе со всеми предводителями Лиги."

 game_concept_wars_of_dominion: "Войны за господство"
 game_concept_wars_of_dominion_desc: "Войны за господство — эпоха кровавых междоусобиц среди сунакаров, отмеченная затяжной борьбой за власть между гегемоном [Glossary('Казвоском','GH_KAZVOSK_GLOSS')] с его данниками с одной стороны и Можжевеловой лигой независимых городов-дворцов с другой, бушевавшая в первом и втором веках от И.С.\n\nИ хотя поначалу все воюющие блюли обоюдно принятые правила честной войны, бесконечные походы постепенно ожесточили как Казвоск, так и Лигу, ввергнув их в бессмысленное насилие, что в итоге привело к пресловутому [Concept('desiccation_of_kazvosk','Иссушению Казвоска')|E]. И пусть Можжевеловая лига вышла из этой бойни победительницей, она также вскоре распалась: бывшие воеводы и наемные генералы быстро прибрали власть к рукам и пошли друг на друга войной, став мелкими царьками и навсегда похоронив великую эпоху городов-дворцов сунакаров."

 game_concept_desiccation_of_kazvosk: "Иссушение Казвоска"
 game_concept_desiccation_of_kazvosk_desc: "Иссушение [Glossary('Казвоска','GH_KAZVOSK_GLOSS')] стало финальной главой [Concept('wars_of_dominion','Войн за господство')|E] — череды бесконечных войн между городами-дворцами сунакаров в первом и втором веках от И.С. После нескольких тяжелых поражений, нанесенных армиям казувов сплоченными силами Можжевеловой лиги, сам великий Казвоск оказался в тесном кольце осады, длившейся более восьми лет.\n\nЗащищенный своими могучими, укрепленными чарами стенами, город пал лишь в 163 году от И.С., когда после долгих споров осаждающие применили разрушительное Галитовое копье, в один миг обратив весь Казвоск и большую часть его жителей в безжизненную соль."

 game_concept_astilik_empire: "Астиликская империя"
 game_concept_astilik_empire_desc: "Астиликская империя — великая [Concept('aironoian_bronze_age','древняя айронойская цивилизация')|E], существовавшая в той или иной форме по меньшей мере с 1000 года до И.С. примерно до 800 года от И.С., когда она окончательно распалась в огне [Concept('intermediary_wars','Промежуточных войн')|E] (хотя обе даты доселе вызывают бурные споры среди книжников). По преданиям, именно астиликам приписывают сотворение благодатного мягкого климата в [Concept('western_aironoi_biozone','Западном Айроное')|E] усилиями их могучих [Concept('magi','магов')|E]. Могущество империи то крепло, то угасало на протяжении веков; в эпоху своего наивысшего расцвета она простиралась от Асиуполя на западе до разрозненных и слабо подконтрольных восточных данников эпохи после правления [Concept('ertomax','Эртомакса')|E].\n\nИмперия подверглась сокрушительному натиску со стороны кочующих ольтенских орд на заре [Concept('aironoian_migration','Айронойского переселения')|E], что ускорило ее закат: богатые вельможи и хозяева городов-дворцов принялись прибирать власть к рукам в ущерб слабому центральному престолу, собирая собственные ополчения и утаивая зерно и подати. Этим без труда воспользовались наступавшие [Concept('aversaria','аверсарианцы')|E], и в итоге древнее государство пало под ударами объединенных сил имперцев и ольтенов вскоре после подписания [Concept('four_masked_compromises','Четырех маскированных компромиссов')|E]."

 game_concept_intermediary_wars: "Промежуточные войны"
 game_concept_intermediary_wars_desc: "Промежуточные войны — череда военных столкновений между опахасийской знатью и [Concept('astilik_empire','Астиликской империей')|E], длившихся с 399 по 800 год от И.С. при малом участии самой [Concept('aversaria','Аверсарии')|E]. Астилики горделиво считали эти войны столкновением двух великих держав, но на деле они были по большей части частным делом отдельных благородных домов и предприимчивых купеческих гильдий, действовавших с молчаливого согласия [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )].\n\nНесмотря на скорую потерю побережья, отошедшего к имперцам, Астиликская империя упорно защищала внутренние земли материка и даже смогла нанести несколько поражений излишне самонадеянным отрядам завоевателей. Лишь после того, как между аверсарианцами и айронойскими ольтенами были заключены [Concept('four_masked_compromises','Четыре маскированных компромисса')|E], империя окончательно надорвалась под натиском и была разделена между победителями."

 game_concept_four_masked_compromises: "Четыре маскированных компромисса"
 game_concept_four_masked_compromises_desc: "«Четыре маскированных компромисса» — название мирного договора, заключенного между [Concept('aversaria','Аверсарией')|E] и советом айронойских ольтенских вождей и кхатанов в 781 году от И.С. Этот договор утвердил планы по разделу угасающей [Concept('astilik_empire','Астиликской империи')|E], а также закрепил за ольтенами место в имперской иерархии. Пакт официально признал ольтенов братской для аверсарианцев расой и утерянным коленом [Concept('first_empire','Первой империи')|E], защитив их от гонений на веру и культуру и даровав право на самоуправление в [Concept('great_steppe_biozone','Айронойской степи')|E], хотя на бумаге они оставались подданными престола.\n\nДоговор оказался на редкость удачным: в последующие века ольтены сблизились с имперской армией, став ценными союзными войсками и грозной конницей. Они участвовали в походах в такие далекие края, как Картараддия и даже [Concept('sarradon','Саррадон')|E], неся скорую гибель врагам [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )] ради новых земель и звонкой монеты."

 game_concept_aironoian_bronze_age: "Айронойский бронзовый век"
 game_concept_aironoian_bronze_age_desc: "Айронойский бронзовый век — эпоха в истории Айроноя, традиционно охватывающая промежуток примерно с 2500 года до И.С. по 399 год от И.С. и завершающаяся приходом в регион железных легионов [Concept('aversaria','Аверсарии')|E]. В это славное время край пережил расцвет и падение многих великих царств, от долговечной [Concept('astilik_empire','Астиликской империи')|E] и священных приречных государств [Concept('kasiryat_biozone','Каширият')|E] до древнего царства [Concept('ertomax','Эртомакса')|E] и бесчисленных предольтенских кочевых союзов [Concept('great_steppe_biozone','Айронойской степи')|E].\n\nВеликие торговые пути, такие как [Concept('kherkeloi_tin_trade','Керкелойский оловянный путь')|E], связывали большую часть Айроноя, позволяя купцам возить несметные запасы олова, серебра и иных ценностей по всему региону и за его пределы. Но даже эти союзы со временем пришли в упадок и рухнули под бременем междоусобиц, иссушения земель и [Concept('aironoian_migration','нашествия ольтенов')|E], что ознаменовало закат местных древних цивилизаций."
 
 #CHARACTERS
 
 game_concept_agos_slyn: "Аг Слин"
 game_concept_agos_slyn_desc: "Прославленный наемник, военачальник и, по слухам, любовник Аксиотеи, Аг Слин был её заместителем в Восточном Айроное на исходе [Concept('imperial_civil_war','Имперской гражданской войны')|E]. Позже он возглавил когорты Аксиотеи в [Concept('retributive_march','Карательном марше')|E], призванном утопить в крови [Concept('blue_robe_revolt','Восстание синих мантий')|E]. У Ага были личные счеты с каширийским полководцем [Concept('akhasar','Ахасаром')|E], чьи козни привели к гибели его возлюбленного и друга детства — Легана Акса по прозвищу «Щепка».\n\nВ ходе кампании Аг столкнулся с ольтенской ордой под началом [Concept('jajak_otroka','Яяка Отроки')|E], который поклялся добыть голову наемника ради исполнения обета, данного Аксиотее. Последовавшая за этим [Concept('battle_of_baytors_grave','Битва у могилы Байтора')|E] обернулась катастрофой для [Concept('aversaria','аверсарианцев')|E], вынудив Ага пойти на [Concept('battle_for_the_aironoiakaan','отчаянный штурм Айронойакаана')|E].\n\nАгос выжил в той финальной резне и перенес ужасы [Concept('frodbrokna','Фродброкны')|E], но страшные ожоги и пережитое безумие сломили его дух. Вскоре он бросился в южный рукав Могилы Байтора — ручья на краю бывших полей сражений. К тому времени как соратники сумели вытащить его из воды, великий воитель уже захлебнулся."
 
 game_concept_akhasar: "Ахасар"
 game_concept_akhasar_desc: "Легендарный каширийский воевода времен [Concept('blue_robe_revolt','Восстания синих мантий')|E], Ахасар «Сын многих солнц» Санорайаттакаш'тайя поначалу терпел поношения от соплеменников за то, что целых пять лет избегал открытого боя с [Concept('aversaria','аверсарианцами')|E], невзирая на их опустошительные набеги. Однако вскоре Ахасар доказал свой полководческий гений, подстерегши маршировавшие на юг карательные силы империи и полностью истребив два легиона. Следом он увлек отряд партизан в Айроной, всего за неделю предав огню почти все склады снабжения вдоль южных рубежей.\n\nПозже Ахасар внезапно объявился в самом разгаре [Concept('battle_of_baytors_grave','Битвы у могилы Байтора')|E], сжимая в руках — к изумлению как имперцев, так и ольтенов — нечто, разительно похожее на легендарный [Concept('iorne_seld','Иорне Сельд')|E]. Своим появлением он посеял смятение в имперских рядах, лично сошелся в поединке с [Concept('agos_slyn','Агосом Слином')|E], а после хитроумно спрятался среди повозок вражеского обоза, уйдя от столкновения с [Concept('jajak_otroka','Яяком Отрокой')|E]. Последний раз каширийский вождь явился во время [Concept('battle_for_the_aironoiakaan','Битвы за Айронойакаан')|E] во главе остатков своих ратников. Причины его атаки доселе остаются загадкой для хронистов: многие полагают, что его истинной целью было проникновение в нижние подземные залы академии ради похищения сокрытых там могущественных артефактов.\n\nНеизвестно, спасся ли Ахасар в той сече или сгинул в пламени [Concept('frodbrokna','Фродброкны')|E] — после этих потрясений великий воитель навсегда исчез со страниц истории."
 
 game_concept_jajak_otroka: "Яяк Отрока"
 game_concept_jajak_otroka_desc: "Яяк Отрока, повелевавший бескрайним кхатанатом в Айронойской степи, был грозным ольтенским полководцем на исходе двенадцатого века. Во время [Concept('imperial_civil_war','Имперской гражданской войны')|E] Аксиотея направила к ольтенам послов с требованием примкнуть к ее знамени. Гордый Яяк не просто отрубил кисти рук посланников, но и потребовал вернуть ольтенам их родовые права, пригрозив в противном случае убить ее лучшего воеводу и бросить его голову на ступени престола. В ответ Аксиотея объявила Яяка вне закона, что побудило хана собрать орду таких размеров, каких Айроной не видел уже многие столетия.\n\nСо своим воинством он обрушился на [Concept('aversaria','аверсарианские')|E] легионы под началом [Concept('agos_slyn','Ага Слина')|E], застав их врасплох в [Concept('battle_of_baytors_grave','Битве у могилы Байтора')|E]. В разгар побоища Яяк пришел в ярость, узрев [Concept('akhasar','Ахасара')|E] со священным клинком [Concept('iorne_seld','Иорне Сельд')|E] в руках; ослепленный гневом, хан очертя голову бросился на имперские оборонительные рубежи, поймав телом не менее шести стрел. Тем не менее он выжил и позже вновь привел орду к стенам цитадели в [Concept('battle_for_the_aironoiakaan','Битве за Айронойакаан')|E].\n\nК несчастью для Яяка, Аг Слин ушел от его меча в той финальной схватке. Когда позже от продольских беженцев хан узнал, что Аг сам лишил себя жизни, вождь, по заверению очевидцев, взревел в такой ярости, что содрогнулись окрестные скалы. В безумии Яяк отверг все сорок восемь масок, добытых им за долгие годы, и пошел на шаг, повергший ольтенов в священный ужас: сорвал с лица собственную маску и швырнул ее в бездну каньона.\n\nЗатем он погнал коня на юго-запад, в Красные земли, провозгласив, что отныне не имеет права зваться ольтеном."
 
 #GROUPS AND ORGANIZATIONS
 
 #LOCATIONS
 
 game_concept_alau_koev: "Алау Коев"
 game_concept_fire_gate: "Огненные врата"
 game_concept_fire_gate_desc: "Алау Коев, что на языке цетнера означает «Огненные врата», — памятник религиозного значения в Центральной Амагее. Верующие утверждают, что по ту сторону монолита находится обитель богов и что в любой миг гора вновь может озариться огнём иного мира. Из-за его значения для местных культур многие стремятся завладеть этим местом. Хотя сам монолит очень древний, его отождествление с легендарными Огненными вратами из предания об Алау Коеваце вызывает серьёзные споры. В первоначальных версиях предания монумент вовсе не упоминается, а на протяжении веков разные племена объявляли истинным местом древнего заклинания более десятка других мест, располагая столь же скудными доказательствами."

 game_concept_kalassyan_valley: "Каласская долина"
 game_concept_kalassyan_valley_desc: "Каласская долина — суровый край засушливых холмов и скалистых утесов, расположенный в [Concept('aironoian_southeast_biozone','Юго-Восточном Айроное')|E] к северу от гибельных [Concept('redlands_biozone','Красных земель')|E]. Увенчанная одной из древних [Concept('the_towers','Башен')|E] и служащая [Concept('kherkeloi_tin_trade','сухопутным мостом')|E] между [Concept('kashirya','Каширией')|E] и [Concept('western_aironoi_biozone','Западным Айроноем')|E], она знаменита своими бескрайними полями цветущих золотых маков и календулы, скрывающими склоны гор в самые урожайные годы."
 
 #MISC
 
 ##FAITHS
 game_concept_black_martyrs_custodians: "Хранители Чёрного Мученика"
 game_concept_black_martyrs_custodians_desc: "Священные смотрители заботятся о безумном Чёрном Мученике. Они облачают его в чёрную мантию и пытаются разделить его бессвязные, но зачастую пророческие речи на те, что совершенно недоступны смертному разуму, и те, что можно расшифровать ценой больших усилий. Однако даже в лучшие времена их толкования неточны, и предсказывать грядущие события им удаётся лишь изредка. Большинство винит в этом неумение смотрителей, тогда как некоторые считают, что сам Чёрный Мученик не обладает истинным даром пророчества.\n\nВ последнее время речи Мученика почти исключительно посвящены катаклизмам, а сам он с каждым мгновением становится всё более беспокойным."
 
 game_concept_giant_spiders_and_humans: "Гигантские пауки Красных земель"
 game_concept_giant_spiders_and_humans_desc: "Некоторые жители Красных земель почитают гигантских пауков и устраивают для них богато украшенные помещения в храмах. Пауков часто кормят жертвенными подношениями: считается, что служение им дарует великое могущество. Их содержат и в центрах городов; шёлк и яд, оставшиеся после Пира, используют для изготовления прочных доспехов и смертоносного оружия. Пауки также защищают от нападений города, ставшие их домом."
 
 game_concept_fallen_star: "Падшая Звезда"
 game_concept_fallen_star_desc: "Подлинное происхождение этого пришельца неизвестно. Своим именем он обязан как предполагаемому звёздному происхождению, так и внушительному облику. По наиболее распространённому преданию, его появление в виде фигуры, устремившейся к [Concept('aeras','Эрасу')|E], совпало с внезапным исчезновением звезды с ночного неба. Он не похож ни на одно известное существо. Обладая тысячами камнеподобных рук и ног, он чрезвычайно искусен в необычных ментальных [Concept('magic','магических искусствах')|E] и, как известно, призывает немногих избранных последователей, чтобы те учились у него.\n\nХотя власти [Concept('aversaria','Империи')|E] объявили Падшую Звезду выдумкой, её культ, по всей видимости, несколько раз возрождался после исчезновения — то ли усилиями тех, кто надеялся учиться у Падшей Звезды, то ли благодаря замыслам самого существа." 
 
 game_concept_schism_of_moon_cult: "Расколы Лунного культа"
 game_concept_schism_of_moon_cult_desc: "Последователи культа Говорящей Луны — странные и загадочные люди с множеством эзотерических верований и традиций. Жрецы часто оспаривают догматы друг друга, приходя к разным выводам и толкованиям, что порождает многочисленные расколы.\n\nОдин из самых печально известных расколов начался, когда некий жрец объявил, что [Concept('aervalr','Эрвал')|E] говорил с ним и велел верующим отказаться от одежды. Другой жрец возразил, утверждая прямо противоположное. Так началась череда расколов, продолжавшаяся целое столетие, пока третий жрец не провозгласил, что Эрвал вообще не предписывал подобных перемен."
 
 #game_concept_being_of_the_bloody_feast: "Being of the bloody Feast"
 #game_concept_being_of_the_bloody_feast_desc: "The Being is said to have descended from the heavens to relay holy instructions to his chosen flock. Said to lurk within a great subaeranean lair, it is said to possess an otherwordly beauty with an enchanting voice. Verbalizing its commandments to chosen priests in a strange and unnatural language, it is somehow innately understood by those who hear it. These commandments emphasize the sanctity of blood and speak of an enigmatic concept only known as the [bloody_feast|E]."
 
 #game_concept_bloody_feast: "Bloody Feast"
 #game_concept_bloody_feast_desc: "Upon the instructions of the [Concept('being_of_the_bloody_feast','Being')|E], the blood required for the Feast is collected with the utmost brutality involving careful dismemberment and flaying of the reservoir, preserving its life to the ritual's end. The sheer pain and suffering endured by the victim throughout the ritual is thought to draw the attention of outer entities who pave the path to renewal. The final steps to obtaining rebirth through the ritual are unknown, besides the fact that it requires an enormity of sacred blood."
 
 game_concept_hidden_kings: "Скрытые цари"
 game_concept_hidden_kings_desc: "Последователи культа Загриллианского танца почитают «Скрытых царей» как истинных владык мироздания, а себя считают их слугами. Говорят, что эти люди, ставшие богами, правят из духовного мира внутри полой оболочки [Concept('aeras','Эраса')|E] и посылают своим последователям вести посредством магии. Культ считает магическую немочь и мутации священным таинством: верующие должны как испытывать их на себе, так и вызывать их у чужаков, чтобы распознавать волю богов по тому, как они проявляются."
 
 game_concept_origins_of_the_cult_of_zagrillion_dance: "Истоки культа Загриллианского танца"
 game_concept_origins_of_the_cult_of_zagrillion_dance_desc: "Распространено мнение, что культ Загриллианского танца произошёл от культа рабов, основанного одним из изгнанников из [Concept('aversaria','Аверсарии')|E]: его пантеон «Скрытых царей» довольно явно составлен из искажённых имён и образов аавтократов, правивших в древности."
 
 game_concept_elated_victim: "Ликующая жертва"
 game_concept_elated_victim_desc: "Существо девичей, неземной природы, являющееся лишь в кольце щупалец великих и древних кесрраварга — прожорливых тварей, обитающих в глуши Красных земель. Ее последователи проповедуют быстротечность бытия и то, что плотские наслаждения должны быть обретены любой ценой. Они известны своими безумными сборищами, сочетающими в себе как сладострастный экстаз, так и яростное безумие с кровавыми убийствами."
 
 game_concept_burning_maiden: "Пылающая дева" 
 game_concept_burning_maiden_desc: "Согласно преданиям, Пылающая дева — существо, которое время от времени возрождается на [Concept('aeras','Эрасе')|E], чтобы сеять раздоры и приносить перемены. Иногда она предстаёт как ниспровергательница зла и нечестивых, но столь же часто оказывается всего лишь жаждущей власти узурпаторшей. Неизменно одно: каждое её воплощение погибает в огне, чтобы затем родиться вновь."
 
 game_concept_yalgabaot: "Ялгабаот"
 game_concept_yalgabaot_desc: "Ялгабаот известен как Бог в центре Вселенной и верховный регент Невыразимого Бога, властвующий над множеством других богов. Его почитатели верят, что он и прочие боги непостижимы и нечеловечески по облику и образу мыслей. Смертные не способны их понять, а всякий, кто увидит их телесный облик, погибнет или лишится рассудка.\n\nОни верят, что Невыразимый Бог — источник всего сущего, а мир — лишь плод его сновидений. Перед богами же смертные подобны личинкам."
 
 #GODS
 
 game_concept_ertomax: "Эртомакс"
 game_concept_ertomax_desc: "Эртомакс был четвёртым человеком, сумевшим объединить разрозненные племена арувасуэ, по крайней мере согласно хроникам [Concept('aversaria','аверсарианцев')|E]. Хотя его королевство во II веке от И.С. стало самым успешным государством в истории арувасуэни, об этом правителе сложилось множество различных преданий. Одни гласят, что он поднял войско мертвецов с помощью [Concept('dead_magic','мёртвой магии')|E], чтобы завоевать Айроной. Другие утверждают, что корону он обрёл благодаря остроумию, ловкости и обаянию, покорившему жителей земель джа'ракмаров. Некоторые даже уверяют, будто человек, отправившийся на Холм Золотого Святого, и король, который через несколько недель вернулся пировать в столицу, были разными людьми.\n\nВ первые годы существования королевства культ Эртомакса был в лучшем случае немногочисленным, но громко заявлявшим о себе меньшинством, но с веками число его сторонников лишь росло. Некогда считавшаяся захолустным культом фракция эртомаксистов в Зарибат Екадри попыталась возродить империю Эртомакса в хаосе [Concept('bayyuralar','Байюралара')|E]. Вместо этого верховное жречество арувасуэ распалось, а слава Эртомакса и его народа была навсегда омрачена."
 
 #DESCRIPTIONS
 
 game_concept_izaerto_bosar_creation_myth: "Космогонический миф исаэрто-бошарцев"
 game_concept_izaerto_bosar_creation_myth_desc: "Исаэрто-бошарцы верят в «Великую Пустоту» и ее злобные порождения — «Тысячу Владык». Эти Владыки обладали силой повелевать звездами и превращали любое живое существо, к которому прикасались, в жутких тварей; этой участи не избежали и их человеческие рабы, трудившиеся над возведением великих темных святилищ. Человечество, как гласят мифы, поднялось на борьбу и сокрушило Тысячу Владык в ходе ужасающего восстания, унесшего жизни почти всех людей. Когда Великая Пустота обратила свой бездонный взор на это побоище, выжившие умудрились сразить и это предвечное существо в его мистической обители, обратив против него оружие, созданное самой Тысячей Владык. Оттого, как утверждают жрецы, мир ныне обречен: хотя первозданная тьма изгнана, без нее не может быть и истинного света, а вся последующая история — не более чем предсмертные судороги умирающего мироздания.\n\nНапоследок они верят, что противовесом Пустоте выступает младшее божество по имени «Пернатый» — гигантская мистическая птица с радужным оперением, от которого отражается свет, даруя миру краски. Пернатый поглощает души всех умирающих, уводя их в свой внутренний вечный рай, дабы они жили в покое, пока земной дол погибает. Большинство чужеземных наблюдателей считают эту веру нелепой, да и сами верующие зачастую признают, что эти истории по большей части метафоричны, однако искренне верят в существование Пернатого."
 
 ##ARTIFACTS
 
 ###REGIONAL
 
 game_concept_fools_curse: "Проклятие дураков"
 game_concept_fools_curse_desc: "Проклятие дураков — смертоносное поветрие, происходящее с [Concept('fools_coast_biozone','Берега Дураков')|E], которое не позволяет чужакам закрепиться на этом в остальном благодатном побережье. Множество попыток [Concept('aversaria','аверсарианцев')|E] основать там колонии были полностью сорваны этим мором. Невзирая на повальную летальность, болезнь никогда не трогала коренных жителей побережья. Никто не знает истоков этого проклятия, хотя ольтенские мифы повествуют о соперничавших вождях, которые стремились подчинить себе джинна, но его магия обратилась против них самих."
 
