 game_concept_jaroc_bitter_root: "Ярок «Горький Корень»"
 game_concept_jaroc_bitter_root_desc: "Ярок «Горький Корень», почитаемый как самый известный сьялволк в [Concept('aversaria','аверсарианских')|E] сказаниях, был хускарлом из племени фенвиров в X веке. Его изгнали из рода после того, как он не сумел уберечь своего вождя во время охоты на троллей. Плутая, он добрел до южной Картараддии, где встретил Хартию Гисреддских паладинов — странствующее наемное братство [Concept('marchers','марочников')|E], к которому впоследствии и примкнул. Во время службы в Айроное Ярок спас наместника Ричийца Матриакса от неминуемой гибели от рук [Concept('magi','мага')|E] Мортора по прозвищу «Паук», которого северянин расчленил своим топором.\n\nВ награду Ярок был нанят личным телохранителем наместника; его часто изображали на портретах рядом с господином, который с гордостью выставлял воина перед своим двором, дабы придворные могли поглазеть на его могучее телосложение и суровый северный лик. Позже Матриакс передал бразды правления своей дочери Макленде и отправился в странствие в Катун-Кай. Ярок преданно последовал за ним на восток, после чего оба они навсегда исчезли со страниц анналов.\n\nЯрок остался крайне популярным народным героем, часто выступая в роли архетипа «верного» нелюдя. В некоторых вольнодумных свитках его даже приводят как пример несостоятельности аверсарианских убеждений о превосходстве людей, что достигло пика во время Агионистских восстаний. С годами образ Ярока часто переплетался со сказаниями о [Concept('sjaljar_jax','Сьяльяре Джаксе')|E], однако он продолжает жить и в собственных преданиях."
 
 #LOCATIONS
 
 #MISC

 game_concept_zelkavani_glassmaking: "Зелкаванское стеклоделие"
 game_concept_zelkavani_glassmaking_desc: "Стеклоделие издавна служит основой зелкаванского общества, тесно переплетаясь с его обычаями и религиозными обрядами. Эта традиция восходит к III веку от И.С., а возможно, и к более раннему времени. Изделия зелкаванских мастеров легко узнать по клейму, обычно в форме первоцвета. Их можно встретить даже в таких далёких краях, как [Concept('kashirya','Каширия')|E] и Дахангон, а также в оконных проёмах [Concept('sarradon','саррадонских')|E] храмов.\n\nИзделия из зелкаванского стекла разнообразны по форме и размеру: от крошечных бусин, флаконов и безделушек до кувшинов, скульптур и даже больших преломляющих свет пирамидионов, венчающих керкелойские стелы. Благодаря чистоте этого стекла они сверкают, словно солнце."

 game_concept_durgumags: "Дургумаги"
 game_concept_durgumags_desc: "Дургумаги — необычные паукообразные существа, словно два грудных отдела, соединённых гусеницей. На одной из половин тела расположены хитиновые конечности и восемь больших тёмных глаз. Их кожа и шерсть напоминают шкуру крупного рогатого скота. Дургумаги дают ценную шёлкошерсть, красота и прочность которой делают её более желанной, чем обычный шёлк или мех."

 game_concept_kherkeloi_tin_trade: "Керкелойский оловянный путь"
 game_concept_kherkeloi_tin_trade_desc: "Олово и бронза издавна составляли основу хозяйства керкелойцев: благодаря им росли величественные города-дворцы, снаряжались войска и ремесленники получали необходимые материалы. Когда многие местные оловянные рудники истощились и были заброшены, в Айроное и некоторых областях [Concept('kashirya','Каширии')|E] сложилась обширная торговая сеть, по которой олово, бронзу и изделия из них развозили по большей части известного мира.\n\nСамым известным участком этой сети долгое время оставался сухопутный путь от древней столицы астиликов Иалириана до величественного города-дворца Исанды, проходивший через [Concept('kalassyan_valley','Каласскую долину')|E] и значительно обогативший её жителей. Хотя с началом [Concept('wars_of_dominion','Войн за господство')|E] торговля пришла в упадок, лишь после завоеваний [Concept('ertomax','Эртомакса')|E] этот путь окончательно уступил первенство морскому маршруту к оловянным рудникам [Concept('krehejad_biozone','Крехеджада')|E]."

 game_concept_sevra_par: "Севра Пар"
 game_concept_sevra_par_desc: "[Glossary('Севра Пар','GH_SEVRA_PAR_GLOSS')] — традиция коренных жителей [Concept('kalassyan_valley','Каласской долины')|E] на [Concept('aironoian_southeast_biozone','юго-востоке Айроноя')|E]: группы воинов и отважных молодых людей исполняют сложный танец, перебрасывая топоры при смене партнёров. Обычно танец устраивают после битв, на свадьбах и перед пирами. Его исполняют с настоящими топорами и в минимальном защитном снаряжении, но детям полагается пользоваться деревянными палками, чтобы избежать серьёзных травм."
