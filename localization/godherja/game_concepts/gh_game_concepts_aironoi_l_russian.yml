 game_concept_jaroc_bitter_root:0 "Ярок «Горький Корень»"
 game_concept_jaroc_bitter_root_desc:0 "Ярок «Горький Корень», считающийся самым известным сьялволком в [Concept('aversaria','аверсарианских')|E] легендах, был хускарлом из племени фенвиров в X веке. Его якобы изгнали после того, как он не сумел уберечь своего вождя во время охоты на троллей. Затем он забрёл в южную Катраддию, где встретил Хартию Гисреддинских паладинов — странствующую наёмническую роту [Concept('marchers','маркийцев')|E], к которой впоследствии и примкнул. Во время службы в Айроное Ярок спас наместника Ричийца Матриакса от гибели от рук [Concept('magi','мага')|E] Мортора по прозвищу «Паук», которого Ярок расчленил своим топором.\n\nВ награду Ярок был нанят личным телохранителем Матриакса; его часто изображали на портретах рядом с наместником, который с гордостью выставлял его перед своим двором, чтобы придворные могли поглазеть на могучее телосложение и суровую северную внешность Ярока. Позже Матриакс передал власть своей дочери Макленде и отправился в путешествие в Катун-Кай. Ярок преданно последовал за ним на восток, после чего оба они исчезли из исторических хроник.\n\nЯрок остался крайне популярным народным героем, часто выступая в роли архетипа «полезного» нелюдя. В некоторых прогрессивных текстах его даже приводят как пример несостоятельности аверсарианских убеждений о превосходстве людей, что достигло пика во время Агионистских восстаний. С годами образ Ярока часто переплетался со сказаниями о [Concept('sjaljar_jax','Сьяльяре Джаксе')|E], однако Ярок столь же часто продолжает жить и в собственных историях."
 
 #LOCATIONS
 
 #MISC

 game_concept_zelkavani_glassmaking:0 "Зелкаванское стеклоделие"
 game_concept_zelkavani_glassmaking_desc:0 "Мастерство работы со стеклом издавна служит столпом зелкаванского общества, тесно переплетаясь с его обычаями и религиозными обрядами. Эта традиция восходит к III веку от И.С. или даже к более ранним временам; изделия зелкаванского происхождения легко узнать по клейму мастера, обычно имеющему форму примулы. Их можно встретить в таких далёких краях, как [Concept('kashirya','Каширия')|E] и Дахангон, и даже в виде оконных стёкол в [Concept('sarradon','саррадонских')|E] храмах.\n\nЗелкаванское стекло славится огромным разнообразием форм и размеров — от крошечных бусин, флаконов и безделушек до кувшинов, скульптур и даже больших преломляющих пирамидионов, венчающих керкелойские стелы, а его чистота заставляет изделия сиять так же ярко, как лучезарное солнце."

 game_concept_durgumags:0 "Дургумаги"
 game_concept_durgumags_desc:0 "Дургумаги — странные паукообразные существа, выглядящие так, будто гусеница соединила вместе два брюшка, причём на одной половине имеются хитиновые лапы и восемь больших тёмных глаз. Обладая кожей и волосяным покровом, напоминающими шкуру крупного рогатого скота, дургумаги производят высокоценную шелкошерсть, прочность и красота которой делают её более востребованной, чем любой обычный шёлк или мех."

 game_concept_kherkeloi_tin_trade:0 "Керкелойский оловянный путь"
 game_concept_kherkeloi_tin_trade_desc:0 "Олово и бронза издавна были делом жизни для керкелойских государств, питая рост их величественных городов-дворцов, оснащая их армии и снабжая ремесленников необходимыми материалами. Поскольку многие местные оловянные рудники давно иссякли и были заброшены, по всему Айроною и в некоторых частях [Concept('kashirya','Каширии')|E] раскинулась обширная торговая сеть, облегчающая перемещение олова, бронзы и изделий из них по большей части известного мира.\n\nСамой известной частью этой сети исторически был сухопутный маршрут от старой астиликской столицы Иалириан до великого города-дворца Исанда, проходивший через [Concept('kalassyan_valley','Каласскую долину')|E] и несказанно обогащавший её жителей. Хотя с началом [Concept('wars_of_dominion','Войн за господство')|E] торговля сильно пришла в упадок, окончательно её затмили лишь завоевания [Concept('ertomax','Эртомакса')|E], когда первенство перешло к морскому пути, ведущему к оловянным рудникам [Concept('krehejad_biozone','Крехеджада')|E]."

 game_concept_sevra_par:0 "Севра Пар"
 game_concept_sevra_par_desc:0 "[Glossary('Севра Пар','GH_SEVRA_PAR_GLOSS') — традиция коренных жителей [Concept('kalassyan_valley','Каласской долины')|E] в [Concept('aironoian_southeast_biozone','Юго-Восточном Айроное')|E], согласно которой группы воинов и отважной молодёжи исполняют сложный танец, метая топоры при смене партнёров. Обычно исполняемый после битв, на свадьбах и перед пирами, этот танец проводится с настоящими топорами и при минимальном доспешном снаряжении; однако от детей ожидается использование деревянных жезлов во избежание серьёзных травм."