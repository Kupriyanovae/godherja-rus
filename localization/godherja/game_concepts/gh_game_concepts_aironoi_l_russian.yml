 game_concept_alau_koev:0 "Алау Коев"
 game_concept_fire_gate:0 "Огненные врата"
 game_concept_fire_gate_desc:0 "Алау Коев, что на языке цетнера означает «Огненные врата», — религиозно значимый памятник в Центральной Амагее. Верующие утверждают, будто обитель богов лежит по ту сторону монолита, и что настанет миг, когда гора вновь узрит пламя иного мира. Из-за своей значимости для местных культур это место является объектом яростного соперничества. Хотя сам монолит древен, его статус как легендарных Огненных врат из пресвитерианских сказаний об Алау Коеваце горячо оспаривается. В первоначальных вариантах легенды этот монумент вообще не упоминается, а на протяжении веков более десятка других мест объявлялись различными племенами истинным расположением древнего заклинания — и всё со столь же скудными доказательствами."

 game_concept_kalassyan_valley: "Каласская долина"
 game_concept_kalassyan_valley_desc: "Каласская долина — это край засушливых холмов и скалистых гор, расположенный в [Concept('aironoian_southeast_biozone','Юго-Восточном Айроное')|E] к северу от внушающих ужас [Concept('redlands_biozone','Красных земель')|E]. Увенчанная одной из [Concept('the_towers','Башен')|E] и служащая [Concept('kherkeloi_tin_trade','сухопутным мостом')|E] между [Concept('kashirya','Каширией')|E] и [Concept('western_aironoi_biozone','Западным Айроноем')|E], она славится своими бескрайними полями цветущих золотых маков и календулы, покрывающими склоны холмов в самые урожайные годы."
 
 #MISC
 
 ##FAITHS
 game_concept_black_martyrs_custodians:0 "Хранители Чёрного Мученика"
 game_concept_black_martyrs_custodians_desc:0 "Священные смотрители безумной оболочки Чёрного Мученика, они облачают своего подопечного в чёрное одеяние и пытаются разделить его бессвязные, но зачастую пророческие изречения на те, что непостижимы для нашего смертного разума, и те, что можно расшифровать с огромным трудом. Однако эти хранители в большинстве случаев неточны и лишь изредка умудрялись предсказывать грядущие события. Большинство считает это следствием некомпетентности хранителей, в то время как некоторые винят самого Чёрного Мученика, утверждая, что он не обладает истинным даром прорицания.\n\nС недавних пор изречения Мученика стали касаться почти исключительно катаклизмов, а сам Мученик с каждым мгновением становится всё более встревоженным."
 
 game_concept_giant_spiders_and_humans:0 "Гигантские пауки Красных земель"
 game_concept_giant_spiders_and_humans_desc:0 "Гигантские пауки почитаются некоторыми жителями Красных земель, которые строят в храмах богато украшенные комнаты, служащие паукам домом. Обычным делом являются жертвоприношения для прокорма пауков; считается также, что служение им принесёт великое могущество. Кроме того, их содержат в центрах городов, а их шёлк и яд, оставшиеся после Пира, перерабатывают в прочные доспехи и смертоносное оружие. Пауки также защищают от нападений эти города, ставшие им домом."
 
 game_concept_fallen_star:0 "Упавшая звезда"
 game_concept_fallen_star_desc:0 "Истинное происхождение этого внеземного существа туманно, а его прозвище связано как с предполагаемым звёздным происхождением, так и с внушительным обликом. Большинство говорит, что его появление в виде фигуры, стремительно летящей к Красным землям, совпало со внезапным исчезновением звезды на ночном небосводе, и оно не похоже ни на одно известное существо. Обладая тысячами каменных рук и ног, оно чрезвычайно искусно в том, что кажется магией разума, и, как известно, обучает этому искусству немногих избранных последователей."
 
 game_concept_schism_of_moon_cult:0 "Расколы Лунного культа"
 game_concept_schism_of_moon_cult_desc:0 "Последователи культа Говорящей Луны — странный и загадочный народ, полный разнообразных эзотерических верований и традиций. Их догматы часто оспариваются другими жрецами, приходящими к иным выводам и толкованиям, что вызывает множество расколов.\n\nОдин из самых позорных расколов произошёл, когда один жрец провозгласил, будто [Concept('aervalr','Эрвальр')|E] обратился к нему с указанием верующим больше не носить одежду. Это заявление было опровергнуто другим жрецом, утверждавшим обратное, что породило вековой цикл расколов, пока третий жрец не объявил, что Эрвальр не приказывал совершать ничего подобного."
 
 #game_concept_being_of_the_bloody_feast:0 "Существо Кровавого пира"
 #game_concept_being_of_the_bloody_feast_desc:0 "Говорят, что Существо спустилось с небес, чтобы передать священные наставления своей избранной пастве. Считается, что оно скрывается в огромном подземном логове и обладает неземной красотой и чарующим голосом. Изрекая свои заповеди избранным жрецам на странном и неестественном языке, оно каким-то образом интуитивно понятно тем, кто его слышит. Эти заповеди подчёркивают святость крови и говорят о загадочном понятии, известном лишь как [Concept('bloody_feast','Кровавый пир')|E]."
 
 #game_concept_bloody_feast:0 "Кровавый пир"
 #game_concept_bloody_feast_desc:0 "Согласно наставлениям [Concept('being_of_the_bloody_feast','Существа')|E], кровь, необходимая для Пира, собирается с крайней жестокостью, включающей тщательное расчленение и свежевание жертвы-резервуара, чья жизнь сохраняется до окончания ритуала. Считается, что невыносимая боль и страдания, испытываемые жертвой на протяжении всего ритуала, привлекают внимание внешних сущностей, которые прокладывают путь к обновлению. Последние шаги к обретению перерождения через этот ритуал неизвестны, кроме того факта, что для него требуется колоссальное количество священной крови."
 
 game_concept_hidden_kings:0 "Скрытые цари"
 game_concept_hidden_kings_desc:0 "Культ Загриллианского танца считает «Скрытых царей» истинными владыками реальности, а себя — их слугами. Говорят, что эти люди, ставшие богами, правят из духовного царства, расположенного внутри полой оболочки [Concept('aeras','Эраса')|E], посылая сообщения своим последователям с помощью магии. Культ относится к лучевой болезни и мутациям как к святому таинству, которое нужно пережить лично и навлечь на чужаков, — и всё ради того, чтобы верные могли разглядеть волю богов в этих проявлениях."
 
 game_concept_origins_of_the_cult_of_zagrillion_dance:0 "Истоки культа Загриллианского танца"
 game_concept_origins_of_the_cult_of_zagrillion_dance_desc:0 "Обычно предполагают, что культ Загриллианского танца, скорее всего, произошёл от рабского культа, основанного одним из изгнанников из [Concept('aversaria','Аверсарии')|E], поскольку его пантеон «Скрытых царей» довольно очевидно состряпан из искажённых имён и образов правивших в древности автократов."
 
 game_concept_elated_victim:0 "Ликующая жертва"
 game_concept_elated_victim_desc:0 "Женщина неземной природы, которая проявляется лишь в щупальцах великих и почтенных кесрраварга — существ, известных своей ненасытностью и обитающих в Красных землях. Её последователи проповедуют быстротечность жизни и то, что удовольствие должно быть обретено любой ценой. Они также известны тем, что часто предаются массовым оргиям, сочетающим в себе как сладострастное ликование, так и яростное безумие с убийствами."
 
 game_concept_burning_maiden:0 "Пылающая дева" 
 game_concept_burning_maiden_desc:0 "Согласно окружающим её легендам, Пылающая дева — это существо, которое периодически перерождается на [Concept('aeras','Эрасе')|E], чтобы сеять великие раздоры и приносить перемены. Иногда под видом низвержения нечестивцев и зла, но столь же часто — просто как жаждущий власти узурпатор. Однако единственной неизменной чертой её воплощений является то, что её жизнь всегда обрывается в огне, пока она не родится вновь."
 
 game_concept_yalgabaot:0 "Ялгабаот"
 game_concept_yalgabaot_desc:0 "Ялгабаот известен как Бог в центре Вселенной и верховный регент Невыразимого Бога, правящий множеством других богов. Культисты Ялгабаота верят, что он и остальные боги непостижимы и бесчеловечны в своём облике и помыслах; смертные люди не способны понять их, а всякий, кто узрит их физическую форму, падает замертво или сходит с ума.\n\nОни верят, что Невыразимый Бог — творец всего сущего, а мир — лишь плод его сновидений. Для этих богов смертные — всего лишь черви."
 
 #GODS
 
 game_concept_ertomax:0 "Эртомакс"
 game_concept_ertomax_desc:0 "Эртомакс был четвёртым человеком, сумевшим подчинить себе разрозненные племена арувасуэ — по крайней мере, согласно хроникам [Concept('aversaria','аверсарианцев')|E]. Хотя его государство во II веке от И.С. было самым процветающим государством из всех, что когда-либо основывали арувасуэни, об этом человеке ходит множество противоречивых историй. Одни предания гласят, будто он поднял армию мертвецов с помощью [Concept('dead_magic','магии смерти')|E], чтобы прорубить себе путь через Айроной. Другие утверждают, что корону он завоевал благодаря острому уму и ловкости рук, очаровав жителей земель Джа'Ракмари. Некоторые и вовсе заявляют, будто человек, взошедший на Холм Золотого Святого, не был тем самым королём, что вернулся в свою столицу несколько недель спустя, чтобы пировать.\n\nХотя в первые дни существования государства культ Эртомакса поддерживало в лучшем случае крикливое меньшинство, на протяжении веков он непреклонно рос. В хаосе [Concept('bayyuralar','Байюралара')|E] фракция эртомаксистов из Зарибат Екадри попыталась возродить империю Эртомакса, хотя некогда их культ считался захолустным. Эта попытка привела лишь к тому, что верховное жречество арувасуэ раскололось, а былая слава как Эртомакса, так и самих арувасуэ оказалась навсегда запятнана."
 
 #DESCRIPTIONS
 
 game_concept_izaerto_bosar_creation_myth:0 "Космогонический миф исаэрто-бошарцев"
 game_concept_izaerto_bosar_creation_myth_desc:0 "Исаэрто-бошарцы верят в «Великую Пустоту» и её злобные творения — «Тысячу Владык». Тысяча Владык обладали силой управлять звёздами и превращали любое живое существо, к которому прикасались, в ужасных чудовищ; этой участи не избежали и их человеческие рабы, трудившиеся над созданием великих тёмных святилищ в их честь. Человечество, как рассказывают исаэрто-бошарцы, поднялось на борьбу и сокрушило Тысячу Владык в ходе ужасающе жестокого восстания, во время которого погибли почти все люди. Когда Великая Пустота обратила свой бездонный взор на это побоище, человечество поразило и это предвечное существо в мистическом бесконечном плане его обитания, использовав оружие, созданное самой Тысячей Владык. Из-за этого, как утверждают жрецы, мир теперь обречён: хотя тьма и изгнана, без неё никогда не будет истинного света, а вся последующая история — не более чем предсмертные судороги умирающего мира.\n\nНаконец, они верят, что противовесом Великой Пустоте выступает младшее божество по имени «Пернатый» — гигантская мистическая птица с радужным оперением, от которого отражается весь свет, даруя миру краски. Пернатый поглощает души всех умирающих людей и позволяет им войти в свой внутренний вечный рай, дабы они жили в покое, пока смертный мир погибает. Большинство чужеземных наблюдателей сходятся во мнении, что эта вера нелепа, а сами верующие, будучи в основном агностиками, обычно говорят, что эти истории по большей части метафоричны, но Пернатый существует на самом деле..."
 
 ##ARTIFACTS
 
 ###REGIONAL
 
 game_concept_fools_curse:0 "Проклятие дураков"
 game_concept_fools_curse_desc:0 "Проклятие дураков — смертоносная болезнь, происходящая с [Concept('fools_coast_biozone','Берега Дураков')|E], которая не позволяет чужакам обосноваться на этом в остальном цветущем побережье. Множество попыток [Concept('aversaria','аверсарианцев')|E] колонизировать Берег Дураков были полностью сорваны этим проклятием. Несмотря на общеизвестную летальность, болезнь никогда не поражала коренных жителей побережья. Никто не знает, откуда берёт начало это проклятие, хотя ольтенские мифы повествуют о соперничавших воеводах, которые стремились подчинить себе джинна, но его магия обратилась против них самих."
 
 ##REGION
 
