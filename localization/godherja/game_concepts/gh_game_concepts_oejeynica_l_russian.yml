 #EVENTS
 
 game_concept_sorrowing_of_oejeynica: "Скорбь по Ойейнице"
 game_concept_sorrowing_of_oejeynica_desc: "Скорбь по Ойейнице — черная пора, тянувшаяся примерно с 156 года от И.С., когда явился первый [Concept('arch_lich','архилич')|E] [Concept('vilas_venslau','Виласа Венслау')|E] и пала Просвещённость Вравсил, до 171 года, когда под ударами мертвецов рухнуло последнее ойейницкое королевство и началось нашествие Венслау на полуденные земли, в [Concept('chevalie','Шевалье')|E].\n\nСкорбь по Ойейнице обернулась поголовным истреблением всего живого в подлунном мире к северу от Шевалье. Вилас Венслау и его наперсники обрели проклятое [Concept('lichdom','личество')|E] и учинили самое жуткое побоище в северной истории, обращая всякую тварь, не успевшую бежать под защиту Шевалье, в бездумных слуг своего воинства. Беде безвольно потворствовали раздоры среди самих ойейницев, терзавшие край в те же годы, равно как и нескончаемые набеги диких племен [Concept('marchers','марочников')|E].\n\nС тех горьких времен Шевалье утвердился как крайний северный рубеж обитаемых земель, а память о Скорби породила как шевальенское [Concept('antimagic','антимагическое')|E] искусство, так и первые [Concept('antimagic_orders','антимагические ордена')|E], созданные для искоренения некромантии. То, что Шевалье стоит незыблемым щитом между живым югом и владениями Смерти на севере, до сих пор связывает дружбой Аверсарию и Марку, а сами шевальенцы с гордостью зовут себя «марочниками». Былые же цветущие земли Ойейницы с той поры зовут не иначе как [Concept('the_lichdoms','Личествами')|E]."
 
 #CHARACTERS
 
 game_concept_vilas: "Вилас"
 game_concept_venslau: "Венслау"
 game_concept_vilas_venslau: "Вилас Венслау"
 game_concept_vilas_venslau_desc: "[Concept('arch_lich','Архилич')|E] Вилас Венслау некогда был безвестным мелким писцом в Просвещённости Вравсил. Удивительно, но в уцелевших свитках о нем почти не осталось памяти. Был он мужем ничем не примечательным (хотя знавшие его порой поминали его странный и пугающий нрав), происходил из захудалого рода потомственных [Concept('magi','магов')|E] и исправно нес свою службу без малого пятнадцать лет.\n\nОднако анналы истории резко меняются в 154 году, когда Венслау свершил череду темных обрядов, дабы стяжать противоестественное [Concept('lichdom','личество')|E].\n\nПровозгласив себя первым архиличем, он вместе со своими приспешниками, чьи имена стали столь же прокляты (и среди них пуще всех — [Concept('silas_stavro','Силас Ставро')|E]), за считанные зимы стер с лица земли Вравсил, а следом и всю Ойейницу во время бедствия, прозванного [Concept('sorrowing_of_oejeynica','Скорбью по Ойейнице')|E]. Эти первые [Concept('liches','личи')|E] выжгли жизнь на древнем севере и двинули рати мертвецов на юг, в [Concept('chevalie','Шевалье')|E].\n\nВенслау пробился на юг дальше любого иного немёртвого владыки, дойдя до самого сердца Калатипсоми и сокрушив большинство шевальенских баронов. Его грозное шествие остановило лишь внезапное предательство ученика, Силаса Ставро, но причины этого раздора навек унесла река времени. И хотя Венслау считают сгинувшим, прах его так и не был найден, а матери пугают его грозным именем непослушных детей даже в далеком полуденном [Concept('sarradon','Сarradonе')|E]."
 
 game_concept_stavro: "Ставро"
 game_concept_silas: "Силас"
 game_concept_silas_stavro: "Силас Ставро"
 game_concept_silas_stavro_desc: "[Concept('arch_lich','Король-лич')|E] Силас Ставро, известный в песнях и проклятиях под именами «Милох Милванич», «Теад Теадарич», «Гаст Гаддиари», «Черносердечный», «Говорящий с тенями», «Убийца Солнца и Луны», «Одержимый ночью», «Луннокус», «Ловец душ», а в течение нескольких дней — «Грань клинка», является третьим [Concept('liches','личем')|E] в ведомой истории и, без сомнения, самым зловещим.\n\nРожденный в семье простых пахарей на землях павшей Просвещённости Вравсил в восточной Ойейнице, Силас с малых лет выказал редкий [Concept('magic','магический')|E] дар и по обычаю тех мест был разлучен с близкими ради обучения в чародейской академии. Похоже, в пору своего выпуска в возрасте шестнадцати лет, при вступлении в один из гетерических орденов Вравсил, он и повстречал [Concept('vilas_venslau','Виласа Венслау')|E], став его верным учеником.\n\nКогда Вилас возвысился до важного чина в государстве, а после открыл дорогу к [Concept('lichdom','личеству')|E], Силас без колебаний разделил участь учителя. Рука об руку они погубили Ойейнице во время [Concept('sorrowing_of_oejeynica','Скорби по Ойейнице')|E] и двинулись войной на [Concept('chevalie','Шевалье')|E]. Их полки едва не ступили на земли будущей Этепезеи, но за шаг до победы Силас вонзил нож в спину своего господина, дабы единолично править мертвыми.\n\nСпустя семь веков Силас объявил себя архиличем и вновь вторгся в Марку, воспользовавшись Анархией Пяти Корон и Войной на Красной реке. Его сокрушил [Concept('champion_of_chevalie','защитник Шевалье')|E] в чертогах Дворца Гисредде, а кости чернокнижника выбросили в морскую пучину. Там он и пребудет мертвым — теперь уж вовеки веков."
 
 #GROUPS AND ORGANIZATIONS
 
 game_concept_liches: "Личи"
 game_concept_lich: "Лич"
 game_concept_liches_desc: "Лич — это всякий [Concept('magi','маг')|E], стяжавший проклятие [Concept('lichdom','личества')|E], пройдя через [Concept('four_forbidden_steps','четыре запретных шага')|E] и свершив Тринадцать Шагов в Бездну. Будучи духом чародея, запертым в собственном мертвом теле, личи по праву считаются сильнейшими колдунами поднебесной. Постижение тайн Мёртвой магии ради прохождения Бездны, полное угасание человеческой морали и бесконечные века для изучения [Concept('arcana','тайных искусств')|E] делают каждого из них неодолимым противником.\n\nПервым среди них стал [Concept('vilas_venslau','Вилас Венслау')|E], устроивший [Concept('sorrowing_of_oejeynica','Скорбь по Ойейнице')|E] и породивший [Concept('the_lichdoms','Личества')|E] на холодном севере. Вскоре после своего обращения он начал первый Чёрный Марш на юг, чая обратить в прах и нежить всё живое, дабы мертвецы безмолвно славили его величие.\n\nВсем личам присущ схожий черный нрав. О причинах этого спорят до сих пор: то ли это неизбежный отпечаток самого обряда, то ли изначально лишь безумцы готовы пойти на такое, то ли вековое одиночество среди тлена сводит душу с ума. Как бы порча ни проявляла себя, общие черты их нрава описаны [Concept('shared_lich_personalities','здесь')|E].\n\nОт скуки личи часто меняют обличья и имена каждые несколько сотен лет, выбирая прозвища, звучащие, на их вкус, «величественно» и «грозно», и питая слабость к созвучию букв."
 
 #LOCATIONS
 
 game_concept_the_lichdoms: "Личества"
 game_concept_the_lichdoms_desc: "Личества — это мертвые осколки того, что некогда было созвездием из десятков богатых королевств, империй и магократий ойейницкой культуры. Они возникли в пламени [Concept('sorrowing_of_oejeynica','Скорби по Ойейнице')|E] в те же темные годы, когда восходил первый [Concept('aversaria','аверсарианский')|E] аавтократ, а [Concept('marchers','марочники')|E] заселяли [Concept('chevalie','Шевалье')|E]. Тогда первый [Concept('arch_lich','архилич')|E] [Concept('vilas_venslau','Вилас Венслау')|E] явил миру свою черную силу и выжег жизнь в крае перед походом на юг. По сей день в Личествах нет ничего живого, кроме редких стервятников, и лишь полчища нежити бродят по разорённым пустошам под началом своих мертвых хозяев.\n\nИз-за того, что личи веками высасывали из земли всякую каплю живой силы, оскверняли пашни некромантией и вели друг с другом разрушительные войны, этот край, бывший некогда одним из самых цветущих в [Concept('aeras','Эрасe')|E], скорее всего, уже никогда не сможет возродиться к жизни."
 game_concept_lichdoms: "Личества"
 
 game_concept_murnyr: "Мурнир"
 game_concept_murnyr_desc: "Мурнир — это регион, который исторически охватывал все земли к северу от Алойзийского моря, к западу от Вечной Зимы и к югу от северных пустошей; однако в веках, последовавших за [Concept('sorrowing_of_oejeynica','Скорбью по Ойейнице')|E], это название стали чаще относить к землям к северу от Шевалье и к западу от Шёпота — почти полностью к тем землям, что ныне составляют [Concept('the_lichdoms','Личества')|E]. Хотя в просторечии этот край именуют «Ойейницей» ([Concept('chevalie','шевальенизация')|E] слова «Ойечинайнзия»), Ойейница была лишь одним из многих регионов; её южное положение привело к тому, что её народ стал самой многочисленной из уцелевших групп северных беженцев.\n\nВот лишь некоторые из областей, некогда составлявших Мурнир:\n$BULLET_WITH_TAB$Ойечинайнзия\n$BULLET_WITH_TAB$Махиаза\n$BULLET_WITH_TAB$Ибрао\n$BULLET_WITH_TAB$Серое Марше\n$BULLET_WITH_TAB$Сорн\n$BULLET_WITH_TAB$Норрейнж\n$BULLET_WITH_TAB$Зирбария\n$BULLET_WITH_TAB$Вортук Друул\n$BULLET_WITH_TAB$Вечный Дозор\n$BULLET_WITH_TAB$Авналие\n$BULLET_WITH_TAB$Одинокий Свет\n$BULLET_WITH_TAB$Врава"
 
 
 #MISC
 
 game_concept_lichdom: "Личество"
 game_concept_lichdom_i: "@government_type_lichdom!"
 game_concept_lichdom_desc: "Личество — состояние вечного посмертия, при котором могущественный [Concept('dead_magi','Маг Земли')|E] посредством тайного ритуала, именуемого «Тринадцатью Шагами в Бездну», заковывает собственную душу в теле, после чего обрывает свою земную жизнь. В итоге чародей обретает нескончаемое существование в виде [Concept('liches','лича')|E] — иссохшего скелетоподобного колдуна, сохранившего разум и познания своей живой ипостаси. Сама суть темного обряда приводит к тому, что почти все личи были чернокнижниками-некромантами и продолжали углубляться в это зловещее ремесло в своем посмертии.\n\nДевять из Тринадцати шагов ведомы книжникам, а четыре — преданы забвению и зовутся [Concept('four_forbidden_steps','четырьмя запретными шагами')|E]. Неизвестно, утеряны ли они в пожарах войн или же владыки живых намеренно истребляли всякое упоминание о них, дабы отвратить смертных от столь жуткого греха. Перечень известных шагов приведен [Concept('thirteen_abyssal_steps','здесь')|E]."
 
 game_concept_lich_king: "Король-лич"
 game_concept_lich_kings: "Короли-личи"
 game_concept_lich_lord: "Повелитель личей"
 game_concept_dark_lord: "Тёмный властелин"
 game_concept_black_emperor: "Чёрный император"
 game_concept_arch_lich: "Архилич"
 game_concept_arch_liches: "Архиличи"
 game_concept_archlich: "Архилич"
 game_concept_archliches: "Архиличи"
 game_concept_arch_lich_desc: "Архилич (а также Король-лич, Тёмный властелин или Чёрный император) — это грозный титул, коим в летописях венчают всякого [Concept('liches','лича')|E], сумевшего подчинить себе (а попросту — сокрушать до тех пор, пока те неохотно не склонят колени) прочих мертвецов и [Concept('necromancy','некромантов')|E] в пределах [Concept('the_lichdoms','Личеств')|E], обычно ради организации Чёрного Марша на [Concept('chevalie','Шевалье')|E].\n\nИстория помнит немало таких владык, и большинство из них нашли свою погибель, будучи преданными собственными же собратьями-личами прямо посреди похода, а прочие пали от клинков марочникских героев. Тем не менее, в Бездне никогда не угасает жажда власти, и ныне куда больше восставших скелетов именуют себя архиличами, нежели тех, кто скромно обещает стать им со временем.\n\nДвумя самыми прославленными архиличами в анналах истории остались [Concept('vilas_venslau','Вилас Венслау')|E], первый из них, и [Concept('silas_stavro','Силас Ставро')|E], его ученик и каратель."
 
 game_concept_thirteen_abyssal_steps: "Тринадцать Шагов в Бездну"
 game_concept_thirteen_abyssal_steps_here: "Здесь"
 game_concept_thirteen_abyssal_steps_desc: "1. Вся кровная родня, включая внучатых племянников и троюродных братьев и сестер, должна быть умерщвлена собственными руками заклинателя. Сие надобно ради иссушения земных уз, кои могли бы утянуть душу за грань вместо удержания в теле.\n2. Кровь убиенных родственников надлежит собрать в свинцовые чаши, причем свинец должен быть добыт в рудниках, лежащих вдоль [Concept('waylines','лей-линий')|E] ниже уровня моря.\n3. Самая дорогая родовая реликвия колдуна должна быть сожжена или стерта в пыль, а прах ее следует ровным слоем насыпать в чаши с кровью.\n4. ???\n5. ???\n6. Заклинателю надлежит явиться к одной из мировых [Concept('the_towers','Башен')|E] до наступления [Concept('exposure_sickness','магического облучения')|E]. Таможде ему должно источать свою кровь до беспамятства, скрепив тело заклятьем, дабы раны не затягивались до самого исхода ритуала.\n7. На теле чародея вырезаются тайные знаки, и такие же знамения высекаются на костях его убитой родни.\n8. Ритуальный круг чертится собственной кровью мага, повторяя узоры на его плоти.\n9. Восемь невинных душ (чаще детей) приносятся в жертву разом в узловых точках круга.\n10. Кровь из каждой свинцовой чаши выпивается до капли; если колдун не сможет осушить хоть одну — его ждет мгновенная смерть.\n11. ???\n12. ???\n13. Маг обрывает свою жизнь, перерезая себе горло в самом центре круга. Он восстанет в новом, бессмертном обличье ровно через семь дней."
 
 game_concept_four_forbidden_steps: "Четыре запретных шага"
 game_concept_four_forbidden_steps_desc: "Четыре запретных шага — сокрытые части Тринадцати Шагов в Бездну, без коих невозможно стяжать проклятое [Concept('lichdom','личество')|E]. Доселе безвестно, почему именно они запрещены и кем. Многие книжники полагают, будто знания о них сгорели еще в дни возвышения первого [Concept('liches','лича')|E], [Concept('vilas_venslau','Виласа Венслау')|E], другие же верят, будто государи живых веками намеренно истребляли эти записи из свитков.\n\nРаскрытие тайны Четырёх Шагов считается самым первым шагом на пути к нежити, а любые разговоры о них почитаются за глубочайшее табу и сурово караются во всех землях, где ведают о грозящей с севера опасности."
 
 game_concept_shared_lich_personalities_here: "Здесь"
 game_concept_shared_lich_personalities: "Общие черты характера личей"
 game_concept_shared_lich_personalities_desc: "Почти все [Concept('liches','личи')|E] являют собой:\n\n1. Гордецов: Личи почитают себя высшими существами, а всех прочих магов — лишь жалкими подражателями. Живые же, на их взгляд, рождены лишь ради того, чтобы склонять перед ними выю. Это неизбежно сталкивает личей лбами, ибо само существование иного бессмертного колдуна они видят как нестерпимое оскорбление своего величия.\n2. Безбожников: Личи видят в самой мысли о вышних силах умаление собственной гордыни, считая себя равными богам. Всякий лич, столкнувшись с проявлением божественного, зрит в Богах лишь соперников, коих должно низвергнуть и уничтожить.\n3. Стяжателей: Личи непрестанно жаждут новой силы, проводя вечность либо за изучением запретных [Concept('arcana','тайных искусств')|E], либо совершая набеги на земли живых и своих же собратьев ради расширения границ своих черных владений.\n4. Предателей: У личей напрочь отмирает всякая совесть, и они без колебаний прибегнут к любой низости ради достижения цели. Оттого-то большинство [Concept('arch_lich','архиличей')|E] в истории находили свой конец из-за того, что соратники вонзали им нож в спину в самый удобный миг.\n\nОдной из неразгаданных тайн остается то, можно ли упокоить лича навеки. Принято считать, будто сокрушение черепа разрушает душу внутри костей. Однако многие мудрецы уверяют, что даже если стереть кости мертвеца в порошок, дух колдуна останется заперт в этой пыли, просто потеряв способность как-либо вредить миру."
 
