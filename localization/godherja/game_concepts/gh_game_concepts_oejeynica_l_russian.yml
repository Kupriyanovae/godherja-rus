 #EVENTS
 
 game_concept_sorrowing_of_oejeynica:0 "Скорбь по Оейенике"
 game_concept_sorrowing_of_oejeynica_desc:0 "Скорбь по Оейенике была событием, продлившимся примерно с 156 г. от И.С. с возвышением первого [Concept('arch_lich','архилича')|E] [Concept('vilas_venslau','Виласа Венслау')|E] и уничтожением Просвещённости Вравсил, до 171 г. с падением последнего Оейеникского королевства и началом вторжения Венслау на юг, в [Concept('chevalie','Шевалье')|E].\n\nСкорбь по Оейенике представляла собой систематическое истребление всего живого в известном мире к северу от Шевалье: Вилас Венслау и его ученики обратились в [Concept('lichdom','личество')|E] и положил начало самому масштабному геноциду в известной истории на северных землях, превращая всех живых существ, которые не успели бежать в Шевалье, в нежить для служения своим целям. Скорби частично способствовали несколько крупных войн между самими оейеникцами, бушевавших одновременно с этим, наряду с множеством войн между вторгшимися племенами [Concept('marchers','маркцев')|E] и самими оейеникцами.\n\nСкорбь утвердила [Concept('chevalie','Шевалье')|E] в качестве северного рубежа известного мира, а реакция на неё привела как к открытию и последующему подавлению личества, так и к зарождению шевальенской [Concept('antimagic','антимагической')|E] традиции и [Concept('antimagic_orders','антимагических орденов')|E]. Положение Шевалье между живыми на юге и Личествами на севере является одной из наиболее часто упоминаемых причин того, почему отношения между Аверсарией и Маркой обычно оставались дружественными, а также послужило источником названия «маркцы» (жители Марки) для шевальенцев, которое они носят с гордостью. С самой Скорби останки Оейеники стали именоваться [Concept('the_lichdoms','Личествами')|E]."
 
 #CHARACTERS
 
 game_concept_vilas:0 "Вилас"
 game_concept_venslau:0 "Венслау"
 game_concept_vilas_venslau:0 "Вилас Венслау"
 game_concept_vilas_venslau_desc:0 "[Concept('arch_lich','Архилич')|E] Вилас Венслау когда-то был мелким правительственным министром в Просвещённости Вравсил. Самое примечательное в Венслау — это то, как мало упоминаний о нём сохранилось в уцелевших исторических хрониках. Будучи заурядным человеком (хотя порой его отмечали как странного или жуткого), Венслау происходил из мелкого дворянского рода потомственных [Concept('magi','магов')|E] и нёс службу на своём посту без особых отличий около 15 лет.\n\nОднако хроники о Венслау резко меняются в 154 году, когда он провёл серию ритуалов, чтобы достичь состояния, которое позже станет известно как [Concept('lichdom','личество')|E].\n\nВенслау провозгласил себя первым архиличем, и он вместе со своими послушниками, каждый из которых стал почти столь же бесславен, как и он сам (наиболее заметным среди них был [Concept('silas_stavro','Силас Ставро')|E]), за считанные годы уничтожил Вравсил, а затем и остальную Оейенику в ходе события, которое позже назовут [Concept('sorrowing_of_oejeynica','Скорбью по Оейенике')|E]. Эти первые [Concept('liches','личи')|E] фактически стёрли всю жизнь на древнем севере, после чего начали вторжение на юг, в [Concept('chevalie','Шевалье')|E].\n\nВенслау продвинулся на юг дальше, чем любой лич в истории, продвинув своё войско вглубь Калатипсоми после победы над большинством владык Шевалье. Его смогли остановить лишь после загадочного предательства со стороны его ученика Силаса Ставро, хотя причины этого канули в лету. Несмотря на то, что Венслау считают погибшим, его тело так и не было найдено, а матери до сих пор пугают его возвращением своих детей, чтобы заставить их слушаться, даже в далёком [Concept('sarradon','Саррадоне')|E]."
 
 game_concept_stavro:0 "Ставро"
 game_concept_silas:0 "Силас"
 game_concept_silas_stavro:0 "Силас Ставро"
 game_concept_silas_stavro_desc:0 "[Concept('arch_lich','Король-лич')|E] Силас Ставро, также известный под такими именами, как «Милох Милванич», «Теад Теадарич», «Гаст Гаддиари», «Черносердечный», «Говорящий с тенями», «Убийца Солнца и Луны», «Одержимый ночью», «Луннокус», «Ловец душ» и в течение нескольких дней «Грань клинка», является третьим известным [Concept('liches','личем')|E] в современной истории и, возможно, самым знаменитым.\n\nРодившись где-то на землях бывшей Просвещённости Вравсил в восточной Оейенике в семье крестьян, Ставро с юных лет проявил выдающиеся [Concept('magic','магические')|E] способности и, по вравсилской традиции, был быстро забран из семьи для обучения на [Concept('magi','мага')|E]. В какой-то момент своего обучения, вероятно, во время выпуска из академии в возрасте 16 лет и посвящения в один из гетерических орденов Вравсил, он встретил [Concept('vilas_venslau','Виласа Венслау')|E] и стал его учеником.\n\nВилас со временем стал одним из ведущих правительственных министров Вравсил, а затем открыл путь к [Concept('lichdom','личеству')|E] и обратился в него, а Силас последовал по его стопам. Вилас вместе с Силасом и другими своими приспешниками уничтожил всё живое в Оейенике во время [Concept('sorrowing_of_oejeynica','Скорби по Оейенике')|E], а затем они вторглись на юг, в [Concept('chevalie','Шевалье')|E]. Они почти дошли до земель, которые станут Этепезеей, прежде чем их наконец остановили — и случилось это лишь после того, как Силас предал своего господина и убил его в попытке захватить власть.\n\nСпустя 700 лет Силас провозгласил себя архиличем и вторгся в Марку во время Анархии Пяти Корон и Войны на Красной реке. Он был повержен [Concept('champion_of_chevalie','защитником Шевалье')|E] во Дворце Гисредде, а его кости были выброшены в море. Где он и останется мёртвым — теперь уж точно навсегда."
 
 #GROUPS AND ORGANIZATIONS
 
 game_concept_liches:0 "Личи"
 game_concept_lich:0 "Лич"
 game_concept_liches_desc:0 "Лич — это любой [Concept('magi','маг')|E], достигший состояния [Concept('lichdom','личества')|E] путём раскрытия [Concept('four_forbidden_steps','четырёх запретных шагов')|E] и последующего выполнения Тринадцати Шагов в Бездну. Будучи душой могущественного мага, заточённой в неживом теле, личи общепризнанно считаются сильнейшими чародеями в мире. Постижение искусства Мёртвой магии для совершения Тринадцати Шагов, полное отсутствие понимания добра и зла (или безразличие к ним), а также неограниченное время для изучения [Concept('arcana','тайных искусств')|E] делают каждого из них колдуном невероятной мощи.\n\nПервым личем стал [Concept('vilas_venslau','Вилас Венслау')|E], устроивший [Concept('sorrowing_of_oejeynica','Скорбь по Оейенике')|E] и основавший [Concept('the_lichdoms','Личества')|E] на далёком севере. Вскоре после этого он начал первый Чёрный Марш, двинувшись на юг в попытке распространить своё владычество на всех живых существ (и, предположительно, обратить их в нежить, дабы они лучше поклонялись ему).\n\nЛичам, как правило, присущи общие черты характера. Причины этого горячо обсуждаются: является ли это неким отголоском церемонии обращения, или же изначально лишь определённый тип людей готов пойти на такое, либо бесконечная жизнь среди мертвецов толкает душу к особому роду безумия. Независимо от причин, список общих черт можно найти [Concept('shared_lich_personalities','здесь')|E].\n\nОт скуки личи часто меняют свои личности каждые несколько сотен лет и обычно берут себе имена, которые кажутся им «прекрасными» и «могущественными», используя аллитерацию."
 
 #LOCATIONS
 
 game_concept_the_lichdoms:0 "Личества"
 game_concept_the_lichdoms_desc:0 "Личества — это остатки того, что когда-то было созвездием из десятков развитых королевств, империй и магократий оейеникской культуры. Личества образовались во время [Concept('sorrowing_of_oejeynica','Скорби по Оейенике')|E] примерно в тот же период, когда шло становление [Concept('aversaria','аверсарианского')|E] Автократа и прибытие [Concept('marchers','маркцев')|E] в [Concept('chevalie','Шевалье')|E], когда первый [Concept('arch_lich','архилич')|E] [Concept('vilas_venslau','Вилас Венслау')|E] явил миру свои силы [Concept('liches','лича')|E] и выжег почти всё живое в регионе перед вторжением на юг. По сей день Личества остаются полностью лишёнными подлинной жизни, если не считать редких стервятников, и лишь нежить вместе со своими хозяевами движется по этой разорённой земле.\n\nИз-за того, что личи веками поглощали любую жизненную силу, которую только могли найти, сражались друг с другом при помощи разрушительной магии и оскверняли саму землю, то, что некогда было одним из самых плодородных регионов [Concept('aeras','Эраса')|E], скорее всего, больше никогда не сможет полноценно поддерживать жизнь."
 game_concept_lichdoms:0 "Личества"
 
 
 #MISC
 
 game_concept_lichdom:0 "Личество"
 game_concept_lichdom_i:0 "@government_type_lichdom!"
 game_concept_lichdom_desc:0 "Личество — это состояние нежизни, при котором могущественный [Concept('dead_magi','Маг Земли')|E] посредством эзотерического ритуала, известного как «Тринадцать Шагов в Бездну», заточил свою душу внутри собственного тела, а затем совершил самоубийство. Результатом становится кажущаяся бесконечной жизнь, где [Concept('magi','маг')|E] продолжает существование в виде [Concept('liches','лича')|E] — скелетоподобного чародея, сохраняющего все знания и воспоминания своей живой ипостаси. Из-за самой природы ритуала почти все личи в истории были некромантами и продолжали углубляться в это искусство в своём посмертии.\n\nДевять из Тринадцати шагов известны, а Четыре забыты (их называют [Concept('four_forbidden_steps','четырьмя запретными шагами')|E]). Неизвестно, утеряны ли знания о них окончательно, или же большинство магов намеренно уничтожают любые упоминания о них, дабы пресечь попытки обращения к этому искусству, поскольку личество считается глубоко порочным во многих обществах. Шаги по порядку приведены [Concept('thirteen_abyssal_steps','здесь')|E]."
 
 game_concept_lich_king:0 "Король-лич"
 game_concept_lich_kings:0 "Короли-личи"
 game_concept_lich_lord:0 "Повелитель личей"
 game_concept_dark_lord:0 "Тёмный властелин"
 game_concept_black_emperor:0 "Чёрный император"
 game_concept_arch_lich:0 "Архилич"
 game_concept_arch_liches:0 "Архиличи"
 game_concept_archlich:0 "Архилич"
 game_concept_archliches:0 "Архиличи"
 game_concept_arch_lich_desc:0 "Архилич (альтернативно: Король-лич, Тёмный властелин или Чёрный император) — это титул, традиционно присваиваемый любому [Concept('liches','личу')|E], которому удаётся «объединить» (сокрушать их до тех пор, пока они не согласятся неохотно подчиниться) различных личей и [Concept('necromancy','некромантов')|E] из [Concept('the_lichdoms','Личеств')|E] под своим началом, обычно ради организации нашествия на [Concept('chevalie','Шевалье')|E] к югу.\n\nВ истории было немало архиличей, и большинство из них встретили свой конец, будучи преданными другими личами прямо посреди вторжения в Шевалье, а остальные были сражены тем или иным маркским героем. Тем не менее, никогда не угасает нехватка тех, кто готов попытаться, и ныне больше личей заявляют, что уже являются архиличами, нежели тех, кто скромно обещает стать им когда-нибудь.\n\nДвумя самыми знаменитыми архиличами в истории были [Concept('vilas_venslau','Вилас Венслау')|E], первый лич, и [Concept('silas_stavro','Силас Ставро')|E], его ученик и предатель."
 
 game_concept_thirteen_abyssal_steps:0 "Тринадцать Шагов в Бездну"
 game_concept_thirteen_abyssal_steps_here:0 "Здесь"
 game_concept_thirteen_abyssal_steps_desc:0 "1. Все близкие члены семьи, под которыми обычно понимаются родственники вплоть до внучатых племянников и троюродных братьев/сестёр, должны быть убиты собственными руками заклинателя. Традиционно считается, что это необходимо для уничтожения родственных уз, которые могли бы заставить душу преследовать семью вместо удержания в теле.\n2. Кровь этих членов семьи должна быть слита и собрана в свинцовые вазы, причём металл должен быть добыт в шахтах, расположенных вдоль [Concept('waylines','лей-линий')|E] ниже уровня моря.\n3. Самая ценная семейная реликвия заклинателя должна быть сожжена или стёрта в порошок, а получившуюся пыль необходимо равномерно насыпать в вазы с кровью.\n4. ???\n5. ???\n6. Заклинатель должен приблизиться к одной из мировых [Concept('the_towers','Башен')|E] до состояния [Concept('exposure_sickness','магического облучения')|E]. После этого заклинателю надлежит исторгать кровь до потери чувств и сотворить заклятие, гарантирующее, что он останется поражённым потерей крови до самого окончания ритуала.\n7. Ритуальные символы должны быть вырезаны на нескольких точках тела заклинателя, а соответствующие знаки должны быть высечены на останках его семьи.\n8. Ритуальный круг должен быть начертан собственной кровью заклинателя, соответствуя узорам на его теле.\n9. Восемь невинных (обычно детей) должны быть принесены в жертву одновременно в узловых точках круга.\n10. Кровь из каждой вазы должна быть выпита без остатка, неспособность осушить любую из них приведёт к мгновенной смерти.\n11. ???\n12. ???\n13. Заклинатель совершает самоубийство, перерезая себе горло в самом центре круга. Он восстанет в новом обличье через семь дней."
 
 game_concept_four_forbidden_steps:0 "Четыре запретных шага"
 game_concept_four_forbidden_steps_desc:0 "Четыре запретных шага — это четыре части Тринадцати Шагов в Бездну, необходимых для достижения состояния [Concept('lichdom','личества')|E]. Доподлинно неизвестно, почему именно они запрещены и кем. Многие учёные полагают, что знания о них были попросту утеряны со времён возвышения первого зафиксированного [Concept('liches','лича')|E], [Concept('vilas_venslau','Виласа Венслау')|E], в то время как другие считают, что сведения о как можно большем числе Шагов на протяжении веков намеренно подавлялись власть имущими.\n\nРаскрытие Четырёх Шагов повсеместно признаётся самым первым шагом на пути к обретению личества, а любые разговоры о них считаются глубочайшим табу, если не полностью запрещены в большинстве культур и религий, которым ведомо о личах."
 
 game_concept_shared_lich_personalities_here:0 "Здесь"
 game_concept_shared_lich_personalities:0 "Общие черты характера личей"
 game_concept_shared_lich_personalities_desc:0 "Почти все [Concept('liches','личи')|E] являются:\n\n1. Нарциссичными: Личи обычно видят себя сильнейшими существами среди всех «живых». Все остальные личи для них — лишь жалкие подражатели, а все живые существа должны по праву склоняться перед ними. Это неизбежно приводит к тому, что почти все личи ведут непрекращающуюся войну друг с другом, воспринимая сам факт существования иного лича как оскорбление собственного могущества.\n2. Атеистичными: Личи видят в самой концепции высшей силы очередное оскорбление своего величия, считая себя самыми могущественными созданиями во вселенной. Как правило, любой лич, который верит в какую-либо форму божественности (которой он сам не обладает), рассматривает Богов как соперников, подлежащих уничтожению.\n3. Жадными: Личи непрестанно жаждут больше власти, проводя вечность либо за изучением новых и запретных [Concept('arcana','тайных искусств')|E] ради преумножения своих сил, либо вторгаясь в земли живых или других личей ради расширения своего влияния.\n4. Вероломными: У личей напрочь отсутствует чувство морали, и они с готовностью прибегнут к любому методу, который сочтут необходимым для достижения целей. Это привело к тому, что подавляющее большинство [Concept('arch_lich','архиличей')|E] в истории терпели поражение из-за того, что другой лич предавал их в самый удобный момент.\n\nОдной из неразгаданных тайн остаётся то, способны ли личи умереть окончательно. Принято считать, что если череп лича уничтожен, то он мёртв, наряду с иными способами разрушения души внутри тела. Однако многие теоретики утверждают, что даже если череп будет стёрт в порошок, лич всё равно останется заточён в этой пыли, просто лишившись возможности как-либо взаимодействовать с окружающим миром."
 
