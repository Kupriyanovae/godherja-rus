 game_concept_anohelis_outcasts:90 "Изгнанники Анохелис"
 game_concept_anohelis_outcasts_desc:90 "[Glossary('Анохелис','GH_ANOHELIS_GLOSS')] — это каста изгнанников и преступников, лишенных статуса свободных женщин или [Glossary('орзопай','GH_ORZOPAJA_GLOSS')] за тяжкие преступления, измену, предательство или трусость. В наказание их головы бреют наголо, а кожу прижигают клеймом, из-за чего волосы не могут расти десятилетиями, а после растут очень плохо. Клейменные позором и изгнанные из своих общин, они не могут вернуться под угрозой смертной казни — хотя для многих это уже участь хуже смерти."
 
