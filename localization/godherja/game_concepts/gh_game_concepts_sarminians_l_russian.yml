 game_concept_domains_of_nalma:90 "Обители Нальмы"
 game_concept_domains_of_nalma_desc:90 "В лекийской мифологии Нальма традиционно представляется единым миром, состоящим из трех различных божественных обителей: [Glossary('Уранлаш','GH_URANLASH_GLOSS')], [Glossary('Дамальма','GH_DAMALMA_GLOSS')] и #font:RedactedScriptFont [Glossary('Тальза','GH_TALZA_GLOSS')]#!. Считается, что весь живой мир разделен между ними: все, что живет под землей, близко к ней или под водой, принадлежит Уранлашу — царству, недосягаемому для человека; в то время как все, что ходит по твердой земле, будь то животное или человек, находится в пределах Дамальмы, самой материальной из обителей.\n\nПоследняя обитель — это #font:RedactedScriptFont Тальза, охватывающая как#! первое небо, так и те, что находятся выше #font:RedactedScriptFont него. Воспеваемое великолепие солнц там настолько неистово, что лишь обученные#! жрицы, #font:RedactedScriptFont как говорят, способны выдержать их сияние, возлагая свои#! срезанные косы #font:RedactedScriptFont на алтари в качестве ритуального#! жертвоприношения #font:RedactedScriptFont для общения с великими духами небес.#! "
 
