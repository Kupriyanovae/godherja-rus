 game_concept_domains_of_nalma:90 "Обители Нальмы"
 game_concept_domains_of_nalma_desc:90 "В лекийских древних сказаниях да верованиях Нальма искони предстает единым миром, сотканным из трех различных божественных обителей: [Glossary('Уранлаш','GH_URANLASH_GLOSS')], [Glossary('Дамальма','GH_DAMALMA_GLOSS')] и #font:RedactedScriptFont [Glossary('Тальза','GH_TALZA_GLOSS')]#!. Глаголют, будто всякая живая тварь разделена между ними: все, что обитает под землей, близко к ней или в глубинах вод, принадлежит Уранлашу — царству, недосягаемому для человека; в то время как все, что ходит по тверди земной, будь то зверь или человек, находится в пределах Дамальмы, самой земной из обителей, сущей во плоти.\n\nПоследняя обитель — это #font:RedactedScriptFont Тальза, охватывающая как#! первое небо, так и те, что раскинулись выше #font:RedactedScriptFont него. Воспеваемая слава тамошних солнц столь неистова, что лишь обученные#! жрицы, #font:RedactedScriptFont как говорят, способны выдержать их сияние, возлагая свои#! срезанные косы #font:RedactedScriptFont на алтари в качестве ритуальной#! требы #font:RedactedScriptFont для бесед с великими духами небес.#! "
 
