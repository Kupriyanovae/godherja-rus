 game_concept_anohelis_outcasts:90 "Изгнанники анохелис"
 game_concept_anohelis_outcasts_desc:90 "[Glossary('Анохелис','GH_ANOHELIS_GLOSS')] — это отверженная каста изгнанников и лиходеев, лишенных честного имени вольных дев или [Glossary('орзопайд','GH_ORZOPAJA_GLOSS')] за тяжкие беззакония, измену, предательство или трусость. В наказание головы их бреют наголо, а кожу выжигают клеймом, из-за чего волосы не могут расти десятилетиями, а после растут едва-едва. Отмеченные позором и выдворенные из своих общин, они не могут вернуться назад под страхом смертной казни — хотя для многих сия доля уже хуже самой смерти."
 
