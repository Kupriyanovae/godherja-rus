 ####AREA
 
 game_concept_shatteredisles:0 "Расколотые острова"
 game_concept_shatteredisles_desc:0 "Грубовато-описательное название, данное огромному архипелагу, что раскинулся к северу от Моря Империй. Он чем-то напоминает искусно сработанный глиняный диск, который с силой швырнули на землю, отчего тот разлетелся на бесчисленные осколки. Как ни странно, некоторые более мелкие острова имеют досадную привычку менять свое положение, а то и вовсе подниматься из морских пучин или погружаться обратно, словно подталкиваемые невидимой рукой. Сотни картографов из числа [Concept('marchers','марочников')|E] и [Concept('aversaria','аверсарианцев')|E] потратили годы жизни (а порой и рассудок) в тщетных попытках сосчитать их количество, и большинство современных ученых отвергают подобные начинания как бесполезное стремление познать непознаваемое. По современным оценкам, число островов исчисляется тысячами или даже десятками тысяч.\n\nСуществуют лишь скудные свидетельства, позволяющие предположить, что острова не всегда были такими. В нескольких местах можно обнаружить изъеденные временем остатки безымянных городов и храмов, чьи руины раскинулись на десятки отдельных островов. В других районах местные жители замечают, что определенные скопления отвесных, выступающих из воды скал, если смотреть на них под правильным углом, кажутся частями узнаваемой и непрерывной горы. Заманчивые зацепки, безусловно, но большинство аверсарианских ученых не могут воспринимать их всерьез. Если Расколотые острова когда-то и были объединены в один или несколько крупных массивов суши, то какая сила могла бы расколоть их на части? Подобное деяние находится далеко за пределами самого смелого воображения любого [Concept('magi','мага')|E] и превосходит даже те заклинания, что ныне известны лишь по мифам и легендам."
 
 #CHARACTERS
 
 game_concept_hameh:0 "Хамех"
 game_concept_hameh_desc:0 "Хамех, Рубиновый Пророк — имя мистической фигуры, которая первой обучила народ фаламаи поклонению Глубинным. Некогда бывший отъявленным пиратом, грабившим [Concept('shatteredisles','Расколотые острова')|E], Хамех считался утонувшим после неудачного морского сражения с соперничающим капитаном. Однако, к удивлению своего племени, Хамех вернулся из океанских глубин изменившимся человеком — если его вообще ещё можно было назвать человеком. Ибо Хамех явился с волосами, увенчанными ракушками, его левая рука превратилась в руку-щупальце Офиуры, а кожа покрылась зеленой чешуей, от которой он и получил свое новое прозвище. Хамех поведал своему благоговеющему народу о богах, обитающих на дне, и научил их совершать ритуалы, необходимые для умилостивления этих существ и даже для общения с ними. Что случилось с Хамехом впоследствии, сейчас никто сказать не может, но некоторые шепчутся, что Рубиновый Пророк все ещё живет в пучине, ожидая вместе с богами внизу своего часа, чтобы явиться миру."
 
 game_concept_araran:0 "Араран"
 game_concept_araran_desc:0 "Родившийся на метко названном Острове Кораблекрушений, Араран был одним из величайших лидеров валаконов, которого иногда приравнивали к самому Библосею. Он объединил значительную часть Западных островов и бросил вызов Аверсарианской Автократии, совершив множество набегов на их крупнейшие города и заслужив особое место в обширном пантеоне имперских пугал. К сожалению, из-за жестокости [dybolitos_sto_thallas|E], большая часть его жизни остается окутанной тайной. Едва ли найдется в Море Империй культура, которая не приписывала бы убийство Арарана какому-нибудь из своих героев, в то время как сами велки утверждают, что, достигнув преклонных лет, он отплыл к [Concept('sea_tower','Морской башне')|E] и однажды вернется, чтобы повести свой народ к славе."
 
 game_concept_xymarchos:0 "Ксимарх из Наупирны"
 game_concept_xymarchos_desc:0 "Ксимарх — пожалуй, самый известный государственный деятель Имперского острова. Впервые он упоминается в письменных источниках в 80 году от И.С. в списке членов Народного собрания города, но его стремительный взлет к вершинам власти начался со [imas_aanios|E]. Во время обороны города он находился на его стенах — один из немногих политиков, кто решился на это и выжил. Он также координировал восстановление Наупирны после набега, мобилизовав рабочую силу со всего Имперского острова, что позволило ему вскоре после этого сосредоточить в своих руках диктаторские полномочия. У него были великие планы по возвращению Наупирне статуса центра [Concept('aversaria','Аверсарии')|E]: во время своего десятилетнего правления он развернул масштабные общественные работы и крепил флот Оутарадейкона. К сожалению, огромные долги, которые он нажил в Орайсполе, в сочетании с его жгучим честолюбием нажили ему немало врагов. В 96 году от И.С. он был средь бела дня убит в результате заговора этепезейских купцов и его противников в Народном собрании, а его политические достижения были практически сведены на нет в последовавшие за этим годы междоусобиц. И все же он остается героем для граждан города, которого чтят даже потомки его убийц."
 
 #EVENTS
 
 game_concept_dybolitos_sto_thallas:0 "Диболитос сто Таллас"
 game_concept_dybolitos_sto_thallas_desc:0 "Разорение морей представляло собой жестокую, длившуюся десятилетиями военную кампанию [Concept('aversaria','аверсарианцев')|E], начатую Автократом Эксионраксом в 162 году от И.С., которая фактически положила конец морской гегемонии шамрани. Это был ответ на многовековые обиды, нанесенные аверсарианцам, главной из которых стал [imas_aanios|E]. Проходившее по всему Морю Империй Разорение было кампанией на истребление валаконских народов. Хотя Аутократия и заявила о своей победе в этом конфликте, им так и не удалось полностью подавить сопротивление валаконов, чьи остатки уцелели на островах вдоль побережья Калатипсоми."
 
 game_concept_imas_aanios:0 "Имас Аниос"
 game_concept_imas_aanios_desc:0 "День скорби — это [Concept('aversaria','аверсарианcкое')|E] название дерзкого набега на город Наупирна, совершенного валаконским лидером [Concept('araran','Арараном')|E] в 83 году от И.С. Половина города превратилась в пепел, включая Оутарадеибибликон — вероятно, крупнейшую аверсарианскую библиотеку того времени, в которой хранилась большая часть ранней литературы. Масштаб разрушений в сочетании с огромной данью, затребованной велками, едва не привели к тому, что город был заброшен; его дальнейшее существование стало возможным лишь благодаря колоссальным усилиям государственного деятеля [Concept('xymarchos','Ксимарха')|E], который мобилизовал рабочих со всего острова для помощи в восстановлении. Тем не менее, этот набег нанес тяжелый удар по политическому влиянию Имперского острова и по сей день остается одним из самых травмирующих событий в истории Аверсарии, а унижение от поражения так никогда и не было забыто."
 
 #MISC
 
 game_concept_little_chevalie_beyond_the_sea:0 "Малая Шевалье за морем"
 game_concept_little_chevalie_beyond_the_sea_desc:0 "Популярное выражение, используемое для описания Диоренских островов; этот термин впервые был употреблен в «Аннотированном путеводителе мореплавателя по Малым островам, скалам и прочему» Дюмара д'ва Лафайета.\n\nВ этой книге Дюмар признает, что отношения между островитянами и Шевалье охладели после того, как диоренские рыцари сражались на стороне Чемпиона во время [Concept('red_river_war','Войны Красной реки')|E], но уже в следующей главе пренебрежительно отзывается об островитянах как о «подобии Порт-ден-ла-Бастион, если бы тот ушел под воду и был заселен рыбами, лопочущими на едва узнаваемой помеси нашего прекрасного языка»."