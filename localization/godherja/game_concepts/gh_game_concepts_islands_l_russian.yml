 ####AREA
 
 game_concept_shatteredisles: "Расколотые острова"
 game_concept_shatteredisles_desc: "Грубое да простое прозвище, коим окрестили великий архипелаг, что раскинул свои рубежи к северу от Моря Империй. Видом своим он являет искусно сработанный глиняный круг, коего с размаху швырнули на каменистую землю, отчего тот разлетелся на бесчисленные осколки. Странное дело, но иные малые острова имеют дурную привычку менять свое место на карте, а то и вовсе вздыматься из морской пучины или уходить обратно на дно, словно подталкиваемые невидимой дланью. Сотни картографов из числа [Concept('marchers','марочникских')|E] и [Concept('aversaria','аверсарианских')|E] книжников сгубили годы жизни (а порой и здравый ум) в тщетных попытках счесть их число, но нынешние ученые мужи оставили сие занятие как пустое стремление познать непознаваемое. По нынешним прикидкам, островов тех насчитывается тысячи, а то и десятки тысяч.\n\nСкудные крупицы древних сказаний позволяют чаять, что сии земли не всегда лежали в таком разорении. В иных местах можно набрести на изъеденные солью останки безымянных градов и святилищ, чьи руины раскиданы по десяткам отдельных островов. В других краях местные рыбаки подмечают, что скопища отвесных, торчащих из воды скал, коли глядеть на них с правильного мыса, кажутся хребтами некогда единой и непрерывной горы. Заманчивые зацепки, спору нет, но аверсарианские ученые мужи не могут воспринимать их всерьез. Если Расколотые острова в стародавние века и были единой твердью, то какая же сила могла расколоть их в прах? Подобное деяние лежит далеко за пределами ума любого [Concept('magi','мага')|E] и превосходит чары, кои ныне памятны лишь по глухим мифам да сказкам."
 
 #CHARACTERS
 
 game_concept_hameh: "Хамех"
 game_concept_hameh_desc: "Хамех, Рубиновый Пророк — так зовут таинственного мужа, коего волею народ фаламаи впервые стал бить челом Глубинным тварям. В былые годы он был прожженным пиратом, грабившим купцов на [Concept('shatteredisles','Расколотых островах')|E], и все считали его утопшим после жестокого морского боя с чужим корсаром. Однако, к изумлению своего племени, Хамех воротился из океанской бездны совсем иным человеком — коли его вообще еще можно было назвать человеком. Ибо Хамех явился пред сородичами с волосами, облепленными ракушками, левая рука его обратилась в щупальце Офиуры, а кожа покрылась зеленой чешуей, от коей он и получил свое новое прозвище. Хамех поведал оробевшему народу о богах, кои таятся на самом дне, и научил их править обряды, нужные для умилостивления сих тварей и даже для бесед с ними. Куда занесла его судьба после, ныне никто сказать не может, но иные шепчут, что Рубиновый Пророк до сих пор живет в темной пучине, дожидаясь вместе с донными тварями своего часа, дабы вновь явиться миру."
 
 game_concept_araran: "Араран"
 game_concept_araran_desc: "Рожденный на Острове Кораблекрушений, коего имя говорит само за себя, Араран стал одним из величайших вождей валаконов, коего в песнях ставили вровень с самим Библосеем. Он сплотил под своей рукой большую часть Западных островов и дерзко пошел войной на Аверсарианскую Аавтократию, совершив множество разорительных набегов на их богатейшие грады и заняв почетное место среди главных имперских пугал. К несчастью, из-за лютости [dybolitos_sto_thallas|E], большая часть его жития осталась скрыта туманом веков. Едва ли найдется в Море Империй народ, который не приписывал бы убийство Арарана какому-нибудь из своих витязей, тогда как сами велки уверяют, будто, дожив до глубокой старости, он ушел на ладье к [Concept('sea_tower','Морской башне')|E] и однажды еще воротится, дабы повести свой род к вечной славе."
 
 game_concept_xymarchos: "Ксимарх из Наупирны"
 game_concept_xymarchos_desc: "Ксимарх — пожалуй, самый поминаемый в речах правитель Имперского острова. Впервые имя его всплывает в хартиях в восьмидесятом году от И.С. в списках Народного вече, но крутой его взлет к вершинам власти начался во времена, когда грянул [imas_aanios|E]. Во время обороны града он сам стоял на забралах стен — один из немногих старейшин, кто решился на такое и уцелел в сече. Он же правил восстановлением Наупирны после набега, созвав мужиков да согнав челядь со всего Имперского острова, что позволило ему вскоре забрать в свои руки единовластие и волю самодержавную. Он вынашивал великие замыслы о том, как вернуть Наупирне имя сердца [Concept('aversaria','Аверсарии')|E]: во время своего десятилетнего правления он заложил масштабные стройки и укрепил ратный флот Оутарадейкона. К несчастью, великие долги, коих он назанимал в Ораисполе, вместе с его жгучей гордыней нажили ему немало лихих недругов. В девяносто шестом году от И.С. он был средь бела дня заколот заговорщиками из числа этепезейских купцов и своих противников по вече, а его дела были почти полностью пущены по ветру в последовавшие затем годы усобиц. И все же он остался героем для граждан града, коего чтят даже правнуки его убийц."
 
 #EVENTS
 
 game_concept_dybolitos_sto_thallas: "Диболитос сто Таллас"
 game_concept_dybolitos_sto_thallas_desc: "Разорение морей являло собой лютую, длившуюся долгие десятилетия военную страду [Concept('aversaria','аверсарианцев')|E], начатую аавтократом Эксионраксом в 162 году от И.С., коя в прах сокрушила старшинство шамрани на морях. То был грозный ответ на многовековые обиды, нанесенные империи, из коих главной стал [imas_aanios|E]. Прокатившееся по всему Морю Империй Разорение было походом на полное истребление валаконских родов. И пускай Аавтократия во всеуслышание заявила о своей победе в сей брань, им так и не удалось до конца сломить сопротивление валаконов, чьи остатки укрылись на скалистых островах вдоль побережья Калатипсоми."
 
 game_concept_imas_aanios: "Имас Аниос"
 game_concept_imas_aanios_desc: "День скорби — так на [Concept('aversaria','аверсарианский')|E] лад зовут дерзкий набег на град Наупирна, учиненный валаконским вождем [Concept('araran','Арараном')|E] в восемьдесят третьем году от И.С. Добрая половина города тогда обратилась в пепел, включая Оутарадеибибликон — станется, величайшее книгохранилище Аверсарии той поры, где берегли большую часть древней словесности. Великое разорение вместе с неподъемной данью, кою затребовали велки, едва не привели к тому, что град был заброшен; жизнь в нем теплилась лишь благодаря колоссальным трудам правителя [Concept('xymarchos','Ксимарха')|E], коий согнал работников со всего острова на отстройку посадов. И все же сей набег нанес тяжелый удар по силе Имперского острова и по сей день числится одной из самых черных страниц в памяти Аверсарии, а позор того поражения так никогда и не был смыт."
 
 #MISC
 
 game_concept_little_chevalie_beyond_the_sea: "Малая Шевалье за морем"
 game_concept_little_chevalie_beyond_the_sea_desc: "Ходячее присловье, коим кличут Диоренские острова; сие речение впервые запечатлел в своем «Аннотированном путеводителе мореплавателя по Малым островам, скалам и прочему» Дюмар д'ва Лафайет.\n\nВ той книге Дюмар признает, что лад между островитянами и Шевалье дал трещину после того, как диоренские рыцари бились на стороне Чемпиона во время [Concept('red_river_war','Войны Красной реки')|E], но уже в следующей главе с пренебрежением отзывается об островитянах как о «подобии Порт-ден-ла-Бастион, если бы тот ушел под воду и был заселен рыбами, лопочущими на едва узнаваемой помеси нашего прекрасного языка»."