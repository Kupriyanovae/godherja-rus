 ###Religion and Mythology
 
 game_concept_ebohephai_mythology:0 "Мифология эбохефаев"
 game_concept_ebohephai_mythology_desc:0 "Обособившаяся ольтенская вера с дальнего востока. Эбохефаи почитают совершенно иной сонм богов, нежели ольтены, хотя их сказания и остаются схожими. В мифах об Эбохеф-Ольгоне (Белом Ольгоне) бог Арлихан был сражён завистливой богиней Ару-мен, пожелавшей узурпировать престол Эбохеф-Ольгона. Однако, сойдя на [Concept('aeras','Эрас')|E], Арлихан вступил в бой с Ару-мен и её пятью тысячами духов-демонов, подчинил их и изгнал её на Гору Боли. Из-за этого эбохефаи не пытают ненависти к земле, а напротив, почитают её священной и погребают своих покойников в могильных курганах. Они поклоняются Арлихану, его пяти тысячам духов-демонов и ста богам огня. Его брату, Когонхаю, была отдана власть над всем поднебесьем, и именно от него пошёл род человеческий."
 
 game_concept_pantheon_of_death:0 "Пантеон Смерти"
 game_concept_pantheon_of_death_desc:0 "Главным столпом дарамаржаратанского богословия является $game_concept_pantheon_of_death$ — вера в то, что Дарамаржаратан правит не только подземным миром человеческих душ, но и загробным усыпалищем павших богов (и, что вызывает больше всего споров, возможно, вообще всех богов). В Пантеоне Смерти души остальных небожителей остаются взаперти после их видимой кончины, а волю их можно узнать только через Дарамаржаратан, толковательницу умерших. Таким образом, Дарамаржаратан, по сути, блюдёт престол богов, а все мнимые предзнаменования и беседы с небожителями на самом деле вершатся через Дарамаржаратан, передающую их послания по собственному усмотрению."
 
 game_concept_avastya_mahani_history:0 "Истоки Авастья-Махани"
 game_concept_avastya_mahani_history_desc:0 "Одна из старейших вер [Concept('aeras','Эраса')|E] и, скорее всего, древнейшая укоренившаяся религия в Каширии. Вера Авастья-Махани — это многобожническая религия, которая по меньшей мере за две тысячи лет до основания [Concept('aversaria','Аверсарии')|E] либо пришла на запад из земель Дахангона с переселенцами, либо зародилась под влиянием язычников, явившихся в Каширию из тех краёв. Хотя большинство последователей Авастья-Махани выбирают одного или нескольких богов для своего поклонения, многие общины конкретных божеств откололись от общей веры и сформировали собственные толки (особенно после завоевания Каширии [Concept('iorne_horde','Железной ордой')|E] Отачеда), такие как Сараварават, бог знания, чьи последователи основали видваукеятранизм, и Кархикала, бог войны, смерти и справедливости, чьи приверженцы образовали кариткамаицизм."
 
 game_concept_paerasjatan_old_myth:0 "Древнейший миф о Паэрасжатане"
 game_concept_paerasjatan_old_myth_desc:0 "Древнейшие мифы Авастья-Махани, вера в которые ныне крайне редка, утверждают, будто бесчисленные боги — лишь отражения Паэрасжатана, сотворившего их всех."
 
 game_concept_pethyka:0 "Петика"
 game_concept_pethyka_desc:0 "Петика был каширийским мудрецом, который в IV веке по имперскому летоисчислению (И.С.) отыскал и прочёл каждую из девяноста одной священной книги, кои, как считалось, были начертаны богом Сарватом и его шестью равными братьями и сёстрами, а затем, по преданиям, вознёсся после своей мученической кончины от рук суеверных воевод, кои убили его и предали книги огню."
 
 game_concept_varodist_creation_myth:0 "Вародистский миф о сотворении мира"
 game_concept_varodist_creation_myth_desc:0 "Вародисты верят, что сотворение мира произошло от вечного движения воды, которая медленно вытачивала сушу из камня, и что священные океаны и моря могут являть пророчества в беге своих волн. Они видят время цикличным, полагая, что мир находится в бесконечной череде поглощений пучиной и разрушений, после чего воды вновь отступают, а морские твари снова выходят на сушу, дабы заселить преобразившуюся землю.\n\nВародисты также поклоняются чадам Вароды — водным обитателям морей, от которых, как они утверждают, произошли все земные твари; древние чудища медленно ступали по земле, сбрасывая чешую."
 
 game_concept_aspects_of_aruvas:0 "Аспекты Аруваса"
 game_concept_aspects_of_aruvas_desc:0 "Последователи Арувасуени верят, что мир родился, когда Арувас, великий Царь-Солнце-Луна, распался под тяжестью своей божественной силы и разделил себя на три царства творения. Из них [Glossary('Арува Цере','GH_ARUVA_TSERE_GLOSS')] стал Солнцем, [Glossary('Арува Нилуд','GH_ARUVA_NILUD_GLOSS')] — Луной, а [Glossary('Арува Агат','GH_ARUVA_AGAT_GLOSS')] дал начало духу человечества. Ни одно живое существо не способно нарушить границы, разделяющие сферы бытия; а потому лишь мёртвые могут воссоединиться в истинном божественном величии в загробной жизни."
 
 #game_concept_oskinjer:0 "Ос Кинжер"
 #game_concept_oskinjer_desc:0 "Ос Кинжер (Последнее испытание) вершится в час кончины, когда три аспекта Аруваса судят и решают участь усопшего: встретит ли он Аруву Цере в чертогах рая или будет обречён трудиться в вечной темнице Арувы Нилуд. Сий обычай также переносится на повседневную жизнь, когда гостя чествуют великим пиром."
 
 #game_concept_rutbay_prophesy:0 "Пророчество веры Рут'бай"
 #game_concept_rutbay_prophesy_desc:0 "Вероучение Рут'бай пророчествует, что однажды, когда мир будет нуждаться в них больше всего, двенадцать отступников вернутся из Рая и спасут верных от их грехов. Хотя изначально сие было крупное движение, отсутствие поддержки со стороны богатейших городов Арувасуени привело к скорому подавлению веры. Однако, несмотря на то, что чужеземные владыки часто высмеивали её, её влияние на раннюю религию невозможно переоценить."
 
 #game_concept_sword_mother:0 "Матерь Мечей Сар'муир"
 #game_concept_sword_mother_desc:0 "Говорят, что Матерь Мечей — это ангельская десница Арувы Нилуд. Утверждается, что именно с ней сталкиваются те, кто провалил Ос Кинжер, и она забирает павших верных в царство своего лунного владыки. Почитаемая во всех верованиях Арувасуени за свою силу и мудрость, более всего она уважаема племенем Сар'муир. Они верят, что Матерь Мечей — Королева Мёртвых, подобно тому как Арува Агат — Король Живых, и ревностно оберегают своё право вести родословную до самых первых Сар'муир."
 
 #game_concept_fate_of_ertomaxism:0 "Судьба эртомаксизма"
 #game_concept_fate_of_ertomaxism_desc:0 "Хотя гибель [Concept('ertomax','Эртомакса')|E] от рук безымянного убийцы стала трагическим ударом для его звероподобных последователей, она не положила конец этому сектантскому верованию, наводившему ужас на неверных в южном Айроное. Оставаясь влиятельной силой в рамках общего течения Арувасуе, его сторонники продолжают ждать дня, когда он вернётся, дабы возобновить очищение мира. Многие объявляли себя возлюбленным Эртомаксом, но немногие выживали достаточно долго, дабы исполнить его предназначение."
 
 game_concept_armazli_mountains:0 "Горы Армазли"
 game_concept_armazli_mountains_desc:0 "Верные Арназни верят, что горы Армазли, оберегающие их от северных варваров, были воздвигнуты их предками, обладавшими богоподобными магическими силами. Однако со временем сии существа начали терять свое могущество из-за того, что стали довольными и мягкими. Исключением стали три брата: [Concept('arnaz_azot_zalden','братья Арназ')|E]. Испытывая отвращение к новым привычкам своих собратьев, трое из них воздвигли новую гору. Арназ, будучи старшим и мудрейшим, был коронован верховным царем. После того как Парназ убил Азота в поединке за верховную власть, великая гора, на которой был коронован его отец, была переименована в его честь, и ни один скверный человек или зверь не может ступить на неё."
 
 game_concept_arnaz_azot_zalden:0 "Братья Арназ"
 game_concept_arnaz_azot_zalden_desc:0 "Арназ, Азот и Залден были тремя братьями и, как говорят, одними из многих предков амагейцев, обладавших богоподобными силами. Испытывая отвращение к растущей беспечности и изнеженности своих собратьев, трое отправились воздвигать новую гору. Арназ, старший и мудрейший, был коронован верховным царем и начал поход ради объединения земель. Однако во время войн его брат Азот позавидовал его успеху и предал его, убив Арназа и захватив престол. Но перед смертью Арназ проклял всех, что привело к колоссальному упадку магических способностей. Более того, Арназ провозгласил, что его сын убьёт Азота и вернёт верховную власть.\n\nИ вот, спустя много лет, юноша по имени Парназ с помощью Залдена сразил Азота в поединке и вернул престол. Великая гора, на которой был коронован его отец, была переименована в его честь, и ни один скверный человек или зверь не может ступить на неё. Парназ правил многие века, и многие в Амагее сегодня приходятся ему родственниками."
 
 game_concept_xaxbaxakanax_esotericism:0 "Эзотеризм Ксаксбаканакса"
 game_concept_xaxbaxakanax_esotericism_desc:0 "Из-за их исключительно простого набора верований по сравнению с другими современниками, многие находят их веру крайне таинственной и закрытой. Считается (по крайней мере, аверсарианцами), что это вызвано их крайней примитивностью и раздробленностью в те времена, когда их немногие исторические владения были поглощены соседями. Очень немногие государства имели над ними власть.\n\nИ потому, когда их родные земли были завоёваны аверсарианцами, они увидели в них лишь очередных деспотов в череде мелких тиранов, которые извечно приходят и уходят. Как следствие, верующие в основном избежали сурового обращения, будучи слишком незначительными, чтобы привлечь к себе внимание."
 
 game_concept_evil_lore:0 "Порочные знания"
 game_concept_evil_lore_desc:0 "Аскеварьянцы называют «порочными знаниями» крупицы мудрости, которые проникли в мир вопреки воле Сарвата благодаря усилиям злых демонов и богов. Чтобы исполнить волю Сарвата и сделать мир таким, каким он его желал, «порочные знания» должны быть уничтожены и искоренены. Это закономерно привело к тому, что аскеварьянцы постоянно сжигают библиотеки по всей Каширии в попытках стереть остатки древних и тёмных ритуалов."
 
 ## ARCANA
 game_concept_arcana:0 "Аркана"
 game_concept_arcana_desc:0 "Аркана — это [Concept('skill','навык')|E], отражающий познания персонажа в мистических практиках. Он усиливает [Concept('spellcasting_ability','способность к сотворению заклинаний')|E], а также их магическую силу в дуэлях.\n\nСоответствующим [Concept('lifestyle','образом жизни')|E] являются [Concept('arcana_lifestyle','«Аркана»')|E]."
 game_concept_arcana_i:0 "@skill_arcana_icon!"
 game_concept_arcana_skill:0 "Навык Аркана"
 game_concept_arcana_skill_desc:0 "Аркана — это [Concept('skill','навык')|E], отражающий познания персонажа в мистических практиках. Он усиливает [Concept('spellcasting_ability','способность к сотворению заклинаний')|E], а также их магическую силу в дуэлях.\n\nСоответствующим [Concept('lifestyle','образом жизни')|E] являются [Concept('arcana_lifestyle','«Аркана»')|E]."
 game_concept_arcana_lifestyle:0 "Образ жизни: Аркана"
 game_concept_arcana_lifestyle_desc:0 "Образ жизни $game_concept_arcana_lifestyle$ подходит для персонажей, которые хотят улучшить свои познания в [Concept('magic','магии')|E] и внутреннем устройстве [Concept('aeras','Эраса')|E] с помощью [Concept('artifacts','артефактов')|E] и [Concept('travel','путешествий')|E]."
 game_concept_arcane:0 "арканный"
 
 ## MAGIC PROWESS
 game_concept_magic_prowess:0 "Магическое мастерство"
 game_concept_magic_prowess_i:0 "@magic_icon!"
 game_concept_magic_prowess_skill:0 "Магическое мастерство"
 game_concept_magic_prowess_skill_desc:0 "Магическое мастерство — это второстепенный [Concept('skill','навык')|E], добавляемый к [Concept('prowess','доблести')|E] персонажа, если он освоил какую-либо [Concept('magic_type','школу магии')|E], отражая умение вести бой с помощью [Concept('magic','магических')|E] средств.\n\nОно не угасает с возрастом и является главным фактором в магических дуэлях."
 game_concept_magical_arcane:0 "арканный"

