 game_concept_the_continent:0 "Континент"
 game_concept_continent_posessive:0 "Континента"
 game_concept_continent:0 "Континент"
 game_concept_continental:0 "Континентальный"
 game_concept_greater_aversaria:0 "Великая Аверсария"
 game_concept_the_continent_desc:0 "„Континент“, или „Великая Аверсария“, — общепринятое название западного региона [Concept('aeras','Эраса')|E], включающего в себя земли [Concept('aversaria','Аверсарии')|E] и [Concept('chevalie','Шевалье')|E]. Поскольку Аверсария доминировала здесь на протяжении большей части истории, в западной традиции континент постепенно начали именовать в её честь, хотя многие иные культуры сохраняют собственные названия для этой области.\n\nОбщепринятыми границами Великой Аверсарии считаются земли к северу от [Concept('the_lichdoms','Личеств')|E], восточная граница Айроноя и бескрайние просторы диких земель и гор на далёком северо-востоке."
 
 game_concept_the_towers:0 "Башни"
 game_concept_towers:0 "Башни"
 game_concept_tower:0 "Башня"
 game_concept_the_towers_desc:0 "Башни — это сеть странных и загадочных обелисков, воздвигнутых в незапамятном прошлом по всему [Concept('aeras','Эрасу')|E]. Почти идентичные по своей архитектуре, все они выстроены из причудливого иномирного чёрного камня и взмывают ввысь намного выше любых зданий, доступных человеческому воображению. Вокруг этих монументов часто зарождались культы и религии, чья вера подпитывалась мощными потоками [Concept('magic','магии')|E], исходящими от монолитов.\n\nНесмотря на колоссальный интерес к Башням, доподлинно неизвестно, видел ли кто-нибудь их изнутри, поскольку каждая из них окружена смертоносным магическим полем.\n\nСамой знаменитой среди них является [Concept('sea_tower','Морская башня')|E] (или „Имперская башня“ для [Concept('aversaria','аверсарианцев')|E]), которую называют бывшим престолом „Чистейших“. Некоторые мистические ордены утверждают, будто она некогда служила обителью самому [Concept('aersanon','Создателю')|E] этого мира."
 
 game_concept_sea_tower:0 "Морская башня"
 game_concept_imperial_tower:0 "Имперская башня"
 game_concept_sea_tower_desc:0 "Морская башня (или Имперская башня) — одна из нескольких [Concept('the_towers','Башен')|E], разбросанных по всему миру. Её уникальность заключается в том, что она высится гораздо выше своих собратьев, а исходящая от неё [Concept('magic','магическая')|E] мощь столь велика, что Морская башня считается сильнейшим средоточием чародейства на всём Эрасе. Сила её настолько колоссальна, что служит истоком для [Concept('tower_wayline','Имперской лей-линии')|E].\n\nНесмотря на это, ни одна живая душа ещё не переступала её порог. Плотнейшая концентрация чистой магии мгновенно испепеляет любого, кто дерзнёт к ней приблизиться, из-за чего разбитые остовы кораблей облепили её подножие подобно морским уточкам.\n\n[Concept('aversaria','Аверсарианцы')|E] утверждают, что Морская башня (или, как они её называют, Имперская башня) когда-то была троном „Чистейших“, и знамя имперской провинции Этепезея с гордостью несёт её силуэт в самом центре. Некоторые тайные общества верят, что на самом деле здесь восседал сам [Concept('aersanon','Создатель')|E] этого мира."
 
 #MONSTERS
 
 game_concept_dragons:0 "Драконы"
 game_concept_dragon:0 "Дракон"
 game_concept_dragons_desc:0 "Драконы — это [Concept('godtouched_creatures','затронутые богами существа')|E], обитавшие преимущественно в [Concept('aversaria','Аверсарии')|E] и частях северо-восточного [Concept('sarradon','Саррадона')|E] с доисторических времён примерно до середины III века от И.С. Эти свирепые исполинские рептилии могли изрыгать на врагов пламя, лёд или яд, летать на огромных кожистых крыльях и обладали интеллектом, не уступающим человеческому, а порой и превосходящим его. Они были способны к сложной речи, хотя их голос, судя по всему, слышали лишь те, к кому они обращались напрямую. Окрас чешуи драконов разнился в зависимости от природы их дыхания. Обычно они держались стаями до шести особей — родительская пара и их потомство, которое покидало гнездо, как только обзаводилось собственными парами или основывало свои стаи.\n\nДраконы были редким, но далеко не уникальным явлением на своей родине вдоль Расколотого побережья, и в аверсарианском обществе считалось величайшей честью получить звание всадника на драконе после приручения одного из этих существ, что обычно достигалось через подобие искренней дружбы. Возвышение Аверсарии совпало — отчасти благодаря государственным программам выведения — с резким ростом популяции этих ящеров, и к началу [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E] насчитывалось более 800 зарегистрированных всадников, принадлежавших к различным военным ложам и братствам по всей империи.\n\nДраконы были практически полностью истреблены во время той войны и сразу после неё: сперва в яростных битвах, а затем по приказу автократа Аэксионаракса, который счёл уцелевших ящеров слишком опасными и велел забить их поголовно.\n\nСамым знаменитым драконом в истории была [Concept('arthenax','Артенакс')|E], которую принято считать последней представительницей своего великого племени."
 
 game_concept_griffons:0 "Грифоны"
 game_concept_griffon:0 "Грифон"
 game_concept_griffons_desc:0 "Грифоны — это разновидность [Concept('godtouched_creatures','затронутых богами существ')|E], которые традиционно гнездятся в горах [Concept('chevalie','Шевалье')|E]. У грифонов мощное тело и задние лапы льва, а голова, крылья и передние когти — орлиные. Они почитаются как исключительно благородные [Concept('creature','создания')|E] в маркском фольклоре; многие народные герои Марки описываются как наездники на грифонах, а образ рыцаря, оседлавшего грифона — традиционный символ, представляющий [Concept('antimagic_orders','антимагические ордены')|E].\n\nНеизвестно, стали ли грифоны более редкими из-за разрастания человеческих поселений в Шевалье, или же древние сказания просто преувеличивали их численность, но старинные саги Марки повествуют о целых армиях всадников на грифонах. В современную эпоху наездники на грифонах встречаются нечасто, обычно это прерогатива членов королевских семей и элитных подразделений, выставляемых антимагическими орденами, некоторые из которых содержат собственные питомники и гордятся выведением этих благородных зверей. Существует традиция, по которой каждый крупный антимагический орден преподносит новоиспечённому монарху молодого грифона. Правитель сам выбирает себе зверя, а затем обучается вместе с вырастившим его орденом, постигая искусство верховой езды и ведения боя со спины крылатого хищника.\n\nГрифоны невероятно умны. Те из них, кто часто контактирует с людьми, способны понимать устную речь и реагировать на сложные фразы, хотя сами не могут воспроизвести ни одного человеческого слова.\n\nИх близкими родичами считаются гиппогрифы, некогда обитавшие в Чёрных горах к востоку от Шевалье, однако считается, что они полностью вымерли из-за чрезмерного использования маркскими рыцарями во время [Concept('marcher_aversarian_wars','Войн Марки и Аверсарии')|E]."
 
 game_concept_mutated:0 "Мутировавшие"
 game_concept_mutate:0 "Мутировать"
 game_concept_mutants:0 "Мутанты"
 game_concept_mutant:0 "Мутант"
 game_concept_mutation:0 "Мутация"
 game_concept_mutations:0 "Мутации"
 game_concept_mutant_creatures:0 "Мутировавшие существа" 
 game_concept_mutations_desc:0 "Мутации — это следствие воздействия колоссальных объёмов [Concept('magic','магии')|E], которое не привело к мгновенной смерти. Хотя подобному облучению часто подвергаются люди вблизи крупных полей сражений между [Concept('magi','магами')|E], в местах средоточия силы или порой в деревнях, расположенных вдоль лей-линий, выжить после этого удаётся немногим. Иногда маги намеренно создают мутантов в ходе своих экспериментов, что обычно приводит к ужасающим и зловещим результатам.\n\nМутации могут проявляться как угодно: от светящихся глаз и лишних конечностей до полного изменения облика. Множество чудовищ, сотворённых древними магами или давно канувшими в лету цивилизациями, до сих пор бродят по [Concept('aeras','Эрасу')|E], поддерживаемые чародейской энергией. Не зафиксировано ни одного подтверждённого случая, когда эти твари подчинялись бы кому-то, кроме своего создателя, зато свидетельств того, как чудища пожирали своих творцов, предостаточно.\n\nК счастью для большинства, избыток магической энергии обычно приводит к [Concept('exposure_sickness','магической лучевой болезни')|E] задолго до того, как наступит окончательная смерть или необратимая трансформация, так что большинство людей могут избежать худшего, если вовремя распознают симптомы."
 
 game_concept_fogbeasts:0 "Туманные твари"
 game_concept_fogbeast:0 "Туманная тварь"
 game_concept_fogbeasts_desc:0 "Туманная тварь — это любое [Concept('creature','существо')|E], порождённое или [Concept('mutations','мутировавшее')|E] в [Concept('the_fog','Тумане')|E]. [Concept('aversaria','Аверсарианские')|E] учёные обычно разделяют их на две группы:\n\n— Туманные твари Мутации:\nСущества, чья плоть и разум были извращены пагубным воздействием Тумана. Чаще всего встречаются искажённые волки, медведи и лоси, хотя поступали сообщения даже о том, что вполне безобидные деревья и сама земля под ногами начинали вести себя как разумные хищники. [Concept('fogeaters','Пожирателей тумана')|E] также можно отнести к этому типу.\n\n— Туманные твари Мысли:\nСоздания, порождённые глубинными человеческими страхами и помыслами во время пребывания в Тумане. Вопреки расхожему мнению, речь идёт не о сиюминутных мыслях, и появление Тварей Мысли нельзя предотвратить, просто стараясь „думать о хорошем“. Вместо этого Туман находит самые потаённые тревоги и убеждения, воплощая их в кошмарных монстров, смутно вдохновлённых этими страхами. В Тумане часто повторяют поговорку: „Если ты услышал монстра в Тумане — значит, ты его уже создал“."
 
 game_concept_creature:0 "Существо"
 game_concept_creatures:0 "Существа"
 game_concept_creature_desc:0 "Существа (когда это слово не используется как оскорбление) — это любые живые организмы на [Concept('aeras','Эрасе')|E], кроме людей. Обычно их делят на три категории:\n\n[Concept('natural_creatures','Естественные существа')|E]: Любое создание, являющееся естественной частью экосистемы. Как правило, сюда относят животных, не демонстрирующих зачатков высшего разума, таких как собаки, рыбы и лошади.\n\n[Concept('godtouched_creatures','Затронутые богами')|E]: К затронутым богами обычно относят существ, обладающих высоким уровнем интеллекта или сочетающих в себе анатомию сразу нескольких разных животных. [Concept('griffons','Грифоны')|E], [Concept('dragons','драконы')|E] и даже мифический [Concept('the_worldeater','Пожиратель миров')|E] считаются или считались затронутыми богами.\n\n[Concept('mutations','Мутировавшие существа')|E]: Существа, возникшие в результате магических [Concept('mutations','мутаций')|E] — как преднамеренных, так и спонтанных. Поскольку большинство из них абсолютно уникальны и неповторимы, их не классифицируют по видам. Главная объединяющая их черта — склонность жить невероятно долго, возможно, вечно, подпитываясь чистой магией. [Concept('fogbeasts','Туманных тварей')|E] можно назвать разновидностью таких существ, хотя в обиходе большинство мутантов называют просто [Concept('monsters','монстрами')|E]."
 
 game_concept_natural_creatures:0 "Естественные существа"
 game_concept_natural_creatures_desc:0 "Естественные существа, согласно определению в бестиарии [Concept('magi','мага')|E] Калатаркикоса „Удивительные твари мира“ (признанном стандарте естественных наук) — это любые [Concept('creature','существа')|E], которые не выказывают признаков высшего разума и не имеют физических черт, заимствованных от других видов животных. Примерами могут служить домашний скот, собаки, кошки, лошади, верблюды и большинство лесных обитателей. Будучи самой многочисленной группой фауны, естественные существа встречаются практически во всех уголках [Concept('aeras','Эраса')|E] и [Concept('the_continent','Континента')|E].\n\nНесмотря на сомнительные заявления некоторых аверсарианских антропологов, чужеземцы ни в коей мере не считаются дикими существами."
 
 game_concept_godtouched_creatures:0 "Затронутые богами существа"
 game_concept_godtouched_creature:0 "Затронутое богами существо"
 game_concept_godtouched_creatures_desc:0 "Затронутые богами существа, согласно определению в бестиарии [Concept('magi','мага')|E] Калатаркикоса „Удивительные твари мира“ (признанном стандарте естественных наук) — это любые [Concept('creature','существа')|E], чей интеллект развит на уровне от близкого к человеческому до постчеловеческого, и/или чья анатомия сочетает в себе черты нескольких разных животных. Яркими примерами затронутых богами существ служат [Concept('griffons','грифоны')|E], [Concept('dragons','драконы')|E] и гиппогрифы. Граница между затронутыми богами и естественными видами порой бывает весьма размытой, из-за чего классификация многих новооткрытых животных вызывает ожесточённые споры в научных кругах.\n\nХотя [Concept('mutations','Мутанты')|E] также могут сочетать в себе черты различных зверей, уникальность их природы и неописуемо жуткий облик обычно исключают их из этой категории."
 
