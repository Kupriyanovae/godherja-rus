 ###Religion and Mythology
 
 game_concept_ebohephai_mythology:0 "Мифология эбохефаев"
 game_concept_ebohephai_mythology_desc:0 "Обособившаяся ольтенская вера с дальнего востока. Эбохефаи почитают совершенно иной пантеон, нежели ольтени, хотя их мифологии и остаются схожими. В мифологии Эбохеф-Ольгона (Белого Ольгона) бог Арлихан был сражён завистливой богиней Ару-мен, пожелавшей узурпировать трон Эбохеф-Ольгона. Однако, спустившись на [Concept('aeras','Эрас')|E], Арлихан вступил в бой с Ару-мен и её пятью тысячами духов-демонов, подчинил их и изгнал её на Гору Боли. Из-за этого эбохефаи не ненавидят землю, а напротив, считают её священной и хоронят своих покойников в погребальных курганах. Они поклоняются Арлихану, его пяти тысячам духов-демонов и ста богам огня. Его брату, Когонхаю, была отдана власть над всем поднебесьем, и именно от него произошёл род человеческий."
 game_concept_pantheon_of_death:0 "Пантеон Смерти"
 game_concept_pantheon_of_death_desc:0 "Главным столпом дарамаржаратанского богословия является $game_concept_pantheon_of_death$ — вера в то, что Дарамаржаратан правит не только подземным миром человеческих душ, но и подземным миром павших богов (и, что наиболее противоречиво, возможно, вообще всех богов). В Пантеоне Смерти души остальных небожителей остаются запертыми после их видимой кончины, а их волю можно узнать только через Дарамаржаратан, толковательницу умерших. Таким образом, Дарамаржаратан, по сути, является регентом престола богов, а все предполагаемые взаимодействия с ними на самом деле происходят через Дарамаржаратан, передающую их послания по собственному усмотрению."
 game_concept_avastya_mahani_history:0 "Истоки Авастья-Махани"
 game_concept_avastya_mahani_history_desc:0 "Одна из старейших вер [Concept('aeras','Эраса')|E] и, скорее всего, старейшая организованная религия в Каширии. Вера Авастья-Махани — это политеистическая религия, которая по меньшей мере за две тысячи лет до основания [Concept('aversaria','Аверсарии')|E] либо мигрировала на запад из земель Дахангона, либо была вдохновлена языческими мигрантами, пришедшими в Каширию из этого региона. Хотя большинство последователей Авастья-Махани выбирают одного или несколько богов для сосредоточения своего поклонения, many кулы конкретных божеств откололись от веры и сформировали собственные ответвления (особенно после завоевания Каширии [Concept('iorne_horde','Железной ордой')|E] Отачеда), такие как Сараварават, бог знания, чьи последователи основали видваукеятранизм, и Кархикала, бог войны, смерти и справедливости, чьи приверженцы образовали кариткамаицизм."
 game_concept_paerasjatan_old_myth:0 "Древнейший миф о Паэрасжатане"
 game_concept_paerasjatan_old_myth_desc:0 "Древнейшие мифы Авастья-Махани, вера в которые крайне редка, утверждают, что бесконечные боги — лишь отражения Паэрасжатана, сотворившего их всех."
 game_concept_pethyka:0 "Петика"
 game_concept_pethyka_desc:0 "Петика был каширийским гуру, который в IV веке по имперскому летоисчислению (И.С.) нашёл и прочёл каждую из девяноста одной священной книги, как считалось, написанных богом Сарватом и его шестью равными братьями и сёстрами, а затем, предположительно, вознёсся после своей мученической кончины от рук суеверных военачальников, которые убили его и сожгли книги."
 game_concept_varodist_creation_myth:0 "Вародистский миф о сотворении мира"
 game_concept_varodist_creation_myth_desc:0 "Вародисты верят, что сотворение мира произошло из-за движения воды, которая медленно вытачивала сушу из камня, и что священные океаны и моря могут являть пророчества в движении своих волн. Они видят время цикличным, полагая, что мир находится в бесконечной череде поглощений морем и разрушений, после чего воды вновь отступают, а морские твари снова выходят на сушу, чтобы заселить преобразившуюся землю.\n\nВародисты также поклоняются детям Вароды — водным обитателям морей, от которых, как они утверждают, произошли все земные существа; древние твари медленно ступали по земле, сбрасывая чешую."
 game_concept_aspects_of_aruvas:0 "Аспекты Аруваса"
 game_concept_aspects_of_aruvas_desc:0 "Последователи Арувасуени верят, что мир родился, когда Арувас, великий Царь-Солнце-Луна, распался под тяжестью своей божественной силы и разделил себя на три царства творения. Из них [Glossary('Арува Цере','GH_ARUVA_TSERE_GLOSS')] стал Солнцем, [Glossary('Арува Нилуд','GH_ARUVA_NILUD_GLOSS')] — Луной, а [Glossary('Арува Агат','GH_ARUVA_AGAT_GLOSS')] дал начало духу человечества. Ни одно живое существо не способно нарушить границы, разделяющие сферы бытия; поэтому лишь мёртвые могут воссоединиться в истинном божественном величии в загробной жизни."
 #game_concept_oskinjer:0 "Ос Кинжер"
 #game_concept_oskinjer_desc:0 "Ос Кинжер (Последнее испытание) проводится во время смерти, когда три аспекта Аруваса судят и решают судьбу усопшего: встретит ли он Аруву Цере в раю или будет обречён трудиться в вечной темнице Арувы Нилуд. Этот ритуал также распространяется на повседневную жизнь, когда гостя чествуют великим пиром."
 #game_concept_rutbay_prophesy:0 "Пророчество веры Рут'бай"
 #game_concept_rutbay_prophesy_desc:0 "Вероучение Рут'бай пророчествует, что однажды, когда мир будет нуждаться в них больше всего, двенадцать отступников вернутся из Рая и спасут верующих от их грехов. Хотя изначально это было крупное движение, отсутствие поддержки со стороны богатейших городов Арувасуени привело к быстрому подавлению веры. Однако, несмотря на то, что чужеземные державы часто высмеивали её, её влияние на раннюю религию невозможно переоценить."
 #game_concept_sword_mother:0 "Матерь Мечей Сар'муир"
 #game_concept_sword_mother_desc:0 "Говорят, что Матерь Мечей — это ангельская десница Арувы Нилуд. Утверждается, что именно с ней сталкиваются те, кто провалил Ос Кинжер, и она забирает павших верных в царство своего лунного владыки. Почитаемая во всех верованиях Арувасуen за свою силу и мудрость, более всего она уважаема племенем Сар'муир. Они верят, что Матерь Мечей — Королева Мёртвых, подобно тому как Арува Агат — Король Живых, и ревностно оберегают свою способность прослеживать родословную до самых первых Сар'муир."
 #game_concept_fate_of_ertomaxism:0 "Судьба эртомаксизма"
 #game_concept_fate_of_ertomaxism_desc:0 "Хотя гибель [Concept('ertomax','Эртомакса')|E] от рук безымянного убийцы стала трагическим ударом для его звероподобных последователей, она не положила конец этому сектантскому верованию, наводившему ужас на неверных в южном Айроное. Оставаясь влиятельной силой в рамках общего течения Арувасуе, его сторонники продолжают ждать дня, когда он вернётся, чтобы возобновить очищение мира. Многие объявляли себя возлюбленным Эртомаксом, но немногие выживали достаточно долго, чтобы исполнить его предназначение."
 game_concept_armazli_mountains:0 "Горы Армазли"
 game_concept_armazli_mountains_desc:0 "Верные Арназни верят, что горы Армазли, защищающие их от северных варваров, были созданы их предками, обладавшими богоподобными магическими силами. Однако со временем эти существа начали терять свое могущество из-за того, что стали довольными и мягкими. Исключением стали три брата: [Concept('arnaz_azot_zalden','братья Арназ')|E]. Испытывая отвращение к новым привычкам своих собратьев, трое из них воздвигли новую гору. Арназ, будучи старшим и мудрейшим, был коронован верховным королём. После того как Парназ убил Азота в поединке за верховную власть, великая гора, на которой был коронован его отец, была переименована в его честь, и ни один скверный человек или зверь не может ступить на неё."
 game_concept_arnaz_azot_zalden:0 "Братья Арназ"
 game_concept_arnaz_azot_zalden_desc:0 "Арназ, Азот и Залден были тремя братьями и, как говорят, одними из многих предков амагейцев, обладавших богоподобными силами. Испытывая отвращение к растущей беспечности и изнеженности своих собратьев, трое отправились воздвигать новую гору. Арназ, старший и мудрейший, был коронован верховным королём и начал поход ради объединения земель. Однако во время войн его брат Азот позавидовал его успеху и предал его, убив Арназа и захватив престол. Но перед смертью Арназ проклял всех, что привело к колоссальному упадку магических способностей. Более того, Арназ провозгласил, что его сын убьёт Азота и вернёт верховную власть.\n\nИ вот, спустя много лет, юноша по имени Парназ с помощью Залдена сразил Азота в поединке и вернул престол. Великая гора, на которой был коронован его отец, была переименована в его честь, и ни один скверный человек или зверь не может ступить на неё. Парназ правил многие века, и многие в Амагее сегодня приходятся ему родственниками."
 game_concept_xaxbaxakanax_esotericism:0 "Эзотеризм Ксаксбаканакса"
 game_concept_xaxbaxakanax_esotericism_desc:0 "Из-за их исключительно простого набора верований по сравнению с другими современниками, многие находят их веру крайне эзотеричной. Считается (по крайней мере, аверсарианцами), что это вызвано их исключительной примитивностью и раздробленностью в те времена, когда их немногие исторические владения были поглощены соседями. Очень немногие государства имели над ними власть.\n\nИ потому, когда их родные земли были завоёваны аверсарианцами, они увидели в них лишь очередных деспотов в череде мелких тиранов, которые всегда приходят и уходят. Как следствие, верующие в основном избежали сурового обращения, будучи слишком незначительными, чтобы привлечь к себе внимание."
 game_concept_evil_lore:0 "Порочные знания"
 game_concept_evil_lore_desc:0 "Аскеварьянцы называют «порочными знаниями» крупицы мудрости, которые проникли в мир вопреки воле Сарвата благодаря усилиям злых демонов и богов. Чтобы исполнить волю Сарвата и сделать мир таким, каким он его желал, «порочные знания» должны быть уничтожены и искоренены. Это закономерно привело к тому, что аскеварьянцы регулярно сжигают библиотеки по всей Каширии в попытках стереть остатки древних и тёмных ритуалов."
 
 ## ARCANA
 game_concept_arcana:0 "Аркана"
 game_concept_arcana_desc:0 "Аркана — это [Concept('skill','навык')|E], отражающий познания персонажа в мистических практиках. Он усиливает [Concept('spellcasting_ability','способность к сотворению заклинаний')|E], а также их магическую силу в дуэлях.\n\nСоответствующим [Concept('lifestyle','образом жизни')|E] являются [Concept('arcana_lifestyle','«Аркана»')|E]."
 game_concept_arcana_i:0 "@skill_arcana_icon!"
 game_concept_arcana_skill:0 "Навык Аркана"
 game_concept_arcana_skill_desc:0 "Аркана — это [Concept('skill','навык')|E], отражающий познания персонажа в мистических практиках. Он усиливает [Concept('spellcasting_ability','способность к сотворению заклинаний')|E], а также их магическую силу в дуэлях.\n\nСоответствующим [Concept('lifestyle','образом жизни')|E] являются [Concept('arcana_lifestyle','«Аркана»')|E]."
 game_concept_arcana_lifestyle:0 "Образ жизни: Аркана"
 game_concept_arcana_lifestyle_desc:0 "Образ жизни $game_concept_arcana_lifestyle$ подходит для персонажей, которые хотят улучшить свои познания в [Concept('magic','магии')|E] и внутреннем устройстве [Concept('aeras','Эраса')|E] с помощью [Concept('artifacts','артефактов')|E] и [Concept('travel','путешествий')|E]."
 game_concept_arcane:0 "арканный"
 
 ## MAGIC PROWESS
 game_concept_magic_prowess:0 "Магическое мастерство"
 game_concept_magic_prowess_i:0 "@magic_icon!"
 game_concept_magic_prowess_skill:0 "Магическое мастерство"
 game_concept_magic_prowess_skill_desc:0 "Магическое мастерство — это второстепенный [Concept('skill','навык')|E], добавляемый к [Concept('prowess','доблести')|E] персонажа, если он освоил какую-либо [Concept('magic_type','школу магии')|E], отражая умение вести бой с помощью [Concept('magic','магических')|E] средств.\n\nОно не угасает с возрастом и является главным фактором в магических дуэлях."
