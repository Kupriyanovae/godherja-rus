 #COSMOS
 
 game_concept_aervalr:0 "Эрвальр"
 game_concept_aervalr_desc:0 "Эрвальр — единственная луна [Concept('aeras','Эраса')|E], созданная из осколка разума [Concept('aersanon','Эрсанона')|E], чтобы утешать Их детей в ночной тьме. За бесчисленные минувшие эпохи она следовала своим путём почти неизменно, даруя силу [Concept('dead_magi','Магам Земли')|E], которых из-за этого в некоторых регионах называют Лунными [Concept('magi','магами')|E]. Смена её фаз оказывает глубокое влияние на этих магов, и их сила растёт и убывает вместе с фазами луны.\n\nМногие могли бы подумать, что нечто столь далёкое, как Эрвальр, останется незатронутым делами человечества, но [Concept('frodbrokna','Фродброкна')|E] доказала обратное. Когда реальность в очередной раз содрогнулась, луна раскололась, и её осколки теперь обрушиваются на Эрас, сея разрушения повсюду, где они падают."
 
 #FOG
 
 game_concept_the_fog_encyclopedia:0 "Туман"
 game_concept_the_fog_encyclopedia_desc:0 "$FOG_APPEARED_CONCEPT$"
 
 game_concept_the_fog:0 "Туман"
 game_concept_fog:0 "Туман"
 game_concept_the_fog_desc:0 "[GetPlayer.Custom('DynamicConceptFog')]"
 FOG_APPEARED_CONCEPT:0 "Туман — это странное [Concept('magic','магическое')|E] явление, исходящее из источника, чья природа и даже точное местонахождение на далёком севере в глубине [Concept('the_continent','Континента')|E] остаются предметом споров, и который повсеместно называют [Concept('the_rift','Разломом')|E]. Хотя точная причина и обстоятельства его появления остаются почти полностью неизвестными, первые свидетельства со стороны далёких колоний, пограничных легионов и племён совпадают по времени с непосредственными последствиями [Concept('frodbrokna','Фродброкны')|E] и окончанием [Concept('imperial_civil_war','Имперской гражданской войны')|E], что заставляет многих верить, будто повсеместный хаос и ужасы этого конфликта каким-то образом породили его.\n\nВ [Concept('foglands','Туманных землях')|E] ничто не живёт — по крайней мере, ничто естественное. Те немногие, кто побывал в его холодной утробе и выжил, чтобы поведать об этом, описывают всепоглощающее чувство ужаса, ощущение того, что за ними постоянно наблюдают, а вокруг непрестанно звучит пугающий шёпот и неестественные звуки. В Туманных землях может воплотиться любой страх: чудовища, порождённые человеческим разумом, обретают плоть и нападают на путников, продолжая существовать и в последующие дни. Эти [Concept('fogbeasts','туманные твари')|E] наряду с другими странными [Concept('creature','существами')|E] бродят по Туманным землям и нападают на каждого, кто оказался там в ловушке. И это не говоря уже о [Concept('fogeaters','Пожирателях тумана')|E].\n\nСчитается, что [Concept('mixed_magic','смешанная магия')|E] черпает свою силу из Тумана. Множество культов и эзотерических религий возникло в попытках объяснить, откуда именно он берётся; приверженцы самых тайных из них утверждают, будто Туман как-то связан с телами [Concept('aersanon','Древних богов')|E].\n\nТуман медленно расползается и, если его не остановить, вероятно, поглотит весь мир."
 FOG_NOT_APPEARED_CONCEPT:0 "В словах самых безумных пророков и самых загадочных оракулов кроется зловещее предупреждение: однажды бледная смерть придёт в [Concept('aeras','Эрас')|E], и когда это случится, её жажда не утолится, пока весь мир не будет поглощён.\n\nК счастью, этот день ещё не настал."
 
 game_concept_foglands:0 "Туманные земли"
 game_concept_fogland:0 "Туманная земля"
 game_concept_fogswept:0 "Окутанные туманом"
 game_concept_fog_swept:0 "Окутанный туманом"
 game_concept_fogland_forsaken:0 "Покинутые"
 game_concept_foglands_desc:0 "Туманные земли — это остатки территорий, поглощённых [Concept('the_fog','Туманом')|E]. Большая их часть некогда принадлежала северо-восточным колониям [Concept('aversaria','Аверсарии')|E], но с тех пор Туман, судя по всему, двинулся на север, и многие предполагают, что он уже давно уничтожил далёкие восточные земли Катун-Кая. Единственными [Concept('creature','существами')|E], оставшимися в Тумане, являются [Concept('fogeaters','Пожиратели тумана')|E] и [Concept('fogbeasts','туманные твари')|E], и лишь немногим удалось вернуться после путешествия даже к самым границам Окутанных туманом земель.\n\nХотя никто не знает точного местонахождения, принято считать, что в Туманных землях сокрыт [Concept('the_rift','Разлом')|E], из которого и исторгается Туман."
 
 game_concept_the_rift:0 "Разлом"
 game_concept_rift:0 "Разлом"
 game_concept_the_rift_desc:0 "Разлом — это колоссальная прореха в [Concept('aeras','Эрасе')|E] и, похоже, в самой ткани реальности, находящаяся глубоко в [Concept('foglands','Туманных землях')|E] [Concept('the_continent','Великой Аверсарии')|E]. Кажется, именно из Разлома исторгается [Concept('the_fog','Туман')|E], хотя никто из ныне живущих не видел его с самого зарождения Тумана вскоре после [Concept('frodbrokna','Фродброкны')|E]. Говорят, что [Concept('mixed_magi','смешанные маги')|E] черпают силу из Разлома и Тумана, а те немногие, кто практикует это открыто, утверждают, будто ощущают вечное притяжение к Разлому. Многие из них уверяют, что в „иную сторону“, с которой они взаимодействуют, можно перейти физически прямо через него.\n\nНекоторые из наиболее тайных и, без сомнения, безумных культов мира заявляют, будто Разлом на самом деле является дырой в разуме [Concept('aersanon','Древнего бога')|E]."
 
