 game_concept_aspect:0 "Аспект"
 game_concept_aspects:0 "Аспекты"
 game_concept_aspect_desc:0 "Стихийные кирпичики [Concept('aeras','Эраса')|E] и самого космоса. Вся магия возникает в результате манипулирования различными аспектами, извлечения баз"
 
 game_concept_aspect_fire:0 "$fire_coloring$ $fire_name$#!"
 game_concept_aspect_fire_desc:0 "$fire_coloring$ $fire_name$#! — один из восьми основополагающих [Concept('aspect','Аспектов')|E], олицетворяющий жизнь, личную волю, хаос и пламя; он приносит свет, отбрасывающий тень. Неся в себе в равной степени опасность и возможности, его заклинания являются обычной практикой как для боевых [Concept('magi','магов')|E], так и для тех, чьё тайное искусство направлено на более мирные цели. Военный потенциал этого аспекта привёл к тому, что во многих культурах [Concept('aeras','Эраса')|E] он стал тесно ассоциироваться с королевской властью и авторитетом. Его дитя от смешения со своим собратом [Concept('aspect_water','аспектом воды')|E] — [Concept('aspect_blood','аспект крови')|E]."
 
 game_concept_aspect_water:0 "$water_coloring$ $water_name$#!"
 game_concept_aspect_water_desc:0 "$water_coloring$ $water_name$#! — один of восьми основополагающих [Concept('aspect','Аспектов')|E], олицетворяющий движение, переход, изменчивость и начала. Он течёт бесконечно и не имеет определённой формы, никогда не достигая и не ища своего завершения. Он является полной противоположностью стазису [Concept('aspect_ice','аспекта льда')|E]. Его дитя от смешения со своим собратом [Concept('aspect_fire','аспектом огня')|E] — [Concept('aspect_blood','аспект крови')|E]."
 
 game_concept_aspect_light:0 "$light_coloring$ $light_name$#!"
 game_concept_aspect_light_desc:0 "$light_coloring$ $light_name$#! — один из восьми основополагающих [Concept('aspect','Аспектов')|E], олицетворяющий чистоту, совершенство, божественность, порядок и иерархию. Это свет, который не отбрасывает тени. Хотя некоторые культуры связывают $light_coloring$ $light_name$#! с моральным порядком, в действительности он не несёт в себе врождённой морали. Это один из двух абсолютных аспектов, и он находится в прямом противостоянии с [Concept('aspect_dark','аспектом тьмы')|E]."
 
 game_concept_aspect_air:0 "$air_coloring$ $air_name$#!"
 game_concept_aspect_air_desc:0 "$air_coloring$ $air_name$#! — один из восьми основополагающих [Concept('aspect','Аспектов')|E]; это та среда пустоты, которая пронизывает всё творение и существует без формы, независимо от мысли или человеческого воображения. Он противостоит [Concept('aspect_dream','аспекту грёз')|E], который представляет собой форму без существования, тогда как $air_coloring$ $air_name$#! — это существование без формы."
 
 game_concept_aspect_stone:0 "$stone_coloring$ $stone_name$#!"
 game_concept_aspect_stone_desc:0 "$stone_coloring$ $stone_name$#! — один из восьми основополагающих [Concept('aspect','Аспектов')|E]; он олицетворяет постоянство и прочность, изменяясь лишь по определённым правилам. $stone_coloring$ $stone_name$#! не может действовать без внешнего воздействия, и потому он противостоит необузданному хаосу и воле [Concept('aspect_fire','аспекта огня')|E]."
 
 game_concept_aspect_ice:0 "$ice_coloring$ $ice_name$#!"
 game_concept_aspect_ice_desc:0 "$ice_coloring$ $ice_name$#! — один из восьми основополагающих [Concept('aspect','Аспектов')|E]; он олицетворяет неизменный стазис, никогда не ища и не принимая перемен или новшеств. $ice_coloring$ $ice_name$#! символизирует финал и кончину, а потому противостоит вечно меняющемуся [Concept('aspect_water','аспекту воды')|E]."
 
 game_concept_aspect_dark:0 "$dark_coloring$ $dark_name$#!"
 game_concept_aspect_dark_desc:0 "$dark_coloring$ $dark_name$#!, также известный как Пустота, — один из восьми основополагающих [Concept('aspect','Аспектов')|E]; он олицетворяет небытие за пределами творения и не имеет ни начала, ни конца. Хотя некоторые культуры стали ассоциировать этот аспект со злом, в действительности он не несёт в себе врождённой морали, ибо сама мораль требует какой-либо формы существования. Это один из двух абсолютных аспектов, и он находится в прямом противостоянии с [Concept('aspect_light','аспектом света')|E]."
 
 game_concept_aspect_dream:0 "$dream_coloring$ $dream_name$#!"
 game_concept_aspect_dreams:0 "$dream_coloring$ $dream_name$#!"
 game_concept_aspect_dream_desc:0 "$dream_coloring$ $dream_name$#! — один из восьми основополагающих [Concept('aspect','Аспектов')|E]; он олицетворяет форму без существования, творение внутри ничто и вещи, которые существуют вопреки собственной невозможности. Все существа на [Concept('aeras','Эрасе')|E] так или иначе взаимодействуют с $dream_coloring$ $dream_name$#!, когда погружаются в сон. Он противостоит [Concept('aspect_air','аспекту воздуха')|E], который представляет собой существование без формы."
 
 game_concept_aspect_celestial:0 "$celestial_coloring$ $celestial_name$#!"
 game_concept_aspect_celestial_desc:0 "Не являясь одним из восьми основополагающих [Concept('aspect','Аспектов')|E], но воплощая в себе каждый из них, аспект $celestial_coloring$ $celestial_name$#! по своей сути представляет собой всю полноту космоса. Он олицетворяет как противостояние, так и гармонию — то, что существует внутри космоса, и то, что находится за его пределами, а также совокупность всего творения."
 
 game_concept_aspect_blood:0 "$blood_coloring$ $blood_name$#!"
 game_concept_aspect_blood_desc:0 "Традиционно понимаемый как смесь нестабильного [Concept('aspect_fire','аспекта огня')|E] и вечно текущего [Concept('aspect_water','аспекту воды')|E], [Concept('the_continent','континентальная')|E] философия утверждает, что $blood_coloring$ $blood_name$#! — это наложение присущей огню личной воли на вечную и вечно меняющуюся природу воды, что создает энергию, необходимую для жизни животных и людей. Он ассоциируется как с искусством исцеления, так и с гнусным ремеслом отравителей. Что ещё более бесславно, магия $blood_coloring$ $blood_name$#! способна высвобождать потенциальную энергию, заключённую во всех живых существах, придавая великую и ужасную силу ритуалам жертвоприношения, обычно практикуемым [Concept('magi','магами')|E]."
 
 game_concept_aspect_nature:0 "$nature_coloring$ $nature_name$#!"
 game_concept_aspect_nature_desc:0 "Сильный, стойкий — и в то же время эфемерный. Сила [Concept('aspect_nature','аспекта природы')|E] — это [Concept('aspect_stone','аспект камня')|E], обретший цель и побуждение к жизни благодаря неумолимой силе [Concept('aspect_fire','аспекта огня')|E]. [Concept('aspect_nature','Природа')|E] олицетворяет рост, появление жизни из того, что безжизненно."
 
 game_concept_aspect_death:0 "$смерть_coloring$ $death_name$#!"
 game_concept_aspect_death_desc:0 "Всё имеет свой конец. Когда даже непрестанное извилистое течение [Concept('aspect_water','аспекта воды')|E] окончательно останавливается непреклонной жёсткостью [Concept('aspect_ice','аспектом льда')|E], в момент прекращения движения возникает [Concept('aspect_death','аспект смерти')|E]. Этот аспект олицетворяет энтропию — медленный распад вечного в небытие."
 
 game_concept_aspect_ethereal:0 "$ethereal_coloring$ $ethereal_name$#!"
 game_concept_aspect_ethereal_desc:0 "$ethereal_coloring$ $ethereal_name$#! — это прибежище вещей, некогда бывших реальными, но давно преданных царству [Concept('aspect_dream','грёз')|E] и превращённых в вечную память сохраняющей силой [Concept('aspect_ice','аспекта льда')|E]. Это [Concept('aspect','аспект')|E] того, чего больше нет; загробной жизни, призраков — как буквальных, так и фигуральных — и их непреходящего влияния на настоящее. Будучи последним пристанищем для бесчисленных душ, собравшихся с начала времён, [Concept('the_fog','Туман')|E] тесно связан с этим аспектом."
 
 game_concept_aspect_metal:0 "$metal_coloring$ $metal_name$#!"
 game_concept_aspect_metal_desc:0 "$metal_coloring$ $metal_name$#! происходит от смешения вечно развивающегося [Concept('aspect_water','аспекта воды')|E] и стоического [Concept('aspect_stone','аспекта камня')|E]. Мирянину эти противоречия могут показаться слабостью, но в действительности этот аспект больше, чем сумма его частей. $metal_coloring$ $metal_name$#! олицетворяет гибкость, изобретательность и тайные искусства творения, передаваемые от мастера к ученику."
 
 game_concept_aspect_sand:0 "$sand_coloring$ $sand_name$#!"
 game_concept_aspect_sand_desc:0 "Вечно меняющийся и бесчисленный, [Concept('aspect_sand','аспект песка')|E] образуется, когда стойкий [Concept('aspect_stone','аспект камня')|E] продавливается сквозь дестабилизирующую бесформенность [Concept('aspect_air','аспекта воздуха')|E]. Получившийся аспект олицетворяет дисперсию — распад материи на более мелкие формы. Однако рассеивание не означает небытие, а лишь переход в более свободную структуру."
 
 game_concept_aspect_dawn:0 "$dawn_coloring$ $dawn_name$#!"
 game_concept_aspect_dawn_desc:0 "$dawn_coloring$ $dawn_name$#! возникает, когда [Concept('aspect','аспект')|E] [Concept('aspect_light','света')|E] смешивается с аспектом [Concept('aspect_dream','грёз')|E]. Он олицетворяет начала и возгорания, находясь в точке перелома перемен. Поскольку аспект света олицетворяет порядок, [Concept('aspect_dawn','аспект рассвета')|E] возникает тогда, когда смертные [Concept('aspect_dream','мечтают')|E] переделать мир заново — к лучшему или к худшему."
 
 game_concept_aspect_time:0 "$time_coloring$ $time_name$#!"
 game_concept_aspect_time_desc:0 "Редкий, странный и опасный, аспект $time_coloring$ $time_name$#! одними считается подчиненным [Concept('aspect_celestial','небесному аспекту')|E], другие же говорят, что он тесно связан с [Concept('aspect_hymns','аспектом гимнов')|E] или даже [Concept('aspect_fire','огня')|E]. Время представляет собой вечный ход дней и лет, увядание старого и возможность нового, а также неразрывную цепь причин и следствий. Говорят, что любое пророчество и предвидение несёт в себе частицу этого [Concept('aspect','аспекта')|E], как и менее востребованная способность заглядывать в прошлое, чтобы разгадать погребённые истины. Ходят слухи, что мастера этого аспекта способны проникать или даже путешествовать в это прошлое, хотя среди многих [Concept('magi','магов')|E] существует твёрдое согласие в том, что подобные перемещения во времени, вероятно, невозможны из-за фундаментальных законов тайной магии."
 
 game_concept_aspect_hymns:0 "$hymns_coloring$ $hymns_name$#!"
 game_concept_aspect_hymns_desc:0 "Говорят, что загадочный аспект $hymns_coloring$ $hymns_name$#! является близнецом [Concept('aspect_celestial','небесного')|E] аспекта, хотя по правде говоря, его положение в традиционной схеме аспектов спорно и в конечном счёте неясно для учёных [Concept('aeras','Эраса')|E]. Те, кто практикует этот аспект, часто говорят о доносящейся издалека космической мелодии — последнем отголоске божественной песни, которая, возможно, и породила саму реальность. Мастеров этого аспекта панически боятся за ужасные акты разрушения и созидания, которые они могут творить, подражая этим полуслышимым отзвукам."
 
 #SCHOOLS
 
 game_concept_living_magic:0 "Живая магия"
 game_concept_living_magics:0 "Живая магия"
 game_concept_living_magic_desc:0 "Живая магия — это [Concept('magic_type','тип магии')|E], возникающий из «живых» материалов, а именно из совокупной жизненной силы, содержащейся в крови людей, а также в растениях и почве. Чтобы использовать Живую магию, необходимо либо вытягивать жизнь из других источников, либо использовать собственную кровь, либо принести в полную жертву чужую душу. Она также является наиболее распространённой формой [Concept('magic','магии')|E] и широко признана в большей части мира.\n\nМастера Живой магии способны продлевать свою жизненную силу сверх естественных пределов, управлять огнём, сжигая ещё живую древесину, и могут убить даже простым взмахом руки. Тех, кто её практикует, обычно называют [Concept('living_magi','живыми магами')|E], хотя к ним также применяют названия Маги крови, Маги жизни и Маги огня."
 
 game_concept_dead_magic:0 "Мёртвая магия"
 game_concept_dead_magics:0 "Мёртвая магия"
 game_concept_dead_magic_desc:0 "Мёртвая магия — это [Concept('magic_type','тип магии')|E], возникающий из «мёртвых» материалов, а именно из любого объекта, в котором не течёт врождённая [Concept('magic','магическая')|E] кровь. Сюда относятся земля, луна [Concept('aervalr','Эрвальр')|E] и те, кто давно покинул этот мир. Большая часть силы Мёртвой магии исходит от силы Эрвальра, и из-за её раскола вся школа оказалась ввергнута в хаос. Мёртвые [Concept('magi','маги')|E] полагаются на эрвальрианские циклы ради обретения величайшего могущества, и в любой день или ночь они могут превратиться из практически бессильных в богоподобных существ лишь из-за одной смены лунной фазы. Мёртвая магия встречается очень редко, но является устоявшейся школой и общепринята в большинстве стран мира.\n\nМастера Мёртвой магии способны придавать земле форму конструктов — как живых, так и нет, предсказывать будущее по фазам луны или поднимать скелеты и призывать легионы [Concept('gh_general_undead','нежити')|E], возможно, даже достигая [Concept('lichdom','личества')|E]. Тех, кто её практикует, обычно называют [Concept('dead_magi','Магами Земли')|E], хотя их также называют Магами Земли, Магами Луны и Магами Тьмы."
 
 game_concept_mixed_magic:0 "Смешанная магия"
 game_concept_mixed_magics:0 "Смешанная магия"
 game_concept_fog_magics:0 "Магия Тумана"
 game_concept_fog_magic:0 "Магия Тумана"
 game_concept_bending_the_will_of_the_fog:0 "подчинение воли самого Тумана"
 game_concept_mixed_magic_desc:0 "Смешанная магия — это новый и таинственный [Concept('magic_type','тип магии')|E], возникший после [Concept('frodbrokna','Фродброкны')|E] и черпающий свои силы из смеси Живых и Мёртвых источников или из самого [Concept('the_fog','Тумана')|E]. Становясь, по всей видимости, тем сильнее, чем более хаотичным и разрушенным становится мир, Смешанная магия чрезвычайно редка и опасна, и, похоже, обладает почти безграничным потенциалом в умирающем мире. [Concept('mixed_magi','Смешанные маги')|E] вызывают как страх, так и восхищение, а другие адепты [Concept('magic','магии')|E] (и большинство живых [Concept('creature','существ')|E]) испытывают естественное отторжение, исходящее от Смешанных магов. Их часто убивают на месте, поскольку они ассоциируются с Туманом, хотя сказать это гораздо проще, чем сделать.\n\nМастера Смешанной магии могут воздействовать на человеческий разум, изменять или даже разрушать его, манипулировать [Concept('foglands','Туманными землями')|E] и перемещаться по ним, а также взаимодействовать и общаться с духами по ту сторону [Concept('the_rift','Разлома')|E]. Среди других имён для [Concept('mixed_magi','смешанных магов')|E] — Туманные маги, Эфирные маги, Маги грёз или Серые маги."
 
 GAME_CONCEPT_MIXED_MAGIC_APPEARED_TITLE:0 "Смешанная магия"
 GAME_CONCEPT_MIXED_MAGIC_APPEARED:0 "Смешанная магия — это новый и таинственный [Concept('magic_type','тип магии')|E], возникший после [Concept('frodbrokna','Фродброкны')|E] и черпающий свои силы из смеси Живых и Мёртвых источников или из самого [Concept('the_fog','Тумана')|E]. Становясь, по всей видимости, тем сильнее, чем более хаотичным и разрушенным становится мир, Смешанная магия чрезвычайно редка и опасна, и, похоже, обладает почти безграничным потенциалом в умирающем мире. [Concept('mixed_magi','Смешанные маги')|E] вызывают как страх, так и восхищение, а другие адепты [Concept('magic','магии')|E] (и большинство живых [Concept('creature','существ')|E]) испытывают естественное отторжение, исходящее от Смешанных магов. Их часто убивают на месте, поскольку они ассоциируются с Туманом, хотя сказать это гораздо проще, чем сделать.\n\nМастера Смешанной магии могут воздействовать на человеческий разум, изменять или даже разрушать его, манипулировать [Concept('foglands','Туманными землями')|E] и перемещаться по ним, а также взаимодействовать и общаться с духами по ту сторону [Concept('the_rift','Разлома')|E]. Среди других имён для [Concept('mixed_magi','смешанных магов')|E] — Туманные маги, Эфирные маги, Маги грёз или Серые маги."
 
 GAME_CONCEPT_MIXED_MAGIC_NOT_APPEARED_TITLE:0 "Другие школы магии"
 GAME_CONCEPT_MIXED_MAGIC_NOT_APPEARED:0 "Многие [Concept('magi','маги')|E] были увлечены идеей открыть третий, неизвестный [Concept('magic_type','тип магии')|E]. Безусловно, такое открытие потрясло бы мир, но тысячи лет попыток приносили лишь неудачи. Всякий раз, когда казалось, что какое-то явление не уходит корнями ни в одну из двух школ, в конце концов выяснялось, что оно было результатом либо обмана, либо неверного истолкования.\n\nМожно с уверенностью предположить, что [Concept('living_magic','живая магия')|E] и [Concept('dead_magic','мёртвая магия')|E] — единственные две истинные формы [Concept('magic','магии')|E]."
 
 game_concept_mixed_magic_encyclopedia:0 "$GAME_CONCEPT_MIXED_MAGIC_APPEARED_TITLE$"
 game_concept_mixed_magic_encyclopedia_desc:0 "$GAME_CONCEPT_MIXED_MAGIC_APPEARED$"
 
 #MAGI
 
 game_concept_blood_magi:0 "Маги крови"
 game_concept_life_magi:0 "Маги жизни"
 game_concept_fire_magi:0 "Маги огня"
 game_concept_living_magi:0 "Живые маги"
 game_concept_living_magi_desc:0 "Живые [Concept('magi','маги')|E] (также известные как Маги крови, Маги жизни или иногда Маги огня) — это обозначение любых заклинателей, специализирующихся на использовании [Concept('living_magic','живой магии')|E] и манипулировании ею. В отличие от [Concept('dead_magi','Магов Земли')|E], черпающих силу из мёртвого, и [Concept('mixed_magi','смешанных магов')|E], подпитывающихся нематериальным, Живые маги черпают силу из всего живого: это могут быть животные, кровь, растения и многое другое. Хотя технически Живые маги могут обходиться неразумными источниками, для сотворения заклинаний любого серьёзного уровня традиционно требуется человеческая кровь.\n\nБудучи самыми многочисленными среди магов, Живые маги представляют собой крайне разнородную группу: они способны использовать свою магию для чего угодно — от исцеления больных до создания огромных огненных шаров или буквального подрыва человеческого тела изнутри. Пожалуй, самым известным Живым магом в истории является Эсхрейс, сотворивший заклятие [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E], которое погубило мир и привело к [Concept('frodbrokna','Фродброкне')|E]."
 
 game_concept_earth_magi:0 "Маги Земли"
 game_concept_moon_magi:0 "Маги Луны"
 game_concept_dark_magi:0 "Маги Тьмы"
 game_concept_dead_magi:0 "Мёртвые маги"
 game_concept_dead_magi_desc:0 "Мёртвые [Concept('magi','маги')|E] (также известные как Маги Земли, Маги Луны или Маги Тьмы) — это определение для любых магов, которые черпают свою силу преимущественно из мёртвого. Хотя традиционно их связывают с некромантией и, что ещё хуже, с [Concept('lichdom','личеством')|E], в действительности подавляющее большинство Мёртвых магов даже не дают себе труда изучать эти искусства.\n\n«Мёртвые» источники, из которых Мёртвые маги черпают силы, весьма разнообразны: это могут быть кости давно погибших [Concept('creature','существ')|E], иссохшие стволы деревьев, сухая земля и, превыше всего, расколотая луна [Concept('aervalr','Эрвальр')|E]. Мёртвые маги часто видят, как их силы растут и убывают вместе с луной на небосводе. В периоды, когда она едва видна, Мёртвым магам бывает трудно сотворить даже базовые заклинания, тогда как в полнолуние они могут превращаться в самых ужасающих чародеев.\n\n[Concept('lichdom','Личества')|E] могут достичь только Мёртвые маги, и [Concept('sorrowing_of_oejeynica','Плач Оейеники')|E] долгое время служил причиной гонений на Мёртвых магов во всём [Concept('the_continent','континентальном')|E] обществе, хотя за прошедшие века это по большей части ушло в прошлое."
 
 game_concept_mixed_magi:0 "Смешанные маги"
 game_concept_fog_magi:0 "Туманные маги"
 game_concept_ethereal_magi:0 "Эфирные маги"
 game_concept_grey_magi:0 "Серые маги"
 game_concept_dream_magi:0 "Маги грёз"
 game_concept_wielders_of_the_fog:0 "повелители Тумана"
 game_concept_mixed_magi_desc:0 "Смешанные [Concept('magi','маги')|E] (также известные как Туманные маги, Серые маги, Эфирные маги или Маги грёз) — это практики странного искусства [Concept('mixed_magic','смешанной магии')|E], [Concept('magic_type','типа магии')|E], который вошёл в анналы истории вместе с [Concept('frodbrokna','Фродброкной')|E] и пришествием [Concept('the_fog','Тумана')|E]. В отличие от [Concept('living_magi','живых магов')|E], черпающих силу из живых существ, и [Concept('dead_magi','Магов Земли')|E], черпающих её из неживого, Смешанные маги берут свою силу по ту сторону завесы. Если быть точнее, они, похоже, подпитываются из [Concept('the_rift','Разлома')|E], а также всеми эмоциями и страданиями этого мира.\n\nСмешанные маги обычно ассоциируются со слепотой — недугом, часто встречающимся среди их собратьев, поскольку они видят меньше материального и больше эфемерного, — а также с воронами. Несмотря на то, что большинство культур видят в них злобных «чужаков», Смешанные маги не имеют явной склонности к какой-либо морали, а их методы получения [Concept('magic','магии')|E], как правило, приносят окружающим гораздо меньше вреда, чем методы Живых магов."
 
 #EFFECTS AND SPELLS
 
 game_concept_exposure_sickness:0 "Магическое облучение"
 game_concept_exposure_sickness_desc:0 "Магическое облучение — это собирательное понятие для целого ряда недугов, возникающих из-за чрезмерного воздействия [Concept('magic','магической')|E] энергии. Как правило, это происходит из-за близости к магическим местам силы, таким как древние храмы, пересечения лей-линий или магические поля битв, но также встречается у [Concept('magi','магов')|E], накопивших избыток силы. Его не следует путать с недомоганиями, вызванными сотворением заклинаний, требующих гораздо больше силы, чем обладает заклинатель, что обычно называют [Concept('overwhelmation','перегрузкой')|E].\n\nМагическое облучение обычно начинается с головных болей, лихорадки, головокружения и рвоты. При более высоких уровнях облучения оно может проявляться в кровотечении из глаз и носа, кровавой рвоте, выпадении волос, потере и отслоении кожи. На повышенных уровнях часто возникают [Concept('mutations','мутации')|E], а на самых высоких уровнях облучения, по имеющимся сведениям, пострадавшие могут дезинтегрироваться, самовоспламеняться, плавиться или буквально взрываться, если только они не умирают до этого момента."
 
 game_concept_overwhelmation:0 "Перегрузка"
 game_concept_overwhelmation_desc:0 "Перегрузка — это результат попытки [Concept('magi','магов')|E] сотворить заклинания, превосходящие то, на что их тела физически способны. Как правило, возникая у магов-новичков, неуверенных в собственных силах, или у магов в моменты отчаянной борьбы не на жизнь, а на смерть, перегрузка обычно приводит к мучительной гибели. Самыми частыми исходами являются самовозгорание, дезинтеграция или взрыв, в других же случаях заклинание, которое они пытаются сотворить, может обернуться против них самих или окружающих. Вспышка пламени может попросту сжечь самого мага, попытка сокрушить кровь врага — привести к взрыву собственных рук, а попытка исцелить тяжкую рану — к расплавлению нервной системы чародея.\n\n[Concept('aversaria','Аверсарианские')|E] исследователи в [Concept('mayikprolollans','майикпрололланах')|E] подсчитали, что примерно до трети или более магов из простых семей или неизвестного происхождения погибают от перегрузки после случайного сотворения заклинания или при попытке раскрыть свои способности."
 
 game_concept_magic_baseline:0 "Магический порог"
 game_concept_magic_baseline_i:0 "@magic_icon!"
 game_concept_magic_baseline_desc:0 "Магический порог персонажа представляет собой естественную точку равновесия его внутренней тайной энергии. Сохранённая [Concept('magic','магия')|E] будет пассивно восстанавливаться до этого значения, если её запасы истощены, тогда как превышение порога повлечёт за собой нарастающие эффекты [Concept('exposure_sickness','магического облучения')|E]."
 
 game_concept_extended_magic_baseline:0 "Расширенный магический порог"
 game_concept_extended_magic_baseline_desc:0 "Расширенный магический порог персонажа представляет собой количество избыточной тайной энергии, которой он может безопасно достичь без использования таких активных мер, как генерирующие [Concept('magic','магию')|E] #E Ритуалы#!. Если этот предел не ограничен, уровень их магии будет пассивно восстанавливаться до него, однако практик всё равно будет получать обычные штрафы [Concept('exposure_sickness','магического облучения')|E] за превышение своего естественного [Concept('magic_baseline','магического порога')|E]."
 
 game_concept_magic_resistance:0 "Сопротивление магии"
 game_concept_magic_resistance_desc:0 "Враждебным [Concept('ritual','ритуалам')|E], даже в случае их успешного сотворения, цель может воспротивиться. Сопротивление магии отражает способность персонажа делать это; оно изменяется под влиянием таких факторов, как [Concept('arcana','тайные искусства')|E], а также от пребывания в определённых географических зонах — например, с [Concept('antimagic_terrain','антимагической местностью')|E]."
 
 game_concept_mana:0 "Мана"
 game_concept_mana_desc:0 "Мана представляет собой количество используемой [Concept('magic','магической')|E] силы в теле персонажа. Она служит основным топливом для проведения #E Ритуалов#!."
 
 game_concept_cantrip:0 "Заговор"
 game_concept_cantrips:0 "Заговоры"
 game_concept_cantrip_desc:0 "Заговор — это любой вид [Concept('magic','магического')|E] действия, который не требует сложной подготовки для сотворения и поэтому может быть выполнен на лету. В отличие от [Concept('ritual','ритуалов')|E], которые необходимо активно проводить и которые обычно дают мощные, но временные эффекты, заговоры вместо этого предоставляют постоянный пассивный бонус (обычно зависящий от [Concept('magic_baseline','магического порога')|E] персонажа и навыка соответствующего [Concept('aspect','аспекта')|E]), как только они будут изучены, чаще всего в качестве достоинства образа жизни."
 
 game_concept_ritual:0 "Ритуал"
 game_concept_rituals:0 "Ритуалы"
 game_concept_ritual_desc:0 "Ритуал — это [Concept('magic','магическое')|E] action, требующее существенного планирования и подготовки. В отличие от [Concept('cantrip','заговоров')|E], которые можно творить на лету и которые обеспечивают пассивные бонусы сразу после изучения, ритуалы должны быть активно проведены персонажем, чтобы проявились их (обычно мощные, но временные) эффекты. В качестве топлива для них используется [Concept('mana','маны')|E], а также часто требуется [Concept('gold','золото')|E] для приобретения необходимых ingredients, снаряжения и найма помощников, требуемых для надлежащего проведения. Более того, этот процесс не лишён риска, так как ритуалы могут завершиться неудачей и повлечь за собой совершенно непредсказуемые последствия для заклинателя и всех, кто находится поблизости."
 
 game_concept_hostile_ritual:0 "Враждебный ритуал"
 game_concept_hostile_ritual_desc:0 "Любой [Concept('ritual','ритуал')|E], цель которого не давала согласия на его проведение, считается враждебным; цель попытается воспротивиться его эффектам, используя своё [Concept('magic_resistance','сопротивление магии')|E], и получит законный повод для [Concept('imprisonment','заключения под стражу')|E] инициатора ритуала."
 
 game_concept_mana_regeneration:0 "Восстановление маны"
 game_concept_mana_regeneration_desc:0 "[Concept('mana','Мана')|E] обычно стремится к значению [Concept('magic_baseline','магического порога')|E] персонажа, если её запасы истощены; это естественный процесс, который обычно не требует каких-либо активных усилий. Это происходит со скоростью #V 5%#! от значения магического порога каждый месяц."
 
 game_concept_magic_exposure:0 "Магическое воздействие"
 game_concept_magic_exposure_desc:0 "Воздействие отражает количество тайной энергии, которой подвергается тело персонажа; обычно оно возникает из-за [Concept('mana','маны')|E] или в качестве остаточного эффекта недавнего сотворения заклинаний. Когда оно превышает [Concept('magic_baseline','магический порог')|E], оно начинает оказывать всё более пагубное влияние на физическое и психическое благополучие персонажа с каждым новым [Concept('exposure_level','уровнем облучения')|E]."
 
 game_concept_exposure_level:0 "Уровень облучения"
 game_concept_exposure_level_desc:0 "Отрицательные эффекты [Concept('exposure_sickness','магического облучения')|E] усиливаются дискретными интервалами, известными как уровни облучения. Первый уровень облучения начинается сразу после превышения [Concept('magic_baseline','магического порога')|E], следующий начинается при двукратном превышении значения порога, последующий — при трёхкратном и так далее."
 
 game_concept_court_magi:0 "Придворный маг"
 game_concept_court_magi_desc:0 "$game_concept_court_magi$ — это [Concept('councillor','советник')|E], отвечающий за [Concept('magic','магические')|E] дела государства, такие как проведение [Concept('ritual','ритуалов')|E] для своего [Concept('liege','сюзерена')|E] и его защита от угроз тайного характера."
 
 game_concept_ambient_magic:0 "Окружающая магия"
 game_concept_ambient_magic_desc:0 "Окружающая [Concept('magic','магия')|E] представляет собой количество тайной энергии, протекающей через определённую область либо из-за природных факторов, таких как [Concept('waylines','лей-линии')|E], либо из-за искусственных, таких как последствия ритуалов. Высокие уровни окружающей магии крайне пагубны для обычной жизни."
 
 game_concept_aftoenischi_effect:0 "Эффект Афтениши"
 game_concept_aftoenischi_effect_desc:0 "Эффект Аристоника — это принцип в [Concept('arcana','тайных искусствах')|E], согласно которому естественный распад [Concept('ambient_magic','окружающей магии')|E], как только он переходит определённый порог, резко замедляется и в конечном счёте становится совершенно незначительным. По сути, это означает, что уровни окружающей магии, на рассеивание которых в обычных условиях ушло бы несколько десятилетий, вместо этого сохраняются веками или даже тысячелетиями.\n\nС точки зрения игрового процесса, эффект Афтениши начинает замедлять естественный распад магических последствий с квадратичной скоростью после того, как тот превысит значение [GuiScope.ScriptValue('aftoenischi_effect_threshold_value')|V0]."
 
 game_concept_bloodblight:0 "Кровавый мор"
 game_concept_the_bloodblight:0 "Кровавый мор"
 game_concept_bloodblight_desc:0 "Кровавый мор — это болезнь, потрясшая большую часть [Concept('the_continent','Континента')|E] и [Concept('sarradon','Саррадона')|E] в период, известный как [Concept('chaos_of_the_seventh_century','Хаос седьмого века')|E], хотя с тех пор случались и менее масштабные вспышки этого недуга. Общепризнано, что болезнь имеет магическую природу, хотя её происхождение неизвестно. У жертв обычно проявляются признаки, схожие с [Concept('exposure_sickness','магическим облучением')|E], скорее всего, из-за того, что болезнь сама по себе стремительно повышает уровень магии в организме заболевшего. У поражённых обычно проступают светящиеся, пульсирующие красные вены, идёт кровь из носа, глаз и ушей, и обычно они умирают от потери крови после стремительного отслоения кожи. Если они выживают после этого, то обычно погибают из-за разрушения слизистой оболочки лёгких, когда грудная клетка заполняется кровью. Кровавый мор быстрее всего распространяется среди магов, хотя обычные люди также ему подвержены.\n\nПоследствия вспышки Кровавого мора в седьмом веке были колоссальными и долгосрочными. В [Concept('chevalie','Шевалье')|E] первый верховный король за целое поколение вместе со всей своей большой семьёй был полностью уничтожен, а шевальенцы были вынуждены покинуть свои последние колонии в Чёрных горах. В Аверсарии погибло целое поколение знати, что привело к массовому коллапсу общества и почти полному распаду Автократии. В Саррадоне структурированное и элитное сословие магов, Сирхад, было истреблено практически полностью. Оставшись без Сирхада, направлявшего и контролировавшего магию на континенте, следующее поколение отвергло большинство устоявшихся норм и стандартов своих предшественников и начало стремительную гонку вооружений с целью открытия новых ужасающих и мощных военных заклинаний. Это в конечном счёте привело к открытию [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E] и, как следствие, к [Concept('frodbrokna','Фродброкне')|E]."
 
 game_concept_selfreplicating_blood_magic:0 "Самовоспроизводящаяся магия крови"
 game_concept_selfreplicating_blood_magic_desc:0 "Самовоспроизводящаяся магия крови — это название ряда ритуалов и заклинания, которое принято считать самым могущественным и опасным из всех, что известны человечеству. Будучи исключительно сложным заклятием, самовоспроизводящаяся магия крови подвластна лишь самым сильным [Concept('magi','магам')|E] и обычно требует помощи множества других чародеев.\n\nЗаклинание подрывает цель, превращая её в колоссальный огненный столп, и быстро проделывает то же самое со всеми в радиусе взрыва и за его пределами, распространяясь ещё дальше на магов или других существ со сверхъестественными свойствами. Хотя теоретически его можно ограничить определённым радиусом или группой, заклинание чрезвычайно трудно контролировать, и в зафиксированной истории оно ни разу не сотворялось без того, чтобы заклинатель стремительно не терял над ним контроль.\n\nЗаклинание считалось утерянным после его открытия и использования соперничающими [Concept('sarradon','саррадонскими')|E] кабалами магов Курати и Алмади, которые полностью уничтожили себя и почти всех магов континента этим взрывом, ввергнув Саррадон в анархию почти на целое столетие. Позже оно было обнаружено [Concept('aeschraes','легон-автократом Эсхрейсом')|E] и ааутократией Аксиотеей во время [Concept('imperial_civil_war','Гражданской войны в Аверсарии')|E]. Хотя оба готовились сотворить его, вовремя преуспеть сумел лишь Эсхрейс, что привело к гибели 80% магов Аверсарии, почти половины остального населения, а также унесло жизни миллионов людей по всему миру. Чистая магическая мощь этого заклинания и вызванные им страдания открыли [Concept('the_rift','Разлом')|E] и породили [Concept('frodbrokna','Фродброкну')|E]."
 
 game_concept_shadesoul_curse:89 "Проклятие теневой души"
 game_concept_shadesoul_curse_desc:89 "Проклятие теневой души — это тайный недуг, превращающий свою жертву в бессмертное злобное существо, связанное с Пустотой и широко известное как Чернорождённый. Хотя со временем оно проявляется во множестве разнообразных симптомов, самым ранним и универсальным является наваждение в виде снов, которые Чернорождённый испытывает почти непреодолимое желание воплотить в явь — снов, которые почти неизменно носят разрушительный характер.\n\nЭто проклятие является результатом одержимости тенью, которая по неизвестным причинам не убивает жертву, а, по всей видимости, сливается с её душой или заменяет её; дети, судя по всему, гораздо более восприимчивы к этому. Будучи крайне редким на большей части Эраса, оно чаще всего встречается среди адептов культов Красных земель, где его намеренно наводят на новоприбывших послушников."
 
 game_concept_spellcasting_ability:89 "Способность к колдовству"
 game_concept_spellcasting_ability_desc:89 "Способность к колдовству — это общий показатель того, насколько эффективно [Concept('magi','маг')|E] проявляет себя во всех или конкретных [Concept('aspect','аспектах')|E]. Это влияет на то, насколько сильно [Concept('magic_exposure','магическое воздействие')|E] затронет его при сотворении [Concept('ritual','ритуалов')|E], насколько высоки его шансы на успех при этом сотворении, а также на его общее [Concept('magic_resistance','сопротивление магии')|E] против враждебных [Concept('ritual','ритуалов')|E]."
 
 game_concept_backfire:89 "Отдача"
 game_concept_backfire_desc:89 "Отдача — это негативное последствие неудачного сотворения [Concept('ritual','ритуалов')|E]. Как правило, она приводит к [Concept('overwhelmation','перегрузке')|E], но также может вызвать [Concept('mutations','мутации')|E] или нечто худшее."
 
 game_concept_spellcasting_success_chance:89 "Шанс успешного колдовства"
 game_concept_spellcasting_success_chance_desc:89 "Шанс успешного колдовства определяет, насколько велика вероятность того, что [Concept('magi','маг')|E] успешно проведёт [Concept('ritual','ритуал')|E]. Чем выше это значение, тем больше шансов на успех, хотя он редко бывает гарантирован."
 
 game_concept_spellcasting_discovery_chance:89 "Шанс раскрытия колдовства"
 game_concept_spellcasting_discovery_chance_desc:89 "Шанс раскрытия колдовства отражает вероятность того, что кто-то, как правило, другой [Concept('magi','маг')|E], узнает, кто именно направил на него [Concept('hostile_ritual','враждебный ритуал')|E]. Его можно повысить различными способами, например с помощью [Concept('perks','достоинств')|E] или определённых [Concept('aspect','аспектов')|E]. Большинство магов могут догадываться о направлении, но лишь обладающие исключительным мастерством смогут определить конкретную личность."

 #MISC
 
 game_concept_bloodcrystal:0 "Кровавый кристалл"
 game_concept_bloodcrystal_desc:0 "Названный так как за свой поразительный малиновый оттенок, так и за невероятные человеческие потери, требуемые для добычи даже самого незначительного количества, кровавый кристалл неизменно остаётся одним из самых дорогих, редких и востребованных товаров, известных человеку. Поскольку число мест с его месторождениями можно пересчитать по пальцам одной руки, а огромный уровень смертности среди несчастных душ, отправленных на его добычу (обычно рабов), ужасает, даже из-за небольших шахт этого минерала вспыхивали войны.\n\nОбладая невероятной магической силой, они обычно наиболее желанны и эффективны в руках [Concept('living_magi','живых магов')|E], хотя ни один [Concept('magi','маг')|E] другой школы также не упустит возможности заполучить его. В [Concept('aversaria','Аверсарии')|E] основным источником были рудники на северных окраинах Империи, отнятые у [Concept('marchers','шевальенцев')|E] века назад.\n\nМеста, где он был обнаружен, без исключения чрезвычайно опасны. Главный убийца в этих проклятых смертельных ловушках — мощная фоновая [Concept('magic','магия')|E], которая быстро вызывает [Concept('exposure_sickness','магическое облучение')|E] и смерть. Все попытки обнаружить источник этого явления закончились неудачей."
 
 game_concept_alchemy:0 "Алхимия"
 game_concept_potion:0 "Зелье"
 game_concept_alchemy_desc:0 "Пожалуй, самое недооценённое из тайных искусств на Расколотом побережье, алхимия тем не менее занимает важную нишу в [Concept('magic','магических')|E] нуждах общества по всему миру. Хотя у обывателей она обычно ассоциируется с ядами, в аптеках зажиточных дворян можно найти множество полезных зелий и припарок, хотя они редко обходятся дёшево.\n\nВ [Concept('aversaria','Аверсарии')|E] конейкменеры были важнейшим поставщиком алхимических продуктов, производимых из вод их зловонных, полных магической силы болот. Однако, хотя их снадобья могут быть в изобилии и по доступной цене, они редко раскрывают истинный потенциал алхимии. С другой стороны, мощные флаконы с чистой жидкой силой из Катун-Кая способны соперничать с могущественной традиционной магией и ценятся соответственно высоко.\n\nНа западе хорошо известно, что в таинственных дальневосточных землях Катун-Кая всё обстоит с точностью до наоборот: алхимия там считается важнейшим из магических искусств. По этой причине катунские зелья и изобретения часто весьма желанны на западе, хотя и чрезвычайно редки из-за опасений Империи, что их секреты будут украдены."
 
 game_concept_waylines:0 "Лей-линии"
 game_concept_wayline:0 "Лей-линия"
 game_concept_waylines_desc:0 "Лей-линии — это линии, пересекающие [Concept('aeras','Эрас')|E], которые излучают огромное количество [Concept('magic','магической')|E] энергии. [Concept('magi','Маги')|E] часто проделывают долгий путь к этим линиям, чтобы быстро накопить силу, и многие из сильнейших мест магической силы в мире расположены именно вдоль них.\n\nСуществует два источника лей-линий: [Concept('tower_wayline','Имперская лей-линия')|E], исходящая из [Concept('sea_tower','Морской башни')|E], и [Concept('northern_wayline','Северная лей-линия')|E], берущая начало в неизвестном месте глубоко на севере. Пересечения этих двух линий обычно являются самыми могущественными в магическом плане местами в мире, и в них часто происходят странные явления.\n\nХотя современные маги в большинстве своём согласны с тем, что обе лей-линии неотличимы по силе, many народные сказки утверждают, что Северная лей-линия несёт в себе тёмную магию, тогда как Башенная лей-линия — нейтральную или добрую."
 
 game_concept_northern_wayline:0 "Северная лей-линия"
 game_concept_northern_wayline_desc:0 "Северная лей-линия — это одна из двух существующих [Concept('waylines','лей-линий')|E], пересекающих [Concept('aeras','Эрас')|E]. Берущая начало в неизвестном месте глубоко на севере, Северная лей-линия обычно ассоциируется с тёмной стороной [Concept('magic','магии')|E]. Легенды гласят, что именно по Северной лей-линии духи уходят в загробный мир и что сила всех злых [Concept('magi','магов')|E] после их смерти уходит к её истокам. Это противопоставляется [Concept('tower_wayline','Имперской лей-линии')|E], которую часто называют источником добра."
 
 game_concept_tower_wayline:0 "Башенная лей-линия"
 game_concept_imperial_wayline:0 "Имперская лей-линия"
 game_concept_tower_wayline_desc:0 "Башенная лей-линия — это одна из двух существующих [Concept('waylines','лей-линий')|E], пересекающих [Concept('aeras','Эрас')|E]. Исходящая из величайшей из [Concept('the_towers','Башен')|E] — [Concept('sea_tower','Морской башни')|E], Башенная лей-линия пересекает большую часть «цивилизованного» мира более непрерывно, чем [Concept('northern_wayline','Северная лей-линия')|E], и исторически служит основным источником могущества [Concept('aversaria','Аверсарии')|E].\n\nХотя большинство [Concept('magi','магов')|E] сходятся во мнении, что она в целом неотличима от Северной лей-линии, предания гласят, что Башенная линия является источником света, а Северная — источником тьмы. Многие маги, признавая их идентичность, часто говорят, что Северная линия «холодная», а Южная — «тёплая».\n\nВ Аверсарии Башенную лей-линию иногда называют «Имперской лей-линией» или «Лей-линией Аверсарии»."
 
 game_concept_magic:0 "Магия"
 game_concept_magics:0 "Магия"
 game_concept_the_gift:0 "Дар"
 game_concept_magic_desc:0 "Магию принято считать силой созидания и разрушения материи. Будучи эфирной силой, она трактуется каждой культурой и религией по-своему в вопросах её происхождения и способов извлечения, а научные и богословские сообщества так и не пришли к единому мнению о её истоках.\n\nОбщепринятыми [Concept('magic_type','школами магии')|E] на [Concept('the_continent','Континенте')|E] являются [Concept('living_magic','живая магия')|E], [Concept('dead_magic','мёртвая магия')|E] и [Concept('mixed_magic','смешанная магия')|E], которые практикуются [Concept('living_magi','живыми магами')|E], [Concept('dead_magi','Магами Земли')|E] и [Concept('mixed_magi','смешанными магами')|E] соответственно. Хотя большая часть магии укладывается в эти рамки, они являются лишь попытками объяснить природу, непостижимую для величайших умов человечества, а потому границы между определёнными заклинаниями и методами их создания зачастую размыты, а у некоторых культур существуют формы магии, кажущиеся жителям Континента совершенно чуждыми."
 
 game_concept_magic_type:0 "Школа магии"
 game_concept_magic_types:0 "Школы магии"
 game_concept_magic_school:0 "$game_concept_magic_type$"
 game_concept_magic_schools:0 "$game_concept_magic_types$"
 game_concept_magic_type_desc:0 "Школа магии — это общая категория, к которой обычно причисляют себя [Concept('magi','маги')|E]. Хотя это деление не носит строго официального характера и маги могут экспериментировать с другими формами [Concept('magic','магии')|E], большинство обычно придерживается одной конкретной школы из-за сложности освоения даже одного искусства.\n\nС точки зрения игрового процесса, с каждой школой связано от одного до трёх [Concept('aspect','аспектов')|E] и любое количество заклинаний этих аспектов. Каждая школа уникальна и связана с одним или несколькими культурными наследиями."
 
 game_concept_magic_power_i:0 "@magic_icon!"
 game_concept_magic_power:0 "Магическая сила"
 game_concept_magical_power_i:0 "@magic_icon!"
 game_concept_magical_power:0 "Магическая сила"
 game_concept_magic_power_desc:0 "[Concept('magi','Маги')|E] используют магическую силу для сотворения заклинаний. Магическая сила накапливается несколькими различными способами, в зависимости от [Concept('magic_type','школы магии')|E]. Сила [Concept('living_magic','живой магии')|E] извлекается из живого материала, сила [Concept('dead_magic','мёртвой магии')|E] берётся из мёртвого материала, а сила [Concept('mixed_magic','смешанной магии')|E] черпается из более жутких и странных источников или из самого [Concept('the_fog','Тумана')|E]. Персонажи могут накапливать магическую силу в меню магии различными методами. Также персонажи накапливают её пассивно благодаря своим свойствам. Для сотворения заклинания персонаж должен сохранить необходимое количество магической силы."
 
 game_concept_blood_magic:0 "Магия крови"
 game_concept_blood_magic_desc:0 "Магия крови — это обиходное название многих заклинаний и методов получения силы в рамках [Concept('living_magic','живой магии')|E]. [Concept('living_magi','Магов крови')|E] определяет использование крови и жизненной силы для подпитки своих заклинаний и взаимодействия с миром. Это может принимать форму человеческих или животных жертвоприношений, а также ритуального нанесения себе порезов.\n\nХотя принято считать, что [Concept('magic','магическая')|E] энергия, получаемая от иссушения растений, черпается из жизненных соков растения, обычно это не рассматривается как форма Магии крови."
 
 game_concept_necromancy:0 "Некромантия"
 game_concept_necromancer:0 "Некромант"
 game_concept_necromancers:0 "Некроманты"
 game_concept_necromancy_desc:0 "Некромантия — это любая форма [Concept('magic','магии')|E] того вида, которая взаимодействует с мёртвыми (и часто управляет ими). Она бывает трёх видов: [Concept('blood_necromancy','кровавая некромантия')|E], [Concept('dark_necromancy','тёмная некромантия')|E] и [Concept('ethereal_necromancy','эфирная некромантия')|E]. Каждый тип некромантии связан с определённой [Concept('magic_type','школой магии')|E].\n\nВ некоторых частях мира на некромантию смотрят свысока, хотя то, как именно к ней относятся, зависит от конкретной культуры. Однако [Concept('lichdom','личество')|E] вызывает отвращение у большинства обитателей живого мира, главным образом из-за безумного количества силы, которую [Concept('liches','лич')|E] может накопить за свою жизнь, и угрозы, которую они представляют для всех вокруг."
 
 game_concept_blood_necromancy:0 "Кровавая некромантия"
 game_concept_blood_necromancy_desc:0 "Кровавая некромантия — это разновидность [Concept('necromancy','некромантии')|E], связанная с [Concept('living_magic','живой магией')|E]. Кровавая некромантия обычно вращается вокруг вампиризма и порабощения. Кровавые некроманты могут вытягивать жизненную силу из других людей, животных или даже растений, чтобы укрепить себя или продлить свою жизнь. Они также могут манипулировать кровью в теле подопытного, заставляя его подчиняться своей воле. При наличии свежего трупа кровавые некроманты могут даже управлять мертвецами, но лишь до тех пор, пока в телах остаётся кровь."
 
 game_concept_dark_necromancy:0 "Тёмная некромантия"
 game_concept_dark_necromancy_desc:0 "Тёмная некромантия — это разновидность [Concept('necromancy','некромантии')|E], связанная с [Concept('dead_magic','мёртвой магией')|E]. Тёмная некромантия заключается в управлении древними мертвецами, под которыми обычно подразумеваются скелеты или тела, сохранившиеся достаточно долго, чтобы пережить высыхание. Тёмная некромантия обычно осуществляется путём привязки душ к давно умершим — проще всего это сделать с той же душой, которая когда-то принадлежала телу, но при необходимости подойдёт любая. Тёмные некроманты могут командовать легионами [Concept('gh_general_undead','нежити')|E], используя собственную жизненную силу для привязки их к службе, а величайшие из мёртвых некромантов могут даже достичь [Concept('lichdom','личества')|E] — состояния вечной жизни, при котором [Concept('magi','маг')|E] привязывает свою душу к собственному телу, а затем убивает себя, продолжая жить вечно, сохраняя полную силу и разум."
 
 game_concept_ethereal_necromancy:0 "Эфирная некромантия"
 game_concept_ethereal_necromancy_desc:0 "Эфирная некромантия — это разновидность [Concept('necromancy','некромантии')|E], связанная со [Concept('mixed_magic','смешанной магией')|E]. Эфирная некромантия — самая неясная и таинственная из всех трёх. В то время как тёмные некроманты могут привязывать духов к давно умершим и управлять ими, эфирные некроманты способны манипулировать силами потустороннего мира гораздо более изощрёнными способами. С помощью эфирной некромантии можно общаться и разговаривать со всеми древними мертвецами в истории, призывать их в физической форме в мир живых и даже подчинять своей воле или просить их совершать действия от своего имени."
 
 game_concept_gedeora:0 "Гедеора"
 game_concept_gedeora_desc:0 "Гедеора — это странная метафизическая аномалия, которая обрушивается на мир совершенно случайным образом в случайное время. Представляя собой масштабные магические волны неизвестного происхождения, Гедеора, в зависимости от своей суровости, приводила ко всему подряд — от изменения психического состояния людей до разрушения гор и затопления целых континентов. Важнейшей в современной истории была [Concept('odrstund','Одрстунд')|E], поразившая [Concept('aversaria','Аверсарию')|E] в 1168 году от основания Империи (И.С.) и значительно усилившая пороки местных [Concept('magi','магов')|E]. Это соответствует общей тенденции, поскольку большинство Гедерз влияют на магов сильнее, чем на обычных людей.\n\nХотя их причина неизвестна, некоторые учёные отмечают, что по ходу истории они становятся всё более суровыми и частыми, а их частота стремительно возросла после [Concept('frodbrokna','Фродброкны')|E]."
 
 game_concept_shimmerstone:0 "Мерцающий камень"
 game_concept_shimmerstone_desc:0 "Полупрозрачный кристалл, светящийся разноцветными огнями, мерцающий камень — это редкий минерал, встречающийся исключительно в северных Железных Хребтах. Говорят, что этот кристалл дарует своим владельцам различные блага, такие как повышенная жизненная сила и мощь, из-за чего он высоко ценится племенными воинами. Магические свойства мерцающего камня сделали его желанным материалом для [Concept('magi','магов')|E] из [Concept('mayikrata','Майикраты')|E], которые предприняли [Concept('nexios_folly','несколько набегов')|E] на северные племена, чтобы завладеть этим драгоценным кристаллом."
 
 game_concept_runic_script:0 "Руническое письмо"
 game_concept_runic_script_desc:0 "Руническое письмо — это системы письменности неизвестного доисторического происхождения, отмеченные своей полезностью в [Concept('magic','магии')|E]. Большинство ритуалов можно «перевести» в руническую форму, которая не только гораздо более компактна и менее подвержена ошибкам, чем описание процесса обычным письмом, но и само физическое присутствие получившегося текста во время сотворения заклинания увеличивает его интенсивность.\n\nСчитается, что существует несколько десятков систем рунического письма, хотя лишь немногие из них были расшифрованы хотя бы частично."
 
 ###GAMEPLAY

 game_concept_raiding_balance:0 "Баланс набегов"
 game_concept_raiding_balance_desc:0 "Баланс набегов отражает общий доход, который вы можете извлечь из текущих операций по разграблению торговых путей. Ваши [Concept('shadow_port','тайные порты')|E] определяют максимальный предел дохода, в то время как эффективность задач квартирмейстера и уровень конкуренции в регионе влияют на вашу фактическую прибыль.\n\nЧтобы увеличить свою [Concept('shadow_trade','вместимость теневой торговли')|E], основывайте новые [Concept('shadow_port','тайные порты')|E] в графствах с низким уровнем [Concept('control','контроля')|E]. Удержание контроля над стратегическими [Concept('straits_and_channels','проливами')|E] также может повысить доход.\n\nЕсли ваш баланс набегов превысит вашу [Concept('shadow_trade','вместимость теневой торговли')|E], избыточная прибыль от разграбления торговых путей будет потеряна."
 
 game_concept_shadow_port:0 "Тайный порт"
 game_concept_shadow_ports:0 "Тайные порты"
 game_concept_shadow_port_desc:0 "Тайные порты — это контрабандистские гавани и чёрные рынки, создаваемые [Concept('pirate','пиратами')|E] для сбыта награбленного груза. Они увеличивают пиратскую [Concept('raiding_balance','вместимость теневой торговли')|E], позволяя зарабатывать больше на разграблении торговых путей. Тайный порт ликвидируется, когда контроль в графстве достигает 100 или если пират больше не находится в пределах его досягаемости."
 
 game_concept_straits_and_channels:0 "Торговые узлы"
 game_concept_strait:0 "Пролив"
 game_concept_straits:0 "Проливы"
 game_concept_channel:0 "Канал"
 game_concept_channels:0 "Каналы"
 game_concept_straits_and_channels_desc:0 "Торговые узлы — это географические объекты, через которые стекается заморская торговля. Это делает их отличными охотничьими угодьями для [Concept('pirate','пиратов')|E]. Контроль над торговыми узлами даёт пирату бонус к разграблению торговых путей. Однако, если один и тот же пролив контролируют несколько пиратов, прибыль от него будет разделена между ними."
 
 game_concept_shadow_trade:0 "Теневая торговля"
 game_concept_shadow_trade_capacity:0 "Вместимость теневой торговли"
 game_concept_shadow_trade_desc:0 "Теневая торговля отражает пиратскую сеть дружественных портов, готовых без лишних вопросов принять груз и заделать пробоины в корпусе. Вместимость теневой торговли — это максимальное количество золота, которое [Concept('pirate','пираты')|E] могут заработать на разграблении торговых путей. Вместимость теневой торговли пирата можно увеличить путём расширения границ его [Concept('realm','державы')|E] и основания новых [Concept('shadow_port','тайных портов')|E]."
 
 
 
 ##GOVERNMENTS
 
 #DESCRIPTIONS
 
 game_concept_magocracy:0 "Магократия"
 game_concept_magocracy_i:0 "@government_type_magocracy!"
 game_concept_magocracy_desc:0 "$game_concept_magocracy$ — это [Concept('government_form','форма правления')|E], при которой правит элита из [Concept('magi','магов')|E], — $game_concept_government_form$ государств, жизнь которых вращается вокруг [Concept('magic','магических')|E] искусств.\n\n$game_concept_magocracy$ может принимать две формы: автократическую и республиканскую, которые определяют, выбираются ли маги из определенной династии или избираются равными себе."

 game_concept_administrative_republic:0 "Великая республика"
 game_concept_administrative_republic_i:0 "@government_type_administrative_republic!"
 game_concept_administrative_republic_desc:0 "$game_concept_administrative_republic$ — это [Concept('government_form','форма правления')|E], которая формируется, когда $game_concept_republic$ перерастает свои первоначальные города и принимает административную иерархию для лучшего управления своей растущей державой."

 game_concept_judicial_republic:0 "Судебная республика"
 game_concept_judicial_republic_i:0 "@government_type_judicial_republic!"
 game_concept_judicial_republic_desc:0 "$game_concept_judicial_republic$ — это [Concept('government_form','форма правления')|E], при которой городами управляет сословие судей, надзирающих за торговлей и повседневными делами."

 game_concept_peasant_republic:0 "Крестьянская республика"
 game_concept_peasant_republic_i:0 "@government_type_peasant_republic!"
 game_concept_peasant_republic_desc:0 "$game_concept_peasant_republic$ — это [Concept('government_form','форма правления')|E], при которой крестьянство правит само собой, — $game_concept_government_form$ восстаний, зашедших, возможно, слишком далеко."
 
 game_concept_pirate:0 "Пират"
 game_concept_pirates:0 "Пираты"
 game_concept_piracy:0 "Пиратство"
 game_concept_pirate_desc:0 "Пиратские державы полагаются на совершение набегов на свои окрестности ради [Concept('income','дохода')|E] и [Concept('prestige','престижа')|E]. Они охватывают весь спектр: от совершенно анархических коммун, подчиняющихся власти сильнейшего и самого безжалостного, до организованных, грозных картелей и обычных [Concept('feudal','феодальных')|E] или [Concept('tribal','племенных')|E] государств, которые просто полагаются на [Concept('raiding','набеги')|E] для получения большей части своего дохода.\n\nДля пирата репутация почти так же важна, как и золото, и поэтому они используют [Concept('prestige','престиж')|E] для найма [Concept('men_at_arms','профессиональных полков')|E]. У них также есть доступ к [Concept('tax_collector','сборщику налогов')|E]."
 
 game_concept_continental_clan:0 "Племенной клан"
 game_concept_continental_clan_desc:0 "Племенные кланы — это [Concept('government_form','форма правления')|E] с заниженным [Concept('development','развитием')|E] [Concept('county','графств')|E] и слабой способностью централизовать свой [Concept('crown_authority','авторитет короны')|E].\nОднако они могут использовать [Concept('prestige','престиж')|E] вместо [Concept('gold','золота')|E] для найма [Concept('men_at_arms','профессиональных полков')|E], а также имеют доступ к большему числу [Concept('casus_belli','поводов для войны')|E] по сравнению с [Concept('feudal','феодальными')|E] и [Concept('clan','клановыми')|E] державами. Племенные кланы также могут использовать [Concept('house_unity','единство дома')|E]."
 
 game_concept_military_unit:0 "Военный отряд"
 game_concept_military_unit_i:0 "@government_type_military_unit!"
 game_concept_military_unit_desc:0 "$game_concept_military_unit$ — это [Concept('government_form','форма правления')|E], при которой [Concept('levies','ополчение')|E] и [Concept('taxes','налоги')|E], предоставляемые [Concept('liege','сюзерену')|E], определяются их [Concept('prestige','престижем')|E]."
 
 game_concept_landed_order:0 "Владетельный орден"
 game_concept_landed_order_desc:0 "$game_concept_landed_order$ — это [Concept('government_form','форма правления')|E], при которой [Concept('levies','ополчение')|E] и [Concept('taxes','налоги')|E], предоставляемые [Concept('liege','сюзерену')|E], определяются [Concept('aptitude','эффективностью')|E] [Concept('tax_collector','сборщика налогов')|E] упомянутого сюзерена."
 
 #CLIQUES
 game_concept_clique:0 "Клика"
 game_concept_clique_desc:0 "Клика — это группа единомышленников, способных оказывать [Concept('clique_influence','влияние клики')|E] на дела [Concept('realm','державы')|E]. Клики часто имеют руководящий принцип, выраженный через определенный [Concept('skill','навык')|E], и общие цели группы в отношении державы. [Concept('clique_powerbase','Политическая база')|E] клики определяется совокупной политической базой ее членов."
 
 game_concept_clique_powerbase:0 "Политическая база"
 game_concept_clique_powerbase_desc:0 "Ваша политическая база отражает накопленные политические ресурсы, такие как [Concept('titles','титулы')|E] и [Concept('gold','золото')|E], а также то, насколько вы расчетливы в их эффективном использовании с помощью как [Concept('diplomacy','дипломатии')|E], так и [Concept('intrigue','интриг')|E]."
 
 game_concept_clique_influence:0 "Влияние"
 game_concept_clique_influence_desc:0 "Ваше влияние отражает то, насколько хорошо ваши [Concept('skills','навыки')|E] соответствуют ценностям вашей [Concept('clique','клики')|E], а также силу вашей [Concept('clique_powerbase','политической базы')|E]. Большее влияние позволяет вам занимать более высокую позицию в [Concept('line_of_succession','очереди на наследование')|E]."
 
 #MISC
 
 game_concept_magocratic_republic_desc:0 "$game_concept_magocracy$ — это [Concept('government_form','форма правления')|E], при которой правит элита из [Concept('magi','магов')|E], — $game_concept_government_form$ государств, жизнь которых вращается вокруг [Concept('magic','магических')|E] искусств.\n\n$game_concept_magocracy$ может принимать две формы: автократическую и республиканскую, которые определяют, выбираются ли маги из определенной династии или избираются равными себе."
 
 game_concept_succession_election_law:0 "Избирательная система"
 game_concept_succession_election_law_desc:0 "Это [Concept('laws','законы')|E], определяющие порядок проведения выборов при той или иной [Concept('government_form','форме правления')|E], в первую очередь в [Concept('administrative_republic','великой республике')|E]."
 succession_election_laws:0 "[Concept('succession_election_law','Избирательные законы')|E]"
 succession_election_laws_singular:0 "[Concept('succession_election_law','Избирательный закон')|E]"
 
 ##HUNTING
 
 #GENERAL
 game_concept_adventure_lifestyle:0 "Образ жизни искателя приключений"
 game_concept_adventure_lifestyle_desc:0 "$game_concept_adventure_lifestyle$ подходит для персонажей, которые хотят исследовать мир за пределами своего [Concept('domain','домена')|E] и потакать своим личным интересам вопреки воле своего [Concept('liege','сюзерена')|E] или [Concept('vassals','вассалов')|E]."
 
 game_concept_monster_hunt:0 "Охота на чудовищ"
 game_concept_monster_hunts:0 "Охота на чудовищ"
 game_concept_monster_hunter:0 "Истребитель чудовищ"
 game_concept_monster_hunters:0 "Истребители чудовищ"
 game_concept_monster_hunt_desc:0 "Охота на чудовищ — это любое [GetActivityType('activity_hunt').GetName] на дичь, которая не считается #E обычной#!. В отличие от обычных охот, они не рассматриваются как регулярное времяпрепровождение и поэтому по умолчанию недоступны без соответствующих культурных, религиозных или связанных с образом жизни предпосылок. Они почти неизменно таят в себе огромную опасность, но также приносят гораздо больше [Concept('prestige','престижа')|E] и куда более внушительные трофеи."
 
 game_concept_ambient_danger:0 "Окружающая опасность"
 game_concept_ambient_danger_desc:0 "Окружающая опасность отражает общий уровень экологических рисков и угроз окружающей среды, присутствующих в зоне охоты. Более высокие уровни окружающей опасности обычно указывают на конкретные факторы, такие как экстремальная погода, сложная местность, враждебная фауна или даже флора, а очень высокие уровни окружающей опасности увеличивают степень риска от самих этих факторов."
 
 game_concept_woodland_biozone:0 "Лесная биозона"
 game_concept_woodland:0 "Лесистая местность"
 game_concept_woodlands:0 "Лесистые местности"
 game_concept_woodland_formatted:0 "#difficulty_easy ЛЕСИСТАЯ МЕСТНОСТЬ#!"
 game_concept_woodland_biozone_desc:0 "Лесистые местности — это биомы умеренного пояса, характеризующиеся густой растительностью и богатой дикой природой. В среднем они, как правило, отличаются большим разнообразием дичи, чем большинство других зон, в них легче добывать пропитание, и они вряд ли пострадают от экстремальной погоды, но в них также бывает трудно ориентироваться, а кроме того, там может обитать множество хищников."
 
 game_concept_chaparral_biozone:0 "Биозона чапараля"
 game_concept_chaparral:0 "Чапараль"
 game_concept_chaparral_formatted:0 "#difficulty_medium ЧАПАРАЛЬ#!"
 game_concept_chaparral_biozone_desc:0 "Зоны чапараля характеризуются долгим сухим летом и короткой влажной зимой. Чаще всего они представляют собой густые заросли кустарников или маквис с обильной мелкой фауной, но при благоприятных условиях могут также являть собой идиллические вечнозелёные леса с приятно тёплой погодой круглый год."
 
 game_concept_savannah_biozone:0 "Саванная биозона"
 game_concept_savannah:0 "Саванна"
 game_concept_savannah_formatted:0 "#difficulty_medium САВАННА#!"
 game_concept_savannah_biozone_desc:0 "Саванны — это тропические травянистые равнины, для которых характерны долгая сухая зима и долгое влажное лето. Часто по всему региону встречаются остаточные леса, одиноко стоящие деревья или заросли кустарника. Несмотря на то, что здесь нет густых лесов, нередко можно встретить саванны, которые в глубине переходят в плотные лесные массивы, хотя они, конечно, несравнимы с настоящими лесами."
 
 game_concept_mountainous_biozone:0 "Горная биозона"
 game_concept_mountainous:0 "Горы"
 game_concept_mountainous_formatted:0 "#color_light_blue #BOL ГОРНАЯ МЕСТНОСТЬ#!#!"
 game_concept_mountainous_biozone_desc:0 "Горы повсеместно характеризуются сложной местностью, а также очень часто бывают бесплодными и холодными. Животный мир здесь, как правило, скуден и представлен в основном высокоуровневыми существами, что делает их плохим выбором для обычных охотников, но представляет интерес для более опытных [Concept('monster_hunt','истребителей чудовищ')|E]."
 
 game_concept_flat_terrain_biozone:0 "Равнинная биозона"
 game_concept_flat_terrain:0 "Равнинная местность"
 game_concept_flat_terrain_formatted:0 "#difficulty_medium СТЕПЬ#!"
 game_concept_flat_terrain_biozone_desc:0 "Степи — это бескрайние травяные моря, простирающиеся до самого горизонта. Их, как правило, легко пересекать из-за отсутствия естественных препятствий, и обычно они являются домом для разнообразной, хоть и немногочисленной популяции диких животных."
 
 game_concept_arid_biozone:0 "Аридная биозона"
 game_concept_arid:0 "Пустыня"
 game_concept_arid_formatted:0 "#difficulty_hard АРИДНАЯ ЗОНА#!"
 game_concept_arid_biozone_desc:0 "Аридные зоны часто бесплодны и горячи, в них практически отсутствуют осадки, а экосистемы невероятно скудны. Из-за редкого наличия крупных ориентиров они часто кажутся лабиринтом. Дичь любого уровня найти трудно, а её выслеживание по бескрайним иссушенным просторам зачастую опаснее, чем сама схватка."
 
 game_concept_wasteland_biozone:0 "Биозона пустошей"
 game_concept_wasteland:0 "Пустошь"
 game_concept_wastelands:0 "Пустоши"
 game_concept_wasteland_formatted:0 "#difficulty_hard ПУСТОШЬ#!"
 game_concept_wasteland_biozone_desc:0 "Пустоши — одни из самых жалких мест на [Concept('aeras','Эрасе')|E], превосходящие даже аридные земли. Обычно являясь результатом недавней или древней [Concept('magic','магической')|E] катастрофы, они, как правило, практически не имеют низкоуровневой дичи, повсеместно бесплодны и обычно несут в себе целое множество опасностей окружающей среды. Обычный охотник не найдёт здесь ничего интересного, и даже большинство [Concept('monster_hunt','истребителей чудовищ')|E] избегают этих мест, но существование одной из самых опасных добыч в мире всё же привлекает самых опытных и безрассудных..."
 
 game_concept_biozone:0 "Биозона"
 game_concept_biozones:0 "Биозоны"
 game_concept_biozone_formatted:0 "Биозона"
 game_concept_biozone_desc:0 "Биозоны — это крупные регионы, определяемые сообществами флоры и фауны, населяющими данную среду обитания, а также географией этого региона. Учёные часто используют их для разграничения регионов путем сравнения их экологии."
 
 game_concept_idyllic_biozone:0 "Идиллическая биозона"
 game_concept_idyllic:0 "Идиллическая"
 game_concept_idyllic_formatted:0 "#difficulty_easy ИДИЛЛИЧЕСКАЯ#!"
 game_concept_idyllic_biozone_desc:0 "Идиллические зоны практически не имеют [Concept('ambient_danger','окружающей опасности')|E], изобилуют подножным кормом и мелкой дичью, отличаются вечно приятной погодой и поразительной природной красотой. Они являются популярными местами для развлекательной охоты и всегда дают бонус к снижению [Concept('stress','стресса')|E] по завершении успешной охоты."
 
 game_concept_verdant_biozone:0 "Цветущая биозона"
 game_concept_verdant:0 "Цветущая"
 game_concept_verdant_formatted:0 "#difficulty_easy ЦВЕТУЩАЯ#!"
 game_concept_verdant_biozone_desc:0 "Цветущие зоны, хотя и не обязательно столь же приручены, как идиллические биозоны, тем не менее обладают обильным подножным кормом и мелкой дичью, а потому пища редко будет проблемой для охотника любого разумного уровня мастерства."
 
 game_concept_monsoon_biozone:0 "Муссонная биозона"
 game_concept_monsoon:0 "Муссон"
 game_concept_monsoon_formatted:0 "#difficulty_medium МУССОННАЯ#!"
 game_concept_monsoon_biozone_desc:0 "Муссонные зоны могут быть относительно спокойными в зависимости от времени года, хотя это и не гарантировано. Ветры меняются ежегодно, вызывая кардинальные изменения погоды. Во время сезона муссонов охота в таких зонах часто усложняется из-за суровости погодных условий."
 
 game_concept_barren_biozone:0 "Бесплодная биозона"
 game_concept_barren:0 "Бесплодная"
 game_concept_barren_formatted:0 "#difficulty_hard БЕСПЛОДНАЯ#!"
 game_concept_barren_biozone_desc:0 "Бесплодные биомы практически не имеют естественных источников пищи. В них не только невозможно добывать подножный корм, но и животный мир здесь, как правило, гораздо более скудный и менее разнообразный."
 
 game_concept_labyrinthine_biozone:0 "Лабиринтовая биозона"
 game_concept_labyrinthine:0 "Лабиринтовая"
 game_concept_labyrinthine_formatted:0 "#difficulty_hard ЛАБИРИНТОВАЯ#!"
 game_concept_labyrinthine_biozone_desc:0 "Лабиринтовые зоны имеют запутанную или однообразную структуру практически без естественных ориентиров, и ориентироваться в них исключительно сложно. Мало того, что выслеживание займёт больше времени, так ещё и существует вполне реальная опасность заблудиться окончательно."
 
 game_concept_hot_biozone:0 "Жаркая биозона"
 game_concept_hot:0 "Жаркая"
 game_concept_hot_formatted:0 "#difficulty_hard ЖАРКАЯ#!"
 game_concept_hot_biozone_desc:0 "Не все биомы с высокой температурой обязательно рассматриваются как #BOL Жаркие#! для целей расчёта [Concept('ambient_danger','окружающей опасности')|E]. Как правило, именно жара, усугублённая сильной сухостью и отсутствием естественных источников воды, превращает эту особенность из лёгкого неудобства в смертельную опасность."
 
 game_concept_cold_biozone:0 "Холодная биозона"
 game_concept_cold:0 "Холод"
 game_concept_cold_formatted:0 "#difficulty_hard ХОЛОДНАЯ#!"
 game_concept_cold_biozone_desc:0 "Морозные температуры, часто в сочетании с частыми снегопадами (хотя и не обязательно), делают #BOL Холодные#! биомы опасными для проведения там любого длительного времени, особенно в зимние месяцы."
 
 game_concept_hostile_natives_biozone:0 "Биозона враждебных туземцев"
 game_concept_hostile_natives:0 "Враждебные туземцы"
 game_concept_hostile_natives_formatted:0 "#difficulty_hard ВРАЖДЕБНЫЕ ТУЗЕМЦЫ#!"
 game_concept_hostile_natives_biozone_desc:0 "Некоторые районы могут быть домом для особо нелицеприятных обитателей-гуманоидов. Будь то по [Concept('magic','магическим')|E] или культурным причинам, они с огромной вероятностью будут нападать на любых незваных гостей при первой же встрече, а дипломатия почти наверняка окажется бесполезной."
 
 game_concept_challenging_terrain_biozone:0 "Биозона сложной местности"
 game_concept_challenging_terrain:0 "Сложная местность"
 game_concept_challenging_terrain_formatted:0 "#difficulty_hard СЛОЖНАЯ МЕСТНОСТЬ#!"
 game_concept_challenging_terrain_biozone_desc:0 "Биомы со сложной местностью изначально трудны для преодоления из-за естественных препятствий. Часто это результат гор, чрезвычайно густой растительности, зыбкой почвы или сочетания всего вышеперечисленного."
 
 game_concept_abyssal_sea_biozone:0 "Биозона абиссального моря"
 game_concept_abyssal_sea:0 "Абиссальное море"
 game_concept_abyssal_sea_formatted:0 "#difficulty_hard АБИССАЛЬНОЕ МОРЕ#!"
 game_concept_abyssal_sea_biozone_desc:0 "Биомы с абиссальным морем поддерживают обширную и глубокую экосистему морских чудовищ. Считается, что море уходит глубоко вниз и выносит этих тварей на поверхность во время штормов."
 
 game_concept_mutants_biozone:0 "Мутировавшая биозона"
 game_concept_mutants_formatted:0 "#difficulty_hard МУТИРОВАВШАЯ#!"
 game_concept_mutants_biozone_desc:0 "Мутировавшие биозоны известны тем, что в них таятся ужасающие мутации. В то время как некоторые из них безобидны, другие имеют далеко идущие последствия, равно как и легенды об их ужасах."
 
 game_concept_poisonous_wildlife_biozone:0 "Биозона с ядовитой дикой природой"
 game_concept_poisonous_wildlife:0 "Ядовитая дикая природа"
 game_concept_poisonous_wildlife_formatted:0 "#difficulty_hard ЯДОВИТАЯ ДИКАЯ ПРИРОДА#!"
 game_concept_poisonous_wildlife_biozone_desc:0 "Некоторые биомы обладают невероятным обилием и разнообразием ядовитой флоры и фауны. Мало того, что шанс получить травму значительно выше, так ещё и любые ранения несут в себе серьёзный риск стать мгновенно смертельными, а сбор подножного корма опасен для тех, кому не хватает опыта или достаточно высокого уровня [Concept('learning','учёности')|E]."
 
 #GAME TYPES
 
 game_concept_skittish_game:0 "Пугливая дичь"
 game_concept_skittish:0 "Пугливый"
 game_concept_skittish_uppercase:0 "ПУГЛИВЫЙ"
 game_concept_skittish_game_desc:0 "Пугливые существа легко пугаются и спасаются бегством при первых признаках опасности. Хотя это означает, что они практически полностью безопасны и не станут давать отпор при нападении, их труднее выследить из-за их постоянно высокой бдительности. Они также никогда не устраивают засады."
 
 game_concept_cautious_game:0 "Осторожная дичь"
 game_concept_cautious:0 "Осторожный"
 game_concept_cautious_uppercase:0 "ОСТОРОЖНЫЙ"
 game_concept_cautious_game_desc:0 "Осторожная дичь больше других заботится о самосохранении и обычно избегает драк, если только её не загнали в угол. Хотя они могут нанести ответный удар, если нет другого выхода, они редко утруждают себя тем, чтобы довести бой до конца, даже если он складывается в их пользу, и вместо этого просто стараются сбежать как можно скорее. Они почти никогда не устраивают засады, за исключением редких случаев упреждающей самообороны."
 
 game_concept_aggressive_game:0 "Агрессивная дичь"
 game_concept_aggressive:0 "Агрессивный"
 game_concept_aggressive_uppercase:0 "АГРЕССИВНЫЙ"
 game_concept_aggressive_game_desc:0 "Агрессивные существа кровно заинтересованы в победе в начавшемся бою и будут активно нападать на других существ — либо из-за хищнических инстинктов, либо из-за обострённого чувства территории. Хотя их можно спугнуть, если они достаточно тяжело ранены, они не отступят без боя."
 
 game_concept_unyielding_game:0 "Непреклонная дичь"
 game_concept_unyielding:0 "Непреклонный"
 game_concept_unyielding_uppercase:0 "НЕПРЕКЛОННЫЙ"
 game_concept_unyielding_game_desc:0 "Из-за полного отсутствия инстинкта самосохранения, крайнего высокомерия или просто физической невозможности сбежать, непреклонные существа никогда не пытаются покинуть поле боя. Хотя это означает, что нет риска упустить их после того, как они будут обнаружены, это также означает, что последующая схватка всегда будет не на жизнь, а на смерть."
 
 game_concept_sedentary_game:0 "Оседлая дичь"
 game_concept_sedentary:0 "Оседлый"
 game_concept_sedentary_uppercase:0 "ОСЕДЛЫЙ"
 game_concept_sedentary_game_desc:0 "Оседлые существа практически никогда не покидают небольшую территорию, которую считают своим домом. Хотя это означает, что они вряд ли станут преследовать нападавших после их отступления, это также значительно усложняет их выслеживание."
 
 game_concept_fast_game:0 "Быстрая дичь"
 game_concept_fast:0 "Быстрый"
 game_concept_fast_uppercase:0 "БЫСТРЫЙ"
 game_concept_fast_game_desc:0 "Быстрые существа обладают недюжинной ловкостью и скоростью, а потому с большей вероятностью смогут сбежать, когда дело дойдёт до драки — и от них почти невозможно спастись бегством, если они разозлены. Кроме того, из-за огромных расстояний, которые они обычно способны преодолевать, их выслеживание занимает больше времени, чем обычно."
 
 game_concept_slow_game:0 "Медлительная дичь"
 game_concept_slow:0 "Медлительный"
 game_concept_slow_uppercase:0 "МЕДЛИТЕЛЬНЫЙ"
 game_concept_slow_game_desc:0 "Некоторые существа особенно медлительны или даже совершенно неподвижны, а потому им гораздо труднее совершить побег, и они не могут преследовать своих врагов. Однако обычно это указывает на то, что у них есть другие способы защиты от хищников."
 
 game_concept_intelligent_game:0 "Разумная дичь"
 game_concept_intelligent:0 "Разумный"
 game_concept_intelligent_uppercase:0 "РАЗУМНЫЙ"
 game_concept_intelligent_game_desc:0 "Некоторые существа выходят далеко за рамки просто смышлёных для животных и являются просто разумными — и точка. Вполне возможно, что они обладают сознанием и находятся на интеллектуальном уровне человека, а в редких случаях, возможно, даже выше. Некоторые из них могут быть способны к речи, если у них вообще есть интерес к диалогу.\n\nНа практике это означает, что такую дичь исключительно трудно застать врасплох, сама она гораздо искуснее устраивает засады и с гораздо большей вероятностью отступит, если окажется в невыгодном положении по сравнению с охотником."
 
 game_concept_cunning_game:0 "Хитрая дичь"
 game_concept_cunning:0 "Хитрый"
 game_concept_cunning_uppercase:0 "ХИТРЫЙ"
 game_concept_cunning_game_desc:0 "Хитрые существа обладают недюжинным умом и проницательностью, и их труднее обмануть, чем обычного зверя. Это означает, что их гораздо сложнее успешно застать врасплох, они сами более склонны к устройству засад и будут активно учитывать силу потенциального охотника при принятии решения о том, сражаться им или бежать."
 
 game_concept_stupid_game:0 "Глупая дичь"
 game_concept_stupid:0 "Глупый"
 game_concept_stupid_uppercase:0 "ГЛУПЫЙ"
 game_concept_stupid_game_desc:0 "Некоторые существа исключительно тупы и наивны, даже для дикого зверья. Они будут блаженно и неосведомлённо попадать в засады и совершенно неспособны устраивать их сами."
 
 game_concept_huge_game:0 "Огромная дичь"
 game_concept_huge:0 "Огромный"
 game_concept_huge_uppercase:0 "ОГРОМНЫЙ"
 game_concept_huge_game_desc:0 "Огромная дичь возвышается над людьми и при необходимости, скорее всего, способна убить одним точным ударом ноги или копыта — если, конечно, она способна это сделать. Даже не будучи явно агрессивными, существа таких размеров внушительны, но это также означает, что их значительно легче выследить, чем обычно. Слоны — хороший пример дичи из этой категории."
 
 game_concept_large_game:0 "Крупная дичь"
 game_concept_large:0 "Крупный"
 game_concept_large_uppercase:0 "КРУПНЫЙ"
 game_concept_large_game_desc:0 "Крупные существа — это те, которые значительно больше и массивнее среднего человека, но не до такой степени, чтобы их можно было считать поистине огромными. Медведи — хороший пример обычного животного этой весовой категории. Крупную дичь легче выследить, но она обычно и более опасна в бою."
 
 game_concept_elusive_game:0 "Неуловимая дичь"
 game_concept_elusive:0 "Неуловимый"
 game_concept_elusive_uppercase:0 "НЕУЛОВИМЫЙ"
 game_concept_elusive_game_desc:0 "Неуловимые существа не только редки, но и трудны для выслеживания — их след может, казалось бы, раствориться в никуда за считанные мгновения, либо потому, что они в целом оставляют мало следов своей деятельности, либо из-за их крайне беспорядочного и непредсказуемого перемещения."
 
 game_concept_brazen_game:0 "Дерзкая дичь"
 game_concept_brazen:0 "Дерзкий"
 game_concept_brazen_uppercase:0 "ДЕРЗКИЙ"
 game_concept_brazen_game_desc:0 "Дерзкие существа перемещаются по своей среде обитания с полным легкомыслием и не прилагают никаких усилий, чтобы скрыть своё присутствие. Следы, которые они оставляют после себя, настолько очевидны, что даже самый неопытный охотник сможет с лёгкостью их выследить."
 
 game_concept_poisonous_game:0 "Ядовитая дичь"
 game_concept_poisonous:0 "Ядовитый"
 game_concept_poisonous_uppercase:0 "ЯДОВИТЫЙ"
 game_concept_poisonous_game_desc:0 "Некоторые существа способны выделять яды, далеко превосходящие то, что среднестатистический человек способен пережить. Охота на них особенно опасна, так как даже то, что поначалу кажется поверхностной царапиной, может в итоге убить за считанные минуты, пока яд пожирает тело несчастной жертвы."
 
 game_concept_social_game:0 "Стайная дичь"
 game_concept_social:0 "Стайный"
 game_concept_social_uppercase:0 "СТАЙНЫЙ"
 game_concept_social_game_desc:0 "Стайные существа, как правило, живут группами, что облегчает их выслеживание, но делает бой куда более рискованным — если они не застигнуты врасплох, существует вероятность того, что после окончания схватки они начнут преследовать охотника, независимо от исхода боя. [Concept('skittish_game','Пугливые')|E] существа никогда не станут преследовать, а [Concept('cautious_game','осторожные')|E] будут преследовать только в том случае, если они достаточно [Concept('intelligent_game','разумны')|E], чтобы отомстить за гибель сородича."
 
 game_concept_emanates_magic_game:0 "Излучающая магию дичь"
 game_concept_emanates_magic:0 "Излучает [Concept('magic','магию')|E]"
 game_concept_emanates_magic_uppercase:0 "ИЗЛУЧАЕТ МАГИЮ"
 game_concept_emanates_magic_game_desc:0 "Некоторые существа излучают опасное количество окружающей [Concept('magic','магии')|E] в среду вокруг себя. Хотя это означает, что для [Concept('magi','магов')|E] их выслеживание становится сущим пустяком, масштабируясь в зависимости от их навыков, это также означает, что существует вполне реальный риск получить [Concept('exposure_sickness','магическое облучение')|E] во время боя с ними."
 
 game_concept_moonbound_game:0 "Связанная с Эрвальром дичь"
 game_concept_moonbound:0 "Связанный с Эрвальром"
 game_concept_moonbound_uppercase:0 "СВЯЗАННЫЙ С ЭРВАЛЬРОМ"
 game_concept_moonbound_game_desc:0 "Фазы [Concept('aervalr','Эрвальра')|E] служат мощным источником [Concept('dead_magic','мёртвой магии')|E] по всему миру, и неудивительно, что сила некоторых существ растёт и угасает вместе с луной [Concept('aeras','Эраса')|E]. Когда луна тускнеет, эти существа чаще ведут уединённый образ жизни и становятся слабее, и наоборот — они более агрессивны и сильны, когда Эрвальр сияет ярко."
 
 ##REGIONAL FEATURES
 
 #CHEVALIE
 
 game_concept_merit:0 "Заслуги"
 game_concept_merit_desc:0 "[Concept('marchers','Шевальенцы')|E], хотя ими якобы и правят феодальные аристократы, редко желают подчиняться тем, кого считают непригодными для правления. Исторически сложилось так, что те, кто обладал исключительными навыками в искусстве войны и политики, часто могли вытеснить старших наследников из очереди на наследование и занять трон сами, особенно если упомянутый наследник был слаб. Если у верховного короля нет достойных наследников или, наоборот, имеется множество яростно соперничающих детей, [Concept('chevalie','Шевалье')|E], скорее всего, распадётся, как это уже бесчисленное количество раз случалось в её прошлом."
 
 ##MISC FEATURES
 
 game_concept_magic_tutor_desc:0 "Будучи учёным [Concept('magi','магом')|E], якобы обладающим великим талантом, [Concept('court_magi','придворный маг')|E] отвечает за удовлетворение всех тайных нужд двора, при котором он находится.\n\nОни будут обучать тех, кто обладает врождёнными [Concept('magic','магическими')|E] способностями, наставляя их на пути соответствующей [Concept('magic_type','школы магии')|E]. Их также можно призвать на помощь правителю при сотворении его собственных магических заклинаний или приказать им сотворить заклинание по воле господина.\n\nКаждый правитель может нанять только одного [Concept('court_magi','придворного мага')|E]."
 game_concept_magic_tutor:0 "Учитель магии"
 game_concept_magic_tutors:0 "Учителя магии"
 
 #ACTIVITIES
 
 game_concept_journey:0 "Путешествие"
 game_concept_journeys:0 "Путешествия"
 game_concept_journey_desc:0 "#BOL Путешествие#! представляет собой великое личное начинание, чаще всего ради [Concept('prestige','престижа')|E], [Concept('gold','золота')|E] или оттачивания [Concept('skills','навыков')|E]. Они включают в себя [Concept('monster_hunt','охоту на чудовищ')|E], #E приключения#! и #E кузнечное дело#!."

 game_concept_oltenic_feast_type:0 "$feast_type_tsagaan_sar$"
 game_concept_oltenic_feast_type_desc:0 "[Glossary('$feast_type_tsagaan_sar$','GH_DAAJ_OLIKNII_GLOSS' )] — это уникальный тип [GetActivityType('activity_feast').GetName], доступный ольтенским [Concept('nomadic','кочевым')|E] [Concept('rulers','правителям')|E], при котором ожидается, что [Concept('activity_host','организатор')|E] получит различные подарки от [Concept('activity_guests','гостей')|E]."
 
 #METROPOLI
 
 #NEW METRO DISTRICTS
 game_concept_metro_holding:0 "Метрополия"
 game_concept_metro_holding_desc:0 "Со временем город может разрастись вглубь и вширь, став больше любого другого поблизости, а также производя и потребляя больше, чем целое [Concept('county','графство')|E]."
 
 game_concept_administration_district_holding:0 "Административный квартал"
 game_concept_administration_district:0 "Административный квартал"
 game_concept_administration_districts:0 "Административные кварталы"
 game_concept_administration_district_holdings:0 "Административные кварталы"
 game_concept_administration_district_holding_desc:0 "По мере роста города растёт и потребность в регулировании и бюрократии, а следовательно, и необходимость в административном квартале. В них располагаются многие правительственные здания, а также отсюда осуществляется надзор за местными правоохранительными органами и военными силами."
 
 game_concept_economic_district_holding:0 "Экономический квартал"
 game_concept_economic_district:0 "Экономический квартал"
 game_concept_economic_districts:0 "Экономические кварталы"
 game_concept_economic_district_holdings:0 "Экономические кварталы"
 game_concept_economic_district_holding_desc:0 "Метрополия — это гораздо больше, чем просто место для жизни людей. Это место, где люди работают и торгуют, покупают и продают, наслаждаются жизнью и городскими достопримечательностями. Разумеется, всё это облагается налогом, и коммерческий квартал заботится о том, чтобы высшая элита получила свой, надо признать, весьма внушительный кусок пирога."
 
 game_concept_scholarly_district_holding:0 "Учёный квартал"
 game_concept_scholarly_district:0 "Учёный квартал"
 game_concept_scholarly_districts:0 "Учёные кварталы"
 game_concept_scholarly_district_holdings:0 "Учёные кварталы"
 game_concept_scholarly_district_holding_desc:0 "Обычно возникающие на базе интегрированных храмов и других религиозных учреждений, учёные кварталы часто считаются духовным сердцем метрополии. Однако со временем они разрастаются и охватывают множество других областей знаний, становясь средоточием науки и идей."
 
 #OLD METRO DISTRICTS
 
 game_concept_military_district_holding:0 "Военный квартал"
 game_concept_military_district:0 "Военный квартал"
 game_concept_military_districts:0 "Военные кварталы"
 game_concept_military_district_holdings:0 "Военные кварталы"
 game_concept_military_district_holding_desc:0 "Марш солдат, крики сержантов, звон деревянных мечей — вот звуки квартала, целиком посвящённого вопросам войны. Будь то на поле боя или во время осады, военные кварталы дают военные бонусы."
 
 game_concept_palatial_district_holding:0 "Дворцовый квартал"
 game_concept_palatial_district:0 "Дворцовый квартал"
 game_concept_palatial_districts:0 "Дворцовые кварталы"
 game_concept_palatial_district_holdings:0 "Дворцовые кварталы"
 game_concept_palatial_district_holding_desc:0 "Рассадник интригующих дворян и придворных скандалов, дворцовые кварталы являются центром власти в любой метрополии. Будучи домом для элиты государства, дворцовые кварталы могут давать бонусы к [Concept('prestige','престижу')|E], [Concept('dynasty_prestige','известности династии')|E] и не только."
 
 game_concept_maritime_district_holding:0 "Морской квартал"
 game_concept_maritime_district:0 "Морской квартал"
 game_concept_maritime_districts:0 "Морские кварталы"
 game_concept_maritime_district_holdings:0 "Морские кварталы"
 game_concept_maritime_district_holding_desc:0 "Главные ворота в метрополию, морские кварталы служат домом для рыбных рынков, складов и верфей. Зачастую заселённые лишь низшими классами, морские кварталы дают бонусы к [Concept('income','доходу')|E], [Concept('county_development','развитию графства')|E] и многому другому."
 
 game_concept_academic_district_holding:0 "Академический квартал"
 game_concept_academic_district:0 "Академический квартал"
 game_concept_academic_districts:0 "Академические кварталы"
 game_concept_academic_district_holdings:0 "Академические кварталы"
 game_concept_academic_district_holding_desc:0 "Пыльные библиотеки, нетерпеливые студенты и умудрённые опытом старейшины — вот основа академического квартала. Будучи центрами бесконечных споров, исследований и периодических кулачных боёв, академические кварталы дают бонусы к [Concept('county_development','развитию графства')|E], [Concept('health','здоровью')|E] и не только."
 
 game_concept_trade_district_holding:0 "Торговый квартал"
 game_concept_trade_district:0 "Торговый квартал"
 game_concept_trade_districts:0 "Торговые кварталы"
 game_concept_trade_district_holdings:0 "Торговые кварталы"
 game_concept_trade_district_holding_desc:0 "Заселённые одними из самых богатых мужчин и женщин в государстве, торговые кварталы заполнены рынками, складами и редкими честными торговцами. Являясь центром торговли и процветания в метрополии, торговые кварталы дают бонусы к [Concept('income','доходу')|E], [Concept('prestige','престижу')|E] и многому другому."
 
 game_concept_temple_district_holding:0 "Храмовый квартал"
 game_concept_temple_district:0 "Храмовый квартал"
 game_concept_temple_districts:0 "Храмовые кварталы"
 game_concept_temple_district_holdings:0 "Храмовые кварталы"
 game_concept_temple_district_holding_desc:0 "Часто служащие пристанищем для некоторых из самых могущественных религиозных институтов в государстве, храмовые кварталы являются домом для духовенства всех уровней, заведующего различными храмами, лечебницами и мастерскими. Духовное сердце метрополии, храмовые кварталы дают бонусы к [Concept('health','здоровью')|E], [Concept('piety','благочестию')|E] и не только."
 
 game_concept_urban_district_holding:0 "Городской квартал"
 game_concept_urban_district:0 "Городской квартал"
 game_concept_urban_districts:0 "Городские кварталы"
 game_concept_urban_district_holdings:0 "Городские кварталы"
 game_concept_urban_district_holding_desc:0 "Будучи центрами сосредоточения населения, городские кварталы служат домом для жителей любого социального положения, от перенаселённых трущоб до роскошных поместий. Одна из самых неотъемлемых частей любой метрополии, городские кварталы дают бонусы к [Concept('income','доходу')|E], [Concept('county_development','развитию графства')|E] и многому другому."
 
 game_concept_workshop_district_holding:0 "Ремесленный квартал"
 game_concept_workshop_district:0 "Ремесленный квартал"
 game_concept_workshop_districts:0 "Ремесленные кварталы"
 game_concept_workshop_district_holdings:0 "Ремесленные кварталы"
 game_concept_workshop_district_holding_desc:0 "От молота и долота до пылающих горнов, ремесленные кварталы — это промышленные центры, где живут мастера и умельцы, избравшие метрополию своим домом. Ключевой игрок в любой экономике, ремесленные кварталы дают бонусы к [Concept('income','доходу')|E], [Concept('prestige','престижу')|E] и многому другому."
 
 game_concept_ruined_district_holding:0 "Разрушенный квартал"
 game_concept_ruined_district:0 "Разрушенный квартал"
 game_concept_ruined_districts:0 "Разрушенные кварталы"
 game_concept_ruined_district_holdings:0 "Разрушенные кварталы"
 game_concept_ruined_district_holding_desc:0 "Заброшенные дома, заросшие улицы, шёпот в тенях — разрушенные кварталы уродуют облик любой метрополии. Чем бы этот квартал ни был прежде, бедствие превратило его в обычное пристанище для отчаявшихся и преступников."
 
 game_concept_ruined_military_district_holding:0 "Разрушенный военный квартал"
 game_concept_ruined_military_district:0 "Разрушенный военный квартал"
 game_concept_ruined_military_districts:0 "Разрушенные военные кварталы"
 game_concept_ruined_military_district_holdings:0 "Разрушенные военные кварталы"
 game_concept_ruined_military_district_holding_desc:0 "Хотя когда-то воздух здесь был наполнен звоном деревянных мечей и маршем сапог, какое бы бедствие ни обрушилось на этот квартал, оно привело к тому, что военные покинули его, оставив крепостные валы без присмотра, а форт — без гарнизона."
 
 game_concept_ruined_palatial_district_holding:0 "Разрушенный дворцовый квартал"
 game_concept_ruined_palatial_district:0 "Разрушенный дворцовый квартал"
 game_concept_ruined_palatial_districts:0 "Разрушенные дворцовые кварталы"
 game_concept_ruined_palatial_district_holdings:0 "Разрушенные дворцовые кварталы"
 game_concept_ruined_palatial_district_holding_desc:0 "Когда-то могущественная резиденция власти, этот квартал был покинут знатью и придворными после обрушившегося на него бедствия. Разграбленный и лишённый своих богатств, теперь этот квартал — лишь призрак прежнего режима."
 
 game_concept_ruined_maritime_district_holding:0 "Разрушенный морской квартал"
 game_concept_ruined_maritime_district:0 "Разрушенный морской квартал"
 game_concept_ruined_maritime_districts:0 "Разрушенные морские кварталы"
 game_concept_ruined_maritime_district_holdings:0 "Разрушенные морские кварталы"
 game_concept_ruined_maritime_district_holding_desc:0 "В прошлом центр притяжения торговцев, импортёров, экспортёров, рыбаков и гостей, этот квартал превратился в руины в результате постигшего его бедствия. Запах гнили наполняет воздух, а в воде нет ни одного пригодного для плавания судна."
 
 game_concept_ruined_trade_district_holding:0 "Разрушенный торговый квартал"
 game_concept_ruined_trade_district:0 "Разрушенный торговый квартал"
 game_concept_ruined_trade_districts:0 "Разрушенные торговые кварталы"
 game_concept_ruined_trade_district_holdings:0 "Разрушенные торговые кварталы"
 game_concept_ruined_trade_district_holding_desc:0 "Хотя когда-то этот квартал был наполнен оглушительным шумом огромных рынков и определялся закулисными сделками, бедствие привело этот экономический центр в почти полное запустение. Рынки теперь пустуют, а любые монеты, всё ещё переходящие из рук в руки в этом квартале, далеки от законных."
 
 game_concept_ruined_temple_district_holding:0 "Разрушенный храмовый квартал"
 game_concept_ruined_temple_district:0 "Разрушенный храмовый квартал"
 game_concept_ruined_temple_districts:0 "Разрушенные храмовые кварталы"
 game_concept_ruined_temple_district_holdings:0 "Разрушенные храмовые кварталы"
 game_concept_ruined_temple_district_holding_desc:0 "Покинутые как богами, так и их духовенством, храмы, сады и мастерские этого квартала превратились в обрушившиеся, осквернённые руины после бедствия, постигшего метрополию."
 
 game_concept_ruined_urban_district_holding:0 "Разрушенный городской квартал"
 game_concept_ruined_urban_district:0 "Разрушенный городской квартал"
 game_concept_ruined_urban_districts:0 "Разрушенные городские кварталы"
 game_concept_ruined_urban_district_holdings:0 "Разрушенные городские кварталы"
 game_concept_ruined_urban_district_holding_desc:0 "Городские кварталы — это сердце и душа любой метрополии, но бедствие привело этот когда-то густонаселённый квартал к запустению. Теперь дома как крестьян, так и знати стоят в руинах на грани обрушения, и лишь редкие сквоттеры всё ещё называют этот квартал своим домом."
 
 game_concept_ruined_workshop_district_holding:0 "Разрушенный ремесленный квартал"
 game_concept_ruined_workshop_district:0 "Разрушенный ремесленный квартал"
 game_concept_ruined_workshop_districts:0 "Разрушенные ремесленные кварталы"
 game_concept_ruined_workshop_district_holdings:0 "Разрушенные ремесленные кварталы"
 game_concept_ruined_workshop_district_holding_desc:0 "То, что когда-то было промышленным центром прежнего режима, превратилось в прах и руины из-за некоего бедствия: горны остыли, а инструменты заржавели. Та малая жизнь, что всё ещё теплится в этих кварталах — всего лишь мародёры, ищущие хоть какой-то металлолом."
 
 game_concept_necropolis_holding:0 "Некрополь"
 game_concept_necropolis:0 "Некрополь"
 game_concept_necropoleis:0 "Некрополи"
 game_concept_necropolis_holdings:0 "Некрополи"
 game_concept_necropolis_holding_desc:0 "Некрополи — это [Concept('holding_type','тип владения')|E], связанный с [Concept('the_lichdoms','владениями личей')|E]. В то время как [Concept('liches','личи')|E] способны править этими бесплодными землями и укреплёнными твердынями нежити, для кого-либо другого здесь просто не остаётся ничего, чем можно было бы управлять."
 
 # Encyclopedia Entries as GCs
 game_concept_kalath_old_growth_biozone:0 "Сердцелесье"
 game_concept_kalath_old_growth_biozone_desc:0 "Густой древний лес, пронизанный сильным магическим влиянием. Многие из его потаённых уголков остались практически нетронутыми рукой человека."
 game_concept_pathos_delta_biozone:0 "Дельта Патоса"
 game_concept_pathos_delta_biozone_desc:0 "Регион умеренных дождевых лесов и разбросанных болот, раскинувшийся по обоим берегам реки Патос."
 game_concept_sulzegg_basin_biozone:0 "Кепиранская котловина"
 game_concept_sulzegg_basin_biozone_desc:0 "Котловина в самом центре гор Калатипсоми, известная своими красивыми озёрами и огромной популяцией бобров."
 game_concept_kalath_redwoods_biozone:0 "Лаодантинские леса"
 game_concept_kalath_redwoods_biozone_desc:0 "Прибрежные секвойные леса, величественно возвышающиеся на севере Калатипсоми, к югу от Алойзийского моря."
 game_concept_southern_kalath_biozone:0 "Грезящие холмы"
 game_concept_southern_kalath_biozone_desc:0 "Дремлющие просторы каскадов и гейзеров, тянущиеся на север вдоль Бодрствующего побережья."
 game_concept_knokidbes_biozone:0 "Долина Кнокидбес"
 game_concept_knokidbes_biozone_desc:0 "Регион, широко известный своими коварными почвами, расположенный между реками Эрамасик и Зарриньян."
 game_concept_migraddar_biozone:0 "Психрасское нагорье"
 game_concept_migraddar_biozone_desc:0 "#BOL Психрасское нагорье#! представляет собой цепь труднопроходимых, густо поросших лесом предгорий, которые пересекают ландшафт по направлению к Чёрному перевалу и Железным шпилям дальше на севере."
 game_concept_mayikprolollan_biozone:0 "Майикрата"
 game_concept_mayikprolollan_biozone_desc:0 "Горы, на вершинах которых расположена [Concept('mayikrata','Майикрата')|E], являются одними из самых высоких и неприступных в мире."
 game_concept_etepezea_biozone:0 "Этепезея"
 game_concept_etepezea_biozone_desc:0 "Засушливый каменистый полуостров, покрытый маквисом и примечательный своей разнообразной змеиной и драконьей фауной."
 game_concept_imperial_isle_biozone:0 "Имперский остров"
 game_concept_imperial_isle_biozone_desc:0 "#BOL Имперский остров#! по праву считается одним из самых красивых регионов Расколотого побережья и служит излюбленным местом охоты для [Concept('aversaria','аверсарианской')|E] знати с самых первых дней существования империи."
 game_concept_the_isles_biozone:0 "Западные острова"
 game_concept_the_isles_biozone_desc:0 "Самые западные острова [Concept('aversaria','Расколотого побережья')|E] хорошо известны своими коварными чёрными водами и историями о чудовищных морских тварях."
 game_concept_tower_isles_biozone:0 "Башенные острова"
 game_concept_tower_isles_biozone_desc:0 "Башенные острова представляют собой крупный кольцеобразный архипелаг, сосредоточенный вокруг [Concept('sea_tower','Морской башни')|E], с долгой историей, связывающей его с истоками [Concept('aversaria','Аверсарии')|E]."
 game_concept_central_isles_biozone:0 "Центральные острова"
 game_concept_central_isles_biozone_desc:0 "Центральные острова — это архипелаг, находящийся в самом сердце [Concept('aversaria','Расколотого побережья')|E]. Хотя климат здесь в целом мягкий и сухой, учёные давно считают невозможным обобщить природную среду островов из-за их огромного разнообразия как в географическом, так и в экологическом плане."
 game_concept_guillate_rocks_biozone:0 "Скалы Гийят"
 game_concept_guillate_rocks_biozone_desc:0 "Острые #BOL Скалы Гийят#! тянутся змейкой от Алойзийского моря до Бодрствующего побережья. Эти острова примечательны своими хрустальными рифами, окаймляющими большую часть региона."
 game_concept_chevalie_biozone:0 "Шевалье"
 game_concept_chevalie_biozone_desc:0 "[Concept('chevalie','Шевалье')|E] чаще всего ассоциируется с антимагическим полем, которое покрывает этот регион и защищает его от разорённых [Concept('lichdoms_biozone','королевств личей')|E] дальше на севере."
 game_concept_konijkmener_biozone:0 "Granmaar Moor"
 game_concept_konijkmener_biozone_desc:0 "#BOL Гранмаарские пустоши#! расположены к югу от [Concept('chevalie_biozone','Шевалье')|E] и на протяжении веков прочно ассоциируются с конейкменерами."
 game_concept_black_mountains_biozone:0 "Чёрные горы"
 game_concept_black_mountains_biozone_desc:0 "#BOL Чёрные горы#! возвышаются над суровыми окраинами Выштанки и холмистыми полями Шевалье. Пеплопад и кровь покрыли этот регион, причём первый и дал горам их название."
 game_concept_redlands_biozone:0 "Красные земли"
 game_concept_redlands_biozone_desc:0 "#BOL Красные земли#! считаются одним из самых опасных регионов на [Concept('aeras','Эрасе')|E], их можно найти на юго-западе Айроноя."
 game_concept_vyshtanka_biozone:0 "Выштанка"
 game_concept_vyshtanka_biozone_desc:0 "Регион суровых окраинных земель, лежащий между окружающими его Чёрными горами и Железными шпилями. Он более всего известен тем, что укрывает одни из последних стад мамонтов на [Concept('aversaria','Расколотом побережье')|E]."
 game_concept_foglands_biozone:0 "Туманные земли"
 game_concept_foglands_biozone_desc:0 "Туманные земли когда-то были бескрайней, почти дикой глушью в глубине континента. Их простирающиеся до горизонта леса и долины были прекрасным зрелищем для любого охотника, но те времена прошли. Теперь землю укрывает густой, шепчущий туман. Одичавшие туземцы и тёмные твари таятся в дымке, и любые души, достаточно храбрые, чтобы отправиться в эти пугающие леса, должны быть готовы к ожидающей их участи."
 game_concept_malcois_biozone:0 "Малкуа"
 game_concept_malcois_biozone_desc:0 "Внутренние области Малкуа более всего известны своими суровыми утёсами и горами, которые доминируют над регионом и защищают его со всех сторон. Местность изрезана глубокими ущельями и пологими холмами, что придает этой в остальном умеренной земле невероятно дикий вид."
 game_concept_northern_opakhasia_biozone:0 "Северная Опахазия"
 game_concept_northern_opakhasia_biozone_desc:0 "Северная Опахазия — прибрежный регион с мягким климатом на побережье Парфийского моря, известный скорее своей историей, нежели природной красотой."
 game_concept_western_opakhasia_biozone:0 "Западная Опахазия"
 game_concept_western_opakhasia_biozone_desc:0 "Западная Опахазия характеризуется в первую очередь скалистыми, изрезанными берегами, вдающимися в море в виде полуостровов. Её оживлённые, роскошные прибрежные города окружены плодородными почвами с относительно мирной и зачастую скудной фауной в диких землях."
 game_concept_hyrea_biozone:0 "Гирейский водораздел"
 game_concept_hyrea_biozone_desc:0 "Узкая полоса степных просторов и лесных массивов, зажатая с одной стороны скалистыми горами Бёлькут на севере и Парфийским морем на юге."
 game_concept_western_aironoi_biozone:0 "Западный Айроной"
 game_concept_western_aironoi_biozone_desc:0 "Регион, где преобладают бескрайние пшеничные поля и изобильные фруктовые сады, Западный Айроной издавна считается одной из самых плодородных областей на [Concept('aeras','Эрасе')|E]."
 game_concept_great_steppe_biozone:0 "Ольтенская степь"
 game_concept_great_steppe_biozone_desc:0 "Огромное открытое пространство, простирающееся от Айронойских гор на западе Айроноя до реки Касирьят на дальнем востоке."
 game_concept_aironoian_southeast_biozone:0 "Юго-Восток Айроноя"
 game_concept_aironoian_southeast_biozone_desc:0 "Регион глубоких каньонов и возвышающихся столовых гор, тянущийся вдоль южного побережья Айроноя на восток от Красных земель."
 game_concept_fools_coast_biozone:0 "Берег дураков"
 game_concept_fools_coast_biozone_desc:0 "Берег дураков — на удивление мирная и малонаселённая земля, зажатая между рекой Касирьят на востоке, Тропами Валдрика на севере и Красными землями на западе. Она невероятно гостеприимна, вопреки своему окружению: приятный океанский бриз с юга охлаждает влажные и горячие пески южного Айроноя, а огромное разнообразие дикой природы и зелени остаётся достаточно рассредоточенным, чтобы не мешать человеческим поселениям. Словно этого мало для потенциальных поселенцев, эта область также считается одной из богатейших золотом в мире; почти во всех трудах исследователей, посещавших регион, бесконечно воспевается уникальный блеск и оттенок местных рек, отливающих зеленью и золотом благодаря кажущемуся бесконым притоку золотых чешуек."
 game_concept_amaghea_mountains_biozone:0 "Амагея"
 game_concept_amaghea_mountains_biozone_desc:0 "Расположенная между Латунным морем и горами Армазли, Амагея более всего известна своими величественными лесами и высокими горами, пересекающими этот регион."
 game_concept_brass_sea_coasts_biozone:0 "Побережье Латунного моря"
 game_concept_brass_sea_coasts_biozone_desc:0 "Низменные берега Латунного моря поддерживают разнообразную экосистему из барьерных островов вдоль побережья, солоноватых болот вокруг заливов и реликтовых прерий."
 game_concept_krehejad_biozone:0 "Крехеджад"
 game_concept_krehejad_biozone_desc:0 "Один из самых вулканически активных районов на всём Эрасе, архипелаг Крехеджад славится своими чёрными пляжами, горячими источниками, серными бассейнами, фумаролами и гейзерами."
 game_concept_continental_interior_biozone:0 "Внутренние области континента"
 game_concept_continental_interior_biozone_desc:0 "Термин «Внутренние области континента» используется для описания бескрайних просторов земли, полностью поглощённых [Concept('the_fog','Туманом')|E]. Когда-то по всему континенту можно было легко найти прекрасные леса, пологие долины и захватывающие виды, но всё это было утеряно в [Concept('the_fog','Тумане')|E] и уже никогда не будет возвращено."
 game_concept_kharadamat_biozone:0 "Харадамат"
 game_concept_kharadamat_biozone_desc:0 "Помимо того, что полуостров Харадамат является местом нахождения объекта [GetBuilding('01_sophocos').GetName] и родиной ритуализма, он, пожалуй, наиболее знаменит своими бескрайними густыми кедровыми лесами."
 game_concept_sinhamiyah_biozone:0 "Сихнамия"
 game_concept_sinhamiyah_biozone_desc:0 "Будучи очагом городской цивилизации с самого начала записанной истории, Сихнамия также иногда именуется «садом [Concept('sarradon','Саррадона')|E]» благодаря своему плодородию и легкому доступу к пресной воде."
 game_concept_sirwali_coast_biozone:0 "Сирвалийское побережье"
 game_concept_sirwali_coast_biozone_desc:0 "Участок побережья, где бесплодная в остальном Саррадонская пустыня встречается с Имперским морем, примечательный своими жемчужно-белыми пляжами и необычайно богатой морской флорой и фауной."
 game_concept_al_ghazir_biozone:0 "Аль-Газир"
 game_concept_al_ghazir_biozone_desc:0 "Аль-Газир, или просто «Остров» на саррадонском (иногда называемый «Восточным островом»), — один из крупнейших островов Моря Империй, имеющий религиозное значение как для [Concept('ritualism','ритуалистов')|E], так и для [Concept('wardenism','варденитов')|E]."
 game_concept_khenemhat_biozone:0 "Хенемхат"
 game_concept_khenemhat_biozone_desc:0 "Хенемхат — засушливый и каменистый регион, через который пролегает дорога Гонан, соединяющая северный [Concept('sarradon','Саррадон')|E] с землями [Concept('damota_biozone','Дамоты')|E]."
 game_concept_sarradonian_desert_biozone:0 "Сarradonian Desert"
 game_concept_sarradonian_desert_biozone_desc:0 "Бескрайнее море песка, покрывающее север внутренних областей Саррадона, — одно из самых суровых мест в мире. Очень немногие обычные [Concept('creature','существа')|E] называют это место своим домом, но практическое отсутствие человеческих поселений означает, что духи и другие [Concept('magic','магические')|E] создания обитают здесь в необычайно больших количествах."
 game_concept_sarradonian_mountains_biozone:0 "Саррадонские горы"
 game_concept_sarradonian_mountains_biozone_desc:0 "Саррадонские горы представляют собой обширную, взаимосвязанную систему горных хребтов на севере [Concept('sarradon','Саррадона')|E] со схожей флорой и фауной."
 game_concept_boneyard_biozone:0 "Костяной погост"
 game_concept_boneyard_biozone_desc:0 "Костяной погост более всего известен как место упокоения [Concept('the_worldeater','Пожирателя миров')|E], хотя он также заполнен останками бесчисленного множества зверей, проделавших сюда свой последний путь, чтобы умереть. На удивление мирное место, останки его многочисленных посетителей питали сочную зелень по всему региону."
 game_concept_ayyar_coast_biozone:0 "Айярское побережье"
 game_concept_ayyar_coast_biozone_desc:0 "Айярское побережье включает в себя кустарниковые степи и субтропические широколиственные леса, простирающиеся от реки Лахкорини до западных склонов Тарсанид."
 game_concept_damota_biozone:0 "Дамота"
 game_concept_damota_biozone_desc:0 "Изолированная земля Дамота расположена к югу от [Concept('khenemhat_biozone','Хенемхата')|E] и со всех сторон окружена горами, удерживающими её уникальных и необъяснимых обитателей в границах густых джунглей."
 game_concept_cyrat_biozone:0 "Цират"
 game_concept_cyrat_biozone_desc:0 "Расположенный на восточном выступе [Concept('sarradon','Саррадона')|E], Цират представляет собой бескрайние джунгли, пользующиеся дурной славой из-за абсолютной враждебности к любой жизни, не приспособленной к их экстремальным условиям. Хотя огромная свирепая флора и фауна считаются его главной и самой известной опасностью, изрезанная местность, на которой раскинулся дождевой лес, и тропические болезни, свирепствующие под его пологом, сами по себе являются смертоносными угрозами."
 game_concept_crater_biozone:0 "Кратер"
 game_concept_crater_biozone_desc:0 "Мелководное круглое внутреннее море, окружённое узкой полосой разреженного тропического леса. Колоссальные саратаны, блуждающие в его водах, — самые известные его обитатели."
 game_concept_rojihlat_biozone:0 "Рожихлатские мангры"
 game_concept_rojihlat_biozone_desc:0 "Рожихлатские мангры простираются от южной окраины [Concept('crater_biozone','Кратера')|E] до Каменного залива. Рифы и песчаные косы защищают большую часть береговой линии, обеспечивая безопасность обильных лесов, ваттов и разбросанных мангровых островков."
 game_concept_aekershaan_biozone:0 "Акерсхан"
 game_concept_aekershaan_biozone_desc:0 "Акерсхан — название кратера к западу от [Concept('crater_biozone','Кратера')|E]. Этот регион хорошо известен резкими контрастами в экологии по мере изменения высоты над уровнем моря."
 game_concept_amsar_biozone:0 "Амсар"
 game_concept_amsar_biozone_desc:0 "Амсар — земля огромного экологического разнообразия, которая на протяжении долгих эпох претерпевала радикальные изменения как в человеческом, так и в животном составе."
 game_concept_kemsar_biozone:0 "Кемсар"
 game_concept_kemsar_biozone_desc:0 "Расположенный в западном [Concept('sarradon','Саррадоне')|E], Кемсар представляет собой землю бескрайних дюн и засушливых бесплодных земель с редкими разбросанными оазисами. Когда-то он был колыбелью Кемсарской империи, от которой остались лишь руины, и, несмотря на течение времени, они до сих пор возвышаются как памятники по всей пустыне."
 game_concept_kasiryat_biozone:0 "Касирьят"
 game_concept_kasiryat_biozone_desc:0 "Касирьят — крупная река, отделяющая земли Айроноя от [Concept('kashirya','Каширии')|E] на востоке. Широкие полосы плодородных равнин и болот отделяют реку от степи дальше на западе и от [Concept('north_kharadan_biozone','Северных гор Харадан')|E] на востоке."
 game_concept_north_kharadan_biozone:0 "Северные горы Харадан"
 game_concept_north_kharadan_biozone_desc:0 "Северные горы Харадан являются домом для некоторых из самых высоких пиков на Эрасе, причем даже большинство из их «меньших» вершин заставляют в остальном внушительные горы остального мира казаться ничтожными холмиками."
 game_concept_hyratan_biozone:0 "Хайратан"
 game_concept_hyratan_biozone_desc:0 "Расположенные среди одних из самых высоких гор в мире, великие долины Хайратана в каширийских народных сказаниях предстают землей мистических чудес."
 game_concept_darmirat_plain_biozone:0 "Дармиратская равнина"
 game_concept_darmirat_plain_biozone_desc:0 "Дармиратская равнина представляет собой обширную аллювиальную равнину, которая отделяет внутренние районы северной [Concept('kashirya','Каширии')|E] от [Concept('magiyor_biozone','плато Магийор')|E] дальше на юге."
 game_concept_kashti_flats_biozone:0 "Солончаки Кашти"
 game_concept_kashti_flats_biozone_desc:0 "Солончаки Кашти когда-то были крупной дельтой, которая давно высохла из-за изменения уровня моря за предшествующие тысячелетия, оставив после себя обширную сеть солончаковых болот, окаймляющих береговую линию северной [Concept('kashirya','Каширии')|E]."
 game_concept_magiyor_biozone:0 "Плато Магийор"
 game_concept_magiyor_biozone_desc:0 "Горные луга плато Магийор лежат в тени [Concept('north_kharadan_biozone','Северных гор Харадан')|E]; оно более всего известно магиятинской огненной маргариткой."
 game_concept_kafasali_biozone:0 "Предгорья Кафасали"
 game_concept_kafasali_biozone_desc:0 "Кафасали — это название сухих полей, лесов и каменистых холмов, отделённых от северной [Concept('kashirya','Каширии')|E] [Concept('magiyor_biozone','плато Магийор')|E]."
 game_concept_vichacil_biozone:0 "Вичасильские леса"
 game_concept_vichacil_biozone_desc:0 "Густые тропические дождевые леса тянутся по южной окраине [Concept('kashirya','Каширии')|E] на восток, к мягким прохладным вершинам Южных гор Харадан."
 game_concept_katuppilan_biozone:0 "Катуппилан"
 game_concept_katuppilan_biozone_desc:0 "Катуппилан — название густых мангровых лесов и ваттов вдоль каширийского побережья. Этот массивный лес заполняет большую часть водных путей и речных систем юга, затрудняя путешествие вглубь страны."
 game_concept_rovarska_biozone:0 "Роварска"
 game_concept_rovarska_biozone_desc:0 "Роварска, или, как её чаще называют, [Concept('pirate_coast','Пиратский берег')|E], представляет собой архипелаг, лежащий на границе Моря Империй и Восточного океана."
 game_concept_nightcoast_biozone:0 "Ночное побережье"
 game_concept_nightcoast_biozone_desc:0 "Ночное побережье — регион, охватывающий большую часть восточной Судрат-Мудраскаи, названный так из-за своих исключительных особенностей в ночное время."
 game_concept_eripomvuno_biozone:0 "Эрипомвуно"
 game_concept_eripomvuno_biozone_desc:0 "Эрипомвуно — цепь островов у южного побережья [Concept('etepezea_biozone','Этепезеи')|E], которая остаётся незаселённой на протяжении тысячелетий, несмотря на свою безграничную красоту."
 game_concept_lichdoms_biozone:0 "Королевства личей"
 game_concept_lichdoms_biozone_desc:0 "Мёртвая пустошь далеко к северу от [Concept('chevalie_biozone','Шевалье')|E], где уже тысячу лет нет никакой жизни."
 game_concept_whisperveil_biozone:0 "Завеса шёпота"
 game_concept_whisperveil_biozone_desc:0 "Завеса шёпота — дикое пространство густых сосновых и еловых лесов далеко к северу от [Concept('aversaria','Расколотого побережья')|E]."
 game_concept_red_waste_biozone:0 "Красная пустошь"
 game_concept_red_waste_biozone_desc:0 "Красные пустоши — это выжженная земля, пораженная мощной магической энергией, которая когда-то опустошила этот край."
 game_concept_lonely_light_biozone:0 "Одинокий свет"
 game_concept_lonely_light:0 "Одинокий свет"
 game_concept_lonely_light_biozone_desc:0 "Одинокий свет — скалистый вулканический архипелаг далеко на северо-западе от [Concept('aversaria','Расколотого побережья')|E]. Хотя большая часть их севера представляет собой тундру, острова хорошо известны густым разнотравьем и папоротниками. Считается, что те немногие деревья, что уцелели здесь, были привезены поселенцами из старой Ойейники. Снега здесь мало, но дождь и туман — обычное дело круглый год."
