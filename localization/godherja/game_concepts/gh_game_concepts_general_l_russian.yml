 ####GENERAL

 game_concept_aeras:0 "Эрас"
 game_concept_aeras_desc:0 "Эрас — это название единственного обитаемого мира, вокруг которого вращаются солнце и весь остальной космос. Хотя многие религии приписывают его сотворение сонму различных богов или единому творцу, на самом деле он был создан [Concept('aersanon','Древним богом')|E], который отчаянно жаждал компании. Терзаемый древними войнами, катастрофами и [Concept('aelfir','чужеродной')|E] расой, Эрас хранит долгую, утерянную историю и пережил больше катаклизмов, чем кто-либо способен представить."

 ###LORE

 game_concept_the_last_iyrossi:0 "Король Потаклей"
 game_concept_the_last_iyrossi_desc:0 "Король Потаклей, прозванный „Последним ийросси“, был легендарным последним правителем народа ийросси до их окончательного завоевания Автократией. Король Потаклей вёл настолько успешную партизанскую войну против аверсарцев, что сумел выторговать жизнь для всего своего народа ценой их порабощения и собственной жизни. Он остаётся легендарной фигурой как для самих ийросси, так и для военных историков, поскольку его битвы и тактика изучаются даже спустя века после его кончины."

 game_concept_scusstari_guerilla_warfare:0 "Скусстарийская партизанская война"
 game_concept_scusstari_guerilla_warfare_desc:0 "Скусстарийские воины славятся своим упрямством перед лицом превосходящих сил врага. Ещё до начала затяжной кампании против Аверсарии они в совершенстве освоили использование сурового ландшафта для нанесения максимальных потерь своим противникам. Если битву нельзя выиграть одним решительным ударом, они прибегают к тактике измождения, совершая налёты на обозы снабжения и внезапные ночные атаки, чтобы подорвать боевой дух и в конечном итоге уморить врагов голодом, когда недели дефицита превращаются в месяцы. Передача этих военных традиций младшим поколениям — священная обязанность племенных старейшин, что делает эту тактику важной частью их культуры как непреклонных партизан, готовых сражаться за свободу любой ценой."

 game_concept_old_iyrossi_culture:0 "Древние обычаи ийросси"
 game_concept_old_iyrossi_culture_desc:0 "Встречающиеся преимущественно в многочисленных этнических поселениях ийросси, разбросанных по утёсам окраин Малькуа, кровная месть и браки между родными братьями и сёстрами стали обычным делом. Вера ийросси дозволяет и то, и другое, и даже превозносит эти деяния как благочестивые в глазах Божественного Суда. Подобные обычаи крайне трудно искоренить среди народа ийросси, поскольку многовековые традиции и ритуалы глубоко укоренились в их культуре."

 ##UNIVERSAL

 #EVENTS

 game_concept_prehistory:0 "Доисторическая эпоха"
 game_concept_prehistory_long_forgotten:0 "Давно забытое"
 game_concept_prehistory_desc:0 "Доисторической эпохой считается любое время, не входящее в современный [Concept('aversaria','Имперский')|E] календарь. Аверсарианца верят, что мир был основан в 24 000 году до н. э. „Чистейшими“.\n\nВ действительности же этот [Concept('aeras','мир')|E] сформировался где-то за 20 000 — 400 000 лет до этого. Поскольку сменились сотни различных способов летоисчисления, а время в понимании современных людей существовало не всегда (возможно, по-настоящему начавшись только после Годхерии), точно датировать большую часть человеческой истории невозможно.\n\nЕсли говорить в общих чертах, [Concept('aersanon','Эрсанон')|E] создал мир после нескольких эонов, проведённых в пустоте, а затем сотворил человечество в попытке обрести собеседников. Людям дозволялось основывать собственные королевства, и все они поклонялись Эрсанону, но со временем тот устал от людского несовершенства и создал [Concept('aelfir','эльфиров')|E]. Эльфиры завоевали и поработили человечество, основав свои империи, но спустя несколько сотен тысяч лет люди восстали и уничтожили как эльфиров, так и самого Эрсанона во время Годхерии."

 game_concept_marcher_aversarian_wars:0 "Войны Марки и Аверсарии"
 game_concept_marcher_aversarian_wars_desc:0 "Войны Марки и Аверсарии — это серия конфликтов между [Concept('marchers','жителями Марки')|E] из [Concept('chevalie','Шевалье')|E] и [Concept('aversaria','аверсарианцами')|E], проходившая примерно между 344 и 631 гг. от И.С., хотя стычки и пограничные войны случались как до, так и после этого периода.\n\nВойны начались всерьёз в 344 году от И. С. с нашествия [Concept('arch_lich','Чёрного императора')|E] Якуба «Злоязычника» Яковада в Шевалье, из-за чего большая часть войск Марки из колоний на территории нынешней Калатипсоми была отозвана на родину для отражения угрозы. Получив отпор в Айроное от Астликов и ещё не оправившись от Восстания Последнего Дракона, аверсарианца вторглись в колонии Марки в своём непрекращающемся стремлении к доминированию на этих землях.\n\nПервая война была ожесточённой. После окончательного поражения Якуба Злоязычника маркские [Concept('antimagi','антимаги')|E] сеяли хаос в рядах аверсарианцев, используя партизанскую тактику в суровых окраинах Калатипсоми. Первая серия войн завершилась лишь в 569 году от И.С., когда обе стороны, крайне истощённые и пытавшиеся одновременно сдерживать внешние угрозы и бороться друг с другом, согласились провести новую границу. Аверсария получала большую часть Калатипсоми, в то время как за жителями Марки оставались Чёрные горы и все земли к западу от них.\n\nЗа сами горы велось ещё несколько мелких войн вплоть до 631 года от И. С., когда [Concept('bloodblight','Кровавая порча')|E] уничтожила большую часть знати Шевалье, вынудив маркцев отступить на запад, после чего их бывшие владения быстро заняли аверсарианские поселенцы. С тех пор современная граница между де-юре Шевалье и Аверсарией остаётся неизменной."

 game_concept_chaos_of_the_seventh_century:0 "Хаос седьмого века"
 game_concept_chaos_of_the_seventh_century_desc:0 "Хаос седьмого века — это череда катастрофических событий, начавшаяся в конце VI века и завершившаяся около 760 года от И.С. Хотя хаос в первую очередь поразил [Concept('aversaria','Аверсарию')|E], он также затронул большую часть [Concept('chevalie','Шевалье')|E] и [Concept('sarradon','Саррадона')|E]. В то время как многие учёные считают это простым невезением, другие предполагают, что виной всему была могущественная [Concept('gedeora','гедеора')|E], наславшая проклятие неудачи на весь [Concept('the_continent','континент')|E].\n\nХаос начался с нашествия [Concept('arch_lich','архилича')|E] Адваги Адвакампи в Шевалье и возвышения аверсарианского [Concept('liches','лича')|E] графа Пемоса в восточной Опахасии. Пока два лича сеяли разрушение (ситуация усугублялась крахом власти в Марке и тем, что на аверсаринском троне восседал сущий ребёнок), череда мощных гедеор начала случайным образом швырять аверсарианские города взад и вперёд по временной шкале. Обстановку обострила крупная гражданская война, вспыхнувшая между наместниками Калатипсоми и Малькуа в самый разгар нашествий.\n\nВскоре после этого из Аверсарии по всему миру начала расползаться [Concept('bloodblight','Кровавая порча')|E]. Пользуясь слабостью измученного катаклизмами юго-запада, [Concept('kartharadd','Картараддская империя')|E] начала масштабное вторжение в Аверсарию и завоевала большую часть Малькуа. Врага удалось отбросить лишь после без малого пятидесяти лет жестокой войны, которая завершилась разгромом последней картараддской армии в битве у Ридувианских курганов в 760 году от И. С., что и ознаменовало конец Хаоса."

 game_concept_frodbrokna_desc:0 "Фродброкна — это название череды катаклизмов, произошедших 1.3.1200, когда автократ Эсхрейс выпустил самовоспроизводящуюся кровавую [Concept('magic','магию')|E] на [Concept('the_continent','континент')|E]. Это вызвало повсеместный хаос и разрушения на [Concept('aeras','Эрасе')|E], погубив почти половину [Concept('aversaria','аверсарианского')|E] населения, бесчисленное множество жизней в остальном мире и лишив многих выживших контроля над магией. Хотя его цель, Аксиотея, погибла в результате взрыва, до сих пор неясно, было ли это успехом заклинания или следствием колоссальных сопутствующих разрушений.\n\nВысвобожденная мощь и ужас были столь велики, что сама реальность содрогнулась — расколов [Concept('aervalr','Эрвальр')|E] и породив зловещий [Concept('the_fog','Туман')|E]."
 game_concept_frodbrokna:0 "Фродброкна"

 #CHARACTERS
 game_concept_biography: "Биография"
 game_concept_biography_desc: "По всему [Concept('aeras','Эрасу')|E] можно встретить выдающихся и именитых персонажей, отмеченных значком @biography_icon!. Вы можете узнать о них подробнее, наведя курсор на персонажа и на выделенный полужирным текст #E;bold "Наведите, чтобы узнать больше"#! во всплывающей подсказке. Кроме того, вы можете нажать кнопку „Открыть биографию“ в окне персонажа".

 game_concept_aersanon:0 "Эрсанон"
 game_concept_ancient_gods:0 "Древние боги"
 game_concept_god:0 "Бог"
 game_concept_gods:0 "Боги"
 game_concept_ancient_god:0 "Древний бог"
 game_concept_ancient_being:0 "Древнее существо"
 game_concept_creator:0 "Создатель"
 game_concept_purest:0 "Чистейшие"
 game_concept_aersanon_desc:0 "«Они очнулись в пустоте, в холоде и одиночестве.\nОни грезили о дружбе, но находили лишь мёртвый камень.\nОни рыдали тысячу лет — и наполнили моря.\nОни пролили свою кровь — и взрастили растения.\nОни отдали свою душу — и даровали жизнь зверям.\nОни воплотили свою любовь — и создали нас».\n\nЭрсанон — создатель [Concept('aeras','Эраса')|E] и всего живого. Один из многих „Богов“, Эрсанон был единственным, кого человеческий разум мог хоть как-то объять, ибо Эрсанон создал людей по Своему образу и подобию, и пределы их разума очерчены рамками их восприятия Эрсанона.\n\nЭрсанон сотворил человечество из жажды обрести соратников, но разочаровался, когда люди оказались неспособны возвыситься до Его уровня. Несмотря на то, что человечество поклонялось Эрсанону как богу, Он отверг людей и создал [Concept('aelfir','эльфиров')|E]. Радуясь улучшенному творению, Эрсанон всё же остался недоволен жестокостью и безумием, струившимися в их крови, и приступил к третьему проекту, однако был сражён во время Годхерии.\n\nУгасший разум Эрсанона (или, по крайней мере, Его отражение на [Concept('aeras','Эрасе')|E]) служит источником [Concept('gedeora','гедеор')|E], [Concept('odrstund','одрстунда')|E] и [Concept('frodbrokna','Фродброкны')|E]. Его кровь породила [Concept('living_magic','живую магию')|E], тело — [Concept('dead_magic','мёртвую магию')|E], а разум — [Concept('mixed_magic','смешанную магию')|E]. [Concept('magic','Магия')|E] становится гораздо сильнее вблизи [Concept('the_towers','Башен')|E], откуда Они правили, и вдоль троп, по которым Они ступали.\n\nСпустя десятки и сотни тысяч лет после Его „смерти“ (насколько это применимо к Богу), Эрсанон оказался забыт всеми, кроме самых наивных детских сказок или эзотерических религиозных преданий."

 game_concept_arthenax:0 "Артенакс"
 game_concept_arthenax_desc:0 "Артенакс — дракон, жившая с незапамятных времён до 439 года от И. С., когда она пала от руки аутократиссы Элиадиас; её принято считать последней в своём роде.\n\nАртенакс вторглась в [Concept('aversaria','Аверсарию')|E] с северо-востока в 421 году от И. С., спустя более 200 лет после того, как драконы считались полностью истреблёнными аверсарианцами. Она вместе со своими четырьмя детьми (драконами Илутунаксом, Партагадом, Олаксанатом и Кутараксом) принялась опустошать Аверсарию, облагая данью местных владык и безжалостно сжигая целые города ради забавы.\n\nАртенакс уничтожила более шести аверсарианскиз легионов и более двухсот [Concept('magi','магов')|E], пытавшихся её остановить, прежде чем сошлась в легендарной дуэли с автократом Элиадиас на юге Опахасии. Элиадиас доказала, что является сильнейшим магом поколения, сразив чудовище и её выводок. Магическое пламя, призванное Элиадиас, было столь яростным, что плоть Артенакс выгорела начисто, а кости превратились в чёрный камень. Её останки до сих пор покоятся там, где они пали много веков назад. Хотя Артенакс считают последним живым драконом, неизвестно, откуда она появилась, а убеждённость в вымирании вида зиждется лишь на отсутствии подтверждённых свидетельств о других драконах с тех пор."

 #GROUPS AND ORGANIZATIONS

 game_concept_fogeaters:0 "Пожиратели тумана"
 game_concept_fog_eater:0 "Пожиратель тумана"
 game_concept_fogeater:0 "Пожиратель тумана"
 game_concept_fog_eaters:0 "Пожиратели тумана"
 game_concept_fogeaters_desc:0 "Пожиратели тумана — это [Concept('mutations','мутировавшие')|E] останки людей, запертых в [Concept('foglands','Туманных землях')|E] после [Concept('frodbrokna','Фродброкны')|E]. Можно ли их всё ещё считать людьми, изменёнными мутантами или разновидностью [Concept('fogbeasts','туманных тварей')|E] — вопрос горячих споров, и о деталях их „культуры“ или верований известно крайне мало.\n\nДостоверно известно лишь то, что когда-то они были разрозненными племенами на далёком северо-востоке. В отличие от большинства тех, кто погибает в удушливом плену [Concept('the_fog','Тумана')|E], они смогли приспособиться к нему, переродившись в нечто иное. Ныне они поголовно поклоняются существу, которое зовут Туманной Матерью — олицетворению тумана, общающемуся с ними, как они верят, сквозь пелену.\n\nСами Пожиратели тумана растеряли почти все остатки человеческого разума, превратившись в бормочущих безумцев. Они сохранили ровно столько рассудка, чтобы совершать налёты и устраивать засады, совершая самоубийство при попытке пленения. Физически они выделяются неестественно бледной, полупрозрачной кожей, сквозь которую видны вены, а порой и внутренние органы, а также непропорционально длинными, тощими конечностями. Их глаза переливаются причудливыми цветами, не встречающимися у обычных людей: от багрового и фиолетового до молочно-белого и угольно-чёрного. Среди них свирепствует слепота, хотя они обладают поразительным иммунитетом к большинству известных болезней и нуждаются в куда меньшем количестве пищи и воды по сравнению с человеком. Несмотря на это, у них процветает жестокий каннибализм, тесно переплетённый с их жуткими религиозными догматами."
 
 game_concept_aelfir:0 "Эльфиры"
 game_concept_aelfir_alien:0 "Чужеродец"
 game_concept_first_men:0 "Первые люди"
 game_concept_aelfir_desc:0 "Эльфиры были вторым творением [Concept('aersanon','Эрсанона')|E], созданным в Его неустанных поисках существа, которое Он мог бы счесть равным Себе.\n\nЭльфиры считались шагом вперёд по сравнению с людьми. Они обладали куда большим талантом к [Concept('magic','магии')|E], реже размножались, жили дольше и в целом были намного умнее и сильнее. На первый взгляд они походили на людей, но их отличали длинные заострённые уши, экзотические, но завораживающе прекрасные черты лица, а оттенки их кожи варьировались от цвета слоновой кости до угольно-чёрного и лазурно-синего.\n\nГлавным изъяном эльфиров была их запредельная жестокость. Одержимые собственным величием и могуществом, они регулярно истязали друг друга и особенно людей в попытках приумножить свои силы. Эрсанон счёл это слабостью и попытался исправить изъян в своём третьем проекте, но его планам помешала Годхерия и Его безвременная кончина.\n\nЭльфиры основали множество империй по всей планете, из которых они правили несколько тысяч лет, пока человечество трудилось в роли бесправной рабской касты. После того как люди украли их магию и полностью истребили этот вид, эльфиры были почти стёрты из истории. Ближе всего к памяти о них подошли [Concept('aversaria','аверсарианцы')|E], поклоняющиеся пантеону „Первых людей“, и сьялволки, в чьих преданиях о [Concept('creature','тварях')|E] от „Вышних Богов“ мелькают упоминания об эльфирах, хотя там они считаются лишь низшими демонами и кровожадными чудовищами."
 
 game_concept_kathanouxaic_empire:0 "Катануксская империя"
 game_concept_kathanouxaic_empire_desc:0 "Названная в честь своего основателя, Катануксская империя правила большей частью Калатипсоми за века до зарождения Аверсарии, став одной из первых подобных держав в зафиксированной истории. Империей управлял совет [Concept('magi','магов')|E], именовавшихся регентами, и все они подчинялись лично королю-чародею Катануксу. Будучи преимущественно аграрным государством с немногими крупными городами, империя тем не менее была жёстко централизована и обладала утончённой [Concept('culture','культурой')|E], славившейся своим архитектурным мастерством. Хотя большинство их творений ныне лежит в руинах, некоторые величайшие чудеса той цивилизации стоят и по сей день — например, пресловутая Башня короля-чародея. Согласно археологическим свидетельствам, паление катануксской цивилизации было внезапным, разрушительным и носило едва ли не апокалиптический характер, о чём красноречиво говорят те немногие материальные следы, что дошли до наших дней."
 
