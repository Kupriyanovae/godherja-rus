 ####GENERAL

 game_concept_aeras:0 "Эрас"
 game_concept_aeras_desc:0 "Эрас — так зовётся единственный обитаемый мир, вокруг которого вращаются солнце и весь остальной космос. Хотя многие религии приписывают его сотворение сонму различных богов или единому творцу, на самом деле он был создан [Concept('aersanon','Древним богом')|E], который отчаянно жаждал компании. Терзаемый древними войнами, катастрофами и [Concept('aelfir','чужеродной')|E] расой, Эрас хранит долгую, утерянную историю и пережил больше катаклизмов, чем кто-либо способен представить."

 ###LORE

 game_concept_the_last_iyrossi:0 "Царь Потаклей"
 game_concept_the_last_iyrossi_desc:0 "Царь Потаклей, прозванный «Последним ийроссцем», был легендарным правителем ийроссов до их окончательного покорения Аавтократией. Царь Потаклей вёл настолько успешную партизанскую войну против аверсарианцев, что сумел выторговать жизнь для всего своего народа ценой их порабощения и собственной жизни. Он остаётся великой фигурой как для самих ийроссов, так и для военных летописцев, ведь его битвы и уловки изучаются даже спустя века после его кончины."

 game_concept_scusstari_guerilla_warfare:0 "Скусстарийская партизанская война"
 game_concept_scusstari_guerilla_warfare_desc:0 "Скусстарийские воины славятся своим упрямством перед лицом превосходящих сил врага. Ещё до начала затяжной войны против Аверсарии они в совершенстве научились использовать суровые края для нанесения максимальных потерь своим противникам. Если битву нельзя выиграть одним решительным ударом, они изматывают врага: совершают налёты на обозы со сгубой и внезапно нападают по ночам, чтобы подорвать боевой дух. Так они доводят врагов до голода, когда недели лишений превращаются в месяцы. Передача этих воинских традиций младшим поколениям — священная обязанность племенных старейшин, что сделало такую тактику важной частью их культуры — культурой непреклонных воинов, готовых сражаться за свободу любой ценой."

 game_concept_old_iyrossi_culture:0 "Древние обычаи ийроссов"
 game_concept_old_iyrossi_culture_desc:0 "В многочисленных общинах ийроссов, разбросанных по утёсам на окраинах Малькои, кровная месть и браки между родными братьями и сёстрами стали обычным делом. Вера ийроссов дозволяет и то, и другое, и даже превозносит эти деяния как благочестивые в глазах Божественного Суда. Подобные обычаи крайне трудно искоренить, поскольку многовековые обряды и ритуалы глубоко укоренились в их жизни."

 ##UNIVERSAL

 #EVENTS

 game_concept_prehistory:0 "Доисторическая эпоха"
 game_concept_prehistory_long_forgotten:0 "Давно забытое"
 game_concept_prehistory_desc:0 "Доисторической эпохой считается любое время, не вошедшее в современный [Concept('aversaria','Имперский')|E] календарь. Аверсарианцы верят, что мир был основан в 24 000 году до И.С. «Чистейшим».\n\nВ действительности же этот [Concept('aeras','мир')|E] сформировался где-то за 20 000 — 400 000 лет до этого. Поскольку сменились сотни различных способов летоисчисления, а время в понимании современных людей существовало не всегда (возможно, по-настоящему начавшись только после Годхерии), точно датировать большую часть человеческой истории невозможно.\n\nЕсли говорить в общих чертах, [Concept('aersanon','Эрсанон')|E] создали мир после нескольких эпох, проведённых в пустоте, а затем сотворили человечество в попытке обрести собеседников. Людям дозволялось основывать собственные государства, и все они поклонялись Эрсанону, но со временем те устали от людского несовершенства и создали [Concept('aelfir','эльфиров')|E]. Эльфиры завоевали и поработили человечество, основав свои империи, но спустя несколько сотен тысяч лет люди восстали и уничтожили как эльфиров, так и самих Эрсанона во время Годхерии."

 game_concept_marcher_aversarian_wars:0 "Войны Марки и Aверсарии"
 game_concept_marcher_aversarian_wars_desc:0 "Войны Марки и Аверсарии — это череда конфликтов между [Concept('marchers','марочниками')|E] из [Concept('chevalie','Шевалье')|E] и [Concept('aversaria','аверсарианцами')|E], проходившая примерно между 344 и 631 гг. от И.С., хотя стычки и пограничные стычки случались как до, так и после этих лет.\n\nВойны начались всерьёз в 344 году от И. С. с нашествия [Concept('arch_lich','Чёрного императора')|E] Якуба «Злоязычника» Яковада в Шевалье, из-за чего большая часть войск Марки из дальних земель на территории нынешней Калатипсоми была отозвана на родину для отражения угрозы. Получив отпор в Айроное от астликов и ещё не оправившись от Восстания Последнего Дракона, аверсарианцы вторглись в земли Марки в своём непрекращающемся стремлении подчинить себе этот край.\n\nПервая война была ожесточённой. После окончательного поражения Якуба Злоязычника марочникские [Concept('antimagi','антимаги')|E] сеяли хаос в рядах аверсарианцев, используя партизанские уловки в суровых окраинах Калатипсоми. Первая волна войн завершилась лишь в 569 году от И.С., когда обе стороны, крайне истощённые и пытавшиеся одновременно сдерживать внешние угрозы и бороться друг с другом, согласились провести новую границу. Аверсария получала большую часть Калатипсоми, в то время как за марочниками оставались Чёрные горы и все земли к западу от них.\n\nЗа сами горы велось ещё несколько мелких войн вплоть до 631 года от И. С., когда [Concept('bloodblight','Кровавая порча')|E] погубила большую часть знати Шевалье, вынудив марочников отступить на запад, после чего их бывшие владения быстро заняли аверсарианские переселенцы. С тех пор законная граница между Шевалье и Аверсарией остаётся неизменной."

 game_concept_chaos_of_the_seventh_century:0 "Хаос седьмого века"
 game_concept_chaos_of_the_seventh_century_desc:0 "Хаос седьмого века — это череда катастрофических событий, начавшаяся в конце VI века и завершившаяся около 760 года от И.С. Хотя бедствия в первую очередь поразили [Concept('aversaria','Аверсарию')|E], они также затронули большую часть [Concept('chevalie','Шевалье')|E] и [Concept('sarradon','Саррадона')|E]. В то время как многие книжники считают это простым невезением, другие предполагают, что виной всему была могущественная [Concept('gedeora','гедеора')|E], наславшая проклятие неудачи на весь [Concept('the_continent','континент')|E].\n\nХаос начался с нашествия [Concept('arch_lich','архилича')|E] Адваги Адвакампи в Шевалье и возвышения аверсарианского [Concept('liches','лича')|E] графа Пемоса в восточной Опахасии. Пока два лича сеяли разрушение (ситуация усугублялась безвластием в Марке и тем, что на аверсарианском троне восседал сущий ребёнок), череда мощных гедеор начала случайным образом швырять аверсарианские города взад-вперед во времени. Обстановку обострила крупная усобица, вспыхнувшая между наместниками Калатипсоми и Малькои в самый разгар нашествий.\n\nВскоре после этого из Аверсарии по всему миру начала расползаться [Concept('bloodblight','Кровавая порча')|E]. Пользуясь слабостью измученного катаклизмами юго-запада, [Concept('kartharadd','Картараддская империя')|E] начала масштабное вторжение в Аверсарию и завоевала большую часть Малькои. Врага удалось отбросить лишь после без малого пятидесяти лет жестокой войны, которая завершилась разгромом последней картараддской армии в битве у Ридувианских курганов в 760 году от И. С., что и положило конец Хаосу."

 game_concept_frodbrokna_desc:0 "Фродброкна — это название череды катаклизмов, произошедших 1.3.1200, когда аавтократ Эшрей выпустил проклятую, пожирающую саму себя кровавую [Concept('magic','магию')|E] на [Concept('the_continent','континент')|E]. Это вызвало повсеместный хаос и разрушения на [Concept('aeras','Эрасе')|E], погубив почти половину [Concept('aversaria','аверсарианского')|E] люда, бесчисленное множество жизней в остальном мире и лишив многих выживших власти над чарами. Хотя его цель, Аксиотея, погибла в результате взрыва, до сих пор неясно, было ли это успехом заклятия или следствием колоссальных сопутствующих разрушений.\n\nВысвобожденная мощь и ужас были столь велики, что сама реальность содрогнулась — расколов [Concept('aervalr','Эрвала')|E] и породив зловещий [Concept('the_fog','Туман')|E]."
 game_concept_frodbrokna:0 "Фродброкна"

 #CHARACTERS
 game_concept_biography: "Биография"
 game_concept_biography_desc: "По всему [Concept('aeras','Эрасу')|E] можно встретить выдающихся и именитых персонажей, отмеченных значком @biography_icon!. Вы можете узнать о них подробнее, наведя курсор на персонажа и на выделенный полужирным текст #E;bold "Наведите, чтобы узнать больше"#! во всплывающей подсказке. Кроме того, вы можете нажать кнопку «Открыть биографию» в окне персонажа".

 game_concept_aersanon:0 "Эрсанон"
 game_concept_ancient_gods:0 "Древние боги"
 game_concept_god:0 "Бог"
 game_concept_gods:0 "Боги"
 game_concept_ancient_god:0 "Древний бог"
 game_concept_ancient_being:0 "Древнее существо"
 game_concept_creator:0 "Создатель"
 game_concept_purest:0 "Чистейший"
 game_concept_aersanon_desc:0 "«Они очнулись в пустоте, в холоде и одиночестве.\nОни грезили о дружбе, но находили лишь мёртвый камень.\nОни рыдали тысячу лет — и наполнили моря.\nОни пролили свою кровь — и взрастили растения.\nОни отдали свою душу — и даровали жизнь зверям.\nОни воплотили свою любовь — и создали нас».\n\nЭрсанон — создатели [Concept('aeras','Эраса')|E] и всего живого. Одни из многих «Богов», Эрсанон были единственными, кого человеческий разум мог хоть как-то объять, ибо Эрсанон создали людей по Своему образу и подобию, и пределы их мысли очерчены рамками их понимания Эрсанона.\n\nЭрсанон сотворили человечество из жажды обрести соратников, но разочаровались, когда люди оказались неспособны возвыситься до Их величия. Несмотря на то, что человечество поклонялось Эрсанону как богу, Они отвергли людей и создали [Concept('aelfir','эльфиров')|E]. Радуясь более совершенному творению, Эрсанон всё же остались недоволеными жестокостью и безумием, струившимися в их крови, и приступили к третьему замыслу, однако были сражёны во время Годхерии.\n\nУгасший разум Эрсанона (или, по крайней мере, Их след на [Concept('aeras','Эрасе')|E]) служит источником [Concept('gedeora','гедеор')|E], [Concept('odrstund','одрстунда')|E] и [Concept('frodbrokna','Фродброкны')|E]. Их кровь породила [Concept('living_magic','живую магию')|E], тело — [Concept('dead_magic','мёртвую магию')|E], а разум — [Concept('mixed_magic','смешанную магию')|E]. [Concept('magic','Магия')|E] становится гораздо сильнее вблизи [Concept('the_towers','Башен')|E], откуда Они правили, и вдоль троп, по которым Они ступали.\n\nСпустя десятки и сотни тысяч лет после Их «смерти» (насколько это слово применимо к Богу), Эрсанон оказались забыты всеми, кроме самых наивных детских сказок или тайных религиозных преданий."

 game_concept_arthenax:0 "Артенакс"
 game_concept_arthenax_desc:0 "Артенакс — драконица, жившая с незапамятных времён до 439 года от И. С., когда она пала от руки аавтократа Элиадией; её принято считать последней в своём роде.\n\nАртенакс ворвалась в [Concept('aversaria','Аверсарию')|E] с северо-востока в 421 году от И. С., спустя более двухсот лет после того, как драконы считались полностью истреблёнными аверсарианцами. Она вместе со своими четырьмя детьми (драконами Илутунаксом, Партагадом, Олаксанатом и Кутараксом) принялась опустошать Аверсарию, облагая данью местных владык и безжалостно сжигая целые города ради забавы.\n\nАртенакс уничтожила более шести аверсарианских легионов и более двухсот [Concept('magi','магов')|E], пытавшихся её остановить, прежде чем сошлась в легендарном поединке с аавтократом Элиадией на юге Опахасии. Элиадия доказала, что является сильнейшим магом своего времени, сразив чудовище и её выводок. Колдовское пламя, призванное Элиадией, было столь яростным, что плоть Артенакс выгорела начисто, а кости превратились в чёрный камень. Её останки до сих пор покоятся там, где они пали много веков назад. Хотя Артенакс считают последним живым драконом, неизвестно, откуда она явилась, а вера в вымирание её вида держится лишь на том, что с тех пор никто больше не встречал других драконов."

 #GROUPS AND ORGANIZATIONS

 game_concept_fogeaters:0 "Пожиратели тумана"
 game_concept_fog_eater:0 "Пожиратель тумана"
 game_concept_fogeater:0 "Пожиратель тумана"
 game_concept_fog_eaters:0 "Пожиратели тумана"
 game_concept_fogeaters_desc:0 "Пожиратели тумана — это [Concept('mutations','искажённые')|E] останки людей, запертых в [Concept('foglands','Туманных землях')|E] после [Concept('frodbrokna','Фродброкны')|E]. Можно ли их всё ещё считать людьми, обращёнными уродцами или разновидностью [Concept('fogbeasts','туманных тварей')|E] — вопрос яростных споров, и о подробностях их быта или верований известно крайне мало.\n\nДостоверно известно лишь то, что когда-то они были разрозненными племенами на далёком северо-востоке. В отличие от большинства тех, кто погибает в удушливом плену [Concept('the_fog','Тумана')|E], они смогли приспособиться к нему, переродившись в нечто иное. Ныне они поголовно поклоняются существу, которое зовут Туманной Матерью — воплощению тумана, общающемуся с ними, как они верят, сквозь пелену.\n\nСами Пожиратели тумана растеряли почти все остатки человеческого разума, превратившись в бормочущих безумцев. Они сохранили ровно столько рассудка, чтобы совершать налёты и устраивать засады, лишая себя жизни при попытке пленения. Обличьем они выделяются неестественно бледной, полупрозрачной кожей, сквозь которую видны вены, а порой и внутренности, а также непропорционально длинными, тощими конечностями. Их глаза переливаются причудливыми цветами, не встречающимися у обычных людей: от багрового и фиолетового до молочно-белого и угольно-чёрного. Среди них свирепствует слепота, хотя они обладают поразительным пристрастием к исцелению от большинства известных болезней и нуждаются в куда меньшем количестве пищи и воды по сравнению с человеком. Несмотря на это, у них процветает жестокое людоедство, тесно переплетённое с их жуткими религиозными догматами."

 game_concept_aelfir:0 "Эльфиры"
 game_concept_aelfir_alien:0 "Чужеродец"
 game_concept_first_men:0 "Первые люди"
 game_concept_aelfir_desc:0 "Эльфиры были вторым творением [Concept('aersanon','Эрсанона')|E], созданным в Их неустанных поисках существа, которое Они могли бы счесть равным Себе.\n\nЭльфиры считались шагом вперёд по сравнению с людьми. Они обладали куда большим талантом к [Concept('magic','магии')|E], реже рожали детей, жили дольше и в целом были намного умнее и сильнее. На первый взгляд они походили на людей, но их отличали длинные заострённые уши, необычные, но завораживающе прекрасные черты лица, а оттенки их кожи варьировались от цвета слоновой кости до угольно-чёрного и лазурно-синего.\n\nГлавным изъяном эльфиров была их запредельная жестокость. Одержимые собственным величием и могуществом, они регулярно истязали друг друга и особенно людей в попытках приумножить свои силы. Эрсанон сочли это слабостью и попытался исправить изъян в своём третьем замысле, но их планам помешала Годхерия и Их безвременная кончина.\n\nЭльфиры основали множество империй по всей планете, из которых они правили несколько тысяч лет, пока человечество трудилось в роли бесправных рабов. После того как люди украли их магию и полностью истребили этот вид, эльфиры были почти стёрты из летописей. Ближе всего к памяти о них подошли [Concept('aversaria','аверсарианцы')|E], поклоняющиеся пантеону «Первых людей», и сьялволки, в чьих преданиях о [Concept('creature','тварях')|E] от «Вышних Богов» мелькают упоминания об эльфирах, хотя там они считаются лишь низшими демонами и кровожадными чудовищами."

 game_concept_kathanouxaic_empire:0 "Катануксская империя"
 game_concept_kathanouxaic_empire_desc:0 "Названная в честь своего основателя, Катануксская империя правила большей частью Калатипсоми за века до зарождения Аверсарии, став одной из первых подобных держав в ведомой истории. Империей управлял совет [Concept('magi','магов')|E], именовавшихся регентами, и все они подчинялись лично королю-волшебнику Катануксу. Будучи по большей части земледельческим государством с немногими крупными городами, империя тем не менее была жёстко централизована и обладала утончённой [Concept('culture','культурой')|E], славившейся своим зодчеством. Хотя большинство их творений ныне лежит в руинах, некоторые величайшие чудеса той цивилизации стоят и по сей день — например, пресловутая Башня короля-волшебника. Согласно преданиям и раскопкам, падение катануксской цивилизации было внезапным, разрушительным и носило едва ли не апокалиптический характер, о чём красноречиво говорят те немногие обломки былого величия, что дошли до наших дней."
 
 #LOCATIONS
 
 game_concept_the_continent:0 "Континент"
 game_concept_continent_posessive:0 "Континента"
 game_concept_continent:0 "Континент"
 game_concept_continental:0 "Континентальный"
 game_concept_greater_aversaria:0 "Великая Аверсария"
 game_concept_the_continent_desc:0 "«Континент», или «Великая Аверсария», — общепринятое название западных земель [Concept('aeras','Эраса')|E], включающих в себя владения [Concept('aversaria','Аверсарии')|E] и [Concept('chevalie','Шевалье')|E]. Поскольку Аверсария безраздельно правила здесь на протяжении большей части веков, в здешних краях континент постепенно начали именовать в её честь, хотя многие иные народы сохраняют собственные названия для этих пространств.\n\nОбщепринятыми рубежами Великой Аверсарии считаются земли к северу от [Concept('the_lichdoms','Владений личей')|E], восточный край Айроноя и бескрайние просторы диких земель и гор на далёком северо-востоке."

 game_concept_the_towers:0 "Башни"
 game_concept_towers:0 "Башни"
 game_concept_tower:0 "Башня"
 game_concept_the_towers_desc:0 "Башни — это цепь странных и загадочных столпов, воздвигнутых в незапамятном прошлом по всему [Concept('aeras','Эрасу')|E]. Почти неразличимые по своему облику, все они выстроены из причудливого иномирного чёрного камня и взмывают ввысь намного выше любых чертогов, доступных человеческому воображению. Вокруг этих великанов часто зарождались культы и веры, чьё рвение подпитывалось мощными потоками [Concept('magic','магии')|E], исходящими от древних камней.\n\nНесмотря на колоссальный интерес к Башням, доподлинно неизвестно, видел ли кто-нибудь их изнутри, поскольку каждая из них окружена смертоносным колдовским полем.\n\nСамой знаменитой среди них является [Concept('sea_tower','Морская башня')|E] (или «Имперская башня» для [Concept('aversaria','аверсарианцев')|E]), которую называют бывшим престолом «Чистейшего». Некоторые тайные ордены утверждают, будто она некогда служила обителью самому [Concept('aersanon','Создателю')|E] этого мира."

 game_concept_sea_tower:0 "Морская башня"
 game_concept_imperial_tower:0 "Имперская башня"
 game_concept_sea_tower_desc:0 "Морская башня (или Имперская башня) — одна из нескольких [Concept('the_towers','Башен')|E], разбросанных по всему миру. Её уникальность заключается в том, что она высится гораздо выше своих собратьев, а исходящая от неё [Concept('magic','магическая')|E] мощь столь велика, что Морская башня считается сильнейшим средоточием магии на всём Эрасе. Сила её настолько колоссальна, что служит истоком для [Concept('tower_wayline','Имперской лей-линии')|E].\n\nНесмотря на это, ни одна живая душа ещё не переступала её порог. Плотнейший поток чистой магии мгновенно испепеляет любого, кто дерзнёт к ней приблизиться, из-за чего разбитые остовы кораблей облепили её подножие подобно морским уточкам.\n\n[Concept('aversaria','Аверсарианцы')|E] утверждают, что Морская башня (или, как они её называют, Имперская башня) когда-то была троном «Чистейшего», и знамя имперской провинции Этепезея с гордостью несёт её очертания в самом центре. Некоторые тайные общества верят, что на самом деле здесь восседал сам [Concept('aersanon','Создатель')|E] этого мира."
 
 #MONSTERS
 
 game_concept_dragons:0 "Драконы"
 game_concept_dragon:0 "Дракон"
 game_concept_dragons_desc:0 "Драконы — это [Concept('godtouched_creatures','затронутые богами существа')|E], обитавшие преимущественно в [Concept('aversaria','Аверсарии')|E] и землях северо-восточного [Concept('sarradon','Саррадона')|E] с незапамятных времён примерно до середины III века от И.С. Эти свирепые исполинские ящеры могли изрыгать на врагов пламя, лёд или яд, летать на огромных кожистых крыльях и обладали разумом, не уступающим человеческому, а порой и превосходящим его. Они были способны к сложной речи, хотя их голос, судя по всему, слышали лишь те, к кому они обращались напрямую. Окрас чешуи драконов разнился в зависимости от природы их дыхания. Обычно они держались стаями до шести особей — родительская пара и их потомство, которое покидало гнездо, как только обзаводилось собственной парой или основывало своё гнездовье.\n\nДраконы были редким, но далеко не диковинным явлением на своей родине вдоль Расколотого побережья, и в аверсарианском обществе считалось величайшей честью получить звание всадника на драконе после приручения одного из этих существ, что обычно достигалось через подобие искренней дружбы. Возвышение Аверсарии совпало — отчасти благодаря стараниям правителей по выращиванию этих тварей — с резким ростом числа этих ящеров, и к началу [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E] насчитывалось более восьмисот признанных всадников, принадлежавших к различным военным ложам и братствам по всей империи.\n\nДраконы были практически полностью истреблены во время той войны и сразу после неё: сперва в яростных битвах, а затем по приказу аавтократа Эксионаракса, который счёл уцелевших ящеров слишком опасными и велел забить их поголовно.\n\nСамым знаменитым драконом в истории была [Concept('arthenax','Артенакс')|E], которую принято считать последней представительницей своего великого племени."

 game_concept_griffons:0 "Грифоны"
 game_concept_griffon:0 "Грифон"
 game_concept_griffons_desc:0 "Грифоны — это разновидность [Concept('godtouched_creatures','затронутых богами существ')|E], которые традиционно гнездятся в горах [Concept('chevalie','Шевалье')|E]. У грифонов мощное тело и задние лапы льва, а голова, крылья и передние когти — орлиные. Они почитаются как исключительно благородные [Concept('creature','создания')|E] в марочникском фольклоре; many народные герои Марки описываются как наездники на грифонах, а образ рыцаря, оседлавшего грифона — традиционный символ, представляющий [Concept('antimagic_orders','антимагические ордены')|E].\n\nНеизвестно, стали ли грифоны более редкими из-за разрастания человеческих поселений в Шевалье, или же древние сказания просто преувеличивали их численность, но старинные саги Марки повествуют о целых армиях всадников на грифонах. В современную эпоху наездники на грифонах встречаются нечасто, обычно это удел членов королевских семей и отборных отрядов, выставляемых антимагическими орденами, некоторые из которых содержат собственные питомники и гордятся выведением этих благородных зверей. Существует традиция, по которой каждый крупный антимагический орден преподносит новоиспечённому монарху молодого грифона. Правитель сам выбирает себе зверя, а затем обучается вместе с вырастившим его орденом, постигая искусство верховой езды и ведения боя со спины крылатого хищника.\n\nГрифоны невероятно умны. Те из них, кто часто бывает среди людей, способны понимать устную речь и откликаться на сложные фразы, хотя сами не могут воспроизвести ни одного человеческого слова.\n\nИх близкими родичами считаются гиппогрифы, некогда обитавшие в Чёрных горах к востоку от Шевалье, однако считается, что они полностью вымерли из-за того, что марочникские рыцари не щадили их в битвах во время [Concept('marcher_aversarian_wars','Войн Марки и Аверсарии')|E]."

 game_concept_mutated:0 "Мутировавшие"
 game_concept_mutate:0 "Мутировать"
 game_concept_mutants:0 "Мутанты"
 game_concept_mutant:0 "Мутант"
 game_concept_mutation:0 "Мутация"
 game_concept_mutations:0 "Мутации"
 game_concept_mutant_creatures:0 "Мутировавшие существа" 
 game_concept_mutations_desc:0 "Мутации — это следствие воздействия колоссальных объёмов [Concept('magic','магии')|E], которое не привело к мгновенной смерти. Хотя подобному влиянию чар часто подвергаются люди вблизи крупных полей сражений между [Concept('magi','магами')|E], in местах средоточия силы или порой в деревнях, расположенных вдоль лей-линий, выжить после этого удаётся немногим. Иногда маги намеренно создают мутантов в ходе своих опытов, что обычно приводит к ужасающим и зловещим результатам.\n\nМутации могут проявляться как угодно: от светящихся глаз и лишних конечностей до полного изменения облика. Множество чудовищ, сотворённых древними магами или давно канувшими в лету державами, до сих пор бродят по [Concept('aeras','Эрасу')|E], поддерживаемые чародейской энергией. Не зафиксировано ни одного верного случая, когда эти твари подчинялись бы кому-то, кроме своего создателя, зато преданий о том, как чудища пожирали своих творцов, предостаточно.\n\nК счастью для большинства, избыток магической силы обычно приводит к [Concept('exposure_sickness','магической немочи')|E] задолго до того, как наступит окончательная смерть или необратимое перерождение, так что многие люди могут избежать худшего, если вовремя распознают первые знаки недуга."

 game_concept_fogbeasts:0 "Туманные твари"
 game_concept_fogbeast:0 "Туманная тварь"
 game_concept_fogbeasts_desc:0 "Туманная тварь — это любое [Concept('creature','существо')|E], порождённое или [Concept('mutations','мутировавшее')|E] в [Concept('the_fog','Тумане')|E]. [Concept('aversaria','Аверсарианские')|E] книжники обычно разделяют их на два рода:\n\n— Туманные твари Мутации:\nСущества, чья плоть и разум были извращены пагубным воздействием Тумана. Чаще всего встречаются дикие волки, медведи и лоси, хотя поступали вести даже о том, что вполне безобидные деревья и сама земля под ногами начинали вести себя как разумные хищники. [Concept('fogeaters','Пожирателей тумана')|E] также можно отнести к этому роду.\n\n— Туманные твари Мысли:\nСоздания, порождённые глубинными человеческими страхами и помыслами во время пребывания в Тумане. Вопреки расхожему мнению, речь идёт не о сиюминутных мыслях, и появление подобных тварей нельзя предотвратить, просто стараясь «думать о хорошем». Вместо этого Туман находит самые потаённые тревоги и убеждения, воплощая их в кошмарных монстров, смутно вдохновлённых этими страхами. В Тумане часто повторяют поговорку: «Если ты услышал монстра в Тумане — значит, ты его уже создал»."

 game_concept_creature:0 "Существо"
 game_concept_creatures:0 "Существа"
 game_concept_creature_desc:0 "Существа (когда это слово не используется как оскорбление) — это любые живые создания на [Concept('aeras','Эрасе')|E], кроме людей. Обычно их делят на три рода:\n\n[Concept('natural_creatures','Естественные существа')|E]: Любое создание, являющееся привычной частью дикой природы. Как правило, сюда относят животных, не демонстрирующих зачатков высшего разума, таких как собаки, рыбы и лошади.\n\n[Concept('godtouched_creatures','Затронутые богами')|E]: К затронутым богами обычно относят существ, обладающих высоким уровнем интеллекта или сочетающих в себе облик сразу нескольких разных животных. [Concept('griffons','Грифоны')|E], [Concept('dragons','драконы')|E] и даже мифический [Concept('the_worldeater','Пожиратель миров')|E] считаются или считались затронутыми богами.\n\n[Concept('mutations','Мутировавшие существа')|E]: Существа, возникшие в результате магических [Concept('mutations','мутаций')|E] — как преднамеренных, так и спонтанных. Поскольку большинство из них абсолютно уникальны и неповторимы, их не разделяют на виды. Главная объединяющая их черта — способность жить невероятно долго, возможно, вечно, подпитываясь чистой магией. [Concept('fogbeasts','Туманных тварей')|E] можно назвать разновидностью таких существ, хотя в обиходе большинство мутантов называют просто [Concept('monsters','монстрами')|E]."

 game_concept_natural_creatures:0 "Естественные существа"
 game_concept_natural_creatures_desc:0 "Естественные существа, согласно описанию в бестиарии [Concept('magi','мага')|E] Калатаркикоса «Удивительные твари мира» (признанном своде знаний о живой природе) — это любые [Concept('creature','существа')|E], которые не выказывают признаков высшего разума и не имеют черт, заимствованных от других родов животных. Примерами могут служить домашний скот, собаки, кошки, лошади, верблюды и большинство лесных обитателей. Будучи самой многочисленной частью живого мира, естественные существа встречаются практически во всех уголках [Concept('aeras','Эрасе')|E] и [Concept('the_continent','Континента')|E].\n\nНесмотря на сомнительные заявления некоторых аверсарианских мудрецов, чужеземцы ни в коей мере не считаются дикими зверями."

 game_concept_godtouched_creatures:0 "Затронутые богами существа"
 game_concept_godtouched_creature:0 "Затронутое богами существо"
 game_concept_godtouched_creatures_desc:0 "Затронутые богами существа, согласно описанию в бестиарии [Concept('magi','мага')|E] Калатаркикоса «Удивительные твари мира» (признанном своде знаний о живой природе) — это любые [Concept('creature','существа')|E], чей разум развит на уровне от близкого к человеческому до превосходящего его, и чей облик сочетает в себе черты нескольких разных животных. Яркими примерами затронутых богами существ служат [Concept('griffons','грифоны')|E], [Concept('dragons','драконы')|E] и гиппогрифы. Граница между затронутыми богами и естественными видами порой бывает весьма размытой, из-за чего споры о многих новооткрытых животных вызывают ожесточённые распри среди знатоков.\n\nХотя [Concept('mutations','мутанты')|E] также могут сочетать в себе черты различных зверей, уникальность их природы и неописуемо жуткий облик обычно исключают их из этого рода."
 
