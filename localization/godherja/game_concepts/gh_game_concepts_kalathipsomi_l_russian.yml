l_russian:
 game_concept_cycle_of_the_wood:0 "Круг Лесной"
 game_concept_cycle_of_the_wood_desc:0 "Вера в то, что вечевое шествие и переходы великих лесов и их обитателей нужны как глоток воздуха для спасения рода людского. Все живое однажды умрет и возродится, а леса — лишь одна из скреп, поддерживающих непрерывное движение сего круга. Люди должны делать все возможное, дабы помогать лесу, и потому многие избирают самые разные пути для сего: от сложения песен до соблюдения строгих запретов в пище и строительстве изб."
