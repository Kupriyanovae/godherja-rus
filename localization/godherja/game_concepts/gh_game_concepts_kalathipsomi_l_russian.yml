l_russian:
 game_concept_cycle_of_the_wood:0 "Цикл Леса"
 game_concept_cycle_of_the_wood_desc:0 "Вера в то, что миграции великих лесов и их обитателей жизненно необходимы для дальнейшего существования человечества. Все живое однажды умрет и возродится, а леса — лишь одна из деталей, поддерживающих непрерывное движение этого цикла. Люди должны делать все возможное, чтобы помогать лесу, и потому многие принимают самые разные подходы к этому: от сложения песен до соблюдения строгих ограничений в пище и строительстве."
