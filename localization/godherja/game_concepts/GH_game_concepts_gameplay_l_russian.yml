l_russian:
 
 game_concept_county_capital_possessive:90 "Столицы графства"
 
 game_concept_uncolonized_wasteland:90 "Пустошь"
 game_concept_uncolonized_wasteland_no_waste:90 "Неколонизированное"
 game_concept_uncolonized_wastelands:90 "Пустоши"
 game_concept_uncolonized_wasteland_desc:90 "$game_concept_uncolonized_wastelands$ — это [Concept('counties','графства')|E], которыми не правит ни один персонаж из-за суровых условий или отсутствия организованного управления. В их [Concept('baronies','баронствах')|E] часто можно найти [Concept('ruin_holding','руины')|E].\n\nПравители, не принадлежащие к [Concept('tribal','племени')|E], могут [Concept('colonization','колонизировать')|E] $game_concept_uncolonized_wastelands$, если [Concept('habitability','обитаемость')|E] целевого графства выше, чем [Concept('habitability_threshold','порог обитаемости')|E] их [Concept('culture','культуры')|E]."
 
 game_concept_colonization:90 "Колонизация"
 game_concept_colonize:90 "Колонизировать"
 game_concept_colonized:90 "Колонизировано"
 game_concept_colonizing:90 "Колонизация"
 game_concept_colonization_desc:90 "Если [Concept('ruler','правитель')|E] желает добавить [Concept('uncolonized_wasteland','неколонизированную пустошь')|E] в свою [Concept('realm','державу')|E], сначала ее нужно [Concept('colonize','колонизировать')|E]. Для $game_concept_colonization$ требуются большие вложения [Concept('gold','@gold_icon!')|E][Concept('gold','золота')|E], и эта стоимость тем ниже, чем выше [Concept('habitability','обитаемость')|E] целевого [Concept('county','графства')|E].\n\nГрафства, в которых идет колонизация, получают [Concept('colony_holding','колониальное владение')|E] в своей [Concept('county_capital','столице графства')|E], и для полного заселения им необходимо заполнить шкалу, которую отображает $game_concept_colonization_progress$."
 
 game_concept_colonization_progress:90 "Прогресс колонизации"
 game_concept_colonization_progress_desc:90 "[Concept('uncolonized_wasteland','Неколонизированная пустошь')|E] считается [Concept('colonization','колонизированной')|E] только тогда, когда ее $game_concept_colonization_progress$ достигает #V 100%#!. $game_concept_colonization_progress$ увеличивается каждый месяц в зависимости от [Concept('stewardship','управления')|E] и [Concept('arcana','арканы')|E] колонизирующего персонажа, а также различных [Concept('county','графских')|E] [Concept('modifiers','модификаторов')|E]."
 
 game_concept_habitability:90 "Обитаемость"
 game_concept_habitability_desc:90 "Первобытные леса, палящие пустыни и выжженные магией [Concept('uncolonized_wasteland','неколонизированные пустоши')|E]; обитаемость отражает то, насколько конкретный регион подходит для постоянного проживания людей. На нее влияют преимущественно тип [Concept('terrain','местности')|E] в [Concept('county_capital','столице графства')|E], [Concept('ambient_magic','окружающая магия')|E], различные [Concept('modifiers','модификаторы')|E], а также является ли [Concept('county','графство')|E] прибрежным.\n\nПерсонажи могут [Concept('colonization','колонизировать')|E] только те графства, пригодность для жизни в которых выше, чем [Concept('habitability_threshold','порог обитаемости')|E] их [Concept('culture','культуры')|E]."
 
 game_concept_habitability_threshold:90 "Порог обитаемости"
 game_concept_habitability_threshold_desc:90 "Порог обитаемости представляет собой минимальный уровень [Concept('habitability','пригодности графства для жизни')|E], который способна перенести определенная [Concept('culture','культура')|E], чтобы иметь возможность [Concept('colonization','колонизировать')|E] его. Этот порог можно снизить, принимая различные адаптирующие к [Concept('terrain','местности')|E] [Concept('traditions','культурные традиции')|E] и открывая определенные [Concept('innovations','инновации')|E]."
 
 game_concept_colony_holding:90 "Колониальное владение"
 game_concept_colony:90 "Колония"
 game_concept_colonies:90 "Колонии"
 game_concept_colony_holdings:90 "Колониальные владения"
 game_concept_colony_holding_desc:90 "Колонии — это [Concept('holding_type','тип владений')|E], уникальный для [Concept('counties','графств')|E], в которых идет [Concept('colonization','колонизация')|E]. Они не приносят [Concept('taxes','налогов')|E] и [Concept('levies','ополчения')|E], но превращаются в обычные [Concept('castle','замковые владения')|E], как только колонизация завершается."
 
 game_concept_ruin_holding:90 "Руины"
 game_concept_ruin:90 "Руины"
 game_concept_ruins:90 "Руины"
 game_concept_ruin_holdings:90 "Руины"
 game_concept_ruin_holding_desc:90 "Руины — это особый [Concept('holding_type','тип владений')|E], представляющий собой заброшенные бесхозные строения в определенном [Concept('county','графстве')|E]. Руины не приносят [Concept('taxes','налогов')|E] или [Concept('levies','ополчения')|E], но их можно заселить с меньшими затратами по сравнению с обычным строительством [Concept('holding','владений')|E]."
 
 #game_concept_opening_events:90 "Вводные события"
 #game_concept_opening_event:90 "Вводное событие"
 ##game_concept_opening_events_desc:90 "[opening_events|E] — это вводные события бла-бла-бла к черту, я вырезаю это, кому какая разница"
 
 game_concept_story_content:90 "Сюжетный контент"
 game_concept_story_content_desc:90 "Многие персонажи в Godherja имеют уникальный контент: от атмосферных событий до полностью настраиваемых механик и путей развития.\n\nКак и оригинальная игра, Godherja создана как песочница, поэтому сюжетный контент лишь дополняет все остальные возможности персонажа и не является обязательным для полноценной игры."

 game_concept_ritewars_struggle:1 "Войны за Северный обряд"
 game_concept_ritewars_struggle_desc:0 "$game_concept_ritewars_struggle$ отражают конфликты и расколы в мире Сьялволки после смерти Кенвара Сокрушителя ведьм. Рожденная великим переселением на Расколотый берег, эта [Concept('struggle','борьба')|E] колеблется между [Concept('struggle_phase_phases','фазами')|E] насилия, настороженного перемирия и прагматичного сотрудничества. Здесь мало постоянных союзников, и [Concept('rulers','правителям')|E] не стоит полагаться исключительно на общую [Concept('faith','конфессию')|E] или [Concept('culture','культуру')|E]."

 game_concept_secure_ritewars_foothold_decision:0 "$secure_ritewars_foothold_decision_title$"
 game_concept_secure_ritewars_foothold_decision_desc:1 "[Concept('decision','Решение')|E], которое позволяет [Concept('ruler','правителю')|E], не вовлеченному в [Concept('struggle_involved','борьбу')|E], завершить $game_concept_ritewars_struggle$."

 PF_piety:0 "Благочестие"
 PF_favor:0 "Милость"
 PF_piety_opposite:0 "[Concept('piety','Милость')|E]"
 PF_favor_opposite:0 "[Concept('piety','Благочестие')|E]"
 PF_piety_desc:0 "Благочестие отражает добродетельность персонажа.\n\nБлагочестивые деяния (в соответствии с [Concept('doctrines','доктринами')|E] его [Concept('faith','конфессии')|E]), такие как [Concept('GetActivityType','паломничество')|E], увеличивают благочестие персонажа.\n\nБлагочестие можно тратить на различные религиозные вопросы в зависимости от [Concept('government_form','формы правления')|E], доктрин и т. д.\n\nКаждый раз, когда персонаж получает $game_concept_piety$, он также продвигается к следующему [Concept('piety_level','уровню набожности')|E]."
 PF_favor_desc:0 "Милость отражает преданность персонажа его темным владыкам."
 PF_level_of_devotion:0 "Уровень преданности"
 PF_level_of_submission:0 "Уровень подчинения"