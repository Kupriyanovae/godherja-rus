  game_concept_shoemaker_rebellion:0 "Восстание сапожников"
  game_concept_shoemaker_rebellion_desc:0 "Восстание сапожников — восстание 239 года от И.С. в [Concept('peti_gisredde','Пети-Гисредде')|E] против оккупационных сил Верховного короля Алоизия из [Concept('chevalie','Шевалье')|E], произошедшее вскоре после воссоединения им королевства. [Concept('prepact_gisredde','Допактное Гисредде')|E] оставалось единственным непокоренным владением, сохранявшим свободу со времен [Concept('three_pier_war','Войны трех причалов')|E], и Алоизий видел в огромном богатстве и упрямой независимости Гисредда постоянную угрозу. Последовавшая осада была недолгой: вскоре [Concept('council_of_gisredde','Совет Гисредда')|E] осознал, что шансов на сопротивление почти нет, и открыл ворота.\n\nСолдаты Алоизия заняли город, а Совет присягнул на верность. Однако затем они начали плести интриги против короля, и гисреддск упрямство вкупе с заговорами Совета подорвали его власть. Попытка поднять налоги для «Благословенной Путем гильдии гисреддских сапожников», ремесленной лиги, привела к тому, что мастера обувного дела подняли восстание, которое поддержал и весь остальной город. Совет нанял целое войско наемников для поддержки, и вскоре армия Алоизия с позором отступила.\n\nПока Алоизий собирал новые силы для разграбления города, Совет предложил мирный договор. Вместе Совет и Алоизий заключили [Concept('gisreddepact','Гисреддский пакт')|E], который навсегда определил отношения Гисредда с Шевалье."
 
  game_concept_three_pier_war:0 "Война трех причалов"
  game_concept_three_pier_war_desc:0 "Война трех причалов — «война» начала II века в [Concept('prepact_gisredde','Допактном Гисредде')|E], которую вели разрозненные ополчения Гисредда (тогда ещё Свергирсреда, первоначальное название Инианвилла не продержалось и десятилетия) против Микала Мудрого, сына фактического основателя Гисредда, [Concept('inian_wisestar','Иниана Мудрого')|E]. Свое название война получила в честь древних доков из черного камня в [Concept('peti_gisredde','Пети-Гисредде')|E], которые, по утверждениям местных жителей, и послужили полем битвы.\n\nКогда Микал Мудрый унаследовал от своего отца титул вице-короля Запада, он изо всех сил пытался сохранить единство своих владений. Его первой целью в кампании по принуждению к присяге стали разрозненные деревни Гисредда, которые (весьма спорно) считались его законными землями. Чтобы установить свой контроль, он привел с собой отряд из пятисот солдат.\n\nПосле этого [Concept('council_of_gisredde','Совет Гисредда')|E] собрался in амбаре, чтобы обсудить кризис. Фольклор гласит, что тогда [Concept('jan_va_gisredde','Ян ва Гисредд')|E] подтолкнул Совет к действиям, хотя правдивость этого сомнительна. Как бы то ни было, Совет собрал ополчение из местных жителей и наемников и одержал совершенно неожиданную побеву над Микалом в последующей «войне» (которая на деле была часовым сражением). И хотя легенды о том, что Ян ва Гисредд использовал в бою домашний скот и даже летающую корову, вызывают вопросы, деревни всё же заставили Микала отступить, что разрушило его государство и положило начало истории упрямой независимости Гисредда."
 
  game_concept_coup_of_the_wayfathers:0 "Переворот святых пути"
  game_concept_coup_of_the_wayfathers_desc:0 "[Concept('grande_gisredde','Гранд-Гисредд')|E] когда-то был неотделимой «половиной» великих владений Гисредда, но доминирование [Concept('peti_gisredde','Пети-Гисредда')|E] служило источником огромного напряжения. Эти разногласия переросли в открытое соперничество на фоне [Concept('sorrowing_of_oejeynica','Скорби Ойейники')|E] и открытия Пети-Гисредда для тысяч беженцев, сделанного вопреки несогласию консервативного населения Гранд-Гисредда.\n\nВ [Concept('champion_of_chevalie','эпоху Защитника')|E] оба города были оккупированы королем Картом Иллурдианом. По традиции, [Concept('council_of_gisredde','Совет Гисредда')|E] в обоих города оказывал сопротивление из тени. Однако всеобщее восстание в Гранд-Гисредде погрузилось в хаос, когда святой пути Айр ден ва Сейхунд упустил контроль над ситуацией и устроил кровавый переворот в своем родном городе, объявив себя патриархом Гисредда, а Совет Гранд-Гисредда — упраздненным. Видя в этом прекрасную возможность досадить Пети-Гисредду, король Карт заключил союз с Сейхундом, оставив Пети-Гисредд без возможности ответить.\n\nНа этом гисреддск единство подошло к концу: местные лорды часто оказывали поддержку Гранд-Гисредду, чтобы сдерживать Пети-Гисредд. Тем не менее возвышение Сейхунда завершилось быстро — святой пути был убит бывшими членами Совета, и вскоре Гранд-Гисредд столкнулся с бесконечной чередой переворотов и восстаний. После того как город примерил на себя едва ли не все мыслимые формы правления (включая недолгую магократию под предводительством трех чересчур ревностных последователей Пути Ворон и странствующих [Concept('aversaria','аверсарианск')|E] бродячих магов [Concept('machyos_prothex','Махиоса Протекса')|E]), [Concept('liches','лич')|E] [Concept('silas_stavro','Силас Ставро')|E] разграбил его на исходе [Concept('red_river_war','Войны Красной реки')|E], что многие сочли скорее милостью, нежели преступлением. Местный нобль Вийкон Калменсон возглавил его восстановление и провозгласил себя герцогом, благодаря чему Гранд-Гисредд впоследствии каким-то образом сохранил одну из самых долговечных династий в [Concept('chevalie','Шевалье')|E]."
 
  game_concept_prepact_gisredde:0 "Допактное Гисредде"
  game_concept_prepact_gisredde_desc:0 "Истоки [Concept('peti_gisredde','Пети-Гисредда')|E] уходят на века в прошлое, задолго до прибытия марочников в [Concept('chevalie','Шевалье')|E]: изначально это было святилище галликадеров под названием Свеверг-Ирссрэдл. [Concept('inian_wisestar','Иниан Мудрый')|E] сжег это место и основал на его руинах Инианвиллу в 79 году от И.С.\n\nНесмотря на все усилия Иниана, название Инианвиллу так и не прижилось, постепенно превратившись в Свергирсред (искаженное галликадерское имя). [Concept('mical_wisestar','Микал Мудрый')|E] попытался заставить местных жителей (чья верность Микалу находилась в подвешенном состоянии) присягнуть ему на верность. В ответ на это сформировался первый [Concept('council_of_gisredde','Совет Гисредда')|E], что привело к [Concept('three_pier_war','Войне трех причалов')|E], разгрому армии Микала и возвышению, вероятно, апокрифического народного героя [Concept('jan_va_gisredde','Яна ва Гисредда')|E]. Местная легенда гласит, что затем Свергирсред был переименован в «Гисреддпорт» в честь Яна.\n\nДоки города стали главным портом Шевалье, и со временем город разросся, поглотив [Concept('grande_gisredde','Барротгейс')|E], вследствие чего два города в итоге превратились в Пети и Гранд-Гисредд (названный так за больший размер владений Гранд-Гисредда, что стало его единственным заметным достижением). Многие пытались аннексировать Гисредд с переменным успехом, ярче всего — Верховный король Алоизий в третьем веке. [Concept('shoemaker_rebellion','Восстание сапожников')|E] привело к заключению [Concept('gisreddepact','Гисреддского пакта')|E], заложившего юридическую основу независимости города и завершившего первую «эру» в истории Гисредда, за которой последовала эпоха [Concept('precollapse_gisredde','Доколлапсного Гисредда')|E]."
 
  game_concept_precollapse_gisredde:0 "Доколлапсное Гисредде"
  game_concept_precollapse_gisredde_desc:0 "«Доколлапсное Гисредде» — период в истории Гисредда, следовавший за [Concept('prepact_gisredde','Допактным Гисредде')|E] и подписанием [Concept('gisreddepact','Гисреддского пакта')|E]. Вопреки названию, конец этой эпохи ознаменовался не крахом самого [Concept('peti_gisredde','Пети-Гисредда')|E], а крахом всего [Concept('chevalie','Шевалье')|E] в горниле [Concept('the_brutality','«Жестокости»')|E] и [Concept('anarchy_of_the_five_crowns','Анархии пяти корон')|E].\n\nГисреддский пакт мало чем помогал против алчных военачальников и деспотичных Верховных королей, положив начало циклу, в котором гисреддцы открывали свои ворота оккупантам лишь для того, чтобы уничтожить их изнутри. Это одновременно порождалось и подпитывалось растущей концепцией [Concept('fraternity_of_gisredde','Братства Гисредда')|E]. Братство оправдывало решение Пети-Гисредда принять ойейниканских беженцев, спасавшихся от [Concept('sorrowing_of_oejeynica','Скорби Ойейники')|E], что разгневало более консервативный [Concept('grande_gisredde','Гранд-Гисредд')|E] и положило начало затяжному соперничеству между ними, кульминацией которого стали [Concept('coup_of_the_wayfathers','Переворот святых пути')|E] и независимость Гранд-Гисредда в 889 году от И.С.\n\nКогда безумный Верховный король Тамеан устроил резню высшей знати Шевалье, чтобы отомстить за своего убитого сына Гилимана, Шевалье погрузилось в Анархию пяти корон. Среди убитых оказался и тогдашний канцлер Пети-Гисредда, и город погрузился в хаос вплоть до начала [Concept('red_river_war','Войны Красной реки')|E], ознаменовавшей зарю [Concept('champion_era_gisredde','Гисредда эпохи Защитника')|E]."
 
  game_concept_champion_era_gisredde:0 "Гисредде эпохи Защитника"
  game_concept_champion_era_gisredde_desc:0 "«Гисредде эпохи Защитника» — период истории [Concept('peti_gisredde','Пети-Гисредда')|E], следующий за [Concept('precollapse_gisredde','Доколлапсным Гисредде')|E]. Названная в честь [Concept('champion_of_chevalie','Защитника Шевалье')|E], эта эпоха технически началась ещё до его вероятного рождения, но завершилась его смертью и победой над [Concept('arch_lich','архиличем')|E] [Concept('silas_stavro','Силасом Ставро')|E] в Пети-Гисредде. Будучи самой короткой исторической эпохой Гисредда, она одновременно стала и самой легендарной.\n\nПети-Гисредд непрерывно сражался с наступающими военачальниками во времена [Concept('anarchy_of_the_five_crowns','Анархии пяти корон')|E], одновременно справляясь с хаосом, вызванным гибелью канцлера Перрита во время [Concept('the_brutality','«Жестокости»')|E]. Город был оккупирован лишь однажды, что закончилось знаменитой ныне [Concept('night_of_the_winking_rose','Ночью Подмигивающей розы')|E]. Несмотря на победу, [Concept('grande_gisredde','Гранд-Гисредд')|E] пал в результате [Concept('coup_of_the_wayfathers','Переворота святых пути')|E] и обрел независимость. Когда вскоре после этого Силас Ставро вторгся в [Concept('chevalie','Шевалье')|E], Пети-Гисредд финансировал и снабжал королевства живых. Этой помощи оказалось недостаточно, чтобы помешать Ставро пробиться гораздо дальше на запад Шевалье, чем любому другому личу. Сказания гласят, что, когда армии Шевалье отступали на запад, Защитник Шевалье убедил [Concept('council_of_gisredde','Совет Гисредда')|E] в необходимости единства и совершил множество великих деяний по всему городу как для знати, так и для простых людей. Говорят даже, что он выявил агента Ставро в самом Совете — знатного жителя Гранд-Гисредда, ставшего некромантом.\n\nУбежденный этим, Совет единственный раз в истории приостановил действие Гисреддского пакта, позволив отступающим армиям дать решительный бой в городе. Там, на крыше дворца Гисредда, Защитник и Ставро сошлись в схватке. И Защитник, и Ставро пали, что положило конец [Concept('red_river_war','Войне Красной реки')|E]. Сотни городков, городов и деревень по всему Шевалье после этого заявляли, что Защитник был их уроженцем. Громче всех об этом заявляет Пети-Гисредд, утверждая, что Защитник отдал жизнь ради защиты города, который любил с самого рождения, несмотря на полное отсутствие доказательств. Конец Войны Красной реки принес с собой эпоху с говорящим названием — [Concept('glorious_gisredde','Славное Гисредде')|E]."
 
  game_concept_glorious_gisredde:0 "Славное Гисредде"
  game_concept_glorious_gisredde_desc:0 "«Славное Гисредде» — эпоха в истории [Concept('peti_gisredde','Пети-Гисредда')|E], длящаяся со смерти [Concept('champion_of_chevalie','Защитника Шевалье')|E] (завершившей короткую [Concept('champion_era_gisredde','эпоху Защитника')|E]) до наших дней. Канцлер Мэйуэйт дал название этой эпохе в 1011 году от И.С., провозгласив, что город переживает свой величайший золотой век — утверждение, которое трудно оспорить с тех пор, как город утвердился в качестве одной из самых влиятельных торговых держав мира.\n\nРасцвет Пети-Гисредда благодаря торговле стал главным символом этой эпохи: коммерция дотянулась даже до Каширии, а дополнительное процветание принесло открытие торговли с опустошенным [Concept('sarradon','Саррадоном')|E] и рост числа [Concept('marchers','марочникских')|E] авантюристов за рубежом. Тем не менее город столкнулся с кризисом во время краха [Concept('clerical_control_of_chevalie','клерикального контроля над Шевалье')|E] и [Concept('war_of_the_heretic_princes','Войны принцев-еретиков')|E], как и всё остальное Шевалье, став местом провозглашения Тискулом ден ва Вескотом своих «Четырех шагов спасения» и ареной множества убийств. Однако, несмотря на утверждение Конклава Раокура в качестве единственного арбитра веры, город продолжал созывать собственный противоборствующий Конклав всякий раз, когда Раокур пытался установить хоть какой-то контроль.\n\nКак бы то ни было, Пети-Гисредд продолжал расти как космополитичная держава, особенно после создания в 1067 году от И.С. [Concept('gisreddean_banking_system','Гисреддской банковской системы')|E], и гисреддских моряков, купцов и наемников ныне можно встретить в любом краю, «где ещё бьются сердца и где можно нажить монету»."
 
  game_concept_night_of_the_winking_rose:0 "Ночь Подмигивающей розы"
  game_concept_night_of_the_winking_rose_desc:0 "Ночь Подмигивающей розы — восстание 889 года от И.С. в [Concept('champion_era_gisredde','эпоху Защитника')|E] против самопровозглашенного короля Карта Иллурдиана. Знаменитый публичный дом [Concept('peti_gisredde','Пети-Гисредда')|E] «Подмигивающая роза» дал название этому событию, поскольку оно началось в стенах заведения и силами его работниц.\n\nПосле того как армия Иллурдиана нарушила [Concept('gisreddepact','Гисреддский пакт')|E] и осадила Пети-Гисредд, [Concept('council_of_gisredde','Совет Гисредда')|E] открыл ворота его войскам, чтобы гарантировать справедливое обращение. Вслед за оккупацией Иллурдиан обобрал, а затем и разогнал Совет, отдав город в управление своему кузену. Правя из городской канализации, Совет издал указ, согласно которому все солдаты Иллурдиана могли развлекаться в городских борделях совершенно бесплатно. Когда те хлынули во многочисленные дома терпимости, куртизанки открыли свои двери, свои объятия, а затем — и горла солдат припрятанными ножами. За считанные часы блудницы вырезали сотни солдат Иллурдиана, а ещё больше пало, когда остальное население поднялось в виде огромной толпы под предводительством испачканных в крови жриц любви.\n\n«Подмигивающая роза» унесла жизни не только множества солдат, но и кузена Иллурдиана, и вскоре его армии отступили. Иллурдиан согласился на мир, восстановив Гисреддский пакт, но потерял так много людей, что его государство вскоре распалось. Взамен утраченных земель Иллурдиан получал ежегодную дань в размере десяти серебряных гисреддских монет. С тех пор это событие стало краеугольным камнем гисреддского фольклора, а местный закон вскоре предписал «Подмигивающей розе» оставаться открытой навечно в качестве «культурной достопримечательности» (и места для опасно хорошего времяпрепровождения)."
 
  game_concept_black_gold_war:0 "Война Черного золота"
  game_concept_black_gold_war_desc:0 "Вызванная [Concept('chevalien_succession_crisis_1217','Шевальенским кризисом престолонаследия 1217 года')|E], Война Черного золота (или Война Лиги Черного золота) представляла собой гражданскую войну между одноименной [Concept('black_gold_league','Лигой')|E] и западными лордами [Concept('chevalie','Шевалье')|E]. Конфликт начался с первоначальных успехов Лиги на юге, которая стремительно завоевала Вальгедок и Астопорт. Однако их продвижение было остановлено при осаде замка Мон-Граз знаменитым маршалом — герцогом Рене ден ва Вуараром, который продержался достаточно долго, чтобы Гардфрей успел прибыть со своими рыцарями.\n\nПереломный момент наступил со смертью герцога Валомера Монто в 1221 году от И.С. и победами Гардфрея в Варусийской кампании, что в конечном итоге убедило северных герцогов и Варрдевет признать его притязания. Что ещё хуже, оказавшийся в тяжелом положении герцог Эдвин Валадек решил сменить сторону после потери большей части своих земель. Он не только передал свои войска под командование Гардфрея, но и сыграл решающую роль в том, чтобы убедить примкнувших к Черному золоту конейкмейнеров сменить сторону, пообежав им выгодные торговые соглашения.\n\nЭти события прозвучали похоронным звоном по остаткам Лиги Черного золота, которая пала в своем последнем бою в битве при Гравгоске в 1227 году от И.С., что положило конец гражданской войне."
 
  game_concept_chevalien_succession_crisis_1217:0 "Шевальенский кризис престолонаследия 1217 года от И.С."
  game_concept_chevalien_succession_crisis_1217_desc:0 "Ввиду внезапной и неожиданной кончины Верховного короля Дендона ден ва Сейнёна в 1217 году от И.С., престолонаследие [Concept('chevalie','Шевалье')|E] оказалось под вопросом.\n\nЛорды де Порт ден ла Бастион и Периньяна поддержали Гардфрея ден ва Сейнёна, последнего выжившего сына Верховного короля, в то время как традиционалистск настроенные лорды Варрдевета выступили на стороне его старшей сестры, Дайны ден ва Сейнён. Северные лорды Земожича и Западного Рора не приняли ничью сторону, предпочтя вместо этого направить свои силы против [Concept('the_lichdoms','северной угрозы')|E] и дождаться появления явного победителя.\n\nОднако восточные лорды Марру и Восточного Рора выдвинули собственного претендента — Терина Валадека, племянника покойного короля по линии его супруги. В итоге кризис перерос в открытое столкновение, давшее начало гражданской войне, известной впоследствии как [Concept('black_gold_war','Война Черного золота')|E]."
 
  game_concept_rohrian_annex:0 "Рорский аннекс"
  game_concept_rohrian_annex_desc:0 "После своей победы в [Concept('ash_war','Пепельной войне')|E] марочники вели споры о возможном вторжении с целью [Concept('marcher_aversarian_wars','вернуть свои древние крепости')|E] в горах. Однако этим амбициям положило конец вероломное предательство их партийск союзников, совершенное безо всяких причин. Партийск маги убили герцога Раона II ден ва Сиссо из Файсительбурена вместе с несколькими другими шевальенскими дворянами и вскоре после этого завоевали большую часть восточных рорских равнин, что подвело решительную черту под Пепельной войной."
 
  game_concept_bitter_war:0 "Горькая война"
  game_concept_bitter_war_desc:0 "Горькая война — гражданская война, шедшая в Канцелярии в 1154–1156 годах, которую вел Луйсэрен «Горький» с целью захватить власть в конейкмейнерск Вудрик. Будучи свергнутым унитаристами в результате переворота из-за неудачных войн в [Concept('chevalie','Шевалье')|E] и растущих долгов, Луйсэрен собрал армию преданных последователей и осадил [GetBuilding('01_orangepalace').GetName].\n\n«Горькие месяцы» правления Луйсэрена в качестве Вудера ознаменовались казнями и массовыми убийствами, с мстительной яростью захлестнувшими восточные [Glossary('Granmaer Moor','konijkmener_encyclopedia_desc')]. Несколько благородных [Concept('houses','домов')|E] были полностью истреблены из-за их былого противостояния Луйсэрену или его союзникам.\n\nБлагодаря совместным усилиям во главе с домом Корверёй и при разной степени поддержки со стороны лордов [GetGeographicalRegion('world_ga_riverlands_formable').GetName] и Марру, войска Луйсэрена были оттеснены в их последнюю оставшуюся крепость в графстве Дерентиде. Последовавшая осада оставила темное пятно на истории региона на десятилетия. Наследник Луйсэрена был убит на поле боя в акте кровной мести, а его тело позже перебросили через стены из катапульты, прежде чем силы дома Корверёй пробили оборону. Выживших не осталось: Маэнврус, вернув себе Оранжевый дворец, объявил их всех изменниками, поскольку многие лорды всё ещё жаждали мести за казни своих близких во время правления Луйсэрена."
  
  #ORGANIZATIONS
  
  game_concept_council_of_gisredde:0 "Совет Гисредда"
  game_concept_council_of_gisredde_desc:0 "Совет Гисредда — правящее правительство [Concept('peti_gisredde','Пети-Гисредда')|E] и старейший непрерывный орган власти в Шевалье, ведущий свою историю с первого века. Несмотря на то, что Совет неоднократно разгонялся иноземными захватчиками, нарушавшими [Concept('gisreddepact','Гисреддский пакт')|E], он всегда продолжал править из тени и неизменно возвращался к власти после восстаний.\n\nСовет Гисредда (тогда ещё Свергирсреда, возникшего на месте галликадерского [Concept('sweverg_irssraedl','Свеверг-Ирссрэдла')|E]) впервые сформировался во время [Concept('three_pier_war','Войны трех причалов')|E]. Легенды гласят, что разрозненные деревни созвали чрезвычайный совет, чтобы обсудить, как избежать требований о присяге (и налогах) со стороны вице-короля Запада [Concept('mical_wisestar','Микала Мудрого')|E]. Изначально состоявший из местных жителей, совет объединил их скудные богатства и подкупил проезжих торговцев, воинов и наемников, чтобы те примкнули к ним. Отчаяние, вероятно, привело к тому, что в совет приняли и местных преступников. Народное предание гласит, что поднять их на борьбу с Микалом сумел, скорее всего, апокрифический [Concept('jan_va_gisredde','Ян ва Гисредд')|E]. Лорды согласились, но, оскорбленные его дерзостью, дали ему в подчинение стадо домашнего скота — его Ян в итоге и использовал для достижения победы.\n\nНесмотря на столь туманное основание, Совет продолжил править и впредь. По мере роста Пети-Гисредда совет превратился в византийский сенат, состоящий из торговых лиг, ремесленных цехов, местных ноблей, гильдий убийц и воров, [Concept('clerical_control_of_chevalie','рыцарских орденов')|E], [Concept('gisreddean_banking_system','банковских организаций')|E], дворянских домов, [Concept('gisreddean_banking_system','высокопоставленных святых пути')|E] и многих других. Чужаки часто называют его «самым запутанным правительством в мире», а другие (оскорбительно со стороны чужаков и шутливо со стороны местных) — «правительством легальных преступников». Коррумпированный или нет, Совет поддерживает стабильность уже более тысячи лет, а сам город превратился в один из богатейших на [Concept('the_continent','континенте')|E]. Этот термин также относится к бывшему Совету [Concept('grande_gisredde','Гранд-Гисредда')|E], свергнутому во время [Concept('coup_of_the_wayfathers','Переворота путеводных отцов')|E], что привело к независимости города — событию, которое большинство жителей Пети-Гисредда считают чистым благом."
 
  game_concept_black_gold_league:0 "Лига Черного золота"
  game_concept_black_gold_league_desc:0 "Лига Черного золота — союз восточных герцогов и лордов из Марру и Восточного Рора, созданный в 1217 году от И.С. герцогом Эдвином Валадеком с единственной целью — возвести его сына, Терина «Черного Когтя», на трон [Concept('chevalie','Шевалье')|E]. Лига получила свое название в честь геральдических знаков двух ведущих мятежных династий — золотого гиппогрифа Монто и черного грифона Валадека."
  
  #CHARACTERS
  
  game_concept_inian_wisestar:0 "Вице-король Иниан Мудрый"
  game_concept_inian_wisestar_desc:0 "Иниан Мудрый (прозвище «Мудрый» было добавлено спустя века после его смерти) — шевальенский военачальник [Concept('marchers','марочников')|E] и народный герой, пришедший к власти в разгар Великого переселения марочников. Служа таинственному преемнику Доброго короля Бастона, Мудрый собрал огромное войско и отвоевал западное [Concept('chevalie','Шевалье')|E] у последних обитавших там галликадерских кланов. На месте их святилища Свеверг-Ирссрэдл он основал Инианвиллу, которая в будущем превратилась в [Concept('peti_gisredde','Пети-Гисредд')|E]. За эту победу Иниан удостоился титула вице-короля Запада.\n\nНесмотря на то, что он был провозглашен Святым пути правосудия и почитается как народный герой, историческая личность Мудрого вызывает много споров. Сказания марочников повествуют о мудром и дальновидном правителе, который хитростью заставлял галликадеров явить свою порочную суть, после чего карал их или обращал в свою веру. Однако [Concept('aversaria','аверсарианские')|E] ученые X века утверждали обратное. Исторические хроники, перекликающиеся с легендами самих галликадеров, рисуют Мудрого человеком, известным своей чудовищной жестокостью к коренному населению, бесконечными политическими интригами, заговорами и постоянными междоусобицами с соседними лордами ради укрепления собственной власти.\n\nКак бы то ни было, Мудрый сумел подавить несколько восстаний галликадеров, окончательно лишив их надежды на возрождение, и правил около тридцати лет, пока не был убит галликадерскими мятежниками, после чего вице-королевство перешло к его сыну, [Concept('mical_wisestar','Микалу Мудрому')|E]. Его наследие оказалось недолговечным: правление Микала омрачилось множеством несчастий (таких как [Concept('three_pier_war','Война трех причалов')|E]), что привело к упразднению вице-королевства и аннексии его земель соседними военачальниками."
 
  game_concept_mical_wisestar:0 "Микал Мудрый"
  game_concept_mical_wisestar_desc:0 "Микал Мудрый — древний шевальенский дворянин [Concept('marchers','марочник')|E], унаследовавший вице-королевство Запада (примерно соответствующее современному Порт-ден-ла-Бастиону) от своего более знаменитого отца, народного героя [Concept('inian_wisestar','Иниана Мудрого')|E]. Прозвище «Мудрый», по всей видимости, было присвоено Микалом самому себе, дабы укрепить свое стремительно угасающее величие. По иронии судьбы, это стало чуть ли не единственным его долговечным наследием: спустя века это прозвище закрепилось и за его отцом.\n\nНесмотря на то, что его отец твердо удерживал власть, Микал столкнулся с растущим сопротивлением со стороны как марочникских, так и галликадерских мятежников. С падением Верховного королевства бремя стабилизации государства легло исключительно на его плечи — исключительно тяжелая задача, с которой он едва справлялся. В ходе военной кампании, призванной вернуть под его контроль все земли, которыми когда-то правил его отец, он вступил в конфликт с [Concept('peti_gisredde','Пети-Гисреддом')|E] (бывшим тогда не более чем группой из нескольких деревень).\n\nЭто обернулось неожиданной катастрофой: Микал потерпел унизительное поражение в последовавшей [Concept('three_pier_war','Войне трех причалов')|E], что народные предания часто приписывают заслугам народного героя [Concept('jan_va_gisredde','Яна ва Гисредда')|E]. Потерпев неудачу в попытке захватить даже цепочку захолустных деревень, Микал был свергнут, вице-королевство упразднено, а его земли вскоре аннексировали соседи. Сам Микал вскоре скончался в изгнании, не оставив после себя сколь-нибудь примечательных наследников."
 
  game_concept_jan_va_gisredde:0 "Ян ва Гисредд"
  game_concept_jan_va_gisredde_desc:0 "Ян ва Гисредд — (скорее всего, апокрифический) народный герой, который, как утверждают Гисреддцы, был одним из первых поселенцев [Concept('prepact_gisredde','Допактного Гисредда')|E] после его основания [Concept('inian_wisestar','Инианом Мудрым')|E]. В преданиях Ян ва Гисредд чаще всего предстает простым, но уважаемым фермером из бедных деревень, на месте которых впоследствии вырастет [Concept('peti_gisredde','Пети-Гисредд')|E]. И хотя Гисреддцы уверяют, будто город назван в честь Яна, эта история, весьма вероятно, появилась намного позже завершения его маловероятной жизни. Исследователи утверждают, что если он и существовал в действительности, то его имя, скорее всего, звучало как распространенное в те времена *днг мал Гирссред* — упрощенное название поселения Свергирсред (которое само по себе уже было искажением галликадерского Свеверг-Ирссрэдла).\n\nКогда [Concept('mical_wisestar','Микал Мудрый')|E] вторгся в эти земли во время [Concept('three_pier_war','Войны трех причалов')|E], Ян, как говорят, явился на заседание [Concept('council_of_gisredde','Совета Гисредда')|E] (заседавшего тогда в обычном амбаре) и отчитал нерешительных ноблей, призвав их к оружию. Воодушевленные, но уязвленные его упрямой речью, лорды в шутку поручили ему командование отрядом из десяти коров, четырех свиней и двух очень мудрых воронов. Они нарекли его предводителем всего гисреддского скота и велели старому Яну идти в бой со своими зверями, пока они собирают ополчение. Сказания гласят, что Ян знал о существовании древней двери на своих землях и отворил ее, выпустив двенадцатиногое чудовище, которое, по заверениям Гисреддцев, имело облик коровы, хвост змеи, два драконьих крыла и огнедышащую пасть. Ян возглавил свое (преимущественно крупное рогатое) воинство и ударил в фланг армии Микала, когда та уже была близка к победе над ополчением. Солдаты Микала зажали Яна на одном из причалов из черного камня, который он в одиночку оборонял целый час с одними лишь вилами в руках, пока те самые десять коров не скинули врагов в море.\n\nОбычно эти истории заканчиваются тем, что Ян взял обломок каменной кладки разрушенного дома и заложил первый камень в основание того, что позже станет дворцом Гисредда, где теперь гордо стоит его статуя — с вилами в руке и верной коровой, восседающей у его ног."
 
  game_concept_machyos_prothex:0 "Махиос Протекс"
  game_concept_machyos_prothex_desc:0 "Махиос Протекс — живший в IX веке [Concept('aversaria','аверсарианский')|E] [Concept('magi','маг')|E], происходивший из приграничных земель Малькоиса и Опахазии. Будучи народным героем Аверсарии, он тем не менее оставил в истории два совершенно противоположных и самобытных образа, отражающих его легендарные странствия по известному миру. Единственное, в чем сходятся обе версии — это то, что он прошел через каждое наместничество Аверсарии, посетил [Concept('chevalie','Шевалье')|E], пересек весь Айроной, после чего добрался до Каширии и, возможно, Катун-Кая, повсюду приходя на выручку местным жителям.\n\nАверсарианская версия легенды повествует о властном маге, который волею судеб был вынужден помогать выродившимся неполнокровным чужеземцам, куда бы ни привел его путь, причем спасенные дикари неизменно начинали поклоняться ему как богу после того, как он в одиночку вытаскивал их из пучины устроенного ими же краха, наставляя их знанием о Чистейших. Сказания также упоминают, что он полностью истреблял культуры тех народов, которых находил истинно нечистыми, презирая любого, кто осмеливался посягнуть на свет Аверсарии.\n\nДругая историческая линия Махиоса обнаруживается в летописях тех земель, по которым он путешествовал. Вопреки пропаганде своей родины, Протекс часто описывается как на удивление потрёпанный человек, неохотно раскрывающий свое благородное происхождение или магический дар. На самом деле Махиосу было попросту скучно, и он желал увидеть скрытые чудеса мира и познакомиться с интересными людьми. Обладая обостренным чувством справедливости, Махиосо часто вмешивался в местные дела, дабы защитить тех, кого считал невинными и чистыми душой, попутно обзаводясь новыми спутниками. Самым примечательным примером является его дружба с каширийским магом-гуру Вогибом, вместе с которым они спасли Каширию во время Сабар Ламбай Раад."
 
  game_concept_the_black_monk:0 "Черный монах"
  game_concept_black_monk:0 "Черный монах"
  game_concept_the_black_monk_desc:0 "Лидер ардерианской ереси [Concept('marchers','марочников')|E] времен [Concept('war_of_the_heretic_princes','Войны принцев-еретиков')|E] (и, возможно, основатель этого учения), «Черный монах» оставался загадочной фигурой, чью подлинную личность историкам так и не удалось установить (задача усложнялась яростным иконоборчеством ардеристов, из-за чего лицо ересиарха на всех их изображениях всегда скрыто). Об их происхождении мало что известно до того момента, как монах стремительно возвысился благодаря череде удивительных чудес, признаваемых даже их критиками. Хотя многие клеймили их шарлатаном и обманщиком, они быстро обрели массу последователей и даже были обожествлены многими вопреки собственным иконоборческим догматам.\n\nТак и не плененные, они бесследно исчезли незадолго до окончания Войны принцев-еретиков, а их сторонники рассеялись после падения их главного оплота в Веспре."
  
