  #EVENTS
  
  game_concept_chevalie_migratory_era:0 "Эпоха переселений"
  game_concept_chevalie_migratory_era_desc:0 "Эпоха переселений в марочникской истории (которую не следует путать с гораздо более поздней [Concept('sjalvolki_migration','переселения сьялволков')|E] в XIII веке) относится к периоду, когда протошевальенцы впервые прибыли на земли, ставшие их постоянным домом.\n\nПридя с востока в конце I века до И.С. — если верить преданиям, чтобы спастись от рабства в ныне давно погибшей империи, — они столкнулись с галликадерами, коренными жителями этого региона, с которыми вели жестокую войну на протяжении последующих десятилетий. В конце концов это противостояние привело к тому, что галликадеры практически сошли с главной исторической арены, система [Concept('lifepath','жизненных путей')|E] была кодифицирована, а также возникло первое подобие «Верховного королевства» (хотя его устройство имело мало общего с современным аналогом). Их вел «Добрый король» Бастион, который воплощал в себе то, что сегодня считается идеалом монарха в глазах шевальенцев, — если, конечно, он существовал на самом деле, что вызывает определенные споры среди историков.\n\nС самого начала, despite на победу над прежними обитателями [Concept('chevalie','Шевалье')|E], им не суждено было насладиться мирной передышкой, поскольку конфликты с ойейниканскими племенами на севере (которые они сами во многом и спровоцировали), Катанауксаикской империей на юге и, наконец, с [Concept('liches','личами')|E] превратились в экзистенциальные угрозы. Именно поражение первого [Concept('arch_lich','архилича')|E], [Concept('vilas_venslau','Виласа Венслау')|E], ознаменовало в глазах большинства классических историков окончание Эпохи переселений."
  
  game_concept_the_brutality:0 "Жестокость"
  game_concept_the_brutality_desc:0 "«Жестокость» относится к резне более чем 200 дворян и членов их семей в 878 году от И.С. на похоронах сына верховного короля Тамеана, Гилимана, устроенной по приказу монарха. Термин «резня» также часто используют для обозначения последовавших масштабных чисток их семей, домов и тех, кто не присутствовал на похоронах, по всей территории [Concept('chevalie','Шевалье')|E].\n\nЭта резня напрямую привела к [Concept('anarchy_of_the_five_crowns','Анархии пяти корон')|E] и [Concept('red_river_war','Войне Красной реки')|E], которые повсеместно считаются самым темным периодом в марочникской истории. Расправа фактически пресекла родословные знатных семей Демонто, Клемендэр и Вилигад, наряду с двумя десятками других второстепенных домов, и унесла жизни почти всех высших дворян и династических глав в Шевалье. Сам Тамеан вскоре покончил с собой прямо в тронном зале в припадке безумия, причем исторические хроники расходятся во мнении, намеревался ли Тамеан вскрыть вены достаточно глубоко, чтобы истечь кровью, или же это был несчастный случай. Популярные легенды гласят, что его можно было спасти, но его рыцари были слишком напуганы и устыжены поведением своего верховного короля, чтобы прийти на помощь, и вскоре сами покончили с собой, чтобы искупить вину перед своим правителем.\n\nПомимо самих убийств, эта резня вызвала бурные споры из-за использования наемников, арендованных у [Concept('antimagic_orders','антимагических орденов')|E]. Тамеан, не доверяя собственным людям, заплатил огромные суммы различным святым орденам за услуги их наемных рот, чтобы те выполнили работу за него и гарантировали, что регулярные войска не смогут им помешать. Репутация орденов оказалась запятнана, и восстановить ее удалось лишь к концу Войны Красной реки после самопожертвования [Concept('champion_of_chevalie','защитника Шевалье')|E]. Вскоре после этого ордена объявили о своем нейтралитете в марочникской политике и сосредоточили свою наемническую деятельность за рубежом."
  
  game_concept_anarchy_of_the_five_crowns:0 "Анархия пяти корон"
  game_concept_anarchy_of_the_five_crowns_desc:0 "Анархия пяти корон — период марочникской истории, традиционно считающийся низшей точкой в известной памяти жителей [Concept('chevalie','Шевалье')|E], который длился с 878 по 939 год от И.С. После того как безумный верховный король Тамеан отреагировал на убийство своего сына Гилимана безумием, устроив резню всей высшей знати и их семей во время [Concept('the_brutality','«Жестокости»')|E], он вскоре после этого убил своих детей, а затем и себя самого прямо в тронном зале. Со смертью верховного короля, его семьи, угасанием нескольких важнейших благородных домов Шевалье и разорением большинства остальных, всякие законность и порядок в королевстве рухнули. Последовавшая анархия оставила всю власть в руках мелких лордов и городских лидеров, которые быстро начали воевать друг с другом из-за старых долгов или в попытках воссоединить Шевалье.\n\nВ конце концов из этого хаоса возникло пять королевств, хотя десятки других все ещё заявляли о своей независимости, и вели войну между собой на протяжении последних двадцати лет Анархии. Короли из семей Монтегон, Валадек, Иллурдиан, Ден ва Понтаже и Ден ва Сеньон ещё сильнее истязали землю этой войной, а [Concept('antimagic_orders','антимагические ордена')|E] регулярно примыкали к тем, кто предлагал больше денег, выступая в роли наемников. Война между Пятеркой в итоге вылилась в [Concept('red_river_war','Войну Красной реки')|E], финальный конфликт, который был прерван вторжением [Concept('arch_lich','архилича')|E] [Concept('silas_stavro','Силаса Ставро')|E].\n\nСтавро продвинулся дальше, чем почти любой другой [Concept('liches','лич')|E], и достиг внутренних районов [Concept('peti_gisredde','Пети-Гисредда')|E]. Его смог остановить только [Concept('champion_of_chevalie','защитник Шевалье')|E], который объединил антимагические ордена и претендующие на власть королевства, а затем пожертвовал собой, чтобы сразить лича в поединке один на один во дворец Гисредда."
  
  game_concept_red_river_war:0 "Война Красной реки"
  game_concept_red_river_war_desc:0 "Война Красной реки была завершающим конфликтом [Concept('anarchy_of_the_five_crowns','Анархии пяти корон')|E] между семьями Монтегон, Валадек, Иллурдиан, Ден ва Понтаже и Ден ва Сеньон. Начавшись с нападения Монтегонов на замок Мон-Граз в землях Иллурдианов, три других королевства вскоре воспользовались этим конфликтом для начала собственных вторжений, в чем им помогали наемные [Concept('antimagic_orders','антимагические ордена')|E], которые давно отбросили предлоги борьбы с [Concept('liches','личами')|E] и [Concept('magi','магами')|E], чтобы работать в качестве наемных мечей на соперничающих военачальников.\n\nХотя война продолжалась несколько лет до вторжения с севера, в учебниках истории она чаще всего подробно описывается в связи с нашествием [Concept('arch_lich','arch_lich')|E] [Concept('silas_stavro','Силаса Ставро')|E], который оказался, возможно, самым хитрым личом, с которым когда-либо сражались [Concept('marchers','марочники')|E]. Благодаря стратегии, интригам и способности держать подвластных ему личей в полном подчинении, личи вскоре сокрушили Марки и вторглись в последний свободный марочникский город — [Concept('peti_gisredde','Пети-Гисредд')|E].\n\nПока Силас предавал Марки огню, [Concept('champion_of_chevalie','защитник Шевалье')|E], казалось, восстал из пепла. Его происхождение, имя и даже пол с тех пор были утеряны для истории, но известно, что он предпринял великий поход, чтобы объединить разразненные антимагические ордена и военачальников против личей. Взяв под командование [Concept('antimagi','антимагов')|E] и объединив их впервые в истории, а вскоре после этого убедив различных оставшихся королей согласиться на мир, Защитник затем повел объединенную марочникскую армию на отпор вторжению в Пети-Гисредд. Внутри пылающего города они сошлись в дуэли с Силасом Ставро, и Защитник пожертвовал собой, чтобы сразить лича, тем самым положив конец Войне Красной реки и Анархии пяти корон."
  
  game_concept_war_of_the_heretic_princes:0 "Война принцев-еретиков"
  game_concept_war_of_the_heretic_princes_desc:0 "Война принцев-еретиков (или Ереси) представляла собой мощную волну еретической мысли в [Concept('chevalie','Шевалье')|E], которая едва не положила конец почти тысячелетию непрерывного поклонения [Concept('lifepath','«Жизненному пути»')|E].\n\nЭти войны стали результатом долгой истории [Concept('clerical_control_of_chevalie','клерикального контроля над Шевалье')|E], который достиг апогея в 999 году от И.С., когда проповедник Урсо Бекледьевр провозгласил несколько «аккомпанементов» к толкованию Жизненного пути и начал призывать к радикальным изменениям в основной мысли. В то время как церковные солдаты изначально пытались его арестовать, воины герцога Совессаня защитили Урсо, а затем герцог Мишель Фринк использовал этот новый религиозный конфликт, чтобы объявить себя свободным от Конклава Раокура и своих обязанностей перед церковью, вернув себе Расчётливость и заключив в тюрьму любого путеводного отца, который отказывался передать ему полный контроль над церковными землями и функциями.\n\nЭто событие получило широкую огласку по всей Шевалье, и новые верования, создаваемые воодушевленными проповедниками, стали появляться едва ли не каждый месяц. Светские военачальники поспешили использовать эти новые культы для укрепления своей власти, и ситуация ухудшалась так стремительно, что именно ей приписывают крах Дейвидианского Верховного королевства вскоре после его воссоединения.\n\nХотя Конклав реагировал медленно и с трудом пытался нащупать почву под ногами после столь мощного вызова, он наконец начал настоящий ответ в 1011 году от И.С. с созыва Совета Экс и объявления Бекледьевра и любых других бродячих проповедников архиеретиками, а также официального провозглашения того, что попытка нарушить Путь прохождения карается смертью. Это положило начало почти сорока годам религиозных войн по всей Шевалье, которые в итоге завершились подписанием Соглашения Раокура, по которому различные религиозные лидеры были либо казнены, сосланы, либо возвращены в лоно церкви, а светские военачальники вновь поклялись в верности ортодоксии Жизненного пути. Однако, несмотря на победу Конклава, долгой истории клерикального контроля над Шевалье был фактически положен конец."
  
  game_concept_war_of_the_noose:0 "Война виселицы"
  game_concept_war_of_the_noose_desc:0 "Война виселицы была недолговечным периньянским восстанием последователей ереси «Марш святых» во время [Concept('war_of_the_heretic_princes','Войны принцев-еретиков')|E]. Хотя сторонники Марша святых нашли множество союзников среди знати, использовавшей этот культ для укрепления собственной власти, они стремительно потеряли контроль после того, как речь основателя движения Вильдермутта ден ва Сейсёнса в Сиверле побудила приверженцев разграбить кварталы [Concept('magi','магов')|E] и напасть на чужеземцев по всей [Concept('chevalie','Шевалье')|E]. Когда несколько ноблей из Ви попытались защитить своих подданных, ярость сторонников Марша святых обратилась уже против самого дворянства.\n\nПосле нескольких месяцев открытой войны выяснилось, что Вильдермутт лгал о том, что является последователем [GetTrait('way_of_nullification_follower').GetName( GetNullCharacter )] (оказавшись на самом деле сторонником [GetTrait('way_of_harvests_follower').GetName( GetNullCharacter )]), и был побит камнями до смерти своими же собственными последователями, а само движение вскоре развалилось из-за внутренних распрей и взаимного недоверия."
  
  #CHARACTERS
  
  game_concept_the_champion:0 "Защитник"
  game_concept_champion_of_chevalie:0 "Защитник Шевалье"
  game_concept_champion_of_chevalie_desc:0 "Защитник [Concept('chevalie','Шевалье')|E] — один из величайших героев в марочникских преданиях. Поднявшись на борьбу во время [Concept('red_river_war','Войны Красной реки')|E] в 938 году от И.С. против [Concept('arch_lich','архилича')|E] [Concept('silas_stavro','Силаса Ставро')|E], Защитник вскоре объединил как разрозненные и павшие [Concept('antimagic_orders','антимагические ордена')|E] (был ли сам Защитник [Concept('antimagi','антимагом')|E] — предмет жарких споров), так и враждующих королей, а затем двинулся на юго-запад вместе с братством других легендарных героев, чтобы снять осаду [Concept('peti_gisredde','Пети-Гисредда')|E] войсками [Concept('gh_general_undead','нежити')|E].\n\nХотя происхождение, имя, пол и прочие подробности о Защитнике отличаются в каждой сказке, в памяти осталось то, что он пожертвовал собой в поединке один на один против Ставро во дворец Гисредда, пока город полыхал в огне сражения. И хотя Защитник, как сообщается, пал в этой битве, архилич также был убит, что положило конец Войне Красной реки и [Concept('anarchy_of_the_five_crowns','Анархии пяти корон')|E].\n\nПосле смерти Защитник был провозглашен Святым пути Справедливости (хотя его настоящий Жизненный путь также был забыт, многие утверждали, что на самом деле он в совершенстве овладел каждым Путем), а антимагические ордена в память о нем объявили о своем нейтралитете в будущих марочникских делах."
  
  game_concept_chevaliens:0 "Шевальенцы"
  game_concept_chevalien:0 "Шевальенец"
  game_concept_marchers:0 "Марочники"
  game_concept_marcher:0 "Марочник"
  game_concept_marchers_desc:0 "Марочники — это население современного [Concept('chevalie','Шевалье')|E]. Не будучи коренными жителями [Concept('aversaria','Расколотого побережья')|E], хроники их современной истории начинаются лишь с их переселения в [Concept('chevalie','Марки')|E] и завоевания галликадеров, причем первоисточники были написаны спустя добрую сотню лет после этих событий или же восстановлены по тем немногим сохранившимся правительственным документам ойейниканцев той эпохи, что уцелели.\n\nХотя история марочников до их завоеваний по большей части скрыта густой завесой времени, известно, что фигура, известная как «Добрый король» Бастион (неизвестно, было ли Бастион его настоящим именем или результатом слияния фольклора с историей), вел их через Черные горы на востоке после долгого периода рабства в ныне погибшей империи. На протяжении следующего столетия его народ подчинил, уничтожил или ассимилировал коренных галликадеров, которые называли этот регион своим домом. Происходит ли современная марочникская культура целиком от этой группы или же стала результатом слияния с их прежними врагами — неизвестно. Кроме того, некоторые современные ученые (что часто вызывает споры) предполагают, что древние марочники имели немало поразительных сходств с восточными кланами, которые ныне зовутся сьялволками.\n\nШевальенцы известны как создатели современных [Concept('antimagic','антимагических')|E] искусств, без сомнения разработанных и доведенных до совершенства за тысячелетие конфликтов с личами севера и многовековых войн с аверсарианцами на востоке. Они также известны как исключительно проницательные дельцы: бедные марочники во многих наиболее разоренных войной частях Шевалье часто используют веру в Жизненные пути, чтобы изучать торговое дело и искать счастья за морем в качестве купцов или наемников. В самом Шевалье они известны своей общей неспособностью достичь прочного единства — редко какая династия удерживает титул Верховного короля дольше нескольких поколений, и им всегда приходится иметь дело с частыми восстаниями. В Шевалье верят, что только сильнейший должен занимать трон, ведь если им овладеет кто-то послабее, то как ему можно доверить королевство, которое находится под постоянной угрозой с севера? Из-за этого вызовы престолу случаются часто, и королевство редко переживает их в целости."
  
  game_concept_antimagi:0 "Антимаги"
  game_concept_antimagi_desc:0 "Антимаг — это собирательное понятие для любого воина, посвятившего себя борьбе как с практикующими [Concept('magic','магию')|E], так и с магическими тварями. [Concept('antimagic','Антимагия')|E] — чрезвычайно опасное и исключительно рискованное умение, из-за чего истинно преданные этому ремеслу воины встречаются редко и, как правило, живут недолго.\n\nЧаще всего антимагов можно встретить в [Concept('chevalie','Шевалье')|E], где антимагическое поле родины марочников помогает им в их предприятиях. Там десятки [Concept('antimagic_orders','антимагических орденов')|E] трудятся над совершенствованием своего мастерства и регулярно продают свои услуги за рубеж, когда не сражаются с [Concept('magi','магами')|E] на собственных землях."
  
  #ORGANIZATIONS
  
  game_concept_antimagic_order_noprefix:0 "Орден"
  game_concept_antimagic_orders:0 "Антимагические ордена"
  game_concept_antimagic_order:0 "Антимагический орден"
  game_concept_antimagic_orders_desc:0 "Антимагические ордена — это общее название для различных рыцарских орденов [Concept('chevalie','Шевалье')|E], посвятивших себя [Concept('antimagic','антимагическим')|E] искусствам. [Concept('antimagi','Антимаг')|E], состоящий в любом из сотен исторических орденов, обычно считается одним из лучших воинов в мире, хотя вопрос о том, сколько в этом легенды, а сколько реальности, остается спорным.\n\nНесмотря на свою грозную репутацию, ордена (или братства, как их часто называют шевальенцы) сильно различаются по своей организации и дисциплине. В то время как многие из них представляют собой преданные делу воинские ордена, члены которых отдают искусству всю свою жизнь и заходят так далеко, что отрекаются от личной жизни ради лучшего оттачивания своего мастерства, другие являются слабо связанными почетными орденами, которые собираются лишь несколько раз в год, если вообще собираются.\n\nКак бы то ни было, антимагические ордена пользуются исключительным уважением в Шевалье и во всем остальном мире. Ордена обычно финансируют себя за счет пожертвований и любых земель, которыми они управляют напрямую, но в последнее время они находят огромные богатства в продаже своих услуг за рубежом, а сами антимаги считают наемническую работу отличной возможностью для тренировок."
  
  #LOCATIONS
  
  game_concept_chevalie:0 "Шевалье"
  game_concept_the_marches:0 "Марки"
  game_concept_chevalie_desc:0 "Шевалье — это обширное государство, расположенное между бывшей [Concept('aversaria','аверсарианской')|E] Калатипсоми на востоке (западная оконечность Черных гор очерчивает современную границу) и владениями личей на севере.\n\nБудучи родиной [Concept('marchers','марочников')|E] (или шевальенцев), оно славится своим широким охватом по всему миру благодаря огромной диаспоре купцов, наемников и авантюристов. Шевалье, являющееся родиной антимагических искусств, а также многочисленных политических и торговых инноваций, заслужило поговорку о том, что в любом порту мира можно изъясниться по-шевальенски, заключить сделку и украсть состояние.\n\nИсторию Шевалье принято делить на пять периодов, начиная с Эпохи переселений, которая последовала за прибытием современных марочников в этот регион, их войнами с галликадерами и ойейниканцами, и которую традиционно считают завершившейся кодификацией современных Жизненных путей, марочникской культуры и возвышением первого [Concept('arch_lich','архилича')|E], [Concept('vilas_venslau','Виласа Венслау')|E]. За ней следует Имперская эпоха, во время которой Верховное королевство расширилось и контролировало большую часть современной Калатипсоми вплоть до Серых врат на востоке, завершившаяся распадом империи шевальенцев на востоке и её завоеванием [Concept('aversaria','Аверсарией')|E]. Затем наступила Теократическая эпоха, когда Конклав Раокура и антимагические ордена начали оказывать колоссальное политическое влияние и контроль, регулярно вмешиваясь во внутренние дела местных военачальников, что закончилось [Concept('red_river_war','Войной Красной реки')|E]. И, наконец, Светская эпоха (или Эпоха ересей), в которую произошел раскол и реформация [Concept('lifepath','Жизненного пути')|E], а также зарождение современной феодальной системы, когда светские лорды взяли под свой контроль множество политических систем, ранее находившихся в руках духовенства.\n\nБольшую часть своей истории Шевалье провело в раздробленности, где мир был куда более редким явлением, чем война, — во многом благодаря уникальной культуре марочникского народа."
  
  #MISC
  
  game_concept_antimagic:0 "Антимагия"
  game_concept_antimagic_arts:0 "Антимагические искусства"
  game_concept_antimagic_desc:0 "Антимагия — это термин, используемый для обозначения любого метода ведения боя, предназначенного для прямого противодействия [Concept('magic','магическим')|E] тварям и практикующим магию. Современные стили этого искусства в основном происходят из [Concept('chevalie','Шевалье')|E], где леди Эгро «Разрушительница склепов» написала «Четырнадцать техник тишины» и положила начало современным [Concept('antimagic_orders','антимагическим орденам')|E]. В Шевалье её почитают как матерь антимагии.\n\nАнтимагию часто мифологизируют как своего рода самостоятельную магию, но это лишь популярное заблуждение. На самом деле антимагия — это боевое искусство, основанное на быстром выведении из строя и убийстве магов. Различные стили боя обычно строятся вокруг стремительного сближения с [Concept('magi','магом')|E] на ближнюю дистанцию, техник быстрого обезвреживания рук мага или его ликвидации, если это возможно, а также умения передвигаться по полю боя тихо или незаметно, чтобы избежать обнаружения. Также широко распространена меткая стрельба: многие [Concept('antimagi','антимаги')|E] пытаются убить магов с достаточно далекого расстояния, чтобы остаться незамеченными. Более современные приверженцы часто используют недавние алхимические изобретения, такие как «Громовые бутыли» для оглушения магов чрезвычайно яркими и громкими вспышками и «Дымовухи» для прикрытия своего продвижения. Реже, но всё с большей частотой, находят применение одноручные арбалеты и фокусирующие зеркала (для ослепления противников)."
 
  game_concept_antimagic_terrain:0 "Антимагическая местность"
  game_concept_antimagic_terrain_basic:0 "Антимагия"
  game_concept_antimagic_terrain_desc:0 "Будучи аномалией на [Concept('aeras','Аэрасе')|E], антимагическая местность является проклятием для магии во всех её проявлениях. От ужасных заклинаний, сотворенных [Concept('magi','магами')|E], до чар, окутывающих внушающие благоговение артефакты, — всё иссушается, словно затянутое в водоворот или воронку, уходящую глубоко вниз, и впитывается в саму почву. Те, кто наделен способностью видеть подобные энергии, порой утверждают, что украденные таким образом силы на самом деле не уничтожаются, а будто бы пропитывают саму землю, увлекаемые невидимым течением к какому-то неведомому месту.\n\nХотя жизнь в условиях антимагической местности и доставляет магам немало трудностей, её воздействие не является абслютным. Те, кто достаточно искусен в магических искусствах, способны отчасти компенсировать этот эффект, чрезмерно усиливая свои заклинания, чтобы они всё же возымели действие, хотя результаты никогда не будут такими, какими могли бы быть в любом другом месте. К примеру, маг, призвавший могучую огненную бурю, чтобы поглотить целую армию, обнаружит, что его усилия привели лишь к мощному, но крайне локальному столбу пламени, испепелившему всего нескольких несчастных солдат. Точно так же [Concept('liches','лич')|E], способный управлять легионом нежити, обнаружит, что любой полк, на котором он не концентрируется напрямую, начинает рассыпаться или действовать независимо от его воли. Самый известный случай: вторжение лича Вилитаса Висслива в [Concept('chevalie','Шевалье')|E] в 1001 году от И.С. захлебнулось без какого-либо внешнего вмешательства после того, как он продвинулся всего на несколько миль вглубь границ Верховного королевства. Записано, что во время его мегаломанской проповеди его слуги-мертвецы внезапно массово обратились против него самого, и силы вторжения были полностью уничтожены в последовавшей анархичной схватке.\n\nК счастью для великих и сильных мира Аэраса, антимагическая местность встречается редко и преобладает лишь в одном конкретном регионе — Шевалье. Если и существуют другие крупные территории под воздействием подобного эффекта, ученым мира они пока не известны."
 
  game_concept_fraternity_of_chevalie:0 "Братство Шевалье"
  game_concept_fraternity_of_chevalie_desc:0 "«Братство [Concept('chevalie','Шевалье')|E]» — это укоренившееся понятие, обозначающее марочникскую концепцию солидарности между шевальенцами. Часто используемое чужеземцами как оскорбление в адрес марочникского двуличия, но воспринимаемое самими [Concept('marchers','марочниками')|E] как предмет огромной гордости, это понятие получило широкую известность в IX веке благодаря поэту Абаэлю Венодау, чьи одиннадцать знаменитых поэм заложили первые подлинные основы марочникского единства в литературной традиции.\n\nСама концепция заключается в убеждении, что в делах с чужеземцами другие шевальенцы всегда должны стоять на первом месте. Несмотря ни на что, если иноземец намерен причинить вред Шевалье или его народу, долг шевальенца — остановить его. Нагляднее всего это проявляется в постоянном распаде и воссоединении региона: марочники с радостью сражаются друг с другом до тех пор, пока не возникнет внешняя угроза, а затем неизменно быстро объединяются, пока опасность не минует и они не смогут снова со спокойной душой вернуться к истреблению друг друга."
 
  game_concept_BITNOAWFAWMBTGORBAAPAHBGSAS:0 "БВОИВПОВПМБРБИВСИПРБЗЗИЗ"
  game_concept_BITNOAWFAWMBTGORBAAPAHBGSAS_desc:0 "БЛАГОСЛОВЕННО ВО ИМЯ ВСЕХ ПУТЕВЫХ ОТЦОВ И ПУТЕВЫХ МАТЕРЕЙ ПО БЛАГОДАТИ РАНОСА, БАСТИОНА И ВСЕХ ПУТЕЙ, И ПРОВОЗГЛАШЕННОЕ ПОД БЛАГИМИ ЗВЕЗДАМИ И ЗНАМЕНИЯМИ"

  game_concept_EITNTKFAO_BTWPAIF:0 "УВИКСиП - ТБМиНБ"
  game_concept_EITNTKFAO_BTWPAIF_desc:0 "УЧРЕЖДЕНО ВО ИМЯ КОРОЛЕВСКОЙ СПРАВЕДЛИВОСТИ И ПОРЯДКА — ТРИЖДЫ БЛАГОСЛОВЛЕНО МОЛИТВОЙ И НЕЗЫБЛЕМЫМ БРАТСТВОМ"
  
