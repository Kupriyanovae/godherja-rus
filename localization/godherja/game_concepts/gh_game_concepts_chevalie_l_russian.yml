  game_concept_sweverg_irssraedl:0 "Свеверг-Ирссрэдл"
  game_concept_sweverg_irssraedl_desc:0 "Свеверг-Ирссрэдл — древнее святилище галликадеров, основанное, по всей видимости, за несколько веков до переселения марочников в [Concept('chevalie','Шевалье')|E] в первом веке. Местные жрецы, вероятно, видели в древних причалах из черного камня (чьи создатели неизвестны) остатки обители богов, совершали великие жертвоприношения и гадания у возведенных на их краях алтарей, толкуя знамения звезд по их отражениям в морской воде.\n\n[Concept('inian_wisestar','Иниан Мудрый')|E] разрушил эти алтари in 79 году от И.С. после своего завоевания Запада. Попытки сопротивления привели к массовой резне верных галликадеров, а марочники вытеснили их с побережья. На этом месте было основано поселение Инианвилла, хотя это название едва ли продержалось десятилетие, прежде чем его сменило искаженное галликадерское имя — Свергирсред. Со временем Свергирсред разросся и превратился в [Concept('peti_gisredde','Пети-Гисредд')|E], чье название, в зависимости от рассказчика, либо постепенно искажалось, либо было дано в честь [Concept('jan_va_gisredde','Яна ва Гисредда')|E]."


  
  game_concept_grande_gisreddeans:0 "Гранд-Гисреддцы"
  game_concept_grande_gisreddean:0 "Гранд-Гисреддец"
  game_concept_barrotgeis:0 "Барротгейс"
  game_concept_grande_gisredde:0 "Гранд-Гисредд"
  game_concept_peti_gisredde_possessive:0 "Пети-Гисредда"
 
  game_concept_grande_gisredde_desc:0 "Гранд-Гисредд, изначально носивший название Барротгейс, — город-побратим [Concept('peti_gisredde','Пети-Гисредда')|E]. Несмотря на то, что исторически он был куда менее процветающим и примечательным для сторонних наблюдателей, гранд-Гисреддцы заявляют о превосходстве своего города, указывая на многовековые традиции и такие значимые достижения, как установление монархии всего через несколько десятилетий после political краха, а также его храброе трехдневное сопротивление [Concept('liches','личу')|E] [Concept('silas_stavro','Силасу Ставро')|E] перед разграблением.\n\nБарротгейс начинался всего лишь как несколько слабо связанных между собой деревень к югу от процветавшего тогда Пети-Гисредда, и его первоначальное название постепенно забылось по мере того, как он рос, становясь вторым по значимости городом в государстве. Он в равной степени извлек выгоду из [Concept('gisreddepact','Гисреддского пакта')|E], и [Concept('council_of_gisredde','Совет Гисредда')|E] правил в качестве двух со-советов над обоими городами. Однако они стали соперниками после того, как Пети-Гисредд принял тысячи беженцев, спасавшихся от [Concept('sorrowing_of_oejeynica','Скорби Ойейники')|E], вопреки противодействию традиционно консервативных гранд-Гисреддцев.\n\nВпрочем, в [Concept('champion_of_chevalie','эпоху Защитника')|E] завоевание обоих городов привело к [Concept('coup_of_the_wayfathers','Перевороту путеводных отцов')|E]. Это положило начало периоду политического хаоса на протяжении всей [Concept('anarchy_of_the_five_crowns','Анархии пяти корон')|E], который завершился лишь разграблением города Силасом Ставро (событие, которое здесь оплакивают ежегодно, а в Пети-Гисредде празднуют «пародийным» шествием) и установлением герцогской монархии, под властью которой город с тех пор неуверенно продвигается вперед в тени Пети-Гисредда."
 
  game_concept_peti_gisreddeans:0 "Пети-Гисреддцы"
  game_concept_peti_gisreddean:0 "Пети-Гисреддец"
  game_concept_svergirssred:0 "Свергирсред"
  game_concept_girssred:0 "Гирссред"
  game_concept_inianvilla:0 "Инианвилла"
  game_concept_peti_gisredde:0 "Пети-Гисредд"
 
  game_concept_peti_gisreddean_possessive:0 "$peti_gisreddean_possessive$"
  peti_gisreddean_possessive:0 "Пети-Гисреддский"
  game_concept_peti_gisredde_desc:0 "Пети-Гисредд — это название как самого города в западном [Concept('chevalie','Шевалье')|E], так и его правящего государства, контролирующего как город, так и сельскую местность. Возникнув на месте галликадерского святилища [Concept('sweverg_irssraedl','Свеверг-Ирссрэдл')|E], он был основан как Инианвилла после завоевания [Concept('inian_wisestar','Инианом Мудрым')|E]. Со временем он превратился в главный порт Шевалье и, возможно, стал самым успешным городом на всем [Concept('the_continent','континенте')|E]. Построенные на руинах, предшествовавших известной цивилизации, массивные причалы из черного камня помогли Пети-Гисредду утвердиться в качестве морской торговой державы.\n\nИстория Гисредда традиционно делится на три отдельные эпохи. Первое поселение галликадеров, завоевание Иниана Мудрого, неудачи [Concept('mical_wisestar','Микала Мудрого')|E], аннексия [Concept('grande_gisredde','Барротгейса')|E], а также [Concept('shoemaker_rebellion','Восстание сапожников')|E] и заключение [Concept('gisreddepact','Гисреддского пакта')|E] в 239 году от И.С. — всё это относится к периоду [Concept('prepact_gisredde','Допактного Гисредда')|E].\n\nПоследующий [Concept('precollapse_gisredde','Доколлапсный Гисредд')|E] положил начало соперничеству между Пети-Гисреддом и [Concept('grande_gisredde','Гранд-Гисреддом')|E], а также зарождению [Concept('fraternity_of_gisredde','Братства Гисредда')|E]. [Concept('anarchy_of_the_five_crowns','Анархия пяти корон')|E] принесла с собой [Concept('champion_era_gisredde','Гисредде эпохи Защитника')|E], которая длилась вплоть до самопожертвования Защитника Шевалье на крыше дворца Гисредда. Помимо войны против [Concept('silas_stavro','Силаса Ставро')|E], наиболее примечательным событием той эпохи стали [Concept('coup_of_the_wayfathers','Переворот путеводных отцов')|E] и обретение Гранд-Гисреддом независимости.\n\nВсё ещё продолжается [Concept('glorious_gisredde','Славное Гисредде')|E] — эпоха, в которую город процветает, что закрепило за Пети-Гисреддом статус мировой державы, а за Гранд-Гисреддом — статус города с относительно стабильным правительством. Несмотря на трудности во времена [Concept('war_of_the_heretic_princes','Войны принцев-еретиков')|E], город продолжал расти, особенно благодаря развитию [Concept('gisreddean_banking_system','Гисреддской банковской системы')|E]."
  
