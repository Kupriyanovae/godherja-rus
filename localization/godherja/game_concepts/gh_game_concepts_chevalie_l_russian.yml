  game_concept_gisreddepact:0 "Гисреддский пакт"
  game_concept_gisreddepact_desc:0 "Гисреддский пакт — юридическая основа независимости Гисредда, определяющая его отношения с [Concept('chevalie','Шевалье')|E] со времен [Concept('shoemaker_rebellion','Восстания сапожников')|E] 239 года от И.С. Подписание пакта стало поворотным моментом в истории Гисредда, завершив эпоху [Concept('prepact_gisredde','Допактного Гисредда')|E] и положив начало эпохе [Concept('precollapse_gisredde','Доколлапсного Гисредда')|E].\n\nПосле поражения Верховного короля Алоизия в Восстании сапожников угроза королевского возмездия вынудила [Concept('council_of_gisredde','Совет Гисредда')|E] пойти на уступки в обмен на независимость. Не испытывая особого желания вести кровопролитную и затяжную войну ради одного лишь престижа, стороны придали Гисреддскому пакту силу закона. Пакт провозглашает себя единственным законным авторитетом в отношениях между городом и Шевалье, а любые изменения в него могут быть внесены лишь по единогласному (и добровольному) согласию между Советом и Верховным королем Шевалье. Никто и никогда этого так и не сделал.\n\nГарантируя городу самоуправление и запрет на размещение любых иностранных солдат, пакт обязывает Гисредд выплачивать «надлежащую десятину» Верховному королю и признавать его своим формальным сюзереном, а также предоставляет Верховному королю постоянное место в Совете (в ответ на что Совет немедленно расширил свой состав с 25 до 150 членов). Несмотря на авторитет пакта, многие военачальники нарушали его, указывая на то, что Гисреддский пакт — это лишь соглашение с зачастую несуществующим Верховным королевством. С другой стороны, пакт также служит законным основанием для восстаний против иноземных правителей, благодаря чему [Concept('peti_gisredde','Пети-Гисредд')|E] (технически) сохраняет независимость с самого момента своего основания."
 
  game_concept_gisreddean_banking_system:0 "Гисреддская банковская система"
  game_concept_gisreddean_banking_system_desc:0 "Гисреддская банковская система — сеть кредитных, меняльных и банковских институтов, возникших в [Concept('peti_gisredde','Пети-Гисредде')|E] преимущественно в эпоху [Concept('glorious_gisredde','Славного Гисредда')|E].\n\nХотя банковское дело широко распространено на [Concept('aeras','Аэрасе')|E], новые законы [Concept('council_of_gisredde','Совета Гисредда')|E], упорядочившие денежное обращение Пети-Гисредда, а также указ об аннулировании всех мелких займов местных граждан в 1067 году от И.С. привели к краху прежней разрозненной банковской системы и ее немедленному перерождению в гораздо более мощный институт. Множество мелких, полукриминальных банков прекратились свое существование в одночасье, уступив место куда более сильной сети ведомых купцами могущественных полукриминальных банков, которые и породили современную коммерцию. Поддерживаемые колоссальным торговым потоком, проходящим через город, местные банковские палаты начали открывать филиалы в каждом торговом порту, где имелся гисреддский квартал (в основном на [Concept('the_continent','континенте')|E]), а официальное оформление банковских гильдий позволило городу эффективно облагать их налогами.\n\nБанки Пети-Гисредда во многом совершили революцию в финансовых институтах Континента и оказали огромное влияние на коммерцию вплоть до Каширии. Попытки [Concept('aversaria','аверсарианцев')|E] и [Concept('sarradon','саррадонцев')|E] скопировать гисреддские банки — такие как «Святой банк Пути Монеты» или «Доброе и честное заведение ничтожных процентных займов доброго сира Раноса» — оказались успешными, но ни один из них и близко не подобрался к баснословно богатым гисреддским палатам. С тех пор many правители по всему континенту пользовались их покровительством, особенно аверсарианский аутократор, который на протяжении большей части своей истории после десятого века находился на грани банкротства. Несмотря на это, самым известным получателем городских займов остается [Concept('grande_gisredde','Гранд-Гисредд')|E] — город держится на плаву исключительно за счет постоянного потока ссуд, к вящему недовольству пети-гисреддцев по всему миру."
 
  game_concept_fraternity_of_gisredde:0 "Братство Гисредда"
  game_concept_fraternity_of_gisredde_desc:0 "Братство Гисредда, подобно более известному [Concept('fraternity_of_chevalie','Братству Шевалье')|E], является краеугольным камнем местной культуры, во многом определяющим уклад жизни в [Concept('peti_gisredde','Пети-Гисредде')|E] и [Concept('grande_gisredde','Гранд-Гисредде')|E]. Зародившись как концепция одновременно с Братством Шевалье после того, как последнее было впервые воспето поэтом IX века Абаэлем Венодо, Братство Гисредда стало куда более популярным на гисреддских землях, нежели его «родственное» понятие.\n\nБратство Гисредда во многом копирует Братство Шевалье, однако ставит Пети-Гисредд (и отчасти его соперника и город-побратим Гранд-Гисредд) во главу угла как важнейший источник единства и товарищества для гисреддцев. Не вступая в прямое противоречие с Братством Шевалье, местная версия гласит, что первейший долг граждан Гисредда — это служить интересам друг друга, а не иноземцев. Несмотря на суровые реалии города, где гильдии убийц считаются вполне законными кандидатами на политические посты, эта идея твердо укоренилась, и большинство знает гисреддцев за их невероятные внутренние распри (особенно между Пети и Гранд-Гисреддом) — ровно до тех пор, пока в дело не вмешается чужак.\n\nВопреки ожиданиям сторонних наблюдателей, и пети-, и гранд-гисреддцы включают друг друга в это правило, в чем лично убедился не один удивленный иноземец, попытавшийся присоединиться к привычной местной забаве «Пни пети- или гранд-гисреддца» (в зависимости от того, где происходит дело).\n\nПо мере того как росло могущество Пети-Гисредда (а Гранд-Гисредд продолжал выживать), благодаря расцвету [Concept('gisreddean_banking_system','Гисреддской банковской системы')|E] данная концепция привлекла к себе внимание многих чужестранцев. А именно тех, кого до нитки обирали союзы гисреддских преступников и купцов, — ведь грань между первыми и вторыми в Гисредде размыта сильнее, чем где-либо ещё."
 
  game_concept_oejeynican_royal_charter:0 "Ойейниканская королевская хартия 764 года от И.С."
  game_concept_oejeynican_royal_charter_desc:0 "После [Concept('sorrowing_of_oejeynica','Скорби Ойейники')|E] большинство прежних обитателей земель, ныне именуемых [Concept('the_lichdoms','Владениями личей')|E], были вынуждены влачить жалкое существование в тесных трущобах [Concept('marchers','Шевалье')|E]. Отвергнутые и превращенные своими новыми соседями в козлов отпущения, они регулярно становились жертвами погромов, массовых убийств и принудительных изгнаний, особенно во время частых нашествий [Concept('liches','личей')|E] на Марки. Это безотрадное положение дел сохранялось вплоть до правления Верховной королевы Арелли, которая в 764 году от И.С. подписала Ойейниканскую королевскую хартию.\n\nСогласно этой хартии, Верховная королева назначает великого герцога, который должен править ойейниканцами и представлять их интересы под ее началом. Верховная королева Арелли также выделила ойейниканцам обширный участок земли в северном Роре, ставший их новой родиной, взамен обязав их защищать часть северной границы от ее имени. С тех пор ойейниканцы удостоились сомнительной чести первыми преклонять колени при коронации каждого нового Верховного короля, что служит одновременно знаком престижа и покорности. Тем не менее они заслужили неохотное уважение со стороны [Concept('marchers','марочников')|E], поскольку обычно именно они принимают на себя первый удар любого натиска с севера, из-за чего их считают такими же полноправными жителями Шевалье, как и большинство [Concept('grande_gisredde','гранд-гисреддцев')|E]."
 
  game_concept_conclave_of_gisredde_concept:0 "Конклав Гисредда"
  game_concept_conclave_of_gisredde_concept_desc:0 "Конклав Гисредда лучше всего охарактеризовать как «анти-Конклав» по отношению к Конклаву Раокура. Поскольку [Concept('peti_gisredde','Пети-Гисредд')|E] исторически противился любому внешнему вмешательству, следовало ожидать, что местные жители неизбежно начнут оспаривать (зачастую весьма бурно) влияние «иноземных» церквей — даже если те принадлежат к той же вере, находятся в том же королевстве и разделяют ту же культуру.\n\nВпервые провозглашенный в 389 году от И.С. во время Понтгонезского спора, Конклав то терял свою актуальность, то внезапно заявлял о себе каждые несколько десятилетий. Как правило, это совпадало с попытками Конклава Раокура навязать хоть какую-то ортодоксию вечно своенравным гисреддцам, а сам «раскол» прекращался лишь тогда, когда местным святым пути предоставляли существенное снижение налогов."