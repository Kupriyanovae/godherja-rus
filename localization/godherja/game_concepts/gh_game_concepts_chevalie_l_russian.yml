  game_concept_clerical_control_of_chevalie:0 "Клерикальный контроль над Шевалье"
  game_concept_clerical_control_of_chevalie_desc:0 "На протяжении большей части [Concept('marchers','марочникской')|E] истории духовенство обладало равной или даже большей властью, чем светские лорды. Начиная с 234 года от И.С., вскоре после воцарения первого Верховного короля, следовавшего Жизненному пути, новообразованный Конклав Раокура стал оказывать колоссальное влияние на правителей и верующих посредством новой веры. Наиболее прямой формой манипуляции выступала концепция «Расчётливости» (решающая, кто именно в королевстве имеет право указывать приверженцу, какому [Concept('lifepath','Жизненному пути')|E] ему следовать). Светские лорды были кровно заинтересованы в том, чтобы либо самим определять Путь своих подданных, либо вовсе лишить кого-либо возможности предписывать его, в то время как духовенство желало оставить это право за собой, дабы контролировать как лордов, так и простолюдин.\n\nЗатяжные конфликты вокруг этой концепции и другие столкновения интересов фактически завершились подписанием Тейслосского конкордата в 821 году от И.С., соглашения тогдашних королей Шевалье о том, что абсолютная Расчётливость принадлежит духовенству. Это (наряду с зарождением северных бюрократических систем) привело к усилению кодификации прав духовенства на контроль над шевальенск обществом, причем священнослужители зачастую заходили так далеко, что использовали свою власть для замены знатных лордов на избранных ими преемников.\n\nПротивостояние между духовенством и светскими лордами становилось всё более частым явлением, достигнув своего апогея во время [Concept('anarchy_of_the_five_crowns','Анархии пяти корон')|E] in 878 году от И.С., наряду с [Concept('the_brutality','«Жестокостью»')|E]. Поскольку духовенство раскололось по светским границам и поддерживало разных королей, а [Concept('antimagic_orders','антимагические ордена')|E] служили наемниками у тех, кто больше заплатит, доверие к светским функциям церкви стремительно рухнуло.\n\nПосле [Concept('red_river_war','Войны Красной реки')|E], во имя чести [Concept('champion_of_chevalie','Защитника Шевалье')|E], различные антимагические ордена присягнули на верность «Ритуалам неповиновения», которые провозглашали, что ордена больше не будут вмешиваться во внутренние дела Шевалье. Аналогичные «Ордена разделения» формально вывели антимагические ордена из-под юрисдикции Конклава Раокура. Лишившись своего военизированного крыла, ставшего независимым, и не пользуясь доброй волей как среди знати, так и среди крестьянства, Конклав и духовенство в целом отчаянно пытались удержать контроль над своей паствой.\n\nКонец влиянию Конклава пришел с [Concept('war_of_the_heretic_princes','Войной принцев-еретиков')|E], в ходе которой из-за оппортунизма светских лордов он потерял большую часть своих церковных земель и после этого уже никогда не приближался к тому уровню контроля, который когда-то имел над [Concept('chevalie','Шевалье')|E]. Следующий Верховный король, воссоединивший Шевалье после этих событий, Югон ден ва Адкурт-Ведрон, прославился тем, что потребовал от собравшихся святых пути пасть ниц и просить права короновать его — это был спорный, но ясный знак того, что роль духовенства официально стала вторичной по отношению к потомственной знати."
 
  game_concept_lifepath:0 "Жизненный путь"
  game_concept_lifepath_desc:0 "Жизненный путь — это религиозная система, традиционно приписываемая [Concept('marchers','марочникам')|E] из [Concept('chevalie','Шевалье')|E]. Неизвестно, происходит ли она от единой системы верований или же является простым результатом кодификации древней марочникской культуры; этот вопрос и по сей день яростно обсуждается в ученой среде шевальенцев.\n\nПриверженцы Жизненного пути верят, что истинного бога не существует, но, совершенствуясь в выбранной жизненной роли, человек может достичь духовного идеала и обрести святость. Согласно верованиям Жизненного пути, те, кто достиг совершенства на своем Пути, после смерти становятся Святыми пути и отныне будут вечно оберегать и направлять тех, кто идет по их стопам. С этой целью в большинстве святых мест можно встретить святых пути каждого из основных Путей, которые служат своего рода наставниками для верующих, помогая направлять их по избранному Пути.\n\nВ истории марочников было зафиксировано несколько десятков Путей, хотя большинство из них просуществовали недолго из-за нехватки святых пути и последователей. Однако семь из восьми ныне признанных Путей практикуются уже сотни лет. Исключением является лишь Путь Очищения — искусство [Concept('antimagic','антимагии')|E]."
  
  ##ARTIFACTS
  
  game_concept_piece_of_the_broken_crown_concept_desc:0 "[Concept('chevalie','Шевалье')|E] за свою историю многократно объединялось и распадалось, зачастую с интервалом в десятки лет, а потому идея притязаний на Верховное королевство является одновременно и распространенной, и туманно определенной. Любой персонаж с модификатором «$claimant_to_the_high_kingdom$» получает бесплатный [Concept('casus_belli','повод для войны')|E] на завоевание против любых других обладателей претензий. Модификатор «$claimant_to_the_high_kingdom$» можно получить с помощью решения «Выдвинуть притязания на Шевалье», которое за определенную цену может принять любой независимый [Concept('marchers','марочник')|E], находящийся в пределах Шевалье.\n\nЕсли титул Верховного королевства уничтожен, марочникские правители могут принять решение «Воссоединить Шевалье» (при наличии модификатора «$claimant_to_the_high_kingdom$»), чтобы вернуть себе Верховное королевство, если они полностью контролируют одно из пяти главных королевств в Шевалье и либо владеют всеми титулами, либо гарантировали, что ни один другой правитель ими не владеет. Однако этот период продлится всего тридцать лет, после чего все претензии аннулируются, и Шевалье придется объединять вручную."
  game_concept_piece_of_the_broken_crown_concept:0 "Претензия на Верховное королевство"
  
