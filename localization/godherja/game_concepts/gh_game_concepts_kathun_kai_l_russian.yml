 game_concept_bureau_bronzeport:90 "Небом ниспосланное полуавтономное бюро Бронзовой гавани"
 game_concept_bronzeport:0 "Бронзовая гавань"
 game_concept_bureau_bronzeport_desc:0 "Учреждённое в начале X века во время правления [Concept('kathuni_dragon_mythology','Драконьего императора')|E] Цзе Яон-цзи Тэна, Небом ниспосланное полуавтономное бюро Бронзовой гавани (сокращённо «Бронзовая гавань», но не путать с крепостью, в которой оно располагается и которая носит то же название) представляет собой государственный орган, ответственный за управление экономическими интересами империи Катун-Кай в Дахангоне. Бюро, обычно возглавляемое верховным министром Бронзовой гавани, наделено задачами по контролю за введением и сбором тарифов, содержанием и эксплуатацией портов и их укреплений, а также крайне важным производством и транспортировкой бронзы и [Concept('zhaen','чжэня')|E].\n\nБюро долгое время враждовало с Протекторатом Южных земель, который на бумаге официально является главным колониальным органом катунской власти в южных регионах Наньмай Бон и Дахангон. Бронзовая гавань успешно отразила несколько попыток сменявших друг друга губернаторов Южных земель наложить на неё налоги, в то время как Протекторат часто утверждал, что это ведомство погрязло в коррупции. В конечном счёте это привело к так называемому Яри-медянскому делу, в результате которого Бюро получило полуавтономный статус и стало подчиняться исключительно Драконьему императору. Однако на фоне слухов о падении [Concept('loen_chaeon','Лоэн-Чэона')|E] в преддверии [Concept('frodbrokna','Фродброкны')|E] эти взаимоотношения вскоре ухудшились и превратились в чистую формальность."
 
