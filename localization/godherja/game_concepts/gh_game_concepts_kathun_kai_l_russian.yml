 game_concept_bureau_bronzeport: "Небом ниспосланное полуавтономное бюро Бронзовой гавани"
 game_concept_bronzeport: "Бронзовая гавань"
 game_concept_bureau_bronzeport_desc: "Учрежденное в начале X века во время правления [Concept('kathuni_dragon_mythology','Драконьего императора')|E] Цзе Яон-цзи Тэна, Небом ниспосланное полуавтономное бюро Бронзовой гавани (сокращенно «Бронзовая гавань», но не путать с крепостью, в которой оно располагается и которая носит то же название) представляет собой государственный орган, ответственный за управление торговыми делами империи Катун-Кай в Дахангоне. Бюро, обычно возглавляемое верховным министром Бронзовой гавани, наделено задачами по контролю за сбором пошлин, содержанием и охраной портов, а также крайне важным производством и доставкой бронзы и [Concept('zhaen','чжэня')|E].\n\nБюро долгое время враждовало с Протекторатом Южных земель, который на бумаге официально является главным наместничеством катунской власти в полуденных краях Наньмай Бон и Дахангон. Бронзовая гавань успешно отразила несколько попыток сменявших друг друга правителей Южных земель обложить ее налогами, в то время как Протекторат часто обвинял это ведомство во взяточничестве. В конечном счете это привело к так называемому Яри-медянскому делу, в результате которого Бюро получило особый статус и стало подчиняться исключительно Драконьему императору. Однако на фоне слухов о падении [Concept('loen_chaeon','Лоэн-Чэона')|E] в преддверии [Concept('frodbrokna','Фродброкны')|E] эти связи вскоре оспли и превратились в пустую формальность."
 
 #LOCATIONS
 
 game_concept_loen_chaeon: "Лоэн-Чэон"
 game_concept_loen_chaeon_desc: "Лоэн-Чэон, или «Город Дракона» по-катунски — столица, из которой правил каждый законный владыка Катун-Кая с момента зарождения этого государства при Драконьей императрице Яо Жэнь Цай. Несмотря на то, что от древнего Лоэн-Чэона мало что осталось в его современном обличии (даже его первоначальное название затерялось в истории), он являлся одним из крупнейших городов востока по меньшей мере за несколько тысяч лет до рождения Яо Жэнь Цай. Катунские книжники из-за его величия часто именовали его «величайшим из градов» или «городом, в котором покоится мир»; эти вести, однако, встречали недоверие со стороны [Concept('aversaria','аверсарианских')|E] учёных, до которых доходили подобные предания еще до их первых попыток совершить путешествие на восток. Когда [Concept('magi','маг')|E] и чертежник земель Эотос Айтакрос стал первым аверсарианцем, которому позволили не просто увидеть, но и войти в город, он незамедлительно написал в послании домой более тридцати страниц, полных изумления перед величием города, заявляя, что мифы ничуть не преувеличивали явь, а напротив, сильно ее преуменьшали.\n\nСам город раскинулся по всей территории острова Даогао и сосредоточен вокруг дремлющей [Concept('the_towers','Башни')|E], которая за века постепенно скрылась под массивным фасадом катунского зодчества. Изначально будучи крупным поселением возле башни, соединенным с небольшим портом, при последующих правителях город разросся и занял остров размером примерно с Императорский остров, удивляя поразительно великолепной архитектурой, бесконечным числом изваяний и фонтанов, а также более чем сотней садов и парков размером с иные города. Некоторые аверсарианцы подмечали, что, судя по описанию Айтакроса, большая часть города на самом деле была необитаема, а «сады» и «парки», занимавшие более половины острова, существовали просто из-за невозможности полностью заселить столь огромный город.\n\nКатунский закон карает за созерцание столицы — даже с моря или через проливы — смертью или ослеплением. Катунские купцы, идущие через торговые центры у притоков, впадающих в залив Жэнь Цай, обязаны либо завязывать себе глаза, либо оставаться в трюмах при проходе мимо города, а их корабли обычно ведут местные лоцманы из свиты императора за солидную плату. Суда, на которые это правило не распространяется, принадлежат к Императорскому священному торговому флоту; их капитаны и матросы лично рукоположены в сан жрецов слугами императора, что позволяет им проводить мимо города массивные баржи, затмевающие большинство военных кораблей. Однако, несмотря на все его величие и мифологизацию в катунской культуре, последние разрозненные вести, добравшиеся на запад по затихшим ныне торговым путям, говорят о том, что город переживает глубочайший упадок. Магический всплеск из прежде неактивной башни в его центре (произошедший одновременно с [Concept('frodbrokna','Фродброкной')|E]), похоже, призвал великое воинство чудовищ, которые заняли пустующие кварталы столицы. Район, в котором обитают император и его слуги, ныне находится в вечной осаде, а попытки их Знамен освободить ставшие жуткими улицы закончились катастрофой."
 
 #MISC
 game_concept_zhaen: "Чжэнь"
 game_concept_zhaen_desc: "Чжэнь, или Божественная бронза — магический сплав, производимый в Катун-Кае. Обладая свойствами, превосходящими даже лучшую сталь, этот металл, как говорят, также наделен исцеляющей силой при приеме внутрь или использовании в качестве основы для зелий (и, по слухам, даже служит главным веществом для мифического Эликсира жизни).\n\nМетод выплавки чжэня является строжайшей тайной катунцев, и поговаривают, будто на каждого кузнеца и алхимика, работающего с этим металлом, наложено страшное заклятие, несущее смерть в случае одной лишь мысли выдать его секреты. Однако банвагульские мудрецы долгое время оспаривали это утверждение, заявляя, будто формула была украдена у великого мастера Пуема, что на протяжении многих лет приводило к нескольким войнам и восстаниям."
 
 
 ##FAITHS
 
 game_concept_kathuni_dragon_mythology: "Катунская мифология драконов"
 game_concept_kathuni_dragon_mythology_desc: "Почитание [Concept('dragons','Дракона')|E] в катунских преданиях и вере невероятно сложно и часто кажется абсолютно непостижимым для большинства сторонних мудрецов, пытавшихся изучать этот край. Будучи, по всей видимости, вдохновленным реально существовавшим в древности крылатым зверем, катунское обожествление чудовища ставит его по значимости гораздо выше даже аналогичного почитания драконов у [Concept('aversaria','аверсарианцев')|E]. Хотя некоторые летописцы выдвигали приземленную мысль о том, что некий дракон (или драконы) некогда опустошал или правил древним доимперским Катун-Каем, узнать подлинную истину невозможно из-за утерянных разделов в остальном чрезвычайно хорошо задокументированных исторических хроник Катун-Кая.\n\nПримерно за четыреста лет до возвышения [Concept('aversaria','Аверсарии')|E] исключительно могущественная [Concept('magi','волшебница')|E] по имени Яо Жэнь Цай свергла духовные княжеские ордена, правившие на востоке, и короновала себя как первая императрица Катун-Кая, приняв имя «Тяньян» («Солнце» или «Небо» по-катунски). Она правила, как утверждается, на протяжении двухсот лет и создала «Четырнадцать небесных путей жизни» для достижения духовного и телесного совершенства. После ее кончины в столице [Concept('loen_chaeon','Лоэн-Чэоне')|E] — то ли из-за речей самой Яо Жэнь Цай, то ли из-за возвеличивания ее наследия, то ли из-за искренней веры народа — было объявлено, что она воссоединилась с богами и слилась с ними, став «Первым Драконом» (катунские верования уточняют, что хотя обычные драконы могли существовать и раньше, она стала гораздо более великой их ипостасью).\n\nХотя этого убеждения придерживается преимущественно аристократия (простолюдины Катун-Кая чаще верят, что она на самом деле стала небом и землей), оно тем не менее наложило огромный отпечаток на дальнейшую культуру Катун-Кая и в особенности на его знать. Сын Яо Жэнь Цай, император Яо Линсюй-Яо Жэнь Цай, провозгласил себя земным воплощением Первого Дракона ради обеспечения своего права на престол, и этому примеру следовал каждый император после него. Господствующая религия востока (на западе ее часто называют «Четырнадцатью небесными методами»), сформировавшаяся во время и после правления Яо Жэнь Цай, еще сильнее укоренила этот культ, поощряя поклонение Первому Дракону и всем его земным преемникам как «духовному сердцу» Катун-Кая и как опоре авторитета монархии. И если вера в преемственность духа монархов оставалась неоднозначной, то почитание драконов (и самой Яо Жэнь Цай) прочно доминировало в Катун-Кае на протяжении всей его последующей истории."
 
 #GODS

 game_concept_chiang_hsiang_shou: "Цзян Сян Шоу"
 game_concept_chiang_hsiang_shou_desc: "Цзян Сян Шоу — это сверхъестественное существо, встречающееся в катунской мифологии, почитаемое как живое воплощение самой войны. Его традиционно изображают в виде чудовищной львиной головы с кроваво-красными глазами и вечной пеленой чёрного тумана, окружающей его, — облик, который, как говорят, предвещает конфликт и резню.\n\nСогласно катунской традиции, Цзян Сян Шоу родился во время древней войны невообразимых масштабов. Кровопролитие было столь велико, что реки, озёра и даже моря окрасились в багровый цвет, а сами дожди, как говорят, падали кровью. Из ненависти, скорби и злобы, оставленных бесчисленными мёртвыми, принял форму Цзян Сян Шоу.\n\nКак воплощение войны и насильственной смерти, считается, что Цзян Сян Шоу не может быть по-настоящему уничтожен. Пока человечество продолжает вести войны и проливается кровь на земле, дух будет жить."
 
