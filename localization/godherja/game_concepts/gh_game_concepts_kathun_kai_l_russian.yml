 game_concept_iorne_seld:0 "Йорне Сельд"
 game_concept_iorne_seld_desc:0 "Йорне Сельд, или «Меч Эпох» на ольтенских языках — легендарный меч ольтенского военачальника Отачеда, который объединил ольтенские кланы в [Concept('iorne_horde','Йорнскую орду')|E] и привёл их на юг, в Каширию, после войны [Concept('khayar_seldnii_darn','Хайяр Сельднийн Дарн')|E] и столкновения этого оружия со столь же легендарным клинком [Concept('eyon_faeng','Эйон Фэнг')|E] во время поединка Отачеда с катунским воином Ксаои Яунг Заянгом, вызвавшим взрыв, который уничтожил государство Чейюндже. Если верить преданиям, происхождение этого меча было абсолютно неизвестно. Отачед якобы первым обнаружил его после того, как сразил великого дракона, чья разверзнутая пасть открывала портал в далёкий мир; Отачед вытянул оттуда легендарный меч и обезглавил чудовище, навсегда запечатав этот портал.\n\nНесмотря на определённые сомнения аверсарианских учёных в подлинности меча, сказание о легендарном клинке, судя по всему, возникло ещё до того, как Отачед якобы нашёл его. Это порождает множество выводов: от веры в то, что Отачед сфальсифицировал обретение клинка ради легитимизации своей власти, до вероятности того, что он действительно отыскал древний меч, который к тому моменту уже вошёл в ольтенские легенды. Согласно ольтенской мифологии, этот меч принадлежал [Glossary('Кайгану','GH_KAIGAN_GLOSS')], сыну Ольгон-тена (верховного бога ольтенского пантеона), который явился в [Concept('aeras','Эрас')|E] в качестве первого человека, прежде чем был убит богиней земли Йеру-Май. Был ли этот клинок подлинным или фальшивкой, его обретение — или же вера в его аутентичность — позволило Отачеду значительно укрепить законность своего правления и сыграло ключевую роль в объединении им ольтенских кланов.\n\nВпоследствии клинок перешёл к его сыну Айрану в более поздней [Concept('otachedian_empire','Отачедской империи')|E], а затем к его сыну Байтору, который повёл ольтенов на запад, в Айроной, во время [Concept('bayyuralar','Байюралар')|E]. Там Байтор упал с лошади и утонул в ручье, а меч унесло течением в близлежащую реку, а затем и в море. Хотя многие ольтенские кочевники и аверсарианские исследователи пытались отыскать его, место гибели Байтора затерялось в веках, а подлинность самого меча так и осталась под вопросом."
 
 game_concept_eyon_faeng:0 "Эйон Фэнг"
 game_concept_eyon_faeng_desc:0 "Эйон Фэнг, или «Шепчущий ветер» на правящем языке Катун-Кая — легендарный меч и, пожалуй, самая известная катунская басня; искажённые предания об этом мече и его истории достигали даже [Concept('chevalie','Шевалье')|E] ещё до того, как жители [Concept('the_continent','Континента')|E] вступили в контакт с Дальним Востоком. Однако, несмотря на свой легендарный статус по всему миру, он был утерян где-то до IV века и с тех пор его никто не видел. Последним известным владельцем клинка был катунский Первый Магистр Первого Знамени Императора, Ксаои Яунг Заянг, который повёл почти 100-тысячное войско в битву во время войны [Concept('khayar_seldnii_darn','Хайяр Сельднийн Дарн')|E] против ольтенского военачальника Отачеда, владевшего столь же знаменитым клинком [Concept('iorne_seld','Йорне Сельд')|E].\n\nО самом клинке говорили, что он был тонким как бумага, но при этом на нём невозможно было оставить ни единой царапины, а своему владельцу он даровал способность наносить удары намного быстрее, чем способен любой человек. Более того, многие легенды упоминают, что он «рассекал сам воздух». Хотя это неоднократно зафиксировано в катунских бюрократических хрониках, подлинный результат или достоверность этого остаются неясными. Почти все предания о том, как клинок делал это, утверждают, будто он буквально разрывал само пространство, оставляя ужасающие чёрные пустоты в реальности и сокрушая стоящие перед ним стены замков и городов.\n\nИзначально заявлялось, что этот меч был пятым клинком первой императрицы Катун-Кая, Драконьей императрицы Яо Жэнь Цай-Тяньян, и был подарен её легендарному телохранителю (и основателю должности Первого Магистра Первого Знамени Императора) Гаоруню Майнгу, который затем передавал его каждому последующему Первому Магистру. Ксаои Яунг Заянг после своей ничьей с Отачедом исчез вслед за опустошительным исходом битвы. Хотя это и не доказано, предания гласят, что он стал сяосе (странствующим мечником), покинув службу императору в позоре. Так или иначе, с исчезновением Яунг Заянга из исторических хроник Шепчущий ветер тоже более никогда не являлся миру."
 
