 game_concept_kathun: "Катун"
 game_concept_kathun_desc: "Катун — это обширный регион, лежащий к востоку от [Concept('kashirya','Каширии')|E], граничащий с Великой степью. Здесь находится величайшее скопление людей на [Concept('aeras','Эрасе')|E]. Хотя этот регион охватывает множество различных царств, городов-государств и народов, большая его часть находится под влиянием Катун-Кая, чей двор в [Concept('loen_chaeon','Лоэн-Чэоне')|E] поддерживает сложную сеть данников и клиентских государств по всему региону.\n\nХотя торговля между Катуном и [Concept('sarradon','Саррадоном')|E] насчитывает столетия, понимание запада об этом регионе в значительной степени проистекает из дипломатических и торговых связей, установленных между [Concept('aversaria','Аверсарией')|E] и Катун-Каем. В результате западные учёные часто принимают обычаи катунцев за обычаи всего Катуна, несмотря на поразительное культурное разнообразие региона. Катун-Кай славится своим мастерством в алхимии. Его зелья и эликсиры входят в число самых ценных товаров, импортируемых на континент."

 game_concept_hanwei_movement: "Движение Ханьвэй"
 game_concept_hanwei_movement_desc: "Движение Ханьвэй было государственной кампанией, инициированной катунским двором в VIII веке для восстановления авторитета Четырнадцати небесных методов. Проводимое под лозунгом «Искоренить извращённое и порочное, очистить и поддержать основные законы», оно стремилось подавить гетеродоксальные верования и установить единое идеологическое основание для царства.\n\nДвижение возникло, когда Катун-Кай оправлялся от столетий смуты — периода, в течение которого многочисленные культы и соперничающие школы мысли процветали, в то время как Четырнадцать небесных методов неуклонно приходили в упадок. В ответ Драконий император приказал уничтожить еретические тексты и святилища, объявил вне закона практики, считавшиеся варварскими, и поручил учёным составить новый ортодоксальный канон, который вновь поставил бы Четырнадцать небесных методов в центр катунского общества.\n\nОднако возобновлённое изучение катунской классики привело многих учёных к пересмотру более метафизических элементов традиции, что породило [debate_on_reformation|E] и в конечном счёте — Синь Сюэ."

 game_concept_debate_on_reformation: "Ханьвэйский диспут"
 game_concept_debate_on_reformation_desc: "Диспут о реформах возник на поздних этапах развития [Concept('hanwei_movement','движения Ханьвэй')|E], когда возобновлённое изучение Четырнадцати небесных методов привело учёных к пересмотру многих их давних доктрин. Из этих дебатов возникли две противоборствующие школы мысли. Синь Сюэ, выступавшая за реформирование классических учений для лучшего соответствия меняющейся эпохе, и Цзю Сюэ, отстаивавшая сохранение древних традиций и институтов.\n\nСоперничество между двумя движениями вскоре стало доминировать в интеллектуальной жизни Катун-Кая. Учёные Синь Сюэ критиковали Цзю Сюэ как косную и оторванную от потребностей общества, в то время как Цзю Сюэ осуждали своих соперников как подрывающих моральные и политические устои царства."
 
 
