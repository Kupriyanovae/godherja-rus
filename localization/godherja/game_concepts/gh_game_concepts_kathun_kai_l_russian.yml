 game_concept_khayar_seldnii_darn:0 "Хайяр Сельднийн Дарн"
 game_concept_khayar_seldnii_darn_desc:0 "Хайяр Сельднийн Дарн, или «Война двух мечей» на ольтенских языках — легендарный конфликт между ольтенским военачальником Отачедом и катунским генералом Ксаои Яунг Заянгом, Первым Магистром Первого Знамени Императора, ставший последней из крупных [Concept('oltenic_kathuni_wars','ольтенско-катунских войн')|E]. Сама война названа в честь мечей, которые каждый из генералов использовал в этом конфликте: Отачед владел легендарным [Concept('iorne_seld','Йорне Сельд')|E], а Яунг Заянг — столь же легендарным [Concept('eyon_faeng','Эйон Фэнг')|E]. Всё началось с того, что Отачед собрал крупные силы и прорвал катунские пограничные форты, несмотря на то, что численность врага превышала его собственную почти три к одному, после чего разграбил город Хаоцзянь, столицу западного государства Чейюнджей.\n\nЯунг Заянг, чьи мотивы в большинстве современных изложений этой истории разнятся (чаще всего в сказаниях утверждается, что либо его брат пал при обороне пограничных фортов, либо его семья была вырезана в Хаоцзяне), запросил дозволения у тогдашнего императора Сюй Цзян-Сюй Яона двинуть своё личное знамя на запад, дабы сразить ольтенского военачальника и найти способ навсегда покончить с растущей ольтенской угрозой. Император, по всей видимости, помня о [Concept('gayhan_campaign','Гайханском походе')|E], в ходе которого тридцать лет назад, во время правления его отца, ольтены подошли на расстояние прямой видимости к столице (то, что ольтенам вообще позволили лицезреть столицу, пусть даже издалека, считалось сокрушительным оскорблением для императорского рода), дал своё одобрение и отправил отряд личных [Concept('magi','магов')|E] для его сопровождения.\n\nХотя Отачед потерпел ужасное поражение в битве при Каянге, ему удалось бежать через катунскую границу, где он воспользовался распространяющейся легендой о своём клинке и личными связями с другими кланами, чтобы собрать величайшее воинство из всех, что когда-либо выступали против катунцев. Объединив почти все крупные ольтенские кланы в огромную орду, он вскоре сошёлся в бою с Яунг Заянгом и разбил его. Яунг Заянг, над которым теперь нависла угроза казни в случае повторной неудачи, вернулся с тремя полными Знаменами, а также с ополчением четырёх различных государств. Война завершилась [Concept('battle_of_kayarang','битвой при Каяранге')|E]."
 
 game_concept_battle_of_kayarang:0 "Битва при Каяранге"
 game_concept_battle_of_kayarang_desc:0 "Битва при Каяранге стала финальным сражением войны [Concept('khayar_seldnii_darn','Хайяр Сельднийн Дарн')|E]. В этом бою у холмов Каяранга величайшая армия, когда-либо собиравшаяся ольтенским хатаном к тому моменту, столкнулась с тремя полными Знаменами императора Катун-Кая, а также с ополчением четырёх разных государств. Во главе ольтенских сил стоял хатан Отачед, в то время как катунские войска возглавлял Ксаои Яунг Заянг, самый грозный воин императора Сюй Цзян-Сюй Яона. Надеясь извлечь выгоду из холмистой местности, Ксаои Яунг Заянг занял позицию для боя при Каяранге, приказав одному из своих генералов, Хо Хэ, повести целое Знамя на перехват ольтенской орды, а затем симулировать отступление к Каярангу.\n\nОтачед и его орда начали преследовать отступающих катунцев, в результате чего угодили в засаду сил Яунг Заянга. В завязавшемся сражении Отачед и Яунг Заянг столкнулись друг с другом в бою, хотя некоторые хроники романтизируют это событие и утверждают, будто они вызвали друг друга на смертный поединок, ради чего битва была приостановлена в соответствии с надлежащими правилами дуэлей. В хаосе схватки оба их легендарных меча столкнулись, спровоцировав взрыв, который опустошил не только Каяранг, но и всё окружающее государство Чейюнджей. Хотя Яунг Заянг и Отачед выжили, к концу битвы в живых осталось лишь несколько сотен человек из их объединённых сил.\n\nПозднее Отачед сплотил ольтенов под своим началом, используя легенду о своём мече — [Concept('iorne_seld','Йорне Сельд')|E] — ради привлечения большинства кланов под своё знамя. Яунг Заянг, между тем, с позором оставил службу императору и стал скитаться по миру в качестве сяосе — своего рода бродячего наёмного мечника, унеся с собой легендарный [Concept('eyon_faeng','Эйон Фэнг')|E]. Хо Хэ, ещё один выживший, покончил жизнь самоубийством, дабы защитить как собственную честь, так и честь своей семьи. Эта битва вошла в историю как бесславная и трагическая веха как для народа Катун-Кая, так и для ольтенских кочевников, хотя в ольтенских версиях этого сказания она изображается в более романтическом ключе."
 
 game_concept_oltenic_kathuni_wars:0 "Ольтенско-катунские войны"
 game_concept_oltenic_kathuni_wars_desc:0 "Под ольтенско-катунскими войнами понимаются несколько веков войн, происходивших между кочевыми протоольтенскими кланами северо-восточных Кольргийских степей (происходивших главным образом до современного формирования их культур и верований) и империей Катун-Кай. Конфликт в основном бушевал в степях и на границах между землями катарадди и самим Катун-Каем.\n\nХотя эти войны велись культурами настолько древними, что они предшествовали даже относительно старинным ольтенам, большинство из них хорошо известны благодаря ольтенской устной традиции и одержимо плодовитой бюрократии Катун-Кая. Большая часть зафиксированных конфликтов состояла из пограничных стычек — обычно это были ольтенские набеги, продвигавшиеся всё глубже и глубже в катунское пограничье, пока их не встречали силы катунской имперской армии или нанятые меркурии.\n\nНесколько войн, напротив, заканчивались тем, что ольтены формировали огромную орду, которой удавалось пробиться в самые сердца катунских земель и напрямую угрожать их столице; другие же завершались попытками катунцев навсегда воздвигнуть форты и закрепиться в Кольргийских степях для предотвращения дальнейших конфликтов. Эти войны никогда не приводили к окончательному результату, пока легендарная [Concept('khayar_seldnii_darn','Хайяр Сельднийн Дарн')|E] не вызвала массовый исход ольтенов из степей в Каширию. Хотя несколько племён остались и со временем вновь заселили степи, конфликты с катунцами более никогда не достигали прежней регулярности и обычно классифицируются отдельно."
 
 game_concept_gayhan_campaign:0 "Гайханский поход"
 game_concept_gayhan_campaign_desc:0 "Гайханский поход представлял собой протоольтенское вторжение в Катун-Кай, произошедшее во время [Concept('oltenic_kathuni_wars','ольтенско-катунских войн')|E] за тридцать лет до завершившей их войны [Concept('khayar_seldnii_darn','Хайяр Сельднийн Дарн')|E]. Сам поход начинался как обычный мелкий набег степного военачальника Оарачада, который выдвинулся на восток, имея под началом менее тысячи всадников.\n\nНесмотря на скромное начало, полнейший провал катунских сил в западном государстве Чейюнджей привёл к тому, что набегающая орда разрослась в размерах, и это позволило ей без труда прорваться в самые богатые и исторически наиболее защищённые центральные земли Катун-Кая. После гибели губернатора Май Ваня из государства Иаянь силы катунского ополчения посыпались, и ольтены захватили целиком все государства, располагавшиеся на Гайханском тракте — главном торговом маршруте империи.\n\nИмператор Сюй Яон-Сюй У, который до этого слишком сильно страшился обретавшего дурную славу Оарачада, был наконец побуждён к действию, когда осознал, что способен разглядеть лагерь ольтенской орды прямо из своей столицы в [Concept('loen_chaeon','Лоэн-Чэоне')|E]. Это было тягчайшим и унизительным оскорблением для императора: катунская традиция гласила, что лишь чистые духом и кровью люди, должным образом преклонившие колени перед наместниками императора, имели право хотя бы лицезреть этот прекрасный и древний город. Рискуя подвергнуться перевороту из-за своего позора, император Сюй Яон приказал своим Первому, Второму, Третьему и Пятому личным Знаменам ударить по Оарачаду — это был первый случай, когда он рискнул задействовать свои личные силы. В последовавшем сражении Оарачад был убит, а его орда разгромлена, однако это сильно дестабилизировало политическую арену Катун-Кая и послужило главной причиной восстания [Concept('qinianxa_panulan','Цинянься Панулань')|E] и последующей войны Хайяр Сельднийн Дарн."
 
 game_concept_qinianxa_panulan:0 "Цинянься Панулань"
 game_concept_qinianxa_panulan_desc:0 "Цинянься Панулань, или «Восстание тысячи лет» — исключительно разрушительная серия восстаний по всему западному Катун-Каю, поднятых как крестьянским движением Сэньдо Ва («Эзотерики» по-катунски) под предводительством философов, так и сёстрами императора Сюй Яон-Сюй У, Сюй Чухой и Сюй Баохан, которые позже были увековечены как народные героини под именем Линанг бэ Ташин, или «Два Ангела».\n\nПервые семена мятежа были посеяны жестоким унижением, нанесённым Сюй Яону военачальником Оарачадом в ходе Гайханского похода, что вызвало стремительное ухудшение и без того шаткого политического положения Сюй Яона и заставило знать и учёные сословия усомниться в том, что он является реинкарнацией Драконьей императрицы (и первой правительницы современного Катун-Кая) Яо Жэнь Цай-Тяньян. В то время как Сюй Яон отчаянно пытался исправить ситуацию, объявив о пятилетнем периоде празднеств и пиров в ознаменование «своей» победы над Оарачадом, неурожайный сезон, некомпетентность новоназначенного губернатора Май Чао в Иаяне и ущерб, нанесённый сельскохозяйственным угодьям [Concept('gayhan_campaign','Гайханским походом')|E], привели к страшному голоду, который вскоре унёс тысячи жизней.\n\nВидя ярость крестьян, страдавших от голода, пока император пировал и праздновал, извечно неспокойные философы Сэньдо Ва разожгли это пламя и убедили крестьян примкнуть к ним в восстании против власти Сюй Яона, провозгласив, что император никак не мог быть реинкарнацией Яо Жэнь, о чём они твердили десятилетиями. Этот хаос привёл к попытке дворцового переворота со стороны сестёр Сюй Яона совместно с их личными Пятым и Шестым Знаменами; и хотя попытка провалилась, вскоре они отступили на север, где завоевали верность государств Пиаон, Чжочжу и Вэнь, которые объявили сестёр истинными соимператрицами Катун-Кая и присоединились к их мятежу.\n\nПотребовалось более двадцати лет, чтобы Восстание тысячи лет подошло к концу; ожесточённые бои нанесли колоссальный урон западу и северу, а боевые действия замедлились лишь тогда, когда Сюй Яон был (по слухам) убит своим личным скульптором. Две сестры попытались занять трон, но были преданы губернатором Пу Янем из государства Чжочжу, который приказал убить Сюй Чуху, в то время как Сюй Баохан была вынуждена скрываться после предательства со стороны подкупленных солдат. Племянник Сюй Яона, Сюй Цзян — его любимец, которому на тот момент было всего шестнадцать лет — как говорят, хитростью заставил Пятый и Шестой Знамена поверить, будто именно он был провозглашён императором, после чего вошёл в столицу во главе этих войск. Охваченные паникой регенты [Concept('loen_chaeon','Лоэн-Чэона')|E] открыли перед ним врата, и он был спешно коронован. Вслед за этим урожай в том году выдался чрезвычайно обильным, что вкупе со множеством программ общественных работ успокоило бунтующее крестьянство, прозвавшее его «Шалань де Лоэн», или «Добрый Дракон». Считается, что Восстание тысячи лет окончательно завершилось, когда Сюй Цзян предложил своей тёте руку и сердце. Сюй Баохан приняла предложение, однако по прибытии в Лоэн-Чэон она, по приказу Сюй Цзяна, была «заколота тысячей слуг тысячей ножей».\n\nВосстание тысячи лет унесло жизни более 200 000 катунских солдат и граждан и существенно изменило политическое устройство Катун-Кая из-за повальных разрушений и реформ Сюй Цзяна, направленных на предотвращение подобных событий в будущем. Вскоре за восстанием последовала война [Concept('khayar_seldnii_darn','Хайяр Сельднийн Дарн')|E], поскольку западный повелитель коней Отачед воспользовался хаосом для начала своего великого набега на восток. Что наиболее важно для исторических хроник, сильный страх Сюй Цзяна повторить судьбу своих предшественников, по всей видимости, стал главной причиной его незамедлительного и масштабного ответа Отачеду."
 
 
