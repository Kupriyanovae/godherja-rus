 game_concept_khayar_seldnii_darn: "Хайяр Сельднийн Дарн"
 game_concept_khayar_seldnii_darn_desc: "Хайяр Сельднийн Дарн, или «Война двух мечей» на ольтенских языках — легендарное столкновение между ольтенским ханом Отачедом и катунским воеводой Ксаои Яунг Заянгом, Первым Магистром Первого Знамени Императора, ставшее последней из великих [Concept('oltenic_kathuni_wars','ольтенско-катунских войн')|E]. Сам конфликт назван в честь клинков, коими разили полководцы: Отачед шел в бой с легендарным [Concept('iorne_seld','Йорне Сельд')|E], а Яунг Заянг — со столь же прославленным [Concept('eyon_faeng','Эйон Фэнг')|E]. Началось все с того, что Отачед собрал грозную силу и сокрушил катунские пограничные заставы, несмотря на то, что врагов было втрое больше, после чего предал разграблению город Хаоцзянь, столицу западного удела Чейюнджей.\n\nЯунг Заянг, чьи побуждения в летописях описывают по-разному (где-то поется, будто его брат пал при обороне рубежей, где-то — что вся его семья погибла в Хаоцзяне), испросил дозволения у тогдашнего богдыхана Сюй Цзян-Сюй Яона двинуть свое личное Знамя на закат, дабы сразить ольтенского вождя и навсегда отвести степную угрозу. Император, помня о [Concept('gayhan_campaign','Гайханском походе')|E], в ходе которого тридцать лет назад, при его отце, кочевники подошли к стенам столицы (то, что варвары вообще посмели лицезреть священный город, пусть и издалека, считалось несмываемым позором для правящего дома), дал свое согласие и отправил отряд придворных [Concept('magi','магов')|E] для его сопровождения.\n\nИ хотя Отачед потерпел жестокое поражение в битве при Каянге, ему удалось уйти за катунский рубеж, где он воспользовался славой своего клинка и родством с другими вождями, дабы собрать величайшее воинство, какое только знала степь. Объединив почти все крупные ольтенские роды в несокрушимую орду, он вскоре вновь сошелся в бою с Яунг Заянгом и наголову разбил его. Катунский воевода, над которым теперь висела угроза казни за неудачу, вернулся к границе с тремя полными Знаменами и ополчением четырех уделов. Война завершилась [Concept('battle_of_kayarang','битвой при Каяранге')|E]."
 
 game_concept_battle_of_kayarang: "Битва при Каяранге"
 game_concept_battle_of_kayarang_desc: "Битва при Каяранге стала последней схваткой в войне [Concept('khayar_seldnii_darn','Хайяр Сельднийн Дарн')|E]. В этом бою у холмов Каяранга величайшая рать, когда-либо собиравшаяся ольтенским ханом, столкнулась с тремя полными Знаменами государя Катун-Кая и ополчением четырех разных уделов. Во главе кочевников стоял хан Отачед, тогда как катунские полки возглавлял Ксаои Яунг Заянг, самый грозный боец императора Сюй Цзян-Сюй Яона. Надеясь извлечь выгоду из холмов, Ксаои Яунг Заянг занял оборонительный рубеж и приказал одному из своих воевод, Хо Хэ, увлечь за собой ольтенскую орду, а затем притворно отступить к Каярангу.\n\nОтачед и его всадники бросились в погоню за отступающими катунцами и угодили прямо в ловушку Яунг Заянга. В яростной сече Отачед и Яунг Заянг сошлись лицом к лицу — хотя некоторые песни романтизируют этот миг, утверждая, будто они вызвали друг друга на смертный поединок, ради чего битва была остановлена по всем правилам дуэлей. В хаосе схватки оба легендарных меча столкнулись, породив взрыв, который опустошил не только Каяранг, но и все окружающее царство Чейюнджей. Хотя оба вождя выжили, к исходу дня из обеих армий уцелело лишь несколько сотен человек.\n\nПозже Отачед вновь сплотил ольтенов под своей рукой, используя легенду о своем мече — [Concept('iorne_seld','Йорне Сельд')|E] — дабы привлечь роды под свое знамя. Яунг Заянг же с позором покинул службу государю и стал скитаться по свету как сяосе — бродячий наемный мечник, унеся с собой грозный [Concept('eyon_faeng','Эйон Фэнг')|E]. Хо Хэ, другой выживший воевода, лишил себя жизни, дабы смыть позор с имени своей семьи. Эта битва вошла в летописи как горестная и бесславная веха как для народа Катун-Кая, так и для ольтенских кочевников, хотя в степных песнях её поныне воспевают с великой гордостью."
 
 game_concept_oltenic_kathuni_wars: "Ольтенско-катунские войны"
 game_concept_oltenic_kathuni_wars_desc: "Под ольтенско-катунскими войнами понимают несколько веков междоусобиц и походов, происходивших между кочевыми родами северо-восточных Кольргийских степей (еще до того, как сложились их нынешние обычаи и верования) и империей Катун-Кай. Конфликт в основном бушевал в бескрайних степях и на рубежах между землями катарадди и самим Катун-Каем.\n\nХотя эти войны велись племенами столь древними, что они предшествовали даже пращурам ольтенов, о большинстве из них хорошо известно благодаря ольтенским устным сказаниям и одержимой страсти катунских писцов к ведению хроник. Большая часть зафиксированных столкновений состояла из мелких набегов — обычно ольтены проникали все глубже в катунские окраины, пока дорогу им не преграждали полки имперской армии или нанятые вольные отряды.\n\nОднако несколько раз ольтенам удавалось собрать огромную орду, которая прорывалась в самое сердце катунских земель и грозила гибелью священной столице; в ответ же катунцы пытались на века воздвигнуть форты и закрепиться в Кольргийских степях, дабы раз и навсегда усмирить окраины. Эти войны не приносили окончательного мира, пока легендарная [Concept('khayar_seldnii_darn','Хайяр Сельднийн Дарн')|E] не вызвала великий исход ольтенов из степей в Каширию. И хотя часть племен осталась и со временем вновь заселила степи, былые великие войны с катунцами более не повторялись и ныне поминаются отдельно."
 
 game_concept_gayhan_campaign: "Гайханскй поход"
 game_concept_gayhan_campaign_desc: "Гайханский поход представлял собой великое вторжение кочевников в Катун-Кай, случившееся во время [Concept('oltenic_kathuni_wars','ольтенско-катунских войн')|E] за тридцать лет до завершившей их войны [Concept('khayar_seldnii_darn','Хайяр Сельднийн Дарн')|E]. Сам поход начинался как обычный мелкий набег степного вождя Оарачада, который выдвинулся на восток, имея под рукой менее тысячи всадников.\n\nНесмотря на скромное начало, полнейшая оплошность катунских воевод в западном уделе Чейюнджей привела к тому, что лавина кочевников разрослась вширь, и это позволило ей без труда прорваться в самые богатые и защищенные срединные земли Катун-Кая. После гибели наместника Май Ваня из удела Иаянь силы катунского ополчения дрогнули, и ольтены захватили все земли вдоль Гайханского тракта — главной торговой артерии империи.\n\nИмператор Сюй Яон-Сюй У, который доселе страшился грозного имени Оарачада, был наконец вынужден взяться за оружие, когда осознал, что способен разглядеть костры ольтенской орды прямо из окон своей столицы в [Concept('loen_chaeon','Лоэн-Чэоне')|E]. То было тягчайшим и нестерпимым оскорблением для государя: катунский обычай гласил, что лишь чистые духом и кровью мужи, должным образом склонившие выю перед слугами неба, имели право хотя бы лицезреть этот прекрасный и древний город. Рискуя потерять престол из-за такого позора, император Сюй Яон приказал своим Первому, Второму, Третьему и Пятому личным Знаменам ударить по Оарачаду — то был первый случай, когда он решился двинуть в бой гвардию. В последовавшей сече Оарачад пал, а его орда была рассеяна, однако это сильно пошатнуло престол Катун-Кая и послужило главной причиной восстания [Concept('qinianxa_panulan','Цинянься Панулань')|E] и последующей войны Двух Мечей."
 
 game_concept_qinianxa_panulan: "Цинянься Панулань"
 game_concept_qinianxa_panulan_desc: "Цинянься Панулань, или «Восстание тысячи лет» — исключительно разрушительная череда мятежей по всему западному Катун-Каю, поднятых как крестьянским братством Сэньдо Ва («Эзотерики» по-катунски) под началом мудрецов, так и сестрами императора Сюй Яон-Сюй У, Сюй Чухой и Сюй Баохан, которые позже стали народными героинями под именем Линанг бэ Ташин, или «Два Ангела».\n\nПервые семена раздора были посеяны жестоким унижением, нанесенным Сюй Яону ханом Оарачадом в ходе Гайханского похода. Это пошатнуло власть Сюй Яона и заставило знать и книжные сословия усомниться в том, что он является истинным воплощением Драконьей императрицы (и первой правительницы Катун-Кая) Яо Жэнь Цай-Тяньян. В то время как Сюй Яон тщетно пытался исправить положение, объявив о пятилетии празднеств и пиров в ознаменование «своей» победы над Оарачадом, неурожай, глупость нового наместника Май Чао в Иаяне и ущерб, нанесенный пашням [Concept('gayhan_campaign','Гайханским походом')|E], привели к страшному голоду, который вскоре унес тысячи жизней.\n\nВидя ярость крестьян, страдавших от голода, пока во дворце шел пир горой, извечно смутьянящие мудрецы Сэньдо Ва разожгли это пламя и убедили народ примкнуть к восстанию, провозгласив, что император никак не мог быть воплощением Яо Жэнь, о чем они твердили десятилетиями. Этот хаос привел к попытке дворцового переворота со стороны сестер Сюй Яона совместно с их личными Пятым и Шестым Знаменами; и хотя замысел провалился, вскоре они отступили на север, где завоевали верность уделов Пиаон, Чжочжу и Вэнь, кои объявили сестер истинными соимператрицами Катун-Кая и примкнули к их мятежу.\n\nПотребовалось более двадцати лет, чтобы Восстание тысячи лет подошло к концу; ожесточенные бои нанесли колоссальный урон западу и северу, а распря утихла лишь тогда, когда Сюй Яон был (по слухам) убит своим личным ваятелем. Две сестры попытались занять трон, но были преданы наместником Пу Янем из удела Чжочжу, который приказал лишить жизни Сюй Чуху, в то время как Сюй Баохан была вынуждена скрываться после измены подкупленных ратников. Племянник Сюй Яона, Сюй Цзян — его любимец, которому тогда исполнилось всего шестнадцать лет — как говорят, хитростью заставил Пятый и Шестой Знамена поверить, будто именно он был провозглашен преемником, после чего вошел в столицу во главе этих войск. Охваченные паникой правители [Concept('loen_chaeon','Лоэн-Чэона')|E] открыли перед ним врата, и он был немедленно венчан на царство. Вслед за этим урожай в тот год выдался на диво обильным, что вкупе со множеством строительных работ успокоило бунтующий люд, прозвавший его «Шалань де Лоэн», или «Добрый Дракон». Считается, что Восстание тысячи лет окончательно завершилось, когда Сюй Цзян предложил своей тетке руку и сердце. Сюй Баохан приняла предложение, однако по прибытии в Лоэн-Чэон она, по тайному приказу государя, была «заколота тысячей слуг тысячей ножей».\n\nВосстание тысячи лет унесло жизни более 200 000 катунских воинов и простых жителей и существенно изменило весь уклад Катун-Кая из-за страшных разрушений и реформ Сюй Цзяна, направленных на предотвращение подобных смут. Вскоре за восстанием последовала война [Concept('khayar_seldnii_darn','Хайяр Сельднийн Дарн')|E], поскольку западный повелитель коней Отачед воспользовался хаосом для начала своего набега. Что важнее всего для летописей, сильный страх Сюй Цзяна повторить судьбу своих предшественников и стал главной причиной его незамедлительного и грозного ответа Отачеду."
 
 
