 game_concept_loen_chaeon:0 "Лоэн-Чэон"
 game_concept_loen_chaeon_desc:89 "Лоэн-Чэон, или «Город Дракона» по-катунски — столица, из которой правил каждый законный правитель Катун-Кая с момента зарождения этого государства при Драконьей императрице Яо Жэнь Цай. Несмотря на то, что от древнего Лоэн-Чэона мало что осталось в его современном воплощении (даже его первоначальное название затерялось в истории), он являлся одним из крупнейших городов востока по меньшей мере за несколько тысяч лет до рождения Яо Жэнь Цай. Катунские учёные из-за его величия часто именовали его «величайшим из городов» или «городом, в котором покоится мир»; эти сообщения, однако, встречали скепсис со стороны [Concept('aversaria','аверсарианских')|E] учёных, до которых доходили подобные предания ещё до их первых попыток совершить путешествие на восток. Когда [Concept('magi','маг')|E] и картограф Эотос Айтакрос стал первым аверсарианцем, которому позволили не просто увидеть, но и войти в город, он незамедлительно накатал в письме домой более тридцати страниц с описанием своего изумления перед величием города, заявляя, что мифы ничуть не преувеличивали реальность, а напротив, сильно её преуменьшали.\n\nСам город раскинулся по всей территории острова Даогао и сосредоточен вокруг неактивной [Concept('the_towers','Башни')|E], которая за века застройки постепенно скрылась под массивным фасадом катунской архитектуры. Изначально будучи крупным поселением возле башни, соединённым с небольшим портом, при последующих правителях город разросся и занял остров размером примерно с Императорский остров, удивляя поразительно впечатляющей архитектурой, бесконечным числом монументов и фонтанов, а также более чем сотней садов и парков размером с иные города. Некоторые аверсарианцы подмечали, что, судя по описанию Айтакроса, большая часть города на самом деле была необитаема, а «сады» и «парки», занимавшие более половины острова, существовали просто из-за невозможности полностью заселить столь огромный город.\n\nКатунский закон карает за наблюдение столицы — даже с моря или через проливы — смертью или ослеплением. Катунские купцы, идущие через торговые центры у притоков, впадающих в залив Жэнь Цай, обязаны либо завязывать себе глаза, либо оставаться в трюмах при проходе мимо города, а их корабли обычно ведут местные лоцманы из свиты императора за солидную плату. Суда, на которые это правило не распространяется, принадлежат к Императорскому священному торговому флоту; их капитаны и матросы лично рукоположены в сан жрецов слугами императора, что позволяет им проводить мимо города массивные баржи, затмевающие большинство военных кораблей. Однако, несмотря на всё его величие и мифологизацию в катунской культуре, последние разрозненные крупицы информации, добравшиеся на запад по затихшим ныне торговым путям, говорят о том, что город переживает глубочайший кризис. Магический всплеск из прежде неактивной башни в его центре (произошедший одновременно с [Concept('frodbrokna','Фродброкной')|E]), похоже, призвал великое воинство чудовищ, которые заняли пустующие кварталы столицы. Район, в котором обитают император и его слуги, ныне находится в вечной осаде, а попытки их Знамен освободить ставшие жуткими улицы закончились катастрофой."
 
