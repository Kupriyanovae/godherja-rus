 game_concept_zhaen:0 "Чжэнь"
 game_concept_zhaen_desc:90 "Чжэнь, или Божественная бронза — магический сплав, производимый в Катун-Кае. Обладая физическими свойствами, превосходящими даже сталь, этот металл, как говорят, также наделён исцеляющими свойствами при приёме внутрь или использовании в качестве компонента в зельях (и, по слухам, даже служит базовым ингредиентом для мифического Эликсира жизни).\n\nМетод производства чжэня является строжайшим секретом катунцев, и поговаривают, будто на каждого кузнеца и алхимика, работающего с этим металлом, наложено проклятие, несущее смерть в случае одной лишь мысли выдать его тайны. Однако банвагульские учёные долгое время оспаривали это утверждение, заявляя, что формула была украдена у великого кузнеца Пуема, что на протяжении многих лет приводило к нескольким войнам и восстаниям."
 
 
 ##FAITHS
 
 game_concept_kathuni_dragon_mythology:0 "Катунская мифология драконов"
 game_concept_kathuni_dragon_mythology_desc:0 "Мифологизация [Concept('dragons','Дракона')|E] в катунских преданиях и религии невероятно сложна и часто кажется абсолютно эзотерической для большинства сторонних наблюдателей, пытавшихся изучать эту культуру. Будучи, по всей видимости, вдохновлённым реально существовавшим историческим существом, катунское обожествление зверя ставит его по значимости гораздо выше даже аналогичного почитания драконов у [Concept('aversaria','аверсарианцев')|E]. Хотя некоторые учёные выдвигали приземлённую теорию о том, что некий дракон (или драконы) некогда опустошал или правил древним доимперским Катун-Каем, узнать подлинную истину невозможно из-за утерянных разделов в остальном чрезвычайно хорошо задокументированных исторических хроник Катун-Кая.\n\nПримерно за четыреста лет до образования [Concept('aversaria','Аверсарии')|E] исключительно могущественная [Concept('magi','волшебница')|E] по имени Яо Жэнь Цай свергла теократические монашеско-княжеские ордена, доминировавшие на востоке, и короновала себя как первая императрица Катун-Кая, приняв тронное имя «Тяньян» («Солнце» или «Небо» по-катунски), после чего правила, как утверждается, на протяжении двухсот лет и создала «Четырнадцать небесных путей жизни» для достижения духовного, физического и ментального совершенства. После её кончины в столице [Concept('loen_chaeon','Лоэн-Чэоне')|E] — то ли из-за пропаганды самой Яо Жэнь Цай, то ли из-за мифологизации её наследия, то ли из-за искренней веры катунцев — было объявлено, что она воссоединилась с богами и слилась с ними, став «Первым Драконом» (катунские верования уточняют, что хотя обычные драконы могли существовать и раньше, она стала гораздо более великой их ипостасью).\n\nХотя этого убеждения придерживается преимущественно аристократия (простолюдины Катун-Кая чаще верят, что она на самом деле стала небом и землёй), оно тем не менее наложило огромный отпечаток на дальнейшую культуру Катун-Кая и в особенности на его знать. Сын Яо Жэнь Цай, император Яо Линсюй-Яо Жэнь Цай, провозгласил себя реинкарнацией Первого Дракона ради обеспечения своего права на престол, и этому примеру следовал каждый император после него. Господствующая религия востока (на западе её часто называют «Четырнадцатью небесными методами»), сформировавшаяся во время и после правления Яо Жэнь Цай, ещё сильнее укоренила культ дракона, поощряя поклонение Первому Дракону и всем его реинкарнациям как «духовному центру» Катун-Кая и как методу поддержания авторитета монархии. И если вера в реинкарнацию монархов оставалась неоднозначной, то почитание драконов (и Яо Жэнь Цай) прочно доминировало в Катун-Кае на протяжении всей его последующей истории."
 
