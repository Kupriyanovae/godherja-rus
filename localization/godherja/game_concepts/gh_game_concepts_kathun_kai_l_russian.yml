 game_concept_iorne_seld: "Йорне Сельд"
 game_concept_iorne_seld_desc: "Йорне Сельд, или «Меч Эпох» на ольтенских наречиях — легендарный клинок ольтенского военачальника Отачеда, который сплотил кочевые роды в [Concept('iorne_horde','Йорнскую орду')|E] и повёл их на полуденные земли, в Каширию. Это случилось после войны [Concept('khayar_seldnii_darn','Хайяр Сельднийн Дарн')|E], когда оружие скрестилось со столь же грозным клинком [Concept('eyon_faeng','Эйон Фэнг')|E] в поединке Отачеда с катунским богатырем Ксаои Яунг Заянгом, что вызвало взрыв, стёрший с лица земли царство Чейюндже. Если верить преданиям, происхождение этого меча окутано вечной тайной. Отачед якобы нашел его после того, как сразил великого змея, чья разверзнутая пасть открывала врата в далёкий мир; Отачед вытянул оттуда легендарную сталь и обезглавил чудовище, навек запечатав тот проход.\n\nНесмотря на сомнения аверсарианских книжников в подлинности меча, сказания о нем, судя по всему, ходили задолго до того, как Отачед объявил о его обретении. Из этого выводят разное: одни верят, будто Отачед выдумал эту находку ради утверждения своей власти, другие же полагают, что он и впрямь отыскал древний реликт, который к тому времени уже вошел в ольтенские песни. Согласно мифам кочевников, этот меч принадлежал [Glossary('Кайгану','GH_KAIGAN_GLOSS')], сыну Ольгон-тена (верховного бога ольтенского пантеона), который явился в [Concept('aeras','Эрас')|E] как первый человек, прежде чем пасть от руки богини земли Йеру-Май. Была ли то древняя святыня или искусная подделка, но обретение меча — или же слепая вера воинов в него — позволило Отачеду укрепить законность своего верховенства и помогло сплотить разрозненные кланы.\n\nВпоследствии клинок перешел к его сыну Айрану в пору расцвета [Concept('otachedian_empire','Отачедской империи')|E], а затем к внуку Байтору, который повёл ольтенов на закат солнца, в Айроной, во время великого исхода [Concept('bayyuralar','Байюралар')|E]. Там Байтор упал с коня и утонул в ручье, а меч унесло течением сперва в реку, а после и в безбрежное море. И хотя многие кочевники и аверсарианские искатели пытались отыскать его, место гибели Байтора затерялось в веках, а тайна меча так и осталась неразгаданной."
 
 game_concept_eyon_faeng: "Эйон Фэнг"
 game_concept_eyon_faeng_desc: "Эйон Фэнг, или «Шепчущий ветер» на высоком наречии Катун-Кая — легендарный меч и, пожалуй, самое известное катунское предание; смутные слухи о нем достигали даже земель [Concept('chevalie','Шевалье')|E] еще до того, как уроженцы [Concept('the_continent','Континента')|E] повстречали мужей Дальнего Востока. Однако, вопреки своей громкой славе, он был утерян еще до IV века, и с тех пор никто его не видел. Последним, кто держал его в руках, был катунский Первый Магистр Первого Знамени Императора, Ксаои Яунг Заянг, поведший стотысячную рать на битву войны [Concept('khayar_seldnii_darn','Хайяр Сельднийн Дарн')|E] против ольтенского хана Отачеда, владевшего мечом [Concept('iorne_seld','Йорне Сельд')|E].\n\nО самом клинке говорили, будто он был тонок как лист пергамента, но на нем нельзя было оставить и царапины, а владельцу он позволял разить врагов с быстротой, недоступной простому смертному. Более того, во многих свитках поминается, что он «рассекал сам воздух». И хотя об этом не раз писали в сухих катунских хрониках, истинная суть этих слов остается неясной. Почти все сказания уверяют, будто он буквально разрывал само пространство, оставляя зияющие черные пустоты в поднебесной и сокрушая каменные стены крепостей и городов.\n\nИзначально заявлялось, будто сей меч был пятым клинком первой владычицы Катун-Кая, Драконьей императрицы Яо Жэнь Цай-Тяньян, и был дарован ее верному телохранителю (и первому в чине Первого Магистра Первого Знамени) Гаоруню Майнгу, дабы тот передавал его своим преемникам. Ксаои Яунг Заянг после своей ничьей с Отачедом сгинул в хаосе опустошительного исхода битвы. И хотя свидетельств тому нет, молва гласит, что он стал сяосе — бродячим наемным мастером клинка, покинув службу государю в позоре. Так или иначе, с исчезновением Яунг Заянга из анналов истории Шепчущий ветер более никогда не являлся миру."
 
