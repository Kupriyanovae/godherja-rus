l_russian:
 
 game_concept_ufaliracci:0 "Уфалираччи"
 game_concept_ufaliracci_desc:0 "Уфалираччи — приморская [Concept('ritualism','ритуалистская')|E] держава, основанная купцами, изгнанниками и мореходами, кои бежали с [Concept('sarradon','Саррадонского')|E] Рога далече на запад, спасаясь от ярости [Concept('war_in_heaven','Войны на небесах')|E|l]. С шестого века сие царство росло и верховодило на всем [Concept('pirate_coast','Пиратском побережье')|E], пока не сгинуло без остатка во времена [Concept('siege_of_ufaliracci','Осады Уфалираччи')|E]. Поднявшись из малого града-государства, Уфалираччи прибрало к рукам все торговые пути на перекрестке морских дорог между [Concept('aversaria','Аверсарией')|E], Катун-Каем, полуденным Саррадоном и [Concept('kashirya','Каширией')|E]. Его былая мощь дала трещину, едва на полуночных рубежах разверзлась [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E], а явившиеся в здешних водах лихие пиратские ватаги и купеческие союзы — такие как [Concept('cinnamon_cities','Коричные города')|E], [Concept('gavan_coalition','Коалиция Гавана')|E] и владыки [Concept('magaala_qaaday','Магаала-Каадай')|E] — дерзко оспорили власть ритуалистских царей."

 game_concept_siege_of_ufaliracci:0 "Осада Уфалираччи"
 game_concept_siege_of_ufaliracci_desc:0 "Осада Уфалираччи, прозванная в песнях «Штурмом Кровавого Серебра», знаменовала собой пятидесятидневное окружение стольного града [Concept('ufaliracci','Уфалираччи')|E] на рассвете одиннадцатого века. После долгих зим упадка, мздоимства, потери контроля над фарватерами [Concept('cinnamon_cities','Коричных городов')|E] и черного лихолетья [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E] на севере, владыки Уфалираччи правили лишь своей островной крепостью. Лютые корсары годами грабили прибрежные села, но никто из них не мог тягаться силой с [Concept('gavan_coalition','Коалицией Гавана')|E]. Морской волк Гаван Железный Глаз давно зарился на [Concept('silver_palace','Серебряный дворец')|E] и в 1010 году обрушил всю мощь своей армады на стены Уфалираччи. Могучие твердыни держались сорок восемь дней, покуда ведовские маги Железного Глаза не раскололи саму землю под ними. На пути к чертогам корсары встретили яростный отпор, но разбойники без жалости жгли и вырезали все живое.\n\nКогда на пятидесятый день осады Железный Глаз пробился к палатам, от его воинства уцелело лишь несколько десятков ратников, а град вокруг лежал в дымящихся руинах.\n\nЦарский род с мечами в руках вместе со стражей и челядью встал насмерть, дабы сбросить пиратов. Легенды гласят, что когда Гаван после истребления венценосцев подошел к престолу, в живых остался лишь отрок-принц, державший перед троном засапожный нож. Имя мальчика затерялось в веках, но сказания уверяют, будто он выколол Гавану зенки и заставил корсара сожрать их на глазах у онемевшей команды. После сего штурма Коалиция Гавана погрязла в усобицах и распалась, оставив на побережье великое безвластие и рознь. Пока мелкие разбойники да удельные лорды дрались за разрозненные острова, век подошел к концу с пришествием первых морских легионов из [Concept('aversaria','Аверсарии')|E] в западную Роварскую землю и расцветом [Concept('cinnamon_cities','Коричных городов')|E]."
 game_concept_cinnamon_cities:0 "Коричные города"
 game_concept_cinnamon_cities_desc:0 "Коричные города — содружество приморских градов, державшее в кулаке всю торговлю пряностями на [Concept('pirate_coast','Пиратском побережье')|E] в одиннадцатом–тринадцатом веках по следам [Concept('siege_of_ufaliracci','Осады Уфалираччи')|E]. Поднявшись на купеческую складчину и подъемные капиталы нескольких богатых гостей, а также благодаря стараниям Каттупу Джамираса, срубившего [Concept('silver_palace','Серебряный дворец')|E], Коричные города начали крутую экспансию и подмяли под себя торговлю специями на всем Пиратском побережье. Пуская в ход щедрые посулы, взятки и бездонные займы, сии города превзошли богатством само царство [Concept('ufaliracci','Уфалираччи')|E]. Содружество крепко держало свои бескрайние плантации до самой [Concept('imperial_civil_war','Имперской гражданской войны')|E], когда торговля с закатными землями сошла на нет, а сами грады заполыхали от [Concept('wind_blades_rebellion','Восстания Ветряного Клинка')|E] и [Concept('five_captains_war','Войны пяти капитанов')|E]."
 game_concept_magaala_qaaday:0 "Магаала-Каадай"
 game_concept_magaala_qaaday_desc:0 "Магаала-Каадай — огромный град-муравейник, воздвигнутый на самой кромке [Concept('sarradon','Саррадонского')|E] Рога. Тонкая полоса черной земли в этих краях издавна славилась злыми паводками, кои бывают столь велики, что путник может утонуть, просто шагая по берегу. Предания говорят, будто тамошние купцы и зодчие Дадкавджи с помощью великих долгоногих крабов из соседних колен Илоходов подняли первое укрепленное селение высоко над океанским приливом. Град разрастался и со временем превратился в одну из важнейших гаваней на всем [Concept('pirate_coast','Пиратском побережье')|E], отчего его порой зовут «Столицей красок»."
 game_concept_gavan_coalition:0 "Коалиция Гавана"
 game_concept_gavan_coalition_desc:0 "Коалиция Гавана — пиратская армада, коя на рассвете одиннадцатого века на короткий срок установила полный досмотр и власть над всем [Concept('pirate_coast','Пиратском побережьем')|E]. На пике своей грозной силы коалиция под бунчуком капитана Гавана Железного Глаза водила более девяноста насадов и восемь тысяч отчаянных головорезов. Они люто собирали мыто и совершали набеги по всем морям без малого десять зим, прежде чем полностью рассеялись после гибели Железного Глаза при [Concept('siege_of_ufaliracci','Осаде Уфалираччи')|E]."
 game_concept_five_captains_war:0 "Война пяти капитанов"
 game_concept_five_captains_war_desc:0 "Война пяти капитанов — прозвание череды мелких раздоров и приграничных стычек, сотрясавших [Concept('pirate_coast','Пиратское побережье')|E] на протяжении двенадцатого и тринадцатого веков. Взяв начало то ли с [Concept('wind_blades_rebellion','Восстания Ветряного Клинка')|E] в 1193 году, то ли с убийства Адритти Дикого Огня в 1195 году, сии распри вознесли и сжили со свету десятки вожаков. Пять капитанов, кои выбились наверх в этой грызне за мореходное господство — Гинтинг Ветряной Клинок, Депарии Больная Крыса, Тоба Черная Скала, Ситепу Пустое Сердце и Пылающая Звезда Амиттравалли — оставили свой кровавый след в здешних водах на долгие десятилетия. Сия брань завершилась основанием хайтрапатни Пейтрель на Ночном поморье и гибелью капитанов Пустое Сердце и Ветряной Клинок от рук Пылающей Звезды Амиттравалли."
 game_concept_wind_blades_rebellion:0 "Восстание Ветряного Клинка"
 game_concept_wind_blades_rebellion_desc:0 "Восстание Ветряного Клинка — череда грозных рабских бунтов под предводительством Гинтинга Ветряного Клинка на бескрайних пашнях специй, коими владели [Concept('cinnamon_cities','Коричные города')|E]. Гинтинг, невольник, ослепленный своим господином еще в нежном возрасте и брошенный на съедение воронью, предал лютой казни прежнего палача-хозяина и множество иных владельцев плантаций с окрестных круч, освободив сотни рабов, пока знать пировала на богатой свадьбе. Грады-государства тщетно пытались подавить мятеж и даже призвали на помощь стоявший неподалеку девяносто пятый Легион «Виесуадос», но их рати были наголову разбиты третьего января 1200 года при попытке заманить войска Ветряного Клинка в засаду. Последовавшее за тем черное лихолетье [Concept('frodbrokna','Фродброкны')|E] в прах разнесло уклады власти Коричных городов, оставив многих их старшин мертвыми или вконец разоренными."
 game_concept_silver_palace:0 "Серебряный дворец"
 game_concept_silver_palace_desc:0 "Серебряный дворец был возведен великим кузнецом и песнопевцем Каттупу Джамирасом, девятым царем государства [Concept('ufaliracci','Уфалираччи')|E]. Сказания уверяют, будто на стройку палат ушло тридцать зим, а великие траты на его возведение навечно подорвали казну царей, закрепив торговую силу [Concept('cinnamon_cities','Коричных городов')|E] во всем крае. С той поры дворец был полностью разграблен подчистую и ныне являет собой лишь груду обломков на голом холме."
 game_concept_pirate_coast:0 "Пиратское побережье"
 game_concept_pirate_coast_desc:0 "Пиратское побережье — великий тропический архипелаг, раскинувшийся между [Concept('sarradon','Саррадонским')|E] Рогом и полуденной [Concept('kashirya','Каширией')|E]. Сей край издавна переходил из рук в руки — от богатых гостей до лихих корсаров, кои силились подмять под себя богатства, идущие из [Concept('aversaria','Аверсарии')|E], Катун-Кая, Каширии и остальных саррадонских долов. Некоторые державы в летописи сего поморья, такие как [Concept('ufaliracci','Уфалираччи')|E] или [Concept('cinnamon_cities','Коричные города')|E], оставили после себя долгий след в памяти поколений."
 game_concept_high_tide:0 "Прилив"
 game_concept_high_tide_desc:0 "Приливные волны на [Concept('sarradon','Саррадонском')|E] Роге известны своей силой: они способны затапливать обширные прибрежные регионы на глубину, достаточную, чтобы утопить человека. Когда вода уходит, это называется [Concept('low_tide','Отливом')|E]. В этот период графства приносят больше [Concept('income','дохода')|E] и дают большее [Concept('advantage','преимущество')|E], но это происходит в ущерб времени строительства [Concept('building','построек')|E] и [Concept('supply','припасам')|E]."
 game_concept_low_tide:0 "Отлив"
 game_concept_low_tide_desc:0 "Угольно-черные пески [Concept('sarradon','Саррадонского')|E] Рога резко контрастируют с синими водами [Concept('pirate_coast','Пиратского побережья')|E]. Графства во время отлива приносят меньше [Concept('income','дохода')|E] и дают меньшее [Concept('advantage','преимущество')|E], но при этом скорость строительства [Concept('building','построек')|E] увеличивается, а [Concept('supply','припасы')|E] возрастают."