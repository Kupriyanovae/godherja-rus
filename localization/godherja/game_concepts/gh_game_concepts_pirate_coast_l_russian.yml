l_russian:
 
 game_concept_ufaliracci:0 "Уфалираччи"
 game_concept_ufaliracci_desc:0 "Уфалираччи — [Concept('ritualism','ритуалистское')|E] государство, основанное торговцами, изгнанниками и мореходами, которые мигрировали с [Concept('sarradon','Саррадонского')|E] Рога дальше на запад, спасаясь от [Concept('war_in_heaven','Войны на небесах')|E|l]. С VI века оно росло и доминировало на [Concept('pirate_coast','Пиратском побережье')|E] вплоть до своего полного уничтожения во время [Concept('siege_of_ufaliracci','Осады Уфалираччи')|E]. Развившись из небольшого города-государства, Уфалираччи стало контролировать торговые потоки на перекрестке путей между [Concept('aversaria','Аверсарией')|E], Катун-Каем, южным Саррадоном и [Concept('kashirya','Каширией')|E]. Его могущество пошатнулось с началом [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E] на севере, а появление в регионе сильных пиратов и торговых коалиций — таких как [Concept('cinnamon_cities','Коричные города')|E], [Concept('gavan_coalition','Коалиция Гавана')|E] и [Concept('magaala_qaaday','Магаала-Каадай')|E] — бросило вызов верховенству ритуалистских монархов."
 game_concept_siege_of_ufaliracci:0 "Осада Уфалираччи"
 game_concept_siege_of_ufaliracci_desc:0 "Осада Уфалираччи, широко известная как «Штурм Кровавого Серебра», представляла собой 50-дневную осаду столицы [Concept('ufaliracci','Уфалираччи')|E] в начале XI века. После десятилетий упадка и коррупции, потери контроля над судоходными путями [Concept('cinnamon_cities','Коричных городов')|E], а также катастрофических последствий [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E] на севере, королевство Уфалираччи удерживало власть лишь над своей островной столицей. Могущественные пираты годами сеяли хаос на побережье, но никто из них не мог сравниться по силе с [Concept('gavan_coalition','Коалицией Гавана')|E]. Капитан Гаван Железный Глаз давно нацелился на [Concept('silver_palace','Серебряный дворец')|E] и в 1010 году обрушил всю мощь своего флота на столицу Уфалираччи. Могучие стены города держались 48 дней, пока маги Железного Глаза не раскололи саму землю, чтобы обрушить их. На пути к дворцу пираты Железного Глаза столкнулись с яростным и кровопролитным сопротивлением, но налетчики сжигали и грабили все на своем пути.\n\nКогда на 50-й день осады Железный Глаз наконец добрался до дворца, его силы сократились до нескольких десятков человек, а окружающий город лежал в руинах.\n\nКоролевская семья взялась за оружие вместе со стражей и слугами, чтобы отбить натиск пиратов. Говорят, что когда Гаван после истребления королевской семьи наконец подошел к трону, единственным выжившим оказался юный принц, стоявший перед престолом с ножом в руках. Сведений об этом мальчике не сохранилось, но легенды гласят, что он выколол Гавану глаза и заставил его съесть их на виду у всей команды. После осады Уфалираччи Коалиция Гавана погрязла в гражданской войне и распалась, оставив на побережье вакуум власти. Пока мелкие пираты и мелкие лорды сражались за разрозненные острова, век подошел к концу с прибытием первых морских легионов из [Concept('aversaria','Аверсарии')|E] в западную Роварску и пиком могущества [Concept('cinnamon_cities','Коричных городов')|E]."
 game_concept_cinnamon_cities:0 "Коричные города"
 game_concept_cinnamon_cities_desc:0 "Коричные города — коалиция городов-государств, контролировавшая торговлю специями на [Concept('pirate_coast','Пиратском побережье')|E] в XI–XIII веках после [Concept('siege_of_ufaliracci','Осады Уфалираччи')|E]. Поднявшись на средства и инвестиции нескольких влиятельных купцов, а также благодаря Каттупу Джамирасу, построившему [Concept('silver_palace','Серебряный дворец')|E], Коричные города начали агрессивную экспансию и захватили большую часть торговли специями, проходящей через Пиратское побережье. Используя щедрые взятки и обильные займы, эти города превзошли в богатстве даже [Concept('ufaliracci','Уфалираччи')|E]. Коалиция удерживала контроль над своими огромными плантациями вплоть до [Concept('imperial_civil_war','Имперской гражданской войны')|E], когда торговля с западом иссякла, а сами города столкнулись с [Concept('wind_blades_rebellion','Восстанием Ветряного Клинка')|E] и [Concept('five_captains_war','Войной пяти капитанов')|E]."
 game_concept_magaala_qaaday:0 "Магаала-Каадай"
 game_concept_magaala_qaaday_desc:0 "Магаала-Каадай — огромный мегаполис, построенный на самом краю [Concept('sarradon','Саррадонского')|E] Рога. Тонкий слой черной почвы Рога издавна известен своими паводками, достигающими таких масштабов, что человек может утонуть, просто идя по побережью. Говорят, что местные купцы и архитекторы Дадкавджи с помощью великих длинноногих крабов из соседних племен Илоходов подняли первоначальное укрепленное поселение выше уровня океанского прилива. Город продолжал расширяться и в итоге стал одним из важнейших портов на [Concept('pirate_coast','Пиратском побережье')|E], из-за чего его порой называют «Столицей красок»."
 game_concept_gavan_coalition:0 "Коалиция Гавана"
 game_concept_gavan_coalition_desc:0 "Коалиция Гавана — пиратская армада, которая в начале XI века на короткое время установила полный контроль над [Concept('pirate_coast','Пиратским побережьем')|E]. На пике своего могущества коалиция под предводительством капитана Гавана Железного Глаза насчитывала более 90 кораблей и 8000 пиратов. Они жестоко собирали пошлины и совершали набеги по всем морям на протяжении почти 10 лет, прежде чем полностью распались после смерти Железного Глаза во время [Concept('siege_of_ufaliracci','Осады Уфалираччи')|E]."
 game_concept_five_captains_war:0 "Война пяти капитанов"
 game_concept_five_captains_war_desc:0 "Война пяти капитанов — название серии мелких конфликтов и стычек, сотрясавших [Concept('pirate_coast','Пиратское побережье')|E] на протяжении XII и XIII веков. Начавшись либо с [Concept('wind_blades_rebellion','Восстания Ветряного Клинка')|E] in 1193 году, либо с убийства Адритти Дикого Огня в 1195 году, эти конфликты привели к возвышению и падению десятков пиратов. Пять капитанов, оказавшихся на вершине этой борьбы за господство — Гинтинг Ветряной Клинок, Депарии Больная Крыса, Тоба Черная Скала, Ситепу Пустое Сердце и Пылающая Звезда Амиттравалли — оставили свой след в регионе на десятилетия вперед. Война пяти капитанов завершилась основанием хайтрапатни Пейтрель на Ночном побережье и гибелью капитанов Пустое Сердце и Ветряной Клинок от рук Пылающей Звезды Амиттравалли."
 game_concept_wind_blades_rebellion:0 "Восстание Ветряного Клинка"
 game_concept_wind_blades_rebellion_desc:0 "Восстание Ветряного Клинка — серия рабских бунтов под предводительством Гинтинга Ветряного Клинка на бескрайних плантациях, контролируемых [Concept('cinnamon_cities','Коричными городами')|E]. Гинтинг, раб, ослепленный своим господином ещё в детстве и оставленный умирать, казнил своего бывшего хозяина и множество других владельцев плантаций с окрестных холмов, освободив сотни рабов, пока знать праздновала свадьбу. Города-государства безуспешно пытались подавить восстание и даже обратились за помощью к близлежащему Легиону XCV «Виесуадос», но их объединенные силы были наголову разбиты 03.01.1200 при попытке устроить засаду на войска Ветряного Клинка. Последовавший за этим хаос [Concept('frodbrokna','Фродброкны')|E] практически уничтожил структуру власти Коричных городов, оставив многих их лидеров мертвыми или разоренными."
 game_concept_silver_palace:0 "Серебряный дворец"
 game_concept_silver_palace_desc:0 "Серебряный дворец был построен великим кузнецом и поэтом Каттупу Джамирасом, 9-м монархом королевства [Concept('ufaliracci','Уфалираччи')|E]. Говорят, что на строительство дворца ушло 30 лет, а колоссальные расходы на его возведение навсегда закрепили торговое могущество [Concept('cinnamon_cities','Коричных городов')|E] во всем регионе. С тех пор дворец был полностью разграблен и сейчас представляет собой не более чем руины на пустом холме."
 game_concept_pirate_coast:0 "Пиратское побережье"
 game_concept_pirate_coast_desc:0 "Пиратское побережье — крупный тропический архипелаг, расположенный между [Concept('sarradon','Саррадонским')|E] Рогом и южной [Concept('kashirya','Каширией')|E]. Этот регион издавна переходил из рук в руки — от могущественных купцов к пиратам, стремившимся контролировать богатства, идущие из [Concept('aversaria','Аверсарии')|E], Катун-Кая, Каширии и остальной части Саррадона. Некоторые государства в истории региона, такие как [Concept('ufaliracci','Уфалираччи')|E] или [Concept('cinnamon_cities','Коричные города')|E], оставили после себя долгое наследие."
 game_concept_high_tide:0 "Прилив"
 game_concept_high_tide_desc:0 "Приливные волны на [Concept('sarradon','Саррадонском')|E] Роге известны своей силой: они способны затапливать обширные прибрежные регионы на глубину, достаточную, чтобы утопить человека. Когда вода уходит, это называется [Concept('low_tide','Отливом')|E]. В этот период графства приносят больше [Concept('income','дохода')|E] и дают большее [Concept('advantage','преимущество')|E], но это происходит в ущерб времени строительства [Concept('building','построек')|E] и [Concept('supply','припасам')|E]."
 game_concept_low_tide:0 "Отлив"
 game_concept_low_tide_desc:0 "Угольно-черные пески [Concept('sarradon','Саррадонского')|E] Рога резко контрастируют с синими водами [Concept('pirate_coast','Пиратского побережья')|E]. Графства во время отлива приносят меньше [Concept('income','дохода')|E] и дают меньшее [Concept('advantage','преимущество')|E], но при этом скорость строительства [Concept('building','построек')|E] увеличивается, а [Concept('supply','припасы')|E] возрастают."
 