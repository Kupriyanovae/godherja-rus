 game_concept_the_fratricide_fix:0 "Братоубийство"
 game_concept_the_fratricide_war_fix:0 "Братоубийственная война"
 game_concept_the_fratricide_war_fix_desc:0 "Гражданская война, охватившая [Concept('mamuramat','мамурамат')|E] между 961 и 967 гг. от И.С. Этот затяжной конфликт вспыхнул между сыновьями мамура Юсуфа, скончавшегося в 956 году от И.С. Его старший сын, Эссаид, взошел на престол согласно воле отца. Однако решение Юсуфа наделить двух младших сыновей, Муктафи и Ка'ида, обширными землями и статусом соправителей быстро привело к раздору. В 961 году Эссаид отправил своего главного министра Аль-Баракви с небольшим отрядом, чтобы арестовать Муктафи. Шаг этот превратил тлеющую вражду в полномасштабную войну: Муктафи наголову разбил присланное войско и убил министра. Кульминацией противостояния стала изнурительная годичная осада столицы, обернувшаяся жестокими уличными боями, в которых регулярные полки сражались бок о бок с городскими ополченцами. В 966 году объединенные рати Муктафи и Ка'ида пленили старшего брата и тут же казнили его, отрубив голову. Впрочем, боевые действия прекратились лишь в 967 году от И.С., поскольку некоторые генералы Эссаида наотрез отказывались сложить оружие. Эта война стала первым крупным внутренним потрясением в мамурамате со времён [Concept('the_downfall','Падения')|E], пошатнувшим сами основы верховной власти. Потеря большей части казны, собранной отцом, оставила братьев-победителей в глубоких долгах, из-за чего мамурамат попал в кабалу к [Concept('aversaria','аверсарианских')|E] и [Concept('marchers','марочникских')|E] кредиторам."
 
 #CHARACTERS
 
 game_concept_usun_bishabelik:0 "Усун Бишабелик"
 game_concept_usun_bishabelik_desc:0 "Один из самых неоднозначных деятелей в ранней истории [Concept('wardenism','варденизма')|E]. Изначально Усун был грозой [Concept('great_uprising','Великого восстания')|E] и одним из немногих [Concept('ritualism','ритуалистских')|E] военачальников, кому регулярно удавалось отражать натиск варденитов. Зловещую славу ему принесло участие — а возможно, и прямое руководство — в расправах над верующими, включая Дхилестийскую резню и чистку в Кадайе. Тем большим потрясением как для молодой варденитской общины, так и для его союзников-ритуалистов стал случай, когда в 302 году от И.С. Усун согласился на переговоры с самим [Concept('the_first_warden','Первым Варденом')|E] и всенародно принял варденизм. Его последующий яростный поход против бывших соратников вверг лагерь ритуалистов в хаос, благодаря чему вардениты хлынули по всему [Concept('sarradon','Сarradonу')|E]. Споры о мотивах Усуна не утихают по сей день. Одни летописцы изображают его человеком, который ужаснулся собственным злодеяниям и отчаянно искал искупления в святом деле. Другие видят в нем лишь расчетливого и беспринципного вождя, использовавшего новую веру как предлог, чтобы выкроить личный удел из беззащитных земель своих прежних союзников. Истина, скорее всего, навсегда утеряна для истории."

 game_concept_sanad:0 "Санад"
 game_concept_sanad_desc:0 "Поэтесса, воительница, героиня и изгнанница, Санад — пожалуй, самая значимая женщина в [Concept('sarradon','саррадонской')|E] истории после [Concept('the_decimation_of_sarradon','Халакдуна')|E]. Ныне ее почитают как матерь современного [Concept('mamuramat','мамурамата')|E]. Она была дочерью и единственной выжившей наследницей восточного мамура аль-Худи. Все ее родичи, вплоть до пятого колена, сгорели в пламени магической ярости. Историки видят в этом знак того, что аль-Худи стал главной мишенью для [Concept('ritualism','ритуалистских')|E] [Concept('magi','магов')|E], накликавших на страну [Concept('the_decimation_of_sarradon','Истребление')|E]. Вынужденная сражаться за жизнь, Санад, которую никогда не учили ратному делу, проявила редкий дар полководца. Она сплотила остатки войск своего дома, когда Восточный мамурамат отбивался едва ли не на дюжине фронтов. Увы, врагов было слишком много, и сокрушительное поражение в битве при Азареке вынудило ее бежать на чужбину, пока родное государство рушилось в прах. Прибыв в 810 году от И.С. ко двору новоиспеченного Центрального мамура [Concept('tathtali','Татхтали')|E], она обменяла свои спорные права на трон на военный союз, скрепленный браком. И хотя именно Санад до мелочей продумала походы за отвоевание Востока, силы объединенного мамурамата уходили на борьбу с неурядицами внутри страны, обострившимися в хаосе [Concept('the_downfall','Падения')|E]. Вернуть удалось лишь несколько приграничных земель. Она мирно скончалась в 832 году от И.С., но ее влияние на обычаи и законы современного варденизма ощущается и поныне."

 game_concept_tathtali:0 "Татхтали"
 game_concept_tathtali_desc:0 "Первый из [Concept('the_decimation_of_sarradon','послеистребительных')|E] мамуров, #BOL Татхтали#! правил пятьдесят шесть лет. При нем устройство [Concept('mamuramat','мамурамата')|E] изменилось до неузнаваемости, что преобразило и основы всей [Concept('wardenism','варденитской')|E] веры. Отныне мамур больше не правил как равный среди равных — он провозглашался священным самодержцем, призванным оберегать правоверных. По крайней мере, такова была задумка. На деле же этим притязаниям то и дело мешали мятежи, а огромные траты на содержание разросшейся казны и двора со временем вынудили мамурамат отдавать прибрежные земли под залог как [Concept('marchers','марочникам')|E], так и [Concept('aversaria','аверсарианцам')|E].\n\nЧто касается самого Татхтали, многие летописцы признают его правление успешным перед лицом нарастающей анархии [Concept('the_downfall','Падения')|E]. Он взошел на престол в 809 году от И.С., победив и убив в междоусобной войне собственного отца, обезумевшего от чародейства. Его брак с [Concept('sanad','Санад')|E] и их согласное совместное правление до сих пор воспевают поэты и певцы. Неудивительно, что нынешнее «основное» течение варденизма носит его имя, а самого Татхтали почитают как второго основателя веры."

 game_concept_fourth_mamur:0 "Четвёртый мамур"
 game_concept_far_eastern_mamur:0 "Дальневосточный мамурамат"
 game_concept_fourth_mamur_desc:0 "Некоторые [Concept('wardenism','вардениты')|E] признают существование четвертого [Concept('mamuramat','мамура')|E] — этот титул на далеком востоке изначально закрепился за [Concept('ritualism','ритуалистским')|E] военачальником, ставшим варденитским неофитом, [Concept('usun_bishabelik','Усуном Бишабеликом')|E]. Усун уверял, будто [Concept('the_first_warden','Первый Варден')|E] лично велел ему вести воинство, дабы гнать ритуалистов до самой Каширии — на это служение он положил остаток своей девяностолетней жизни. Его приемный сын Убайдар стал последним, кто носил этот титул. Он бесследно сгинул вместе с армией, насчитывавшей, по слухам, десять тысяч воинов, во время предполагаемой [Concept('gedeora','гедеоры')|E] в 409 году от И.С. Лишившись враз и вождя, и войска, его и без того шаткие владения распались в одночасье, и с тех пор никто убедительно не заявлял прав на этот престол.\n\nИз-за сомнений в подлинности наказов, данных Усуну Бишабелику, Дальневосточный мамурамат по большей части обделяли вниманием, и немногие вардениты сегодня вспоминают о нем иначе как о красивом героическом сказании."

 game_concept_high_judge_fix:0 "Верховный судья"
 game_concept_high_judge_fix_desc:0 "В [Concept('wardenism','варденизме')|E] обязанности священника и судейского чиновника соединены в одном лице — судье. В большинстве городов есть хотя бы один судья для разбора тяжб, а в крупных узлах их могут служить десятки или даже сотни. В их обязанности входит толкование сложнейших сводов варденитских религиозных законов: они вершат правосудие и выслушивают просителей. Поскольку варденитские кодексы охватывают как уголовные дела, так и споры об имуществе или торговле, труд судьи тяжек и требует долгих лет учения.\n\nСудьи, стяжавшие признание и мудрость, могут рассчитывать на назначение [Concept('high_judge','Верховным судьёй')|E], получая власть над всеми нижестоящими судьями — по крайней мере, в теории. На деле же расхождение правовых обычаев за долгие годы привело к тому, что на этот титул притязают не менее трех Высших судов, не признающих законность друг друга. Основной Высший суд назначается [Concept('mamuramat','мамуром')|E]. В противовес ему Традиционалистский суд вырос «снизу вверх» — его сторонники утверждают, что лишь временно держат власть, ожидая возвращения мамурамата к его исконным границам. У Идеалистов же действует свой независимый суд: они сами одобряют кандидатов в свою коллегию по совету лучших нижестоящих судей, позиционируя себя как постоянный и свободный орган."

 game_concept_arachas:0 "Арахас"
 game_concept_arachas_desc:0 "Стяжавший дурную славу правитель Восточного острова, Арахас вошел в историю как законченный злодей из-за своей роли в сказаниях о зарождении [Concept('wardenism','варденизма')|E]. Даже сами [Concept('ritualism','ритуалисты')|E] мало что сделали для его оправдания: его жестокое правление и нежелание видеть угрозу со стороны [Concept('great_uprising','Великого восстания')|E] часто приводят в пример как причины, позволившие варденитской вере окрепнуть. Арахас пал после пяти лет войны в 302 году от И.С. Говорят, его собственные воины сочли за благо зарыть его тело в безымянной могиле, и точное место его гибели ныне забыто.\n\nВопрос о том, почему Арахас бросил [Concept('the_first_warden','Первого Вардена')|E] в подземелье, до сих пор вызывает споры. На этот счет есть два главных мнения:\n\nПервое, излюбленное бродячими сказителями и поэтами, гласит, что Арахас возвращался с охоты и заприметил в городе прекрасную девушку, в которую безумно влюбился. Чтобы избавиться от помехи, он велел бросить ее мужа — будущего Первого Вардена — за решётку. Опасаясь бесчестья, гордая женщина заколола себя прямо на рыночной площади во время ареста супруга или вскоре после него.\n\nВторое мнение, признаваемое серьезными летописцами как варденитского, так и ритуалистского толка, гласит, что будущий Первый Варден просто оказался не в то время не в том месте. Из-за частых войн за саррадонский престол Арахас постоянно сидел без денег. В имуществе добродетельного (хоть ритуалисты это и оспаривают) молодого купца он видел лишь очередной пожиток, который можно пустить в оборот ради своих замыслов. Дерзкий отказ платить Арахасу «дань» обеспечил юноше место в самом мрачном каземате крепости. Его последующее освобождение, скорее всего, было уловкой военачальника, надеявшегося выведать, где купец спрятал оставшееся золото, — Арахас ждал, что узник попытается сбежать с острова со своим добром. Вместо этого купец поднял Великое восстание и предрешил судьбу тирана."

 game_concept_raqiyya:0 "Ракийя"
 game_concept_raqiyyas:0 "Ракийи"
 game_concept_raqiyya_desc:0 "Знаменитая толковательница законов и богослов раннего [Concept('wardenism','варденизма')|E]. Ракийя, племянница Утсуфа б. Иблида, второго [Concept('mamuramat','мамура')|E] Запада, родилась в 382 году от И.С. Выросшая среди варденитских владык и мудрецов, она с юности выказывала острый ум и редкий дар к разбору законов. За шестьдесят два года жизни она наводнила книгохранилища бесчисленными пояснениями к Законам Первого Вардена, а также разборами решений первых судей и мамуров. Признанная одаренной еще при жизни, в последующие века она обрела непререкаемое признание. Сегодня она считается одним из самых влиятельных [Concept('high_judge','правоведов')|E] в вере после самого Первого Вардена. Ее труды столь монументальны, беспристрастны и глубоки, что изучаются во всех трех Великих школах варденизма. Ученые мужи отмечают, что гений Ракийи заключался не только в том, что она мудро держалась в стороне от дрязг своей эпохи, но и в ее способности предвидеть те распри, которым суждено было вспыхнуть лишь спустя века после ее кончины."
 
 #ORGANIZATIONS
 
 game_concept_mamur:0 "Мамур"
 game_concept_mamuramat:0 "Мамурамат"
 game_concept_mamuramat_desc:0 "Мамурамат, средоточие варденитской веры, соединяет в себе бремя судьи, военачальника и государя, а его исконные обязанности охватывают как мирские, так и духовные дела. Первые мамуры были наместниками самого Первого Вардена и предводителями Великого восстания. Имена и точное число этих вождей вызывают споры, но официальные летописи современного мамурамата утверждают, что их было ровно трое. Впрочем, эта версия часто оспаривается: многие вардениты называют ее упрощением или даже ложью. До наших дней уцелел лишь Центральный мамурамат, оставшийся в одиночестве после падения восточного и западного собратьев. Нынешние правители заявляют, что унаследовали власть павших братьев по оружию, однако щепетильные в вопросах права вардениты до сих пор спорят, дозволено ли такое преемство по закону."

 #LOCATIONS

 #MISC

 game_concept_the_great_uprising_legal_tradition:0 "Великое восстание (Правовая эпоха)"
 game_concept_the_great_uprising_legal_tradition_desc:0 "Старейшие правовые обычаи восходят к мужчинам и женщинам, сражавшимся плечом к плечу с самим Первым Варденем. Лишь немногие из этих школ дожили до наших дней, но их первые юридические труды по-прежнему глубоко почитаются в современном варденизме."

 game_concept_the_establishment_legal_tradition:0 "Эпоха Становления (Правовая эпоха)"
 game_concept_the_establishment_legal_tradition_desc:0 "Время, берущее начало со смерти Лейлы а'Усьяр в 392 году от И.С. Ее почитают как последнюю из живых, кто лично знал Первого Вардена; ее уход знаменует смену поколений Великого восстания. В эту пору варденизм закрепился в ключевых землях Саррадона. Тогда же началось складывание постоянных правовых школ, когда вардениты перешли от завоевания земель к поиску путей управления ими."

 game_concept_the_traditional_golden_age_legal_tradition:0 "Традиционный золотой век (Правовая эпоха)"
 game_concept_the_traditional_golden_age_legal_tradition_desc:0 "Период, длившийся от окончания Речных войн в 465 году от И.С. до упразднения Западного мамурамата в 678 году от И.С. Эта эпоха пользуется особым почетом у Традиционалистской школы, ведь то было время независимого правления трех мамуров. К тем векам восходит большая часть их законов."

 game_concept_the_age_of_ink_and_gold_legal_tradition_fix:0 "Век Чернил и Золота (Правовая эпоха)"
 game_concept_the_age_of_ink_and_gold_legal_tradition_fix_desc:0 "Эра, тянувшаяся с момента падения Западного мамурамата в 678 году до пресловутого 802 года. Хотя Запад пал, Центральные и Восточные мамуры процветали. Именно тогда расцветает высокая судейская культура, поскольку два двора соперничали друг с другом, переманивая книжников и мастеров искусств. Толкователи плодились один за другим: учение, попавшее в опалу у одного мамура, нарочно поддерживалось его соперником. В этот же век традиционализм начал отделяться от основного течения А'Бадджармия. Само это слово впервые пустила в обиход ученая Лайлам бинт Ашафара в 732 году. Хотя она задумывала его как колкость, оно быстро прижилось среди несогласных книжников, недовольных растущим всевластием мамуров."

 game_concept_the_age_of_tathtali_legal_tradition:0 "Эпоха Татхтали (Правовая эпоха)"
 game_concept_the_age_of_tathtali_legal_tradition_desc:0 "Халакдун (Истребление) мог погубить варденитов, но стал горнилом, из которого вышло нечто иное — и, по мнению А'Бадджармии, более крепкое. В эту пору, длившуюся до конца правления преемника Татхтали, Усмана, в 874 году, сан мамура окончательно превратился в подобие абсолютного монарха. В эти годы традиционалисты-табакаиты открыто порвали со своими прежними соратниками из А'Бадджармии, когда те полностью посвятили себя законам единого мамурамата. Дурным знамением стало и то, что в это же время тайные братства, отвергавшие саму мысль о мамуре, начали заключать союзы на дальних окраинах государства."

 game_concept_the_abajjarmia_golden_age_legal_tradition:0 "Золотой век А'Бадджармии"
 game_concept_the_abajjarmia_golden_age_legal_tradition_desc:0 "Иногда эти годы зовут Эпохой Углей — насмешливое прозвище, данное критиками могущественного мага-мамура Ради ибн Мустасима за его речи о пришествии новой «Эпохи Огня» в Саррадоне. Под покровительством обретших силу владык главная школа достигла небывалых высот, пока наследники Татхтали пытались разнести свое учение во все углы варденитского мира. Период длился с 874 года примерно до 1155 года, когда восстание в Тель-Мерхе породило третью, самую молодую ветвь варденизма."

 game_concept_the_era_of_dissent_legal_tradition:0 "Эпоха Инакомыслия"
 game_concept_the_era_of_dissent_legal_tradition_desc:0 "Начавшись с разлада в Катсите и сопутствующего восстания в Тель-Мерхе в 1155 году от И.С., эта эра пошатнула власть мамурамата на всех рубежах. Хотя внутренние распри помешали катситам перенести войну в сердце мамурамата, ни Ради, ни его преемники так и не сумели вернуть под свою руку провинцию Урагад и отступников-Идеалистов, превративших ее в свой оплот."

 game_concept_the_modern_era_legal_tradition:0 "Новейшее время"
 game_concept_the_modern_era_legal_tradition_desc:0 "Этот период отсчитывают либо от укоренения Затмалии, либо от начала Священной войны, либо от Фродброкны — смотря по тому, чьи летописи вы читаете. История варденизма в новейшее время еще пишется. Рухнет ли мамурамат под бременем собственного раздутого судейского сословия? Поднимутся ли новые вожди, дабы отобрать древние титулы у наследников Татхтали? Смогут ли выходцы из Тель-Мерхи вновь сплотить республику и хлынуть из своих крепостей, дабы свергнуть тирана в Эн-Нусриккаре?\n\nВсе это еще только предстоит увидеть."


