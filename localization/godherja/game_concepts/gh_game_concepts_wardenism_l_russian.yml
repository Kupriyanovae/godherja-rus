 #HISTORICAL EVENTS/CONCEPTS
 
 game_concept_era_of_admin:0 "Эпоха Наместничества"
 game_concept_era_of_admin_desc:0 "Идеализированная «вторая» эпоха стражничества, следующая за окончанием [Concept('era_of_insurrection','Эпохи Мятежа')|E]. Эпоха Наместничества — это время, которое наступит после того, как стражничество утвердит законы [Concept('the_first_warden','Первого Стража')|E] по всему миру (или, по крайней мере, на значительной и стабильной его части) и гарантирует, что Столпы Добродетели будут управляться без каких-либо угроз и опасностей. Верующие утверждают, что это будет время справедливости и закона, однако некоторые стражники идут ещё дальше, заявляя, будто Эпоха Наместничества станет раем, где все люди будут жить в счастье и изобилии. Школа А'Бадджармия и многие традиционалистские школы трактуют Эпоху Наместничества скорее как идеальное состояние управления, нежели как грядущий отдельный исторический период. Радикальные переосмысления этой концепции привели к ряду весьма разрушительных милленаристских восстаний на протяжении истории стражничества (в 520, 803, 807, 810, 812 и 1111 гг.).\n\nОдно из главных расхождений во мнениях со стороны школы Идеалистов заключается в том, что Эпоха Наместничества уже началась, но верующие стражники об этом ещё не знают. Их понимание этого времени также гораздо более ограничено по своим масштабам, и они отвергают идею о том, что оно станет раем — по крайней мере, на первоначальном этапе."
 
 game_concept_era_of_insurrection:0 "Эпоха Мятежа"
 game_concept_era_of_insurrection_desc:0 "Также известная как Эпоха Завоеваний, это «первая» эпоха в эсхатологической теории стражничества, и большинство стражников верят, что они всё ещё живут в ней. Этот период наполнен борьбой за господство на просторах Саррадона, пока верные стражники сражаются против несправедливости, греха и зла. Поступая так, они высекают царство, где смогут вершить законы [Concept('the_first_warden','Первого Стража')|E], дабы обеспечить спасение человечества от Капюшонного Узника. Большинство стражников называют [Concept('great_uprising','Великое восстание')|E] началом этой великой эпохи, хотя несколько сект, склонных придавать большее религиозное значение самому Первому Стражу, иногда утверждают, что она началась с его рождения."
 
 game_concept_great_uprising:0 "Великое восстание"
 game_concept_great_uprising_desc:0 "Великое восстание, начавшееся в 296 году, — это название, используемое ныне [Concept('wardenism','стражниками')|E] для обозначения бунта под предводительством [Concept('the_first_warden','Первого Стража')|E] против военачальника [Concept('arachas','Арахаса')|E], а впоследствии и против всего [Concept('ritualism','ритуалистского')|E] уклада. Поначалу бушевавшее лишь на востоке [Concept('sarradon','Саррадона')|E], Восстание распространилось подобно лесному пожару после спорного обращения ритуалистского военачальника [Concept('usun_bishabelik','Усуна Бишабелика')|E] в 302 году, которое превратило то, что казалось верной победой ритуалистов над стражниками, в практически мгновенный разгром их сил. Обезопасив восток в качестве своего главного оплота, стражники смогли уверенно начать вторжение на остальную часть континента, разжегши пожар по всему Саррадону в ходе конфликта, который станет известен как [Concept('war_in_heaven','Война на небесах')|E]."
 game_concept_mazfarun_dawl:0 "Мизфарун Давл"