 #Tusuffnas
 game_concept_tusuffna:0 "Тусуффна"
 game_concept_tusuffna_desc:0 "Изначально тусуффна были духовными братствами и сестричествами, собиравшими благородную варденитскую молодёжь. Хотя двигали ими высокие помыслы, горячим головам не хватало твердой руки, что то и дело приводило к жестоким и бессмысленным междоусобицам. В срединных землях варденизма в них видят либо образец для юношества, либо обузу для мирных граждан, но былого веса в делах правления они там не имеют.\n\nЗато на окраинах варденитского мира возникли тайные мистические ордена, которые быстро прибрали к рукам местных тусуффна. Со временем само слово «тусуффна» стало означать как бродячих мистиков, так и ватаги впечатлительных юнцов. Везде, где крепли подобные союзы, тусуффна превращались во влиятельную силу. Самые удачливые из них прочно обосновались в приграничье, породив полунаследственные дома новой знати."

 game_concept_tusoffikia:0 "Ту’соффик’ия"
 game_concept_tusoffikia_desc:0 "Ту’соффик’ия — одно из братств-тусуффна, зародившееся в Айяре; его мистики приложили руку к обращению в веру большей части этого края. Они переняли ритуалистские сказания о Софокосе, используя образ «Внутреннего Софокоса» в своих обрядах. Они учат, будто ревностный верующий может стяжать великую благодать, если с молитвой одолеет каждую из 1001 Ступени, кои в их толковании безводно знаменуют постулаты Законов Вардена. Впрочем, по их заверениям, можно найти пользу и в «подъемниках» Софокоса, предаваясь глубоким раздумьям. Так люди могут чтить главные Столпы добродетели и достичь вершины, даже не принимая варденизм целиком. Эти речи помогли им привлечь под свои знамёна множество местных ритуалистов, со временем обратив их в истинную веру. Заслуги в крещении Айяра укрепили положение ордена, а их многочисленные амиры накопили сказочные богатства и влияние."

 game_concept_tuayyaria:0 "Ту’айяр’ия"
 game_concept_tuayyaria_desc:0 "Это крайне суровое братство выросло из воинских обычаев Аузангеба. Они проповедуют учение, по которому высшее очищение духа невозможно без полного подчинения плоти и чувств. По их заверениям, истинные Столпы добродетели кроются не в писаных законах судей, а в закалке собственной воли, благодаря которой человек следует правде инстинктивно. Это касается как телесных вожделений, так и душевных порывов.\n\nПо этой причине они известны изнурительными телесными испытаниями и строгим отрешением от всего мирского. Их пророческие видения часто приходят в минуты полного беспамятства от истощения. И хотя они не бегут от общества, приверженцы ордена стараются держаться в стороне от его соблазнов. Видеть ту’айярских дворян, стоически отказывающихся от хмельного посреди роскошного пира, — дело привычное.\n\nОни не запираются в монастырях, но их неразрывная связь с воинским духом приводит к тому, что их братья чаще всего находят свое место в рядах армии."

 game_concept_tudaribaria:0 "Ту’дарибар’ия"
 game_concept_tudaribaria_desc:0 "Братство, берущее начало в срединных землях варденизма. Его члены утверждают, что повседневные труды простых варденитов, хоть и подпирают Столпы добродетели, никогда не излечат их внутреннюю порчу. Эта тягота ложится на плечи Ту’дарибар’ии: ее братьям нужно не просто чтить Закон Вардена, но и нести дополнительные труды ради укрепления пошатнувшихся Столпов. Для этого они налагают на себя строгие обеты и собираются вместе ради праведных трудов.\n\nОднако одних лишь трудов мало без истинного познания мира. Они несут это знание через мудрые стихи, полные иносказаний и загадок. Молодым ученикам то и дело приходится разгадывать эти ребусы, дабы научиться зрить тайны бытия. И если эта богатая поэзия служит им на тайных сходках, то в остальное время их стихи открыты для всеобщего услаждения.\n\nПусть они и не ищут громкой славы, их строгая приверженность вере помогла им снискать почет у большинства варденитских государей. В особенности их мудрецов-энигматистов рады видеть при любом дворе, ведь их загадки тешат придворных, сочетаясь с высоким качеством их искусства."

