 #MISC

 game_concept_the_great_uprising_legal_tradition:0 "Великое восстание (Правовая эпоха)"
 game_concept_the_great_uprising_legal_tradition_desc:0 "Старейшие правовые традиции восходят к мужчинам и женщинам, сражавшимся бок о бок с самим Первым Стражем. Лишь немногие из них до сих пор существуют как целостные школы, однако их новаторские юридические труды по-прежнему оказывают мощное влияние на современное стражничество."
 
 game_concept_the_establishment_legal_tradition:0 "Эпоха Становления (Правовая эпоха)"
 game_concept_the_establishment_legal_tradition_desc:0 "Период, берущий начало примерно со смерти Лейлы а'Усьяр в 392 году от И.С. — её почитают как последнего живого человека, лично знавшего Первого Стража, что принято считать вехой ухода поколения, сражавшегося во время Великого восстания. В эпоху Становления стражничество закрепилось в ключевых регионах Саррадона. В этот же период начала зарождаться система целостных правовых школ, когда стражники перешли от завоевания Саррадона к поиску методов управления им."
 
 game_concept_the_traditional_golden_age_legal_tradition:0 "Традиционный золотой век (Правовая эпоха)"
 game_concept_the_traditional_golden_age_legal_tradition_desc:0 "Период, длившийся от окончания Речных войн в 465 году от И.С. до упразднения Западного мамурамата в 678 году от И.С. Эта эпоха пользуется особым почтением со стороны Традиционалистской школы, поскольку это было время независимого правления трёх мамуров. Именно к этому периоду восходит большая часть их правового корпуса."

 game_concept_the_age_of_ink_and_gold_legal_tradition:0 "Век Чернил и Золота (Правовая эпоха)"
 game_concept_the_age_of_ink_and_gold_legal_tradition_desc:0 "Эра, продолжавшаяся с момента падения Западного мамурамата в 678 году до пресловутого 802 года. Хотя Запад рухнул, мамуры Центра и Востока процветали в этот период. Именно в это время зарождается высокая судебная и правовая культура стражников, поскольку два мамура соперничали друг с другом за привлечение учёных и деятелей искусства. В эту эпоху школы множились как кролики, так как учение, оказавшееся в опале при дворе одного мамура, часто намеренно поддерживалось при конкурирующем дворе. В этот же век традиционализм начал отделяться от основного течения А'Бадджармия. Само это слово впервые ввела в обиход учёная Лайлам бинт Ашафара в 732 году. Хотя она задумывала его как оскорбление, оно быстро прижилось среди диссидентствующих учёных, несогласных с растущим могуществом мамуров."

 game_concept_the_age_of_tathtali_legal_tradition:0 "Эпоха Татхтали (Правовая эпоха)"
 game_concept_the_age_of_tathtali_legal_tradition_desc:0 "Халакдун (Истребление) мог стать смертельным ударом для стражников, но вместо этого он послужил горнилом, из которого вышло нечто совершенно иное — и, по мнению А'Бадджармии, более сильное. В эту эпоху, длившуюся до конца правления наследника Татхтали, Усмана, в 874 году, титул мамура формально трансформировался в нечто близкое к абсолютному монарху. Именно в этот период традиционалисты-табакаиты официально разорвали связи со своими прежними соратниками из А'Бадджармии, когда последние окончательно посвятили себя проекту юридического закрепления новоявленного единого мамурамата. Зловещим знамением стало и то, что в это же время разрозненные и часто находившиеся под запретом школы, полностью отвергавшие саму идею мамура, впервые начали создавать между собой тайные союзы, укореняясь на периферии территорий мамурамата."
 
 game_concept_the_abajjarmia_golden_age_legal_tradition:0 "Золотой век А'Бадджармии"
 game_concept_the_abajjarmia_golden_age_legal_tradition_desc:0 "Иногда этот период называют Эпохой Углей — насмешливое прозвище, придуманное критиками могущественного и пресловутого мага-мамура Ради ибн Мустасима за его заявления о создании новой «Эпохи Огня» в Саррадоне. Под покровительством обретших новую силу мамуров основная школа достигла небывалых высот, пока наследники Татхтали пытались распространить свою новую идеологию во все уголки стражнического мира. Этот период продолжался с 874 года примерно до 1155 года, когда восстание в Тель-Мерхе привело к рождению третьей и самой молодой традиции стражничества."

 game_concept_the_era_of_dissent_legal_tradition:0 "Эпоха Инакомыслия"
 game_concept_the_era_of_dissent_legal_tradition_desc:0 "Начавшись с событий, ставших известными как Катситское диссидентство, и сопутствующего восстания в Тель-Мерхе в 1155 году от И.С., эпоха Инакомыслия пошатнула идеологию имперского контроля мамурамата на всех фронтах. Хотя внутренние расколы помешали катситам перенести свой вызов в само сердце мамурамата, ни Ради, ни его преемники так и не смогли вернуть в лоно государства провинцию Урагад и еретиков-Идеалистов, превративших её в свой оплот."
 
 game_concept_the_modern_era_legal_tradition:0 "Новейшее время"
 game_concept_the_modern_era_legal_tradition_desc:0 "Этот период отсчитывают либо от укоренения Затмалии, либо от начала Священной войны, либо от Фродброкны — в зависимости от того, чьи именно труды вы читаете. История стражничества в новейшее время ещё не написана. Рухнет ли мамурамат под тяжестью собственного раздутого юридического аппарата? Поднимутся ли новые претенденты, чтобы отобрать древние титулы у наследников Татхтали? Смогут ли выходцы из Тель-Мерхи вновь объединить республику и хлынуть из своих цитаделей, чтобы свергнуть Тирана в Эн-Нусриккаре?\n\nЭто ещё только предстоит увидеть."


