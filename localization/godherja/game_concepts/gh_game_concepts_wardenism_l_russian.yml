 game_concept_the_fratricide:0 "Братоубийство"
 game_concept_the_fratricide_war:0 "Братоубийственная война"
 game_concept_the_fratricide_war_desc:0 "Гражданская война, охватившая [Concept('mamuramat','мамурамат')|E] между 961 и 967 гг. от И.С. Братоубийство стало затяжным конфликтом между сыновьями мамура Юсуфа, скончавшегося в 956 году от И.С. Его старший сын, Эссаид, взошёл на престол согласно воле мамура, однако решение Юсуфа наделить двух младших сыновей, Муктафи и Ка'ида, значительными территориями и статусом соправителей при старшем брате быстро дестабилизировало обстановку. Решение Эссаида отправить своего главного министра Аль-Баракви с небольшим войском для ареста Муктафи в 961 году обострило и без того напряжённую ситуацию, превратив её в полномасштабную войну — Муктафи наголову разбил армию и убил Аль-Баракви. Кульминацией конфликта стала изнурительная годичная осада столицы и ужасающие уличные бои как между регулярными армейскими частями, так и с участием гражданских партизан. Объединённые армии Муктафи и Ка'ида сумели пленить своего старшего брата в 966 году и без промедления обезглавили его, хотя боевые действия прекратились лишь в 967 году от И.С., поскольку некоторые генералы Эссаида отказывались сложить оружие. Эта война стала первым крупным внутренним потрясением в мамурамате со времён [Concept('the_downfall','Падения')|E] и рассматривается многими как переломный момент для самого института власти. Потеря большей части казны, собранной их отцом, оставила победоносных братьев в долгах, что вынудило мамурамат попасть в зависимость от [Concept('aversaria','аверсарианских')|E] и [Concept('marchers','маркских')|E] кредиторов."
 
 #CHARACTERS
 
 game_concept_usun_bishabelik:0 "Усун Бишабелик"
 game_concept_usun_bishabelik_desc:0 "Один из самых неоднозначных деятелей в ранней истории [Concept('wardenism','стражничества')|E]. Изначально Усун был грозой [Concept('great_uprising','Великого восстания')|E] и одним из немногих [Concept('ritualism','ритуалистских')|E] военачальников, кому регулярно удавалось отражать атаки стражников. Его присутствие — а возможно, и прямое участие — в ряде злодеяний против стражников, таких как Дхилестийская резня и чистка в Кадайе, принесло ему дурную славу. Тем большим шоком как для молодой стражнической веры, так и для его союзников-ритуалистов стал случай, когда Усун согласился на переговоры с самим [Concept('the_first_warden','Первым Стражем')|E] в 302 году от И.С. и публично принял стражничество. Его последующая яростная кампания против членов своей бывшей коалиции ввергла лагерь ритуалистов в хаос, благодаря чему стражи хлынули по всему [Concept('sarradon','Саррадону')|E]. Мнения о мотивах Усуна резко разделяются по сей день. Одни авторы изображают его человеком, терзаемым ужасом собственных прошлых деяний, который отчаянно искал искупления в благородном деле. Другие видят в нём амбициозного и беспринципного военачальника, который использовал стражничество как предлог для того, чтобы выкроить собственное владение из незащищённых флангов своих уязвимых союзников. Истина, скорее всего, утеряна для истории."
 
 game_concept_sanad:0 "Санад"
 game_concept_sanad_desc:0 "Поэтесса, генерал, героиня и изгнанница, Санад является, пожалуй, самой важной женщиной в [Concept('sarradon','саррадонской')|E] истории после [Concept('the_decimation_of_sarradon','Халакдуна')|E], и сегодня её почитают как матерь современного [Concept('mamuramat','мамурамата')|E]. Она была дочерью и единственной выжившей родственницей восточного мамура аль-Худи. Все остальные члены её семьи, вплоть до пятой степени родства с её отцом, были уничтожены в пламени магической ярости — участь, которую историки часто трактуют как свидетельство того, что аль-Худи был прямой мишенью для [Concept('ritualism','ритуалистских')|E] [Concept('magi','магов')|E], разделяющих ответственность за то, что они навлекли [Concept('the_decimation_of_sarradon','Истребление')|E]. Вынужденная не на жизнь, а на смерть сражаться за выживание, она, вопреки тому что её не готовили к роли военачальника, проявила незаурядный талант в сплочении остатков армий своей семьи, пока Восточный мамурамат боролся за своё существование едва ли не на дюжине фронтов. Увы, несмотря на её отвагу и очевидный стратегический гений, врагов было слишком много, и сокрушительное поражение в битве при Азареке вынудило её бежать в изгнание, пока мамурамат рушился за её спиной. Прибыв ко двору новоиспечённого Центрального мамура [Concept('tathtali','Татхтали')|E] в 810 году от И.С., она обменяла свой оспариваемый титул на альянс, скрепив их союз браком. Хотя именно она детально спланировала последующие войны за отвоевание Востока, ресурсы воссоединённого мамурамата были поглощены кризисами ближе к дому по мере того, как углублялся хаос [Concept('the_downfall','Падения')|E], и вернуть удалось лишь несколько приграничных провинций. Она скончалась от естественных причин в 832 году от И.С., но её наследие в культурных и политических институтах современного стражничества живёт и поныне."
 
 game_concept_tathtali:0 "Татхтали"
 game_concept_tathtali_desc:0 "Первый из [Concept('the_decimation_of_sarradon','послеистребительных')|E] мамуров, #BOL Татхтали#! правил пятьдесят шесть лет, за которые институт [Concept('mamuramat','мамурамата')|E] претерпел фундаментальные изменения, что в корне преобразило основы всей [Concept('wardenism','стражнической')|E] веры. Отныне мамур больше не делил власть как равный среди равных. Вместо этого он должен был править как священный абсолютный монарх ради защиты правоверных — по крайней мере, такова была теория. В реальности же этим амбициям мешали столь же часто, сколь и потакали, а растущие расходы на содержание раздутого государственного аппарата со временем вынудили мамурамат закладывать прибрежные территории как [Concept('marchers','жителям Марки')|E], так и [Concept('aversaria','аверсарианцам')|E].\n\nЧто касается самого Татхтали, многие историки считают его правление успешным перед лицом нарастающей анархии [Concept('the_downfall','Падения')|E]. Венчанный на царство в 809 году от И.С. после того, как он победил и убил своего обезумевшего от магии отца в гражданской войне, его брак с [Concept('sanad','Санад')|E] и их последующее совместное равноправное правление до сих пор остаются излюбленной темой для поэтов и певцов. Неудивительно, что современное «основное» течение стражничества носит его имя и почитает его как второго основателя — столь огромным было его влияние на эту религию и её институты."
 
 game_concept_fourth_mamur:0 "Четвёртый мамур"
 game_concept_far_eastern_mamur:0 "Дальневосточный мамурамат"
 game_concept_fourth_mamur_desc:0 "Некоторые [Concept('wardenism','стражники')|E] признают существование четвёртого [Concept('mamuramat','мамура')|E] — этот титул на далёком востоке изначально закрепился за [Concept('ritualism','ритуалистским')|E] военачальником, ставшим стражническим неофитом, [Concept('usun_bishabelik','Усуном Бишабеликом')|E]. Усун утверждал, будто [Concept('the_first_warden','Первый Страж')|E] лично направил его повести армию, чтобы преследовать ритуалистов до самой Каширии — миссии, на выполнение которой он положил остаток своей девяностолетней жизни. Его приёмный сын Убайдар стал последним, кто носил этот титул, бесследно сгинув вместе с армией, насчитывавшей, по слухам, десять тысяч воинов, во время предполагаемой [Concept('gedeora','гедеоры')|E] в 409 году от И.С. Лишившись одновременно и предводителя, и войска, его и без того нестабильное владение рухнуло практически в одночасье, и с тех пор никто убедительно не заявлял прав на этот титул.\n\nВвиду сомнительной достоверности приказов Усуна Бишабелика, Дальневосточный мамурамат по большей части игнорировался его соседями, и немногие стражники сегодня вспоминают о нём иначе как о своеобразном героическом мифе."
 
 game_concept_high_judge:0 "Верховный судья"
 game_concept_high_judge_desc:0 "В [Concept('wardenism','стражничестве')|E] роли священнослужителя и магистрата объединены в одном лице — судье. В большинстве городов есть как минимум один судья для ведения судебных заседаний, а крупные мегаполисы способны содержать десятки или даже сотни таких чиновников. В их обязанности входит управление сложнейшими сводами стражнических религиозных законов, где они выступают как вершителями правосудия, так и заступниками для просителей. Поскольку стражнические кодексы охватывают как уголовное, так и имущественное и торговое право, работа судьи весьма трудна и требует долгих лет обучения, прежде чем человека сочтут мастером своего дела.\n\nСудьи, добившиеся признания и мастерства, могут рассчитывать на назначение [Concept('high_judge','Верховным судьёй')|E], получая власть над всеми нижестоящими судьями — по крайней мере, в теории. На практике же расхождение различных стражнических правовых традиций за долгие годы привело к тому, что не менее трёх Высших судов претендуют на этот титул, отказываясь признавать легитимность друг друга. Основной Высший суд назначается [Concept('mamuramat','мамуром')|E], в то время как Традиционалистский Высший суд сформировался по принципу «снизу вверх» и утверждает, что является лишь временным органом, ожидающим возвращения мамурамата к его истинным правовым границам. Идеалисты же имеют прочно закрепившийся суд, который рассматривает и одобряет кандидатуры будущих членов своей коллегии на основе меритократических рекомендаций от нижестоящих судей, позиционируя себя как постоянный и независимый орган."
 
 game_concept_arachas:0 "Арахас"
 game_concept_arachas_desc:0 "Ставший ныне печально известным военачальник Восточного острова, Арахас вошёл в историю как законченный злодей благодаря своей роли в повествовании о зарождении [Concept('wardenism','стражничества')|E]. Даже сами [Concept('ritualism','ритуалисты')|E] мало что сделали для его реабилитации, поскольку его деспотичное правление и очевидное нежелание осознавать истинные масштабы угрозы со стороны [Concept('great_uprising','Великого восстания')|E] часто приводятся в пример как факторы, позволившие стражнической вере укорениться. Арахас был убит после пяти лет сражений в 302 году от И.С. Говорят, что его собственные последователи сочли за благо зарыть его в безымянной могиле, и точное место его гибели ныне полностью утеряно.\n\nВопрос о том, почему именно Арахас заточил [Concept('the_first_warden','Первого Стража')|E] в темницу, стал предметом множества догадок среди историков и религиоведов. Для объяснения этого возникли две основные версии:\n\nПервая, популярная среди романтически настроенных сказителей и поэтов, гласит, что Арахас проезжал через один из своих городов, возвращаясь с охоты, когда приметил прекрасную молодую женщину и безумно в неё влюбился. Он подстроил так, чтобы её мужа — будущего Первого Стража — бросили за решётку. Проявив отважное неповиновение домогательствам Арахаса, она заколола себя насмерть то ли во время ареста супруга, то ли вскоре после этого прямо на рыночной площади.\n\nВторая, более авторитетная среди серьёзных историков как стражнического, так и ритуалистского толка, повествует о том, что человек, которому вскоре предстояло стать Первым Стражем, просто оказался не в то время не в том месте. Из-за частых кампаний Арахаса за престол Саррадона военачальник постоянно находился на грани банкротства, и он рассматривал имущество и активы добродетельного (хотя этот эпитет оспаривается многими ритуалистскими историками) молодого человека как очередной ресурс, который можно пустить в ход ради своих политических амбиций. Дерзкий отказ молодого купца платить Арахасу «дань» обеспечил ему путешествие в самый мрачный каземат в цитадели военачальника. Его последующее освобождение, скорее всего, было уловкой Арахаса, чтобы выследить, где тот спрятал часть своих денег и драгоценностей, поскольку военачальник ожидал, что пленник попытается бежать с острова, прихватив с собой всё, что сможет унести. Вместо этого купец поднял Великое восстание и предрешил судьбу Арахаса."
 
 game_concept_raqiyya:0 "Ракийя"
 game_concept_raqiyyas:0 "Ракийи"
 game_concept_raqiyya_desc:0 "Прославленная правовед и богослов раннего [Concept('wardenism','стражничества')|E]. Ракийя, племянница Утсуфа б. Иблида, второго [Concept('mamuramat','мамура')|E] Запада, родилась в 382 году от И.С. Будучи воспитанной в ближайшем окружении стражнических владык и учёных мужей, по мере взросления она демонстрировала острый ум и очевидный талант к юридической работе. За следующие шестьдесят два года жизни она наводнила библиотеки бесчисленными комментариями к Законам Первого Стража, а также к практике и делопроизводству первого поколения судей и мамуров. Хотя её считали исключительно одарённой ещё при жизни, в последующие десятилетия и века после её кончины её авторитет неуклонно рос. Сегодня она является одним из самых влиятельных [Concept('high_judge','правоведов')|E] в вере после самого Первого Стража. Её труды столь монументальны, беспристрастны и глубоки, что принимаются в качестве авторитетного учебного материала всеми тремя Великими школами стражничества. Более того, некоторые дипломированные учёные утверждают, что гений Ракийи заключался не только в её осторожном дистанцировании от зарождавшихся в её эпоху фракционных споров, но и в том, что она словно предвидела те распри, которым суждено было возникнуть лишь спустя столетия после её смерти."
 
 #ORGANIZATIONS
 
 game_concept_mamur:0 "Мамур"
 game_concept_mamuramat:0 "Мамурамат"
 game_concept_mamuramat_desc:0 "Мамурамат, центральный институт стражнической веры, в равной степени объединяет в себе роли судьи, генерала и короля, а его традиционные обязанности охватывают как светскую, так и духовную сферы. Первые мамуры были наместниками самого Первого Стража и предводителями Великого восстания. Имена и точное количество этих лидеров вызывают некоторые споры, однако официальные хроники современного мамурамата утверждают, что существовало ровно три мамура, наделённых прямой юрисдикцией. Впрочем, эта версия часто оспаривается: многие стражиники называют её упрощением или даже ложью. В наше время уцелел лишь Центральный мамурамат, оставшийся в одиночестве после падения своих восточных и западных собратьев. Местные правители заявляют, что унаследовали власть, некогда дарованную их павшим братьям по оружию, однако исключительно щепетильная в правовых вопросах стражническая вера по сей день разделена во мнениях относительно того, дозволено ли подобное присвоение полномочий по закону."

