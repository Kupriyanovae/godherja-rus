 #Tusuffnas
 game_concept_tusuffna:0 "Тусуффна"
 game_concept_tusuffna_desc:0 "Изначально тусуффна представляли собой религиозные братства и сестричества единомышленников из числа благородной стражнической молодёжи. Хотя они часто руководствовались высокими идеалами, им нередко мешало отсутствие надлежащей организации, что приводило к жестоким и беспорядочным междоусобным конфликтам. В центральных землях стражничества в них видят либо образцовых молодых людей, либо обузу, однако они почти не имеют политического значения.\n\nТем временем на периферии стражничества возникли различные гетеродоксальные мистические ордена, которые привлекли сторонников среди значительного числа тусуффна и тесно переплелись с ними. Со временем термин «тусуффна» стал использоваться для обозначения как мистиков, так и банд впечатлительной молодёжи. Везде, где формировались подобные союзы, тусуффна превращались во влиятельных политических игроков. Наиболее политически успешные из них часто закреплялись в приграничных регионах, создавая полунаследственную иерархию квази-знати."

 game_concept_tusoffikia:0 "Ту’соффик’ия"
 game_concept_tusoffikia_desc:0 "Ту’соффик’ия — одна из тусуффна, зародившихся в Айяре; её мистики изначально были причастны к обращению значительной части этого региона. Они переняли ритуалистские образы Софокоса и используют схему «Внутреннего Софокоса» для направления своих религиозных практик. Они утверждают, будто ревностный человек может обрести великую заслугу, преданно совершая восхождение по каждой из 1001 Ступени, каждая из которых в их теологии соответствует определённым постулатам Законов Стража. Впрочем, можно извлечь пользу и из «подъёмников» Софокоса, занимаясь их медитативными практиками. Таким образом, люди могут соблюдать базовые Столпы добродетели и достичь вершины, не принимая стражничество полностью. Использование этих образов позволило им собрать последователей среди части местного ритуалистского населения, что со временем привело к многочисленным обращениям. Роль, которую они сыграли в обращении Айяра в стражничество, укрепила их положение, а их многочисленные амиры накопили значительные богатства и влияние."

 game_concept_tuayyaria:0 "Ту’айяр’ия"
 game_concept_tuayyaria_desc:0 "Эта крайне аскетичная тусуффна возникла из воинской культуры Аузангеба. Они славят теологию, в которой эмоциональная и телесная трансформация необходима для высшего посвящения. Они превозносят контроль над собственными слабостями и обуздание естественных инстинктов. Истинные Столпы добродетели, как они спорят между собой, кроются не в правовых традициях, а в закалке самого себя, благодаря которой человек следует им инстинктивно. Это касается тела — которое может чего-то вожделеть — в той же мере, что и воли человека.\n\nПо этой причине они известны своими суровыми физическими религиозными практиками и строгостью эмоциональной отрешённости. Их мистические видения часто приходят на грани обморока от истощения. Хотя они участвуют в обычной социальной жизни, их приверженцы стараются держаться подальше от её соблазнов. Зрелище ту’айярских дворян, стоически отказывающихся от алкоголя в самый разгар роскошного пира — привычное дело.\n\nХотя они и не ограничены строго одним лишь этим образом жизни, их неразрывная связь с воинским этосом означает, что они часто находят своё место рядом с армией."
 
 game_concept_tudaribaria:0 "Ту’дарибар’ия"
 game_concept_tudaribaria_desc:0 "Тусуффна, происходящая из центральных земель стражничества. Её члены утверждают, что повседневный труд, выполняемый многими стражниками, хоть и поддерживает Столпы добродетели, никогда не будет достаточным для обращения вспять их внутреннего упадка. Эта задача ложится на плечи Ту’дарибар’ии, членам которой необходимо не только строго соблюдать Закон Стража, но и прилагать дополнительные усилия для восстановления повреждённых Столпов добродетели. Они делают это, налагая на себя дополнительные ограничения и участвуя в собраниях, где многие участники трудятся ради воссоздания мира таким, каким он должен быть.\n\nОднако одних лишь трудов Ту’дарибар’ии недостаточно без знания и понимания реальности. Они распространяют это понимание через разнообразную поучительную поэзию, использующую иносказательный язык и загадки. Ученикам то и дело бросают вызов с целью постижения этих ребусов, благодаря чему они становятся более искусными в распознавании тайн бытия. Хотя эта богатая художественная сфера активно используется во время их внутренних собраний, в остальном она доступна для всеобщего удовольствия.\n\nНесмотря на то, что они не являются самой заметной тусуффна, их относительно ортодоксальные убеждения позволили им добиться признания со стороны большинства стражнических правителей. В особенности их энигматисты приветствуются повсеместно, поскольку их ремесло доставляет удовольствие придворным, сочетаясь с высоким качеством их искусства."

