 game_concept_the_first_warden:0 "Первый Страж"
 game_concept_first_warden:0 "Первый Страж"
 game_concept_the_first_warden_desc:0 "Первый Страж остаётся довольно загадочной фигурой, несмотря на монументальный след, который его наследие оставило в саррадонской истории. Ролившись примерно в середине третьего века, человек, которому позже суждено было стать Первым Стражем, похоже, работал купцом и местным чиновником на Восточном острове, пока не привлёк внимание повелителя острова — военачальника Арахаса.\n\nПервый Страж написал четыре монументальные книги, вошедшие в стражнический канон, а его авторству приписывают ещё около десятка других документов и томов, которые считаются апокрифическими и отвергаются одной или несколькими сектами стражнической веры. Четыре книги, признаваемые большинством стражников, — это: «Книга дней», «Столпы добродетели», «Маргиналии» и «Видения». «Протоколы суда Первого Стража», пусть и были записаны писцами и сопоставлены уже после его смерти, также причисляются к стражническому канону, поскольку содержат дословные записи многих решений и правовых изречений Стража.\n\nПервый Страж скончался от естественных причин в 332 году. Вопреки надеждам его врагов-ритуалистов на то, что с его уходом вера утратит свой смысл, это лишь сплотило стражников, превратив их учение в ту религию, которой она является сегодня. Руководство перешло в руки его наместников — мамуров, которые успешно повели верующих к завоеванию господствующего положения во всём Саррадоне."
 
 #DESCRIPTIONS
 
 game_concept_wardenism:0 "Стражничество"
 game_concept_wardenite:0 "Стражник"
 game_concept_wardenites:0 "Стражники"
 game_concept_wardenism_desc:0 "Стражничество — это вера в несколько духовных «Столпов», которые наставляют человека на путь праведной жизни, основываясь на убеждении, что эти Столпы образуют великую темницу, в которой заточён злой бог (Мёртвый бог). Стражники верят, что если слишком много людей будут поступать нечестиво и нечестно, Мёртвый бог освободится из своего узилища и уничтожит миры людей.\n\nИстоки стражничества вызывают яростные споры. Общепризнано лишь то, что Первый Страж поднял восстание в 296 году против военачальников-ритуалистов в юго-восточном углу Северного Саррадона и быстро вдохновил крестьян и местных лидеров на великий бунт ради свержения ритуалистской власти. Сам Первый Страж утверждал, что ему явились видения Мёртвого бога, когда он находился в заточении на Восточном острове у военачальника Арахаса, который впоследствии стал первой жертвой Великого восстания.\n\nНападения Первого Стража стали первыми битвами Войны на небесах, которая впоследствии поглотит Саррадон почти на 2000 лет.\n\nВопрос о том, было ли стражничество изначально сектой ритуализма, остаётся предметом острых дискуссий. Сторонники этой идеи указывают на сходство между стражнической верой в метафорические Башни и спорами в различных ритуалистских сектах о том, является ли Башня Софокоса метафорой, а также на сходство многих представлений о добродетелях в остальном. Несмотря на это, стражники и ритуалисты остаются непримиримыми соперниками со времён Первого Стража, и большинство стражников считают идею о том, что стражничество является сектой ритуализма, ересью, распространяемой безумцами."
 
