 game_concept_era_of_admin:0 "Эпоха Наместничества"
 game_concept_era_of_admin_desc:0 "Идеализированная «вторая» эпоха варденизма, должная сменить [Concept('era_of_insurrection','Эпоху Мятежа')|E]. Это благословенное время наступит тогда, когда варденизм утвердит законы [Concept('the_first_warden','Первого Вардена')|E] по всему миру и оградит Столпы Добродетели от любых угроз и потрясений. Верующие проповедуют, что то будет век предержания правды и закона, а некоторые и вовсе уверяют, будто Эпоха Наместничества обернется земным раем, где люди забудут о нужде. Школа А'Бадджармия и многие традиционалисты толкуют эту эпоху скорее как образец совершенного правления, нежели как грядущий исторический век. Радикальные же споры вокруг этой мысли не раз приводили к кровопролитным восстаниям черни, чаявшей скорого конца света (в 520, 803, 807, 810, 812 и 1111 гг.).\n\nГлавный спор с этой мыслью ведут Идеалисты: они утверждают, будто Эпоха Наместничества уже наступила, просто верующие вардениты о том еще не ведают. Да и само их понимание этого времени куда скромнее — они не ждут рая со всеобщим изобилием, по крайней мере, в первые века."

 game_concept_era_of_insurrection:0 "Эпоха Мятежа"
 game_concept_era_of_insurrection_desc:0 "Также именуемая Эпохой Завоеваний, это «первая» пора в пророчествах варденизма, и большинство верующих убеждены, что до сих пор живут в ней. Это время наполнено непрестанной борьбой за саррадонские просторы, пока верные вардениты бьются против несправедливости, греха и порока. Мечом и словом они высекают царство, где воцарятся законы [Concept('the_first_warden','Первого Вардена')|E], дабы спасти человеческий род от Капюшонного Узника. Большинство считает началом этой великой поры [Concept('great_uprising','Великое восстание')|E], хотя некоторые секты, излишне возвеличивающие личность самого Первого Вардена, ведут отсчет от дня его рождения."

 game_concept_great_uprising:0 "Великое восстание"
 game_concept_great_uprising_desc:0 "Великое восстание, вспыхнувшее в 296 году, — так ныне [Concept('wardenism','вардениты')|E] зовут бунт под началом [Concept('the_first_warden','Первого Вардена')|E] против военачальника [Concept('arachas','Арахаса')|E], а следом и против всего [Concept('ritualism','ритуалистского')|E] жизненного уклада. Поначалу разгораясь лишь на востоке [Concept('sarradon','Саррадона')|E], Восстание охватило край подобно лесному пожару после неожиданного обращения ритуалистского вождя [Concept('usun_bishabelik','Усуна Бишабелика')|E] в 302 году. Это событие вмиг обратило верную победу ритуалистов в сокрушительный разгром. Оградив восток и сделав его своим оплотом, вардениты смогли начать поход на остальную часть материка, зажгши пожар по всему Саррадону в пламени [Concept('war_in_heaven','Войны на небесах')|E]."
 game_concept_mazfarun_dawl:0 "Мизфарун Давл"