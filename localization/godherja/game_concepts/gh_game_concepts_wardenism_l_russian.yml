 game_concept_the_first_warden:0 "Первый Варден"
 game_concept_first_warden:0 "Первый Варден"
 game_concept_the_first_warden_desc:0 "Первый Варден остаётся загадочной фигурой, несмотря на неизгладимый след, который его деяния оставили в саррадонской истории. Рожденный в середине третьего века, человек, которому позже суждено было стать Первым Варденом, по всей видимости, был купцом и мелким наместником на Восточном острове, пока не навлек на себя гнев правителя тех земель — военачальника Арахаса.\n\nПервый Варден оставил после себя четыре великие книги, вошедшие в священный варденитский канон. Его авторству приписывают и еще около десятка других трудов, однако они признаются далеко не всеми сектами и почитаются как апокрифы. Четыре канонических труда, бесспорных для большинства верующих, — это «Книга дней», «Столпы добродетели», «Маргиналии» и «Видения». «Протоколы суда Первого Вардена», пусть и были собраны писцами уже после его кончины, также причисляются к канону, ибо дословно хранят многие решения и судебные речи Вардена.\n\nПервый Варден мирно скончался в 332 году. Вопреки надеждам его врагов-ритуалистов на то, что со смертью учителя угаснет и само учение, эта утрата лишь сплотила общину, превратив ее в ту мощную веру, что мы видим сегодня. Руководство перешло к его верным наместникам — мамурам, которые успешно повели рати верующих на завоевание всего Саррадона."
 
 #DESCRIPTIONS
 
 game_concept_wardenism:0 "Варденизм"
 game_concept_wardenite:0 "Варденит"
 game_concept_wardenites:0 "Вардениты"
 game_concept_wardenism_desc:0 "Варденизм — это вера в духовные «Столпы», направляющие человека к праведной жизни. В основе ее лежит убеждение, что эти Столпы образуют великую темницу, удерживающую злого бога (Мёртвого бога). Вардениты верят: если людские грехи и нечестивость перевесят чашу весов, Мёртвый бог вырвется из своего узилища и предаст огню весь мир.\n\nО том, как зародилась эта вера, спорят до хрипоты. Достоверно известно лишь то, что Первый Варден поднял мятеж в 296 году против военачальников-ритуалистов в юго-восточных пределах Северного Саррадона, быстро разжегши крестьянский бунт ради свержения прежней власти. Сам Первый Варден утверждал, будто видения Мёртвого бога явились ему в темнице Восточного острова, куда его бросил военачальник Арахас, ставший впоследствии первой жертвой Великого восстания.\n\nПоходы Первого Вардена разожгли пламя Войны на небесах, которая поглотит Саррадон почти на два тысячелетия.\n\nВопрос о том, вырос ли варденизм из глухих сект ритуализма, до сих пор порождает яростные споры. Те, кто согласен с этим, указывают на схожесть варденитских иносказаний о Башнях со старыми спорами ритуалистов о том, стоит ли понимать Башню Софокоса буквально, да и во многом другом их представления о добродетели близки. Тем не менее вардениты и ритуалисты остаются непримиримыми врагами со времен Первого Вардена, а большинство верующих почитают саму мысль о родстве их веры с ритуализмом за безумную ересь."
 
