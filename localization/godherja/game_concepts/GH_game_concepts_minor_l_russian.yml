l_russian:
 game_concept_legio_xxi:0 "Государственный XXI легион"
 game_concept_the_emperors_own:0 "«Собственный легион автократа»"
 game_concept_legio_xxi_desc:0 "Государственный XXI легион, часто называемый «Собственным легионом автократа», исторически обладал уникальной честью носить имя правящего автократа.\n\nПолучив имя «Эшрея» во время [Concept('imperial_civil_war','имперской гражданской войны')|E], легион сменил сторону (и название) незадолго до [Concept('frodbrokna','Фродброкны')|E], после чего отказался признавать какое-либо иное имя, кроме Аксиотеи."
 
 game_concept_imperial_western_faction:0 "Западная фракция империи"
 game_concept_imperial_western_faction_desc:0 "На закате [Concept('aversaria','Аверсарии')|E] возвышение Айроны как главного наместничества привело к тому, что политическая власть в Империи постепенно разделилась на две все более враждебные и отдаленные друг от друга политические группировки: Западную фракцию во главе с Этепезеей (к которой почти всегда примыкал Калатипсоми) и Восточную фракцию во главе с Айроноем. Этот раскол достиг своего пика с началом [Concept('imperial_civil_war','имперской гражданской войны')|E] в 1186 году от основания Орайспола и в конечном итоге привел к [Concept('frodbrokna','Фродброкне')|E]."
 
 game_concept_first_empire:0 "Первая империя"
 game_concept_world_city:0 "Мировой город"
 game_concept_first_to_second_empire:0 "Вторая империя"
 game_concept_first_empire_desc:0 "[Concept('aversaria','Аверсарианская')|E] религиозная доктрина утверждает, что великий город, которым правил [Concept('magi','маг')|E] по прозвищу [Concept('aersanon','Чистейший')|E], когда-то раскинулся на весь Аэрас с центром у [Concept('sea_tower','Имперской башни')|E]. Это была «Первая империя», уничтоженная вторжением варваров (часто называемых «отродьями Бездны») и вероломными рабами эоны лет назад. Аверсарианцы видят в себе восстановителей этого наследия, а современную Автократию считают «Второй империей»."
 
 game_concept_the_thousand_days_of_asiupoli:0 "Тысяча дней Асиуполя"
 game_concept_thousand_days:0 "Тысяча дней"
 game_concept_the_thousand_days_of_asiupoli_desc:0 "Хотя Асиуполь был безоговорочно самым процветающим городом [Concept('aversaria','Аверсарии')|E], в последние десятилетия его истории на город обрушилась беспрецедентная череда бедствий, как природных, так и иных. На протяжении нескольких лет, прозванных «Тысячью дней», город сталкивался с разрушительными наводнениями, обрушением во время землетрясения руин, на которых был построен нижний город, обнаружением гнезда существ, известных как «икиане», в древнем храме под дворцом наместника, и многим другим.\n\nКрах завершился во время [Concept('imperial_civil_war','имперской гражданской войны')|E], когда на массовые хлебные бунты и ужасающую эпидемию чумы аутократор Аксиотея ответила истреблением большей части населения. Город уже практически превратился в пустошь к тому времени, когда [Concept('selfreplicating_blood_magic','самовоспроизводящаяся магия крови')|E] окончательно стерла его остатки с лица [Concept('aeras','Аэраса')|E]."

 game_concept_knowledge_entries:0 "Записи знаний"
 game_concept_knowledge_entries_desc:0 "Определенные [Concept('artifacts','артефакты')|E] при осмотре имеют дополнительную вкладку #V «Знания»#!. При ее открытии отображается список глав и тем, которые [Concept('character','персонаж')|E] (при соответствии необходимым требованиям к [Concept('skill','навыкам')|E]) может изучить, чтобы освоить заклинания, повысить свои навыки или узнать историю мира."