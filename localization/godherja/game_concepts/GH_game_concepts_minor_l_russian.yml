l_russian:
 game_concept_legio_xxi:0 "Государственный двадцать первый легион"
 game_concept_the_emperors_own:0 "«Собственный легион автократа»"
 game_concept_legio_xxi_desc:0 "Государственный двадцать первый легион, коий часто величали «Собственным легионом аавтократа», искони имел великую и редкую милость носить прозвание правящего аавтократа.\n\nПолучив имя «Эшрея» во времена, когда полыхала [Concept('imperial_civil_war','имперская гражданская война')|E], легион переметнулся на другую сторону (и сменил прозвание) незадолго до [Concept('frodbrokna','Фродброкны')|E], после чего наотрез отказался принимать какое-либо иное имя, кроме Аксиотеи."
 
 game_concept_imperial_western_faction:0 "Западная фракция империи"
 game_concept_imperial_western_faction_desc:0 "На закате [Concept('aversaria','Аверсарии')|E] возвышение Айроны как главных земель под рукой наместника привело к тому, что мирская власть в Империи постепенно раскололась на два все более враждебных и далеких друг от друга стана: Западные союзные круги во главе с Этепезеей (к коим почти всегда примыкал Калатипсоми) и Восточные союзные круги во главе с Айроноем. Сей раздор достиг своей вершины с началом [Concept('imperial_civil_war','имперской гражданской войны')|E] в тысяча сто восемьдесят шестом году от основания Орайспола и в итоге привел к [Concept('frodbrokna','Фродброкне')|E]."
 
 game_concept_first_empire: "Первая империя"
 game_concept_world_city: "Мировой город"
 game_concept_first_to_second_empire: "Вторая империя"
 game_concept_first_empire_desc: "[Concept('aversaria','Аверсарианское')|E] духовное поучение гласит, что великий град, коим правил сведующий маг именующий себя [Concept('aersanon','Чистейший')|E], некогда раскинулся на весь Эрас с сердцем у [Concept('sea_tower','Имперской башни')|E]. То была «Первая империя», уничтоженная набегом варваров (коими часто зовут «отродий Бездна») и вероломными невольниками тьму лет назад. Аверсарианцы видят в себе восстановителей сего наследия, а нынешнюю [Glossary( 'Аавтократию', 'GH_AAUTOKRATA_GLOSS' )] почитают за «Вторую империю»."
 
 game_concept_the_thousand_days_of_asiupoli: "Тысяча дней Асиуполя"
 game_concept_thousand_days: "Тысяча дней"
 game_concept_the_thousand_days_of_asiupoli_desc: "Хотя Асиуполь был безоговорочно самым цветущим градом [Concept('aversaria','Аверсарии')|E], в последние десятилетия его бытия на град обрушилась невиданная череда напастей, как от самой природы, так и от злого умысла. На протяжении нескольких лет, прозванных «Тысячью дней», град содрогался от разрушительных наводнений, крушения при землетрясении древних руин, на коих стоял нижний посад, появления гнезд тварей, ведомых как «икиане», в стародавнем святилище под чертогами наместника, и многого иного.\n\nКонец всему наступил во время [Concept('imperial_civil_war','имперской гражданской войны')|E], когда на великие бунты из-за нехватки хлеба и лютый мор черной чумы аавтократом Аксиотея ответила поголовным истреблением большей части людского рода. Град уже практически превратился в мертвую пустошь к тому часу, когда [Concept('selfreplicating_blood_magic','самовоспроизводящаяся магия крови')|E] окончательно стерла его останки с лица [Concept('aeras','Эраса')|E]."

 game_concept_white_pass_war: "White Pass War"
 game_concept_white_pass_war_desc: "The White Pass War of 1267 to 1274 IS was the last military campaign fought by the armies of the Sjalvolki Imperrech and its conclusion is popularly considered the end of the [Concept('sjalvolki_migration','Sjalvolki Migrations')|E] (though several minor wars were fought over the following decade). The leaders of both sides of the war — High King $cenware_link$ Cenware Witch-Breaker#! in the Imperrech and Governoress-Legan Hecaeda in [Glossary('Western Aironoi','western_aironoi_encyclopedia_desc')] — both declared their own opposition to it even before its beginning. The Tribespact of Kasmeze in 1266 would see the High King pressured to lead the dwindling numbers of refugees and adventurers on the campaign as a matter of honor despite his own tiring of the years of war against the Aversarians and he would reluctantly begin the war thereafter with his landing at Peiramum.\n\nWhile initially successful, the bulk and most elite of the Imperrech's armies had largely settled in the west by the time of the invasion, and Governoress-Legan Hecaeda's armies had prepared extensively to resist them. This would lead to Hecaeda's shocking victory at the Battle of the Theyssian Tower — popularly seen as the first or second ever battlefield defeat by Cenware (though not the last of the war) and would see the withdrawal of Cenware's armies back across the Korvion Strait.\n\nAfter nearly a year of pause, two larger and far better prepared armies would land at both Peiramum and Asiupoli, and the Imperrech's armies would rapidly conquer much of the northwest and lead to thousands of [Concept('aversaria','Aversarians')|E] to flee east across the [Glossary('Chrysémvixa','GH_CHRYSEMVIXA_GLOSS')] mountains. Hecaeda would organize the population and her armies across the mountains after them in 1272, and the final two years of the war thereafter would be fought within the mountain's passes and at the years-long siege of Phasonia in the north.\n\nWith both armies facing horrific casualties in the grueling winter of 1273, the Siege of Phasonia seemingly unending, and the death of Hecaeda's husband Altan at the Battle of the Seven Shields, Cenware and Hecaeda would finally agree to a week-long stall of fighting and a meeting within the snow-filled mountain passes that would give the war its name. The following Meeting of the Twenty-Two between both leaders and their councils would be immortalized as legend, and end with both  agreeing to a pact of friendship and peace. Both armies would withdraw, Hecaeda to the east to reorganize the refugees and legions into what would become the Kingdom of Anoteria, and Cenware to the west to lead his people from his newly established kingdom in Oraispol, where he would formally disband the Sjalvolki Imperrech shortly after his arrival." # GH URGENT: Cut this up

 game_concept_knowledge_entries: "Записи знаний"
 game_concept_knowledge_entries_desc: "Определенные [Concept('artifacts','артефакты')|E] при осмотре имеют дополнительную вкладку #V «Знания»#!. При ее открытии отображается список глав и тем, которые [Concept('character','персонаж')|E] (при соответствии необходимым требованиям к [Concept('skill','навыкам')|E]) может изучить, чтобы освоить заклинания, повысить свои навыки или узнать историю мира."