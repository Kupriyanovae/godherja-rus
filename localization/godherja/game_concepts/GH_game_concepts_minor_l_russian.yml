l_russian:
 game_concept_legio_xxi:0 "Государственный двадцать первый легион"
 game_concept_the_emperors_own:0 "«Собственный легион аавтократа»"
 game_concept_legio_xxi_desc:0 "Государственный двадцать первый легион, коий часто величали «Собственным легионом аавтократа», искони имел великую и редкую милость носить прозвание правящего аавтократа.\n\nПолучив имя «Эшрея» во времена, когда полыхала [Concept('imperial_civil_war','имперская гражданская война')|E], легион переметнулся на другую сторону (и сменил прозвание) незадолго до [Concept('frodbrokna','Фродброкны')|E], после чего наотрез отказался принимать какое-либо иное имя, кроме Аксиотеи."
 
 game_concept_imperial_western_faction:0 "Западная фракция империи"
 game_concept_imperial_western_faction_desc:0 "На закате [Concept('aversaria','Аверсарии')|E] возвышение Айроны как главных земель под рукой наместника привело к тому, что мирская власть в Империи постепенно раскололась на два все более враждебных и далеких друг от друга стана: Западные союзные круги во главе с Этепезеей (к коим почти всегда примыкал Калатипсоми) и Восточные союзные круги во главе с Айроноем. Сей раздор достиг своей вершины с началом [Concept('imperial_civil_war','имперской гражданской войны')|E] в тысяча сто восемьдесят шестом году от основания Ораисполя и в итоге привел к [Concept('frodbrokna','Фродброкне')|E]."
 
 game_concept_first_empire: "Первая империя"
 game_concept_world_city: "Мировой город"
 game_concept_first_to_second_empire: "Вторая империя"
 game_concept_first_empire_desc: "[Concept('aversaria','Аверсарианское')|E] духовное поучение гласит, что великий град, коим правил сведующий маг именующий себя [Concept('aersanon','Чистейший')|E], некогда раскинулся на весь Эрас с сердцем у [Concept('sea_tower','Имперской башни')|E]. То была «Первая империя», уничтоженная набегом варваров (коими часто зовут «отродий Бездна») и вероломными невольниками тьму лет назад. Аверсарианцы видят в себе восстановителей сего наследия, а нынешнюю [Glossary( 'Аавтократию', 'GH_AAUTOKRATA_GLOSS' )] почитают за «Вторую империю»."
 
 game_concept_the_thousand_days_of_asiupoli: "Тысяча дней Асиуполя"
 game_concept_thousand_days: "Тысяча дней"
 game_concept_the_thousand_days_of_asiupoli_desc: "Хотя Асиуполь был безоговорочно самым цветущим градом [Concept('aversaria','Аверсарии')|E], в последние десятилетия его бытия на град обрушилась невиданная череда напастей, как от самой природы, так и от злого умысла. На протяжении нескольких лет, прозванных «Тысячью дней», град содрогался от разрушительных наводнений, крушения при землетрясении древних руин, на коих стоял нижний посад, появления гнезд тварей, ведомых как «икиане», в стародавнем святилище под чертогами наместника, и многого иного.\n\nКонец всему наступил во время [Concept('imperial_civil_war','имперской гражданской войны')|E], когда на великие бунты из-за нехватки хлеба и лютый мор черной чумы аавтократом Аксиотея ответила поголовным истреблением большей части людского рода. Град уже практически превратился в мертвую пустошь к тому часу, когда [Concept('selfreplicating_blood_magic','самовоспроизводящаяся магия крови')|E] окончательно стерла его останки с лица [Concept('aeras','Эраса')|E]."

 game_concept_white_pass_war: "Война Белого перевала"
 game_concept_white_pass_war_desc: "Война Белого перевала 1267–1274 И.С. была последней военной кампанией, которую вели армии Сьялволькского Имперреха, и её завершение принято считать концом [Concept('sjalvolki_migration','переселений сьялволков')|E] (хотя в течение следующего десятилетия велось ещё несколько малых войн). Лидеры обеих сторон конфликта — верховный король $cenware_link$ Ценвар «Сокрушитель Ведьм»#! в Имперрехе и губернатрисса-леган Гекаэда в [Glossary('Западном Айроное','western_aironoi_encyclopedia_desc')] заявляли о своей неприязни к этой войне ещё до её начала. Племенной пакт Касмезы 1266 вынудил Верховного короля возглавить поход сокращающихся орд беженцев и искателей приключений как дело чести, несмотря на его усталость от долгих лет войны с аверсарианцами, и он неохотно начал войну, высадившись в Пейрамуме.\n\nХотя поначалу кампания была успешной, основные и самые элитные силы Имперреха к тому времени уже большей частью осели на западе, а армии губернатриссы-легана Гекаэды основательно подготовились к сопротивлению им. Это привело к её ошеломляющей победе в битве у Тессийской башни — которая считается первым или вторым поражением Ценвара на поле боя (хотя оно не стало последним в войне), — после чего армии Ценвара отступили обратно через Кровионский пролив.\n\nПосле почти годового затишья две более крупные и лучше подготовленные армии высадились в Пейрамуме и Асиуполе, и войска Имперреха быстро завоевали большую часть северо-запада, вынудив тысячи [Concept('aversaria','аверсарианцев')|E] бежать на восток через горы [Glossary('Хриземвикса','GH_CHRYSEMVIXA_GLOSS')]. Гекаэда организовала население и свои войска для преследования их в горах в 1272 году, и последние два года войны велись в горных перевалах и в ходе многолетней осады Фасонии на севере.\n\nКогда обе армии понесли ужасные потери в суровую зиму 1273 года, в то время как осада Фасонии казалась бесконечной, после гибели мужа Гекаэды Алтана в Битве Семи щитов, Ценвар и Гекаэда наконец согласились на недельное прекращение боевых действий и встречу в заснеженных горных перевалах, которые и дали войне её название. Последовавшая затем Встреча двадцати двух между лидерами и их советами была увековечена в легендах и завершилась заключением пакта дружбы и мира. Обе армии отступили: Гекаэда — на восток, чтобы реорганизовать беженцев и легионы в королевство, которое впоследствии стало Анотерией, а Ценвар — на запад, чтобы вести свой народ из своего недавно основанного королевства в Ораисполе, где он вскоре по прибытии официально распустил Сьялволькский Имперрех" # GH URGENT: Cut this up

 game_concept_knowledge_entries: "Записи знаний"
 game_concept_knowledge_entries_desc: "Определенные [Concept('artifacts','артефакты')|E] при осмотре имеют дополнительную вкладку #V «Знания»#!. При ее открытии отображается список глав и тем, которые [Concept('character','персонаж')|E] (при соответствии необходимым требованиям к [Concept('skill','навыкам')|E]) может изучить, чтобы освоить заклинания, повысить свои навыки или узнать историю мира."