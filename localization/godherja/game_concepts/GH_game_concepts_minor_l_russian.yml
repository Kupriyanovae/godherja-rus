l_russian:
 game_concept_legio_xxi:0 "Государственный двадцать первый легион"
 game_concept_the_emperors_own:0 "«Собственный легион автократа»"
 game_concept_legio_xxi_desc:0 "Государственный двадцать первый легион, коий часто величали «Собственным легионом аавтократа», искони имел великую и редкую милость носить прозвание правящего аавтократа.\n\nПолучив имя «Эшрея» во времена, когда полыхала [Concept('imperial_civil_war','имперская гражданская война')|E], легион переметнулся на другую сторону (и сменил прозвание) незадолго до [Concept('frodbrokna','Фродброкны')|E], после чего наотрез отказался принимать какое-либо иное имя, кроме Аксиотеи."

 game_concept_imperial_western_faction:0 "Западная фракция империи"
 game_concept_imperial_western_faction_desc:0 "На закате [Concept('aversaria','Аверсарии')|E] возвышение Айроны как главных земель под рукой наместника привело к тому, что мирская власть в Империи постепенно раскололась на два все более враждебных и далеких друг от друга стана: Западные союзные круги во главе с Этепезеей (к коим почти всегда примыкал Калатипсоми) и Восточные союзные круги во главе с Айроноем. Сей раздор достиг своей вершины с началом [Concept('imperial_civil_war','имперской гражданской войны')|E] в тысяча сто восемьдесят шестом году от основания Орайспола и в итоге привел к [Concept('frodbrokna','Фродброкне')|E]."

 game_concept_first_empire:0 "Первая империя"
 game_concept_world_city:0 "Мировой город"
 game_concept_first_to_second_empire:0 "Вторая империя"
 game_concept_first_empire_desc:0 "[Concept('aversaria','Аверсарианское')|E] духовное поучение гласит, что великий град, коим правил сведующий маг именующий себя [Concept('aersanon','Чистейший')|E], некогда раскинулся на весь Эрас с сердцем у [Concept('sea_tower','Имперской башни')|E]. То была «Первая империя», уничтоженная набегом варваров (коими часто зовут «отродий Бездна») и вероломными невольниками тьму лет назад. Аверсарианцы видят в себе восстановителей сего наследия, а нынешнюю Аавтократию почитают за «Вторую империю»."

 game_concept_the_thousand_days_of_asiupoli:0 "Тысяча дней Асиуполя"
 game_concept_thousand_days:0 "Тысяча дней"
 game_concept_the_thousand_days_of_asiupoli_desc:0 "Хотя Асиуполь был безоговорочно самым цветущим градом [Concept('aversaria','Аверсарии')|E], в последние десятилетия его бытия на град обрушилась невиданная череда напастей, как от самой природы, так и от злого умысла. На протяжении нескольких лет, прозванных «Тысячью дней», град содрогался от разрушительных наводнений, крушения при землетрясении древних руин, на коих стоял нижний посад, появления гнезд тварей, ведомых как «икиане», в стародавнем святилище под чертогами наместника, и многого иного.\n\nКонец всему наступил во время [Concept('imperial_civil_war','имперской гражданской войны')|E], когда на великие бунты из-за нехватки хлеба и лютый мор черной чумы аавтократом Аксиотея ответила поголовным истреблением большей части людского рода. Град уже практически превратился в мертвую пустошь к тому часу, когда [Concept('selfreplicating_blood_magic','самовоспроизводящаяся магия крови')|E] окончательно стерла его останки с лица [Concept('aeras','Эраса')|E]."

 game_concept_knowledge_entries:0 "Записи знаний"
 game_concept_knowledge_entries_desc:0 "Определенные [Concept('artifacts','артефакты')|E] при осмотре имеют дополнительную вкладку #V «Знания»#!. При ее открытии отображается список глав и тем, которые [Concept('character','персонаж')|E] (при соответствии необходимым требованиям к [Concept('skill','навыкам')|E]) может изучить, чтобы освоить заклинания, повысить свои навыки или узнать историю мира."