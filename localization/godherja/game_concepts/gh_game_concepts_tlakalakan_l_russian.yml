  game_concept_necentlal_tlaklaktli:0 "Нецентлаль Тлакалактли"
  game_concept_necentlal_tlaklaktli_desc:0 "Когда тлакалаканы [Concept('tlakalakan_migration','переселились')|E] в земли Роджихлат Мару, они поначалу пытались возродить древний уклад своего общества. После коротких войн с местными княжествами, встретившими их с оружием, они срубили несколько градов по всему краю и заключили между ними нерушимый вечевой союз. Вскоре после своего рождения сия «Тлакаланская федерация», или «Нецентлаль Тлакалактли» на их собственном наречии, разрослась, включив в себя множество местных родов, кои с трудом свивали свои обычаи с новым порядком.\n\nНесмотря на все труды вождей, Нецентлаль из года в год содрогался от бедствий и смут. Тлакалаканы винили во всем [Concept('axemati_tlakalaktli','Аксемати Тлакалактли')|E] и стародавнее проклятие царицы, ибо бесконечные бунты, тайные убийства владык, голодные зимы и дурные знамения безжалостно преследовали их союз, раз за разом подвывая его к краю гибели. Невзирая на искреннее желание сплотить равноправное содружество, где все правители могли бы рядить дела в мире и согласии, туземцы никогда не верили пришельцам. Видя в кочевниках нечто чуждое и опасное, а в их каменных градах — и подавно, союз тщетно пытался примирить законы тлакалаканов с вековыми обычаями местных племен. Сие, вместе с вечной нестабильностью, то и дело приводило к междоусобным войнам, в коих туземные роды откалывались от Нецентлаля, дабы поднять оружие против [Concept('magi','магов')|E]-царей.\n\nПогибель Нецентлаля пришла вслед за войнами с воеводами-[Concept('ritualism','ритуалистами')|E], а следом — [Concept('wardenism','варденитами')|E]. После столетий борьбы против ритуализма маги-цари согласились стать единым щитом против варденитов в обмен на власть над Роджихлат Марой. Последовавшие за тем ратные катастрофы привели к тому, что их союзники-ритуалисты покинули край или переметнулись на сторону варденитов, вслед за чем вспыхнуло яростное восстание туземцев Роджихлата. Сие великое обрушение, именуемое [Concept('xihuetzi','Ксихуэци')|E], или «Падение», погнало последние остатки Нецентлаля в джунгли Кирата, где их след навсегда затерялся в истории."
  
