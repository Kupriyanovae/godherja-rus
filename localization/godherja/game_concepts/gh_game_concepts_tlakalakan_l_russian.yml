  game_concept_mavixars_curse:0 "Проклятие Мавиксар"
  game_concept_mavixars_curse_desc:0 "Древняя вера уакакло была куда более свирепой и кровавой, нежели ее нынешнее толкование. Ныне жрецы проповедуют единение с ближними (ибо Тенесе грозно зрит за ними со своей обители, а оком ему служит луна [Concept('aervalr','Аэрвал')|E]), и под нож жертвенника идут лишь добровольцы (ибо Тенесе не терпит в своих чертогах разгневанных душ). Сии великие перемены наступили вслед за жертвоприношением царицы Мавиксар из племени михабиксо, коя прокляла убийц после лютой казни — как ее самой, так и всех ее сородичей.\n\nЧерное проклятие пало на племя, когда царицу предал смерти Тлакалакан, [Concept('magi','маги')|E]-царь Азартик. Предания поют, что в миг ее кончины небеса прорезала ослепительная вспышка света, и потрясенные страхом уакакло ворвались в святилище, вырезав Азартику и весь его род. Невзирая на казнь мага, уакакло верят, что бесконечные беды, коими была полна [Concept('tlakalakan_migration','миграция тлакалаканов')|E], родились из злого рока [Concept('axemati_tlakalaktli','Аксемати Тлакалактли')|E]. Сказания тлакалаканов гласят, что предсмертные слова царицы были таковы:\n\n#N Проклятие и вечный ужас вам, Азартик, вашим родичам и вашей крови! Пусть ваш народ не знает покоя, покуда вы продолжаете дышать, и пусть они никогда не обретут оседлого житья на землях, свободных от черных трагедий, пока ими правит хоть один из ваших потомков. Покуда ваш народ бьет челом вашей «божественной» крови, их собственная будет отравлена отчаянием! Будь проклят, Азартик! И будь проклято все, чем вы правите и когда-либо будете править! #"

  game_concept_tlakalakan_migration:0 "Миграция тлакалаканов"
  game_concept_tlakalakan_migration_desc:0 "Народ тлакалаканов явился в ведомые земли с дальнего полудня [Concept('sarradon','саррадонских')|E] просторов вскоре после того, как поднялась нынешняя [Concept('aversaria','Аверсария')|E], и принес с собой веру, коя годами может поспорить с самим [Concept('ritualism','ритуализмом')|E]. И хотя истинные причины их исхода со временем стерлись из памяти веков, как и сама их древняя летопись, предания тлакалаканов сходятся в одном: они бежали от двух злых держав, восставших на их севере и юге и подмявших под себя их родину. Станется, одной из них была таинственная и искушенная в науках Адабисса. Исход племени был гибельным: всякая попытка осесть на земле и возродить свои грады рушилась под ударами стихий, набегов чужестранцев или внутренних распрей. Самый долгий век оседлой жизни, запечатленный в их песнях, длился не более двух поколений, и все это время они гнули спину перед божественным владыкой.\n\nТлакалаканы уверяют, будто нескончаемые несчастья суть плоды [Concept('mavixars_curse','проклятия Мавиксар')|E] и [Concept('axemati_tlakalaktli','Аксемати Тлакалактли')|E] — злого наследия, что шло за ними по пятам до самой Роджихлат Мару. Их [Concept('necentlal_tlaklaktli','Нецентлаль Тлакалактли')|E], основанная во втором веке от И.С., изнывала от усобиц и мятежей, покуда они тщетно пытались защитить свой новый дом как от местных диких племен, так и от ритуалистов, наступавших с полуночных рубежей.\n\nКогда же в этот край пришли мужи с Дальнего Востока — племена Мамурамат, они скрепили союз с ритуалистами против тлакалаканов в обмен на земли Роджихлат Мару, что привело к череде страшных поражений, в прах разваливших их вечевой союз. И едва последняя их попытка обрести родной очаг рухнула под тяжестью бунтов и вражьих нашествий, уакакло вновь снялись с мест, спасаясь от варденитов, ритуалистов и туземцев, дабы уйти в глухие джунгли Кирата."

  game_concept_xihuetzi:0 "Ксихуэци"
  game_concept_xihuetzi_desc:0 "Крах [Concept('necentlal_tlaklaktli','Нецентлаль Тлакалактли')|E] не был мирным. После того как рати тлакалаканов были вдребезги разбиты пришлыми [Concept('wardenism','варженитскими')|E] воинами, коренные роды Роджихлат Мары, коих долго удерживали в границах сего несчастливого союза, подняли великий бунт. Вскоре после того Пять Городов — главные грады и средоточия власти тлакалаканов — были преданы огню; сие стало грозным знамением их падения. Выбитая из своих чертогов, последняя рать Нецентлаля оказалась обременена толпами беженцев и заботой о том, как уберечь остатки народа от лютой смерти. После провального похода ради возвращения великого града Лексикатль — вернее, его дымящихся руин — и в кольце наседавших врагов, вожди приняли роковое решение. Последняя рать, последний живой остаток тлакалаканов, должна была отступить в дебри Кирата, дабы переждать грозу и скопить силы для нового восстания.\n\nОднако по пришествии в Кират сия мечта обернулась пустой надеждой. Покуда толпы беженцев уходили все глубже под зеленый навес, им приходилось пробиваться сквозь чащу, неся страшные потери в отчаянных поисках чистой воды или съедобных кореньев. За четыре зимы после исхода в Кират все воеводы рати полегли в глуши, а вместе с ними угас и последний след Нецентлаля. Ведомые древними жрецами, тлакалаканы ушли в самые глухие чащобы, ступив на земли, откуда еще ни один человек не возвращался живым. И постепенно, через тяготы дикой природы и массовую гибель сородичей, их общество стало перерождаться во что-то иное, почти неотличимое от тех самых диких племен, от коих они некогда бежали. Их древняя богатая история была забыта, искусство письма почти утрачено, а стародавние обычаи тлакаланской культуры преданы полному забвению.\n\nИбо Ксихуэци пожрал не только их города и земли. Он поглотил саму их цивилизацию."
  
