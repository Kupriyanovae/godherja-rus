  game_concept_axemati_tlakalaktli:0 "Аксемати Тлакалактли"
  game_concept_axemati_tlakalaktli_desc:0 "Предания тлакалаканов свято верят в проклятие черного невезения и в то, что их роду вовек не познать мира; в сию горькую правду они верили на протяжении почти всей своей истории. Все началось за тысячу лет до того, как поднялась великая [Concept('aversaria','Аверсария')|E], когда народ тлакалаканов был [Concept('mavixars_curse','проклят')|E] царицей Мавиксар во время ее принесения в жертву Тенесе.\n\nИ хотя уакакло ныне велит вести к алтарю лишь добровольцев, так водилось далеко не всегда. Древние сказания повествуют о куда более воинственной вере былых эпох, когда враждующие племена без жалости резали друг друга на жертвенниках, дабы насытить бесконечную жажду крови Тенесе, и всякая такая смерть питала их [Concept('magi','магов')|E]-царей благословением бога. Тлакалаканы вспоминали, что одним из их злейших врагов был народ михабиксо, и что во время великого набега они пленили юную царицу михабиксо Мавиксар (в песнях часто поется, будто ей исполнилось всего двенадцать зим). Тлакалаканский маг-царь Азартик, чьи великие злодеяния до сих пор поминают в страшных сказках, заклал девицу на их святейшем алтаре, тем самым накликав на племя [Concept('mavixars_curse','проклятие Мавиксар')|E].\n\nИз дикого страха перед сим проклятием люди уакакло убили самого Азартика и весь его род, а после навсегда отреклись от кровавых обычаев отцов. И все же кара не отступила, повлекши за собой горестную [Concept('tlakalakan_migration','миграцию тлакалаканов')|E] и их последующее полное [Concept('xihuetzi','падение')|E]."

