  game_concept_mavixars_curse:0 "Проклятие Мавиксар"
 game_concept_mavixars_curse_desc:0 "Древняя вера Уакакло была куда более жестокой, чем её современное воплощение. Жрецы теперь проповедуют единение с другими (ибо Тенесе тоже наблюдает за ними, а его око — это луна [Concept('aervalr','Эрвальр')|E]), и лишь добровольцы идут на заклание (ибо Тенесе не любит общество разгневанных душ). Эти перемены последовали за жертвоприношением царицы Мавиксар из михабиксо, которая прокляла их после жестокого убийства — как её самой, так и её народа.\n\nПроклятие последовало за её принесением в жертву Тлакалаканом, [Concept('magi','маги')|E]-царем Азартиком. Говорят, что после её смерти произошла мощная вспышка света, и потрясённые уакакло ворвались в храм, перебив Азартику и его семью. Несмотря на это, они утверждают, что бесконечные бедствия во время [Concept('tlakalakan_migration','миграции тлакалаканов')|E] были порождены [Concept('axemati_tlakalaktli','Аксемати Тлакалактли')|E]. Легенды тлакалаканов гласят, что слова проклятия были таковы:\n\n#N Проклятие и ужас вам, Азартик, вашим родичам и вашей крови! Пусть ваш народ не знает покоя, пока вы продолжаете дышать, и пусть они никогда не осядут на землях, свободных от крови трагедий, пока ими правит хоть один из ваших потомков. Пока ваш народ поклоняется вашей «божественной» крови, их собственная будет отравлена отчаянием! Будь проклят, Азартик! И будь проклято всё, чем вы правите и когда-либо будете править! #"
 
 game_concept_tlakalakan_migration:0 "Миграция тлакалаканов"
 game_concept_tlakalakan_migration_desc:0 "Народ тлакалаканов прибыл в известный мир с дальнего юга [Concept('sarradon','Саррадона')|E] вскоре после формирования современной [Concept('aversaria','Аверсарии')|E] и принёс с собой веру, возможно, столь же древнюю, как [Concept('ritualism','ритуализм')|E]. Хотя их истинные причины со временем стёрлись из памяти, как и сама история, тлакаланские предания сходятся в том, что они бежали от двух злых империй, возникших на их севере и юге и покоривших их родину. Предполагается, что одной из них была таинственная и развитая Адабисса. Миграции были катастрофическими: неоднократные попытки обосноваться и восстановить свою цивилизацию были уничтожены стихийными бедствиями, иностранными захватчиками или внутренними распрями. Самый долгий период оседлости, зафиксированный в их истории, длился не более двух поколений, в течение которых они находились в подчинении у божественного владыки.\n\nТлакалаканы утверждают, что повторяющиеся катастрофы являются результатом [Concept('mavixars_curse','проклятия Мавиксар')|E] и [Concept('axemati_tlakalaktli','Аксемати Тлакалактли')|E] — наследия, которое последовало за ними в Роджихлат Мару. Их [Concept('necentlal_tlaklaktli','Нецентлаль Тлакалактли')|E], основанная во II веке от И.С., страдала от междоусобиц и восстаний, поскольку они пытались сохранить свой новый дом как от местных племён региона, так и от ритуалистов, наступавших с севера.\n\nКогда в регион прибыли жители Дальнего Востока — Мамурамат, они заключили союз с ритуалистами в обмен на Роджихлат Мару, что привело к череде катастрофических поражений, критически дестабилизировавших их Федерацию. Поскольку их самая недавняя попытка обрести дом рухнула под тяжестью восстаний и вторжений, уакакло предприняли ещё одну миграцию, спасаясь от стражников, ритуалистов и коренных народов, чтобы добраться до джунглей Кирата."
 
 game_concept_xihuetzi:0 "Ксихуэци"
 game_concept_xihuetzi_desc:0 "Крах [Concept('necentlal_tlaklaktli','Нецентлаль Тлакалактли')|E] не был мирным. После того как армии тлакалаканов были разбиты захватчиками-[Concept('wardenism','стражниками')|E], коренные племена Роджихлат Мары, долгое время удерживаемые в рамках этого несчастливого союза, подняли восстание. Вскоре после этого Пять Городов — урбанистические центры, в которых была сосредоточена власть тлакалаканов — были подожжены; это стало наглядным символом падения тлакалаканов. Изгнанная из своих городов, последняя армия Нецентлаля вскоре оказалась обременённой беженцами и задачей найти хоть какой-то способ выжить. После провальной кампании по возвращению великого города Лексикатль — или, скорее, его руин — и в условиях окружения врагами, было принято роковое решение. Последняя армия, последний остаток тлакалаканов, должна была отступить в Кират, где они могли бы переждать хаос, чтобы восстать вновь.\n\nОднако по прибытии в Кират эта мечта оказалась лишь фантазией. По мере того как беженцы продолжали просачиваться в джунгли, стало необходимо пробираться вглубь, неся ужасающие потери в отчаянном поиске чистой воды или съедобных растений. В течение четырёх лет после входа в Кират всё командование армии погибло, а вместе с ним угас и последний остаток Нецентлаля. Под руководством древних жречеств тлакалаканы двинулись ещё глубже в джунгли, ступив на землю, из которой ещё никто из людей не возвращался. И постепенно, через компромиссы с враждебной средой и через массовую гибель тлакалаканов, их общество начало меняться во что-то иное, почти неотличимое от тех самых племён, от которых они когда-то бежали. Их древняя и богатая история была почти забыта, искусство письма почти утрачено, а древние традиции тлакаланской культуры были преданы забвению.\n\nИбо Ксихуэци захватил не только их города и их земли. Он поглотил их цивилизацию."
  
