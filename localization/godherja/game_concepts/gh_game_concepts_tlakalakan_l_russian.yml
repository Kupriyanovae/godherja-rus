  game_concept_necentlal_tlaklaktli:0 "Нецентлаль Тлакалактли"
  game_concept_necentlal_tlaklaktli_desc:0 "Когда тлакалаканы [Concept('tlakalakan_migration','мигрировали')|E] в Роджихлат Мару, они изначально пытались восстановить древнюю организацию своего общества. После коротких войн с местными государствами по прибытии, они основали несколько городов по всему региону и заключили между ними дипломатический союз. Вскоре после своего создания эта «Тлакаланская федерация», или «Нецентлаль Тлакалактли» на языке тлакалаканов, была расширена и включила в себя множество местных племён, которые с трудом адаптировались к новому политическому порядку.\n\nНесмотря на все усилия и проявленный интерес, Нецентлаль сталкивался с постоянными бедствиями и нестабильностью. Тлакалаканы винили в этом [Concept('axemati_tlakalaktli','Аксемати Тлакалактли')|E] и их древнее проклятие, поскольку бесконечные восстания, убийства правителей, голод и дурные предзнаменования преследовали их политический строй, неоднократно доводя его до грани краха. Несмотря на искреннее желание создать равноправный союз, где все правители могли бы работать вместе в мире, туземцы никогда им не доверяли. Видя в пришельцах нечто странное и чуждое, а в их городах и поселениях — и подавно, союз пытался примирить различия между государственными структурами тлакалаканов и традициями местных племён. Это, наряду с общей нестабильностью, привело к неоднократным гражданским войнам, в которых туземцы отделялись от Нецентлаля, чтобы воевать против [Concept('magi','магов')|E]-царей.\n\nГибель Нецентлаля последовала за войнами с военачальниками-[Concept('ritualism','ритуалистами')|E], а затем [Concept('wardenism','стражниками')|E]. После столетий борьбы против ритуализма маги-цари согласились объединиться против стражников в обмен на суверенитет над Роджихлат Марой. Последующие военные катастрофы привели к тому, что их союзники-ритуалисты покинули регион или перешли на сторону стражников, за чем последовало массовое восстание туземцев Роджихлата. Это [Concept('xihuetzi','Ксихуэци')|E], или «Падение», привело к массовой миграции в джунгли Кирата, где последние остатки Нецентлаля исчезли в истории."
  
