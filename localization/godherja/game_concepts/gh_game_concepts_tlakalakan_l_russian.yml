  game_concept_axemati_tlakalaktli:0 "Аксемати Тлакалактли"
  game_concept_axemati_tlakalaktli_desc:0 "Тлакаланские легенды верят в проклятие невезения и в то, что они никогда не познают покоя; в это они верили на протяжении большей части своей истории. Всё началось за тысячу лет до формирования [Concept('aversaria','Аверсарии')|E], когда народ тлакалаканов был [Concept('mavixars_curse','проклят')|E] царицей Мавиксар во время её жертвоприношения Тенесе.\n\nХотя Уакакло призывает жертвовать только добровольцев, так было не всегда. Предания говорят о некогда гораздо более воинственной вере, где враждующие племена приносили друг друга в жертву, чтобы удовлетворить бесконечную потребность Тенесе в крови, и каждое такое жертвоприношение подпитывало их [Concept('magi','магов')|E]-царей благословением Тенесе. Тлакалаканы утверждали, что одним из их врагов был народ михабиксо, и что во время великого набега они захватили царицу михабиксо Мавиксар (часто утверждается, что ей было всего двенадцать лет). Тлакалаканский маг-царь Азартик (сказки часто говорят о его великих злодеяниях) принёс её в жертву на их святейшем алтаре и высвободил [Concept('mavixars_curse','проклятие Мавиксар')|E].\n\nИз страха перед проклятием уакаклоханцы убили Мавиксар и его династию, а затем отказались от своих жестоких обычаев. Тем не менее, проклятие продолжалось и привело к [Concept('tlakalakan_migration','миграции тлакалаканов')|E] и их дальнейшему [Concept('xihuetzi','падению')|E]."

