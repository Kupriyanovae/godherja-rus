 game_concept_astiliak_magi:0 "Астиликские маги"
 game_concept_astiliak_magi_desc:0 "Одной из примечательных черт являются место [Concept('magi','магов')|E] в верованиях астиликов. Глаголют, будто сами маги суть аспект богов (чаще прочих — Ирраду), кои должны перенять повадки и обличье какого-либо зверя, коли хотят сберечь свое смертное тело и не пасть жертвой [Concept('overwhelmation','перегрузки')|E]. Оттого многие астиликские маги проводят по нескольку лет, живя средь выбранного ими зверья, и часто носят одеяния, сшитые из их шкур и мехов."

