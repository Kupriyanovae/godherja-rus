 game_concept_astilik_gods:0 "Астиликские боги"
 game_concept_astilik_gods_desc:0 "Все боги являют себя на [Concept('aeras','Эрасе')|E] через зверей да погоду, кои служат им верными слугами и проявлениями. В большинстве общин всякий зверь связан с определенным богом, равно как и природные феномены вроде молний, наводнений и [Concept('gedeora','гедеор')|E]. Сии верования находят свое отражение и в их [Concept('astiliak_magi','магах')|E]."
 
