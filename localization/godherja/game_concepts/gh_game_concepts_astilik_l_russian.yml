 game_concept_astiliak_magi:0 "Астиликские маги"
 game_concept_astiliak_magi_desc:0 "Одной из примечательных особенностей является статус [Concept('magi','магов')|E] в верованиях астиликов. Считается, что сами маги суть воплощение богов (чаще всего Ирраду), которые обязаны перенять повадки и облик какого-либо животного, если желают сохранить свою смертную форму и не пасть жертвой [Concept('overwhelmation','перегрузки')|E]. Из-за этого многие астиликские маги проводят по нескольку лет, живя среди выбранных ими животных, и часто носят одеяния, сшитые из их шкур и мехов."
