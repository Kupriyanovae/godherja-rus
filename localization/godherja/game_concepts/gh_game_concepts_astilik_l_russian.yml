 game_concept_astilik_gods:0 "Астиликские боги"
 game_concept_astilik_gods_desc:0 "Все боги представлены на [Concept('aeras','Эрасе')|E] животными и погодными явлениями, которые служат их слугами и воплощениями. В большинстве общин разные виды животных связывают с разными богами, как и природные явления — молнии, наводнения и [Concept('gedeora','гедеоры')|E]. Эти верования отражаются и в представлениях об [Concept('astiliak_magi','астиликских магах')|E]."
 
