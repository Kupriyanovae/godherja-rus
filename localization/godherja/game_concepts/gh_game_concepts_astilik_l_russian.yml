 game_concept_astilik_gods:0 "Астиликские боги"
 game_concept_astilik_gods_desc:0 "Все боги представлены на [Concept('aeras','Эрасе')|E] через животных и погоду, которые служат их слугами и ипостасями. В большинстве общин каждое животное ассоциируется с определенным богом, равно как и природные явления вроде молний, наводнений и [Concept('gedeora','гедеоры')|E]. Эти верования находят свое отражение и в их представлении об [Concept('astiliak_magi','магах')|E]."
 
