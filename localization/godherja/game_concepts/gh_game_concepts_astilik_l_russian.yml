 game_concept_astiliak_magi:0 "Астиликские маги"
 game_concept_astiliak_magi_desc:0 "Одна из примечательных особенностей верований астиликов — положение [Concept('magi','магов')|E]. Считается, что маги сами являются воплощениями одного из богов (чаще всего Ирраду) и должны также принять облик животного, если хотят сохранить смертную форму и не стать жертвами [Concept('overwhelmation','перегрузки')|E]. Поэтому многие астиликские маги проводят несколько лет среди животных избранного вида и нередко носят одежду из их шкур и меха."

