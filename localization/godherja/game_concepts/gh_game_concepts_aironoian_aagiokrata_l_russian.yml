 game_concept_cosmopolitan_eastern_aversarians:0 "Восточный аверсарианский космополитизм"
 game_concept_cosmopolitan_eastern_aversarians_desc:0 "Айронойская Аагиократия — своеобразное смешение десятков местных религий, конфессий и культов, зародившееся в многонациональных торговых городах восточного побережья и речных берегов. Жрецы этого направления носят маски, подобные ольтенским: лишь Чистейшему дозволено увидеть их телесный облик после смерти. Кастовая система, основанная на принадлежности к определённому культу или роду занятий, возникла под влиянием обычаев восточных каширцев. У них же переняли сотни божеств из их бесчисленного пантеона, так что у каждой профессии появился собственный бог-покровитель (предположительно один из Первых Людей). Пожалуй, наиболее заметно кутанагское почитание рек постепенно стало одним из основных догматов восточных культов: при каждом разливе рек верующие устраивают большие шествия и пускают по воде плавучие фонари."
 
