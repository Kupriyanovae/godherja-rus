 game_concept_cosmopolitan_eastern_aversarians:0 "Восточный аверсарианский космополитизм"
 game_concept_cosmopolitan_eastern_aversarians_desc:0 "Айронойская Аагиократия являет собой странное и диковинное слияние множества местных вер, сказаний да обрядов, что зародились в шумных торговых градах, раскинутых по восточному берегу да вдоль рек. Жрецы сего учения носят личины, подобные ольтенским, ибо облик их земной после кончины дозволено зреть лишь Чистейшему. Деление на роды да сословия, где каждый стоит в своем кругу да занятии, перенято у восточных каширцев, так же как и сотни их бессчетных богов, отчего всякий мастеровой чтит своего бога-покровителя (будто бы одного из Первых Людей). Но боле всего бросается в глаза то, как почитание рек по обычаю кутанагов стало одной из главных основ восточных вер: всякий раз, когда воды из берегов выходят, устраиваются великие ходы, во время коих люди устилают реку плывущими огоньками."
 
