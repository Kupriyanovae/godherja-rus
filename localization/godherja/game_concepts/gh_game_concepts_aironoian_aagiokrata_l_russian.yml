 game_concept_cosmopolitan_eastern_aversarians:0 "Восточно-аверсарианский космополитизм"
 game_concept_cosmopolitan_eastern_aversarians_desc:0 "Айронойская агиократия представляет собой причудливое смешение десятков местных религий, верований и культов, зародившееся в космополитичных торговых городах, разбросанных по восточному побережью и рекам. Жрецы этого течения носят маски, подобные маскам ольтенам, поскольку их физический облик после смерти может узреть лишь Чистейший. Кастовая система, основанная на принадлежности к определенному культу или профессии, была вдохновленная обычаями восточных каширцев, равно как и сотни их бесконечных богов, из-за чего представители разных ремесел почитают отдельных покровителей (якобы разных Первых Людей). Но, пожалуй, очевиднее всего то, что поклонение рекам в духе кутанагов постепенно стало одним из главных столпов восточных культов: каждый раз, когда реки выходят из берегов, устраиваются грандиозные шествия, во время которых верующие заполняют воды плывущими фонариками."
 
