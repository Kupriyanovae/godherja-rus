 game_concept_tulharsin_creation_of_man:0 "Тулхарсинский миф о сотворении человека"
 game_concept_tulharsin_creation_of_man_desc:0 "В мифах сотворение человека было для богов делом ничтожным да случайным: они набрели на людей, когда рылись в отходах, оставшихся после ярого и громового сотворения Ке-Рена. Обнаружив, что люди слишком слабы, дабы охотиться голыми руками, лишены шерсти, чтобы пережить лютые горные ночи, и слишком боятся темени, чтобы прятаться в безопасных пещерах, боги решили обучить род людской ради его спасения от погибели лишь из промысла и интереса от скуки — да тайного сострадания со стороны Мишкуша."

