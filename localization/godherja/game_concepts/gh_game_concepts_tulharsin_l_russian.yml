 game_concept_tulharsin_creation_of_man:0 "Тулхарсинский миф о сотворении человека"
 game_concept_tulharsin_creation_of_man_desc:0 "В мифах сотворение человека было для богов чем-то второстепенным: они случайно наткнулись на людей, когда рылись в отходах, оставшихся после взрывного акта творения Ке-Рена. Обнаружив, что люди слишком слабы, чтобы охотиться голыми руками, слишком лишены шерсти, чтобы пережить суровые горные ночи, и слишком боятся темноты, чтобы прятаться в безопасных пещерах, боги решили обучить человечество ради его выживания лишь из праздного любопытства — и невысказанного чувства сострадания со стороны Мишкуша."
