 game_concept_four_beasts:0 "Четыре небесных зверя"
 game_concept_kyaldzakaxi:0 "Кьяльдзакаши"
 game_concept_kyaldzakaxi_desc:0 "Кьяльдзакаши, или Четыре небесных зверя — это высший ранг существ в вере кьяали, которые, как считается, несут в себе наибольшую долю божественного начала. Эти твари — одни из самых могущественных и опасных на всем [Concept('aeras','Эрасе')|E], и тот, кто успешно облачается в шкуру одного из них, почитается самими кьяали как полубог. Многие из величайших защитников и героев кьяали носят шкуры Кьяльдзакаши, веря, что они также наделяют владельца силой соответствующего существа.\n\nБаксакха, или Рычащий ящер — величайший из Кьяльдзакаши, что соответствует его прозвищу «Король Сирата». Немногие редкие люди, способные носить его шкуру, часто входят в историю как величайшие лидеры кьяали. Кисохдзи, или Близнецы-змеи, часто носят великие дипломаты, в то время как обладатели шкуры Тхука, или Нагуаля — это стремительные и могучие воины. Экатсу, или Адзе, кьяали носят реже всего; говорят, что он дарует владельцу невидимость и знание того, как течет кровь в теле, что делает их искусными целителями и тайными агентами.\n\nГоворят, что когда-то эта группа называлась Кьяльдзаквехна, или Пять небесных зверей, но какое именно существо было пятым и по какой причине его исключили из культа, теперь утеряно в веках."
 
 game_concept_godhunt:0 "Охота на бога"
 game_concept_kyalmuku:0 "Кьяльмуку"
 game_concept_kyalmuku_desc:0 "Кьяльмуку, или Охота на бога — это проводимый кьяали ритуал, во время которого они отправляются в Кьяаль, чтобы выследить одного из [Concept('kyaldzakaxi','Кьяльдзакаши')|E] и добыть его шкуру для ношения. Как правило, в Кьяльмуку участвуют только самые сильные кьяали из-за опасной природы как самой добычи, так и их охотничьих угодий. Кьяльмуку завершается ритуальным облачением охотника в шкуру, причем успех засчитывается только в том случае, если охотник выживет в церемонии смены обличья. Тех, кому это удается, кьяали глубоко почитают, веря, что это знак признания ценности и силы охотника со стороны Кьяаля."
 
