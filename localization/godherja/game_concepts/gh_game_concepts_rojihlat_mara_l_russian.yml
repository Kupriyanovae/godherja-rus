 game_concept_mtuwe_dark_times:0 "Время Страха"
 game_concept_thu_usiktwe:0 "Тху Усиктве"
 game_concept_thu_usiktwe_desc:0 "Тху Усиктве, или Время Страха — это темное лихолетье мтуве в конце восьмого века, начавшееся, когда [Concept('magi','кьяальский')|E] маг Ксибал совершил то, что с древних пор почиталось невозможным: принял обличье Тше-тла и обратил его лютую мощь ради покорения большей части Южного Роджихлат Мара. Глаголют, Ксибал подсаживал муравьев Тше-тла в мозг как живым, так и мертвым, что позволяло ему водить их телами по своей прихоти. Сам Ксибал из-за своего страшного ведовства почитался неуязвимым, отчего наступили годы всевластия сего воеводы на юге.\n\nТху Усиктве завершилось со смертью Ксибала в конце века, когда он средь бела дня обратился в пламенный столп. Кьяали узрели в том знак воли духов и без промедления истребили остатки ратей Ксибала, кои сильно поредели после кончины мага. Муки и разорение, принесенные Ксибалом, едва не сгубили кьяали и раскололи верующих на отдельные нелюдимые племена."

 game_concept_samhatepaya:0 "Самхатепайя"
 game_concept_samhatepaya_desc:0 "Самхатепайя, или «Великая высадка» на языке хмасеак, знаменует их приход и последующий набег на Южный Роджихлат Мара в начале девятого века. Местные мтуве, коих обычно трудно одолеть из-за их упорства и знания лесных троп, были незадолго до того ослаблены черными делами [Concept('thu_usiktwe','Тху Усиктве')|E], изведшими большую часть их людского рода. Хмасеак смогли без труда рассеять силы мтуве, зажав в кулак разрозненные племена Юга."
 
