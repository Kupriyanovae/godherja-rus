 game_concept_four_beasts:0 "Четыре небесных зверя"
 game_concept_kyaldzakaxi:0 "Кьяльдзакаши"
 game_concept_kyaldzakaxi_desc:0 "Кьяльдзакаши, или Четыре небесных зверя — это высший чин созданий в вере кьяали, кои, как считается, несут в себе наибольшую долю искры духов. Сии твари — одни из самых могучих и грозных на всем [Concept('aeras','Эрасе')|E], и тот, кто сумеет облачиться в шкуру одной из них, почитается самими кьяали за полубога. Многие из величайших заступников и витязей кьяали носят шкуры Кьяльдзакаши, веря, что они также наделяют владельца силой помянутого зверя.\n\nБаксакха, или Рычащий ящер — величайший из Кьяльдзакаши, что вторит его прозвищу «Король Сирата». Немногие редкие мужи, способные носить его шкуру, часто входят в сказания как величайшие вожди кьяали. Кисохдзи, или Близнецы-змеи, часто достаются великим толмачам да ходокам, в то время как обладатели шкуры Тхука, или Нагуаля — это стремительные и могучие ратники. Экатсу, или Адзе, кьяали носят реже всего; поговаривают, будто он дарует владельцу невидимость и знание того, как течет кровь в жилах, что делает их искусными знахарями и ночными соглядатаями.\n\nГлаголют, что в старину сие братство звалось Кьяльдзаквехна, или Пять небесных зверей, но какая именно тварь была пятой и за какое беззаконие ее вычеркнули из культа, теперь утеряно в веках."

 game_concept_godhunt:0 "Охота на бога"
 game_concept_kyalmuku:0 "Кьяльмуку"
 game_concept_kyalmuku_desc:0 "Кьяльмуку, или Охота на бога — это проводимый кьяали обряд, во время коего они уходят в Кьяаль, дабы выследить одного из [Concept('kyaldzakaxi','Кьяльдзакаши')|E] и добыть его шкуру для ношения. Как водится, в Кьяльмуку участвуют лишь самые сильные кьяали из-за лютой природы как самой добычи, так и их охотничьих угодий. Кьяльмуку венчается ритуальным облачением охотника в шкуру, причем удача засчитывается лишь в том случае, если добытчик выживет в обряде смены обличья. Тех, кому то удается, кьяали глубоко почитают, веря, что сие есть знак признания верности и силы охотника со стороны Кьяаля."
 
