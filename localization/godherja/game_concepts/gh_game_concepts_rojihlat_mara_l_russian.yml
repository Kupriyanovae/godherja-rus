 game_concept_mtuwe_dark_times:0 "Время Страха"
 game_concept_thu_usiktwe:0 "Тху Усиктве"
 game_concept_thu_usiktwe_desc:0 "Тху Усиктве, или Время Страха — это темные века мтуве в конце VIII века, начавшиеся, когда кьяальский [Concept('magi','маг')|E] Ксибал совершил то, что долгое время считалось невозможным: принял облик Тше-тла и использовал свою силу для завоевания большей части Южного Роджихлат Мара. Говорят, Ксибал внедрял муравьев Тше-тла в мозг как живых, так и мертвых, что позволяло ему управлять их телами по своему усмотрению. Сам Ксибал из-за своего могущества считался неуязвимым, что привело к периоду полного доминирования военачальника на юге.\n\nТху Усиктве завершилось после смерти Ксибала в конце века, когда он спонтанно превратился в огненный столп. Кьяали восприняли это как знак божественного вмешательства и быстро уничтожили остатки армий Ксибала, которые сильно поредели после смерти мага. Страдания и опустошение, причиненные Ксибалом, едва не погубили кьяали и раскололи верующих на отдельные изолированные племена."
 
 game_concept_samhatepaya:0 "Самхатепайя"
 game_concept_samhatepaya_desc:0 "Самхатепайя, или «Великая высадка» на языке хмасеак, означает их прибытие и последующее вторжение в Южный Роджихлат Мара в начале IX века. Местные мтуве, которых обычно трудно завоевать из-за их упорства и знания местности, были недавно ослаблены событиями [Concept('thu_usiktwe','Тху Усиктве')|E], истребившими большую часть их населения. Хмасеак смогли легко разгромить силы мтуве, укрепив свой контроль над различными племенами Юга."
 
