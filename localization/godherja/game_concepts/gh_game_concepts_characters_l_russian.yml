 game_concept_aeschraes: "Эшрей «Владыка Пепла»"
 game_concept_aeschraes_desc: "#BOL Эшрей Эркаргиад#! пришел в сей мир во времена, когда гремел [Concept('odrstund','Одрстунд')|E|l], в семье этепезейского поднаместника Эпистоникона и девы из славного и знатного рода Эркаргиадов. Когда Эшрею исполнилось тринадцать лет, Эпистоникон, лютый и безумный пьяница, в припадке ярости забил насмерть его младшую сестру Ариас, кою отрок почитал превыше всех. В ответном порыве гнева Эшрей сразил своего родителя и до основания испепелил город-чертог, в коем обитала его семья.\n\nПосле сего страшного проявления ведовской силы Эшрей бежал в [Concept('mayikrata','Майикратию')|E], где попал под опеку магистра Пелтры вместе с другой сбежавшей знатной особой — Аксиотеей. Хотя в те годы они, как глаголют, были дружны, подстрекательства и коварные козни их наставника довели дело до явной вражды. На исходе обучения им велено было сойтись в сече насмерть. Эшрей, будучи наголову разбитым и истекающим кровью под ударами Аксиотеи, был назван победителем лишь ради формы: после [Concept('rathiax_incident','катастрофической битвы')|E] Аксиотея рухнула без чувств, что вынудило Совет Майикроллолана до срока прервать сию дуэль.\n\nЭшрей, окончив учение и приняв чин магистра Майикроллолана, встал под знамя Государственного двадцать первого легиона «Анесимасий» и сделался его легоном. Однако укоренившаяся в народе молва о том, что Аксиотея была истинной победительницей их схватки, тяжким бременем легла на его честное имя. Прошли годы, в кои вес Эшрея среди вельмож да бояр был почтенным, но ничем особо не примечательным, хотя им с Аксиотеей снова пришлось столкнуться лбами на сходах после ее брака с аутократором Анесимасием. На одном из свадебных пиров Анесимасия и Аксиотеи Эшрей сидел средь гостей и держал несколько тайных речей с Аксиотеей. Суть тех разговоров так и осталась сокрыта, но на исходе пиршества грянуло печально известное [Concept('poisoning_of_anesimasios','отравление Анесимасия')|E].\n\nЗа одну ночь аверсарианские дела снова содрогнулись, и началась [Concept('imperial_civil_war','имперская гражданская война')|E]. Эшрей вырвал победу ценой принесения в жертву своей империи и своего нового рода, сотворив ужасающее заклятие [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E]. Эшрей правил из Орайсполя своей [Concept('ashen_aautokrata_fix','Пепельной аавтократией')|E] вместе с такими зловещими наместниками, как [karthyn_delenel|E] и [Concept('demetros_detheniax','Деметрос Железный Шип')|E], вплоть до тысяча двести двадцать девятого года от основания Орайсполя, когда леган Исацея возглавил [Concept('the_vilnian_assault','Вильнийский штурм')|E|l], в ходе коего Эшрей был свергнут и [Concept('the_oration_of_legions','объявлен погибшим')|E] для всего [Concept('the_continent','Расколотого берега')|E]. То было преувеличением, однако из-за разорения [Concept('theyssian_scrivenery_network_fix','Тейссианской писчей сети')|E], устроенного архимагом Терроксом, держава Эшрея окончательно распалась во времена, когда полыхнули [Concept('six_great_revolts','шесть великих восстаний')|E]."