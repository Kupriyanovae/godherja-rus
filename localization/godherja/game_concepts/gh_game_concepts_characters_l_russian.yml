 game_concept_aeschraes: "Эсхрей «Владыка Пепла»"
 game_concept_aeschraes_desc: "#BOL Эсхрей Эркаргиад#! родился во времена [Concept('odrstund','Одрстунда')|E|l] в семье этепезейского поднаместника Эпистоникона и представительницы престижной династии Эркаргиадов. Когда Эсхрею было 13 лет, Эпистоникон, жестокий и садистичный пьяница, в припадке ярости убил его младшую сестру (и его самое доверенное лицо) Ариас. В ответном порыве гнева Эсхрей сразил своего отца и полностью уничтожил город-дворец, в котором обитала его семья.\n\nПосле этого колоссального проявления магической силы Эсхрей бежал в [Concept('mayikrata','Майикратию')|E], где попал под опеку магистра Пельтры вместе с другой сбежавшей знатной особой — Аксиотеей. Хотя в то время они, как говорят, были близки, подстрекательства и манипуляции их наставника довели их отношения до официального соперничества. В конце обучения им приказали драться на дуэли насмерть. Эсхрей, будучи наголову разбитым и окровавленным Аксиотеей, был объявлен победителем лишь формально: после [Concept('rathiax_incident','катастрофической битвы')|E] Аксиотея рухнула без сознания, что вынудило Совет Майикроллолана досрочно прекратить дуэль.\n\nЭсхрей, окончив обучение и получив звание магистра Майикроллолана, вступил в ряды Государственного XXI легиона «Анесимасий» и стал его легоном, однако укоренившееся в народе мнение о том, что Аксиотея была законным победителем их дуэли, преследовало его репутацию. Прошли годы, в течение которых политическое положение Эсхрея было респектабельным, но никогда особо выдающимся, хотя они с Аксиотеей снова столкнулись лбами в политике после ее брака с аутократором Анесимасием. На одном из свадебных пиров Анесимасия и Аксиотеи Эсхрей присутствовал среди гостей и провел несколько тайных бесед с Аксиотеей. Суть этих разговоров так и осталась тайной, но в конце банкета произошло печально известное [Concept('poisoning_of_anesimasios','отравление Анесимасия')|E].\n\nЗа одну ночь аверсарианская политика снова содрогнулась, и началась [Concept('imperial_civil_war','имперская гражданская война')|E]. Эсхрей вырвал победу ценой принесения в жертву своей империи и своей новой семьи, сотворив ужасающее заклинание [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E]. Эсхрей правил из Орайсполя своей [Concept('ashen_aautokrata_fix','Пепельной автократией')|E] вместе с такими печально известными наместниками, как [karthyn_delenel|E] и [Concept('demetros_detheniax','Деметрос Железный Шип')|E], вплоть до 1229 года от основания Орайсполя, когда леган Исацея возглавил [Concept('the_vilnian_assault','Вильнийский штурм')|E|l], в ходе которого Эсхрей был свергнут и [Concept('the_oration_of_legions','объявлен погибшим')|E] для всего [Concept('the_continent','Расколотого берега')|E]. Это было преувеличением, однако из-за уничтожения [Concept('theyssian_scrivenery_network_fix','Тейссианской писчей сети')|E], устроенного архимагом Терроксом, империя Эсхрея окончательно распалась во время [Concept('six_great_revolts','шести великих восстаний')|E]."