game_concept_pre_boqqarut_damota:0 "Добоккарутская Дамота"
game_concept_pre_boqqarut:0 "Добоккарутский период"
game_concept_pre_boqqarut_damota_desc:0 "До возвышения [Concept('boqqarut_damotada','Боккарута')|E] под предводительством Эшво население Дамоты было сосредоточено вокруг великих озер и рек, протекавших через джунгли, а за земли боролись различные полуплеменные королевства. Большая часть глухих джунглей оставалась неисследованной, и о том, что скрывалось внутри, ходили легенды. Особого внимания заслуживает представление о Трупе, согласно которому древний бог был убит и упокоен в джунглях, наряду с другими практиками, такими как ритуальные исследования и захоронения в джунглях. Этот период подошел к концу с возвышением Боккарута в 258 году от И.С., когда основные племена впервые объединились под единым знаменем."

game_concept_etami_tetenik:0 "Этами Тетеник"
game_concept_etami_tetenik_desc:0 "Начавшись в 861 году от И.С. со смертью боккара Кайовы, Этами Тетеник стал запутанной борьбой за престолонаследие, переросшей в катастрофическую гражданскую войну, которая привела к краху [Concept('boqqarut_damotada','Боккарута')|E]. Из-за отсутствия очевидного наследника борьба за власть началась как традиционный [Concept('tetenik','тетеник')|E]: множество крупных и мелких претендентов собирали армии и шли на Захали. Однако, в отличие от прошлого, после годичного противостояния разразился открытый конфликт — армии под предводительством Фалора и Дабока, двух могущественных дворян, сошлись в открытом бою у ворот столицы, который вскоре перекинулся и на сам город. Хотя Дабок вышел победителем, он короновал себя боккаром, взирая на руины Захали.\n\nРазумеется, это правление не могло длиться долго, и уже через несколько месяцев объединенная армия нескольких претендентов двинулась на город, свергнув его, после чего их коалиция погрязла в междоусобицах. Пока хаос охватывал центральные земли, окраины империи начали ускользать, поскольку практически любой, кто командовал горсткой людей, провозглашал себя боккаром и либо шел на столицу, либо начинал выкраивать собственное государство из разваливающегося Боккарута. В некоторых регионах, где центральная власть исчезла полностью, [Concept('lodges','ложи')|E] стали единственными оплотами порядка, в то время как в других докризисная знать создавала собственные королевства на пепле Боккарута. Хотя война за Захали продолжалась около десятилетия, Дамота замкнулась в себе, и эпоха военачальников вскоре сменилась периодом мелких княжеств, разделивших некогда единый регион между множеством правителей и государств."

game_concept_ayule_expedition:0 "Экспедиция Аюле"
game_concept_ayule_expedition_desc:0 "Экспедиция Аюле, как она известна в истории, является единственным примером того, как армии [Concept('boqqarut_damotada','Боккарута')|E] вторглись в земли за пределами Дамоты, пытаясь захватить другую сторону Гонанского пути и мегаполис Кудахар в хаосе, охватившем Саррадон после [Concept('the_decimation_of_sarradon','Халакдуна')|E]. Экспедиция началась в 821 году от И.С. и быстро захватила сам стратегический Путь и многие северные земли. Поначалу это казалось великим триумфом, поскольку разрозненные военачальники не могли устоять перед организованными армиями Дамоты. Даже последующие историки считают первоначальную кампанию главным достижением войск Боккарута за всю долгую историю государства.\n\nОднако эта война не вошла в историю как триумф. Хотя великий город Кудахар пал в 823 году от И.С. и на завоеванных территориях было установлено военное положение, дальнейшее продвижение застопорилось, а задача сменилась защитой уже захваченных территорий от нарастающего сопротивления местного населения и набегов кочевников. Военачальники региона перед своим поражением применили тактику выжженной земли, а обитатели пустыни постоянно совершали набеги на караваны, пересекающие Гонанский путь, из-за чего Экспедиция Аюле становилась все более зависимой от жестоких методов выкачивания богатств и от любых припасов, которые удавалось переправить через пустыню.\n\nВ самой Дамоте государство все больше залезало в долги к богатой знати и [Concept('karavuux_capital','Каравууксу')|E], истощая казну ради обеспечения своих все более катастрофических амбиций. Хотя оккупация продолжалась до 829 года от И.С., Экспедиция была выбита после битвы при Лаззане, когда коалиция местных военачальников, кочевников и крестьянских повстанцев сокрушила дамотанские армии, вынудив их к унизительному отступлению через пустыню, после чего Аюле вывел свои войска обратно за Гонанский путь. Все, что его Экспедиция принесла угасающей [Concept('zalreb_dynasty','династии Залреб')|E], — это долги, а их армии остались совершенно обескровлены. Многие, по сути, винят в падении Боккарута и начале [Concept('etami_tetenik','Этами Тетеник')|E] сокрушительное поражение в этом вторжении, неудача которого фактически лишила боккара возможности контролировать что-либо за пределами самого Захали."

game_concept_karururi_chorus:0 "Карурурийский хор"
game_concept_karururi_chorus_desc:0 "Прошедший в 254 году от И.С. Карурурийский хор был собором многих величайших праведников [Concept('pre_boqqarut_damota','добоккарутской Дамоты')|E]. Созванный будущим боккаром Эшво, этот великий диалог ставил своей задачей собрать воедино истину о мире из учений нескольких верований. Этот собор считается моментом основания религии моговаи, которая вскоре распространилась по Дамоте.\n\nНесмотря на почти мифический статус, который Хор имеет в настоящем как часть нарратива о возвышении [Concept('boqqarut_damotada','Боккарута')|E], в действительности он стал событием, вызвавшим глубокий раскол. Множество отдельных жрецов, а со временем и целые группы покинули зал, когда объединение вер стало требовать удаления частей, признанных противоречивыми. Пожалуй, самым спорным из многих решений этого органа было провозглашение того, что бог этого мира мертв, что побудило целые сонмы жрецов бежать из владений Эшво, где они продолжили сражаться против Боккарута во время [Concept('war_of_songs','Войны песен')|E]. Когда Хор завершился, он преподнес Эшво две вещи. Во-первых, «Гимны небес» — объединенные и отредактированные песни, запечатлевшие историю и доктрину новой веры. Но во-вторых, на него легло бремя. Поскольку Тот, Кто Был Выше Всех, мертв, именно Эшво должен был стать хранителем Его народа и повести его на поиски Его затерянной гробницы, что сделало его первым кихинетом моговаи."

game_concept_war_of_songs:0 "Война песен"
game_concept_war_of_songs_desc:0 "Война песен была первым конфликтом в истории [Concept('boqqarut_damotada','Боккарута')|E], хотя началась она ещё до формирования этого государства. После ухода части участников с [Concept('karururi_chorus','Карурурийского хора')|E] в ответ на провозглашение смерти бога, в Бусемдо был проведен второй, «истинный» Хор, призвавший всех праведников выступить против опасного еретика Эшво и его марионеточного Хора. Эти бусемдоваи, как их назвала история, подкрепили это заявление составлением и обнародованием своей собственной соперничающей доктрины. Хотя поначалу Эшво не воспринял это всерьез, его многочисленные соперники не упустили возможность спасти свои находящиеся под угрозой земли, и вскоре несколько дамотанских вождей присягнули этому делу своими копьями.\n\nОказавшись атакованным на нескольких фронтах, Эшво предпочел оборонительную стратегию, выделив крупные контингенты своих превосходящих сил для сдерживания северо-западной и восточной армий бусемдоваи, в то время как основные силы он сосредоточил на юге, рассчитывая поочередно разбить врагов. Эта стратегия, хотя и оказалась под угрозой из-за внезапного прорыва одного из его соперников в начале 257 года, в целом доказала свою эффективность, поскольку государство, которое вскоре станет [Concept('boqqarut_damotada','Боккарутом')|E], использовало свое центральное положение, чтобы держать врагов разделенными.\n\nРазгромив юг и северо-запад по отдельности и либо заменив их лидеров, либо добившись от них нерушимых клятв верности, Эшво успешно захватил Исурву благодаря предательству в рядах противника, вынудив Хор Бусемдо снова бежать. После подчинения всех традиционно заселенных регионов Дамоты Эшво собрал всех вождей региона на берегу центрального Этами Бияки, где каждый принял веру моговаи и присягнул Эшво как своему боккару, что официально положило начало истории Боккарута Дамотада. Тем не менее, несмотря на это очевидное поражение, Хор Бусемдо не прекратил борьбу и бежал в глубь джунглей, чтобы продолжать сопротивление распространению моговаи, и был окончательно подавлен лишь в 306 году от И.С."

game_concept_wars_of_silence:0 "Войны тишины"
game_concept_wars_of_silence_desc:0 "Начавшиеся во времена правления [Concept('belar_dynasty','династии Белар')|E], Войны тишины служат общим термином для волн социально-политических потрясений, прокатившихся по Дамоте в последние века существования [Concept('boqqarut_damotada','Боккарута')|E]. Этот период, вызванный нарастающими спорами между [Concept('lodges','ложами')|E] и мелкой знатью, каждая из которых претендовала на власть над небольшими деревнями, где проживало большинство населения Дамоты, характеризовался практически бесконечной чередой мелких стычек между местными представителями этих двух лагерей.\n\nОбычно все начиналось как борьба за власть в какой-нибудь деревне — что жутковато предвещало грядущую [Concept('etami_tetenik','судьбу самого Боккарута')|E], — и все эти Войны развивались по схожему сценарию. Противостояние между все более милитаризованными членами той или иной фракции перерастало в открытое насилие, причем союзы как дворян, так и лож пытались вмешаться в результаты борьбы соседних общин. Когда одно из таких столкновений обострялось, в дело вступала либо Йенусаави Дамотада — Дамотанская гвардия, призванная поддерживать порядок в Боккаруте, — либо, все чаще, силы местного ярки, которые пытались погасить конфликт, выбирая сторону исключительно на основе собственных политических целей. Хотя это часто помогало остановить первоначальную вспышку, неспособность как йенусаави, так и ярки разместить постоянные гарнизоны по всему государству неизбежно создавала почву для нового конфликта в будущем, и эта проблема лишь усугублялась по мере того, как тянулись последние века дамотанской истории.\n\nПодстегиваемые как [Concept('the_decimation_of_sarradon','Халакдуном')|E], так и отвлечением обоих видов миротворцев на [Concept('ayule_expedition','вызовы IX века')|E], Войны тишины превратились в постоянно нарастающую спираль политического насилия, которая плавно и неразрывно перетекла в Этами Тетеник."

