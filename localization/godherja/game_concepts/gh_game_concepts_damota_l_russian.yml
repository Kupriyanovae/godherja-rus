game_concept_lodges:0 "Ложи"
game_concept_rayakuux_orders:0 "Ордена Раякуукс"
game_concept_lodges_desc:0 "Ложи Дамоты являются важнейшей частью уклада и духа этого края, будучи глубоко интегрированными в жизнь многих дамотанцев. Любопытно, что изначально они были основаны в 572 году от И.С. как ордена Раякуукс — братства верных моговаи, ставивших своей целью поиск бренных останков Всевышнего. Хотя сперва они были преданы лишь этой цели, упадок центральной власти в позднюю пору [Concept('boqqarut_damotada','Боккарута')|E] привел к росту их независимости. Постепенно, по мере ослабления контроля со стороны короны, они разделились по старым племенным связям, которые со временем и заменили. Обретая мощь, они быстро оказались втянуты в большую политику, сыграв решающую роль во Втором [Concept('tetenik','тетенике')|E], и начали разделять между собой ремесла и обязанности. Ордена были официально преобразованы в 682 году от И.С., разделившись на четыре братства: [Concept('rayakuux_capital','Раякуукс')|E], сохранившие первоначальную миссию исследователей; [Concept('karavuux_capital','Каравуукс')|E], превратившиеся в купеческие гильдии; [Concept('waranuux_capital','Варануукс')|E], посвятившие себя ратному делу; и [Concept('qabuux_capital','Кабуукс')|E], фактически ставшие крупными клановыми или семейными союзами. Причины столь масштабного расхождения крылись в политике: число членов этих союзов колоссально выросло, а их цели изменились, чтобы соответствовать духу времени. Однако было бы ошибкой сводить все многообразие к четырем жестким типам, ведь каждое братство само по себе состоит из множества общин со своими обычаями.\n\nВ современной Дамоте эти четыре союза лож глубоко укоренились в повседневной жизни: большинство жителей края состоит в них, а сами организации имеют огромное влияние на волю правителей. Более того, для многих местная ложа стала куда более важным авторитетом, нежели государь, чьими подданными они зовутся."

game_concept_boqqarut:0 "Боккарут"
game_concept_boqqarut_damotada:0 "Боккарут Дамотада"
game_concept_boqqarut_damotada_desc:0 "Боккарут Дамотада был первым государством, сплотившим земли Дамоты в известной истории; он был официально основан в 258 году от И.С. под началом Эшво, первого правителя из [Concept('mesir_dynasty','династии Месир')|E]. Возникнув одновременно с верой моговаи, эта держава всегда была тесно связана с церковью. После первого [Concept('tetenik','тетеника')|E] на смену Месирам пришла [Concept('olani_dynasty','династия Олани')|E], которая завершила покорение и освоение дамотанских джунглей. Считается, что Олани правили в золотой век Дамоты, и они совершили деяния, навсегда определившие будущее края, главным из которых стало создание [Concept('lodges','орденов Раякуукс')|E]. По иронии судьбы, эти же ордена сыграли роковую роль в их падении во время Второго тетеника, что привело к возвышению [Concept('belar_dynasty','династии Белар')|E], при которой Боккарут продолжил свое существование, постепенно впадая в застой по мере того, как ордена Раякуукс обретали независимость и укоренялись в обществе.\n\nПоследней династией, правившей Дамотой, была [Concept('zalreb_dynasty','династия Залреб')|E], которая взошла на престол в ходе Третьего тетеника и отчаянно цеплялась за власть по мере угасания государства. После трагической [Concept('ayule_expedition','Экспедиции Аюле')|E] авторитет империи оказался на грани полного краха, и Кайова, последний боккар, из последних сил пытался удержать бразды правления вплоть до своей бездетной кончины в 861 году от И.С., погрузившей умирающее государство в пламя [Concept('etami_tetenik','Этами Тетеник')|E]."

game_concept_mesir_dynasty:0 "Династия Месир"
game_concept_mesir_dynasty_desc:0 "Правление династии Месир началось одновременно с историей самого [Concept('boqqarut_damotada','Боккарута')|E], поскольку оба они были основаны Эшво наряду с первой кодифицированной верой моговаи. Объединение Дамоты под властью Эшво свершилось благодаря многим причинам, главной из которых стала поддержка нового жречества, оказавшего огромную помощь в управлении растущим государством. Эшво провел череду завоевательных войн, кульминацией которых в 258 году от И.С. стало провозглашение Боккарута после его победы в [Concept('war_of_songs','Войне песен')|E]. Его правление длилось десятилетиями, в течение которых город Захали превратился из небольшого поселения в величественный и многолюдный центр, заслужив славу сияющей жемчужины его новой империи.\n\nПосле его смерти в 297 году от И.С. престол унаследовал его второй сын, Летанья, который искусно использовал свой дипломатический дар для сохранения империи отца. Хотя несколько вассальных вождеств пытались отложиться, Летанье удалось сплотить против них единый фронт, подавив мятежи и укрепив центральную власть. Его преемники, хоть и остались менее известными, примечательны неустанным расширением границ: они покоряли и заселяли огромные пространства неизведанных ранее джунглей, включая эти дикие края в состав державы. Их правление завершилось в 497 году от И.С., когда всеми ненавидимый боккар Фалви был убит, что положило начало Первому [Concept('tetenik','тетенику')|E], после которого Месиров сменила [Concept('olani_dynasty','династия Олани')|E]."

game_concept_olani_dynasty:0 "Династия Олани"
game_concept_olani_dynasty_desc:0 "Взойдя на престол после Первого [Concept('tetenik','тетеника')|E], династия Олани, основанная боккаром Зекуном в 497 году, стала вторым домом, правившим [Concept('boqqarut_damotada','Боккарутом')|E] на смену [Concept('mesir_dynasty','династии Месир')|E]. Зекун, хоть в целом и считался способным правителем, провел большую часть своего правления в трудах по укреплению собственной власти, предотвращая распад Боккарута и завоевывая верность влиятельных вельмож и церкви. Благодаря этой поддержке Олани начали финансировать масштабные походы в джунгли в поисках останков Всевышнего. Хотя это началось ещё при Зекуне, основная доля лесной экспансии пришлась на правление боккары Келвер, чьи труды по освоению земель увенчались успехом и позволили установить контроль над большей частью чащи. Кроме того, в годы ее правления был обнаружен Хасети Мекаб, который быстро перестроили в оплот веры моговаи.\n\nРазумеется, самое важное деяние Олани совершили в 572 году от И.С., когда боккар Датеш основал [Concept('lodges','ордена Раякуукс')|E], пытаясь укрепить свой духовный авторитет ради борьбы с марефаи — набиравшим силу движением за независимость церкви. Поначалу эти ордена имели успех, так как многие обрели надежду в их священных поисках. Однако со смертью Датеша контроль короны над орденами Раякуукс начал ослабевать, и они все чаще вмешивались в местную вражду. Это сыграло роковую роль во Втором тетенике, когда Олани были сменены набиравшей силу [Concept('belar_dynasty','династией Белар')|E]."

game_concept_belar_dynasty:0 "Династия Белар"
game_concept_belar_dynasty_desc:0 "Придя к власти в 667 году от И.С. при Ралоке, которого часто называют последним великим боккаром из-за величественных чертогов, возведенных в его правление, Белары обязаны своим возвышением в том числе поддержке со стороны стремительно менявшихся [Concept('lodges','орденов Раякуукс')|E]. Под началом Ралоки город Захали преобразился и расширился, кроме того, по всей Дамоте было возведено множество монументов и храмов. Конечно, самым впечатляющим его достижением стало строительство Бетами Декиира — обширного тракта, соединившего дальние уголки территорий [Concept('boqqarut_damotada','Боккарута')|E], который быстро стал ключевой артерией дамотанской торговли. Однако его приход к власти сопровождался также созданием [Concept('yarkiyet_system','системы яркитов')|E] и резким расширением прав, предоставленных орденам Раякуукс. После его смерти в 712 году от И.С. трон перешел к его наследнику, боккару Хиджалу, которому пришлось столкнуться с последствиями расточительных трат отца и децентрализации власти.\n\nПытаясь расплатиться с этими долгами, Хиджал предоставил ещё более широкие привилегии недавно разделившимся [Concept('lodges','ложам')|E], одновременно расширяя яркиты и сокращая расходы. Хотя это балансирование позволило ему удержаться на троне, оно спровоцировало [Concept('wars_of_silence','Войны тишины')|E], заставив государство увязнуть в попытках поддерживать порядок в регионах, веками входивших в состав империи. Когда Хиджал умер в 743 году от И.С., возникший хаос привел к Третьему [Concept('tetenik','тетенику')|E], в результате которого Беларов сменила [Concept('zalreb_dynasty','династия Залреб')|E], унаследовавшая глубоко больное государство."

game_concept_zalreb_dynasty:0 "Династия Залреб"
game_concept_zalreb_dynasty_desc:0 "Начав свое правление в 746 году от И.С. с боккара Белоры, Залребы взошли на престол после Третьего [Concept('tetenik','тетеника')|E] и стали последней династией, правившей [Concept('boqqarut_damotada','Боккарутом')|E]. По сравнению с великими свершениями их предшественников, деяния Залребов обычно считаются незначительными: Белора и его потомки застали финальную стадию упадка империи. Их правление стало эпохой угасания власти, когда [Concept('lodges','ложи')|E] и дворяне вступили в открытую борьбу, с трудом сдерживаемую Белорой и его преемниками, которым умело удавалось предотвращать немедленный крах увядающих структур государства. Со смертью Белоры в 773 году от И.С. казалось, что вскоре начнется очередной тетеник, однако его сын Ралери смог взойти на престол сравнительно легко, так как многие другие претенденты были таинственным образом убиты.\n\nЕго причастность, хотя и не была доказана, стала предметом широких слухов, и, чтобы компенсировать нехватку популярности, он начал править с помощью страха. Многие из его видных оппонентов загадочно исчезли, и большинство просто боялось выступить против него. Однако его предположительно кровавая политика (которую он до самой смерти называл лишь совпадением) привела к тому, что его сын Аюле смог довольно легко унаследовать престол в 817 году от И.С. Аюле знаменит одним-единственным деянием, которое уничтожило почти все остатки могущества Боккарута. Именно он начал [Concept('ayule_expedition','Экспедицию Аюле')|E] — вторжение на север, которое закончилось катастрофой, оставив Аюле в глубоких долгах перед сетью [Concept('karavuux_capital','Каравуукса')|E] и нобилитета и сокрушив ядро дамотанской армии. После его смерти в 835 году от И.С. титул боккара перешел к его сыну Кайове, который во многом продолжил эту неэффективную политику; его правление сопровождалось постоянным неповиновением подданных вплоть до его бездетной смерти in 861 году, ознаменовавшей конец Боккарута, когда борьба за власть переросла в [Concept('etami_tetenik','Этами Тетеник')|E]."

game_concept_karavuux:0 "каравуукс"
game_concept_karavuux_capital:0 "Каравуукс"
game_concept_karavuux_capital_desc:0 "Являясь одним из братств дамотанских [Concept('lodges','лож')|E], каравуукс представляют собой союзы погонщиков караванов и купцов, сосредоточенных главным образом в северной Дамоте. Как правило, считается, что каравуукс включает в себя каждого человека, который кормится от его промысла или состоит в его цепочке поставок. Простой пахарь — его член, поскольку часть его припасов продается торговцам. Ремесленник — его член, ведь его товары везут караваны ложи. Местный князь — тоже его член, ибо его власть держится на золоте купцов. Численность каравууксов не поддается счету, хотя существует лишь горстка тех глав, кто обладает реальным политическим весом. Из-за своего обширного влияния каравууксы часто вступают в финансовые распри из-за спорных городов или постоялых дворов, предлагая щедрые дары местным жителям, чтобы те примкнули к ним, тогда как в других местах они выжимают из земель последнюю монету."

game_concept_rayakuux:0 "раякуукс"
game_concept_rayakuux_capital:0 "Раякуукс"
game_concept_rayakuux_capital_desc:0 "Будучи одной из ветвей дамотанских [Concept('lodges','лож')|E], раякуукс ближе всего напоминают прежние [Concept('lodges','ордена Раякуукс')|E], поскольку и те, и другие чтят странствия и изыскания как главные столпы жизни. Однако, в отличие от своих предков, нынешние раякуукс не имеют единого главы, являясь вместо этого широким содружеством множества отдельных групп, хранящих собственные традиции и правила. Несмотря на преданность приключениям, большинство членов раякуукс проводят оседлую жизнь, совершая лишь несколько великих походов за весь свой век. Их роль заключается в поддержке братьев по ложе, помощи товарищам в странствиях и крове для путешественников. Крупные раякуукс нередко имеют строгий порядок, нанимая вооруженную стражу и собирая сведения о своих походах, зачастую накапливая знания поколений, а некоторые общины целиком посвящают себя научным изысканиям."

game_concept_qabuux:0 "кабуукс"
game_concept_qabuux_capital:0 "Кабуукс"
game_concept_qabuux_capital_desc:0 "Являясь одной из ветвей дамотанских [Concept('lodges','лож')|E], кабуукс, пожалуй, дальше всего отошли от своих корней. Пустив корни среди деревенского люда Дамоты, за прошедшие века они превратились в сплоченные клановые союзы. Несколько семей образуют кабуукс, обычно возводя большой общинный дом для совместной жизни, окруженный внушительными полями. Внутри кабуукса кровные и названые узы крепки, и все участники почитаются за родню. Хотя многие из них представляют собой не более чем одиночные усадьбы среди посевов, другие разрослись до колоссальных размеров — с множеством пристроек к первоначальному чертогу, а вокруг некоторых даже выросли целые города.\n\nОтношения между кабуукс запутаны: постоянно меняющаяся сеть союзов, клятв и соперничества формирует миниатюрное подобие феодальной политики, а их роль в жизни простых людей огромна."

game_concept_waranuux:0 "варануукс"
game_concept_waranuux_capital:0 "Варануукс"
game_concept_waranuux_capital_desc:0 "Будучи одной из ветвей дамотанских [Concept('lodges','лож')|E], термин «варануукс» относится к широкому содружеству воинских общин. Хотя эти организации существовали ещё до [Concept('etami_tetenik','Этами Тетеник')|E], их сила и влияние взлетели до небес после падения [Concept('boqqarut_damotada','Боккарута')|E], а численность неимоверно возросла. Хотя поначалу количество их членов может показаться большим, большинство людей в них не являются действующими воинами, образуя ратный «резерв» после обучения, длящегося несколько лет. Костяк этих групп состоит из опытных мастеров, в чьи обязанности входит обучение новобранцев и надзор за ними. Однако во время войны все члены варануукс призываются к оружию, а некоторые группы даже не считают членство полноценным, пока человек не прольет кровь бок о бок с ними. Варануукс часто устраивают стычки друг с другом из-за мелких обид, однако этот ритуальный бой редко бывает смертельным, хотя порой он все же может перерасти в настоящую войну."

game_concept_yarkiyet_system:0 "Система яркитов"
game_concept_yarkiyet_system_desc:0 "Система яркитов была указом правителя [Concept('boqqarut_damotada','Боккарута')|E], осуществленным во времена правления [Concept('belar_dynasty','династии Белар')|E]. В то время как устройство [Concept('olani_dynasty','династии Олани')|E] состояло из большого числа мелких и равных между собой уделов, новые яркиты подчинили их новой группе могущественных наместников, призванных управлять краем от имени боккара. Новоиспеченные ярки, поддержавшие восхождение боккара Ралоки на престол, получили широкие права в своих землях, в первую очередь — сбор податей и суд в местных спорах. Предполагалось, что ярки будут передавать эти доходы боккару, оставляя себе малую долю в награду за верность.\n\nХотя на какое-то время это сработало, ярки быстро начали использовать свою силу для интриг друг против друга, разбазаривая собранное золото на финансирование войн с соседями. Этот раскол усугублялся [Concept('wars_of_silence','Войнами тишины')|E] и сам питал их, поскольку власть наместников оставалась единственным щитом против хаоса, расползавшегося по Боккаруту. Это привело к укреплению системы яркитов даже тогда, когда казна империи опустела."

#LOCATIONS

game_concept_zahali:0 "Мегаполис Захали"
game_concept_zahali_desc:0 "Основанный боккаром Эшво в 258 году от И.С., Захали долгое время оставался бьющимся сердцем Дамоты. Этот статус был заслужен во всех отношениях — благодаря его срединному положению, статусу столицы [Concept('boqqarut_damotada','Боккарута Дамотада')|E] и значению для веры моговаи. Несмотря на века процветания, битва за Захали, ознаменовавшая начало [Concept('etami_tetenik','Этами Тетеник')|E], привела к угасанию величия города, и вся его последующая история превратилась в череду притязаний мелких талкаров, каждый из которых надеется заявить свои права на его древние улицы."

#MISC

game_concept_tetenik:0 "Тетеник"
game_concept_tetenik_desc:0 "Тетеник — это обычай борьбы за престол, который происходил несколько раз в истории [Concept('boqqarut_damotada','Боккарута')|E], как правило, когда законный наследник был неизвестен или отсутствовал. В подобных случаях претенденты из числа могущественных вельмож провозглашали себя законными боккарами, используя верность союзников и угрозу оружием, чтобы заставить врагов склонить колени. После напряженного противостояния правителем становился тот, кто собирал самую сильную коалицию; как правило, он предлагал прощение остальным соперникам в обмен на сложение оружия. Хотя прежде этот обычай работал исправно и обеспечивал мирную передачу короны даже между династиями, крах Боккарута наступил именно в результате эскалации одной из таких распрей — события, ставшего известным как [Concept('etami_tetenik','Этами Тетеник')|E]."
 
