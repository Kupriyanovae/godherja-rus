game_concept_lodges:0 "Ложи"
game_concept_rayakuux_orders:0 "Ордена Раякуукс"
game_concept_lodges_desc:0 "Ложи Дамоты являются одним из важнейших аспектов культурной самобытности региона, будучи глубоко интегрированными в жизнь многих дамотанцев. Интересно, что изначально они были основаны в 572 году от И.С. как ордена Раякуукс — группа религиозных организаций моговаи, ставивших своей целью поиск местонахождения трупа Всевышнего. Хотя изначально они были привязаны к этой цели, упадок центральной власти, характерный для поздней истории [Concept('boqqarut_damotada','Боккарута')|E], привел к росту их независимости. Постепенно, по мере ослабления контроля со стороны боккара, они разделились по старым племенным привязанностям, которые со временем начали замещать. По мере роста их могущества они быстро оказались втянуты в политику, сыграв решающую роль во Втором [Concept('tetenik','тетенике')|E], и начали специализироваться на конкретных практиках. Ордена были официально реорганизованы в 682 году от И.С., разделившись на четыре категории: [Concept('rayakuux_capital','Раякуукс')|E], сохранившие первоначальную миссию; [Concept('karavuux_capital','Каравуукс')|E], превратившиеся в купеческие организации; [Concept('waranuux_capital','Варануукс')|E], сосредоточившиеся на боевых искусствах; и [Concept('qabuux_capital','Кабуукс')|E], фактически превратившиеся в крупные клановые или семейные структуры. Причины столь масштабного расхождения были политическими: членство в этих ассоциациях колоссально выросло, а их цели изменились, чтобы соответствовать этому росту и стимулировать его. Однако было бы неверно чрезмерно обобщать эти группы, сводя их просто к четырем ложам, поскольку каждая категория сама по себе состоит из огромного разнообразия групп со своими специфическими особенностями.\n\nВ современной Дамоте эти четыре объединения лож глубоко укоренились в повседневной жизни: большинство населения региона состоит в них, а сами организации оказывают огромное влияние на действия правителей. Более того, для многих их местная ложа является более важным авторитетом, чем тот, чьими подданными они являются."

game_concept_boqqarut:0 "Боккарут"
game_concept_boqqarut_damotada:0 "Боккарут Дамотада"
game_concept_boqqarut_damotada_desc:0 "Боккарут Дамотада был первым государством, объединившим земли Дамоты в известной истории; он был официально основан в 258 году от И.С. под предводительством Эшво, первого правителя [Concept('mesir_dynasty','династии Месир')|E]. Возникнув одновременно с верой моговаи, его правление всегда было тесно связано с этой религией. После первого [Concept('tetenik','тетеника')|E] на смену Месирам пришла [Concept('olani_dynasty','династия Олани')|E], которая завершила проект по расширению владения в дамотанских джунглях. Считается, что Олани правили в золотой век Дамоты, и они предприняли ряд действий, которые навсегда определили будущее региона, главным из которых стало создание [Concept('lodges','орденов Раякуукс')|E]. По иронии судьбы, эти ордена сыграли роль в их падении во время Второго тетеника, что привело к возвышению [Concept('belar_dynasty','династии Белар')|E], при которой Боккарут продолжил свое существование, постепенно впадая в стагнацию по мере того, как ордена Раякуукс распадались и укоренялись в дамотанском обществе.\n\nПоследней династией, правившей Дамотой, была [Concept('zalreb_dynasty','династия Залреб')|E], которая взошла на престол в ходе Третьего тетеника и отчаянно цеплялась за власть по мере угасания государства. После трагической [Concept('ayule_expedition','Экспедиции Аюле')|E] авторитет Боккарута оказался на грани полного краха, и Кайоба, последний боккар, из последних сил пытался сохранить контроль вплоть до своей бездетной смерти в 861 году от И.С., погрузившей умирающее государство в пламя [Concept('etami_tetenik','Этами Тетеник')|E]."

game_concept_mesir_dynasty:0 "Династия Месир"
game_concept_mesir_dynasty_desc:0 "Правление династии Месир началось одновременно с историей самого [Concept('boqqarut_damotada','Боккарута')|E], так как и то, и другое было основано Эшво наряду с первой кодифицированной верой моговаи. Объединение Дамоты под властью Эшво произошло благодаря сочетанию факторов, главным из которых была поддержка нового жречества, оказавшего огромную помощь в управлении расширяющимся государством. Эшво провел череду завоевательных войн, кульминацией которых в 258 году от И.С. стало провозглашение Боккарута после его победы в [Concept('war_of_songs','Войне песен')|E]. Его правление продолжалось десятилетиями, в течение которых город Захали превратился из небольшого городка в величественный мегаполис, заслужив репутацию сияющей жемчужины его новой империи.\n\nПосле его смерти в 297 году от И.С. престол унаследовал его второй сын, Летанья, который искусно использовал свой дипломатический талант для сохранения империи отца. Хотя несколько вассальных вожжеств пытались отделиться, Летанье удалось сформировать против них единый фронт, подавив восстания и создав более централизованное государство. Его преемники, хоть и остались гораздо менее известными в истории, примечательны своим стремлением к расширению границ: они завоевывали или колонизировали огромные пространства неизведанных ранее джунглей, интегрируя эти новые регионы в состав державы. Их правление завершилось в 497 году от И.С., когда всеми ненавидимый боккар Фалви был убит, что положило начало Первому [Concept('tetenik','тетенику')|E], после которого Месиров сменила [Concept('olani_dynasty','династия Олани')|E]."

game_concept_olani_dynasty:0 "Династия Олани"
game_concept_olani_dynasty_desc:0 "Взойдя на престол после Первого [Concept('tetenik','тетеника')|E], династия Олани, основанная боккаром Зекуном в 497 году, стала второй династией, правившей [Concept('boqqarut_damotada','Боккарутом')|E], сменив [Concept('mesir_dynasty','династию Месир')|E]. Зекун, хоть в целом и считался более чем компетентным правителем, провел большую часть своего правления, укрепляя собственную власть, предотвращая распад Боккарута и завоевывая лояльность многих влиятельных фигур, особенно церкви. Благодаря этой важнейшей поддержке Олани начали финансировать масштабное продвижение в джунгли в поисках трупа Всевышнего. Хотя это началось ещё при Зекуне, основная часть экспансии пришлась на правление боккары Келвер, чьи программы заселения увенчались успехом и позволили установить контроль над большей частью оставшихся джунглей. Кроме того, в годы ее правления был обнаружен Хасети Мекаб, который быстро перестроили в храм веры моговаи.\n\nРазумеется, самое важное действие Олани предприняли в 572 году от И.С., когда боккар Датеш основал [Concept('lodges','ордена Раякуукс')|E], пытаясь укрепить свой религиозный авторитет для борьбы с марефаи — набиравшим силу движением за децентрализацию церкви. Поначалу эти ордена имели успех, так как многие обрели надежду в их священных поисках останков Всевышнего. Однако со смертью Датеша центральный контроль над орденами Раякуукс начал ослабевать, и они все чаще вовлекались в местную политику. Это сыграло решающую роль во Втором тетенике, когда Олани были сменены набиравшей силу [Concept('belar_dynasty','династией Белар')|E]."

game_concept_belar_dynasty:0 "Династия Белар"
game_concept_belar_dynasty_desc:0 "Придя к власти в 667 году от И.С. при Ралоке, которого часто называют последним великим боккаром из-за величественных сооружений, возведенных в его правление, Белары обязаны своим возвышением в том числе поддержке со стороны стремительно менявшихся [Concept('lodges','орденов Раякуукс')|E]. Под началом Ралоки город Захали преобразился и расширился, кроме того, по всей Дамоте было возведено множество монументов и храмов. Конечно, самым впечатляющим его достижением стало строительство Бетами Декиира — обширной дороги, соединившей дальние уголки территорий [Concept('boqqarut_damotada','Боккарута')|E], которая быстро стала ключевой артерией дамотанской торговли. Однако его приход к власти сопровождался также созданием [Concept('yarkiyet_system','системы яркитов')|E] и резким расширением полномочий, предоставленных орденам Раякуукс. После его смерти в 712 году от И.С. трон перешел к его наследнику, боккару Хиджалу, которому пришлось столкнуться с последствиями расточительных трат отца и децентрализации власти.\n\nПытаясь расплатиться с этими долгами, Хиджал предоставил ещё более широкие привилегии недавно разделившимся [Concept('lodges','ложам')|E], одновременно расширяя яркиты и сокращая расходы. Хотя это балансирование позволило ему удержаться на троне, оно спровоцировало [Concept('wars_of_silence','Войны тишины')|E], заставив государство увязнуть в попытках поддерживать порядок в регионах, веками входивших в состав империи. Когда Хиджал умер в 743 году от И.С., возникший хаос привел к Третьему [Concept('tetenik','тетенику')|E], в результате которого Беларов сменила [Concept('zalreb_dynasty','династия Залреб')|E], унаследовавшая глубоко больное государство."

game_concept_zalreb_dynasty:0 "Династия Залреб"
game_concept_zalreb_dynasty_desc:0 "Начав свое правление в 746 году от И.С. с боккара Белоры, Залребы взошли на престол после Третьего [Concept('tetenik','тетеника')|E] и стали последней династией, правившей [Concept('boqqarut_damotada','Боккарутом')|E]. По сравнению с великими свершениями их предшественников, достижения Залребов обычно считаются незначительными: Белора и его потомки застали финальную стадию упадка Боккарута. Их правление было эпохой угасания власти, когда [Concept('lodges','ложи')|E] и дворяне вступили в открытую политическую борьбу, с трудом сдерживаемую Белорой и его преемниками, которым умело удавалось предотвращать крах увядающих структур государства. Со смертью Белоры в 773 году от И.С. казалось, что вскоре начнется очередной тетеник, однако его сын Ралери смог взойти на престол сравнительно легко, так как многие другие претенденты были таинственным образом убиты.\n\nЕго причастность, хотя и не была доказана, стала предметом широких слухов, и, чтобы компенсировать нехватку популярности, он начал править с помощью страха. Многие из его видных оппонентов загадочно исчезли, и большинство просто боялось выступить против него. Однако его предположительно кровавая политика (которую он до самой смерти называл лишь совпадением) привела к тому, что его сын Аюле смог довольно легко унаследовать престол в 817 году от И.С. Аюле знаменит одним-единственным деянием, которое уничтожило почти все остатки могущества Боккарута. Именно он начал [Concept('ayule_expedition','Экспедицию Аюле')|E] — вторжение на север, которое закончилось катастрофой, оставив Аюле в глубоких долгах перед сетью [Concept('karavuux_capital','Каравуукса')|E] и нобилитета и сокрушив ядро дамотанской армии. После его смерти в 835 году от И.С. титул боккара перешел к его сыну Кайове, который во многом продолжил эту неэффективную политику; его правление сопровождалось постоянным неповиновением подданных вплоть до его бездетной смерти в 861 году, ознаменовавшей конец Боккарута, когда борьба за власть переросла в [Concept('etami_tetenik','Этами Тетеник')|E]."

game_concept_karavuux:0 "каравуукс"
game_concept_karavuux_capital:0 "Каравуукс"
game_concept_karavuux_capital_desc:0 "Являясь одной из категорий дамотанских [Concept('lodges','лож')|E], каравуукс представляют собой разновидность организаций погонщиков караванов, сосредоточенных главным образом в северной Дамоте. Как правило, считается, что каравуукс включает в себя каждого человека, который работает в его рамках или является частью его цепочки поставок. Фермер — его член, поскольку часть его продуктов продается торговцам. Ремесленник — его член, поскольку его товары перевозятся силами каравуукса. Король — тоже его член, ибо его власть проистекает из богатства каравуукса. Численность каравууксов невозможно сосчитать, хотя существует лишь небольшая горстка тех, кого можно считать обладающими реальным политическим влиянием, тогда как большинство просто остается в стороне. Из-за своего обширного членства каравууксы часто вступают в финансовые стычки из-за спорных городов или станций снабжения, предлагая порой щедрые стимулы местным жителям, чтобы те присоединились к ним, в то время как в других местах они выжимают из территорий последнюю монету."

game_concept_rayakuux:0 "раякуукс"
game_concept_rayakuux_capital:0 "Раякуукс"
game_concept_rayakuux_capital_desc:0 "Будучи одной из категорий дамотанских [Concept('lodges','лож')|E], раякуукс больше всего напоминают прежние [Concept('lodges','ордена Раякуукс')|E], поскольку и те, и другие делают упор на путешествия и исследования как на главные аспекты жизни. Однако, в отличие от своих предшественников, раякуукс не имеют централизованной структуры, являясь вместо этого широкой категорией для огромного числа отдельных групп, многие из которых сохраняют собственные традиции и правила. Несмотря на преданность приключениям, большинство членов раякуукс, скорее всего, остаются оседлыми большую часть жизни, совершая лишь несколько великих странствий за весь свой век. Их роль заключается в поддержке, помощи товарищам по странствиям и предоставлении убежища другим членам ложи. Крупные раякуукс также нередко имеют более централизованные структуры, нанимая вооруженную охрану и собирая сведения о своих походах, зачастую накапливая знания поколений, а некоторые раякуукс целиком посвящают себя научным изысканиям."

game_concept_qabuux:0 "кабуукс"
game_concept_qabuux_capital:0 "Кабуукс"
game_concept_qabuux_capital_desc:0 "Являясь одной из категорий дамотанских [Concept('lodges','лож')|E], кабуукс, пожалуй, сильнее всего отдалились от своих предшественников. Пустив корни среди сельского населения Дамоты, кабуукс кардинально изменились за прошедшие века, превратившись в клановые ассоциации. Несколько семей образуют кабуукс, обычно возводя большое центральное здание для совместного проживания, окруженное внушительной общинной фермой. Внутри кабуукса узы очень крепки, и остальные участники считаются членами семьи. Хотя многие из них представляют собой не более чем одиночные постройки среди посевов, другие разрослись до колоссальных масштабов — с множеством пристроек и огромным расширением первоначальной структуры, а вокруг некоторых даже возникли близлежащие города.\n\nОтношения между кабуукс запутаны: постоянно меняющаяся сеть союзов, соперничества и переговоров формирует миниатюрную копию феодальной политики, а их роль в жизни окружающих невозможно переоценить."

game_concept_waranuux:0 "варануукс"
game_concept_waranuux_capital:0 "Варануукс"
game_concept_waranuux_capital_desc:0 "Будучи одной из категорий дамотанских [Concept('lodges','лож')|E], термин «варануукс» относится к широкой группе воинских сообществ. Хотя эти организации существовали ещё до [Concept('etami_tetenik','Этами Тетеник')|E], их сила и влияние взлетели до небес после падения [Concept('boqqarut_damotada','Боккарута')|E], а их численность неимоверно возросла. Хотя поначалу количество их членов может показаться большим, подавляющее большинство людей в них не являются действующими воинами, образуя своего рода «резерв» после периода обучения, длящегося несколько лет. Костяк этих групп состоит из небольшого числа лиц, в чьи основные обязанности входит обучение членов ложи и надзор за ними. Однако во время войны все члены варануукс могут быть призваны к оружию, а некоторые группы даже не считают членство полноценным, пока человек не сразится бок о бок с ними. Варануукс часто устраивают стычки друг с другом, враждуя из-за мелких обид, однако этот ритуализированный бой редко бывает смертельным, хотя порой он все же может перерасти в полноценный конфликт."

game_concept_yarkiyet_system:0 "Система яркитов"
game_concept_yarkiyet_system_desc:0 "Система яркитов была административной реформой [Concept('boqqarut_damotada','Боккарута')|E], осуществленной во времена правления [Concept('belar_dynasty','династии Белар')|E]. В то время как административная система [Concept('olani_dynasty','династии Олани')|E] состояла из большого числа мелких и равных между собой владений, новые яркиты, сохраняя существование этих меньших делений, подчинили их новой группе более могущественных промежуточных правителей, призванных управлять регионом от имени боккара. Новоиспеченные ярки, все из которых были важными сторонниками восхождения боккара Ралоки на престол, получили широкие полномочия в своих регионах, в первую очередь — контроль над налоговыми поступлениями и право выступать арбитрами в местных политических спорах. Предполагалось, что в теории ярки будут передавать эти доходы боккару, оставляя себе небольшую долю в качестве награды за верность как доверенные лица престола.\n\nХотя на какое-то время эта теория сработала, ярки быстро начали использовать свою власть для интриг друг против друга в борьбе за положение, разбазаривая налоговые поступления на финансирование своего соперничества с другими ярки или местными оппонентами. Этот административный крах одновременно усугублялся [Concept('wars_of_silence','Войнами тишины')|E] и сам усугублял их, поскольку широкие местные полномочия, которыми обладали ярки, тем не менее часто оставались единственным доступным решением проблемы хаоса, распространявшегося по Боккаруту, что привело к расширению системы яркитов даже тогда, когда государственная казна начала пустеть."

#LOCATIONS

game_concept_zahali:0 "Мегаполис Захали"
game_concept_zahali_desc:0 "Основанный боккаром Эшво в 258 году от И.С., Захали долгое время пользовался положением бьющегося сердца Дамоты. Этот статус был заслужен во всех отношениях — благодаря его центральному географическому положению, историческому статусу столицы [Concept('boqqarut_damotada','Боккарута Дамотада')|E] и религиозному значению для веры моговаи. Несмотря на былое многовековое процветание, битва за Захали, ознаменовавшая начало [Concept('etami_tetenik','Этами Тетеник')|E], привела к угасанию величия города, и вся его последующая история превратилась в череду притязаний мелких талкаров, каждый из которых надеется заявить свои права на его древние улицы."

#MISC

game_concept_tetenik:0 "Тетеник"
game_concept_tetenik_desc:0 "Тетеник — это форма борьбы за престолонаследие, которая происходила несколько раз в истории [Concept('boqqarut_damotada','Боккарута')|E], как правило, когда законный наследник был неизвестен или отсутствовал. В подобных случаях различные претенденты, обычно могущественные дворяне, провозглашали себя законными боккарами, используя политические связи и военные угрозы в попытках заставить своих врагов подчиниться. После напряженного противостояния боккаром становился тот претендент, который собирал вокруг себя самую сильную коалицию; как правило, он предлагал помилование остальным претендентам в обмен на сложение оружия. Хотя в целом этот механизм работал хорошо и обеспечивал мирный переход власти даже между династиями, крах Боккарута наступил именно в результате эскалации одного из таких противостояний — события, ставшего известным как [Concept('etami_tetenik','Этами Тетеник')|E]."
 
