game_concept_lodges_mechanical:0 "Ложи"
game_concept_lodges_mechanical_desc:0 "С [Concept('lodges','ложами')|E] Дамоты можно взаимодействовать через интерфейс уровня графства. Внутри каждого графства их общий уровень контроля может достигать четырех, распределяясь между различными типами лож: [Concept('rayakuux_capital','Раякуукс')|E], [Concept('karavuux_capital','Каравуукс')|E], [Concept('qabuux_capital','Кабуукс')|E] и [Concept('waranuux_capital','Варануукс')|E]. Наличие модификаторов лож в графствах может стать огромным подспорьем, давая различные положительные эффекты, однако рост их контроля также напрямую снизит ваш собственный."

