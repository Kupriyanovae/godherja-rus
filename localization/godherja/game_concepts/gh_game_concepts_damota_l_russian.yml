game_concept_pre_boqqarut_damota:0 "Добоккарутская Дамота"
game_concept_pre_boqqarut:0 "Добоккарутский период"
game_concept_pre_boqqarut_damota_desc:0 "До возвышения [Concept('boqqarut_damotada','Боккарута')|E] под предводительством Эшво население Дамоты селилось вокруг великих озер и рек, протекавших через джунгли, а за земли боролись разрозненные полуплеменные королевства. Большая часть глухой чащи оставалась неисследованной, и о том, что скрывалось внутри, ходили жуткие легенды. Особое место среди них занимало предание о Трупе — вере в то, что в джунглях был убит и упокоен древний бог, что породило обычаи ритуальных поисков и погребений в лесной глуши. Этот период подошел к концу с возвышением Боккарута в 258 году от И.С., когда главные племена впервые объединились под единым знаменем."

game_concept_etami_tetenik:0 "Этами Тетеник"
game_concept_etami_tetenik_desc:0 "Начавшись в 861 году от И.С. со смертью бездетного боккара Кайовы, Этами Тетеник обратился в запутанную распрю за престол, переросшую в истребительную гражданскую войну, которая и привела к краху [Concept('boqqarut_damotada','Боккарута')|E]. Поскольку очевидного наследника не было, борьба за власть началась как традиционный [Concept('tetenik','тетеник')|E]: множество крупных и мелких претендентов собирали рати и шли на Захали. Однако, в отличие от прежних времен, после годичного противостояния вспыхнула открытая резня. Воинства под предводительством Фалора и Дабока, двух могущественных вельмож, сошлись в яростном бою у ворот столицы, который вскоре перекинулся и на сам город. Хотя Дабок вышел победителем и возложил на себя корону боккара, взирал он лишь на дымящиеся руины Захали.\n\nРазумеется, это правление не могло быть долгим: уже через несколько месяцев объединенное войско других претендентов подступило к городу и свергло его, после чего сама коалиция погрязла в междоусобицах. Пока хаос охватывал срединные земли, окраины империи начали ускользать — едва ли не каждый, кто командовал горсткой ратников, провозглашал себя боккаром. Одни шли на столицу, другие принимались выкраивать собственные владения из разваливающейся империи. В тех краях, где центральная власть исчезла вовсе, [Concept('lodges','ложи')|E] остались единственными оплотами порядка, тогда как в других местах старая знать создавала новые королевства на пепле Боккарута. Хотя война за Захали полыхала около десятилетия, Дамота замкнулась в себе, и эпоха военачальников вскоре сменилась порой мелких княжеств, разделивших некогда единые земли между множеством мелких правителей."

game_concept_ayule_expedition:0 "Экспедиция Аюле"
game_concept_ayule_expedition_desc:0 "Экспедиция Аюле, как она осталась в анналах истории, служит единственным примером того, как рати [Concept('boqqarut_damotada','Боккарута')|E] вторглись в земли за пределами Дамоты. Они пытались захватить противоположный конец Гонанского пути и мегаполис Кудахар в пору смуты, охватившей Саррадон после [Concept('the_decimation_of_sarradon','Халакduна')|E]. Поход начался в 821 году от И.С., и дамотанцы быстро подчинили себе как стратегический Путь, так и многие северные земли. Поначалу это казалось великим триумфом, ведь разрозненные местные вожди не могли устоять перед обученными полками Дамоты. Даже поздние летописцы считают первоначальную кампанию главным воинским достижением Боккарута за всю долгую историю державы.\n\nОднако эта война не вошла в историю как победоносная. Хотя великий город Кудахар пал в 823 году от И.С. и на завоеванных территориях установили военный закон, дальнейшее продвижение захлебнулось. Задача сменилась обороной захваченных земель от нарастающего сопротивления местных жителей и набегов кочевников. Вожди региона перед своим поражением применили тактику выжженной земли, а обитатели пустыни постоянно грабили караваны, шедшие по Гонанскому пути. Из-за этого Экспедиция Аюле становилась все более зависимой от жестокого выкачивания богатств и от любых припасов, которые удавалось переправить через пески.\n\nВ самой Дамоте государство все глубже увязало в долгах перед богатой знатью и [Concept('karavuux_capital','Каравууксом')|E], истощая казну ради непомерных амбиций правителя. Хотя оккупация продолжалась до 829 года от И.С., Экспедиция была разгромлена в битве при Лаззане, когда союз местных вождей, кочевников и крестьянских повстанцев сокрушил дамотанские армии. Это вынудило их к позорному отступлению через пустыню, после чего Аюле увел остатки войск назад за Гонанский путь. Все, что этот поход принес угасающей [Concept('zalreb_dynasty','династии Залреб')|E], — это огромные долги и обескровленное воинство. Многие справедливо винят в падении Боккарута и начале [Concept('etami_tetenik','Этами Тетеник')|E] именно это сокрушительное поражение, неудача в котором лишила боккара возможности контролировать что-либо за пределами стен самого Захали."

game_concept_karururi_chorus:0 "Карурурийский хор"
game_concept_karururi_chorus_desc:0 "Прошедший в 254 году от И.С. Карурурийский хор был собором многих величайших праведников [Concept('pre_boqqarut_damota','добоккарутской Дамоты')|E]. Созванный будущим боккаром Эшво, этот великий совет ставил своей задачей собрать воедино истину о мире из учений нескольких верований. Собор считается моментом зарождения религии моговаи, которая вскоре распространилась по всей Дамоте.\n\nНесмотря на почти мифический статус, который Хор имеет ныне как часть сказаний о возвышении [Concept('boqqarut_damotada','Боккарута')|E], в действительности он вызвал глубокий раскол. Множество отдельных жрецов, а со временем и целые общины покинули священный зал, когда слияние вер потребовало искоренить учения, признанные противоречивыми. Пожалуй, самым спорным из решений этого собора было провозглашение того, что бог этого мира мертв. Это побудило целые сонмы жрецов бежать из владений Эшво, чтобы продолжить борьбу против Боккарута во время [Concept('war_of_songs','Войны песен')|E]. Когда Хор завершился, он принес Эшво две вещи. Во-первых, «Гимны небес» — объединенные и исправленные песни, запечатлевшие историю и догматы новой веры. Но вместе с тем на него легло тяжкое бремя: поскольку Тот, Кто Был Выше Всех, мертв, именно Эшво надлежало стать хранителем Его народа и повести его на поиски Его затерянной гробницы, что сделало его первым кихинетом моговаи."

game_concept_war_of_songs:0 "Война песен"
game_concept_war_of_songs_desc:0 "Война песен стала первым крупным конфликтом в истории [Concept('boqqarut_damotada','Боккарута')|E], хотя началась она ещё до окончательного сплочения этого государства. После того как часть участников покинула [Concept('karururi_chorus','Карурурийский хор')|E] в ответ на весть о смерти бога, в Бусемдо был созван второй, «истинный» Хор. Он призвал всех праведников выступить против опасного еретика Эшво и его марионеточного совета. Эти бусемдоваи, как их назвала история, подкрепили свои слова составлением собственной соперничающей доктрины. Хотя поначалу Эшво не воспринял угрозу всерьез, его многочисленные соперники не упустили возможность спасти свои земли, и вскоре несколько дамотанских вождей присягнули общему делу своими копьями.\n\nОказавшись атакованным на нескольких фронтах, Эшво избрал оборонительную стратегию. Он выделил крупные силы для сдерживания северо-западной и восточной ратей бусемдоваи, тогда как основной ударный кулак сосредоточил на юге, рассчитывая разбить врагов поодиночке. Эта стратегия, пусть и поставленная под угрозу внезапным прорывом одного из соперников в начале 257 года, доказала свою верность: государство, которое вскоре станет [Concept('boqqarut_damotada','Боккарутом')|E], умело использовало свое срединное положение, чтобы не дать врагам соединить силы.\n\nРазгромив южные и северо-западные рати по отдельности и либо заменив их вождей, либо добившись от них нерушимых клятв верности, Эшво успешно захватил Исурву благодаря предательству в рядах противника, вынудив Хор Бусемдо снова спасаться бегством. После подчинения всех обитаемых земель Дамоты Эшво собрал вождей региона на берегах священного озера Этами Бияки. Там каждый принял веру моговаи и присягнул Эшво как своему боккару, что официально положило начало истории Боккарута Дамотада. Тем не менее, несмотря на поражение, Хор Бусемдо не прекратил борьбу — они бежали в самую глубь джунглей, продолжая сопротивляться вере моговаи, и были окончательно сломлены лишь в 306 году от И.С."

game_concept_wars_of_silence:0 "Войны тишины"
game_concept_wars_of_silence_desc:0 "Начавшиеся во времена правления [Concept('belar_dynasty','династии Белар')|E], Войны тишины служат общим именем для волн смуты и мятежей, прокатившихся по Дамоте в последние века существования [Concept('boqqarut_damotada','Боккарута')|E]. Этот период, вызванный нарастающей враждой между [Concept('lodges','ложами')|E] и мелкой знатью, каждая из которых притязала на власть над деревнями, где жило большинство простого люда Дамоты, привел к бесконечной череде мелких стычек и распрей.\n\nОбычно все начиналось как схватка за власть в безвестной деревне — что жутковато предвещало грядущую [Concept('etami_tetenik','судьбу самого Боккарута')|E], — и все эти усобицы развивались по схожему сценарию. Противостояние между ополченцами фракций перерастало в открытое насилие, причем союзы как дворян, так и лож пытались вмешаться в борьбу соседних общин. Когда столкновение становилось слишком опасным, в дело вступала либо Йенусаави Дамотада — гвардия боккара, призванная хранить порядок в империи, — либо, все чаще, рати местного ярки, которые гасили конфликт, выбирая сторону исключительно ради собственной выгоды. Хотя это помогало остановить первую вспышку, неспособность гвардии или ярки разместить постоянные заставы по всему государству неизбежно создавала почву для новых распрей, и эта беда лишь усугублялась с течением веков.\n\nПодстегиваемые как [Concept('the_decimation_of_sarradon','Халакдуном')|E], так и отвлечением имперских сил на [Concept('ayule_expedition','вызовы IX века')|E], Войны тишины превратились в непрекращающуюся спираль насилия, которая плавно и неразрывно перетекла в Этами Тетеник."

