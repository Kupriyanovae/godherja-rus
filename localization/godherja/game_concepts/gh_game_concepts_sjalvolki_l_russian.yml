 #GODS
 
 game_concept_velos:0 "Велос"
 game_concept_velos_desc:0 "Согласно мифу, именно Велос первым ощутил свет срединного царства. Братья и сёстры, которые тоже жаждали покинуть чертоги [Concept('prohen','Прохена')|E], избрали его предводителем похода, и он быстро принял на себя роль верховного бога. Для сьялволков Велос — это отеческая фигура, воплощающая качества, которые они ценят больше всего: храбрость, честность и уверенность. Будучи не просто богом охоты, Велос является хранителем и защитником своего народа, его имя с одинаковым почтением призывают перед поединками чести, коронациями или охотой. Пожалуй, величайшим его достижением стало создание первого лука из украденных волос Небесного Бога — знание, которое он даровал человечеству за службу на войне."
 
 game_concept_prohen:0 "Прохен"
 game_concept_prohen_desc:0 "Согласно представлениям сьялволков, именно суровый Прохен плетёт и обрубает наши судьбы. Со своей женой [Concept('marma','Мармой')|E] он породил богов: [Concept('velos','Велоса')|E], [Concept('pekwon','Пеквона')|E], [Concept('pekielo','Пекиело')|E], [Concept('varpalis','Варпалиса')|E], [Concept('zamistra','Замистру')|E] и [Concept('ureha','Уреху')|E], однако вместо того, чтобы искать новые земли вместе со своими детьми, он ушёл ещё дальше под землю, ниже чертогов, куда души отправляются на упокой. Из-за своего уединения он отсутствует в большинстве сьялволкских легенд, но когда он всё же появляется, его описывают как слепого отшельника с меловой бледной кожей и волосами, доходящими до самых пят. Из-за его загадочных сил в мифологии сьялволков некоторые считают его истинным верховным богом; наиболее примечательны в этом плане груэлокины, которые посвящают Старому Ткачу различные ритуалы и фестивали."
 
 game_concept_ureha:0 "Уреха"
 game_concept_ureha_desc:0 "Уреха, младшая сестра и единственная дочь среди детей [Concept('prohen','Прохена')|E] (сестра [Concept('velos','Велоса')|E]), является одной из важнейших фигур во всей мифологии сьялволков. Обеспокоенная постоянными распрями между братьями из-за того, как должен быть устроен мир, она решила создать себе более приятную компанию. Так её собственными руками были вылеплены первые люди. Однако вскоре другие боги начали использовать её творения в своих междоусобицах. Настолько сокрушённая насилием, обрушившимся на её народ, она бежала в земли, которых ещё никто не видывал. Сама того не ведая, она оказалась под надзором жестоких Небесных Богов, и те утащили её свыше, чтобы она жила среди облаков. Её братья были так отвлечены, что целые горы сдвинулись с мест, прежде чем они заметили её исчезновение. К этому времени она уже привыкла к своему новому дому, но всё ещё таила тоску по земле под небесами.\n\nМежду Небесными Богами и Земными Богами разразилась жестокая, но безрезультатная война, в которой человечество сыграло решающую роль. В итоге было достигнуто соглашение, согласно которому Уреха может проводить половину года в Небесном царстве, а вторую половину — внизу. Её прибытие в Срединный мир знаменуется крупнейшим из фестивалей сьялволков, празднующим приход весны."
 
 game_concept_pekielo:0 "Пекиело"
 game_concept_pekielo_desc:0 "Ослепший в войне с Небесными Богами, Пекиело посвятил себя погоне за знаниями. Ворон Норус, ведающий обо всех событиях, что произошли с рассвета времён, шепчет ему в левое ухо. Тем временем в правое ухо ему шепчет сова Нора, знающая всё, чему ещё только суждено случиться. Пекиело не имеет власти над прошлым или будущим, но вместо этого заносит его в свою «Книгу дней», чьё содержание и местонахождение остаются тайной, которой не знает даже сам [Concept('velos','Велос')|E]. В одной саге шаман пытается отыскать легендарный фолиант и, вопреки всему, умудряется найти пещеру, в которой обитает Пекиело. К его величайшему удивлению, божество без малейших колебаний протягивает ему книгу. Однако, прочитав всего несколько страниц, он оказывается охвачен таким ужасом, что в отчаянии выкалывает себе глаза, а разум его настолько повреждается, что его слова превращаются в безумные крики."
 
 game_concept_marma:0 "Марма"
 game_concept_marma_desc:0 "Мать богов и жена Старого Ткача [Concept('prohen','Прохена')|E], Марма часто отождествляется с самим [Concept('aeras','Эрасом')|E]. Характер у неё капризный: она ответственна как за обильные урожаи, так и за опустошительный голод, и те, кто дурно обходится с её великими владениями, обречены страдать от последствий. Подобно своему мужу, она не сражалась вместе со своими детьми в войне с Небесными Богами и потому в значительной степени безразлична к жизням смертных, однако ей посвящено множество ритуалов в попытке снискать её расположение."
 
 game_concept_varpalis:0 "Варпалис"
 game_concept_varpalis_desc:0 "Считается, что скромный Варпалис обитает во всех озёрах, реках и водных путях, что прорезают родину сьялволков. Долг сьялволкских рыболовов — оставлять подношение или часть своего улова Варпалису, дабы он восполнял воды, в которых они промышляют. Он готовит к загробной жизни тех, кого не удалось похоронить, и превращает мертворождённых и умерших в раннем возрасте детей в выдр, которые, как говорят, присматривают за своими семьями. Несмотря на это, женщин учат не купаться в воде в одиночку, так как Варпалис имеет репутацию распутника и является отцом многих полубогов из сьялволкских мифов."
 
 game_concept_zamistra:0 "Замистра"
 game_concept_zamistra_desc:0 "Младший из сыновей [Concept('prohen','Прохена')|E], Замистра почитается скорее за свой острый ум, нежели за клинок. Часто изображаемый как бродячий бард, он установил правило для каждого сьялволка: всегда радушно принимать незнакомцев в своём доме на случай, если это окажется сам Замистра. Ему приписывают славу первого поэта — навык, которому он обучил народ сьялволков. Замистра часто предстает в роли трикстера, предпочитающего плащ и кинжал типичным для сьялволков честным и напористым решениям. Это ставит его в оппозицию ко многим добродетелям, дорогим его последователям, делая его особенно популярным среди тех, кто находится вне привычных рамок сьялволкского общества, таких как торговцы и [Concept('magi','маги')|E]."
 
 game_concept_pekwon:0 "Пеквон"
 game_concept_pekwon_desc:0 "Заместитель [Concept('velos','Велоса')|E] в войне с Небесными Богами, а некоторые сказали бы, что и вовсе величайший боец среди них. Мастерство Пеквона во владении своим мечом «Стриггир» является темой многих саг. Однако это лишь сделало его падение ещё более трагичным. Согласно мифу, в ходе войны Пеквон влюбился в Небесную Богиню и пожелал жениться на ней в вышнем мире. Когда его брат Велос услышал об этом предательстве, он уязвлённый яростью отрубил Пеквону все пальцы, пока тот спал, дабы тот никогда не смог надеть кольцо. Пеквон потянулся за Стриггиром, но тот просто вывалился из его искалеченных рук.\n\nВспышка гнева Велоса оказалась катастрофической, поскольку без Пеквона война быстро повернулась в пользу Небесных Богов, вынудив земных сесть за стол переговоров. Когда кровавый конфликт подошёл к концу и Боги одаривали человечество дарами, мрачный Пеквон преподнёс жестокий дар голода и страданий, дабы все прекрасные творения Богов увядали и гибли. Несмотря на это, Пеквон всё ещё в определённой степени почитается сьялволками: «дар» тления — это то, что позволяет павшим воинам входить в великие чертоги Велоса, а некоторые даже сочувствуют его истории."
 
