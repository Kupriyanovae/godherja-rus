 game_concept_daukeni_saga:0 "Эпосы и саги даукени"
 game_concept_daukeni_saga_desc:0 "Одной из наиболее примечательных культурных традиций даукени является их богатый репертуар эпосов и саг, в котором каждый клан может похвастаться собственным набором предков-героев. Некоторые из этих мужчин и женщин жили так давно, что стали почти мифическими персонажами, однако многие жили достаточно недавно, чтобы считаться твёрдо историческими фигурами. Делмекс «Двуглазый», Менвир «Лесной волк» и Арнольд «Жабоглазый» — это имена лишь немногих из тех легендарных личностей, что обрели бессмертие в сердцах и умах даукени повсюду.\n\nОдна из самых широко пересказываемых саг объясняет происхождение самих даукени, возводя это наследие к первому человеку, который когда-либо использовал лук. Одной-единственной стрелой он сразил великого и чудовищного медведя размером с целый холм, который годами терроризировал его народ. Разделывая гору трупного мяса, он обнаружил в его желудке прекрасную женщину, свернувшуюся калачиком — это была не кто иная, как Прозека, дочь [Concept('velos','Велоса')|E] Охотника, которую злодей [Concept('prohen','Прохен')|E] проглотил целиком ещё во младенчестве. Вскоре они поженились, и от их союза произошли храбрые и непобедимые даукени."
 
 
 #EVENTS
 
 game_concept_migrations:0 "Великие переселения"
 game_concept_sjalvolki_migration:0 "Великое переселение сьялволков"
 game_concept_sjalvolki_migrations:0 "Великие переселения сьялволков"
 game_concept_sjalvolki_migration_desc:0 "«Великое переселение сьялволков» — это собирательное понятие, которым стали описывать массовое движение народов с севера и востока [Concept('the_continent','Континента')|E] в саму [Concept('aversaria','Аверсарию')|E] после катастрофических событий [Concept('frodbrokna','Фродброкны')|E].\n\nНачавшись вскоре после этой катастрофы, но развернувшись в полную силу в 1220-х годах с приходом [Concept('the_fog','Тумана')|E] на родину сьялволков, переселение обрело организованную форму после того, как Кенваре «Сокрушитель Ведьм» объединил различные кланы сьялволков, а также беженцев из десятков других культур и религий в Имперрех сьялволков под своим началом в 1244 г. от И.С.\n\nУбедив вождей племён последовать за ним на юг под знаменем Имперреха, на условиях, что после этого каждой культуре будут выделены новые земли в бывшей Аверсарии, Кенвар разграбил [Concept('mayikrata','Майикратию')|E] ради её тайн, а затем начал вторжение в Калатипсоми. Местные деспоты, чьи земли всё ещё раздирали военачальники после краха Орайспольской Автократии вследствие [Concept('imperial_civil_war','Имперской гражданской войны')|E], и которые едва сдерживали массовые восстания рабов, практически не оказали сопротивления: закалённое войско воинов-сьялволков Кенвара, наряду с партийскими магами и тысячами других бойцов-несьялволков, пронеслось через регион едва ли за год. Вскоре после этого он начал вторжение на юг, в срединные земли Аверсарии в Этепезее; Битва в Элизийском проходе уничтожила большую часть оставшихся военных сил Аверсарии в 1252 г. от И.С."
 
 game_concept_the_tribespact:0 "Племенной пакт"
 game_concept_the_tribespact_desc:0 "Племенной пакт — это созванное Кенваром в 1242 г. от И.С. собрание тысяч сьялволкских и других катраддийских кланов из внутренних областей [Concept('the_continent','Континента')|E], бегущих от [Concept('the_fog','Тумана')|E]. Там Кенвар предложил всем собравшимся народам соглашение: если они предоставят ему свою помощь и мощь под единым знаменем, он выступит посредником и мирно распределит земли [Concept('aversaria','Аверсарии')|E] между мигрирующими племенами.\n\nПосле череды бурных дебатов, споров и демонстраций силы собравшиеся кланы согласились, и Кенвар стал лидером Сьялволкского Имперреха. Вскоре после этого через [Concept('the_severing_of_the_vales','таинственный портал')|E] явились партийцы и также приняли эти условия."
 
 game_concept_sacking_of_the_mayik:0 "Разграбление Майикратии"
 game_concept_sacking_of_the_mayik_desc:0 "В 1244 г. от И.С. Сьялволкский Имперрех предпринял набег на легендарную [Concept('mayikrata','Майикратию')|E] — сильно укреплённую школу магии, расположенную в горах Железного Хребта. Собравшиеся военные отряды Имперреха проникли глубоко в её недра, разграбляя гримуары и магические [Concept('artifacts','артефакты')|E], чтобы те помогли им в переселении к [Concept('the_continent','Расколотому побережью')|E]."
