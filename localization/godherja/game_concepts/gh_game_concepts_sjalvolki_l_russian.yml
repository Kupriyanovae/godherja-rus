 game_concept_greensea:0 "Зелёное море"
 game_concept_greensea_desc:0 "Лежащее на полуночных рубежах бескрайнее Зелёное море не поддается обычному описанию. Тысячи поприщ лесных дебрей растут столь плотно, что стволы переплетаются, образуя великанов вышиной в тысячи локтей. Лиственный навес в вышине столь густ, что, по слухам, по верхушкам крон можно плыть, словно на ладье по воде. Наземная же подстилка бора почти непроходима: внутри царит вечная стужа и тьма, а древесные исполины вяжут ноги на каждом шагу. Твари лесные свирепы, а летучие волки и берестяные ленивцы — самые жуткие кошмары для всякого, кто дерзнет ступить под эти своды.\n\nИ все же в Зелёном море можно выживать и копить богатства. Извечно партийские мужи возводили великие грады и святилища высоко на ветвях, связывая их канатными мостами и заставляя живые деревья принимать нужную зодчим форму. Самые умелые [Concept('magi','маги')|E] на [Concept('aeras','Эрасе')|E] искали приюта в этих чащах, уверяя, будто их сила бьет ключом от Драйоганн Дтохт — Мирового древа, что высится в самом сердце Зелёного моря."

 game_concept_orispolj:0 "Метрополия Орайсполь"
 game_concept_orispolj_desc:0 "В былые времена Орайспол был сердцем [Concept('aversaria','Аверсарии')|E], блистательной столицей державы, чья воля простиралась от [Concept('chevalie','Шевалье')|E] до далекой Каширии.\n\nНо былое величие Аверсарии сгорело в пожарах. Павший под ударами Ценвара Сокрушителя Ведьм во время [Concept('sjalvolki_migration','Великого переселения сьялволков')|E], ныне этот град стал незыблемым памятником победы северных родов. Большая часть чертогов осталась цела, ибо аверсарианских жителей пощадили, когда пала защита ворот. Даже многие из великолепных изваяний и колонн стоят нетронутыми — их просто переделали ради прославления новых богов и обычаев новых хозяев города. И само имя Аверсарии, некогда неотделимое от Орайсполя, ныне тихо угасает среди руин, усеивающих его предместья."
 
 #MISC