 game_concept_greensea:0 "Зелёное море"
 game_concept_greensea_desc:0 "Расположенное на севере, бескрайнее Зелёное море не поддается описанию. Миллионы акров деревьев растут так близко друг к другу, что часто перекручиваются и сливаются в исполинов высотой в тысячи футов. Навес из листвы вверху настолько плотный, что, как говорят, по листьям можно плыть, словно по воде. Лесная подстилка практически непроходима; пространство внутри тёмное и холодное, а деревья преграждают путь на каждом шагу. Дикая природа в большинстве своём враждебна, а летучие волки и берестяные ленивцы являются самыми печально известными кошмарами для потенциальных исследователей.\n\nНесмотря на эти невзгоды, в Зелёном море можно выживать и процветать. Исторически партийцы строили великие города и храмы высоко в кронах деревьев, соединяя их веревочными мостами и возводя строения путём изменения формы самих деревьев. Самые умелые [Concept('magi','маги')|E] на [Concept('aeras','Эрасе')|E] жили в этом лесу, утверждая, что их сила исходит от Драйоганн Дтохт — Мирового древа, расположенного в самом центре Зелёного моря."
 
 game_concept_orispolj:0 "Метрополия Орайсполь"
 game_concept_orispolj_desc:0 "Когда-то Орайспол был сердцем [Concept('aversaria','Аверсарии')|E], сияющей столицей державы, простиравшейся от [Concept('chevalie','Шевалье')|E] до Каширии.\n\nНо [Concept('aversaria','Аверсарии')|E] больше нет. Павший перед Кенваре «Сокрушителем Ведьм» во время [Concept('sjalvolki_migration','Великого переселения сьялволков')|E], ныне этот город стал прочным символом триумфа сьялволков. Большая часть города осталась нетронутой, поскольку аверсарианское население пощадили, когда город пал. Даже многие из грандиозных монументов всё ещё целы — их просто перепрофилировали для прославления богов и культур новых хозяев города. И Аверсария, имя, когда-то синонимичное Орайсполю, теперь угасает в руинах, усеивающих Орайсполь."
 
 #MISC