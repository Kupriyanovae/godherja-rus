 game_concept_daukeni_saga:0 "Эпосы и саги даукени"
 game_concept_daukeni_saga_desc:0 "Славным достоянием и гордостью племен даукени искусно служит их богатое собрание эпосов и саг, где всякий род чличит собственных предков-богатырей. Иные из тех мужей и жен жили в столь седые века, что обратились в полумифических витязей, но многие вершили дела свои недавно и остались в летописях как истинные исторические вожди. Делмекс Двуглазый, Менвир Лесной Волк и Арнольд Жабоглазый — лишь малая доля тех грозных воителей, чьи имена навек обрели бессмертие в песнях даукени по всему свету.\n\nОдна из самых известных саг повествует о начале рода даукени, возводя их колено к первому охотнику, жившему под солнцем, который сработал первый лук. Одной-единственной стрелой он сразил чудовищного медведя величиной с целый холм, что долгие зимы терзал его сородичей. Разрезав исполинскую тушу, охотник нашел в утробе зверя прекрасную деву, свернувшуюся калачиком — то была сама Прозека, дочь [Concept('velos','Велоса')|E] Охотника, кою коварный [Concept('prohen','Прохен')|E] проглотил еще во младенчестве. Вскоре они сыграли свадьбу, и от их союза пошли храбрые и непобедимые мужи даукени."
 
 
 #EVENTS
 
 game_concept_migrations:0 "Великие переселения"
 game_concept_sjalvolki_migration:0 "Великое переселение сьялволков"
 game_concept_sjalvolki_migrations:0 "Великие переселения сьялволков"
 game_concept_sjalvolki_migration_desc:0 "Великим переселением сьялволков зовут в преданиях исход северных и восточных племен с просторов [Concept('the_continent','Континента')|E] в пределы [Concept('aversaria','Аверсарии')|E], начавшийся вслед за черными днями [Concept('frodbrokna','Фродброкны')|E].\n\nПервые роды снялись с мест вскоре после беды, но вовсю лесной пожар разгорелся в 1220-х годах, когда губительный [Concept('the_fog','Туман')|E] пополз на исконные земли сьялволков. Исход обрел единую волю, когда вождь Ценвар Сокрушитель Ведьм сплотил разрозненные кланы, а вместе с ними — беженцев из десятков иных земель и вер в могучий Сьялвольский Имперрех в 1244 году от И.С.\n\nУбедив конунгов последовать за ним на полуденные земли под единым стягом Имперреха с уговором, что всякому роду пролитая кровь окупится новыми наделами в павающей Аверсарии, Ценвар сперва предал мечу [Concept('mayikrata','Майикратию')|E] ради ее чародейских тайн, а следом вторгся в Калатипсоми. Тамошние князьки, чьи уделы после [Concept('imperial_civil_war','Имперской гражданской войны')|E] и краха Орайспольской Аавтократии безжалостно рвали на части воеводы и восставшие рабы, не смогли сдержать удар. Закаленная рать Ценвара, партийские колдуны и тысячи примкнувших иноплеменников прошли весь край огнем и мечом едва ли за год. Вскоре Сьялвольский Имперрех ударил в самое сердце Аверсарии, в Этепезею; яростная Битва в Элизийском проходе в 1252 году от И.С. окончательно сломала хребет имперскому воинству."

 game_concept_the_tribespact:0 "Племенной пакт"
 game_concept_the_tribespact_desc:0 "Племенной пакт — великий тинг, созванный Ценваром в 1242 году от И.С., куда сошлись тысячи сьялвольских и иных катраддийских родов из глубин [Concept('the_continent','Континента')|E], спасавшихся от наползающего [Concept('the_fog','Тумана')|E]. На этом сходе Ценвар предложил вождям нерушимый уговор: если племена вручат ему свою долю власти и выступят под его началом, он поведет их на юг и честно разделит богатые земли [Concept('aversaria','Аверсарии')|E] между всеми кочевниками.\n\nПосле долгих споров, взаимных угроз и грозных доказательств силы вожди ударили по щитам, и Ценвар встал во главе Сьялвольского Имперреха. Вскоре через [Concept('the_severing_of_the_vales','таинственный портал')|E] явились партийские мужи, кои также приняли эти условия."

 game_concept_sacking_of_the_mayik:0 "Разграбление Майикратии"
 game_concept_sacking_of_the_mayik_desc:0 "В 1244 году от И.С. рати Сьялвольского Имперреха осадили и взяли приступом легендарную [Concept('mayikrata','Майикратию')|E] — грозную горную твердыню чародеев в отрогах Железного Хребта. Воины Имперреха проникли в самые потаенные подземелья школы, захватив древние гримуары и волшебные [Concept('artifacts','артефакты')|E], дабы их чары помогли племенам в великом походе к [Concept('the_continent','Расколотому побережью')|E]."


 game_concept_sacking_of_greyport_college: "Sacking of Greyport College"
 game_concept_sacking_of_greyport_college_desc: "Immediately following the death of $cenware_link$, tension that had been simmering across the [Concept('aversaria','Sjalvolki Coast')|E] but kept tempered by the Witch-Breaker's peace exploded. The leader of Greyport College, Daun, made a remark that the Witch-Breaker had met his match in a women, following $korinne_ptaciv_link$'s presentation of `On Womenfolk` to the Orispolj court. A group of Sjalvolki warriors, still unwilling to settle down in the years after the Aironoi Campaigns, took it upon themselves to put Daun in his place and led a brutal attack on the college\n\nGreyport College was nearly defenseless, with most efforts focused on the Marcher frontier, thus the bards and scholars of the college were massacred. Few survivors escaped the destruction, including Ptaciv, and the Sacking would be remembered as the first blood shed from the wars to come."
