 game_concept_dovatkning:0 "Доваткнинг"
 game_concept_dovatkning_desc:0 "Исповедовать религию сьялволков — значит верить в то, что ты являешься членом священного авангарда на [Concept('aeras','Эрасе')|E], защищающего мир от вторжений Вышних Богов. С этой целью сьялволки традиционно избирают своих правителей посредством ритуальной боевой церемонии, известной как Доваткнинг. На ней любой [Concept('vassal','вассал')|E] или родич прежнего правителя может испытать свою силу в бою против любого другого, чтобы определить свою достойность править."
 
 game_concept_migration_contribution:0 "Вклад в переселение"
 game_concept_migration_contribution_desc:0 "Вклад в переселение отражает ценность вашего персонажа для всего [Concept('sjalvolki_migration','переселения сьялволков')|E]. На него может влиять множество факторов, включая ваши [Concept('skills','навыки')|E], являетесь ли вы [Concept('culture_head','главой культуры')|E], ваш [Concept('rank','титул')|E] и даже ваши отношения с Вождём переселения."
 game_concept_migration_widget:0 "@migration_widget! Переселение сьялволков"
 game_concept_migration_widget_i:0 "@migration_widget!"
 game_concept_migration_widget_desc:0 "Могущественный Сьялволкский Имперрех ведёт огромное полчище беженцев прочь от [Concept('the_fog','Тумана')|E] и ищет безопасные земли для заселения.\n\nПо мере продвижения [Concept('sjalvolki_migration','переселения сьялволков')|E] [Concept('vassals','вассалы')|E] Имперреха будут накапливать [Concept('migration_contribution','вклад в переселение')|E], который помогает определить вероятность получения ими [Concept('titles','титулов')|E] по итогам переселения."

