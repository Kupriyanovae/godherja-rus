 game_concept_dovatkning:0 "Доваткнинг"
 game_concept_dovatkning_desc:0 "Исповедовать старую веру сьялволков — значит чтить себя воином священного авангарда на [Concept('aeras','Эрасе')|E], защищающего подлунный мир от ярости Вышних Богов. Ради того сьялволки издревле избирают вождей через священный бой, именуемый Доваткнингом. На этом ритуале любой [Concept('vassal','вассал')|E] или кровный сородич почившего конунга может оспорить право на власть с оружием в руках, дабы в честной сече доказать свое право вести за собой племя."

 game_concept_migration_contribution:0 "Вклад в переселение"
 game_concept_migration_contribution_desc:0 "Вклад в переселение знаменует собой доблесть и пользу вашего мужа для всего [Concept('sjalvolki_migration','переселения сьялволков')|E]. Вес этой доли куется из многих дел: ваших личных [Concept('skills','навыков')|E], того, признан ли ваш муж [Concept('culture_head','главой культуры')|E], вашего [Concept('rank','титула')|E] и даже от того, насколько благоволит вам сам Вождь переселения."
 game_concept_migration_widget:0 "@migration_widget! Переселение сьялволков"
 game_concept_migration_widget_i:0 "@migration_widget!"
 game_concept_migration_widget_desc:0 "Могущественный Сьялвольский Имперрех ведет несметное полчище беженцев прочь от наползающего [Concept('the_fog','Тумана')|E] в поисках безопасных земель для оседлого житья.\n\nПокуда длится [Concept('sjalvolki_migration','переселения сьялволков')|E], [Concept('vassals','вассалы')|E] Имперреха копят свой [Concept('migration_contribution','вклад в переселение')|E], коим на исходе похода и определится, кому из вождей достанутся завоеванные [Concept('titles','титулы')|E] и богатые уделы."

 ##FAITHS
 
 #GODS

 VELOS_GLOSS:0 "Сказания гласят, что именно Велос первым узрел благодатный свет Срединного мира. Братья и сестры, искавшие исхода из подземных чертогов [Concept('prohen','Прохена')|E], нарекли его своим вождем в этом походе, и он принял бремя верховного бога. Для всякого сьялволка Велос — грозный и мудрый отец, воплотивший в себе лучшие добродетели их крови: бесстрашие, верность слову и твердость духа. Не просто покровитель охотников, Велос есть заступник и хранитель своего народа; его имя с равным почтением звучит перед смертным поединком, венчанием на царство или ловом в лесах. Пожалуй, величайшим его деянием стало создание первого лука из украденных волос Небесного Бога — сие тайное знание он даровал людям за их верную службу в небесной войне."

 PROHEN_GLOSS:0 "В верованиях сьялволков суровый Прохен — это Старый Ткач, что прядет и обрубает нити наших судеб. Со своей супругой [Concept('marma','Мармой')|E] он породил великих богов: [Concept('velos','Велоса')|E], [Concept('pekwon','Пеквона')|E], [Concept('pekielo','Пекиело')|E], [Concept('varpalis','Варпалиса')|E], [Concept('zamistra','Замистру')|E] и [Concept('ureha','Уреху')|E]. Однако он не пошел за детьми на поиски новых земель, а скрылся еще глубже под землю, ниже обителей, где души усопших находят вечный покой. Из-за этого затворничества Старого Ткача редко встретишь в сагах; когда же он является в песнях, его рисуют как слепого старца с бледной, как мел, кожей и седыми косами до самых пят. За его сокрытую мощь иные племена почитают его истинным владыкой вселенной; пуще всех — грейлокины, кои посвящают Прохену свои самые мрачные обряды и зимние празднества."

 UREHA_GLOSS:0 "Уреха, младшая сестра и единственная дочь среди детей [Concept('prohen','Прохена')|E] (сестра [Concept('velos','Велоса')|E]) — одна из главных опор в вере сьялволков. Устав от вечных распрей братьев, споривших о порядке в мире, она решила сотворить себе добрых спутников и вылепила собственными руками первых людей. Однако вскоре братья-боги принялись использовать ее чад как оружие в своих усобицах. Потрясенная насилием, коим боги залили ее творения, она бежала в неизведанные края. Сама того не зная, дева забрела во владения жестоких Небесных Богов, и те утащили ее в высь, заставив жить среди туч. Братья ее были столь увлечены дракой, что целые хребты сдвинулись с мест, прежде чем они приметили пропажу. К той поре дева уже привыкла к чертогам в облаках, но сердце ее все равно тосковало по тверди под ногами.\n\nМежду Небесными и Земными Богами вспыхнула лютая война, где людской род сыграл великую роль. В итоге был скреплен мирный договор, по коему Урехе дозволено половину года гостить в Небесном царстве, а вторую половину — проводить внизу. Ее возвращение в Срединный мир празднуется величайшим пиром сьялволков, знаменующим приход весны."

 PEKIELO_GLOSS:0 "Лишившись глаз в битвах с Небесными Богами, Пекиело посвятил свое посмертие стяжанию сокрытого знания. Ворон Норус, ведающий о всяком деянии от рассвета мира, вечно шепчет ему в левое ухо. В правое же шепчет сова Нора, знающая обо всем, чему лишь суждено сбыться. Пекиело не властен над прошлым или грядущим, но исправно заносит их теченье в свою «Книгу дней», чье место лова и суть остаются тайной, сокрытой даже от взора [Concept('velos','Велоса')|E]. Сказания поют об одном шамане, что дерзнул отыскать фолиант и вопреки всему нашел пещеру бога. К его великому диву, Пекиело без колебаний отдал ему книгу. Однако, прочтя лишь три страницы, колдун узрел такой ужас, что в исступлении выколол себе очи и лишился разума, обратив речь в безумный крик."

 MARMA_GLOSS:0 "Мать богов и верная супруга Старого Ткача [Concept('prohen','Прохена')|E], Марма в песнях часто зовется самой матерью-землей [Concept('aeras','Эрасом')|E]. Нрав у нее изменчивый и капризный: ее волей колосья гнутся под обильным урожаем, и ее же гневом насылается лютый голод, а те мужи, кто дурно обходится с ее лесами и долами, обречены страдать от ее мести. Подобно мужу, она не билась вместе с сыновьями против Небесных Богов и оттого безразлична к нуждам смертных, однако люди все равно приносят ей богатые дары, чая снискать милость богини."

 VARPALIS_GLOSS:0 "Скромный Варпалис, как верят сьялволки, обитает во всяком озере, реке и водном русле, что омывают их родину. Долг каждого рыбака — оставлять часть улова или серебряную монету Варпалису, дабы тот полнил рыбой воды, где они промышляют. Он же прибирает души тех, кому не нашлось могилы на суше, а мертворожденных младенцев обращает в выдр, кои, как поют в сагах, оберегают свои бывшие семьи со стороны воды. Несмотря на такую заботу, женам заказано купаться в одиночку, ибо Варпалис славится своим распутным нравом и стал отцом множества полубогов в сьялволькских легендах."

 ZAMISTRA_GLOSS:0 "Младший из сыновей [Concept('prohen','Прохена')|E], Замистра славен среди братьев не силой клинка, а своим острым умом. Часто являясь в песнях под видом бродячего барда, он установил закон для всякого сьялволка: без вопросов пускать странника под кров и делить с ним хлеб, ибо гостем может оказаться сам бог. Ему приписывают славу первого скальда, обучившего сьялволков слагать висы. Замистра часто предстает хитроумным плутом, предпочитающим плащ и кинжал честному стеношному бою. Сие ставит его наособицу от прочих добродетелей племени, отчего он в великом почете у тех мужей, кто живет вне общинных рамок — у купцов и [Concept('magi','магов')|E]."

 PEKWON_GLOSS:0 "Правая рука [Concept('velos','Велоса')|E] в великой войне с Небесными Богами, а иные скальды поют, что и вовсе первейший боец среди них. О том, как разил врагов меч Пеквона «Стриггир», сложено немало вис. Однако тем страшнее оказалась его измена. Сказания гласят, что в ходе войны Пеквон воспылал страстью к Небесной Богине и замыслил взять ее в жены в верхнем мире. Едва брат его Велос проведал о таком предательстве, он в лютой ярости отрубил спящему Пеквону пальцы на руках, дабы тот вовек не смог надеть обручальное кольцо. Пеквон потянулся было за Стриггиром, но клинок просто выпал из его искалеченных дланей.\n\nГнев Велоса обернулся бедой: лишившись лучшего бойца, Земные Боги стали проигрывать войну и сели за стол переговоров. Когда брань утихла и боги одаряли людей, угрюмый Пеквон принес миру свой жестокий дар — тление и страдания, дабы всякое прекрасное творение увядало и гибло. Несмотря на этот черный дар, сьялволки все же чтят Пеквона, ведь именно его порча позволяет павшим в бою воинам оставлять бренную плоть и входить в чертоги Велоса, а иные скальды и вовсе слагают жалобные песни о его судьбе."
 
