 game_concept_saints_war:0 "Война святых"
 game_concept_saints_war_desc:0 "Войной святых в летописях зовут череду кровавых столкновений между пришлыми агионистскими орденами крестоносцев и коренными [Concept('sarradon','саррадонцами')|E], что заполыхали около 1144 года от И.С.\n\nАгионистские, марочникские и [Concept('aversaria','аверсарианские')|E] купцы да проповедники начали высаживаться на берегах Саррадона вскоре после того, как проклятая [Concept('selfreplicating_blood_magic','самовоспроизводящаяся магия крови')|E] разорвала материк на части. Сбитые с толку саррадонские воеводы охотно продавали пришельцам обширные земли под торговые подворья, чая с помощью чужеземцев возродить торговлю и нанять ратников в свои опустевшие дружины. И хотя меж местными и пришельцами случались стычки, поначалу заселение шло мирным обычаем и одобрялось туземными князьями.\n\nОднако со временем северяне принялись прибирать к рукам все больше долов, что вылилось в открытую войну за земли, коих им никто не уступал. Приняв на себя первый удар орденов, первыми пали [Concept('ritualism','ритуалисты')|E] — их последний вольный оплот рухнул в 1237 году от И.С. Следом разгорелась затяжная брань против [Concept('wardenism','варденитов')|E]. К той поре пришлых купцов и проповедников уже вовсю питала казна аверсарианского венценосца, агионистов с материка насильно гнали за море на поселение, и [Glossary( 'Аавтократия', 'GH_AAUTOKRATA_GLOSS' )] без счета выкачивала богатства из завоеванных краев.\n\nВарденитов теснили по всем рубежам, а владыка Мамур в глазах народа казался слабым и нерешительным. Так продолжалось до возвышения Харсы ибн Саррадона, прежнего главного воеводы Мамура. Сей муж начал личную священную войну против агионистов после того, как рыцари Ордена Ключа Святого Калисто угнали в рабство и сжили со свету его супругу. Вскоре Харса был схвачен и брошен в пучину океана, но чудом выжил, собрал верные рати на юго-востоке и двинул грандиозное контрнаступление, к 1254 году от И.С. отбив у северян большую часть восточного поморья."

 game_concept_judges_massacre:0 "Резня судей"
 game_concept_judges_massacre_desc:0 "Резня судей — четырехдневная кровавая баня, учиненная агионистами в 1207 году против лучших умов и книжников из числа [Concept('ritualism','ритуалистов')|E] (главным образом из племени джадуяда) и задуманная рыцарями Ордена Слепого Смотрителя. Поводом к резне стала злая сатира безвестного скальда, поползшая по городам в начале того года: стихи высмеивали всякий Святой Орден и вскрывали накопленные за 70 зим обиды на [Concept('aversaria','аверсарианского')|E] владыку. Долгие месяцы законники ордена тщетно пытались выследить сочинителя, пока не объявили, будто виновный пойман.\n\nВ лукавой попытке явить местным жителям мнимую справедливость и «руку согласия», они позвали почтенных судей-софокосцистов прийти на судилище и помочь в отправлении правды. Местные законники, чаявшие через этот суд получить выслугу у новых господ, по прибытии были потрясены, узнав, что судить намерены их самих. Кровавая расправа началась прямо на хорах великого орденского зала суда, но быстро выплеснулась на улицы подвластного агионистам [Concept('sarradon','Саррадона')|E]. В этой чистке сгинуло целое колено ученых мужей, судей и жрецов, без счету были разрушены ритуалистские капища, а редкие книги преданы огню. По иронии судьбы, те самые орденские судьи, что правили кровавой баней, позже сами угодили на плаху и были казнены сотоварищами за «многочисленное попрание судебного чина» во время расправы.\n\nГорькие последствия тех дней камнем легли на весь край. Всякая надежда на мирное житье между орденами и туземцами умерла, и власть пришельцев стала шататься, пока спустя десять зим в огне не вспыхнуло [Concept('faghira_jalil_revolt','восстание Фагира и Джалиля')|E]."

 game_concept_faghira_jalil_revolt:0 "Восстание Фагира и Джалиля"
 game_concept_faghira_jalil_revolt_desc:0 "Восстание Фагира и Джалиля — великий народный бунт, охвативший большую часть восточного [Concept('sarradon','Саррадона')|E] в 1220-х годах. Сие пламя родилось из десятилетий горькой обиды туземцев на агионистских господ, а искра, от коей занялся весь край, проскочила в 1222 году в городке Телль-Джахара, когда ватага катаритских рыцарей средь бела дня забила до смерти малого ребенка за надуманное оскорбление. Сие бесчинство переполнило чашу терпения местных жителей, кои в ответ спалили дотла местный замок ордена. Следом покатилась череда взаимных убийств, завершившаяся валом восстаний по всей земле.\n\nСия брань получила имя в честь двух главных вождей саррадонского воинства — жреца-[Concept('ritualism','ритуалиста')|E] Фагира на закатных рубежах и проповедника-[Concept('wardenism','варденита')|E] Джалиля на восходе. Война затянулась почти на шесть зим и ознаменовалась нескончаемыми зверствами, коими Святые Ордена пытались вернуть свой железный порядок. Самой черной точкой той поры стал [Concept('kahdavrakan_supper','Кахдавраканский пир')|E] 1227 года. Восстание выдохлось, зайдя в тупик в 1228 году — агионисты великой кровью подавили мятеж на западе, но напрочь потеряли власть над восточным Кехенемхатом, коих повстанцы оставили за собой. И все же отголоски той грозы сотрясали край до конца десятилетия, а большая часть деревень за шесть лет кровопролития погрузилась в полный разбой."

 game_concept_kahdavrakan_supper:0 "Кахдавраканский пир"
 game_concept_kahdavrakan_supper_desc:0 "Кахдавраканский пир — массовое убийство, учиненное рыцарями Ордена Розы Святой Сансии в 1227 году, на исходе [Concept('faghira_jalil_revolt','восстания Фагира и Джалиля')|E], в столице подвластного худийского королевства Кудамаш.\n\nВойдя в стольный град под белым стягом перемирия, вожди сансианитов приняли зов местного князя разделили с ним трапезу в знак его покорности Ордену. Вместо мира ужин кончился тем, что сансианиты выхватили скрытые ножи и вырезали под корень всю правящую династию Худи. Едва городские ворота отперли изнутри, резня выплеснулась на улицы и длилась часами, пока агионисты не поклялись остановить мечи и посулили честный плен тем, кто еще держал оборону. Сия «честь» свелась к тому, что всех уцелевших согнали на ближний курган и обескровили до смерти. Черные дела не ограничились стенами града: в последующие месяцы сансианиты начали истреблять народ Худи всюду, где только могли их сыскать, что вызвало массовый исход беженцев в земли южного [Concept('mamuramat','Мамурамата')|E]. Всего в том хаосе полегло от 20 000 до 50 000 душ.\n\nСие злодеяние всколыхнуло весь континент и укоренило в умах туземцев твердую мысль: угроза, которую несут Святые Ордена самому их существованию, куда страшнее любых мелких обид и местечковых склок, что прежде мешали им выступить единым щитом."
 
