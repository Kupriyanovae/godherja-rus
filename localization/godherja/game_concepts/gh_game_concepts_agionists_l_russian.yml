 game_concept_saints_war:0 "Война святых"
 game_concept_saints_war_desc:0 "«Война святых» — это собирательное название ряда конфликтов между агионистскими святыми орденами и коренными [Concept('sarradon','саррадонцами')|E], начавшихся примерно в 1144 г. от И.С.\n\nАгионистские, маркские и [Concept('aversaria','аверсарианские')|E] купцы и проповедники начали высаживаться в Саррадоне в 1144 г. от И.С., вскоре после того, как [Concept('selfreplicating_blood_magic','самовоспроизводящаяся магия крови')|E] разорвала континент на части. Отчаявшиеся саррадонские военачальники продавали им обширные участки земли в качестве торговых владений, видя в чужеземцах шанс восстановить торговлю и источник наёмников для своих опустевших армий. Хотя с иностранцами и случались некоторые стычки, по большей части первоначальное заселение проходило мирно и в основном приветствовалось местными.\n\nОднако со временем северяне начали захватывать всё больше земель, в конце концов развязав открытую войну за территории, которые изначально им никто не продавал. Приняв на себя основной удар, первыми пали [Concept('ritualism','ритуалисты')|E] — их последний независимый оплот пал в 1237 г. от И.С. Вскоре после этого начался затяжной конфликт против [Concept('wardenism','стражников')|E]. К этому моменту купцы и проповедники уже финансировались аверсарианской короной, агионистов с материка насильно переселяли в Саррадон, а Автократия выкачивал огромные богатства из вновь завоёванных территорий.\n\nСтражники были отброшены назад, а Мамур в глазах многих выглядел слабым и медлительным. Так продолжалось до возвышения Харсы ибн Саррадона, бывшего главного генерала Мамура, который начал одиночный крестовый поход против агионистов после того, как его жена была порабощена и убита Орденом Ключа Святого Калисто. Вскоре он был схвачен и брошен в океан, но чудесным образом выжил, собрал силы на юго-востоке и вскоре перешёл в грандиозное контрнаступление против северян, удерживая к 1254 г. от И.С. большую часть восточного побережья."
 
 game_concept_judges_massacre:0 "Резня судей"
 game_concept_judges_massacre_desc:0 "Резня судей — это четырёхдневный погром, устроенный агионистами в 1207 году против ведущей интеллигенции [Concept('ritualism','ритуалистов')|E] (главным образом из народа джадуяда) и организованный Орденом Слепого Смотрителя. Истоком этих событий стала сатирическая поэма неизвестного автора, начавшая распространяться в начале того же года: её содержание высмеивало каждый Святой Орден, а также изливало накопившиеся обиды за 70 лет [Concept('aversaria','аверсарианского')|E] правления. Попытки дикайноситов найти автора неоднократно срывались, пока несколько месяцев спустя они не объявили, что нашли виновника.\n\nВ странной попытке продемонстрировать местным жителям «руку сотрудничества», они пригласили ведущих, уважаемых судей-софокосцистов посетить судебный процесс и помочь в отправлении правосудия. Местные юристы, надеявшиеся использовать этот случай для получения аудиенции у своих повелителей, по прибытии были потрясены, узнав, что на самом деле судят их самих. Последовавшая за этим кровавая баня началась на балконах великого дикайноситского зала суда, но вскоре распространилась по всему подконтрольному агионистам [Concept('sarradon','Саррадону')|E]. В этой чистке погибло целое поколение учёных, юристов и жрецов, бесчисленные ритуалистские храмы были разрушены, а книги без счёту преданы огню. По иронии судьбы, те самые дикайноситские судьи, ответственные за бойню, позже сами предстали перед судом и были казнены за «многочисленные процессуальные ошибки» в ходе дела.\n\nДолгосрочные последствия этого события оказались тяжёлыми. Любая надежда на мирное сосуществование между агионистами и местными жителями умерла, и в дальнейшем стабильность их правления постепенно ухудшалась, пока чуть более 10 лет спустя не вспыхнуло [Concept('faghira_jalil_revolt','восстание Фагиры и Джалиля')|E]."
 
 game_concept_faghira_jalil_revolt:0 "Восстание Фагиры и Джалиля"
 game_concept_faghira_jalil_revolt_desc:0 "Восстание Фагиры и Джалиля — это масштабный конфликт, охвативший большую часть восточного [Concept('sarradon','Саррадона')|E] в 1220-х годах. Став результатом десятилетий копившейся обиды коренного населения на своих агионистских владык, искра, из которой разгорелось пламя во всём регионе, вспыхнула в 1222 году в провинциальном городке Телль-Джахара, когда группа катаритских рыцарей средь бела дня забила до смерти маленького ребёнка за мнимое оскорбление. Этот акт стал последней каплей для местных жителей, которые в ответ сожгли местное отделение ордена. Последовала череда эскалаций с обеих сторон, завершившаяся мощной волной восстаний по всей стране.\n\nВойна получила своё название в честь двух главных лидеров саррадонских сил — жреца-[Concept('ritualism','ритуалиста')|E] Фагиры на западе и проповедника-[Concept('wardenism','стражника')|E] Джалиля на востоке. Продолжаясь около 6 лет, она отметилась нескончаемой чередой зверств, совершаемых Святыми Орденами в попытке вернуть свой железный контроль, самым бесславным пиком которых стал [Concept('kahdavrakan_supper','Кахдавраканский пир')|E] 1227 года. Восстание в основном завершилось неудовлетворительным для обеих сторон тупиком в 1228 году — агионистам с трудом удалось подавить сопротивление на западном театре военных действий, но они потеряли де-факто контроль над Кехенемхатом на востоке, который отошёл к повстанцам. Тем не менее, отголоски продолжали сотрясать регион до конца десятилетия, а большая часть сельской местности за последние 6 лет кровопролития погрузилась в анархию."
 
 game_concept_kahdavrakan_supper:0 "Кахдавраканский пир"
 game_concept_kahdavrakan_supper_desc:0 "Кахдавраканский пир — массовое убийство, совершённое Орденом Розы Святой Сансии в 1227 году, на закате [Concept('faghira_jalil_revolt','восстания Фагиры и Джалиля')|E], в столице худитского вассального королевства Кудамаш.\n\nВойдя в метрополию под флагом перемирия, представители сансианитов были приглашены местным правителем на пир в честь его номинального подчинения Ордену. Вместо этого ужин закончился тем, что сансианиты выхватили кинжалы и вырезали всю правящую династию Худи. После того как ворота города были открыты изнутри, кровопролитие продолжалось на улицах часами, пока агионисты не пообещали прекратить битву и гарантировать благородное обращение тем, кто всё ещё прятался. Это «благородное обращение» свелось к тому, что всех выживших собрали на близлежащем холме и обескровили до смерти. Зверства не ограничились самим городом, и в последующие месяцы сансианиты предприняли то, что можно описать лишь как попытку полного истребления народа Худи, где бы они его ни находили, что вызвало массовое бегство выживших на земли [Concept('mamuramat','Мамурамата')|E] на юге. Всего в этом хаосе погибло от 20 000 до 50 000 человек.\n\nЭто событие, естественно, вызвало возмущение по всему континенту и привело к окончательному закреплению у местных жителей мысли о том, что угроза, которую Святые Ордена несут самому их существованию, перевешивает любые мелкие распри или региональные склоки, мешавшие их сотрудничеству."
 
