 # Added keys missing from the supplied Russian mod
 game_concept_chariots:0 "Чариоц"
 game_concept_chariots_desc:0 "Почтенная колесница использовалась в сражениях обученными воинами на протяжении большей части мировой истории, особенно прославившись во многих битвах, таких как Битва на Десяти озерах и Четырех днях, когда астилики разгромили силы имперской армии, посланной на завоевание Айроноя (подвиг, который после этого редко кому удавалось повторить). Колесницы ужасающе смертоносны на открытой равнине, где они образуют быстро движущуюся стену смерти, ведомую кем угодно — от упряжек боевых коней до чудовищ и тварей всех мастей. [Concept('aversaria','Аверсарианцы')|E] Поздней империи пошли ещё дальше, создав колесницы, способные парить вперед вообще без участия животных. Колесницы чрезвычайно эффективны против любой пехоты и обладают гораздо большей [Concept('Tougher','стойкостью')|E], чем кавалерия, но при этом обладают гораздо меньшей способностью к преследованию или противостоянию более крупным угрозам. Однако за пределами равнин они практически бесполезны: леса, горы, болота и большинство других типов местности представляют для них серьезное препятствие. Это, наряду с их высокой стоимостью и малой численностью, привело к тому, что колесницы практически канули в небытие."
 game_concept_construct:0 "Конструкт"
 game_concept_gh_general_undead:0 "Ундеад"
 game_concept_gh_general_undead_desc:0 "Кости бесчисленных людей, погибших в минувшие эпохи, восставшие в качестве [Concept('men_at_arms','профессионалов')|E], чтобы исполнять порочную волю своих владык. У нежити нет начальных [Concept('counter','противодействовий')|E], но она представлена в версиях всех остальных типов войск.\n\nНежить обычно слабее своих живых аналогов, но компенсирует это численностью и [Concept('toughness','выносливостью')|E]."
 game_concept_gh_maa_adventurer:0 "Авантюрист"
 game_concept_gh_maa_adventurers:0 "Авантюристы"
 game_concept_gh_maa_adventurers_desc:0 "Вторая древнейшая профессия на [Concept('aeras','Аэрасе')|E]: любители приключений, охотники за сокровищами и истребители чудовищ часто объединяются в наёмные подразделения [Concept('men_at_arms','профессиональных воинов')|E], чтобы противостоять необычным угрозам. В [Concept('battle','сражении')|E] искатели приключений обычно уступают обученным солдатам и вступают в войска гораздо меньшими отрядами. Зато они превосходно [Concept('counter','противодействуют')|E] [Concept('monsters','чудовищам')|E] и чаще прочих способны противостоять [Concept('magic','магическим')|E] существам, [flying|E], [constructs|E], [gh_general_undead|E] и [magi|E].\n\nБольшую армию из них не собрать, но любой разумный полководец держит под рукой отряд авантюристов для борьбы с необычными опасностями и действий на сложной [Concept('terrain','местности')|E]."
 game_concept_magical:0 "Магический"
 game_concept_magical_desc:0 "Магические [men_at_arms|E] — это духи, элементали и другие бестелесные [Concept('magic','магические')|E] существа. Такие отряды чрезвычайно опасны: против них мало [Concept('counters','противодействующих войск')|E], [Concept('terrain','местность')|E] почти не ограничивает их действия, а обычное оружие зачастую наносит им ничтожный урон.\n\nИх слабость — редкость: обычно они появляются естественным путём либо после призыва могущественными чарами."
 game_concept_monster:0 "Чудовище"
