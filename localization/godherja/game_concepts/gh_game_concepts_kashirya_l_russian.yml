 game_concept_phulikama:90 "Пхуликама"
 game_concept_phulikama_desc:90 "Пхуликама — это изящные, в форме цветов посохи, увенчанные кристаллом. В сарутанском обществе право на власть исторически определяется тем, кто удерживает древнюю Пхуликаму своего города, хотя многие благородные семьи давно закрепили за собой право передавать её своим сыновьям и дочерям для сохранения династического контроля.\n\nМногие семьи также создали целые иерархические серии Пхуликам, увеличивая их в размере для демонстрации более высокого ранга. Однако колоссальные расходы на создание столь ценных артефактов сделали знать сравнительно бедной, особенно на фоне купеческого сословия торговцев пряностями."

 game_concept_iafarana_historiography:90 "Иафаранская историография"
 game_concept_iafarana_historiography_desc:90 "Большинство записей о ранней истории иафарана давно затерялись во времени. Немногие оставшиеся свидетельства гласят, что их мореходные предки достигли побережий из восточной Каширии и с Пиратского побережья, хотя ученые тщетно пытаются точно датировать это переселение из-за хроник, утерянных во время [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E]. Первые упоминания об иафарана относятся к VIII веку, но остается неясным, указывают ли они на их предков или же на народ, который живет там сейчас."

