 game_concept_great_callings:90 "Великие призвания"
 game_concept_great_callings_desc:90 "Для прапатаро по достижении шестнадцатилетнего возраста человек должен выбрать одно из трех Великих призваний: Мыслитель, Воин или Земледелец.\n\nЗемледельцы трудятся на многоярусных древесных фермах, выращивая различные вьющиеся фрукты и овощи. Воины тренируются в лесах, чтобы стать мастерами скрытности и засад, и им часто приходится проверять свои навыки, отражая пиратские набеги с побережья. В то же время Мыслители контролируют распределение ресурсов, придумывают правила и законы, а также создают различные изделия из дерева и металла, необходимые для их уклада жизни."

 #GODS
 
 #DESCRIPTIONS
 
 
 ##ARTIFACTS

 game_concept_perdition_armaments:90 "Оружие Погибели"
 game_concept_perdition_armaments_desc:90 "«Погибель» — одно из наиболее популярных и хорошо изученных чар для оружия, происхождение которого восходит к ритуальным искусствам Галитового храма и его различных ответвлений. Первоначально предназначавшееся исключительно для священного оружия стражей реликвариев, знание об этом заклинании и его использовании постепенно распространилось среди мирян после вторжения [Concept('otachedian_empire','Отачеда')|E] в [Concept('kashirya','Каширию')|E], когда оно было изъято из Храма в качестве одного из многочисленных трофеев завоевания.\n\nПри нанесении на режущую кромку оружия «Погибель» заставляет любую пролитую его клинком кровь превращаться в соль, которая проникает вглубь раны пропорционально силе чар и наносит жертве тяжелые увечья. Осуждаемые многими как излишне жестокие, эти чары наиболее бесславно использовались в беспрецедентных масштабах во время [Concept('desiccation_of_kazvosk','Иссушения Казвоска')|E], когда заклинание было сотворено с помощью ныне утерянного Галитового копья."
 
 ###REGIONAL
 game_concept_kashirya:90 "Каширия"
 game_concept_kashirya_desc:90 "Каширия — это обширный мультикультурный регион между [Concept('aversaria','Аверсарией')|E] на западе и Катун-Каем на востоке. Давным-давно этот регион был объединен под властью [Concept('otachedian_empire','Отачедской империи')|E], что привело к великим культурным и религиозным изменениям, которые надолго пережили саму империю. Большая часть его долгой истории была утеряна со времен [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E]."
 
 ##REGION
 
 #EVENTS
 game_concept_chan_skorpokaipis:90 "Чан Скорпокаипис"
 game_concept_chan_skorpokaipis_desc:90 "Чан Скорпокаипис (или Четыре апокалипсиса) — это серия катастрофических событий, произошедших в период между IX и XI веками, виновниками которых в значительной степени (хотя это и оспаривается) считаются ученые-видваукеятранцы. Эти события стали определяющими в истории Каширии, и многие рассматривают их как начало новой эпохи, поскольку вся предшествующая история отчетливо завершилась с их наступлением.\n\nПервым был [Concept('sabar_lambay_raad','Сабар Ламбай Раад')|E], или «Самая долгая ночь», когда видваукеятранские ученые случайно вызвали солнечное затмение исключительно над [Concept('kashirya','Каширией')|E], продлившееся почти целый год.\n\nВторым стал [Concept('murtuy_ka_varha','Муртуй ка Варха')|E], когда ученый-видваукеятранец Навад Джавхад широко распространил десятки исключительно опасных заклинаний, что привело к восстанию легионов нежити по всей Каширии, которые едва не поглотили весь регион.\n\nТретьим стал [Concept('vaarash','Ваараш')|E], во время которого видваукеятранские ученые обнаружили странности в родословной правителей [Concept('taryaad_saramsaasan','Тарьяад Сарамсаасан')|E] и немедленно разнесли эти вести по всей Каширии, что привело к тридцати годам жестокой гражданской войны и положило конец каширийскому единству.\n\nНаконец, четвертым было [Concept('chojakaan_ka_ghatada','Чоджакаан ка Гхатада')|E], когда ученые-видваукеятранцы, пытавшиеся найти способ удаления ржавчины с металла, случайно заставили исчезнуть двенадцать городов по всей Каширии, а затем едва не применили [Concept('selfreplicating_blood_magic','самовоспроизводящуюся магию крови')|E] в попытке обратить это вспять.\n\nКонец Апокалипсисов наступил в XI веке с началом [Concept('dharya_varha','Дхарья Варха')|E] — массовой серии антиинтеллектуальных восстаний, опустошавших Каширию на протяжении почти пятидесяти лет."
 
 game_concept_dharya_varha:90 "Дхарья Варха"
 game_concept_dharya_varha_desc:90 "Дхарья Варха, или «Праведные годы», — это продолжавшаяся пятьдесят лет серия массовых антиученых восстаний по всей [Concept('kashirya','Каширии')|E] в начале XI века с целью положить конец контролю видваукеятранцев над регионом. Хотя силы повстанцев (именовавших себя «Дхарьям Лон», или «Праведники») разрослись до огромных размеров, они обвиняли правящую знать Каширии в том, что те предоставили видваукеятранцам полную свободу в исследованиях, из-за чего аристократия большей части региона объединилась с учеными против бунтовщиков.\n\nПоскольку знать и сословие ученых (составлявшие большинство [Concept('magi','магов')|E] Каширии) сплотились против повстанческих армий, восстания Праведных годов быстро зашли в тупик. Бунтовщики не могли сражаться с дворянами и магами в открытом бою и вместо этого предпочли рассредоточиться по всей Каширии, нанося удары по видваукеятранским ученым повсеместно.\n\nЗа годы Праведных годов «Праведники» разграбили сотни библиотек, академий и лабораторий, а также убили сотни известных ученых-видваукеятранцев. Однако из-за серии массовых карательных мер со стороны знати, а также благодаря ритуалу видваукеятранской секты Савадхан («Осознанные»), который защищал все видваукеятранские библиотеки от огня (и из-за которого сотни людей насмерть замерзли внутри некоторых из них), численность «Праведников» постепенно пошла на убыль. Выжившие отступили в сельские общины и прекратили активное сопротивление, сформировав со временем религиозную секту Аскеварьян.\n\nПо оценкам видваукеятранских ученых, в ходе этих событий было утеряно более 7000 лет коллективных знаний; они также заявляют, что «Праведники» стали воплощением того факта, что всегда найдутся те, кто отвергает полезные знания. Несмотря на противоречивость, часто утверждается, что, хотя несколько апокалиптических событий могли быть или не быть виной ученых, «Праведники» также должны были благодарить их за рост продолжительности жизни и уровня грамотности благодаря распространяемым ими знаниям."
 
 game_concept_murtuy_ka_varha:90 "Муртуй ка Варха"
 game_concept_murtuy_ka_varha_desc:90 "Муртуй ка Варха был вторым и, пожалуй, самым разрушительным из [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E] (Четырех апокалипсисов), который едва не уничтожил [Concept('kashirya','Каширию')|E] между IX и XI веками.\n\nОн начался в IX веке с [Concept('discovery_of_the_adiyya_ka_pharvaarava','открытия Адийя ка Пхарваарава')|E] ученым-видваукеятранцем Навадом Джавхадом, который принялся широко распространять десятки обнаруженных им исключительно опасных ритуалов и заклинаний, несмотря на очевидные сопутствующие риски. В течение года после этого сектанты использовали данные ритуалы для призыва легионов духов и прочей нежити, контроль над которыми они тут же потеряли. На протяжении всего этого времени Джавхад продолжал распространять свои труды, одновременно настаивая на том, что апокалиптические события были виной не его работы, а тех, кто оказался не готов к столь великим знаниям.\n\nВойна достигла своего апогея с возвышением похожего на [Concept('liches','лича')|E] Сатаяна Холккарака, который направил армии мертвецов против остальной Каширии, и завершилась лишь со [Concept('death_of_holkkarak_and_the_end_of_the_murtuy_ka_varha','смертью Холккарака и окончанием Муртуй ка Варха')|E]."
 
 game_concept_chojakaan_ka_ghatada:90 "Чоджакаан ка Гхатада"
 game_concept_chojakaan_ka_ghatada_desc:90 "Чоджакаан ка Гхатада, или «Событие Чоджакаан», — это четвертый и «финальный» из [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E], четырех отдельных близких к апокалипсису катастроф, которые повсеместно признаны виной видваукеятранских ученых.\n\nСобытие началось, когда видваукеятранцы из академии в Дораджпоре, пытавшиеся открыть искусство удаления ржавчины с металла, случайно сотворили заклинание, из-за которого исчезли двенадцать крупных каширийских городов. Множество видваукеятранских сект отчаянно пытались найти решение, пока против веры поднималась волна массовых восстаний недовольных простолюдинов. Дораджпорские ученые бурно праздновали, когда обнаружили фрагментарный ритуал, который, по их мнению, в случае правильного воссоединения частей и проведения, вернул бы города в Каширию.\n\nЭтот ритуал позже был назван [Concept('selfreplicating_blood_magic','самовоспроизводящейся магией крови')|E], и до сих пор неизвестно, был ли он изначально тем самым разрушительным заклинанием или же видваукеятранцы случайно воссоздали его в попытках исправить первоначальное. Заклинание мгновенно уничтожило Дораджпор и превратило почти всех его жителей в столпы пламени. Его распространение на остальной мир было предотвращено лишь наемницей Кайтой, которая сумела с боем прорваться в горящую академию и сразила ученых-[Concept('magi','магов')|E], отчаянно пытавшихся обуздать заклинание, тем самым прервав ритуал. Двенадцать городов так и не вернулись, Дораджпор остался заброшенным, а видваукеятранцы впоследствии продолжали утверждать, что второе заклинание, скорее всего, разрешило бы кризис, если бы Кайта их не остановила.\n\nЧоджакаан ка Гхатада стал последней каплей для многих жителей Каширии, и этот гнев породил [Concept('dharya_varha','Дхарья Варха')|E]."
 
 game_concept_sabar_lambay_raad:90 "Сабар Ламбай Раад"
 game_concept_sabar_lambay_raad_desc:90 "Сабар Ламбай Раад, или «Самая долгая ночь», — это первый из [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E], четырех отдельных близких к апокалипсису катастроф, которые повсеместно признаны виной видваукеятранских ученых.\n\nСамая долгая ночь началась, когда ученые из академии в Харьяададе попытались поэкспериментировать с недавно обнаруженным заклинанием, которое, как считалось, даровало заклинателю способность видеть в темноте. Вместо этого ритуал привел к тому, что академия была вырвана из [Concept('aeras','Эраса')|E] и отброшена к [Concept('aervalr','Эрвальру')|E], который сразу же, по всей видимости, сместился и затмил солнце. В то время как вся Каширия была погружена в вечную ночь, любой, кто покидал регион, обнаруживал, что солнце встает как обычно — каким-то образом затмение коснулось только Каширии. Попытки видваукеятранцев решить проблему оказались весьма катастрофическими и привели к таким событиям, как кратковременный призыв второго, миниатюрного солнца, обратившего город Петхиклу в пепел, и другое заклинание, из-за которого сотни запасов продовольствия по всей Каширии мгновенно испортились. Вечные сумерки и порча припасов привели к массовому голоду, который терзал регион в течение нескольких лет.\n\nСолнце не появлялось снова почти год, пока кругу [Concept('magi','магов')|E] из аристайканской и дарамарджаратанской конфессий вместе с [Concept('aversaria','аверсарианским')|E] магом Мечиосом Протексом не удалось сотворить заклинание, отменяющее первое. Это стоило жизни им всем, кроме Мечиоса и аристайканского мага-гуру Вогиба, которые после выздоровления стали близкими друзьями и отправились вместе исследовать мир. Видваукеятранские ученые утверждают, будто заклинание лишь слегка ускорило время, а годичное локальное затмение было не магическим, а естественным, хотя и неожиданным космологическим событием."
 
 game_concept_vaarash:90 "Ваараш"
 game_concept_vaarash_desc:90 "Ваараш, или «Крах», — это третий из [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E], четырех отдельных близких к апокалипсису катастроф, которые повсеместно признаны виной видваукеятранских ученых.\n\nКрах начался, когда ученым из видваукеятранской секты «Санстхакап» было поручено написать династическую биографию Чутаграта, правящего императора [Concept('taryaad_saramsaasan','Тарьяад Сарамсаасан')|E]. В ходе своих исследований в его обширных библиотеках они обнаружили несколько странностей в родословной Чутаграта, а также сведения о ранних годах жизни основателя династии, Асодзивы. Санстхакапы немедленно распространили эти знания, как того требовали видваукеятранские убеждения, что разрушило легитимность правления Чутаграта и тут же вызвало то, что переросло в двадцатилетнюю серию жестоких гражданских войн. Войны закончились лишь со смертью последнего тарьяадского претендента, а вместе с ней исчезла и сама концепция какой-либо формы единой Каширии.\n\nВидваукеятранцы приводили противоречивые доводы в пользу того, почему они не виноваты, заявляя как то, что Санстхакапы были отступнической сектой, не следовавшей надлежащим практикам и, возможно, выдумавшей эти сведения, так и то, что уничтожение династии послужило доказательством ее нестабильности, а информация была лишь предлогом, использованным алчными дворянами. Наряду с обоими аргументами звучала привычная мантра о том, что знания были по праву разделены с народом, и это вина других, что они использовали их во вред."
 
 game_concept_bayyuralar:90 "Байюралар"
 game_concept_bayyuralar_desc:90 "Байюралар, что на архаичном кольргийском означает «Западный путь», — это вторжение в Айроной под предводительством Байтора, последнего кагахатана [Concept('otachedian_empire','Отачедской империи')|E].\n\nЭта злополучная экспедиция началась вскоре после победы Байтора в Войне пяти братьев, где он убил двоих своих братьев, одного изгнал, а своего старшего брата, Могху, превратил в своего вассала. Хотя война была недолгой и оставила [Concept('kashirya','Каширию')|E] почти неповрежденной, она ознаменовала первый крах отачедской власти и вдохновила коренных каширийцев на первые восстания против ее правления. Поскольку каширийские ученые по наущению его тети и соперников в других отачедских государствах публиковали антибайторские трактаты, и даже его собственные олтенские вассалы и соплеменники сомневались в его праве на власть, Байтор решил вторгнуться в Айроной, чтобы одновременно захватить новые земли и утвердиться в качестве истинного преемника наследия Отачеда. Он во всеуслышание заявил, что экспедиция на запад закрепит за ним славу человека, превзошедшего своего обожествленного деда Отачеда, что привело к четырем покушениям на его жизнь и бунтам в дюжине каширийских городов.\n\nНесмотря на это, он осуществил вторжение и добился больших успехов в восточном Айроное. Став самым масштабным перемещением олтенских воинов и кланов со времен вторжения его деда в Каширию, отачедские армии были хорошо снабжены, обучены и воодушевлены перед новой войной. Современники отмечали исключительный боевой дух, поскольку поколение, маршировавшее на запад, верило, что им дан шанс заслужить славу своих дедов — то, чего не смогли достичь их собственные отцы. Эти успехи длились недолго и, вероятно, были достигнуты благодаря тому, что восточные государства оказались не готовы к столь масштабным войнам. Когда орда двинулась на запад, в Астиликанскую империю, Байтор был сброшен с лошади и утонул в [Concept('battle_of_the_wall_of_astila','битве у Астильской стены')|E], что привело к концу Отачедской империи и созданию множества государств олтенских военачальников в Айроное."
 
 game_concept_discovery_of_the_adiyya_ka_pharvaarava:90 "Открытие Адийя ка Пхарваарава"
 game_concept_discovery_of_the_adiyya_ka_pharvaarava_desc:90 "Открытие Адийя ка Пхарваарава (на западе часто именуемого «Источником дурных знаний») — событие в каширийской истории, которое повсеместно признано (несмотря на аргументы видваукеятранских ученых) начальной точкой того, что станет известно как [Concept('murtuy_ka_varha','Муртуй ка Варха')|E], или «Годы смерти».\n\nПримерно за год до Годов смерти ученый-видваукеятранец Навад Джавхад обнаружил то, что он провозгласил одним из многих утерянных исследований Библиотекаря, а вместе с ним и источник давно утерянных древних знаний, несомненно предназначенных для передачи человечеству (позже названный Источником дурных знаний). Даже среди видваукеятранского ученого сословия, которое обычно с восторгом относилось к любым обнаруженным знаниям, сама идея обнародования этих находок стала спорной. Утерянные знания содержали множество ранее совершенно неизвестных заклинаний и ритуалов, которые позволяли призывать ушедших духов прошлого для общения или оказания помощи, а также позволяли прибегнуть к зачаточной форме того, что на западе называют [Concept('lichdom','личеством')|E].\n\nНесмотря на предупреждения, Джавхад решил начать массовое копирование информации для распространения. Многие свитки, отправленные из его академии в Дораджпоре, оказались в руках дарамарджаратанских сектантов, давно изгнанных из основного русла их веры за одержимость некромантией. Это привело к катастрофе: в течение месяца после того, как они узнали о ритуалах, секты юго-востока начали стремительно проводить заклинания в масштабах, далеко превосходящих как возможности их тел, так и то, что предполагали сами ритуалы. Из-за преднамеренного зла или случайной глупости юго-восток Каширии вскоре был быстро сокрушен легионами духов и нежити, положив начало Муртуй ка Варха."
 
 game_concept_death_of_holkkarak_and_the_end_of_the_murtuy_ka_varha:90 "Смерть Холккарака и окончание Муртуй ка Варха"
 game_concept_death_of_holkkarak_and_the_end_of_the_murtuy_ka_varha_desc:90 "[Concept('murtuy_ka_varha','Муртуй ка Варха')|E] длился около десяти лет, в течение которых почти треть [Concept('kashirya','Каширии')|E] была уничтожена в ходе войны против Холккарака и мертвецов, прежде чем аристайканский король Асодзива объединил колеблющиеся государства живых и повелел им выступить против Каширии в войне, которую позже назовут «Войной Великого Асодзивы».\n\nАсодзива объединил оставшиеся государства частично войной, но в большей степени — дипломатией и интригами. Что примечательно, Асодзива был весьма выдающимся теологом, и предания утверждают, будто он объединил одиннадцать враждующих государей одиннадцати разных вероисповеданий в ходе трехдневных богословских дебатов об истинной природе песка и его связи с сотворением вселенной. Независимо от правдивости этих историй, Асодзива выступил против Холккарака с самой большой армией, собранной со времен [Concept('otachedian_empire','Отачедской империи')|E], а также с огромным арсеналом заклинаний, собранных видваукеятранцами и способных уничтожать целые города апокалиптическими взрывами.\n\nСобытие окончательно завершилось, когда руины Караловьи были отбиты Асодзивой, который сразил Холккарака и провел ритуал, изгнавший мертвецов этих земель обратно в загробный мир. Когда весть о победе разнеслась повсюду, разъяренная толпа собралась в Дораджпоре и двинулась на местную академию, где Навад Джавхад продолжал копировать обнаруженные им ритуалы, несмотря на неспособность найти кого-либо, кто согласился бы их распространять. Толпа сожгла академию дотла, забила Джавхада до смерти и уничтожила знания академии (вместе с тысячами не связанных с этим книг, свитков и табличек) и все их копии. Местные военачальники вскоре приняли в этом участие, отвоевывая восток и провозглашая, что все знания о заклинаниях, обнаруженных Джавхадом, должны быть уничтожены. Затем Асодзива был коронован как первый правитель [Concept('taryaad_saramsaasan','Тарьяад Сарамсаасан')|E], которая просуществует вплоть до [Concept('vaarash','Ваараша')|E]."
 
 #GROUPS AND ORGANIZATIONS
 
 game_concept_vidvaookeyatran_scholarly_caste:90 "Сословие ученых-видваукеятранцев"
 game_concept_vidvaookeyatran_scholarly_caste_desc:90 "Самая священная, уважаемая и влиятельная профессия в видваукеятранской вере — это профессия ученого. Будучи зачастую (но не всегда) [Concept('magi','магами')|E], ученые этой конфессии обычно проживают в тысячах великих [Concept('vidvakastilaya','академий, храмов и библиотек')|E], разбросанных по всей [Concept('kashirya','Каширии')|E], где они усердно трудятся над сбором всех доступных знаний. В конце концов, если Сарват обладает полнотой всех знаний, а люди могут узнать лишь то, чем Сарват желает поделиться, то обретение и распространение любых знаний совершенно приемлемо. Говорят даже, что люди могут уподобиться богам, но только если смогут постичь все существующие знания; верующие заходят так далеко, что часто спорят о том, был ли Сарват сотворен богом или же он был человеком, вознесшимся таким путем.\n\nХотя ученые являются наиболее почитаемой и влиятельной прослойкой общества в видваукеятранстве и привнесли великие инновации в науку, культуру и философию Каширии, их также следует «благодарить» (хотя они яростно оспаривают свою долю вины) за [Concept('chan_skorpokaipis','многочисленные бедствия')|E]."
 
 #CHARACTERS
 
 game_concept_saru:90 "Сару"
 game_concept_saru_desc:90 "Сару был аристайканским ученым VII века, который произвел фурор в религиозной среде, когда начал проповедовать концепцию «несостоятельности знания». Это убеждение гласит, что люди принципиально не способны по-настоящему что-либо знать, поскольку отсутствие божественности означает отсутствие универсальной истины, а следовательно, достоверность любых знаний невозможно подтвердить, и тратить время на их изучение бесполезно. Разумеется, последующие ученые утверждали, что невозможно знать, будто это невозможно знать, равно как и невозможно знать, что богов нет, как и невозможно знать, невозможно ли знать это, и так далее и тому подобное."
 
 game_concept_vidvakastilaya:90 "Видвакастилайя"
 game_concept_vidvakastilaya_desc:90 "Под Видвакастилайей понимаются тысячи академий, храмов и библиотек, посвященных видваукеятранской вере. Крупнейшие из этих Видвакастилай являются центрами [Concept('vidvaookeyatran_scholarly_caste','ученой')|E] власти и оказывают огромное влияние на правителей [Concept('kashirya','Каширии')|E]. Практически каждое заметное новшество в каширийской науке и магии происходит из стен одной из этих Видвакастилай. Наличие выдающейся Видвакастилайи в качестве союзника дарует правителю огромную магическую, духовную и светскую власть. Однако ученые имеют склонность сеять хаос на землях во имя знаний, что вызывает негодование у местного населения."

 game_concept_toragei_mahratian:90 "Торагей-хатан"
 game_concept_toragei_mahratian_desc:90 "Торагей-хатан был единственным ребенком наложницы Урду, принадлежавшей [Concept('otachedian_empire','Отачеду')|E], и родился почти через год после смерти великого завоевателя в 318 году по имперскому летоисчислению. Пораженный [Concept('gedeora','гедеорой')|E] ещё во чреве матери, Торагей родился совершенно безглазым — там, где должны были быть глаза, не было ничего, кроме кожи и костей, — и все же он мог видеть, охотиться и воевать, как любой другой мужчина.\n\nОтвергнутый отачедской знатью из-за своего спорного происхождения, Торагей был изгнан с их глаз и со двора, покинул пределы империи и был вынужден влачить существование в землях за пределами [Concept('kashirya','Каширии')|E] в качестве наемника и искателя приключений. Лишь во время хаоса Войны пяти братьев он, став к тому времени опытным лордом-наемником, был призван Байтором, чтобы помочь последнему одолеть братьев и взойти на императорский престол.\n\nПосле катастрофы [Concept('bayyuralar','Байюралара')|E] и смерти Байтора Торагей, воссоединившись с кланом своей матери, повел их через [Concept('kasiryat_biozone','Кашириятский')|E] биом в Амагею, завоевав новое государство для своих сородичей."

 game_concept_toragei_kikarsag:90 "Торагей-хатир"
 game_concept_toragei_kikarsag_desc:90 "Торагей-хатир был единственным ребенком наложницы Урду, принадлежавшей [Concept('otachedian_empire','Отачеду')|E], и родился почти через год после смерти великого завоевателя в 318 году по имперскому летоисчислению. Пораженный [Concept('gedeora','гедеорой')|E] ещё во чреве матери, Торагей родился совершенно безглазым — там, где должны были быть глаза, не было ничего, кроме кожи и костей, — и все же он мог видеть, охотиться и воевать, как любой другой мужчина.\n\nОтвергнутый отачедской знатью из-за своего спорного происхождения, Торагей был изгнан со двора, со временем найдя убежище среди обособленных кланов кикарсаг, которые узрели в его безглазии знак божественности. Олтенские собратья, и без того взиравшие на кикарсаг с подозрением и враждебностью, использовали укрывательство изгнанника как удобный предлог для начала гонений, что вынудило кикарсаг — а вместе с ними и Торагея — спасаться бегством.\n\n В последующие десятилетия Торагей, встав во главе кланов, провел их через Айроной во [Concept('the_continent','Внутренние земли континента')|E], обеспечив кикарсаг место для расселения, но непреднамеренно подставив их под будущие удары на передовой [Concept('kartharadd','Картараддских войн')|E]."
 
