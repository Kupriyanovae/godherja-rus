 #EVENTS
  game_concept_akualion_tutil:90 "Аукалион Тутил"
  game_concept_akualion_tutil_desc:90 "Аукалион Тутил, в преданиях зовущийся «Погоней за кометой», — эпоха великого исхода народа накахании в VII веке, приведшего их к Ночному побережью. Исконная обитель сего племени сокрыта во тьме веков, известно лишь, что их родной архипелаг лежал где-то в бескрайних водах дальневосточного океана [Concept('aeras','Эраса')|E]. Ведомая мудрым царем Каиату Навигатором, флотилия шла на закат, следуя за явлением Багровой кометы. Тяготы сего пути и деяния явившихся тогда героев легли в основу самых почитаемых сказаний современных накахании.\n\nПосле десятилетнего блуждания по волнам флот причалил к Ночному побережью в 625 году. Однако во время переговоров с туземцами Тримбисо царь Каиату был вероломно убит, что ввергло переселенцев в пучину бедствий. Вслед за тем вспыхнула яростная распря за опустевший престол: верховный советник покойного государя, его вдова и приемный сын по-разному видели будущее своего народа и развязали междоусобную войну. В конечном счете эта смута разделила накахании на три их современные ветви."
 
  game_concept_margur_migration:90 "Переселение маргуров"
  game_concept_margur_migration_desc:90 "Переселение маргуров — гипотетическое движение племен, происходившее, как полагают, между V и VI веками до И.С. Причины сего исхода остаются в лучшем случае туманными, однако предания гласят, что маргуры перекочевали из восточного [Concept('sarradon','Сarradona')|E] в [Concept('kashirya','Каширию')|E] за пронзительно короткий срок. Это натолкнуло видваукеятранских книжников на мысль, что племена спасались бегством от некоей великой катастрофы.\n\nНемногие уцелевшие свидетельства той поры указывают на то, что маргуры на протяжении столетий томились под игом вародаистов вплоть до прихода [Concept('otachedian_empire','Отачедской империи')|E]."

 #CHARACTERS
 
 #GROUPS AND ORGANIZATIONS
 
  game_concept_otachedian_empire:90 "Отачедская империя"
  game_concept_otachedian_empire_desc:90 "Отачедская империя — могучая держава начала IV века, основанная великим ольтенским воителем, вождем и теологом Отачедом. Ему удалось сковать первое единое ольтенское государство силами [Concept('iorne_horde','Иорнской орды')|E] после ничейного исхода сечи при [Concept('khayar_seldnii_darn','Хайяр Сэлдний Дарн')|E], где он обрел легендарный клинок [Concept('iorne_seld','Иорне Сельд')|E]. Приведя кланы на юг, в [Concept('kashirya','Каширию')|E], Отачед осознал необходимость оседлого и прочного государства вместо кочевой вольницы, отчего распустил Орду и провозгласил империю. Говорят, Отачед выковал вторую корону в ольтенской истории (первая, по поверьям, принадлежала богу неба Ольгон-тену). Он также облачился в маску из чистого золота, переплавленного из ожерелий сотни казненных вародаистских жрецов, и провозгласил себя Хаагер-Хатаном — Богоподобным императором и сыном [Glossary('Кайгана','GH_KAIGAN_GLOSS')], Бога людей.\n\nВ годы, последовавшие за покорением Каширии, Отачед посвятил себя созданию новой управительной системы, лишь отчасти переняв обычаи побежденных. И пусть он прожил недостаточно долго, дабы вкусить плоды побед, и скончался перед самым походом в Айроной, созданная им держава оказалась долговечной. Почти все последующие царства Каширии строили свои законы на основе Отачедского права, а гонения императора на вародаистские жреческие касты и покровительство сектантским культам привели к упадку старой веры и рождению множества ее ответвлений. Отачед уже более тысячи лет почитается как великий религиозный реформатор за свою широту взглядов, причем каширийцы зовут его Чаккара-Хайтаном. Его завороженность здешними ремеслами, новшествами и философией, а также покровительство касте ученых мужей стали отправной точкой для зарождения веры Видваукеятран."
 
  game_concept_taryaad_saramsaasan:90 "Тарьяад Сарамсаасан"
  game_concept_taryaad_saramsaasan_desc:90 "Тарьяад Сарамсаасан — [Concept('kashirya','каширийское')|E] государство, процветавшее между X и XI веками. Последняя из великих исторических империй Каширии, она раскинулась почти на весь регион, подарив здешним народам краткий, но благодатный золотой век.\n\nДо воцарения династии Тарьяад Каширия пребывала в раздроблении без малого два века, а из-за бедствий [Concept('sabar_lambay_raad','Сабар Ламбай Раад')|E] почти треть субконтинента лежала в руинах и обезлюдела. Воитель Асодзива, сокрушивший бессмертного владыку Холккарака и положивший конец этому кошмару, использовал свою славу ради создания новой империи на отвоеванных и родовых землях, приняв династическое имя Тарьяад.\n\nДинастия правила на протяжении четырех поколений; Асодзива и его преемники объявляли себя земными воплощениями древнего бога Паэрасджатана. Это, наряду с раздорами с видваукеятранским ученым сословием и опасениями государей, что изыскания ученых мужей могут навлечь новые разрушения из-за их безрассудства в чародейских практиках, привело к затяжной борьбе престола с книжниками.\n\nИмперия пала при правнуке Асодзивы, Чутаграте, который поручил видваукеятранской секте «Санстхакап» составить летопись своего рода ради укрепления власти. Однако книжники объявили, будто отец Чутаграта был тайно усыновлен, а сам основатель Асодзива родился бастардом в семье мелкого лавочника. Это разрушило легитимность Чутаграта и ввергло страну в пучину [Concept('vaarash','Ваараша')|E]. В народе по сей день верят, будто видваукеятранцы выдумали эти порочащие сведения, дабы сокрушить соперников в лице Тарьяадов, — и если это так, то пред нами первый случай, когда ученые мужи решили скрыть истинное знание ради выгоды."
 
  game_concept_iorne_horde:90 "Иорнская орда"
  game_concept_iorne_horde_desc:90 "Иорнская орда (иначе зовущаяся Эонской) приняла имя в честь легендарного меча [Concept('iorne_seld','Иорне Сельд')|E], с помощью которого ольтенский вождь Отачед сплотил разрозненные кланы после бойни при [Concept('khayar_seldnii_darn','Хайяр Сэлдний Дарн')|E]. Не одержав явной победы в тех войнах, что стерли с лица земли катуньское царство Чейюнджей и унесли жизни обеих армий, Отачед тем не менее проявил себя как искуснейший глашатай и вождь в ольтенской истории, сумев преподнести свое спасение как знак благословения бога [Glossary('Кайгана','GH_KAIGAN_GLOSS')].\n\nОбъединив Кольргийские степи, Отачед увел воинство на юг, прочь от Катун-Кая. Ольтенские сказания гласят, будто хан заскучал после победы над Ксаои Яунг Заянгом, сильнейшим из витязей Катун-Кая; катуньские же летописцы утверждали, что былые войны истощили степи не меньше Чейюнджея, и кланы просто не пережили бы нового столкновения с нетронутыми восточными ратями Катун-Кая. Истина сокрыта, ведь те события гремели еще до зарождения [Concept('wardenism','Хранизма')|E] в [Concept('sarradon','Саррадоне')|E], но обе версии принято считать долей правды.\n\nОтачед повел орду на юг и вторгся в [Concept('kashirya','Каширию')|E], сокрушив угасающие вародаистские царства и дойдя до самого Пиратского побережья. Впоследствии Орда была распущена, дабы уступить место [Concept('otachedian_empire','Отачедской империи')|E]. Несмотря на свой краткий десятилетний век, она изменила лик мира. Конец [Concept('oltenic_kathuni_wars','Ольтенско-катуньских войн')|E] перекроил границы Катун-Кая, а завоевание Каширии сплотило край под началом его первой истинной империи. Единение кланов породило грядущие ольтенские культуры, а преемники Отачеда во многом определили историю Айроноя и [Concept('aversaria','Аверсарианской Аавтократии')|E]."
 
