 game_concept_phulikama:90 "Пхуликама"
 game_concept_phulikama_desc:90 "Пхуликама — изящные, подобные цветам посохи, венчанные чистейшим кристаллом. В сарутанских землях право на престол исторически принадлежит тому, кто удерживает древнюю Пхуликаму своего города, хотя многие знатные роды давно закрепили за собой право передавать ее по наследству сыновьям и дочерям ради сохранения власти.\n\nМногие дома создали целые иерархические серии посохов, увеличивая их в размерах ради тщеславной демонстрации высокого титула. Однако колоссальные расходы на сотворение столь ценных артефактов изрядно истощили казну знати, сделав ее сравнительно бедной на фоне богатеющего купеческого сословия, торгующего пряностями."
 
 game_concept_iafarana_historiography:90 "Иафаранская историография"
 game_concept_iafarana_historiography_desc:90 "Большая часть свитков о ранней истории народа иафарана безвозвратно затерялась в веках. Немногие уцелевшие свидетельства гласят, что их мореходные предки пристали к здешним берегам из восточной Каширии и с Пиратского побережья, хотя ученые тщетно бьются над точной датировкой сего исхода из-за хроник, сгоревших в пламени [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E]. Первые упоминания об иафарана восходят к VIII веку, но доселе неясно, указывают ли они на предков-мореходов или же на народ, населяющий эти земли ныне."

