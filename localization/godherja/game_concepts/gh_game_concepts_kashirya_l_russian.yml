 game_concept_gudugwrat:90 "Гудугврат, Буря-отступница"
 game_concept_gudugwrat_desc:90 "Гудугврат, Буря-отступница, — это колоссальный ураган, который периодически возникает в Каширийском заливе, зарождаясь в самом центре, а затем медленно закручиваясь спиралью к побережью. Его характерные густые фиолетовые тучи приносят шквалистый ветер и град, а также удары молний, способные сровнять с землей целые деревни. Шторм длится от нескольких дней до нескольких недель и случается каждые два-три года. Когда Гудугврат надвигается, вода отступает от берега, обнажая морское дно. Экспедиции в самое сердце бури — обычное дело: от поисков затерянных сокровищ глубин до сбора [Concept('wratcrystals','врат-кристаллов')|E], пока их не поглотило море."
 
 game_concept_wratcrystals:90 "Врат-кристаллы"
 game_concept_wratcrystals_desc:90 "Врат-кристаллы создаются во время бури [Concept('gudugwrat','Гудугврат')|E], когда ее мощные молнии ударяют в песок, оставляя после себя искрящиеся энергией магические кристаллы. Будучи крайне нестабильными, большинство кристаллов очищаются учеными академии Чандамарун для использования в магических ритуалах. Добыча этих кристаллов чрезвычайно опасна, так как требует путешествия к центру смертоносного шторма с риском гибели от магического воздействия, ударов молний и проклятых тварей, бродящих по морскому дну."
 
 game_concept_87_theses:90 "Восемьдесят семь тезисов Ширамаха"
 game_concept_87_theses_desc:90 "Написанные знаменитым видваукеятранским ученым-[Concept('magi','магом')|E] Ширамахом, его «Восемьдесят семь тезисов о природе познания и опровержении эмпирической мысли», или просто «Восемьдесят семь тезисов», представляют собой серию трактатов, критикующих господствующую эмпирическую школу [Concept('magic','магии')|E]. Ширамах разделил познание на два вида — «смертное», чисто интеллектуальное знание, и «божественное», провидческое познание, — и подтвердил свое прозрение сотворением заклинаний прорицания.\n\nЕще одним предметом спора, поднятым в этих эссе, был его отказ от идеи, что люди могут достичь божественности исключительно через обретение познания; он постулировал, что человеческий разум склонен к забывчивости и должен быть изменен с помощью медитации и магии, прежде чем сможет удерживать в себе все знания. «Восемьдесят семь тезисов» оказались основополагающим трудом в области каширийской магической теории и заложили фундамент для того, что позже станет школой Оракульской магии."

 game_concept_virlanic_splendor:90 "Вирланское великолепие"
 game_concept_virlanic_splendor_desc:90 "Для вирлани ценность человека определяется тем, сколько чужеземных артефактов находится в его коллекции. Демонстрация местных артефактов почетным гостям считается позором, а вирланский тактей без коллекции заморских диковинок не признается мастером, достойным службы."