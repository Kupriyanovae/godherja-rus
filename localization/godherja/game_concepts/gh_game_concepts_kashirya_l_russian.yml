  game_concept_akualion_tutil:90 "Аукалион Тутил"
  game_concept_akualion_tutil_desc:90 "Аукалион Тутил, или «Погоня за кометой», — это великое переселение народа накахании в VII веке, которое в конечном итоге привело их к Ночному побережью. Точное местонахождение родного архипелага накахании доподлинно неизвестно, кроме того факта, что он расположен где-то в бескрайнем дальневосточном океане [Concept('aeras','Эраса')|E]. Возглавляемая мудрым царем Каиату «Навигатором», экспедиция следовала на запад за Багровой кометой. Испытания и герои, появившиеся в ходе этого пути, легли в основу многих самых почитаемых легенд современных накахании.\n\nПосле десятилетнего путешествия флот прибыл к Ночному побережью в 625 году, но во время переговоров с туземцами Тримбисо Каиату был вероломно убит, что привело к катастрофе. Вслед за этим разразился кризис престолонаследия, так как самый доверенный советник короля, его вдова и приемный сын предложили разные пути развития и начали борьбу за власть. В конечном счете эта распря разделила накахании на их современные ветви."
 
  game_concept_margur_migration:90 "Переселение маргуров"
  game_concept_margur_migration_desc:90 "Переселение маргуров — это гипотетическое миграционное движение, произошедшее где-то между V и VI веками до И.С. Причины этого события остаются в лучшем случае туманными, однако предания гласят, что маргуры переселились из восточного [Concept('sarradon','Саррадона')|E] в [Concept('kashirya','Каширию')|E] за очень короткий промежуток времени. Это подтолкнуло некоторых ученых-видваукеятранцев к теории о том, что они спасались бегством от некой катастрофы.\n\nНемногие сохранившиеся артефакты того периода указывают на то, что маргуры на протяжении веков находились в подчинении у вародаистов до прихода [Concept('otachedian_empire','Отачедской империи')|E]."

 #CHARACTERS
 
 #GROUPS AND ORGANIZATIONS
 
  game_concept_otachedian_empire:90 "Отачедская империя"
  game_concept_otachedian_empire_desc:90 "Отачедская империя — политическое образование начала IV века, созданное великим ольтенским воином, государственным деятелем и теологом Отачедом, который сформировал первое единое ольтенское государство с помощью [Concept('iorne_horde','Иорнской орды')|E] после ничьей в битве при [Concept('khayar_seldnii_darn','Хайяр Сэлдний Дарн')|E] и обретения легендарного меча [Concept('iorne_seld','Иорне Сельд')|E]. Приведя кланы на юг, в [Concept('kashirya','Каширию')|E], Отачед осознал необходимость создания более постоянного и организованного государства вместо кочевой Иорнской орды, поэтому он распустил Орду и провозгласил Отачедскую империю. Говорят, что Отачед выковал вторую корону в ольтенской истории (первая принадлежала богу неба Ольгон-тену). Он также создал маску из чистого золота, переплавленного из ожерелий сотни вародаистских жрецов, в которой объявил себя Хаагер-Хатаном — Богоподобным императором и сыном [Glossary('Кайгана','GH_KAIGAN_GLOSS')], Бога людей.\n\nВ годы, последовавшие за завоеванием Каширии, Отачед посвятил свое время созданию совершенно новой политической системы, лишь частично основанной на традициях покоренных им каширийцев. Хотя он прожил недостаточно долго, чтобы наслаждаться своими завоеваниями дольше нескольких лет, и скончался перед самым началом запланированного похода в Айроной, созданная им политическая структура оказалась долговечной. Почти все последующие государства в Каширии строили свои правовые системы на основе так называемого Отачедского права, а отрицание Отачедом вародаистских жреческих каст и его поощрение сектантских религий привели к упадку вародаизма и рождению множества его ответвлений. Отачед уже более тысячи лет почитается многими жрецами как великий религиозный реформатор за свою широту взглядов, причем многие называют его Чаккара-Хайтаном (переложение его титула на каширийские языки). Хотя это почитание может быть спорным, он действительно был очарован каширийскими технологиями, инновациями и философией, и его покровительство касте ученых, по всей видимости, стало отправной точкой для веры Видваукеятран."
 
  game_concept_taryaad_saramsaasan:90 "Тарьяад Сарамсаасан"
  game_concept_taryaad_saramsaasan_desc:90 "Тарьяад Сарамсаасан — [Concept('kashirya','каширийское')|E] государство, существовавшее между X и XI веками. Последняя из великих исторических империй Каширии, она раскинулась почти на весь регион и поддерживала то, что многие сочли бы прискорбно коротким, но в остальном процветающим золотым веком.\n\nХотя Каширия не была единой на протяжении почти двухсот лет до Тарьяада, из-за [Concept('sabar_lambay_raad','Сабар Ламбай Раад')|E] почти треть субконтинента оказалась опустошена и практически необитаема. Асодзива, который сразил бессмертного правителя Холккарака и положил конец этому событию, использовал свою широкую популярность для создания новой империи как в опустошенных регионах, так и на своих личных землях, и принял династическое имя Тарьяад.\n\nДинастия Тарьяад правила на протяжении четырех поколений; Асодзива и последующие императоры объявляли себя реинкарнациями древнего бога Паэрасджатана. Это, наряду с различными политическими конфликтами с видваукеятранским ученым сословием и опасениями Тарьяадов, что ученые могут вызвать массовые разрушения из-за своего пренебрежения безопасностью в практиках, привело к постоянным столкновениям с учеными на протяжении большей части правления империи.\n\nИмперия пала при правнуке Асодзивы, Чутаграте, который поручил видваукеятранской секте «Санстхакап» написать династическую биографию для дальнейшего укрепления своей власти. Вместо этого представители секты обнаружили, что отец Чутаграта мог быть тайно усыновлен династией, а сам Асодзива, возможно, родился бастардом в семье мелкого торговца. Это привело к краху легитимности Чутаграта и к [Concept('vaarash','Ваарашу')|E]. В народе широко распространено мнение, что видваукеятранцы выдумали эти сведения, чтобы устранить своих соперников в лице Тарьяадов, хотя, если это правда, то это первый случай, когда они решили не распространять истинные знания."
 
  game_concept_iorne_horde:90 "Иорнская орда"
  game_concept_iorne_horde_desc:90 "Иорнская орда (или Эонская орда) была названа в честь легендарного меча [Concept('iorne_seld','Иорне Сельд')|E], который ольтенский военачальник Отачед использовал для объединения ольтенских кланов после [Concept('khayar_seldnii_darn','Хайяр Сэлдний Дарн')|E]. Не одержав победы в своих войнах, которые уничтожили катуньское государство Чейюнджей и истребили как ольтенскую, так и катуньскую армии, Отачед тем не менее проявил себя, пожалуй, как самый проницательный пропагандист и государственный деятель в ольтенской истории, и сумел преподнести свое выживание как доказательство своего происхождения от бога [Glossary('Кайгана','GH_KAIGAN_GLOSS')].\n\nОбъединив Кольргийские степи, Отачед двинулся на юг, прочь от Катун-Кая. Ольтенские сказания гласят, что ему стало скучно после победы над Ксаои Яунг Заянгом, могущественнейшим из воинов Катун-Кая, в то время как катуньские историки писали, что войны опустошили степи так же сильно, как и Чейюнджей, и что кланы не пережили бы ещё одну войну подобного масштаба с практически нетронутыми восточными армиями Катун-Кая. Истина неизвестна, так как эти события произошли ещё до зарождения [Concept('wardenism','Хранизма')|E] в [Concept('sarradon','Саррадоне')|E], но обе эти версии принято считать частично правдивыми.\n\nОтачед повел орду на юг и вторгся в [Concept('kashirya','Каширию')|E], разгромив едва выживавшие вародаистские царства и завоевав земли вплоть до современного Пиратского побережья. Впоследствии Орда была распущена, а на ее месте возникла [Concept('otachedian_empire','Отачедская империя')|E]. Несмотря на свое короткое десятилетнее существование, она сильно повлияла на мировую историю. Завершение [Concept('oltenic_kathuni_wars','Ольтенско-катуньских войн')|E] и Хайяр Сэлдний Дарн изменили облик Катун-Кая, в то время как завоевание Каширии привело к созданию ее первой настоящей империи. Объединение кланов дало начало всем последующим ольтенским культурам и религиям, а Отачедская империя и ее преемники во многом определили историю Айроноя и [Concept('aversaria','Аверсарианской Автократии')|E]."
 
