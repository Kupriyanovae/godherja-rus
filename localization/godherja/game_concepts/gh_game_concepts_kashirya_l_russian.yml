 ##CULTURE 

 game_concept_great_callings:90 "Великие призвания"
 game_concept_great_callings_desc:90 "По достижении шестнадцати зим каждый отрок племени прапатаро обязан избрать одно из трех Великих призваний, становясь Мыслителем, Воином или Земледельцем.\n\nЗемледельцы трудятся на многоярусных древесных угодьях, выращивая вьющиеся плоды и овощи. Воины закаляются в чащобах, постигая искусство скрытности и засад; им часто приходится являть свое мастерство на деле, отражая пиратские набеги с побережья. В то же время Мыслители вершат суд, распределяют припасы, куют законы и создают искусные изделия из дерева и металла, необходимые для повседневного уклада общины."

 #GODS
 
 #DESCRIPTIONS
 
 
 ##ARTIFACTS

 game_concept_perdition_armaments:90 "Оружие Погибели"
 game_concept_perdition_armaments_desc:90 "«Погибель» — одно из наиболее грозных и изученных заклятий для оружия, чьи истоки восходят к ритуальным искусствам Галитового храма и его тайных ответвлений. Первоначально сотворяемое лишь для священных клинков стражей реликвариев, знание о сем чародействе распространилось среди мирян после вторжения [Concept('otachedian_empire','Отачеда')|E] в [Concept('kashirya','Каширию')|E], когда свитки заклинания были изъяты из Храма в качестве военного трофея.\n\nБудучи наложенным на режущую кромку оружия, заклятие «Погибель» заставляет любую пролитую клинком кровь мгновенно превращаться в едкую соль, которая проникает вглубь плоти соразмерно силе чар и наносит жертве мучительные увечья. Осуждаемые многими за излишнюю жестокость, эти чары были бесславно применены в небывалом масштабе во время [Concept('desiccation_of_kazvosk','Иссушения Казвоска')|E], когда заклинание было сотворено с помощью ныне утерянного Галитового копья."
 
 ###REGIONAL
 game_concept_kashirya:90 "Каширия"
 game_concept_kashirya_desc:90 "Каширия — обширный мультикультурный регион, лежащий между [Concept('aversaria','Аверсарией')|E] на западе и степями Катун-Кая на востоке. В стародавние времена край был объединен под дланью [Concept('otachedian_empire','Отачедской империи')|E], что привело к глубоким культурным и религиозным сдвигам, надолго пережившим саму державу. Большая часть долгой истории этих земель была безвозвратно утеряна со времен бедствий [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E]."
 
 ##REGION
 
 #EVENTS
 game_concept_chan_skorpokaipis:90 "Чан Скорпокаипис"
 game_concept_chan_skorpokaipis_desc:90 "Чан Скорпокаипис, ведомый в хрониках как Четыре Апокалипсиса, — череда сокрушительных катастроф, прогремевших в период между IX и XI веками. Вина за сии бедствия в огромной степени (хоть это и оспаривается) возлагается на видваукеятранских ученых мужей. Эти потрясения перекроили историю Каширии, став предвестием новой эры, ибо с их приходом вся прежняя летопись края подошла к бесповоротному концу.\n\nПервым ударом стал [Concept('sabar_lambay_raad','Сабар Ламбай Раад')|E], прозванный «Самой долгой ночью»: тогда книжники в безумных изысканиях навели солнечное затмение исключительно на [Concept('kashirya','Каширию')|E], и мрак не рассеивался без малого год.\n\nВторым явился [Concept('murtuy_ka_varha','Муртуй ка Варха')|E], когда ученый Навад Джавхад бездумно открыл миру десятки опаснейших ритуалов, что подняло по всей Каширии легионы восставших мертвецов, едва не поглотивших живых.\n\nТретьим знамением стал [Concept('vaarash','Ваараш')|E] — смута, вспыхнувшая, когда ученые мужи отыскали изъян в родословной правителей [Concept('taryaad_saramsaasan','Тарьяад Сарамсаасан')|E] и поспешили разгласить сию тайну, обрекая Каширию на тридцать зим жестокой междоусобицы, сгубившей единую державу.\n\nЧетвертым же потрясением сделалось [Concept('chojakaan_ka_ghatada','Чоджакаан ка Гхатада')|E]: силясь отыскать способ очищения металла от ржавчины, книжники случайно стерли с лица земли двенадцать великих городов, а после едва не осквернили мир [Concept('selfreplicating_blood_magic','самораспространяющейся магией крови')|E], тщетно пытаясь вернуть утраченное.\n\nКонец эпохе бедствий был положен в XI веке, когда вспыхнула [Concept('dharya_varha','Дхарья Варха')|E] — волна яростных мятежей простонародья против разума и книжной мудрости, опустошавшая Каширию почти полвека."
 
 game_concept_dharya_varha:90 "Дхарья Варха"
 game_concept_dharya_varha_desc:90 "Дхарья Варха, или «Праведные годы», — бушевавшая полвека буря массовых антиинтеллектуальных восстаний, захлестнувшая [Concept('kashirya','Каширию')|E] в начале XI века. Мятежники стремились сокрушить власть видваукеятранских ученых над регионом. Воинство бунтовщиков, нарекших себя «Дхарьям Лон» (Праведниками), разрослось до исполинских размеров. Они винили правящих владык в том, что те дали книжникам полную волю в их опасных изысканиях, из-за чего аристократия большинства земель сплотилась с магами и учеными ради подавления бунта.\n\nПоскольку знать и ученое сословие, к коему принадлежало большинство [Concept('magi','магов')|E] Каширии, выступили единым фронтом, восстание Праведных годов быстро зашло в тупик. Не смея сойтись с дворянскими ратями в открытом поле, «Праведники» рассеялись по глухим углам Каширии, ведя тайную войну и истребляя видваукеятранцев повсеместно.\n\nЗа годы ратного лихолетья бунтовщики предали разграблению сотни библиотек, хранилищ мудрости и лабораторий, лишив жизни сотни именитых мудрецов. Однако жестокие карательные походы знати и чары видваукеятранской секты Савадхан (Осознанных), защитившие библиотеки от огня (из-за чего сотни несчастных насмерть замерзли в запечатанных залах), подточили силы «Праведников». Уцелевшие укрылись в дальних селениях и прекратили борьбу, обратившись со временем в замкнутую обитель Аскеварьян.\n\nПо подсчетам уцелевших книжников, в огне тех лет сгинуло более семи тысяч лет накопленного знания. Самих же бунтовщиков они называют живым доказательством того, что невежественная толпа вовек будет отвергать плоды просвещения. Впрочем, и поныне звучат голоса, напоминающие: пусть ученые и повинны в былых апокалипсисах, именно их труды принесли Каширии исцеление от болезней и свет грамотности."
 
 game_concept_murtuy_ka_varha:90 "Муртуй ка Варха"
 game_concept_murtuy_ka_varha_desc:90 "Муртуй ка Варха — второй и, без сомнения, самый зловещий из [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E] (Четырех апокалипсисов), поставивший [Concept('kashirya','Каширию')|E] на край погибели в период между IX и XI веками.\n\nНачало кошмару положило [Concept('discovery_of_the_adiyya_ka_pharvaarava','открытие Адийя ка Пхарваарава')|E], свершенное видваукеятранским книжником Навадом Джавхадом. Тот принялся бездумно рассылать повсюду списки найденных им опаснейших ритуалов, пренебрегая страшной угрозой. За один лишь год тайные культы с помощью сих откровений призвали бесчисленные полчища духов и нежити, обуздать коих были не в силах. Сам же Джавхад все это время продолжал множить свои труды, упрямо твердя, будто в пришествии тьмы повинны не его книги, а лишь те, чей разум оказался слишком слаб для столь великого знания.\n\nВойна достигла апогея, когда из праха возвысился уподобившийся [Concept('liches','личу')|E] некромант Сатаян Холккарак, двинувший рати мертвецов на живых, и завершилась лишь со [Concept('death_of_holkkarak_and_the_end_of_the_murtuy_ka_varha','смертью Холккарака и окончанием Муртуй ка Варха')|E]."
 
 game_concept_chojakaan_ka_ghatada:90 "Чоджакаан ка Гхатада"
 game_concept_chojakaan_ka_ghatada_desc:90 "Чоджакаан ка Гхатада, известный как «Событие Чоджакаан», — четвертый и заключительный аккорд из [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E], четырех великих катастроф, безусловная вина за кои лежит на сословии ученых.\n\nБеда пришла из Дораджпорской академии, где книжники, тщившиеся открыть чары против ржавления металлов, случайно сотворили искаженное заклятие, вмиг поглотившее двенадцать цветущих каширийских городов. Пока по всей стране вспыхивали мятежи разгневанного простонародья, ученые секты лихорадочно искали спасение. Дораджпорские мудрецы возликовали, отыскав обрывки древнего ритуала, должного, по их заверениям, вернуть сгинувшие грады из небытия.\n\nСие колдовство нарекли [Concept('selfreplicating_blood_magic','самораспространяющейся магией крови')|E]. Доселе неясно, было ли оно изначально тем губительным мором, или ученые сотворили его по ошибке в попытках исправить оплошность. Заклятие мгновенно испепелило сам Дораджпор, обратив его жителей в столпы яростного пламени. Пожирающий мир мор остановила лишь наемница Кайта: она с боем прорвалась в пылающие чертоги академии и сразила ученых-[Concept('magi','магов')|E], отчаянно пытавшихся обуздать выпущенную силу. Двенадцать городов навеки канули во тьму, Дораджпор превратился в проклятые руины, а выжившие видваукеятранцы еще долго сетовали, что чары непременно разрешили бы кризис, не явись Кайта со своим мечом.\n\nСобытие Чоджакаан переполнило чашу терпения народов Каширии, и этот гнев породил [Concept('dharya_varha','Дхарья Варха')|E]."
 
 game_concept_sabar_lambay_raad:90 "Сабар Ламбай Раад"
 game_concept_sabar_lambay_raad_desc:90 "Сабар Ламбай Раад, или «Самая долгая ночь», — первый из [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E], четырех великих апокалипсисов, порожденных гордыней видваукеятранских ученых.\n\nМрак опустился на землю, когда маги Харьяададской академии решили испробовать новооткрытые чары, должные даровать человеку зрение в кромешной тьме. Вместо этого ритуал вырвал саму твердыню из лона [Concept('aeras','Эраса')|E] и швырнул ее к небесному лику [Concept('aervalr','Эрвала')|E], который тотчас сместился, заслонив дневное светило. И пока вся Каширия изнывала в вечной ночи, за ее пределами солнце всходило в урочный час — неведомым образом затмение сковало лишь этот регион. Попытки мудрецов исправить содеянное обернулись новыми бедами: так, сотворение малого искусственного солнца обратило в пепел город Петхиклу, а иные чары вмиг предали гнили все амбары и припасы Каширии, вызвав лютый голод, терзавший край долгие годы.\n\nСолнце не являлось на небосводе почти год, пока содружество [Concept('magi','магов')|E] из аристайканской и дарамарджаратанской общин вкупе с [Concept('aversaria','аверсарианским')|E] чародеем Мечиосом Протексом не сотворило обратное заклятие. Сие деяние стоило жизни им всем, уцелели лишь Мечиос и аристайканский гуру Вогиб, ставшие после исцеления верными соратниками. Сами же ученые мужи по сей день твердят, будто их магия лишь слегка ускорила ход времени, а годичное затмение было явлением естественным, хоть и нежданным."
 
 game_concept_vaarash:90 "Ваараш"
 game_concept_vaarash_desc:90 "Ваараш, в летописях именуемый Крахом, — третий из [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E], четырех великих апокалипсисов, признанных виной видваукеятранского сословия.\n\nСмута вспыхнула, когда книжникам из секты «Санстхакап» было поручено составить родословное жизнеописание Чутаграта, правящего императора [Concept('taryaad_saramsaasan','Тарьяад Сарамсаасан')|E]. Вгрызаясь в свитки древних хранилищ, они вытащили на свет изъяны в древе предков правителя и тайну происхождения самого основателя династии, Асодзивы. Верные своим догматам, Санстхакапы немедля разгласили сии вести. Это вмиг уничтожило легитимность престола и разожгло двадцатилетнюю войну всех против всех. Бойня утихла лишь со смертью последнего отпрыска династии Тарьяад, а вместе с ней канула в небытие и сама идея единой Каширии.\n\nОправдывая содеянное, ученые мужи приводили двуличные доводы: одни твердили, будто Санстхакапы были отступниками, нарушившими устав и выдумавшими ложь, другие же заявляли, что падение империи лишь доказало ее внутреннюю гниль, а свитки послужили лишь предлогом для алчных лордов. Но неизменной оставалась их главная мантра — знание принадлежит миру, и ученые не в ответе за тех, кто обращает его во зло."
 
 game_concept_bayyuralar:90 "Байюралар"
 game_concept_bayyuralar_desc:90 "Байюралар, что на древнем кольргийском наречии означает «Западный путь», — великое вторжение в Айроной под предводительством Байтора, последнего кагахатана [Concept('otachedian_empire','Отачедской империи')|E].\n\nСий роковой поход начался вскоре после победы Байтора в Войне пяти братьев, где он порешил двоих родичей, одного изгнал, а старшего, Могху, принудил к покорности. И пусть та распря была краткой и не разорила [Concept('kashirya','Каширию')|E], она надломила отачедскую власть, сподвигнув покоренных каширийцев на первые восстания. Поскольку местные книжники с подачи его соперников наводнили мир антибайторскими памфлетами, а собственные ольтенские вассалы сомневались в его праве на трон, вождь двинул орду на Айроной, дабы мечом добыть новые земли и утвердить себя истинным наследником Отачеда. Он громогласно объявил, что поход на запад затмит славу его обожествленного деда, что вызвало четыре покушения на его жизнь и бунты в дюжине городов.\n\nИ все же орда перешла рубежи, добившись громких успехов в Восточном Айроное. То было величайшее движение ольтенских ратников со времен дедовских войн: отачедские легионы шли с полными обозами, прекрасно обученные и воодушевленные. Летописцы дивились их ратному духу, ибо это поколение верило, что им дан шанс заслужить славу предков, упущенную их отцами. Удача, впрочем, была краткой и объяснялась лишь неготовностью восточных земель к большой войне. Стоило орде подступить к границам Астиликанской империи, как Байтор был сброшен с коня и нашел свою смерть в [Concept('battle_of_the_wall_of_astila','битве у Астильской стены')|E], что разрушило Отачедскую империю и породило множество мелких владений ольтенских воевод."
 
 game_concept_discovery_of_the_adiyya_ka_pharvaarava:90 "Открытие Адийя ка Пхарваарава"
 game_concept_discovery_of_the_adiyya_ka_pharvaarava_desc:90 "Открытие Адийя ка Пхарваарава, на западе известное как «Источник дурных знаний», — роковой рубеж в каширийской истории, ставший (вопреки всем оправданиям видваукеятранцев) истоком [Concept('murtuy_ka_varha','Муртуй ка Варха')|E], или Годов смерти.\n\nПримерно за год до пришествия мора ученый Навад Джавхад явил миру находку, объявленную им утерянным трудом самого Библиотекаря, — сокровищницу древней мудрости, должную быть переданной роду людскому. Даже среди его собратьев-книжников, обычно жадных до любого знания, мысль о разглашении свитков вызвала ярые споры. Утерянные тексты таили в себе доселе неведомые чары и ритуалы, позволявшие взывать к духам ушедших ради беседы или помощи, а также открывали путь к примитивной форме того, что на западе зовут [Concept('lichdom','личеством')|E].\n\nПренебрегая предостережениями, Джавхад повелел начать массовое переписывание свитков. Многие списки из его Дораджпорской академии попали в руки дарамарджаратанских сектантов, давно изгнанных за порочную страсть к некромантии. Это привело к катастрофе: в течение месяца чернокнижники юго-востока принялись проводить ритуалы в масштабах, далеко превосходивших и прочность их тел, и замысел самих чар. По злому ли умыслу или из-за чудовищной глупости, Юго-Восточная Каширия была мгновенно затоплена легионами духов и восставшего праха, положив начало Муртуй ка Варха."
 
 game_concept_death_of_holkkarak_and_the_end_of_the_murtuy_ka_varha:90 "Смерть Холккарака и окончание Муртуй ка Варха"
 game_concept_death_of_holkkarak_and_the_end_of_the_murtuy_ka_varha_desc:90 "[Concept('murtuy_ka_varha','Муртуй ка Варха')|E] терзал землю около десяти лет, унеся жизни трети населения [Concept('kashirya','Каширии')|E], прежде чем аристайканский государь Асодзива сплотил угасающие царства живых на войну, названную позже «Войной Великого Асодзивы».\n\nАсодзива объединил разрозненные земли частью мечом, но более — тонкой дипломатией. Будучи выдающимся теологом, он, по преданиям, усадил одиннадцать враждующих государей одиннадцати разных вер за стол и за три дня богословских споров об истинной природе песка и сотворении вселенной убедил их выступить единым фронтом. Как бы то ни было, Асодзива двинул на Холккарака величайшую рать со времен [Concept('otachedian_empire','Отачедской империи')|E], снабженную разрушительными чарами видваукеятранцев, способными стирать грады апокалиптическими взрывами.\n\nКонец мору был положен, когда Асодзива отбил руины Караловьи, лично сразил Холккарака и провел великое очищение, изгнавшее мертвецов обратно за кромку бытия. Когда весть о победе разнеслась по краю, разъяренная толпа ворвалась в Дораджпорскую академию, где Навад Джавхад все еще упрямо переписывал свои свитки, хоть их уже никто не брал. Чернь предала огню чертоги, забила Джавхада до смерти и уничтожила все труды прахом (вместе с тысячами бесценных книг и табличек). Здешние воеводы поддержали погром, объявив любое поминание чар Джавхада вне закона. Вслед за тем Асодзива возложил на себя корону [Concept('taryaad_saramsaasan','Тарьяад Сарамсаасан')|E], чьё правление продлится вплоть до бедствий [Concept('vaarash','Ваараша')|E]."
 
 #GROUPS AND ORGANIZATIONS
 
 game_concept_vidvaookeyatran_scholarly_caste:90 "Сословие ученых-видваукеятранцев"
 game_concept_vidvaookeyatran_scholarly_caste_desc:90 "Высшим, окруженным благоговением и наиболее влиятельным служением в видваукеятранской вере является стезя ученого мужа. Будучи зачастую (хоть и не всегда) наделенными даром [Concept('magi','магов')|E], эти мудрецы населяют тысячи величественных [Concept('vidvakastilaya','академий, храмов и библиотек')|E] по всей [Concept('kashirya','Каширии')|E], где неустанно собирают крупицы ведения. Ибо если Сарват владеет полнотой всей мудрости, а смертным дано лишь то, чем он дозволяет поделиться, то обретение любого знания благословенно. Верующие доходят до утверждений, будто человек способен уподобиться богам, если вместит в себя все сущее; жрецы веками спорят, был ли Сарват предвечным богом или же человеком, вознесшимся по этой стезе.\n\nИ пусть сие сословие служит столпом общества, обогатив науку, культуру и философию Каширии великими открытиями, именно его стоит «благодарить» (хоть ученые и яростно отвергают сию вину) за [Concept('chan_skorpokaipis','бесчисленные апокалипсисы')|E], едва не погубившие мир."
 
 #CHARACTERS
 
 game_concept_saru:90 "Сару"
 game_concept_saru_desc:90 "Сару — аристайканский книжник VII века, посеявший великое смятение в жреческой среде своим учением о «несостоятельности знания». Он проповедовал, будто смертные в гордыне своей принципиально не способны познать истину, ибо отсутствие божественной сути означает отсутствие универсальной правды, а следовательно, ценность любых изысканий ничтожна, и тратить на них земной век бессмысленно. Разумеется, грядущие поколения мудрецов быстро парировали сие утверждение, заявив, что невозможно доподлинно знать, будто знание невозможно, равно как невозможно знать, что богов нет, как и невозможно знать, нельзя ли это познать, и так далее до бесконечности."
 
 game_concept_vidvakastilaya:90 "Видвакастилайя"
 game_concept_vidvakastilaya_desc:90 "Под именем Видвакастилайи известны тысячи академий, библиотек и храмов-цитаделей видваукеятранской веры. Крупнейшие из этих чертогов служат средоточием [Concept('vidvaookeyatran_scholarly_caste','ученой')|E] власти и диктуют волю правителям [Concept('kashirya','Каширии')|E]. Всякое великое новшество в каширийских науках и чародействе рождается в стенах этих цитаделей. Союз со знатной Видвакастилайей дарует государю великую магическую, духовную и светскую силу. Однако книжники имеют пагубную привычку сеять хаос на подвластных землях ради своих изысканий, что вызывает лютую ненависть у простого люда."
 
 game_concept_toragei_mahratian:90 "Торагей-хатан"
 game_concept_toragei_mahratian_desc:90 "Торагей-хатан был единственным ребёнком наложницы Урду из шатра [Concept('otachedian_empire','Отачеда')|E], явившись на свет спустя почти год после кончины великого завоевателя в 318 году от основания империи. Пораженный черным недугом [Concept('gedeora','гедеоры')|E] еще во чреве матери, Торагей родился безглазым — там, где надлежит быть очам, была лишь сплошная кожа да кость. И все же он зрил, охотился и вел полки не хуже любого зрячего мужа.\n\nОтвергнутый отачедской знатью из-за сомнений в его происхождении, Торагей был изгнан со двора и покинул пределы империи, влача суровый век наемника и искателя приключений за границами [Concept('kashirya','Каширии')|E]. Лишь в огне Войны пяти братьев он, ставший к тому времени грозным предводителем наемных когорт, был призван Байтором, дабы помочь тому сокрушить братьев и взойти на престол.\n\nПосле катастрофы [Concept('bayyuralar','Байюралара')|E] и гибели Байтора Торагей сплотил клан своей матери и повел их через [Concept('kasiryat_biozone','Кашириятский')|E] край в Амагею, мечом завоевав новое царство для своего племени."
 
 game_concept_toragei_kikarsag:90 "Торагей-хатир"
 game_concept_toragei_kikarsag_desc:90 "Торагей-хатир был единственным ребёнком наложницы Урду из шатра [Concept('otachedian_empire','Отачеда')|E], явившись на свет спустя почти год после кончины великого завоевателя в 318 году от основания империи. Пораженный черным недугом [Concept('gedeora','гедеоры')|E] еще во чреве матери, Торагей родился безглазым — там, где надлежит быть очам, была лишь сплошная кожа да кость. И все же он зрил, охотился и вел полки не хуже любого зрячего мужа.\n\nОтвергнутый отачедской знатью из-за сомнений в его происхождении, Торагей был изгнан со двора, найдя со временем приют среди обособленных племен кикарсаг, кои узрели в его безглазии знак божьего благословения. Ольтенские родичи, и без того взиравшие на кикарсаг с враждой, сочли укрывательство изгнанника предлогом для резни, что вынудило кикарсаг — а с ними и Торагея — спасаться бегством.\n\nВ последующие десятилетия Торагей встал во главе племен и провел их через Айроной во [Concept('the_continent','Внутренние земли континента')|E], добыв кикарсаг приют для расселения, но невольно подставив их под первые удары грядущих [Concept('kartharadd','Картараддских войн')|E]."
 
