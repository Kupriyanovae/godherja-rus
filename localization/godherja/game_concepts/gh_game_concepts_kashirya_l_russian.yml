 game_concept_gudugwrat:90 "Гудугврат, Буря-отступница"
 game_concept_gudugwrat_desc:90 "Гудугврат, именуемый Бурей-отступницей, — колоссальный ураган, безжалостно терзающий Каширийский залив. Он зарождается в самом сердце вод и медленно закручивается спиралью к побережью. Его иссиня-фиолетовые тучи несут яростные ветры, крупный град и грозы, способные стирать с лица земли целые веси. Стихия бушует от нескольких дней до нескольких недель, сокрушая берег каждые два-три года. Когда Гудугврат подступает, море отступает, обнажая дно. Отчаянные смельчаки часто снаряжают экспедиции в самое сердце бури ради сбора затерянных сокровищ глубин или добычи [Concept('wratcrystals','врат-кристаллов')|E], пока бездна не поглотила их вновь."
 
 game_concept_wratcrystals:90 "Врат-кристаллы"
 game_concept_wratcrystals_desc:90 "Врат-кристаллы рождаются в ярости бури [Concept('gudugwrat','Гудугврат')|E], когда ее мощные молнии бьют в прибрежные пески, оставляя после себя искрящиеся первозданной силой магические осколки. Будучи крайне нестабильными, эти камни доставляются в академию Чандамарун, где ученые очищают их для проведения ритуалов. Добыча врат-кристаллов смертельно опасна, ибо требует похода в самое сердце шторма, где искателей подстерегают удары молний, магический мор и проклятые твари, бродящие по обнаженному морскому дну."
 
 game_concept_87_theses:90 "Восемьдесят семь тезисов Ширамаха"
 game_concept_87_theses_desc:90 "Написанные знаменитым ученым-[Concept('magi','магом')|E] Ширамахом, его «Восемьдесят семь тезисов о природе познания и опровержении эмпирической мысли» представляют собой свод трактатов, нанесших сокрушительный удар по господствующей эмпирической школе [Concept('magic','магии')|E]. Ширамах разделил ведение на два вида — смертное, чисто рассудочное знание, и божественное, оракульское прозрение, — подтвердив свои слова сотворением невиданных ранее заклинаний прорицания.\n\nЕще одним зерном раздора в сих эссе стал его отказ от веры в то, что смертный способен достичь божественности одним лишь накоплением знаний. Он утверждал, что человеческий разум слаб, подвержен забвению и должен быть перекован медитацией и чарами, прежде чем сможет удержать в себе суть вселенной. «Восемьдесят семь тезисов» легли в основу каширийской магической теории, заложив фундамент для школы Оракульской магии."
 
 game_concept_virlanic_splendor:90 "Вирланское великолепие"
 game_concept_virlanic_splendor_desc:90 "Среди народа вирлани достоинство мужа измеряется обилием заморских артефактов в его личных чертогах. Выставлять пред почетными гостями изделия здешних мастеров почитается за бесчестие, а вирланский тактей, не собравший коллекции чужеземных диковин, никогда не признается мастером, достойным имперской службы."