 game_concept_mothers_and_fathers:0 "Матери и отцы"
 game_concept_mothers_and_fathers_desc:0 "В обычаях обитателей кланов «Матери и отцы» означают собрание обрядов и священных действ племен, кои сохранились сквозь века как живая память и повесть об их прошлом. Сии истории собираются, как правило, в виде песен и передаются от отцов к детям ради защиты как своего наследия, так и Круга Лесного — веры в то, что вечевое шествие и переходы великих лесов и их обитателей нужны как глоток воздуха для спасения рода людского. Все живое однажды умрет и возродится, а леса — лишь одна из скреп, поддерживающих непрерывное движение сего круга. Люди должны делать все возможное, дабы помогать лесу, и потому многие избирают самые разные пути для сего: от сложения песен до соблюдения строгих запретов в пище и строительстве изб."