 game_concept_mothers_and_fathers:0 "Матери и отцы"
 game_concept_mothers_and_fathers_desc:0 "В традициях клановцев «Матери и отцы» — это совокупность обрядов и обычаев племён, сохранившихся на протяжении веков как память об их прошлом. Эти предания обычно облекают в песни и передают из поколения в поколение, чтобы сохранить как своё наследие, так и Круг Лесной — веру в то, что перемещения великих лесов и их обитателей необходимы для дальнейшего существования человечества. Всё живое умирает и возрождается, и леса помогают поддерживать этот круговорот. Люди должны по мере сил помогать лесу, но каждый понимает эту обязанность по-своему: одни слагают песни, другие соблюдают особые ограничения в пище и строительстве."
