 game_concept_mothers_and_fathers:0 "Матери и отцы"
 game_concept_mothers_and_fathers_desc:0 "В обычаях обитателей кланов «Матери и отцы» означают совокупность ритуалов и практик племен, которые сохранились сквозь века как память и история об их прошлом. Эти истории собираются, как правило, в виде песен и передаются из поколения в поколение ради защиты как своего наследия, так и Цикла Леса — веры в то, что миграции великих лесов и их обитателей жизненно необходимы для дальнейшего существования человечества. Все живое однажды умрет и возродится, а леса — лишь одна из деталей, поддерживающих непрерывное движение этого цикла. Люди должны делать все возможное, чтобы помогать лесу, и потому многие принимают самые разные подходы к этому: от сложения песен до соблюдения строгих ограничений в пище и строительстве."