 game_concept_khuzaima_al_zuhra:0 "Хузайма аль-Зухра"
 game_concept_khuzaima_al_zuhra_desc:0 "Хузайма аль-Зухра родился в семье аль-Зухра, традиционных правителей Доззана. Будучи непреклонным [Concept('ritualism','ритуалистом')|E] софокистского толка, он возглавлял [Concept('black_confederation','Чёрную конфедерацию')|E] и ставил своей задачей вытеснение [Concept('wardenism','варденитов')|E] на восток и возвращение утраченных ритуалистских земель. Он удостоился чести стать одним из немногих по-настоящему успешных ритуалистских военачальников, и его часто сравнивали с [Concept('usun_bishabelik','Усуном Бишабеликом')|E], хотя в кругах ритуалистов это сравнение скорее показывало, кем мог бы стать Усун, не окажись он предателем.\n\nБольше всего он известен тем, что использовал и поощрял фанатичные воинские культы, в особенности спонсируя рост Затании, и назначил воина этого культа по имени [fihr_ibn_kilab_ibn_zayd|E] главным среди своих [Concept('mubaaizun','мубаризунов')|E]. В то время как Фихр завоевал репутацию непобедимого бойца и почитался как полубог, сам Хузайма славился стратегическим чутьём и умением находить таланты. Его самым успешным сражением стала [Concept('battle_of_the_mubaaizun_fix','битва мубаризунов')|E], где Фихру удалось сразить поединщиков и командующего вражеской варжденитской армии, хотя в ходе последующего боя Хузайма был сброшен с коня и так сильно сломал ногу, что до конца дней ходил с хромотой. Одержав ещё несколько побед, он двинулся на освобождение города Сулеймания от варденитского владычества, чтобы вернуть его сулейманитским правителям. Однако во время [Concept('battle_of_sulaymaniyan_fix','битвы при Сулейманияне')|E] он был ранен в горло варденитским лучником, которого звали Хазиз ибн Карех.\n\nПосле его гибели Фихр скончался от горя или пал на собственный меч, а остальные мубаризуны Хузаймы погибли в бою. Сын Хузаймы, [abd_hubar_ibn_khuzaima], поклялся убить тысячу варденитов, чтобы отомстить за отца."
 
 game_concept_fihr_ibn_kilab_ibn_zayd:0 "Фихр ибн Килаб ибн Зайд"
 game_concept_fihr_ibn_kilab_ibn_zayd_desc:0 "Фихр ибн Килаб ибн Зайд был [Concept('ritualism','ритуалистским')|E] [Concept('mubaaizun','мубаризуном')|E], родившимся в Рафхаме в 633 году от И.С. в секте Затания. Он сражался в качестве поединщика [Concept('khuzaima_al_zuhra','Хузаймы аль-Зухры')|E] и был главным среди его мубаризунов, заслужив славу непобедимого воителя. Согласно официальным ритуалистским хроникам, Фихр родился у Килаба ибн Зайда, фанатика из Затании, хотя его мать неизвестна. Он много воевал на стороне ритуалистской коалиции Хузаймы аль-Зухры против [Concept('wardenism','варденитов')|E]; будучи мубаризуном Хузаймы, он сразил бесчисленное множество варденитских поединщиков в одиночных дуэлях. Перед каждой битвой он, по преданиям, взывал к силе Затанаи и джиннов, чтобы те даровали ему победу и неуязвимость.\n\nСамым триумфальным сражением Фихра стала [Concept('battle_of_the_mubaaizun_fix','битва мубаризунов')|E], где он убил варденитского командующего и пятерых его мубаризунов подряд, когда каждый из них выходил отомстить за своего командира и павших соратников. Побеждая в каждой дуэли, в которой он участвовал, Фихр вскоре стал почитаться своими братьями по Затании как полубог, во что со временем поверил и сам. Этот статус полубога был формально закреплен малайком аль-Мукарридасом Зайдом аль-Таубом, который также официально одобрил его культ Фихрия. Хотя он ни разу не потерпел поражения в поединке, Фихр погиб вместе с Хузаймой аль-Зухрой в [Concept('battle_of_sulaymaniyan_fix','битве при Сулейманияне')|E], когда его господин был сражен стрелой и испустил дух. Ритуалистский романтизм гласит, что он умер от горя, однако варденитские хроники утверждают, что он пал на собственный меч. Так или иначе, вскоре после этого он был обожествлен последователями Затании под именем Илах аль-Хубар.\n\nХотя в истории Фихра трудно отделить факты от вымысла или предвзятости, современные ученые полагают, что в общих чертах это повествование правдиво."
 
 game_concept_abd_hubar_ibn_khuzaima:0 "Абд-Хубар ибн Хузайма"
 game_concept_abd_hubar_ibn_khuzaima_desc:0 "Абд-Хубар ибн Хузайма был сыном и наследником [khuzaima_al_zuhra|E], а впоследствии стал патриархом семьи аль-Зухра. Имя, означающее «Раб войны», было выбрано его отцом, поскольку тот намеревался вырастить из него воина такого же уровня, как [fihr_ibn_kilab_ibn_zayd|E], у которого мальчик обучался в качестве оруженосца. Будучи ребенком, он сопровождал отца в походах, чтобы постичь искусство командования, но перед [Concept('battle_of_sulaymaniyan_fix','битвой при Сулейманияне')|E] был отослан в родовую твердыню Доззан.\n\nПосле гибели отца он принес клятву уничтожить тысячу [Concept('wardenism','варденитов')|E], чтобы отомстить за Хузайму, а также никогда не жениться и не радоваться жизни, пока месть не свершится. Возглавив [Concept('black_confederation','Чёрную конфедерацию')|E] в возрасте 18 лет, он вел коалицию против Халида аль-Асира и других варденитскиз владык в кампании, длившейся с 658 по 668 год, пока не был загнан в угол в Доззане Халидом аль-Асиром и соперничающей коалицией варденитов. Как варденитские, так и [Concept('ritualism','ритуалистские')|E] исторические хроники гласят, что он сразился с Халидом аль-Асиром в поединке и убил его, равно как и трех других лордов, после чего отступил в свой замок и покончил с собой, предварительно лишив жизни женщин своей семьи, дабы уберечь их от пленения."
 
