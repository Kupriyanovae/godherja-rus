 game_concept_khuzaima_al_zuhra:0 "Хузайма аль-Зухра"
 game_concept_khuzaima_al_zuhra_desc:0 "Хузайма аль-Зухра рожден был в колене аль-Зухра, исконных владык Доззана. Будучи твердым [Concept('ritualism','ритуалистом')|E] софокистского толка, он сплотил и возглавил [Concept('black_confederation','Чёрную конфедерацию')|E], порешив вытеснить [Concept('wardenism','варденитов')|E] далече на восток и воротить отнятые ритуалистские вотчины. Ему выпала честь стать одним из немногих по-настоящему удачливых ритуалистских воевод, отчего его имя часто ставили вровень с [Concept('usun_bishabelik','Усуном Бишабеликом')|E], хотя в кругах ревнителей веры сие сравнение лишь являло, каких высот мог бы достичь Усун, не окажись он гнусным переметчиком.\n\nБолее всего Хузайма прославился тем, что привечал и растил яростные воинские братства, паче иных помогая укреплению Затании, и поставил воителя сей общины по имени [fihr_ibn_kilab_ibn_zayd|E] старшим над своими [Concept('mubaaizun','мубаизунами')|E]. И пока Фихр стяжал славу непобедимого бойца, коего чтили чуть не за полубога, сам Хузайма славился ратным чутьем да умением подмечать таланты. Самым славным его делом стала [Concept('battle_of_the_mubaaizun_fix','битва мубаризунов')|E], где Фихр саморучно сразил в поединках лучших бойцов и воеводу вражьей варденитской рати, хотя в последовавшей затем сече Хузайма был сбит с коня и столь жестоко переломал ногу, что до конца дней своих остался хром. Одержав еще несколько побед, он двинул полки ради вызволения града Сулеймания из-под варденитского ига, дабы вернуть его сулейманитским князьям. Однако в ходе [Concept('battle_of_sulaymaniyan_fix','битвы при Сулейманияне')|E] он был ранен в горло варденитским лучником по имени Хазиз ибн Карех.\n\nЕдва господин испустил дух, Фихр умер от великого горя либо пал на собственный меч, а прочие мубаизуны Хузаймы полегли в том же бою. Сын Хузаймы, [abd_hubar_ibn_khuzaima], поклялся изрубить тысячу варденитов, дабы отмстить за кровь отца."

 game_concept_fihr_ibn_kilab_ibn_zayd:0 "Фихр ибн Килаб ибн Зайд"
 game_concept_fihr_ibn_kilab_ibn_zayd_desc:0 "Фихр ибн Килаб ибн Зайд был [Concept('ritualism','ритуалистским')|E] [Concept('mubaaizun','мубаизуном')|E], рожденным в Рафхаме в 633 году от И.С. в общине Затания. Он ходил на поединки как первый боец [Concept('khuzaima_al_zuhra','Хузаймы аль-Зухры')|E] и был старшим среди его мубаризунов, заслужив славу непобедимого ратника. Согласно воеводским спискам ритуалистов, Фихр был сыном Килаба ибн Зайда, неистового ревнителя Затании, мать же его в книгах не помянута. Он много бился на стороне ритуалистского ратного союза Хузаймы аль-Зухры против [Concept('wardenism','варденитов')|E]; будучи мубаризуном Хузаймы, он поверг без счета варденитских поединщиков в честных дуэлях. Перед всякой сечей он, по преданиям, взывал к силе Затанаи и джиннов, дабы те одарили его победой и заговорили от ран.\n\nСамой триумфальной сечей Фихра стала [Concept('battle_of_the_mubaaizun_fix','битва мубаризунов')|E], где он уложил варденитского воеводу и пятерых его лучших мубаризунов подряд, когда те один за другим выходили мстить за своего вождя и павших побратимов. Побеждая в каждом единоборстве, Фихр вскоре стал почитаться братьями по Затании как полубог, во что со временем уверовал и сам. Сие высокое звание было твердо закреплено малайком аль-Мукарридасом Зайдом аль-Таубом, коего волею был одобрен и сам толк Фихрия. Хотя он ни разу не уступил в поединке, Фихр погиб вместе с Хузаймой аль-Зухрой в [Concept('battle_of_sulaymaniyan_fix','битве при Сулейманияне')|E], когда его господин был пронзен стрелой и испустил дух. Ритуалистские сказания поют, что он умер от разбитого сердца, однако варденитские летописи уверяют, будто он пал на собственный клин. Так или иначе, вскоре после кончины он был обожествлен последователями Затании под именем Илах аль-Хубар.\n\nИ хотя в житии Фихра трудно отделить правду от вымысла или пристрастных речей, нынешние ученые мужи полагают, что в главных чертах сие повествование истинно."

 game_concept_abd_hubar_ibn_khuzaima:0 "Абд-Хубар ибн Хузайма"
 game_concept_abd_hubar_ibn_khuzaima_desc:0 "Абд-Хубар ибн Хузайма был сыном и преемником [khuzaima_al_zuhra|E], а впоследствии стал патриархом клана аль-Зухра. Имя, что в переводе значит «Раб войны», было выбрано его отцом, ибо тот чаял вырастить из отрока великого ратника под стать [fihr_ibn_kilab_ibn_zayd|E], у коего мальчик и обучался, ходя в оруженосцах. Будучи ребенком, он следовал за отцом в походах, дабы постичь воеводское ремесло, но перед [Concept('battle_of_sulaymaniyan_fix','битвой при Сулейманияне')|E] был отослан в родовую твердыню Доззан.\n\nПосле гибели отца он принес клятву извести тысячу [Concept('wardenism','варденитов')|E], дабы отомстить за Хузайму, а также никогда не брать жен и не ведать радости жизни, пока месть не свершится. Возглавив [Concept('black_confederation','Чёрную конфедерацию')|E] в возрасте восемнадцати лет, он вел ратный союз против Халида аль-Асира и прочих варденитских владык в походах, длившихся с 658 по 668 год, пока не был зажат в угол в Доззане Халидом аль-Асиром и вражьей ратью варденитов. Как варденитские, так и [Concept('ritualism','ритуалистские')|E] летописи гласят, что он сошелся с Халидом аль-Асиром в поединке и сразил его, равно как и трех других лордов, после чего укрылся в своем замке и лишил себя жизни, сперва предав смерти женщин своего рода, дабы уберечь их от позорного пленения."
 
