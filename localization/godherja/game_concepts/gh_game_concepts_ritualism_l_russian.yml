 game_concept_black_confederation:0 "Чёрная конфедерация"
 game_concept_black_confederation_desc:0 "Чёрная конфедерация была ратным союзом [Concept('ritualism','ритуалистов')|E], созданным и ведомым [khuzaima_al_zuhra|E] ради изгнания [Concept('wardenism','варденитов')|E] из пределов [Concept('sarradon','Саррадона')|E]. Свое прозвание она получила из-за черных стягов, кои вздымал над полками клан аль-Зухра. Союз яростно оспаривал варденитское владычество в Саррадоне и стал одним из самых удачливых ритуалистских объединений.\n\nДобившись успеха в [Concept('battle_of_the_mubaaizun_fix','битве мубаизунов')|E], Хузайма аль-Зухра двинул силы Чёрной конфедерации против варденитского вождя Халида аль-Асира в [Concept('battle_of_sulaymaniyan_fix','битве при Сулейманияне')|E] в 658 году от И.С., где Хузайма был ранен в горло и пал. Чёрная конфедерация едва не рассыпалась в прах, но перешла под руку наследника Хузаймы, [abd_hubar_ibn_khuzaima|E]. Он привел рать к победе над Халидом аль-Асиром в 660 году от И.С., однако потерпел сокрушительные поражения в 663 и 665 годах, окончательно прекратив существование к 668 году со смертью Абд-Хубара ибн Хузаймы."
 
