 game_concept_ritualist:0 "Ритуалист"
 game_concept_sophocoist:0 "Софокист"
 game_concept_sophocoism:0 "Софокизм"
 game_concept_ritualism_desc:0 "Ритуализм (также ведомый как софокизм) — одно из двух главных исторических верований в [Concept('sarradon','Саррадоне')|E] (наряду с их извечными недругами, [Concept('wardenism','варденитами')|E]), кое повсеместно признают старейшей из живых вер в подлунном мире. Она зиждется вокруг почитания 1001 Ступени [GetBuilding('01_sophocos').GetName] — великой лестницы, ведущей к колоссальной и безмолвной [Concept('the_towers','Башне')|E] в сердце Саррадона. Единственное, в чем согласны склонные к раздорам ритуалисты — это то, что вера их пошла от, станется, мифического восхождения нескольких паломников по сим ступеням, где на каждом шагу они встречали новое испытание, а некий Ангел давал им жизненный урок, помогавший подыматься далее.\n\nБыло ли то странствие взаправду, участвовал ли в нем ангел или сам бог, является ли башня земной твердыней или лишь притчей, много ли богов в сей вере или нет, есть ли в ней ангелы и кем суть сии ангелы или божества — людьми, вышней силой, ставшими вышней силой мудрецами или духами природы — все сие горячо оспаривается сотнями враждующих толков. Они то и дело доходят до резни из-за столь малых вопросов, как то, было ли поучение о наливании чая буквальным, или же чай знаменует скрытое стремление людское к познанию третьей руки сорока семи богов песка и луны (как проповедует община махадакистов, коя прославилась тем, что вырезала общину лулавадитов, согласную с ними абсолютно во всем, за вычетом того, что те сорок те богов на самом деле были богами песка и солнца).\n\nВ ученых кругах вечно ведутся яростные споры о том, является ли варденизм, наряду с десятками других крупных саррадонских верований, отдельной религией, или же это просто еще один ритуалистский толк, отколовшийся от общего древа."
 
