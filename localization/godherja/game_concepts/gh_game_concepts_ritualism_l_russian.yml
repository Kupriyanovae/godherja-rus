 game_concept_black_confederation:0 "Чёрная конфедерация"
 game_concept_black_confederation_desc:0 "Чёрная конфедерация была союзом [Concept('ritualism','ритуалистов')|E], созданным и возглавляемым [khuzaima_al_zuhra|E] ради изгнания [Concept('wardenism','варденитов')|E] из [Concept('sarradon','Саррадона')|E]. Она получила свое название из-за черных знамен, которые использовал клан аль-Зухра. Конфедерация яростно оспаривала варденитское господство в Саррадоне и стала одним из самых успешных ритуалистских объединений.\n\nДобившись успеха в [Concept('battle_of_the_mubaaizun_fix','битве мубаризунов')|E], Хузайма аль-Зухра повел Чёрную конфедерацию против варденитского лидера Халида аль-Асира в [Concept('battle_of_sulaymaniyan_fix','битве при Сулейманияне')|E] в 658 году от И.С., где Хузайма был ранен в горло и погиб. Чёрная конфедерация едва не распалась, но перешла под начало наследника Хузаймы, [abd_hubar_ibn_khuzaima|E]. Он привел Конфедерацию к победе над Халидом аль-Асиром в 660 году от И.С., однако потерпел сокрушительные поражения в 663 и 665 годах, окончательно прекратив существование к 668 году со смертью Абд-Хубара ибн Хузаймы."
 
