 game_concept_ritualism:0 "Ритуализм"
 game_concept_ritualists:0 "Ритуалисты"
 game_concept_ritualist:0 "Ритуалист"
 game_concept_sophocoist:0 "Софокист"
 game_concept_sophocoism:0 "Софокизм"
 game_concept_ritualism_desc:0 "Ритуализм (также известный как софокизм) — одна из двух основных исторических религий в [Concept('sarradon','Саррадоне')|E] (наряду с их соперниками, [Concept('wardenism','варденитами')|E]), которую повсеместно признают старейшей из практикуемых вер в известном мире. Она сосредоточена вокруг поклонения 1001 Ступени [GetBuilding('01_sophocos').GetName] — лестницы, ведущей к колоссальной и неактивной [Concept('the_towers','Башне')|E] в центре Саррадона. Единственное, в чем сходятся склонные к усобицам ритуалисты — это то, что их вера основана на, возможно, мифическом восхождении нескольких паломников по этим ступеням, где на каждом шагу они сталкивались с новым испытанием, а некий Ангел преподавал им жизненный урок, помогавший двигаться дальше.\n\nДействительно ли имело место это путешествие, принимал ли в нем участие ангел или бог, является ли башня материальной или метафорической, много ли богов в этой религии или нет, есть ли в ней ангелы, и кем являются эти ангелы или божества — людьми, высшей силой, ставшими высшей силой людьми, силами природы и так далее — все это горячо обсуждается сотнями соперничающих сект. Они регулярно доходят до кровопролития из-за столь базовых вопросов, как то, был ли пассаж о наливании чая буквальным или же чай символизирует скрытое стремление человечества к познанию третьей руки сорока семи богов песка и луны (как проповедует секта махадакистов, которая прославилась тем, что вырезала секту лулавадитов, согласную с ними абсолютно во всем, за исключением того, что те сорок семь богов на самом деле были богами песка и солнца).\n\nВ ученых кругах ведутся яростные споры о том, является ли варденизм, наряду с десятками других крупных саррадонских верований, самостоятельной религией или же это просто ещё одна ритуалистская секта, отколовшаяся от общего древа."
 
