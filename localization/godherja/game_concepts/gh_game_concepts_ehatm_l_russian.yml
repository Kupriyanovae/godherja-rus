l_russian:  
 game_concept_ehatm_sister_mother:0 "Сестра-Мать"
 game_concept_ehatm_sister_mother_desc:0 "Божества э’хатм, ведомые как Сестра-Мать — это Корихот и Корикет, сестра рода людского и мать рода людского, кои суть отдельные создания и в то же время два нераздельных лика единого божества. Корикет, приняв обличье солнца, сотворила бескрайнее море, после чего явила на свет свою дочь Корихот (коя принимает обличье [Concept('aervalr','Аэрвала')|E]). Корихот подняла сушу из морских глубин, дабы они могли разделить свое творение, а Корикет, пожелав, чтобы у ее дочери была компания, когда сама она уходит на другую сторону земли, создала всю жизнь и позволила Корихот оберегать живых существ ночью, пока сама она делает то же днем."

 game_concept_warrior_women_ehatm:0 "Воительницы э’хатм"
 game_concept_warrior_women_ehatm_desc:0 "Дочери корабельного люда э’хатм, где правят жены, некогда были известны как наводящие ужас морские разбойники, кои держали в страхе ход купеческих ладей по всему югу и совершали набеги даже на земли [Concept('aversaria','Аверсарии')|E] еще до ее основания. По понятиям э’хатм, именно женщины властвуют над волнами, поскольку те были сотворены богинями, в то время как мужам надлежит охранять сушу, дабы жены могли без помех добывать дары моря. По сей причине ватаги большинства разбойничьих судов э’хатм целиком состояли из воительниц, что легло в основу множества преданий, повлиявших впоследствии на стародавние песни и сказы Аверсарии и многих других земель."