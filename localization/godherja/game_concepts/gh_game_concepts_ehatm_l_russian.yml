l_russian:  
 game_concept_ehatm_sister_mother:0 "Сестра-Мать"
 game_concept_ehatm_sister_mother_desc:0 "Божества э’хат’м, известные как Сестра-Мать — это Корихот и Корикет, сестра человечества и мать человечества, которые являются отдельными сущностями и в то же время двумя ипостасями единого божества. Корикет, приняв облик солнца, сотворила бескрайнее море, после чего явила на свет свою дочь Корихот (которая принимает облик [Concept('aervalr','Эрвальра')|E]). Корихот подняла сушу из морских глубин, дабы они могли разделить свое творение, а Корикет, пожелав, чтобы у ее дочери была компания, когда сама она уходит на другую сторону планеты, создала всю жизнь и позволила Корихот оберегать живых существ ночью, пока сама она делает это днем."
  
 game_concept_warrior_women_ehatm:0 "Воительницы э’хат’м"
 game_concept_warrior_women_ehatm_desc:0 "Представительницы матриархальной мореходной культуры э’хат’м некогда были известны как наводящие ужас пираты, которые угрожали судоходству по всему югу и совершали набеги даже на земли [Concept('aversaria','Аверсарии')|E] ещё до ее основания. По представлениям э’хат’м, именно женщины властвуют над морями, поскольку те были сотворены богинями, в то время как мужчинам надлежит охранять сушу, дабы женщины могли беспрепятственно добывать дары моря. По этой причине команды большинства пиратских судов э’хат’м целиком состояли из воительниц, что легло в основу множества преданий, повлиявших впоследствии на мифологию Аверсарии и многих других культур."