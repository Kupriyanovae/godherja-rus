 game_concept_peculiar_compromise_sunarwei:0 "Сунарвейский компромисс аагиократии"
 game_concept_peculiar_compromise_sunarwei_desc:0 "Хотя то, что у аверсарианцев не оказалось превозносимых повсюду [Concept('magi','магов')|E], видится противным самому стремлению [Concept('aversaria','Аверсарии')|E] держать все в кулаке, разбор дел и споров земных в Айроне к началу аверсарианских трудов по слиянию вер делает корни сего дела куда яснее. Невзирая на союз аверсарианцев с ольтенами, среди знатных мужей царил лютый страх перед возможной изменой или нежданными ударами, из-за чего ольтенские всадники могли либо перерезать сухопутные торговые пути, идущие на полудень через сунарвейские земли, либо и вовсе разорить весь юг до того, как Аверсария успеет созвать свои рати, что раскололо бы наместничество надвое. Посему от стародавних [Concept('destruction_is_creation','непротивлений и мирных поучений')|E] пришлось отказаться ради выгоды."
 
 #GODS

 game_concept_destruction_is_creation:0 "Уничтожение осколков Кумханта есть созидание"
 game_concept_destruction_is_creation_desc:0 "Ради сего дела аверсарианцы усердно сеяли веру в то, что, пусть всякая живая душа и впрямь есть лишь стеклянный осколок бога Кумханта, изведение одних осколков просто дает начало новым. Подобно тому, как павший зверь кормит собою землю под ним, убиение можно почитать просто за рождение новой жизни. И пусть сие учение вяжется с остальным сунарвейским словом весьма спорно, последователи сей переделанной на аверсарианский лад веры искони составляли ядро и костяк всяких южных ратей да часто нанимались на службу в чужие земли."

