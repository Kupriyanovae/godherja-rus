 game_concept_peculiar_compromise_sunarwei:0 "Сунарвейский компромисс агиократии"
 game_concept_peculiar_compromise_sunarwei_desc:0 "Хотя отсутствие превозносимых [Concept('magi','магов')|E] аверсарианцев кажется противоречащим стремлению Аверсарии к контролю, изучение политической ситуации в Айроне на момент начала аверсарианских усилий по синкретизму делает причины куда более очевидными. Несмотря на союз аверсарианцев с ольтенами, среди знати царил сильный страх перед возможным предательством или непредсказуемыми действиями, из-за чего ольтенские всадники могли либо поставить под угрозу сухопутные торговые пути, идущие на юг через сунарвейские земли, либо и вовсе сокрушить юг до того, как Аверсария успеет мобилизоваться, что раскололо бы наместничество пополам. Так что от [Concept('destruction_is_creation','пацифистских верований')|E] пришлось избавиться."
 
 #GODS

 game_concept_destruction_is_creation:0 "Уничтожение осколков Кумханта есть созидание"
 game_concept_destruction_is_creation_desc:0 "С этой целью аверсарианцы поощряли веру в то, что, хотя все живые существа действительно являются стеклянными осколками бога Кумханта, уничтожение одних осколков просто создает новые. Подобно тому, как павшее животное дает жизнь земле под собой, уничтожение можно рассматривать просто как сотворение новой жизни. Хотя это согласуется с остальной сунарвейской догмой весьма спорно, последователи подвергшейся аверсарианизации веры исторически составляли основу большинства южных армий и часто служили наемниками за рубежом."
