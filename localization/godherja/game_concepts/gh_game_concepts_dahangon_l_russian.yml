  #EVENTS
  game_concept_ratarakaw:89 "Ратаракав"
  game_concept_ratarakaw_desc:90 "Произошедший в середине тринадцатого века от основания Орайспола, Ратаракав почитается в Дахангоне великим разором, уступающим по лютости лишь [Concept('frodbrokna','Дусапьясу')|E]. Бедствие началось с внезапного раскола полуденного неба, обнажившего безлунную пустоту, из коей на юго-восточные горы Кхарадана рухнула титаническая ограда да неведомая твердыня. Удар не только сровнял с землей гору, на кою пришелся, но и вызвал сильнейшие землетрясения, разрушившие древнюю цитадель Даванг Тармаки.\n\nСия катастрофа также положила конец почти увенчавшемуся успехом восстанию Налайкана, после того как великий вождь оказался погребен под обломками собственной крепости, что даровало столь необходимую передышку осажденному Катуни из Бронзовой Гавани."
  
