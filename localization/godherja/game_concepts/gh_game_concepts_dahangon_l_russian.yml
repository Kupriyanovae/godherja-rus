l_russian:

  game_concept_tilolan: "Tilolan System"
  game_concept_tilolan_desc: "When [naklan_the_golden|E] was crowned as the first King of all [Glossary('Dahangon','dahangon_lowlands_encyclopedia_desc')] within [GetBuilding('02_dawang_tarmak').GetName], he would demand that all local rulers, near and far, journey to his palace to practice [Glossary('tilolan', 'GH_TILOLAN_GLOSS')] and demonstrate personal loyalty. Though Naklan's realm would fracture during his heir's reign amid the Golden Thorn Rebellion, the practice would endure and be adopted more broadly across Dahangon, with nobles and warlords regularly journeying to their respective lieges to present themselves."

  game_concept_ancient_shrunfan_era: "Chailaon Migration" #[destruction_of_bhumiraja|E]
  game_concept_ancient_shrunfan_era_desc: "The Chailaon (Proto-Saielai) are thought to have arrived in Nanmay Bon some seven centuries prior to the common era, sailing along the Xuming coast and up the Kirangi River basin. For eight hundred years, the Chailaon would war with the ever-dwindling indigenous peoples of the basin, the mighty Mutande, and each other.\n\nThe seeds of the Saielaon Era would be sown in 120 IS with the Destruction of Bhumiraja and the simultaneous accession of Prince Ru in an obscure Kirangi city-state. Ru would later begin his [Concept('god_king_ru_conquest','conquest of the region')|E]."

  game_concept_god_king_ru_conquest: "Ru's Conquest"
  game_concept_god_king_ru_conquest_desc: "Upon reaching adulthood, the ambitious Ru would undertake a systematic conquest of the region, allegedly remaining undefeated throughout his seventeen years of campaigns to unite the various tribes and city-states as far as the Fengming Mountains.\n\nHe would assume the title of God-King during his reign, and following his death, the realm would revert to disunited warfare and usher in the [age_of_the_warring_cities|E]."

  game_concept_huyen_yat: "Huyên Yát"
  game_concept_huyen_yat_desc: "By the end of Ru's reign the Saielaon Kingdom had already begun to splinter, the succession fallen into open contention while the regent Suwan shored up his own authority in the capital, replacing the servants about the ever more ailing monarch with those loyal to himself. When the God-King at last died, Suwan would seal the palace and rule on in Ru's name as though he yet lived.\n\nAs rumors seeped out of the capital and the God-King's sons grew suspicious, a summons would go out in Ru's name calling them to a banquet at which the God-King would at last appear before them, though Suwan meant instead to have every prince killed. Arms being forbidden the palace, the princes came each with only a few attendants. It was there, at the feast that would be remembered as the [Glossary('Huyên Yát', 'GH_HUYEN_YAT_GLOSS')], that Suwan set upon them, though some fought their way free, and the fighting poured out into the streets and through the whole capital. So brutal was it that the sky was said to have wept, and three days and nights of rain passed before the blood was washed from the streets.\n\nWhole no longer, the Saielaon realm would scatter into as many warring city-states. Suwan did not outlive his own banquet, cut down among the very princes he had meant to kill, and when the slaughter was spent it was Ru's seventh son Sarun who held the capital, his brothers having fled beyond it. In such blood the [age_of_the_warring_cities|E] would have its beginning."

  game_concept_age_of_the_warring_cities: "Age of the Warring Cities"
  game_concept_age_of_the_warring_cities_desc: "The Age of the Warring Cities was the long period of fragmentation that followed the fall of the Saielaon Kingdom, spanning from the [huyen_yat|E] at the end of the 2nd century to the end of the 5th century IS and the subsequent subjugation of the region by [naklan_the_golden|E]. The many Saielai tribes and city-states would war ceaselessly upon one another.\n\nLittle of the age can be known with any certainty. What sparse knowledge remains is owed largely to the Kathuni scholar Tu Su, sent south in the mid-6th century by the Dragon Emperor, whose curiosity, and perhaps his wariness, had been stirred by the exploits of Naklan. From the often contradictory accounts he gathered, Tu Su would compile much of what survives of the period today."

  game_concept_age_of_strife: "Age of Strife"
  game_concept_age_of_strife_desc: "While the Banwagul tribes would fall back into their old disunity following the Golden Thorn Rebellion, three successors would emerge from the vacuum left in its wake. The Shrunfan Kingdom would come to prominence near the Fengming Mountains, and under Chan the Samoy Kingdom would unite the Kirangi River basin once more, while to the north would rise the Dolokan Kingdom of the Silangur. Their rise would prove as brief as it was great. Grown rich upon the trade out of Kathun-Kai, the Silangur would make common cause with the Samoy against the Shrunfan, yet it was their late expansion into Kathuni lands that would prove their undoing, culminating in the [yasong_incident|E].\n\nThe Samoy and Shrunfan would war on through their tributaries, though neither could break the other. The Shrunfan would later ally with various Banwagul warlords, and to fund their wars would turn ever more to piracy, preying upon the sea trade out of Kathun-Kai and the [pirate_coast|E].\n\nAs with the Silangur before them, such provocation would draw the enmity of Kathun-Kai, which would lead to the [great_western_march|E] and the fall of the Shrunfan Kingdom in 722 IS."

  game_concept_yasong_incident: "Yasong Incident"
  game_concept_yasong_incident_desc: "As the Dolokan kings bound themselves ever closer as tributaries to the Dragon Emperor, resentment would fester among the tribal Silangur elite. When the king Sorimang died prematurly, the realm passed to his infant son Palgun. His advisor Rithisak, backed by the greater part of the tribal elite, would rise against the ruling house, and meeting little resistance would seize the capital.\n\nUpon reaching the young king's chamber, Rithisak's men found their way barred by Ye Hu, envoy of Kathun-Kai. Fearing that any delay might undo him, Rithisak bid his men cut down the envoy and all his company, and Ye Hu was slain along with his twenty-one attendants. The child Palgun was strangled where he lay.\n\nWhen word of the slaughter reached the Dragon Emperor, Kathun-Kai would march in fury and put an end to the Dolokan Kingdom, its lands passing under Kathuni rule with the establishment of the [military_protectorate_of_the_silangur_highlands|E]."

  game_concept_renshen_calamity: "Renshen Calamity"
  game_concept_renshen_calamity_desc: "While the Silangur were defeated at the [battle_of_balinbada|E], a magical phenomenon of uncertain origin would simultaneously descend upon the capital of the Dolokan Kingdom. Within the span of a few hours a dark cloud would cover the whole city, and purple lightning would rain down, toppling much of its walls and killing many of its people.\n\nThe Kathuni would attribute it to the Dragon Emperor, while Aversarian scholars would later favor a [gedeora|E] of great might. Whatever the truth, the Silangur were left defenseless, their capital shattered and no longer a refuge to which they could retreat."

  game_concept_battle_of_balinbada: "Battle of Balinbada"
  game_concept_battle_of_balinbada_desc: "The Battle of Balinbada was the decisive engagement of the Kathuni campaign that followed the [yasong_incident|E] to pacify the Silangur. Meng Zhao, inexperienced and recently appointed to head the campaign, would there prove his military genius, beginning his long career in service of the Dragon Emperor.\n\nFinding the Silangur arrayed upon the high ground, he would feign a broken retreat, drawing them down from the heights in headlong pursuit, then turn upon them on the open ground below, where his ranks held and closed about them. The Silangur, routed, would fall back upon their capital, harried the whole way by the Kathuni host, discovering their capital partially destroyed and unable to give further battle, would yield. With their submission the Military Protectorate of the Silangur Highlands would be established over the Dolokan Kingdom."

  game_concept_military_protectorate_of_the_silangur_highlands: "Military Protectorate of the Silangur Highlands"
  game_concept_military_protectorate_of_the_silangur_highlands_desc: "The Military Protectorate of the Silangur Highlands, later renamed Protectorate of the Southlands, was established by Kathun-Kai to protect its interest in Nanmay Bon.\n\nIn response to the [yasong_incident|E] and the recent Silangur incursions into tributary lands, the Dragon Emperor would order the conquest and complete subjugation of the Silangur. Rithisak would gather an army in answer, and even seek alliance with the Shrunfan Kingdom, only to be refused.\n\nHe would be defeated at the [battle_of_balinbada|E], and the region in time fully conquered. There the Kathuni would establish the Military Protectorate of the Silangur Highlands, under the direct appointment of [loen_chaeon|E] and charged with safeguarding the interests of Kathun-Kai."

  game_concept_great_western_march: "Great Western Campaign"
  game_concept_great_western_march_desc: "The Great Western March was the early 8th century campaign waged by the Military Protectorate of the Silangur Highlands out of [Glossary('Dahangon','dahangon_lowlands_encyclopedia_desc')] to subdue the Saielai and secure the very lucrative trade between the [pirate_coast|E] and Kathun-Kai.\n\nThe independence of the Saielai would end with the fall of the Shrunfan Kingdom in 722 IS. The city of [Concept('bureau_bronzeport','Bronzeport')|E] would later be established on the southern coast of Dahangon, and the Military Protectorate, renamed the Protectorate of the Southlands under its first ruler Yao Qingxian, would become the kathuni colonial authority over the southern regions of Nanmay Bon and Dahangon."

  #CHARACTERS
  game_concept_nari_daya:89 "Нари Дайя"
  game_concept_nari_daya_desc:89 "Легендарная королева-воительница дайарков, Дайя была старшей дочерью [Concept('naklan_the_golden','Наклана Золотого')|E] и служила одним из его главных думных мужей да верных ближников во время покорения Дахангона. Честолюбивая и умелая в ратном деле, принцесса оспорила восшествие своего племянника на престол после кончины Наклана, провозгласив себя Нари (королевой) и ввергнув дахангонские земли в пучину междоусобной войны.\n\nОднако, несмотря на всю свою доблесть, Нари Дайя не смогла занять стол, так как большинство вассалов ее родителя ополчились против нее за попрание заветов предков. Опасаясь погибели в долгой войне на измор, она вместо этого выкроила себе владение в горах Кхарадана, где вместе со своими самыми ревностными последователями основала гордое женское царство под рукой владычицы."

  game_concept_naklan_the_golden:89 "Наклан Золотой"
  game_concept_naklan:89 "Наклан"
  game_concept_naklan_the_golden_desc:89 "Почти мифический правитель Дахангона, Наклан Золотой знаменит тем, что сплотил разрозненные племена Банвагула в единое сильное царство.\n\nСтав героем множества сказаний, Наклан, как утверждается, воздвиг золотую цитадель Даванг Тармаки за один-единственный день, в коем уместились две ночи, а также якобы обрел бессмертие, совершив омовение в священной реке жизни.\n\nПосле правления, длившегося сто лет (а в некоторых песнях — и целую тысячу), Наклан, как глаголют, прошел путь к великому могуществу, после чего окончательно взошел на священную гору и обрел истинную божественность."
  
