l_russian:

  game_concept_tilolan: "Система Тилолан"
  game_concept_tilolan_desc: "Когда [naklan_the_golden|E] был коронован как первый король всего [Glossary('Дахангона','dahangon_lowlands_encyclopedia_desc')] в [GetBuilding('02_dawang_tarmak').GetName], он потребовал, чтобы все местные правители, ближние и дальние, прибыли в его дворец для соблюдения [Glossary('тилолана', 'GH_TILOLAN_GLOSS')] и демонстрации личной преданности. Хотя царство Наклана распалось во время правления его наследника в ходе Восстания Золотого Терна, эта практика сохранилась и получила более широкое распространение по всему Дахангону, где знать и военачальники регулярно отправлялись к своим сюзеренам для личной явки."

  game_concept_ancient_shrunfan_era: "Миграция Чайлаон"
  game_concept_ancient_shrunfan_era_desc: "Считается, что чайлаоны (прото-сайелаи) прибыли в Наньмай-Бон примерно за семь столетий до нашей эры, плывя вдоль побережья Сюмин и вверх по бассейну реки Киранги. На протяжении восьмисот лет чайлаоны вели войны с постоянно сокращающимися коренными народами бассейна, могучими мутанде, а также друг с другом.\n\nСемена эпохи Сайелаон были посеяны в 120 году от И.С. с Разрушением Бхумираджи и одновременным воцарением принца Ру в одном из незначительных городов-государств Киранги. Позже Ру начал свою [Concept('god_king_ru_conquest','завоевательную кампанию в регионе')|E]."

  game_concept_god_king_ru_conquest: "Завоевание Ру"
  game_concept_god_king_ru_conquest_desc: "Достигнув зрелости, амбициозный Ру предпринял систематическое завоевание региона, якобы оставаясь непобеждённым на протяжении семнадцати лет своих кампаний по объединению различных племён и городов-государств вплоть до Фэнминских гор.\n\nВо время своего правления он принял титул Бога-Царя, а после его смерти царство вернулось к раздробленным войнам, что положило начало [Concept('age_of_the_warring_cities','Эпохи воющих городов')|E]."

  game_concept_huyen_yat: "Хюен Ят"
  game_concept_huyen_yat_desc: "К концу правления Ру королевство Сайелаон уже начало распадаться, престолонаследие превратилось в открытую борьбу, в то время как регент Суван укреплял свою власть в столице, заменяя слуг вокруг всё более болеющего монарха на преданных себе. Когда Бог-Царь наконец умер, Суван запечатал дворец и правил от имени Ру, как будто тот был ещё жив.\n\nПо мере того как слухи просачивались из столицы и сыновья Бога-Царя начинали подозревать неладное, от имени Ру был разослан призыв собраться на пир, на котором Бог-Царь наконец предстанет перед ними, хотя Суван намеревался вместо этого убить всех принцев. Поскольку оружие во дворце было запрещено, принцы явились лишь с несколькими слугами. Именно там, на пиру, запомнившемся как [Glossary('Хюен Ят', 'GH_HUYEN_YAT_GLOSS')], Суван напал на них, хотя некоторые пробились с боем, и сражение выплеснулось на улицы и охватило всю столицу. Битва была столь жестокой, что, говорят, само небо плакало, и три дня и ночи лил дождь, прежде чем кровь была смыта с улиц.\n\nЕдиное целое более не существовало, царство Сайелаон распалось на множество враждующих городов-государств. Суван не пережил собственного пира, пав от рук тех самых принцев, которых намеревался убить, и когда резня закончилась, столицу удерживал седьмой сын Ру, Сарун, в то время как его братья бежали за её пределы. В такой крови [age_of_the_warring_cities|E] обрела своё начало."

  game_concept_age_of_the_warring_cities: "Эпоха воюющих городов"
  game_concept_age_of_the_warring_cities_desc: "Эпоха воюющих городов была долгим периодом фрагментации, последовавшим за падением королевства Сайелаон, охватывающим время от [huyen_yat|E] в конце II века до конца V века от И.С. и последующего подчинения региона [Concept('naklan_the_golden','Накланом Золоты')|E]. Многочисленные племена и города-государства сайелаев вели бесконечные войны друг с другом.\n\nОб этой эпохе мало что известно с уверенностью. Те скудные знания, что сохранились, обязаны главным образом катунскому учёному Ту Су, посланному на юг в середине VI века Драконьим императором, чьё любопытство, а возможно, и настороженность, были пробуждены деяниями Наклана. Из часто противоречивых свидетельств, которые он собрал, Ту Су составил большую часть того, что сохранилось от того периода до наших дней."

  game_concept_age_of_strife: "Эпоха распрей"
  game_concept_age_of_strife_desc: "Хотя племена банвагулов вернулись к своей старой раздробленности после Восстания Золотого Терна, в образовавшемся вакууме возникли три преемника. Королевство Шрунфан достигло влияния близ Фэнминских гор, а при Чане Самойское королевство вновь объединило бассейн реки Киранги, в то время как на севере возвышалось Долоканское королевство силангуров. Их возвышение оказалось столь же кратким, сколь и великим. Разбогатев на торговле с Катун-Каем, силангуры заключили союз с самойцами против шрунфанцев, однако именно их поздняя экспансия на катунские земли стала их гибелью, кульминацией которой стал [Concept('yasong_incident','Инцидент в Ясонге')|E].\n\nСамойцы и шрунфанцы вели войны через своих данников, но ни одна из сторон не могла одолеть другую. Позже шрунфанцы заключили союзы с различными военачальниками банвагулов и для финансирования своих войн всё чаще обращались к пиратству, охотясь на морскую торговлю из Катун-Кая и на [Concept('pirate_coast','Пиратское побережье')|E].\n\nКак и в случае с силангурами ранее, такие провокации вызвали вражду Катун-Кая, что привело к [Concept('age_of_the_warring_cities','Эпохе воющих городов')|E] и падению королевства Шрунфан в 722 году от И.С."

  game_concept_yasong_incident: "Инцидент в Ясонге"
  game_concept_yasong_incident_desc: "По мере того как долоканские короли всё теснее связывали себя данническими узами с Драконьим императором, среди племенной элиты силангуров зрело недовольство. Когда король Сориманг умер преждевременно, царство перешло к его младенцу-сыну Палгуну. Его советник Ритхисак, поддержанный большей частью племенной элиты, восстал против правящего дома и, встретив незначительное сопротивление, захватил столицу.\n\nДостигнув покоев юного короля, люди Ритхисака обнаружили, что путь им преградил Е Ху, посланник Катун-Кая. Опасаясь, что любая задержка может погубить его, Ритхисак приказал своим людям убить посланника и всю его свиту, и Е Ху был убит вместе со своими двадцатью одним слугой. Ребёнок Палгун был задушен на месте.\n\nКогда весть о резне достигла Драконьего императора, Катун-Кай выступил в ярости и положил конец Долоканскому королевству, а его земли перешли под власть катунцев с учреждением [Concept('military_protectorate_of_the_silangur_highlands','Военного протектората Силангурского нагорья')|E]."

  game_concept_renshen_calamity: "Бедствие Жэньшэнь"
  game_concept_renshen_calamity_desc: "В то время как силангуры были разбиты при [Concept('battle_of_balinbada','Битве при Балинбаде')|E], магическое явление неопределённого происхождения одновременно обрушилось на столицу Долоканского королевства. В течение нескольких часов тёмное облако покрыло весь город, и с неба обрушились лиловые молнии, обрушившие большую часть его стен и убившие множество людей.\n\nКатунцы приписали это Драконьему императору, в то время как аверсарианские учёные позднее склонялись к версии о [Concept('gedeora','гедеоре')|E] великой силы. Как бы там ни было, силангуры остались беззащитными, их столица была разрушена и больше не могла служить убежищем."

  game_concept_battle_of_balinbada: "Битва при Балинбаде"
  game_concept_battle_of_balinbada_desc: "Битва при Балинбаде стала решающим сражением катунской кампании, последовавшей за [Concept('yasong_incident','Инцидентом в Ясонге')|E] по умиротворению силангуров. Мэн Чжао, неопытный и недавно назначенный командующим кампанией, доказал там свой военный гений, начав свою долгую карьеру на службе Драконьего императора.\n\nОбнаружив силангуров, выстроившихся на возвышенности, он притворился, что его войска отступают в беспорядке, заманив их вниз с высот в стремительном преследовании, а затем развернулся против них на открытой равнине, где его ряды выдержали и сомкнулись вокруг них. Силангуры, разбитые, отступили к своей столице, преследуемые катунским войском на всём пути, и, обнаружив свою столицу частично разрушенной и не в силах дать дальнейший бой, сдались. С их покорностью над Долоканским королевством был установлен Военный протекторат Силангурского нагорья."

  game_concept_military_protectorate_of_the_silangur_highlands: "Военный протекторат Силангурского нагорья"
  game_concept_military_protectorate_of_the_silangur_highlands_desc: "Военный протекторат Силангурского нагорья, позже переименованный в Протекторат Южных земель, был учреждён Катун-Каем для защиты его интересов в Наньмай-Боне.\n\nВ ответ на [yasong_incident|E] и недавние вторжения силангуров на земли данников Драконий император приказал завоевать и полностью подчинить силангуров. Ритхисак собрал армию в ответ и даже попытался заключить союз с королевством Шрунфан, но получил отказ.\n\nОн был разбит при [Concept('battle_of_balinbada','Битве при Балинбаде')|E], и регион был полностью завоёван. Там катунцы учредили Военный протекторат Силангурского нагорья, под непосредственным назначением [Concept('loen_chaeon','Лоэн-Чэоне')|E], поручив ему защиту интересов Катун-Кая."

  game_concept_great_western_march: "Великий западный поход"
  game_concept_great_western_march_desc: "Великий западный поход был кампанией начала VIII века, предпринятой Военным протекторатом Силангурского нагорья из [Glossary('Дахангона','dahangon_lowlands_encyclopedia_desc')] для подчинения сайелаев и обеспечения весьма прибыльной торговли между [Concept('pirate_coast','Пиратским побережьем')|E] и Катун-Каем.\n\nНезависимость сайелаев завершилась с падением королевства Шрунфан в 722 году от И.С. Город [Concept('bureau_bronzeport','Бронзовая гавань')|E] был позднее основан на южном побережье Дахангона, а Военный протекторат, переименованный в Протекторат Южных земель под властью своего первого правителя Яо Цинсяня, стал катунской колониальной властью над южными регионами Наньмай-Бона и Дахангона."

  #CHARACTERS
  game_concept_nari_daya: "Нари Дайя"
  game_concept_nari_daya_desc: "Легендарная королева-воительница дайарков, Дайя была старшей дочерью [Concept('naklan_the_golden','Наклана Золотого')|E] и служила одним из его главных думных мужей да верных ближников во время покорения Дахангона. Честолюбивая и умелая в ратном деле, принцесса оспорила восшествие своего племянника на престол после кончины Наклана, провозгласив себя Нари (королевой) и ввергнув дахангонские земли в пучину междоусобной войны.\n\nОднако, несмотря на всю свою доблесть, Нари Дайя не смогла занять стол, так как большинство вассалов ее родителя ополчились против нее за попрание заветов предков. Опасаясь погибели в долгой войне на измор, она вместо этого выкроила себе владение в горах Кхарадана, где вместе со своими самыми ревностными последователями основала гордое женское царство под рукой владычицы."
  
  game_concept_naklan_the_golden: "Наклан Золотой"
  game_concept_naklan: "Наклан"
  game_concept_naklan_the_golden_desc: "Почти мифический правитель Дахангона, Наклан Золотой знаменит тем, что сплотил разрозненные племена Банвагула в единое сильное царство.\n\nСтав героем множества сказаний, Наклан, как утверждается, воздвиг золотую цитадель Даванг Тармаки за один-единственный день, в коем уместились две ночи, а также якобы обрел бессмертие, совершив омовение в священной реке жизни.\n\nПосле правления, длившегося сто лет (а в некоторых песнях — и целую тысячу), Наклан, как глаголют, прошел путь к великому могуществу, после чего окончательно взошел на священную гору и обрел истинную божественность."
  
