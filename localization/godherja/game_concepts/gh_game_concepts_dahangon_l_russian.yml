  #EVENTS
  game_concept_ratarakaw: "Ратаракав"
  game_concept_ratarakaw_desc: "Произошедший в середине тринадцатого века от основания Орайсполя, Ратаракав почитается в Дахангоне великим разорением, уступающим по лютости лишь [Concept('frodbrokna','Дусапьясу')|E]. Бедствие началось с внезапного раскола полуденного неба, обнажившего безлунную пустоту, из коей на юго-восточные горы Харадана рухнула титаническая ограда да неведомая твердыня. Удар не только сровнял с землей гору, на кою пришелся, но и вызвал сильнейшие землетрясения, разрушившие древнюю цитадель Даванг Тармаки.\n\nСия катастрофа также положила конец почти увенчавшемуся успехом восстанию Налайкана, после того как великий вождь оказался погребен под обломками собственной крепости, что даровало столь необходимую передышку осажденному катунами из Бронзовой Гавани."
  
