  game_concept_nari_daya:89 "Нари Дайя"
  game_concept_nari_daya_desc:89 "Легендарная королева-воительница дайарков, Дайя была старшей дочерью [Concept('naklan_the_golden','Наклана Золотого')|E] и служила одним из его главных советников во время завоевания Дахангона. Честолюбивая и умелая воительница, принцесса оспорила восшествие своего племянника на престол после смерти Наклана, провозгласив себя Нари (королевой) и ввергнув Дахангон в пучину гражданской войны.\n\nОднако, несмотря на всю свою доблесть, Нари Дайя не смогла занять трон, так как большинство вассалов ее отца ополчились против нее за нарушение традиций. Опасаясь поражения в войне на истощение, она вместо этого выкроила себе владение в горах Кхарадана, где вместе со своими самыми ревностными последователями основала матриархальное общество."
  
  game_concept_naklan_the_golden:89 "Наклан Золотой"
  game_concept_naklan:89 "Наклан"
  game_concept_naklan_the_golden_desc:89 "Почти мифический правитель Дахангона, Наклан Золотой знаменит тем, что объединил различные племена Банвагула в единую империю.\n\nСтав героем множества легенд, Наклан, как утверждается, построил золотую цитадель Даванг Тармаки за один день, в которой уместились две ночи, а также якобы обрел бессмертие, совершив омовение в священной реке жизни.\n\nПосле правления, длившегося сто лет (а в некоторых эпосах — и целую тысячу), Наклан, как говорят, прошел путь к могуществу, после чего окончательно взошел на священную гору и обрел истинную божественность."
  
