  game_concept_ratarakaw:89 "Ратаракав"
  game_concept_ratarakaw_desc:90 "Произошедший в середине тринадцатого века от основания Орайспола, Ратаракав считается в Дахангоне катастрофой, уступающей по масштабам лишь [Concept('frodbrokna','Дусапьясу')|E]. Бедствие началось с внезапного раскола полуденного неба, обнажившего безлунную пустоту, из которой на юго-восточные горы Кхарадана рухнула титаническая конструкция. Удар не только сровнял с землей гору, на которую пришелся, но и вызвал сильнейшие землетрясения, разрушившие древнюю цитадель Даванг Тармаки.\n\nКатастрофа также положила конец почти увенчавшемуся успехом восстанию Налайкана, после того как великий вождь оказался погребен под обломками собственной крепости, что даровало столь необходимую передышку осажденному Катуни из Бронзовой Гавани."
  
