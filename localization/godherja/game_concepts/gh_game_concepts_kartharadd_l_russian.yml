 game_concept_night_of_the_bleeding_moon:0 "Ночь Кровавой Луны"
 game_concept_destruction_of_the_kartharadd:0 "Уничтожение Картарадди"
 game_concept_night_of_the_bleeding_moon_date:0 "23-е вельда 748 года"
 game_concept_night_of_the_bleeding_moon_desc:0 "Один из самых бесчестных эпизодов всего [Concept('chaos_of_the_seventh_century','хаоса седьмого века')|E], Ночь Кровавой Луны — это катаклизм, поглотивший всю [Concept('kartharadd','Империю Картарадди')|E] в темные часы 23-го вельда 748 года. Само название происходит от того факта, что [Concept('aervalr','Эрвальр')|E], как и все ночное небо по всему миру, сияло ярким, глубоким багрянцем на протяжении всей катастрофы. Все, кто спал, тут же проснулись, а когда событие достигло своего апогея, на горизонте вне зависимости от местоположения можно было услышать тихие крики целой империи в ее предсмертной агонии.\n\nКатастрофа унесла жизни около 80% населения Империи, практически все ее крупные населенные пункты превратились в руины, а столица Картарадди была поглощена вихрем адского пламени, который бушует над этой областью и по сей день. [Concept('the_continent','Великая Аверсария')|E], когда-то раскинувшаяся, космополитичная и урбанизированная, фактически была отброшена к состоянию дикой пустоши, но последствия докатились даже до Малкуа, который сильно пострадал и обезлюдел.\n\nПричины и виновники трагедии до сих пор остаются неразрешенным вопросом. Хотя автократия поспешила опровергнуть свою причастность из-за репутационных потерь, связанных с принятием ответственности за событие, столь сильно опустошившее Малкуа (факт, о котором сегодня часто забывают), последующие аутократоры постоянно меняли официальную позицию Империи относительно уровня вовлеченности Ораисполя, в зависимости от того, какой вариант на данный момент был политически наиболее выгоден."
 
