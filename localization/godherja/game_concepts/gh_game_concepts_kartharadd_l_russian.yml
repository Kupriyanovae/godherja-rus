 game_concept_wo_ashanan: "Во-Ашанан"
 game_concept_wo_ashanan_desc: "Обычай охоты за головами у кардвенов, ведомый им как «Во-Ашанан» или «Пленение духа», служит яркой метой любых усобиц среди сего народа. Веря, что душа остается в сознании внутри черепа до тех пор, пока тот не будет ритуально разбит, кардвены часто забирают черепа в качестве заложников, пока те не будут обменяны при заключении мира. И наоборот, самым отъявленным лиходеям головы бальзамируют, дабы их дух никогда не обрел покоя в загробной жизни. У воинов также принято носить сии трофеи как амулеты, ибо считается, что они даруют необычайную силу в бою."
 ##FAITHS

 game_concept_ardara: "Ardara"
 game_concept_ardara_desc: "[Glossary( 'Ardara', 'GH_ARDARA_GLOSS' )] is often claimed to be the only thing that determines one's worth. Every action of an individual can grow or wither their Ardara, such as upholding oaths, enacting vengeance, or obeying those in authority. For many, a child is not an adult until they have been considered to have gained enough Ardara, and adults are judged by the perceived quantity they earn throughout their life."
