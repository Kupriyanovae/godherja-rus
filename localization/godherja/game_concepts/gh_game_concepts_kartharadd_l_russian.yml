 #GROUPS AND ORGANIZATIONS
 
 game_concept_kartharadd: "Картарадд"
 game_concept_kartharaddi: "Картараддцы"
 game_concept_the_imperium: "Империя"
 game_concept_the_imperium_of_kartharadd: "Империя Картарадд"
 game_concept_kartharadd_imperium: "Катрараддский Империум"
 game_concept_kartharadd_desc: "Славный Картарадд, некогда величайшая держава-соперник, кою только встречали на своем веку [Concept('aversaria','аверсарианцы')|E], ныне являет собой лишь разбитые руины, раскиданные по бескрайним просторам [Concept('the_continent','Великой Аверсарии')|E].\n\nИскусные [Concept('living_magi','живые маги')|E] и мастера часовых дел, картараддцы воздвигли обширное многоплеменное государство во внутренних землях материка в ходе череды войн, длившихся со второго века до И.С. по восьмой век И.С., пока не сошлись в своей последней роковой битве против [Concept('aversaria','Аверсарии')|E]. Ими правил полубожественный владыка, державший страну в железной хватке, с коей мало кто из тогдашних царей мог помериться силами — во многом благодаря огромному невольничьему приказу да цепным слугам, чей обычай ныне плохо ведом.\n\nБольшая часть памяти об их бытии, государственном ладе и обрядах была утеряна в [Concept('night_of_the_bleeding_moon','Ночь Кровавой Луны')|E], когда вся Империя за считанные часы обратилась в пепелище. То немногое, что уцелело, было дочиста истреблено Аавтократией, коя из мести пожелала стереть любые знаки существования своего прежнего врага с лица самого [Concept('aeras','Эраса')|E]. До наших дней не дошло имя ни одного их царя, а последний отпрыск династии и вовсе скрыт, станется, непроницаемой завесой тайны. Даже имя их столицы, ныне одной из самых лютых и проклятых пустошей в мире, судя по всему, полностью изгладилось из памяти живых.\n\nИ если прежде одно лишь поминание их было под запретом и внушало робость аверсарианцам, в последнее время они стали скорее исторической диковинкой для простого люда, пищей для тех, кто ищет крамолы, и вечной головной болью для ревнителей старины."
 
