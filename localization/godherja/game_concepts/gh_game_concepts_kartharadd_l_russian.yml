 game_concept_wo_ashanan:0 "Во-Ашанан"
 game_concept_wo_ashanan_desc:0 "Обычай охоты за головами у кардвенов, известный им как «Во-Ашанан» или «Пленение духа», является отличительной чертой конфликтов среди этого народа. Веря, что душа пребывает в сознании внутри черепа до тех пор, пока тот не будет ритуально разбит, кардвены часто забирают черепа в качестве заложников, пока те не будут обменяны при заключении мира. И наоборот, самым отъявленным преступникам головы бальзамируют, чтобы их дух никогда не обрел покоя в загробной жизни. У воинов также принято носить эти трофеи как амулеты, поскольку считается, что они даруют необычайную силу в бою."
