 game_concept_night_of_the_bleeding_moon: "Ночь Кровавой Луны"
 game_concept_destruction_of_the_kartharadd: "Уничтожение картараддов"
 game_concept_night_of_the_bleeding_moon_date: "двадцать третье вельда семьсот сорок восьмого года"
 game_concept_night_of_the_bleeding_moon_desc: "Одно из самых бесчестных и черных дел за все время [Concept('chaos_of_the_seventh_century','хаоса седьмого века')|E], Ночь Кровавой Луны — это великий катаклизм, поглотивший весь [Concept('kartharadd','Катрараддский Империум')|E] в темные часы двадцать третьего вельда семьсот сорок восьмого года. Самое прозвание пошло от того, что [Concept('aervalr','Эрвал')|E], равно как и все ночное небо по всему миру, полыхал ярким, глубоким багрянцем на протяжении всей катастрофы. Все, кто спал в тот час, разом очнулись от ужаса, а когда погибель достигла своей вершины, над горизонтом в любом краю слышны были глухие стоны целой державы в ее предсмертной агонии.\n\nКатастрофа выкосила около восьмидесяти сотен из каждой тысячи людского рода Империи, практически все ее великие селения обратились в прах, а столица картараддов была поглощена вихрем адского пламени, коий бушует над сей землей и по сей день. [Concept('the_continent','Великая Аверсария')|E], некогда привольная, многолюдная и богатая градами, фактически была отброшена к дикости глухой пустоши, но отголоски беды докатились даже до Малкуа, коий сильно пострадал и обезлюдел.\n\nКорни и виновники сей трагедии до сих пор остаются неразгаданной тайной. Хотя Аавтократия поспешила откреститься от содеянного, дабы избежать позора и бесчестья за разорение Малкуа (о чем ныне часто забывают), последующие аавтократы постоянно меняли речи и волю Ораисполя, смотря по тому, какой сказ на тот момент был политически наиболее выгоден."
 
