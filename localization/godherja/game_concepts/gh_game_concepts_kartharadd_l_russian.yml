 game_concept_kartharadd:0 "Картарадд"
 game_concept_kartharaddi:0 "Картарадди"
 game_concept_the_imperium:0 "Империя"
 game_concept_the_imperium_of_kartharadd:0 "Империя Картарадд"
 game_concept_kartharadd_imperium:0 "Империя Картарадди"
 game_concept_kartharadd_desc:0 "Славный Картарадд, некогда величайшая цивилизация-соперник, которую когда-либо встречали [Concept('aversaria','аверсарианцы')|E], ныне представляет собой лишь разбитые руины, разбросанные по бескрайним просторам [Concept('the_continent','Великой Аверсарии')|E].\n\nИскусные [Concept('living_magi','живые маги')|E] и мастера часовых механизмов, картарадди построили обширное космополитичное государство во внутренних районах континента в ходе серии завоеваний, длившихся со II века до И.С. по VIII век И.С., когда они сошлись в своей последней роковой битве против [Concept('aversaria','Аверсарии')|E]. Ими правил полубожественный император, удерживавший свою державу в железной хватке, с которой мало кто из современников мог надеяться сравниться, во многом благодаря огромному аппарату рабского управления, природа которого сегодня плохо изучена.\n\nБольшая часть информации об их истории, государственном устройстве и обычаях была утеряна в [Concept('night_of_the_bleeding_moon','Ночь Кровавой Луны')|E], когда вся Империя за несколько часов превратилась в пепел. То немногое, что уцелело, было систематически уничтожено Автократией, которая из мести пожелала стереть любые упоминания о существовании своего прежнего врага с лица самого [Concept('aeras','Эраса')|E]. До наших дней не дошло имя ни одного императора, а последний представитель их династии особенно окутан, казалось бы, непроницаемой завесой тайны. Даже название их столицы, ныне одной из самых адских и враждебных пустошей в мире, судя по всему, полностью стерто из живой памяти.\n\nХотя когда-то одно лишь их упоминание было табуировано и вызывало чувство дискомфорта у аверсарианцев, в последнее время они стали скорее исторической диковинкой для широкой публики, темой для тех, кто намеренно ищет скандалов, и вечной головной болью для консерваторов."
 
