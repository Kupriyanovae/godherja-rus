  game_concept_karannai_ritual_consumption:0 "Ритуальное пожирание у караннаев"
  game_concept_karannai_ritual_consumption_desc:0 "Караннаи верят, что поедание других существ, если оно совершено в соответствии с точными шагами сложного ритуала, дарует поглотителю часть силы и качеств его трапезы. Так, пожирание медведя приносит силу, поедание сокола дарует ловкость, а поедание [Concept('magi','мага')|E] наделяет арканной мощью. Считается, что вкушение плоти самого Карана, Иссохшего Бога, дарует божественность, и многие караннаи погибли, пытаясь совершить это."
  
  
