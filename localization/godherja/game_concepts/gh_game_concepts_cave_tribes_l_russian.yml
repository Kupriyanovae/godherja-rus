  game_concept_karannai_ritual_consumption:0 "Ритуальное пожирание у караннаев"
  game_concept_karannai_ritual_consumption_desc:0 "Караннаи верят, будто поедание других созданий, коль совершено оно по заветам строгого и тайного обряда, дарует вкусившему часть силы и свойств да повадок его трапезы. Так, пожирание медведя приносит силу, поедание сокола дарует ловкость, а вкушение [Concept('magi','мага')|E] наделяет чародейской силой. Глаголют, будто вкушение плоти самого Карана, Иссохшего Бога, дарует божественность, и многие караннаи сложили головы, пытаясь свершить сие."
  
  
