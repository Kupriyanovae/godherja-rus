  game_concept_twist_of_the_tunnels: "Искривление туннелей"
  game_concept_twist_of_the_tunnels_desc: "Искривление туннелей — это событие, зафиксированное в хрониках нескольких отдельных племен [Concept('mayikrata','подземного мира')|E], наиболее подробно — в истории кротхаггов.\n\nВ то время как кротхагги построили великую империю, простиравшуюся по большей части подземного мира и даже выходившую в некоторых местах на поверхность, [Concept('gedeora','магическое бедствие')|E] в мгновение ока изменило мир. Уцелели лишь немногие регионы Кротхаггской империи, туннели вокруг них извивались в новых направлениях, а каменные постройки их великой империи, казалось, за мгновение превратились в пыль.\n\nХотя нет единого мнения о том, что именно Искривление туннелей сделало с кротхаггами и окружающим миром, многие жрецы утверждали, что магия этого события забросила их на эоны лет в будущее. Вся последующая история кротхаггов подчинена мечте обратить Искривление вспять — либо вернувшись в свое родное время, либо, когда спустя века кротхагги забыли о своей империи, объединив королевства и вновь распространившись по всему Подземному миру."  
