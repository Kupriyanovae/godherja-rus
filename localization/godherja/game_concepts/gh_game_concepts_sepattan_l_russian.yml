 game_concept_nattanan_biozone:0 "Наттананское нагорье"
 game_concept_nattanan_biozone_desc:0 "Наттананское нагорье — это суровый, дикий регион с тропическими дождевыми лесами и зазубренными горами, доминирующий на севере Дахангона. На протяжении тысячелетий он служит домом для изоляционистского народа наттанан. Мастерское владение магией природы и защитный ландшафт региона позволили наттананам сохранить образ жизни охотников-собирателей, отвергая любые формы цивилизации. Однако не стоит думать, будто они живут в нищете: их магия превращает джунгли в рог изобилия, полный дичи и пропитания."


 

 ###GENERAL
 
 ##LORE
 
 game_concept_liberation_of_nattanan:0 "Освободители Наттанана"
 game_concept_liberation_of_nattanan_desc:0 "Эоны лет назад боги-близнецы Тарфал и Йернейм вместе с богом огня Корлаку заточили Акхарадахамму Бессмертного, освободив наттананов от его мрачной тирании. После этого боги научили наттананов жить в гармонии с природой, поселившись вместе с ними в созданном ими зеленеющем раю.\n\nОднако этим блаженным временам не суждено было длиться вечно. Корлаку, очарованный силой, которую он явил в битве против Повелителя Смерти, возжелал достичь ещё больших высот, даже ценой нарушения баланса. Так началась Война Раскола — жестокий конфликт, в котором бог огня пал, а боги-близнецы навсегда исчезли из этого мира.\n\nТем не менее, их последователи остаются верными, неустанно стремясь соблюдать те пути, которым когда-то учили и которыми ходили их владыки."

