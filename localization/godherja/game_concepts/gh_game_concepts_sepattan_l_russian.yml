 game_concept_twin_deceivers: "Близнецы-обманщики"
 game_concept_twin_deceivers_desc: "Решающим делом для полной победы над Акхарадахаммой стала выковка Темной стали богом Корлаку. Однако, когда улеглась пыль сечи, боги-близнецы сочли механизмы своего брата ересью и вызовом их собственному величию. Сей спор разделил наттананов надвое, пока последователи Корлаку трудились над улучшением своей жизни с помощью хитроумных выдумок. Раздор рос, пока не обернулся коварством, и один роковой случайный удар разжег жестокую Войну Раскола, в коей богу огня суждено было пасть в могучей [Concept('korlacu_prophecy','последней битве')|E]."

 game_concept_korlacu_prophecy: "Пророчество Корлаку"
 game_concept_korlacu_prophecy_desc: "После того как боги-близнецы вытеснили Корлаку за пределы [Glossary('Карлех Соготом','GH_CARLEH_SOGOTOM_GLOSS')], Йернейм наконец сразил своего заблудшего брата, вернув мир в наттананские земли. Боги-близнецы устало радовались победе — но триумф их был омрачен по возвращении, когда они узрели Священную рощу, объятую пламенем. Когда они попытались затушить огонь, голос Корлаку разнесся над горящими древами, произнеся следующие слова:\nИз пепла восстанет пламенный бог,\nЧтоб выжечь сады под багрянцем небес.\nИ близнецов завершится чертог,\nВедь пламя пожрет этот девственный лес."
 
 game_concept_great_betrayal: "Великое предательство"
 game_concept_great_betrayal_desc: "Решающим делом для полной победы над Акхарадахаммой стала выковка Темной стали богом Корлаку. Однако, когда улеглась пыль сечи, боги-близнецы сочли механизмы своего брата угрозой для великого равновесия. Мудрый Тарфал пытался воззвать к разуму Корлаку, но тот в своем безумии отказался слушать. Сей спор разделил наттананов надвое, пока Корлаку продолжал копить оружие великой силы. Раздор рос, пока не обернулся коварством, и один роковой случайный удар разжег жестокую Войну Раскола, в коей богу огня суждено было пасть в могучей [Concept('korlacu_prophecy','последней битве')|E]."

 game_concept_fire_path: "Путь Огня"
 game_concept_fire_path_desc: "Путь Огня был проложен Корлаку Освободителем, Хранителем Священного Пламени, коий стремился предать огню Сад [Concept('twin_deceivers','Близнецов-обманщиков')|E] и воздвигнуть вечный погребальный костер. После его поражения последователи Пути Огня были изгнаны в северо-западные горы Кхарадана, ведомые на местном наречии как [Glossary('Чан Кьявкорлаку','GH_CHAN_KYAWKORLACU_GLOSS')]."

 game_concept_holy_hunts: "Священная охота"
 game_concept_holy_hunts_desc: "Суксиналмиксуле, или Священный путь охоты — это сакральные обряды, посвященные богу Йернейму. Охота берет начало с подражания его подвигу — ритуального плетения лука из магически закаленных лоз. Преуспевшие в сем деле получают наказ выследить тварь, объявленную Верховным жрецом Сепаттана как Джерсугу (добыча), ради сбережения лада в джунглях.\n\nКаждый год цель Джерсугу меняется: то может быть как стая прожорливых тварей, так и определенный вид летучих лисиц или же ведовской зверь из самых глубин чащобы — все зависит от того, что надобно для обретения истинного равновесия."

