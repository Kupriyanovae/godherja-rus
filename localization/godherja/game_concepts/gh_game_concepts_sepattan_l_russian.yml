 game_concept_liberation_of_nattanan: "Освободители Наттанана"
 game_concept_liberation_of_nattanan_desc: "Тьму лет назад боги-близнецы Тарфал и Йернейм вместе с богом огня Корлаку заковали в цепи Акхарадахамму Бессмертного, вызволив наттананов из-под его мрачного ига. После сего боги научили наттананов жить в ладу с природой, поселившись вместе с ними в созданном ими зеленеющем раю.\n\nОднако сим благословенным временам не суждено было длиться вечно. Корлаку, плененный силой, кою он явил в битве против Повелителя Смерти, возжелал достичь еще больших высот, даже ценой нарушения мирового лада. Так грянула Война Раскола — жестокая брань, в коей бог огня пал, а боги-близнецы навсегда покинули сей мир.\n\nТем не менее, верные последователи их не перевелись, неустанно стремясь блюсти те тропы, коим когда-то учили и коими ходили их небесные владыки."

