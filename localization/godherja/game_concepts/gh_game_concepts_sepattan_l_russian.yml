 game_concept_twin_deceivers:0 "Близнецы-обманщики"
 game_concept_twin_deceivers_desc:0 "Решающее значение для окончательного поражения Акхарадахаммы имела выковка Темной стали богом Корлаку. Однако, когда пыль улеглась, боги-близнецы сочли механизмы своего брата ересью и вызовом их собственному могуществу. Этот раскол разделил наттананов надвое, пока последователи Корлаку трудились над улучшением своей жизни с помощью инноваций. Напряженность росла, пока не вылилась в обман, и один роковой случайный удар разжег жестокую Войну Раскола, в которой богу огня суждено пасть в могучей [Concept('korlacu_prophecy','последней битве')|E]."

 game_concept_korlacu_prophecy:0 "Пророчество Корлаку"
 game_concept_korlacu_prophecy_desc:0 "После того как боги-близнецы вытеснили Корлаку за пределы [Glossary('Карлех Соготом','GH_CARLEH_SOGOTOM_GLOSS')], Йернейм наконец сразил своего заблудшего брата, вернув мир в Наттанан. Боги-близнецы устало радовались победе — но их триумф был омрачен по возвращении, когда они увидели Священную рощу, объятую пламенем. Когда они попытались потушить огонь, голос Корлаку разнесся над горящей рощей, произнеся следующие слова:\nИз пепла восстанет пламенный бог,\nЧтоб выжечь сады под багрянцем небес.\nИ близнецов завершится чертог,\nВедь пламя пожрет этот девственный лес."
 
 game_concept_great_betrayal:0 "Великое предательство"
 game_concept_great_betrayal_desc:0 "Решающее значение для окончательного поражения Акхарадахаммы имела выковка Темной стали богом Корлаку. Однако, когда пыль улеглась, боги-близнецы сочли механизмы своего брата угрозой для великого баланса. Мудрый Тарфал пытался воззвать к разуму Корлаку, но тот в своем безумии отказался слушать. Этот раскол разделил наттананов надвое, пока Корлаку продолжал копить оружие великой силы. Напряженность росла, пока не вылилась в обман, и один роковой случайный удар разжег жестокую Войну Раскола, в которой богу огня суждено пасть в могучей [Concept('korlacu_prophecy','последней битве')|E]."

 game_concept_fire_path:0 "Путь Огня"
 game_concept_fire_path_desc:0 "Путь Огня был проложен Корлаку Освободителем, Хранителем Священного Пламени, который стремился предать огню Сад [Concept('twin_deceivers','Близнецов-обманщиков')|E] и воздвигнуть вечный погребальный костер. После его поражения последователи Пути Огня были изгнаны в северо-западные горы Кхарадана, известные на местном наречии как [Glossary('Чан Кьявкорлаку','GH_CHAN_KYAWKORLACU_GLOSS')]."

 game_concept_holy_hunts:0 "Священная охота"
 game_concept_holy_hunts_desc:0 "Суксиналмиксуле, или Священный путь охоты — это сакральные ритуалы, посвященные богу Йернейму. Охота начинается с подражания его подвигу — ритуального создания лука из магически закаленных лоз. Преуспевшие в этом получают задание выследить существо, объявленное Верховным жрецом Сепаттана как Джерсугу (добыча), ради поддержания баланса в джунглях.\n\nКаждый год цель Джерсугу меняется: это может быть как стая прожорливых тварей, так и определенный вид летучих лисиц или же магический зверь из самых глубин джунглей — все зависит от того, что необходимо для достижения истинного равновесия."

