 game_concept_nattanan_biozone: "Наттананское нагорье"
 game_concept_nattanan_biozone_desc: "Наттананское нагорье — это суровый, дикий край вековых дождевых лесов и зазубренных скал, раскинувшийся на севере Дахангона. На протяжении долгих веков он служит прибежищем для нелюдимых родов наттананов. Мастерское владение ведовством природы и надежная защита родных гор позволили наттананам сберечь стародавний обычай охотников да собирателей, отвергая любые селения да законы чужаков. Однако не стоит думать, будто они бедствуют: их чары обращают джунгли в рог изобилия, полный дичи да всякого пропитания."


 

