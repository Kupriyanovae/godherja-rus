 game_concept_sarradon:0 "Саррадон"
 game_concept_sarradonian:0 "Саррадонский"
 game_concept_sarradonians:0 "Саррадонцы"
 game_concept_sarradon_desc:0 "Саррадон — это название засушливого континента к югу от [Concept('the_continent','Великой Аверсарии')|E]. В условиях сильной южной жары на побережьях благодаря морскому ветру сохраняется пышный и прохладный климат, однако всего в нескольких лигах от них земля стремительно превращается в пустыню и скалистые бесплодные земли. В центре континента благодаря восточным ветрам, а также нескольким великим рекам и озёрам раскинулись джунгли, ставшие домом для Адабисской империи.\n\nЗа Саррадон на протяжении тысяч лет велась ожесточённая борьба; он стал местом действия [Concept('war_in_heaven','Войны на небесах')|E], которая поглотила его политику почти на 2000 лет после зарождения [Concept('wardenism','старжничества')|E]. Несмотря на исключительное богатство минералами, торговлей и культурой, многочисленные разрушительные события привели к сильной депопуляции и голоду на большей части континента. Наиболее примечательным стало использование [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E] в 802 году от И. С., которая уничтожила более 80% магов в северной части континента и большую часть правящего класса, что привело к массовой анархии, повлёкшей за собой вскоре к агионистской и [Concept('aversaria','аверсарианскую')|E] колонизации региона.\n\nНа далёком юге континента, согласно сказаниям, находится империя Аксокилекко, которая на протяжении сотен лет ведёт кровопролитную войну с адабисцами. На востоке Пролив Ножей отделяет Саррадон от Айронои и [Concept('the_continent','Континента')|E], и предания гласят о временах, когда они были соединены сушей напрямую. Через этот пролив торговля из таинственных земель далёкого востока значительно обогащала запад, однако закат Саррадона и падение Аверсарии привели к тому, что теперь он наводнён пиратами."
 
 game_concept_regency_of_karadun:0 "Регентство Харадун"
 game_concept_regency_of_karadun_desc:0 "Регентство Харадун — именовавшее себя Королевством, а позже Империей Саррадон — было одним из самых стойких оплотов софоцизма на континенте, существовавшим в той или иной форме от начала и до самого конца [Concept('war_in_heaven','Войны на небесах')|E]. Хотя само государство официально заявляло о непрерывной преемственности от Королевства Саррадон, большинство историков связывают его начало с отступлением Улайхира в древнюю крепость Кармуз после его поражения в битве при Горящем Ключе. Защищённое Тарсанидскими горами, это государство быстро стало прибежищем для множества саррадонских высших дворян, бежавших от наступающей волны [Concept('great_uprising','Великого восстания')|E].\n\nНесмотря на свои высокие притязания, Регентство большую часть своей истории отчаянно пыталось удержать под контролем даже те территории, которыми владело номинально, фактически превратившись в пешку в регионе, где доминировали военачальники. Тем не менее несколько попыток стражнических нашествий удалось отразить — либо силами объединённых армий королевства, либо благодаря самим стенам Кармуза.\n\nПосле сдачи Кармуза Ханати в 985 году от И. С. государство было переименовано в «Империю Саррадон» — доселе беспрецедентный титул, — что ознаменовало начало эпохи централизации и завоеваний. Несмотря на общие успехи в борьбе с внутренними и внешними врагами, последствия этих реформ и войн разорвали государство на части в течение XI века от И. С., во время которого мамуры начали свой финальный марш к уничтожению Регентства. Наконец, в 1233 году от И. С. сами стены Кармуза были пробиты, что ознаменовало конец не только одного из старейших государств [Concept('sarradon','Саррадона')|E], но и Войны на небесах."
 
 game_concept_sophocos:0 "1001 ступень Софокоса"
 game_concept_sophocos_desc:0 "Согласно [Concept('ritualism','ритуалистским')|E] сказаниям, Софокос, великая [Concept('the_towers','Башня')|E], впервые была преодолена группой из ста паломников, которые отправились на её вершину по призыву ангелов. На каждой ступени высотой в человеческий рост они сталкивались с новым испытанием и выходили из него с новым пониманием того, как лучше прожить свою жизнь, чтобы достичь совершенства. Правда это или нет — ещё один предмет жарких споров среди теологического класса ритуалистов, но Башня в любом случае остаётся впечатляющим зрелищем."
 
 #MISC
 
 ##FAITHS
 
 game_concept_malaak:0 "Малаак"
 game_concept_malaak_desc:0 "Малааки — это аватары или воплощения Охрасика, и многие праведные правители на протяжении многих лет провозглашали себя малааками. Статус малаака не означает, что человек сам является Охрасиком, а скорее указывает на то, что он полностью принял и воплощает Охрасика в себе, являясь орудием его воли. Поскольку малааки притязают на высшую праведность, напрямую исполняя волю Охрасика, они часто находятся под пристальным вниманием, и малейшее нечестие может легко привести к восстанию подданных против них."
 
 game_concept_sarataratin_militarism:0 "Саратаратинский милитаризм"
 game_concept_sarataratin_militarism_desc:0 "Хотя изначально саратаратская вера была гораздо более милитаристской, современное её течение раскололось (её первоначальное воплощение ныне именуется саратадибе) после разрушительных последствий [Concept('the_decimation_of_sarradon','Халакдуна')|E], который унёс жизни почти половины всех священных саратанов, на которых обитают верующие, а также погубил большую часть остального [Concept('sarradon','Саррадона')|E]. Из-за гибели столь многих саратанов, на спинах которых живёт большинство саратарианцев (и вместе с которыми они утонули в море, когда те пали), а также из-за гибели тысяч верующих на уцелевших саратанах, саратарианцы погрузились в глубокую коллективную травму.\n\nПосле того как каста жрецов со всех саратанов сошлась на великом острове Шакерби (который, как они утверждают, образовался на останках самого первого саратана) для Матхаттской молитвы, было решено, что дальнейшие войны между верующими будут означать гибель последних саратанов и их защитников. С тех пор саратаратины известны как мирные и монашествующие торговцы, которые отвергают любое насилие, за исключением исключительно защиты самих саратанов."
 
 game_concept_nosanni:0 "Носанни"
 game_concept_translator_priests:0 "Жрецы-переводчики"
 game_concept_nosanni_desc:0 "Носанни, или жрецы-переводчики, — это служители в религии Манат, которым поручен перевод [Concept('gena_tinngir','Священных текстов')|E] и передача этих знаний остальным верующим. Именно из-за этой обязанности храмы Манат часто называют больше похожими на библиотеки, нежели храмы других религий. Исторически носанни были самой могущественной кастой в обществе Манат, и хотя движения макерелионов и мафида пытались положить конец этому доминированию, ни одно из них не увенчалось успехом."
 
 game_concept_dogena_dikirib:0 "Догена Дикириб"
 game_concept_nomera_dikirib:0 "Номера Дикириб"
 game_concept_dogena_dikirib_desc:0 "Догена Дикириб, или Земная библиотека, в вере Манат является земным отражением [Concept('dogena_tinngir','Божественной библиотеки богов')|E], возглавляемым Номера Дикириб, или Земным хранителем. В идеале Догена Дикириб должна быть не одной библиотекой, а огромным собранием библиотек, хранящих все [Concept('gena_tinngir','Священные тексты')|E] и их переводы, а равно и все прочие знания человечества. Исторически Догена Дикириб явно не соответствовала этому идеалу, но тем не менее с самого своего основания оставалась центром веры Манат."
 
 game_concept_gena_tinngir:0 "Гена Тиннгир"
 game_concept_manat_sacred_texts:0 "Священные тексты"
 game_concept_gena_tinngir_desc:0 "Гена Тиннгир, или Священные тексты Манат, — это древние тексты, восходящие к цивилизации, которую никто из ныне живущих не помнит, и которую последователи Манат считают цивилизацией [Concept('manat_mythology','Богов Манат')|E]. Эти тексты написаны на древнем языке, который никому не известен и до сих пор не был по-настоящему расшифрован (вопреки заявлениям многочисленных [Concept('nosanni','носанни')|E]), однако некоторые утверждали, что испытывают странное чувство знакомства при виде этого письма. Несмотря на значительные усилия манатцев по сохранению скопленных ими Священных текстов под бдительной охраной [Concept('dogena_dikirib','Номера Дикириб')|E], число уцелевших подлинных текстов со временем сократилось. Хотя манатцы сохраняют переписанные копии и предполагаемые переводы, они также подверглись медленному истощению, что с годами привело к усилению акцента на важности именно подлинных Священных текстов."
 
 game_concept_manat_mythology:0 "Мифология Манат"
 game_concept_manat_gods:0 "Боги"
 game_concept_relyon:0 "Релион"
 game_concept_ashema:0 "Ашема"
 game_concept_manat_mythology_desc:0 "Последователи Манат верят, что боги когда-то жили среди человечества на [Concept('aeras','Эрасе')|E], одновременно правя ими и обучая их всему, что они знают. Богами правил Релион, первый бог, создавший вселенную, и его жена Асторет, которая заботилась о человечестве больше любого другого бога. Боги хранили огромное количество имевшихся у них знаний, превосходивших те, которыми располагают даже самые развитые человеческие общества сегодня, в библиотеках по всему Эрасу, где каждый мог получить к ним доступ. Однако в один прекрасный день человек по имени Атар позавидовал богам и подстрекнул толпу, которая принялась сжигать все библиотеки богов, пока не осталась лишь одна. Оставшись всего с одной библиотекой и растеряв почти все свои колоссальные запасы знаний, боги решили покинуть Эрас, забрав свою последнюю библиотеку и землю вокруг неё с собой, из-за чего в земле образовался огромный кратер, а сама эта последняя библиотека стала [Concept('dogena_tinngir','Божественной библиотекой богов')|E]. Эту библиотеку теперь необходимо было защищать любой ценой, и бог войны, Ашема, вызвался сделать это, став первым библиотекарем.\n\nПосле того как боги покинули человечество, Асторет принялась плакать так горько, что её слёзы начали затапливать мир, создав океан. Однако она никак не переставала плакать, угрожая затопить весь Эрас. Чтобы утешить её, Релион пообещал жене, что самым праведным из людей, которые всё ещё следовали законам, изложенным в оставленных на Эрасе [Concept('gena_tinngir','Священных текстах')|E], после смерти будет дозволено войти в Божественную библиотеку, ибо до тех пор души всех людей после их кончины пожирал великий червь Мод. Асторет, обрадованная этим замыслом, перестала плакать, спася человечество. Чтобы определять, следуют ли люди Священным текстам, тысячеокой богине Ярих было поручено наблюдать за людьми на Эрасе, хотя она могла делать это только во время своего ночного бодрствования, так как слепящий свет солнца не позволяет богам взирать на Эрас днём. Однако, когда последователи Атара начали уничтожать Священные тексты, младший сын Релиона, Локан, посчитал, что этот порядок по-прежнему несправедлив к людям, ведь если у них нет Священных текстов, они никак не могут знать, как им следовать. Поэтому он начал лукаво похищать тексты из Божественной библиотеки и прятать их на Эрасе в надежде, что люди найдут их."
 
 game_concept_dogena_tinngir:0 "Догена Тиннгир"
 game_concept_divine_library_of_the_gods:0 "Божественная библиотека богов"
 game_concept_divine_library:0 "Божественная библиотека"
 game_concept_dogena_tinngir_desc:0 "Догена Тиннгир, или Божественная библиотека богов, — это место, куда, по убеждению последователей Манат, отправляются после смерти все праведные люди, преданно следующие [Concept('gena_tinngir','Священным текстам')|E]. Говорят, что она содержит не только все известные человечеству знания, но и космические тайны, неведомые никому, кроме самих [Concept('manat_mythology','Богов Манат')|E]. Её охраняет Ашема, бог войны, который, как утверждается, наизусть заучил каждый текст в библиотеке, что также фактически возводит его в статус бога знаний. Великий кратер Синасан, лежащий к югу от древней родины этой религии, считается той самой землей, с которой Божественная библиотека вознеслась с [Concept('aeras','Эраса')|E]; при этом сосуд в его центре считается её вратами, а доносящаяся изнутри музыка — звуками душ и богов, беседующих на языке небожителей."
 
 game_concept_kalnaih:0 "Кальнайх"
 game_concept_kalnaih_desc:0 "Когда Эир-Шайтан и его банда предателей сотворили человечество, на небесах вспыхнул конфликт — Кальнайх. Элои в своей великой мудрости велел своим верным Маликия покарать предателя, пока сам он размышлял, что делать с творениями своего мятежного сына. И вот, по приказу своего отца, одиннадцать верных сыновей двинулись на Бидиль-эль, твердыню предателя. В Бидиль-эле вспыхнуло жестокое противостояние. Прекрасная земля была обращена в пепел, пока братья сражались друг с другом. И в последней битве Комера, самый верный из Маликия, был смертельно ранен в дуэли против Эир-Шайтана. Подобная ересь привела в ярость Элои, который поразил предателей и похоронил их трупы в глубинах Бидиль-эля, где никто о них не вспомнит. Затем, вняв просьбе своего умирающего сына, Элои пощадил человечество, но наставил людей, что для возвращения на небеса они должны вести себя праведно и благородно. После этого он изгнал их на [Concept('aeras','Эрас')|E], поскольку небеса были не местом для смертных существ."
 
 game_concept_adaric_philosophy:0 "Адарианская философия"
 game_concept_adaric_philosophy_desc:0 "Рождённая в блестящем разуме своего эпонимичного создателя, адарианская философия подчёркивает силу индивидуального разума и его рационалистические способности к познанию мира. Наблюдение имеет первостепенное значение, и ничто не может считаться познанным в совершенстве без прямого опыта.\n\nБолее богохульно адарианская философия отвергает абсолютную космическую праведность как стражнических законов, ритуалистских ангелов и башен, так и языческих божеств. Хотя существование подобных сверхмирских сил, разумеется, было неопровержимо доказано наблюдениями раз за разом на протяжении всей истории [Concept('aeras','Эраса')|E], Адар выдвигает теорию о том, что их можно рассматривать скорее как великие природные силы, обладающие не большим истинным всемогуществом, чем какой-нибудь особо благословенный маг. Само первоначальное сотворение мира Адар приписывает теоретическому «Перводвижению» — некоей непознаваемой и отсутствующей сущности или энергии, чьё остаточное присутствие, какое уж оно есть, способно нисходить до уровня восприятия человечества лишь через крайние степени разбавления.\n\nВпрочем, поскольку существование Перводвижения невозможно наблюдать, это не более чем теория."
 
