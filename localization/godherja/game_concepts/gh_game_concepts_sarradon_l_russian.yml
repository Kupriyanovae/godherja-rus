 game_concept_ishtabima_mamura:0 "Иштабима Мамура"
 game_concept_ishtabima_mamura_desc:0 "Телохранительница, [Concept('magi','маг')|E], сторонница несостоявшейся мамуры Санад и противоречивая святая, Иштабима имеет туманное историческое происхождение: альтернативные источники называют её как рождённой вне брака племянницей мамуры, так и простой простолюдинкой, проявившей себя во время смуты Халакдуна. Как бы то ни было, она неоднократно демонстрировала своё воинское и тактическое мастерство на службе у своей госпожи, дослужившись до роли её главного министра и, в конечном счёте, де-факто главнокомандующего её армиями. Более того, некоторые приверженцы Иштабимы заходят так далеко, что утверждают, будто поражение Санад в битве при Азареке произошло из-за того, что она пренебрегла советами своего генерала в угоду двуличному заговору, в результате которого Иштабима была изгнана из военного совета Санад. \n\n Сказания о жизни и смерти Иштабимы преисполнены известных противоречий. Хотя она умерла в относительно нежном возрасте тридцати восьми лет (или сорока пяти, или двадцати семи, в зависимости от того, придерживаться ли определённых гетеродоксальных исторических хроник), она уже успела сплотить вокруг себя преданных последователей из числа сторонников Санад, число которых после её кончины только выросло. Хотя она прославилась множеством ратных подвигов (таких как Окружение у ручьев и Двухкольцевой форт, благодаря которому она выиграла осаду Тишварады, навсегда сокрушив амбиции ритуалистского пророка Маннахавасвы), её самое знаменитое деяние известно сегодня как Праведное противостояние. Утверждается, что у одинокого моста, пересекающего реку А'Аутия, она в одиночку сразила не менее тысячи солдат и магов в отчаянной попытке защитить армию Санад, отступавшую перед преследующими силами стражнического претендента Абатиса, пустив в ход каждое известное ей заклинание и каждый фехтовальный приём. Лучевая болезнь, развившаяся от магии, которую она соткала в тот день — магии, что кипятила костный мозг и обращала саму плоть преследующих солдат Абатиса в кровавое месиво, — как говорят, свела её в могилу всего несколько месяцев спустя. Те, кто почитает её как святую, видят в этом акте абсолютной преданности своего рода священное мученичество — не бесполезную или символическую жертву, а спланированное и стратегически просчитанное самоубийство. Рассказывают, что когда в тот день её уносили с поля боя, всё её тело светилось охрой от [Concept('arcana','арканического')|E] излучения неописуемых энергий, ставшего последним и смертоносным доказательством её верности своему делу и своей мамуре.\n\n Умереть, и сделать это во имя преданности, превосходящей способность любого живого смертного облечь её в слова. Обрести на [Concept('aeras','Эрасе')|E] судьбу, выходящую за рамки этого блеклого и мимолётного мира — разве это не трансцендентно? По крайней мере так говорят её сторонники среди Бешашурийи. При этом весьма банальной трагедией остаётся то, что сама она не оставила ни единого слова, чтобы оправдать свои действия и объяснить дело, к ногам которого она добровольно пролила свою кровь. Знала ли об этом сама Санад?"
 
