 game_concept_mubaaizun:0 "Мубаризун"
 game_concept_mubaaizun_desc:0 "Мубаризун — это чемпион [Concept('sarradon','саррадонской')|E] армии; зачастую лучшие воины владыки участвуют в ритуальной дуэли до начала битвы, сражаясь насмерть. Эти дуэли часто сопровождаются тем, что каждая армия скандирует лозунги или выкрикивает оскорбления в адрес противника, и в истории бывали случаи — например, [Concept('battle_of_the_mubaaizun_fix','битва мубаризунов')|E], — когда перед началом сражения происходило несколько дуэлей, часто ради того, чтобы отомстить за погибшего чемпиона.\n\nДопускается бегство с дуэли, если мубаризун понимает, что проиграл, а победивший чемпион может преследовать его лишь до определённого предела, после чего обязан отступить. Эти поединки могут оказать колоссальное влияние на боевой дух армии, а некоторые битвы и вовсе были предотвращены из-за проигранной дуэли. Стать мубаризуном может любой, кто способен сражаться, и в истории было несколько полководцев, которые сами выступали в роли собственных чемпионов. Мубаризуны по традиции не являются [Concept('magi','магами')|E] и обычно представляют собой мечников, облачённых в именные и роскошные доспехи.\n\nДуэли мубаризунов вышли из моды со времён прибытия [Concept('aversaria','аверсарианцев')|E]; большинство аверсарианских полководцев совершенно не заинтересованы в назначении мубаризунов или в соблюдении обычаев [Concept('sarradon','саррадонцев')|E], хотя из этого правила есть несколько исключений."
 
