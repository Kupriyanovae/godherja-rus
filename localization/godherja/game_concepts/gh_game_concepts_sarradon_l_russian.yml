 game_concept_sarradon: "Саррадон"
 game_concept_sarradonian: "Сaррадонский"
 game_concept_sarradonians: "Саррадонцы"
 game_concept_sarradon_desc: "Саррадон — так зовут иссушенный солнцем материк к югу от [Concept('the_continent','Великой Аверсарии')|E]. Под нещадным южным зноем лишь на побережьях благодаря морскому ветру сохраняется прохлада и буйство зелени, но стоит отойти на несколько лиг вглубь страны, как земля стремительно превращается в бесплодные пески и каменистые кручи. В самом сердце континента благодаря восточным ветрам, полноводным рекам и озерам раскинулись дремучие джунгли, укрывшие Адабисскую империю.\n\nЗа Саррадон тысячелетиями велась ожесточенная борьба. Он стал полем битвы для [Concept('war_in_heaven','Войны на небесах')|E], которая подчинила себе всю жизнь края почти на две тысячи лет с тех пор, как зародился [Concept('wardenism','варденизм')|E]. Несмотря на сказочные богатства, обилие руд и процветание купечества, бесконечные бедствия привели к страшному голоду и запустению большей части материка. Роковым ударом стало безумие чародеев в 802 году от И. С., когда в ход пошла [Concept('selfreplicating_blood_magic','самовоспроизводящаяся магия крови')|E]. Она сгубила более восьми из десяти магов на севере континента и почти всю знать, породив беззаконие, вслед за которым началась колонизация края агионистами и [Concept('aversaria','аверсарианцами')|E].\n\nВ далёких южных землях, если верить сказаниям, раскинулась империя Аксокилекко, что сотни лет ведет кровопролитную войну с адабисцами. На востоке Пролив Ножей отделяет Саррадон от Айронои и [Concept('the_continent','Континента')|E] — легенды гласят, что некогда они были соединены сушей. Через этот пролив товары из таинственных восточных стран обогащали западные земли, однако с закатом Саррадона и падением Аверсарии эти воды наводнили пираты."
 
 game_concept_regency_of_karadun: "Регентство Харадун"
 game_concept_regency_of_karadun_desc: "Регентство Харадун — именовавшее себя сперва Королевством, а после Империей Саррадон — было одним из самых несокрушимых оплотов софоцизма на континенте, просуществовавшим в том или иной виде от зари до самого заката [Concept('war_in_heaven','Войны на небесах')|E]. И хотя сами правители заявляли о прямой преемственности от древнего Королевства Саррадон, историки ведут отсчет государства со времен, когда поверженный в битве при Горячем Ключе Улайхир отступил в старинную твердыню Кармуз. Укрытое за Тарсанидскими горами, это владение быстро стало прибежищем для саррадонской знати, бежавшей от бушующего пожара [Concept('great_uprising','Великого восстания')|E].\n\nНесмотря на громкие притязания, Регентство большую часть своей истории отчаянно пыталось удержать под властью даже собственные земли, на деле превратившись в безвольную куклу в руках могучих военачальников. И все же несколько варденитских нашествий удалось отразить — то силами сплотившихся вассалов, то благодаря неприступным стенам Кармуза.\n\nКогда в 985 году от И. С. Кармуз сдался Ханати, государство провозгласили «Империей Саррадон» — титулом доселе невиданным, — что положило начало веку завоеваний и сильной власти. Но, несмотря на победы над внешними и внутренними врагами, плоды этих реформ и войн разорвали страну на части в XI веке, когда мамуры начали свой последний поход на Харадун. Наконец, в 1233 году от И. С. рухнули сами стены Кармуза, похоронив под своими обломками не только одно из древнейших государств [Concept('sarradon','Саррадона')|E], но и саму Войну на небесах."
 
 game_concept_sophocos: "1001 ступень Софокоса"
 game_concept_sophocos_desc: "Согласно [Concept('ritualism','ритуалистским')|E] преданиям, Софокос, великая [Concept('the_towers','Башня')|E], впервые покорилась сотне паломников, взошедших на ее вершину по зову ангелов. На каждой ступени высотой в человеческий рост их ждало новое испытание, преодолевая которое они обретали мудрость и понимание того, как очистить свою жизнь и достичь совершенства. Было ли так на самом деле — до сих пор предмет ожесточенных споров среди ритуалистских богословов, но сама Башня и поныне являет собой величественное зрелище."
 
 #MISC
 
 ##FAITHS
 
 game_concept_malaak: "Малаак"
 game_concept_malaak_desc: "Малааки — это земные лики или живые воплощения Охрасика. На протяжении веков многие благочестивые правители объявляли себя малааками. Этот титул не означает, будто человек сам равен Охрасику; скорее он указывает, что владыка полностью впустил божество в свое сердце и стал верным орудием его воли. Поскольку малааки притязают на высшую святость, напрямую исполняя предначертанное сверху, они всегда находятся под пристальным вниманием: малейшее нечестие или грех правителя могут легко подтолкнуть подданных к бунту."
 
 game_concept_sarataratin_militarism: "Саратаратинское воинство"
 game_concept_sarataratin_militarism_desc: "Изначально саратаратская вера была куда более воинственной, но в нынешние дни ее учение раскололось (древний же ее облик теперь зовут саратадибе). Разломом послужили страшные последствия [Concept('the_decimation_of_sarradon','Халакдуна')|E], который унес жизни почти половины священных саратанов — исполинских тварей, на чьих спинах обитают верующие, — и предал опустошению остальной [Concept('sarradon','Саррадон')|E]. Гибель исполинов, утащивших за собой на морское дно целые города, и смерть тысяч людей на уцелевших гигантах повергли саратарианцев в глубокую безотрадную скорбь.\n\nКогда жрецы со всех краев сошлись на великом острове Шакерби, поднявшемся, как говорят, на костях самого первого саратана, дабы сотворить Матхаттскую молитву, они положили зарок: отныне любые войны между единоверцами означают гибель последних саратанов и их хранителей. С тех пор саратаратины известны как мирные монахи и купцы, отвергающие всякое насилие, кроме защиты самих священных исполинов."
 
 game_concept_nosanni: "Носанни"
 game_concept_translator_priests: "Жрецы-толкователи"
 game_concept_nosanni_desc: "Носанни, или жрецы-толкователи, — это служители веры Манат, коим вверено переводить [Concept('gena_tinngir','Священные тексты')|E] и нести эти знания остальным мирянам. Из-за этого послушания обители Манат куда больше походят на обширные книгохранилища, нежели святилища иных богов. Исстари носанни были сильнейшим сословием в землях Манат, и хотя проповедники макерелионов и мафида пытались пошатнуть их власть, ни один их умысел не увенчался успехом."
 
 game_concept_dogena_dikirib: "Догена Дикириб"
 game_concept_nomera_dikirib: "Номера Дикириб"
 game_concept_dogena_dikirib_desc: "Догена Дикириб, или Земное книгохранилище, почитается в вере Манат как земное отражение [Concept('dogena_tinngir','Божественной библиотеки богов')|E], а заправляет ею Номера Дикириб — Земной хранитель. В замысле Догена Дикириб должна быть не просто прибежищем свитков, но великим союзом библиотек, сберегающих все [Concept('gena_tinngir','Священные тексты')|E], их толкования и вообще любые познания людей. В земной истории Догена Дикириб редко соответствовала этому высокому идеалу, но с самого своего основания она оставалась незыблемым сердцем веры Манат."
 
 game_concept_gena_tinngir: "Гена Тиннгир"
 game_concept_manat_sacred_texts: "Священные тексты"
 game_concept_gena_tinngir_desc: "Гена Тиннгир, или Священные тексты Манат, — это древние свитки, оставшиеся от цивилизации, которую никто из ныне живущих не помнит, и которую чада Манат считают эпохой [Concept('manat_mythology','Богов Манат')|E]. Написаны они на забытом наречии, которое до сих пор никто не сумел по-настоящему разгадать (вопреки бахвальству многих [Concept('nosanni','носанни')|E]), хотя иные люди уверяли, будто при взгляде на эти знаки их охватывает странное чувство узнавания. Несмотря на рвение, с которым манатцы оберегали подлинники свитков под присмотром [Concept('dogena_dikirib','Номера Дикириб')|E], число древних свитков со временем таяло. И хотя переписанные списки и переводы сохранились, они тоже ветшали, из-за чего с годами манатцы стали ценить именно уцелевшие подлинники выше всякого злата."
 
 game_concept_manat_mythology: "Мифология Манат"
 game_concept_manat_gods: "Боги"
 game_concept_relyon: "Релион"
 game_concept_ashema: "Ашема"
 game_concept_manat_mythology_desc: "Последователи Манат верят, что боги некогда жили среди смертных на [Concept('aeras','Эрасе')|E], правя ими и обучая ремеслам. Над богами властвовал Релион, первый бог, создавший твердь и твердыню небес, и его жена Асторет, что пеклась о людях сильнее прочих небожителей. Свои великие знания, превосходящие все, чем владеют люди ныне, боги хранили в книжных чертогах по всему Эрасу, открытых для каждого. Но в один несчастный день человек по имени Атар позавидовал бессмертным и подстрекнул толпу, которая принялась жечь книжные чертоги, пока не остался лишь один. Лишившись сокровищ мудрости, боги решили покинуть Эрас, забрав последний чертог и земли вокруг него с собой. Там, где они ушли в небеса, разверзся огромный кратер, а спасенная обитель свитков стала [Concept('dogena_tinngir','Божественной библиотекой богов')|E]. Эту твердыню нужно было защищать любой ценой, и бог войны Ашема вызвался стать ее первым хранителем.\n\nКогда боги покинули землю, Асторет разрыдалась так горько, что ее слезы затопили низины, породив океан. Она все плакала, грозя пустить весь Эрас под воду. Дабы утешить ее, Релион пообещал, что праведникам, соблюдающим законы оставленных на Эрасе [Concept('gena_tinngir','Священных текстов')|E], после смерти будет позволено войти в Божественную библиотеку — ведь до той поры души всех умерших пожирал великий червь Мод. Утешившись этим замыслом, Асторет осушила слезы и спасла мир. Искать праведников поручили тысячеокой богине Ярих, но взирать на Эрас она могла лишь во время ночного бодрствования, ибо слепящее солнце мешает богам смотреть на землю днем. Когда же слуги Атара принялись истреблять Священные тексты, младший сын Релиона, Локан, счел этот суд несправедливым: лишившись свитков, люди не могли знать законов. Посему он принялся хитростью красть свитки из Божественной библиотеки и прятать их на Эрасе в надежде, что люди отыщут их."
 
 game_concept_dogena_tinngir: "Догена Тиннгир"
 game_concept_divine_library_of_the_gods: "Божественная библиотека богов"
 game_concept_divine_library: "Божественная библиотека"
 game_concept_dogena_tinngir_desc: "Догена Тиннгир, или Божественная библиотека богов, — это небесный чертог, куда, по вере Манат, отходят после смерти души праведников, преданно следовавших [Concept('gena_tinngir','Священных текстам')|E]. Говорят, там сокрыты не только все земные знания, но и тайны мироздания, неведомые никому, кроме самих [Concept('manat_mythology','Богов Манат')|E]. Охраняет ее бог войны Ашема, который, по преданию, знает наизусть каждую строчку в чертоге, отчего его почитают еще и богом мудрости. Великий кратер Синасан на древней родине этой веры считается тем самым местом, откуда библиотека вознеслась с [Concept('aeras','Эраса')|E]. Каменная чаша в его сердце почитается за врата в обитель богов, а доносящаяся оттуда музыка — за отголоски речей, звучащих на языке небожителей."
 
 game_concept_kalnaih: "Кальнайх"
 game_concept_kalnaih_desc: "Когда Эир-Шайтан и его банда отступников сотворили человечество, на небесах вспыхнула великая сеча — Кальнайх. Элои в своей безграничной мудрости велел верным духам Маликия покарать изменника, пока сам он размышлял, как поступить с творениями мятежного сына. По воле отца одиннадцать верных сыновей двинулись на Бидиль-эль, оплот предателя. Там закипел яростный бой. Прекрасный край обратился в пепел, пока братья рубились друг с другом. В решающей схватке Комера, самый преданный из Маликия, пал, сраженный рукой Эир-Шайтана. Подобное злодеяние привело в ярость Элои: он поразил отступников и погреб их тела в глубинах Бидиль-эля, предав забвению. Затем, вняв предсмертной мольбе сына, Элои пощадил человечество, но заповедал людям вести себя честно и благородно, дабы вернуть право на небо. После этого он изгнал их на [Concept('aeras','Эрас')|E], ибо небеса — не место для смертных."
 
 game_concept_adaric_philosophy: "Адарианская философия"
 game_concept_adaric_philosophy_desc: "Рожденное в блестящем уме своего создателя, Адара, это учение превозносит силу человеческого разума и его способность познавать мир через опыт и размышления. Наблюдение здесь ставится превыше всего, и ничто не признается истиной без прямого свидетельства.\n\nВ своем богохульном дерзновении адарианское учение отвергает священную природу как варденитских законов, так и ритуалистских ангелов, башен или языческих божков. Хотя существование столь могучих сил не раз подтверждалось на протяжении истории [Concept('aeras','Эраса')|E], Адар утверждал, что их следует считать скорее великими стихиями природы, кои обладают не большим всемогуществом, чем какой-нибудь одаренный великим даром маг. Само сотворение мира Адар приписывал умозрительному «Перводвижению» — некой неведомой и ныне покинувшей мир силе или энергии, чье слабое эхо доносится до чувств человечества в едва различимых крохах.\n\nВпрочем, поскольку само Перводвижение узреть невозможно, учение это остается лишь догадкой."
 
