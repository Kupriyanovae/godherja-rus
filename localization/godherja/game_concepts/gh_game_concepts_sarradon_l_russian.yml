 game_concept_the_worldeater:0 "Пожиратель миров"
 game_concept_worldeater:0 "Пожиратель миров"
 game_concept_the_worldeater_desc:0 "Пожиратель миров — это гаргантюанское чудовище, которое было откопано где-то в [Concept('sarradon','саррадонских')|E] просторах примерно в 144 году от И. С. Гигантское червеподобное существо из числа [Concept('godtouched_creatures','боготронутых тварей')|E], Пожиратель миров был способен пожирать целые города и уничтожил большую часть Саррадона за десять лет. Известный тем, что вызвал «Коллапс» (как аверсарианские учёные позже назовут фактическую перезагрузку культуры Саррадона во II веке), Пожиратель миров остаётся бесславно известным даже в современную эпоху.\n\nЕго кости всё ещё можно найти в Восточном Саррадоне, где, как говорят, королева Редийя Уддайир сразила чудовище и получила в награду власть над королевством Саррадон."
 
