 game_concept_sirhad:0 "Сирхад"
 game_concept_sirhad_desc:0 "Забытая реликвия времён, предшествовавших [Concept('the_decimation_of_sarradon','Халакдуну')|E], Сирхад представлял собой высокоорганизованную касту [Concept('magi','магов')|E], чья власть и влияние прочно укоренились в центральном и восточном [Concept('sarradon','Саррадоне')|E]. Их происхождение было почти мифическим — оно терялось в глубинах ранней истории Саррадона и, вероятно, предшествовало самому ритуализму. Любой саррадонец, проявивший магический потенциал, принимался в их ряды — иногда против своей воли, поскольку в Сирхаде считали, что неконтролируемые маги представляют угрозу для саррадонского общества и для авторитета касты в целом. Поскольку браки внутри Сирхада всячески поощрялись, Саррадон стал домом для большого числа очень могущественных магических династий, чьи родословные насчитывали тысячелетия. Запутанные записи об этих кровных узах хранились в величайшей цитадели Сирхада, известной ныне лишь как [Concept('sunken_house','Затонувший дом')|E]. Эта магическая твердыня была надёжно укрыта где-то в глуши Хибхибирина, защищённая от чужаков дьявольски сложными чарами и иллюзиями.\n\nВо время [Concept('war_in_heaven','Войны на небесах')|E] Сирхад удивительным образом сохранял нейтралитет в конфликте. Хотя отдельным членам дозволялось иметь свои симпатии, организация запрещала любое прямое вмешательство или покровительство с использованием внушительных ресурсов Сирхада. Любой маг, участвовавший в войне, делал это как частное лицо и не мог рассчитывать на поддержку со стороны высшего руководства. Что ещё более примечательно, эта идеалистическая беспристрастность, похоже, работала весьма эффективно, и услуги Сирхада в качестве посредников и нейтральных переговорщиков стали цениться едва ли не так же высоко, как и их магическое искусство."
 
 game_concept_mizfarun_dawl:0 "А'Мизфарун Давл"
 game_concept_mizfarun_dawl_desc:0 "Тайный культ, задействовавший свои ячейки внутри более широкой структуры [Concept('sirhad','Сирхада')|E], Мизфарун Давл действовал во множестве кабалов и региональных собраний по всему Саррадону. Посредством шпионажа, точечных убийств и расчетливых зверств они выступали в роли скрытого кинжала Сирхада, защищая его интересы и мстя за его поражения. Что ещё более зловеще, они не брезговали обращать своё внимание и внутрь организации, шантажируя или даже убивая тех магов [Concept('sirhad','Сирхада')|E], которые угрожали нарушить привычный порядок вещей. Согласно слухам, они были последователями некоего закрытого мистического культа, чьи обряды в остальном неизвестны, и направляли своё колоссальное влияние на укрепление единства и нейтралитета Сирхада в разгар бушующей [Concept('war_in_heaven','Войны на небесах')|E].\n\nТочная природа их неудачи в этой конечной задаче в годы, предшествовавшие [Concept('the_decimation_of_sarradon','Халакдуну')|E], часто становится предметом размышлений учёных, интересующихся подобными эзотерическими темами. Большинство теорий сходятся на том, что Мизфарун Давл сам в итоге пал жертвой фракционного раскола между стражниками и ритуалистами, распавшись на соперничающие ордена [Concept('magi','магов')|E]-убийц. Существует даже гипотеза, что эти два новоявленных отпочковавшихся культа приложили руку к самому [Concept('the_decimation_of_sarradon','Халакдуну')|E], помогая и потворствуя своим единоверцам в кабалах Альмади и Алькарати. Небольшое меньшинство — высмеиваемое даже в маргинальных кругах исследователей этой темы — дико утверждает, будто Мизфарун Давл никогда не раскалывался и на самом деле сам срежиссировал [Concept('the_decimation_of_sarradon','Халакдуну')|E] и последовавший за ним кошмар континентального масштаба ради собственных целей. Было ли это геноцидной попыткой положить конец [Concept('war_in_heaven','Войне на небесах')|E] путём взаимного истощения обеих сторон, побочным эффектом ещё более секретного ритуала, призванного обеспечить их вознесение на доселе неведомый духовный план, или чем-то ещё более зловещим — пророки и конспирологи никак не могут прийти к согласию."
 
