 game_concept_tarshaf_glasswork_fix:0 "Таршафские стеклянные изделия"
 game_concept_tarshaf:0 "Таршафские стеклянные изделия"
 game_concept_tarshaf_glasswork_fix_desc:0 "Собирательное понятие для широкого спектра стеклянной посуды и изделий, созданных [Concept('magi','магами')|E] и эндемичных для Саррадона, которые впервые появились примерно в X веке от И. С. Они имели различную форму и выполняли разные функции, причём первопроходцы этой техники создавали телескопы, способные достигать поразительного уровня точности. Другие способы применения были разработаны в последующем столетии: зеркала, способные в ограниченной степени перенаправлять магию, и почти небьющиеся оконные стёкла нашли своё место в домах богатых и могущественных людей по всему Саррадону. В портовом городе Фитокон изобретатель Ишеф б. Убайс даже установил экспериментальную береговую оборону, представлявшую собой массив зеркал и призм, способных перенаправлять солнечные лучи для поджога кораблей.\n\nВершина этого искусства была достигнута, когда кабал Ибрити открыл способ использовать структуру точно сработанной призмы из таршафского стекла для идеального хранения магической энергии. Они тут же использовали её, чтобы заточить в ловушку чрезвычайно могущественного местного джинна, известного как «А'Арбала» — Вдова. Имея возможность легко переносить и выпускать на волю по своему усмотрению могучего джинна Ветра, ритуалисты Ибрити истребили все соперничающие кабалы и поддержали недолговечную попытку гегемонии ритуалиста и военачальника Буласа Аль-Куддхура. \n\nКабал Ибрити распался всего через несколько лет после смерти Буласа от яда, а примерно двадцать выживших членов его внутреннего круга рассеялись по всему Восточному Саррадону. В последующие годы секреты изготовления таршафских призм распространились среди местных кабалов магов и военачальников.\n\nЭто искусство снискало дурную славу во время Кассаридских войн, когда ифриты и джинны использовались зиндарикскими военачальниками для опустошения обширных частей Восточного Саррадона. После их поражения от рук отчаянной коалиции мамуритских стражников, традиционалистских стражников и ритуалистов секреты создания таршафских призм были фактически утеряны как из-за запретов властей, так и из-за гибели многих мастеров. Это клеймо привело к тому, что даже менее опасные образцы таршафских стеклянных изделий ныне воспринимаются с подозрением и враждебностью."
 
 game_concept_djinn:0 "Джинн"
 game_concept_djinn_desc:0 "Джинны — это эфирные существа, которых можно встретить по всему Эрасу, но в особенности их много в Саррадоне — хотя ходят слухи, что некоторые регионы в [Concept('the_continent','Континентальной')|E] степи также являются домом для значительного числа этих странных сущностей. В обычных обстоятельствах джинны не представляют угрозы для тех, кто не является [Concept('magi','магом')|E], поскольку они обычно способны лишь прилагать силу, достаточную для перемещения мелких предметов. Во многих саррадонских культурах принято винить этих загадочных и невидимых духов в пропаже или краже вещей. И только получая доступ к магической энергии, они могут стать по-настоящему опасными, ибо они способны расти в силе и обретать плотность тем больше, чем большему воздействию магии они подвергаются. Лей-линии, и особенно пересечения лей-линий, являются исключительно опасными местами для встречи с диким джинном, и большинство работающих в таких зонах магов принимают серьёзные меры предосторожности, чтобы не дать им устроить хаос.\n\nДжинны, по всей видимости, разумны, и с ними можно договориться. Их чувствительность к магии также означает, что маги, обладающие должными навыками, могут при определённых усилиях подчинить их своей воле с помощью грубой магической силы. Хотя джинны почти бессмертны и большинство из них, вероятно, существуют бесчисленные тысячелетия, их воспоминания угасают относительно быстро. Даже самые осознанные из них, похоже, способны удерживать информацию не дольше века, а большинство ограничено куда меньшим сроком. Хуже того, по мере увядания памяти их характер может меняться самым радикальным образом. Многие маги встретили свою смерть, когда обнаружили, что джинн, описанный в гримуаре как дружелюбный и приветливый, за прошедшие с момента написания годы превратился в кровожадную тварь."
 
 game_concept_erimatos_assimilation:0 "Эриматосская культурная ассимиляция"
 game_concept_erimatos_assimilation_desc:0 "Небольшие общины аверсарианцев населяли берега Саррадона ещё до прихода Автократии к власти. Эриматос представляют собой смесь этих местных жителей, колонистов из самой Аверсарии и коренных саррадонских народов, у которых было заимствовано множество обычаев и практик. Несколько веков истории и целое море, отделяющее их от материковой Аверсарии, привели к тому, что они говорят на диалекте, почти непонятном для их континентальных собратьев, а смешанные браки с местными жителями означают, что даже их внешний вид неуловимо отличается от них. Хотя они всё ещё остаются аверсарианцами, они представляют собой странный сплав чужих обычаев и крови, который выделяет их среди большинства культурных родичей."
 
 game_concept_marmaladid_great_tribes:0 "Великие племена"
 game_concept_marmaladid_great_tribes_desc:0 "Традиционные мармаладидские сказания выделяют семь Великих племён, каждое из которых населено потомками детей-демиургов Мармала, Мятежной Звезды: Гвасил, Асар, Утял, Давас, Мутсар, Моримал и Нонн. Морималиды и нонниды повсеместно считаются утерянными, они больше не присутствуют или, возможно, никогда и не существовали на Эрасе. Также существуют разные версии списка полубогов Мармала, причём некоторые племена заявляют о своём происхождении от непризнанного отпрыска Мармала. Эти притязания рассматриваются либо как мошенничество, либо как свидетельство младшей побочной линии, порождённой Мармалом от меньшего созвездия, в зависимости от известности и влияния заявляющего племени."
 
 game_concept_marmaladid_invasions:0 "Мармаладидские нашествия"
 game_concept_marmaladid_invasions_desc:0 "Внезапное появление мармаладидского народа из глубин Саррадонской пустыни в начале XI века ознаменовало беспрецедентную волну кочевой экспансии на оседлые прибрежные земли Саррадона. Верхом на странных зверях и повелевая иномирной магией и демонами из самых глубоких уголков пустыни, они на протяжении почти века наводили ужас на своих врагов. В то время как традиционные стражнические державы Запада и Центра смогли выдержать этот шторм и сокрушить захватчиков, политически разобщённые земли Восточного Саррадона быстро пали под властью мармаладидов, когда те сметали всё на своём пути, покоряя земли вплоть до побережья Моря Империй во исполнение великого и древнего пророчества своего народа.\n\nАфтиры (верховные короли) мармаладидов, возглавлявшие эти нашествия, были детьми-полубогами божественного прародителя и тёзки мармаладидов; поговаривали, что они были военачальниками великой и внушающей ужас магической силы, подобной которой не видели ни до, ни после. На протяжении XI и XII веков они гибли в боях или возносились на небеса, и по сей день все они являются объектами народного поклонения среди мармаладидов наряду с более поздними саррадонскими культами и верованиями.\n\nМармаладидское единство на завоёванных восточных землях длилось недолго. Междоусобицы среди младших королей и уход божественного Джунхата в пустыню, откуда он так и не вернулся, привели к тому, что кратковременное королевство Великий Таррафент (Грёза об Океане) распалось всего за 32 года. Позже оно было воссоединено под началом военачальника Озалкеса, принявшего софоцизм внука самой Давас, и просуществовало несколько поколений как мармаладидское ритуалистское королевство, прежде чем окончательно пасть из-за усобиц между сородичами."
 
 game_concept_marmaladid_invasion_sihnimiyyah:0 "Мармаладидское нашествие в Сихнимийю"
 game_concept_marmaladid_invasion_sihnimiyyah_desc:0 "В 1011 году первое из великих мармаладидских нашествий обрушилось на Сихнимийю, когда армия доселе неизвестных кочевников, владеющих пагубной магией и скачущих на странных зверях, вырезала гарнизон в Таль-Эльмалайке в ходе внезапной атаки, после чего с диким неистовством обрушилась на города верхних равнин Бурана. Гаволд, Кабилат-Саальма и Эн-Мсуффийюн подверглись жестокому разграблению, а большая часть населения была изгнана в дикие земли, убита или уведена в плен, и больше их никто не видел.\n\nКочевники отступили обратно в пустыню, но вернулись в 1015 году, чтобы совершить налёт ещё глубже в Мамурамат. На протяжении следующих 30 лет Мамурамат отчаянно боролся, пытаясь сдержать их набеги. Хотя Эль-Кулата и её окрестности остались неприкосновенными, кочевники совершали дерзкие вылазки, оккупировав или принудив к подчинению территории вплоть до залива Тасуриа. Даже регентство Харадун было вынуждено платить унизительную дань серебром.\n\nКочевники были неостановимы, поскольку их вёл за собой обладавший великой магической силой военачальник по имени Мутсар, о котором говорили, что он был гигантом тридцати футов ростом, а его голос мог вызывать землетрясения и оползни. Где бы он ни появлялся, ни одна татталитская армия не могла выстоять против него. Хуже того, его многочисленные сыновья и дочери были такими же гигантами, как и он, и их мощь испытывала на прочность храбрость лучших из стражников, оборвав жизни многих героев. Советники и наследники Мутаршида бесконечно спорили о том, как победить их и освободить Сихнимийю от оккупации кочевников.\n\nВ конце концов именно $Ista_S_im$, часто игнорируемый и начитанный сын Мутаршида, предложил созвать магов-инженеров из многочисленных коллегий Эль-Кулаты, чтобы вырвать контроль над содрогающейся землёй из рук гиганта и его родичей. Поначалу советники его отца отвергли эту идею как шутку, ведь никому и в голову не приходило использовать книжных магов из Школы Проявлений с их навыками в Аркане Камня для столь военных целей. Когда большинство его хулителей погибли во время трагедии с оползневой засадой в 1045 году, немногие оставшиеся в совете мудрецы уступили планам $Ista_S_im$.\n\nЭто привело к Битве Вопиющей Земли в 1047 году, где кочевники и их ложный бог были поглощены землёй, а их мощь была сломлена хором магов, призванных из коллегий Проявлений Эль-Кулаты, пусть и огромной ценой."

 #EVENTS
 
 game_concept_war_in_heaven:0 "Война на небесах"
 game_concept_war_in_heaven_desc:0 "Война на небесах — это жестокий конфликт, длившийся без малого 1000 лет между [Concept('wardenism','стражниками')|E] и [Concept('ritualism','ритуалистами')|E] с 296 года от И. С. (с возвышения Первого Стража) по 1237 год от И. С. (до падения последнего независимого правителя-ритуалиста). Хотя в этой войне участвовали десятки различных сторон множества самых разных вероисповеданий, которые то возвышались, то падали, выступая на стороне одной из фракций (или обеих сразу, или ни одной), главный конфликт всегда вращался вокруг военачальников ритуалистской и стражнической веры.\n\nВойна была чрезвычайно ожесточённой и принесла повсеместные опустошения в [Concept('sarradon','Саррадон')|E]. Хотя в разгар конфликта на континенте и бывали периоды подъёма, они всегда быстро заканчивались возобновлением военных действий. Использование [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E] соперничающими кабалами [Concept('magi','магов')|E] Курати и Альмади привело к фактическому концу процветания Сaррадона, уничтожив 80% популяции магов и миллионы других людей.\n\n«Война» (которая на самом деле представляла собой десятки более мелких конфликтов на протяжении этого периода) начала подходить к концу с прибытием в 1144 году от И. С. агионистских, [Concept('marchers','шевальена')|E] и [Concept('aversaria','аверсарианских')|E] купцов и наёмников из [Concept('the_continent','Великой Аверсарии')|E]. Северяне изначально открыли несколько торговых постов и вдохнули новую жизнь в континент, всё ещё восстанавливающийся после разрушений, вызванных самовоспроизводящейся магией крови. Поначалу они просто скупали всё больше и больше земли, но затем начали значительно расширять своё влияние, напрямую отнимая земли у саррадонцев. Война официально завершилась в 1233 году от И. С. осадой Кармуза, последней свободной крепости ритуалистской веры в Саррадоне. Хотя последовавшая (и частично шедшая параллельно) [Concept('saints_war','Война святых')|E] иногда рассматривается как продолжение войны, большинство саррадонских учёных видят в ней отдельный и новый конфликт."
 
 game_concept_halakdun:0 "Халакдун"
 game_concept_the_decimation:0 "Децимация"
 game_concept_the_decimation_of_sarradon:0 "Децимация Саррадона"
 game_concept_the_decimation_of_sarradon_desc:0 "Название, данное опустошению, вызванному [Concept('selfreplicating_blood_magic','самовоспроизводящейся магией крови')|E] в Саррадоне в 802 году от И. С., когда кабалы [Concept('magi','магов')|E] Курати и Альмади обрушили друг на друга чудовищное колдовство в попытке жестоко завершить [Concept('war_in_heaven','Войну на небесах')|E]. Хотя [Concept('ritualism','ритуалисты')|E], судя по всему, пострадали больше в последовавшем хаосе, мало кто среди [Concept('wardenism','стражников')|E] мог счесть это победой, поскольку миллионы людей погибли в общеконтинентальном пожаре, оставившем обе фракции израненными и сломленными. Период всеобщего хаоса, последовавший за этим, известен просто как [Concept('the_downfall','Падение')|E]."
 
 game_concept_the_downfall:0 "Падение"
 game_concept_downfall_sarradon:0 "Падение"
 game_concept_the_downfall_desc:0 "Период хаоса и анархии в масштабах всей цивилизации, последовавший за [Concept('the_decimation_of_sarradon','Халакдуном')|E]; точные временные рамки этой эпохи неясны, поскольку разные регионы Саррадона возвращались к стабильности в разное время. Независимо от точных сроков, этот период ознаменовался тем, что общества по всему южному континенту радикально перековывались в горниле хаотичных войн и голода. Пожалуй, наиболее примечательно то, что смерть последнего восточного [Concept('mamuramat','мамура')|E] аль-Худи и всей его семьи, кроме дочери [Concept('sanad','Санад')|E], во время [Concept('the_decimation_of_sarradon','Децимации')|E] привела к тому, что Центральный Мамурамат поглотил своего последнего соперника в борьбе за власть над [Concept('wardenism','стражнической')|E] верой, фундаментально изменив облик религии [Concept('the_first_warden','Первого Стража')|E] в грядущую эпоху. Со своей стороны, Центральный Мамурамат столкнулся с собственным кризисом: мамур Юсар — маг исключительно примечательной силы, переживший Халакдун, — сошёл с ума от лучевой болезни и в итоге был убит своим сыном [Concept('tathtali','Таттали')|E] после кровопролитной гражданской войны."
 
 game_concept_battle_of_the_mubaaizun_fix:0 "Битва мубаризунов"
 game_concept_battle_of_the_mubaaizun_fix_desc:0 "В 656 году от И. С. армии [Concept('khuzaima_al_zuhra','Хузаймы аль-Зухры')|E] встретились с [Concept('wardenism','стражнической')|E] армией Насира ибн Насира на полях Ад-Воджессина, где Насир ибн Насир выехал перед армией Хузаймы и вызвал его [Concept('mubaaizun','мубаризунов')|E] на поединок. [Concept('fihr_ibn_kilab_ibn_zayd','Фихр ибн Килаб ибн Зайд')|E], первый среди мубаризунов Хузаймы, принял вызов и сразился с Насиром ибн Насиром, обезглавив его через минуту после начала дуэли. Собственные чемпионы Насира ибн Насира — Юкуб ибн Хасан, Джафар аль-Сарлата, Сулейман ибн Юсуф, Азиз Столпник и Хаким ибн Насир — один за другим вызвали Фихра на одиночный бой. Сразив каждого из них, Фихр отрубил им головы и потребовал, чтобы вышли новые бойцы, и, несмотря на ранения, полученные им во время дуэлей, больше никто не осмелился бросить ему вызов.\n\nПосле завершения дуэлей силы Хузаймы пошли в атаку на стражников и едва не обратили их в бегство, хотя знаменосец Галиб сумел сплотить стражников. Этот отпор был недолгим: Хузайма со свитой разбил вражескую кавалерию, развернулся и атаковал стражников с тыла. В завязавшейся суматохе Хузайма был сброшен с лошади и сломал ногу, но силы стражников были разгромлены и понесли тяжелые потери.\n\nС тех пор эта битва стала одной из самых знаменитых в [Concept('sarradon','саррадонской')|E] истории, главным образом из-за необычайно большого количества дуэлей между мубаризунами, что привело к тому, что и [Concept('ritualism','ритуалисты')|E], и стражники романтизируют её. Ни Хузайма, ни Насир не применили каких-либо интересных стратегий, и битва редко изучается."
 
 game_concept_battle_of_sulaymaniyan_fix:0 "Битва при Сулейманияне"
 game_concept_battle_of_sulaymaniyan_fix_desc:0 "Битва при Сулейманияне произошла в 658 году, когда [Concept('ritualism','ритуалистский')|E] военачальник [Concept('khuzaima_al_zuhra','Хузайма аль-Зухра')|E] двинулся на поселение, чтобы вернуть его для местного сулейманийского населения. Находившийся под контролем [Concept('wardenism','стражников')|E] Хузайма по пути к поселению трижды попадал в засады, устроенные Халидом аль-Асиром, который сеял хаос в лагере Хузаймы и нанёс ему огромные потери. Хотя Хузайма помышлял об отступлении, большая часть его оставшейся армии состояла из фанатиков-затанийцев, которые подняли бы мятеж или массово дезертировали в случае отхода — не говоря уже о том, что величайший из его [Concept('mubaaizun','мубаризунов')|E], [Concept('fihr_ibn_kilab_ibn_zayd','Фихр ибн Килаб ибн Зайд')|E], сам был затанийцем.\n\nХузайма продолжил свой путь к Сулейманияну, где начал осаду поселения. Халид аль-Асир совершал множество ночных налётов на Хузайму вплоть до второй недели осады, когда он сошёлся с военачальником в полевом сражении. Хузайма был ранен в горло лучником Хазизом ибн Карехом, а величайший чемпион Хузаймы — Фихр — мгновение спустя либо умер от горя, либо пал на собственный меч. Хотя затанийские воины и мубаризуны Хузаймы сражались до смерти, остальная часть его армии быстро бежала с поля боя.\n\nПосле битвы Халид велел похоронить ритуалистов, отправив тело Хузаймы обратно в [Concept('black_confederation','Чёрную конфедерацию')|E], однако отрубил голову Фихра и оставил её себе в качестве трофея."
 
 game_concept_the_judgement_of_the_magi:0 "Суд над магами"
 game_concept_the_judgement_of_the_magi_desc:0 "Суд над магами был внутренним переворотом, организованным мамуром Кахиром против влиятельных [Concept('aversaria','аверсарианских')|E] [Concept('magi','магов')|E], которые консультировали его деда и начали предпринимать всё более агрессивные попытки превратить Кахира в политическую марионетку. В 1187 году от И. С. Кахир приказал своим магам взять штурмом дворец, а армии — занять Рыночный квартал (традиционно служивший домом для районов, наиболее излюбленных иностранными купцами и другими выходцами из-за пределов Саррадона, решившими обосноваться здесь). Все, кто оказал сопротивление — как это сделали многие аверсарианские маги во дворце, — были убиты в бою или казнены сразу после усмирения. Те, кто не оказал сопротивления, были доставлены в Верховный суд.\n\nТам под личным присмотром Кахира их заставили подписать присягу, провозглашающую вражду с аутократором и объявляющую их врагами каждого отдельного воинствующего ордена. Любой, кто отказывался сделать это, в свою очередь приговаривался к смерти — задачу по казни затем заставляли выполнять тех аверсарианцев, которые решили подписать присягу. В общей сложности в ту ночь погибло около двух тысяч человек из трехтысячного аверсарианского населения столицы. Мать Кахира, сама бывшая аверсарианкой, была фактически принуждена к домашнему аресту и уединению до конца своих дней.\n\n[Concept('chevalie','Маркийцы')|E] и представителей других национальностей, попавших под облаву в Рыночном квартале, в ту ночь также заставили подписать присягу, но как только стало ясно, что Кахир мало заинтересован в них, они не отнеслись к этому вполне серьёзно. Отчёт о заседаниях, составленный судебным писцом, включает несколько моментов, когда верховные судьи были вынуждены призывать к тишине из-за насмешек и хохота маркийцев, которые решили остаться, чтобы посмотреть на последующие казни."

