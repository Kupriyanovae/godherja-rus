 game_concept_tarshaf_glasswork_fix: "Таршафские стеклянные изделия"
 game_concept_tarshaf: "Таршафские стеклянные изделия"
 game_concept_tarshaf_glasswork_fix_desc: "Так называют удивительную стеклянную посуду и утварь, созданную [Concept('magi','магами')|E] и встречающуюся только в Саррадоне. Первые такие вещи появились примерно в X веке от И. С. Мастера придавали им разную форму и назначение: первопроходцы этого дела собирали подзорные трубы поразительной точности. В следующем столетии чародеи нашли стеклу новое применение. В домах богачей и правителей по всему Саррадону появились зеркала, способные отводить чужие заклятия, и почти небьющиеся оконные стекла. А в портовом городе Фитокон изобретатель Ишеф б. Убайс даже воздвиг на благо города хитроумную защиту — целую сеть из зеркал и призм, которые собирали солнечные лучи и сжигали вражеские корабли.\n\nВершины это искусство достигло, когда кабал Ибрити отыскал способ заключать колдовскую силу внутрь безупречно ограненной таршафской призмы. С помощью этого чародейства они пленили А'Арбалу, Вдову — могущественного местного джинна Ветра. Получив власть в любой момент выпускать на волю ярость бури, ритуалисты Ибрити истребили всех соперников и помогли военачальнику Буласу Аль-Куддхуру ненадолго захватить власть над краем.\n\nОднако кабал Ибрити распался всего через несколько лет после того, как Булас погиб от яда. Двадцать уцелевших мастеров из тайного круга рассеялись по всему Восточному Саррадону, и в последующие годы секрет создания таршафских призм разошелся среди местных магов и князей.\n\nДурную и кровавую славу это ремесло снискало во время Кассаридских войн, когда зиндарикские правители напускали ифритов и джиннов на цветущие земли Восточного Саррадона, предавая их опустошению. Когда же захватчики пали под натиском союза мамуритских варденитов, хранителей древних традиций и вольных магов, секрет изготовления призм был утрачен — частью из-за строгих запретов новых властей, частью из-за гибели самих мастеров. С тех пор на любые, даже самые безобидные изделия из таршафского стекла люди смотрят с глубоким подозрением и страхом."
 
 game_concept_djinn: "Джинн"
 game_concept_djinn_desc: "Джинны — бесплотные создания, встречающиеся по всему Эрасу, но больше всего их в Саррадоне (хотя поговаривают, будто в [Concept('the_continent','Континентальной')|E] степи их тоже немало). Для обычного человека дикий джинн не опасен, ведь без посторонней помощи он едва ли способен сдвинуть с места мелкую вещицу. В саррадонских землях на этих невидимых духов принято списывать любую пропажу или кражу. Но все меняется, если джинн доберется до колдовской силы: впитывая магию, они обретают плоть и становятся по-настоящему грозными. Места, где сходятся незримые жилы земли — лей-линии — таят в себе смертельную угрозу, и любой разумный чародей берется за работу там лишь с оглядкой на то, чтобы не разбудить спящих духов.\n\nДжинны разумны, и с ними можно договориться. Впрочем, из-за их чуткости к магии искусный чародей может подчинить духа своей воле грубой силой. И хотя джинны бессмертны и живут тысячелетиями, память их коротка. Даже самые мудрые из них помнят прошлое от силы один век, а большинство забывает все куда быстрее. Хуже того, растеряв воспоминания, дух может полностью перемениться нравом. Не один маг нашел свою гибель, когда призванный им джинн, описанный в старинных книгах как мирный и приветливый, за прошедшие столетия превратился в кровожадное чудовище."
 
 game_concept_erimatos_assimilation: "Эриматосские переселенцы"
 game_concept_erimatos_assimilation_desc: "Небольшие общины аверсарианцев обживали побережье Саррадона еще задолго до того, как Аавтократия набрала силу. Народ эриматос родился от смешения этих первых поселенцев, колонистов из самой Аверсарии и коренных саррадонских племен, у которых они переняли множество обычаев. Столетия обособленной жизни и целое море, отделившее их от родины, привели к тому, что теперь они говорят на собственном наречии, едва понятном жителям материка. А из-за браков с местными уроженцами даже лицом и статью они стали неуловимо отличаться от родичей. И пусть кровью они все еще остаются аверсарианцами, этот причудливый сплав чужих традиций и местной крови превратил их в совершенно особый народ."
 
 game_concept_marmaladid_great_tribes: "Великие племена"
 game_concept_marmaladid_great_tribes_desc: "Древние сказания мармаладидов гласят, что изначально существовало семь Великих племен, и каждое вели свой род от полубогов — детей Мармала, Мятежной Звезды: Гвасил, Асар, Утял, Давас, Мутсар, Моримал и Нонн. Ныне считается, что племена Моримал и Нонн навсегда утеряны; они либо исчезли с лица Эраса, либо и вовсе существовали лишь в легендах. Вдобавок у разных кланов списки детей Мармала разнятся: порой то или иное племя заявляет права на родство с безвестным отпрыском божества. К подобным речам относятся по-разному — их почитают за обман или же видят в них младшую, побочную ветвь рода, рожденную Мармалом от какого-то малого созвездия, смотря по тому, насколько богато и влиятельно заявившее о себе племя."
 
 game_concept_marmaladid_invasions: "Мармаладидские нашествия"
 game_concept_marmaladid_invasions_desc: "В начале XI века из самого сердца Саррадонской пустыни внезапно хлынули кочевники-мармаладиды. Это положило начало небывалой волне завоеваний, обрушившейся на мирные прибрежные города. Почти сто лет они держали соседей в страхе: кочевники шли в бой на диковинных зверях и повелевали жуткой чужеродной магией и демонами, призванными из глубин песчаных дюн. На западе и в центре Саррадона древние государства варденитов сумели сплотиться, выдержать этот натиск и разбить захватчиков. Однако раздробленный Восточный Саррадон быстро пал под копыта мармаладидских коней. Завоеватели сметали все на своем пути, дойдя до самого Моря Империй ради исполнения древнего пророчества.\n\nАфтиры — верховные владыки мармаладидов, ведшие войска в бой, — приходились детьми божественному прародителю Мармалу. Рассказывали, что они обладали сокрушительной колдовской силой, подобной которой мир не видел ни до, ни после. На протяжении XI и XII веков все они либо пали в сражениях, либо вознеслись на небеса, и по сей день кочевники почитают их наравне со святыми.\n\nВпрочем, согласия среди мармаладидов на завоеванных землях не было. Распри между младшими вождями и уход божественного Джунхата обратно в пустыню привели к тому, что их недолговечное королевство Великий Таррафент, прозванное Грезой об Океане, распалось всего за 32 года. Позже его вновь собрал под своей рукой военачальник Озалкес, принявший веру софоцитов внук самой Давас. Это колдовское королевство продержалось еще несколько поколений, пока окончательно не сгорело в огне междоусобных войн."
 
 game_concept_marmaladid_invasion_sihnimiyyah: "Нашествие мармаладидов в Сихнимийю"
 game_concept_marmaladid_invasion_sihnimiyyah_desc: "В 1011 году первый сокрушительный удар мармаладидской орды пришелся на Сихнимийю. Воинство безвестных доселе кочевников, владевших черной магией и скакавших на диковинных зверях, налетело на крепость Таль-Эльмалайк и вырезало весь гарнизон, после чего огненным вихрем прошлось по городам верхних равнин Бурана. Гаволд, Кабилат-Саальма и Эн-Мсуффийюн были безжалостно разграблены, а местных жителей угнали в рабство или перебили — больше их никто не видел.\n\nКочевники ушли обратно в пески, но вернулись в 1015 году, добравшись уже до самого Мамурамата. Следующие тридцать лет край отчаянно боролся, пытаясь сдержать эти набеги. И хотя Эль-Кулату врагам взять не удалось, кочевники хозяйничали вплоть до залива Тасуриа, а правители Харадуна были вынуждены платить им унизительную дань серебром.\n\nОрда казалась неостановимой, ведь вел ее могучий колдун и вождь по имени Мутсар. В народе болтали, будто он был великаном в тридцать футов ростом, а от его громоподобного голоса дрожала земля и рушились скалы. Ни одно татталитское войско не могло устоять перед ним. Хуже того, его сыновья и дочери уродились такими же гигантами, и их ярость унесла жизни множества лучших витязей варденитов. Старейшины и наследники правителя Мутаршида проводили дни в бесконечных спорах о том, как сокрушить чудовищ и освободить Сихнимийю.\n\nСпасение пришло откуда не ждали: $Ista_S_im$, тихий и начитанный сын Мутаршида, которого никто не принимал всерьез, предложил призвать магов-инженеров из коллегий Эль-Кулаты. Он задумал с помощью их чар вырвать саму землю из-под ног великана. Поначалу советники отца лишь посмеялись над царевичем, ведь никому и в голову не приходило посылать книжных чернокнижников из Школы Проявлений, смыслящих лишь в магии Камня, на настоящую войну. Но когда в 1045 году большая часть этих советников сгинула в оползне, устроенном кочевниками, выжившие мудрецы согласились на план юноши.\n\nТак в 1047 году грянула Битва Вопиющей Земли. Сводный хор магов, призванных из коллегий Эль-Кулаты, заставил твердь разверзнуться. Ценой огромных жертв кочевники и их грозный вождь были заживо погребены в бездне, а мощь мармаладидской орды оказалась сломлена навсегда."

 game_concept_realm_above: "Realm Above"
 game_concept_realm_above_desc: "The Realm Above in Marmaladid stories refers to the home of Marmal the Rebel Star and other deities in the wider Shuraebada pantheon."

 game_concept_marmaladid_chosen_magi: "Chosen Magi"
 game_concept_marmaladid_chosen_magi_desc: "In the Talita Namit faith, chosen [magi|E] were traditionally identified by cabals clad in radiant blue, who were known to travel among the Marmaladid tribes of the desert for many long centuries serving as advisors and teachers. Curiously, despite demonstrating considerably skill in magic themselves, these [magi|E] kept themselves at a distance, never claiming the role of Chosen Magi for themselves.\n\nWith the sudden disappearance of these strangers in the devastation of the [Concept('the_decimation_of_sarradon','Halakdun')|E] - almost certainly having been consumed along with the majority of Sarradon's Magi - the once-careful procession of Chosen Magi collapsed almost overnight. It took merely a year for the first [magi|E] to declare herself Chosen, and she was slain a year later by an alliance of two separate competitors to that title who quickly fell to infighting amongst themselves. Generations of ensuing struggles would see the Talita Namit fade and splinter, as individual Chosen Magi would splinter their followers off into cults of personality driven by their own ideals; many other tribes would abandon the faith entirely in the face of the depredations of power-mad [magi|e] who could not, in any just world, be called Chosen."

 game_concept_sand_skiffs: "Sand-Skiffs"
 game_concept_sand_skiffs_desc: "Sand-Skiffs are an ancient and nearly forgotten technological craft rarely found amongst the nomadic desert clans of [sarradon|E]. Capable of traversing the desert at incredible speeds, the construction of sand-skiffs has long since become a forgotten art, leaving those still around and their maintenance to be closely guarded secrets of the clans that possess them."

 #EVENTS
 
 game_concept_war_in_heaven: "Война на небесах"
 game_concept_war_in_heaven_desc: "Война на небесах — жестокая распря, терзавшая мир без малого тысячу лет. Конфликт между [Concept('wardenism','варденитами')|E] и [Concept('ritualism','ритуалистами')|E] вспыхнул в 296 году от И. С. с возвышением Первого Вардена и угас лишь в 1237 году со сведением в могилу последнего вольного ритуалистского владыки. В это пожарище были втянуты десятки племен и царств самых разных вероисповеданий. Они крепли и гибли, примыкая то к одной стороне, то к другой, а порой сражаясь против всех — но в сердце бури всегда стояли полководцы варденитской и ритуалистской веры.\n\nВойна велась нещадно и превратила цветущий [Concept('sarradon','Саррадон')|E] в пепелище. Если на южном материке и наступали редкие годы мира, они тут же сменялись новыми битвами. Роковой чертой для края стало безумие чародеев: соперничающие кабалы [Concept('magi','магов')|E] Курати и Альмади выпустили на волю [Concept('selfreplicating_blood_magic','самовоспроизводящуюся магию крови')|E]. Это проклятие сгубило восемь из десяти чародеев континента и унесло жизни миллионов простых людей, положив конец былому величию Саррадона.\n\nВек за веком война распадалась на десятки мелких усобиц, пока в 1144 году от И. С. к берегам Саррадона не причалили корабли северян — купцов и наемников из [Concept('the_continent','Великой Аверсарии')|E], среди которых были агионисты и [Concept('marchers','шевалье')|E]. Поначалу чужеземцы открывали лишь торговые подворья, возвращая жизнь в истерзанные магией крови земли. Но вскоре они стали скупать все больше угодий, а затем и вовсе принялись силой отнимать земли у саррадонцев. Последняя точка в долгой войне была поставлена в 1233 году от И. С., когда пала осада Кармуза — последнего оплота свободных ритуалистов. И хотя вспыхнувшая следом [Concept('saints_war','Война святых')|E] порой считается отголоском былых сражений, саррадонские летописцы говорят о ней как о совершенно новой эпохе."
 
 game_concept_halakdun: "Халакдун"
 game_concept_the_decimation: "Децимация"
 game_concept_the_decimation_of_sarradon: "Децимация Саррадона"
 game_concept_the_decimation_of_sarradon_desc: "Так называют великое опустошение Саррадона в 802 году от И. С., вызванное [Concept('selfreplicating_blood_magic','самовоспроизводящейся магией крови')|E]. Тогда кабалы [Concept('magi','магов')|E] Курати и Альмади обрушили друг на друга запретное колдовство, надеясь одним ударом завершить [Concept('war_in_heaven','Войну на небесах')|E]. В черном вихре больше прочих пострадали [Concept('ritualism','ритуалисты')|E], однако и среди [Concept('wardenism','варденитов')|E] никто не праздновал победу. Общеконтинентальный пожар пожрал миллионы жизней, оставив обе фракции обескровленными и сломленными. Наступившее после этого безвременье и анархию люди назвали просто — [Concept('the_downfall','Падение')|E]."
 
 game_concept_the_downfall: "Падение"
 game_concept_downfall_sarradon: "Падение"
 game_concept_the_downfall_desc: "Эпоха хаоса и беззакония, охватившая всю цивилизацию после [Concept('the_decimation_of_sarradon','Халакдуна')|E]. Времена эти были столь смутными, что летописцы расходятся в датах, ведь порядок возвращался в земли Саррадона неравномерно. Горнило голода и нескончаемых войн навсегда перековало народы южного материка. Самым важным потрясением в те дни стала гибель последнего восточного [Concept('mamuramat','мамура')|E] аль-Худи и всего его рода во время [Concept('the_decimation_of_sarradon','Децимации')|E]. В живых осталась лишь его дочь [Concept('sanad','Санад')|E], из-за чего Центральный Мамурамат подчинил себе последних соперников в споре за главенство над [Concept('wardenism','варденитской')|E] верой, что навсегда изменило облик Церкви [Concept('the_first_warden','Первого Warden`а')|E]. Впрочем, сам Центральный Мамурамат тоже едва не погиб: мамур Юсар, чародей редкой силы, переживший Халакдун, сошел с ума от терзавшего его тело недуга магов и в конце концов был убит собственным сыном [Concept('tathtali','Таттали')|E] в ходе кровопролитной междоусобицы."
 
 game_concept_battle_of_the_mubaaizun_fix: "Битва мубаризунов"
 game_concept_battle_of_the_mubaaizun_fix_desc: "В 656 году от И. С. армия [Concept('khuzaima_al_zuhra','Хузаймы аль-Зухры')|E] сошлась с [Concept('wardenism','варденитским')|E] воинством Насира ибн Насира на полях Ад-Воджессина. Еще до начала сечи Насир выехал вперед и громогласно вызвал лучших [Concept('mubaaizun','мубаризунов')|E] Хузаймы на честный бой. [Concept('fihr_ibn_kilab_ibn_zayd','Фихр ибн Килаб ибн Зайд')|E], первый среди чемпионов Хузаймы, принял вызов и отсек Насиру голову спустя минуту после начала схватки. Тогда лучшие витязи Насира — Юкуб ибн Хасан, Джафар аль-Сарлата, Сулейман ибн Юсуф, Азиз Столпник и Хаким ибн Насир — один за другим бросились в бой, желая отомстить за своего вождя. Сразив каждого из них, израненный Фихр швырял их головы к ногам соратников и требовал новых соперников, но более никто не посмел поднять на него клеймо.\n\nКогда дуэли утихли, воодушевленные воины Хузаймы ринулись в атаку и едва не обратили врага в бегство, хотя знаменосец Галиб на время сплотил ряды варденитов. Этот отпор был недолгим: Хузайма со своей конной свитой смял вражескую кавалерию, зашел в тыл и обрушился на пехоту. В завязавшейся свалке под Хузаймой убили коня, и вождь сломал ногу, но вардениты все равно были наголову разбиты и понесли страшные потери.\n\nС тех пор этот день почитается как один из самых славных в [Concept('sarradon','саррадонских')|E] преданиях. Из-за невиданного числа поединков и [Concept('ritualism','ритуалисты')|E], и вардениты вовсю романтизируют эту битву. Полководцы не проявили в ней особого тактического таланта, поэтому военные мудрецы редко изучают её ход."
 
 game_concept_battle_of_sulaymaniyan_fix: "Битва при Сулейманияне"
 game_concept_battle_of_sulaymaniyan_fix_desc: "Битва при Сулейманияне отгремела в 658 году, когда [Concept('ritualism','ритуалистский')|E] вождь [Concept('khuzaima_al_zuhra','Хузайма аль-Зухра')|E] двинул полки на город, чтобы вернуть его местным сулейманийцам. Дорога была тяжелой: варденитский военачальник Халид аль-Асир трижды устраивал засады на пути Хузаймы, сея панику и истребляя его людей. Хузайма уже подумывал о том, чтобы повернуть назад, но костяк его уцелевшего войска составляли неистовые фанатики-затанийцы, которые подняли бы бунт или разбежались прикажи он отступать — к тому же величайший из его [Concept('mubaaizun','мубаризунов')|E], [Concept('fihr_ibn_kilab_ibn_zayd','Фихр ибн Килаб ибн Зайд')|E], сам был из затанийцев.\n\nХузайма довел войско до стен Сулейманияна и осадил город. Халид аль-Асир изматывал осаждающих дерзкими ночными вылазками, пока на исходе второй недели не вывел свои силы для открытого боя. В разгар сражения стрела лучника Хазиза ибн Кареха пробила горло Хузайме, а миг спустя его верный чемпион Фихр — то ли от горя, то ли не желая пережить господина — бросился на собственный меч. И хотя затанийские фанатики и мубаризуны Хузаймы бились до последнего вздоха, остальное воинство в ужасе бежало с поля.\n\nПосле победы Халид велел похоронить павших ритуалистов по обычаю и отослал тело Хузаймы обратно в [Concept('black_confederation','Черную конфедерацию')|E], однако голову Фихра приказал отсечь и оставил себе как знак воинской доблести."
 
 game_concept_the_judgement_of_the_magi: "Суд над магами"
 game_concept_the_judgement_of_the_magi_desc: "Суд над магами — так назвали тайный переворот, который мамур Кахир устроил против влиятельных [Concept('aversaria','аверсарианских')|E] [Concept('magi','магов')|E], что давали советы еще его деду и прибрали к рукам слишком много власти, пытаясь превратить молодого правителя в покорную куклу. В 1187 году от И. С. Кахир приказал верным чародеям взять штурмом покои дворца, а верным полкам — занять Рыночный квартал, где исстари селились иноземные купцы и прочие выходцы из Аверсарии. Все, кто обнажил оружие, погибли на месте, прочие же были закованы и доставлены на Верховный суд.\n\nТам под личным взором Кахира чародеев принудили подписать клятву, объявлявшую их врагами автократа и всех воинствующих орденов Аверсарии. Всякого, кто отказывался, тут же обрекали на плаху, причем приводить приговор в исполнение заставляли тех сородичей, кто согласился присягнуть мамуру. В ту ночь погибло около двух тысяч душ из трехтысячного аверсарианского колена столицы. Мать Кахира, сама родом из Аверсарии, была до конца дней заперта в дальних покоях дворца.\n\n[Concept('chevalie','Марочников')|E] и других чужеземцев, схваченных в Рыночном квартале, в ту ночь тоже заставили дать клятву. Однако, смекнув, что до них Кахиру нет дела, они отнеслись к обряду без всякого почтения. В судебных свитках писец не раз отмечал, что верховные судьи стучали жезлами, требуя тишины, дабы заглушить насмешки и хохот марочников, которые остались поглазеть на казни."

 #CHARACTERS
 
 game_concept_the_worldeater: "Пожиратель миров"
 game_concept_worldeater: "Пожиратель миров"
 game_concept_the_worldeater_desc: "Пожиратель миров — исполинское чудище, откопанное в [Concept('sarradon','саррадонских')|E] землях примерно в 144 году от И. С. Гигантская червеподобная тварь из числа [Concept('godtouched_creatures','боготронутых созданий')|E], Пожиратель миров мог заглатывать целиком людские города и за десять лет предал опустошению большую часть Саррадона. Навек запомнившийся тем, что вызвал Крушение (как аверсарианские летописцы позже назвали полный упадок и перелом в культуре Саррадона во II веке), Пожиратель миров пользуется дурной славой и по сей день.\n\nЕго огромные кости до сих пор находят в Восточном Саррадоне. Предания гласят, что именно там королева Редийя Уддайир сразила чудовище, получив в награду власть над всем саррадонским царством."
 
