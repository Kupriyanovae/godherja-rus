 game_concept_sunken_house:0 "Затонувший дом"
 game_concept_sunken_house_desc:0 "Один из самых знаменитых оплотов Сирхада, Затонувший дом использовался для защиты наиболее опасных тайн и критически важных ресурсов организации. Он считался абсолютно неприступным не только благодаря своим хитроумным чарам и защите, но и потому, что был надёжно укрыт в самых глухих глубинах пустыни. Не сохранилось ни одного свидетельства, дающего хотя бы малейший намёк на его местонахождение или внешний вид, ибо считается, что магистры Сирхада с помощью магии привязали теней к задаче выслеживать и пожирать любые письменные труды, в которых доподлинно описывалась эта крепость.\n\nЗатонувший дом также оберегал большую часть архивов Сирхада и имел решающее значение для поддержания их прочной сплочённости. Хотя ключи для доступа в него получали лишь единицы избранных, благодаря череде ныне утраченных заклинаний хранители этой цитадели могли оставаться на постоянной связи с остальной частью Сирхада, как бы далеко те ни находились.\n\nДом стал ещё одной жертвой краха Сирхада, хотя благодаря тщательно поддерживаемому карантину считается, что Кровавая порча его не коснулась. Вместо этого в течение трёх дней перед тем, как всякая связь прервалась, члены Сирхада зафиксировали получение серии всё более панических и бессвязных депеш от своих информаторов внутри цитадели, которые предостерегали их от попыток войти и бредили о некоем призрачном анималистичном охотнике, именуемом не иначе как «Тварь».\n\nНесмотря на столь зловещий финал его известной истории, поиски и разграбление Затонувшего дома остаются неизменной мечтой охотников за сокровищами, авантюристов, изгнанников и простых бандитов по всему Саррадону и за его пределами. Вопреки их лучшим и самым смелым усилиям, уже более полутысячелетия никто не лицезрел эту цитадель — или, по крайней мере, никто не сделал этого и не вернулся, чтобы рассказать об увиденном."
 
 game_concept_disuwai:0 "Метрополия Дисувай"
 game_concept_disuwai_desc:0 "Основанный западным [Concept('mamuramat','мамуром')|E] Махой в 542 году, Дисувай вырос как торговый порт, чьи купцы набивали карманы богатствами, текущими от торговли с амсарийцами и кемсарийцами на далёком западе. Даже разграбление города айярами не смогло остановить его рост. Тем не менее город, скорее всего, остался бы лишь малозаметным примечанием в анналах, если бы не события, которые на короткое время катапультировали его в центр внимания всего [Concept('wardenism','стражнического')|E] мира — Катситский раскол."
 
