 game_concept_mubaaizun: "Мубаризун"
 game_concept_mubaaizun_desc: "Мубаризун — это чемпион [Concept('sarradon','саррадонского')|E] воинства. Зачастую лучшие воины владыки сходятся в ритуальном поединке насмерть еще до начала битвы. Эти дуэли сопровождаются тем, что оба войска скандируют боевые кличи или выкрикивают оскорбления в адрес врага. История помнит случаи — например, [Concept('battle_of_the_mubaaizun_fix','битву мубаризунов')|E], — когда перед сражением гремело сразу несколько поединков, и воины выходили на бой один за другим, чтобы отомстить за павшего товарища.\n\nБегство с дуэли не считается позором, если мубаризун понимает, что повержен. Победитель же может преследовать беглеца лишь до определенной черты, после чего обязан отступить. Эти схватки до глубины души потрясают воинство: бывало, что исход дуэли и вовсе заставлял армии разойтись без пролития крови. Стать чемпионом может любой, кто способен держать оружие, и некоторые полководцы сами вставали под знамена в роли собственных мубаризунов. По традиции они не знаются с [Concept('magi','магией')|E] и чаще всего предстают искусными мечниками, облаченными в роскошные именные доспехи.\n\nОбычай этот угас с приходом [Concept('aversaria','аверсарианцев')|E]. Большинство их военачальников не желают чтить традиции [Concept('sarradon','саррадонцев')|E] и назначать чемпионов, хотя из этого правила и по сей день есть редкие исключения."
 
