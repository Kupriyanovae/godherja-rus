 game_concept_sirhad: "Сирхад"
 game_concept_sirhad_desc: "Забытая святыня времен, предшествовавших [Concept('the_decimation_of_sarradon','Халакдуну')|E], Сирхад представлял собой сплоченное и могущественное сословие [Concept('magi','магов')|E], чья власть прочно укоренилась в центральных и восточных землях [Concept('sarradon','Саррадона')|E]. Происхождение их казалось почти мифическим — оно терялось в тумане ранней истории материка и, по всей видимости, предвосхитило сам ритуализм. Любого саррадонца, в ком просыпался дар к чародейству, забирали в их ряды — порой и против воли, ибо старейшины Сирхада верили, что вольные маги несут лишь беды простому люду и угрожают незыблемой власти самого ордена. Поскольку браки внутри сословия всячески поощрялись, Саррадон стал колыбелью для великих чародейских династий, чьи родословные насчитывали тысячи лет. Запутанные свитки об этих кровных узах береглись в величайшей цитадели Сирхада, известной ныне как [Concept('sunken_house','Затонувший дом')|E]. Эту оплот магии надежно укрыли в диких просторах Хибхибирина, защитив от чужаков дьявольски хитрыми чарами и наваждениями.\n\nКогда вспыхнула [Concept('war_in_heaven','War_in_heaven')|E], Сирхад на удивление всем хранил строгий нейтралитет. И хотя отдельным братьям не возбранялось сочувствовать той или иной стороне, устав ордена запрещал любое прямое вмешательство с использованием его великих богатств. Всякий маг, уходивший на войну, бился как частное лицо и не мог уповать на помощь старейшин. Что примечательно, эта нерушимая справедливость сослужила им добрую службу: Сирхад стали ценить как беспристрастных посредников и послов в переговорах едва ли не выше, чем за их колдовское искусство."
 
 game_concept_mizfarun_dawl: "А'Мизфарун Давл"
 game_concept_mizfarun_dawl_desc: "Тайное братство, пустившее корни внутри самого [Concept('sirhad','Сирхада')|E]. Ячейки Мизфарун Давл действовали во множестве кабалов и кругов по всему Саррадону. Прибегая к шпионажу, скрытным убийствам и расчетливой жестокости, они служили тайным кинжалом ордена, оберегая его выгоду и мстя за обиды. Хуже того, порой они обращали свой взор и внутрь самого Сирхада — шантажом или сталью избавляясь от тех [Concept('sirhad','магов')|E], кто грозил нарушить привычный уклад вещей. В народе болтали, будто они были приверженцами закрытого мистического толка, чьи обряды покрыты мраком, и направляли все свое колоссальное влияние на то, чтобы уберечь единство и нейтралитет Сирхада в разгар бушующей [Concept('war_in_heaven','Войны на небесах')|E].\n\nПочему в годы перед [Concept('the_decimation_of_sarradon','Халакдуном')|E] они не справились с этой главной задачей — загадка, над которой часто размышляют книжники, любящие копаться в тайных делах. Большинство сходится во мнении, что Мизфарун Давл сам сгорел в пламени раскола между варденитами и ритуалистами, распавшись на враждующие ордена [Concept('magi','магов')|E]-убийц. Существует даже догадка, будто эти два отпочковавшихся братства приложили руку к самому [Concept('the_decimation_of_sarradon','Халакдуну')|E], помогая сородичам из кабалов Альмади и Алькарати. Редкие одиночки — над которыми посмеиваются даже в самых безумных кругах исследователей — и вовсе твердят, будто Мизфарун Давл никогда не ведал раскола и самолично срежиссировал [Concept('the_decimation_of_sarradon','Халакдун')|E] и последовавший за ним всеобщий кошмар, преследуя тайные цели. Была ли это кровожадная попытка оборвать [Concept('war_in_heaven','Войну на небесах')|E] взаимным истреблением обеих сторон, побочный ли исход еще более темного ритуала для вознесения магов на неведомый духовный план или же нечто куда более зловещее — пророки и любители тайн никак не придут к согласию."
 
 #CHARACTERS
 
 game_concept_ishtabima_mamura: "Иштабима Мамура"
 game_concept_ishtabima_mamura_desc: "Верная заступница, [Concept('magi','маг')|E], соратница непризнанной мамуры Санад и противоречивая святая, Иштабима оставила после себя туманный след в истории. Одни свитки называют ее рожденной вне брака племянницей мамуры, другие — безродной простолюдинкой, возвысившейся в огне Халакдуна. Как бы то ни было, она не раз доказывала свое ратное и тактическое мастерство на службе у госпожи, став ее главным советником и, в конце концов, верховным воеводой ее полков. Более того, верные люди Иштабимы и вовсе утверждали, будто поражение Санад в битве при Азареке случилось лишь потому, что та пренебрегла советами своего генерала, поверив двуличному заговору, из-за которого Иштабиму изгнали из военного совета.\n\n Сказания о жизни и смерти Иштабимы полны противоречий. Она ушла из жизни в цветущем возрасте тридцати восьми лет (или сорока пяти, или двадцати семи, смотря по тому, каким летописям верить), но уже успела сплотить вокруг себя преданных людей из числа сторонников Санад, и после кончины генерала их число лишь множилось. Овеянная славой многих побед (таких как Окружение у ручьев и Двухкольцевой форт, подаривший ей победу при осаде Тишварады и навсегда похоронивший притязания ритуалистского пророка Маннахавасвы), свое самое славное деяние она совершила в день, прозванный Праведным противостоянием. Рассказывают, что у одинокого моста через реку А'Аутия она в одиночку сдерживала натиск не менее тысячи воинов и чародеев, отчаянно спасая армию Санад, бежавшую от наступавших сил варденитского претендента Абатиса. В тот день она пустила в ход каждое заклятие и каждый боевой прием, что знала. Тяжкий недуг магов, развившийся от сотворенных ею чар — заклятий, что выжигали костный мозг и превращали саму плоть врагов в кровавое месиво, — свел ее в могилу всего несколько месяцев спустя. Почитающие ее как святую видят в этой жертве истинное мученичество — не напрасную смерть, а холодный стратегический расчет ради спасения госпожи. Свидетели вспоминали, что когда израненную Иштабиму уносили с поля боя, все ее тело светилось охрой от [Concept('arcana','колдовского')|E] сияния неописуемых энергий, ставшего последним и смертоносным знаком ее верности.\n\n Принять смерть во имя преданности столь глубокой, что ни один смертный не сможет облечь ее в слова. Обрести на [Concept('aeras','Эрасе')|E] судьбу, выходящую за грани этого блеклого и мимолетного мира — разве это не истинное вознесение? Так, по крайней мере, говорят ее почитатели среди Бешашурийи. И великой, горькой трагедией остается то, что сама она не оставила после себя ни единой строки, дабы оправдать свои деяния и объяснить дело, к ногам которого она безропотно пролила свою кровь. Знала ли истину сама Санад?"

 game_concept_tarmyu: "Tarmyu"
 game_concept_tarmyu_desc: "Tarmyu was a legendary pirate and the first to bind the eastern seas of the Pirate Coast into a unified Ouwabadin thalassocratic state, stretching from the eastern coast of [sarradon|E] to [Glossary('Rovarska','rovarska_encyclopedia_desc')].\n\nKnown mainly through regional oral tradition, little of Tarmyu's life before the founding of Tinarya can be called certain. He is said to have been born among the Ouwabadin, either having migrated alongside his kin to the eastern coast of Sarradon or been born there himself sometime in the fourth century. Certainly his most enduring legacy was the [suriya_ya_tarmyu|E], which would long outlive him and inspire many to raise their own."

 game_concept_suriya_ya_tarmyu: "Suriya ya Tarmyu"
 game_concept_suriya_ya_tarmyu_desc: "The [Glossary('Suriya ya Tarmyu','SURIYA_YA_TARMYU_GLOSS')], known later as the [Glossary('Suriyangowe','SURIYANGOWE_GLOSS')], was the first code of its kind, drawn up by Tarmyu in answer to the lawlessness of the Tinarya seas, which he had himself profited from. Raiding had grown so indiscriminate that it was said vessels were set upon many times a day, stripped even of the clothes aboard them if the most outrageous stories were to be believed. As merchants abandoned the traditional sea routes for safer ones and trade declined ever further, Tarmyu would write and bind his subjects to a new set of rules of conduct. Its success later saw many draw up their own in imitation. To keep a Suriya became a claim to authority, to break another's a challenge to it."
 
 #LOCATIONS
 
 game_concept_sunken_house: "Затонувший дом"
 game_concept_sunken_house_desc: "Один из самых грозных оплотов Сирхада, Затонувший дом служил для сбережения наиболее опасных тайн и ценностей ордена. Он почитался абсолютно неприступным не только из-за хитрых чар защиты, но и потому, что был надежно укрыт в самых глухих и неизведанных песках. Не уцелело ни единого свитка, дающего хоть малейший намек на его местонахождение или облик: говорят, магистры Сирхада с помощью темного колдовства привязали призрачных теней к задаче выслеживать и пожирать любые летописи, где правдиво описывалась эта крепость.\n\nВ Затонувшем доме также покоилась большая часть архивов Сирхада, скреплявшая орден воедино. И хотя ключи от него имели лишь единицы избранных, благодаря череде ныне утраченных заклятий хранители цитадели могли держать постоянную связь с братьями, как бы далеко те ни находились.\n\nДом пал вместе с крахом самого Сирхада, хотя благодаря вовремя запечатанным дверям Кровавая порча, как считают, не проникла внутрь. Известно лишь, что за три дня до того, как всякая связь оборвалась, члены Сирхада получали полные паники и безумия вести от своих информаторов из цитадели. Те умоляли никого не приближаться к дверям и бредили о некоем призрачном свирепом охотнике, именуемом просто «Тварью».\n\nНесмотря на столь зловещий конец, поиски и разграбление Затонувшего дома остаются заветной мечтой для искателей сокровищ, бродяг, изгнанников и простых разбойников по всему Саррадону. Вопреки их отчаянным и дерзким попыткам, вот уже более полутысячелетия никто не видел эту цитадель — или, по крайней мере, никто не вернулся живым, чтобы поведать об этом."
 
 game_concept_disuwai: "Метрополия Дисувай"
 game_concept_disuwai_desc: "Основанный западным [Concept('mamuramat','мамуром')|E] Махой в 542 году, Дисувай быстро вырос в богатый торговый порт. Его купцы набивали сундуки златом, струившимся от торговли с амсарийцами и кемсарийцами на далеком западе. Даже разграбление города кочевниками-айярами не смогло остановить его расцвет. И все же город, скорее всего, остался бы лишь малозаметной строчкой в анналах истории, если бы не события, что на короткое время превратили его в самое сердце всего [Concept('wardenism','варденитского')|E] мира — Катситский раскол."
 
 game_concept_judgment_of_kohont: "Judgment of Kohont"
 game_concept_judgment_of_kohont_desc: "Having decided [Glossary('Aekershaan','aekershaan_encyclopedia_desc')] would be where his mission would begin, Kohont traveled to the city of Seinid to preach to its inhabitants. He was seized at once and brought before the warlord Oltaxis to be executed. Before the gathered crowd Kohont proclaimed, \"It is I who slew the moon\", declaring that the evil god was dead and that he had come to bring a new age of peace. And so it was that the crowd fell to their knees in awe, and with Oltaxis casting aside his sword the city was converted."

