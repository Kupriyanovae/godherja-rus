l_russian:
 study_malik_cipher:0 "Изучить шифр Мас'эна Малика"
 study_malik_cipher_desc:0 "«Жемчужные поля и полные золота ямы» — это лабиринт из множества томов, в котором, как известно, скрыта запутанная и невероятно сложная система шифров. Поскольку в нашем распоряжении есть хороший перевод, нам следует собрать команду, чтобы расшифровать этот шедевр и попытаться извлечь из его страниц ещё больше тайн, которые таит [Concept('dead_magic','мёртва магия')|E]. Однако стоит проявить осторожность: книга известна своими ритуалами-ловушками, созданными, чтобы обмануть и погубить неопытных расшифровщиков. Ещё одной проблемой станет цена, ведь этот процесс потребует колоссального количества человеко-часов и целую гору реагентов."
 study_malik_cipher_tooltip:0 "Сберите [Concept('magi','мага')|E] и взломайте код!"
 study_malik_cipher_confirm:0 "Начать расшифровку"
 study_malik_cipher.effect.tt:0 "Вы соберете команду, чтобы попытаться почерпнуть знания из тома. Это займет некоторое время."
 
 sell_abyssal_prism:0 "Продать Призму Бездны"
 sell_abyssal_prism_desc:0 "Мой контракт почти выполнен: клиент предлагает огромную сумму за эту странную призму. Теперь мне нужно лишь выбраться из этой проклятой пустыни."
 sell_abyssal_prism.effect.tt:0 "Сбегите из Красных земель, чтобы продать Призму Бездны и уйти на покой в мире и достатке."
 sell_abyssal_prism_tooltip:0 "Продать Призму Бездны за крупную сумму."
 sell_abyssal_prism_confirm:0 "Связаться с покупателем"