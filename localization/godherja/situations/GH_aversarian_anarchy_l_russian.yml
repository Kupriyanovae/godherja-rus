 Etepezea_overview:0 "[Concept('aversaria','Аверсария')|E] лежит в руинах, и распад её древнего средоточия — [GetGeographicalRegion('governate_aversarian_etepezea').GetName|V] — лишь вопрос времени. Население поредело, войны и голод опустошили земли, дороги и прочие сооружения пришли в негодность и уже не подлежат восстановлению. Даже эта древнейшая из провинций, вероятно, скоро канет в лету.\n\nМудрый аверсарианский правитель может принять эту участь и возвести на руинах нечто новое. Но память об империи ещё жива, и если в губернаторстве удастся восстановить порядок, старые устои могут вновь восторжествовать."
