 Etepezea_overview:0 "С [Concept('aversaria','Аверсарией')|E] в руинах, теперь только дело времени до того, как древнее сердце империи в [GetGeographicalRegion('governate_aversarian_etepezea').GetName|V] утратит целостность. Сильно обезлюдевшая, разоренная войной, страдающая от голода и покрытая полуразрушенной — и не подлежащей восстановлению — инфраструктурой, даже эта древнейшая из провинций, скорее всего, вскоре канет в лету.\n\nМудрый аверсарианский правитель мог бы принять это будущее и построить что-то новое на обломках. Однако память об империи еще жива, и если в губернаторстве удастся восстановить порядок, старые устои ещё могут восторжествовать вновь."
