 landed_order_schism_army:0 "Раскольники капитула"
 landed_order_schism_faction:0 "Раскол капитула"
 landed_order_schism_faction_chapter_house_tt:0 "От капитула отделился [chapter_house|E]"
 landed_order_schism_faction_desc:0 "Члены ордена, намеренные отколоться и образовать самостоятельную ветвь соблюдения под началом одного из своих. Фракция может появиться лишь при [chapter_strain|E] не ниже #V 90#! и наличии обособленного [chapter_house|E]. Её сила равна доле голосов участников в капитуле.\n\nОни требуют позволить им выйти из ордена. [ordermaster|E], отказавшийся их отпустить, должен будет сражаться в [chapter_schism|E]."
