 landed_order_schism_faction_short_effect_desc:0 "Желает выйти из ордена"
 landed_order_schism_faction_strain_tt:0 "[chapter_strain|E] составляет не менее #V 90#!"
 landed_order_schism_war:0 "Раскол капитула"
 landed_order_schism_war_defeat_defender_desc:0 "Вы заключите раскольников в темницу без потери [order_authority|E], которая повысится на #P 10#!. Их капитульные дома упразднят, а [chapter_strain|E] снизится."
 landed_order_schism_war_defeat_desc:0 "[defender.GetShortUIName|U] заключит раскольников в темницу без потери [order_authority|E], которая повысится на #P 10#!. Их капитульные дома упразднят, а [chapter_strain|E] снизится."
 landed_order_schism_war_victory_defender_desc:0 "[attacker.GetShortUIName|U] выведет раскольников из ордена, создав независимый Орден соблюдения. Ваши [order_authority|E] и [doctrine_standing|E] снизятся."
