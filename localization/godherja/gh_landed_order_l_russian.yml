 landed_order_whispers_truth_general_desc:0 "Проследить за шёпотом среди [Concept('landed_order','владетельных орденов')|E] до его источника с помощью [Concept('intrigue','интриг')|E] и [Concept('arcana','арканы')|E]. В случае успеха вы узнаете, что скрывает Орден Забытого Святого, и сможете выбрать сторону."
