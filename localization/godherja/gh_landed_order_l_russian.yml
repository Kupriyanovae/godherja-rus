 landed_order_promote_tributary_interaction_desc:0 "Принять [recipient.GetShortUIName] в орден: этот правитель принесёт обеты, его земли перейдут в полную собственность ордена, а должность перестанет наследоваться родом."
 landed_order_promote_tributary_interaction_effect_tt:0 "[recipient.GetShortUIName] перестанет быть [Concept('lay_tributary','светским данником')|E] и станет [Concept('komtur','комтуром')|E] ордена с собственным [Concept('commandery','командорством')|E]. Это повысит [chapter_strain|E]."
 landed_order_reaffirmation_faction:0 "Фракция подтверждения полномочий"
 landed_order_reaffirmation_faction_authority_tt:0 "[order_authority|E] ниже #V 25#! либо ниже #V 35#!, если [chapter_strain|E] составляет #V 40#! или более."
 landed_order_reaffirmation_faction_desc:0 "Члены капитула, желающие поставить вопрос о доверии [Concept('ordermaster','магистру ордена')|E] на голосование. Фракция может появиться, только когда [doctrine_standing|E] падает до минимума, [order_authority|E] — ниже #V 25#!, и после первых #V 10#! лет игры. Её сила зависит от доли голосов её участников в капитуле, а не от численности войск. Каждый участник проголосует за отстранение [Concept('ordermaster','магистра')|E].\n\nФракция требует проведения [snap_conclave|E] под руководством своего главы. Магистр, отказавшийся подчиниться, должен будет сражаться в [chapter_censure|E]."
