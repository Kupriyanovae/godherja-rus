 LANDED_ORDER_CONCLAVE_DISSENTER_LABEL_HOVER:0 "#T Несогласные#!\nВыборщики капитула, намеренные сместить [Concept( 'ordermaster', 'магистра' )|E], в том числе участники [Concept( 'reaffirmation_faction', 'фракции подтверждения полномочий' )|E]. Если они одержат победу в голосовании, должность перейдёт избраннику [Concept( 'chapter_conclave', 'конклава капитула' )|E]."
 LANDED_ORDER_CONCLAVE_LOYALIST_LABEL:0 "Сторонники"
 LANDED_ORDER_CONCLAVE_LOYALIST_LABEL_HOVER:0 "#T Сторонники#!\nВыборщики капитула, намеренные подтвердить полномочия [Concept( 'ordermaster', 'магистра' )|E]. Отсутствующие выборщики голосуют исходя из своего [Concept( 'opinion', 'отношения' )|E] к магистру; если тот также не явится, они проголосуют против него."
 LANDED_ORDER_DISCONTENT_TOOLTIP:0 "#T Недовольство#!\nСтепень недовольства этого [Concept( 'lay_tributary', 'светского данника' )|E] властью [Concept( 'landed_order', 'владетельного ордена' )|E]: от #V 0#! до #V 100#!. При #V 25#! сокращается дань; при #V 50#! прекращается выплата дани и предоставление ополчения; при #V 75#! более сильный сосед может попытаться переманить данника; после двух лет при #V 100#! начинается открытое восстание. См. [tributary_reach|E]."
