 conspiracy_of_whispers_whispers_phase_whispers_situation_phase:0 "Шёпот"
 convene_chapter_general_interaction:0 "Созвать генеральный капитул"
 convene_chapter_general_interaction_desc:0 "Созвать комтуров и маршалов ордена в доме капитула, выслушать их совет и напомнить им, чьей воле они обязаны повиноваться."
 convene_chapter_general_interaction_effect_tt:0 "[Concept( 'order_authority', 'Власть магистра' )|E] увеличивается на #P 8#! плюс половина вашего [Concept( 'diplomacy', 'дипломатического навыка' )|E] (не более #P 20#!)"
 found_commandery_interaction:0 "Учредить командорство"
 found_commandery_interaction_desc:0 "Возвести персонажа [recipient.GetShortUIName] в достоинство комтура нового командорства ордена. Назначенный таким образом комтур становится должностным лицом ордена, не владеющим собственным графством."
 found_commandery_interaction_effect_tt:0 "[recipient.GetShortUIName] становится [Concept( 'komtur', 'комтуром' )|E] нового [Concept( 'commandery', 'командорства' )|E] с резиденцией в наиболее развитом графстве ордена, где пока нет командорства"
 found_commandery_vows_tt:0 "Не состоит в браке, как того требуют обеты ордена"
 fulfillment_level_parameter_sp_landed_order_devotion_down_1:0 "[ordermaster|E] [Concept( 'landed_order', 'владетельного ордена' )|E] ежегодно медленнее повышает [doctrine_standing|E] или даже теряет его"
 fulfillment_level_parameter_sp_landed_order_devotion_down_2:0 "[ordermaster|E] [Concept( 'landed_order', 'владетельного ордена' )|E] ежегодно значительно медленнее повышает [doctrine_standing|E] или даже теряет его"
 fulfillment_level_parameter_sp_landed_order_devotion_up_1:0 "[ordermaster|E] [Concept( 'landed_order', 'владетельного ордена' )|E] ежегодно быстрее повышает [doctrine_standing|E]"
 fulfillment_level_parameter_sp_landed_order_devotion_up_2:0 "[ordermaster|E] [Concept( 'landed_order', 'владетельного ордена' )|E] ежегодно значительно быстрее повышает [doctrine_standing|E]"
 game_concept_chapter_censure:0 "Порицание капитула"
 game_concept_chapter_censure_desc:0 "Война, которую [Concept( 'reaffirmation_faction', 'фракция подтверждения полномочий' )|E] ведёт против [Concept( 'ordermaster', 'магистра' )|E], отказавшегося исполнить её требование. В случае победы магистр лишится должности, как при смещении голосованием. В случае поражения участники фракции будут заключены под стражу, а [order_authority|E] возрастёт."
 game_concept_chapter_conclave:0 "Конклав капитула"
 game_concept_chapter_conclave_desc:0 "Выборы нового [Concept( 'ordermaster', 'магистра' )|E] [Concept( 'landed_order', 'владетельного ордена' )|E]. Голосуют непосредственно подчинённые должностные лица и совет магистра; вес голосов зависит от должности: маршалы или герцоги влиятельнее всех, затем идут [Concept( 'komtur', 'комтуры' )|E]. Кандидаты должны преодолеть [merit_threshold|E]."
 game_concept_chapter_general:0 "Генеральный капитул"
 game_concept_chapter_general_desc:0 "Собрание должностных лиц [Concept( 'landed_order', 'владетельного ордена' )|E], созываемое магистром за [Concept( 'piety', 'благочестие' )|E] ради повышения [order_authority|E]. Требуются мир, не менее двух непосредственно подчинённых должностных лиц; собрание можно проводить раз в #V 5#! лет."
 game_concept_chapter_house:0 "Дом капитула"
 game_concept_chapter_house_desc:0 "[Concept('commandery','Командорство')|E] [Concept('landed_order','владетельного ордена')|E], управляющее собой самостоятельно. [komtur|E] может просить об этом статусе, когда [chapter_strain|E] достигает #V 80#!. Если прошение удовлетворено, командорство создаёт вдвое меньше нагрузки на капитул, а его комтур сохраняет место в ордене, но теряет один голос. Капитульный дом нельзя понизить в статусе; из него может вырасти [chapter_schism|E]. Такой статус принадлежит лично комтуру и прекращается после его ухода."
 game_concept_chapter_schism:0 "Раскол капитула"
 game_concept_chapter_schism_desc:0 "Если [chapter_strain|E] достигает #V 90#! и обособился [chapter_house|E], должностные лица [Concept('landed_order','владетельного ордена')|E] могут объединиться ради отделения. Если им позволят уйти или они одержат победу в войне после отказа, вождь раскола выведет участников из ордена и создаст независимый Орден соблюдения. У старого ордена снизятся [order_authority|E] и [doctrine_standing|E], зато ослабнет нагрузка на капитул. В случае поражения раскольников заключат в темницу, а их капитульные дома упразднят. Раскол вызывает тревогу у соседних [Concept('lay_tributary','светских данников')|E] ордена."
 game_concept_chapter_strain:0 "Напряжённость в капитуле"
 game_concept_chapter_strain_desc:0 "Показатель того, насколько [Concept('landed_order','владетельный орден')|E] перерос свой изначальный капитул: от #V 0#! до #V 100#!. Каждое удерживаемое [commandery|E] добавляет #V 6#! (#V 3#! у Ордена Забытого Святого, чей капитул подчиняется единой воле). Навык [Concept('stewardship','управления')|E] [Concept('ordermaster','магистра ордена')|E] компенсирует полуторный размер своего значения; почитаемое [doctrine_standing|E] уменьшает показатель на #V 10#!, а превознесённое — на #V 20#!. На положение влияет и настроение капитула: напряжение нарастает при низком [order_authority|E] или утрате [lay_tributary|E] и спадает со временем, при укреплении дисциплины капитула или появлении вакантного командорства.\n\nПри значении ниже #V 40#! нагрузка #P низкая#!. На #V 40#! капитул напряжён и легче возникает [reaffirmation_faction|E]; на #V 60#! орден чрезмерно разросся, а собственная [clique|E] магистра хуже поддерживает его во время [reaffirmation_vote|E]; на #V 80#! капитул расколот, и [Concept('komtur','комтуры')|E] могут просить об отделении [chapter_house|E]; на #V 90#! орден на грани распада и при наличии капитульного дома возможен [chapter_schism|E]. Понижение [Concept('komtur','комтура')|E] до светского данника облегчает нагрузку, повышение — увеличивает её."
 game_concept_chaptermember:0 "Член капитула"
 game_concept_chaptermember_desc:0 "Член [Concept('landed_order','владетельного ордена')|E], владеющий только баронством и не имеющий более высокого титула. Члены капитула всегда соблюдают безбрачие, даже если обеты ордена позволяют иное, и не владеют [Concept('commandery','командорствами')|E]."
 game_concept_commandery:0 "Командорство"
 game_concept_commandery_desc:0 "Должность, не связанная с земельным титулом, которую занимает каждое должностное лицо [Concept('landed_order','владетельного ордена')|E]. Командорство располагается в графстве и предоставляет своему обладателю [domicile|E]. Его нельзя пожаловать другому персонажу: нового обладателя назначает капитул."
 game_concept_doctrine_standing:0 "Авторитет доктрины"
 game_concept_doctrine_standing_desc:0 "[Concept('legitimacy','Легитимность')|E] [Concept('landed_order','владетельного ордена')|E], отражающая то, насколько верным своей вере его считают.\n\nОна возрастает благодаря победам в [Concept('holy_war','священных войнах')|E], обращениям в веру, дисциплине братьев и благочестию [Concept('ordermaster','магистра ордена')|E]. Снижается от поражений в войнах и сражениях, от иноверных должностных лиц и необращённых земель ордена.\n\nПри высоком значении братья получают [spiritual_fulfillment|E], а священные войны обходятся дешевле. При низком — утрачивают духовное удовлетворение."
 game_concept_komtur:0 "Комтур"
 game_concept_komtur_desc:0 "Должностное лицо [Concept('landed_order','владетельного ордена')|E], владеющее [Concept('commandery','командорством')|E], независимо от того, принадлежит ли ему графство. Должности комтура передаются по назначению капитула наиболее достойному брату, а не членам семьи."
 game_concept_landed_order_eye_corruption:0 "Влияние Ока"
 game_concept_landed_order_eye_corruption_desc:0 "Насколько глубоко [landed_order|E] захвачен [Concept('landed_order_eye_sworn','присягнувшими Оку')|E]: #V 50#! за присягнувшего [Concept('ordermaster','магистра ордена')|E], #V 15#! за каждого присягнувшего [Concept('komtur','комтура')|E] или маршала, #V 5#! за каждого присягнувшего [Concept('chaptermember','члена капитула')|E] и #V 5#! за каждого присягнувшего советника либо рыцаря магистра, но не более #V 100#!.\n\nСреднее значение влияния Ока всех остальных орденов составляет [landed_order_eye_grasp|E]. Видеть его могут лишь служители Ока."
 game_concept_landed_order_eye_grasp:0 "Хватка Ока"
 game_concept_landed_order_eye_grasp_desc:0 "Среднее [landed_order_eye_corruption|E] всех [Concept('landed_order','владетельных орденов')|E], кроме собственного ордена Забытого Святого, включая эосианцев. Когда показатель достигнет #V 100%#!, все ордена будут принадлежать Оку (эосианцы окажутся подчинены или исчезнут), а Забытый Святой победит в [landed_order_whispers|E].\n\nСлужители Ока участвуют в Заговоре шёпота, который отображается среди их ситуаций."
 game_concept_landed_order_eye_sworn:0 "Посвящённый Ока"
 game_concept_landed_order_eye_sworn_desc:0 "Орден Забытого Святого тайно привёл к присяге [GetBuilding('01_the_eye').GetName] членов других [Concept('landed_order','владетельных орденов')|E] и некоторых последователей вер Хранителей и ритуалистов. На людях они исповедуют свои прежние убеждения, но втайне служат Оку."
 game_concept_landed_order_regiments:1 "Полки владетельного ордена"
 game_concept_landed_order_regiments_desc:3 "[landed_order|E] сражается постоянными войсками, а не ополчением.\n\n[commandery|E] (графство): #P +1#!\nМаршал (герцогство): #P +2#!\n[ordermaster|E] (королевство): #P +3#!\nНезависимый [ordermaster|E]: ещё #P +1#!\n\nОрдена с самого начала содержат столько войск, сколько позволяют доходы: до одного полка за каждый ранг должности и ещё один для независимого магистра."
 game_concept_landed_order_vigil:0 "Дозор"
 game_concept_landed_order_vigil_confederate:0 "Союзник Дозора"
 game_concept_landed_order_vigil_confederate_desc:0 "[Concept('landed_order_vigil_confidant','Доверенное лицо')|E], открыто вставшее на сторону эосианцев. Союзник, правящий независимой державой, также входит в [Concept('confederation','конфедерацию')|E] Дозора. Оку ещё труднее переманить союзников; они чаще разоблачают его слуг и учитываются при сборе доказательств для решения #V Разоблачить Око#!."
 game_concept_landed_order_vigil_confidant:0 "Доверенное лицо Дозора"
 game_concept_landed_order_vigil_confidant_desc:0 "Тайный доверенный сторонник [Concept('ordermaster','магистра')|E] эосианцев. Доверенное лицо хранит [secret|E], который считается преступным в тех землях, где глава его [Concept('landed_order','владетельного ордена')|E] служит Оку. Такие сторонники способны отвергать попытки Ока подчинить их волю; некоторые сообщают о слугах Ока в собственном ордене."
 game_concept_landed_order_vigil_desc:1 "Ответ эосианцев Оку — тайная сеть доверенных сторонников, которую [Concept('ordermaster','магистр')|E] Забытого Хранителя создаёт в других [Concept('landed_order','владетельных орденах')|E] во время [landed_order_whispers|E].\n\nМагистр и [Concept('komtur','комтуры')|E] ордена приобретают [Concept('landed_order_vigil_confidant','доверенных сторонников')|E] посредством [Concept('scheme','происков')|E] #V Завоевать доверие#!, а затем могут просить их открыто выступить [Concept('landed_order_vigil_confederate','союзниками')|E]. Они пытаются освободить известных им [Concept('landed_order_eye_sworn','присягнувших Оку')|E] от тайных клятв через #V Разорвать взор#!. Тайный советник магистра, занятый задачей #V Искать тайны#!, также выслеживает служителей Ока внутри орденов.\n\nСобрав достаточно доказательств (#V 12#!: по #V 1#! за каждого известного магистру слугу Ока, по #V 1#! за каждого союзника и #V 3#! за магистра-союзника), магистр может #V Разоблачить Око#!. Орден Забытого Святого будет предан анафеме, а все известные слуги Ока будут разоблачены. Без доказательств самого магистра сочтут безумцем."
 game_concept_landed_order_whispers:0 "Заговор шёпота"
 game_concept_landed_order_whispers_desc:0 "Холодная война между Орденом Забытого Святого, тайно приводящим членов других [Concept('landed_order','владетельных орденов')|E] к присяге [GetBuilding('01_the_eye').GetName], и эосианцами Забытого Хранителя. Её оружие — [Concept('scheme','происки')|E] и [Concept('secret','тайны')|E]. В ней участвует каждый правитель-агионист, а остальных вовлекают, когда они [Concept('landed_order_eye_sworn','присягают Оку')|E] или узнают о его слугах.\n\nСитуация проходит фазы #V Шёпот#!, #V Подозрение#! и #V Открытый разрыв#! по мере раскрытия тайн и пролития крови. В спокойные годы напряжение спадает. Борьба заканчивается, когда все ордена оказываются под властью Ока, а эосианцы пленены или уничтожены ([landed_order_eye_grasp|E] — #V 100%#!), либо когда Орден Забытого Святого предан анафеме и ни один [ordermaster|E] больше не служит Оку."
 game_concept_lay_tributary:0 "Светский данник"
 game_concept_lay_tributary_desc:0 "Правитель, выплачивающий дань [Concept('landed_order','владетельному ордену')|E], но не состоящий в нём. Его земли наследуются и не увеличивают [chapter_strain|E], однако удалённость от ордена и пренебрежение обязанностями вызывают недовольство: см. [tributary_reach|E].\n\nВерного светского данника той же веры можно принять в орден, а мятежного [Concept('komtur','комтура')|E] — исключить, сохранив его в качестве данника."
 game_concept_merit_threshold:0 "Порог заслуг"
 game_concept_merit_threshold_desc:0 "Кандидату на [chapter_conclave|E] необходимо набрать не менее #V 18#! заслуг: его [martial|E] плюс [learning|E] плюс утроенный уровень [piety|E]. Если ни один кандидат не преодолел порог, требование отменяется. При любых обстоятельствах выборщики предпочитают большее число заслуг."
 game_concept_order_authority:0 "Власть магистра"
 game_concept_order_authority_desc:0 "Подчинение капитула своему [Concept('ordermaster','магистру')|E] от #V 0#! до #V 100#!. При значениях #V 25#!, #V 50#! и #V 75#! автоматически определяется закон о власти ордена; изменить его вручную невозможно.\n\nВласть растёт при наличии верных должностных лиц, проведении [chapter_general|E] и победе на [reaffirmation_vote|E]. Она падает при непокорных братьях, заточении или лишении должностей единоверцев ордена; со смертью магистра показатель теряет четверть своего значения."
 game_concept_ordermaster:0 "Магистр ордена"
 game_concept_ordermaster_desc:0 "Глава [Concept('landed_order','владетельного ордена')|E]. Должность никогда не наследуется: каждого нового магистра избирает [chapter_conclave|E], а [reaffirmation_vote|E] может отстранить его."
 game_concept_reaffirmation_faction:0 "Фракция подтверждения полномочий"
 game_concept_reaffirmation_faction_desc:0 "Объединение должностных лиц [Concept('landed_order','владетельного ордена')|E], требующее провести [reaffirmation_vote|E]. Фракция может возникнуть, лишь когда [doctrine_standing|E] находится на минимуме, а [order_authority|E] — ниже #V 25#!, и не раньше чем через #V 10#! лет после начала игры. Её сила равна доле голосов сторонников в капитуле. Если [ordermaster|E] подчинится, последует [snap_conclave|E]; иначе начнётся [chapter_censure|E]."
 game_concept_reaffirmation_vote:0 "Голосование о полномочиях"
 game_concept_reaffirmation_vote_desc:0 "Голосование капитула о том, достоин ли [ordermaster|E] и дальше возглавлять орден. Назначить его принудительно может только [reaffirmation_faction|E]. Проигравший магистр отрекается в пользу избранника [chapter_conclave|E] и сохраняет должность [komtur|E]."
 game_concept_snap_conclave:0 "Внеочередной конклав"
 game_concept_snap_conclave_desc:0 "Собрание капитула в резиденции [Concept('ordermaster','магистра ордена')|E], созываемое предводителем [reaffirmation_faction|E]. Перед [reaffirmation_vote|E] его участники пытаются убедить друг друга в своей правоте."
 game_concept_tributary_reach:0 "Влияние на данников"
 game_concept_tributary_reach_desc:0 "Каждый [lay_tributary|E] [Concept('landed_order','владетельного ордена')|E] обладает показателем недовольства от #V 0#! до #V 100#!.\n\nОн ежегодно растёт с увеличением расстояния до ближайшего [Concept('commandery','командорства')|E] ордена, при низком [doctrine_standing|E], при наличии более сильного соседа, предлагающего выгодные условия, а также если данник недолюбливает магистра. Показатель снижается, когда орден почитаем, а данник доволен своим положением.\n\nПри #V 25#! данник платит меньше дани; при #V 50#! удерживает дань и ополчение; при #V 75#! соперник может попытаться переманить его; а два года или более при #V 100#! приводят к открытому восстанию, также повышающему [chapter_strain|E]."
 gh_landed_order.0010.a:0 "Значит, у меня есть месяц, чтобы вновь завоевать их доверие."
 gh_landed_order.0010.a.tt:0 "Капитул проведёт голосование через #V 30#! дней. Голос каждого выборщика зависит от его [Concept('opinion','отношения')|E] к вам, [doctrine_standing|E] и [order_authority|E], достижения вами [merit_threshold|E] и принадлежности выборщика к [Concept('clique','клике')|E]. В случае поражения вы уступите пост избраннику [chapter_conclave|E]."
 gh_landed_order.0010.desc_censure:0 "Я [Select_CString(ROOT.Char.IsFemale,'согласилась','согласился')] ответить перед [landed_order_caller.GetShortUIName] и участниками [Select_CString(landed_order_caller.IsFemale,'её','его')] фракции, но внеочередной конклав, который выслушал бы обвинения, так и не собрался. Капитул проголосует без него."
 gh_landed_order.0010.desc_censure_unled:0 "Я [Select_CString(ROOT.Char.IsFemale,'согласилась','согласился')] ответить перед фракцией переутверждения капитула, но внеочередной конклав для рассмотрения обвинений так и не собрался. Капитул проголосует без него."
 gh_landed_order.0010.desc_intro:0 "Комтуры и маршалы [ROOT.Char.GetPrimaryTitle.GetNameNoTier] созваны в капитульный дом, чтобы решить, [Select_CString(ROOT.Char.IsFemale,'достойна','достоин')] ли я и впредь возглавлять орден.\n\n"
 gh_landed_order.0010.desc_tally:0 "\n\nЕсли бы капитул голосовал сегодня, #P [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_for').GetValue )|0]#! голосов поддержали бы меня, а #N [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_against').GetValue )|0]#! выступили бы против."
 gh_landed_order.0010.t:0 "Капитул готовится к голосованию"
 gh_landed_order.0012.a:0 "Капитул вынес мудрое решение."
 gh_landed_order.0012.a.tt:0 "[order_authority|E] возрастает (#P +8#! либо #P +12#! во время [snap_conclave|E]), а глава фракции теряет [prestige|E]. Капитул не сможет вновь подвергнуть вас порицанию в течение #V 3#! лет."
 gh_landed_order.0012.b:0 "Лишь отсрочка, не более."
 gh_landed_order.0012.b.tt:0 "Ничего не изменится. Капитул не сможет вновь вынести вам порицание в течение #V 3#! лет."
 gh_landed_order.0012.desc:0 "Капитул проголосовал: #P [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_for').GetValue )|0]#! за меня и #N [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_against').GetValue )|0]#! против. Я остаюсь магистром [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Сомневающиеся получили слово — и проиграли."
 gh_landed_order.0012.desc_deadlock:0 "Капитул проголосовал против меня: #N [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_against').GetValue )|0]#! против #P [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_for').GetValue )|0]#!. Но собравшиеся так и не смогли договориться о преемнике. Пока они не определятся, должность остаётся за мной."
 gh_landed_order.0012.desc_snap:0 "[landed_order_caller.GetShortUIName] [Select_CString(landed_order_caller.IsFemale,'созвала','созвал')] капитул, чтобы сместить меня, однако собравшиеся отвергли это предложение: #P [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_for').GetValue )|0]#! против #N [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_against').GetValue )|0]#!. Мой обвинитель покидает капитульный дом посрамлённым, а моя власть лишь укрепилась."
 gh_landed_order.0012.t:0 "Капитул подтверждает полномочия магистра"
 gh_landed_order.0014.a:0 "Я продолжу служить ордену в рядах капитула."
 gh_landed_order.0014.a.tt:0 "Вы продолжите игру в роли [Concept( 'komtur', 'комтура' )|E] ордена."
 gh_landed_order.0014.b:0 "Орден переживёт это. Я подчиняюсь его воле."
 gh_landed_order.0014.b.tt:0 "Вы продолжите игру в роли нового [Concept( 'ordermaster', 'магистра ордена' )|E] — [landed_order_successor.GetShortUIName]."
 gh_landed_order.0014.desc:0 "Капитул проголосовал: #N [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_against').GetValue )|0]#! против #P [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_for').GetValue )|0]#!, — и признал, что я больше не [Select_CString(ROOT.Char.IsFemale, 'достойна', 'достоин' )] возглавлять орден."
 gh_landed_order.0014.desc_censure_war:0 "Под предводительством [landed_order_caller.GetShortUIName] капитул поднял против меня оружие, и я не [Select_CString(ROOT.Char.IsFemale,'сумела','сумел')] удержать орден. То, чего противники не добились голосованием, они завоевали силой. [landed_order_successor.GetShortUIName] [Select_CString(landed_order_successor.IsFemale,'велела','велел')] заковать меня в цепи."
 gh_landed_order.0014.desc_outro:0 "\n\nТеперь [landed_order_successor.GetShortUIName] возглавляет [landed_order_office.GetNameNoTier]. Я сохраняю своё командорство и место в капитуле: снова комтур среди собратьев, которые запомнят и моё падение, и то, как я его [Select_CString(ROOT.Char.IsFemale,'перенесла','перенёс')]."
 gh_landed_order.0014.desc_snap:0 "[landed_order_caller.GetShortUIName] [Select_CString(landed_order_caller.IsFemale,'созвала','созвал')] капитул, чтобы отстранить меня, и тот согласился: #N [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_against').GetValue )|0]#! против #P [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_for').GetValue )|0]#!."
 gh_landed_order.0014.t:0 "Изгнание по решению капитула"
 gh_landed_order.0015.a:0 "Я проголосую за сохранение полномочий магистра."
 gh_landed_order.0015.b:0 "Я проголосую за смещение магистра."
 gh_landed_order.0015.c:0 "Я приму решение, когда придёт время."
 gh_landed_order.0015.c.tt:0 "Вы голосуете исходя из собственного [Concept('opinion','отношения')|E] к [Concept('ordermaster','магистру ордена')|E] и положения дел в ордене, как это делают выборщики под управлением ИИ."
 gh_landed_order.0015.desc:0 "Капитулу предстоит решить, [Select_CString(landed_order_master.IsFemale,'достойна','достоин')] ли [landed_order_master.GetShortUIName] и дальше возглавлять наш орден. Мой голос тоже будет учтён. Если большинство выступит против магистра, пост займёт избранник конклава капитула."
 gh_landed_order.0015.t:0 "Голосование капитула"
 gh_landed_order.0020.a:0 "Пусть начнутся прения."
 gh_landed_order.0020.desc_accused:0 "Капитул собрался в моём собственном капитульном доме, чтобы выслушать, как [landed_order_conclave_host.GetShortUIName] обвиняет меня в позоре ордена. Мне предстоит ответить на обвинения и до голосования вернуть доверие сомневающихся."
 gh_landed_order.0020.desc_guest:0 "Капитул собрался, чтобы выслушать обвинения [landed_order_conclave_host.GetShortUIName] против [landed_order_master.GetShortUIName] в том, что при нынешнем руководстве орден опозорен, и решить голосованием, может ли магистр оставаться во главе."
 gh_landed_order.0020.desc_host:0 "Комтуры и маршалы собрались, и я [Select_CString(ROOT.Char.IsFemale,'представила','представил')] им обвинения: под руководством [landed_order_master.GetShortUIName] орден утратил уважение единоверцев и должен избрать более достойного магистра."
 gh_landed_order.0020.desc_tally:0 "\n\nСейчас #P [FixedPointToFloat( landed_order_master.MakeScope.Var('landed_order_votes_for').GetValue )|0]#! голосов капитула подтвердили бы полномочия магистра, а #N [FixedPointToFloat( landed_order_master.MakeScope.Var('landed_order_votes_against').GetValue )|0]#! выступили бы против."
 gh_landed_order.0020.t:0 "Заседание капитула"
 gh_landed_order.0021.a:0 "Напомнить [landed_order_conclave_target.GetHerHim] о принесённой нами клятве."
 gh_landed_order.0021.a.failure:0 "[landed_order_conclave_target.GetShortUIName] не меняет своего решения"
 gh_landed_order.0021.a.success:0 "[landed_order_conclave_target.GetShortUIName] удалось переубедить"
 gh_landed_order.0021.b:0 "Орден щедр к своим друзьям."
 gh_landed_order.0021.c:0 "[landed_order_conclave_target.GetSheHe|U] уже [Select_CString(landed_order_conclave_target.IsFemale, 'сделала', 'сделал' )] свой выбор."
 gh_landed_order.0021.desc:0 "[landed_order_conclave_target.GetShortUIName] [Select_CString(landed_order_conclave_target.IsFemale,'встала','встал')] на сторону моего обвинителя, но я вижу сомнение на лице этого человека. Разговор наедине, быть может, поможет вернуть поддержку этого выборщика."
 gh_landed_order.0021.t:0 "Колеблющийся выборщик"
 gh_landed_order.0021.unmoved_tt:0 "[landed_order_conclave_target.GetShortUIName] остаётся среди #V несогласных#!"
 gh_landed_order.0021.won_over_tt:0 "[landed_order_conclave_target.GetShortUIName] примыкает к #V сторонникам магистра#!"
 gh_landed_order.0022.a:0 "Перечислить позорные деяния ордена одно за другим."
 gh_landed_order.0022.a.failure:0 "[landed_order_conclave_target.GetShortUIName] не удалось переубедить"
 gh_landed_order.0022.a.success:0 "[landed_order_conclave_target.GetShortUIName] удалось переубедить"
 gh_landed_order.0022.b:0 "Пообещать [landed_order_conclave_target.GetHerHim] лучшее положение при новом магистре."
 gh_landed_order.0022.c:0 "[landed_order_conclave_target.GetSheHe|U] останется при своём мнении."
 gh_landed_order.0022.desc:0 "[landed_order_conclave_target.GetShortUIName] поддерживает [landed_order_master.GetShortUIName] скорее по привычке, чем по убеждению. Если показать всё, что потерял орден, этот человек ещё может образумиться."
 gh_landed_order.0022.t:0 "Поколебавшийся сторонник"
 gh_landed_order.0022.unmoved_tt:0 "[landed_order_conclave_target.GetShortUIName] остаётся среди #V сторонников магистра#!"
 gh_landed_order.0022.won_over_tt:0 "[landed_order_conclave_target.GetShortUIName] примыкает к #V несогласным#!"
 gh_landed_order.0030.a:0 "Я отвечу перед капитулом."
 gh_landed_order.0030.a.tt:0 "[faction_leader.GetShortUIName] созывает [snap_conclave|E] в вашей резиденции. Все участники фракции проголосуют за ваше смещение, остальные члены капитула — по собственному усмотрению. В случае поражения вы уступите должность избраннику [chapter_conclave|E]."
 gh_landed_order.0030.b:0 "Капитул не властен повелевать магистром ордена."
 gh_landed_order.0030.b.tt:0 "Фракция поднимает против вас оружие в ходе [chapter_censure|E]. В случае поражения вас сместят, как при неудачном голосовании; при победе членов фракции заключат в темницу, а [order_authority|E] повысится на #P 15#!."
 gh_landed_order.0030.desc:0 "[faction_leader.GetTitledFirstName] пишет: «Пришла пора ответить перед конклавом капитула и подчиниться его решению»."
 gh_landed_order.0030.opening:0 "Требование капитула"
 gh_landed_order.0031.a:0 "Теперь остаётся ждать."
 gh_landed_order.0031.desc:0 "[faction_leader.GetTitledFirstName] от имени нашей фракции [Select_CString(faction_leader.IsFemale,'написала','написал')] [faction_target.GetShortUIName], потребовав подчиниться голосованию капитула. Если последует отказ, мы начнём войну."
 gh_landed_order.0031.opening:0 "Наше требование предъявлено"
 gh_landed_order.0032.a:0 "Созвать капитул."
 gh_landed_order.0032.b:0 "Всему своё время."
 gh_landed_order.0032.b.tt:0 "Созовите [snap_conclave|E] через список занятий. Если он не соберётся в течение #V шести месяцев#!, капитул проголосует без него."
 gh_landed_order.0032.desc:0 "[faction_target.GetShortUIName] [Select_CString(faction_target.IsFemale,'согласилась','согласился')] ответить перед капитулом. Мне надлежит созвать внеочередной конклав в резиденции этого правителя."
 gh_landed_order.0032.opening:0 "Магистр уступает"
 gh_landed_order.0033.a:0 "Тогда капитул силой заставит [faction_target.GetHerHim] подчиниться своему решению."
 gh_landed_order.0033.a.tt:0 "Фракция начинает [chapter_censure|E], и каждый её участник поднимает войска сообразно своему влиянию в капитуле."
 gh_landed_order.0033.desc:0 "[faction_target.GetShortUIName] отказывается отвечать перед капитулом. Если решение капитула должно иметь силу, его придётся навязать."
 gh_landed_order.0033.opening:0 "Магистр бросает вызов капитулу"
 gh_landed_order.0034.a:0 "За орден."
 gh_landed_order.0034.desc:0 "[faction_target.GetShortUIName] отказался подчиниться капитулу, и [faction_leader.GetShortUIName] [Select_CString(faction_leader.IsFemale,'призвала','призвал')] нашу фракцию к оружию."
 gh_landed_order.0034.opening:0 "К оружию!"
 gh_landed_order.0040.a:0 "Тогда орден заплатит больше."
 gh_landed_order.0040.a.tt:0 "Недовольство персонажа [landed_order_tributary.GetShortUIName] снизится на #P 30#!"
 gh_landed_order.0040.b:0 "Отпустить [landed_order_tributary.GetHerHim]."
 gh_landed_order.0040.b.tt:0 "[landed_order_tributary.GetShortUIName] перестанет выплачивать дань ордену и начнёт платить её [landed_order_rival.GetShortUIName], если этот правитель может принимать данников. [chapter_strain|E] увеличится на #N 5#!."
 gh_landed_order.0040.desc:0 "[landed_order_rival.GetTitledFirstName] уже некоторое время ухаживает за расположением [landed_order_tributary.GetTitledFirstName], [Select_CString(landed_order_tributary.IsFemale,'которая','который')] всё менее охотно платит дань нашему ордену. Предложены условия выгоднее нынешних, и если я не смогу с ними сравниться, дань уйдёт к другому."
 gh_landed_order.0040.t:0 "Предложение соперника"
 gh_landed_order.0041.a:0 "Орден этого не забудет."
 gh_landed_order.0041.a.tt:0 "[landed_order_tributary.GetShortUIName] больше не является [lay_tributary|E]. [chapter_strain|E] возрастёт на #N 15#!"
 gh_landed_order.0041.desc:0 "[landed_order_tributary.GetTitledFirstName] [Select_CString(landed_order_tributary.IsFemale,'сыта','сыт')] по горло орденом. Дань перестала поступать, за ней исчезло и ополчение, а братья в капитуле уже спорят, кто во всём виноват."
 gh_landed_order.0041.t:0 "Данник отделяется"
 gh_landed_order.0050.a:0 "Пусть управляет собой самостоятельно."
 gh_landed_order.0050.a.tt:0 "Командорство [landed_order_petitioner.GetShortUIName] станет [chapter_house|E]. Его влияние на [chapter_strain|E] уменьшится вдвое, а его комтур получит на один голос меньше в капитуле. Нагрузка на капитул снизится на #P 10#!."
 gh_landed_order.0050.b:0 "Орден един, и правят им отсюда."
 gh_landed_order.0050.b.tt:0 "[order_authority|E] снизится на #N 5#!, [chapter_strain|E] повысится на #N 10#!, а [landed_order_petitioner.GetShortUIName] затаит обиду."
 gh_landed_order.0050.desc:0 "Орден вырос настолько, что один капитул уже не справляется с управлением, и [landed_order_petitioner.GetTitledFirstName] это прекрасно понимает. [Select_CString(landed_order_petitioner.IsFemale,'Она просит','Он просит')] преобразовать своё командорство в капитульный дом: по-прежнему часть ордена, но с собственным управлением и меньшим представительством в капитуле."
 gh_landed_order.0050.t:0 "Прошение об отделении"
 gh_landed_order.0052.a:0 "Что ж, уходите."
 gh_landed_order.0052.a.tt:0 "[faction_leader.GetShortUIName] выведет членов фракции из ордена, образовав независимый Орден соблюдения. Ваш [order_authority|E] снизится на #N 15#!, пострадает [doctrine_standing|E], зато [chapter_strain|E] уменьшится на #P 30#!."
 gh_landed_order.0052.b:0 "Орден един."
 gh_landed_order.0052.b.tt:0 "Фракция начинает войну за [Concept( 'chapter_schism', 'раскол капитула' )|E]"
 gh_landed_order.0052.desc:0 "[faction_leader.GetTitledFirstName] пишет от имени тех братьев, что более не желают управляться из моей резиденции. Они утверждают, что орден слишком разросся для единой власти, и намерены соблюдать его устав строже, чем это делаю я, создав собственный Орден соблюдения. Они просят отпустить их с миром."
 gh_landed_order.0052.opening:0 "Капитул расколот"
 gh_landed_order.0080.a:0 "Покажи мне."
 gh_landed_order.0080.a.tt:0 "Вы становитесь [Concept( 'landed_order_eye_sworn', 'посвящённым Ока' )|E]"
 gh_landed_order.0080.b:0 "Прочь с моих глаз."
 gh_landed_order.0080.b.tt:0 "Вы отвергаете Око; оно не станет обращаться к вам следующие #V 10#! лет"
 gh_landed_order.0080.desc:0 "[owner.GetTitledFirstName] давно искал моего общества. Сегодня вечером, в комнате, освещённой одной свечой, [owner.GetSheHe] наконец заговорил начистоту.\n\n«Твоя вера слепа, [ROOT.Char.GetFirstName]. Те, кому ты молишься, не отвечают. Мы видели то, что наблюдает за миром из гор [Concept('al_ghazir_biozone','Аль-Газира')|E], и оно видело тебя. Открой глаза — и тебе больше никогда не придётся оставаться одному во тьме».\n\nНикто никогда не узнает."
 gh_landed_order.0080.t:0 "Шёпот Ока"
 gh_landed_order.0090.a:0 "Да будет так."
 gh_landed_order.0090.desc:0 "Ни один герольд не объявит об этом, ни один летописец капитула не внесёт этого в записи. Но от старейшего капитульного дома до новейшего [Concept('commandery','командорства')|E] каждый [landed_order|E] отныне втайне подчиняется [GetBuilding('01_the_eye').GetName]. Тех, кто не желал прозреть, переубедили голосованием, пережили или заставили умолкнуть.\n\nЧто намерен сделать с ними Орден Забытого Святого, не знает никто за пределами его стен."
 gh_landed_order.0090.t:0 "Все ордены преклоняют колени"
 gh_landed_order.0091.a:0 "Пускай молчат."
 gh_landed_order.0091.desc:0 "Орден Забытого Святого разоблачён и объявлен отверженным. Имена его слуг названы одно за другим, и больше ни один [ordermaster|E] не преклоняет колен перед [GetBuilding('01_the_eye').GetName]. Шёпот в капитульных домах смолк.\n\nНо исчез ли он навсегда или всего лишь затаился — другой вопрос."
 gh_landed_order.0091.t:0 "Шёпот смолк"
 gh_landed_order.0092.a:0 "Мне можно доверять."
 gh_landed_order.0092.a.tt:0 "Вы становитесь [Concept( 'landed_order_vigil_confidant', 'доверенным лицом Дозора' )|E]"
 gh_landed_order.0092.b:0 "Я не желаю в этом участвовать."
 gh_landed_order.0092.b.tt:0 "Вы отвергаете Дозор; следующие #V 10#! лет он больше к вам не обратится"
 gh_landed_order.0092.desc:0 "Последние месяцы [owner.GetTitledFirstName] был мне осторожным другом, а сегодня вечером наконец заговорил о том, к чему всё это время подводил.\n\n«В орденах завелась гниль, [ROOT.Char.GetFirstName]. Мужчины и женщины, которые днём преклоняют колени перед святыми и капитулом, ночью поклоняются чему-то... потустороннему. Эосианцы стоят против этой силы, но нам нужны глаза, которым можно доверять. Станешь ли ты одним из них?»"
 gh_landed_order.0092.t:0 "Предложение довериться"
 gh_landed_order.0093.a:0 "С Оком покончено."
 gh_landed_order.0093.a.tt:0 "Вы больше не [Concept('landed_order_eye_sworn','присягнувший Оку')|E] и становитесь [Concept('landed_order_vigil_confidant','доверенным лицом Дозора')|E]."
 gh_landed_order.0093.b:0 "Ты ничего не понимаешь."
 gh_landed_order.0093.b.tt:0 "Вы сохраняете верность Оку; следующие #V 10#! лет Дозор больше к вам не обратится"
 gh_landed_order.0093.desc:0 "[owner.GetTitledFirstName] знает. [owner.GetSheHe|U] не [Select_CString(owner.IsFemale,'сказала','сказал')] откуда, да и не было нужды: слова об Оке, шёпоте и клятвах не оставляли сомнений.\n\n«Ещё не поздно, — [Select_CString(owner.IsFemale,'сказала','сказал')] [owner.GetSheHe]. — Отвернись от него, и Дозор встанет между тобой и теми, кто захочет наказать тебя за это»."
 gh_landed_order.0093.t:0 "Прочь от взора Ока"
 gh_landed_order.0094.a:0 "Значит, это правда."
 gh_landed_order.0094.desc:0 "Перед собравшимися капитулами [landed_order_vigil_master.GetTitledFirstName] из Ордена Забытого Хранителя [Select_CString(landed_order_vigil_master.IsFemale,'объявила','объявил')] братьев Ордена Забытого Святого служителями зловещей силы, которую они называют «Оком» и которая таится глубоко под [Glossary('Аль-Газиром','al_ghazir_encyclopedia_desc')]. Перед другими орденами были представлены доказательства: имена, клятвы и письма, одно за другим.\n\nТеперь тайный шёпот прозвучал во всеуслышание. Орден Забытого Святого вряд ли сможет долго противостоять разоблачению."
 gh_landed_order.0094.t:0 "Око разоблачено"
 gh_landed_order.0095.a:0 "Я послужу замыслу Забытого Святого."
 gh_landed_order.0095.a.tt:0 "Вы тайно становитесь [Concept( 'landed_order_eye_sworn', 'посвящённым Ока' )|E]"
 gh_landed_order.0095.b:0 "Я встану на сторону Дозора."
 gh_landed_order.0095.b.tt:0 "Вы становитесь тайным [Concept('landed_order_vigil_confidant','доверенным лицом Дозора')|E] [landed_order_vigil_master.GetShortUIName]."
 gh_landed_order.0095.c:0 "Пока оставлю это при себе."
 gh_landed_order.0095.c.tt:0 "Пока вы не принимаете ничью сторону"
 gh_landed_order.0095.desc:0 "Шёпот оказался правдой. Орден Забытого Святого одного за другим заставлял братьев из других орденов присягать тому, что зовёт «Оком», а эосианцы Забытого Хранителя противостояли этому. Теперь, когда я знаю правду, делать вид, будто ничего не случилось, уже невозможно."
 gh_landed_order.0095.desc.revealed:0 "\n\nОдин из посвящённых назван по имени: [landed_order_truth_revealed.GetTitledFirstName]."
 gh_landed_order.0095.t:0 "Истина, скрытая за шёпотом"
 impose_chapter_discipline_interaction:0 "Навязать дисциплину капитулу"
 impose_chapter_discipline_interaction_desc:0 "Призвать капитул к порядку: ограничить вольности комтуров, потребовать у них отчёта и разрешить их споры своим указом."
 impose_chapter_discipline_interaction_effect_tt:0 "[chapter_strain|E] снизится на #P 25#!, но в течение следующих #V 10#! лет будет расти дополнительно на #N 3#! ежегодно"
 landed_order_authority_toast_desc:0 "Изменилось повиновение капитула своему [Concept( 'ordermaster', 'магистру' )|E], а вместе с ним и [order_authority|E]."
 landed_order_authority_toast_order_authority_0:0 "Власть магистра: $order_authority_0$"
 landed_order_authority_toast_order_authority_1:0 "Власть магистра: $order_authority_1$"
 landed_order_authority_toast_order_authority_2:0 "Власть магистра: $order_authority_2$"
 landed_order_authority_toast_order_authority_3:0 "Власть магистра: $order_authority_3$"
 landed_order_censure_army:0 "Присягнувшие осуждению"
 landed_order_censure_war:0 "Порицание капитула"
 landed_order_censure_war_defeat_defender_desc:0 "Вы заключите всех восставших братьев в темницу без потери [order_authority|E], которая повысится на #P 15#!. [reaffirmation_faction|E] будет распущена, и капитул не сможет вновь подвергнуть вас порицанию в течение #V 3#! лет."
 landed_order_censure_war_defeat_desc:0 "[defender.GetShortUIName|U] заключит всех восставших братьев в темницу без потери [order_authority|E], которая повысится на #P 15#!. [reaffirmation_faction|E] будет распущена, и капитул не сможет вновь подвергнуть этого правителя порицанию в течение #V 3#! лет."
 landed_order_censure_war_victory_defender_desc:0 "Вас сместят, словно капитул проголосовал против вас: избранник [chapter_conclave|E] получит все [Concept('title','титулы')|E] ордена, а вы сохраните только [commandery|E]. Новый [ordermaster|E] заключит вас в темницу."
 landed_order_censure_war_victory_desc:0 "[defender.GetShortUIName|U] будет [Select_CString(defender.IsFemale,'смещена','смещён')] с должности, словно капитул проголосовал против. Избранник [chapter_conclave|E] получит все [Concept('title','титулы')|E] ордена, а прежнему главе останется лишь [commandery|E]. Новый [ordermaster|E] заключит бывшего магистра в темницу."
 landed_order_censure_war_white_peace_desc:0 "[reaffirmation_faction|E] будет распущена. [defender.GetShortUIName|U] останется [ordermaster|E], [order_authority|E] снизится на #N 5#!, и капитул не сможет вновь подвергнуть [defender.GetHerHim] порицанию в течение #V 3#! лет."
 landed_order_conclave_back_motion_intent:0 "Поддержать предложение"
 landed_order_conclave_back_motion_intent_desc:0 "Голосовать за отстранение магистра."
 landed_order_conclave_defend_office_intent:0 "Защитить свою должность"
 landed_order_conclave_defend_office_intent_desc:0 "Повлиять на несогласных и склонить их на свою сторону до голосования."
 landed_order_conclave_deliberate_intent:0 "Взвесить обвинения"
 landed_order_conclave_deliberate_intent_desc:0 "Определить свою позицию, самостоятельно оценив действия магистра."
 landed_order_conclave_press_motion_intent:0 "Добиваться принятия предложения"
 landed_order_conclave_press_motion_intent_desc:0 "Повлиять на сторонников магистра, чтобы до голосования привлечь их на свою сторону."
 landed_order_conclave_stand_by_master_intent:0 "Поддержать магистра"
 landed_order_conclave_stand_by_master_intent_desc:0 "Голосовать за подтверждение полномочий магистра."
 landed_order_demote_komtur_interaction:0 "Понизить до светского данника"
 landed_order_demote_komtur_interaction_desc:0 "Исключить [recipient.GetShortUIName] из капитула: этот правитель сохранит свои земли, но станет данником ордена вместо его должностного лица."
 landed_order_demote_komtur_interaction_effect_tt:0 "[recipient.GetShortUIName] покинет орден и станет наследственным [Concept('lay_tributary','светским данником')|E] с недовольством #N 50#!. Командорство [recipient.GetShortUIName] вернётся капитулу, снижая [chapter_strain|E], а [order_authority|E] упадёт на #N 10#!."
 landed_order_demote_needs_authority_tt:0 "[order_authority|E] составляет не менее #V 10#!"
 landed_order_elected_by_reaffirmation_toast:0 "Капитул избирает вас магистром ордена"
 landed_order_elected_by_reaffirmation_toast_desc:0 "Капитул отстранил персонажа [landed_order_deposed.GetShortUIName], и конклав избрал вас новым магистром."
 landed_order_eye_alliance_interaction:0 "Союз во имя Ока"
 landed_order_eye_alliance_interaction_desc:0 "Приказать своей марионетке Ока стать [Concept( 'ally', 'союзником' )|E] персонажа [recipient.GetShortUINameNoTooltip] без заключения брака."
 landed_order_eye_already_puppet_tt:0 "Уже является чьей-то марионеткой"
 landed_order_eye_anathema_modifier:0 "Анатема"
 landed_order_eye_anathema_modifier_desc:0 "Орден Забытого Святого был перед всеми орденами объявлен приспешником таинственного ужаса, известного лишь как «Око»."
 landed_order_eye_bind_puppet_interaction:0 "Подчинить Оку"
 landed_order_eye_bind_puppet_interaction_desc:0 "[recipient.GetShortUINameNoTooltip|U] [Select_CString(recipient.IsFemale,'присягнула','присягнул')] Оку — [Concept('landed_order_eye_sworn','присягнувший Оку')|E]. Подчините этого правителя как свою #V марионетку Ока#!, чтобы действовать его руками."
 landed_order_eye_bind_puppet_toast:0 "Подчинён Оку"
 landed_order_eye_bind_puppet_tt:0 "Становится вашей #V марионеткой Ока#!"
 landed_order_eye_initiation:0 "Открыть им глаза"
 landed_order_eye_initiation_action:0 "Открыть им глаза"
 landed_order_eye_initiation_desc:0 "Я открою глаза [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] и втайне приведу этого человека к присяге [GetBuilding('01_the_eye').GetName]."
 landed_order_eye_initiation_desc_general:0 "Втайне привести члена другого [Concept('landed_order','владетельного ордена')|E] либо последователя Хранителей или ритуалистов к присяге [GetBuilding('01_the_eye').GetName]."
 landed_order_eye_initiation_failure_toast:0 "Они не узрели истины"
 landed_order_eye_initiation_failure_tt:0 "[target.GetShortUIName|U] отвергает Око, и оно больше не обратится к этому персонажу следующие #V 10#! лет"
 landed_order_eye_initiation_general_desc:0 "$landed_order_eye_initiation_desc_general$"
 landed_order_eye_initiation_interaction:0 "Открыть им глаза #weak (Происки)#!"
 landed_order_eye_initiation_interaction_desc:0 "Начать тайные [Concept( 'scheme', 'происки' )|E], чтобы заставить персонажа [recipient.GetShortUINameNoTooltip] присягнуть [GetBuilding('01_the_eye').GetName]."
 landed_order_eye_initiation_interaction_notification:0 "Открыть им глаза"
 landed_order_eye_initiation_invalidated_title:0 "@scheme_icon! Происки «Открыть им глаза» прекращены"
 landed_order_eye_initiation_success_toast:0 "У Ока новый слуга"
 landed_order_eye_initiation_success_tt:0 "[target.GetShortUIName|U] теперь [Concept( 'landed_order_eye_sworn', 'посвящённый Ока' )|E]"
