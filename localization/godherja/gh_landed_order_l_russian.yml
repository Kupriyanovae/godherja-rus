 situation_parameter_whispers_vigil_open:2 "Тайный советник эосианцев, выполняющий задачу #V Искать тайны#!, имеет на #P 50%#! более высокий шанс обнаружить одного из [Concept('landed_order_eye_sworn','присягнувших Оку')|E], а ежегодный дозор [Concept('ordermaster','магистра')|E] — на #P 30%#!."
 situation_parameter_whispers_vigil_sharpened:2 "Тайный советник эосианцев, выполняющий задачу #V Искать тайны#!, имеет на #P 25%#! более высокий шанс обнаружить одного из [Concept('landed_order_eye_sworn','присягнувших Оку')|E], а ежегодный дозор [Concept('ordermaster','магистра')|E] — на #P 15%#!."
 situation_type_conspiracy_of_whispers:0 "Заговор шёпота"
 situation_type_conspiracy_of_whispers_desc:0 "За открытыми спорами [Concept('landed_order','владетельных орденов')|E] скрывается тайная борьба. Орден Забытого Святого одного за другим приводит их членов к присяге древней могущественной силе. Лишь эосианцы Забытого Хранителя осмеливаются ему противостоять.\n\nКто именно принёс присягу, известно только тем, кто раскрыл эту тайну."
 task_find_secrets_vigil_watch_desc:0 "\nПока продолжается [landed_order_whispers|E], ваш тайный советник также ищет служителей Ока среди [Concept('landed_order','владетельных орденов')|E]:\n$TAB$[SCOPE.ScriptValue('landed_order_vigil_watch_chance_value')|0]#P %#! шанс каждый месяц узнать, что кто-либо [Concept('landed_order_eye_sworn','присягнул Оку')|E], прежде всего в ордене или при дворе, где ведётся поиск."
 tooltip_landed_order_elector_vote_hidden_ties:0 "Негласные связи"
 tooltip_landed_order_elector_vote_hidden_trust:0 "Негласное доверие"
 vigil_confederate:0 "Союзник Дозора"
 vigil_confederate_desc:0 "Они открыто объединились против Ока."
 vigil_confidant:0 "Доверенное лицо Дозора"
 vigil_confidant_desc:0 "Втайне они разделяют доверие Дозора."
 whispers_conspiracy_effects:0 "Заговор"
 whispers_conspiracy_effects_concept:0 "[scheme|E]"
 whispers_order_effects:0 "Ордены настороже"
 whispers_order_effects_concept:0 "[landed_order|E]"
 whispers_phase_open_breach:0 "Открытый разрыв"
 whispers_phase_open_breach_desc:0 "Распря вышла наружу. В домах капитула обнажают клинки, и служители Ока вместе с его врагами больше не пытаются скрывать взаимного презрения."
 whispers_phase_suspicion:0 "Подозрение"
 whispers_phase_suspicion_desc:0 "Слишком много тайн стало явью, и слишком часто за закрытыми дверями шепчутся об отказах. Ордена присматривают друг за другом, а служителям Ока приходится ступать с особой осторожностью."
 whispers_phase_whispers:0 "Шёпот"
 whispers_phase_whispers_desc:0 "Заговор действует незримо. Посланники Забытого Святого переходят из одного капитула в другой, и никто за пределами их круга не ведает, как далеко простирается его влияние."
 landed_order_lay_tributary_desc: "Правитель, который платит дань [Concept('landed_order', 'владетельному ордену')|E], не состоя в нём. Его земли передаются по наследству и не повышают [Concept('chapter_strain', 'напряжённость в капитуле')|E], однако удалённость от ордена и недостаток внимания усиливают недовольство данника (см. [tributary_reach|E]).\n\nВерного светского данника, исповедующего веру ордена, можно принять в орден, а непокорного [Concept('komtur', 'комтура')|E] — вывести из его состава, сделав светским данником."
