 LANDED_ORDER_AUTHORITY_METER_TT:0 "#T Власть магистра#!\nПовиновение капитула своему [Concept( 'ordermaster', 'магистру' )|E]. Определяет закон о власти в ордене:\n$BULLET_WITH_TAB$Менее 25: $order_authority_0$\n$BULLET_WITH_TAB$От 25 до 49: $order_authority_1$\n$BULLET_WITH_TAB$От 50 до 74: $order_authority_2$\n$BULLET_WITH_TAB$75 и более: $order_authority_3$\n\n#T Повышается#!\n$BULLET_WITH_TAB$Каждый год за каждое должностное лицо, чьё [Concept( 'opinion', 'отношение' )|E] к вам составляет 40 или более\n$BULLET_WITH_TAB$За созыв [Concept( 'chapter_general', 'генерального капитула' )|E]\n$BULLET_WITH_TAB$За победу на [Concept( 'reaffirmation_vote', 'голосовании о полномочиях' )|E], особенно на [Concept( 'snap_conclave', 'внеочередном конклаве' )|E]\n$BULLET_WITH_TAB$За победу над [Concept( 'reaffirmation_faction', 'фракцией подтверждения полномочий' )|E] в войне\n\n#T Понижается#!\n$BULLET_WITH_TAB$Каждый год за каждое должностное лицо с отрицательным [Concept( 'opinion', 'отношением' )|E] к вам\n$BULLET_WITH_TAB$За заключение члена ордена под стражу или отзыв титула у вассала вашей веры\n$BULLET_WITH_TAB$На четверть после смерти [Concept( 'ordermaster', 'магистра' )|E]\n$BULLET_WITH_TAB$При поражении на [Concept( 'reaffirmation_vote', 'голосовании о полномочиях' )|E]\n$BULLET_WITH_TAB$За войну с [Concept( 'reaffirmation_faction', 'фракцией подтверждения полномочий' )|E], завершившуюся ничьей"
 LANDED_ORDER_AUTHORITY_SET_BY_METER:0 "[Concept( 'order_authority', 'Власть магистра' )|E] не устанавливается указом: она зависит от повиновения капитула (#V [GetPlayer.MakeScope.ScriptValue('landed_order_authority_display_value')|0]#!/100)"
