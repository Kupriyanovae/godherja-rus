 conspiracy_of_whispers_participant_group_whispers_agionist_faithful:0 "Правоверные агионисты"
 conspiracy_of_whispers_participant_group_whispers_agionist_faithful_desc:0 "Правители-агионисты, не входящие в состав орденов."
 conspiracy_of_whispers_participant_group_whispers_calystos_key:0 "Ключ святого Калисто"
 conspiracy_of_whispers_participant_group_whispers_calystos_key_desc:0 "Орден Ключа святого Калисто, пребывающий в изоляции из-за сочетания удачи и личных прегрешений."
 conspiracy_of_whispers_participant_group_whispers_contested_orders:0 "Оспариваемые ордены"
 conspiracy_of_whispers_participant_group_whispers_contested_orders_desc:0 "Остальные агионистские [Concept( 'landed_order', 'владетельные ордены' )|E], за членов которых ведётся борьба между заговорщиками. Ордены иных вероисповеданий в ней не участвуют."
 conspiracy_of_whispers_participant_group_whispers_drawn_in:0 "Втянутые в заговор"
 conspiracy_of_whispers_participant_group_whispers_drawn_in_desc:0 "Правители иных вероисповеданий, вовлечённые в заговор посредством [Concept( 'secret', 'тайн' )|E]."
 conspiracy_of_whispers_participant_group_whispers_forgotten_saint:0 "Забытый Святой"
 conspiracy_of_whispers_participant_group_whispers_forgotten_saint_desc:0 "Орден Забытого Святого, тайно подчиняющий другие ордены Оку."
 conspiracy_of_whispers_participant_group_whispers_forlorn_guardian:0 "Забытый Хранитель"
