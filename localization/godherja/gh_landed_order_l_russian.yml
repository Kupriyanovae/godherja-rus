Каждый год, пока власть магистра ниже #V 25#!\n$BULLET_WITH_TAB$В течение десяти лет после введения дисциплины капитула\n$BULLET_WITH_TAB$При выходе [Concept( 'lay_tributary', 'светского данника' )|E] из подчинения или его переходе к сопернику\n\n#T Понижается#!\n$BULLET_WITH_TAB$Если командорство остаётся вакантным либо утрачено при понижении статуса\n$BULLET_WITH_TAB$При достижении учением уровня «Почитаемое», ещё сильнее — «Превознесённое»\n$BULLET_WITH_TAB$При введении дисциплины капитула\n$BULLET_WITH_TAB$При постепенном успокоении капитула"
