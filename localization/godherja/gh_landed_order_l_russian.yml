 landed_order_eye_puppet_7:0 "Марионетка Ока"
 landed_order_eye_puppet_7_desc:0 "$landed_order_eye_puppet_desc$"
 landed_order_eye_puppet_8:0 "Марионетка Ока"
 landed_order_eye_puppet_8_desc:0 "$landed_order_eye_puppet_desc$"
 landed_order_eye_puppet_desc:0 "Правитель, [Concept('landed_order_eye_sworn','присягнувший Оку')|E] и подчинённый [Concept('ordermaster','магистру')|E] Забытого Святого. Через таких марионеток магистр может открывать глаза другим, собирать подати, заключать союзы и посылать их на войну."
 landed_order_eye_rebuffed_tt:0 "Отверг предложение Ока в последние #V 10#! лет"
 landed_order_eye_tithe_interaction:0 "Десятина Оку"
 landed_order_eye_tithe_interaction_desc:0 "Приказать марионетке Ока передать #V 30%#! своего [gold_i][Concept( 'gold', 'золота' )|E] персонажу [recipient.GetShortUINameNoTooltip]."
 landed_order_eye_tithed_tt:0 "Уже выплачивал десятину за последние #V 3#! года"
 landed_order_eye_vigil_toast:0 "Дозор разоблачил слугу Ока"
 landed_order_eye_vigil_toast_tt:0 "Вы узнаёте, что [landed_order_eye_uncovered.GetShortUIName] — [Concept( 'landed_order_eye_sworn', 'посвящённый Ока' )|E]"
 landed_order_eye_war_interaction:0 "В поход во имя Ока"
 landed_order_eye_war_interaction_desc:0 "Приказать марионетке Ока вступить на вашу сторону во всех войнах против персонажа [recipient.GetShortUINameNoTooltip]."
 landed_order_eye_war_tt:0 "Ваша марионетка Ока выступит на вашей стороне во всех войнах против персонажа [recipient.GetShortUIName]"
 landed_order_forgotten_gifted_desc:0 "Отмечен [Concept( 'magic', 'магией' )|E]"
 landed_order_forgotten_magi_desc:0 "[magi|E] Ордена Забытого Святого"
 landed_order_holy_war_exalted:0 "Стоимость [Concept('holy_war','священной войны')|E] в [piety|E]: #positive_value -30%#!. Победа в священной войне приносит [prestige|E]."
 landed_order_holy_war_favoured:0 "Стоимость [Concept('holy_war','священной войны')|E] в [piety|E]: #positive_value -15%#!."
 landed_order_imprison_authority_tt:0 "[order_authority|E] снижается на #N 6#! за заключение в темницу члена ордена вашей [Concept('faith','конфессии')|E]."
 landed_order_imprison_standing_tt:0 "[doctrine_standing|E] повышается за привлечение к ответу должностного лица, исповедующего ересь."
