l_russian:
 magic_focused:0 "Магические интересы"
 magic_focused_desc: "$magic_focused$ [vassals|E] заботятся о том, чтобы углублять и выставлять напоказ свои познания в [Concept('arcana','магических искусствах')|E] и [Concept('magic','магии')|E]. Рассудительные и любознательные вассалы часто придерживаются таких [Concept( 'vassal_stance', 'взглядов' )|E], и они более склонны изучать магию и копить её.\n\n#low $magic_focused$ вассалы любят, когда их сюзерен:#!\n$EFFECT_LIST_BULLET$Обладает низким [Concept('crown_authority','авторитетом короны')|E]\n$EFFECT_LIST_BULLET$Дает [Concept('titles','титулы')|E] персонажам-[Concept('magi','магам')|E]\n$EFFECT_LIST_BULLET$Преуспевает в [Concept('scheme','происках')|E] ради [Concept('crown_authority','авторитета короны')|E]\n$EFFECT_LIST_BULLET$Сам является [magi|E]\n\n#low $magic_focused$ вассалы не любят, когда их сюзерен:#!\n$EFFECT_LIST_BULLET$Обладает высоким [crown_authority|E]\n\nОни предпочитают могущественных [Concept('heirs','наследников')|E]-[Concept('magi','магов')|E] с высоким значением навыка [arcana_i][Concept('arcana','арканы')|E]."
 magic_focused_filter_option: "$magic_focused$"
 magic_focused_option_desc: "Показывать только персонажей с [GetVassalStance( 'magic_focused').GetName] [Concept( 'vassal_stance', 'взглядами' )|E]"
 magic_focused_vassal: "[GetVassalStance( 'magic_focused' ).GetTextIcon][GetVassalStance( 'magic_focused' ).GetName] [vassal|El]"
 magic_focused_vassals: "[GetVassalStance( 'magic_focused' ).GetTextIcon][GetVassalStance( 'magic_focused' ).GetName] [vassals|El]"
 magic_focused_opinion: "Мнение $magic_focused_vassal$"
 magic_focused_same_faith_opinion: "$magic_focused_opinion$ #weak с общей [Concept( 'faith', 'конфессией' )|E]#!"
 magic_focused_different_faith_opinion: "$magic_focused_opinion$ #weak другой [Concept( 'faith', 'конфессией' )|E]#!"
 magic_focused_same_culture_opinion: "$magic_focused_opinion$ #weak с общей [Concept( 'culture', 'культурой' )|E]#!"
 magic_focused_different_culture_opinion: "$magic_focused_opinion$ #weak другой [Concept( 'culture', 'культурой' )|E]#!"
 magic_focused_tax_contribution_add: [modifier_base_contribution|E] [Concept( 'tax', 'налогов' )|E] с "$magic_focused_vassal$"
 magic_focused_tax_contribution_mult: "[modifier_contribution|E] [Concept( 'tax', 'налогов' )|E] с $magic_focused_vassal$"
 magic_focused_levy_contribution_add: "[modifier_base_contribution|E] [Concept( 'levy', 'ополчения' )|E] c $magic_focused_vassal$"
 magic_focused_levy_contribution_mult: "[modifier_contribution|E] [Concept( 'levy', 'ополчения' )|E] с $magic_focused_vassal$"

 every_magic_focused_vassal_actor: "Каждый $magic_focused_vassal$ ([actor.MakeScope.ScriptValue('number_of_magic_focused_vassals')|V0])"
 every_magic_focused_vassal: "Каждый #TOOLTIP:VASSAL_STANCE,magic_focused #L [GetVassalStance( 'magic_focused' ).GetTextIcon]магический [Concept( 'vassal', 'вассал' )|E] ([root_scope.MakeScope.ScriptValue('number_of_magic_focused_vassals')|V0])"
 every_participating_magic_focused_vassal: "Каждый участвующий #TOOLTIP:VASSAL_STANCE,magic_focused #L [GetVassalStance( 'magic_focused' ).GetTextIcon]магический [Concept( 'vassal', 'вассал' )|E] ([THIS.Char.MakeScope.ScriptValue('number_of_participating_magic_focused_vassals')|V0])"

 no_stance: "Без взглядов"
 no_stance_desc: ""