 bleeding_martyr_reform_decision_tt:0 "Вы взяли под контроль Орден и искоренили скверну"
 bleeding_martyr_reform_decision_desc:0 "После долгих лет во тьме скверна и разложение, поразившие наш Орден, наконец исцелены, и мы вновь можем посвятить себя врачеванию больных вместо жестоких экспериментов. Остаётся лишь издать окончательный указ, закрепляющий наши реформы и карающий тех, кто совершал ужасные преступления во имя Святой, прежде чем мы сможем начать тяжёлую работу по очищению от кровавого наследия прошлого. Однако хотя те в наших рядах, кто пытался извратить учение, уже понесли заслуженную кару, расплата с истинными вдохновителями заговора ещё впереди..."
