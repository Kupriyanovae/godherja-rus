 reform_great_tarrafent_decision: "Восстановить Великий таррафент"
 reform_great_tarrafent_decision_desc: "Наш народ пребывал разобщённым и рассеянным по [Glossary('Великой пустыне','sarradonian_desert_encyclopedia_desc')]  тех пор, как Великий таррафент окончательно пал. Быть может, теперь, когда потомки детей Мармала вновь ходят по земле, Океан Грёз может вернуться вновь."
 reform_great_tarrafent_decision_tooltip: "Используйте свою легенду среди дюн, чтобы возродить власть мармаладидов в [Concept('sarradon','Саррадоне')|E]."
 reform_great_tarrafent_decision_confirm: "Да направят нас звёзды!"
 reform_great_tarrafent_decision_powerful_vassals_tt_desc: "Все ваши [Concept('powerful_vassals','могущественные вассалы')|E] обладают [Concept('culture','культурой')|E] с [Concept('tradition','традицией')|E] [GetCultureTradition('tradition_desert_nomads').GetName]"
 nick_tuder_amhaddi: "Тудер-Амхадди"
 historic_great_tarrafent: "Исторический таррафент"
 every_non_root_faith_vassal_great_tarrafent: "Каждый не-[THIS.Char.GetFaith.GetAdjective] [Concept('vassal','вассал')|E] или ниже в пределах исторического Таррафента"
 every_non_root_faith_county_tarrafent: "Каждое не-[THIS.Char.GetFaith.GetAdjective] [Concept('county','графство')|E] в пределах исторического Таррафента"
 every_non_tarrafent_uniter_faith_convert: "Обращается в [great_tarrafent_uniter.GetFaith.GetName|V]"
 sarradon_decisions.1001.t: "[reclaimer.Getculture.GetNameNoTooltip|U] великий таррафент"
 sarradon_decisions.1001.desc: "Слишком долго наш народ пребывал без цели, погрязнув в старых устоях после того, как узрел, что было свершено в минувших веках. Падение Великого таррафента отбросило нас назад.\n\nТо время прошло. С возрождением Океана Грёз наша отвага и сила воспряли вновь. Скоро мы подчиним себе всю пустыню, а затем и то, что за её пределами."
 sarradon_decisions.1001.a: "Восславим предков!"
 sarradon_decisions.1001.custom: "Все [Concept('counties','графства')|E] в пределах исторического Таррафента"
 reform_great_tarrafent_culture_modifier: "Океан Грёз восстановлен"
 reform_great_tarrafent_culture_modifier_desc: "Скорость [Concept('promote_culture','распространения культуры')|E] (только мармаладидские культуры): #P +75%#!"
 unlock_great_tarrafent_decision: "fp3_unlock_meditation.tt: "Разблокирует [Concept('decision','решение')|E] «Восстановить Великий таррафент»."
 fervor_great_tarrafent_reformed: "Великий Таррафент переродился!"

 revive_the_chosen_magi_decision: "Воскресить практики Талита Намит"
 revive_the_chosen_magi_decision_desc: "Со времён катаклизма [Concept('the_decimation_of_sarradon','Халакдуна')|E], древние обычаи, некогда определявшие уклад мармаладидского общества, исчезли в песках, уступив место новым обрядам и традициям. Мы должны возродить ту роль, что [Concept('marmaladid_chosen_magi','Избранные маги')|E] занимали в нашем обществе, и раскрыть какие тайны были утрачены."
 revive_the_chosen_magi_decision_tooltip: "Воскресить [Concept('faith','веру')|E] Талита Намит и школу [Concept('magic','магии')|E], которую они некогда направляли."
 revive_the_chosen_magi_decision_confirm: "Да вернется магия"
 revive_the_chosen_magi.county_conversions.tt: "[Concept('counties','Графства')|E] в вашей [Concept('realm','державе')|E] разделяющие ваше [Concept('cultural','культурное')|E] [Concept('heritage','наследие')|E] могут обратиться в $talita_namit$"
 restore_chosen_magi.every_converted_province: "$EFFECT_LIST_BULLET$ Все [Concept('counties','графства')|E], что обратяться"
 fervor_gain_talita_namit_revived: "Практики Талита Намит"
 sarradon_decisions.2001.t: "Возвращение магии"
 sarradon_decisions.2001.desc: "Возвращение Талита Намит  нашему народу разнеслось по моим владениям подобно пожару. Скоро обратятся и многие другие, а те [Concept('magi','маги')|E], что ещё остаются в наших аханах и анклавах, отыщут путь ко мне в надежде быть избранными. Кто знает, какие тайны могут быть явлены магией, собранной воедино в этом начинании."
 sarradon_decisions.2001.a: "Восславим [realm_above|E]!"
 sarradon_decisions.2001.effect_school_tooltip: "Ваша [Concept('culture','культура')|E] примет [Concept('magic_type','школу магии')|E] #V $talita_namit_school_name$#!"
 marmaladid_appreciation_modifier: "Мармаладидское почитание"
 marmaladid_appreciation_modifier_desc: "Это [Concept('county','графство')|E] недавно прониклось почтением к [Concept('marmaladid_chosen_magi','старым путям')|E]"

 sarradon_decisions.3004.t:0 "Восточные земли отвоёваны"
 sarradon_decisions.3004.desc:0 "Упадок Кханамухата со времён смерти Хартаха, о котором некогда говорили как о неизбежном, остановлен. Даже самые дальние пределы Сирвалийского побережья, отторгнутые у нас кочевниками и долгое время неподвластные нашей власти, вновь стоят заодно с Хенемхатом.\n\nМногое ещё предстоит свершить, но для [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] и моего народа занимается новая заря."
 sarradon_decisions.3004.a:0 "Могучая держава!"

 sarradon_decisions.3001.t:0 "Восход алмусидов"
 sarradon_decisions.3001.desc:1 "Земли Сирвалийского побережья даровали нашему народу тучные и плодородные угодья для заселения и роста.\n\nПереняв некоторые из местных традиций, мы сумеем лучше приноровиться к этому краю.."
 sarradon_decisions.3001.a:0 "За новых друзей и новое начало!"

 sarradon_decisions.3002.t:0 "$sarradon_decisions.3001.t$"
 sarradon_decisions.3002.desc:0 "Мы далеко от земель, что наши предки звали домом, но именно эти земли Сирвалийского побережья мы считаем своей страной. Как [Select_CString(ROOT.Char.IsFemale, 'предводительница', 'предводителю')] моего народа, я [Select_CString(ROOT.Char.IsFemale, 'обязана', 'обязан')] обеспечить грядущее процветание, и если нам суждено цвести здесь, то мы должны приспособиться к новому окружению. Мы должны учиться у народа, чьи предки возделывали эти плодородные земли.\n\nЭтим указом мы изменим наш уклад жизни на благо наших родичей. Мы проложим новый путь — как собственный народ."
 sarradon_decisions.3002.a:0 "Новый народ на новой земле!"

 sarradon_decisions.3003.t:0 "$sarradon_decisions.3001.t$"
 sarradon_decisions.3003.desc:0 "Группа поселенцев из глубины пустыни обосновалась на Cирвалийском побережье, создав там для себя новый дом.\n\nИх [Select_CString(almusid_founder.IsFemale, 'предводительница', 'предводитель')], [almusid_founder.GetTitledFirstName], [Select_CString(almusid_founder.IsFemale, 'провозгласила', 'провозгласил')], что [almusid_founder.GetHerHis] народ перенимет ряд местных обычаев и традиций, дабы обеспечить себе процветание на этой новой земле."
 sarradon_decisions.3003.a:0 "What does this mean for the region?"