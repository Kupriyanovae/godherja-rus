 saint_calystos_key_reform_decision:0 "Реформировать Орден"
 saint_calystos_key_reform_decision_tooltip:0 "Вернуть Орден к изначальному видению Калисто"
 saint_calystos_key_reform_decision_tt:0 "Вы взяли под контроль Орден и искоренили скверну"
 saint_calystos_key_reform_decision_desc:0 "После долгих лет во тьме наш Орден наконец освободился от скверны и алчности, чтобы мы вновь могли бороться за свободу угнетённых, вместо того чтобы порабощать невинных, извращая учение Калисто. Остаётся лишь издать окончательный указ, закрепляющий наши реформы и карающий тех, кто совершал ужасные преступления во имя Святого, прежде чем мы сможем начать тяжёлую работу по очищению от кровавого наследия прошлого. Однако хотя те в наших рядах, кто пытался извратить учение, уже понесли заслуженную кару, расплата с истинными вдохновителями заговора ещё впереди — и она будет кровавой..."
