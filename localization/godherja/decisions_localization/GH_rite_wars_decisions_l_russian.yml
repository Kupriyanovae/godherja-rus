 form_the_earth_rite_decision: "Form the Prohen Rite"
 form_the_earth_rite_decision_desc: "[Glossary('Prohen','PROHEN_GLOSS')] Worship has survived for centuries despite ostracization by much of [GetCulturePillar('heritage_sjalvolki').GetName] society. But the world changes, and with the spread of Rite ideals, the fate of all may yet be codified in doctrine."
