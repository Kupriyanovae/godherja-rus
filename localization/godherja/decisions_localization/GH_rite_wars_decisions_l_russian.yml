 form_the_river_rite_decision: "Form the Pathos Rite"
 form_the_river_rite_decision_desc: "Ever since our people arrived in the [Glossary('Pathos Delta','pathos_delta_encyclopedia_desc')], we knew there was something special about its waters. [Glossary('Varpalis','VARPALIS_GLOSS')] led us here, and it is now our duty to protect and flourish along these rivers."
