 gh_rws_struggle_hostility_house_faith_modifier:1 "Вражда по вере"
 gh_rws_struggle_hostility_house_faith_modifier_desc:0 "Этот дом завоевал большую часть Опакасии во имя своей веры."
 gh_rws_struggle_hostility_house_culture_modifier:1 "Культурная вражда"
 gh_rws_struggle_hostility_house_culture_modifier_desc:0 "Этот дом завоевал большую часть Опакасии во имя своего народа."
 gh_rws_struggle_hostility_house_combined_modifier:1 "Вражда господства"
 gh_rws_struggle_hostility_house_combined_modifier_desc:0 "Этот дом завоевал большую часть Опакасии во имя своей веры и народа."
