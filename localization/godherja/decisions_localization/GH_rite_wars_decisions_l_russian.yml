 form_highkingdom_decision_hostility_involvement_tt:0 "Каждое [de_jure|El] [Concept('county', 'графство')|E] вашего [Concept('capital', 'столичного')|E] [Concept('kingdoms', 'королевства')|E] ([THIS.Char.GetCapitalLocation.GetCounty.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]) должно быть #L [THIS.Char.GetFaith.GetName|l]им#! и #L [THIS.Char.GetCulture.GetCollectiveNoun|l]им#! ([SCOPE.ScriptValue('gh_rws_struggle_hostility_county_counter_value')|0]/[SCOPE.ScriptValue('gh_rws_struggle_hostility_county_total_value')|0])"
 form_highkingdom_decision_region_tt:0 "Никакой другой [Concept('independent', 'независимый')|E] [Concept('struggle_involved', 'участвующий в борьбе')|E] [Concept('ruler', 'правитель')|E] не контролирует более [SCOPE.ScriptValue('form_highkingdom_region_percent_value')|0]% региона [GetGeographicalRegion('struggle_rite_wars_south').GetName]"
 form_highkingdom_decision_kingdom_tt:0 "Необходимо контролировать [Concept('kingdoms', 'королевства')|E] Гевек, Бакав и Сабальв не менее 25 лет каждое"
 form_highkingdom_ends_struggle_tt:0 "Если вы [Concept('completely_control', 'полностью контролируете')|E] регион [GetGeographicalRegion('struggle_rite_wars_south').GetName], [Concept('rite_wars_south_struggle', 'Южные Войны Обрядов')|E] завершатся"
 mountain_footholder_transfer_tt:0 "[THIS.Title.GetName] [THIS.GetName]"
 form_highkingdom_dejure_structure_tt:0 "Любые [Concept('kingdoms', 'королевства')|E] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('struggle_rite_wars_south').GetName], которые вы [Concept('completely_control', 'полностью контролируете')|E], станут [de_jure|El] частью державы [GetTitleByKey('e_opakasija').GetNameNoTier]"
 
 form_mountain_sun_concordat_decision:0 "Образовать Конкордат Горного Солнца"
 form_mountain_sun_concordat_decision_desc:0 "Эти земли были залиты кровью задолго до прихода сьялволков и остаются такими по сей день. Теперь мы должны положить этому конец и привести наш дом в новую эру."
 form_mountain_sun_concordat_decision_tt:0 "Вы образуете Конкордат Горного Солнца!"
 form_mountain_sun_concordat_decision_confirm:0 "Слава Чистейшему!"
 gh_struggle_uninvolved_tt:0 "Вы не [Concept('struggle_involved', 'участвуете в')|E] [Concept('rite_wars_south_struggle', 'Южных Войнах Обрядов')|E]"
 form_mountain_concordat_interloper_tt:0 "Вы — [Concept('struggle_interloper', 'вмешавшийся')|E] в [Concept('rite_wars_south_struggle', 'Южных Войнах Обрядов')|E]"
 form_mountain_concordat_kingdom_opakhasia_tt:0 "Вы [Concept('hold', 'удерживаете')|E] и [Concept('completely_control', 'полностью контролируете')|E] [de_jure|El] [Concept('kingdom', 'королевство')|E] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('struggle_rite_wars_south').GetName]"
 form_mountain_concordat_kingdom_held_tt:0 "Вы удерживаете этот [Concept('title', 'титул')|E] не менее [SCOPE.ScriptValue('fp2_struggle_secure_rite_wars_south_foothold_years_value')|0Z] лет"


 gh_rws_struggle_secure_rite_wars_south_foothold_religion_tt:0 "Вы [Concept('hold', 'удерживаете')|E] не менее #Z [SCOPE.ScriptValue('fp2_struggle_secure_rite_wars_south_foothold_religion_target_percent_value')|0]%#! [Concept('counties', 'графств')|E] [THIS.Char.GetFaith.GetReligion.GetName]ой [Concept('faith', 'конфессии')|E] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('struggle_rite_wars_south').GetName] (Сейчас: [SCOPE.ScriptValue('fp2_struggle_secure_rite_wars_south_foothold_religion_percent_value')|1]%)\n"
 gh_rws_struggle_secure_rite_wars_south_foothold_outsider_tt:0 "Вы [Concept('hold', 'удерживаете')|E] не менее #Z [SCOPE.ScriptValue('fp2_struggle_secure_rite_wars_south_foothold_outsider_target_percent_value')|0]%#! [Concept('counties', 'графств')|E] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('struggle_rite_wars_south').GetName] (Сейчас: [SCOPE.ScriptValue('fp2_struggle_secure_rite_wars_south_foothold_outsider_percent_value')|0]%)\n"
 gh_rws_struggle_secure_rite_wars_south_foothold_kingdom_faith_tt:0 "Не менее #Z [SCOPE.ScriptValue('fp2_struggle_secure_rite_wars_south_foothold_faith_target_percent_value')|0]%#! [de_jure|El] [Concept('counties', 'графств')|E] этого [Concept('title', 'титула')|E] исповедуют #L [THIS.Char.GetFaith.GetName|l]кую#! конфессию"
 form_mountain_concordat_kingdom_border_tt:0 "Этот [Concept('title', 'титул')|E] находится [de_jure|El] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('opakhasia_biozone').GetName]"
 form_mountain_concordat_effect_tt:0 "Каждое [de_jure|El] [Concept('kingdom', 'королевство')|E] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('opakhasia_biozone').GetName], удовлетворяющее приведённым ниже условиям, станет [de_jure|El] частью [GetTitleByKey('e_mountain_sun_concordat').GetNameNoTier]"
 form_mountain_concordat_ends_the_struggle_tt:0 "[Concept('rite_wars_south_struggle', 'Южные Войны Обрядов')|E] завершатся"

 ##### Вражда #####
 struggle_rite_wars_south_ending_hostility_decision:1 "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]ое господство"
 struggle_rite_wars_south_ending_hostility_decision_desc:0 "Пришла пора сильному лидеру наконец-то вытащить эти земли из трясины бесконечных войн и разладов. Опакасией будет править [ROOT.Char.GetFaith.GetNameNoTooltip|l][Select_CString(ROOT.Char.IsFemale, 'ая', 'ий' )] [ROOT.Char.Custom('GetQueenKing')|l] под [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|l]им знаменем!"
 struggle_rite_wars_south_ending_hostility_decision_tooltip:0 "Покончить с [Concept('struggle', 'борьбой')|E] обрядов"
 struggle_rite_wars_south_ending_hostility_decision_confirm:1 "Покончить с борьбой обрядов"
