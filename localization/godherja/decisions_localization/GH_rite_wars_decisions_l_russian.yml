 gh_rws_struggle_hostility_holy_cb_joint_tt:0 "[casus_bellis|E] «$HOLY_WAR_DUCHY_NAME$» против других [Concept('struggle_involved', 'участвующих в борьбе')|E] [Concept('faiths', 'конфессий')|E]: #positive_value -50%#!\n$culture_parameter_cb_lower_piety_level_requirement$"
 gh_rws_struggle_hostility_culture_cb_tt:0 "[casus_bellis|E] «$CONQUEST_DUCHY_CB_NAME$» против других [Concept('struggle_involved', 'участвующих в борьбе')|E] [Concept('cultures', 'культур')|E]: #positive_value -50%#!"
 gh_rws_struggle_hostility_culture_tt:0 "У всех [Concept('struggle_involved', 'участвующих в борьбе')|E] [Concept('cultures', 'культур')|E] [Concept('cultural_acceptance', 'терпимость')|E] друг к другу снижается на #negative_value [SCOPE.ScriptValue('fp2_struggle_hostility_culture_acceptance_value')]%#!"
