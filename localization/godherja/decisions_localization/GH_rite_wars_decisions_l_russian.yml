 struggle_rite_wars_south_ending_hostility_decision_county_tt:0 "Каждое [de_jure|El] [Concept('county', 'графство')|E] вашего [Concept('capital', 'столичного')|E] [Concept('kingdoms', 'королевства')|E] ([THIS.Char.GetCapitalLocation.GetCounty.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]) должно быть #L [THIS.Char.GetFaith.GetName|l]им#! и #L [THIS.Char.GetCulture.GetCollectiveNoun|l]им#! ([SCOPE.ScriptValue('fp2_struggle_hostility_county_counter_value')|0]/[SCOPE.ScriptValue('fp2_struggle_hostility_county_total_value')|0])"
 struggle_rite_wars_south_ending_hostility_decision_county_light_tt:0 "75% [de_jure|El] [Concept('counties', 'графств')|E] вашего [Concept('capital', 'столичного')|E] [Concept('kingdom', 'королевства')|E] ([THIS.Char.GetCapitalLocation.GetCounty.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]) должны быть #L [THIS.Char.GetCulture.GetCollectiveNoun|l]ими#! и #L [THIS.Char.GetFaith.GetName|l]ими#! ([SCOPE.ScriptValue('fp2_struggle_hostility_county_counter_value')|0]/[SCOPE.ScriptValue('fp2_struggle_hostility_county_total_light_value')|0])"
