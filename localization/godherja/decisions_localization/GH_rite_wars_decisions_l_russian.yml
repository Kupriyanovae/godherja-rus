 ##### Компромисс #####
 struggle_rite_wars_south_ending_compromise_decision:1 "Статус-кво"
 struggle_rite_wars_south_ending_compromise_decision_desc:0 "Эти бесконечные конфликты из-за региона лишь ослабляют нас всех. Пришло время признать, что Опакасию объединить не получится. Нас устроит и [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 struggle_rite_wars_south_ending_compromise_decision_tooltip:0 "$struggle_rite_wars_south_ending_hostility_decision_tooltip$"
 struggle_rite_wars_south_ending_compromise_decision_confirm:0 "$struggle_rite_wars_south_ending_hostility_decision_confirm$"
 # Условия
 struggle_rite_wars_south_ending_compromise_decision_kingdom_tt:0 "Вы [Concept('hold', 'удерживаете')|E] и [Concept('completely_control', 'полностью контролируете')|E] любое из [de_jure|El] [Concept('kingdom', 'королевств')|E] в регионе [GetGeographicalRegion('struggle_rite_wars_south').GetName] ([SCOPE.ScriptValue('fp2_struggle_ending_kingdom_counter_value')|0]/[SCOPE.ScriptValue('fp2_struggle_conciliation_kingdom_total_value')|0])"
 struggle_rite_wars_south_ending_compromise_decision_region_tt:0 "Вы контролируете менее [SCOPE.ScriptValue('fp2_struggle_compromise_owned_percent_value')|0]% [Concept('region', 'региона')|E] [GetGeographicalRegion('struggle_rite_wars_south').GetName] (Сейчас: [SCOPE.ScriptValue('struggle_rite_wars_south_ending_compromise_decision_region_owned_percent_value')|0]%)"
 struggle_rite_wars_south_ending_compromise_decision_other_region_tt:0 "Никакой другой [Concept('independent', 'независимый')|E] [Concept('struggle_involved', 'участвующий в борьбе')|E] [Concept('ruler', 'правитель')|E] не контролирует [SCOPE.ScriptValue('fp2_struggle_compromise_involved_percent_value')|0]% или более [Concept('region', 'региона')|E] [GetGeographicalRegion('struggle_rite_wars_south').GetName]."
 struggle_rite_wars_south_ending_compromise_decision_opinion_tt:0 "У всех других [Concept('independent', 'независимых')|E] [Concept('struggle_involved', 'участвующих в борьбе')|E] [Concept('ruler', 'правителей')|E] [Concept('opinion', 'мнение')|E] о вас не ниже [SCOPE.ScriptValue('struggle_rite_wars_south_ending_compromise_decision_opinion_value')|0] или вы имеете на них [Concept('strong_hook', 'сильное влияние')|E] ([SCOPE.ScriptValue('struggle_rite_wars_south_ending_compromise_decision_opinion_counter_value')|0]/[SCOPE.ScriptValue('struggle_rite_wars_south_ending_ending_decision_foreign_realm_total_value')|0])"
 struggle_rite_wars_south_ending_compromise_decision_independent_tt:0 "Ни у какого другого [Concept('independent', 'независимого')|E] [Concept('struggle_involved', 'участвующего в борьбе')|E] [Concept('ruler', 'правителя')|E] нет [Concept('rank', 'ранга')|E] [Concept('king', 'короля')|E] или [Concept('emperor', 'императора')|E] (Сейчас: [SCOPE.ScriptValue('struggle_rite_wars_south_ending_compromise_decision_independent_counter_value')|0])"
 struggle_rite_wars_south_ending_compromise_decision_interloper_tt:0 "Более [SCOPE.ScriptValue('fp2_struggle_compromise_uninvolved_percent_value')]% [Concept('region', 'региона')|E] [GetGeographicalRegion('struggle_rite_wars_south').GetName] удерживают [Concept('struggle_interloper', 'вмешавшиеся')|E] или [Concept('struggle_uninvolved', 'не участвующие в борьбе')|E] [Concept('rulers', 'правители')|E] (Сейчас: [SCOPE.ScriptValue('struggle_rite_wars_south_ending_compromise_decision_region_interloper_percent_value')|1]%)"
 struggle_rite_wars_south_ending_compromise_truce_tt:1 "Между [Concept('independent', 'независимыми')|E] [Concept('struggle_involved', 'участвующими в борьбе')|E] [Concept('ruler', 'правителями')|E] не ведется [Concept('wars', 'войн')|E] (Сейчас: [SCOPE.ScriptValue('struggle_rite_wars_south_ending_compromise_decision_war_counter_value')|0])"
 # Эффекты
 gh_rws_struggle_compromise_create_new_kingdoms_tt:0 "Каждое [Concept('independent', 'независимое')|E] или отдельное [Concept('duchy', 'герцогство')|E] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('struggle_rite_wars_south').GetName] становится [de_jure|El] [Concept('kingdom', 'королевством')|E]"
 gh_rws_struggle_compromise_create_new_empires_tt:1 "Каждое [de_jure|El] [Concept('kingdom', 'королевство')|E] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('struggle_rite_wars_south').GetName], имеющее более [EmptyScope.ScriptValue('gh_rws_struggle_compromise_ending_minimal_empire_size')|0] [Concept('counties', 'графств')|E], становится [de_jure|El] [Concept('empire', 'империей')|E]. Остальные королевства [de_jure|El] войдут в состав соседней [Concept('empire', 'империи')|E]."
 gh_rws_struggle_compromise_house_rewards_tt:2 "Ваш [house|El] и [house|El] [Concept('independent', 'независимого')|E] [Concept('struggle_involved', 'вовлеченного в борьбу')|E] [Concept('ruler', 'правителя')|E]"
