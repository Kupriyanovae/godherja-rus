l_russian:
 form_high_kingdom_of_opakasija_decision:0 "Основать Верховное королевство Опакасия"
 form_high_kingdom_of_opakasija_decision_desc:0 "Наш народ давно считает эти скалистые берега своим домом, и пришло время поднять наше знамя наперекор мелким марочникам и князьям Обряда."
 form_high_kingdom_of_opakasija_decision_tooltip:0 "Вы основываете Верховное королевство Опакасия!"
 form_high_kingdom_of_opakasija_decision_confirm:0 "Мы почтим Пути!"

 form_high_kingdom_of_opakasija_decision_chevalie_doesnt_exist:0 "[Concept('chevalie', 'Шевалье')|E] не существует"
 form_high_kingdom_of_opakasija_decision.chevalie_is_sinful:0 "Правитель [Concept('chevalie', 'Шевалье')|E] обладает как минимум одним [Concept('sinful', 'греховным')|E] [Concept('traits', 'свойством')|E]"
 form_highkingdom_involvement_tt:0 "Текущая [struggle_phase|El] — [Concept('struggle_phase_iberia_hostility', 'фаза враждебности')|E]"
