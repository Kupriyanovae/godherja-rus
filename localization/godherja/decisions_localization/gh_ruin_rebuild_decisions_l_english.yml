l_english:
 #El Qulatha in ruins
 qulatha_rebuild_tooltip:0 "Rise from the ruins"
 qulatha_rebuild.t:0 "Restore the glory of El-Qulatha"
 qulatha_rebuild.desc:0 "Alas, alas, for the divine city that once decorated with hundred temples and a thousand pillars. Now only barren earth remains, with crows perching on her charred lintel! the virtues and joys of those who once called this place home have long since faded; only their sorrowful, withered bones remain, never even having been buried.\n\nYet however evil the force that sought to consume it, it has never - and never will - consume eternal hope. El-Qulatha is about to be revived, and will inevitably be revived; The dead shall rest in peace, and the living shall sing once more, for the dawn that breaks after the darkest night, and for the resurgent light of Sarradon that shines bright. Her child will surely wipe away the tears from her mother's face."
 qulatha_rebuild_confirm:0 "Come and bear witness to this"
 decision_qulatha_rebuild.second_step:0 "And where does it begin?"

 qulatha_rebuild.tt.qulatha_rebuild_fallback:0 "Fallback"
 qulatha_rebuild.tt.qulatha_rebuild_ashmarite_hospital:0 "$building_01_ashmarite_hospital$"
 qulatha_rebuild_ashmarite_hospital_tooltip:0 "Let the name of the saint resound again, by his selfless healing hands banishing sorrow and death."
 qulatha_rebuild.tt.qulatha_rebuild_sunarsarwena_gardens:0 "$building_01_sunarsarwena_gardens$"
 qulatha_rebuild_sunarsarwena_gardens_tooltip:0 "Memories of her beauty will live on, even though both the princess and her descendants have long since passed away."
 qulatha_rebuild_fallback_effect.tt:0 "You will choose a ruined project to restore"