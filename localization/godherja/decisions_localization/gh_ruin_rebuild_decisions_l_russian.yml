l_russian:
 #El Qulatha in ruins
 qulatha_rebuild_tooltip:0 "Восстать из руин"
 qulatha_rebuild.t:0 "Восстановить величие Эль-Кулаты"
 qulatha_rebuild.desc:0 "Увы, увы божественному городу, что некогда был украшен сотней храмов и тысячей колонн! Ныне осталась лишь бесплодная земля да вороны, восседающие на её обугленных притворах. Добродетели и радости тех, кто когда-то называл это место своим домом, давно угасли; уцелели лишь печальные, иссохшие кости, так и не преданные земле.\n\nИ всё же, какою бы злой ни была сила, жаждавшая поглотить его, ей не сокрушить вечную надежду. Эль-Кулата возродится, её подъем неизбежен. Мёртвые упокоятся с миром, а живые вновь запоют — во славу рассвета, что восходит за самой тёмной ночью, и во имя вновь вспыхнувшего света Саррадона. Дитя непременно отрёт слёзы с лица своей матери."
 qulatha_rebuild_confirm:0 "Узрите же это"
 decision_qulatha_rebuild.second_step:0 "И с чего же всё начнётся?"

 qulatha_rebuild.tt.qulatha_rebuild_fallback:0 "Запасной вариант"
 qulatha_rebuild.tt.qulatha_rebuild_ashmarite_hospital:0 "$building_01_ashmarite_hospital$"
 qulatha_rebuild_ashmarite_hospital_tooltip:0 "Пусть имя святого прозвучит вновь, а его бескорыстные врачующие руки прогонят скорбь и смерть."
 qulatha_rebuild.tt.qulatha_rebuild_sunarsarwena_gardens:0 "$building_01_sunarsarwena_gardens$"
 qulatha_rebuild_sunarsarwena_gardens_tooltip:0 "Память о её красоте будет жить, пусть даже и сама принцесса, и её потомки давно ушли в небытие."
 qulatha_rebuild_fallback_effect.tt:0 "Вы выберете разрушенный проект для восстановления"