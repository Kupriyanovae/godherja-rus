l_russian:
 found_k_heurgordica_decision:0 "Основать Хеургордику"
 found_k_heurgordica_decision_desc:0 "Наконец-то мы обрели землю, которую можем назвать домом. Нам следует основать здесь новое королевство и короновать правителя. А имя пусть увековечит последнюю Речную Королеву Хеургорду, договорившуюся о вхождении нашего народа в Имперех Ценвара как регент при сыне, поглощённом ужасным [Concept('the_fog', 'Туманом')|E]."
 found_k_heurgordica_decision_confirm:0 "В память о королеве-регенте!"
 found_k_heurgordica_decision_tooltip:0 "Мы создадим собственное королевство."
 heurgordica_tradition_custom_desc:0 "Если это первое основанное Хуэгодокское королевство, ваша [Concept('culture', 'культура')|E] получит [Concept('tradition','традицию')|E] Равного наследования."

 found_k_dathothica_decision:0 "Основать Датотику"
 found_k_dathothica_decision_desc:0 "Наконец-то мы обрели землю, которую можем назвать домом. Нам следует основать здесь новое королевство и короновать правителя. А имя пусть славит легендарного героя Датотику, что, по преданиям, одолел десять чудовищ в поисках Кубка Спящего Принца."
 found_k_dathothica_decision_confirm:0 "Достойное имя для сильного народа!"
 found_k_dathothica_decision_tooltip:0 "Мы создадим собственное королевство."
 dathothica_tradition_custom_desc:0 "Если это первое основанное Хуэгодокское королевство, ваша [Concept('culture', 'культура')|E] получит [Concept('tradition','традицию')|E] Сказителей."

 found_k_rithogedica_decision:0 "Основать Ритохедику"
 found_k_rithogedica_decision_desc:0 "Наконец-то мы обрели землю, которую можем назвать домом. Нам следует основать здесь новое королевство и короновать правителя. А имя пусть чтит короля Ритохеда, что вёл наши войска вместе с аверсарийскими союзниками в легендарных походах, пав героем в битве со сьяволки при Бльозике. Говорят, он сражался даже после десяти смертельных ран."
 found_k_rithogedica_decision_confirm:0 "Здесь водрузим наше знамя!"
 found_k_rithogedica_decision_tooltip:0 "Мы создадим собственное королевство."
 need_3_duchies:0 "Требуется иметь не менее трёх герцогских титулов"
 rithogedica_tradition_custom_desc:0 "Если это первое основанное Хуэгодокское королевство, ваша [Concept('culture', 'культура')|E] получит [Concept('tradition','традицию')|E] Ритуальная Доблесть"

 read_the_new_dream_decision:0 "Read the New Dream"
 read_the_new_dream_decision_desc:0 "The [frodbrokna|E] shattered the world our forebears understood, and the answer that all things will be comprehended in time rings hollow to the faithful dwelling in lands the Dreamer never showed them before. Diviners whisper what many already believe: Roydammna has turned in His sleep, and a new dream has begun. Someone must read it.\n\nAs the foremost sovereign of the Apti peoples, [ROOT.Char.GetFirstName] may convene the Diviners, proclaim the turning of the Dreamer, and establish a new Rite."
 read_the_new_dream_decision_tooltip:0 "Convene the Diviners and reform the Apti faith into the Dreaming Rite, choosing whose rites shall be read as fragments of the new dream"
 read_the_new_dream_decision_confirm:0 "Proclaim the Rite"
 read_the_new_dream_option_clanlander:0 "The Wood Breathes the Dream"
 read_the_new_dream_option_clanlander_desc:0 "The forests of these lands are the Dreamer's breathing made manifest, and the songs of the Clanlanders are dreams remembered across generations. Let the Rite be read in the deep groves, beside the singers who kept the dream while we wandered."
 read_the_new_dream_option_marcher:0 "The Path Walks the Dream"
 read_the_new_dream_option_marcher_desc:0 "The [marchers|E] were half right all along: each sleeper is dreamt a path, and to walk it truly is to dream with open eyes. Let the Rite take up the wisdom of the Lifepath, and let those who walk learn the road woven for them."
 read_the_new_dream_option_sjalvolki:0 "The Gift Was Dreamt"
 read_the_new_dream_option_sjalvolki_desc:0 "The gods of the clans are the mighty first-dreamt, and the deeds of their heroes are pressed so deep into the dream that Roydammna Himself remembers them. Let the Rite honor Velos' gift, and let glory become a road to the Dreamer no less true than wisdom."
 read_the_new_dream_decision_effect_tooltip:0 "Convene the Diviners to read the new dream. You will choose whose rites are read as fragments of it, reforming the Apti faith into the #V Dreaming Rite#!. Your Apti [vassals|E] will be offered the new dream."

 # 0001 - Reading the new dream
 dreaming_rite.0001.t:0 "Read the New Dream"
 dreaming_rite.0001.desc:0 "The Diviners are convened, and before them [ROOT.Char.GetFirstName] must speak the shape of the turning. Roydammna has shifted in His sleep; the dream that is the world has shifted with Him, and these new lands are freshly dreamt, their edges not yet settled in the mind.\n\nBut a dream is read, not merely dreamt. The old understanding cannot serve here. The Diviners look to [ROOT.Char.GetSheHe|U] to name whose wisdom shall be woven into the Rite, and through whose eyes the faithful shall learn to read the new dream around them."

 dreaming_rite.0002.t:0 "The New Dream Offered"
 dreaming_rite.0002.desc:0 "Word comes from [ROOT.Char.GetTitledFirstName]'s liege, [ROOT.Char.GetLiege.GetTitledFirstName]: the Apti faith is reborn. Roydammna has turned in His sleep, they proclaim, and a new dream has begun - one to be read here, in the living lands, not sought in the abstract as the Old Apti taught.\n\nThe Diviners have named it the #V Dreaming Rite#!, and its readers now walk toward [ROOT.Char.GetFirstName], asking whether [ROOT.Char.GetSheHe] too will walk the new dream."

 dreaming_rite.0002.a:0 "The dream is here to be read."
 dreaming_rite.0002.b:0 "I keep to the old dream."