l_russian:
 found_k_heurgordica_decision: "Основать Хеургордику"
 found_k_heurgordica_decision_desc: "Наконец-то мы обрели землю, которую можем назвать домом. Нам следует основать здесь новое королевство и короновать нового правителя. А имя пусть увековечит последнюю Речную Королеву Хеургорду, договорившуюся о вхождении нашего народа в Имперрех Ценвара как регент при её сыне, поглощённая ужасным [Concept('the_fog', 'Туманом')|E]."
 found_k_heurgordica_decision_confirm: "В память о королеве-регенте!"
 found_k_heurgordica_decision_tooltip: "Мы создадим собственное королевство."
 heurgordica_tradition_custom_desc: "Если это первое основанное хуэгодокское королевство, ваша [Concept('culture', 'культура')|E] получит [Concept('tradition','традицию')|E] «Равное наследование»."
 
 found_k_dathothica_decision: "Основать Датотику"
 found_k_dathothica_decision_desc: "Наконец-то мы обрели землю, которую можем назвать домом. Нам следует основать здесь новое королевство и короновать нового правителя. А имя пусть славит легендарного героя Датотику, что, по преданиям, одолел десять чудовищ в поисках Чаши Спящего принца."
 found_k_dathothica_decision_confirm: "Достойное имя для сильного народа!"
 found_k_dathothica_decision_tooltip: "Мы создадим собственное королевство."
 dathothica_tradition_custom_desc: "Если это первое основанное хуэгодокское королевство, ваша [Concept('culture', 'культура')|E] получит [Concept('tradition','традицию')|E] «Сказители»."
 
 found_k_rithogedica_decision: "Основать Ритогедику"
 found_k_rithogedica_decision_desc: "Наконец-то мы обрели землю, которую можем назвать домом. Нам следует основать здесь новое королевство и короновать нового правителя. А имя пусть чтит короля Ритогеда, что вёл наши войска вместе с [Concept('aversaria', 'аверсарианскими')|E] союзниками в легендарных походах, пав героем в битве со сьялволками при Бльосике. Говорят, он продолжил сражаться даже после получения десяти смертельных ран."
 found_k_rithogedica_decision_confirm: "Здесь мы водрузим наше знамя!"
 found_k_rithogedica_decision_tooltip: "Мы создадим собственное королевство."
 need_3_duchies: "Требуется иметь не менее трёх герцогских титулов"
 rithogedica_tradition_custom_desc: "Если это первое основанное хуэгодокское королевство, ваша [Concept('culture', 'культура')|E] получит [Concept('tradition','традицию')|E] «Показная честь»."

 read_the_new_dream_decision:0 "Прочесть новый сон"
 read_the_new_dream_decision_desc:0 "[frodbrokna|E] расколола мир, который знали наши предки, и обещание, что со временем всё будет постигнуто, звучит пусто для верных, обитающих в землях, которых Дремлющий прежде им не являл. Прорицатели шепчут о том, во что многие уже верят: Ройдаммна повернулся во сне, и начался новый сон. Кто-то должен его прочесть.\n\nКак главнейший правитель народов апти, [ROOT.Char.GetFirstName] может созвать Прорицателей, провозгласить поворот Дремлющего и учредить новый Обряд."
 read_the_new_dream_decision_tooltip:0 "Созвать Прорицателей и преобразовать аптийскую веру в Обряд Сновидений, выбрав, чьи обычаи будут прочтены как фрагменты нового сна"
 read_the_new_dream_decision_confirm:0 "Провозгласить Обряд"
 read_the_new_dream_option_clanlander:0 "Лес дышит сном"
 read_the_new_dream_option_clanlander_desc:0 "Леса этих земель — воплощённое дыхание Дремлющего, а песни клановцев — сны, которые помнят из поколения в поколение. Пусть Обряд читают в глубоких рощах, рядом с певцами, хранившими сон во время наших странствий."
 read_the_new_dream_option_marcher:0 "Путь шествует во сне"
 read_the_new_dream_option_marcher_desc:0 "[Concept('marchers','Марочники')|E] всё это время были наполовину правы: каждому спящему снится свой путь, и истинно идти по нему — значит видеть сон с открытыми глазами. Пусть Обряд воспримет мудрость Жизненного пути, а идущие познают сотканную для них дорогу."
 read_the_new_dream_option_sjalvolki:0 "Дар явился во сне"
 read_the_new_dream_option_sjalvolki_desc:0 "Боги кланов — могущественные перворождённые сна, а деяния их героев впечатаны в сон так глубоко, что сам Ройдаммна помнит их. Пусть Обряд чтит дар Велоса, а слава станет дорогой к Дремлющему, не менее истинной, чем мудрость."
 read_the_new_dream_decision_effect_tooltip:0 "Созовите Прорицателей, чтобы прочесть новый сон. Вы выберете, чьи обычаи будут прочтены как его фрагменты, преобразовав веру апти в #V Обряд Сновидений#!. Вашим [Concept('vassals', 'вассалам')|E] из числа апти предложат принять новый сон."

 # 0001 — Чтение нового сна
 dreaming_rite.0001.t:0 "Прочесть новый сон"
 dreaming_rite.0001.desc:0 "Прорицатели собрались, и перед ними [ROOT.Char.GetFirstName] [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен')] описать облик поворота. Ройдаммна пошевелился во сне; сон, которым является мир, изменился вместе с Ним, а эти новые земли только что приснились, и их очертания ещё не устоялись в Его разуме.\n\nНо сон надлежит прочесть, а не просто увидеть. Старое понимание здесь не поможет. Прорицатели ждут, что [ROOT.Char.GetSheHe|U] назовёт мудрость, которую следует вплести в Обряд, и тех, чьими глазами верные научатся читать окружающий их новый сон."

 dreaming_rite.0002.t:0 "Предложение нового сна"
 dreaming_rite.0002.desc:0 "От сюзерена [ROOT.Char.GetTitledFirstName], [ROOT.Char.GetLiege.GetTitledFirstName], приходят вести: вера апти возродилась. Ройдаммна повернулся во сне, провозглашают они, и начался новый сон — тот, что надлежит читать здесь, в живых землях, а не искать в отвлечённых истинах, как учили старые апти.\n\nПрорицатели нарекли его #V Обрядом Сновидений#!, и теперь его чтецы идут к [ROOT.Char.GetFirstName], спрашивая, готов[Select_CString(ROOT.Char.IsFemale, 'а', '')] ли [ROOT.Char.GetSheHe] тоже вступить в новый сон."

 dreaming_rite.0002.a:0 "Этот сон здесь, чтобы его прочли."
 dreaming_rite.0002.b:0 "Я останусь со старым сном."
 
