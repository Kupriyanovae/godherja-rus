l_russian:
 # Требования для найма профессионалов Благословений Пустоты
 redlander_void_blessing_1_recruit_tt: "Вы помолились о #bold Первом благословении Пустоты#! (решение)"
 redlander_void_blessing_2_recruit_tt: "Вы помолились о #bold Втором благословении Пустоты#! (решение)"
 redlander_void_blessing_3_recruit_tt: "Вы помолились о #bold Третьем благословении Пустоты#! (решение)"
 redlander_void_blessing_4_recruit_tt: "Вы помолились о #bold Четвёртом благословении Пустоты#! (решение)"
 redlander_void_blessing_5_recruit_tt: "Вы помолились о #bold Пятом благословении Пустоты#! (решение)"

 find_prism_decision: "Молиться об откровении"
 find_prism_decision_desc: "Бездонная призма утрачена, и её необходимо найти. Без неё нам нечем спасти Пустоту от жестокого света Солнца. Мы должны покинуть тепло и уют тьмы, отправиться в отвратительную преисподнюю, именуемую порядком, и вернуть принадлежащее нам."
 find_prism_decision_tooltip: "Вам откроется, у кого сейчас находится Бездонная призма."
 find_prism_decision_confirm: "Вслушаться."

 redland_cults_elevation_decision: "Молиться о возвышении"
 redland_cults_elevation_decision_desc: "Энтропия — рождение и смерть всего сущего. Она неизбежность, описание, факт. Она — само бытие, из которого состоит всё, и вещество, из которого соткан конец. Порядок, это ужасное и сковывающее творение, лишь очерчивает хаос, чтобы убедить себя, будто обладает формой. Пустота берёт то, что станет, и творит из него то, что есть. Оставшаяся позади обращённость вспять — дар, который они преподносят нам: магия, шёпот, тайны — тёмные и прекрасные.\n\nМы должны смириться и молить о силе, дабы принести хаос достойным."
 redland_cults_elevation_decision_tooltip: "Ваше господство над культистами будет одобрено."
 redland_cults_elevation_decision_confirm: "Покориться."

 redland_cults_proliferation_decision: "Молиться о разрастании"
 redland_cults_proliferation_decision_desc: "Мы расширили потоки энтропии, но всё ещё не в силах направлять их. Глашатаи Пустоты изберут достойного носителя, который поведёт водовороты этого нового места, и вознаградят нас за преданность."
 redland_cults_proliferation_decision_tooltip: "Ваши неподвластные земли обретут нового Владыку."
 redland_cults_proliferation_decision_confirm: "Даровать вознесение."
 
 void_blessing_one_decision: "Молиться об обильной жатве"
 void_blessing_one_decision_desc: "О бледных обитателях Красных земель задавали множество вопросов:\n\n#italic «Кто они?»\n«Каково их предназначение?»\n«Почему они всё время похищают наших детей?»\n«Где я?»\n«Здесь есть кто-нибудь?»\n«Пожалуйста, хоть кто-нибудь, помогите мне!»#! \n\nТёмные владыки с радостью ответят."
 void_blessing_one_decision_tooltip: "Слуги Пустоты откликнутся на ваш зов."
 void_blessing_one_decision_confirm: "Выпустить отбросы."
 
 void_blessing_two_decision: "Молиться о воплощённом ужасе"
 void_blessing_two_decision_desc: "#italic «Страх: Вид тьмы в коридоре глубокой ночью.\n\n Тревога: Знание, что в этой тьме нечто есть.\n\n Ужас: Вид этого нечто, выходящего из тьмы.\n\n Паника: Звук того, как это нечто с пугающей скоростью приближается.\n\n Потрясение: Ощущение, как внутренности покидают ваше тело, а кровь стекает на пол.\n\n Террор: Ощущение того, как нечто злобное и бесплотное пожирает ваш угасающий разум.»#!\n\n— Амнакс Летописец, «Путеводитель по Красным землям», книга I, приложение «Определения»"
 void_blessing_two_decision_tooltip: "Чудовища и мерзости настигнут нашу добычу."
 void_blessing_two_decision_confirm: "Явить сокрытое."

 void_blessing_three_decision: "Молиться о воплощённом голоде"
 void_blessing_three_decision_desc: "Есть одна постоянная, общая для Хаоса, Порядка и всего прочего, кроме самой Пустоты: Желание. Хаос желает распространяться, а Порядок — сдерживать. Время желает двигаться вперёд, а Смерть желает творения Жизни. Даже само Желание жаждет собственного роста, подобно тому как аскеты желают от него освободиться. Люди рождаются младенцами, желающими материнского молока, а затем начинают желать хлеба, мяса, питья, крови и, быть может, вещей куда более отвратительных.\n\nМы соберём жатву этого желания и с его помощью поглотим врагов."
 void_blessing_three_decision_tooltip: "Голодные массы начнут охоту."
 void_blessing_three_decision_confirm: "Да не насытится наш Голод вовек."

 void_blessing_four_decision: "Молиться об анафеме"
 void_blessing_four_decision_desc: "#italic «Гипотеза нулевого операнда:\n A: Души обладают физической формой.\n B: Внутри тел существует эфирное пространство, куда можно поместить Душу.\n C: Души, возникшие не в теле, могут быть помещены в него.\n D (аксиома): После смерти Душа отделяется от тела.\n E: После смерти тело утрачивает вместилище для Души.\n F: Тела движутся только благодаря действию Души.\n ((A ⊕ E) ⟚ (B ∧ C ∧ ¬E)) ∧ D ⊙ F.\n Наблюдения:\n При смерти вес не меняется ⇒ ¬A, B.\n Личи могут овладевать своими ритуально подготовленными трупами ⇒ ¬E.\n Духи могут овладевать несчастными живыми ⇒ C.\n Магия Крови и Смерти способна двигать тела извне ⇒ ¬F\n ∴ Должен существовать способ, позволяющий душам самопроизвольно действовать без души и без Магии.\n\n Примечание автора: Я так близок, ТАК близок. Я могу дать определение Пустоте, но её НЕ должно быть. Как? Почему??? Недостающая посылка? Перевёрнутый символ?#!»\n\n— Амнакс Летописец, «Запретная логика», книга IV, глава III"
 void_blessing_four_decision_tooltip: "Вы заполните пустое пространство Ничем."
 void_blessing_four_decision_confirm: "Заполнить их Ничем."

 void_blessing_five_decision: "Молиться о временном признании"
 void_blessing_five_decision_desc: "Утверждать, будто у Хаоса может быть повелитель, ошибочно, ибо сама энтропия по определению лишена порядка и определённости. Утверждать, будто у Хаоса не может быть повелителя, столь же парадоксально, ведь подобные правила нельзя навязать самому образу свободы. Однако теперь, когда наша преданность доказана, а жертвы принесены, Боги Пустоты могут на время даровать нам достойный их престол."
 void_blessing_five_decision_tooltip: "Вы получите могущественный предмет."
 void_blessing_five_decision_confirm: "Преклониться перед Тьмой."

 void_blessing_sundeath_decision: "Молиться об истинной свободе"
 void_blessing_sundeath_decision_desc: "#italic Нас сперва сломали\nА после сковали\nСто лет нашу скорбь\nВ умы забивали\n\nТысячу лет гнева\nДесять тысяч — злобы\nИ ещё вдесятеро\nСтраха до озноба\n\nМы кричали в безмолвье\nМы горели в мороз\nМы хранили свой Дух\nУмерщвлением душ\n\nИ тогда нам ответил\nОглушительный шёпот\nПустота обещала\nСмертных в прах обратить\n\nА теперь они Забыли\nИ теперь мы свободны\nМы Расколем свет —\nМир поставим на колени#!"
 void_blessing_sundeath_decision_tooltip: "Порядок больше не сможет нас сдерживать."
 void_blessing_sundeath_decision_confirm: "Мы затмим солнце."

 redland_cults_direct_rule_decision: "Молиться о временном предпочтении"
 redland_cults_direct_rule_decision_desc: "#italic «В Красных землях кроется сводящий с ума парадокс — как физический, так и философский. Судя по всему, что я узнал об этих порочных красноземцах — их обрядах, песнопениях, книгах и знаках, — у них нет иной цели, кроме молитв Пустоте и поклонения её Богам. Куда бы они ни шли, они сеют хаос, берут всё разумное и выворачивают наизнанку, превращая в само воплощение безумия. Они приходят из Ямы и питают её |Неразборчивые знаки| окружающих земель.\n\nНо как такое возможно? Пустота по определению есть само Ничто! Я удостоверился в этом и зафиксировал само отсутствие её существования. Там не должно быть ни Богов, ни |Текст исчеркан|, ничего! Там не должно быть ни единой#! #S вещи#!, #italic которой они могли бы молиться! Пустота должна противоречить красноземцам — быть Анафемой!\n\nТак почему же они молятся этой ужасной Бездне? Неужели они просто переносят туда этот мир, чтобы освободить здесь место для |Дыра, прорванная в странице|? Или нечто ещё более тёмное обманывает их всех?\n\nЧерез три недели я прибуду в срединные степи, а оттуда отправлюсь через древние горы. Скрытый чарами и Забытой песней, я доберусь до Офнамм'ма и узнаю истину.#!\n\n— Амнакс Летописец, «Письмо моему возлюбленному ученику»"
 redland_cults_direct_rule_decision_tooltip: "Вам будет дарована власть над Офнамм'мом."
 redland_cults_direct_rule_decision_confirm: "В Яму."
