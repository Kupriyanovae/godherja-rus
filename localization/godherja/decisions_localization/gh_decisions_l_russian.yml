 anaanides_purification_decision: "Сделать Шаг Очищения"
 anaanides_purification_decision_desc: "Чтобы достичь святой земли Анаан, я должен очиститься от греха. Пришло время сделать следующий шаг в этом долгом путешествии."
 anaanides_purification_decision_tooltip: "Вы делаете шаг очищения, чтобы очистить свою душу."
 anaanides_purification_decision_confirm: "Начать приготовления!"
 anaanides_final_step_decision: "Сделать Последний Шаг к Анаану"
 anaanides_final_step_decision_desc: "Мои усилия по очищению через медитацию и молитву завершились тем, что моя душа стала чиста от греха. Наконец, пришло время сделать последний шаг к Анаану и предстать перед Великим Судьей."
 anaanides_final_step_decision_tooltip: "Вы делаете последний шаг в путешествии к Анаану."
 anaanides_final_step_decision_confirm: "Пришло время завершить это долгое путешествие."
 anaan_ascension_desc: "Фанатик вознесся в Анаан"
 eloi_reclaimed_desc: "Элой был возвращен"
 alau_koev_flame_festival_decision: "Отпраздновать Алау Пьесали"
 alau_koev_flame_festival_decision_tooltip: "Подготовьте свою плоть к открытию [Concept('fire_gate','Огненных врат')|E]"
 alau_koev_flame_festival_decision_desc: "Алау Пьесали, Праздник Огня, — древняя традиция среди моего народа. Если я хочу доказать свою достойность покинуть этот холодный мир, я должен позволить священному пламени коснуться моей плоти."
 alau_koev_flame_festival_decision_confirm: "Я очищусь!"
 alau_koev_flame_festival_decision_tt: "Сделайте шаги к Великому Пламени"
