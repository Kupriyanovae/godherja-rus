 develop_dahangon_wetlands_decision.t: "Develop Dahangon Claysea"
 develop_dahangon_wetlands_decision_desc: "Much of the land in Dahangon remains shrouded in deep marshes and dense forests, with only a small portion having been reclaimed for cultivation, hindering the development of towns. If we can organize efforts to clear these natural obstacles, the vibrant wetlands of Dahangon could be transformed into fertile fields, providing a steady stream of revenue and grain for their rulers."
 develop_dahangon_wetlands_decision_tooltip: "Endure great hardships in pioneer work."
 develop_dahangon_wetlands_decision_confirm: "Let's cultivate this land."
 hill_or_werlands_or_floodplains.tt: "The [holding|E] has either [GetTerrain('hills').GetName], [GetTerrain('wetlands').GetName], or [GetTerrain('floodplains').GetName] [terrain|E]."
 change_watermills_level_effect_desc: "Upgrade the [GetBuilding('watermills_01').GetName][building|E] or its upgradesin on this [holding|E] by 1 level."

 introduce_kashiryan_elephants_decision.t: "Introduce Kashiryan Elephants"
 introduce_kashiryan_elephants_decision_desc: "Elephants are only rarely found in [dahangon_lowlands_biozone|E]; yet, given their abundance in the nearby [kashirya|E] and immense usefulness, perhaps it might be prudent to acquire some by one means or another."
 introduce_kashiryan_elephants_decision_modifier_tt: "The chosen [holding|E] does #bold not#! have [GetModifier('kashiryan_elephant_herd_modifier').GetNameWithTooltip] [modifier|E]"
