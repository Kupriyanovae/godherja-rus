 change_operational_efficiency_10.tt: "Повысить оперативную эффективность на #V десять#!"
 change_operational_efficiency_15.tt: "Повысить оперативную эффективность на #V пятнадцать#!"
 new_religious_core_desc: "Господство в Дахангоне"
 collapse_religious_authority_desc: "Крах религиозной власти"
 ruler_refused_to_cooperate_with_vidvaookeyatra_desc: "Новый правитель отказался сотрудничать с учёными-видваукеятранами."
 stability_in_recovering_lost_territories_decision.t: "Стабилизировать возвращённые земли"
 stability_in_recovering_lost_territories_decision_desc: "Разбойники разбиты, и знамя Катун-Кая вновь реет над башнями порта Шанъи. Местные жители, долго страдавшие от порочной тирании шрунфанских вельмож, денно и нощно ждали прихода законного войска. Прибытие Ланонана принесло им надежду. Разрушенные здания будут восстановлены, заброшенные поля вновь распаханы, а порядок восторжествует над хаосом и вернёт этой земле былое процветание."
 stability_in_recovering_lost_territories_decision_confirm: "Начать строительство."
 stability_in_recovering_lost_territories_decision_tooltip: "Пусть Вэйчжоу вновь процветает."
 stability_in_recovering_lost_territories_decision_1.tt: "Многие беженцы, ушедшие на север, начнут #P возвращаться#! домой, и [culture|E] некоторых [counties|El] #V изменится#!."
 stability_in_recovering_lost_territories_decision.tt: "Каждое [county|E] в [region|El] [GetGeographicalRegion('world_ga_weizhou_formable').GetName]"
 stability_in_recovering_lost_territories_decision_2.tt: "Линия [building|El] «[GetBuilding('common_tradeport_06').GetName]» или «[GetBuilding('caravanserai_05').GetName]» будет #P улучшена#! на один уровень."
 disseminate_imperial_edification_decision.t:"Распространить императорское просвещение"
 disseminate_imperial_edification_decision_desc: "Ланонан — далёкая и нецивилизованная земля, лежащая вдали от сердца [kathun|El] цивилизации. Живущий здесь народ почти не знаком с обрядами и музыкой и погряз в невежестве. Одной из главных причин, по которой Драконий император учредил Протекторат Ланонан, было просвещение края и распространение передовой культуры. Основывая школы и обучая местных катунской письменности, мы превратим их в подданных, ничем не отличающихся от жителей Катун-Кая, и поможем им отбросить варварские обычаи пограничья."
 disseminate_imperial_edification_decision_confirm: "Просветить народ."
 disseminate_imperial_edification_decision_tooltip: "Распространить катунскую культуру"
 disseminate_imperial_edification_decision.tt: "#P Эффективность#! этого [decision|El] последовательно увеличивается с #V уровнем#! местной линии [building|El] «[GetBuilding('xuegong_01').GetName]»."
 kathuni_change_culture_desc: "Под влиянием катунской культуры"
 accept_saielaian_as_part_of_kathunkai_decision.t:"Признать сайелаянов частью Катун-Кая"
 accept_saielaian_as_part_of_kathunkai_decision_desc: "Веками сайелаяны пытались освободиться от власти Катун-Кая. С момента основания Протектората не прекращалась борьба с бесконечными восстаниями. Но, как гласит древняя мудрость, вода камень точит. За годы усердного правления катунские обычаи и порядки проникли во все стороны жизни Наньмай-Бона. Местные жители больше не отвергают власть Протектората Южных земель. Наконец я выполнил поручение Драконьего императора и сделал Наньмай-Бон неотъемлемой частью катунской державы."
 accept_saielaian_as_part_of_kathunkai_decision_confirm: "Ассимилировать сайелаянов"
 accept_saielaian_as_part_of_kathunkai_decision_tooltip: "Ланонан навеки останется частью Катун-Кая."
 accept_saielaian_as_part_of_kathunkai_decision.tt: "Каждое [county|E] #V сайелайского#! [heritage|El]"
 accept_saielaian_as_part_of_kathunkai_decision_tt: "Вы [completely_control|E] все [county|El] #V сайелайской#! [culture|El]"
 accept_saielaian_as_part_of_kathunkai_decision_1_tt: "[cultural_acceptance|E] между сайелаянами #weak (и кандисарами)#! и вашей [culture|El] составляет не менее #V 90#!"
 accept_saielaian_culture: "Признанная культура"
 abolish_the_bureau_of_the_bronzeport_decision.t:"Упразднить Бюро Бронзовой гавани"
 abolish_the_bureau_of_the_bronzeport_decision_desc: "Как Протекторат Южного моря, учреждённый указом Драконьего императора, мы в теории обладаем верховной властью над всеми военными и политическими делами Южного моря. Но с X века [Concept('bureau_bronzeport','Бюро Бронзовой гавани')|E] на юге превратилось в независимое учреждение и отсекло Дахангон, прежде подчинявшийся Протекторату. Веками мы были скованы затяжным противостоянием в Южном море, пока [Concept('frodbrokna','Тяньцинь')|E] не положила конец Катун-Каю. Теперь Протекторат остаётся единственной силой, способной решать судьбу Южного моря. Настало время упразднить Бюро Бронзовой гавани, ибо управление Южным морем должно быть единым."
 abolish_the_bureau_of_the_bronzeport_decision_confirm: "Объявить о его упразднении"
 abolish_the_bureau_of_the_bronzeport_decision_tooltip: "Вновь утвердить нашу единоличную власть"
 abolish_the_bureau_of_the_bronzeport_decision.tt: "Каждый [vassal|E] титула «[GetTitleByKey('k_bronzeport').GetNameNoTier]» станет вашим вассалом"
 abolish_the_bureau_of_the_bronzeport_decision_1.tt: "Каждый [vassal|E] [culture|El] наследия «[GetCulturePillar('heritage_easterner').GetName]»"
 abolish_the_bureau_of_the_bronzeport_decision_tt: "[title|E] «[GetTitleByKey('k_bronzeport').GetNameNoTier]» не создан или его [holder|E] является вашим [vassal|El]"
 establish_southsea_protectorate_decision_1.tt: "Каждое [county|E] вашей [realm|El]"
 establish_southsea_protectorate_decision.tt: "Если вы владеете [title|El] [kingdom|El] «[GetTitleByKey('k_dranfan').GetNameNoTier]», «[GetTitleByKey('k_tuleang').GetNameNoTier]» или «[GetTitleByKey('k_yantalin').GetNameNoTier]», титул «[GetTitleByKey('e_protectorate_of_the_southsea').GetNameNoTier]» станет их [de_jure|E] сюзереном"
 stand_on_the_land_beyond_north_wind_decision.t: "Ступить на земли за Северным ветром"
 stand_on_the_land_beyond_north_wind_decision_desc: "Да благословит Чистейший великого персонажа [ROOT.GetCharacter.GetFirstNameNoTooltip]. Узрите: в наших руках обретает очертания новая империя, восстающая за руинами и рубежами старого мира. День за днём всё больше городов поднимают знамя [aversaria|El]. День за днём всё больше подданных преклоняют колени перед престолом нашего государя и приносят клятву верности. Богатства льются рекой, а слава сияет подобно звёздам.\n\nНаша армия непобедима и несокрушима. Мы завоюем земли вплоть до [kashirya|El], а затем двинемся на восток, к самому краю [aeras|El]! Там мы воздвигнем вечный памятник, дабы Чистейший озарял своим светом все грядущие эпохи."
 stand_on_the_land_beyond_north_wind_decision_confirm: "Через горы и леса!"
 stand_on_the_land_beyond_north_wind_decision_tooltip: "Покорить далёкую державу за пределами Аверсарии."
 stand_on_the_land_beyond_north_wind_decision_tt: "Контролировать более #V 50#! [county|El] в [region|El] [GetGeographicalRegion('world_ga_kashirya').GetName]"
 stand_on_the_land_beyond_north_wind_decision_1_tt: "Ваша [capital|E] — [holding|E] типа «Метрополия»"
 stand_on_the_land_beyond_north_wind_decision_1.tt: "Каждый #V каширийский#! [kingdom|E]-[title|E], которым владеете вы или ваши [vassals|E], станет [de_jure|E] частью титула «[GetTitleByKey('e_kasiaeolia').GetNameNoTier]»"
 stand_on_the_land_beyond_north_wind_decision_2.tt: "Все ваши [vassals|E] [heritage|El] «[GetCulturePillar('heritage_aversarian').GetName]»"
 form_underground_hegemony_decision: "Объединить глубины Майикратии"
 form_underground_hegemony_decision_desc: "Под [mayikrata|El] простирается необъятный лабиринт, не покорённый человечеством. Немногие отваживались войти во тьму, и ещё меньше тех, кто пытался подчинить её.\n\nУ тьмы нет государя. Это царство без короны. Но так не должно оставаться."
 form_underground_hegemony_decision_confirm: "Объединить лабиринт"
 form_underground_hegemony_decision_tooltip: "Создать подземную [hegemony|El]"
 form_underground_hegemony_decision_dejure_tt: "Титулы «[GetTitleByKey('e_abyssal_pits').GetNameNoTier]», «[GetTitleByKey('e_drowning_abyss').GetNameNoTier]», «[GetTitleByKey('e_echoing_expanse').GetNameNoTier]» и подземные королевства титула «[GetTitleByKey('e_mayikrata').GetNameNoTier]» станут [de_jure|E] частью титула «[GetTitleByKey('h_underground').GetNameNoTier]»"
 form_underground_hegemony_decision_extra_dejure_tt: "Все подконтрольные подземные империи, созданные решениями, в том числе «[GetTitleByKey('e_bleakbeacon_aautokrata').GetNameNoTier]», также станут [de_jure|E] частью титула «[GetTitleByKey('h_underground').GetNameNoTier]»"
 form_bleakbeacon_aautokrata_decision: "Создать Мрачномаякскую Аавтократию"
 form_bleakbeacon_aautokrata_decision_desc: "Бликбикон был основан как убежище от ужасов, погребённых в лабиринте. Но теперь свет маяка распространяется всё дальше, и новый мир под землёй кажется возможным."
 form_bleakbeacon_aautokrata_decision_confirm: "Подземная империя будет править"
 form_bleakbeacon_aautokrata_decision_tooltip: "Создать Мрачномаякскую Аавтократию"
 form_bleakbeacon_aautokrata_kingdoms_tt: "Необходимо полностью контролировать не менее #V 3#! [kingdoms|El]"
 form_bleakbeacon_aautokrata_kingdoms_effect_tt: "Каждый ваш [kingdom|E]-[title|E] станет [de_jure|E] частью титула «[GetTitleByKey('e_bleakbeacon_aautokrata').GetNameNoTier]»"
 goans_embrace_the_plains_decision: "Принять равнины"
 goans_embrace_the_plains_decision_desc: "Горы утрачены — [fog|E] поглотил их вместе с остальным старым миром. Теперь наш народ возделывает землю, ровную до самого горизонта, а молодёжь вырастает, ни разу не вдохнув разреженного воздуха высот. Быть может, пора перестать скорбеть по горам и по-настоящему стать народом равнин."
 goans_embrace_the_plains_decision_confirm: "Принять равнины"
 goans_embrace_the_plains_decision_tooltip: "Официально отказаться от старых горных обычаев, заменить «Детей высот» на «Аграриев» и решить судьбу древней изоляции нашего народа."
 goans_embrace_plains_settled_tt: "Ваша культура должна преимущественно обитать среди «[GetTerrain('plains').GetName]», «[GetTerrain('farmlands').GetName]» или «[GetTerrain('drylands').GetName]»"
 goans_embrace_the_plains_effect_tt: "Ваша культура навсегда откажется от горных обычаев. «Дети высот» будут заменены на «Аграриев», а событие позволит решить судьбу «Изоляционизма»."