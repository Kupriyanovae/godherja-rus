 new_eastern_empire: "Сформировать новую империю на востоке"
 new_eastern_empire_desc: "Теперь, когда наша база власти прочно установлена, а кризисы прошлого позади, мы наконец можем подумать о создании полноценной [Concept('aversaria','Аверсарианской')|E] Империи на Востоке. Асуиполь долгое время был столицей старой Империи, и он снова ею станет. Пришло время новому государству подняться из пепла и вернуть наше первородство! Слава Автократии Гекаэда!"
