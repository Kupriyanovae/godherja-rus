 stress_loss_chort_decision_desc: "Всего несколько кусочков, и кажется, будто стресс вытекает из моего тела. Мой разум начинает затуманиваться, и меня охватывает чувство покоя и отдохновения. Нет ничего более расслабляющего, чем добрый чорт!"
