 iyrossi_kill_aversarians_desc: "Истребленные аверсарианцы"
 gh_debase_currency_decision_2_tooltip: "Пожертвовать большим количеством [Concept( 'prestige', 'престижа' )|E] в обмен на мгновенный приток золота."
 gh_debase_currency_decision_4: "Обесценить валюту"
 new_eastern_empire: "Сформировать новую империю на востоке"
 new_eastern_empire_desc: "Теперь, когда наша база власти прочно установлена, а кризисы прошлого позади, мы наконец можем подумать о создании полноценной [Concept('aversaria','Аверсарианской')|E] Империи на Востоке. Асуиполь долгое время был столицей старой Империи, и он снова ею станет. Пришло время новому государству подняться из пепла и вернуть наше первородство! Слава Автократии Гекаэда!"
 new_eastern_empire_confirm: "Основать новое государство"
 new_eastern_empire_tooltip: "Пришло время сформировать новую [Concept('aversaria','Аверсарианскую')|E] Империю на Востоке."
 legio_xcv_reborn: "Возродить Легион XCV «Виесуадос»"
 legio_xcv_reborn_desc: "Теперь, когда мятежники окончательно подавлены, а проблемы нашего прошлого повержены, мы можем начать строить заново и вернуть славу нашему легиону."
 legio_xcv_reborn_confirm: "Реформировать Легион"
 legio_xcv_reborn_tooltip: "Пришло время вернуть славу Легиона XCV «Виесуадос»."
 legio_xcv_rivals: "Остатки Легиона XCV «Виесуадос» должны быть либо возвращены в лоно, либо раздавлены."
 legio_xcv_reborn_2: "Возродить Легион XCV «Виесуадос»"
 legio_xcv_reborn_2_desc: "Теперь, когда мятежники окончательно подавлены, а проблемы нашего прошлого повержены, мы можем начать строить заново и вернуть славу нашему легиону."
 legio_xcv_reborn_2_confirm: "Реформировать Легион"
 legio_xcv_reborn_2_tooltip: "Пришло время вернуть славу Легиона XCV «Виесуадос»."
 become_pirate_emperor: "Объявить Империю на Пиратском Берегу"
 become_pirate_emperor_desc: "Никто не может противостоять мне и моему безграничному богатству. Пришло время увековечить себя в морях."
 become_pirate_emperor_tooltip: "Стать непревзойденным пиратом морей"
 become_pirate_emperor_confirm: "К небывалым легендам!"
 the_scarred_rise_up: "Шатранджая!"
 the_scarred_rise_up_desc: "Годами наши братья и сестры страдали от жестокого правления так называемых 'людей торговли'. Слишком долго нас использовали и оскорбляли, над нашим образом жизни насмехались, наши семьи разрывали на части. Мы - безмолвный шепот леса, стремительный поток густых джунглей, высшие хищники. Больше нет! Шрамованные поведут нас к славному будущему. Мы клянемся ему в своей решимости, шрамуя лица и обнажая грудь. Мы выбрали подходящее название для этого восстания: Шатранджая, или 'Полная Победа', ибо мы знаем, что победим или умрем, пытаясь."
 the_scarred_rise_up_tt: "Воины Танумарея сплачиваются вокруг вас. Называя себя Азаки Мард, или 'Воины Свободы', их единственная цель эхом отзывается в их сердцах: освобождение их родины от жестоких угнетателей."
 the_scarred_rise_up_tooltip: "Возьмите судьбу своего народа под свой контроль"
 the_scarred_rise_up_confirm: "Шрамованные поднимаются к свободе!"
 azaki_mard: "Азаки Мард"

 become_king_taykovi_decision: "Королевские амбиции?"
 belisarios_enemies_dead_desc: "Эшрей, Горасс и Маврикий должны быть мертвы и похоронены, прежде чем вы сможете об этом подумать."
 become_king_taykovi_decision_confirm: "Принесите мне мою корону."
 become_king_taykovi_decision_tooltip: "Король Морозная Кровь звучит неплохо."
 become_king_taykovi_decision_desc: "Король? Зачем мне быть королем? Есть люди, которых я должен убить."
 become_king_taykovi_decision_enemies_dead: "Почему бы мне не быть королем? Разве нет тех, кто уже называет меня законным Автократором мертвой Аверсарии? И никто не сравнится с моим престижем и родословной в Проливах Агеотарос. Давайте отбросим все притворства. Если я должен искупить Драксакиадов, это должно быть и в удаче, и в крови."

 belisarios_tries_to_forget: "Нечто большее в жизни"
 belisarios_tries_to_forget_desc: "Теперь, когда я король, возможно, мне стоит сосредоточиться на чем-то другом, кроме мести."
 belisarios_tries_to_forget_tooltip: "Утолена ли твоя жажда крови, о могучий король?"
 belisarios_tries_to_forget_confirm: "Задуматься о своей жизни."
 belisarios_enemies_must_not_bedead_desc: "Мой меч жаждет."
