 isles_retribution_decision_effects_tooltip: "Ваш [Concept( 'house', 'дом' )|E] получает доступ к [Concept('casus_belli','казус белли')|E] на [Concept('counties','графствах')|E], контролируемые не-островитянами в [Concept('shatteredisles','Расколотых Островах')|E]."
