 request_magi_from_the_grove_decision: "Нанять искусного мага из Священной Рощи"
 request_magi_from_the_grove_decision_desc: "Пришло время призвать достойного послушника, который присоединится к моему двору."
 request_magi_from_the_grove_decision_tooltip: "Вам будет представлено несколько возможных кандидатов для выбора придворного [Concept('magi','мага')|E]."
 request_magi_from_the_grove_decision_quality_tooltip: "Качество кандидатов будет зависеть от вашего уровня [Concept( 'piety', 'благочестия' )|E]."
 request_magi_from_the_grove_decision_confirm: "Отправить гонца"

 request_heir_from_the_pit_decision: "Молиться о достойном наследнике"
 request_heir_from_the_pit_decision_desc: "Откуда мы пришли и куда все вернемся — Бездна есть начало и конец всего сущего, ласка истинных богов за пределами [Concept('aeras','Эраса')|E], и место, где плоть и ихор соединяются в черную кровь. Именно оттуда я призову достойного послушника, который станет моим учеником."
 request_heir_from_the_pit_decision_tooltip: "Вам будет представлено несколько кандидатов [GetTrait('gh_blackspawn_1').GetName( GetNullCharacter )] для выбора вашего [Concept( 'heir', 'наследника' )|E]."
 request_heir_from_the_pit_decision_quality_tooltip: "Качество кандидатов будет зависеть от вашего $PF_piety_opposite$ и уровня [Concept( 'trait', 'свойства' )|E] Чернорожденного."
 request_heir_from_the_pit_decision_confirm: "Отправить гонца"

 declare_rivarisian_kingdom_decision: "Объявить королевство для риваризианцев"
 declare_rivarisian_kingdom_decision_desc: "Слишком долго народ рек преследуют воюющие лорды, [Concept('clerical_control_of_chevalie','властолюбивые теократы')|E] и жадные торговцы. Хватит! Наш народ сформирует новое королевство и докажет, что мы равны всем другим детям [Concept('chevalie','Шевалье')|E]! Пусть они увидят богатства наших городов и гордость в наших сердцах, и навсегда склонятся перед нашими свободами!"
 declare_rivarisian_kingdom_decision_confirm: "Проложить новый путь для нашего народа!"
 declare_rivarisian_kingdom_decision_tooltip: "Угнетению речного народа придет конец!"

 gh_divine_mission_decision: "Воля Богов"
 gh_divine_mission_decision_desc: "Тьма сгущается, и козни моих темных владык все сильнее сжимают горло мира. В своем величии боги возложили на меня задачу — божественную миссию по распространению их воли в этом плане. Они капризны, и я должен поспешить исполнить свою клятвенную цель."
 gh_divine_mission_decision_tt: "Боги вступят с вами в общение после завершения миссии."
 gh_divine_mission_decision_tooltip: "Отслеживать прогресс назначенной миссии."
 gh_divine_mission_decision_confirm: "Воля Владык будет исполнена."

 # Dahangon
 gh_restore_bronzeport_bureaucracy_decision: "Восстановить Бюрократию Бронзового Порта"
 gh_restore_bronzeport_bureaucracy_decision_desc: "Высокие министры [Concept('bureau_bronzeport','Бронзового Порта')|E] всегда избирались купцами и чиновниками Бюро. Поступать иначе - прямое противоречие почтенной и благороднейшей хартии Полуавтономного Бюро Бронзового Порта, установленного Небесами."
 gh_restore_bronzeport_bureaucracy_decision_tooltip: "Восстанавливает правительство Бронзового Порта в республику."
 gh_restore_bronzeport_bureaucracy_decision_confirm: "Бронзовый Порт снова будет принадлежать народу!"

 restored_bronzeport_modifier: "Восстановленная Бюрократия Бронзового Порта"
 restored_bronzeport_modifier_desc: "Восстановление бюрократии Бронзового Порта привело к временному росту торговли."
 bronzeport_restorer_modifier: "Восстановитель Бюро"
 bronzeport_restorer_modifier_desc: "Этот персонаж восстановил бюрократию Бронзового Порта, заслужив любовь своих республиканских вассалов."

 establish_southsea_protectorate.t: "Учредить Протекторат Южного Моря"
 establish_southsea_protectorate_decision_desc: "Южные моря Дахангона уже давно находятся вне досягаемости Империи. Больше нет."
 establish_southsea_protectorate_decision_tooltip: "Учредить новый Протекторат в южных морях."
 establish_southsea_protectorate_decision_confirm: "Моря - Наши для Правления!"

 gh_kedari_magocracy.t: "Созвать Обряд Знамений"
 gh_kedari_magocracy_decision_desc: "Слишком долго лучшие из нас стояли в одиночестве в тени. Настало время собраться, чтобы отыскать великие знамения, утраченные нашим народом."
 gh_kedari_magocracy_decision_tooltip: "Изменить ваше правительство на магократию."
 gh_kedari_magocracy_decision_confirm: "К новой эре магии!"

 reclaim_naklans_legacy.t: "Вернуть Наследие Наклана"
 reclaim_naklans_legacy_decision_desc: "Величайшие из наших вождей часто заявляли, что являются реинкарнациями [Concept('naklan_the_golden','Наклана Золотого')|E]. Ибо наш народ знает, что даже в смерти сила не исчезает, а ждет возможности вернуться к своему законному владельцу."
 reclaim_naklans_legacy_decision_tooltip: "Объявите миру о своем праве называться Перерожденным Накланом."
 reclaim_naklans_legacy_decision_confirm: "Я вернулся!"
 reclaim_naklans_legacy_capital_tt: "Наша столица находится в [GetTitleByKey('c_shadowflats').GetNameNoTier]"

 achieve_dayas_dream.t: "Воплотить Мечту Дайи"
 achieve_dayas_dream_decision_desc: "[Concept('nari_daya','Нари Дая')|E], Мать Всех Нас, была лишена своего королевского сана слабыми и недостойными мужчинами. Пришло время исправить эту несправедливость."
 achieve_dayas_dream_decision_tooltip: "Воплотить мечту Нари Дайи и воспеть ее легенду звездам."
 achieve_dayas_dream_decision_confirm: "Наши Шипы Никогда Не Сломаются!"

 create_aversaria_anastereias_decision.t: "Сформировать Аверсарию Анастасию"
 create_aversaria_anastereias_decision_desc: "Пепел [Concept('aversaria','Аверсарии')|E] оседает на [Concept('aeras','Эрасе')|E], и наша некогда объявленная «чистой» кровь смешивается с народами [Concept('kasiryat_biozone','Каширията')|E]. Пришло время решить: будем ли мы цепляться за традиции, устанавливая новый порядок в попытке заменить [Glossary('Аавтократию','GH_AAUTOKRATA_GLOSS')], или отпустим прошлое? Должны ли мы принять культуру новых соседей и подданных и создать нечто новое?"
 create_aversaria_anastereias_decision_tooltip: "Сформировать новую [Concept('aversaria', 'аверсарианскую')|E] империю на берегах Каширията"
 create_aversaria_anastereias_decision_confirm: "Давайте определим нашу новую судьбу!"
 create_aversaria_anastereias_generic_effect_tooltip: "Вы создадите [GetTitleByKey('e_aversaria_anastereias').GetNameNoTier] и получите выбор между интеграцией с народами Каширията и их подчинением."
 create_aversaria_anastereias_decision_hybridization_tooltip: "Если вы выберете интеграцию и [Concept('completely_control_region', 'полностью под контрольные')|E] [Concept('kingdoms','королевства')|E] [GetTitleByKey('k_dartar').GetNameNoTier], [GetTitleByKey('k_hyratan').GetNameNoTier], [GetTitleByKey('k_taleshtadendar').GetNameNoTier] и [GetTitleByKey('k_kasharya').GetNameNoTier], а также [Concept( 'duchies', 'герцогства' )|E] [GetTitleByKey('d_taliron').GetNameNoTier], [GetTitleByKey('d_batset').GetNameNoTier] и [GetTitleByKey('d_detbora').GetNameNoTier], они станут [Concept( 'de_jure', 'де-юре' )|E] частью новой [Concept( 'empire', 'империи' )|E]."
 create_aversaria_anastereias_decision_traditionalist_tooltip: "Если вы выберете подчинение и [Concept('completely_control_region', 'полностью под контрольные')|E] [Concept( 'duchies', 'герцогства' )|E] [GetTitleByKey('d_taliron').GetNameNoTier] и [GetTitleByKey('d_bazauuk').GetNameNoTier], они станут [Concept( 'de_jure', 'де-юре' )|E] частью новой [Concept( 'empire', 'империи' )|E]."

 solidify_aversaria_anastereias_decision.t: "Укрепить Аверсарию Анастасию"
 solidify_aversaria_anastereias_decision_desc: "Хотя при основании нашей [Glossary('Аавтократии','GH_AAUTOKRATA_GLOSS')] мы заявили права на весь [Concept('kasiryat_biozone','Каширият')|E], многие жители берегов реки по-прежнему отвергают нашу власть. Теперь эти непокорные земли находятся под нашим контролем, и мы можем сделать свои притязания неоспоримыми не только на бумаге, но и на деле."
 solidify_aversaria_anastereias_decision_tooltip: "Расширить [Concept( 'de_jure', 'де-юре' )|E] границы новой империи"
 solidify_aversaria_anastereias_decision_confirm: "Пусть Никто Не Отречется От Нашего Права"
 solidify_aversaria_anastereias_effect_tooltip: "Все необязательные [Concept( 'titles', 'титулы' )|E], не заявленные в первоначальном решении, станут [Concept( 'de_jure', 'де-юре' )|E] частью [GetTitleByKey('e_aversaria_anastereias').GetNameNoTier]"

 restore_nalmavast_priesthood_decision: "Восстановить [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] Священство"
 restore_nalmavast_priesthood_decision_desc: "Хотя понятие объединенного [ROOT.Char.GetFaith.GetAdjective] священства - не более чем далекое воспоминание, то, что было, еще может быть восстановлено. Укрепив основы, я созову священников, чтобы они избрали нового $nalmavast_religious_head_title$ из своих рядов, чтобы возглавить верующих."
 restore_nalmavast_priesthood_decision_tooltip: "Реформируйте свою веру, чтобы избавиться от ран прошлого."
 restore_nalmavast_priesthood_decision_confirm: "За Нальму, за наш народ."
 restore_nalmavast_priesthood_decision_holy_sites: "Вы контролируете хотя бы одно [Concept( 'holy_site', 'священное место' )|E] [CHARACTER.GetFaith.GetAdjective]."
 restore_nalmavast_priesthood_decision_tt: "Восстановлено [THIS.Char.GetFaith.GetAdjective] священство."
 nalmavast_tradition: "Традиция"
 nalmavast_tradition_tooltip: "Ваша вера останется в основном прежней."
 nalmavast_tradition_desc: "Мы исправим наши традиции и восстановим все, что было."
 nalmavast_pluralist: "Адаптация"
 nalmavast_pluralist_tooltip: "Ваша вера станет более плюралистической."
 nalmavast_pluralist_desc: "Испытания прошлого изменили нас, и вместе мы сильнее."
 nalmavast_righteous: "Мистицизм"
 nalmavast_righteous_tooltip: "Ваша вера станет более праведной и мистической."
 nalmavast_righteous_desc: "Священное знание принадлежит только нам, давайте сохраним его таким."
 nalmavast_fundamentalist: "Возмездие"
 nalmavast_fundamentalist_tooltip: "Ваша вера станет более фундаменталистской и воинственной."
 nalmavast_fundamentalist_desc: "Слабость была причиной нашего падения, и этого больше не будет."

 reclaim_krehejad_decision: "Вернуть земли наших матерей"
 reclaim_krehejad_decision_desc: "После поражения в [war_of_all_islands|El] наш народ скитался по волнам, словно выброшенный за борт моряк. Но мы не позволим себе безропотно кануть в небытие. Мечом и парусом мы отвоевали родину у [Concept('aversaria','аверсарианцев')|E] и теперь готовы объединить [warrior_women_ehatm|El]. Осталось лишь вновь объявить о нашем владычестве над волнами."
 reclaim_krehejad_decision_tooltip: "Вернуть родину [warrior_women_ehatm|El]"
 reclaim_krehejad_decision_confirm: "Пусть моря вновь содрогнутся!"
 reclaim_krehejad_decision_effect_tooltip: "Крехеджад станет [empire|El] и будет разделён на два [kingdoms|El]."


 agadari_resurgence_decision: "Возрождение э’хат’м"
 agadari_resurgence_decision_desc: "Хотя земли наших матерей возвращены, ни для кого не секрет, что на собственной родине мы остаёмся меньшинством. Мы должны призвать наших потерянных сородичей из [Glossary('Цирата','cyrat_encyclopedia_desc')] вернуться домой и помочь возродить родную землю. Теперь, когда острова надёжно находятся под нашей властью, остаётся лишь разослать предложения о возвращении."
 agadari_resurgence_decision_confirm: "Воссоединимся ныне и навеки"
 agadari_resurgence_decision_tooltip: "Призвать [warrior_women_ehatm|El] из [Glossary('Цирата','cyrat_encyclopedia_desc')]" 
 agadari_resurgence_custom_decision: "Все ваши [powerful_vassals|E] принадлежат к [culture|El] наследия «[GetCulturePillar('heritage_agadari').GetName]»"
 agadari_resurgence_tooltip: "[counties|E] вашей державы могут принять вашу [culture|El] и конфессию"
 agadari_homecoming_tooltip: "Народу наследия «[GetCulturePillar('heritage_agadari').GetName]» в [GetGeographicalRegion('cyrat_biozone').GetName] предложат покинуть эти земли и вернуться в [GetGeographicalRegion('krehejad_biozone').GetName]"

 krehejad_seize_dethskel_decision: "Предъявить права на Детскельский пролив"
 krehejad_seize_dethskel_decision_desc: "Со времён [aironoian_bronze_age|El] пролив у [Glossary('Красных земель','redlands_encyclopedia_desc')] служил важнейшей нитью, связывающей торговлю востока и запада. Объединив этот регион под своей властью, мы утвердим наше господство на побережье как силу, несущую порядок."
 krehejad_seize_dethskel_decision_tooltip: "[GetTitleByKey('k_dethskel').GetNameNoTier] станет [de_jure|E] частью титула «[GetTitleByKey('e_krehejad').GetNameNoTier]»"
 krehejad_seize_dethskel_effect_tooltip: "Если вы владеете [duchy|El] «[GetTitleByKey('d_zaradar').GetNameNoTier]», оно станет [de_jure|E] частью [kingdom|El] «[GetTitleByKey('k_dethskel').GetNameNoTier]»"
 krehejad_seize_dethskel_decision_confirm: "Поток торговли в наших руках"

  # ASKIL URGENT: GO THROUGH IT GOD DAMN YOU
 
 declare_establishment_of_Yuankang_decision.t: "Основать Юанькан"
 declare_establishment_of_Yuankang_decision_desc: "Прошли века с тех пор, как наши предки поселились здесь и основали [Concept('bureau_bronzeport','Бронзовую гавань')|E]. Хотя нас отделяют от [kathun|El] огромные расстояния, Катун-Кай всегда стремился удержать нас в сфере своего влияния, учредив «Небом ниспосланное полуавтономное бюро Бронзовой гавани». Довольно чужой власти. Я учрежу Юанькан!"
 declare_establishment_of_Yuankang_decision_tooltip: "Основать совершенно новую республику"
 declare_establishment_of_Yuankang_decision_confirm: "Да здравствует Юанькан!"
 declare_establishment_of_Yuankang_decision_1.tt: "[region|E] [GetGeographicalRegion('trade_confluence_bronzeport_core_area').GetName] войдёт в [de_jure|E] [title|El] «[GetTitleByKey('e_yuankang').GetNameNoTier]»"

 build_takaday_coastal_avenue_decision.t: "Проложить прибрежный тракт"
 build_takaday_coastal_avenue_decision_desc: "Джунгли Такадай всегда разделяли восток и запад Дахангона. Хотя работа потребует огромных вложений, можно расчистить значительную часть побережья, связать два региона и позволить торговле идти не только морем, но и по суше."
 build_takaday_coastal_avenue_decision_tooltip: "Связать восток и запад Дахангона"
 build_takaday_coastal_avenue_decision_confirm: "Начать работы"
 build_takaday_coastal_avenue_decision.tt: "Строительство этой дороги займёт от одного до трёх лет."


 proclaim_chin_lin_emperor_decision.t: "Провозгласить императора Циньлиня"
 proclaim_chin_lin_emperor_decision_desc: "За всю свою историю Дахангон ни разу не был полностью покорён Катун-Каем. Даже во времена наибольшего могущества Протекторат Южных земель не сумел пройти сквозь дахангонские джунгли. Но теперь всё изменилось. Я совершил невозможное: катунский монарх правит всем Дахангоном. Статуи меня и моих потомков навеки займут место в золотом дворце Даванг Тармак, где на них будут взирать банвагульские и катунские вельможи, а рядом будут возвышаться образы потомков [Concept('naklan_the_golden','Наклана')|E]."
 proclaim_chin_lin_emperor_decision_tooltip: "Начало новой, невиданной прежде династии."
 proclaim_chin_lin_emperor_decision_confirm: "Короноваться в Даванг Тармаке!"
 proclaim_chin_lin_emperor_decision.tt: "Все ваши вассалы, принадлежащие к [heritage|El] «[GetCulturePillar('heritage_easterner').GetName]» и имеющие о вас мнение выше #I 50#!, примут чэньханскую [culture|El]."

 conquer_the_kashirya_states_decision.t: "Покорить Каширию"
 conquer_the_kashirya_states_decision_desc: "На протяжении всей истории [kashirya|E] была средоточием устремлений великих правителей, создававших здесь грандиозные империи: сначала [otachedian_empire|E], а затем [taryaad_saramsaasan|E].\n\nНо теперь, когда народы Дахангона объединяются под знаменем Циньлиня, катунская кровь в наших жилах зовёт нас к новым завоеваниям и далёким землям, куда ещё не ступал [naklan_the_golden|E]. Наши непобедимые армии пересекут Хараданские горы! Циньлинь станет не последней империей, вошедшей в Каширию, но именно его власть будет самой прочной и успешной!"
 conquer_the_kashirya_states_decision_tooltip: "Править западом."
 conquer_the_kashirya_states_decision_confirm: "Покорить Каширию!"
 conquer_the_kashirya_states_decision.tt: "Мы решим, следует ли сотрудничать с [vidvaookeyatran_scholarly_caste|El]."
 dahnagon_change_control.tt: "Уровень контроля во всех [de_jure|E] [county|El] изменится на #P +25#!."




 advance_into_the_shrunfan_decision.t: "Начать наступление на Шрунфан"
 advance_into_the_shrunfan_decision_desc: "В восточных землях, где великая река течёт через долины среди покатых холмов и густых лесов, некогда стояла держава сайелаянов. Они основали великую и славную династию, но её покорили воинственные пришельцы с родины наших предков. Могущественное королевство Шрунфан было сокрушено. Однако после веков смут и упадка власть Катун-Кая исчезла. Восстания разбили некогда непобедимую ланонанскую армию, и теперь регион раздроблен между соперничающими державами. Циньлинь, сильнейшая катунская империя Южного моря, по праву принимает наследие павшего Катун-Кая и заявляет о верховенстве над исконными землями сайелаянов. Мы подчиним их, заставим платить дань и распространим свою власть туда, куда народы Дахангона ещё никогда не доходили."
 advance_into_the_shrunfan_decision_tooltip: "Новые владения империи Циньлинь."
 advance_into_the_shrunfan_decision_confirm: "Объявить о нашем прибытии"
 restore_the_tilolan_system_decision.t: "Восстановить систему Тилолан"
 restore_the_tilolan_system_decision_desc: "Монархи Дахангона управляли страной посредством особой общественной системы — [Concept('tilolan','Тилолана')|E]. Путешествуя между [GetBuilding('01_dawang_tarmak').GetName] и своими владениями, вассалы не только сообщали монарху о делах регионов, но и пополняли казну данью. Однако после смерти [naklan_the_golden|El] система Тилолан пришла в упадок и стала чрезмерно зависеть от личного престижа правителя Дахангона. При восшествии нового государя прежде покорные вельможи нередко пользовались случаем, чтобы выйти из системы.\n\nТеперь Циньлинь сменил прежнюю династию Дахангона в самом сердце системы Тилолан."
 restore_the_tilolan_system_decision_tooltip: "Укрепить нашу власть."
 restore_the_tilolan_system_decision_confirm: "Усовершенствовать систему."
 restore_the_tilolan_system_decision.tt: "В зависимости от числа [vassal|El] с [title|El] разных рангов вы получите @influence_icon!#P [SCOPE.ScriptValue('dahnagon_vassl_power_value')|0]#!."
 restore_the_tilolan_system_decision_one.tt: "В зависимости от числа [vassal|El] с [title|El] разных рангов вы получите @prestige_icon!#P [SCOPE.ScriptValue('dahnagon_vassl_power_value')|0]#!."
 dahangong_people_surrender_effect.tt: "Больше жителей и вельмож Дахангона @skill_diplomacy_icon!#V признают#! власть вашей [dynasty|El] и примут чэньханскую [culture|El]."
 grant_the_artisans_guild_royal_title_decision.t: "Даровать гильдии ремесленников царский статус"
 grant_the_artisans_guild_royal_title_decision_desc: "Дахангон славится древними ремесленными традициями, и во многих его областях существуют собственные гильдии мастеров. Большие и малые, эти объединения издавна позволяли дахангонской знати без труда создавать сокровища и возводить великолепные сооружения. С основанием империи Циньлинь спрос на умелых мастеров резко возрос. Чтобы удовлетворить его, мы должны объединить ремесленников Дахангона и пополнить их ряды, направив их таланты на службу молодой династии."
 grant_the_artisans_guild_royal_title_decision_tooltip: "Объединить ремесленные гильдии"
 grant_the_artisans_guild_royal_title_decision_confirm: "Учредить официальную гильдию."
 grant_the_artisans_guild_royal_title_decision.tt: "Уровень [development|El] в каждом [county|El], где в любом [holding|El] есть ремесленное [building|E], изменится на #P +3#!, а графство на 20 лет получит [modifier|El] «[GetModifier('recruit_artisan_modifier').GetNameWithTooltip]»"
 craftsmen_buildings_number_value_desc: "В вашей [realm|El] должно быть более #S 15#! ремесленных [building|El] или их улучшений (сейчас: [SCOPE.ScriptValue('craftsmen_buildings_number_value')|0])\n#italic Подходят следующие [building|El]:\n#T ·#![GetBuilding('wind_furnace_04').GetName]\n#T ·#![GetBuilding('artisan_quarters_04').GetName]\n#T ·#![GetBuilding('smiths_04').GetName]\n#T ·#![GetBuilding('siege_works_03').GetName]\n#T ·#![GetBuilding('blacksmiths_03').GetName]#! "
 rebuild_the_pearl_of_dahangon_decision.t: "Возродить жемчужину Дахангона"
 rebuild_the_pearl_of_dahangon_decision_desc: "Все банвагулы почитают Даванг Тармак как свой священнейший город. В банвагульской словесности его часто изображают чудесным краем, вобравшим всё великолепие и величие мира. Веками он служил главным местом паломничества для [faith|El] Дахала и обрёл столь высокое положение, что его судьба стала неразрывно связана с властью над Дахангоном.\n\nОднако [Concept('ratarakaw','Ратаракав')|E], разразившийся в 1242 году И.С., едва не обратил Даванг Тармак в пепел, а ударные волны опустошили несколько соседних областей. Благодаря усилиям империи Циньлинь [Glossary('Юйду','GH_YUYDU_GLOSS')] восстал из пепла, возродившись в ещё большем блеске. Теперь он предстаёт перед миром нашей новой столицей, которой суждено процветать тысячелетиями."
 rebuild_the_pearl_of_dahangon_decision_tooltip: "Восстановить этот прекрасный город."
 rebuild_the_pearl_of_dahangon_decision_confirm: "Восстановить город."
 rebuild_the_pearl_of_dahangon_decision.tt: "В зависимости от степени восстановления [Glossary('Юйду','GH_YUYDU_GLOSS')] владение [GetTitleByKey('c_catchers_east').GetNameNoTier] получит @skill_stewardship_icon!#V бонусы#! разной величины."
 claim_naklan_ancestry_decision.t: "Объявить себя потомком Наклана"
 claim_naklan_ancestry_decision_desc: "[naklan_the_golden|E] был необычайно великим монархом, впервые объединившим враждующие племена Дахангона в единое государство и оставившим после себя множество загадочных преданий. За века банвагульской устной традиции Наклана возвели в божественный ранг. Широко считается, что его священный род был наделён таинственными силами и получил право вести народы Дахангона и править ими.\n\nПоэтому почти каждый банвагульский правитель заявлял о родстве с домом Наклана. Для нас, чужаков в банвагульском обществе, подобное заявление сократит пропасть между Циньлинем и жителями Дахангона, придав новому царскому дому законность в глазах знати и простолюдинов."
 claim_naklan_ancestry_decision_tooltip: "Объявить наш род потомками Наклана."
 claim_naklan_ancestry_decision_confirm: "Перекроить родословную."
 chinlin_nolan_add_bloodline_effect_desc: "Каждый ваш потомок получит [trait|El] #V [GetTrait('gh_scion_of_nolan').GetName(GetNullCharacter)]#!, как и все его потомки по мужской линии."
 enfeoff_family_members_decision.t: "Раздать уделы императорскому роду"
 enfeoff_family_members_decision_desc: "Под мудрым правлением нашего монарха владения империи Циньлинь достигли невиданных размеров, намного превзойдя любую прежнюю державу Дахангона. Это приносит огромную славу, но управление столь необъятной страной становится всё дороже. Приказы из Юйду нередко идут до границ месяцами, разжигая в далёких областях опасное стремление к отделению. Если так продолжится, они неизбежно восстанут против власти Циньлиня.\n\nЧтобы укрепить рубежи, мы назначим представителей [Concept('dynasty_members','императорского рода')|E] в разные области. Они будут действовать от имени императора и укреплять центральную власть. Посланные родственники получат право собирать налоги, набирать войска и назначать чиновников, распоряжаясь местными ресурсами и своевременно подавляя мятежи."
 enfeoff_family_members_decision_tooltip: "Укрепить управление на местах."
 enfeoff_family_members_decision_confirm: "Отправить их на границу"
 chinlin_dynasty_vassal_opinion_desc: "Каждый [vassal|E] вашей [dynasty|El] получает #P +40#! [opinion|El] о #V вас#! #italic (-1,20 в год) (Благодарность)#!"
 chinlin_county_controls_add_desc.tt: "Каждое [county|E] в вашей [realm|El]"
 make_chinlin_descision_desc: "Вы выполнили [decision|El] #V «Начать наступление на Шрунфан»#! и [decision|El] #V «Покорить Каширию»#!."
 chinlin_dynasty_vassal_member_value_desc: "У вас более #S 30#! [vassal|El] вашей [dynasty|El]. (Сейчас: [SCOPE.ScriptValue('chinlin_dynasty_vassal_member_value')|0])"
 mobile_fortress_in_the_jungle_decision.t: "Подвижные крепости джунглей"
 mobile_fortress_in_the_jungle_decision_desc: "[Concept('elephant_cavalry','Боевые слоны')|E] [kashirya|El] издавна славятся по всему миру. Эти могучие звери были кошмаром для пехоты и серьёзно замедляли наступление Циньлиня во время каширийского похода, раз за разом нанося нашим войскам тяжёлые потери.\n\nТеперь, когда Каширия побеждена, мы можем перенять этот опыт и завезти слонов в Дахангон. Их огромные тела легко преодолевают сложную болотистую местность, делая зверей бесценными как в бою, так и при перевозке грузов. Кроме того, величественный вид слоновьих стад укрепит авторитет императорского дома."
 mobile_fortress_in_the_jungle_decision_tooltip: "Завезти слонов из Каширии"
 mobile_fortress_in_the_jungle_decision_confirm: "Одомашнить слонов"
 mobile_fortress_in_the_jungle_decision.tt: "Каждое [county|E], где есть [building|E] «[GetBuilding('elephant_pens_05').GetName]» или его улучшение"
 mobile_fortress_in_the_jungle_decision_tt: "У вас должно быть более 1000 [elephant_cavalry|El]."
 mobile_fortress_in_the_jungle_decision_one_tt: "В вашей [realm|El] должно быть более #S 15#! [building|El] «[GetBuilding('elephant_pens_05').GetName]» или его улучшений (сейчас: [SCOPE.ScriptValue('craftsmen_buildings_number_value')|0])"
 develop_inland_water_transport_decision.t: "Развить речное судоходство"
 develop_inland_water_transport_decision_desc: "Тагсан — могучая и стремительная река. На её берегах, в колыбели дахангонской цивилизации, раскинулось бесчисленное множество городов, что придаёт ей огромное значение для судоходства. Однако торговля по реке всегда была сопряжена с трудностями: суда часто садились на мелкие илистые отмели и не могли преодолеть крутые участки, а междоусобицы ещё сильнее мешали развитию торговли.\n\nТеперь мы наконец способны воспользоваться богатствами Тагсана. Чтобы удовлетворить растущий спрос в речном бассейне, нам предстоит укротить этого великого змея. Передовые катунские строительные методы позволят расширить гавани и углубить русло, превратив реку в процветающую торговую артерию, по которой богатства потекут прямо в сердце империи Циньлинь."
 develop_inland_water_transport_decision_tooltip: "Способствовать развитию торговли."
 develop_inland_water_transport_decision_confirm: "Углубить русло."
 chinlin_inland_water_transport_value_desc: "В [region|El] [GetGeographicalRegion('trade_confluence_tagsan_navigable_area').GetName] должно быть более #S 15#! [building|El] «[GetBuilding('common_tradeport_06').GetName]» и [building|El] «[GetBuilding('caravanserai_05').GetName]» либо их улучшений (сейчас: [SCOPE.ScriptValue('chinlin_inland_water_transport_value')|0])"
 develop_inland_water_transport_decision_trigger_desc: "Уровень [development|El] каждого [county|El] в [region|El] [GetGeographicalRegion('trade_confluence_tagsan_navigable_area').GetName], не являющегося пустошью, не ниже #bold 15#!"
 chinlin_inland_water_transport_income_value_desc: "В зависимости от числа подходящих [building|El] вы получите @gold_icon!#P [SCOPE.ScriptValue('chinlin_inland_water_transport_income_value')|0]#!"
 develop_inland_water_transport_decision.tt: "Каждое [county|E] в [region|El] [GetGeographicalRegion('trade_confluence_tagsan_navigable_area').GetName]"
 chinlin_vassal_opinion_add_desc: "Каждый [vassal|E], владеющий [title|El] в [region|El] [GetGeographicalRegion('trade_confluence_tagsan_navigable_area').GetName], получает #P +15#! [opinion|El] о #V вас#! #italic (-1,20 в год) (Благодарность)#!"
 develop_dahangon_wetlands_decision.t: "Освоить дахангонское Глинистое море"
 develop_dahangon_wetlands_decision_desc: "Большая часть Дахангона по-прежнему скрыта глубокими болотами и густыми лесами, и лишь малая доля земли расчищена под пашни, что препятствует росту городов. Если мы организуем борьбу с этими природными преградами, плодородные болота Дахангона превратятся в поля и обеспечат правителей постоянным притоком зерна и доходов."
 develop_dahangon_wetlands_decision_tooltip: "Выдержать все тяготы освоения новых земель."
 develop_dahangon_wetlands_decision_confirm: "Возделаем эту землю."
 hill_or_werlands_or_floodplains.tt: "В [holding|El] есть [terrain|E] «[GetTerrain('hills').GetName]», «[GetTerrain('wetlands').GetName]» или «[GetTerrain('floodplains').GetName]»."
 change_watermills_level_effect_desc: "Повысить уровень [building|El] «[GetBuilding('watermills_01').GetName]» или его улучшения в этом [holding|El] на 1."

 introduce_kashiryan_elephants_decision.t: "Завезти каширийских слонов"
 introduce_kashiryan_elephants_decision_desc: "В [dahangon_lowlands_biozone|El] слоны встречаются лишь изредка. Но в соседней [kashirya|El] их много, а польза от них огромна, поэтому было бы разумно тем или иным способом приобрести несколько животных."
 introduce_kashiryan_elephants_decision_modifier_tt: "В выбранном [holding|El] #bold нет#! [modifier|El] «[GetModifier('kashiryan_elephant_herd_modifier').GetNameWithTooltip]»"
 introduce_kashiryan_elephants_decision_holding_tt: "Выбранное [holding|E] имеет [holding_type|El] «[castle|E]», «[city|E]», «[temple|E]» или «[temple_citadel|E]»"
 introduce_kashiryan_elephants_decision_terrain_tt: "Выбранное [holding|E] имеет [terrain|E] «[GetTerrain('jungle').GetName]» или «[GetTerrain('forest').GetName]»"
 introduce_kashiryan_elephants_decision_tt: "[holding|E] имеет [holding_type|El] «[castle|E]», «[city|E]», «[temple|E]» или «[temple_citadel|E]», а также [terrain|El] «[GetTerrain('forest').GetName]»."
 introduce_kashiryan_elephants_decision_effect_tt: "Выбранное [holding|E] на #V 15#! лет получает «[GetModifier('kashiryan_elephant_herd_modifier').GetNameWithTooltip]»"
 introduce_kashiryan_elephants_decision_tooltip: "Купить стадо слонов и поселить его в одном из ваших [holdings|El]"
 introduce_kashiryan_elephants_decision_confirm: "Приобрести стадо"

 establish_absolute_leadership_over_the_dahala_decision.t: "Установить полную власть над духовенством"
 establish_absolute_leadership_over_the_dahala_decision_desc: "Основу [religion|El] банвагулов составляет #V Дахала#! — религиозная система, испытавшая глубокое влияние философии. После [battle_of_balinbada|El] был учреждён Протекторат Южного моря, и #V Четырнадцать небесных методов#! вместе с другими [kathun|El] верованиями распространились по торговым путям Южного моря, создав в Дахангоне сложную религиозную картину. Раздробленный рельеф ещё сильнее усугубляет различия между областями.\n\nТеперь, когда в империю Циньлинь прибывает всё больше катунских переселенцев, распри между [faith|El] резко обострились и уже угрожают власти Циньлиня. Старая политика веротерпимости больше не годится. Мы должны учредить единую государственную конфессию, изгнать прочие верования и искоренить эти источники нестабильности."
 establish_absolute_leadership_over_the_dahala_decision_tooltip: "Император — единственный и полновластный господин."
 establish_absolute_leadership_over_the_dahala_decision_confirm: "Учредить государственную конфессию."
