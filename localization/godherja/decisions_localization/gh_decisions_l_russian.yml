 restore_aironoi_decision: "Восстановить Айроной"
 restore_aironoi_decision_desc: "Хотя разрушения от [Concept('frodbrokna','Фродброкны')|E] оставили перед нами сложную задачу, из разрушенного [GetTitleByKey('c_asiupoli').GetNameNoTier] мы отбили варваров как с востока, так и с запада. Окровавленный, но никогда не сломленный, Айроной снова станет сильным восточным оплотом восстановленной Аверсарии."
