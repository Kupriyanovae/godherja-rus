 request_heir_from_the_pit_decision: "Pray for a Worthy Heir"
 request_heir_from_the_pit_decision_desc: "Откуда мы пришли и куда все вернемся — Бездна есть начало и конец всего сущего, ласка истинных богов за пределами [Concept('aeras','Аэраса')|E], и место, где плоть и ихор соединяются в черную кровь. Именно оттуда я призову достойного послушника, который станет моим учеником."
