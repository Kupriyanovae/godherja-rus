 raze_sophocos_decision: "Разрушить Башню Софокоса"
 raze_sophocos_decision_desc: "Башня [GetBuilding('01_sophocos').GetName] стояла неисчислимые тысячелетия, привлекая паломников и путешественников со всего [Concept('aeras','Эраса')|E]. Она наверняка полна сокровищ, готовых к нашему захвату."
 raze_sophocos_decision_tooltip: "Разрушить Софокос и забрать его сокровища"
