 dahala_religion_control_dahangon_region_desc: "Вы полностью контролируете все [holy_site|El] своей [faith|El], и каждое из них принадлежит вашей [faith|El]"
 make_religious_leader.tt: "[title|E] «[GetTitleByKey('e_chinlin').GetNameNoTier]» станет [head_of_faith|El] вашей [faith|El]."
 dahala_winner.tt: "Каждое [county|E] в вашей [realm|El], не исповедующее [religion|El] #V Дахала#!, может сменить свою [faith|El] на вашу [faith|El]."
