 raze_sophocos_effect_tooltip: "Вы разрушите [GetBuilding('01_sophocos').GetName], заберете его сокровища и вернете уровень его постройки к первому."

 claim_the_isles_decision: "Заявить права на Острова"
 claim_the_isles_decision_desc: "[Concept('shatteredisles','Расколотые Острова')|E] простираются по Морю Империй, словно зазубренные осколки целого. Пришло время собрать осколки воедино."
 claim_the_isles_decision_tooltip: "Заявите свои права на Расколотые Острова"
 claim_the_isles_decision_confirm: "Заявить права на Острова"

 isles_retribution_war_decision: "Суверенитет Островов"
 isles_retribution_war_decision_desc: "Слишком долго континентальцы посягали на омытые солью берега нашей родины, забирая то, что по праву принадлежит нам. Мы должны положить этому конец и вышвырнуть их обратно в море."
 isles_retribution_war_decision_tooltip: "Защитить Острова"
 isles_retribution_war_decision_confirm: "Возмездие!"
