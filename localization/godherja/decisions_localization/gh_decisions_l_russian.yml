 become_king_taykovi_decision_desc: "Король? Зачем мне быть королем? Есть люди, которых я должен убить."
 become_king_taykovi_decision_enemies_dead: "Почему бы мне не стать королём? Разве некоторые уже не называют меня законным аавтократом мёртвой [Concept('aversaria','Аверсарии')|E]? В проливах Агеотароса никто не сравнится со мной престижем и родословной. Отбросим притворство. Если мне суждено искупить Драксакиадов, это должно свершиться и богатством, и кровью."

 belisarios_tries_to_forget: "Нечто большее в жизни"
