 stability_in_recovering_lost_territories_decision.t: "Stability in Recovering Lost Territories"
 stability_in_recovering_lost_territories_decision_desc: "The bandits have been vanquished, and the banner of Kathun-kai once again flies atop the towers of Shangnyi Port. The local people, long suffering under the corrupt tyranny of the Shrunfan nobles, have yearned day and night for the arrival of the rightful army. The coming of Lanonan has brought them hope. The ruined structures shall be rebuilt, the abandoned fields reclaimed, and order shall prevail over chaos, restoring this land to a state of flourishing prosperity."
 stability_in_recovering_lost_territories_decision_confirm: "Commence construction."
 stability_in_recovering_lost_territories_decision_tooltip: "Let Weizhou prosper once again."
 stability_in_recovering_lost_territories_decision_1.tt: "Many refugees who fled to the north have begun #P returning#! to their hometowns, the [culture|E] in some [counties|E] will be #V changed#!."
 stability_in_recovering_lost_territories_decision.tt: "Every [county|E] located in the [GetGeographicalRegion('world_ga_weizhou_formable').GetName] [region|E]"
 stability_in_recovering_lost_territories_decision_2.tt: "[GetBuilding('common_tradeport_06').GetName] or [GetBuilding('caravanserai_05').GetName] lines [building|E] will #P upgrade#! one level."
 disseminate_imperial_edification_decision.t:"Disseminate Imperial Edification"
 disseminate_imperial_edification_decision_desc: "Lanonan is a remote and uncivilized land, far from the heart of [kathun|E] civilization. The people living here are largely unfamiliar with the rites and music, mired in ignorance. One of the key purposes of the Dragon Emperor in establishing the Command of the Lanonan was to enlighten the region and spread advanced culture. By founding schools and teaching the script of Kathuni, we can transform the locals into subjects no different from those in the heartland of Kathun-kai, casting off the barbaric customs of the frontier."
 disseminate_imperial_edification_decision_confirm: "Educate the People."
 disseminate_imperial_edification_decision_tooltip: "Promoting the Kathuni Culture"
 disseminate_imperial_edification_decision.tt: "The #P Effectiveness#! of this [decision|E] scales progressively with the #V level#! of the local [GetBuilding('xuegong_01').GetName] lines [building|E]."
 kathuni_change_culture_desc: "Influenced by Kathuni Culture"
 accept_saielaian_as_part_of_kathunkai_decision.t:"Accept Saielai as part of Kathun-Kai"
 accept_saielaian_as_part_of_kathunkai_decision_desc: "For centuries, the Saielaian people had sought to break free from the rule of Kathun-Kai. The struggle against unending rebellions had never ceased since the establishment of the Protectorate. However, as the ancient saying goes, constant dripping wears away the stone. Through years of dedicated governance, Kathuni customs and ways have permeated every aspect of life in Nanmay Bon. The locals no longer rejects the rule of the Protectorate of the Southlands. At last, I has fulfilled the mission entrusted to us by the Dragon Emperor, making Nanmay Bon truly a part of the Kathuni Realm."
 accept_saielaian_as_part_of_kathunkai_decision_confirm: "Assimilate the Saielai"
 accept_saielaian_as_part_of_kathunkai_decision_tooltip: "Lanonan shall forever belong to Kathun-Kai."
 accept_saielaian_as_part_of_kathunkai_decision.tt: "Every #V Saielai#![heritage|E] [county|E]"
 accept_saielaian_as_part_of_kathunkai_decision_tt: "You [completely_control|E] All #V Saielai#![culture|E] [county|E]"
 accept_saielaian_as_part_of_kathunkai_decision_1_tt: "The [cultural_acceptance|E] between Saielai #weak (And Kandysar)#! and Your [culture|E] is at least #V 90#!"
 accept_saielaian_culture: "Accepted Culture"
 abolish_the_bureau_of_the_bronzeport_decision.t:"Abolish the Bureau of the Bronzeport"
 abolish_the_bureau_of_the_bronzeport_decision_desc: "As the Protectorate of the Southsea, established by decree of the Dragon Emperor, we possess the supreme authority in theory over all military and political affairs in the Southsea. However, since the 10th century, [Concept('bureau_bronzeport','Bureau of the Bronzeport')|E] in the south has become an independent institution, severing the Dahangon region, which originally fell under the governance of the Protectorate. For centuries, we have remained locked in a prolonged stalemate in the Southsea, until the [Concept('frodbrokna','Tianqin')|E] brought an end to Kathun-kai. Now, the Protectorate stands as the sole power capable of deciding the fate of the Southsea. The time is ripe to abolish the institution of Bronzeport, for governance in the Southsea must be unified."
 abolish_the_bureau_of_the_bronzeport_decision_confirm: "Declare its end"
 abolish_the_bureau_of_the_bronzeport_decision_tooltip: "Reiterate Our Sole Authority"
 abolish_the_bureau_of_the_bronzeport_decision.tt: "Every [vassal|E] of [GetTitleByKey('k_bronzeport').GetNameNoTier] becomes your Vassal"
 abolish_the_bureau_of_the_bronzeport_decision_1.tt: "Every [GetCulturePillar('heritage_easterner').GetName] [culture|E] [vassal|E]"
 abolish_the_bureau_of_the_bronzeport_decision_tt: "[GetTitleByKey('k_bronzeport').GetNameNoTier][title|E] has not created or its [holder|E] is your [vassal|E]"
 establish_southsea_protectorate_decision_1.tt: "Every [realm|E] [county|E]"
 establish_southsea_protectorate_decision.tt: "If you holds the [kingdom|E] [title|E] of [GetTitleByKey('k_dranfan').GetNameNoTier], [GetTitleByKey('k_tuleang').GetNameNoTier], [GetTitleByKey('k_yantalin').GetNameNoTier], [GetTitleByKey('e_protectorate_of_the_southsea').GetNameNoTier] will become [de_jure|E] liege of them"
 stand_on_the_land_beyond_north_wind_decision.t: "Stand on the Land beyond North Wind"
 stand_on_the_land_beyond_north_wind_decision_desc: "May the Purest bless the great [ROOT.GetCharacter.GetFirstNameNoTooltip]—behold, a new empire takes shape in our hands, rising beyond the ruins and borders of the old world. Day by day, more cities raise the [aversaria|E] banner.Day by day, more subjects kneel before our sovereign's throne and swear fealty. Wealth pours forth like rivers, glory blazes like stars. \n\nOur army is invincible, unbreakable.we shall conquer all the way to [kashirya|E], and then press eastward, to the very ends of the [aeras|E]! And at those ends, we shall raise an eternal monument, that the Purest may shed its light upon all ages."
 stand_on_the_land_beyond_north_wind_decision_confirm: "Over mountains and through forests!"
 stand_on_the_land_beyond_north_wind_decision_tooltip: "Conquer that realm far beyond Aversarian."
 stand_on_the_land_beyond_north_wind_decision_tt: "Control more than #V 50#! [county|E] in [GetGeographicalRegion('world_ga_kashirya').GetName] [region|E]"
 stand_on_the_land_beyond_north_wind_decision_1_tt: "Your [capital|E] is a Metropolis [holding|E]"
 stand_on_the_land_beyond_north_wind_decision_1.tt: "Every you or your [vassals|E] held #V Kashirya#! [kingdom|E] [title|E] become the [de_jure|E] of [GetTitleByKey('e_kasiaeolia').GetNameNoTier]"
 stand_on_the_land_beyond_north_wind_decision_2.tt: "Every [vassals|E] of [GetCulturePillar('heritage_aversarian').GetName][heritage|E] "
 form_underground_hegemony_decision: "Unite the Mayikrata's Depths"
 form_underground_hegemony_decision_desc: "Beneath the [mayikrata|E] lies a vast labryinth untamed by humanity. Few have ever dared venture into the dark, fewer still have tried to tame it.\n\nThe dark has no sovereign. It is a realm without a crown. But it need not remain so."
 form_underground_hegemony_decision_confirm: "Unite the Labryinth"
 form_underground_hegemony_decision_tooltip: "Form a [hegemony|E] underground"
