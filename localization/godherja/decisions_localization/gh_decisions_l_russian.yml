l_russian:
 gh_mint_personal_ayraal_decision: "Mint a Personal Ayraal"
 gh_mint_personal_ayraal_decision_desc: "An [paiza|E] bearing my own name and seal shall be minted at once. Let none who carry it come to harm within my realm, and let all know that they speak with my voice.\n\nThe authority of the seal reflects the authority of the mint — a grander [paiza|E] demands a grander source."
 gh_mint_personal_ayraal_decision_tooltip: "Mint an [paiza|E] for yourself. The tier of the [paiza|E] and its cost scales with the finest mint you control."
 gh_mint_personal_ayraal_decision_no_ayraal: "You must #bold not#! already possess an [paiza|E] [artifact|E]"
 gh_mint_personal_ayraal_decision_needs_mint: "You must control at least one Ayraal mint or office — either within your realm's holdings or as a Minor Ayraal Mint built within your estate"
 gh_mint_personal_ayraal_decision_confirm: "Commission the Ayraal"
 reunite_the_empire_decision: "Воссоединить Империю"
 reunite_the_empire_decision_tooltip: "Воссоедините Аверсаринскую Автократию и снова соберите всех аверсарианцев под единым знаменем!"
 reunite_the_empire_decision_desc: "Горе детям [Concept('aversaria','Аверсарии')|E]! Когда-то мы были едины и сильны, правили [Concept('the_continent','Континентом')|E] и распространялись по всему миру — нашему неотъемлемому праву — как и подобало. Прошедшие годы были к нам недобры, но этому пришел конец!\n\nМы вновь объединили большую часть центральных владений Автократии под единым знаменем, и теперь пришло время объявить себя истинными преемниками великой Империи прошлого!"
 reunite_the_empire_decision_titles_tt: "Все принадлежащие вам имперские титулы будут уничтожены, а их территории станут [Concept('de_jure','де-юре')|E] вашего нового основного титула, [GetTitleByKey('e_aversarinas_aautokrata').GetNameNoTier]"
 reunite_the_empire_decision_titles_empire_tt: "Все [Concept('title','титулы')|E] западнославянских [Concept('kingdom','королевств')|E] принадлежащие вам (кроме вашего [Concept('primary_title','основного титула')|E]) будут уничтожены, а их территории станут [Concept('de_jure','де-юре')|E] случайного принадлежащего вам западнославянского королевства"
 reunite_the_empire_decision_confirm: "Воссоединить Империю"
 reunite_the_empire_valid_desc: "Должен контролировать не менее 4 традиционных провинций [Concept('aversaria','Аверсарии')|E], считая Катраддию, а Калатипсоми считать за две."
 reunite_the_empire_valid_desc_short: "Поскольку вы владеете [Concept('artifact','артефактом')|E] Аверсарианской Короной, вы должны контролировать не менее 1 традиционной провинции [Concept('aversaria','Аверсарии')|E], считая Катраддию, а Калатипсоми считать за две."

 reunite_the_north_decision: "Воссоединить Север"
 reunite_the_north_decision_tooltip: "Провозгласите себя [Select_CString(ROOT.Char.IsFemale, 'законной преемницей', 'законным преемником' )] Аверсарии, базирующимся в [GetTitleByKey('c_oraispol').GetNameNoTier]"
 reunite_the_north_decision_desc: "Когда-то стоявший на грани краха под натиском варварских орд, северная [Concept('aversaria','Аверсария')|E] была воссоединена под моим правлением. Я больше не просто мелкий полководец, и [GetTitleByKey('c_oraispol').GetNameNoTier] снова является центром грозной державы."
 reunite_the_north_decision_oraispol_capital_tt: "Наша столица находится в [GetTitleByKey('c_oraispol').GetNameNoTier]"
 reunite_the_north_decision_confirm: "Воссоединить Север"
 
 reunite_the_south_decision: "Воссоединить Юг"
 reunite_the_south_decision_tooltip: "Провозгласите себя [Select_CString(ROOT.Char.IsFemale, 'законной преемницей', 'законным преемником' )] Аверсарии, базирующимся в [GetTitleByKey('c_asiupoli').GetNameNoTier]"
 reunite_the_south_decision_desc: "Бесчисленные военачальники юга были сокрушены под нашей пятой, и сильно поврежденный, но все еще славный город [GetTitleByKey('c_asiupoli').GetNameNoTier] находится в наших руках. Поскольку в старой столице [GetTitleByKey('c_oraispol').GetNameNoTier] нет законного преемника, именно на нас ложится бремя власти."
 reunite_the_south_decision_asiupoli_capital_tt: "Наша столица находится в [GetTitleByKey('c_asiupoli').GetNameNoTier]"
 reunite_the_south_decision_confirm: "Воссоединить Юг"
 
 reintegrate_core_aversarian_territory: "Воссоедините остальные земли"
 reintegrate_core_aversarian_territory_desc: "Наконец-то территории, отторгнутые от Империи Чистейших, могут быть возвращены в лоно, где им и место. Нечистые расы когда-то считали [Concept('aversaria','Аверсарию')|E] мертвой и канувшей в лету, но что может быть лучшим знаком нашего возрождения? Мир признает наше возвращение и содрогнется при виде нашей славной возрожденной империи."
 pryonism_negative_dreams: "Даровать негативные сновидения"
 pryonism_positive_dreams: "Даровать позитивные сновидения"
 pryonism_negative_dreams_desc: "Внушать им ужасные кошмары во снах."
 pryonism_positive_dreams_desc: "Внушать им во снах проблески рая."
 kemsar_towers_decision: "Реактивировать Так'хан"
 kemsar_towers_decision_tooltip: "Получите контроль над всеми Святыми Землями нашей религии и начните процесс реактивации этих древних защитных сооружений!"
 kemsar_towers_decision_desc: "Давным-давно Тот, Кто Был, доверил нам священную задачу, и мы подвели Его! Мы вернемся к зениту нашей силы и вновь примем бремя служения, от которого отреклись слишком много лет.\n\nПредстоящий путь долог, труден и полон страданий; но мы вынесем его ради всего сущего."
 kemsar_towers_decision_confirm: "Наш долг исполнен, Его Воля Да Будет Исполнена."

 announce_aversaria_voreias_decision: "Провозгласить Аверсарию Вореяс"
 announce_aversaria_voreias_decision_desc: "Первый шаг к восстановлению нашей священной родины сделан. На севере создан плацдарм, чтобы твердо противостоять орде сьяволки. Пришло время короновать себя Автократом новой [Concept('aversaria','Аверсарии')|E] и подготовиться к маршу на юг..."
 announce_aversaria_voreias_decision_tt: "Вы создадите титул [GetTitleByKey('e_aversaria_voreias').GetNameNoTier]\nСтанут доступны новые решения"
 announce_aversaria_voreias_decision_confirm: "Провозгласить Аверсарию Вореяс"
 announce_aversaria_voreias_decision_tooltip: "Провозгласите новую северную [Concept('aversaria','Аверсарию')|E], посвященную отвоеванию старой"
 convert_to_suncult_decision: "Объявить себя Воплощением Чистейшего"
 convert_to_suncult_decision_desc: "Если когда-нибудь появится надежда на будущее Империи, у нее должен быть обновленный дух, который приведет ее к победе. Дух, проповедующий полное доверие видению лидера и непоколебимое следование каждому его приказу. Дух, поощряющий фанатичную преданность до самой смерти.\n\nИ где еще можно найти такую фанатичность, как не в вере?"
 convert_to_suncult_decision_confirm: "Обратить всех в Культ Черного Солнца"
 convert_to_suncult_decision_tooltip: "Пришло время всем преклонить колено и поклоняться мне"
 pryonism_decision: "Читать мысли"
 pryonism_decision_desc: "Пришло время почитать чужие мысли и узнать сверхсекретные секреты, вроде того, что Ричард Никсон провернул 'Мокрое и дикое водное ограбление Трикки Дика' 1967 года."
 pryonism_decision_confirm: "Читать их мысли."
 contact_spirits: "Связаться с духами"
 contact_spirits_desc: "Я свяжусь с духами и узнаю их секреты."
 raise_spirit_army: "Поднять армию духов"
 raise_spirit_army_desc: "Поднятие духов — опасная задача, однако возможность получить легион лучших воинов этого мира с дополнительным преимуществом почти полного иммунитета к бою слишком хороша, чтобы упустить ее."
 hire_court_magi_decision: "Найти мага"
 hire_court_magi_decision_desc: "Придворный [Concept('magi','мага')|E] необходим для выполнения магических обязанностей и обучения тех при дворе, кто желает учиться. Я прикажу своим слугам обыскать земли в поисках талантливых кандидатов, желающих мне служить."
 hire_court_magi_decision_tooltip: "Вам будет представлена группа [Concept('magi','магов')|E], и вы сможете нанять одного из них за плату."
 hire_court_magi_decision_effect_tooltip: "Вы будете искать #E придворного#! [Concept('magi','мага')|E], который присоединится к вашему Совету."
 hire_court_magi_decision_confirm: "Начать поиски!"
 hire_court_magi_decision_desc_tooltip: "Вы будете искать [Concept('magi','мага')|E]."
 spirit_journey_decision: "Отправиться в духовное путешествие"
 spirit_journey_decision_desc: "Моя религия позволяет совершить путешествие в Мир Духов. С помощью силы грибов я познаю тайны вселенной."
 spirit_journey_decision_tooltip: "Отправьтесь в духовное путешествие и познайте истинную природу вселенной."
 spirit_journey_trigger: "В настоящий момент вы не можете отправиться в духовное путешествие."
 spirit_journey_effect: "Вы получите благочестие и престиж, заплатив золотом; чем больше риск, тем больше награда."
 spirit_journey_confirm: "В Мир Духов!"
 eastern_reforms_side_governor_decision: "Обвинить Хатана Алтана"
 eastern_reforms_side_governor_decision_desc: "Хатан Алтан и племена ольтенов, хотя часто и заявляют о верности [Concept('aversaria','Аверсарии')|E], веками известны своим желанием править Айроноем. Дестабилизация Легиона, несомненно, дала бы им идеальную возможность, и многие факторы, кажется, указывают на то, что, если не Алтан напрямую, то племена ольтенов имели какое-то отношение к смерти Валерикса.\n\nВ свою защиту Алтан напомнил мне, что он и Валерикс были в дружеских отношениях и что Валерикс никогда бы не смог пройти на запад из степей, если бы Ольтен не проводили их домой в первую очередь.\n\nГубернатор Тетрадиа сообщил нам, что если мы вступим в конфликт с ольтенами по этому вопросу, он с радостью поможет нам финансово и своими собственными силами и обещает Легиону владение имуществом ольтенов на востоке, как только Валерикс будет отомщен. Однако, несомненно, это свяжет нас с Тетрадией теснее, чем что-либо другое, и любые мечты о реформах будут сильно затруднены..."
 eastern_reforms_side_governor_decision_confirm: "Алтан — убийца, готовьте людей"
 eastern_reforms_side_mongols_decision: "Обвинить Губернатора Тетрадию"
 eastern_reforms_side_mongols_decision_desc: "Губернатор Тетрадиа годами враждовал с Валериком из-за судьбы Автократии. Хотя Валерикс обещал помочь ему вернуть [GetTitleByKey('c_asiupoli').GetNameNoTier], губернатор всегда отказывался слышать какие-либо слова о реформах или изменениях, особенно когда дело касалось его обширных рабовладельческих поместий. Кроме того, Тетрадиа и его соратники известны как интриганы, ветераны старых времен Императорского двора еще до того, как Фенвир высадились на восточных берегах.\n\nСо своей стороны, Тетрадиа отрицает любую причастность. Он указал на то, насколько идиотским было бы с его стороны дестабилизировать Легион, когда это его единственный шанс вернуть свой город, а также на то, что Ктеумакса давно жаждут владения южным Айроноем.\n\nСам Алтан прислал нам известие, что если мы выступим против Тетрадии, его силы будут в нашем распоряжении в случае гражданской войны. Кроме того, он пообещал помочь нам в нашей вражде с Фенрусом в качестве союзника, в обмен на южные владения Фенвиров."
 eastern_reforms_side_mongols_decision_confirm: "Приказать арестовать Тетрадию"
 invade_fenvir_clanrech_decision: "Начать Реконкисту"
 invade_fenvir_clanrech_decision_tooltip: "Начать кампанию по возвращению [GetTitleByKey('c_asiupoli').GetNameNoTier]"
 invade_fenvir_clanrech_decision_tt: "Мы объявим [Concept('war','войну')|E] клану Фенвир, с целью вернуть [GetTitleByKey('c_asiupoli').GetNameNoTier]."
 invade_fenvir_clanrech_decision_desc: "Время пришло. Псы Фенвира слишком долго сидели на законной [Concept('aversaria','аверсарианской')|E] земле, и мы никогда не сможем спасти нашу родину от нее самой и ее врагов, пока они занимают ее величайший город. Пришло время призвать наших союзников и написать первую главу саг нашей священной реконкисты."
 invade_fenvir_clanrech_decision_confirm: "Объявить войну!"
 iyrossi_kill_aversarians_decision: "Уничтожить аверсарианцев"
 iyrossi_kill_aversarians_decision_desc: "Наши недавно завоеванные земли населены [Concept('aversaria','аверсарианцами')|E], нашими давними мучителями, они должны быть искоренены, чтобы мы снова могли быть свободными. Солнце засияет над нашими землями предков, очищенными от вечного врага!"
 iyrossi_kill_aversarians_decision_confirm: "Это должно быть сделано"
 iyrossi_united_desc: "Ийросси были объединены"
 bloody_throne_decision: "Утвердиться на Кровавом троне"
 bloody_throne_decision_desc: "Горасс оставил после себя наследие резни, воздвигнув себе трон из черепов на горе трупов. Чтобы поддержать это наследие, мы должны убедиться, что все знают, что мы, и только мы, достойны сидеть на нем."
 bloody_throne_decision_confirm: "Кровавый Трон вечен"
 bloody_throne_decision_custom_tooltip: "Если не принять решение скоро, титул Кровавого Трона ускользнет от нас."
 bloody_throne_decision_tooltip: "Мы должны подтвердить наше право на Кровавый Трон, чтобы не потерять этот титул."
 renounce_gorassos_decision: "Гниющий Трон"
 renounce_gorassos_decision_desc: "Отец Кровавого Трона пал, его череп теперь украшает символ его кровавой мощи. Так же будет и с твоим, однажды. Ты наследник его кровавого наследия, и ничтожные будут трепетать перед твоими священными клинками!"
 renounce_gorassos_decision_confirm: "Кровь прольется!"
 renounce_gorassos_decision_tooltip: "Отречься от Горасса и его ереси"
 renounce_megistos_decision: "Прощай, Мегист"
 renounce_megistos_decision_desc: "Ты не Мегист. Ты знаешь это в своем сердце. Ты никогда не будешь Мегистом и никогда не сможешь им стать. Возможно... возможно, пришло время отпустить его. Мегист больше не свет нашей вселенной, но, может быть, он снова им станет в конце всего сущего. Прощай, Мегист..."
 renounce_megistos_decision_confirm: "Еще одно прошептанное имя, потерянное во времени."
 renounce_megistos_decision_tooltip: "Отречься от Мегиста и его ереси"
 redistrict_metro_cap: "Переделать столицу"
 redistrict_metro_cap_desc: "Мировые метрополии — поистине великолепные жемчужины, каждая из которых является уникальным двигателем производства. Эти производительные силы могут быть еще более увеличены. Все, что для этого нужно, — это достаточно средств и планирования, чтобы организовать массы в дисциплинированные ряды, нацеленные на дальнейшую войну или ваше собственное богатство..."
 redistrict_metro_cap_confirm: "Время заняться делом!"
 redistrict_metro_cap_tooltip: "Щедро потратьтесь, чтобы специализировать свою метрополию."
 found_metro_in_kingdom_cap: "Основать мегаполис"
 found_metro_in_kingdom_cap_desc: "Каждое великое королевство заслуживает столь же великого полиса, который станет резиденцией его правителя. Моя страна лишена такого места, но это ненадолго. Я позабочусь о том, чтобы поколения помнили не только мое имя и мои деяния, но и саму землю, по которой я ходил, и основание, которое я заложил."
 found_metro_in_kingdom_cap_confirm: "Приступить, чтобы оставить свой след."
 found_metro_in_kingdom_cap_tooltip: "Вы приступите к строительству района-метрополии, основанного на ваших основных характеристиках и чертах образа жизни."
 gh_sack_ostrapol: "Разграбить Остраполь"
 gh_sack_ostrapol_desc: ""
 gh_sack_ostrapol_confirm: "Сжечь дотла!"
 gh_sack_ostrapol_tooltip: "Вы начнете разграбление метрополии Остраполь!"
 gh_debase_currency_decision: "Обесценить валюту"
 gh_debase_currency_decision_desc: "В жизни каждого правителя, будь он велик или мал, где бы он ни находился, наступает момент, когда он должен принять решение. Действительно ли деньги важнее того, как его народ, как сама история, могут на него смотреть?\n\nДля тех, кто решает, что да, это так, возможность обесценить свою драгоценную валюту ради выгоды — легкий выбор."
 gh_debase_currency_decision_confirm: "Пусть золото течет рекой."
 gh_debase_currency_decision_tooltip: "Пожертвуйте большим количеством [Concept('prestige','престижа')|E] в обмен на мгновенный приток золота."
 gh_debase_currency_decision_2: "Обесценить валюту"
 gh_debase_currency_decision_2_desc: "В жизни каждого правителя, будь он велик или мал, где бы он ни находился, наступает момент, когда он должен принять решение. Действительно ли деньги важнее того, как его народ, как сама история, могут на него смотреть?\n\nДля тех, кто решает, что да, это так, возможность обесценить свою драгоценную валюту ради выгоды — легкий выбор."
 gh_debase_currency_decision_2_confirm: "Пусть золото течет рекой."
 gh_debase_currency_2_decision_tooltip: "Пожертвуйте большим количеством [Concept('prestige','престижа')|E] в обмен на мгновенный приток золота."
 gh_debase_currency_decision_3: "Обесценить валюту"
 gh_debase_currency_decision_3_desc: "В жизни каждого правителя, будь он велик или мал, где бы он ни находился, наступает момент, когда он должен принять решение. Действительно ли деньги важнее того, как его народ, как сама история, могут на него смотреть?\n\nДля тех, кто решает, что да, это так, возможность обесценить свою драгоценную валюту ради выгоды — легкий выбор."
 gh_debase_currency_decision_3_confirm: "Пусть золото течет рекой."
 gh_debase_currency_decision_3_tooltip: "Пожертвуйте большим количеством [Concept('prestige','престижа')|E] в обмен на мгновенный приток золота."
 gh_debase_currency_4_decision: "Обесценить валюту"
 gh_debase_currency_decision_4_desc: "В жизни каждого правителя, будь он велик или мал, где бы он ни находился, наступает момент, когда он должен принять решение. Действительно ли деньги важнее того, как его народ, как сама история, могут на него смотреть?\n\nДля тех, кто решает, что да, это так, возможность обесценить свою драгоценную валюту ради выгоды — легкий выбор."
 gh_debase_currency_decision_4_confirm: "Пусть золото течет рекой."
 gh_debase_currency_decision_4_tooltip: "Пожертвуйте большим количеством [Concept('prestige','престижа')|E] в обмен на мгновенный приток золота."
 gh_strengthen_currency_decision: "Укрепить валюту"
 gh_strengthen_currency_decision_desc: "Теперь, когда в нашей столице расположен Королевский Монетный Двор, у нас появилась прекрасная возможность ввести новые меры для укрепления нашей валюты. Благодаря таким мерам, как изъятие уже находящейся в обращении валюты, продажа иностранных активов, реформы и переговоры с кредиторами, мы можем добиться столь необходимого повышения стоимости нашей валюты."
