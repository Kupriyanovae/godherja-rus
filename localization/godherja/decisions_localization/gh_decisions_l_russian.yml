 form_underground_hegemony_decision_extra_dejure_tt: "Any held underground empires formed by decision such as the [GetTitleByKey('e_bleakbeacon_aautokrata').GetNameNoTier] will also become [de_jure|E] of the [GetTitleByKey('h_underground').GetNameNoTier]"
 form_bleakbeacon_aautokrata_decision: "Form the Bleakbeacon Aautokrata"
 form_bleakbeacon_aautokrata_decision_desc: "Bleakbeacon was created as a refuge from the horrors buried amidst the labryinth. Yet now the beaconlight spreads outward, and a new world beneath the surface seems possible."
 form_bleakbeacon_aautokrata_decision_confirm: "Under Empire Will Reign"
 form_bleakbeacon_aautokrata_decision_tooltip: "Form the Bleakbeacon Aautokrata"
 form_bleakbeacon_aautokrata_kingdoms_tt: "Must completely control at least #V 3#! [kingdoms|E]"
 form_bleakbeacon_aautokrata_kingdoms_effect_tt: "Every [kingdom|E] [title|E] you hold will become [de_jure|E] of the [GetTitleByKey('e_bleakbeacon_aautokrata').GetNameNoTier]"
 goans_embrace_the_plains_decision: "Embrace the Plains"
 goans_embrace_the_plains_decision_desc: "The mountains are lost, swallowed by the [fog|E] with the rest of the old world. Our people now till soil that lies flat to every horizon, and the young grow up never having tasted thin air. Perhaps it is time to stop mourning the mountains, and become a people of the plains in truth."
 goans_embrace_the_plains_decision_confirm: "Embrace the Plains"
 goans_embrace_the_plains_decision_tooltip: "Formally abandon the old ways of the heights, replacing Children of the Heights with Agrarian, and decide what becomes of our ancient isolation."
 goans_embrace_plains_settled_tt: "Your culture must chiefly dwell among [GetTerrain('plains').GetName], [GetTerrain('farmlands').GetName], or [GetTerrain('drylands').GetName]"
 goans_embrace_the_plains_effect_tt: "Your culture will abandon their mountain ways forever. Children of the Heights is replaced with Agrarian, and an event will let you decide the fate of Isolationist."