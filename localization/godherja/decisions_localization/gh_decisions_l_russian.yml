 winner_of_dahangon_religious_dahala.tt: "Поскольку вы исповедуете #V Дахалу#!, вы получаете #I следующие бонусы#!#T :#!"
 penetrate_into_the_tuleang_mountainous_area_decision.t: "Проникнуть в горы Тулеанга"
 penetrate_into_the_tuleang_mountainous_area_decision_desc: "К западу от Дахангона возвышаются суровые горы Тулеанга, где живёт народ, чьи обычаи и традиции резко отличаются от дахангонских. Эти горные племена происходят из далёкого [north_kharadan_biozone|El], а их загадочная и необычная магия часто внушает чужеземцам тревогу.\n\nТеперь наши войска установили власть над этим краем. Возможно, переселение сюда людей из других областей поможет закрепить наше господство."
 penetrate_into_the_tuleang_mountainous_area_decision_tooltip: "Углубиться в земли этих загадочных горных племён."
 penetrate_into_the_tuleang_mountainous_area_decision_confirm: "Заселить горы."
 restore_the_protectorate_of_lanonan_decision.t: "Восстановить Протекторат Ланонан"
 restore_the_protectorate_of_lanonan_decision_desc: "Наконец дым сражений рассеялся над равнинами реки Цан. Выдающееся предводительство персонажа [ROOT.GetCharacter.GetFirstNameNoTooltip] объединило ланонанов и возродило Протекторат Ланонан. Под его могучим знаменем мы устремимся к ещё более славному и благополучному будущему, а необъятные земли Южного моря ждут наших завоеваний. За Катун-Кай, за Драконьего императора — мы клянёмся возродить нашу славу!"
 restore_the_protectorate_of_lanonan_decision_tooltip: "Первый шаг к восстановлению порядка."
 restore_the_protectorate_of_lanonan_decision_confirm: "Провозгласить возрождение."
 restore_the_protectorate_of_lanonan_decision.tt: "Каждый [vassal|E] [culture|El] наследия «[GetCulturePillar('heritage_easterner').GetName]»"
 give_cangriver_region_modifier.tt: "Каждое [county|E] в [region|El] [GetGeographicalRegion('world_ga_cangriver_formable').GetName]"
 threatened_by_lanonan.tt: "Королевство Миат Шрунфан начнёт #N расширять#! свои @skill_martial_i!#V вооружённые силы#!"
 building_settlements_in_rovarska_decision.t: "Возвести крепость в Роварске"
 building_settlements_in_rovarska_decision_desc: "Местные города-государства [rovarska_biozone|El] и [Concept('bureau_bronzeport','Бронзовая гавань')|E] издавна соперничали в торговле. Несмотря на внутренние распри, города неизменно объединялись, стоило Бронзовой гавани попытаться вмешаться в их дела, и тем самым успешно сдерживали наше влияние в Роварске.\n\nНо [frodbrokna|E] нарушила равновесие сил в Южном море. На всём архипелаге временно образовался вакуум власти, и теперь настал подходящий момент для расширения торговой сети Бронзовой гавани."
 building_settlements_in_rovarska_decision_tooltip: "Расширить наше влияние"
 building_settlements_in_rovarska_decision_confirm: "Возвести крепость"
 mobilize_troops_and_prepare_for_war_decision.t: "Мобилизовать войска и подготовиться к войне"
 mobilize_troops_and_prepare_for_war_decision_desc: "Над Ланонаном сгущаются тучи войны. Чтобы подготовиться к неизбежной борьбе с мятежниками, мы должны набрать новых воинов, обучить войска и собрать припасы. Когда будет сделано всё возможное, Ланонан одолеет любого врага."
 mobilize_troops_and_prepare_for_war_decision_tooltip: "Война, которая решит нашу судьбу."
 mobilize_troops_and_prepare_for_war_decision_confirm: "Подготовиться к войне."
 mobilize_troops_and_prepare_for_war_decision_tt: "Общая $MILITARY_STRENGTH$ должна составлять не менее [soldier_i] #V 8000#!"
 mobilize_troops_and_prepare_for_war.tt: "Каждый [knight|E]"
 shrunfan_kingdom_created_tt: "Необходимо создать [title|E] «[GetTitleByKey('k_miat_shrunfan').GetNameNoTier]»"
 issueg_rand_proclamation_against_rebels_decision.t: "Издать великую прокламацию против мятежников"
 issueg_rand_proclamation_against_rebels_decision_desc: "Теперь, когда припасов вдоволь, а государство находится в безопасности, пришло время воодушевить войска, издать прокламацию и поклясться выступить на юг, чтобы вернуть потерянные земли Ланонана. Об этом мечтают многие тысячи ланонанских юношей, и к этой цели мы стремимся."
 issueg_rand_proclamation_against_rebels_decision_tooltip: "Время пришло."
 issueg_rand_proclamation_against_rebels_decision_confirm: "Издать великую прокламацию!"
 dispatch_xin_xue_propagandists_to_overseas_decision.t: "Отправить проповедников Синь Сюэ за море"
 dispatch_xin_xue_propagandists_to_overseas_decision_desc: "Учёные-чиновники обычно считают Синь Сюэ чудовищной угрозой, называют сторонников благоденствия простого народа мятежниками и безжалостно преследуют их. Поэтому Синь Сюэ трудно распространяться открыто. Но эти глупые и закоснелые люди не способны постичь истинную суть Синь Сюэ и бездумно отвергают её последователей как чернь — и в этом наша возможность. Представив идеи Синь Сюэ под видом иных «благонадёжных конфессий», мы сможем избежать надзора правителей Цзю Сюэ и укрепить наше дело."
 dispatch_xin_xue_propagandists_to_overseas_decision_tooltip: "Распространить наши идеи."
 dispatch_xin_xue_propagandists_to_overseas_decision_confirm: "Расти в тени."
 dispatch_xin_xue_propagandists_to_overseas_decision_1.tt: "Наша маскировка удалась"
 dispatch_xin_xue_propagandists_to_overseas_decision_2.tt: "Маскировка раскрыта"
 founding_of_the_tongkang_society_decision.t: "Основать общество Тонкан"
 founding_of_the_tongkang_society_decision_desc: "Благодаря неустанным усилиям Синь Сюэ заняла господствующее положение в [Concept('bureau_bronzeport','Бронзовой гавани')|E]. Её новаторские идеи получили широкое признание среди простых лакунгов, а сторонники Синь Сюэ теперь есть в каждом уголке республики. Наше влияние в Южном море стало столь велико, что нам больше незачем действовать в тени. Создание открытой организации Синь Сюэ значительно приблизит нас к цели."
 founding_of_the_tongkang_society_decision_confirm: "Великая победа Синь Сюэ!"
 founding_of_the_tongkang_society_decision_tooltip: "Влияние Синь Сюэ в Южном море стало сильнее."
 founding_of_the_tongkang_society_decision_tt: "Не менее 50% [counties|El] вашей [realm|El] исповедуют конфессию «[GetFaithByKey('xin_xue').GetName]»."
 founding_of_the_tongkang_society_decision.tt: "Каждое [county|E] #V Кай-цзяо#! в [region|El] [GetGeographicalRegion('world_ga_southsea_formable').GetName] с некоторой вероятностью обратится в [faith|El] #V Синь Сюэ#!."
 spread_the_xin_xue_faith_desc: "Синь Сюэ распространяется"
 founding_of_the_tongkang_society_decision_1.tt: "Каждый [ruler|E] конфессии #V Синь Сюэ#!"
 founding_of_the_tongkang_society_desc: "Основано общество Тонкан"
 recruit_compatriots_into_the_assault_rifle_corps_decision.t: "Набрать гожэней"
 recruit_compatriots_into_the_assault_rifle_corps_decision_desc: "Используя недавно завезённый из Катун-Кая взрывчатый порох и создав особые отряды из преданных последователей, я смогу получить подавляющее преимущество над врагами."
 recruit_compatriots_into_the_assault_rifle_corps_decision_tooltip: "Объявить открытый набор в войско."
 recruit_compatriots_into_the_assault_rifle_corps_decision_confirm: "Передовая армия."
 develop_local_areas_desc: "Развито графство этой культуры"
 chinlin_rule_recognized_desc: "Признана власть империи Циньлинь" 
 decrease_operational_efficiency_5.tt: "Снизить оперативную эффективность на #V пять#!"
 decrease_operational_efficiency_8.tt: "Снизить оперативную эффективность на #V восемь#!"
 decrease_operational_efficiency_10.tt: "Снизить оперативную эффективность на #V десять#!"
 decrease_operational_efficiency_15.tt: "Снизить оперативную эффективность на #V пятнадцать#!"
