 unite_the_eastern_coast.t: "Объединить Восточное Побережье"
 unite_the_eastern_coast_decision_desc: "Говорят, что когда-то великое [Concept('kingdom','королевство')|E] правило этими берегами. С нашим могуществом, не имеющим себе равных на восточных проходах, пришло время, чтобы кто-то снова правил ими."
 unite_the_eastern_coast_decision_tooltip: "Объединить Восточное [Concept('pirate_coast','Пиратское Побережье')|E]"
 unite_the_eastern_coast_decision_confirm: "Звезды направят нас"
 unite_the_eastern_coast_decision_tt: "Ваш основной титул [Concept('kingdom','королевства')|E] [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] интегрирует любое королевство, которое вы [Concept('completely_control','полностью контролируете')|E] в [GetGeographicalRegion('nightcoast_biozone').GetName], кроме $k_ufaliracci$."
 take_control_of_spice_trade.t: "Установить контроль над торговлей пряностями"
 take_control_of_spice_trade_decision_desc: "Огромные богатства торговли пряностями [Concept('pirate_coast','Пиратского Побережья')|E] многих приводили в отчаяние, но теперь они наконец-то в пределах нашей досягаемости."
 take_control_of_spice_trade_decision_tooltip: "Установить контроль над торговлей пряностями"
 take_control_of_spice_trade_decision_confirm: "Вкусить Кардамон"
 control_the_spice_tt: "У вас будет выбор [Concept('county','графства')|E] для строительства своего порта."
 controls_the_spice_trade_house_modifier: "Контролирует Роварсканскую Торговлю Пряностями"
 controls_the_spice_trade_house_modifier_desc: "Эта династия установила контроль над Торговлей Пряностями на [Concept('pirate_coast','Пиратском Побережье')|E]."
 flourishing_pirate_coast_trade_modifier_desc: "Это [Concept('county','графство')|E] переживает золотой век коммерции и меркантилизма."
 flourishing_pirate_coast_trade_modifier: "Процветающая торговля"
 reformed_ufaliracci_modifier: "Реформированное Уфалираччи"
 reformed_ufaliracci_modifier_desc: "Этот персонаж реформировал королевство [Concept('ufaliracci','Уфалираччи')|E] в его старой [Concept('ritualism','ритуалистской')|E] столице."
 reform_ufaliracci_decision: "Реформировать Серебряное Королевство"
 reform_ufaliracci_decision_desc: "Прошли века после [Concept('siege_of_ufaliracci','Осады Уфалираччи')|E], но [Concept('silver_palace','Серебряный дворец')|E] снова возвышается над [Concept('pirate_coast','Пиратским Побережьем')|E]. Пришло время и его королевству сделать то же самое."
 reform_ufaliracci_decision_tooltip: "Реформировать Серебряное Королевство"
 reform_ufaliracci_decision_confirm: "Мы Поднимаемся Все Выше"
 reform_ufaliracci_duchy_tt: "Вы [Concept('hold','владеете')|E] и [Concept('completely_control','полностью контролируете')|E] любое [Concept('duchy','герцогство')|E], которое [Concept('de_jure','де-юре')|E] граничит с [GetTitleByKey('d_trinapaawa').GetName] и которое является частью [Concept('kingdom','королевства')|E] с более чем двумя [Concept('de_jure','де-юре')|E] [Concept('duchies','герцогствами')|E]"
 elevate_republic_administration_decision: "Реформировать республику"
 elevate_republic_administration_decision_desc: "Наши традиции подходили для управления жителями одного города, но теперь, когда мы правим многими городами, мы столкнулись с проблемами роста, многие теперь ставят под сомнение сами институты, на которых основана наша республика. Чтобы предотвратить скатывание в деспотизм, мы должны нормализовать наше управление этими территориями и формализовать должности и губернаторства."
 elevate_republic_administration_decision_tooltip: "Принять административный республиканский тип правления"
 elevate_republic_administration_decision_confirm: "Во имя государства!"
 must_control_majority_of_ayyar_decision_tt: "Вы контролируете более [SCOPE.ScriptValue('ascendancy_of_east_formable_percent_decimal_value')|0]% [GetGeographicalRegion('world_ws_ayyar').GetName] [Concept('region','региона')|E] (Текущий контроль: [SCOPE.ScriptValue('current_controlled_ascendancy_of_east_decision_region_owned_percent_value')|0]%)"
 establish_legitimacy_over_kinilam_decision: "Установить легитимность над Кинилам"
 establish_legitimacy_over_kinilam_decision_desc: "Слишком долго мы правили лишь как регенты трона. Пришло время установить себя в качестве его законных правителей и сбросить придворные требования регентства."
 establish_legitimacy_over_kinilam_decision_tooltip: "Раз и навсегда вытеснить Регентство Кинилама."
 establish_legitimacy_over_kinilam_decision_confirm: "В новую эпоху!"
 ####################
 # STORYLINE - COIS #
 conclave_faction_power_below_200: "Влияние фракции Конклава ниже 200%"
 abolish_the_conclave_decision: "Упразднить Конклав"
 abolish_the_conclave_decision_tooltip: "Пришло время моим бывшим похитителям заплатить по счетам"
 rhesus_defeated: "Резус мертв или свергнут"
 conclave_faction_power_below_50: "Влияние фракции Конклава ниже 50%"
 abolish_the_conclave_decision_tt: "Все земли и золото Конклава будут конфискованы. Вы вернетесь к основной [Concept('aversaria','аверсарианской')|E] вере."
 abolish_the_conclave_decision_desc: "Интриги Конклава, возможно, случайно сделали возможным мое возвышение, но они не мои союзники и не будут определять мое правление. Пришло время положить конец этому фарсу."
 abolish_the_conclave_decision_confirm: "Сокрушить Наследие Резуса"
 sjalvolki_defectors_decision: "Пригласить перебежчиков сьяволки"
 sjalvolki_defectors_decision_tooltip: "В конце концов, враг моего врага - мой друг."
 sjalvolki_defectors_decision_tt: "Пять графств будут заселены поселенцами Сьяволки, восстанавливая местное население."
 sjalvolki_defectors_decision_increases_event_troops_tt: "Вы сможете выставить большее войско, когда Ценвар снова вторгнется."
 sjalvolki_defectors_decision_unpopular_tt: "#N Это будет непопулярно среди ваших подданных!#!"
 sjalvolki_defectors_decision_desc: "Как бы Ценвар ни хотел, чтобы мы верили в обратное, его Имперех далеко не застрахован от разделения. Несколько его вождей, вероятно, могут быть склонены присоединиться к нам в обмен на землю. Естественно, эта идея вызвала некоторое сопротивление."
 sjalvolki_defectors_decision_confirm: "Мы должны, если хотим выжить."
 #sjalvolki_defectors_decision: "Invite Sjalvolki Defectors"
 #sjalvolki_defectors_decision_tooltip: "The enemy of my enemy is my friend, after all."
 #sjalvolki_defectors_decision_tt: "Five counties will be settled by Sjalvolki settlers, restoring the local population"
 #sjalvolki_defectors_decision_increases_event_troops_tt: "You will be able to field a larger host when Cenware next invades"
 #sjalvolki_defectors_decision_unpopular_tt: "#N This will be unpopular with your subjects#!"
 #sjalvolki_defectors_decision_desc: "As much as Cenware would like us to believe otherwise, his Imperrech is far from immune to division. Several of his chieftains could likely be swayed to join us in exchange for land. Naturally, this idea has received some pushback."
 #sjalvolki_defectors_decision_confirm: "We must, if we are to survive"
 

 ask_conclave_for_help_decision: "Попросить помощи у Конклава"
 ask_conclave_for_help_decision_tooltip: "Возможно, нам придется отложить политические распри ради взаимного самосохранения."
 ask_conclave_for_help_decision_tt: "В течение следующих трех лет вы будете теснее сотрудничать с Конклавом для лучшей координации военных усилий."
 ask_conclave_for_help_decision_increases_concave_power_tt: "#N Это, вероятно, увеличит влияние Конклава!#!"
 ask_conclave_for_help_decision_conclave_immune_tt: "#N Конклав будет невосприимчив к враждебным проискам в течение следующих 3 лет!#!"
 ask_conclave_for_help_decision_desc: "Хотя мои интересы по своей сути противоречат интересам Конклава, и обе стороны остро это осознают, Ценваре представляет собой экзистенциальную угрозу для нас обоих - Резус, по крайней мере, достаточно умен, чтобы это понять. Я мог бы предложить временное перемирие до тех пор, пока мы не разберемся со сьяволками."
 ask_conclave_for_help_decision_confirm: "Предложить мир"
 move_against_conclave_decision: "Выступить против члена Конклава"
 move_against_conclave_decision_tooltip: "Мои враги не только за пределами государства, но и внутри него."
 move_against_conclave_decision_tt: "Я попытаюсь добиться падения одного из членов Конклава."
 move_against_conclave_cooldown: "Это можно сделать только раз в 6 месяцев."
 move_against_conclave_decision_desc: "Конклав, кажется, незыблемо держит в руках бразды правления. Если я и, надеюсь, мои преемники когда-нибудь смогут править самостоятельно, мне нужно будет взять эту группу интриганов под контроль.\n\nХотя прямое выступление против них всех было бы безрассудством, которое наверняка стоило бы мне головы, я могу попытаться устранять их членов одного за другим."
 move_against_conclave_decision_confirm: "Созвать моих сторонников."
 conclave_no_councillors: "В вашем совете нет членов Конклава, за исключением самого Резуса."
 defeat_rhesus_decision: "Падение Кукловода"
 defeat_rhesus_decision_tooltip: "На троне может сидеть только один, и я, и Резус стремимся к нему."
 defeat_rhesus_decision_tt: "Вы решите судьбу своего наставника, бывшего похитителя и соперника."
 defeat_rhesus_decision_desc: "Резус — политик и интриган, не имеющий себе равных. Насколько грозен Ценваре на поле боя, настолько же силен Резус в залах власти. И подобно Верховному Королю Сьяволков, его не победить в одной битве, и битва будет действительно напряженной."
 defeat_rhesus_decision_confirm: "Провести последнюю встречу."
 #defeat_rhesus_decision: "The Puppetmaster's Fall"
 #defeat_rhesus_decision_tooltip: "Only one can sit the throne, and both me and Rhesus have it in our sights"
 #defeat_rhesus_decision_tt: "You will decide the fate of your mentor, former captor and rival"
 #defeat_rhesus_decision_desc: "Rhesus is a politician and schemer without equal. As formidable as Cenware is on the field of battle, so is Rhesus in the halls of power. And like the High King of the Sjalvolki, he will not be beaten in one fight, and the fight will be intense indeed."
 #defeat_rhesus_decision_confirm: "Have your final meeting"
 
 lessons_of_cenware_decision: "Уроки Ценвара"
 lessons_of_cenware_decision_tooltip: "Мое столкновение с королем варваров преподало мне немало уроков."
 lessons_of_cenware_decision_desc: "Ценвар повсеместно считался величайшим воином и тактиком новейшей истории, человеком, не имеющим себе равных на поле боя.\n\nДо тех пор, пока наши пути не пересеклись.\n\nТеперь мир смотрит на меня в шоке, ибо орды Ценвара лежат поверженные острием моего меча, [Concept('aversaria','Аверсария')|E] спасена моей рукой. Я вошел в ряды величайших военных стратегов всех времен."
 lessons_of_cenware_decision_confirm: "Принять свою новую репутацию."
 #lessons_of_cenware_decision: "Lessons of Cenware"
 #lessons_of_cenware_decision_tooltip: "My clash with the barbarian High King has taught me more than a few lessons"
 #lessons_of_cenware_decision_desc: "Cenware was widely considered the greatest warrior and tactician of recent memory, and a man without equal on the field of battle.\n\nUntil we crossed paths.\n\nNow, the world looks upon me, shocked, as Cenware's hordes lie shattered at the tip of my sword, [aversaria|E] saved by my hand. I have entered the ranks of the greatest military masterminds of all time."
 #lessons_of_cenware_decision_confirm: "Embrace my new Reputation"
 purge_conclave_decision: "Зачистка Конклава"
 purge_conclave_decision_tooltip: "Время тонкой политики закончилось."
 purge_conclave_decision_tt: "Вы проведете масштабную чистку против всех нынешних и бывших членов фракции Конклава, уничтожив ее навсегда. Очевидно, это кровопролитие будет воспринято как чрезвычайная тирания."
 conclave_faction_power_below_100: "Влияние фракции Конклава ниже 100%."
 purge_conclave_decision_desc: "Падение Резуса близко, но и кинжалы его приспешников у моей спины тоже. Если я — лучшая надежда [Concept('aversaria','Аверсарии')|E], я не могу позволить мелкой придворной политике поглотить мое внимание.\n\nНеобходимо принять решительные меры."
 purge_conclave_decision_confirm: "Начать приготовления..."
 invite_legio_axiaothea_decision: "Связаться с Легионом XXI"
 invite_legio_axiaothea_decision_tooltip: "Невероятный союзник, но возможный."
 invite_legio_axiaothea_decision_tt: "Легиону XXI 'Аксиотея' будет передано одно из ваших графств, и он окажет вам значительную поддержку в предстоящей войне."
 invite_legio_axiaothea_decision_desc: "[Concept('aversaria','Имперские')|E] легионы, мягко говоря, лежат в руинах. Лишь два из них сохраняют хоть какую-то боеспособность: Анотерион находится слишком далеко на востоке, чтобы помочь, а слепая верность Аксиотеи мёртвому делу сделает любые переговоры напряжёнными.\n\nОднако сам Крушитель Мира теперь окружён со всех сторон моими союзниками. Если я пошлю им его голову, быть может, они присоединятся ко мне?"
 invite_legio_axiaothea_decision_confirm: "Отправить голову Эшрея на юг."
 defeated_cenware: "Вы побеждали Ценваре хотя бы один раз."
 aeschraes_killed: "Эшрей был убит моими руками."
 
 new_iyrossi_capital_decision: "Построить новую столицу Ийросси"
 new_iyrossi_capital_decision_tooltip: "Новая столица для новой эры."
 new_iyrossi_capital_decision_tt: "Ваша столица будет преобразована в метрополию дворца или храма по вашему выбору и получит особое здание. На это потребуется год работы."
 new_iyrossi_capital_decision_desc: "Наконец ийросси свободны от [Concept('aversaria','аверсарианского')|E] ига. Увы, значительная часть нашей истории осквернена их руками. Наша древняя столица То Педитипси превратилась в необитаемую пустошь — скорее насмешливый памятник имперскому высокомерию, чем подходящее основание для центра нового государства, — а Палат-то-Митидон по понятным причинам не годится. Как бы ни было дорого нам прошлое, мы должны основать новую столицу, откуда будем править прекрасным Митидоном. Учтите: расходы будут велики, а строительство займёт целый год."
 new_iyrossi_capital_decision_confirm: "Начать строительство новой столицы."

 new_mountain_home_decision: "Новый горный дом"
 new_mountain_home_decision_tooltip: "Объявить новую родину для своего народа."
 new_mountain_home_decision_tt: "Ваше столичное графство является столицей одного из следующих герцогств:"
 new_mountain_home_decision_desc: "Наша старая родина, расположенная среди высочайших пиков, теперь потеряна для нас навсегда. Так долго мы скитались по незнакомым землям, отчаянно ища новый дом. Этому приходит конец сегодня!\n\nМы нашли подходящее место, и гоанцы уже начали собираться. Здесь, в этом Новом Горном Доме, мы восстановим наше общество и, несомненно, будем стоять до конца времен."
 new_mountain_home_decision_confirm: "Провозгласить нашу новую родину."
 #new_mountain_home_decision: "A New Mountain Home"
 #new_mountain_home_decision_tooltip: "Announce a new homeland for your people"
 #new_mountain_home_decision_desc: "Our old homeland, nestled in the highest peaks, is now lost to us forever. For so long we have wandered in unfamiliar lands, searching desperately for a new home. That ends today!\n\nWe have found a suitable location, and already Goans have begun to gather. Here, in this New Mountain Home, we will rebuild our society, and surely stand until the end of time."
 #new_mountain_home_decision_confirm: "Proclaim our new homeland."


 arch_lich_consume_decision: "Распространить нежить"
 arch_lich_consume_decision_desc: "Земли живых кишат душами, готовыми к жатве; и я их пожну."
 arch_lich_consume_decision_tooltip: "Пожинать живых, распространять нежить."
 arch_lich_consume_decision_confirm: "Очистить землю!"

 fogeater_consume_decision: "Поглотить"
 fogeater_consume_decision_desc: "Новые земли не слушатели не хорошо Туманная Мать говорит поглотить их да питаться ими они присоединятся к туману присоединятся к нам нужна еда нужна да Туманная Мать приказывает мы повинуемся мы слушаем мы слушатели мы питаемся ими мы распространяемся мы поглощаем они присоединятся к нам они будут нами мы будем ими все будут ими все будут нами мы будем расти мы будем питаться мы будем расширяться мы должны мы должны мы питаемся."
 fogeater_consume_decision_tooltip: "Мы очистим наши земли."
 fogeater_consume_decision_confirm: "Съесть их."
 fogeater_consume_effect.army: "Создать армию пропорционально числу поглощенных провинций."
 fogeater_consume_effect.execute: "Убить всех пленных не-Тумаников."
 fogeater_consume_effect.convert: "Искоренить всех не-Тумаников в поглощенных провинциях."
 fogeater_consume_effect.devastate: "Удалить все развитие из провинций не-Тумаников."

 kingdom_of_the_clouds_decision: "Царство в Облаках"
 kingdom_of_the_clouds_decision_tooltip: "Создайте новую родину для [GetPlayer.GetCulture.GetCollectiveNoun]"
