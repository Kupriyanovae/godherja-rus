 restore_malcois_decision: "Восстановить Малкоис"
 restore_malcois_decision_desc: "Рабы, вероломные марчеры и хищные сьяволки изо всех сил пытались отнять у нас Малкоис, но их успехи оказались лишь временными неудачами для нас. С восстановлением твердой аверсарианской власти в этом Палате до Митидона наш авторитет больше не будет оспорен."
