 claim_the_isles_decision: "Заявить права на Острова"
 claim_the_isles_decision_desc: "[Concept('shatteredisles','Расколотые Острова')|E] простираются по Морю Империй, словно зазубренные осколки целого. Пришло время собрать осколки воедино."
