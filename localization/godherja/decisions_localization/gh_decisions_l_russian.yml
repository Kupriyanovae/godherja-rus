 raze_sophocos_decision_desc: "Башня [GetBuilding('01_sophocos').GetName] стояла неисчислимые тысячелетия, привлекая паломников и путешественников со всего [Concept('aeras','Аэраса')|E]. Она наверняка полна сокровищ, готовых к нашему захвату."
