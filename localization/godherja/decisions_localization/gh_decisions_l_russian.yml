 vassals_become_magocratic: "$vassals_become_administrative$"
 powerful_vassals_become_magocratic: "$powerful_vassals_become_administrative$"
 vassals_who_may_switch_to_magocratic: "Кроме того, у всех вассалов-[magi|E], положительно к вам относящихся, появляется шанс принять [Concept('magocracy','магократическую')|E] или [magocratic_republic|El] форму [government|E]."
