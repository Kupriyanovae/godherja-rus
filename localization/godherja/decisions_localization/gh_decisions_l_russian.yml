 invite_rogues_decision_desc: "Будучи пиратом, я не могу позволить себе быть слишком привередливым в выборе компании. Мне нужны способные бойцы и лейтенанты, и если я распространяю свое послание по дальним и ближним портам, многие наверняка стекутся в мою флотилию."
 loot_tabik_betemisit: "Разграбить Табик Бетемисит"
 loot_tabik_betemisit_desc: "Моговаи долго ждали в своих позолоченных залах, молясь о возвращении своего мертвого бога. И ничто лучше не символизирует их темную цель, чем [GetBuilding('01_tabik_betemisit').GetName], Пустой Дворец, предназначенный для размещения их 'Всевышнего' после Его возвращения из могилы. Такой памятник Узника в Капюшоне недопустим, ибо мы знаем правду. Бог мертв, и наш долг - обеспечить, чтобы Он оставался таковым. Кроме того, такая инкрустированная драгоценностями структура наверняка обеспечит нас средствами, на которые мы сможем продолжить нашу борьбу со злом."
 loot_tabik_betemisit_tooltip: "Преобразовать древний памятник"
 loot_tabik_betemisit_confirm: "Он никогда не вернется!"
 train_falcons_decision: "Заняться соколиной охотой"
 train_falcons_desc: "Соколиная охота — древнее искусство, овладение которым занимает годы и перемежается периодами восторга и разочарования. Однако сокол станет отличным компаньоном в моих охотничьих начинаниях."
 train_falcons_tooltip: "Вы заведете сокола и будете обучать его в течение нескольких месяцев."
 train_falcons_decision_confirm: "Время взлететь."
 gh_abdicate_decision: "Отречься от престола"
 gh_abdicate_decision_desc: "По мере того как я приближаюсь к закату своих лет, возможно, пришло время задуматься о моем[SelectLocalization(GetPlayer.HasTrait(GetTrait('arrogant').Self), ' славном ', ' ')] правлении - и его возможном конце. Передача власти моему преемнику и принятие роли уважаемого [GetTrait('gh_alatan').GetName(GetNullCharacter)] было бы почетным поступком, но от атрибутов власти не всегда легко отказаться..."
 gh_abdicate_decision_tooltip: "Сложить бремя власти и почетно отречься от престола"
 gh_abdicate_decision_confirm: "Время уйти на покой"

 gh_magocratic_reformation_decision: "Магократическая реформация"
 gh_magocratic_reformation_decision_desc: "[Concept( 'magi', 'Маги' )|E] всегда были одними из самых мудрых и почитаемых членов нашего общества, и мое государство постепенно пришло к такому состоянию, когда его правящая элита почти полностью состоит из практиков. Следовательно, это во многом лишь вопрос формальности - положить ручку на бумагу и официально кодифицировать магические способности как юридическое условие для удержания власти."
 gh_magocratic_reformation_decision_tooltip: "К более великому и просвещённому правлению!"
 gh_magocratic_reformation_decision_confirm: "Издать эдикт"
 all_powerful_vassals_magi_arcanists_or_sorcerous_tt: "Все [powerful_vassals|E] должны быть [magi|E], иметь [education|E] в области [arcana|E] или принадлежать к [culture|El] с [ethos|El] $ethos_sorcerous_name$."
 duke_tier_tt: "Вы — [duke|E] или выше"
