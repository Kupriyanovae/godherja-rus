 #restore_aironoi_decision_tooltip: "#E Aironoi's#! de jure hierarchy will be restored."
 restore_gurdurbok_decision: "Восстановить Черные Горы"
 restore_gurdurbok_decision_desc: "Хотя некогда провинцию [GetTitleByKey('e_black_mountains').GetNameNoTier] отрезал от [Concept('aversaria','Аверсарии')|E] Ценвар, теперь она возвращена под нашу праведную власть — от шевальенской границы до [Concept('mayikrata','Майикратии')|E]. В Детиклосе уже начинаются восстановительные работы, и весь мир узнает, что [Concept('aversaria','Аверсария')|E] никогда не позволит вновь расчленить свои земли."
 restore_gurdurbok_decision_confirm: "Перекроить старые границы Мауррхоса"
 restore_gurdurbok_decision_tooltip: "Старые [Concept('aversaria','аверсарианские')|E] де-юре королевства титула «[GetTitleByKey('e_black_mountains').GetNameNoTier]» будут восстановлены вместо мелких сьялволькских королевств, созданных после завоевания Ценвара."
 restore_gurdurbok_requirement: "Все не охваченные туманом герцогства со сменившимися де-юре сюзеренами в титуле «[GetTitleByKey('e_black_mountains').GetNameNoTier]» находятся под нашей властью."
 must_control_majority_of_gurdurbok_decision_tt: "Вы контролируете более [SCOPE.ScriptValue('aversaria_formable_percent_value')|0]% [region|El] [GetGeographicalRegion('governate_aversarian_black_mountains').GetName] (сейчас: [SCOPE.ScriptValue('current_controlled_gurdurbok_decision_region_owned_percent_value')|0]%)"
 #restore_gurdurbok_decision_tooltip: "#E Maaurrhos'#! de jure hierarchy will be restored."
 kikarsagi_kill_aversarians_decision: "Истребить аверсарианцев"
 kikarsagi_kill_aversarians_decision_desc: "[Concept('aversaria','Аверсарианцы')|E] показали себя слабыми, а слабых бьют. Лишенные Мандата Чистоты и презренные в глазах Чистейшего, мы должны истребить их слабую расу, чтобы стать Избранными и спасти империю. Никакой пощады слабым! Ни шагу назад сильным!"
 kikarsagi_kill_aversarians_decision_confirm: "Сегодня мы станем Избранными!"
 kikarsagi_kill_aversarians_decision_tooltip: "Истребите [Concept('aversaria','аверсарианцев')|E] и станьте [Select_CString(ROOT.Char.IsFemale, 'Избранной', 'Избранным' )]."
 bonefinding_decision: "Поиск магически сильных костей"
 bonefinding_decision_desc: "Чтобы усилить свою Мертвую магию, было бы полезно заполучить кости могущественных магов. Я попытаюсь найти кости, достаточно магически сильные, чтобы служить моим целям."
 bonefinding_decision_tooltip: "Вам будет предложен выбор способа поиска магически сильных костей."
 bonefinding_decision_effect_tooltip: "Вы будете искать кости могущественных магов."
 bonefinding_decision_confirm: "Начать поиски!"
 bonefinding_decision_desc_tooltip: "Вы будете искать магически сильные кости."
 craft_bone_artifact_decision: "Создать костяной артефакт"
 craft_bone_artifact_decision_desc: "Чтобы усилить свою [Concept('dead_magic','Мертвую магию')|E], я создам из магически сильных костей могущественный [Concept('artifact','артефакт')|E]."
 craft_bone_artifact_decision_tooltip: "Чтобы создать костяной [Concept('artifact','артефакт')|E], вам понадобятся магически сильные кости, найденные с помощью решения 'Поиск Магически Сильных Костей'."
 craft_bone_artifact_decision_effect_tooltip: "Вы попытаетесь создать [Concept('artifact','артефакт')|E] из ваших магических костей."
 craft_bone_artifact_decision_confirm: "Я создам магический шедевр!"
 reforge_aversarian_crown_decision: "Перековать Аверсарианскую Корону"
 reforge_aversarian_crown_decision_desc: "В минувшие века разные части [Concept('aversaria','Аверсарианской')|E] короны были расхищены, проданы или украдены гнусными людьми по всему Расколотому побережью. Теперь, когда все части у меня, я могу перековать корону и предъявить права на [Concept('aversaria','Аверсарию')|E]."
 reforge_aversarian_crown_valid_condition: "Все пять частей Аверсарианской Короны находятся в вашем владении."
 reforge_aversarian_crown_decision_effect: "Все части Аверсарианской Короны уничтожены."
