 # STORYLINE - COIS #
 break_strings_decision: "Разорвать мои Нити"
 break_strings_decision_tooltip: "Я уже не так послушен, как раньше"
 break_strings_decision_desc: "Хотя я все еще далек от полного контроля над своим владением, я больше не марионетка, танцующая под дудку своего хозяина."
 break_strings_decision_confirm: "Взять судьбу в свои руки"
 recruit_wayfather_decision: "Нанять наставника Пути"
 recruit_wayfather_decision_tooltip: "Ваши слуги предложат несколько подходящих кандидатов на должность наставника Пути, который будет служить нашим придворным капелланом."
 recruit_wayfather_decision_tt: "Мы сможем нанять наставника Пути, который будет служить нашим придворным капелланом."
 recruit_wayfather_decision_desc: "В нашей вере каждый из нас посвящен избранному Жизненному Пути, а наставники Пути служат нашими проводниками на пути к самосовершенствованию. Каждый двор был бы духовно потерян без должного Отца Пути или Матери Пути."
 recruit_wayfather_decision_confirm: "Отправить гонца"
 search_for_notable_decision: "Найти выдающуюся личность"
 search_for_notable_decision_tooltip: "Найти образованного простолюдина вашей культуры и религии, чтобы заполнить любую нужную вам роль."
 search_for_notable_decision_desc: "Я соберу лучших искателей талантов в королевстве и поручу им найти способных простолюдинов для службы при моем дворе или для выполнения других ролей."
 search_for_notable_decision_confirm: "Послать за искателями талантов."
 reunite_boqqarut_decision: "Воссоединить Боккарут"
 reunite_boqqarut_decision_tooltip: "Вы провозгласите себя Боккаром воссоединенной Дамоты."
 reunite_boqqarut_valid_desc: "Вы владеете всей [GetGeographicalRegion('world_es_core_damota').GetName]"
 reunite_boqqarut_decision_desc: "Хотя [Concept('boqqarut_damotada','Баккарут Дамотада')|E] был разрушен в огне [Concept('etami_tetenik','Этами Тетеник')|E], а мелкие военачальники вырезали из его трупа собственные королевства, он снова восстанет. Там, где когда-то царили хаос и разрушение, воцарятся порядок и процветание, и вся Дамота будет купаться в нашей славе и великолепии. Нам нужно лишь сделать провозглашение."
 reunite_boqqarut_decision_effects: "Вас будут знать как восстановителя Дамоты."
 reunite_boqqarut_decision_confirm: "Дамота возрождается!"
 integrate_gisreddes_decision: "Интегрировать Гисредд"
 integrate_gisreddes_decision_desc: "Веками [Concept('peti_gisredde','Пети Гисредд')|E] и его кузен [Concept('grande_gisredde','Гранд Гисредд')|E] были аномалией внутри Шевалье, всегда сопротивляясь власти Верховного Короля. Теперь мы наконец можем покончить с юридическим абсурдом, известным как [Concept('gisreddepact','Гисреддский пакт')|E], и формально подчинить города и [Concept('council_of_gisredde','Совет Гисредда')|E] нашему правлению."
 integrate_gisreddes_control_timer_no: "Вы должны непрерывно контролировать оба Гисреддеса в течение 80 лет (до [GetCurrentDateWithDiff( GetVarTimeRemaining( TITLE.MakeScope, 'integrate_gisreddes_timer') )])."
 integrate_gisreddes_control_timer_yes: "Вы должны непрерывно контролировать $c_peti_gisredde$ и $c_grande_gisredde$ в течение 80 лет."
 integrate_gisreddes_decision_complete_desc: "Гисредд де-юре интегрируются в Шевалье и больше не будут создавать беспорядков."
 integrate_gisreddes_decision_confirm: "[Concept('gisreddepact','Гисреддского пакта')|E] больше нет!"
 gisreddi: "Гисреддеанский"
 adopt_pirate_ways: "Принять пиратский образ жизни"
 adopt_pirate_ways_desc: "Будь то из-за бедности вашего королевства, жажды приключений или просто из-за простой жадности, наступает время, когда каждый правитель задумывается о пиратстве."
 adopt_pirate_ways_confirm: "Поднять якорь!"
 adopt_pirate_ways_tooltip: "Вы откажетесь от своих старых путей и превратите свое королевство в [Concept('pirate','пиратскую')|E] гавань!"
 adopt_pirate_ways_through_liege: "Принять пиратский образ жизни"
 adopt_pirate_ways_through_liege_desc: "Будь то из-за бедности вашего королевства, жажды приключений или просто из-за простой жадности, наступает время, когда каждый правитель задумывается о том, чтобы стать [Concept('pirate','пиратом')|E]."
 adopt_pirate_ways_through_liege_confirm: "Поднять якорь!"
 adopt_pirate_ways_through_liege_tooltip: "Вы откажетесь от своих старых путей и превратите свое королевство в [Concept('pirate','пиратскую')|E] гавань, подобную вашему сюзерену."
 avenge_ayule_expedition_decision: "Отомстить за [Concept('ayule_expedition','Экспедицию Аюле')|E]"
 avenge_ayule_expedition_decision_tooltip: "Вы провозгласите правление Дамоты над северными землями."
 avenge_ayule_expedition_decision_desc: "Давным-давно Аюле попытался завоевать прибыльные северные земли, что навсегда обеспечило бы торговлю Дамоты и поставило бы жизненно важную дорогу Гонан под нашу гегемонию. Хотя его попытка закончилась унизительным поражением, мы отомстили за поражение при Лаццане, и поля его поражения навечно станут нашими."
 avenge_ayule_expedition_decision_confirm: "Выше знамена!"
 declare_yourself_malaak: "Объявить себя Малааком"
 declare_yourself_malaak_tooltip: "Воля Охрасика течет через вас"
 declare_yourself_malaak_desc: "Уже много лет я следую воле Охрасика, раз за разом доказывая, что я праведное существо. Теперь, однако, пришло время официально связать свою волю с его и объявить себя Малааком."
 declare_yourself_malaak_confirm: "Пусть церемония начнется"
 declare_yourself_malaak.tt: "Титул главы веры не будет наследоваться при преемственности"
 declare_yourself_malaak_holy_sites: "Вы должны контролировать как минимум 3 [Concept('holy_sites', 'священных места')|E] Ахридар [CHARACTER.GetFaith.GetAdjective]"
 abandon_pirate_ways: "Оставить пиратство"
 #abandon_pirate_ways: "Stop being a pirate"
 abandon_pirate_ways_desc: "Пиратство больше не отвечает нашим нуждам. Пришло время снова вернуться к традиционному правлению."
 abandon_pirate_ways_confirm: "Ну, по крайней мере, награбленное останется при нас."
 abandon_pirate_ways_tooltip: "Вы откажетесь от своих [Concept('pirate','пиратских')|E] обычаев и станете [Concept( 'feudal', 'феодальным' )|E] правителем!"
 declare_yourself_the_pirate_king: "Объявить себя Королем Пиратов"
 declare_yourself_the_pirate_king_tooltip: "Стать королем пиратов"
 declare_yourself_the_pirate_king_desc: "Мои подвиги не имеют себе равных, а мои сундуки переполнены. Пришло время обессмертить мое имя."
 declare_yourself_the_pirate_king_confirm: "К славе и богатству!"
 invite_rogues_decision: "Пригласить разбойников"
 invite_rogues_decision_desc: "Будучи пиратом, я не могу позволить себе быть слишком привередливым в выборе компании. Мне нужны способные бойцы и лейтенанты, и если я распространяю свое послание по дальним и ближним портам, многие наверняка стекутся в мою флотилию."
 loot_tabik_betemisit: "Разграбить Табик Бетемисит"
 loot_tabik_betemisit_desc: "Моговаи долго ждали в своих позолоченных залах, молясь о возвращении своего мертвого бога. И ничто лучше не символизирует их темную цель, чем [GetBuilding('01_tabik_betemisit').GetName], Пустой Дворец, предназначенный для размещения их 'Всевышнего' после Его возвращения из могилы. Такой памятник Узника в Капюшоне недопустим, ибо мы знаем правду. Бог мертв, и наш долг - обеспечить, чтобы Он оставался таковым. Кроме того, такая инкрустированная драгоценностями структура наверняка обеспечит нас средствами, на которые мы сможем продолжить нашу борьбу со злом."
 loot_tabik_betemisit_tooltip: "Преобразовать древний памятник"
 loot_tabik_betemisit_confirm: "Он никогда не вернется!"
 train_falcons_decision: "Заняться соколиной охотой"
 train_falcons_desc: "Соколиная охота — древнее искусство, овладение которым занимает годы и перемежается периодами восторга и разочарования. Однако сокол станет отличным компаньоном в моих охотничьих начинаниях."
 train_falcons_tooltip: "Вы заведете сокола и будете обучать его в течение нескольких месяцев."
 train_falcons_decision_confirm: "Время взлететь."
 gh_abdicate_decision: "Отречься от престола"
 gh_abdicate_decision_desc: "По мере того как я приближаюсь к закату своих лет, возможно, пришло время задуматься о моем[SelectLocalization(GetPlayer.HasTrait(GetTrait('arrogant').Self), ' славном ', ' ')] правлении - и его возможном конце. Передача власти моему преемнику и принятие роли уважаемого [GetTrait('gh_alatan').GetName(GetNullCharacter)] было бы почетным поступком, но от атрибутов власти не всегда легко отказаться..."
