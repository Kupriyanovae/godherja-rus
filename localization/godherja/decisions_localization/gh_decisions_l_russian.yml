 #restore_aironoi_decision_tooltip: "#E Aironoi's#! de jure hierarchy will be restored."
 restore_gurdurbok_decision: "Восстановить Черные Горы"
 restore_gurdurbok_decision_desc: "Хотя некогда провинция [GetTitleByKey('e_gurdurbok').GetNameNoTier] была отрезана от [Concept( 'aversaria', 'Аверсарии' )|E] Ценваром, она была возвращена под наш праведный контроль, от шевальенской границы до [Concept( 'mayikrata', 'Майикратии' )|E]. В Детиклосе уже начинаются работы по восстановлению, и весь мир узнает, что [Concept( 'aversaria', 'Аверсария' )|E] никогда не позволит разделить свои территории."
 restore_gurdurbok_decision_confirm: "Перекроить старые границы Мауррхоса"
 restore_gurdurbok_decision_tooltip: "Старые [Concept('aversaria','аверсарианские')|E] де-юре королевства [GetTitleByKey('e_gurdurbok').GetNameNoTier] будут восстановлены вместо любых мелких королевств сьяволки, созданных после завоевания Ценвара."
