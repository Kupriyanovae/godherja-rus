 patronize_halite_temple_decision: "Поддержать Галитовый храм"
 patronize_halite_temple_decision_desc: "Галитовый храм когда-то был известным центром исследований и обучения, и он может снова им стать. Установив тесные связи с Храмом, я смогу использовать знания Хранителей Заката в своих интересах и обогатить свой народ на века вперед."
 patronize_halite_temple_decision_tooltip: "Спонсировать Галитовый храм и обогатить свою [Concept( 'culture', 'культуру' )|E] их знаниями"
 patronize_halite_temple_decision_confirm: "Спонсировать храм"
 patronize_halite_temple_decision_culture_head_tooltip: "Вы являетесь [Concept( 'culture_head', 'культурным идеологом' )|E] [GetPlayer.GetCulture.GetName] [Concept( 'culture', 'культуры' )|E]"
 patronize_halite_temple_decision_effect_mastery_tooltip: "[Concept( 'culture', 'Культура' )|E] [patron.GetCulture.GetName] увеличивает свое владение [Concept('magic_type','школой магии')|E] #V $wane_tender_harmoniarchy_name$#! на #V 1#!"
