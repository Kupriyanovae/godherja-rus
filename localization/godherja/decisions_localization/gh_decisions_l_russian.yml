 restore_etepezea_decision: "Восстановить Этепезею"
 restore_etepezea_decision_desc: "Падение Этепезеи стало трагедией для всех [Concept('aversaria','аверсарианцев')|E]. Кошмар безупречного города [GetTitleByKey('c_oraispol').GetNameNoTier], павшего под власть сьялволков, вырванное из наших рук бьющееся сердце [Glossary('Аавтократии','GH_AAUTOKRATA_GLOSS')] — это слишком мучительно вспоминать! Теперь всё осталось в прошлом, ибо исконная родина, которую сам Чистейший даровал нам, вновь в безопасности."
 restore_etepezea_decision_confirm: "Перекроить старые границы Этепезеи"
 restore_etepezea_decision_tooltip: "Старые [Concept('aversaria','аверсарианские')|E] де-юре королевства Этепезеи будут восстановлены вместо любых мелких королевств сьяволки, созданных после завоевания Ценвара."
 restore_etepezea_requirement: "Все не покрытые туманом герцогства с измененными де-юре сюзеренами в #E Этепезее#! контролируются нами."
 must_control_majority_of_etepezea_decision_tt: "Вы контролируете более [SCOPE.ScriptValue('aversaria_formable_percent_value')|0]% [region|El] [GetGeographicalRegion('governate_aversarian_etepezea').GetName] (сейчас: [SCOPE.ScriptValue('current_controlled_etepezea_decision_region_owned_percent_value')|0]%)"
 #restore_etepezea_decision_tooltip: "#E Etepezea's#! de jure hierarchy will be restored."
 restore_cornucopia_decision: "Восстановить Мегос Калатипсоми"
 restore_cornucopia_decision_desc: "Суровая красота Мегос Калатипсоми, некогда похищенная у нас дьявольским Ценваром, теперь снова наша, и прибыльная торговля уже течет в нашу империю через [GetBuilding('01_bastonport').GetName]. Предстоит еще много работы по восстановлению провинции, но как только мы восстановим внушительные горные крепости, мы сможем обезопасить наше сердце от будущих потенциальных завоевателей."
 restore_cornucopia_decision_confirm: "Перекроить старые границы Мегос Калатипсоми"
 restore_cornucopia_decision_tooltip: "Старые [Concept('aversaria','аверсарианские')|E] де-юре королевства Мегос Калатипсоми будут восстановлены вместо любых мелких королевств сьяволки, созданных после завоевания Ценваром."
 restore_cornucopia_requirement: "Все не покрытые туманом герцогства с измененными де-юре сюзеренами в #E Мегос Калатипсоми#! контролируются нами."
 must_control_majority_of_megos_kalathipsomi_decision_tt: "Вы контролируете более [SCOPE.ScriptValue('aversaria_formable_percent_value')|0]% [region|El] [GetGeographicalRegion('governate_aversarian_megos_kalathipsomi').GetName] (сейчас: [SCOPE.ScriptValue('current_controlled_megos_kalathipsomi_decision_region_owned_percent_value')|0]%)"
 #restore_cornucopia_decision_tooltip: "#E Megos Kalathipsomi's#! de jure hierarchy will be restored."
 restore_the_reach_decision: "Восстановить Микрос Калатипсоми"
 restore_the_reach_decision_desc: "Простая пограничная провинция Микрос Калатипсоми снова под нашим контролем. Долина реки Пафос будет иметь решающее значение для пропитания нашего медленно восстанавливающегося населения. Однако мы должны быть осторожны — марчеры всегда представляли угрозу, но еще больше беспокоят странные чудовища, которые каждый день выползают из надвигающегося Тумана."
 restore_the_reach_decision_confirm: "Перекроить старые границы Микрос Калатипсоми"
 restore_the_reach_decision_tooltip: "Старые [Concept('aversaria','аверсарианские')|E] де-юре королевства Микрос Калатипсоми будут восстановлены вместо любых мелких королевств сьяволки, созданных после завоевания Ценваром."
