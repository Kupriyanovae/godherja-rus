 become_pirate_emperor: "Объявить Империю на Пиратском Берегу"
 become_pirate_emperor_desc: "Никто не может противостоять мне и моему безграничному богатству. Пришло время увековечить себя в морях."
 become_pirate_emperor_tooltip: "Стать непревзойденным пиратом морей"
 become_pirate_emperor_confirm: "К небывалым легендам!"
 the_scarred_rise_up: "Шатранджая!"
 the_scarred_rise_up_desc: "Годами наши братья и сестры страдали от жестокого правления так называемых 'людей торговли'. Слишком долго нас использовали и оскорбляли, над нашим образом жизни насмехались, наши семьи разрывали на части. Мы - безмолвный шепот леса, стремительный поток густых джунглей, высшие хищники. Больше нет! Шрамованные поведут нас к славному будущему. Мы клянемся ему в своей решимости, шрамуя лица и обнажая грудь. Мы выбрали подходящее название для этого восстания: Шатранджая, или 'Полная Победа', ибо мы знаем, что победим или умрем, пытаясь."
 the_scarred_rise_up_tt: "Воины Танумарея сплачиваются вокруг вас. Называя себя Азаки Мард, или 'Воины Свободы', их единственная цель эхом отзывается в их сердцах: освобождение их родины от жестоких угнетателей."
 the_scarred_rise_up_tooltip: "Возьмите судьбу своего народа под свой контроль"
 the_scarred_rise_up_confirm: "Шрамованные поднимаются к свободе!"
 azaki_mard: "Азаки Мард"

 become_king_taykovi_decision: "Королевские амбиции?"
 belisarios_enemies_dead_desc: "Эшрей, Горасс и Маврикий должны быть мертвы и похоронены, прежде чем вы сможете об этом подумать."
