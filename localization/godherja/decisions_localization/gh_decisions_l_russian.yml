 penetrate_into_the_tuleang_mountainous_area_decision.t: "Penetrate into the Tuleang Mountainous Area"
 penetrate_into_the_tuleang_mountainous_area_decision_desc: "To the west of Dahangon lies the rugged terrain of the Tuleang Mountains, home to a community whose customs and traditions stand in stark contrast to the cultures of Dahangon. These mountain tribes originate from the distant [north_kharadan_biozone|E], and their enigmatic, unconventional magic often leaves outsiders feeling unsettled. \n\n Our forces have now established control over this region. Perhaps relocating settlers from elsewhere would help consolidate our governance in this area."
 penetrate_into_the_tuleang_mountainous_area_decision_tooltip: "Venture deep into these magical tribespeople."
 penetrate_into_the_tuleang_mountainous_area_decision_confirm: "Immigrant Mountain."
 restore_the_protectorate_of_lanonan_decision.t: "Restore the Command of Lanonan"
 restore_the_protectorate_of_lanonan_decision_desc: "Finally, as the smoke of battle cleared over the Cang River plains, the extraordinary leadership of [ROOT.GetCharacter.GetFirstNameNoTooltip] bound the Lanonan people together, restoring the Command of the Lanonan. Under the mighty banner of the Command, we shall march toward an even more glorious and prosperous future, with the vast realms of the South Sea awaiting Lanonan's conquest. For Kathun-Kai, for the Dragon Emperor, we swear to forge anew our glory!"
 restore_the_protectorate_of_lanonan_decision_tooltip: "The first step to restore order."
 restore_the_protectorate_of_lanonan_decision_confirm: "Proclaim the Renaissance."
 restore_the_protectorate_of_lanonan_decision.tt: "Every [GetCulturePillar('heritage_easterner').GetName][culture|E] [vassal|E]"
 give_cangriver_region_modifier.tt: "Every [county|E] in the [GetGeographicalRegion('world_ga_cangriver_formable').GetName] [region|E]"
 threatened_by_lanonan.tt: "The Kingdom of Míat Shrunfan will begin to #N expand#! its @skill_martial_i!#V conmilitary forces#!"
 building_settlements_in_rovarska_decision.t: "Build Stronghold in Rovarska"
 building_settlements_in_rovarska_decision_desc: "The indigenous city-states of the [rovarska_biozone|E] region and [Concept('bureau_bronzeport','Bronzeport')|E] have long been commercial rivals. Despite the internal conflicts among these city-states, they would always unite in resistance whenever Bronzeport attempted to intervene, effectively blocking our influence in Rovarska. \n\nHowever, the occurrence of [frodbrokna|E] has disrupted the stalemate in the South Sea. With a temporary power vacuum emerging across the entire archipelago, now is an opportune moment to expand Bronzeport's trade network."
 building_settlements_in_rovarska_decision_tooltip: "Expand our influence"
 building_settlements_in_rovarska_decision_confirm: "Build Stronghold"
 mobilize_troops_and_prepare_for_war_decision.t: "Mobilize Troops and Prepare for War"
 mobilize_troops_and_prepare_for_war_decision_desc: "The clouds of war loom over Lanonan. To prepare for the inevitable conflict against the rebels, we must recruit new soldiers, train the troops, and gather war supplies. Once we have done everything within our power, Lanonan shall triumph over any foe."
 mobilize_troops_and_prepare_for_war_decision_tooltip: "A War That Decides Our Fate."
 mobilize_troops_and_prepare_for_war_decision_confirm: "Prepare for War."
 mobilize_troops_and_prepare_for_war_decision_tt: "Must have a Total $MILITARY_STRENGTH$ of [soldier_i] #V 8000#! or more"
 mobilize_troops_and_prepare_for_war.tt: "Every [knight|E]"
 shrunfan_kingdom_created_tt: "Must have created the [title|E] of [GetTitleByKey('k_miat_shrunfan').GetNameNoTier]"
 issueg_rand_proclamation_against_rebels_decision.t: "Issue Grand Proclamation Against the Rebels"
 issueg_rand_proclamation_against_rebels_decision_desc: "Now that provisions are ample and the state is secure, it is time to inspire the troops, issue a proclamation, and pledge to march south to reclaim the lost lands of Lanonan. This is the collective aspiration of thousands upon thousands of Lanonan's youth and the goal for which we strive."
 issueg_rand_proclamation_against_rebels_decision_tooltip: "The time is ripe."
 issueg_rand_proclamation_against_rebels_decision_confirm: "Issue Grand Proclamation!"
 dispatch_xin_xue_propagandists_to_overseas_decision.t: "Dispatch Xin Xue propagandists to overseas"
 dispatch_xin_xue_propagandists_to_overseas_decision_desc: "The scholar-officials generally regard Xin Xue as a monstrous threat, labeling those who champion the welfare of the common people as rebels and ruthlessly suppressing them. As a result, Xin Xue struggles to spread openly. However, these foolish and rigid individuals fail to grasp the true essence of Xin Xue, simplistically dismissing its followers as mobs—an oversight that presents us with an opportunity. By packaging the ideas of Xin Xue within the guise of other 'compliant faiths', we may well evade the scrutiny of the Jiu Xue rulers and thereby strengthen our cause."
 dispatch_xin_xue_propagandists_to_overseas_decision_tooltip: "Spread our thoughts."
 dispatch_xin_xue_propagandists_to_overseas_decision_confirm: "Grow in the shadow."
 dispatch_xin_xue_propagandists_to_overseas_decision_1.tt: "Our disguise was quite successful"
 dispatch_xin_xue_propagandists_to_overseas_decision_2.tt: "The disguise has been discovered"
 founding_of_the_tongkang_society_decision.t: "Founding of the Tongkang Society"
 founding_of_the_tongkang_society_decision_desc: "Through unremitting efforts, Xin Xue has achieved a dominant position within the [Concept('bureau_bronzeport','Bronzeport')|E]. Its innovative ideas have been widely embraced and recognized by many ordinary people in Lakoeng, and supporters of Xin Xue now permeate every corner of the republic. Our influence in the southsea region has grown so strong that there is no longer any need to operate in the shadows as before. Establishing an open Xin Xue organization will greatly advance our cause."
 founding_of_the_tongkang_society_decision_confirm: "A great victory for Xin Xue!"
 founding_of_the_tongkang_society_decision_tooltip: "Xin Xue's power in Southsea has grown stronger."
 founding_of_the_tongkang_society_decision_tt: "At least 50% of [counties|E] in your [realm|E] are [GetFaithByKey('xin_xue').GetName]."
 founding_of_the_tongkang_society_decision.tt: "Every #V Kai-jiao#! [county|E] located in the [GetGeographicalRegion('world_ga_southsea_formable').GetName] [region|E] has a certain probability of converting to the #V Xin Xue#! [faith|E]."
 spread_the_xin_xue_faith_desc: "Xin Xue is spreading"
 founding_of_the_tongkang_society_decision_1.tt: "Every #V Xin Xue#! [ruler|E]"
 founding_of_the_tongkang_society_desc: "Founded the Tongkang Society"
 recruit_compatriots_into_the_assault_rifle_corps_decision.t: "Recruit Guoren"
 recruit_compatriots_into_the_assault_rifle_corps_decision_desc: "By harnessing the newly introduced explosive powder from Kathun-kai and forming dedicated soldiers from devoted followers, I can create overwhelming advantages against my enemies."
 recruit_compatriots_into_the_assault_rifle_corps_decision_tooltip: "Open Recruitment call to Arms."
 recruit_compatriots_into_the_assault_rifle_corps_decision_confirm: "An Advanced Army."
 develop_local_areas_desc: "Developed a county of this culture"
 chinlin_rule_recognized_desc: "The rule of chinlin Empire was recognized" 
