 renovate_palat_to_mytidon_decision: "Обновить Палат-то-Митидон"
 renovate_palat_to_mytidon_decision_tooltip: "Превратить это пятно на нашей земле в новую столицу."
 renovate_palat_to_mytidon_decision_tt: "Ваша столица будет преобразована в метрополию дворцового или храмового типа по вашему выбору и получит особое здание. На это потребуется год работы, а Палат-то-Митидон будет заменён новым зданием.\n\n#W Это решение будет означать фактический отказ от любых попыток построить новую столицу!#!"
 renovate_palat_to_mytidon_decision_desc: "Мы снова свободны и основали сильное новое королевство. Но остаётся важный вопрос: откуда мы будем править Митидоном? То Педитипси — населённые призраками руины, недостойные короля. Основание совершенно новой столицы может оказаться нам не по силам. К счастью, [Concept('aversaria','аверсарианцы')|E] оставили в наших землях административное здание, которое можно просто приспособить для наших нужд."
 hubarite_codex_decision: "Написать Кодекс"
 hubarite_codex_decision_desc: "Как и другие на протяжении истории нашего народа, я позабочусь о том, чтобы мое имя и мои обычаи жили вечно, написав свод законов для будущих поколений."
 hubarite_codex_decision_tooltip: "Вы напишете свод законов."
 hubarite_codex_decision_confirm: "Принесите мне перо!"
 create_filosi_school_decision: "Юридически Гармонизировать со Сьяволками"
 create_filosi_school_decision_desc: "У наших новых друзей и соседей Сьяволков есть правовая и религиозная традиция, уходящая корнями в глубь веков, и которую они, безусловно, считают равной по уважению и легитимности нашей собственной. Хотя мы, очевидно, не согласны, особенно в отношении поклонения их странному чужому Богу Охоты «Филосу», есть много принципов, которых они придерживаются и которые могут заслуживать дальнейшего рассмотрения."
 create_filosi_school_decision_confirm: "Создать Философскую Школу!"
 create_filosi_school_tt: "Создает новую Юридическую Школу для вашей Веры, называемую Философской Школой."
 create_filosi_school_decision_tooltip: "Создать Новую Юридическую Школу"
 hubarite_empire_decision: "Возвысить Губаритскую Империю"
 hubarite_empire_decision_desc: "Древнейшие предания нашей веры повествуют о временах, когда [Concept( 'magi', 'Маги' )|E]-судьи правили в золотой век процветания, когда обширные территории [Concept('sarradon','Саррадона')|E] и, возможно, даже части [Concept('the_continent','Континента')|E] находились под властью милостивых императоров, правивших вблизи самого Великого Солнца. Хотя народ этой империи так долго страдал под чередующимися сапогами [Concept('wardenism','Варденитов')|E] и [Concept('ritualism','Ритуалистов')|E], и хотя даже точные границы нашего древнего царства затерялись в тумане истории, оно наконец-то восстановлено."
 hubarite_empire_decision_valid_desc: "Вы полностью контролируете как минимум 3 королевства."
 hubarite_empire_decision_confirm: "Слава Великому Солнцу!"
 hubarite_empire_decision_tooltip: "Восстановить древнюю Губаритскую Империю."

 migrate_holy_sites_decision: "Утвердить [GetPlayer.GetFaith.GetAdjectiveNoTooltip]скую веру"
 migrate_holy_sites_decision_tooltip: "Создать новые [Concept('holy_sites', 'святыни')|E] вашей [Concept('faith', 'конфесии')|E] в выбранном вами [Concept('region', 'регионе')|E]"
 migrate_holy_sites_decision_desc: "Годы сменились десятилетиями, и лишь немногие помнят наши духовные корни. Когда наши родные земли и храмы пали перед [Concept('the_fog', 'Туманом')|E], мы смогли нести нашу веру только в своих сердцах — до этого дня. Я освящу новые храмы на этой чужбине, и поклонение [GetPlayer.GetFaith.HighGodName] будет жить вечно."
