 request_heir_from_the_pit_decision_confirm: "Отправить гонца"

 declare_rivarisian_kingdom_decision: "Объявить королевство для риваризианцев"
 declare_rivarisian_kingdom_decision_desc: "Слишком долго народ рек преследуют воюющие лорды, [Concept('clerical_control_of_chevalie','властолюбивые теократы')|E] и жадные торговцы. Хватит! Наш народ сформирует новое королевство и докажет, что мы равны всем другим детям [Concept('chevalie','Шевалье')|E]! Пусть они увидят богатства наших городов и гордость в наших сердцах, и навсегда склонятся перед нашими свободами!"
 declare_rivarisian_kingdom_decision_confirm: "Проложить новый путь для нашего народа!"
 declare_rivarisian_kingdom_decision_tooltip: "Угнетению речного народа придет конец!"

 gh_divine_mission_decision: "Воля Богов"
 gh_divine_mission_decision_desc: "Тьма сгущается, и козни моих темных владык все сильнее сжимают горло мира. В своем величии боги возложили на меня задачу — божественную миссию по распространению их воли в этом плане. Они капризны, и я должен поспешить исполнить свою клятвенную цель."
 gh_divine_mission_decision_tt: "Боги вступят с вами в общение после завершения миссии."
 gh_divine_mission_decision_tooltip: "Отслеживать прогресс назначенной миссии."
 gh_divine_mission_decision_confirm: "Воля Владык будет исполнена."

 # Dahangon
 gh_restore_bronzeport_bureaucracy_decision: "Восстановить Бюрократию Бронзового Порта"
 gh_restore_bronzeport_bureaucracy_decision_desc: "Высокие министры [Concept('bureau_bronzeport','Бронзового Порта')|E] всегда избирались купцами и чиновниками Бюро. Поступать иначе - прямое противоречие почтенной и благороднейшей хартии Полуавтономного Бюро Бронзового Порта, установленного Небесами."
 gh_restore_bronzeport_bureaucracy_decision_tooltip: "Восстанавливает правительство Бронзового Порта в республику."
 gh_restore_bronzeport_bureaucracy_decision_confirm: "Бронзовый Порт снова будет принадлежать народу!"

 restored_bronzeport_modifier: "Восстановленная Бюрократия Бронзового Порта"
 restored_bronzeport_modifier_desc: "Восстановление бюрократии Бронзового Порта привело к временному росту торговли."
 bronzeport_restorer_modifier: "Восстановитель Бюро"
 bronzeport_restorer_modifier_desc: "Этот персонаж восстановил бюрократию Бронзового Порта, заслужив любовь своих республиканских вассалов."

 establish_southsea_protectorate.t: "Учредить Протекторат Южного Моря"
 establish_southsea_protectorate_decision_desc: "Южные моря Дахангона уже давно находятся вне досягаемости Империи. Больше нет."
 establish_southsea_protectorate_decision_tooltip: "Учредить новый Протекторат в южных морях."
 establish_southsea_protectorate_decision_confirm: "Моря - Наши для Правления!"

 gh_kedari_magocracy.t: "Созвать Обряд Знамений"
 gh_kedari_magocracy_decision_desc: "Слишком долго лучшие из нас стояли в одиночестве в тени. Настало время собраться, чтобы отыскать великие знамения, утраченные нашим народом."
 gh_kedari_magocracy_decision_tooltip: "Изменить ваше правительство на магократию."
 gh_kedari_magocracy_decision_confirm: "К новой эре магии!"

 reclaim_naklans_legacy.t: "Вернуть Наследие Наклана"
 reclaim_naklans_legacy_decision_desc: "Величайшие из наших вождей часто заявляли, что являются реинкарнациями [Concept('naklan_the_golden','Наклана Золотого')|E]. Ибо наш народ знает, что даже в смерти сила не исчезает, а ждет возможности вернуться к своему законному владельцу."
 reclaim_naklans_legacy_decision_tooltip: "Объявите миру о своем праве называться Перерожденным Накланом."
 reclaim_naklans_legacy_decision_confirm: "Я вернулся!"
 reclaim_naklans_legacy_capital_tt: "Наша столица находится в [GetTitleByKey('c_shadowflats').GetNameNoTier]"

 achieve_dayas_dream.t: "Воплотить Мечту Дайи"
 achieve_dayas_dream_decision_desc: "[Concept('nari_daya','Нари Дая')|E], Мать Всех Нас, была лишена своего королевского сана слабыми и недостойными мужчинами. Пришло время исправить эту несправедливость."
 achieve_dayas_dream_decision_tooltip: "Воплотить мечту Нари Дайи и воспеть ее легенду звездам."
 achieve_dayas_dream_decision_confirm: "Наши Шипы Никогда Не Сломаются!"

 create_aversaria_anastereias_decision.t: "Сформировать Аверсарию Анастасию"
 create_aversaria_anastereias_decision_desc: "[Concept('aversaria', 'Аверсарии')|E] пепел оседает в [Concept('aeras','Аэрасе')|E], и наша некогда провозглашенная 'чистая' кровь смешивается с народом [Concept('kasiryat_biozone','Каширията')|E]. Пришло время решить: цепляемся ли мы за традиции, навязывая новый порядок в попытках вытеснить Автократию, или отпускаем прошлое? Должны ли мы принять культуры наших новых соседей и подданных и создать нечто новое?"
 create_aversaria_anastereias_decision_tooltip: "Сформировать новую [Concept('aversaria', 'аверсарианскую')|E] империю на берегах Каширията"
 create_aversaria_anastereias_decision_confirm: "Давайте определим нашу новую судьбу!"
 create_aversaria_anastereias_generic_effect_tooltip: "Вы создадите [GetTitleByKey('e_aversaria_anastereias').GetNameNoTier] и получите выбор между интеграцией с народами Каширията и их подчинением."
 create_aversaria_anastereias_decision_hybridization_tooltip: "Если вы выберете интеграцию и [Concept('completely_control_region', 'полностью под контрольные')|E] [Concept('kingdoms','королевства')|E] [GetTitleByKey('k_dartar').GetNameNoTier], [GetTitleByKey('k_hyratan').GetNameNoTier], [GetTitleByKey('k_taleshtadendar').GetNameNoTier] и [GetTitleByKey('k_kasharya').GetNameNoTier], а также [Concept( 'duchies', 'герцогства' )|E] [GetTitleByKey('d_taliron').GetNameNoTier], [GetTitleByKey('d_batset').GetNameNoTier] и [GetTitleByKey('d_detbora').GetNameNoTier], они станут [Concept( 'de_jure', 'де-юре' )|E] частью новой [Concept( 'empire', 'империи' )|E]."
 create_aversaria_anastereias_decision_traditionalist_tooltip: "Если вы выберете подчинение и [Concept('completely_control_region', 'полностью под контрольные')|E] [Concept( 'duchies', 'герцогства' )|E] [GetTitleByKey('d_taliron').GetNameNoTier] и [GetTitleByKey('d_bazauuk').GetNameNoTier], они станут [Concept( 'de_jure', 'де-юре' )|E] частью новой [Concept( 'empire', 'империи' )|E]."

 solidify_aversaria_anastereias_decision.t: "Укрепить Аверсарию Анастасию"
 solidify_aversaria_anastereias_decision_desc: "Хотя при основании нашей Автократии мы заявили права на весь [Concept('kasiryat_biozone','Каширият')|E], многие вдоль реки все еще отвергают нашу власть. Но теперь, когда эти непокорные земли находятся под нашим контролем, мы можем сделать наши претензии неоспоримыми как на деле, так и на бумаге."
 solidify_aversaria_anastereias_decision_tooltip: "Расширить [Concept( 'de_jure', 'де-юре' )|E] границы новой империи"
 solidify_aversaria_anastereias_decision_confirm: "Пусть Никто Не Отречется От Нашего Права"
 solidify_aversaria_anastereias_effect_tooltip: "Все необязательные [Concept( 'titles', 'титулы' )|E], не заявленные в первоначальном решении, станут [Concept( 'de_jure', 'де-юре' )|E] частью [GetTitleByKey('e_aversaria_anastereias').GetNameNoTier]"

 restore_nalmavast_priesthood_decision: "Восстановить [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] Священство"
 restore_nalmavast_priesthood_decision_desc: "Хотя понятие объединенного [ROOT.Char.GetFaith.GetAdjective] священства - не более чем далекое воспоминание, то, что было, еще может быть восстановлено. Укрепив основы, я созову священников, чтобы они избрали нового $nalmavast_religious_head_title$ из своих рядов, чтобы возглавить верующих."
 restore_nalmavast_priesthood_decision_tooltip: "Реформируйте свою веру, чтобы избавиться от ран прошлого."
 restore_nalmavast_priesthood_decision_confirm: "За Нальму, за наш народ."
 restore_nalmavast_priesthood_decision_holy_sites: "Вы контролируете хотя бы одно [Concept( 'holy_site', 'священное место' )|E] [CHARACTER.GetFaith.GetAdjective]."
 restore_nalmavast_priesthood_decision_tt: "Восстановлено [THIS.Char.GetFaith.GetAdjective] священство."
 nalmavast_tradition: "Традиция"
 nalmavast_tradition_tooltip: "Ваша вера останется в основном прежней."
 nalmavast_tradition_desc: "Мы исправим наши традиции и восстановим все, что было."
 nalmavast_pluralist: "Адаптация"
 nalmavast_pluralist_tooltip: "Ваша вера станет более плюралистической."
 nalmavast_pluralist_desc: "Испытания прошлого изменили нас, и вместе мы сильнее."
 nalmavast_righteous: "Мистицизм"
 nalmavast_righteous_tooltip: "Ваша вера станет более праведной и мистической."
 nalmavast_righteous_desc: "Священное знание принадлежит только нам, давайте сохраним его таким."
 nalmavast_fundamentalist: "Возмездие"
 nalmavast_fundamentalist_tooltip: "Ваша вера станет более фундаменталистской и воинственной."
 nalmavast_fundamentalist_desc: "Слабость была причиной нашего падения, и этого больше не будет."

 reclaim_krehejad_decision: "Reclaim the Land of Our Mothers"
 reclaim_krehejad_decision_desc: "Since our defeat in the [war_of_all_islands|E], our people have been cast adrift like a sailor tossed overboard. And yet we shall not slide gently into oblivion. Through sword and sail, we have reclaimed our homeland from the [Concept('aversaria','Aversarians')|E] and now stand poised to unite the [warrior_women_ehatm|E]. All that remains is to announce our dominion over the waves once more."
 reclaim_krehejad_decision_tooltip: "Reclaim the Homeland of the [warrior_women_ehatm|E]"
 reclaim_krehejad_decision_confirm: "Let the seas tremble once more!"
 reclaim_krehejad_decision_effect_tooltip: "Krehejad will be made into an [empire|E], and split into two [kingdoms|E]."


 agadari_resurgence_decision: "Resurgence of the E'hat'm"
 agadari_resurgence_decision_desc: "While the lands of our mothers have been reclaimed, it is no secret that we remain a minority in our homeland. We must recall our lost kin in [Glossary('Cyrat','cyrat_encyclopedia_desc')] to return home to aid in the revitalization of our homeland. With our control over the home islands secure, all that remains is to deliver the offers of voyage home."
 agadari_resurgence_decision_confirm: "Let us be reunited, now and forever"
 agadari_resurgence_decision_tooltip: "Recall the [warrior_women_ehatm|E] from [Glossary('Cyrat','cyrat_encyclopedia_desc')]" 
 agadari_resurgence_custom_decision: "All of your [powerful_vassals|E] are of [GetCulturePillar('heritage_agadari').GetName] [culture|E]"
 agadari_resurgence_tooltip: "[counties|E] in your realm may switch to your [culture|E] and faith"
 agadari_homecoming_tooltip: "The [GetCulturePillar('heritage_agadari').GetName] people in [GetGeographicalRegion('cyrat_biozone').GetName] will be given the choice to abandon it to return to [GetGeographicalRegion('krehejad_biozone').GetName]"

 krehejad_seize_dethskel_decision: "Lay Claim to the Straits of Dethskel"
 krehejad_seize_dethskel_decision_desc: "Since the [aironoian_bronze_age|E], the strait bordering the [Glossary('Redlands','redlands_encyclopedia_desc')] has been a vital thread connecting trade from east to west. By consolidating the region under our control, we can legitimize our dominion over the coast as a force of stability."
 krehejad_seize_dethskel_decision_tooltip: "[GetTitleByKey('k_dethskel').GetNameNoTier] will become a [de_jure|E] part of [GetTitleByKey('e_krehejad').GetNameNoTier]"
 krehejad_seize_dethskel_effect_tooltip: "If you hold the [duchy|E] of [GetTitleByKey('d_zaradar').GetNameNoTier], it will become a [de_jure|E] part of [kingdom|E] of [GetTitleByKey('k_dethskel').GetNameNoTier]"
 krehejad_seize_dethskel_decision_confirm: "The flow of commerce rests in our palm"

  # ASKIL URGENT: GO THROUGH IT GOD DAMN YOU
 
 declare_establishment_of_Yuankang_decision.t: "Establish Yuan-Kang"
 declare_establishment_of_Yuankang_decision_desc: "It has been centuries since our ancestors settled in the region and founded [Concept('bureau_bronzeport','Bronzeport')|E]. Although far removed from [kathun|E], Kathun-Kai has always sought to keep us in its sphere of influence by establishing the 'The Heaven-Ordained Semi-Autonomous Bureau of the Bronzeport'. No longer shall we be ruler by others. I will establish Yuan-Kang!"
 declare_establishment_of_Yuankang_decision_tooltip: "Establish a brand-new republic"
 declare_establishment_of_Yuankang_decision_confirm: "Long live Yuan-Kang!"
 declare_establishment_of_Yuankang_decision_1.tt: "[GetGeographicalRegion('trade_confluence_bronzeport_core_area').GetName] [region|E] will be incorporated into the [de_jure|E] of [GetTitleByKey('e_yuankang').GetNameNoTier][title|E]"

 build_takaday_coastal_avenue_decision.t: "Build Coastal Avenue"
 build_takaday_coastal_avenue_decision_desc: "The presence of the Takaday jungle has always separated the east and west of Dahangon. Although requiring immense investements, much of the coast could be cleared connecting the two regions, allowing trade to flow inland as well as on seas."
 build_takaday_coastal_avenue_decision_tooltip: "The way to connect the east and the west of Dahangon"
 build_takaday_coastal_avenue_decision_confirm: "Start Project"
 build_takaday_coastal_avenue_decision.tt: "It will take one to three years to build this road."


 proclaim_chin_lin_emperor_decision.t: "Proclaim Chinlin Emperor"
 proclaim_chin_lin_emperor_decision_desc: "Throughout its history, Dahangon has never been fully conquered by Kathun-Kai. Even when the Protectorate of the Southlands was at its maximum extent, it pass through Dahangon jungles. Yet this reality has now been shattered. I have accomplished an unprecedented feat—ruling all of Dahangon as a Kathuni monarch. Statues of myself and my descendants will be forever enshrined in the golden palace of Dawang Tarmak, gazed upon by Banwagul and Kathuni nobles alike, alongside the visages of [Concept('naklan_the_golden','Naklan')|E]'s progeny."
 proclaim_chin_lin_emperor_decision_tooltip: "An unprecedented new dynasty."
 proclaim_chin_lin_emperor_decision_confirm: "Crowned in Dawang-Tarmak!"
 proclaim_chin_lin_emperor_decision.tt: "All your vassals who belong to the [GetCulturePillar('heritage_easterner').GetName][heritage|E] and have an opinion more than#I  50#! will adopt the Chenhan [culture|E]."

 conquer_the_kashirya_states_decision.t: "Conquer Kashirya"
 conquer_the_kashirya_states_decision_desc: "[kashirya|E] has throughout history borne the ambitions of many great rulers who established monumental empires here—first the [otachedian_empire|E], followed by the [taryaad_saramsaasan|E].\n\n But now, as the nations of Dahangon unite under the banner of Chinlin, the Kathuni blood burning in our veins drives us to conquer new lands and turn our gaze upon distant realms where [naklan_the_golden|E] has yet to tread. Our invincible armies shall cross the Kharadan Mountains! Chinlin will not be the last empire to march into Kashirya—but it shall be the most enduring and successful in its rule!"
 conquer_the_kashirya_states_decision_tooltip: "Rule the west."
 conquer_the_kashirya_states_decision_confirm: "Conquer Kashirya!"
 conquer_the_kashirya_states_decision.tt: "We will decide whether to collaborate with [vidvaookeyatran_scholarly_caste|E]."
 dahnagon_change_control.tt: "The Control level in Every [de_jure|E] [county|E] will changes by#P  +25#!."




 advance_into_the_shrunfan_decision.t: "Advance into the Shrunfan"
 advance_into_the_shrunfan_decision_desc: "In the eastern lands, where the great river flows through valleys embraced by rolling hills and dense forests, there once stood the realm of the Saielai. They established a vast and glorious dynasty, which was ultimately conquered by martial forces originating from the same lands as our forebears. The mighty Shrunfan Kingdom was utterly vanquished. However, after centuries of upheavals and decline, Kathun-Kai no longer holds sway. Rebellions have shattered the once-invincible Lanonan army, and the region is now fragmented among rival powers. As the most powerful Kathuni empire in the Southsea, Chinlin rightfully claims the mantle of the fractured Kathun-Kai, asserting sovereignty over the ancestral territories of the Saielai. We shall subjugate them, compel their tribute, and extend our dominion to lands the Dahangon people have never before reached in their history."
 advance_into_the_shrunfan_decision_tooltip: "The new territory of Chinlin Empire."
 advance_into_the_shrunfan_decision_confirm: "Announce our arrival"
 restore_the_tilolan_system_decision.t: "Restore the Tilolan System"
 restore_the_tilolan_system_decision_desc: "The monarchs of Dahangon governed through a unique social system known as [tilolan|E]. Vassals traveling between the [GetBuilding('01_dawang_tarmak').GetName] and their domains not only kept the monarch informed of regional affairs but also replenished the treasury with tributes. However, after [naklan_the_golden|E]'s death, the Tilolan system fell into semi-collapse, becoming heavily reliant on the personal prestige of the Dahangon monarch to sustain it. Whenever a new ruler ascended the throne, previously compliant nobles often seized the opportunity to break away from the system. \n\nToday, Chinlin has replaced the former Dahangon dynasty as the core of the Tilolan framework."
 restore_the_tilolan_system_decision_tooltip: "Strengthen our rule."
 restore_the_tilolan_system_decision_confirm: "Improved the system."
 restore_the_tilolan_system_decision.tt: "Based on the number of [vassal|E] at different tier [title|E], You will gain @influence_icon!#P [SCOPE.ScriptValue('dahnagon_vassl_power_value')|0]#!."
 restore_the_tilolan_system_decision_one.tt: "Based on the number of [vassal|E] at different tier [title|E], You will gain @prestige_icon!#P [SCOPE.ScriptValue('dahnagon_vassl_power_value')|0]#!."
 dahangong_people_surrender_effect.tt: "More citizens and nobles of Dahangon will @skill_diplomacy_icon!#V Recognize#! your [dynasty|E]'s rule and embrace Chenhan[culture|E]."
 grant_the_artisans_guild_royal_title_decision.t: "Grant the Artisans Guild Royal Title"
 grant_the_artisans_guild_royal_title_decision_desc: "Dahangon boasts a time-honored tradition of craftsmanship, with numerous regions home to their own artisan guilds. These guilds, both large and small, have long enabled the nobles of Dahangon to effortlessly create treasures and construct magnificent edifices. With the establishment of the Chinlin Empire, the demand for skilled artisans has surged across various endeavors. To meet this growing need, we must organize these artisans of Dahangon and expand their ranks, ensuring they contribute their talents to the service of the nascent dynasty."
 grant_the_artisans_guild_royal_title_decision_tooltip: "Unify artisans guild"
 grant_the_artisans_guild_royal_title_decision_confirm: "Establish an official guild."
 grant_the_artisans_guild_royal_title_decision.tt: "[development|E] level in Every [county|E] with artisan-related [building|E] in any [holding|E] changes by#P  +3#! and gain [GetModifier('recruit_artisan_modifier').GetNameWithTooltip][modifier|E] for 20 years"
 craftsmen_buildings_number_value_desc: "You must have more than#S  15#! Artisan [building|E] or its upgradesin in [realm|E] (Current: [SCOPE.ScriptValue('craftsmen_buildings_number_value')|0])\n#italic The list of [building|E] that meet the criteria is as follows:\n#T  ·#![GetBuilding('wind_furnace_04').GetName]\n#T  ·#![GetBuilding('artisan_quarters_04').GetName] \n#T  ·#![GetBuilding('smiths_04').GetName]\n#T  ·#![GetBuilding('siege_works_03').GetName]\n#T  ·#![GetBuilding('blacksmiths_03').GetName]#! "
 rebuild_the_pearl_of_dahangon_decision.t: "Rebuild the Pearl of Dahangon"
 rebuild_the_pearl_of_dahangon_decision_desc: "Dawang Tarmak is revered by all Banwagul people as their most sacred city. In Banwagul literature, it is often depicted as an extraordinary realm that gathers all the splendor and magnificence of the world. For centuries, it has served as a primary pilgrimage site for the Dahala [faith|E], holding a transcendent status that has made its fate inextricably linked to the rule over Dahangon. \n\n However, the [Concept('ratarakaw','Catastrophe')|E] that erupted in 1242 IS nearly reduced Dawang Tarmak to ashes, with the ensuing shockwaves devastating several surrounding regions. Yet, through the efforts of the Chinlin Empire, [Glossary('Yuydu','GH_YUYDU_GLOSS')] has risen from the ashes, reborn with even greater brilliance. It now stands before the world as our new capital, destined to thrive for millennia to come."
 rebuild_the_pearl_of_dahangon_decision_tooltip: "Restore this beautiful city."
 rebuild_the_pearl_of_dahangon_decision_confirm: "Repair the city."
 rebuild_the_pearl_of_dahangon_decision.tt: "Depending on the repair level of the [Glossary('Yuydu','GH_YUYDU_GLOSS')], [GetTitleByKey('c_catchers_east').GetNameNoTier] will @skill_stewardship_icon!#V Receive#! bonuses of varying levels."
 claim_naklan_ancestry_decision.t: "Claim Naklan Ancestry"
 claim_naklan_ancestry_decision_desc: "[naklan_the_golden|E] was an extraordinarily great monarch who, for the first time, united the warring tribes of Dahangon into a single state and left behind numerous enigmatic legends. Over centuries, through generations of Banwagul oral traditions, Naklan has been elevated to a divine status. It is widely believed that his sacred lineage was endowed with mystical powers, entrusted with the leadership and governance of the Dahangon peoples. \n\n As a result, nearly every Banwagul ruler has claimed ancestral ties to the Naklan family. As outsiders in Banwagul society, asserting this lineage would help bridge the distance between the Chinlin and the Dahangon populace, lending legitimacy to the new royal house in the eyes of both nobles and commoners."
 claim_naklan_ancestry_decision_tooltip: "Claiming our status as descendants of Naklan."
 claim_naklan_ancestry_decision_confirm: "Shape blood vessels."
 chinlin_nolan_add_bloodline_effect_desc: "Every one of your offspring will gain the [trait|E]#V  [GetTrait('gh_scion_of_nolan').GetName(GetNullCharacter)]#!, as will Their male descendants."
 enfeoff_family_members_decision.t: "Enfeoff Imperial Clan"
 enfeoff_family_members_decision_desc: "The territory of the Chinlin Empire, under the governance of our wise Monarch, has expanded to an unprecedented scale, far surpassing any previous Dahangon regime in history. While this brings immense glory, the cost of governing such a colossal entity has gradually increased. Orders from Yuydu often take several months to reach the borderlands, fostering serious secessionist tendencies in remote regions. If this continues, these territories will inevitably begin to oppose Chinlin's rule. \n\n To address the issue of controlling the frontier, we have chosen to appoint members of the [Concept('dynasty_members','Imperial Clan')|E] to various regions, allowing them to exercise authority in the name of the emperor and strengthen central power. These stationed imperial relatives will have the power to collect taxes, levy troops, and appoint officials, responsible for coordinating local resources and promptly suppressing rebellious forces."
 enfeoff_family_members_decision_tooltip: "Strengthen local management."
 enfeoff_family_members_decision_confirm: "Send them to the frontier"
 chinlin_dynasty_vassal_opinion_desc: "Every [vassal|E] of your [dynasty|E] gains#P  40#! [opinion|E] of#V  you#!#italic  (-1.20/year)(Grateful)#!"
 chinlin_county_controls_add_desc.tt: "Every [county|E] in your [realm|E]"
 make_chinlin_descision_desc: "You have completed#V  Advance into the Shrunfan#![decision|E] and#V  Conquer the Kashirya States#![decision|E]."
 chinlin_dynasty_vassal_member_value_desc: "You have more than#S  30#! [vassal|E] of your [dynasty|E]. (Current: [SCOPE.ScriptValue('chinlin_dynasty_vassal_member_value')|0])"
 mobile_fortress_in_the_jungle_decision.t: "Mobile Fortress in the Jungle"
 mobile_fortress_in_the_jungle_decision_desc: "The [Concept('elephant_cavalry','War Elephants')|E] of [kashirya|E] are historically renowned. These mighty creatures were a nightmare for infantry and significantly hindered Chinlin's advance during the campaign in Kashirya, repeatedly inflicting heavy casualties on our forces. \n\n Now that Kashirya has been defeated, we can learn from this expertise and introduce elephants into Dahangon. Their massive bodies can easily traverse complex wetland terrain, proving invaluable in both combat and logistical transport. Moreover, the majestic presence of elephant herds will enhance the authority of the imperial house."
 mobile_fortress_in_the_jungle_decision_tooltip: "Introduction of elephant species from Kashirya"
 mobile_fortress_in_the_jungle_decision_confirm: "Domesticated elephants"
 mobile_fortress_in_the_jungle_decision.tt: "Every [county|E] that has [GetBuilding('elephant_pens_05').GetName][building|E] or its upgradesin"
 mobile_fortress_in_the_jungle_decision_tt: "You have more than 1000 [elephant_cavalry|E]."
 mobile_fortress_in_the_jungle_decision_one_tt: "You must have more than#S  15#! [GetBuilding('elephant_pens_05').GetName][building|E] or its upgradesin in [realm|E] (Current: [SCOPE.ScriptValue('craftsmen_buildings_number_value')|0])"
 develop_inland_water_transport_decision.t: "Develop Inland Water Transport"
 develop_inland_water_transport_decision_desc: "The Tagsan River is a mighty, rushing torrent. As the cradle of Dahangon civilization, countless towns are scattered along its banks, granting it immense navigational value. However, conducting trade along the river has historically been fraught with difficulties—shallow mudbanks and steep sections frequently trap vessels, while internal strife has further hampered commercial development. \n\n Now, we finally possess the capability to harness the value of the Tagsan River. To meet the growing trade demands within the river basin, we must tame this great serpent. By applying advanced Kathuni construction techniques to expand ports and dredge the waterways, it will transform into a thriving artery of commerce, channeling wealth directly into the heart of the Chinlin Empire."
 develop_inland_water_transport_decision_tooltip: "Promote trade development."
 develop_inland_water_transport_decision_confirm: "Dredge the waterway."
 chinlin_inland_water_transport_value_desc: "You must have more than#S  15#! [GetBuilding('common_tradeport_06').GetName][building|E] and [GetBuilding('caravanserai_05').GetName][building|E] or their upgradesin in [GetGeographicalRegion('trade_confluence_tagsan_navigable_area').GetName] [region|E] (Current: [SCOPE.ScriptValue('chinlin_inland_water_transport_value')|0])"
 develop_inland_water_transport_decision_trigger_desc: "The [development|E] level in Every [county|E] located in the [GetGeographicalRegion('trade_confluence_tagsan_navigable_area').GetName] [region|E] that is not Wastelands is greater or equal to#bold  15#!"
 chinlin_inland_water_transport_income_value_desc: "Based on the number of [building|E] that meet the criteria, you will gain @gold_icon!#P  [SCOPE.ScriptValue('chinlin_inland_water_transport_income_value')|0]#!"
 develop_inland_water_transport_decision.tt: "Every [county|E] located in the [GetGeographicalRegion('trade_confluence_tagsan_navigable_area').GetName] [region|E]"
