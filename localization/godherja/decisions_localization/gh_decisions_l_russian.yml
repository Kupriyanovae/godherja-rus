 #expand_opakhasia_decision_tooltip: "#E Opakhasia's#! provincial dominion will be restored."
 restore_aironoi_decision: "Восстановить Айроной"
 restore_aironoi_decision_desc: "Хотя разрушения от [Concept('frodbrokna','Фродброкны')|E] оставили перед нами сложную задачу, из разорённого города [GetTitleByKey('c_asiupoli').GetNameNoTier] мы отбросили варваров и с востока, и с запада. Окровавленный, но не сломленный, Айроной вновь станет могучим восточным оплотом восстановленной [Concept('aversaria','Аверсарии')|E]."
 restore_aironoi_decision_confirm: "Перекроить старые границы Айроноя"
 restore_aironoi_decision_tooltip: "Старые [Concept('aversaria','аверсарианские')|E] де-юре королевства Айроноя будут восстановлены вместо любых мелких королевств сьяволки, созданных после завоевания Ценвара."
 restore_aironoi_requirement: "Все не покрытые туманом герцогства с измененными де-юре сюзеренами в #E Айроное#! контролируются нами."
