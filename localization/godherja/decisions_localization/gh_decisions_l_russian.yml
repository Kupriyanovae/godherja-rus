 #restore_the_reach_decision_tooltip: "#E Mikros Kalathipsomi's#! de jure hierarchy will be restored."
 restore_malcois_decision: "Восстановить Малкоис"
 restore_malcois_decision_desc: "Рабы, вероломные марочники и хищные сьялволки изо всех сил пытались отнять у нас Малкоис, но их успехи оказались лишь временными неудачами. С восстановлением твёрдой [Concept('aversaria','аверсарианской')|E] власти в этом Палате-то-Митидоне наш авторитет больше никто не оспорит."
