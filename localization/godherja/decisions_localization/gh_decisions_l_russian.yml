 #restore_malcois_decision_tooltip: "#E Malcois'#! de jure hierarchy will be restored."
 restore_opakhasia_decision: "Восстановить Опахасию"
 restore_opakhasia_decision_desc: "С большими усилиями мы отбросили назад волну варваров и восстановили границы Опахасии, от Корвионского пролива до сверкающего города [GetTitleByKey('c_last_light').GetNameNoTier]. Хотя цвет империи сильно поблек, под нашим решительным руководством он непременно расцветёт вновь!"
