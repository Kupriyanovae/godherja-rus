 introduce_kashiryan_elephants_decision_confirm: "Procure a Herd"

 establish_absolute_leadership_over_the_dahala_decision.t: "Establish Absolute Leadership over the Religious"
 establish_absolute_leadership_over_the_dahala_decision_desc: "The [religion|E] of the Banwagul people is primarily centered around#V  Dahala#!, a religious system deeply influenced by philosophy. After the [battle_of_balinbada|E], the Protectorate of the Southsea was established, and the#V  Fourteen Heavenly Methods#!, along with other [kathun|E] Religions, spread deeply along trade routes into the Southsea, resulting in a complex religious landscape within the Dahangon region. The fragmented topography further exacerbates religious disparities between areas.\n\n Now, with an increasing influx of Kathuni migrants into the Chinlin Empire, conflicts between different [faith|E] have intensified severely, even threatening Chinlin's rule. The old policy of religious tolerance is no longer suitable. We must establish a single state faith, expel other beliefs, and eradicate these destabilizing factors."
 establish_absolute_leadership_over_the_dahala_decision_tooltip: "The Emperor is the one and only master."
 establish_absolute_leadership_over_the_dahala_decision_confirm: "Establish our state religion."
 fhmr_winner_decisions.tt: "All [head_of_faith|E] of#V  Dahala#![religion|E] will be destroyed."
