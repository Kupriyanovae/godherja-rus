 elephant_race_decision: "Посетить Слоновьи Бега"
 elephant_race_decision_desc: "#F У многих культур в Каширии существует древняя традиция устраивать слоновьи бега. Я мог бы посетить такое мероприятие, чтобы продемонстрировать свое богатство и престиж#!"
 start_elephant_race_decision: "Вы посещаете местные игры"
 start_elephant_race_decision_stress_lazy: "#N Вы не потеряете [Concept( 'stress', 'стресс' )|E], так как вы [GetTrait('lazy').GetName( GetPlayer )]#!"
 elephant_race_decision_tooltip: "Вы отправляетесь на слоновьи бега"
 elephant_race_decision_confirm: "Скачки ждут!"
 gh_taryaad_saramsaasan_unification_decision: "Восстановить Королевство ПЭрасджатан!"
 taryaad_reformed_valid_desc: "Вы должны полностью контролировать империи Наавджагарад и Вичачил"
 gh_taryaad_saramsaasan_unification_decision_confirm: "Наша династия навсегда будет вписана в историю Каширии!"
 gh_taryaad_saramsaasan_unification_decision_tooltip: "Воссоединить земли династии Тарьяд"
 gh_taryaad_saramsaasan_unification_decision_desc: "Имя Тарьяд — это больше, чем просто имя. Значение этого слова проникло в саму жизнь каширьянского народа, символизируя конец анархии и нисхождение самих богов, чтобы установить гармоничное правление над народом Каширии.\n\nНаша династия, пройдя через множество испытаний и невзгод, стала правителями земель [Concept('taryaad_saramsaasan','Тарьяд Сарамсаасан')|E] и принесла золотой век, подобный прежним!"
 gh_taryaad_pretender_decision: "Заявить права на Трон Асодживы"
 gh_taryaad_pretender_decision_confirm: "Вернуть эти земли — мое право по рождению!"
 gh_taryaad_pretender_decision_tooltip: "Вы доказали, что достойны наследия Асодживы"
 gh_taryaad_pretender_decision_desc: "Каширьянам всегда не хватало хорошего лидера, который повел бы их к светлому будущему. Только когда сами боги спустились в Каширьян в образе Асодживы, чтобы избавить нас от нашей гордыни, мы наконец вступили в период мира и прогресса. Теперь, когда его род угас, Каширьяну нужен новый лидер — божественное существо, которое сможет принести Каширьяну еще один процветающий век, подобный Тарьяду. Существо, подобное мне. Ибо теперь я доказал всем в этих землях, что я достоин. Достоин возглавить имя Тарьяд."
 otachedian_restoration_decision: "Восстановить Империю Отачеда"
 must_control_majority_of_kashirya_decision_tt: "Вы контролируете более [SCOPE.ScriptValue('otachedian_formable_percent_value')|0]% [Concept('region', 'региона')|E] [GetGeographicalRegion('GH_geographic_kashirya').GetName] (Сейчас: [SCOPE.ScriptValue('current_controlled_kashirya_decision_region_owned_percent_value')|0]%)"
 otachedian_restoration_decision_desc: "Когда-то великий завоеватель правил землями [Concept( 'kashirya', 'Каширии' )|E]. После его падения последовали опустошение и конфликты, но слава все еще достижима. Перекуйте имперские амбиции Отачеда и его сыновей и введите Каширию в новую эру!"
 otachedian_restoration_decision_tooltip: "Создать новую империю в Каширье"
 otachedian_restoration_decision_confirm: "Во славу ольтенов!"
 otached_restoration_decision_titles_tt: "Все [Concept( 'titles', 'титулы' )|E] [Concept( 'de_jure', 'де-юре' )|E] в Каширии и Айроное, которые вы [Concept( 'completely_control', 'полностью контролируете' )|E], станут частью вашей новой империи."
 otachedian_restoration_troops_effect_tt: "Вы получите верную [Concept( 'army', 'армию' )|E] ольтенских [Concept('soldiers','солдат')|E]:\n$BULLET_WITH_TAB$#V 1000#! $oltenic_horse_archers$ #weak ([Concept('archer_cavalry','конные лучники')|E])#!\n$BULLET_WITH_TAB$#V 1000#! $oltenic_spearmen$ #weak ([Concept('spearmen','копейщики')|E])#!"
 otachedian_restoration_modifier_vassalization_effect_tt: "Увеличивает принятие [Concept( 'tradition', 'традиции' )|E] Отачедского Закона #V $offer_vassalization_interaction$#! на #P +15#!"
 nick_lord_of_the_kasir: "Властитель Каширията"
 form_stellios_aautokrata_decision: "Заявить права на Автократию"
 form_stellios_aautokrata_desc: "Материк пал, раздавленный ордами сьялволков. Аавтократа больше нет — лишь мелкие военачальники с нелепыми притязаниями. Но здесь, в Архексате, старая империя ещё держится. Как правитель Крехеджада, я остаюсь последней действующей частью [Concept('aversaria','имперского')|E] правительства. От архекса до аавтократа всего один шаг…"
 form_stellios_aautokrata_decision_tooltip: "Крехеджад будет преобразован в автократию и разделен на два губернаторства."
 form_stellios_aautokrata_decision_confirm: "Поднять старые знамена!"
 blow_the_black_horn_decision: "Затрубить в Черный Рог"
 blow_the_black_horn_decision_desc: "Затрубите в Черный Рог и призовите армию духов, но будьте осторожны, говорят, что те, кто взывает к силе Рога, обречены почувствовать его гнев."
 blow_the_black_horn_decision_tooltip: "Затрубить в Черный Рог!"
 blow_the_black_horn_decision_confirm: "Я приму эту судьбу."
