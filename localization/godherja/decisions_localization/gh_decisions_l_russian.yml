 break_strings_decision: "Разорвать мои Нити"
 break_strings_decision_tooltip: "Я уже не так послушен, как раньше"
 break_strings_decision_desc: "Хотя я все еще далек от полного контроля над своим владением, я больше не марионетка, танцующая под дудку своего хозяина."
 break_strings_decision_confirm: "Взять судьбу в свои руки"
 recruit_wayfather_decision: "Нанять наставника Пути"
 recruit_wayfather_decision_tooltip: "Ваши слуги предложат несколько подходящих кандидатов на должность наставника Пути, который будет служить нашим придворным капелланом."
 recruit_wayfather_decision_tt: "Мы сможем нанять наставника Пути, который будет служить нашим придворным капелланом."
 recruit_wayfather_decision_desc: "В нашей вере каждый из нас посвящен избранному Жизненному Пути, а наставники Пути служат нашими проводниками на пути к самосовершенствованию. Каждый двор был бы духовно потерян без должного Отца Пути или Матери Пути."
