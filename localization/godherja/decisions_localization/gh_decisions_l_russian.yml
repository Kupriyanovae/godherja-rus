 become_thura_myinthein_decision: "Стать Тура Мьинтейном"
 become_thura_myinthein_decision_desc: "Примите мантию легендарного защитника Наттанана, Тура Мьинтейна, клятвенного хранителя Священной Рощи и всех священных природных мест. Примите свою судьбу как Чемпиона Двуединых Богов, защищая священный баланс природного мира от всех, кто ему угрожает."
