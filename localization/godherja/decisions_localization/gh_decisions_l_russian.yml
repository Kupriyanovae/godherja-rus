 search_for_notable_decision_desc: "Я соберу лучших искателей талантов в королевстве и поручу им найти способных простолюдинов для службы при моем дворе или для выполнения других ролей."
 search_for_notable_decision_confirm: "Послать за искателями талантов."
 reunite_boqqarut_decision: "Воссоединить Боккарут"
 reunite_boqqarut_decision_tooltip: "Вы провозгласите себя Боккаром воссоединенной Дамоты."
 reunite_boqqarut_valid_desc: "Вы владеете всей [GetGeographicalRegion('world_es_core_damota').GetName]"
 reunite_boqqarut_decision_desc: "Хотя [Concept('boqqarut_damotada','Баккарут Дамотада')|E] был разрушен в огне [Concept('etami_tetenik','Этами Тетеник')|E], а мелкие военачальники вырезали из его трупа собственные королевства, он снова восстанет. Там, где когда-то царили хаос и разрушение, воцарятся порядок и процветание, и вся Дамота будет купаться в нашей славе и великолепии. Нам нужно лишь сделать провозглашение."
 reunite_boqqarut_decision_effects: "Вас будут знать как восстановителя Дамоты."
 reunite_boqqarut_decision_confirm: "Дамота возрождается!"
 integrate_gisreddes_decision: "Интегрировать Гисредд"
 integrate_gisreddes_decision_desc: "Веками [Concept('peti_gisredde','Пети-Гисредд')|E] и его кузен [Concept('grande_gisredde','Гранд-Гисредд')|E] были аномалией внутри Шевалье, всегда сопротивляясь власти Верховного Короля. Теперь мы наконец можем покончить с юридическим абсурдом, известным как [Concept('gisreddepact','Гисреддский пакт')|E], и формально подчинить города и [Concept('council_of_gisredde','Совет Гисредда')|E] нашему правлению."
 integrate_gisreddes_control_timer_no: "Вы должны непрерывно контролировать оба Гисреддеса в течение 80 лет (до [GetCurrentDateWithDiff( GetVarTimeRemaining( TITLE.MakeScope, 'integrate_gisreddes_timer') )])."
 integrate_gisreddes_control_timer_yes: "Вы должны непрерывно контролировать $c_peti_gisredde$ и $c_grande_gisredde$ в течение 80 лет."
 integrate_gisreddes_decision_complete_desc: "Гисредд де-юре интегрируются в Шевалье и больше не будут создавать беспорядков."
