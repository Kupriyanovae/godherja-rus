 revive_ertomax_kingdom_decision: "Возвращение Арюванн Вос"
 revive_ertomax_kingdom_decision_tooltip: "Объявить о восстановлении королевства [Concept( 'ertomax', 'Эртомакс' )|E]"
 revive_ertomax_kingdom_decision_desc: "Древнее королевство Арюванн Вос было потеряно нашим народом со времен [Concept( 'ertomax', 'Эртомакса' )|E], но его еще можно восстановить. Если я соберу под своим знаменем исконные земли, никто не сможет отрицать возвращения королевства Эртомакс на лицо Айроноя."
