l_russian:
 found_barrow_decision_name:0 "Подготовить курган"
 found_barrow_decision_desc:0 "Моя душа однажды покинет бренную оболочку, и для персоны моего статуса положено воздвигнуть погребальное сооружение, достойное стать последним пристанищем."
 found_barrow_decision_tooltip:0 "Я создам курган, подобающий великому правителю."
 found_barrow_decision_confirm:0 "Начать разработку планов"
 found_barrow_decision_effect_tt:0 "Вы сможете выбрать масштаб кургана — каждый уровень даёт большие бонусы."

 convert_realm_feudalism_rite:0 "Учредить аристократию через обряд"
 convert_realm_feudalism_rite_desc:0 "Старые обычаи хорошо служили нам, и мы всегда будем чтить их. Однако как [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] я [Select_CString(ROOT.Char.IsFemale, 'постановила', 'постановил')]: чтобы процветать дальше, мы должны править от имени семей, а не племён. Это следующий важный шаг на пути к величию!"
 convert_realm_feudalism_rite_tooltip:0 "Ваше государство станет [Concept('feudal', 'аристократическим')|E]!"
 convert_realm_feudalism_rite_confirm:0 "Да здравствует [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"

 form_waymakers_of_velos_decision:0 "Основать Отцов Пути Велоса"
 form_waymakers_of_velos_decision_desc:0 "Некогда наш род вёл войско Верховного короля через просторы [Concept('aeras', 'Эраса')|E], указывая путь к новой жизни на Расколотом побережье. Теперь мы вновь примем эту миссию — вести верных Обряда по стезе Велоса."
 form_waymakers_of_velos_decision_tooltip:0 "Вы создадите священный орден, посвящённый Велосу!"
 form_waymakers_of_velos_decision_confirm:0 "Мы проложим путь вперёд!"
 waymakers_of_velos_formed_tooltip:0 "Сменит [Concept('government', 'форму правления')|E] на [Concept('landed', 'землевладельческий')|E] [Concept('holy_order', 'священный орден')|E]"
 waymakers_of_velos_county_trigger:0 "Ваши владения должны находиться на [Concept('the_continent', 'Континенте')|E]"
 form_waymakers_of_velos_decision.tt.is_in_correct_region:0 "Находится в [Concept('region', 'регионе')|E] [GetGeographicalRegion('world_ga_aversarian_homelands').GetName]"

  ### Создание свотсадской культуры ###
  establish_svotsadi_culture_decision:0 "Утвердить свотсадскую идентичность"
  establish_svotsadi_culture_decision_desc:0 "Наши поселенцы вдоль [Glossary('Дельты Патоса','pathos_delta_encyclopedia_desc')] давно смешиваются с хуэгодоками, соединяя традиции предков с обычаями нового дома."
  establish_svotsadi_culture_decision_tooltip:0 "Создать культуру свотсадов, объединив сьялволькские и хуэгодокские традиции"
  establish_svotsadi_culture_decision_confirm:0 "Объединить наши народы"
  establish_svotsadi_culture_decision_effect.tt:0 "Будет создана #Y свотсадская#! культура, сочетающая наследие обеих родительских культур и перенимающая их новшества."
  
  ### Создание лесковичской культуры ###
  establish_leskovych_culture_decision:0 "Утвердить лесковичскую идентичность"
  establish_leskovych_culture_decision_desc:0 "Наши сьялволькские воины многому научились у клановцев. Проложим новый путь, который чтит наше воинственное наследие и в то же время принимает лесные традиции."
  establish_leskovych_culture_decision_tooltip:0 "Создать культуру лесковичей, объединив сьялволькские и клановые традиции"
  establish_leskovych_culture_decision_confirm:0 "Выковать нашу судьбу"
  establish_leskovych_culture_decision_effect.tt:0 "Будет создана #Y лесковичская#! культура, сочетающая наследие обеих родительских культур и перенимающая их новшества."
  
  ### Создание каскадэрской культуры ###
  establish_kaskader_culture_decision:0 "Утвердить каскадэрскую идентичность"
  establish_kaskader_culture_decision_desc:0 "Плавильный котёл Бастонпорта породил новый народ с развитым гражданским самосознанием. Вокруг великого города сложилась каскадэрская идентичность, соединившая сьялволькские традиции с космополитическим духом столицы."
  establish_kaskader_culture_decision_tooltip:0 "Создать каскадэрскую культуру с центром в Бастонпорте"
  establish_kaskader_culture_decision_confirm:0 "Принять наше городское будущее"
  establish_kaskader_culture_decision_effect.tt:0 "Будет создана #Y каскадэрская#! культура, перенимающая новшества вродкинов."
  
  ### Создание итникавингской культуры ###
  establish_itnicavingi_culture_decision:0 "Утвердить итникавингскую идентичность"
  establish_itnicavingi_culture_decision_desc:0 "Наши поселенцы на Элизийских равнинах поколениями смешивались с мондекнами, и со временем здесь сложились новые обычаи."
  establish_itnicavingi_culture_decision_tooltip:0 "Создать культуру итникавингов, объединив традиции барков и мондекнов"
  establish_itnicavingi_culture_decision_confirm:0 "Объединить поселенцев"
  establish_itnicavingi_culture_decision_effect.tt:0 "Будет создана #Y итникавингская#! культура, сочетающая наследие обеих родительских культур и перенимающая их новшества."
  
  ### Создание радиволкской культуры ###
  establish_radivolki_culture_decision:0 "Утвердить радиволькскую идентичность"
  establish_radivolki_culture_decision_desc:0 "В древнем имперском сердце земель вокруг Орисполя народы Имперреха переплели свои обычаи и создали нечто новое. Будем чтить старые пути, принимая объединяющий дух нового дома."
  establish_radivolki_culture_decision_tooltip:0 "Создать культуру радиволков, объединив сьялволькские обычаи"
  establish_radivolki_culture_decision_confirm:0 "Заявить права на наше наследие"
  establish_radivolki_culture_decision_effect.tt:0 "Будет создана #Y радиволкская#! культура, сочетающая наследие обеих родительских культур и перенимающая их новшества."
  
  ### Создание пактоземской культуры ###
  establish_pactlander_culture_decision:0 "Утвердить пактоземскую идентичность"
  establish_pactlander_culture_decision_desc:0 "За поколения взаимовыгодных договоров в [Glossary('Долине Кнокидбес','knokidbes_encyclopedia_desc')] разрозненные народы стали единым целым, и из этих уз сотрудничества родилась новая идентичность."
  establish_pactlander_culture_decision_tooltip:0 "Создать культуру пактоземцев, объединив традиции трибоцикайцев и мондекнов"
  establish_pactlander_culture_decision_confirm:0 "Скрепить пакт"
  establish_pactlander_culture_decision_effect.tt:0 "Будет создана #Y пактоземская#! культура, сочетающая наследие обеих родительских культур и перенимающая их новшества."
  
  ### Создание сонтрвентской культуры ###
  establish_southlander_culture_decision:0 "Утвердить сонтрвентскую идентичность"
  establish_southlander_culture_decision_desc:0 "Наши адракампские поселенцы полюбили красоту [Glossary('Западной Опакасии','western_opakhasia_encyclopedia_desc')]. Наша гостеприимность смешалась с жизнелюбивым духом других поселенцев, и так родился новый народ."
  establish_southlander_culture_decision_tooltip:0 "Создать культуру сонтрвентов, объединив традиции адракампов и вродкинов"
  establish_southlander_culture_decision_confirm:0 "Принять побережье"
  establish_southlander_culture_decision_effect.tt:0 "Будет создана #Y сонтрвентская#! культура, сочетающая наследие обеих родительских культур и перенимающая их новшества."
  
  ### Создание циверекской культуры ###
  establish_northlander_culture_decision:0 "Утвердить циверекскую идентичность"
  establish_northlander_culture_decision_desc:0 "Наши сьялволькские поселенцы восстановили земли [Glossary('Северной Опакасии','northern_opakhasia_encyclopedia_desc')]. К югу от Парфийского моря возник новый выносливый народ, преданный развитию и пастушескому укладу."
  establish_northlander_culture_decision_tooltip:0 "Создать культуру цивереков, объединив традиции грейлокинов и фенвиров"
  establish_northlander_culture_decision_confirm:0 "Возделывать северную землю"
  establish_northlander_culture_decision_effect.tt:0 "Будет создана #Y циверекская#! культура, сочетающая наследие обеих родительских культур и перенимающая их новшества."
  
  ### Создание остволькской культуры ###
  establish_eastlander_culture_decision:0 "Утвердить остволькскую идентичность"
  establish_eastlander_culture_decision_desc:0 "Несмотря на усилия прежних правителей, наши фенвирские поселенцы в [Glossary('Западном Айроное','western_aironoi_encyclopedia_desc')] отошли от старых путей."
  establish_eastlander_culture_decision_tooltip:0 "Создать культуру остволков на основе фенвирских традиций"
  establish_eastlander_culture_decision_confirm:0 "Выковать наш восточный путь"
  establish_eastlander_culture_decision_effect.tt:0 "Будет создана #Y остволькская#! культура, перенимающая новшества фенвиров."
  
  ### Создание сернврыкской культуры ###
  establish_sernvryki_culture_decision:0 "Утвердить сернврыкскую идентичность"
  establish_sernvryki_culture_decision_desc:0 "Наш народ гордится тем, что называет [Glossary('Выштанку','vyshtanka_encyclopedia_desc')] своим домом, но с нашего прибытия многое изменилось. Что же готовит нам будущее?"
  establish_sernvryki_culture_decision_tooltip:0 "Создать культуру сернврыков на основе варисникских традиций"
  establish_sernvryki_culture_decision_confirm:0 "Заявить права на Выштанку"
  establish_sernvryki_culture_decision_effect.tt:0 "Будет создана #Y сернврыкская#! культура, перенимающая новшества варисников."
  
  ### Создание медревской культуры ###
  establish_medrevi_culture_decision:0 "Утвердить медревскую идентичность"
  establish_medrevi_culture_decision_desc:0 "Наши поселенцы в [Glossary('Калатипсоми','kalathipsomi_encyclopedia_desc')] мирно обосновались рядом с клановцами, но мы по-прежнему высоко ценим силу."
  establish_medrevi_culture_decision_tooltip:0 "Создать культуру медревов, объединив кургерские и клановые традиции"
  establish_medrevi_culture_decision_confirm:0 "Принять нашу силу"
  establish_medrevi_culture_decision_effect.tt:0 "Будет создана #Y медревская#! культура, сочетающая наследие обеих родительских культур и перенимающая их новшества."
  
  ### Создание дрогвингской культуры ###
  establish_drogvingi_culture_decision:0 "Утвердить дрогвингскую идентичность"
  establish_drogvingi_culture_decision_desc:0 "Наше холмволькское наследие уходит корнями в глубокую древность, но мир изменился, а вместе с ним изменились и мы. Пусть в этих новых землях наш народ прославится как хранитель старых добродетелей."
  establish_drogvingi_culture_decision_tooltip:0 "Создать культуру дрогвингов на основе сьялволькских традиций"
  establish_drogvingi_culture_decision_confirm:0 "Старые пути выживут"
  establish_drogvingi_culture_decision_effect.tt:0 "Будет создана #Y дрогвингская#! культура, сочетающая наследие обеих родительских культур и перенимающая их новшества."
  
  ### Создание опакасиянской культуры ###
  establish_opakasijan_culture_decision:0 "Утвердить опакасиянскую идентичность"
  establish_opakasijan_culture_decision_desc:0 "Мы первыми высадились в Опакасии, и дух этой земли придал нам новый облик. Кто мы такие, чтобы не признать её своим новым домом?"
  establish_opakasijan_culture_decision_tooltip:0 "Создать опакасиянскую культуру на основе сьялволькских традиций"
  establish_opakasijan_culture_decision_confirm:0 "Почтить первых поселенцев"
  establish_opakasijan_culture_decision_effect.tt:0 "Будет создана #Y опакасиянская#! культура, перенимающая новшества грейлокинов."
  
  ### Создание дерещикайской культуры ###
  establish_derescicai_culture_decision:0 "Утвердить дерещикайскую идентичность"
  establish_derescicai_culture_decision_desc:0 "На побережье [Glossary('Малькои','malcois_encyclopedia_desc')] дересстайцы и сьялволки поколениями заключали браки друг с другом. Из этих союзов на этих берегах поднимается новая культура."
  establish_derescicai_culture_decision_tooltip:0 "Создать культуру дерещикайцев, объединив традиции трибоцикайцев и дересстайцев"
  establish_derescicai_culture_decision_confirm:0 "Подняться с берегов"
  establish_derescicai_culture_decision_effect.tt:0 "Будет создана #Y дерещикайская#! культура, сочетающая наследие обеих родительских культур и перенимающая их новшества."

 migrate_to_kingdom_confirm:0 "Начать переселение"
 migrate_to_kingdom_desc:0 "Мы отвоевали обширные земли у [Concept('aversaria', 'аверсарианцев')|E], и мои вассалы рвутся в путь. Хотя некоторые аверсарианцы остались на новых территориях, безумием было бы сохранять границы их некогда могучей империи. Мы создадим новые рубежи поверх старых."

