l_russian:
 found_barrow_decision_name:0 "Подготовить курган"
 found_barrow_decision_desc:0 "Моя душа однажды покинет бренную оболочку, и для персоны моего статуса положено воздвигнуть погребальное сооружение, достойное стать последним пристанищем."
 found_barrow_decision_tooltip:0 "Я создам курган, подобающий великому правителю."
 found_barrow_decision_confirm:0 "Начать разработку планов"
 found_barrow_decision_effect_tt:0 "Вы сможете выбрать масштаб кургана — каждый уровень даёт большие бонусы."

 convert_realm_feudalism_rite:0 "Учредить аристократию через обряд"
 convert_realm_feudalism_rite_desc:0 "Старые обычаи хорошо служили нам, и мы всегда будем чтить их. Однако как [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] я [Select_CString(ROOT.Char.IsFemale, 'постановила', 'постановил' )] : чтобы процветать дальше, мы должны править от имени семей, а не племён. Это следующий важный шаг на пути к величию!"
 convert_realm_feudalism_rite_tooltip:0 "Ваше государство станет [Concept('feudal', 'феодальным')|E]!"
 convert_realm_feudalism_rite_confirm:0 "Да здравствует [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"

 form_waymakers_of_velos_decision:0 "Основать Отцов Пути Велоса"
 form_waymakers_of_velos_decision_desc:0 "Некогда наш род вёл войско Верховного короля через просторы Эраса, указывая путь к новой жизни на Расколотом побережье. Теперь мы вновь примем эту миссию — вести верных Обряда по стезе Велоса."
 form_waymakers_of_velos_decision_tooltip:0 "Вы создадите Священный Орден, посвящённый Велосу!"
 form_waymakers_of_velos_decision_confirm:0 "Мы проложим путь вперёд!"
 waymakers_of_velos_formed_tooltip:0 "Сменит форму правления на [Concept('landed', 'землевладельческий')|E] [Concept('holy_order', 'орден')|E]"
 waymakers_of_velos_county_trigger:0 "Ваши владения должны находиться на [Concept('the_continent', 'Континенте')|E]"
 form_waymakers_of_velos_decision.tt.is_in_correct_region:0 "Находится в [Concept('region', 'регионе')|E] [GetGeographicalRegion('world_ga_aversarian_homelands').GetName]"

  ### Establish Svotsadi Culture ###
  establish_svotsadi_culture_decision:0 "Establish Svotsadi Identity"
  establish_svotsadi_culture_decision_desc:0 "Our settlers along the [Glossary('Pathos Delta','pathos_delta_encyclopedia_desc')] have long intermingled with the Huegodocs, blending the traditions of our ancestors with the customs of our new home."
  establish_svotsadi_culture_decision_tooltip:0 "Create the Svotsadi culture by merging Sjalvolki and Huegodocs traditions"
  establish_svotsadi_culture_decision_confirm:0 "Unite Our Peoples"
  establish_svotsadi_culture_decision_effect.tt:0 "The #Y Svotsadi#! culture is formed, combining the heritage of both parent cultures and inheriting their innovations."
  
  ### Establish Leskovych Culture ###
  establish_leskovych_culture_decision:0 "Establish Leskovych Identity"
  establish_leskovych_culture_decision_desc:0 "Our Sjalvolki warriors have learned much from the Clanlanders. Let us forge a new path, one that honors our bellicose heritage while embracing the forest traditions."
  establish_leskovych_culture_decision_tooltip:0 "Create the Leskovych culture by merging Sjalvolki and Clanlander traditions"
  establish_leskovych_culture_decision_confirm:0 "Forge Our Destiny"
  establish_leskovych_culture_decision_effect.tt:0 "The #Y Leskovych#! culture is formed, combining the heritage of both parent cultures and inheriting their innovations."
  
  ### Establish Kaskader Culture ###
  establish_kaskader_culture_decision:0 "Establish Kaskader Identity"
  establish_kaskader_culture_decision_desc:0 "The melting pot of Bastonport has given rise to a new, civic-minded people. With a great city as its heart, the 'Kaskader' identity has emerged, blending Sjalvolki traditions with the cosmopolitan spirit of the metropolis."
  establish_kaskader_culture_decision_tooltip:0 "Create the Kaskader culture, centered in Bastonport"
  establish_kaskader_culture_decision_confirm:0 "Embrace Our Urban Future"
  establish_kaskader_culture_decision_effect.tt:0 "The #Y Kaskader#! culture is formed, inheriting innovations from the Vrodkin."
  
  ### Establish Itnicavingi Culture ###
  establish_itnicavingi_culture_decision:0 "Establish Itnicavingi Identity"
  establish_itnicavingi_culture_decision_desc:0 "Our settlers in the Elysian Plains have mixed with the Mondecny for generations now, and new customs have taken shape."
  establish_itnicavingi_culture_decision_tooltip:0 "Create the Itnicavingi culture by merging Barki and Mondecny traditions"
  establish_itnicavingi_culture_decision_confirm:0 "Unite the Settlers"
  establish_itnicavingi_culture_decision_effect.tt:0 "The #Y Itnicavingi#! culture is formed, combining the heritage of both parent cultures and inheriting their innovations."
  
  ### Establish Radivolki Culture ###
  establish_radivolki_culture_decision:0 "Establish Radivolki Identity"
  establish_radivolki_culture_decision_desc:0 "In the ancient Imperial heartlands around Orispolj, the people of the Imperrech have intertwined their customs into something new. Let us honor the old ways while embracing the united spirit of our new home.."
  establish_radivolki_culture_decision_tooltip:0 "Create the Radivolki culture by merging Sjalvolki customs."
  establish_radivolki_culture_decision_confirm:0 "Claim Our Heritage"
  establish_radivolki_culture_decision_effect.tt:0 "The #Y Radivolki#! culture is formed, combining the heritage of both parent cultures and inheriting their innovations."
  
  ### Establish Pactlander Culture ###
  establish_pactlander_culture_decision:0 "Establish Pactlander Identity"
  establish_pactlander_culture_decision_desc:0 "Generations of mutually beneficial pacts in the [Glossary('Knokidbes Valley','knokidbes_encyclopedia_desc')], the disparate peoples have become one, and a new identity has emerged from these bonds of cooperation."
  establish_pactlander_culture_decision_tooltip:0 "Create the Pactlander culture by merging Tribocicai and Mondecny traditions"
  establish_pactlander_culture_decision_confirm:0 "Seal the Pact"
  establish_pactlander_culture_decision_effect.tt:0 "The #Y Pactlander#! culture is formed, combining the heritage of both parent cultures and inheriting their innovations."
  
  ### Establish Southlander Culture ###
  establish_southlander_culture_decision:0 "Establish Sontrventi Identity"
  establish_southlander_culture_decision_desc:0 "Our Adrakamp settlers have fallen in love with the beauty of [Glossary('Southern Opakasija','western_opakhasia_encyclopedia_desc')]. Blending our hospitality with the vibrant spirit of other settlers, a new people has been born."
  establish_southlander_culture_decision_tooltip:0 "Create the Sontrventi culture by merging Adrakamp and Vrodkin traditions"
  establish_southlander_culture_decision_confirm:0 "Embrace the Coast"
  establish_southlander_culture_decision_effect.tt:0 "The #Y Sontrventi#! culture is formed, combining the heritage of both parent cultures and inheriting their innovations."
  
  ### Establish Northlander Culture ###
  establish_northlander_culture_decision:0 "Establish Civereki Identity"
  establish_northlander_culture_decision_desc:0 "Our Sjalvolki settlers of [Glossary('Northern Opakasija','northern_opakhasia_encyclopedia_desc')] have rebuilt the land. With the Partharian Sea to our north, a hardy new people has emerged, devoted to growth and pastoral life."
  establish_northlander_culture_decision_tooltip:0 "Create the Civereki culture by merging Greulokin and Fenvir traditions"
  establish_northlander_culture_decision_confirm:0 "Till the Northern Soil"
  establish_northlander_culture_decision_effect.tt:0 "The #Y Civereki#! culture is formed, combining the heritage of both parent cultures and inheriting their innovations."
  
  ### Establish Eastlander Culture ###
  establish_eastlander_culture_decision:0 "Establish Ostvolki Identity"
  establish_eastlander_culture_decision_desc:0 "Despite the efforts of past rulers, our Fenvir settlers in [Glossary('Western Aironoi','western_aironoi_encyclopedia_desc')] have diverged from the old ways."
  establish_eastlander_culture_decision_tooltip:0 "Create the Ostvolk culture from Fenvir traditions"
  establish_eastlander_culture_decision_confirm:0 "Forge Our Eastern Path"
  establish_eastlander_culture_decision_effect.tt:0 "The #Y Ostvolk#! culture is formed, inheriting innovations from the Fenvir."
  
  ### Establish Sernvryki Culture ###
  establish_sernvryki_culture_decision:0 "Establish Sernvryki Identity"
  establish_sernvryki_culture_decision_desc:0 "Our people are proud to call the [Glossary('Cold Plains','vyshtanka_encyclopedia_desc')] home, but much has changed since we arrived. What might the future hold?"
  establish_sernvryki_culture_decision_tooltip:0 "Create the Sernvryki culture from Warisnik traditions"
  establish_sernvryki_culture_decision_confirm:0 "Claim the Cold Plains"
  establish_sernvryki_culture_decision_effect.tt:0 "The #Y Sernvryki#! culture is formed, inheriting innovations from the Warisnik."
  
  ### Establish Medrevi Culture ###
  establish_medrevi_culture_decision:0 "Establish Medrevi Identity"
  establish_medrevi_culture_decision_desc:0 "Our settlers in [Glossary('Kalathipsomi','kalathipsomi_encyclopedia_desc')] have settled pleasantly alongside the Clanlanders, yet we still value the power of strength."
  establish_medrevi_culture_decision_tooltip:0 "Create the Medrevi culture by merging Curgerski and Clanlander traditions"
  establish_medrevi_culture_decision_confirm:0 "Embrace Our Strength"
  establish_medrevi_culture_decision_effect.tt:0 "The #Y Medrevi#! culture is formed, combining the heritage of both parent cultures and inheriting their innovations."
  
  ### Establish Drogvingi Culture ###
  establish_drogvingi_culture_decision:0 "Establish Drogvingi Identity"
  establish_drogvingi_culture_decision_desc:0 "Our Kholmvolki heritage run deep, yet the world has changed, and us with it. Let our people be known as keepers of the old virtues in these new lands."
  establish_drogvingi_culture_decision_tooltip:0 "Create the Drogvingi culture by merging Sjalvolki"
  establish_drogvingi_culture_decision_confirm:0 "Old Ways Survive"
  establish_drogvingi_culture_decision_effect.tt:0 "The #Y Drogvingi#! culture is formed, combining the heritage of both parent cultures and inheriting their innovations."
  
  ### Establish Opakasijan Culture ###
  establish_opakasijan_culture_decision:0 "Establish Opakasijan Identity"
  establish_opakasijan_culture_decision_desc:0 "We were the first to land in Opakasija and have been shaped by the land's spirit. Who are we to deny this land as our new home?"
  establish_opakasijan_culture_decision_tooltip:0 "Create the Opakasijan culture from Sjalvolki traditions"
  establish_opakasijan_culture_decision_confirm:0 "Honor the First Landers"
  establish_opakasijan_culture_decision_effect.tt:0 "The #Y Opakasijan#! culture is formed, inheriting innovations from the Greulokin."
  
  ### Establish Derescicai Culture ###
  establish_derescicai_culture_decision:0 "Establish Derescicai Identity"
  establish_derescicai_culture_decision_desc:0 "On the coast of [Glossary('Malcois','malcois_encyclopedia_desc')], Deresstae and Sjalvolki have intermarried for generations. From these unions, a new culture rises from the shores."
  establish_derescicai_culture_decision_tooltip:0 "Create the Derescicai culture by merging Tribocicai and Deresstae traditions"
  establish_derescicai_culture_decision_confirm:0 "Rise from the Shores"
  establish_derescicai_culture_decision_effect.tt:0 "The #Y Derescicai#! culture is formed, combining the heritage of both parent cultures and inheriting their innovations."

 migrate_to_kingdom_confirm:0 "Начать переселение"
 migrate_to_kingdom_desc:0 "Мы отвоевали обширные земли у аверсарианцев, и мои вассалы рвутся в путь. Хотя некоторые аверсарианцы остались на новых территориях, безумием было бы сохранять границы их некогда могучей империи. Мы создадим новые рубежи поверх старых."

 sjalvolki_migration_give_kingdom:0 "Титул королевства перейдёт к вассалу."
 sjalvolki_migration_keep_kingdom:0 "Титул королевства останется у вас."

 sjalvolki_decisions.3003.title:0 "Королевство Сжас"
 sjalvolki_decisions.3003.desc:0 "Королевство Сжас было одним из титулов, обещанных мне и моему народу. Хотя никто не оспаривает моих прав на новое королевство, я могу передать его верному вассалу."
