 gh_disband_the_imperrech_must_be_liege_of_tinitida_desc:0 "Любой вассал владеет титулом [GetTitleByKey('c_last_light').GetNameNoTier]"
 gh_disband_the_imperrech_must_be_liege_of_asiupoli_desc:0 "Любой вассал владеет титулом [GetTitleByKey('c_asiupoli').GetNameNoTier]"
