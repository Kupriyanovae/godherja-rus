l_russian:
 gh_disband_the_imperrech_decision:0 "Распустить Имперрех"
 gh_disband_the_imperrech_decision_desc:0 "Великое переселение завершено. Я разгромил остатки [Concept('aversaria', 'Аверсарии')|E] и поселил народы Имперреха на плодородных землях, свободных от угрозы [Concept('the_fog', 'Тумана')|E]. Верховному королевству больше нет нужды существовать — пришло время распустить его, чтобы племена могли сами вершить свои судьбы."
 gh_disband_the_imperrech_decision_tooltip:0 "Я соберу вождей, чтобы объявить о роспуске Имперреха."
 gh_disband_the_imperrech_decision_effect_tt:0 "Все ещё не созданные де-юре королевские титулы в вашей державе будут дарованы самым могущественным правителям соответствующих королевств"
 gh_disband_the_imperrech_decision_effect2_tt:0 "Все королевства Имперреха получат своих де-юре вассалов"
 gh_disband_the_imperrech_decision_effect3_tt:0 "Все ваши вассалы, не являющиеся де-юре вассалами, станут независимыми"
 gh_disband_the_imperrech_decision_effect4_tt:0 "В течение 5 лет [Concept('faiths', 'конфессии')|E] Имперреха потеряют [Concept('doctrine', 'доктрину')|E] «[GetFaithDoctrine('special_doctrine_imperrech_common_goal').GetBaseName]»."
 gh_disband_the_imperrech_decision_effect5_tt:0 "В течение 15 лет [Concept('faiths', 'конфессии')|E] Имперреха потеряют [Concept('doctrine', 'доктрину')|E] «[GetFaithDoctrine('special_doctrine_imperrech_common_goal').GetBaseName]»."
 gh_disband_the_imperrech_decision_effect6_tt:0 "В течение 10 лет [Concept('faiths', 'конфессии')|E] Имперреха потеряют [Concept('doctrine', 'доктрину')|E] «[GetFaithDoctrine('special_doctrine_imperrech_common_goal').GetBaseName]»."

 gh_disband_the_imperrech_decision_confirm:0 "Распустить Имперрех"

