 sarardon_imitation_legion_desc:0 "Тяжёлая пехота, созданная изначально по образу и подобию знаменитого [Concept('aversaria','аверсарианского')|E] легиона, — с самого своего появления саррадонские легионы претерпели значительные перемены как в снаряжении, так и в боевой тактике.#!"
