 # Undead MaA
 elite_undead:0 "Элита нежити"
 elite_undead_flavor:0 "#F Наделённые куда большей силой, разумом и самостоятельностью, нежели заурядная нежить, эти грозные создания искусно справляются с положениями, в коих одна лишь численность не служит достаточным решением.#!"
 undead_skirmishers:0 "Орда нежити"
 undead_skirmishers_flavor:0 "#F Огромные орды почти безмозглых восставших мертвецов, опасных скорее своими большими числами, чем боевыми навыками.#!"
 undead_bowmen:0 "Нежить-лучники"
 undead_bowmen_flavor:0 "#F Огромные полчища почти безмозглых восставших мертвецов, опасные скорее своей многочисленностью, нежели боевым умением.#!"
 undead_dragon:0 "Дракон-нежить"
 undead_dragon_flavor:0 "#F Некогда драконы вольно парили в небесах [Concept('aeras','Эраса')|E], но после их [Concept('war_of_the_thousand_dragons','истребления')] это больше невозможно. Ныне же эти свирепые чудища, сам ужас во плоти, возвращены из мёртвых#!"
 undead_worldeater:0 "Неживой Пожиратель миров"
 undead_worldeater_desc:0 "#F Узрите, [Concept('the_worldeater','Пожирателя миров')|E]! Пусть все, кто дрожит на его пути, познают смерть!#!"

