####################################
#### GH: Missing MaA names/flavour
####################################

 # -- Undead --
 undead_war_elephant:0 "Undead War Elephants"
 undead_war_elephant_flavor:0 "Rotting behemoths driven forward by the will of their binder, tusks still splintering shields long after the beast has ceased to feel the blows it takes."
 undead_horse_archers:0 "Undead Horse Archers"
 undead_horse_archers_flavor:0 "Dead riders on dead mounts, loosing arrows in an endless circling gallop. They never tire, never break, and never dismount to rest."
 undead_camel_rider:0 "Undead Camel Riders"
 undead_camel_rider_flavor:0 "Desert-bred camels raised alongside the men who once rode them, shambling on through heat and thirst that would have killed them twice over in life."
 undead_armored_horsemen:0 "Undead Armored Horsemen"
 undead_armored_horsemen_flavor:0 "Barded corpses in the harness they were buried in, striking open ground with all the weight of a living charge and none of its hesitation."
 undead_crossbowmen:0 "Undead Crossbowmen"
 undead_crossbowmen_flavor:0 "Crank, load, loose, repeat. The dead make poor marksmen but tireless ones, and a crossbow asks very little of the hands that hold it."
 undead_pikemen_unit:0 "Undead Pikemen"
 undead_pikemen_unit_flavor:0 "A hedge of rusted points held by arms that will not waver. Cavalry breaking against them finds nothing to rout, only more pikes behind the first."
 undead_armored_footmen:0 "Undead Armored Footmen"
 undead_armored_footmen_flavor:0 "The household guard of some long-dead lord, still wearing his colours."
 undead_worldeater_flavor:0 "#F The end of all things given rotting shape, dragged back into the world by [magic|E].#!"
 raised_undead:0 "Raised Undead"
 raised_undead_flavor:0 "Freshly-turned dead pulled from whatever ground lay nearest, of little use beyond their numbers and their willingness to keep walking onto blades."

 # -- Skeletons --
 skeleton_flavor:0 "Bare bone held together by little more than intent — cheap to raise, and cheaper still to lose."
 skeleton_archers:0 "Skeleton Archers"
 skeleton_archers_flavor:0 "Fleshless fingers nocking arrows with mechanical patience. What they lack in judgement they repay by never flinching from the volley returned."

 # -- Monsters and beasts --
 woodland_hydra_flavor:0 "A many-headed horror of the deep forest, each severed neck answered by two more. Whole warbands have been swallowed piecemeal by a single specimen."
 leshens_flavor:0 "Ancient guardians of root and antler, older by far than the peoples who fear them. Walls mean little to a thing the forest itself steps aside for."
 night_gaunts_flavor:0 "Faceless and silent, they descend on a camp between one breath and the next, and are gone again before the alarm can be raised."
 lesser_voidspawns_flavor:0 "Ragged fragments of somewhere else, spilling through the thin places of the world and hungering above all for those who work the arcane."

 # -- Constructs --
 bronze_golems_flavor:0 "Cast in the old foundries and set walking by ritual, bronze golems shrug off blows that would fell a dozen men — and batter down the gate besides."
 ice_golems_flavor:0 "Hewn from glacier-ice and bound with frost, unstoppable in the cold north and pitiful anywhere the sun has teeth."
 magma_golems_flavor:0 "Molten rock held within a crust of cooling stone, leaving scorched footprints and setting alight anything unwise enough to close with them."
 stone_golems_flavor:0 "Quarried whole and given crude purpose. Slow, patient, and very nearly impossible to stop once set upon a wall."
 metal_golems_flavor:0 "The costliest of the constructs and the deadliest, wrought of worked steel and moving with a precision no living smith could match."

 # -- Spirits and magi --
 spirit_regular_flavor:0 "Bound echoes of the departed, dangerous in number but unravelling entirely wherever the arcane is choked off."
 seraph_melacham_flavor:0 "Winged and burning-eyed, the Melacham fall upon an army from above and are gone again before the survivors can name what struck them."
 dragonriders_flavor:0 "Those few who have bound a dragon to their will — and the far fewer who have survived the arrangement long enough to ride it to war."
 sarathem_magi_flavor:0 "Sarathem [magi|E] fight as a single instrument, their combined workings capable of unmaking a battle line before it ever closes."

 # -- Other --
 sarradon_imitation_legion_flavor:0 "Sarradonian levies drilled in the old imperial fashion — competent in the open field, though never quite the equal of the legions they imitate."
 slayers_flavor:0 "Professional monster-hunters who sell their expertise to whoever can meet the price, and who fear the arcane less than most."