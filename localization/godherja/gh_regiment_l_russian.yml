 lich_raocourt_event_troops:0 "Орда Раокурта"
 lich_drakavil_event_troops:0 "Восставшие Драконьего двора"
 lich_worldeater_event_troops:0 "Пожиратель миров"
 # Accolade Maa
 accolade_maa_mammothiers: "Свита боевых мамонтов"
 accolade_maa_mammothiers_flavor: "[retinue_maa|E]\n#F На поле боя есть лишь два удела — либо ты восседаешь на боевом мамонте, либо растоптан под его стопами.#!"
 accolade_maa_magi:0 "Свита магов"
 accolade_maa_magi_flavor:1 "[retinue_maa|E]\n#F Немногие [Concept('magi','маги')|E] способны владеть [Concept('magic','Даром')|E] столь искусно и столь долго, не разрушая самих себя. Страшитесь их мощи!#!"

