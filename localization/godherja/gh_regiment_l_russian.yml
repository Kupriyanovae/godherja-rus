 #MaA Descriptions
 arcane_auxiliaries_flavor:0 "Искусные мастера избранной школы магии, появление [Concept('magi','магов')|E] на поле боя, способно обратить простую стычку в океан огня и смерти.#!"
 marcher_anti_mage_flavor:0 "Лучшие из того, что могут предложить королевства марочников, эти войска прекрасно обучены сопротивляться магии и уничтожать [Concept('magi','магов')|E].#!"
 sjalvolki_berserkers_flavor:0 "Гордость каждого клана, эти ужасающие ударные отряды впадают в неистовство берсерков, равного которому нет на поле боя, и прорубают кровавую просеку сквозь вражеские ряды.#!"
 war_chariots_flavor:0 "Запряженные от одной до трех лошадей в зависимости от размера, боевые колесницы способны как проламывать ряды врага, так и поражать их на расстоянии.#!"
 magi_regular_flavor:0 "Хотя они и уступают своим [Concept('aversaria','имперским')|E] коллегам в силе, познаниях и выучке, бродячие [Concept('magi','маги')|E] во множестве стекаются на блеск монет.#!"
 shamans_flavor: "#F [Concept('aversaria','Имперский')|E] термин для не аверсарианских [Concept('magi','магов')|E] — от древних горных отшельников до простых практиков племён и кланов [Concept('aeras','Эраса')|E]. Хотя они относительно распространены, собрать их в сколь-либо значимом числе исторически оказывалось непросто, а разрозненность их дарований зачастую делает их менее действенными, чем строевые боевые маги.#!"
 cultists_maa_flavor: "#F С тех самых пор, как на существует вера, находились те [Concept('magi','маги')|E] что вершат свои [Concept('magic','ритуалы')|E] там, где не властны взоры ни богов, ни людей.#!"
 cultists_maa_quote: "\n\n#inno_quote \"Да снизойдёт тень, и да обратится всё во прах! Слава грозному Гразкулу, с коим мы заключаем сей договор!\"#!$cultists_maa_quote_attribution$"
 cultists_maa_quote_attribution: "\n  #inno_quote ~ Предполагаемое последнее таинство Культа Гноящейся Звезды пред Таригенийской преисподней#!"
 raving_zealots_flavor: "#F Хотя для практики [Concept('magic','магии')|E] обычно требуется уровень мастерства, доступный лишь сведущему и обученному [Concept('magi','магу')|E], во все времена находились безумцы, дерзавшие играть с силами, что многократно превосходят их самих, — ради целей гнусных и великих.#!"
 raving_zealots_maa_quote: "\n\n#inno_quote \"Закатат сакамаш раш, хокомус, эксомус, лаш! Вкусите мою мощь, имперские псы, я возвыс... погодите... кха!\"#!$raving_zealots_maa_quote_attribution$"
 raving_zealots_maa_quote_attribution: "\n  #inno_quote ~ Последние слова послушника культа Экара «Тенеманта»#!"
 grove_guardians_flavor:0 "Мастера маскировки, Стражи Священной рощи движутся в совершенной гармонии с самим джунглями, и они известны тем, что наводят хаос среди незваных гостей."
 jerniems_rangers_flavor:0 "Опытные следопыты и мастера дикой природы, Следопыты Джерниема патрулируют окраины Священной рощи, чтобы ничего не угрожало её священным землям."
 crimson_spears_flavor:0 "С алыми наконечниками их оружия и кроваво-красными облачениями, сверкающими на солнце, Багровые копья идут в бой как знак непокорства и гнева, и каждый их удар подпитывается кровью их священных обетов."
 molten_vanguard_flavor:0 "Копья Священного пламени используют оружие, выкованное в священных огнях храма Огня Корлаку. На поле битвы сам воздух вокруг этой грозного отряда воинов, говорят, пылает божественной яростью, их натиск так же неудержим, как и пламя, которым они повелевают."
 #placeholder
 wodes_flavor:0 "Эти воины не верят в броню, полагаясь на татуировки, которые, как они утверждают, даруют им мистическую защиту. Неистовые и, верно, безумные — но в их отваге и свирепости усомниться невозможно.#!"
 flying_lances_flavor:0 "Легендарные рыцари ойчизанцев, легенды гласят о временах, когда крылья на их спинах загорались пламенем и давали им способность летать. Хотя это искусство было забыто, их мастерство владения копьем и верховой ездой осталось неизменным.#!"
 grave_wardens_flavor:0 "Тяжеловооруженные стражи мертвых ойчизанов, эти воины славятся своей несокрушимой бронёй и ещё более сокрушительным натиском.#!"
 golden_spears_flavor:0 "Элитные солдаты, обученные и вымуштрованные в огромных городах Адабисса, Золотые копья составляют передовую линию каждой адабисской армии. Прошедшие годы муштры и учений до того, как они впервые вышли на поле боя, каждый из этих солдат не желает ничего иного, кроме как принести славу своей Империи#!"
 veiled_flavor:0 "Таинственные ведьмы Гастанводерских болот  редко показываются кому-либо, но когда они решают собраться, они наверняка дают чужакам понять, почему их стоит бояться.#!"
 the_bloodied_flavor:0 "Окровавленные — это ийросские солдаты, которые убили как минимум троих [Concept('aversaria','аверсарианцев')|E]. Броня их и луки испещрены древними письменами ийроссов — знаками, что аверсарианцы давно мнили стёртыми из памяти, — и выведены они кровью прежних господ#!"
 prophets_sons_flavor:0 "Элитные воины благородного происхождения, Сыны Пророка происходят из малых и крупных домов амсари, претендующих на происхождение от Пророка. Каждый из них сражается за честь не только своего дома, но и всего своего народа.#!"
 marcher_knights_flavor:0 "Рыцари Пути — это марчочникские рыцари, посвятившие себя совершенствованию в Пути Мечей, Очищения и Справедливости. Обычно происходящие из благородных домов, они легендарны своей приверженностью делу защиты своего народа и своих лордов.#!"
 brother_riders_flavor:0 "Братья-всадники — это сьялволки, вдохновленные более организованными рыцарскими орденами, с которыми они столкнулись и сражались на западе. Братья по клану, оседлавшие коня и взявшие копьё, рыщут ныне по Землям Кланов и за их пределами, и за их пределами в поисках славы, оберегая сельские просторы, насколько это в человеческих силах.#!"
 moonkin_flavor:0 "Родичи луны — это последователи мондернских обычаев, благословленные перед многими ликами [Concept('aervalr','Эрвала')|E]. Мастера всех восьми боевых стилей, на поле брани они являют собой зрелище столь же прекрасной грации, сколь и ужасающей разрушительной мощи.#!"
 konijkmener_pikes_flavor:0 "Различные ополчения Конейкменера издавна удерживают речные границы против марочников, чтобы обеспечить независимость своих земель. Дисциплинированные и хорошо обученные, пики Республики не дрогнут.#!"
 partic_seers_flavor:0 "Обученные друиды и их послушники, партикские провидцы неукоснительно следуют тайным наказам и повелениям своего Совета. Их мотивы неведомы — но не их могущество.#!"
 aversarian_legionaires_flavor:0 "[Concept('aversaria','Аверсария')|E]  пережила расплату сьялволков — пусть и не в прежнем обличье, — и её легионы тоже. Перестроенные и преобразованные, легионеры Аверсарии никогда более не дрогнут.#!"
 fogbeasts_flavor:0 "[Concept('fogbeasts','Туманные твари')|E] — это чудовища, которые последовали за Гарформдаэром из [Concept('the_fog','Тумана')|E]. Они принимают самые разные обличья: от от мелкой шныряющей твари до исполинских левиафанов, рожденных лишь из глубочайших страхов живых и мертвых, прошлых, нынешних и грядущих...#!"
 whisperers_flavor:0 "Шепчущие — это [Concept('fogeaters','Пожиратели тумана')|E], благословленные (или проклятые) «даром» магии. Казавшиеся бормочущими безумцами, когда-то бывшими мужчинами и женщинами, они призывают [Concept('the_fog','Туман')|E] и высвобождают разрушительную магию на поле боя.#!"
 fog_spirits_flavor:0 "Шепчущие тени и визжащие лики в [Concept('the_fog','Тумане')|E], духи Тумана — суть исключение из его же законов. Они не люди и не порождения их разума, а нечто из давно минувших времён. Бесплотные и мстительные в равной мере.#!"
 golem_infantry_flavor:0 "Золотые Статуи Вольмбаз-нза, или Города Золотых Башен, высятся на марше почти в два человеческих роста. Сработанные из золотистых металлов и движимые хитросплетением шестерён и неведомой магии, они являют собой на поле боя сокрушительное зрелище. Иные суеверные солдаты божатся, что, приложив ухо к их груди, можно услышать исполненные паники шёпоты на древних языках...#!"
 airships_flavor:0 "Полностью адабисская разработка, основанная на концепциях и технологиях, восстановленных из Города Золотых Башен. Воздушные корабли считаются безумием на севере, но в джунглях юга они все больше становятся нормой, перевозя солдат и атакуя города с воздуха.#!"
 darksteel_bombards_flavor:0 "Выкованные в палящем пламени Кузницы Корлаку из редких руд, добытых в полностью восстановленных корлаканских шахтах, бомбарды из темной стали являют собой вершину корлаканской изобретательности. Эти грозные осадные орудия, созданные из сплава, столь же непреклонного, как вера их создателей, способны сокрушать стены и сминать армии. Они символизируют мощь цивилизации, доказывая, что индустрия и прогресс превосходят хаос дикой природы.#!"
 darksteel_colossi_flavor:0 "Возвышающиеся исполины из металла и пламени, колоссы из темной стали выковываются в священных горнилах Кузницы Корлаку. Оживлённые непреклонной волей корлаканской индустрии и питаемые редкими сплавами возрождённых копей, эти механические бегемоты воплощают торжество прогресса над природой. Созданные сокрушать армии и вселять ужас в сердца врагов, они шествуют как живые монументы во славу цивилизации и неколебимой мощи Вечного Пламени.#!"
 autocrossbowmen_flavor:0 "Мундимби считаются элитой необъятной адабисской армии. они держат в руках устройства поразительной меткости, способные выпускать один болт за другим без перезарядки — благодаря хитрому механизму, что подаёт новые болты из прикреплённого короба.#!"
 golems_flavor:0 "Безжизненные глина и камень, оживлённые энергиями [Concept('aervalr','Эрвала')|E], големы способны исполнять простые и прямые указания всякого, кто знает правильное кодовое слово. Ведомые надёжными капитанами из людей, они вступают в битву без страха и колебаний.#!"
 siege_golems_flavor:0 "Титаны из глины и камня, оживленные энергиями [Concept('aervalr','Эрвала')|E], осадные големы способны в одиночку уничтожать целые полки.#!"
 griffon_riders_flavor:0 "Цвет рыцарства марочников. Гибель многих врагов Шевалье возвещала яркая вспышка среди ясного неба, а вскоре за ней — боевые кличи пикирующей в смертоносном броске эскадрильи всадников на грифонах, чьи доспехи пламенеют отражённым солнцем.#!"
 griffon_silencers_flavor:0 "Чести вылететь на грифоне в битву удостаиваются лишь лучшие бойцы, каких только способны выставить Антимагические ордена. Они кружат над полем брани, пикируя вниз, чтобы разить уязвимых [Concept('magi','магов')|E].#!"
 bloodbound_flavor:0 "Отряды воинов, поклявшихся друг другу в братстве во имя Дейфартора, Связанные кровью принесли обет отмщения всем, кто чинил несправедливость народу ийроссов. Они бьются с ужасающим упорством, применяя тактики, перенятые у своих [Concept('aversaria','аверсарианских')|E] угнетателей.#!"
 legion_raiders_flavor:0 "Легионные налётчики легко бронированы и снаряжены для стремительных манёвров и рейдов, а не для привычного боя в плотном строю — тактика, выработанная веками подавления плохо вооружённых рабских восстаний.#!"
 home_legions_flavor:0 "Древнее сердце [Concept('aversaria','Аверсарии')|E] поныне бьётся воинственным пылом. Пусть старые Легионы ушли навстречу гибели в битве у Элизийского перевала, их собратья из Внутренних легионах хранят многие из их традиций и боевых укладов.#!"
 pure_pikes_flavor:0 "С пиками в пять метров длиной и славой самоубийственной отваги, эти копейщики составляют оплот опахасийских армий. Опахасийские наставления по стратегии утверждают как неоспоримый факт: лишь эти воины во всём [Concept('aeras','Эрасе')|E] способны надёжно сдержать натиск рыцарей марочников.#!"
 legion_outriders_flavor:0 "Бескрайние равнины [Concept('aversaria','Восточной Аверсарии')|E] ставят перед военным искусством вызов, не сравнимый ни с чем на континенте. В этих землях легионные застрельщики завоевали устрашающую репутацию благодаря своему образу жизни. Они странствуют, подобно кочевникам, неделями не рассчитывая ни на что, кроме собственных кобылиц.#!"
 north_shields_flavor:0 "В этой элитной пехоте с трудом узнаются [Concept('aversaria','аверсарианские')|E] легионеры. Знамёна, несущие варварские знаки и увенчанные диковинными идолами, рееют наравне с традиционными аверсарианскими символами. Но эти странности ничуть не умаляют их боевой доблести.#!"
 legion_marines_flavor:0 "Самые скудно оплачиваемые, обойдённые вниманием и презираемые легионы во всей [Concept('aversaria','Аверсарии')|E], Морские легионы, несмотря ни на что, ведут боевой послужной список, соперничающий даже с Государственными легионами. Патрулируя самые коварные и кишащие пиратами воды мира, морские легионеры успевают побывать в десятках сражений ещё до того, как их сухопутные собратья увидят своё первое.#!"
 duneriders_flavor:0 "Целиком переняв методы ведения боя местных, Наездники дюн возникают словно из ниоткуда и вновь растворяются в пустыне, едва их кровавая работа завершилась. Иные плюются им вслед, почитая их «одичавшими», но никто не усомнится в их жестокой действенности.#!"
 stepwalkers_flavor:0 "Культы  [Concept('magi','магов')|E], прославленные своей скрытностью — или дерзким её отсутствием, смотря по тому, какой секте они хранят верность. При всём своём многообразии, эти собрания сохраняют одни из самых древних и эзотерических магических традиций в Саррадоне.#!"
 kikarsag_heavy_cav_flavor:0 "Облачённые в устрашающую личинную броню и восседающие на тяжело бронированных конях, испытанные всадники издали порой принимаются простыми солдатами за диковинную разновидность големов. Их смертоносные натиски и непревзойдённая тактика тяжёлой кавалерии обычно означают, что немного находится выживших, способных оспорить это умозаключение.#!"
 huntsmen_flavor:0 "Для кардвенского охотника не существует ни человека, ни зверя — есть лишь добыча. Украшенные головами тех, кто не сумел от них уйти, кардвенские охотничьи партии видели немногие, а ещё меньше — дожили до того, чтобы поведать об этом.#!"
 mountainstrikers_flavor:0 "Хотя их родина и осталась позади, гоанское мастерство горного боя никуда не делось, и они по-прежнему сводятся в элитные отряды горных ударников. Покуда они шествуют в поисках нового дома, то помогают своему народу одолевать самые неприступные преграды.#!"
 stoneforged_flavor:0 "Выкованные из камня — это современное переосмысление древних гоанских горных ударников, вооружённых ныне более совершенным снаряжением и разросшихся до куда большей численности. Пусть они и пожертвовали толикой подвижности своих предшественников, они с лихвой восполнили это ударной мощью, и никто не возьмётся утверждать, будто на горных кручах найдётся противник смертоноснее.#!"
 observant_flavor:0 "Наблюдатели — это братство воинов-монахов, издавна связанное с хуэгодоками. Они почитают битву лишь за очередное переживание Сновидца и достигли немалого мастерства в стрельбе из лука, дабы иметь возможность одновременно и участвовать в сих столкновениях, и наблюдать за ними.#!"
 cloud_riders_flavor:0 "#F Сарминианские всадницы наводили ужас на всю Катунскую степь, а ныне несут свою доблесть в [Concept('aversaria','Аверсарию')|E]. Они — одни из самых непревзойдённых лучниц на континенте, и молва гласит, будто они способны выбить человеку оба глаза с двух сотен шагов на полном скаку.#!"
 sunstriders_flavor:0 "#F Новый облик сарминианской войны — это тяжёлая ударная конница, сметающая всякую армию, безрассудную довольно, чтобы встать у неё на пути. Их дисциплина и воинское умение соперничают даже с прославленными рыцарями марочников.#!"
 huegodoc_legion_flavor:0 "Увидев легионы, марширующие по хуэгодокским городам, всякому простительно было бы решить, что [Concept('aversaria','аверсарианцы')|E] вернулись. Но нет — они создали собственные легионы, надеясь повторить военные успехи Аверсарии.#!"
 adventurers_flavor:0 "Стекающиеся со всех концов света, авантюристы жаждут добычи и новой земли, что можно будет назвать домом."
 adventurers_maa_flavor:0 "Стекающиеся со всех концов света, авантюристы жаждут добычи и новой земли, что можно будет назвать домом."
 legend_hunters_flavor:90 "Хорошо вооружённые и закалённые ветераны, эти авантюристы готовы бросить вызов самым могучим монстрам [Concept('aeras','Эраса')|E]."
 war_mammoth_flavor:0 "#F Украшенные ритуальными татуировками и письменами, эти мамонты несут на поле битвы ярость [Glossary( 'древнего севера', 'OLD_NORTH_GLOSS' )]!#!"
 mubaaizun_flavor:0 "Мубаризун — это чемпион [Concept('sarradon','саррадонской')|E] армии; часто лучшие воины господина сходятся в ритуальном поединке перед началом битвы, сражаясь насмерть. Эти поединки нередко сопровождаются тем, что каждая армия выкрикивает песнопения или осыпает противника оскорблениями, и бывали случаи — как, например, [Concept('battle_of_the_mubaaizun_fix','Битва мубаризунов')|E] — когда перед битвой происходило множество поединков подряд, зачастую ради отмщения за павшего мубаризуна."
 krialetil_flavor:0 "Криалетилы — это стражи гор Армазли, и являются величайшими защитниками Амагеи со дней Парназа «Великого». Полки криалетилов обучены умирать, но не уступать врагу ни пяди земли.#!"
 tsanruti_flavor:0 "Отряды цанрути составляют основную оборону чарчакских крепостей, с превосходной точностью выслеживая неприятеля. Хотя многие из них обратились к разбою с момента своего формирования, чарчакские общины по-прежнему нанимают цанрути, когда нуждаются в защитниках.#!"
 jokhosani_flavor:0 "Джохосани орудуют длинными пиками, достигающие почти восьми метров в длину, и о них никогда не забывают, когда Амагея собирает свои армии. Пусть они не славятся отвагой, известно, что джохосани оставляют в живых считаных врагов, когда они выходят на поле брани.#!"
 tskherosan_flavor:0 "Излюбленные воины махратийцев, всадники-цхеросан известны по всей Амагее своей стремительностью и безжалостностью.#!"
 sahkmavali_flavor:0 "Стражи сокрытых храмов айгаенов, сахмавали обыкновенно служат отрядами не более пятидесяти человек. Однако, несмотря на их малочисленность, сахмавали являются мастерами горной войны, чьим умениям трудно найти равных на их родной территории.#!"
 mezilachitnen_flavor:0 "Обученные обращению с длинным луком как часть придворного ритуала, самые искусные дранетские воины всегда избирались служить в мезилачитненах. Хотя их и немного, они являют собой вершину амагейских лучников.#!"
 talabhau_flavor:0 "Талабхау некогда служили элитной гвардией ванэламаку Хайтрахати; после его исчезновения любой достойный принц может призвать их на службу.#!"
 jaanvarkis_flavor:0 "Закалённые годами охоты, эти ветераны леса известны своей искусной и вместе с тем стремительной манерой боя — чем и заслужили у врагов прозвище «Вьюхаракша» — «Скользящие налётчики». При должной подготовке к современной войне из них выходят отличные застрельщики.#!"
 kanpahuri_flavor: "Умело обученные обращению топорами, кан'пахури — непревзойдённые мастера [Concept('sevra_par','Севра Пара')|E], как в бою, так и на празднествах#!"
 visvasavrak_flavor:0 "Изначально основанные для истребления полчищ нежити, вишвасавраки бьются насмерть, храня неколебимую верность их сюзерену.#!"
 kaphral_flavor:0 "Кафралы искусны во владении клинками любого рода, однако их истинное призвание — копьё: короткий и верткий дуйбиндир несёт смертоносные жала на обоих концах.#!"
 spirits_of_the_horn_flavor:0 "Духи Рога — это давно почившие могучие воители, что обрекли свои закалённые в сече души на служение [Glossary('Велосу','VELOS_GLOSS')]. Говорят, отныне и навеки служат они Чёрному Рогу, приходя на помощь тем, кто нуждается в их силе.#!"
 oltenic_light_horsemen_flavor:0 "Ольтенские всадники — наследники воинских традиций, усвоенных со времён [Concept('aironoian_migration','Айронойского переселения')|E]. Эти наездники считались одними из лучших во всей [Concept('aversaria','Аверсарии')|E].#!"
 oltenic_spearmen_flavor:0 "Ольтенские копейщики издавна специализировались на уникальных стилях боя, чтобы противостоять свирепым конным владыкам Айроноя.#!"
 oltenic_horse_archers_flavor:0 "Ольтенские лучники происходят из воинских традиций, изученных со времён [Concept('aironoian_migration','Айронойского переселения')|E]. Они славятся смертоносной меткостью и именно этим удерживают власть над степью."
 theugombrian_warrior_kinband_flavor:0 "Состоящие из сплочённых кровных братств молодых воинов, родовые ватаги странствуют по всему свету, продавая свои услуги тому, кто больше заплатит, и бьются в стальных доспехах с почти самоубийственной отвагой. Те из отрядов, что выживают, становятся ядром будущих теугомбрийских родов."
 theugombrian_iron_brotherhood_flavor:0 "Вскормленные искусствами металла и боевой магии, теугомбрийские железные братства это по сути кровные братства, сформированные вокруг магических родословных, и бьются они равно заклятьем и мечом. Их ритуалы известны тем, что наделяют клинок такой остротой, что тот рассекает кольчугу словно бумагу."
 leki_herdmasters_flavor:0 "Скотоводы по своей природе, во времена нужды леки берётся за оружие и собирается в неуловимые ватаги застрельщиков. Обращая своё знание земель на ратное дело,они бьют жестоко и стремительно, исчезая в окрестных просторах прежде, чем враг успевает ответить."
 cavern_ram_flavor:0 "Осадный пещерный таран создан для того, чтобы использовать тесное пространство подземной войны. Орудие строится низким и упирается в стены туннеля, что придаёт ему сокрушительную силу в коридорах, где надземные осадные машины были бы бесполезны. Однако под открытым небом обсидиановый наконечник слишком тяжёл для правильного манёвра, а рама лишена точек опоры, от которых полностью зависит."
 tension_trebuchet_flavor:0 "В отличие от падающего противовеса, что приводит в действие обычные требушеты, натяжной требушет использует исполинские плетёные канаты из грибных сухожилий, взращённых во влажной подземной среде, где они сохраняют упругость. Конструкция предназначена для сокрушения стен под [Glossary('Майикратией','mayikprolollan_encyclopedia_desc')]. Вытащенное на поверхность, грибное волокно под сухим воздухом затвердевает, делая орудие почти совершенно бесполезным."
 chasm_terrors_flavor:0 "Красные земли кишат самыми ужасающими и злобными тварями из всех, что ведомы на [Concept('aeras','Эрасе')|E]. Разумные бездны, полные трупов; рои гигантских ос, что неделями зреют в телах живых носителей; многорукие глаза, ползающие по стенам и разверзающие в зрачках зияющие, усеянные зубами пасти... Только жители Красных земель, кажется, каким-то образом способны приручатьих для войны, а это, увы, означает, что даже те, кто благоразумно держится от Красных земель как можно дальше, не избавлены от кошмаров, таящихся внутри."
 redland_cultists_flavor:0 "Иным из них едва минуло несколько десятилетий, но большинство пережило столетие, а то и многие века. Не знающие смерти, их чуждые человеку обличья корёжатся, послушные воле ужасных богов, коим поклоняются эти [Concept('magi','маги')|E]. Они убивают, чтобы крепнуть силой, ибо Пустота алчет изничтожения всего сущего. Особенно — жизней."
 voidhosts_flavor:0 "Быть может, некогда люди, Объятые Пустотой ныне суть «живые» источники энтропии. Безликие фигуры в капюшонах, сеющие гибель во всяком краю, куда ступает их нога, — сказания повествуют о путниках, что спускают свой капюшон посреди храмов и городов, и тысячи душ пожирает адская тьма Пустоты, заменившая им плоть. Когда красноземецы выступают на войну, сотни Объятых Пустотой можно узреть в их рядах, и мир содрогается от ужаса."
 enfleshed_grotesquerie_flavor:0 "Гротескность — это омерзительная масса из жил и костей, составленная из меньших культистов, рабов и всякого зверья, что было втянуто в эту плоть. Её гротескное обличье вселяет ужас во всякого, кто встанет против неё, и большинство предпочитает сдаться её объятиям из плоти."
 voidspawn_flavor:0 "Воплощения изначальной энтропии, порождения Пустоты суть тени, отбрасываемые силами запредельными [Concept('aeras','Эрасу')|E], — призванные на бренный план неким гнусным умыслом. Бесформенные и чуждые самому бытию, всё, что подпадает под их ласку, лишается всякого подобия жизни, порядка и устройства."
 archonarachs_flavor:0 "Придворные, слуги и камердинеры Паучьего двора, архонарахи редко появляются в [Concept('aeras','Эрасе')|E] иначе как в составе охотничьих партий и кровавых забав, устраиваемых их знатью. Размером со взрослого боевого коня, каждая из их паучьих конечностей оканчивается хитиновой кистью со смертоносными когтями, довольно крепкими, чтобы проминать металл. Архонарахи плетут себе лица из шёлка и возлагают их пред своими головогрудями, впадая в великую ярость, если к ним обращаются не сообразно их рукотворной личине."
 blade_tendrils_flavor:0 "Клинковые щупальца — самые многочисленные и, безусловно, слабейшие из отродий Пасти. Прорастая из любого трупа, что соприкоснулся с заражённой плотью, они захватывают своего носителя в жестоком взрыве внутренностей и мозгового вещества, поднимаясь на ноги шатким человекоподобным кадавром с длинным, подобным хлысту щупальцем вместо головы."
 marrowdrones_flavor:0 "Мозгокостные трутни — это охотники Пасти, чьё предназначение — сокрушать всё, что способно противиться распространению Проклятия Плоти. Заключённые в костяной экзоскелет, они не замечают смертельных ран и обрушивают на противника шквал костяных шипов, за которым следует сокрушительная атака."
 hungering_mouths_flavor:0 "Наиболее излюбленные среди детей Пасти, алчущие пасти суть колоссальные сращения плоти и кости, возвещающие пришествие Проклятия Плоти.  Бессчётные клыки, когти и костяные шипы выступают из их громоздких тел, пожирая всё окрест этих чудовищ в тщетной попытке утолить их бесконечный голод."
 bronzecast_flavor:0 "Вершина бронзовой металлургии Дахангона, бронзовые мортиры суть огромные, искусно изукрашенные пушки, что применяют порох для метания металлических снарядов, обращая в руины крепчайшие из стен."
 thorn_maidens_flavor:0 "Отточенные целой жизнью суровой боевой выучки, элитные даяркские воительницы, как говорят, несут в себе силу десяти мужей, и наводят ужас умением выслеживать врага с незримых крон джунглей."
 death_seekers_flavor:0 "[death_seekers|E] — это мастера меча, что с лёгкостью разят разом и всадника, и коня."
 sidharakyan_flavor:0 "Сидаракян — мастера изогнутых секир, коими они разят легковооружённых врагов, дерзнувших ступить на их берега."
 dhageray_flavor:0 "Воины-загерай славятся своей верностью и тем, что бьются до последнего вздоха. Едва падёт их предводитель, вся свита воинов обязана принять смерть вместе с ним."
 markwardens_flavor:0 "Гибкие и стремительные, стражи меток налагают на недругов гибельные проклятия и знаки с сокрушительным исходом."
 bluescars_flavor:0 "Грозные таларегские воины отмечены татуировками из неведомой синей краски и их свирепость внушает страх."
 war_hounds_flavor: "С тех самых пор, как на [Concept('aeras','Эрасе')|E] появились воины, рядом с ними всегда были верные псы. Как сказал некогда скорикиакаский поэт Анвиан Вийнаxич: «Ближе воину, чем щит его, — пёс, что столь быстро покоряет даже самое закованное в сталь сердце»."
 maples_marauders_flavor: "Хотя некогда отряд имел при себе лишь одну-единственную собаку, Мэйпл и её потомство стали почти легендарной сворой боевых псов."
 azmaram_flavor: "Азмарамы маршируют в ногу, наступая на врага непроницаемой стеной сверкающих щитов и острых сарисс."
 beetle_rider_flavor: "Возничие скарабейных колесниц [Glossary('Кемсара','kemsar_encyclopedia_desc')] сеяли ужас в суровых песках западного [Concept('sarradon','Саррадона')|E] с незапамятных времён."
 sandsingers_flavor: "Тафарские песцы песков — мастера песчаной [Concept('magic','магии')|E], применяющие ритуалы, что хранятся в тайне среди племён и передаются через устные предания, оберегаемые со времён до возвышения [Concept('the_first_warden','Первого Вардена')|E]."
 beetle_knight_flavor: "[Glossary('Кемсарийские','kemsar_encyclopedia_desc')] всадники на скарабеях сеяли ужас в суровых песках западного [Concept('sarradon','Саррадона')|E] с незапамятных времён."
 green_watchers_flavor: "Ветераны многих нашествий, Зелёные дозорные — ответ клановцев на вторжения как марочников, так и аверсарианцев. Они — мастера партизанской войны и хорошо знают слабости своих разнообразных властителей."
 owl_men_flavor: "Носящие знаменитые ордикинские совиные маски, эти воины — мастера как охоты, так и асимметричной войны, и стали погибелью для многих аверсарианцев и марочников."
 ocean_reavers_flavor: "The famous warrior women of Krehejad, these pirates are experts at outmaneuvering heavier infantry as well as overwhelming local city garrisons quickly and effeciently."
 
 #SARRADON STUFF:
 rayakuux_archers:0 "Лучники-раякуукс"
 rayakuux_archers1:0 "Лучники-раякуукс"
 advanced_rayakuux:0 "Корпус раякуукс"
 waranuux_spearmen:0 "Копейщики-варануукс"
 waranuux_spearmen1:0 "Копейщики-варануукс"
 advanced_waranuux:0 "Стандартизированные варануукс"
 enlevett:0 "Анлеветы"
 
 rayakuux_archers_flavor:0 "Благодаря опыту странствий сквозь самые разные климаты, лучники-раякуукс славятся умением приноровиться к любой местности. Их стрелы вылетают из просветов меж деревьев, и незримые лучники наблюдают, как падают их цели.#!"
 rayakuux_archers1_flavor:0 "Благодаря опыту странствий сквозь самые разные климаты, лучники-раякуукс славятся умением приноровиться к любой местности. Их стрелы вылетают из просветов меж деревьев, и незримые лучники наблюдают, как падают их цели.#!"
 waranuux_spearmen_flavor:0 "Закалённые в битвах копейщики-варануукс, с юных лет обучаемые ратному делу, почти не ведают страха в бою. Они сражаются искусно выделанными копьями, обращая их в прекрасный смертоносный танец и прорубая широкие просеки во вражеском строю.#!"
 advanced_rayakuux_flavor:0 "Отменно вышколенные и закалённые разнообразными походами, воины корпуса раякуукс возводят умения своих предшественников на новую ступень. Местность для них не преграда, и стрелы их находят цель даже сквозь самый густой лес.#!"
 advanced_waranuux_flavor:0 "Оснащённые превосходным снаряжением и блюдущие строгую дисциплину, современные воины-варануукс вознеслись ещё выше над простым солдатом. След опустошения, что прокладывают они сквозь всякого, кто встаёт у них на пути, порою сравнивают с последствиями бури.#!"
 enlevett_flavor:0 "Облачённые в чёрные доспехи и тёмные маски, анлеветы — элита всякой канийской армии. С юных лет обученные искусству ближнего боя и в совершенстве владеющие боевой косой, эти дисциплинированные воины несут косы, приспособленные для хвата одной рукой.#!"

 #KATHUNI STUFF:
 chinlin_iron_elephant:0 "Чинлинский железный боевой слон"
 lujian: "Лунцзяни"
 tetukor: "Тетукоры"
 kathuni_tetukor: "Тетукоры"
 yamen_troops: "Войска-ямень"
 ding: "Динг"
 qibing: "Цибин"
 guoren_fire_lancers: "Гожэньские огненные копейщики"
 chinlin_iron_elephant_flavor: "Облаченные в огромные железные доспехи, слишком тяжелые для любого человека, чинлинские железные слоны — это живые тараны. Мало какой строй способен выдержать грохот их атаки."
 lujian_flavor: "Собираемые местными магистратами по всему Катуну, луцзяни составляют основу бесчисленных армий. Их снаряжение разнится от провинции к провинции, однако одна лишь их численность делает их незаменимой силой."
 tetukor_flavor: "Вдали от открытых степей катунские наездники на зверях покорили джунгли, приручив гигантских пауков. Быстрые и неуловимые, тетукоры наносят удар там, где всадников ждут меньше всего."
 yamen_troops_flavor: "Когда-то бывшие личной охраной катунских губернаторов, войска-ямень выросли в тяжело бронированных профессионалов, славящихся своей дисциплиной и непреклонной верностью."
 ding_flavor: "Динг — это колоссальная бомбарда, чей гром способен обрушить даже самые неприступные укрепления. Ее оглушительный рёв стал мрачным знамением для защитников по всему Катуну."
 qibing_flavor: "Отобранные для службы непосредственно под началом Драконьего императора, цибини — это конные воины, для которых честь измеряется исключительно победой."
 guoren_fire_lancers_flavor: "Вооруженные пылающими огненными копьями, гожэни внушают страх как своей храбростью, так и своим оружием. Никакая жертва не будет слишком велика ради Синь Сюэ."
 #Ahridar
 mezzarb_riders:0 "Наездники на меззарбах"
 mezzarb_riders_flavor:0 "Восседая на крепких козлах-меззарбах, эти всадники с лёгкостью преодолевают любую местность, на какой запнулось бы большинство коней."
 napaq:0 "Напаки"
 napaq_flavor:0 "Обученные сводить на нет урон от налётов, напаки держат рассыпной, гибкий строй."
 rearka:0 "Реарки"
 rearka_flavor:0 "Искусные в обращении с копьём, реарки — несравненные мастера охранять вверенные им караваны."
 shemota_warriors:0 "Воины-шемоты"
 shemota_warriors_flavor:0 "Облачённые в гибкий и прочный волоконный доспех, воины-щемоты тяжело бронированы и при том сохраняют высокую подвижность."
 ahbshaani_devouts:0 "Преданные ахбшаани"
 ahbshaani_devouts_flavor:0 "Восседая на исполинских ящерах, эти святые воины следуют лишь зову Охрасика."
 
 sarradon_imitation_legion:0 "Саррадонский легион-подражатель"
 sarardon_imitation_legion_desc:0 "Тяжёлая пехота, созданная изначально по образу и подобию знаменитого [Concept('aversaria','аверсарианского')|E] легиона, — с самого своего появления саррадонские легионы претерпели значительные перемены как в снаряжении, так и в боевой тактике.#!"

 # Lich Armies
 lich_event_troops:0 "Армия мертвых"
 lich_raocourt_event_troops:0 "Орда Раокурта"
 lich_drakavil_event_troops:0 "Восставшие Драконьего двора"
 lich_worldeater_event_troops:0 "Пожиратель миров"
 # Accolade Maa
 accolade_maa_charioteers: "Retinue War Chariots"
 accolade_maa_charioteers_flavor: "[retinue_maa|E]\n#F These mighty elite chariots are a terror to behold, striking fear into the hearts of even the most valiant of foes.#!"
 accolade_maa_mammotheers: "Retinue War Mammoths"
 accolade_maa_mammotheers_flavor: "[retinue_maa|E]\n#F Only two distinct possibilities exist on the battlefield — you are either riding the War Mammoth, or are trampled under its feet.#!"
 accolade_maa_magi: "Свита магов"
 accolade_maa_magi_flavor: "[retinue_maa|E]\n#F Немногие [Concept('magi','маги')|E] способны владеть [Concept('magic','Даром')|E] столь искусно и столь долго, не разрушая самих себя. Страшитесь их мощи!#!"
 accolade_maa_anti_magi: "Свита анти-магов"
 accolade_maa_anti_magi_flavor: "[retinue_maa|E]\n#F Эти закаленные ветераны оплатили свое мастерство в [Concept('antimagic','антимагических искусствах')|E] кровью, пролитой в боях против [Concept('magi','магов')|E], [Concept('monsters','монстров')|E] и [Concept('liches','нежити')|E]#!"
 accolade_maa_silencers: "Свита грифоньих усмирителей"
 accolade_maa_silencers_flavor: "[retinue_maa|E]\n#F Горе тем, кто пал в тени рыцаря на грифоне, ибо их жизни уже сочтены.#!"
 accolade_maa_war_mastiffs: "Боевые мастифы"
 accolade_maa_war_mastiffs_flavor: "[retinue_maa|E]\n#F Издалека обученного войне мастифа вполне можно принять за пони или небольшую лошадь, хотя это заблуждение быстро рассеивается, стоит ему в ближнем бою броситься вам в горло.#!"
 accolade_maa_war_lions: "Боевые львы"
 accolade_maa_war_lions_flavor: "[retinue_maa|E]\n#F Будь то львы или любые другие крупные хищные кошки, эти звери — настоящий ужас для одиноких застрельщиков и разъездных всадников.#!"
 accolade_maa_owlbears: "Бронированные медвесычи"
 accolade_maa_owlbears_flavor: "[retinue_maa|E]\n#F Обученный медвесыч сам по себе разрушителен не меньше целого отряда, вот только #EMP куда#! менее послушен и предсказуем.#!"
 accolade_maa_bottled_oozes: "Бутылированные жижи"
 accolade_maa_bottled_oozes_flavor: "[retinue_maa|E]\n#F Хотя гигантскую жижу невозможно по-настоящему приручить или выдрессировать, ее #EMP вполне можно#! привезти на поле боя в большой бочке с свинцовой обшивкой и выпустить в приблизительном направлении врага.#!"
 accolade_maa_pseudodragons: "Псевдодраконы"
 accolade_maa_pseudodragons_flavor: "[retinue_maa|E]\n#F Псевдодраконы — это крупные, бесплодные и обычно бескрылые рептилии. Они появляются, когда чешуйчатая ящерица пожирает неисчислимое количество сородичей и претерпевает метаморфозу, многократно увеличиваясь в размерах и аппетите.#!"

##########
# Redlands Menagerie
##########
 willing_acolytes:0 "Готовые послушники"
 willing_acolytes_flavor:0 "#italic Кажется, при насильственном захвате разума что-то утрачивается, ведь иначе с чего бы теням промышлять поисками добровольных сосудов? — Амнакс Летописец, \"Наблюдения.\" Глава II."

 nascent_shadehosts:0 "Зарождающиеся вместилища теней"
 nascent_shadehosts_flavor:0 "#italic Даэлиниокс не ожидал снова увидеть своего сына. Его появление на поле боя спустя десять лет после исчезновения стало настоящим шоком. Но когда малыш Михиос побежал к отцу, он не откликнулся ни на один призыв. И когда он вонзил свой клинок сквозь плоть и органы, Даэлиниокс не увидел никакой любви за этими когда-то светлыми глазами. В них не было ни узнавания, ни печали, ни страха — и даже не было ненависти. Но кое-что в них всё же было.#!"

 manifestations_of_fear:0 "Воплощения страха"
 manifestations_of_fear_flavor:0 "Люди часто говорят, что больше всего на свете боятся пауков или высоты. Те, кто честнее, могут признаться в страхе смерти или в боязни стать ненавистными своим любимым. Но истинный страх — столь ужасающий, что его невозможно даже помыслить, — заключается в сомнении: существуют ли они на самом деле? Красноземельцы воплотили этот страх в реальность и заставят своих врагов столкнуться с ним лицом к лицу."

 living_pits:0 "Живые ямы"
 living_pits_flavor:0 "#italic \"Докладывайте, Леган. Похоже, к нам приближаются какие-то... дыры.\"\n\"Расстояние? Скорость? Размер?\"\n\"Примерно в двух днях пути к востоку — быстрее человека, но медленнее лошади, а размером примерно с городскую площадь Асиуполя. Вы сталкивались с подобным раньше, мэм?\"\n\"Нет. Но в этом жутком месте лучше подготовиться, чем тратить время на бесполезное неверие. Собирай людей, мы выступаем на север через час.\"#!"

 spider_jockeys:0 "Паучьи наездники"
 spider_jockeys_flavor:0 "#italic \"Ученые и так называемые «эксперты» выдвинули немало теорий о связанной с пауками культовой рыцарской знати: мол, забираясь к ним на спину, рыцарь спасается от их ядовитых клыков или что это исполнение пакта с Паучьим богом, или что так они наводят еще больший ужас на своих врагов... Думаю, объяснение куда проще: верховая езда на гигантском пауке — это просто восхитительно.\"#!"


