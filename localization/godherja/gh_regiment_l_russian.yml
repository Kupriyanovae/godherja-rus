 # MaA Descriptions
 golems_flavor:0 "Безжизненные глина и камень, оживлённые энергиями [Concept('aervalr','Эрвала')|E], големы способны исполнять простые и прямые указания всякого, кто знает правильное кодовое слово. Ведомые надёжными капитанами из людей, они вступают в битву без страха и колебаний.#!"


 voidspawn_flavor:0 "Воплощения изначальной энтропии, порождения Пустоты суть тени, отбрасываемые силами запредельными [Concept('aeras','Эрасу')|E], — призванные на бренный план неким гнусным умыслом. Бесформенные и чуждые самому бытию, всё, что подпадает под их ласку, лишается всякого подобия жизни, порядка и устройства."