l_english:

 # Project type
 great_project_type_great_project_glowmoss_illumination: "[Glossary('Glowmoss','GLOWMOSS_GLOSS')] Illumination"
 great_project_type_great_project_glowmoss_illumination_desc: "The [Glossary('Mayikrata','mayikprolollan_encyclopedia_desc')] runs dark and treacherous. By cultivating colonies of [Glossary('glowmoss','GLOWMOSS_GLOSS')], rulers can transform their holdings into something navigable. The process demands great investment in tunnelling, irrigation, and careful horticulture. [magi|E] may accelerate and enrich the process, binding the moss' light to an arcane pulse that outlasts any torch."

 # Contribution: Glowmoss Excavation
 great_project_type_great_project_glowmoss_illumination_contribution_glowmoss_excavation: "[Glossary('glowmoss','GLOWMOSS_GLOSS')] Excavation"
 great_project_type_great_project_glowmoss_illumination_contribution_glowmoss_excavation_desc: "A programme of tunnel preparation cuts water channels to feed the moss, smoothes surfaces for adhesion, and establishes a rotating cadre of moss-tenders to maintain the colony. This is expensive and unglamorous."

 # Contribution: Glowmoss Arcane Infusion
 great_project_type_great_project_glowmoss_illumination_contribution_glowmoss_arcane_infusion: "Arcane Infusion"
 great_project_type_great_project_glowmoss_illumination_contribution_glowmoss_arcane_infusion_desc: "A skilled practitioner channels magic directly into the cultivated moss, attuning the colonies to grow denser and emit a steadier light. The effect lasts for decades."

 # Toast: project complete
 glowmoss_illumination_project_complete: "The [Glossary('glowmoss','GLOWMOSS_GLOSS')] Illumination is Complete"
 glowmoss_illumination_project_complete_desc: "The tunnels of [ROOT.Char.GetPrimaryTitle.GetFullBaseName] now glow with a steady bioluminescent light. The [Glossary('glowmoss','GLOWMOSS_GLOSS')] building chain is now available, and the network of cultivated moss will provide lasting benefits for generations."

 # Custom tooltip: excavation unlocks building chain
 glowmoss_excavation_unlock_tooltip: "Upon project completion, unlocks the [Glossary('glowmoss','GLOWMOSS_GLOSS')] Tunnels building chain in the target county, allowing permanent development of its illuminated passages."

 # Toast: excavation contribution complete
 glowmoss_excavation_contribution_complete: "[Glossary('Glowmoss','GLOWMOSS_GLOSS')] Excavation Funded"
 glowmoss_excavation_contribution_complete_desc: "The funding has been committed and work has begun in earnest. Labourers cut channels and prepare surfaces throughout. The [Glossary('glowmoss','GLOWMOSS_GLOSS')] will follow their path."

 # Toast: arcane infusion complete
 glowmoss_arcane_infusion_complete: "Arcane Infusion Complete"
 glowmoss_arcane_infusion_complete_desc: "The [Glossary('glowmoss','GLOWMOSS_GLOSS')] colonies pulse with a cool, steady light, thanks to the [magic|E] channelled into them. The underground passages will benefit from this enhancement for decades to come."

 # Modifier names and descriptions
 mayik_glowmoss_network_modifier: "[Glossary('Glowmoss','GLOWMOSS_GLOSS')] Network"
 mayik_glowmoss_network_modifier_desc: "A county-wide network of cultivated [Glossary('glowmoss','GLOWMOSS_GLOSS')] illuminates the tunnels, improving the flow of people and supply logistics.."

 mayik_arcane_glow_modifier: "Arcane Bioluminescence"
 mayik_arcane_glow_modifier_desc: "The [Glossary('glowmoss','GLOWMOSS_GLOSS')] here pulses with an arcane light. The vitality of the glow promotes growth and commerce alike."

 GLOWMOSS_GLOSS: "Glowmoss is a rare form of moss found beneath the [Glossary('Mayikrata','mayikprolollan_encyclopedia_desc')] known for its unique ability to glow. Scholars from the school have theorized the moss feeds on the [magic|E] energies released over time throughout the structure."

 great_project_glowmoss_arcane_cost: "[magic|E] cost: #R [SCOPE.ScriptValue('mayik_glowmoss_arcane_cost')|0]#! (scales with [arcana|E])"