l_english:

 # Toast: excavation contribution complete
 glowmoss_excavation_contribution_complete: "[Glossary('Glowmoss','GLOWMOSS_GLOSS')] Excavation Funded"
 glowmoss_excavation_contribution_complete_desc: "The funding has been committed and work has begun in earnest. Labourers cut channels and prepare surfaces throughout. The [Glossary('glowmoss','GLOWMOSS_GLOSS')] will follow their path."

 # Toast: arcane infusion complete
 glowmoss_arcane_infusion_complete: "Arcane Infusion Complete"
 glowmoss_arcane_infusion_complete_desc: "The [Glossary('glowmoss','GLOWMOSS_GLOSS')] colonies pulse with a cool, steady light, thanks to the [magic|E] channelled into them. The underground passages will benefit from this enhancement for decades to come."

 # Modifier names and descriptions
 mayik_glowmoss_network_modifier: "[Glossary('Glowmoss','GLOWMOSS_GLOSS')] Network"
 mayik_glowmoss_network_modifier_desc: "A county-wide network of cultivated [Glossary('glowmoss','GLOWMOSS_GLOSS')] illuminates the tunnels, improving the flow of people and supply logistics.."

 mayik_arcane_glow_modifier: "Arcane Bioluminescence"
 mayik_arcane_glow_modifier_desc: "The [Glossary('glowmoss','GLOWMOSS_GLOSS')] here pulses with an arcane light. The vitality of the glow promotes growth and commerce alike."

 GLOWMOSS_GLOSS: "Glowmoss is a rare form of moss found beneath the [Glossary('Mayikrata','mayikprolollan_encyclopedia_desc')] known for its unique ability to glow. Scholars from the school have theorized the moss feeds on the [magic|E] energies released over time throughout the structure."

 great_project_glowmoss_arcane_cost: "[magic|E] cost: #R [SCOPE.ScriptValue('mayik_glowmoss_arcane_cost')|0]#! (scales with [arcana|E])"

 # Fortenorn Great Project
 # great_project_type_fortenorn is used by name = { desc = KEY } for the title — keep as-is
 great_project_great_project_type_fortenorn: "Expanding the Fortenorns"
 great_project_type_fortenorn: "Expanding the Fortenorns"
 great_project_type_great_project_fortenorn: "Expanding the Fortenorns"
 # The engine auto-generates desc and contribution keys from the project identifier (great_project_fortenorn)
 great_project_type_great_project_fortenorn_desc: "The Black Forts have held the northern border of [chevalie|E] for generations as a desperate patchwork of fortifications fortified and ruined over time. With sufficient resources and organization, these fortifications can be expanded, reinforced, or built anew to meet the endless tide from [the_lichdoms|E]."

 great_project_type_great_project_fortenorn_contribution_master_of_fortifications: "Master of Fortifications"
 great_project_type_great_project_fortenorn_contribution_master_of_fortifications_desc: "A Master of Fortifications must be appointed to coordinate the massive engineering effort: terrain surveys, organization of supply lines, and direction for the workers and [antimagic_orders|E]. Only the project owner or the ruler of [chevalie|E] may assume this role."

 great_project_type_great_project_fortenorn_contribution_stonework: "Stoneworks"
 great_project_type_great_project_fortenorn_contribution_stonework_desc: "The Black Forts demand an enormous quantity of dressed stone quarried from the Bastione Mountains. Road-gangs and oxen caravans must be funded for the work to proceed."

 great_project_type_great_project_fortenorn_contribution_earthworks: "Earthworks"
 great_project_type_great_project_fortenorn_contribution_earthworks_desc: "Trenches, moats, and killing fields must all be dug. This backbreaking labour is no less essential than the walls themselves, as the earthworks are what breaks the undead hordes before they can ever reach stone."

 great_project_type_great_project_fortenorn_contribution_garrison_troops: "Troop Garrisons"
 great_project_type_great_project_fortenorn_contribution_garrison_troops_desc: "A fortification without soldiers is merely a ruin. Permanent garrisons paid, provisioned, and trained, must be stationed along the border. These men and women will hold the line when the walls are tested."

 great_project_type_great_project_fortenorn_contribution_siege_defenses: "Siege Defenses"
 great_project_type_great_project_fortenorn_contribution_siege_defenses_desc: "Ballistae, repeating crossbow batteries, and counter-siege positions must be installed along the walls. The undead do not tire, but they can be made to pile up in the killing ground, and that requires the right equipment."

 great_project_type_great_project_fortenorn_contribution_anti_magic_wards: "Anti-Magic Wards"
 great_project_type_great_project_fortenorn_contribution_anti_magic_wards_desc: "No fortification on the northern border is complete without the blessings from [antimagi|E]. The dead soil must be broken with consecrated iron, lintels carved with binding runes, and walls sanctified against dark [magic|E] that drives the [undead|E]. The orders do not labor cheaply, but without their wards, walls can be feeble."

 great_project_type_great_project_fortenorn_contribution_supply_lines: "Supply Lines"
 great_project_type_great_project_fortenorn_contribution_supply_lines_desc: "Roads laid, supply depots built, and the machinery of logistics must be in place before the forts can be sustained. The northern border is harsh and remote; a garrison that runs out of food or fire falls just as surely as one that is overwhelmed."

 great_project_fortenorn_already_complete_tt: "A section of the Black Forts is already at its maximum tier in this location."

 # Fortenorn optional contribution modifiers (stacking)
 gp_fortenorn_province: "Black Fort Works: Fortification"
 gp_fortenorn_province_desc: "Investment in the walls, earthworks, and siege weapons of the Black Forts. Each contribution strengthens the garrison's capacity and makes the fort harder to assault."
 gp_fortenorn_county: "Black Fort Works: Garrison Support"
 gp_fortenorn_county_desc: "Investment in the troops, wards, and supply lines sustaining the Black Forts. Each contribution grows the levy and extends the region's logistical reach."

 # Outcome tooltip
 great_project_fortenorn_upgrades_province: "On completion: upgrades this section of the Black Forts to its next tier, or builds a new Fort where none existed."

 # Listikraxos Great Project
 LISTIKRAXOS_GLOSS: "Listikraxos (or Robber Keep) is a name for the numerous keeps built around the main traderoutes and waterways of Kalathipsomi by Marcher nobles ruling the governorate on behalf of [aversaria|E] after the conquest of the region in the [marcher_aversarian_wars|E]. While technically defeated, the Marcher nobility of the region were allowed to continue to rule by their new Aversarian overlords, and in fact greatly benefited from the extermination campaigns of the local tribes by the Legions and the following growth of Aversarian commerce in the region. Ruling as petty warlords, the various nobles would become robber barons, extracting heinous tolls from traveling merchants and local citizens with the threat of Aversarian response were they to be denied."
 great_project_type_great_project_listikraxos: "Listikraxos"
 # great_project_type_listikraxos is used by name = { desc = KEY } for the title — keep as-is
 great_project_great_project_type_listikraxos: "Restoring the [Glossary('Listikraxos','LISTIKRAXOS_GLOSS')]"
 great_project_type_listikraxos: "Restoring the [Glossary('Listikraxos','LISTIKRAXOS_GLOSS')]"
 # The engine auto-generates desc and contribution keys from the project identifier (great_project_listikraxos)
 great_project_type_great_project_listikraxos_desc: "The [Glossary('Listikraxos','LISTIKRAXOS_GLOSS')] once controlled every major road and waterway through [Glossary('Kalathipsomi','kalathipsomi_encyclopedia_desc')], extracting tolls and projecting [Concept('marchers','Marcher')|E] power across the region. Most have fallen to ruin. With sufficient resources and organization, a lord who holds one of these crumbling keeps can restore it to a defensible state, and perhaps fortify it beyond what the old barons ever managed."

 great_project_type_great_project_listikraxos_contribution_master_of_reconstruction: "Master of Reconstruction"
 great_project_type_great_project_listikraxos_contribution_master_of_reconstruction_desc: "A Master of Reconstruction must be appointed to oversee the project: survey the structural damage, organize the labor gangs, and ensure that stone and timber arrive on time. Only the project owner may assume this role."

 great_project_type_great_project_listikraxos_contribution_stonework: "Stoneworks"
 great_project_type_great_project_listikraxos_contribution_stonework_desc: "Collapsed towers and crumbling curtain walls must be rebuilt from good, quarried stone. Teams of masons and laborers need funding and transportation for the stone."

 great_project_type_great_project_listikraxos_contribution_fortification: "Fortification"
 great_project_type_great_project_listikraxos_contribution_fortification_desc: "Beyond raw masonry, the keep must be made defensible through reinforced gatehouses, new platforms, arrow slits, and murder holes. A wall is only as good as those behind it."

 great_project_type_great_project_listikraxos_contribution_garrison_troops: "Garrison Troops"
 great_project_type_great_project_listikraxos_contribution_garrison_troops_desc: "A keep without soldiers is a ruin with a roof. Permanent garrison troops must be recruited and provisioned to hold the fort, and collect tolls."

 great_project_type_great_project_listikraxos_contribution_road_works: "Road Works"
 great_project_type_great_project_listikraxos_contribution_road_works_desc: "The [Glossary('Listikraxos','LISTIKRAXOS_GLOSS')] drew their power from controlling the roads. Repairing the tollhouses that connected the keep to the surrounding road network is as important as the walls themselves."

 great_project_listikraxos_already_complete_tt: "This [Glossary('Listikraxos','LISTIKRAXOS_GLOSS')] is already at its maximum tier."

 # Listikraxos optional contribution modifiers (stacking)
 gp_listikraxos_province: "Listikraxos Works: Reconstruction"
 gp_listikraxos_province_desc: "Investment in the stone and fortifications of the Listikraxos. Each contribution makes the keep harder to raid and expands its garrison."
 gp_listikraxos_county: "Listikraxos Works: Toll Roads"
 gp_listikraxos_county_desc: "Investment in the garrison and road network of the Listikraxos. Each contribution grows tax revenues, reinforces local control, and encourages development."

 # Outcome tooltip
 great_project_listikraxos_upgrades_province: "On completion: restores this Listikraxos to its next tier."
 # Project type
 great_project_type_great_project_glowmoss_illumination: "[Glossary('Glowmoss','GLOWMOSS_GLOSS')] Illumination"
 great_project_type_great_project_glowmoss_illumination_desc: "The [Glossary('Mayikrata','mayikprolollan_encyclopedia_desc')] runs dark and treacherous. By cultivating colonies of [Glossary('glowmoss','GLOWMOSS_GLOSS')], rulers can transform their holdings into something navigable. The process demands great investment in tunnelling, irrigation, and careful horticulture. [magi|E] may accelerate and enrich the process, binding the moss' light to an arcane pulse that outlasts any torch."

 # Contribution: Glowmoss Excavation
 great_project_type_great_project_glowmoss_illumination_contribution_glowmoss_excavation: "[Glossary('Glowmoss','GLOWMOSS_GLOSS')] Excavation"
 great_project_type_great_project_glowmoss_illumination_contribution_glowmoss_excavation_desc: "A programme of tunnel preparation cuts water channels to feed the moss, smoothes surfaces for adhesion, and establishes a rotating cadre of moss-tenders to maintain the colony. This is expensive and unglamorous."

 # Contribution: Glowmoss Arcane Infusion
 great_project_type_great_project_glowmoss_illumination_contribution_glowmoss_arcane_infusion: "Arcane Infusion"
 great_project_type_great_project_glowmoss_illumination_contribution_glowmoss_arcane_infusion_desc: "A skilled practitioner channels magic directly into the cultivated moss, attuning the colonies to grow denser and emit a steadier light. The effect lasts for decades."

 # Toast: project complete
 glowmoss_illumination_project_complete: "The [Glossary('glowmoss','GLOWMOSS_GLOSS')] Illumination is Complete"
 glowmoss_illumination_project_complete_desc: "The tunnels of [ROOT.Char.GetPrimaryTitle.GetFullBaseName] now glow with a steady bioluminescent light. The [Glossary('glowmoss','GLOWMOSS_GLOSS')] building chain is now available, and the network of cultivated moss will provide lasting benefits for generations."

 # Custom tooltip: excavation unlocks building chain
 glowmoss_excavation_unlock_tooltip: "Upon project completion, unlocks the [Glossary('glowmoss','GLOWMOSS_GLOSS')] Tunnels building chain in the target county, allowing permanent development of its illuminated passages."

 # The Grand Velostadd
 great_project_type_great_project_grand_velostadd: "The Grand Velostadd"
 great_project_type_great_project_grand_velostadd_desc: "The Veloschosen calls upon every follower of the Velosgrave Rite to raise a great ceremonial temple to Velos - a seat of the faith to eclipse even the old Velostadd, and a promise carved in stone that the Rite is here to stay."
 great_project_type_great_project_grand_velostadd_contribution_velostadd_foundations: "Lay the Great Foundations"
 great_project_type_great_project_grand_velostadd_contribution_velostadd_foundations_desc: "The Veloschosen's own realm must bear the cost of the foundations, quarried and hauled from across the clanlands."
 great_project_type_great_project_grand_velostadd_contribution_velostadd_sacred_carvings: "Commission the Sacred Carvings"
 great_project_type_great_project_grand_velostadd_contribution_velostadd_sacred_carvings_desc: "The canon of the Velosgrave Rite is to be carved into the temple walls - any of the faithful may fund the carvers."
 great_project_type_great_project_grand_velostadd_contribution_velostadd_pilgrim_offerings: "Gather Pilgrim Offerings"
 great_project_type_great_project_grand_velostadd_contribution_velostadd_pilgrim_offerings_desc: "Offerings from the faithful adorn the temple in gold and amber, and hallow the giver in the eyes of Velos."
 grand_velostadd_completed_toast: "The Grand Velostadd is Complete"
 fervor_gain_grand_velostadd: "The Grand Velostadd completed"
