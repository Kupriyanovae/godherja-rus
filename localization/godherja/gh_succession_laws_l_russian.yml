 mercantile_elective_candidates_tooltip:0 "Чтобы считаться действительным кандидатом в торговой республике, персонаж должен соответствовать одному из следующих условий::\n$EFFECT_LIST_BULLET$Быть прямым вассалом текущего правителя\n$EFFECT_LIST_BULLET$Быть претендентом на титул\n$EFFECT_LIST_BULLET$Быть близким членом семьи текущего правителя"
 mercantile_elective_electors_tooltip:0 "Чтобы считаться действительным [Concept('elector','выборщиком')|E] в торговой республике, вассал должен соответствовать всем следующим условиям:\n$EFFECT_LIST_BULLET$Быть де-юре [Concept('vassal','вассалом')|E] титула, за который идёт голосование, уровня [Concept('count','графа')|E] или выше, либо прямым вассалом текущего правителя"
 stratocratic_election_law_effects:0 "\n В стратократической системе вся власть сосредоточена в руках военных и их избирателей.\n\n$EFFECT_LIST_BULLET$Кандидаты с большими армиями, большим числом [Concept('knights','рыцарей')|E], или лучшими бонусами к [Concept('martial','военному делу')|E] имеют больше шансов в этой системе.\n$EFFECT_LIST_BULLET$Выборщиками могут быть только [Concept('count','графы')|E] или выше, де-юре [Concept('vassal','вассалы')|E] [Concept('title','титула')|E], за который проводится голосование."
