 stratocratic_elective_candidates_tooltip:0 "Чтобы считаться действительным кандидатом при стратократических выборах, персонаж должен соответствовать одному из следующих условий:\n$EFFECT_LIST_BULLET$Быть прямым вассалом текущего правителя\n$EFFECT_LIST_BULLET$Быть претендентом на титул\n$EFFECT_LIST_BULLET$Быть близким членом семьи текущего правителя"
 stratocratic_elective_electors_tooltip:0 "Чтобы считаться действительным [Concept('elector','выборщиком')|E] при стратократических выборах, вассал должен соответствовать всем следующим условиям:\n$EFFECT_LIST_BULLET$Быть де-юре [Concept('vassal','вассалом')|E] титула, за который идёт голосование, уровня [Concept('count','графа')|E] или выше, либо прямым вассалом текущего правителя"
 blood_election_law_effects:0 "\nВ этой республиканской системе ничто не имеет большего значения, чем кровь. [Concept('family','Семья')|E] определяет всё, и избиратели, как правило, голосуют за кандидатов из своих [Concept('dynasties','династий')|E].\n\n$EFFECT_LIST_BULLET$Избиратели выбирают кандидатов из числа своих близких или дальних [Concept('family','родственников')|E].\n$EFFECT_LIST_BULLET$Выборщиками могут быть только [Concept('count','графы')|E] или выше, де-юре [Concept('vassal','вассалы')|E] [Concept('title','титула')|E], за который проводится голосование."
