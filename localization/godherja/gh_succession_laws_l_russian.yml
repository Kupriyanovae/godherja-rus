l_russian:
 title_succession_laws:0 "[Concept('succession_law','Законы о наследования')|E]"
 title_succession_laws_singular:0 "[Concept('succession_law','закон о наследовании')|E]"
 sjalvolki_succession_law:0 "Сьялвольский Доваткнинг"
 sjalvolki_succession_law_subname:0 "Испытание силы для всех вассалов и родичей"
 sjalvolki_succession_law_effects:0 "\n#V По сьялвольскому [Concept('dovatkning','Доваткнингу')|E], все ваши [Concept('duchy','герцогства')|E] и менее значимые [Concept('titles','титулы')|E] перейдут к назначенному [Concept('heir','наследнику')|E], но [Concept('kingdom','королевства')|E] и [Concept('empire', 'империи')|E] достанутся победителю [Concept('dovatkning','Доваткнинга')|E].#!\n\n#weak После смерти правителя все его [Concept('baronies','баронства')|E], [Concept('counties','графства')|E] и [Concept('duchies','герцогства')|E] перейдут к [Concept('player_heir', 'наследнику игрока')|E]. Все [Concept('kingdoms','королевства')|E] и [Concept('empire', 'империи')|E] достанутся победителю [Concept('dovatkning','Доваткнинга')|E], в ходе которого члены [Concept('dynasty','династии')|E], [Concept('direct_vassals', 'прямые вассалы')|E] и [Concept('claimants', 'претенденты')|E] сражаются в ритуальном поединке, иногда смертельном.#!"
 rite_succession_law:0 "Ритуальный Доваткнинг"
 rite_succession_law_subname:0 "Испытание силы для всех родичей"
 rite_succession_law_effects:0 "\n#V По ритуальному [Concept('dovatkning','Доваткнингу')|E], все ваши [Concept('duchies','герцогства')|E] и менее значимые [Concept('titles','титулы')|E] перейдут к назначенному [Concept('heir','наследнику')|E], но [Concept('kingdoms','королевства')|E] и [Concept('empire', 'империи')|E] достанутся победителю [Concept('dovatkning','Доваткнинга')|E].#!\n\n#weak После смерти правителя все его [Concept('baronies','баронства')|E], [Concept('counties','графства')|E] и [Concept('duchies','герцогства')|E] перейдут к [Concept('player_heir', 'наследнику игрока')|E]. Все [Concept('kingdoms','королевства')|E] и [Concept('empire', 'империи')|E] достанутся победителю [Concept('dovatkning','Доваткнинга')|E], в ходе которого члены [Concept('dynasty','династии')|E], [Concept('direct_vassals', 'прямые вассалы')|E] и [Concept('claimants', 'претенденты')|E] сражаются в ритуальном поединке, иногда смертельном.#!"
 aversarian_succession_law:0 "Кровавый cенат"
 aversarian_succession_law_subname:0 "Только битва может выявить чистейшую кровь"
 aversarian_succession_law_effects:0 "Основанный аавтократом Акалиониксосом в ранние дни современной [Concept('aversaria','Аверсарии')|E], [Concept('blood_senate','Кровавый сенат')|E] — это собрание высшей знати, где каждая семья отправляет одного или нескольких кандидатов на формальный турнир, чтобы выявить самого могущественного [Concept('magi','мага')|E]. В этом турнире последний выживший (мужчина или женщина) по аверсарианскому закону является законным Автократом по праву крови. Несмотря на магический подтекст, на самом деле использование заклинаний не является обязательным условием для участия, хотя только единственный Аавтократ смог прееуспеть без них."
 lawless_succession_law:0 "Право сильного"
 lawless_succession_law_subname:0 "Только самые сильные и безжалостные будут править"
 lawless_succession_law_effects:0 "\n#V $lawless_succession_law$ - при этом законе [Concept('succession','наследования')|E], [Concept('heir','наследник')|E] назначается вручную и наследует все [Concept('titles','титулы')|E], но это может быть оспорено [Concept('vassals', 'вассалами')|E] и [Concept('courtiers','придворными')|E]. Дети, не достигшие совершеннолетия, не могут наследовать, если только они не обладают исключительными личными качествами.#!"
 military_unit_succession_law:0 "Военное наследование"
 military_unit_succession_law_subname:0 "Военное правление"
 military_unit_succession_law_effectS:0 "\n# При законе [Concept('succession','наследования')|E] - $military_unit_succession_law$, [Concept('heir','наследник')|E] определяется посредством выборов претендентов на титул и наследует все [Concept('titles','титулы')|E]. Дети не могут быть наследниками."
 amsari_succession_law:0 "Кардешлик"
 amsari_succession_law_subname:0 "Заслужи трон через милость Императора"
 amsari_succession_law_effects:0 "\n#V [Concept('succession','Наследование')|E] по $amsari_succession_law$у существует со времен Пророка, впервые задумавшего Амсарийскую империю. Оно позволяет назначить наследника для наследования всех [Concept('titles','титулов')|E]. Однако также позволяет Императору «разобраться» с многочисленной семьей потенциальных претендентов.#!"
 landed_order_elective_title_succession_law:0 "Выборы землевладельческого Ордена"
 landed_order_elective_title_succession_law_effects:0 "[Concept('ruler','Правитель')|E] и все прямые [Concept('vassals', 'вассалы')|E] одной конфессии могут выдвинуть [Concept('title_heir','наследника титула)'|)E] среди магистров Ордена [Concept('ruler','правителя')|E] одной конфессии. [Concept('title_heir','Наследник титула)'|)E] унаследует все титулы высшего уровня [Concept('ruler','правителя')|E]. Вассалы будут сильно благоволить членам своей собственной клики."
 landed_order_elective_candidates:0 "Вассалы - землевладельческие ордена"
 landed_order_elective_candidates_tooltip:0 "Чтобы быть действительным кандидатом на выборах землевладельческого Ордена, персонаж должен соответствовать одному из следующих условий:\n$EFFECT_LIST_BULLET$Быть Магистром ордена и прямым вассалом текущего правителя одной конфессии\n$EFFECT_LIST_BULLET$Быть претендентом на титул той же конфессии и обладать правительством землевладельческого Ордена."
 landed_order_elective_electors:0 "Правитель и вассалы одной конфессии"
 landed_order_elective_electors_tooltip:0 "Чтобы быть действительным [Concept('elector','выборщиком')|E] при выборах землевладельческого ордена, вассал должен соответствовать всем следующим условиям:\n$EFFECT_LIST_BULLET$Быть прямым вассалом текущего правителя\n$EFFECT_LIST_BULLET$Исповедовать ту же [Concept('faith','конфессию')|E], что и текущий правитель"
 clique_military_unit_elective_title_succession_law:0 "Выборы военного подразделения"
 clique_military_unit_elective_title_succession_law_effects:0 "[Concept('ruler','Правитель')|E] и все прямые [Concept('vassals', 'вассалы')|E] могут выдвинуть [Concept('title_heir','наследника титула)'|)E] из числа прямых вассалов-предводителей военных подразделений, а также советников [Concept('ruler','правителя')|E] и близких членов семьи той же культурной группы. [Concept('title_heir','Наследник титула)'|)E]  унаследует все титулы высшего уровня [Concept('ruler','правителя')|E]. Вассалы будут сильно благоволить членам своей собственной клики."
