l_russian:
 trait_tahariat_evader:0 "Неплательщик тахариата"  
 trait_tahariat_evader_desc:0 "Этот персонаж был изобличён как неплательщик [Concept('tahariat','тахариата')|E], и тем самым отрёкся от своего законного статуса узаконенного язычника!"  
 trait_tahariat_evader_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] был изоблич[Select_CString(ROOT.Char.IsFemale, 'ена', 'ён')] как [Select_CString(ROOT.Char.IsFemale, 'неплательщица', 'неплательщик')] [Concept('tahariat','тахариата')|E], и тем самым [Select_CString(ROOT.Char.IsFemale, 'отрёклась', 'отрёкся')] от своего законного статуса [Select_CString(ROOT.Char.IsFemale, 'узаконенной язычницы', 'узаконенного язычника')]!"  