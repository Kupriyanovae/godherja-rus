l_russian:

 #west_migration
 
 west_migration.0001.t:0 "Я — владыка Запада"
 west_migration.0001.desc:0 "[Select_CString(ROOT.Char.IsFemale, 'Я сломала', 'Я сломал' )] хребет [Concept('aversaria','Аверсарии')|E], а потому по праву заслуживаю величайшую добычу. Новые империи Шеврегард, Маскив и Кейскад готовы пасть к моим ногам. Эти земли — богатейшие во всей Западной Аверсарии. Я потеряю все свои нынешние личные владения и все свои титулы, кроме основного. Если я не заберу их, они останутся у тех, кто удерживает их сейчас. Что бы я ни [Select_CString(ROOT.Char.IsFemale, 'выбрала', 'выбрал' )], миграция Сьялволькской коалиции уже началась. Земли моих вассалов радикально изменятся."
 west_migration.0001.a:0 "Эти земли станут моим новым домом"
 west_migration.0001.b:0 "Я останусь там, где нахожусь"
 
 west_migration.0002.t:0 "Новая земля для моего народа"
 west_migration.0002.desc:0 "Мой сюзерен сокрушил западных [Concept('aversaria','аверсарианцев')|E] и теперь делит добычу между своими верными вассалами. Мне, как даукени, было обещано королевство Дахаград. Мои советники предупредили меня: если я не заберу это королевство, земли моих нынешних вассалов могут отойти другим племенам, не лояльным мне. Сюзерен пообещал, что эти земли навеки станут новой родиной даукени. Если я решу переселиться, то потеряю все свои нынешние земли и титулы."
 west_migration.0002.a:0 "Эти земли станут моим новым домом"
 west_migration.0002.b:0 "Я останусь там, где нахожусь"
 
 west_migration.0003.t:0 "Конец Аверсарии"
 west_migration.0003.desc:0 "Я стою на краю того, что прежде было Восточной [Concept('aversaria','Аверсарией')|E]. Мои вассалы уже начали переселяться на эти новые земли. Хотя это означает, что конец коалиции близок, есть надежда, что этот регион станет более мирным местом, чем во времена правления аверсарианцев."
 west_migration.0003.a:0 "Конец эпохи"
 west_migration.0003.b:0 "Постойте, я тоже хочу получить свой кусок"
 
 west_migration.0004.t:0 "Конец Имперреха"
 west_migration.0004.desc:0 "Теперь, когда [Concept('aversaria','аверсарианцы')|E] развеяны по ветру, а мои вассалы обосновались на своих новых землях, собранная мной коалиция выполнила свою задачу. Мои вассалы со дня на день ждут от меня объявления о прекращении их вассальной зависимости."
 west_migration.0004.a:0 "Удачи и процветания всем племенам"
 west_migration.0004.b:0 "Вообще-то, я думаю, что нынешнее положение дел меня устраивает"