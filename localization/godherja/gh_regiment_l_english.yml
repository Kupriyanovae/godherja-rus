 # MaA Descriptions
 golems_flavor: "Lifeless clay and stone made animate by the energies of [aervalr|E], golems are capable of following simple and direct instructions from anyone who knows the correct passphrase. Guided by trusted human captains, they stride into battle without fear or hesitation.#!"

 voidspawn_flavor: "Incarnates of the primordial entropy, Voidspawn are the shadows cast by powers beyond [aeras|E], summoned on the mortal plane through some foul design. Formless and alien to the existence itself, everything that falls under their caress is stripped of any semblance of life, order, and structure."

