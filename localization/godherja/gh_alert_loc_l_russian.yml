 action_can_change_profit_level_venture: "@gold_icon! Можно изменить [Concept('gh_company_profits','уровень прибыли')|E]"
 action_can_change_profit_level_venture_label: "@gold_icon! Вы можете изменить [Concept('gh_company_profits','уровень прибыли')|E], выплачиваемый покровителям [Localize(Concatenate(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))]"
 action_can_change_profit_level_venture_desc: "Вы можете изменить долю вашего ежемесячного [Concept('income','дохода')|E], выплачиваемую покровителям [Localize(Concatenate(GetPlayer.MakeScope.Var('story_cycle_gh_company_venture').Story.MakeScope.Var('gh_company_name_variable').GetFlagName,'_name'))].$action_can_change_profit_level_venture_HELP$"
 action_can_change_profit_level_venture_click: "#I Нажмите, чтобы открыть [gh_company_venture|E]#!"
 action_can_change_profit_level_venture_HELP: "\n\n#help Более высокая доля повышает [Concept('opinion','мнение')|E] покровителей о вас, тогда как более низкая оставляет больше [Concept('gold','золота')|E] в ваших руках. Если их [opinion|E] упадет достаточно низко, они попытаются назначить кого-то другого в [gh_company_venture|E] — силой, если вы откажетесь уйти с дороги.\n\nИзменив [Concept('gh_company_profits','уровень прибыли')|E], вы не сможете менять его снова в течение 5 лет, так что выбирайте тот уровень, который сможете удерживать.#!"