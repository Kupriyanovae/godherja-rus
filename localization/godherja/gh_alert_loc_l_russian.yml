l_russian:
 action_bordering_fog:0 "Приближается [Concept('the_fog','Туман')|E]..."
 action_bordering_fog_desc:0 "Одно из ваших [Concept('county','графств')|E] граничит с [Concept('the_fog','Туманом')|E] и в скором времени может быть поглощено.\n\n#help [Concept('the_fog','Туман')|E] продолжит разрастаться по всему миру, пока не покроет всю его поверхность. Как только [counties|E] оказываются полностью объяты им, они навсегда утеряны для его жутких обитателей и никогда не могут быть возвращены.\n\nВозможно, удастся ненадолго затормозить это продвижение с помощью могущественной [Concept('magic','магии')|E], но время не ждёт.#!"
 action_bordering_fog_click:0 "#I Нажмите, чтобы посмотреть графство#!"
 report_aervalr_shard:0 "Упал осколок [Concept('aervalr','Эрвала')|E]"
 report_aervalr_shard_desc:0 "До нас дошли вести, что осколок Луны упал в [recent_aervalr_shard_county.GetName].\n\n#help С тех пор как [frodbrokna|E] расколола [aervalr|E], её обломки падают на поверхность мира. Хотя их падение может нести колоссальные разрушения, сами осколки являются мощным источником [Concept('magic','магической')|E] силы.\n\n[Concept('dead_magi','Маги Земли')|E] находят их особо полезными, поскольку обычно черпают свои силы напрямую от небесного спутника [Concept('aeras','Эраса')|E], а потому способны получать из них [Concept('magic','магию')|E] куда эффективнее.#!"
 report_aervalr_shard_click:0 "#I Нажмите, чтобы посмотреть графство#!"
 report_gedeora:0 "Удар [Concept('gedeora','гедеоры')|E]"
 report_gedeora_desc:0 "[recent_gedeora_county.Custom('GetGedeoraScaleCustomLoc')] [recent_gedeora_county.GetName]! [recent_gedeora_county.Custom('GetGedeoraPrimaryEffectCustomLoc')] Особенно сильно пострадали [recent_gedeora_county.Custom('GetGedeoraSecondaryEffectTargetCustomLoc')][recent_gedeora_county.Custom('GetGedeoraSecondaryEffectCustomLoc')]\n\n#help Могущественное [Concept('magic','магическое')|E] явление неизвестной природы и различной силы, [gedeora|E] наносит удар без предупреждения и оказывает глубокое влияние на эмоции и личность любого, кто окажется в поражённом регионе.\n\nХотя их последствия не всегда одинаковы, чаще всего они резко усиливают любые отрицательные черты характера, которые уже были у человека.#!"
 report_gedeora_click:0 "#I Нажмите, чтобы посмотреть графство#!"
 report_potent_magi:0 "Могущественный [Concept('magi','маг')|E] странствует по [Concept('aeras','Эрасу')|E]"
 report_potent_magi_desc:0 "До нас доходят вести, что [Concept('magi','маг')|E] по имени [potent_magi.GetFirstName] проявляет талант, о котором слышат разве что считанные разы за поколение.\n\n#help Выше определённого уровня силы число обладающих подобным мастерством [Concept('magi','маг')|E] во всём мире сокращается буквально до горстки людей за целое столетие. Сказать, что их способности бесценны — ничего не сказать: такие личности в одиночку воздвигали империи из ничего.#!"
 report_potent_magi_click:0 "#I Нажмите, чтобы посмотреть местонахождение персонажа#!"
 action_chevalie_will_shatter:0 "[chevalie|E] расколется"
 action_chevalie_will_shatter_desc:0 "У вас нет достаточно сильного [Concept('heir','наследника')|E], чтобы удержать трон после восшествия на престол!\n\n#help Лорды Марки пойдут только за тем, кто проявил силу и волю к правлению. [succession|E] окажется под вопросом в следующих случаях:\n\n1. Ваш [Concept('heir','наследник')|E] не вашей крови.\n2. У вашего [Concept('heir','наследника')|E] меньше 30 заслуг.\n3. У вашего [Concept('heir','наследника')|E] меньше 30% от общей суммы заслуг всех ваших детей.\n\nВ таком случае [chevalie|E] с высокой вероятностью погрузится в затяжную многостороннюю гражданскую войну.#!"
 action_chevalie_will_shatter_click:0 "#I Нажмите, чтобы посмотреть графство#!"
 action_pirate_cohesion_too_low:0 "Ваша [Concept('pirate_authority','сплоченность')|E] под угрозой"
 action_pirate_cohesion_too_low_desc:0 "У вас или у вашего [Concept('heir','наследника')|E] недостаточно высокий уровень [Concept('martial','доблести')|E] или [Concept('prestige','престижа')|E], чтобы удержать [Concept('realm','державу')|E], и в скором времени ваша держава расколется!"
 action_pirate_cohesion_too_low_click: "#I Нажмите, чтобы открыть окно персонажа#!"
 action_can_adopt_legal_tradition: "Можно принять правовую традицию"
 action_can_adopt_legal_tradition_desc: "Вы можете принять правовую традицию вашей [Concept('faith','конфессии')|E]"
 action_can_adopt_legal_tradition_click: "#I Нажмите, чтобы посмотреть конфессию#!"
 action_can_censure_vassal: "Можно [Concept('censure_interaction','осудить')|E] вассала"
 action_can_censure_vassal_desc: "Вы можете [Concept('censure_interaction','осудить')|E] вассала за коррупцию"
 action_can_censure_vassal_click: "#I Нажмите, чтобы открыть взаимодействие «[censure_interaction|E]»#!"
 gedeora_small:0 "Малая [gedeora|E] поразила"
 gedeora_medium:0 "[gedeora|E] поразила"
 gedeora_big:0 "Крупная [gedeora|E] обрушилась на обширный край с центром в"
 gedeora_huge:0 "Колоссальная [gedeora|E] сотрясла части света с центром в"
 gedeora_global:0 "Да помогут нам высшие силы, во которые мы верим, ибо [gedeora|E] легендарных размахов сотрясла весь мир! Её исток находится в"
 
 gedeora_generic_evil:0 "Сердца всех поражённых ожесточились и полны злобы."
 gedeora_bloodlust:0 "Нравы вспыхнули, старые обиды дошли до точки кипения, и волна кровопролития захлестнула регион."
 gedeora_depravity:0 "Творятся немыслимые непотребства, от крестьянина до лорда, а тошнотворная безрассудная роскошь, вероятно, вгонит всех в долги на годы вперёд."
 gedeora_ambition:0 "Весь край будто превратился в змеиное гнездо: брат восстаёт на брата, вассал на сюзерена, дитя на родителя."
 gedeora_zeal:0 "Духовное просветление охватило весь регион, и множество людей заявляют, будто воочию узрели творения самого божества."
 
