 gedeora_magic_surge:0 ", причём все они, судя по всему, ощутили усиление своих врождённых магических способностей."
 gedeora_magic_drop:0 ", причём все они, судя по всему, ощутили заметное ослабление своих врождённых магических способностей."
 gedeora_lunatic:0 ", причём все они, судя по всему, страдают от галлюцинаций и переживают полный рассудочный распад."
 gedeora_loyal:0 ", причём все они, судя по всему, исполнились непреоборимым чувством чести и верности окружающим."
 gedeora_disloyal:0 ", причём все они, судя по всему, страдают паранойей и непреодолимой жаждой предательства."
 gedeora_melancholy:0 ", причём все они, судя по всему, впали в глубочайшее уныние и утратили вкус к жизни."
 gedeora_impregnate:0 ", причём все женщины в поражённой группе, судя по всему, понесли, если не были беременны ранее."
 gedeora_barren:0 ", причём все в поражённой группе оказались поражены бесплодием."
 gedeora_death:0 ", причём все в этой группе встретили мучительную и скорую кончину."

 action_failing_colony_combined_group_label:90 "@habitability_icon! Гибнущие колонии"
 action_failing_colony_combined_group_name:90 "$action_failing_colony_combined_group_label$"
 action_failing_colony_combined_group_description:90 "Несколько ваших [Concept('colony_holding','колоний')|E] имеют отрицательный [colonization_progress|E] и находятся под угрозой гибели.\n\n#help Колония может накапливать отрицательный прогресс колонизации из-за событий, [Concept('raiding','набегов')|E] и других причин. Спустя два года гибнущая колония снова превратится в [uncolonized_wasteland|E].#!"
 action_failing_colony_label:90 "@habitability_icon! Ваша [Concept('colony_holding','колония')|E] в [landed_title.GetNameNoTierNoTooltip] под угрозой"
 action_failing_colony:90 "@habitability_icon! Гибнущая [Concept('colony_holding','колония')|E]"
 action_failing_colony_desc:90 "Ваша [Concept('colony_holding','колония')|E] в [landed_title.GetNameNoTier] имеет отрицательный [colonization_progress|E] и находится под угрозой гибели.\n\n#help Колония может накапливать отрицательный прогресс колонизации из-за событий, [Concept('raiding','набегов')|E] и других причин. Спустя два года гибнущая колония снова превратится в [uncolonized_wasteland|E].#!"
 action_failing_colony_click:90 "#I Нажмите, чтобы выбрать титул#!"
 action_failing_colony_combined_label:90 "Колония [landed_title.GetNameNoTierNoTooltip]"

