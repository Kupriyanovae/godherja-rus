 # causen - konijkmener_lifepath_55
 konijkmener_lifepath_55_title: "Последний король конейкмейнеров"
 causen_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'causen_true_link', 'causen_blank_link')]"
 konijkmener_lifepath_55_desc: "#BOL Коусен вар Хейрдванг#! часто считается последним истинным водером, или королём, [GetCultureByKey('konijkmener').GetName|V]. Он унаследовал владения своего $conen_link$ отца#! ещё ребёнком и долго боролся против Регентского совета — вплоть до Народной революции 1099 года. Пользуясь нестабильностью в молодой республике, Коусен попытался вернуть себе власть (получив лишь ограниченную поддержку) в 1115 году, но в итоге погиб в битве против $waalrijk_link$ канцелера Ваелрейка#!."
 causen_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('konijkmener_lifepath_55').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('konijkmener_lifepath_55').GetID]"
 causen_blank_link: "#V"
 konijkmener_lifepath_55_mini: "Последний истинный король конейкмейнеров..."
 konijkmener_lifepath_55_birth: "Родился [Character.GetBirthDate.GetStringShort] в [GetTitleByKey('c_gradiene').GetNameNoTier]"

 # iesdtte - konijkmener_lifepath_32
 konijkmener_lifepath_32_title: "Святая Путей Гранмаэра"
 iesdtte_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'iesdtte_true_link', 'iesdtte_blank_link')]"
 konijkmener_lifepath_32_desc: "#BOL Канцелерин Иесдте#! правила [GetTitleByKey('k_de_kanzelerij').GetBaseNameNoTier|V] лишь недолгий срок, однако её влияние оказалось вечным. Реформы Иесдте в поддержку Конклава Рокура укрепили власть Владыка Путей по всему [Glossary('Пустошью Гранмаэр','konijkmener_encyclopedia_desc')], позволив развернуть жёсткую инквизицию против языческих болот и укрепив консервативную, религиозную культуру в городах. Её гибель от рук опозоренного $maadlauw_link$ Мэдлоу Безумного#! превратила её в мученицу в глазах общества конейкмейнеров, причислив её к лику святых как «Святую Путей Гранмаэра»."
 iesdtte_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('konijkmener_lifepath_32').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('konijkmener_lifepath_32').GetID]"
 iesdtte_blank_link: "#V"
 konijkmener_lifepath_32_mini: "Святая Путей Гранмаэра..."
 konijkmener_lifepath_32_birth: "Родилась [Character.GetBirthDate.GetStringShort] в [GetTitleByKey('c_der_oord').GetNameNoTier]"

 # luijscaern - urdermantern_lifepath_4
 luijscaern_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'luijscaern_true_link', 'luijscaern_blank_link')]"
 urdermantern_lifepath_4_desc: "#BOL Канцелер Люйскаерн#!, или чаще #BOL Люйскаерн «Ожесточённый»#!, печально известен по всей [Glossary('Пустоши Гранмаэр','konijkmener_encyclopedia_desc')] своей попыткой захватить престол во время [bitter_war|El]. Его правление в качестве кацелера поначалу приветствовалось как крестьянами, так и горожанами благодаря его сильной личной армии и стремительным победам в Речных землях. Однако отношение к нему резко ухудшилось после нескольких сокрушительных поражений в боях с $chryse_link$ верховным королём $ChrysE_$#!, что привело к перевороту против Люйскаерна, организованному другими знатными домами. Его Ожесточённая война опустошила полуостров, привела к гибели нескольких знатных родов и к расправе над самим Люйскаерном и всей его семьёй в конце войны."
 luijscaern_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('urdermantern_lifepath_4').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('urdermantern_lifepath_4').GetID]"
 luijscaern_blank_link: "#V"
 urdermantern_lifepath_4_mini: "Король, которым он так и не стал..."
 urdermantern_lifepath_4_birth: "Родился [Character.GetBirthDate.GetStringShort] в [GetTitleByKey('c_offcensein').GetNameNoTier]"

