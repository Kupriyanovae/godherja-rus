 # kothexir_tharsanos - northernimperial_aversarinas_aagiokrata_112
 kothexir_tharsanos_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'kothexir_tharsanos_true_link', 'kothexir_tharsanos_blank_link')]"
 northernimperial_aversarinas_aagiokrata_112_desc: "#BOL Котексир Латеокс из Тарсаноса#! правителем Тур Сенаха и прилегающих земель с 739 по 760 год от И.С., вплоть до своего загадочного исчезновения. Поскольку он был единственным аристократом, носившим этот титул до того, как тот был объединён с титулом Архимага Майикпрололлана, в более поздних текстах его часто называют просто Котексиром (из Тарсаноса).\n\nЗаметный ранний покровитель [mayikprolollans|E] и сам усердный практик, он превратил Шпиль Тур Сенаха в центр знаний и сыграл значительную роль в составлении второго издания Конкордиального Пакта и Трактата об Надлежащей Практике. В 755 году от И.С. он также был избран Архимагом, фактически проложив путь к тому, чтобы этот титул обрел реальную политическую силу в будущем. Латеокс исчез в 760 году от И.С., не оставив прямых наследников и оставив запечатанное кровью письмо об отречении, в котором завещал все свои владения будущим Архимагам навечно, хотя юридические споры вокруг этого престолонаследия продолжались ещё долгое время в следующем десятилетии."
 kothexir_tharsanos_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('northernimperial_aversarinas_aagiokrata_112').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('northernimperial_aversarinas_aagiokrata_112').GetID]"
 kothexir_tharsanos_blank_link: "#V"
 northernimperial_aversarinas_aagiokrata_112_mini: "Единственный Котексир Тур Сенаха и один из первых архимагов..."

 # general_chyvar - kartharaddi_orphecian_1
 general_chyvar_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'general_chyvar_true_link', 'general_chyvar_blank_link')]"
 kartharaddi_orphecian_1_desc: "#BOL Чивар#! был картараддийским генералом, служившим верховным главнокомандующим военными силами Империума в Калатипсоми. Отправленный в качестве посла в Верховное Королевство Предела в 705 году от И.С., чтобы прозондировать почву на предмет подчинения бывшей аверсарианской провинции Империуму, он быстро сманипулировал существующими разногласиями в раздробленном царстве, чтобы в конечном итоге оттеснить его верховных королей и стать фактическим правителем за престолом, хотя официально никогда не занимал должности выше обычного советника. Он открыл крайне успешный новый фронт против [aversaria|E] в Мегос Калатипсоми, что истощило ресурсы Аавтократа до предела, однако так и не смог добиться достаточной поддержки от имперского престола, чтобы решительно закрепить свой успех.\n\nК его великому досаде, находящиеся под его командованием силы всё чаще изымались и переводились на более проблемные театры военных действий в Малкозисе и Амагее. К моменту восшествия на престол Эрамоса Чивар с трудом удерживал вместе «союзное царство», которым он фактически руководил, имея под своим началом лишь скелетные остатки единственного картараддийского легиона. В конечном итоге он потерпел разгромное поражение во время Великого Северного Похода Аавтократира в 728 году от И.С. и погиб при неудачной попытке убить своего врага во время переговоров."
 general_chyvar_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('kartharaddi_orphecian_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('kartharaddi_orphecian_1').GetID]"
 general_chyvar_blank_link: "#V"
 general_chyvar_mini: "Картараддийский генерал, десятилетиями угрожавший Аверсарии из Предела..."

