 # cormag - fenvir_sjalvolki_1
 cormag_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'cormag_true_link', 'cormag_blank_link')]"
 fenvir_sjalvolki_1_desc: "#BOL Кормаг Фенрус#! в юности славился невероятной свирепостью и, согласно легенде, получил прозвище «Волкодав» во время набега в возрасте шестнадцати лет, когда зубами перегрыз горло хускарлу вродкинов и после этого даже завыл — из-за чего остальные воины обратились в бегство. Позже, когда [the_fog|E|l] стала представлять всё большую угрозу, он увёл своё племя дальше на юг, а спустя десятилетие, когда стало ясно, что оставаться на севере больше нельзя, наконец решил объединить кланы фенвиров для полной миграции. $shield_eater_link$ Равмир «Щитоед»#!, вождь соседнего племени вальгров, а также его бывший соратник и союзник, стал его главным соперником и заявил, что «если старый немощный пес посмеет просить больше, чем обедки, я лично пристрелю его».\n\nКормаг разозлил большинство других племён и знатных фенвиров, когда попросту не явился на объявленный им же тинг, призванный убедить их в его праве вести их за собой. После того как племена неделю спорили о дальнейших действиях и едва не перерезали друг друга прямо на месте, Кормаг наконец прибыл вместе с тридцатью своими воинами (в основном из самого клана Фенрус) — все ещё грязный и окровавленный после дороги, а также без одного глаза. Бросив голову Равмира в шатёр для собраний — всю в следах от укусов на шее, — он объявил, что племена Фенрус и Вальгр единодушно поддерживают его притязания на лидерство. Затем он сказал собравшимся вождям, шаманам, магам и прочим, что старый пёс ждёт всех несогласных снаружи в кругу для поединков. Шатёр не покинул никто, и вскоре племена фенвиров отправились на юг, вслед за $cenware_link$ Ценваром#!."
 cormag_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('fenvir_sjalvolki_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('fenvir_sjalvolki_1').GetID]"
 cormag_blank_link: "#V"
 fenvir_sjalvolki_1_mini: "Свирепый краль клана Фенрус..."

