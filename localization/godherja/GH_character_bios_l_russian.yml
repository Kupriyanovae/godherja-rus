 # bitter_root - fenvir_sjalvolki_24
 bitter_root_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'bitter_root_true_link', 'bitter_root_blank_link')]"
 fenvir_sjalvolki_24_desc: "#BOL Ярок «Горький Корень»#!, общепризнанно самый известный сьяльволки в [Concept('aversaria','аверсарианских')|E] легендах, был хускарлом фенвиров X века. По преданию, его изгнали после того, как он не сумел защитить своего вождя во время охоты на тролля. После этого он отправился скитаться на юг Катраддии, где встретил Хартию гисрединских паладинов — странствующий отряд маршерских наёмников, к которому впоследствии примкнул. Во время выполнения заказа в Айроное Ярок спас $kyver_richyic_link$ губернатора Ричиика Матриакса#! от гибели от руки [magi|E] $morthor_link$ Мортора «Паука»#!, которого Ярок разрубил пополам своим топором.\n\nВ качестве награды Ярок был нанят личным телохранителем Матриакса. Его часто изображали на портретах вместе с губернатором, который с гордостью выставлял его напоказ перед своим двором, чтобы те могли поглазеть на могучую статуру и суровую северную внешность Ярока. Позже Матриакс отрёкся от власти в пользу своей дочери $kyver_maklenda_link$ Макленды#! и отправился в путешествие в Катун-Кай. Ярок преданно последовал за ним на восток, после чего оба исчезли со страниц истории.\n\nЯрок остался невероятно популярным народным героем, часто выступая в роли архетипа «полезного» нелюдя. В некоторых прогрессивных текстах его даже приводят в пример как доказательство несостоятельности аверсарианских представлений о превосходстве людей, что достигло пика во время Агионистских восстаний. С годами образ Ярока нередко переплетался со сказаниями о [sjaljar_jax|E], хотя истории о самом Яроке сохраняют свою самостоятельность ничуть не реже."
 bitter_root_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('fenvir_sjalvolki_24').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('fenvir_sjalvolki_24').GetID]"
 bitter_root_blank_link: "#V"
 fenvir_sjalvolki_24_mini: "Изгнанный хускарл фенвиров, телохранитель губернатора Ричиика из Айроноя..."

