 # golden_rowan - dailennir_kathanouxiac_2
 golden_rowan_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'golden_rowan_true_link', 'golden_rowan_blank_link')]"
 dailennir_kathanouxiac_2_desc: "#BOL Кин Золотая Рябина#! был одним из легендарных Двенадцати Регентов, захвативших власть после гибели $kathanouxa_link$ Короля-Чародея Катаноуксы#!. Этот прославленный воин, как говорят, провёл за свою долгую жизнь девятьсот девяносто девять сражений и вышел победителем из каждого — вплоть до тысячного, в котором и сложил голову. Он основал королевство Карнактур в $faegift_link$ Долине Фейгифт#!, а его потомки правили им до тех пор, пока их не сверг дракон $tyrandax_link$ Тирандакс#!."
 golden_rowan_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('dailennir_kathanouxiac_2').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('dailennir_kathanouxiac_2').GetID]"
 golden_rowan_blank_link: "#V"
 dailennir_kathanouxiac_2_mini: "Один из 12 регентов Катаноуксы..."

 # silver_hair - dailennir_kathanouxiac_18
 silver_hair_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'silver_hair_true_link', 'silver_hair_blank_link')]"
 dailennir_kathanouxiac_18_desc: "#BOL Карттуэн Серебряноволосая#! была одной из легендарных Двенадцати Регентов, захвативших власть после гибели $kathanouxa_link$ Короля-Чародея Катаноуксы#!. В своё время она славилась как одна из красивейших женщин в истории и как исключительно могущественная чародейка. Карттуэн являлась одной из главных претенденток на власть в пост-катаноуксианских гражданских войнах, охвативших бывшую империю, но в итоге её предал и сверг прежний сторонник Аволур «Волчонок», лишивший её зрения.\n\nЕй удалось вырваться из заточения с помощью своего давнего возлюбленного Морнегеу, после чего оба исчезли со страниц истории на следующие полтысячелетия. Они вновьявились лишь к концу VI века, обретя колоссальное могущество. С тех пор она начала подготовку к [Glossary('Войне Чёрного Тиса', 'WAR_OF_THE_BLACK_YEW_GLOSS')] и своей главной цели — претворению в жизнь И-Амантиля."
 silver_hair_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('dailennir_kathanouxiac_18').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('dailennir_kathanouxiac_18').GetID]"
 silver_hair_blank_link: "#V"
 dailennir_kathanouxiac_18_mini: "Одна из 12 регентов Катаноуксы..."

 # snowbeard - dailennir_kathanouxiac_20
 snowbeard_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'snowbeard_true_link', 'snowbeard_blank_link')]"
 dailennir_kathanouxiac_20_desc: "#BOL Элдацеу Седобород#! был одним из легендарных Двенадцати Регентов, захвативших власть после гибели $kathanouxa_link$ Короля-Чародея Катаноуксы#!. Порой его считают даже величайшим из их числа, ведь он ближе всех подошёл к воссоединению империи своего предшественника. Прожив не один век, будучи мудрым как в обыденных, так и в тайных делах, а также обладая невероятным Даром, он спланировал падение не менее четырёх других регентов, прежде чем пасть от руки $silver_hair_link$ Карттуэн Серебряноволосой#! в битве при Абанкуаре. Впрочем, и её победа оказалась недолгой — истощение после магической дуэли лишило её сил помешать предательству Аволура «Волчонка».\n\nОднако наследие Элдацеу продолжило жить: его приёмный сын $meiandun_the_exile_link$ Мейандун#! сумел бежать с остатками армии в Небесный Венец, где основал государство, которому было суждено стать самым долговечным из всех пост-катаноуксианских королевств."
 snowbeard_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('dailennir_kathanouxiac_20').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('dailennir_kathanouxiac_20').GetID]"
 snowbeard_blank_link: "#V"
 dailennir_kathanouxiac_20_mini: "Один из 12 регентов Катаноуксы..."

 # meiandun_the_exile - dailennir_kathanouxiac_21
 meiandun_the_exile_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'meiandun_the_exile_true_link', 'meiandun_the_exile_blank_link')]"
 dailennir_kathanouxiac_21_desc: "#BOL Мейандун Изгнанник#! был приёмным сыном $snowbeard_link$ Элдацеу Седоборода#!. Поначалу упрямый и вспыльчивый юноша, он под руководством Элдацеу постепенно превратился в выдающегося военачальника и достойного наследника. Увы, на самом пороге победы в битве при Абанкуаре Мейандун совершил ошибку, которая стоила им сражения, всей войны и жизни его наставника — о чём он глубоко скорбел до самого смертного часа. Он увёл свою разгромленную армию в дикие земли у подножия Железных Хребтов и основал там королевство Небесный Венец, которым его потомки правили следующие шестьсот лет."
 meiandun_the_exile_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('dailennir_kathanouxiac_21').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('dailennir_kathanouxiac_21').GetID]"
 meiandun_the_exile_blank_link: "#V"
 meiandun_the_exile_mini: "Основатель королевства Небесный Венец..."

 # arthenax - dragon_beast_1
 arthenax_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'arthenax_true_link', 'arthenax_blank_link')]"
 dragon_beast_1_desc: "#BOL Артенакс#! была [Concept('dragons','Драконом')|E], жившим с неизвестных времён вплоть до 439 года от И.С., когда она погибла от руки $aauto_aeliadias_link$ Аавтократии Элиадиас#!; принято считать, что она была последней в своём роде.\n\nАртенакс вторглась в [aversaria|E] с северо-востока в 421 году от И.С. — спустя более 200 лет после того, как драконы, как считалось, были полностью истреблены аверсарианцами. Она вместе со своими четырьмя детьми (драконами $iluthunax_link$ Илутунаксом#!, $parthagad_link$ Партагадом#!, $olaxanat_link$ Олаксанатом#! и $kutharax_link$ Кутараксом#!) опустошила большую часть Аверсарии, взимая дань с местных лордов и по своему усмотрению вырезая целые города.\n\nАртенакс полностью уничтожила более шести аверсарианских легионов и более двухсот [magi|E], пытавшихся её остановить, пока наконец не сошлась с Аавтократией Элиадиас в легендарной дуэли на юге Опахасии. Элиадиас доказала, что является сильнейшим магом своего поколения, сразив чудовище и её порождений. Магическое пламя, призванное Элиадиас, было настолько могущественным, что Артенакс сгорела дотла, а её кости превратились в обугленный камень; её останки и по сей день покоятся там, где она пала много веков назад. Хотя Артенакс считается последним живым драконом, неизвестно, откуда она явилась, а её вид считают вымершим лишь из-за отсутствия достоверных сведений о других драконах с тех пор."
 arthenax_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('dragon_beast_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('dragon_beast_1').GetID]"
 arthenax_blank_link: "#V"
 dragon_beast_1_mini: "Ужас Аверсарии, считается последним драконом..."
 dragon_beast_1_death: "Умерла [Character.GetDeathDate.GetStringShort] в [GetTitleByKey('b_phanaki').GetNameNoTier]"

