 # rene - voyagen_lifepath_8
 voyagen_lifepath_8_title: "Черный Бастард"
 rene_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'rene_true_link', 'rene_blank_link')]"
 voyagen_lifepath_8_desc: "#BOL Рене ден ва Сеньон#! родился внебрачным сыном $gardfrei_link$ верховного короля Гардфрея#! и его любовницы $elyna_link$ Элины#!. Рене дали прозвание «Черный Бастард» из-за темных волос, унаследованных от матери, и совершенно не брали в расчет как наследника престола [Concept('chevalie', 'Шевалье')|E]. Невзирая на это, Рене сохранял тесную связь с отцом и младшими братьями и даже учился воинскому делу под началом $teryn_blackclaw_link$ Терина «Черного Когтя»#!.\n\nСо временем Рене устремил свой взор за пределы Шевалье и собрал $band_of_bastards_link$ Отряд Бастардов#! — наемную роту, вместе с которой отправился странствовать по свету и добывать себе имя. Отряд Бастардов принял участие в Битве у Элизийского перевале на стороне [Concept('aversaria', 'Аверсарии')|E], где Рене прославился тем, что повел своих людей в атаку через [Concept('the_fog', 'Туман')|E], напущенный чарами врага, дабы спасти своих братьев по оружию из $crownmans_sword_link$ Роты Меча Венценосца#!. За этот дерзкий маневр Рене удостоился приветствия от самого $cenware_link$ «Сокрушителя Ведьм»#!, а спустя год воротился домой в Шевалье, дабы принять участие в разрешении кризиса, вспыхнувшего вслед за исчезновением его отца."
 rene_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('voyagen_lifepath_8').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('voyagen_lifepath_8').GetID]"
 rene_blank_link: "#V"
 voyagen_lifepath_8_mini: "«Черный Бастард» Гардфрея..."

 # ansfrei - salisian_lifepath_1
 salisian_lifepath_1_title: "Ученый Король"
 ansfrei_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'ansfrei_true_link', 'ansfrei_blank_link')]"
 salisian_lifepath_1_desc: "Родившись у $gardfrei_link$ верховного короля Гардфрея#! из [Concept('chevalie', 'Шевалье')|E], #BOL Ансфрей ден ва Сеньон#! был младшим (а после рождения $cliement_link$ Клиемана#! — средним) из законных братьев Сеньон. В отличие от старших братьев, Ансфрей так и не унаследовал отцовской жажды славы и не питал интереса к делам правления. Приняв [GetTrait('way_of_knowledge_follower').GetName( GetNullCharacter )|V], Ансфрей полностью погрузился в философию и историю, став преданным ценителем книжной мудрости.\n\nВслед за исчезновением Гардфрея Ансфрей, видя множество изъянов в порочном круге войн, из-за которого Верховное Королевство то и дело сходило в прах, решил заявить собственные права на престол. Как бы сильно он ни любил братьев, ни один из них не был способен разорвать этот круг, а потому он сплотил знать $marroux_link$ Марру#! и даже заручился поддержкой $teryn_blackclaw_link$ Терина «Черного Когтя»#!."
 ansfrei_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('salisian_lifepath_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('salisian_lifepath_1').GetID]"
 ansfrei_blank_link: "#V"
 ansfrei_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('salisian_lifepath_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('salisian_lifepath_1').GetID]"
 salisian_lifepath_1_mini: "Самый ученый из сыновей Гардфрея..."

 # benouet - voyagen_lifepath_7
 voyagen_lifepath_7_title: "Заблудшее Сердце"
 benouet_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'benouet_true_link', 'benouet_blank_link')]"
 voyagen_lifepath_7_desc: "#BOL Бенуа ден ва Сеньон#!, старший из законных братьев Сеньон, родился крепким телесно, но обделенным умом ребенком. Хотя отец и братья искренне любили Бенуа, ему с трудом давалось разумение, нужное для правления государством, из-за чего его права как наследника престола оказались под большим вопросом.\n\nКогда $gardfrei_link$ верховный король Гардфрей#! бросил [Concept('chevalie', 'Шевалье')|E] ради своего странствия, притязания Бенуа на трон поддержал дом [GetScriptedCharacterByHistoryID('voyagen_lifepath_67').GetHouse.GetName|V]. Трое старших братьев этого дома образовали Тетрархию регентов, дабы править от лица фактически неспособного к властвованию короля в $porte_bastione_link$ Порт-ден-ла-Бастион#!."
 benouet_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('voyagen_lifepath_7').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('voyagen_lifepath_7').GetID]"
 benouet_blank_link: "#V"
 voyagen_lifepath_7_mini: "Старший сын Женевьевы и Гардфрея..."

 # cliement - voyagen_lifepath_9
 voyagen_lifepath_9_title: "Дитя-Марионетка"
 cliement_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'cliement_true_link', 'cliement_blank_link')]"
 voyagen_lifepath_9_desc: "Младший из братьев Сеньон, #BOL Клиеман ден ва Сеньон#! был брошен в водоворот политики, превосходившей его детское разумение, когда его отец $gardfrei_link$ верховный король Гардфрей#! отправился в таинственный поход на север. В ходе начавшегося распада [Concept('chevalie', 'Верховного Королевства')|E] мать Клиемана $genevieve_link$ Женевьева#! увезла его из столицы, опасаясь за его жизнь. С помощью наемника $spencer_link$ Энгельмара ден ва Спенсера#! она выставила его полноценным претендентом на престол при поддержке верной знати в $varrdevet_link$ Варрдевете#!."
 cliement_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('voyagen_lifepath_9').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('voyagen_lifepath_9').GetID]"
 cliement_blank_link: "#V"
 cliement_blank_link: "#V"
 voyagen_lifepath_9_mini: "Дитя-король Варрдевета..."

