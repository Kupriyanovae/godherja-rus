 # akhasar - yonata_vidvaookeyatra_1
 akhasar_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'akhasar_true_link', 'akhasar_blank_link')]"
 yonata_vidvaookeyatra_1_desc: "Легендарный каширский генерал времён [blue_robe_revolt|E], #BOL Акхасар «Сын Многих Солнц» Санорайаттакаш'тая#! поначалу подвергался нападкам за то, что в течение пяти лет избегал открытого боя с [Concept('aversaria','аверсарианцами')|E], несмотря на их многочисленные набеги. Однако вскоре Акхасар доказал свою стратегическую проницательность: он атаковал аверсарианские легионы, когда те маршировали на юг для подавления восстания, и полностью уничтожил два легиона. Затем он повёл отряд партизан в Айроной, за одну неделю уничтожив почти все склады снабжения вдоль южной границы.\n\nПозже Акхасар появился в самом разгаре [battle_of_baytors_grave|E], сжимающий в руках, как казалось, легендарный [iorne_seld|E], к изумлению как аверсарианских, так и ольтенических воинов. Он сеял хаос в рядах аверсарианцев, сошёлся в дуэли с самим $agos_link$ Агосом Слином#!, а позже хитроумно укрылся от $jajak_link$ Яджака Отроки#! в обозе своих противников. Своё последнее появление каширский генерал совершил в [battle_for_the_aironoiakaan|E], возглавляя остатки своих партизан. Мотивы Акхасара для этой атаки остаются нераскрытыми как в сказаниях, так и в хрониках, но многие полагают, что его конечной целью было проникнуть в Айроноиакаан и похитить могущественные артефакты, хранившиеся в его нижних сводах.\n\nСовершенно неизвестно, выжил ли Акхасар в той последней битве или во время [frodbrokna|E], и великий воин навсегда исчез со страниц истории."
 akhasar_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('yonata_vidvaookeyatra_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('yonata_vidvaookeyatra_1').GetID]"
 akhasar_blank_link: "#V"
 yonata_vidvaookeyatra_1_mini: "Каширский генерал, предполагаемый владелец Йорн Сельде..."
 yonata_vidvaookeyatra_1_death: "Исчез во время [battle_for_the_aironoiakaan|E] [Character.GetDeathDate.GetStringShort]"

