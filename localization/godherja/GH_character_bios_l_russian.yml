 tasurmad_wardenism_110_mini: "Третий из мамуров клана Кафти..."

 # mamur_awqif - tasurmad_wardenism_108
 mamur_awqif_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_awqif_true_link', 'mamur_awqif_blank_link')]"
 tasurmad_wardenism_108_desc: "Известный и уважаемый судья округа $abu_lebdour_link$ Абу-Лебдур#!, #BOL Авкиф#! был провозглашен [Concept('mamuramat','Мамуром')|E] судейским корпусом в ходе последней попытки внединастической передачи власти в $central_mamuramat_link$ Центральном Мамурамате#!. В 674 году от И.С. $mamur_thalus_link$ Талус «Черные Чернила»#!, внук $mamur_zulfiqar_link$ Зульфикара#!, сверг Авкифа в ходе бескровного переворота и взял Мамурамат под свой контроль. Помилованный новым Мамуром, Авкиф провел остаток своих дней в комфортном уединении, никогда больше не возвращаясь на политическую арену."
 mamur_awqif_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_108').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_108').GetID]"
 mamur_awqif_blank_link: "#V"
 tasurmad_wardenism_108_mini: "Последний внединастический Мамур..."

 # mamur_thalus - tasurmad_wardenism_107
 mamur_thalus_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_thalus_true_link', 'mamur_thalus_blank_link')]"
 tasurmad_wardenism_107_desc: "Внук $mamur_zulfiqar_link$ Зульфикара «Молота»#!, #BOL Талус «Черные Чернила»#! сверг $mamur_awqif_link$ Мамура Авкифа#! в ходе правового переворота в 674 году от И.С., вновь монополизировав власть над $central_mamuramat_link$ Центральным Мамураматом#! в руках семьи $qafti_link$ Кафти#!. Как компетентный правитель, он совершил свое главное достижение — вызвавшее немалую тревогу у традиционалистов: взял на себя регентство в опустевшем $western_mamuramat_link$ Западном Мамурамате#! и успешно защитил его от [GetCultureByKey('amsari').GetName|V] вторжения.\n\nПозже Талус возглавил карательный контрудар вглубь земель $amsari_hiklahn_link$ Хиклана#!, разграбив ряд ключевых городов, включая сам [GetTitleByKey('c_tchouran').GetBaseNameNoTier|V]. Впоследствии он принудил $qanamsar_ashakhet_link$ Канамсара Ашахета#! к клятве о ненападении, закрепив ее «Плачущей стеной» — уникальным заклятием, созданным [sirhad|E], которое высасывало души у каждого вооруженного амсари, пытавшегося пересечь сушу и ступить на [Concept('wardenism','варденитские')|E] территории в течение следующих трех столетий.\n\nОднако мир обошел Талуса стороной: из-за языческих горных племен [GetCultureByKey('barzawa').GetName|V], восставших [GetFaithByKey('sheharddi').GetName|V], беспорядков в графиях $disuwai_county_link$ Дисувай#! и рецидивистов-[Concept('ritualism','ритуалистов')|E], Запада снова погрузился в хаос. В 707 году от И.С. Талус умер от лагерной болезни во время одной из своих многочисленных кампаний по усмирению Запада, оставив незавершенными многие проекты, главным из которых было полное подчинение западных земель."
 mamur_thalus_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_107').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_107').GetID]"
 mamur_thalus_blank_link: "#V"
 tasurmad_wardenism_107_mini: "Стойкий Мамур, защитник от амсари..."

 # mamur_umath - tasurmad_wardenism_105
 mamur_umath_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_umath_true_link', 'mamur_umath_blank_link')]"
 tasurmad_wardenism_105_desc: "Прославленный своим агрессивным ведением войны против [Concept('ritualism','ритуалистов')|E], [Concept('mamuramat','Мамур')|E] #BOL Умат#! правил бок о бок со своим братом-близнецом по имени $ansir_link$ Ансир#!, который был его главным десницей во всех делах. Однако его правление закончилось хаосом в Битве Прерванных Родословных в 719 году от И.С.: Ансир был испепелен чарами ритуалистов прямо во время сражения, а сам Умат пал в дуэли против военачальника Брейфара. Поскольку у него не было собственного potomstva, власть над $central_mamuramat_link$ Мамураматом#! перешла к его племяннику $mamur_issai_link$ Иссаю#!, который был убит всего часом позже."
 mamur_umath_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_105').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_105').GetID]"
 mamur_umath_blank_link: "#V"
 tasurmad_wardenism_105_mini: "Мамур-военачальник, павший при Прерванных Родословных..."

 # mamur_issai - tasurmad_wardenism_103
 mamur_issai_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_issai_true_link', 'mamur_issai_blank_link')]"
 tasurmad_wardenism_103_desc: "Энергичный и дерзкий воин, #BOL Иссай «Однодневный»#! был провозглашен [Concept('mamuramat','Мамуром')|E] в самый разгар Битвы Прерванных Родословных — сразу после гибели $mamur_umath_link$ Мамура Умата#! в поединке и магического испепеления законного наследника Умата (и отца Иссая) $ansir_link$ Ансира#! колдовством [Concept('ritualism','ритуалистов')|E]. Едва прошел час, как стрела поразила Иссая в горло, убив его до того, как ему успели оказать магическую помощь. Поскольку он правил всего один час, его имя часто опускают в официальных хрониках [central_mamuramat_link$ Мамуров Центра#!."
 mamur_issai_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_103').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_103').GetID]"
 mamur_issai_blank_link: "#V"
 tasurmad_wardenism_103_mini: "Мамур, правивший один день..."

 # mamur_phadash - tasurmad_wardenism_102
 mamur_phadash_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_phadash_true_link', 'mamur_phadash_blank_link')]"
 tasurmad_wardenism_102_desc: "Будучи уже стариком к моменту гибели своего кузена $mamur_umath_link$ Умата#! и племянника $mamur_issai_link$ Иссая#! в Битве Прерванных Родословных, #BOL Фадаш#!, как говорили, сохранял острый ум и громоподобный голос, несмотря на слепоту и неспособность ходить.\n\nНа его правление пришли масштабные миграции айяров в Западный Саррадон, ставшие поворотным моментом в региональных конфликтах. Фадаш даровал огромные лены диаспоре в обмен на усмирение кочевников, [GetFaithByKey('sheharddi').GetName|V] и [Concept('ritualism','ритуалистов')|E], донимавших $central_mamuramat_link$ Центральный Мамурамат#! на протяжении нескольких десятилетий.\n\nТакже именно при его власти вольный город $disuwai_county_link$ Дисувай#! был жестоко разграблен и возвращен под руку Мамура Центра, хотя эта суровая кара в долгосрочной перспективе ничуть не умерила свободолюбивый нрав горожан."
 mamur_phadash_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_102').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_102').GetID]"
 mamur_phadash_blank_link: "#V"
 mamur_phadash_blank_link: "#V"
 tasurmad_wardenism_102_mini: "Мудрый Мамур, встретивший миграцию айяров..."

 # mamur_qwatif - tasurmad_wardenism_101
 mamur_qwatif_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_qwatif_true_link', 'mamur_qwatif_blank_link')]"
 tasurmad_wardenism_101_desc: "Запомнившийся многим как святой и по-взрослому не по годам умный юноша, #BOL Кватиф#! пал жертвой Мора Черных Мух (по слухам, призванного [Concept('ritualism','ритуалистами')|E] для нападения на [Concept('wardenism','варденитских')|E] верующих), охватившего [sarradon|E] в 730 году от И.С. Последний из рода $qafti_link$ Кафти#!, Кватиф до сих пор остается популярным образом в религиозной иконографии, где его изображают как идеальный символ невинности.\n\nПосле его смерти титул Мамурамала перешел к его отцу $mamur_issan_link$ Иссану «Благословенному»#! через брак Иссана с матерью Кватифа, принцессой $samasa_link$ Самасой#!."
 mamur_qwatif_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_101').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_101').GetID]"
 mamur_qwatif_blank_link: "#V"
 tasurmad_wardenism_101_mini: "Невинный и юный Мамур..."

 # mamur_issan - tasurmad_wardenism_100
 mamur_issan_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_issan_true_link', 'mamur_issan_blank_link')]"
 tasurmad_wardenism_100_desc: "Первый [Concept('mamuramat','Мамур')|E] из династии $muhaddad_link$ Мухаддад#!, #BOL Иссан#! унаследовал титул через брак после кончины своего сына $mamur_qwatif_link$ Кватифа#!, принадлежавшего к пресекавшейся линии $qafti_link$ Кафти#!. Мирный переход власти был воспринят как божественное провидение и помог укрепить институциональную легитимность $central_mamuramat_link$ Центрального Мамурамата#!, в отличие от кровавого краха $western_mamuramat_link$ Западного Мамурамата#! в 678 году от И.С., когда Иблиди столкнулись с аналогичным кризисом престолонаследия."
 mamur_issan_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_100').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_100').GetID]"
 mamur_issan_blank_link: "#V"
 tasurmad_wardenism_100_mini: "Первый из Мамуров рода Мухаддад..."

 # mamur_manar - tasurmad_wardenism_99
 mamur_manar_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_manar_true_link', 'mamur_manar_blank_link')]"
 tasurmad_wardenism_99_desc: "#BOL Манар#! запомнился как вполне компетентный, хоть и склонный к экспериментам [Concept('mamuramat','Мамур')|E]. Он покровительствовал множеству [Concept('wardenism','варденитских')|E] ковенов по всему [sarradon|E], чьи раскопки в запретных руинах пролили свет на многие древние тайны. Изначально казавшиеся источником надежды, сделанные открытия позже стали катализаторами [Concept('the_decimation_of_sarradon','великой трагедии')|E], а сама эта политика ускорила раскол [sirhad|E] по фракционным линиям.\n\nЗа время его правления многие вожди [GetCultureByKey('barzawa').GetName|V] были повержены в боях и принуждены признать главенство [Concept('the_first_warden','Первого Вардена')|E], хотя это и не принесло долгосрочной пользы."
 mamur_manar_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_99').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_99').GetID]"
 mamur_manar_blank_link: "#V"
 tasurmad_wardenism_99_mini: "Мамур, покровительствовавший магам Саррадона..."

 # mamur_yusar - tasurmad_wardenism_7
 mamur_yusar_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_yusar_true_link', 'mamur_yusar_blank_link')]"
 tasurmad_wardenism_7_desc: "#BOL Юсар#!, правивший в качестве [Concept('mamuramat','Мамура')|E] во время событий [Concept('the_decimation_of_sarradon','Халакдуна')|E], в хрониках описывался как весьма справедливый и достойный государь. Однако после Халакдуна его характер кардинально изменился в худшую сторону.\n\nБудучи [magi|El] невероятной силы, Юсар смог укрыть себя и свою семью от худших проявлений магии, вырвавшейся на свободу в тот день. Но ценой этого стало почти смертельное [Concept('exposure_sickness','магическое истощение')|E], необратимо исказившее его разум.\n\nГоворили, что Юсара терзали непрестанные видения, суть которых он отказывался раскрывать, и что он вел беседы с невидимыми «советниками», по чьей указке совершались бесчисленные зверства. Это, вкупе с общим хаосом [the_downfall|El], в конечном счете вызвало восстание под предводительством его сына $mamur_tathtali_link$ Таттали#!, приведшее к гибели Юсара в 809 году от И.С."
 mamur_yusar_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_7').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_7').GetID]"
 mamur_yusar_blank_link: "#V"
 tasurmad_wardenism_7_mini: "Мамур времен Халакдуна, сломленный его последствиями..."

 # mamur_tathtali - tasurmad_wardenism_8
 mamur_tathtali_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_tathtali_true_link', 'mamur_tathtali_blank_link')]"
 tasurmad_wardenism_8_desc: "Первый из [Concept('the_decimation_of_sarradon','пост-халакдунских')|E] Мамуров, #BOL Таттали#! за пятьдесят шесть лет правления кардинально преобразил сам институт [mamuramat|E] и заложил новые основы [Concept('wardenism','варденитской')|E] веры. Мамур больше не делит власть наравне с равными себе пэрами. Отныне он правит как священный абсолютный монарх, защищающий верных — по крайней мере, так задумывалось в теории. В реальности эти амбиции рушились так же часто, как и достигались, а огромные расходы на содержание раздутого государственного аппарата со временем заставили Мамурамат уступить прибрежные территории [marchers|E] и [Concept('aversaria','аверсарианцам')|E].\n\nЧто касается самого Таттали, историки считают его правление успешным перед лицом нарастающей анархии [the_downfall|E|l]. Взойдя на престол в 809 году от И.С. после победы над своим $mamur_yusar_link$ обезумевшим от магии отцом#! в гражданской войне, он вступил в брак с $sanad_link$ Санад#!, и их совместное равное правление до сих пор остается любимой темой поэтов и певцов. Неудивительно, что современная ветвь варденизма носит его имя, а сам он почитается как второй основатель веры — настолько велико было его влияние."
 mamur_tathtali_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_8').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_8').GetID]"
 mamur_tathtali_blank_link: "#V"
 tasurmad_wardenism_8_mini: "Основатель современного варденизма..."

 # sanad - tasurmad_wardenism_66
 sanad_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'sanad_true_link', 'sanad_blank_link')]"
 tasurmad_wardenism_66_desc: "Поэтесса, полководец, героиня и изгнанница, #BOL Санад#! — пожалуй, важнейшая женщина в [Concept('sarradon','саррадонской')|E] истории эпохи после [Concept('the_decimation_of_sarradon','Халакдуна')|E], почитаемая сегодня как мать современного [mamuramat|E]. Она была дочерью и единственной выжившей родственницей восточного Мамура аль-Худи; абсолютно каждый её сородич вплоть до пятого колена сгорел в ярости тайной магии — судьба, которую историки считают доказательством того, что аль-Худи был прямой целью магов-[Concept('ritualism','ритуалистов')|E], ответственных за Уничтожение.\n\nВнужденная сражаться за выживание, Санад, хоть и не готовилась к роли военачальника, проявила себя блестящим лидером, сплотив остатки армий своей семьи, когда $eastern_mamuramat_link$ Восточный Мамурамат#! вел войну за жизнь на десятке фронтов. Увы, несмотря на её храбрость и стратегический талант, врагов было слишком много, и поражение в Битве при Азареке вынудило её бежать, пока Мамурамат рушился за её спиной.\n\nПрибыв ко двору новоиспеченного Центрального Мамура $mamur_tathtali_link$ Таттали#! в 810 году от И.С., она обменяла свой оспариваемый титул на союз, скрепив его браком. Хотя она лично планировала последующие отвоевательные войны против Востока, ресурсы объединенного Мамурамата были поглощены внутренними междоусобицами из-за нарастающего хаоса [the_downfall|El], и отбить удалось лишь несколько приграничных провинций. Она скончалась от естественных причин в 832 году от И.С., но ее наследие в культурных и политических институтах современного [wardenism|E] живет и по сей день."
 sanad_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_66').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_66').GetID]"
 sanad_blank_link: "#V"
 tasurmad_wardenism_66_mini: "Поэтесса, генералиссимус и реформатор, мать Мамурамата..."

 # mamur_usamar - tasurmad_wardenism_9
 mamur_usamar_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_usamar_true_link', 'mamur_usamar_blank_link')]"
 tasurmad_wardenism_9_desc: "Сын $sanad_link$ Санад#! и $mamur_tathtali_link$ Таттали#!, #BOL Усамар#! был вторым сыном и конечным наследником легендарной четы. Его помнят как умелого правителя, продолжившего усилия своего отца по укреплению позиций $central_mamuramat_link$ Мамурамата#!. В ходе его военных походов (руководимых главным образом его генералиссимусом Зайдом) Мамурамат успешно отвоевал большую часть северного побережья региона [GetGeographicalRegion('kharadamat_biozone').GetName|V] и спас Удалию, разгромив возродившихся [Concept('ritualism','ритуалистов')|E] из $karadun_link$ Карадуна#!."
 mamur_usamar_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_9').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_9').GetID]"
 mamur_usamar_blank_link: "#V"
 tasurmad_wardenism_9_mini: "Мамур-триумфатор, обезопасивший Харадамат и Карадун..."

 # mamur_ansir - tasurmad_wardenism_10
 mamur_ansir_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_ansir_true_link', 'mamur_ansir_blank_link')]"
 tasurmad_wardenism_10_desc: "Третий из [GetFaithByKey('wardenism').GetAdherentName|V] Мамуров, #BOL Ансир#! правил в период, когда темпы расширения $central_mamuramat_link$ Центрального Мамурамата#! замедлились, и, за исключением некоторых земель в $uraghad_link$ Урагаде#!, захваченных амбициозными местными военачальниками, новых территорий почти не присоединялось.\n\nВместо этого львиная доля сил Ансира уходила на внутренние юридические споры: новое поколение правоведов поставило под сомнение законность провозглашения объединенного Мамурамата $mamur_tathtali_link$ Таттали#!. Ансир успешно отразил эти претензии, сославшись на принцип «Согласия в повелевании». Согласно ему, добровольный брак $sanad_link$ Санад#! (правящего Мамура Востока) и Таттали (правящего Мамура Центра) и их обоюдное решение передать оба титула единому наследнику делали этот шаг полностью легитимным."
 mamur_ansir_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_10').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_10').GetID]"
 mamur_ansir_blank_link: "#V"
 tasurmad_ansir_mini: "Внук Таттали, защитник единого Мамурамата..."

 # mamur_yusuf - tasurmad_wardenism_11
 mamur_yusuf_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_yusuf_true_link', 'mamur_yusuf_blank_link')]"
 tasurmad_wardenism_11_desc: "Сын $mamur_ansir_link$ Ансира#!, #BOL Юсуф#! взошел на престол в нежном возрасте 9 лет, и в течение одиннадцати лет регентства мальчика $central_mamuramat_link$ Мамурамат#! замер в ожидании. Вопреки постоянным опасениям гражданской войны или разорения страны пылким юнцом, Юсуф и его преданный регент — евнух Аль- Тутби — оправдали надежды: Юсуф полностью принял правление [mamuramat|E] в возрасте 20 лет. Он проявил себя как весьма умелый правитель, сумевший найти точный баланс между юридическими и военными обязанностями Мамура.\n\nВ 910 году от И.С. лорды-айяри из Аузанрая официально приняли [wardenism|E] (хотя большинство из них обратилось еще раньше) и подчинились власти Мамура. Удалия была окончательно объединена, а армии Мамурамата продвинулись вглубь [GetGeographicalRegion('kharadamat_biozone').GetName|V]. Сам [GetBuilding('01_sophocos').GetName|V] оказался под угрозой, и из [Concept('ritualism','ритуалистов')|, контролировавших башню, были выбиты клятвы о покорности (хотя варденитские армии так и не подошли к Башне ближе, чем на пятьдесят миль). Также стоит отметить, что в этих походах отличился варденитский военачальник $abdar_godrender_link$ Абдар «Богоборец» Сархадын#! — хотя он и не был связан с Мамуром напрямую, Юсуф легитимизировал его завоевания на дальнем востоке и использовал его образ как доказательство триумфа варденизма.\n\nПравление Юсуфа ознаменовалось культурным и экономическим ренессансом, за что его помнят до сих пор, но все эти достижения были омрачены полной неудачей в вопросе престолонаследия. Вместо того чтобы твердо поддержать одного из сыновей, он попытался разделить власть между тремя старшими законными детьми — $mamur_essaid_link$ Эссаидом#!, $mamur_mukasim_link$ Мукасимом#! и $mamur_qaim_link$ Каимом#!. Некоторые исследователи-традиционалисты видят в этом попытку вернуть Мамурамат к его первозданному виду и считают Юсуфа едва ли не святым. Большинство же признает это роковой ошибкой, приведет к опустошительной гражданской войне, начавшейся менее чем через десять лет после его смерти."
 mamur_yusuf_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_11').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_11').GetID]"
 mamur_yusuf_blank_link: "#V"
 tasurmad_wardenism_11_mini: "Мамур, поставивший под угрозу Софокос..."

 # mamur_essaid - tasurmad_wardenism_12
 mamur_essaid_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_essaid_true_link', 'mamur_essaid_blank_link')]"
 tasurmad_wardenism_12_desc: "Старший сын $mamur_yusuf_link$ Юсуфа#!, #BOL Эссаид#! унаследовал стабильное государство с полной казной, сильной армией и амбициями наконец обеспечить победу [Concept('wardenism','варденитов')|E] в [war_in_heaven|El]. Доля его личной вины в утрате всех четырех этих преимуществ остается предметом споров. Хронисты, писавшие при его братьях, изображали Эссаида транжирой и гулякой, увлеченным азартными играми и танцовщицами. Авторы же, творившие в его собственное правление, были куда более благосклонны.\n\nОднако не вызывает сомнений печально известный разрыв отношений между $central_mamuramat_link$ Центральным Мамураматом#! и $abdar_godrender_link$ Абдаром#!: последний пытался закрепить свою власть на востоке, сначала требуя от Эссаида уступить ему $eastern_mamuramat_link$ Восточный Мамурамат#!, а затем и вовсе открыто объявив себя претендентом на престол.\n\nКак бы то ни было, разделение власти с братьями — $mamur_mukasim_link$ Мукасимом#! и $mamur_qaim_link$ Каимом#! — быстро привело к усобице, вызванной враждой между Эссаидом и Мукасимом, тянувшейся еще с детства. Конфликт перерос в полномасштабную войну в 961 году от И.С., когда Эссаид отправил своего главного министра Аль-Баракви с армией арестовать Мукасима. Каим, всегда бывший ближе к Мукасиму, встал на его защиту против старшего брата. Война затянулась до 966 года от И.С., пока Эссаид не был пленен и казнен по приказу Мукасима, взошедшего на престол Мамурамата через труп родного брата."
 mamur_essaid_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_12').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_12').GetID]"
 mamur_essaid_blank_link: "#V"
 tasurmad_wardenism_12_mini: "Мамур, потерявший все наследие отца..."

 # mamur_mukasim - tasurmad_wardenism_13
 mamur_mukasim_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_mukasim_true_link', 'mamur_mukasim_blank_link')]"
 tasurmad_wardenism_13_desc: "#BOL Мукасим#! взошел на престол в 966 году от И.С. Конфликт, получивший название Войны Братоубийства, истощил казну $central_mamuramat_link$ Мамурамата#! и серьезно дестабилизировал управление. Что еще хуже, $abdar_godrender_link$ Абдар#! официально разорвал все отношения с [Concept('mamuramat','Мамуром')|E], заявив, что захват власти Мукасимом через убийство брата совершенно нелегитимен (чем, по законам [Concept('wardenism','варденизма')|E], он и являлся), и объявил, что принимает титул $eastern_mamuramat_link$ Мамура Востока#! по Принципу Всенародного Признания.\n\nНа троне Мукасим проявил себя жестоким, но способным правителем. Ему часто приписывают организацию убийства Абдара в 978 году от И.С. — обвинение, которым сам Мукасим, похоже, даже гордился, поскольку финансировал поэтов, слагавших стихи с прямым глумлением над тем, как Мукасим перехитрил претендента.\n\nБольшая часть его правления прошла в тяжбах с судами, так как последствия казни его брата $mamur_essaid_link$ Эссаида#! продолжали сказываться. Его защита строилась на изощренном трактовании Доктрины Целесообразности. Мукасим утверждал, что Эссаид был безумен и являлся тайным [Concept('ritualism','ритуалистом')|E]. Серьезность этой угрозы якобы вынудила его действовать в обход формальных процедур, по которым Верховные Судьи должны были отрешить неспособного Мамура от власти. Хотя Мамур снова одержал победу над судом, в обществе появились опасные трещины, а искаженное толкование Доктрины Целесообразности еще долго преследовало его преемников.\n\nМукасим повторил судьбу старшего брата и умер насильственной смертью: считается, что его сразил отравленный клинок сторонника Абдара, и он скончался в муках. В начавшейся панике его брат $mamur_qaim_link$ Каим#! взял власть сначала в качестве регента (единственному сыну Мукасима было три года), а затем полностью принял титул Мамура."
 mamur_mukasim_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_13').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_13').GetID]"
 mamur_mukasim_blank_link: "#V"
 tasurmad_wardenism_13_mini: "Победитель Войны Братоубийства, правитель расколотого двора..."

 # mamur_qaim - tasurmad_wardenism_14
 mamur_qaim_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_qaim_true_link', 'mamur_qaim_blank_link')]"
 tasurmad_wardenism_14_desc: "Третий и самый младший сын $mamur_yusuf_link$ Юсуфа#!, #BOL Каим#!, был тихим и созерцательным человеком — именно таким правителем, в котором $central_mamuramat_link$ Мамурамат#! нуждался после хаоса Войны Братоубийства и правления [Concept('mamuramat','Мамуров')|E] $mamur_essaid_link$ Эссаида#! и $mamur_mukasim_link$ Мукасима#!.\n\nПо слухам, никогда не разделявший ложа с женщиной, Каим не оставил наследников, и после его смерти Мамурамат перешел к единственному ребенку его брата Мукасима — $mamur_mutarshid_link$ Мутаршиду#!, которого Каим воспитал как родного сына. Сплетники до сих пор утверждают, будто Каим и его доверенный советник Дрианиус (изгнанный [Concept('aversaria','аверсарианский')|E] маг, поселившийся в Саррадоне) состояли в романтической связи вплоть до смерти Дрианиуса в 1000 году от И.С. Как бы то ни было, они были невероятно близки и вместе управляли государством.\n\n22-летнее правление Каима стало периодом затишья и возвращения мира в Мамурамат. Впрочем, именно в эти годы значительно возросло число земель, отданных в аренду [Concept('marchers','маршерам')|E] и аверсарианским торговцам. Некоторые периферийные территории были утрачены, но ничего из действительно важного."
 mamur_qaim_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_14').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_14').GetID]"
 mamur_qaim_blank_link: "#V"
 tasurmad_wardenism_14_mini: "Затишье после бури..."

 # mamur_mutarshid - tasurmad_wardenism_15
 mamur_mutarshid_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_mutarshid_true_link', 'mamur_mutarshid_blank_link')]"
 tasurmad_wardenism_15_desc: "Будучи [Concept('mamuramat','Мамуром')|E], #BOL Мутаршид#! мало интересовался повседневным управлением, предпочитая сосредоточить силы на магических изысканиях и переписке с различными [magi|El] по всему [aeras|E]. Он тратил огромные суммы на покровительство [Concept('the_continent','континентальным')|E] магам и окружил себя вереницей [Concept('aversaria','аверсарианских')|E] советников-магов. Государственные дела были перепоручены Главному министру — должность, чье влияние продолжало расти в последующих поколениях. В его время этот пост занимала череда евнухов, самым заметным из которых был Луццо аль-Кеффали, [Concept('marchers','шевалье')|E], которого многие подозревали в неполной кастрации; однако Мутаршид доверял ему слишком слепо, чтобы обращать внимание на слухи.\n\nСамым значительным событием правления Мутаршида стало [marmaladid_invasion_sihnimiyyah|El] — кризис, в ходе которого сгорели большие земли $central_mamuramat_link$ Центрального Мамурамата#!. Орды Мармаладидов удалось остановить лишь благодаря усилиям сына Мутаршида, книжного и замкнутого мага $mamur_istasim_link$ Истасима#!.\n\nИз менее значительного: академические интересы Мутаршида привели к заметному увеличению [GetFaithByKey('hulawite').GetAdherentName|V] присутствия при дворе — их первому возвращению с тех пор, как $mamur_yusuf_link$ Мамур Юсуф#! официально запретил их богословие в 950 году от И.С. и положил начало серии гонений."
 mamur_mutarshid_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_15').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_15').GetID]"
 mamur_mutarshid_blank_link: "#V"
 tasurmad_wardenism_15_mini: "Мамур с двумя отцами..."

 # mamur_istasim - tasurmad_wardenism_16
 mamur_istasim_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_istasim_true_link', 'mamur_istasim_blank_link')]"
 tasurmad_wardenism_16_desc: "После того как $mamur_mutarshid_link$ Мутаршид#! погиб во время неудачного эксперимента, #BOL Истасим#! начал свое правление с казни Главного министра Луццо и назначения на этот пост одного из своих любимых евнухов, известного как Рахлат ад-Даввар. За исключением упразднения Луццо, Истасим придерживался административной структуры, созданной его отцом, хотя и старался не назначать [Concept('aversaria','аверсарианских')|E] [magi|E] на руководящие должности.\n\nОн проводил амбициозные программы по содействию союзам между династиями, способными порождать магов, пытаясь возродить [sirhad|E]. Эффективность этих мер оказалась сомнительной, а сам Истасим был свергнут с престола в 1090 году от И.С. своим сыном $mamur_radi_i_link$ Ради#!, организовавшим переворот при поддержке группы придворных аверсарианских магов. Остаток дней Истасим провел под домашним арестом, постепенно сходя с ума."
 mamur_istasim_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_16').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_16').GetID]"
 mamur_istasim_blank_link: "#V"
 tasurmad_wardenism_16_mini: "Мамур статус-кво, увлеченный магией..."

 # mamur_radi_i - tasurmad_wardenism_17
 mamur_radi_i_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_radi_i_true_link', 'mamur_radi_i_blank_link')]"
 tasurmad_radi_i_desc: "#BOL Ради#! был одним из самых могущественных магов своего поколения — результатом успешных попыток его $mamur_istasim_link$ отца#! и $mamur_mutarshid_link$ деда#! привлечь [Concept('aversaria','аверсарианских')|E] [magi|E] ко двору с последующими браками с членами [Concept('mamuramat','Мамуральной')|E] семьи.\n\nЕго правление началось с относительно бескровного переворота против отца Истасима, но первым же его актом в качестве Мамура стала куда более кровавая чистка фракции аверсарианских магов при дворе, которых он обвинил в заговоре со своим братом $zayd_link$ Зайдом#! с целью свержения. Реальность заговора сомнительна, учитывая, что многие из убитых магов еще за пару недель до этого поддерживали его при перевороте.\n\nВ годы своего правления Ради проводил жестокие эксперименты над собственными детьми, пытаясь еще сильнее очистить их кровь помимо организованных им браков с аверсарианками из знатных магических родов. Это привело его династию к краху. Пять его наиболее многообещающих сыновей — $muzaffar_link$ Музаффар#!, $yusuf_link$ Юсуф#!, $radi_1_link$ Ради#!, $radi_2_link$ Ради#! и $ithtar_link$ Иштар#! — умерли задолго до него из-за несчастных случаев, старости или предполагаемых жертвоприношений, когда Ради казалось, что они плетут против него заговор.\n\nКогда началась [Concept('saints_war','Война Святых')|E], Ради, подстрекаемый аверсарианскими советниками, поверил, что агионисты — их союзники (и практически [Concept('wardenism','вардениты')|E], учитывая упор [GetFaithByKey('dikaynos').GetAdherentName|V] на своды законов), которых можно использовать против [Concept('ritualism','ритуалистов')|E]. Поэтому он оказал огромную поддержку высадке и кампаниям Орденов против своих религиозных врагов, за несколько десятилетий до этого отвоевавших большую часть [GetGeographicalRegion('kharadamat_biozone').GetName|V]. Многие первоначальные территории, контролируемые Колониальной Администрацией, были практически подарены имперцам. К примеру, остров $kulaybeh_link$ Идрусна#! был «продан» лишь за обещание вечной дружбы между правящим Ааутократиром и Ради, хотя к моменту подписания договора остров уже почти десять лет находился под контролем Аверсарии.\n\nВ 1152 году Ради столкнулся с Расколом Катисти, который быстро перерос в полномасштабное Восстание Тель-Мерра против власти Мамурамата.\n\nЗначительно продлив себе жизнь с помощью аверсарианской магии [aspect_blood]Крови#!, Ради прожил более века; ходили слухи, что он искал [thirteen_abyssal_steps|E] для еще большего долголетия (несмотря на отсутствие навыков в магии [aspect_death]Смерти#!). Как бы то ни было, престол унаследовал скромный — и имеющий инвалидность — $mamur_radi_ii_link$ Ради «Младший»#!, когда тело старшего Ради неожиданно отказало в 1179 году от И.С. Поскольку агионисты развернули полномасштабные действия против варденитов только в 1180 году от И.С., Ради так и не узнал о своей чудовищной стратегической ошибке."
 mamur_radi_i_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_17').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_17').GetID]"
 mamur_radi_i_blank_link: "#V"
