 # korinne_ptaciv - pactlander_banstur_1
 korinne_ptaciv_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'korinne_ptaciv_true_link', 'korinne_ptaciv_blank_link')]"
 pactlander_banstur_1_desc: "Коринне Птачив была [GetCultureByKey('pactlander').GetName|V] мистиком, писательницей и философом, чьи труды стали основополагающими для школ естественной и сверхъестественной философии по всему заново заселяемому [Concept('aversaria','Разрушенному Берегу')|E]. О ее ранних годах известно мало, кроме того, что она, возможно, происходила из смешанной сьяльвольско-аверсарианской семьи. Большую известность ей принесли работы, посвященные изменчивому [Concept('the_fog', 'Туману')|E] и свойствам новой флоры и фауны, встреченной во время похода на юг, хотя ее самое противоречивое и популярное произведение — «Женский род» — появилось после реформации [GetFaithByKey('orispolj_rite').GetName|V] в конце XIII века.\n\nВ конце 1297 года она изложила свои идеи о женской автономии и власти $cenware_link$ Ценвару#!, но Истребитель Ведьм не успел вынести свое суждение до своей смерти, что лишь сильнее обострило растущую вражду на Берегу. Как говорят, $daun_link$ Даун#! из Старой Бардской Коллегии заметил, что «Истребитель Ведьм наконец нашел равного соперника в лице Женщины», что в итоге привело к его мученичеству и чуть не стоило Коринне жизни во время Разграбления Коллегии Грейпорта."
 korinne_ptaciv_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('pactlander_banstur_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('pactlander_banstur_1').GetID]"
 korinne_ptaciv_blank_link: "#V"
 pactlander_banstur_1_mini: "Один из величайших умов эпохи [sjalvolki_migration|E|l]..."

