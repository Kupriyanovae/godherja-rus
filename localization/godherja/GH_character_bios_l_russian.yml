 centralimperial_aeschraes_aagiokrata_1_desc: "#BOL Легон Картин Деленель#! был малкозиакским полководцем, родившимся в 1171 году от И.С. Будучи легоном $d_legio_xiv_chainforgers$#!, Деленель славился своей жестокостью и эффективностью в командовании легионом, в первую очередь при подавлении рабских восстаний на протяжении всей [imperial_civil_war|E], а затем и на службе у $aauto_aeschraes_link$ Аавтократира Эсхреаса#!.\n\nДеленель, пожалуй, наиболее печально известен тем, что считался наставником $gorassos_link$ Горассоса «Головореза»#! — пресловутого «бойцовского пса» Эсхреаса. Горассос вместе с Деленелем утопил [aversaria|E] в крови во время карательных кампаний, призванных повергнуть население в ужас и вернуть его к повиновению под гнётом гниющих устоев [GetTitleByKey('e_oraispol_aautokrata').GetNameNoTier|V]. Для выполнения этой задачи Деленелю передали командование пятью легионами, помимо его личных дворянских легионов из обширных поместий его семьи в $opakhasia_link$ Опахасии#! и $malcois_link$ Малкозисе#!. Именно Деленелю приписывают тот факт, что Эсхреас удерживал контроль над этими двумя регионами в поздний период своего правления. Известный тем, что сдирал с врагов кожу живьём, Деленель использовал свои скромные магические способности, чтобы продлить их мучения. Знатных пленников перед сдиранием кожи он нередко кастрировал, лишал языка и кистей рук прямо на глазах у их подчинённых или семей, произнося при этом речи от имени Эсхреаса.\n\nДеленель встретил свой конец в 1229 году от И.С. от руки $legan_isacea_link$ легана Исацеи#! из $state_legio_xxi_link$ XXI легиона «Аксиотея»#! во время [Concept('the_vilnian_assault','Вильнианского штурма')|E], погибнув в дуэли вместе со своим соратником $demetros_iron_spike_link$ Деметросом «Железным Шипом»#!. Со смертью Деленеля его легионы немедленно дезертировали со службы Эсхреасу, Опахасия погрузилась в хаос без его кампаний устрашения, а Малкозис вскоре захлестнула волна Ийросских восстаний.\n\nВ популярных исторических хрониках часто забывают, что Деленель выжил во время Вильнианского штурма, хотя и был смертельно ранен. Брошенный союзниками и своими людьми, он вернулся в свои владения в Опахасии. Там его ученик Горассос вошёл в дом под видом друга, после чего обезглавил своего наставника для своей коллекции черепов, а затем изнасиловал и убил семью Деленеля, его слуг и рабов. Этот эпизод принято считать моментом, когда Горассос окончательно порвал оставшиеся узы между собой и Эсхреасом."
 karthyn_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('centralimperial_aeschraes_aagiokrata_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('centralimperial_aeschraes_aagiokrata_1').GetID]"
 karthyn_blank_link: "#V"
 centralimperial_aeschraes_aagiokrata_1_mini: "Каратель и лейтенант Эсхреаса..."

 # demetros_iron_spike - northernimperial_aversarinas_aagiokrata_19
 demetros_iron_spike_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'demetros_iron_spike_true_link', 'demetros_iron_spike_blank_link')]"
 northernimperial_aversarinas_aagiokrata_19_desc: "#BOL Деметрос «Железный Шип»#! был северным [Concept('aversaria','аверсарианским')|E] полководцем, удерживавшим контроль над большей частью Калатипсоми в начале 1200-х годов. Бастарды знатной женщины Кены Детениякс и (если верить слухам) Ведегара Бретаниака, полулегендарного главы многих преступных организаций Аверсарии в разгар [imperial_civil_war|E], Железный Шип родился в относительной нищете в тени [Concept('mayikprolollans','Майикпрололлана')|E] в Прозе в 1202 году от И.С.\n\nХитрый и расчётливый, Деметрос сумел использовать интриги, коварство и запугивание, чтобы прибрать к рукам большую часть земель своей матери после её смерти в 1209 году от И.С. В течение десятилетия после её кончины он либо убил, либо устранил её законнорожденных наследников. Вскоре Деметрос стал единолично править семейными землями и начал стремительно расширять их посредством очередных уловок и военных кампаний.\n\nДеметрос, пожалуй, наиболее известен (или печально известен) тем, что принёс присягу $aauto_aeschraes_link$ Аавтократиру Эсхреасу#!. Пользуясь поддержкой «Владыки Пепла», он продвинул свои владения к $black_mountains_link$ Чёрным горам#! и создал структуру, которую многие считали легальной преступной организацией, имевшей огромное влияние по всему $etepezea_link$ Этепезесу#!. Вскоре Деметрос стал одной из правых рук Эсхреаса, и многие лорды оставались в хватке Аавтократира исключительно из страха перед наёмными убийцами, которыми славился Железный Шип, и его многочисленными криминальными связями.\n\nДеметрос был убит в 1229 году от И.С. $legan_isacea_link$ леганом Исацеей#! из $state_legio_xxi_link$ XXI легиона «Аксиотея»#! во время [Concept('the_vilnian_assault','Вильнианского штурма')|E] в поединке, погибнув вместе со своим соратником $karthyn_link$ Картином Деленелем#!. Со смертью Железного Шипа (не оставившего признанного наследника) порядок в Калатипсоми быстро рухнул, погрузив регион в междоусобицы между восставшими рабами, военными командирами, преступными синдикатами и местной знатью. Это состояние сохранялось вплоть до [sjalvolki_migration|E|l] в 1250-х годах."
 demetros_iron_spike_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('northernimperial_aversarinas_aagiokrata_19').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('northernimperial_aversarinas_aagiokrata_19').GetID]"
 demetros_iron_spike_blank_link: "#V"
 northernimperial_aversarinas_aagiokrata_19_mini: "Криминальный барон и лейтенант Эсхреаса..."

