 # methiad - northernimperial_aversarinas_aagiokrata_20
 methiad_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'methiad_true_link', 'methiad_blank_link')]"
 northernimperial_aversarinas_aagiokrata_20_desc: "#BOL Метиад Детликан#! была [Concept('aversaria','аверсарианской')|E] со-губернаторшей Калатипсоми, правившей с 1226 по 1247 год от И.С. Ярая аксиотеистка, которую современники часто называли «аверсарианкой среди аверсарианцев» за её властную осанку и абсолютный отказ от компромиссов с теми, кого она считала низшей кровью, Метиад родилась для своей роли. Она начала жестокую восстаническую кампанию против варлорда (и своего со-губернатора) $demetros_iron_spike_link$ Деметроса «Железного Шипа»#! и его покровителя $aauto_aeschraes_link$ Аавтократира Эсхреаса#!.\n\nМетиад сама по себе была могущественной [magi|E] и повелевала ковеном магов под названием «Семь Стражей», которых вместе с её союзниками из [mayikrata|E] часто считали сильнейшими магами севера. Более того, Метиад получала богатые поставки оружия и финансирование от [marchers|E] из [chevalie|E], с которыми она заключила множество сделок на щедрые земельные и ресурсные гранты в Чёрных горах. С этими силами она сражалась против Железного Шипа и его союзника, её главного соперника, $oulnir_link$ Оулнира Гурдурбока#!.\n\nКогда Железный Шип был убит во время [Concept('the_vilnian_assault','Вильнианского штурма')|E], партизанская война между Метиад и Гурдурбоком переросла в открытый полномасштабный конфликт, который пожирал север до конца её дней. Ни одна из сторон не смогла добиться существенных успехов, особенно на фоне общего коллапса Калатипсоми. Положение Метиад стало ещё более шатким с падением её союзников в Шевали (из-за исчезновения $gardfrei_link$ верховного короля Гардфрея#!) и Майикрате (когда [Concept('sjalvolki_migration','Ценвар Разрушитель Ведьм возглавил разгром академии')|E]).\n\nКогда с востока вместе со своими легионами беженцев прибыл $nicanoneus_link$ легон-губернатор Никаноней «Чёрное Солнце»#!, Метиад и Гурдурбок попытались [Concept('the_black_mountain_war','склонить чужеземца на свою сторону в конфликте')|E]. Используя войска как Метиад, так и Гурдурбока, Никаноней одержал победу над сьялвольками в битве при Бергкоге, но вскоре был отброшен на север. Обвинив своих «союзников», Никаноней устроил засаду и убил Гурдурбока. Метиад заподозрила, что станет его следующей целью, и попыталась подослать убийц, а также отправила свой личный легион, чтобы уничтожить бывшего пешку. Однако убийцы потерпели неудачу, а её легион быстро переметнулся к Никанонею. Оказавшись в окружении и без союзников, она попыталась бежать в Шевали, но была схвачена и казнена Никанонеем за некомпетентность в 1247 году от И.С. Её попытка бегства на запад вместе с последующим покушением её последователей на Никанонея были использованы Чёрным Солнцем как повод для вторжения на запад в Шевали в ходе [ash_war|E]."
 methiad_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('northernimperial_aversarinas_aagiokrata_20').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('northernimperial_aversarinas_aagiokrata_20').GetID]"
 methiad_blank_link: "#V"
 northernimperial_aversarinas_aagiokrata_20_mini: "Полководец Калатипсоми и соперница Оулнира..."

 # oulnir - sarridians_aversarinas_aagiokrata_1
 oulnir_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'oulnir_true_link', 'oulnir_blank_link')]"
 sarridians_aversarinas_aagiokrata_1_desc: "#BOL Оулнир Гурдурбок#! был полководцем в северной Микрос Калатипсоми (ныне обычно называемой Гурдурбоком в честь vast империи, которую он построил), правившим с 1227 по 1247 год от И.С., аккурат перед [Concept('sjalvolki_migration','миграциями сьялвольков')|E] через Серые Врата.\n\nЗаявляя о своём [Concept('aversaria','аверсарианском')|E] происхождении, Гурдурбок так и не предоставил тому доказательств; в его жилах текла скорее кровь сарридийских горных кланов, коренных жителей Чёрных гор, а его административная система имела мало общего с аверсарианской, которую он сверг. Изначально будучи аверсарианским легионером, Гурдурбок захватил север после того, как дезертировал вместе с соклановцами из своего легиона ([GetTitleByKey('d_legio_xvii_pathos').GetNameNoTier|V]), и удерживал контроль над севером под командованием $demetros_iron_spike_link$ Деметроса «Железного Шипа»#!.\n\nКогда Железный Шип погиб во время [Concept('the_vilnian_assault','Вильнианского штурма')|E], Гурдурбок официально разорвал узы с Аверсарией (составив весьма изящное письмо в Орайсполь) и вскоре начал войну в горах с мятежной $methiad_link$ губернаторшей Метиад Детликан#! за контроль над севером. Гурдурбок был известен тем, что задействовал в боях освобождённых рабов, и проявлял крайнюю жестокость к сопротивлявшимся ему аверсарианским поселенцам. Несмотря на это, а также на пропаганду его соперницы Метиад, изображавшую его неотесанным варваром, Гурдурбок живо интересовался литературой, иностранным богословием и искусством, и часто впечатлял прибывших послов, активно ведя с ними дебаты на эти темы.\n\nГурдурбок встретил свой конец в 1247 году от И.С. с прибытием $nicanoneus_link$ легона-губернатора Никанонея «Чёрное Солнце»#!, сына губернатора Катраддии. Войдя в регион со своей армией беженцев, Никаноней потерпел поражение от $cenware_link$ Ценвара «Разрушителя Ведьм»#! в Войне Горных Врат и был отброшен в обход восточных гор.\n\nОбе стороны в [Concept('the_black_mountain_war','Войне Чёрных Гор')|E] пытались переманить Никанонея на свою сторону. Используя войска как Гурдурбока, так и его соперницы, он смог одержать победу над Разрушителем Ведьм в битве при Бергкоге, но вскоре снова был оттеснён на север. Преследуемый по пятам сьялвольками, Никаноней возложил вину за поражение на своих «союзников» и посчитал обоих слишком опасной обузой для своего дела. Он внезапно напал на Гурдурбока в его поместье и убил его, после чего казнил губернаторшу Метиад и взял север под свой контроль, положив конец периоду междоусобиц."
 oulnir_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('sarridians_aversarinas_aagiokrata_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('sarridians_aversarinas_aagiokrata_1').GetID]"
 oulnir_blank_link: "#V"
 sarridians_aversarinas_aagiokrata_1_mini: "Сарридийский завоеватель и соперник Метиад..."

 # agos - etrandanexi_aversarian_axiaotheaism_1
 agos_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'agos_true_link', 'agos_blank_link')]"
 etrandanexi_aversarian_axiaotheaism_1_desc: "Прославленный наёмник, варлорд и предполагаемый фаворит $aauto_axiaothea_link$ Аксиотеи#!, #BOL Агос Слин#! служил её заместителем в Восточном Айроное на закате [imperial_civil_war|E]. Позже он возглавил легионы Аксиотеи в [retributive_march|E], призванном подавить [blue_robe_revolt|E]. Сам Агос питал личную вендетту к каширскому генералу $akhasar_link$ Акхасару#! из-за роли последнего в гибели его возлюбленного и друга детства, $legan_axas_link$ легана Аксаса «Занозы»#!.\n\nПозже Агос столкнулся с ольтенической ордой под предводительством $jajak_link$ Яджака Отроки#!, который поклялся заполучить его голову, чтобы сдержать обещание, данное Аксиотее. Последовавшая [battle_of_baytors_grave|E] обернулась катастрофой для [Concept('aversaria','аверсарианцев')|E], вынудив Агоса предпринять [Concept('battle_for_the_aironoiakaan','отчаянный штурм Айроноиакаана')|E].\n\nАгос пережил и финальную битву, и [frodbrokna|E], но был тяжело обожжён и истощён увиденными ужасами. Позже он бросился в южный рукав Могилы Байтора, по другую сторону полей, где проходило его [Concept('battle_of_baytors_grave','сражение')|E] с ольтениками. К тому моменту, как его людям удалось вытащить его из воды, великий воин уже утонул."
 agos_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('etrandanexi_aversarian_axiaotheaism_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('etrandanexi_aversarian_axiaotheaism_1').GetID]"
 agos_blank_link: "#V"
 etrandanexi_aversarian_axiaotheaism_1_mini: "Правая рука Аксиотеи, переживший Восстание Синих Мантий..."

 # jajak - kuridorig_iek_otached_1
 jajak_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'jajak_true_link', 'jajak_blank_link')]"
 kuridorig_iek_otached_1_desc: "Правивший огромным ханатом в Айронойской степи, #BOL Яджак Отрока#! был могущественным ольтеническим вождём, жившим в конце двенадцатого века. Во время [imperial_civil_war|E] $aauto_axiaothea_link$ Аксиотея#! направила к ольтеникам послов, приказывая им примкнуть к её войскам. Гордый Яджак не только отрубил руку её посланнику, но и потребовал восстановления древних прав ольтеников, угрожая в противном случае лишить жизни её величайшего воина и бросить его голову на порог её дворца. В ответ Аксиотея объявила Яджака вне закона, что побудило его собрать орду невиданных для Айроноя масштабов.\n\nЗатем он обрушился на [Concept('aversaria','аверсарианские')|E] легионы под командованием $agos_link$ Агоса Слина#!, застав их вплосплох в [battle_of_baytors_grave|E]. В разгар битвы Яджак пришёл в ярость, увидев $akhasar_link$ Акхасара#! с легендарным [iorne_seld|E] в руках, что заставило его сломя голову броситься на аверсарианские строй, получив при этом не менее шести стрел. Тем не менее он выжил в битве и позже снова появился со своей ордой во время [battle_for_the_aironoiakaan|E].\n\nК несчастью для него, Яджак не сумел сразить Агоса Слина в последнем бою. Когда же он позже услышал от проходящих беженцев о самоубийстве Агоса, он, как сообщается, закричал с такой яростью, что содрогнулись сами горы. После этого Яджак выбросил все сорок восемь масок, собранных им за всю жизнь, и, совершив поступок, считавшийся чудовищным у ольтеников, сорвал с себя собственную маску и сбросил её в каньон.\n\nЗатем он устремился на своем коне на юго-запад, в Красные Земли, в безумной ярости заявляя, что больше не имеет права называться ольтеником."
