 # qanamsar_pejman - amsari_mahndayana_2
 amsari_mahndayana_2_title: "Последний Канамсар"
 qanamsar_pejman_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'qanamsar_pejman_true_link', 'qanamsar_pejman_blank_link')]"
 amsari_mahndayana_2_desc: "#BOL Пейжман «Добрый»#! был вторым сыном $qanamsar_jahanshah_link$ Канамсара Джаханшаха#!, родившимся от жены из сиралаги во время растущей нестабильности. Большую часть своего раннего детства он провёл в летнем дворце [GetBuilding('gh_anjari_burz_01').GetName|V], а позже включился в придворные интриги в борьбе за престол. Считается, что именно он организовал убийство своего младшего брата.\n\nОдержав победу в маломасштабных конфликтах на юге и заслужив репутацию беспощадного человека по отношению к своим врагам, Пейжман был официально выбран наследником своим отцом, который вскоре после этого скончался. Он взошёл на престол в 1184 году от И.С. в возрасте двадцати шести лет, завоевав благосклонность Канамсара и сыграв в династическую борьбу по правилам Хиклахната. Вскоре после этого он приказал убить своего самого главного rival и претендента — своего двоюродного племянника Шавура.\n\nРождение первого ребёнка, а затем наступление [frodbrokna|E] и конец [Concept('gh_zenda','Пророчества')|E], по-видимому, изменили его взгляды на престолонаследие и традиционные обычаи амсари. Он попытался положить конец давней практике детоубийства и братоубийства, определявшей политику Хиклахната на протяжении веков. За отказ от обычаев предков и последующую перемену в характере его с тех пор стали прозывать «Добрым».\n\nВ начале его правления казнат дворца была почти пуста, а престол увяз в долгах. Однако к 1220-м годам от И.С., благодаря сочетанию налогообложения и продуманной дипломатии, Пейжман стабилизировал казну. Он заключил ключевые торговые соглашения с [GetTitleByKey('e_ayyar').GetBaseNameNoTier|V] и варденитскими восточными республиками. Самым противоречивым его шагом стала продажа в 1223 году от И.С. [GetTitleByKey('c_baqerabad').GetBaseNameNoTier|V] в пользу [GetTitleByKey('d_marcher_amsari_republic').GetBaseNameNoTier|V], что обеспечило крупнейший приток золота, который государство видело за последние десятилетия.\n\nВо внутренней политике Пейжман активно задействовал своих многочисленных детей, рассылая их по всему Хиклахну, чтобы связать узами себя и своих вассалов в попытке уравновесить столетие растущей вассальной автономии. Это, однако, в конечном итоге способствовало гражданской войне, терзавшей [amsar|E] на протяжении десятилетий после его смерти."
 qanamsar_pejman_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('amsari_mahndayana_2').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('amsari_mahndayana_2').GetID]"
 qanamsar_pejman_blank_link: "#V"
 amsari_mahndayana_2_mini: "Канамсар стабильности, отец грядущей гражданской войны..."
 amsari_mahndayana_2_birth: "Родился [Character.GetBirthDate.GetStringShort] в [GetTitleByKey('c_tchouran').GetNameNoTier]"

