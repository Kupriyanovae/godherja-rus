 # mamur_zulfiqar - tasurmad_wardenism_110
 mamur_zulfiqar_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_zulfiqar_true_link', 'mamur_zulfiqar_blank_link')]"
 tasurmad_wardenism_110_desc: "Будучи членом возвышающегося клана $qafti_link$ Кафти#!, #BOL Зульфикар#! стал третьим подряд представителем рода Кафти, носившим титул [Concept('mamuramat','Мамура')|E]. Его избрание вызвало волнения среди более консервативных представителей судейского корпуса, вызвав обвинения в кумовстве со стороны альянса мятежных правоведов, которые преследовали его на протяжении всего правления. После его смерти $mamur_awqif_link$ Авкиф#!, известный и уважаемый судья округа $abu_lebdour_link$ Абу-Лeбдур#!, был избран вопреки притязаниям собственного сына Зульфикара. Это решение стало шоком для Кафти и их союзников и едва не привело к пролитию крови."
