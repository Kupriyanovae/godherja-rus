 # mamur_radi_ii - tasurmad_wardenism_18
 mamur_radi_ii_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'mamur_radi_ii_true_link', 'mamur_radi_ii_blank_link')]"
 tasurmad_wardenism_18_desc: "Последний ребенок $mamur_radi_i_link$ Мамура Ради#!, #BOL Ради ибн Ради#! был прикован к постели на протяжении всех четырех лет своего правления, получив тяжелую травму головы при падении с лошади в возрасте 21 года. К счастью для $central_mamuramat_link$ Мамурамата#!, за несколько месяцев до несчастного случая его жена, [Concept('aversaria','аверсарианская')|E] [magi|E] $thessia_link$ Тессия Аргонакс#!, родила ему сына. $mamur_qahir_link$ Кахир ибн Ради#! служил регентом большую часть формального правления своего отца и официально принял власть после его смерти в 1183 году от И.С."
 mamur_radi_ii_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_18').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('tasurmad_wardenism_18').GetID]"
 mamur_radi_ii_blank_link: "#V"
 tasurmad_wardenism_18_mini: "Недееспособный Мамур, чьим регентом до самой кончины выступал сын..."

