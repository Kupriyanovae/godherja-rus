 dragon_beast_7_desc: "Также известный как «Драконий Король», #BOL Тирандакс#! был [Concept('aversaria', 'аверсарианским')|E] драконом, бежавшим с [war_of_the_thousand_dragons|E] и деспотично правившим пост-катаноуксианским королевством $faegift_link$ Фейгифт#! более десятилетия, прежде чем был сражён."
