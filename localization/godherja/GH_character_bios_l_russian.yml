 # ogier - carsavisians_lifepath_15
 carsavisians_lifepath_15_title: "Северный Огр"
 ogier_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'ogier_true_link', 'ogier_blank_link')]"
 carsavisians_lifepath_15_desc: "#BOL Ожье ден ва Родаре#! родился в маленькой деревне в семье мелкого дворянина и, казалось, был уготовлен для мирной жизни. Однако в возрасте 12 лет он узнал о страшной угрозе, бороться с которой обязан каждый житель Марки — о [Concept('lichdom', 'нежити')|E]. жасный лич $lich_wellky_link$ Велли «Бич Солнцестояния»#! сжег его родной дом во время одного из своих печально известных набегов, из-за чего осиротевший Ожье вступил в [Concept('antimagic', 'антимагический')|E] [Concept('antimagic_orders', 'антимагический орден')|E] Горящей Звезды. В 19 лет Ожье в одиночку удерживал мост против орды нежити, имея при себе лишь кинжал да бревно, за что снискал рыцарский титул и прозвание «Огр».\n\nОвладев воинским искусством, он задался целью устроить засаду на убийцу своей семьи во время его следующего явления в день зимнего солнцестояния. В тот роковой день Ожье встретил и сразил Велли в единоборстве под стенами города $rozalie_link$ Розали#!. За это он был провозглашен Великим магистром своего Ордена, а когда правящий $andre_link$ герцог Андре#! из $banereset_link$ Банерезе#! искал нового наследника своему титулу, он назвал им Ожье за отмщение за сына."
 ogier_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('carsavisians_lifepath_15').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('carsavisians_lifepath_15').GetID]"
 ogier_blank_link: "#V"
 carsavisians_lifepath_15_mini: "Великий магистр антимагов, «Огр» Марки..."
 carsavisians_lifepath_15_birth: "Родился [Character.GetBirthDate.GetStringShort] в [GetTitleByKey('b_aemolason').GetNameNoTier]"

 # sirras - scusstari_iyrossi_aagiokrata_13
 scusstari_iyrossi_aagiokrata_13_title: "Отступник"
 sirras_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'sirras_true_link', 'sirras_blank_link')]"
 scusstari_iyrossi_aagiokrata_13_desc: "Большую часть жизни #BOL Сиррас#! считал себя простым легионером. [Concept('magi', 'Магом')|E], коему суждено всю жизнь разить мятежников, иноземных захватчиков да ийросских рабов в $malcois_link$ Малькое#!.\n\nОднако в одну из ночей он нашел в своей палатке записку, вынудившую его бежать из легиона. В записке говорилось, что он — ийросец, а его род восходит к $pothacleas_link$ царю Потаклею#!, последнему царю ийросцев.\n\nНе желая более оставаться [Concept('aversaria', 'аверсарианским')|E] псом, он воротился в родную деревню в $deris_link$ Дерисе#!. Соплеменники открыли ему, что пресловутый разбойник $gorassos_link$ Горасс Собиратель Черепов#! погубил его семью, и Сиррас поклялся отомстить. Сплотив деревенских жителей Дериса, он напал и сразил их господина $galestios_link$ деспексира Галестия Урминтиса#!, помогшего Собирателю Черепов выследить его родню, после чего создал $vengeance_seekers_link$ отряд#!, дабы освободить свой народ и отомстить за близких."
 sirras_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('scusstari_iyrossi_aagiokrata_13').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('scusstari_iyrossi_aagiokrata_13').GetID]"
 sirras_blank_link: "#V"
 scusstari_iyrossi_aagiokrata_13_mini: "Последний из наренцев..."
 scusstari_iyrossi_aagiokrata_13_birth: "Родился [Character.GetBirthDate.GetStringShort] в [GetTitleByKey('c_deris').GetNameNoTier]"

 # ulfirx - vrodkin_sjalvolki_1
 vrodkin_sjalvolki_1_title: "Бешеный Пёс"
 ulfirx_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'ulfirx_true_link', 'ulfirx_blank_link')]"
 vrodkin_sjalvolki_1_desc: "#BOL Ульфиркс Кьорлауги#! провел детство и юность в непрестанных кочевьях во время [Concept('sjalvolki_migration', 'Великого переселения сьялволков')|E]. Следуя примеру отца, $hjorix_link$ Хьорикса Кьорлауги#!, краля $vrodkin_link$ кланреха вродкинов#!, Ульфиркс стремился проявить себя доблестным воителем и вождем. Вечные походы его племени давали множественные возможности проявить себя в (весьма мелких) стычках с сотоварищами, и он часто праздновал победы в окружении прихлебателей за хмельным питьем и бесконечными рассказами о своих подвигах. Поговаривают, что во время своей первой стычки Ульфиркс напился до беспамятства и неистово выл на строи $greulokin_link$ греулокинов#!, за что те прозвали его «Бешеным Псом».\n\nУверовав в свою славу и опасаясь, что $cenware_link$ Сокрушитель Ведьм#! покорит [Concept('aversaria', 'Аверсарию')|E] раньше, чем он сам успеет добыть истинную славу, Ульфиркс со своими (вдребезги пьяными) соратниками «добыл» флот дракаров и устремился на полудень. Сойдя на берег на островах $kollos_link$ Коллоса#!, которые он поначалу ошибочно принял за острова Айроноя, Ульфиркс отнял два острова у $dexios_link$ аавтократора Дексиона#! и заставил нанятых им местных наемников бежать еще до того, как те ступили на сушу. Так Ульфиркс совершил свое первое завоевание и тут же предался мечтам о новых великих подвигах."
 ulfirx_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('vrodkin_sjalvolki_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('vrodkin_sjalvolki_1').GetID]"
 ulfirx_blank_link: "#V"
 vrodkin_sjalvolki_1_mini: "Воин, мечтающий вписать свое имя в историю..."

 # aauto_aeschraes - westernimperial_aeschraes_aagiokrata_1
 westernimperial_aeschraes_aagiokrata_1_title: "Разрушитель Миров, Повелитель Пепла"
 aauto_aeschraes_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'aauto_aeschraes_true_link', 'aauto_aeschraes_blank_link')]"
 westernimperial_aeschraes_aagiokrata_1_desc: "#BOL Эшрей Эркаргад#! родился во время [odrstund|E|l] в семье этепезейского суб-губернатора $epistonicon_link$ Епистоникон#! и престижной династии $aercargiad_link$ Эркаргад#!. Когда Эшрею было 13 лет, Епистоникон, жестокий и садистичный пьяница, убил младшую сестру Эшрея (и его самого близкого человека) $arias_sister_link$ Ариас#! во время очередной вспышки гнева. В ответной ярости Эшрей сразил своего отца и полностью уничтожил дворцовый город, в котором жила его семья.\n\nПосле этой колоссальной демонстрации магической силы Эшрей бежал в [Concept('mayikrata','Майикратию')|E], где попал под обучение к $magister_peltra_link$ Магистру Пелтре#! вместе с другой бежавшей дворянкой — $aauto_axiaothea_link$ Аксиотеей#!. Хотя в то время они были близки, подстрекательства и манипуляции наставника превратили их в непримиримых соперников. В конце обучения им приказали сойтись в смертельном поединке. Эшрей, несмотря на то что был жестоко избит и изранен Аксиотеей, был объявлен победителем из-за формальности: Аксиотея потеряла сознание после [Concept('rathiax_incident', 'катастрофической битвы')|E], что заставило Совет Майикпрололлан преждевременно прекратить дуэль.\n\nЭшрей, окончив обучение и получив звание Магистра Майикпрололлан, вступил в $state_legio_xxi_link$ Государственный Легион XXI «Анесимасий»#! и со временем возглавил его. Однако популярное мнение о том, что настоящей победительницей дуэли была Аксиотея, продолжало преследовать его репутацию. Шли годы, политическое положение Эшрея оставалось уважаемым, но не слишком выдающимся, хотя они с Аксиотеей снова столкнулись на политической арене после её брака с $aauto_anesimasios_link$ аавтократом Анесимасием#!. На одном из свадебных банкетов Анесимасия и Аксиотеи присутствовавший Эшрей провел несколько тайных разговоров с Аксиотеей. Суть этих бесед так и осталась неизвестной, но в конце банкета произошло печально известное [Concept('poisoning_of_anesimasios', 'отравление Анесимасия')|E].\n\nВсего за одну ночь аверсарианская политика снова содрогнулась, и началась [Concept('imperial_civil_war','Имперская гражданская война')|E]. Эшрей одержал победу ценой своей империи и своей новой семьи, сотворив ужасающее заклинание [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E]. Эшрей правил из $oraispol_link$ Орайсполя#! своей [Concept('ashen_aautokrata_fix', 'Пепельной аавтократией')|E] вместе с такими печально известными соратниками, как $karthyn_link$ Картин Деленель#! и $demetros_iron_spike_link$ Димитрий «Железный Шип»#!, пока в 1229 году от И.С. $legan_isacea_link$ Леган Исакея#! не возглавил [the_vilnian_assault|E|l]. В результате этого штурма Эшрей был свергнут и [Concept('the_oration_of_legions', 'объявлен мертвым')|E] на всем [Concept('the_continent', 'Расколотом побережье')|E]. Это было преувеличением, однако из-за уничтожения [Concept('theyssian_scrivenery_network','Тейссианской писчей сети')|E], вызванного $terrox_link$ Архимагом Терроксом#!, устроенного архимагом Терроксом, держава Эшрея окончательно распалась во времена, когда полыхнули [Concept('six_great_revolts','шесть великих восстаний')|E]."
 aauto_aeschraes_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('westernimperial_aeschraes_aagiokrata_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('westernimperial_aeschraes_aagiokrata_1').GetID]"
 aauto_aeschraes_blank_link: "#V"
 westernimperial_aeschraes_aagiokrata_1_mini: "Человек, разорвавший мир в клочья..."
 westernimperial_aeschraes_aagiokrata_1_birth: "Родился [Character.GetBirthDate.GetStringShort] в [GetTitleByKey('c_thronactus').GetNameNoTier]"

