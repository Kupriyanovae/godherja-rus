 # aloric - etrandanexi_lifepath_13
 aloric_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'aloric_true_link', 'aloric_blank_link')]"
 etrandanexi_lifepath_13_desc: "#BOL Алорик Заносчивый#! был последним правителем Этрандекси, именовавшим себя королём $faegift_link$ Фейгифта#!; он правил накануне [Concept('aversaria', 'аверсарианского')|E] завоевания в IV веке. Властолюбивый человек, он запомнился главным образом своими амбициями стать верховным королём $reach_link$ Предела#! — затея, которой помешал $marcomer_link$ Маркомер#!. Тяжело оскорблённый этим мнением, он отказался сотрудничать с Маркомером в военной кампании и вместо этого попытался противостоять аверсарианцам в одиночку — с катастрофическими и в конечном счёте роковыми последствиями для себя."
 aloric_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('etrandanexi_lifepath_13').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('etrandanexi_lifepath_13').GetID]"
 aloric_blank_link: "#V"
 etrandanexi_lifepath_13_mini: "Легендарный шевигадский вождь, соперник Маркомера..."

