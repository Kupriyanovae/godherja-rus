 # cenware - daukeni_sjalvolki_1
 daukeni_sjalvolki_1_title: "Сокрушитель Ведьм"
 cenware_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'cenware_true_link', 'cenware_blank_link')]"
 daukeni_sjalvolki_1_desc: "#BOL Ценвар Древиниц#! родился во времена глубокого кризиса сьялволков, когда [Concept('the_fog', 'Туман')|E] поглощал земли его народа одну за другой. Ценвар, исключительно ученый и разумный юноша, стал тем, кто положил конец распрям между кланрехами даукени. Проведя испытание [Concept('dovatkning', 'Доваткнинг')|E] среди 20 претендентов (одним из которых был его собственный брат $eofwine_link$ Эофвин#!), он был признан Верховным королем. Вслед за тем он собрал великую коалицию сьялволков и, призвав к [Concept('the_tribespact', 'Племенному пакту')|E] иные спасавшиеся бегством кланы, скрепил основание $imperrech_link$ Сьялвольского имперреха#!, даровав начало [Concept('sjalvolki_migration', 'Великому переселению сьялволков')|E].\n\nВо время долгого похода через Катраддию Имперрех большую часть пути вел стычки с союзом под началом $kyver_ioldon_link$ наместника Иолдона#! на пути к Серым Вратам — одному из немногих безопасных проходов к берегам [Concept('the_continent', 'Расколотого побережья')|E]. В одном из этих сражений Ценвар сразил Иолдона, вынудив его сына $nicanoneus_link$ Никанонея#! принять командование. А на самом великом сходе их воинств в Битве у Серых Врат Ценвар наголову разбил Никанонея, открыв путь к Расколотому побережью.\n\nИмперрех, действуя через $reach_link$ Микрос Калатипсоми#!, в 1246 году от И.С. устремился в [Concept('sacking_of_the_mayik', 'Майикратию')|E] в поисках реликвий и припасов для похода в саму [Concept('aversaria', 'Аверсарию')|E]. Вслед за великим успехом Имперрех продвинулся вглубь $cornucopia_link$ Мегос Калатипсоми#!. Навстречу им вышли 16 аверсарианских легионов, и вслед за тем разразилась лютая, почти шестимесячная [Concept('battle_of_ten_trees', 'Битва десяти деревьев')|E]. Победа Имперреха сокрушила последние остатки аверсарианского сопротивления. Пять лет спустя Ценвар снова посрамил имперскую гордость в Битве у Элизийского перевала."
 cenware_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('daukeni_sjalvolki_1').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('daukeni_sjalvolki_1').GetID]"
 cenware_blank_link: "#V"
 daukeni_sjalvolki_1_mini: "Объединитель сьялволков, вестник новой эпохи..."

 # sigrun - caemansi_sjalvolki_14
 caemansi_sjalvolki_14_title: "Топор-в-Руке"
 sigrun_link: "[SelectLocalization(HasGameStartedForTheFirstTime, 'sigrun_true_link', 'sigrun_blank_link')]"
 caemansi_sjalvolki_14_desc: "С малых лет было ясно, что #BOL Сигрун Крейвициц#! любила драку. Она с охотой задирала других детей, невзирая на их возраст или рост, и порой одерживала верх даже над теми, против кого у нее, казалось, не было никаких шансов. Мужи и юноши ее племени часто смеялись над ее мечтой стать воином. Все изменилось, когда Сигрун сразила своего первого врага в 14 лет — разбойника, напавшего на нее из засады, когда она рубила дрова для костров. С той поры Сигрун шла по пути воителя, ни на миг не расставаясь с топором.\n\nСигрун прославила себя во множестве битв и стычек, вершиной которых стало ее участие в Битве у Элизийского перевала. Вслед за тем ряды ее дружины пополнились множеством ретивых воев, жаждавших вписать свое имя в саги кровью под ее началом. Но Сигрун жаждала куда большей сечи и славы, нежели могла найти в армиях $imperrech_link$ Сьялвольского имперреха#!, а потому повела свою дружину «захватить» флот дракаров, дабы совершить опасное плавание и затеять войну в $etepezea_link$ Этепезее#!. Сойдя на берег в $zacope_link$ Закопе#!, она сразила в поединке местного владыку $attaginos_link$ Аттагиноса Кефалона#! и забрала себе власть над этой землей, мечтая снискать славу еще до прихода $cenware_link$ Ценвара#! и ее соплеменников из Имперреха."
 sigrun_true_link: "#underline;clickable;ONCLICK:CHARACTER,[GetScriptedCharacterByHistoryID('caemansi_sjalvolki_14').GetID];TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('caemansi_sjalvolki_14').GetID]"
 sigrun_blank_link: "#V"
 caemansi_sjalvolki_14_mini: "Дева-воительница, жаждущая крови и славы..."

