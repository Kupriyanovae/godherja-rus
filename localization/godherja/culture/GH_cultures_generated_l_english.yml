## Talareg ##
 
# Talareg
 talareg: "Talareg"
 talareg_collective_noun: "Talaregs"
 talareg_prefix: "Talareg"
 talareg_desc: "#size:15    A confederation of tribes from the far northern tundra, the Talaregs are feared by many as the [Glossary( 'Molravojrir', 'GH_MOLRAVOJRIR_GLOSS' )] - fierce, yet surprisingly well-coordinated raiders adorned with markings drawn using an unknown blue dye.\n\nDeeply spiritual, they possess an unusual affinity with the world unseen, and many of their shamans claim to hear whispers from a higher being. Highly patriarchal due to their beliefs, Talareg warriors occupy the top of their society, yet their female Magi are highly sought after as seers, and are renowned as the famed 'snow-witches' of the north.#"
 talareg_opinion: "#E Talareg#! Opinion"
 

## Aupagn ##
 
# Zoldagn
 zoldagn: "Zoldagn"
 zoldagn_collective_noun: "Zoldagn"
 zoldagn_prefix: "Zoldagn"
 zoldagn_desc: "#size:15    Dwelling deep in the precipitous northern mountains, the Zoldagn are a reclusive tribe rarely encountered by most. Their elders often embark on spiritual journeys to attain enlightenment — the wizened old hermits being a common feature in the tales and sagas of the north. The Zoldagn are highly respected for their wisdom by the other mountain clans, and powerful chieftains are often seen with a Zoldagn advisor by their side.#"
 zoldagn_opinion: "#E Zoldagn#! Opinion"
 
# Sarridian
 sarridians: "Sarridian"
 sarridians_collective_noun: "Sarridians"
 sarridians_prefix: "Sarridian"
 sarridians_desc: "#size:15    The original inhabitants of the Black Mountains, the Sarridians have a deep connection to the rugged peaks they call home. Subjugated by successive people groups, their culture has become malleable and quick to adapt to changes in circumstance. Unlike many conquered by [aversaria|E], the Sarridians whole-heartedly adopted the [aversarinas_aagiokratia|E] as their own, small rustic temples dot the hillscape most of which not officially commissioned by Imperial Authority. Like many slaves, they were put to work in the [bloodcrystal|E] mines of the Black Mountains, not expected to last a month, many fled to the [chevalie|E] where they have become a sizable minority. Their favourite past-time of Skiing becoming a popular sport among Marcher youths.#"
 sarridians_opinion: "#E Sarridian#! Opinion"
 
# Hrunzag
 hrunzag: "Hrunzag"
 hrunzag_collective_noun: "Hrunzagi"
 hrunzag_prefix: "Hrunzag"
 hrunzag_desc: "#size:15    To the Hrunzag, honor is all, with their society operating under a strict hierarchy based on not only one's personal honor, but also that of their clan. The tribe enforces their moral standards strictly and an individual causing grave dishonor can lead to the exile of their entire clan. The Hrunzag keep a detailed record of their ancestors' heroic deeds through song, with the most ancient and esteemed clans having song-epics that require several days to fully perform.#"
 hrunzag_opinion: "#E Hrunzag#! Opinion"
 
# Krupleg
 krupleg: "Krupleg"
 krupleg_collective_noun: "Kruplegs"
 krupleg_prefix: "Kruplegi"
 krupleg_desc: "#size:15    A reclusive tribe dwelling at the northern Iron Spines, the Krupleg are renowned both for their viciousness in battle and their use of [shimmerstone|E], a rare [Concept('magic','magical')|E] crystal only found within their mountain haunts. The tribe liberally makes use of the crystal in their various rituals, and fiercely defend their mines from the outsiders that covet it. Despite their savagery, the Krupleg are oddly welcoming of outsiders, considering those who join and distinguish themselves in one of their raids to be blood-kin — making them members of the tribe itself.#"
 krupleg_opinion: "#E Krupleg#! Opinion"
 
# Dodragn
 dodragn: "Dodragn"
 dodragn_collective_noun: "Dodragni"
 dodragn_prefix: "Dodragnic"
 dodragn_desc: "#size:15    A patchwork tribe of the banished, the broken and the disposessed — the [Glossary( 'Dodragn', 'GH_DODRAGN_GLOSS' )] serve as a second chance for those who have fallen afoul of their original clans. Due to their origin, the clan places little importance on rules and codes of conduct, allowing most actions so long as it benefits the many. The sole exception to this is the their high regard for the rules of hospitality, and even the most disheveled wanderer can find refuge in the hearths of the Dodragn.#"
 dodragn_history_loc: "Descended from various [GetCulturePillar('heritage_aupagn').GetName] exiles driven from their tribes"
 dodragn_opinion: "#E Dodragn#! Opinion"
 
# Druhan'daehzag
 druhandaehzag: "Druhan'daehzag"
 druhandaehzag_collective_noun: "Druhan'daehzagsur"
 druhandaehzag_prefix: "Druhan'daehzagic"
 druhandaehzag_desc: "#size:15    The Druhan'daehzag (the etymology long forgotten) are more popularly known by other Iron Spine tribes as the 'Oddfolk' for their status as the most alien of the mountain clans. They identify themselves to be the ancient servants of the 'Goldkin', ancient [Concept('aelfir','ebony-skinned demons')|E] with golden faces that remain immortalized in ancient statues scattered around the mountains.\n\nThe tribe considers it to be their mission to retrieve all remnants of the Goldkin — believing themselves to be the only people fit to use them — with their greatest chiefs wearing the hallowed golden faces of their masters. The Druhan'daehzag view all slaves to be equal to them in status, and are obligated to house and feed any slave in their employ, almost on a whim, their fate often decided by whether the raiders can afford to house and feed them.#"
 druhandaehzag_opinion: "#E Druhan'daehzag#! Opinion"
 

