# Ixsian
 ixsian: "Ixsian"
 ixsian_collective_noun: "Ixiani"
 ixsian_prefix: "Ixsian"
 ixsian_desc: "#size:15    Often named in [Concept('aversaria','Aversarian')|E] poems as a 'people lost in time', Ixsians are [Concept('shatteredisles','Islanders')|E] of the formerly lost [Glossary('polis','GH_POLISOCRACY_GLOSS')] of [GetTitleByKey('b_ixs').GetNameNoTier]. During the [war_of_the_thousand_dragons|E], the city's elected peerage of [magi|E] (the Council of the Thirteen) despaired at the death of their last [Concept('dragons','Dragon')|E], Thusinarix. After [GetTitleByKey('b_carox').GetNameNoTier] and its famed Diarchy of Runic Armor-clad despots were lost to dragonfire, a hastily prepared [gh_ritual|E] was performed to shield Ixs and its satellite cities from the world.\n\nThe ritual, instead, caused a great wave to across the islands with all traces of the city and its inhabitants vanished once the waters receded.\n\nIn the 7th century a great wave once again washed over the islands and wiped out the new settlements that had since been rebuilt, but once the waters subsided, Ixs and its inhabitants were returned as if less than a century had passed. While the [ixsian_war|E] would nearly destroy the returned city, the Ixsians have long since rebuilt. The city's archives are prized for containing troves of lost literature and artifacts, but some say that the ancient ritual still curses the inhabitants to the modern day.#"
 ixsian_opinion: "#E Ixsian#! Opinion"
 
# Abdêxorn
 abdexorn: "Abdêxorn"
 abdexorn_collective_noun: "Abdêxorni"
 abdexorn_prefix: "Abdêxornic"
 abdexorn_desc: "#size:15    The Abdêxorn were born in the throes of war. In the ancient days of the [Glossary('Polisocracy','GH_POLISOCRACY_GLOSS')], their ships provided a near-constant threat of piracy across the [Concept('shatteredisles','Isles')|E]. With each leader among them seeking to outdo the heroes that came before, the Abdêxorn placed strength above all other virtues.\n\nAs the [Concept('aversaria','Aversarinas Aautokrata')|E] eclipsed them and their piracy drove their enemies to work together and repel them, the Abdêxorn began the slow process of becoming much more like their Aversarian enemies. Their ancient heroes were transformed into powerful [magi|E], and the strength of one's blood became just as vital as any physical attribute.\n\nDespite their Aversarian trappings, however, the Abdêxorn have never forgotten the roots of their traditions, and possess an obsession for war that few in the Isles can match.#"
 abdexorn_opinion: "#E Abdêxorn#! Opinion"
 
# Symvolix
 symvolix: "Symvolix"
 symvolix_collective_noun: "Symvolixi"
 symvolix_prefix: "Symvolixic"
 symvolix_desc: "#size:15    The Symvolix are an ancient branch of [Concept('aversaria','Aversarian')|E] culture native to the eastern [Concept('shatteredisles','Isles')|E] of the Tower Sea, most notable for their continued practice of many archaic customs and social norms that have long since gone extinct among their distant cousins on the mainland.\n\nTheir basic political unit continues to be the [Glossary('polis','GH_POLISOCRACY_GLOSS')] of pre-Aversarian days of yore — their ancient institutions continue to operate, and their political systems are a diverse mix of oligarchies, democracies, autocracies and occasional hybrids and outliers. Due to the intensely parochial and competitive nature of this social system, outsiders are mistrusted, and rivalries between cities sometimes predate the Empire itself.\n\nLargely fallen from their antique glory days, Symvolix legends wistfully recall their golden age — these tales oftentimes growing completely fantastical and utopianistic in nature.#"
 symvolix_opinion: "#E Symvolix#! Opinion"
 
