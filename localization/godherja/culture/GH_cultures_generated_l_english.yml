## Kathuni ##
 
# Axeizu
 averkathuni: "Axeizu"
 averkathuni_collective_noun: "Axeizu"
 averkathuni_prefix: "Axeizu"
 averkathuni_desc: "#size:15    The Axeizu are a unique culture, formed in the lands held by the former Kathuni embassy in Malcois after the collapse of [aversaria|E]. The locals have latched onto the Kathuni culture of their overlords and protectors, attempting to mimic Kathuni customs despite being hundreds of leagues away from Kathun-Kai. The Kathuni ruling the area see the Axeizu as being a mockery of their culture, though a convenient one, as the populace they rule over idolize them, and are thus very willing to cooperate with them. The Axeizu have even adopted the language of their overlords over the Aversarian language which all of Malcois has used for centuries.#"
 averkathuni_opinion: "#E Axeizu#! Opinion"
 

