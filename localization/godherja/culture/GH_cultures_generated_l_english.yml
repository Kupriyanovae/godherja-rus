 eryriatic_islander_opinion: "#E Eryriatic Islander#! Opinion"
 

## Kherkeloi ##
 
# Serbarish
 serbarish: "Serbarish"
 serbarish_collective_noun: "Serbarishi"
 serbarish_prefix: "Serbarish"
 serbarish_desc: "#size:15    When the Zelkavani moved to subjugate the Entrepexatic cities of Servax in 1284 IS, dreams of finally purging the great cities from the [Concept('aversaria','Aversarian')|E] filth ran awry as they were met not by defenders at the walls but by cheering crowds at the opened gates. The great slave and peasant rebellions that had consumed the cities culminated into frenzied open revolt upon the arrival of the Zelkavani, and those Imperial aristocrats who had not fled abroad would greet the Zelkavani armies, impaled by the hundreds along the roads and walls of the cities by their [Glossary( 'Zekvot', 'GH_ZEKVOT_GLOSS' )] servants.\n\nWhile many Zelkavani leaders have considered the Zekvots — infected by Imperial belief and still living in community with many [Glossary( 'Enméxots', 'GH_ENMEXOT_GLOSS' )] and lower class Aversarians — to be inherently foreign, the wealth of the cities, and the size of their populations (far larger than the armies sent to subdue them) and their enthusiasm for Zelkavani culture would see the cities willingly submitting to Zelkavani leaders, beneath whom they have enjoyed a great degree of autonomy. The Serbarishi cities have since become a melting pot of Zekvot and Zelkavani customs, and a hotbed of cultural and technological transformation and development.#"
 serbarish_opinion: "#E Serbarish#! Opinion"
 

## Aversarian ##
 
# Western Aversarian
 westernimperial: "Western Aversarian"
 westernimperial_collective_noun: "Etepezeans"
 westernimperial_prefix: "Etepezean"
 westernimperial_desc: "#size:15    Western [Concept('aversaria','Aversarians')|E] represent the natives of Etepezea. Considered the progenitors of Aversarian culture despite its origins in the Isles, Western Imperials are considered exceptionally proud of their heritage and sure to make their strong bloodlines known through regular displays of power. They are a rather drab and dour people, but highly regarded as the most 'regal' and 'imperious'.\n\nDespite their wealth, they are not considered as decadent as other Aversarian cultures, preferring to let their riches be known through their reputation than through elaborate displays of their riches. Traditionally associated with the colors red, black and gold, Western Aversarian are largely known for their skilled politicking, strong rule, powerful magics and for the heavy infantry that would eventually build the Aversarian Legions. Many Aversarian scholars consider Western Imperial culture to be a creole of the innumerable city-states that would eventually be united into the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )], and as the modern progenitor for all other Imperial cultures.#"
 westernimperial_opinion: "#E Western Aversarian#! Opinion"
 
# Southern Aversarian
 southernimperial: "Southern Aversarian"
 southernimperial_collective_noun: "Opakhasians"
 southernimperial_prefix: "Opakhasian"
 southernimperial_desc: "#size:15    Southern [Concept('aversaria','Aversarians')|E] are those Aversarian native to the former cosmopolitan center of Opakhasia. While once very wealthy due to the riches of their homeland and its control over trade, the rise of Aironoi and the [chaos_of_the_seventh_century|E] devastated the province; causing depopulation, famine and war, as well as the loss of southern trade. Despite this, the nobility are still known for excessive displays of wealth, Starving slaves and livestock tending near-barren fields not uncommon while traveling to one of the many feasts in gold gilded halls of the nobility.\n\nAs the government of Opakhasia is descended from the ancient 'Mountain-Sun Temple', so are the trappings of Southern Aversarian culture. Southerners hold religious titles that would have been common a thousand years prior, and are known for displays of piety despite their decadence. The colors of Opakhasia are whites, golds and oranges, based off the colors of the ancient Mountain-Sun.#"
 southernimperial_opinion: "#E Southern Aversarian#! Opinion"
 
# Central Aversarian
 centralimperial: "Central Aversarian"
 centralimperial_collective_noun: "Malcoisiacs"
 centralimperial_prefix: "Malcoisiac"
 centralimperial_desc: "#size:15    [Concept('aversaria','Aversarians')|E] from the region of Malcois are oft referred to as Central Aversarians. Regarded as a rich people, they are not considered particularly proud or modern, preferring conservative politics and dress as compared to many of their countrymen. Known for managing the massive slave-estates and factories of Malcois, they wear simple clothes and armor of unpainted iron, and live in homesteads that double as forts in case of slave uprisings. Central Aversarian are considered an honest people, generally shunning intrigue and subterfuge as slave tactics and preferring their dealings me upfront and honest in nature.\n\nRarely known for any sort of show of wealth and power, they are still feared for their iron gripped rule, and nobles regularly carry chains of iron worn about their waist or over their shoulder, or decorating their armor, as a quiet sign to their enemies. The colors of Malcois are blue, grey, black and white.#"
 centralimperial_opinion: "#E Central Aversarian#! Opinion"
 
# Northern Aversarian
 northernimperial: "Northern Aversarian"
 northernimperial_collective_noun: "Kalathipsomians"
 northernimperial_prefix: "Kalathipsomian"
 northernimperial_desc: "#size:15    Northern [Concept('aversaria','Aversarians')|E] are a culture born out of the rugged colonies of [Concept('kalathipsomi_province','Kalathipsomi')|E]. Harboring a more practical outlook on life enabled them to become shrewd traders and excellent taskmasters, creating massive lumberyards, mines, and farms in Kalathipsomi. The initial harshness of the region has led to a more practical sense of [Concept('kalathipsomi_fashion','fashion')|E] not as extravagant as Aversarians in the south.#"
 northernimperial_opinion: "#E Northern Aversarian#! Opinion"
 
# Eastern Aversarian
 easternimperial: "Eastern Aversarian"
 easternimperial_collective_noun: "Aironoians"
 easternimperial_prefix: "Aironoian"
 easternimperial_desc: "#size:15    Eastern [Concept('aversaria','Aversarians')|E] are Aversarian born in the eastern cities of Aironoi. Technically the smallest of the Aversarian cultures due to the majority of Aironoi being ruled by steppe clans and native peoples, they nevertheless have represented the most wealthy and powerful of the the Empire since Aironoi's rise after the [chaos_of_the_seventh_century|E].\n\nExorbitantly wealthy thanks to the rise of [GetTitleByKey('c_asiupoli').GetNameNoTier] as the trade hub of Aversaria and the world, as well as the city's appointment as the capital of the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )], Eastern Aversarian are known for their exceptionally decadent showings of wealth. By the 10th century, most fashion in Aversaria was dictated by non-Eastern nobility playing catchup with the rapidly changing and often gaudy court dress of the east, and the nobility of Aironoi are known for regularly causing theological and cultural shocks through their displays designed to shock and make themselves the talk of Aversaria. Eastern Aversarian are traditionally associated with the colors pink, purple, teal, gold and white.#"
 easternimperial_opinion: "#E Eastern Aversarian#! Opinion"
 
# Outer Aversarian
 outer_aversarian: "Outer Aversarian"
 outer_aversarian_collective_noun: "Katraddians"
 outer_aversarian_prefix: "Katraddians"
 outer_aversarian_desc: "#size:15    The descendents of [Concept('aversaria','Aversarian')|E] colonists and the many legions retired to the land after the [Concept('chaos_of_the_seventh_century','Kartharaddi Wars')|E], the Imperials of what would become known as Katraddia would become greatly wealthy thanks to the great abundance of fertile land along the Eramasic river at the governorate's center.\n\nWhile rich, powerful and integral to the Empire's food supply and trade network, the aristocracy of the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )]'s youngest governorate would nevertheless chaff endlessly against the [Concept('katraddia_province','condescension')|E] of their southern kin who have traditionally seen all Imperials of the north as '[Glossary( 'Apokiakas', 'GH_APOKIAKAS_GLOSS' )]'. The creation of the Tapestry of the Legions in Chagraddix would be the first time the 'colonists' would be recognized for their artistic merit and lead to their recognition as 'equals' to the other major cultures of the Empire.#"
 outer_aversarian_history_loc: "Formed from [Concept('aversaria','Aversarian')|E] settlers along the Eramasic river valley in the year 871 IS"
 outer_aversarian_opinion: "#E Outer Aversarian#! Opinion"
 
# Imperial Islander
 imperialislander: "Imperial Islander"
 imperialislander_collective_noun: "Imperial Islanders"
 imperialislander_prefix: "Imperial Islander"
 imperialislander_desc: "#size:15    The inhabitants of the [Concept('imperial_isle_biozone','Imperial Isle')|E] are the last pure remnants of a time before the blood of ancient [aversaria|E] was diluted across the mainland — at least according to themselves. They've developed somewhat of a one-sided rivalry with their mainland cousins, but while Etepezea grew to dominate Aversaria culturally for most of its history the Islanders turned inward, they are a culture of ruins and museums, of performers acting out supposed ancient rituals for paying customers from all across the empire.\n\nThe traditional colors associated with the Islanders are purples, blues, and reds.#"
 imperialislander_opinion: "#E Imperial Islander#! Opinion"
 
# Blackfort Imperial
 apokiakas: "Blackfort Imperial"
 apokiakas_collective_noun: "Apokiakans"
 apokiakas_prefix: "Apokiakas"
 apokiakas_desc: "#size:15    [Glossary( 'Apokiakas', 'GH_APOKIAKAS_GLOSS' )] is the term given to any [Concept('aversaria','Aversarian')|E] hailing from the northeastern territories of Katraddia. Descended primarily from Kalathipsomian colonists, living on a harsh frontier has led them to develop a stoic and utilitarian outlook, shunning opulence in favor of cold practicality. Some went even [Concept('katraddia_tribal_mixing','further')|E], resulting in them being [Concept('katraddia_province','held in low regard')|E] by their fellow Aversarians.#"
 apokiakas_opinion: "#E Blackfort Imperial#! Opinion"
 
# Eastern Apokiakas
 eastern_apokiakas: "Eastern Apokiakas"
 eastern_apokiakas_collective_noun: "Apokiakans"
 eastern_apokiakas_prefix: "Apokiakas"
 eastern_apokiakas_opinion: "#E Eastern Apokiakas#! Opinion"
 
# Skorikiakas
 skorikiakas: "Skorikiakas"
 skorikiakas_collective_noun: "Skorikiakasi"
 skorikiakas_prefix: "Skorikiakan"
 skorikiakas_desc: "#size:15    Widely recognized to be the last living remnants of the [Concept('kartharadd','Kartharaddi Imperium')|E], the [Glossary( 'Skorikiakas', 'GH_SKORIKIAKAS_GLOSS' )] are descended from the intermixing of Kartharaddi settlers and the [Concept('aversaria','Aversarian')|E] locals in Kartharaddi-occupied Malcois during the [chaos_of_the_seventh_century|E]. Crucially however, they descend from those who joined in the resistance against Kartharadd, sparing them from the [Concept('night_of_the_bleeding_moon','fate')|E] that befell their Imperium-loyal kin and the ensuing Imperial purge. The ancestors of the modern Skorikiakas were quick to emphasize the Aversarian side of their blood, and their aristocracy's attempts to disassociate themselves from a dead culture they had never known would lead to them becoming one of the most rabidly pro-Imperial and conservative factions in the Empire. Despite their pride in their Aversarian heritage, they nevertheless keep alive several traditions and practices of the Imperium, particularly in the field of metalworking.#"
 skorikiakas_history_loc: "Descended from the intermixing of [Concept('kartharadd','Kartharaddi')|E] settlers and soldiers with local [Concept('aversaria','Aversarians')|E] during the [Concept('chaos_of_the_seventh_century','Kartharaddi Wars')|E]"
 skorikiakas_opinion: "#E Skorikiakas#! Opinion"
 
# Phalonix
 phalonix: "Phalonix"
 phalonix_collective_noun: "Phalonixians"
 phalonix_prefix: "Phalonixian"
 phalonix_desc: "#size:15    The Phalonox derive their name from the city of [Glossary( 'Phalonoxonpoli', 'GH_PHALONOXONPOLI_GLOSS' )], the first major Malcoisiac settlement in modern Katraddia. The value of the city's commanding position on the Eramasic was immediately evident, and it would rapidly grow and usher forth a great surge of [Concept('aversaria','Aversarian')|E] colonists into the [continental_interior_biozone|E]. These colonists would soon — allegedly — intrude upon the borders of the then-unknown [Concept('kartharadd','Kartharaddi Imperium')|E], sparking the [Concept('chaos_of_the_seventh_century','Kartharaddi Wars')|E].\n\nWhile the Phalonix claim descent from these colonists, in truth the Aversarian population north of Malcois would be wiped out when the Kartharaddi conquered the region (and razed Phalonoxonpoli) in 645 IS, any survivors in the region thereafter being adopted into the Kartharaddi slave system and perishing in the [Concept('night_of_the_bleeding_moon','Bleeding Moon')|E]. Despite folklore to the contrary, the Phalonox are primarily descended from the rush of colonists and legion land grants that would follow the Aversarian victory in the wars.#"
 phalonix_opinion: "#E Phalonix#! Opinion"
 
# Redrunner
 redrunner: "Redrunner"
 redrunner_collective_noun: "Redrunners"
 redrunner_prefix: "Redrunner"
 redrunner_desc: "#size:15    In the southeastern corner of Aironoi, the land fades from its normal hues into a deep red. Canyons snake through the region, and [magi|E] report negative effects emanating from it. Despite this, the children of [aversaria|E] have still settled this land, or at least pieces of it. Along the coastline, a series of walled enclaves host a people known as the Redrunners, who earned their name due to their important role in trade, connecting the mysterious lands to the west to Aversaria.\n\nThe Redrunners are perhaps one of the most alien Aversarian cultures, and are often perceived as such by their counterparts across the empire. Their inability to colonize the inland has left them a series of isolated fortresses, and interestingly created one of the most socially mobile poulations in the empire. As their economy is almost entirely based around trade, those with the ability to claw their way to the top are able to regularly break with social convention. The Redlanders also carry a series of superstitions, fearing the canyons from which it is said that none can return.#"
 redrunner_opinion: "#E Redrunner#! Opinion"
 
# Aversarian Islander
 islander: "Aversarian Islander"
 islander_collective_noun: "Aversarian Islanders"
 islander_prefix: "Aversarian Islander"
 islander_desc: "#size:15    [Concept('aversaria','Aversarian')|E] Islanders were once called by the scholar Magister Archaea of Cnidera in her famous satirical works to be "As humble as the Opakhasians, as decadent as the Malcoisiacs, as civilized as the Katraddians, and as Aversarian as the Kathuni". A mix of political feuds and — especially as time has marched on and the core of Aversaria moved from the Imperial Isle to Etepezea — neglect has led to the [Concept('shatteredisles','Isles')|E] of Aversaria being one of the most neglected and poverty-stricken regions of [aeras|E]. Aversarian Islanders are often so neglected as to often find themselves in slavery thanks to slave raids, kidnapping and debt despite their citizenship, a crime punishable by death in Aversaria only for those who are caught doing it.\n\nDespite this, Islanders are near-universally some of the proudest of the world. Each Isle is known to meticulously track its local history and those deemed to be local heroes, events as small as the building of a new barn often leading to widespread festivities and marking in historical record. For when all the world has forgotten you and you must struggle to simply survive, the Isles show that you may often survive only thanks to the solidarity of your fellow man.#"
 islander_opinion: "#E Aversarian Islander#! Opinion"
 
# Central Aversarian Islander
 centralislander: "Central Aversarian Islander"
 centralislander_collective_noun: "Central Aversarian Islanders"
 centralislander_prefix: "Central Aversarian Islander"
 centralislander_desc: "#size:15    Inhabiting the rocky [Concept('shatteredisles','Isles')|E] that divide Etepezea and Opakhasia, Central Islanders live a hard-bitten life at the improvished fringe of what most consider civilisation. In spite of their cultural obscurity, Central Islanders can be found in most [Concept('aversaria','Aversarian')|E] coastal towns and villages, selling or tithing all manner of fish, eels, and crabs harvested from the teeming waters of the Sea of Empires.\n\nThey have a reputation for being cold and unfriendly to outsiders but to their fellow Central Islanders they show a different face, generous to the point of self sacrifice. It is not uncommon for the survivors of shipwrecks to be adopted wholesale into Central Islander families, and are treated as equals if they can prove their worth. For those seeking fortune elsewhere, the only reliable way they find to escape their poor circumstances is service in the Marine Legions, whose ranks are swelled each year by youngsters seeking anything but a life spent repairing nets and crab traps, to the point that their ranks are nearly entirely composed of young Islanders.#"
 centralislander_opinion: "#E Central Aversarian Islander#! Opinion"
 
