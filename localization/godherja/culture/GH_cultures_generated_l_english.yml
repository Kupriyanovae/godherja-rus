## Marcher ##
 
# Oejeynican
 oejeynica: "Oejeynican"
 oejeynica_collective_noun: "Oejeynicans"
 oejeynica_prefix: "Oejeynican"
 oejeynica_desc: "#size:15    Oejeynicans are the partially assimilated descendants of refugees that fled southwards during the [sorrowing_of_oejeynica|E]. After centuries of [Concept('marchers','Marcher')|E] oppression, they would be [Concept('oejeynican_royal_charter','granted land')|E] by High Queen Arelli and placed under a Grand Duke.\n\nAfter intermingling for near-millenia, the Oejeynicans have been heavily influenced by Chevalien culture, though they still retain several traditions and customs. In particular, they speak a distinct dialect that blends Ojyczaynz and Chevalien, as well as having infamously grim interpretations of southern festivals.#"
 oejeynica_opinion: "#E Oejeynican#! Opinion"
 
# Étrandanexi
 etrandanexi: "Étrandanexi"
 etrandanexi_collective_noun: "Étrandanexi"
 etrandanexi_prefix: "Étrandanexi"
 etrandanexi_desc: "#size:15    The [Glossary( 'Étrandanexi', 'GH_ETRANDANEXI_GLOSS' )] are the descendents of the ancient Marcher colonists in Kalathipsomi that 'controlled' the region until the [Concept('aversaria','Aversarian')|E] victory in the [marcher_aversarian_wars|E]. While technically defeated, shrewd politicking and outright lying (Marcher lords oft claiming to rule wide swathes of land while in reality controlling little outside their castle doors) led to the Marcher settlers not only retaining their power but also growing it massively.\n\nBenefiting greatly from extermination campaigns against the native clans by the Legions, the Marchers would politic their way into controlling half of Kalathipsomi through treaties that led to Kalathipsomi's governorship being split between a permanent Marcher seat and Aversarian one. Thereafter, the Étrandanexi would form, an eclectic mix of Marcher and Aversarian culture that quickly earned a reputation for robbing and pillaging traveling merchants endlessly and extorting those few native tribes that survived for profit.\n\nThe Étrandanexi would even become highly looked down upon in [chevalie|E] itself, blatantly using slave labor and participating in the slave trade despite the teachings of the Lifepath, though no Marcher has ever been able to turn away from a good profit...#"
 etrandanexi_opinion: "#E Étrandanexi#! Opinion"
 

## Ojyczayn ##
 
# Ojyczaynz
 ojyczaynz: "Ojyczaynz"
 ojyczaynz_collective_noun: "Ojyczaynz"
 ojyczaynz_prefix: "Ojyczny"
 ojyczaynz_desc: "#size:15    Once among the most advanced civilizations in [murnyr|E] and [aeras|E], masters of both science and [dead_magic|E] and unrivaled by the primitive Shewigad tribes of ancient [chevalie|E], the great hubris and [Concept('magic', 'magics')|E] of old Ojyczaynzija would end in their eradication in the [sorrowing_of_oejeynica|E].\n\nTheir homelands are now a frozen wasteland of nameless ruins inhabited only by the [Concept('lichdom','living dead')|E].#"
 ojyczaynz_opinion: "#E Ojyczaynz#! Opinion"
 

