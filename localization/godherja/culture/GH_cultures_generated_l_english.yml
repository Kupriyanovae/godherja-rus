## Fogeater ##
 
# Fogeater
 fog_eaters: "Fogeater"
 fog_eaters_collective_noun: "Fogeaters"
 fog_eaters_prefix: "Fogeater"
 fog_eaters_desc: "#size:15    Fogeaters are the [Concept('mutations','Mutated')|E] remains of humans who were left trapped in the [foglands|E] after [frodbrokna|E]. Whether they can still be considered human, mutated human, or a form of [Concept('fogbeasts','Fogbeast')|E] is hotly debated, and little is known about the particulars of their 'culture' or beliefs.\n\nWhat is known is that they were once a series of tribes scattered across the far northeast, and unlike most who die when trapped within the [Concept('the_fog','Fog')|E], they instead adapted to it and changed into something different. They now uniformly worship what they call the 'Mistmother', a personification of the fog, who they believe speaks to them through it.\n\nFogeaters themselves have little remains of human sentience, generally little more than gibbering wrecks who have only retained enough sentience to perform raids and ambushes out of the foglands and kill themselves upon capture. Physically, they possess an unnaturally pale skin from which many of their veins and sometimes even organs can be seen through, and unnaturally spindly and ill-proportioned limbs. Their eyes retain multiple colors not seen in other humans as well, including reds, purples, whites and blacks. Blindness is prevalent, though they seem unnaturally immune to most known sicknesses, and have far less need for food or water in comparison to humans. Despite this, cannibalism is extremely common, somehow connected to their odd religious beliefs.#"
 fog_eaters_opinion: "#E Fogeater#! Opinion"
 

## Redlander ##
 
# Redlander
 redlander: "Redlander"
 redlander_collective_noun: "Redlanders"
 redlander_prefix: "Redlander"
 redlander_desc: "#size:15    The vastness of the Redlands are inhabited by a number of diverse cults, their enigmatic members seeming different to normal humans. Veiled in cloth to shield themselves from the sun, and adapted to the strange and hostile conditions of their homeland, the Redlanders are almost entirely unknown to most outsiders.\n\nFanciful tales are spun of them, telling of a people who have managed to survive one of the most brutal regions on [aeras|E] through cruelty, grit, and adaptation. They are used as villains in stories, their myriad cults providing a number of interesting and terrifying opponents. Such depictions are able to vary greatly in their details due to both the lack of knowledge most people have, and the sheer diversity of the Redlander people, with each individual grouping being in its own way fascinating and alien to outsiders. These seperate tribes are constantly fighting each other, though the causes of such feuds are unknown, perhaps unknowable, to outsiders. While some have posited they fight simply for survival, others have claimed that their is a more sinister intent behind their motions, the goal of which is yet to be seen.#"
 redlander_opinion: "#E Redlander#! Opinion"
 

## Bestial ##
 
# Beast
 bestial: "Beast"
 bestial_collective_noun: "Beasts"
 bestial_prefix: "Bestial"
 bestial_desc: "#size:15    [aeras|E] is home to a wide number of beasts, ranging from mundane to [Concept('magic','Magical')|E]. Scholars often group creatures into three broad categories: [natural_creatures|E], [godtouched_creatures|E], and [Concept('mutations','Mutant Creatures')|E].#"
 bestial_opinion: "#E Beast#! Opinion"
 
# Dragon
 gh_dragon_culture: "Dragon"
 gh_dragon_culture_collective_noun: "Dragons"
 gh_dragon_culture_prefix: "Draconic"
 gh_dragon_culture_desc: "#size:15    Dragons were [godtouched_creatures|E] that primarily resided in [aversaria|E] and parts of northeastern [sarradon|E] from a time before the historical record until roughly the middle of the third century IS. Ferocious and massive reptilian beasts, they boast a number of [Concept('dragons','magical characteristics')|E], and showed an intelligence at or above a human level.\n\nThe Dragons were seemingly wiped out during and after the [war_of_the_thousand_dragons|E], first from battle and then later after Aautokratir Aexionarax deemed the remaining dragons too dangerous and had them slaughtered.#"
 gh_dragon_culture_opinion: "#E Dragon#! Opinion"
 

