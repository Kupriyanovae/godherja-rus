# Ojyczaynz Lich
 lich_culture: "Ojyczaynz Lich"
 lich_culture_collective_noun: "Ojyczaynz Liches"
 lich_culture_prefix: "Ojyczny"
 lich_culture_opinion: "#E Ojyczaynz Lich#! Opinion"
 
# Kashiryan Lich
