## Kelthiunai ##
 
# Dasulanoi
 dasulanoi: "Dasulanoi"
 dasulanoi_collective_noun: "Dasulanoi"
 dasulanoi_prefix: "Dasulanoi"
 dasulanoi_desc: "#size:15    An ancient [Glossary('polis','GH_POLISOCRACY_GLOSS')] culture of Kalathipsomian origin, the Dasulanoi have long been known for their historically vast commercial networks that span the [shatteredisles|E]. Forming a network of autonomous, oligarchic city-states, the Dasulanoi were integrated into the [Concept('aversaria','Aversarian')|E] polity both diplomatically and militarily in the age of piracy, earning many collaborative families privileged status within the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )].\n\nTime however has seen the Aversarian ideals of supremacy take heart in the Dasulanoi, tempering maritime ambition with pride and power through purity. Intra-family warfare over long-standing commercial feuds has since seen prosperity traded for a cycle of vengeance, leading to faultlines over religion, political division and even popular uprisings led by ambitious minor families, conflicts often devastating in their totality.#"
 dasulanoi_opinion: "#E Dasulanoi#! Opinion"
 
# Theugundarope
 theygundarope: "Theugundarope"
 theygundarope_collective_noun: "Theugundaropi"
 theygundarope_prefix: "Theygundarope"
 theygundarope_desc: "#size:15    The history of the Theugundaropi has been one of constant struggle and survival. Hailing from the land now known as Kalathipsomi, the Theugundaropi have long ago been driven out of their forest homes, and forced to settle in the rocky [Concept('shatteredisles','Isles')|E] they now call home. Their [Concept('aversaria','conquerors')|E] have then conscripted the Theugundaropi as slaves, levying tithes from the island communities once every five years. Aversarian control of the islands was relatively light however, and they appointed the local elite class of the Theisklavoi to rule over the Theugundaropi in their stead. Despite being a chained people, the Theugundaropi remain proud, and have retained much of their old traditions — living pictures of the clanlanders of old.#"
 theygundarope_opinion: "#E Theugundarope#! Opinion"
 
# Theisklavoi
 theygundarope_aversarian: "Theisklavoi"
 theygundarope_aversarian_collective_noun: "Theisklavos"
 theygundarope_aversarian_prefix: "Theisklavoi"
 theygundarope_aversarian_desc: "#size:15    When the [Concept('aversaria','Aversarians')|E] invaded the Theugundaropi, not all of them resisted. Five families reached out to their foes, and with their assistance, ensured victory for the conquerors. This is the origin of the Theisklavoi, the ruling elite that has governed the Theugundarope for generations. It is they who are responsible for collecting the tithes from their lesser kin and are rewarded part of the total tithes they collect, leading the Theisklavoi to quickly rise in their [Concept('shatteredisles','isles')|E]' hierarchy.\n\nThe Theisklavoi have great pride in their identity and are easily offended when they are confused for the Theugundaropi they command. They place great importance on one's heritage, and their leaders are required to be able to clearly trace their descent from one of the five families. Due to most of the menial work in the islands being performed by the Theugundaropi, the Theisklavoi had more time for leisure and developed an aptitude for the arts. Their painters, in particular, are well-regarded, and many an Aautokratir has had his portrait made by a Theisklavoian.#"
 theygundarope_aversarian_opinion: "#E Theisklavoi#! Opinion"
 

## Konijkmener ##
 
# Konijkmener
 konijkmener: "Konijkmener"
 konijkmener_collective_noun: "Konijkmen"
 konijkmener_prefix: "Konijkmener"
 konijkmener_desc: "#size:15    Hailing from the southern peninsula of [chevalie|E], the Konijkmener have gained the reputation of a proud and industrious people. Historically, they were a people united in taming the miserable swamps of their homeland. Their magical swamp water has been peddled throughout [aversaria|E], allowing for the funding of grand projects and rooting their culture in trade. They built pollaers and floodwals to allow for vast swathes of farmland to be created in the low wetlands. They learned to build canals to protect their cities from the fickle tides. In a feat of human engineering, the Konijkmener dug a canal that completely separated their peninsula from the rest of Chevalie.\n\nDespite their history of Marcher independence, they share similar cultural values such as exploration and mercenary traditions. However, a tendency towards republican values lead to low nobles and merchants wielding more power than usual.#"
 konijkmener_opinion: "#E Konijkmener#! Opinion"
 
# Leegender
 leegenders: "Leegender"
 leegenders_collective_noun: "Leegenders"
 leegenders_prefix: "Leegender"
 leegenders_desc: "#size:15    The Leegenders represent a hold-over from the times prior to [chevalie_migratory_era|E], in which the Konijkemener inhabited larger swathes of [chevalie|E]'s eastern coasts. Their speech appears antiquated and indecipherable, to their brethren, a strange cocktail of words and features not present in Konijkemener language for centuries alongside phrases incorporated from the Marchers. Leegender jewellers and glass-smiths are seen as the finest in Chevalie, impossible detail and intricate colours installed into each piece, their craft kept secret by a handful of rich, artisanal families. Much attention is given to the details which seperate them from the rest of the Konijkemener, seeing themselves more than as rivals than cousins despite their small numbers and shallower coffers.#"
 leegenders_opinion: "#E Leegender#! Opinion"
 
# Urdermantern
 urdermantern: "Urdermantern"
 urdermantern_collective_noun: "Urdermanterners"
 urdermantern_prefix: "Urdermantern"
 urdermantern_desc: "#size:15    The Urdermantern are a people native to the vast network of salt marshes that line the estuary leading to Gradiene, capital of De Kanzerlerij. A traditionally conservative and superstitious folk, the hostility of their homeland has discouraged the widespread development typical of coastal Konijkmener settlements. Instead of pollaers and dikes used to tame the wetlands, while traveling through Urdermantern country one bears witness to a simple people living off the wealth of the sea much like their forebears. Because of this the Urdermantern are known as expert fishermen, and from a young age learn the art of sailing.\n\nDue to the underdeveloped economy of their homeland, many Urdermantern as of late have left their native marshes seeking economic opportunity elsewhere. In fact, among the great port cities of the Kanzerlerij and even off in [peti_gisredde|E] Urdermanterns can be found working in foreign docks and fisheries. Strong Urdermantern marines and sailors are also not uncommon in the far traveling Konijkmener and Voyagen trade fleets. However, despite their traditional maritime skills, the Urdermantern remain an oft-forgotten footnote in Konijkmener society.#"
 urdermantern_opinion: "#E Urdermantern#! Opinion"
 
