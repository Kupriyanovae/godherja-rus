## Aironoian ##
 
# Entrepexatic
 entrepexatic: "Entrepexatic"
 entrepexatic_collective_noun: "Entrepexati"
 entrepexatic_prefix: "Entrepexatic"
 entrepexatic_desc: "#size:15    The Entrepexatic Estates — the [Concept('aversaria','Aversarian')|E] term for the wealthy and powerful merchant cities of the Kasiyrat — were already considered divergent and distant compared to their western kin.\n\nThe break with wider Imperial culture was accelerated by the [imperial_civil_war|E] and the [blue_robe_revolt|E], and with the fall of the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] in [frodbrokna|E] and the [Concept('ashen_aautokrata_fix', 'Ashen Aautokrata')|E] thereafter that split has been cemented. The abolition of the East-River Magistariate in 1269 IS would formalize the break, and Entrepexatic lords have since prided themselves on their 'enlightened cosmopolitanism' in opposition to the barbarism of the '$aauto_maklea_link$ Maklean#! yoke'.#"
 entrepexatic_opinion: "#E Entrepexatic#! Opinion"
 
# Chalóxaïkas
 chaloxaikas: "Chalóxaïkas"
 chaloxaikas_collective_noun: "Chalóxaïkasi"
 chaloxaikas_prefix: "Chalóxaïkasic"
 chaloxaikas_desc: "#size:15    A bastardization of 'low folk' in the eastern dialects of the [Concept('aversaria','Aversarian')|E] language, the Chalóxaïkas would rise out of the melting pot of cultures that fled east in the [white_pass_war|E]. Lower class Imperials, freed slaves and local Aironoians would all find themselves in a new society, unified by their war against the [Concept('sjalvolki_migration', 'migrant armies')|E] and their idolization of Hecaeda. Hecaeda's declaration of a unified caste grouping for the lower classes in 1285 IS and her formal abolishment of [Concept('aversarian_slavery', 'Slavery of the Body')|E] would generally be seen as the beginnings of the distinct Chalóxaïkasic identity that would form one of the main pillars of Anoterian society thereafter.#"
 chaloxaikas_history_loc: "Descended from the intermixing of lower class refugees, slaves and natives from [western_aironoi_biozone|E] who fled east in the [white_pass_war|E]."
 chaloxaikas_opinion: "#E Chalóxaïkas#! Opinion"
 
# Aironaios
 old_aironoian: "Aironaios"
 old_aironoian_collective_noun: "Aironaios"
 old_aironoian_prefix: "Aironaios"
 old_aironoian_desc: "#size:15    In the decades following the annihilation of [GetTitleByKey('c_asiupoli').GetNameNoTier], the Eastern Aversarians that used to occupy its surrounding areas were fraught with strife and chaos. United under the banner of Hecaeda and Legio LXI 'Anoterion', and forced to migrate after the conclusion of the [white_pass_war|E], the peoples of Western Aironoi have been hardened. Inspired by Hecaeda's great victories and her legendary meeting with the Witch-Breaker, the Aironaios identity that developed would begin to revere Hecaeda and her mighty legion.#"
 old_aironoian_opinion: "#E Aironaios#! Opinion"
 
