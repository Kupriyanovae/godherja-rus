 enisaloi_prefix: "Enisaloi"
 enisaloi_desc: "#size:15    The Enisaloi are one of the many Krehejadi cultures, formed by a confluence of many peoples of the Shattered Isles settled in the archipelago following the [war_of_all_islands|E]. Their [Concept('enisaloi_heritage_customs','fascination with their ancestors')|E] has long been famed across the Sea of Empires.#"
