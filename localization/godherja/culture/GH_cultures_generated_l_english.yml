 saradoixa_collective_noun: "Saradoixans"
 saradoixa_prefix: "Saradoixan"
 saradoixa_desc: "#size:15    The Saradoixa are the inhabitants of the Saradoixan [Concept('shatteredisles','Isles')|E], east of Kharadamat. A flexible people, they have notoriously been enslaved and liberated by the [Concept('aversaria','Aversarians')|E] on three separate occasions in their history. These repeated conquests have led to their culture, and even the name of the Isles from which they hail, being greatly influenced by their thrice-conquerors.\n\nThe Saradoixa are also famed for their cultivation of the Nhudabyad plant, the boiled leaves of which are said to aid them in seeing the world beyond. The Nhudabyad is partly the reason for their repeated subjugation, with Aversarian Magi developing a fascination with the plant's mystical properties. Despite this, the Saradoixa continue to grow the plant, and have even made it into one of the main items for trade in the Isles.#"
 saradoixa_opinion: "#E Saradoixa#! Opinion"
 
# Erimatos
 erimatos: "Erimatos"
 erimatos_collective_noun: "Erimatoi"
 erimatos_prefix: "Erimatos"
 erimatos_desc: "#size:15    The Erimatos descend from the original [Concept('aversaria','Aversarian')|E] colonists that arrived in [sarradon|E] with the Saradoani Apokiakas Archian in the aftermath of the continent's [Concept('the_decimation_of_sarradon','devastation')|E]. With the wider region reduced to ashes, they were able to rapidly secure favorable deals with the desperate locals and found thriving colonies across the coast. These communities soon began to [Concept('erimatos_assimilation','assimilate')|E], developing a unique cultural identity in the process.#"
 erimatos_opinion: "#E Erimatos#! Opinion"
 
# Karadamos
 karadamos: "Karadamos"
 karadamos_collective_noun: "Karadamos"
 karadamos_prefix: "Karadamos"
 karadamos_opinion: "#E Karadamos#! Opinion"
 
# Makryenis
 makryenis: "Makryenis"
 makryenis_collective_noun: "Makryenians"
 makryenis_prefix: "Makryenis"
 makryenis_desc: "#size:15    Makryenis refers to a melting pot of various [Concept('aversaria','Aversarian')|E] cultures that would arrive in [sarradon|E] with the great wave of colonization that would follow the start of the [saints_war|E] in the 1140s, united only by a near-fanatical devotion to the Agionist creed. In their early years, they were known for their great social mobility and respect of meritocracy, and countless wretched souls on the Continent would brave the journey south for a chance at a better life in Sarradon. Despite their modern reputation, they were also once considered a breath of fresh air on the continent, and as genuine facilitators of peace and a neutral third party to local squabbles and feuds.\n\nNowadays, though still going through great effort to paint themselves as honorable and righteous, their decline into general cruelty and capriciousness has made them infamous across Sarradon, and the Makryenis are usually looked down upon as a group of brutal thugs at best, or as loathsome tyrants to be driven back into the sea at worst.#"
 makryenis_history_loc: "Developed from a a variety of exiled [Concept('mutations','Mutants')|E] from across the [Concept('aversaria','Empire')|E]"
 makryenis_opinion: "#E Makryenis#! Opinion"
 
# Agiopadis
 agiopadis: "Agiopadis"
 agiopadis_collective_noun: "Agiopadii"
 agiopadis_prefix: "Agiopadis"
 agiopadis_opinion: "#E Agiopadis#! Opinion"
 
# Practitioner
 practitioner: "Practitioner"
 practitioner_collective_noun: "Practitioners"
 practitioner_prefix: "Practitioner"
 practitioner_desc: "#size:15    [aversaria|E] has long been defined by its [magi|E], their power integrated into the very identity of the empire. These Magi, though present everywhere, would begin to cluster at specific locations, the [mayikrata|E] and its satellite academies becoming home to a culture unique from the rest of the Aversarians. Though Magi are not the majority within these regions, their importance in local practices cannot be understated.\n\nThe term 'Practitioner' originates from a group of administrators, who coined it as a shorthand for the [mayikprolollans|E] members. Over time, the Magi began to spread it to their inferiors, in an attempt to cultivate a loyal following. This has been largely successful, creating a culture that exists to serve [magic|E] above all else. Those who wield it are to be raised above society, and to serve those with it is the noblest calling, for it raises one closer to their glory. Due to this exaltation, many Practitioners will avoid pursuing advancement, with the idea of Magi supremacy having been reinforced for their whole lives.#"
 practitioner_opinion: "#E Practitioner#! Opinion"
 
# Skolix
 skolix: "Skolix"
 skolix_collective_noun: "Skolixi"
 skolix_prefix: "Skolixi"
 skolix_desc: "#size:15    While 'noble' [mutations|E] (such as glowing eyes, perpetual glamours or enchanted voices) are often signs of the aristocracy and considered prestigious, the most common mutations (extra or deformed body parts, tumorous growths, ill-grown organs) that are more-often found amongst those born in highly [Concept('magic','Magical')|E] areas as opposed to [magi|E] able to control their exact mutation are considered signs of unworthiness and 'rejection' by the [Concept('aersanon','Purest')|E]. The difference is often entirely based upon class and prejudice, and many [Concept('aversaria','Aversarian')|E] lords have historically chosen to purge their dynasties and holdings of [Glossary( 'Skolix', 'GH_SKOLIX_GLOSS' )] due to their impurety and the perceived danger they have to the spiritual and genetic cohesion of the Empire.\n\nThe most common alternative to outright death for many Skolix, especially in the west, is exile to the Battery Isles. The Isles, both important theologically and for magical research, are far too steeped in ambient magics for 'normal' humans to colonize. As such, there has long been a call for Skolix citizens (to rule) and slaves (to serve) in the west, where the Imperial magistrates have historically made great profit in facilitating the purchasing and selling of mutants for the ruling of the Isles.#"
 skolix_history_loc: "Developed from a a variety of exiled [Concept('mutations','Mutants')|E] from across the [Concept('aversaria','Empire')|E]"
 skolix_opinion: "#E Skolix#! Opinion"
 

## Etepezean ##
 
# Seychescian
 seychescian: "Seychescian"
 seychescian_collective_noun: "Seychescians"
 seychescian_prefix: "Seychesc"
 seychescian_desc: "#size:15    The Seychescians are the descendents of the migration of an unknown culture into modern Etepezea and their ensuing intermixing with the Etapexeyn tribes and colonies sent from the eastern Mountain-Sun. The Seychescians — especially after uniting under the Seychescian Concordat in 116 IS — would become a major naval and trade power and the greatest rival to the early [Concept('aversaria','Aversarinas')|E] [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] before the Concordat's fall in 79 IS.\n\nCapable seafarers, the Seychescians were once considered the peacekeepers of ancient Etepezea, their ruling noble families greatly respected as diplomats and politicians and regularly invited across the region and the [Glossary('$polis_apostrophe|q$','GH_POLISOCRACY_GLOSS')] of to settle disputes and to oversee the signing of pacts.#"
 seychescian_history_loc: "Descended from the intermixing of an unknown parent with the Etapexeyn tribes and Mountain-Sun colonists of eastern Etepezea sometime around the 11th century BI"
 seychescian_opinion: "#E Seychescian#! Opinion"
 
# Vilicarix
 vilicarix: "Vilicarix"
 vilicarix_collective_noun: "Vilicarixiani"
 vilicarix_prefix: "Vilicarixian"
 vilicarix_desc: "#size:15    An ancient Etapexeyn [Glossary('polis','GH_POLISOCRACY_GLOSS')] culture that was primarily based around the polis of Agrinamea. It was known among the scholars of the ancient [Glossary('Naexanaxic','GH_NAEXANAXICA_GLOSS')] as a great center for philosophy and theater, most notably the Vilnacari, a series of seven plays detailing the rise of the city of Agrinamea and culminating in their legendary 8th century BI victory over their greatest enemies, the Kyrots.\n\nThe Vilicarix's leaders would attempt to both court and pit the rivaling [Concept('aversaria','Aversarinas')|E] [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] and Seychescian Concordat against one another but would only gain the emnity of both. The Kyrots would join the Aautokrata not long after its formation and their leader, the warlord Sarrax, would successfully convince Aautokratir Nokie'sex to aid the Kyrots in cleansing the Vilicarixiani. Despite this, their art remains extremely respected in modern Imperial culture, while the Kyrots have been relatively forgotten.#"
 vilicarix_opinion: "#E Vilicarix#! Opinion"
 
# Kyrotic
 kyrotic: "Kyrotic"
 kyrotic_collective_noun: "Kyrots"
 kyrotic_prefix: "Kyrotic"
 kyrotic_desc: "#size:15    The Kyrots were an Etapexeyn [Glossary('polis','GH_POLISOCRACY_GLOSS')] culture equally famous and infamous for their intense warrior culture. The Kyrots were known for many festivals and rituals descending from their ancient tribal past, when the ancestors of the Kyrots were feared as the the worshippers of dark and bloodthirsty witch-gods allegedly descended from a distant sun. The most famous of their strange practices were the [Glossary('Aer’aimataxgo’rrax','GH_AERAIMATAXGORRAX_GLOSS')] festival and the fourteen-step 'Dance of the Dragon-Speakers'.\n\nDespite their early loyalty to the [Concept('aversaria','Aversarinas')|E] [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] and their conquest of their ancient Vilicarixian rivals, Aautokratia $aauto_maklea_link$ Maklea#! would ban the Kyrot language in 255 IS as part of her wider language reforms and cleansed half of their cities in fire for their assistance of her slain brother, the pretender Aeschraderax.#"
 kyrotic_opinion: "#E Kyrotic#! Opinion"
 
# Epigic
 epigic: "Epigic"
 epigic_collective_noun: "Epigians"
 epigic_prefix: "Epigic"
 epigic_desc: "#size:15    The Epigic [Glossary('polis','GH_POLISOCRACY_GLOSS')] were once considered the greatest and most cultured of Etepezea, with a long and storied history of [magi|E] warlords and great dragon riders culminating in the unification of their cities beneath the legendary Epigic League which would itermittently dominate eastern Etepezea for several centuries through several separate cycles of unification, collapse and rebirth. At their height, the Epigians had grown to such great prestige as to be considered at the peak of [Glossary('Naexanaxic','GH_NAEXANAXICA_GLOSS')] civilization — equal even to the polis of the Imperial Isle.\n\nThe League's greatest rival would become the Seychescian Concordat, and under the leadership of the legenary Magi Sorovox would be victorious in the first two Chersonesian Wars, his death and the ensuing civil war would come at the worst time possible, as the League would soon be divided between the newly formed [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] and their Seychescian rivals, and then again between the Aersodiaxyn and Imperial factions of the [war_of_the_thousand_dragons|E]. By the reign of $aauto_maklea_link$ Maklea#! the great cities of the Epigians had become burned husks and the culture had largely vanished into the Aversarian milieu, though the League and its culture would remain highly respected in Imperial culture for centuries thereafter, the Epigian Poetic Form even seeing a revival beneath interested Ritelander scholars in the late 13th century.#"
 epigic_opinion: "#E Epigic#! Opinion"
 
# Verogii
 verogii: "Verogii"
 verogii_collective_noun: "Verogii"
 verogii_prefix: "Verogii"
 verogii_desc: "#size:15    Once feared as the greatest raiders of what are now the borderlands between the Clanlands and Malcois, the matriarchal Verogii were a militaristic tribal people from the [continental_interior_biozone|E] who would migrate into modern Etepezea sometime in the late early 3rd century IS. They would fight several wars against the newly formed Seychescian Concordat but would otherwise meld into the tribal fabric of the Etapexe quite well, and would become one of the many tribal-[Glossary('polis','GH_POLISOCRACY_GLOSS')] fusion cultures of the region's north.\n\nWhile initially greatly persecuted by the early [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] due to their alleged 'barbarism', Aautokratia $aauto_maklea_link$ Maklea's#! would have a noted taste for Verogii women and would promote several to high ranks within her coterie of lovers and the Empire, such as Isaeynaxthas 'the Verogii', first governor of Etepezea. Despite their rapid rise into the position of a prestige culture, the Verogii would begin to fade into the wider Imperial milieu thereafter. Their lands devastated by the Widow War, Aautokratir $aauto_pathos_link$ Pathos#! would have most of their lands consolidated beneath new Imperial titles and the Verogii language quietly suppressed, the culture effectively vanishing by the reign of Denos.#"
 verogii_opinion: "#E Verogii#! Opinion"
 
# Lomonios
 lomonios: "Lomonios"
 lomonios_collective_noun: "Lomoniosi"
 lomonios_prefix: "Lomonios"
 lomonios_desc: "#size:15    For years beyond count, the Lomonios have dwelt content in the hills of central Etepezea. Oft dismissed as uncouth rural folk, they nevertheless possess a unique trait that has stymied [Concept('aversaria','Aversarian')|E] scholars for years.\n\nUnusually, Lomonios tend to be born with an extremely high level of innate [magic|E], yet lack the ability to properly manifest or utilize it. This has led to them being used as sacrificial components in spellcasting rituals until they [Concept('videro_cnavaius','earned')|E] the rights of [Glossary( 'Ánixsiónkroithropix', 'GH_ANIXSIONTHROPIX_GLOSS' )] at the end of the [chaos_of_the_seventh_century|E].#"
 lomonios_opinion: "#E Lomonios#! Opinion"
 
# Old Islander
 old_islander: "Old Islander"
 old_islander_collective_noun: "Old Islanders"
 old_islander_prefix: "Old Islander"
 old_islander_desc: "#size:15    While the [shatteredisles|E] were treated as a useless backwater by the [Concept('aversaria','Aversarinas')|E] [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] for most of Imperial history, the legacy of the [Glossary('polisocracy','GH_POLISOCRACY_GLOSS')] still runs deep. As Drakelander scholar Novax of Rhi would posit in his famous 14th century narrations of the post-Imperial period, the material conditions of the ancient Polisocracy run even deeper.\n\nWithout the extraction economy and political negligence of the Aautokrata, a population bolstered greatly by a century-long tide of refugees beginning during the [imperial_civil_war|E], and finding themselves part of a far more equitable commercial and political framework than that of the Imperial [Concept('the_continent', 'Shattered Coast')|E], the once poverty-stricken Islanders have begun to rebuild the ancient parochial legacy of centuries past. Most central to the new Old Islander cultural sphere has been the city of Ixs and its Ixsian Renaissance, only slightly marred by the haze of madness that would define the city in the late 13th century.#"
 old_islander_opinion: "#E Old Islander#! Opinion"
 
# Drakelander
 drakelander: "Drakelander"
 drakelander_collective_noun: "Drakelanders"
 drakelander_prefix: "Drakelander"
 drakelander_desc: "#size:15    The political collapse of the [Concept('aversaria','Aversarinas')|E] [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] in Etepezea would dominate the 13th century, primarily between the disintegration of the [Concept('ashen_aautokrata_fix', 'Ashen Aautokrata')|E] in the [six_great_revolts|E] and culminating with the [Concept('sjalvolki_migration', 'Fall of Oraispol')|E] to $cenware_link$ Cenware Witch-Breaker#! in 1257 IS with the Priest's Coup.\n\nWith Imperial authority firmly ended by Cenware's proclamations of a new Sjalvolki-led kingdom in Orispolj and his declaration as Aautokratir by the remaining Etepezean nobility, the remaining Etepezean nobility moved quickly to derive their authority from powers older than the dead Aautokrata. The cultural imagery of the dragon — ennobled in symbolism by the anti-Aeschraeist poet Desmos Magos and his great oration 'the Last Fire of Empire' — would become central to the new culture. Noble beasts, powerful, industrious, and slain by a stifling empire, their blood living on in the noble Aversarians of the Drakelands.#"
 drakelander_opinion: "#E Drakelander#! Opinion"
 

## Old Imperial ##
 
# Fogwatcher
 fogwatcher: "Fogwatcher"
 fogwatcher_collective_noun: "Fogwatchers"
 fogwatcher_prefix: "Fogwatcher"
 fogwatcher_desc: "#size:15    In the mid 13th century, the shattered remnants of a dozen legions and a hundred barbarian tribes along with an army of tens of thousands of refugees would punch out of the [foglands|E] into the [hyrea_biozone|E] to such astonishment that High King $cenware_link$ Cenware Witch-Breaker#! would declare — allegedly still bloody from an arrow wound at the Siege of Kasmeze — that any still fleeing the Foglands were to be granted 'ten thousand mercies and charities' by any who recognized his authority.\n\nThereafter the battered coalition split, most of its refugees dispersing across the newly established migrant kingdoms of the [Concept('the_continent','Ritelands')|E]. Many of the coalitions experienced scouts and soldiers would however speak of the '[Concept('the_fog','Fogcall')|E]' that drew them back towards the northern wastes, and would begin to coalesce into several mercenary companies dedicated to exploring or scavenging deep into the Fog. Bolstered since by thousands of soldiers, adventurers, looters and outcasts, the largest of these companies, the Black Legions, would establish themselves in the Zambhan Valley and would thereafter become famous for their strange ability to chart and navigate the Foglands. Famous for alerting the south to invasions of [fogeaters|E] and [fogbeasts|E] in 1277 and 1279 IS, and their famous ambush and slaying of the iron-clad Fogeater 'Ruunherx', the Black Legionnaires would become known thereafter as the 'Fogwatchers'.#"
 fogwatcher_history_loc: "Formed from [GetCultureByKey('outer_aversarian').GetName], [GetCultureByKey('centralimperial').GetName], [GetCultureByKey('phalonix').GetName], and [GetCultureByKey('apokiakas').GetName] in the year $CULTURE_BIRTH_YEAR$ IS"
 fogwatcher_opinion: "#E Fogwatcher#! Opinion"
 
# Doraxi
 doraxi: "Doraxi"
 doraxi_collective_noun: "Doraxia"
 doraxi_prefix: "Doraxic"
 doraxi_desc: "#size:15    After the slaughtering of the remaining Imperial nobility of the Central Isles in the Lightning Revolt and the Paschalispoli Massacres, the economic collapse of the region and the tide of refugees from the mainland would lead to the unlikely mingling of the remaining Central Islanders, their slaves, and the Deresstae Iyrossi under an institution far older and greater than the hated [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] — piracy.\n\nDesperate Islander raids of the mainland in the mid 13th century would become increasingly organized and unified, culminating on the great raid of Poios in 1285 IS. Since then, the Doraxi have become known not only as feared raiders, but also shrewd merchants and prolific mercenaries, all despite enjoying equal emnity from their [Concept('aversaria','Aversarian')|E] and Iyrossi cousins.#"
 doraxi_opinion: "#E Doraxi#! Opinion"
 
# Pure-Blood
 pure_blood: "Pure-Blood"
 pure_blood_collective_noun: "Pure-Bloods"
 pure_blood_prefix: "Pure-Blood"
 pure_blood_desc: "#size:15    While the rest of the [Concept('aversaria','Aversarinas')|E] [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] burned and fell to chaos and great and noble Malcois fell to the treachery and betrayal of its villainous [Concept('aversarian_slavery', 'slaves')|E], the truest and purest suns of the Empire — the [GetCultureByKey('skorikiakas').GetName|V] — would emerge from the ashes to restore authority and just rule to their cities in Vroradi.\n\nHumbly uniting the remaining dregs of the Malcoisiac, Kalathipsomian and Katraddian nobility within their borders, the Skorikiakas would assume leadership — not as the clear and obvious powerbrokers lording their de facto authority over the lessers as a symbol of their true Aversarian blood — but as firsts among equals, the Purest among the Pure. These 'Pure-Blood' cities would be the cradle from which conservative reaction to the Imperial Sorrow Cult would explode in the late 13th century, leading to a decade of street battles and assassinations in the Messisian Summers.#"
 pure_blood_opinion: "#E Pure-Blood#! Opinion"
 
# Exods
 exods: "Exods"
 exods_collective_noun: "Exods"
 exods_prefix: "Exodic"
 exods_desc: "#size:15    What songs can be sung of great Exod that would capture his glory? Of how brave Exod, hero of a thousand [Concept('shatteredisles','Isles')|E], wrestled and slew the Serpent of Geth from within its own belly? How Wise Exod in a great and powerful spell reached out and slew the demon Urkannar from deep within the caves of Tsokka, where it was forbidden for any other to enter and even see the great beast? How mighty Exod singlehandedly slew a thousand soldiers at the Battle of the Imperial Bay at the head of the greatest army the Isles have ever seen? No matter the tale, only two things are truly agreed about the invicible Exod — that he was invincible and of an undividable soul, and that he was executed by the cruel tyrant lord Oledmir of Acaphos after foul ambush and arrest.\n\nWhile Exod would be defeated and his divine soul sent to the Purest, his cult would persist and turn him into a symbol of Islander resistance and unity against the refugee Imperial lords and [Concept('sjalvolki_migration', 'post-migrant')|E] invaders both. While his strange and ill-defined cult largely died with him, the image of Exod as a hero of a new and united Southern Islander identity and the mythology of his (brief) ejection of the armies of both the remaining Imperial magistrates and the migrant lords in 1278 IS would see his name become synonymous with the region and its inhabitants for centuries thereafter.#"
 exods_opinion: "#E Exods#! Opinion"
 
# Ouletaelatic
 ouletaelatic: "Ouletaelatic"
 ouletaelatic_collective_noun: "Ouletaelats"
 ouletaelatic_prefix: "Ouletaelatic"
 ouletaelatic_desc: "#size:15    The coup of the battered remains of the Sub-Governorate of Notianixia in the mid 13th century by the [GetCultureByKey('dasulanoi').GetName|V] aristocracy and the ensuing establishment of the [Concept('aversaria','Imperial')|E] Kingdom of Notianixia in 1266 IS would soon be followed by a dizzying series of conquests and annexations, fortunes only reversing with the failed invasion of the [Concept('imperial_isle_biozone','Imperial Isle')|E] in 1289 and the ensuing disintegration of the briefly ascendant kingdom.\n\nDespite this, the brief period of unity would radically reshape politics in the [Concept('shatteredisles','Eastern Isles')|E] for centuries to come. With the great rift left behind by the fallen [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] mended by the Dasulanoi's attempts to restore Imperial institutions in their new kingdom, unity would prevail despite the collapse of the new kingdom. As Notianixia divided between east and west, it would become not a question of if the memory of this new kingdom would last, but instead who, exactly, would inherit it. To the east-based Ouletaelats the answer is obvious, as the truest descendents of Dasulanoi culture and the last banner-bearers of conservative Imperial traditionalism in the Isles, it is only natural that the iron legions of the Ouletaelats shall lead Notianixia into a pure and glorious new age!#"
 ouletaelatic_opinion: "#E Ouletaelatic#! Opinion"
 
# Nillatic
 nillatic: "Nillatic"
 nillatic_collective_noun: "Nillats"
 nillatic_prefix: "Nillatic"
 nillatic_desc: "#size:15    While the [GetCultureByKey('walakon').GetName|V] and many other Islander groups would be subjugated by the [GetCultureByKey('dasulanoi').GetName|V] in the rapid expansion of the ascendant [Concept('aversaria','Imperial')|E] Kingdom of Notianixia in 1270 IS, the Dasulanoi would struggle to unite the cultures and faiths of the [Concept('shatteredisles','Eastern Isles')|E]. The lords of western Ouletaelas would — tasked with bringing the Walakon to heel or the sword by Archex Ariovistus — would instead establish the Thorenionic Road, one of the wealthiest trade connections of the [Concept('sjalvolki_migration', 'post-migrations')|E] [Concept('the_continent', 'Shattered Coast')|E].\n\nWhen the Imperial Kingdom faced collapse in 1289 IS after the disastrous invasion of the [Concept('imperial_isle_biozone','Imperial Isle')|E], the Walakon and the Western Ouletaelats would move to preserve their new trade connections and the mercantile unity that had flourished within the young kingdom. Now, with Notianixia divided between the reactionary warlords of the east and the spirited and shrewd merchants of Nilla and western Ouletaelas, it is only natural that the golden coin of the Nillats shall lead the Isles into a rich and glorious new age!#"
 nillatic_opinion: "#E Nillatic#! Opinion"
 
# Magisterial
 magisterial: "Magisterial"
 magisterial_collective_noun: "Magisterials"
 magisterial_prefix: "Magisterial"
 magisterial_desc: "#size:15    The legacy of the [thallasian_magicoup|E] and the [thallasian_magicoup|E] would loom large over the remaining [Concept('aversaria','Aversarian')|E] [magi|E] of the [mayikprolollans|E] as the [Concept('sjalvolki_migration', 'migrant armies')|E] toppled Oraispol and shattered the remnants of the western [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] in 1257 IS. While the treaty signed between the Mayikprolollan sto Thallas and $cenware_link$ Cenware Witch-Breaker#! guaranteed — for a time — some safety, the disintegration of Imperial law both within and outside the city and the increasing threat of the new migrant lords as the Witch-Breaker ventured east would lead to political chaos amongst the city's Practitioners.\n\nIn an incredibly controversial political move (and after an ensuing purge), the Magisterial Council of the Mayikprolollan  would 'abolish' the Imperial caste system in 1263 IS, declaring the existence of four 'adjacent' 'social pillars': the Magi, the merchants, the citizens and the slaves. More importantly, the Magisterial Council would then open the doors of the academy anew, now to migrant princelings, shamans and exiles. These events would establish the new cultural norm for the remaining Practitioners of the new [Concept('the_continent', 'Shattered Coast')|E], continuing the old Aversarian exaltation of the Magi while abandoning the specific cultural and political trappings of the Empire.#"
 magisterial_opinion: "#E Magisterial#! Opinion"
 

## Proto-Aversarian ##
 
# Aelarvisian
 aelarvisian: "Aelarvisian"
 aelarvisian_collective_noun: "Aelarvisians"
 aelarvisian_prefix: "Aelarvisian"
 aelarvisian_desc: "#size:15    Originally inhabiting the countless city-states of what is presently western Etepezea, the Aelarvisians were an ancient culture that united the Shattered Coast and forged a mighty empire in blood. Infamous for their arrogance, but famed for the sternness of their people, Aelarvisians were masters of war who founded the core of the first iterations of the Imperial Army, in contrast to the disorganized aristocratic armies that preceded them. As a whole, they are renowned for aspiring to establish order through subjugation, and accordingly there have been many notable conquerors of Aelarvisian extract over the ages.\n\nBoth the nobility of the Aelarvisians and exceptional soldiers were known to eschew the riding of traditional mounts such as horses in favor of the legendary and terrible [dragons|E]. This earned them the moniker of 'Dragonriders'. These Dragonriders formed deep bonds with their mounts that transcended race and even blurred the line between servants and dear companions.\n\nAelarvisian culture would ultimately give way to [Concept('aversaria','Aversarian')|E] culture as the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] redoubled its efforts to forge a new Imperial identity out of the many identities within it.#"
 aelarvisian_opinion: "#E Aelarvisian#! Opinion"
 
# Aeviaxian
 aeviaxian: "Aeviaxian"
 aeviaxian_collective_noun: "Aeviaxians"
 aeviaxian_prefix: "Aeviaxianv"
 aeviaxian_desc: "#size:15    One of the many cultures that sprang up from the untold number of city-states in western Etepezea and wealthiest groups of the [Glossary('Polisocracy','GH_POLISOCRACY_GLOSS')], Aeviaxians embody the mercantile nature of these city-states to the utmost extent. Aeviaxian culture is one that values wealth and trade, with merchants being considered one of the foremost groups in society, second only to the nobility. They are moreover known for prizing communal bonds, aiding one another when in need. They are inclined towards establishing enclaves in settlements that lie on upon their trade routes, developing thriving communities in far off lands. While not unwilling to wage war when necessary, they are averse to it, as wars harm the operation of the trade routes vital to the Aeviaxian merchant class. Instead, the Aeviaxians are known for utilizing diplomacy and bribery to prevent what they see as wasteful conflicts.\n\nEventually, the Aeviaxians were integrated into [Concept('aversaria','Aversarian')|E] culture as a result of $aauto_maklea_link$ Maklea's#! campaign to form a singular Imperial culture.#"
 aeviaxian_opinion: "#E Aeviaxian#! Opinion"
 
