l_russian:
 acraddozy_desc: "#size:15    Акраддозы — это племена, которые были объединены во время [Concept('sorrowing_of_oejeynica','Скорби по Ойейнице')|E] [Concept('magi','магом')|E]-полководцем Эскараттом, бесславным изгнанником из Магократии Сарвиноско. Эскаратт правил как удивительно великодушный диктатор на протяжении почти четырёх веков, отразив почти все вторжения [Concept('liches','личей')|E] в их твердыни на северо-западном побережье исконных земель. Для одиноко-светцев они были бесславными и ненавистными налётчиками, известными постоянными нападениями с побережья, даже когда личи продвигались всё глубже на север. Безумная королева одиноко-светцев Эдитлич ответила на их провокации, обратив Эгиду против их земель, что убило Эскаратта и привело к тому, что владения акраддозов были быстро поглощены нежитью.\n\nПосле того как Эдитлич была сброшена в море, а Эгида возвращена Эонихарам, оставшимся акраддозам позволили бежать в [Concept('lonely_light_biozone','Одинокий свет')|E], из-за чего они стали ещё одной культурой изгнанников на этих островах.#"

 adabyann_desc: "#size:15    На протяжении веков Город Золотых Статуй пустовал, оставаясь темой легенд из незапамятных времён, называвших его домом капризных дьяволов и злых духов. Предки адабьяннов по причинам, которые исторически неясны и по сей день, первыми нарушили древние табу. Преодолев очаги опасной и непредсказуемой магии, окружавшие руины, они взяли судьбу в свои руки и навсегда изменили историю юга. Сегодня их потомки наслаждаются неслыханным для всего [Concept('aeras','Эраса')|E] богатством и процветанием — плодами их трудов по воссозданию чудес, найденных в новом доме. Благодаря этим диковинам был изгнан голод, искоренён ряд распространённых болезней и паразитов, а бесчисленные народы были подчинены, дабы удовлетворить вечно растущую жажду роскоши и богатства народа адабьяннов.#"

 adani_desc: "#size:15    Земли аданов состоят из засушливых холмов, где только самые стойкие общины разрастаются до значительных размеров без угрозы голодной смерти. Из-за этого они полагались на царей-учёных, которые вели их сквозь холодные и сухие зимы, когда [Concept('magic','магия')|E] была единственным спасением от голода и засухи. Подобное упование на ученейших из них, закрепило почтение к древним и проверенным знаниям среди аданов, а также породило ксенофобное отношение к соседям, которые, по их мнению, желают выкрасть их священные тайны, особенно после катаклизма [Concept('dharya_varha','Дхарья Варха')|E].\n\nСамой причудливой традицией аданов для чужеземных наблюдателей является [Glossary('Дойнатека Сариатти','GH_DOYNATEKA_SARYATTI_GLOSS')], и те, кто покровительствует слону, добравшемуся до самого низа первым, как говорят, спасаются от засухи на десять циклов [Concept('aervalr','Эрвала')|E]. Эти состязания, проводимые дважды в год, за века превратились в коррумпированные политические игры, и немало слонов гибнет в отчаянной попытке снискать благосклонность древнего ритуала.#"

 adnanari_desc: "#size:15    Аднанары — это жители восточных [Concept('sarradon','саррадонских')|E] королевств Кехенемхата. Хотя распространено мнение, что они происходят от древних кочевых племён, полностью оставивших свой образ жизни и осевших в долине реки Хенем и на близлежащих берегах более тысячи лет назад, в их современной культуре связь с кочевым прошлым едва различима и может быть скорее легендой, чем фактом.\n\nКонтролируя важнейший перекрёсток, где Гонанский тракт сходится с северным побережьем Саррадона, они развили сильный коммерческий дух и сумели компенсировать относительное бесплодие долины реки Хенем доходами и импортом от своих купеческих начинаний. Горе тем, кто сочтёт их из-за этого мягкими: постоянные войны с налётчиками из пустынных глубин веками закаляли их боевой дух. Замысловатoe и по-барочному мстительное отношение аднанари к личной чести широко известно; оно как помогало, так и мешало им на протяжении истории. В то время как многие великие начинания аднанари по созданию империй рушились из-за междоусобных распрей, точно так же многие ничего не подозревавшие завоеватели оказывались фатально не готовы к смертоносным циклам мести, которые их завоевания обрушивали на их собственные головы.\n\n«Подобного и стоит ожидать, когда хранишь честь», — говорят аднанары.#"

 adrakamp_desc: "#size:15    Северные низменности были домом для некоторых наиболее развитых обществ сьялволков, среди которых адракампы занимали ключевое место. Торговцы со всех кланов стекались в их поселения в надежде продать свои товары; на рынках адракампов можно было найти всё, что только могло понадобиться соплеменнику. Это процветание по иронии судьбы родилось из бесплодия и гористости их родины, вынуждавших их торговать ради пропитания населения. Необходимость поддерживать приток богатства научила вождей адракампов тонкому искусству дипломатии, позволявшему избегать наиболее кровавых аспектов клановой политики сьялволков. Вместо войн за территории адракампов призывали судить споры между враждующими племенами, а города адракампов были нейтральной землей для торговли и дипломатии, где кровная месть и вендетты юридически аннулировались в тот самый миг, когда соплеменник пересекал их черту. Нельзя сказать, что эти купеческие кланы были трусливы — при нападении адракампы защищали себя так, как и подобает любому другому сьялволку.\n\nОднако адракампы не могли защититься от всех угроз. [Concept('the_fog','Туман')|E] выгнал их с их рынков и погнал по дорогам. Многие в племени сокрушаются, что их вековое процветание утеряно навсегда.#"

 aeonyhara_desc: "#size:15    Эонихары — это потомки древних [Concept('magi','магов')|E] Одинокого света, служивших святыми жрецами и шаманами древних Островов. Хотя их единая преемственность святых старейшин и учёных была прервана вторжением материковых армий прикканов во время их нападения на [Concept('lonely_light_biozone','Одинокий свет')|E], вскоре они вернули своё место в обществе с поялением Эгиды и стали её доверенными защитниками. Обязанные даровать Эгиду любому королю [Concept('lonely_light_biozone','Одинокого света')|E], небольшие общины эонихарских жрецов, живущие обособленно в своих святых монастырях на их райских островах, сформировали культуру вокруг веры, [Concept('magic','магии')|E] и защиты Одинокого света и её щита.#"

 aezentiam_desc: "#size:15    Эзентиамы — уроженцы северной Каширии, известные по всему Дармирату своей воинской доблестью и стойкостью, ибо они имеют долгую историю борьбы с внешними угрозами из-за Каширията. Благодаря этому они являются высокоценными наёмниками, которых часто ищут далёкие лорды, а порой их даже делают королевской гвардией в каком-нибудь особо богатом королевстве.\n\nОднако по мере того, как вращалось колесо времени, их военные кодексы соблюдались всё меньше и меньше, а их собственные походы за великую реку резко сократились. Тем не менее значительная часть людей всё ещё упрямо следует путями своих предков и защищает свои земли от любой угрозы, которая может прийти из-за священной реки.#"

 aguadosian_desc: "#size:15    Хотя большинство культур [Concept('shatteredisles','Островов')|E] считают мореплавание важным, для агуадосианцев оно является стержнем всей жизни. Считая своей истинной родиной море, а не острова, на которых они живут, они бороздят океаны [Concept('aeras','Эраса')|E] на судах [Glossary('картейман','GH_KARTEIMAN_GLOSS')].\n\nБольшая часть их земли находится в общем владении, её участки раздаются лишь в знак признания великих деяний, да и то обычно только на одну жизнь. Настоящими поместьями агуадосианцев являются флотилии, служащие благородным семьям, которые в дни до Фродброкны можно было увидеть в таких далёких краях, как Катун-Кай и южный Саррадон. Хотя они и способствуют трансконтинентальной торговле, их малая грузоподъемность делает их более пригодными для защиты и сопровождения крупных судов — услуга, которую они охотно предлагают великим правителям и купеческим гильдиям.#"

 akhtarfi_desc: "#size:15    Оазисный народ смешанного мармаладидского и прибрежно-саррадонского происхождения, ахтарфы происходят от выживших, которые бежали, когда мармаладидское нашествие разбилось о Центральный мамурамат, рассеявшись после катастрофической бойни в Битве Вопиющей Земли в 1047 году. Многие кланы осели где пришлось, опасаясь возмездия Татталитов; позже их численность пополнилась волнами сихнимийских крестьян, бежавших от растущего беспорядка в Прибрежном Саррадоне.\n\nАхтарфы не признаются частью какого-либо из традиционных [Concept('marmaladid_great_tribes','Великих племён мармаладидов')|E], хотя многие отдельные ветви среди них заявляют о далёком родстве с несколькими различными полубогами-основателями.#"

 alewui_kemsari_desc: "#size:15    Происходящие от кемсарских колонистов, отважившихся отправиться на север, алевуи кемсарцы формируют самую молодую из кемсарских культур. Ища пахотные земли вдали от всё более централизующегося государства с центром в Дедераке, алевуи основали многочисленные города там, куда со временем будет повернута река Валора. Именно здесь алевуи пришли в соприкосновение с коренными зарасадарами, результатом чего стало последующее порабощение и подчинение последних Кемсаром. Вдоль реки алевуи сформировали многочисленные общины, которые в целом были самоуправляемыми и получали минимальный надзор со стороны имперского правительства в Дедераке.\n\nОднако внезапный крах Кемсарской империи, за которым последовало возвышение Амсарского Хиклахна на севере, поставил алевуи кемсарцев в опасное положение. Находясь под перекрёстным огнем налётчиков ран кемсарцев и армий тиссаев, они занимают одни из последних плодородных земель в Кемсаре. За пять непрерывных веков войны, искоренившей любые остатки культуры или исторической памяти, всё, что осталось от алевуи кемсарцев — это руины их некогда великих городов, на которые они могут лишь взирать с болезненным трепетом.#"

 aljibal_kemsari_desc: "#size:15    Изолированные в горах центрального и западного Кемсара, альджибал кемсарцы оказались группой, наименее затронутой имперским крахом: целые общины узнали об испарении центрального правительства лишь спустя недели. Жизнь альджибалов вращалась вокруг шахт в их горах, из которых извлекалось почти всё богатство региона. Шахтёрами становились целые поколения семей, при этом возможностей для иного выбора почти не было, так как альджибалы находились под полным культурным и политическим господством ран кемсарцев, а сами горы не имели собственной правящей элиты. Поскольку почти все трудились в соляных, угольных или железных шахтах, продолжительность жизни была невероятно низкой — если кто-то доживал до сорока, его считали стариком. Единственным способом вырваться из такой жизни было пойти на службу в кемсарские армии, и, как следствие, сформировалась суровая, спартанская культура с огромной долей негодования по отношению к высшим классам.\n\nКрах Кемсара положил конец какому-либо значению горнодобывающей промышленности в регионе, но в конечном итоге изменил мало что ещё. Их культура всегда была обособленной и клановой, сосредоточенной вокруг семейных традиций, и альджибал легко приспособились к племенному образу жизни, стремясь выйти из своих гор и взыскать возмездие с некогда доминировавших низменностей. Те крохи порядка, что оставались в Кемсаре, немедленно рухнули, и регион погрузился в анархию, которая окутывает его и по сей день.#"

 almajun_kemsari_desc: "#size:15    Хотя север со временем станет известен как сердце Кемсарской империи в её поздние годы, именно южный Кемсар был местом сосредоточения имперской власти и культуры на протяжении первой тысячи или около того лет её существования. Одни из величайших, монументальнейших архитектурных шедевров, известных человечеству, были построены его жителями-альджун кемсарами в давно ушедшие, ныне почти мифические дни Семи Лазурных Императоров, а также в последующие века — творения, что продолжают стоять и поныне, несмотря на полное уничтожение породившей их цивилизации.\n\nПотеряв свое главенствующее положение после Первого Междуцарствия, а затем будучи полностью затмённым севером во Втором, юг постепенно приобрёл репутацию удушливых, обедневших задворок блистательной жемчужины севера — но, конечно, и то, и другое превратилось в пепел после Битвы Разбитой цепи. Из-за своего расположения глубже в пустыне альмаджун пострадали едва ли не сильнее всех остальных кемсарских групп, а их относительная изоляция от остального мира взрастила крайне воинственные, ксенофобные обычаи, где к чужеземцам относятся почти как к мифологическим чудовищам и агентам зла, а не просто смертным. Сказать, что они почти полностью отказались от лоска своей некогда изящной культуры, было бы преуменьшением.#"

 amaghean_desc: "#size:15    Древние сказания гласят, что амагейцы являются потомками мученика Бога-Царя Арназа «Великого Предка» и его дитя Парназа «Великого». Печально известные своим религиозным рвением и воинской культурой, они, как часто говорят, совершенно не боятся смерти в бою — фактически, гибель в сражении считается в их культуре самым благородным способом умереть. Амагейцы имеют долгую историю практики рабства, ибо они верят, что все народы к востоку от них заслуживают наказания за помощь Азоту «Братоубийце». Некоторые из этих культур за многие века были даже полностью истреблены из-за своей неверности, однако некоторые остались в милости у своих хозяев, как, например, дранеты. С приходом аверсарианского влияния в их исконные земли амагейцы были поражены доблестью и отвагой своего врага, и многие были даже открыты для идеи принятия аверсарианских обрядов. Однако только во время правления дедафала Мариамны «Строительницы» амагейская аагиократия была официально утверждена и стала опорой амагейской жизни.#"

 amsari_desc: "#size:15    Мало какой народ перенёс такое порабощение и угнетение, как амсарцы, и ещё меньше тех, кто прошёл через это и выжил.\n\nСо времён тёмных дней рабства в руках ран кемсарцев амсарцы поднялись высоко. Именно их пророк предсказал свободу народам зарасадаров, и именно их воины и маги исполнили это обещание освобождения. Каждый ребёнок амсаров узнаёт об этом с рождения, и в результате в их культуре развилась глубокая и непреклонная гордость за свой статус свободных мужчин и женщин. Сама идея порабощения считается отвратительной в их обществе, чем-то, рождённым из кошмара, сотворённого в самые тёмные дни их истории. По закону любой раб, остающийся на амсарской земле в момент, когда заходит солнце, немедленно становится свободным — хотя фактическое соблюдение этого закона в отношении тех чужеземных купцов, что глупо привозили с собой своих рабов, в лучшем случае было слабым.#"

 amuaad_desc: "#size:15    Амуаадов пожалуй, лучше всего описать как космополитичный плавильный котёл практически всех крупных культур северного побережья [Concept('sarradon','Саррадона')|E]. Находясь там, где миры ритуалистов и варденитов востока встречаются с экзотическим Кемсаром, амсарами и айярами, они, кажется, заимствовали каждую деталь своего языка и обычаев у какого-то из соседних народов.\n\nИх язык имеет больше всего общего с тасурмадским, но их письменность совершенно не похожа на большинство окружающих культур — вместо использования букв джадуяда они используют глифы древнего Кемсара, наследие колоний ран кемсарцев, основанных в регионе во время их золотого века. Их искусство построено на восточном фундаменте, но с заметными элементами айяров, а архитектура — отчетливо кемсарская. Наконец, одеяния и кухня амуаадов представляют собой такое буйное смешение всего под солнцем, что попытка разобраться в происхождении каждого элемента была бы воистину тщетным делом.#"
 
 saruyad_desc: "#size:15    Возникшие среди великих лесов и раскидистых долин райской и приятной зелёной земли северного Харадуна, саруяды исторически были народом, обособленным от остального Саррадона. Их соседям амуаадам и тасурмадам их традиции кажутся клановыми и нецивилизованными, и хотя на их родине возносились и рушились великие империи, самим саруядам редко выпадала честь править.\n\nНесмотря на это, сами саруяды — удивительно дружелюбный и открытый народ по отношению к тем немногим, кто заслужил их доверие, и даже чужеземцы удостаиваются сложных обрядов домашнего очага и приветственных церемоний. Нарушить гостеприимство для любого благородного саруяда хуже смерти, а их народные предания полны историй о великих и кровавых клановых войнах и междоусобицах, вспыхивавших из-за подобных оскорблений. Ещё одним ревностно хранящимся секретом является необычайно высокая концентрация магической крови, встречающаяся особенно среди простолюдинов. Рождающихся у них дочерей, проявляющих подобные таланты, обычно забирают на воспитание и обучение тайным исскуствам местными ложами сообществ деревенских ведьм, известных как Аккабла, к которым относятся с благоговением и трепетом.#"
 
 anorlori_desc: "#size:15    Несмотря на свое положение на задворках [Concept('shatteredisles','Расколотых островов')|E], анорлоры заслужили прочную репутацию за свои заграничные авантюры и героические деяния. Амбициозная молодёжь с их родных островов, как известно, путешествует далеко и широко в поисках славы и почёта, часто оставляя неизгладимое впечатление на местных жителей. Самые знатные вельможи родных островов анорлоров традиционно изгоняют своих вторых сыновей, отправляя их за море искать свой путь среди чужеземцев на островах. Учёные анорлоров возводят эту традицию к знаменитой последней битве на севере бок о бок с ныне обожествлённым Чемпионом Шевалье, вдохновившей чувство общей ответственности за судьбу всех Островов.\n\nБудь то предания о героизме или страница в книгах истории об очередной злополучной попытке объединения, многие знаменитые изгнанники анорлоров оказались обожествлены в обширных пантеонах островов за свои деяния при жизни. Однако для большинства путешествующих чужеземцев-анорлори их долгие странствия в один прекрасный день приведут их обратно, возвращая на скромные родные острова ради труда и любви.#"
 
 arashan_desc: "#size:15    Арашанов часто принимают за призраков или миражи каменистой пустыни, служащей им домом, которые возникают столь же внезапно, как порыв сухого ветра, чтобы нанести удар по ничего не подозревающим караванам, и исчезают в следующее мгновение. Правда, однако, далека от вымысла, поскольку арашаны — люди из плоти и крови, обитающие в полуземлянках, скрытых от раззадоренных глаз чужаков. Там они празднуют успешные налёты грандиозными пирами и [Concept('sevra_par','танцами летающих топоров')|E], шумно пересказывая былые победы и подвиги воинской доблести ради престижа и признания со стороны соплеменников."
 
 arderwan_desc: "#size:15    Карациры происходят от военных отрядов наёмников-хоринотов, которые осели на бывших землях Астиликской империи после её уничтожения совместными аверсариано-ольтенскими силами в конце восьмого века И.С. Близость к побережью и влияние восточных союзников заставили карациров принять более оседлый образ жизни по сравнению с ванавидами [Concept('great_steppe_biozone','востока')|E], отказавшись от племенных ополчений и кочевого быта предков в пользу крепостей на холмах и рыцарских свит. Благодаря этому они стали высоко цениться как профессиональные воины иностранного происхождения, и многие карациры предпочитают служить в аверсарианских легионах в качестве ауксилариев."
 
 ardothanes_desc: "#size:15   Уроженцы северных пограничных земель Калатипсоми, ардотаны пострадали во время отступления шевальенцев с этих территорий, потеряв большую часть своих лучших пахотных земель из-за аверсарианских переселенцев. Вытесненные на неплодородные окраины, многие кланы обратились к разбойничьим набегам, что создало ардотанам репутацию бандитов. Наперекор дурной славе они зачастую скрупулезно следуют кодексам чести, а народные предания о благородных и даже героических бандитах-ардотанах снискали непреходящую популярность в Шевалье.#"
 
 armanas_desc: "#size:15    Из всех детей Каширията принято считать, что арманасы благословенны более всех, ибо они любят Священную реку и любимы ею в ответ. Их [Concept('magi','маги')|E] духовно сонастроены с Кашириятом, и именно они первыми открыли, как направлять её многочисленные приливы и отливы.\n\nПользуясь высоким почтением у кутанагов, арманасы часто избираются вождями или духовными лидерами, и большинство восстаний речного люда возглавлялось кем-то из их числа."
 
 arolyan_desc: "#size:15    Аролианцы происходят с южного Пиратского побережья, с островов, настолько густо заросших джунглями, что только в самых прибрежных регионах есть города, заслуживающие внимания проплывающих мимо моряков. Из-за этого аролианцы ревностно оберегают моря вокруг своего дома и известны тем, что без разбору убивают любого, кто подорвётся слишком близко к их берегам. Однако их страх перед чужеземцами за века постепенно угас, и теперь в экипажах аролианских кораблей порой можно встретить сарутанов и дераанов.\n\nАролианские женщины исторически занимали исключительно роль воинов, в то время как мужчины посвящали себя искусству управления и правления, веря, что их высшее призвание — однажды навсегда укротить свои острова. Отличительные татуировки на телах аролианских женщин легко заметить в каширийских портах; они запечатлевают каждую их победу в виде настолько прекрасных рисунков, что некоторые учёные посвящают этому годы своей жизни.#"
 
 asarey_desc: "#size:15    Жизнь общества асареев издавна вращалась вокруг постоянного притока купцов, совершающих опасное путешествие вверх и вниз по Гонанскому тракту. Служа в равной степени его защитниками и противниками, воины асарееев, как известно, совершали налёты на те самые караван-сараи, которые до этого клялись защищать. Их присутствие вдоль торгового пути стало настолько привычным фактом, что для любой экспедиции считается глупостью отправляться в путь, не отложив часть своих товаров для потенциальных грабителей. Эти налётные отряды, известные у асареев как «Саммалрик», организованы на строго эгалитарной основе, а вся «выручка» делится поровну между участниками. Конечно, не все асареи являются грабителями — их можно встретить и в роли самих купцов или управляющих множества пустынных твердынь на этом пути.#"
 
 ashital_desc: "#size:15    Ашиталы — это самое процветающее и многочисленное подразделение канийского народа, чьё общество сосредоточено вокруг двух великих мегаполисов: ЭЛОИ-Авар и Бет-Адис. Жители этих двух городов создали большую часть канийской литературы и культуры, но ни один из них не наслаждался чем-то большим, кроме мимолётных периодов независимости от внешних сил, часто доминировавших над ними на протяжении веков. Хотя это вылилось в ряд восстаний и последующих попыток подавить их странные религиозные обряды, страх нарушить прибыльную торговлю, идущую через этот регион, приводил к тому, что города обычно пользовались хрупкой местной автономией.\n\nАшиталы, несмотря на то, что большинство чужеземцев представляют именно их, когда воображают канийцев, переняли ряд культурных традиций у своих соседей айяров и амсаров. Многие из них стали гордиться своим космополитичным наследием и уверовали в то, что они являются самым культурным и грамотным народом в западном [Concept('sarradon','Саррадоне')|E].#"
 
 astilik_desc: "#size:15    Астилики — древний народ, а земли, которые они населяют, ещё древнее. Обитая в городах-дворцах вдоль реки Петрониат в [Concept('western_aironoi_biozone','западном Айроное')|E], они были свидетелями возвышения и падения бесчисленных империй задолго до того, как построили [Concept('astilik_empire','свою собственную')|E]. Стены поселений астиликов никогда не прекращают развиваться, поскольку каждое поколение считает своим долгом добавлять новые башни, улучшать укрепления и расширять земляные валы; именно с этих укреплённых позиций они проецируют свою власть, господствуя над рабами и крепостными, которые бесконечно трудятся на обширных орошаемых полях, окружающих их цитадели.#"
 
 atrakar_desc: "#size:15    Атракары произошли от потомков кланов кунсагов, которые были теснее связаны с [Concept('kartharadd','Картараддом')|E], чем с [Concept('aversaria','Аверсарией')|E]. Сильно поредевшие после [Concept('night_of_the_bleeding_moon','Ночи Кровавой Луны')|E], они были дополнительно наказаны аверсарианцами децимацией и роспуском кланов, что разрушило саму основу их общества. Стойко сопротивляясь порабощению, они стремятся следовать примеру нартахатана Озкана и его жены, нартахатун Бетун, которые предпочли смерть капитуляции. Атракарские [Glossary('бётаи', 'GH_BOTAI_GLOSS')] принимают как мужчин, так и женщин, которые могут заслужить [Concept('ardara','ардару')|E] верной службой и участием в набегах.#!"

 auteonic_desc: "#size:15    Аутеоны происходят с северных окраин [Concept('greensea','Зелёного моря')|E], где лес начинает редеть, а деревья слишком слабы, чтобы выдерживать большие города. Поэтому они предпочитают жить на земле, чтобы быть ближе к [Concept('aeras','Эрасу')|E] без обуви, дабы чувствовать пульс Мирового Древа под своими ногами. Несмотря на то, что их исконные земли скудны и скованы льдом, их деревни часто бывают окружены прекрасной зеленью. Аутеонские [Concept('magi','маги')|E] способны растапливать снег и заставлять траву прорастать из бесплодных скал.\n\nАутеоны — любящий праздники народ, чьи песни поются далеко за полночь. Мужчины и женщины вплетают цветы в свои волосы, а лидеры устраивают танцы вокруг деревьев без сучьев. Их часто высмеивают другие партикские племена, критикуя за легкомыслие и отсутствие гражданской ответственности. Несмотря на эти заявления, их вождества структурированы очень похоже на другие партикские народы, со светским правителем, которого консультирует совет друидов. Многие аутеонские друиды отправлялись к Мировому Древу, чтобы стать членами Верховного Совета. Их маги ничуть не уступают своим собратьям на юге, а самые могущественные способны разложить человека на части одним лишь взглядом. И всё же, аутеонская культура полна любви и смеха, и они всегда готовы помочь другу в беде.#"
 
 auzangeb_desc: "#size:15    Аузангебы прибыли в [Concept('sarradon','Саррадон')|E] в конце III века, переплыв Море Империй вместе с остальными из тех, кого ныне зовут айярами. Когда флот был разделен великим штормом, аузангебы продолжили свой курс и уплыли, пожалуй, дальше всех из групп айяров. Когда они наконец причалили к берегу, они оставили позади даже Сихнамию.\n\nОни прибыли в Эрд-Лахдир, к порогу могучего Кемсара. В этой новой земле они стали кочевниками, блуждая в караванах и лагерях по всей стране, постепенно отказываясь от лоска своей павшей цивилизации. Приняв это новое существование, они жили в вечном подвешенном состоянии, бывая то наёмниками, работающими на какую-то группу, то их ненавистными врагами. Однако, ведомые опасным существованием в вечно разделенной земле, они научились ценить свои общины, свои церемонии и своё имущество, объединив эти три элемента в общественный идеал.\n\nНачавшиеся как скромные празднования по случаю возвращения торговца или наёмника в свой караван, теперь аузангебы устраивают регулярные пиры и празднества, на которые приглашаются все, от могущественнейшего знатного вельможи до нижайшего крестьянина. Они пользуются заслуженной репутацией народа великолепия, ибо для них величайшим проявлением добродетели является не сам подвиг победы, а демонстрация добычи.#"
 
 avihana_desc: "#size:15    Авиханы — молодая культура, отделившаяся от своих предков на севере в десятилетия, последовавшими за [Concept('murtuy_ka_varha','Муртуй ка Варха')|E]. В связи с опустошением как их исконных земель, так и земель вокруг них, авиханы мигрировали на юг к разорённым берегам Вичасиля, оставив в процессе большую часть своего прежнего аграрного уклада.\n\nСегодня об авиханов часто отзываются как о безжалостных и проницательных купцах, чьи могущественные гильдии удерживают влияние в каждом порту по всему Каширийскому заливу и в некоторых крупных городах дальше на Пиратском побережье и даже в самом Каширияте. Большая часть их молодёжи подталкивается к занятию ремеслом, а не к науке — это подозрительное отношение к учёным укоренилось в сердцах авиханов со времён их миграции.#"
 
 aygaen_desc: "#size:15    Самая западная культура, коренная для гор Армазли, народ айгаенов вечно находится в конфликте друг с другом. Традиционно общины айгаенов возглавляются обособленными группами жрецов, живущих в великих дворцах-храмах и направляющих свой народ как в духовных, так и в светских вопросах. Однако многие из первых защитников этих жрецов также основали великие родословные, и их потомки сформировали светскиз соперников их власти.\n\nАйгаены исторически были самыми ярыми противниками амагейцев в своём родном регионе, но при этом предприняли меньше всего восстаний из-за отсутствия великих стратегических умов. Когда храмы закрылись, а их знать рассеялась, айгаены стали более общинным народом, разделяя тяготы борьбы сообща, а не полагаясь на помощь своей хищнической аристократии.#"
 
 azarg_kutahnuug_desc: "#size:15    Обычно считающаяся одной из самых далёких, изолированных и загадочных культур Катраддии, азарг-кутахнууги ([Concept('azarg_kutahnuug_translation_debate','точный смысл оспаривается')|E]) привлекла к себе внимание [Concept('aversaria','Аверсарии')|E] и всего мира после [Concept('aehan_massacre','Эаханской резни')|E]. Будучи невероятно патриархальным и милитаристским обществом, они, как говорят, подвергают своих детей ряду [Concept('azarg_kutahnuug_blood_rituals','странных и жестоких ритуалов')|E], из которых немногие выжившие выходят, становясь устрашающими «[Concept('death_seekers','искателями смерти')|E]».\n\nХотя их долгое время считали отдалёнными и редко встречающимися, с приходом [Concept('frodbrokna','Фродброкны')|E] азарг-кутахнууги двинулись на юг, что сопровождалось тревожными сообщениями о встречах и «[Concept('bloodmark_incidents','принудительных посвящениях')|E]». Какова их конечная цель или какой она когда-либо была, остаётся неизвестным.#"
 
 babura_desc: "#size:15    Бабуры — это жители засушливой, холмистой долины Бабур во внутренних районах Эрд-Лахдира. Хотя в основном их считают сарадарами, в действительности они являются результатом постепенного смешения переселенцев-айяров и коренных саррадонцев, сформировавших культуру, которая, оставаясь преимущественно айярской, объединяет в себе несколько местных традиций. Находя точки соприкосновения в своей общей истории кочевничества, они представляют собой в некотором роде место встречи не только между сарадарами и кошаранами, но и между урбанизированным сердцем айяров и сельскими, традиционалистскими высокогорьями.\n\nИз-за низкого сельскохозяйственного потенциала региона они в основном придерживаются традиционных способов скотоводства. Кроме того, сочетая наёмнические традиции обоих народов, они считаются источником некоторых из самых искусных воинов Лираажа, многие из которых с юных лет обучаются боевым техникам, практикуемым со смутных глубин прошлого этого региона.\n\nИронично, но несмотря на свой статус смеси культур, они являются стойкими традиционалистами и неоднократно поднимали восстания против Шейярлахиры за дерзость нарушить их уклад жизни.#"
 
 balauri_desc: "#size:15    Балауры — это одно из многих сагадавийских племён, встречающихся на холмах и в густых лесах к востоку от Катраддии. Они являются квинтэссенцией сагадавийцев, известных своими грозными воинами, вооруженными фальксами, и шумным поведением как на поле боя, так и вне его. Однако, несмотря на свои стереотипно варварские качества, балауры также известны своей относительно развитой материальной культурой. Ремесленники балауров вырезают на своих доспехах богатые сцены, украшенные змеиными мотивами, а традиционный гобелен балауров стоил бы хороших денег на любом континентальном рынке. Эти художественные черты развились отчасти благодаря тому, что исконные земли балауров находились прямо на крупном торговом пути через внутренние районы континента, что позволяло идеям процветать, а самим балаурам разрастись, став самым многочисленным сагадавийским кланом.#"
 
 banwagul_desc: "#size:15    Прославленные моряки и навигаторы, [Glossary('банвагулы','GH_BANWAGUL_GLOSS')] издавна зовут водно-болотные угодья Дахангона своим домом. Более всего они знамениты своими замысловатыми кораблями, которые, несмотря на свои малые размеры, способны совершать путешествия через бескрайние моря. Эта склонность к исследованиям, а также их положение в центре двух миров сделали банвагулов гостеприимными к большинству чужеземцев, и их порты украшены парусами тысячи народов.#"
 
 barki_desc: "#size:15    Барки происходит от южной ветви сьялволькской культуры. Они заслужили дурную славу в годы войн с [Concept('aversaria','аверсарианцами')|E], работая проводниками и лазутчиками, что принесло им зловещую репутацию среди своих единоверцев. Тем не менее их умелое лавирование в бурной политике пограничья между захватчиками и обороняющимися принесло процветание баркам, которые выступали в качестве посредников в торговле между южанами и народами севера. Однако ни в какой момент они не имели полного доверия аверсарианцев: двуличие проводников барков подозревалось как причина Чорресской резни в 1067 И.С. и бескровного, позорного провала карательной кампании в Ичитероне в 1086 И.С. Ничего так и не было окончательно доказано, но вполне вероятно, что барки были на пути к жестокой расправе со стороны своих союзников, когда разразилась Фродброкна.\n\nБудучи самыми «аверсарианизированными» из сьялволков, барки не питали особой любви к кланам Имперреха, в результате чего их пути разошлись почти сразу после того, как битва у Элизианского перевала вывела их в безопасность за пределы [Concept('foglands','Туманных земель')|E].#"
 
 barzawa_desc: "#size:15    Высокогорный народ, обитающий в горах Центрального [Concept('sarradon','Саррадона')|E] с незапамятных времён, барзавы по большей части влились в более широкие саррадонские культурные течения. Тем не менее они сохраняют ряд странных обычаев, восходящих к временам еще до [Concept('the_worldeater','Пожирателя миров')|E]. Их кланы в основном матрилинейны, а их народ разделен на ряд племён, многие из которых заявляют о царском наследии, утерянном в истории.#"
 
 beduleno_desc: "#size:15    Бедуленоийцы бороздили воды Каширията задолго до прибытия ольтенов. Когда Байтор начал своё завоевание Айроноя, они вызвались переправить наступающую орду через реку, избавив их от участи, постигшей тех, кто отказался. Это также позволило бедуленойцам остаться великими торговцами и паромщиками, и по сей день они обеспечивают самый безопасный способ пересечь Каширият и Латунное море.#"
 
 bricotaves_desc: "#size:15    Брикотавы — это обособленное племя, изначально коренное для Сердцелесья в Калатипсоми. Хотя большая часть их материальной истории была утеряна в веках, брикотавам удалось пронести устную традицию, ведущую летопись их разрозненной истории после едва не случившегося вымирания во время [Concept('marcher_aversarian_wars','войн Марок и Аверсарии')|E].#"
 
 brigandines_desc: "#size:15    Бригандинцы — это всё, что осталось от жителей западного [Concept('greensea','Зелёного моря')|E], где деревья настолько густые, что можно идя днями не видеть солнца. Целые деревни выкручивались из корней деревьев [Concept('magi','магами')|E], а почитаемые Начертатели вырезали целые рунические истории на непроницаемом деревянном гобелене. Общины были сплочёнными и уединёнными, дети воспитывались сообща, а многие люди выбирались наружу только ради молитвы.\n\nОни дополняют свой в основном вегетарианский рацион насекомыми и мёдом, а их маги одинаково известны как своей аскетичной мудростью, так и суровым, мрачным нравом.#"
 
 caemansi_desc: "#size:15    В то время как даукены пишут утончённые и пронзительные стихи, [Glossary('сиемансийцы','GH_CAEMANSI_GLOSS')] никогда не проявляли интереса к подобным изяществам — их саги изображают неоправданное насилие и стремительное действие, а их барды предпочитают хруст позвоночника полету бабочки.\n\nБольшая часть этих историй берёт начало из гордой истории Кровавых псов, зафиксированной на великих рунических камнях, испещрённых описаниями и глифами великих завоевателей и искателей приключений. Этот стиль военной поэзии стал популярен среди многих сьялволькских кланов, когда деяния великого воина пересказываются перед тем, как сойтись врукопашную с врагом.#"
 
 carsavisians_desc: "#size:15    Уроженцы центрального [Concept('chevalie','Шевалье')|E], карсавизианцы — народ стойкости. Терзаемая веками вторжений [Concept('liches','личей')|E], их культура была сформирована необходимостью противостоять невзгодам. Пока горели города и падали крепости, они учились перестраивать их еще более прочными, учитывая каждую ошибку и улучшая сделанное. Хотя другие шевальенцы искусны в строительстве крепостей, карсавизианцы — истинные мастера, чьи возвышающиеся твердыни обрели форму благодаря горькому опыту. Постоянное стремление к совершенствованию стало неотъемлемой частью их идентичности, где неудача — лишь препятствие, испытание при подготовке к конечному успеху.\n\nВзирая на мир через эту призму, они меньше заботятся о наказании за неудачу и больше о том, чтобы извлечь из неё урок. Их Отцы Пути знамениты своей снисходительностью, пока это ведет к улучшению. Тех же, кто сдаётся, изгоняют из общества, ибо карсавизианцы верят, что чистая выдержка способна преодолеть любой вызов. Многие из величайших историй успеха в Шевалье берут начало именно от них — истории, которые затем вновь интегрируются как цели, к которым нужно стремиться. Какая бы судьба их ни ждала, они наверняка примут её, относясь к ней лишь как к очередному препятствию, которое предстоит преодолеть.#"
 
 cerussiai_desc: "#size:15    Церуссиайцы жили на центральной равнине Малькои на протяжении бесчисленных поколений. Рассматриваемые своими [Concept('aversaria','аверсарианскими')|E] повелителями как «цивилизованное племя», они использовались в качестве искусственно созданного среднего класса в колониальных поселениях, возникших по всему Ийросскому бассейну. Несмотря на это, церуссиайцы так и не влились до конца в имперское сословие — отчасти из-за усилий аверсарианцев по разделению двух групп, отчасти из-за их собственного желания сохранить свои традиции живыми. Церуссиайцам были предоставлены свободы, которых не имели их ийросские братья, и они пользовались их благами. Однако теперь ситуация изменилась. Время покажет, что станет с «цивилизованным племенем».#"
 
 charchac_desc: "#size:15    Обнаруживаемые на юго-востоке гор Армазли, чарчаки определяются своим упрямым пылом. Их обособленность была вызвана культурной враждой между ними и их соседями, чьи традиции и религия часто отвергались как нелепые. В их древней истории ими правила могущественная каста жрецов, контролировавшая каждый аспект их жизни. В возрасте шести лет половина всех детей чарчаков выбиралась для жизни в качестве жреца или воина, и только тем, кто потерпел неудачу, позволялось заняться другим ремеслом.\n\nОднако их культура радикально изменилась в результате амагейского завоевания. Жреческая каста была низведена на самое дно общества чарчаков, а культура набегов стала стержнем их существования. Поскольку их народ воспринимается их амагейскими рабовладельцами как нечто меньшее, чем люди, кланы чарчаков регулярно совершают набеги на земли амагейцев, чтобы похищать их женщин и детей, сжигая их на великих кострах. Однако, несмотря на неистовую ненависть в своих сердцах, народ чарчаков так и не сумел вернуть своё былое господство.#"
 
 coldcoaster_desc: "#size:15    Хладобрежцы — коренные обитатели островов к юго-западу от Шевалье, известные прежде всего как умелые моряки и рыбаки. Хотя они тесно связаны с соседними вояженами, у них много культурных связей с Расколотыми островами, и иногда их считают скорее островными жителями, чем марочниками. Материковые шевальенцы обычно уделяют хладобрежцам очень мало внимания, хотя те известны тем, что служат одним из последних оплотов дарраллианской ереси.#"
 
 corvosnari_desc: "#size:15    Практикуя уникальную и тайную традицию магии теней, корвоснары сумели выдержать суровое существование в древних лесах Калатипсоми, выживая за счёт охоты на обильную фауну своих лесных цитаделей и за счёт безжалостных набегов на своих соседей, будь то аверсарианцы, марочники или сьялволки.#"
 
 csorsca_desc: "#size:15    Чорски произошли от группы сихарцегских кланов, возвышенных [Concept('aversaria','аверсарианцами')|E] после [Concept('kartharadd','Картараддских войн')|E], переняв в процессе многие атрибуты своих господ. Все юноши и девушки чорсков обязаны вступить в [Glossary('бётай', 'GH_BOTAI_GLOSS')], чтобы считаться взрослыми и иметь возможность полноправно участвовать в жизни общества. Бётаи, в свою очередь, подчиняются классу [Concept('magi','магов')|E] и управляются как псевдо-аверсарианские легионы в миниатюре. Чорскская концепция [Concept('ardara','ардары')|E] вращается вокруг повиновения магам и чистокровным, наряду с доблестью в бою и [Concept('magic','магией')|E].#!"
 
 curgerski_desc: "#size:15    Кургерски были немногочисленны даже до Фродброкны, а теперь их стало ещё меньше. Они были самыми северными из северных племён, выбравшихся из [Concept('foglands','Туманных земель')|E], будучи вытесненными на окраинные и холодные территории, отвергнутые более крупными и могущественными кланами в прошлые века. До того как Имперрех вывел их в большой мир, у них никогда не было повода заводить постоянные поселения или становиться земледельцами, вместо этого они влачили существование в качестве кочевых охотников и оленеводов в суровом крае. Их орудия труда и оружие часто изготавливались из простых костей и камня, поскольку их земли были лишены каких-либо доступных месторождений металла, а большинство кургерских племён были слишком бедны, чтобы ими интересовались торговцы. Из-за этого собратья-сьялволки пренебрежительно называли их дикими и примитивными.\n\nНыне обосновавшись на бывшей [Concept('aversaria','аверсарианской')|E] территории, они постепенно переняли некоторые элементы уклада более «цивилизованных» кланов, но старые привычки умирают с трудом. Кланы кургерцев пользуются дурной славой из-за своей обособленности и недоверия к чужакам — к категории которых они относят и большинство других сьялволков.#"
 
 dadkawji_desc: "#size:15     Дадкавджийцы — это дружелюбный и космополитичный народ, обитающий вдоль Саррадонского Рога. Говорят, что когда-то они построили величественный город [Concept('magaala_qaaday','Магаала-Каадай')|E], а сами дадкавджийцы издавна славятся своими изумительными красителями. Их купцы удерживают монополию на торговлю красителями по всему [Concept('pirate_coast','Пиратскому побережью')|E] благодаря уникальным отношениям дадкавджийцев с соседними племенами илоходцев. Многие дадкавджийцы красят волосы в яркие и экзотические цвета, а также носят сложные, детализированные татуировки на лице, которые определяют статус человека в обществе.#"
 
 dathanites_desc: "#size:15    Потомки саррадонских купеческих колоний на Дальнем Востоке, датаниты являются результатом уникального культурного слияния далёких народов и земель. Их далёкие связи дали им преимущество в прибыльных трансконтинентарных торговых сетях, а склонность их культуры к легализму привела к тому, что соседи повсеместно считают их справедливыми и нейтральными посредниками и арбитрами.#"
 
 daukeni_desc: "#size:15    Происходя из глубинки земель сьялволков, даукены заслужили среди своих собратьев-сьялволков репутацию своего рода культурных шовинистов. Если слушать рассказы самих даукенов, их родина благословлена обильной дичью, щедрыми реками и климатом, идеально сбалансированным между жарой и холодом, чтобы взращивать самых стойких и отважных воинов во всём [Concept('aeras','Эрасе')|E], и уж точно среди народа сьялволков.\n\nДаукены никогда не считали, что дары богов человечеству скрыты от глаз, и верят, что сами они являются главными выгодополучателями этого изобилия. Как и остальные сьялволки, даукены были склонны к разобщённости, где каждый клан соперничал со своими конкурентами за территорию и славу. Они особенно известны своими [Concept('daukeni_saga','сагами')|E].#"
 
 dawasid_desc: "#size:15    Давас, дочь Мармала, была известна своим неугомонным нравом и безжалостной проницательностью, всегда готовой испробовать то, чего никогда не делалось прежде, ради выполнения задач, которые мужчины считали невыполнимыми. Так и случилось, что давасиды пронеслись по западу Саррадона, появившись словно из ниоткуда, чтобы обратить в бегство Мадикриба и ритуалистов, стоявших перед ними.\n\nДавасиды с азартом переняли атрибуты оседлой жизни, многое перенимая и делясь с теми, кого они покорили. Так и произошло, что в короткие сроки вожди давасидов переняли вековые атрибуты традиционных талитских царей Саррадона.#"
 
 dayarka_desc: "#size:15    [Glossary('Даярки','GH_DAYARKA_GLOSS')] — это ответвление банвагулов, происходящее от последователей [Concept('nari_daya','Нари Дайи')|E], королевы-воительницы древности. Будучи строго матриархальным обществом, они стойко оберегали не только учения, но и территории, завоёванные их королевой. Это привело к тому, что даярки прославились как искусные воины и превосходные [Concept('magi','маги')|E], доведшие до совершенства искусство усиления физических возможностей человека с помощью заклинаний.#"
 
 deraani_desc: "#size:15    Коренная культура Тринапаавы и близлежащих островов, дерааны славятся по всей Каширии своими морскими традициями, особенно пиратством. Говорят, они превращают пиратство в изящное искусство, экстравагантно одеваясь и обучаясь танцевать со своими мечами с пятилетнего возраста. Каждый клан обычно владеет кораблём на каждые десять человек; из-за строгой клановой иерархии ни один мужчина или женщина не пригодны для брака или владения уделом, пока не захватят груз двадцати судов. Сражения между дераанами обычное дело, но они обычно быстро разрешаются через [Glossary('Тианан Руду','GH_TYANAN_RUDU_GLOSS')].\n\nИх погребальный ритуал для капитана хорошо задокументирован и заключается в том, что труп капитана и любые члены экипажа, пожелавшие уйти вместе с ним, привязываются к мачте своего корабля и отправляются в свободное плавание по Пиратскому побережью. Хотя некогда это был причудливый жест, ущерб, наносимый торговым сетям региона, часто приводил к тому, что дераанам закрывали доступ в порты для продажи их товаров.#"
 
 deresstae_desc: "#size:15    Налётчики дересстайцев когда-то были бичом [Concept('aversaria','Расколотого побережья')|E], их сильная морская культура гнала их через море в поисках беззащитных берегов. Однако вскоре их собственный народ стал жертвой пришельцев из чужих земель, будучи порабощённым и принуждённым работать на фабриках тех, кого они раньше грабили. Знания дересстайцев в кораблестроении были использованы для создания огромного флота Аверсарии, но знания о том, как управлять своми творениями, подавлялись из страха, что это может быть как-то использовано против угнетателей. Теперь верфи, на которых они когда-то трудились, лежат в руинах, и миру снова пора бояться одного лишь вида дересстайцев.#"
 
 dergi_desc: "#size:15    Происходя с западных островов Латунного моря, дерги представляют собой крайне обособленный ряд племён, которые стремятся сохранить красоту своих островов. Каждое изменение, которое они вносят на свои острова, должно быть одобрено их лидерами, иначе они могут разрушить совершенство своего рая. Наибольшего внимания в их культуре заслуживают грандиозные сады, поддерживаемые в их центрах власти, символизирующие красоту как их роли в природе, так и абсолютного контроля природы над самой собой.\n\nХотя они сохраняли своё стремление к изоляции, дерги сделали исключение для [Concept('aversaria','Аверсарианской Аавтократии')|E], не желая, чтобы их леса сгорели в войне с массивной империей. [Concept('aversaria','Аверсария')|E] и дерги исторически не испытывали особых проблем в своём союзе, а имперские торговые посты благоустраивались в соответствии с прихотями коренных жителей.#"
 
 dielecender_desc: "#size:15    Находясь на перекрёстке великих империй, диэлесендеры издавна существовали как плавильный котёл культур. Хотя они и считаются сородичами [Concept('marchers','марочников')|E], они тем не менее сохраняют сильное стремление к независимости, присущее [Concept('shatteredisles','островитянам')|E], и уникальную идентичность, берущую начало от культур, которые древнее и тех, и других. Из-за своей истории и географического положения большинство диэлесендеров многоязычны и считаются [Concept('dielecendian_compromise','способными посредниками и дипломатами')|E].#"
 
 diorenic_desc: "#size:15 Диореники, более чем любая другая анандрасская культура, сформировались под влиянием своих отношений с [Concept('chevalie','Шевалье')|E]. В далёком прошлом они долго враждовали со своими восточными соседями, что привело к строительству длинной цепи великолепных прибрежных укреплений, разбросанных по их островам.\n\nОтношения охладились после [Concept('red_river_war','Войны Красной реки')|E], из-за чего диореникийские острова даже называли «[Concept('little_chevalie_beyond_the_sea','Малая Шевалье за морем')|E]», однако островитяне по-прежнему чтут свои древние традиции, особенно в производстве знаменитого деликатеса — [Glossary('дибрабала','GH_DIBRABAL_GLOSS')]."
 
 doffore_desc: "#size:15 Коренные жители северо-запада Дамоты, где Гонанский тракт соединяет регион с остальным [Concept('sarradon','Саррадоном')|E], доффоры пользуются репутацией торговцев Дамоты. Большинство доффоров так или иначе связаны с [Concept('karavuux_capital','Каравууксом')|E], и даже самый неприметный фермер играет свою роль на торговых путях. Это отражается даже на планировке их поселений: традиционно доффоры концентрируются в меньшем числе более крупных городов, чем их южные и восточные собратья.#"
 
 draneti_desc: "#size:15 Дранеты — коренной народ центральных гор Армазли и прилегающего побережья. Их строгая традиция защиты местной фауны принесла дранетам репутацию людей, которые добрее к животным, чем к чужакам. Несмотря на эту внешнюю холодность, они гордятся своими обширными гостевыми обрядами. Говорят, что даже самым заклятым врагам не откажут в защите, если они обратятся к дому дранетов за помощью.\n\nВ силу своего благородства дранеты веками были излюбленными рабами своих соседей-амагейцев. Часто служа в домах своих господ, а не надрываясь на плантациях, дранеты пользовались хорошим обращением достаточно долго, чтобы привыкнуть к своему положению. Отсутствие открытого сопротивления Амагее также уничтожило многие из их ранних воинских традиций, оставив дранетов относительно дипломатичной группой как в мирное время, так и на войне.#"
 
 drothacny_desc: "#size:15 Не все мондеррны были порабощены аверсарианцами без сопротивления. Некоторые, придерживаясь совершенно иного религиозного кредо, попытались дать отпор. Это была тщетная попытка, ибо даже воинственные последователи Детхедкланнского Соглашения не привыкли к войне в том виде, в каком её знали аверсарианцы, и вскоре они были вынуждены спасаться бегством. Ведя непрекращающуюся партизанскую войну в дремучих лесах Катраддии, люди, которые впоследствии назовут себя дротеррнами, выковывались в горниле испытаний длиной в поколения.#"
 
 dubadin_desc: "#size:15 Коренные жители северного Митидона, дубадины веками томились в рабстве — сперва у ийроссов, затем у [Concept('aversaria','аверсарианцев')|E]. Несмотря на порабощение, культура дубадинов выжила благодаря силе их устной традиции, которая до сих пор хранит сказания о временах, когда они были свободны. Дубадины желают освобождения из рабства пуще всего на свете и пойдут на всё, чтобы его добиться.#"
 
 eastlighter_desc: "#size:15 Восточно-светцы определяются своей тягой к востоку. Будучи самыми разнородными из жителей Одинокого света, восточно-светцы сформировали самобытную культуру в плавильном котле сотен различных групп, которые бежали на Острова и не смогли или не захотели продолжить путь на запад. Хотя они давно стали частью пестрого ковра культур [Concept('lonely_light_biozone','Одинокого света')|E], они тем не менее оставались одними из самых ярых противников объединения с западом и часто возмущались властью, которую над ними имела Эгида. В сказаниях и песнях восточно-светцов их дом всё ещё лежит на востоке, даже когда сменяются поколения, а память о нём всё сильнее превращается в смутное воспоминание и забытый сон.#"
 
 ekaachi_desc: "#size:15 Отделившись от своих рахикайских родственников в конце VIII века, экаачи родились из неприятия постоянных войн между их королями. Для них идея гнать сильных мужчин и смышлёных мальчиков в реку после каждой неудавшейся стычки была отвратительна. Вместо этого они придерживаются политики свободной торговли вдоль портов своей реки и прилегающего побережья. Их одержимость торговлей среди земли воинов принесла им прозвище «речные шакалы», охотящихся за честно добытыми трофеями войны с помощью расплывчатых обещаний и закулисных торгов.\n\nНесмотря на свою репутацию стяжателей, экаачи гораздо более гостеприимны и открыты, чем их соседи, а их крупные портовые города привлекают гостей из мест столь далеких, как [Concept('aversaria','Аверсария')|E]. Предоставляя право сражаться наёмникам, а не своим королям, выдающийся класс экаачийских купцов изрядно набил свои карманы. Экаачи бегло знают большинство каширийских языков и как минимум одно слово в каждом иностранном: «бартер».#"
 
 erkalgani_desc: "#size:15 Эркалганы не могут противиться зову моря, отважно отправляясь в неизведанные воды для расширения своей диаспоры морских колоний вдоль побережий [Concept('western_aironoi_biozone','западного Айроноя')|E]. Куда бы они ни направлялись, богатства Айроноя вскоре следуют за ними, поскольку бесчисленные купеческие флоты идут по стопам их первопроходцев, открывая новые рынки и связывая далекие народы. В результате города эркалганов часто превращаются в хаотичный калейдоскоп соперничающих аванпостов и торговых станций, которые борются между собой за доли рынка и клиентов — зачастую не самыми честными методами.#"
 
 fedagesh_desc: "#size:15 Федагеши — потомки тех, кто продвинулся в северо-восточные земли после образования [Concept('boqqarut_damotada','Боккарута')|E]. Поскольку их раннее общество было сосредоточено вокруг массивных домов на несколько семей, они преобразовали многие из [Concept('lodges','орденов Раякуукс')|E] в [Concept('qabuux_capital','Кабуукс')|E], которые до сих пор имеют среди них огромное влияние. Закалённые борьбой за создание цивилизации посреди джунглей, федагеши пользуются уважением по всей Дамоте как прилежные работники, верные своим общинам и возложенным на них ожиданиям.#"
 
 fenvir_desc: "#size:15 Несмотря на то, что они были среди самых малочисленных кланов, воины фенвиров с лихвой компенсировали нехватку численности безудержной свирепостью. Большинство из них жили в скромном достатке на открытых всем ветрам холмах, пасли свои стада или рыбачили у немногих рек, протекавших по их землям, влача скромное, если не сказать скудное существование. Когда зима приходила на их северные пастбища, они гнали скот дальше на юг, выменивая качественную шерсть на орудия труда и оружие. Однако их истинным призванием было отправляться из своих простых жилищ в чужие земли на поиски славы и добычи — будь то плата за их услуги на поле боя или, что случалось чаще, самостоятельный захват трофеев.\n\nФенвиры были одними из первых, кто увидел, как безумие [Concept('the_fog','Тумана')|E] сходит с их холмов, но из-за своего полукочевого образа жизни они испытали гораздо меньшее потрясение столкнувшись с необходимостью покинуть свои нагорья навсегда.#"
 
 gallicads_desc: "#size:15 Галликады — древний народ Марок, обитавший в её лишенных магии холмах и долинах веками до прихода шевигадов. Вопрос о том, какая часть современной [Concept('marchers','марочникской')|E] культуры восходит к народам, которые она заменила, остается предметом споров. В то время как древнее «Сказание о короле Бастионе» повествует о том, что основатель [Concept('chevalie','Шевалье')|E] и его героические рыцари вели ожесточенные сражения ради обретения дома, свободного от злобных галлиенов, существуют также свидетельства того, что многие из столпов марочникских обычаев и традиций были переняты у этих народов-предшественников, что указывает на то, что далеко не все контакты между ними были враждебными.\nИх общество разделено на иерархические касты, которые определяют конкретные роли и занятия человека на протяжении всей его жизни."
 
 gallien_desc: "#size:15 Галлиены представляют собой последние остатки галликадской культуры, подвергшиеся сильной ассимиляции и выжившие лишь среди холмов и гор, избежавших марочникского заселения исключительно из-за скудной, каменистой почвы и упрямства местных жителей. Там они и живут, продолжая традиции своих предков в уединенных общинах.#"
 
 ghudiyy_desc: "#size:15 Одно из «бастардских племен» мармаладидских народов, гудийи возводят свою родословную к паре героических близнецов, отпрысков Мармала, непризнанных другими великими племенами. Известные своим искусством верховой езды, великими династиями поэтов и глубоко укоренившейся традицией чести, гудийи обосновались в высокогорной пустыне Центрального Саррадона.#"
 

 gisreddean_desc: "#size:15 Жители как Пети-Гисредда, так и Гранд-Гисредда, известные своим [Concept('gisreddean_banking_system','трудолюбием')|E] и яростной [Concept('gisreddepact','независимостью')|E], обладают уникальным набором [Concept('fraternity_of_gisredde','традиций')|E], [Concept('council_of_gisredde','правил')|E] и [Concept('conclave_of_gisredde_concept','верований')|E], которые отличают их от остальных [Concept('marchers','марочников')|E].\n\nОбладая [Concept('champion_era_gisredde','богатыми преданиями')|E] и [Concept('glorious_gisredde','историей')|E], которая ставит их в центр важнейших событий, а также будучи, по слухам, родиной [Concept('jan_va_gisredde','нескольких')|E] [Concept('champion_of_chevalie','героев')|E], гисреддцы считают себя самым сердцем [Concept('chevalie','Шевалье')|E]. Впрочем, эта гордость не лишена оснований, ведь гисреддцы всегда находятся в авангарде технологического развития, а самые ярые гисреддские фанатики верят, что даже когда [Concept('the_fog','тьма')|E] окутает мир, Гисредд останется последним светочем человечества.#"

 
 goans_desc: "#size:15 Гоанцы прошли через Серые Врата вместе с Ценваром, хотя сами не являются сьялволками. Они происходят с вершины горного хребта, приспособившись к высоте с давних времен. Жилища гоанцев высекались в скалах; многие из них стояли дольше, чем жившие в них племена, а некоторые и вовсе утверждали, что эти жилища принадлежали им с начала времен. Когда-то они пасли коз на высотах и периодически воевали между собой за немногие плодородные пастбища, что можно было найти в горах. Отвесные пики родины изолировали их от внешнего мира, о котором они имели лишь смутное представление.\n\nЭтому пришел конец с наступлением [Concept('frodbrokna','Фродброкны')|E], когда их жилища обрушились, пастбища раскололись, а с неба посыпались камни. Вынужденные объединиться, они начали исход из гор, где столкнулись с растущим воинством Ценвара и примкнули к его вторжению в [Concept('aversaria','Аверсарию')|E]. Потеряв родину, гоанцы теперь столкнулись с незнакомым миром. Они разрываются между желанием отыскать новые горы, чтобы вернуться к древнему укладу, и возможностью освоить пастбища и плодородные равнины своих новых земель.#"
 

 greulokin_desc: "#size:15 Слава грейлокинам, избранным сыновьям и дочерям [Concept('prohen','Прохена')|E], который кроит и отмеряет полотно человеческих жизней, отцу покорного [Concept('velos','Велоса')|E] и истинному королю богов [Concept('aeras','Эраса')|E]! Когда-то они были на подъеме — повелители великого королевства, состоявшего из других южных племен сьялволков, которых они заставляли платить дань. Ими правили Тейберльские короли, и, в отличие от современной сьялволькской теологии, они настаивали, что именно бог судьбы занимает главное место в пантеоне, ибо это он повелел Велосу наделить человека дарами и определил условия их сохранения. На практике функциональные различия, вызванные этим изменением, были невелики и ограничивались базовыми ритуалами, но пока Тейберльские короли оставались сильны, это позволяло им обосновывать свою роль верховного клана. Времена были хорошими.\n\nА затем Тейберльские короли погрязли в междоусобицах. Великое Королевство Грейлокинов было потеряно всего за одно поколение раздоров, когда их данники подняли восстание, а правящим кланам пришлось поумерить свою гордыню. Тем не менее, грейлокины продолжают почитать свой причудливо перестроенный пантеон и никогда не забывали, что когда-то были королями среди людей."

 
 guillater_aversarian_desc: "#size:15 Некогда граждане самой северной окраины древней [Concept('aversaria','Аверсарии')|E], неофретиты из-за упадка [Glossary('системы полисов','GH_POLISOCRACY_GLOSS') и образования [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )] отдалились от центра и влились в плавильный котел островов Гийят. Эта общая история, а также желание превратить [Concept('shatteredisles','Острова')|E] в оплот, с которого можно было бы проецировать аверсарианский контроль над остальной частью архипелага, со временем заставили эту культуру вновь сблизиться со своими древними сородичами.\n\nНеофретиты также разделяют любовь к путешествиям и стремление увидеть мир за пределами острова, на котором они родились. Зачастую целые деревни отправлялись в долгие странствия в поисках нового дома, что сделало их народ одной из самых рассредоточенных культур на Расколотых островах. Эта склонность к исследованиям превратила их в умелых проводников и навигаторов, и на многих парусных судах нанимают рулевого-неофретита для помощи в плавании.#"
 
 guillater_desc: "#size:15 Гийятцы — живут ли они среди декадентских морских садов аристократии Де Иллитрат, среди затопленных и заросших мхом башен Пифея, в чужеродных локациях Ионделя с красными водами и синими берегами или даже в унылых и разросшихся трущобах торговых городов Ден Териатрикс — являются, пожалуй, самым разнообразным, гордым и успешным народом на [Concept('shatteredisles','Островах')|E] и, возможно, на всем [Concept('aeras','Эрасе')|E]. Названные в честь легендарного адмирала Гийята ден ва Крестоффексароффа, который в значительной степени освободил Острова от имперской эксплуатации со стороны [Concept('marchers','шевальенцев')|E], [Concept('aversaria','аверсарианцев')|E] и конейкменеров, гийятцы могут говорить на языках своих бывших колонизаторов и казаться похожими на своих материковых родичей, но вместе они образуют совершенно уникальную культуру, определяемую не их родиной, а их ожесточенным отказом подчиняться кому-либо.#"
 
 gwasillikh_desc: "#size:15 Гвасиллихи — самое западное из Великих племен мармаладидов, которое, как утверждается, возводит свою родословную к покорителю и полубогу Гвасилу Темнонебому, чьи великие набеги опустошили весь западный Саррадон. Избранные воины племени ездят верхом на гигантских летучих мышах с волчьими головами, которые, по преданиям, изначально были демонами, призванными на Эрас из великой пустоты ночного неба основателем племени. Они печально известны своими безжалостными ночными набегами, наводящими ужас на сердца их соседей.#"
 
 gwenuyos_desc: "#size:15 Жители среднего Каширията, гвенуйцы заявляют о своем древнем и героическом наследии, которое столь же старо, как и сама Божественная река. Закаленный народ, они долго и доблестно сражались против повторяющегося ярма завоеваний и господства. В битвах, которые они почти всегда проигрывали."
 
 hamaxindi_desc: "#size:15 Хамаксинды имеют пре-амсарские корни: их террасные города и крепости украшали высокие склоны долины реки Неуэльса на протяжении тысяч лет, задолго до Пророка и Хиклахна. Столетия сосуществования и взаимообмена привели к тому, что культура хамаксиндов в значительной степени ассимилировалась в амсарской среде и теперь выделяется лишь горсткой уникальных фестивалей и причудами в костюмах.\n\nОднако в более близкие к нам времена они обрели известность благодаря прозе хамаксиндских поэтов — эта репутация сформировалась в различных дворах и литературных кругах по всему Хиклахну. Это лидерство оспаривается в серьезной борьбе с хиксартийцами, а знаменитое соперничество между хиксартийскими и хамаксиндскими авторами на протяжении веков оставалось главной опорой амсарской литературной истории.#"
 
 hixartii_desc: "#size:15 Хиксартийцы — потомки амсарских гарнизонов, размещенных на тогда еще слаборазвитой северо-западной границе Хиклахна для защиты от набегов хассаридитских племен, обитавших далеко на западе. За прошедшие с тех пор века крепостные города разрослись далеко за пределы своих глинобитных стен, раскинувшись по плодородным зеленым холмам и лесам региона, сельскохозяйственное производство которого стало соперничать с долиной реки Неуэльса. В сочетании с удаленностью от Ханхе-Пешамбры это привело к тому, что хиксартийцы стали печально известны своим стремлением к независимости, граничащим с сепаратизмом. За прошедшие века возник ряд попыток отделить эту территорию от Хиклахна, в результате чего королевство Шуран в основном удерживалось амсарскими регентами, присылаемыми из столицы.\n\nВозможно, именно из-за своих претензий на независимость от Хиклахна хиксартийцы создали высокоразвитую собственную письменную культуру. Особую известность снискали их поэты, знаменитые весьма пикантной тематикой своих произведений и готовностью отходить от амсарских литературных традиций. Их поэты также известны привычкой враждовать с хамаксиндскими авторами, и за века соперничества между этими двумя исторически грамотными народами было пролито немало чернил — и даже немного крови.#"
 
 hmaceak_desc: "#size:15 Хмачеаки — потомки миграционного флота с востока, который [Concept('samhatepaya','прибыл')|E] в Рожихлат-Мару в начале IX века. По прибытии они легко отвоевали себе территорию для жизни у [Concept('thu_usiktwe','ослабевших туземцев')|E], обосновавшись в древнем мегаполисе. Хмачеаки были активными торговцами, которые за века превратились в ведущую экономическую силу в этом регионе, а их порты служили важной остановкой на торговых путях из Саррадона на Восток. Однако со временем они утратили свой космополитичный уклад, переняв многие обычаи завоеванных ими народов.\n\nХмачеаки также широко известны своим мастерством в изготовлении красителей, что осталось им в наследство от восточной родины. Они используют многочисленных обитателей мангровых лесов для создания красителей самых разных оттенков, которые они щедро наносят на свои орудия труда и одежду, а торговца-хмачеака в порту легко узнать по ярко окрашенным волосам.#"
 
 hokanta_desc: "#size:15 Хоканта — мореходный народ южной [Concept('kashirya','Каширии')|E], который, как утверждается, мигрировал в этот регион еще до начала письменной истории. Хотя их происхождение туманно, многие [Concept('margur_migration','мифы')] пытаются дать на него ответ. Их общины широко известны проведением огромного количества пышных церемоний в честь праздников, свадеб или простых памятных событий."
  
 hudi_desc: "#size:15 Худы из западного Харадамата — народ, который на протяжении большей части своей истории определялся своей верой даже в большей степени, чем их соседи. На протяжении тысячелетий они отвергали как [Concept('ritualism','ритуализм')|E], так и более поздний [Concept('wardenism','варденизм')|E], вместо этого почитая Шуб-Йуагуаг — Мать-Кормилицу, вопреки попыткам проповедников обеих соперничающих религий обратить их в свою веру. Хотя в последние несколько веков они все чаще принимают варденизм, они и по сей день известны своей крайней консервативностью. За рубежом и в далеких землях они гораздо больше известны качеством своих ремесленных изделий — особенно оружия. Говорят, что худиский ятаган может прорезать стальные доспехи, как кинжал кусок ткани, и за них, как правило, просят столь же внушительную цену.\n\nС подчинением королевства Кудамаш в качестве вассального государства агионистами в 1161 году они обнаружили, что определяющие их строгие устои все сильнее вступают в противоречие с требованиями их новых [Concept('aversaria','аверсарианских')|E] господ. Роковым образом примкнув к повстанцам во время [Concept('faghira_jalil_revolt','восстания Фагира Джалиля')|E], они стали главной мишенью для сансианитской ярости во время [Concept('kahdavrakan_supper','Кахдавраканского пира')|E], и с тех пор в основном бежали со своей исторической родины в относительную безопасность [Concept('mamuramat','Мамурамата')|E]. Оказавшись в кризисе и без дома, они пережили массовые обращения в варденизм, и, похоже, их древняя вера в Мать-Кормилицу вскоре окончательно исчезнет.#"
 
 huegodocs_desc: "#size:15 Космополитичная культура родом с территорий по ту сторону Серых Врат, хуэгодоки жили в ряде процветающих городков и мегаполисов вдоль Великой реки, собирая прибыльные пошлины и возделывая богатую почву. Когда прибыли [Concept('aversaria','аверсарианцы')|E], хуэгодокам хватило удачи и проницательности, чтобы договориться о относительно выгодных условиях мира: они стали подданными без гражданства, но остались свободными мужчинами и женщинами.\n\nОни были на пути к полной ассимиляции с аверсарианской культурой, и пройди еще несколько поколений, они могли бы стать почти неотличимы от своих соседей-апокиакасов, когда [Concept('frodbrokna','Фродброкна')|E] обрушилась на [Concept('aeras','Эрас')|E]. Когда стало ясно, что любые попытки аверсарианцев спасти местное население от наступающего [Concept('the_fog','Тумана')|E] недостаточны для спасения их местных союзников, хуэгодоки предпочли связать свою судьбу с коалицией Ценвара.#"
 
 hunawi_desc: "#size:15 Упрямые, твердолобые и скромные — вот самые частые характеристики, которые дают народу хунавов из южной [Concept('kashirya','Каширии')|E]. Происходя от [Concept('margur_migration','миграции маргуров')|E], хунавы посвятили себя [Concept('katuppilan_biozone','Катуппилану')|E], сосредоточив свои усилия на расширении солоноватых водных путей и мангровых зарослей, превращая их в основную экосистему юга."
 
 huxayakha_desc: "#size:15 Хусаяханы — это аэвакорский народ, обосновавшийся вокруг Гахарина, ледникового озера в южном Хайратане. Гахарин занимает центральное место в хусаяханской жизни, и большая часть их богатств извлекается из его глубин. Косяки пятнистой форели обеспечивают пропитание, шкуры гигантских саламандр продаются из-за их предполагаемых магических свойств, а ныряльщики за пресноводным жемчугом достают украшения из бездны. Это богатство привело к развитию крупных торговых путей по всему региону, и сокровища Гахарина появляются на рынках по всему Дармирату. Города хусаяханов украшены озерными мотивами, а озерных духов почитают независимо от господствующих верований эпохи.\n\nВ результате обладания этими природными богатствами хусаяханы защищают свои дома с яростью и являются смертоносными воинами. Известные своими стойкими копейщиками и быстрыми конниками, хусаяханы не знают пощады, а берега Гахарина покрыты святилищами, посвященными древним королям-воинам.#"  
 
 iafarana_desc: "#size:15 Иафараны издавна называют своим домом первозданные воды Ночного побережья, хотя свидетельств об их [Concept('iafarana_historiography','ранней истории')|E] сохранилось немного. Несмотря на это, они сохранили свои океанические корни. Их массивные, безупречно сработанные корабли считаются одними из лучших на Пиратском побережье, а многие странные обычаи и практики, забытые по всему региону, сумели выжить на борту их судов.\n\nНавигаторов иафаранов можно встретить на самых быстроходных судах побережья; их легко узнать по традиционным татуировкам, изображающим путеводные звезды на лице и шее.#"
 
 ikanita_desc: "#size:15    Иканиты, потомки коренных дераанов и сарутанских исследователей, возникли после [Concept('dharya_varha','Дхарья Варха')|E] и изгнания тех, кто был верен Дхарьям Лон. Прославившись как искусные корабелы, они строили более крупные и тяжелые суда, чем дерааны, используя их, чтобы не пускать чужаков на богатый остров Веллатолу — а порой и для пиратства.\n\nВеликая яма Паккай Малай одарила их отличительными золотыми кольцами, которые они носят на шее, а роварсканская драконья кожа используется для изготовления толстых щитов и доспехов. Известные своей гордостью и изоляционизмом, они редко покидают свой остров, кроме как ради торговли или грабежа.#"
 
 ilahanai_desc: "#size:15    Илаханайцы традиционно жили вдоль северных берегов Тераскиятта, но с веками продвинулись дальше вглубь. Их общины тесно сплочены и сосредоточены вокруг фигур, известных как «отцы кланов». Эти мужчины избираются каждые тридцать циклов [Concept('aervalr','Эрвала')|E] и должны судить споры, обучать молодежь и координировать оборону среди своих деревень и городов при подготовке к войне. Будучи мирным и замкнутым народом, они не глухи к мольбам путешественников и предоставят кров или пищу в случае нужды (пусть и ненадолго).\n\nЕдва не уничтоженные в [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E], илаханайцы со временем лишь еще больше замкнулись в себе, веря, что весь остальной [Concept('aeras','Эрас')|E] желает им смерти. Их изоляционизм перерос в ксенофобию, и отцы кланов больше не омывают раны истекающему кровью, если не знают семьи своего пациента. Будучи когда-то тихой и скромной сельской культурой, илаханайцы полностью отгородились от мира из-за ошибочного убеждения, что их несправедливо ненавидят.#"
 
 irmionoth_desc: "#size:15    Одно из многих сьялволькских племен, ирмионоты заслужили устрашающую репутацию жестоких воинов. Они придают огромное значение концепции мести, возводя этот идеал к мифу об основании своего племени. В древние дни, когда дар [Glossary('Велоса','VELOS_GLOSS')] был в новинку, он заставил их предков поклясться, что всякий раз, когда им будет причинен вред, они обратят его на тех, кто его совершил. Предводителя тех, кто принял эту клятву, звали Ирми, и поэтому его племя стало называться Народом Ирми, или ирмионотами.\n\nСтремясь соблюдать этот договор, они начали тренироваться, становясь все более искусными в военном деле. Когда племени наносили обиду, они обрушивались на врага с беспрецедентной яростью и мстили за каждое малейшее оскорбление. Внутри племени они придерживались простого кодекса: все должно быть соразмерно. Если кого-то ловили на воровстве, от него требовали вернуть что-то равной стоимости вдобавок к украденным вещам. Кровная месть требовала от соперников сражаться насмерть, и поэтому к ней прибегали только при тяжких проступках. С их приходом в [Concept('aversaria','Аверсарию')|E] они наконец-то заставят Империю заплатить по счетам.#"
 
 iseni_desc: "#size:15    Ишенийцы — народ, коренной для южных островов Айроноя, наиболее многочисленный на торговых перекрестках, проходящих через проливы, разделяющие Опахасию и Айроной. В глубине души это гордый народ, широко известный своей экстравагантностью по всем южным морям. Знатный купец-ишениец вложит каждую монету, заработанную на предприятии, в свой дом и поместье. Даже предметы, необходимые для торговых операций, такие как корабли и стражники, украшены благородными регалиями, пропитанными символизмом для повышения престижа своего владельца. Знать ишенийцев традиционно не любит торговать «мелкими» товарами вроде железа, зерна и тканей; ценный флот знатного купца предназначен для перевозки не иначе как шелков, драгоценных камней, гобеленов, произведений искусства и любой другой мыслимой роскоши.\n\nПосле [Concept('aversaria','аверсарианского')|E] завоевания их родины ишенийцы были разорены, большинство из них силой государства или обстоятельствами были вынуждены бежать, многие сгинули на опасных окраинах Красных земель. Некоторые выжили на задворках своих родных островов, цепляясь за разрушающиеся виллы и изодранную геральдику, восстанавливая малую толику былой славы. Немногим избранным среди них удалось сохранить свое богатство в качестве купеческих семей внутри [Glossary('Аавтократии','GH_AAUTOKRATA_GLOSS')], они до сих пор славятся своим мастерством в торговле и свирепой гордостью.#"
 
 iyronisti_desc: "#size:15    Ийронисты когда-то были среди самых могущественных из многих племен, населявших Малькою; в научных кругах ведутся долгие споры о том, происходит ли название «ийроссы» от них или наоборот, или, возможно, это просто совпадение. Их изоляция в долине Терон привела к развитию у них странных обычаев, считающихся абсурдными даже по меркам ийроссов: женщинам запрещалось пить алкоголь, а определенным полам — носить определенные цвета.\n\nИх народ был почти уничтожен чередой отвратительных рабовладельцев, использовавших их в безумных экспериментах, призванных причинить как можно больше человеческих страданий. [Concept('aversaria','Имперские')|E] власти узнали о зверствах и быстро положили конец этой практике, опасаясь, что убыль населения может подорвать экономику Малькои. Те, кто пережил «Бедствие», были создателями некоторых из величайших произведений ийросской литературы, рассказывающих об ужасах, свидетелями которых они стали воочию. Говорят, что эти труды помогли дать толчок тому, что впоследствии станет восстанием рабов.#"
 
 izikalek_desc: "#size:15    Изикалекцы зарабатывают на жизнь, пася огромные стада скота на пышных лугах и у богатых рек к западу от Великой Степи. Наследники долгой истории набегов и порабощения со стороны своих сарминианских и ольтенских соседей, они тем не менее выстояли в своих обычаях, порой решая полностью покинуть свои дома и поселения и кочевать вместе со своими стадами, пока угроза не минует.\n\nМногие деревни изикалекцев сосредоточены вокруг монументального мегалита, который они называют Камнем Стада. Времена года могут приходить и уходить, здания могут сгорать и отстраиваться заново, но с каждым новым поколением все большая часть камня покрывается ритуальной резьбой, рассказывающей истории лекского народа. В те времена, когда пастбища зелены, а скота вдоволь, кочующие пастухи возвращались в свои деревни, чтобы отпраздновать летнее солнцестояние, устраивая грандиозные пиры в честь Красной Девы и испрашивая ее благословения на грядущие годы.#"
 
 jaduyada_desc: "#size:15    Джадуяданцы — это народ восточного полуострова Харадамат в [Concept('sarradon','Саррадоне')|E]. Проживая в непосредственной близости от великой [Concept('the_towers','Башни')|E] [GetBuilding('01_sophocos').GetName], их культура с большой долей вероятности была колыбелью, в которой вырос ранний [Concept('ritualism','ритуализм')|E] в далеком, забытом прошлом, и они были одними из самых стойких софокистов на протяжении всей [Concept('war_in_heaven','Войны на небесах')|E]. Исключительно сектантские по своей природе, они лишь однажды в письменной истории были объединены под одним знаменем, предпочитая вместо этого делиться на столько кланов, сколько может вообразить разум.\n\nС другой стороны, они также являются одними из самых свободомыслящих людей во всем Саррадоне, и их более консервативные соседи часто клеймят их как почти распутников. Интеллектуальное разнообразие, взращенное в этой среде, привело к богатству художественного и научного наследия, которому остальная часть континента завидовала веками.\n\nИх почти полное завоевание Святыми орденами в XII веке вскоре сопровождалось репрессиями колоссальных масштабов, и те немногие из их интеллигенции, кто остался в живых после [Concept('judges_massacre','Резни судей')|E] в 1207 году, вскоре искали убежища в соседних землях. Тлеющая ярость джадуяданцев росла с каждым десятилетием жестокого обращения со стороны агионистов, и эта культура стала заметно менее терпимой к чужакам, чем в прошлом.#"
 
 jakana_desc: "#size:15    Джаканы — восточная ветвь народа накаханов, прибывшая на Ночное побережье в [Concept('akualion_tutil','Аукалион Тутил')|E] в VII веке. Джаканы ведут свои корни от сторонников Мо'ана «Слепого», одного из трех соперничающих претендентов, появившихся во время кризиса престолонаследия, последовавшего за убийством короля Кайату «Навигатора», и самого доверенного советника монарха при жизни.\n\nБудучи одними из величайших астромантов на всем [Concept('aeras','Эрасе')|E], их знания о ночном небе практически не имеют себе равных, а их звездные знания столь обширны, что могли бы заполнить небольшую библиотеку. Стойко консервативные и изоляционистские, джаканы больше всех из накаханиев придерживались образа жизни своих предков — хотя это не означает, что их культура оставалась полностью статичной. За прошедшие века практики астрологической магии превратились из уважаемых в практически почитаемых, и они фактически скатились к магократическому правлению.#"
 
 jangkar_desc: "#size:15    Джанкары — потомки изначальной сарадарийской диаспоры в заливе Аларухм, прибывшие в этот район, когда их собратья были рассеяны. Купцы и наемники, они образовывали закрытые общины по всем городам региона, которых терпели за их ценные услуги, но так же часто делали козлами отпущения за любые недавние бедствия, постигшие местное население. Хотя они характеризовались кликами и субкультурами, столь же бесчисленными, как и города региона, за столетия они медленно сформировали рыхлую, общую идентичность и в значительной степени сопротивлялись попыткам ассимиляции.\n\nС основанием независимого государства айяров аузангебами, они постепенно мигрировали из иностранных городов, которые так неохотно принимали их присутствие в первую очередь, в гораздо более гостеприимные объятия своих соотечественников на востоке. Ныне в основном осевшие вдоль восточных регионов Лираажа, они по большей части продолжают жить в общинах, определяемых тем иностранным мегаполисом, из которого они изначально прибыли. Из-за этого трудно определить какие-либо универсально общие культурные нормы среди них — возможно, это и есть определяющая характеристика сама по себе.#"
 
 jarakmar_desc: "#size:15    Обитающие на засушливых холмах [Concept('aironoian_southeast_biozone','юго-восточного Айроноя')|E], джа'ракмары — гордый народ со множеством историй. Хвастливые, но странным образом заинтригованные чужими культурами, они, как говорят, отмечают победы на поле боя и другие значимые события грандиозным танцем летящих топоров, известным как [Concept('sevra_par','севра пар')|E], за которым следуют пышные пиры в честь павших. Мастера пересеченной местности, джа'ракмары не имеют себе равных в стремительных стычках, жестоко используя любые найденные уязвимости для проведения дерзких и разрушительных вторжений в тыл врага.#"
 
 jassi_desc: "#size:15     Потомки представителей различных культур, привезенных для работы на фабриках, коренных ийроссов и [Concept('aversaria','аверсарианских')|E] рабов-штрафников, яссы представляют собой плавильный котел разнообразных идей и систем верований. Считаясь своими сородичами недостаточно ийроссами или аверсарианцами, их обвиняли как в начале восстаний рабов, так и в их провале. Несмотря на это, у яссов возникло сильное чувство идентичности из-за их общих обид, не омраченное иллюзиями прошлого, ибо яссы тоже были рабами и никем иным, они видели убогие условия, в которых жил их народ, такими, какими они были, и желали лучшего. Отношение с презрением как со стороны угнетателей, так и со стороны угнетенных наложило свой отпечаток на молодой народ, ибо когда восстание рабов перекинулось на их плантации и фабрики, яссы не делали исключений для тех, кто причинил им зло, будь то аверсарианцы или нет. Яссы представляют собой сплав различных культур, привезенных для работы в Малькою, и, возможно, ее будущее.#"
 
 jayakayin_desc: "#size:15    Поразительно гармоничные и рассудительные в отношениях друг с другом, джаякайины являются одним из самых эгалитарных обществ Каширии. Ни одному члену общества не позволено впасть в нищету, и никто не может накапливать слишком много богатства и власти — их правители обычно избираются на больших собраниях местной общины.\n\nВнутренние войны редки среди джаякайинов, так как намеренное причинение вреда своим собратьям считается тяжким бесчестьем. Из-за этого они предпочитают изгнание казни, даже в самых оправданных обстоятельствах.\n\nОднако чужеземцы не получают ни одной из этих привилегий. Джаякайины — одни из самых безжалостных корсаров на Пиратском побережье, питающие особую склонность к рейдам за рабами и печально известные тем, что обманывают потенциальных покупателей, часто грабя, порабощая или убивая их.#"
 
 kadwana_desc: "#size:15    Кадваны — изолированный народ, живущий вдоль рощ Катуппилана в южной Каширии. В первую очередь это рыбацкое общество; их общины состоят из плавучих деревень на воде и небольших портов вдоль края рощ, выходящих в море. Из-за труднопроходимости Катуппилана и опасностей его водных путей более крупные государства региона часто либо оставляли кадван в покое, либо заключали сделки с местной знатью.\n\nИх долгая история жизни на воде сделала кадванов превосходными рыбаками и ткачами. Большинство товаров, покидающих их порты в остальную Каширию, — это морепродукты и искусно сотканные изделия. Известно, что матриархи семей записывают историю своей семьи с помощью мотков — длинных кусков пряжи, завязанных узлами и сплетенных в узоры, подробно описывающие жизнь их предков. Некоторые мотки хранились еще до [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E], хотя многие были утеряны или уничтожены в последовавших катастрофах.#"
 
 karana_desc: "#size:15    Караны из центральной Каширии славятся своей нелюбовью к наукам, вместо этого посвящая большую часть своих интеллектуальных усилий сохранению своих огромных сельскохозяйственных общин. Караны строят свои фермы как города, длинные ряды хижин и домов с множеством рабочих рук для ухода за обширными посевами, простирающимися по всему ландшафту. Путешественники не могут пройти и мили, не увидев небольших башен, усеивающих ландшафт, где местные интеллектуалы наблюдают за фермами и изучают способы повышения их эффективности.\n\nВ то время как [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E] подтвердил взгляды культуры на такие искусства, насилие, которому подверглись караны в [Concept('dharya_varha','Дхарья Варха')|E], опустошило многие общины и вынудило их мигрировать в горы Харадан. Башни, которые они когда-то строили для ученых, стали гарнизонами так же часто, как их когда-то строили, а мечи каранов никогда не бывают далеко от их плугов после насилия в их истории.#"
 
 kardwens_desc: "#size:15    Коренные жители изолированных лесов Катраддии, кардвены — культура, по-видимому, не имеющая родственников на континенте, развивалась в значительной степени нетронутой чужаками. Глубоко укоренившаяся практика охоты за головами, или [Concept('wo_ashanan','Во-Ашанан')|E], и ритуального каннибализма привела к тому, что многие народы сложили фольклор вокруг их существования и обычаев.#"
 
 karkit_desc: "#size:15    Каркиты — потомки тех немногих каранов, которые бежали на запад от своей прародины, а не на восток, оказавшись в ловушке в краю суровых холмов и диких лесов. В результате жизни на столь чуждом рубеже их родного региона, образ жизни каркитов значительно отдалился от их горных кузенов. Вместо сельскохозяйственных городов каркиты строят небольшие усадьбы с пышными садами вокруг них в качестве периметра. Одного из каждых семи мальчиков выбирают для обучения на Стража Сада, обучая как военному делу, так и садоводству. Этот страж защищает скромные садоводческие общины от их менее миролюбивых соседей, хотя одинокий защитник исторически не справлялся с чем-то более опасным, чем заблудившиеся бандиты.\n\nУсадьба каркитов обычно состоит из одного клана, образованного из семнадцати семей, между которыми уход за детьми и медицинская помощь являются общей обязанностью. Недоверчивые, но собственнические по отношению к тем, кого любят, культура каркитов строится вокруг общей борьбы на земле, которая не является их собственной. Хотя молодежь среди них часто тоскует по своему потерянному дому, который можно найти только в песнях и историях, старшие, как известно, яростно гордятся холмами, которые они приручили.#"
 
 karzarads_desc: "#size:15    Карзарадцы — таинственный народ, происходящий из земли, давно стершейся из памяти, и появившийся в исторических летописях лишь через некоторое время после [Concept('chaos_of_the_seventh_century','хаоса седьмого века')|E]. Народ с сильными устными традициями, они почитают самых плодовитых и известных своих сказителей. Их сказители говорят о чудесной земле с раскинувшимся и великолепным мегаполисом в самом сердце, городе, который, по их словам, носит имя, непроизносимое человеком. Тем не менее, они также пересказывают множество других историй, многие из которых говорят о великом тиране по имени «Стимиалтр», который был жестоким и своенравным правителем, ненавидимым карзарадцами, и о лишениях, которые они перенесли под его деспотичным правлением.\n\nНекоторые ученые мужи предполагают, что эти истории, похоже, содержат в себе зерно истины, хотя и сильно приукрашены. Интригу вокруг них лишь усиливает их традиция создавать странно сложные механизмы различных форм и видов, которые дарятся тем, кто им дорог, в знак привязанности.\n\nНесмотря на загадку, которую представляет их сомнительное происхождение, они остаются довольно обычным народом с некоторыми сохраняющимися культурными странностями.#"
 
 kawoch_desc: "#size:15    Кавочи, коренные жители Дибеды (или Внутренней) Дамоты, часто считаются самыми традиционалистскими из обитателей Дамоты. Хотя все [Concept('lodges','ложи')|E] преобладают в их обществе, именно [Concept('rayakuux_capital','Раякуукс')|E], которые даже носят то же имя, что и древние Ордена Раякуукс, являются наиболее выдающимися, и почти в каждом поселении кавочей любого размера есть местное отделение. Населяя сердце региона, кавочи издавна считались традиционными правителями Дамоты.#"
 
 kazuw_desc: "#size:15    Народ [Glossary('Казвоска','GH_KAZVOSK_GLOSS')] возводит свою родословную к старшему потомку [Glossary('Бронзового владыки','GH_BRONZE_SOVEREIGN_GLOSS')], мифологического полубога и покровителя их города-дворца. Гордые даже по сунакарским меркам, они считают себя полноправными сюзеренами «меньших» керкелойских городов-дворцов в силу своего старшинства и горят желанием исправить кажущуюся слабость своих своенравных братьев. Связанные честью и непоколебимо преданные своим соотечественникам, казувы готовы нести свои идеалы на остриях своих сарисс.#"
 
 kedari_desc: "#size:15    Скрытные до такой степени, что считаются почти мифическими, кедары легко узнаваемы по их характерным татуировкам, которые украшают их тела с головы до ног. Для них эти метки рассказывают историю о ценности и статусе человека, а те, у кого нет меток, считаются незрелыми или нечистыми. Их татуировки также играют важную роль в своеобразной магии, которую практикуют кедары, что, наряду с их в целом пугающим внешним видом, привело к тому, что соседи жестоко преследуют их из страха.#"
 
 khodomi_desc: "#size:15    Ходомы — это керкелойские поселенцы [Concept('kashirya','Каширии')|E], которые отказались от многих замкнутых обычаев своих западных кузенов в пользу более меркантильного и ксенофильского мировоззрения. Умелые моряки и опытные торговцы, ходомы давно нашли свой путь ко дворам далеких земель в качестве торговцев предметами роскоши, от [Concept('zelkavani_glassmaking','стеклянных шедевров')|E] и магического серебра до окрашенных в пурпур тканей и [Concept('durgumags','странных шелков')|E].#"
 
 khorinot_desc: "#size:15    Хориноты берут свое начало от [Concept('aironoian_migration','Ольтенского переселения')|E], прибыв в Айроной во время или сразу после [Concept('bayyuralar','Байюралара')|E], чтобы избежать удушающих рамок своей рушащейся [Concept('otachedian_empire','империи')|E]. Возглавляемые последним поколением отачедской военной аристократии, хориноты стремительно расширились на запад, подчинив себе всю [Concept('great_steppe_biozone','Айронойскую степь')|E] и быстро зарекомендовав себя как искусные воины и способные наемники далеко за пределами своих обширных владений.#"
 
 kinambrosti_desc: "#size:15    Кинамбросты когда-то называли озеро Митидон своим домом, живя в плавучих деревнях на его поверхности. Празднование их божества-покровительницы Леди Селвы было зрелищем, на которое стоило посмотреть: многочисленные поселения сливались в один город, а огромное количество лепестков, собранных с берегов озера, высыпалось в воду, окрашивая ее поверхность в мириады цветов. Конечно, эта практика прекратилась с [Concept('aversaria','аверсарианским')|E] завоеванием, хотя культ Леди Селвы был включен в ийросскую аагиократию, став одним из ее главных божеств. Озеро, которое они называли домом с начала времен, осталось в непригодном для жизни состоянии после оккупации Малькои, и те, кто выжил, нашли убежище в землях на западе. Это убежище было недолгим, так как их быстро заставили работать или продали в рабство, разрушив всякую надежду на возвращение домой.#"
 
 korlacan_desc: "#size:15    Беженцы, поклоняющиеся Богу Огня Корлаку, корлаканы — культура, глубоко переплетенная со своей верой. Обитающие в отдаленном горном хребте [Glossary('Чан Кьявкорлаку','GH_CHAN_KYAWKORLACU_GLOSS')], они великие кузнецы и еще лучшие шахтеры, что делает их процветающими, несмотря на остракизм со стороны наттананского общества. Однако это вызывает гнев их ревностных соседей, и только время покажет, выстоят ли корлаканы посреди этой враждебности.#"
 
 kunsag_desc: "#size:15    Кунсаги — оседлые потомки старых кикарсагов, которые последовали за [Concept('toragei_kikarsag','Торагей-хатиром')|E] через [Concept('great_steppe_biozone','Айронойскую степь')|E] во [Concept('the_continent','внутренние области континента')|E]. [Glossary('Бётай','GH_BOTAI_GLOSS')] занимает центральное место в культуре кунсагов, и юноши, которым не хватает [Concept('ardara','ардары')|E], подвергаются остракизму и считаются непригодными для брака. Дети достигают совершеннолетия со своим первым убийством, будь то враг, пленник или преступник, а ардара, как считается, приобретается благодаря храбрости в бою, триумфу над врагами и почитанию старых традиций.#"
 
 kuridorig_desc: "#size:15    Предки куридоригов когда-то были самыми воинственными из племен [Concept('iorne_horde','Иорнской орды')|E], которым сам [Concept('otachedian_empire','Отачед')|E] поручил стать авангардом его запланированного завоевания Айроноя. Однако безвременная смерть Отачеда положила конец этим планам, и на протяжении почти столетия они оставались единственными ольтены, пересекшими Каширият. Растущее недовольство этим фактом привело к тому, что многие вожди куридоригов воспротивились требованию Байтора о подчинении в начале [Concept('bayyuralar','Байюралара')|E], и еще больше погибло, сражаясь со своими предполагаемыми «подкреплениями».#"
 
 kutma_desc: "#size:15    Обитающие на юго-восточных окраинах Дамоты, кутмайцы издавна имеют репутацию самых могучих воинов в Дамоте. Никого не удивляет, что [Concept('waranuux_capital','Варануукс')|E] — самые распространенные из [Concept('lodges','лож')|E] среди них, причем от большинства кутмайцкв ожидается вступление в одну из них в юности, и многие остаются ее членами на всю жизнь. Кутмайцы также известны своей тщательно ритуализированной кровной местью, история некоторых из которых уходит корнями в [Concept('pre_boqqarut_damota','Добоккарутскую Дамоту')|E].#"
 
 kyawkan_desc: "#size:15    Некогда часть корлаканских еретиков, кьявканы были найдены Аунг Наингом Бесстрашным после того, как он захватил дворец Корлаку в Великом походе.\n\nУвидев в них заблудших, но все же сородичей, Аунг Наинг заново научил кьявканов учениям Богов-Близнецов и успешно восстановил их место среди наттананов.\n\nНыне обитая в горном хребте [Glossary('Чан Кьявкорлаку','GH_CHAN_KYAWKORLACU_GLOSS')], они служат ревностным оплотом против угроз с запада, защищая народ, который они вновь называют своим.#"

 lahgardi_desc: "#size:15    На протяжении столетий острова Ламан были домом для тихих и изолированных амсарских общин, чьи средства к существованию были сосредоточены на скромных рыбацких деревнях и разбросанных сельскохозяйственных угодьях. Прибытие сиралагских беженцев во время Дирхадской лихорадки в X веке принесло волну перемен. Смешение этих двух культур породило общество, известное своим мастерством, особенно сложным оружием, востребованным по всему региону, и методами кораблестроения, которые соперничают и даже превосходят лучшие работы сиралагских ремесленников.\n\nХотя торговля с чужеземцами менялась с течением времени, главный остров стал жизненно важной точкой связи как внутри, так и за пределами [Concept('amsar','Амсара')|E].#"
 
 lainar_desc: "#size:15    Лайнары обитают в юго-восточной части Каширии, и поэтому у них развилась культура, созданная для густых лесов и обширных болот. Их залы построены концентрическими кругами вокруг великих монолитов в форме местной фауны, такой как грозная гаджара. Ежедневно их знать склоняет головы перед монолитами в сумерках, и взамен, как говорят, они избавляются от самых страшных нападений. Однако, несмотря на их обычаи, ни одно существо их титанических лесов не пощадит их от зубов или когтей.\n\nДома лайнаров полны людей всех сословий, так как у них принято кормить всех, кто приходит к их столу голодным. Считается позором не развлечь уставшего путешественника или не спеть тем, кто остался без крова из-за штормов, и поэтому лайнары часто обучаются искусству танца и игре на флейте бансури, чтобы никто не покидал их залы без улыбки на лице. Такое гостеприимство, однако, также сделало их легкой мишенью для насилия в [Concept('vaarash','Ваараше')|E], где их враги маскировались под голодающих нищих, чтобы убивать лидеров лайнаров в их постелях.#"
 
 lakaloi_desc: "#size:15    Происхождение лакалойцев скрыто в песках времени, и многие школы мысли объясняют их существование на южном берегу Опахасии. По мнению одних, это креольская культура, результат экспансии яар'намов в этом районе, по мнению других, они мигрировали из Саррадона, а для некоторых они представляют собой последний оплот древней опахасийской цивилизации. Лакалойцы демонстрируют поразительную степень разнообразия, при этом фестивали и обычаи меняются от одного острова к другому. Одним из таких ритуалов является «Жар-птица», когда недавно вышедшую замуж невесту облачают в церемониальное соломенное платье и ее жених поджигает его, после чего невеста прыгает с морского утеса, чтобы потушить пламя и тем самым принести процветание в брак.#"
 
 lakoeng_desc: "#size:15    Изначально происходящее от уничижительного замечания в адрес катунов, родившихся в регионе Дахангон, долгое течение времени привело к тому, что лакунги превратились в отдельную культуру. Их близость к крупным морским торговым путям дала им склонность к бизнесу, а также зоркий глаз на получение прибыли.\n\nНесмотря на принятие многих обычаев материка и их относительное процветание, те, кто называет себя «истинными» катунами, тем не менее, смотрят на них с презрением, а политические фракции в [Concept('bureau_bronzeport','Бронзовой гавани')|E] часто разделены по этим культурным линиям.#"
 
 lattani_desc: "#size:15    Мало кто так же стоек перед лицом невзгод, как латтаны, непреклонные скотоводы [Concept('aironoian_southeast_biozone','юго-восточного Айроноя')|E]. Хранители земли, почти столь же суровой, как внушающие ужас [Concept('redlands_biozone','Красные земли')|E] на западе, эти люди сделали ее своей благодаря твердости характера, упорству и жертвам. Поселения латтанов высечены в самом фундаменте их скалистого дома, десятки и десятки жилищ вырезаны в склонах могучих пустынных каньонов.#"
 
 latti_desc: "#size:15    Латты тысячелетиями обитали в [Concept('aironoian_southeast_biozone','юго-восточном Айроное')|E], упрямо влача существование среди засушливых холмов и песчаных каньонов. Выносливый и скромный народ, их суровая родина долгое время защищала их как от завоевателей, так и от грабителей, оберегая от опасностей благодаря своей крайней удаленности и безвестности. Будучи замкнутыми, латти живут большими общинными группами тесно связанных семей, делясь едой и ресурсами между собой.#"
 
 leriseb_desc: "#size:15    Лерисебы — пожалуй, самая молодая из айярских культур, рожденная в результате постепенной экспансии государства Айяр на территории своих традиционных данников. По мере того как айяры со всего Саррадона на протяжении веков откликались на зов Шейярлы, они переселялись на земли, которые долгое время были населены канийцами, и начали постепенный процесс интеграции в новое общество.\n\nВ конце концов, когда давний данник айяров Вабхрунд был официально аннексирован Лираажем, стало ясно, что здесь действительно сформировалась новая культура, сочетающая в себе долгую литературную и лингвистическую традицию ашиталов с айярскими добродетелями доблести и славы. Интересно, что основным языком общения среди лерисебов является канийский, и даже население содержит большое количество ашиталов, принявших это новое слияние образов жизни, а не более четко очерченное большинство айяров, встречающееся дальше на востоке.\n\nЛерисебы стоят на краю многих миров, на границах между конфессиями и цивилизациями. Но они стоят вместе.#"
 
 leviden_desc: "#size:15    Более сухой климат и удаленность от коммерчески ценных речных систем означают, что левидены никогда не достигали такого же уровня процветания, как их кузены ашиталы на юге. Тем не менее, они выносливый народ и успешно обуздали Четыре Реки Кабьяра, чтобы превратить значительные части своей территории в плодородные, пригодные для земледелия земли. К сожалению, это также сделало регион мишенью для иностранной агрессии, и в 615 году  И.С. разрозненные королевства левиденов были подчинены Амсарскому Хиклахну. Хотя они далеко не рабы, народ левиденов в последующие века значительно уступил свои позиции заоранским поселенцам.\n\nКультура левиденовв, как правило, более изоляционистская и консервативная, чем у их родственников ашиталов, которых некоторые даже обвиняют в отказе от канийских обычаев и религии Элои. Деревни левиденов часто выглядят как скопления домов, образующих укрепленное поселение, как для того, чтобы подчеркнуть их клановую отделенность от внешнего мира, так и для защиты от налетчиков ран кемсарцев, спускающихся далеко вниз по высохшему руслу реки Хея.#"
 
 lihakan_desc: "#size:15    Происходя из торговых поселений между лайнарами и банвагулами, лихаканы поселились у подножия южных гор Харадан, где они из поколения в поколение добывали металлы и руды. Известные своим мастерством в обработке бронзы, они ценятся за замысловатые доспехи и пушки, которые широко используются по всему региону. Лихаканы также унаследовали гостеприимство соседних культур и развили обычай дарить бронзовые безделушки тем, кто посещает их горные пристанища.#"
 
 lorodegi_desc: "#size:15    Ревностные и прилежные, лородеги — потомки пиратского флота, который волею случая наткнулся на странные и древние руины неизвестного происхождения. Объявив эти мегалитические сооружения делом рук Десяти Легендарных Королей-Героев, они посвятили свою жизнь сохранению и поддержанию этих памятников.\n\nРассматриваемые своими сородичами-анандрасами как чудаки, лородеги редко выходят за пределы своих островов. Несмотря на это, они славятся своим мастерством каменотесов, способных в меньшем масштабе воспроизводить мегалиты, которые они почитают.#"
 
 luskos_desc: "#size:15    Лускосы — проницательные купцы и опытные караванщики, нажившие огромные состояния на содействии [Concept('kherkeloi_tin_trade','Керкелойской оловянной торговле')|E] и служащие следопытами и разведчиками [Concept('kalassyan_valley','Каласской долины')|E]. Обширные участки дикой природы разделены между семьями лускосов; каждая получает исключительные права сопровождать караваны через свою территорию, прежде чем передать их другой семье. Их плата может быть грабительской, но мудрые торговцы знают, что платить нужно сполна, иначе они могут подвергнуться случайным нападениям со стороны близлежащих уркаритских налетчиков.#"
 
 madikirib_desc: "#size:15    Мадикирибы — древняя культура, глиняные таблички на их языке датируются тысячелетиями. Их поселения, от небольших пустынных аванпостов до крупных городов, обычно содержат множество подземных ходов, а их библиотеки, в частности, представляют собой настоящие лабиринты. Каждое из этих поселений имеет долгую историю, причем одни и те же знатные семьи часто правят ими на протяжении тысячелетий.#"
 
 madugi_desc: "#size:15    Славящиеся своей замкнутостью, [Glossary('мадуги','GH_MADUGI_GLOSS')] — северные собратья мадикирибов. Яростно охраняя свои постоянно растущие библиотеки, они неустанно прячут их от глаз чужаков, и хотя ходят слухи о том, что может скрываться в этих гигантских подземных сооружениях, никто, кроме мадугов, этого никогда не узнает.#"

 maebalah_desc: "#size:15    Происходящие от вторгшихся мармаладидов, оккупировавших большую часть Рожихлат-Мары после смерти Насада Синара, маэбалахи с тех пор полностью интегрировались с племенами земли, которую они теперь называют домом.\n\nХотя они менее воинственны, чем их предки, они сохранили жестокий образ жизни, сформированный глубокой пустыней, на который, к тому же, повлияло более позднее прибытие тлакалаканов. Это привело к тому, что многие стали бояться маэбалахов, и хотя они больше не так могущественны и многочисленны, как в прошлом, мало кто до сих пор осмеливается переходить им дорогу.#"
 
 mahatha_desc: "#size:15   Общины махатхи обычно посвящают себя исключительно одному ремеслу — будь то выращивание определенной культуры, ковка определенного типа инструмента или производство определенного товара — и яростно стремятся к абсолютному совершенству в выбранном деле. В результате специализированные товары махатхов считаются одними из самых безупречных по качеству и мастерству и являются желанным товаром.\n\nТакое отношение распространяется даже на пиратство, которым они с гордостью занимаются. В частности, они заслужили репутацию «корсаров для корсаров» — нападение на мелких торговцев и рыбаков считается ниже достоинства большинства флотов махатхов, и вместо этого они ищут достойных противников, таких как другие пираты и охраняемые конвои. Особенно гротескной практикой, которой они известны, является привязывание захваченных вражеских капитанов и правителей к бортам своих кораблей живыми, при этом многие из самых успешных налетчиков махатхи с гордостью демонстрируют десятки изъеденных морем трупов по всему своему корпусу.#"

 mutsartan_desc: "#size:15    Одно из [Concept('marmaladid_great_tribes','Великих племен')|E] мармаладидов, муцартаны возводят свою родословную к одноименному Муцару, который, как говорят, был великаном огромного роста, породившим сыновей и дочерей подобного телосложения. Если это правда, то эта черта до сих пор глубоко укоренилась в муцартанах, которые по сей день известны своим высоким ростом, превосходящим большинство обычных людей. Для муцартанов это явный признак царственности, и такие люди часто вынуждены стремиться к величию из-за ожиданий своих соплеменников.\n\nСреди соседних народов Центрального Саррадона они имеют мрачную репутацию разбойников и в целом считаются еще одним непокорным горным племенем, во многом похожим на далеких барзавов.#"
 
 nattanan_desc: "#size:15    Загадочные обитатели джунглей, наттананы живут в относительной изоляции от внешнего мира. Действительно, несмотря на то, что они живут выше по течению некоторых из самых древних земледельческих цивилизаций на [Concept('aeras','Эрасе')|E], наттананы никогда не перенимали таких грубых новшеств, как оседлость, сельское хозяйство или любые другие атрибуты так называемой цивилизации. Глупцы называют их простыми варварами, но по правде говоря, неприступные стены джунглей и гор скрывают десятки удивительно развитых и древних кланов охотников-собирателей, которые потратили бесчисленные поколения, превращая свою родину в рог изобилия.\n\n Яростно гордясь своей независимостью и относительно эгалитарным образом жизни, те немногие чужаки, которые общались с наттананами, отмечали, что они, как правило, относятся к понятиям «цивилизации», которых придерживаются жители низин, с чем-то близким к жалости.#"
 
 neshalar_desc: "#size:15    Нешалары следуют строгому кредо приверженности так называемой «истинной» вере своего жречества, несмотря на то, что их вера много раз менялась на протяжении веков, никогда не отклоняясь далеко от пути их духовенства или пути их предков. Хотя их общество держалось вместе благодаря строгим культурным традициям, оно также слабело из-за веков войн и голода, вызванных их рвением и упрямством. В то время как их ученые-жрецы, никогда не отходившие далеко от местной аристократии, традиционно приносили стабильность в их дом, они также делали нешаларов слабыми в глазах их братьев забаров.\n\nЖенщины нешаларов образуют воинское сословие культуры после того, как многие теологические дискуссии запретили мужчинам военную службу по духовным причинам. Традиционно они носили в качестве доспехов большие металлические платья в форме колокола, но со временем их дизайн стал менее декоративным и более практичным. Войны с забарами — не редкость, и даже самые заблуждающиеся жрецы нешаларов не могли позволить традициям встать на пути их выживания.#"
 
 nizhbata_desc: "#size:15    Нижбаты, скотоводческий народ, коренной для северных высокогорий Каширии, в основном живут на горных фермах, где они искусно выращивают урожай на крутых склонах. Известные разведением больших стад скота, они в частности считают лошадей особым деликатесом и славятся своими сытными блюдами из конины.\n\nИскусные наездники, нижбаты могут метко стрелять из лука даже без использования стремян, а некоторые из них, как известно, путешествуют по всему Эрасу только верхом.#" 
 
 ordikin_desc: "#size:15    Известные как бандиты и повелители зверей, ордикины (или Люди-совы на их языке) выживали в основном на краю цивилизации с тех дней, когда первый [Concept('aversaria','аверсарианец')|E] еще не ступил на Земли Кланов. Известные зелеными плащами и совиными масками своих охотников и военных отрядов, постоянные набеги ордикинов и непрекращающиеся карательные экспедиции тем не менее не смогли вытеснить их с этих земель из-за их использования в качестве наемников и охотников на монстров многими местными лордами. Придерживаясь «Клятвы Пяти», ордикины знают, что они — небольшая культура, и поэтому в пределах своих земель все они совершают набеги как один клан.#"
 
 oxalanti_desc: "#size:15    Плодородные земли восточного Митидона возделывались руками оксалантов с тех пор, как кто-либо себя помнит. Хотя новые повелители приходили и уходили, а новые боги привозились из-за моря, решимость народа оксалантов никогда не была сломлена. Они все еще надеются, что однажды станут свободными, свободными работать для своего народа, а не для скусстаров или [Concept('aversaria','аверсарианцев')|E]. Сам регион славится разнообразием вин, которыми наслаждаются как аверсарианцы, так и высшие эшелоны ийросского общества.\n\nВ церемонии, на которой присутствуют по меньшей мере 12 старейшин из соседних деревень, женщина-оксалантка может стать мужчиной и наоборот. Некоторые делают это по собственной воле, но гораздо больше делают это из-за строгих гендерных ролей в ийросском обществе. Зачастую в деревне не хватает мужчин или женщин для выполнения работы, которую боги предназначили для каждого пола, и поэтому кто-то должен заполнить этот пробел. Эта практика глубоко заинтересовала аверсарианскую публику, когда была впервые задокументирована, и стала темой многих пьес и романов.#"
 
 paerusik_desc: "#size:15    Паэрусы — малоизвестный и таинственный народ, известный чужакам почти исключительно тем, что пасет [Concept('durgumags','дургумагов')|E] и производит шелковую шерсть. Чуждые богатству или материальным излишествам, паэрусы отдают приоритет функции перед формой в своей повседневной жизни, практикуя огромную бережливость во всем, кроме своих духовных поисков. Об их религиозных практиках известно очень мало, лишь небольшая горстка заезжих исследователей предоставила неполные и часто противоречивые рассказы о пауках с человеческими головами, позолоченных храмах и галлюциногенных напитках.#"
 
 paidem_desc: "#size:15    Пайдемы, коренные жители центральной Каширии, традиционно используются путешественниками как ориентир того, где пышные леса и равнины становятся сухими на подступах к горам Харадан. Как культура, контролирующая многие сухопутные торговые пути, пайдемы постепенно эволюционировали в народ, славящийся своей осмотрительностью. Караваны пайдемов часто выгружают неожиданные товары на чужих рынках и, кажется, уезжают, не купив ничего взамен. Хотя являющиеся невероятно скрытными для большинства, сделки, заключаемые их быстрыми руками, часто меняют судьбу их соседей.\n\nДевочек-пайдемов часто обучают как шпионок, докладывающих о делах своих мужей своим отцам и братьям. Такая история вызвала у чужаков нерешительность вступать в брак с семьями пайдемов, и некогда обширные земли их королевства медленно сокращались после [Concept('dharya_varha','Дхарья Варха')|E] и их неудачных попыток стравить все стороны друг с другом. Однако падение в немилость не остановило знать пайдемов; в тени они все еще работают, чтобы манипулировать торговлей Каширии к своей выгоде.#"
 
 parakh_desc: "#size:15    Парахи — коренной народ центральной Каширии, живущий в переходной зоне между великими солончаками Кашти и равниной Дармират. Их земля сурова, покрыта кустарником и искривленными баньянами, что приводит к образу жизни, основанному на природном хозяйстве, не отличающемуся от быта предков, от которых происходят народы даятемов. Хотя другие жители полуострова Кашти могут пренебрежительно называть парахов примитивными, они обладают глубокими знаниями своих земель и ревностно охраняют их от любых незваных гостей. Обильно татуированные и покрытые охряной боевой раскраской, застрельщики парахов — грозный враг на поле боя.\n\nПомимо своей воинственной репутации, парахи также сохраняют разнообразную устную культуру, с многочисленными сказаниями о великих воинах, ужасающих чудовищах и разрушительной магии. Самая любопытная из этих историй — о Дахангоне, далекой земле, которая, как говорят, находится за горами, где, как утверждают парахи, народы даятемов были созданы для служения божественному.#"
 
 aersodiaxian_islander_desc: "#size:15    Фелаксийцы, ветвь [Concept('aversaria','аверсарианской')|E] культуры, исторически были ограничены архипелагом к северо-западу от [Concept('sea_tower','Имперской башни')|E], наиболее известным как Маэройаннулион. Окруженные пиратскими культурами, жаждущими захватить их, эти острова стали местом многих ожесточенных сражений — подавляющее большинство из которых закончилось победой фелаксийцев.\n\nВ то время как почитание [Concept('living_magi','живых магов')|E] преобладает в форме, схожей со многими их имперскими кузенами, фелаксийская мудрость ценит верный и непоколебимый дух гораздо выше, чем любую грубую силу. Одержимые дисциплиной и самообладанием, [Concept('magic','магия')|E] на их островах рассматривается как бремя в той же мере, что и дар. С такими непоколебимыми ценностями они в значительной степени отгородились от большей части [Concept('the_continent','Великой Аверсарии')|E] и политиканства ее [Concept('magi','магов')|E].\n\nФелаксийцы, будучи верными и тихими, часто считались лживыми своими соседями. Хотя некоторые могли бы назвать их идеальными слугами, вопрос о том, какие слова были бы произнесены, если бы их языки не сдерживались, беспокоил многих, кто отваживался путешествовать по их островам.#"
 
 prapataro_desc: "#size:15    Неуловимые обитатели своей лесной родины, прапатаронцы скрытны и не интересуются чужаками, стремясь поддерживать как можно меньше контактов, чтобы избежать распространения чуждых идей или участия в войнах не по своей воле.\n\nЧлены племени считаются полноправными взрослыми в возрасте шестнадцати лет и должны выбрать одно из трех [Concept('great_callings','великих призваний')|E]: Мыслителя, Воина или Земледельца.#"
 
 pyanaki_desc: "#size:15    Отделившись от своих братьев улакадов после [Concept('murtuy_ka_varha','Муртуй ка Варха')|E], пянаки стремились исправить свои беды, ища ответы в холмах рядом с Хараданами. Они строили города вокруг тихих монастырей, молча ожидая ответов на беды, с которыми они сталкивались на протяжении веков, но ответов не было. Тем не менее, пянаки оставались под властью своих духовных лидеров в той же мере, что и своих королей, рассматривая мистические истины как столь же жизненно важные для своего выживания, как пищу или воду.\n\nС момента своего появления пянаки остаются экспертами в войне на холмах, избегая прямых контактов в пользу организации длинных серий засад в скрытых расщелинах своих курганов. В их обществе также развилась странная система, казалось бы, случайных жертвоприношений каждый девятый год, убивая разное количество людей по разным причинам каждый раз, когда отдается приказ. Если бы не такая практика, пянаки могли бы более полно господствовать на своей родине.#" 
 
 qahsarides_desc: "#size:15    Активные торговцы пустыни, кахсариды были коренными жителями территории, ныне известной как Айяр. Используя длинные караваны верблюдов, охраняемые обученными наемниками, торговля безопасно доставлялась с одной стороны пустыни на другую. В последнее время торговцы-кахсариды уступили место новым торговцам, более тесно связанным с Айяром и [Concept('mamuramat','Мамураматом')|E]. Однако наследие кахсаридов не было забыто. Хотя они больше не являются известными торговцами, они все еще сохраняют традицию разведения верблюдов, даже если в наше время их разводят в основном ради молока, и большинство их верблюдов редко отправляются в долгие походы через пустыню, как это делали их предки.\n\nНаряду с торговлей, они известны как надежные наемники. Изначально наемников-кахсаридов в основном нанимали для защиты торговцев, но по мере того, как регион все больше дестабилизировался, наемники-кахсариды все чаще вовлекаются в войны. Рассказы, которые эти наемники приносят домой об ужасах войн, привели к тому, что их народ решительно выступает против любого восстания на своей родине, которое могло бы вызвать подобные раздоры, что делает их твердыми лоялистами по отношению к любому государству, под властью которого они живут.#"
 
 rahikaya_desc: "#size:15    Рахикайи — прославленная культура воинов, вырезавших множество королевств вдоль извилистого русла реки Каяви. Их раскрашенные лица известны по всей Каширии, со сложными узорами, варьирующимися от простых спиралей до изображений великих битв с богами. С каждой выигранной битвой рахикайи омывают оружие своих врагов в реке в течение трех дней и ночей, а затем перековывают разбитый металл и дерево в кольца и браслеты, чтобы носить поверх своих доспехов. После поражения каждый тридцатый в армии приносит себя в жертву Картикарме, маршируя в реку.\n\nОбщество рахикайев строго иерархично, с сотней различных социальных сословий, обозначаемых цветом одежды, стилем прически и размером кинжала на бедре мужчины, среди прочего. Хотя когда-то такие различия много значили для знати рахикайев, жадность вскоре позволила покупать такие почести, навсегда разрушив любую надежду на согласованность между классами от города к городу.#"
 
 ran_kemsari_desc: "#size:15    [Glossary('Ран кемсарцы','GH_RAN_KEMSARI_GLOSS')] — это народ того, что когда-то было имперским центром Кемсара. Хотя они всегда несколько отличались от альмаджунов, две культуры разошлись сильнее всего во время их разделения во Втором Междуцарствии — по крайней мере, до Битвы Разбитой цепи. С, казалось бы, окончательным разрушением Кемсарской империи и резким снижением мобильности между двумя половинами бывшего государства, их различия стали еще более радикальными.\n\nВ период своего расцвета они были, пожалуй, одним из самых декадентских, богатых и художественно одаренных народов своего времени. Более либеральные, космополитичные и урбанизированные, чем их южные сородичи, их влияние на окружающие культуры было самым сильным из всех кемсарцев. Точно так же они были группой, которая исторически имела тенденцию перенимать большинство иностранных обычаев — хотя, конечно, они яростно отрицали этот факт. Однако сегодня они пали далеко с тех высот, на которых когда-то парили, и представляют собой воинственную племенную культуру, едва выживающую в палящей пустоши, которая когда-то была их украшенной драгоценностями империей.#"
 
 rivarisians_desc: "#size:15    Уютно устроившись между конейкменерами и шевальенцами, риварспадцы издавна зарабатывают на жизнь, пересекая каналы и реки между ними. Будучи изначально родственниками конейкменеров, они за столетия стали более похожи на [Concept('marchers','шевальенцев')|E], объединив аспекты обеих культур в уникальную смесь. Они делают сильный акцент на воде: рыбалка заменила сельское хозяйство во многих поселениях, а торговля по воде стала их основной формой взаимодействия с миром за пределами их болот. Строительство каналов в регионе приветствовалось риварспадцами, которые быстро интегрировались в торговлю по ним, выполняя роли от капитанов до докеров.\n\nИз-за своего положения между государствами риварспадцы представляют собой плавильный котел конейкменерских и шевальенских традиций, языка и верований. Их язык известен своей непонятностью, объединяя множество украденных фраз и слов в бессмысленную грамматическую структуру. Для шевальенцев риварспадцы больше конейкменеры, чем шевальенцы, и на них смотрят свысока, в то время как немногих среди конейкменеров заботит то, как говорят какие-то моряки на севере. Однако для большинства риварспадцев это не имеет значения, ибо большинство заботится мало о чем, кроме лодки под ногами и весла в руках.#"
 
 saielaian_desc: "#size:15    Давно покоренные, но так и не подчиненные окончательно, сайелаяны упрямо пестовали свою идентичность перед лицом господства Катун-Кая. Хотя они наслаждались немногими периодами независимости с момента падения королевства Шрунфан во время Великого Западного Похода в 722 И.С., каждое последующее восстание и недолговечное государство становились частью бережно хранимого культурного мифа сайелаянов — хотя ни одно из них до сих пор не просуществовало более десятилетия, прежде чем было сломлено молотом катунских репрессий. Тем не менее, их дух никогда не был по-настоящему сломлен, и их повелители стали с осторожностью относиться к ним как к беспокойным подданным.#"
 
 sakankra_desc: "#size:15    Ни одно обсуждение саканкров не обходится без упоминания Хараданов. На вершинах массивных холмов и цепляясь за склоны своих родных гор, саканкры строят массивные храмы-дворцы, которые, кажется, касаются неба. Внутри жрец и лорд восседают на равных тронах, и все решения требуют единогласного постановления обоих, чтобы вступить в силу. Раздавленные тяжестью собственной жреческой бюрократии, саканкры стали терпеливым и спокойным народом, не желающим позволять напряжениям своей системы давить на них.\n\nВеличайший кризис саканкров наступил в [Concept('chojakaan_ka_ghatada','Чоджакаан ка Гхатада')|E], когда великая горная цитадель Дихотах, древнейшая резиденция саканкрских королей, исчезла. Саканкры были ввергнуты в серию мелких гражданских войн, которые опустошили их некогда процветающую и мирную землю. В конце борьбы осталась править только одна линия древней знати, и долгие медитации на вершинах их устремленных в небо храмов навсегда связались с долгими приступами плача.#"
 
 salisians_desc: "#size:15    Жители восточного [Concept('chevalie','Шевалье')|E], сализианцы — потомки многих первых шевигадских поселенцев в этом регионе. В некотором смысле они ближе всего к древним шевигадам, жестоко изгнавших галликадов в древние времена. Получив задание охранять лишь короткую границу с [Concept('the_lichdoms','Личествами')|E], сализианцы обратились к другим занятиям. Подпитываемые инвестициями вечно враждующей церкви и знати, сализианцы начали развивать передовые ремесленные навыки, особенно в области металлообработки, а близлежащие горы служили источником материалов. За столетия практики они достигли уровня, когда их оружие превосходило все то, что производилось в Марках, закрепив за собой статус «Кузницы [Concept('chevalie','Шевалье')|E]».\n\nЭто престижное положение укоренилось в их культуре, и к ремесленникам относятся с почтением, сопоставимым с тем, что проявляют к антимагам. Детей всячески поощряют попробовать себя в ученичестве, и поэтому их довольно трудно встретить. Когда марочники идут на войну, они вооружаются сализианским оружием, а когда строят, используют сализианское стекло и камень. Возможно, они не славятся доблестью, но для Шевалье сализианцы критически важны.#"
 
 samayani_desc: "#size:15    Самаяны отделились от дераанов в начале V века, когда древнее королевство Тринапаава было разделено между двумя сыновьями Аджая «Трехпалого». Младший из братьев, Накху «Нага», создал культуру торговцев, а не налетчиков на самаянских островах. Используя быстроходные корабли, настолько маленькие, что путешественники часто их не замечают, самаяны перепрыгивают с острова на остров и продают специи и товары из городов и деревень, которые они посещают (хотя и с таким же отсутствием угрызений совести, как и их предки-пираты).\n\nНесмотря на их любовь к «честной» торговле вместо пиратства, самаянам не чуждо господство пиратских клик, живущих среди них. Медленное возвращение культуры к той, в которой доминирует пиратство, произошло после [Concept('sabar_lambay_raad','Сабар Ламбай Раад')|E], когда их кузены дерааны украли их самое священное сокровище, Паккай Падыма, из дома их короля в хаосе. Благодаря хитрым уловкам и быстрым веслам самаяны возродились как гибрид пиратов и торговцев.#"
 
 samojitian_desc: "#size:15    Когда-то в окрестностях древней [Concept('mayikrata','Майикратии')|E] не было людей. Только когда [Concept('magi','маги')|E] узнали о скрытой в ней силе, вокруг этого места и в окружающих горах выросли поселения. Но маги неохотно выполняли тяжелую работу сами, поэтому [Concept('aversaria','аверсарианцы')|E] привозили рабов, чтобы те работали на их рудниках, возделывали их поля, содержали их дома в чистоте и грели им постели. Вначале рабов загоняли до смерти, издевались над ними, использовали в ритуалах практиков, но они находились далеко от легкодоступных рабов, к которым имела доступ остальная Империя. Вскоре магами овладел декаданс, и цепи на их рабах начали ослабевать. Со временем рабам предоставляли больше автономии, они могли заводить собственные семьи (конечно, рожденные в рабстве), и внутри замкнутых рабов начали развиваться разделяющиеся культуры. Эти культуры — то, что современный аверсарианец назвал бы «туземцами». Теперь термин «самогитцы» является собирательным названием для четырех культур рабов-потомков.#"

 samorihya_desc: "#size:15    Обитающие глубоко в лесах центральной Каширии, саморихьи известны, несмотря на свою удаленность — ибо нигде больше на Эрасе не существует народа, который передвигается не просто на лошадях, а на могучих слонах.\n\nОвладев искусством выращивания и приручения этих созданий, слоны используются не только как скакуны, но и как тягловые животные, помогающие в сельском хозяйстве. Любящий показную роскошь народ, саморихьи обычно ходят увешанные золотом и драгоценностями, а их путешествующие отряды часто возвещаются громоподобной какофонией труб.#" 
 
 sarishta_desc: "#size:15    К югу от великих городов еваньев и плодородных полей йонатов народ сариштов живет в низменных поймах вдоль спокойного Стеклянного моря. Исторически угнетаемые своими чордханскими кузенами и облагаемые тяжелой данью лордами Валапуивана, многие саришты нашли спасение в море.\n\nФактически, саришты известны как лучшие кораблестроители во всем Дармирате, и прославились по всей Каширии своими молниеносными дау. Каждый клан обычно владеет несколькими дау, их треугольные паруса украшены изображениями из сариштского фольклора или символами, представляющими их родную деревню. Чтобы отпраздновать свои любимые корабли, каждое лето саришты собираются для участия в [Glossary('Джахаджи Д'Ауд','GH_JAHAAJI_DAUD_GLOSS')]. Благодаря своему морскому наследию многие саришты зарабатывают на жизнь рыболовством в родных водах, торговлей вверх и вниз по Каширияту и часто встречаются на пиратских судах по всем восточным морям.#"
 
 sarminians_desc: "#size:15    Сарминианцы — матриархальная культура, происходящая с дальней восточной окраины земель, ныне утерянных в [Concept('the_fog','Тумане')|E], где густые леса переходили в холмы и степи, а огромная империя Катун-Кай является более актуальной угрозой, чем далекая [Concept('aversaria','Аверсария')|E]. Их истории гласят, что они были западным флангом гораздо более крупной кочевой федерации, соперником и предполагаемым военным равным катунам, но когда разразилась [Concept('frodbrokna','Фродброкна')|E] и остальная часть их нации бежала на восток, сарминианцы не смогли последовать за ними, так как море [Concept('the_fog','Тумана')|E] отрезало путь.\n\nВынужденные бежать прочь от своих родных и близких, они продвинулись глубоко на запад, прежде чем встретить Имперрех. С тех пор, как они объединили силы с Сокрушителем Ведьм в обмен на обещание новых земель, сарминианцы зарекомендовали себя грозными воинами и всадницами, достаточно искусными, чтобы соперничать с кикарсагами и ванавидами.#"
 
 sarthian_desc: "#size:15    Орошаемая стоками с ледников возвышающегося хребта Хвашт, средняя долина реки Неуэльса превратилась в настоящий рай, в немалой степени благодаря усердным ирригационным работам сартийцев. Уникальный климат их родины весьма благоприятен для виноградников, и сартийцы заслужили репутацию проницательных и искусных виноделов, а их вина получили признание даже в таком далеком краю, как [Concept('chevalie','Шевалье')|E].\n\nПомимо своей славы, сартийцы в целом считаются вежливым и простым народом среди своих соседей. Это, в сочетании с приятным климатом их родины, привело к тому, что несколько Канамсаров содержали летние дворцы в этом регионе.#"
 
 saruta_desc: "#size:15    Обитающие на южном Ночном побережье, сарутаны — нация торговцев специями. На их обширных рынках торгуют травами и специями, встречающимися только на Пиратском побережье, а также знаменитой [Concept('phulikama','пхуликамой')|E]. Сарутаны приобрели известность благодаря контролю за судоходством через пролив Кайвададж, построив великие города-дозорные башни, которые взимали грабительские пошлины с проходящих торговцев. Хотя со временем эти города выросли в торговые центры, они родились как убежища принуждения, и старые сказки говорят о сарутанских пиратах, охотящихся на тех, кто избегал их портов.#"
 
 sceyfig_lighter_desc: "#size:15    Происходящие с южных берегов [Concept('lonely_light_biozone','Одинокого света')|E], скьёфиг-светцы — суровый и выносливый народ. Большинство скьёфиг-светцев на острове зарабатывают на жизнь выращиванием лука-порея и тралением туманных вод побережья. Перед каждой деревней есть причал, где женщины и дети проводят дни, плетя гигантские сети или пронзая копьями любых шипастых угрей, которые подплывают слишком близко. Для защиты деревни на каждом причале нарисован Морской дракон по всей его длине, а по бокам прикреплены десятки фонарей, чтобы направлять рыбаков домой.\n\nМножество судов на береговой линии привело к нескольким ранним обнаружениям флотов [Concept('liches','личей')|E], что привело к тому, что вторжение закончилось еще до того, как они увидели берег. Исторически скьёфиг-светцы избегали ловушек славы и власти, и как таковые рассматривают Эгиду как необходимое зло, которое следует держать на расстоянии вытянутой руки. Однако их навыки разведки на воде и их надежность во время кризиса привели к тому, что скьёфиг-светцы были объявлены Эгискипом на многих Скэльзамотках.#"
 
 seylulid_desc: "#size:15    Сейлюлиды — самые восточные из пустынных племен, которых в лучшем случае считают [Concept('marmaladid_great_tribes','бастардными племенами мармаладидов')|E], а в худшем — вообще не считают родней. Тем не менее, они заявляют о происхождении от Нишерихи и ее мужа Сейлюла, предполагаемого сына Мармала, которому маг-оракул предсказал, что он найдет и женится на легендарной принцессе Нишерихе, дочери великой родословной и древней королеве, на далеком востоке. Чтобы добраться до нее и ее племени и доказать, что он достоин, он должен был приручить гигантского пустынного змея Сумола и отправиться на восток, подчиняя каждое оседлое племя, которое он встречал, своей власти.\n\nОбычаи сейлюлидов так же жестоки, как и у их сородичей-мармаладидов, а порой и еще суровее. До сих пор они сопротивлялись попыткам обращения, в последнее время прибегая к насилию против варденитских проповедников. Они так глубоко привязаны к своему образу жизни, что все их вторжения в Кратер на протяжении веков в конечном итоге заканчивались их возвращением в пустыню.#"
 
 scusstari_desc: "#size:15    Ограниченные наименее плодородной частью бассейна Ийроссов, скусстары всегда прыгали выше головы, а их народные герои сопротивлялись [Concept('aversaria','аверсарианскому')|E] правлению еще долго после смерти [Concept('the_last_iyrossi','Потаклея, последнего царя ийроссов')|E]. Несмотря на свое скромное происхождение, скусстары возвысились отчасти благодаря своему [Concept('scusstari_guerilla_warfare','мастерскому использованию партизанской войны')|E]. Хотя другие племена могут не соглашаться, скусстары непреклонно утверждают, что они остались ближе всех к [Concept('old_iyrossi_culture','обычаям древних ийроссов')|E].#"

 shewigads_desc: "#size:15    Шевигады — предшественники современных шевальенцев, мигрировавшие в этот регион более тысячелетия назад. До своей миграции они веками существовали как группа племен, сражаясь между собой за ресурсы и старые обиды. Этому веку внутренних конфликтов положили конец этилисиады, которые завоевали и поработили их. За столетия угнетения шевигады переняли пути цивилизации у своих хозяев, начав свои метаморфозы. В конце концов они восстали против своих хозяев, хотя кто именно вел их в этом, неясно. Некоторые утверждают, что «сир Ранос», фигура, которая якобы возглавила их восстание, — не более чем сказка, в то время как другие утверждают, что Ранос был просто Бастионом.\n\nТем не менее, известно, что после их восстания Бастион объединил их и повел на запад в земли, ныне известные как [Concept('chevalie','Шевалье')|E]. Коренные галликады были завоеваны в ходе серии войн, оставив землю открытой для их заселения. За прошедшие с тех пор столетия шевигады смешались с галликадами, образовав народ современного Шевалье. Хотя никто из ныне живущих больше не может считаться шевигадом, их наследие продолжает жить в мириадах [Concept('marchers','шевальенских')|E] культур.#"
 
 siklasa_desc: "#size:15    Сикласаны зародились в холмистых ландшафтах восточного Вичачила, развив кочевую культуру, которая держалась близко к южным окраинам Хараданов. Освободив себя от всех материальных благ, сикласаны традиционно жили мирной и изолированной жизнью вдали от политики каширийской придворной культуры. Однако их долгое отделение от остальной Каширии было полностью разрушено [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E].\n\nРазорванные на части легионами нежити в [Concept('murtuy_ka_varha','Муртуй ка Варха')|E], вынужденные выбирать сторону в [Concept('vaarash','Ваараше')|E], несмотря на отсутствие реального понимания конфликта, и практически истребленные в [Concept('dharya_varha','Дхарья Варха')|E] из-за страха, что они помогали бунтующим толпам, сикласаны были вынуждены остаться на небольшом клочке того, что раньше было их древними землями. Они остаются изолированными и эгалитарными, не в силах понять, почему им должна навязываться монархия, если всё, что она приносит, — это смерть.#"
 
 siltwalker_desc: "#size:15    Илоходцы — племенные скотоводы, обитающие на Роге [Concept('sarradon','Саррадона')|E], известные своей практикой ходьбы на ходулях. Поля Рога затапливаются до такой степени, что эти длинные ходули позволяют соплеменникам с легкостью пересекать затопленную дикую местность. Говорят, что илоходцы научились этому у гигантских долгоногих крабов, которых они теперь одомашнивают и иногда почитают, чьи длинные ноги уберегают крабов от опасности поднимающихся приливов. Илоходцам удалось так долго сохранять свое мирное существование благодаря их богатым историей отношениям с соседними городами дадкавджийцев.#"
 
 simevian_desc: "#size:15    Самая малочисленная из трех канийских культур, симевианцы — кочевой народ старого Кабьяра, традиционно избегающий постоянных поселений в пользу более странствующего образа жизни. В то время как ашиталы и даже левидены склонны рассматривать своих своенравных кузенов как немногим лучших дикарей, по правде говоря, грань между оседлыми «цивилизованными» фермерами и бродячими «варварскими» пастухами, как правило, размыта на задворках сельского общества. Когда земледелие больше не является возможным, многие канийские земледельцы возвращаются к кочевничеству со своими козами и овцами, чтобы выжить. Таким образом, удивительно большое число членов симевианских кланов на самом деле отделены от своих оседлых собратьев лишь одним или двумя поколениями.\n\nОни набожный народ, и хотя их оседлые кузены могут насмехаться над их провинциальностью, они славятся своей поэзией и известны своей находчивостью. Поскольку их идентичность по большей части строится на их суровом образе жизни, а не на каком-либо географическом происхождении, принятие чужаков и даже рабов в симевианские кланы является широко распространенной практикой, и те, кто был принят таким образом, могут подняться высоко, если они амбициозны.#"
 
 sindaara_desc: "#size:15    Синдаары происходят из внутренних лесов Каширии, являясь остатками коренной культуры Ночного побережья, которая была вытеснена после прибытия накаханов в [Concept('akualion_tutil','Аукалион Тутил')|E].Как когда-то они руководили торговлей через коварные воды Пиратского побережья, также они нашли успех, проводя торговцев и путешественников через туманные леса. Однако армиям труднее найти проход через земли синдааров; синдаары с большей вероятностью будут преследовать любую угрозу своей родине.\n\nСиндаары также известны по всей Каширии [Glossary('даарапутални','GH_DAARAPUTALNI_GLOSS')], и странствующих кукловодов можно встретить по всей Каширии, распространяющих знания и мудрость в дополнение к развлечениям. Тем не менее, многие синдаары оказывались на острие клинка из-за рискованной шутки на счет правителя.#"
 
 siralagi_desc: "#size:15    Сиралаги обитают на севере Хиклахна, в центре вокруг залива Дамдама, но рассеяны по всей длинной северной береговой линии. В их обществе доминирует море, а рыба и другие продукты моря составляют большую часть традиционного рациона сиралагов. Они также известны пиратством, а корсары сиралагов заходят так далеко, как Харадамат в восточном [Concept('sarradon','Саррадоне')|E]. Их товарищи, мореплаватели-амсарцы, обычно избавлены от набегов или удержания ради выкупа каперами сиралагов, но в трудные времена бывало, что они нападали на своих же соотечественников.#"
 
 skausmas_desc: "#size:15    Самая уникальная из культур рабов, скаусмасы также были самыми измененными. Живя ближе всего к [Concept('mayikrata','Майикратии')|E] в уникальных зданиях, спроектированных для [Concept('magi','магов')|E], их тела исказились из-за близости к Академии. Хотя именно это заставило их презирать [Concept('magic','магию')|E], именно роль, для которой маги их использовали, заставила их ненавидеть своих хозяев. По мере того, как маги исследовали глубины магии, это сказывалось как на их разуме, так и на теле. Вскоре их партнеры начинали бояться и они оказывались одни в постели. Вот тут-то и появляются скаусмасы, чтобы разыгрывать любые фантазии, которые придумывали безумные умы их хозяев.\n\nВначале, когда напал Ценвар, скаусмасы были довольны тем, чтобы сидеть сложа руки и смотреть, как горит их мир. Только когда они испугались, что их хозяев заменит другой из племен варваров, они восстали.#"
 
 skoronyk_desc: "#size:15    Происходящие с самых дальних рубежей западных [Concept('shatteredisles','Островов')|E], скороники — замкнутый народ, редко встречающийся за пределами своих родных островов. Некогда переселенцы с далекого севера, столетия изоляции взрастили традиционалистскую культуру и сильный общинный дух, жизненно важный для их выживания, адаптируясь к суровым реалиям их скалистого и негостеприимного дома. Необычайная сила веры заставила многих скороников пожертвовать собой ради своей веры, оставаясь верными древним верованиям, давно забытым остальным [Concept('aeras','Эрасом')|E]. Те немногие ученые, которые готовы изучать их литературную традицию, хвалили гимны скороников за использование уникального строгого метра, Кинканет, а также за их мастерское изображение бесконечной тоски и безответной преданности.#"
 
 sunakari_desc: "#size:15    Сунакары — гордый, но миролюбивый народ, обитающий во многих изолированных городах-дворцах на берегах Стеклянного моря. Стойко независимые и придерживающиеся строгого кодекса ведения войны, они столь же разнообразны в обычаях и традициях, сколь едины в своем повсеместном ремесле работы c спеченным кварцем и использовании плотных строев сарисс. Считается, что каждое поселение сунакаров благословлено собственным святым-покровителем, и в каждом городе-дворце построены огромные храмовые комплексы, чтобы почитать их и молиться об их дальнейшей защите.#"
 
 surugin_desc: "#size:15    Потомки колонистов, покинувших Крехеджад на своих 777 кораблях. [Glossary('Суру'гины','GH_SURUGIN_GLOSS')] нашли свой новый дом среди влажных мангровых зарослей Кирата. После [Concept('aversaria','аверсарианского')|E] завоевания их родины э'хат'мские последователи были рассеяны повсюду в попытках найти новую родину, но, без сомнения, самым успешным из этих предприятий оказались, как ни удивительно, различные аванпосты, которые обосновались вдоль суровых берегов Кирата. Хотя эти изолированные поселения когда-то ограничивались берегом этого таинственного массива суши, сочетание местных знаний и метода проб и ошибок позволило суру'гинам проникнуть глубже в суровые внутренние районы Кирата, основав в процессе успешные королевства. Одним из таких нововведений стало использование «духовной кожи» — лосьона, приготовленного из сока местного дерева ксапанта, защищающего владельца от полчищ комаров, которые досаждают в густых и красочных джунглях.#"

 swabani_desc: "#size:15    Рожденные от смешения диссидентов илаханайцев в городах яданийцев, свабаны — космополитичная культура, доминирующая в художественной сфере северного Тераскиятта. Выразительная нация в своей основе, свабаны рассматривают искусство как величайшее занятие в жизни, и поэтому имеют процветающие городские центры, наполненные модой, скульптурами и музыкой, возможно, не имеющими себе равных на сотни миль вокруг. Мастеров свабанов часто можно увидеть в городах Дармирата, играющими на своих мардалах или исполняющими эзотерические пьесы у рощей Катуппилана.\n\nПоявившись в благополучные дни [Concept('taryaad_saramsaasan','Тарьяд Сарамсаасан')|E], свабаны всегда были более цероминальными, чем умелыми. Без своего барабана мастер свабанов не знает музыки; без часов практики он не знает слов трагедии, которую он исполняет каждый вечер. Когда пришел [Concept('vaarash','Ваараш')|E], свабаны не смогли выжить за пределами нескольких городов и потеряли многие из своих великих музыкальных залов в хаосе, развернувшемся вокруг них. Однако свабаны сохранили свою любовь к искусству через многие лишения, и их начинания по-прежнему пользуются уважением на большей части Каширии.#"
 
 sycharcegs_desc: "#size:15    Сихарцеги — потомки кикарсагов, служивших [Concept('aversaria','аверсарианцам')|E] наемниками и ауксилариями легионов в завоевательных войнах и при подавлении восстаний рабов. Известные своей жестокостью, [Glossary('бётаи','GH_BOTAI_GLOSS')] сихарцегов требуют предъявления человеческой головы на церемонии совершеннолетия, чтобы человек мог перейти во взрослую жизнь, а [Concept('ardara','ардара')|E] измеряется количеством вражеских голов, взятых на поле боя. Трусость пятнает всю родословную пороком, который может быть полностью очищен только тем, что сын возьмет голову своего опозоренного отца.#"
 
 tafara_desc: "#size:15    Порабощенные кемсарами в дни до песков, тафаранцы теперь зарабатывают на жизнь, грабя павшие небесные города Богов-Царей, торгуя добытой медной рудой и магическими артефактами, чтобы влачить жалкое существование в суровой пустыне.\n\nПостоянно подвергаясь опасностям, как со стороны кишащих бандитами караванных путей, так и руин, таящих древние — но все еще действующие — ловушки, тафаранцы по необходимости стали закаленными воинами. Нигде это не проявляется так ярко, как в их знаменитых Певцах Песков, воинах-жрецах, чья мощь известна по всему югу.#"

 tahanati_desc: "#size:15    Прижавшись к горам Харадан, таханаты — народ столь же суровый и непреклонный, как и их родина. Цепляясь за традиции, от которых их соседи отказались столетия назад, таханаты не заботятся о преходящей моде или новых изобретениях. Их холмы защищали их на протяжении всей их долгой и гордой истории, и они никогда не доверяли словам ни одного советника, который не дожил до своего седьмого десятка.\n\nВ результате земли таханатов никогда не разрастались сильно за пределы их родных холмов и гор. Их упрямая гордость часто отвергается как высокомерие, а их древние традиции, такие как обливание новорожденных младенцев водой со специями для изгнания злых духов, высмеиваются как архаичные. Несмотря на их трудности, как внутренние, так и внешние, древняя мудрость таханатов еще не оставлена.#"
 
 taminiai_desc: "#size:15    Обитающие среди холмов у южных Хараданов, таминайцы — народ, известный своей непоколебимой преданностью защите древней цитадели своего народа, Асмуры. Когда-то считавшиеся среди сикласанов, они были ассимилированы иностранной правящей элитой атакайского происхождения, утратив большую часть своего нежелания к более широкому взаимодействию с Каширией. В результате их кочевые традиции были направлены на войну с большим эффектом.\n\nИсторически мастера засад, таминайцы интегрировали множество долгих паломничеств к древним местам военных побед, где их независимость была обеспечена в долгие годы [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E]. На этих местах были возведены горные храмы-форты, которые наблюдают за ландшафтом, ожидая окончательного пришествия величайших апокалипсисов, которые затмят [Concept('murtuy_ka_varha','Муртуй ка Варха')|E]. [Concept('frodbrokna','Фродброкна')|E] стала для них одним из таких знаков прихода новой эры бед, и их храмы быстро снова превратили таминийцев в воинов.#"
 
 tanumarei_desc: "#size:15    Танумарейцы — искусные охотники, обитающие в северных частях солончаков Кашти и граничащих с ними равнинах. Исторически служа либо под властью торгового государства Кашти, либо холмистого королевства утанатов, они подверглись жесткой культурной ассимиляции со стороны обоих государств, что обычно приводило к крупномасштабным волнениям в регионах с преобладающим населением танумарейцев.\n\nИх культура подчеркивает охоту и важность флоры, а ученые обучаются, чтобы стать опытными травниками для лечения слабых и раненых, особенно по возвращении с охоты. Их ольтенская история проявляется в их сильной воинственной натуре, которая черпала вдохновение у легендарных воинов, таких как Отачед, и они верят, что только придерживаясь кодексов войны, установленных им много веков назад, может снова появиться такой лидер, чтобы приблизить их на шаг к свободе.#"

 tasurmad_desc: "#size:15    Тасурмады — это народ залива Сихнамия, который часто рассматривается как регион [Concept('aeras','Эраса')|E] с одной из самых длинных историй оседлой, городской цивилизации. Начиная с легендарных Сотни Городов, усеявших землю около четырех тысяч лет назад, этот район стал колыбелью не менее четырех крупных империй в течение следующих двух тысячелетий. С распадом Араккариакской империи в IV веке Д.И., местные жители постепенно попали под растущее влияние [Concept('ritualism','ритуализма')|E], что вовлекло их в растущую сферу пан-[Concept('sarradon','саррадонской')|E] культуры.\n\nБлагодаря плодородной почве и приятному климату своей родины они редко вынуждены терпеть плохой урожай, а их знать привыкла к экстравагантным демонстрациям, которые были бы уместны в Опахасии или Серекси. Однако этот декаданс не следует путать с мягкостью, так как тасурмады были более чем способны постоять за себя в бесчисленных циклах завоевательных войн и распадов в их долгой истории.#"
 
 tehaina_desc: "#size:15    Техайны — северо-западная ветвь народа накаханов, прибывшая на Ночное побережье в [Concept('akualion_tutil','Аукалион Тутил')|E] в VII веке. Техайны ведут свои корни от сторонников Ха'улили «Доброй», одной из трех соперничающих претендентов, появившихся во время кризиса престолонаследия, последовавшего за убийством короля Кайату «Навигатора», и приемной дочери монарха.\n\nНаиболее отклонившаяся из накаханийских ветвей, техайны сильно смешались с коренными жителями региона, прежде всего с лайнарами, которые, как известно, приняли поврежденный штормом флот Ха'улили под свою защиту. Как и другие накаханы, они впечатляющие мореплаватели и еще более впечатляющие ныряльщики — многие семьи техайнов зарабатывают на жизнь, прочесывая теплые, люминесцентные морские дна Ночного побережья в поисках жемчуга, кораллов и других даров моря.#"
 
 theugombrians_desc: "#size:15    У [Concept('theugombrians','теугомбрийцев')|E] нет родины. Они блуждали по внутренним областям континента с незапамятных времен, иногда пуская корни на небольших участках пустошей, чтобы заниматься земледелием или скотоводством в сильно укрепленных общинах, но чаще кочуя в огромных караванах, разбивая укрепленные лагеря на несколько недель или максимум месяцев. Их культура подчеркивает как дисциплину, так и военную подготовку для молодежи обоих полов, и летописцы и поэты часто называют их армией без страны. Действительно, они часто продают свои услуги в качестве наемников или ауксилариев любому, кто заплатит.#"
 
 thyssae_desc: "#size:15    Тиссаи — выносливый и воинственный народ, обитающий в верхней части речной долины. У них гордая история, и в значительной степени они считают себя не меньшими, чем равными своим кузенам амсарам, живущим ниже по течению. Часто служа первой линией обороны против налетчиков ран кемсарцев, они развили мощную военную традицию. Ожидается, что каждый мужчина и женщина в возрасте от тринадцати лет, которых можно освободить от полевых работ, будут обучены сражаться копьем, а многие города тиссаев сильно укреплены. Из-за этого, когда армии Амсарского Хиклахна идут на войну, их ряды часто пополняются рекрутами тиссаев. С другой стороны, эти человеские резервы также означали, что тиссаи смогли отстоять фактическую независимость от остальных амсаров не менее двух раз во время периодов крайнего кризиса для Канамсара, оба периода продлились большую часть столетия, прежде чем контроль был восстановлен.#"
 
 tlakalak_desc: "#size:15    Тлакалаканы — это остатки некогда процветающей культуры, цепляющиеся за традиции и истории своих некогда могущественных предков. После [Concept('xihuetzi','Ксихуэци')|E] они продвигались все глубже в смертоносные и таинственные джунгли Кирата, и их культура формировалась под воздействием жестоких суровых условий, царящих в этом зеленеющем аду. Хотя пять великих городов когда-то символизировали тонкое разнообразие богатой культуры, сгрудившиеся лагеря и ветхие убежища выживших стерли такие различия. Все тлакалаканы оказались в темном месте вместе, отчаянно цепляясь за умирающие воспоминания о потерянной цивилизации.\n\nОднако за столетия тлакалаканы адаптировались. Вооруженные своей древней [Concept('magic','магической')|E] традицией и знаниями оседлого общества, они приступили к задаче выживания и нашли её. Это тяжелое выживание, требующее постоянных жертв и лишений, но у них нет другого выбора. Вооруженные последней магией и воспоминаниями о [Concept('necentlal_tlaklaktli','Нецентлаль Тлакалактли')|E], а также верой своих древних храмовых орденов, тлакалаканы продолжат выживать.#"
 
 tribocicai_desc: "#size:15    [Glossary('Трибоцикайцы','GH_TRIBOCICAI_GLOSS')] заявляют о происхождении от легендарных сестер-героинь из сьялволькского мифа. Брошенные своим кланом при рождении и преследуемые до краев [Concept('aeras','Эраса')|E] жестоким и похотливым королем Оддой, они на коленях умоляли богов, прося похоронить их в почве, из которой вышло человечество. Боги исполнили их желание, и из их утроб выросли первые деревья. Трибоцикайцы утверждают, что первый из их соплеменников упал с этих деревьев как плод. Они закапывают часть своего урожая каждый год как подношение сестрам в надежде, что урожай следующего года будет еще более обильным.\n\nХотя трибоцикайцы тоскуют по своим фермам и полям прошлого, они обнаружили, что их новый дом еще более плодороден, ибо пока под их ногами есть земля, они знают, что находятся под защитой своих предков.#"
 
 trustian_desc: "#size:15    Коренные жители большей части северо-западного [Concept('chevalie','Шевалье')|E], трустианцы — это группа, от которой отделились вояжены. В то время как их кузены завоевывали чужие земли, они придерживались своего традиционного образа жизни, оставаясь в своих сельских домах. Они почти полностью фермеры, и их обширные поля обеспечивают пропитанием большую часть Марок. Их земли часто становились полями сражений, а повторяющиеся гражданские войны и вторжения [Concept('liches','личей')|E] затронули почти все места их обитания. Эти угрозы объединили их, сформировав культуру, в которой ценятся сотрудничество и общность.\n\nИх тесные внутренние связи лишь укрепили восприятие остальной части Шевалье, что трустианцы созданы для того, чтобы следовать, а не вести за собой. Хотя другие могут ценить сильное лидерство, они ищут стабильности, и поскольку остальная часть нации повторно рвёт себя на части из-за амбиций, они же продолжают свою жизнь. Хотя они населяют многие из беднейших регионов Марок, отчасти из-за войн, которые велись на ее земле, они довольны своей судьбой. Какая бы судьба ни ждала Шевалье, трустианцы будут противостоять ей вместе, как они это делали так много раз прежде.#"
 
 ualeren_desc: "#size:15    Долгое время обитая в глубоких и отдаленных пещерах, уалэрены вышли на свет после [Concept('the_decimation_of_sarradon','Халакдуна')|E], чтобы оказаться в незнакомом мире. Не имея общих характеристик или сходств с соседними племенами и отдавая предпочтение подземным просторам, которые они когда-то называли домом, они стали жить исключительно в пещерах на склонах гор. Несмотря на их крайнюю изоляцию и недоверие к чужакам, искатели приключений и воины часто искали горные пристанища уалэренов, ибо их мастерство в обработке металла не имеет себе равных на всем Эрасе.#"
 
 ukininkas_desc: "#size:15    Укининкасы были, пожалуй, самыми многочисленными из самогитцев, именно они возделывали поля и выращивали урожай, который использовался для того, чтобы их хозяева-[Concept('magi','маги')|E] оставались сытыми. Маги придумали гениальный способ выращивания сельскохозяйственных культур, поскольку земли вокруг [Concept('mayikrata','Майикраты')|E] были гористыми и бесплодными. Были построены стеклянные дома, а почва была наполнена магией, чтобы их урожай рос быстрее.\n\nБлизость их к настоящим домам магов стала тем, что сблизило укининкасов и мейстрасов. И те, и другие делились друг с другом символами и словами, которые использовали маги, и при некотором неосторожном смешении магия начала течь и по их венам. Но их рабство не закончилось до тех пор, пока Ценвар и его орды не пришли и не разбили магов, а укининкасы осознали свой шанс и восстали вместе со своими братьями, оттеснив своих бывших хозяев обратно в их [Concept('mayikrata','Академию')|E].#"
 
 ulakada_desc: "#size:15    Улакады — народ центральной Каширии, коренной для берегов реки Партеней. Они часто характеризуются своим свободомыслием и адаптивностью, и известны непостоянством в своей моде. Их дома длинные и плоские, с отличными ирригационными системами, питающими посевы их холмистой родины потоками Партенея. Можно родиться в одном из их городов и наблюдать, как вся их культура меняется несколько раз до самой смерти.\n\nОднако их быстрый ум также сделал их ненадежными друзьями, и многие союзы были заключены и разорваны улакадами, чтобы обезопасить свой дом. В результате они особенно плохо перенесли [Concept('chan_skorpokaipis','Чан Скорпокаипис')|E], не найдя помощи среди своих соседей, когда она была нужна им больше всего. Их лучшие ученые в конце концов сумели восстановить разбитые остатки их культуры, но она навсегда была омрачена их капризностью.#"
 
 uthanata_desc: "#size:15    Утанаты — коренные жители северных равнин и холмов региона, известного как Дармират. Из-за своей среды обитания они приняли более прагматичный образ жизни в борьбе и обществе, что привело к истории опытных тактиков и логистов, а также к наследию сильных лидеров, которые осуществляют более прямой контроль над своими подданными, часто через большую прозрачность своих действий и сильную правовую систему, имеющую корни в отачедских законах.\n\nХотя эти либеральные традиции иногда ошибочно принимают за признак того, что утанаты более гибки к внешним влияниям, это далеко от истины, они чрезвычайно защищают свой образ жизни. Между постоянными волнениями среди местных танумарейцев, весьма умиротворяющей природой ваксанаков и опасностью, исходящей от притока иностранных интриг через вастарнайских купцов, утанаты считают себя бастионами даятемского народа, населяющего регион, против остальной Каширии и их множества различных чуждых культур. Как таковые, они всегда энергично претендовали на земли всех даятемов, мечтая объединить разрозненные сестринские культуры и сформировать сильный культурный союз, чтобы лучше защищать земли и традиции своих предков.#"
 
 utyalid_desc: "#size:15    Гордые утялиды пользуются наибольшим уважением среди [Concept('marmaladid_great_tribes','Великих племен')|E] мармаладидов, так как все согласны с тем, что Утял была старшей или, по крайней мере, второй по старшинству среди детей Мармала. Она, безусловно, обладала великой мудростью и терпением, качествами, которые ее потомки высоко ценят и по сей день. Множество великих шаманов и оракулов мармаладидских легенд происходят из племени Утялы.\n\nКак и большинство исторически кочевых мармаладидов, их давно боялись оседлые соседи. Как воины они считаются грозными и храбрыми, их мастерство в своей пустынной родине позволяет им совершать дерзкие набеги так далеко, как Дамота.#"
 
 vanaarik_desc: "#size:15    Ванаарики — юго-западная ветвь народа накаханов, прибывшая на Ночное побережье в [Concept('akualion_tutil','Аукалион Тутил')|E] в VII веке. Ванаарики ведут свои корни от сторонников Эмалила «Морского Змея», одного из трех соперничающих претендентов, появившихся во время кризиса престолонаследия, последовавшего за убийством короля Кайату «Навигатора», и вдовы монарха.\n\nКак группа, последовавшая за королевой-воительницей в стремлении отомстить за смерть покойного короля, ванаарики вскоре оказались втянуты в десятилетия кровопролитной войны с жителями Тримбисо. Хотя тримбисанцы в конечном итоге потерпели поражение и были почти полностью уничтожены, война оставила неизгладимый след в культуре ванаариков, которая осталась воинственной и агрессивной.\n\nИскусные корсары, рыщущие по Ночному побережью и в основном действующие только после захода солнца, ванаарики в совершенстве овладели, казалось бы, невозможным искусством маскировки своих кораблей в освещенных водах, навигации по местным рифам и проведения внезапных атак на проходящие корабли.#"
 
 vargenis_desc: "#size:15    Первыми пав во время вторжения аавтократа Фанагоракса в Малькою в начале II века, варгены давно смирились с тем, что находятся под [Concept('aversaria','аверсарианским')|E] игом. Несмотря на это, они упрямо держатся за свои связанные со временем традиции, особенно за свою практику подношения даров морю. Старейшинам варгенов поручено помнить свое прошлое, и они несут ответственность за диктовку и обеспечение соблюдения старых путей и обычаев, которым всегда нужно следовать.#"
 
 vastarnai_desc: "#size:15    Вастарнайцы — умелые купцы и торговцы, происходящие с края солончаков Кашти, и они издавна извлекали выгоду из своей непосредственной близости к шумным мегаполисам восточного Айроноя. Многие вастарнайцы специализируются на ремесленных профессиях, таких как изысканная одежда, и многие из их тканей давно пользуются спросом при айронойских дворах.\n\nБлагодаря своим торговым путям вастарнайцы подверглись сильному влиянию различных языков, существующих за пределами солончаков, что породило культуру, в которой почитаются полиглоты. Кроме того, сохраняющееся влияние Отачедского права и зарождающийся бренд экономической дипломатии наделили вастарнайцев сильным наследием администрации и бюрократии, не имеющим себе равных в западной Каширии.#"
 
 vaxanaka_desc: "#size:15    Ваксанаки расположены недалеко от берегов Каширийского побережья. Как культура, часто являющаяся свидетелем различных образов жизни за пределами своих равнин, они приняли более терпимую и гостеприимную позицию, чем большинство их традиционных родичей даятемов, в первую очередь утанатов. Известные своей строгой приверженностью к уважению и смирению по отношению к иностранным конфессиям и культурам, они служат дипломатами у ольтенских лордов Каширии и даже сопровождают многих купцов вастарнийцев в Айроной для ускорения сделок и изучения различных народов и их традиций.\n\nДля ваксанаков правильная перспектива и терпимость к изучению путей других людей являются главным принципом их общества, веские основания для которого можно найти в законах, заложенных самим Отачедом, которые, как говорят, подчеркивают смешение культур, порождающие новаторские идеи и знания и ведущее к постоянному росту и развитию сообщества в целом.#"
 
 virlani_desc: "#size:15    Вирланы — исследователи, посвятившие себя поиску утраченных знаний — для них нет ничего более великого, чем обнаружение забытых реликвий или запретных свитков.\n\nНекогда выдающиеся мореплаватели, [Concept('murtuy_ka_varha','Муртуй ка Варха')|E] разрушил многие из их прибрежных городов, оставив лишь руины, занятые пиратами. Несмотря на это, вирланы по-прежнему ценят искусство приключений и покровительствуют многим великим плаваниям по морям.\n\nПриветствуя чужаков, они [Concept('virlanic_splendor','с гордостью демонстрируют')|E] иностранные артефакты почетным гостям, а распространенная пословица гласит, что любой разговор короче часа не стоит того, чтобы вести его между друзьями.#"
 
 voluntic_desc: "#size:15    Родина волунтиков — бескрайние леса [Concept('greensea','Зеленого моря')|E], где они первыми построили великие города на верхушках деревьев. Их работа усердна, отличается точностью и направлена на совершенство. [Concept('magi','Маги')|E] волунтиков не похожи ни на каких других на [Concept('aeras','Эрасе')|E], они не столько используют магию как оружие, сколько вплетают ее в сложный гобелен. Ходят истории о смертельно раненых солдатах, которые внезапно просыпались исцеленными, их раны были зашиты их собственными волосами, отсутствующие руки заменены деревом, сросшимся с их кожей, и не было никаких следов их спасителей, кроме слабого запаха сосны и земли.\n\nВолунтики — народ, сосредоточенный на овладении собой, ибо это лучший способ поддержать общину. Маги бесконечно медитируют в кронах деревьев. На веревочных мостах рабочие и воины зажигают факелы и идут процессией высоко над землей, в такт пульсу Мирового Древа.\n\nДругие партикские племена часто высмеивают их за гордость и склонность избегать тех, кто не подчиняется общему течению. Несмотря на эти заявления, их вождества структурированы очень похоже на другие партикские народы, со светским правителем, которого консультирует совет друидов. Многие друиды волунтиков отправлялись к Мировому Древу, чтобы стать членами Верховного Совета. Их маги ничуть не уступают своим партикским собратьям, а самые могущественные способны вырастить деревья из груди своих врагов. В целом, связь между народом волунтиков не имеет себе равных, и любой почитатель Мирового Древа приветствуется в их залах.#"
 
 voyagen_desc: "#size:15    Вояжены происходят из северо-западных захолустий [Concept('chevalie','Шевалье')|E]. В поисках более процветающих земель они начали плавать, захватывая как другие регионы в пределах Марок, так и колонии на далеких берегах. Со временем эти приключения и завоевания позволили этим авантюристам начать оказывать влияние на остальную часть Шевалье. Из-за их военной традиции и заморских владений Верховный король почти всегда был вояженом. Это, в свою очередь, привело к тому, что их культура все больше становилась столичной культурой знати, поскольку другие культуры Шевалье медленно дрейфуют к ней. Вояженов обчно можно встретить в качестве исследователей, солдат или в других подобных занятиях, и они являются лицом Марок для внешнего мира.\n\nТрадиция вояженов делает большой упор на личные достижения, и сотрудничество между ними может быть затруднено. Многие будут искать своей личной славы, даже когда путь более опасен. Это привело как к триумфам, так и к поражениям на протяжении всей истории Шевалье, и отчасти является причиной различных эпох военачальников, наряду с простой жадностью. Несмотря на это, вояжены с радостью сражаются с [Concept('liches','личами')|E], когда те приходят на юг, стоя плечом к плечу с остальными марочниками.#"
 
 vrodkin_desc: "#size:15    Вродкины родом из земель, где холодные и туманные леса севера переходят в жаркие и сухие кустарники. Изначально беженцы, спасавшиеся от особенно кровавого периода в истории сьялволков, они быстро добились успеха в изолированных горах юга, став одними из самых многочисленных последователей [Glossary('Велоса','VELOS_GLOSS')]. Отрезанные от остального общества сьялволков, их язык и обычаи стали чуждыми тем, кого они когда-то называли братьями, включив в свой язык тявканье, вой и свист, чтобы в полной мере использовать природную акустику своего дома. Их изоляция не длилась вечно. Прибыли мародеры грейлокинов, стремищихся захватить богатые минеральные месторождения региона для себя. Несмотря на то, что их было втрое больше, чем их повелителей, негостеприимная местность их родины и сварливая природа их кланов сделали невозможным сбросить иго грейлокинов. Их время пришло, когда по неизвестным им причинам грейлокины впали в гражданскую войну, что привело к распаду их некогда могущественного королевства.\n\nМир не продлился долго для вродкинов, и хотя многие желали вернуться к жизни своих предков, жестокие ветры [Concept('the_fog','Тумана')|E] вынудили их народ на второй исход в неведомые земли.#"
 
 walakon_desc: "#size:15    Потомки великих шамранийских налетчиков, велки когда-то были бичом Моря Империй и оказались грозными соперниками ранней [Concept('aversaria','Аверсарии')|E]. Их господству положил конец [Concept('dybolitos_sto_thallas','Диболитос сто Таллас')|E], и в последующие столетия большинство их людей было убито аверсарианцами. Те, кто выжил, населяют небольшой архипелаг негостеприимных островов к западу от Калатипсоми. Как бы они ни гордились своей историей неповиновения, резня, устроенная им аверсарианцами, — это травма, которая преследует их по сей день. На открытом месте нет ни одного поселения валаконов. Их деревни хорошо спрятаны в лесах и на холмах, а их дома суровы, в них хранится лишь то, что они могут унести. Почти все искусство валаконов было уничтожено или украдено во время Диболитоса, поэтому теперь единственное, что у них есть, — это их песни. Длинные и извилистые, они поются полушепотом под завывания ветра, и даже когда они рассказывают о подвигах великих героев, можно почувствовать колоссальность их потери в невысказанных словах.#"
 
 warisnik_desc: "#size:15    Родина варисников была местом суровой красоты, холодной землей, где великие первобытные леса встречались с обширной тундрой и степью севера. Волки ростом с человека, огромные стада мамонтов и всевозможные лохматые звери когда-то бродили по их землям. Из-за этого варисники были известны как искусные охотники, похожие на своих более примитивных кузенов кургерсков на севере. Однако, несмотря на первозданность их земель, варисники были оседлым народом, жившим в укрепленных деревянных поселениях на границах тундры. Их храбрые вожди возглавляли охотничьи экспедиции в равнины, принося всевозможные странные бивни и шкуры. В залах, украшенных костями мамонта, храбрые воины рассказывали истории об устрашающих зверях, которых они встречали. Варисники в конце концов научились приручать некоторых из этих зверей, и иногда работающий мамонт или саблезубая кошка на поводке не были чем-то необычным в лагере варисников.\n\nСегодня варисники — скорбящий народ, их лагеря полны песен и легенд о потерянном доме. Хотя они путешествовали с Ценваром и его коалицией на юг через хаос, вызванный [Concept('frodbrokna','Фродброкной')|E], многие варисники вскоре отделились от большой коалиции, и множество поселились на бесплодных равнинах Выштанки или в долинах Чёрных гор. Хотя на данный момент они в безопасности от [Concept('the_fog','Тумана')|E], их новые земли — лишь бледное отражение дома, а великие охоты прошлого теперь всего лишь воспоминание.#"
 
 watumimba_desc: "#size:15    Ватумимбы — мореходный народ, обитающий в южных пределах [Concept('pirate_coast','Пиратского побережья')|E]. Когда-то воюющие кланы на побережье, ватумимбы были изгнаны из [Concept('sarradon','Саррадона')|E] где-то в IV веке. Изгнанники выжили в [Concept('ufaliracci','Уфалираччи')|E] и за столетия развили прочные отношения с морем. Известно, что многие ватумимбы живут среди огромных флотилий, а не на суше.#"
 
 xokola_desc: "#size:15    Результат столетий правления рахикайев над космополитичными прибрежными городами, наполненными плавильным котлом аданов, вирланов, экаачи и забаров в их стенах, ксоколы — гибридный народ, не похожий ни на какой другой. Их язык легко смешивает слова из разных языков, и такой динамизм сделал их главными дипломатами центрального каширийского побережья во многих кругах. Непостоянные и очаровательные, ксоколы, как говорят, способны выиграть самые трудные споры с помощью простой улыбки и нескольких удачно подобранных слов.\n\nМода ксоколов часто высмеивается как диковинная и чужеродная, заимствуя многие стили у [Concept('sarradon','саррадонских')|E] пиратов и торговцев в пользу рахикайских узоров. Развевающиеся рукава и украшенные драгоценностями головные уборы ксоколов также принесли им прозвище «бродячие коты Каширии», использующих свою осторожную дипломатию и сообразительность для помощи организованной преступности по всему побережью. Такие предрассудки никогда не бывают далеко от ксокола, но быстрая ухмылка — это обычно все, что нужно, чтобы заблудиться в их очаровательных предложениях.#"
 
 xrahantiia_desc: "#size:15    Среди пасторальных долин долины Рохадж живут храхантии. Это яростно соревнующаяся культура, каждый клан устраивает свои дома в одном из нескольких живописных терракотовых городов, разбросанных по всей долине. В центре каждого города находится Вантаав, или «башня ученых», содержащая накопленную историю этого города и клана. Усиленный магией и надежной инженерией, каждый Вантаав стремится превзойти другие в высоте, в результате чего получается поразительный пейзаж из сверкающих башен, выступающих из густых сосновых лесов долины Рохадж.\n\nНесмотря на свою соревновательную природу между ними, храхантии известны по всему Дармирату своим общительным и добродушным отношением к чужакам. Это связано с их богатой культурой гостеприимства, устраивающей пышные пиры и фестивали, когда торговые караваны проходят через долину. Эта гостеприимная природа привлекала многих известных каширийских деятелей на протяжении многих лет, и говорят, что великий Байтор и его свита однажды проводили лето с храхантиями; накануне печально известного [Concept('bayyuralar','Байюралара')|E] так давным давно.#"
 
 yaarnami_desc: "#size:15    Коренные жители архипелага Крехеджад, яар'намы имеют давно устоявшуюся мореходную традицию, уходящую корнями в их легендарное открытие островов, которые они называют домом. Это мастерство над волнами продвинуло их через океан на уязвимые берега, а образ одетых в пурпур женщин-воительниц, вплелся в различные мифологии по всему [Concept('aeras','Эрасу')|E]. Фактически, сам процесс создания их характерного пигмента был тщательно охраняемым секретом, а его редкость делала его необходимой роскошью для любого уважающего себя правителя. История яар'намов сохранилась в различных пьесах, известных как Хара'мары, в которых танец служит важнейшим элементом сохранения, причем каждое движение имеет глубокий смысл для тех, кто обучен его читать.#"
 
 yadaniya_desc: "#size:15    В народе яданийцев доминирует их близость к Шпилю Паэрасджатана. Близость массивной [Concept('the_towers','Башни')|E] к их городам сделала их убежищем как для ученых, так и для искателей приключений, все из которых хотят разгадать тайны шпиля. Многие яданийцы также являются могущественными [Concept('magi','магами')|E], предоставляя свои навыки в качестве проводников и помощников исследовательским партиям. Культура яданийцев неотделима от влияния Шпиля, и некоторые путешественники отмечали, что самые могущественные яданийцы также кажутся самыми болезненными.\n\nХотя когда-то они владели великими библиотеками, содержащими многовековые исследования шпиля, [Concept('dharya_varha','Дхарья Варха')|E] уничтожила многие из их самых важных записей. Однако яданийцы по-прежнему полны решимости вернуть свои утраченные знания и поэтому, по-видимому, снова посвятили всю свою культуру исследованию Шпиля. Будучи одними из самых сильных магов в Каширии, ненасытная потребность яданийцев понять Шпиль сделала их народом, порабощенным исследованиями.#"

 yaknha_desc: "#size:15    Когда легионы нежити восстали в [Concept('murtuy_ka_varha','Муртуй ка Варха')|E], группа сикласанских беженцев бежала на запад к Каширийскому побережью. Там они наткнулись на город Пиралица, когда его осаждал повелителя пиратов Веллатолы.\n\nСо своими немногочисленными оставшимися воинами Гоггираджа Храбрый убил повелителя пиратов и отогнал его флот, заслужив почет и благодарность города. Его люди после этого поселились в регионе и приняли имя [Glossary('якнхи','GH_YAKNHA_GLOSS')], поклявшись прогнать любого, кто снова будет угрожать их берегам.#"
 
 yevamarai_desc: "#size:15    Йевамарайцы — это гибридная культура коренных жителей северных островов Айроноя и беглых амагейских рабов. Постоянные набеги за рабами из [Concept('aversaria','Аверсарии')|E] и Амагеи сделали их яростно недоверчивыми к любому иностранному влиянию. На многих островах есть остатки бывших тюрем, которые йевамарайцы переоборудовали в гарнизоны и наблюдательные пункты. Йевамарайцы предпочитают не сражаться напрямую, вместо этого предпочитая исчезать со своих земель как можно быстрее, не оставляя ничего, кроме смертельных ловушек.\n\nОбщество йевамарайцев исторически было очень равным, мужчины и женщины вносили свой вклад и изо всех сил пытались выжить. Лидером общества йевамарайцев обычно является Притксилкаэ, который живет на высоких деревянных башнях, возвышающихся над всем островом, и сообщает о приливах и возможных вражеских кораблях на горизонте.#"
 
 yevanya_desc: "#size:15    В устье могучей реки Каширият лежит метрополис Валапуиван, врата востока, и именно среди декадентских дворцов и жалких трущоб здесь возник народ еваньев. Происходя от плотных поселений йонатов вдоль реки, эволюция от традиционно сельскохозяйственного существования к городскому привела к аналогичной культурной эволюции. Под влиянием [Concept('aversaria','аверсарианских')|E] купцов через залив, саррадонских торговцев, предлагающих свои товары, и всевозможной торговли, протекающей через великий Каширият, диалект еваньев резко превратился в смешанно-торговый язык, почти непонятный их аграрным кузенам.\n\nВ дополнение к своему языку, еваньи отличаются своим разнообразием, поскольку в Валапуиване можно найти почти все виды одежды и обычаев. При этом еваньи часто носят показные мантии и высокомерно относятся к более сельским жителям Дармирата при въезде в свой любимый город. Хотя их часто считают высокомерными, опыт народа еваньев в навигации по политике и коммерции крупнейшего города западной Каширии привел к тому, что они стали известны как искусные администраторы и бюрократы по всему востоку.#" 
 
 yonata_desc: "#size:15    Вдоль юго-восточного берега Каширията и в низинах равнины Дармират живут йонаты. Аграрный народ, йонаты строят свои города вдоль множества ручьев и притоков, впадающих в великую реку, живя в красочных лепных домах, украшенных глубокими оранжевыми и яркими желтыми цветами. Йонаты, будучи фермерами, привязаны к временам года, и независимо от времени года их лепные деревни наполнены звуками ситара и барабанов табла, когда йонаты возвещают о приходе урожая.\n\nХотя они обычно известны как причудливый народ, их положение как житницы чордхансксх народов означает, что землевладельцы йонатов имеют большое влияние на политику Талештадендара. Они живут на одних из самых плодородных земель во всей Каширии, и до возвышения Валапуивана цари йонатов властвовали над большей частью равнины Дармират.#" 
 
 yylaxxaz_desc: "#size:15    Зизз'икс'п'никанцы исторически были простыми пастухами, живущими у побережья Амагеи. Племена бродят по холмам, следуя туда, где растет зеленая трава. Племя сосредоточено вокруг своего стада, и овцы имеют такое же право голоса в их путешествии, как и пастухи. Язык зизз'икс'п'никанцев совершенно непонятен иностранцам. Диалекты могут сильно различаться у разных людей, с совершенно разными грамматическими структурами и произношением. Странно, но немногочисленные записи десятилетней давности не отмечают никаких уникальных языков, просто называя их амагейскими пастухами.\n\nВ результате большая часть Амагеи считает их простым и отсталым народом, который несет друг другу бессмыслицу. Однако зизз'икс'п'никанцы — философски мыслящий народ, старейшины племен часто встречаются, чтобы обсудить путь, который прошел мир, куря чорт и разговаривая допоздна.#"
 
 zabari_desc: "#size:15    Забары с восточных полуостровов Каширии — это нация свободолюбивых ремесленников и хитрых торговцев в глазах большинства иностранных наблюдателей, но большинство игнорирует их истинный навык — способность осушать зловонные болота своей родины. Находясь когда-то под духовным догматизмом нешаларов, медленное расхождение северного побережья от их Суринов в VI веке позволило нарушить традицию первозданных водно-болотных угодий. Теперь, после многовекового изучения своего ремесла, забары не боятся расширять свои новые города любой ценой.\n\nГорода забаров также славятся своим разнообразным оружием: каждый мыслимый стиль меча или дубины, а также различное метательное оружие продается на их обширных рынках. Стены короткие и толстые, а воздух, хоть и зловонный, как говорят местные жители, наполнен магической энергией. Говорят, что даже самые упорные существа каширийских болот боятся неустанного экспансионизма забаров.#"

 zakhirun_desc: "#size:15    Когда [Concept('sabar_lambay_raad','Сабар Ламбай Раад')|E] принес бесконечную ночь в Харьяадад, не весь его народ искал солнце. Связанные цепями власти, богатства или любви, захируны предпочли остаться в темном городе, вечно бродя по его тусклым просторам. Со временем эти «обитатели теней» приспособились к своему мрачному дому, и, как говорят, теперь они имеют чудовищный облик, который процветает в отсутствие света.#"
 
 zelkavani_desc: "#size:15    Зелкаваны — [Concept('zelkavani_glassmaking','опытные стеклодувы')|E], коренные жители берегов метко названного Стеклянного моря. Прославившись по всему Айроною и за его пределами как искусные ремесленники и трудолюбивые мастера, сами зелкаваны предпочитают украшать себя лишь минимумом предметов роскоши — обычно это подарки или вещи, имеющие сентиментальную ценность. Как и многие другие керкелойские поселения, из-за постоянной угрозы пожаров от обширных стекольных мастерских зелкаванские города аккуратно разделены на просторные районы, перемежающиеся большими площадями, отмеченными стелами, что позволяет избежать грязи и тесноты, обычно присущих густонаселенным городским центрам.#!"
 
 zharran_desc: "#size:15    Самая малочисленная из даятемских культур, жарраны славятся своей общинностью. Обитая на юге равнин, граничащих с Каширийским морем, этот народ является искусными рыбаками и главными поставщиками рыбы и морских товаров в регионе. Благодаря этому они также стали весьма умелыми флотскими воинами и флотоводцами, которых государство Кашти охотно нанимает для защиты своей торговли. Еще одно их ценное и востребованное умение — искусное садоводство. Многих из них нанимают при королевских дворах в качестве садовников, где они разбивают роскошные сады на зависть многим.\n\nПоскольку мало тех, кто придерживается из укладов, они предпочитают следовать пацифистским традициям, нежели вести войну, которая может привести к гибели их образа жизни ради бессмысленной славы.#"

 lanonan_desc: "#size:15    Ланонаны — потомки катунов, которых в VIII веке побудили поселиться вдоль реки Цан, а также гарнизонов, занимавших этот регион для защиты интересов Катун-Кая. Вдали от катунских центральных земель, закаленные тяготами тех ранних дней, они породили в высшей степени военизированное общество, все больше отдаляющееся от своих катунских корней. Здесь от каждого, кто способен держать оружие, ожидают защиты своих земель, а военная служба служит главным путем к возвышению.\n\nСтало привычным делом видеть ланонанов в доспехах из уицзу среди регулярных армий Катун-Кая, и чаще всего — во главе авангарда.#"

 yingsa_desc: "#size:15    Инсы происходят от беженцев из самых разных народов южного [Concept('kathun','Катуна')|E], которых объединяло лишь следование той или иной форме веры Туантянь Срайдян и гонения, которые они за это терпели. Изгнанные репрессиями X века, они покинули свои дома ради отдаленных и суровых краев, где их общины выживают и по сей день. Поколения изоляции постепенно стерли многие внутренние различия, и инсов развивались по большей части обособленно от окружающих их культур.#"

 saeridian_desc: "#size:15    Серидианцы — потомки целых сайелайянских общин, насильно переселенных после [Concept('great_western_march','Великого западного похода')|E] и падения королевства Шрунфан, чтобы гнуть спину под прямым катунским надзором в северном [Glossary('Дахангоне','dahangon_lowlands_encyclopedia_desc')]. Оторванные от земли, питавшей их обычаи, и рассеянные среди своих завоевателей, последующие поколения постепенно переняли традиции своих катунских владык вместо собственных.\n\nИх сородичи так и не простили им этого, и их имя стало нарицательным для любого, кто склоняет голову перед Катун-Каем.#"

 langanafam_desc: "#size:15    Лакунги называют болотистое побережье к востоку от Бронзовой гавани Ланганафамом; это имя закрепилось и за поселенцами, обосновавшимися там в XI веке. Основанные как торговые аванпосты на негостеприимном берегу, эти поселения постепенно разрослись в процветающие города благодаря масштабным работам по осушению болот.\n\nПочти все ланганафамы живут в этих густонаселенных прибрежных городах, чьи правящие семьи черпают большую часть своего богатства из морской торговли. Их давняя традиция защиты отвоеванных у моря земель также породила прославленных лучников, которые служат как в городских гарнизонах, так и востребованными наемниками за рубежом.#"

 chenhan_desc: "#size:15    Чэньхани происходят от смешанных браков лакунгских поселенцев во внутренних районах южного Дахангона с коренными банвагулами. В то время как их катунские сородичи держались побережья, чэньхани строили свои дома глубоко в глубинке среди банвагульских деревень, и поколения такой жизни привели к тому, что они в равной степени чтят традиции обоих народов.\n\nИх восточная речь несет в себе столь сильный банвагулский акцент, что другие катуны слышат в ней лишь варварство и не отличают их от любого другого народа Дахангона. Сами же чэньхани, несмотря ни на что, считают себя катунами.#"

 #chevalies_desc: "#size:15    With the passing of time, the diverse cultures of [chevalie|E] have drifted together, forming into a unified whole. The Voyagens have had perhaps the largest impact on this unification, with their positions as rulers of the Marches having left its mark. This is not to say that the other cultures have simply been replaced. They have instead merged, bringing aspects of their own individual traditions together, creating a cosmopolitan superculture encompassing the realm. Vestiges of nearly every custom once practiced within the region can be found within it.\n\nWhat exactly defines Chevalien culture is a much-debated question, with people of the many cultures that make it up each claiming that it is defined by their particular traditions. As far as can be agreed upon, there is no individual characteristic that stands out. What makes it unique is the mixture of practices, their combination forming something completely new. The Salisian artisans have gained Carsavarian determination, the Voyagen have lit a flame within the Trustians, and the Rivarisians have woven their language into the common tongue. The legacy of the Shewigads is restored, and the people of the Marches once more stand united, in fact as well as name.#!"
 #jaravad_desc: "#size:15     "
 #musar_desc: "#size:15     "
 #shewigad_desc: "#size:15     "


 #### PARTIC 1298 CULTURES ####
 laodantines_desc: "#size:15    Когда бригандинцы бежали из [Concept('greensea','Зеленого моря')|E], именно древние леса Калатипсоми наконец заставили их почувствовать себя не такими уж изгнанниками. Там они нашли чащи, за которыми уже ухаживали шаманы, веками проливавшие кровь за свои деревья в битвах против [Concept('aversaria','аверсарианских')|E] топоров, и которые узнали в друидах и переплетенных корнями деревнях новоприбывших родственную преданность. Из этого союза выросло нечто новое.\n\nЛаодантины, появившиеся из этого единения, остаются узнаваемыми детьми бригандинцев, но мрачность их предков была выжжена пламенем убежденности.#"
 
 muintuir_desc: "#size:15    Именно друиды провели этих людей через воды. Даже в глубинах [Concept('greensea','Зеленого моря')|E] аутеонские мудрецы почувствовали это, и с падением [Concept('aversaria','Аверсарии')|E], Имперские острова оказались открыты. Те аутеоны, что откликнулись, стали мунтирами, «семьей переправы», и они заселили не пустую дикую природу, а кости империи: разрушенные форумы, обезглавленные статуи и улицы, откуда величайшая держава [Concept('aeras','Эраса')|E] когда-то правила миром.\n\nМунтиры оказались странными и мягкими завоевателями этих руин. Там, где их предки проращивали траву из голого камня, [Concept('magi','маги')|E] теперь взращивают сады сквозь разбитый мрамор, а фруктовые сады стоят на старых плацах. Какую бы тайну ни хранили Башенные острова, их друиды терпеливо изучают ее, уверенные, что они были призваны сюда не просто так.#"
 
 #### SJALVOLKI 1298 CULTURES ####
 
 svotsadi_desc: "#size:15    Из всех кланов, что шли на юг под знаменами Имперреха, мало кто так же жадно принял свою землю обетованную, как те, что осели вдоль Патоса. Долгое время привыкшие хвастаться своей старой родиной, на Патосе те, кому суждено было стать свотсадами, нашли более богатую почву, мягкие зимы и соседей-хуэгодоков. За одно поколение новоприбывшие начали вступать в браки с жителями хуэгодокских речных городов, и дети от таких союзов, которых когда-то высмеивали как ублюдков двух миров, стали столь многочисленны, что теперь свотсады считают их своими любимцами.\n\nСвотсады остаются сьялволками до мозга костей: их скальды все еще поют старые саги, а их мертвых предков чтят у каждого очага, но дух воина смягчился, став чем-то общинным и спокойным. Их деревни стоят наполовину в поле, наполовину в лесу, и они не видят в этом никакого противоречия. Пусть другие кланы насмехаются, что свотсады разжирели и стали ручными, те отвечают, что щедротами богов всегда следовало наслаждаться.#"
 
 leskovych_desc: "#size:15    Ирмионоты несли свою клятву мести в [Concept('aversaria','Аверсарию')|E] подобно обнаженному клинку, но на Роге этот клинок нашел свой точильный камень. Оседая в суровых краях, издавна обжитых кланами ордикинов, новоприбывшие ждали войны с людьми в совиных масках и получили ее, пока обе стороны не разглядели друг в друге нечто знакомое. Под влиянием марочникских купцов клятвы ордикинов и древние договоры ирмионотов оказались родственными кодексами, и из их сплетения возникли лесковичи.\n\nЖизнь в Вестхолде сделала их кем-то большим, нежели просто мстителями. Лесковичи стали прославленными кузнецами, кующими оружие, которого требуют их распри, а их укрепленные частоколами твердыни считаются одними из самых крепких в регионе. И сыновья, и дочери обучаются ратному делу, а их соседи усвоили арифметику ведения дел с ними: все, что будет отнято у лесковичей, будет возвращено с платой железом.#"
 
 kaskader_desc: "#size:15    Когда сьялволки пришли в Калатипсоми, многие искали долины и пастбища, подобные тем, что они потеряли. Однако одна ветвь оказалась расквартированной в Бастонпорте и других городах Грезящих холмов и вокруг них, и вопреки всем ожиданиям своих сородичей, они остались. Их горная речь теперь эхом разносится по причалам и счетным домам, а кланы, которыми когда-то невозможно было управлять, стали бюргерами, членами гильдий и начальниками портов, которые яростно гордятся тем, что их приемные города сыты, вымощены и платежеспособны.\n\nИх преданность принадлежит их городу и его кварталам, а не какому-то трону, который претендует на него. Они работают так же упрямо, как охотились их предки, и они занялись морской торговлей с рвением, которое удивляет всех, кроме них самих. Старым кланам они кажутся безнадежно изменившимися. Каскадэры ответят из-за крепких стен и полных складов, что они просто нашли нечто большее.#"
 
 itnicavingi_desc: "#size:15    Битва у Элизийском перевала сломила армии [Concept('aversaria','Аверсарии')|E] и открыла юг для Имперреха — и когда огромное войско двинулось дальше, некоторые остались среди могил. Военные разведчики барков, которые вели коалицию через горы, поселились в сельской местности в последующие годы; к ним присоединились освобожденные рабы и заблудшие семьи из дюжины других народов, которым некуда было идти дальше. Из этого сурового смешения возникли итникавинги.\n\nОни — стоический народ, как и подобает людям, возделывающим забытые поля сражений. Их земли находятся в общем владении по старым обычаям, их охотники пускают соколов вдоль скал, и они бесконечно ссорятся между собой в манере соседей, которые не доверяют никому другому делать это.#"
 
 radivolki_desc: "#size:15    Ни один трофей переселений не сиял так, как Орисполь, и именно кланы даукенов и сиемансийцев заявили права на земли вокруг великих мегаполисов старых Имперских центральных земель. Не отличаясь скромностью, поселенцы взяли себе имя под стать новому дому и назвались радиволками, словно престол мира просто ждал новых жильцов. Городская жизнь странным образом сплавила их родительские корни: утонченные стихи даукенов и громоподобные кровавые саги сиемансийцев теперь делят одни и те же дворы, читаемые скальдами, которые научились льстить так же искусно, как и хвастаться.\n\nГорода произвели еще более глубокие изменения. Раньше любого другого сьялволькского народа радиволки начали посещать обряды, привлеченные церемониями, более грандиозными, чем любое подношение на вершине холма.#"
 
 pactlander_desc: "#size:15    Ни один клан не хотел жить в грязи. Земли дельты, где северная Малькоя переходит в южный Калатипсоми, обходили стороной все сильные народы переселения, и потому они достались слабым: земледельцам-трибоцикайцам, жаждущим любой почвы, освобожденным мондеррнам, ищущим покоя, и разрозненным остаткам дюжины других разбитых кланов. То, что ни один народ не смог бы пережить в одиночку, они выдержали вместе — пакт за пактом, дамба за дамбой, стадо за объединным стадом.#!"
 
 southlander_desc: "#size:15    Адракампы были купцами еще до того, как стали изгнанниками, и когда их кочующие рынки достигли южной Опакасии, они взглянули на красоту [Concept('aversaria','Расколотого побережья')|E] и просто остановились. Объединившись с уставшими от дорог кланами вродкинов, они с воодушевлением приняли опакасийский уклад жизни, и так на свет появились сонтрвенты — народ, который их северные родичи (и не без оснований) описывают как надменный, яркий и совершенно неспособный держать язык за зубами.#!"
 
 northlander_desc: "#size:15    Грейлокины пришли на юг, все еще помня, что когда-то они были великими королями. Поселившись на берегах Парфийского моря бок о бок с фенвирами, несостоявшиеся владыки обнаружили разоренную, полупустую землю, которой не было дела до былой славы, и медленно, нехотя, они полюбили ее. Появившиеся в итоге цивереки — народ глубоко духовный, видящий руку Прохена как в своем падении, так и во втором шансе: бог судьбы оборвал их старую нить, говорят они, дабы у этого моря можно было сплести новую, куда более крепкую.#!"
 
 eastlander_desc: "#size:15    Кормаг пытался. Старый вождь, приведший кланы фенвиров в западный Айроной, проповедовал старые обычаи у каждого костра: охоту, скромную жизнь, простое почитание старых богов. Его люди кивали — и поступали по-своему. Западный Айроной был краем враждующих лордов, осколков империи и звонкой монеты для любого клинка, и жажда фенвиров до славы и добычи нашла здесь пищу куда более сытную, чем в любом набеге с гор. Свободно смешиваясь с имперскими народами, среди которых они сражались (порой по обе стороны в одной и той же войне), они превратились в остволков — наименее сьялволькских из всех сьялволков, и ничуть этого не стыдящихся.\n\nВойны семидесятых и восьмидесятых годов окончательно выковали их характер. Остволки — оппортунисты, гордящиеся своим ремеслом. Амбициозные, хвастливые, они быстро нанимаются на службу и еще быстрее пересматривают условия договора. Из старых обычаев у них в неприкосновенности сохранился лишь боевой клич [Glossary('Велоса','VELOS_GLOSS')].#!"
 
 sernvryki_desc: "#size:15    Когда кланы варисников откололись от великой коалиции, те, кто повернул к холодным равнинам Выштанки, прослыли самыми упрямыми из упрямого народа, и с тех пор они носят это суждение как корону. Сернврыки нашли в продуваемых ветрами равнинах тень своей утерянной тундровой родины, и вместо того, чтобы оплакивать это сходство, они приняли его. В то время как другие кланы изнежились на завоеванном юге, сернврыки придерживаются старых обычаев с нарочитой суровостью: каждый сезон они выезжают на великую охоту, мальчиков закаляют к зиме так же, как их дедов, а в лагере сернврыков не держат никакой роскоши, которую нельзя было бы увезти на санях.#!"
 
 medrevi_desc: "#size:15    Кургерсков презирали как дикарей даже их собственные родичи. Безземельный народ костяных орудий и оленьих упряжек, так что мало кто из кланов возразил, когда их число откочевало в дремучие леса Калатипсоми, где жители Земель Кланов все еще хранили память о Сердцелесье. Два народа потянулись друг к другу так, как могут только дважды отвергнутые, и их смешанные потомки, медревы, выстроили жизнь, которая подходит им обоим: достаточно оседлую для городов и трактирных баек, но достаточно дикую, чтобы ни один сборщик податей еще не вернулся из лесу с хорошими вестями.\n\nМедревы похожи на миролюбивых свотсадов своими лесными усадьбами — и больше ничем. Сила остается их первой добродетелью, а набеги — излюбленным ее доказательством; споры между соплеменниками решаются в поединке при свидетелях, как и задумывали боги. Вокруг их костров охотничьи предания и устные летописи сплелись в единую традицию сказительства, которую чужаки слышат редко, но не забывают никогда.#!"
 
 drogvingi_desc: "#size:15    Не каждый клан, осевший на богатом юге, согласился с тем, что все старые обычаи следует оставить позади вместе со старыми землями. Дрогвинги смотрели, как их кузены радиволки перенимают новые манеры, и повернули совершенно в другую сторону. Среди дрогвингов холмволькская речь сохраняется в полной мере, обряды предков соблюдаются добуквенно, а честь семьи учитывается так же тщательно, как и ее урожай; нарушить клятву — значит умереть для них, сколько бы тело ни ходило по земле после этого.\n\nОни не мягкий народ, но на них можно положиться.#!"
 
 opakasijan_desc: "#size:15    [Concept('marchers','Марочникские')|E] искатели приключений, охотившиеся за наживой в рушащейся империи, высадились близ Тинитиды и обнаружили боевые отряды сьялволков, прощупывающие то же самое побережье. После периода поучительного кровопролития два народа пришли к выводу, что им выгоднее быть союзниками. Опакасияны, выросшие из этого союза, с гордостью именуют себя первыми поселенцами запада и заносят это отличие над более поздними прибывшими, словно обнаженный меч.\n\nОба наследия сильны в них. Опакасиянский закон предельно точен в вопросах возмещения ущерба: за каждую обиду платят той же монетой, каждый долг взыскивается, а их барды ведут скрупулезный учет и того, и другого. Они пришли как чужаки с двух сторон и сделали побережье своим; они не видят причин, по которым что-либо на нем должно происходить без их дозволения.#!"
 
 derescicai_desc: "#size:15    Дерещикайцы поклялись, что мир снова будет трепетать перед их парусами, и на побережье Малькои эта клятва исполняется: фермерские жены трибоцикайцев растят моряков. Два народа поселились бок о бок в годы после падения — морские налетчики, лишившиеся флота, и землепоклонники, получившие новую почву, — и браки между ними стали заключаться быстрее, чем того хотелось бы старейшинам обеих сторон. Их дети, дерещикайцы, сеют поутру и выходят в море пополудни, закапывая долю каждого урожая в дар сестрам-героиням, в то время как кораблестроительное ремесло их вторых дедов и бабок вновь возрождается в каждой бухте.#!"

 dalinscyki_desc: "#size:15    Карзарадцы маршировали так же, как и на протяжении всей своей истории: вежливо и таинственно. Те, кто осел в [Glossary('Кепиранской котловине','sulzegg_basin_encyclopedia_desc')], сделали это бок о бок с кланами сиемансийцев, с которыми сдружились во время пути на юг, и эта долгая дружба наложила свой отпечаток. Далинсчики все так же мастерят свои замысловатые маленькие механизмы, но истории, которые теперь предпочитают их барды, обросли зубами. Кровавые саги сиемансийцев делят костер со старыми преданиями о Стимиалтре и непроизносимом городе, и стихи далинсчиков сегодня так же охотно воспевают хруст ломающегося позвоночника, как и вращение шестеренки.#"

 hunigson_desc: "#size:15    Хуэгодоки, последовавшие за Имперрехом, ожидали речных пошлин и рыночных городов всюду, где бы они ни высадились; те, кто осел в лесах Калатипсоми, не нашли ни того, ни другого, и вместо этого стали чем-то более странным. Здешний лес гудит от скрытой [Concept('magic','магии')|E], которую практичные хуэги впервые заметили по своим пчелам: их ульи среди старых деревьев давали мед невероятной силы. Из этих первых пасек выросли хунигсоны — Народ Меда — люди, которых их беззаботные кузены едва ли могут узнать: суровые, точные и тихо уверенные в том, что им доверили нечто такое, что остальной мир попросту растратил бы впустую.\n\nЖизнь хунигсонов упорядочена до степени, поразительной среди народов-переселенцев. Каждый улей, роща и кузня занесены в реестры, каждый лесной урожай выверяется по тщательным гроссбухам, ибо они усвоили, что дары леса карают за жадность. Их кузнецы закаляют металл на углях, пропитанных медом, и он впитывает чары так же легко, как воск принимает печать; клинки и колокола хунигсонов уже продаются далеко за пределами Калатипсоми — хотя и никогда в количествах, не одобренных стражами. И сыновья, и дочери несут дозор на частоколах, а с предками советуются по всем важным делам. Старая хуэгская теплота все еще живет глубоко внутри, проявляясь в полных гостевых столах и любимых побочных линиях; она просто научилась дисциплине, как в конечном итоге должно научиться всё среди хунигсонов.#!"

# Was removed during culture jinja

 mahratian_desc: "#size:15    Махратианцы — самая восточная группа, подпавшая под власть Амагеи, и самая далекая от ее хватки, однако их культура не так уж сильно отличается от их западных надзирателей. Их мода, язык и кухня — зеркальное отражение амагейских, а их неприязнь к [Concept('magi','магам')|E], как часто говорят, проистекает исключительно из древних амагейских сказаний. Их сходство часто располагало к ним амагейскую знать, и махратианцы традиционно управляли собой более свободно, чем другие провинции под властью Амагеи, в обмен на тяжелые подати людьми для службы телохранителями и разведчиками.\n\nОднако махратианцы не забыли о своем происхождении как народа, возникшего в [Concept('aironoian_migration','Айронойском переселении')|E]. В войну и в мирное время они проводят жизнь в седле, скача по равнинам своего нового дома. Их язык заимствует множество слов у изначальных последователей [Concept('toragei_mahratian','Торагей-хатана')|E], и известно, что их люди до сих пор носят маски как часть своей культуры, несмотря на то, что давно отошли от многих других ольтенских обычаев. Для них человек без коня — ничто, и даже горы Харадан за их спинами не смогли стереть подобное мышление.#"
 
 marakje_desc: "#size:15    Истоки народа маракьешев лежат через несколько лет после [Concept('death_of_holkkarak_and_the_end_of_the_murtuy_ka_varha','смерти Холккарака и окончания Муртуй ка Варха')|E]. Прославленный воин Яваси Вишвасавра и его последователи были изгнаны со своей родины после того, как он заявил, что вина лежала не на ученых, а на каширийском народе, что пренебрег подготовкой к ясно надвигающейся угрозы нежити. Его многочисленные воззвания о природе [Concept('murtuy_ka_varha','Муртуй ка Варха')|E], а также его кодекс чести и личная философия легли в основу культуры маракьешев.\n\nМаракьеши придают огромное значение надлежащему избавлению от мертвых тел, а также тактике боя против орд нежити. Выдающиеся вишвасавракские стражи защищают своего сюзерена от угроз как живых, так и мертвых, и от них ожидается, что они возьмут власть в свои руки в уязвимые для государства времена. Хотя ученые к ним благосклонны, воинственная защита маракьешами [Concept('vidvaookeyatran_scholarly_caste','видваукеятранского ученого сословия')|E] привела к разладу с простым людом Каширии."
 
 mastikigni_desc: "#size:15    Мастикигны отточили понятие воина до остроты лезвия ножа. После короткой ночи празднеств, когда мальчиков обручают, семьи обмениваются дарами и выпивается много меда, целое поколение юношей клана изгоняется из общества. Вынужденные постоять за себя или работать вместе ради выживания, неоперившиеся мастикигны не могут вернуться в места своего рождения, пока не пройдут три испытания, которые они приписывают [Glossary('Велосу','VELOS_GLOSS')] в одном из своих главных мифов. Будущие воины должны вернуться домой с крылом орла, зубом медведя и хвостом волка. Тем, кто не может этого сделать, запрещается когда-либо снова говорить или видеться со своими соплеменниками; сделать это — значит нарушить священную клятву, которую каждый мальчик дает перед своим путешествием. Многие из тех, кто терпит неудачу в этом испытании, решают основать свой собственный клан в надежде, что их потомки завершат то, что не смогли они. Для тех же, кто проявляет должную храбрость, хитрость и силу, вступление в, пожалуй, величайшую воинскую культуру на [Concept('aeras','Эрасе')|E] сопровождается бурным весельем.#"
 
 meistras_desc: "#size:15    Мейстрасы были домашней прислугой у [Concept('magi','магов')|E]. Постоянное пребывание в домах в качестве слуг ставило их в уникальное положение. Они могли свободно передвигаться и в основном были предоставлены сами себе своими хозяевами. Высокомерие магов и их аура превосходства приводили к тому, что они не смотрели дважды на рабов и их повседневные заботы. Именно это безразличное отношение позволило мейстрасам стать первой из рабских каст, в чьих жилах потекла кровь магов, и первыми, кто начал изучать слова силы. Им разрешалось заводить семьи, и они могли выдать ребенка за ребенка своего мужа, хотя на самом деле это было не так.\n\nВторжение Ценвара позволило мейстрасам перехватить инициативу и атаковать изнутри, вырезая мужчин, женщин и детей еще до того, как те успели полностью осознать, что происходит. До Ценвара восстание было не более чем несбыточной мечтой, но теперь свобода стала весьма реальной перспективой.#"
 
 mineris_desc: "#size:15    Самая покорная из рабских каст, с самой короткой продолжительностью жизни, минерисы проживали большую часть своих дней во тьме. В основном сосланные на север, где таились минеральные богатства, они вели простую жизнь. Столетия жизни при тусклом свете привели к тому, что их кожа из поколения в поколение становилась заметно белее. Они постоянно копают и создают новые помещения, туннели и шахты для своих хозяев-[Concept('magi','магов')|E]. В то время как обычные государства продавали бы свои минеральные богатства и использовали бы их для оружия или доспехов, маги предпочитали использовать их для проведения экзотических ритуалов трансмутации. Лишь когда они увидели клубящийся дым и оправились от шока, они захватили север. Поскольку страх был главным фактором, державшим минерисов в узде, а маги в основном бежали, чтобы защитить [Concept('mayikrata','Академию')|E], захват севера прошел почти бескровно.#"
 
 mirzana_jahar_desc: "#size:15    Поскольку айяры веками были безземельным, бродячим народом в [Concept('sarradon','Саррадоне')|E], неудивительно, что некоторые из их более беспринципных хозяев имели склонность пытаться подчинить их. Сосредоточенные в Кехенемхате и Ухташе, те, кто впоследствии станет известен как мирзана-джахары, подвергались бесконечным гонениям со стороны обеих фракций Войны на небесах, их постоянно предавали и подавляли из-за паранойи по поводу их тайной преданности другой стороне. Когда Шейярла провозгласила свое айярское государство в 716 году, мирзаны были одними из первых, кто действительно массово покинул эти земли, совершая тяжелые путешествия почти через весь Саррадон, чтобы достичь нового дома.\n\nМирзана-джахары, пожалуй, преданы единству со своими братскими культурами даже больше, чем аузангебы. Их долгие мытарства в качестве козлов отпущения выковали тесные узы внутри их общины, которые сохраняются и по сей день, и хотя они могут быть более чем готовы закрыть глаза на разногласия со своими собратьями-сарадарами, то же самое не относится к чужакам, хотя отдельный человек все еще может доказать, что достоин стать членом их общества.#"
 
 mithaista_desc: "#size:15    Митайсты — традиционные владыки горного королевства Хайратан, и они считаются самыми благородными из всех аэвакоров. Конечно, любой «младший» аэвакор сказал бы иначе, утверждая, что митайсты — отчужденный и надменный народ, впавший в маразм в своих высокогорных цитаделях и грезящий о давно минувшей славе. В этом есть доля правды, поскольку митайсты — искусные летописцы, и они известны по всему Хайратану своими редкими книгами и забытыми знаниями.\n\nВ дополнение к своим ученым занятиям, митайсты хорошо приспособлены к жизни в горах, так как их традиционная порода лошадей, церутка, по поведению ближе к горному козлу. Низкорослые и коренастые, эти проворные скакуны переносят митайстов от вершины к вершине и являются востребованными вьючными животными для горцев по всему [Concept('aeras','Эрасу')|E]. Архетипичный отряд митайстов, пересекающий горы на церутку и перевозящий свои драгоценные фолианты и свитки — классическое зрелище по всему центральному Хайратану.#"  
 
 mondecny_desc: "#size:15    В значительной степени миролюбивый и изоляционистский народ, мондеррны с незапамятных времен обитали в восточной части того, что ныне известно как [Concept('foglands','Туманные земли')|E]. Хотя они долгое время были защищены от агрессии горами хребта Кродгенн и уникально густыми лесами своей родины, эти естественные преграды оказались недостаточными с прибытием воинственных [Concept('aversaria','аверсарианцев')|E], которые увидели в мондеррнах бесценный ресурс — популяцию рабов, маловероятно склонных к восстанию. Так началась самая темная эпоха в их истории.\n\nТак случилось, что когда коалиция Ценвара сломала хребет аверсарианскому сопротивлению, большинство мондеррнов попало в Имперрех не из своих традиционных родных земель, а с огромных рабских плантаций, расположенных в самом сердце аверсарианского губернаторства Катраддия. Ныне освобожденные после более чем поколения гонений и издевательств, мондеррны поселились в густом лесу Кнокидбеса в северной Малькое, и многие, кажется, полны решимости возобновить свои мирные культурные традиции.#"
 
 mtuwe_desc: "#size:15    Мтувы обитают в южных джунглях Рожихлат Мары с незапамятных времен. Они живут в деревянных деревнях, опирающихся на сваи, часто имеющих форму ветвей самого дерева. Мтувы имеют близкое родство с мангровыми лесами, которые они издавна называли домом, предпочитая выращивать собственную еду, чтобы не нарушать баланс жизни в лесу. Висячие сады мтувов заставляли многих ошибочно принимать мангровые заросли Рожихлат Мары за другие виды деревьев, поскольку ветви деревьев тяжело усыпаны различными видами фруктов.\n\nМтувы охотятся только ради самосохранения, когда популяция местной фауны разрастается настолько, что начинает угрожать их деревням, или в случаях самообороны — обычное явление для тех, кто живет в этом регионе. Однако они верят, что эта ответственность лежит только на них, и яростно не позволяют никаким чужакам охотиться на лесных существ.#"
 
 muhadamd_desc: "#size:15    Мухадамды — это собирательный термин, обозначающий остатки различных народов [Concept('aironoian_southeast_biozone','юго-восточного Айроноя')|E] преимущественно керкелойского происхождения, которые были вынуждены отказаться от своего оседлого образа жизни в хаосе [Concept('bayyuralar','Байюралара')|E]. Приняв на себя всю тяжесть злополучной [Concept('ertomax','эртомаксистской')|E] попытки восстановить Арувасуэнскую империю и последовавших за ней жестоких боев, мухадамды увидели свои города стертыми с лица земли и были вынуждены рассеяться по [Concept('great_steppe_biozone','Айронойским степям')|E], постепенно перенимая язык и обычаи ванавидов, чтобы избежать порабощения.#"
 
 murarut_desc: "#size:15    [Glossary('Мур’ар’уты','GH_MURARUT_GLOSS')] — потомки коренных жителей [Concept('great_steppe_biozone','Айронойской степи')|E], чьи многочисленные мелкие королевства были растоптаны во время [Concept('bayyuralar','Байюралара')|E] и последующего [Concept('aironoian_migration','ольтенского переселения')|E]. Покоренные и быстро поглощенные зарождающейся ванавидской культурной идентичностью, одним из немногих аспектов, которые они все еще сохраняют от своих древних предков, является широкое использование колесниц в боевых, церемониальных и религиозных целях.#"
 
