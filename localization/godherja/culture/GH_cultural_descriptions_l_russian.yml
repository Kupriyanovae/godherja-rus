l_russian:
 acraddozy_desc: "#size:15   Акраддози — это племена, которые были объединены во время [Concept( 'sorrowing_of_oejeynica', 'Скорби по Ойейнице' )|E] [Concept( 'magi', 'магом' )|E]-полководцем Эскараттом, бесславным изгнанником из Магократии Сарвиноско. Эскаратт правил как удивительно великодушный диктатор на протяжении почти четырёх веков, отразив почти все вторжения [Concept('liches','личей')|E] в их твердыни на северо-западном побережье исконных земель. Для одиноко-светцев они были бесславными и ненавистными налётчиками, известными постоянными нападениями с побережья, даже когда личи продвигались всё глубже на север. Безумная королева одиноко-светцев Эдитлич ответила на их провокации, обратив Эгиду против их земель, что убило Эскаратта и привело к тому, что владения акраддози были быстро поглощены нежитью.\n\nПосле того как Эдитлич была сброшена в море, а Эгида возвращена Эонихарам, оставшимся акраддози позволили бежать в [Concept('lonely_light_biozone','Одинокий Свет')|E], из-за чего они стали ещё одной культурой изгнанников на этих островах.#"

 adabyann_desc: "#size:15    На протяжении веков Город Золотых Статуй пустовал, оставаясь темой легенд из незапамятных времён, называвших его домом капризных дьяволов и злых духов. Предки адабьяннов по причинам, которые исторически неясны и по сей день, первыми нарушили древние табу. Преодолев очаги опасной и непредсказуемой магии, окружавшие руины, они взяли судьбу в свои руки и навсегда изменили историю юга. Сегодня их потомки наслаждаются неслыханным для всего [Concept('aeras','Эраса')|E] богатством и процветанием — плодами их трудов по воссозданию чудес, найденных в новом доме. Благодаря этим диковинам был изгнан голод, искоренён ряд распространённых болезней и паразитов, а бесчисленные народы были подчинены, дабы удовлетворить вечно растущую жажду роскоши и богатства народа адабьяннов.#"

 adani_desc: "#size:15    Земли адани состоят из засушливых холмов, где только самые стойкие общины разрастаются до значительных размеров без угрозы голодной смерти. Из-за этого они полагались на царей-учёных, которые вели их сквозь холодные и сухие зимы, когда [Concept( 'magic', 'магия' )|E] была единственным спасением от голода и засухи. Подобное упование на ученейших закрепило почтение к древним и проверенным знаниям среди адани, а также породило ксенофобное отношение к соседям, которые, по их мнению, желают выкрасть их священные тайны, особенно после катаклизма [Concept( 'dharya_varha', 'Дхарья-Варха' )|E].\n\nСамой причудливой традицией адани для чужеземных наблюдателей является [Glossary( 'Дойнатека Сариатти', 'GH_DOYNATEKA_SARYATTI_GLOSS' )], и те, кто покровительствует слону, добравшемуся до самого низа первым, как говорят, спасаются от засухи на десять циклов [Concept( 'aervalr', 'Эрвала' )|E]. Эти состязания, проводимые дважды в год, за века превратились в коррумпированные политические игры, и немало слонов гибнет в отчаянной попытке снискать благосклонность древнего ритуала.#"

 adnanari_desc: "#size:15    Аднанари — это жители восточных [Concept('sarradon','саррадонских')|E] королевств Кекхенемхата. Хотя распространено мнение, что они происходят от древних кочевых племён, полностью оставивших свой образ жизни и осевших в долине реки Кхенем и на близлежащих берегах более тысячи лет назад, в их современной культуре связь с кочевым прошлым едва различима и может быть скорее легендой, чем фактом.\n\nКонтролируя важнейший перекрёсток, где Гонианский тракт сходится с северным побережьем Саррадона, они развили сильный коммерческий дух и сумели компенсировать относительное бесплодие долины реки Кхенем доходами и импортом от своих купеческих начинаний. Горе тем, кто сочтёт их из-за этого мягкими: постоянные войны с налётчиками из пустынных глубин веками закаляли их боевой дух. Замысловатoe и по-барочному мстительное отношение аднанари к личной чести широко известно; оно как помогало, так и мешало им на протяжении истории. В то время как многие великие начинания аднанари по созданию империй рушились из-за междоусобных распрей, точно так же многие ничего не подозревавшие завоеватели оказывались фатально не готовы к смертоносным циклам мести, которые их завоевания обрушивали на их собственные головы.\n\n«Подобного и стоит ожидать, когда хранишь честь», — говорят аднанари.#"

 adrakamp_desc: "#size:15    Северные низменности были домом для некоторых наиболее развитых обществ сьялволков, среди которых адракампы занимали ключевое место. Торговцы со всех кланов стекались в их поселения в надежде продать свои товары; на рынках адракампов можно было найти всё, что только могло понадобиться соплеменнику. Это процветание по иронии судьбы родилось из бесплодия и гористости их родины, вынуждавших их торговать ради пропитания населения. Необходимость поддерживать приток богатства научила вождей адракампов тонкому искусству дипломатии, позволявшему избегать наиболее кровавых аспектов клановой политики сьялволков. Вместо войн за территории адракампов призывали судить споры между враждующими племенами, а города адракампов были нейтральной землей для торговли и дипломатии, где кровная месть и вендетты юридически аннулировались в тот самый миг, когда соплеменник пересекал их черту. Нельзя сказать, что эти купеческие кланы были трусливы — при нападении адракампы защищали себя так, как и подобает любому другому сьялволку.\n\nОднако адракампы не могли защититься от всех угроз. [Concept( 'the_fog', 'Туман' )|E] выгнал их с рынков и погнал по дорогам. Многие в племени сокрушаются, что их вековое процветание утеряно навсегда.#"

 aeonyhara_desc: "#size:15   Эонихары — это потомки древних [Concept( 'magi', 'магов' )|E] Одинокого Света, служивших святыми жрецами и шаманами древних Островов. Хотя их единая преемственность святых старейшин и учёных была прервана вторжением материковых армий Приккани во время их нападения на [Concept('lonely_light_biozone','Одинокий Свет')|E], вскоре они вернули своё место в обществе с поялением Эгиды и стали её доверенными защитниками. Обязанные даровать Эгиду любому королю [Concept('lonely_light_biozone','Одинокого Света')|E], небольшие общины эонихарских жрецов, живущие обособленно в своих святых монастырях на райских островах, сформировали культуру вокруг веры, [Concept( 'magic', 'магии' )|E] и защиты Одинокого Света и её щита.#"

 aezentiam_desc: "#size:15    Эзентиамы — уроженцы северной Каширии, известные по всему Дармирату своей воинской доблестью и стойкостью, ибо они имеют долгую историю борьбы с внешними угрозами из-за пределов Каширията. Благодаря этому они являются высокоценными наёмниками, которых часто ищут далёкие лорды, а порой их даже делают королевской гвардией в каком-нибудь особо богатом королевстве.\n\nОднако по мере того, как вращалось колесо времени, их военные кодексы соблюдались всё меньше и меньше, а их собственные походы за великую реку резко сократились. Тем не менее значительная часть людей всё ещё упрямо следует путями своих предков и защищает свои земли от любой угрозы, которая может прийти из-за священной реки.#"

 aguadosian_desc: "#size:15    Хотя большинство культур [Concept('shatteredisles','Островов')|E] считают мореплавание важным, для агуадосианцев оно является стержнем всей жизни. Считая своей истинной родиной море, а не острова, на которых они живут, они бороздят океаны [Concept( 'aeras', 'Эраса' )|E] на судах [Glossary( 'картейман', 'GH_KARTEIMAN_GLOSS' )].\n\nБольшая часть их земли находится в общем владении, её участки раздаются лишь в знак признания великих деяний, да и то обычно только на одну жизнь. Настоящими поместьями агуадосианцев являются флотилии, служащие благородным семьям, которые в дни до Фродброкны можно было увидеть в таких далёких краях, как Катун-Кай и южный Саррадон. Хотя они и способствуют трансконтинентальной торговле, их малая грузоподъемность делает их более пригодными для защиты и сопровождения крупных судов — услуга, которую они охотно предлагают великим правителям и купеческим гильдиям.#"

 akhtarfi_desc: "#size:15    Оазисный народ смешанного мармаладидского и прибрежно-саррадонского происхождения, ахтарфи происходят от выживших, которые бежали, когда мармаладидское нашествие разбилось о Центральный Мамурамат, рассеявшись после катастрофической бойни в битве при Кричащей Земле в 1047 году. Многие кланы осели где пришлось, опасаясь возмездия татталитов; позже их численность пополнилась волнами сихнимийских крестьян, бежавших от растущего беспорядка в Прибрежном Саррадоне.\n\nАхтарфи не признаются частью какого-либо из традиционных Великих племён мармаладидов, хотя многие отдельные ветви среди них заявляют о далёком родстве с несколькими различными полубогами-основателями.#"

 alewui_kemsari_desc: "#size:15    Происходящие от кемсарских колонистов, отважившихся отправиться на север, алевуи кемсари формируют самую молодую из кемсарских культур. Ища пахотные земли вдали от всё более централизующегося государства с центром в Дедераке, алевуи основали многочисленные города там, куда со временем будет повернута река Валора. Именно здесь алевуи пришли в соприкосновение с коренными зарасадари, результатом чего стало последующее порабощение и подчинение последних Кемсаром. Вдоль реки алевуи сформировали многочисленные общины, которые в целом были самоуправляемыми и получали минимальный надзор со стороны имперского правительства в Дедераке.\n\nОднако внезапный крах Кемсарской империи, за которым последовало возвышение Амсарского Хиклана на севере, поставил алевуи кемсари в опасное положение. Находясь под перекрёстным огнем налётчиков ран кемсари и армий тиссаев, они занимают одни из последних плодородных земель в Кемсаре. За пять непрерывных веков войны, искоренившей любые остатки культуры или исторической памяти, всё, что осталось от алевуи кемсари — это руины их некогда великих городов, на которые они могут лишь взирать с болезненным трепетом.#"

 aljibal_kemsari_desc: "#size:15    Изолированные в горах центрального и западного Кемсара, альджибал кемсари оказались группой, наименее затронутой имперским крахом: целые общины узнали об испарении центрального правительства лишь спустя недели. Жизнь альджибал вращалась вокруг шахт в их горах, из которых извлекалось почти всё богатство региона. Шахтёрами становились целые поколения семей, при этом возможностей для иного выбора почти не было, так как альджибал находились под полным культурным и политическим господством ран кемсари, а сами горы не имели собственной правящей элиты. Поскольку почти все трудились в соляных, угольных или железных шахтах, продолжительность жизни была невероятно низкой — если кто-то доживал до сорока, его считали стариком. Единственным способом вырваться из такой жизни было пойти на службу в кемсарские армии, и, как следствие, сформировалась суровая, спартанская культура с огромной долей негодования по отношению к высшим классам.\n\nКрах Кемсара положил конец какому-либо значению горнодобывающей промышленности в регионе, но в конечном итоге изменил мало что ещё. Их культура всегда была обособленной и клановой, сосредоточенной вокруг семейных традиций, и альджибал легко приспособились к племенному образу жизни, стремясь выйти из своих гор и взыскать возмездие с некогда доминировавших низменностей. Те крохи порядка, что оставались в Кемсаре, немедленно рухнули, и регион погрузился в анархию, которая окутывает его и по сей день.#"

 almajun_kemsari_desc: "#size:15    Хотя север со временем станет известен как сердце Кемсарской империи в её поздние годы, именно южный Кемсар был местом сосредоточения имперской власти и культуры на протяжении первой тысячи или около того лет её существования. Одни из величайших, монументальнейших архитектурных шедевров, известных человечеству, были построены его жителями-альджун кемсари в давно ушедшие, ныне почти мифические дни Семи Лазурных Императоров, а также в последующие века — творения, что продолжают стоять и поныне, несмотря на полное уничтожение породившей их цивилизации.\n\nПотеряв свое главенствующее положение после Первого Междуцарствия, а затем будучи полностью затмённым севером во Втором, юг постепенно приобрёл репутацию удушливых, обедневших задворок блистательной жемчужины севера — но, конечно, и то, и другое превратилось в пепел после Битвы у Разрушенной Цепи. Из-за своего расположения глубже в пустыне альмаджун пострадали едва ли не сильнее всех остальных кемсарских групп, а их относительная изоляция от остального мира взрастила крайне воинственные, ксенофобные обычаи, где к чужеземцам относятся почти как к мифологическим чудовищам и агентам зла, а не просто смертным. Сказать, что они почти полностью отказались от лоска своей некогда изящной культуры, было бы преуменьшением.#"

 amaghean_desc: "#size:15    Древние сказания гласят, что амагейцы являются потомками немученика царя-бога Арназа «Великого Предка» и его дитя Парназа «Великого». Бесславные своим религиозным рвением и воинской культурой, они, как часто говорят, совершенно не боятся смерти в бою — фактически, гибель в сражении считается в их культуре самым благородным способом умереть. Амагейцы имеют долгую историю практики рабства, ибо они верят, что все народы к востоку от них заслуживают наказания за помощь Азоту «Братоубийце». Некоторые из этих культур за многие века были даже полностью истреблены из-за своей нелояльности, однако некоторые остались в милости у своих хозяев, как, например, дранети. С приходом аверсарианского влияния в их исконные земли амагейцы были поражены доблестью и отвагой своего врага, и многие были даже открыты для идеи принятия аверсарианских обрядов. Однако только во время правления дедафала Мариамны «Строительницы» амагейская аагиократия была официально утверждена и стала опорой амагейской жизни.#"

 amsari_desc: "#size:15    Мало какой народ перенёс такое порабощение и угнетение, как амсары, и ещё меньше тех, кто прошёл через это и выжил.\n\nСо времён тёмных дней рабства в руках ран кемсари амсары поднялись высоко. Именно их пророк предсказал свободу народам зарасадари, и именно их воины и маги исполнили это обещание освобождения. Каждый ребёнок амсар узнаёт об этом с рождения, и в результате в их культуре развилась глубокая и непреклонная гордость за свой статус свободных мужчин и женщин. Сама идея порабощения считается отвратительной в их обществе, чем-то, рождённым из кошмара, сотворённого в самые тёмные дни их истории. По закону любой раб, остающийся на земле амсаров в момент, когда заходит солнце, немедленно становится свободным — хотя фактическое соблюдение этого закона в отношении тех чужеземных купцов, что глупо привозили с собой своих рабов, в лучшем случае было слабым.#"

 amuaad_desc: "#size:15    Амуаадов пожалуй, лучше всего описать как космополитичный плавильный котёл практически всех крупных культур северного побережья [Concept( 'sarradon', 'Саррадона' )|E]. Находясь там, где миры ритуалистов и варденитов востока встречаются с экзотическим Кемсаром, амсарами и айярами, они, кажется, заимствовали каждую деталь своего языка и обычаев у какого-то из соседних народов.\n\nИх язык имеет больше всего общего с тасурмадским, но их письменность совершенно не похожа на большинство окружающих культур — вместо использования букв джадуяда они используют глифы древнего Кемсара, наследие колоний ран кемсари, основанных в регионе во время их золотого века. Их искусство построено на восточном фундаменте, но с заметными элементами айяров, а архитектура — отчетливо кемсарская. Наконец, одеяния и кухня амуаадов представляют собой такое буйное смешение всего под солнцем, что попытка разобраться в происхождении каждого элемента была бы воистину тщетным делом.#"
 
 saruyad_desc: "#size:15    Возникшие среди великих лесов и раскидистых долин райской и приятной зелёной земли северного Харадуна, саруяды исторически были народом, обособленным от остального Саррадона. Их соседям амуаадам и тасурмадам их традиции кажутся клановыми и нецивилизованными, и хотя на их родине возносились и рушились великие империи, самим саруядам редко выпадала честь править.\n\nНесмотря на это, сами саруяды — удивительно дружелюбный и открытый народ по отношению к тем немногим, кто заслужил их доверие, и даже чужеземцы удостаиваются сложных обрядов домашнего очага и приветственных церемоний. Нарушить гостеприимство для любого благородного саруяда хуже смерти, а их народные предания полны историй о великих и кровавых клановых войнах и междоусобицах, вспыхивавших из-за подобных оскорблений. Ещё одним ревностно хранящимся секретом является необычайно высокая концентрация магической крови, встречающаяся особенно среди простолюдинов. Рождающихся у них дочерей, проявляющих подобные таланты, обычно забирают на воспитание и тайное обучение местными общинами знахарок, известными как Аккабла, к которым относятся с благоговением и трепетом.#"
 
 anorlori_desc: "#size:15    Несмотря на свое положение на задворках [Concept('shatteredisles','Расколотых островов')|E], анорлори заслужили прочную репутацию за свои заграничные авантюры и героические деяния. Амбициозная молодёжь с их родных островов, как известно, путешествует далеко и широко в поисках славы и почёта, часто оставляя неизгладимое впечатление на местных жителей. Самые знатные вельможи родных островов анорлори традиционно изгоняют своих вторых сыновей, отправляя их за море искать свой путь среди чужеземцев на островах. Учёные анорлори возводят эту традицию к знаменитой последней битве на севере бок о бок с ныне обожествлённым Чемпионом Шевалье, вдохновившей чувство общей ответственности за судьбу всех Островов.\n\nБудь то предания о героизме или страница в книгах истории об очередной злополучной попытке объединения, многие знаменитые изгнанники анорлори оказались обожествлены в обширных пантеонах островов за свои деяния при жизни. Однако для большинства путешествующих чужеземцев-анорлори их долгие странствия в один прекрасный день приведут их обратно, возвращая на скромные родные острова ради труда и любви.#"
 
 arashan_desc: "#size:15    Арашани часто принимают за призраков или миражи каменистой пустыни, служащей им домом, которые возникают столь же внезапно, как порыв сухого ветра, чтобы нанести удар по ничего не подозревающим караванам, и исчезают в следующее мгновение. Правда, однако, далека от вымысла, поскольку арашани — люди из плоти и крови, обитающие в полуземлянках, скрытых от раззадоренных глаз чужаков. Там они празднуют успешные налёты грандиозными пирами и [Concept('sevra_par','танцами летающих топоров')|E], шумно пересказывая былые победы и подвиги воинской доблести ради престижа и признания со стороны соплеменников."
 
 arderwan_desc: "#size:15    Карациры происходят от военных отрядов наёмников-хоринотов, которые осели на бывших землях Астиликской империи после её уничтожения совместными аверсарианско-ольтеникскими силами в конце восьмого века от И.С. Близость к побережью и влияние восточных союзников заставили карациров принять более оседлый образ жизни по сравнению с ванавидами [Concept('great_steppe_biozone','востока')|E], отказавшись от племенных ополчений и кочевого быта предков в пользу холмистых фортов и рыцарских свит. Благодаря этому они стали высоко цениться как профессиональные воины иностранного происхождения, и многие карациры предпочитают служить в аверсарианских легионах в качестве ауксилиариев."
 
 ardothanes_desc: "#size:15   Уроженцы северных пограничных земель Калатипсоми, ардотаны пострадали во время отступления шевальенцев с этих территорий, потеряв большую часть своих лучших пахотных земель из-за аверсарианских переселенцев. Вытесненные на неплодородные окраины, многие кланы обратились к разбойничьим набегам, что создало ардотанам репутацию бандитов. Наперекор дурной славе они зачастую скрупулезно следуют кодексам чести, а народные предания о благородных и даже героических бандитах-ардотанах снискали непреходящую популярность в Шевалье.#"
 
 armanas_desc: "#size:15    Из всех детей Каширията принято считать, что арманаи благословенны более всех, ибо они любят Священную Реку и любимы ею в ответ. Их [Concept( 'magi', 'маги' )|E] духовно сонастроены с Кашириятом, и именно они первыми открыли, как направлять её многочисленные приливы и отливы.\n\nПользуясь высоким почтением у кутанагов, арманаи часто избираются вождями или духовными лидерами, и большинство восстаний речного люда возглавлялось кем-то из их числа."
 
 arolyan_desc: "#size:15    Аролианцы происходят с южного Пиратского побережья, с островов, настолько густо заросших джунглями, что только в самых прибрежных регионах есть города, заслуживающие внимания проплывающих мимо моряков. Из-за этого аролианцы ревностно оберегают моря вокруг своего дома и известны тем, что без разбору убивают любого, кто подорвётся слишком близко к их берегам. Однако их страх перед чужеземцами за века постепенно угас, и теперь в экипажах аролианских кораблей порой можно встретить сарутанцев и дераани.\n\nАролианские женщины исторически занимали исключительно роль воинов, в то время как мужчины посвящали себя искусству управления и правления, веря, что их высшее призвание — однажды навсегда укротить свои острова. Отличительные татуировки на телах аролианских женщин легко заметить в каширских портах; они запечатлевают каждую их победу в виде настолько прекрасных рисунков, что некоторые учёные посвящают этому годы своей жизни.#"
 
 asarey_desc: "#size:15    Жизнь общества асареев издавна вращалась вокруг постоянного притока купцов, совершающих опасное путешествие вверх и вниз по Гонианскому тракту. Служа в равной степени его защитниками и противниками, воины асареи, как известно, совершали налёты на те самые караван-сараи, которые до этого клялись защищать. Их присутствие вдоль торгового пути стало настолько привычным фактом, что для любой экспедиции считается глупостью отправляться в путь, не отложив часть своих товаров для потенциальных грабителей. Эти налётные отряды, известные у асареев как «Саммалрик», организованы на строго эгалитарной основе, а вся «выручка» делится поровну между участниками. Конечно, не все асареи являются грабителями — их можно встретить и в роли самих купцов или управляющих множества пустынных твердынь на этом пути.#"
 
 ashital_desc: "#size:15    Ашиталы — это самое процветающее и многочисленное подразделение канийского народа, чьё общество сосредоточено вокруг двух великих мегаполисов: ЭЛОИ-Авар и Бет-Адис. Жители этих двух городов создали большую часть канийской литературы и культуры, но ни один из них не наслаждался чем-то большим, кроме мимолётных периодов независимости от внешних сил, часто доминировавших над ними на протяжении веков. Хотя это вылилось в ряд восстаний и последующих попыток подавить их странные религиозные обряды, страх нарушить прибыльную торговлю, идущую через этот регион, приводил к тому, что города обычно пользовались хрупкой местной автономией.\n\nАшиталы, несмотря на то, что большинство чужеземцев представляют именно их, когда воображают канийцев, переняли ряд культурных традиций у своих соседей айяров и амсаров. Многие из них стали гордиться своим космополитичным наследием и уверовали в то, что они являются самым культурным и грамотным народом в Западном [Concept('sarradon','Саррадоне')|E].#"
 
 astilik_desc: "#size:15    Астилики — древний народ, а земли, которые они населяют, ещё древнее. Обитая в городах-дворцах вдоль реки Петрониат в [Concept('western_aironoi_biozone','Западном Айроное')|E], они были свидетелями возвышения и падения бесчисленных империй задолго до того, как построили [Concept('astilik_empire','свою собственную')|E]. Стены поселений астиликов никогда не прекращают развиваться, поскольку каждое поколение считает своим долгом добавлять новые башни, улучшать укрепления и расширять земляные валы; именно с этих укреплённых позиций они проецируют свою власть, господствуя над рабами и серфами, которые бесконечно трудятся на обширных орошаемых полях, окружающих их цитадели.#"
 
 atrakar_desc: "#size:15    Атракары были последними из древних кикарсагов, кто сдался, и за это были наказаны [Concept('aversaria','аверсарианцами')|E] истреблением клана. Хотя они и переняли аверсарианский лоск, как и их культурные сородичи, втайне они поддерживают культ личности, поклоняясь Нартакхатану Озкану и его жене Нартахатун Бетун, их последним независимым правителям и героям культуры, которые предпочли смерть капитуляции.\n\nАтракарское понимание ардары — это верность Озкану и Бетун; поскольку их династия была истреблена, эта верность проявляется главным образом в подражании им и борьбе против их врагов — ийроссов и аверсарианцев. Так как и Озкан, и Бетун воплощали древнекикарсагский идеал ардары, атракарское представление о ней очень похоже.\n\nКак и во всех кикарсагских культурах, бётаи является важной частью атракарского общества; подражая Озкану и Бетун, как мужчины, так и женщины должны вступить в бёту и принять участие в набеге, чтобы считаться взрослыми и получить право на брак. Атракарские всадники, знаменитые своей свирепостью, использовались аверсарианскими лордами для устрашения мятежных рабов, а после [Concept('frodbrokna','Фродброкны')|E] они теперь терроризируют и истребляют аверсарианцев.\n\n[Concept('magic','Магия')|E] в основном низведена до духовных ролей, хотя нет никакого запрета на то, чтобы светские правители были [Concept('magi','магами')|E]. [Concept('living_magi','Маги крови')|E] пользуются уважением и внушают огромный страх, в то время как [Concept('dead_magi','Маги земли')|E] преследуются как нечистые и скверные.#"
 
 auteonic_desc: "#size:15    Аутеоны происходят с северных окраин [Concept('greensea','Зелёного моря')|E], где лес начинает редеть, а деревья слишком слабы, чтобы выдерживать большие города. Поэтому они предпочитают жить на земле, чтобы быть ближе к [Concept('aeras','Эрасу')|E] без обуви, дабы чувствовать пульс Мирового Древа под своими ногами. Несмотря на то, что их исконные земли скудны и скованы льдом, их деревни часто бывают окружены прекрасной зеленью. Аутеонские [Concept('magi','маги')|E] способны растапливать снег и заставлять траву прорастать из бесплодных скал.\n\nАутеоны — праздничный народ, чьи песни поются далеко за полночь. Мужчины и женщины вплетают цветы в свои волосы, а лидеры устраивают танцы вокруг деревьев без сучьев. Их часто высмеивают другие партские племена, критикуя за легкомыслие и отсутствие государственной ответственности. Несмотря на эти заявления, их вождества структурированы очень похоже на другие партские народы, со светским правителем, которого консультирует совет друидов. Многие аутеонские друиды отправлялись к Мировому Древу, чтобы стать членами Верховного Совета. Их маги ничуть не уступают своим собратьям на юге, а самые могущественные способны разложить человека одним лишь взглядом. И всё же, аутеонская культура полна любви и смеха, и они всегда готовы помочь другу в беде.#"
 
 auzangeb_desc: "#size:15    Аузангебы прибыли в [Concept('sarradon','Саррадон')|E] в конце III века, переплыв Море Империй вместе с остальными из тех, кого ныне зовут айярами. Когда флот был разделен великим штормом, аузангебы продолжили свой курс и уплыли, пожалуй, дальше всех из групп айяров. Когда они наконец причалили к берегу, они оставили позади даже Сихнамию.\n\nОни прибыли в Эрд-Лахдир, к порогу могучего Кемсара. В этой новой земле они стали кочевниками, блуждая в караванах и лагерях по всей стране, постепенно отказываясь от лоска своей павшей цивилизации. Приняв это новое существование, они жили в вечном подвешенном состоянии, бывая то наёмниками, работающими на какую-то группу, то их ненавистными врагами. Однако, ведомые опасным существованием в вечно разделенной земле, они научились ценить свои общины, свои церемонии и своё имущество, объединив эти три элемента в общественный идеал.\n\nНачавшись как скромное празднование по случаю возвращения торговца или наёмника в свой караван, теперь аузангебы устраивают регулярные пиры и празднества, на которые приглашаются все, от могущественнейшего знатного вельможи до нижайшего крестьянина. Они пользуются заслуженной репутацией народа великолепия, ибо для них величайшим проявлением добродетели является не сам подвиг победы, а демонстрация добычи.#"
 
 avihana_desc: "#size:15     Авиханы — молодая культура, отделившаяся от своих предков на севере в десятилетия, последовавшие за [Concept('murtuy_ka_varha','Муртуй ка Варха')|E]. В связи с опустошением как их исконных земель, так и земель вокруг них, авиханы мигрировали на юг к разорённым берегам Вичачила, оставив в процессе большую часть своего прежнего аграрного уклада.\n\nСегодня об авиханов часто отзываются как о безжалостных и проницательных купцах, чьи могущественные гильдии удерживают влияние в каждом порту по всему Каширскому заливу и в некоторых крупных городах дальше на Пиратском побережье и даже в самом Каширьяте. Большая часть их молодёжи подталкивается к занятию ремеслом, а не к науке — это подозрительное отношение к учёным укоренилось в сердцах авиханов со времён их миграции.#"
 
 aygaen_desc: "#size:15    Самая западная культура, коренная для гор Армазли, народ айгаенов вечно находится в конфликте друг с другом. Традиционно общины айгэн возглавляются обособленными группами жрецов, живущих в великих дворцах-храмах и направляющих свой народ как в духовных, так и в светских вопросах. Однако многие из первых защитников этих жрецов также основали великие родословные, и их потомки сформировали светского соперника их власти.\n\nАйгаены исторически были самыми ярыми противниками амагейцев в своём родном регионе, но при этом предприняли меньше всего восстаний из-за отсутствия великих стратегических умов. Когда храмы закрылись, а их знать рассеялась, айгаены стали более общинным народом, разделяя тяготы борьбы сообща, а не полагаясь на помощь своей хищнической аристократии.#"
 
 azarg_kutahnuug_desc: "#size:15    Обычно считающаяся одной из самых далёких, изолированных и загадочных культур Катраддии, Азарг Кутахнууг ([Concept('azarg_kutahnuug_translation_debate','точный смысл оспаривается')|E]) привлекла к себе внимание [Concept('aversaria','Аверсарии')|E] и всего мира после [Concept('aehan_massacre','Резни в Эхане')|E]. Будучи невероятно патриархальным и милитаристским обществом, они, как говорят, подвергают своих детей ряду [Concept('azarg_kutahnuug_blood_rituals','странных и жестоких ритуалов')|E], из которых немногие выжившие выходят, становясь устрашающими «[Concept('death_seekers','искателями смерти')|E]».\n\nХотя их долгое время считали отдалёнными и редко встречающимися, с приходом [Concept('frodbrokna','Фродброкны')|E] Азарг Кутахнууг двинулись на юг, что сопровождалось тревожными сообщениями о встречах и «[Concept('bloodmark_incidents','принудительных посвящениях')|E]». Какова их конечная цель или какой она когда-либо была, остаётся неизвестным.#"
 
 babura_desc: "#size:15    Бабуры — это жители засушливой, холмистой долины Бабур во внутренних районах Эрд-Лахдира. Хотя в основном их считают сарадари, в действительности они являются результатом постепенного смешения переселенцев-айяров и коренных саррадонцев, сформировавших культуру, которая, оставаясь преимущественно айярской, объединяет в себе несколько местных традиций. Находя точки соприкосновения в своей общей истории кочевничества, они представляют собой в некотором роде место встречи не только между сарадари и кошаранами, но и между урбанизированным сердцем айяров и сельскими, традиционалистскими высокогорьями.\n\nИз-за низкого сельскохозяйственного потенциала региона они в основном придерживаются традиционных способов скотоводства. Кроме того, сочетая наёмнические традиции обоих народов, они считаются источником некоторых из самых искусных воинов Лирааджа, многие из которых с юных лет обучаются боевым техникам, практикуемым со смутных глубин прошлого этого региона.\n\nИронично, но несмотря на свой статус смеси культур, они являются стойкими традиционалистами и неоднократно поднимали восстания против Шейярлахиры за дерзость нарушить их уклад жизни.#"
 
 balauri_desc: "#size:15    Балаури — это одно из многих сагадавийских племён, встречающихся на холмах и в густых лесах к востоку от Катраддии. Они являются квинтэссенцией сагадавцев, известных своими грозными воинами, вооруженными фальксами, и шумным поведением как на поле боя, так и вне его. Однако, несмотря на свои стереотипно варварские качества, балаури также известны своей относительно развитой материальной культурой. Ремесленники балаури вырезают на своих доспехах богатые сцены, украшенные змеиными мотивами, а традиционный гобелен балаури стоил бы хороших денег на любом континентальном рынке. Эти художественные черты развились отчасти благодаря тому, что исконные земли балаури находились прямо на крупном торговом пути через внутренние районы континента, что позволяло идеям процветать, а самим балаури разрастись, став самым многочисленным сагадавийским кланом.#"
 
 banwagul_desc: "#size:15    Прославленные моряки и навигаторы, [Glossary( 'банвагулы', 'GH_BANWAGUL_GLOSS' )] издавна зовут водно-болотные угодья Дахангона своим домом. Более всего они знамениты своими замысловатыми кораблями, которые, несмотря на свои малые размеры, способны совершать путешествия через бескрайние моря. Эта склонность к исследованиям, а также их положение в центре двух миров сделали банвагулов гостеприимными к большинству чужеземцев, и их порты украшены парусами тысячи народов.#"
 
 barki_desc: "#size:15    Барки происходит от южной ветви сьялволькской культуры. Они заслужили дурную славу в годы войн с [Concept('aversaria','аверсарианцами')|E], работая проводниками и лазутчиками, что принесло им зловещую репутацию среди своих единоверцев. Тем не менее их умелое лавирование в бурной политике пограничья между захватчиками и обороняющимися принесло процветание барки, которые выступали в качестве посредников в торговле между южанами и народами севера. Однако ни в какой момент они не заслужили полного доверия аверсарианцев: двуличие проводников барки подозревалось как причина Чорресской резни в 1067 году от И.С. и бескровного, позорного провала карательной кампании в Ичитероне в 1086 году от И.С. Ничего так и не было окончательно доказано, но вполне вероятно, что барки были на пути к жестокой расправе со стороны своих союзников, когда разразилась Фродброкна.\n\nБудучи самыми «аверсарианизированными» из сьялволков, барки не питали особой любви к кланам Имперреха, в результате чего их пути разошлись почти сразу после того, как битва при Элизианском перевале вывела их в безопасность за пределы [Concept('foglands','Туманных земель')|E].#"
 
 barzawa_desc: "#size:15    Высокогорный народ, обитающий в горах Центрального [Concept('sarradon','Саррадона')|E] с незапамятных времён, барзаванцы по большей части влились в более широкие саррадонские культурные течения. Тем не менее они сохраняют ряд странных обычаев, восходящих к временам еще до [Concept('the_worldeater','Пожирателя миров')|E]. Их кланы в основном матрилинейны, а их народ разделен на ряд племён, многие из которых заявляют о царском наследии, утерянном в истории.#"
 
 beduleno_desc: "#size:15    Бедуленои бороздили воды Каширьята задолго до прибытия ольтени. Когда Байтор начал своё завоевание Айроное, они вызвались переправить наступающую орду через реку, избавив их от участи, постигшей тех, кто отказался. Это также позволило бедуленоям остаться великими торговцами и паромщиками, и по сей день они обеспечивают самый безопасный способ пересечь Каширьят и Латунное море.#"
 
 bricotaves_desc: "#size:15    Брикотавы — это обособленное племя, изначально коренное для Сердцелесья в Калатипсоми. Хотя большая часть их материальной истории была утеряна в веках, брикотавам удалось пронести устную традицию, ведущую летопись их разрозненной истории после едва не случившегося вымирания во время [Concept('marcher_aversarian_wars','войн Марки и Аверсарии')|E].#"
 
 brigandines_desc: "#size:15    Бригандинцы — это всё, что осталось от жителей западного [Concept('greensea','Зелёного моря')|E], где деревья настолько густые, что можно днями не видеть солнца. Целые деревни выкручивались из корней деревьев [Concept('magi','магами')|E], а почитаемые Скриверы вырезали целые рунические истории на непроницаемом деревянном гобелене. Общины были сплочёнными и уединёнными, дети воспитывались сообща, а многие люди выбирались наружу только ради молитвы.\n\nОни дополняют свой в основном вегетарианский рацион насекомыми и мёдом, а их маги одинаково известны как своей аскетичной мудростью, так и суровым, мрачным нравом.#"
 
 caemansi_desc: "#size:15    В то время как даукени пишут утончённые и пронзительные стихи, [Glossary( 'каэманси', 'GH_CAEMANSI_GLOSS' )] никогда не проявляли интереса к подобным изяществам — их саги изображают неоправданное насилие и стремительное действие, а их барды предпочитают хруст позвоночника полету бабочки.\n\nБольшая часть этих историй берёт начало из гордой истории Ищеек Крови, зафиксированной на великих рунических камнях, испещрённых описаниями и глифами великих завоевателей и искателей приключений. Этот стиль военной поэзии стал популярен среди многих сьялволькских кланов, когда деяния великого воина пересказываются перед тем, как сойтись врукопашную с врагом.#"
 
 carsavisians_desc: "#size:15    Уроженцы центрального [Concept('chevalie','Шевалье')|E], карсавизианцы — народ стойкости. Терзаемая веками вторжений [Concept('liches','личей')|E], их культура была сформирована необходимостью противостоять невзгодам. Пока горели города и падали крепости, они учились перестраивать их еще более прочными, учитывая каждую ошибку и улучшая сделанное. Хотя другие шевальенцы искусны в строительстве крепостей, карсавизианцы — истинные мастера, чьи возвышающиеся твердыни обрели форму благодаря горькому опыту. Постоянное стремление к совершенствованию стало неотъемлемой частью их идентичности, где неудача — лишь препятствие, испытание при подготовке к конечному успеху.\n\nВзирая на мир через эту призму, они меньше заботятся о наказании за неудачу и больше о том, чтобы извлечь из неё урок. Их Отцы Пути знамениты своей снисходительностью, пока идёт улучшение. Тех же, кто сдаётся, изгоняют из общества, ибо карсавизианцы верят, что чистая выдержка способна преодолеть любой вызов. Многие из величайших историй успеха в Шевалье берут начало именно от них — истории, которые затем вновь интегрируются как цели, к которым нужно стремиться. Какая бы судьба их ни ждала, они наверняка примут её, относясь к ней лишь как к очередному препятствию, которое предстоит преодолеть.#"
 
 cerussiai_desc: "#size:15    Церуссиаи жили на центральной равнине Малькои на протяжении бесчисленных поколений. Рассматриваемые своими [Concept('aversaria','аверсарианскими')|E] повелителями как «цивилизованное племя», они использовались в качестве искусственно созданного среднего класса в колониальных поселениях, возникших по всему бассейну Ийроссов. Несмотря на это, церуссиаи так и не влились до конца в имперское сословие — отчасти из-за усилий аверсарианцев по разделению двух групп, отчасти из-за их собственного желания сохранить свои традиции живыми. Церуссиаи были предоставлены свободы, которых не имели их ийросские братья, и они пользовались их благами. Однако теперь ситуация изменилась. Время покажет, что станет с «цивилизованным племенем».#"
 
 charchac_desc: "#size:15    Обнаруживаемый на юго-востоке гор Армазли, чарчаки определяется своим упрямым пылом. Их обособленность была вызвана культурной враждой между ними и их соседями, чьи традиции и религия часто отвергались как нелепые. В их древней истории ими правила могущественная каста жрецов, контролировавшая каждый аспект их жизни. В возрасте шести лет половина всех детей чарчаков выбиралась для жизни в качестве жреца или воина, и только тем, кто потерпел неудачу, позволялось заняться другим ремеслом.\n\nОднако их культура радикально изменилась в результате амагейского завоевания. Жреческая каста была низведена на самое дно общества чарчак, а культура набегов стала стержнем их существования. Поскольку их народ воспринимается их амагейскими рабовладельцами как нечто меньшее, чем люди, кланы чарчак регулярно совершают набеги на земли амагейцев, чтобы похищать их женщин и детей, сжигая их на великих кострах. Однако, несмотря на неистовую ненависть в своих сердцах, народ чарчак так и не сумел вернуть своё былое господство.#"
 
 coldcoaster_desc: "#size:15    Хладобрежцы — коренные обитатели островов к юго-западу от Шевалье, известные прежде всего как умелые моряки и рыбаки. Хотя они тесно связаны с соседними вояженами, у них много культурных связей с Расколотыми островами, и иногда их считают скорее островными жителями, чем пограничниками. Материковые шевальенцы обычно уделяют жителям Холодного побережья очень мало внимания, хотя те известны тем, что служат одним из последних оплотов дарраллианской ереси.#"
 
 corvosnari_desc: "#size:15    Практикуя уникальную и тайную традицию магии теней, корвоснари сумели выдержать суровое существование в древних лесах Калатипсоми, выживая за счёт охоты на обильную фауну своих лесных цитаделей и за счёт безжалостных набегов на своих соседей, будь то аверсарианцы, пограничники или сьялволки.#"
 
 csorsca_desc: "#size:15    Чорски меньше всего похожи на древних кикарсагов; их знать говорит на имперском и на своём родном языке, который сам по себе отчасти понятен для носителей имперского наречия. От юношей чорсков — как мужчин, так и женщин — требуется вступить в [Glossary( 'бёта', 'GH_BOTAI_GLOSS' )], чтобы считаться взрослыми. Бётаи чорсков подчинены классу [Concept('magi','магов')|E] на псевдо-[Concept('aversaria','аверсарианский')|E] манер, при этом каждая бёта управляется как легион в миниатюре. Их концепция [Glossary( 'ардара', 'GH_ARDARA_GLOSS' )] вращается вокруг послушания [Concept('magi','магам')|E] и чистокровным, наряду с доблестью в [Concept('magic','магии')|E]. Чем чище чья-то кровь и чем могущественнее маг, тем большей ардарой он обладает. До [Concept('frodbrokna','Фродброкны')|E] чорски считали аверсарианцев чистейшими из всех людей, но после распада Аверсарии они пришли к выводу, что должны сами принять и удерживать Мандат Чистоты.\n\nОбщество чорсков прочно привязано к своим магам-королям, которые правят на аверсарианский манер и носят сочетание аверсарианской и кикарсагской одежды. Чорски придают огромное значение [Concept('living_magi','магам крови')|E] и в основном отказались от своих предрассудков против [Concept('dead_magi','магов земли')|E], хотя всё ещё считают их духовно уступающими магам крови.\n\nВсадники чорсков славятся своей дисциплиной и выставлялись в аверсарианских легионах в качестве ауксилиариев, хотя теперь они обращают эту дисциплину против своих бывших господ, становясь Избранными людьми.#"
 
 curgerski_desc: "#size:15    Кургерски были немногочисленны даже до Фродброкны, а теперь их стало ещё меньше. Они были самыми северными из северных племён, выбравшихся из [Concept('foglands','Туманных земель')|E], будучи вытесненными на окраинные и холодные территории, отвергнутые более крупными и могущественными кланами в прошлые века. До того как Имперрех вывел их в большой мир, у них никогда не было повода заводить постоянные поселения или становиться земледельцами, вместо этого они влачили существование в качестве кочевых охотников и оленеводов в суровом крае. Их орудия труда и оружие часто изготавливались из простых костей и камня, поскольку их земли были лишены каких-либо доступных месторождений металла, а большинство кургерских племён были слишком бедны, чтобы ими интересовались торговцы. Из-за этого собратья-сьялволки пренебрежительно называли их дикими и примитивными.\n\nНыне обосновавшись на бывшей [Concept('aversaria','аверсарианской')|E] территории, они постепенно переняли некоторые элементы уклада более «цивилизованных» кланов, но старые привычки умирают с трудом. Кланы кургерсков пользуются дурной славой из-за своей обособленности и недоверия к чужакам — к категории которых они относят и большинство других сьялволков.#"
 
 dadkawji_desc: "#size:15     Дадкавджи — это дружелюбный и космополитичный народ, обитающий вдоль Саррадонского Рога. Говорят, что когда-то они построили величественный город [Concept('magaala_qaaday','Магаала-Каадай')|E], а сами дадкавджи издавна славятся своими изумительными красителями. Их купцы удерживают монополию на торговлю красителями по всему [Concept('pirate_coast','Пиратскому побережью')|E] благодаря уникальным отношениям дадкавджи с соседними племенами илоходов. Многие дадкавджи красят волосы в яркие и экзотические цвета, а также носят сложные, детализированные татуировки на лице, которые определяют статус человека в обществе.#"
 
 dathanites_desc: "#size:15    Потомки саррадонских купеческих колоний на Дальнем Востоке, датаниты являются результатом уникального культурного слияния далёких народов и земель. Их далёкие связи дали им преимущество в прибыльных трансконтинентарных торговых сетях, а склонность их культуры к легализму привела к тому, что соседи повсеместно считают их справедливыми и нейтральными посредниками и арбитрами.#"
 
 daukeni_desc: "#size:15    Происходя из глубинки земель сьялволков, даукени заслужили среди своих собратьев-сьялволков репутацию своего рода культурных шовинистов. Если слушать рассказы самих даукени, их родина благословлена обильной дичью, щедрыми реками и климатом, идеально сбалансированным между жарой и холодом, чтобы взращивать самых стойких и отважных воинов во всём [Concept('aeras','Эрасе')|E], и уж точно среди народа сьялволков.\n\nДаукени никогда не считали, что дары богов человечеству скрыты от глаз, и верят, что сами они являются главными выгодополучателями этого изобилия. Как и остальные сьялволки, даукени были склонны к разобщённости, где каждый клан соперничал со своими конкурентами за территорию и славу. Они особенно известны своими [Concept('daukeni_saga','сагами')|E].#"
 
 dawasid_desc: "#size:15    Давас, дочь Мармала, была известна своим неугомонным нравом и безжалостной проницательностью, всегда готовой испробовать то, чего никогда не делалось прежде, ради выполнения задач, которые мужчины считали невыполнимыми. Так случилось, что давасиды пронеслись по западу Саррадона, появившись словно из ниоткуда, чтобы обратить в бегство Мадикриб и ритуалистов, стоявших перед ними.\n\nДавасиды с азартом переняли атрибуты оседлой жизни, многое перенимая и делясь сомнительным с теми, кого они покорили. Так произошло, что в короткие сроки вожди давасидов переняли вековые атрибуты традиционных талитских королей Саррадона.#"
 
 dayarka_desc: "#size:15    [Glossary( 'Даярки', 'GH_DAYARKA_GLOSS' )] — это ответвление банвагулов, происходящее от последователей [Concept('nari_daya','Нари Дайи')|E], королевы-воительницы древности. Будучи строго матриархальным обществом, они стойко оберегали не только учения, но и территории, завоёванные их королевой. Это привело к тому, что даярка прославились как более искусные воины и превосходные [Concept('magi','маги')|E], доведшие до совершенства искусство усиления физических возможностей человека с помощью заклинаний.#"
 
 deraani_desc: "#size:15    Коренная культура Тринапаавы и близлежащих островов, дераани славятся по всему Каширияту своими морскими традициями, особенно пиратством. Говорят, они превращают пиратство в изящное искусство, экстравагантно одеваясь и обучаясь танцевать со своими мечами с пятилетнего возраста. Каждый клан обычно владеет кораблём на каждые десять человек; из-за строгой клановой иерархии ни один мужчина или женщина не пригодны для брака или владения уделом, пока не захватят груз двадцати судов. Сражения между дераани обычное дело, но они обычно быстро разрешаются через [Glossary( 'Тьянан Руду', 'GH_TYANAN_RUDU_GLOSS' )].\n\nИх погребальный ритуал для капитана хорошо задокументирован и заключается в том, что труп капитана и любые члены экипажа, пожелавшие уйти вместе с ним, привязываются к мачте своего корабля и отправляются в свободное плавание по Пиратскому побережью. Хотя некогда это был причудливый жест, ущерб, наносимый торговым сетям региона, часто приводил к тому, что дераани закрывали доступ в порты для продажи их товаров.#"
 
 deresstae_desc: "#size:15    Налётчики дересстаи когда-то были бичом [Concept('aversaria','Расколотого побережья')|E], их сильная морская культура гнала их через море в поисках беззащитных берегов. Однако вскоре их собственный народ стал жертвой пришельцев из чужих земель, будучи порабощённым и принуждённым работать на фабриках тех, кого они раньше грабили. Знания дересстаев в кораблестроении были использованы для создания огромного флота Аверсарии, но знания о том, как пилотировать свои творения, подавлялись из страха, что это может быть как-то использовано против угнетателей. Теперь верфи, на которых они когда-то трудились, лежат в руинах, и миру снова пора бояться одного лишь вида дересстаев.#"
 
 dergi_desc: "#size:15    Происходя с западных островов Латунного моря, дерги представляют собой крайне обособленный ряд племён, которые стремятся сохранить красоту своих островов. Каждое изменение, которое они вносят на свои острова, должно быть одобрено их лидерами, иначе они могут разрушить совершенство своего рая. Наибольшего внимания в их культуре заслуживают грандиозные сады, поддерживаемые в их центрах власти, символизирующие красоту как их роли в природе, так и абсолютного контроля природы над самой собой.\n\nХотя они сохраняли своё стремление к изоляции, дерги сделали исключение для [Concept('aversaria','Аверсарианскую Аавтократию')|E], не желая, чтобы их леса сгорели в войне с массивной империей. [Concept('aversaria','Аверсария')|E] и дерги исторически не испытывали особых проблем в своём союзе, а имперские торговые посты благоустраивались в соответствии с прихотями коренных жителей.#"
 
 dielecender_desc: "#size:15    Находясь на перекрёстке великих империй, диэлекендеры издавна существовали как плавильный котёл культур. Хотя они и считаются сородичами [Concept('marchers','марочников')|E], они тем не менее сохраняют сильное стремление к независимости, присущее [Concept('shatteredisles','островитянам')|E], и уникальную идентичность, берущую начало от культур, которые древнее и тех, и других. Из-за своей истории и географического положения большинство дилесендеров многоязычны и считаются [Concept('dielecendian_compromise','способными посредниками и дипломатами')|E].#"
 
 diorenic_desc: "#size:15 Диореники, более чем любая другая культура анандраси, сформировались под влиянием своих отношений с [chevalie|E]. В далёком прошлом они долго враждовали со своими восточными соседями, что привело к строительству длинной цепи великолепных прибрежных укреплений, разбросанных по их островам.\n\nОтношения охладились после [Concept('red_river_war','Войны Красной реки')|E], из-за чего Диореникские острова даже называли «[little_chevalie_beyond_the_sea|E]», однако островитяне по-прежнему чтут свои древние традиции, особенно в производстве знаменитого деликатеса — [Glossary( 'дибрабал', 'GH_DIBRABAL_GLOSS' )]."
 
 doffore_desc: "#size:15 Коренные жители северо-запада Дамоты, где Гонанский тракт соединяет регион с остальным [Concept('sarradon','Саррадоном')|E], доффоре пользуются репутацией торговцев Дамоты. Большинство Доффоре так или иначе связаны с [Concept('karavuux_capital','Каравууксом')|E], и даже самый неприметный фермер играет свою роль на торговых путях. Это отражается даже на планировке их поселений: традиционно доффоре концентрируются в меньшем числе более крупных городов, чем их южные и восточные собратья.#"
 
 draneti_desc: "#size:15 Дранети — коренной народ центральных Армазлийских гор и прилегающего побережья. Их строгая традиция защиты местной фауны принесла дранети репутацию людей, которые добрее к животным, чем к чужакам. Несмотря на эту внешнюю холодность, они гордятся своими обширными гостевыми обрядами. Говорят, что даже самым заклятым врагам не откажут в защите, если они обратятся к дому дранети за помощью.\n\nВ силу своего благородства Дранети веками были излюбленными рабами своих соседей-амагейцев. Часто служа в домах своих господ, а не надрываясь на плантациях, дранети пользовались хорошим обращением достаточно долго, чтобы привыкнуть к своему положению. Отсутствие открытого сопротивления Амагее также уничтожило многие из их ранних воинских традиций, оставив дранети относительно дипломатичной группой как в мирное время, так и на войне.#"
 
 drothacny_desc: "#size:15 Не все мондеррны были порабощены аверсарианцами без сопротивления. Некоторые, придерживаясь совершенно иного религиозного кредо, попытались дать отпор. Это была тщетная попытка, ибо даже воинственные последователи Детедкланнского соглашения не привыкли к войне в том виде, в каком её знали аверсарианцы, и вскоре они были вынуждены спасаться бегством. Ведя непрекращающуюся партизанскую войну в дремучих лесах Катраддии, люди, которые впоследствии назовут себя дротеррнами, выковывались в горниле испытаний длиной в поколения.#"
 
 dubadin_desc: "#size:15 Коренные жители северного Митидона, дубадины веками томились в рабстве — сперва у иросси, затем у [Concept('aversaria','аверсарианцев')|E]. Несмотря на порабощение, культура дубадинов выжила благодаря силе их устной традиции, которая до сих пор хранит сказания о временах, когда они были свободны. Дубадины желают освобождения из рабства пуще всего на свете и пойдут на всё, чтобы его добиться.#"
 
 eastlighter_desc: "#size:15 Восточно-светцы определяются своей тягой к востоку. Будучи самыми разнородными из Одиноких светцов, восточно-светцы сформировали самобытную культуру в плавильном котле сотен различных групп, которые бежали на Острова и не смогли или не захотели продолжить путь на запад. Хотя они давно стали частью пестрого ковра культур [Concept('lonely_light_biozone','Одинокого Света')|E], они тем не менее оставались одними из самых ярых противников объединения с западом и часто возмущались властью, которую над ними имела Эгида. В сказаниях и песнях восточно-светцов их дом всё ещё лежит на востоке, даже когда сменяются поколения, а память о нём всё сильнее превращается в смутное воспоминание и забытый сон.#"
 
 ekaachi_desc: "#size:15 Отделившись от своих рахикайских родственников в конце VIII века, экаачи родились из неприятия постоянных войн между их королями. Для них идея гнать сильных мужчин и смышлёных мальчиков в реку после каждой неудавшейся стычки была отвратительна. Вместо этого они придерживаются политики свободной торговли вдоль портов своей реки и прилегающего побережья. Их одержимость торговлей среди земли воинов принесла им прозвище «речные шакалы», охотящиеся за честно добытыми трофеями войны с помощью расплывчатых обещаний и закулисных торгов.\n\nНесмотря на свою репутацию стяжателей, Экаачи гораздо более гостеприимны и открыты, чем их соседи, а их крупные портовые города привлекают гостей из мест столь далеких, как [aversaria|E]. Предоставляя право сражаться наёмникам, а не своим королям, выдающийся класс купцов Экаачи изрядно набил свои карманы. Экаачи бегло знают большинство каширских языков и как минимум одно слово в каждом иностранном: «бартер».#"
 
 erkalgani_desc: "#size:15 Эркалгани не могут противиться зову моря, отважно отправляясь в неизведанные воды для расширения своей диаспоры морских колоний вдоль побережий [Concept('western_aironoi_biozone','Западного Айроноя')|E]. Куда бы они ни направлялись, богатства Айроноя вскоре следуют за ними, поскольку бесчисленные купеческие флоты идут по стопам их первопроходцев, открывая новые рынки и связывая далекие народы. В результате города Эркалгани часто превращаются в хаотичный калейдоскоп соперничающих аванпостов и торговых станций, которые борются между собой за доли рынка и клиентов — зачастую не самыми честными методами.#"
 
 fedagesh_desc: "#size:15 Федагеши — потомки тех, кто продвинулся в северо-восточные земли после образования [Concept('boqqarut_damotada','Боккарута')|E]. Поскольку их раннее общество было сосредоточено вокруг массивных домов на несколько семей, они преобразовали многие из [Concept('lodges','орденов Раякуукс')|E] в [Concept('qabuux_capital','Кабуукс')|E], которые до сих пор имеют среди них огромное влияние. Закалённые борьбой за создание цивилизации посреди джунглей, Федагеши пользуются уважением по всей Дамоте как прилежные работники, верные своим общинам и возложенным на них ожиданиям.#"
 
 fenvir_desc: "#size:15 Несмотря на то, что они были среди самых малочисленных кланов, воины фенвиров с лихвой компенсировали нехватку численности безудержной свирепостью. Большинство из них жили в скромном достатке на открытых всем ветрам холмах, пасли свои стада или рыбачили у немногих рек, протекавших по их землям, влача скромное, если не сказать скудное существование. Когда зима приходила на их северные пастбища, они гнали скот дальше на юг, выменивая качественную шерсть на орудия труда и оружие. Однако их истинным призванием было отправляться из своих простых жилищ в чужие земли на поиски славы и добычи — будь то плата за их услуги на поле боя или, что случалось чаще, самостоятельный захват трофеев.\n\nФенвиры были одними из первых, кто увидел, как безумие [the_fog,'Тумана')|E] сходит с их холмов, но из-за своего полукочевого образа жизни они испытали гораздо меньшее потрясение столкнувшись с необходимостью покинуть свои нагорья навсегда.#"
 
 gallicads_desc: "#size:15 Галликады — древний народ Марки, обитавший в её лишенных магии холмах и долинах веками до прихода шевигадов. Вопрос о том, какая часть современной [Concept('marchers','маркской')|E] культуры восходит к народам, которые она заменила, остается предметом споров. В то время как древнее «Сказание о короле Бастионе» повествует о том, что основатель [chevalie|E] и его героические рыцари вели ожесточенные сражения ради обретения дома, свободного от злобных галлиенов, существуют также свидетельства того, что многие из столпов маркских обычаев и традиций были переняты у этих народов-предшественников, что указывает на то, что далеко не все контакты между ними были враждебными.\nИх общество разделено на иерархические касты, которые определяют конкретные роли и занятия человека на протяжении всей его жизни."
 
 gallien_desc: "#size:15 Галлиены представляют собой последние остатки галликадской культуры, подвергшиеся сильной ассимиляции и выжившие лишь среди холмов и гор, избежавших маркского заселения исключительно из-за скудной, каменистой почвы и упрямства местных жителей. Там они и живут, продолжая традиции своих предков в уединенных общинах.#"
 
 ghudiyy_desc: "#size:15 Одно из «бастардских племен» мармаладидских народов, Гудийи возводят свою родословную к паре героических близнецов, отпрысков Мармала, непризнанных другими великими племенами. Известные своим искусством верховой езды, великими династиями поэтов и глубоко укоренившейся традицией чести, Гудийи обосновались в высокогорной пустыне Центрального Саррадона.#"
 

 gisreddean_desc: "#size:15 Жители как Пети-Гисредда, так и Гранде-Гисредда, известные своей [Concept('gisreddean_banking_system','трудолюбием')|E] и яростной [Concept('gisreddepact','независимостью')|E], обладают уникальным набором [Concept('fraternity_of_gisredde','традиций')|E], [Concept('council_of_gisredde','правил')|E] и [Concept('conclave_of_gisredde_concept','верований')|E], которые отличают их от остальных [marchers|маркцев].\n\nОбладая [Concept('champion_era_gisredde','богатой преданиями')|E] [Concept('glorious_gisredde','историей')|E], которая ставит их в центр важнейших событий, а также будучи, по слухам, родиной [Concept('jan_va_gisredde','нескольких')|E] [Concept('champion_of_chevalie','героев')|E], гисреддцы считают себя самым сердцем [chevalie|Шевали]. Впрочем, эта гордость не лишена оснований, ведь гисреддцы всегда находятся в авангарде технологического развития, а самые ярые гисреддские фанатики верят, что даже когда [Concept('the_fog','тьма')|E] окутает мир, Гисредд останется последним светочем человечества.#"

 
 goan_desc: "#size:15 Гоанцы прошли через Серые Врата вместе с Ценваром, хотя сами не являются сьялволками. Они происходят с вершины горного хребта, приспособившись к высоте с давних времен. Жилища гоанцев высекались в скалах; многие из них стояли дольше, чем жившие в них племена, а некоторые и вовсе утверждали, что эти жилища принадлежали им с начала времен. Когда-то они пасли коз на высотах и периодически воевали между собой за немногие плодородные пастбища, что можно было найти в горах. Отвесные пики родины изолировали их от внешнего мира, о котором они имели лишь смутное представление.\n\nЭтому пришел конец с наступлением [Concept('frodbrokna','Фродброкны')|E], когда их жилища обрушились, пастбища раскололись, а с неба посыпались камни. Вынужденные объединиться, они начали исход из гор, где столкнулись с растущим воинством Ценвара и примкнули к его вторжению в [Concept('aversaria','Аверсарию')|E]. Потеряв родину, гоанцы теперь столкнулись с незнакомым миром. Они разрываются между желанием отыскать новые горы, чтобы вернуться к древнему укладу, и возможностью освоить пастбища и плодородные равнины своих новых земель.#"
 

 greulokin_desc: "#size:15 Слава грейлокинам, избранным сыновьям и дочерям [Concept('prohen','Прохена')|E], который кроит и отмеряет полотно человеческих жизней, отцу покорного [Concept('velos','Велоса')|E] и истинному королю богов [Concept('aeras','Эраса')|E]! Когда-то они были на подъеме — повелители великого королевства, состоявшего из других южных племен сьялволков, которых они заставляли платить дань. Ими правили Тейберлские короли, и, в отличие от современной сьялволкской теологии, они настаивали, что именно бог судьбы занимает главное место в пантеоне, ибо это он повелел Велосу наделить человека дарами и определить условия их сохранения. На практике функциональные различия, вызванные этим изменением, были невелики и ограничивались базовыми ритуалами, но пока Тейберлские короли оставались сильны, это позволяло им обосновывать свою роль верховного клана. Времена были хорошими.\n\nА затем Тейберлские короли погрязли в междоусобицах. Великое Королевство Грейлокинов было потеряно всего за одно поколение раздоров, когда их данники подняли восстание, а правящим кланам пришлось поумерить свою гордыню. Тем не менее, грейлокины продолжают почитать свой причудливо перестроенный пантеон и никогда не забывали, что когда-то были королями среди людей."

 
 guillater_aversarian_desc: "#size:15 Некогда граждане самой северной окраины древней [Concept('aversaria','Аверсарии')|E], неофретиты из-за упадка системы полисов и образования Аавтократы отдалились от центра и влились в плавильный котел островов Гийат. Эта общая история, а также желание превратить [Concept('shatteredisles','Острова')|E] в оплот, с которого можно было бы проецировать аверсарианский контроль над остальной частью архипелага, со временем заставили эту культуру вновь сблизиться со своими древними сородичами.\n\nНеофретиты также разделяют любовь к путешествиям и стремление увидеть мир за пределами острова, на котором они родились. Зачастую целые деревни отправлялись в долгие странствия в поисках нового дома, что сделало их народ одной из самых рассредоточенных культур на Расколотых островах. Эта склонность к исследованиям превратила их в умелых проводников и навигаторов, и на многих парусных судах нанимают рулевого-неофретита для помощи в плавании.#"
 
 guillater_desc: "#size:15 Гийятцы — живут ли они среди декадентских морских садов аристократии Де Иллитрат, среди затопленных и заросших мхом башен Питехея, в чужеродных локациях Ионделя с красными водами и синими берегами или даже в унылых и разросшихся трущобах торговых городов Ден Териатрикс — являются, пожалуй, самым разнообразным, гордым и успешным народом на [Concept('shatteredisles','Островах')|E] и, возможно, на всем [Concept('aeras','Эрасе')|E]. Названные в честь легендарного адмирала Гийята ден ва Крестоффексароффа, который в значительной степени освободил Острова от имперской эксплуатации со стороны [Concept('marchers','шевалиенцев')|E], [Concept('aversaria','аверсарианцев')|E] и конейкмеров, гийатцы могут говорить на языках своих бывших колонизаторов и казаться похожими на своих материковых родичей, но вместе они образуют совершенно уникальную культуру, определяемую не их родиной, а их ожесточенным отказом подчиняться кому-либо.#"
 
 gwasillikh_desc: "#size:15 Гвасиллихи — самое западное из Великих племен мармаладидов, которое, как утверждается, возводит свою родословную к покорителю и полубогу Гвасилу Темнонебому, чьи великие набеги опустошили весь Западный Саррадон. Избранные воины племени ездят верхом на гигантских летучих мышах с волчьими головами, которые, по преданиям, изначально были демонами, призванными на Эрас из великой пустоты ночного неба основателем племени. Они печально известны своими безжалостными ночными набегами, наводящими ужас на сердца их соседей.#"
 
 gwenuyos_desc: "#size:15 Жители среднего Касирьята, гвенуйосы заявляют о своем древнем и героическом наследии, которое столь же старо, как и сама Божественная река. Закаленный народ, они долго и доблестно сражались против повторяющегося ярма завоеваний и господства. В битвах, которые они почти всегда проигрывали."
 
 hamaxindi_desc: "#size:15 Хамаксинди имеют пре-амсарийские корни: их террасные города и крепости украшали высокие склоны долины реки Неуэльса на протяжении тысяч лет, задолго до Пророка и Хиклана. Столетия сосуществования и взаимообмена привели к тому, что культура хамаксинди в значительной степени ассимилировалась в амсарийской среде и теперь выделяется лишь горсткой уникальных фестивалей и причудами в костюмах.\n\nОднако в более близкие к нам времена они обрели известность благодаря прозе хамаксиндских поэтов — эта репутация сформировалась в различных дворах и литературных кругах по всему Хиклану. Это лидерство оспаривается в серьезной борьбе с хиксартийцами, а знаменитое соперничество между хиксартийскими и хамаксиндскими авторами на протяжении веков оставалось главной опорой амсарийской литературной истории.#"
 
 hixartii_desc: "#size:15 Хиксартийцы — потомки амсарийских гарнизонов, размещенных на тогда еще слаборазвитой северо-западной границе Хиклана для защиты от набегов хассаридитских племен, обитавших далеко на западе. За прошедшие с тех пор века крепостные города разрослись далеко за пределы своих глинобитных стен, раскинувшись по плодородным зеленым холмам и лесам региона, сельскохозяйственное производство которого стало соперничать с долиной реки Неуэльса. В сочетании с удаленностью от Ханхе-Пешамбры это привело к тому, что хиксартийцы стали печально известны своим стремлением к независимости, граничащим с сепаратизмом. За прошедшие века возник ряд попыток отделить эту территорию от Хиклана, в результате чего королевство Шуран в основном удерживалось амсарийскими регентами, присылаемыми из столицы.\n\nВозможно, именно из-за своих претензий на независимость от Хиклана хиксартийцы создали высокоразвитую собственную письменную культуру. Особую известность снискали их поэты, знаменитые весьма пикантной тематикой своих произведений и готовностью отходить от амсарийских литературных традиций. Их поэты также известны привычкой враждовать с хамаксиндскими авторами, и за века соперничества между этими двумя исторически грамотными народами было пролито немало чернил — и даже немного крови.#"
 
 hmaceak_desc: "#size:15 Хмачеаки — потомки миграционного флота с востока, который [Concept('samhatepaya','прибыл')|E] в Роджихлат-Мара в начале IX века. По прибытии они легко отвоевали себе территорию для жизни у [Concept('thu_usiktwe','ослабевших туземцев')|E], обосновавшись в древнем мегаполисе. Хмачеаки были активными торговцами, которые за века превратились в ведущую экономическую силу в этом регионе, а их порты служили важной остановкой на торговых путях из Саррадона на Восток. Однако со временем они утратили свой космополитичный уклад, переняв многие обычаи завоеванных ими народов.\n\nХмачеаки также широко известны своим мастерством в изготовлении красителей, что осталось им в наследство от восточной родины. Они используют многочисленных обитателей мангровых лесов для создания красителей самых разных оттенков, которые они щедро наносят на свои орудия труда и одежду, а торговца-хмачеака в порту легко узнать по ярко окрашенным волосам.#"
 
 hokanta_desc: "#size:15 Хоканта — мореходный народ южной [kashirya|Каширьи], который, как утверждается, мигрировал в этот регион еще до начала письменной истории. Хотя их происхождение туманно, многие [Concept('margur_migration', 'мифы')] пытаются дать на него ответ. Их общины широко известны проведением огромного количества пышных церемоний в честь праздников, свадеб или простых памятных событий."
  
 hudi_desc: "#size:15 Худи из западного Харадамата — народ, который на протяжении большей части своей истории определялся своей верой даже в большей степени, чем их соседи. На протяжении тысячелетий они отвергали как [ritualism|ритуализм], так и более поздний [wardenism|варденизм], вместо этого почитая Шуб-Йуагуаг — Мать-Кормилицу, вопреки попыткам проповедников обеих соперничающих религий обратить их в свою веру. Хотя в последние несколько веков они все чаще принимают варденизм, они и по сей день известны своей крайней консервативностью. За рубежом и в далеких землях они гораздо больше известны качеством своих ремесленных изделий — особенно оружия. Говорят, что ятаган Худи может прорезать стальные доспехи, как кинжал кусок ткани, и за них, как правило, просят столь же внушительную цену.\n\nС подчинением королевства Кудамаш в качестве вассального государства агионистами в 1161 году они обнаружили, что определяющие их строгие устои все сильнее вступают в противоречие с требованиями их новых [Concept('aversaria','аверсарианских')|E] господ. Роковым образом примкнув к повстанцам во время [faghira_jalil_revolt|восстания Фагиры Джалиля], они стали главной мишенью для сансианитской ярости во время [kahdavrakan_supper|Кахдавраканской вечери], и с тех пор в основном бежали со своей исторической родины в относительную безопасность [mamuramat|Мамурамата]. Оказавшись в кризисе и без дома, они пережили массовые обращения в варденизм, и, похоже, их древняя вера в Мать-Кормилицу вскоре окончательно исчезнет.#"
 
 huegodocs_desc: "#size:15 Космополитичная культура родом с территорий по ту сторону Серых Врат, хуэгодоки жили в ряде процветающих городков и мегаполисов вдоль Великой реки, собирая прибыльные пошлины и возделывая богатую почву. Когда прибыли [Concept('aversaria','аверсарианцы')|E], хуэгодокам хватило удачи и проницательности, чтобы договориться о относительно выгодных условиях мира: они стали подданными без гражданства, но остались свободными мужчинами и женщинами.\n\nОни были на пути к полной ассимиляции с аверсарианской культурой, и пройди еще несколько поколений, они могли бы стать почти неотличимы от своих соседей-апокиакасов, когда [frodbrokna|Фродброкна] обрушилась на [aeras|Эрас]. Когда стало ясно, что любые попытки аверсарианцев спасти местное население от наступающего [Concept('the_fog','Тумана')|E] недостаточны для спасения их местных союзников, хуэгодоки предпочли связать свою судьбу с коалицией Ценвара.#"
 
 hunawi_desc: "#size:15 Упрямые, твердолобые и скромные — вот самые частые характеристики, которые дают народу хунави из южной [kashirya|Каширьи]. Происходя от [margur_migration|миграции маргуров], хунави посвятили себя [katuppilan_biozone|биозоне Катуппилан], сосредоточив свои усилия на расширении солоноватых водных путей и мангровых зарослей, превращая их в основную экосистему юга."
 
 huxayakha_desc: "#size:15 Хусаяха — это народ аевакори, обосновавшийся вокруг Гахарина, ледникового озера в южном Хиратане. Гахарин занимает центральное место в жизни хусаяха, и большая часть их богатств извлекается из его глубин. Косяки пятнистой форели обеспечивают пропитание, шкуры гигантских саламандр продаются из-за их предполагаемых магических свойств, а ныряльщики за пресноводным жемчугом достают украшения из бездны. Это богатство привело к развитию крупных торговых путей по всему региону, и сокровища Гахарина появляются на рынках по всему Дармирату. Города хусаяха украшены озерными мотивами, а озерных духов почитают независимо от господствующих верований эпохи.\n\nВ результате обладания этими природными богатствами хусаяха защищают свои дома с яростью и являются смертоносными воинами. Известные своими стойкими копейщиками и быстрыми уланами, хусаяха не знают пощады, а берега Гахарина покрыты святилищами, посвященными древним королям-воинам.#"  
 
 iafarana_desc: "#size:15 Иафарана издавна называют своим домом первозданные воды Ночного побережья, хотя свидетельств об их [Concept('iafarana_historiography','ранней истории')|E] сохранилось немного. Несмотря на это, они сохранили свои океанические корни. Их массивные, безупречно сработанные корабли считаются одними из лучших на Пиратском побережье, а многие странные обычаи и практики, забытые по всему региону, сумели выжить на борту их судов.\n\nНавигаторов иафарана можно встретить на самых быстроходных судах побережья; их легко узнать по традиционным татуировкам, изображающим путеводные звезды на лице и шее.#"
 
 ikanita_desc: "#size:15    The Ikanita, descendants of native Deraani and Sarutan explorers, emerged after the [dharya_varha|E] and the expulsion of those loyal to the Dharyam Lon. Renowned as master shipwrights, they crafted larger and heavier vessels than the Deraani, using them to keep outsiders from the rich island of Wellatola — and at times, for piracy.\n\nThe great pit of Paccai Malai gifted them the distinctive gold bands that line their necks, and Rovarskan dragon leather is used to make thick shields and armor. Known for their pride and isolationism, they rarely leave their island save to trade or plunder.#!"
 
 ilahanai_desc: "#size:15    The Ilahanai have traditionally lived along the northern banks of the Theraskiyatt, but over the centuries have moved further inland. Their communities are tightly knit and centred around figures known as 'clan fathers'. These men are elected every thirty cycles of [aervalr|E], and are expected to arbitrate disputes, teach the young, and co-ordinate defences amongst their villages and towns in preparation for war. Whilst a peaceful and insular people, they are not unresponsive to the pleas of travellers, and will provide shelter or nourishment if needed (if only for a short while).\n\nNearly destroyed by the [chan_skorpokaipis|E], the Ilahanai have only grown more inward-looking with time, believing that the rest of [aeras|E] wishes them dead. Their insularism has transformed into xenophobia, and the clan fathers no longer wash the wounds of the bleeding if they does not know of their patient's family. Whilst once a quiet and unassuming rural culture, the Ilahanai have completely shut out the world out of a misguided belief that they are unjustly hated.#!"
 
 irmionoth_desc: "#size:15    One of the many Sjalvolki tribes, the Irmionoth have earned a fearsome reputation as brutal warriors. They place great importance on the concept of revenge, tracing this ideal back to their tribe's founding myth. In ancient days, when [Glossary('Velos','VELOS_GLOSS')]' gift was new, he made their ancestors swear an oath that whenever harm was done, they would reverse it upon its perpetrators. The leader of those who accepted this oath was named Irmi, and so would his tribe be called the People of Irmi, or Irmionoth.\n\nSeeking to uphold this contract, they began training, becoming ever more skilled at the arts of war. When the tribe was wronged, they would descend upon their enemy with a fury unmatched, and avenge every perceived slight. Internally, they held to a simple code, that everything must be proportional. If one were to be caught thieving, they would be required to return something of equal value in addition to the stolen goods. A feud would require the rivals to battle to the death, and so they were only invoked at harsh transgressions. With their entry into [aversaria|E], they have come to finally make the Empire pay its due.#!"
 
 iseni_desc: "#size:15    The Iseñi are a people native to the southern isles of Aironoi, most numerous across the mercantile crossroads that pass through the straits separating Opakhasia and Aironoi. They are a prideful people at heart, widely known for their extravagance across the southern seas. An Iseñi merchant-noble will place every coin earned through enterprise into their house and estate. Even the necessities for a mercantile operation, such as ships and guards, are emblazoned with noble regalia, steeped in symbolism to elevate their owner's prestige. Iseñi nobility are traditionally loathe to deal in 'petty' goods like iron, grain, and cloth; a merchant-noble's prized fleet is suited to carry nothing less than silks, gems, tapestries, artwork, and any other imaginable luxury.\n\nFollowing the [Concept('aversaria','Aversarian')|E] conquest of their home, the Iseñi were devastated, the majority forced by either state or circumstance to flee, most lost to the dangerous fringes of the Redlands. Some survive in the fringes of their home isles, clinging to crumbling villas and tattered heraldry, rebuilding a small semblance of former glory. A select few among them managed to maintain their wealth as trader families within the [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )], still renowned for their skill in commerce and fierce pride.#!"
 
 iyronisti_desc: "#size:15    The Iyronisti were once among the most powerful of the many tribes which inhabited Malcois, it is the topic of much scholarly debate if the name 'Iyrossi' is derived from them or vice versa, or perhaps a mere coincidence. Their isolation in the Teron Valley led them to develop strange customs considered absurd even by Iyrossi standards, preventing women from drinking alchohol and banning certain genders from wearing specific colours.\n\nTheir peoples were almost wiped out by a series of despicable slavemasters, using them in deranged experiments designed to inflict as much human suffering as possible. [Concept('aversaria','Imperial')|E] authorities learnt of the atrocities and swiftly ended the practice worried that the loss in population may disrupt the Malcois economy. Those who suvrived 'The Calamity' were responsible for some of the greatest works of Iyrossi literarature, speaking of the horrors they witnessed with their own eyes. It is said that these works helped kickstart what would become the slave revolt.#!"
 
 izikalek_desc: "#size:15    The Izikalek make their living tending to vast herds of cattle among the lush meadows and rich rivers west of the Great Steppe. Heirs to a long history of raiding and subjugation by their Sarminian and Öltenic neighbours, they have nevertheless endured in their ways, at times choosing to abandon their homes and settlements entirely and roam alongside their herds until the threat passes.\n\nMany an Izikalek village is centered around a monumental megalith they call the Herdstone. Seasons may come and go, buildings may burn down and be rebuilt, but with each passing generation, yet more of the stone is covered in ritual carvings telling the stories of the Leki people. In times when the pastures are green and livestock is plentiful, the roaming herders would return to their villages to celebrate the summer solstice, holding great feasts to honour the Red Maiden and seek her blessings for the years to come.#!"
 
 jaduyada_desc: "#size:15    The Jaduyada are the people of the eastern Kharadamat peninsula of [sarradon|E]. Residing in the immediate vicinity of the great [Concept('the_towers','Tower')|E] of [GetBuilding('01_sophocos').GetName], their culture was very likely the cradle in which early [ritualism|E] grew in the distant, forgotten past, and they were some of the most stalwart Sophocists during the entirety of [war_in_heaven|E|l]. Intensely sectarian in nature, they were only united under a single banner once in recorded history, preferring to instead be divided amongst as many clans as the mind can imagine.\n\nOn the upside, they are also some of the most free-thinking people in all of Sarradon, and are often lambasted as being borderline libertine by their more conservative neighbors. The intellectual diversity fostered in this environment has resulted in a wealth of artistic and scientific heritage that was the envy of the rest of the continent for centuries.\n\nTheir almost complete conquest by the Saintly Orders in the 12th century would soon be followed by repressions of massive proportions, and what little of their intelligentsia were left alive after the [judges_massacre|E] in 1207 would soon seek refuge in neighboring lands instead. The Jaduyadas' simmering rage has grown with each decade of Agionist mistreatment, and the culture has become markedly less tolerant of outsiders than it had been in the past.#!"
 
 jakana_desc: "#size:15    The Jakana are the eastern branch of the Nakahanii people, who had arrived to the Night Coast in the [akualion_tutil|E] of the 7th century. The Jakana trace their roots to the supporters of Mo'an 'the Blind', one of the three rival pretenders that emerged in the succession crisis that followed the murder of King Kaiatu 'the Navigator' and the monarch's most trusted advisor in life.\n\nAmong the greatest astromancers on all of [aeras|E], their knowledge of the night sky is practically unmatched, and their star lore is so extensive that it could fill a small library. Staunchly conservative and isolationist, the Jakana have adhered to their forefathers' way of life the most of all the Nakahanii — though this is not to say that their culture has remained completely static. Over the centuries, practitioners of astrological magic have gone from respected to practically venerated, and they have effectively slipped into magocratic rule.#!"
 
 jangkar_desc: "#size:15    The Jangkar are descended from the original Saradari diaspora in the Alaruhm Bay, having arrived in the area as their bretheren were scattered. Merchants and mercenaries, they would form cordoned-off communities throughout the cities of the region, tolerated for their valuable services, but just as often finding themselves the scapegoats of whatever recent calamity befell the local populace. Though characterised by cliques and sub-cultures as countless as the cities of the region, they would slowly form a loose, common identity over the centuries and largely resist attempts at assimilation.\n\nWith the founding of the independent Ayyar state by the Auzangeb, they have gradually migrated away from the foreign cities that were so loath to accept their presence in the first place to the far more welcoming arms of their compatriots in the east. Now largely settled along the eastern regions of the Liraaj, they mostly continue to live in communities determined by whatever foreign metropole they have originally arrived from. As such, it is difficult to pin down any universally shared cultural norms among them — perhaps a defining characteristic in and of itself.#!"
 
 jarakmar_desc: "#size:15    Found in the arid hills of [Concept('aironoian_southeast_biozone','Aironoian Southeast')|E], the Ja'Rakmar are a proud people of many stories. Boastful yet strangely intrigued by other cultures, they are said to commemorate battlefield victories and other significant events with a grand dance of flying axes known as [sevra_par|E], followed by grand feasts honoring the fallen. Masters of the rugged terrain, the Ja'Rakmari are unmatched in swift skirmishes, viciously exploiting any vulnerabilities they find to launch daring and destructive incursions behind enemy lines.#!"
 
 jassi_desc: "#size:15     Descendants of the various cultures brought to work in the factories, native Iyrossi and [Concept('aversaria','Aversarian')|E] punitive slaves, the Jassi are a melting pot of various different ideas and belief systems. Consider neither Iyrossi or Aversarian enough by their kin, they have been blamed both for the start of slave revolts and their failure. Despite this a strong sense of identity emerged within the Jassi due to their shared grievances, not clouded with delusions of the past, for the Jassi had also been slaves and nothing else, they saw the squalid conditions their people put up with for what it was, and wished for better. Treated with contempt by both the oppressors and oppressed made its mark on the fledging peoples, for as the slave revolt spread to their plantations and factories, the Jassi made no exception for those that had wronged, Aversarian or not. The Jassi represent the amalgam of the various cultures brought to work in Malcois and perhaps its future.#!"
 
 jayakayin_desc: "#size:15    Strikingly harmonious and level-headed when dealing with each other, the Jayakayin are one of Kashirya's most egalitarian societies. No member is allowed to fall into destitution, and none may hoard too much wealth and power — their rulers usually being elected in large gatherings of the local community.\n\nInternal warfare is rare among the Jayakayin, as intentionally harming their brethren is considered a grave dishonor. This makes them prefer banishment over execution, even in the most justified of circumstances.\n\nHowever, foreigners receive none of these privileges. The Jayakayin are some of the most ruthless corsairs on the Pirate Coast, with a particular penchant for slave raids and infamous for double-crossing prospective buyers, often robbing, enslaving, or killing them.#!"
 
 kadwana_desc: "#size:15    The Kadwana are an isolated people that live along the Katuppilan groves in southern Kashirya. They are primarily a fishing society; their communities consist of floating villages on the water and small ports along the groves edge that reach out into the sea. Due to the unwieldy nature of the Katuppilan and the dangers of its waterways, the larger polities of the region have often either left the Kadwana alone, or brokered deals with the local nobility.\n\nTheir long history living on the water has made the Kadwana excellent fishers and weavers. Most goods leaving their ports for wider Kashirya are sea foods and intricately weaved goods. The matriarchs of families are known to record their family's history through the use of skeins- long lengths of yarn knotted and weaved into patterns that detail the lives of their ancestors. Some skeins have been kept since before the [chan_skorpokaipis|E] though many were lost or destroyed in the ensuing disasters.#!"
 
 karana_desc: "#size:15    The Karana of central Kashirya are famed for their dislike of scholarly arts, instead dedicating much of their intellectual efforts to the preservation of their massive agricultural communities. Karana build their farms like cities, long rows of huts and homes alike with many hands to tend to the vast expanse of crops that stretch across the landscape. Travellers cannot walk a single mile without the sight of small towers dotting the landscape, where local intellectuals watch over the farms and study means to increase their efficiency.\n\nWhile the [chan_skorpokaipis|E] vindicated the culture's outlook on such arts, the violence endured against the Karana in the [dharya_varha|E] devastated many communities and forced a migration toward the Kharadan mountains. The towers that they once built for academics have become garrisons just as frequently; the swords of the Karana are never far from their ploughs after the violence of their history.#!"
 
 kardwens_desc: "#size:15    Native to the isolated forests of Katraddia, the Kardwen, a culture with seemingly no relatives on the continent, has developed largely untouched by outsiders. The deeply ingrained practice of head-taking, or [wo_ashanan|E] and ritual cannibalism has led to many peoples developing folklore around their existence and practices.#!"
 
 karkit_desc: "#size:15    The Karkit are the scions of the few Karana who fled westward of their ancestral homeland rather than east, trapped in a land of harsh hills and untameable forests. As a result of living on such an alien frontier of their home region, the Karkit lifestyle diverged significantly from their mountain-bound cousins. Instead of agricultural cities, the Karkit build small homesteads with lush gardens around them as a perimeter. One in every seven boys is chosen to train as Garden Warden, trained both martially and horticulturally. This guardian protects the humble gardening communities from their less passive neighbours, although a lone protector has historically not fared well against anything more threatening than lost bandits.\n\nA Karkit homestead usually consists of a single clan formed of seventeen families, between which childcare and medical assistance is a shared duty. Slow to trust but possessive of those they love, Karkit culture is built around a shared struggle in a land that is not their own. Whilst the young amongst them often pine for their lost home found only in songs and stories, the elders are known to be fiercely proud of the hills they have tamed.#!"
 
 karzarads_desc: "#size:15    The Karzarad are a mysterious people that hail from a land long since lost to memory, only appearing in the historical record some time after the [chaos_of_the_seventh_century|E].  A people with strong oral traditions, they venerate the most prolific and renowned of their storytellers. Their storytellers speak of a wondrous land with a sprawling and splendorous metropolis at its heart, a city that they say possesses a name unutterable by man. Yet, they also recount many other tales, of which many speak of a great tyrant called the 'Stymialtr' who was a cruel and capricious ruler despised by the Karzarad and the hardships they endured under his oppressive rule.\n\nSome learned scholars have proposed that these stories seem to hold a kernel of truth within them, though greatly embellished. Only adding to the intrigue surrounding them is their tradition of making oddly complicated mechanisms in various shapes and forms that are gifted to those who they hold dear as a sign of affection.\n\nDespite the enigma posed by their questionable origins, they remain a fairly mundane people with some lingering cultural oddities.#!"
 
 kawoch_desc: "#size:15    The Kawoch, native to Dibeda — or Inner — Damota, are often regarded as the most traditionalist of Damota's inhabitants. While all of the [lodges|E] hold prevalence in their society, it is the [Concept('rayakuux_capital','Rayakuux')|E], who even share their name with the Rayakuux Orders of old, that are most prominent, with nearly every Kawoch settlement of any size hosting a local chapter. Inhabiting the heart of the region, the Kawoch have long been considered the traditional rulers of Damota.#!"
 
 kazuw_desc: "#size:15    The people of [Glossary('Kazvosk','GH_KAZVOSK_GLOSS')] trace their lineage to the eldest progeny of the [Glossary('Bronze Sovereign','GH_BRONZE_SOVEREIGN_GLOSS')], a mythological demigod and patron of their palace-city. Prideful even by Sunakari standards, they see themselves as the rightful suzerains of the 'lesser' Kherkeloi palace-cities by the virtue of their seniority, and are eager to correct the perceived weakness of their wayward brethren. Honor-bound and unwaveringly loyal to their compatriots, the Kazuw stand ready to deliver their ideals on the tips of their sarissas.#!"
 
 kedari_desc: "#size:15    Secretive to the point of being considered nearly mythical, the Kedari are easily identified by their distinctive tattoos, which adorn their bodies from head to toe. To them, these markings tell the tale of a person's worth and stature, with the unmarked being seen as immature or unclean. Their tattoos also figure heavily in the peculiar magic that the Kedari practice, which, along with their generally unsettling appearance, has led to them being heavily persecuted by their neighbors due to fear.#!"
 
 khodomi_desc: "#size:15    The Khodomi are the Kherkeloi settlers of [kashirya|E], who have disavowed many of the insular customs of their western cousins in favor of a more mercantile and xenophilic outlook. Skilled sailors and seasoned merchants, the Khodomi have long found their way to the courts of distant lands as traders of luxuries, ranging from [Concept('zelkavani_glassmaking','glass masterworks')|E] and arcane silvers to purple-dyed fabrics and [Concept('durgumags','strange silks')|E].#!"
 
 khorinot_desc: "#size:15    The Khorinot have their origins in the [Concept('aironoian_migration','Öltenic Migration')|E], arriving in Aironoi either during or immediately after the [bayyuralar|E] to escape the stifling confines of their crumbling [Concept('otachedian_empire','empire')|E]. Spearheaded by the last generation of Otachedian martial aristocracy, the Khorinot have rapidly expanded westward, subjugating the entirety of the [Concept('great_steppe_biozone','Aironoian Steppe')|E] and quickly establishing themselves as skilled warriors and capable mercenaries well beyond the borders of their vast realms.#!"
 
 kinambrosti_desc: "#size:15    The Kinambrosti once called Lake Mytidon home, living on floating villages on its surface. The celebration of their patron deity Lady Selva was a sight to behold, the numerous settlements coalesced into one city and the vast amounts of petals collected from the lake's bank were poured into the water, turning its surface a myriad of colours. Of course this practice ended with the [Concept('aversaria','Aversarian')|E] conquest, although the cult of Lady Selva was incorporated into the Iyrossi Aagiokratan religon, becoming one of its prime deities. The lake they had called home since time begun was left in an uninhabitable state after the occupation of Malcois, and those who survived found refuge in lands to the west. This sanctuary was short lived as they were quickly put to work or sold into slavery, crushing any hope of returning to their home.#!"
 
 korlacan_desc: "#size:15    Refugees that worship the Fire God Korlacu, the Korlacan are a culture deeply intertwined with their faith. Dwelling in the remote mountain range of [Glossary( 'Chan Kyawkorlacu', 'GH_CHAN_KYAWKORLACU_GLOSS' )], they are great smiths and even better miners, making them prosperous despite their ostracization from Nattanan society. This draws the ire of their zealous neighbors, however, and only time will tell if the Korlacan will persist in the midst of this hostility.#!"
 
 kunsag_desc: "#size:15    The Kunsag are the settled descendants of the Old Kikarsagi who followed [toragei_kikarsag|E] across the [Concept('great_steppe_biozone','Aironoian Steppe')|E] and into the [Concept('the_continent','Continental Interior')|E]. [Glossary('Böta','GH_BOTAI_GLOSS' )] are central to the Kunsag culture, and youths who are found lacking in [ardara|E] are ostracised and deemed ineligible for marriage. Children reach adulthood with their first kill, be it an enemy, a captive, or a criminal, and Ardara is believed to be gained from bravery in combat, triumph over one's foes, and honoring the old traditions.#!"
 
 kuridorig_desc: "#size:15    The Kuridorig ancestors have once been the most militant of the [iorne_horde|E] tribes, tasked by [Concept('otachedian_empire','Otached')|E] himself to be the vanguard of his planned conquest of Aironoi. However, Otached's untimely death put a stop to these plans, and for almost a century, they remained the only Ölteni to cross the Kasiryat. Growing resentment over this fact has led many Kuridorig chieftains to oppose Baytor's demand for submission at the onset of the [bayyuralar|E], and many more still have perished fighting their supposed 'reinforcements'.#!"
 
 kutma_desc: "#size:15    Inhabiting the southeastern fringes of Damota, the Kutma have long carried a reputation as the mightiest warriors in Damota. It surprises none that the [Concept('waranuux_capital','Waranuux')|E] are the most prevalent of the [lodges|E] among them, with most Kutma expected to join one in their youth, and many remaining members for the duration of their lives. The Kutma are also known for their elaborately ritualized feuds, some with histories stretching to [pre_boqqarut_damota|E].#!"
 
 kyawkan_desc: "#size:15    Once part of the Korlacan heretics, the Kyawkan were found by Aung Naing the Fearless after he seized Korlacu's palace in the Great Crusade.\n\nSeeing them as misguided yet still kin, Aung Naing taught the Kyawkan anew about the teachings of the Twin Gods, and successfully restored their place among the Nattanan.\n\nNow dwelling within the mountain range of [Glossary( 'Chan Kyawkorlacu', 'GH_CHAN_KYAWKORLACU_GLOSS' )], they act as a zealous bulwark against threats from the west, serving to protect the people they once again call their own.#!"

 lahgardi_desc: "#size:15    For centuries, the Laman islands were home to quiet and insular Amsari communities, their livelihoods centered on modest fishing villages and scattered farmlands. The arrival of Siralagi refugees during the Dirhad Fever in the 10th century brought a wave of change. The blending of these two cultures gave rise to a society renowned for its craftsmanship, particularly their intricate weapons coveted across the entire region and shipbuilding techniques that rival and even surpass the finest works of Siralagi artisans.\n\nWhile trade with foreigners has varied over time, the main island has become a vital point of connection both within and beyond [amsar|E].#!"
 
 lainar_desc: "#size:15    The Lainar dwell within the south-eastern heel of Kashirya, and as such have developed a culture made for thick forests and vast wetlands. Their halls are built in concentric circles around great monoliths shaped like local fauna, such as the fearsome Gajara. Daily, their nobles bow their heads before the monoliths at dusk, and in return they are said to be spared from the worst attacks. Despite their customs, however, no creature of their titanic forests is known to spare them tooth or claw.\n\nThe houses of the Lainar are filled with people of all classes, as it is their custom to feed all who come to their table hungry. It is seen as a disgrace not to entertain a weary traveller or sing to those displaced by storms, and so the Lainar often train themselves in the arts of dancing and the playing of the Bansuri flute to ensure that none leave their halls without a smile on their face. Such hospitality, however, also made them easy targets for violence in the [vaarash|E], where their enemies would disguise themselves as starving beggars to murder Lainar leaders in their beds.#!"
 
 lakaloi_desc: "#size:15    The origins of the Lakaloi are buried in the sands of time, with many schools of thought explaining their existence on Opakhasia's southern shore. According to some they are a creole culture, the result of Yaar'nami expansion in the area, to others they migrated from Sarradon and for some they represent the last holdover of ancient Opakhasian civilization. The Lakaloi display a remarkable degree of variety, with festivals and customs changing from one island to the next. One such ritual is the 'Firebird; where a recently wedded bride is clothed in a ceremonial straw dress and set on fire by her groom, the bride then jumps from a sea-cliff to extinguish the flames in order to bring in a prosperous marriage.#!"
 
 lakoeng_desc: "#size:15    Originally derived from a derogatory remark for Kathuni born in the region of Dahangon, the long passage of time has seen the Lakoeng develop into a distinct culture of its own. Their proximity to major seaborne trading routes gave them a propensity for business, as well as a savvy eye for obtaining profit.\n\nDespite adopting many of the mainland's practices and their relative prosperity, they are nonetheless looked upon with disdain by those that style themselves 'true' Kathuni, and political factions within the [Concept('bureau_bronzeport','Bronzeport')|E] are often divided upon these cultural lines.#!"
 
 lattani_desc: "#size:15    Few are as steadfast in the face of adversity as the Lattani, the stalwart pastoralists of [Concept('aironoian_southeast_biozone','Southeastern Aironoi')|E]. Stewards of a land almost as harsh as the dreaded [redlands_biozone|E] to the west, these people have made it their own through grit, perseverance, and sacrifice. Lattani settlements are carved into the very bedrock of their rocky home, scores upon scores of dwellings carved into the sides of mighty desert canyons.#!"
 
 latti_desc: "#size:15    The Latti have dwelled in the [Concept('aironoian_southeast_biozone','Southeastern Aironoi')|E] for millennia, stubbornly eking out an existence amid arid hills and sandy canyons. A hardy and unassuming people, their rugged homeland has long shielded them from conquerors and pillagers alike, protecting them from peril through sheer remoteness and obscurity. As insular as they are, the Latti live in large communal groups of closely related families, sharing food and resources among themselves.#!"
 
 leriseb_desc: "#size:15    The Leriseb are perhaps the youngest of the Ayyar cultures, born of the gradual expansion of the Ayyar state into its traditional tributaries. As Ayyar from across Sarradon heeded the call of Sheyarla over the centuries, they moved into lands that had long been inhabited by the Canians, and began the gradual process of integration into a new society.\n\nEventually, when the longstanding Ayyar tributary of Vabhrund was officially annexed into the Liraaj, it became clear that a new culture had truly formed here, combining the long literary and linguistic tradition of the Ashital with the Ayyar virtues of prowess and glory. Interestingly, the main language spoken among the Leriseb is Canian, and even the population contains a large number of Ashital who embraced this new fusion of lifestyles, rather than the more clear-cut Ayyar majorities found further east.\n\nThe Leriseb stand on the edge of many worlds, upon the borders between faiths and civilizations. But they stand together.#!"
 
 leviden_desc: "#size:15    The drier environs and distance from any commercially valuable river systems mean that the Leviden never achieved the same level of prosperity as their Ashital cousins to the south. Nevertheless they are a hardy people, and have successfully harnessed the Four Rivers of Kabyar to turn significant portions of their territory into fertile, farmable land. Unfortunately this also made the region a target for foreign aggression, and in IS 615 the disunited Leviden kingdoms were brought under the rule of the Amsari Hiklahn. While they are far from slaves, the Leviden people have lost considerable ground in the ensuing centuries to Zaoranian settlers.\n\nLeviden culture tends to be more isolationist and conservative than their Ashital relatives, whom some even go so far as to accuse of having abandoned Canian practices and the religion of Eloi. Leviden villages often appear as clustered houses formed into a fortified compound, both to emphasize their clannish separation from the outside world and to defend against Ran Kemsari raiders ranging far down the dry Heya riverbed.#!"
 
 lihakan_desc: "#size:15    Originating from trading settlements between the Lainar and the Banwagul, the Lihakan have settled at the foot of the Southern Kharadan mountains, which they have mined for metals and ores for generations. Renowned for their expertise in bronze craftsmanship, they are esteemed for their intricate armors and cannons that are widely used throughout the region. The Lihakan have also inherited the hospitality of their neighboring cultures, and have developed a custom of gifting bronze trinkets to those that visit their mountain haunts.#!"
 
 lorodegi_desc: "#size:15    Zealous and diligent, the Lorodegi are descendants of a pirate fleet that, by happenstance, stumbled upon strange and ancient ruins of unknown origin. Declaring these megalithic structures as the work of the Ten Legendary Hero-Kings, they dedicated their lives to preserving and maintaining these monuments.\n\nSeen as an oddity by their Anandrasi kin, the Lorodegi rarely venture outside their isles. Despite this, they are renowned for their skill in stonemasonry, capable of emulating on a smaller scale the megaliths they revere.#!"
 
 luskos_desc: "#size:15    The Luskos are shrewd merchants and experienced caravaneers, making immense fortunes by facilitating the [kherkeloi_tin_trade|E] and serving as trackers and scouts of the [kalassyan_valley|E]. Vast tracts of wilderness are partitioned among Luskos families; each granted exclusive rights to guide caravans through their territory before passing them to another family. Their fees may be extortionate, but wise traders know to pay them in full, lest they may suffer coincidental attacks by the nearby Urkarith raiders.#!"
 
 madikirib_desc: "#size:15    The Madikirib are an ancient culture, with clay tablets written in their language dating back thousands of years. Their settlements, from small desert outposts to large cities, usually contain many subaeranean passages, with their libraries in particular being completely labyrinthine. Each of these settlements has a long history, with the same noble families often ruling over them for millennia.#!"
 
 madugi_desc: "#size:15    Famously insular, the [Glossary( 'Madugi', 'GH_MADUGI_GLOSS' )] are the northern brethren of the Madikirib. Fiercely protective of their ever-growing libraries, they tirelessly shield them from the eyes of outsiders and while rumors abound as to what might lie within these gargantuan subaeranean structures, none, save the Madugi, will ever know.#!"

 maebalah_desc: "#size:15    Descended from invading Marmaladids that occupied much of Rojihlat Mara after the death of Nasad Sinar, the Maebalah have since then fully integrated with the tribes of the land they now call home.\n\nThough less belligerent than their forefathers, they retained the brutal way of life shaped by the deep desert, which, to make things worse, was further influenced by the later arrival of the Tlakalaks. This has led many to fear the Maebalah, and while they are no longer as powerful and numerous as they were in the past, few still dare to cross paths with them.#!"
 
 mahatha_desc: "#size:15   Mahatha communities usually dedicate themselves solely to one craft — be it raising a certain crop, smithing a certain type of tool, or producing a particular trade good — and fiercely seek to utterly perfect their chosen expertise. As a result, specialized Mahatha wares are seen as some of the most pristine in quality and craftsmanship and are a coveted commodity.\n\nThis attitude even extends to piracy, which they proudly practice. Particularly, they've gained a reputation as the 'corsair's corsair' - targeting petty merchants and fishermen is seen as beneath most Mahatha fleets' dignity, and they instead seek out worthy opponents such as other pirates and protected convoys instead. An especially grotesque practice that they're known for is their tying up of captured enemy captains and rulers to the sides of their ships alive, with many of the most successful Mahatha raiders proudly sporting dozens of sea-eaten corpses across their hull.#!"

 mutsartan_desc: "#size:15    One of the [marmaladid_great_tribes|E] of the Marmaladid, the Mutsartan trace their ancestry to the eponymous Mutsar, said to be a giant of immense size who begat sons and daughters of similar stature. If true, this trait still runs deeply in the Mutsartan who are to this day known for their great stature, surpassing most lesser men. To the Mustartan this is a clear sign of kingship, and such individuals often find themselves pushed to greatness by the expectations of their clansmen.\n\nAmong the neighboring folk of Central Sarradon they have a grim reputation for brigandry and are generally regarded as yet another unruly hill tribe, much alike to the distant Barzawa.#!"
 
 nattanan_desc: "#size:15    Enigmatic Jungle-dwellers, the Nattanan live in relative isolation from the outside world. Indeed, despite living upriver of some of the most ancient farming civilizations on [aeras|E], the Nattanan have never adopted such brutish innovations as sedentism, agriculture, or any of the other trappings of so-called civilization. Fools call them simple barbarians, but in truth the foreboding walls of jungles and mountains shelters dozens of remarkably sophisticated and ancient clans of hunter gatherers who have spent countless generations turning their homeland into a cornucopia.\n\n Fiercely proud of their independence and relatively egalitarian way of life, those few outsiders who have conversed with Nattanan have noted that they generally seem to regard the notions of 'civilization' held by lowlanders with something approaching pity.#!"
 
 neshalar_desc: "#size:15    The Neshalar follow a strict creed of adherence to the so-called 'true' faith of their priesthood, despite their faith having changed many times over the centuries, never straying far from the path of their clergy or the way of their forefathers. Whilst their society has been held together by its strict cultural traditions, it has also grown weaker over centuries of war and famine brought about by their zeal and stubbornness. Whilst their scholar-priests, never far from the side of local aristocrats, have traditionally brought stability to their home, they have also kept the Neshalar weak in the eyes of their Zabari brethren.\n\nNeshalar women form the warrior class of the culture, after many theological discussions barred men from military service on spiritual grounds. Traditionally, they wore large metal bell-shaped dresses as armor, but over time their design has become less ornamental and more practical. Wars with the Zabari are not uncommon, and even the most delusional priests of the Neshalar could not stand to let tradition stand in the way of their survival.#!"
 
 nizhbata_desc: "#size:15    The Nizhbata, a pastoral people native to the northern Kashiryan highlands, primarily live on mountainside farms where they adeptly cultivate crops on steep terrain. Known for raising large herds of livestock, they particularly consider horses a special delicacy and are famed for their hearty dishes of horse meat.\n\nSkilled riders, the Nizhbata can shoot a bow with precision even without using a stirrup and some are even known to travel all over Aeras on naught but horseback.#!" 
 
 ordikin_desc: "#size:15    Known as bandits and beastmasters, the Ordikin (or Owl People in their language) have survived largely at the edge of civilization since days before the first [Concept('aversaria','Aversarian')|E] even stepped foot in the Clanlands. Known for the green cloaks and owl masks of their hunters and war parties, the constant Ordikin raids and constant punitive expeditions have nonetheless failed to ever remove them from the lands due to their use as mercenaries and monster hunters for many local lords. Holding themselves to the 'Oath of the Five', the Ordikin know they are a small culture, and thus within their lands they all raid as one clan.#!"
 
 oxalanti_desc: "#size:15    The fertile lands of east Mytidon have been tilled by Oxalanti hands for as long as anyone can remember. Although new overlords came and went, and new gods were brought from overseas, the determination of the Oxalanti people was never broken. They still hold onto hope that one day they will be free, free to work for their people, not the Scusstari or the [Concept('aversaria','Aversarians')|E]. The region itself is famed for its variety of wines, enjoyed by Aversarians and the upper echelons of Iyrossi society alike.\n\nIn a ceremony observed by at least 12 elders from nearby villages, an Oxalanti woman can become a man and vice versa. Some do this of their own volition, but many more do so because of the strict gender roles in Iyrossi society. Often there are not enough men or women in a village to fulfill the jobs which the gods have ordained for each gender, and therefore someone has to fill that gap. This practice deeply interested the Aversarian public when it was first documented, and became the subject of many plays and novels.#!"
 
 paerusik_desc: "#size:15    The Paerusik are an obscure and mysterious people, known to outsiders almost exclusively for herding [durgumags|E] and producing silkwool. Strangers to wealth or material excess, the Paerusik prioritize function over form in their daily lives, practicing great frugality in everything but their spiritual pursuits. Very little is known of their religious practices, with only a small handful of visiting explorers providing incomplete and often conflicting accounts of man-headed spiders, gilded temples, and hallucinogenic beverages.#!"
 
 paidem_desc: "#size:15    The Paidem, native to central Kashirya, are traditionally used by travellers as a marker for where the lush forests and plains grow dry in the approach to the Kharadan mountains. As a culture in control of many overland trade routes, the Paidem have slowly evolved to be a people famed for their discretion. The caravans of the Paidem often unload unexpected goods in foreign markets, and appear to leave without buying a single thing in return. Whilst bafflingly clandestine to most, the deals made by their quick hands often change the fate of their neighbors.\n\nPaidem girls are often trained as spies, reporting on the deeds of their husbands to their fathers and brothers. Such history has given outsiders a hesitancy to marry into Paidem families, and the once expansive lands of their kingdom have slowly shrunk since the [dharya_varha|E] and their failed attempts to play all sides against one another. However, a fall from grace did not stop the nobility of the Paidem; in the shadows, they still work to manipulate the trades of Kashirya to their benefit.#!"
 
 parakh_desc: "#size:15    The Parakh are the native people of central Kashirya, living in the transition zone between the great Kashti Salt Flats and the Darmirat plain. Their land is a harsh one of scrub and twisted Banyan trees, resulting in a subsistence based lifestyle not dissimilar to the ancestral population the Dayatemi descend from. While the Parakh may be derided as primitive by others on the Kashti peninsula, they hold a deep knowledge of their lands and zealously guard them from any intruders. Heavily tattooed and wearing ochre war paint, Parakh skirmishers are a fearsome foe on the battlefield.\n\nIn addition to their warlike reputation, the Parakh also retain a diverse oral culture, with numerous tales speaking of great warriors, terrifying beasts, and devastating magics. The most curious of these tales is that of Dahangon, a far off land said to be beyond the mountains, where the Parakh claim the Dayatemi peoples were created to serve the divine.#!"
 
 aersodiaxian_islander_desc: "#size:15    Phaelaxians, a branch of [Concept('aversaria','Aversarian')|E] culture, have historically been confined to an archipelago northwest of the [Concept('sea_tower','Imperial Tower')|E], known most commonly as Maeroiánnúlion. Surrounded by piratical cultures eager to claim them, these islands have become the site of many intense battles-the vast majority have seen the Phaelaxians victorious.\n\nWhilst the veneration of [living_magi|E] is prevalent in a similar form to many of their Imperial cousins, Phaelaxian wisdom esteems a loyal and unflinching spirit much more greatly than any raw power. Obsessed with discipline and self-restraint, [magic|E] is treated as a burden as much as it is a gift in their islands. With such unflinching values, they have largely shut themselves off from much of [Concept('the_continent','Greater Aversaria')|E] and the politicking of its [magi|E].\n\nPhaelaxians, whilst loyal and quiet, have often been regarded as false by their neighbors. Where some might name them perfect servants, the question of what words would be spoken were their tongues not held back has worried many who have ventured to travel their islands.#!"
 
 prapataro_desc: "#size:15    Elusive inhabitants of their forested homeland, the Prapataro are secretive and uninterested in outsiders, seeking to maintain as little contact as possible to avoid the spread of alien ideas or get involved in wars not of their own.\n\nMembers are considered to be fully-fledged adults at the age of sixteen, and are made to choose among the three [great_callings|E]: that of the Thinker, the Warrior, or the Cultivator.#!"
 
 pyanaki_desc: "#size:15    Diverging from their Ulakada brethren in the aftermath of the [murtuy_ka_varha|E], the Pyanaki sought to rectify their troubles by seeking answers in the hills beside the Kharadans. They built towns around still monasteries, quietly awaiting answers to the troubles that they had faced over the centuries, yet none came. Still, the Pyanaki have remained dominated by their spiritual leaders as much as their kings, seeing mystical truths as vital to their survival as food or water.\n\nThe Pyanaki have remained experts in hill warfare since they emerged, avoiding direct contact in favour of staging long series of ambushes in the hidden crevices of their mounds. Their society has also developed a strange system of seemingly random sacrifice every ninth year, killing a different amount of people for different reasons each time the command is given. Without such a practice, the Pyanaki might have come to dominate their homelands more comprehensively.#!" 
 
 qahsarides_desc: "#size:15    Prolific desert traders, the Qahsarides were the natives of the area now known as Ayyar. Using long caravans of camels protected by trained mercenaries, trade was brought from one side of the desert to the other safely. More recently, Qahsarides traders have given way to newer traders more directly related to Ayyar and the [mamuramat|E]. However, the heritage of the Qahsarides was not forgotten. While they are no longer famous traders, they still keep the tradition of raising camels, even if in modern times they're raised mostly for the milk, with most of their camels rarely going on long treks across the desert as their ancestors did.\n\nAlong with trading, they are known for being reliable mercenaries. Initially, Qahsarides mercenaries were mainly hired to protect traders, but as the region has destabilized further, Qahsarides mercenaries are more and more often involved in wars. The tales these mercenaries bring back home about the horrors of wars has led to their people being strongly against any rebellion in their homeland which could cause similar strife, leading to them being firm loyalists toward whichever state they live under.#!"
 
 rahikaya_desc: "#size:15    The Rahikaya are a famed culture of warriors, carving out many kingdoms along the winding path of the Kayawi River. Their painted faces are famed across Kashirya, with intricate patterns ranging anywhere from simple spirals to depictions of great battles against gods. With each battle won, the Rahikaya bathe their enemies' weapons in the river for three days and nights, and then reforge the shattered metal and wood into rings and bangles to wear atop their armor. After failure, one of every thirty in an army sacrifice themselves to Kartikarma by marching into the river.\n\nRahikayan society is heavily hierarchical, with a hundred different social orders signified by the colour of garb, style of hair, and size of dagger at a man's hip, amongst other things. Whilst such distinctions once meant a great deal to the Rahikayan nobility, greed soon allowed such honours to be bought, forever destroying any hope of coherence amongst the classes from town to town.#!"
 
 ran_kemsari_desc: "#size:15    The [Glossary( 'Ran Kemsari', 'GH_RAN_KEMSARI_GLOSS' )] are the people of what was once the imperial nexus of Kemsar. Though always somewhat distinct from the Almajun, the two cultures diverged most strongly during their separation in the Second Interregnum — at least, until the Battle of the Broken Chain. With the seemingly final destruction of the Kemsari Empire and drastically reduced mobility between the two halves of the former realm, their differences have grown even more extreme.\n\nDuring their heyday, they were perhaps one of the most decadent, opulent and artistically inclined peoples of their age. More liberal, cosmopolitan and urban than their southern kin, their influence on surrounding cultures was the strongest of all the Kemsari. Likewise, they were the group that has historically tended to adopt the most foreign habits — though of course, this was a fact that they fervently denied. Today, however, they have fallen far from the heights they once soared, and are a warlike, tribal culture barely scraping by in the searing wasteland that was once their bejeweled empire.#!"
 
 rivarisians_desc: "#size:15    Nestled between the Konijkmener and the Chevaliens, the Rivarisians have long made a living traversing the canals and rivers between the two. Though originally kin of the Konijkmener, they have become more [Concept('marchers','Chevalien')|E] over the centuries, integrating aspects of both into a unique blend. They place a strong emphasis on the water, with fishing becoming a replacement for farming in many settlements, and trade along the water being their main form of interaction with the world outside of their swamps. The construction of canals in the region was welcomed by the Rivarisians, who would rapidly integrate into the trade along them, filling roles from captains to dockworkers.\n\nDue to their position between realms, the Rivarisians are a melting pot of Konijkmener and Chevalien traditions, language, and beliefs. Their language is famously indecipherable, integrating a variety of stolen phrases and words into a nonsensical grammatical structure. To the Chevaliens, the Rivarisians are more Konijkmener than Chevalien, and looked down upon heavily, while few among the Konijkmener care how some sailors to the north speak. To most Rivarisians, however, this does not matter, for most care for little else than the boat beneath their feet and the oar in their hands.#!"
 
 saielaian_desc: "#size:15    Long conquered but never truly subdued, the Saielai have stubbornly nurtured their identity in the face of Kathun-Kai domination. Though they have enjoyed few periods of independence since the fall of the Kingdom of Shrunfan to the Great Western March in 722 IS, each subsequent rebellion and short lived state has become a piece of dearly held cultural mythos to the Saielai — though none have thus far lasted more than a decade before being broken by the hammer of Kathun-Kai reprisal. Nevertheless, their spirit has never truly been shattered, and their overlords have come to regard them warily as troublesome subjects.#!"
 
 sakankra_desc: "#size:15    There is no discussion of the Sakankra that does not mention the Kharadans. Atop massive hills and clinging to the faces of their home mountains, the Sakankra build massive temple-palaces that seem to touch the sky. Within, priest and lord sit on equal thrones, all decisions requiring a unanimous ruling from both to take effect. Crushed under the weight of their own priestly bureaucracy, the Sakankra have grown to be a patient and calm people, unwilling to let the stresses of their system bear down upon them.\n\nThe greatest crisis of the Sakankra came in the [chojakaan_ka_ghatada|E], where the great mountain citadel of Dihothah, the most ancient seat of Sakankran kings, disappeared. The Sakankra were thrown into a series of small civil wars that devastated their once prosperous and peaceful land. At the end of the struggle, only a single line of the ancient nobility was left to rule, and the long meditations at the top of their skyward temples became tied to long bouts of weeping forever more.#!"
 
 salisians_desc: "#size:15    The inhabitants of eastern [chevalie|E], the Salisians are the descendants of many of the first Shewigad settlers in the region. In some ways, they are the closest to the ancient Shewigads, having violently expelled the Gallicaders in ancient times. Only tasked with guarding a short border with the [the_lichdoms|E], the Salisians instead turned towards other pursuits. Fueled by investments from the ever-feuding church and nobility, the Salisians began developing advanced artisanal skills, especially in the realm of metalworking, with the nearby mountains serving as a source of material. With centuries of practice, they would reach a point where their weapons were superior to all those produced within the Marches, cementing themselves as the 'Forge of [chevalie|E]'.\n\nThis prestigious position has become ingrained in their culture, with a level of reverence shown to craftspeople comparable to that shown to Anti-Magi. It is heavily encouraged for a child to try their hand at an apprenticeship, and as such they are quite difficult to come across. When the Marchers go to war, they arm themselves with Salisian weaponry, and when they build they use Salisian glass and stone. They may not be glorious, but to Chevalie, the Salisians are critically important.#!"
 
 samayani_desc: "#size:15    The Samayani diverged from the Deraani in the early years of the 5th century, when the ancient kingdom of Trinapaawa was split between the two sons of Ajai 'Three-Fingers'. The younger of the siblings, Nakhu 'the Naga', created a culture of traders instead of raiders on the Samayani islands. Using swift ships so small that travellers often miss them, the Samayani hop between the islands and sell spices and goods from towns and villages they visit (albeit with as few scruples as their pirate ancestors).\n\nDespite their love of 'fair' trade instead of piracy, the Samayani are not unknown to be dominated by cliques of pirates living amongst them. The slow return of the culture to one dominated by piracy came following the [sabar_lambay_raad|E], when their Deraani cousins stole the most sacred of their jewels, the Paccai Padyma, from the home of their king in the chaos. With clever trickery and swift oars, the Samayani were reborn as hybrid pirate-merchants.#!"
 
 samojitian_desc: "#size:15    Once upon a time, there were no people living in the area surrounding the ancient [mayikrata|E]. It was not until the [magi|E] learned of the power within that settlements sprang up around the site and its surrounding mountains. But Magi were loathe to do hard work themselves, so the [Concept('aversaria','Aversarians')|E] would bring in slaves to work their mines, till their fields, keep their houses clean and warm their beds. At the start the slaves were worked to death, brutalised, used in rituals by the practitioners, but they were far away from the readily available slaves the rest of the Empire had access to. As decadence soon took hold of the Magi, the chains on their slaves began to loosen. Over time the slaves were allowed more autonomy, able to have their own families (of course, born into servitude) and splitting cultures started to develop within the insular slaves. These cultures are what the modern Aversarian would call a 'native.' Now the term Samojitian is the umbrella term for the four descendant slave cultures.#!"

 samorihya_desc: "#size:15    Dwelling deep within the forests of Central Kashirya, the Samorihya are renowned despite their remoteness — for nowhere else in Aeras exists a people that are borne aloft not by mere horses, but by the mighty elephant.\n\nMastering the art of raising and taming these creatures, elephants see use not only as steeds but also as draft animals that aid in farming. An ostentatious people, the Samorihya are usually seen bedecked in gold and jewelry, and their travelling parties are oft heralded by a thundering cacophony of trumpets.#!" 
 
 sarishta_desc: "#size:15    South of the great cities of the Yevanya and fertile fields of the Yonata, the Sarishta people live in the low lying floodplains alongside the tranquil Sea of Glass. Historically oppressed by their Chordhan cousins and subject to heavy tribute from the lords of Valapuiwan, many Sarishta have taken to the sea as respite.\n\nIn fact, the Sarishta are known as the finest ship makers in all of Darmirat, and have gained fame across Kashirya for their lightning-fast dhows. Each clan commonly owns several dhows, with their lateen sails decorated with images from Sarishtan folklore or symbols representing their home village. To celebrate their beloved ships, every summer the Sarishta gather to participate in the [Glossary( 'Jahaaji D\\'aud', 'GH_JAHAAJI_DAUD_GLOSS' )]. Due to their maritime heritage, many Sarishta make a living fishing in their home water, trading up and down the Kasiryat, and are a common sight on pirate vessels throughout the eastern seas.#!"
 
 sarminians_desc: "#size:15    The Sarminians are a matriarchal culture hailing from the far eastern edge of the lands now lost to the [Concept('the_fog','Fog')|E], where the thick forests thinned into hills and steppes, and the vast empire of Kathun-Kai is a more relevant threat than the distant [aversaria|E]. Their histories say that they were the western flank of a much larger nomadic federation, a rival and purported military equal to the Kathuni, but when the [frodbrokna|E] struck and the rest of their nation fled east, the Sarminians were unable to follow as the sea of [Concept('the_fog','Fog')|E] cut off the route.\n\nForced to flee away from their kith and kin, they pushed deep into the west before encountering the Imperrech. Since joining forces with the Witch-Breaker on the promise of new lands, the Sarminians have proven themselves fearsome warriors and as horsewomen skilled enough to rival the Kikarsags and Vhanavids.#!"
 
 sarthian_desc: "#size:15    Watered by runoff from the glaciers of the towering Khvasht range, the middle Neuoelsa River Valley has been turned into a veritable paradise, thanks in no small part to the diligent irrigation work by the Sarthians. The unique climate of their homeland is highly conducive to vineyards, and the Sarthians have thus developed a reputation for being canny and skillful vinters, their wines finding acclaim as far afield as [chevalie|E].\n\nBeyond their renown for Sarthians are by and large regarded as a polite and rustic people by their neighbors. This coupled with the pleasant climate of their homeland has meant that several Qanamsar have maintained summer palaces in the region.#!"
 
 saruta_desc: "#size:15    Found on the southern Night Coast, the Saruta are a nation of spice traders. Their vast markets peddle herbs and spices found only in the Pirate Coast, as well as the famed [phulikama|E]. The Saruta came to prominence for controlling shipping through the Cayvadaj Strait, building great watchtower cities that charged extortionate tolls for traders to pass. While these cities would eventually grow into trade hubs, they were born as havens of coercion, and the old tales speak of Sarutan pirates preying on those who avoided their ports.#!"
 
 sceyfig_lighter_desc: "#size:15    Hailing from the southern coasts of [Concept('lonely_light_biozone','Lonely Light')|E], the Scæyfig Lighters are a tough and hardy people. Most Scæyfig Lighters on the isle make their living on farming leeks and trawling the misty waters of the coast. There is a dock in front of every village, where women and children spend the day weaving giant nets or spearing any Spined Eels that get too close. To protect the village, each dock has a Sea Dragon that is painted down its entire length, along with dozens of lanterns attached to the sides to guide the fishermen home.\n\nThe many vessels on the coastline have led to several early detections of [Concept('liches','Lich')|E] fleets, leading to the invasion ending before it even sees the coast. Historically, the Scæyfig Lighters have avoided the trappings of glory and power, and as such regard the Aegis as a necessary evil to be kept at arm's length. However, their scouting skills on the water and their reliability during a crisis have led to Scæyfig Lighters being declared The Aegiskiep at many a Scælzamotk.#!"
 
 seylulid_desc: "#size:15    The Seylulid are the most eastern of the desert tribes, regarded at best as a [Concept('marmaladid_great_tribes','Marmaladid bastard tribes')|E] and at worst as no true kin at all. Nevertheless, they claim descent from Nisheriha and his husband Seylul, a supposed son of Marmal, who was foretold by a magi-oracle that he would find and marry the legendary princess Nisheriha, daughter of great lineage and queen of old, in the distant east. To reach her and her tribe and prove himself worthy, he was to tame the giant desert serpent Sumol and journey eastward subduing each settled tribe he met to submission.\n\nThe ways of the Seylulid are as brutal as those of their Marmaladid kin, and at times harsher still. They have so far resisted attempts at conversion, more recently with violence against Wardenite proselytizers. So deeply attached are they to their way of life that their invasions of the Crater over the centuries have all ultimately ended in their return to the desert.#!"
 
 scusstari_desc: "#size:15    Confined to the least fertile portion of the Iyrossi Basin, the Scusstari have always punched above their weight, their folk heroes having resisted [Concept('aversaria','Aversarian')|E] rule long after the death of [Concept('the_last_iyrossi','Pothacleas the last Iyrossi King')|E]. Despite their humble origins, the Scusstari rose to dominance partly due to their [Concept('scusstari_guerilla_warfare','masterful use of guerilla warfare')|E]. Although other tribes may disagree, the Scusstari adamantly maintain that they have stayed the closest to the [Concept('old_iyrossi_culture','customs of the Iyrossi of old')|E].#!"

 shewigads_desc: "#size:15    The Shewigads are the precursors to the modern Chevaliens, having migrated into the region over a millennia ago. Prior to their migration, they had existed for centuries as a group of tribes, fighting amongst themselves over resources and grudges. This age of internal conflict would be brought to an end by the Ethylisiads, who would conquer and enslave them. Over their centuries of oppression, the Shewigads would learn the ways of civilization from their masters, beginning their metamorphosis. Eventually, they would rise against their masters, though who exactly led them in this is unclear. Some claim that 'Sir Ranos', the figure who supposedly led them in rebellion, is nothing more than a fairy tale, while others claim that Ranos was simply Bastione.\n\nNonetheless, it is known that after their revolt, Bastione would unify them, and lead them westward into the lands now known as [chevalie|E]. The native Gallicads would be conquered through a series of wars, leaving the land open for their settlement. Over the centuries since, the Shewigads have mixed with the Gallicads, forming into the people of modern Chevalie. Though none living can now be considered Shewigad, their legacy lives on in the myriad of [Concept('marchers','Chevalien')|E] cultures.#!"
 
 siklasa_desc: "#size:15    The Siklasa were born in the hilly landscapes of eastern Vichacil, developing an itinerant culture that clung close to the southern reaches of the Kharadans. Absolving themselves of all material goods, the Siklasa have traditionally lived peaceful and isolated lives far from the politics of Kashiryan court culture. However, their long separation from the rest of Kashirya was utterly destroyed by the [chan_skorpokaipis|E].\n\nTorn apart by legions of undead in the [murtuy_ka_varha|E], forced to choose sides in the [vaarash|E] despite possessing no real understanding of the conflict, and practically exterminated in the [dharya_varha|E] for fear they were aiding the riotous mobs, the Siklasa have been forced to remain in a small piece of what used to be their ancient grounds. They remain isolated and egalitarian, unable to comprehend why monarchy must be imposed on them if all it brings is death.#!"
 
 siltwalker_desc: "#size:15    Siltwalkers are tribal herds people found on the Horn of [sarradon|E] known for their practice of walking on stilts. The Horn's fields flood to such an extent that these long stilts let the tribespeople cross the flooded wilderness with ease. It is said that the Siltwalkers learned this from the giant spindle-leg crabs that they now domesticate, and sometimes venerate, whose long legs keep the crabs out of danger from the rising tides. The Siltwalkers have managed to maintain their peaceful existence for so long thanks to their storied relationship with the nearby Dadkawji cities.#!"
 
 simevian_desc: "#size:15    The smallest of the three Canian cultures, the Simevians are the nomadic people of old Kabyar, traditionally eschewing permanent settlement for a more itinerant lifestyle. While the Ashital and even the Leviden tend to regard their wayward cousins as little better than savages, in truth the lines between settled 'civilized' farmers and wandering 'barbarian' herders tend to be blurred in the margins of rural society. When farming is no longer an option many Canian agriculturalists fall back on nomadism with their goats and sheep to survive. Thus, a surprising number of Simevian clansmen are in reality only a generation or two removed from their settled brethren.\n\nThey are a devout people, and though their settled cousins may sneer at their parochialism they are renowned for their poetry and notorious for their resourcefulness. As their identity is in large part built from their hard-bitten lifestyle as opposed to any geographical origin, adoption of outsiders and even slaves into Simevian clans is a widespread practice, and those who are so adopted can rise far if they are ambitious.#!"
 
 sindaara_desc: "#size:15    The Sindaara hail from the inner forests of Kashirya, remnants of a native culture from the Night Coast that was displaced after the arrival of the Nakahanii in the [akualion_tutil|E]. Where they once guided trade through the treacherous waters of the Pirate Coast, they also found success guiding merchants and travelers through the misty forests. However, armies have a harder time finding passage through Sindaaran lands; the Sindaaran more likely to harass any threat to their homelands.\n\nThe Sindaara are also renowned across Kashirya for the [Glossary( 'Daarā❜putalnī', 'GH_DAARAPUTALNI_GLOSS' )] and travelling puppeteers can be found all across Kashirya, dispersing knowledge and wisdom in addition to entertainment. Though, many a Sindaaran have found themselves at the wrong end of the blade due to a risqué joke at a ruler's expense.#!"
 
 siralagi_desc: "#size:15    The Siralagi dwell in the north of the Hiklahn, centered around the Damdama bay but found scattered all along the long northern coastline. Their society is dominated by the sea, with fish and other products of the sea making up a large part of the traditional Siralagi diet. They are also notorious for piracy, with Siralagi corsairs ranging as far afield as Kharadamat in eastern [sarradon|E]. Their fellow Amsari seafarers are usually spared from being raided or held for ransom by Siralagi privateers of course, but in lean times it has not been unknown for them to prey on their fellow countrymen.#!"
 
 skausmas_desc: "#size:15    The most unique of the slave cultures, the Skausmas were also the most changed. Living the closest to [mayikrata|E] in unique buildings designed for the [magi|E], their bodies warped by their proximity to the Academy. While it was this that drove them to despise [magic|E], it was the role the Magi used them for that made them hate their masters. As the depths of magic were explored by Magi it took a toll on both their mind and body. It would not take long for their partners to grow afraid and find themselves alone in bed. That is where the Skausmas come in, to play out any fantasies their master's demented minds dreamt up.\n\nAt first when Cenware attacked, the Skausmas were content to sit back and watch their world burn. It was not until fear of their masters being replaced by another from barbarian tribes did they revolt.#!"
 
 skoronyk_desc: "#size:15    Hailing from the far reaches of the Western [Concept('shatteredisles','Isles')|E], the Skoronyk are an insular people rarely seen beyond their home isles. Once migrants from the far north, centuries of isolation have fostered a traditionalist culture and strong communal spirit central to their survival, adapting to the harsh realities of their rugged and inhospitable home. An extraordinary strength of belief has seen many a Skorony sacrifice themselves for their faith, remaining loyal to ancient beliefs long forgotten by the rest of [aeras|E]. The few scholars willing to study their literary tradition have praised Skoronyk hymns for their use of a unique strict meter, Kinkanet, as well as their masterful portrayal of endless longing and unrequited devotion.#!"
 
 sunakari_desc: "#size:15    The Sunakari are a proud yet peaceable people, dwelling in the many insular palace-cities along the shores of the Sea of Glass. Staunchly independent and adhering to a strict code of warfare, they are as diverse in custom and tradition as they are unified in their ubiquitous sintered quartz artisanry and use of tight sarissa formations. Each Sunakari settlement is believed to be blessed by its own patron saint, with vast temple complexes built in each palace-city to honor them and pray for their continued protection.#!"
 
 surugin_desc: "#size:15    Descendants of the colonists who left Krehejad on their 777 ships. The [Glossary( 'Suru\\'gin', 'GH_SURUGIN_GLOSS' )] have found their new home among the humid mangroves of Cyrat. Following the [Concept('aversaria','Aversarian')|E] conquest of their homeland, the followers of E'hat'm were scattered far and wide attempting to find a new motherland but without doubt the most successful of these ventures was surprisingly the various outposts which settled along Cyrat's unforgiving coasts. While these isolated settlements were once confined to the shore of this mysterious landmass, a combination of local knowledge and trial and error allowed the Suru'gin to penetrate deeper into Cyrat's harsh interior, establishing successful kingdoms in the process. One of these innovations was the use of spirit skin, a lotion made from the sap of the native Xapanta tree, protecting the wearer from the hordes of mosquitos which plague the dense and colourful jungles.#!"

 swabani_desc: "#size:15    Born from a mixing of dissident Ilahanai in Yadaniyan cities, the Swabini are a cosmopolitan culture that dominates the artistic sphere of the northern Theraskiyatt. An expressive nation at their core, the Swabani view the greatest pursuit in life as the arts, and thus have thriving urban centres filled with fashions, sculptures, and music arguably unmatched for hundreds of miles. Swabani masters are often seen in the cities of the Darmirat playing upon their mardalas or performing esoteric plays beside the Katuppilan Grove.\n\nHaving emerged in the prosperous days of the [taryaad_saramsaasan|E], the Swabani have always been more performative than skilled. Without his drum, a Swabani master knows no music; without hours of practice, he does not know the words to the tragedy he performs every night. When the [vaarash|E] came, the Swabani failed to survive outside of a few cities and lost many of their great music halls in the chaos that unfolded around them. However, the Swabani have maintained their love of the arts through their many hardships, and their endeavours are still respected across much of Kashirya.#!"
 
 sycharcegs_desc: "#size:15    The Sycharcegs are the descendants of the Kikarsagi who served the [Concept('aversaria','Aversarians')|E] as mercenaries and Legion auxiliaries in wars of conquest and in the suppression of slave rebellions. Renowned for their brutality, the Sycharceg [Glossary('böta','GH_BOTAI_GLOSS')] demand the presentation of a human head in the coming-of-age ceremony for one to pass into adulthood, and [ardara|E] is measured by the number of enemy heads taken on the battlefield. Cowardice stains the entire bloodline with iniquity that can only be fully cleansed by a son taking the head of his disgraced father.#!"
 
 tafara_desc: "#size:15    Enslaved to the Kemsari in the days before the sands, the Tafara now make a living by looting the fallen sky-cities of the God-Kings, trading scavenged copper ore and arcane artifacts to eke out a meager existence in the harsh desert.\n\nConstantly exposed to dangers, both from bandit-ridden caravan routes and ruins bearing ancient-yet still functional-traps, the Tafarans have become honed warriors by necessity. Nowhere is this more evident than in their famed Sandsingers, warrior-priests whose might are renowned across the south.#!"

 tahanati_desc: "#size:15    Nestled against the Kharadan Mountains, the Tahanati are a people as hard and unyielding as their homeland. Clinging to traditions abandoned centuries ago by their neighbors, the Tahanati care not for passing fashions or new innovations. Their hills have defended them throughout their long and proud history, and they have never put stock in the word of any advisor who has not lived into their seventh decade.\n\nAs a result, the lands have of the Tahanati have never grown greatly outside of their native hills and mountains. Their stubborn pride is often dismissed as arrogance, and their ancient traditions, such as drenching newborn babies in spiced water to root out evil spirits, are derided as archaic. Despite their hardships, both within and without, the ancient wisdom of the Tahanati has yet to be abandoned.#!"
 
 taminiai_desc: "#size:15    Found amongst the hills beside the southern Kharadans, the Taminiai are a people known for their unflinching dedication to the protection of the ancient citadel of their people, Asmour. Once counted amongst the Siklasa, they were assimilated by a foreign ruling elite of Athacaya stock, losing much of their reluctance to greater Kashiryan interaction. As a result, their roaming traditions have been turned toward warfare, to great effect.\n\nHistorically masters of the ambush, the Taminai have integrated many long pilgrimages to ancient spots of military victories where their independence was secured in the long years of the [chan_skorpokaipis|E]. Upon these spots, mountain temple-forts have been erected which watch over the landscape, awaiting the final coming of the greatest apocalypses to dwarf the [murtuy_ka_varha|E]. The [frodbrokna|E] was one such sign of the coming of a new age of troubles to them, and their temples have quickly turned the Taminiai into warriors once more.#!"
 
 tanumarei_desc: "#size:15    The Tanumarei are skilled hunters, found in the northern parts of the Kashti flats and the bordering plains. Historically serving either under the mercantile realm of Kashti or the hilly kingdom of the Uthanata, they have been subjected to harsh cultural assimilation by both polity, usually leading to large scale unrest in majority-populated regions.\n\nTheir culture emphasizes hunting and on the importance of the flora, with scholars training to become adept herbalists to treat the weak and wounded, particularly when returning from a hunt. Their Öltenic history manifests in their strong warrior like nature that has taken inspiration from legendary warriors like Otached, and believe that only by adhering to the codes of war established by him many centuries ago, can a such leader rise again to bring them a step closer to their freedom.#!"

 tasurmad_desc: "#size:15    The Tasurmad are the people of the Bay of Sihnamiyah, frequently regarded as a region of [aeras|E] with one of the longest records of settled, urban civilization. Starting from the legendary Hundred Cities that dotted the land starting some four thousand years ago, the area would come to be the birthplace of no less than four major empires over the next two millennia. With the collapse of the Arakkariac Empire in the 4th century BI, the local denizens would gradually come under the increasing sway of [ritualism|E], which would bring them into the growing sphere of pan-[Concept('sarradon','Sarradonian')|E] culture.\n\nOwing to the fertile soil and pleasant climate of their homeland, they are rarely forced to endure a bad harvest, and their nobility is used to the kind of extravagant displays that would find themselves at home in Opakhasia or Sereksi. However, this decadence should not be confused for softness, as the Tasurmad have been more than capable of holding their own in the countless cycles of wars of expansion and collapse in their long history.#!"
 
 tehaina_desc: "#size:15    The Tehaina are the northwestern branch of the Nakahanii people, who had arrived to the Night Coast in the [akualion_tutil|E] of the 7th century. The Tehaina trace their roots to the supporters of Ha'ulili 'the Kind', one of the three rival pretenders that emerged in the succession crisis that followed the murder of King Kaiatu 'the Navigator' and the monarch's adoptive son.\n\nThe most divergent of the Nakahanii branches, the Tehaina have intermixed heavily with the natives of the region, most of all the Lainar, who had famously welcomed Ha'ulili's stormed-damaged fleet into their protection. Like the other Nakahanii, they are impressive seafarers, and even more impressive divers — with many Tehaina families making a living by scouring the warm, luminescent seabeds of the Night Coast for pearls, coral and other bounties of the sea.#!"
 
 theugombrians_desc: "#size:15    The [theugombrians|E] have no homeland. They have wandered the Continental interior since time out of memory, occasionally setting down roots on small patches of wasteland to farm or herd in heavily fortified communities, but more often roaming in great caravans, setting down fortified camps for a few weeks or months at most. Their culture stresses both discipline and martial training for youths of both sexes and they are often referred to by chroniclers and poets as an army without a country. Indeed they often sell their services as mercenaries or auxiliaries to anyone who will pay.#!"
 
 thyssae_desc: "#size:15    The Thyssae are a hardy and warlike people dwelling in the upper river valley. They have a proud history, and largely consider themselves no less than equals of their downriver Amsari cousins. Often serving as the first line of defense against Ran Kemsari raiders, they have developed a robust martial tradition. Every man and woman from the age of thirteen who can be spared from fieldwork is expected to be trained to fight with a spear, and many Thyssae towns are heavily fortified. Because of this, when Amsari Hiklhan armies march to war, their ranks are often swelled with Thyssae recruits. On the other hand, this manpower has also meant that the Thyssae have been able to assert de facto independance from the rest of the Amsari on no less than two occasions during times of extreme crisis for the Qanamsar, both periods lasted for the better part of a century before control was restored.#!"
 
 tlakalak_desc: "#size:15    The Tlakalak are the remnants of a once-flourishing culture, clinging to the traditions and stories of their once-mighty ancestors. Following the [xihuetzi|E], they pushed ever deeper into the deadly and mysterious jungles of Cyrat, their culture shaped by the brutally harsh conditions found within the verdant hellscape. Though five great cities had once symbolized the nuanced diversity of a rich culture, the huddled camps and ramshackle shelters of survivors abolished such distinctions. All Tlakalak were in a dark place together, clinging desperately to the dying memories of a lost civilization.\n\nOver the centuries, however, the Tlakalakans have adapted. Armed with their ancient tradition of [magic|E], and with the knowledge of a settled society, they set about the task of survival, and found it. It is a narrow survival, one which requires constant sacrifice and hardship, but they have no other choice. Armed with the last magics and memories of the [necentlal_tlaklaktli|E], and with the faith of their ancient temple orders, the Tlakalakans will continue to endure.#!"
 
 tribocicai_desc: "#size:15    The [Glossary( 'Tribocicai', 'GH_TRIBOCICAI_GLOSS' )] claim descent to the legendary hero sisters of Sjalvolki myth. Abandoned by their clan at birth, and pursued to the ends of [aeras|E] by the brutal and lustful King Odda, they beseeched the gods on their knees, asking to be buried in the soil from which humanity sprung. The gods granted them their wish, and from their wombs grew the first trees. The Tribocicai claim that the first of their clansmen fell from these trees a fruit. They bury a portion of their harvests, each year as an offering to the sisters in hope that the following years crop will be even more bountiful.\n\nAlthough, the Tribocicai yearn for their farmsteads and fields of old, they have found their new home to be even more fruitful, for as long as there is land under their feet they know they are under the protection of their ancestors.#!"
 
 trustian_desc: "#size:15    Native to much of northwestern [chevalie|E], the Trustians are the group from which the Voyagen split. While their cousins were conquering foreign lands, they stuck to their traditional way of life, staying within their rural homes. They are almost entirely farmers, with their vast fields providing sustenance for much of the Marches. Their lands have often been battlefields, the repeated civil wars and [Concept('liches','Lich')|E] invasions having touched nearly everywhere they inhabit. These threats have united them, forming a culture where collaboration and community are prized.\n\nTheir close internal ties have only strengthened the perception of the rest of Chevalie, that the Trustians are meant to follow, not lead. Though others may prize strong leadership, they seek stability, as the rest of the nation tears itself apart repeatedly over ambition, they continue their lives. Though they inhabit many of the poorest regions of the Marches, partially on account of the wars fought upon its ground, they are content with their lot. Whatever fate awaits Chevalie, the Trustians will stand together against it, as they have so many times before.#!"
 
 ualeren_desc: "#size:15    Having long dwelt in deep and remote caverns, the Ualeren emerged following the [Concept('the_decimation_of_sarradon','Halakdun')|E] to find themselves in an unfamiliar world. Sharing no characteristics or similarities with the nearby tribes, and heavily favoring the underground expanse they once called home, they have taken to dwelling solely within caves upon the mountainside. Despite their extreme isolation and distrust of outsiders, adventurers and warriors have often sought the Ualeren's mountain haunts, for their skill in shaping metal is unsurpassed in all of Aeras.#!"
 
 ukininkas_desc: "#size:15    The Ukininkas were perhaps the most numerous of the Samojitians, they were the ones to till the fields and cultivated the crops used to keep their [magi|E] masters fat. The Magi had an ingenious way of cultivating crops since the land around [mayikrata|E] were mountainous and barren. Glass houses were constructed, and the soil infused with magic in order for their crops to grow faster.\n\nThe proximity of these to the actual Magi houses would be what would drive the Ukininkas and the Meistras together. Both shared between each other the symbols and words the Magi used and with some careless intermingling, the magic started to flow through their veins too. But their servitude was not ended until Cenware and his hordes came and shattered the Magi, the Ukininhas realised their chance and rose up with their brethren driving their once masters back to their [Concept('mayikrata','Academy')|E].#!"
 
 ulakada_desc: "#size:15    The Ulakada are a central Kashiryan people native to the banks of the River Parthenay. They are often characterised by their free thinking and adaptivity, and are known for being fickle with their fashions. Their houses are long and flat, with great irrigation systems to feed the crops of their hilly homeland with the Parthenay's streams. One can be born in one of their towns and watch their entire culture shift multiple times over before death.\n\nHowever, their quick minds have also made them unreliable friends, and many alliances have been made and broken by the Ulakada to keep their home safe. As a result, they weathered the [chan_skorpokaipis|E] especially poorly, unable to find aid amongst their neighbours when they needed it most. Their best scholars eventually managed to rebuild the shattered remnants of their culture, but it has been forever scarred by their capriciousness.#!"
 
 uthanata_desc: "#size:15    The Uthanata are native to the northern plains and hills of the region known as Darmirat. Due to their environment, they adopted a more pragmatic lifestyle to combat and society, resulting in a history of skilled tacticians and logisticians, and a legacy of strong leaders that enforce more direct control over their subjects, often through greater transparency of their actions and a strong legal system that has roots in the Otachedian laws.\n\nWhile these liberal traditions are sometimes mistaken as a sign that the Uthanata are more flexible to outer influences, further from the truth, the people are extremely protective of their way of life. Between the constant unrest among the local Tanumarei, the highly appeasing nature of the Vaxanaka, and the danger posed by the influx of foreign intrigue through the Vastarnai traders, the Uthanati view themselves as bastions of the Dayatemi people that inhabit the region against the rest of Kashirya and their many different alien cultures. As such, they have always vigorously claimed the lands of all the Dayatemi, dreaming of uniting the disparate sister cultures and forming a strong cultural union in order to better defend the lands and traditions of their ancestors.#!"
 
 utyalid_desc: "#size:15    The Proud Utyalid number foremost in respect among the [marmaladid_great_tribes|E] of the Marmaladid, as all can agree that Utyal was eldest, or at least second eldest amongst Marmal's children. She was certainly possessed of great wisdom and forbearance, attributes which her descendants hold in high esteem to this day. Many are the great shamans and oracles of Marmaladid legend who hail from the Tribe of Utyal.\n\nLike most of the historically nomadic Marmaladid, they have long been feared by their settled neighbors. As warriors they are regarded as fearsome and brave, their mastery of their desert home allowing them to stage audacious raids as far afield as Damota.#!"
 
 vanaarik_desc: "#size:15    The Vanaarik are the southwestern branch of the Nakahanii people, who had arrived to the Night Coast in the [akualion_tutil|E] of the 7th century. The Vanaarik trace their roots to the supporters of Emalil 'the Sea Serpent', one of the three rival pretenders that emerged in the succession crisis that followed the murder of King Kaiatu 'the Navigator' and the monarch's widow.\n\nAs the group that had followed the warrior queen in pursuing revenge for the late king's death, the Vanaarik would soon get drawn into decades of bloody warfare with the inhabitants of Thrimbyso. Though the Thryimbysans would ultimately be defeated and almost completely destroyed, the war would leave a lasting effect on the Vanaarik culture, which would remain bellicose and warlike.\n\nSkilled corsairs that prowl the Night Coast and largely only operate after the Sun sets, the Vanaarik have perfected the seemingly impossible art of concealing their ships in illuminated waters, navigating the local reefs and launching ambush attacks on passing ships.#!"
 
 vargenis_desc: "#size:15    The first to fall in Aautokratir Phanagorax's invasion of Malcois during the early 2nd century, the Vargenis have long resigned themselves to be under the [Concept('aversaria','Aversarian')|E] yoke. Despite this, they stubbornly hold on to their time-bound traditions, particularly their practice of giving offerings to the sea. Vargenis elders are tasked with remembering their past and are responsible for dictating and enforcing the old ways and customs that must ever be followed.#!"
 
 vastarnai_desc: "#size:15    The Vastarnai are competent merchants and traders hailing from the tip of the Kashti Flats, and they have long profited from their close proximity to the bustling metropolises of eastern Aironoi. Many Vastarnai specialize in artisan trades, such as fine clothing, and many of their fabrics have been long sought by Aironoian courts.\n\nDue to their mercantile ways, the Vastarnai have been heavily exposed to the various languages present beyond the Flats, giving rise to a culture where polyglots are revered. As well, the lingering influences of Otachedian Law, and an emerging brand of economic diplomacy, have given the Vastarnai a strong legacy of administration and bureaucracy unrivaled in western Kashirya.#!"
 
 vaxanaka_desc: "#size:15    The Vaxanaka are situated near the banks of the Kashiryan Coast. As a culture frequently witness to different ways of life beyond their plains, they have adopted a more tolerant and hospitable stances than most of their traditional sister Dayatemi, most notably the Uthanata. Known for their stern adherence to respect and humility to foreign faiths and cultures alike, they server as diplomats for the olteinic lords of Kashirya and even accompany many Vastarni merchants to Aironoi to expediate deals and explore different people and their traditions.\n\nFor a Vaxani, proper perspective and tolerance towards learning the ways of others is a core tenet of their society, with a strong basis for it found in the laws laid by Otached himself that is said to emphazise the intermingling of cultures, bringing forth innovative ideas and knowledge and leading to the continued growth and development of the community as a whole.#!"
 
 virlani_desc: "#size:15    The Virlani are explorers dedicated to seeking lost knowledge — to them, nothing is greater than the discovery of forgotten relics or forbidden scrolls.\n\nOnce prominent seafarers, the [murtuy_ka_varha|E] destroyed many of their coastal cities, leaving nothing but ruins occupied by pirates. Despite this, the Virlani still prize the art of adventure and patronize many great voyages across the seas.\n\nWelcoming of outsiders, they [Concept('virlanic_splendor','proudly showcase')|E] foreign artifacts to honored guests, and a common proverb states that any conversation shorter than an hour is not worth having between friends.#!"
 
 voluntic_desc: "#size:15    The Voluntic homeland is the vast forest of the [greensea|E] where they were the first to build the great cities of the treetops. Their work is assiduous, marked by precision and focused on perfection. Voluntic [magi|E] are unlike any other on [aeras|E], not so much wielding magic as a weapon, but weaving it into an intricate tapestry. There are stories of mortally wounded soldiers suddenly waking up healed, their wounds sewn shut with their own hair, missing arms replaced by wood fused to their skin, and no trace of their saviors but a faint scent of pine and earth.\n\nThe Voluntics are a people focused on mastery of the self, for that is the best way to support the community. Magi meditate endlessly up in the canopies. On the rope bridges, workers and warriors light torches and walk in procession high above the ground, to the pulse of the World Tree.\n\nThey are often derided by the other Partic tribes for their pride and tendency to shun those who do not conform. Despite these claims, their chiefdoms are structured very similarly to the other Partic people, with a secular ruler advised by a council of druids. Many Voluntic druids have travelled to the World Tree to become members of the Arch-Council. Their Magi are no lesser than their Partic brethren, with the most powerful being able to sprout trees from the chests of their enemies. Overall, the bond between the Voluntic people is unmatched, and any worshipper of the World Tree is welcome into their halls.#!"
 
 voyagen_desc: "#size:15    The Voyagen originate from the northwestern backwaters of [chevalie|E]. In search of more prosperous lands, they began sailing, seizing both other regions within the Marches and colonies on distant shores. Over time, these adventures and conquests would allow these adventurers to begin exerting influence over the rest of Chevalie. Due to both their military tradition and overseas holdings, the High King has almost always been Voyagen. This, in turn, has led to their culture increasingly becoming the metropolitan one of the nobility, as the other cultures of Chevalie slowly drift towards it. It is normal to find Voyagens employed as explorers, soldiers or in other such pursuits, and they are the face of the Marches to the outside world.\n\nVoyagen tradition places a large emphasis on individual accomplishment, and cooperation between them can be difficult. Many will seek their own personal glory, even when the route is more perilous. This has led to both triumphs and defeats throughout Chevalien history, and is, in part, responsible for the various warlord eras, along with simple greed. Despite this, the Voyagen will gladly fight the [liches|E] when they come south, standing alongside the rest of the Marchers.#!"
 
 vrodkin_desc: "#size:15    The Vrodkin come from the lands where the cold and misty forests of the north become hot and dry shrub. Originally refugees fleeing a paticulary bloody period in Sjalvolki history, they quickly found success in the isolated mountains of the south, becoming one the most numerous of [Glossary('Velos','VELOS_GLOSS')]' followers. Cut off from the rest of Sjalvolki society, their language and customs became alien to those they once called brethren, incorporating yelps, howls and whistles into their tongue in order to take full advantage of their home's natural acoustics. Their isolation did not last forever. Greulokin marauders arrived, seeking to seize the region's rich mineral deposits for themselves. Despite numbering thrice as many as their overlords, the inhospitable terrain of their homeland and fractious nature of their clans rendered it impossible to release the Greulokin yoke. Their time came when for reasons unknown to them the Greulokin fell into civil war, leading to the dissolution of their once mighty realm.\n\nPeace did not last for the Vrodkin, whilst many wished for a return to the life of their ancestors, the cruel winds of [the_fog|E] forced their people into a second exodus to lands unknown.#!"
 
 walakon_desc: "#size:15    Descended from the great Shamrani raiders, Welki used to be the scourage of the Sea of Empires and proved formidable rivals to early [aversaria|E]. Their dominance was put to an end by [dybolitos_sto_thallas|E], and the following centuries saw most of their people killed by the Aversarians. The ones that survived inhabit a small archipelago of inhospitable islands to the west of Kalathipsomi. Proud as they are of their history of defiance, the slaughter Aversarians brought upon them is a trauma that follows them to this day. There is not a single Walakon settlement out in the open. Their villages are well-hidden in woods and hills, and their houses austere, holding only as much as they can carry. Nearly all Walakon art was destroyed or stolen during the Dybolitós, so now the only thing they have to their name are their songs. Long and winding, they are sung in half whispers to the tune of wind howling, and even when they tell of the deeds of great heroes, one can feel the enormity of their loss in the words that go unspoken.#!"
 
 warisnik_desc: "#size:15    The Warisnik homeland was one of stark beauty, a cold land where the great primeval forests met the vast tundra and steppe of the north. Wolves the height of a man, great herds of mammoths, and all manner of shaggy beasts once roamed their lands. Because of this the Warisnik were known as skilled hunters, similar to their more primitive Curgerski cousins to the north. However primordial their lands seemed however the Warisnik were a settled people, living in fortified wooden settlements on the boundaries of the tundra. Their brave chiefs would lead hunting expeditions out on the plains bringing back all manner of strange tusks and pelts. While in halls decorated with mammoth bone brave warriors would tell tales of the fearsome beasts they met. The Warisnik eventually learned to tame some of these beasts, and the occasional working mammoth or leashed sabrecat would not be out of place in a Warisnik camp.\n\nToday the Warisnik are a mournful people, their camps filled with songs and legends of their lost home. Although traveling with Cenware and his coalition southwards through the chaos wrought by the [frodbrokna|E], many Warisnik soon broke from the greater coalition, with many settling on the barren plains of Vyshtanka or in the vales of the Black mountains. Although safe from the [Concept('the_fog','Fog')|E] for now, their new lands are but a pale reflection of home and the great hunts of the past are now just a memory.#!"
 
 watumimba_desc: "#size:15    The Watumimba are a seafaring people found in the southern reaches of the [pirate_coast|E]. Once warfaring clans on the coast, the Watumimba were expelled from [sarradon|E] sometime in the 4th century. The exiles would survive in [ufaliracci|E] and develop a strong relationship with the sea over the centuries. Many Watumimba are known to live amongst great flotillas rather than on land.#!"
 
 xokola_desc: "#size:15    The result of centuries of Rahikayan rule of cosmopolitan coastal cities, filled with a melting pot of Adani, Virlani, Ekaachi, and Zabari within their walls, the Xokola are a hybrid people like no other. Their tongue blends words from different languages effortlessly, and such dynamism has made them the primary diplomats of the central Kashiryan coast in many circles. Fickle and charming, the Xokola are said to be able to win the most trying of arguments with just a simple smile and a few choice words.\n\nXokolan fashion is often ridiculed as outlandish and foreign, borrowing many styles from [Concept('sarradon','Sarradonian')|E] pirates and traders in favor of Rahikayan designs. The billowing sleeves and jewlled headwraps of Xokolans have also earned them a name as the 'stray cats of Kashirya', using their careful diplomacy and quick wits to aid organised crime across the coast. Such prejudice is never far from an Xokolan, but a quick grin is usually all one needs to be lost in their enchanting proposals.#!"
 
 xrahantiia_desc: "#size:15    Nestled amongst the pastoral vales of the Rohaj valley live the Xrahantiia. A fiercely competitive culture, each clan makes their homes in one of the several picturesque terracotta towns dotted across the valley. Each town contains a Vantaav at its center, or 'scholar tower', containing the accumulated histories of that town and clan. Reinforced with magic and sound engineering each Vantaav strives to outdo the others in height, resulting in a striking landscape of glistening towers jutting from the dense pine forests of the Rohaj valley.\n\nDespite their competitive nature amongst themselves, the Xrahantiia are known throughout Darmirat for their gregarious and genial attitude towards outsiders. This is due to their rich hospitality culture, throwing lavish feasts and festivals when trading caravans pass through the valley. This welcoming nature has attracted many famous Kashiryan figures over the years, and it is said that the great Baytor and his retinue once summered with the Xrahantiia; on the eve of the infamous [bayyuralar|E] so long ago.#!"
 
 yaarnami_desc: "#size:15    Native to the Krehejad archipelago, the Yaar'nami have a long-established seafaring tradition stretching back to their fabled discovery of the islands they call home. This mastery of the waves propelled them across the ocean and onto vulnerable shores, the image of purple-clad warrior women baked into disparate mythologies across [aeras|E].  In fact, the process in which their characteristic pigment was created was a closely guarded secret, its rarity making it an essential luxury for any self-respecting ruler. The history of the Yaar'nami has been preserved in various plays known as Hara'mar, in which dance serves a crucial element of conservation with each movement having a deep meaning to those trained to read it.#!"
 
 yadaniya_desc: "#size:15    The Yadaniya people are dominated by their proximity to Paerasjatan's Spire. The closeness of the massive [Concept('the_towers','Tower')|E] to their towns has made them both a haven for scholars and adventurers, all of which wish to unlock the secrets of the spire. Many Yadaniya are also powerful [magi|E], lending their skills out as guides and aides to researching parties. The culture of the Yadaniya is inseparable from the effects of the Spire, and some travellers have noted that the most powerful Yadaniya also seem to be the most sickly.\n\nWhilst once they held great libraries containing centuries of research on the spire, the [dharya_varha|E] destroyed many of their most vital records. The Yadaniya have remained determined, however, to reacquire their lost knowledge, and so have seemingly dedicated their entire culture to the research of the Spire once again. Whilst some of the most potent [magi|E] in Kashirya, the Yadaniya's insatiable need to understand the Spire has left them a people enslaved to research.#!"

 yaknha_desc: "#size:15    When legions of undead rose in the [murtuy_ka_varha|E], a group of Siklasan refugees fled westward towards the Kashiryan coast. There, they happened upon the city of Piralica as it was being besieged by the Pirate Lord of Wellatola.\n\nWith his few remaining warriors, Goggiraja the Brave slew the Pirate Lord and drove off his fleet, earning honor and the city's gratitude. His people would thereafter settle in the region and take the name [Glossary( 'Yaknha', 'GH_YAKNHA_GLOSS' )], pledging to drive away any who would threaten their shores once again.#!"
 
 yevamarai_desc: "#size:15    The Yevamarai are a hybrid culture of the natives of the northern Aironoi islands and escaped Amaghean slaves. Constant slave raids from [aversaria|E] and Amaghea have left them fiercely distrustful of any foreign influence. Many islands have the remains of former prisons, which the Yevamarai have repurposed to garrisons and lookout posts. The Yevamarai choose not to fight directly, instead opting to mobilize off their lands as quickly as possible, leaving nothing but deadly traps.\n\nYevamarai society has historically been very equal, men and women pulling their weight and struggling to stay alive. The leader of Yevamarai society is typically the Pritksilkae, who live atop tall wooden towers that overlook the entire island, reporting on the tides and possible enemy ships on the horizon.#!"
 
 yevanya_desc: "#size:15    At the mouth of the mighty Kasiryat river lies the metropolis of Valapuiwan, gateway to the east, and it is among the decadent palaces and pitiful slums here that the Yevanya people arose. Descended from dense Yonata settlements along the river, the evolution from a traditionally agricultural existence to an urban one resulted in a similar cultural evolution. Influenced by [Concept('aversaria','Aversarian')|E] merchants across the bay, Sarradonian traders plying their wares, and all manner of commerce flowing through the great Kasiryat, the Yevanyan dialect shifted dramatically into a pidgin trade language nearly unintelligible to their agrarian cousins.\n\nIn addition to their tongue, Yevanyan's are defined by their diversity, as in Valapuiwan nearly all manner of dress and customs can be found. With the Yevanya often wearing ostentatious robes and holding a haughty attitude towards the more rural inhabitants of Darmirat when entering their beloved city. While often seen as arrogant, the experiences of the Yevanya people in navigating the politics and commerce of the largest city in western Kashirya, has led them to be renowned as adept administrators and bureaucrats throughout the east.#!" 
 
 yonata_desc: "#size:15    Along the southeastern bank of the Kasiryat and in the lowlands of the Darmirat plain live the Yonata. An agrarian people, the Yonata build their towns alongside the many streams and tributaries that flow towards the great river, living in colorful stucco homes decorated in deep oranges and vibrant yellows. The Yonata, being farmers, are tied to the seasons, and no matter the time of year their stucco villages are filled with the sounds of the Sitar and Tabla drums as the Yonata herald the coming of the harvest.\n\nWhile commonly known as a quaint folk, their position as the breadbasket of the Chordan peoples means Yonatan landowners hold much sway over the politics of Taleshtadendar. They live in some of the most fertile land in all of Kashirya, and before the rise of Valapuiwan, Yonatan kings held dominion over much of the Darmirat plain.#!" 
 
 yylaxxaz_desc: "#size:15    The Yylaxxaz have historically been simple shepherds living off the Amaghean coast. Tribes roam the hills, following wherever the green grass grows. The tribe is centered around their flock, the sheep having as much say in their journey as the shepherds. The Yylaxxaz language is completely undecipherable to any foreigners. Dialects can vary greatly between individuals, with completely different grammar structures and pronunciations. Strangely, sparse records from decades ago have made no note of any unique languages, simply noting them as Amaghean shepherds.\n\nAs a result, most of Amaghea regards them as a simple and backwater people who spout nonsense words to each other. However, the Yylaxxaz are a philosophically minded people, with tribal elders often meeting to discuss the path that the world has taken, smoking chort and talking long into the night.#!"
 
 zabari_desc: "#size:15    The Zabari of the eastern peninsulas of Kashirya are a nation of free-spirited craftsmen and wily merchants in the eyes of most foreign observers, but most ignore their true skill — the ability to drain the fetid wetlands of their homelands. Whilst once under the spiritual dogmatism of the Neshalar, the slow divergence of the north coast from their Surins in the 6th century allowed the tradition of pristine wetlands to be broken. Now, after centuries of learning their craft, the Zabari are unafraid of expanding their new cities at all costs.\n\nZabari cities are also famous for their diverse array of weaponry, with every style of sword or club imaginable, as well as various projectile weapons, sold in their vast markets. The walls are short and thick, and the air, whilst foul-smelling, is said to be filled with magical energy by the locals. Even the most persistent creatures of the Kashiryan wetlands are said to fear the Zabari's relentless expansionism.#!"

 zakhirun_desc: "#size:15    When the [sabar_lambay_raad|E] brought night unending to Haryaadad, not all of its people sought the sun. Bound by chains of power, riches, or love, the Zakhirun chose to dwell within the dark city, ever prowling its dim expanse. Over time, these 'Shadow-Dwellers' have adapted to their bleak home, and are said to bear a monstrous visage that thrives in the absence of light.#!"
 
 zelkavani_desc: "#size:15    The Zelkavani are [Concept('zelkavani_glassmaking','proficient glassmakers')|E], native to the shores of the aptly named Sea of Glass. Famed across Aironoi and beyond as masterful artisans and industrious craftspeople, the Zelkavani themselves prefer to adorn only minimal luxuries — usually those received as gifts or items of sentimental value. Like many other Kherkeloi settlements and owing to the constant threat of fires from extensive glassworks, Zelkavani cities are neatly structured into spacious districts interspersed with large, stele-marked plazas, avoiding the squalor typically associated with dense urban centers.#!"
 
 zharran_desc: "#size:15    Smallest of the Dayatemi culture, the Zharran are known to be community driven. Situated in the south of flats bordering the Kashiryan sea, the people are expert fishermen, and are the main providers of aquatic meat and goods in the region. This also makes them very skilled as naval soldiers and commanders, and are highly sought after by the Kashti polity to protect their trade. Another skill they possess, and highly sought after, is one of proficient gardening, with many being recruited into royal courts as court gardeners and build luxurious royal gardens that are the envy of many.\n\nDue to the scarce amount that adhere to this life, they prefer to practice pacifistic tradition than wage war that might lead to the destruction of their way of life, for in return of mindless glory.#!"

 lanonan_desc: "#size:15    The Lanonan are the descendants of Kathuni who were encouraged to settle along the Cang River in the 8th century, and of the garrison that occupied the region, there to safeguard the interests of Kathun-Kai. Far from the Kathuni heartland and shaped by the hardships of those early days, they would give rise to a highly militarised society, increasingly different from its Kathuni origins, in which all capable of bearing arms are expected to fight in defence of their lands and military service is the chief avenue of advancement.\n\nIt has become a common sight to see Lanonan in Wuizu armour among the proper armies of Kathun-Kai, more often than not at the head of the vanguard.#!"

 yingsa_desc: "#size:15    The Yingsa are descended from refugees drawn from a diverse array of peoples across southern [kathun|E], who held in common little beyond some form of the Thuantyan Sraidyan faith and the persecution it earned them. Driven out by the suppressions of the 10th century, they abandoned their homes for the remote and rugged country where their communities have endured ever since. Generations of isolation gradually erased many of their internal distinctions, and the Yingsa developed largely apart from the cultures surrounding them."

 saeridian_desc: "#size:15    The Saeridian are the descendants of whole Saielai communities forcibly resettled after the [great_western_march|E] and the fall of the Shrunfan Kingdom, to labor under direct Kathuni control in northern [Glossary('Dahangon','dahangon_lowlands_encyclopedia_desc')]. Severed from the land that had sustained their customs and scattered among their conquerors, the generations that followed would gradually take on the traditions of their Kathuni overlords in place of their own.\n\nTheir kin would never forgive them, and their name would pass into the tongue as a byword for any who bows before Kathun-Kai."

 langanafam_desc: "#size:15    The Lakoeng call the swamp-ridden coastline east of Bronzeport Langanafam, a name that came to be applied to the settlers who established themselves there during the 11th century. Founded as trading outposts along an inhospitable coast, these settlements gradually expanded into prosperous cities through extensive efforts to drain its marshes.\n\nNearly all Langanafam live within these densely settled coastal cities, whose ruling families derive much of their wealth from maritime trade. Their long tradition of defending reclaimed land has also produced renowned archers, who serve both in the cities' garrisons and as sought-after mercenaries abroad." 

 chenhan_desc: "#size:15    The Chenhan descend from the intermarriage of Lakoeng settlers in the interior of southern Dahangon with the indigenous Banwagul. Where their Kathuni kin have kept to the coast, the Chenhan made their homes deep inland among Banwagul villages, and generations lived so would leave them holding the traditions of both peoples in equal regard.\n\nTheir Eastern speech carries so heavy a Banwagul accent that other Kathuni hear in it nothing but barbarism and reckon them no different from any people of Dahangon. The Chenhan count themselves Kathuni regardless."

 #chevalies_desc: "#size:15    With the passing of time, the diverse cultures of [chevalie|E] have drifted together, forming into a unified whole. The Voyagens have had perhaps the largest impact on this unification, with their positions as rulers of the Marches having left its mark. This is not to say that the other cultures have simply been replaced. They have instead merged, bringing aspects of their own individual traditions together, creating a cosmopolitan superculture encompassing the realm. Vestiges of nearly every custom once practiced within the region can be found within it.\n\nWhat exactly defines Chevalien culture is a much-debated question, with people of the many cultures that make it up each claiming that it is defined by their particular traditions. As far as can be agreed upon, there is no individual characteristic that stands out. What makes it unique is the mixture of practices, their combination forming something completely new. The Salisian artisans have gained Carsavarian determination, the Voyagen have lit a flame within the Trustians, and the Rivarisians have woven their language into the common tongue. The legacy of the Shewigads is restored, and the people of the Marches once more stand united, in fact as well as name.#!"
 #jaravad_desc: "#size:15     "
 #musar_desc: "#size:15     "
 #shewigad_desc: "#size:15     "


 #### PARTIC 1298 CULTURES ####
 laodantines_desc: "#size:15    When the Brigandines fled the [greensea|E], it was the ancient forests of Kalathipsomi that finally made them feel less like exiles. There they found the woods already tended by shamans who had bled for their trees against [Concept('aversaria','Aversarian')|E] axes for centuries, and who recognized in the newcomers' Druids and root-twisted villages a kindred devotion. From that meeting grew something new.\n\nThe Laodantines who emerged from this communion remain recognizably children of the Brigandines, but the gloom of their forebears has been burned away by conviction.#!"
 
 muintuir_desc: "#size:15    It was the druids who led these people across the water. Even in the depths of the [greensea|E] the Auteonic wise had felt it, and with the Fall of [aversaria|E], the Imperial Isles were open. The Auteonics who answered became the Muintuir, the 'family of the crossing,' and they settled not empty wilderness but the bones of an empire: shattered fora, headless statues, and streets where the greatest power of [aeras|E] once governed the world.\n\nThe Muintuir have proven strange and gentle conquerors of these ruins. Where their forebears sprouted grass from barren rock, [magi|E] now coax gardens up through broken marble, and orchards stand in old parade grounds. Whatever secret the Tower Isles holds, their druids study it patiently, certain that they were called here for a reason.#!"
 
 #### SJALVOLKI 1298 CULTURES ####
 
 svotsadi_desc: "#size:15    Of all the clans who marched south under the Imperrech, few took to their promised land as eagerly as those who settled along the Pathos. Long accustomed to boasting that their old homeland, on the Pathos those who would become Svotsadi found richer soil, milder winters, and Huegodoc neighbors to live beside. Within a generation the newcomers were marrying into Hueg river-towns, and the children of such unions, once mocked as bastards of two worlds, became so numerous that the Svotsadi now count them beloved.\n\nThe Svotsadi remain Sjalvolki in their bones, their skalds still sing the old sagas, and their dead ancestors are honored at every hearth, but the warrior spirit has softened into something communal and content. Their villages sit half in field and half in forest, and they see no contradiction in it. Let other clans sneer that the Svotsadi have grown fat and tame, they answer that the gods' bounty was always meant to be enjoyed.#!"
 
 leskovych_desc: "#size:15    The Irmionoth carried their oath of vengeance into [aversaria|E] like a drawn blade, but on the Horn that blade found a whetstone. Settling hard country long haunted by the Ordikin clans, the newcomers expected war with the owl-masked, and got it, until both sides recognized something familiar in the other. With influence from Marcher merchants, the Ordikin's oaths and the Irmionoth's ancient contracts proved kindred codes, and from their entwining arose the Leskovych.\n\nLife in Westhold has made them more than avengers. The Leskovych have become renowned smiths, forging the arms their feuds demand, and their palisaded holds are counted among the stoutest in the region. Sons and daughters alike train for war, and their neighbors have learned the arithmetic of dealing with them: whatever is taken from the Leskovych will be taken back with payment in iron.#!"
 
 kaskader_desc: "#size:15    When the Sjalvolki came to Kalathipsomi, many sought valleys and pastures like those they had lost. One branch, however, found itself quartered in and around Bastonport and other cities of the Dreaming Hills, and against every expectation of their kin, they stayed. Their mountain speech now echoes through wharves and counting-houses, and the clans who once could not be governed have become burghers, guildsmen, and harbor-masters who take fierce pride in keeping their adopted cities fed, paved, and solvent.\n\nTheir loyalty is to their city and its wards, not to whatever throne claims it. They work as stubbornly as their ancestors hunted, and they have taken to maritime trade with a zeal that surprises everyone but themselves. To the old clans they seem hopelessly changed. The Kaskader would answer, from behind good walls and full warehouses, that they have simply found something greater.#!"
 
 itnicavingi_desc: "#size:15    The Battle of the Elysian Pass broke the armies of [aversaria|E] and opened the south to the Imperrech — and when the great host moved on, some remained among the graves. Barki war-scouts who had guided the coalition through the mountains settled the countryside in the years that followed, joined by freed slaves and stray families of a dozen other peoples who had nowhere further to march. From that hard-bitten mingling arose the Itnicavingi.\n\nThey are a stoic folk, as befits people who farm forgotten battlefields. Their lands are held in common by old customs, their hunters fly falcons along the crags, and they quarrel endlessly among themselves in the manner of neighbors who trust no one else to do it.#!"
 
 radivolki_desc: "#size:15    No prize of the migrations glittered like Orispolj, and it was Daukeni and Caemansi clans who claimed the country around the great metropoles of the old Imperial Heartlands. Never modest, the settlers took a name to match their new home and called themselves Radivolki, as though the seat of world had been merely waiting for new tenants. City living has fused their parent stocks strangely: the Daukeni's delicate verse and the Caemansi's thundering blood-sagas now share the same courts, recited by skalds who have learned to flatter as skillfully as they boast.\n\nThe cities have worked deeper changes still. Sooner than any other Sjalvolki people, the Radivolki began attending the rites, drawn by ceremonies grander than any hilltop offering.#!"
 
 pactlander_desc: "#size:15    No clan wanted the mud. The delta country where northern Malcois bleeds into southern Kalathipsomi was passed over by every strong people of the migrations, and so it fell to the weak: Tribocicai farmers hungry for any soil, freed Monderrn seeking quiet, and the stray remnants of a dozen broken clans besides. What no single people could survive alone, they endured together, pact by pact, dike by dike, herd by shared herd.#!"
 
 southlander_desc: "#size:15    The Adrakamp were merchants before they were exiles, and when their wandering markets reached southern Opakasija they looked upon the beauty of the [Concept('aversaria','Shattered Coast')|E] and simply stopped. Joined by Vrodkin clans weary of the road, they took to Opakasijian living with enthusiasm, and the Sontrventi were born: a people their northern cousins describe, not entirely unfairly, as haughty, vibrant, and impossible to silence.#!"
 
 northlander_desc: "#size:15    The Greulokin came south still remembering that they were once greater kings. Settling the shores of the Partharian Sea alongside Fenvir, the would-be overlords found a ruined, half-emptied land that cared nothing for the glories of the past, and slowly, grudgingly, they fell in love with it. The Civerek that emerged are a spiritual folk who see the hand of Prohen in their fall and their second chance alike: the god of fate cut their old thread, they say, so that a stronger one might be spun beside this sea.#!"
 
 eastlander_desc: "#size:15    Cormag tried. The old chief who led Fenvir clans into western Aironoi preached the ways of old at every fire; the hunts, the modest life, the old gods honored plainly. His people nodded, and did otherwise. Western Aironoi was a land of warring lords, imperial remnants, and coin for any blade, and the Fenvir hunger for glory and plunder found richer feeding there than any highland raid. Mingling freely with the imperial peoples among whom they fought, sometimes on both sides of the same war, they became the Ostvolk, the least Sjalvolki of all the Sjalvolki, and entirely unashamed of it.\n\nThe wars of the seventies and eighties forged their character in full. Ostvolk are opportunists and proud of the craft. Ambitious, boastful, quick to hire out and quicker to renegotiate. Of the old ways only the war-cry of [Glossary('Velos','VELOS_GLOSS')] survives intact.#!"
 
 sernvryki_desc: "#size:15    When the Warisnik clans broke from the great coalition, those who turned toward the cold plains of Vyshtanka were reckoned the stubbornest of a stubborn people, and they have worn the judgment as a crown ever since. The Sernvryki found in the wind-scoured plains a shadow of their lost tundra home, and rather than mourn the resemblance, they embraced it. Where other clans softened in the conquered south, the Sernvryki hold to the old ways with deliberate severity: the great hunts ride out each season, boys are hardened against the winter as their grandfathers were, and a Sernvryki camp keeps no luxury a sled cannot carry.#!"
 
 medrevi_desc: "#size:15    The Curgerski were derided as savages even by their own kin. A landless people of bone tools and reindeer sledges, so few clans objected when their number drifted into the deep forests of Kalathipsomi, where Clanlanders still kept the memory of the Heartwood. The two peoples took to one another as only the twice-scorned can, and their mingled descendants, Medrevi, have built a life that suits them both: settled enough for cities and tavern storytellings, wild enough that no tax-collector has yet returned from the woods with good news.\n\nThe Medrevi resemble the placid Svotsadi in their forest homesteads and little else. Strength remains their first virtue and raiding their favorite proof of it, with disputes among clansmen settled by combat before witnesses, as the gods intended. Around their fires, hunting-lore and oral chronicle have braided into a single storytelling tradition that outsiders rarely hear, and never forget.#!"
 
 drogvingi_desc: "#size:15    Not every clan that settled the rich south agreed that all old ways should be left behind with the old lands. The Drogvingi watched their Radivolki cousins take up new  manners, and turned the other way entirely. Among the Drogvingi the Kholmvolki speech is kept in full, the ancestral rites are observed to the letter, and a family's honor is accounted as carefully as its harvest; to break a sworn word is to be dead to them, however long the body walks afterward.\n\nThey are not a gentle people, but they are a reliable one.#!"
 
 opakasijan_desc: "#size:15    Marcher adventurers, hunting opportunity in a collapsing empire, made their landing near Tinitida and found Sjalvolki war-bands probing the same coast. After a period of instructive violence, the two peoples concluded they were more profitable as partners. Opakasijans that grew from that union proudly style themselves the first landers of the west, and hold the distinction over later arrivals like a drawn sword.\n\nBoth inheritances run strong in them. Opakasijan law is exact on the matter of injury, every wrong repaid in kind, every debt collected, and their bards keep meticulous account of both. They came as strangers from two directions and made the coast their own; they see no reason anything on it should move without their leave.#!"
 
 derescicai_desc: "#size:15    The Deresstae swore the world would fear their sails again, and on the coast of Malcois the oath is being kept with Tribocicai farmwives raising the sailors. The two peoples settled side by side in the years after the fall, sea-raiders robbed of their fleet and earth-worshippers granted new soil, and the marriages came faster than either set of elders liked. Their children, the Derescicai, plant in the morning and put to sea in the afternoon, burying a share of each harvest for the hero sisters while the shipwrights' craft of their other grandparents rises again in every cove.#!"

 dalinscyki_desc: "#size:15    The Karzarad marched as they have through all theiry history: politely and mysteriously. Those who settled the [Glossary('Kepyran Basin','sulzegg_basin_encyclopedia_desc')] did so beside Caemansi clans befriended on the journey south, and the long friendship has left its mark. The Dalinscyki still craft their intricate little mechanisms, but the tales their bards now favor have grown teeth. Caemansi blood-sagas share the fire with the old accounts of the Stymialtr and the unutterable city, and Dalinscyki verse today celebrates the crack of a spine as readily as the turning of a gear.#!"

  hunigson_desc: "#size:15    The Huegodocs who followed the Imperrech expected river-tolls and market towns wherever they landed; those settled in the forests of Kalathipsomi found neither, and became something stranger instead. The wood there hums with a latent [magic|E] that the practical Huegs first noticed in their bees, whose hives among the old trees yielded honey of uncanny potency. From those first apiaries grew the Hunigson — the People of the Honey — a folk their easygoing cousins scarcely recognize: austere, exact, and quietly certain that they have been entrusted with something the rest of the world would only squander.\n\nHunigson life is ordered to a degree remarkable among the migration peoples. Every hive, grove, and forge is registered, every harvest of the wood measured against careful ledgers, for they have learned that the forest's gifts punish greed. Their smiths quench honey-fed charcoal into metal that takes enchantment as wax takes a seal, and Hunigson blades and bells are already traded far beyond Kalathipsomi — though never in quantities the wardens have not approved. Sons and daughters alike stand watch on their palisades, and their ancestors are consulted on all weighty matters. The old Hueg warmth survives underneath, in full guest-tables and beloved bastard lines; it has merely learned discipline, as everything among the Hunigson eventually must.#!"

# Was removed during culture jinja

 mahratian_desc: "#size:15    The Mahratians are the most eastern group to fall under the sway of Amaghea, and the furthest from their grasp, yet their culture is not so different from their western overseers. Their fashion, language, and cuisine are a mirror to Amaghea's own, and their dislike of [magi|E] is often said to have stemmed entirely from ancient Amaghean tales. Their similarities have often endeared them to Amaghean nobility, and the Mahratians have traditionally ruled themselves more freely than other provinces under Amaghea's sway in return for heavy levies on their manpower to serve as bodyguards and scouts.\n\nHowever, the Mahratians have not forgotten their origins as a people that emerged in the [aironoian_migration|E]. Both in war and peace, their lives are spent in the saddle, riding across the plains of their new home. Their language loans many words from the original followers of [toragei_mahratian|E], and their people are known to still wear masks as a part of their culture, despite long straying from many other Öltenic customs. To them, a man without a horse is nothing, and even the Kharadan Mountains behind their backs have failed to erase such a mindset.#"
 
 marakje_desc: "#size:15    The origins of the Murakje people lie several years after the [death_of_holkkarak_and_the_end_of_the_murtuy_ka_varha|E]. Famed warrior Yāvasi Viśvāsavra and his followers were driven out of their homeland after he declared that it was not the fault of the scholars, but of the Kashiryan people for neglecting to prepare for the undead threat that was clearly coming. His numerous proclamations on the nature of the [murtuy_ka_varha|E], as well as his code of honor and personal philosophies, form the basis of the Murakje culture.\n\nThe Murakje place great importance on the proper disposal of dead bodies, as well as battlefield tactics against undead hordes. Distinguished Viśvāsavrak Guardians protect their liege against threats both living and dead and are expected to take power in times when the realm is vulnerable. While they are well liked amongst the scholars, the Murakje's militant defense of the [vidvaookeyatran_scholarly_caste|E] have left them at odds with the common folk of Kashirya."
 
 mastikigni_desc: "#size:15    The Mastikigni have refined what it means to be a warrior to a knife's edge. After a brief night of celebration, where boys are betrothed, gifts exchanged between families and much mead drunk, a generation of the clans young men are exiled from society. Having to fend for themselves or work together to survive, the fledgling Mastikigni are unable to return to the place of their birth until they complete three trials, which they credit to [Glossary('Velos','VELOS_GLOSS')] in one of their central myths. Aspiring warriors must come home with the wing of an eagle, the tooth of a bear, and the tail of a wolf. Those who cannot are forbidden from speaking or seeing their clansmen and women again, to do so would break the sacred oath each boy takes before his journey. Many who fail at this task decide to start their own clan, in hopes that their descendants will complete what they could not. For those who show the correct amount of bravery, cunning and strength required, much revelry accompanies entrance into perhaps the greatest warrior culture on [aeras|E].#"
 
 meistras_desc: "#size:15    The Meistras were the house servants for the [magi|E]. Constantly being in the houses as servants put them in a unique position. They were able to move freely and mostly were left to their own devices by their masters. Their hubris and aura of superiority made them not look twice at the slaves and their daily chores. It was this non-caring attitude that allowed the Meistras to be the first of the slave castes to begin to have Magi blood running through their veins and the first to start learning the words of power. They were allowed to start families and could pass off a child as their husbands when in reality it was not.\n\nCenwares invasion allowed the Meistras to seize the initiative and attack from the inside, slaughtering men, women and children before they fully could comprehend what was going on. Before Cenware, revolt had been all but a pipedream, but now freedom was a very real proposition.#"
 
 mineris_desc: "#size:15    The most complacent of the slave castes, and with the shortest life span, the Mineris lived most of their lives in the dark. Mostly sequestered to the North, where the mineral wealth was, they lived a simple life. Centuries of living life in low light had led their skin to turn noticeably whiter over the generations. They constantly dig and create new rooms, tunnels, and mines for their [magi|E] masters. While normal realms would sell their mineral wealth and use it for weaponry or armor, the Magi would rather use it to perform exotic transmutation rituals. It was not until they saw the smoke billowing and recovered from their shock, did they seize the north. Since fear was the driving factor behind keeping the Mineris in check and the Magi mostly fled back to defend the [Concept('mayikrata','Academy')|E], the seizure of the North was almost bloodless.#"
 
 mirzana_jahar_desc: "#size:15    As the Ayyar were a landless, wandering people in [sarradon|E] for centuries, it is perhaps unsurprising that some of their more unscrupulous hosts had a tendency to attempt to subdue them. Centered in Kekhenemhat and Uhtash, those who would be known as the Mirzana Jahar faced endless persecution by both sides of the War in Heaven, constantly betrayed and suppressed due to paranoia about secret allegiance to the other side. When Sheyarla proclaimed her Ayyar state in 716, the Mirzana were among the first to truly leave en masse, making treacherous journies across nearly the bredth of Sarradon to reach a new home.\n\nThe Mirzana Jahar are arguably devoted to unity with their brother cultures even more than the Auzangeb. Their long ordeals as scapegoats has forged tight bonds among their community that persists to this day, and while they may be more than willing to overlook differences with their fellow Saradari, the same does not apply to outsiders, though it is still possible for an individual to prove themself worthy of membership.#"
 
 mithaista_desc: "#size:15    The Mithaista are the traditional lords of the mountain kingdom of Hyratan, and are regarded as the most noble of all the Aevakori. Of course any 'lesser' Aevakori would say different, claiming the Mithaista are an aloof and haughty people, gone senile in their high-altitude citadels, dreaming of glories long past. This holds some truth, as the Mithaista are proficient recordkeepers, and are known throughout Hyratan for their rare books and forgotten knowledge.\n\nIn addition to their scholarly pursuits, the Mithaista are well adapted to life in the mountains, as their traditional horse breed, the Cerutku, is closer to a mountain goat in behavior. Short and squat, these nimble steeds carry the Mithaista from peak to peak, and are sought after pack animals for mountaineers across [aeras|E]. The archetypal band of Mithaista crossing the mountains on Cerutku, transporting their precious tomes and scrolls, is a classic sight throughout central Hyratan.#"  
 
 mondecny_desc: "#size:15    A largely peaceful and isolationist people, the Monderrn dwelt since time immemorial in the eastern portion of what is now known as the [foglands|E]. Though long sheltered from aggression by the mountains of the Krodgenn range and the uniquely dense forests of their homeland, these natural defenses proved lacking with the arrival of the warlike [Concept('aversaria','Aversarian')|E] who saw in the Monderrn a most invaluable resource — a population of slaves who were unlikely to revolt. Thus began the darkest era of their history.\n\nSo it was that when Cenware's coalition broke the back of Aversarian resistance most Monderrn were brought into the Imperrech not from their traditional homelands, but from massive slave plantations located in the core of Aversaria's Katraddia governorship. Now freed after more than a generation of persecution and abuse, the Monderrn have settled in the dense Knokidbes forest in northern Malcois and many seem determined to resume their peaceful cultural traditions.#"
 
 mtuwe_desc: "#size:15    The Mtuwê have lived in the southern jungles of Rojihlat Mara for untold ages. They live in wooden villages propped up by stilts, often shaped to look like branches of the tree itself. The Mtuwê have a close affinity with the mangrove forests they have long called home, preferring to grow their own food so as to not upset the balance of life in the forest. The hanging orchards of the Mtuwê have led many to mistake the mangroves of Rojihlat Mara for other kinds of trees, as the tree's branches are heavily laden with various kinds of fruit.\n\nThe Mtuwê only hunt as a means of self-preservation, when the population of the native fauna grows large enough to pose a threat to their villages, or in cases of self-defense — a common occurrence to those who live in the region. They believe this responsibility falls to them alone however, and fiercely prevent any outsiders from hunting the creatures of the forest.#"
 
 muhadamd_desc: "#size:15    The Muhadam'd is a collective term denoting the remnants of various [Concept('aironoian_southeast_biozone','Southeastern Aironoian')|E] peoples of primarily Kherkeloi origin who were forced to abandon their sedentary lifestyles in the chaos of the [bayyuralar|E]. Bearing the full brunt of the ill-fated [Concept('ertomax','Ertomaxist')|E] attempt to restore the Aruvasuen Empire and the brutal fighting that followed, the Muhadam'd had their cities razed to the ground and were forced to disperse into the [Concept('great_steppe_biozone','Aironoian Steppes')|E], gradually adopting Vhanavid language and customs to avoid enslavement.#"
 
 murarut_desc: "#size:15    The [Glossary( 'Mur’ar’ut', 'GH_MURARUT_GLOSS' )] are the descendants of [Concept('great_steppe_biozone','Aironoian Steppe')|E] natives, whose many petty realms were trampled over during the [bayyuralar|E] and the subsequent [Concept('aironoian_migration','Öltenic Migration')|E]. Subjugated and quickly subsumed into the nascent Vhanavid cultural identity, one of the few aspects they still retain from their ancient ancestors is the widespread use of chariots in martial, ceremonial, and religious roles.#"
 
