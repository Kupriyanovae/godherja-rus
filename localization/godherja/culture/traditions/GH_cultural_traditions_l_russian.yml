l_russian:
 ###########
 # ETHOSES #
 ###########
 ethos_magical_name:0 "Магическая направленность"
 ethos_magical_desc:0 "Эта культура решила возложить всё своё доверие на силу [Concept('magic', 'магии')|E] и её практикующих, и организована так, чтобы способствовать максимальному росту тайных знаний и магических родословных."

 ##############
 # TRADITIONS #
 ##############
 incompatible_tradition_legacy_of_aversaria:0 "Несовместимо с традицией «$tradition_legacy_of_aversaria_name$»"
 
 tradition_lodge_dominance_name:0 "Господство лож"
 tradition_lodge_dominance_desc:0 "Могущественные ложи пронизывают все аспекты жизни этой культуры, и членство в одной из них практически неотъемлемая часть повседневности."
 tradition_traders_name:0 "Торговцы"
 tradition_traders_desc:0 "Будь то из-за оптимального географического положения или просто в силу присущих культуре ценностей, этот народ имеет долгую и богатую историю коммерческой деятельности с соседями."
 tradition_mubaaizun_name:0 "Мубаризун"
 tradition_mubaaizun_desc:0 "Мубаризун — это чемпион армии [Concept('sarradon', 'Саррадона')|E]; зачастую лучшие воины лорда участвуют в ритуальном поединке перед началом битвы, сражаясь до смерти. Эти дуэли часто сопровождаются тем, что армии скандируют или оскорбляют друг друга, и известны случаи — такие как Битва мубаризунов — когда перед боем происходило множество поединков, зачастую чтобы отомстить за павшего мубааизуна."
 tradition_botai_name:0 "Бётай"
 tradition_botai_desc:0 "Бётай — это вольные отряды, созданные для набегов и товарищества. В обществах с бётай они являются основной социальной группой, определяющей, является ли человек взрослым или ребенком, и может ли он участвовать в жизни общества."
 tradition_ardara_name:0 "Ардара"
 tradition_ardara_desc:0 "Ардара — это система чести, характерная для кикарсаги. Быть храбрым в битве, щедрым в богатстве и прямолинейным в делах с другими кикарсаги — вот воплощение ардары."
 tradition_bloodhounds_of_aversaria_name:0 "Ищейки Аверсарии"
 tradition_bloodhounds_of_aversaria_desc:0 "Сихарцеги могли считать себя одними из самых грозных вершителей правосудия [Concept('aversaria', 'Аверсарии')|E], чья культура постепенно трансформировалась, чтобы отточить и преумножить самые безжалостные аспекты их общества воинов. Мятежный район, посещенный сихарцегами, обычно быстро и решительно приводился к миру — по крайней мере, к миру могил."
 tradition_legacy_of_aversaria_name:0 "Наследие Аверсарии"
 tradition_legacy_of_aversaria_desc:0 "[Concept('aversaria', 'Аверсария')|E] и её институты занимают важное место в этой культуре — независимо от того, стоит ли еще Автократия, эти люди видят себя её подданными и наследниками."
 tradition_legacy_of_aversaria_lesser_name:0 "Наследие Аверсарии"
 tradition_legacy_of_aversaria_lesser_desc:0 "[Concept('aversaria', 'Аверсария')|E] и её институты занимают важное место в этой культуре — независимо от того, стоит ли еще Автократия, эти люди видят себя её подданными и наследниками."
 tradition_northern_pragmatism_name:0 "Северный прагматизм"
 tradition_northern_pragmatism_desc:0 "В целом не проявляя интереса к мировым делам и довольствуясь лишь своими лесными владениями, [Concept('aversaria', 'аверсарианцы')|E] из Калатипсоми хорошо известны своей безжалостной формой прагматизма, которая часто ставила их в противоречие с их более принципиальными сородичами в остальной части империи. Однако количество бурь, которые их правящие дома пережили за столетия, является ясным свидетельством эффективности их политического подхода."
 tradition_opakhasian_opulence_name:0 "Опахасийское великолепие"
 tradition_opakhasian_opulence_desc:0 "Декаданс, царящий при опахасийских дворах, показался бы почти вульгарным в большинстве других культур, но, несомненно, сделал их крайне привлекательным местом для тех, кто ищет уровень излишеств, который обычно считается лишь сказочным."
 tradition_opulence_name:0 "Великолепие"
 tradition_opulence_desc:0 "Эта культура выставляет свое богатство напоказ."
 tradition_blood_magi_name:0 "Маги крови"
 tradition_blood_magi_desc:0 "Эта культура с большим почтением относится к практикующим [Concept('blood_magic', 'магию крови')|E] и развила навыки в этой области, которые ставят их [Concept('living_magi', 'живых магов')|E] выше большинства других."
 tradition_purity_of_blood_name:0 "Чистота крови"
 tradition_purity_of_blood_desc:0 "В этой культуре делается большой акцент на культивировании чистых, [Concept('magic', 'магических')|E] родословных."
 tradition_otachedian_law_name:0 "Отачедское право"
 tradition_otachedian_desc:0 "Хотя прошли столетия с момента её падения, правила и принципы [Concept('otachedian_empire', 'Отачедийской империи')|E] всё еще прочно держатся в обществе этой культуры."
 tradition_literary_divergence_name:0 "Литературная дивергенция"
 tradition_literary_divergence_desc:0 "Эта культура настолько отошла от своей исторической литературы, что стала уникальной сама по себе."
 tradition_amaghean_lions_name:0 "Амагейские львы"
 tradition_amaghean_lions_desc:0 "Жители Амагеи давно овладели навыками, необходимыми для защиты своего дома в горном хребте Армазли. Несгибаемая до конца, эта культура не сдаст свои горы без боя."
 tradition_centralized_name:0 "Централизованность"
 tradition_centralized_desc:0 "Расти — значит умирать! Эта культура выросла вокруг небольшого числа городов, где шум и суета городской жизни служат бьющимся сердцем их существования."
 tradition_flame_children_name:0 "Дети пламени"
 tradition_flame_children_desc:0 "Рожденная в огне и ярости, эта культура рассматривает свою веру как неотъемлемую часть своих ритуалов. Они будут отстаивать свою религию до конца и мстить за любое оскорбление в её адрес."
 tradition_kaegan_wind_name:0 "Ветер Каэгана"
 tradition_kaegan_wind_desc:0 "Смешивая амагейские и вханавидийские воинские традиции, эта культура ценит кавалерию, способную проноситься по равнинам подобно божественному ветру."
 tradition_armazli_sanctuaries_name:0 "Армазлийские святилища"
 tradition_armazli_sanctuaries_desc:0 "Рожденная в высоких горах Айгаи, эта культура принимает высокие пики Армазли как свой единственный истинный дом. Ни одна гора не бывает слишком высокой, и ни один храм — слишком уединенным."
 tradition_eagle_court_name:0 "Плюмажное ухаживание"
 tradition_eagle_court_desc:0 "Дранети следуют путями двора медленно и обдуманно. Те, кто нарушает свои клятвы, больше ничего не увидят; те, кто выступает против священных клятв, сталкиваются со смертью, которую не могут предугадать."
 tradition_world_tree_name:0 "Последователи Мирового древа"
 tradition_world_tree_desc:0 "Партики живут в соответствии с пульсом Мирового древа, которое направило их стать одними из самых искусных [Concept('magi', 'магов')|E] во всем [Concept('aeras', 'Аэрасе')|E]."
 tradition_chortoson_name:0 "Чортосоны"
 tradition_chortoson_desc:0 "Эта культура сформировала глубокую связь с растением чорт и всеми успокаивающими свойствами, которые оно несет; те, кто его употребляет, кажутся более легкими в общении."
 tradition_chevalien_identity_name:0 "Наследие Шевалье"
 tradition_chevalien_identity_desc:0 "Дети современного [Concept('chevalie', 'Шевалье')|E], будь то марочники, оейениканцы или конейкменеры, долгое время хранили глубокие связи, которые объединяют их и разрывают с равной частотой. Но когда дело доходит до защиты родины, на всём [Concept('aeras', 'Аэрасе')|E] нет ничего, что могло бы разорвать их общие узы."

 tradition_steppe_queens_name: "Степные королевы"
 tradition_steppe_queens_desc: "Общество этой культуры имеет матриархальную структуру, где ответственность за воспитание детей традиционно ложится на мужчин, в то время как женщины могут выбрать путь [Concept('órzopaja', 'орзопайи')|E] и соревноваться за славу в конном бою и военных занятиях."

 tradition_sisters_of_iron_name: "Сестры железа"
 tradition_sisters_of_iron_desc: "В этой культуре закованные в сталь [Glossary('орзопайи','GH_ORZOPAJA_GLOSS')] правят своими подданными железным кулаком. Инакомыслие и восстания приветствуются — приветствуются быть раздавленными под громовым натиском тяжелой кавалерии."

 tradition_mercenary_queens_name: "Королевы-наемницы"
 tradition_mercenary_queens_desc: "[Glossary('Орзопайи','GH_ORZOPAJA_GLOSS')] этой культуры путешествуют далеко и широко в поисках приключений и славы, предлагая свои клинки и луки за монету. Будь то кровью или золотом, королевы-наемницы всегда собирают свое."

 tradition_braided_oaths_name: "Плетеные клятвы"
 tradition_braided_oaths_desc: "[Glossary('Орзопайи','GH_ORZOPAJA_GLOSS')] без чести — вовсе не орзопай; эта культура придает огромное значение рыцарству и клятвам для установления и поддержания справедливости."

 tradition_falcon_veneration_name: "Посланники неба"
 tradition_falcon_veneration_desc: "Эта культура почитает соколов, относясь к ним как к божественным посланникам и доверенным компаньонам. Такова сила этой связи, что для многих их птица является продолжением собственного тела."

 tradition_sammalriq_name:0 "Саммалрик"
 tradition_sammalriq_desc:0 "Пустыня — место, полное опасностей; чтобы выжить, мы должны доверять друг другу. Воин, который не делится своим богатством, знаниями и оружием — вовсе не воин."
 tradition_painted_men_name:0 "Раскрашенные из Кафасали"
 tradition_painted_men_desc:0 "Эта культура следует древним воинским обычаям рахикая, раскрашивая свои лица прекрасными порошками, а свои мечи — кровью."
 tradition_shadow_trade_name:0 "Теневая торговля"
 tradition_shadow_trade_desc:0 "Теневая торговля проникла в эту культуру настолько глубоко, что каждый взгляд династа кажется предложением о прибыли."
 tradition_scarred_warriors_of_forest_name:0 "Шрамированные воины леса"
 tradition_scarred_warriors_of_forest_desc:0 "Танумареи считают леса своей игровой площадкой, шрамируя лица как знак силы и используя свои навыки в искусстве войны."
 tradition_herbalist_priests_name:0 "Жрецы-травники"
 tradition_herbalist_priests_desc:0 "Ритуальная природа цветочной медицины в культуре Танумареи приводит к тому, что травников считают прославленными жрецами, особенно благодаря их важной роли целителей для тех, кто возвращается с охоты."
 tradition_ruled_by_no_other_name:0 "Никем не управляемые"
 tradition_ruled_by_no_other_desc:0 "Мы долго были угнетены. Больше нет! Мы будем охотиться на их кровь, на тех, кто нас душит. Шрамированные никогда не будут в клетке!"
 tradition_axe_master_name: "Севра Пар"
 tradition_axe_master_desc: "[Concept('sevra_par', 'Севра Пар')|E] — ключевая часть этой культуры, и легенд о великих воинах, владеющих еще более великими топорами, предостаточно."
 tradition_middlemen_of_empires_name:0 "Посредники империй"
 tradition_middlemen_of_empires_desc:0 "Эта культура утвердилась в качестве могущественных и лояльных вассалов великих империй. Правители этой культуры редко находятся на вершине иерархии, но редко и на самом дне."
 tradition_beloved_bastards_name:0 "Любимые бастарды"
 tradition_beloved_bastards_desc:0 "Природа и мораль постановили, что родитель должен любить своих детей. Обстоятельства — или законность — их рождения не должны мешать этому долгу. Благородное семя, посеянное небрежно, сияет не менее ярко."
 tradition_mystical_midwives_name:0 "Мистические повитухи"
 tradition_mystical_midwives_desc:0 "Традиция повитух, использующих техники [Concept('magi', 'магов')|E]-недоучек, гарантирует, что даже самые тяжелые беременности могут пройти безопасно как для матери, так и для ребенка."
 tradition_bounty_of_ureha_name:0 "Дары Урехи"
 tradition_bounty_of_ureha_desc:0 "#italic «Наши сородичи могут быть одержимы силой своего клана или мощью своего клинка, но сьялволки южных пределов знают то, чего не знают наши упрямые горцы и глупые речники: мощь богов исходит от богатства их даров! С каждым урожаем мы осознаем честь, которую приносим богам, и великие города с крепостями стоят как памятники божественному богатству Низов!» #"
 tradition_warriors_of_velos_name:0 "Воины Велоса"
 tradition_warriors_desc:0 "#italic За Велоса, мы воюем! Кряжистые холмы горных домов былых времен могут не давать плодов к ужину, но мощь наших рук и сила нашей стали обеспечат это! Древнейшие дети Богов Низов знают то, что наши далекие сородичи давно забыли — пировать на дарах, собранных твоими врагами, значит пировать среди самих богов!#!"
 tradition_skalds_of_zamistra_name:0 "Скальды Замистры"
 tradition_skalds_of_zamistra_desc:0 "#italic Хотя наши боги могли сражаться как воины, они пели как могучие скальды! Некоторые говорят, что их великие легенды были выкованы из крови войн против демонов древности или из бесконечных интриг и драматизма высочайших дворов Велоса и его сородичей, но мы знаем истину лучше любого, кто претендует на нашу кровь! Легенды богов были выкованы не мечом, а словом, пересказывались от героя к герою, от скальда к скальду, и каждым искателем приключений или путешественником, у которого в холодные ночи не было ничего, кроме костра и товарищей для развлечения.#!"
 tradition_visvasavrak_guardians_name:0 "Стражи Вишвасаврака"
 tradition_visvasavrak_guardians_desc:0 "Благородные правители Маракье долгое время даровали знатный титул Вишвасаврака выдающимся воинам, которые посвятили себя борьбе за своего сюзерена до самой смерти. Во времена великих раздоров ожидается, что Вишвасавраки неохотно возьмут власть в свои руки и будут мудро направлять свой народ."
 tradition_glass_smiths_name:0 "Стекольное дело"
 tradition_glass_smiths_desc:0 "#N Скоро будет#!\n\nИскусство изготовления стекла является краеугольным камнем зелкавани. Скульптуры из стекла можно найти повсюду, от изящных ваз и горшков в домах зелкавани до самых изысканно выполненных скульптур, найденных в художественных галереях или поместьях дворян."
 tradition_elephant_racers_name:0 "Слоновьи гонки"
 tradition_elephant_racers_desc:0 "Эта культура считает использование слонов в войне глупостью. Вместо этого они предпочитают гоняться на этих величественных существах в экстравагантной манере."
 tradition_redlanders_name:0 "Жители Красных земель"
 tradition_redlanders_desc:0 "Эта культура адаптировалась к суровым Красным землям, научившись выживать в их жестких условиях и сражаться среди лабиринтоподобных структур."
 tradition_nhudabyad_name:89 "Нхудабьяд"
 tradition_nhudabyad_desc:89 "Эта культура развила талант к выращиванию растения нхудабьяд, вареные листья которого помогают им заглядывать в далекие земли."
 tradition_idealistic_past_name:89 "Идеализированное прошлое"
 tradition_idealistic_past_desc:89 "Древняя история этой культуры хорошо помнится и почитается с гордостью, а некоторыми считается прошлым более славным, чем все то, что могло бы последовать за ним."
 tradition_proud_history_name:89 "Гордая история"
 tradition_proud_history_desc:89 "Эта культура известна тем, что хранит обширные исторические хроники своей долгой и гордой истории, подробно описывая достижения, какими бы малыми они ни были."
 tradition_political_animals_name:89 "Жизнь — это политика"
 tradition_political_animals_desc:89 "Политика занимает центральное место в жизни этой культуры, здесь уважают тех, кто поднимается сквозь хаос к политическому господству."
 tradition_settlers_of_krehejad_name:89 "Поселенцы Крехеджада"
 tradition_settlers_of_krehejad_desc:89 "Острова Крехеджад были завоеваны и заселены множеством культур со всей [Concept('aversaria','Аверсарии')|E]. Они сохраняют сильное чувство общего наследия, и ни одна отдельная культура никогда не достигала гегемонии над своими братьями."
 tradition_dergi_gardens_name:89 "Величественные сады"
 tradition_dergi_gardens_desc:89 "Эта культура выражает свое единство с окружающей средой через создание грандиозных магических садов, беря на себя роль хранителя природы, пока та не будет готова принять свою окончательную форму."
 tradition_islander_name:89 "Островитяне"
 tradition_islander_desc:89 "Эта культура прекрасно адаптирована к вызовам [Concept('shatteredisles','Расколотых островов')|E], в совершенстве овладев искусством мореплавания и выживания среди разнообразной и зачастую опасной морской фауны."
 tradition_guillate_legacy_name:89 "Наследие Гийата"
 tradition_guillate_legacy_desc:89 "Легендарная фигура адмирала Гийата ден ва Крестоффексароффа вдохновила этот народ на яростный независимый дух, и его люди полны решимости навсегда изгнать все иностранные империи с [Concept('shatteredisles','Островов')|E], которые они называют своим домом."
 gh_tradition_debug_desc:89 "Отладочная культурная традиция. Если вы видите эту традицию в игре, пожалуйста, сообщите об этой ошибке на наш GitHub."
 tradition_mdala_hasira_name:89 "Мдала Хасира"
 tradition_mdala_hasira_desc:89 "Эта культура долгое время получала выгоду от обширных плантаций специй, приносящих огромное богатство ценой истощения их земель."
 tradition_mutually_beneficial_name:89 "Взаимовыгодность"
 tradition_mutually_beneficial_desc:89 "Эта культура долгое время пользовалась взаимной поддержкой другой культуры."
 tradition_competitive_name:89 "Состязательность"
 tradition_competitive_desc:89 "Эта культура имеет долгую историю соперничества, соревнований и игр."
 tradition_walking_stilts_name:89 "Ходули"
 tradition_walking_stilts_desc:89 "Эта культура с давних пор использует высокие ходули как неотъемлемую часть своего образа жизни."
 tradition_lords_of_aironoi_name: "Повелители Айроноя"
 tradition_lords_of_aironoi_desc: "Еще со времен [Concept('bayyuralar','Байюралара')|E] ольтенские военачальники удерживали власть над бескрайней [Concept('great_steppe_biozone','Айронойской степью')|E] благодаря мощи своих грозных всадников."
 tradition_kolrgii_tamers_name:89 "Наездники Великих степей"
 tradition_kolrgii_tamers_desc:89 "Эта культура давным-давно научилась, пусть и на мгновение, укрощать дикие поднебесные просторы степей Колргии."
 tradition_lightshy_name:89 "Светобоязнь"
 tradition_lightshy_desc:89 "Прожив глубоко под поверхностью Аэраса долгие годы, эта культура приспособилась к вечной тьме. Теперь, ненавидя и страшась солнечного света, они стали жестокими туннельными бойцами, способными действовать в почти полной темноте."
 culture_subterranean_desc:89 "Культура существует преимущественно под землей"
 culture_parameter_subterranean_fighters:89 "Получает повышенное [Concept('advantage','преимущество')|E] в бою в подземных регионах."
 tradition_retained_magi_name:89 "Придворные [Concept('magi','маги')|E]"
 tradition_retained_magi_desc:89 "Эта культура поддерживает сословие [Concept('magi','магов')|E], которые, не обладая прямой властью, служат доверенными советниками и помощниками своих правителей."
 tradition_lich_culture_name:89 "Короли-личи"
 tradition_lich_culture_desc:89 "Все, что осталось от этой культуры, — могущественные [Concept('liches','личи')|E], правящие обширными пространствами безжизненных пустошей."
 tradition_iron_spines_settlers_name:89 "Поселенцы Железных хребтов"
 tradition_iron_spines_settlers_desc:89 "Эта культура обосновалась на вершинах негостеприимных гор Железных хребтов, где воздух свеж, но холоден, а зимы долгие и суровые. Они гордятся тем, что немногие из низинных культур смогли бы жить так же хорошо, как этот народ, среди пиков и плато, где в противном случае могут выжить лишь дикие звери."
 tradition_mercenary_contractors_name:89 "Подрядчики наемников"
 tradition_mercenary_contractors_desc:89 "Сражаться ради денег, а не ради чести или славы, не считается грехом в этой культуре, и даже ее высшие лорды могут предоставлять свою помощь по контракту в обмен на золото."
 tradition_tenacious_herdmasters_name:89 "Упорные скотоводы"
 tradition_tenacious_herdmasters_desc:89 "Выпас скота — основа жизни этой культуры. Привыкнув кочевать по бескрайним пастбищам со своими стадами, они выработали высокую устойчивость к внешним угрозам."
 tradition_dream_interpreters_name:89 "Толкователи снов"
 tradition_dream_interpreters_desc:89 "Куда мы уходим, когда спим? Какие мимолетные судьбы можно разглядеть за роговыми вратами? Какие тайны крадет у нас приход переменчивого рассвета? Эти и другие вопросы занимают эту культуру, и у них сложилась традиция назначать Толкователей снов, чтобы раз и навсегда разгадать эту загадку."
 culture_parameter_cancer_trait_more_common:89 "[Concept('trait','Свойство')|E] «[GetTrait('cancer').GetName( GetNullCharacter )]» встречается чаще"
 culture_parameter_innovation_from_arcana_traits:89 "[Concept('education_traits','Свойства образования')|E], связанные с [Concept('arcana','арканной')|E], увеличивают прогресс [Concept('cultural_fascination','культурного интереса')|E]"
 culture_parameter_stewardship_from_arcana_education:89 "[Concept('education_traits','Свойства образования')|E], связанные с [Concept('arcana','арканной')|E], также увеличивают [Concept('stewardship','управление')|E]"
 culture_parameter_arcana_education_better_outcomes:89 "[children|E] обычно получают более качественное [Concept('education','образование')|E] в области [Concept('arcana','арканны')|E]"
 culture_parameter_arcana_education_more_valued:89 "[Concept('education_traits','Свойства образования')|E] в области [Concept('arcana','арканне')|E] ценятся выше"
 tradition_a_polis_in_time_name:89 "Полис во времени"
 tradition_a_polis_in_time_desc:89 "Старый полис [GetTitleByKey('b_mloi').GetNameNoTier], долгое время считавшийся утраченным, вернулся. Его жители все еще почитают древнюю магию мира и помнят об имперских истоках сотрудничества, но отголоски магии, некогда унесшей город в будущее, все еще можно увидеть в опухолях и тератомах, которые так распространены среди иксийцев."
 tradition_hives_of_scum_and_villainy_name:89 "Притоны отребья и порока"
 tradition_hives_of_scum_and_villainy_desc:89 "Порты [Concept('redlands_biozone','Красных земель')|E] — поистине самые жалкие и адские места на [Concept('aeras','Аэрасе')|E]. Однако они расположены на богатейшем торговом пути в мире, и знать Красноходов богатеет в башнях-крепостях над кишащими притонами своих портовых городов, где лишь самые отчаянные, глупые или безумные осмеливаются пытать счастья..."
 tradition_hydraulic_polities_name:89 "Гидравлические государства"
 tradition_hydraulic_polities_desc:89 "Народы Дахангона с давних пор освоили методы контроля наводнений и ирригации, что позволило им создавать крупномасштабные общества, сосредоточенные вокруг контроля ресурсов, в особенности воды. Сложные системы гидротехнических сооружений и каналов укротили водно-болотные угодья и поймы этого региона, а его зеленеющие холмы покрыты замысловатыми террасами с самыми разными культурами."
 tradition_wasteland_reclaimers_name:90 "Покорители пустошей"
 tradition_wasteland_reclaimers_desc:90 "Эта культура искусно обживает самые суровые условия, находя убежище в руинах и возможности в запустении. К счастью для них, [Concept('aeras','Аэрас')|E] изобилует и тем, и другим."
 tradition_mutant_outcasts_name:90 "Изгои-мутанты"
 tradition_mutant_outcasts_desc:90 "Эта культура зародилась среди несчастных изгнанников и изувеченных мутантов, которым не было места в обществе и которых оставили умирать в пораженных магией пустошах. Вопреки всем ожиданиям, они приспособились и теперь будут яростно защищать единственное место, которое могут назвать домом."
 tradition_kedari_marked_name:90 "Меченые"
 tradition_kedari_marked_desc:90 "Представители этой замкнутой культуры гордятся сложными и впечатляющими татуировками, украшающими их тела. Эти знаки не только вселяют страх в жителей поселений, на которые они совершают набеги, но и дают необычайную близость к силам за пределами физической формы."
 tradition_shared_defense_name:90 "Совместная оборона"
 tradition_shared_defense_desc:90 "Представители этой культуры с давних пор практикуют более мягкие традиции правления и налогообложения, ценя общие обязательства выше слепого подчинения."
 tradition_azakna_zagsa_name:0 "Азакна Загша"
 tradition_azakna_zagsa_desc:0 "Эта культура переняла боевое искусство и ритуальное поклонение двуручным изогнутым клинкам, что позволяет им воспитывать сильных и умелых воинов. Тяжелые мечи позволяют им косить как пехоту, так и кавалерию."
 tradition_painted_burghers_name:0 "Расписные бургеры"
 tradition_painted_burghers_desc:0 "Татуированные представители этой культуры искусны в любых купеческих делах и в искусстве манипулирования потоками золота."
 tradition_starbound_sojourners_name:0 "Звездные странники"
 tradition_starbound_sojourners_desc:0 "В этой культуре есть татуированные штурманы, которые прекрасно умеют читать океан звезд, чтобы безопасно пересекать океаны под небесами."
 tradition_inscribed_triumphs_name:0 "Запечатленные триумфы"
 tradition_inscribed_triumphs_desc:0 "Эта культура празднует каждое убийство, совершенное в бою, татуировкой, знаменующей этот подвиг."
 tradition_branded_battlemasters_name:0 "Клейменые мастера войны"
 tradition_branded_battlemasters_desc:0 "Выдающиеся воины в этой культуре именуются Дха'гераями и покрываются обильными татуировками из охряной боевой краски."
 tradition_great_calling_name:0 "Великое призвание"
 tradition_great_calling_desc:0 "Эта культура разделяет свое общество на три [Concept('great_callings','великих призвания')|E], как только их детям исполняется 16 лет."
 tradition_frontier_warriors_name:0 "Воины порубежья"
 tradition_frontier_warriors_desc:0 "Эта культура находится в постоянной борьбе за укрощение дикого северного рубежа, используя взрывоопасную смесь из элитных солдат, племенных наемников и фанатичных добровольцев."
 tradition_snowbound_resilience_name:0 "Снежная стойкость"
 tradition_snowbound_resilience_desc:0 "Эта культура полностью освоила тундру и льды. Хотя жизнь здесь часто превращается в битву с холодом, они научились использовать ледяные пустоши в свою пользу."
 culture_parameter_unlocks_additional_alliances:90 " Можно легче заключать союзы с другими персонажами, обладающими этой [Concept('tradition','традицией')|E]"
 culture_parameter_ai_more_easily_accepts_tributary:90 "Будет охотнее принимать предложения стать [Concept('tributary','данником')|E]"
 more_willing_to_accept_culturally:90 "[Concept("culture','Культура')|E] охотнее принимает статус [Concept('tributary','данника')|E]"
 has_shared_defense_tradition_trigger:90 "Должна иметь [Concept('culture_tradition','традицию')|E] «[GetCultureTradition('tradition_shared_defense').GetName]»"

 tradition_palace_economy_name: "Дворцовая экономика"
 tradition_palace_economy_desc: "Города-дворцы играют центральную роль в повседневном управлении этой культуры, централизуя распределение ресурсов и служа узлами для администрации, торговли и религиозных церемоний."
 culture_parameter_unlock_city_temple_buildings_in_castles: "Некоторые [Concept('city','городские')|E] и [Concept('temple','храмовые')|E] [Concept('buildings','постройки')|E] можно строить в [Concept('castle','замковых')|E] [holdings|E]"

 tradition_kherkeloi_war_codes_name: "Иур вол Ранну"
 tradition_kherkeloi_war_codes_desc: "Эта культура придерживается [Glossary('Иур вол Ранну','GH_IUR_VOL_RANNU_GLOSS')] — обширного свода военных законов и обычаев, который регулирует порядок боевых столкновений, защищает военнопленных и даже диктует допустимую длину солдатских сарис."
 culture_parameter_building_barracks_spearmen_bonuses: "Цепочка [Concept('buildings','зданий')|E] #V $building_type_barracks_01$#! предоставляет бонусы [Concept('spearmen','копейщикам')|E]"

 tradition_feudal_legacy_name: "Манориальное наследие"
 tradition_feudal_legacy_desc: "Эта культура имеет долгую историю аристократических ценностей, где сельские землевладельцы были важнее бургеров."
 requires_non_feudal_government_trigger: "Вы #EMP не#! должны иметь [Concept('feudal','аристократическую')|E] [Concept('government','форму правления')|E]"

