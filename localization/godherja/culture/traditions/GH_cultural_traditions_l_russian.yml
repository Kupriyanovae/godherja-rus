 # Misc ethos localization

 mpo_yearly_sorcerous: "известны своей уникальной склонностью к чарам тёмным и скверным."

 bp2_yearly.6000.desc.fault.sorcerous: "\n\n«Дитя смыслит в тайных искусствах меньше, чем гончие! [hosted_child.GetSheHe|U] совершенно не уважает высшие силы и понятия не имеет, с какими опасностями [hosted_child.GetSheHe] играет!»"
 bp2_yearly.6000.desc.value.sorcerous: "проблеск истинной силы"
 defender_of_sorcerous_ways_modifier: "Защитник чародейских устоев"
 defender_of_sorcerous_ways_modifier_desc: "$defender_of_bellicose_ways_modifier_desc$"
 bp2_yearly.6001.desc.insult.sorcerous: "чернокнижники"
 rejecting_sorcerous_ways_modifier: "Отвержение чародейских устоев"
 rejecting_sorcerous_ways_modifier_desc: "$rejecting_bellicose_ways_modifier_desc$"

 journey_events.60.desc_sorcerous: "Я натыкаюсь на обитель более известных [journey_county.GetNamePossessiveNoTooltip] кабалов [Concept('magi','магов')|E]. Высокие стены и внушительные ворота скрывают тайны магов от моих глаз, но сад во дворе открыт для путников, и здесь собралась кучка [host.Custom('GetLocalCommonerTermPlural')|U] из ближайшей деревни. Я наблюдаю, как [host.Custom('GetLocalCommonerTermPlural')|U] приносят [Select_CString(dummy_gender_soldier.IsFemale, 'полумёртвую', 'полумёртвого' )] [dummy_gender_soldier.GetWomanMan], [Select_CString(dummy_gender_soldier.IsFemale, 'покрытую', 'покрытого')] наростами-опухолями. Маг разрешает мне посмотреть, как [dummy_gender.GetSheHe] проводит сложный ритуал с использованием стружки тритона, шепчущего цветка и заклинания на языке, от звуков которого у меня волосы встают дыбом. Как только слова произнесены, вспыхивает яркий свет, раздаётся странный перезвон далёких колоколов, и, к моему изумлению, [host.Custom('GetLocalCommonerTermPlural')|U] вскакивает с ритуального стола, [Select_CString(dummy_gender_soldier.IsFemale, 'избавленная', 'избавленный')] от своего недуга и [Select_CString(dummy_gender_soldier.IsFemale, 'выглядящая', 'выглядящий')] на несколько лет моложе."
 journey_sorcerous_modifier: "Свидетель магии"
 journey_sorcerous_modifier_desc: "Этот персонаж узрел то, что можно назвать не иначе как чудом."

 hold_court_8190_sorcerous: "одержимы скверной [Concept('magic','магией')|E], которую они не в силах контролировать!"

 culture_notification.1111.ethos.sorcerous: "[new_culture.GetCollectiveNounNoTooltip] всё больше посвящают себя [Concept('magic','магическим')|E] искусствам, а их ответы на внутренние и внешние вызовы всё чаще лежат в тайнах магии."

 ep3_laamp_flavour_ewan.9521.tt.primary_skill.arcana: "Получено [skill_1.GetValue|V0] [Concept('skill','навыка')|E] [Concept('arcana','арканы')|E] за усвоение  [new_culture.GetCollectiveNoun]ого [Concept('ethos','морального принципа')|E]."

 ACTIVITY_GUEST_SORCEROUS_REASON: "[ROOT.Char.GetSheHe|U] принадлежит к колдовской [Concept('culture','культуре')|E]: $VALUE|=+0$"

 bp2_yearly.6090.a.power: "Весь мир должен узреть нашу силу."

 bp2_yearly.6214_notification_4_tooltip_high: "[Concept('magi','Маги')|E] графства [affected_county.GetName] начали практиковать более разумные [advanced_culture.GetCollectiveNoun]ие стили магии, а местные практики обеспечивают надлежащий порядок и точность заклинаний."
 bp2_yearly.6215_notification_4_tooltip_high: "[ROOT.Char.GetCulture.GetCollectiveNoun]ое магическое мастерство в [ROOT.Char.GetPrimaryTitle.GetNameNoTier], стало широко известно и [Concept('magi','маги')|E] со всех уголков мира с уважением говорят об искусстве [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]их практиков."

 ##############
 # TRADITIONS #
 ##############
 incompatible_tradition_legacy_of_aversaria: "Несовместимо с традицией «$tradition_legacy_of_aversaria_name$»"
 
 tradition_akkarashad_name: "Аккарашад Олшабар"
 tradition_akkarashad_desc: "Олтирахаийцы — кочевая воинская культура бесплодных степей, объединённая фанатичной преданностью Аккарадхамме. Известные как Аккарашад Олшабар («Орда смерти»), они скачут на быстрых боевых конях, сражаются выкованными из кости клинками, наделёнными эфирной магией, и совершают кровавые ритуалы в честь своего короля-лича, веря, что гибель в бою дарует их душам место в его вечном призрачном легионе."
 
 tradition_lodge_dominance_name: "Господство лож"
 tradition_lodge_dominance_desc: "Могущественные ложи пронизывают все аспекты жизни этой культуры, и членство в одной из них практически неотъемлемая часть повседневности."
 tradition_traders_name: "Торговцы"
 tradition_traders_desc: "Будь то из-за оптимального географического положения или просто в силу присущих культуре ценностей, этот народ имеет долгую и богатую историю коммерческой деятельности с соседями."
 tradition_mubaaizun_name: "Мубаизун"
 tradition_mubaaizun_desc: "Мубаизун — это чемпион армии [Concept('sarradon', 'Саррадона')|E]; зачастую лучшие воины лорда участвуют в ритуальном поединке перед началом битвы, сражаясь до смерти. Эти дуэли часто сопровождаются тем, что армии скандируют или оскорбляют друг друга, и известны случаи — такие как Битва мубаизунов — когда перед боем происходило множество поединков, зачастую чтобы отомстить за павшего мубааизуна."
 tradition_botai_name: "Бётай"
 tradition_botai_desc: "Бётай — это воинские отряды, созданные для набегов и товарищества. В обществах с бётай они являются основной социальной группой, определяющей, является ли человек взрослым или ребенком, и может ли он участвовать в жизни общества."
 tradition_ardara_name: "Ардара"
 tradition_ardara_desc: "Ардара — это система чести, характерная для кикарсагов. Быть храбрым в битве, щедрым в богатстве и прямолинейным в делах с другими кикарсагами — вот воплощение ардары."
 tradition_bloodhounds_of_aversaria_name: "Ищейки Аверсарии"
 tradition_bloodhounds_of_aversaria_desc: "Сихарцеги могли считать себя одними из самых грозных вершителей правосудия [Concept('aversaria', 'Аверсарии')|E], чья культура постепенно трансформировалась, чтобы отточить и преумножить самые безжалостные аспекты их общества воинов. Мятежный район, посещенный сихарцегами, обычно быстро и решительно приводился к миру — по крайней мере, к миру могил."
 tradition_legacy_of_aversaria_name: "Наследие Аверсарии"
 tradition_legacy_of_aversaria_desc: "[Concept('aversaria', 'Аверсария')|E] и её институты занимают важное место в этой культуре — независимо от того, стоит ли еще [Glossary( 'Аавтократия', 'GH_AAUTOKRATA_GLOSS' )], эти люди видят себя её подданными и наследниками."
 tradition_legacy_of_aversaria_lesser_name: "Наследие Аверсарии"
 tradition_legacy_of_aversaria_lesser_desc: "[Concept('aversaria', 'Аверсария')|E] и её институты занимают важное место в этой культуре — независимо от того, стоит ли еще [Glossary( 'Аавтократия', 'GH_AAUTOKRATA_GLOSS' )], эти люди видят себя её подданными и наследниками."
 tradition_northern_pragmatism_name: "Северный прагматизм"
 tradition_northern_pragmatism_desc: "В целом не проявляя интереса к мировым делам и довольствуясь лишь своими лесными владениями, [Concept('aversaria', 'аверсарианцы')|E] из Калатипсоми хорошо известны своей безжалостной формой прагматизма, которая часто ставила их в противоречие с их более принципиальными сородичами в остальной части империи. Однако количество бурь, которые их правящие дома пережили за столетия, является ясным свидетельством эффективности их политического подхода."
 tradition_opakhasian_opulence_name: "Опахасийское великолепие"
 tradition_opakhasian_opulence_desc: "Декаданс, царящий при опахасийских дворах, показался бы почти вульгарным в большинстве других культур, но, несомненно, сделал их крайне привлекательным местом для тех, кто ищет уровень излишеств, который обычно считается лишь сказочным."
 tradition_opulence_name: "Великолепие"
 tradition_opulence_desc: "Эта культура выставляет свое богатство напоказ."
 tradition_blood_magi_name: "Маги крови"
 tradition_blood_magi_desc: "Эта культура с большим почтением относится к практикующим [Concept('blood_magic', 'магию крови')|E] и развила навыки в этой области, которые ставят их [Concept('living_magi', 'живых магов')|E] выше большинства других."
 tradition_purity_of_blood_name: "Чистота крови"
 tradition_purity_of_blood_desc: "В этой культуре делается большой акцент на культивировании чистых, [Concept('magic', 'магических')|E] родословных."
 tradition_otachedian_law_name: "Отачедское право"
 tradition_otachedian_law_desc: "Хотя столетия и минули с её падения, правила и наставления [Concept('otachedian_empire','империи Отачеда')|E] все еще крепки в обществе этой культуры."
 tradition_literary_divergence_name: "Литературная дивергенция"
 tradition_literary_divergence_desc: "Эта культура настолько отошла от своей исторической литературы, что стала уникальной сама по себе."
 tradition_amaghean_lions_name: "Амагейские львы"
 tradition_amaghean_lions_desc: "Жители Амагеи давно овладели навыками, необходимыми для защиты своего дома в Армазлийских горах. Несгибаемая до конца, эта культура не сдаст свои горы без боя."
 tradition_centralized_name: "Централизованность"
 tradition_centralized_desc: "Расти — значит умирать! Эта культура выросла вокруг небольшого числа городов, где шум и суета городской жизни служат бьющимся сердцем их существования."
 tradition_flame_children_name: "Дети пламени"
 tradition_flame_children_desc: "Рожденная в огне и ярости, эта культура рассматривает свою веру как неотъемлемую часть своих ритуалов. Они будут отстаивать свою религию до конца и мстить за любое оскорбление в её адрес."
 tradition_kaegan_wind_name: "Ветер Каэгана"
 tradition_kaegan_wind_desc: "Смешивая амагейские и вханавидские воинские традиции, эта культура ценит кавалерию, способную проноситься по равнинам подобно божественному ветру."
 tradition_armazli_sanctuaries_name: "Армазлийские святилища"
 tradition_armazli_sanctuaries_desc: "Рожденная в высоких горах Айгаи, эта культура принимает высокие пики Армазли как свой единственный истинный дом. Ни одна гора не бывает слишком высокой, и ни один храм — слишком уединенным."
 tradition_eagle_court_name: "Плюмажное ухаживание"
 tradition_eagle_court_desc: "Дранеты следуют путями двора медленно и обдуманно. Те, кто нарушает свои клятвы, больше ничего не увидят; те, кто выступает против священных клятв, сталкиваются со смертью, которую не могут предугадать."
 tradition_world_tree_name: "Последователи Мирового древа"
 tradition_world_tree_desc: "Партики живут в соответствии с пульсом Мирового древа, которое направило их стать одними из самых искусных [Concept('magi', 'магов')|E] во всем [Concept('aeras', 'Эрасе')|E]."
 tradition_chortoson_name: "Чортосоны"
 tradition_chortoson_desc: "Эта культура сформировала глубокую связь с растением чорт и всеми успокаивающими свойствами, которые оно несет; те, кто его употребляет, кажутся более легкими в общении."
 tradition_chevalien_identity_name: "Наследие Шевалье"
 tradition_chevalien_identity_desc: "Дети современного [Concept('chevalie', 'Шевалье')|E], будь то марочники, оежейниканцы или конейкменеры, долгое время хранили глубокие связи, которые объединяют их и разрывают с равной частотой. Но когда дело доходит до защиты родины, на всём [Concept('aeras', 'Эрасе')|E] нет ничего, что могло бы разорвать их общие узы."

 tradition_steppe_queens_name: "Степные королевы"
 tradition_steppe_queens_desc: "Общество этой культуры имеет матриархальную структуру, где ответственность за воспитание детей традиционно ложится на мужчин, в то время как женщины могут выбрать стать [Glossary('орзопаей','GH_ORZOPAJA_GLOSS')] и соревноваться за славу в конном бою и военных занятиях."

 tradition_sisters_of_iron_name: "Сестры железа"
 tradition_sisters_of_iron_desc: "В этой культуре закованные в сталь [Glossary('орзопаяды','GH_ORZOPAJA_GLOSS')] правят своими подданными железным кулаком. Инакомыслие и восстания приветствуются — их с радостью раздавят под громовым натиском тяжелой кавалерии."

 tradition_mercenary_queens_name: "Королевы-наемницы"
 tradition_mercenary_queens_desc: "[Glossary('Орзопаяды','GH_ORZOPAJA_GLOSS')] этой культуры путешествуют по всему миру в поисках приключений и славы, предлагая свои клинки и луки за монету. Будь то кровью или золотом, королевы-наемницы всегда собирают свое."

 tradition_braided_oaths_name: "Плетеные клятвы"
 tradition_braided_oaths_desc: "[Glossary('Орзопая','GH_ORZOPAJA_GLOSS')] без чести — вовсе не орзопая; эта культура придает огромное значение рыцарству и клятвам для установления и поддержания справедливости."

 tradition_falcon_veneration_name: "Посланники неба"
 tradition_falcon_veneration_desc: "Эта культура почитает соколов, относясь к ним как к божественным посланникам и доверенным напарникам. Такова сила этой связи, что для многих их птица является продолжением собственного тела."

 tradition_sammalriq_name: "Саммалрик"
 tradition_sammalriq_desc: "Пустыня — место, полное опасностей и чтобы выжить, мы должны доверять друг другу. Воин, который не делится своим богатством, знаниями и оружием — вовсе не воин."
 tradition_painted_men_name: "Раскрашенные из Кафасали"
 tradition_painted_men_desc: "Эта культура следует древним воинским обычаям рахикаев, раскрашивая свои лица прекрасными порошками, а свои мечи — кровью."
 tradition_shadow_trade_name: "Теневая торговля"
 tradition_shadow_trade_desc: "Теневая торговля проникла в эту культуру настолько глубоко, что каждый взгляд династа кажется предложением о прибыли."
 tradition_scarred_warriors_of_forest_name: "Шрамированные воины леса"
 tradition_scarred_warriors_of_forest_desc: "Танумарейцы считают леса своей игровой площадкой, шрамируя лица как знак силы и используя свои навыки в искусстве войны."
 tradition_herbalist_priests_name: "Жрецы-травники"
 tradition_herbalist_priests_desc: "Ритуальная природа цветочной медицины в танумарейской культуре приводит к тому, что травников считают прославленными жрецами, особенно благодаря их важной роли целителей для тех, кто возвращается с охоты."
 tradition_ruled_by_no_other_name: "Никем не управляемые"
 tradition_ruled_by_no_other_desc: "Мы долго были угнетены. Больше нет! Мы будем охотиться на их кровь, на тех, кто нас душит. Шрамированные никогда не будут в клетке!"
 tradition_axe_master_name: "Севра Пар"
 tradition_axe_master_desc: "[Concept('sevra_par', 'Севра Пар')|E] — ключевая часть этой культуры, и легенд о великих воинах, владеющих еще более великими топорами, предостаточно."
 tradition_middlemen_of_empires_name: "Посредники империй"
 tradition_middlemen_of_empires_desc: "Эта культура утвердилась в качестве могущественных и лояльных вассалов великих империй. Правители этой культуры редко находятся на вершине иерархии, но редко и на самом дне."
 tradition_beloved_bastards_name: "Любимые бастарды"
 tradition_beloved_bastards_desc: "Природа и мораль постановили, что родитель должен любить своих детей. Обстоятельства — или законность — их рождения не должны мешать этому долгу. Благородное семя, посеянное небрежно, сияет не менее ярко."
 tradition_mystical_midwives_name: "Мистические повитухи"
 tradition_mystical_midwives_desc: "Традиция повитух, использующих техники [Concept('magi', 'магов')|E]-недоучек, гарантирует, что даже самые тяжелые беременности могут пройти безопасно как для матери, так и для ребенка."
 tradition_bounty_of_ureha_name: "Дары Урехи"
 tradition_bounty_of_ureha_desc: "#italic «Наши сородичи могут быть одержимы силой своего клана или мощью своего клинка, но сьялволки южных пределов знают то, чего не знают наши упрямые родичи горцы и глупые речники: мощь богов исходит от богатства их даров! С каждым урожаем мы осознаем честь, которую приносим богам, и великие города с крепостями стоят как памятники божественному богатству Низов!» #"
 tradition_warriors_of_velos_name: "Воины Велоса"
 tradition_warriors_of_velos_desc: "#italic За Велоса мы идём на войну! Пусть скалистые холмы давних Горных обителей не приносят плодов к ужину, но мощь наших рук и сила нашей стали прокормят нас! Старейшие дети Нижних богов знают то, о чём наша далёкая родня давно забыла: пировать плодами, собранными твоими врагами, — значит пировать среди самих богов!#!"
 tradition_skalds_of_zamistra_name: "Скальды Замистры"
 tradition_skalds_of_zamistra_desc: "#italic Хотя наши боги могли сражаться как воины, они пели как могучие скальды! Некоторые говорят, что их великие легенды были выкованы из крови войн против демонов древности или из бесконечных интриг и драматизма высочайших дворов Велоса и его родичей, но мы знаем истину лучше любого, кто претендует на нашу кровь! Легенды богов были выкованы не мечом, а словом, пересказывались от героя к герою, от скальда к скальду, и каждым искателем приключений или путешественником, у которого в холодные ночи не было ничего, кроме костра и товарищей для развлечения.#!"
 tradition_visvasavrak_guardians_name: "Стражи Вишвасаврака"
 tradition_visvasavrak_guardians_desc: "Благородные маракьеские правители долгое время даровали знатный титул вишвасаврака выдающимся воинам, которые посвятили себя борьбе за своего сюзерена до самой смерти. Во времена великих раздоров ожидается, что вишвасавраки неохотно возьмут власть в свои руки и будут мудро направлять свой народ."

 tradition_elephant_racers_name: "Слоновьи гонки"
 tradition_elephant_racers_desc: "Эта культура считает использование слонов в войне глупостью. Вместо этого они предпочитают гоняться на этих величественных существах в экстравагантной манере."
 culture_parameter_unlock_elephant_pens_building_in_forest: "Можно строить цепочку [Concept('buildings','зданий')|E] #V «$building_type_elephant_pens_01$»#! во [Concept('holdings','владениях')|E] этой [Concept('culture','культуры')|E] с [Concept('terrain', 'типом местности')|E] [GetTerrain('forest').GetName]"

 tradition_redlanders_name: "Жители Красных земель"
 tradition_redlanders_desc: "Эта культура адаптировалась к суровым Красным землям, научившись выживать в их жестких условиях и сражаться среди лабиринтоподобных структур."
 tradition_nhudabyad_name: "Нхудабьяд"
 tradition_nhudabyad_desc: "Эта культура развила талант к выращиванию растения нхудабьяд, вареные листья которого помогают им заглядывать в запредельные земли."
 tradition_idealistic_past_name: "Идеализированное прошлое"
 tradition_idealistic_past_desc: "Древняя история этой культуры хорошо помнится и почитается с гордостью, а некоторыми считается прошлым более славное, чем все то, что могло бы последовать за ним."
 tradition_proud_history_name: "Гордая история"
 tradition_proud_history_desc: "Эта культура известна тем, что хранит обширные исторические хроники своей долгой и гордой истории, подробно описывая достижения, какими бы малыми они ни были."
 tradition_political_animals_name: "Жизнь — это политика"
 tradition_political_animals_desc: "Политика занимает центральное место в жизни этой культуры, здесь уважают тех, кто поднимается сквозь хаос к политическому господству."
 tradition_settlers_of_krehejad_name: "Поселенцы Крехеджада"
 tradition_settlers_of_krehejad_desc: "Острова Крехеджад были завоеваны и заселены множеством культур со всей [Concept('aversaria','Аверсарии')|E]. Они сохраняют сильное чувство общего наследия, и ни одна отдельная культура никогда не достигала гегемонии над своими братьями."
 tradition_dergi_gardens_name: "Величественные сады"
 tradition_dergi_gardens_desc: "Эта культура выражает свое единство с окружающей средой через создание грандиозных магических садов, беря на себя роль хранителя природы, пока та не будет готова принять свою окончательную форму."
 tradition_islander_name: "Островитяне"
 tradition_islander_desc: "Эта культура прекрасно адаптирована к вызовам [Concept('shatteredisles','Расколотых островов')|E], в совершенстве овладев искусством мореплавания и выживания среди разнообразной и зачастую опасной морской фауны."
 tradition_guillate_legacy_name: "Наследие Гийята"
 tradition_guillate_legacy_desc: "Легендарная фигура адмирала Гийята ден ва Крестоффексароффа вдохновила этот народ на яростный независимый дух, и его люди полны решимости навсегда изгнать все иностранные империи с [Concept('shatteredisles','Островов')|E], которые они называют своим домом."
 gh_tradition_debug_desc: "Отладочная культурная традиция. Если вы видите эту традицию в игре, пожалуйста, сообщите об этой ошибке на наш GitHub."
 tradition_mdala_hasira_name: "Мдала Хасира"
 tradition_mdala_hasira_desc: "Эта культура долгое время получала выгоду от обширных плантаций специй, приносящих огромное богатство ценой истощения их земель."
 tradition_mutually_beneficial_name: "Взаимовыгодность"
 tradition_mutually_beneficial_desc: "Эта культура долгое время пользовалась взаимной поддержкой другой культуры."
 tradition_competitive_name: "Состязательность"
 tradition_competitive_desc: "Эта культура имеет долгую историю соперничества, соревнований и игр."
 tradition_walking_stilts_name: "Ходули"
 tradition_walking_stilts_desc: "Эта культура с давних пор использует высокие ходули как неотъемлемую часть своего образа жизни."
 tradition_lords_of_aironoi_name: "Повелители Айроноя"
 tradition_lords_of_aironoi_desc: "Еще со времен [Concept('bayyuralar','Байюралара')|E] ольтенские военачальники удерживали власть над бескрайней [Concept('great_steppe_biozone','Айронойской степью')|E] благодаря мощи своих грозных всадников."
 tradition_kolrgii_tamers_name: "Наездники Великих степей"
 tradition_kolrgii_tamers_desc: "Эта культура давным-давно научилась, пусть и на мгновение, укрощать дикие поднебесные просторы степей Колргии."
 tradition_the_unmade_empire_name: "Незавершённая империя"
 tradition_the_unmade_empire_desc: "Это не павшая империя, а лишь прерванная. От притязаний никто никогда не отказывался — их просто отложили на полуслове, и с тех пор каждое поколение спрашивают, станет ли оно тем, кто доведёт дело до конца.\n\nКромландар, решивший объединить старое государство, обнаруживает, что эта задача обходится странно дёшево, а за претендентом, который перешёл к делу, люди идут куда охотнее."
 culture_parameter_can_use_kromlandar_unification_cbs: "Может использовать [Concept('casus_belli','казус-белли')|E] завоевания [Concept('county','графства')|E] и [Concept('duchy','герцогства')|E] против других держав этой [Concept('culture','культуры')|E]"
 tradition_ten_thousand_years_asail_name: "Десять тысяч лет под парусом"
 tradition_ten_thousand_years_asail_desc: "Старейшая мореходная традиция, известная человечеству, и она никогда не видела солнца. Десять тысяч лет среди чёрных вод оставили этой культуре карты, которые не способен прочесть наземный мир, и искусство кораблестроения, которое никому не требовалось улучшать целую эпоху."
 #cannot_have_tradition_seafaring: "$cannot_combine_tradition_trigger_desc$ #high $tradition_seafaring_name$#!"
 tradition_gillkin_name: "Жаброносцы"
 tradition_gillkin_desc: "Что бы ни гласили их священные тексты о происхождении этих даров, плавники и жабры — неотъемлемая суть этой культуры. Солёная вода для них не более враждебна, чем воздух, болезнь к ним почти не липнет, а выпавшего за борт скорее вытащат обратно, чем будут оплакивать.\n\nДругие народы находят их облик чуждым и оттого неохотно идут с ними на сближение."

 tradition_rolls_of_the_peace_name: "Реестры мира"
 tradition_rolls_of_the_peace_desc: "Эта культура возникла в результате мирного договора, и с тех пор ею управляют документы. Каждая душа, каждое владение и каждое обязательство заносятся в реестры и тщательно переписываются прилежными писарями. Державе, точно знающей свои ресурсы, трудно противостоять, пусть даже по налоговым ведомостям плоховато собирать призывников."
 tradition_ceilingborne_name: "Сводорожденные"
 tradition_ceilingborne_desc: "Детей этой культуры поднимают на стены ещё до того, как они научатся ходить, и они никогда не спускаются окончательно. Они пересекают зал по потолку так же легко, как и по полу, и способны взять крепость, перешагнув через неё, а не пробиваясь сквозь стены. Многие сохраняют привычку невидимо выжидать под самым сводом и обладают пугающим терпением."
 
 tradition_lightshy_name: "Светобоязнь"
 tradition_lightshy_desc: "Прожив глубоко под поверхностью Эраса долгие годы, эта культура приспособилась к вечной тьме. Теперь, ненавидя и страшась солнечного света, они стали жестокими туннельными бойцами, способными действовать в почти полной темноте."
 culture_subaeranean_desc: "Культура находится по большей части подземлей"
 culture_parameter_subaeranean_fighters: "Получае увеличенное [Concept('advantage','преимущество')|E] в битве в подэрасских регионах."
 tradition_retained_magi_name: "Придворные [Concept('magi','маги')|E]"
 tradition_retained_magi_desc: "Эта культура поддерживает сословие [Concept('magi','магов')|E], которые, не обладая прямой властью, служат доверенными советниками и помощниками своих правителей."
 tradition_lich_culture_name: "Короли-личи"
 tradition_lich_culture_desc: "Все, что осталось от этой культуры, — могущественные [Concept('liches','личи')|E], правящие обширными пространствами безжизненных пустошей."
 tradition_iron_spines_settlers_name: "Поселенцы Железных хребтов"
 tradition_iron_spines_settlers_desc: "Эта культура обосновалась на вершинах негостеприимных гор Железных хребтов, где воздух свеж, но холоден, а зимы долгие и суровые. Они гордятся тем, что немногие из низинных культур смогли бы жить так же хорошо, как этот народ, среди пиков и плато, где в противном случае могут выжить лишь дикие звери."
 tradition_mercenary_contractors_name: "Подрядчики наемников"
 tradition_mercenary_contractors_desc: "Сражаться ради денег, а не ради чести или славы, не считается грехом в этой культуре, и даже ее высшие лорды могут предоставлять свою помощь по контракту в обмен на золото."
 tradition_tenacious_herdmasters_name: "Упорные скотоводы"
 tradition_tenacious_herdmasters_desc: "Выпас скота — основа жизни этой культуры. Привыкнув кочевать по бескрайним пастбищам со своими стадами, они выработали высокую устойчивость к внешним угрозам."
 tradition_dream_interpreters_name: "Толкователи снов"
 tradition_dream_interpreters_desc: "Куда мы уходим, когда спим? Какие мимолетные судьбы можно разглядеть за роговыми вратами? Какие тайны крадет у нас приход переменчивого рассвета? Эти и другие вопросы занимают эту культуру, и у них сложилась традиция назначать Толкователей снов, чтобы раз и навсегда разгадать эту загадку."
 culture_parameter_cancer_trait_more_common: "[Concept('trait','Свойство')|E] «[GetTrait('cancer').GetName( GetNullCharacter )]» встречается чаще"
 culture_parameter_innovation_from_arcana_traits: "[Concept('education_traits','Свойства образования')|E], связанные с [Concept('arcana','арканой')|E], увеличивают прогресс [Concept('cultural_fascination','культурного интереса')|E]"
 culture_parameter_stewardship_from_arcana_education: "[Concept('education_traits','Свойства образования')|E], связанные с [Concept('arcana','арканой')|E], также увеличивают [Concept('stewardship','управление')|E]"
 culture_parameter_arcana_education_better_outcomes: "[children|E] обычно получают более качественное [Concept('education','образование')|E] в области [Concept('arcana','арканы')|E]"
 culture_parameter_arcana_education_more_valued: "[Concept('education_traits','Свойства образования')|E] в области [Concept('arcana','аркане')|E] ценятся выше"
 tradition_a_polis_in_time_name: "Полис во времени"
 tradition_a_polis_in_time_desc: "Старый [Glossary('полис','GH_POLISOCRACY_GLOSS')] [GetTitleByKey('b_mloi').GetNameNoTier], долгое время считавшийся утраченным, вернулся. Его жители все еще почитают древнюю магию мира и помнят об имперских истоках сотрудничества, но отголоски магии, некогда унесшей город в будущее, все еще можно увидеть в опухолях и тератомах, которые так распространены среди иксийцев."
 tradition_hives_of_scum_and_villainy_name: "Притоны отребья и порока"
 tradition_hives_of_scum_and_villainy_desc: "Порты [Concept('redlands_biozone','Красных земель')|E] — поистине самые жалкие и адские места на [Concept('aeras','Эрасе')|E]. Однако они расположены на богатейшем торговом пути в мире, и знать красноходов богатеет в башнях-крепостях над кишащими притонами своих портовых городов, где лишь самые отчаянные, глупые или безумные осмеливаются пытать счастья..."
 tradition_hydraulic_polities_name: "Чаварид"
 tradition_hydraulic_polities_desc: "Народы Дахангона с давних пор освоили методы контроля наводнений и ирригации, что позволило им создавать крупномасштабные общества, сосредоточенные вокруг контроля ресурсов, в особенности воды. Сложные системы гидротехнических сооружений и каналов укротили водно-болотные угодья и поймы этого региона, а его зеленеющие холмы покрыты замысловатыми террасами с самыми разными культурами."
 tradition_wasteland_reclaimers_name: "Покорители пустошей"
 tradition_wasteland_reclaimers_desc: "Эта культура искусно обживает самые суровые условия, находя убежище в руинах и возможности в запустении. К счастью для них, [Concept('aeras','Эрас')|E] изобилует и тем, и другим."
 tradition_mutant_outcasts_name: "Изгои-мутанты"
 tradition_mutant_outcasts_desc: "Эта культура зародилась среди несчастных изгнанников и изувеченных мутантов, которым не было места в обществе и которых оставили умирать в пораженных магией пустошах. Вопреки всем ожиданиям, они приспособились и теперь будут яростно защищать единственное место, которое могут назвать домом."
 tradition_kedari_marked_name: "Меченые"
 tradition_kedari_marked_desc: "Представители этой замкнутой культуры гордятся сложными и впечатляющими татуировками, украшающими их тела. Эти знаки не только вселяют страх в жителей поселений, на которые они совершают набеги, но и дают необычайную близость к силам за пределами физической формы."
 tradition_shared_defense_name: "Совместная оборона"
 tradition_shared_defense_desc: "Представители этой культуры с давних пор практикуют более мягкие традиции правления и налогообложения, ценя общие обязательства выше слепого подчинения."
 tradition_azakna_zagsa_name: "Азакна Загша"
 tradition_azakna_zagsa_desc: "Эта культура переняла боевое искусство и ритуальное поклонение двуручным изогнутым клинкам, что позволяет им воспитывать сильных и умелых воинов. Тяжелые мечи позволяют им косить как пехоту, так и кавалерию."
 tradition_painted_burghers_name: "Расписные бюргеры"
 tradition_painted_burghers_desc: "Татуированные представители этой культуры искусны в любых купеческих делах и в искусстве манипулирования потоками золота."
 tradition_starbound_sojourners_name: "Звездные странники"
 tradition_starbound_sojourners_desc: "В этой культуре есть татуированные штурманы, которые прекрасно умеют читать океан звезд, чтобы безопасно пересекать океаны под небесами."
 tradition_scourge_of_the_seas_name: "Плеть морей"
 tradition_scourge_of_the_seas_desc: "[Concept('warrior_women_ehatm','Воительницы э’хатм')|E] прославленные налётчицы, известные за их ужасающие пиратские флотилии,  терзавшие Море Империй с дописьменных времён." 
 tradition_inscribed_triumphs_name: "Запечатленные триумфы"
 tradition_inscribed_triumphs_desc: "Эта культура празднует каждое убийство, совершенное в бою, татуировкой, знаменующей этот подвиг."
 tradition_branded_battlemasters_name: "Клейменые мастера войны"
 tradition_branded_battlemasters_desc: "Выдающиеся воины в этой культуре именуются за'гераями и покрываются обильными татуировками из охряной боевой краски."
 tradition_great_calling_name: "Великое призвание"
 tradition_great_calling_desc: "Эта культура посвящает молодежь в одно из трех [Concept('great_callings','великих призваний')|E] по достижении совершеннолетия "
 culture_parameter_select_great_calling_active: "Открывает [Concept('decision','решение')|E] [GetDecisionWithKey('select_great_calling_decision').GetName]"

 tradition_frontier_warriors_name: "Воины порубежья"
 tradition_frontier_warriors_desc: "Эта культура находится в постоянной борьбе за укрощение дикого северного рубежа, используя взрывоопасную смесь из элитных солдат, племенных наемников и фанатичных добровольцев."
 tradition_snowbound_resilience_name: "Снежная стойкость"
 tradition_snowbound_resilience_desc: "Эта культура полностью освоила тундру и льды. Хотя жизнь здесь часто превращается в битву с холодом, они научились использовать ледяные пустоши в свою пользу."
 culture_parameter_unlocks_additional_alliances: " Можно легче заключать союзы с другими персонажами, обладающими этой [Concept('tradition','традицией')|E]"
 culture_parameter_ai_more_easily_accepts_tributary: "Будет охотнее принимать предложения стать [Concept('tributary','данником')|E]"
 more_willing_to_accept_culturally: "[Concept("culture','Культура')|E] охотнее принимает статус [Concept('tributary','данника')|E]"
 has_shared_defense_tradition_trigger: "Должна иметь [Concept('culture_tradition','традицию')|E] «[GetCultureTradition('tradition_shared_defense').GetName]»"

 tradition_palace_economy_name: "Дворцовая экономика"
 tradition_palace_economy_desc: "Города-дворцы играют центральную роль в повседневном управлении этой культуры, централизуя распределение ресурсов и служа узлами для администрации, торговли и религиозных церемоний."
 culture_parameter_unlock_city_temple_buildings_in_castles: "Некоторые [Concept('city','городские')|E] и [Concept('temple','храмовые')|E] [Concept('buildings','постройки')|E] можно строить в [Concept('castle','замковых')|E] [Concept('holdings','владениях')|E]"

 tradition_kherkeloi_war_codes_name: "Иур вол Ранну"
 tradition_kherkeloi_war_codes_desc: "Эта культура придерживается [Glossary('Иур вол Ранну','GH_IUR_VOL_RANNU_GLOSS')] — обширного свода военных законов и обычаев, который регулирует порядок боевых столкновений, защищает военнопленных и даже диктует допустимую длину солдатских сарисс."
 culture_parameter_building_barracks_spearmen_bonuses: "Цепочка [Concept('buildings','зданий')|E] #V $building_type_barracks_01$#! предоставляет бонусы [Concept('spearmen','копейщикам')|E]"

 tradition_adept_glassworkers_name: "Искусные стеклодувы"
 tradition_adept_glassworkers_desc: "Искусство стеклоделия — краеугольный камень идентичности этой культуры. Изящные стеклянные изделия можно найти повсюду: от простых кувшинов и чаш в домах простолюдинов до изысканных стеклянных скульптур в дворянских поместьях."
 culture_parameter_unlock_glassmith_trait: "[characters|E] могут получить [Concept('trait','свойство')|E] «[GetTrait('gh_lifestyle_glassmith').GetName( GetNullCharacter )]»"
 culture_parameter_glassmith_traits_more_valued: "[Concept('trait','Свойство')|E] «[GetTrait('gh_lifestyle_glassmith').GetName( GetNullCharacter )]» считается [Concept('prestigious','престижным')|E][prestige_i]"
 culture_parameter_can_make_glass_artifacts: "Открывает [Concept('decision','решение')|E] «[GetDecisionWithKey('create_glass_artifact_decision').GetName]»"
 culture_parameter_improved_glassware_inspiration: "[Concept('characters','Персонажи')|E] этой [Concept('culture','культуры')|E] создают [Concept('artifacts','артефакты')|E] более высокого качества, завершая [Concept('inspiration','вдохновения')|E] типа #high Стеклянные изделия#!"
 culture_parameter_can_appoint_court_gaffer: "Позволяет назначать персонажа на [Concept('court_position','придворную должность')|E] #high [GetCourtPositionType('court_gaffer_court_position').GetName]#!"
 culture_parameter_enable_glassworks_building: "Правители могут строить [Concept('duchy_building','герцогскую постройку')|E] «[GetBuilding('gh_glassworks_01').GetName]»"

 tradition_feudal_legacy_name: "Поместническое наследие"
 tradition_feudal_legacy_desc: "Эта культура имеет долгую историю аристократических ценностей, где сельские землевладельцы были важнее бюргеров."
 requires_non_feudal_government_trigger: "Вы #EMP не#! должны иметь [Concept('feudal','аристократическую')|E] [Concept('government','форму правления')|E]"

 tradition_whistling_wilds_name: "Свистящие дебри"
 tradition_whistling_wilds_desc: "Глубокие леса и тёмная тайга — исконный дом этой культуры. Охотники и следопыты общаются тихим свистом, и никто не смеет без спроса ступить на их земли."
 culture_parameter_culture_language_is_hard_to_learn: "[Concept( 'success_chance', 'Шанс успеха' )|E] происков «[GetScheme('learn_language').GetTypeName]» против [characters|E] этой [culture|E] существенно снижается"
 SCHEME_HARD_LANGUAGE_MODIFIER: "[Concept('language','Язык')|E] [target.GetCulture.GetCollectiveNoun]ой культуры очень трудно выучить: [success_chance_i]$VALUE|+=0$"

 tradition_wo_ashanan_name: "Во-Ашанан"
 tradition_wo_ashanan_desc: "[Concept('wo_ashanan','Во-Ашанан')|E] — неотъемлемая часть идентичности этой культуры."
 culture_parameter_burial_site_dread_bonuses: "[SelectLocalization( HasDlcFeature( 'legends' ), 'culture_parameter_burial_site_dread_bonuses_HAS_LEGENDS_DLC', 'culture_parameter_burial_site_dread_bonuses_NO_LEGENDS_DLC' )]"
 culture_parameter_burial_site_dread_bonuses_NO_LEGENDS_DLC: ""
 culture_parameter_burial_site_dread_bonuses_HAS_LEGENDS_DLC: "Цепочка [Concept('duchy_buildings','герцогских построект')|E] #V $building_type_burial_site_01$#! даёт бонусы к [Concept('dread','ужасу')|E] и может быть построена [Concept('tribal','племенными')|E] [Concept('rulers','правителями')|E]"
 culture_parameter_can_take_skulls_in_battle: "Может забирать черепа павших  в [Concept('battles','битвах')|E]  врагов в качестве [Concept('artifacts','артефактов')|E]"
 culture_parameter_can_extract_skulls: "[Concept('rulers','Правители')|E] получают доступ к способу [Concept('execution','казни')|E] #V Извлечение черепа#!"
 culture_parameter_destroying_skulls_is_pious: "Может уничтожать [Concept('artifacts','артефакты')|E]-черепа ради [Concept('piety','благочестия')|E]"
 culture_parameter_skull_artifact_claims: "[Concept('characters','Персонажи')|E] получают [Concept('artifact_claims','притязания')|E] на [Concept('artifacts','артефакты')|E]-черепа членов своего [Concept('house','дома')|E]"

 tradition_enigmatic_stalkers_name: "Загадочные преследователи"
 tradition_enigmatic_stalkers_desc: "TODO"

 tradition_skull_meisters_name: "Мастера черепов"
 tradition_skull_meisters_desc: "TODO"

 tradition_beetle_riders_name: "Наездники на скарабеях"
 tradition_beetle_riders_desc: "Скарабеи были давным-давно одомашнены для работы и войны в суровых пустынях [Glossary('Кемсара','kemsar_encyclopedia_desc')], обеспечивая достаточно рабочей силы среди выжженных песков."
 culture_parameter_beetle_training_internal_yurt_unlock: "[SelectLocalization( HasDlcFeature( 'khans_of_the_steppe' ), 'cultrad_beetle_riders_nomadic_desc', 'blank_line' )]"
 cultrad_beetle_riders_nomadic_desc: "Открывает [Concept('domicile_building_upgrade', 'внутреннее улучшение')|E] «[GetDomicileBuilding('beetle_yurt_01').GetName]» для  #TOOLTIP:GOVERNMENT_TYPE,nomad_government #L кочевых#!#! [Concept('domiciles', 'имений')|E]"
 domicile_building_parameter_ahan_unlocks_beetle_knights: "Позволяет нанимать [Concept('men_at_arms','профессионалов')|E] «[GetMaA('beetle_knight').GetName]»"



 tradition_sandsingers_name: "Пустынный хор"
 tradition_sandsingers_desc: "Эта культура издавна пестовала воинские традиции стремления стать единым целым с песками. Могущественная магия ведёт их сквозь песни и ритуалы к лучшему пониманию дюн."

 tradition_sand_skiffs_name: "Песчаные скифы"
 tradition_sand_skiffs_desc: "Эта культура издавна хранит секреты удивительной технологии [Concept('sand_skiffs','песчаных скифов')|E], позволяющей ходить по [Glossary('Саррадонской пустыне','sarradonian_desert_encyclopedia_desc')], словно по бескрайнему морю."
 culture_parameter_sand_skiff_internal_yurt_unlock: "[SelectLocalization( HasDlcFeature( 'khans_of_the_steppe' ), 'cultrad_sand_skiff_nomadic_desc', 'blank_line' )]"
 cultrad_sand_skiff_nomadic_desc: "Открывает [Concept('domicile_building_upgrade', 'внутреннее улучшение')|E] «[GetDomicileBuilding('sand_skiff_yurt_01').GetName]» для  #TOOLTIP:GOVERNMENT_TYPE,nomad_government #L кочевых#!#! [Concept('domiciles', 'имений')|E]"

 tradition_blood_of_giants_name: "Кровь великанов"
 tradition_blood_of_giants_desc: "Говорят, что эта культура происходит от исполинского полубога-воителя, чья кровь по сей день течёт в их жилах."

 tradition_children_of_the_heights_name: "Дети высот"
 tradition_children_of_the_heights_desc: "Эта культура жила на самой крыше мира в высеченных в скалах домах, которые древнее самих живших в них племён. Разряжённый воздух, от которого задыхаются жители низин, для них подобен дыханию матери, а вот плоская, тяжёлая земля равнин давит им на грудь."
 tradition_heights_left_behind_desc: "Высоты остались позади"
 
 tradition_pasture_feuds_name: "Пастбищная вражда"
 tradition_pasture_feuds_desc: "Плодородных пастбищ на высотах мало, и эта культура воевала за них с незапамятных времён. Кровь, пролитая между соседями из-за прав на выпас, здесь не преступление, а обычай. Каждый пастух наполовину воин, а каждый воин вынашивает обиду."

 tradition_heartwoods_name: "Обитатели Земель Кланов"
 tradition_heartwoods_desc: "От глубоких мистических лесов Сердцелесья до внушающих трепет гейзеров и водопадов Грезящих холмов — эти люди сделали Калатипсоми своим домом."
 tradition_owl_masks_name: "Совиные маски"
 tradition_owl_masks_desc: "Ордикины славятся как умелые наёмники, бандиты и охотники, но самым узнаваемым и известным их атрибутом остаются знаменитые cовиные маски."
 ##############################
 # RICE TRADITIONS INTEGRATED #
 ##############################
 
 tradition_RICE_agdud_iqadib_name: "Агдуд Икадиб"
 tradition_RICE_agdud_iqadib_desc: "Эта культура происходит от богатой истории кочевой жизни в [Glossary('Саррадонской пустыне','sarradonian_desert_encyclopedia_desc')] в составе [Concept('marmaladid_great_tribes','Великих племен мармаладидов')|E], и организует свои кланы под началом как мужчин, так и женщин."
 culture_parameter_unlock_rice_cheaper_dream_divination: "[Concept('activity', 'Занятие')|E] «$activity_RICE_tuareg_dream_incubation$» обходится дешевле"

 tradition_RICE_oral_poetry_name: "Устные сказания"
 tradition_RICE_oral_poetry_desc: "Эта культура считает запоминание и декламацию устной поэзии благородным искусством. Это одна из немногих форм развлечения в пустыне. Дети с малых лет часами слушают о культурных героях и ценностях своего народа."

 tradition_RICE_settled_nomads_name: "Оседлые кочевники"
 tradition_RICE_settled_nomads_desc: "Эта культура когда-то вела суровое существование среди дюн [Glossary('Саррадонской пустыни','sarradonian_desert_encyclopedia_desc')], но с тех пор перешла к оседлому образу жизни. Тем не менее, они порой всё ещё с осторожностью относятся к централизованной власти."


 tradition_kathunkai_cultural_circle_name: "Народ Первого Дракона"
 tradition_kathunkai_cultural_circle_desc: "Мы пишем одними и теми же иероглифами, наследуем одну историю. Учения Драконьей Императрицы Яо Жэнь Цай-Тяйян отзываются в наших умах. Мы все — часть Катун-Кая, связанные друг с другом как братья."
 culture_parameter_kathuni_tolerance: "[Concept( 'cultural_acceptance_baseline', 'Базовая терпимость' )|E] с [Concept('cultures','культурами')|E], разделяющими [GetCulturePillar('heritage_easterner').GetName]им [Concept('heritage','наследием')|E]: #P +40%#!"
 culture_parameter_kathuni_and_dahangon_tolerance: "[Concept( 'cultural_acceptance_baseline', 'Базовая терпимость' )|E] с [Concept('cultures','культурами')|E], разделяющими [GetCulturePillar('heritage_tanarka').GetName]ое [Concept('heritage','наследие')|E] или ту же [Concept('tradition','традицию')|E]: #P +30%#!"
 culture_parameter_tanarka_heritage_easier_to_hybdrize: "Создание гибридной [Concept('culture','культуры')|E] с [GetCulturePillar('heritage_tanarka').GetName]им [Concept('heritage','наследием')|E] требует на #V 50%#! меньше [Concept('cultural_acceptance','терпимости')|E]"
 culture_parameter_tradition_mubaaizun_tolerance: "[Concept( 'cultural_acceptance_baseline', 'Базовая терпимость' )|E] с [Concept('cultures','культурами')|E], имеющими ту же [Concept('tradition','традицию')|E]: #P +10%#!"
 culture_parameter_gh_art_of_diplomacy: "Принятие предложения [Concept('alliance','союза')|E]: #P +20#!"
 culture_parameter_gh_easier_to_convert_county_of_this_culture: "Проще [Concept( 'promote_culture', 'продвигать культуру' )|E] в [Concept('counties','графствах')|E] этой [Concept('culture','культуры')|E]"
 culture_parameter_gh_can_always_use_legitimize_bastard: "Можно использовать [Concept('interaction','взаимодействие')|E] «Узаконить бастарда» независимо от [Concept('doctrine', 'доктрины')|E] вашей [Concept('faith','конфессии')|E]"
 culture_parameter_more_frequent_tournament: "Задержка между [Concept('activities','занятиями')|E] типа «[GetActivityType('activity_tournament').GetName]»: #P -50%#!"
 culture_parameter_gh_cheaper_tournament: "Стоимость [Concept('activities','занятий')|E] типа «[GetActivityType('activity_tournament').GetName]»: #P -20%#!"
 CB_GH_CHEAPER_TOURNAMENT_PARAMETER_DISCOUNT: "[Concept('tradition','Традиция')|E]: $VALUE|=+0$"
 culture_parameter_can_host_elephant_race_contests: "Может проводить [Concept( 'contest', 'состязание' )|E] «Гонки на слонах» в рамках турнира ([GetActivityType('activity_tournament').GetName])"

 tradition_lanonan_frontier_name: "Порубежье Ланонана"
 tradition_lanonan_frontier_desc: "Жители Ланонана убеждены: любая рука, способная держать оружие, должна его поднять. Обосновавшись вдалеке от катунских центральных земель, они издавна вырывали своё пропитание у дикого края и зверей, охотящихся в нём, полагаясь лишь на свои клинки и верных соратников."

 tradition_conquered_name: "Цюйчон"
 tradition_conquered_desc: "Эта культура подпадала под иноземный гнёт так часто, поднимала и проигрывала восстания так регулярно, что покорность превратилась в привычку — состояние, которое катуны называют [Glossary('цюйчон','GH_CUICHON_GLOSS')]. Склонять голову перед новым владыкой стало обыденным делом, а сама идея сопротивления практически угасла."

 tradition_southern_nomads_name: "Южные кочевники"
 tradition_southern_nomads_desc: "Давно покинув открытые степи, где зародился их уклад жизни, эта культура перенесла свои странствия на жаркий юг. Среди лесистых холмов, непроходимых чащ и затопленных болот они нашли новые способы следовать старым ритмам, а их кочевые обычаи приобрели отчетливый тропический колорит."

 tradition_bloody_butcher_name: "Кровавые мясники"
 tradition_bloody_butcher_desc: "Эта культура подавляет бунты с помощью ножа и дыбы, следя за тем, чтобы выжившие усвоили урок на всю жизнь. Её жажда кровопролития заставляет содрогнуться даже магов [Concept('aversaria','Аверсарии')|E]."

 tradition_agricultural_community_name: "Община Чароэнг"
 tradition_agricultural_community_desc: "В этой культуре земля обрабатывается сообща. Деревни совместно владеют полями, делят урожай и улаживают раздоры без помощи господ. Здесь не платят господских налогов, а рука, поднятая против этих порядков, сталкивается с отпором всей общины."

 tradition_road_to_resistance_name: "Путь сопротивления"
 tradition_road_to_resistance_desc: "Захватчики оккупировали нашу родину. Их жестокий гнёт с каждым днём губит наш народ. Всё, что нам дорого, осквернено этими презренными злодеями! Соотечественники, в чьих сердцах ещё жива совесть — проснитесь! Восстаньте! Поклянитесь изгнать захватчиков с нашей земли! Их кровью мы насытим наших замученных детей!"

 tradition_generational_maintenance_name: "Наследие мастерства"
 tradition_generational_maintenance_desc: "Эта культура относится к оружию и доспехам воина как к продолжению тела, неустанно ухаживая за ними из дня в день. Клинки и кольчуги передаются в семьями веками и всё это время поддерживаются в идеальном боевом состоянии, так что снаряжение далёкого предка выглядит не более изношенным, чем только что выкованное."

 tradition_southsea_sovereign_name: "Владыки Южного моря"
 tradition_southsea_sovereign_desc: "Жители Бронзовой гавани рождены для счётных контор и причалов. Торговля течёт в их жилах так же, как война в жилах других, и уроженец Бронзовой гавани извлечёт прибыль из сделки, которая оставила бы любого другого купца с пустыми руками. Переходя из одного порта в другой, они, кажется, лишь богатеют."

 tradition_art_of_diplomacy_name: "Искусство хояк"
 tradition_art_of_diplomacy_desc: "Эта культура считает войну скверной сделкой — огромной тратой крови и сокровищ ради того, что грамотно составленный договор, или [Glossary('хояк','GH_HOYAK_GLOSS')], мог бы обеспечить за малую долю этой цены."

 tradition_shooting_specialization_name: "Лучники шайзу"
 tradition_shooting_specialization_desc: "Эта культура ценит лук превыше любого другого оружия и обучает ему детей с ранних лет, так что её армии никогда не испытывают нужды в искусных лучниках. Ближний бой они считают диким и грубым ремеслом."

 tradition_yuankang_identity_name: "Самосознание Юанькана"
 tradition_yuankang_identity_desc: "Хотя эта культура происходит от переселенцев из Катун-Кая, прошедшие поколения сделали эту землю для них родным домом. Её народ больше не считает себя катунами: они — жители Юанькана, и дорожат этим различием."

 tradition_sarradon_legalistic_mercantilism_name: "Саррадонский правовой меркантилизм"
 tradition_sarradon_legalistic_mercantilism_desc: "Купцы этой культуры связывают свою торговлю со сводом законов Саррадона, так что договор становится в равной степени вопросом юридической формы и звонкой монеты."

 tradition_dahangon_national_integration_name: "Танаркские сородичи"
 tradition_dahangon_national_integration_desc: "Эта культура глубоко сроднилась с танаркским народом, среди которого поселилась, а её уклады за многие поколения пропитались обычаями Дахангона."

 tradition_southsea_islander_name: "Островитяне Южного моря"
 tradition_southsea_islander_desc: "Эта культура чувствует себя как дома на буйных водах Южного моря, а её поселения рассеяны по островам — от одиноких хуторов до многолюдных портов."

 tradition_dragonrider_cliques_name: "Клики драконьих всадников"
 tradition_dragonrider_cliques_desc: "Армии этой культуры вращаются вокруг интриг множества разрозненных клик враждующих [Concept('dragons','драконьих всадников')|E]. Пусть их войска могут быть неорганизованными и время от времени впадать во [Concept('war_of_the_thousand_dragons','внутренние конфликты')], но когда они объединяются, мир содрогается."
 tradition_outland_guest_name: "Чужеземный гость"
 tradition_outland_guest_desc: ""

