 culture_parameter_enables_alatans:89 "Правители, добровольно отрекшиеся от престола, получают свойство «[GetTrait('gh_alatan').GetName(GetNullCharacter)]» и лучше справляются с [Concept('councillor_tasks','задачами советников')|E]"
 culture_parameter_enables_khatan_succession:89 "Открывает доступ к #underline хатанскому закону наследования#! [law|E]"
 
