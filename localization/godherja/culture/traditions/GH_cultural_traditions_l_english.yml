 tradition_lanonan_frontier_name: "Lanonan Frontier"
 tradition_lanonan_frontier_desc: "The Lanonan hold that any hand able to bear a weapon must raise one. Settled far from the Kathuni heartland, they have long wrested their living from a wild land and the beasts that hunt across it, leaning on their blades and on the companions at their side."

 tradition_conquered_name: "Cuichon"
 tradition_conquered_desc: "This culture has been subjugated so often, and has risen and failed so often, that submission has hardened into habit, a state the Kathuni call [Glossary('Cuichon','GH_CUICHON_GLOSS')]. To bow before a new master is simply what is expected of them, and the very idea of resistance has all but died out."

 tradition_southern_nomads_name: "Southern Nomads"
 tradition_southern_nomads_desc: "Long removed from the open grasslands where their way of life was born, this culture has carried its wandering into the warm south. Among wooded hills, deep forests, and flooded wetlands, they have found new ways to keep to the old rhythms, and their nomadic customs have taken on a distinctly tropical cast."

 tradition_bloody_butcher_name: "Bloody Butcher"
 tradition_bloody_butcher_desc: "This culture puts down revolt with the knife and the rack, and sees to it that whoever survives remembers the lesson. Its taste for bloodshed is enough to give even the magi of [aversaria|E] pause."

 tradition_agricultural_community_name: "Charoeng Community"
 tradition_agricultural_community_desc: "In this culture the land is worked in common. Villages hold their fields together, share out the harvest, and settle their own troubles without recourse to any lord. No lord's taxes are paid here, and a hand raised against the arrangement finds the whole commune raised against it in turn."

 tradition_road_to_resistance_name: "Road to Resistance"
 tradition_road_to_resistance_desc: "The invaders have occupied our homeland. Their crushing oppression has left our people wasting away day by day. Everything we hold dear has been defiled by those despicable villains! Fellow countrymen with a conscience still left within you—awake! Rise up! Swear to drive the invaders completely out of our land! With their blood, we shall feed our tormented children!"

 tradition_generational_maintenance_name: "Generational Maintenance"
 tradition_generational_maintenance_desc: "This culture treats a warrior's arms and armour as extensions of the body, tended without fail from one day to the next. Blades and mail pass down through a family for centuries and are kept in fighting trim the whole while, so that a piece carried by some distant ancestor shows no more wear than one fresh from the forge."

 tradition_southsea_sovereign_name: "Southsea Sovereign"
 tradition_southsea_sovereign_desc: "The people of Bronzeport are born to the counting-house and the quay. Trade runs in their blood the way war runs in others', and a Bronzeporter will wring profit from a bargain that would leave another merchant empty-handed. Passing from one port to the next, they seem only ever to grow richer."

 tradition_art_of_diplomacy_name: "Art of Hoyak"
 tradition_art_of_diplomacy_desc: "This culture holds war to be a poor bargain — a great spending of blood and treasure for what a well-drawn treaty, or [Glossary('Hoyak','GH_HOYAK_GLOSS')],  might secure at a fraction of the price."

 tradition_shooting_specialization_name: "Shaizu Archers"
 tradition_shooting_specialization_desc: "This culture prizes the bow above all other arms and sets its children to it young, so that its armies never want for skilled archers. Close combat it holds for a brutish business."

 tradition_yuankang_identity_name: "Yuankang Identity"
 tradition_yuankang_identity_desc: "Though this culture springs from settlers out of Kathun-Kai, the generations since have made it land of its own. Its people no longer count themselves Kathuni; they are of Yuan-kang, and hold that distinction close."

 tradition_sarradon_legalistic_mercantilism_name: "Sarradon Legalistic Mercantilism"
 tradition_sarradon_legalistic_mercantilism_desc: "The merchants of this culture bind their trade to a body of law drawn from Sarradon, so that a contract is as much a matter of legal form as of coin."

 tradition_dahangon_national_integration_name: "Kin of the Tanarka"
 tradition_dahangon_national_integration_desc: "This culture has grown deeply into the Tanarka among whom it settled, its ways coloured over the generations by the manners of Dahangon."

 tradition_southsea_islander_name: "South-Sea Islander"
 tradition_southsea_islander_desc: "This culture is at home on the restless waters of the South Sea, its settlements scattered across the islands from lone hamlets to crowded ports."

 tradition_dragonrider_cliques_name: "Dragonrider Cliques"
 tradition_dragonrider_cliques_desc: "The armies of this culture revolve around the machinations of many disparate cliques of feuding [Concept('dragons','dragonriders')|E]. While their armies may be disorganized and fall into the occasional [Concept('war_of_the_thousand_dragons','internal conflict')], when they reunite, the world shakes."
 tradition_outland_guest_name: "Outland Guest"
 tradition_outland_guest_desc: ""

