 tradition_dayarkan_warrior_queens_name:0 "Дайаркские королевы-воительницы"
 tradition_dayarkan_warrior_queens_desc:0 "Живущие в восточных землях Дахангона хорошо помнят великую Нари Дайю, которая некогда противостояла захватчикам и основала прочное царство в северных горах. Наши соседи могут сколько угодно твердить о превосходстве мужчин, но мы ведем свой род по материнской линии, а боевой клич могучих дайаркских женщин обращает этих чужеземных «мужчин» в бегство."
