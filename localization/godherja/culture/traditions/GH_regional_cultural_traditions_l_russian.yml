 tradition_dayarkan_warrior_queens_name:0 "Дайаркские королевы-воительницы"
 tradition_dayarkan_warrior_queens_desc:0 "Жители восточных земель Дахангона хорошо помнят великую Нари Дайю, некогда противостоявшую захватчикам и основавшую в северных горах долговечное царство. Пусть соседи твердят о превосходстве мужчин — мы ведём родословные по материнской линии, а боевой клич могучих дайаркских женщин обращает этих чужеземных «мужей» в бегство."
