# Murnyri Abyssal
 language_murnyri_abyssal_name: "$смерть_coloring$ Murnyri Abyssal#!"
 language_murnyri_abyssal_desc: "[liches|E] — who most often write for the purpose of ritual or self-aggrandizement — have spent centuries butchering the ancient languages of [murnyr|E]. A mix of various ancient Murnyri scripts, arcane glyphs and ritual-writing, and bastardized derivatives of the Ojyczny script used by [vilas_venslau|E] (complete with many of Vilas's infamous spelling mistakes long cemented into the language as ritualized dogma)."

# Eidolic
 language_eidolic_name: "$ethereal_coloring$ Eidolic#!"
 language_eidolic_desc: "Sometimes named 'Shadescrit', 'Phantasmic', 'Spectrespeak', and a hundred other regionalisms, Eidolic is the legendary nameless language of the [Concept('gh_general_undead','Dead')|E]. The origin of the language, and how or why all spirits seem able to speak in it, are unknown. Eidolic is unspeakable by the living, but written derivatives and speakable bastardizations are not unheard of."

# Glossolic
 language_glossolic_name: "$light_coloring$ Glossolic#!"
 language_glossolic_desc: "[Concept('aversaria','Aversarian')|E] priests have long held to the existence of a divine and inherently [Concept('magic','Magical')|E] universal language from which all modern ones descend from, a belief found in many other distinct faiths and folklore. While the theory has never been proven, believers point to the many instances through history of divine possession and the speaking of words of power in a lost tongue. While no true transcription of these words is possible, the 'glossolic' language is the result of the many attempts to unite these fragments into a singular language. While largely the result of questionably authentic attempts to fill in the gaps and the true spelling and pronunciation of most of the words are long-lost, a hint of the divine and holy power can still be felt when those few speakers dare to try and imitate the holy tongue."

# Aeriform
 language_aeriform_name: "$air_coloring$ Aeriform#!"
 language_aeriform_desc: "An archaic, quasi-[Concept('magic','Magical')|E] pseudo-language originating in the deep reaches of the Kolrgii Steppe, Aeriform is a written-only script composed of organically flowing geometric patterns that, when studied beneath an open sky, whisper their contents into the reader's ears through the murmur of the wind and air currents. The ability to interpret it is notoriously difficult to master, and Aeriform has historically been used by various Ölteni polities to encode sensitive missives, as well as by many groups of Kolrgiian [magi|E] to record their arcane knowledge."

# Crimson Runes
 language_crimson_runes_name: "$blood_coloring$ Crimson Runes#!"
 language_crimson_runes_desc: "A [runic_script|E] that can only be written in blood."

# Voidglyphs
 language_voidglyphs_name: "$dark_coloring$ Voidglyphs#!"
 language_voidglyphs_desc: "So deep is the black color of these [Concept('runic_script','glyphs')|E] that they almost seem like wounds on the fabric of reality itself."
