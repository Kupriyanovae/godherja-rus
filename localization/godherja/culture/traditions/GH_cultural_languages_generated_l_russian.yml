# Murnyri Abyssal
 language_murnyri_abyssal_name: "$смерть_coloring$ Мурнирский бездонный#!"
 language_murnyri_abyssal_desc: "[Concept('liches','Личи')|E] — которые чаще всего пишут в ритуальных целях или ради самовосхваления — веками искажали древние языки [Concept('murnyr','Мурнира')|E]. Это смесь различных древних мурнирских письменностей, тайных глифов, ритуального письма и искажённых производных от скрипта «Ойчайн», используемого [Concept('vilas_venslau','Виласом Венслау')|E] (включая многие из печально известных орфографических ошибок Виласа, давно укоренившихся в языке как ритуальная догма)."

# Eidolic
 language_eidolic_name: "$ethereal_coloring$ Эйдолический#!"
 language_eidolic_desc: "Иногда называемый «теневым письмом», «фантазмическим», «языком спектров» и сотней других региональных названий, эйдолический — это легендарный безымянный язык [Concept('gh_general_undead','Мёртвых')|E]. Происхождение языка, а также то, как и почему все духи способны говорить на нём, остаются неизвестными. Живые не способны произнести ни слова по-эйдолически, однако письменные производные и разговорные искажения этого языка всё же встречаются."

# Glossolic
 language_glossolic_name: "$light_coloring$ Глоссолический#!"
 language_glossolic_desc: "[Concept('aversaria','Аверсарианские')|E] жрецы издавна верят в существование божественного и по своей природе [Concept('magic','магического')|E] универсального языка, от которого произошли все современные языки — поверье, встречающееся и во многих других конфессиях и фольклоре. Хотя эта теория так и не была доказана, верующие указывают на многочисленные исторические случаи божественного одержания и произнесения слов силы на утерянном языке. Хотя точная транскрипция этих слов невозможна, «глоссолический» язык является результатом многочисленных попыток объединить эти фрагменты в единую речь. Хотя в основном он состоит из сомнительных попыток восполнить пробелы, а истинное написание и произношение большинства слов давно утеряны, намёк на божественную и святую силу всё ещё можно ощутить, когда немногие носители дерзают подражать святому языку."

# Aeriform
 language_aeriform_name: "$air_coloring$ Эриформ#!"
 language_aeriform_desc: "Архаичный, квази-[Concept('magic','магический')|E] псевдоязык, возникший в глубоких частях Кольргийской степи. Эриформ — это исключительно письменный скрипт, состоящий из плавно перетекающих геометрических узоров, которые при изучении под открытым небом шепчут своё содержимое в уши читателя сквозь шорох ветра и воздушных течений. Умение интерпретировать его невероятно сложно в освоении, и эриформ исторически использовался различными ольтенскими государствами для кодирования секретных посланий, а также многими группами кольргийских [Concept('magi','магов')|E] для записи своих магических знаний."

# Crimson Runes
 language_crimson_runes_name: "$blood_coloring$ Багровые руны#!"
 language_crimson_runes_desc: "[Concept('runic_script','Руническое письмо')|E], которое можно написать только кровью."

# Voidglyphs
 language_voidglyphs_name: "$dark_coloring$ Глифы Пустоты#!"
 language_voidglyphs_desc: "Чёрный цвет этих [Concept('runic_script','глифов')|E] настолько глубок, что они кажутся почти ранами на самой ткани реальности."
