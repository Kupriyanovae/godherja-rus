 innovation_thrill_of_the_hunt_quote: "#inno_quote \«Вы слышали что-нибудь?»\"#!$innovation_thrill_of_the_hunt_quote_attribution$"
 innovation_thrill_of_the_hunt_quote: "\n\n#inno_quote \"\"#!$innovation_thrill_of_the_hunt_quote_attribution$"
 innovation_thrill_of_the_hunt_quote_attribution: "\n  #inno_quote ~ Кромус Рекс, командир XXIII легиона «Зелёные пальцы», незадолго до своего бесследного исчезновения.#!"
 innovation_thumb_rings: "Кольца для большого пальца"
 innovation_thumb_rings_desc: "Эти кольца необычной формы, часто считающиеся чужаками лишь забавной безделушкой, надеваются на большой палец руки и значительно облегчают процесс многократного натяжения лука.$innovation_thumb_rings_quote$"
 innovation_thumb_rings_quote: "\n\n#inno_quote \"Будь бережлив; тебе не вернуть свою стрелу, если цель убежит"\"#!$innovation_thumb_rings_quote_attribution$"
 innovation_thumb_rings_quote_attribution: "\n #inno_quote ~ Распространённая ольтенская поговорка#!"
 innovation_winged_shields: "Крылатые щиты"
 innovation_winged_shields_desc: "Большие сегментированные щиты крепятся к спинам и плечам лучников, обеспечивая им надёжную защиту без ущерба для скорости или подвижности.$innovation_winged_shields_quote$"
 innovation_winged_shields_quote: "\n\n#inno_quote \"Степь не даёт укрытий, и любой мало-мальски обученный лучник продырявит тебя с пятидесяти шагов. Решение тут очевидно"\"#!$innovation_winged_shields_quote_attribution$"
 innovation_winged_shields_quote_attribution: "\n  #inno_quote ~ Тооргул, офицер хайашегов#!"
 innovation_tribal_magic: "Руническая свеча"
 innovation_tribal_magic_desc: "Покрытая рунами и пропитанная зачарованными маслами, руническая свеча служит элементарным источником [Concept('magic','магии')|E] для прилежного [Concept('magi','мага')|E].$innovation_tribal_magic_quote$"
 innovation_tribal_magic_quote: "\n\n#inno_quote \"В самом сердце моей обители,\nГде дед мой сидел и отец,\nГорит свеча"\"#!$innovation_tribal_magic_quote_attribution$"
 innovation_tribal_magic_quote_attribution: "\n  #inno_quote ~ Бхатираматхака (Трое эрудитов)#!"
 innovation_veiled: "Сокрытые вуалью"
 innovation_veiled_desc: "Говорят, что в лучшие времена гестанводерские маги собирались лишь тайно, совершая гнусные ритуалы для общения с неописуемым. Говорят, теперь они знают имена всего того, чего быть не должно, что едва не случилось и чему никогда не бывать. Что они общались с чуждыми духами и научились изощрённым жестокостям из эпохи, оставшейся за пределами памяти. И теперь, в час нашего триумфа, они практикуют всё это открыто, навлекая кошмары на весь мир.\n\nПоток живых пленников непрерывно уводят в самые заброшенные дебри наших болот. Те немногие, кто возвращается оттуда, уже не являются людьми. Бок о бок с нашими армиями ковыляют чудовища из вздымающихся, истерзанных мускулов — сросшиеся формы, в которых безошибочно угадываются те, кто некогда был человеком. Даже нашим собственным солдатам трудно смотреть на них без тошноты, и они стали повязывать грубые вуали поверх органов, которые явно когда-то были лицами.$innovation_veiled_quote$"
 innovation_veiled_quote: "\n\n#inno_quote \"\"#!$innovation_veiled_quote_attribution$"
 innovation_veiled_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_war_chariots: "Боевые колесницы"
 innovation_war_chariots_desc: "Колесницы долгое время оставались доминирующей силой на бескрайних просторах [Concept('the_continent', 'Континента')|E], славясь своей скоростью и мощью во время сражений.$innovation_war_chariots_quote$"
 innovation_war_chariots_quote: "\n\n#inno_quote \"\"#!$innovation_war_chariots_quote_attribution$"
 innovation_war_chariots_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_waranuux_spearmen: "Копья Варануукс"
 innovation_waranuux_spearmen_desc: "Братства варануукс из племени кутмайцев славятся по всей Дамоте как грозные и умелые бойцы благодаря своим крепким воинским традициям. От каждого ожидается участие хотя бы в одной битве плечом к плечу со своими товарищами, а многие и вовсе посвящают искусству войны всю свою жизнь.$innovation_waranuux_spearmen_quote$"
 innovation_waranuux_spearmen_quote: "\n\n#inno_quote \"\"#!$innovation_waranuux_spearmen_quote_attribution$"
 innovation_waranuux_spearmen_quote_attribution: "\n #inno_quote ~ #!"
 innovation_warisnik_mammoths: "Методы разведения мамонтов"
 innovation_warisnik_mammoths_desc: "Мамонты издавна использовались в качестве рабочей силы в обществе варисников, но одомашненное поголовье сильно сократилось во время великих миграций вдали от [Concept('the_fog','Тумана')|E]. Однако прошло уже много лет со дней [Concept('sjalvolki_migration','переселения сьялволков')|E], и те немногие выжившие мамонты, которых привели с собой, размножились на наших новых плодородных землях. Теперь у нас есть численность и ресурсы для вывода на поле боя специализированных отрядов наездников на мамонтах. Больше это не старые сказки у костра — наездники на мамонтах из племени варисников рождаются заново!$innovation_warisnik_mammoths_quote$"
 innovation_warisnik_mammoths_quote: "\n\n#inno_quote \"\"#!$innovation_warisnik_mammoths_quote_attribution$"
 innovation_warisnik_mammoths_quote_attribution: "\n #inno_quote ~ #!"
 innovation_wodes: "Крик Туманных земель"
 innovation_wodes_desc: "Воины-[Concept('fogeater','туманоеды')|E], по всей видимости, изначально происходили из племени таларегов далекого севера, затерявшегося в [Concept('the_fog','Тумане')|E] в первые годы после [Concept('frodbrokna','Фродброкны')|E], однако среди современных образцов были опознаны те, кто, возможно, когда-то являлся [Concept('aversaria', 'аверсарианскими')|E] легионерами, ольтенскими воинами и даже простыми деревенскими жителями из далекого Катун-Кая. Их прежняя личность стёрта, и теперь они покрывают свои изуродованные тела отвратительными мистическими татуировками и ритуальными шрамами, безумно бросаясь на каждого, кому не посчастливилось оказаться у них на пути.$innovation_wodes_quote$"
 innovation_wodes_quote: "\n\n#inno_quote \"Мать выкрикивает нас на волю, да. Слушайте, слушайте её в нашей крови. Воет, Мать воет! Она идёт! Мы идём!"\"#!$innovation_wodes_quote_attribution$"
 innovation_wodes_quote_attribution: "\n #inno_quote ~ Бывший легат Кулдекс#!"
 innovation_kashiryan_court_system: "Каширская судебная система"
 innovation_kashiryan_court_system_desc: "Законы и обычаи Каширии широко известны на Востоке своим растущим масштабом ещё со времён империи [Concept('otachedian_empire','Отачеда')|E].$innovation_kashiryan_court_system_quote$"
 innovation_kashiryan_court_system_quote: "\n\n#inno_quote \"Слишком поздно, стены пробиты, они доберутся до нас совсем скоро. Теперь либо пан, либо пропал — встретим это вместе!"\"#!$innovation_kashiryan_court_system_attribution$"
 innovation_kashiryan_court_system_attribution: "\n #inno_quote ~ Вародаистский верховный страж Махлы незадолго до окончания осады Отачедом Спокойного острова#!"
 innovation_silver_note: "Silver Note"
 innovation_silver_note_desc: "Lakoeng people commonly use a special type of paper currency in Southsea trade. It originated as debt contracts used by major merchants in Bronzeport, but the exceptional value of these contracts eventually led them to replace the original Bronzeport coin and become the circulating currency in Dahangon and surrounding areas."
 innovation_silver_note_quote: "\n\n#inno_quote \"I have bought silver opinions from all sorts of people.\"#!$innovation_silver_note_quote_attribution$"
 innovation_silver_note_quote_attribution: "\n  #inno_quote ~ Jinqin of the Nan Hai Hang#!"
 innovation_night_vision_potion: "Night Vision Potion"
 innovation_night_vision_potion_desc: "Night Vision Potion is an ancient art of the Saielai. By mixing various herbs in specific proportions and applying the mixture around the eyes, one can gain a degree of night vision. When Kathun-Kai conquered the Kingdom of Míat Shrunfan, Saielai resistance fighters used this art to combat the Protectorate of Lanonan regime. This allowed Kathuni garrison troops to learn how to make the night vision potion as well." 
 innovation_commercial_court: "Commercial Court"
 innovation_commercial_court_desc: "The strong commercial atmosphere of the Dathanites combined with the [wardenism|E] tradition of law gave rise to the unique institution of the commercial court. Within this institution, judges are experienced Dathanites merchants who apply the laws to mediate disputes among merchants of their own people. Compared to other Wardenite courts in [sarradon|E], the Dathanites' commercial courts focus more on adjusting civil disputes than on the interpretation of the laws themselves." 
 innovation_fireworks: "Fireworks"
 innovation_fireworks_desc: "During festivals or major events, the people of Kathun-Kai often use an item called fireworks to celebrate, praying for good fortune and warding off evil. This item was originally created from the ingenious ideas of Bronzeport merchants and spread throughout Kathun-Kai via a highly developed trade network." 
 innovation_wuizu: "Wuizu"
 innovation_wuizu_desc: "Wuizu is a plant native to what is now called the Lanonan region. It often grows in remote, rarely visited locations. During its growth stage, it appears green, turning deep black upon reaching maturity. Through the distinctive alchemy of the Kathuni, it can be processed and woven into lightweight, breathable, yet remarkably resilient plant-based armor. Its existence has significantly enhanced the combat capabilities of the Kathuni garrison." 
 innovation_waterbending: "Waterbending"
 innovation_waterbending_desc: "Azure Serpent Sect is one of the five major magical branches of Kathun-Kai. Magi from this sect are mostly skilled in water-related magic. By utilizing their ability to manipulate water currents—such as raising water levels during port entry, preventing waves from damaging ship hulls, and controlling seawater to provide greater propulsion—they can significantly enhance ship efficiency and greatly facilitate navigation." 
 innovation_cave_dwelling: "Cave Dwelling"
 innovation_cave_dwelling_desc: "Years of evading pursuit by the Kathuni authorities forced the Yingsa people to gradually migrate into remote mountainous regions. To survive in the rugged terrain, they learned to carve caves into the mountains and construct intricate buildings within them. When outsiders visit their settlements, the exquisite structures peeking in and out of the mountainside are sure to astound anyone." 
 innovation_agricultural_calendar: "Agricultural Calendar"
 innovation_agricultural_calendar_desc: "Tian Calendar is a unique calendrical system used by the Kathuni people. It takes the year of Yao Ren Cai's formation of Kathun-Kai as its Year One, determining time through the trajectories of the sun and stars. Revised every five years, many Kathuni take pride in possessing such an intricate calendar. Furthermore, as the official calendar of the Kathuni regime, it holds significant importance in guiding agricultural production. Officials responsible for overseeing agriculture obtain the latest celestial observations from the loen chaeon at the start of each new year and promptly relay them to local authorities across the land to ensure farming schedules are not missed." 
 innovation_tilolan_system: "Tilolan System"
 innovation_tilolan_system_desc: "The existence of the [tilolan|E] allowed the monarchs of the Dahangon Empire to better understand the situation within their realm through their vassals. Additionally, most lords who came to pay homage would bring rare items from their domains as a token of submission. Typically, the authority of a Dahangon emperor could be measured by the rarity of the tribute received." 
 innovation_beast_cavalry: "Beast Cavalry"
 innovation_beast_cavalry_desc: "After the Zhugutaan people were relocated to Nanmway Bon, their traditional nomadic life became unsustainable. Although they brought large herds of livestock, the harsh natural environment in the south caused many of their animals to perish. However, in a fortuitous turn of events, they discovered many new 'livestock' in Nanmway Bon—such as the giant spiders inhabiting the jungles. These beasts, viewed by the locals as fearsome man-eating monsters, were tamed by the Zhugutaan using ancestral animal-handling skills. They trained the spiders as steeds and formed an unconventional cavalry force." 
 innovation_military_structure: "Military Structure"
 innovation_military_structure_desc: "After establishing Kathun-Kai, Dragon Empress Yao Ren Cai-Tiayang instituted a complex set of regulations detailing the required specifications for the Kathuni army. Although these systems have become unrecognizable through the changes of time, they remain an important template for local military organization in Kathun-Kai." 
 innovation_yamen_troops: "Yamen Troops"
 innovation_yamen_troops_desc: "The fall of Loen Chaeon shattered the unity of Kathun-Kai. War once again erupted across this ancient land. The warlords of Kathun-Kai began arming their private soldiers to the utmost to satisfy their ambitions, which in turn gave rise to heavily armored infantry clad in multilayered armor. These elite soldiers were often the very foundation of a warlord's existence. Consequently, they were only deployed as a decisive blow when the frontline situation turned unfavorable." 
 innovation_heavy_siege_artillery: "Ding"
 innovation_heavy_siege_artillery_desc: "Due to the frequency of warfare, the warlords of Kathuni gradually abandoned those stable yet expensive small gunpowder weapons in favor of manufacturing massive and heavy siege cannons. By thickening the barrels, they could maximize power while maintaining safety, making these cannons effective against thick brick-and-stone walls or dense formations of heavy infantry. This type of heavy artillery was named after a ceremonial vessel of the Kathuni: Ding. Some cannon makers even claimed that their artillery could 'obliterate everything for dozens of miles with a single shot, killing the enemy before they even heard the thunderous boom.' Although such assertions greatly exaggerated the Ding's capabilities, they nonetheless reflected the terrifying extent of its power." 
 unlock_maa_ding: "Can recruit [GetMaA('ding').GetName] as [men_at_arms|E]"
 innovation_banners: "Qibing"
 innovation_banners_desc: "The Qibing hold significant importance within the Kathuni military system, forming an independent structure parallel to the Imperial Army itself. Nearly all qibing trace their origins back to the era immediately following the unification of Kathun-Kai by Dragon Empress Yao Ren Cai-Tiayang. To consolidate the nascent Empire, she allocated her loyal soldiers across the land, granting them territory in exchange for generations of military service, and bestowing upon each a unique qibing as their symbol. Though throughout the ages the names of many qibing have become relegated to mere parts of the lengthy titles of nobility, those warriors who still steadfastly uphold their duty truly live up to the title of The Dragon Emperor's Blade."
 innovation_vidvaookeyatran_scholars: "Vidvaookeyatran Scholars"
 innovation_vidvaookeyatran_scholars_desc: "Numerous [Concept('vidvaookeyatran_scholarly_caste','Vidvaookeyatran scholars')|E] are working in Chinlin's court, serving the new monarch of [kashirya|E] with their extensive knowledge."
 innovation_kathunkai_infantry_tactics: "Kathunkai Infantry Tactics"
 innovation_kathunkai_infantry_tactics_desc: "The commander of Lanonan mastered an intricate infantry tactic that could significantly reduce casualties. During the campaign to conquer Lanonan, Chinlin's army learned and subsequently employed this tactic."
 innovation_chinlin_elephant_training_technique: "Elephant Train Technique"
 innovation_chinlin_elephant_training_technique_desc: "By introducing the herd of elephants from the [kashirya|E] region, Chinlin was able to use them for various purposes."
 innovation_alchemical_gunpowder: "Alchemical Gunpowder"
 innovation_alchemical_gunpowder_desc: "Gunpowder technology gradually filtered into the heartland of [kathun|E] along the Southsea trade routes. In its earliest days, people regarded it merely as an intriguing plaything, but as the technology matured, it increasingly found its way into warfare. The alchemists of Kathuni, by integrating gunpowder with the art of alchemy, created a formidable yet scarce variant of gunpowder that profoundly transformed the nature of warfare."
 innovation_lihuo: "Lihuo"
 innovation_lihuo_desc: "Lihuo, an arcane liquid highly favored by the [magi|E] of Kathuni, is crafted from rare minerals harvested from the scorching depths of volcanic craters. It appears greenish-gray in color and possesses an extremely viscous consistency. The reason it is so prized among magi is its unique ability to store magical energy. Once it absorbs a sufficient amount of magic, it triggers a violent explosion. Any creature caught in its blast becomes engulfed in a mysterious magical flame that remains utterly quenchless until all the magical energy within is completely consumed. Widely employed on the battlefield by magi, lihuo is nevertheless notoriously unstable, often causing harm to its users through even the slightest mishandling."
 innovation_protectorate_system: "Protectorate System"
 innovation_protectorate_system_desc: "The realm of Kathun-Kai is vast and expansive, stretching to far-flung frontiers where the gaze of the [Concept('kathuni_dragon_mythology','Dragon Emperor')|E] can scarcely reach. In these borderlands dwell numerous peoples whose languages and customs differ greatly from those of Kathuni society. To ensure that these diverse ethnic groups could identify with the rule of Kathun-Kai, the merciful Dragon Emperor granted them the autonomy to govern themselves under the celestial dynasty's dominion, asking only for their enduring loyalty to [loen_chaeon|E] in return."
 innovation_sifang_boulevard: "Sifang Boulevard"
 innovation_sifang_boulevard_desc: "The land of [kathun|E] is crisscrossed by an intricate network of roads—the collective achievement of generations of Kathuni [Concept('kathuni_dragon_mythology','Dragon Emperors')|E]. Stretching across the entire eastern coast of the continent, these roads facilitated trade and enabled the swift movement of armies. As vital links connecting all directions, they were revered by the people as the very backbone of Kathun-Kai."
 innovation_xuegong: "Xuegong"
 innovation_xuegong_desc: "Virtually all Kathuni nobles have received their education within the magnificent halls of Xuegong, where through a decade-long cultivation amidst grand and resplendent palaces, they learn not only the art of governing their domains but also the ways of becoming righteous gentlemen of impeccable virtue."
 innovation_specialized_banners_unit: "Specialized Qibing Unit"
 innovation_specialized_banners_unit_desc: "It has been over a millennium since the First of Dragon established the Qibing system, which has rendered meritorious service to the survival of Kathun-Kai for centuries. However, with the Dragon Emperor recalling most of the Qibing and the subsequent collapse of order in Kathun-Kai, the Qibing system has suffered a severe blow and become unsustainable. For this purpose, to preserve the glorious tradition of Qibing, it must be reorganized into a modernized army, replacing the old land grant system with unified salary payments, while the military takes over the selection and training of the Qibing."

 innovation_clanlander_resilience: "Clanlander Resilience"
 innovation_clanlander_resilience_desc: "For centuries Kalathipsomi has been dominated by foreign powers, first [chevalie|E], then [Concept('aversaria','Aversaria')|E], and much more besides. As such, the native Clanlanders have long become used to guerilla warfare and fighting against armies superior in both quality and quantity.\n\nThis guerilla warfare primacy resulted in the Green Watchers, Clanlander warriors specialising in not only fighting the [Concept('aversaria', 'Aversarian')|E] legions, but also the [antimagic|E] techniques of the Marchers."

 innovation_bane_of_the_seas: "Bane of Emipres"
 innovation_bane_of_the_seas_desc: "The warrior women of Krehejad have long been a great plague on trade routes across the [Concept('the_continent', 'Shattered Coast')|E], and they have long mastered the art of piracy to an impressive extent."