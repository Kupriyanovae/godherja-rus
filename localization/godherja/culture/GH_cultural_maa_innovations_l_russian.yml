l_russian:
 innovation_adabyss: "Передовые технологии Адабисса"
 innovation_adabyss_desc: "Темпы, с которыми развивается Адабисс, заставляют бледнеть от стыда северные народы. Пока [Concept('magi','маги')|E] спорят и раскалывают континенты, адабиссцы парят в небесах на невиданных прежде кораблях. Власть была централизована благодаря быстрому обучению арбалетчиков, выпускающих болты с такой скоростью, о которой упоминалось разве что в мифах древности. Огромные сияющие золотые статуи шагают бок о бок с армиями императора, неся невообразимые разрушения каждому, кто посмеет встать у них на пути. Эти чудеса технологии позволили Империи создать высокоцентрализованную армию, на фоне которой ополчения обычных лордов выглядят жалкими и слабыми по сравнению с величием императорских легионов.$innovation_adabyss_quote$"
 innovation_adabyss_quote: "\n\n#inno_quote \"Наказание за потерю оружия — СМЕРТЬ\nНаказание за нечищеное оружие — ПЛЕТИ (20 ударов)\nНаказание за сговор с врагом — СМЕРТЬ (ВСЕЙ СЕМЬЕ)\nНаказание за оскорбление старшего по званию — СМЕРТЬ (ВСЕЙ СЕМЬЕ)"\"#!$innovation_adabyss_quote_attribution$"
 innovation_adabyss_quote_attribution: "\n #inno_quote ~ Военный кодекс Адабисса, страница 98 из 342#!"
 innovation_advanced_rayakuux: "Централизованный Раякуукс"
 innovation_advanced_rayakuux_desc: "Современные раякуукс стали гораздо более централизованными, чем их предшественники, поскольку многие опасались очередного раскола в обществе. Этот усиленный контроль позволил им обучать и снаряжать профессиональные корпуса лучников, сохраняя при этом свою гибкость.$innovation_advanced_rayakuux_quote$"
 innovation_advanced_rayakuux_quote: "\n\n#inno_quote \"Слева от меня мой брат. Справа от меня моя сестра. Мой лук — это мои уста, узрите же мою речь"\"#!$innovation_advanced_rayakuux_quote_attribution$"
 innovation_advanced_rayakuux_quote_attribution: "\n #inno_quote ~ Безымянный лучник Раякуукса#!"
 innovation_advanced_waranuux: "Стандартизированный Варануукс"
 innovation_advanced_waranuux_desc: "Недавние реформы привели к тому, что варануукс стали гораздо более стандартизированными, поддерживая более строгую дисциплину и имея более качественное снаряжение. Благодаря этим достижениям их воины сильны как никогда прежде.$innovation_advanced_waranuux_quote$"
 innovation_advanced_waranuux_quote: "\n\n#inno_quote \"В каждом колесе спицы из копий,\nПовозки встают в круг,\nВраги кричат от страха"\"#!$innovation_advanced_waranuux_quote_attribution$"
 innovation_advanced_waranuux_quote_attribution: "\n #inno_quote ~ Агвал, «Дамота»#!"
 innovation_adventurers: "Авантюристы"
 innovation_adventurers_desc: "Многие неприкаянные души отправляются в путешествие по забытым, окутанным тайнами руинам и диким землям в самых дальних уголках мира, стремясь прославить своё имя на весь [Concept('aeras','Эраса')|E].$innovation_adventurers_quote$"
 innovation_adventurers_quote: "\n\n#inno_quote \"Со всех уголков Эраса волны самых разных людей стекались на зов сирен, манивших богатством и славой. Сословия, осторожность и верования отбрасывались в сторону ради общей жажды наживы"\"#!$innovation_adventurers_quote_attribution$"
 innovation_adventurers_quote_attribution: "\n #inno_quote ~ Анри Ва Пуатье, Введение к книге «Золотая лихорадка реликвий: Сказания из Скрипториума»#!"
 hire_court_adventurers: "Позволяет нанимать персонажа на должность [GetCourtPositionType('court_adventurer_court_position').GetNameNoTooltip()]"
 innovation_anti_magic_combat: "Антимагические боевые приёмы"
 innovation_anti_magic_combat_desc: "Пока мир вокруг королевств Марок принимал магию и обещания безграничной силы, которые она предлагала, марочники видели в магии ту непревзойдённую опасность, которой она является на самом деле. Обучая наших лучших воинов искусству сводить на нет чары и сражать тех, кто ими повелевает, мы лишим наших врагов их самого грозного оружия."\"$innovation_anti_magic_combat_quote$"
 innovation_anti_magic_combat_quote: "\n\n#inno_quote \"И если умыслу прходиться предпочтить клинок, всё равно бойся не магов, а рук их. И не бойся их рук, отсечённых от тела их..\"#!$innovation_anti_magic_combat_quote_attribution$"
 innovation_anti_magic_combat_quote_attribution: "\n #inno_quote ~ Сэр Куайл Калменсон, «Боевой кодекс Просвещённого рыцаря»#!"
 innovation_aversarian_legionaires: "Аверсарианская кольчуга"
 innovation_aversarian_legionaires_desc: "Немногие уцелевшие остатки [Concept('aversaria','аверсарианских')|E] легионов, пережившие великое переселение к побережью, усвоили много суровых уроков от северян. Аверсарианские наёмники во время Войн Обрядов стали носить кольчугу гораздо охотнее, чем их предки, и, оставшись без [Concept('magi','магов')|E], которым они некогда служили, начали делать упор на гибкие построения и быстро передвигающуюся пехоту.$innovation_aversarian_legionaires_quote$"
 innovation_aversarian_legionaires_quote: "\n\n#inno_quote \"К чёрту ваших магов, гляньте, как здорово я убиваю и без них"\"#!$innovation_aversarian_legionaires_quote_attribution$"
 innovation_aversarian_legionaires_quote_attribution: "\n  #inno_quote ~ Аверсарианский наёмник, Осада Исполя#!"
 innovation_berserkers: "Дух медведя"
 innovation_berserkers_desc: "Из лесов, холмов и гор племен сьялволков выходят те немногие воины, равных которым нет никого в мире. Прославляемые своими соплеменниками и наводящие ужас на врагов, эти берсерки обрушивают на поле боя непреклонную ярость. Чаще всего их узнают по массивным медвежьим шкурам и плащам, и лишь немногим доводилось перейти им дорогу и остаться в живых.$innovation_berserkers_quote$"
 innovation_berserkers_quote: "\n\n#inno_quote \"Хрольф нацепил свою медвежью шкуру ради кровавой жатвы, налив брюхо хмельной кровью. Медвежье безумие овладело им, и сотня с лишним латников пала от его когтей"\"#!$innovation_berserkers_quote_attribution$"
 innovation_berserkers_quote_attribution: "\n  #inno_quote ~ Третья песнь о Хрольфе#!"
 innovation_bloodbound: "Узы крови"
 innovation_bloodbound_desc: "Внезапное и чудесное возрождение ийроссов после веков угнетения породило как новообретённый интерес к старой вере и традициям предков, так и растущий гнев из-за того, как много элементов культуры ийроссов Аверсарии удалось искоренить. Два этих веяния сплелись в новый воинский культ, посвящённый Дейфарторосу, который стремится направить это обретённое единство на кровавый крестовый поход ради мести тиранам, заставившим страдать их прародителей.$innovation_bloodbound_quote$"
 innovation_bloodbound_quote: "\n\n#inno_quote \"Дейфарторос, направь наши обагрённые руки\nДейфарторос, дай нам отомстить за себя\nДейфарторос, ради этого мы сложим горы голов на твой алтарь"\"#!$innovation_bloodbound_quote_attribution$"
 innovation_bloodbound_quote_attribution: "\n  #inno_quote ~ Молитва связанных кровью#!"
 innovation_bronzecast: "Бронзовая металлургия"
 innovation_bronzecast_desc: "Славящиеся своим мастерством в ковке и обработке бронзы, кузнецы Дахангона способны создавать мощные осадные орудия, готовые превратить большинство крепостей в груды щебня.$innovation_bronzecast_quote$"
 innovation_bronzecast_quote: "\n\n#inno_quote \"Да не потускнеет ваша бронза!"\"#!$innovation_bronzecast_quote_attribution$"
 innovation_bronzecast_quote_attribution: "\n  #inno_quote ~ Традиционное приветствие банвагулов#!"
 innovation_brother_riders: "Кровные обеты"
 innovation_brother_riders_desc: "Культура сьялволков зародилась в холодных и туманных лесах внтруенних земель континента. Теперь же, когда они вышли к тёплым и богатым берегам, их уклады начали претерпевать коренные изменения. Если в прошлые века различные племена пересекались лишь ради борьбы за земли, то их новая космополитичная среда начала ковать гораздо более сильную пан-сьялволькскую идентичность. Самым ярким символом этого сдвига стала растущая популярность кровных обетов среди предприимчивых молодых людей. В то время как в прошлые века этот обряд обычно заключали лишь мужчины, уже жившие в тесных общинах, теперь стало обычным делом видеть клятвы, связывающие людей из племён с совершенно противоположных концов мира сьялволков.$innovation_brother_riders_quote$"
 innovation_brother_riders_quote: "\n\n#inno_quote \"Жаль, что миру пришлось расколоться, дабы мы наконец поняли, что все мы братья. Даукены, сиэмансийцы и даже барки — все мы сьялволки"\"#!$innovation_brother_riders_quote_attribution$"
 innovation_brother_riders_quote_attribution: "\n  #inno_quote ~ Юрт Мовотск в обращении к старейшинам фенвиров#!"
 innovation_corn_cultivation: "Выращивание маиса"
 innovation_corn_cultivation_desc: "Пока большая часть земель, образующих [Concept('the_continent', 'Расколотое побережье')|E], строила цивилизацию на возделывании пшеницы, народы [Concept('kasiryat_biozone','Каширията')|E] и [Concept('kashirya','Каширии')|E] имеют богатую историю выращивания маиса и прекрасно знают, как правильно его обрабатывать.$innovation_corn_cultivation_quote$"
 innovation_corn_cultivation_quote: "\n\n#inno_quote \"Чан Скоропокаипис смыл нашу историю волнами трагедий. Списку того, что мы забыли, нет конца. Но из каждых руин прорастали всё те же колосья, посаженные прежним манером. Маис, похоже, мы не забудем никогда"\"#!$innovation_corn_cultivation_quote_attribution$"
 innovation_corn_cultivation_quote_attribution: "\n  #inno_quote ~ Вадхан, «Размышления»#!"

 innovation_aaimperon_cultivation: "Садоводство ааймперонов"
 innovation_aaimperon_cultivation_desc: "Легендарный [Glossary('ааймперон','GH_AAIMPERON_GLOSS')] служит символом богатства, превосходства и роскоши — во многом из-за дороговизны и трудностей, связанных с получением хотя бы одного плода. Выращиваемый исключительно в самых деликатных условиях, секреты его культивирования охраняются с почти религиозным усердием теми немногими счастливчиками, кто ими владеет.$innovation_aaimperon_cultivation_quote$"
 innovation_aaimperon_cultivation_quote: "\n\n#inno_quote \"Клянусь [Glossary('Ааймперонусом','GH_AAIMPERONUS_GLOSS')], а вот это хорошая штука!"\"#!$innovation_aaimperon_cultivation_quote_attribution$"
 innovation_aaimperon_cultivation_quote_attribution: "\n #inno_quote ~ Аавтократ Эксадуй незадолго до своего убийства в 1076 году И.С.#!"
 unlocks_aaimperon_plantations: "Позволяет строить [GetBuilding('aaimperon_plantations_01').GetName] в регионе [GetGeographicalRegion('GH_watermelon_growing_region').GetName] во [Concept('holdings', 'владениях')|E], где [Concept('terrain', 'тип местности')|E] — [GetTerrain('plains').GetName], [GetTerrain('farmlands').GetName], [GetTerrain('floodplains').GetName], [GetTerrain('wetlands').GetName] или [GetTerrain('hills').GetName]"
 aaimperon_cultivation_gift_bonus: "Изменение [Concept('opinion', 'мнения')|E] от действия [Concept('send_gift', '«Отправить подарок»')|E]: #P +20%#!"

 innovation_doriosian_reforms: "Дориосианские реформы"
 innovation_doriosian_reforms_desc: "До своей гибели в битве при Элизийском перевале легат Дориос был вдохновителем амбициозного свода реформ, призванных вернуть былую славу [Concept('aversaria','Имперским')|E] государственным легионам. Обыкновенно именуемые «Дориосианскими реформами», они включают в себя изменения стандартов набора, армейской логистики и, что самое важное, улучшение связи между легионами и антикоррупционные меры. Хотя после его кончины об этих планах подзабыли, мы можем принять данные предложения к собственной выгоде.$innovation_doriosian_reforms_quote$"
 innovation_doriosian_reforms_quote: "\n\n#inno_quote \"Ты можешь блять в это поверить? Стоило нам реорганизовать легионы, как Сокрушитель Сук загоняет нам копьё прямо в задницу. Все эти офицеры, все эти заумные реформы — теперь просто воронье дерьмо в Элизии"\"#!$innovation_doriosian_reforms_quote_attribution$"
 innovation_doriosian_reforms_quote_attribution: "\n #inno_quote ~ Немеон, аверсарианский дезертир и пьяница#!"
 innovation_duneriders: "Наездники дюн"
 innovation_duneriders_desc: "[Concept('aversaria','Аверсарианский')|E] уклад жизни попросту не работает в пустыне. Люди пробовали, многие погибли, но эта система слишком хрупкая. Даже без угрозы со стороны саррадонских налётчиков здесь раскинулись огромные края, которые невозможно эффективно орошать при нынешних технологиях. Большинство колонистов, похоже, неизбежно перенимают более кочевой образ жизни, привычный для местных жителей, приручая причудливых животных, обитающих на южном континенте и известных как верблюды.$innovation_duneriders_quote$"
 innovation_duneriders_quote: "\n\n#inno_quote \"Они воняют, ворчат, плюются, а видели ли вы этот жуткий мешок, который они изрыгают из пасти? Но нет ничего более надёжного на песчаных дюнах, чем верблюд"\"#!$innovation_duneriders_quote_attribution$"
 innovation_duneriders_quote_attribution: "\n  #inno_quote ~ Метрик, наездник дюн#!"
 innovation_early_karavuux: "Рынки Каравуукс"
 innovation_early_karavuux_desc: "Богатые и могущественные каравуукс доффорского народа часто строят огромные рынки, которые служат их центрами силы, сосредотачивая в этих грандиозных торговых узлах как можно большую долю коммерции. Стражники патрулируют бескрайние торговые площади, обеспечивая безопасность сделок за определённую плату.$innovation_early_karavuux_quote$"
 innovation_early_karavuux_quote: "\n\n#inno_quote \"Подобно тому, как все объединены в Каравууксе, весь мир собирается воедино на рынке"\"#!$innovation_early_karavuux_quote_attribution$"
 innovation_early_karavuux_quote_attribution: "\n  #inno_quote ~ Поговорка доффоров#!"
 innovation_early_medieval_magic: "Хрустальный шар"
 innovation_early_medieval_magic_desc: "Прозрачная сфера из отполированного кристалла, хрустальный шар позволяет нашим [Concept('magi','магам')|E] сохранять внутри себя суть определённого [Concept('gh_aspect','аспекта')|E], откуда они могут черпать силу по мере необходимости.$innovation_early_medieval_magic_quote$"
 innovation_early_medieval_magic_quote: "\n\n#inno_quote \"Перед нами сидела правительница Аавтократии. Тейссия была блистательна, она была ужасающа. Она улыбалась сама себе, вглядываясь в шар, который показывал всю Империю, и её власть ощущалась во всём тронном зале... на всём Континенте"\"#!$innovation_early_medieval_magic_quote_attribution$"
 innovation_early_medieval_magic_quote_attribution: "\n  #inno_quote ~ Маг Хазек Офекс#!"
 innovation_early_qabuux: "Жилища Кабуукс"
 innovation_early_qabuux_desc: "Впервые созданное федагешами, жилище кабуукс представляет собой один большой дом, в котором совместно проживают несколько семей, образуя единую общину, известную как «кабуукс». Эти строения сами по себе являются впечатляющими инженерными сооружениями и обычно требуют огромных усилий для их возведения и содержания.$innovation_early_qabuux_quote$"
 innovation_early_qabuux_quote: "\n\n#inno_quote \"\"#!$innovation_early_qabuux_quote_attribution$"
 innovation_early_qabuux_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_eastern_cav: "Кикарсагские всадники Востока"
 innovation_eastern_cav_desc: "Когда [Concept('aversaria','аверсарианцы')|E] впервые в истории предоставили кикарсагам доступ к высококачественному и обильному железу, это возымело стремительный и далеко идущий эффект на всё общество этого племени. Если прежде их армии полагались на традиционных конных лучников, привычных для их собратьев в глубинах степей, то ныне их знать скачет в бой, облачённая в такое количество металла, какое только способна вынести лошадь. Годы участия в сражениях по первому зову их аверсарианских господ дали им опыт, необходимый для овладения искусством сокрушения вражеских армий своевременным натиском. Теперь пришёл черёд самой Аверсарии познать ужас от далёкого грома кованых копыт.$innovation_eastern_cav_quote$"
 innovation_eastern_cav_quote: "\n\n#inno_quote \"С лязгом кольчуг и трубными звуками, ревущими словно тысяча дьяволов, кикарсаги врезались в аверсарианский строй, как копьё в плоть. Люди кричали, а те, кого не размозжили палицы, гибли под железными копытами"\"#!$innovation_eastern_cav_quote_attribution$"
 innovation_eastern_cav_quote_attribution: "\n #inno_quote ~ Хроника битвы при Мирконе за авторством Эзоса#!"
 innovation_enlevett: "Анлеветы"
 innovation_enlevett_desc: "Обладая доступом к самому лучшему снаряжению, какое только видывал свет, проходя адски суровое и удерживаемое в строжайшем секрете обучение, набираемые с хирургической точностью — так куются анлеветы. Как воины, они внушают страх по всему Западному Саррадону.$innovation_enlevett_quote$"
 innovation_enlevett_quote: "\n\n#inno_quote \"Они хлынули через стены, сверкая клинками; стражники падали, лишаясь ушей, пальцев, конечностей. Сэр Хонли, к его вечной чести, успел парировать один удар, прежде чем кинжал вонзился ему прямо в глаз"\"#!$innovation_enlevett_quote_attribution$"
 innovation_enlevett_quote_attribution: "\n  #inno_quote ~ Донесение о битве за замок Морт#!"
 innovation_fiber_plates: "Волокнистые доспехи"
 innovation_fiber_plates_desc: "Сплетая волокна различных растений, произрастающих на верхнем ярусе кратера, айкар-б'хийлы способны создавать на удивление прочные тканевые доспехи. Облачённые в эту гибкую броню, воины-шемоты представляют собой силу, с которой приходится считаться: они способны сокрушить сопротивление и без труда броситься в погоню.$innovation_fiber_plates_quote$"
 innovation_fiber_plates_quote: "\n\n#inno_quote \"\"#!$innovation_fiber_plates_quote_attribution$"
 innovation_fiber_plates_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_flying_lances: "Товарищи"
 innovation_flying_lances_desc: "Гордое напоминание о золотом веке ойчанцев, «Летучие копья» продолжают древние традиции конной культуры своего народа. Находясь под влиянием рыцарей Марок, они странствуют по деревням, всё ещё верным старым укладам, и предлагают свою помощь в борьбе как с бандитами, так и с [Concept('undead','нежитью')|E]. В часы великой нужды они формируют элитные кавалерийские отряды. Легенды гласят, что крылья у них за спиной некогда не были просто украшением — в те времена, когда их народ ещё обладал даром магии.$innovation_flying_lances_quote$"
 innovation_flying_lances_quote: "\n\n#inno_quote \"Я видел, как мертвецы бегут прочь от праведных огненных крыльев конницы. Я молюсь, чтобы однажды это пламя выжгло их всех дотла, и мы наконец смогли вернуться в наш истинный дом"\"#!$innovation_flying_lances_quote_attribution$"
 innovation_flying_lances_quote_attribution: "\n #inno_quote ~ Сэр Далимир Гриф, личный дневник#!"
 innovation_golden_spears: "Уроки Золотого города"
 innovation_golden_spears_desc: "Развитое общество могущественной Империи Адабисс, всегда взирающее как внутрь себя, так и вовне, нуждается в повиновении ради своего процветания. «Золотые копья» — это образец адабиссца. Сильные, профессиональные воины, являющие собой отражение самоотверженной службы, которой требует представляемая ими Империя. В победе кроются честь и слава, и немало побед было добыто их копьями на всех фронтах Империи.$innovation_golden_spears_quote$"
 innovation_golden_spears_quote: "\n\n#inno_quote \"\"#!$innovation_golden_spears_quote_attribution$"
 innovation_golden_spears_quote_attribution: "\n #inno_quote ~ #!"
 innovation_grave_wardens: "Аванпосты ойчайнского фронтира"
 innovation_grave_wardens_desc: "Выживание ойчайнцев побудило многих вернуться к своим древним традициям, одной из которых является институт Стражей могил, некогда охранявших некрополи городов ойчанцев. Эти элитные воины, облачённые в самые тяжёлые латы, и натиску их не могут противиться ни мёртвые, ни живые. Они собираются на дальних заставах у границ земель своего народа, вечно ведя непримиримый бой с силами [Concept('undead','нежити')|E], которую они когда-то оберегали.$innovation_grave_wardens_quote$"
 innovation_grave_wardens_quote: "\n\n#inno_quote \"\"#!$innovation_grave_wardens_quote_attribution$"
 innovation_grave_wardens_quote_attribution: "\n #inno_quote ~ #!"
 innovation_griffon_riders: "Методы разведения грифонов"
 innovation_griffon_riders_desc: "Разведение грифонов всегда было непростым делом. Они растут медленно, привередливы в выборе пары, редко приносят больше двух детёнышей за раз, и лишь половина рождённых птенцов доживает до зрелости. Однако в конце XIII века методы, изначально разработанные в антимагических капитулах в западных горах Бастионе, начали проникать во всё марочникское общество. Гнёзда, обогреваемые трубами с горячей водой, рацион, обогащённый овечьей кровью, и новые, более крепкие породы грифонов быстро превратили их разведение в куда более надёжный промысел, доступный для знати в целом.$innovation_griffon_riders_quote$"
 innovation_griffon_riders_quote: "\n\n#inno_quote \"\"#!$innovation_griffon_riders_quote_attribution$"
 innovation_griffon_riders_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_high_medieval_magic: "Небесная сфера"
 innovation_high_medieval_magic_desc: "Небесная сфера отслеживает ночной небосвод, а также фазы луны, позволяя нашим [Concept('magi','магам')|E] определять наиболее удачное время для эффективного сотворения заклинаний.$innovation_high_medieval_magic_quote$"
 innovation_high_medieval_magic_quote: "\n\n#inno_quote \"Чистейший взирает на наши труды с бесконечной гордостью. С этим прибором загадка небес наконец разрешена"\"#!$innovation_high_medieval_magic_quote_attribution$"
 innovation_high_medieval_magic_quote_attribution: "\n #inno_quote ~ Магистр Ахрития из Майикратии#!"
 innovation_home_legions: "Внутренние легионы"
 innovation_home_legions_desc: "Часто упускаемой из виду причиной возвышения [Concept('aversaria','Аверсарии')|E] была её резервная армия, размещённая в городах и крепостях в самом сердце [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )]. В эпохи величайших кризисов эти внутренние легионеры часто служили последней линией обороны. Пусть они никогда не обеспечивались таким же первоклассным оружием и доспехами, как их собратья в традиционных легионах, они всё равно проходили подготовку, которая заставила бы устыдиться любые другие континентальные армии.$innovation_home_legions_quote$"
 innovation_home_legions_quote: "\n\n#inno_quote \"У каждого очага — по клинку,\nВ каждом сердце — искра дара.\nГде ж пролегла черта родному крову,\nИ где встает багряный край пожара?"\"#!$innovation_home_legions_quote_attribution$"
 innovation_home_legions_quote_attribution: "\n  #inno_quote ~ Плач Цивинона#!"
 innovation_honored_huscarls: "Почтенные хускарлы"
 innovation_honored_huscarls_desc: "Быть хускарлом — значит пировать с самим Велосом! Лучшие воины каждого племени наделяются собственными землями или получают право спать в доме вождя и разделять с ним трапезу на каждом пиру. В ответ они платят непреклонной верностью, формируя ядро щитоносных братьев и сестёр вождя и становясь тяжелобронированным оплотом любого военного отряда сьялволков.$innovation_honored_huscarls_quote$"
 innovation_honored_huscarls_quote: "\n\n#inno_quote \"Добытчики, сокрушители врагов, друзья по пиршественной скамье! Идёмте, родичи мои, раздвинем вместе янтарные волны и напоим наши мечи тёплой кровью из жил"\"#!$innovation_honored_huscarls_quote_attribution$"
 innovation_honored_huscarls_quote_attribution: "\n  #inno_quote ~ Вторая песнь о Хрольфе#!"
 innovation_huegodoc_legion: "Легионерское вдохновение"
 innovation_huegodoc_legion_desc: "Будучи едва не ассимилированными [Concept('aversaria','Аверсарией')|E] в прошлом, хуэгодоки до сих пор хранят множество пережитков аверсарианской культуры. Недавно они начали заново открывать для себя достижения Аверсарии в той области, где они преуспели больше всего — в военном искусстве. Те самые горны, что некогда снабжали аверсарианцев, снова взревели, и хуэгодоки принялись подражать своим бывшим завоевателям. Эхом из прошлого легионы вновь маршируют по их землям стройными рядами, но теперь уже не в качестве захватчиков. Пусть они разрушили прежний мир, наследие Аверсарии продолжает жить.$innovation_huegodoc_legion_quote$"
 innovation_huegodoc_legion_quote: "\n\n#inno_quote \"Одни приходят, другие уходят, но мечты остаются всегда. Твои тоже останутся.\"#!$innovation_huegodoc_legion_quote_attribution$"
 innovation_huegodoc_legion_quote_attribution: "\n\t#inno_quote ~ Дауд, первый лектор колледжа Серого порта#!"
 innovation_imperial_magic: "Обучение [Concept('mayikprolollans','майикпрололланов')|E]"
 innovation_imperial_magic_desc: "Со всей [Concept('aversaria', 'Аверсарианской')|E] империи детей, проявивших многообещающий талант к [Concept('magic','магии')|E], отправляли в одну из великих магических академий государства. Превыше всех стояла [Concept('mayikrata','Майикратия')|E], из чьих залов выходили поколения одних из самых могущественных [Concept('magi','магов')|E] в истории.$innovation_imperial_magic_quote$"
 innovation_imperial_magic_quote: "\n\n#inno_quote \"Чистейший, я никогда прежде не молился. Мой язык не приспособлен к этому. Никто и не вспомнит, были ли мы хорошими людьми или дурными... Даруй мне месть!\"#!$innovation_imperial_magic_quote_attribution$"
 innovation_imperial_magic_quote_attribution: "\n\t#inno_quote ~ Фрагмент проклятия, записанный в преданиях антимагов#!"
 innovation_imperial_religious_reformation: "Имперская религиозная реформа"
 innovation_imperial_religious_reformation_desc: "Раскол [Glossary( 'Автократии', 'GH_AAUTOKRATA_GLOSS' )], а также внезапная и насильственная гибель большей части нашего одарённого магией правящего класса во время Фродброкны поставили нас в тупик. В их отсутствие, вокруг выскочек-военачальников и варваров-захватчиков то и дело возникают ереси и культы, множащиеся с каждым днём. Как бы мы ни старались, нам не повернуть время вспять. То, что мы избраны Чистейшим, никогда не вызовет сомнений, но то, как мы действуем и поклоняемся, должно измениться ради выживания в эту новую эпоху.$innovation_imperial_religious_reformation_quote$"
 innovation_imperial_religious_reformation_quote: "\n\n#inno_quote \"Если северный варвар желает стать аавтократом, кто я такой, чтобы останавливать его? Бывали ведь и опахасийские аавтократы... бытие аверсарианцем никогда не было обязательным условием.\"#!$innovation_imperial_religious_reformation_quote_attribution$"
 innovation_imperial_religious_reformation_quote_attribution: "\n\t#inno_quote ~ Эстос из Калатипсоми#!"
 innovation_jokhosani: "Воины-джохосани"
 innovation_jokhosani_desc: "Джохосани составляли древние армии прибрежных городов Амагеи, стоически охраняя их стены на протяжении бесчисленных веков. Несмотря на объединение этих земель с суровыми горами на севере, джохосани остались ключевой частью амагейских армий, служа как рабам, так и рабовладельцам.$innovation_jokhosani_quote$"
 innovation_jokhosani_quote: "\n\n#inno_quote \"Холодные и суровые амагейцы в сияющих доспехах стояли перед нами с копьями и луками наготове. Мы не видели страха в их глазах, даже когда приблизились наши осадные орудия... они казались нам скорее кирпичами в каменной стене, нежели людьми..."\"#!$innovation_jokhosani_quote_attribution$"
 innovation_jokhosani_quote_attribution: "\n #inno_quote ~ Неизвестный картхараддский генерал об осаде Ниностакаро#!"
 innovation_kafasali_steel: "Кафасалийская сталь"
 innovation_kafasali_steel_desc: "Засушливые пики Кафасалийских предгорий скрывают огромные залежи металлов, которые рахикайи разрабатывали веками. Их мечи славятся своим качеством по всей Каширии и продаются на многих рынках вдоль побережья.$innovation_kafasali_steel_quote$"
 innovation_kafasali_steel_quote: "\n\n#inno_quote \"Железо и сталь редко подводят меня, в то время как люди делают это постоянно\"#!$innovation_kafasali_steel_quote_attribution$"
 innovation_kafasali_steel_quote_attribution: "\n  #inno_quote ~ Никаноней «Чёрное Солнце»#!"
 innovation_kaphral: "Кафралы"
 innovation_kaphral_desc: "Адхаты всегда служили другим в качестве управляющих и торговцев. Из-за рисков, связанных с их делом, возникли гильдии Кафралы, призванные защищать караваны и корабли от любых опасностей.$innovation_kaphral_quote$"
 innovation_kaphral_quote: "\n\n#inno_quote \"\"#!$innovation_kaphral_quote_attribution$"
 innovation_kaphral_quote_attribution: "\n #inno_quote ~ #!"
 innovation_kapmatans: "Капматаны"
 innovation_kapmatans_desc: "Огромные двухкорпусные суда с косыми парусами типа «клешня краба» некогда двигали океанские исследования с востока в Роварску. Столетия инноваций в конструкции позволили нашим кораблям, в отличие от всех остальных, ловко маневрировать как в узких водных путях, так и на просторах бескрайних океанов.$innovation_kapmatans_quote$"
 innovation_kapmatans_quote: "\n\n#inno_quote \"\"#!$innovation_kapmatans_quote_attribution$"
 innovation_kapmatans_quote_attribution: "\n #inno_quote ~ #!"
 innovation_konijkmener_pikes: "Городские ополчения"
 innovation_konijkmener_pikes_desc: "Это гордая традиция, зародившаяся ещё до Народной революции. На протяжении веков конейкменеры составили колоссальный свод текстов, касающихся правильного использования пик в военном деле, а также верных способов сбора и управления армией, состоящей и во многом управляемой простыми людьми. Каждый мужчина, а в некоторых случаях и женщина крепкого телосложения, призывается по лотерейной системе для службы в местном ополчении и освоения азов военного дела. Несмотря на малые размеры Де Канцелярии, республика способна собирать потрясающе большие и хорошо обученные армии в удивительно короткие сроки для отражения угроз.$innovation_konijkmener_pikes_quote$"
 innovation_konijkmener_pikes_quote: "\n\n#inno_quote \"Расположите руки на расстоянии вытянутой руки друг от друга на древке древкового оружия и наносите удары вперёд, повторяйте до тех пор, пока враг не будет обращён в бегство"\"#!$innovation_konijkmener_pikes_quote_attribution$"
 innovation_konijkmener_pikes_quote_attribution: "\n #inno_quote ~ «Солдатское дело для тупиц», глава 2: «Правильные стойки»#!"
 innovation_konijkmener_sailing_developments: "Конейкменерское мореплавание"
 innovation_konijkmener_sailing_developments_desc: "Перепроектирование кораблей с целью сделать их более узкими и лишить вооружения позволит конейкменерским военно-морским судам ловко перемещаться по [Concept('shatteredisles','Расколотым островам')|E] и за их пределами.$innovation_konijkmener_sailing_developments_quote$"
 innovation_konijkmener_sailing_developments_quote: "\n\n#inno_quote \"Морю плевать, богат ты или беден, так что налегай, ребята! А о жаловании побеспокоитесь позже!"\"#!$innovation_konijkmener_sailing_developments_quote_attribution$"
 innovation_konijkmener_sailing_developments_quote_attribution: "\n  #inno_quote ~ Иердрогт Рунардт накануне Народной революции 1099 года#!"

 innovation_korlacan_metallurgy: "Корлаканская металлургия"
 innovation_korlacan_metallurgy_desc: "Улучшения в методах плавки и перековка священных горнов позволяют корлаканцам производить сплавы непревзойдённой прочности и гибкости. Эти инновации открывают путь как для внушающей благоговение архитектуры, так и для разрушительного оружия, доказывая, что Вечное пламя направляет не только веру, но и прогресс.$innovation_korlacan_metallurgy_quote$"
 innovation_korlacan_metallurgy_quote: "\n\n#inno_quote \"Сталь подчиняется тем, у кого есть воля придать ей форму, а цивилизации возвышаются благодаря тем, у кого есть мудрость владеть ею"\"#!$innovation_korlacan_metallurgy_quote_attribution$"
 innovation_korlacan_metallurgy_quote_attribution: "\n #inno_quote ~ Верховный ремесленник Тантура из Вечного горна#!"
 
 innovation_grove_guardians: "Стражи Священной рощи"
 innovation_grove_guardians_desc: "Стражи Священной рощи воплощают в себе глубокую духовную традицию наттананцев, основанную на защите и почитании святости природы. Чтобы вступить в этот священный орден, послушники с ранних лет обучаются искусству выживания в джунглях, а по достижении 16-летия проходят серию суровых испытаний, известных как «Суд Йернейма», призванных определить их достоинство. Избранных, переживших этот суд, ждут слава и почёт. Жизнь стража непроста, ибо они приносят нерушимые обеты безбрачия и обязаны оберегать и защищать Священную рощу от внешних угроз ценой собственной жизни, если потребуется."
 innovation_grove_guardians_quote: "\n\n#inno_quote \"Испытание Йернейма доказало твоё достоинство, ныне же стремись сохранять его в исполнении священного долга до самой смерти.\"#!$innovation_grove_guardians_quote_attribution$"
 innovation_grove_guardians_quote_attribution: "\n  #inno_quote ~ Верховный сепаттан Цзау Ли#!"
 
 innovation_jerniems_rangers: "Следопыты Йернейма"
 innovation_jerniems_rangers_desc: "Следопыты Йернейма — элитный орден разведчиков, служащих незримыми глазами и ушами охотничей ложи Йернейма. Они охраняют Рощу от незваных гостей и наносят точные удары при возникновении угроз. Будучи экспертами в перемещении по густым джунглям своей родины с невероятной скоростью и скрытностью, эти воины выслеживают свои цели днями, чтобы устроить смертоносные засады и полностью уничтожить врагов. Выжившие после таких засад встречаются редко, но те немногие устные свидетельства о Следопытах, что дошли до нас, описывают звуки, напоминающие шёпот ветра в кронах деревьев, непосредственно перед тем, как на них обрушивался смертоносный дождь из стрел."
 innovation_jerniems_rangers_quote: "\n\n#inno_quote \"Настоящий следопыт может провести на верхушке дерева дни, оставаясь незамеченным и непотревоженным недели напролёт в ожидании цели. Настоящий ли ты следопыт?\"#!$innovation_jerniems_rangers_quote_attribution$"
 innovation_jerniems_rangers_quote_attribution: "\n  #inno_quote ~ Первый следопыт Наинг Мин#!"

 innovation_crimson_spears: "Багровые копья"
 innovation_crimson_spears_desc: "Багровые копья — это яростный отряд воинов, известных своей непреклонной решимостью и кроваво-красным снаряжением. Обученные сражаться до последнего человека, они воплощают несокрушимую волю своего народа, выступая мстительной силой против всех, кто посмеет осквернить их священные земли."
 innovation_crimson_spears_quote: "\n\n#inno_quote \".......\"#!$innovation_crimson_spears_quote_attribution$"
 innovation_crimson_spears_quote_attribution: "\n  #inno_quote ~ #!"

 innovation_molten_vanguard: "Копья Священного пламени"
 innovation_molten_vanguard_desc: "Копья Священного пламени — элитный авангард воинов, чьё оружие пылает яростью божественного огня. Наделенные священной энергией Копья Корлаку, эти воины вселяют ужас в своих врагов и внушают благоговение союзникам, выжигая путь смерти и разрушения на поле боя."
 innovation_molten_vanguard_quote: "\n\n#inno_quote \".......\"#!$innovation_molten_vanguard_quote_attribution$"
 innovation_molten_vanguard_quote_attribution: "\n  #inno_quote ~ #!"

 innovation_late_karavuux: "Расширенные залы Каравуукс"
 innovation_late_karavuux_desc: "Технический прогресс привёл к колоссальному росту торговли, сосредоточив в руках каравуукс больше богатств, чем когда-либо прежде. Они начали вкладывать эти излишки в строительство ещё более впечатляющих рынков, надеясь привлечь как можно больше коммерции.$innovation_late_karavuux_quote$"
 innovation_late_karavuux_quote: "\n\n#inno_quote \"\"#!$innovation_late_karavuux_quote_attribution$"
 innovation_late_karavuux_quote_attribution: "\n #inno_quote ~ #!"
 innovation_late_medieval_magic: "Магически нейтральное стекло"
 innovation_late_medieval_magic_desc: "Сотворяя заклинания внутри сосуда из магически нейтрального стекла, наши [Concept('magi','маги')|E] могут ограничить разрушительные последствия экспериментальной [Concept('magic','магии')|E]. Непроверенные заклинания можно творить в относительной безопасности, что позволяет совершенствовать более могущественное волшебство.$innovation_late_medieval_magic_quote$"
 innovation_late_medieval_magic_quote: "\n\n#inno_quote \"\"#!$innovation_late_medieval_magic_quote_attribution$"
 innovation_late_medieval_magic_quote_attribution: "\n #inno_quote ~ #!"
 innovation_late_qabuux: "Развитое строительство Кабуукс"
 innovation_late_qabuux_desc: "Благодаря недавним достижениям в строительной технике, традиционные здания федагешей достигли новых высот: отдельные кабуукс способны возводить исполинские сооружения, которые прежде невозможно было даже вообразить.$innovation_late_qabuux_quote$"
 innovation_late_qabuux_quote: "\n\n#inno_quote \"\"#!$innovation_late_qabuux_quote_attribution$"
 innovation_late_qabuux_quote_attribution: "\n #inno_quote ~ #!"
 innovation_legend_hunters: "Охотники за легендами"
 innovation_legend_hunters_desc: "Лишь немногие могучие твари из легенд всё ещё обитают в самых отдалённых уголках [Concept('aeras','Эраса')|E]. Но это ненадолго.$innovation_legend_hunters_quote$"
 innovation_legend_hunters_quote: "\n\n#inno_quote \"Да покарает тебя Велос, верни драконов, гнилой ты ублюдок! Как ты смеешь позволять только [Concept('aversaria','имперцам')|E] претендовать на их шкуры!?"\"#!$innovation_legend_hunters_quote_attribution$"
 innovation_legend_hunters_quote_attribution: "\n  #inno_quote ~ Младший правитель Мельдрагг «Любитель обрядов»#!"
 innovation_legion_marines: "Морские легионы"
 innovation_legion_marines_desc: "Жизненной силой империи является её морская торговля, а там, где есть кровь, всегда найдутся и пиявки. Расколотое побережье с его бесчисленными островами и заливами — идеальная среда для роста и распространения пиратства. Некоторые историки утверждают, что самые первые морские легионы на самом деле сами были пиратами, которых схватили и дали шанс выкупить свои жизни ценой службы. Как бы то ни было, они быстро доказали свою полезность, когда морские легионы помогли сокрушить флоты нескольких морских соперников [Concept('aversaria','Аверсарии')|E].$innovation_legion_marines_quote$"
 innovation_legion_marines_quote: "\n\n#inno_quote \"Чистейший, я прошу у тебя так мало, услышь меня сейчас: если мне суждено умереть, убей сначала каждого островитянина и дай мне на это посмотреть. Молю тебя"\"#!$innovation_legion_marines_quote_attribution$"
 innovation_legion_marines_quote_attribution: "\n  #inno_quote ~ Легат Зант Астаратайс во время вторжения в Креджехад#!"
 innovation_legion_outriders: "Легионные застрельщики"
 innovation_legion_outriders_desc: "Открытые степи [Concept('aversaria','Восточной Аверсарии')|E] всегда были сложной землёй для контроля [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )]. Многие варварские племена, населяющие этот негостеприимный край, просто предпочитают скрыться за горизонтом, нежели столкнуться с легионом в открытом бою, возвращаясь к набегам и грабежам сразу после ухода армии. Хуже того, значительная часть земель до сих пор удручающе слабо развита и непригодна для традиционного земледелия, в результате чего среди поселенцев процветает полукочевой образ жизни. Эти два фактора позволяют нам набирать одних из лучших лёгких всадников в цивилизованном мире, выросших в седле с самого рождения и обученных методам степной войны своими варварскими хозяевами.$innovation_legion_outriders_quote$"
 innovation_legion_outriders_quote: "\n\n#inno_quote \"\"#!$innovation_legion_outriders_quote_attribution$"
 innovation_legion_outriders_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_legion_raiders: "Легионные налётчики"
 innovation_legion_raiders_desc: "Защищённость Ийросского бассейна привела к тому, что [Concept('aversaria','[Concept('aversaria','Aversarians')|E]')|E], дислоцированным там, на протяжении веков приходилось сталкиваться с куда меньшим числом внешних военных угроз, чем их коллегам в других местах. Вместо этого угроза обычно исходила изнутри: восстания рабов и отчаянные беглецы были неотъемлемой частью управления колонией рабов. Поскольку их противникам повсеместно не хватало как выучки, так и снаряжения, гарнизоны отказались от стандартных тяжёлых доспехов аверсарианских легионов в пользу более лёгких вариантов из ткани и кожи. Возможно, в других провинциях у них репутация изнеженных бойцов, но эти так называемые налётчики определённо вселяют ужас в сердца измученных ийроссов одним лишь видом своих чёрных знамён.$innovation_legion_raiders_quote$"
 innovation_legion_raiders_quote: "\n\n#inno_quote \"\"#!$innovation_legion_raiders_quote_attribution$"
 innovation_legion_raiders_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_magi_steel: "Магическая сталь"
 innovation_magi_steel_desc: "Этот богатый углеродом и слегка зачарованный металл, также известный как [Concept('aversaria','имперская')|E] сталь, отлично подходит для изготовления оружия. Магическая сталь широко продаётся и считается одним из лучших сортов стали в мире, который человечество ещё помнит, как создавать. На протяжении большей части истории она привлекала внимание торговцев со всего [Concept('aeras','Эраса')|E] и вызывала восхищение у академиков [Concept('mayikprolollans', 'майикпрололланов')|E].$innovation_magi_steel_quote$"
 innovation_magi_steel_quote: "\n\n#inno_quote \"\"#!$innovation_magi_steel_quote_attribution$"
 innovation_magi_steel_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_marcher_adventurers: "Марочникские авантюристы"
 innovation_marcher_adventurers_desc: "[Concept('chevalie','Шевалье')|E] — это земля войны. Прокатитесь по любой марочникской деревне, и вы быстро заметите жреца пути Мечей, тренирующегося с небольшой армией юношей. Поверните на запад к Гисреддепорту, где молодые ученики этих жрецов охотно садятся на украшенные флагами корабли, чтобы исследовать мир в составе тысячи наёмных рот. Хотя её границы могут и не расширяться, дети [Concept('chevalie','Шевалье')|E] одержали достаточно побед, чтобы завоевать мир дважды.$innovation_marcher_adventurers_quote$"
 innovation_marcher_adventurers_quote: "\n\n#inno_quote \"Подобно крысам, марочники умудряются пролезать в каждую щель Империи — предупреждаю тебя, сестра, как только они прибудут и почуют запах монеты, ты уже никогда от них не избавишься"\"#!$innovation_marcher_adventurers_quote_attribution$"
 innovation_marcher_adventurers_quote_attribution: "\n #inno_quote ~ Маг-археолог магистр Никтинай, личное письмо в [Concept('mayikrata','Майикратию')|E]#!"
 innovation_marcher_knights: "Рыцарские кодексы"
 innovation_marcher_knights_desc: "Марки в последнее время находятся во власти настоящего литературного и культурного ренессанса. Новые баллады, книги о любви, руководства по выбору Путей и извечные попытки более амбициозных жрецов Путей заставить крестьян учить грамоту охватывают всю страну. Эта новая эра знаменует собой как появление законов против роскоши, так и введение дальнейших ограничений на поведение, считающееся подобающим для рыцаря, сражающегося с другими собратьями по Пути. Была даже попытка канонизировать небольшой свод правил для сражений с теми, кто не является марочником, но это вызвало споры и прижилось лишь частично.$innovation_marcher_knights_quote$"
 innovation_marcher_knights_quote: "\n\n#inno_quote \"То был славный рыцарь, испытанный в брани,\nРазил он чудовищ, спасал дев от дани.\nНи странник, ни витязь в подлунном предели\nС ним честью безупречной сравниться б не смели!\nСквозь глушь Каденси мчал он в дальние дали,\nТуда, где поля Аверсарии в крови закипали..."\"#!$innovation_marcher_knights_quote_attribution$"
 innovation_marcher_knights_quote_attribution: "\n #inno_quote ~ Песнь о сэре Асуальде, шевальенская эпическая поэма XIII века#!"
 innovation_mezzarb_domestication: "Одомашнивание меззарбов"
 innovation_mezzarb_domestication_desc: "Кратер Акерсхан является домом для исключительно крупной и выносливой породы коз, известных как меззарбы. Эти козы подходят региону гораздо лучше лошадей, так как им проще передвигаться по пересечённой местности кратера, при необходимости взбираясь по почти вертикальным утёсам. Благодаря их впечатляющей силе и телосложению ахридаристы используют их в качестве скакунов и часто задействуют как кавалерию во время войн.$innovation_mezzarb_domestication_quote$"
 innovation_mezzarb_domestication_quote: "\n\n#inno_quote \"Тропа, по которой прошёл бы только меззарб"\"#!$innovation_mezzarb_domestication_quote_attribution$"
 innovation_mezzarb_domestication_quote_attribution: "\n #inno_quote ~ Акерсханская поговорка, означающая выбор более трудного пути#!"
 innovation_moonkin: "Лунные ритуалы"
 innovation_moonkin_desc: "Бледный [Concept('aervalr','Эрвал')|E], закрепившийся в опасной близости среди ветвей Стодруснигги, всегда имели глубокое духовное значение в культуре стодхеррнов. Несмотря на неоднократные попытки подавления и присваивания со стороны [Concept('aversaria','аверсарианцев')|E], Родичи луны — широкое объединение братских и сестринских орденов, чьё наследие в культуре мондекнов насчитывает более тысячи лет, — теперь начали всплывать на поверхность. В целом мирные, их ритуалы и практики, направленные на управление и защиту мира природы, также весьма полезны для подготовки первоклассных разведчиков и застрельщиков, если нашему народу придётся сражаться за выживание.\n\nИ да уберегут нас боги от того, чтобы этот день когда-либо настал.$innovation_moonkin_quote$"
 innovation_moonkin_quote: "\n\n#inno_quote \"\"#!$innovation_moonkin_quote_attribution$"
 innovation_moonkin_quote_attribution: "\n #inno_quote ~ #!"
 innovation_mountainstrikers: "Горные ударники"
 innovation_mountainstrikers_desc: "Обладая тысячелетним опытом, никто не искусен в высокогорной войне так, как гоанцы. Их традиционная боевая тактика строится вокруг отрядов воинов под названием «Горные ударники», которые являются элитой среди солдат любого племени. Эти силы обычно формируют авангард гоанского построения; они мастера скрытности и мобильности на высоте, способные наносить удары с направлений, считавшихся невозможными. Кроме того, исключительные качества этих войск придают дополнительную мощь их штурмам, и они славятся преодолением, казалось бы, неприступных позиций.$innovation_mountainstrikers_quote$"
 innovation_mountainstrikers_quote: "\n\n#inno_quote \"\"#!$innovation_mountainstrikers_quote_attribution$"
 innovation_mountainstrikers_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_north_shields: "Щиты Севера"
 innovation_north_shields_desc: "Южные [Concept('aversaria','аверсарианские')|E] собратья всегда считали апокиакасов странным народом. Говорят, что они уже не совсем аверсарианцы, ведь их родословная осквернена следами кардвенов, карзарадов и даже сьялволков. Сами же апокиакасы сказали бы, что их южные кузены изнежены и не смогли бы пережить и единой зимы на суровом пограничье. Они научились жить и сражаться у своих соседей-варваров, вдали от уюта тёплых южных морей.$innovation_north_shields_quote$"
 innovation_north_shields_quote: "\n\n#inno_quote \"\"#!$innovation_north_shields_quote_attribution$"
 innovation_north_shields_quote_attribution: "\n #inno_quote ~ #!"
 innovation_observant: "Монахи-наблюдатели"
 innovation_observant_desc: "Наблюдатели — это монахи-воины, верящие, что битва — это всего лишь ещё одна часть в Великом Сне, и что через совершенствование этого искусства они смогут лучше понять его течения и потоки. Они взяли на себя роль умелых лучников, и эта позиция позволяет им как наблюдать за полем боя, так и выпускать смертоносные стрелы с чёрным оперением в неосторожных врагов. Дисциплина внутри их групп легендарна, а те, кому довелось столкнуться с ними дважды и остаться в живых, знают, что стоит бояться далёкого гула их зычных ритуальных песнопений.$innovation_observant_quote$"
 innovation_observant_quote: "\n\n#inno_quote \"\"#!$innovation_observant_quote_attribution$"
 innovation_observant_quote_attribution: "\n #inno_quote ~ #!"
 innovation_partic_seers: "Знание лей-линий"
 innovation_partic_seers_desc: "Когда Сокрушитель Ведьм захватил [Concept('mayikrata','Майикратию')|E], он разделил нажитые нечестным путём богатства [Concept('aversaria','имперских')|E] [Concept('magi','магов')|E] между провидцами и шаманами своей коалиции. Изучение этих томов позволило нам восполнить существенные пробелы в наших знаниях, особенно касающихся так называемой [Concept('sea_tower','Морской башни')|E] и связанной с ней [Concept('tower_wayline','башенных  лей-линий')|E]. Объединение нашего собственного опыта с тысячелетним наследием аверсарианских магов даёт нам почти непревзойдённый потенциал.$innovation_partic_seers_quote$"
 innovation_partic_seers_quote: "\n\n#inno_quote \"\"#!$innovation_partic_seers_quote_attribution$"
 innovation_partic_seers_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_prophets_sons: "Иноземные антимагические приёмы"
 innovation_prophets_sons_desc: "Куда бы ни направлялись марочникские наёмники, их [Concept('antimagic','антимагические')|E] приёмы вскоре следуют за ними. Их искусство настолько востребовано, что для военных отрядов стало обычным делом привозить со своей родины сундуки с иллюстрированными руководствами, чтобы продавать их вместе со своими услугами, а те, кто сам достаточно искусен, часто подрабатывают инструкторами для платёжеспособных клиентов. Всё большее число благородных семей в последнее время нанимают одного-двух марочникских учителей на постоянной основе для обучения своих детей.$innovation_prophets_sons_quote$"
 innovation_prophets_sons_quote: "\n\n#inno_quote \"Обездвижьте руки, сдавите горло. На расстоянии болт валит мага так же легко, как и любого другого человека. Вы записываете это?"\"#!$innovation_prophets_sons_quote_attribution$"
 innovation_prophets_sons_quote_attribution: "\n #inno_quote ~ Гаспар Витрич, марочникский учитель#!"
 innovation_pure_pikes: "Пики Чистейшего"
 innovation_pure_pikes_desc: "Если послушать лордов Опахасии, то Прославленное увенчанное солнцем братство пикинеров Чистейшего — это древний и смертоносный институт, восходящий к эпохе, предшествовавшей захвату [Concept('aversaria','Аверсарией')|E] Храма Горного Солнца. Они утверждают, что эти люди — величайшие воины в [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )], чьи несокрушимые золотые доспехи несут благословение самого Чистейшего.\n\nВсё это, конечно же, притворство. Золото — лишь тонкий слой позолоты поверх обычного железа, а их чистейшие белые мундиры — результат чрезмерного отбеливания. Айронойцы посмеиваются, что опахасийцам даже пришлось начать нанимать варваров-наёмников, чтобы заполнить ряды. Несмотря на эти унижения, опахасийцам всё же извлекают выгоду из бесспорно эффективной военной традиции пикинёрской войны, насчитывающей тысячелетие, и часто упускаемых из виду преимуществ хорошего дизайна формы для боевого духа. Даже будучи непомерно дорогой роскошью, которую современная Опахасия едва может позволить себе выставить на поле боя, они всё ещё способны побеждать в сражениях.$innovation_pure_pikes_quote$"
 innovation_pure_pikes_quote: "\n\n#inno_quote \"Суд Чистейшего находится на острие пики. Его благословение сияет на щите"\"#!$innovation_pure_pikes_quote_attribution$"
 innovation_pure_pikes_quote_attribution: "\n  #inno_quote ~ Опахасийская поговорка#!"
 innovation_rayakuux_archers: "Лучники Раякуукс"
 innovation_rayakuux_archers_desc: "Хотя в первую очередь они посвящают себя исследованиям, многие раякуукс выставляют отряды лучников для защиты своих сородичей. Благодаря многолетнему опыту путешествий они славятся своей способностью адаптироваться к самым разным условиям.$innovation_rayakuux_archers_quote$"
 innovation_rayakuux_archers_quote: "\n\n#inno_quote \"\"#!$innovation_rayakuux_archers_quote_attribution$"
 innovation_rayakuux_archers_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_rearka_training: "Подготовка ре'арков"
 innovation_rearka_training_desc: "Ре'арки начинали как простые охранники торговцев, защищая их от жестоких набегов айкар-б'хийллов с верхнего яруса. Со временем они превратились в элитных солдат на службе правителей Тагродара, оберегающих торговлю вдоль реки.$innovation_rearka_training_quote$"
 innovation_rearka_training_quote: "\n\n#inno_quote \"\"#!$innovation_rearka_training_quote_attribution$"
 innovation_rearka_training_quote_attribution: "\n #inno_quote ~ #!"
 innovation_reefmining: "Добыча на рифах"
 innovation_reefmining_desc: "Легендарные Кристальные рифы опутывают острова подобно паутине, а растущие на них великие живые кристаллы вызывают огромный интерес у [Concept('magi','магов')|E] и считаются лучшими самоцветами для удержания магических чар. Несмотря на это, отсутствие инфраструктуры на островах, их удалённость от остального [Concept('aeras','Эраса')|E] и постоянные распри привели к тому, что этот регион пришёл в запустение. Хуже всего то, что сами Кристальные рифы таят в себе бесконечную опасность. Хотя они и приносят пользу местной коммерции, порождаемые ими кристальные огоньки губили целые флоты — равно как и вечно появляющиеся велианские алмазы, огромные големы из чистого кристалла, которые порой выходят из моря и опустошают сушу, находясь словно в каком-то нечеловеческом трансе.$innovation_reefmining_quote$"
 innovation_reefmining_quote: "\n\n#inno_quote \"\"#!$innovation_reefmining_quote_attribution$"
 innovation_reefmining_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_regular_magic: "Магия"
 innovation_regular_magic_desc: "Существуя с самого начала времён, магия пронизывает все здешние миры. Будучи обузданной, магия способна принести как щедрые блага, так и невообразимое разорение.$innovation_regular_magic_quote$"
 innovation_regular_magic_quote: "\n\n#inno_quote \"\"#!$innovation_regular_magic_quote_attribution$"
 innovation_regular_magic_quote_attribution: "\n #inno_quote ~ #!"
 innovation_retreat_tactics: "Тактика отступления"
 innovation_retreat_tactics_desc: "После тысячелетия набегов со стороны айкар-б'хийллов, народ ааоюотов ответил необычной стратегией. Вместо того чтобы пытаться дать отпор воинам айкар-б'хийллов, на'паки вместо этого стремятся максимально смягчить ущерб с помощью оборонительного отступления.$innovation_retreat_tactics_quote$"
 innovation_retreat_tactics_quote: "\n\n#inno_quote \"\"#!$innovation_retreat_tactics_quote_attribution$"
 innovation_retreat_tactics_quote_attribution: "\n #inno_quote ~ #!"
 innovation_roshotzi: "Рошот'зи ввер"
 innovation_roshotzi_desc: "Будучи по большей части кочевниками, теугомбрийцы путешествуют, погрузив всю свою жизнь на «рошот'зи ввер», или «дорожные крепости». Каждый теугомбрийский род перевозит в своём караване порой до двух десятков таких укреплённых повозок, служащих в равной степени и домом, и мобильным военным лагерем.$innovation_roshotzi_quote$"
 innovation_roshotzi_quote: "\n\n#inno_quote \"\"#!$innovation_roshotzi_quote_attribution$"
 innovation_roshotzi_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_sarradon_imitation_legion: "Саррадонские подражательные легионы"
 innovation_sarradon_imitation_legion_desc: "Прямое знакомство с [Concept('aversaria','[Concept('aversaria','Aversarian')|E]')|E] тактикой во время Похода Святых подтолкнуло саррадонскую сторону конфликта к ряду зеркальных преобразований в попытке соответствовать континентальной тактике и противостоять ей. Одной из особенно успешных военных инноваций стала попытка скопировать стиль боя самого печально известного аверсарианского легиона. Эти наёмные солдаты, облачённые в выкованные магами латы, являются одной из лучших боевых сил, которые только может предложить Саррадон.$innovation_sarradon_imitation_legion_quote$"
 innovation_sarradon_imitation_legion_quote: "\n\n#inno_quote \"Трудности, с которыми столкнулись саррадонцы в Походе, обнажили пробелы в военной доктрине варденитов. Не имея возможности легко противостоять легионам, саррадонцы предпочли создать свои собственные"\"#!$innovation_sarradon_imitation_legion_quote_attribution$"
 innovation_sarradon_imitation_legion_quote_attribution: "\n #inno_quote ~ «Святые и саррадонцы: Новая история»#!"
 innovation_sarradon_legalism: "Сaррадonский легализм"
 innovation_sarradon_legalism_desc: "Хотя система учёта и бюрократического управления во многом является плодом одержимости варденизма ведением записей и юридическими тонкостями, она, зародившись при мамурах, стала стандартом для всего южного континента.$innovation_sarradon_legalism_quote$"
 innovation_sarradon_legalism_quote: "\n\n#inno_quote \"...и вижу я, что там будут обитать Дети Администрации. Никогда более не страдая от несовершенного правления людей, жители предстанут в великолепии пред вечными законами, запечатлёнными на небосводе, поддерживаемом Столпами, коим возвращена былая целостность, как во времена Единого"\"#!$innovation_sarradon_legalism_quote_attribution$"
 innovation_sarradon_legalism_quote_attribution: "\n #inno_quote ~ Отрывок из «Видения Башни Ангела» за авторством [Concept('first_warden','Первого Вардена')|E]#!"
 innovation_sarradon_magi_plate: "Саррадонские магические латы"
 innovation_sarradon_magi_plate_desc: "Став конечным воплощением практик, которые тестировались [Concept('sirhad','сирхадами')|E] ещё до Халакдуна, саррадонская сталь теперь включает в себя сложную серию магических ритуалов в процессе её производства. Результатом трудов этого растущего класса [Concept('magi','магов')|E]-ремесленников стало новое поколение оружия и доспехов, отличающихся одновременно прочностью и гибкостью. Некоторые учёные начали применять новообретённую точность и прочность этих методов в более мирных целях, подражая древним картараддски автоматам, но пока их основным поприщем остаётся поле боя.$innovation_sarradon_magi_plate_quote$"
 innovation_sarradon_magi_plate_quote: "\n\n#inno_quote \"\"#!$innovation_sarradon_magi_plate_quote_attribution$"
 innovation_sarradon_magi_plate_quote_attribution: "\n #inno_quote ~ #!"
 innovation_sarradon_new_sirhad: "Новый Сирхад"
 innovation_sarradon_new_sirhad_desc: "Будучи реликтом времён до [Concept('halakdun','Халакдуна')|E], [Concept('sirhad','сирхад')|E] являлся традиционной кастой [Concept('magi','магов')|E] Саррадона, которая управляла рядом академий и связанных с ними тайных лож по всему континенту. Несмотря на номинальный раскол по религиозному признаку, сирхады былых времён демонстрировали поразительную готовность откладывать в сторону вероучительные разногласия ради погони за знаниями — или, в некоторых случаях, ради предотвращения катастроф от безрассудного использования запретных чар. Хотя оригинальный Сирхад пришёл в упадок после масштабной эпидемии [Concept('bloodblight','кровавого мора')|E] и был окончательно уничтожен в огне [Concept('halakdun','Халакдуна')|E] и [Concept('the_downfall','Падения')|E], по мере того как магические династии Саррадона начали восстанавливаться, на континенте растёт интерес к возрождению этой традиции. На фоне того как вокруг этого полузабытого идеала организуются новые ложи и ассоциации магов, кое-кто начинает шептаться, что Саррадон стоит на пороге возвращения в Эпоху Огня.$innovation_sarradon_new_sirhad_quote$"
 innovation_sarradon_new_sirhad_quote: "\n\n#inno_quote \"\"#!$innovation_sarradon_new_sirhad_quote_attribution$"
 innovation_sarradon_new_sirhad_quote_attribution: "\n #inno_quote ~ #!"
 innovation_sarradon_tusuffna_circuit: "Посвящения Тусуффнийского круга"
 innovation_sarradon_tusuffna_circuit_desc: "Ложи Тусуффна были частью саррадонского общества на протяжении веков. Получив черты как уличных банд, так и братств (или сестринств) мистиков, эти ложи стали неотъемлемой частью городского общества по всему континенту, восходящей к хаосу времён самого Халакдуна. В последние годы ложи прочно закрепились в качестве постоянного элемента культурного ландшафта Саррадона, причём некоторым ложам высшего класса покровительствуют даже короли и мамуры. Стандартными знаками отличия членов Тусуффны обычно служат яркие штаны, окрашенные в цвета ложи, хотя в некоторых регионах местные особенности привели к тому, что ложи используют шарфы, жилеты или уникальные головные уборы для обозначения своей принадлежности.$innovation_sarradon_tusuffna_circuit_quote$"
 innovation_sarradon_tusuffna_circuit_quote: "\n\n#inno_quote \"...положив испачканную в крови руку на идол клятв, подобно Дишали и Авгали, воскликни громким и решительным голосом: о верности Дисуваю, о храбрости перед лицом его врагов, о вечной мести Совету Тридцати Трёх и о смерти всем предателям республики и этой клятвы"\"#!$innovation_sarradon_tusuffna_circuit_quote_attribution$"
 innovation_sarradon_tusuffna_circuit_quote_attribution: "\n #inno_quote ~ Как утверждается, это клятва, приносимая в ложе Ушбилийя ордена Дисувая#!"
 innovation_sjalvolki_adventurers: "Сьялволькские авантюристы"
 innovation_sjalvolki_adventurers_desc: "Хотя большинство сьялволков являются заядлыми земледельцами, их общество в целом издавна отличалось выраженной тягой к перемене мест. Некоторые предполагают, что это возникло в результате их религиозной преданности охоте, подготовившей многих воинов-сьялволков к возможности путешествовать на огромные расстояния в поисках достойной битвы. Другие учёные размышляют, что это стало результатом веков, проведённых на землях, которые были достаточно плодородны, чтобы вырастить большое население, но слишком малы, чтобы удовлетворить амбиции каждого сьялволькского дворянина. Как бы то ни было, если где-то есть богатая земля, которую можно забрать, наверняка найдётся честолюбивый молодой сьялволк, готовый преодолеть огромные расстояния, чтобы попытаться её захватить.$innovation_sjalvolki_adventurers_quote$"
 innovation_sjalvolki_adventurers_quote: "\n\n#inno_quote \"Погнали со мной, парни, настучим кому-нибудь по башке, раздобудем монет, а Ценвар сделает нас всех королями! Хватайте выпивку и поищем корабль! Ха-ха!"\"#!$innovation_sjalvolki_adventurers_quote_attribution$"
 innovation_sjalvolki_adventurers_quote_attribution: "\n #inno_quote ~ Ульфир «Бешеный Пёс»#!"
 innovation_spiritskin: "Духовная кожа"
 innovation_spiritskin_desc: "Мазь «Духовная кожа», производимая из сока деревьев ксапанта, произрастающих в глуши [Concept('cyrat_biozone','Кирата')|E], защищает того, кто её нанёс, от смертоносных стай москитов, нападающих на любого, кто ступит на эту цветущую, но адскую землю. Будучи смертельным токсином в чистом виде, сок после правильной дистилляции и очистки может служить мощным средством от насекомых и противоядием.$innovation_spiritskin_quote$"
 innovation_spiritskin_quote: "\n\n#inno_quote \"\"#!$innovation_spiritskin_quote_attribution$"
 innovation_spiritskin_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_sandskiff_lore: "Знания о песчаных скифах"
 innovation_sandskiff_lore_desc: "Песчаные скифы — почти утерянный способ передвижения, встречающийся исключительно в самых глубоких уголках [Glossary('Саррадонской пустыни','sarradonian_desert_encyclopedia_desc')]. Эти чудесные изобретения позволяют многим кочевым кланам с лёгкостью преодолевать огромные расстояния, а потому секреты их обслуживания ревностно охраняются всеми, кто ими владеет.$innovation_sandskiff_quote$"
 unlock_sandskiff_travel_option: "Открывает [Concept('travel_option','способ путешествия')|E] [GetTravelOption('use_sand_skiffs_option').GetName]"
 innovation_sandskiff_quote: "\n\n#inno_quote \"Пусть эти плодородные земли были созданы для жизни человека, но именно в пустыне мы обретаем свои души.\n#!$innovation_sandskiff_lore_quote_attribution$"
 innovation_sandskiff_lore_quote_attribution: "\n #inno_quote ~ Афитре Утял#!"
 innovation_stepwalkers: "Шагающие по ступеням"
 innovation_stepwalkers_desc: "Несмотря на истощение в ходе [Concept('war_in_heaven','Войны в небесах')|E] и катастрофическое, почти полное исчезновение [Concept('magi','магов')|E] на континенте из-за [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E], древние традиции колдовства всё ещё сохраняются в Саррадоне. Радикально чуждые традициям магических практиков [Concept('aversaria,'Аверсарии')|E], Шагающие по ступеням представляют собой не конкретную школу или традицию, а собирательное понятие, относящееся к более чем пяти сотням выявленных практик и культов. Некоторые группы сомнительно заявляют о своей истории, уходящей вглубь более чем на тысячу лет — и некоторые из них, возможно, даже говорят правду.$innovation_stepwalkers_quote$"
 innovation_stepwalkers_quote: "\n\n#inno_quote \"И вот звезда была низвергнута на юг, и мир был объят пламенем сто дней и ночей.\n\nНо святейшее место всё ещё высилось гордо, и дети [Concept('sophocos','Софокоса')|E] ждали, как делали это трижды прежде, укрытые в его тени"\"#!$innovation_stepwalkers_quote_attribution$"
 innovation_stepwalkers_quote_attribution: "\n #inno_quote ~ Васиф Рассказчик, «Пересказанные дни древнейших времён»#!"
 innovation_stoneforged: "Выкованные из камня"
 innovation_stoneforged_desc: "По мере того как их цивилизация приспосабливалась к новому дому, гоанцы начали внедрять технологические инновации. Это особенно заметно на примере «Выкованных из камня», представляющих собой современную адаптацию древних Горных ударников. Теперь они вооружены более качественным и тяжёлым оружием, а достижения в логистике позволили более крупным и сильным отрядам выживать в опасных условиях высокогорья. Эти новые воины положили начало революции в гоанском военном деле, а сами Выкованные из камня обрели единообразие и дисциплину, которые гораздо реже встречались у их предшественников.$innovation_stoneforged_quote$"
 innovation_stoneforged_quote: "\n\n#inno_quote \"\"#!$innovation_stoneforged_quote_attribution$"
 innovation_stoneforged_quote_attribution: "\n #inno_quote ~ #!"
 innovation_sunstriders: "Кавалерия идущих по солнцу"
 innovation_sunstriders_desc: "Времена изменились. Наши воительницы больше не могут полагаться исключительно на свои верные луки и быстроногих коней — да и не должны. Вызовы сегодняшнего дня требуют нового типа сарминианской воительницы: облачённого в сталь и ламеллярные доспехи, вооружённого не просто луком, но и копьём, и многим другим. Теперь, когда неистовые военные отряды прошлых лет выстраиваются в сплочённые клинья тяжёлой кавалерии, какой враг посмеет надеяться выжить под их громовым натиском?$innovation_sunstriders_quote$"
 innovation_sunstriders_quote: "\n\n#inno_quote \"Что стало с молодым поколением? Они заковывают себя в броню, бросают луки и рассуждают о «тактике» и прочих жалких уловках. Клянусь, некоторые из них даже в седле держаться не умеют без самого седла!"\"#!$innovation_sunstriders_quote_attribution$"
 innovation_sunstriders_quote_attribution: "\n #inno_quote ~ Бейка «Быстрая», истинная сарминианская воительница#!"
 innovation_sword_oaths: "Шесть железных клятв"
 innovation_sword_oaths_desc: "Среди теугомбрийцев вооружённые родовые ватаги, как известно, приносят клятвы древним духам мечей из железа и бронзы. Освящённые кровью и мистическими татуировками, эти отряды воинов составляют основу боевого общества теугомбрийцев.$innovation_sword_oaths_quote$"
 innovation_sword_oaths_quote: "\n\n#inno_quote \"\"#!$innovation_sword_oaths_quote_attribution$"
 innovation_sword_oaths_quote_attribution: "\n #inno_quote ~ #!"
 innovation_talabhau: "Талабхау"
 innovation_talabhau_desc: "Воины, известные как талабхау, славятся по всей Каширии своей дисциплиной и мужеством. На протяжении Чан Скоропокаипис и после него древние братства рахикайев несли службу в армиях Центральной Каширии, внушая страх повсюду, куда бы они ни направлялись.$innovation_talabhau_quote$"
 innovation_talabhau_quote: "\n\n#inno_quote \"\"#!$innovation_talabhau_quote_attribution$"
 innovation_talabhau_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_terrors_of_the_void: "Ужасы Пустоты"
 innovation_terrors_of_the_void_desc: "Покоритесь Пустоте и Тёмным богам. Взамен вам будет дарована неизмеримая сила.$innovation_terrors_of_the_void_quote$"
 innovation_terrors_of_the_void_quote: "\n\n#inno_quote \"«Они — это Путь. Они — это понимание. Они — это спасение. Они — Единственная Истина. Служить значит знать Их. Знать Их значит знать Истину. Истина темна. Истина — это тьма, несущая понимание. Неверные чураются тьмы. Неверные чураются Истины. Истина — это Путь. Истина — это понимание. Истина — это спасение. Единственная Истина — это Они»"\"#!$innovation_terrors_of_the_void_quote_attribution$"
 innovation_terrors_of_the_void_quote_attribution: "\n #inno_quote ~ Ритуальное песнопение культистов Красных земель#!"
 innovation_the_bloodied: "Ийросские налётчики"
 innovation_the_bloodied_desc: "Высокомерие [Concept('aversaria','[Concept('aversaria','Aversarians')|E]')|E] привело их к убеждению, будто восстание рабов никогда не сможет сокрушить местный гарнизон, каким бы плохо экипированным он ни был. Возможно, так оно и было в прошлые века, но теперь стало ясно, что наши тираны понятия не имеют, какие ужасные силы высвободила их продажная халатность. Пока месяцы сменялись годами, а года — десятилетиями, разношёрстные банды сбежавших рабов учились сражаться, превращаясь из беженцев в закалённых бойцов, искушённых в искусстве партизанской войны и налётов против разжиревших и ленивых аверсарианцев. Они обманывали себя, думая, будто смогут сломить бессмертный дух ийроссов, заковывая и унижая нас, и никак не ожидали, что настанет время платить по счетам.\n\nТеперь пришло время мести.$innovation_the_bloodied_quote$"
 innovation_the_bloodied_quote: "\n\n#inno_quote \"\"#!$innovation_the_bloodied_quote_attribution$"
 innovation_the_bloodied_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_thrill_of_the_hunt: "Азарт охоты"
  # GH TODO: Add proper desc to Kardwen inno
 innovation_thrill_of_the_hunt_desc: "$innovation_thrill_of_the_hunt_quote$"
 innovation_thrill_of_the_hunt_quote: "#inno_quote \«Вы слышали что-нибудь?»\"#!$innovation_thrill_of_the_hunt_quote_attribution$"
 innovation_thrill_of_the_hunt_quote_attribution: "\n  #inno_quote ~ Кромус Рекс, командир XXIII легиона «Зелёные пальцы», незадолго до своего бесследного исчезновения.#!"
 innovation_thumb_rings: "Кольца для большого пальца"
 innovation_thumb_rings_desc: "Эти кольца необычной формы, часто считающиеся чужаками лишь забавной безделушкой, надеваются на большой палец руки и значительно облегчают процесс многократного натяжения лука.$innovation_thumb_rings_quote$"
 innovation_thumb_rings_quote: "\n\n#inno_quote \"Будь бережлив; тебе не вернуть свою стрелу, если цель убежит"\"#!$innovation_thumb_rings_quote_attribution$"
 innovation_thumb_rings_quote_attribution: "\n #inno_quote ~ Распространённая ольтенская поговорка#!"
 innovation_winged_shields: "Крылатые щиты"
 innovation_winged_shields_desc: "Большие сегментированные щиты крепятся к спинам и плечам лучников, обеспечивая им надёжную защиту без ущерба для скорости или подвижности.$innovation_winged_shields_quote$"
 innovation_winged_shields_quote: "\n\n#inno_quote \"Степь не даёт укрытий, и любой мало-мальски обученный лучник продырявит тебя с пятидесяти шагов. Решение тут очевидно"\"#!$innovation_winged_shields_quote_attribution$"
 innovation_winged_shields_quote_attribution: "\n  #inno_quote ~ Тооргул, хайшегский офицер#!"
 innovation_tribal_magic: "Руническая свеча"
 innovation_tribal_magic_desc: "Покрытая рунами и пропитанная зачарованными маслами, руническая свеча служит рудиментарным источником [Concept('magic','магии')|E] для прилежного [Concept('magi','мага')|E].$innovation_tribal_magic_quote$"
 innovation_tribal_magic_quote: "\n\n#inno_quote \"В самом сердце моей обители,\nГде дед мой сидел и отец,\nГорит свеча"\"#!$innovation_tribal_magic_quote_attribution$"
 innovation_tribal_magic_quote_attribution: "\n  #inno_quote ~ Бхатираматхака (Трое эрудитов)#!"
 innovation_veiled: "Сокрытые вуалью"
 innovation_veiled_desc: "Говорят, что в лучшие времена гестанводерские маги собирались лишь тайно, совершая гнусные ритуалы для общения с неописуемым. Говорят, теперь они знают имена всего того, чего быть не должно, что едва не случилось и чему никогда не бывать. Что они общались с чуждыми духами и научились изощрённым жестокостям из эпохи, оставшейся за пределами памяти. И теперь, в час нашего триумфа, они практикуют всё это открыто, навлекая кошмары на весь мир.\n\nПоток живых пленников непрерывно уводят в самые заброшенные дебри наших болот. Те немногие, кто возвращается оттуда, уже не являются людьми. Бок о бок с нашими армиями ковыляют чудовища из вздымающихся, истерзанных мускулов — сросшиеся формы, в которых безошибочно угадываются те, кто некогда был человеком. Даже нашим собственным солдатам трудно смотреть на них без тошноты, и они стали повязывать грубые вуали поверх органов, которые явно когда-то были лицами.$innovation_veiled_quote$"
 innovation_veiled_quote: "\n\n#inno_quote \"\"#!$innovation_veiled_quote_attribution$"
 innovation_veiled_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_war_chariots: "Боевые колесницы"
 innovation_war_chariots_desc: "Колесницы долгое время оставались доминирующей силой на бескрайних просторах [Concept('the_continent', 'Континента')|E], славясь своей скоростью и мощью во время сражений.$innovation_war_chariots_quote$"
 innovation_war_chariots_quote: "\n\n#inno_quote \"\"#!$innovation_war_chariots_quote_attribution$"
 innovation_war_chariots_quote_attribution: "\n  #inno_quote ~ #!"
 innovation_waranuux_spearmen: "Копья Варануукс"
 innovation_waranuux_spearmen_desc: "Братства варануукс из племени кутмайцев славятся по всей Дамоте как грозные и умелые бойцы благодаря своим крепким воинским традициям. От каждого ожидается участие хотя бы в одной битве плечом к плечу со своими товарищами, а многие и вовсе посвящают искусству войны всю свою жизнь.$innovation_waranuux_spearmen_quote$"
 innovation_waranuux_spearmen_quote: "\n\n#inno_quote \"\"#!$innovation_waranuux_spearmen_quote_attribution$"
 innovation_waranuux_spearmen_quote_attribution: "\n #inno_quote ~ #!"
 innovation_warisnik_mammoths: "Методы разведения мамонтов"
 innovation_warisnik_mammoths_desc: "Мамонты издавна использовались в качестве рабочей силы в обществе варисников, но одомашненное поголовье сильно сократилось во время великих переселений вдали от [Concept('the_fog','Тумана')|E]. Однако прошло уже много лет со дней [Concept('sjalvolki_migration','переселения')|E], и те немногие выжившие мамонты, которых привели с собой, размножились на наших новых плодородных землях. Теперь у нас есть численность и ресурсы для вывода на поле боя специализированных отрядов наездников на мамонтах. Больше это не старые сказки у костра — наездники на мамонтах из племени варисников рождаются заново!$innovation_warisnik_mammoths_quote$"
 innovation_warisnik_mammoths_quote: "\n\n#inno_quote \"\"#!$innovation_warisnik_mammoths_quote_attribution$"
 innovation_warisnik_mammoths_quote_attribution: "\n #inno_quote ~ #!"
 innovation_wodes: "Крик Туманных земель"
 innovation_wodes_desc: "Воины-[Concept('fogeater','пожиратели тумана')|E], по всей видимости, изначально происходили из племени таларегов далекого севера, затерявшегося в [Concept('the_fog','Тумане')|E] в первые годы после [Concept('frodbrokna','Фродброкны')|E], однако среди современных образцов были опознаны те, кто, возможно, когда-то являлся [Concept('aversaria', 'аверсарианскими')|E] легионерами, ольтенскими воинами и даже простыми деревенскими жителями из далекого Катун-Кая. Их прежняя личность стёрта, и теперь они покрывают свои изуродованные тела отвратительными мистическими татуировками и ритуальными шрамами, безумно бросаясь на каждого, кому не посчастливилось оказаться у них на пути.$innovation_wodes_quote$"
 innovation_wodes_quote: "\n\n#inno_quote \"Мать выкрикивает нас на волю, да. Слушайте, слушайте её в нашей крови. Воет, Мать воет! Она идёт! Мы идём!"\"#!$innovation_wodes_quote_attribution$"
 innovation_wodes_quote_attribution: "\n #inno_quote ~ Бывший легат Кулдекс#!"
 innovation_kashiryan_court_system: "Каширийская судебная система"
 innovation_kashiryan_court_system_desc: "Законы и обычаи Каширии широко известны на Востоке своим растущим масштабом ещё со времён империи [Concept('otachedian_empire','Отачеда')|E].$innovation_kashiryan_court_system_quote$"
 innovation_kashiryan_court_system_quote: "\n\n#inno_quote \"Слишком поздно, стены пробиты, они доберутся до нас совсем скоро. Теперь либо делай, либо пади — встретим это вместе!"\"#!$innovation_kashiryan_court_system_attribution$"
 innovation_kashiryan_court_system_attribution: "\n #inno_quote ~ Вародаистский верховный страж Махлы незадолго до окончания осады Отачедом Спокойного острова#!"
 innovation_silver_note: "Серебряные векселя"
 innovation_silver_note_desc: "Народ лакунгов широко использует особый вид бумажных денег в торговле Южного моря. Они возникли как долговые обязательства, использовавшиеся крупными купцами в Бронзовой гавани, однако исключительная ценность этих контрактов со временем привела к тому, что они вытеснили изначальную монету Бронзовой гавани и стали обратимой валютой в Дахангоне и окрестных землях."
 innovation_silver_note_quote: "\n\n#inno_quote\ "Я покупал серебряные мнения у самых разных людей.\"#!$innovation_silver_note_quote_attribution$"
 innovation_silver_note_quote_attribution: "\n  #inno_quote ~ Цзиньцинь из Наньхай Хан#!"
 innovation_night_vision_potion: "Зелье ночного зрения"
 innovation_night_vision_potion_desc: "Зелье ночного зрения — древнее искусство сайелаянов. Смешивая различные травы в определённых пропорциях и нанося смесь вокруг глаз, человек может обрести ночное зрение. Когда Катун-Кай завоевал королевство Миат Шрунфана, сайелаянские повстанцы использовали это искусство для борьбы с режимом Протектората Ланонан. Это позволило гарнизонным войскам катунов также научиться изготовлению зелья ночного зрения."
 innovation_commercial_court: "Коммерческий суд"
 innovation_commercial_court_desc: "Сильная коммерческая атмосфера датанитов в сочетании с традицией легализма [Concept('wardenism','варденизма')|E] породила уникальный институт коммерческого суда. В этом институте судьями выступают опытные купцы-датаниты, применяющие законы для разрешения споров между купцами своего народа. По сравнению с другими варденитскими судами в [Concept('sarradon','Саррадоне')|E], коммерческие суды датанитов сосредоточены скорее на урегулировании гражданских споров, чем на толковании самих законов."
 innovation_fireworks: "Фейерверки"
 innovation_fireworks_desc: "Во время праздников или торжественных событий жители Катун-Кая часто используют предмет под названием фейерверк, молясь о доброй удаче и отпугивая зло. Изначально это изобретение родилось из остроумных идей купцов Бронзовой гавани и распространилось по всему Катун-Каю благодаря высокоразвитой торговой сети."
 innovation_wuizu: "Уицзу"
 innovation_wuizu_desc: "Уицзу — растение, коренное для региона, ныне именуемого Ланонаном. Оно часто растёт в отдалённых, редко посещаемых местах. На стадии роста оно зелёное, а по достижении зрелости становится глубоко чёрным. Благодаря особым методам алхимии катунов его можно перерабатывать и сплетать в лёгкие, дышащие, но удивительно прочные растительные доспехи. Его существование значительно повысило боевые качества катунского гарнизона."
 innovation_waterbending: "Магия воды"
 innovation_waterbending_desc: "Секта Лазурного Змея — одна из пяти главных магических ветвей Катун-Кая. [Concept('magi','Маги')|E] этой секты в основном искушены в магии, связанной с водой. Используя свою способность управлять водными течениями — например, поднимая уровень воды при входе в порт, предотвращая повреждение корпусов кораблей волнами и управляя морской водой для создания лучшего движения, — они могут значительно повысить эффективность кораблей и облегчить навигацию."
 innovation_cave_dwelling: "Скальные жилища"
 innovation_cave_dwelling_desc: "Годы бегства от преследования властей Катун-Кая вынудили народ инсов постепенно мигрировать в отдалённые горные регионы. Чтобы выжить в суровой местности, они научились вырубать пещеры в горах и возводить внутри них замысловатые здания. Когда чужеземцы посещают их поселения, изысканные строения, выступающие из горных склонов, изумляют каждого."
 innovation_agricultural_calendar: "Земледельческий календарь"
 innovation_agricultural_calendar_desc: "Календарь Тянь — уникальная календарная система, используемая народом катунов. За первый год в нём принимается год основания Катун-Кая Яо Жэнь Цай, а время определяется по траекториям солнца и звёзд. Пересматриваемый каждые пять лет, этот календарь является предметом гордости для многих катунов. Кроме того, будучи официальным календарём режима Катун-Кай, он имеет огромное значение для руководства сельскохозяйственным производством. Чиновники, отвечающие за сельское хозяйство, получают свежие астрономические наблюдения из Лоэнь-Чэона в начале каждого нового года и незамедлительно передают их местным властям по всей стране, чтобы не пропустить сроки полевых работ."
 innovation_tilolan_system: "Система тилолан"
 innovation_tilolan_system_desc: "Существование [Concept('tilolan','тилолана')|E] позволяло монархам Империи Дахангон лучше понимать ситуацию в своих владениях через своих вассалов. Кроме того, большинство лордов, приезжавших засвидетельствовать почтение, привозили редкие дары из своих земель в знак покорности. Как правило, авторитет Императора Дахангона можно было измерить редкостью приносимой дани."
 innovation_beast_cavalry: "Звериная кавалерия"
 innovation_beast_cavalry_desc: "После того как народ жугутанов был переселён в Наньмвэй-Бон, их традиционный кочевой образ жизни стал невозможен. Хотя они привели с собой большие стада скота, суровые природные условия юга привели к гибели многих животных. Однако по счастливой случайности они обнаружили в Наньмвэй-Боне новый «скот» — например, гигантских пауков, обитающих в джунглях. Эти твари, которых местные жители считали людоедскими чудовищами, были приручены жугутанами благодаря навыкам обращения с животными их предками. Они обучили пауков в качестве скакунов и сформировали необычные кавалерийские отряды."
 innovation_military_structure: "Военная структура"
 innovation_military_structure_desc: "После основания Катун-Кая Драконья Императрица Яо Жэнь Цай-Тяйян ввела сложный свод правил, подробно описывающий необходимые требования к катунской армии. Хотя эти системы изменились до неузнаваемости под воздействием времени, они остаются важным образцом для местной военной организации в Катун-Кае."
 innovation_yamen_troops: "Войска-ямень"
 innovation_yamen_troops_desc: "Падение Лоэнь-Чэона разрушило единство Катун-Кая. На этой древней земле вновь вспыхнула война. Военачальники Катун-Кая начали до предела вооружать своих личных солдат, чтобы удовлетворить свои амбиции, что в свою очередь привело к появлению тяжёлой пехоты, облачённой в многослойные доспехи. Эти элитные солдаты часто были самой основой существования военачальника. В результате их вводили в бой лишь как решающий удар, когда ситуация на фронте становилась неблагоприятной."
 innovation_heavy_siege_artillery: "Динг"
 innovation_heavy_siege_artillery_desc: "Из-за частых войн правители Катуна постепенно отказались от стабильного, но дорогого малого порохового оружия в пользу производства массивных и тяжёлых осадных пушек. Утолщая стволы, они могли максимально увеличить мощность при сохранении безопасности, что делало эти пушки эффективными против толстых кирпично-каменных стен или плотных строев тяжёлой пехоты. Этот тип тяжёлой артиллерии был назван в честь ритуального сосуда катунов: динга. Некоторые пушечные мастера даже утверждали, что их артиллерия способна «испепелить всё на десятки миль одним выстрелом, убив врага ещё до того, как тот услышит громовой гул». Хотя подобные заявления сильно преувеличивали возможности динга, они тем не менее отражали ужасающие масштабы его мощи."
 unlock_maa_ding: "Позволяет нанимать [GetMaA('ding').GetName] в качестве [Concept('men_at_arms','профессионалов')|E]"
 innovation_banners: "Цибин"
 innovation_banners_desc: "Цибин имеют огромное значение в катунской военной системе, образуя независимую структуру, параллельную самой Императорской армии. Почти все цибин возводят своё происхождение к эпохе, последовавшей сразу за объединением Катун-Кая Драконьей Императрицей Яо Жэнь Цай-Тяйян. Чтобы укрепить новорождённую Империю, она распределила своих верных солдат по всем землям, даровав им территории в обмен на поколения военной службы и вручив каждому уникальный цибин в качестве символа. Хотя на протяжении веков названия многих цибин превратились лишь в части длинных дворянских титулов, те воины, что всё ещё стойко исполняют свой долг, воистину оправдывают звание «Клинка Драконьего Императора»."
 innovation_vidvaookeyatran_scholars: "Учёные-видваукеятраны"
 innovation_vidvaookeyatran_scholars_desc: "Множество [Concept('vidvaookeyatran_scholarly_caste','учёных-видваукеятранов')|E] трудятся при дворе Чинлина, служа новому монарху [Concept('kashirya','Каширии')|E] своими обширными знаниями."
 innovation_kathunkai_infantry_tactics: "Катунская пехотная тактика"
 innovation_kathunkai_infantry_tactics_desc: "Командующий Ланонана овладел сложной пехотной тактикой, способной значительно сократить потери. Во время кампании по завоеванию Ланонана армия Чинлина переняла и впоследствии успешно применяла эту тактику."
 innovation_chinlin_elephant_training_technique: "Техника дрессировки слонов Чинлина"
 innovation_chinlin_elephant_training_technique_desc: "Приведя стада слонов из [Concept('kashirya','Каширии')|E], Чинлин смог использовать их для самых разных целей."
 innovation_alchemical_gunpowder: "Алхимический порох"
 innovation_alchemical_gunpowder_desc: "Технология изготовления пороха постепенно проникала в сердце [Concept('kathun','Катуна')|E] по торговым путям Южного моря. В самые ранние дни люди считали его лишь любопытной забавой, но по мере созревания технологии он всё чаще находил применение на войне. Алхимики Катуна, объединив порох с искусством алхимии, создали грозную, хоть и редкую разновидность пороха, которая коренным образом изменила характер войны."
 innovation_lihuo: "Лихуо"
 innovation_lihuo_desc: "Лихуо — магическая жидкость, высоко ценимая [Concept('magi','магам')|E] Катуна, изготавливается из редких минералов, добываемых в раскалённых глубинах вулканических кратеров. Она имеет серовато-зелёный цвет и очень вязкую консистенцию. Причина, по которой она так ценится среди магов, заключается в её уникальной способности накапливать магическую энергию. Как только она поглощает достаточное количество магии, происходит бурное взрывное возгорание. Любое существо, попавшее в область взрыва, охватывается загадочным магическим пламенем, которое невозможно погасить до тех пор, пока вся магическая энергия внутри полностью не выгорит. Широко применяемая магами на поле боя, лихуо тем не менее печально известна своей нестабильностью, часто причиняя вред своим создателям при малейшем неосторожном обращении."
 innovation_protectorate_system: "Система протекторатов"
 innovation_protectorate_system_desc: "Держава Катун-Кай обширна и велика, простираясь до далёких рубежей, куда едва доходит взор [Concept('kathuni_dragon_mythology','Драконьего Императора')|E]. На этих порубежных землях обитают многочисленные народы, чьи языки и обычаи разительно отличаются от катунского общества. Чтобы гарантировать, что эти разнообразные этнические группы смогут принять власть Катун-Кая, милостивый Драконий Император даровал им автономию для самоуправления под властью небесной династии, взамен требуя лишь их вечной верности [Concept('loen_chaeon','Лоэнь-Чэону')|E]."
 innovation_sifang_boulevard: "Проспект Сифан"
 innovation_sifang_boulevard_desc: "Земли [Concept('kathun','Катуна')|E] испещрены запутанной сетью дорог — коллективным достижением поколений катунских [Concept('kathuni_dragon_mythology','Драконьих Императоров')|E]. Простираясь по всему восточному побережью континента, эти дороги облегчали торговлю и обеспечивали стремительное передвижение армий. Будучи жизненно важными артериями, соединяющими все направления, они почитались народом как сама основа Катун-Кая."
 innovation_xuegong: "Сюэгун"
 innovation_xuegong_desc: "Практически все катунские дворяне получили образование в величественных залах Сюэгуна, где в течение десятилетия среди пышных и великолепных дворцов они обучались не только искусству управления своими владениями, но и путям праведных благородных мужей нерушимой добродетели."
 innovation_specialized_banners_unit: "Особые отряды цибин"
 innovation_specialized_banners_unit_desc: "Прошло более тысячи лет с тех пор, как Первый из Драконов учредил систему цибин, верой и правдой служившую выживанию Катун-Кая на протяжении веков. Однако после того, как Драконий Император отозвал большинство цибин, а последующий крах порядка в Катун-Кае нанёс системе тяжелейший удар, она стала нежизнеспособной. Для сохранения славной традиции цибин система должна быть реорганизована в модернизированную армию, где старая система земельных наделов заменяется единым жалованьем, а военное руководство берёт на себя отбор и подготовку цибин."
 
 innovation_clanlander_resilience: "Стойкость горцев-клановцев"
 innovation_clanlander_resilience_desc: "На протяжении веков Калатипсоми находилась под властью иностранных держав, сперва [Concept('chevalie','Шевалье')|E], затем [Concept('aversaria','Аверсарии')|E], а также многих других. Из-за этого коренные клановцы издавна привыкли к партизанской войне и сражениям против армий, превосходящих их как по качеству, так и по численности.\n\nЭто первенство партизанской войны привело к появлению Зелёных Стражей — воинов клановцев, специализирующихся на борьбе не только с [Concept('aversaria','аверсарианскими')|E] легионами, но и с [Concept('antimagic','антимагическими')|E] приёмами марочников."
 
 innovation_bane_of_the_seas: "Бич империй"
 innovation_bane_of_the_seas_desc: "Женщины-воительницы Крехеджада издавна были великим бедствием для торговых путей по всему [Concept('the_continent','Расколотому побережью')|E] и в совершенстве овладели пиратским искусством до впечатляющих высот."