## Kelthiunai ##
 
# Dasulanoi
 dasulanoi: "Дасуланой"
 dasulanoi_collective_noun: "Дасуланойск"
 dasulanoi_prefix: "Дасуланойско"
 dasulanoi_desc: "#size:15    Древняя культура [Glossary('полиса','GH_POLISOCRACY_GLOSS')] калатипсомийского происхождения, дасуланой давно известны своими обширными торговыми сетями, охватывающими [Concept('shatteredisles','Расколотые острова')|E]. Сформировав сеть автономных олигархических городов-государств, дасуланой были интегрированы в [Concept('aversaria','аверсарианское')|E] государство как дипломатическим, так и военным путем в эпоху пиратства, а многие сотрудничавшие семьи получили привилегированный статус в рамках [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )].\n\nОднако время привело к тому, что аверсарианские идеалы превосходства укоренились в дасуланой, разбавив морские амбиции гордостью и властью через чистоту. Внутрисемейные войны из-за давней коммерческой вражды с тех пор сменили процветание на цикл мести, что привело к разломам на почве религии, политическим разделам и даже народным восстаниям под предводительством амбициозных мелких семейств — конфликтам, часто разрушительным в своей полноте.#"
 dasulanoi_opinion: "Мнение #E дасуланой#!"
 

# Theugundarope
 theygundarope: "Теугундаропы"
 theygundarope_collective_noun: "Теугундаропск"
 theygundarope_prefix: "Теугундаропск"
 theygundarope_desc: "#size:15    История теугундаропов была историей постоянной борьбы и выживания. Происходя из земли, ныне известной как Калатипсоми, теугундаропы давно были изгнаны из своих лесных домов и вынуждены поселиться на скалистых [Concept('shatteredisles','Островах')|E], которые они теперь называют домом. Их [Concept('aversaria','завоеватели')|E] затем обратили теугундаропов в рабство, взимая дань с островных общин раз в пять лет. Однако аверсарианский контроль над островами был относительно мягким, и они назначили местную теисклавоскую элиту править теугундаропами вместо себя. Несмотря на свое подневольное положение, теугундаропы остаются гордыми и сохранили многие из своих старых традиций — являясь живым воплощением кланновцами древности.#"
 theygundarope_opinion: "Мнение #E теугундаропов#!"
 

# Theisklavoi
 theygundarope_aversarian: "Теисклавосы"
 theygundarope_aversarian_collective_noun: "Теисклавойск"
 theygundarope_aversarian_prefix: "Теисклавойско"
 theygundarope_aversarian_desc: "#size:15    Когда [Concept('aversaria','аверсарианцы')|E] вторглись к теугундаропам, не все из них оказали сопротивление. Пять семей протянули руку своим врагам и с их помощью обеспечили победу завоевателям. В этом происхождение теисклавосов — правящей элиты, управлявшей теугундаропами на протяжении поколений. Именно они отвечают за сбор дани со своих низших сородичей и получают в награду часть собранной дани, что позволило теисклавосам быстро подняться в иерархии своих [Concept('shatteredisles','островов')|E].\n\nТеисклавосы очень гордятся своей идентичностью и легко обижаются, когда их путают с теугундаропами, которыми они повелевают. Они придают огромное значение происхождению человека, а их лидеры должны иметь возможность четко проследить свою родословную от одной из пяти семей. Поскольку большая часть черновой работы на островах выполняется теугундаропами, у теисклавосов было больше времени для досуга, и они развили склонность к искусствам. Их живописцы, в частности, пользуются уважением, и не один Аавтократ заказывал свой портрет у художника-теисклавоса.#"
 theygundarope_aversarian_opinion: "Мнение #E теисклавосов#!"
 

## Konijkmener ##
 
# Konijkmener
 konijkmener: "Конейкменеры"
 konijkmener_collective_noun: "Конейкменерск"
 konijkmener_prefix: "Конейкменерско"
 konijkmener_desc: "#size:15    Родом с южного полуострова [Concept('chevalie','Шевалье')|E], конейкменеры снискали репутацию гордого и трудолюбивого народа. Исторически они были народом, объединенным в освоении унылых болот своей родины. Их волшебная болотная вода продавалась по всей [Concept('aversaria','Аверсарии')|E], что позволяло финансировать грандиозные проекты и укореняло их культуру в торговле. Они строили польдеры и дамбы, чтобы создавать обширные сельскохозяйственные угодья на низменных водно-болотных угодьях. Они научились строить каналы, чтобы защитить свои города от капризных приливов. Совершив подвиг инженерного искусства, конейкменеры вырыли канал, полностью отделивший их полуостров от остальной части Шевалье.\n\nНесмотря на свою историю независимости от марочников, они разделяют подобные культурные ценности, такие как исследование земель и наемнические традиции. Однако склонность к республиканским ценностям приводит к тому, что мелкие дворяне и купцы обладают большей властью, чем обычно.#"
 konijkmener_opinion: "Мнение #E конейкменеров#!"
 

# Leegender
 leegenders: "Лехендеры"
 leegenders_collective_noun: "Лехендерск"
 leegenders_prefix: "Лехендерскл"
 leegenders_desc: "#size:15    Лехендеры представляют собой пережиток времен, предшествовавших [Concept('chevalie_migratory_era','Эпохе переселений')|E], когда конейкменеры занимали большие территории восточных побережий [Concept('chevalie','Шевалье')|E]. Их речь кажется их собратьям устаревшей и непостижимой — странный коктейль из слов и особенностей, отсутствующих в языке конейкменеров на протяжении веков, наряду с фразами, перенятыми у марочников. Ювелиры и стеклодувы лехендеров считаются лучшими в Шевалье: в каждое изделие заложены невероятные детали и замысловатые цвета, а их ремесло держится в секрете несколькими богатыми ремесленными семьями. Большое внимание уделяется деталям, отделяющим их от остальных конейкменеров, поскольку они смотрят на них скорее как на соперников, чем на кузенов, несмотря на свою малую численность и более скромные казны.#"
 leegenders_opinion: "Мнение #E лехендеров#!"
 

# Urdermantern
 urdermantern: "Урдермантерны"
 urdermantern_collective_noun: "Урдермантернск"
 urdermantern_prefix: "Урдермантернско"
 urdermantern_desc: "#size:15    Урдермантерны — народ, коренной для обширной сети солончаков, окаймляющих устье, ведущий к Градине, столице Канцелярии. Будучи традиционно консервативным и суеверным народом, враждебность их родины препятствовала масштабному развитию, характерному для прибрежных поселений конейкменеров. Вместо польдеров и дамб, используемых для укрощения водно-болотных угодий, путешествуя по стране урдермантернов, наблюдаешь простой народ, живущий богатствами моря, подобно своим предкам. Из-за этого урдермантерны известны как искусные рыбаки и с ранних лет обучаются искусству мореплавания.\n\nИз-за слаборазвитой экономики своей родины многие урдермантерны в последнее время покидают свои родные болота в поисках экономических возможностей в других местах. На самом деле в великих портовых городах Канцелярии и даже в далеком [Concept('peti_gisredde','Пети-Гисредде')|E] можно встретить урдермантернов, работающих в иностранных доках и на промыслах. Сильные урдермантернские морпехи и матросы также не редкость в далеко плавающих торговых флотах конейкменеров и вояженов. Однако, несмотря на свои традиционные морские навыки, урдермантерны остаются часто забытым примечанием в обществе конейкменеров.#"
 urdermantern_opinion: "Мнение #E урдермантернов#!"
 
