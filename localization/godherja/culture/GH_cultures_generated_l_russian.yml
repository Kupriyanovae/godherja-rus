## Talareg ##
 
# Talareg
 talareg: "Талареги"
 talareg_collective_noun: "Таларегск"
 talareg_prefix: "Таларегск"
 talareg_desc: "#size:15    Конфедерация племен из далекой северной тундры, талареги внушают страх многим как [Glossary( 'молравойриры', 'GH_MOLRAVOJRIR_GLOSS' )] — свирепые, но удивительно хорошо координированные налетчики, украшенные знаками, нанесенными неизвестной синей краской.\n\nГлубоко духовные, они обладают необычным сродством с незримым миром, и многие из их шаманов утверждают, что слышат шепот высшего существа. Из-за своих верований имеющие строго патриархальный уклад, воины таларегов занимают вершину их общества, однако их женщины-[Concept('magi','маги')|E] высоко ценятся как провидицы и известны как знаменитые «снежные ведьмы» севера.#"
 talareg_opinion: "Мнение #E таларегов#!"
 

## Aupagn ##
 
# Zoldagn
 zoldagn: "Золдагны"
 zoldagn_collective_noun: "Золдагнск"
 zoldagn_prefix: "Золдагнско"
 zoldagn_desc: "#size:15    Обитающие глубоко в крутых северных горах, золдагны — скрытное племя, с которым мало кто сталкивается. Их старейшины часто отправляются в духовные путешествия ради достижения просветления — умудренные отшельники являются частым персонажем северных сказок и саг. Золдагны пользуются глубоким уважением за свою мудрость со стороны других горных кланов, и у могущественных вождей часто можно увидеть советника-золдагна.#"
 zoldagn_opinion: "Мнение #E золдагнов#!"
 
# Sarridian
 sarridians: "Сарридианцы"
 sarridians_collective_noun: "Сарридианск"
 sarridians_prefix: "Сарридианско"
 sarridians_desc: "#size:15    Исконные жители Черных Гор, сарридианцы имеют глубокую связь с суровыми пиками, которые зовут своим домом. Покоренные сменявшими друг друга народами, их культура стала гибкой и способной быстро адаптироваться к изменяющимся обстоятельствам. В отличие от многих, покоренных [Concept('aversaria','Аверсарией')|E], сарридианцы всем сердцем приняли [Concept('aversarinas_aagiokratia','Аверсарианская Аагиократию')|E] как свою родную веру; небольшие сельские храмы усеивают холмистый пейзаж, причем большинство из них не возводилось официально имперскими властями. Как и многих рабов, их заставляли работать на шахтах [Concept('bloodcrystal','кровавого кристала')|E] в Черных горах, где они не должны были прожить и месяца; многие бежали в [Concept('chevalie','Шевалье')|E], где стали значительным меньшинством. Их любимое времяпрепровождение — катание на лыжах — стало популярным спортом среди марочнической молодежи.#"
 sarridians_opinion: "Мнение #E сарридианцев#!"
 

# Hrunzag
 hrunzag: "Хрунзаги"
 hrunzag_collective_noun: "Хрунзагск"
 hrunzag_prefix: "Хрунзагско"
 hrunzag_desc: "#size:15    Для хрунзагов честь — это всё, а их общество функционирует в рамках строгой иерархии, основанной не только на личной чести человека, но и на чести его клана. Племя строго соблюдает свои моральные стандарты, а человек, навлекший тяжкое бесчестие, может привести к изгнанию всего своего клана. Хрунзаги ведут подробный учет героических деяний своих предков через песни, причем у самых древних и почитаемых кланов есть эпические песни, полноценное исполнение которых требует нескольких дней.#"
 hrunzag_opinion: "Мнение #E хрунзагов#!"
 
# Krupleg
 krupleg: "Круплеги"
 krupleg_collective_noun: "Круплегск"
 krupleg_prefix: "Круплегско"
 krupleg_desc: "#size:15    Скрытное племя, обитающее на северных Железных хребтах, круплеги известны как своей лютостью в бою, так и использованием [Concept('shimmerstone','мерцающего камня')|E] — редкого [Concept('magic','магического')|E] кристалла, встречающегося только в их горных владениях. Племя щедро использует кристалл в своих различных ритуалах и яростно защищает свои шахты от чужаков, вожделеющих его. Несмотря на свою дикость, круплеги странно гостеприимны к чужакам, считая тех, кто присоединился к ним и отличился в одном из их набегов, кровными сородичами — что делает их членами самого племени.#"
 krupleg_opinion: "Мнение #E круплегов#!"
 

# Dodragn
 dodragn: "Додрагны"
 dodragn_collective_noun: "Додрагнск"
 dodragn_prefix: "Додрагнско"
 dodragn_desc: "#size:15    Лоскутное племя из изгнанников, сломленных и лишенных крова, — [Glossary( 'додрагны', 'GH_DODRAGN_GLOSS' )] служат вторым шансом для тех, кто вступил в конфликт со своими родными кланами. Из-за своего происхождения клан придает мало значения правилам и кодексам поведения, допуская большинство поступков, пока они приносят пользу многим. Единственным исключением из этого является их глубокое уважение к законам гостеприимства, и даже самый потрепанный скиталец может найти приют у очагов додрагнов.#"
 dodragn_history_loc: "Произошли от различных изгнанников [GetCulturePillar('heritage_aupagn').GetName], изгнанных из своих племен"
 dodragn_opinion: "Мнение #E додрагнов#!"
 

# Druhan'daehzag
 druhandaehzag: "Друхан'дэхзагсуры"
 druhandaehzag_collective_noun: "Друхан'дэхзагск"
 druhandaehzag_prefix: "Друхан'дэхзагско"
 druhandaehzag_desc: "#size:15    Друхан'дэхзагуры (этимология давно забыта) более широко известны другим племенам Железных хребтов как «чудаки» из-за своего статуса самых чужеродных из горных кланов. Они считают себя древними слугами «Златокровным» — древних [Concept('aelfir','чернокожих демонов')|E] с золотыми ликами, которые остаются увековеченными в древних статуях, рассеянных по горам.\n\nПлемя считает своей миссией вернуть все остатки Златокровных, веря, что они — единственные люди, достойные их использовать, а их величайшие вожди носят священные золотые лики своих господ. Друхан'дэхзагуры считают всех рабов равными себе по статусу и обязаны дать кров и прокормить любого раба, находящегося на их службе; их судьба часто решается тем, могут ли налетчики позволить себе содержать и кормить их.#"
 druhandaehzag_opinion: "Мнение #E друхан'дэхзагсуров#!"
 

