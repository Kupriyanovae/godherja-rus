# Ixsian
 ixsian: "Иксийцы"
 ixsian_collective_noun: "Иксианск"
 ixsian_prefix: "Иксийско"
 ixsian_desc: "#size:15    Часто называемые в [Concept('aversaria','аверсарианских')|E] поэмах «народом, затерянным во времени», иксийцы — это [Concept('shatteredisles','островитяне')|E] ранее утерянного [Glossary('полиса','GH_POLISOCRACY_GLOSS')] [GetTitleByKey('b_ixs').GetNameNoTier]. Во время [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E] избранное сословие [Concept('magi','магов')|E] города (Совет Тринадцати) отчаялось из-за гибели своего последнего [Concept('dragons','дракона')|E], Тусинарикса. После того как [GetTitleByKey('b_carox').GetNameNoTier] и его знаменитый Диархат облаченных в рунические доспехи деспотов сгорели в драконьем огне, был спешно проведен [Concept('gh_ritual','ритуал')|E], чтобы укрыть Икс и его города-сателлиты от внешнего мира.\n\nОднако ритуал вместо этого вызвал огромную волну, прокатившуюся по островам, и когда вода отступила, все следы города и его жителей исчезли.\n\nВ VII веке огромная волна снова накрыла острова и смела новые поселения, отстроенные с тех пор, но как только воды сошли, Икс и его жители вернулись так, словно прошло меньше столетия. Хотя [Concept('ixsian_war','Иксианская война')|E] едва не уничтожила возвращенный город, иксийцы давно его отстроили. Городские архивы ценятся за хранящиеся в них сокровища утерянной литературы и артефактов, но некоторые говорят, что древний ритуал до сих пор проклинает жителей.#"
 ixsian_opinion: "Мнение #E иксийцев#!"
 
# Abdêxorn
 abdexorn: "Абдексорны"
 abdexorn_collective_noun: "Абдексорнск"
 abdexorn_prefix: "Абдексорнско"
 abdexorn_desc: "#size:15    Абдексорны родились в пламени войны. В древние дни [Glossary('полисократии','GH_POLISOCRACY_GLOSS')] их корабли представляли собой почти постоянную угрозу пиратства на всех [Concept('shatteredisles','Островах')|E]. Поскольку каждый вождь стремился превзойти героев прошлого, абдексорны ставили силу превыше всех остальных добродетелей.\n\nПо мере того как [Concept('aversaria','Аверсарианская Аавтократия')|E] затмевала их, а их пиратство заставляло врагов объединяться для отпора, абдексорны начали медленный процесс уподобления своим аверсарианским врагам. Их древние герои превратились в могущественных [Concept('magi','магам')|E], а сила крови стала столь же жизненно важной, как и любая физическая характеристика.\n\nОднако, несмотря на аверсарианские внешние атрибуты, абдексорны никогда не забывали корни своих традиций и одержимы войной так, как мало кто на Островах.#"
 abdexorn_opinion: "Мнение #E абдексорнов#!"
 

# Symvolix
 symvolix: "Символиксы"
 symvolix_collective_noun: "Символиксск"
 symvolix_prefix: "Символиксско"
 symvolix_desc: "#size:15    Символиксы — это древняя ветвь [Concept('aversaria','аверсарианской')|E] культуры, зародившаяся на восточных [Concept('shatteredisles','Островах')|E] Башенного моря, наиболее примечательная сохранением множества архаичных обычаев и социальных норм, давно вымерших у их дальних сородичей на материке.\n\nИх базовой политической единицей остается [Glossary('полис','GH_POLISOCRACY_GLOSS')] доаверсарианских времен — их древние институты продолжают действовать, а их политические системы представляют собой пеструю смесь олигархий, демократий, автократий, а также редких гибридов и исключений. Из-за крайне замкнутого и сопернического характера этой социальной системы чужакам не доверяют, а вражда между городами иногда восходит к временам еще до основания Империи.\n\nВ значительной степени утратив былое античное величие, легенды символиксов с тоской вспоминают свой золотой век — причем эти сказания зачастую приобретают совершенно фантастический и утопический характер.#"
 symvolix_opinion: "Мнение #E символиксов#!"
 
