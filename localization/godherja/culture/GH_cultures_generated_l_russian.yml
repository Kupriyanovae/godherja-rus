 enisaloi_desc: "#size:15    Энисалои — одна из многих культур крехеджадов, сформировавшаяся в результате слияния множества народов Расколотых островов, поселившихся на архипелаге после [Concept('war_of_all_islands','Войны всех островов')|E]. Их [Concept('enisaloi_heritage_customs','увлечение своими предками')|E] давно славится по всему Морю Империй.#"
