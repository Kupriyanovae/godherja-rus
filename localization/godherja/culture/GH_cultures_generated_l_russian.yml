# Entrepexatic
 entrepexatic: "Энтрепексатики"
 entrepexatic_collective_noun: "Энтрепексатикск"
 entrepexatic_prefix: "Энтрепексатико"
 entrepexatic_desc: "#size:15    Энтрепексатикские владения — [Concept('aversaria','аверсарианский')|E] термин для богатых и могущественных торговых городов Каширията — уже считались обособленными и далекими по сравнению с их западными родичами.\n\nРазрыв с остальной имперской культурой ускорился из-за [Concept('imperial_civil_war','Имперской гражданской войны')|E] и [Concept('blue_robe_revolt','Восстания синих мантий')|E], а с падением [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )] во время [Concept('frodbrokna','Фродброкны')|E] и последовавшей за ней [Concept('ashen_aautokrata_fix', 'Пепельной аавтократией')|E] этот раскол окончательно закрепился. Упразднение Магистрата Восточной реки в 1269 И.С. формализовало разрыв, и с тех пор энтрепексатикские лорды гордятся своим «просвещенным космополитизмом» в противоположность варварству «$aauto_maklea_link$ маклейского#! ига».#"
 entrepexatic_opinion: "Мнение #E энтрепексатиков#!"
 
# Chalóxaïkas
 chaloxaikas: "Халоксаики"
 chaloxaikas_collective_noun: "Халоксаикск"
 chaloxaikas_prefix: "Халоксаико"
 chaloxaikas_desc: "#size:15    Искаженное обозначение «простолюдинов» в восточных диалектах [Concept('aversaria','аверсарианского')|E] языка, халоксаики возникли из плавильного котла культур, бежавших на восток во время [Concept('white_pass_war','Войны Белого перевала')|E]. Имперцы низшего класса, освобожденные рабы и местные айронойцы — все они оказались в новом обществе, объединенном войной против [Concept('sjalvolki_migration', 'армий переселенцев')|E] и боготворением Гекаэды. Объявление Гекаэдой единой кастовой группы для низших классов в 1285 И.С. и ее формальная отмена [Concept('aversarian_slavery', 'Рабства тела')|E] в целом считаются началом формирования отдельной халоксаикской идентичности, ставшей впоследствии одной из главных опор анотерианского общества.#"
 chaloxaikas_history_loc: "Произошли от смешения беженцев низшего класса, рабов и местных жителей из [Concept('western_aironoi_biozone','Западного Айроноя')|E], бежавших на восток во время [Concept('white_pass_war','Войны Белого перевала')|E]."
 chaloxaikas_opinion: "Мнение #E халоксаиков#!"
 
# Aironaios
 old_aironoian: "Айронеосы"
 old_aironoian_collective_noun: "Айронеоск"
 old_aironoian_prefix: "Айронеоско"
 old_aironoian_desc: "#size:15    В десятилетия, последовавшие за уничтожением [GetTitleByKey('c_asiupoli').GetNameNoTier], восточные аверсарианцы, занимавшие окружающие его земли, столкнулись с междоусобицами и хаосом. Объединенные под знаменем Гекаэды и LXI Легиона «Анотерион» и вынужденные мигрировать после окончания [Concept('white_pass_war','Войны Белого перевала')|E], народы Западного Айроноя закалились. Вдохновленная великими победами Гекаэды и ее легендарной встречей с Сокрушителем Ведьм, сформировавшаяся идентичность айронеосов стала почитать Гекаэду и ее могучий легион.#"
 old_aironoian_opinion: "Мнение #E айронеосов#!"
 
