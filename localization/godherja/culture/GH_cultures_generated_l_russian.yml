# Serbarish
 serbarish: "Сербариши"
 serbarish_collective_noun: "Сербаришск"
 serbarish_prefix: "Сербаришско"
 serbarish_desc: "#size:15    Когда зелкавани попытались подчинить себе энтрепексатикские города Сервакса в 1284 И.С., мечты о том, чтобы наконец очистить великие города от [Concept('aversaria','аверсарианской')|E] скверны, пошли прахом: у ворот их встретили не защитники на стенах, а ликующие толпы у открытых ворот. Великие восстания рабов и крестьян, охватившие города, вылились в неистовый открытый бунт с прибытием зелкавани, а те имперские аристократы, что не бежали за границу, встретили войска зелкавани, распятые сотнями вдоль дорог и стен городов своими слугами-[Glossary( 'зеквотами', 'GH_ZEKVOT_GLOSS' )].\n\nХотя многие зелкаванские вожди считали зеквотов — зараженных имперской верой и всё еще живших в общинах со множеством [Glossary( 'энмексотов', 'GH_ENMEXOT_GLOSS' )] и аверсарианцев низшего класса — чуждыми по своей природе, богатство городов, численность их населения (намного превышающая отправленные на их покорение армии) и их энтузиазм по отношению к зелкаванской культуре привели к тому, что города добровольно подчинились зелкаванским правителям, под властью которых они пользовались высокой степенью автономии. С тех пор города сербаришей стали плавильным котлом зеквотских и зелкаванских обычаев, а также очагом культурных и технологических трансформаций и развития.#"
 serbarish_opinion: "Мнение #E сербаришей#!"
 

## Aversarian ##
 
# Western Aversarian
 westernimperial: "Западные аверсарианцы"
 westernimperial_collective_noun: "Этепезейск"
 westernimperial_prefix: "Этепезейско"
 westernimperial_desc: "#size:15    Западные [Concept('aversaria','аверсарианцы')|E] представляют собой коренных жителей Этепезеи. Считаясь родоначальниками аверсарианской культуры, несмотря на ее происхождение с Островов, западные имперцы чрезвычайно гордятся своим наследием и стремятся заявить о своих сильных родословных через регулярные демонстрации силы. Это довольно угрюмый и суровый народ, но он пользуется высокой репутацией как самый «царственный» и «имперский».\n\nНесмотря на свое богатство, они не считаются столь же развращенными роскошью, как другие аверсарианские культуры, предпочитая заявлять о своих богатствах через репутацию, а не через пышные демонстрации роскоши. Традиционно ассоциируемые с красным, черным и золотым цветами, западные аверсарианцы в основном известны своим искуссным политиканством, твердым правлением, могущественной магией и тяжелой пехотой, которая со временем составила основу аверсарианских легионов. Многие аверсарианские ученые считают культуру западных имперцев креольской смесью бесчисленных городов-государств, которые в конечном итоге объединились в [Glossary( 'Аавтократию', 'GH_AAUTOKRATA_GLOSS' )], и современной-прародительницей всех остальных имперских культур.#"
 westernimperial_opinion: "Мнение #E западных аверсарианцев#!"
 
# Southern Aversarian
 southernimperial: "Южные аверсарианцы"
 southernimperial_collective_noun: "Опахасийск"
 southernimperial_prefix: "Опахасийско"
 southernimperial_desc: "#size:15    Южные [Concept('aversaria','аверсарианцы')|E] — это аверсарианцы, коренные жители бывшего космополитичного центра Опахасии. Хотя когда-то этот регион был очень богат благодаря сокровищам своей родины и контролю над торговлей, возвышение Айроноя и [Concept('chaos_of_the_seventh_century','хаос седьмого века')|E] опустошили провинцию, вызвав депопуляцию, голод и войну, а также утрату южной торговли. Несмотря на это, знать по-прежнему известна чрезмерным выставлением богатства напоказ; голодающие рабы и скот, пасущийся на полубесплодных полях, — не редкое зрелище по пути на один из многочисленных пиров в позолоченных залах знати.\n\nПоскольку правительство Опахасии происходит от древнего Храма Горного Солнца, то же относится и к атрибутам южноаверсарианской культуры. Южане носят религиозные титулы, которые были распространены тысячу лет назад, и известны проявлениями благочестия, несмотря на свою развращенность роскошью. Цвета Опахасии — белый, золотой и оранжевый, основанные на цветах древнего Горного Солнца.#"
 southernimperial_opinion: "Мнение #E южных аверсарианцев#!"
 
# Central Aversarian
 centralimperial: "Центральные аверсарианцы"
 centralimperial_collective_noun: "Малькойск"
 centralimperial_prefix: "Малькойско"
 centralimperial_desc: "#size:15    [Concept('aversaria','Аверсарианцев')|E] из Малькои часто называют центральными аверсарианцами. Считаясь богатым народом, они не отличаются особой гордостью или стремлением к современности, предпочитая консервативную политику и одежду по сравнению со многими своими соотечественниками. Известные управлением огромными рабовладельческими поместьями и фабриками Малькои, они носят простую одежду и доспехи из неокрашенного железа, а живут в усадьбах, выполняющих роль фортов на случай восстаний рабов. Центральные аверсарианцы считаются честным народом, обычно отвергающим интриги и уловки как «тактики рабов» и предпочитающим прямые и честные сделки.\n\nРедко склонные к демонстрации богатства и власти, они тем не менее внушают страх своим железным правлением, а дворяне регулярно носят железные цепи на поясе или через плечо, либо украшают ими доспехи в качестве безмолвного знака своим врагам. Цвета Малькои — синий, серый, черный и белый.#"
 centralimperial_opinion: "Мнение #E центральных аверсарианцев#!"
 
# Northern Aversarian
 northernimperial: "Северные аверсарианцы"
 northernimperial_collective_noun: "Калатипсомийск"
 northernimperial_prefix: "Калатипсомийско"
 northernimperial_desc: "#size:15    Северные [Concept('aversaria','аверсарианцы')|E] — это культура, рожденная в суровых колониях [Concept('kalathipsomi_province','Калатипсоми')|E]. Более практичный взгляд на жизнь позволил им стать проницательными торговцами и отличными надсмотрщиками, создавшими в Калатипсоми огромные лесопилки, шахты и фермы. Первоначальная суровость региона привела к формированию более практичной [Concept('kalathipsomi_fashion','моды')|E], не столь экстравагантной, как у аверсарианцев на юге.#"
 northernimperial_opinion: "Мнение #E северных аверсарианцев#!"
 
# Eastern Aversarian
 easternimperial: "Восточные аверсарианцы"
 easternimperial_collective_noun: "Айронойск"
 easternimperial_prefix: "Айронойско"
 easternimperial_desc: "#size:15    Восточные [Concept('aversaria','аверсарианцы')|E] — это аверсарианцы, родившиеся в восточных городах Айроноя. Технически это самая маленькая из аверсарианских культур из-за того, что большая часть Айроноя находится под властью степных кланов и местных народов, однако именно они представляли самых богатых и могущественных людей Империи со времен возвышения Айроноя после [Concept('chaos_of_the_seventh_century','хаоса седьмого века')|E].\n\nНевероятно богатые благодаря возвышению [GetTitleByKey('c_asiupoli').GetNameNoTier] как торгового центра Аверсарии и всего мира, а также назначению города столицей [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )], восточные аверсарианцы известны своими чрезвычайно пышными демонстрациями богатства. К X веку большая часть моды в Аверсарии продиктовывалась не-восточной знатью, пытавшейся угнаться за стремительно меняющейся и часто безвкусной придворной одеждой востока, а знать Айроноя известна тем, что регулярно вызывала теологические и культурные шоки своими выходками, призванными ошеломить и заставить всю Аверсарию говорить о них. Восточные аверсарианцы традиционно ассоциируются с розовым, пурпурным, бирюзовым, золотым и белым цветами.#"
 easternimperial_opinion: "Мнение #E восточных аверсарианцев#!"
 
# Outer Aversarian
 outer_aversarian: "Внешние аверсарианцы"
 outer_aversarian_collective_noun: "Катраддийск"
 outer_aversarian_prefix: "Катраддийско"
 outer_aversarian_desc: "#size:15    Потомки [Concept('aversaria','аверсарианских')|E] колонистов и многочисленных легионов, ушедших на покой в этих землях после [Concept('chaos_of_the_seventh_century','Картaраддских войн')|E], имперцы того региона, который станет известен как Катраддия, сколотили огромное состояние благодаря изобилию плодородных земель вдоль реки Эрамасик в центре губернаторства.\n\nБудучи богатой, могущественной и неотъемлемой частью продовольственного снабжения и торговой сети Империи, аристократия самого молодого губернаторства [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )] тем не менее бесконечно раздражалось из-за [Concept('katraddia_province','высокомерия')|E] своих южных родичей, которые традиционно считали всех имперцев севера «[Glossary( 'Апокиакасами', 'GH_APOKIAKAS_GLOSS' )]». Создание Гобелена Легионов в Чаграддиксе стало первым случаем, когда «колонисты» были признаны за свои художественные заслуги, что привело к их признанию «равными» другим основным культурам Империи.#"
 outer_aversarian_history_loc: "Сформировались из [Concept('aversaria','аверсарианских')|E] поселенцев вдоль долины реки Эрамасик в 871 И.С."
 outer_aversarian_opinion: "Мнение #E внешних аверсарианцев#!"
 
# Imperial Islander
 imperialislander: "Имперские островитянине"
 imperialislander_collective_noun: "Имперско-островитянск"
 imperialislander_prefix: "Имперско-островитянско"
 imperialislander_desc: "#size:15    Жители [Concept('imperial_isle_biozone','Имперского острова')|E] — это последние чистые остатки времен, когда кровь древней [Concept('aversaria','Аверсарии')|E] еще не была разбавлена по всему материку (по крайней мере, по их собственному мнению). У них сложилось своеобразное одностороннее соперничество со своими материковыми сородичами: но пока Этепезея разрасталась, чтобы доминировать в Аверсарии культурно на протяжении большей части своей истории, островитяне замкнулись в себе. Их культура — это культура руин и музеев, исполнителей, разыгрывающих якобы древние ритуалы для платящих клиентов со всей империи.\n\nТрадиционные цвета, ассоциирующиеся с островитянами, — пурпурный, синий и красный.#"
 imperialislander_opinion: "Мнение #E имперских островитян#!"
 
# Blackfort Imperial
 apokiakas: "Чернокрепостные имперцы"
 apokiakas_collective_noun: "Апокиакансск"
 apokiakas_prefix: "Апокиакасско"
 apokiakas_desc: "#size:15    [Glossary( 'Апокиакасы', 'GH_APOKIAKAS_GLOSS' )] — это термин, даваемый любому [Concept('aversaria','аверсарианцу')|E], происходящему из северо-восточных территорий Катраддии. Происходя в основном от калатипсомийских колонистов, жизнь на суровом пограничье заставила их развить стоическое и утилитарное мировоззрение, отвергающее пышность в пользу холодной практичности. Некоторые пошли еще [Concept('katraddia_tribal_mixing','дальше')|E], в результате чего соотечественники-аверсарианцы стали [Concept('katraddia_province','невысокого мнения о них')|E].#"
 apokiakas_opinion: "Мнение #E чернокрепостных имперцев#!"
 
# Eastern Apokiakas
 eastern_apokiakas: "Восточные апокиакасы"
 eastern_apokiakas_collective_noun: "Апокиакансск"
 eastern_apokiakas_prefix: "Апокиакасско"
 eastern_apokiakas_opinion: "Мнение #E восточных апокиакасов#!"
 

# Skorikiakas
 skorikiakas: "Скорикиакасы"
 skorikiakas_collective_noun: "Скорикиакасск"
 skorikiakas_prefix: "Скорикиакасско"
 skorikiakas_desc: "#size:15    Считающиеся последними живыми остатками [Concept('kartharadd','Картараддского Империума')|E], [Glossary( 'скорикиакасы', 'GH_SKORIKIAKAS_GLOSS' )] происходят от смешения картараддских поселенцев и местных [Concept('aversaria','аверсарианцев')|E] в оккупированном картараддами Малькое во время [Concept('chaos_of_the_seventh_century','хаоса седьмого века')|E]. Однако принципиально важно то, что они происходят от тех, кто присоединился к сопротивлению против Картaрадда, что спасло их от [Concept('night_of_the_bleeding_moon','участи')|E], постигшей их лояльных Империуму сородичей, и последующей имперской чистки. Предки современных скорикиакасов поспешили подчеркнуть аверсарианскую сторону своей крови, а попытки их аристократии откреститься от мертвой культуры, которой они никогда не знали, привели к тому, что они стали одной из самых ярых проимперских и консервативных фракций в Империи. Несмотря на гордость за свое аверсарианское наследие, они тем не менее сохраняют несколько традиций и обычаев Империума, особенно в области металлообработки.#"
 skorikiakas_history_loc: "Произошли от смешения [Concept('kartharadd','картараддских')|E] поселенцев и солдат с местными [Concept('aversaria','аверсарианцами')|E] во время [Concept('chaos_of_the_seventh_century','Картараддских войн')|E]"
 skorikiakas_opinion: "Мнение #E скорикиакасов#!"
 
# Phalonix
 phalonix: "Фалониксы"
 phalonix_collective_noun: "Фалониксийск"
 phalonix_prefix: "Фалониксийско"
 phalonix_desc: "#size:15    Фалониксы берут свое название от города [Glossary( 'Фалоноксонполя', 'GH_PHALONOXONPOLI_GLOSS' )], первого крупного малькойского поселения в современной Катраддии. Ценность господствующего положения города на Эрамасике была очевидна сразу, и он стал стремительно расти, вызвав мощный приток [Concept('aversaria','аверсарианских')|E] колонистов в [Concept('continental_interior_biozone','внутренние области континента')|E]. Вскоре эти колонисты — как утверждается — вторглись в границы неизвестного тогда [Concept('kartharadd','Картараддского Империума')|E], что спровоцировало [Concept('chaos_of_the_seventh_century','Картараддские войны')|E].\n\nХотя фалониксы заявляют о своем происхождении от этих колонистов, в действительности аверсарианское население к северу от Малькои было уничтожено, когда картараддцы завоевали этот регион (и сровняли с землей Фалоноксонполь) в 645 И.С., а выжившие в этом регионе были включены в картараддскую систему рабства и погибли в [Concept('night_of_the_bleeding_moon','Ночь Кровавой Луны')|E]. Вопреки фольклору, фалониксы происходят в основном от наплыва колонистов и легионеров, получивших наделы земли после аверсарианской победы в войнах.#"
 phalonix_opinion: "Мнение #E фалониксов#!"
 
# Redrunner
 redrunner: "Красноходы"
 redrunner_collective_noun: "Красноходск"
 redrunner_prefix: "Красноходско"
 redrunner_desc: "#size:15    В юго-восточном углу Айроноя земля меняет свои обычные оттенки на глубокий красный. Регион изрезают каньоны, а [Concept('magi','маги')|E] сообщают о негативных эманациях, исходящих оттуда. Несмотря на это, дети [Concept('aversaria','Аверсарии')|E] все же заселили эту землю — или, по крайней мере, ее часть. Вдоль побережья цепочка укрепленных анклавов укрывает народ, известный как красноходы, получивший свое название из-за важной роли в торговле, связывающей таинственные земли на западе с Аверсарией.\n\nКрасноходы — пожалуй, одна из самых чужеродных аверсарианских культур, и именно так их часто воспринимают собратья по всей империи. Неспособность колонизировать внутренние территории оставила им лишь ряд изолированных крепостей и, что интересно, создала одну из самых социально мобильных групп населения в империи. Поскольку их экономика почти полностью строится вокруг торговли, те, кто способен пробить себе дорогу наверх, могут регулярно ломать социальные устои. Красноходы также суеверны и боятся каньонов, из которых, как говорят, никто не возвращается.#"
 redrunner_opinion: "Мнение #E красноходов#!"
 
# Aversarian Islander
 islander: "Аверсарианский островитянине"
 islander_collective_noun: "Аверсарианско-островитянск"
 islander_prefix: "Аверсарианско-островитянско"
 islander_desc: "#size:15    Ученая магистр Архея из Книдеры в своих знаменитых сатирических трудах когда-то называла [Concept('aversaria','аверсарианских')|E] островитян «скромными, как опахасийцы, развращенными роскошью, как малькойцы, цивилизованными, как катраддийцы, и аверсарианцами, как катуни». Смесь политических междоусобиц и — особенно с течением времени, когда ядро Аверсарии переместилось с Имперского острова в Этепезею — запустения привела к тому, что [Concept('shatteredisles','Острова')|E] Аверсарии стали одним из самых заброшенных и охваченных нищетой регионов [Concept('aeras','Эраса')|E]. Аверсарианские островитяне часто настолько брошены на произвол судьбы, что оказываются в рабстве из-за набегов работорговцев, похищений и долгов, несмотря на свое гражданство, — преступление, караемое в Аверсарии смертной казнью только для тех, кто на нем попался.\n\nНесмотря на это, островитяне почти поголовно являются одними из самых гордых людей в мире. Известно, что каждый остров тщательно отслеживает свою местную историю и тех, кого считает местными героями, а такие незначительные события, как постройка нового амбара, часто приводят к повсеместным празднованиям и занесению в исторические хроники. Ибо когда весь мир забыл о вас и вам приходится бороться просто за выживание, Острова показывают, что вы часто можете выжить только благодаря солидарности ближнего своего.#"
 islander_opinion: "Мнение #E аверсарианских островитян#!"
 
# Central Aversarian Islander
 centralislander: "Центрально-аверсарианские островитянине"
 centralislander_collective_noun: "Центрально-аверсарианско островитянск"
 centralislander_prefix: "Центрально-аверсарианско островитянско"
 centralislander_desc: "#size:15    Населяющие скалистые [Concept('shatteredisles','Острова')|E], разделяющие Этепезею и Опахасию, центральные островитяне ведут суровую жизнь на обнищавших окраинах того, что большинство считает цивилизацией. Несмотря на свою культурную неизвестность, центральных островитян можно встретить в большинстве [Concept('aversaria','аверсарианских')|E] прибрежных городов и деревень, где они продают или отдают в виде десятины всевозможную рыбу, угрей и крабов, пойманных в кишащих жизнью водах Моря Империй.\n\nУ них репутация холодных и недружелюбных к чужакам людей, но к своим собратьям-центральным островитянам они обращают совсем иное лицо, великодушное вплоть до самопожертвования. Выжившие в кораблекрушениях нередко усыновляются целыми семьями центральных островитян и считаются равными, если смогут доказать свою ценность. Для тех, кто ищет счастья в других краях, единственным надежным способом вырваться из бедности остается служба в Морских легионах, ряды которых каждый год пополняются юношами, ищущими чего угодно, только не жизни, проведенной за починкой сетей и ловушек для крабов, — до такой степени, что их ряды почти полностью состоят из молодых островитян.#"
 centralislander_opinion: "Мнение #E центрально-аверсарианских островитян#!"
 
