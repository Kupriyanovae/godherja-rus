## Cave Tribe ##
 
# Carkarain
 carkarain: "Каркараины"
 carkarain_collective_noun: "Каркараинск"
 carkarain_prefix: "Каркараинско"
 carkarain_desc: "#size:15    Каркараины устраивают свои дома глубоко в горных пещерах и представляют собой замкнутый и ревниво охраняющий свою территорию люд. Говорят, они боятся света, так как сменявшие друг друга поколения в беспросветных тоннелях приведи к тому, что их глаза помутнели и ослепли от неиспользования. Они поедают друг друга и любых глупцов, осмелившихся спуститься в тесный, удушливый сумрак. Пренебрежительные [Concept('aversaria','аверсарианские')|E] ученые говорят, что они — потомки особенно опустившейся группы эуликайнских рабов, изгнанных в подземный лабиринт. Другие возводят их происхождение к историям о воинственных племенах, живших в тоннелях [Concept('mayikrata','Маийкраты')|E] и описанных [Concept('magi','магами')|E], впервые измерившими их глубины. Некоторые суеверные глупцы даже утверждают, что они были там со времен сотворения мира.#"
 carkarain_opinion: "Мнение #E каркараинов#!"
 

# Karannin
 karannin: "Караннины"
 karannin_collective_noun: "Караннинск"
 karannin_prefix: "Караннинско"
 karannin_desc: "#size:15    Клык, язык и тень: вот столпы караннинов. Вечно ища своего мертвого бога, караннины совершают самоубийственное паломничество к месту его упокоения в конце своих жизней. Больные и старики добровольно шагают в его ауру убивающей магии, а их тела уволакивают, чтобы быть съеденными их сородичами. Ибо плоть мертвого бога — наивысшая награда, и считается, что сраженные его божественностью содержат в себе искру священной искры Карана.#"
 karannin_opinion: "Мнение #E караннинов#!"
 

# Aeulikain
 aeulikain: "Эуликайны"
 aeulikain_collective_noun: "Эуликайнск"
 aeulikain_prefix: "Эуликайнско"
 aeulikain_desc: "#size:15    Для многих культур вкус воздуха, музыка воды и поцелуй солнечного света служат опорой — но не для эуликайнов, тех, кто обитает в тенях веками, будучи загнанным в лабиринт с незапамятных времен. Горные духи, оксилай, приняли их в свои пещерные пасти, навсегда поглотив в темноте Майикраты. Поглощенные таким образом, эуликайн переродились. Чтобы почтить пожравших их оксилаев, они поедают мертвых, возвращая их тела — их силу — обратно в племя, чтобы жить вечно в вечной тени.#"
 aeulikain_opinion: "Мнение #E эуликайнов#!"
 

# Penetworin
 penetworin: "Пенетворины"
 penetworin_collective_noun: "Пенетворинск"
 penetworin_prefix: "Пенетворинско"
 penetworin_desc: "#size:15    Культура, рожденная необходимостью, пенетворины происходят от легионов рабов, которых [Concept('aversaria', 'аверсарианцы')|E] привели с поверхности для ухода за [Concept('mayikrata','Маийкратой')|E]. Быть пенетворином — значит быть ребенком сотен племен, сведенных к бесправному скоту.\n\nПосле своего освобождения божественным аксолотлем Этвотосом пенетворины поклялись больше никогда не покоряться рабству и не брать рабов сами.\n\nХотя пещерный народ редко известен за пределами Майикраты, кухня пенетворинов славится богатым разнообразием сыров, а головки «пещерного сыра» продаются далеко за пределами темных залов лабиринта.#"
 penetworin_opinion: "Мнение #E пенетворинов#!"
 

# Nevtanei
 nevtanei: "Невтанеи"
 nevtanei_collective_noun: "Невтанейск"
 nevtanei_prefix: "Невтанейско"
 nevtanei_opinion: "Мнение #E невтанеев#!"
 

# Shadowstepper
 shadowstepper: "Тенеходцы"
 shadowstepper_collective_noun: "Тенеходск"
 shadowstepper_prefix: "Тенеходско"
 shadowstepper_desc: "#size:15    Спросите тенеходца, откуда пришел его народ, и он ответит вам без колебаний и обмана, что они пришли со стены над вашей головой. Они больше ничего не помнят. Каждый тенеходец, достигший совершеннолетия, подчиняется выжиганию всей своей прожитой памяти с помощью [Concept('magic','дара Теней')|E].\n\nЧто у них есть взамен — так это стена. Тенеходцы передвигаются по потолкам и отвесным камням, как научила их королева-паучиха, бесшумно спускаясь на нарушителей и исчезая вверху прежде, чем успеют поднять факел; те, кто сражался с ними, говорят не столько о битвах, сколько об утрате людей по одному в темноте. Их племена ничего не хотят от поверхности и еще меньше от соседей, не принимают послов и не соблюдают договоров, ибо тенеходец, давший клятву до очищения, по их собственным понятиям — человек, которого больше не существует.#"
 shadowstepper_opinion: "Мнение #E тенеходцев#!"
 

# Beaconite
 beaconite: "Маячники"
 beaconite_collective_noun: "Маячниковск"
 beaconite_prefix: "Маячниковск"
 beaconite_desc: "#size:15    Никто не планировал Тусклый маяк. Когда город Неветексон выпал из мира и очутился посреди чужой войны, все могло бы этим и закончиться, если бы [Concept('aversaria','имперцы')|E], [Concept('kartharadd','картараддцы')|E] и подземные племена не заключили мир. Маячники — это то, что выросло потом на руинах: не народ, происходящий от одного корня, а население договора, собравшееся под светом, который никто под землей и не думал возводить.\n\nИх характер вытекает из основания. Мирный договор был документом, и с тех пор Тусклым маяком управляют документы: реестры племен и обрядов, должности, распределенные так, чтобы потомки ни одного из подписантов не могли вытеснить других, писцы, способные наизусть зачитать, чьи святые дни закрывают те или иные рынки. Веры и языки смешиваются в кварталах Тусклого маяка более полно, чем где-либо в [Concept('mayikrata','подземном мире')|E].#"
 beaconite_opinion: "Мнение #E маячников#!"
 

# Zirrzirrum
 zirrzirrum: "Зиррзиррумзы"
 zirrzirrum_collective_noun: "Зиррзиррумск"
 zirrzirrum_prefix: "Зиррзиррумско"
 zirrzirrum_desc: "#size:15    Зиррзиррумзы хранят самую древнюю мореходную традицию, известную любому народу [Concept('aeras','Эраса')|E], и она ни разу не видела солнца. Их Великая Книга Первых гласит, что их предки бежали из родины под названием Утуггуи, опустошенной стальными армиями с огненными посохами, и спаслись через портал в воды под миром — где их научили строить первые лодки и даровали плавники и жабры. С тех пор они плавают по этим темным водам, верхом на великих чешуйчатых карпах, рожденных Рыбой-Матерью, причаливая к поселениям, которые видят корпус зиррзиррумов, возможно, дважды за жизнь.\n\nЛюди с поверхности, встречающие их, ждут легендарных рыболюдей, а находят вместо этого самый щедрый народ в [Concept('mayikrata','подземном мире')|E]. Экипаж зиррзиррумов накормит незнакомца прежде, чем поест сам, а их капитаны с искренним восторгом собирают чужих богов, чужие слова и чужие рецепты. Ранг на их судах определяется компетентностью и открыто оспаривается; рулевому может возразить каждый, кто приведёт лучший аргумент. Они просят лишь о том, чтобы гости держали свои лампы приглушенными.#"
 zirrzirrum_opinion: "Мнение #E зиррзиррумов#!"
 

# Kromlandar
 kromlandar: "Кромландары"
 kromlandar_collective_noun: "Кромландарск"
 kromlandar_prefix: "Кромландарско"
 kromlandar_desc: "#size:15    Кромландары могут вообще не принадлежать этой эпохе. Они считают себя детьми древних королей, которые загнали [Concept('aelfir','экаггиров')|E] под мир во время [Concept('prehistory','Войн Богов')|E], а затем повели свои племена следом за ними, чтобы закончить дело. Какое-то время их короли правили всем [Concept('mayikrata','подземным миром')|E]. Затем случилось [Concept('twist_of_the_tunnels','Искажение туннелей')|E]. В одно мгновение каменные постройки их империи рассыпались в пыль, а тоннели перекрутились в незнакомых направлениях, и их жрецы с тех пор утверждают, что выжившие были выброшены на вечности вперед из своего времени и застряли в будущем, которое никогда не должно было их вмещать.\n\nМечта обратить вспять Искажение пережила любую память о том, как это сделать. Положение зарабатывается на бойцовских аренах и в войнах за тоннели, а сын вождя с непроверенной рукой стоит ниже безымянного ветерана тридцати кампаний. К их старейшинам обращаются как к живым архивам каждой войны со времен Неистекающих Кровью, сажают их ближе всего к огню и подают им первым на каждом пиру. Они сражаются с теневыми зверями и слепыми чудовищами бездны, а в долгие периоды, когда ни тех, ни других не найти, они сражаются друг с другом.#"
 kromlandar_opinion: "Мнение #E кромландаров#!"
 

## Fogeater ##
 
# Fogeater
 fog_eaters: "Пожиратели тумана"
 fog_eaters_collective_noun: "Пожирателе-туманск"
 fog_eaters_prefix: "Пожирателе-туманско"
 fog_eaters_desc: "#size:15    Пожиратели тумана — это [Concept('mutations','мутировавшие')|E] остатки людей, оказавшихся в ловушке в [Concept('foglands','Туманных земель')|E] после [Concept('frodbrokna','Фродброкны')|E]. Можно ли их все еще считать людьми, мутировавшими людьми или формой [Concept('fogbeasts','Туманных тварей')|E], остается предметом жарких споров, и о особенностях их «культуры» или верований известно мало.\n\nИзвестно лишь то, что когда-то они были цепочкой племен, рассеянных по дальнему северо-востоку, и в отличие от большинства, кто погиб, оказавшись в ловушке внутри [Concept('the_fog','Тумана')|E], они вместо этого приспособились к нему и превратились во что-то иное. Теперь они единодушно поклоняются тому, что называют «Туманной Матерью» — олицетворению тумана, которая, как они верят, говорит с ними через него.\n\nУ самих пожирателей тумана мало что осталось от человеческого разума: обычно они представляют собой не более чем лепечущие останки, сохранившие лишь достаточно разума, чтобы совершать набеги и устраивать засады из туманных земель, а также убивать себя при пленении. Физически они обладают неестественно бледной кожей, сквозь которую видны многие из их вен, а иногда и органы, и неестественно веретенообразными, непропорциональными конечностями. Их глаза также сохраняют множество цветов, не встречающихся у других людей, включая красный, пурпурный, белый и черный. Распространена слепота, хотя они кажутся неестественно иммунными к большинству известных болезней и испытывают гораздо меньшую потребность в еде или воде по сравнению с людьми. Несмотря на это, крайне распространен каннибализм, каким-то образом связанный с их странными религиозными верованиями.#"
 fog_eaters_opinion: "Мнение #E пожирателей тумана#!"
 

## Redlander ##
 
# Redlander
 redlander: "Красноземельцы"
 redlander_collective_noun: "Красноземельск"
 redlander_prefix: "Красноземельско"
 redlander_desc: "#size:15    Просторы Красных земель населены множеством различных культов, чьи загадочные члены кажутся не похожими на обычных людей. Покрытые тканью, чтобы защититься от солнца, и приспособленные к странным и враждебным условиям своей родины, красноземельцы почти совершенно неизвестны большинству чужаков.\n\nО них слагают вымышленные истории, рассказывающие о народе, сумевшем выжить в одном из самых жестоких регионов [Concept('aeras','Эраса')|E] благодаря жестокости, стойкости и адаптации. Их используют в качестве злодеев в историях, а их бесчисленные культы предоставляют множество интересных и пугающих противников. Такие изображения могут сильно различаться в деталях как из-за отсутствия знаний у большинства людей, так и из-за самого разнообразия красноземельцев, где каждая отдельная группа по-своему завораживает и кажется чуждой посторонним. Эти отдельные племена постоянно воюют друг с другом, хотя причины такой вражды неизвестны, а возможно, даже непостижимы для чужаков. Хотя некоторые утверждают, что они сражаются просто ради выживания, другие заявляют, что за их действиями кроется более зловещий умысел, цель которого еще предстоит увидеть.#"
 redlander_opinion: "Мнение #E красноземельцев#!"
 

## Bestial ##
 
# Beast
 bestial: "Звери"
 bestial_collective_noun: "Звериный"
 bestial_prefix: "Зверино"
 bestial_desc: "#size:15    [Concept('aeras','Эрас')|E] является домом для огромного количества зверей, начиная от обычных и заканчивая [Concept('magic','магическими')|E]. Ученые часто делят существ на три широкие категории: [Concept('natural_creatures','естественные существа')|E], [Concept('godtouched_creatures','затронутые богами существа')|E] и [Concept('mutations','мутировавшие существа')|E].#"
 bestial_opinion: "Мнение #E зверей#!"
 
# Dragon
 gh_dragon_culture: "Драконы"
 gh_dragon_culture_collective_noun: "Драконий"
 gh_dragon_culture_prefix: "Драконово"
 gh_dragon_culture_desc: "#size:15    Драконы были [Concept('godtouched_creatures','Боготронутыми созданиями')|E], которые в основном обитали в [Concept('aversaria','Аверсарии')|E] и частях северо-восточного [Concept('sarradon','Саррадона')|E] с времен, предшествовавших историческим хроникам, примерно до середины III века И.С. Свирепые и огромные ящероподобные звери, они обладали рядом [Concept('dragons','магических характеристик')|E] и проявляли интеллект на уровне человека или выше.\n\nДраконы были, судя по всему, уничтожены во время и после [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E], сначала в боях, а затем после того, как аавтократ Эксионарекс посчитал оставшихся драконов слишком опасными и приказал истребить их.#"
 gh_dragon_culture_opinion: "Мнение #E драконов#!"
 

