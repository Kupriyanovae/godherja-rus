# Practitioner
 practitioner: "Практики"
 practitioner_collective_noun: "Практическ"
 practitioner_prefix: "Практическо"
 practitioner_desc: "#size:15    [Concept('aversaria','Аверсария')|E] давно определялась своими [Concept('magi','магами')|E], чья сила была вплетена в саму идентичность империи. Эти маги, хотя и присутствовали повсюду, начали кучковаться в определенных местах, а [Concept('mayikrata','Маийкрата')|E] и ее академии-сателлиты стали домом для культуры, уникальной по сравнению с остальными аверсарианцами. Хотя маги не составляют большинства в этих регионах, их важность в местных обычаях невозможно переоценить.\n\nТермин «Практик» возник благодаря группе администраторов, которые придумали его как сокращение для членов [Concept('mayikprolollans','майикпрололланов')|E]. Со временем маги стали распространять его среди своих подчиненных в попытке взрастить преданных последователей. Это во многом увенчалось успехом, створив культуру, существующую для служения [Concept('magic','магии')|E] превыше всего. Те, кто повелевает ею, должны быть возвышены над обществом, а служить им — наивысшее призвание, ибо оно приближает к их славе. Из-за этого возвышения многие практики избегают продвижения по службе, так как идея превосходства магов укреплялась в них на протяжении всей жизни.#"
 practitioner_opinion: "Мнение #E практиков#!"
 
# Skolix
 skolix: "Сколиксы"
 skolix_collective_noun: "Сколиксск"
 skolix_prefix: "Сколиксско"
 skolix_desc: "#size:15    В то время как «благородные» [Concept('mutations','мутации')|E] (такие как светящиеся глаза, постоянные иллюзии или зачарованные голоса) часто считаются признаками аристократии и престижа, наиболее распространенные мутации (лишние или уродливые части тела, опухолевые образования, неразвитые органы), чаще встречающиеся у рожденных в высоко-[Concept('magic','магических')|E] областях, в отличие от [Concept('magi','магов')|E], способных контролировать свою точную мутацию, считаются признаками недостоинства и «отвержения» [Concept('aersanon','Чистейшим')|E]. Разница часто основана исключительно на классовой принадлежности и предрассудках, и многие [Concept('aversaria','аверсарианские')|E] лорды исторически предпочитали очищать свои династии и владения от [Glossary( 'сколиксов', 'GH_SKOLIX_GLOSS' )] из-за их нечистоты и мнимой опасности для духовной и генетической сплоченности Империи.\n\nСамой распространенной альтернативой прямой смерти для многих сколиксов, особенно на западе, является изгнание на Башенные острова. Острова, важные как в теологическом плане, так и для магических исследований, слишком пропитаны окружающей магией, чтобы «обычные» люди могли их колонизировать. Таким образом, на западе давно возникла потребность в гражданах-сколиксах (чтобы править) и рабах (чтобы служить), где имперские магистраты исторически наживали огромные состояния на содействии покупке и продаже мутантов для управления Островами.#"
 skolix_history_loc: "Развились из множества изгнанных [Concept('mutations','мутантов')|E] со всей [Concept('aversaria','Империи')|E]"
 skolix_opinion: "Мнение #E сколиксов#!"
 

## Etepezean ##
 
# Seychescian
 seychescian: "Сейчесцы"
 seychescian_collective_noun: "Сейческ"
 seychescian_prefix: "Сейческо"
 seychescian_desc: "#size:15    Сейчесцы — потомки миграции неизвестной культуры в современную Этепезею и ее последующего смешения с этапексейнскими племенами и колониями, отправленными с восточного Горного Солнца. Сейчесцы — особенно после объединения в Сейческий Конкордат в 116 И.С. — стали крупной военно-морской и торговой державой и главным соперником ранней [Concept('aversaria','Аверсарианской')|E] [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )] до падения Конкордата в 79 И.С.\n\nУмелые мореплаватели, сейчесцы когда-то считались миротворцами древней Этепезеи, а их правящие знатные семьи пользовались огромным уважением как дипломаты и политики, которых регулярно приглашали по всему региону и [Glossary('полисократии','GH_POLISOCRACY_GLOSS')] для урегулирования споров и наблюдения за подписанием договоров.#"
 seychescian_history_loc: "Произошли от смешения неизвестного предка с этапексейнскими племенами и колонистами Горного Солнца из восточной Этепезеи примерно в XI веке до И.С."
 seychescian_opinion: "Мнение #E сейчесцев#!"
 
# Vilicarix
 vilicarix: "Виликариксы"
 vilicarix_collective_noun: "Виликариксск"
 vilicarix_prefix: "Виликариксско"
 vilicarix_desc: "#size:15    Древняя культура этапексейнских [Glossary('полисрв','GH_POLISOCRACY_GLOSS')], в основном располагавшаяся вокруг полиса Агринамея. Она была известна среди ученых древнего [Glossary('Нэксанаксика','GH_NAEXANAXICA_GLOSS')] как великий центр философии и театра, в особенности благодаря Вильнакари — серии из семи пьес, подробно описывающих возвышение города Агринамея и завершающихся их легендарной победой в VIII веке до И.С. над своими злейшими врагами, кайротами.\n\nВиликариксские правители пытались одновременно заигрывать и стравливать между собой соперничающие [Concept('aversaria','Аверсарианскую')|E] [Glossary( 'Аавтократию', 'GH_AAUTOKRATA_GLOSS' )] и Сейческий Конкордат, но лишь нажили вражду с обоими. Кайроты присоединились к Аавтократии вскоре после ее формирования, и их вождь, военачальник Сарракс, успешно убедил аатократора Нокей'зекса помочь кайротам в истреблении виликариксов. Несмотря на это, их искусство остается чрезвычайно уважаемым в современной имперской культуре, тогда как кайроты оказались относительно забыты.#"
 vilicarix_opinion: "Мнение #E виликариксов#!"
 
# Kyrotic
 kyrotic: "Кайроты"
 kyrotic_collective_noun: "Кайротск"
 kyrotic_prefix: "Кайротско"
 kyrotic_desc: "#size:15    Кайроты были культурой этапексейнских [Glossary('полисов','GH_POLISOCRACY_GLOSS')], одинаково знаменитой и печально известной своей свирепой воинской культурой. Кайроты были известны множеством фестивалей и ритуалов, восходящих к их древнему племенному прошлому, когда предков кайротов боялись как последователей темных и кровожадных богов-ведьм, якобы спустисшихся с далекого солнца. Самыми известными из их странных обычаев были фестиваль [Glossary('Аэр'айматаксго'рракс','GH_AERAIMATAXGORRAX_GLOSS')] и четырнадцатишаговый «Танец Драконогласных».\n\nНесмотря на их раннюю верность [Concept('aversaria','Аверсарианской')|E] [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )] и завоевание ими своих древних виликариксских соперников, аавтократ $aauto_maklea_link$ Маклея#! запретила кайротский язык в 255 И.С. в рамках своих масштабных языковых реформ и сожгла половину их городов за помощь ее убитому брату, претенденту Эсхрадераксу.#"
 kyrotic_opinion: "Мнение #E кайротов#!"
 
# Epigic
 epigic: "Эпигийцы"
 epigic_collective_noun: "Эпигийкск"
 epigic_prefix: "Эпигийкско"
 epigic_desc: "#size:15    Эпигийкские [Glossary('полисы','GH_POLISOCRACY_GLOSS')] когда-то считались величайшими и самыми культурными в Этепезее, с долгой и богатой историей военачальников-[Concept('magi','магов')|E] и великих всадников на драконах, кульминацией которой стало объединение их городов под эгидой легендарной Эпигийкской Лиги, которая временами доминировала в восточной Этепезее на протяжении нескольких столетий через циклы объединения, распада и возрождения. На пике своего могущества эпигийцы достигли столь высокого престижа, что считались вершиной [Glossary('Нэксанаксикской','GH_NAEXANAXICA_GLOSS')] цивилизации — равной даже полисам Имперского острова.\n\nГлавным соперником Лиги стал Сейческий Конкордат, и под руководством легендарного мага Сорова Лига одержала победу в первых двух Херсонесских войнах. Его смерть и последовавшая за ней гражданская война произошли в самый худший момент: вскоре Лига была разделена между новообразованной [Glossary( 'Аавтократией', 'GH_AAUTOKRATA_GLOSS' )] и их сейческими соперниками, а затем снова — между аэрсодиаксинской и имперской фракциями во время [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E]. К правлению $aauto_maklea_link$ Маклеи#! великие города эпигийцев превратились в сгоревшие руины, а сама культура в значительной степени растворилась в аверсарианской среде, хотя Лига и ее культура оставались глубоко уважаемыми в имперской культуре на протяжении веков, а эпигийкская поэтическая форма даже пережила возрождение среди интересующихся ученых Земль Обрядов в конце XIII века.#"
 epigic_opinion: "Мнение #E эпигийцев#!"
 

# Verogii
 verogii: "Верогии"
 verogii_collective_noun: "Верогийск"
 verogii_prefix: "Верогийско"
 verogii_desc: "#size:15    Когда-то наводившие страх как величайшие налетчики земель, ставших ныне пограничьем между Землями Кланов и Малькоей, матриархальные верогии были милитаризованным племенным народом из [Concept('continental_interior_biozone','центра Континента')|E], мигрировавшим в современную Этепезею в начале III века И.С. Они провели несколько войн против новообразованного Сейческого Конкордата, но в остальном довольно хорошо влились в племенную этапексейнскую структуру и стали одной из многих гибридных культур племен и [Glossary('полисов','GH_POLISOCRACY_GLOSS')] на севере региона.\n\nХотя первоначально они подвергались жестоким преследованиям со стороны ранней [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )] из-за своего якобы «варварства», аавтократ $aauto_maklea_link$ Маклея#! питала известную слабость к верогийским женщинам и продвинула нескольких из них на высокие посты в своем окружении любовниц и в Империи — например, Исайнаксфас «Верогию», первую губернаторшу Этепезеи. Несмотря на свой стремительный взлет к положению престижной культуры, верогии впоследствии начали растворяться в более широком имперском окружении. Их земли были опустошены Вдовьей войной, аавтократ $aauto_pathos_link$ Пафос#! консолидировал большую часть их земель под новыми имперскими титулами и тихо подавил верогийский язык, из-за чего культура фактически исчезла к правлению Деноса.#"
 verogii_opinion: "Мнение #E верогиев#!"
 
# Lomonios
 lomonios: "Ломониосы"
 lomonios_collective_noun: "Ломониосск"
 lomonios_prefix: "Ломониосско"
 lomonios_desc: "#size:15    Сводящиеся к векам годы ломониосы счастливо живут на холмах центральной Этепезеи. Часто отвергаемые как неотёсанный деревенский люд, они тем не менее обладают уникальной чертой, которая годами ставила в тупик [Concept('aversaria','аверсарианских')|E] ученых.\n\nНеобычно то, что ломониосы обычно рождаются с чрезвычайно высоким уровнем врожденной [Concept('magic','магии')|E], но при этом лишены способности правильно проявлять или использовать ее. Это привело к тому, что их использовали в качестве жертвенных компонентов в заклинательных ритуалах, пока они не [Concept('videro_cnavaius','завоевали')|E] права [Glossary( 'аниксионкройтропиксов', 'GH_ANIXSIONTHROPIX_GLOSS' )] в конце [Concept('chaos_of_the_seventh_century','хаоса седьмого века')|E].#"
 lomonios_opinion: "Мнение #E ломониосов#!"
 

# Old Islander
 old_islander: "Староостровитянине"
 old_islander_collective_noun: "Староостровитянск"
 old_islander_prefix: "Староостровитянско"
 old_islander_desc: "#size:15    Хотя [Concept('shatteredisles','Расколотые острова')|E] рассматривались [Concept('aversaria','Аверсарианской')|E] [Glossary( 'Аавтократией', 'GH_AAUTOKRATA_GLOSS' )] как бесполезное захолустье на протяжении большей части имперской истории, наследие [Glossary('полисократии','GH_POLISOCRACY_GLOSS')] всё еще глубоко укоренено. Как утверждал драконейский ученый Новакс из Ри в своих знаменитых повествованиях XIV века о постимперском периоде, материальные условия древней полисократии уходят еще глубже.\n\nБез добывающей экономики и политического небрежения Аавтократии население, сильно увеличившееся благодаря столетнему притоку беженцев, начавшемуся во время [Concept('imperial_civil_war','Имперской гражданской войны')|E], и оказавшееся в гораздо более справедливой коммерческой и политической системе, чем система имперского [Concept('the_continent', 'Расколотого побережья')|E], некогда нищие островитяне начали восстанавливать древнее местечковое наследие прошлых веков. Главным центром новой староостровной культурной сферы стал город Икс и его Иксийский ренессанс, лишь слегка омраченный дымкой безумия, определившей облик города в конце XIII века.#"
 old_islander_opinion: "Мнение #E староостровитян#!"
 
# Drakelander
 drakelander: "Драконейцы"
 drakelander_collective_noun: "Драконейск"
 drakelander_prefix: "Драконейско"
 drakelander_desc: "#size:15    Политический крах [Concept('aversaria','аверсарианской')|E] [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )] в Этепезее, доминировал в XIII веке, происходя в основном между распадом [Concept('ashen_aautokrata_fix', 'Пепельной аавтократии')|E] во время [Concept('six_great_revolts','Шести великих восстаний')|E] и завершившись [Concept('sjalvolki_migration', 'Падением Орайсполя')|E], когда $cenware_link$ Ценвар «Сокрушитель Ведьм»#! захватил его в 1257 году И.С. в результате Переворота жрецов.\n\nКогда имперская власть окончательно пала из-за провозглашения Ценваром нового королевства под предводительством сьялволков в Орисполе и объявления его Аавтократом оставшейся этепезейской знатью, эта же знать поспешила вывести свои полномочия из сил древней мертвой Аавтократии. Культурный образ дракона, возвеличенный в символике антиэшраистским поэтом Десмосом Магом и его великой речью «Последний огонь Империи», стал центральным в новой культуре. Благородные звери, могущественные, трудолюбивые и убитые удушающей империей, чья кровь продолжает жить в благородных аверсарианцах Драконьих земель.#"
 drakelander_opinion: "Мнение #E драконейцев#!"
 

## Old Imperial ##
 
# Fogwatcher
 fogwatcher: "Смотрители тумана"
 fogwatcher_collective_noun: "Смотрительск"
 fogwatcher_prefix: "Смотрительско"
 fogwatcher_desc: "#size:15    В середине XIII века разбитые остатки дюжины легионов и сотни варварских племен вместе с армией из десятков тысяч беженцев вырвались из [Concept('foglands','Туманных земель')|E] в [Concept('hyrea_biozone','Гирейский водораздел')|E] к такому изумлению, что верховный король $cenware_link$ Ценвар «Сокрушитель Ведьм»#! провозгласил — как утверждают, все еще истекая кровью от ранения стрелой после осады Касмезе, — что любому, кто все еще бежит из Туманных земель, должно быть даровано «десять тысяч милостей и благодеяний» каждым, кто признает его власть.\n\nПосле этого избитая коалиция распалась, а большинство ее беженцев рассеялись по новообразованным королевствам переселенцев в [Concept('the_continent','Землях Обрядов')|E]. Однако многие опытные разведчики и солдаты коалиции говорили о «[Concept('the_fog','Зове Тумана')|E]», манящем их обратно к северным пустошам, и начали объединяться в несколько наемных отрядов, посвященных исследованию или сбору трофеев в глубинах Тумана. Пополняемая с тех пор тысячами солдат, авантюристов, мародеров и изгоев, крупнейшая из этих компаний, Черные легионы, обосновалась в долине Замбхан и впоследствии прославилась своей странной способностью прокладывать пути и ориентироваться в Туманных землях. Прославившись предупреждением юга об вторжениях [Concept('fogeaters','пожирателей тумана')|E] и [Concept('fogbeasts','Туманных тварей')|E] в 1277 и 1279 годах И.С., а также знаменитой засадой и убийством закованного в железо пожирателя тумана Руунхеркса, легионеры Черного легиона стали известны как «Смотрителями Тумана».#"
 fogwatcher_history_loc: "Сформировались из [GetCultureByKey('outer_aversarian').GetCollectiveNoun]их, [GetCultureByKey('centralimperial').GetCollectiveNoun]их, [GetCultureByKey('phalonix').GetCollectiveNoun]их и [GetCultureByKey('apokiakas').GetCollectiveNoun]их народов в $CULTURE_BIRTH_YEAR$ году от И.С."
 fogwatcher_opinion: "Мнение #E смотрителей тумана#!"
 
# Doraxi
 doraxi: "Доракси"
 doraxi_collective_noun: "Дораксийск"
 doraxi_prefix: "Дораксийско"
 doraxi_desc: "#size:15    После истребления остатков имперской знати Центральных островов во время Молниеносного восстания и Пасхалиспольской резни, экономический крах региона и приток беженцев с материка привели к немыслимому смешению оставшихся центральных островитян, их рабов и дересстаи-ийроссов под эгидой института куда более древнего и великого, чем ненавистная [Glossary( 'Аавтократия', 'GH_AAUTOKRATA_GLOSS' )], — пиратства.\n\nОтчаянные набеги островитян на материк в середине XIII века становились все более организованными и сплоченными, кульминацией чего стал великий набег на Поиос в 1285 И.С,. С тех пор доракси стали известны не только как грозные налетчики, но и как проницательные купцы и многочисленные наемники, и всё это — несмотря на одинаковую вражду со стороны их [Concept('aversaria','аверсарианских')|E] и ийросских сородичей.#"
 doraxi_opinion: "Мнение #E доракси#!"
 

# Pure-Blood
 pure_blood: "Чистокровки"
 pure_blood_collective_noun: "Чистокровск"
 pure_blood_prefix: "Чистокровско"
 pure_blood_desc: "#size:15    Пока остальная [Concept('aversaria','Аверсарианская')|E] [Glossary( 'Аавтократия', 'GH_AAUTOKRATA_GLOSS' )] горела и погружалась в хаос, а великая и благородная Малькоя пала из-за предательства и измены своих злодеев-[Concept('aversarian_slavery', 'рабов')|E], истинные и чистейшие сыны Империи — [GetCultureByKey('skorikiakas').GetName|V] — восстали из пепла, чтобы восстановить порядок и праведное правление в своих городах в Вроради.\n\nСмиренно объединив оставшиеся подонки малькойской, калатипсомийской и катраддийской знати в своих границах, скорикиакасы взяли на себя руководство — не как явные вершители судеб, властвующие своей де-факто властью над низшими в знак своей истинной аверсарианской крови, но как первые среди равных, чистейшие среди чистых. Эти «чистокровные» города стали колыбелью, из которой в конце XIII века выплеснулась консервативная реакция против Культа Имперской скорби, что привело к десятилетию уличных боев и покушений во время Мессисийского лета.#"
 pure_blood_opinion: "Мнение #E чистокровок#!"
 
# Exods
 exods: "Эксоды"
 exods_collective_noun: "Эксодск"
 exods_prefix: "Эксодско"
 exods_desc: "#size:15    Какие песни можно сложить о великом Эксоде, чтобы запечатлеть его славу? О том, как храбрый Эксод, герой тысячи [Concept('shatteredisles','Островов')|E], боролся и сразил Змея Гета изнутри его же брюха? Как мудрый Эксод великим и могучим заклинанием дотянулся и убил демона Урканнара в глубине пещер Цокки, куда никому другому не дозволялось даже ступить и увидеть великого зверя? Как могучий Эксод в одиночку сразил тысячу солдат в Битве у Имперского залива во главе величайшей армии, которую только видели Острова? Какое бы сказание ни велось, истинно сходились лишь в двух вещах о непобедимом Эксоде: что он был непобедим и обладал неделимой душой, и что он был казнен жестоким тираном Оледьмиром из Акафоса после подлой засады и ареста.\n\nХотя Эксод потерпел поражение, а его божественная душа отправилась к Чистейшему, его культ сохранился и превратил его в символ островного сопротивления и единства против беглых имперских лордов и [Concept('sjalvolki_migration', 'пост-переселенских')|E] захватчиков. Хотя его странный и туманный культ в основном умер вместе с ним, образ Эксода как героя новой и объединенной южно-островной идентичности и мифология его (кратковременного) изгнания армий как оставшихся имперских магистратов, так и лордов-переселенцев в 1278 И.С. сделали его имя синонимом региона и его жителей на века вперед.#"
 exods_opinion: "Мнение  #E эксодов#!"
 

# Ouletaelatic
 ouletaelatic: "Улетаэлаты"
 ouletaelatic_collective_noun: "Улетаэлатикск"
 ouletaelatic_prefix: "Улетаэлатикско"
 ouletaelatic_desc: "#size:15    Переворот избитых остатков субгубернаторства Нотианиксии в середине XIII века, совершенный [GetCultureByKey('dasulanoi').GetCollectiveNoun|V]ой аристократией, и последующее создание [Concept('aversaria','Имперского')|E] Королевства Нотианиксии в 1266 году И.С. вскоре сменились головокружительной серией завоеваний и аннексий, удача в которых отвернулась лишь с неудачным вторжением на [Concept('imperial_isle_biozone','Имперский остров')|E] в 1289 году и последующим распадом ненадолго возвысившегося королевства.\n\nНесмотря на это, краткий период единства радикально изменил политику на [Concept('shatteredisles','Восточных островах')|E] на века вперед. Поскольку глубокий раскол, оставленный павшей [Glossary( 'Аавтократией', 'GH_AAUTOKRATA_GLOSS' )], был сглажен дасуланойскими попытками восстановить имперские институты в своем новом королевстве, единство устояло, несмотря на крах нового государства. Когда Нотианиксия разделилась на восток и запад, встал вопрос не о том, сохранится ли память об этом новом королевстве, а о том, кто именно ее унаследует. Для улетаэлатов с востока ответ очевиден: как истинные потомки дасуланойской культуры и последние знаменосцы консервативного имперского традиционализма на Островах, вполне естественно, что железные легионы улетаэлатов поведут Нотианиксию в чистый и славный новый век!#"
 ouletaelatic_opinion: "Мнение #E улетаэлатов#!"
 
# Nillatic
 nillatic: "Ниллаты"
 nillatic_collective_noun: "Ниллатикск"
 nillatic_prefix: "Ниллатикско"
 nillatic_desc: "#size:15    Хотя [GetCultureByKey('walakon').GetName|V] и многие другие группы островитян были подчинены [GetCultureByKey('dasulanoi').GetName|V] в ходе стремительного расширения подрастающего [Concept('aversaria','Имперского')|E] Королевства Нотианиксия в 1270 году И.С., дасуланой изо всех сил пытались объединить культуры и веру [Concept('shatteredisles','Восточных островов')|E]. Лорды западной Улетаэласа, которым архикс Ариовист поручил привести валаконов к послушанию или предать мечу, вместо этого проложили Торенионский путь — одно из самых богатых торговых связующих звеньев [Concept('sjalvolki_migration', 'пост-переселенского')|E] [Concept('the_continent', 'Расколотого побережья')|E].\n\nКогда Имперское Королевство столкнулось с крахом в 1289 году И.С. после катастрофического вторжения на [Concept('imperial_isle_biozone','Имперский остров')|E], валаконы и западные улетаэлаты двинулись на защиту своих новых торговых связей и купеческого единства, расцветшего в молодом королевстве. Теперь, когда Нотианиксия разделена между реакционными военачальниками востока и энергичными, проницательными купцами Ниллы и западного Улетаэласа, вполне естественно, что именно золотая монета ниллатов поведет Острова в богатый и славный новый век!#"
 nillatic_opinion: "Мнение #E ниллатов#!"
 

# Magisterial
 magisterial: "Магистралы"
 magisterial_collective_noun: "Магистральск"
 magisterial_prefix: "Магистральско"
 magisterial_desc: "#size:15    Наследие [Concept('thallasian_magicoup','Талласианского магического переворота')|E] тяготело над оставшимися [Concept('aversaria','аверсарианскими')|E] [Concept('magi','магами')|E] из [Concept('mayikprolollans','майикпрололланов')|E], когда [Concept('sjalvolki_migration', 'армии переселенцев')|E] сокрушили Орайсполь и разбили остатки западной [Glossary( 'Аавтократии', 'GH_AAUTOKRATA_GLOSS' )] в 1257 году И.С.. Хотя договор, подписанный между Майикпрололланом и $cenware_link$ Ценваром «Сокрушителем Ведьм»#!, гарантировал — на какое-то время — определенную безопасность, распад имперского закона как внутри, так и за пределами города, а также растущая угроза со стороны новых лордов-переселенцев по мере продвижения Сокрушителя Ведьм на восток привели к политическому хаосу среди практиков города.\n\nСовершив невероятно спорный политический шаг (и проведя последующую чистку), Магистральский Совет Майикпрололлана «отменил» имперскую кастовую систему в 1263 году И.С., объявив о существовании четырех «смежных» «социальных столпов»: магов, купцов, граждан и рабов. Что еще более важно, Магистральский Совет затем снова открыл двери академии — теперь для княжичей-переселенцев, шаманов и изгнанников. Эти события установили новую культурную норму для оставшихся практиков нового [Concept('the_continent', 'Расколотого побережья')|E], продолжив старое аверсарианское возвышение магов и одновременно отказавшись от специфических культурных и политических атрибутов Империи.#"
 magisterial_opinion: "Мнение #E магистралов#!"
 

## Proto-Aversarian ##
 
# Aelarvisian
 aelarvisian: "Аэларвисийцы"
 aelarvisian_collective_noun: "Аэларвисийск"
 aelarvisian_prefix: "Аэларвисийко"
 aelarvisian_desc: "#size:15    Изначально населявшие бесчисленные города-государства на территории современной западной Этепезеи, аэларвисийцы были древней культурой, которая объединила Расколотое побережье и выковала могущественную империю на крови. Печально известные своей гордыней, но славящиеся суровостью своего народа, аэларвисийцы были мастерами войны, заложившими основу первых итераций Имперской армии, в противоположность неорганизованным дворянским армиям, предшествовавшим им. В целом они известны своим стремлением установить порядок через покорение, и, соответственно, сквозь века было немало выдающихся завоевателей аэларвисийского происхождения.\n\nКак знати аэларвисийцев, так и исключительным солдатам было свойственно избегать верховой езды на традиционных животных, таких как лошади, в пользу легендарных и ужасных [Concept('dragons','драконов')|E]. Это принесло им прозвище «Драконьи всадники». Эти всадники формировали глубокие связи со своими ездовыми животными, выходившие за рамки видов и даже стиравшие грань между слугами и дорогими компаньонами.\n\nКультура аэларвисийцев в конечном итоге уступила место [Concept('aversaria','аверсарианской')|E] культуре, когда [Glossary( 'Аавтократия', 'GH_AAUTOKRATA_GLOSS' )] удвоила усилия по ковке новой имперской идентичности из множества существовавших в ней культур.#"
 aelarvisian_opinion: "Мнение #E аэларвисийцев#!"
 

# Aeviaxian
 aeviaxian: "Аэвиаксийцы"
 aeviaxian_collective_noun: "Аэвиаксийск"
 aeviaxian_prefix: "Аэвиаксийско"
 aeviaxian_desc: "#size:15    Одна из многих культур, возникших из неисчислимого множества городов-государств в западной Этепезее и процветавших в рамках [Glossary('полисократии','GH_POLISOCRACY_GLOSS')], аэвиаксийцы в наивысшей степени воплощают купеческую природу этих городов. Культура аэвиаксийцев ценит богатство и торговлю, а купцы считаются одной из главных групп в обществе, уступая лишь знати. Они, кроме того, известны тем, что ценят общинные связи, помогая друг другу в нужде. Они склонны создавать анклавы в поселениях, лежащих на их торговых путях, развивая процветающие общины в далеких землях. Хотя они не отказываются вести войну при необходимости, они избегают ее, так как войны вредят работе торговых путей, жизненно важных для купеческого сословия аэвиаксийцев. Вместо этого аэвиаксийцы известны использованием дипломатии и подкупа для предотвращения того, что они считают расточительными конфликтами.\n\nВ конце концов аэвиаксийцы были интегрированы в [Concept('aversaria','аверсарианскую')|E] культуру в результате кампании $aauto_maklea_link$ Маклеи#! по формированию единой имперской культуры.#"
 aeviaxian_opinion: "Мнение #E аэвиаксийцев#!"
 

