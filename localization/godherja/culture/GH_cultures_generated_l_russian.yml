## Marcher ##
 
# Oejeynican
 oejeynica: "Оежейниканцы"
 oejeynica_collective_noun: "Оежейниканск"
 oejeynica_prefix: "Оежейниканско"
 oejeynica_desc: "#size:15    Оежейниканцы — частично ассимилированные потомки беженцев, бежавших на юг во время [Concept('sorrowing_of_oejeynica','Скорби Ойейницы')|E]. После веков [Concept('marchers','марочнического')|E] гнета им [Concept('oejeynican_royal_charter','были жалованы земли')|E] верховной королевой Арелли и подчинены Великому герцогу.\n\nПосле перемешивания на протяжении почти тысячелетия оежейниканцы испытали сильное влияние культуры Шевалье, хотя все еще сохраняют несколько традиций и обычаев. В частности, они говорят на особом диалекте, сочетающем ойчайнский и шевальенский, а также имеют печально известные мрачные трактовки южных фестивалей.#"
 oejeynica_opinion: "Мнение #E оежейниканцев#!"
 

# Étrandanexi
 etrandanexi: "Этранданекси"
 etrandanexi_collective_noun: "Этранданексийск"
 etrandanexi_prefix: "Этранданексийско"
 etrandanexi_desc: "#size:15    [Glossary( 'Этранданекси', 'GH_ETRANDANEXI_GLOSS' )] — потомки древних марочнических колонистов в Калатипсоми, которые «контролировали» регион до [Concept('aversaria','аверсарианской')|E] победы в [Concept('marcher_aversarian_wars','Войнах Марки и Aверсарии')|E]. Хотя технически они были побеждены, изворотливое политиканство и откровенная ложь (марочнические лорды часто заявляли о власти над широкими просторами земель, контролируя на деле мало что за пределами своих замковых ворот) привели к тому, что марочнические поселенцы не только сохранили свою власть, но и значительно ее умножили.\n\nИзвлекая огромную выгоду из кампаний легионов по истреблению местных кланов, марочники путем политических интриг захватили контроль над половиной Калатипсоми через договоры, согласно которым губернаторство Калатипсоми было разделено между постоянным марочническим и аверсарианским местами. После этого сформировались этранданекси — эклектичная смесь марочнической и аверсарианской культур, быстро снискавшая репутацию людей, бесконечно грабящих и разбойничающих среди проезжих купцов и вымогающих деньги у тех немногих местных племен, что выжили.\n\nЭтранданекси стали презираемы даже в самом [Concept('chevalie','Шевалье')|E] за открытое использование рабского труда и участие в работорговле вопреки учениям Путей Жизни, хотя ни один марочник никогда не мог отказаться от хорошей прибыли...#"
 etrandanexi_opinion: "Мнение #E этранданекси#!"
 

## Ojyczayn ##
 
# Ojyczaynz
 ojyczaynz: "Ойчайнцы"
 ojyczaynz_collective_noun: "Ойчайнск"
 ojyczaynz_prefix: "Ойчайнско"
 ojyczaynz_desc: "#size:15    Когда-то одна из самых развитых цивилизаций в [Concept('murnyr','Мурнюре')|E] и [Concept('aeras','Эрасе')|E], мастера как науки, так и [Concept('dead_magic','мёртвой магии')|E], не имевшие равных среди примитивных шевигадских племен в древнем [Concept('chevalie','Шевалье')|E], старая Ойчайнзия из-за своей великой гордыни и [Concept('magic', 'магии')|E] встретила свой конец во время [Concept('sorrowing_of_oejeynica','Скорби Ойейницы')|E].\n\nИх родины ныне представляют собой ледяную пустошь из безымянных руин, населенную лишь [Concept('lichdom','живыми мертвецами')|E].#"
 ojyczaynz_opinion: "Мнение #E ойчайнцев#!"
 

## Clanlander ##
 
# Mygottir
 mygottir: "Миготтиры"
 mygottir_collective_noun: "Миготтирийск"
 mygottir_prefix: "Миготтирийско"
