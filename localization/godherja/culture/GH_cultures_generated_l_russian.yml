# Saradoixa
 saradoixa: "Сарадойксы"
 saradoixa_collective_noun: "Сарадойксанск"
 saradoixa_prefix: "Сарадойксанско"
 saradoixa_desc: "#size:15    Сарадойксы — жители Сарадойксанских [Concept('shatteredisles','Островов')|E], к востоку от Харадамата. Гибкий народ, они заведомо трижды в своей истории порабощались и освобождались [Concept('aversaria','аверсарианцами')|E]. Эти неоднократные завоевания привели к тому, что их культура и даже название Островов, с которых они родом, испытывают сильное влияние их трехкратных завоевателей.\n\nСарадойксы также славятся выращиванием растения нхудабьяд, отваренные листья которого, как говорят, помогают им видеть мир за пределами видимого. Нхудабьяд отчасти стал причиной их повторных порабощений, так как аверсарианские маги развили страсть к мистическим свойствам этого растения. Несмотря на это, сарадойксы продолжают выращивать растение и даже сделали его одним из главных предметов торговли на Островах.#"
 saradoixa_opinion: "Мнение #E сарадойксов#!"
 
# Erimatos
 erimatos: "Эриматосы"
 erimatos_collective_noun: "Эриматосск"
 erimatos_prefix: "Эриматосско"
 erimatos_desc: "#size:15    Эриматосы происходят от первых [Concept('aversaria','аверсарианских')|E] колонистов, прибывших в [Concept('sarradon','Саррадон')|E] вместе с Сарадони Апокиак Архан после [Concept('the_decimation_of_sarradon','опустошения')|E] континента. Когда весь регион был обращен в пепел, они смогли быстро заключить выгодные сделки с доведенными до отчаяния местными жителями и основать процветающие колонии по всему побережью. Вскоре эти общины начали [Concept('erimatos_assimilation','ассимилироваться')|E], сформировав в процессе уникальную культурную идентичность.#"
 erimatos_opinion: "Мнение  #E эриматоссов#!"
 

