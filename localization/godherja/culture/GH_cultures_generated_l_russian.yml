 karadamos_opinion: "Мнение #E карадамосов#!"
 

# Makryenis
 makryenis: "Макриенийцы"
 makryenis_collective_noun: "Макриенийск"
 makryenis_prefix: "Макриенийско"
 makryenis_desc: "#size:15    Макриенийцами обозначают плавильный котел различных [Concept('aversaria','аверсарианских')|E] культур, прибывших в [Concept('sarradon','Саррадон')|E] с великой волной колонизации после начала [Concept('saints_war','Войны Святых')|E] в 1140-х годах, объединенных лишь почти фанатической преданностью агионистскому верованию. В ранние годы они были известны высокой социальной мобильностью и уважением к меритократии, и бесчисленные несчастные души на Континенте отваживались на путешествие на юг ради шанса на лучшую жизнь в Саррадоне. Несмотря на свою современную репутацию, они также когда-то считались глотком свежего воздуха на континенте, подлинными миротворцами и нейтральной третьей стороной в местных ссорах и междоусобицах.\n\nВ наши дни, хотя они все еще прикладывают огромные усилия, чтобы выставить себя благородными и праведными, их скатывание к жестокости и своеволию сделало их печально известными по всему Саррадону, а на макриенийцев обычно смотрят в лучшем случае как на банду жестоких головорезов, а в худшем — как на отвратительных тиранов, которых следует сбросить обратно в море.#"
 makryenis_history_loc: "Возникли от потомков [GetCulturePillar('heritage_aversarian').GetName]ских колонизаторов около 1180 И.С."
 makryenis_opinion: "Мнение #E макриенийцев#!"
 
