## Kathuni ##
 
# Axeizu
 averkathuni: "Аксизу"
 averkathuni_collective_noun: "Аксизск"
 averkathuni_prefix: "Аксизско"
 averkathuni_desc: "#size:15    Аксизу — это уникальная культура, сформировавшаяся на землях бывшего посольства катуни в Малькое после краха [Concept('aversaria','Аверсарии')|E]. Местные жители цеплялись за катунийскую культуру своих повелителей и покровителей, пытаясь подражать обычаям катуни, несмотря на то, что находились в сотнях лиг от Катун-Кая. Катуни, правящие этой областью, видят в аксизу насмешку над своей культурой, хотя и удобную, поскольку население, которым они правят, боготворит их и поэтому очень охотно сотрудничает с ними. Аксизу даже переняли язык своих сюзеренов взамен аверсарианского языка, которым вся Малькоя пользовалась веками.#"
 averkathuni_opinion: "Мнение #E аксизу#!"
 

