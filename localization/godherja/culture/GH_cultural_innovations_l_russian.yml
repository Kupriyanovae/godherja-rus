 innovation_mayik_underground_husbandry:0 "Подземное хозяйство"
 innovation_mayik_underground_husbandry_desc:0 "За десятилетия адаптации народы [Glossary('Майикратии','mayikprolollan_encyclopedia_desc')] разработали изощрённые методы выращивания грибов, мхов и пещерных существ. Эти приёмы легли в основу подземного сельского хозяйства." 
 innovation_mayik_glowmoss_cultivation:0 "Выращивание светомоха"
 innovation_mayik_glowmoss_cultivation_desc:0 "Искусство выращивания [Glossary('светомоха','GLOWMOSS_GLOSS')] позволило бережно ухаживать за сетями светящегося мха. Улучшенное освещение и ускоренный рост дают уникальные смолы, высоко ценимые самыми изысканными торговцами."
 innovation_mayik_undergrowth_mastery:0 "Мастерство подземной поросли"
 innovation_mayik_undergrowth_mastery_desc:0 "Века подземного земледелия принесли глубокие знания о взаимодействии пещерных экосистем. Это позволяет управлять глубокой подземной растительностью с немыслимой прежде точностью."
 innovation_mayik_deep_engineering:0 "Глубинная инженерия"
 innovation_mayik_deep_engineering_desc:0 "Поколения подземного строительства принесли мастерство в обработке камня, сталактитов и подземных водных путей. Инженеры научились читать линии разломов и укреплять природные своды."