 innovation_mayik_underground_husbandry:0 "Underground Husbandry"
 innovation_mayik_underground_husbandry_desc:0 "Through decades of adaptation, the peoples of the [Glossary('Mayikrata','mayikprolollan_encyclopedia_desc')] have developed sophisticated methods for cultivating fungi, mosses, and cave creatures. These techniques form the foundation of subaeranean agriculture." 
 innovation_mayik_glowmoss_cultivation:0 "Glowmoss Cultivation"
 innovation_mayik_glowmoss_cultivation_desc:0 "The cultivation of [Glossary('glowmoss','GLOWMOSS_GLOSS')] has been refined to carefully tend glowmoss networks. Better illumination and accelerated growth yield unique resins prized by ecclectic traders."
 innovation_mayik_undergrowth_mastery:0 "Undergrowth Mastery"
 innovation_mayik_undergrowth_mastery_desc:0 "Centuries of subaeranean cultivation have produced a deep wealth of knowledge on how cave ecosystems interact. This allows people to manage the deep undergrowth with a precision that was previously impossible."
 innovation_mayik_deep_engineering:0 "Deep Engineering"
 innovation_mayik_deep_engineering_desc:0 "Generations of underground construction have yielded mastery over stone, stalactite, and subaeranean waterways alike. Engineers know how to read fault lines and reinforce natural arches."