l_russian:

 ##############################
 # STORY CYCLE UI
 ##############################

 story_banstur_korinne:0 "Странствующий бард"
 story_banstur_korinne_desc:0 "Коринна странствует по землям, распространяя Банстурский обряд и пытаясь основать больше Бардских коллегий, чтобы древние истории продолжали жить."
 BANSTUR_KORINNE_STORY_STRING:0 "Обращено в Банстурский обряд: [Story.GetOwner.Var('banstur_conversions').GetValue|0]"

 ##############################
 # EVENTS — INTRODUCTION
 ##############################

 banstur_korinne.0001.t:0 "Путь впереди"
 banstur_korinne.0001.desc:0 "Мои шаги устремлены от [Glossary( 'Старого Севера', 'OLD_NORTH_GLOSS' )] к новым открытиям. Чтобы раскрыть и сберечь всё, что только может даровать нам эта жизнь. Истории наших народов едва не были поглощены [Concept('the_fog','Туманом')|E], но при этом столь многие стремятся полностью оставить их в прошлом. И всё же мы должны нести их туда, где в них нуждаются, пока традиции не крепнут настолько, чтобы построить всё заново.\n\nНекоторые прислушаются. Другие — нет."
 banstur_korinne.0001.a:0 "Понять — значит жить."

 ##############################
 # EVENTS — CONVERSION APPROACH (0100)
 ##############################

 banstur_korinne.0100.t:0 "Аудиенция у местного правителя"
 banstur_korinne.0100.desc_baron:0 "[Root.Var('banstur_last_target_ruler').GetFirstName] соглашается выслушать меня. Прислушается ли — другой вопрос."
 banstur_korinne.0100.desc_count:0 "[Root.Var('banstur_last_target_ruler').GetFirstName] соглашается принять меня в своем чертоге. Это может быть отличной возможностью."
 banstur_korinne.0100.desc_default:0 "[Root.Var('banstur_last_target_ruler').GetFirstName] проявляет готовность выслушать меня. Слова нужно подбирать осторожно."
 banstur_korinne.0100.a:0 "Защищать Банстурский обряд с помощью разума."
 banstur_korinne.0100.a.tt:0 "Более высокая [learning|E] повышает шансы на успех."
 banstur_korinne.0100.b:0 "Исполнить бардскую песню или рассказать сказание."
 banstur_korinne.0100.b.tt:0 "Более эффективно при наличии навыка [diplomacy|E] или против общительных правителей."
 banstur_korinne.0100.c:0 "Время еще не пришло. Идти дальше."

 banstur_korinne.0110.t:0 "Мгновение убеждения"
 banstur_korinne.0110.desc_success:0 "Доводы достигли цели. [Root.Var('banstur_last_target_ruler').GetFirstName] размышляет над ними достаточно долго, чтобы внутри что-то переменилось. Древние песни обрели еще один голос."
 banstur_korinne.0110.desc_failure:0 "[Root.Var('banstur_last_target_ruler').GetFirstName] терпеливо выслушивает, после чего качает головой. На этот раз слов оказалось недостаточно."
 banstur_korinne.0110.a:0 "Посмотрим, к чему это приведет."

 banstur_korinne.0111.t:0 "Новый голос Обряда"
 banstur_korinne.0111.desc:0 "Новая вера. Возможно, это лишь малая капля в общем масштабе, но Банстур ширится не благодаря армиям, а благодаря тем, кто выбирает его по своей воле."
 banstur_korinne.0111.a:0 "Пусть их вера останется твердой."

 banstur_korinne.0112.t:0 "Неубежденный"
 banstur_korinne.0112.desc:0 "[Root.Var('banstur_last_target_ruler').GetFirstName] держится довольно вежливо, но остается непреклонен. Его убеждения выстояли. Мне стоит собрать вещи и подумать о том, что можно было сделать иначе."
 banstur_korinne.0112.a:0 "Найдутся и другие."
 banstur_korinne.0112.b:0 "Из этого можно извлечь урок."

 banstur_korinne.0120.t:0 "Бардское мастерство"
 banstur_korinne.0120.desc:0 "Я исполняю старинное произведение времен до [sjalvolki_migrations|E], бережно воссозданное для нашего нового мира. Правитель слушает с гораздо большим вниманием, чем я ожидала."
 banstur_korinne.0120.a:0 "Пусть музыка говорит сама за себя."

 ##############################
 # EVENTS — FLAVOR (0200)
 ##############################

 banstur_korinne.0200.t:0 "Песни среди народа"
 banstur_korinne.0200.desc:0 "В этом графстве мало знают о Банстурском обряде, но местным людям любопытно. Я могла бы провести здесь время, не пытаясь обратить правителей, а посеяв семена среди простого люда."
 banstur_korinne.0200.a:0 "Выступить на рыночной площади."
 banstur_korinne.0200.a.tt:0 "Более эффективно в развитых графствах. Тонко распространяет весть Банстурского обряда."
 banstur_korinne.0200.b:0 "Обучить детей старинным песням."
 banstur_korinne.0200.c:0 "Записать местное предание для архива новой Коллегии."

 banstur_korinne.0201.t:0 "В пути"
 banstur_korinne.0201.desc_progress:0 "Дорога долго тянется за моей спиной и обещает быть еще длиннее впереди. Но я уже вижу очертания того, чем может стать Банстурский обряд. Не просто уцелевшим пережитком прошлого, а чем-то новым и живым."
 banstur_korinne.0201.desc_early:0 "Пусть было нелегко, но первые шаги сделаны. Традиция живет там, где ее раньше не было."
 banstur_korinne.0201.desc_start:0 "Мой путь длинен. Сказания, что я несу, хрупки. Всего один голос, лишь один набор слов. Но сказания выживают куда лучше, чем голоса."
 banstur_korinne.0201.a:0 "Продолжать путь."
 banstur_korinne.0201.b:0 "Отдохнуть и отбросить сомнения."

 banstur_korinne.0202.t:0 "Враждебность на дороге"
 banstur_korinne.0202.desc:0 "Слухи о моих деяниях разнеслись повсюду, и далеко не все этому рады. На пути мне встречается человек, считающий Банстурский обряд ересью, которую стоит искоренить, а меня — его живым воплощением."
 banstur_korinne.0202.a:0 "Твердо стоять на своем и открыто защищать веру."
 banstur_korinne.0202.b:0 "Отступить: пусть традиция переживет этот спор."

 ##############################
 # TASK CONTRACTS
 ##############################

 gh_banstur_korinne_archive_0001:0 "Хроника переселений"
 gh_banstur_korinne_archive_0001_desc:0 "Местный лорд хочет должным образом записать историю своего рода до эпохи Великого переселения: песни, сказания, родословные из их странствий и расселения. Плата реальна. А записи, будучи созданы, переживут своего заказчика."

 gh_banstur_korinne_court_0001:0 "Бардский вечер"
 gh_banstur_korinne_court_0001_desc:0 "Лорд слышал о моих выступлениях и желает уехать свой двор: устроить бардский вечер, переплетающий древнюю традицию с новыми сочинениями. Слушатели будут образованны и требовательны."

 ##############################
 # EVENTS — ARCHIVE CONTRACT (1000)
 ##############################

 banstur_korinne.1000.t:0 "Заказ во имя прошлого"
 banstur_korinne.1000.desc:0 "У [Root.Var('banstur_archive_patron_char').GetFirstName] есть предложение. В жилах его семьи, как и у многих в этих землях, течет память эпохи [Concept('sjalvolki_migrations','Великого переселения')|E]: отголоски имен, полузабытые традиции и кровные узы, перешагнувшие через канувшие в лету расстояния. Мой покровитель хочет записать все это со всей возможной точностью."
 banstur_korinne.1000.a:0 "Понятно."

 ##############################
 # EVENTS — COURT PERFORMANCE (1010-1013)
 ##############################

 banstur_korinne.1010.t:0 "Приглашение на выступление"
 banstur_korinne.1010.desc:0 "До [Root.Var('banstur_court_patron_char').GetFirstName] дошли слухи о моих выступлениях, и теперь от меня ждут представления для двора — бардского вечера, где старые традиции Банстура сплетутся с новыми произведениями. Слушатели окажутся искушенными и цепляющимися к мелочам."
 banstur_korinne.1010.a:0 "Приготовиться к выступлению."

 banstur_korinne.1011.t:0 "Хороший вечер"
 banstur_korinne.1011.desc:0 "Представление прошло успешно. Зал внимал. Пусть не каждое произведение отозвалось в сердцах так, как задумывалось, но публика осталась на моей стороне, да и [Root.Var('banstur_court_patron_char').GetFirstName], похоже, вполне доволен. Отличный результат работы, и награда тому под стать."
 banstur_korinne.1011.a:0 "Поклониться, забрать плату и отправиться дальше."

 banstur_korinne.1012.t:0 "Зал замер"
 banstur_korinne.1012.desc:0 "Выступление удалось на славу. После того как затихла последняя нота, [Root.Var('banstur_court_patron_char').GetFirstName] еще долго сохранял молчание. Эта тишина была красноречивее любых слов."
 banstur_korinne.1012.a:0 "Поклониться, забрать плату и отправиться дальше."

 banstur_korinne.1013.t:0 "Тяжелый вечер"
 banstur_korinne.1013.desc:0 "Представление прошло совсем не так, как хотелось. Слушатели были вежливы, но безучастны: подводкой подвел либо выбор репертуара, либо сам зал. [Root.Var('banstur_court_patron_char').GetFirstName] все равно заплатил, но сумма говорила сама за себя."
 banstur_korinne.1013.a:0 "Принять скромную плату и извлечь урок."

 ##############################
 # EVENTS — CONCLUSION (0400)
 ##############################

 banstur_korinne.0400.t:0 "Коллегии живы"
 banstur_korinne.0400.desc:0 "По всем землям звучат теперь несколько голосов, поющих старинные песни. Мне не удалось возродить прежнюю Коллегию Грейпорта — эта задача ляжет на плечи других, быть может, уже следующего поколения, — но Банстурский обряд пустил здесь свои корни."
 banstur_korinne.0400.a:0 "Работа продолжается."
 fervor_gain_banstur_founder_nickname:0 "Коринна наречена Основательницей Банстурского обряда"

 ##############################
 # EVENTS — KORINNE'S GRAVE (0500)
 ##############################

 banstur_korinne.0500.t:0 "Могила Коринны"
 banstur_korinne.0500.desc_banstur:0 "Простой каменный надгробие стоит у края дороги. Надпись гласит: «Коринна, хранившая песню». Прославленный лидер Банстурского обряда и знаменитый писец, она навсегда останется в памяти традиции, распространению которой посвятила жизнь."
 banstur_korinne.0500.desc_sjalvolki:0 "Обычная безымянная могила, если бы не этот камень. Кто-то высек на нем короткую фразу: «Она берегла древние песни». Ниже высечены несколько музыкальных станов — знаки традиции Банстурского обряда."
 banstur_korinne.0500.desc_default:0 "Придорожное надгробие отмечает место упокоения Коринны — странствующего барда, посвятившей свою жизнь распространению Банстурского обряда. Камень скромен. Чтящие ее память — нет."
 banstur_korinne.0500.a:0 "Отдать дань уважения."
 banstur_korinne.0500.b:0 "Исполнить песню в бардской традиции."
 banstur_korinne.0500.c:0 "Почтить молчанием и продолжить путь."

 ##############################
 # GREAT PROJECT
 ##############################

 great_project_type_banstur_college:0 "Основать Бардскую коллегию"
 great_project_type_banstur_college_01:0 "Основать Бардскую коллегию"
 great_project_type_tooltip_banstur_college:0 "Основать новую Бардскую коллегию — центр бардского обучения и традиций Банстурского обряда. Открыта для всех ищущих знания и особенно рада странствующим искателям приключений."

 great_project_name_banstur_college:0 "Бардская коллегия"
 great_project_name_possessive_banstur_college:0 "Бардской коллегии"

 building_banstur_college_building:0 "Бардская коллегия"
 building_banstur_college_building_desc:0 "Центр бардского обучения и традиций Банстурского обряда. Здесь рады ученым, странникам и всем, кто стремится к тайным знаниям."
 banstur_college_building_effect_desc:0 "Дает усиленные бонусы к изучению арканы и оказывает радушное гостеприимство странствующим искателям приключений."

 ##############################
 # MODIFIERS
 ##############################

 banstur_wanderer_modifier:0 "Странствующий бард"
 banstur_wanderer_modifier_desc:0 "Путешествует во славу Банстурского обряда, распространяя бардские традиции."

 banstur_wanderer_patience_modifier:0 "Терпеливая вера"
 banstur_wanderer_patience_modifier_desc:0 "Не каждое сердце готово сразу. Труды продолжаются."

 banstur_cultural_record_modifier:0 "Культурный архивист"
 banstur_cultural_record_modifier_desc:0 "Записывает местные традиции для будущего архива Бардской коллегии."

 banstur_seeds_of_faith_modifier:0 "Семена Банстурского обряда"
 banstur_seeds_of_faith_modifier_desc:0 "Бардская традиция пустила здесь корни. Люди напевают древние песни."

 banstur_patron_contract_modifier:0 "По поручению покровителя"
 banstur_patron_contract_modifier_desc:0 "Работает по официальному договору с местным лордом. Условия ясны, остальное сделает вера."

 korinne_grave_visited_modifier:0 "Визит к могиле Коринны"
 korinne_grave_visited_modifier_desc:0 "Визит к могиле Странствующего барда — женщины, поддерживавшей жизнь в традициях Банстура десятилетиями скитаний, — заставляет задуматься и вдохновляет."

 ##############################
 # NICKNAME
 ##############################

 nick_the_banstur_founder:0 "Основательница Коллегии"
