 ## MEN-AT-ARMS ##


 shamans: "Shamans"
 shamans_flavor: "#F The [Concept('aversaria','Imperial')|E] term for non-Aversarian [magi|E] ranging from ancient mountain hermits to the common practitioners of the tribes and clans of [aeras|E]. While relatively common, gathering them in number has proved historically challenging, and their diverse talents often makes them less efficient than dedicated battle Magi.#!"

 magi_regular: "Hedge Magi"
 magi_regular_flavor: "Though not as powerful, knowledgeable, or well-trained as their [Concept('aversaria','Imperial')|E] counterparts, hedge [magi|E] flock in larger numbers at the sight of coin.#!"

 sjalvolki_waymakers: "Waymaker Pathfinders"

 sjalvolki_berserkers: "Berserkers"
 sjalvolki_berserkers_flavor: "The pride of every Clan, these terrifying shock troops become all consumed by a Berserker fury like none other on the battlefield, cutting a bloody path through their enemies.#!"

 moonkin: "Moonkin"
 moonkin_flavor: "The Moonkin are followers of the Mondecny ways who have been blessed before the many faces of [aervalr|E]. Masters of all eight of the fighting styles, they are both a beautifully graceful and terrifyingly destructive sight on the battlefield.#!"

 wodes: "Wodes"
 wodes_flavor: "These warriors believe not in armor, but in tattoos they claim give them mystical protection. Frenzied and likely mad, their bravery and ferocity can never be doubted.#!"

 bloodbound: "Bloodbound"
 bloodbound_flavor: "Squadrons of soldiers sworn in brotherhood with each other in the name of Deiphartoros, the Bloodbound have sworn an oath of vengeance against all who have done injustice to the Iyrossi. They fight with a terrifying tenacity, using tactics inspired by their [Concept('aversaria','Aversarian')|E] oppressors.#!"

 legion_raiders: "Legion Raiders"
 legion_raiders_flavor: "Legion Raiders are lightly armored and equipped for fast maneuvers and raiding rather than more traditional close formation fighting, a tactic developed from experience over centuries of putting down poorly equipped slave revolts.#!"

 legion_marines: "Marine Legions"
 legion_marines_flavor: "The most poorly paid, overlooked, and disparaged legions in [Concept('aversaria','Aversaria')|E], the Marine Legions nevertheless maintain a combat record rivaling even the State Legions. Patrolling some of the most treacherous and pirate-infested waters of the world, Marine Legionnaires often see dozens of battles by the time their land-bound counterparts experience their first.#!"

 mountainstrikers: "Mountainstrikers"
 mountainstrikers_flavor: "Though their homeland has been left behind, Goan skill at alpine combat remains, and they continue organize into elite teams of Mountainstrikers. As they march in search of a new home, they will assist their people in overcoming the strongest barriers.#!"

 huntsmen: "Huntsmen"
 huntsmen_flavor: "To a Kardwen huntsman there is no man or beast, only prey. Adorned with the heads of those unable to escape them, few have seen a Kardwen hunting party, and even fewer live to tell the tale."

 tsanruti: "Tsanruti"
 tsanruti_flavor: "Tsanruti bands form the primary defence of Charchac strongholds, scouting out foes with excellent precision. Whilst many have turned to banditry since their formation, Tsanruti are still employed by Charchac communities in need of protectors.#!"

 kanpahuri: "Kan'pahuri"

 waranuux_spearmen: "Waranuux Spearmen"
 waranuux_spearmen_flavor: "The battle-hardened spearmen of the waranuux, who train from their youth in battle, are near-fearless in battle. They fight with finely-crafted spears, wielding them in a beautiful, deadly dance, carving great swathes into enemy lines.#!"

 advanced_waranuux: "Standardized Waranuux"
 advanced_waranuux_flavor: "Equipped with high-quality equipment and maintaining a strict discipline, the modern advancements of the waranuux have raised them even further above the common soldier. The trail of carnage they carve through any who stand in their way at times have been compared to the effects of a storm.#!"

 napaq: "Napaq"
 napaq_flavor: "Trained to minimize the damage of raids as much as possible, the Napaq maintain a loose, versatile formation"

 golden_spears: "The Golden Spears"
 golden_spears_flavor: "Elite soldiers trained and drilled in the massive cities of Adabyss, the Golden Spears form the front line of every Adabyssian military. Trained and drilled for years before seeing battle, each soldier desires nothing more than to bring glory to their Empire.#!"

 konijkmener_pikes: "Konijkmener Pikes"
 konijkmener_pikes_flavor: "The various militia's of the Konijkemener have long held the river-borders against the Marchers to ensure the independence of their homelands. Disciplined and well drilled, the pikes of the Republic will not falter.#!"

 pure_pikes: "Pikes of the Purest"
 pure_pikes_flavor: "With five meter long pikes and a reputation for suicidal bravery, these pikemen are a mainstay in Opakhasian armies. Opakhasian strategy manuals state as fact that these are the only soldiers in [aeras|E] who can reliably hold against charging Marcher knights.#!"

 jokhosani: "Jokhosani"
 jokhosani_flavor: "The Jokhosani wield long pikes, nearing eight meters in length, and are never forgotten when Amaghea raises its armies. Whilst not renowned for their bravery, the Jokhosani are known to leave few enemies alive when they take to the field.#!"

 kaphral: "Kāphral"
 kaphral_flavor: "Kāphral are skilled with all manner of blades, but their speciality is the spear; short and swift, the Duibindir they utilise has sharp stakes at either end.#!"

 rearka: "Re'arka"
 rearka_flavor: "Skilled with spears, the Re'arka are experts at protecting the caravans they guard"

 crimson_spears: "Crimson Spears of Korlacu"
 crimson_spears_flavor: "With their crimson-tipped weapons and blood-red regalia gleaming in the sunlight, the Crimson Spears march into battle as a symbol of defiance and wrath, their every strike fueled by the blood of their sacred oaths."

 molten_vanguard: "Spears of the Sacred Flame"
 molten_vanguard_flavor: "The Spears of the Sacred Flame wield weapons that have been forged in the sacred fires of Korlacu's Fire Temple. On the battlefield, the very air around this fearsome group of warriors is said to burn with divine fury, their advance as unstoppable as the flames they command."

 darksteel_bombards: "Darksteel Bombards"
 darksteel_bombards_flavor: "Forged in the searing heat of the Forge of Korlacu, using the rare ores extracted from the fully restored Korlacan mines, the Darksteel Bombards are the pinnacle of Korlacan ingenuity. These fearsome siege weapons, crafted from an alloy as unyielding as the faith of their creators, can shatter walls and break armies. They are a symbol of the might of civilization, proof that industry and progress reign supreme over the chaos of the wild.#!"

 darksteel_colossi: "Darksteel Colossi"
 darksteel_colossi_flavor: "Towering constructs of metal and fire, the Darksteel Colossi are forged in the sacred furnaces of the Forge of Korlacu. Animated by the unyielding will of Korlacan industry and powered by the rare alloys from restored mines, these mechanical behemoths embody the triumph of progress over nature. Designed to crush armies and terrify enemies, they march as living monuments to the glory of civilization and the enduring strength of the Eternal Flame.#!"

 adventurers_maa: "Adventurers"
 adventurers_maa_flavor: "Hailing from far and wide, adventurers are thirsty for loot and a new land to call home."

 marcher_anti_mage: "Anti-Magi"
 marcher_anti_mage_flavor: "The best the Marcher Kingdoms have to offer, these troops are expertly trained in resisting the arcane and slaying [magi|E].#!"

 slayers: "Slayers"
 slayers_flavor: "Professional monster-hunters who sell their expertise to whoever can meet the price, and who fear the arcane less than most."

 grave_wardens: "Grave Wardens"
 grave_wardens_flavor: "Heavily armed wardens of the Ojyczaynz dead, these warriors are known for their great armor and greater charge.#!"

 flying_lances: "Flying Lances"
 flying_lances_flavor: "Legendary Ojyczaynz knights, tales tell of a time when the wings atop their back would ignite in flame and give them flight. While this art has been forgotten, their mastery with lance and horse has not.#!"

 the_bloodied: "The Bloodied"
 the_bloodied_flavor: "The Bloodied are soldiers of the Iyrossi who have killed at least three [Concept('aversaria','Aversarians')|E]. Their armor and bows are covered in various ancient Iyrossi symbols the Aversarians long thought forgotten, all drawn in the Iyrossi's former master's blood.#!"

 grove_guardians: "Watchers of the Sacred Grove"
 grove_guardians_flavor: "Masters of concealment, the Watchers of the Sacred Grove move in perfect harmony with the jungle itself, and they are known to wreak havoc upon unwanted visitors."

 jerniems_rangers: "Jerniem's Rangers"
 jerniems_rangers_flavor: "Skilled trackers and masters of the wild, Jerniem's Rangers patrol the outskirts of the Sacred Grove, ensuring no harm befalls its sacred grounds."

 prophets_sons: "Prophet's Sons"
 prophets_sons_flavor: "Elite warriors of noble blood, the Prophet's Sons all hail from minor and major Amsari households claiming descendence from the Prophet. Each fights for the honor of not only their house, but their entire people.#!"

 marcher_knights: "Knights of the Way"
 marcher_knights_flavor: "Knights of the Way are Marcher knights who have dedicated themselves to perfection in the Way of Swords, Nullification and Justice. Normally hailing from noble households, their adherence to the protection of their people and their lords is legendary.#!"

 brother_riders: "Brother Riders"
 brother_riders_flavor: "Brother Riders are Sjalvolki inspired by the more structured warrior orders they found and fought in the west. Clan brothers who have taken horse and spear, they now ride across the Clanlands and further to find glory and keep the countrysides as safe as can be managed.#!"

 aversarian_legionaires: "New City Armsmen"
 aversarian_legionaires_flavor: "The [Glossary( 'Aautokrata', 'GH_AAUTOKRATA_GLOSS' )] is dead, and yet [Concept('aversaria','Aversaria')|E] lives. While the the legions have been buried along with the empire in the new coast, their descendents still arm themselves on behalf of their free cities and their new migrant overlords.#!"

 autocrossbowmen: "Automatic Crossbowmen"
 autocrossbowmen_flavor: "The Mundimbi are considered the elite of the vast Adabyssian military. Wielding strange golden crossbows, the devices they wield are startlingly accurate and can loose multiple bolts without reloading, thanks to a curious mechanism that feeds in new bolts from an attached box.#!"

 kikarsag_heavy_cav: "Kikarsag Proven Riders"
 kikarsag_heavy_cav_flavor: "Clad in fearsome masked armor and riding heavily barded horses, common soldiers sometimes mistake Proven Riders for a bizarre form of golem when seen from afar. Their deadly charges and peerless heavy cavalry tactics usually mean there are few survivors able to dispute this conclusion.#!"

 home_legions: "Home Legions"
 home_legions_flavor: "The ancient heart of [Concept('aversaria','Aversaria')|E] still beats with martial fervor. While the Legions of old marched away to die at the Battle of Elysian Pass, their counterparts in the Home Legions carry on many of their traditions and fighting styles.#!"

 legion_outriders: "Legion Outriders"
 legion_outriders_flavor: "The endless plains of [Concept('aversaria','Eastern Aversaria')|E] present a military challenge like nothing else on the continent. In this land the Outriders have developed a fearsome reputation for their husbandry. They travel like nomads, relying on nothing but their mares for weeks at a time.#!"

 north_shields: "Shields of the North"
 north_shields_flavor: "These elite infantry are almost unrecognizable as [Concept('aversaria','Aversarian')|E] Legionnaires. Banners sporting barbarian sigils and topped with strange idols fly as equals alongside traditional Aversarian symbols. These oddities do little to blunt their prowess in combat.#!"

 duneriders: "Duneriders"
 duneriders_flavor: "Having adopted wholesale the locals' methods of fighting, Duneriders appear as if from nowhere and melt back into the desert as soon as their bloody work is complete. Some spit on them as having 'gone barbarian' but none can doubt their brutal effectiveness.#!"

 stoneforged: "Stoneforged"
 stoneforged_flavor: "The Stoneforged are a modern adaptation of the ancient Goan Mountainstrikers, now armed with more advanced equipment and expanded to greater numbers. Though they sacrifice some of the mobility of their predecessors, they have more than made up for it in hitting power, and none can claim that there are any more deadly opponents on the heights.#!"

 cloud_riders: "Cloudriders"
 cloud_riders_flavor: "#F Sarminian horsewomen were feared across the Kathuni steppe, and now they bring their prowess to [Concept('aversaria','Aversaria')|E]. They are some of the Continent's most peerless archers, rumoured to be able to put out a man's eyes at two hundred paces at full gallop.#!"

 sunstriders: "Sunstriders"
 sunstriders_flavor: "#F The new way of Saminian war is of heavy shock cavalry overrunning any armies foolish enough to stand in their way. Their discipline and skill at arms rivals even that of the legendary Marcher Knights.#!"

 observant: "Observants"
 observant_flavor: "The Observants are a group of warrior-monks that have long been associated with the Huegodocs. They view battle as merely another experience the Dreamer, and have become skilled archers so that they can both participate and observe said conflicts.#!"

 huegodoc_legion: "Huegodoc Legions"
 huegodoc_legion_flavor: "Were one to see the legions marching through Huegodoc cities, one would be forgiven for believing the [Concept('aversaria','Aversarians')|E] had returned. Instead, they have formed their own legions, hoping to mirror the Aversarians' success militarily.#!"

 war_mammoth: "Warisnik Mammoth Riders"
 war_mammoth_flavor: "#F Adorned with ritual tattoos and markings, these mammoths bring the fury of the [Glossary( 'Old North', 'OLD_NORTH_GLOSS' )] to the battlefield!#!"

 mubaaizun: "Mubaaizun"
 mubaaizun_flavor: "A mubaaizun is a champion of a [Concept('sarradon','Sarradonian')|E] army; often the best warriors of a lord will participate in a ritual duel before the battle commences, fighting to the death. These duels are often accompanied with each army chanting or insulting one another, and there have been instances — such as the [battle_of_the_mubaaizun_fix|E] - where multiple duels happen before battle commences, often to avenge a dead mubaaizun."

 krialetil: "Krialetil"
 krialetil_flavor: "The Krialetil are the guardians of the Armazli Mountains, and have been the greatest defenders of Amaghea since the days of Parnaz 'the Great'. Krialetil regiments are trained to die before surrendering an inch of ground to their enemies.#!"

 tskherosan: "Tskherosan"
 tskherosan_flavor: "The favored warriors of Mahratians, Tskherosan riders are known for their speed and ruthlessness across Amaghea.#!"

 sahkmavali: "Sahkmavali"
 sahkmavali_flavor: "The guards of the hidden temples of Aygaea, Sahkmavali often serve in groups no larger than fifty men. However, despite their small size, Sahkmavali are masters of mountain warfare whose skill is hard to equal in their home territory.#!"

 mezilachitnen: "Mezilachitnen"
 mezilachitnen_flavor: "Trained to use a longbow as part of court ritual, the most skilled warriors of the Draneti have always been chosen to serve as the Mezilachitnen. Whilst few, they are the pinnacle of Amaghean archers.#!"

 talabhau: "Talabhāu"
 talabhau_flavor: "Talabhāu once served as the elite guards of the Vanēlāmāk Haytrakhati; in its absence, any worthy prince may call upon them.#!"

 visvasavrak: "Viśvāsavrak"
 visvasavrak_flavor: "Initially founded to defeat hordes of the undead, the Viśvāsavrak fight to the death in complete loyalty to their liege lord."

 rayakuux_archers: "Rayakuux Archers"
 rayakuux_archers_flavor: "With their experience traveling through varied climates, rayakuux archers are known for their ability to adapt to any terrain. Their arrows will appear from the gaps between trees, and the unseen archers will watch as their targets fall.#!"

 advanced_rayakuux: "Rayakuux Corps"
 advanced_rayakuux_flavor: "Finely-disciplined and hardened by varied adventures, the Rayakuux Corps take the skills of their predecessors to another level. Terrain is no barrier to them, and their arrows will hit home, even through the densest forest.#!"

 mezzarb_riders: "Mezzarb Riders"
 mezzarb_riders_flavor: "Mounted upon sturdy Mezzarb goats, these riders can easily handle terrain that would hobble most horses"

 shemota_warriors: "Shemota Warriors"
 shemota_warriors_flavor: "Donned in flexible and durable fiber armor, Shemota warriors are able to be heavily armored and yet sill highly mobile"

 ahbshaani_devouts: "Ahbshaani Devouts"
 ahbshaani_devouts_flavor: "Astride there monsterous lizards mounts, these holy warriors follow only the call of Ohrasik"

 sarradon_imitation_legion: "Sarradonian Imitation Legion"
 sarradon_imitation_legion_flavor: "Sarradonian levies drilled in the old imperial fashion — competent in the open field, though never quite the equal of the legions they imitate."

 enlevett: "Enlevetts"
 enlevett_flavor: "Clad in black armor and dark masks, the Enlevetts are the elite of every Canian army. Trained from a young age in the art of close combat and masters of the war scythe, these disciplined warriors carry scythes designed for one-handed use.#!"

 theugombrian_warrior_kinband: "Warrior Kinband"
 theugombrian_warrior_kinband_flavor: "Composed of bonded kingroups of young men, Kinbands range far and wide, selling their services to the highest bidder, fighting with metal armor and nearly suicidal bravery. Those bands who survive form the nucleus of future Theugombrian lineages."

 theugombrian_iron_brotherhood: "Iron Brotherhood"
 theugombrian_iron_brotherhood_flavor: "Steeped in the arts of metal and war magic, Theugombrian Iron Brotherhoods are kinbands formed around magi bloodlines, fighting with both spell and sword. Their rites are known to enhance the bite of a blade such that it can cut through mail like paper."

 leki_herdmasters: "Leki Herdmasters"
 leki_herdmasters_flavor: "Pastoralists by nature, in times of need the Leki people pick up their arms and form elusive skirmisher warbands. Putting their knowledge of the lay of the land to a more martial use, they strike hard and fast, disappearing into the surrounding terrain before the enemy can mount a response."

 bronzecast: "Bronzecast Mortars"
 bronzecast_flavor: "The pinnacle of Dahangon bronze metallurgy, the Bronzecast are enormous and intricately carved cannons that make use of gunpowder to fire metallic projectiles to lay waste to the strongest of walls."

 thorn_maidens: "Thorn Maidens"
 thorn_maidens_flavor: "Honed through a lifetime of strict martial training, the elite warriors of the Dayarka are said to bear the strength of ten men, and are feared for hunting down their foes from their unseen jungle canopies."

 death_seekers: "Death-Seekers"
 death_seekers_flavor: "[death_seekers|E] are master swordsmen who can easily cut down both men and horse alike."

 sidharakyan: "Sidhārakyan"
 sidharakyan_flavor: "Sidhārakyan are masters of using their curved axes to cut down lightly armored foes that trespass on their shores."

 dhageray: "Dhā'geray"
 dhageray_flavor: "Dhā'geray Warriors are famous for their loyalty, and for fighting to the death. Once their leader falls, their entire retinue of warriors are expected to die with them."

 bluescars: "Bluescars"
 bluescars_flavor: "The feared warriors of the Talareg are marked with tattoos of an unknown blue dye and feared for the ferocity."

 azmaram: "Azmaram"
 azmaram_flavor: "The Azmaram march in lockstep, advancing on their enemies with an impenetrable wall of gleaming shields and keen sarissas."

 lujian: "Lujian"
 lujian_flavor: "Raised by local magistrates across Kathun, the Lujian form the backbone of countless armies. Their equipment varies from province to province, but their numbers alone make them an indispensable force."

 tetukor: "Tetukor"
 tetukor_flavor: "Far from the open steppe, Kathuni beast riders mastered the jungles by taming giant spiders. Swift and elusive, the Tetukor strike where mounted warriors are least expected."

 kathuni_tetukor: "Tetukor"
 kathuni_tetukor_flavor: "Far from the open steppe, Kathuni beast riders mastered the jungles by taming giant spiders. Swift and elusive, the Tetukor strike where mounted warriors are least expected."

 yamen_troops: "Yamen Troops"
 yamen_troops_flavor: "Once the household guards of Kathuni governors, the Yamen Troops have grown into heavily armored professionals renowned for their discipline and unwavering loyalty."

 ding: "Ding"
 ding_flavor: "Chosen to serve directly beneath the Dragon Emperor, the Qibing are mounted warriors for whom honor is measured only by victory"

 qibing: "Qibing"
 qibing_flavor: "Chosen to serve directly beneath the Dragon Emperor, the Qibing are mounted warriors for whom honor is measured only by victory."

 chinlin_iron_elephant: "Chinlin Iron War Elephant"
 chinlin_iron_elephant_flavor: "Clad in immense plates of iron too heavy for any man to bear, the Iron Elephants of Chinlin are living battering rams. Few battle lines can withstand the thunder of their charge."

 guoren_fire_lancers: "Guoren Fire Lancers"
 guoren_fire_lancers_flavor: "Armed with blazing fire lances, the Guoren are as feared for their courage as for their weapons. No sacrifice is too great in pursuit of Xin Xue."

 green_watchers: "Green Watchers"
 green_watchers_flavor: "Veterans of many an invader, the Green Watchers are the answer of the Clanlanders to the various invasions from both Marchers and Aversarians. They are experts of guerilla warfare, and know well the weaknesses of their various overlords."

 owl_men: "Owl Men"
 owl_men_flavor: "Bearing the famous owl masks of the Ordikin, these warriors are masters of both hunting and assymetric warfare, and have been the end of many an Aversarian and Marcher."

 spirit_regular: "Spirits"
 spirit_regular_flavor: "Bound echoes of the departed, dangerous in number but unravelling entirely wherever the arcane is choked off."

 raised_undead: "Raised Undead"
 raised_undead_flavor: "Freshly-turned dead pulled from whatever ground lay nearest, of little use beyond their numbers and their willingness to keep walking onto blades."

 jaanvarkis: "Jaanvarkis"
 jaanvarkis_flavor: "Moulded by years of hunting, these veterans of the forest are known for their skillful yet swift style of fighting- earning the name Vyuharaksha or 'Gliding reavers' by their enemies. With sufficient training in contemporary warfare, they become expert skirmishers."

 oltenic_horse_archers: "Öltenic Horse Archers"
 oltenic_horse_archers_flavor: "Öltenic Archers descend from warrior traditions learned since the [aironoian_migration|E]. They are known to be deadly and accurate, and have maintained control over the steppe because of it."

 oltenic_spearmen: "Öltenic Spears"
 oltenic_spearmen_flavor: "Öltenic Spears have long specialized in unique fighting styles to combat the ferocious horse lords of Aironoi."

 oltenic_light_horsemen: "Öltenic Riders"
 oltenic_light_horsemen_flavor: "Öltenic Riders descend from warrior traditions learned since the [aironoian_migration|E]. These riders were considered some of the finest in [aversaria|E]."

 cavern_ram: "Battering Cavern Ram"
 cavern_ram_flavor: "The Battering Cavern Ram is designed to exploit the close confines of underground warfare. The weapon is constructed low and braced against tunnel walls, giving it a devastating force in corridors where surface siege engines would be useless. In open air, however, the obsidian head is too heavy to maneuver correctly, and the frame lacks the anchor points it depends on."

 tension_trebuchet: "Tension Trebuchet"
 tension_trebuchet_flavor: "Rather than the falling counterweight that powers traditional trebuchets, the Tension Trebuchet uses enormous braided ropes of fungal sinew cultivated in the humid underground where it retains elasticity. The design is optimized for breaching walls beneath the [Glossary('Mayikrata','mayikprolollan_encyclopedia_desc')]. Dragged above ground, the dry air causes the fungal rope to seize, rendering the weapon almost entirely useless."
 sarathem_magi_flavor: "Sarathem [magi|E] fight as a single instrument, their combined workings capable of unmaking a battle line before it ever closes."
 adventurers_flavor: "Hailing from far and wide, adventurers are thirsty for loot and a new land to call home."

 legend_hunters: "Legend Hunters"
 legend_hunters_flavor: "Well-armed and seasoned veterans, these adventurers are fit to challenge the mightiest monsters on [aeras|E]."

 war_chariots: "War Chariots"
 war_chariots_flavor: "Drawn by between one to three horses depending on size, war chariots are capable of both smashing through enemy lines and picking them off from range.#!"

 beetle_rider: "Scarab Chariots"
 beetle_rider_flavor: "The Scarab Charioteers of [Glossary('Kemsar','kemsar_encyclopedia_desc')] have struck fear across the harsh sands of western [sarradon|E] since before recorded history."

 beetle_knight: "Scarab Riders"
 beetle_knight_flavor: "Scarab Riders of [Glossary('Kemsar','kemsar_encyclopedia_desc')] have struck fear across the harsh sands of western [sarradon|E] since before recorded history."

 golem_infantry: "Adabyssian Golems"
 golem_infantry_flavor: "The Golden Statues of Wolmbaz-nza, or the City of Golden Towers, march at the height of nearly two men. Crafted from golden metals and powered by a mix of clockwork and unknown magic, they are a devastating sight on the battlefield. Some superstitious soldiers claim that when one puts an ear to their chest, you can hear panicked whispers in ancient tongues...#!"

 stone_golems: "Stone Golems"
 stone_golems_flavor: "Quarried whole and given crude purpose. Slow, patient, and very nearly impossible to stop once set upon a wall."

 metal_golems: "Metal Golems"
 metal_golems_flavor: "The costliest of the constructs and the deadliest, wrought of worked steel and moving with a precision no living smith could match."

 ice_golems: "Ice Golems"
 ice_golems_flavor: "Hewn from glacier-ice and bound with frost, unstoppable in the cold north and pitiful anywhere the sun has teeth."

 magma_golems: "Magma Golems"
 magma_golems_flavor: "Molten rock held within a crust of cooling stone, leaving scorched footprints and setting alight anything unwise enough to close with them."

 siege_golems: "Siege Golems"
 siege_golems_flavor: "Titans of clay and stone made animate by the energies of [aervalr|E], siege golems are of devastating entire regiments by their lonesome.#!"

 bronze_golems: "Bronze Golems"
 bronze_golems_flavor: "Cast in the old foundries and set walking by ritual, bronze golems shrug off blows that would fell a dozen men — and batter down the gate besides."

 griffon_riders: "Griffon Riders"
 griffon_riders_flavor: "The flower of Marcher chivalry. The death of many a foe to Chevalie has been heralded by a bright flash from a clear sky followed shortly thereafter by the war cries of a death diving squadron of Griffon Riders, armor blazing with the reflected sun.#!"

 griffon_silencers: "Griffon Anti-Magi"
 griffon_silencers_flavor: "The honor of riding a griffon into battle is afforded to only the best of the fighting men the Anti Magic Orders can muster. They circle the battlefield, swooping downwards to pick off vulnerable [magi|E].#!"

 airships: "Airships"
 airships_flavor: "An entirely Adabyssian design, based on concepts and technologies recovered from the City of Golden Towers. Airships are considered insanity by people of the north, but have increasingly become the norm in the jungles of the south, ferrying soldiers and striking cities from above.#!"

 seraph_melacham: "Melacham"
 seraph_melacham_flavor: "Winged and burning-eyed, the Melacham fall upon an army from above and are gone again before the survivors can name what struck them."

 dragonriders: "Dragonriders"
 dragonriders_flavor: "Those few who have bound a dragon to their will — and the far fewer who have survived the arrangement long enough to ride it to war."

 cultists_maa: "Cultists"
 cultists_maa_flavor: "#F For as long as there has been faith on [aeras|E], there have been those [magi|E] who perform their [Concept('magic','Rituals')|E] where gods and man ne'er watch.#!"

 raving_zealots: "Raving Zealots"
 raving_zealots_flavor: "#F While practicing [magic|E] normally requires a level of expertise requiring a competent and trained [magi|E], there have always been those mad enough to play with powers far beyond themselves for purposes nefarious and glorious.#!"

 arcane_auxiliaries: "Arcane Auxiliaries"
 arcane_auxiliaries_flavor: "Experts in their chosen school of magic, the deployment of [magi|E] on the battlefield can turn a simple skirmish into an ocean of fire and death.#!"

 partic_seers: "Partic Seers"
 partic_seers_flavor: "Trained druids and their acolytes, the Seers of the Partic faith intensely follow the secret orders and commands of their Council to the letter. While their motives are unknown, their power is not.#!"

 whisperers: "Whisperers"
 whisperers_flavor: "The Whisperers are [fogeaters|E] blessed (or cursed) with the 'gift' of magic. Seemingly jabbering insane ruins of what were once men and women, they summon forth the [Concept('the_fog','Fog')|E] and unleash devastating magic upon the battlefield.#!"

 veiled: "Veiled"
 veiled_flavor: "The mysterious witches of the Gastanwoder swamps are rarely seen by any, but when they choose to gather they are sure to let the outsiders know why they are to be feared.#!"

 stepwalkers: "Stepwalkers"
 stepwalkers_flavor: "[magi|E] cults renowned for their secrecy — or brazen lack thereof depending on the sect to which they owe allegiance. Regardless of their diversity, these groups maintain some of the oldest and most esoteric magical traditions in Sarradon.#!"

 markwardens: "Markwardens"
 markwardens_flavor: "Lithe and swift, the Markwardens inflict touch-based curses and marks to their enemies to devastating effect."

 sandsingers: "Sandsingers"
 sandsingers_flavor: "The Sandsingers of the Tafara are masters of sand [magic|E], utilizing rituals kept secret amongst the tribes through oral traditions guarded since before the rise of the [Concept('the_first_warden','First Warden')|E]."

 redland_cultists: "Redland Cultists"
 redland_cultists_flavor: "Some are but a few decades old, but most have passed one century or many. Undying, their inhuman forms twist into purpose at the beck and call of the dread gods that these [magi|E] worship. They kill to grow stronger, for the Void hungers for the erasure of all things. Lives especially."

 willing_acolytes: "Willing Acolytes"
 willing_acolytes_flavor: "#italic It seems there is something lost during the forcible possession of a mind, for why else would the shades prefer the willing as vessels?#!\n -Amnaxos the Chronicler, \nObservations.\n Chapter II."

 fogbeasts: "Fogbeasts"
 fogbeasts_flavor: "[fogbeasts|E] are abominations that have followed the Garformdaer out of the [Concept('the_fog','Fog')|E]. They come in a variety of forms, from small scuttling things to massive leviathans, all borne only from the deepest fears of the living and dead, past, present, and future....#!"

 woodland_hydra: "Woodland Hydra"
 woodland_hydra_flavor: "A many-headed horror of the deep forest, each severed neck answered by two more. Whole warbands have been swallowed piecemeal by a single specimen."

 war_hounds: "War Hounds"

 maples_marauders: "Maple's Marauders"

 nascent_shadehosts: "Nascent Shadehosts"
 nascent_shadehosts_flavor: "#italic Daelinioxes had not expected to see his son again. His prescence across the battlefield, ten years after his disappearance, was quite a shock. But as little Mychios ran towards his father, he did not answer any call. And as he sunk his blade through organ and flesh, there was no love Daelinioxes saw behind those once-bright eyes. There was no recognition, no sorrow, no fear- not even hate. But there was something.#!"

 manifestations_of_fear: "Manifestations of Fear"
 manifestations_of_fear_flavor: "People often claim a great fear of things like spiders or heights. The more honest ones may claim fear of death, or their beloved growing to hate them. But the truest fear, so terrifying it cannot even be thought, is whether or not they truly exist. The Redlanders have made this fear manifest, and will force their enemies to confront it."

 chasm_terrors: "Chasm Terrors"
 chasm_terrors_flavor: "The Redlands are filled with an assortment of the most terrifying and evil creatures known on [aeras|E]. Sentient corpse-filled chasms, swarms of giant wasps that grow for weeks within living hosts, many-armed eyes that crawl across the walls and open gaping tooth-filled maws within their pupils... only the Redlanders seem to somehow be able to tame them from war, which sadly means that even those who wisely stay as far away from the Redlands as possible may not be spared the terrors within."

 lesser_voidspawns: "Lesser Voidspawns"
 lesser_voidspawns_flavor: "Ragged fragments of somewhere else, spilling through the thin places of the world and hungering above all for those who work the arcane."

 marrowdrones: "Marrowdrones"
 marrowdrones_flavor: "Marrowdrones are the Maw's hunters, posited to overwhelm anything that can oppose the spread of the Fleshcurse. Encased in a bone exoskeleton, they shrug off mortal blows to deliver a storm of launched bone spikes followed by a crushing charge."

 hungering_mouths: "Hungering Mouths"
 hungering_mouths_flavor: "Most favored among the Maw's children, the Hungering Mouths are colossal amalgamations of flesh and bone, heralding the advent of the Fleshcurse. Countless fangs, talons, and bone spikes emerge from their hulking bodies, consuming everything around these monstrosities in a futile bid to sate their endless hunger."

 living_pits: "Living Pits"
 living_pits_flavor: "#italic Report, Legan. There seem to be some... holes moving towards us.\nDistance? Speed? Size?\nAbout two days ride east - faster than a man but slower than a horse - and about the size of Asiupol' town square. Have you seen these before, Ma'am?\nNo. But, in this horrid place, it's better to prepare than waste time with futile disbelief. Now gather the men, we march north in one hour.#!"

 archonarachs: "Archonarachs"
 archonarachs_flavor: "Courtiers, retainers, and valets of the Spider Court, Archonarachs are rarely seen on [aeras|E] outside of the hunting parties and bloodsports organized by their nobles. As large as a fully grown warhorse, each of their arachnid limbs ends in a chitinous hand with deadly talons strong enough to dent metal. Archonarachs craft silk-woven faces for themselves and place them in front of their cephalothoraces, taking great offense when not addressed by their created persona."

 spider_jockeys: "Spider Jockeys"
 spider_jockeys_flavor: "#italic "The scholars and so called 'experts' have proposed many theories about the spiderbound Cult-Knights: By hiding on their backs a Knight can avoid their fangs, it is the fulfillment of a pact to the Spider-God, it strikes more fear into their enemies... I think the explanation is simpler- riding a giant spider seems awesome."#!"

 blade_tendrils: "Blade Tendrils"
 blade_tendrils_flavor: "Blade Tendrils are the most numerous of the Maw's spawn, and by far the weakest. Sprouting from any corpse that comes into contact with the contaminated flesh, they take over their host in a violent explosion of gore and brain matter, standing up as a shambling humanoid cadaver with a long whip-like tentacle in place of their head."

 night_gaunts: "Nightgaunts"
 night_gaunts_flavor: "Faceless and silent, they descend on a camp between one breath and the next, and are gone again before the alarm can be raised."

 voidhosts: "Voidhosts"
 voidhosts_flavor: "Perhaps once human, Voidhosts are now 'living' fonts of entropy. Hooded figures that spell doom across any land they walk, tales tell of travelers who lower their hood within temples and cities and devour thousands into the hellish darkness of the void that now composes their body. When the Redlanders march to war, hundreds of Voidhosts can be spotted, and the world thus trembles in fear."

 enfleshed_grotesquerie: "Enfleshed Grotesquerie"
 enfleshed_grotesquerie_flavor: "The Grotesquerie is a hideous mass of sinew and bone, composed of lesser cultists, slaves, and any beasts that were sublimated into the mass. Its grotesque form strikes fear in any who stand against it, and most choose to surrender to its fleshy embrace."
 skeleton_flavor: "Bare bone held together by little more than intent — cheap to raise, and cheaper still to lose."

 skeleton_archers: "Skeleton Archers"
 skeleton_archers_flavor: "Fleshless fingers nocking arrows with mechanical patience. What they lack in judgement they repay by never flinching from the volley returned."

 elite_undead: "Elite Undead"
 elite_undead_flavor: "#F Endowed with vastly more strength, intelligence and autonomy than the average undead drone, these formidable creatures are adept at dealing with situations where sheer quantity is not an adequate solution on its own.#!"

 spirits_of_the_horn: "Spirits of the Horn"
 spirits_of_the_horn_flavor: "The Spirits of the Horn are long dead and mighty warriors that had pledged their battle-hardened souls to [Glossary('Velos','VELOS_GLOSS')]. They are said to be in service of the Black Horn for all time, coming to aid those who are in need of their power."

 undead_skirmishers: "Undead Horde"
 undead_skirmishers_flavor: "#F Large swarms of nearly mindless risen dead, dangerous moreso for their large numbers than skill in combat.#!"

 undead_bowmen: "Undead Bowmen"
 undead_bowmen_flavor: "#F Large swarms of nearly mindless risen dead, dangerous moreso for their large numbers than skill in combat.#!"

 undead_light_horsemen: "Undead Light Horsemen"
 undead_light_horsemen_flavor: "Spectral riders atop skeletal steeds, these undead light horsemen retain the speed and mobility they possessed in life. Summoned through [death_i|E] magic, they serve as swift scouts and flanking forces."

 undead_pikemen_unit: "Undead Pikemen"
 undead_pikemen_unit_flavor: "A hedge of rusted points held by arms that will not waver. Cavalry breaking against them finds nothing to rout, only more pikes behind the first."

 undead_armored_footmen: "Undead Armored Footmen"
 undead_armored_footmen_flavor: "The household guard of some long-dead lord, still wearing his colours."

 undead_armored_horsemen: "Undead Armored Horsemen"
 undead_armored_horsemen_flavor: "Barded corpses in the harness they were buried in, striking open ground with all the weight of a living charge and none of its hesitation."

 undead_crossbowmen: "Undead Crossbowmen"
 undead_crossbowmen_flavor: "Crank, load, loose, repeat. The dead make poor marksmen but tireless ones, and a crossbow asks very little of the hands that hold it."

 undead_horse_archers: "Undead Horse Archers"
 undead_horse_archers_flavor: "Dead riders on dead mounts, loosing arrows in an endless circling gallop. They never tire, never break, and never dismount to rest."

 undead_camel_rider: "Undead Camel Riders"
 undead_camel_rider_flavor: "Desert-bred camels raised alongside the men who once rode them, shambling on through heat and thirst that would have killed them twice over in life."

 undead_war_elephant: "Undead War Elephants"
 undead_war_elephant_flavor: "Rotting behemoths driven forward by the will of their binder, tusks still splintering shields long after the beast has ceased to feel the blows it takes."

 undead_dragon: "Undead Dragon"
 undead_dragon_flavor: "#F Dragons once roamed freely across the skies of [aeras|E] before their [Concept('war_of_the_thousand_dragons','extinction')], but no more. Now these ferocious monsters of terror incarnate have been brought back from the dead.#!"

 undead_worldeater: "Undead Worldeater"
 undead_worldeater_flavor: "#F The end of all things given rotting shape, dragged back into the world by [magic|E].#!"

 fog_spirits: "Fog Spirits"
 fog_spirits_flavor: "Whispering shadows and screeching faces in the [Concept('the_fog','Fog')|E], [Concept('the_fog','Fog')|E] Spirits are an exception of the [Concept('the_fog','Fog')|E]. Not men or the creations of their mind, they are something from a time long past. Ethereal and vengeful in equal amounts.#!"

 leshens: "Leshens"
 leshens_flavor: "Ancient guardians of root and antler, older by far than the peoples who fear them. Walls mean little to a thing the forest itself steps aside for."

 water_elementals: "Water Elementals"

 air_elementals: "Air Elementals"

 dekakyanat: "Dekakyanat"
 dekakyanat_flavor: "Since time immemorial Great Men of Nattanan have had their faces carved into stone heads placed near their settlements. Some are [Glossary('Dekakyanat','GH_DEKAKYANAT_GLOSS')] in disguise waiting for any who wish to harm the Twin God's people. When angered they spring from the ground striking their foes with stout arms of vines and pursue them relentlessly."

 taeha_neimkyanat: "Taeha Neimkyanat"
 taeha_neimkyanat_flavor: "The [Glossary('Taeha Neimkyanat','GH_TAEHA_NEIMKYANAT_GLOSS')] are large, hollow stone-hewn humanoid torsos that stalk the deepest reaches of [Glossary('Nattanan','nattanan_highlands_encyclopedia_desc')] jungles. Animated by pulsating masses of vines and vegetation, groups of them incessantly walk the same path year after year, deviating only to stomp down an errant intruder or to bask in the sun."

 stone_elementals: "Stone Elementals"

 fire_elementals: "Fire Elementals"

 ice_elementals: "Ice Elementals"

 nature_elementals: "Nature Elementals"

 metal_elementals: "Metal Elementals"

 sand_elementals: "Sand Elementals"

 light_elementals: "Light Elementals"

 blood_elementals: "Blood Elementals"

 death_elementals: "Death Elementals"

 dark_elementals: "Dark Elementals"

 ethereal_elementals: "Ethereal Elementals"

 celestial_elementals: "Celestial Elementals"

 lightning_elementals: "Lightning Elementals"

 quicksilver_elementals: "Quicksilver Elementals"

 dream_elementals: "Dream Elementals"

 desert_mirage_elementals: "Desert Mirage Elementals"

 dune_reaper_elementals: "Dune Reaper Elementals"

 mountain_spirit_elementals: "Mountain Spirit Elementals"

 vine_elementals: "Vine Elementals"

 seraph_bohu: "Bohu"
 seraph_bohu_flavor: "A ghastly sight, the Bohu is a winged abomination shrouded in a sinister aura that strikes terror from above and darkens the sky."

 seraph_damin: "Damin"
 seraph_damin_flavor: "Angelic yet bloodthirsty, the Damin is a crimson angel who rains blood and arcane magic down upon its prey."

 emberstone_grenadiers: "Emberstone Grenadier"
 emberstone_grenadiers_flavor: "A squad of skirmishers equipped with Emberstone-charged projectiles. Highly explosive—and just as dangerous to it's user."

 emberstone_trebuchets: "Emberstone Trebuchets"
 emberstone_trebuchets_flavor: "No wall can withstand the power of Emberstone. Each salvo unleashes a rain of burning metal that fragments into multiple explosive charges."

 undead_scorpions: "Undead Scorpions"
 undead_scorpions_flavor: "Risen from the dead, undead scorpions burrow into dunes and mountain crevices for years, lying in wait to ambush the living."

 undead_dune_behemoths: "Undead Dune Behemoths"
 undead_dune_behemoths_flavor: "Some desert tribes regard them as ancient gods who vanished eons ago, yet the vanity of necromancers knows no bounds. Resurrected as their puppets, these sand giants once again tread the dunes of Sarradon."

 songless: "Songless"
 songless_flavor: "With their throats torn out and their blood drained, the songless are animated solely by the power of the Bored God’s malevolent melodies."

 flayers_of_song: "Flayers of Song"
 flayers_of_song_flavor: "Elite warriors reanimated by the twisted hymns of the Bored God, their bodies hardened by plates of solid blood. Endowed with long, razor-sharp claws and an insatiable hunger that drives them to cannibalize their enemies, the flayers drape themselves in the skins of their victims and sing the agonizing melody of their torture."

 flesh_goliaths: "Flesh Goliaths"
 flesh_goliaths_flavor: "Flesh Goliaths are the result of most vile experiments of the Bored God — massive hulks of grafted bodies and twisted minds by the crooked melodies of hymns. These Goliaths smashes through walls of spear and stone without care or weakness."

 askituft: "Askituft"
 askituft_flavor: "The [Glossary('Askituft','GH_ASKITUFT_KRATEMEZIN_GLOSS')] — giant-sized insects with fur growing out of their exoskeleton. With the face of a tiger and the jaws of an ant, Askituft are normarly the size of a tiger cub but their eldest can grow to the size of a hippopotamus. They live in colonies similar to ants and hunt in swarms."

 xumeqran: "Xumeqran"
 xumeqran_flavor: "The [Glossary('Xumeqran','GH_XUMEQRAN_KRATEMEZIN_GLOSS')] — an apex hunter of the wetlands and floodplains of the crater. While massive, they learn to bury themselves in the mud to ambush their prey and their body can walk on top of the water as if it were the ground. "

 golden_golems: "Golden Golems"
 golden_golems_flavor: "Forged from metal made pure by light, the Golden Golem shines with the energy of the arcane. Made as a prestigeous bodyguard or the defenders of a castle, these expensive golems are as powerful as they are an ostentatious display of wealth."

 desert_wraith: "Desert Wraith"
 desert_wraith_flavor: "The eternal horizon of dunes and flat sands have been for eons a gateway for spirits and ghosts into Aeras."

 specter_of_the_beast: "Specter of the Beast"
 specter_of_the_beast_flavor: "When the night start and the cold wind of Sarradon blows. Close your eyes and listen to their melodies. Let the Desert engulf you for it shall speak when you slumber into the world of what is and never was, you'll fell it deep inside of your heart... It hungers..."

 time_elementals: "Time Elementals"
 time_elementals_flavor: "By far one of the most esoteric and dangerous of the elementals, the time elemental exists outside the bounds of reality. Existing simultaneously in the present and the past, they can cause their enemies to vanish even before they become one."

 epochal_riders: "Epochal Riders"
 epochal_riders_flavor: "Throughout the long history of Aeras, the arrival of certain individuals has proven decisive in turning the tide of battle. Magic preserves the memory of these moments and summons them to shape the future again."

 dawn_elementals: "Dawn Elementals"
 dawn_elementals_flavor: "The light of hope shines upon the dreams of those who aspire to change the world. These elementals are that hope—given life and form—serving the designs of their masters."

 elemental_choir: "Elemental Choir"
 elemental_choir_flavor: "The energy of the blood given form by the hymns. The Elemental Choir is a living sound, the voice off all that once sang it's melody."

 hymns_elementals: "Hymns Elementals"
 hymns_elementals_flavor: "Melodies and rhymes can be every bit as sharp as a blade. These elemental beings embody the power of the words and sounds that surround us."

 drifters_blights: "Drifters Blights"
 drifters_blights_flavor: "The tormented spirits of travelers lost in the [Glossary('Sarradonian Desert','sarradonian_desert_encyclopedia_desc')]. Hateful and unrelenting, they prey the traveling nomads and adventurers that dare to journey deep into the desert unknowing that they could meet the same end."

 dusk_reapers: "Dusk Reapers"
 dusk_reapers_flavor: "Nightmares birthed from the dying ambition of the living. The deepest dunes of the [Glossary('Sarradonian Desert','sarradonian_desert_encyclopedia_desc')] hide the twisted souls of the fallen given form, from ambitious warlords to renowned champion in search of perfection, those who met an early end before accomplishing their [aspect_dream] find solace in reaping the ambition of others."

 void_monolith: "Void Monolith"
 void_monolith_flavor: "Driven by spirits from the [Concept('aspect_dark', '#G_light Void#!')|E], this structure of stone and metal hover over the battlefield, bending reality in its passage and forcing all of [aersanon|E]'s creation in its destructive vortex until they are erased from [aeras|E]."

 blood_oozes: "Blood Ooze"
 blood_oozes_flavor: "When rivers turn blood-red, a necromancer is usually not far off. These slimes are created by fusing the blood of several villagers or prisoners of war in a sacrificial ritual that merges water spirits with blood energy."

 radiant_inquisitors: "Radiant Inquisitors"
 radiant_inquisitors_flavor: "Chosen from among the most skilled practicionners of the ancient Hubarites orders, these inquisitors show no mercy in hunting down the magi and evil spawn their orders have deemed enemies."

 bladesingers: "Bladesingers"
 bladesingers_flavor: "Elite female warriors of Sinasan, the Nazaean Bladesingers fight while dancing to the sound of thundering war bells."

 war_bells: "War Bells"
 war_bells_flavor: "Giant bells carried by the women priest of Sinasan, each of their tolls dims the power of magic and empowers the dance of their warriors"

 moth_fighters: "Moth Fighters"
 moth_fighters_flavor: "The Moth Fighters are the most recognizable of the Lawgiri soldiers. They are the most vivid example of the Lawgiri’s extravagant use of color in their attire"

 ocean_reavers: "Reavers"
 ocean_reavers_flavor: "The famous warrior women of Krehejad, these pirates are experts at outmaneuvering heavier infantry as well as overwhelming local city garrisons quickly and effeciently."


