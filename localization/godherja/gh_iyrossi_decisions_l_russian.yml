l_russian:
 iyrossi_reform_religion_decision:0 "Вернуться к традиции!"
 iyrossi_reform_religion_decision_desc:0 "Слишком долго мы жили под [Concept('aversaria','аверсарианским')|E] сапогом. Со времён сдачи Потаклея мы жили как рабы и вели себя как истинный пример [Concept('aversaria','аверсарианской')|E] блудницы. Мы клонились и потакали любой прихоти и оскорблению.\n\nХватит! Настало время собрать оставшиеся традиции и вернуться к древним верованиям нашего народа! Ийросси никогда больше не будут рабами!"
 iyrossi_reform_religion_decision_tooltip:0 "Вы вернётесь к древней религии ийроссов, и все ийросские провинции и персонажи аагиократской конфессии обратятся в неё."
 iyrossi_reform_religion_decision_confirm:0 "Вернуться к нашим истокам!"
 reform_iyrossi_homelands_decision:0 "Реформировать Митидон!"
 reform_iyrossi_homelands_decision_desc:0 "Со времён сдачи Потаклея наши родные земли стенали под сапогом [Concept('aversaria','аверсарианских')|E] псов. С возвращением наших древних земель Старый Митидон может восстать вновь — и на этот раз его народ никогда больше не потерпит рабства!"
 reform_iyrossi_homelands_decision_tooltip:0 "Навеки гарантируйте, что наш народ больше никогда не окажется в рабстве! Вы вернёте родные земли их законным правителям, и все они будут считаться де-юре частью Митидона!"
 reform_iyrossi_homelands_decision_confirm:0 "Старый Митидон рождается вновь!"
 