l_russian:

 #widow
 
 gh_widow.1.t:0 "Стремительная утрата"
 gh_widow.1.desc:0 "[Select_CString(ROOT.Char.IsFemale, 'Я мертва и покинула этот мир', 'Я мертв и покинул этот мир' )], затерявшись во тьме. Мой супруг будет страдать из-за этого."
 gh_widow.1.a:0 "Вы не должны этого видеть."
 
 gh_widow.2.t:0 "Ночь проходит"
 gh_widow.2.desc:0 "Прошло так много времени с тех пор, как у меня отняли мою любовь. Так много, что мысль о новой любви уже не причиняет былую боль. Мир больше не кажется таким мрачным. Моей любви больше нет, и этого не изменить. Возможно, пришло время двигаться дальше."
 gh_widow.2.a:0 "Да, действительно пора."
 stress_threshold_special.1001.widowed:0 "Хотя я знаю, что [Select_CString(deceased_character.IsFemale, 'она ушла', 'он ушел' )], я не знаю, смогу ли я снова найти любовь."
 stress_threshold_special.1001.widowed.flavor:0 "...and I do not want to."
 stress_threshold_special.2001.c:0 "While my love was lost, I think it can be found again."
 