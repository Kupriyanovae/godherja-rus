 kanzelerij_restoration_faction:0 "Фракция реставрации монархии"
 kanzelerij_restoration_faction_desc:0 "[SelectLocalization( GetPlayer.IsValid, 'kanzelerij_restoration_faction_desc_player','None')]"
 kanzelerij_restoration_faction_desc_player:0 "Коалиция дворян в державе [GetTitleByKey('k_de_kanzelerij').GetName], желающих восстановить феодальное правление под властью [GetTitleByKey('d_kanzelerij_monarchy').GetName], положив конец республике и вернув власть законному монарху."
 kanzelerij_restoration_faction_short_effect_desc:0 "Восстановить феодальное правление под властью титула [GetTitleByKey('d_kanzelerij_monarchy').GetName]"
 gh_kanzelerij_restoration_war:0 "Война за реставрацию монархии"
 gh_kanzelerij_restoration_war_name:0 "Война за реставрацию монархии"
 gh_kanzelerij_restoration_war_victory_desc:0 "Фракция реставрации одержала победу. Республика [GetTitleByKey('k_de_kanzelerij').GetName] пала, и феодальный порядок восстановлен под властью титула [GetTitleByKey('d_kanzelerij_monarchy').GetName]."
 gh_kanzelerij_restoration_war_defeat_desc:0 "Фракция реставрации разгромлена. Республика выстояла — и ее правители запомнят каждого, кто осмелился бросить им вызов."
 gh_kanzelerij_restoration_war_white_peace_desc:0 "Конфликт завершился без решающего исхода. Фракция реставрации отступает... но лишь на время."
 gh_kanzelerij_restoration_demand_accepted_title:0 "Монархия принята"
 gh_kanzelerij_restoration_war_won_title:0 "Монархия восстановлена"
 gh_kanzelerij_restoration_war_lost_title:0 "Республика пала"
 gh_kanzelerij_restoration_war_crushed_title:0 "Мятеж подавлен"