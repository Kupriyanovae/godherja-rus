 gh_laamp_base_contract_schemes.1012.t: "$laamp_base_6001_contract_scheme$: успех!"
 gh_laamp_base_contract_schemes.1012.desc: "Как столько [ROOT.Char.Custom('GetAnimalType')] умудрились пробраться в [ROOT.Char.Custom('RandomAdventureLocation')], остается загадкой, но я счастлив, что мне нужны только их головы. Вскоре я стою в покое, которым владеет [employer.GetTitledFirstNamePossessive], наедине со слугой, утверждающим, что его господин обязательно вот-вот появится и вовсе не заставляет меня ждать ради соблюдения приличий. Проходит некоторое время, прежде чем слуга замечает, что кровь из моего мешка начинает портить ковер, после чего он, как перепуганный заяц, устремляется из комнаты и возвращается с хозяином пару мгновений спустя.\n\n«Да, да, да! Вот, держи!» — говорит [employer.GetSheHe], суя мне в руки кошель и выталкивая к двери. «И забири эту мерзость с собой!» Мой вопрос о том, заплатят ли мне еще и за это, остался без сочувствия."
