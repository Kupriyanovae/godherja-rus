 #################################################
 # Base Slayer Scheme Loc

 # Slay Pests
 gh_laamp_base_1001_contract_scheme: "Убить вредителей"
 gh_laamp_base_1001_contract_scheme_action: "Убить вредителей для персонажа"
 gh_laamp_base_1001_contract_scheme_desc: "Подданные, которыми владеет [contractor_possessive|E], терпят бедствие из-за какого-то дикого зверья. Армии и воины, что населяют [aeras|E], обычно слишком заняты войной друг с другом, поэтому предприимчивый [adventurer|E] всегда сможет найти [task_contract|E] по истреблению подобной твари.$laamp_contract_scheme_desc_general_boilerplate$"
 gh_laamp_base_1001_contract_scheme_desc_general: "$gh_laamp_base_1001_contract_scheme_desc$"
 gh_laamp_base_1001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 gh_laamp_base_1001_desc_title: "Честным искателям приключений и храбрым охотникам!"
 gh_laamp_base_1001_desc: "Народ владения [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] страдает от нашествия [SelectLocalization(TaskContract.MakeScope.Var('animal_type').IsSet, Localize(Concatenate(TaskContract.MakeScope.Var('animal_type').GetFlagName,'_name')), 'вредителей')]. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] призывает всех начинающих искателей приключений и охотников на зверей помочь за золото и славу."

 gh_laamp_base_contract_schemes.1001.t: "$gh_laamp_base_1001_contract_scheme$"
 gh_laamp_base_contract_schemes.1001.desc: "«Не пауки, так волки, не волки, так крысы, а не крысы — так гробблеры да эндрегны. Даскендоги, нотики, вирмлинги, слизни! Это никогда не кончится!» [employer.GetTitledFirstName], кажется, [Select_CString(employer.IsFemale,'готова', 'готов')] перечислять тварей и дальше, но лишь вздыхает и потирает переносицу.\n\nОкинув меня взглядом, [employer.GetTitledFirstName] остается удовлетворенным увиденным и щелкает пальцами. Словно дрессированный пес, один из [employer.GetHerHis] [dummy_gender_soldier.GetWomenMen|l] вытягивается во фрунт и протягивает [employer.GetHerHim] свиток.\n\n«Уважаемые старейшины поселения [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] сим просят благородного искателя приключений с хорошей репутацией про бла-бла-бла...» [employer.GetFirstName] бросает свиток через плечо, и стражник бросается его ловить. «Моим воинам есть чем заняться помимо погони за всяким отребьем. Что скажешь?»"
 gh_laamp_base_contract_schemes.1001.a: "Главное для нас — защита простолюдинов."
 gh_laamp_base_contract_schemes.1001.b: "Сосредоточимся на том, чтобы остановить тварей, пока они не расплодились."
 gh_laamp_base_contract_schemes.1001.c: "Убить их быстро, убить их эффективно."

 gh_laamp_base_contract_schemes.1002.t: "$gh_laamp_base_1001_contract_scheme$: успех!"
 gh_laamp_base_contract_schemes.1002.desc: "Как столько [ROOT.Char.Custom('GetAnimalType')] умудрились пробраться в [ROOT.Char.Custom('RandomAdventureLocation')], остается загадкой, но я счастлив, что мне нужны только их головы. Вскоре я стою в покое, которым владеет [employer.GetTitledFirstNamePossessive], наедине со слугой, утверждающим, что его господин обязательно вот-вот появится и вовсе не заставляет меня ждать ради соблюдения приличий. Проходит некоторое время, прежде чем слуга замечает, что кровь из моего мешка начинает портить ковер, после чего он, как перепуганный заяц, устремляется из комнаты и возвращается с хозяином пару мгновений спустя.\n\n«Да, да, да! Вот, держи!» — говорит [employer.GetSheHe], суя мне в руки кошель и выталкивая к двери. «И забири эту мерзость с собой!» Мой вопрос о том, заплатят ли мне еще и за это, остался без сочувствия."
 gh_laamp_base_contract_schemes.1002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 gh_laamp_base_contract_schemes.1003.t: "$gh_laamp_base_1001_contract_scheme$: провал!"
 gh_laamp_base_contract_schemes.1003.desc: "«[ROOT.Char.Custom('GetAnimalType')]?! — визгливо кричит [employer.GetTitledFirstName]. — Вас одолели какие-то [ROOT.Char.Custom('GetAnimalType')]?!»\n\n«Их было очень много, — отвечаю я. — А еще та история с лошадью...»\n\n«Вон! — пронзительно орёт [employer.GetSheHe]. — Вон из моего зала! Теперь мне придется отвлекать моих воинов на проклятых [ROOT.Char.Custom('GetAnimalType')], выставляя себя дураком перед собственными подданными! Вон! Если ты не уберешься до того, как мои солдаты выступят, ты присоединишься к этим тварям!»"
 gh_laamp_base_contract_schemes.1003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 # Hunt a Dangerous Monster
 gh_laamp_base_1011_contract_scheme: "Охота на опасного монстра"
 gh_laamp_base_1011_contract_scheme_action: "Охотиться на опасного монстра для персонажа"
 gh_laamp_base_1011_contract_scheme_desc: "Подданные, которыми владеет [contractor_possessive|E], терпят бедствие из-за какого-то дикого зверья. Армии и воины, что населяют [aeras|E], обычно слишком заняты войной друг с другом, поэтому предприимчивый [adventurer|E] всегда сможет найти [task_contract|E] по истреблению подобной твари.$laamp_contract_scheme_desc_general_boilerplate$"
 gh_laamp_base_1011_contract_scheme_desc_general: "$gh_laamp_base_1011_contract_scheme_desc$"
 gh_laamp_base_1011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 gh_laamp_base_1011_desc_title: "Честным искателям приключений и храбрым охотникам!"
 gh_laamp_base_1011_desc: "Народ владения [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] страдает от нашествия [SelectLocalization(TaskContract.MakeScope.Var('animal_type').IsSet, Localize(Concatenate(TaskContract.MakeScope.Var('animal_type').GetFlagName,'_name')), 'вредителей')]. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] призывает всех начинающих искателей приключений и охотников на зверей помочь за золото и славу."

