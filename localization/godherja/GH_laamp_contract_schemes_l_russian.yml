 gh_laamp_base_contract_schemes.1011.desc: "«Не пауки, так волки, не волки, так крысы, а не крысы — так гробблеры да эндрегны. Даскендоги, нотики, вирмлинги, слизни! Это никогда не кончится!»\n\n[employer.GetTitledFirstNamePossessive], кажется, [Select_CString(employer.IsFemale,'готова', 'готов')] перечислять тварей и дальше, но лишь вздыхает и потирает переносицу.\n\n[employer.GetSheHe|U] щелкает пальцами, и один из [employer.GetHerHis] [dummy_gender_soldier.GetWomenMen|l] протягивает [employer.GetHerHim] свиток.\n\n«Уважаемые старейшины, коими управляет [employer.GetPrimaryTitle.GetTierAsNameNoTooltip|l], сим просят благородного искателя приключений про бла-бла-бла...» [employer.GetSheHe|U] бросает свиток через плечо, за которым устремляется солдат. «Моим воинам есть чем заняться помимо погони за всяким отребьем. Что скажешь?»"
