 gh_laamp_base_9001_contract_scheme: "Сопровождать беженцев"
 gh_laamp_base_9001_contract_scheme_action: "Сопровождать беженцев для персонажа"
 gh_laamp_base_9001_contract_scheme_desc: "С каждым днем все больше людей устремляются на юг вслед за маршем Имперреха. Вполне естественно, что некоторые правители предпочитают, чтобы они двигались быстрее.$laamp_contract_scheme_desc_general_boilerplate$"
 gh_laamp_base_9001_contract_scheme_desc_general: "$gh_laamp_base_9001_contract_scheme_desc$"
 gh_laamp_base_9001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"

 gh_laamp_base_9001_desc_title: "Почтенным воинам и измысленным вождям!"
 gh_laamp_base_9001_desc: "Толпы беженцев хлынули во владение [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier], и им требуется ваша помощь и защита, чтобы обосноваться на новых землях. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] призывает всех вождей отрядов, готовых вести этих людей по их пути."

 gh_laamp_base_contract_schemes.9001.t: "$gh_laamp_base_9001_contract_scheme$"
 gh_laamp_base_contract_schemes.9001.desc: "Усталая и суровая толпа путников уже приготовилась к предстоящему походу. Посланник, которого отправляет [employer.GetTitledFirstName], не спеша зачитывает все их права при проходе через его lands, после чего вручает тебе грамоту о найме.\n\n«К сожалению, наши воины попросту слишком заняты, чтобы отвлекаться на это. Что скажешь?»"
 gh_laamp_base_contract_schemes.9001.a: "Главное для нас — их безопасность в пути."
 gh_laamp_base_contract_schemes.9001.b: "Сосредоточимся на том, чтобы довести их как можно быстрее."
 gh_laamp_base_contract_schemes.9001.c: "Мы справимся с этим в меру своих сил."

 gh_laamp_base_contract_schemes.9002.t: "$gh_laamp_base_9001_contract_scheme$: успех!"
 gh_laamp_base_contract_schemes.9002.desc: "С надеждой в глазах и попутным ветром я помог этим переселенцам безопасно миновать разоренные войной земли Разоренного Берега. Хотя по возвращении [employer.GetFirstName] снова выслал своего посланника, чтобы отблагодарить меня монетой, я все равно ощутил умиротворение от проделанной работы."
 gh_laamp_base_contract_schemes.9002.a: "$laamp_base_contracts_schemes.0000.generic_option.proceed.neutral$"

 gh_laamp_base_contract_schemes.9003.t: "$gh_laamp_base_9001_contract_scheme$: провал!"
 gh_laamp_base_contract_schemes.9003.desc: "Несмотря на все наши усилия, лишь горстке переселенцев удалось добраться до безопасного места. Даже [employer.GetTitledFirstName] и его посланник отказались встретиться с нами по возвращении и навсегда закрыли нам путь назад."
 gh_laamp_base_contract_schemes.9003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_migration_9001_success_employer_modifier: "Расселенные беженцы"
 laamp_migration_9001_success_employer_modifier_desc: "Беженцы были успешно расселены в этой провинции благодаря помощи отряда переселенцев."

 laamp_migration_9001_failure_employer_modifier: "Насилие над беженцами"
 laamp_migration_9001_failure_employer_modifier_desc: "Беженцы попытались обосноваться в этой провинции, но столкнулись лишь с гневом и жестокостью."

 gh_laamp_base_9011_contract_scheme: "Вести переговоры с местными"
 gh_laamp_base_9011_contract_scheme_action: "Вести переговоры с местными для персонажа"
 gh_laamp_base_9011_contract_scheme_desc: "Провести переговоры с местными [Concept('aversaria', 'аверсарианцами')|E] о правах на земли, урожай и прочих вопросах, которые затрагивает [sjalvolki_migration|E]"
 gh_laamp_base_9011_contract_scheme_desc_general: "$gh_laamp_base_9011_contract_scheme_desc$"
 gh_laamp_base_9011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"

 gh_laamp_base_9011_desc_title: "Почтенным воинам и измысленным вождям!"
 gh_laamp_base_9011_desc: "Местные аверсарианцы владения [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] попросили о переговорах с «представителем» Имперреха. От нас требуется лишь необходимое, чтобы обеспечить нерушимый мир и приток припасов в походе."

 gh_laamp_base_contract_schemes.9011.t: "Переговоры с местными"
 gh_laamp_base_contract_schemes.9011.desc: "Я стою перед местными старейшинами; их лица суровы и непреклонны. [Concept('aversaria', 'Аверсарианцы')|E] — гордый народ, ревностно оберегающий свои земли и традиции. Они смотрят на меня с подозрением, сжимая рукояти кинжалов.\n\nЗадача предельно проста: договориться об условиях, которые позволят орде пройти через их земли без кровопролития. Но этих селян так просто не склонить.\n\nЯ делаю глубокий вдох и готовлюсь начать речь. Исход уговор — а быть может, и всей войны — зависит от моих слов."
 gh_laamp_base_contract_schemes.9011.a: "Сосредоточимся на нашей цели"
 gh_laamp_base_contract_schemes.9011.b: "Нам следует закончить с этим как можно быстрее"
 gh_laamp_base_contract_schemes.9011.c: "Лучше всего подойдет смешанный подход."

 gh_laamp_base_contract_schemes.9012.t: "Договор заключен"
 gh_laamp_base_contract_schemes.9012.desc: "После долгих часов напряженных споров старейшины наконец кивают. Они приняли наши условия, хотя и затребовали немалую цену. Войско сможет пройти через их земли, но взамен мы пообещали им часть зерна и заверили, что их людей никто не тронет.\n\nСтарейшины сжимают мое предплечье в знак уважения, и их прежняя враждебность сменяется сдержанным одобрением. «Твоей хватке позавидует и сам [Concept('magi', 'маг')|E]», — произносит один из них с примесью досады и уважения.\n\nУходя с встречи, я чувствую облегчение. Рать продолжит марш без помех, но [Concept('aversaria', 'аверсарианцы')|E] не забудут этот уговор — да и вам не стоит."
 gh_laamp_base_contract_schemes.9012.a: "Отличная работа!"

 gh_laamp_base_contract_schemes.9013.t: "В ход идут кинжалы"
 gh_laamp_base_contract_schemes.9013.desc: "Переговоры провалились. Несмотря на все наши старания, [Concept('aversaria', 'аверсарианские')|E] старейшины остались непреклонны. Их требования были слишком высоки, а недоверие — слишком глубоко. По мере того как разговор заходит в тупик, обстановка накаляется. Старейшины поднимаются со своих мест, сжимая оружие.\n\n«Вы понапрасну потратили наше время, — рычит один из них. — Убирайтесь сейчас же, иначе не уйдете вовсе».\n\nПриходится спешно отступать, понимая, что вождям не понравится эта весть. Селяне перекрыли свои земли, и любая попытка пройти через них теперь обернется пролитой кровью.\n\nВозвращаясь в лагерь, я не могу не думать, можно ли было сделать что-то иначе. Но сейчас ясно одно: прольется кровь — и бремя этого поражения ляжет на меня."
 gh_laamp_base_contract_schemes.9013.a: "Еще один провал..."

 laamp_migration_9011_success_employer_modifier: "Успешные переговоры"
 laamp_migration_9011_success_employer_modifier_desc: "Правители в этой провинции успешно договорились об условиях с военными отрядами Имперреха."

 laamp_migration_9011_failure_employer_modifier: "Проваленные переговоры"
 laamp_migration_9011_failure_employer_modifier_desc: "Правители в этой провинции заняли враждебную позицию по отношению к военным отрядам Имперреха."

 gh_laamp_base_9021_contract_scheme: "Выступить передовыми разведчиками"
 gh_laamp_base_9021_contract_scheme_action: "Разведать врагов для персонажа"
 gh_laamp_base_9021_contract_scheme_desc:="По мере того как Имперрех продвигается по новым землям, вполне естественно, что некоторые вожди хотят выслать разведчиков далеко вперед, чтобы обнаружить слабые места и присмотреть лучшие земли для расселения.$laamp_contract_scheme_desc_general_boilerplate$"
 gh_laamp_base_9021_contract_scheme_desc_general: "$gh_laamp_base_9001_contract_scheme_desc$"
 gh_laamp_base_9021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 gh_laamp_base_9021_desc_title: "Почтенным воинам и измысленным вождям!"
 gh_laamp_base_9021_desc: "[TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] ищет разведчиков, готовых идти впереди Имперреха, чтобы добыть ценные сведения об их положении и выяснить, стоит ли обосноваться здесь или же лучше выслать людей дальше в поисках лучшей доли. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] призывает всех вождей отрядов, готовых выступить в разведку и доставить эти сведения."