 gh_laamp_base_contract_schemes.1013.desc: "«[ROOT.Char.Custom('GetAnimalType')]?! — визгливо кричит [employer.GetTitledFirstName]. — Вас одолели какие-то [ROOT.Char.Custom('GetAnimalType')]?!»\n\n«Их было очень много, — отвечаю я. — А еще та история с лошадью...»\n\n«Вон! — пронзительно орёт [employer.GetSheHe]. — Вон из моего зала! Теперь мне придется отвлекать моих воинов на проклятых [ROOT.Char.Custom('GetAnimalType')], выставляя себя дураком перед собственными подданными! Вон! Если ты не уберешься до того, как мои солдаты выступят, ты присоединишься к этим тварям!»"
 gh_laamp_base_contract_schemes.1013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 gh_laamp_base_1021_contract_scheme: "Засада в замковом логове"
 gh_laamp_base_1021_contract_scheme_action: "Устроить засаду на жуткое [Concept('monsters', 'чудовище')|E] для персонажа"
 gh_laamp_base_1021_contract_scheme_desc: "Подданные, которыми владеет [contractor_possessive|E], докладывают о пропаже скота и даже фермеров. Армии и воины, что населяют [aeras|E], обычно слишком заняты войной друг с другом, так что предприимчивый [adventurer|E] всегда сможет найти [task_contract|E] по зачистке логова, где засело [Concept('monsters', 'чудовище')|E]."
 gh_laamp_base_1021_contract_scheme_desc_general: "$gh_laamp_base_1021_contract_scheme_desc$"
 gh_laamp_base_1021_contract_scheme_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 gh_laamp_base_1021_desc_title: "Опытным охотникам и убийцам чудовищ!"
 gh_laamp_base_1021_desc: "Народ владения [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] терпит бедствие из-за того, что [SelectLocalization(TaskContract.MakeScope.Var('animal_type').IsSet, Localize(Concatenate(TaskContract.MakeScope.Var('animal_type').GetFlagName,'_name')), 'зверь')] устроил логово в близлежащих руинах. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] призывает всех бывалых охотников и убийц чудовищ помочь за золото и славу."

 gh_laamp_base_contract_schemes.1021.t: "$gh_laamp_base_1021_contract_scheme$"
 gh_laamp_base_contract_schemes.1021.desc: "«Не пауки, так волки, не волки, так крысы, а не крысы — так гробблеры да эндрегны. Даскендоги, нотики, вирмлинги, слизни! Это никогда не кончится!»\n\n[employer.GetTitledFirstNamePossessive], кажется, [Select_CString(employer.IsFemale,'готова', 'готов')] перечислять тварей и дальше, но лишь вздыхает и потирает переносицу.\n\n[employer.GetSheHe|U] щелкает пальцами, и один из [employer.GetHerHis] [dummy_gender_soldier.GetWomenMen|l] протягивает [employer.GetHerHim] свиток.\n\n«Руины, которыми владеет [employer.GetPrimaryTitle.GetTierAsNameNoTooltip|l], стали приютом для жуткого чудовища, что держит в страхе наши деревни...» [employer.GetSheHe|U] умолкает и снова вздыхает. «Моим воинам есть чем заняться помимо погони за всяким отребьем. Что скажешь?»"
 gh_laamp_base_contract_schemes.1021.a: "Главное для нас — защита деревенских жителей."
 gh_laamp_base_contract_schemes.1021.b: "Сосредоточимся на том, чтобы прикончить тварь как можно быстрее."
 gh_laamp_base_contract_schemes.1021.c: "Убить тварь быстро, убить ее эффективно."

 gh_laamp_base_contract_schemes.1022.t: "$laamp_base_6001_contract_scheme$: успех!"
 gh_laamp_base_contract_schemes.1022.desc: "Когда [ROOT.Char.Custom('GetAnimalType')] выбиты из места [ROOT.Char.Custom('RandomAdventureLocation')], простолюдины вздохнули с облегчением. Вскоре я стою в покое, которым владеет [employer.GetTitledFirstNamePossessive], наедине со слугой, утверждающим, что его господин обязательно вот-вот появится и вовсе не заставляет меня ждать ради соблюдения приличий. Проходит некоторое время, прежде чем слуга замечает, что кровь из моего мешка начинает портить ковер, после чего он, как перепуганный заяц, устремляется из комнаты и возвращается с хозяином пару мгновений спустя.\n\n«Да, да, да! Вот, держи!» — говорит [employer.GetSheHe], суя мне в руки кошель и выталкивая к двери. «И забири эту мерзость с собой!» Мой вопрос о том, заплатят ли мне еще и за это, остался без сочувствия."
 gh_laamp_base_contract_schemes.1022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 gh_laamp_base_contract_schemes.1023.t: "$gh_laamp_base_1021_contract_scheme$: провал!"
 gh_laamp_base_contract_schemes.1023.desc: "[employer.GetTitledFirstName] пребывает в полном отчаянии по моему возвращении, окруженный десятками местным крестьян, которые теперь тоже заявляют, что видели тварь [ROOT.Char.Custom('GetAnimalType')]. Похоже, у владыки больше нет на меня времени — он даже отказывается встретиться лично, пока слуга выталкивает меня к выходу."
 gh_laamp_base_contract_schemes.1023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

 gh_laamp_base_1041_contract_scheme: "Изгнать неупокоенных"
 gh_laamp_base_1041_contract_scheme_action: "Изгнать неупокоенных для персонажа"
 gh_laamp_base_1041_contract_scheme_desc: "Подданные, которыми владеет [contractor_possessive|E], сообщают о пропавших детях, кошмарных снах и перепуганном скоте слишком долго, чтобы это было совпадением. Обычные армии и стража, что населяют [aeras|E], слишком напуганы или заняты, но бесстрашный [adventurer|E] всегда сможет найти [task_contract|E], требующий утихомирить то, что блуждает во тьме.$laamp_contract_scheme_desc_general_boilerplate$"
 gh_laamp_base_1041_contract_scheme_desc_general: "$gh_laamp_base_1041_contract_scheme_desc$"
 gh_laamp_base_1041_contract_scheme_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 gh_laamp_base_1041_desc_title: "Честным искателям приключений и храбрым охотникам!"
 gh_laamp_base_1041_desc: "Народ владения [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] опасается, что в их землях затаился дух [ROOT.Char.Custom('GetAnimalType')]. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] призывает искателей приключений и знатоков тайных искусств помочь за золото и славу."

 gh_laamp_base_contract_schemes.1041.t: "$gh_laamp_base_1041_contract_scheme$"
 gh_laamp_base_contract_schemes.1041.desc: "«Месяцами эти крестьяне стенают, будто призраки, банши и прочая нечисть оскверняют их земли и терзают сны, — [employer.GetTitledFirstName] потирает виски. — Не успеешь оглянуться, как они окончательно потеряют терпение и станут винить меня!» [employer.GetSheHe|U] щелкает пальцами, и, словно обученная гончая, один из [employer.GetHerHis] [dummy_gender_soldier.GetWomenMen|l] семенит вперед и протягивает свиток.\n\n«Уважаемые старейшины поселения [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] смиренно просят отважного искателя приключений с добрым именем помочь в разрешении кошмара...» [Employer.GetFirstName] умолкает, опустив свиток. «Мои воины либо слишком заняты, либо слишком трусливы, чтобы взяться за это сами. Что скажешь о таком поручении?»"
 gh_laamp_base_contract_schemes.1041.a: "Главное для нас — защита простолюдинов."
 gh_laamp_base_contract_schemes.1041.b: "Сосредоточимся на уничтожении сущности, пока всё не стало еще хуже."
 gh_laamp_base_contract_schemes.1041.c: "В деле с призраками лучше всего взвешенный подход."

 gh_laamp_base_contract_schemes.1042.t: "$gh_laamp_base_1041_contract_scheme$: успех!"
 gh_laamp_base_contract_schemes.1042.desc: "Когда [ROOT.Char.Custom('GetAnimalType')] изгнаны из места [ROOT.Char.Custom('RandomAdventureLocation')], простолюдины снова обрели покой. Вскоре я стою в покое, которым владеет [employer.GetTitledFirstNamePossessive], разглядывая гобелен с изображением давно забытой битвы. Трофей, что я держу, все еще изредка шепчет, и каждый слуга, заходящий в зал, быстро находит повод сбежать.\n\nНаконец появляется [employer.GetTitledFirstName], замирая в дверях, пока вытолкнутый вперед слуга вручает мне награду.\n\n«Я слышу эту проклятую штуку даже отсюда. Закопай ее где-нибудь». Когда я отвечаю [employer.GetHerHim], что надлежащее погребение потребует платы, [employer.GetSheHe] оскаливается и отворачивается. «Сбрось ее в реку, только убери из моего дома!»"
 gh_laamp_base_contract_schemes.1042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"

 gh_laamp_base_contract_schemes.1043.t: "$gh_laamp_base_1041_contract_scheme$: провал!"
 gh_laamp_base_contract_schemes.1043.desc: "[employer.GetTitledFirstName] пребывает в полном отчаянии по моему возвращении, окруженный десятками местным крестьян, которые теперь тоже заявляют, что видели тварь [ROOT.Char.Custom('GetAnimalType')]. Похоже, у владыки больше нет на меня времени — он даже отказывается встретиться лично, пока слуга выталкивает меня к выходу."
 gh_laamp_base_contract_schemes.1043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"

