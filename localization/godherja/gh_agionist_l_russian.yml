l_russian:
 agionist.0011.title:0 "Финальное прибытие"
 agionist.0011.desc:0 "Когда Федра проходит мимо меня и присоединяется к процессии, появляется последний участник церемонии.\n\nВеликий магистр Ордена Забытого Святого входит в залу, а за ним чеканит шаг группа абсолютно одинаковых свирепых слуг, приносящих с собой пронизывающий холод, несмотря на пустынный зной. Их маска абсолютно чиста, даже глаз толком не разглядеть, и я понимаю, что ничего не знаю об этом... человеке? Как повелевает их обычай, кем бы они ни были прежде, при восхождении они приняли имя Аномахис. Безымянный.\n\nМне удается выцедить традиционное приветствие, но они останавливаются и медленно поворачиваются, пока их процессия безмолвно марширует дальше. Мне кажется, будто я наблюдаю за движением катараддийского автоматона — не живого существа, а порождения магии и шестеренок, щелкающих в такт своей музыке."
 agionist.0011.a:0 "И тут они обращаются ко мне."

 agionist.0012.title:0 "Магистр Ордена говорит"
 agionist.0012.desc:0 "«[ROOT.Char.GetFirstNameNoTooltip], — произносят они тоном, который скорее напоминает паука, плетущего шелк, чем голос человека. — Мы... жаждем наконец поговорить с вами... поистине жаждем. Мы внимательно следили за вашим возвышением... весьма необычным возвышением, которое, как вы прекрасно знаете, мы вовсе не планировали».\n\n«Магистр Ордена Пастон не отличался любовью к правилам», — выдавливаю я из себя, несмотря на странную сдавливающую боль в горле. Лишь сейчас я осознаю, что совершенно не помню, как звучит голос Аномахиса — словно это воспоминание затерлось, едва успев сформироваться. Мне мерещится то женский голос, то мужской, то тысячи голосов одновременно, сливающихся в единый гул. Это лишь мое воображение? Я что, схожу с ума?\n\n«Действительно... поистине... да... — монотонно гудит Аномахис, словно я солдатик, выбившийся из строя. — Ваша церемония... мы видим, что она проходит как должно, как и всегда. Я видел множество таких... Я бы хотел поговорить с вами... после. Наедине. Это tradition, соблюдаемая всеми... престижными мужами, нареченными Магистрами Ордена».\n\nВсе точно так, как предупреждал Пастон... настало время принимать решение. Довериться бредням моего безумного старого наставника и гарантированно навлечь на себя гнева сильнейшего из всех Орденов, или пойти по пути остальных?"
 agionist.0012.a:0 "Я принимаю приглашение"
 agionist.0012.b:0 "Сообщить Аномахису, что они могут удалиться по окончании церемонии"
