 GH_artifact_stone_golem_mount_magic_crafted_name:0 "[stone_i][aspect_stone]Боевой голем"
 artifact_stone_golem_mount_description:0 "Это возвышающееся над полем боя изваяние из одушевлённого камня служит одновременно скакуном и стражем. Высеченный из живой скалы и приведённый в движение [Concept('magic','магией')|E], он передвигается тяжеловесной, но неостановимой поступью, и его кристаллические глаза мерцают колдовской целеустремленностью."