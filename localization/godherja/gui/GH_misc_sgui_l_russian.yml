 # Descriptions
 generic_incompatibility_desc: "Это приведет к различным проблемам: пропаже кнопок, отсутствии информации, некорректному масштабированию и многому другому."
 window_character_lifestyle_incompatibility_desc: "Это приведет к различным проблемам: некликабельным образом жизни, пропаже информации об аркане, невидимым полоскам опыта и многому другому."
 window_county_view_incompatibility_desc: "Это приведет к различным проблемам: пропаже кнопки «Колонизировать графство», кнопки «Добавить в цель магии», отсутствии информации, некорректному масштабированию и многому другому."
 window_character_incompatibility_desc: "Это приведет к различным проблемам: пропаже кнопок, отсутствии информации о «Школе магии», отсутствии информации о навыках арканов, пропаже отношений и многому другому."
 window_faith_incompatibility_desc: "Это приведет к различным проблемам: пропаже святых покровителей, правовых школ, вкладок Высшего суда, некорректному масштабированию и многому другому."
 window_decisions_incompatibility_desc: "Это приведет к различным проблемам: пропаже вкладки «Ситуации» и многому другому."
 window_culture_incompatibility_desc: "Это приведет к различным проблемам: пропаже вкладки «Магия» и многому другому."
 window_council_incompatibility_desc: "Это приведет к различным проблемам: пропаже должности «Придворный маг» в поезде совета и многому другому."
 window_military_incompatibility_desc: "Это приведет к различным проблемам: пропаже кнопки пополнения профессионалов для различных типов правительства, отсутствии информации и многому другому."
 hud_incompatibility_desc: "Это приведет к различным проблемам: пропаже вкладок «Клика» и «Налоговый округ», пропаже кнопок Бестиария и Лора, пропаже полосы магического воздействия, режима карты атмосферной магии, отображения фаз луны Эрвала и многому другому."
 window_factions_incompatibility_desc: "Это приведет к различным проблемам: пропаже вкладки «Гражданская война» и многому другому."
 window_menatarms_incompatibility_desc: "Это приведет к различным проблемам: пропаже полосы здоровья для определенных типов профессионалов и многому другому."
 window_inventory_incompatibility_desc: "Это приведет к различным проблемам: пропаже ячейки «Ездовое животное» и многому другому."

 gh_ending_warning_description: "#N Мы рекомендуем отключать другие моды до тех пор, пока это предупреждение не перестанет появляться при запуске CK3.#!"

