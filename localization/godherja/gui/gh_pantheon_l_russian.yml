l_russian:
 FAITH_PANTHEON_EXPLANATION:0 "Уакаклоанцы поклоняются великому множеству богов и демонов, а руководят этим поклонением храмовые ордена, каждый из которых посвящён определённому существу. Хотя многие из этих орденов прекратили своё существование задолго до памяти живущих или даже до начала исторической записи, те, что сохранились, продолжают исполнять свои обязанности и предлагают великие дары в обмен на покровительство, надеясь получить помощь в своих молениях. Мудрый уакаклоанский правитель стал бы сотрудничать с ними, ведь их религиозный авторитет и статус одних из самых могущественных институтов среди уакаклоанцев могут принести огромную выгоду их союзникам."  
 
 #STARTING UAKAKLOH TEMPLES
 izcatotl_name:0 "Шрамированное жречество - Ицкатотль"  
 izcatotl_desc:0 "Шрамированное жречество Ицкатотля посвящает себя умиротворению Освежеванной Матери уакаклоанцев, богини боли, пыток и крови. Шепчутся, что в далеком прошлом она принимала в жертву пленников, пока [Concept('mavixars_curse','проклятье')|E] не лишило их такой возможности. Тем не менее, её жречество продолжает практику человеческого жертвоприношения, хоть и в виде тайного ритуала, проводимого лишь над глубоко посвященными членами ордена. Те проводят всю свою жизнь в тренировках, чтобы сопутствовать ей в царстве богов Куатлане.\n\nКак орден, Шрамированное жречество известно своими характерными шрамами и узорами из самонанесенных ран, вырезанных в ритуалах, призванных утолить жажду крови их богини. Они утверждают, что этой жертвы оказалось достаточно, чтобы сохранить жизнь их братьям по вере в жестоких условиях Кирата, даровав им силы выжить в этой суровой среде."  
 zlatotec_name:0 "Общество меча Кровавого кристалла — Златотек	"  
 zlatotec_desc:0 "Общество меча Кровавого кристалла посвящено поклонению Небесному Охотнику, который преследует чудовищ в небесной бездне в облике комет и вечно сражается с демонами Тотоакуатлана. Верующие убеждены, что через их поклонение он дарует им силу или же лишает благословения их врагов. Дары, приносимые ему, разнообразны, но самый известный из них — дуэлянт.\n\nВнутри Общества меча Кровавого кристалла существует традиционный ритуальный поединок, победитель которого приносится в жертву Златотеку как самый достойный. Многие члены жречества проводят всю жизнь, тренируясь для этих дуэлей, а проигравшие часто приносят клятву военному крылу Общества, поступая на службу к местным военачальникам и вождям, чтобы вернуть утраченную честь и поддержать родные храмы."  
 alitikatl_name:0 "Посвящённые высших таинств Алитикатля"  
 alitikatl_desc:0 "Алитикатль родился из слёз Тенсесе, когда он наблюдал, как мир погружается в хаос под натиском демонов, порождённых в ответ на его творение. Когда эти слёзы образовали на земле озеро, Алитикатль поднялся и начал свои поиски. Вскоре он нашёл человечество, прячущихся в примитивных хижинах, и выбрал среди них самых достойных, которым было даровано звание Айи-Тлакатолалли, или Магического Короля. Под руководством Алитикатля Тлаклакан создали свою древнюю цивилизацию.\n\nВ современную эпоху, когда Уакаклох снова вынуждены скрываться от хищников, его поклонение приобрело совершенно иной характер. Вместо восхваления его прошлых слав, жрецы Посвящённых высших таинств Алитикатля отчаянно просят его помочь своим нынешним последователям, и посвящают себя мистическим магическим ритуалам, надеясь вызвать его силу, чтобы вернуть древние линии [Concept('magi','магов')|E]-царей. В менее фаталистической манере, они также используют свои навыки для обучения детей ближайших уакаклоанских [Concept('magi','магов')|E], надеясь передать уроки Алитикатля будущим поколениям, чтобы, возможно, наступил новый золотой век." 
 huatipotchl_name:0 "Плачущие — Уатипотчли"  
 huatipotchl_desc:0 "Уатипотчли — бог, или, возможно, демон гнева и ярости. Традиционно изображаемый в виде скелета с рубинами вместо глаз, он постоянно получает подношения от Плачущих, которые пытаются убедить его обратить свое внимание на других божественных существ, вместо того чтобы причинять страдания человечеству. Они не рассчитывают получить дары от своего божественного покровителя, а скорее стремятся сделать все возможное для защиты человечества, хотя время от времени они признают определенные военные действия волей Уатипотчли.\n\nЧеловеческие жертвоприношения практикуются самыми глубоко посвященными членами Плачущих. Они проводят сложные придворные ритуалы, призванные продемонстрировать должное смирение перед Владыкой Ярости, которые завершаются изысканным самоубийством жрецов, совершаемым для того, чтобы присоединиться к своему покровителю в качестве слуг в божественных сферах. В этом смысле их часто считают одной из последних связей с образом жизни, давно оставшимся в прошлом."
 naxhuicazal_name:0 "Жречество Гниющих - Нашуикасаль
 naxhuicazal_desc:0 "С падением [Concept('necentlal_tlaklaktli','Нецентлаль Тлакалактли')|E] уакаклоанцы были вынуждены бежать в глубины джунглей Кирата, где их терзали болезни, неизвестные ни в одной другой части света.  отчаянии они обратились к демону Нашуикасалю и стали горячо молить его отозвать свои полчища и позволить верным жить спокойно. Они начали приносить ему в жертву свои тела, бросая смертельно больных в Его храмы в качестве подношений и отделяя их от остального населения.\n\nКак ни парадоксально, учитывая суть их покровителя, Жречество Гниющих сосредоточено на предотвращении болезней, проводя странные ритуалы очищения, чтобы убедить Повелителя Мух нанести удар в другом месте. Они считают своей задачей выявление больных и прием их на лечение, изолируя тех, кого призвал Наксуикасаль, от всех остальных, веруя, что их смерть от болезни может быть превращена в жертвоприношение."
 nyanunwhaxi_name:0 "Бестенные - Ньянунваши"  
 nyanunwhaxi_desc:0 "Ньянунваши сопровождает душу в загробный мир, судя людей по их земным деяниям. В отличие от большинства пантеистических верований, уакаклоанцы считают ее одним из самых добрых божественных существ, терпеливо ждущим, чтобы забрать их в рай, подальше от земных страданий. Считается, что ее впечатляют великие произведения искусства и гробницы, и хотя ресурсы современных верующих ничтожны по сравнению с прошлым, они все равно прилагают все усилия, чтобы произвести на нее впечатление.\n\nБестенные, ее жречество, возглавляют некоторые из последних настоящих строительных уакаклоанских проектов, возводя гробницы и монументы павшим в надежде привлечь милосердие Ожидающей Матери. Кроме того, хотя они не практикуют жертвоприношения, самые глубоко посвященные члены их ордена вместо этого употребляют строго отмеренные дозы яда, веря, что близость к смерти позволит им вступить в связь с Ньянунваши."
 tzitihuyqui_name:0 "Последователи Зеленого пути Цитиуйки"  
 tzitihuyqui_desc:0 "Цитиуйки когда-то передала человечеству два дара. Во-первых, она дала им земледелие, чтобы они могли расти и расселяться. Во-вторых, она дала им искусство, чтобы они могли возносить ей хвалу. С тех пор ее последователи идут по Зеленому пути Пяти манящих наслаждений, хотя после переселения в Кират в их доктрину постепенно проникли Три изысканные пытки.\n\nnПоследователи широко известны своими замысловато украшенными костюмами и масками, которые надевают как во время пышных празднеств, так и в темных пыточных камерах. Хотя со стороны их форма поклонения кажется в основном мирной, сосредоточенной на музыке и росписи фресок, глубочайшие уровни их ордена пропитаны кровью: высшие посвященные подвергают себя ужасным пыткам, чтобы сотворить искусство страдания. Именно в этом часто видят причину тех испытаний, с которыми уакаклоанцы сталкиваются в настоящее время. Они верят, что если им удастся завершить эту высшую, самую темную задачу, Цитиуйки снова обучит человечество тайнам жизни."
 mawhunotolotl_name:0 "Культ Первого героя - Мавунотолотль"  
 mawhunotolotl_desc:0 "Мавунотолотль взирает на оставленное им человечество с обещанием. Обещанием того, что героизм несет в себе награду. Ибо в далеком прошлом он и сам был лишь смертным, перебивавшимся существованием в туманные дни былых времен. Однако в один из дней Солнце подобралось слишком близко к Земле, и, не видя действий со стороны богов, он поднял свое копье и бросил его в великое светило, отогнав его прочь. В награду Тенсесе даровал ему божественность, и он вознесся на небеса как бог долга и храбрости.\n\nЕго сказание давно откликается в сердцах уакаклох, обещая им всем небесное спасение, и никто не воплощает эту надежду сильнее, чем культ Первого героя. Этот храмовый орден служит не столько жречеством, сколько тренировочным центром, с малых лет воспитывающим детей, чтобы те стали воителями. Затем их отправляют в джунгли сражаться с ужасающими монстрами Кирата в надежде, что такие деяния докажут их достоинство присоединиться к богам. Мастерство этих бойцов, посвятивших жизнь своему делу, славится по всему Кирату, и, хотя официально они служат священной цели, на деле их часто отправляют на помощь уакаклоанским вождям  — пусть иногда и за высокую цену."  

 #Boons and Costs
 izcatotl_boons:0 "Доблесть:@skill_prowess_icon!#positive_value; +10#!\nВоенное дело:@skill_martial_icon!#positive_value; +2#!\n\nБазовый ужас:@dread_icon!#positive_value; +30#!\nСпад ужаса:@dread_icon!#positive_value; -30%#!\n\nНалог с домена:@gold_icon!#positive_value; +30%#!\nНародное мнение:@culture_icon!#positive_value; +10#!\n\nЕжемесячная магия:@magic_icon!#positive_value; +40%#!"  
 izcatotl_prices:0 "Для получения благословений Ицкатотля необходимо быть готовым рискнуть #N увечьем#! или даже #N смертью#!. Возможно, придётся #N отдать ребёнка#! или просто #N сделать пожертвование храму#!. Однако #P награда#! может быть велика."  


