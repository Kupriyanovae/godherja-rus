 lonelyknight_name:0 "The Godherja Team - Lonely Knightess"
 lonelyknight_desc:0 "Богиня Депривации Сна, все трепещут от страха перед ее гневом. Создательница мира и его вечная правительница. Вечно борющаяся за поддержание жизни своего умирающего компьютера."
 lonelyknight_desc:0 "Бог Рабства и Лишения Сна, все трепещут перед его гневом. Создатель мира и его вечный правитель. Вечно борется за поддержание здоровья своего умирающего компьютера."  
 hapchazzard_name:0 "Наипросвещённейшие Последователи Спагетти - Hapchazzard"  
 hapchazzard_desc:0 "Бог GUI и Скрипта, правая рука Lonely Knightess. Обладает огромным влиянием и способен подчинять своей воле реальность [Concept('aeras','Эраса')|E]. Lorem ipsum i dont know the rest of the fucking latin but need to test longer description.\n\nHapchazzard разбирается в дерьме, которым является магия GUI, и служит ответом пантеона могущественным богам из царства Коопа. Сообщают, что однажды, увидев, как народ отвращают от истинной веры Godherja с помощью мелких фокусов GUI, Hapchazzard создал собственную версию их заклинания и сохранил ее в тайне."
 
