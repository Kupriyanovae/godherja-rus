 COLONIZATION_COST_NO_PENALTY: "В данный момент эффектов нет, но если обитаемость упадет ниже 100, [Concept('colonization','колонизация')|E] станет медленнее и дороже"
 holding_view_habitability_warning: "[AddTextIf(LessThan_CFixedPoint(HoldingView.GetCountyTitle.MakeScope.ScriptValue('county_habitability_value'),GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target',HoldingView.GetCountyTitle.MakeScope).ScriptValue('colonization_threshold_value')),Concatenate('@warning_icon! #X Обитаемость этого ',Concatenate(Concept('county','#E графства#!'),Concatenate(' ниже вашего #!',Concept('habitability_threshold','#E Порога Обитаемости#!\n')))))]"
 holding_view_habitability_breakdown: "\nБазовая обитаемость: #V 100#!#indent_newline:3 \n[HoldingView.GetCountyTitle.MakeScope.GetScriptValueDesc('county_habitability_value')|0]#!\n\n[habitability_threshold|E]: #V [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target',HoldingView.GetCountyTitle.MakeScope).ScriptValue('colonization_threshold_value')|0]#!#indent_newline:3 \nБаза: [Concept('habitability_threshold','@habitability_threshold_icon!')]#V 50#!\n[GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target',HoldingView.GetCountyTitle.MakeScope).GetScriptValueDesc('colonization_threshold_value')|0]#!"
 holding_view_habitability_threshold_breakdown: "\n\n[habitability_threshold|E]: #V [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target',HoldingView.GetCountyTitle.MakeScope).ScriptValue('colonization_threshold_value')|0]#!#indent_newline:3 \n[GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target',HoldingView.GetCountyTitle.MakeScope).GetScriptValueDesc('colonization_threshold_value')|0]#!"
 holding_view_habitability_flavor: "\n\n#low The lands of [aeras|E] have been brought to ruin many times over the ages, leaving many corners of the world too [Concept('habitability','#E hazardous#!')] for human life and civilization.#!"

 COLONIZE_COUNTY_TOOLTIP: "[Character.GetPlayerInteractionWithTargetTitleTooltip('colonize_wasteland_interaction', HoldingView.GetCountyTitle)]\n\n#indent_newline:3 Стоимость: [GuiScope.SetRoot(GetPlayer.MakeScope).Custom('colonization_cost_currency')]#V [GuiScope.SetRoot(HoldingView.GetCountyTitle.MakeScope).AddScope('actor',GetPlayer.MakeScope).ScriptValue('colonization_cost_value')|0]#!\n[GuiScope.SetRoot(HoldingView.GetCountyTitle.MakeScope).AddScope('actor',GetPlayer.MakeScope).GetScriptValueDesc('colonization_cost_value')|0]#!"
 COLONIZE_COUNTY_TOOLTIP_HERD_ADDENDUM: ", #V [Concept('herd','@herd_icon!')][GuiScope.SetRoot(HoldingView.GetCountyTitle.MakeScope).AddScope('actor',GetPlayer.MakeScope).ScriptValue('colonization_herd_cost_value')|0]#!"
