l_russian:
 HOLDING_VIEW_WASTELAND_COUNTY: "Uninhabited [county|E]"
 HOLDING_VIEW_TITLE_INFORMATION: "#T [Title.GetBaseNameNoTooltip]#!\n[Localize(Concatenate(Title.GetKey, '_desc'))]"
 COUNTY_HABITABILITY_TOOLTIP: "$holding_view_habitability_header$$holding_view_habitability_effects$$holding_view_habitability_warning$$holding_view_habitability_breakdown$$holding_view_habitability_flavour$"
 COUNTY_HABITABILITY_TOOLTIP_OBSERVER: "$holding_view_habitability_header$$holding_view_habitability_breakdown$$holding_view_habitability_flavor$"
 holding_view_habitability_header: "#T Обитаемость графства: [HoldingView.GetCountyTitle.MakeScope.ScriptValue('county_habitability_value')|0]/100 $holding_view_habitability_grade$#!"
 holding_view_habitability_effects: "\n[SelectLocalization( LessThan_CFixedPoint( HoldingView.GetCountyTitle.MakeScope.ScriptValue('county_habitability_value'), '(CFixedPoint)100' ), 'COLONIZATION_COST_PENALTY', 'COLONIZATION_COST_NO_PENALTY')]\n"
 COLONIZATION_COST_PENALTY: "Стоимость [Concept('colonization','колонизации')|E] увеличена на [HoldingView.GetCountyTitle.MakeScope.ScriptValue('fast_habitability_penalty_value')|N%0]"
 holding_view_habitability_grade: "#weak ([HoldingView.GetCountyTitle.Custom('habitability_grade')|U])#!"
 habitability_grade_idyllic: "Идиллический"
 habitability_grade_untamed: "Дикий"
 habitability_grade_rugged: "Суровый"
 habitability_grade_nice: "Приятный"
 habitability_grade_harsh: "Жесткий"
 habitability_grade_inhospitable: "Непригодный для жизни"
 habitability_grade_hostile: "Враждебный"
 habitability_grade_damned: "Проклятый"
