 SETTLE_RUIN_HOLDING_TOOLTIP_FIRST_STAGE: "Первая стадия этого [Concept('holding','владения')|E] — это #V [AddLocalizationIf(EqualTo_string(HoldingTypeItem.GetHoldingType.GetKey, 'castle_holding'), 'building_castle_01')][AddLocalizationIf(EqualTo_string(HoldingTypeItem.GetHoldingType.GetKey, 'city_holding'), 'building_city_01')][AddLocalizationIf(EqualTo_string(HoldingTypeItem.GetHoldingType.GetKey, 'church_holding'), 'building_temple_01')]#!"
