l_russian:
 HOLDING_VIEW_WASTELAND_COUNTY: "Необитаемое [Concept('county','графство')|E]"
 HOLDING_VIEW_TITLE_INFORMATION: "#T [Title.GetBaseNameNoTooltip]#!\n[Localize(Concatenate(Title.GetKey, '_desc'))]"
 COUNTY_HABITABILITY_TOOLTIP: "$holding_view_habitability_header$$holding_view_habitability_effects$$holding_view_habitability_warning$$holding_view_habitability_breakdown$$holding_view_habitability_threshold_breakdown$$holding_view_habitability_flavor$"
 COUNTY_HABITABILITY_TOOLTIP_OBSERVER: "$holding_view_habitability_header$$holding_view_habitability_breakdown$$holding_view_habitability_flavor$"
 holding_view_habitability_header: "#T Обитаемость графства: [HoldingView.GetCountyTitle.MakeScope.ScriptValue('county_habitability_value')|0]/100 $holding_view_habitability_grade$#!"
 holding_view_habitability_effects: "\n[SelectLocalization( LessThan_CFixedPoint( HoldingView.GetCountyTitle.MakeScope.ScriptValue('county_habitability_value'), '(CFixedPoint)100' ), 'COLONIZATION_COST_PENALTY', 'COLONIZATION_COST_NO_PENALTY')]"
 COLONIZATION_COST_PENALTY: "Стоимость [Concept('colonization','колонизации')|E] увеличена на [HoldingView.GetCountyTitle.MakeScope.ScriptValue('fast_habitability_penalty_value')|N%0]"
 holding_view_habitability_grade: "#weak ([HoldingView.GetCountyTitle.Custom('habitability_grade')|U])#!"
 habitability_grade_idyllic: "Идиллическая"
 habitability_grade_untamed: "Дикая"
 habitability_grade_rugged: "Суровая"
 habitability_grade_nice: "Хорошая"
 habitability_grade_harsh: "Жесткая"
 habitability_grade_inhospitable: "Негостеприимная"
 habitability_grade_hostile: "Враждебная"
 habitability_grade_damned: "Проклятая"
 habitability_alert_epiromnuvo: "\n@alert_icon! #alert_trial $setting_colonizable_epiromnuvo$ Игровое правило [Concept('eripomvuno_biozone','Эрипомвуно')|E] #bold не#! включено#!"
 COLONIZATION_COST_NO_PENALTY: "Эффекты отсутствуют, но если обитаемость опустится ниже 100, [Concept('colonization','колонизация')|E] станет медленнее и дороже"
 holding_view_habitability_warning: "\n[AddTextIf(LessThan_CFixedPoint(HoldingView.GetCountyTitle.MakeScope.ScriptValue('county_habitability_value'),GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target',HoldingView.GetCountyTitle.MakeScope).ScriptValue('colonization_threshold_value')),Concatenate('@warning_icon! #X Обитаемость этого ',Concatenate(Concept('county','#E графства#!'),Concatenate(' ниже вашего #!',Concept('habitability_threshold','#E порога обитаемости#!\n')))))]"
 holding_view_habitability_breakdown: "\nБазовая обитаемость: #V 100#!#indent_newline:3 \n[HoldingView.GetCountyTitle.MakeScope.GetScriptValueDesc('county_habitability_value')|0]#!"
 holding_view_habitability_threshold_breakdown: "\n\n[habitability_threshold|E]: #V [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target',HoldingView.GetCountyTitle.MakeScope).ScriptValue('colonization_threshold_value')|0]#!#indent_newline:3 \n[GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('target',HoldingView.GetCountyTitle.MakeScope).GetScriptValueDesc('colonization_threshold_value')|0]#!"
 holding_view_habitability_flavor: "\n\n#low Земли [Concept('aeras','Эраса')|E] раз за разом разорялись на протяжении веков, из-за чего многие уголки мира стали слишком [Concept('habitability','#E опасными#!')] для человеческой жизни и цивилизации.#!"
 
 COLONIZE_COUNTY_TOOLTIP: "[Character.GetPlayerInteractionWithTargetTitleTooltip('colonize_wasteland_interaction', HoldingView.GetCountyTitle)]\n\n#indent_newline:3 Стоимость: [GuiScope.SetRoot(GetPlayer.MakeScope).Custom('colonization_cost_currency')]#V [GuiScope.SetRoot(HoldingView.GetCountyTitle.MakeScope).AddScope('actor',GetPlayer.MakeScope).ScriptValue('colonization_cost_value')|0]#![AddLocalizationIf(NotEqualTo_CFixedPoint(GuiScope.SetRoot(HoldingView.GetCountyTitle.MakeScope).AddScope('actor',GetPlayer.MakeScope).ScriptValue('colonization_herd_cost_value'),'(CFixedPoint)0'),'COLONIZE_COUNTY_TOOLTIP_HERD_ADDENDUM')]\n[GuiScope.SetRoot(HoldingView.GetCountyTitle.MakeScope).AddScope('actor',GetPlayer.MakeScope).GetScriptValueDesc('colonization_cost_value')|0]#!"
 COLONIZE_COUNTY_TOOLTIP_HERD_ADDENDUM: ", #V [Concept('herd','@herd_icon!')][GuiScope.SetRoot(HoldingView.GetCountyTitle.MakeScope).AddScope('actor',GetPlayer.MakeScope).ScriptValue('colonization_herd_cost_value')|0]#!"
 colonization_cost_currency_prestige: "[Concept('prestige','@prestige_icon!')]"
 colonization_cost_currency_gold: "[Concept('gold','@gold_icon!')]"
 colonization_cost_currency_piety: "[Concept('piety','@piety_icon!')]"

 COASTAL_WASTELAND_TOOLTIP: "Это [Concept('county','графство')|E] прибрежное, и его можно [Concept('colonization','колонизировать')|E] из-за моря"

