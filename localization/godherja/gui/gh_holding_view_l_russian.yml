 SETTLE_RUIN_HOLDING_TOOLTIP_FIRST_STAGE: "Первый этап возведения этого [Concept('holding','владения')|E] — #V [AddLocalizationIf(EqualTo_string(HoldingTypeItem.GetHoldingType.GetKey, 'castle_holding'), 'building_castle_01')][AddLocalizationIf(EqualTo_string(HoldingTypeItem.GetHoldingType.GetKey, 'city_holding'), 'building_city_01')][AddLocalizationIf(EqualTo_string(HoldingTypeItem.GetHoldingType.GetKey, 'church_holding'), 'building_temple_01')]#!"
 SETTLE_RUIN_HOLDING_TOOLTIP_GOLD: "[AddLocalizationIf(LessThan_CFixedPoint(GetPlayer.GetGold, '(CFixedPoint)250'), 'SETTLE_RUIN_HOLDING_TOOLTIP_MISSING_GOLD')]"
