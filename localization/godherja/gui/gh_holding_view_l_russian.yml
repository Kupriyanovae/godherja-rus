 COLONIZATION_PROGRESS_OUTLINER: "[Concept('colonization','@colonization_progress_icon!')] #V [FixedPointToFloat(Holding.GetProvince.GetCounty.GetTitle.MakeScope.Var('colonization_story').Var('colonization_progress').GetValue)|1]/100#!"
 SETTLE_RUIN_HOLDING_TOOLTIP: "$SETTLE_RUIN_HOLDING_TOOLTIP_TITLE$\n$SETTLE_RUIN_HOLDING_TOOLTIP_FLAVOR$\n\n$SETTLE_RUIN_HOLDING_TOOLTIP_FIRST_STAGE$\n$SETTLE_RUIN_HOLDING_TOOLTIP_GOLD$\n\n$SETTLE_RUIN_HOLDING_TOOLTIP_COST$"
 SETTLE_RUIN_HOLDING_TOOLTIP_TITLE: "#T Построить [Localize(HoldingTypeItem.GetHoldingType.GetKey)|V]#!"
