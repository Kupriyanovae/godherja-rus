l_russian:
 FAITH_JUDGES:0 "Кодексы"
 FAITH_JUDGES_EXPLANATION:0 "С незапамятных времен хубаритская [COncept('faith','вера')|E] находилась под надзором системы [Concept('magi','магов')|E]-судей, чья божественная мудрость вела верующих сквозь все невзгоды. За неисчислимые тысячелетия некоторые из этих солнечных хранителей и их правовые учения сами стали легендами, а их блестящие идеи о законе и справедливости сохраняют силу и по сей день.\n\nНаличие [Concept('traits','свойств')|E], синергирующих с выбранным сводом законов, усиливает его бонусы (максимальный эффект ограничен сложностью кодекса), однако персонаж не может выбрать свод законов, если не соответствует порогу его сложности."
 FAITH_JUDGES_DESC:0 "Свод законов [Scope.Var('judge_character').GetCharacter.GetFirstNameNoTooltip] в первую очередь затрагивает [SelectLocalization('(bool)no','',Concatenate(Concatenate(Scope.Var('first_loc_trait').GetFlagName,'_intro_desc_'),Scope.Var('law_code_difficulty_loc').GetFlagName))], [SelectLocalization('(bool)no','',Concatenate(Concatenate(Scope.Var('second_loc_trait').GetFlagName,'_intro_desc_'),Scope.Var('law_code_difficulty_loc').GetFlagName))] и [SelectLocalization('(bool)no','',Concatenate(Concatenate(Scope.Var('third_loc_trait').GetFlagName,'_intro_desc_'),Scope.Var('law_code_difficulty_loc').GetFlagName))]. Этот кодекс считается [SelectLocalization('(bool)no','',Concatenate(Scope.Var('law_code_difficulty_loc').GetFlagName,'_desc'))]."
 
 brave_intro_desc_no_law_code_difficulty:0 "надлежащее поведение на войне"
 brave_intro_desc_low_law_code_difficulty:0 "важность честного поведения как на поле боя, так и за его пределами"
 brave_intro_desc_medium_law_code_difficulty:0 "исследование понятия чести с упором на необходимость универсальных социальных норм для регулирования жизни людей"
 brave_intro_desc_high_law_code_difficulty:0 "концепцию общества, свято чтящего честь, где строгие кодексы личного поведения способны предотвратить многие преступления, а также подробное объяснение того, как социальные стандарты поддерживают устои закона даже в отсутствие внешнего принуждения"
 craven_intro_desc_no_law_code_difficulty:0 "важность страха в обществе"
 craven_intro_desc_low_law_code_difficulty:0 "ценность всеобщей осторожности для поддержания порядка"
 craven_intro_desc_medium_law_code_difficulty:0 "философские аспекты страха и то, как подобные эмоции удерживают людей в дозволенных рамках"
 craven_intro_desc_high_law_code_difficulty:0 "подробное объяснение того, как личное стремление к самосохранению можно проецировать на все общество, показывая на исторических примерах, что так называемый «трусливый» выбор часто оказывается наиболее разумным"
 calm_intro_desc_no_law_code_difficulty:0 "необходимость объективного и рационального подхода к правосудию"
 calm_intro_desc_low_law_code_difficulty:0 "важность сохранения хладнокровия при принятии судьбоносных решений"
 calm_intro_desc_medium_law_code_difficulty:0 "личные приемы автора по сохранению спокойствия в стрессовых ситуациях и обоснование того, почему повсеместное применение этих методов сделало бы мир лучше"
 calm_intro_desc_high_law_code_difficulty:0 "превосходно написанный трактат о моральном императиве спокойного, rationalльного и беспристрастного суда с анализом распространенных логических ошибок и подсознательных предубеждений, жертвами которых часто становятся судьи"
 wrathful_intro_desc_no_law_code_difficulty:0 "то, как гнев помогает держать людей в узде"
 wrathful_intro_desc_low_law_code_difficulty:0 "ценность и даже необходимость суровых мер для поддержания закона"
 wrathful_intro_desc_medium_law_code_difficulty:0 "важность внушения страха перед нарушением закона всем подданным государства, а также методы культивирования такого отношения"
 wrathful_intro_desc_high_law_code_difficulty:0 "развернутую концепцию всеобщего социального договора между всеми членами цивилизованного общества, основанную на понимании, что нарушение установленных законов влечет за собой сокрушительную кару со стороны тех, кто их защищает"
 just_intro_desc_no_law_code_difficulty:0 "необходимость справедливого правления, равного для всех"
 just_intro_desc_low_law_code_difficulty:0 "важность укрепления уверенности народа в беспристрастности закона"
 just_intro_desc_medium_law_code_difficulty:0 "необходимость равного отношения законов ко всем подданным с объяснением того, как предвзятая система погрязает в коррупции"
 just_intro_desc_high_law_code_difficulty:0 "ряд глубоких мыслей о философской природе справедливости и правосудия, подкрепленных притчами, которые иллюстрируют ключевые принципы, необходимые при принятии решений"
 arbitrary_intro_desc_no_law_code_difficulty:0 "непредсказуемую природу жизни"
 arbitrary_intro_desc_low_law_code_difficulty:0 "защиту поступков, кажущихся случайными и нелогичными"
 arbitrary_intro_desc_medium_law_code_difficulty:0 "объяснение того, почему гибкая правовая система способна принимать более верные решения в каждый конкретный момент, с наглядными примерами"
 arbitrary_intro_desc_high_law_code_difficulty:0 "глубокий деконструкцию традиционных представлений о правосудии с акцентом на том, что понятие «справедливой системы» для большинства людей лишь означает выгоду для них самих, поскольку истинной справедливости не существует, а любая система должна оставаться гибкой"
 diligent_intro_desc_no_law_code_difficulty:0 "ценность усердного труда"
 diligent_intro_desc_low_law_code_difficulty:0 "важность того, чтобы каждый человек, независимо от своего положения, приносил максимальную пользу обществу"
 diligent_intro_desc_medium_law_code_difficulty:0 "изложение ключевого принципа автора: долг каждого члена общества заключается в том, чтобы вносить в его развитие максимальный вклад"
 diligent_intro_desc_high_law_code_difficulty:0 "сложное авторское видение «идеального общества» и точных ролей, которые должен брать на себя каждый человек для достижения предельной эффективности и продуктивности, со множеством философских отступлений в обоснование предлагаемой иерархии"
 lazy_intro_desc_no_law_code_difficulty:0 "необходимость беречь силы для действительно важных дел"
 lazy_intro_desc_low_law_code_difficulty:0 "принцип, согласно которому общество само покарает обидчиков без постороннего вмешательства"
 lazy_intro_desc_medium_law_code_difficulty:0 "подробное объяснение того, как излишнее стремление обеспечить исполнение закона лишь ослабляет его, поскольку трата напрасных усилий не приносит результатов"
 lazy_intro_desc_high_law_code_difficulty:0 "пространное эссе о добродетели экономии сил с изложением причин, почему чрезмерные усилия вредят обществу в целом — как в праве, так и в повседневной жизни, с особым упором на нежелательность создания новых проблем из-за излишнего рвения"
 chaste_intro_desc_no_law_code_difficulty:0 "необходимость укрощения своих низменных желаний"
 chaste_intro_desc_low_law_code_difficulty:0 "ценность личной сдержанности для общества в целом"
 chaste_intro_desc_medium_law_code_difficulty:0 "разбор пороков несдержанных людей вместе с советами по исправлению подобного поведения"
 chaste_intro_desc_high_law_code_difficulty:0 "строго проработанную теорию человеческой психики, сосредоточенную на методах построения социальной системы, наиболее эффективно обуздывающей людские порывы, с широким набором личных рекомендаций"
 lustful_intro_desc_no_law_code_difficulty:0 "пользу человеческих страстей"
 lustful_intro_desc_low_law_code_difficulty:0 "важность человеческих инстинктов при принятии решений"
 lustful_intro_desc_medium_law_code_difficulty:0 "учет человеческого фактора в любой правовой системе с акцентом на работе в согласии с этими элементами, а не вопреки им"
 lustful_intro_desc_high_law_code_difficulty:0 "глубокий комментарий о недостатках бесстрастной системы, раскрывающий искусственность идеи самоконтроля и доказывающий, что идеальная система должна принимать то, что многие ошибочно считают человеческими слабостями"
 content_intro_desc_no_law_code_difficulty:0 "добродетель принятия своего жребия в жизни"
 content_intro_desc_low_law_code_difficulty:0 "короткий раздел о ролях, которые каждый человек должен исполнять в обществе"
 content_intro_desc_medium_law_code_difficulty:0 "необходимость смирения со своей долей, с акцентом на том, сколько вреда принесли те, кто пытался возвыситься"
 content_intro_desc_high_law_code_difficulty:0 "подробное объяснение добродетели принятии своей судьбы, раскрывающее, как общество выигрывает, когда люди не ставят личные интересы выше общей системы и проявляют готовность принимать реальность такой, какая она есть"
 ambitious_intro_desc_no_law_code_difficulty:0 "добродетель непрерывного стремления к самосовершенствованию"
 ambitious_intro_desc_low_law_code_difficulty:0 "суровую дух соперничества, необходимый для того, чтобы возвыситься над толпой"
 ambitious_intro_desc_medium_law_code_difficulty:0 "ценность самосовершенствования, даже за счет других, с акцентом на концепции естественной меритократии, которая увядает при попытках ограничить амбиции"
 ambitious_intro_desc_high_law_code_difficulty:0 "длинный ряд теоретических примеров, демонстрирующих пользу для всего общества от свободы людей добиваться успеха, а также описывающих устройство системы, способствующей развитию этого духа и гарантирующей возвышение только достойных"
 fickle_intro_desc_no_law_code_difficulty:0 "ценность способности менять свое мнение"
 fickle_intro_desc_low_law_code_difficulty:0 "необходимость готовности пересматривать и отменять прежние решения"
 fickle_intro_desc_medium_law_code_difficulty:0 "то, как сомнение в собственных решениях отличает хорошего судью, ведь он должен подвергать себя той же строгой проверке, какой его подвергли бы другие"
 fickle_intro_desc_high_law_code_difficulty:0 "изящно сформулированный аргумент в пользу проверки, пересмотра и даже отмены своих прошлых решений с детальным разбором различных вариантов самообмана, к которым прибегают люди, чтобы держаться за ошибочный вердикт"
 stubborn_intro_desc_no_law_code_difficulty:0 "ценность верности своим убеждениям"
 stubborn_intro_desc_low_law_code_difficulty:0 "необходимость отстаивать даже потенциально ошибочные суждения ради сохранения устойчивости системы"
 stubborn_intro_desc_medium_law_code_difficulty:0 "то, что хороший судья твердо стоит на своих решениях, поскольку постоянно меняющаяся система теряет эффективность и погрязает в спорах"
 stubborn_intro_desc_high_law_code_difficulty:0 "теорию, согласно которой правитель, пересматривающий свои решения, подрывает доверие народа к системе, в глазах подданных она становится слабой и непредсказуемой, что лишает ее всякого авторитета"
 forgiving_intro_desc_no_law_code_difficulty:0 "важность прощения"
 forgiving_intro_desc_low_law_code_difficulty:0 "важнейшую концепцию личного искупления, каково бы ни было преступление"
 forgiving_intro_desc_medium_law_code_difficulty:0 "идеал предоставления людям возможности загладить прошлые проступки с акцентом на праве на второй шанс и неровном характере того, кто именно получает возможность искупить вину"
 forgiving_intro_desc_high_law_code_difficulty:0 "подробный план перестройки системы правосудия вокруг идей искупления с упором на обучение бывших преступников повторной интеграции в гражданское общество после отбытия наказания"
 vengeful_intro_desc_no_law_code_difficulty:0 "концепцию возмездия"
 vengeful_intro_desc_low_law_code_difficulty:0 "принцип, согласно которому любое преступление должно быть соразмерно оплачено"
 vengeful_intro_desc_medium_law_code_difficulty:0 "утверждение о том, что излишнее всепрощение лишь поощряет преступность и лишает потерпевших права на компенсацию"
 vengeful_intro_desc_high_law_code_difficulty:0 "сложную систему определения точного и справедливого наказания за проступок, гарантирующую, что никто не уйдет от полной меры ответственности, с пояснением соразмерности каждого карательного акта совершенному деянию"
 generous_intro_desc_no_law_code_difficulty:0 "помощь нуждающимся"
 generous_intro_desc_low_law_code_difficulty:0 "жизненную важность благотворительности в обществе"
 generous_intro_desc_medium_law_code_difficulty:0 "призыв к действию, провозглашающий долг читателя помогать ближним вопреки собственным интересам, а также разрушительность алчности для всех и каждого"
 generous_intro_desc_high_law_code_difficulty:0 "нравственный аргумент о том, что обладающие богатством и властью обязаны помогать нуждающимся, а успех общества измеряется уровнем жизни его народа, с упором на практическое воплощение этого видения в реальность"
 greedy_intro_desc_no_law_code_difficulty:0 "важность стимула"
 greedy_intro_desc_low_law_code_difficulty:0 "необходимость личной мотивации"
 greedy_intro_desc_medium_law_code_difficulty:0 "аргументацию в пользу системы, ориентированной на личные интересы, согласно которой процветание общества складывается из успеха отдельных людей"
 greedy_intro_desc_high_law_code_difficulty:0 "глубокий разбор против идеи благотворительности: идеальная система должна стимулировать людей помогать себе самим, а не опекать их, предлагая соответствующие правовые механизмы для социальной мобильности"
 gregarious_intro_desc_no_law_code_difficulty:0 "важность гласности"
 gregarious_intro_desc_low_law_code_difficulty:0 "ценность правовой системы, доступной каждому"
 gregarious_intro_desc_medium_law_code_difficulty:0 "ряд доводов в пользу открытой системы, где публичность является ключевым столпом правовой философии, обеспечивающим ее высокую эффективность"
 gregarious_intro_desc_high_law_code_difficulty:0 "проект открытой правовой системы, в которой указы, судебные процессы и ключевые дела регулярно становятся достоянием общественности, поскольку автор убежден, что прозрачность способствует лучшему отправлению правосудия"
 shy_intro_desc_no_law_code_difficulty:0 "важность тайн и конфиденциальности"
 shy_intro_desc_low_law_code_difficulty:0 "ценность системы, возвышающейся над простыми людьми"
 shy_intro_desc_medium_law_code_difficulty:0 "аргументы в пользу закрытой правовой системы, поскольку сохранение пиетета перед властью важнее осведомленности масс о законах, которые большинства из них касаться не должны"
 shy_intro_desc_high_law_code_difficulty:0 "проект правовой системы, стоящей над простым народом и минимально вмешивающейся в его повседневность, где судопроизводство остается в тайне, так как, по мнению автора, закрытость лучше внушает уважение к закону"
 honest_intro_desc_no_law_code_difficulty:0 "ценность истины"
 honest_intro_desc_low_law_code_difficulty:0 "важность отделения фактов от лжи"
 honest_intro_desc_medium_law_code_difficulty:0 "объяснение того, почему поиск правды, даже если она неудобна, служит ключевым элементом работающей системы"
 honest_intro_desc_high_law_code_difficulty:0 "этическое обоснование того, что долг системы — установление истины, со списком идеальных процедур для этого, включая детальные методы расследования и строгую проверку любых фактов"
 deceitful_intro_desc_no_law_code_difficulty:0 "гибкость истины"
 deceitful_intro_desc_low_law_code_difficulty:0 "изменчивую природу того, что считается правдой и ложью"
 deceitful_intro_desc_medium_law_code_difficulty:0 "объяснение того, как легко искажается правда и как люди постоянно искривляют ее, ввиду чего система должна сосредоточиться на том, что приносит результат"
 deceitful_intro_desc_high_law_code_difficulty:0 "философское исследование природы истины, утверждающее, что реальность часто является лишь тем, во что верят люди, а не объективным фактом, система должна учитывать это, ориентируясь на полезные в данный момент версии правды"
 humble_intro_desc_no_law_code_difficulty:0 "важность равенства"
 humble_intro_desc_low_law_code_difficulty:0 "необходимость системы, закон которой обязателен абсолютно для каждого"
 humble_intro_desc_medium_law_code_difficulty:0 "аргумент о том, что правовая система, под действие которой не подпадают сами правители и чиновники, обречена на крах"
 humble_intro_desc_high_law_code_difficulty:0 "концептуальный проект, согласно которому управляющие системой лица должны отвечать по тем же стандартам, что и их подданные, иначе коррупция разрушит правосудие изнутри и сведет на нет всю его эффективность"
 arrogant_intro_desc_no_law_code_difficulty:0 "важность твердого руководства"
 arrogant_intro_desc_low_law_code_difficulty:0 "необходимость сильной руки для управления системой"
 arrogant_intro_desc_medium_law_code_difficulty:0 "аргумент о том, что лицо, стоящее во главе правовой системы, не всегда должно быть ограничено ее рамками"
 arrogant_intro_desc_high_law_code_difficulty:0 "концептуальный проект, согласно которому правитель обязан принимать прямое участие в работе правовой системы и даже стоять над законом ввиду своей исключительной роли в отправлении правосудия во всем государстве"
 patient_intro_desc_no_law_code_difficulty:0 "ценность времени"
 patient_intro_desc_low_law_code_difficulty:0 "важность системы, не ограниченной жесткими временными рамками"
 patient_intro_desc_medium_law_code_difficulty:0 "объяснение того, как спешка в судопроизводстве ведет к ошибочным решениям, ущерб от которых перекрывает любую выгоду от скорости"
 patient_intro_desc_high_law_code_difficulty:0 "проект системы, действующей по детально проработанным процедурам, где каждому этапу отводится столько времени, сколько нужно для верного исхода, поскольку погоня за скоростью вредит эффективности правосудия"
 impatient_intro_desc_no_law_code_difficulty:0 "ценность скорости"
 impatient_intro_desc_low_law_code_difficulty:0 "важность системы, способной действовать стремительно"
 impatient_intro_desc_medium_law_code_difficulty:0 "необходимость правосудия, быстро приходящего к выводам без лишних задержек и бюрократической пролочки"
 impatient_intro_desc_high_law_code_difficulty:0 "проект системы, нацеленной на максимальное упрощение и ускорение процессов для эффективного разбора множества дел без утопления в громоздких процедурах"
 temperate_intro_desc_no_law_code_difficulty:0 "ценность самоконтроля"
 temperate_intro_desc_low_law_code_difficulty:0 "важность умения правителя обуздывать свои порывы"
 temperate_intro_desc_medium_law_code_difficulty:0 "свод правил, используемых автором для удержания себя в допустимых рамках, с подробным пояснением каждого из них"
 temperate_intro_desc_high_law_code_difficulty:0 "обширный трактат о том, как неспособность правителя держать себя в руках подрывает его авторитет и вызывает неуважение со стороны подданных"
 gluttonous_intro_desc_no_law_code_difficulty:0 "важность внешнего вида"
 gluttonous_intro_desc_low_law_code_difficulty:0 "важность производимого внушительного впечатления"
 gluttonous_intro_desc_medium_law_code_difficulty:0 "критерии, по которым правитель может оценивать свой облик в глазах окружающих, а также руководства по поддержанию величественного вида"
 gluttonous_intro_desc_high_law_code_difficulty:0 "обширный трактат о том, как демонстрация роскоши и величия помогает правителю в управлении, поскольку люди испытывают почтение к тому, чье богатство и успехи видны невооруженным глазом"
 trusting_intro_desc_no_law_code_difficulty:0 "презумпцию невиновности"
 trusting_intro_desc_low_law_code_difficulty:0 "необходимость считать обвиняемого невиновным, пока не доказано обратное"
 trusting_intro_desc_medium_law_code_difficulty:0 "обоснование того, что презумпция невиновности является фундаментальным моральным императивом любой правовой системы"
 trusting_intro_desc_high_law_code_difficulty:0 "убедительную аргументацию против презумпции виновности, показывающую, как подобный подход искажает суд над обвиняемым, и подведение итога: лучше выпустить на свободу убийцу, чем заточить невиновного"
 paranoid_intro_desc_no_law_code_difficulty:0 "презумпцию виновности"
 paranoid_intro_desc_low_law_code_difficulty:0 "необходимость изначально считать обвиняемого виновным, чтобы побудить его к более активной защите"
 paranoid_intro_desc_medium_law_code_difficulty:0 "обоснование того, что завуалированная презумпция виновности является более эффективным методом отправления правосудия и борьбы с преступностью"
 paranoid_intro_desc_high_law_code_difficulty:0 "убедительную аргументацию в пользу презумпции виновности как необходимого элемента системы, заставляющего обвиняемого раскрывать максимум информации в свою защиту и исключающего уход преступников от ответственности из-за формальностей"
 zealous_intro_desc_no_law_code_difficulty:0 "важность идеалов"
 zealous_intro_desc_low_law_code_difficulty:0 "добродетель верности своим убеждениям"
 zealous_intro_desc_medium_law_code_difficulty:0 "раздел, посвященный осуждению лицемерных правителей, не соответствующих стандартам собственной системы"
 zealous_intro_desc_high_law_code_difficulty:0 "призыв свято блюсти идеалы системы, управление которой доверено правителю, ибо отступление от них сверху ведет к коррупции и создает видимость лицемерия"
 cynical_intro_desc_no_law_code_difficulty:0 "важность прагматизма"
 cynical_intro_desc_low_law_code_difficulty:0 "ценность прагматичной и адаптивной системы"
 cynical_intro_desc_medium_law_code_difficulty:0 "раздел, посвященный развенчанию правового идеализма, с упором на то, что система не должна слепо следовать ненужным принципам" 
 cynical_intro_desc_high_law_code_difficulty:0 "детальный разбор традиционных правовых идеалов с акцентом на том, как они препятствуют работе правосудия, и почему правитель должен делать ставку на гибкость и эффективные решения, а не на абстрактную мораль"
 compassionate_intro_desc_no_law_code_difficulty:0 "сострадание к ближнему"
 compassionate_intro_desc_low_law_code_difficulty:0 "нравственную ценность понимания и помощи другим людям"
 compassionate_intro_desc_medium_law_code_difficulty:0 "сборник историй людей, которым помог автор, призванный вдохновить читателя на аналогичные благородные поступки"
 compassionate_intro_desc_high_law_code_difficulty:0 "красноречивые размышления о природе человека и долге каждого помогать ближним, а также соображения о том, как проектировать правовую систему для содействия таким порывам"
 sadistic_intro_desc_no_law_code_difficulty:0 "преимущества жестоких наказаний"
 sadistic_intro_desc_low_law_code_difficulty:0 "необходимость драконовских мер для устрашения потенциальных преступников"
 sadistic_intro_desc_medium_law_code_difficulty:0 "пример свода законов с описанием изощренно-жестоких и устрашающих кары за различные проступки"
 sadistic_intro_desc_high_law_code_difficulty:0 "анализ природы наказания и его воздействия на человеческую психику с обоснованием того, почему даже за незначительные проступки следует карать с предельной суровостью во имя общего блага"
 callous_intro_desc_no_law_code_difficulty:0 "преимущества бесстрастия"
 callous_intro_desc_low_law_code_difficulty:0 "необходимость отстраненной и беспристрастной позиции при вынесении приговора"
 callous_intro_desc_medium_law_code_difficulty:0 "разбор судебных дел, решения по которым автор считает ошибочными из-за личных привязанностей судей, с предложением собственных вердиктов"
 callous_intro_desc_high_law_code_difficulty:0 "детальный анализ того, как эмоциональная вовлеченность вредит принятию решений, с изложением техник борьбы с ненужными чувствами при отправлении правосудия"
 
 high_law_code_difficulty_name:0 "Сложный"
 high_law_code_difficulty_desc:0 "невероятно мудреным и крайне трудным для освоения кодексом, для его верного понимания требуется глубокое владение продвинутыми правовыми концепциями"
 medium_law_code_difficulty_name:0 "Средний"
 medium_law_code_difficulty_desc:0 "достаточно продвинутым и запутанным кодексом, для его надлежащего применения необходимо хорошее понимание юридического языка"
 low_law_code_difficulty_name:0 "Простой"
 low_law_code_difficulty_desc:0 "сравнительно легким в использовании кодексом, в котором почти не используются сложные юридические понятия"
 no_law_code_difficulty_name:0 "Элементарный"
 no_law_code_difficulty_desc:0 "крайне доступным кодексом, понятным даже простолюдину, а потому пригодным для самого широкого распространения"
 
