l_russian:
 living_magic_name: "Живая магия"
 living_magic_desc: "$game_concept_living_magic_desc$"

 dead_magic_name: "Мёртвая магия"
 dead_magic_desc: "$game_concept_dead_magic_desc$"


#Sjalvolki 
 wood_law_name: "Лесной закон"
 wood_law_desc: "В суровых первозданных диких земля Внутреннего Континента большая часть [Concept('magic','магии')|E] творится согласно правилам и обычаям так называемого «Лесного Закона». Большинство его учений считают силы [Concept('aspect_nature','природы')|E] злыми и своенравными, а потому строго регламентируют порядок и цену обращения к ним — цену, которая чаще всего платится [Concept('aspect_blood','кровью')|E]."

 silentspeak_name: "Безмолвная речь"
 silentspeak_desc: "Хотя сегодня оракульские искусства Безмолвной речи больше известны как «магия Тумана», они на самом деле предшествовали [Concept('frodbrokna','Фродброкне')|E] на целые века. Однако со времен этого события школа пережила стремительный взлет благодаря своей способности управлять [Concept('the_fog','Туманом')|E] и казавшемуся повсеместному всплеску магической силы, сопровождавшему появление этого феномена."

 #Partic
 keepers_of_the_grove_name: "Хранители рощи"
 keepers_of_the_grove_desc: "«Хранители рощ» — одно из многих названий друидического жреческого сословия партиков. Чужакам о них известно немногое: любых потенциальных послушников забирают из семей и обучают их своим тайным обычаям."
 #Karzarad
 keepers_of_legends_name: "Хранители преданий"
 keepers_of_legends_desc: Происхождение Хранителей преданий столь же таинственно, как и истоки их народа. Орден кузнецов-[Concept('magi','магов')|E], они трудятся над тем, чтобы сохранять живыми истории и традиции карзарадского народа. Хранители децентрализованы и периодически кочуют по всей диаспоре карзарадцев, чтобы лучше исполнять свое предназначение.\n\nШколу отличает необычный дуализм их магических знаний: Хранители прекрасно искушены в практическом применении хранимых ими заклинаний — от сложных механических конструкций, созданных их народом, до различных болезней, которые, согласно древнейшим легендам, использовали жестокие тираны. Это привело к развитию их мастерства в заклинаниях [Concept('aspect_metal','металла')|E] и [Concept('aspect_nature','природы')|E]."


 #Sarradon
 school_of_esoterics_name: "Школа эзотерики"
 school_of_esoterics_desc: "Вслед за [Concept('the_decimation_of_sarradon','Халакдуном')|E] и уничтожением [Concept('sirhad','сирхадов')|E] саррадонские [Concept('magi','маги')|E] организовались в различные «мелкие сирхады» — по сути, не более чем скромные сети ковенов, цепляющихся за расшифрованные и декодированные фолианты, оставленные их по большей части погибшими или пропавшими предшественниками. На востоке континента это вылилось в создание так называемой Школы эзотерики — союза академий магов и независимых мастеров, основавших свои изыскания на сохранившемся корпусе текстов, посвященных искусствам [Concept('arcana','арканы')|E], считавшихся «выше» повседневных мирских дел, а именно: [Concept('aspect_celestial','небес')|E], [Concept('aspect_dark','тьмы')|E] и [Concept('aspect_dream','грёз')|E]."

 school_of_manifestations_name: "Школа проявлений"
 school_of_manifestations_desc: "Вслед за [Concept('the_decimation_of_sarradon','Халакдуном')|E] и уничтожением [Concept('sirhad','сирхадов')|E] саррадонские [Concept('magi','маги')|E] организовались в различные «мелкие сирхады» — по сути, не более чем скромные сети ковенов, цепляющихся за расшифрованные и декодированные фолианты, оставленные их по большей части погибшими или сгинувшими предшественниками. На западе континента это проявилось в создании Школы проявлений, чья практика строилась вокруг более мирских и прикладных искусств, унаследованных от сгинувших предков.\n\nПоскольку их навыки имели решающее значение для поддержания разрушающейся «Публичной магии», украшавшей крупнейшие мегаполисы Саррадона, маги Школы проявлений специализируются на [Concept('arcana','аркане')|E] [Concept('aspect_water','воды')|E], [Concept('aspect_metal','металла')|E] и [Concept('aspect_stone','камня')|E]."

 school_of_malignancies_name: "Школа пагубности"
 school_of_malignancies_desc: "Скорее союз по расчету, чем формализованная саррадонская школа, Школа пагубности — это общий ярлык, под который попадает любой саррадонский [Concept('magi','маг')|E], практикующий [Concept('arcana','аркану')|E] с дурной репутацией. Хотя такие чародеи никогда не подвергались системным запретам, они сталкиваются с пристальным наблюдением и дискриминацией, пусть польза их искусства и означает, что их таланты почти всегда востребованы вопреки народным подозрениям.\n\nК Школе пагубности причисляют арканы [Concept('aspect_death','смерти')|E], [Concept('aspect_ice','льда')|E] и, из-за травмы [Concept('the_decimation_of_sarradon','Халакдуна')|E], [Concept('aspect_blood','крови')|E]."
 
 obsidian_mirror_oneiroscopy_name: "Онейроскопия обсидианового зеркала"
 obsidian_mirror_oneiroscopy_desc: "Сначала приходят кошмары, ночь за ночью [Concept('magi','магу')|E] снится, будто он бесконечно вглядывается в черное как чернила зеркало. Затем раздается голос — почти невидимое присутствие, таящееся прямо за плечом будущего адепта, шепчет ему в левое ухо истины, тающие с восходом солнца. Те маги, у кого хватает воли слушать (или те, кому не хватает воли заглушить эти сны), вскоре обнаруживают, что их разум наполняется оккультными откровениями — плодом наставлений Присутствия в Зеркале. Зародившись в Саррадоне, это учение, как считается, распространяется через «зараженные» тексты среди наиболее восприимчивых магов. Внедряясь в ткани [Concept('aeras','Эраса')|E] подобно раковой опухоли, подобные явления теперь случаются даже на далеком [Concept('the_continent','Континенте')|E].\n\nТем магам, что внимают ему, Присутствие открывает тайны [Concept('arcana','арканы')|E] [Concept('aspect_dark','тьмы')|E], [Concept('aspect_air','воздуха')|E] и [Concept('aspect_dream','грёз')|E]. Со временем адепты часто страдают от угасания рассудка, и многие из самых безумных сгинули в [Glossary('Саррадонской пустыне','sarradonian_desert_encyclopedia_desc')], следуя за шепотом, обещающим невообразимое могущество в запечатанном гробнице глубоко под бескрайними песками."

 greenwenders_of_sarradon_name: "Зеленоходцы Саррадона" 
 greenwenders_of_sarradon_desc: "Кое-где путешественник может найти островки густых кедровых лесов рассеянные по всему Саррадону, — непокорные островки, устоявшие перед медленным иссушением континента и прожорливыми очагами тысячелетней человеческой цивилизации. Мстительные и враждебные лесные духи, охраняющие эти места, говорят о древней эпохе, когда лес покрывал весь север Саррадона — о времени древних и ужасных богов-царей и еще более древней магии.\n\nГоворят, что зеленоходцы — последние хранители той магии, в остальном утерянной во времени и сменившейся развитием цивилизации. В высшем обществе их высмеивают как грязных и странных, а сами зеленоходцы действуют в тайных братствах, рассеянных по сельской местности Центрального Саррадона."  
 
 luminous_discipline_name: "Светоносная дисциплина"
 luminous_discipline_desc: "В древнейших сказаниях Харадамата, дошедших, возможно, с тех времен, когда слово «Саррадон» еще ничего не значило, к [Concept('magi','магам')|E] повсеместно применялся один необычный термин. И если в современных пересказах часто используется слово «маг», то более точным переводом того древнего понятия было бы «практик Светоносной дисциплины». И хотя саррадонские культуры, населяющие большую часть полуострова, могут считать это лишь языковой особенностью, для дежунийских народов во внутренних районах Харадамата это означает нечто куда большее.\n\nИбо для них Светоносная дисциплина все еще практикуется так же, как и в древних сказаниях. Не будучи строго оформленной системой магии, подобной тем, что практикуют их саррадонские соседи или [Concept('aversaria','аверсарианцы')|E] за морем, эти древние обряды все еще удерживают власть над силами [Concept('aspect_light','света')|E] и [Concept('aspect_fire','огня')|E] — и будут удерживать до тех пор, пока живы эти сказания."  

 sungazers_name: "Солнцезрячие"
 sungazers_desc: "В Акерсхане магия всегда была тесно связана с Охрасиком, и большинство ахридаристов верят, что он — исток всей магии. Маги этого региона известны как солнцезрячие, поскольку они пытаются провидеть волю Охрасика путем пристального наблюдения за солнцем. Эти наблюдения почти неизбежно приводят к провозглашению великих побед, которые Охрасик одерживает над силами тьмы.\n\nЧерпая силы из [Concept('aspect_light','света')|E], [Concept('aspect_fire','огня')|E] и изредка [Concept('aspect_blood','крови')|E], солнцезрячие способны обрушивать разрушительные магические атаки. Однако в мирное время они направляют свою магию в более созидательное русло, направляя солнечный свет для роста растений."

 #Marcher

 #Marcher
 illuminated_order_of_holy_principles_name: "Озаренный орден Святейших Принципов"
 illuminated_order_of_holy_principles_desc: "Строго догматическая и бюрократизированная школа с центром в [Concept('chevalie','Шевалье')|E], Озаренный орден Святейших Принципов время от времени доминировал в учениях и обычаях шевальенских [Concept('antimagic_orders','антимагических орденов')|E] со времен [Concept('sorrowing_of_oejeynica','Скорби Ойейницы')|E]. Их практики давно сосредоточены на защитных заклинаниях, предназначенных для борьбы с нежитью, а также на целительских искусствах с использованием [Concept('arcana','арканы')|E] [Concept('aspect_light','света')|E], [Concept('aspect_celestial','небес')|E] и [Concept('aspect_blood','крови')|E]."

 alchimuur_name: "Алхимуур"
 alchimuur_desc: "Встречающийся преимущественно на Граанмаарских пустошах, Алхимуур зародился как шаткий союз между [Concept('magi','магами')|E] и алхимиками, но расширился после Народной революции 1099 года, взяв на себя более важную роль в защите секретов конайкмейнерской алхимии. Подавляющая часть их навыков и практик посвящена внутреннему устройству Зельеварни Короны Вирджиллиарс, а сами они специализируются на тайнах [Concept('aspect_water','воды')|E] и [Concept('aspect_nature','природы')|E]."

 #Pirate Coast
 school_of_night_scrying_name: "Школа ночного провидения"
 school_of_night_scrying_desc: "Изрезанные проливы между [Concept('kashirya','Каширией')|E] и [Concept('sarradon','Саррадоном')|E] стали домом для вольной конфедерации [Concept('magi','магов')|E], посвятивших свою [Concept('arcana','аркану')|E] познанию ночного неба. Традиционно они выступают в роли мудрецов или знахарей по всему архипелагу, хотя их навыки астрономии и навигации высоко ценятся любыми кораблями, способными их оплатить, ведь водные пути [Concept('pirate_coast','Пиратского побережья')|E] славятся своей коварностью. Их знания сосредоточены на [Concept('aspect_celestial','небесах')|E] и [Concept('aspect_air','воздухе')|E]." 

 #Lichdoms
 school_of_rejection_name: "Школа отвержения"
 school_of_rejection_desc: "Бесплодные пустоши [Concept('the_lichdoms','Владений личей')|E] не видели полноценной школы уже более [Concept('sorrowing_of_oejeynica','тысячелетия')|E], однако неутолимый голод личей к тайным знаниям и их рвение в охране всего добытого сохранили магические секреты Ойейницы обособленными и зловещими для земель живых. Все [Concept('liches','личи')|E] практикуют [Concept('aspect_dark','темные')|E] искусства [Concept('aspect_death','смерти')|E], хотя личи севера также широко известны своим контролем над силами [Concept('aspect_stone','камня')|E]."

 #Islands
 amber_cup_rites_name: "Обряды Янтарной Чаши"
 amber_cup_rites_desc: "Искусство [Concept('magi','магов')|E], рожденное в глубинах Моря Империй. В апокрифах утверждается, что обряд Янтарной Чаши восходит к пятидесяти пяти традиционным ложам, основанным на скалистых склонах старых островных земель крехеджадов, хотя та далекая и минувшая эпоха мифов и героев ныне покрыта скорее легендами, чем историей.\n\nНыне встречающиеся во многих прибрежных общинах [Concept('aversaria','Аверсарии')|E] и особенно сосредоточенные на островах Расколотого побережья, приверженцы обряда Янтарной Чаши ритуально отрекаются от материальных привязанностей, часто через экстатические обряды с ритуальным распитием вина. Хотя более формализованные и городские аверсарианские школы магов пренебрежительно зовут их «деревенскими магами» или «пьяными язычниками», даже эти критики вынуждены признать, что обряды магов Чаши, похоже, дают глубокое и почти инстинктивное владение тайнами [Concept('aspect_water','воды')|E] и [Concept('aspect_air','воздуха')|E]."     

 #Damota
 songs_of_service_and_sight_name: "Песни служения и взора"
 songs_of_service_and_sight_desc: "«Песни служения и взора» — распространенная синекдоха для обозначения традиционных дамотанских магических практик, собранных воедино из веков устной традиции и значительно преображенных во времена попыток Боккаров изучить руины первых последователей Всевышнего. Два слова в названии этой неофициальной школы подчеркивают роль, которую ее практики играют в обществе, связывая великие знания, к которым они получают доступ, с долгом перед своими общинами и правителями.\n\nНа практике от Певцов Песен ожидают сочетания древнего набора практических ритуалов по управлению окружающей средой с искуссным знанием воли мира — что проявляется в знаменитой способности как предсказывать, так и влиять на еще не наступившие события. Несмотря на менее престижную роль [Concept('magi','магов')|E] по сравнению с некоторыми другими культурами, даже [Concept('aversaria','аверсарианские')|E] ученые были впечатлены тем, насколько умело некоторые практики повелевают магией [Concept('aspect_light','света')|E], [Concept('aspect_nature','природы')|E] и даже [Concept('aspect_dream','грёз')|E]."

 chants_of_the_tomb_name: "Гробничные песнопения"
 chants_of_the_tomb_desc: "Хотя дамотанская магия долгое время следовала строгой ортодоксии, всегда ходили слухи о тех, кто вырвался из этих рамок в поисках сил, не предназначенных для смертных. Самым известным — и внушающим страх — секретом этого магического подполья являются Гробничные песнопения, обещающие своим певцам извращенное подобие сил, когда-то принадлежавших лишь Всевышнему.\n\nКрайне эзотерическое, это давно подавляемое ответвление дамотанской магии сосредоточено на постижении фундаментальных механизмов жизни и, как утверждается, стало причиной появления самых разных чудовищ. Тем не менее пока в Дамоте существует интерес к запретному, всегда будет находить небольшой контингент, погружающийся все глубже в тайны магии [Concept('aspect_death','смерти')|E], [Concept('aspect_ethereal','эфира')|E] и [Concept('aspect_blood','крови')|E]."  

 dirges_of_the_burned_and_broken_name: "Плачи сожжённых и сломленных"
 dirges_of_the_burned_and_broken_desc: "Традиционно маги играли незначительную роль в дамотанских войнах. В отличие от многих земель, через которые проходили их паломники, использование исключительно разрушительной магии долгое время строго осуждалось. Тем не менее практическая необходимость заставила дамотанских правителей поощрять освоение этих чужеземных магических путей.\n\nВ радикальное отличие от остальных магических традиций Дамоты, Певцы Плачей сосредоточены на использовании магии в бою, и бесчисленные разрушенные стены, сожженные деревни и опустевшие поля отмечают путь этих практиков. И все же, пока в Дамоте идет война, спрос на этих несущих смерть магов, сочетающих традиционные знания [Concept('aspect_nature','природы')|E] с [Concept('aspect_fire','огнем')|E] и [Concept('aspect_stone','камнем')|E] севера, не угаснет." 


 #Clanlanders
 day_court_name: "Дневной двор"
 day_court_desc: "Коренные кланы Калатипсоми традиционно черпают большую часть своей [Concept('magic','магии')|E] из сделок с различными духами природы. Согласно фольклору, эти сущности относятся к доменам Дневного или Ночного двора — названных так как по времени суток, когда они считаются наиболее могущественными, так и по их общему нраву. Духи Дневного двора, хотя и не благодушны, обычно описываются как гораздо более благосклонные к людям, чем их собратья из Ночного двора. Феи, спрайты, пикси и большинство элементалей относятся к этой категории. Если их уважать и правильно вести с ними торг, они, как известно, помогают главным образом с магией [Concept('aspect_light','света')|E], [Concept('aspect_dream','грёз')|E] и [Concept('aspect_nature','природы')|E]."  
 
 night_court_name: "Ночной двор"
 night_court_desc: "Коренные кланы Калатипсоми традиционно черпают большую часть своей [Concept('magic','магии')|E] из сделок с различными духами природы. Согласно фольклору, эти сущности относятся к доменам Дневного или Ночного двора — названных так как по времени суток, когда они считаются наиболее могущественными, так и по их общему нраву. Ночной двор исторически пользовался куда более дурной и отторжимой репутацией. Учитывая духов, входящих в его домен — теневых фей, бук, вендеря и еще более древних темных сущностей, — это вполне объяснимо. Сделки с ними никогда не бывают безопасными или разумными, однако кошмарные силы [Concept('aspect_dark','тьмы')|E], [Concept('aspect_dream','грёз')|E] и [Concept('aspect_nature','природы')|E], которые они могут даровать, — это сила, с которой приходится считаться."  


 # Aironoi
 spirit_voice_name: "Голос духов"
 spirit_voice_desc: "Говорят, когда ветра веют над бескрайними степями, они несут с собой голоса тех, кто ушел в иной мир. Для племен ольтенов завеса между жизнью и смертью тонка, и их шаманы искушены в общении с окружающими духами, помогающими им в колдовстве.\n\nЭта глубоко ритуализированная форма магии зовется [Glossary('Сунэд Руу Гёлойи','GH_SUNAD_RUU_GOLOII_GLOSS')], а ее практиков, [Glossary('ильтегечей','GH_ILTEGECH_GLOSS')], описывают как произносящих заклинания не своими голосами. Таких [Concept('magi','магов')|E] в равной мере боятся и уважают, и они отлично умеют использовать [Concept('gh_aspect','аспекты')|E] [Concept('aspect_dream','грёз')|E] и [Concept('aspect_air','воздуха')|E] для гадания, проникновения в неведомые тайны и управления ветрами и погодой."
 
 adio_kasir_name: "Адио Кашир"
 adio_kasir_desc: "Для речных кутанагских племен великая река Каширият — исток всей магии. Как течет Каширият, так же текут и энергии внутри человеческого тела. Тысячи форм, танцев и заклинаний, разработанных на основе наблюдений за священной рекой, вместе составляют Адио Кашир, или «Непреклонный Кашир». Практики специализируются на заклинаниях [Concept('aspect_water','воды')|E] и славятся гибкостью их применения. Несмотря на это, в Адио Кашир соблюдается строгое табу: попытка поднять или понизить уровень самой Каширият считается высшим проявлением гордыни и посягательством на божественность."
 
 absolution_of_the_void_name: "Отпущение пустоты"  
 absolution_of_the_void_desc: "Красноземельцы черпают свои силы из сделок с темными богами. Ужасающие и эзотерические в своей жестокости, последователи пустоты стремятся потакать голоду своих богов и откликаться на их призывы к жертвоприношениям." 

 temple_of_the_vitreous_precept_name: "Храм Стекловидного Завета"
 temple_of_the_vitreous_precept_desc: "Храм Стекловидного Завета — плод сотрудничества городских [Concept('magi','магов')|E], ученых и ремесленников, каждый из которых в равной мере вносит вклад в развитие единой теории, объясняющей существование [Concept('aeras','Эраса')|E], [Concept('magic','магии')|E] и разума, а также связи между ними. Возводя стекло в ранг бесформенного [Concept('aspect_air','воздуха')|E], усовершенствованного искусством [Concept('aspect_metal','металла')|E], его практики видят себя изменчивыми сосудами, формируемыми суммой их навыков и опыта, и стремятся к самосовершенствованию через мастерство в выбранной области.\n\nКвазифилософский и полурелигиозный, Храм не имеет формальной структуры или иерархии; вместо этого он состоит из небольших индивидуалистических школ, сплоченных вокруг конкретного — часто весьма именитого — мага и его учеников. Эта децентрализация способствует гетеродоксии, и ситуация, когда две разные школы проповедуют кажущиеся несовместимыми учения, вполне обыденна." 

 wane_tender_harmoniarchy_name: "Гармониархия хранителей угасания"
 wane_tender_harmoniarchy_desc: "Магические традиции Хранителей Угасания уходят корнями далеко за пределы известной истории; они признавались древними даже в самых ранних из сохранившихся источников, но их часто связывают с регионом солончаков, который со временем стал известен как [Concept('kashti_flats_biozone','солончаки Кашти')|E]. Славящиеся своими искусствами исцеления и очищения, Хранители Угасания были неизменными спутниками при дворах Аироноя и [Concept('kashirya','Каширии')|E] с незапамятных времен, оказывая необходимую медицинскую помощь и служа королевскими лекарями и советниками.\n\nНе менее известен и взгляд Хранителей Угасания на искоренение мора и чумы — взгляд, который со временем привел к основанию Галитового Храма и Гармониархии, превратив разрозненные, но единомышленные группы врачевателей в организованное и влиятельное жречество, имевшее влияние на многих королей и императоров. Превыше всего они почитают превосходство [Concept('aspect_light','света')|E], переплавляя изменчивые фракталы [Concept('aspect_sand','песка')|E] во всеобъемлющую чистоту соли."

 auroral_cycle_name: "Авроральный цикл"  
 auroral_cycle_desc: "В древние времена рассеянные народы Аироноя не знали зелени, ибо земля была сурова и мертва; не знали крова, ибо ветры, солнце и зима были жестоки; не знали изобилия, ибо степь не приносила плодов. И все же люди, достаточно глупые, чтобы противостоять миру, стремились изменить свою долю и свою землю — так и зародились традиции #EMP Аврорального цикла#!.\n\nПерестав быть просто прорицателями и предсказателями, лишь созерцающими капризы [Concept('aspect_nature','природы')|E], [Concept('magi','маги')|E] Аврорального цикла стремятся сами быть вестниками перемен, направляя волю и решимость [Concept('aspect_dawn','рассвета')|E]. Преобразуя кормящую их землю под свои нужды, они стремятся быть ее хранителями в той же мере, что и ее обитателями. С этой целью даже само [Concept('aspect_time','время')|E] должно быть укрощено и поставлено на службу, заложенное в фундамент вечного человеческого мира." 

 #Kashirya
 empiricists_name: "Эмпирики"  
 empiricists_desc: "Доминирующая школа видваукеятранской теории [Concept('magic','магии')|E], школа эмпириков основана на строгой гносеологической системе, признающей лишь наблюдение и умозаключение валидными способами познания. Хотя изначально школа считала гадание валидным источником знаний, ранние споры с тех пор пересмотрели их отношение к пророческим техникам.\n\nС тех пор школа разработала относительно целостную атомарную систему описания реальности, используя такие понятия, как сущности, качества и дополнительные онтологические категории. Хотя эмпирики не являются материалистами, их позиция в гносеологии позволила им преуспеть прежде всего в манипулировании физическим миром, что привело к созданию прославленной традиции стихийной магии, сосредоточенной на аспектах [Concept('aspect_fire','огня')|E], [Concept('aspect_water','воды')|E] и [Concept('aspect_stone','камня')|E]."
 
 oraculars_name: "Оракулы"
 oraculars_desc: "Школа оракулов возникла тогда, когда эксперименты эмпиризма привели к открытиям, вступившим в конфликт с древнейшими из сохранившихся религиозных текстов Авастья-Махани. Консервативный ученый Ширамаха раскритиковал преобладающую школу в своих [Concept('87_theses','трактатах')|E], что привело к убеждению, согласно которому, хотя «эмпирическое знание» и уважается, оно считается уступающим личному опыту познания божественного.\n\nЭта позиция побудила оракулов развить направление магии, сосредоточенное на формировании разума и откровениях, что сделало ее практиков искушенными в сотворении заклинаний [Concept('aspect_dream','грёз')|E] и [Concept('aspect_celestial','небес')|E]."  

#Kemsari
 rites_of_the_land_beyond_name: "Обряды Запределья"
 rites_of_the_land_beyond_desc: "Погребальные обряды Древнего Кемсара были строго охраняемым секретом, предназначавшимся только для упокоения его самых возвышенных правителей. С тех пор как древнее царство было поглощено пустыней, эта когда-то священная [Concept('magic','магия')|E] превратилась в не более чем примитивную некромантию и плетение песка; но в давно запечатанных и забытых гробницах все еще можно найти проявления ее истинной силы и, возможно, даже тех, кто до сих пор ее практикует..."  


 #Oltirakhai
 zhulvyrakh_name: "Жулвирах"
 zhulvyrakh_desc: "Жулвирах — священная школа магии ольтирахаев. Посвященные Аккарадхамме, послушники постигают искусства эфирного общения, плетения костей и кровавой некромантии, повелевая энергиями смерти для призыва теней, проклятия врагов и создания реликвий, привязывающих живых к вечной воле Короля-лича."

#Nattanan
 path_of_the_twin_gods_name: "Путь Богов-Близнецов"
 path_of_the_twin_gods_desc: "Путь Богов-Близнецов — древняя и таинственная магическая школа, тесно переплетенная с сепаттанскими верованиями густых джунглей Беронг-Наттана, сочетающая в себе магию [Concept('aspect_nature','природы')|E] и [Concept('aspect_stone','камня')|E]. Приверженцы этой школы изучают учения Тарфала-Садовника и Йернейма-Охотника — богов-близнецов, занимающих центральное место в сепаттанской теологии. Маги этой школы тренируются годами, чтобы стать единым целым с самой природой, и учат своих учеников процветать в пышной, но опасной среде джунглей."  

 disciples_of_the_sacred_flame_name: "Ученики Священного Пламени"  
 disciples_of_the_sacred_flame_desc: "Ученики Священного Пламени — магическая школа из густых джунглей Беронг-Наттана, чьи основатели были изгнаны за отвержение священных учений Тарфала и Йернейма. В то время как последователи Тарфала и Йернейма считают демона Корлаку воплощением зла, члены этой школы почитают Корлаку как «Хранителя Священного Пламени». Вместо того чтобы придерживаться изоляционистских догматов Пути Богов-Близнецов, последователи Корлаку почитают [Concept('aspect_fire','огонь')|E] как катализатор человеческого прогресса — от первых костров до пылающих кузнечных горнов, а [Concept('aspect_metal','металл')|E] считают основным строительным блоком цивилизации."  
 
 99_marks_of_power_name: "Девяносто девять меток силы"  
 99_marks_of_power_desc: "Легенда гласит, что на заре времен Всевышний даровал человечеству девяносто девять меток силы, рожденных из [Concept('aspect_blood','крови')|E] и [Concept('aspect_dark','тьмы')|E], которые при начертании на теле и душе ведут к истинному божественному величию. Изучение этих символов и татуировок удивительно строго и технично, и поколения практиков оставили после себя подробные заметки о нанесении существующих знаков и переоткрытии утраченных во времени."  

#Dahangon
 lemad_dakta_name: "Лемад Дакта"  
 lemad_dakta_desc: "Для шаманов Дахангона Лемад Дакта, или «Внутренние силы», являются естественной частью тела, которую, как и любую мышцу, нужно тренировать для пробуждения. Практики пользуются преимуществами болотистых земель, которые называют своим домом, и искусно повелевают силами [Concept('aspect_water','воды')|E], [Concept('aspect_nature','природы')|E] и [Concept('aspect_stone','камня')|E]. Шаманы Лемад Дакта славятся своей гибкостью, и те, кто сталкивается с ними, часто оказываются застигнуты проплох их стремительными и необычными заклинаниями."  

 scarlet_bronze_formulae_name: "Ало-бронзовые формулы"  
 scarlet_bronze_formulae_desc: "Санкционированное Драконом Божественное Мистическое Искусство Поглощающего Алого Пламени и Сотворенных Бронзовых Формул, или «Ало-бронзовые формулы», — официальная школа магии, освященная и одобренная для публичного использования самим Драконьим императором.\n\nПрактики используют стихии [Concept('aspect_fire','огня')|E] и [Concept('aspect_metal','металла')|E] для активации строго определенных ритуальных надписей, многие из которых накладываются друг на друга в сложные массивы. Это мистическое искусство также предпочитают кузнецы и мастера формовки из-за легкости, которую оно приносит в их непрестанном стремлении к совершенству своего ремесла."  

 azure_serpent_sect_name: "Секта Лазурного Змея"  
 azure_serpent_sect_desc: "Санкционированное Драконом Высшее Божественное Мистическое Искусство Секты Лазурного Змея, Свернувшегося под Текущими Небесами (или просто Секта Лазурного Змея) — одна из И Тайсяньди У (букв. Зал Пяти Космических Небес), пяти главных школ магии, практикуемых в Катун-Кай.\n\nВосходящая к самым ранним дням империи, секта в первую очередь сосредоточена на прорицании через [Concept('aspect_water','воду')|E], и главный прорицатель Драконьего императора часто происходит именно из Лазурного Змея. Практики славятся гибкостью в сотворении заклинаний, так как призываемые ими водные элементали — еще одна специализация секты — имеют формы, находящиеся под сильным влиянием [Concept('aspect_dream','грёз')|E] самого заклинателя. Школа базируется преимущественно в прибрежных регионах империи, и катунские маги, направляемые в колонии, часто принадлежат к этой секте."

 # Marmaladid
 talita_namit_school_name: "Талита Намит"
 talita_namit_school_desc: "Считается, что [Concept('marmaladid_chosen_magi','Избранные маги')|E] правили обществом мармаладидов с дописьменных времен, пока [Concept('the_decimation_of_sarradon','Халакдун')|E] не опустошил их практики.\n\nЭти [Concept('magi','маги')|E] столь искушены в силах [Concept('aspect_sand','песка')|E] и [Concept('aspect_dream','грёз')|E], что, как говорят, многие из наиболее опытных были способны полностью управлять движущимися дюнами [Glossary('Великой пустыни','sarradonian_desert_encyclopedia_desc')]."