 wisdom_of_the_leaf_whispers_desc: ""
 poison_nature_name: "Отравить тело"
 poison_nature_desc: ""

 corrupt_armor_name: "Осквернить доспехи"
 corrupt_armor_desc: "Заклинатель направляет [Concept('aspect_dark','тьму')|E], чтобы наполнить доспехи цели темной магией, искажая ее мысли и подрывая здоровье."

 thin_armor_name: "Истончить доспехи"
 thin_armor_desc: "Заклинатель направляет [Concept('aspect_light','свет')|E], чтобы сделать части доспехов противника бестелесными, обнажая его, но облегчая его ношу."
 
 air_blessed_weapons_name: "Стремительное оружие"
 air_blessed_weapons_desc: "С помощью [Concept('aspect_air','ветра')|E] скорость воинов увеличивается, что позволяет им сражаться эффективнее."

 guiding_light_name: "Путеводный свет"
 guiding_light_desc: "Манипулируя вселенским порядком [Concept('aspect_light','света')|E], заклинатель может усилить свои или чужие естественные способности."

 nourishing_radiance_name: "Питательное сияние"
 nourishing_radiance_desc: "Путем сонастройки [Concept('aspect_nature','природы')|E] и [Concept('aspect_light','света')|E] можно значительно повысить плодородие региона."
 
 nature_wrath_name: "Гнев природы"
 nature_wrath_desc: "Силой [Concept('aspect_nature','природы')|E] заклинатель повелевает растительности мира атаковать его врагов."
 
 woodland_inferno_name: "Лесное инферно"
 woodland_inferno_desc: "Используя силу [Concept('aspect_nature','природы')|E] в качестве топлива для [Concept('aspect_fire','огненного')|E] инферно, заклинатель испепеляет своих врагов."

 conjure_tornado_name: "Сотворение торнадо"
 conjure_tornado_desc: "Опытные [Concept('aspect_air','воздушные')|E] [Concept('magi','маги')|E] известны своей способностью неистово закручивать воздушные потоки, призывая мощные воздушные вихри и торнадо с некоторой способностью самонаведения. В крайних случаях порождаемые стихийные бедствия способны опустошать целые регионы чистой силой, разрушая постройки и даруя людям (вместе с другой наземной или морской фауной) первый и последний полет в их жизни."

 tempests_teeth_name: "Зубы бури"
 tempests_teeth_desc: "Хотя тяжелые доспехи способно отлично защитить от удара клинка или стрелы, они остаются идеальным проводником для затаившейся внутри молнии. Целые ящики с оружием могут быть заряжены одновременно с меньшей эффективностью, ценой быстрого разрушения соприкасающихся с ними чехлов и ножен."

