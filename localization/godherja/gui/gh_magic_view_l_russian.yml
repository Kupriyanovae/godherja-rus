 neroth_invocation_name: "Инвокация НЕ'рота"
 neroth_invocation_short_desc: "\"Хотя я и открыл вам истинное имя [aspect_death], не призывайте его без крайности величайшей; и если поддадитесь искушению, вспомните о безумии Лаксатия.\"\n~NOMATA Майхиксиана"
 aervalrea_invocation_name: "Инвокация ЭР'вал'РЕИ"
 aervalrea_invocation_short_desc: "NOMA [Concept('aervalr','Эрвала')|E], почти цикличная, но все же едва заметно изъянная, давно предвещала его роковую судьбу."
 xarax_anina_invocation_name: "Инвокация КСАРАКС АН'и'НА"
 xarax_anina_invocation_short_desc: "\"#EMP Ни человек, ни [Concept('dragons','дракон')|E] не уцелели под ужасной горой летящего булыжника и камней, обрушившейся на андроксов, и бойня была столь ужасающа, что луг сей отныне зовут Полем Сломленных.#!\"\n~Сказание о двух городах"
 #xarax_anina_invocation_desc: "An invocation that allows the user to lift heaps of pebbles, rocks and even entire boulders into the air, generally for combat purposes. Its use was particularly widespread during the late pre-Imperial and early Imperial eras of [aversaria|E], when it proved particularly deadly against the [Concept('dragons','dragon')|E]-centered armies of the period, though it would see a significant decline in use after the [war_of_the_thousand_dragons|E]."
