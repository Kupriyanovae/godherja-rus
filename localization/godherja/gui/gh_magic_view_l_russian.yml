 elementalist_trait_gain_effect_water_name:90 "Объятия воды"
 elementalist_trait_gain_effect_water_desc:90 "Вы получаете способность направлять текучую и гибкую энергию воды, укрепляя свою связь с ее умиротворяющей и неудержимой силой."

 elementalist_trait_gain_effect_fire_name:90 "Объятия огня"
 elementalist_trait_gain_effect_fire_desc:90 "Вы наполняетесь пылкой и преображающей энергией огня, обретая способность повелевать его разрушительным и очищающим пламенем."

 elementalist_trait_gain_effect_air_name:90 "Объятия воздуха"
 elementalist_trait_gain_effect_air_desc:90 "Вы соединяетесь со стремительными и непредсказуемыми потоками воздуха, что дарует вам стремительность и власть над ветрами."

 elementalist_trait_gain_effect_light_name:90 "Объятия света"
 elementalist_trait_gain_effect_light_desc:90 "Вас озаряет сияющая и очищающая энергия света, позволяя направлять его блеск и ясность."

 elementalist_trait_gain_effect_stone_name:90 "Объятия камня"
 elementalist_trait_gain_effect_stone_desc:90 "Вы обретаете стойкую и несокрушимую силу камня, обеспечивающую вам стойкость и возможность использовать твердость земли."

 elementalist_trait_gain_effect_dream_name:90 "Объятия грёз"
 elementalist_trait_gain_effect_dream_desc:90 "Вы настраиваетесь на таинственное царство сновидений, дарующее вам проницательность и способность влиять на эфирные нити подсознания."

 elementalist_trait_gain_effect_dark_name:90 "Объятия тьмы"
 elementalist_trait_gain_effect_dark_desc:90 "Вы становитесь единым целым с загадочной энергией тьмы, позволяющей повелевать мраком и скрытой силой."

 elementalist_trait_gain_effect_ice_name:90 "Объятия льда"
 elementalist_trait_gain_effect_ice_desc:90 "Вы взываете к леденящей и грозной мощи льда, обретая контроль над морозом и суровым дыханием зимы."

 elementalist_trait_gain_effect_death_name:90 "Объятия смерти"
 elementalist_trait_gain_effect_death_desc:90 "Вы находитесь в гармонии с неизбежной и преображающей энергией смерти, что позволяет направлять ее конечность и обновление."

 elementalist_trait_gain_effect_blood_name:90 "Объятия крови"
 elementalist_trait_gain_effect_blood_desc:90 "Вы соединяетесь с жизненной сущностью крови, обретая способность использовать первобытную силу и жизненную энергию."

 elementalist_trait_gain_effect_sand_name:90 "Объятия песка"
 elementalist_trait_gain_effect_sand_desc:90 "Вы сливаетесь с изменчивой природой песка, что позволяет вам управлять его потоком и разрушительной силой."

 elementalist_trait_gain_effect_metal_name:90 "Объятия металла"
 elementalist_trait_gain_effect_metal_desc:90 "Вы наполняетесь непреклонной прочностью металла, дарующей вам силу преодолевать самые тяжелые испытания."

 elementalist_trait_gain_effect_ethereal_name:90 "Объятия эфира"
 elementalist_trait_gain_effect_ethereal_desc:90 "Вы настраиваетесь на неосязаемые мистические энергии эфира, получая способность связываться с силами за пределами физического мира."

 elementalist_trait_gain_effect_celestial_name:90 "Небесные объятия"
 elementalist_trait_gain_effect_celestial_desc:90 "Вас озаряют космические и божественные энергии небес, даруя вам способность направлять величие и влияние горнего мира."

 elementalist_trait_gain_effect_nature_name:90 "Объятия природы"
 elementalist_trait_gain_effect_nature_desc:90 "Вы гармонируете с животворящими силами природы, что позволяет вам черпать силу из флоры и фауны, воплощая ее циклы роста и обновления."

 elementalist_trait_gain_effect_dawn_name:90 "Объятия рассвета"
 elementalist_trait_gain_effect_dawn_desc:90 "Вы — утренний человек." #PLACEHOLDER

 elementalist_trait_gain_effect_hymns_name:90 "Объятия гимнов"
 elementalist_trait_gain_effect_hymns_desc:90 "Вы — музыкальный человек." #PLACEHOLDER

 elementalist_trait_gain_effect_time_name:90 "Объятия времени"
 elementalist_trait_gain_effect_time_desc:90 "Вы — пунктуальный человек." #PLACEHOLDER

