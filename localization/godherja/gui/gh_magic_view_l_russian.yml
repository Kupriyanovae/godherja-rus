 sensory_amplifier_spell_component_name: "Усилитель чувств"
 sensory_amplifier_spell_component_desc: "Вещество, обостряющее восприятие, послужило бы хорошим подспорьем для этого ритуала."
 bone_ingredient_spell_component_name: "Кости"
 bone_ingredient_spell_component_desc: "Кости, даже их малейшие осколки, способны удерживать мощную [Concept('magic','магию')|E] спустя века после завершения земной жизни их обладателя."

