 # Illuminated Order of Most Holy Principles Spells
 ## Pre-Sorrowing (??? - 3rd century IS)
 ### Rituals that come from the ancient Shewigad or Gallicaders. Generally the most conventionally magical in nature.
 charting_of_the_star_guided_path_name: "Составление карты звездного пути"
 tarot_quin_rois_name: "Таро Квин Руа"
 mark_of_the_star_reader_name: "Метка звездочета"
 ## Rohrian Period (3rd century IS - 6th century IS)
 ### Primarily driven by the Sorrowing: both in terms of the sudden necessity of developing rituals for countering the undead, and the inflow of Ojyczanyz refugees causing some of their own magic to become imported
 ### Unlike the Illuminated Period, had no real central authority
 tarot_gisredde_deck_name: "Таро Гисредде"
 tarot_forbanne_name: "Таро Форбанне"
 narghile_mysticalis_name: "Наргиле Мистикалис"
 four_chants_and_three_rites_of_miasmic_purge_name: "Четыре песнопения и три ритуала очищения от миазмов"
 dowsing_rod_of_witch_hazel_name: "Лоза из ведьминого орешника"
 ## Illuminated Period (6th century IS - 10th century IS)
 ### The namesake of the entire school, this was when it was at its most centralized; its most reliable spells come from this period. Its intimate connection to the Conclave of Raocourt means that this is also the most Light/religiously-aligned period
 tarot_raocourt_name: "Таро Раокурта"
 baume_consecrationis_name: "Бальзам освящения"
 mark_of_the_orcindian_order_name: "Метка Оркиндианского ордена"
 ## Late Period (10th century - modern)
 ### Characterized by the disintegration of clerical control following the War of the Heretic Princes, this was a fairly fruitful period, even if a lot of the rituals that arose from it veer into quackery.
 ### Chevalie's close connections with Aversaria meant that a fair amount of Living/Dead Magic spells would get imported and repurposed into more low-magic versions during this period, and increased contact with the world at large
 ### meant that rituals from places as far as Kathun Kai would end up in the school
 tabela_oejeynicaise_name: "Табела Ойейницейзе"

 sacrifice_rare_herbs_name: "Жертвоприношение редких трав"
 sacrifice_rare_herbs_desc: "Проверенный метод на протяжении тысячелетий, сжигание редких благовоний и экзотических трав долгое время было основным [Concept('gh_ritual','ритуалом')|E] для призывая магии среди многих [Concept('magi','магов')|E]. Хотя этот обряд не так силен, как некоторые более #EMP спорные#! наполняющией [Concept('magic','магией')|E] ритуалы, он не требует ничего, кроме тугого кошелька и доступа к достаточно крупному рынку."

 purms_mirthful_beginning_name: "Веселое начинание Пурма"
 purms_mirthful_beginning_desc: "Бродячий воин-поэт Пурм — известная фигура в [Concept('western_aironoi_biozone', 'западно-айронойском')|E] фольклоре. Его часто изображают напыщенным тупицей и несносным всезнайкой, чьи злоключения вращаются вокруг попыток — неизменно провальных — взяться за дела, превосходящие его знания и таланты. Как вполне рабочий [Concept('gh_ritual','ритуал')|E] получил имя Пурма, остается загадкой, но это ничуть не умаляет эффективности заклинания, помогающего в освоении навыков, далеких от привычной сферы деятельности."

 hand_spear_and_crown_name: "Рука, копье и корона"
 hand_spear_and_crown_desc: "[Concept('gh_ritual','Ритуал')|E] #EMP Рука, копье и корона#! — инструмент основателей, первых в своих линиях и решительных восстановителей. Сметая преграды на пути к величию,, он широко открывает распахивает врата к власти — будь то с помощью бронзы, стали или звонкой монеты."

 animal_aspect_name: "Звериный аспект"

 imperial_ascension_name: "Имперское возвышение"
 imperial_ascension_desc: "Шелковые одеяния, драгоценности, кинжал в спину — у тех, кто облечен властью, немало забот. [Concept('gh_ritual','Ритуал')|E] #EMP Имперское возвышение#! призван облегчить тяготы бурного начала правления, укрепляя величие и авторитет своего адресата."

 borrowed_time_march_name: "Марш позаимственного времени"
 borrowed_time_march_desc: "Разве это вина солдата, что он не может маршировать дольше, чем есть часов в сутках? [Concept('gh_ritual','Ритуал')|E] #EMP Марш позаимственного времени#! позволяет [Concept('magi','магу')|E] снять бремя позора и неадекватности с тех, кто готов отдать жизнь за достойное дело — даруя им больше часов в сутках, больше дней в неделе. Странно непопулярный среди призванных юнцов и стариков, что возвращаются спустя лишь недели, заклинание остается ценным инструментом в любом магическом арсенале."

 sundering_impetus_name: "Раскалывающий импульс"
 sundering_impetus_desc: "Желать изменить мир — значит воплощать [Concept('gh_aspect','аспект')|E] [Concept('aspect_dawn','Расcвета')|E]; обладать решимостью воплотить это в жизнь — значит слиться с [Concept('aspect_fire','огнём')].[Concept('gh_ritual','Ритуал')|E] #EMP Раскалывающий импульс#! дарует тому, на кого на кого он наложен, силу вершить историю — шанс перекроить смертный мир по собственному замыслу."

 surrender_to_the_wild_name: "Сдача дикой природе"
 surrender_to_the_wild_desc: "Подобно тому как лесные пожары обновляют сжигаемые ими дебри, природа способна отвоевать земли у людей, восстанавливая естественный ход магических энергий и [Concept('waylines','лей-линий')|E]. Проведя надлежащий [Concept('gh_ritual','ритуал')|E], предприимчивый [Concept('magi','маг')|E] может собрать и впитать высвобожденную [Concept('magic','магию')|E] в свое существо, чтобы значительно пополнить свои резервы.."

 bestirring_of_the_demesne_eternal_name: "Пробуждение Вечного Домена"
 bestirring_of_the_demesne_eternal_desc: "[Concept('aeras','Эрас')|E] спит, баюканный людской алчностью и страхом, порождениями погибели и бедствий. Вечно умирающий, но никогда не мертвый; великий труд способен пробудить его вновь. #EMP Пробуждение Вечного Домена#!, одна из шести великих магий [Concept('astilik_empire', 'астиликов')|E], пробуждает землю и наделяет ее даром изобилия, чтобы она цвела и процветала в новом начале — и с новой жизнью."

 concordat_of_dawn_and_stars_name: "Конкордат Зари и Звезд"
 concordat_of_dawn_and_stars_desc: "Одна из шести великих магий астиликов, #EMP Конкордат Зари и Звезд#! — это [Concept('gh_ritual','ритуал')|E], призванный исцелить раны, нанесенные земле людскими раздорами, и вернуть ей здоровье и красоту. Хотя [Concept('astilik_empire', 'Астиликская империя')|E] никогда не славилась милосердием или мягкостью — особенно к своим ранним противникам — сама земля никогда не считалась оскверненной деяниями тех, кто по ней ходит, будь то враг, зверь или кто-то иной. Хоть чужаки часто считают подобную магию ошибочной или расточительной, она остается одним из немногих способов укротить бушующие магические энергии, сеющие хаос по всему [Concept('aeras','Эрасу')|E]."

