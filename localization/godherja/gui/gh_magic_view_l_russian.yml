 rune_of_the_worm_ouroboros_name: "Руна Червя Уробороса"
 rune_of_the_worm_ouroboros_short_desc: "Мегалиты с этим древним сигилом рассеяны по всему Пергикосу. Обычно считается, что они имеют сейческое происхождение, хотя некоторые верят, что они еще древнее. И хотя большинство местных предпочитает держать почтительную дистанцию, окружающий чернозем часто оказывается слишком сильным соблазном."
