 # Greenwender of Sarradon Spells
 justice_of_the_primeval_garden_name:89 "Правосудие Первозданного Сада"
 justice_of_the_primeval_garden_desc:89 "Мифический лес, когда-то покрывавший северный [Concept('sarradon','Саррадона')|E], был суровым и беззаконным местом, где единственное правосудие вершилось грубой силой. В те времена поражение от руки другого существа означало не просто смерть — победителю отходила сама душа побежденного. По легенде, именно так легендарные Дишали и Аугали обрели почти божественное могущество, сразив неисчислимое множество левиафанов, Лесных Царей и полубогов.\n\nПо крайней мере, так гласят мифы.\n\nВ наши дни мало кто верит, что эта идея — нечто большее, чем красивая сказка. Однако некоторые утверждают, что закон давно ушедшего мира не просто реален, но все еще таит в себе силу — и его нужно лишь правильно призвать."
 cedar_witchs_hex_name:89 "Проклятие Кедровой Ведьмы"
 cedar_witchs_hex_desc:89 "В древние времена Королевства Саррадон безымянный правитель Трагонии . В своей алчности он вырубил все лесные массивы вокруг города Кармин. Однажды он отправился в свои личные охотничьи угодья — и больше не вернулся. Вместо этого были найдены обугленные тела его и его свиты, разбросанные по лесу, хотя вокруг не было никаких признаков лесного пожара.\n\nПо сей день такие таинственно обгоревшие тела иногда находят в первозданных кедровых рощах Саррадона, и часто шепчутся, что эти несчастные столкнулись с практиками, которые балуются с некоторыми из древнейших сил южного континента..."
 embercrown_coronation_name:89 "Коронация Угольной Венца"
 embercrown_coronation_desc:89 "Задолго до нынешней эры людей, когда Саррадон еще был зеленым, еще утопал в зелени, правили ужасные Лесные Цари прошлого. На их головах были не золотые венцы, но короны из чистого пламени. Их коронация была величественным зрелищем, но тысячелетия с момента их падения превратили ее в очередной странный пережиток давно ушедших времен. В результате постепенного искажения ритуала он способен сотворить лишь венец из тлеющих углей. Тем не менее, он, без сомнения, все еще хранит крупицу прежней силы."
 tu_nihanas_fork_tongued_speak_name:89 "Двоедушная речь Ту-Ниханы"
 tu_nihanas_fork_tongued_speak_desc:89 ""

 
# Path of the Twin Gods

 twin_gods_hex_of_wrath_name:89 "[Glossary('Чан Фэй Тэйб Тансит Кон Крод','GH_CHAN_FEI_TEIB_TANSIT_KON_CROD_GLOSS')]"
 twin_gods_hex_of_wrath_desc:89 "Когда Боги-Близнецы сошлись с Корлаку в Войне Раскола, Они вознамерились покарать последователей Корлаку, которые все еще мнили себя в безопасности на охоте в священных джунглях. И научили Они своих самых верных учеников языку своего происхождения и тому, как воспевать заклятие гнева, обращенное к самим джунглям. Те, кто дерзал сопротивляться Богам-Близнецам после этого, порой оказывались разорваны лесом на части. С тех пор путники в джунглях время от времени находят тела, рассеченные пополам: одна половина уходит в землю, а другая свисает с крон деревьев."



 # Temple of the Vitreous Precept Spells
 shattercurse_name: "Проклятие разлома"
 shattercurse_desc: "Часто упоминаемое излюбленное заклинание среди энтузиастов стеклянных [Concept('magi','магов')|E], Проклятие Мирского Разрушения — обычно сокращаемое как #EMP Проклятие разлома#! — является основой многих магических арсеналов. Балансируя на грани между [Concept('gh_ritual','ритуалом')|E] и заговором, оно ценится за простоту своей симпатической связи, #EMP относительную#! эффективность и еще более относительную скорость сотворения."
 conduit_of_a_clear_mind_name: "Проводник ясного разума"
 conduit_of_a_clear_mind_desc: "Подобно тому, как разбитое стекло можно переплавить и придать ему новую форму, измученный разум можно вновь наделить энергией и подарить ему новую цель. Также известное как Заклинание Ученых, #EMP Проводник ясного разума#! позволяет разуму сотворяющего  [Concept('magi','мага')|E] вновь утвердиться среди моря неопределенности, возвращая концентрацию на самом важном."
 shard_of_imbued_knowledge_name: "Осколок вложенного знания"
 shard_of_imbued_knowledge_desc: "Осколки стекла — один из менее распространенных способов передачи знаний, обыденных или иных, в разум согласного получателя — как из-за интимности самого процесса, так и из-за тяжелой нагрузки на разум. Затронутые воспоминания временно спутываются, и этот опыт одинаково [Concept('stress','стрессовый')|E] как для учителя, так и для ученика."
 kumhants_veil_name: "Завеса Кумханта"
 kumhants_veil_desc: "Восходящая к доктринам традиционно пацифистского [GetReligionByKey('sunarwei_religion').GetAdjective] вероучения, #EMP Завеса Кумханта#! — это благословение авангарда и защитников, оберегающее от смертельных ударов и наделяющее воинов неестественной грацией и плавностью. Исторически этот [Concept('gh_ritual','ритуал')|E] часто совместно сотворялся [Concept('magi','магами')|E] армий, сходившихся в строго регламентированных [GetCulturePillar('heritage_kherkeloi').GetName]их войнах, дабы уменьшить потери и облегчить обмен пленными после битвы.."
 mellifluent_vessel_name: "Медозвучный сосуд"
 mellifluent_vessel_desc: "Освященная временем профессия стеклопевца родилась, когда [Concept('magi','маги')|E] открыли способ наделять голосовые связки свойствами стекла, придавая голосу уникальное и мелодичное качество.Менее чем за век заклинание и его адепты распространились по всему Морю Империй, а некоторые даже предпочитают сделать эту трансмутацию постоянной."
 ururras_augury_name: "Знамение Урурры"
 ururras_augury_desc: "Урурра была верховной жрицей и, после одного успешного переворота, правительницей сунакарийского дворцового города [Glossary('Gishvosk','GH_GISHVOSK_GLOSS')]. Разработав особенно мощный [Concept('gh_ritual','ритуал')|E] прорицания, включавший бросание стеклянных бусин в неглубокую чашу с кипящим можжевеловым маслом, она вела кампанию террора против будущих угроз, как реальных, так и мнимых, и в итоге погибла в огненном бунте, который поглотил город. Последующие поколения [Concept('magi','магов')|E] пришли к выводу, что заклинание действительно раскрывает будущее — просто худшую его версию; современные итерации предлагают введение корректирующего критерия, чтобы сгладить предсказательное искажение."
 forge_of_the_solemn_visionary_name: "Кузня сурового провидца"
 forge_of_the_solemn_visionary_desc: "До возвышения [GetCulturePillar('heritage_kherkeloi').GetName]их дворцовых городов, до разрухи [Concept('wars_of_dominion','Войны за господство')|E], до [Concept('ertomax','Эртомакса')|E] и [Concept('astilik_empire','астиликов')|E] существовали [Glossary('Нагаторы','GH_NUGATORS_GLOSS')] — просвещенные тираны-правители морей. Правившие в шелковых перчатках, окутанной цепью работорговца, они часто считаются основателями [Concept('aironoian_bronze_age','первых цивилизаций Айроноя')|E], выковавшими державы, пережившие своих создателей. Хотя их имена померкли под грузом веков, некоторые из [Concept('gh_ritual','ритуалов')|E] Нагаторов выдержали испытание временем, став в итоге инструментами прогресса для тех самых народов, которыми они когда-то повелевали."
 supplication_to_the_unfettered_muse_name: "Мольба к Раскованной Музе"
 supplication_to_the_unfettered_muse_desc: "Чтобы снискать благословение [Glossary('Нашанар','GH_NASHANAR_GLOSS')], молящийся должен выдержать трехдневный пост, е вкушая ничего, кроме заговоренной смеси молока и масла маковых семян, дабы войти в состояние затяжной искусственной мании. Оказавшись в нем, человек обычно начинает отвергать все, что считает тривиальным по сравнению с одержимой задачей — еду, сон и базовый уход за телом. Хотя испытуемые демонстрируют поразительную ментальную стойкость, несмотря на пренебрежение физическими потребностями, ритуал не дает реальной защиты от болезней и истощения."
 lacerating_glasswinds_name: "Разящие стеклянные ветры"
 lacerating_glasswinds_desc: "Где один порез болезнен, десять могут быть смертельны — а сотня свалят любого воина. Стеклянные [Concept('magi','маги')|E] известны, внушают страх и, некоторой частью людей, презираемы за способность призывать огромные бури из своего именного материала, порой накрывая целые города калейдоскопическими циклонами из сверкающих стеклянных осколков. Используемый либо как крайняя мера перед штурмом, либо как сам штурм, этот [Concept('gh_ritual','ритуал')|E] собирает кровавую жатву среди тех несчастных, кто оказался под перекрестном огнём."
 interminable_nexus_name: "Нескончаемый Нексус"
 interminable_nexus_desc: "Среди множества мелких сунакарийских военачальников, захвативших власть после [Concept('wars_of_dominion','Войны за господство')|E], универсально повсеместны были только две вещи — повсеместными были лишь две вещи — дикая паранойя по отношению к собратьям и негнущаяся решимость отбросить все, что мешает прогрессу. Прямое порождение их амбиций, [Concept('gh_ritual','ритуал')|E] #EMP Нескончаемый Нексус#! искажает восприятие цели, легко обнажая всю неэффективность окружения ценой непреодолимого навязчивого желания исправить ее — любой ценой."
 pane_of_passage_name: "Витраж перехода"
 pane_of_passage_desc: "Использование стеклянных витражей для перемещения в пространстве давно стало частью [GetCulturePillar('heritage_kherkeloi').GetName]ого фольклора, хотя точные истоки этого ремесла безнадежно утеряны в истории. Тем не менее, с точным набором ингредиентов, глубокими знаниями и мастерством стеклодува телепортация становится реальностью — пусть и мимолетной, ведь стеклянные врата темнеют и покрываются трещинами всего через несколько дней после зачарования."

 # Wane-Tender Harmoniarchy

 searing_cleansing_name: "Опаляющее очищение"
 searing_cleansing_desc: "Пути Хранителей Угасания никогда не отличались мягкостью — и все же мало кто может оспорить эффективность их обрядов и [Concept('gh_ritual','ритуалов')|E]. Будь то скальпель или гримуар, недуг и болезнь должны быть изгнаны из тела любыми средствами — средствами, не терпящими ни колебаний, ни полумер."

 lustrous_banner_name: "Сияющее знамя"
 lustrous_banner_desc: "Слава, богатство, страх, гнев —есть множество причин, по которым человек может обнажить меч и отречься от мирной жизни. Каковы бы ни были их мотивы, [Concept('gh_ritual','ритуал')|E] #EMP Сияющее знамя#! гарантирует, что они окажутся там, где нужнее всего, сражаясь за дело, которое #EMP несомненно#! является правым."

 conjure_salt_name: "Сотворение соли"
 conjure_salt_desc: "#EMP Пусть поля пустуют, реки мелеют,\nОна пребудет, сквозь времён гнет,\nВ котле у нищего и на пиру владык,\nДар и моря, и камня щедрот.#!\n~Ходомиская дворцовая поэзия, около 100 И.С."

 plague_ward_name: "Оберег от мора"
 plague_ward_desc: "Вспять повернуть моровую волну — задача не из легких, требующая общих усилий и #EMP жертв#!. Скорее принудительное заклятье, чем истинный оберег, #EMP Оберег от мора#! медленно выжигает яды и скверну в теле, не делая различий между их природой или проявлениями — и причиняя при этом лютую боль."

 weapons_of_perdition_name: "Оружие погибели"
 weapons_of_perdition_desc: "В древности Галитовый храм охраняли четыреста священных стражей, несущих бессменную стражу у его священных реликвариев и взиравших на бесконечные вереницы паломников. Хотя они были распущены во времена [Concept('otachedian_empire','Отачеда')|E], их искусство вышло далеко за пределы изначального предназначения, и эксклюзивные прежде [Concept('perdition_armaments','Оружия Погибели')|E] со временем стали основой снаряжения элитных воинов во многих айронойских и [Concept('kashirya','каширийских')|E] армиях."

 kingsfall_name: "Низвержение королей"
 kingsfall_desc: "Ни одно царство не вечно, ни один царь не монолит. Любимый инструмент смутьянов и кукловодов, [Concept('gh_ritual','ритуал')|E] #EMP Низвержение королей#! раздувает мелкие разногласия и трещины, присущие любой структуре власти, превращая их в непримиримые пропасти, сталкивающие соратника с соратником, брата с братом."

 koshmers_dreaming_archive_name: "Спящий архив Кошмера"
 koshmers_dreaming_archive_desc: "Кошмер был знаменитым ходомским учёным III века и Хранителем Угасания,прославившимся своими почти чудесными методами лечения, неортодоксальными взглядами — и тем, что бесследно исчез на пике своей славы. Единственным его наследием миру стал одинокий [Concept('gh_ritual','ритуал')|E], оставленный на вырванном листе гримуара — заклинание, которое перед сном переносит разум спящего в полутемную библиотеку, изобилующую как медицинскими, так и обыденными знаниями, вплоть до момента пробуждения. В целом опыт совершенно безопасен — пока вы заботитесь о том, чтобы не тревожить других посетителей и не запутаться в паутине Библиотекаря."

 final_emissary_of_peace_name: "Последний посланник мира"
 final_emissary_of_peace_desc: "Посланники Храма снова пришли сегодня, с тем же предложением. [GetFaithByKey('sunarwei').HighGodName] видит, моя семья всегда была щедра на пожертвования в их казну, но требования жрецов становятся неразумными. То, чего они добиваются — это больше чем благотворительность, больше чем дань... но у меня нет иного выбора, кроме как принять то, что является вассалитетом во всем, кроме названия. Возможно, они и потеряли свою хваленую реликвию в [Concept('desiccation_of_kazvosk','Казвоске')|E], но кто знает, сколько еще таится в их тайниках?\n~Из дневника Аломора Хорддима VII Меррумского"
 
 conjure_oasis_name: "Подъем вод"
 conjure_oasis_desc: "Ищите под зыбучими песками русла утерянных ручьев и давно пересохших рек и выведите на свет новый источник — пусть даже ненадолго."

 #grimoire Spells
 calming_of_the_sea_queen_name: "Умиротворение Владычицы морей"
 calming_of_the_sea_queen_desc: "Поговаривают, будто это заклинание способно успокоить Владычицу глубин; оно утихомиривает моря, делая путешествие более быстрым и безопасным."
 anger_of_the_sea_queen_name: "Гнев Владычицы морей"
 anger_of_the_sea_queen_desc: "Считается, что это заклинание обрушивает на цель гнев Владычицы морей, повышая как скорость, так и опасность плавания."

