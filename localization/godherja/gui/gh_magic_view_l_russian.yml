 karyx_talisman_name: "Талисман Карикса"
 karyx_talisman_short_desc: "\"LXXXVII: Если кто дерзнет поднять руку на носящего сан Карикса, да будет тот предан смерти через бичевание, кровь его да сцежена будет и отослана в оскорбленный полис, а останки — брошены в море.\"\n~Law Свод законов Тэлексии Гортиллакской"
