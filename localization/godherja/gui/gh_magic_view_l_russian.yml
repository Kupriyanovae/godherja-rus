 resist_disease_name: "Сопротивление болезням"
 resist_disease_desc: "Это заклинание защищает от болезней."

 light_fortress_name: "Укрепленная крепость"
 light_fortress_desc: "С помощью [Concept('aspect_light','Света')|E] внутренние помещения крепости приводятся в порядок и укрепляются до все большего совершенства."

 laser_beam_name: "Ненависть Солнца"
 laser_beam_desc: "Лучи [Concept('aspect_light','света')|E] извергаются из кончиков пальцев этого [Concept('magi','мага')|E], с легкостью испепеляя его врагов."

 prismatic_ward_name: "Призматический оберег"
 prismatic_ward_desc: "Разноцветный свет сходится к заклинателю, защищая его от враждебных заклинаний."

 dispelling_blade_name: "Рассекающий клинок Фреуэна"
 dispelling_blade_desc: ""Заклинатель призывает светящийся клинок из света, рассеивающий магическую защиту врагов, в которых он вонзается."

 revealing_blade_name: "Разоблачающий клинок Фреуэна"
 revealing_blade_desc: "Маленький меч из света появляется над головами тех, кто замышляет недоброе против сотворившего заклинание."

 calming_waters_name: "Успокаивающие воды"
 calming_waters_desc: "Ладони заклинателя покрываются пленкой чистой воды, которая при прикосновении к лбу вызывает спокойствие и расслабление."

 water_veil_name: "Водная завеса"
 water_veil_desc: "Создает защитный барьер из воды, блокирующий как физические, так и магические снаряды."

 riverine_rush_name: "Речной стремительный рывок"
 riverine_rush_desc: "Путешествуйте со скоростью бурлящего потока Каширията."

 surging_tides_name: "Бурлящие приливы"
 surging_tides_desc: "Призовите попутные волны для стремительных морских путешествий."

 create_morass_name: "Создать трясину"
 create_morass_desc: "Создает обширную и опасную топь, преграждающую путь вражеским армиям."

 fluvial_restoration_name: "Речное восстановление"
 fluvial_restoration_desc: "Используйте священные воды Каширият для исцеления как телесных, так и душевных ран."

 rejuvenation_name: "Омоложение"
 rejuvenation_desc: "Освежает облик персонажа с помощью воды, наполненной магией."

 blessing_of_the_kasiryat_name: "Благословение Каширията"
 blessing_of_the_kasiryat_desc: "Наделяет цель первозданной красотой Каширията."

 water_healing_name: "Исцеление водой"
 water_healing_desc: "Маг, знающий магию воды, может использовать этот аспект для исцеления цели ценой определенной платы."
 fire_healing_name: "Огненное обновление"
 fire_healing_desc: ""Огненное обновление включает в себя прижигание полученного ранения и использование полученной энергии и магии для восстановления тела."
 stone_boon_name: "Горный дар"
 stone_boon_desc: "Заклинатель настраивает свое тело так, чтобы оно стало подобным камню, что улучшает здоровье, но сокращает продолжительность жизни."
 vitalize_livestock_name: "Оживление скота"
 vitalize_livestock_desc: "Магия [Concept('aspect_fire','огня')|E] увеличивает плодовитость скота в этом графстве, увеличивая доходность."

 drought_water_name: "Чистое небо"
 drought_water_desc: "Это заклинание перенаправляет все осадки и влагу из неба целевого графства, вызывая период засухи в этой области."

 drought_fire_name: "Палящее солнце"
 drought_fire_desc: "С помощью магии [Concept('aspect_fire','огня')|E], температура резко возрастает, иссушая колодцы."
 
 drought_light_name: "Обжигающее солнце"
 drought_light_desc: "Используя магию [Concept('aspect_light','света')|E], солнце светит с большей интенсивностью, выжигая землю и тех, кто находится снаружи, что губит урожай."

 iceskin_name: "Ледяная кожа"
 iceskin_desc: "Кожа заклинателя покрывается защитным слоем [Concept('aspect_ice','льда')|E]."
 
 melt_armor_name: "Расплавить доспехи"
 melt_armor_desc: "Когда заклинатель направляет [Concept('aspect_fire','огонь')|E], доспехи его целей плавиться и пузыриться, вызывая панику и причиняя увечья."
 
 freeze_armor_name: "Заморозить доспехи"
 freeze_armor_desc: "Доспехи цели становятся хрупкими,а сама она получает обморожение, когда заклинатель направляет [Concept('aspect_ice','лед')|E]."

 poison_armor_name: "Отравить доспехи"
 poison_armor_desc: "Заклинатель направляет магию [Concept('aspect_nature','природы')|E], и доспехи цели пропитываются незаметным ядом, медленно ослабляющим ее."

