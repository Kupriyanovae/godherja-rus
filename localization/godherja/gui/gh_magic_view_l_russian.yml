 shard_of_imbued_knowledge_child_tooltip: "Продвинет их [Concept( 'education_focus', 'обучение' )|E]"
 #pane_of_passage_modifier: "Spatial Gateway"
 pane_of_passage_modifier_desc: "Этот персонаж может перемещаться почти мгновенно через временно открытый портал."
 communication_shards_modifier_desc: "Этот персонаж имеет возможность связываться с землями, которые обычно находятся вне зоны досягаемости."
 melodious_voice_modifier_desc: "Голос этого персонажа был изменен с помощью магии, став более приятным и мелодичным."
 glassinger_modifier_desc: "Этот персонаж навсегда зачаровал свои голосовые связки с помощью магии.\n[Concept('aptitude','Пригодность')|E] для придворной должности «[GetCourtPositionType('court_musician_court_position').GetName()]»: #P +25#!"

 #negate_enemy_advantage_magic_modifier: "Terrain-Shaping Magic"
 negate_enemy_advantage_magic_modifier_desc: "Заклинания этого персонажа позволяют ему изменять любые виды материи, помогая с легкостью преодолевать даже самую сложную местность."
 army_damage_magic_modifier: "Магическое оружие"
 army_damage_magic_modifier_desc: "Оружие воинов этого персонажа мерцает странным светом - верный признак магического вмешательства."
 #army_damage_negative_magic_modifier: "Weakened Warriors"
 army_damage_negative_magic_modifier_desc: "Мешает воинам этого персонажа сражаться в полную силу."
 #army_toughness_magic_modifier: "Arcane Armor"
 army_toughness_magic_modifier_desc: "Доспехи воинов этого персонажа мерцают странным светом - верный признак магического вмешательства."
 
 #magic_omen_diplomacy_modifier: "Diplomatic Visions"
 magic_omen_diplomacy_modifier_desc: "Этот персонаж получил видения, открывшие тайные способы влиять на других с помощью слова."
 #magic_omen_martial_modifier: "Martial Visions"
 magic_omen_martial_modifier_desc: "Этот персонаж получил видения, открывшие тайные стратагемы для перелома хода войны."
 #magic_omen_stewardship_modifier: "Stewardship Visions"
 magic_omen_stewardship_modifier_desc: "Этот персонаж получил видения, открывшие тайные методы эффективного управления державой."
 #magic_omen_learning_modifier: "Learning Visions"
 magic_omen_learning_modifier_desc: "Этот персонаж получил видения, открывшие тайные практики для эффективного усвоения знаний."

 # diplomacy_magic_modifier_vassal_opinion_positive: "Glamour of Dominance" Dupe
 diplomacy_magic_modifier_vassal_opinion_positive_desc: "Этот персонаж излучает уверенность и господство, а его гремящий голос заставляет окружающих почти подсознательно опускать взор."
 diplomacy_magic_modifier_personal_scheme_hook_positive: "Непреодолимое обаяние"
 diplomacy_magic_modifier_personal_scheme_hook_positive_desc: "Шанс получения @weak_hook_icon! [Concept('weak_hook','слабого рычага влияния')|E] при успешных [Concept( 'schemes', 'происках' )|E] [GetScheme('seduce').GetTypeName] и [GetScheme('befriend').GetTypeName]:#positive_value +20%#!\nШанс получения @unspent_strong_hook_icon! [Concept('strong_hook','сильного рычага влияния')|E] при успешных [Concept( 'schemes', 'происках' )|E] [GetScheme('seduce').GetTypeName] и [GetScheme('befriend').GetTypeName]:#positive_value +5%#!"

 shape_change_name: "Магия изменения облика"
 shape_change_desc: "Заклинатель превращает себя в более могущественную чудовищную форму."

 
 shape_change_magic_modifier_1: "Странный облик"
 shape_change_magic_modifier_1_desc: "Этот персонаж выглядит так же, но в его поведении есть что-то ненормальное. Не стал ли он крупнее?"

 shape_change_magic_modifier_2: "Слегка чудовищный облик"
 shape_change_magic_modifier_2_desc: "В глазах этого персонажа появился особый голод, и он обладает недюжинной силой."

 shape_change_magic_modifier_3: "Заметно чудовищный облик"
 shape_change_magic_modifier_3_desc: "Этот персонаж заметно вырос в размерах, его мышцы бугрятся, и от него веет неестественной силой."

 shape_change_magic_modifier_4: "Полностью чудовищный облик"
 shape_change_magic_modifier_4_desc: "Этот персонаж обрел чудовищную ауру и силу, и все боятся встать у него на пути."

 magic_iced_prowess: "Замороженная доблесть"
 magic_iced_prowess_desc: "Сущность инея была влита в тело [ROOT.Char.GetFirstName], сохраняя [ROOT.GetCharacter.GetHerHis] доблесть в подобии расцвета сил."
  
 #magic_boneshaping_modifier: "Empowered Bones"
 magic_boneshaping_modifier_desc: "Скелет этого персонажа был изменен, чтобы лучше подходить для битвы."

 magic_levy_reinforcement_rate_gain_modifier_desc: "Воины этого персонажа усилены магией, благодаря чему они всегда находятся на пике формы и готовы к бою."

 #backfire_county_debuff_modifier: "Magical Mishap"
 backfire_county_debuff_modifier_desc: "Эта земля пострадала от вредоносных магических миазмов."
 #backfire_county_debuff_earth_modifier: "Rampant Rubble"
 backfire_county_debuff_earth_modifier_desc: "Камни на этой земле, кажется, движутся сами по себе, и их постоянное смещение причиняет немало бед измученным жителям."
 #backfire_province_debuff_fire_modifier: "Scorched Fields"
 backfire_province_debuff_fire_modifier_desc: "Эти земли были опалены пламенем магического происхождения, из-за чего земля почернела и потрескалась от жара пожарища."
 
 #county_ground_positive_modifier: "Empowered Ground"
 county_ground_positive_modifier_desc: er_desc: "В этой земле за ночь магическим образом появились тонкие жилы золота, обеспечив жителей новым источником дохода."
 #county_ground_positive_earth_modifier: "Mineral Rush"
 county_ground_positive_earth_modifier_desc: "Жила редкого металла магическим образом возникла в этой земле за ночь, вызвав внезапный наплыв потенциальных старателей."
 #county_ground_positive_earth_long_modifier: "Mineral Deposits"
 county_ground_positive_earth_long_modifier_desc: "Крупное месторождение драгоценных камней и металлов появилось в этой земле за ночь, обеспечив процветание ее жителей на долгие годы."
 #county_positive_build_modifier: "Building-Constructing Magic"
 county_positive_build_modifier_desc: "Камни этой земли магическим образом принимают правильные геометрические формы и легко раскалываются на блоки, идеальные для строительства."
 
 #defensive_county_magic_modifier: "Magical Defenses"
 defensive_county_magic_modifier_desc: "Защита этого владения была укреплена оградительными заклинаниями."

 #fort_creation_county_magic_modifier: "Fortress-Raising Magic"
 fort_creation_county_magic_modifier_desc: "Эта земля защищена неприступной крепостью. Неестественно гладкие стены и идеальные пропорции строения выдают его магическое происхождение."

 #long_term_fort_creation_county_magic_modifier: "Sustained Fortress-Raising Magic"
 long_term_fort_creation_county_magic_modifier_desc:"Эта земля защищена неприступной крепостью. Помимо неестественно идеальной конструкции, сами основы строения будто вросли корнями в эту землю."

 #improve_agriculture_magic_modifier: "Agriculture-Improving Magic"
 #improve_agriculture_magic_modifier_desc: "This land has been enchanted to bring forth life even in the midst of harsh conditions."

 #building_construction_county_magic_modifier: "Building-Constructing Magic"
 #building_construction_county_magic_modifier_desc: "The stones mined in this land magically emerge in geometric formations, and easily split into portions perfect for building."
 
 magic_fallout_modifier: "Магическое загрязнение"
 magic_fallout_modifier_desc: "Какая-то катастрофа прошлого оставила эту область с высоким уровнем окружающей [Concept('magic','магии')|E], что губительно сказывается на местной мирной жизни (если таковая вообще сохранилась).."
 #magic_ruined_agriculture_modifier: "Ruined Harvests"
 magic_ruined_agriculture_modifier_desc: "Магия отравила эту землю, иссушив посевы и препятствуя зарождению новой жизни."
 #magic_destroyed_buildings_modifier: "Urban Devastation"
 magic_destroyed_buildings_modifier_desc: "Сама земля была расколота катастрофой, рожденной магией. Жители этой земли практически уничтожены, а немногочисленные выжившие лишь ждут сладкого избавления смертью."
 

