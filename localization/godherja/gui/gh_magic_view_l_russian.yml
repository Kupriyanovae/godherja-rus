# Lifestyle cantrips 
 ritual_sacrifice_desc: "Каждая смерть вызывает незначительный выброс магической энергии, поэтому теоретически даже самое обыденное убийство человека может служить ритуальным жертвоприношением. На практике же само по себе это крайне неэффективно, однако определенные методы, повышающие действенность данного процесса, были известны практически всем культурам еще с рассвета истории."
 fire_magick_desc: "Скромный огненный шар, пожалуй, является самым распространенным заклинанием во всем [Concept('aeras','Эрасе')|E]. Хотя он требует минимального обучения и практически не нуждается в подготовке к сотворению, существуют многочисленные методы, позволяющие [Concept('magi','магам')|E] «предварительно заряжать» более мощные снаряды на некоторое время."
 arcane_meditation_name: "Магическая медитация"
 arcane_meditation_desc: "Практика погружения в поддерживаемое магией состояние блаженства и уверенности исполнялась как религиозными отшельниками, так и художниками на протяжении тысячелетий. Впрочем, большинство практиков избегают злоупотребления этой способностью из-за вредного воздействия на психику при длительном использовании."
 magistrength_name: "Магическая сила"
 magistrength_desc: ""
 haruspicy_name: "Гаруспиция"
 haruspicy_desc: ""
 aervalrsight_name: "Взор Эрвала"
 aervalrsight_desc: "Один из наиболее простых видов ясновидения, известных человеку. Взор Эрвала требует лишь того, чтобы заклинатель позволил своим глазам привыкнуть к полной темноте в течение нескольких дней, выполняя лишь пару самых элементарных ритуальных шагов. Впоследствии он сможет замечать различные магические влияния, пронизывающие мир при освещении светом [Concept('aervalr','Эрвала')|E]."
 skeletalcraft_name: "Костяное усиление"
 skeletalcraft_desc: "Говорят, что кости хранят саму ткань магии, привязывающую душу к телу, и многие маги используют их для усиления своих способностей."
 skeletalartifact_name: "Создание костяных изделий"
 skeletalartifact_desc: "Силу костей можно изменять, усиливать и придавать ей новые формы."
 bonecrafting_type_choice_crown: "Корона"
 bonecrafting_type_choice_regalia: "Регалии"
 bonecrafting_type_choice_staff: "Посох"
 bonecrafting_type_choice_spear: "Копье"
 bonecrafting_preview_prefix: "Будет создано: "
 bonecrafting_preview_dagger: "Кинжал"
 bonecrafting_preview_crown: "Корона"
 bonecrafting_preview_regalia: "Регалии"
 bonecrafting_preview_staff: "Посох"
 bonecrafting_preview_spear: "Копье"
 bonecrafting_preview_undecided: "определится случайным образом"
 siphon_rift_power_name: "Вытягивание Разлома"
 siphon_rift_power_desc: "Заклинание, позволяющее сотворившему его черпать силу, исходящую из [Concept('the_rift','Разлома')|E]"
# Pearls and Pits of Gold artifact
 gold_plague_name: "Золотая чума"
 gold_plague_desc: "Проклятие, которое разъедает драгоценные металлы подобно тому, как ужасная чума разъедает человека. Его гниль начинается с легкого помутнения, а затем медленно превращает любую зараженную драгоценность в тусклый, сланцево-серый и едко пахнущий металл с консистенцией слежавшейся почвы. Что хуже, оно передается при контакте — от монеты к монете и из кармана в карман. Уязвимы все известные драгоценные металлы, даже обычно нерушимое золото. Хотя проклятие неизбежно иссякает само по себе, перед этим оно успевает разорить множество торговых общин."
 ancestral_betrayal_name: "Предательство предков"
 ancestral_betrayal_desc: "Зловредное заклинание, которое связывает почти всегда нежелающего того духа и ввергает его в жажду убийства, направленную исключительно на его собственных детей. Душевное смятение внутри бедного духа обычно разрывает его на части, оставляя его разум в бессознательном и навечно кататоническом состоянии, но не раньше, чем он убьет, ранит или нанесет глубокую эмоциональную травму одному или нескольким своим объятым ужасом отпрыскам."

# Other
 cloud_mind_name: "Затуманивание разума"
 cloud_mind_desc: "Среди множества известных способов истончения грани между сном и бодрствованием — магических или иных — лишь немногие можно применить к кому-то, кроме себя. Подобные сочетания благовоний, сигилов и тауматургических инструментов способны насильно сломить ментальную защиту человека, из-за чего становится трудно отличить [Concept('aspect_dream','грёзы')|E] от реальности — если подобное различие вообще когда-либо существовало."
 defiled_nadir_name: "Оскверненный надир"
 defiled_nadir_desc: ""
 extract_lucrative_secrets_name: "Извлечение прибыльных тайн"
 extract_lucrative_secrets_desc: "То, что считается тайной в мире бодрствования и в [Concept('aspect_dream','грёзы')|E], часто является полной противоположностью, и лишь немногие охраняют свои мысли так же строго, как свои слова. Зачастую достаточно лишь беглого погружения, чтобы смертные тайны человека раскрылись и были пущены в ход ради власти или выгоды."
 spoils_of_the_dead_name: "Трофеи мертвых"
 spoils_of_the_dead_desc: ""
 haunting_power_desc: "Заклинатель призывает мстительных духов на свою цель."
 ward_of_the_ancestors_desc: "Заклинатель призывает волю предков себе на помощь."
 auspex_of_temptation_name: "Ауспиция Искушения"
 auspex_of_temptation_desc: "Заклинатель использует магию [Concept('aspect_blood','крови')|E], чтобы стать чрезвычайно чутким к языку тела и другим тонким знакам объекта своего вожделения. Однако на более высоких уровнях заклинание может сделать сотворившего его более подверженным стрессу от внешних событий."
 prayer_of_dark_enlightenment_name: "Молитва темного просветления"
 prayer_of_dark_enlightenment_desc: ""
 veil_of_nightmarish_illusions_name: "Покров кошмарных иллюзий"
 veil_of_nightmarish_illusions_desc:  ""
 dark_illusions_magic_name: "Теневые Фигуры"
 dark_illusions_magic_desc: "Магия [Concept('aspect_dark','тьмы')|E] и [Concept('aspect_nature','природы')|E] используется для изменения теней в лесу и создания у врагов ложного восприятия численности и позиции."
 auspex_of_war_name: "Ауспиция Войны"
 auspex_of_war_desc: "Заклинатель использует магию [Concept('aspect_fire','огня')|E], для улучшения своей реакции и агрессивности, что позволяет совершенствоваться в военном искусстве. Однако на более высоких уровнях заклинание может сделать заклинателя более подверженным стрессу от внешних событий."
 auspex_of_stewardship_name: "Ауспиция Математического разума"
 auspex_of_stewardship_desc: "Заклинатель использует магию [Concept('aspect_celestial','небес')|E] для улучшения своей способности решать проблемы своей державы. Однако на более высоких уровнях заклинание может сделать заклинателя более подверженным стрессу от внешних событий."
 auspex_of_diplomacy_name: "Ауспекс Текущей жизни"
 auspex_of_diplomacy_desc: "Заклинатель использует магию [Concept('aspect_water','воды')|E], чтобы лучше справляться с постоянно меняющимся миром дипломатии, что делает его гораздо более инициативным. Однако на более высоких уровнях заклинание может сделать заклинателя более подверженным стрессу от внешних событий."
 auspex_of_learning_name: "Ауспекс Вселенского разума"
 auspex_of_learning_desc: "Заклинатель использует магию [Concept('aspect_light','света')|E], чтобы настроиться на лучшее понимание тонкостей Вселенной. Однако на более высоких уровнях заклинание может сделать заклинателя более подверженным стрессу от внешних событий."
 compel_favorable_winds_name: "Принуждение попутных ветров"
 compel_favorable_winds_desc: "Велось немало споров о разумности духов ветра или даже об их существовании; и все же практически любая форма неразрушительного манипулирования [Concept('aspect_air','воздухом')|E] требует от [Concept('magi','мага')|E] примирительного подхода, согласовывающего его намерение с тем, что научно можно было бы описать как псевдо-[Concept('waylines','лей-линиями')|E] ветра."
 invoke_fair_weather_name: "Призыв ясной погоды"
 invoke_fair_weather_desc: "Погодные [Concept('gh_ritual','ритуалы')|E] пожалуй, являются самой распространенной формой [Concept('magic','магических')|E] феноменов. Кажется, каждая развитая в магическом отношении культура на [Concept('aeras','Эрасе')|E] в тот или иной момент начала активно на них полагаться, и [Concept('magi','маги')|E] (обычно послушники) могут проводить месяцы (а иногда и годы), непрерывно обновляя их над землями своих благодетельных (как правило, нет) покровителей."
 fleet_footed_name: "Быстроногие ветры"
 fleet_footed_desc: "Заклинатель использует [Concept('aspect_air','ветер')|E] и [Concept('aspect_water','воду')|E], чтобы путешествовать дальше и быстрее, чем он мог бы в иных условиях."
 drought_name: "Прогнать дожди"
 drought_desc: "Используя магию [Concept('aspect_air','воздуха')|E], все облака удерживаются вдали от этого региона, что губит урожай."
