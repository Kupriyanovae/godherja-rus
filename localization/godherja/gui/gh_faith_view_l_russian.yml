 LIFEPATH_RELEVANCE_TOOLTIP_TEXT: "#help Влияние Жизненных путей — это обобщенная мера того, насколько сильно концепция Жизненных путей определяет повседневную жизнь рядового шевальенца.#!"
 
 FAITH_LIFEPATHS: "Жизненные пути"
 FAITH_LIFEPATHS_EXPLANATION: "Каждый персонаж, исповедующий [FaithWindow.GetFaith.GetAdherentName], должен выбрать Жизненный путь по достижении 13 лет. Выбрать Жизненный путь можно только один раз в жизни."