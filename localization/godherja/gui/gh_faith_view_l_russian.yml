 HIGH_COURT_LEGITIMACY_TT:1 "#T Легитимность: [Select_CFixedPoint(Scope.Var('high_court_legitimacy').IsSet, Scope.Var('high_court_legitimacy').GetValue, '(CFixedPoint)0')|3]%\n#!#weak Легитимность #E Верховного суда#! отражает то, как его воспринимают верующие, чьи интересы он якобы защищает. Коррупция, кумовство и некомпетентность снижают легитимность, создавая негативные эффекты для всей [Concept('faith','конфессии')|E], тогда как справедливый и компетентный суд дает ей преимущества.#!\n\nЕжемесячное изменение #E легитимности#!: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Scope.ScriptValue('monthly_high_court_legitimacy_change_value'),'(CFixedPoint)0'),'#positive_value +','#negative_value ')][Scope.ScriptValue('monthly_high_court_legitimacy_change_value')|3]#!\n   Средняя #E судебная власть#!: #positive_value +[Scope.ScriptValue('monthly_high_court_legitimacy_change_judicial_power_value')|3]#!\n   Средняя #E коррупция#!: [SelectLocalization(GreaterThan_CFixedPoint(Scope.ScriptValue('monthly_high_court_legitimacy_change_corruption_value'),'(CFixedPoint)0'),'#negative_value -','#low ')][Scope.ScriptValue('monthly_high_court_legitimacy_change_corruption_value')|3]#!\n   Упадок: [SelectLocalization(GreaterThan_CFixedPoint(Scope.ScriptValue('monthly_high_court_legitimacy_change_decay_value'),'(CFixedPoint)0'),'#negative_value -','#positive_value +')][Abs_CFixedPoint(Scope.ScriptValue('monthly_high_court_legitimacy_change_decay_value'))|3]#!\n\n$HIGH_COURT_LEGITIMACY_EFFECTS$"
 HIGH_COURT_LEGITIMACY_EFFECTS:1 "[SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Scope.ScriptValue('high_court_legitimacy_value'), '(CFixedPoint)80'), GetFaithDoctrine('wardenite_high_court_legitimacy_very_high_doctrine').GetEffectsDescription( Faith.Self ),SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Scope.ScriptValue('high_court_legitimacy_value'),'(CFixedPoint)60'), GetFaithDoctrine('wardenite_high_court_legitimacy_high_doctrine').GetEffectsDescription( Faith.Self ), SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Scope.ScriptValue('high_court_legitimacy_value'), '(CFixedPoint)40'), '#weak Нет эффектов на этом уровне#!', SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Scope.ScriptValue('high_court_legitimacy_value'), '(CFixedPoint)20'), GetFaithDoctrine('wardenite_high_court_legitimacy_low_doctrine').GetEffectsDescription( Faith.Self ), GetFaithDoctrine('wardenite_high_court_legitimacy_low_doctrine').GetEffectsDescription( Faith.Self ) ) ) ))]"
 HIGH_COURT_LOYALTY_TT:1 "#T Верность: [Scope.ScriptValue('high_court_loyalty_value')|2]%\n#!#weak Верность #E Верховного суда#! действующему [Concept('mamuramat','мамуру')|E] зависит главным образом от мнения каждого верховного судьи о данном [Concept('mamuramat','Мамуре')|E], но также на нее могут влиять [Concept('hooks','рычаги влияния')|E] и [Concept('traits','свойства')|E].\n\nХорошие отношения с #E Верховным судом#! позволят более эффективно применять #E фокусы Верховного суда#!, тогда как нелояльный суд снизит их эффективность или вовсе заблокирует некоторые из них, а также приведет к постепенному падению #E авторитета Мамура#!.#!"
 HIGH_COURT_MAMURIAL_AUTHORITY_TT:1 "#T Авторитет Мамура: [Select_CFixedPoint(Scope.Var('high_court_mamurial_authority').IsSet, Scope.Var('high_court_mamurial_authority').GetValue, '(CFixedPoint)0')|3]%\n#!#weak #E Мамуриальный авторитет#! отражает степень правового влияния, которым [Concept('mamuramat','Мамур')|E] обладает над решениями #E Верховного суда#!. Высокое значение частично компенсирует штрафы от низкой #E лояльности Верховного суда#!, а также усиливает влияние #E судебной власти#! и личности [Concept('mamuramat','Мамура')|E] на легитимность суда.#!\n\nЕжемесячное изменение #E авторитета#!: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(Scope.ScriptValue('monthly_high_court_mamurial_authority_change_value'),'(CFixedPoint)0'),'#positive_value +','#negative_value ')][Scope.ScriptValue('monthly_high_court_mamurial_authority_change_value')|3]#!\n  #E Лояльность#!: [SelectLocalization(GreaterThan_CFixedPoint(Scope.ScriptValue('monthly_high_court_mamurial_authority_change_from_loyalty_value'),'(CFixedPoint)0'),'#positive_value +','#negative_value ')][Abs_CFixedPoint(Scope.ScriptValue('monthly_high_court_mamurial_authority_change_from_loyalty_value'))|3]#!\n\n[GetScriptedGui('high_court_mamurial_privileges_scripted_gui').BuildTooltip(GuiScope.SetRoot(Scope.Story.MakeScope).End)]" 
