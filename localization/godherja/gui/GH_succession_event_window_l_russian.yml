 SUCCESSION_EVENT_WINDOW_HEIR_MAGI:0 "[Concept('magi','Маг')|E] высокой искушенности, [ROOT.Char.GetSheHe] обладает всем необходимым для прекрасного правления."
 SUCCESSION_EVENT_WINDOW_HEIR_ARCANIST:0 "Арканист великого мастерства, [ROOT.Char.GetHerHis] государство непременно будет процветать в искусствах арканы."
 
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_AVERSARIAN_1:0 "[ROOT.Char.GetFullNameNoTooltip] теперь пирует с Чистейшими в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_AVERSARIAN_2:0 "[ROOT.Char.GetFullNameNoTooltip] покоится в объятиях Чистейшего в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_AVERSARIAN_3:0 "[ROOT.Char.GetFullNameNoTooltip] незыблемо [Select_CString(ROOT.Char.IsFemale, 'присоединилась', 'присоединился')] к Первым людям в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_BEAST_1:0 "[ROOT.Char.GetFullNameNoTooltip] возвращается в почву [Concept('aeras','Эраса')|E] в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_MARCHER_1:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'присоединилась', 'присоединился')] к Святым Пути в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_MARCHER_2:0 "[ROOT.Char.GetFullNameNoTooltip] уносится к далеким звездам в [ROOT.Char.GetFaith.PositiveAfterLife] в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_MARCHER_3:0 "[ROOT.Char.GetFullNameNoTooltip] теперь издалека направляет своих Попутчиков в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_SJALVOLKI_1:0 "[ROOT.Char.GetFullNameNoTooltip] пирует с Велосом в [ROOT.Char.GetFaith.PositiveAfterLife] в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_SJALVOLKI_2:0 "[ROOT.Char.GetFullNameNoTooltip] теперь готовится к последней битве в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_WARDENITE_1:0 "[ROOT.Char.GetFullNameNoTooltip] отныне и навеки встает на [ROOT.Char.GetHerHis] дозор в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_WARDENITE_2:0 "[ROOT.Char.GetFullNameNoTooltip] теперь охраняет Великую тюрьму в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_RITUALIST_1:0 "[ROOT.Char.GetFullNameNoTooltip] восходит по 1001 ступени к [ROOT.Char.GetFaith.PositiveAfterLife] в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_RITUALIST_2:0 "[ROOT.Char.GetFullNameNoTooltip] присоединяется к ангелам в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_MAWTALMUNININ_1:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'обогнала', 'обогнал')] [ROOT.Char.GetHerHis] соратников в стремлении к Смерти, наконец обретя ее в возрасте  [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_MAWTALMUNININ_2:0 "Многие завидуют [ROOT.Char.GetFullNameNoTooltip], ибо [ROOT.Char.GetSheHe] с уходом из жизни в возрасте [ROOT.Char.GetAge] лет [Select_CString(ROOT.Char.IsFemale, 'достигла', 'достиг')] наивысшего труда всего своего существования."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_MAWTALMUNININ_3:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'вознеслась', 'вознесся')] на зенит своего бытия, наконец достигнув Смерти после [ROOT.Char.GetAge] лет усилий."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEJORIG_1:0 "[ROOT.Char.GetFullNameNoTooltip] наконец [Select_CString(ROOT.Char.IsFemale, 'сумела', 'сумел')] сбежать из этого отравленного магией мира в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_GRAVERIGHT_1:0 "[ROOT.Char.GetFullNameNoTooltip] теперь взирает на свою семью из загробного мира, скончавшись в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ANAANIDES_1:0 "[ROOT.Char.GetFullNameNoTooltip] уходит из жизни в возрасте [ROOT.Char.GetAge] лет, уповая на то, что Великий Судья проявит милосердие, верша суд над [ROOT.Char.GetHerHis] душой."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_FOGEATER_1:0 "[ROOT.Char.GetFullNameNoTooltip] переходит из одного ада в другой после [ROOT.Char.GetAge] лет того, что с натяжкой можно было бы назвать «жизнью»."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_FOGEATER_2:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'прожила', 'прожил')] лишь [ROOT.Char.GetAge] лет, но кричать в муках [ROOT.Char.GetSheHe] гарантированно будет целую вечность."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ALLEMANI_1:0 "[ROOT.Char.GetFullNameNoTooltip] покоится среди корней Сдодрусигги после [ROOT.Char.GetAge] лет жизни."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ALLEMANI_2:0 "[ROOT.Char.GetFullNameNoTooltip] возвращается к Сдодрусиггу, откуда всякая жизнь зародилась и куда неизбежно вернется в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_SHEHARDDI_1:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'умерла', 'умер')], обретя укрытие в дланях божества [ROOT.Char.GetFaith.HighGodName] в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_SHEHARDDI_2:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'умерла', 'умер')], пережив мир, полный лжи и проделок [ROOT.Char.GetFaith.DevilName], прежде чем вернуться к Творцу всего сущего в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_HULAWITE_1:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'умерла', 'умер')]. Вечная награда – воспоминания, светлые или мрачные, которые [ROOT.Char.GetSheHe] [Select_CString(ROOT.Char.IsFemale, 'оставила', 'оставил')] после [ROOT.Char.GetAge] лет жизни."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_MOGOWAI_1:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'покинула', 'покинул')] этот мир в возрасте [ROOT.Char.GetAge] лет, обретя покой рядом с [ROOT.Char.GetFaith.HighGodName], пока они снова не будут найдены."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_IYROSSI_1:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'расплатилась', 'расплатился')] свои последние счеты и [Select_CString(ROOT.Char.IsFemale, 'обрела', 'обрел')] вечный покой в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_IYROSSI_2:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'умерла', 'умер')] после [ROOT.Char.GetAge] лет. Вскорости [ROOT.Char.GetFaith.HighGodName] вынесет свой вердикт над [ROOT.Char.GetHerHim]."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_KARDAWAI_1:0 "[ROOT.Char.GetFullNameNoTooltip] теперь пирует с [ROOT.Char.GetFaith.HighGodName] после [ROOT.Char.GetAge] лет жизни."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_GESTANWODER_1:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'умерла', 'умер')]. [Select_CString(ROOT.Char.IsFemale, 'Её', 'его')] кошмар наконец завершился после [ROOT.Char.GetAge] лет жизни."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_GESTANWODER_2:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'умерла', 'умер')]. [Select_CString(ROOT.Char.IsFemale, 'Её', 'Его')] душа определённо отныне пребывает в пыточных когтях [ROOT.Char.GetFaith.DevilName] после [ROOT.Char.GetAge] лет жизни."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_GALLIENI_1:0 "Предначертанный час и день наконец настали. [ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'умерла', 'умер')] в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_GALLIENI_2:0 "[ROOT.Char.GetFullNameNoTooltip] погиб[Select_CString(ROOT.Char.IsFemale, 'ла', '')], подчинившись [ROOT.Char.GetHerHis] судьбе в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_PARTIC_1:0 Из Великого Все сущее исходит, и в Великое же Все возвращается. Так и [ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'сгинула', 'сгинул')] в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_PARTIC_2:0 "[ROOT.Char.GetFaith.HighGodName] забирает [ROOT.Char.GetFullNameNoTooltip] обратно к себе после [ROOT.Char.GetAge] лет жизни."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_APTI_1:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'покинула', 'покинул')] этот мир в возрасте [ROOT.Char.GetAge] лет. Сон продолжается."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_APTI_2:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'вырвалась', 'вырвался')] из Сна в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_KYAALIC_1:0 "[ROOT.Char.GetFullNameNoTooltip] теперь снова возвращается к [ROOT.Char.GetFaith.HighGodName] в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_KAOSAHETAM_1:0 "[ROOT.Char.GetFullNameNoTooltip] возвращается в цикл Као [ROOT.Char.GetFaith.HighGodName] в возрасте [ROOT.Char.GetAge] лет."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_OULAUPI_1:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'покинула', 'покинул')] этот мир в возрасте [ROOT.Char.GetAge] лет, [ROOT.Char.GetHerHis] тело ныне покоится под сенью великих небес."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ORNDAEHZ_1:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'покинула', 'покинул')] этот мир в возрасте [ROOT.Char.GetAge] лет и теперь служит Златокожим в запредельных землях."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DAHALA_1:0 "[ROOT.Char.GetFullNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'покинула', 'покинул')] этот мир в возрасте [ROOT.Char.GetAge] лет, а [ROOT.Char.GetHerHis] ныне свободна, дабы ее пленили оставшиеся в живых."

