 small_crafting_blueprint_spell_component_desc: ""
 bone_crafting_blueprint_spell_component_name: "Чертёж изделия из кости"
 bone_crafting_blueprint_spell_component_desc: "Чертёж, по которому из обработанной кости можно изготовить предметы, наделённые магической силой."
 
