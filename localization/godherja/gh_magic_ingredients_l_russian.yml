 incense_spell_component_name: "Ладан"
 incense_spell_component_desc: "Сильный аромат, наполняющий место проведения ритуала, — не всегда приятный."
 powder_spell_component_name: "Порошок"
 powder_spell_component_desc: ""
 libation_spell_component_name: "Либация"
 libation_spell_component_desc: ""
 sedative_spell_component_name: "Успокоительное"
 sedative_spell_component_desc: "Вещество, притупляющее боль и успокаивающее возбуждённый разум, было бы весьма полезно здесь."
 poison_spell_component_name: "Яд"
 poison_spell_component_desc: "Яды одинаково смертоносны и в ритуальной чаше, и в кубке противника, однако в [Concept('magic','магии')|E] их свойства нередко отличаются от тех, что проявляются при обычном применении."
