l_russian:
 rockleaf_name:0 "Каменнолист"
 rockleaf_desc:0 "Живучая горная лоза, растущая на валунах, открытых солнцу и снегу. Хрустящие листья каменнолиста иногда употребляют ради их обезболивающего действия, но обычно избегают: они нередко вызывают онемение языка и скованность суставов."
 black_laudanum_name:0 "Чёрный лауданум"
 black_laudanum_desc:0 "Ночной мак известен тем, что гарантирует глубокий, лишенный сновидений сон на протяжении недель, даже в относительно неочищенном виде, а также может служить довольно сильным обезболивающим. Чёрная настойка, извлекаемая из него, настолько мощная, что при даже слегка превышенной дозе может привести к тому, что испивший его никогда не проснётся."
 sanguine_nectar_name:0 "Кровавый нектар"
 sanguine_nectar_desc:0 "Хотя Роза Маклеи не является особенно редким цветком в засушливых нагорьях Этепезеи и Опахасии, и её даже иногда выращивают как садовое растение, извлечение её знаменитого нектара — долгий и очень сложный процесс. Однако результатом становится невероятное вещество, превращающее боль в удовольствие и усиливающее все ощущения."
 deathcap_name:0 "Бледная поганка"
 deathcap_desc:0 "Бледная поганка едва ли нуждается в представлении: этот гриб — один из самых распространённых ингредиентов традиционных ядов. Его используют и [Concept('magi','маги')|E], но в магии он куда менее полезен: похоже, он теряет большую часть своей силы при воздействии любых энергий, кроме строго определённых. Этот капризный реагент, как правило, затрудняет контроль над заклинаниями."
 ancient_yew_needles_name:0 "Иглы древнего тиса"
 ancient_yew_needles_desc:0 "Тисы издавна славятся своей магической силой, которая с годами лишь возрастает. Старейшие из этих деревьев, вероятно, древнее самой человеческой цивилизации; даже горсть их хвои способна заметно стабилизировать окружающие магические энергии."
 mud_hemlock_name:0 "Болиголов"
 mud_hemlock_desc:0 "Грязевой болиголов, пахнущий фетидом и чрезвычайно ядовитый, растет только в самых глубоких уголках самых сырых болот Эраса. После употребления в пищу его еще живая жертва быстро раздувается, как труп, оставленный в воде, и в конце концов погибает от удушья. Останки жертвы так быстро превращаются в гниющую кашицу, что достойное погребение, скорее всего, окажется невозможным."
 sunset_oleander_name:0 "Закатный олеандр"
 sunset_oleander_desc:0 "Выращиваемый в древних садах Кемсарской империи, закатный олеандр - цветок, известный как своей красотой, так и смертоносностью. Хотя вдыхание его паров на расстоянии вызывает приятное возбуждение, даже один-единственный прямой вдох может привести к тому, что жертва упадет замертво в считанные секунды."
 ojyczanyz_sorrow_name:0 "Ойчизанская скорбь"
 ojyczanyz_sorrow_desc:0 "Этот выносливый цветок некогда ценили в ойчизанских садах за способность впитывать краски окружающей жизни. Ныне это один из немногих видов растений, сохранившихся в Личествах. Цветок, вобравший краски, не ядовит, но его полупрозрачная, призрачная разновидность, всё ещё встречающаяся в Личествах, ввергает тех, кто её употребляет, в глубокую тоску, которая обычно заканчивается смертью от горя или самоубийством."
 ambergris_name:0 "Серая амбра"
 ambergris_desc:0 "Серая амбра ценится в парфюмерии, а порой и в кулинарии. Это воскообразное вещество, насыщенное [Concept('aspect_water','аспектом воды')|E], известно своей способностью закреплять чары."
 lovers_hawthorn_name:0 "Боярышник влюбленных"
 lovers_hawthorn_desc:0 "Ягоды этого сравнительно редкого вида боярышника часто служат основой афродизиаков и любовных зелий. Способность растения избавлять от бесплодия высоко ценится, но репутация у него сомнительная: говорят, оно делает людей более склонными к супружеской измене."
 gum_khenemhati_name:0 "Хенемхатская камедь"
 gum_khenemhati_desc:0 "Затвердевшая смола акации, растущей только в Хенемхате. Эта сладкая камедь широко используется в саррадонских сладостях, а иногда входит и в состав недорогих лечебных смесей."
 coffee_damotica_name:0 "Кофе Дамотика"
 coffee_damotica_desc:0 "Торговцы нередко преувеличивают бодрящие свойства кофе, но горчайший дамотский кофе действительно один из самых крепких в мире — настолько, что порой находит применение даже в алхимии."
 cinnamon_name:0 "Корица"
 cinnamon_desc:0 ""
 vanilla_name:0 "Ваниль"
 vanilla_desc:0 ""
 wyrm_egg_name:0 "Яйцо змия"
 wyrm_egg_desc:0 ""
 purified_mote_of_everflame_name:0 "Очищенная искра вечного пламени"
 purified_mote_of_everflame_desc:0 ""
 devils_horn_coral_name:0 "Коралл «Рог дьявола»"
 devils_horn_coral_desc:0 ""
 volcanic_salts_name:0 "Вулканические соли"
 volcanic_salts_desc:0 "Чёрные горы, остров Термос и Крехеджад исторически были наиболее распространенными источниками этих темных солей, которые считаются одними из самых основных алхимических реагентов."
 dragon_scale_name:0 "Чешуя дракона"
 dragon_scale_desc:0 "Хотя [Concept('dragons','драконы')|E] были давно истреблены [Concept('aversaria','Аверсарией')|E], земледельцы до сих пор порой находят древнюю чешую, успевшую окаменеть. Она по-прежнему тепла на ощупь и словно таит в себе жизнь. Известно, что сказочно богатые [Concept('magi','маги')|E] и айронойцы вдыхают порошок драконьей чешуи: и напоказ, и ради его предполагаемой способности, как говорят, «оседлать дракона». Большинство, однако, куда выше ценит огромную магическую силу, заключённую в древнем камне."
 flawless_diamond_name:0 "Безупречный бриллиант"
 flawless_diamond_desc:0 "Чистейший и великолепнейший из обыкновенных драгоценных камней. Бриллианту такого совершенства позавидовал бы любой монарх, а как реагент, укрепляющий магию, он почти не имеет себе равных."
 kharadan_salt_name:0 "Хараданская соль"
 kharadan_salt_desc:0 "Добытая в скалах самых высоких пиков Харадана, эта голубая соль холодит язык и известна своими расслабляющими свойствами."
 ash_ward_name:0 "Ясеневый оберег"
 ash_ward_desc:0 "На коре старых ясеней порой вырезают защитные руны, создавая одноразовый, но весьма мощный [Concept('magic', 'магический')|E] оберег. Во время ритуала он помогает оградить чары от нежелательных энергий, однако редко выдерживает больше одного применения."
