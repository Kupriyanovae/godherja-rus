 forest_helmet_name:0 "Лесной шлем"
 forest_helmet_desc:0 ""
 
 abyssal_bramble_name:0 "Терновник бездны"
 abyssal_bramble_desc:0 ""
  
 thunder_scarred_bark_name:0 "Кора, опалённая молнией"
 thunder_scarred_bark_desc:0 "Чаще всего это кора дубов, древесина что неоднократно подвергалась могучей силе молнии, обладает множеством любопытных свойств, но одно выделяется особенно — если обработать её определённым образом и оставить под грозой, она почти наверняка будет притягивать гром каждые несколько минут. Хотя это может стать отличным внешним источником магической энергии, это также делает ритуал значительно более опасным и трудноконтролируемым."
 
 #poisons
 
 last_sigh_name:0 "Последний вздох"
 last_sigh_desc:0 "Без запаха и вкуса, «Последний вздох» был бы излюбленным ядом заговорщиков, если бы не его крайняя редкость. Он рождается лишь в тех местах, где было пролито огромное количество крови и где применялись самые гнусные из известных человечеству чар. Цветок прекрасен — белоснежный, но, несмотря на свою красоту, он смертельно ядовит. Это сильнейший из известных ядов: стоит жертве проглотить его, как её внутренности начинают разлагаться с пугающей скоростью." 

 strangler_fig_seeds_name:0 "Семена киратского удушающего фикуса"
 strangler_fig_seeds_desc:0 "Удушающие фикусы не были исконными растениями джунглей Кирата, но быстро прижились здесь. Они стремительно оплетают местные деревья и со временем губят их, распространяясь всё дальше. Зловещая жизненная сила этих растений сохраняется даже в семенах и отсечённых побегах."

 
 
 #hallucinogens
 
 moss_pearl_name:0 "Моховая жемчужина"
 moss_pearl_desc:0 "Душистые и прекрасные моховые жемчужины растут на некоторых полянах центрального Калатипсоми. Они значительно улучшают владение магией и тем самым повышают устойчивость любого заклинания. Однако иногда их действие сопровождается внезапными судорогами и бессвязными видениями."
 
 #FUNGI
 
 #poisons
 
 ancient_fingerbone_name:0 "Древняя фаланга"
 ancient_fingerbone_desc:0 "Древняя фаланга, намного больше, чем у любого человека, обёрнутая в выцветшую молитвенную ткань с тёмными символами и рунами, написанными по спирали вдоль её длины. Ноготь всё ещё достаточно острый, чтобы пролить кровь."
 
 
 cerebrospinalis_concentrate_name:0 "Концентрат цереброспиналиса"
 cerebrospinalis_concentrate_desc:0 "Использование этого обезболивающего крайне табуировано из-за его способности передавать боль одного человека другому, а способ его «добычи» требует выскабливания мозга человека. Кроме того, пьющему нужно лишь смешать кровь жертвы с концентратом и ввести смесь в позвоночник, передавая всю боль пьющего жертве."
 
 pickled_owls_eyye_desc:0 ""
 cockatrice_eye_name:0 "Глаз кокатриса"
 cockatrice_eye_desc:0 "Когда кокатриса убивают, его глаза всё ещё хранят свет Эрвала, что делает их полезными для различных заклинаний. Для его использования заклинателю нужно смотреть в мёртвый глаз во время произнесения заклинания. Этот глаз был добыт не в полнолуние, поэтому делать это безопасно."
 cockatrice_eye_chare_name:0 "Маринованный совиный глаз"
 pickled_owls_eged_name:0 "Заряженный глаз кокатриса"
 cockatrice_eye_charged_desc:0 "Когда кокатриса убивают, его глаза всё ещё хранят свет Эрвала, что делает их полезными для различных заклинаний. Для его использования заклинателю нужно смотреть в мёртвый глаз во время произнесения заклинания. Глаз был добыт в полнолуние, что даёт больше магии, но и больше опасности. Если смотреть в глаз слишком долго, части тела заклинателя могут превратиться в камень."
 
 dragon_eater_snail_name:0 "Улитка-пожиратель драконов"
 dragon_eater_snail_desc:0 "Эти водные улитки испускают кроваво-красное свечение и сохраняют часть водной бездны внутри себя. Этот вид обитает в водах вокруг погружённых костей драконов и других крупных божественных существ, погибших над водой. Хотя такие находки редки, улитки-пожиратели драконов обладают удивительной способностью находить их и преодолевать огромные расстояния, чтобы добраться до них."
 
 golem_pebbles_name:0 "Големья галька"
 golem_pebbles_desc:0 "Иногда, после того как голем выполнит своё предназначение и будет уничтожен, его части сохраняют магическую энергию. Эту гальку можно растереть в порошок и смешать с кашей, чтобы получить отвратительную на вкус смесь. При употреблении она, кажется, стабилизирует заклинания и заземляет заклинателя."

 fuligin_bone_shards_name:0 "Фулигиновые костяные осколки"
 fuligin_bone_shards_desc:0 "Последние останки существа, опалённого ужасным драконьим пламенем. Эти осколки содержат фрагмент силы пламени и нагреваются при прикосновении, когда в них вливают магическую энергию, хотя слишком большое количество, как известно, вызывает катастрофические магические пожары."
 
 petrified_dragon_scale_name:0 "Окаменевшая драконья чешуя"
 petrified_dragon_scale_desc:0 "Хотя [Concept('dragons','драконы')|E] были давно истреблены [Concept('aversaria','Аверсарией')|E], земледельцы до сих пор порой находят древнюю чешую, успевшую окаменеть. Она по-прежнему тепла на ощупь и словно таит в себе жизнь. Известно, что сказочно богатые [Concept('magi','маги')|E] и айронойцы вдыхают порошок драконьей чешуи: и напоказ, и ради его предполагаемой способности, как говорят, «оседлать дракона». Большинство, однако, куда выше ценит огромную магическую силу, заключённую в древнем камне."
 
 snakestone_name:0 "Змеиный камень"
 snakestone_desc:0 "Самоцветные змеи обитают в каширийских джунглях; всю жизнь в их головах растут сверкающие камни. Извлечь такой камень можно лишь убив змею. Рассказы о змеях, мстящих браконьерам, не помешали процветанию торговли этими камнями: они не только красивы, но и способны усиливать свет, подобно линзе. Камни старейших змей сохраняют это свойство ещё долго после их смерти."
 
 slime_herder_toad_name:0 "Слизь жабы-пастуха"
 slime_herder_toad_desc:0 "Быстро размножающийся вид больших джунглевых лягушек выделяет слизь, которая, как говорят, даёт почти легендарную силу плодовитости. При нанесении на репродуктивные органы эти выделения, как говорят, дают им новую жизнь, часто приводя к рождению потомства. Однако сильный запах слизи отталкивает всех, кроме самых преданных партнёров."
 
 scryers_cone_name:0 "Конус прорицателя"
 scryers_cone_desc:0 "Помимо того, что она является отличным средством для гадания, раковина улитки-прорицателя несёт в себе часть токсичности существа; даже в своей обычной форме она способна вызвать паралич и смерть, а магическая активация заставляет её буквально превращать в камень часть тела, к которой она была применена."
 
 #TO ADD:  Acts as a powerful poison at Water level 4, otherwise as a moderate poison, Saps the victim health and prowess permanently at Water level 4 and above,  Moderately boosts the positive outcome chance of divining spells at level 2 Stone, otherwise slightly boosts it, Water 1, Stone 1
  
 tower_lizards_gland_name:0 "Железа башенной ящерицы"
 tower_lizards_gland_desc:0 "У нескольких видов ящериц, обитающих близ Башни в Кемсаре, обнаружены любопытные свойства. Вместо того чтобы греться на солнце, они стремятся приблизиться к этим сооружениям и подвергнуться воздействию их магического поля. При вскрытии обнаруживается железа, в которой, по-видимому, накапливается часть этой магии. Заключённую в ней силу можно использовать при сотворении заклинаний."
 
 #MINERALS / METALS / POWDERS ETC.
 
 guguwrat_crystal_name:0 "Врат-кристалл"
 guguwrat_crystal_desc:0 "Врат-кристаллы создаются во время [Concept('gudugwrat','Гудугврата')|E], когда его мощные молнии ударяют в песок, оставляя после себя магические кристаллы, трещащие от энергии. Высоко нестабильные, большинство кристаллов очищаются учёными академии Кандамарун для использования в магических ритуалах. Добыча этих кристаллов крайне опасна, так как требует путешествия к центру смертельного шторма, рискуя смертью от магического воздействия, ударов молний и проклятых существ, бродящих по морскому дну."
 
 #Haemium Pellet
 haemium_pellet_low_name:0 "Слабая гранула геммия"
 haemium_pellet_low_desc:0 "Известная некоторым как «совершенное железо», а другим как «совершенная кровь», геммий производится из сочетания чистого необработанного железа и количества сердечной крови. Когда эта кровь взята от животного или другого подобного существа, получается слабый геммий. Гранула слабого геммия может быть употреблена во время ритуала, чтобы усилить его и стабилизировать процесс. Также известно, что она способствует хорошему пищеварению и сбалансированным гуморам."
 haemium_pellet_middling_name:0 "Средняя гранула геммия"
 haemium_pellet_middling_desc:0 "Известная некоторым как «совершенное железо», а другим как «совершенная кровь», геммий производится из сочетания чистого необработанного железа и количества сердечной крови. Кровь для этой гранулы была взята от человеческой жертвы, что делает её довольно мощным магическим ингредиентом. При употреблении во время ритуала она действует как довольно эффективный стабилизатор. С другой стороны, внезапный прилив аспекта крови в тело пользователя делает её слабо токсичной."
 haemium_pellet_potent_name:0 "Сильная гранула геммия"
 haemium_pellet_potent_desc:0 "Известная некоторым как «совершенное железо», а другим как «совершенная кровь», геммий производится из сочетания чистого необработанного железа и количества сердечной крови. Кровь для этой гранулы была взята от могущественного мага или, возможно, какого-то великого магического существа, что делает её чрезвычайно мощной. Употреблённая во время ритуала, она служит как мощный стабилизатор и как довольно неприятная рвотная отрава."
 
 magic_binding_powder_name:0 "Порошок связывания магии"
 magic_binding_powder_desc:0 "Существуют определённые, высоко ценимые объекты, способные содержать и хранить магическую силу. Но их полезность не заканчивается, когда маги их истощают. Их остатки, перетёртые в мелкий порошок, сохраняют способность связывать магию. Если употребить его во время особых ритуалов, полученное вещество может связать избыточную магию внутри человеческого тела, очищая его. Однако очень трудно правильно дозировать его, и многие маги лишили себя больше магии, чем хотели."
 
 #TO ADD: [can only be used in healing spells] rids the body of Overcharge and greatly alleviates symptoms of Exposure Sickness, it has significant chance of healing physical magic mutations by ridding body of excessive magi, it has chance (a high learning test?, just 15%? or 30%) of downgrading your Magic Potency
 
 orichalc_sliver_name:0 "Осколок орихалка"
 orichalc_sliver_desc:0 "Осколок совершенного золота длиной с палец. Секреты его создания считаются одним из высших алхимических искусств и поэтому тщательно охраняются теми, кто их знает. Он отражает солнце независимо от времени суток и нахождения в помещении, и поэтому ярко светится. Физически съеденный во время ритуала, он горит внутри тела мага, потенциально вызывая внутренние ожоги, а в последующие месяцы мучает пользователя бессонницей и беспокойным сном, где его сны поглощаются призраком полуденного солнца."
 
 sarradonian_crystalline_powder_name:0 "Саррадонский кристаллический порошок"
 sarradonian_crystalline_powder_desc:0 "Производится путём измельчения стекловидного камня, добываемого в определённых шахтах в глубинах Саррадонской пустыни. Этот чёрный кристаллический порошок несёт в себе чистую сущность земли, и вдыхание его во время ритуала может значительно усилить стабильность любого заклинания. Известно, что долгосрочные пользователи часто страдают от кашля, от которого многие умирают, но для некоторых потенциальная стоимость легко оправдывает магическую мощь, которую он может дать."  
  
 # WINES, MIXTURES, AND EVERYTHING BOTTLED
 
 dreamwine_name:0 "Мутная переквина"
 dreamwine_desc:0 "Переквина, или «Вино снов», дистиллируется из ягод вида бледно-белых лилий, растущих вдоль лей-линий в Шевалье и вокруг неё. Часто употребляется разбавленной из-за её наркотического эффекта, в концентрированной форме она вызывает интенсивные осознанные сновидения. Долгосрочное использование, как отмечалось, вызывает изменения личности, приводя к спокойствию и пассивности."

 # Non-Ingredient Components

 runic_scroll_spell_component_name: "Рунический свиток"
 runic_scroll_spell_component_desc: "[Concept('runic_script','Руническое начертание')|E] ритуала на материальном носителе способно значительно усилить его действие."
 prism_spell_component_name: "Призма маны"
 prism_spell_component_desc: "Призма маны необходима для накопления магической энергии, высвобождаемой во время этого ритуала."
 pay_gold_name: "Вложить [gold_i][gold|E]"
 pay_gold_desc: "Различные мелочи, не особо ценные по отдельности, но в совокупности составляющие ощутимую цену."
 pay_wounds_name: "Принести в жертву кровь"
 pay_wounds_desc: "Заклинание требует жертвоприношения собственной крови, причем в таком количестве, что для её получения придется нанести немало ран."
 character_prisoner_name: "Пленник"
 character_prisoner_desc: "Потребуется участие подневольного человека, и вряд ли уготованная ему роль окажется приятной."
 character_cabal_name: "Выполнить обряд"
 character_cabal_desc: "Сложный и, возможно, длительный процесс, который лучше поручить человеку с соответствующим опытом."
 character_herbalist_blood_draining_poultice_name: "Кровопускательная припарка"
 character_herbalist_blood_draining_poultice_desc: "Особые припарки позволяют заметно облегчить кровопускание, однако для их изготовления необходимо хорошо знать местные травы и их алхимические свойства."
 artifact_spell_component_name: "[artifact|E]"
 artifact_spell_component_desc: "Необычный или труднодоступный инструмент либо ингредиент."
 sacrificial_dagger_spell_component_name: "Жертвенный кинжал"
 sacrificial_dagger_spell_component_desc: "Обычный клинок может не подойти для этой задачи: необходим клинок с соответствующими рунами, наделённый нужной магической силой."
 bone_spell_component_name: "Кости"
 bone_spell_component_desc: "Кости могут быть мощным источником энергии, хотя это и не гарантировано."
 essence_spell_component_name: "Эссенция элементаля"
 essence_spell_component_desc: "Эссенция могущественного элементаля может оказаться весьма полезной опытному [Concept('magi','магу')|E]."
 bone_sacrifice_spell_component_name: "Кости"
 bone_sacrifice_spell_component_desc: "Кости могут быть мощным источником энергии, хотя это и не гарантировано."
 gemstone_spell_component_name: "Драгоценные камни"
 gemstone_spell_component_desc: "Драгоценные камни часто используются в ритуалах, либо как источник силы, либо как строительный материал для магических конструкций."
 aervalr_shard_spell_component_name: "Осколок Эрвала"
 aervalr_shard_spell_component_desc: "Со времён [Concept('frodbrokna','Фродброкны')|E] осколки [Concept('aervalr','Эрвала')|E] падают в изобилии и служат мощными источниками [Concept('magic','магии')|E]."

