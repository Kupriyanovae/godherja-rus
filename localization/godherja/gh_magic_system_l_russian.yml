 sacrifice_plants.tt:0 "Вы получите событие, информирующее вас о том, сколько @magic_icon! [Concept('magic','магии')|E] вы получите, а также о любых побочных эффектах. \nДаёт больше магической силы при использовании на графствах с зелёными или лесистыми провинциями и меньше магической силы при использовании на графствах с каменистыми, пустынными или бесплодными провинциями."
 sacrifice_plants_total_value_tooltip.tt:0 "Вы получаете @magic_icon!#P [THIS.Var('total_plant_sacrifice_value').GetValue|0]#! [Concept('magic','магии')|E]"
 sacrifice_plants_no_longer_possible.tt:0 "#N Земли [affected_county.GetName|E] были сделаны почти полностью бесплодным от растительной жизни из-за многократных жертвоприношений, что делает любое дальнейшее жертвоприношение невозможным.#! "
 vegetation_quality_terrible.tt:0 "#N Местность провинций в [affected_county.GetName|E] почти лишена растительности, что даёт очень малый возможный прирост.#! "
 vegetation_quality_bad.tt:0 "#N Местность провинций в [affected_county.GetName|E] имеет лишь скудную растительность, что даёт малый возможный прирост.#! "
 vegetation_quality_average.tt:0 "Местность провинций в [affected_county.GetName|E] имеет разумное количество растительности, что даёт средний возможный прирост."
 vegetation_quality_good.tt:0 "Местность провинций в [affected_county.GetName|E] имеет выше среднего количество растительности, что даёт вышесредний возможный прирост."
 vegetation_quality_excellent.tt:0 "#P Местность провинций в [affected_county.GetName|E] имеет обильную растительность, что даёт большой возможный прирост.#! "
 vegetation_quality_best.tt:0 "#P Местность провинций в [affected_county.GetName|E] имеет буйную и очень обильную растительность,  что даёт огромный возможный прирост.#! "
 
 sacrifice_population.tt:0 "Вы получите событие, информирующее вас о том, сколько @magic_icon! [Concept('magic','магии')|E] вы получите, а также о любых побочных эффектах."
 sacrifice_population_total_value_min.tt:0 "Вы получаете @magic_icon!#P [THIS.Var('total_sacrifice_population_value_min').GetValue|0]#! [Concept('magic','магии')|E]"
 sacrifice_population_total_value_mid.tt:0 "Вы получаете @magic_icon!#P [THIS.Var('total_sacrifice_population_value_mid').GetValue|0]#! [Concept('magic','магии')|E]"
