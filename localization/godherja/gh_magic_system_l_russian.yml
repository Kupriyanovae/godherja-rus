 spell_too_weak_to_heal_this_wound.tt:0 "#N Раны этого персонажа тяжелы, и могут быть исцелены этим заклинанием, только если оно сотворено на более высоком уровне. #!"
 boneshaping_1.tt:0 "Получит возможность магически изменить тело и костную структуру [affected_character.GetName|E].\n Каждый раз, когда персонаж подвергается воздействию формирования костей, заклинание должно быть сотворено на более высоком уровне, чтобы воздействовать на него снова."
 boneshaping_2.tt:0 "#N [affected_character.GetName|E] подвергался формированию костей слишком много раз, чтобы на него подействовал заклинание данного уровня.\n Заклинание должно быть сотворено на более высоком уровне, чтобы оказать какое-либо воздействие на эту цель. #!"
 magic_cannibalism_1.tt:0 "Вы поглотите тело [cannibalism_victim.GetName|E], чтобы вобрать в себя часть их генетического или магического потенциала, если он превосходит ваш.\n За каждого поглощённого персонажа вы должны сотворить это заклинание на более высоком уровне, чтобы вобрать силу из другого."
 magic_cannibalism_2.tt:0 "#N Вы поглотили слишком много персонажей, чтобы иметь возможность сотворить Пожирание силы.\n Вы должны сотворить заклинание на более высоком уровне, чтобы вобрать какую-либо силу из [cannibalism_victim.GetName|E]. #!"
 magic_cannibalism_3.tt:0 "#N Вы поглотили слишком много персонажей, чтобы получить дальнейшую силу через заклинание Пожирание Силы. #!"
