 initiate_spell_event_interior_journey_desc:0 "Общение с аспектами внутренней психики, углубляющее силу и недостатки основных черт личности."
 
 vampirism_health_pool_tt:0 "Поддерживайте свою жизнь, вытягивая жизнь из других. \nВы получите #P 0.25 #! очков здоровья в ваш вампирический запас здоровья, который будет преобразован в стек [GetModifier('vampirism_mod').GetNameWithTooltip|L] в случае вашей смерти от естественных причин, увеличивая ваш ожидаемый срок жизни на 2 года.  \nКаждое последующее сотворение будет увеличивать стоимость последующих сотворений, поскольку магия, необходимая для поддержания вашей жизни, будет возрастать."
 vampirism_health_pool_transfer_tt:0 "[ROOT.Var('vampiric_drain_amount_show').GetValue|0] очков вампирического запаса здоровья были преобразованы в [ROOT.Var('vampiric_drain_amount_show').GetValue|0] единиц здоровья в виде модификаторов [GetModifier('vampirism_mod')]."
 vampirism_health_pool_transfer_dying_tt:0 "[ROOT.Var('vampiric_drain_amount_show').GetValue|0] очков вампирического запаса здоровья преобразованы в [ROOT.Var('vampiric_drain_amount_show').GetValue|0] единиц здоровья в виде модификаторов [GetModifier('vampirism_mod')]. Поскольку вашего вампирического запаса здоровья было недостаточно, чтобы довести вас до состояния  \"Хорошее\" здоровье, вы утратили возможность далее поддерживать свою жизнь через вампиризм."
 
 #necrotic_vitality_0.tt:0 "#N Animating yourself through the use of Dark Necromancy will take a toll on your body, resuting in 1 permanent stack of [GetModifier('necrotic_vitality_negative_stack').GetNameWithTooltip|L] #! \nThus, you will receive a net 0.75 Health for the duration, and -0.25 Health Afterwards."
 #necrotic_vitality_1.tt:0 "#N Animating yourself through the use of Dark Necromancy will take a toll on your body, resuting in 2 permanent stacks of [GetModifier('necrotic_vitality_negative_stack').GetNameWithTooltip|L] #! \nThus, you will receive a net 1.5 Health for the duration, and -0.5 Health Afterwards."
 #necrotic_vitality_2.tt:0 "#N Animating yourself through the use of Dark Necromancy will take a toll on your body, resuting in 4 permanent stacks of [GetModifier('necrotic_vitality_negative_stack').GetNameWithTooltip|L] #! \nThus, you will receive a net 3 Health for the duration, and -1 Health Afterwards."
 #necrotic_vitality_3.tt:0 "#N Animating yourself through the use of Dark Necromancy will take a toll on your body, resuting in 6 permanent stacks of [GetModifier('necrotic_vitality_negative_stack').GetNameWithTooltip|L] #! \nThus, you will receive a net 6.5 Health for the duration, and -1.5 Health Afterwards."
 
