l_russian:

 # Toast: excavation contribution complete
 glowmoss_excavation_contribution_complete: "Вклад на раскопки светомоша внесён"
 glowmoss_excavation_contribution_complete_desc: "Средства выделены, и работы начались всерьёз. Землекопы прорубают каналы и готовят поверхности повсюду. Светомош последует их путём."

 # Toast: arcane infusion complete
 glowmoss_arcane_infusion_complete: "Чародейское наполнение завершено"
 glowmoss_arcane_infusion_complete_desc: "Колонии светомоша пульсируют ровным прохладным светом благодаря [Concept('magic','магии')|E], направленной в них. Подземные ходы будут пользоваться этим благом ещё десятилетия."

 # Modifier names and descriptions
 mayik_glowmoss_network_modifier: "Сеть светомоша"
 mayik_glowmoss_network_modifier_desc: "Общеграфская сеть возделанного светомоша озаряет тоннели, улучшая передвижение людей и снабжение."

 mayik_arcane_glow_modifier: "Чародейская биолюминесценция"
 mayik_arcane_glow_modifier_desc: "Светомош здесь пульсирует чародейским светом. Живительное сияние способствует и росту, и торговле."

 GLOWMOSS_GLOSS: "Светомош — редкая разновидность мха, встречающаяся под [Glossary('Майикратией','mayikprolollan_encyclopedia_desc')], известная своей способностью светиться. Учёные школы полагают, что мох питается энергиями [Concept('magic','магии')|E], высвобождающимися в течение долгого времени в структуре."

 great_project_glowmoss_arcane_cost: "[Concept('magic','Магическая')|E] стоимость: #R [SCOPE.ScriptValue('mayik_glowmoss_arcane_cost')|0]#! (зависит от [Concept('arcana','арканы')|E])"

 # Fortenorn Great Project
 great_project_great_project_type_fortenorn: "Расширение Фортенорнов"
 great_project_type_fortenorn: "Расширение Фортенорнов"
 great_project_type_great_project_fortenorn: "Расширение Фортенорнов"
 great_project_type_great_project_fortenorn_desc: "Чёрные форты веками удерживали северную границу [Concept('chevalie','Шевалье')|E] как отчаянное лоскутное укрепление, возводимое и разрушаемое с течением времени. При достаточных ресурсах и организации эти укрепления можно расширить, укрепить или отстроить заново, дабы противостоять бесконечной волне из [Concept('the_lichdoms','Личеств')|E]."

 great_project_type_great_project_fortenorn_contribution_master_of_fortifications: "Начальник укреплений"
 great_project_type_great_project_fortenorn_contribution_master_of_fortifications_desc: "Должен быть назначен Начальник укреплений, дабы координировать колоссальные инженерные работы: съёмку местности, организацию линий снабжения и руководство рабочими и [Concept('antimagic_orders','антимагическими орденами')|E]. Только владелец проекта или правитель [Concept('chevalie','Шевалье')|E] может взять на себя эту роль."

 great_project_type_great_project_fortenorn_contribution_stonework: "Каменные работы"
 great_project_type_great_project_fortenorn_contribution_stonework_desc: "Чёрные форты требуют огромного количества тесаного камня, добываемого в горах Бастион. Необходимо финансировать дорожные бригады и караваны волов, чтобы работа могла продолжаться."

 great_project_type_great_project_fortenorn_contribution_earthworks: "Земляные работы"
 great_project_type_great_project_fortenorn_contribution_earthworks_desc: "Рвы, крепостные рвы и поля убийств должны быть вырыты. Этот изнурительный труд не менее важен, чем сами стены, ибо земляные укрепления сокрушают полчища нежити ещё до того, как они достигнут камня."

 great_project_type_great_project_fortenorn_contribution_garrison_troops: "Гарнизонные войска"
 great_project_type_great_project_fortenorn_contribution_garrison_troops_desc: "Крепость без солдат — всего лишь руины. Постоянные гарнизоны, оплачиваемые, снабжаемые и обученные, должны быть размещены вдоль границы. Эти мужи и жёны будут держать линию, когда стены подвергнутся испытанию."

 great_project_type_great_project_fortenorn_contribution_siege_defenses: "Осадные укрепления"
 great_project_type_great_project_fortenorn_contribution_siege_defenses_desc: "Баллисты, батареи многозарядных арбалетов и контр-осадные позиции должны быть установлены вдоль стен. Нежить не знает усталости, но её можно заставить грудиться на поле убийства, а для этого нужно правильное снаряжение."

 great_project_type_great_project_fortenorn_contribution_anti_magic_wards: "Антимагические стражи"
 great_project_type_great_project_fortenorn_contribution_anti_magic_wards_desc: "Ни одно укрепление на северной границе не будет завершено без благословения [Concept('antimagi','антимагов')|E]. Мёртвая почва должна быть разбита освящённым железом, притолоки вырезаны сковывающими рунами, а стены освящены против тёмной [Concept('magic','магии')|E], что движет [Concept('gh_general_undead','нежитью')|E]. Ордена не трудятся дёшево, но без их чар стены могут оказаться беспомощны."

 great_project_type_great_project_fortenorn_contribution_supply_lines: "Линии снабжения"
 great_project_type_great_project_fortenorn_contribution_supply_lines_desc: "Дороги должны быть проложены, склады построены, а механизм логистики налажен, прежде чем форты смогут существовать. Северная граница сурова и отдалена; гарнизон, у которого кончится еда или топливо, падёт так же верно, как и тот, что будет разгромлен."

 great_project_fortenorn_already_complete_tt: "Часть Чёрных фортов уже достигла максимального уровня в этом месте."
 reat_project_fortenorn_needs_holding_tt: "В этом [Comcept('province','графстве')|E] нет свободного [Concept('holding','владения')|E]. Участок Чёрных крепостей должен быть возведён вокруг чего-то, что уже стоит."

 gp_fortenorn_province: "Работы Чёрных фортов: укрепление"
 gp_fortenorn_province_desc: "Вложения в стены, земляные укрепления и осадные орудия Чёрных фортов. Каждый вклад усиливает гарнизон и усложняет штурм крепости."
 gp_fortenorn_county: "Работы Чёрных фортов: поддержка гарнизона"
 gp_fortenorn_county_desc: "Вложения в войска, стражи и линии снабжения, поддерживающие Чёрные форты. Каждый вклад увеличивает ополчение и расширяет логистический охват региона."

 great_project_fortenorn_upgrades_province: "По завершении: улучшает эту часть Чёрных фортов до следующего уровня или возводит новый форт там, где его не было."

 # Listikraxos Great Project
 LISTIKRAXOS_GLOSS: "Листикраксос (или Разбойничья крепость) — это название многочисленных крепостей, возведённых вокруг основных торговых путей и водных артерий Калатипсоми марочникскими дворянами, правившими губернаторством от имени [Concept('aversaria','Аверсарии')|E] после завоевания региона в ходе [Concept('marcher_aversarian_wars','Войн Марки и Аверсарии')|E]. Будучи формально побеждёнными, марочникские дворяне региона получили от своих новых аверсарианских владык дозволение продолжать править и даже извлекли немалую выгоду из истребительных кампаний легионов против местных племён и последующего роста аверсарианской торговли в крае. Правя как мелкие военачальники, различные дворяне становились разбойными баронами, взимая чудовищную пошлину с путешествующих купцов и местных жителей под угрозой аверсарианского возмездия в случае отказа."

 great_project_type_great_project_listikraxos: "Листикраксос"
 great_project_great_project_type_listikraxos: "Восстановление [Glossary('Листикраксосов','LISTIKRAXOS_GLOSS')]"
 great_project_type_listikraxos: "Восстановление [Glossary('Листикраксосов','LISTIKRAXOS_GLOSS')]"
 great_project_type_great_project_listikraxos_desc: "[Glossary('Листикраксосы','LISTIKRAXOS_GLOSS')] некогда контролировали все главные дороги и водные пути через [Glossary('Калатипсоми','kalathipsomi_encyclopedia_desc')], взимая пошлины и распространяя [Concept('marchers','марочникскую')|E] власть по всему региону. Большинство из них пришли в упадок. При достаточных ресурсах и организации лорд, владеющий одной из этих рушащихся крепостей, может восстановить её до обороноспособного состояния и, возможно, укрепить сильнее, чем когда-либо удавалось старым баронам."

 great_project_type_great_project_listikraxos_contribution_master_of_reconstruction: "Начальник восстановления"
 great_project_type_great_project_listikraxos_contribution_master_of_reconstruction_desc: "Должен быть назначен Начальник восстановления, дабы руководить проектом: обследовать структурные повреждения, организовать рабочие бригады и обеспечить своевременную доставку камня и древесины. Только владелец проекта может взять на себя эту роль."

 great_project_type_great_project_listikraxos_contribution_stonework: "Каменные работы"
 great_project_type_great_project_listikraxos_contribution_stonework_desc: "Разрушенные башни и обвалившиеся куртины должны быть перестроены из добротного тесаного камня. Бригады каменщиков и рабочих нуждаются в финансировании и доставке камня."

 great_project_type_great_project_listikraxos_contribution_fortification: "Укрепление"
 great_project_type_great_project_listikraxos_contribution_fortification_desc: "Помимо простой каменной кладки, крепость должна быть сделана обороноспособной за счёт усиленных воротных башен, новых платформ, бойниц и машикулей. Стена хороша настолько, насколько хороши те, кто за ней стоит."

 great_project_type_great_project_listikraxos_contribution_garrison_troops: "Гарнизонные войска"
 great_project_type_great_project_listikraxos_contribution_garrison_troops_desc: "Крепость без солдат — всего лишь руины с крышей. Постоянные гарнизонные войска должны быть набраны и обеспечены припасами, чтобы удерживать крепость и взимать пошлины."

 great_project_type_great_project_listikraxos_contribution_road_works: "Дорожные работы"
 great_project_type_great_project_listikraxos_contribution_road_works_desc: "[Glossary('Листикраксосы','LISTIKRAXOS_GLOSS')] черпали свою силу из контроля над дорогами. Восстановление застав, соединявших крепость с окружающей дорожной сетью, столь же важно, как и сами стены."

 great_project_listikraxos_already_complete_tt: "Этот [Glossary('Листикраксос','LISTIKRAXOS_GLOSS')] уже достиг максимального уровня."

 gp_listikraxos_province: "Работы Листикраксоса: восстановление"
 gp_listikraxos_province_desc: "Вложения в камень и укрепления Листикраксоса. Каждый вклад усложняет набеги на крепость и расширяет её гарнизон."
 gp_listikraxos_county: "Работы Листикраксоса: пошлинные дороги"
 gp_listikraxos_county_desc: "Вложения в гарнизон и дорожную сеть Листикраксоса. Каждый вклад увеличивает налоговые поступления, укрепляет местный контроль и способствует развитию."

 great_project_listikraxos_upgrades_province: "По завершении: восстанавливает этот Листикраксос до следующего уровня."

 # Glowmoss Illumination Project
 great_project_type_great_project_glowmoss_illumination: "Освещение светомошем"
 great_project_type_great_project_glowmoss_illumination_desc: "[Glossary('Майикратия','mayikprolollan_encyclopedia_desc')] темна и коварна. Выращивая колонии [Glossary('светомоша','GLOWMOSS_GLOSS')], правители могут превратить свои владения в нечто проходимое. Этот процесс требует больших вложений в туннели, орошение и тщательное садоводство. [Concept('magi','Маги')|E] могут ускорить и обогатить процесс, связав свет мха с чародейским пульсом, который переживёт любой факел."

 great_project_type_great_project_glowmoss_illumination_contribution_glowmoss_excavation: "Раскопки светомоша"
 great_project_type_great_project_glowmoss_illumination_contribution_glowmoss_excavation_desc: "Программа подготовки туннелей включает прокладку водных каналов для питания мха, выравнивание поверхностей для лучшего сцепления и создание сменной группы смотрителей мха для поддержания колонии. Это дорого и неблагодарно."

 great_project_type_great_project_glowmoss_illumination_contribution_glowmoss_arcane_infusion: "Чародейское наполнение"
 great_project_type_great_project_glowmoss_illumination_contribution_glowmoss_arcane_infusion_desc: "Искусный практик направляет магию непосредственно в возделанный мох, настраивая колонии на более плотный рост и более ровное свечение. Эффект длится десятилетиями."

 # Toast: project complete
 glowmoss_illumination_project_complete: "Освещение светомошем завершено"
 glowmoss_illumination_project_complete_desc: "Туннели [ROOT.Char.GetPrimaryTitle.GetFullBaseName] теперь светятся ровным биолюминесцентным светом. Цепочка построек «Туннели светомоша» теперь доступна, и сеть возделанного мха будет приносить долговременные выгоды для поколений."

 # Custom tooltip
 glowmoss_excavation_unlock_tooltip: "По завершении проекта открывает цепочку построек «Туннели светомоша» в целевом графстве, позволяя постоянное развитие его освещённых переходов."

 # The Grand Velostadd
 great_project_type_great_project_grand_velostadd: "Великий Велостадд"
 great_project_type_great_project_grand_velostadd_desc: "Велоизбранник призывает всех последователей Обряда Могилы Велоса воздвигнуть великий церемониальный храм в честь Велоса — средоточие веры, способное затмить даже старый Велостадд, и обещание, высеченное в камне, что Обряд здесь останется."

 great_project_type_great_project_grand_velostadd_contribution_velostadd_foundations: "Заложить Великие основания"
 great_project_type_great_project_grand_velostadd_contribution_velostadd_foundations_desc: "Собственное царство Велоизбранника должно понести расходы на основания, выломанные и перевезённые со всего Кланоземья."

 great_project_type_great_project_grand_velostadd_contribution_velostadd_sacred_carvings: "Заказать священные резные изображения"
 great_project_type_great_project_grand_velostadd_contribution_velostadd_sacred_carvings_desc: "Канон Обряда Могилы Велоса должен быть вырезан на стенах храма — любой из верных может финансировать резчиков."

 great_project_type_great_project_grand_velostadd_contribution_velostadd_pilgrim_offerings: "Собрать паломнические приношения"
 great_project_type_great_project_grand_velostadd_contribution_velostadd_pilgrim_offerings_desc: "Приношения верных украшают храм золотом и янтарём и освящают дарителя в очах Велоса."

 grand_velostadd_completed_toast: "Великий Велостадд завершён"
 fervor_gain_grand_velostadd: "Великий Велостадд завершён"