l_russian:
 ep3_contract_event.0001.desc_special_buildings_arcana: "Известно, что это место часто упоминается в эзотерике и трудах [Concept('magi','магов')|E]."
 ep3_contract_event.0001.desc_aervalr_shard: "«Осколок [Concept('aervalr','Эрвал')|E]! Говорят, он упал где-то в [task_contract_destination.GetTitle.GetNameNoTier], и [COncept('magi','маги')|E] и искатели приключений, без сомнения, уже роятся там. Я хочу увидеть его своими глазами, хотя, конечно, не слишком близко.»"
 ep3_contract_event.0001.desc_vounill: "«Говорят, что $TRAVEL_POINT_OF_INTEREST_TT_poi_vounil$ — это самое святое место на [Concept('aeras','Эрасе')|E], возвышающаяся фигура, которую почти каждая вера мира считает своим собственным богом.»"
 ep3_contract_event.0001.desc_towerwatch: "«Где можно лучше наблюдать величайшее чудо мира, [Concept('sea_tower', 'Морскую башню')|E], чем с $TRAVEL_POINT_OF_INTEREST_TT_poi_towerwatch$? Я слышал, что за подобающее пожертвование монахи позволяют посетителям наблюдать через их арканные телескопы.»"
 ep3_contract_event.0001.desc_abandoned_labyrinth: "«Я слышал шёпот о скрытом месте, спрятанном в глубоких горных расселинах [Concept('hyratan_biozone','Хайратана')|E] — я жажду узнать, какие чудеса оно может таить!»"
 ep3_contract_event.0001.desc_dragoncourt: "«Я слышал много рассказов о $TRAVEL_POINT_OF_INTEREST_TT_poi_dragoncourt$ и его красоте и хочу увидеть своими глазами его белые стены и величественные шпили!»"

 laamp_request_boilerplate_prowess_and_arcana_scheme: "Этот [Concept( 'task_contract', 'договор' )|E] требует от вас успешного завершения [Concept( 'scheme', 'происков' )|E] в сферах [Concept('prowess','доблести')|E] и [COncept('arcana','арканы')|E]"
 laamp_request_boilerplate_arcana_scheme: "Этот [Concept( 'task_contract', 'договор' )|E] требует от вас успешного завершения [Concept( 'scheme', 'происков' )|E] в сфере [Concept( 'arcana', 'аркана' )|E]"

