 gh_contract_event.9021.t: "Передовые разведчики"
 gh_contract_event.9021.desc.capitals: "Посланник от [task_contract_employer.GetName] приближается к нашему лагерю.\n\n«Приветствую, собрат-вождь. Нам многое неизвестно о землях [Concept('the_continent', 'Расколотого побережья')|E], и если вы готовы взяться за работу от [task_contract_employer.GetPrimaryTitle.GetNameNoTier], мой сюзерен щедро заплатит за любые сведения о том, что нас ждёт впереди».\n\nПереселенцы и беженцы наслышаны о том, что [task_contract_destination.GetCounty.GetTitle.GetHolder.GetPrimaryTitle.GetDefinitiveName] — великая и прекрасная столица, возможно, новый дом в этих чужих землях."
 gh_contract_event.9021.desc.grand_city: "Посланник от [task_contract_employer.GetName] приближается к нашему лагерю.\n\n«Приветствую, собрат-вождь. Нам многое неизвестно о землях [Concept('the_continent', 'Расколотого побережья')|E], и если вы готовы взяться за работу от [task_contract_employer.GetPrimaryTitle.GetNameNoTier], мой сюзерен щедро заплатит за любые сведения о том, что нас ждёт впереди».\n\nЯ хочу посетить великий город, какой бы ещё стоял в этих землях, и лучше понять, что когда-то делало эти земли такими могущественными."
 gh_contract_event.9021.a: "Пора отправляться в путь!"
 gh_contract_event.9021.tt: "Вы отправитесь во владение [task_contract_destination.GetName] и узнаете больше о его нынешних бедах."

