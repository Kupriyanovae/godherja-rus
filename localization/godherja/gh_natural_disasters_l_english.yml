 # Great project recovery names and descriptions
 great_project_type_gh_cavein: "Cave-in"
 great_project_type_gh_tornado: "Tornado"
 great_project_type_gh_hurricane: "Hurricane"
 great_project_type_gh_sulfur_storm: "Sulfur Storm"
 great_project_type_great_project_gh_cavein: "Cave-in Recovery"
 great_project_type_great_project_gh_cavein_desc: "A catastrophic collapse has buried tunnels, buildings, and people beneath unimaginable weight. Recovery requires shoring up unstable passages, and rebuilding what was lost."
 great_project_type_great_project_gh_tornado: "Tornado Recovery"
 great_project_type_great_project_gh_tornado_desc: "A great twisting wind has swept herds and camps across miles of open ground. Riders must be sent to find the living, and restock what was lost."
 great_project_type_great_project_gh_hurricane: "Hurricane Recovery"
 great_project_type_great_project_gh_hurricane_desc: "A violent ocean storm has battered the coast, wrecking harbours and flooding settlements. Ships, labour, and coin are needed to reach isolated communities and restore what was destroyed."
 great_project_type_great_project_gh_sulfur_storm: "Sulfur Storm Recovery"
 great_project_type_great_project_gh_sulfur_storm_desc: "Toxic fumes have poisoned the air and corroded the stone."

 # Contribution names
 great_project_type_gh_cavein_contribution_recovery: "Shore Up the Tunnels"
 great_project_type_gh_cavein_contribution_recovery_desc: "We must use whatever we can to reinforce collapsed passages and shore up unstable ceilings before further collapse claims more lives and county."
 great_project_type_gh_cavein_contribution_reconstruction: "Rebuild Communities"
 great_project_type_gh_cavein_contribution_reconstruction_desc: "Buried buildings and shattered irrigation must be dug out and rebuilt. A slow process in the dark."

 great_project_type_gh_tornado_contribution_recovery: "Search and Rescue"
 great_project_type_gh_tornado_contribution_recovery_desc: "The tornado has scattered survivors and livestock across miles of steppe. Riders must search for the living and gather what ever may be salvaged."
 great_project_type_gh_tornado_contribution_herd_restoration: "Herd Restocking"
 great_project_type_gh_tornado_contribution_herd_restoration_desc: "Some of our stock was lost to the storm, either being set loose from its destruction or carried farther than could be bared. We must send riders to purchase what we can, or take what we cannot."

 great_project_type_gh_hurricane_contribution_recovery: "Rescue the Coastal Settlements"
 great_project_type_gh_hurricane_contribution_recovery_desc: "The storm has battered the harbours and flooded the low-lying settlements. Ships and provisions are needed to reach isolated communities and begin recovery."
 great_project_type_gh_hurricane_contribution_reconstruction: "Rebuild the Harbours"
 great_project_type_gh_hurricane_contribution_reconstruction_desc: "Broken piers, sunken vessels, and shattered warehouses represent a fortune in lost trade capacity. A steward must oversee the reconstruction."

 great_project_type_gh_sulfur_storm_contribution_purification: "Purification"
 great_project_type_gh_sulfur_storm_contribution_purification_desc: "The yellow fumes linger in low-lying areas and infiltrate buildings. Fires must be lit, wells must be cleared, and the worst-affected structures aired out or torn down."
 great_project_type_gh_sulfur_storm_contribution_fortification_repair: "Fortification Repair"
 great_project_type_gh_sulfur_storm_contribution_fortification_repair_desc: "The storm's acid corrodes iron and crumbles mortar. Walls, gates, and towers all require inspection and repair before they fail at the worst possible moment."

 # Modifier names and descriptions
 gh_nd_cavein_1_county_modifier: "Cave-in Damage"
 gh_nd_cavein_1_county_modifier_desc: "A partial collapse has damaged tunnels and infrastructure throughout the county. Recovery is underway but will take time."
 gh_nd_cavein_2_county_modifier: "Severe Cave-in Damage"
 gh_nd_cavein_2_county_modifier_desc: "Significant sections of the caverns have been buried or blocked. The damage to infrastructure, holdings, and people is severe."
 gh_nd_cavein_3_county_modifier: "Catastrophic Cave-in"
 gh_nd_cavein_3_county_modifier_desc: "The underground county has suffered a near-total collapse. Great sections are buried beyond immediate recovery, and the loss of life is enormous."
 gh_nd_cavein_wasteland_habitability_modifier: "Cave-in Rubble"
 gh_nd_cavein_wasteland_habitability_modifier_desc: "Massive piles of rubble from the collapse have rendered parts of the underground unusable. Clearing them is a monumental project."
 gh_nd_tornado_1_county_modifier: "Tornado Damage"
 gh_nd_tornado_1_county_modifier_desc: "The tornado's edge clipped the county, overturning camps and scattering some livestock. The damage is real but contained."
 gh_nd_tornado_2_county_modifier: "Severe Tornado Damage"
 gh_nd_tornado_2_county_modifier_desc: "The tornado cut a wide swathe through the steppe. Camps are levelled, much of the herd is still unaccounted for, and the losses will be felt for years."
 gh_nd_tornado_3_county_modifier: "Catastrophic Tornado"
 gh_nd_tornado_3_county_modifier_desc: "The great twister devoured everything in its path. The county is devastated, its herds scattered to the winds, and the survivors are still being gathered."
 gh_nd_tornado_herd_damage_modifier: "Herd Scattered"
 gh_nd_tornado_herd_damage_modifier_desc: "A significant portion of the county's livestock was lost or set loose by the tornado. The herd has not yet been restored to its former strength."
 gh_nd_hurricane_1_county_modifier: "Hurricane Damage"
 gh_nd_hurricane_1_county_modifier_desc: "The storm's outer edge struck the coast. Some buildings have flooded and piers damaged, but the worst was avoided."
 gh_nd_hurricane_2_county_modifier: "Severe Hurricane Damage"
 gh_nd_hurricane_2_county_modifier_desc: "The hurricane struck hard. Everything has been turned to wreckage, but an end is in sight"
 gh_nd_hurricane_3_county_modifier: "Catastrophic Hurricane"
 gh_nd_hurricane_3_county_modifier_desc: "The storm came ashore with appalling violence, stripping settlements to their foundations."
 gh_nd_hurricane_fertility_county_modifier: "Post-Hurricane Soil Enrichment"
 gh_nd_hurricane_fertility_county_modifier_desc: "The storm deposited rich silt across the lowlands. Though the destruction was severe, the floodwaters have left the soil unusually fertile."
 gh_nd_sulfur_storm_1_county_modifier: "Sulfurous Fumes"
 gh_nd_sulfur_storm_1_county_modifier_desc: "The edge of the sulfur cloud passed over the county. The smell is pervasive, wells need boiling, and everyone's eyes water — but the worst missed us."
 gh_nd_sulfur_storm_2_county_modifier: "Severe Sulfur Storm Damage"
 gh_nd_sulfur_storm_2_county_modifier_desc: "Toxic fumes have settled over the county. The air burns the lungs."
 gh_nd_sulfur_storm_3_county_modifier: "Catastrophic Sulfur Storm"
 gh_nd_sulfur_storm_3_county_modifier_desc: "The full force of the sulfur storm descended on the county. The air is barely breathable, wells are poisoned, and the structural damage to fortifications and buildings is severe."
 gh_nd_sulfur_storm_wasteland_habitability_modifier: "Sulfurous Blight"
 gh_nd_sulfur_storm_wasteland_habitability_modifier_desc: "The sulfurous residue left by the storm has rendered parts of the county inhospitable. The toxic soil resists even the undead."
 gh_nd_sulfur_storm_stress_modifier: "Toxic Atmosphere"
 gh_nd_sulfur_storm_stress_modifier_desc: "Weeks of breathing toxic air have frayed nerves and clouded minds. Every breath is a reminder that something is deeply wrong."

 # Situation severity type labels
 natural_disaster_gh_cavein_severity_type: "Collapse Severity"
 natural_disaster_gh_tornado_severity_type: "Storm Intensity"
 natural_disaster_gh_hurricane_severity_type: "Storm Intensity"
 natural_disaster_gh_sulfur_storm_severity_type: "Toxicity Level"

 # Cave-in events
 gh_nd.1000.t: "Tremors in the Deep"
 gh_nd.1000.desc: "The deep stone is speaking. Rumbles have been felt throughout the underground holdings — not the familiar settling of ancient rock, but something urgent and wrong. The mine-masters are evacuating the lower tunnels. Whatever is coming, it will not be gentle."
 gh_nd.1000.a: "Reinforce the supports immediately."
 gh_nd.1000.a.tt: "A cave-in is imminent in the underground holdings."
 gh_nd.1001.t: "Cave-in!"
 gh_nd.1001.desc_severe: "The tunnels have given way in a catastrophic collapse. Great sections of the underground have been buried under unimaginable weight — holdings crushed, passages blocked, and the toll in lives is already enormous."
 gh_nd.1001.desc_moderate: "A significant cave-in has devastated part of the underground county. Tunnels are blocked, buildings buried, and rescue teams are still finding survivors among the rubble."
 gh_nd.1001.desc_minor: "A partial collapse has struck the underground county. The damage is serious but contained — most tunnels remain passable."
 gh_nd.1001.a: "Get the survivors out first."
 gh_nd.1010.t: "Clearing the Rubble"
 gh_nd.1010.desc: "The immediate crisis has passed, but the work of recovery has only just begun. Mountains of rubble must be moved, tunnels re-shored, and whatever was buried must be assessed. It will take years before the county returns to what it was."
 gh_nd.1010.a: "We will rebuild."

 # Tornado events
 gh_nd.2000.t: "The Green Sky"
 gh_nd.2000.desc: "The sky over the steppe has turned a sickly green. The nomad elders know this colour. The horses are already pulling at their tethers. There is perhaps a day, perhaps less, before the great twister arrives."
 gh_nd.2000.a: "Move the herds to lower ground."
 gh_nd.2000.a.tt: "A tornado approaches the steppe. The herd and the camp are at risk."
 gh_nd.2001.t: "The Twisting Wind"
 gh_nd.2001.desc_severe: "The great twister came down like the finger of an angry god. It walked the steppe for hours, devouring everything in its path — camps, herds, livestock, and lives."
 gh_nd.2001.desc_moderate: "The tornado cut a wide swathe through the steppe, scattering herds and levelling camp-sites. The loss of livestock alone will be felt for years."
 gh_nd.2001.desc_minor: "The twisting wind passed close but spared the worst of its fury. The fringes of the county took damage — camps overturned, some herd scattered — but the core survived."
 gh_nd.2001.a: "Round up the survivors and count the herd."
 gh_nd.2010.t: "After the Storm"
 gh_nd.2010.desc: "The tornado is gone, but its memory will haunt the steppe for a generation. The dead are buried, the lost herds partially recovered, and the broken camps are being re-pitched."
 gh_nd.2010.a: "The steppe endures."

 # Hurricane events
 gh_nd.3000.t: "The Sea Turns Black"
 gh_nd.3000.desc: "The sea has turned the colour of old iron and the birds have fled inland by the thousands. The harbourmasters are already ordering ships into shelter. Whatever is coming, it comes from the deep water."
 gh_nd.3000.a: "Secure the harbour and prepare the shutters."
 gh_nd.3000.a.tt: "A hurricane approaches. The coastal settlements are at grave risk."
 gh_nd.3001.t: "The Great Storm Makes Landfall"
 gh_nd.3001.desc_severe: "The hurricane came ashore with appalling violence. It stripped buildings to their foundations, drove the sea a mile inland, and drowned everything in its path in a wall of churning water."
 gh_nd.3001.desc_moderate: "The storm struck hard. The harbours are wrecked, the lower streets of the coastal towns are still under water, and the fishing fleet has been decimated."
 gh_nd.3001.desc_minor: "The hurricane's outer edge swept the coast. The harbours are damaged, some buildings have flooded, but the worst missed us."
 gh_nd.3001.a: "Begin rescue operations at once."
 gh_nd.3010.t: "The Storm Has Passed"
 gh_nd.3010.desc: "The hurricane has exhausted itself. In its wake, it leaves destruction but also, strangely, the promise of renewal. The sea has deposited rich silt across the lowlands."
 gh_nd.3010.a: "We survived. Now we rebuild."

 # Sulfur storm events
 gh_nd.4000.t: "Yellow Sky from the North"
 gh_nd.4000.desc: "A foul yellow haze has begun drifting south from the Lichdoms. It carries with it the reek of sulfur and something worse — a deep wrongness that makes the eyes water and the lungs burn. The storm will worsen before it passes."
 gh_nd.4000.a: "Seal the wells and stock up on water."
 gh_nd.4000.a.tt: "A sulfur storm is approaching from the Lichdoms. Human-inhabited counties will suffer fume sickness and structural damage."
 gh_nd.4001.t: "The Storm of Yellow Death"
 gh_nd.4001.desc_severe: "The sulfur storm descended in its full, choking fury. The air turned the colour of old bruises, and every breath burns. Buildings are already showing signs of corrosion — mortar crumbling, iron fittings eaten away."
 gh_nd.4001.desc_moderate: "The sulfurous fumes have settled over the county like a foul blanket. Wells must be boiled before drinking, the air irritates the lungs, and everyone's nerves are frayed from days of the burning smell."
 gh_nd.4001.desc_minor: "The fringes of the sulfur storm have passed over the county. The smell is pervasive and the fumes mildly toxic, but the worst of it missed us."
 gh_nd.4001.a: "Issue the sickness protocols."
 gh_nd.4010.t: "The Fumes Lift"
 gh_nd.4010.desc: "The sulfurous clouds have dissipated, leaving behind corroded buildings, poisoned wells, and a population whose nerves were already frayed by weeks of toxic air. The Fortenorns are already reporting significant damage to their ironwork."
 gh_nd.4010.a: "Begin the purification."

