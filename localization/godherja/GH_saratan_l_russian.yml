 baron_male_tiemanam:0 "Келекван"
 baron_female_tiemanam:0 "Келекван"

 county_tiemanam:0 "Гозарто"
 count_male_tiemanam:0 "Находа"
 count_female_tiemanam:0 "Находа"

 duchy_tiemanam:0 "Нахра"
 duke_male_tiemanam:0 "Гугал"
 duke_female_tiemanam:0 "Гугал"

 kingdom_tiemanam:0 "Яммо"
 king_male_tiemanam:0 "Малка"
 king_female_tiemanam:0 "Малкта"

 empire_tiemanam:0 "Тамту"
 emperor_male_tiemanam:0 "Шар Кишшати"
 emperor_female_tiemanam:0 "Шаррат Кишшати"

 hegemony_tiemanam:0 "Апсу"
 hegemon_male_tiemanam:0 "Бел-Апси"
 hegemon_female_tiemanam:0 "Белет-Апси"

 ##################################################
 # Shellworks - the Saratarat quarry
 ##################################################
 building_type_saratan_shellworks_01:0 "Ракушечные мастерские"
 building_type_saratan_shellworks_01_desc:0 "Саратан несёт много на своей спине. Черепахи по поверхности, моллюски и ракушки, накопленные в складках, койр, вымоченный из скорлуп, что смываются в них."

 building_saratan_shellworks_01:0 "Сборщики ракушек"
 building_saratan_shellworks_01_desc:0 "Дюжина рук на линях вдоль борта между переправами, отдирающих ракушки от гребней и сгребающих складки в поисках моллюсков. Поднимается достаточно, чтобы деревня была с инструментами и осталось немного на обмен."
 building_saratan_shellworks_02:0 "Ямы для вымачивания"
 building_saratan_shellworks_02_desc:0 "Скорлупы вымачиваются, пока волокно не отойдёт, затем их выбивают и скручивают в шнур. Койровая верёвка — то, что держит келек вместе, и стая, что делает свою, перестаёт за неё платить."
 building_saratan_shellworks_03:0 "Дворы для туш"
 building_saratan_shellworks_03_desc:0 "Когда мёртвый [Glossary('саратан','GH_SARATAN_GLOSS')] в пределах досягаемости, работа полностью меняется: не нужно умилостивлять борт, не нужно пережидать сезон. Затвердевший панцирь снимается толстым слоем и идёт прямо на корпуса и щиты."
 building_saratan_shellworks_04:0 "Ракушечные мастерские"
 building_saratan_shellworks_04_desc:0 "Целая индустрия, стоящая в гниющем корпусе: пильные ямы, чаны для вымачивания, ракушки, сложенные до уровня шпангоута и отсортированные по изгибу. Всё, что строит стая, обходится ей дешевле, и всё, что она защищает, становится прочнее."

 ##################################################
 saratan_families_paid_modifier:0 "Семьям заплатили"
 saratan_families_paid_modifier_desc:0 "Вы заплатили за мёртвых из своих рук, на глазах у всех, и не стали ждать, пока попросят. Это помнят дольше, чем имена."

 ##################################################
 # Aftermath - which job it was
 ##################################################
 saratan_work_opener_sounding:0 "Маги поднялись с линий четыре дня назад и с тех пор не перестают писать.\n\n"
 saratan_work_opener_scouring:0 "Обчистка завершена, борт гол, и вся стая пахнет варёным моссулом.\n\n"
 saratan_work_opener_salvage:0 "Спасательные команды вернулись с туши, и они подняли больше, чем панцирь.\n\n"
 saratan_work_opener_generic:0 "Работа закончена.\n\n"

 saratan.0001.t:0 "Больше, чем они шли за"
 saratan.0001.desc:0 "[saratan_diver.GetTitledFirstName] пришёл прямо ко мне, чего никто не делает, и не хотел говорить, почему, пока мы не вышли из зала. Их улов был так велик, что здесь достаточно, чтобы заплатить каждой команде дважды и ещё что-то отложить.\n\nЧто поднимает вопрос, собираюсь ли я это делать."
 saratan.0001.a:0 "Заплатить им честно за это"
 saratan.0001.b:0 "Забрать всё в хранилища"

 saratan.0002.t:0 "Море берёт свою долю"
 saratan.0002.desc:0 "[saratan_lost.GetTitledFirstName] не вернётся, и остальные тоже.\n\nНикто не уверен, что случилось. Линь ослаб, потом стал тяжёлым, и тогда люди, тянувшие его, решили не смотреть. По крайней мере, на этой версии все сошлись.\n\nИх семьи спросят меня, что это было: работа или море."
 saratan.0002.a:0 "Их имена навсегда останутся на наших корпусах"
 saratan.0002.b:0 "Сказать, что это было море, а не работа"

 saratan.0003.t:0 "Нечто из складки"
 saratan.0003.desc:0 "Оно поднялось в сети, и сеть разрезали, а не опустошили, что говорит мне, что о нём подумала команда.\n\nРакушка не того цвета, что режет эта стая, и соединения сделаны кем-то, кто понимал материал лучше, чем мой лучший резчик. И оно тёплое, чем ничто из той глубины не имеет никакого права быть.\n\nЖрецы хотят его. Команда хочет, чтобы его не стало. Мой казначей уже подсчитал, сколько оно стоит."
 saratan.0003.a:0 "Оставить. Ничего не говорить."
 saratan.0003.b:0 "Отдать жрецам, пусть решают"
 saratan.0003.c:0 "Вернуть обратно"

 saratan_deep_find_modifier:0 "Нечто из складки"
 saratan_deep_find_modifier_desc:0 "Обработанная ракушка, неправильные цвета, тёплая на ощупь, и никто не скажет, где она хранится."

 ##################################################
 # Where the herd is - prepended to every aftermath event
 ##################################################
 saratan_phase_line_feeding:0 "Отмели полны корма, и келеки стоят вплотную.\n\n"
 saratan_phase_line_running:0 "Стадо поднялось и идёт, и всё на его спине держится.\n\n"
 saratan_phase_line_sinking:0 "Стадо ушло на глубину и голодает, вода поднимается через полы, и внешние деревни оставлены на сезон.\n\n"
 saratan_phase_line_generic:0 "Стадо там, где оно есть, и это всё, что кто-либо может сказать.\n\n"

 ##################################################
 # Modifiers from the aftermath events
 ##################################################
 saratan_full_holds_modifier:0 "Полные трюмы"
 saratan_full_holds_modifier_desc:0 "Ракушки, шнур и солёный моссул сложены до потолочных балок. Это не монеты, но здесь это покупает надёжнее, чем монеты."
 saratan_lie_took_modifier:0 "История, которая прижилась"
 saratan_lie_took_modifier_desc:0 "Это было море, а не работа. Все согласились, никто не спорил, и никто с тех пор на тебя толком не смотрел. Келек ведёт свой собственный счёт таким вещам."
 saratan_put_it_back_modifier:0 "Возвращено"
 saratan_put_it_back_modifier_desc:0 "Оно было у тебя в руках, и ты отдал приказ бросить его. Команда рассказывает это как благочестие. Один или двое рассказывают это как страх, и именно им люди верят."
