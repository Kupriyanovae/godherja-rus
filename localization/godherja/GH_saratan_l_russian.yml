l_russian:

 # Decision group
 decision_group_type_saratan: "Решения саратанов"

 ##################################################
 # Sound the Deeps
 ##################################################
 saratan_sound_the_deeps_decision:0 "Вслушаться в глубины"
 saratan_sound_the_deeps_decision_desc:0 "Никто не управляет [Glossary('cаратаном','GH_SARATAN_GLOSS')]. Всё, что можно сделать, — это узнать, куда он решил идти.\n\nСлушают на утяжелённых линях в воде, что раздавит обычного ныряльщика. Сердцебиение — глубокое и полное, и медленный спор течений вокруг него. Мой [Concept('court_magi','придворный маг')|E] расскажет мне, что он делает, а остальное я [Select_CString(ROOT.Char.IsFemale, 'должена', 'должен' )] должен понять сам."
 saratan_sound_the_deeps_decision_tooltip:0 "Отправить вашего [Concept('court_magi','придворный маг')|E] вниз читать течения"
 saratan_sound_the_deeps_decision_confirm:0 "Отправить их вниз"
 saratan_sound_the_deeps_requires_magi_tt:0 "Требуется [Concept('court_magi','придворный маг')|E] в вашем совете"
 saratan_deep_sounded_modifier:0 "Глубины прослушаны"
 saratan_deep_sounded_modifier_desc:0 "Ваши маги знают, что делает стадо, прежде чем оно это сделает. Переправы не таят в себе никаких неожиданностей, достойных упоминания."

 ##################################################
 # Scour the Saratan
 ##################################################
 saratan_scour_the_saratan_decision:0 "Обчистить саратана"
 saratan_scour_the_saratan_decision_desc:0 "Борт живого [Glossary('саратана','GH_SARATAN_GLOSS')] — это целая страна. Ракушки шириной со щит, моссул, свисающий целыми пластами, а в глубоких складках лежат безымянные твари, которые хороши в еде, если варить их достаточно долго.\n\nТак что вся стая отправляется за борт. Каждая верёвка в деревне, каждая лодка, каждый, кто достаточно стар, чтобы держать крюк, свешиваются по борту на линях и срезают урожай."
 saratan_scour_the_saratan_decision_tooltip:0 "Отправить всю стаю за борт, чтобы срезать урожай"
 saratan_scour_the_saratan_decision_confirm:0 "За борт"
 saratan_scoured_modifier:0 "Обчистка"
 saratan_scoured_modifier_desc:0 "Ракушки срезаны с борта и засолены. Трюмы полны, и торговля идёт хорошо."
 saratan_hull_scoured_modifier:0 "Борт обчищен"
 saratan_hull_scoured_modifier_desc:0 "Нарост снят, глубокие складки очищены, и саратан сидит выше, чем за целое поколение."

 ##################################################
 # Strip the Carcass
 ##################################################
 saratan_salvage_the_dead_decision:0 "Разделать тушу"
 saratan_salvage_the_dead_decision_desc:0 "[Glossary('Саратан','GH_SARATAN_GLOSS')] мёртв со времён [Concept('frodbrokna','Фродброкны')|E], и он ещё не закончил приносить пользу. Там есть кости длиной в зал, масло, которое не портится, и панцирные пластины, что держат заточку лучше некоторых металлов.\n\nТам также есть люди, которые всё ещё живут на нём, у которых твёрдое мнение о спасательных командах, и старшие прямо скажут мне, что эта тварь не так мертва, как говорят жрецы."
 saratan_salvage_the_dead_decision_tooltip:0 "Отправить спасательные команды на мёртвого саратана"
 saratan_salvage_the_dead_decision_confirm:0 "Отправить команды"
 saratan_salvage_the_dead_requires_carcass_tt:0 "Требуется #N мёртвый саратан#! в вашем государстве или достижимый через переправу"

 ##################################################
 saratan_paid_fairly_opinion:0 "Заплатили мне честно"

 ##################################################
 # Government
 ##################################################
 saratarat_government:0 "Карум"
 saratarat_government_with_icon:0 "@government_type_karum! $saratarat_government$"
 saratarat_government_adjective:0 "Карумск"
 saratarat_government_realm:0 "Стая"
 saratarat_government_realm_plural:0 "Стаи"
 saratarat_government_obligations:0 "$tribal_government_obligations$"
 saratarat_government_desc:0 "\n$game_concept_tribal_desc$\n\n#F Карум — это плавающий город. Его правители не владеют собственной землёй: они торгуют, совершают набеги и запасаются на спине движущегося зверя и идут туда, куда идёт он. Ничто из того, чем они владеют, не построено так, чтобы оставаться на месте, и они считают это единственным честным способом жить на воде, которая тоже не остаётся на месте.#!"

 ##################################################
 # Dead Saratan
 ##################################################
 dead_saratan_modifier:0 "Остов саратана"
 dead_saratan_modifier_desc:0 "Это существо погибло во время [Concept('frodbrokna','Фродброкны')|E] и было достаточно большим, чтобы сесть на мель, а не уйти под волны. Его туша всё ещё несёт несколько разбросанных хижин, но его жизненная сила давно угасла."
 habitability_dead_saratan_desc:0 "Мёртвый саратан"

 ##################################################
 # Situation
 ##################################################
 the_saratan:0 "Саратан"
 the_saratan_desc:0 "Великие [Glossary('саратаны','GH_SARATAN_GLOSS')] идут по Кратемезину по кругу, и города на их спинах следуют за ними в богатые отмели, где кишат келеки и сети поднимаются полными, или в глубокие воды, где корпуса уходят под воду, а деревни брошены или затоплены.."

 saratan_shallows:0 "Отмели"
 saratan_rim:0 "Край кратера"
 saratan_deep_run:0 "Глубокий ход"
 saratan_boneyard:0 "Могильники"

 # Phases
 situation_saratan_sounding:0 "Зондирование"
 situation_saratan_sounding_desc:0 "[Glossary('Саратан','GH_SARATAN_GLOSS')] на отмелях, кормится. Келеки переполнены, и каждый из них строит что-то, что не сможет закончить."
 situation_saratan_breaching:0 "Всплытие"
 situation_saratan_breaching_desc:0 "[Glossary('Саратаны','GH_SARATAN_GLOSS')] поднимаются и идут. Переправы, что занимали неделю, занимают день, и ничто, построенное в этом сезоне, не стоит ровно."
 situation_saratan_sinking:0 "Погружение"
 situation_saratan_sinking_desc:0 "Стадо уходит на глубину и голодает. Вода поднимается через полы, и внешние деревни оставлены."

 # Participant groups
 saratarat_rulers_capital:0 "Держатели Стаи"
 saratarat_rulers_realm:0 "Присягнувшие Стае"
 saratan_settled:0 "Поселенцы-келеки"
 saratan_wasteland:0 "Утонувшие"

 # Phase modifier sets
 saratan_swelling_effects:0 "Подъём"
 saratan_sinking_effects:0 "Погружение"

 ##################################################
 # Window
 ##################################################
 SARATAN_CURRENT_PHASE_HEADER:0 "Где Стая"
 SARATAN_ACTIONS_HEADER:0 "Что можно сделать"
 SARATAN_PARTICIPANT_HEADER:0 "Ваше положение"

