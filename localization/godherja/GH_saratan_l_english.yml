l_english:

 # Decision group
 decision_group_type_saratan: "Saratan Decisions"

 ##################################################
 # Sound the Deeps
 ##################################################
 saratan_sound_the_deeps_decision:0 "Sound the Deeps"
 saratan_sound_the_deeps_decision_desc:0 "Nobody steers a [Glossary('Saratan','GH_SARATAN_GLOSS')]. The most anyone can do is know which way it has decided to go.\n\nListening is done on weighted lines in water that crushes an ordinary diver. A heartbeat deep and full, and the slow argument of currents around it. My [court_magi|E] will tell me what it is doing, and I am expected to work out the rest myself."
 saratan_sound_the_deeps_decision_tooltip:0 "Send your [court_magi|E] down to read the currents"
 saratan_sound_the_deeps_decision_confirm:0 "Send them down"
 saratan_sound_the_deeps_requires_magi_tt:0 "Requires a [court_magi|E] on your council"
 saratan_deep_sounded_modifier:0 "The Deeps Sounded"
 saratan_deep_sounded_modifier_desc:0 "Your Magi know what the herd is doing before it does. The crossings hold no surprises worth the name."

 ##################################################
 # Scour the Saratan
 ##################################################
 saratan_scour_the_saratan_decision:0 "Scour the Saratan"
 saratan_scour_the_saratan_decision_desc:0 "The flank of a living [Glossary('Saratan','GH_SARATAN_GLOSS')] is its own country. Shellfish the width of a shield, mossul hanging off in sheets, and in deep folds there lie things with no name that are good eating once boiled long enough.\n\nSo the whole shoal goes over the side. Every rope in the village, every boat, everyone old enough to hold a hook, hangs down the flank on lines and cuts the harvest free."
 saratan_scour_the_saratan_decision_tooltip:0 "Put the whole shoal over the side to cut the harvest free"
 saratan_scour_the_saratan_decision_confirm:0 "Over the side"
 saratan_scoured_modifier:0 "The Scouring"
 saratan_scoured_modifier_desc:0 "Shellfish cut off the flank and salted down. The holds are full and the trade is good."
 saratan_hull_scoured_modifier:0 "Flank Scoured"
 saratan_hull_scoured_modifier_desc:0 "The growth is off, the deep folds are clear, and the saratan rides higher than it has in a generation."

 ##################################################
 # Strip the Carcass
 ##################################################
 saratan_salvage_the_dead_decision:0 "Strip the Carcass"
 saratan_salvage_the_dead_decision_desc:0 "A [Glossary('Saratan','GH_SARATAN_GLOSS')] dead since [Concept('frodbrokna','Frodbrokna')|E] and it has not finished being useful.There is bone in there the length of a hall, oil that does not spoil, and plate-shell that takes an edge better than some metals.\n\nThere are also the people who still live on it, who have firm opinions about salvage crews, and the older ones will tell me plainly that the thing is not as dead as the priests say."
 saratan_salvage_the_dead_decision_tooltip:0 "Send salvage crews onto a dead saratan"
 saratan_salvage_the_dead_decision_confirm:0 "Send the crews"
 saratan_salvage_the_dead_requires_carcass_tt:0 "Requires a #N Dead Saratan#! in your realm, or one reachable across a crossing"

 ##################################################
 saratan_paid_fairly_opinion:0 "Paid Me Properly"

 ##################################################
 # Government
 ##################################################
 saratarat_government:0 "Kārum"
 saratarat_government_with_icon:0 "@government_type_karum! $saratarat_government$"
 saratarat_government_adjective:0 "Kārum"
 saratarat_government_realm:0 "Shoal"
 saratarat_government_realm_plural:0 "Shoals"
 saratarat_government_obligations:0 "$tribal_government_obligations$"
 saratarat_government_desc:0 "\n$game_concept_tribal_desc$\n\n#F A Kārum is a town that swims. Its rulers hold no ground of their own: they barter, raid and provision off the back of a moving beast, and go where it goes. Nothing they own is built to stay where it was put, and they consider that the only honest way to live on water that will not stay where it was put either.#!"

 ##################################################
 # Dead Saratan
 ##################################################
 dead_saratan_modifier:0 "Saratan Husk"
 dead_saratan_modifier_desc:0 "This creature died in [Concept('frodbrokna','Frodbrokna')|E] and was large enough to ground rather than sink beneath the waves. Its carcass still carries a few scattered huts, but its vitality is long gone."
 habitability_dead_saratan_desc:0 "Dead Saratan"

 ##################################################
 # Situation
 ##################################################
 the_saratan:0 "The Saratan"
 the_saratan_desc:0 "The great [Glossary('Saratans','GH_SARATAN_GLOSS')] run the Kratemezin on a circuit, and the towns on their backs go with them into rich shallows where the keleks crowd and nets come up full, or out into deep water where the hulls go under and the villages are abandoned or drowned.."

 saratan_shallows:0 "The Shallows"
 saratan_rim:0 "The Crater Rim"
 saratan_deep_run:0 "The Deep Run"
 saratan_boneyard:0 "The Graves"

 # Phases
 situation_saratan_sounding:0 "The Sounding"
 situation_saratan_sounding_desc:0 "[Glossary('Saratan','GH_SARATAN_GLOSS')] in the shallows, feeding. The keleks are crowded, and every one of them is building something it will not be able to finish."
 situation_saratan_breaching:0 "The Breaching"
 situation_saratan_breaching_desc:0 "The [Glossary('saratans','GH_SARATAN_GLOSS')] rise and run. Crossings that took a week take a day, and nothing built this season sits level."
 situation_saratan_sinking:0 "The Sinking"
 situation_saratan_sinking_desc:0 "The herd goes deep and hungry. Water comes up through the floors, and outer villages are given up."

 # Participant groups
 saratarat_rulers_capital:0 "Shoal-Holders"
 saratarat_rulers_realm:0 "Shoal-Sworn"
 saratan_settled:0 "Kelek-Settlers"
 saratan_wasteland:0 "The Drowned"

 # Phase modifier sets
 saratan_swelling_effects:0 "Swelling"
 saratan_sinking_effects:0 "Sinking"

