 kingdom_tiemanam:0 "Yammo"
 king_male_tiemanam:0 "Malka"
 king_female_tiemanam:0 "Malkta"

 empire_tiemanam:0 "Tâmtu"
 emperor_male_tiemanam:0 "Šar Kiššati"
 emperor_female_tiemanam:0 "Šarrat Kiššati"

