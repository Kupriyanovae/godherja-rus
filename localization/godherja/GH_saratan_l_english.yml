 hegemon_male_tiemanam:0 "Bēl-Apsî"
 hegemon_female_tiemanam:0 "Bēlet-Apsî"

 ##################################################
 # Shellworks - the Saratarat quarry
 ##################################################
 building_type_saratan_shellworks_01:0 "Shellworks"
 building_type_saratan_shellworks_01_desc:0 "A saratan carries much on its back. Turtles along the surface, mollusc and seashell banked in the folds, coir retted out of the husks that wash into them."

 building_saratan_shellworks_01:0 "Shell-Gatherers"
 building_saratan_shellworks_01_desc:0 "A dozen hands on lines down the flank between crossings, prying shell off ridges and raking folds for mollusc. Enough comes up to keep the village in tools and leave a little to barter."
 building_saratan_shellworks_02:0 "Retting Pits"
 building_saratan_shellworks_02_desc:0 "Husks soaked until the fibre lets go, then beaten out and laid into cord. Coir rope is what holds a kelek together, and a shoal that makes its own stops paying for it."
 building_saratan_shellworks_03:0 "Carcass Yards"
 building_saratan_shellworks_03_desc:0 "With a dead [Glossary('saratan','GH_SARATAN_GLOSS')] in reach the work changes entirely: no flank to appease, no season to wait out. Hardened shell comes off thick and goes straight onto hulls and shields."
 building_saratan_shellworks_04:0 "The Shellworks"
 building_saratan_shellworks_04_desc:0 "A whole industry standing in a rotting hull: saw-pits, retting tanks, shell stacked to the ribline and sorted by curve. Everything the shoal builds is cheaper for it, and everything it defends is harder."

 ##################################################
 saratan_families_paid_modifier:0 "The Families Were Paid"
 saratan_families_paid_modifier_desc:0 "You paid for the dead out of your own hand, in front of everyone, and did not wait to be asked. That is remembered longer than the names are."

 ##################################################
 # Aftermath - which job it was
 ##################################################
 saratan_work_opener_sounding:0 "The magi came up off the lines four days ago and have not stopped writing since.\n\n"
 saratan_work_opener_scouring:0 "The scouring is done, the flank is bare, and the whole shoal smells of boiled mossul.\n\n"
 saratan_work_opener_salvage:0 "The salvage crews are back off the carcass, and they brought up more than shell.\n\n"
 saratan_work_opener_generic:0 "The work is finished.\n\n"

 saratan.0001.t:0 "More Than They Went For"
 saratan.0001.desc:0 "[saratan_diver.GetTitledFirstName] came to me directly, which nobody does, and would not say why until we were outside the hall. Their haul was so large that here is enough here to pay every crew twice over and still put something by.\n\nWhich raises the question of whether I am going to."
 saratan.0001.a:0 "Pay them properly for it"
 saratan.0001.b:0 "Take the lot into the stores"

 saratan.0002.t:0 "The Sea Takes Its Portion"
 saratan.0002.desc:0 "[saratan_lost.GetTitledFirstName] is not coming back, and neither are the others.\n\nNobody is certain what happened. The line went slack, then heavy, and then the people hauling it decided not to look. That is the version everyone has settled on, at least.\n\nTheir families will ask me which it was: the work, or the sea."
 saratan.0002.a:0 "Their names go on our hulls for all time"
 saratan.0002.b:0 "Say it was the sea, not the work"

 saratan.0003.t:0 "Something Out Of The Fold"
 saratan.0003.desc:0 "It came up in a net, and the net was cut rather than emptied, which tells me what the crew made of it.\n\nThe shell is the wrong color for anything this shoal cuts, and the joins were made by someone who understood the material better than my best cutter does. It is also warm, which nothing out of that depth has any business being.\n\nThe priests want it. The crew want it gone. My treasurer has already worked out what it is worth."
 saratan.0003.a:0 "Keep it. Say nothing."
 saratan.0003.b:0 "Give it to the priests and let them decide"
 saratan.0003.c:0 "Put it back"

 saratan_deep_find_modifier:0 "The Thing From The Fold"
 saratan_deep_find_modifier_desc:0 "Worked shell, wrong colors, warm to the touch, and nobody will say where it is kept."

 ##################################################
 # Where the herd is - prepended to every aftermath event
 ##################################################
 saratan_phase_line_feeding:0 "The shallows are thick with feed and the keleks are standing room only.\n\n"
 saratan_phase_line_running:0 "The herd is up and running, and everything on its back is holding on.\n\n"
 saratan_phase_line_sinking:0 "The herd is deep and hungry, water is coming up through the floors, and the outer villages have been given up for the season.\n\n"
 saratan_phase_line_generic:0 "The herd is where it is, which is as much as anyone can say.\n\n"

 ##################################################
 # Modifiers from the aftermath events
 ##################################################
 saratan_full_holds_modifier:0 "Full Holds"
 saratan_full_holds_modifier_desc:0 "Shell, cord and salted mossul stacked to the roofpoles. It is not coin, but out here it buys more reliably than coin does."
 saratan_lie_took_modifier:0 "The Story That Held"
 saratan_lie_took_modifier_desc:0 "It was the sea, not the work. Everyone agreed, nobody argued, and nobody has quite looked at you since. The kelek keeps its own account of these things."
 saratan_put_it_back_modifier:0 "Put Back"
 saratan_put_it_back_modifier_desc:0 "You had it in your hands and you gave the order to drop it. The crew tell it as piety. One or two of them tell it as fear, and those are the ones people believe."
