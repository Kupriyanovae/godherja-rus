 rule_gedeora_frequency: "@godherja_logo! [gedeora|E]: частота"
 setting_gedeora_frequency_rare: "#high Редко#!"
 setting_gedeora_frequency_rare_desc: "[gedeora|E] будет происходить крайне редко — примерно раз в 20 лет."
 setting_gedeora_frequency_default: "По умолчанию"
 setting_gedeora_frequency_default_desc: "[gedeora|E] будет случайным образом сотрясать мир, выказывая разнообразные непредсказуемые эффекты приблизительно раз в пять лет."
 setting_gedeora_frequency_common: "#high Часто#!"
 setting_gedeora_frequency_common_desc: "[gedeora|E] будет регулярно появляться примерно каждые два года."
 setting_gedeora_frequency_extreme: "#high Экстремально#!"
 setting_gedeora_frequency_extreme_desc: "[gedeora|E] будет обрушиваться каждый год."
 setting_gedeora_frequency_armageddon: "#N Армагеддон#!"
 setting_gedeora_frequency_armageddon_desc: "[gedeora|E] будет обрушиваться минимум дважды в год и может постоянно бить по одному и тому же месту и персонажу. Кошмар [Concept('aersanon','Сновидца')|E] поглотит всё!"
 setting_gedeora_frequency_disabled: "#high Выключено#!"
 setting_gedeora_frequency_disabled_desc: "[gedeora|E] не будет появляться."

 rule_gedeora_severity: "@godherja_logo! [gedeora|E]: сила"
 setting_gedeora_severity_hiccups: "#high Слабость#!"
 setting_gedeora_severity_hiccups_desc: "Шанс того, что [gedeora|E] затронет больше чем пара [Concept('counties','графств')|E], крайне мал."
 setting_gedeora_severity_default: "По умолчанию"
 setting_gedeora_severity_default_desc: "[gedeora|E] будет иметь свою задуманную силу."
 setting_gedeora_severity_dangerous: "#high Опасно#!"
 setting_gedeora_severity_dangerous_desc: "Вдвое снижен шанс того, что [gedeora|E] окажется малого или среднего размера."
 setting_gedeora_severity_severe: "#high Тяжело#!"
 setting_gedeora_severity_severe_desc: "Шансы возникновения [gedeora|E] разного масштаба инвертированы."
 setting_gedeora_severity_ridiculous: "#high Безумие#!"
 setting_gedeora_severity_ridiculous_desc: "Практически каждая [gedeora|E] станет событием мирового масштаба."

 rule_archlich_invasion: "@godherja_logo! Вторжение [Concept('arch_lich','архилича')|E]"
 setting_default_arch_lich: "По умолчанию"
 setting_default_arch_lich_desc:0 "[arch_lich|E] изредка будет появляться в [the_lichdoms|E] где-то между XIV и XV веками."
 setting_no_arch_lich: "#high Никогда#!"
 setting_no_arch_lich_desc: "[arch_lich|E] не совершит вторжения."
 setting_random_arch_lich: "#high Случайно#!"
 setting_random_arch_lich_desc: "[arch_lich|E] вторгнется в случайную дату."
 setting_chance_of_arch_lich: "#high Шанс смерти#!"
 setting_chance_of_arch_lich_desc: "[arch_lich|E] вторгнется лишь с вероятностью в 2/3."

 rule_fogeater_invasion: "@godherja_logo! Вторжение [Concept('fogeaters','пожирателей тумана')|E]"
 setting_default_fogeater_invasion: "По умолчанию"
 setting_default_fogeater_invasion_desc: "[fogeaters|E] вторгнутся в конце XIV века."
 setting_never_fogeater_invasion:1 "#high Никогда#!"
 setting_never_fogeater_invasion_desc: "[fogeaters|E] не совершат вторжения."
 setting_random_fogeater_invasion:1 "#high Случайно#!"
 setting_random_fogeater_invasion_desc: "[fogeaters|E] вторгнутся в случайную дату."

 rule_fogeater_spawn:90 "@godherja_logo! Направление вторжения [Concept('fogeaters','пожирателей тумана')|E]"
 setting_default_fogeater_spawn_location:90 "По умолчанию"
 setting_default_fogeater_spawn_location_desc:90 "[fogeaters|E] вторгнутся со случайного направления."
 setting_kalath_fogeater_spawn_location:90 "#high Серые Врата#!"
 setting_kalath_fogeater_spawn_location_desc:90 "[fogeaters|E] вторгнутся через Серые Врата."
 setting_aironoi_fogeater_spawn_location:90 "#high Амагея#!"
 setting_aironoi_fogeater_spawn_location_desc:90 "[fogeaters|E] вторгнутся через Амагею."

 rule_adabyss_invasion: "@godherja_logo! Вторжение Адабисса"
 setting_default_adabyss_invasion: "По умолчанию"
 setting_default_adabyss_invasion_desc: "Вторжение адабиссцев произойдет в начале или середине XIV века."
 setting_never_adabyss_invasion:1 "#high Никогда#!"
 setting_never_adabyss_invasion_desc: "Адабисс не вторгнется на север."

 rule_cenware_conquest_extent: "@godherja_logo! Завоевания Ценвара: размах"
 setting_cenware_conquest_entire_empire: "Аверсария"
 setting_cenware_conquest_entire_empire_desc: "ИИ Ценвар вторгнется вплоть до Айроноя или, что реже, Малькои."
 setting_cenware_conquest_opakhasia: "#high Опахасия#!"
 setting_cenware_conquest_opakhasia_desc: "ИИ Ценвар завершит свое великое завоевание после захвата Опахасии, но Айроной и Малькоя вторжению не подвергнутся."
 setting_cenware_conquest_greater_etepezea: "#high Великая Этепезея#!"
 setting_cenware_conquest_greater_etepezea_desc: "ИИ Ценвар завершит свое завоевание после покорения всей Этепезеи, включая Башенный Остров, но не станет вторгаться в Опахасию."
 setting_cenware_conquest_mainland_etepezea: "#high Материковая Этепезея#!"
 setting_cenware_conquest_mainland_etepezea_desc: "ИИ Ценвар завершит свое великое завоевание после захвата материковой Этепезеи, но Башенный Остров и Опахасия останутся незатронутыми."

 rule_destroy_imperrech: "@godherja_logo! Сьялволькский Имперрех"
 setting_imperrech_intact: "По умолчанию"
 setting_imperrech_intact_desc: "Как и задумано, Сьялволькский Имперрех существует на старте."
 setting_imperrech_destroyed: "#high Уничтожен#!"
 setting_imperrech_destroyed_desc: "Некоторым игрокам не нравится существование Имперреха, поэтому данное правило (если включено до входа на карту) уничтожит этот титул. (Примечание: функция находится в разработке)."

 rule_common_cause_deterioration: "@godherja_logo! Ослабление Общего Дела"
 setting_default_common_cause: "По умолчанию"
 setting_default_common_cause_desc: "[faiths|E] Имперреха естественным образом потеряют высокое [opinion|E] к братским верам [Concept('sjalvolki_migration','Сьялволькских Миграций')|E] в течение 10 лет после распада коалиции."
 setting_leisurely_common_cause: "#high Неспешное#!"
 setting_leisurely_common_cause_desc: "[faiths|E] Имперреха медленно и неохотно потеряют высокое [opinion|E] к братским верам [Concept('sjalvolki_migration','Сьялволькских Миграций')|E] в течение 15 лет после распада коалиции."
 setting_rapid_common_cause: "#high Быстрое#!"
 setting_rapid_common_cause_desc: "[faiths|E] Имперреха быстро и резко потеряют высокое [opinion|E] к братским верам [Concept('sjalvolki_migration','Сьялволькских Миграций')|E] в течение 5 лет."

 rule_epiromnuvo_colonization:90 "@godherja_logo! Колонизация Эрипомвуно"
 setting_default_lore_epiromnuvo:90 "По умолчанию"
 setting_default_lore_epiromnuvo_desc:90 "[Concept('colonization','Колонизация')|E] [eripomvuno_biozone|E] остается настолько же скверной идеей, насколько и в лоре... пока что!"
 setting_colonizable_epiromnuvo:90 "#high Открыта для колонизации#!"
 setting_colonizable_epiromnuvo_desc:90 "Трусы могут ликовать: [eripomvuno_biozone|E] теперь открыта для [colonization|E]."

 rule_colonization_speed:90 "@godherja_logo! Скорость колонизации"
 setting_half_colonization_speed:99 "#high Вдвое медленнее#!"
 setting_half_colonization_speed_desc:99 "[colonization|E] продвигается вдвое медленнее, чем по умолчанию."
 setting_default_colonization_speed:99 "По умолчанию"
 setting_default_colonization_speed_desc:99 "[colonization|E] продвигается с обычной скоростью."
 setting_x2_colonization_speed:99 "#high Скорость x2#!"
 setting_x2_colonization_speed_desc:99 "[colonization|E] продвигается вдвое быстрее обычной скорости."
 setting_x4_colonization_speed:99 "#high Скорость x4#!"
 setting_x4_colonization_speed_desc:99 "[colonization|E] продвигается в четыре раза быстрее обычной скорости."
 setting_x10_colonization_speed:99 "#high Скорость x10#!"
 setting_x10_colonization_speed_desc:99 "[colonization|E] продвигается быстро. Слишком быстро..."

 setting_easteregg_characters_default:90 "По умолчанию"
 setting_easteregg_characters_default_desc:90 "Пасхальные [characters|E1] останутся на своих задуманных местах."
 setting_easteregg_characters_promoted:90 "#high Повышены#!"
 setting_easteregg_characters_promoted_desc:90 "Пасхальные [barons|E1] займут титул своего правящего [Concept('count','совета')|E], чтобы за них можно было сыграть."

 rule_opening_events: "@godherja_logo! Вводные события"
 setting_opening_events_enabled: "По умолчанию"
 setting_opening_events_enabled_desc: "Вводные события включены."
 setting_opening_events_disabled: "#high Выключены#!"
 setting_opening_events_disabled_desc: "Вводные события выключены."

 rule_story_content: "@godherja_logo! Сюжетный контент"
 setting_story_content_enabled: "По умолчанию"
 setting_story_content_enabled_desc: "Сюжетный контент включен."
 setting_story_content_disabled: "#high Выключен#!"
 setting_story_content_disabled_desc: "Для игроков, которые считают, что вводные события разрушают их личный канон, отыгрыш и т.д., сюжетный контент выключен."

 rule_fog_speed: "@godherja_logo! Скорость распространения [Concept('the_fog','Тумана')|E]"
 setting_fog_speed_default: "#high По умолчанию#!"
 setting_fog_speed_default_desc: "[Concept('the_fog','Туман')|E] не может распространяться быстрее одного графства за 5 лет. #N Распространение Тумана находится в разработке; если вы играете впервые, лучше выключить эту опцию.#!"
 setting_fog_speed_disabled: "Выключено"
 setting_fog_speed_disabled_desc: "[Concept('the_fog','Туман')|E] не будет распространяться. #P Распространение Тумана находится в разработке; если вы играете впервые, лучше оставить этот параметр здесь.#!"
 setting_fog_speed_glacial: "#high Медлительность#!"
 setting_fog_speed_glacial_desc: "[Concept('the_fog','Туман')|E] не может распространяться быстрее одного графства за 30 лет. #N Распространение Тумана находится в разработке; если вы играете впервые, вам следует выключить эту опцию.#!"
 setting_fog_speed_slow: "#high Медленно#!"
 setting_fog_speed_slow_desc: "[Concept('the_fog','Туман')|E] не может распространяться быстрее одного графства за 10 лет. #N Распространение Тумана находится в разработке; если вы играете впервые, вам следует выключить эту опцию.#!"
 setting_fog_speed_fast: "#high Быстро#!"
 setting_fog_speed_fast_desc: "[Concept('the_fog','Туман')|E] не может распространяться быстрее одного графства за 2,5 года. #N Распространение Тумана находится в разработке; если вы играете впервые, вам следует выключить эту опцию.#!"
 setting_fog_speed_apocalypse: "#high Апокалипсис#!"
 setting_fog_speed_apocalypse_desc: "Конец близок: [Concept('the_fog','Туман')|E] способен поглощать до двух графств в год! #N Распространение Тумана находится в разработке; если вы играете впервые, вам следует выключить эту опцию.#!"

 rule_aervalr_shard: "@godherja_logo! Осколки [Concept('aervalr','Эрвала')|E]"
 setting_aervalr_shard_enabled: "По умолчанию"
 setting_aervalr_shard_enabled_desc: "Осколки разрушенного [Concept('aervalr','Эрвала')|E] разного размера будут случайным образом падать на землю, сея хаос."
 setting_aervalr_shard_disabled: "#high Выключено#!"
 setting_aervalr_shard_disabled_desc: "Осколки [Concept('aervalr','Эрвала')|E] не будут падать на [aeras|E]."
 setting_aervalr_shard_doubled: "#high Двойной шанс#!"
 setting_aervalr_shard_doubled_desc: "Осколки [Concept('aervalr','Эрвала')|E] будут падать на [aeras|E] вдвое чаще."
 setting_aervalr_shard_quadrupled: "#high Четырехкратный шанс#!"
 setting_aervalr_shard_quadrupled_desc: "Осколки [Concept('aervalr','Эрвала')|E] будут падать на [aeras|E] в четыре раза чаще."
 setting_aervalr_shard_apocalyptic: "#N Армагеддон!#!"
 setting_aervalr_shard_apocalyptic_desc: "Осколки [Concept('aervalr','Эрвала')|E] будут падать до одного раза в день вместо раза в год. Берегите голову!"

 rule_fog_spread_sarradon: "@godherja_logo! Распространение [Concept('the_fog','Тумана')|E]: [sarradon|E]"
 setting_fog_spread_sarradon_enabled: "По умолчанию"
 setting_fog_spread_sarradon_enabled_desc: "[Concept('the_fog','Туман')|E] сможет пересечь море и достигнуть берегов [Concept('sarradon','Саррадона')|E]."
 setting_fog_spread_sarradon_disabled: "#high Выключено#!"
 setting_fog_spread_sarradon_disabled_desc: "[Concept('the_fog','Туман')|E] не сможет перебраться в [sarradon|E]."

 rule_hammarts_wild_ride: "@godherja_logo! Дикая поездка Аммарта"
 setting_hammarts_wild_ride_disabled: "Выключено"
 setting_hammarts_wild_ride_disabled_desc: "Распределение магических свойств будет соответствовать обычной игре."
 setting_hammarts_wild_ride_enabled: "#high Включено#!"
 setting_hammarts_wild_ride_enabled_desc: "Каждый живой персонаж за пределами [chevalie|E], а также Аммарт, станет [Concept('magi','магом')|E] 20-го уровня с познаниями во всех [Concept('magic','магических')|E] школах. Это исключительно развлекательная настройка, производительность не гарантируется."

 rule_sarradon_nomad_region: "@godherja_logo! Кочевой регион: Саррадон"
 setting_sarradon_nomad_region_off: "По умолчанию"
 setting_sarradon_nomad_region_off_desc: "Саррадонская пустыня и Рог остаются без изменений."
 setting_sarradon_nomad_region_on: "#high Кочевой#!"
 setting_sarradon_nomad_region_on_desc: "Саррадонская пустыня и Рог используют кочевые механики, предназначенные для Степных кочевников (ПРИМ. GH: СКОРО!). Это правило не возымеет эффекта, если у вас нет дополнения #V $DLC020_CE2$#!."

