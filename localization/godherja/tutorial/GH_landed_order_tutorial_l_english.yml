l_english:
 action_reactive_advice_landed_orders: "Advice: Landed Orders!"
 action_reactive_advice_landed_orders_desc: "Learn the basics of ruling a [landed_order|E] and how this [government|E] type differs from others."
 action_reactive_advice_landed_orders_click: "$click_to_open_lesson$"
 reactive_advice_landed_orders: "Advice: Landed Orders!"
 reactive_advice_landed_orders_intro: "Landed Orders Introduction"
 reactive_advice_landed_orders_intro_desc: "Unlike a normal [holy_order|E] , a [landed_order|E] is an order that rules land. Its rulers are sworn members under vows, not a dynasty, so nothing is inherited: the [ordermaster|E] is raised by the [chapter_conclave|E], and every office below passes by Chapter Appointment to the member best fit for it.\n\nAn Order also fights with a standing force rather than a levy. Its rulers raise fewer levies but keep more [men_at_arms|E] regiments, the more the higher their office: see [landed_order_regiments|E]."
 reactive_advice_landed_orders_standing: "Landed Orders: Doctrine Standing"
 reactive_advice_landed_orders_standing_desc: "An Order's [legitimacy|E] is its [doctrine_standing|E]: how well it is seen to keep its faith. It rises with [holy_war|E] victories, conversions and discipline among its members, and falls with lost wars, officeholders of another [faith|E] and unconverted Order land.\n\nA high Standing brings [spiritual_fulfillment|E] to the Order's members, cheaper holy wars and relief from [chapter_strain|E]. At its lowest, the Chapter may turn on its Ordermaster."
 reactive_advice_landed_orders_authority: "Landed Orders: Order Authority"
 reactive_advice_landed_orders_authority_desc: "Instead of [crown_authority|E], an Order has [order_authority|E]: the Chapter's obedience to its Ordermaster, from #V 0#! to #V 100#!, shown in the My Realm tab. It sets the Order's Authority law at #V 25#!, #V 50#! and #V 75#!, and that law cannot be changed by hand.\n\nLoyal officeholders raise it, and so does convening a [chapter_general|E]. Imprisoning or stripping members of the Order's faith costs it, and a quarter of it is lost each time an Ordermaster dies."
 reactive_advice_landed_orders_chapter: "Landed Orders: The Chapter"
 reactive_advice_landed_orders_chapter_desc: "Every officeholder of the Order holds a [commandery|E]: a landless office with its own [domicile|E], passed by appointment. The Order's barons are [Concept('chaptermember','Chaptermembers')|E], and always celibate.\n\nEvery held Commandery adds to [chapter_strain|E], shown beneath Order Authority. Your [stewardship|E] and a high Standing absorb it, and Impose Chapter Discipline eases it for a time. Let it climb and the Chapter frays: challenges to your rule come easier, Komturs petition for self-governing [Concept('chapter_house','chapter houses')|E], and at worst a [chapter_schism|E]."
 reactive_advice_landed_orders_conclave: "Landed Orders: The Conclave"
 reactive_advice_landed_orders_conclave_desc: "When an Ordermaster dies, the [chapter_conclave|E] elects the next: the Order's direct officeholders and the council vote, weighted by office. Candidates must clear the [merit_threshold|E], and electors favour Merit in any case. You play on as the new Ordermaster.\n\nThe office is not yours for life. With Standing at its lowest and Authority below #V 25#!, a [reaffirmation_faction|E] can demand a [reaffirmation_vote|E]. Submit, and a [snap_conclave|E] decides whether you step down to serve as a Komtur; refuse, and the faction goes to war in the [chapter_censure|E]."
 reactive_advice_landed_orders_tributaries: "Landed Orders: Lay Tributaries"
 reactive_advice_landed_orders_tributaries_desc: "Not every lord who serves the Order takes its vows. A [lay_tributary|E] keeps hereditary land and pays tribute and levies to the Order, and adds nothing to [chapter_strain|E].\n\nEach carries a Discontent that grows with distance from the Order's Commanderies, a low Standing and a rival's better offer: see [tributary_reach|E]. A content tributary of your faith can be Brought into the Order, and a turbulent Komtur Demoted to a Lay Tributary, trading Chapter Strain for Reach."
