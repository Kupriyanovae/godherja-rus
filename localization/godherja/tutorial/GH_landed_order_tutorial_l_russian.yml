l_russian:

 # Added keys missing from the supplied Russian mod
 action_reactive_advice_landed_orders:0 "Совет: земельные ордены!"
 action_reactive_advice_landed_orders_click:0 "$click_to_open_lesson$"
 action_reactive_advice_landed_orders_desc:0 "Узнайте об основах управления [Concept( 'landed_order', 'земельным орденом' )|E] и об отличиях этого типа [Concept( 'government', 'правления' )|E] от других."
 reactive_advice_landed_orders:0 "Совет: земельные ордены!"
 reactive_advice_landed_orders_authority:0 "Земельные ордены: власть ордена"
 reactive_advice_landed_orders_authority_desc:0 "Вместо [Concept('crown_authority','власти короны')|E] у ордена есть [order_authority|E] — степень подчинения капитула магистру от #V 0#! до #V 100#!, отображаемая на вкладке «Мои владения». Она устанавливает закон о власти ордена при #V 25#!, #V 50#! и #V 75#!. Изменить этот закон вручную нельзя.\n\nВерные должностные лица повышают показатель, как и созыв [chapter_general|E]. Заключение в темницу или лишение должностей единоверцев ордена снижает его, а при смерти каждого магистра теряется четверть значения."
 reactive_advice_landed_orders_chapter:0 "Земельные ордены: капитул"
 reactive_advice_landed_orders_chapter_desc:0 "Каждое должностное лицо ордена владеет [Concept('commandery','командорством')|E] — не связанным с земельным титулом постом с собственной [Concept('domicile','резиденцией')|E], передаваемым по назначению. Бароны ордена являются [Concept('chaptermember','членами капитула')|E] и всегда соблюдают безбрачие.\n\nКаждое удерживаемое командорство увеличивает [chapter_strain|E], отображаемую под властью ордена. Ваш [stewardship|E] и высокий авторитет вероучения компенсируют часть нагрузки, а введение дисциплины капитула временно снижает её. Если допустить чрезмерный рост нагрузки, капитул начнёт распадаться: оспаривать вашу власть станет легче, комтуры потребуют самоуправляемых [Concept('chapter_house','капитульных домов')|E], а в худшем случае начнётся [chapter_schism|E]."
 reactive_advice_landed_orders_conclave:0 "Земельные ордены: конклав"
 reactive_advice_landed_orders_conclave_desc:0 "После смерти магистра следующего избирает [chapter_conclave|E]: прямые должностные лица и совет голосуют, причём вес голоса зависит от занимаемого поста. Кандидатам необходимо преодолеть [merit_threshold|E], а выборщики в любом случае предпочитают тех, у кого больше заслуг. Вы продолжаете игру за нового магистра.\n\nОднако пост не обязательно остаётся за вами пожизненно. Если авторитет вероучения упадёт до минимума, а власть ордена — ниже #V 25#!, [reaffirmation_faction|E] может потребовать [reaffirmation_vote|E]. Подчинитесь — и [snap_conclave|E] решит, должны ли вы уступить должность и снова стать комтуром. Откажетесь — и фракция начнёт войну в ходе [chapter_censure|E]."
 reactive_advice_landed_orders_intro:0 "Знакомство с земельными орденами"
 reactive_advice_landed_orders_intro_desc:0 "В отличие от обычного [Concept('holy_order','священного ордена')|E], [landed_order|E] правит землёй. Его правители — члены, принёсшие обеты, а не наследственная династия, и поэтому ничего не наследуют: [ordermaster|E] избирается [chapter_conclave|E], а каждую низшую должность капитул передаёт самому достойному брату.\n\nОрден сражается постоянными войсками, а не ополчением. Его правители собирают меньше ополченцев, зато содержат больше полков [men_at_arms|E] — тем больше, чем выше пост. См. [landed_order_regiments|E]."
 reactive_advice_landed_orders_standing:0 "Земельные ордены: верность учению"
 reactive_advice_landed_orders_standing_desc:0 "[Concept('legitimacy','Легитимность')|E] ордена выражается через [doctrine_standing|E] — степень соответствия его поведения собственной вере. Она повышается благодаря победам в [Concept('holy_war','священных войнах')|E], обращениям в веру и дисциплине братьев; снижается от поражений, иноверных должностных лиц и не обращённых в веру орденских земель.\n\nВысокий показатель приносит братьям [spiritual_fulfillment|E], удешевляет священные войны и ослабляет [chapter_strain|E]. На минимуме капитул может восстать против магистра."
 reactive_advice_landed_orders_tributaries:0 "Земельные ордены: мирские данники"
 reactive_advice_landed_orders_tributaries_desc:0 "Не всякий правитель на службе ордена приносит обеты. [lay_tributary|E] сохраняет наследственные земли, платит дань и предоставляет ополчение, не увеличивая [chapter_strain|E].\n\nУ каждого данника есть недовольство, растущее с расстоянием до командорств ордена, низким авторитетом вероучения и лучшими предложениями соперников: см. [tributary_reach|E]. Довольного данника вашей веры можно принять в орден, а мятежного комтура — понизить до светского данника, обменяв нагрузку на капитул на заботы об удалённых владениях."
