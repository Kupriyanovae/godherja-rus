l_english:
 action_reactive_advice_magic:0 "Advice: Magic 101"
 action_reactive_advice_magic_desc:1 "Learn how [magic|E] works in [aeras|E] - and what it can do for you!"
 action_reactive_advice_magic_click:0 "$click_to_open_lesson$"
 reactive_advice_magic:0 "Advice: Magic 101"

 reactive_advice_magic_intro:0 "Magic 101: Introduction"
 reactive_advice_magic_intro_desc:2 "[magic|E] runs through everything on [aeras|E], and, in the right hands, can heal the sick, raise armies, forge [artifacts|E], or quietly remove your rivals.\n\nOnly [magi|E], characters trained in a [magic_type|E], can perform true [Concept('gh_ritual','Rituals')|E], but you need not be one to benefit: a hired [court_magi|E] can cast on your behalf, and this tutorial covers both paths. We will walk the whole casting process step by step: picking a spell, aiming it, paying for it, strengthening it, and surviving it.\n\nThe highlighted meter on your HUD is your window into all of it, but first, let's look at the fundamentals: #bold open your Character Screen#! to continue."
 reactive_advice_magic_basics:0 "Magic 101: The Basics"
 reactive_advice_magic_basics_desc:1 "Here on the Character Screen, [magi|E] display their [Concept('gh_aspect','Aspects')|E] and their [magic_type|E].\n\nThere are eighteen [Concept('gh_aspect','Aspects')|E], including @gh_fire_icon![aspect_fire|E], @gh_death_icon![aspect_death|E], @gh_dream_icon![aspect_dream|E], @gh_hymns_icon![aspect_hymns|E], and your skill in each determines how strong your castings in that discipline are. Aspect skill comes from [traits|E], [faith|E]'s tenets, [traditions|E], and even the [Concept('locus','land')|E] you rule; #bold hover over each Aspect icon#! for a full breakdown of where yours comes from and what it improves. Your [magic_type|E] determines which Aspects you have trained in. Above it all sits @skill_arcana_icon![arcana|E], the [skill|E] of mystic training, which feeds your [spellcasting_ability|E] and beyond.\n\nEvery Magi also carries [mana|E], the fuel of all casting. It regenerates toward your [magic_baseline|E] at #V 5%#! per month ([mana_regeneration|E]), and holding more than your [extended_magic_baseline|E] invites [magic_exposure|E]; more on that later.\n\nNow, open the Magic Window: click the highlighted meter on your HUD.#F Hint: you will need to close the Character Screen#!"
 reactive_advice_magic_library:0 "Magic 101: Your Spell Library"
 reactive_advice_magic_library_desc:1 "Welcome to the Magic Window. The right side is your library, sorted by the tabs at the top: [Concept('gh_ritual','Rituals')|E], Familiars, Hexes, and [Concept('cantrip','Cantrips')|E]. The icon rows beneath the tabs filter the list by [gh_aspect|E].\n\n[Concept('gh_ritual','Rituals')|E] are the heart of spellcasting: deliberate, [mana|E]-fueled workings that are prepared, aimed, and can fail. [Concept('cantrip','Cantrips')|E] are the opposite; small, permanent passive workings that scale with your [magic_baseline|E] and [gh_aspect|E] skill, usually unlocked through [lifestyle|E] [perks|E] - spells that support them show a #bold Use as Cantrip#! toggle once selected. Hexes are hostile workings laid upon you or by you, and Familiars are bound creatures serving your will.\n\nThe spell list shows every spell you know, or, if you are casting through your [court_magi|E], every spell #bold they#! know. An empty list is no dead end - we cover hiring and learning shortly.\n\n#bold Select a spell from the list#! to begin preparing it."
 reactive_advice_magic_ritual_builder:0 "Magic 101: Building a Ritual"
 reactive_advice_magic_ritual_builder_desc:1 "With a spell selected, the left side becomes your ritual. If the spell has variants, #bold sub-spell tabs#! appear beneath its name - 'Default' plus any alternate workings; pick the one you intend.\n\nMost spells can be cast upon yourself or your own lands directly, but many can also be aimed at other [characters|E], [titles|E], or [artifacts|E], using the target rows here. To target another character, close this window, #bold right-click them and use the Add to Spell Targets#! [character_interaction]; they will then appear here for selection. Titles and artifacts are picked straight from their rows. Beware: a [hostile_ritual|E] against someone is a crime if discovered, and each target row shows your [spellcasting_discovery_chance|E] and their [magic_resistance|E].\n\nBelow the targets you will find the spell's #bold Casting Conditions#! and #bold Activation Conditions#!; some workings demand a [full_moon|E], a certain [terrain|E], or stranger things still. All conditions must be met before the ritual can proceed."
 reactive_advice_magic_costs:0 "Magic 101: Costs & Odds"
 reactive_advice_magic_costs_desc:1 "Every ritual has a price, shown in the highlighted panel: a @magic_icon![mana|E] cost drawn from your reserves, and often a @gold_icon![gold|E] cost for materials and assistants. If the mana number shows #negative_value red#!, the cost exceeds what you hold; wait for [mana_regeneration|E], or anchor the ritual with [Concept('locus','Loci')|E] (more on those later).\n\nNext to them sits your [spellcasting_success_chance|E]. Every casting starts from a base chance and grows harder with the spell's level; your [gh_aspect|E] skills, [arcana|E], [court_grandeur|E], and matching [faith|E] all push the odds back in your favor. #bold Hover the percentage#! for the full arithmetic.\n\nWhen everything is in order, the #bold Cast Spell#! button sets the working in motion. Succeed, and the spell's effects unfold. Fail, and the ritual [Concept('backfire','Backfires')|E], often harmlessly, sometimes... not."
 reactive_advice_magic_overcharge:0 "Magic 101: Overcharge & Loci"
 reactive_advice_magic_overcharge_desc:1 "Power is negotiable, in both directions.\n\n#bold Overcharge#!: in the highlighted [gh_aspect|E] grid, press #bold +#! on an Aspect to Overcharge it. Each level strengthens and lengthens that Aspect's effects, and lowers your [spellcasting_success_chance|E] in return; press #bold -#! to dial it back. Overcharge when the effect matters more than the odds. A desperate [magi|E] can work wonders, or dig their own grave.\n\n#bold Loci#!: below, your [holdings|E] can anchor the ritual. #bold Check a holding#! in the panel to add it as a [Concept('locus','Locus')|E], and #bold star one#! as your prime. The prime locus lends its full Aspect rating at #V 1#! [gold|E] per point of mana; each secondary costs #V 100#! [gold|E] to include, lends half its rating, and runs #V 4#! [gold|E] per point. The number of loci you can weave together is capped by the organizer's [arcana|E] - they are how modest magi afford mighty workings."
 reactive_advice_magic_components:0 "Magic 101: Components & Crafting"
 reactive_advice_magic_components_desc:1 "Some spells call for #bold Components#!, reagents readied ahead of time, shown in the highlighted panels. Each component slot asks for a type of reagent: an herbal solution, an incense, a powder, a libation, or rarer things. #bold Assign an ingredient to each slot#! and give the preparation time to finish before you cast; the components are consumed by the ritual.\n\nIngredients matter: each carries its own Aspect affinities and rarity, and finer reagents yield stronger workings. A spell brewed on Black Laudanum is not the spell brewed on roadside herbs. A well-stocked Magi plans ahead.\n\nCrafting spells work the same way, but their components are #bold materials and blueprints#!. Darve Wyrmbone with the right blueprint, and the ritual yields a magical [artifact|E]: rings, brooches, crowns, staves, and stranger regalia, bearing permanent enchantments."
 reactive_advice_magic_court_magi:0 "Magic 101: The Court Magi"
 reactive_advice_magic_court_magi_desc:1 "No talent for the mystic arts? Hire it. The [court_magi|E] is a [council|E] position - take the #bold Hire Court Magi#! [decision|E] if the seat stands empty. With one seated, #bold tick the highlighted Cast Through checkbox#! by their portrait: your spell library is replaced by #bold theirs#!, and their skills carry the casting. They expect compensation - toggle #bold Offer Gold#!, or spend a [hook|E]. Their [mana|E] fuels the ritual, so mind their reserves: you can read them on the Council screen.\n\nA Court Magi will also tutor children with the gift, passing their [magic_type|E] to the next generation.\n\nAs for learning magic yourself: a willing (or unwilling) Magi can teach you. Use the #bold Learn School of Magic#! and #bold Learn Spell#! [schemes|E] against a knowledgeable target, or steal a spell outright, if your [intrigue|E] outmatches their vigilance. You may also find [artifacts|E] that contain [knowledge_entries|E] you can study with a scheme and learn spells from."
 reactive_advice_magic_risks:0 "Magic 101: The Price of Power"
 reactive_advice_magic_risks_desc:1 "The highlighted meter tracks your [mana|E] against your [magic_baseline|E] - and it is also your early warning. Casting, places of power, and ambient surges can push your reserves beyond what your body can channel, raising your [exposure_level|E]; the meter glows brighter as it climbs.\n\nSustained [magic_exposure|E] brings [exposure_sickness|E]: you will temporarily bear the [GetTrait('gh_magicsickness_1').GetName( GetNullCharacter )] [trait|E], suffering failing health and a growing risk of [mutations|E]. Exposure [Concept('aftoenischi_effect','decays')|E] over time if you show restraint.\n\n[overwhelmation|E] is a different beast: the immediate, violent consequence of casting far beyond your limits, usually through a failed ritual's [backfire|E]. Where sickness lingers, Overwhelmation strikes; combustion, disintegration, or worse.\n\nThe rules of survival are simple: keep your stored [mana|E] at or below your [magic_baseline|E], rest between great workings, and never overcharge what you cannot afford to lose. Respect your limits, and both fates will remain strangers."
 reactive_advice_magic_gedeora:0 "Magic 101: Gederðas"
 reactive_advice_magic_gedeora_desc:1 "The world casts back. A [gedeora|E] is a spontaneous surge of wild magic that washes over a region, how often they strike and how hard depends on your game rules.\n\nWhen a Gederða hits your location and you fall within its parameters, it may attempt to rewrite your very personality. You can resist, at the cost of considerable [stress|E], and may leave behind secondary [traits|E], benign or malignant.\n\nKeep an eye on the [ambient_magic|E] of the lands you rule, on the [waylines|E] that carry power across [aeras|E], and on the [moon_phase|E]. Magic is never only what you do with it, but what it does to you."

 reactive_advice_magic_click_on_magic:1 "Click on your [mana|E] meter\n#low It sits next to the [stress|E] meter on your HUD. It fills as your stored [mana|E] approaches your [magic_baseline|E], and glows with your [exposure_level|E]!#!"
 reactive_advice_magic_select_a_spell:0 "Select a spell from your library\n#low Click any [Concept('gh_ritual','Ritual')|E] in the list on the right to open its preparations. No spells to your name? You may continue regardless.#!"

