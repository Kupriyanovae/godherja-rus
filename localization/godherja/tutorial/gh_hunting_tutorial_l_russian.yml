l_russian:
  action_reactive_advice_hunting:0 "Совет: Охота"
  action_reactive_advice_hunting_desc:0 "Узнайте больше об охоте в [Concept('aeras','Эрасе')|E]!"
  action_reactive_advice_hunting_click:0 "$click_to_open_lesson$"
  reactive_advice_hunting_intro:0 "Введение"
  reactive_advice_hunting_intro_desc:0 "Охота в Godherja была значительно переработана по сравнению с оригинальной игрой, она стала куда более опасной, но и куда более прибыльной.\nОткройте это руководство, чтобы получить советы о том, как лучше всего исследовать дикие земли [Concept('aeras','Эраса')|E]!"
  reactive_advice_hunting_basics_desc:0 "По всему [Concept('aeras','Эрасу')|E] водится гораздо больше видов дичи, чем в оригинальной игре, — от мелких грызунов и зайцев до исполинских слонов и мамонтов. Добыть самых крупных зверей невероятно трудно, но и награда будет соответствующей.\n\nКроме того, вы больше не ограничены охотой в пределах своей [Concept('realm','державы')|E]. [Concept('perk','Достоинство')|E] [GetPerk('adept_tracker_perk').GetName(GetPlayer)] позволит вам охотиться и в чужих державах, если их правители находятся в пределах досягаемости и имеют о вас положительное [Concept('opinion','мнение')|E]."
  reactive_advice_hunting_biozones_desc:0 "[Concept('biozone','Биозоны')|E] — это термин для обозначения регионов со схожими биомами и общей историей. Вы можете увидеть их на карте с помощью режима карты «Биозоны» в правом нижнем углу интерфейса.\n\nВ разных биозонах обитают разные и уникальные виды фауны. Хотя некоторые животные встречаются сразу в нескольких зонах, многие из них (особенно редкие [Concept('monsters','монстры')|E]) обитают строго в определенных местах."
  reactive_advice_hunting_monsters_desc:0 "Помимо обычной охоты, в [Concept('aeras','Эрасе')|E] можно охотиться на [Concept('monsters','монстров')|E]. Охота на монстров — это отдельный вариант в рамках [Concept('activity','мероприятия')|E] [GetActivityType('activity_hunt').GetName], наряду со стандартной охотой и соколиной охотой. Доступ к ней открывается через [Concept('adventure_lifestyle','образ жизни искателя приключений')|E], хотя некоторые [Concept('core_tenet', 'догматы')|E] или [Concept('tradition','традиции')|E] также могут открыть эту возможность.\n\nОхота на монстров таит в себе смертельную опасность по сравнению с обычным выслеживанием зверей, так что убедитесь, что вы как следует подготовились к предстоящей угрозе."
  reactive_advice_hunting_advancement_rewards_desc:0 "Охота приносит множество наград в зависимости от вашего охотничьего мастерства и, если вы его выбрали, развития [Concept('adventure_lifestyle','образа жизни искателя приключений')|E]. Сказители будут воспевать Истребителя Тумана, сразившего дюжину туманных тварей! Шкуры и черепа, яды и самоцветы — самые разные [Concept('artifacts','артефакты')|E] могут стать вашими трофеями. Чем опаснее добыча, тем больше славы принесёт победа над ней!\n\nПерсонажи со [Concept('trait','свойством')|E] «Охотник» могут также развивать ветку «Истребитель» охотой на монстров. Чем опаснее охота, тем больше опыта можно получить!"
  reactive_advice_hunting:0 "Совет: Охота"
  reactive_advice_hunting_basics:0 "I — Основы ($reactive_advice_hunting$)"
  reactive_advice_hunting_biozones:0 "II — Биозоны ($reactive_advice_hunting$)"
  reactive_advice_hunting_fauna:0 "III — Ваша добыча ($reactive_advice_hunting$)"
  reactive_advice_hunting_advancement_rewards:0 "VI — Развитие и награды ($reactive_advice_hunting$)"
