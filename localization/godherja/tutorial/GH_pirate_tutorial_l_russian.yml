l_russian:
 action_reactive_advice_pirates: "Совет: Пираты!"
 action_reactive_advice_pirates_desc: "Узнайте больше об основах пиратства на [Concept('aeras','Эрасе')|E] и о том, чем этот тип [Concept('government','правления')|E] отличается от других."
 action_reactive_advice_pirates_click: "$click_to_open_lesson$"
 reactive_advice_pirates: "Совет: Пираты!"
 reactive_advice_pirates_intro: "Введение в пиратство"
 reactive_advice_pirates_intro_desc: "[Concept('pirate','Пираты')|E] в Godherja — это уникальный тип правления, построенный вокруг децентрализованного контроля над ключевыми проливами и особых контрабандных портов, называемых [Concept('shadow_port','тайными портами')|E]. Кроме того, пираты имеют условных [Concept('men_at_arms','профессионалов')|E], подобных [Concept('adventurers','искателям приключений')|E]."
 reactive_advice_pirates_basics: "Пиратство: Квартирмейстеры"
 reactive_advice_pirates_basics_desc: "Вместо управляющего у [Concept('pirate','пиратов')|E] есть уникальный [Concept('councillor','советник')|E] — квартирмейстер. Квартирмейстеры имеют уникальные задач, подходящие для пиратов, такие как возможность строить [Concept('shadow_port','тайные порты')|E] и совершать из них торговые набеги. Успешный пират строит множество тайных портов, чтобы его квартирмейстер мог получать больше дохода от торговых набегов."
 reactive_advice_pirates_authority: "Пиратство:Авторитет капитана"
 reactive_advice_pirates_authority_desc: "[Concept('pirate','Пираты')|E] также используют не [Concept('crown_authority','власть короны')|E], а [Concept('pirate_authority','пиратский авторитет')|E]. Это лучше отражает структуру «пиратской державы». На низком уровне сплочённости держава сильно децентрализована, но вы получаете максимальную выгоду от пиратства. На высоком уровне вы ближе к [Concept('feudal','феодальному')|E] [Concept('liege','сюзерену')|E] и получаете значительно меньше преимуществ."
 reactive_advice_pirates_succession: "Пиратство: Наследование"
 reactive_advice_pirates_succession_desc: "[Concept('succession','Наследование')|E] в [Concept('pirate','пиратских')|E] державах зависит не от прав по крови на титул, а от того, достаточно ли вы сильны, чтобы удержать своё. [Concept('succession_law','Закон наследования')|E] «[GetLaw('lawless_succession_law').GetName]» гарантирует,что ваш назначенный [Concept('heir','наследник')|E] унаследует все [Concept('titles','титулы')|E], однако ваши [Concept('vassals','вассалы')|E] и даже [Concept('courtiers','придворные')|E] могут оспорить ваше право на власть.\n\nБолее того, если ваш [Concept('liege','сюзерен')|E] недостаточно силен, чтобы удерживать [Concept('pirate','пиратскую')|E] [Concept('realm','державу')|E], через несколько лет после наследования держава распадется, освободив всех вассалов."
 reactive_advice_pirates_tax_collectors: "Пиратство: Вымогательство"
 reactive_advice_pirates_tax_collectors_desc: "Заключительный урок пиратства посвящен уникальным [Concept('pirate','пиратским')|E] ролям [Concept('tax_collector','сборщиков налогов')|E]. Пираты с [Concept('kingdom','королевским')|E] [Concept('title','титулом')|E] могут нанимать боцманов в своей [Concept('realm','державе')|E], имеющих набор уникальных налоговых слотов, включая: «Первую добычу», «Грабительскую сделку», «Коммуну» и «Права на контрабанду». Это помогает диверсифицировать пиратскую державу и привлекать различные типы [Concept('vassal','вассалов')|E]. Если у непиратской державы есть пиратский вассал, она может предоставить ему налоговый слот «Каперские права»."