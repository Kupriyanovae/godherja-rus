l_russian:
 action_reactive_advice_magic:0 "Совет: Основы магии"
 action_reactive_advice_magic_desc:1 "Узнайте, как действует [Concept('magic','магия')|E] на [Concept('aeras','Эрасе')|E] и какую пользу она может принести!"
 action_reactive_advice_magic_click:0 "$click_to_open_lesson$"
 reactive_advice_magic:0 "Совет: Основы магии"

 reactive_advice_magic_intro:0 "Основы магии: Введение"
 reactive_advice_magic_intro_desc:2 "[Concept('magic','Магия')|E] пронизывает всё на [Concept('aeras','Эрасе')|E]. В умелых руках она позволяет исцелять больных, поднимать армии, создавать [Concept('artifacts','артефакты')|E] и незаметно устранять соперников.\n\nТолько [Concept('magi','маги')|E], обученные одной из [Concept('magic_type','школ магии')|E], могут проводить настоящие [Concept('gh_ritual','ритуалы')|E]. Однако необязательно самому быть магом: нанятый [Concept('court_magi','придворный маг')|E] может творить заклинания от вашего имени. В этом уроке мы разберём оба способа, шаг за шагом рассмотрев выбор заклинания и его цели, оплату, усиление и меры предосторожности.\n\nВыделенная шкала интерфейса даёт доступ ко всем этим возможностям. Но сначала познакомимся с основами: #bold откройте экран персонажа#!, чтобы продолжить."
 reactive_advice_magic_basics:0 "Основы магии: Основы"
 reactive_advice_magic_basics_desc:1 "На экране персонажа у [Concept('magi','мага')|E] отображаются его [Concept('gh_aspect','аспекты')|E] и [Concept('magic_type','школа магии')|E].\n\nВсего существует восемнадцать [Concept('gh_aspect','аспектов')|E], в том числе @gh_fire_icon![aspect_fire|E], @gh_death_icon![aspect_death|E], @gh_dream_icon![aspect_dream|E] и @gh_hymns_icon![aspect_hymns|E]. Владение каждым из них определяет силу соответствующих заклинаний. Мастерство аспекта зависит от [Concept('traits','свойств')|E], догматов [Concept('faith','конфессии')|E], [Concept('traditions','традиций')|E] и даже подвластных вам [Concept('locus','земель')|E]. #bold Наведите курсор на значок аспекта#!, чтобы узнать, от чего зависит его значение и на что он влияет. Ваша [Concept('magic_type','школа магии')|E] определяет, каким аспектам вы обучены. Не менее важна @skill_arcana_icon![Concept('arcana','аркана')|E] — [Concept('skill','навык')|E] владения тайными искусствами, от которого зависит ваша [Concept('spellcasting_ability','способность к колдовству')|E] и не только.\n\nКаждый маг обладает [Concept('mana','маной')|E], необходимой для сотворения заклинаний. Она восстанавливается до [Concept('magic_baseline','магического порога')|E] со скоростью #V 5%#! в месяц ([Concept('mana_regeneration','восстановление маны')|E]). Накопление энергии сверх [Concept('extended_magic_baseline','расширенного магического порога')|E] чревато [Concept('magic_exposure','магическим воздействием')|E]; подробнее об этом позже.\n\nТеперь откройте окно магии, нажав на выделенную шкалу интерфейса. #F Подсказка: для этого необходимо закрыть экран персонажа#!"
 reactive_advice_magic_library:0 "Основы магии: Ваша библиотека заклинаний"
 reactive_advice_magic_library_desc:1 "Добро пожаловать в окно магии. Справа находится библиотека заклинаний. В верхней части расположены вкладки: [Concept('gh_ritual','ритуалы')|E], фамильяры, сглазы и [Concept('cantrip','заговоры')|E]. Значки под ними позволяют отфильтровать заклинания по [Concept('gh_aspect','аспектам')|E].\n\n[Concept('gh_ritual','Ритуалы')|E] — основа колдовства: они требуют подготовки, выбора цели и затрат [Concept('mana','маны')|E] и могут завершиться неудачей. [Concept('cantrip','Заговоры')|E], напротив, представляют собой небольшие постоянные пассивные чары, сила которых зависит от [Concept('magic_baseline','магического порога')|E] и мастерства [Concept('gh_aspect','аспекта')|E]. Обычно они открываются благодаря [Concept('perks','достоинствам')|E] [Concept('lifestyle','образа жизни')|E]; при выборе подходящего заклинания появляется переключатель #bold Использовать как заговор#!. Сглазы — враждебные чары, наложенные вами или на вас, а фамильяры — связанные магией существа, подчинённые вашей воле.\n\nВ списке находятся все известные вам заклинания. Если вы колдуете через [Concept('court_magi','придворного мага')|E], в нём отображаются заклинания, известные #bold ему#!. Даже если список пуст, не беда: о найме мага и обучении мы расскажем далее.\n\n#bold Выберите заклинание из списка#!, чтобы начать подготовку."
 reactive_advice_magic_ritual_builder:0 "Основы магии: Подготовка ритуала"
 reactive_advice_magic_ritual_builder_desc:1 "После выбора заклинания слева откроется панель подготовки ритуала. Если у заклинания есть несколько вариантов, под его названием появятся #bold вкладки вариантов заклинания#! — «По умолчанию» и дополнительные варианты. Выберите нужный.\n\nБольшинство заклинаний можно направить на себя или собственные земли, но многие допускают выбор других [Concept('characters','персонажей')|E], [Concept('titles','титулов')|E] или [Concept('artifacts','артефактов')|E] в строках целей. Чтобы выбрать другого персонажа, закройте окно, #bold щёлкните по нему правой кнопкой мыши и воспользуйтесь действием добавления в цели заклинания#! [character_interaction]. После этого персонаж появится в списке. Титулы и артефакты выбираются непосредственно в соответствующих строках. Помните: раскрытый [Concept('hostile_ritual','враждебный ритуал')|E] против другого персонажа считается преступлением. Для каждой цели показаны ваш [Concept('spellcasting_discovery_chance','шанс раскрытия колдовства')|E] и её [Concept('magic_resistance','сопротивление магии')|E].\n\nНиже указаны #bold условия сотворения#! и #bold условия активации#! заклинания. Некоторые ритуалы требуют [Concept('full_moon','полнолуния')|E], определённого типа [Concept('terrain','местности')|E] или иных, более необычных обстоятельств. Прежде чем начать ритуал, необходимо выполнить все условия."
 reactive_advice_magic_costs:0 "Основы магии: Стоимость и вероятность успеха"
 reactive_advice_magic_costs_desc:1 "У каждого ритуала есть цена, указанная на выделенной панели: затраты @magic_icon![Concept('mana','маны')|E] из ваших запасов, а зачастую и @gold_icon![Concept('gold','золота')|E] на материалы и помощников. Если стоимость в мане выделена #negative_value красным#!, вам не хватает запасов. Дождитесь [Concept('mana_regeneration','восстановления маны')|E] или проведите ритуал с помощью [Concept('locus','локусов')|E] (подробнее о них позже).\n\nРядом указан [Concept('spellcasting_success_chance','шанс успешного колдовства')|E]. У каждого заклинания есть базовая вероятность успеха, которая снижается с ростом его уровня. Мастерство [Concept('gh_aspect','аспектов')|E], [Concept('arcana','аркана')|E], [Concept('court_grandeur','величие двора')|E] и подходящая [Concept('faith','конфессия')|E] повышают шансы на успех. #bold Наведите курсор на процент#!, чтобы увидеть подробный расчёт.\n\nКогда всё готово, нажмите кнопку #bold Сотворить заклинание#!. При успехе заклинание возымеет действие, а при неудаче ритуал вызовет [Concept('backfire','отдачу')|E] — иногда безобидную, а иногда… нет."
 reactive_advice_magic_overcharge:0 "Основы магии: Перенасыщение и локусы"
 reactive_advice_magic_overcharge_desc:1 "Силу ритуала можно как повысить, так и понизить.\n\n#bold Перенасыщение#!: в выделенной таблице [Concept('gh_aspect','аспектов')|E] нажмите #bold +#! рядом с нужным аспектом, чтобы перенасытить его. Каждый уровень усиливает и продлевает действие соответствующего аспекта, но снижает [Concept('spellcasting_success_chance','шанс успешного колдовства')|E]. Нажмите #bold -#!, чтобы уменьшить перенасыщение. Прибегайте к нему, когда сила эффекта важнее вероятности успеха. Отчаявшийся [Concept('magi','маг')|E] способен сотворить чудо — или погубить себя.\n\n#bold Локусы#!: в нижней части панели можно задействовать [Concept('holdings','владения')|E] для проведения ритуала. #bold Отметьте владение#!, чтобы добавить его в качестве [Concept('locus','локуса')|E], и #bold пометьте одно владение звёздочкой#!, чтобы сделать его главным. Главный локус даёт полное значение своего аспекта при стоимости #V 1#! ед. [Concept('gold','золота')|E] за единицу маны. Каждый дополнительный локус стоит #V 100#! ед. [Concept('gold','золота')|E] за подключение, даёт половину значения аспекта и обходится в #V 4#! ед. [Concept('gold','золота')|E] за единицу маны. Число одновременно используемых локусов ограничено [Concept('arcana','арканой')|E] организатора ритуала. Благодаря им даже не самые могущественные маги могут проводить великие ритуалы."
 reactive_advice_magic_components:0 "Основы магии: Компоненты и создание артефактов"
 reactive_advice_magic_components_desc:1 "Некоторые заклинания требуют #bold компонентов#! — реагентов, которые подготавливаются заранее и отображаются на выделенных панелях. Для каждой ячейки нужен реагент определённого типа: травяной раствор, благовоние, порошок, жидкость для возлияния или что-либо более редкое. #bold Выберите ингредиент для каждой ячейки#! и дождитесь окончания подготовки перед сотворением заклинания: компоненты расходуются при проведении ритуала.\n\nИнгредиенты различаются сродством к аспектам и степенью редкости. Более качественные реагенты позволяют творить более сильные чары. Заклинание на чёрном лаудануме совсем не то же самое, что заклинание на придорожных травах. Предусмотрительный маг запасается ингредиентами заранее.\n\nЗаклинания создания артефактов действуют схожим образом, но требуют #bold материалов и чертежей#!. Обработайте кость змия по подходящему чертежу, и ритуал создаст магический [Concept('artifact','артефакт')|E]: кольцо, брошь, корону, посох или более необычную регалию с постоянными чарами."
 reactive_advice_magic_court_magi:0 "Основы магии: Придворный маг"
 reactive_advice_magic_court_magi_desc:1 "Не обладаете даром к тайным искусствам? Наймите того, кто им обладает. [Concept('court_magi','Придворный маг')|E] занимает должность в [Concept('council','совете')|E]. Если она свободна, примите [Concept('decision','решение')|E] #bold Нанять придворного мага#!. После назначения #bold установите выделенный флажок сотворения через мага#! рядом с его портретом: вместо вашей библиотеки заклинаний будет доступна #bold его#!, а успех ритуала будет зависеть от его навыков. Маг рассчитывает на вознаграждение: включите #bold предложение золота#! или воспользуйтесь [Concept('hook','крючком')|E]. Ритуал расходует его [Concept('mana','ману')|E], так что следите за запасами на экране совета.\n\nПридворный маг также обучает одарённых детей, передавая свою [Concept('magic_type','школу магии')|E] следующему поколению.\n\nЕсли хотите сами научиться магии, вас может обучить другой маг — добровольно или против своей воли. Используйте [Concept('schemes','происки')|E] #bold Изучить школу магии#! и #bold Изучить заклинание#! в отношении знающего персонажа. Если ваше мастерство [Concept('intrigue','интриг')|E] позволяет обойти его бдительность, можно и украсть заклинание. Кроме того, встречаются [Concept('artifacts','артефакты')|E] с [Concept('knowledge_entries','записями знаний')|E]: изучив их с помощью происков, можно освоить новые заклинания."
 reactive_advice_magic_risks:0 "Основы магии: Цена могущества"
 reactive_advice_magic_risks_desc:1 "Выделенная шкала показывает, как соотносятся запасы [Concept('mana','маны')|E] и ваш [Concept('magic_baseline','магический порог')|E], и предупреждает об опасности. Сотворение заклинаний, пребывание в местах силы и всплески окружающей магии могут привести к накоплению энергии сверх возможностей вашего тела и повысить [Concept('exposure_level','уровень облучения')|E]. Чем он выше, тем ярче светится шкала.\n\nДлительное [Concept('magic_exposure','магическое воздействие')|E] вызывает [Concept('exposure_sickness','магическую немочь')|E]: вы временно приобретаете [Concept('trait','свойство')|E] [GetTrait('gh_magicsickness_1').GetName( GetNullCharacter )], ваше здоровье ухудшается, а риск [Concept('mutations','мутаций')|E] растёт. Воздействие со временем [Concept('aftoenischi_effect','ослабевает')|E], если проявлять сдержанность.\n\n[Concept('overwhelmation','Перегрузка')|E] — иное явление: это мгновенное и разрушительное последствие сотворения заклинаний далеко за пределами ваших возможностей, обычно вызванное [Concept('backfire','отдачей')|E] неудавшегося ритуала. В отличие от затяжной немочи, перегрузка поражает сразу: самовозгорание, распад тела или нечто ещё страшнее.\n\nПравила выживания просты: держите запасы [Concept('mana','маны')|E] на уровне [Concept('magic_baseline','магического порога')|E] или ниже, отдыхайте между мощными ритуалами и не перенасыщайте заклинания, неудачи которых не можете себе позволить. Знайте меру — и обе беды обойдут вас стороной."
 reactive_advice_magic_gedeora:0 "Основы магии: Гедеоры"
 reactive_advice_magic_gedeora_desc:1 "Мир отвечает на колдовство. [Concept('gedeora','Гедеора')|E] — стихийный всплеск дикой магии, охватывающий целую область. Частота и сила гедеор зависят от правил игры.\n\nЕсли гедеора обрушится на местность, где вы находитесь, и вы окажетесь подвержены её действию, она может попытаться изменить саму вашу личность. Можно сопротивляться ценой значительного [Concept('stress','стресса')|E]. Гедеора также может оставить после себя дополнительные [Concept('traits','свойства')|E], как благотворные, так и пагубные.\n\nСледите за [Concept('ambient_magic','окружающей магией')|E] подвластных вам земель, за [Concept('waylines','лей-линиями')|E], несущими силу через весь [Concept('aeras','Эрас')|E], и за [Concept('moon_phase','фазой Луны')|E]. Магия — это не только то, что вы делаете с ней, но и то, что она делает с вами."

 reactive_advice_magic_click_on_magic:1 "Нажмите на шкалу [Concept('mana','маны')|E]\n#low Она расположена рядом со шкалой [Concept('stress','стресса')|E] в интерфейсе. Она заполняется по мере приближения запасов [Concept('mana','маны')|E] к [Concept('magic_baseline','магическому порогу')|E], а яркость её свечения зависит от [Concept('exposure_level','уровня облучения')|E]!#!"
 reactive_advice_magic_select_a_spell:0 "Выберите заклинание из библиотеки\n#low Щёлкните по любому [Concept('gh_ritual','ритуалу')|E] в списке справа, чтобы открыть панель подготовки. Если у вас нет заклинаний, всё равно можно продолжить.#!"

