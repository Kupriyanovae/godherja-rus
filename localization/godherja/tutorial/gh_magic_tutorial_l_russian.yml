l_russian:
 action_reactive_advice_magic:0 "Совет: Магия 101"
 action_reactive_advice_magic_desc:1 "Научитесь, как [Concept('magic','магия')|E] работает в [Concept('aeras','Эрасе')|E] - и что она может сделать для вас!"
 action_reactive_advice_magic_click:0 "$click_to_open_lesson$"
 reactive_advice_magic:0 "Совет: Магия 101"

 reactive_advice_magic_intro:0 "Совет 101: Введение"
 reactive_advice_magic_intro_desc:2 "[Concept('magic','Магия')|E] пронизывает всё на [Concept('aeras','Эрасе')|E], и, в правильных руках, может исцелять больных, созывать армии, выковать [Concept('artifacts','артефакты')|E], или незаметно устранять ваших соперников..\n\Только [Concept('magi','маги')|E], персонажи обученные [Concept('magic_type','школе магии')|E], могут проводить настоящие [Concept('gh_ritual','ритуалы')|E], но вам не обязательно быть одним из них, чтобы извлечь выгоду: нанятый [Concept('court_magi','придворный маг')|E] может творить заклинания от вашего имени, и это обучение охватывает оба пути.  Мы пройдем весь процесс сотворения шаг за шагом: выбор заклинания, наведение, оплата его цены, усиление и выживание после него.\n\nВыделенная шкала на вашем HUD — это ваше окно во всё это, но сначала давайте рассмотрим основы: #bold откройте экран вашего персонажа#! чтобы продолжить."
 reactive_advice_magic_basics:0 "Магия 101: Основы"
 reactive_advice_magic_basics_desc:1 "Здесь, на экране персонажа, у [Concept('magi','мага')|E] отображаются его [Concept('gh_aspect','аспекты')|E] и их [Concept('magic_type','школа магии')|E].\n\nСуществует восемнадцать [Concept('gh_aspect','аспекты')|E], включая @gh_fire_icon![aspect_fire|E], @gh_death_icon![aspect_death|E], @gh_dream_icon![aspect_dream|E], @gh_hymns_icon![aspect_hymns|E], и ваше мастерство в каждом определяет, насколько сильны будут ваши заклинания в этой дисциплине. Навык аспекта зависит от [Concept('traits','свойств')|E], догматов [Concept('faith','конфессии')|E], [Concept('traditions','традиций')|E], и даже [Concept('locus','земель')|E] которыми вы правите; #bold наведите курсор на каждый значок аспекта#! чтобы увидеть полную разбивку источников и того, что он улучшает. Ваша [Concept('magic_type','школа магии')|E] определяет, в каких аспектах вы обучены. Над всем этим возвышается @skill_arcana_icon![Concept('arcana','аркана')|E], [Concept('skill','навык')|E] мистической подготовки, который питает вашу [Concept('spellcasting_ability','способность к колдовству')|E] и не только.\n\nКаждый маг также несет в себе [Concept('mana','ману')|E], топливо для всех заклинаний. Оно восстанавливается до вашего [Concept('magic_baseline','магического порога')|E] со скоростью #V 5%#! в месяц ([Concept('mana_regeneration','восстановление маны')|E]), а удерживание больше энергии в теле, чем позволяет ваш [Concept('extended_magic_baseline','расширенный магический порог')|E], приводит к [Concept('magic_exposure','магическому воздействию')|E]; подробнее об этом позже.\n\nТеперь откройте окно магии: нажмите на выделенную шкалу на вашем HUD.#F Подсказка: вам нужно будет закрыть экран персонажа#!"
 reactive_advice_magic_library:0 "Магия 101: Ваша библиотека заклинаний"
 reactive_advice_magic_library_desc:1 "Добро пожаловать в окно магии. Правая часть — это ваша библиотека, рассортированная по вкладкам вверху: [Concept('gh_ritual','ритуалы')|E], фамильяры, сглазы, и [Concept('cantrip','заговоры')|E]. Ряды значков под вкладками фильтруют список по [Concept('gh_aspect','аспекту')|E].\n\n[Concept('gh_ritual','Ритуалы')|E] это сердце сотворения магии: обдуманные, питаемые [Concept('mana','маной')|E] деяния, которые подготавливаются, наводятся и могут провалиться. [Concept('cantrip','Заговоры')|E] — противоположность этому; небольшие, постоянные пассивные чары, сила которых растет с вашим [Concept('magic_baseline','магическим порогом')|E] и навыком [Concept('gh_aspect','аспекта')|E], обычно открываемые через [Concept('perks','достоинства')|E] [Concept('lifestyle','образа жизни')|E] - — заклинания, поддерживающие их, показывают переключатель #bold Использовать как заговор#! после их выбора. Сглазы — это враждебные чары, наложенные на вас или вами, а фамильяры — это связанные сущности, служащие вашей воле.\n\nСписок заклинаний показывает все заклинания, которые вы знаете, или, если вы творите их через своего [Concept('court_magi','придворного мага')|E], все заклинания, которые знает #bold он#! Пустой список это не тупик - о найме и обучении мы расскажем вкратце.\n\n#bold Выберите заклинание из списка#! чтобы начать его подготовку."
 reactive_advice_magic_ritual_builder:0 "Магия 101: Построение ритуала"
 reactive_advice_magic_ritual_builder_desc:1 "Когда заклинание выбрано, левая часть становится вашим ритуалом. Если у заклинания есть варианты, #bold вкладки с подзаклинаниями#! появляются под его названием - «По умолчанию» плюс любые альтернативные деяния; выберите то, что собираетесь использовать.\n\nБольшинство заклинаний можно наложить на себя или свои земли напрямую, но многие также можно нацелить на других [Concept('characters','персонажей')|E], [Concept('titles','титулы')|E], или [Concept('artifacts','артефакты')|E], используя ячейки целей здесь. Чтобы нацелиться на другого персонажа, закройте это окно, #bold щелкните по нему правой кнопкой мыши и используйте Добавить в цели заклинания#! [character_interaction]; затем он появится здесь для выбора. Титулы и артефакты выбираются прямо из их ячеек. Будьте осторожны: [Concept('hostile_ritual','враждебный ритуал')|E] против кого-либо это преступление, если его раскроют, и каждая ячейка цели показывает ваш [Concept('spellcasting_discovery_chance','шанс раскрытия колдовств')|E] и их [Concept('magic_resistance','сопротивление магии')|E].\n\nПод целями вы найдете #bold условия сотворения#! заклятия и #bold условия активации#!; некоторые деяния требуют [Concept('full_moon','полнолуния')|E], определенной [Concept('terrain','местности')|E], или еще более странных вещей. Все условия должны быть выполнены, прежде чем ритуал сможет начаться."
 reactive_advice_magic_costs:0 "Магия 101: Затраты и шансы"
 reactive_advice_magic_costs_desc:1 "У каждого ритуала есть цена, показанная в выделенной панели: a цена в @magic_icon![Concept('mana','мане')|E] зачерпнутая из ваших резервов, и часто цена @gold_icon![Concept('gold','деньгами')|E] за материалы и помощников. Если число маны показывает #negative_value красным#!, стоимость превышает то, что у вас есть; ждите [Concept('mana_regeneration','восстановления маны')|E], или закрепите ритуал с помощью [Concept('locus','локуса')|E] (подробнее о них позже).\n\nРядом с ними отображается ваш [Concept('spellcasting_success_chance','шанс успешного колдовства')|E]. Каждое сотворение начинается с базового шанса и усложняется с уровнем заклинания; ваши навыки [Concept('gh_aspect','аспекта')|E], [Concept('arcana','аркана')|E], [Concept('court_grandeur','величие двора')|E], и подходящая [Concept('faith','конфессия')|E] — все это склоняет шансы обратно в вашу пользу. #bold Наведите курсор на процент#! чтобы увидеть полный расчет.\n\nКогда всё в порядке, кнопка #bold Сотворить заклинание#! приводит действо в движение. Преуспейте — и эффекты заклинания проявятся. Провалитесь — и ритуал дает [Concept('backfire','отдачу')|E], часто безвредную, а иногда... нет."
 reactive_advice_magic_overcharge:0 "Магия 101: Перенасыщение и локусы"
 reactive_advice_magic_overcharge_desc:1 "Могущество — предмет переговоров, в обоих направлениях.\n\n#bold Перенасыщение#!: в выделенной сетке [Concept('gh_aspect','аспектов')|E], нажмите #bold +#! чтобы перенасытить его. Каждый уровень усиливает и продлевает эффекты этого аспекта и, понижает ваш [Concept('spellcasting_success_chance','шанс успешного колдовства')|E] взамен; нажмите #bold -#! чтобы ослабить его назад. Перенасыщайте, когда эффект важнее шансов. Отчаявшийся [Concept('magi','маг')|E] может творить чудеса — или вырыть себе могилу.\n\n#bold Локусы#!: ниже, ваши [Concept('holdings','владения')|E] могут закрепить ритуал. #bold Отметьте владение#! на панели, чтобы добавить его как [Concept('locus','локус')|E], и #bold отметьте одно звездочкой#! как главный локус. Главный локус дает свой полный рейтинг аспекта за #V 1#! [Concept('gold','золота')|E] на единицу маны; каждый второстепенный стоит #V 100#! [Concept('gold','золота')|E] за включение, дает половину своего рейтинга и стоит #V 4#! [Concept('gold','золота')|E] за единицу. Количество локусов, которые можно сплести воедино, ограничено [Concept('arcana','арканой')|E] организатора - это то, как скромные маги могут позволить себе могущественные деяния."
 reactive_advice_magic_components:0 "Магия 101: Компоненты и созидание"
 reactive_advice_magic_components_desc:1 "Некоторые заклинания требуют #bold компонентов#!, реагентов, подготовленных заранее, показанных в выделенных панелях. Каждый слот компонента требует тип реагента: травяной раствор, благовоние, порошок, либация или более редкие вещи. #bold Назначьте ингредиент в каждый слот#! и дайте время на подготовку, прежде чем творить; компоненты расходуются ритуалом.\n\nИнгредиенты имеют значение: каждый несет свои склонности к аспектам и редкость, и более качественные реагенты дают более сильные чары. Заклинание, сваренное на черном Ллаудануме, — это не то же заклинание, что сварено на придорожных травах. Запасливый маг планирует заранее.\n\nЗаклинания созидания работают так же, но их компоненты — это #bold материалы и чертежи#!. Вырежьте по кости змия с правильном чертежом, и ритуал даст магический [Concept('artifact','артефакт')|E]: кольца, броши, короны, посохи и более диковинные регалии, несущие постоянные зачарования."
 reactive_advice_magic_court_magi:0 "Магия 101: Придворный маг"
 reactive_advice_magic_court_magi_desc:1 "Нет таланта к мистическим искусствам? Наймите его. [Concept('court_magi','Придворный маг')|E] это должность в [Concept('council','совете')|E] — примите [Concept('decision','решение')|E] #bold Нанять придворного мага#!, если место пустует. Когда кто-то назначен, #bold отметьте выделенный флажок Творить через#! у его портрета: ваша библиотека заклинаний заменится на #bold его#!, и его навыки будут использованы при сотворении. Он ожидает вознаграждения — переключите #bold Предложить золото#!, или потратьте [Concept('hook','рычаг влияния')|E]. Его [Concept('mana','мана')|E] запитывает ритуал, так что следите за его резервами: вы можете увидеть их на экране Совета.\n\nПридворный Маг также будет обучать детей с даром, передавая свою [Concept('magic_type','школу магии')|E] следующему поколению.\n\nто касается изучения магии самому: желающий этого (или не желающий) маг может научить вас. Используйте [Concept('schemes','происки')|E] #bold Изучить школу магии#! и #bold Изучить заклинание#! против знающей цели,или украдите заклинание напрямую, если ваша [Concept('intrigue','интрига')|E] превосходит их бдительность. Вы также можете найти [Concept('artifacts','артефакты')|E] содержащие [Concept('knowledge_entries','записи знаний')|E], которые можно изучить с помощью происков и выучить по ним заклинания."
 reactive_advice_magic_risks:0 "Магия 101: Цена могущества"
 reactive_advice_magic_risks_desc:1 "Выделенная шкала отслеживает вашу [Concept('mana','ману')|E] относительно вашего [Concept('magic_baseline','магического порога')|E] — и это также ваше раннее предупреждение. Сотворение заклятий, места силы и магические импульсы окружающей среды могут поднять ваши запасы за пределы того, что ваше тело может проводить, повышая ваш [Concept('exposure_level','уровень облучения')|E]; шкала светится ярче по мере его роста.\n\nДлительное [Concept('magic_exposure','магическое воздействие')|E] приносит [Concept('exposure_sickness','магическую немочь')|E]: вы временно получите [Concept('trait','свойство')|E] [GetTrait('gh_magicsickness_1').GetName( GetNullCharacter )], страдая от ухудшающегося здоровья и растущего риска [Concept('mutations','мутаций')|E]. Воздействие [Concept('aftoenischi_effect','ослабевает')|E] со временем, если вы проявляете сдержанность.\n\n[Concept('overwhelmation','Перегрузка')|E] это совсем иной зверь: немедленное, жестокое последствие сотворения далеко за пределами ваших возможностей, обычно через [Concept('backfire','отдачу')|E] проваленного ритуала. Там, где болезнь задерживается, перегрузка молниеносно наносит удар; самовозгорание, дезинтеграция, или ещё хуже.\n\nПравила выживания просты: держите запасенную вами [Concept('mana','ману')|E] на уровне или ниже вашего [Concept('magic_baseline','магического порога')|E], отдыхайте между великими деяниями и никогда не перенасыщайте то, что не можете позволить себе потерять. Уважайте свои пределы, и обе незавидные участи останутся вам чужды."
 reactive_advice_magic_gedeora:0 "Магия 101: Гедеоры"
 reactive_advice_magic_gedeora_desc:1 "Мир сотворяет обратно. [Concept('gedeora','Гедеора')|E] — это спонтанный всплеск дикой магии, который омывает регион; как часто они происходят и насколько сильны, зависит от ваших правил игры.\n\nКогда гедеора поражает ваше местоположение и вы подпадаете под ее параметры, она может попытаться переписать саму вашу личность. Вы можете сопротивляться, ценой значительного [Concept('stress','стресса')|E], и может оставить за собой [Concept('traits','свойства')|E]-последствия, добро или злокачественные.\n\nПриглядывайте за [Concept(ambient_magic','окружающей магией')|E] земель, которыми вы правите, за [Concept('waylines','лей-линиями')|E] несущими силу через [Concept('aeras','Эрас')|E], и за [Concept('moon_phase','фазой луны')|E]. Магия — это никогда не только то, что вы делаете с ней, но и то, что она делает с вами."

 reactive_advice_magic_click_on_magic:1 "Нажмите на вашу шкалу [Concept('mana','маны')|E]\n#low Она находится рядом со шкалой [Concept('stress','стресса')|E] на вашем HUD. Она заполняется по мере того, как ваша запасенная [Concept('mana','мана')|E] приближается к вашему [Concept('magic_baseline','магическому порогу')|E], и светится соответственно вашему [Concept('exposure_level','уровню облучения')|E]!#!"
 reactive_advice_magic_select_a_spell:0 "Выберите заклинание из вашей библиотеки\n#low Щелкните любой [Concept('gh_ritual','ритуал')|E]  списке справа, чтобы открыть его подготовку. У вас нет заклинаний? Вы всё равно можете продолжать.#!"

