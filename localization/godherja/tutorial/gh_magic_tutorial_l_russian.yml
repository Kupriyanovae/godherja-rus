 action_too_many_children:0 "Слишком много детей при дворе"
 action_too_many_children_label:0 "Слишком много детей при дворе"
 action_too_many_children_desc:0 "Вокруг вас слишком много детей, и некоторых следует отправить на перерождение."
 action_too_many_children_click:0 "#I Щелкните, чтобы отправить некоторых в Яму#!"
