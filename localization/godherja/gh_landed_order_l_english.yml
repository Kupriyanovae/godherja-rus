 LANDED_ORDER_VIGIL_AI_RIGHTEOUS:0 "Righteous"
 LANDED_ORDER_VIGIL_AI_CRAVEN:0 "Afraid of the Eye"

 landed_order_vigil_denounce_interaction:0 "Denounce the Eye"
 landed_order_vigil_denounce_interaction_desc:0 "Name the Order of the Forgotten Saint as servants of 'the Eye,' before all the [Concept('landed_order','Orders')|E]. Your proof: #V [actor.MakeScope.ScriptValue('landed_order_vigil_evidence_value')|0]#! of the #V 12#! needed."
 landed_order_vigil_denounce_success_tt:0 "The Order of the Forgotten Saint is #V Anathema#!, and every servant of the Eye you know of is exposed"
 landed_order_vigil_denounce_backfire_tt:0 "Without enough proof, the Orders take you for a madman: you lose [doctrine_standing|E] and [prestige|E], are #N Called Mad#! for #V 10#! years, and the Forgotten Saint's [order_authority|E] rises"
 landed_order_vigil_denounce_failed_toast:0 "Called Mad"
 landed_order_vigil_denounce_failed_tt:0 "The Orders would not believe you"
 landed_order_vigil_informant_toast:0 "A Confidant Reports"
 landed_order_vigil_informant_toast_tt:0 "[landed_order_vigil_informant.GetShortUIName|U] tells you that [landed_order_vigil_reported.GetShortUIName] is [Concept('landed_order_eye_sworn','Eyesworn')|E]"
 tooltip_landed_order_elector_vote_hidden_trust:0 "Unspoken Trust"

 task_find_secrets_vigil_watch_desc:0 "\nWhile the [landed_order_whispers|E] lasts, your spymaster also watches the [Concept('landed_order','Landed Orders')|E] for the servants of the Eye:\n$TAB$[SCOPE.ScriptValue('landed_order_vigil_watch_chance_value')|0]#P %#! chance each month of learning that someone is [Concept('landed_order_eye_sworn','Eyesworn')|E], most likely in an Order or at the court searched"


