 gh_landed_order.0090.t:0 "Every Order Kneels"
 gh_landed_order.0090.desc:0 "No herald proclaims it, and no Chapter records it. Yet from the oldest Chapter house to the newest [commandery|E], every [landed_order|E] now answers in secret to [GetBuilding('01_the_eye').GetName]. Those who would not see have been outvoted, outlived or silenced.\n\nWhat the Order of the Forgotten Saint means to do with them, no one outside their halls can say."
 gh_landed_order.0090.a:0 "So it is."
 gh_landed_order.0091.t:0 "The Whispers Fall Silent"
 gh_landed_order.0091.desc:0 "The Order of the Forgotten Saint stands exposed and anathema. Its servants have been named, one after another, and not one [ordermaster|E] still kneels to [GetBuilding('01_the_eye').GetName]. The whispers in the Chapter houses have fallen silent.\n\nWhether they are gone, or only waiting, is another matter."
 gh_landed_order.0091.a:0 "Let them stay silent."

 # Landed Order rework: the Vigil (the Conspiracy of Whispers)
 game_concept_landed_order_vigil:0 "The Vigil"
 game_concept_landed_order_vigil_desc:1 "The Eosians' answer to the Eye: a network of trust kept by the [ordermaster|E] of the Forlorn Guardian within the other [Concept('landed_order','Landed Orders')|E], in the [landed_order_whispers|E].\n\nThe Ordermaster and the Order's [Concept('komtur','Komturs')|E] win [Concept('landed_order_vigil_confidant','Confidants')|E] with the #V Win Their Trust#! [scheme|E], and may ask a Confidant to stand openly as a [Concept('landed_order_vigil_confederate','Confederate')|E]. They try to win back the [Concept('landed_order_eye_sworn','Eyesworn')|E] whose secrets they know with #V Break the Gaze#!, and the Ordermaster's spymaster, set to #V Find Secrets#!, also watches the Orders for the Eye's servants.\n\nWith enough proof (#V 12#!: #V 1#! for each servant of the Eye the Ordermaster knows of, #V 1#! for each Confederate, #V 3#! for a Confederate [ordermaster|E]), the Ordermaster may #V Denounce the Eye#!: the Order of the Forgotten Saint becomes anathema, and every servant of the Eye they know of is exposed. Without it, the Ordermaster is taken for a madman."
 game_concept_landed_order_vigil_confidant:0 "Confidant of the Vigil"
 game_concept_landed_order_vigil_confidant_desc:0 "One secretly in the confidence of the Eosians' [ordermaster|E]. Confidants carry a [secret|E], criminal wherever the head of their [landed_order|E] serves the Eye. They may shrug off the Eye's attempts to open their gaze, and some report the Eye's servants in their own Order."
 game_concept_landed_order_vigil_confederate:0 "Confederate of the Vigil"
 game_concept_landed_order_vigil_confederate_desc:0 "A [Concept('landed_order_vigil_confidant','Confidant')|E] who stands openly with the Eosians. A Confederate who rules an independent realm also joins the Vigil's [Concept('confederation','confederation')|E]. Confederates are harder still for the Eye to win, report its servants more often, and count toward the proof needed to #V Denounce the Eye#!."
 vigil_confidant:0 "Confidant of the Vigil"
 vigil_confidant_desc:0 "In secret, they share the Vigil's confidence."
 vigil_confederate:0 "Confederate of the Vigil"
 vigil_confederate_desc:0 "They stand openly together against the Eye."
 secret_vigil_confidant:0 "Confidant of the Vigil"
 secret_vigil_confidant_desc:0 "Secretly in the confidence of the Eosians"
 secret_vigil_confidant_tooltip_desc:0 "This character is secretly a [Concept('landed_order_vigil_confidant','Confidant of the Vigil')|E], in league with the Order of the Forlorn Guardian against the Eye. Exposed, they are a criminal wherever the head of their [landed_order|E] serves the Eye."
 secret_vigil_confidant_type_desc:0 "$secret_vigil_confidant_tooltip_desc$"
 landed_order_eye_anathema_modifier:0 "Anathema"
 landed_order_eye_anathema_modifier_desc:0 "The Order of the Forgotten Saint has been denounced before all the Orders as the servant of the mysterious horror known simply as 'The Eye.'"
 landed_order_vigil_called_mad_modifier:0 "Called Mad"
 landed_order_vigil_called_mad_modifier_desc:0 "This ruler denounced the Order of the Forgotten Saint without proof, and the Orders took them for a madman."
