 LANDED_ORDER_WHISPERS_VIGIL_VIEW_HEADER:0 "What the Vigil Knows"
 LANDED_ORDER_VIGIL_REACH_LABEL:0 "The Vigil's Reach"
 LANDED_ORDER_VIGIL_REACH_TT:0 "How far the [landed_order_vigil|E] reaches into the other [Concept('landed_order','Orders')|E] through its allies: the Eye's weights for Corruption, a Confidant counting for less than a Confederate."
 LANDED_ORDER_WHISPERS_REACH_VALUE:0 "#high [Situation.MakeScope.ScriptValue('landed_order_whispers_vigil_reach_value')|0]%#!"
 LANDED_ORDER_WHISPERS_VIGIL_COUNTS:0 "#V [Situation.MakeScope.Var('vigil_ally_count').GetValue|0]#! allies of the [landed_order_vigil|E], #V [Situation.MakeScope.Var('vigil_confederate_count').GetValue|0]#! of them [Concept('landed_order_vigil_confederate','Confederates')|E]."
 LANDED_ORDER_VIGIL_ALLIES_LABEL:0 "Allies of the Vigil"
 LANDED_ORDER_WHISPERS_KNOWN_SWORN_HEADER:0 "Known Servants of the Eye"

 gh_landed_order.0092.t:0 "An Offer of Trust"
 gh_landed_order.0092.desc:0 "[owner.GetTitledFirstName] has been a careful friend these past months, and tonight [owner.GetSheHe] spoke of what [owner.GetSheHe] had been circling all along.\n\n\"Something is rotten in the Orders, [ROOT.Char.GetFirstName]. Men and women who kneel to Saint and Chapter by day, kneel to something...otherworldly, by night. The Eosians keep watch against it, and we need eyes we can trust. Will you be one of them?\""
 gh_landed_order.0092.a:0 "You can trust me."
 gh_landed_order.0092.a.tt:0 "You become a [Concept('landed_order_vigil_confidant','Confidant of the Vigil')|E]"
 gh_landed_order.0092.b:0 "I want no part of this."
 gh_landed_order.0092.b.tt:0 "You turn the Vigil away, and will not hear it again for #V 10#! years"
 gh_landed_order.0093.t:0 "Out of the Eye's Sight"
 gh_landed_order.0093.desc:0 "[owner.GetTitledFirstName] knows. [owner.GetSheHe|U] did not say how, and did not need to: the way [owner.GetSheHe] spoke of the Eye, of the whispers and the oaths, left no doubt.\n\n\"It is not too late,\" [owner.GetSheHe] said. \"Walk away from it, and the Vigil will stand between you and those who would make you pay for it.\""
 gh_landed_order.0093.a:0 "I am done with the Eye."
 gh_landed_order.0093.a.tt:0 "You are no longer [Concept('landed_order_eye_sworn','Eyesworn')|E], and become a [Concept('landed_order_vigil_confidant','Confidant of the Vigil')|E]"
 gh_landed_order.0093.b:0 "You understand nothing."
 gh_landed_order.0093.b.tt:0 "You stay with the Eye, and will not hear the Vigil again for #V 10#! years"
 gh_landed_order.0094.t:0 "The Eye Denounced"
 gh_landed_order.0094.desc:0 "Before the assembled Chapters, [landed_order_vigil_master.GetTitledFirstName] of the Forlorn Guardian has named the Order of the Forgotten Saint as servants of something they call 'the Eye,' a malevolent force deep beneath [Glossary('Al-Ghazir','al_ghazir_encyclopedia_desc')], and laid the proof before the other orders. Names, oaths and letters, one after another.\n\nThe whispers are out in the open now. The Order of the Forgotten Saint will not be able to stand against this for long."
 gh_landed_order.0094.a:0 "So it was true."

 # Learn the Truth (the Conspiracy of Whispers)
 landed_order_whispers_truth:0 "Learn the Truth"
 landed_order_whispers_truth_desc:0 "I will follow the whispers among the Orders to their source."
 landed_order_whispers_truth_desc_general:0 "$landed_order_whispers_truth_general_desc$"
 landed_order_whispers_truth_general_desc:0 "Follow the whispers among the [Concept('landed_order','Landed Orders')|E] to their source, by [intrigue|E] and [arcana|E]. Succeed, and you learn what the Order of the Forgotten Saint hides, and may choose a side."
 landed_order_whispers_truth_action:0 "Learn the Truth"
 LANDED_ORDER_WHISPERS_TRUTH_SUCCESS_DESC:0 "You learn the truth behind the whispers, and may serve the Eye or stand with the Vigil."
 landed_order_whispers_truth_invalidated_title:0 "@scheme_icon! Learn the Truth Scheme Ends"
 landed_order_whispers_truth_invalidated_tt:0 "You can no longer follow the whispers."
 landed_order_whispers_truth_interaction:0 "Learn the Truth #weak (Scheme)#!"
 landed_order_whispers_truth_interaction_desc:0 "Start a [scheme|E] to follow the whispers among the Orders to their source. Its success rests on your [intrigue|E] and [arcana|E]."
 landed_order_whispers_truth_interaction_effect_tt:0 "You start the #V Learn the Truth#! [scheme|E]"
 landed_order_whispers_truth_already_tt:0 "You are already following the whispers"
 landed_order_whispers_truth_cold_tt:0 "The trail went cold: you cannot follow it again yet"
 landed_order_whispers_truth_no_slot_toast:0 "No Room for Another Scheme"
 landed_order_whispers_truth_no_slot_tt:0 "You need a free personal [scheme|E] slot to follow the whispers."
 landed_order_whispers_truth_failure_toast:0 "The Trail Goes Cold"
 landed_order_whispers_truth_failure_tt:0 "You learn nothing certain, and cannot follow the whispers again for #V 5#! years."
 SCHEME_WHISPERS_TRUTH_INTRIGUE:0 "Your [intrigue|E]: $VALUE|+=0$"
 SCHEME_WHISPERS_TRUTH_ARCANA:0 "Your [arcana|E]: $VALUE|+=0$"
 gh_landed_order.0095.t:0 "The Truth Behind the Whispers"
 gh_landed_order.0095.desc:0 "The whispers were true. The Order of the Forgotten Saint has been swearing the members of the other Orders, one by one, to something they calls'the Eye', while the Eosians of the Forlorn Guardian have stood against it. Now that I know, I cannot pretend that I do not."
 gh_landed_order.0095.desc.revealed:0 "\n\nAnd one of the sworn has a name: [landed_order_truth_revealed.GetTitledFirstName]."
 gh_landed_order.0095.a:0 "I will serve the Forgotten Saint's vision."
 gh_landed_order.0095.a.tt:0 "You become secretly [Concept('landed_order_eye_sworn','Eyesworn')|E]"
 gh_landed_order.0095.b:0 "I will stand with the Vigil."
 gh_landed_order.0095.b.tt:0 "You become a secret [Concept('landed_order_vigil_confidant','Confidant of the Vigil')|E] of [landed_order_vigil_master.GetShortUIName]"
 gh_landed_order.0095.c:0 "I will keep this to myself."
 gh_landed_order.0095.c.tt:0 "You take no side, for now"
 # The window's schemes, and what the Situation is
 LANDED_ORDER_WHISPERS_SCHEMES_HEADER:0 "Schemes of the Whispers"
 LANDED_ORDER_WHISPERS_SCHEME_YOURS:0 "#P You can use this#!"
 LANDED_ORDER_WHISPERS_SCHEME_EYE_NAME:0 "#high Open Their Eyes#!"
 LANDED_ORDER_WHISPERS_SCHEME_EYE_DESC:0 "The Forgotten Saint's Ordermaster, Marshals and Komturs, and the Eye's puppets, swear a member of another Order to the Eye."
 LANDED_ORDER_WHISPERS_SCHEME_TRUST_NAME:0 "#high Win Their Trust#!"
 LANDED_ORDER_WHISPERS_SCHEME_TRUST_DESC:0 "The Forlorn Guardian's Ordermaster and officeholders make a member of another Order a Confidant of the Vigil."
 LANDED_ORDER_WHISPERS_SCHEME_GAZE_NAME:0 "#high Break the Gaze#!"
 LANDED_ORDER_WHISPERS_SCHEME_GAZE_DESC:0 "The Forlorn Guardian's Ordermaster and officeholders win one of the sworn they know of back from the Eye."
 LANDED_ORDER_WHISPERS_SCHEME_TRUTH_NAME:0 "#high Learn the Truth#!"
 LANDED_ORDER_WHISPERS_SCHEME_TRUTH_DESC:0 "Agionists who serve neither side follow the whispers to their source through [intrigue|E] and [arcana|E]."
 LANDED_ORDER_WHISPERS_SUMMARY:0 "The Order of the Forgotten Saint has maintained a dark secret since they first stept on [Glossary('Al-Ghazir','al_ghazir_encyclopedia_desc')], while the Eosians of the Forlorn Guardian race to expose it.."
