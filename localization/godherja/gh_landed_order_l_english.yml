l_english:
 LANDED_ORDER_AUTHORITY_METER:0 "[order_authority|E]: #V [GetPlayer.MakeScope.ScriptValue('landed_order_authority_display_value')|0]#!/100"
 LANDED_ORDER_AUTHORITY_METER_TT:0 "#T Order Authority#!\nThe Chapter's obedience to its [ordermaster|E]. It sets the Order's Authority law:\n$BULLET_WITH_TAB$Below 25: $order_authority_0$\n$BULLET_WITH_TAB$25 to 49: $order_authority_1$\n$BULLET_WITH_TAB$50 to 74: $order_authority_2$\n$BULLET_WITH_TAB$75 or more: $order_authority_3$\n\n#T Rises#!\n$BULLET_WITH_TAB$Each year, with every officeholder whose [opinion|E] of you is 40 or more\n$BULLET_WITH_TAB$Convening a [chapter_general|E]\n$BULLET_WITH_TAB$Winning a [reaffirmation_vote|E], the more so at a [snap_conclave|E]\n$BULLET_WITH_TAB$Beating a [reaffirmation_faction|E] in war\n\n#T Falls#!\n$BULLET_WITH_TAB$Each year, with every officeholder whose [opinion|E] of you is negative\n$BULLET_WITH_TAB$Imprisoning a member of the Order, or revoking a title from a vassal, of your own faith\n$BULLET_WITH_TAB$By a quarter when the [ordermaster|E] dies\n$BULLET_WITH_TAB$Losing a [reaffirmation_vote|E]\n$BULLET_WITH_TAB$Fighting a [reaffirmation_faction|E] to a standstill"
 LANDED_ORDER_AUTHORITY_SET_BY_METER:0 "[order_authority|E] is not decreed: it follows the Chapter's obedience (#V [GetPlayer.MakeScope.ScriptValue('landed_order_authority_display_value')|0]#!/100)"
 landed_order_authority_toast_order_authority_0:0 "Order Authority: $order_authority_0$"
 landed_order_authority_toast_order_authority_1:0 "Order Authority: $order_authority_1$"
 landed_order_authority_toast_order_authority_2:0 "Order Authority: $order_authority_2$"
 landed_order_authority_toast_order_authority_3:0 "Order Authority: $order_authority_3$"
 landed_order_authority_toast_desc:0 "The Chapter's obedience to its [ordermaster|E] has changed, and [order_authority|E] with it."

 CB_LANDED_ORDER_STANDING_VENERATED:0 "$landed_order_legitimacy_level_4_flavor$ Order"
 CB_LANDED_ORDER_STANDING_EXALTED:0 "$landed_order_legitimacy_level_5_flavor$ Order"

 convene_chapter_general_interaction:0 "Convene a Chapter General"
 convene_chapter_general_interaction_desc:0 "Summon the Komturs and Marshals of the Order to the Chapter house, to hear their counsel and remind them whose writ they serve."
 convene_chapter_general_interaction_effect_tt:0 "[order_authority|E] rises by #P 8#!, plus half your [diplomacy|E] (at most #P 20#!)"

 # Doctrine Standing level flags (landed_order_legitimacy), shown in the Standing level's tooltip
 landed_order_standing_low:0 "The Ordermaster and the Order's officeholders of its faith #negative_value lose#! [spiritual_fulfillment|E] each year"
 landed_order_standing_high:0 "The Ordermaster and the Order's officeholders of its faith #positive_value gain#! [spiritual_fulfillment|E] each year"
 landed_order_strain_relief_venerated:0 "[chapter_strain|E] #positive_value -10#!"
 landed_order_strain_relief_exalted:0 "[chapter_strain|E] #positive_value -20#!"
 landed_order_holy_war_favoured:0 "[holy_war|E] [piety|E] cost #positive_value -15%#!"
 landed_order_holy_war_exalted:0 "[holy_war|E] [piety|E] cost #positive_value -30%#!, and a [holy_war|E] won brings [prestige|E]"
 landed_order_standing_fulfillment_high_toast:0 "The Order's Standing Uplifts Its Members"
 landed_order_standing_fulfillment_low_toast:0 "The Order's Disgrace Weighs on Its Members"
 CONVENE_CHAPTER_GENERAL_NEEDS_OFFICEHOLDERS:0 "At least two officeholders of the Order serve you directly"

 # Commanderies
 LANDED_ORDER_COMMANDERY_NAME:0 "Commandery of [landed_order_commandery_seat.GetNameNoTierNoTooltip]"
 found_commandery_interaction:0 "Found a Commandery"
 found_commandery_interaction_desc:0 "Raise [recipient.GetShortUIName] to Komtur of a new Commandery of the Order. A Komtur raised this way is an officeholder of the Order with no county of their own."
 found_commandery_interaction_effect_tt:0 "[recipient.GetShortUIName] becomes the [komtur|E] of a new [commandery|E], seated at the most developed county of the Order that seats none yet"
 FOUND_COMMANDERY_NEEDS_SEAT:0 "A county of the Order seats no [commandery|E] yet"
 FOUND_COMMANDERY_NEEDS_SPARE:0 "The Order can still found a [commandery|E]"
 GRANT_TITLES_ITEM_CANT_GIVE_COMMANDERY:0 "A [commandery|E] is an office of the Chapter: it cannot be granted, and passes by Chapter Appointment"
 landed_order_imprison_authority_tt:0 "[order_authority|E] falls by #N 6#!, for imprisoning a member of the Order of your own [faith|E]"
 landed_order_imprison_standing_tt:0 "[doctrine_standing|E] rises, for bringing a heretical officeholder to account"
 landed_order_revoke_authority_tt:0 "[order_authority|E] falls by #N 4#!, for revoking a [title|E] from a vassal of your own [faith|E]"
 landed_order_revoke_standing_tt:0 "[doctrine_standing|E] rises, for stripping a vassal of another [faith|E] of their [title|E]"
 found_commandery_vows_tt:0 "Is unmarried, as the Order's vows require"
 # Phase 3: the Merit Threshold and Reaffirmation Votes
 landed_order_standing_disgraced:0 "Should [order_authority|E] also fall below #V 25#!, the Order's officeholders may form a [reaffirmation_faction|E] against the [ordermaster|E]"

 gh_landed_order.0010.t:0 "The Chapter Will Vote"
 gh_landed_order.0010.desc_intro:0 "The Komturs and Marshals of [ROOT.Char.GetPrimaryTitle.GetNameNoTier] are summoned to the Chapter house, to decide whether I am still fit to be their Ordermaster.\n\n"
 gh_landed_order.0010.desc_censure:0 "I agreed to answer to [landed_order_caller.GetShortUIName] and the members of [landed_order_caller.GetHerHis] faction, but no Snap Conclave has met to hear them. The Chapter will vote without one."
 gh_landed_order.0010.desc_censure_unled:0 "I agreed to answer to the Chapter's Reaffirmation Faction, but no Snap Conclave has met to hear it. The Chapter will vote without one."
 gh_landed_order.0010.desc_tally:0 "\n\nWere the Chapter to vote today, #P [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_for').GetValue )|0]#! of its votes would reaffirm me, and #N [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_against').GetValue )|0]#! would not."
 gh_landed_order.0010.a:0 "Then let me win them back before the month is out."
 gh_landed_order.0010.a.tt:0 "The Chapter votes in #V 30#! days. An elector votes by their [opinion|E] of you, the Order's [doctrine_standing|E] and [order_authority|E], whether you clear the Chapter's [merit_threshold|E], and their [clique|E]. Lose, and you abdicate to the [chapter_conclave|E]'s choice."

 gh_landed_order.0012.t:0 "The Chapter Reaffirms Its Ordermaster"
 gh_landed_order.0012.desc:0 "The Chapter has voted, #P [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_for').GetValue )|0]#! to #N [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_against').GetValue )|0]#!, and I remain the Ordermaster of [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Those who doubted me have had their say, and lost it."
 gh_landed_order.0012.desc_snap:0 "[landed_order_caller.GetShortUIName] called the Chapter together to cast me out, and the Chapter would not have it: #P [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_for').GetValue )|0]#! to #N [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_against').GetValue )|0]#!. My accuser leaves the Chapter house humbled, and my writ the stronger for it."
 gh_landed_order.0012.desc_deadlock:0 "The Chapter has voted against me, #N [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_against').GetValue )|0]#! to #P [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_for').GetValue )|0]#!, but could agree on no one to put in my place. Until it can, the office is still mine."
 gh_landed_order.0012.a:0 "The Chapter has spoken well."
 gh_landed_order.0012.a.tt:0 "[order_authority|E] rises (#P +8#!, #P +12#! at a [snap_conclave|E]), and the faction's leader loses [prestige|E]. The Chapter cannot censure you again for #V 3#! years."
 gh_landed_order.0012.b:0 "A reprieve, and no more."
 gh_landed_order.0012.b.tt:0 "Nothing changes. The Chapter cannot censure you again for #V 3#! years."

 gh_landed_order.0014.t:0 "Cast Out by the Chapter"
 gh_landed_order.0014.desc:0 "The Chapter has voted, #N [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_against').GetValue )|0]#! to #P [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_for').GetValue )|0]#!, that I am no longer fit to lead it."
 gh_landed_order.0014.desc_snap:0 "[landed_order_caller.GetShortUIName] called the Chapter together to cast me out, and the Chapter agreed, #N [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_against').GetValue )|0]#! to #P [FixedPointToFloat( ROOT.Char.MakeScope.Var('landed_order_votes_for').GetValue )|0]#!."
 gh_landed_order.0014.desc_censure_war:0 "The Chapter took up arms against me behind [landed_order_caller.GetShortUIName], and I could not hold the Order against it. What it could not win by its vote, it has won in the field, and [landed_order_successor.GetShortUIName] has had me put in chains."
 gh_landed_order.0014.desc_outro:0 "\n\n[landed_order_successor.GetShortUIName] is the Ordermaster of [landed_order_office.GetNameNoTier] now. I keep my Commandery, and with it my seat in the Chapter: a Komtur once more, among fellow members who will remember how I fell, and how I bore it."
 gh_landed_order.0014.a:0 "I will serve the Order from the Chapter's ranks."
 gh_landed_order.0014.a.tt:0 "You play on as a [komtur|E] of the Order."
 gh_landed_order.0014.b:0 "The Order endures. I follow its office."
 gh_landed_order.0014.b.tt:0 "You play on as the new [ordermaster|E], [landed_order_successor.GetShortUIName]."

 gh_landed_order.0015.t:0 "The Chapter's Vote"
 gh_landed_order.0015.desc:0 "The Chapter is to vote on whether [landed_order_master.GetShortUIName] is still fit to be our Ordermaster, and my vote counts among the rest. Should the vote go against [landed_order_master.GetHerHim], the Chapter Conclave's choice takes the office."
 gh_landed_order.0015.a:0 "I will vote to reaffirm [landed_order_master.GetHerHim]."
 gh_landed_order.0015.b:0 "I will vote to cast [landed_order_master.GetHerHim] out."
 gh_landed_order.0015.c:0 "I will weigh it when the day comes."
 gh_landed_order.0015.c.tt:0 "You vote by your own [opinion|E] of the [ordermaster|E] and the Order's fortunes, as the AI electors do"

 landed_order_elected_by_reaffirmation_toast:0 "The Chapter Raises You to Ordermaster"
 landed_order_elected_by_reaffirmation_toast_desc:0 "The Chapter has cast out [landed_order_deposed.GetShortUIName], and the Chapter Conclave's choice was you."

 # The Snap Conclave
 activity_landed_order_snap_conclave:0 "Snap Conclave"
 activity_landed_order_snap_conclave_desc:0 "When an [ordermaster|E] submits to a [reaffirmation_faction|E]'s demand, the faction's leader summons the Chapter to the [ordermaster|E]'s own seat to vote on whether the [ordermaster|E] is still fit to lead it. The Chapter takes sides in person: the faction's members against the [ordermaster|E], the rest as they judge, and the undecided may yet be swayed before the vote."
 activity_landed_order_snap_conclave_province_desc:0 "Summon the Chapter to the Ordermaster's own seat."
 activity_landed_order_snap_conclave_host_desc:0 "Summon the Chapter, and put the Ordermaster's fitness to a vote."
 activity_landed_order_snap_conclave_guest_desc:0 "The Chapter is summoned to vote on whether the Ordermaster is still fit to lead it."
 activity_landed_order_snap_conclave_conclusion_reaffirmed:0 "The Chapter would not cast out its Ordermaster, and the challenger leaves the Chapter house humbled."
 activity_landed_order_snap_conclave_conclusion_deposed:0 "The Chapter has cast out its Ordermaster, and the Chapter Conclave's choice takes the office."
 TRAVEL_NAME_FOR_activity_landed_order_snap_conclave:0 "[Character.GetFirstNamePossessiveNoTooltip] journey to the Snap Conclave"
 landed_order_snap_conclave_phase_chapter:0 "The Chapter in Session"
 landed_order_snap_conclave_phase_chapter_desc:0 "The Chapter debates the Ordermaster's fitness, and its factions court the undecided, before it votes."
 landed_order_snap_conclave_start_log_title:0 "The Chapter Is Summoned"
 landed_order_snap_conclave_start_log:0 "[CHARACTER.GetTitledFirstName] summoned the Chapter to vote on the Ordermaster."
 activity_window_character_accused:0 "The Ordermaster"
 landed_order_snap_conclave_nominated_tt:0 "You lead a [reaffirmation_faction|E] whose demand the [ordermaster|E] has accepted"
 landed_order_snap_conclave_accepted_tt:0 "The [ordermaster|E] has agreed to answer to the Chapter"
 landed_order_snap_conclave_not_convened_tt:0 "The Chapter has not already been summoned"
 landed_order_snap_conclave_no_vote_pending_tt:0 "The Chapter is not already voting on the [ordermaster|E]"
 landed_order_snap_conclave_grace_tt:0 "The [ordermaster|E] has not been reaffirmed, or begun their reign, in the past three years"

 activity_invite_rule_landed_order_chapter:0 "The Chapter"
 activity_invite_rule_landed_order_chapter_desc:0 "The Ordermaster, and the electors of the Chapter Conclave"

 landed_order_conclave_deliberate_intent:0 "Weigh the Charges"
 landed_order_conclave_deliberate_intent_desc:0 "Take a side by your own judgement of the Ordermaster."
 landed_order_conclave_stand_by_master_intent:0 "Stand by the Ordermaster"
 landed_order_conclave_stand_by_master_intent_desc:0 "Vote to reaffirm the Ordermaster."
 landed_order_conclave_back_motion_intent:0 "Back the Motion"
 landed_order_conclave_back_motion_intent_desc:0 "Vote to cast the Ordermaster out."
 landed_order_conclave_defend_office_intent:0 "Defend Your Office"
 landed_order_conclave_defend_office_intent_desc:0 "Work on the Dissenters, to win them back before the vote."
 landed_order_conclave_press_motion_intent:0 "Press the Motion"
 landed_order_conclave_press_motion_intent_desc:0 "Work on the Loyalists, to win them to your side before the vote."

 LANDED_ORDER_CONCLAVE_LOYALIST_LABEL:0 "Loyalists"
 LANDED_ORDER_CONCLAVE_LOYALIST_LABEL_HOVER:0 "#T Loyalists#!\nElectors of the Chapter who will vote to reaffirm the [ordermaster|E]. Electors who stay away vote by their [opinion|E] of the [ordermaster|E], and against them if the [ordermaster|E] stays away too."
 LANDED_ORDER_CONCLAVE_DISSENTER_LABEL:0 "Dissenters"
 LANDED_ORDER_CONCLAVE_DISSENTER_LABEL_HOVER:0 "#T Dissenters#!\nElectors of the Chapter who will vote to cast the [ordermaster|E] out, the [reaffirmation_faction|E]'s members among them. If they carry the vote, the [chapter_conclave|E]'s choice takes the office."

 gh_landed_order.0020.t:0 "The Chapter in Session"
 gh_landed_order.0020.desc_host:0 "The Komturs and Marshals are gathered, and I have laid the charges before them: that under [landed_order_master.GetShortUIName] the Order has lost the faith's regard, and must find a worthier Ordermaster."
 gh_landed_order.0020.desc_accused:0 "The Chapter is gathered in my own Chapter house, to hear [landed_order_conclave_host.GetShortUIName] charge that I have brought the Order into disgrace. I must answer, and win back those who doubt me before the vote."
 gh_landed_order.0020.desc_guest:0 "The Chapter is gathered to hear [landed_order_conclave_host.GetShortUIName] charge [landed_order_master.GetShortUIName] with bringing the Order into disgrace, and to vote on whether [landed_order_master.GetSheHe] is still fit to lead it."
 gh_landed_order.0020.desc_tally:0 "\n\nAs things stand, #P [FixedPointToFloat( landed_order_master.MakeScope.Var('landed_order_votes_for').GetValue )|0]#! of the Chapter's votes would reaffirm the Ordermaster, and #N [FixedPointToFloat( landed_order_master.MakeScope.Var('landed_order_votes_against').GetValue )|0]#! would not."
 gh_landed_order.0020.a:0 "Let the debate begin."

 gh_landed_order.0021.t:0 "A Wavering Elector"
 gh_landed_order.0021.desc:0 "[landed_order_conclave_target.GetShortUIName] has sided with my accuser, but I see doubt in [landed_order_conclave_target.GetHerHis] face. A word in private might yet bring [landed_order_conclave_target.GetHerHim] back to me."
 gh_landed_order.0021.a:0 "Remind [landed_order_conclave_target.GetHerHim] of the oath we swore."
 gh_landed_order.0021.a.success:0 "[landed_order_conclave_target.GetShortUIName] is moved"
 gh_landed_order.0021.a.failure:0 "[landed_order_conclave_target.GetShortUIName] is unmoved"
 gh_landed_order.0021.b:0 "The Order is generous to its friends."
 gh_landed_order.0021.c:0 "[landed_order_conclave_target.GetSheHe|U] has made [landed_order_conclave_target.GetHerHis] choice."
 gh_landed_order.0021.won_over_tt:0 "[landed_order_conclave_target.GetShortUIName] joins the #V Loyalists#!"
 gh_landed_order.0021.unmoved_tt:0 "[landed_order_conclave_target.GetShortUIName] remains among the #V Dissenters#!"

 gh_landed_order.0022.t:0 "A Loyalist Shaken"
 gh_landed_order.0022.desc:0 "[landed_order_conclave_target.GetShortUIName] stands by [landed_order_master.GetShortUIName], but out of habit more than conviction. Shown plainly what the Order has lost, [landed_order_conclave_target.GetSheHe] might yet see sense."
 gh_landed_order.0022.a:0 "Recount the Order's disgrace, deed by deed."
 gh_landed_order.0022.a.success:0 "[landed_order_conclave_target.GetShortUIName] is persuaded"
 gh_landed_order.0022.a.failure:0 "[landed_order_conclave_target.GetShortUIName] is unpersuaded"
 gh_landed_order.0022.b:0 "Promise [landed_order_conclave_target.GetHerHim] a better place under a new Ordermaster."
 gh_landed_order.0022.c:0 "[landed_order_conclave_target.GetSheHe|U] will not be moved."
 gh_landed_order.0022.won_over_tt:0 "[landed_order_conclave_target.GetShortUIName] joins the #V Dissenters#!"
 gh_landed_order.0022.unmoved_tt:0 "[landed_order_conclave_target.GetShortUIName] remains among the #V Loyalists#!"
 # Phase 4: the Reaffirmation Faction
 landed_order_reaffirmation_faction:0 "Reaffirmation Faction"
 landed_order_reaffirmation_faction_desc:0 "Members of the Chapter who would put the [ordermaster|E] to a vote of no confidence. It can form only once the Order's [doctrine_standing|E] is at its lowest and its [order_authority|E] below #V 25#!, and not in the first #V 10#! years of the game. Its strength is the share of the Chapter's votes its members hold, not their armies, and every member will vote to cast the [ordermaster|E] out.\n\nIts demand is a [snap_conclave|E] of the Chapter, hosted by its leader. An [ordermaster|E] who refuses must fight the [chapter_censure|E]."
 landed_order_reaffirmation_faction_short_effect_desc:0 "Wants the Chapter to vote on the Ordermaster"
 landed_order_reaffirmation_faction_discontent_share:0 "Holds a third of the Chapter's votes"
 landed_order_reaffirmation_faction_discontent_majority:0 "Holds a majority of the Chapter's votes"
 landed_order_reaffirmation_faction_reason_confidence:0 "Lack of confidence in the Ordermaster"
 landed_order_reaffirmation_faction_reason_clique:0 "Leads a [clique|E] while a rival dominates the Order"
 landed_order_reaffirmation_faction_standing_tt:0 "The Order's [doctrine_standing|E] is at its lowest"
 landed_order_reaffirmation_faction_authority_tt:0 "[order_authority|E] is below #V 25#!, or below #V 35#! while [chapter_strain|E] is #V 40#! or more"
 landed_order_reaffirmation_faction_early_tt:0 "At least #V 10#! years have passed since the game began"
 landed_order_censure_army:0 "Sworn of the Censure"

 landed_order_censure_war:0 "Chapter's Censure"
 LANDED_ORDER_CENSURE_WAR_NAME:0 "The Chapter's Censure of [DEFENDER.GetFirstName]"
 landed_order_censure_war_victory_desc:0 "[defender.GetShortUIName|U] is cast out as if the Chapter had voted [defender.GetHerHim] out: the [chapter_conclave|E]'s choice takes every [title|E] of the Order, and [defender.GetSheHe] keeps only a [commandery|E]. The new [ordermaster|E] imprisons [defender.GetHerHim]."
 landed_order_censure_war_victory_defender_desc:0 "You are cast out as if the Chapter had voted you out: the [chapter_conclave|E]'s choice takes every [title|E] of the Order, and you keep only a [commandery|E]. The new [ordermaster|E] imprisons you."
 landed_order_censure_war_white_peace_desc:0 "The [reaffirmation_faction|E] is disbanded. [defender.GetShortUIName|U] remains [ordermaster|E], [order_authority|E] falls by #N 5#!, and the Chapter cannot censure [defender.GetHerHim] again for #V 3#! years."
 landed_order_censure_war_defeat_desc:0 "[defender.GetShortUIName|U] imprisons every rebellious member, at no cost to [order_authority|E], which rises by #P 15#!. The [reaffirmation_faction|E] is disbanded, and the Chapter cannot censure [defender.GetHerHim] again for #V 3#! years."
 landed_order_censure_war_defeat_defender_desc:0 "You imprison every rebellious member, at no cost to [order_authority|E], which rises by #P 15#!. The [reaffirmation_faction|E] is disbanded, and the Chapter cannot censure you again for #V 3#! years."

 gh_landed_order.0030.opening:0 "The Chapter's Demand"
 gh_landed_order.0030.desc:0 "[faction_leader.GetTitledFirstName] writes,  \"it is time you answer to a Conclave of the Chapter, and abide by its vote.\""
 gh_landed_order.0030.a:0 "I will answer to the Chapter."
 gh_landed_order.0030.a.tt:0 "[faction_leader.GetShortUIName] summons the Chapter to a [snap_conclave|E] at your seat. Every member of the faction votes to cast you out; the rest of the Chapter votes as it judges you. Lose, and you abdicate to the [chapter_conclave|E]'s choice."
 gh_landed_order.0030.b:0 "The Chapter does not command its Ordermaster."
 gh_landed_order.0030.b.tt:0 "The faction takes up arms against you in the [chapter_censure|E]. Lose, and you are cast out as if voted out; win, and its members are imprisoned and [order_authority|E] rises by #P 15#!."
 gh_landed_order.0031.opening:0 "Our Demand Is Made"
 gh_landed_order.0031.desc:0 "[faction_leader.GetTitledFirstName] has written to [faction_target.GetShortUIName] for our faction, demanding that [faction_target.GetSheHe] answer to a vote of the Chapter. If [faction_target.GetSheHe] refuses, we go to war."
 gh_landed_order.0031.a:0 "Now we wait."
 gh_landed_order.0032.opening:0 "The Ordermaster Submits"
 gh_landed_order.0032.desc:0 "[faction_target.GetShortUIName] has agreed to answer to the Chapter. It falls to me to summon the Chapter to a Snap Conclave at [faction_target.GetHerHis] seat."
 gh_landed_order.0032.a:0 "Summon the Chapter."
 gh_landed_order.0032.b:0 "In good time."
 gh_landed_order.0032.b.tt:0 "Host the [snap_conclave|E] from the Activities list. If none convenes within #V six months#!, the Chapter votes without one."
 gh_landed_order.0033.opening:0 "The Ordermaster Defies the Chapter"
 gh_landed_order.0033.desc:0 "[faction_target.GetShortUIName] will not answer to the Chapter. If the Chapter's judgement is to stand, it must be enforced."
 gh_landed_order.0033.a:0 "Then the Chapter will censure [faction_target.GetHerHim] by force."
 gh_landed_order.0033.a.tt:0 "The faction goes to war in the [chapter_censure|E], and every member raises troops by their weight in the Chapter"
 gh_landed_order.0034.opening:0 "To Arms"
 gh_landed_order.0034.desc:0 "[faction_target.GetShortUIName] has refused to answer to the Chapter, and [faction_leader.GetShortUIName] has called our faction to arms."
 gh_landed_order.0034.a:0 "For the Order."
 # How spiritual fulfillment feeds Doctrine Standing (landed_order_standing_devotion_value), shown on the fulfillment levels
 fulfillment_level_parameter_sp_landed_order_devotion_up_1: "A [landed_order|E]'s [ordermaster|E] gains [doctrine_standing|E] faster each year"
 fulfillment_level_parameter_sp_landed_order_devotion_up_2: "A [landed_order|E]'s [ordermaster|E] gains [doctrine_standing|E] much faster each year"
 fulfillment_level_parameter_sp_landed_order_devotion_down_1: "A [landed_order|E]'s [ordermaster|E] gains [doctrine_standing|E] more slowly each year, or loses it"
 fulfillment_level_parameter_sp_landed_order_devotion_down_2: "A [landed_order|E]'s [ordermaster|E] gains [doctrine_standing|E] much more slowly each year, or loses it"

 # Game concepts (draft text)
 game_concept_ordermaster: "Ordermaster"
 game_concept_ordermaster_desc: "The head of a [landed_order|E]. The office is never inherited: the [chapter_conclave|E] raises each new Ordermaster, and a [reaffirmation_vote|E] can cast one out."
 game_concept_komtur: "Komtur"
 game_concept_komtur_desc: "An officeholder of a [landed_order|E] who holds a [commandery|E], with or without a county of their own. A Komtur's offices pass by Chapter Appointment to the member best fit for them, not to their family."
 game_concept_commandery: "Commandery"
 game_concept_commandery_desc: "The landless office every officeholder of a [landed_order|E] holds. It is seated at a county and gives its holder a [domicile|E]. It cannot be granted away, and it passes by Chapter Appointment."
 game_concept_doctrine_standing: "Doctrine Standing"
 game_concept_doctrine_standing_desc: "A [landed_order|E]'s [legitimacy|E]: how well the Order is seen to keep its faith.\n\nIt rises with [holy_war|E] victories, conversions, discipline among its members and the [ordermaster|E]'s own devotion. It falls with lost wars and battles, officeholders of another [faith|E] and unconverted Order land.\n\nWhile it is high the Order's members gain [spiritual_fulfillment|E] and holy wars cost less. While it is low they lose fulfillment."
 game_concept_order_authority: "Order Authority"
 game_concept_order_authority_desc: "The Chapter's obedience to its [ordermaster|E], from #V 0#! to #V 100#!. It sets the Order's Authority law at #V 25#!, #V 50#! and #V 75#!, and that law cannot be changed by hand.\n\nIt rises with loyal officeholders, a [chapter_general|E] and winning a [reaffirmation_vote|E]. It falls with disloyal officeholders, imprisoning or stripping members of the Order's faith, and losing a quarter of it when the Ordermaster dies."
 game_concept_chapter_general: "Chapter General"
 game_concept_chapter_general_desc: "An assembly of a [landed_order|E]'s officeholders, convened by the [ordermaster|E] at a cost in [piety|E] to raise [order_authority|E]. It needs peace and two officeholders serving directly, and can be performed every #V 5#! years."
 game_concept_chapter_conclave: "Chapter Conclave"
 game_concept_chapter_conclave_desc: "The election that raises a [landed_order|E]'s next [ordermaster|E]. The Order's direct officeholders and the Ordermaster's council vote, weighted by office: Marshals, or Dukes, count most, then [Concept('komtur','Komturs')|E]. Candidates must clear the [merit_threshold|E]."
 game_concept_merit_threshold: "Merit Threshold"
 game_concept_merit_threshold_desc: "A candidate in a [chapter_conclave|E] needs Merit of at least #V 18#!: their [martial|E], plus their [learning|E], plus three times their [piety|E] level. If no candidate clears it, it is waived. Electors favour higher Merit in any case."
 game_concept_reaffirmation_vote: "Reaffirmation Vote"
 game_concept_reaffirmation_vote_desc: "A vote of the Chapter on whether its [ordermaster|E] is still fit to lead it. Only a [reaffirmation_faction|E] can force one. An Ordermaster who loses abdicates to the [chapter_conclave|E]'s choice and stays on as a [komtur|E]."
 game_concept_reaffirmation_faction: "Reaffirmation Faction"
 game_concept_reaffirmation_faction_desc: "A faction of a [landed_order|E]'s officeholders that demands a [reaffirmation_vote|E]. It can form only with [doctrine_standing|E] at its lowest and [order_authority|E] below #V 25#!, and not in the first #V 10#! years of the game. Its strength is its share of the Chapter's votes. If the [ordermaster|E] submits, a [snap_conclave|E] follows; if not, the [chapter_censure|E]."
 game_concept_snap_conclave: "Snap Conclave"
 game_concept_snap_conclave_desc: "A gathering of the Chapter at the [ordermaster|E]'s seat, hosted by the leader of a [reaffirmation_faction|E], where its members work on each other before a [reaffirmation_vote|E]."
 game_concept_chapter_censure: "Chapter's Censure"
 game_concept_chapter_censure_desc: "The war a [reaffirmation_faction|E] fights against an [ordermaster|E] who refuses its demand. If the faction wins, the Ordermaster is cast out as if voted out. If it loses, its members are imprisoned and [order_authority|E] rises."
 LANDED_ORDER_MERIT_TOOLTIP:0 "#T Merit#!\nThe Chapter's measure of a member fit to be [ordermaster|E]: [martial|E], plus [learning|E], plus three times [piety_level|E]. A candidate in the [chapter_conclave|E] needs at least #V 18#! (the [merit_threshold|E]), and electors favour higher Merit."
 baron_landed_order_male:0 "Chaptermember"
 baron_landed_order_female:0 "Chaptermember"
 LANDED_ORDER_CHAPTERMEMBER_CELIBATE:0 "Is not a [chaptermember|E], who keeps the Order's vow of celibacy whatever its law allows"
 LANDED_ORDER_CHAPTERMEMBER_IS_CELIBATE:0 "Is a [chaptermember|E], who keeps the Order's vow of celibacy whatever its law allows"
 game_concept_chaptermember: "Chaptermember"
 game_concept_chaptermember_desc: "A member of a [landed_order|E] who holds a barony and nothing higher. Chaptermembers are always celibate, whatever the Order's vows allow, and hold no [commandery|E]."
 LANDED_ORDER_STRAIN_METER:0 "[chapter_strain|E]: #V [GetPlayer.MakeScope.ScriptValue('landed_order_strain_display_value')|0]#!/100 ([GetPlayer.Custom('landed_order_strain_band')])"
 LANDED_ORDER_STRAIN_METER_TT:0 "#T Chapter Strain#!\nHow far the Order's core has outgrown its Chapter: #V [GetPlayer.MakeScope.ScriptValue('landed_order_strain_display_value')|0]#!/100, [GetPlayer.Custom('landed_order_strain_band')].\n\n$BULLET_WITH_TAB$#V [GetPlayer.MakeScope.ScriptValue('landed_order_strain_commanderies_display_value')|0]#! [Concept('commandery','Commanderies')|E] at #V [GetPlayer.MakeScope.ScriptValue('landed_order_strain_weight_display_value')|0]#! each: #N +[GetPlayer.MakeScope.ScriptValue('landed_order_strain_commandery_part_display_value')|0]#!\n$BULLET_WITH_TAB$The [ordermaster|E]'s [stewardship|E]: #P -[GetPlayer.MakeScope.ScriptValue('landed_order_strain_stewardship_display_value')|0]#!\n$BULLET_WITH_TAB$[doctrine_standing|E]: #P -[GetPlayer.MakeScope.ScriptValue('landed_order_strain_standing_display_value')|0]#! #weak (Venerated 10, Exalted 20)#!\n$BULLET_WITH_TAB$The Chapter's mood: #V [GetPlayer.MakeScope.ScriptValue('landed_order_strain_pressure_display_value')|0]#!\n#weak In the Order of the Forgotten Saint a Commandery weighs half: its Chapter answers to one will.#!\n\n#T Effects#!\n$BULLET_WITH_TAB$#P Low#! below #V 40#!: none\n$BULLET_WITH_TAB$#V 40#! or more, #V Strained#!: a [reaffirmation_faction|E] may form with [order_authority|E] below #V 35#!, not #V 25#!\n$BULLET_WITH_TAB$#V 60#! or more, #N Overextended#!: the Ordermaster's own [clique|E] stands by them less in a [reaffirmation_vote|E]\n$BULLET_WITH_TAB$#V 80#! or more, #N Fractured#!: [Concept('komtur','Komturs')|E] may petition to splinter off a [chapter_house|E]\n$BULLET_WITH_TAB$#V 90#! or more, #N Breaking#!, with a chapter house in the Order: a [chapter_schism|E] may form\n\n#T Rises#!\n$BULLET_WITH_TAB$Each new Commandery, Promotion included\n$BULLET_WITH_TAB$Doctrine Standing falling from Venerated\n$BULLET_WITH_TAB$Each year while Order Authority is below #V 25#!\n$BULLET_WITH_TAB$For ten years after a Chapter Discipline\n$BULLET_WITH_TAB$When a [lay_tributary|E] breaks away or is lost to a rival\n\n#T Falls#!\n$BULLET_WITH_TAB$A Commandery left vacant, or given up by Demotion\n$BULLET_WITH_TAB$Doctrine Standing reaching Venerated, and more at Exalted\n$BULLET_WITH_TAB$Imposing a Chapter Discipline\n$BULLET_WITH_TAB$The Chapter's mood easing over the years"
 landed_order_strain_band_low:0 "#P Low#!"
 landed_order_strain_band_strained:0 "#V Strained#!"
 landed_order_strain_band_overextended:0 "#N Overextended#!"
 landed_order_strain_band_fractured:0 "#N Fractured#!"
 landed_order_strain_band_breaking:0 "#N Breaking#!"
 impose_chapter_discipline_interaction:0 "Impose Chapter Discipline"
 impose_chapter_discipline_interaction_desc:0 "Press the Chapter into line: curb the Komturs' liberties, call in their accounts and settle their quarrels by decree."
 impose_chapter_discipline_interaction_effect_tt:0 "[chapter_strain|E] falls by #P 25#!, but rises by #N 3#! more each year for the next #V 10#! years"
 landed_order_needs_ordermasters_writ_tt:0 "[order_authority|E] is #V 50#! or more ($order_authority_2$)"
 landed_order_promote_tributary_interaction:0 "Bring into the Order"
 landed_order_promote_tributary_interaction_desc:0 "Take [recipient.GetShortUIName] into the Order: [recipient.GetSheHe] takes its vows, [recipient.GetHerHis] land becomes the Order's own, and the office will no longer pass to [recipient.GetHerHis] family."
 landed_order_promote_tributary_interaction_effect_tt:0 "[recipient.GetShortUIName] stops being a [lay_tributary|E] and becomes a [komtur|E] of the Order, with a [commandery|E], which raises [chapter_strain|E]"
 landed_order_promote_needs_content_tt:0 "Has a [tributary_reach|E] Discontent below #V 25#!"
 LANDED_ORDER_AI_CONTENT_TRIBUTARY:0 "Content under the Order"
 landed_order_demote_komtur_interaction:0 "Demote to Lay Tributary"
 landed_order_demote_komtur_interaction_desc:0 "Cut [recipient.GetShortUIName] loose from the Chapter: [recipient.GetSheHe] keeps [recipient.GetHerHis] land, but as a tributary of the Order, not an officeholder of it."
 landed_order_demote_komtur_interaction_effect_tt:0 "[recipient.GetShortUIName] leaves the Order and becomes a hereditary [lay_tributary|E] with a Discontent of #N 50#!. [recipient.GetHerHis|U] [commandery|E] goes back to the Chapter, easing [chapter_strain|E], and [order_authority|E] falls by #N 10#!"
 landed_order_demote_needs_authority_tt:0 "[order_authority|E] is #V 10#! or more"
 landed_order_tributary_restless_toast:0 "A Tributary Pays Less"
 landed_order_tributary_restless_toast_desc:0 "[landed_order_tributary.GetShortUIName] has grown restless under the Order and cut [landed_order_tributary.GetHerHis] tribute."
 landed_order_tributary_defiant_toast:0 "A Tributary Withholds"
 landed_order_tributary_defiant_toast_desc:0 "[landed_order_tributary.GetShortUIName] now withholds both tribute and levies from the Order."
 LANDED_ORDER_DISCONTENT_TOOLTIP:0 "#T Discontent#!\nHow restless this [lay_tributary|E] is under its [landed_order|E], from #V 0#! to #V 100#!. At #V 25#! it pays less tribute; at #V 50#! it withholds tribute and levies; at #V 75#! a stronger neighbour may bid for it; and two years at #V 100#! bring open revolt. See [tributary_reach|E]."
 gh_landed_order.0040.t:0 "A Rival's Offer"
 gh_landed_order.0040.desc:0 "[landed_order_rival.GetTitledFirstName] has been courting [landed_order_tributary.GetTitledFirstName], who pays tribute to the Order with less and less grace. Better terms are on offer, and unless I can match them, the tribute will go elsewhere."
 gh_landed_order.0040.a:0 "Then the Order will pay more."
 gh_landed_order.0040.a.tt:0 "[landed_order_tributary.GetShortUIName]'s Discontent falls by #P 30#!"
 gh_landed_order.0040.b:0 "Let [landed_order_tributary.GetHerHim] go."
 gh_landed_order.0040.b.tt:0 "[landed_order_tributary.GetShortUIName] stops paying tribute to the Order, and pays it to [landed_order_rival.GetShortUIName] if [landed_order_rival.GetSheHe] can take tributaries. [chapter_strain|E] rises by #N 5#!"
 gh_landed_order.0041.t:0 "A Tributary Breaks Away"
 gh_landed_order.0041.desc:0 "[landed_order_tributary.GetTitledFirstName] has had enough of the Order. The tribute has stopped, the levies with it, and the Chapter is already arguing over whose fault it was."
 gh_landed_order.0041.a:0 "The Order will remember this."
 gh_landed_order.0041.a.tt:0 "[landed_order_tributary.GetShortUIName] is no longer a [lay_tributary|E]. [chapter_strain|E] rises by #N 15#!"
 game_concept_chapter_strain: "Chapter Strain"
 game_concept_chapter_strain_desc: "How far a [landed_order|E]'s core has outgrown its original Chapter, from #V 0#! to #V 100#!. Every held [commandery|E] adds #V 6#! to it (#V 3#! in the Order of the Forgotten Saint, whose Chapter answers to one will). The [ordermaster|E]'s [stewardship|E] absorbs one and a half times its value, a Venerated [doctrine_standing|E] absorbs #V 10#! and an Exalted one #V 20#!, and the Chapter's mood moves it further: it builds while [order_authority|E] is low or a [lay_tributary|E] is lost, and eases with time, a Chapter Discipline or a vacant Commandery.\n\nBelow #V 40#! it is #P Low#!. At #V 40#! it is Strained, and a [reaffirmation_faction|E] may form more easily; at #V 60#! Overextended, and the Ordermaster's own [clique|E] stands by them less in a [reaffirmation_vote|E]; at #V 80#! Fractured, and its [Concept('komtur','Komturs')|E] may petition to splinter off a [chapter_house|E]; and at #V 90#! Breaking: with a chapter house in the Order, a [chapter_schism|E] may form. Demoting a [komtur|E] to a Lay Tributary relieves it; Promotion adds to it."
 game_concept_lay_tributary: "Lay Tributary"
 landed_order_lay_tributary: "Lay Tributary"
 landed_order_lay_tributary_desc: "A ruler who pays tribute to a [landed_order|E] without belonging to it. Their land is hereditary and adds nothing to [chapter_strain|E], but they grow restless with distance and neglect: see [tributary_reach|E].\n\nA loyal Lay Tributary of the Order's faith can be brought into the Order, and a turbulent [komtur|E] can be cut loose as one.
 game_concept_lay_tributary_desc: "A ruler who pays tribute to a [landed_order|E] without belonging to it. Their land is hereditary and adds nothing to [chapter_strain|E], but they grow restless with distance and neglect: see [tributary_reach|E].\n\nA loyal Lay Tributary of the Order's faith can be brought into the Order, and a turbulent [komtur|E] can be cut loose as one."
 game_concept_tributary_reach: "Tributary Reach"
 game_concept_tributary_reach_desc: "Every [lay_tributary|E] of a [landed_order|E] carries a Discontent, from #V 0#! to #V 100#!.\n\nIt rises each year with distance from the Order's nearest [commandery|E], while the Order's [doctrine_standing|E] is low, while a stronger neighbour can offer better terms, and while the tributary resents their Ordermaster. It eases when the Order is venerated and the tributary content.\n\nAt #V 25#! the tributary pays less tribute; at #V 50#! it withholds tribute and levies; at #V 75#! a rival may bid for it; and two years or more at #V 100#! bring open revolt, which also adds to [chapter_strain|E]."
 LANDED_ORDER_SCHISM_TITLE_NAME:0 "Observant [landed_order_schism_parent.GetNameNoTierNoTooltip]"
 gh_landed_order.0050.t:0 "A Petition to Splinter"
 gh_landed_order.0050.desc:0 "The Order has grown past what one Chapter house can govern, and [landed_order_petitioner.GetTitledFirstName] knows it. [landed_order_petitioner.GetSheHe|U] petitions that [landed_order_petitioner.GetHerHis] Commandery be made a chapter house: still of the Order, but governing itself, with a lesser seat in the Chapter."
 gh_landed_order.0050.a:0 "Let it govern itself."
 gh_landed_order.0050.a.tt:0 "[landed_order_petitioner.GetShortUIName]'s Commandery becomes a [chapter_house|E]: it weighs half as much on [chapter_strain|E], and [landed_order_petitioner.GetSheHe] has one vote less in the Chapter. Chapter Strain falls by #P 10#!"
 gh_landed_order.0050.b:0 "The Order is one, and governed from here."
 gh_landed_order.0050.b.tt:0 "[order_authority|E] falls by #N 5#!, [chapter_strain|E] rises by #N 10#!, and [landed_order_petitioner.GetShortUIName] resents it"
 landed_order_schism_faction:0 "Chapter Schism"
 landed_order_schism_faction_desc:0 "Members of the Order who would break away as an Observant branch of it, under one of their own. It can form only once [chapter_strain|E] has reached #V 90#! and a [chapter_house|E] has splintered off. Its strength is the share of the Chapter's votes its members hold.\n\nIts demand is to leave the Order. An [ordermaster|E] who refuses must fight the [chapter_schism|E]."
 landed_order_schism_faction_short_effect_desc:0 "Wants to break away from the Order"
 landed_order_schism_faction_strain_tt:0 "[chapter_strain|E] is #V 90#! or more"
 landed_order_schism_faction_chapter_house_tt:0 "A [chapter_house|E] has splintered off from the Chapter"
 landed_order_schism_faction_reason_chapter_house:0 "Governs a chapter house"
 landed_order_schism_army:0 "Schismatics of the Chapter"
 landed_order_schism_war:0 "Chapter Schism"
 LANDED_ORDER_SCHISM_WAR_NAME:0 "The Chapter Schism of [ATTACKER.GetFirstName]"
 landed_order_schism_war_victory_desc:0 "[attacker.GetShortUIName|U] takes the schismatics out of the Order as an independent Observant Order. [defender.GetShortUIName|U]'s [order_authority|E] and [doctrine_standing|E] fall."
 landed_order_schism_war_victory_defender_desc:0 "[attacker.GetShortUIName|U] takes the schismatics out of the Order as an independent Observant Order. Your [order_authority|E] and [doctrine_standing|E] fall."
 landed_order_schism_war_white_peace_desc:0 "The [chapter_schism|E] is disbanded, and the schismatics remain in the Order."
 landed_order_schism_war_defeat_desc:0 "[defender.GetShortUIName|U] imprisons the schismatics, at no cost to [order_authority|E], which rises by #P 10#!. Their chapter houses are no more, and [chapter_strain|E] falls."
 landed_order_schism_war_defeat_defender_desc:0 "You imprison the schismatics, at no cost to [order_authority|E], which rises by #P 10#!. Their chapter houses are no more, and [chapter_strain|E] falls."
 gh_landed_order.0052.opening:0 "The Chapter Divides"
 gh_landed_order.0052.desc:0 "[faction_leader.GetTitledFirstName] writes for those of the Order who will no longer be governed from my seat. The Order has grown too large to be one, they say; they mean to keep its rule more strictly than I do, as an Observant Order of their own, and ask that I let them go in peace."
 gh_landed_order.0052.a:0 "Go, then."
 gh_landed_order.0052.a.tt:0 "[faction_leader.GetShortUIName] takes the faction's members out of the Order as an independent Observant Order. Your [order_authority|E] falls by #N 15#! and your [doctrine_standing|E] suffers, but [chapter_strain|E] falls by #P 30#!"
 gh_landed_order.0052.b:0 "The Order is one."
 gh_landed_order.0052.b.tt:0 "The faction goes to war in the [chapter_schism|E]"
 game_concept_chapter_house: "Chapter House"
 game_concept_chapter_house_desc: "A [commandery|E] of a [landed_order|E] that governs itself. A [komtur|E] may petition for one once [chapter_strain|E] reaches #V 80#!; granted, the Commandery weighs half as much on Chapter Strain and its Komtur keeps a reduced seat in the Order, with one vote less. A chapter house cannot be demoted, and it is the seed of a [chapter_schism|E]. The status is the Komtur's own, and ends with them."
 game_concept_chapter_schism: "Chapter Schism"
 game_concept_chapter_schism_desc: "Once [chapter_strain|E] reaches #V 90#! and a [chapter_house|E] has splintered off, a [landed_order|E]'s officeholders may band together to break away. Let go, or victorious in the war that follows a refusal, the Schism's leader takes its members out of the Order as an independent Observant Order, and the old Order's [order_authority|E] and [doctrine_standing|E] fall, though its Chapter Strain eases. Beaten, the schismatics are imprisoned and their chapter houses are no more. A Schism unsettles the Order's [Concept('lay_tributary','Lay Tributaries')|E] nearby."
 # Landed Order rework - Phase 8: the Eye's infiltration of the other Orders
 secret_eye_sworn:0 "Eyesworn"
 secret_eye_sworn_desc:0 "Secretly sworn to [GetBuilding('01_the_eye').GetName]"
 secret_eye_sworn_tooltip_desc:0 "This character has secretly sworn themself to [GetBuilding('01_the_eye').GetName], and serves the Order of the Forgotten Saint while keeping another creed in public. Exposed, they are a criminal, unless the head of their [landed_order|E] (or, outside the Orders, their liege) serves the Eye as well."
 secret_eye_sworn_type_desc:0 "$secret_eye_sworn_tooltip_desc$"

 game_concept_landed_order_eye_sworn:0 "Eyesworn"
 game_concept_landed_order_eye_sworn_desc:0 "Members of the other [Concept('landed_order','Landed Orders')|E], and some of the Wardenite and Ritualist faithful, have been secretly sworn to [GetBuilding('01_the_eye').GetName] by the Order of the Forgotten Saint. In public they keep their own creed; in private they serve the Eye.."
 game_concept_landed_order_eye_corruption:0 "Eye Corruption"
 game_concept_landed_order_eye_corruption_desc:0 "How deeply a [landed_order|E] is held by members [Concept('landed_order_eye_sworn','Eyesworn')|E]: #V 50#! if its [ordermaster|E] is sworn, #V 15#! for each sworn [komtur|E] or Marshal, #V 5#! for each sworn [chaptermember|E], and #V 5#! for each sworn councillor or knight of its Ordermaster, up to #V 100#!.\n\nThe average Corruption of all the other Orders is the [landed_order_eye_grasp|E]. Only those who serve the Eye can see it."
 game_concept_landed_order_eye_grasp:0 "The Eye's Grasp"
 game_concept_landed_order_eye_grasp_desc:0 "The average [landed_order_eye_corruption|E] of every [landed_order|E] but the Forgotten Saint's own, the Eosians included. When it reaches #V 100%#!, every Order is the Eye's (the Eosians held, or gone), and the Forgotten Saint has won the [landed_order_whispers|E].\n\nThose who serve the Eye follow it in the Conspiracy of Whispers, among their Situations."

 landed_order_eye_initiation:0 "Open Their Eyes"
 landed_order_eye_initiation_desc:0 "I will open [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip]'s eyes, and swear [SCHEME.GetTargetCharacter.GetHerHim] to [GetBuilding('01_the_eye').GetName] in secret."
 landed_order_eye_initiation_desc_general:0 "Secretly swear a member of another [landed_order|E], or one of the Wardenite or Ritualist faithful, to [GetBuilding('01_the_eye').GetName]."
 landed_order_eye_initiation_general_desc:0 "$landed_order_eye_initiation_desc_general$"
 landed_order_eye_initiation_action:0 "Open Their Eyes"
 LANDED_ORDER_EYE_INITIATION_SUCCESS_DESC:0 "[TARGET_CHARACTER.GetShortUIName|U] becomes [Concept('landed_order_eye_sworn','Eyesworn')|E]"
 landed_order_eye_initiation_interaction:0 "Open Their Eyes #weak (Scheme)#!"
 landed_order_eye_initiation_interaction_desc:0 "Start a secret [scheme|E] to swear [recipient.GetShortUINameNoTooltip] to [GetBuilding('01_the_eye').GetName]."
 landed_order_eye_initiation_interaction_notification:0 "Open Their Eyes"
 landed_order_eye_initiation_invalidated_title:0 "@scheme_icon! Open Their Eyes Scheme Ends"
