 LANDED_ORDER_WHISPERS_EYE_VIEW_HEADER:0 "What the Eye Sees"
 LANDED_ORDER_WHISPERS_GRASP_VALUE:0 "#high [Situation.MakeScope.Var('eye_grasp').GetValue|0]%#!"
