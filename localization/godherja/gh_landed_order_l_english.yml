 # Landed Order rework: the Conspiracy of Whispers
 situation_type_conspiracy_of_whispers:0 "Conspiracy of Whispers"
 situation_type_conspiracy_of_whispers_desc:0 "Behind the public quarrels of the [Concept('landed_order','Landed Orders')|E], the Order of the Forgotten Saint swears their members to an ancient force of power, one by one, in secret. Only the Eosians of the Forlorn Guardian have never been stand in their way.\n\nWho is sworn is known only to those who have learned it."
 situation_conspiracy_of_whispers:0 "$situation_type_conspiracy_of_whispers$"
 situation_conspiracy_of_whispers_desc:0 "[SITUATION.GetType.GetDesc]"
 conspiracy_of_whispers_sub_region_whispers_core_desc:0 "$SITUATION_SUB_REGION_TOOLTIP_DESC$"
 conspiracy_of_whispers_whispers_forgotten_saint:0 "Conspiracy of Whispers #weak (The Forgotten Saint)#!"
