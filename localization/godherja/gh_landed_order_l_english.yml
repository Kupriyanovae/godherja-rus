 landed_order_forgotten_magi_desc:0 "A [magi|E] of the Forgotten Saint's Order"
 LANDED_ORDER_WHISPERS_TURNS_HEADER:0 "Where the Whispers May Turn"
 LANDED_ORDER_WHISPERS_CATALYSTS_BUTTON:0 "Catalysts"
 LANDED_ORDER_WHISPERS_CATALYSTS_INTRO:0 "Each of these moves the [landed_order_whispers|E] toward #V [SituationPhaseType.GetNameNoTooltip]#!. When the points reach the goal, the [situation_phase|E] changes."
 LANDED_ORDER_WHISPERS_HISTORY_BUTTON:0 "History"
 LANDED_ORDER_WHISPERS_HISTORY_HEADER:0 "The Course of the Whispers"
 LANDED_ORDER_WHISPERS_OUTSIDER_NOTE:0 "What passes between the Orders is hidden from you. Only those [Concept('landed_order_eye_sworn','Eyesworn')|E], and those who stand with the [landed_order_vigil|E], see more than rumour."
 game_concept_landed_order_regiments:1 "Order Men-at-Arms"
 game_concept_landed_order_regiments_desc:3 "A [landed_order|E] fights with a standing force rather than a levy.\n\n[commandery|E] (county): #P +1#!\nMarshal (duchy): #P +2#!\n[ordermaster|E] (kingdom): #P +3#!\nAn independent [ordermaster|E]: #P +1#! more\n\nThe Orders begin already under arms, as far as their income allows: up to a regiment for each rank of office, and one more for an independent [ordermaster|E]."
 landed_order_maa_duchy_modifier:0 "A Marshal's Retinue"
 landed_order_maa_duchy_modifier_desc:0 "This Marshal of a [landed_order|E] keeps a larger standing force than a Komtur. See [Concept('landed_order_regiments','Order Men-at-Arms')|E]."
 landed_order_maa_kingdom_modifier:0 "An Ordermaster's Retinue"
 landed_order_maa_kingdom_modifier_desc:0 "The [ordermaster|E] of a [landed_order|E] keeps the Order's largest standing force. See [Concept('landed_order_regiments','Order Men-at-Arms')|E]."
 landed_order_maa_empire_modifier:0 "A Grand Ordermaster's Retinue"
 landed_order_maa_empire_modifier_desc:0 "The [ordermaster|E] of a [landed_order|E] that spans an empire keeps a standing force to match. See [Concept('landed_order_regiments','Order Men-at-Arms')|E]."
 game_concept_landed_order_whispers:0 "Conspiracy of Whispers"
 game_concept_landed_order_whispers_desc:0 "A cold war between the Order of the Forgotten Saint, which secretly swears the members of the other [Concept('landed_order','Landed Orders')|E] to [GetBuilding('01_the_eye').GetName], and the Eosians of the Forlorn Guardian. It is fought with [Concept('scheme','schemes')|E] and [Concept('secret','secrets')|E]. Every Agionist ruler is part of it, and others are drawn in once they are [Concept('landed_order_eye_sworn','Eyesworn')|E] or learn who is.\n\nIt grows from #V Whispers#! to #V Suspicion#! and an #V Open Breach#! as secrets come out and blood is spilled. The Situation cools again in quiet years. It ends when every Order is the Eye's, the Eosians held or gone ([landed_order_eye_grasp|E] #V 100%#!), or when the Forgotten Saint stands exposed as anathema and no [ordermaster|E] is still sworn."
 conspiracy_of_whispers_sub_region_whispers_core:0 "The Landed Orders"
 conspiracy_of_whispers_participant_group_whispers_forgotten_saint:0 "The Forgotten Saint"
 conspiracy_of_whispers_participant_group_whispers_forgotten_saint_desc:0 "The Order of the Forgotten Saint, which swears the other Orders to the Eye in secret."
 conspiracy_of_whispers_participant_group_whispers_forlorn_guardian:0 "The Forlorn Guardian"
 conspiracy_of_whispers_participant_group_whispers_forlorn_guardian_desc:0 "The Eosians of the Order of the Forlorn Guardian."
 conspiracy_of_whispers_participant_group_whispers_calystos_key:0 "Saint Calysto's Key"
 conspiracy_of_whispers_participant_group_whispers_calystos_key_desc:0 "The Order of Saint Calysto's Key, isolated through a mix of luck and personal sins."
 conspiracy_of_whispers_participant_group_whispers_contested_orders:0 "The Contested Orders"
 conspiracy_of_whispers_participant_group_whispers_contested_orders_desc:0 "The other Agionist [Concept('landed_order','Landed Orders')|E], over whose members the conspiracy is fought. Orders of other faiths stand outside it."
 conspiracy_of_whispers_participant_group_whispers_agionist_faithful:0 "The Agionist Faithful"
 conspiracy_of_whispers_participant_group_whispers_agionist_faithful_desc:0 "Agionist rulers outside the Orders."
 conspiracy_of_whispers_participant_group_whispers_drawn_in:0 "Drawn In"
 conspiracy_of_whispers_participant_group_whispers_drawn_in_desc:0 "Rulers beyond the Agionist faith whom the conspiracy has reached through its [Concept('secret','secrets')|E]."
