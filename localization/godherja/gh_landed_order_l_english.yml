 landed_order_vigil_break_gaze_desc_general:0 "$landed_order_vigil_break_gaze_general_desc$"
 landed_order_vigil_break_gaze_general_desc:0 "Break the Eye's hold on one of the [Concept('landed_order_eye_sworn','Eyesworn')|E] whose secret you know, and make them a [Concept('landed_order_vigil_confidant','Confidant of the Vigil')|E]."
 landed_order_vigil_break_gaze_action:0 "Break the Gaze"
 LANDED_ORDER_VIGIL_BREAK_GAZE_SUCCESS_DESC:0 "[TARGET_CHARACTER.GetShortUIName|U] is free of the Eye, and becomes a [Concept('landed_order_vigil_confidant','Confidant of the Vigil')|E]"
 landed_order_vigil_break_gaze_invalidated_title:0 "@scheme_icon! Break the Gaze Scheme Ends"
 landed_order_vigil_break_gaze_interaction:0 "Break the Gaze #weak (Scheme)#!"
 landed_order_vigil_break_gaze_interaction_desc:0 "Start a secret [scheme|E] to break the Eye's hold on [recipient.GetShortUINameNoTooltip]."
 landed_order_vigil_break_success_toast:0 "Free of the Eye"
 landed_order_vigil_break_success_tt:0 "[target.GetShortUIName|U] is free of the Eye, and now a [Concept('landed_order_vigil_confidant','Confidant of the Vigil')|E]"
 landed_order_vigil_break_failure_toast:0 "The Eye Holds"
 landed_order_vigil_break_failure_tt:0 "[target.GetShortUIName|U] could not be turned from the Eye, and will not hear the Vigil again for #V 10#! years"

 landed_order_vigil_confederate_interaction:0 "Stand with the Vigil"
 landed_order_vigil_confederate_interaction_desc:0 "Ask [recipient.GetShortUINameNoTooltip], a [Concept('landed_order_vigil_confidant','Confidant of the Vigil')|E], to stand openly with the Eosians as a [Concept('landed_order_vigil_confederate','Confederate')|E]."
 landed_order_vigil_confederate_tt:0 "Becomes a [Concept('landed_order_vigil_confederate','Confederate of the Vigil')|E], openly"
 landed_order_vigil_confederacy_tt:0 "Joins the Vigil's [Concept('confederation','confederation')|E]"
 landed_order_vigil_confidant_new_tt:0 "Has been a Confidant for less than #V 2#! years"
