 gh_landed_order.0080.t:0 "A Whisper from the Eye"
 gh_landed_order.0080.desc:0 "[owner.GetTitledFirstName] has sought my company for some time, and tonight, in a room lit by a single candle, [owner.GetSheHe] finally spoke plainly.\n\n\"Your creed is blind, [ROOT.Char.GetFirstName]. Those you pray to do not answer. We have seen what watches from the mountains of [al_ghazir_biozone|E], and it has seen you. Open your eyes, and you need never be alone in the dark again.\"\n\nNo one would ever have to know."
 gh_landed_order.0080.a:0 "Show me."
 gh_landed_order.0080.a.tt:0 "You become [Concept('landed_order_eye_sworn','Eyesworn')|E]"
 gh_landed_order.0080.b:0 "Get out of my sight."
 gh_landed_order.0080.b.tt:0 "You refuse the Eye, and will not hear it again for #V 10#! years"

