 SCHEME_EYE_EOSIAN:0 "The Forlorn Guardian's Vigil: $VALUE|+0=$"
 SCHEME_EYE_REFORMED:0 "A Reformed Order: $VALUE|+0=$"
 SCHEME_EYE_ORDERMASTER:0 "An Ordermaster's Wariness: $VALUE|+0=$"
 SCHEME_EYE_HEAD_SWORN:0 "Their Ordermaster Serves the Eye: $VALUE|+0=$"
 SCHEME_EYE_AUTHORITY:0 "The Forgotten Saint's Authority: $VALUE|+0=$"
 landed_order_eye_initiation_success_toast:0 "The Eye Has a New Servant"
 landed_order_eye_initiation_success_tt:0 "[target.GetShortUIName|U] is now [Concept('landed_order_eye_sworn','Eyesworn')|E]"
 landed_order_eye_initiation_failure_toast:0 "They Would Not See"
 landed_order_eye_initiation_failure_tt:0 "[target.GetShortUIName|U] refused the Eye, and will not hear it again for #V 10#! years"
 landed_order_eye_rebuffed_tt:0 "Has refused the Eye within the last #V 10#! years"
 landed_order_eye_no_society_tt:0 "The Followers of the Eye must still stand"

 landed_order_eye_puppet_desc:0 "A ruler [Concept('landed_order_eye_sworn','Eyesworn')|E], bound to the Forgotten Saint's [ordermaster|E]. Through them, the Ordermaster can open more eyes, draw tithes and alliances, and send them to war."
