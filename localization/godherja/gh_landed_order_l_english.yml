 conspiracy_of_whispers_whispers_phase_suspicion_situation_phase: "Suspicion"
 conspiracy_of_whispers_whispers_phase_open_breach_situation_phase: "Open Breach"
 whispers_phase_whispers:0 "Whispers"
 whispers_phase_whispers_desc:0 "The conspiracy works unseen. The Forgotten Saint's agents pass from Chapter to Chapter, and no one outside its circle knows how far its reach extends."
 whispers_phase_suspicion:0 "Suspicion"
 whispers_phase_suspicion_desc:0 "Too many secrets have come out, and too many refusals have been whispered about. The Orders watch one another, and the Eye's servants must tread carefully."
 whispers_phase_open_breach:0 "Open Breach"
 whispers_phase_open_breach_desc:0 "The quarrel is out in the open. Knives are drawn in the Chapter houses, and the Eye's servants and its enemies no longer trouble to hide their contempt for one another."
