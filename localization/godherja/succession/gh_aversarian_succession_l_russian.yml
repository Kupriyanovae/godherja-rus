l_russian:
 aversarian_succession.0001.t:0 "Борьба за корону"
 aversarian_succession.0001.desc:0 "Как известно, когда умирает [Concept('aversaria','аверсарианских')|E] правитель и требуется наследник, любой, в чьих жилах течёт магия, может вступить в борьбу с другими претендентами за титул, дабы доказать, что их кровь чистейшая, а посему они наиболее достойны трона. Поскольку я имею титул дукса или выше, а наш Чистейший только что скончался, я могу выбрать вступить ли в эту смертельную схватку, либо остаться в стороне."
 aversarian_succession.0001.desc.inelegible:0 "Мой предшественник скончался, и трон переходит в мои руки — по крайней мере, так велит обычный здравый смысл. Однако, согласно древним [Concept('aversaria','аверсарианским')|E] традициям, только обладатели наискуснейшего магического мастерства достойны возложить на себя корону, мастерства, доказанного в жестоких магических поединках насмерть.\n\nК сожалению, будь то из-за полного отсутствия магических способностей, юного возраста или иных причин, я не могу лично приянть участие в [Concept('blood_senate','кровавом сенате')|E]. Но до тех пор, пока не будет избран должный преемник, я остаюсь хранителем престола. Если иных кандидатов не найдётся, корона достанется мне по умолчанию, ... если только я не прибегну к... иным способам убедить их сняться с состязания."

 aversarian_succession.0001.a:0 "Я защищу своё право рождения, даже если это будет стоить мне жизни!"
 aversarian_succession.0001.b:0 "Я не стану участвовать в этом опасном турнире."

 aversarian_succession.0003.t:0 "Кровавый сенат"
 aversarian_succession.0003.desc:0 "Ко мне обратились советники покойного правителя [primary_scope.GetName], сообщив, что мое имя находится в списке кандидатов на престол. Они заявили, что я, как [Select_CString(ROOT.Char.IsFemale, 'формальная наследница, обязана', 'формальный наследник, обязан' )] провести турнир для определения следующего владыки — однако вопрос о том, буду ли я участвовать лично, остается на мое усмотрение."
 aversarian_succession.0003.a:0 "Я стану [Select_CString(ROOT.Char.IsFemale, 'Императрицей', 'Императором' )] или умру в попытке!"
 aversarian_succession.0003.b:0 "Я не стану участвовать в этом опасном турнире."

 aversarian_succession.0004.t:0 "Претендент приближается"
 aversarian_succession.0004.desc:0 "Письмо на моём столе не оставляет сомнений — [new_challenger.GetFullName]  [Select_CString(new_challenger.IsFemale, 'объявила', 'объявил' )] о [new_challenger.GetHerHis] намерении взойти на трон в силу своих превосходного [Concept('magic','магического')|E] мастерства. Уже сейчас [new_challenger.GetSheHe] готовится отправиться в столицу."
 aversarian_succession.0004.desc.close_family_member:0 "[Select_CString(new_challenger.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('new_challenger'))], [new_challenger.GetFullName], подходит ко мне, явно [Select_CString(new_challenger.IsFemale, 'озабоченная', 'озабоченный' )] чем-то важным. После недолгого разговора [new_challenger.GetSheHe] наконец признаётся — [new_challenger.GetSheHe] планирует сражаться в [Concept('blood_senate','кровавом сенате')|E]!\n\nХотя это, разумеется, [new_challenger.GetHerHis] право, меня все же тревожит, что через неделю-другую [new_challenger.GetFirstName], скорее всего, уже может не быть в живых..."
 aversarian_succession.0004.desc.formidable_magi:0 "\n\nГоре тем, кто окажется на [new_challenger.GetHerHis] пути. [new_challenger.GetSheHe] уже имеет славу грозного [Concept('magi','мага')|E] и наверняка быстро расправится со всеми, кроме самых искусных претендентов. Похоже, перед нами будущий правитель [primary_scope.GetName]."
 aversarian_succession.0004.desc.skilled_magi:0 "\n\nСудя по слухам, [new_challenger.GetSheHe] — не лёгкая добыча. Хотя [new_challenger.GetSheHe] и не принадлежит к лучшим мастерам, [new_challenger.GetSheHe] станет крепким орешком и имеет хорошие шансы занять трон."
 aversarian_succession.0004.desc.decent_magi:0 "\n\nХотя [new_challenger.GetHerHis] магические способности нельзя назвать выдающимися, их вполне достаточно, чтобы постоять за себя в бою, и [new_challenger.GetSheHe] имеет шанс занять трон при не слишком высокой конкуренции."
 aversarian_succession.0004.desc.poor_magi:0 "\n\nО [new_challenger.GetHerHis] магических способностях  мы слышали мало. Похоже, хотя [new_challenger.GetFirstName] и имеет некоторое представление о магическом поединке, [new_challenger.GetSheHe] [Select_CString(new_challenger.IsFemale, 'могла', 'мог' )] существенно переоценить свои силы."
 
 aversarian_succession.0004.a:0 "Посмотрим, что из этого выйдет."
 aversarian_succession.0004.b:0 "Они не придут, если им дорога жизнь."
 aversarian_succession.0004.b.unlock_text:0 "Эта опция доступна, потому что у вас есть [Concept('strong_hook','сильное влияние')|E] на [new_challenger.GetHerHis]."
 aversarian_succession.0004.b.tt:0 "[Select_CString(new_challenger.IsFemale, 'ей', 'Ему' )] будет закрыт доступ к участию в [Concept('blood_senate','кровавом сенате')|E]."

 aversarian_succession.0009.t:0 "Смертельный поединок"
 aversarian_succession.0009.desc:0 "Бой начинается — мы приступаем к сотворению заклинаний, и всего через пару минут [THIS.Var('OTHER').Char.GetFullName] уже лежит [THIS.Custom('SuccAvEnemyState')] на земле, под ликующие возгласы толпы вокруг, пока меня объявляют [Select_CString(ROOT.Char.IsFemale, 'победительницей', 'победителем')] этого матча! Как мне поступить с поверженным врагом?"
 aversarian_succession.0009.a:0 "Пусть идет."
 aversarian_succession.0009.b:0 "Огненного шара в лицо будет вполне достаточно."

 aversarian_succession.0010.t:0 "Неоправданный риск"
 aversarian_succession.0010.desc:0 "Грязь и пыль покрывают мое облачение, пока я лежу на земле. Мой бок истекает кровью, и я чувствую, как тяжелеют конечности. Сквозь заплывшие кровью глаза я вижу фигуру надо мной, самодовольно призывающую огненный шар и готовящуюся к броску. Я просто закрываю глаза, чувствуя приближение неизбежного конца..."
 aversarian_succession.0010.a:0 "Я не Чистейший."

 aversarian_succession.0100.t:0 "Нескрываемая угроза"
 aversarian_succession.0100.desc:0 "В ярости я комкаю письмо и швыряю его в огонь. Этот [Select_CString(blackmailer.IsFemale, 'мерзкая интриганка', 'мерзкий интриган' )], [blackmailer.GetFirstName], [Select_CString(blackmailer.IsFemale, 'пригрозила', 'пригрозил' )] мне полным крахом, если я хоть ногой ступлю на землю [Concept('blood_senate','кровавого сената')|E]. И всё, что для этого нужно — чтобы содержимое уничтоженного письма стало достоянием общественности."
 aversarian_succession.0100.a:0 "Они ещё пожалеют об этом!"
 aversarian_succession.0100.a.tt:0 "Вы не сможете участвовать в [Concept('blood_senate','кровавом сенате')|E] за [primary_scope.GetName]."

 aversarian_succession.0400.t:0 "Пустой сенат"
 aversarian_succession.0400.desc.no_contestants_child:0 "[Concept('magi','Маги')|E] идут! Они придут сегодня сражаться! Я не могу дождаться! Мои слуги говорили, что они умеют пускать огненные шары, сотрясать землю и взрывать целые замки издалека! Я хочу стать [Select_CString(ROOT.Char.IsFemale, 'такой', 'таким' )], когда вырасту!\n\nНо день проходит, а никто не приходит. Почему они не идут!? Я так [Select_CString(ROOT.Char.IsFemale, 'хотела', 'хотел' )] увидеть их бой! Когда я ложусь спать и плачу в подушку, мои глупые советники говорят, что это к лучшему. Да они просто трусы, которые боятся огненных шаров!"
 aversarian_succession.0400.desc.no_contestants:0 "День за днем я жду прибытия участников. Большинство писем, разосланных потенциальным претендентам, остаются без ответа, немногие выражают явную незаинтересованность в поставленном на кон призе, а ещё меньше хоть как-то намекают на участие.\n\nогда наконец наступает день турнира, мои слуги готовят покои для одного-двух гостей, указавших хоть какую-то вероятность своего присутствия. И мы ждём.\n\nНикто не приходит.\n\nПир, готовившийся как последняя скорбная трапеза перед смертоносным днем, быстро превращается в пьяное празднование моего неожиданного восшествия на престол. И подумать только, что любой из этих глупцов мог просто прийти в столицу и сесть на трон, будь у него хоть капля смелости!"
 aversarian_succession.0400.a.no_contestants_child:0 "Я [Select_CString(ROOT.Char.IsFemale, 'передумала', 'передумал' )], я никогда не хочу быть глупым [Concept('magi','магом')|E]!"
 aversarian_succession.0400.a.no_contestants:0 "Я уж точно не стану жаловаться!"

 aversarian_succession.0401.t:0 "Праздник для одного"
 aversarian_succession.0401.desc.no_contestants_child:0 "[Concept('magi','Маги')|E] идут! Они придут сегодня сражаться! Я не могу дождаться! Мои слуги говорили, что они умеют пускать огненные шары, сотрясать землю и взрывать целые замки издалека! Я хочу стать [Select_CString(ROOT.Char.IsFemale, 'такой', 'таким' )], когда вырасту!\n\nНо день проходит, и приходит только [Select_CString(champion_of_the_blood_senate.IsFemale, 'одна', 'один' )] из них. [champion_of_the_blood_senate.GetFirstName] — [Select_CString(champion_of_the_blood_senate.IsFemale, 'единственная', 'единственный' )], кто явился на мою магическую битву, и [champion_of_the_blood_senate.GetHerHim] не с кем сражаться. Кажется, видя как я [Select_CString(ROOT.Char.IsFemale, 'расстроена', 'расстроен' )], [champion_of_the_blood_senate.GetSheHe] показывает мне несколько фокусов — [champion_of_the_blood_senate.GetSheHe] создаёт огненные кольца и заставляет меня парить в воздухе!"
 aversarian_succession.0401.desc.no_contestants:0 "День за днем я жду прибытия участников. Большинство писем, разосланных потенциальным претендентам, остаются без ответа, немногие выражают явную незаинтересованность в поставленном на кон призе, а ещё меньше хоть как-то намекают на участие.\n\nКогда наконец наступает день турнира, слуги готовят помещения для одного-двух гостей, которые хотя бы проявили минимальный интерес. И мы ждём.\n\nСпустя некоторое время появляется [champion_of_the_blood_senate.GetFirstName] — в полном одиночестве и, судя по всему, [Select_CString(champion_of_the_blood_senate.IsFemale, 'озадаченная', 'озадаченный' )] отсутствием других участников не меньше моего. Мы беседуем за изысканным, но довольно неловким пиром, и когда становится очевидно, что больше никто не прибудет, я вручаю [champion_of_the_blood_senate.GetHerHim] атрибуты власти и фактическое правление [primary_scope.GetName]."
 aversarian_succession.0401.a.no_contestants_child:0 "[champion_of_the_blood_senate.GetFirstName] — [Select_CString(champion_of_the_blood_senate.IsFemale, 'потрясающая', 'потрясающий' )]! Я хочу быть точно [Select_CString(ROOT.Char.IsFemale, 'такой', 'таким' )] же, когда вырасту!"
 aversarian_succession.0401.a.no_contestants:0 "Как нелепо."


 aversarian_succession.0500.t:0 "Прибытие"
 aversarian_succession.0500.desc:0 "Я прибываю к месту проведения турнира и готовлюсь к своему первому бою."
 aversarian_succession.0500.desc.not_contestant:0 "Последние претенденты прибыли и размещены по своим покоям. Завтра на рассвете они отправятся на турнирную арену, где либо докажут, что являются сильнейшими [Concept('magi','магами')|E] и достойными правителями — либо погибнут в попытке.\n\nК счастью, я не буду участвовать в этом лично. Вместо этого я буду в безопасности, наблюдая за зрелищем с трибун."
 aversarian_succession.0500.a:0 "Пора побеждать."

 aversarian_succession.0502.t:0 "Испытание кровью"
 aversarian_succession.0502.desc:0 "Я чувствую легчайшее напряжение, когда слышу, как глашатай зачитывает список и произносит моё имя.\n\n«[ROOT.Char.GetFullName] сойдется в бою с [opponent.GetFullName]! Да останется стоять тот, чья кровь чище!»"
 aversarian_succession.0502.a:0 "Да будет [ROOT.Char.GetFaith.HighGodName] на моей стороне."
 
 aversarian_succession.0503.t:0 "Новый правитель"
 aversarian_succession.0503.desc:0 "Турнир окончен, и все, кто стоял на моём пути, мертвы. Я [Select_CString(ROOT.Char.IsFemale, 'доказала', 'доказал' )], что являюсь Чистейшим, и теперь буду править всей [Concept('aversaria','Аверсарией')|E]!"
 aversarian_succession.0503.a:0 "Пусть моё правление будет долгим и процветающим."


 aversarian_succession.0505.t:0 "Восхождение Чистейшего"
 aversarian_succession.0505.desc:0 "Со смертью прежнего правителя и завершением турнира [Concept('magi','магов')|E], усеявшего арену трупами многих знатных мужей и жен, на вершине остается лишь [Select_CString(champion_of_the_blood_senate.IsFemale, 'одна', 'один' )] - [champion_of_the_blood_senate.GetFullName]. Теперь [champion_of_the_blood_senate.GetSheHe] правит всей державой, доказав, что [champion_of_the_blood_senate.GetHerHis] кровь чистейшая."
 aversarian_succession.0505.a:0 "И на этом я уступаю трон."

 aversarian_succession.0600.t:0 "Испытание кровью"
 aversarian_succession.0600.desc:0 "Глашатай зачитывает список, вызывая следующую пару претендентов.\n\n«[first_ongoing_contestant.GetFullName] сойдется в бою с [second_ongoing_contestant.GetFullName]! Да останется стоять тот, чья кровь чище!»\n\nПосле ожесточённого боя [first_ongoing_contestant.GetFirstName] объявляется победителем, а [first_ongoing_contestant.GetHerHis] [Select_CString(second_ongoing_contestant.IsFemale, 'противница', 'противник' )] превращается в обугленный труп."
 aversarian_succession.0600.a:0 "Славный бой."