l_russian:

 sjalvolki_succession.0001.t:0 "Великий cьялволкский Доваткнинг"
 sjalvolki_succession.0001.desc:0 "В кронах деревьев замер трепет, буря клубится в грозовых тучах. Из столицы во все стороны, во все уголки, от самых глубоких долин до высочайших пиков устремляются искуснейшие всадники. Слова их просты, слова их мрачны, и по мере того как весть доходит от клана к клану, вестников уже опережает сама молва. Она ширяется, точно река в половодье, и вскоре во всех землях лишь об этом и говорят:\n\n[SCOPE.sC('previous_holder').GetTitledFirstName] [Select_CString(previous_holder.IsFemale, 'мертва', 'мёртв' )].\n\nТраур вспыхивает и утихает, как повелевает добрый сьялволькский обычай, и вскоре ему на смену приходят новые слова. Это слова ритуала и традиции, уходящей корнями в глубь веков. Это слова тысячи давних [previous_holder.GetTitleAsNameNoTooltip] прошлого, ушедших в небытие и истлевших в грязи. Это слова всего народа сьялволков, верные и истинные:\n\nДоваткнинг близкл.\n\nПо всей земле все, в чьих жилах течёт королевская кровь, и все вожди — от великих до самых малых — слышат зов, ибо мертва глава, носившая корону, и свободна она для достойного. Единственное, что стоит на пути каждого вождя, — это все остальные проклятые глупцы. И вот, взяв свои мечи, щиты и топоры, они скачут на поля битв своих предков. Но кому же из них предстоит взойти на престол [previous_holder.GetPrimaryTitle.GetName]?"
 sjalvolki_succession.0001.a:0 "Правителем станет тот, кто останется последним, , — и я намереваюсь им стать"
 sjalvolki_succession.0001.a.brave:0 "Я не трус — ни одно истинное дитя, что чтит [ROOT.GetCharacter.GetFaith.HighGodName], не отступит перед этим испытанием."
 sjalvolki_succession.0001.a.callous:0 "Неважно, я срублю голову каждому мерзавцу, если потребуется."
 sjalvolki_succession.0001.a.sadistic:0 "О да, я наслажусь этим кровопролитием!"
 sjalvolki_succession.0001.a.zealous:0 "[ROOT.GetCharacter.GetFaith.HighGodName] предначертал Доваткнинг не просто так!"
 sjalvolki_succession.0001.b:0 "Никакого Доваткнинга не будет."
 sjalvolki_succession.0001.c:0 "Что ж, кто-то другой, но не я."
 will_join_sjalvolki_succession_tt:0 "Вы примете участие в Доваткнинге, пытаясь доказать свое право на [previous_holder.GetPrimaryTitle.GetName]."
 no_sjalvolki_succession_tt:0 "#N Вы откажетесь проводить Доваткнинг и вместо этого захватите [previous_holder.GetPrimaryTitle.GetName] силой. Это будет воспринято как крайнее проявление тирании и даст всем вашим вассалам претензию на ваш титул!#!"
 
 sjalvolki_succession.0002.t:0 "Оспорить престол?"
 sjalvolki_succession.0002.desc:0 "Весть прилетает в [ROOT.Char.GetPrimaryTitle.GetName] и к моим устам на крыльях чёрного ветра. [SCOPE.sC('previous_holder').GetFullName] [Select_CString(previous_holder.IsFemale, 'мертва', 'мёртв' )].\n\nМой сюзерен [Select_CString(previous_holder.IsFemale, 'мертва', 'мёртв' )].\n\nНа мгновение я представляю родню [previous_holder.GetTitledFirstNamePossessive], окружённую множеством почтенных шаманов. Но мне не нужен ни один из них, чтобы понять, что будет дальше.\n\nМои права как [ROOT.Char.GetTitleAsNameNoTooltip] неоспоримы: место на Доваткнинге принадлежит мне по праву. Нужна лишь моя воля. Мои собратья-вассалы знают это не хуже меня и, без сомнения, уже скачут в столицу, дабы заявить о своем намерении сражаться за корону.\n\nВопрос лишь в одном: буду ли я среди них?  Каково бы ни было мое решение, действовать нужно быстро: если я не заявлю о своем притязании на трон в течение недели, я потеряю это право!"
 sjalvolki_succession.0002.a:0 "Сегодня восходит моя звезда."
 sjalvolki_succession.0002.b:0 "Меня не интересует эта затея."
 
 sjalvolki_succession.0003.t:0 "Оспорить престол?"
 sjalvolki_succession.0003.desc:0 "Я узнаю новости ещё до того, как слова срываются с мрачного лица гонца. Моя родня, [SCOPE.sC('previous_holder').GetFullName], [Select_CString(previous_holder.IsFemale, 'мертва', 'мёртв' )]. [previous_holder.GetSheHe] [Select_CString(previous_holder.IsFemale, 'мертва', 'мёртв' )].\n\nnМои шаманы слетаются ко мне, точно угрюмое воронье, соболезнуя и воссылая молитвы. Но громче всех сквозь этот шум звучит голос [realm_priest.GetFullName]:\n\n«Доваткнинг близко! Как [Select_CString(ROOT.Char.IsFemale, 'родственница', 'родственник' )]  [Select_CString(previous_holder.IsFemale, 'павшей', 'павшего' )] [SCOPE.sC('previous_holder').GetFullNameNoTooltip], вы имеете кровное право заявить свои притязания на [previous_holder.GetPrimaryTitleNoTooltip]. Ибо, как гласит учение, что заповедал нам [previous_holder.GetFaith.HighGodName]: лишь могущественнейший из владык способен сдержать натиск Тех, Кто Выше.»\n\n[realm_priest.GetFirstNameNoTooltip] бросает на меня пристальный взгляд. «[Select_CString(ROOT.Char.IsFemale, 'Моя госпожа', 'Мой господин' )], вы должны решить, объявиnt ли вы о своем участии в течение недели, иначе вы потеряете притязания. Что вы скажете?»"
 sjalvolki_succession.0003.a:0 "Я знаю себе цену, и вскоре её узнает вся держава."
 sjalvolki_succession.0003.b:0 "Пусть остальные грызутся. Я останусь в стороне."
 
 sjalvolki_succession.0004.t:0 "Первое кольцо!"
 sjalvolki_succession.0004.desc:0 "С первым лучом солнца я выбираю самого быстрого скакуна и во весь опор мчусь в столицу [SCOPE.sC('previous_holder').GetFirstNameNoTooltip]. На всем пути извилистые дороги забиты людьми всех сословий, плетущимися к месту состязания в надежде хоть краем глаза увидеть будущего [SCOPE.sC('previous_holder').GetTitleAsNameNoTooltip]. Путешествие занимает как минимум на неделю дольше, чем ожидалось.\n\nО приближении к цели я догадываюсь по огромному столбу на горизонте. Он увешан знаменами всех шаманов [previous_holder.GetPrimaryTitle.GetName], образуя высокую пеструю башню. У его подножия раскинулось море палаток, каждая из которых украшена гербами и знаками претендентов. Обстановка напряженная, но захватывающая, и участники сгорают от нетерпения испытать свою доблесть. Они точно знают, где искать желанную славу:\n\nЧетыре Великих кольца.\n\nНа второй день меня ведут к Первому. На вид он почти груб в своей простоте — грязная трясина, огороженная деревянными кольями. Но стоит сделать шаг внутрь, как открывается опасность: земля здесь словно засасывающее болото, готовое поглотить человека так же легко, как сапог.\n\nДругие кандидаты уже заняли свои позиции, и я делаю то же самое. Я поправляю стойку и крепче сжимаю оружие."
 sjalvolki_succession.0004.a:0 "Будто пытаясь пробудить Тех, Кто Выше, над открытым полем трубят в великий рог."
 
 sjalvolki_succession.0005.t:0 "Второе кольцо!"
 sjalvolki_succession.0005.desc:0 "С первым лучом солнца я выбираю самого быстрого скакуна и во весь опор мчусь в столицу [SCOPE.sC('previous_holder').GetFirstNameNoTooltip]. На всем пути извилистые дороги забиты людьми всех сословий, плетущимися к месту состязания в надежде хоть краем глаза увидеть будущего [SCOPE.sC('previous_holder').GetTitleAsNameNoTooltip]. Путешествие занимает как минимум на неделю дольше, чем ожидалось.\n\nО приближении к цели я догадываюсь по огромному столбу на горизонте. Он увешан знаменами всех шаманов [previous_holder.GetPrimaryTitle.GetName], образуя высокую пеструю башню. У его подножия раскинулось море палаток, каждая из которых украшена гербами и знаками претендентов. Обстановка напряженная, но захватывающая, и участники сгорают от нетерпения испытать свою доблесть. Они точно знают, где искать желанную славу:\n\nЧетыре Великих кольца.\n\nвеличественному куполу, сложенному из круглых щитов около десяти метров в высоту. Дюжий стражник убирает пару щитов, открывая проход, и я погружаюсь во тьму. Щели в этой конструкции — единственный источник света, но даже при этом я ощущаю присутствие своих соперников, застывших в напряженном молчании. Я иду по каменному полу, находя свободное местечко. Странное чувство — оказаться в ловушке с таким количеством буйных бойцов в месте, где при этом царит абсолютная тишина..."
 sjalvolki_succession.0005.a:0 "И затем, снаружи нашего темного деревянного склепа, завывает рог."
 
 sjalvolki_succession.0006.t:0 "Третье кольцо"
 sjalvolki_succession.0006.desc:0 "С первым лучом солнца я выбираю самого быстрого скакуна и во весь опор мчусь в столицу [SCOPE.sC('previous_holder').GetFirstNameNoTooltip]. На всем пути извилистые дороги забиты людьми всех сословий, плетущимися к месту состязания в надежде хоть краем глаза увидеть будущего [SCOPE.sC('previous_holder').GetTitleAsNameNoTooltip]. Путешествие занимает как минимум на неделю дольше, чем ожидалось.\n\nО приближении к цели я догадываюсь по огромному столбу на горизонте. Он увешан знаменами всех шаманов [previous_holder.GetPrimaryTitle.GetName], образуя высокую пеструю башню. У его подножия раскинулось море палаток, каждая из которых украшена гербами и знаками претендентов. Обстановка напряженная, но захватывающая, и участники сгорают от нетерпения испытать свою доблесть. Они точно знают, где искать желанную славу:\n\nЧетыре Великих кольца.\n\nа второй день меня проводят к Третьему — весьма дурному знамению, как заявляют шаманы. Я понимаю их смысл, когда вижу арену: кольцо огня, медленно прогорающее внутрь по сухой соломе. Воздух пылает и задыхается от дыма. Я спешу сквозь единственный проход в огненном кольце, пока эта проклятая преграда не сжалась еще сильнее. Остальные тоже натянуты как струны. Долго ждать нам не приходится."
 sjalvolki_succession.0006.a:0 "Сквозь рев пламени громко трубит рог."
 
 sjalvolki_succession.0007.t:0 "Четвёртое кольцо!"
 sjalvolki_succession.0007.desc:0 "С первым лучом солнца я выбираю самого быстрого скакуна и во весь опор мчусь в столицу [SCOPE.sC('previous_holder').GetFirstNameNoTooltip]. На всем пути извилистые дороги забиты людьми всех сословий, плетущимися к месту состязания в надежде хоть краем глаза увидеть будущего [SCOPE.sC('previous_holder').GetTitleAsNameNoTooltip]. Путешествие занимает как минимум на неделю дольше, чем ожидалось.\n\nО приближении к цели я догадываюсь по огромному столбу на горизонте. Он увешан знаменами всех шаманов [previous_holder.GetPrimaryTitle.GetName], образуя высокую пеструю башню. У его подножия раскинулось море палаток, каждая из которых украшена гербами и знаками претендентов. Обстановка напряженная, но захватывающая, и участники сгорают от нетерпения испытать свою доблесть. Они точно знают, где искать желанную славу:\n\nЧетыре Великих кольца.\n\nНа второй день меня проводят к Четвертому. Мое сердце падает. Я знаю, что говорят о Четвертом — что ты слышишь эту арену раньше, чем видишь, — и теперь понимаю почему. Находясь у самого края башни со знаменами, арена предстает предо мной во всей своей смердящей и убогой «красе». Простое заграждение из скота, связанного вместе веревками. Я пробиваюсь сквозь стадо, оказываясь лицом к лицу с противниками. Очень давно я не видел таких кислых лиц.\n\n«Таковы испытания сьялволков», — бормочет ближайший воин."
 sjalvolki_succession.0007.a:0 "И все же, даже сквозь рев скота, я слышу громкий клик рога."
 
 sjalvolki_succession.0008.t:0 "... Я оступаюсь."
 sjalvolki_succession.0008.desc:0 "Ни одна голова не выдержит первого же прямого удара, и резкий выпад заставляет меня пошатнуться. Следующее, что я помню, — как я смотрю снизу вверх на [ROOT.Var('partner').Char.GetTitledFirstName] с земли. [ROOT.Var('partner').Char.GetSheHe] приставляет кинжал к моему горлу и требует сдаться."
 sjalvolki_succession.0008.a:0 "Я не [Select_CString(ROOT.Char.IsFemale, 'дура', 'дурак' )]. Я сдаюсь."
 
 sjalvolki_succession.0009.t:0 "Сладкая победа"
 sjalvolki_succession.0009.desc:0 "Что бы там ни говорили, у [ROOT.Var('partner').Char.GetTitledFirstName] не было ни единого шанса, ибо как только мой удар достигает цели, [ROOT.Var('partner').Char.GetSheHe] валится на землю! Не теряя времени, я отбрасываю [ROOT.Var('partner').Char.GetHerHis] оружие и прижимаю своё к горлу [ROOT.Var('partner').Char.GetTitledFirstNamePossessiveNoTooltip]. Поражение читается на лице [Select_CString(ROOT.Var('partner').Char.IsFemale, 'воительницы', 'воина' )]. Я знаю это, и [ROOT.Var('partner').Char.GetSheHe] тоже.\n\nЭто быстрая и жалкая капитуляция."
 sjalvolki_succession.0009.a:0 "Идем дальше. Впереди могут быть новые битвы...""
 sjalvolki_succession.0009.b:0 "О нет, я ещё не [Select_CString(ROOT.Char.IsFemale, 'закончила', 'закончил' )] с тобой..."
 
 sjalvolki_succession.0010.t:0 "Удар и надрез"
 sjalvolki_succession.0010.desc:0 "[ROOT.Var('partner').Char.GetTitledFirstName] замирает на долгое время, и тишина между нами становится невыносимой. Блеск вспыхивает в [ROOT.Var('partner').Char.GetHerHis] глазах, и я понимаю [ROOT.Var('partner').Char.GetHerHis] замысел с опозданием на мгновение, когда кинжал вонзается в моё горло.\n\nРывок, поворот — моя голова бессильно опускается. Пока могильный холод окутывает меня, я вижу, как [ROOT.Var('partner').Char.GetFirstNameNoTooltip] вытирает [ROOT.Var('partner').Char.GetHerHis] клинок, прежде чем спешно удалиться."
 sjalvolki_succession.0010.a:0 "Но... Почему?"
 
 sjalvolki_succession.0011.t:0 "В плену"
 sjalvolki_succession.0011.desc:0 "Невзирая на всю мою ярость и законные притязания, которые я [Select_CString(ROOT.Char.IsFemale, 'намеревалась', 'намеревался' )] довести до неизбежного триумфа, я не могу сражаться на Доваткнинге из-за решётки темницы. Обстоятельства вынудили меня сняться с состязаний.."
 sjalvolki_succession.0011.a:0 "Я еще вернусь..."
 
 sjalvolki_succession.0051.t:0 "Четыре кольца"
 sjalvolki_succession.0051.desc:0 "Когда претенденты равными группами расходятся по четырём кольцам Доваткнинга, перед собравшейся толпой встаёт шаман, одетый в сверкающих шелках, держа в руках пышный золотой рог.\n\nШёлковый объясняет: «Те, кто претендует на [previous_holder.GetPrimaryTitle.GetName], найдут каждый из колец устроенным так, чтобы лучше всего проверить их достоинства — будь то стойкость, чутье, храбрость или справедливость.  ТЛишь те воины, что проявят себя первыми в одном из этих рингов — кто выйдет чемпионом! — смогут назвать себя достойными претендовать на трон [previous_holder.GetPrimaryTitle.GetNameNoTooltip]. И лишь величайший из четырех чемпионов наречется как [previous_holder.GetTitleAsNameNoTooltip]!\n\nТак повелевает традиция!», — произносит [Shaman.GetSheHe], словно эти слова сами по себе являются молитвой."
 sjalvolki_succession.0051.a:0 "И тогда Шёлковый подносит великий рог к губам и трубит."
 sjalvolki_succession.0051.a.cynical:0 "Что за чушь."
 sjalvolki_succession.0051.a.zealous:0 "Глубокие слова, я знаю их наизусть."
 scoff_at_speech_tt:0 "Вы открыто насмехаетесь над речью Шёлкового..."
 
 sjalvolki_succession.0101.t:0 "Битва в Первом кольце"
 sjalvolki_succession.0101.desc:0 "Звон стали и треск дерева наполняют воздух вокруг меня. Пробираясь сквозь густую грязь насколько могу, я замечаю [ROOT.Var('partner').Char.GetTitledFirstName], едва [Select_CString(ROOT.Var('partner').Char.IsFemale, 'удерживающую', 'удерживающего' )] [ROOT.Var('partner').Char.GetHerHis] равновесие. Я устремляю взгляд на [ROOT.Var('partner').Char.GetHerHis] и бросаюсь вперёд, но в последний момент [ROOT.Var('partner').Char.GetSheHe] парирует мой удар. Наши клинки скрещиваются, мы смотрим друг другу в глаза и видим лишь врага. Битва началась."
 sjalvolki_succession.0101.a:0 "Победа или смерть!"
 
 sjalvolki_succession.0102.t:0 "Битва в Первом кольце"
 sjalvolki_succession.0102.desc:0 "Я всё ещё цепляюсь за одно из копий, пытаясь удержать равновесие, когда слышу своё имя с другого конца поля. Я поднимаю взгляд и вижу [ROOT.Var('partner').Char.GetTitledFirstName], [Select_CString(ROOT.Var('partner').Char.IsFemale, 'направляющую', 'направляющего' )] на меня оружие и уже [Select_CString(ROOT.Var('partner').Char.IsFemale, 'приближающуюся', 'приближающегося' )]. За то малое время, что у меня есть, я опираюсь спиной в стену из копий, остриё впивается мне в спину— о острия которых царапается моя одежда, — и готовлюсь к бою. Едва [ROOT.Var('partner').Char.GetSheHe] подходит достаточно близко, я делаю рывок вперёд, занося оружие."
 sjalvolki_succession.0102.a:0 "Победа или смерть!"
 
 sjalvolki_succession.0103.t:0 "Я чемпион Первого кольца!"
 sjalvolki_succession.0103.desc:0 "Из грязи и топи я выхожу к ликующей толпе. Я [Select_CString(ROOT.Char.IsFemale, 'последняя оставшаяся', 'последний оставшийся' )] на ногах. Я чемпион Первого кольца Доваткнинга. Зрители скандируют моё имя, ребёнок забирается на плечи отца, чтобы разглядеть мое измазанное грязью лицо, и даже поверженные соперники не могут удержаться от поздравлений. Единственное, что стоит между мной и престолом — это три других чемпиона. Но это будет завтра..."
 sjalvolki_succession.0103.a:0 "...Ибо сегодня мы пируем!"
 
 sjalvolki_succession.0104.t:0 "Чемпион Первого кольца!"
 sjalvolki_succession.0104.desc:0 "Из-за копий и грязи Первого кольца поднимается [ROOT.Var('champion_of_the_first_ring').Char.GetTitledFirstName]. [Select_CString(ROOT.Var('champion_of_the_first_ring').Char.IsFemale, 'Заляпанная', 'Заляпанный' )] заскорузлой землей от шеи до пупка, [ROOT.Var('champion_of_the_first_ring').Char.GetSheHe] вскидывает руку перед толпой, которая отвечает ревом восторга.\n\nКак чемпион Первого кольца [ROOT.Var('champion_of_the_first_ring').Char.GetTitledFirstNameNoTooltip] торжествует над [ROOT.Var('champion_of_the_first_ring').Char.GetHerHis] соперниками. Теперь между [ROOT.Var('champion_of_the_first_ring').Char.GetFirstNameNoTooltip] и троном стоят лишь чемпионы остальных трёх колец..."
 sjalvolki_succession.0104.a:0 "Слава [ROOT.Var('champion_of_the_first_ring').Char.GetTitledFirstName]!"
 
 sjalvolki_succession.0201.t:0 "Битва во Втором кольце"
 sjalvolki_succession.0201.desc:0 "Блестящая сталь порхает вокруг меня, словно искры во тьме. До сих пор мне удавалось держаться в тени, нанося точечные удары там, где выпадал случай, но битва все еще кипит.\n\nЛишь когда я ощущаю, что стою спиной к спине с другим бойцом, я понимаю, что удача изменила мне. Между нами проходит мгновение тишины — мы чувствуем тяжелое дыхание друг друга... И затем мы разворачиваемся, нанося размашистые удары. Наша сталь сталкивается с резким скрежетом и сцепляется. В темноте перед собой я оказываюсь лицом к лицу с [ROOT.Var('partner').Char.GetTitledFirstName]. [ROOT.Var('partner').Char.GetSheHe] скалит зубы в ухмылке ."
 sjalvolki_succession.0201.a:0 "Отлично! Тогда станцуй со мной!"
 
 sjalvolki_succession.0202.t:0 "Битва во Втором кольце"
 sjalvolki_succession.0202.desc:0 "Я крадусь тяжелыми шагами по арене, наблюдая, как лучи света скользят по моему оружию. В потеневшем небе страшатся именно сверкающего человека.  Из моей позиции у центра купола из щитов вижу тонкие лучики света, мерцающие словно звезды, — верный признак крадущегося бойца. В другом месте дерево гулко трещит от ударов клинка о щит. Но если [ROOT.Var('partner').Char.GetTitledFirstName] думает, что это отвлечёт меня, то [ROOT.Var('partner').Char.GetSheHe] жестоко ошибается. Чувствуя, как [ROOT.Var('partner').Char.GetSheHe] приближается по брусчатке, я разворачиваюсь до того, как [ROOT.Var('partner').Char.GetSheHe] сможет подобраться слишком близко. И когда я чувствую, что [ROOT.Var('partner').Char.GetFirstName] замирает, я понимаю, что [Select_CString(ROOT.Char.IsFemale, 'нашла', 'нашёл' )]  [ROOT.Var('partner').Char.GetHerHis]."
 sjalvolki_succession.0202.a:0 "Я бросаюсь во тьму!"
 
 sjalvolki_succession.0203.t:0 "Я чемпион Второго кольца!"
 sjalvolki_succession.0203.desc:0 "Я понимаю, что [Select_CString(ROOT.Char.IsFemale, 'победила', 'победил' )], когда в непроглядную тьму Второго кольца наконец возвращается тишина. Стражники тоже это понимают: щиты, образующие купол, один за другим разбираются вокруг меня. В расширяющиеся щели заглядывают лица, пытаясь разглядеть победителя, и при виде меня толпа взрывается криками.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'вошла', 'вошёл' )] во Второе кольцо [Select_CString(ROOT.Char.IsFemale, 'обычной претенденткой, 'обычным претендентом' )]; когда же я снова выхожу на дневной свет, я — чемпион этого круга. Единственное, что стоит между мной и троном — это три других чемпиона. Но это будет завтра..."
 sjalvolki_succession.0203.a:0 "...Ибо сегодня мы пируем!"
 
 sjalvolki_succession.0204.t:0 "Чемпион Второго кольца!"
 sjalvolki_succession.0204.desc:0 "Когда битва Второго кольца наконец завершается без свидетелей, великий купол из щитов разбирают, открывая единственного оставшегося на ногах воина: [ROOT.Var('champion_of_the_second_ring').Char.GetTitledFirstName]. [Select_CString(ROOT.Var('champion_of_the_second_ring').Char.IsFemale, 'Полулслеплённая', 'Полуослеплённый' )] непривычным дневным светом, [ROOT.Var('champion_of_the_second_ring').Char.GetSheHe] берет минутку, чтобы прийти в себя. Толпа же, в отличие от [ROOT.Var('champion_of_the_second_ring').Char.GetHerHis], напротив, лишена всякого такта и быстро начинает скандировать имя [ROOT.Var('champion_of_the_second_ring').Char.GetFirstNameNoTooltip].\n\nКак чемпион Второго кольца [ROOT.Var('champion_of_the_second_ring').Char.GetTitledFirstNameNoTooltip] торжествует над [ROOT.Var('champion_of_the_second_ring').Char.GetHerHis] соперниками. Теперь все, что стоит между [ROOT.Var('champion_of_the_second_ring').Char.GetHerHim] и троном, — это чемпионы остальных трех колец..."
 sjalvolki_succession.0204.a:0 "Слава [ROOT.Var('champion_of_the_second_ring').Char.GetTitledFirstName]!"
 
 sjalvolki_succession.0301.t:0 "Битва в Третьем кольце"
 sjalvolki_succession.0301.desc:0 "Между бушующим огнём и толпой закованных в броню воинов я выбираю первое. Чувствуя, как огонь лижет мою спину, я с мрачным удовлетворением понимаю, что по крайней мере со спины меня никто не застанет врасплох..\n\nСпереди — другое дело. Дым на краю кольца настолько густой, что выедает глаза и дерет горло. После второго приступа кашля у меня возникает ощущение, что за мной наблюдают. Взглянув влево, я замечаю [ROOT.Var('partner').Char.GetTitledFirstName], наполовину [Select_CString(ROOT.Var('partner').Char.IsFemale, 'скрытую', 'скрытого' )] в дыму и [Select_CString(ROOT.Var('partner').Char.IsFemale, 'оценивающую', 'оценивающего' )] меня, точно мерзкая змея."
 sjalvolki_succession.0301.a:0 "Ха. Хитро..."
 
 sjalvolki_succession.0302.t:0 "Битва в Третьем кольце"
 sjalvolki_succession.0302.desc:0 "Между бушующим огнём и толпой закованных в броню воинов я выбираю последних. Я бросаюсь в бой, подняв оружие к небу.\n\nИ я [Select_CString(ROOT.Char.IsFemale, 'такая не одна', 'такой не один' )].\n\nПрямо на меня с безумной яростью мчится [ROOT.Var('partner').Char.GetTitledFirstName], [Select_CString(ROOT.Var('partner').Char.IsFemale, 'похожая', 'похожий' )] на взбешенного  зверя. Мы сходимся в центре кольца, парируя удары друг друга... раз, два, три! Сквозь дымное марево рассекают наши клинки, но ни один не находит цель. До тех пор, пока..."
 sjalvolki_succession.0302.a:0 "...пока я не меняю стойку и не наношу удар ниже."
 
 sjalvolki_succession.0303.t:0 "Я чемпион Третьего кольца!"
 sjalvolki_succession.0303.desc:0 "Когда мой последний враг повержен и вынужден выскочить обратно сквозь огненное кольцо, стражники бросаются тушить пламя вёдрами воды. Третье кольцо гаснет с громким шипением, оставляя меня в одиночестве посреди выжженного пятачка, где еще мгновение назад бушевал огонь. Я вытираю сажу с лица и жадно делаю глубокий вдох чистого воздуха.\n\nПережив и огонь, и врагов, я [Select_CString(ROOT.Char.IsFemale, 'объявлена', 'объявлен' )] чемпионом Третьего кольца перед восхищенной толпой. Единственное, что стоит между мной и троном — это три других чемпиона. Но это будет завтра..."
 sjalvolki_succession.0303.a:0 "...Ибо сегодня мы пируем!"
 
 sjalvolki_succession.0304.t:0 "Чемпион Третьего кольца!"
 sjalvolki_succession.0304.desc:0 "Из пылающего костра Третьего кольца выходит [ROOT.Var('champion_of_the_third_ring').Char.GetTitledFirstName], [Select_CString(ROOT.Var('champion_of_the_third_ring').Char.IsFemale, 'похожая', 'похожий' )] на жуткому чудовищу из легенд. [Select_CString(ROOT.Var('champion_of_the_third_ring').Char.IsFemale, 'Покрытая', 'Покрытый' )] с головы до ног чёрной сажей, [ROOT.Var('champion_of_the_third_ring').Char.GetFirstNameNoTooltip] вытирает [ROOT.Var('champion_of_the_third_ring').Char.GetHerHis] лицо одной рукой. Судя по взгляду, который чемпион Третьего кольца бросает на ликующую толпу, [ROOT.Var('champion_of_the_third_ring').Char.GetTitledFirstNameNoTooltip] выглядит почти [Select_CString(ROOT.Var('champion_of_the_third_ring').Char.IsFemale, 'ошеломлённой', 'ошеломлённым' )] тем, что битва окончена. Проходит немало времени, прежде чем [ROOT.Var('champion_of_the_third_ring').Char.GetSheHe] начинает праздновать.\n\n[ROOT.Var('champion_of_the_third_ring').Char.GetTitledFirstName] торжествует над [ROOT.Var('champion_of_the_third_ring').Char.GetHerHis] соперниками. Теперь между [ROOT.Var('champion_of_the_third_ring').Char.GetHerHim] и троном стоят лишь чемпионы остальных трёх колец..."
 sjalvolki_succession.0304.a:0 "Слава [ROOT.Var('champion_of_the_third_ring').Char.GetTitledFirstName]!"
 
 sjalvolki_succession.0401.t:0 "Битва в Четвёртом кольце"
 sjalvolki_succession.0401.desc:0 "Когда звук рога заставляет испуганный скот сорваться с привязи и в панике выбежать на арену, я осторожно пробираюсь сквозь взбудораженное стадо.  На столь непредсказуемой арене я не спешу. А вот [ROOT.Var('partner').Char.GetTitledFirstName] не [Select_CString(ROOT.Var('partner').Char.IsFemale, 'такова', 'таков' )]. [ROOT.Var('partner').Char.GetSheHe] карабкается по тушам животных с дикой отвагой; даже дурак поймёт, что [ROOT.Var('partner').Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Var('partner').Char.IsFemale, 'нацелилась', 'нацелился' )] именно в меня. Когда [ROOT.Var('partner').Char.GetSheHe] преодолевает хаос и приближается, я крепче сжимаю оружие..."
 sjalvolki_succession.0401.a:0 "Ближе... Ближе... СЕЙЧАС!"
 
 sjalvolki_succession.0402.t:0 "Битва в Четвёртом кольце"
 sjalvolki_succession.0402.desc:0 "Я не могу позволить бешеному скоту решать мою судьбу. Похоже, этого не желает и [ROOT.Var('partner').Char.GetTitledFirstName], [ROOT.Var('partner').Char.GetSheHe] шагает навстречу мне в центр арены. Оказавшись там, отрезанные от других участников беснующимися животными, мы пристально смотрим друг другу в глаза. [ROOT.Var('partner').Char.GetSheHe] кивает, и я тоже, каждый из нас оценивая все еще не обнаженное оружие соперника.\n\nГде-то над ревом стада пронзительно кричит птица..."
 sjalvolki_succession.0402.a:0 "...К оружию!"
 
 sjalvolki_succession.0403.t:0 "Я чемпион Четвёртого кольца!"
 sjalvolki_succession.0403.desc:0 "К тому времени, когда подоспевшие смотрители наконец успокаивают скот, я остаюсь [Select_CString(ROOT.Char.IsFemale, 'единственной стоящей', 'единственным стоящим')] на ногах среди поверженных противников. Судя по их стонам, многие были попросту растоптаны в общей куче, и лекари спешат оказать им помощь.\n\nЧто касается меня, мне помощь не нужна. Я [Select_CString(ROOT.Char.IsFemale, 'последняя оставшася', 'последний оставшийся' )] из воинов в Четвёртом кольце Доваткнинга, и эти слова звучат слаще любого бальзама. Единственное, что стоит между мной и троном — это три других чемпиона. Но это будет завтра..."
 sjalvolki_succession.0403.a:0 "...Ибо сегодня мы пируем!"
 
 sjalvolki_succession.0404.t:0 "Чемпион Четвёртого кольца!"
 sjalvolki_succession.0404.desc:0 "Пережив Четвёртое кольцо и его довольно... бурное течение, [champion_of_the_fourth_ring.GetTitledFirstName] выходит бесспорным победителем. Хотя некоторые могут сомневаться в достоинствах Четвёртого кольца и его традициях, шаманы быстро развеивают эти сомнения: [champion_of_the_fourth_ring.GetFirstNameNoTooltip] твёрдо [Select_CString(champion_of_the_fourth_ring.IsFemale, 'возвысилась', 'возвысился' )] над остальными и столь же [Select_CString(champion_of_the_fourth_ring.IsFemale, 'достойна', 'достоин' )] трона не меньше любого другого победителя. И, как и в случае с прочими, между [champion_of_the_fourth_ring.GetHerHim] и троном стоят лишь чемпионы остальных трёх колец. В этом нет никаких сомнений.."
 sjalvolki_succession.0404.a:0 "Слава [champion_of_the_fourth_ring.GetTitledFirstName]!"
 
 sjalvolki_succession.0500.t:0 "Последнее кольцо"
 sjalvolki_succession.0500.desc:0 "Несмотря на всю помпезность и пышность ночного пира, утро последнего дня Доваткнинга начинается в тишине. Разбуженные еще до восхода солнца, мы, четверо чемпиона, преломляем хлеб с Шёлковым и всеми его подчинёнными шаманами. Они объясняют, что их долг — привести нас к месту Последнего кольца. Когда наконец нас подводят к центральному монументу — великой башне со знаменами, — это вызывает немалое замешательство. Но шаманы невозмутимы, и их владыка возносит голос к небу.\n\n«Мы, сьялволки являемся хранителями Срединного Мира, и собрались здесь сегодня, дабы определить законного правителя [SCOPE.sC('previous_holder').GetPrimaryTitle.GetName], мы должны помнить об этой ответственности. Но будьте уверены, чемпионы Четырёх колец, вы, сочтившие себя достойными этой державы: за вашей спиной стоят легионы славных предков. И скоро вы вознесётесь на их плечах.»\n\nКивнув ближайшему слуге, Шёлковый подзывает шамана в красных одеждах, держащего над головой секиру. По быстрой команде шаман вонзает топор в монумент, раз за разом обрушивая мощные удары на дерево.\n\nОратор продолжает.\n\n«Срубая нашу башню традиции, мы объявляем, что история [SCOPE.sC('previous_holder').GetFullName] окончена. И лишь одному из вас четырёх чемпионов предстоит определить, что будет дальше.»\n\nКогда великая башня наконец валится на землю, рушась в относительной безопасности, нам, чемпионам, приказывают взойти на поваленный ствол. Я крепче сжимаю оружие и окидываю взглядом противников. Один пытается удержать равновесие; другой явно ошеломлён происходящим..."
 sjalvolki_succession.0500.a:0 "«... А третий смотрит прямо на меня.»"
 
 sjalvolki_succession.0501.t:0 "Слишком [Select_CString(ROOT.Var('partner').Char.IsFemale, 'быстра', 'быстр' )]"
 sjalvolki_succession.0501.desc:0 "[ROOT.Var('partner').Char.GetTitledFirstName] делает первый ход, направляя [ROOT.Var('partner').Char.GetHerHis] оружие книзу. Хотя я отбиваю выпад в сторону, с самого начала [ROOT.Var('partner').Char.GetSheHe] заставляет меня отступать. Мы сходимся вновь и вновь, наше оружие со скрежетом рассекает утренний воздух при каждом столкновении. Несколько раз мне кажется, что [ROOT.Var('partner').Char.GetTitledFirstName] вот-вот одолеет меня, но мне удается выкрутиться в самый последний момент. Но [ROOT.Var('partner').Char.GetSheHe] [Select_CString(ROOT.Var('partner').Char.IsFemale, 'агрессивна', 'агрессивен' )], и сегодня [ROOT.Var('partner').Char.GetSheHe] сильнее. У меня есть лишь один-единственный шанс..."
 sjalvolki_succession.0501.a:0 "Один шаг... Два шага... Три и СЕЙЧАС!"
 
 sjalvolki_succession.0502.t:0 "Слишком медленно"
 sjalvolki_succession.0502.desc:0 "Какие бы планы ни [Select_CString(ROOT.Var('partner').Char.IsFemale, 'строила', 'строил' )] [ROOT.Var('partner').Char.GetTitledFirstName], они рушатся, едва я наношу первый удар. Я нападаю на своего врага подобно дикому зверю, продвигаясь вперёд прямо в [ROOT.Var('partner').Char.GetHerHis] защитную дистанцию. [ROOT.Var('partner').Char.GetSheHe] делает шаг назад, а затем [ROOT.Var('partner').Char.GetTitleAsNameNoTooltip] отступает ещё на пять. Я продолжаю давить, вынуждая [ROOT.Var('partner').Char.GetFirstNameNoTooltip] продолжать отступать. Но в конце концов один из моих выпадов выбивает [ROOT.Var('partner').Char.GetHerHis] из равновесия, и [ROOT.Var('partner').Char.GetTitledFirstNameNoTooltip] оседает на одно колено..."
 sjalvolki_succession.0502.a:0 "Ты [Select_CString(ROOT.Var('partner').Char.IsFemale, 'моя', 'мой' )] !"
 
 sjalvolki_succession.0503.t:0 "Я чемпион Доваткнинга!"
 sjalvolki_succession.0503.desc:0 "Когда последний враг падает и соскальзывает в грязь, над полем проносится оглушительный клич. Внезапный порыв ветра доносит звук трубящего рога, отзываясь чем-то древним. Я поворачиваюсь и смотрю вниз на собравшуюся толпу.\n\nВсё кончено.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'победила', 'победил' )].\n\nЯ едва могу поверить в это, когда Шелковый и все его слуги выходят вперед, чтобы поздравить меня как победителя. С их приближением толпа зрителей взрывается неистовым ликованием. Это ставит точку. Доваткнинг завершён, и престол принадлежит мне."
 sjalvolki_succession.0503.a:0 "Мой след оставлен в истории."
 
 sjalvolki_succession.0504.t:0 "Чемпион Доваткнинга!"
 sjalvolki_succession.0504.desc:0 "[ROOT.Var('champion_of_the_fifth_ring').Char.GetTitledFirstName] вышел [Select_CString(ROOT.Var('champion_of_the_fifth_ring').Char.IsFemale, 'вышла', 'вышел' )] из Последнего кольца Доваткнинга, одержав победу над всеми соперниками. Пока придворный жрец обнимает победителя в традиционном жесте, уже ползут слухи о планах о подготовки к [ROOT.Var('champion_of_the_fifth_ring').Char.GetHerHis] коронации."
 sjalvolki_succession.0504.a:0 "Слава [ROOT.Var('champion_of_the_fifth_ring').Char.GetTitledFirstName]!"
 
 sjalvolki_succession.0506.t:0 "Чемпион Доваткнинга!"
 sjalvolki_succession.0506.desc:0 "[champion_of_the_fifth_ring.GetTitledFirstName] [Select_CString(champion_of_the_fifth_ring.IsFemale, 'вышла', 'вышел' )] из Последнего кольца Доваткнинга, одержав победу над всеми соперниками. Пока придворный жрец обнимает победителя в традиционном жесте, уже ползут слухи о планах о подготовки к [ROOT.Var('champion_of_the_fifth_ring').Char.GetHerHis] коронации.\n\n"
 sjalvolki_succession.0506.desc.bitter_loser:0 "Разумеется, это означает, что моё время в качестве временного регента [primary_scope.GetName] подходит к концу. Подумать только, что [Select_CString(champion_of_the_fifth_ring.IsFemale, 'такая некомпетентная идиотка', 'такой некомпетентный болван' )], как [champion_of_the_fifth_ring.GetFirstName], [Select_CString(champion_of_the_fifth_ring.IsFemale, 'смогла', 'смог' )] выиграть Доваткнинг... Это отдает нечистой игрой! Однако традиция гласит, чтобы именно [champion_of_the_fifth_ring.GetSheHe] [Select_CString(champion_of_the_fifth_ring.IsFemale, 'стала', 'стал' )] новым правителем, и, к сожалению, я ничего не могу с этим поделать."
 sjalvolki_succession.0506.a:0 "Слава [champion_of_the_fifth_ring.GetTitledFirstName]!"
 sjalvolki_succession.0506.a.bitter_loser:0 "[Select_CString(champion_of_the_fifth_ring.IsFemale, 'Эта', 'Этот' )] [champion_of_the_fifth_ring.Custom('InsultAdjective')] [champion_of_the_fifth_ring.Custom('InsultNoun')|U]! Пусть [champion_of_the_fifth_ring.GetHerHis] правление принесёт только разорение!"