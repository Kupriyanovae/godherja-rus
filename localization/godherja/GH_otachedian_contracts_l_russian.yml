l_russian:

 ##################################################
 # OTACHEDIAN GOVERNANCE CONTRACTS
 ##################################################

 # Shared tooltips
 gh_otachedian_contract_success_tt:0 "The matter has been resolved. The county will remember your administration fondly."
 gh_otachedian_contract_failure_tt:0 "The matter has not been resolved. The county bears the cost of your inaction."

 # Shared option names (travel / decline)
 gh_otachedian_contract_event.travel:0 "I will travel at once."
 gh_otachedian_contract_event.decline:0 "I have more pressing concerns."

 ##################################################
 # 1000-1001, VIDVAOO SCHOLAR DISPUTE
 ##################################################

 gh_otachedian_contract_event.1000.t:0 "The Scholars and the Frightened Villages"

 gh_otachedian_contract_event.1000.desc:0 "A petition has arrived bearing many anxious seals. Scholars of the Vidvaookeyatran faith, celebrated guardians of the realm's arcane knowledge, have established an encampment near a cluster of farms and villages. The experiments they conduct are ambitious, perhaps brilliant, yet also, by all reports, terrifying to those who do not share their enthusiasm.\n\nFires that do not burn, sounds from empty air, livestock spooked by things unseen. The villagers are frightened, and frightened people write grievances.\n\nYour [paiza|E] administration must address this before unease becomes unrest."

 gh_otachedian_contract_event.1000.a:0 "Travel to the county and speak with the scholars."
 gh_otachedian_contract_event.1000.a_tt:0 "You will travel to the location of the disturbance."
 gh_otachedian_contract_event.1000.b:0 "I have no time for superstitious villages."

 gh_otachedian_contract_event.1001.desc:0 "The scholars are not difficult to find; their work announces itself. What seemed like arcane chaos from a distance resolves into something almost methodical. They are genuinely trying to learn. They are also making life miserable for everyone within a mile.\n\nThe village elder stands nearby, arms folded, jaw tight. The lead scholar holds out a device that hums at a frequency that makes your teeth itch and explains, at length, why this is wonderful.\n\nBoth parties look to you."

 gh_otachedian_contract_event.1001.a:0 "Issue a formal directive compelling the scholars to restrict their experiments. [change_influence = minor_influence_loss]"
 gh_otachedian_contract_event.1001.b:0 "Publicly praise the scholars, but promise the village the situation will improve. [add_prestige = -minor_prestige_gain]"
 gh_otachedian_contract_event.1001.c:0 "Fund the construction of a dedicated research facility away from the settlements. [remove_short_term_gold = 50]"
 gh_otachedian_contract_event.1001.d:0 "Examine the research yourself and speak plainly to both sides."

 gh_otachedian_contract_event.1001.d.success:0 "You understand enough of what you see to speak to it with authority. You explain the purpose behind the work to the villagers, not everything, but enough. You explain the impact of their fear on the research to the scholars clearly. Both parties leave the meeting feeling heard, and somewhat chastened."
 gh_otachedian_contract_event.1001.d.failure:0 "The device the scholar is explaining makes a sound you were not prepared for, and your reaction, nentirely involuntary, does not inspire confidence. The villagers take it as confirmation of their fears. The scholars are embarrassed on your behalf. You leave having helped no one."
 gh_otachedian_contract_event.1001.success_tt:0 "Your understanding of the research allowed you to mediate effectively."
 gh_otachedian_contract_event.1001.failure_tt:0 "You were out of your depth and both sides could tell."

 # Modifier names
 gh_otachedian_scholar_dispute_success_modifier:0 "Scholarly Order Restored"
 gh_otachedian_scholar_dispute_failure_modifier:0 "Scholar-Village Tensions"

 ##################################################
 # 2000-2001, COUNTERFEIT AYRAAL
 ##################################################

 gh_otachedian_contract_event.2000.t:0 "The False [paiza|E]"

 gh_otachedian_contract_event.2000.desc:0 "An Ayraal holder, the sort of fastidious, meticulous man who keeps records maintained for the region, has presented your court with an uncomfortable find. Several Ayraals bearing your authority have been identified as counterfeits. The metal is wrong. The etching is close, but not exact. They have been circulating in the market district of several locales.\n\nSomeone, somewhere, has decided that forging your authority is worth the risk."

 gh_otachedian_contract_event.2000.a:0 "Travel to the town and root out the source."
 gh_otachedian_contract_event.2000.a_tt:0 "You will travel to the location of the counterfeiting."
 gh_otachedian_contract_event.2000.b:0 "Let the local officials handle it."

 gh_otachedian_contract_event.2001.desc:0 "The market district smells of hot metal and nervous sweat. The town's officials present their suspect list, a dozen names, half plausible. Witnesses describe a back-room engraver, a merchant who asked too many questions about Ayraal weights, and a clerk who resigned without notice two weeks prior.\n\nCounterfeit Ayraals are not merely theft. They are a forgery of your name, your authority. Whoever is responsible has decided they can imitate the voice of order for personal gain. They must be proven wrong, decisively."

 gh_otachedian_contract_event.2001.a:0 "Activate your informant networks within the town to expose the ring. [change_influence = minor_influence_loss]"
 gh_otachedian_contract_event.2001.b:0 "Make a visible public example of the known forgers to restore confidence. [add_prestige = -minor_prestige_gain]"
 gh_otachedian_contract_event.2001.c:0 "Replace the counterfeit Ayraals with genuine issues from your treasury. [remove_short_term_gold = 50]"
 gh_otachedian_contract_event.2001.d:0 "Personally interrogate the key suspects and trace the network yourself."

 gh_otachedian_contract_event.2001.d.success:0 "You work through the list methodically, what questions reveal, what silences confirm. By the second day you have a name, a location, and a ledger that names three more. The forgery ring is dismantled with enough evidence to make the charges hold. Your name on Ayraal metal means something again."
 gh_otachedian_contract_event.2001.d.failure:0 "The interrogation goes poorly. The suspects are more composed than expected, or better-coached. You come away with suspicions and no proof, and the forger, whoever they are, has had time to move. The case goes cold. The counterfeits keep circulating."
 gh_otachedian_contract_event.2001.success_tt:0 "You traced and dismantled the counterfeiting network yourself."
 gh_otachedian_contract_event.2001.failure_tt:0 "The trail went cold; the forgery ring remains at large."

 # Modifier names
 gh_otachedian_counterfeit_ayraal_success_modifier:0 "Restored Economic Trust"
 gh_otachedian_counterfeit_ayraal_failure_modifier:0 "Counterfeit Ayraal Unresolved"

 ##################################################
 # 3000-3001, RELIGIOUS DISPUTE
 ##################################################

 gh_otachedian_contract_event.3000.t:0 "Scholars at Odds"

 gh_otachedian_contract_event.3000.desc:0 "Two scholars, both respected, both formidable, and both utterly convinced of their rightness, have been assigned to the same county on the same administrative project. Their theological disagreement, which began as a polite exchange of footnotes, has escalated through heated argument, formal denunciations, and now, apparently, a public screaming match witnessed by half the county seat.\n\nThe local community is taking sides. The scholars are no longer speaking to each other. The administrative project has been completely abandoned.\n\nYour realm is supposed to contain multitudes. Currently it mostly contains this."

 gh_otachedian_contract_event.3000.a:0 "Travel to mediate the dispute in person."
 gh_otachedian_contract_event.3000.a_tt:0 "You will travel to the location of the dispute."
 gh_otachedian_contract_event.3000.b:0 "Let the scholars tire themselves out."

 gh_otachedian_contract_event.3001.desc:0 "They are both in the same room and will not look at each other.\n\nBoth scholars are brilliant and are entirely committed to their beliefs. The community gathered outside is waiting to see what manner of administrator you are, one who enforces order, or one who endorses division.\n\nOtached's Law has, historically, managed to contain many faiths under one authority. That is what you are here to demonstrate."

 gh_otachedian_contract_event.3001.a:0 "Invoke your administrative authority: both scholars are reassigned and the disruption ends. [change_influence = minor_influence_loss]"
 gh_otachedian_contract_event.3001.b:0 "Host a formal, structured theological debate under your patronage, let the argument happen with dignity. [add_prestige = -minor_prestige_gain]"
 gh_otachedian_contract_event.3001.c:0 "Fund a joint scholarly project that will require both scholars to collaborate or lose their stipend. [remove_short_term_gold = 50]"
 gh_otachedian_contract_event.3001.d:0 "Speak with each scholar privately, then bring them together. Find the line where disagreement ends."

 gh_otachedian_contract_event.3001.d.success:0 "You find it, the one point on which both scholars agree more than they disagree with each other. You place all of your emphasis there. The debate does not end, but it becomes contained, collegial. Both scholars leave the meeting feeling respected rather than defeated. The county watches and draws the correct conclusion about Law."
 gh_otachedian_contract_event.3001.d.failure:0 "You find no such line. Or perhaps it exists and you simply cannot see it. Your attempt at mediation is perceived as favoritism by one party and weakness by the other. The dispute intensifies. People take harder positions in response to your intervention than they held before it."
 gh_otachedian_contract_event.3001.success_tt:0 "You found the common ground and used it to restore peace."
 gh_otachedian_contract_event.3001.failure_tt:0 "Your mediation worsened the divide rather than bridging it."

 # Modifier names
 gh_otachedian_religious_dispute_success_modifier:0 "Interfaith Accord Brokered"
 gh_otachedian_religious_dispute_failure_modifier:0 "Religious Tensions Inflamed"

 ##################################################
 # 4000-4001, ANCIENT VARODAIST RELIC
 ##################################################

 gh_otachedian_contract_event.4000.t:0 "The Relic of a Buried Kingdom"

 gh_otachedian_contract_event.4000.desc:0 "Workers breaking ground for a new irrigation channel uncovered it three feet down: a sealed reliquary of red-veined stone, wrapped in corroded copper bands, bearing the marks of the Varodaist Priest-Kings, rulers of this land before Otached's conquests ended their line.\n\nThe relic has drawn two factions immediately. Local nobility claims it on grounds of territorial inheritance. Vidvaookeyatran scholars want it for study and preservation. Both delegations have descended on the county seat and are currently conducting a very civilized argument that everyone knows will become something else if not resolved.\n\nThis is, depending on your perspective, either a profound administrative problem or a remarkable historical opportunity."

 gh_otachedian_contract_event.4000.a:0 "Travel to the county and settle the matter."
 gh_otachedian_contract_event.4000.a_tt:0 "You will travel to the site of the find."
 gh_otachedian_contract_event.4000.b:0 "Let them sort it out themselves."

 gh_otachedian_contract_event.4001.desc:0 "The relic sits on a table between the two delegations. It is, once cleaned, undeniably striking. The Priest-Kings knew how to make things that lasted. The stone is warm to the touch despite being underground for centuries. No one has been able to explain this to anyone's satisfaction.\n\nThe noble faction argues provenance and territorial right. The scholars argue preservation and the right of learning. Both arguments have merit. Neither side will accept half of what they want.\n\nAnd then there is the third option: you are the supreme administrative authority here. Whatever you decide is, technically, final."

 gh_otachedian_contract_event.4001.a:0 "Broker a formal compromise: the relic remains in the county under joint custodianship. [change_influence = minor_influence_loss]"
 gh_otachedian_contract_event.4001.b:0 "Decree it a county monument, public, protected, belonging to no single party. [add_prestige = -minor_prestige_gain]"
 gh_otachedian_contract_event.4001.c:0 "Fund a proper vault and preservation chamber. The scholars study it; the nobles are acknowledged as patrons. [remove_short_term_gold = 50]"
 gh_otachedian_contract_event.4001.d:0 "Take the relic for yourself. It belongs in your collection."

 # Modifier names
 gh_otachedian_ancient_relic_success_modifier:0 "Relic Preserved with Honor"
 gh_otachedian_ancient_relic_failure_modifier:0 "Relic Dispute Unresolved"
 gh_otachedian_ancient_relic_taken_modifier:0 "Relic Seized by Governor"

 ##################################################
 # 5000-5001, HARVEST SHORTFALL
 ##################################################

 gh_otachedian_contract_event.5000.t:0 "The Failing Harvest"

 gh_otachedian_contract_event.5000.desc_corn:0 "The maize harvest in this county is failing. Reports from the farmsteads are consistent: the stalks are present, the rows are planted, the labor has been done. But the yield is a fraction of what it should be, and no one has a clear explanation. Weather has been merely ordinary. Pests have been no worse than usual. The land itself seems unwilling.\n\nGrainmaster assessments put the shortfall at thirty percent below what is needed to meet obligations. Winter is not far. This must be addressed."

 gh_otachedian_contract_event.5000.desc_rice:0 "The rice paddy harvest in this county is failing. The paddies were flooded correctly. The planting season was managed as it always has been. And yet the yield is ruinously low, the stalks thin, the grain light, the numbers that come back from the assessors quietly devastating.\n\nGrainmaster assessments put the shortfall at thirty percent below what is needed to meet obligations. Winter is not far. This must be addressed."

 gh_otachedian_contract_event.5000.a:0 "Travel to the county and oversee the response personally."
 gh_otachedian_contract_event.5000.a_tt:0 "You will travel to the afflicted county."
 gh_otachedian_contract_event.5000.b:0 "Send instructions and leave the rest to the local officials."

 gh_otachedian_contract_event.5001.desc_corn:0 "You stand at the edge of a cornfield and look at what is and what should be. The stalks are real. The space between what they are and what they should be is also real. Farmers stand nearby with the expression of people who have already calculated exactly how bad this winter will be.\n\nTwo paths present themselves. The Magi attached to this county are young but willing, they have proposed an experimental fertilization method of unclear mechanism and unproven safety. The alternative is to press the farmers to work every remaining acre harder than they have ever worked it, and hope the difference can be made up by sheer labor."

 gh_otachedian_contract_event.5001.desc_rice:0 "You stand at the edge of flooded paddies and look at what is and what should be. The rice stalks are real. The space between what they are and what they should be is also real. Farmers stand nearby with the expression of people who have already calculated exactly how bad this winter will be.\n\nTwo paths present themselves. The Magi attached to this county are young but willing, they have proposed an experimental cultivation method of unclear mechanism and unproven safety. The alternative is to press the farmers to work every remaining acre harder than they have ever worked it, and hope the difference can be made up by sheer labor."

 gh_otachedian_contract_event.5001.a:0 "Use your administrative networks to redirect grain from neighboring counties to cover the gap. [change_influence = minor_influence_loss]"
 gh_otachedian_contract_event.5001.b:0 "Appear publicly among the farmers and publicly commit to their survival, morale may be worth as much as grain. [add_prestige = -minor_prestige_gain]"
 gh_otachedian_contract_event.5001.c:0 "Purchase emergency grain reserves from neighboring markets. [remove_short_term_gold = 50]"
 gh_otachedian_contract_event.5001.d:0 "Personally direct the Magi in their experimental intervention."

 gh_otachedian_contract_event.5001.d.success:0 "The Magi's method is, in the end, comprehensible, at least to you. You guide their application carefully, catch two potentially catastrophic errors before they become catastrophic, and the intervention works. The yield improves beyond what any natural recovery would have managed. The farmers call it a miracle. You call it controlled risk with adequate supervision."
 gh_otachedian_contract_event.5001.d.failure:0 "The Magi's method is not, in the end, something you can supervise adequately. A preparation is applied in the wrong proportion. What was intended as enhancement becomes interference. The afflicted rows perform worse than they would have with no intervention at all, and the Magi look at you with an expression that is technically deferential but contains a great deal of unspoken criticism."
 gh_otachedian_contract_event.5001.success_tt:0 "You successfully directed the Magi's experimental intervention."
 gh_otachedian_contract_event.5001.failure_tt:0 "The experimental Magi intervention made matters worse."

 ##################################################
 # 6000-6001, BORDER INCURSION
 ##################################################

 gh_otachedian_contract_event.6000.t:0 "Raiders on the Frontier"
 gh_otachedian_contract_event.6000.desc:0 "A report has arrived from the outer counties: raiders have been striking settlements along the frontier with increasing confidence. Farmsteads burned, livestock taken, roads made dangerous. The local garrison has sent word that they are outmatched by the scale and speed of the attacks.\n\nThis is an administrative problem as much as a military one. Someone with both authority and martial credibility must go to the affected region and restore order before the raiding parties grow bolder."
 gh_otachedian_contract_event.6000.a:0 "Travel to the frontier county and address this directly."
 gh_otachedian_contract_event.6000.b:0 "Send instructions and leave the rest to the local officials."
 gh_otachedian_contract_event.6000.a_tt:0 "You will travel to the afflicted county."

 gh_otachedian_contract_event.6001.desc:0 "You arrive at [scope:raid_destination.GetName] and find a county that has been living with the raids long enough to have developed a particular quality of exhaustion, the kind that comes not from surprise but from repetition.\n\nThe raid bands are quick and know the terrain. They have not been decisively driven out because no one with the authority to commit sufficient force has committed it. You have that authority. The question is how you intend to use it."
 gh_otachedian_contract_event.6001.a:0 "Coordinate the local garrisons through your administrative networks. [change_influence = minor_influence_loss]"
 gh_otachedian_contract_event.6001.b:0 "Make a public show of your commitment, rally the county's defenders through visible authority. [add_prestige = -minor_prestige_gain]"
 gh_otachedian_contract_event.6001.c:0 "Hire additional patrol forces and secure the most vulnerable settlements. [remove_short_term_gold = 50]"
 gh_otachedian_contract_event.6001.d:0 "Lead a strike force personally to drive them out."

 gh_otachedian_contract_event.6001.d.success:0 "You read the terrain, chose your moment, and committed fully. The raid band did not expect organized pursuit, and organized pursuit is what they received. What remained of them withdrew beyond the frontier. The local garrison watched with an expression that combined professional respect with evident relief."
 gh_otachedian_contract_event.6001.d.failure:0 "The raid band was more organized than the reports suggested, or perhaps the terrain worked against you more than anticipated. The engagement was costly enough that you had to break off pursuit, and the raiders, unhurried, withdrew on their own schedule. The county garrison will have to manage the remainder. They will manage it with the particular weariness of people who were hoping for better."
 gh_otachedian_contract_event.6001.success_tt:0 "You personally led the strike that drove out the raiders."
 gh_otachedian_contract_event.6001.failure_tt:0 "The raiders were not broken, they withdrew on their own terms."

 # Modifier names
 gh_otachedian_harvest_shortfall_success_modifier:0 "Harvest Crisis Resolved"
 gh_otachedian_harvest_shortfall_failure_modifier:0 "Lingering Harvest Shortfall"
 gh_otachedian_border_incursion_success_modifier:0 "Frontier Secured"
 gh_otachedian_border_incursion_failure_modifier:0 "Emboldened Raiders"
