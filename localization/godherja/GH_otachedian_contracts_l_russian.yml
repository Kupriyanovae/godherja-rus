l_russian:

 ##################################################
 # OTACHEDIAN GOVERNANCE CONTRACTS
 ##################################################

 # Shared tooltips
 gh_otachedian_contract_success_tt:0 "Вопрос решён. Графство с благодарностью запомнит ваше управление."
 gh_otachedian_contract_failure_tt:0 "Вопрос не решён. Графство расплачивается за ваше бездействие."

 # Shared option names (travel / decline)
 gh_otachedian_contract_event.travel:0 "Я немедленно отправлюсь в путь."
 gh_otachedian_contract_event.decline:0 "У меня есть дела поважнее."

 ##################################################
 # 1000-1001, VIDVAOO SCHOLAR DISPUTE
 ##################################################

 gh_otachedian_contract_event.1000.t:0 "Учёные и напуганные деревни"

 gh_otachedian_contract_event.1000.desc:0 "Прибыло прошение, скреплённое множеством встревоженных печатей. Учёные видваукеятранской веры, прославленные хранители тайных знаний державы, разбили лагерь возле скопления ферм и деревень. Их опыты дерзки, возможно, даже гениальны, но, по всем отзывам, пугают тех, кто не разделяет их воодушевления.\n\nОгонь, который не жжёт, звуки из пустоты, скот, шарахающийся от незримого. Селяне напуганы, а напуганные люди пишут жалобы.\n\nВаша служба [Concept('paiza','айраалов')|E] должна разобраться с этим, пока тревога не переросла в смуту."

 gh_otachedian_contract_event.1000.a:0 "Отправиться в графство и поговорить с учёными."
 gh_otachedian_contract_event.1000.a_tt:0 "Вы отправитесь к месту беспорядков."
 gh_otachedian_contract_event.1000.b:0 "У меня нет времени на суеверные деревни."

 gh_otachedian_contract_event.1001.desc:0 "Учёных найти нетрудно: их работа заявляет о себе сама. То, что издали казалось магическим хаосом, вблизи оборачивается почти методичным трудом. Они искренне стремятся к знанию. И столь же искренне отравляют жизнь всем на милю вокруг.\n\nНеподалёку стоит деревенский староста, скрестив руки и стиснув зубы. Главный учёный протягивает устройство, гудящее так, что зудят зубы, и долго объясняет, почему это чудесно.\n\nОбе стороны смотрят на вас."

 gh_otachedian_contract_event.1001.a:0 "Издать официальное распоряжение, обязывающее учёных ограничить опыты. [change_influence = minor_influence_loss]"
 gh_otachedian_contract_event.1001.b:0 "Публично похвалить учёных, но пообещать деревне, что положение улучшится. [add_prestige = -minor_prestige_gain]"
 gh_otachedian_contract_event.1001.c:0 "Оплатить постройку отдельного исследовательского здания вдали от поселений. [remove_short_term_gold = 50]"
 gh_otachedian_contract_event.1001.d:0 "Самому изучить исследования и честно поговорить с обеими сторонами."

 gh_otachedian_contract_event.1001.d.success:0 "Вы понимаете увиденное достаточно, чтобы говорить о нём со знанием дела. Вы объясняете селянам цель работы — не всё, но достаточно. А учёным ясно растолковываете, как страх селян сказывается на исследованиях. Обе стороны уходят со встречи, чувствуя, что их выслушали, и несколько пристыженными."
 gh_otachedian_contract_event.1001.d.failure:0 "Устройство, о котором рассказывает учёный, издаёт звук, к которому вы не были готовы, и ваша совершенно невольная реакция не внушает доверия. Селяне видят в этом подтверждение своих страхов. Учёным за вас неловко. Вы уходите, никому не помогши."
 gh_otachedian_contract_event.1001.success_tt:0 "Понимание исследований позволило вам успешно выступить посредником."
 gh_otachedian_contract_event.1001.failure_tt:0 "Вы оказались не в своей стихии, и обе стороны это заметили."

 # Modifier names
 gh_otachedian_scholar_dispute_success_modifier:0 "Учёный порядок восстановлен"
 gh_otachedian_scholar_dispute_failure_modifier:0 "Раздоры учёных и селян"

 ##################################################
 # 2000-2001, COUNTERFEIT AYRAAL
 ##################################################

 gh_otachedian_contract_event.2000.t:0 "Поддельный [Concept('paiza','айраал')|E]"

 gh_otachedian_contract_event.2000.desc:0 "Держатель айраала — из тех дотошных и педантичных людей, что ведут учёт в округе, — представил вашему двору неприятную находку. Несколько айраалов, несущих вашу власть, оказались подделками. Металл не тот. Гравировка похожа, но не точна. Они ходят по рыночным кварталам нескольких местностей.\n\nКто-то где-то решил, что подделка вашей власти стоит риска."

 gh_otachedian_contract_event.2000.a:0 "Отправиться в город и искоренить источник."
 gh_otachedian_contract_event.2000.a_tt:0 "Вы отправитесь к месту подделки."
 gh_otachedian_contract_event.2000.b:0 "Пусть разбираются местные чиновники."

 gh_otachedian_contract_event.2001.desc:0 "Рыночный квартал пахнет раскалённым металлом и нервным потом. Городские чиновники предъявляют список подозреваемых — дюжину имён, половина из них правдоподобна. Свидетели описывают гравёра из задней комнаты, купца, задававшего слишком много вопросов о весе айраалов, и писаря, без предупреждения уволившегося две недели назад.\n\nПоддельные айраалы — это не просто кража. Это подделка вашего имени, вашей власти. Виновный решил, что может подражать голосу порядка ради собственной выгоды. Ему нужно решительно доказать обратное."

 gh_otachedian_contract_event.2001.a:0 "Задействовать сеть осведомителей в городе, чтобы разоблачить шайку. [change_influence = minor_influence_loss]"
 gh_otachedian_contract_event.2001.b:0 "Публично и показательно наказать известных фальшивомонетчиков, чтобы вернуть доверие. [add_prestige = -minor_prestige_gain]"
 gh_otachedian_contract_event.2001.c:0 "Заменить поддельные айраалы подлинными из вашей казны. [remove_short_term_gold = 50]"
 gh_otachedian_contract_event.2001.d:0 "Лично допросить главных подозреваемых и самому проследить всю сеть."

 gh_otachedian_contract_event.2001.d.success:0 "Вы методично проходите по списку: что открывают вопросы, что подтверждает молчание. На второй день у вас есть имя, место и учётная книга, в которой названы ещё трое. Шайка фальшивомонетчиков разгромлена, и улик достаточно, чтобы обвинения устояли. Ваше имя на металле айраала снова что-то значит."
 gh_otachedian_contract_event.2001.d.failure:0 "Допрос идёт плохо. Подозреваемые держатся спокойнее, чем ожидалось, — или лучше подготовлены. Вы уходите с подозрениями, но без доказательств, а фальшивомонетчик, кем бы он ни был, успел скрыться. След остывает. Подделки продолжают ходить."
 gh_otachedian_contract_event.2001.success_tt:0 "Вы сами выследили и разгромили сеть фальшивомонетчиков."
 gh_otachedian_contract_event.2001.failure_tt:0 "След остыл; шайка фальшивомонетчиков остаётся на свободе."

 # Modifier names
 gh_otachedian_counterfeit_ayraal_success_modifier:0 "Восстановленное экономическое доверие"
 gh_otachedian_counterfeit_ayraal_failure_modifier:0 "Дело о поддельных айраалах не раскрыто"

 ##################################################
 # 3000-3001, RELIGIOUS DISPUTE
 ##################################################

 gh_otachedian_contract_event.3000.t:0 "Учёные в раздоре"

 gh_otachedian_contract_event.3000.desc:0 "Двое учёных — оба уважаемые, оба грозные и оба бесконечно убеждённые в своей правоте — назначены в одно графство на один и тот же административный проект. Их богословский спор, начавшийся как вежливый обмен сносками, перерос в жаркие препирательства, официальные обличения, а теперь, по-видимому, и в публичную перебранку на глазах у половины столицы графства.\n\nМестная община принимает чью-то сторону. Учёные больше не разговаривают друг с другом. Административный проект полностью заброшен.\n\nВаша держава должна вмещать многообразие. Пока что она вмещает в основном это."

 gh_otachedian_contract_event.3000.a:0 "Отправиться лично и уладить спор."
 gh_otachedian_contract_event.3000.a_tt:0 "Вы отправитесь к месту спора."
 gh_otachedian_contract_event.3000.b:0 "Пусть учёные сами выдохнутся."

 gh_otachedian_contract_event.3001.desc:0 "Они в одной комнате и не смотрят друг на друга.\n\nОба учёных блестящи и всецело преданы своим убеждениям. Община, собравшаяся снаружи, ждёт, какой вы управленец: тот, кто насаждает порядок, или тот, кто поощряет раскол.\n\nЗакону Отачеда исторически удавалось удерживать многие веры под одной властью. Именно это вам и предстоит доказать."

 gh_otachedian_contract_event.3001.a:0 "Воспользоваться административной властью: оба учёных переводятся, беспорядки прекращаются. [change_influence = minor_influence_loss]"
 gh_otachedian_contract_event.3001.b:0 "Устроить под вашим покровительством официальный, упорядоченный богословский диспут — пусть спор идёт достойно. [add_prestige = -minor_prestige_gain]"
 gh_otachedian_contract_event.3001.c:0 "Оплатить совместный научный проект, в котором учёным придётся сотрудничать или лишиться жалованья. [remove_short_term_gold = 50]"
 gh_otachedian_contract_event.3001.d:0 "Поговорить с каждым учёным наедине, а затем свести их вместе. Найти черту, где кончаются разногласия."

 gh_otachedian_contract_event.3001.d.success:0 "Вы находите её — ту единственную точку, в которой учёные согласны друг с другом больше, чем расходятся. Вы делаете на ней весь упор. Спор не прекращается, но становится сдержанным, товарищеским. Оба учёных уходят со встречи, чувствуя уважение, а не поражение. Графство наблюдает и делает верный вывод о Законе."
 gh_otachedian_contract_event.3001.d.failure:0 "Такой черты вы не находите. А может, она есть, но вы её не видите. Одна сторона воспринимает ваше посредничество как пристрастность, другая — как слабость. Спор разгорается сильнее. В ответ на ваше вмешательство люди занимают ещё более жёсткие позиции, чем прежде."
 gh_otachedian_contract_event.3001.success_tt:0 "Вы нашли общую почву и с её помощью восстановили мир."
 gh_otachedian_contract_event.3001.failure_tt:0 "Ваше посредничество углубило раскол, вместо того чтобы преодолеть его."

 # Modifier names
 gh_otachedian_religious_dispute_success_modifier:0 "Достигнуто межконфессиональное согласие"
 gh_otachedian_religious_dispute_failure_modifier:0 "Разожжены религиозные распри"

 ##################################################
 # 4000-4001, ANCIENT VARODAIST RELIC
 ##################################################

 gh_otachedian_contract_event.4000.t:0 "Реликвия погребённого царства"

 gh_otachedian_contract_event.4000.desc:0 "Рабочие, копавшие новый оросительный канал, наткнулись на неё в трёх футах под землёй: запечатанный реликварий из камня с красными прожилками, обвитый проржавевшими медными обручами и несущий знаки Вародаистских царей-жрецов, правивших этой землёй до того, как завоевания Отачеда прервали их род.\n\nРеликвия сразу привлекла две стороны. Местная знать требует её по праву наследования земель. Видваукеятранские учёные хотят изучать и сохранить её. Обе делегации нагрянули в столицу графства и ведут весьма учтивый спор, который, как все понимают, превратится в нечто иное, если его не разрешить.\n\nВ зависимости от точки зрения это либо серьёзная административная задача, либо удивительная историческая возможность."

 gh_otachedian_contract_event.4000.a:0 "Отправиться в графство и решить дело."
 gh_otachedian_contract_event.4000.a_tt:0 "Вы отправитесь к месту находки."
 gh_otachedian_contract_event.4000.b:0 "Пусть разбираются сами."

 gh_otachedian_contract_event.4001.desc:0 "Реликвия лежит на столе между двумя делегациями. Очищенная, она, бесспорно, поражает. Цари-жрецы умели создавать долговечные вещи. Камень тёплый на ощупь, хотя веками пролежал под землёй. Никто так и не смог объяснить это ко всеобщему удовлетворению.\n\nЗнать ссылается на происхождение реликвии и права на землю. Учёные — на сохранение и право на знание. У обоих доводов есть основания. Ни одна сторона не согласится на половину желаемого.\n\nЕсть и третий путь: здесь вы — высшая административная власть. Что бы вы ни решили, формально это окончательно."

 gh_otachedian_contract_event.4001.a:0 "Устроить официальный компромисс: реликвия остаётся в графстве под совместной опекой. [change_influence = minor_influence_loss]"
 gh_otachedian_contract_event.4001.b:0 "Объявить её памятником графства — общедоступным, охраняемым и не принадлежащим ни одной из сторон. [add_prestige = -minor_prestige_gain]"
 gh_otachedian_contract_event.4001.c:0 "Оплатить надёжное хранилище и комнату для сбережения реликвии. Учёные изучают её, знать признаётся покровителями. [remove_short_term_gold = 50]"
 gh_otachedian_contract_event.4001.d:0 "Забрать реликвию себе. Ей место в вашей коллекции."

 # Modifier names
 gh_otachedian_ancient_relic_success_modifier:0 "Реликвия сохранена с почестями"
 gh_otachedian_ancient_relic_failure_modifier:0 "Спор о реликвии не разрешён"
 gh_otachedian_ancient_relic_taken_modifier:0 "Реликвия изъята наместником"

 ##################################################
 # 5000-5001, HARVEST SHORTFALL
 ##################################################

 gh_otachedian_contract_event.5000.t:0 "Неурожай"

 gh_otachedian_contract_event.5000.desc_corn:0 "Урожай маиса в этом графстве гибнет. Донесения с хуторов единодушны: стебли есть, ряды засеяны, работа сделана. Но урожай — лишь малая доля положенного, и никто не может толком объяснить почему. Погода была самой обычной. Вредителей не больше, чем всегда. Сама земля будто не желает родить.\n\nПо оценкам хлебных смотрителей, недостача составляет тридцать процентов от необходимого для выполнения обязательств. Зима не за горами. С этим нужно что-то делать."

 gh_otachedian_contract_event.5000.desc_rice:0 "Урожай риса в этом графстве гибнет. Поля затопили как положено. Посевную провели, как проводили всегда. И всё же урожай губительно мал: стебли тонкие, зерно лёгкое, а цифры, которые приносят оценщики, тихо опустошают.\n\nПо оценкам хлебных смотрителей, недостача составляет тридцать процентов от необходимого для выполнения обязательств. Зима не за горами. С этим нужно что-то делать."

 gh_otachedian_contract_event.5000.a:0 "Отправиться в графство и лично руководить делом."
 gh_otachedian_contract_event.5000.a_tt:0 "Вы отправитесь в пострадавшее графство."
 gh_otachedian_contract_event.5000.b:0 "Отправить указания, а остальное оставить местным чиновникам."

 gh_otachedian_contract_event.5001.desc_corn:0 "Вы стоите на краю кукурузного поля и смотрите на то, что есть, и на то, что должно быть. Стебли настоящие. Пропасть между тем, каковы они, и тем, какими должны быть, — тоже. Рядом стоят крестьяне с лицами людей, которые уже точно подсчитали, насколько тяжёлой будет эта зима.\n\nПеред вами два пути. Приписанные к графству маги молоды, но полны рвения; они предложили опытный способ удобрения с неясным принципом действия и недоказанной безопасностью. Другой путь — заставить крестьян обрабатывать каждый оставшийся акр усерднее, чем когда-либо, в надежде восполнить недостачу одним лишь трудом."

 gh_otachedian_contract_event.5001.desc_rice:0 "Вы стоите на краю затопленных рисовых полей и смотрите на то, что есть, и на то, что должно быть. Стебли риса настоящие. Пропасть между тем, каковы они, и тем, какими должны быть, — тоже. Рядом стоят крестьяне с лицами людей, которые уже точно подсчитали, насколько тяжёлой будет эта зима.\n\nПеред вами два пути. Приписанные к графству маги молоды, но полны рвения; они предложили опытный способ выращивания с неясным принципом действия и недоказанной безопасностью. Другой путь — заставить крестьян обрабатывать каждый оставшийся акр усерднее, чем когда-либо, в надежде восполнить недостачу одним лишь трудом."

 gh_otachedian_contract_event.5001.a:0 "Задействовать административные связи и перенаправить зерно из соседних графств, чтобы покрыть недостачу. [change_influence = minor_influence_loss]"
 gh_otachedian_contract_event.5001.b:0 "Публично появиться среди крестьян и пообещать им выживание — боевой дух может стоить не меньше зерна. [add_prestige = -minor_prestige_gain]"
 gh_otachedian_contract_event.5001.c:0 "Закупить на соседних рынках чрезвычайные запасы зерна. [remove_short_term_gold = 50]"
 gh_otachedian_contract_event.5001.d:0 "Лично руководить опытным вмешательством магов."

 gh_otachedian_contract_event.5001.d.success:0 "Способ магов в итоге оказывается понятным — по крайней мере, вам. Вы бережно направляете их работу, вовремя замечаете две ошибки, грозившие катастрофой, и вмешательство удаётся. Урожай вырастает сверх того, что дало бы любое естественное восстановление. Крестьяне называют это чудом. Вы — оправданным риском при должном надзоре."
 gh_otachedian_contract_event.5001.d.failure:0 "Способ магов в итоге оказывается не тем, за чем вы способны должным образом надзирать. Состав применён в неверной пропорции. То, что задумывалось как улучшение, превращается во вред. Поражённые ряды родят хуже, чем родили бы вовсе без вмешательства, а маги смотрят на вас с выражением формально почтительным, но полным невысказанного упрёка."
 gh_otachedian_contract_event.5001.success_tt:0 "Вы успешно руководили опытным вмешательством магов."
 gh_otachedian_contract_event.5001.failure_tt:0 "Опытное вмешательство магов лишь ухудшило положение."

 ##################################################
 # 6000-6001, BORDER INCURSION
 ##################################################

 gh_otachedian_contract_event.6000.t:0 "Налётчики на границе"
 gh_otachedian_contract_event.6000.desc:0 "Из окраинных графств пришло донесение: налётчики со всё большей наглостью нападают на поселения вдоль границы. Сожжены хутора, угнан скот, дороги стали опасны. Местный гарнизон сообщает, что не справляется с размахом и быстротой набегов.\n\nЭто задача не только военная, но и административная. Кто-то, обладающий и властью, и воинским авторитетом, должен отправиться в пострадавший край и навести порядок, пока налётчики не осмелели ещё больше."
 gh_otachedian_contract_event.6000.a:0 "Отправиться в пограничное графство и разобраться самому."
 gh_otachedian_contract_event.6000.b:0 "Отправить указания, а остальное оставить местным чиновникам."
 gh_otachedian_contract_event.6000.a_tt:0 "Вы отправитесь в пострадавшее графство."

 gh_otachedian_contract_event.6001.desc:0 "Вы прибываете в [scope:raid_destination.GetName] и застаёте графство, которое живёт с набегами так долго, что приобрело особую усталость — ту, что рождается не от неожиданности, а от повторения.\n\nОтряды налётчиков быстры и знают местность. Их до сих пор не изгнали окончательно, потому что никто из имеющих власть бросить на это достаточные силы так и не сделал этого. У вас такая власть есть. Вопрос в том, как вы намерены ею распорядиться."
 gh_otachedian_contract_event.6001.a:0 "Согласовать действия местных гарнизонов через свои административные связи. [change_influence = minor_influence_loss]"
 gh_otachedian_contract_event.6001.b:0 "Показательно заявить о своей решимости и сплотить защитников графства силой явной власти. [add_prestige = -minor_prestige_gain]"
 gh_otachedian_contract_event.6001.c:0 "Нанять дополнительные дозоры и защитить самые уязвимые поселения. [remove_short_term_gold = 50]"
 gh_otachedian_contract_event.6001.d:0 "Лично возглавить ударный отряд и изгнать их."

 gh_otachedian_contract_event.6001.d.success:0 "Вы изучили местность, выбрали момент и ударили со всей силой. Налётчики не ожидали слаженного преследования — и получили именно его. Уцелевшие отступили за границу. Местный гарнизон наблюдал за этим с выражением, в котором профессиональное уважение смешалось с явным облегчением."
 gh_otachedian_contract_event.6001.d.failure:0 "Налётчики оказались организованнее, чем следовало из донесений, — или местность сыграла против вас сильнее, чем ожидалось. Стычка обошлась так дорого, что пришлось прекратить преследование, и налётчики неспешно отступили, когда сочли нужным. С остальным придётся справляться гарнизону графства. Справляться он будет с той особой усталостью, что бывает у людей, надеявшихся на лучшее."
 gh_otachedian_contract_event.6001.success_tt:0 "Вы лично возглавили удар, изгнавший налётчиков."
 gh_otachedian_contract_event.6001.failure_tt:0 "Налётчики не разбиты — они отступили на своих условиях."

