 charioteer_attribute_modifier: "$charioteer_attribute$ — [Concept('acclaimed_knight', 'именитый рыцарь')|E]"
 charioteer_attribute: "Колесничий"
 accolade_chariot_riding: "Езда на колесницах"
 accolade_charioteer: "Колесничий"
 charioteer_attribute.unlock_tt: "Выполняется любое из нижеследующих условий:\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('open_terrain_expert').GetName(GetNullCharacter)|V]»\n$EFFECT_LIST_BULLET$[trait_level_track_xp|E] «[GetTrait('tourney_participant').GetName(GetNullCharacter)|V]» [Concept('acclaimed_knight', 'именитого рыцаря')|E] в категории «#V $trait_track_horse$#!» — #V 30#! и выше\n$EFFECT_LIST_BULLET$Можно получить доступ к атрибуту, когда [Concept('acclaimed_knight', 'именитый рыцарь')|E] сражается в [Concept('battle', 'битве')|E] вместе с любой [Concept('men_at_arms', 'профессиональной')|E] колесничной кавалерией"
 charioteer_attribute.battle_message_tt: "[acclaimed_knight.GetName] [Select_CString(acclaimed_knight.IsFemale, 'проявила', 'проявил' )] себя, командуя колесничной кавалерией в бою. [acclaimed_knight.GetSheHe|U] может быть [Concept('acclaimed', Select_CString(acclaimed_knight.IsFemale, 'удостоена', 'удостоен' ) )|E] акколады «[GetAccoladeType('charioteer_attribute').GetName]»"

 mammothry_attribute_modifier: "$mammothry_attribute$ — [Concept('acclaimed_knight', 'именитый рыцарь')|E]"
 mammothry_attribute: "Наездник на мамонте"
 accolade_mammoth_riding: "Езда на мамонтах"
 accolade_mammotheer: "Наездник на мамонте"
 mammothry_attribute.unlock_tt: "Выполняется любое из нижеследующих условий:\n$EFFECT_LIST_BULLET$[acclaimed_knight|E] обладает свойством «[GetTrait('winter_soldier').GetName(GetNullCharacter)|V]»\n$EFFECT_LIST_BULLET$[trait_level_track_xp|E] «[GetTrait('tourney_participant').GetName(GetNullCharacter)|V]» [Concept('acclaimed_knight', 'именитого рыцаря')|E] в категории «#V $trait_track_horse$#!» — #V 30#! и выше\n$EFFECT_LIST_BULLET$Можно получить доступ к атрибуту, когда [Concept('acclaimed_knight', 'именитый рыцарь')|E] сражается в [Concept('battle', 'битве')|E] вместе с любой [Concept('men_at_arms', 'профессиональной')|E] [Concept('elephant_cavalry', 'элефантерией')|E]"
 mammothry_attribute.battle_message_tt: "[acclaimed_knight.GetName] [Select_CString(acclaimed_knight.IsFemale, 'проявила', 'проявил' )] себя, командуя мамонтовой кавалерией в бою. [acclaimed_knight.GetSheHe|U] может быть [Concept('acclaimed', Select_CString(acclaimed_knight.IsFemale, 'удостоена', 'удостоен' ) )|E] акколады «[GetAccoladeType('mammothry_attribute').GetName]»"

 magi_attribute_modifier: "$magi_attribute$ — [Concept('acclaimed_knight', 'именитый рыцарь')|E]"
 magi_attribute: "Маг"
 accolade_magical: "Магический"
 magi_attribute.unlock_tt: "Выполняется любое из нижеследующих условий:\n$EFFECT_LIST_BULLET$[Concept('arcana', 'Аркана')|E] [Concept('acclaimed_knight', 'именитого рыцаря')|E] — [EmptyScope.ScriptValue('skill_accolade_acceptable_value')|V0] и выше\n$EFFECT_LIST_BULLET$[Concept('acclaimed_knight', 'Именитый рыцарь')|E] знает любую [Concept('magic_type', 'школу магии')|E]\n$EFFECT_LIST_BULLET$Можно получить доступ к атрибуту, когда [Concept('acclaimed_knight', 'именитый рыцарь')|E] сражается в [Concept('battle', 'битве')|E] вместе с любыми [Concept('men_at_arms', 'профессиональными')|E] [Concept('magi', 'магами')|E]"
 magi_attribute.unlock_tt_2: "Выполняется любое из нижеследующих условий:\n$EFFECT_LIST_BULLET$[Concept('culture', 'Культура')|E] [Concept('acclaimed_knight', 'именитого рыцаря')|E] открыла [Concept('innovation', 'инновацию')|E] #V $innovation_early_medieval_magic$#!\n$EFFECT_LIST_BULLET$[Concept('culture', 'Культура')|E] [Concept('acclaimed_knight', 'именитого рыцаря')|E] открыла [Concept('innovation', 'инновацию')|E] #V $innovation_imperial_magic$#!"
 magi_attribute.unlock_magic_illegal_tt: "$EFFECT_LIST_BULLET$Ваша [Concept('faiths', 'конфессия')|E] и конфессия [Concept('acclaimed_knight', 'именитого рыцаря')|E] не имеют [Concept('doctrine', 'доктрины')|E] $doctrine_magic_crime$"
 magi_attribute.battle_message_tt: "[acclaimed_knight.GetName] [Select_CString(acclaimed_knight.IsFemale, 'проявила', 'проявил' )] себя, командуя магами в бою. [acclaimed_knight.GetSheHe|U] может быть [Concept('acclaimed', Select_CString(acclaimed_knight.IsFemale, 'удостоена', 'удостоен' ) )|E] акколады «[GetAccoladeType('magi_attribute').GetName]»"

