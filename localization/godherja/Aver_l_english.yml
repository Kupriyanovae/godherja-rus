l_english:
 innovation_conrois: "Chevalien Conrois"
 innovation_conrois_desc: "Chevalie has long produced restless throngs of younger sons. However the Voyagen in particular have leaned into this adventurous identity with their tradition of the iconic 'Conrois'. Bold and unscrupulous, these horsemen of the Voyagen chase dreams of faraway adventure, of mercenary cruelties, and of glorious conquest with  admirable, or selfish, ambition.$innovation_conrois_quote$"
 innovation_conrois_quote: "\n\n#inno_quote \"Everywhere these Voyagen Nobles brought their daring shock-cavalry, from the homeland of Chevalie,  to the far south-eastern reaches of the Old Imperial Realms, to the far south-western coasts beyond Sarradon, they brought thundering shock-tactics and crushing crouched-lances.\"#!$innovation_conrois_quote_attribution$"
 innovation_conrois_quote_attribution: "\n #inno_quote ~ History of The Voyagen - On the Chevalien Conrois#!"

 innovation_sergeants: "Salisian Sergeants"
 innovation_sergeants_desc: "The Salisians have long been a core aspect of Chevalie, for their forges and armories are the beating heart-blood for all Chevalien arms and armor. From this mass production of metal armor and weapons the Salisians are able to field large hosts of non-noble heavy infantry.$innovation_sergeants_quote$"
 innovation_sergeants_quote: "\n\n#inno_quote \"\"#!$innovation_sergeants_quote_attribution$"
 innovation_sergeants_quote_attribution: "\n #inno_quote ~ #!"
 
 innovation_dielecender_sergeants: "Dielec Sergeants"
 innovation_dielecender_sergeants_desc: "Though less armed and armored than the Salisians, the men of Dielec field armored infantry just as capable in combat, using their forests and marshes to their advantage, these Sergeants are more cunning in war, if less equipped..$innovation_dielecender_sergeants_quote$"
 innovation_dielecender_sergeants_quote: "\n\n#inno_quote \"\"#!$innovation_dielecender_sergeants_quote_attribution$"
 innovation_dielecender_sergeants_quote_attribution: "\n #inno_quote ~ #!"

 innovation_etrandanexi: "Étrandanexi Légionnaires"
 innovation_etrandanexi_desc: "The Étrandanexi have long been a dishonorable people, a legacy of swindling nobles out of lands, raiding or extorting merchants and migrants, and brutal slavery of commoners. From this history and their mixing with [Concept('aversaria', 'Aversarians')|E] come the Étrandanexi Légionnaires. Often well armed and armored, yet less willing to take on risks, prefering cunning and uneven fights.e$innovation_etrandanexi_quote$"
 innovation_etrandanexi_quote: "\n\n#inno_quote \"We'll have our pay, or we'll have our fun!\"#!$innovation_etrandanexi_quote_attribution$"
 innovation_etrandanexi_quote_attribution: "\n #inno_quote ~ #!"

 innovation_kastrophylakes: "Kastrophýlakes System"
 innovation_kastrophylakes_desc: "The Imperial Magi's own army, 'Fortress Wardens', once proud soldiers of the Empire. Reduced to a more humble state since the collapse of the [Concept('aversaria', 'Aversarian')|E] Empire, with various wayward Aversarian soldiers filling the ranks. Despite their slackened standards, they remain a competent force, ever loyal to the [magi|E] they serve.$innovation_kastrophylakes_quote$"
 innovation_kastrophylakes_quote: "\n\n#inno_quote \"Fuck your Legions, watch how they break upon our gate.\"#!$innovation_kastrophylakes_quote_attribution$"
 innovation_kastrophylakes_quote_attribution: "\n #inno_quote ~ Kastrophýlakes Commander, Siege of the Annex#!"

 innovation_komitatenses: "Komitaténses System"
 innovation_komitatenses_desc: "The Imperial army is gone, once proud [Concept('aversaria', 'Aversarian')|E] soldiers now look desperately for direction and hope. Quickly a system developed to make use of these various warriors. The 'Companions' Field Armies were the commonly adopted formation. Integrating all levels of experience into a cohesive unit capable of somewhat holding a battleline.$innovation_komitatenses_quote$"
 innovation_komitatenses_quote: "\n\n#inno_quote \"Come men of the Empire! The hour be dark, yet Aversaria still drawns breath, as long as we still bleed pure blood! Join the 'Companions', Fight for our Home!\"#!$innovation_komitatenses_quote_attribution$"
 innovation_komitatenses_quote_attribution: "\n #inno_quote ~ Komitaténses Recruitment Officer#!"

 innovation_northern_legion: "Legacy of Ten Trees"
 innovation_northern_legion_desc: "The [Concept('aversaria', 'Aversarian')|E] remnant army was never going to have victory at Elysia. For their true hour to throw back the Northmen was at Ten Trees. That battle would only truly be remebered by the colonists of Kalathipsomi. For it was among their lands that the various veterans would settle and serve.$innovation_northern_legion_quote$"
 innovation_northern_legion_quote: "\n\n#inno_quote \"No glory was won, few songs were song, for those who lived to tell, only could tell of bitter cold, and death. So much death...\"#!$innovation_northern_legion_quote_attribution$"
 innovation_northern_legion_quote_attribution: "\n #inno_quote ~ Veteran of Ten Trees#!"

 innovation_relic_phalanx: "Relic Phalanx"
 innovation_relic_phalanx_desc: "The prideful men of the isles have long refused change, including change in military tactics and formations. The Symvolix still deploy in their ancient and ancestral way, with thick walls of pike men, devastating if used correctly, yet fragile compared to modern formations.$innovation_relic_phalanx_quote$"
 innovation_relic_phalanx_quote: "\n\n#inno_quote \"Come and Get Them!\"#!$innovation_relic_phalanx_quote_attribution$"
 innovation_relic_phalanx_quote_attribution: "\n #inno_quote ~ Phalanx Commander Leonidrix, Battle of Badoros#!"

 innovation_karzarad_vitkaz: "Kakarat Vitkazi"
 innovation_karzarad_vitkaz_desc: "The knights of the mysterious Karzarad. These riders were the incarnation of their people's devout zealoutry and their martial prowess, flying their iconic Saint and Hero banners they ride ever on for the glorious Sun.$innovation_karzarad_vitkaz_quote$"
 innovation_karzarad_vitkaz_quote: "\n\n#inno_quote \"Long may the Sun Shine!\"#!$innovation_karzarad_vitkaz_quote_attribution$"
 innovation_karzarad_vitkaz_quote_attribution: "\n #inno_quote ~ Common motto shared by the Vitkazi #!"

 innovation_ironblood: "Men of the Iron-Blood"
 innovation_ironblood_desc: "The Aupagn peoples are no strangers to warfare, forming into warbands they fight in simple, yet practical, sheild-walls. With attachments of brave axemen to break enemy lines.$innovation_ironblood_quote$"
 innovation_ironblood_quote: "\n\n#inno_quote \"Iron and Blood!\"#!innovation_ironblood_quote_attribution$"
 innovation_ironblood_quote_attribution: "\n #inno_quote ~ Warcry of the Iron-Blood Warriors #!"

 innovation_lonely_warband: "Men of the Isles"
 innovation_lonely_warband_desc: "The men of the far northern isles are hard folk, often at war with the undead they have developed a strong martial tradition, with their ideas of kinship playing a large part in the warriors culture.$innovation_lonely_warband_quote$"
 innovation_lonely_warband_quote: "\n\n#inno_quote \"We shall prove ourselves once more able to defend our island home!\"#!$innovation_lonely_warband_quote_attribution$"
 innovation_lonely_warband_quote_attribution: "\n #inno_quote ~ #!"

 innovation_partic_warband: "Men of the World-Tree"
 innovation_partic_warband_desc: "The men of the Partic tribes are a fiathful folk, having long held dear their independence they have developed a strong martial tradition, with brotherhood and sacred oaths playing large part in their warrior culture.$innovation_partic_warband_quote$"
 innovation_partic_warband_quote: "\n\n#inno_quote \"\"#!$innovation_partic_warband_quote_attribution$"
 innovation_partic_warband_quote_attribution: "\n #inno_quote ~ #!"

 innovation_drakelander: "Men of the Dragon"
 innovation_drakelander_desc: "The Imperial survivors of Etepezea, took to their ancient legacy and adopted a culture that was centered around the Dragon. This included their martial development. Their warriors taking the look of dragons themselves as they reclaim their stolen heritage.$innovation_drakelander_quote$"
 innovation_drakelander_quote: "\n\n#inno_quote \"A dragon is not a slave!\"#!$innovation_drakelander_quote_attribution$"
 innovation_drakelander_quote_attribution: "\n #inno_quote ~ #!"

 innovation_pureblood: "Men of the Purest"
 innovation_pureblood_desc: "The Imperial survivors of Malcois, who rejected the new age. This included their martial development. Their warriors taking inspiration from the Legions of Aversaria. They will restore the righteous rule of the Purest!$innovation_pureblood_quote$"
 innovation_pureblood_quote: "\n\n#inno_quote \"We stand here now, as the last of our people. We stand now as the true heirs of the Purest!\"#!$innovation_pureblood_quote_attribution$"
 innovation_pureblood_quote_attribution: "\n #inno_quote ~ The Pure-Blood Proclamation#!"
 
 innovation_black_rangers: "Watchers of the Fog"
 innovation_black_rangers_desc: "The survivors of the Fog, who rejected to abandon their watch, instead leading efforts to explore and reclaim lost relics within the vast lands lost long ago. Their warriors keeping close eyes on the vast Fog that threatens to consume this world with its madness. Few can face such horror and remain sane, fewer still can make it their living to do so time and again.$innovation_black_rangers_quote$"
 innovation_black_rangers_quote: "\n\n#inno_quote \"\"#!$innovation_black_rangers_quote_attribution$"
 innovation_black_rangers_quote_attribution: "\n #inno_quote ~ #!"
 
 innovation_ironblood_legion: "Men of the Iron Legions"
 innovation_ironblood_legion_desc: "The Imperial survivors of Eastern Ouletaelats, who rejected the new age. This included their martial development. Their warriors taking inspiration from the Legions of Aversaria. They will restore the righteous rule of Notianixia!$innovation_ironblood_legion_quote$"
 innovation_ironblood_legion_quote: "\n\n#inno_quote \"!\"#!$innovation_ironblood_legion_quote_attribution$"
 innovation_ironblood_legion_quote_attribution: "\n #inno_quote ~ #!"

 innovation_exkoubitoi: "The Sentinels of Aversaria"
 innovation_exkoubitoi_desc: "The Imperial Sentinels are a ghost of a more glorious time, dedicated solely to the protection and guardianship over the Imperial Isle, they were once regarded as the most prestigious formation within the greater Aversarian military. Refusing to bow to the migrants they will fight till the bitter end!$innovation_exkoubitoi_quote$"
 innovation_exkoubitoi_quote: "\n\n#inno_quote \"Let them try to take our sacred Isle! Let them know the Sentinels of the Purest still stand true!\"#!$innovation_exkoubitoi_quote_attribution$"
 innovation_exkoubitoi_quote_attribution: "\n #inno_quote ~ #!"

 innovation_abdexorn: "Legionaires of the West"
 innovation_abdexorn_desc: "The Abdêxorn are a people living in the shadow of Aversaria, despite the rivalry they still retain heavy Aversarian influence, even to this day naming their soldiers legionaires. Dedicated solely to warfare and glory, they now stand poised to make a mark on the Shattered-Coast!$innovation_abdexorn_quote$"
 innovation_abdexorn_quote: "\n\n#inno_quote \"\"#!$innovation_abdexorn_quote_attribution$"
 innovation_abdexorn_quote_attribution: "\n #inno_quote ~ #!"

 innovation_watchmen: "Trustian Watchmen"
 innovation_watchmen_desc: "The endless wastes of the Deadlands have proven to be a great threat to the Trustians time after time, having often been the first line againt lich incusions, these conditions bore the Watchmen, dedicated soldiers ready to spring into battle against any sudden invaders.$innovation_watchmen_quote$"
 innovation_watchmen_quote: "\n\n#inno_quote \"100 generations have defended this castle. It's never fallen before. She will not fall tonight. The dead are at our walls. They enslave the men they kill! Do you wanna fill the army of a lich tonight? Tonight we fight, and when the sun rises I promise you... Castle Hambrie will stand! The Watchmen will stand!\"#!$innovation_watchmen_quote_attribution$"
 innovation_watchmen_quote_attribution: "\n #inno_quote ~ Watchcaptain Alliser Thorn - Before the Assault of Hambrie #!"
 
 innovation_rivarisian_longbows: "Men of the Rivers"
 innovation_rivarisian_longbows_desc: "The Rivarisians are a people under constant pressure, heavily armored cavalry and infantry armies from the Chevaliens, well-trained mercenary and pikemen armies from the Konijkmeners. From these conditions, came the 'Rivarmen' a class of warriors dedicated to countering their neighbors tactics, some fighting with specially made 'Rivarbows' able to punch through hardened plate, while the rest rely on their guerilla anti-pike tactics, these brave warriors keep the Rivarisians from being driven from our homes.$innovation_rivarisian_longbows_quote$"
 innovation_rivarisian_longbows_quote: "\n\n#inno_quote \"Family, Duty, Honor!\"#!$innovation_rivarisian_longbows_quote_attribution$"
 innovation_rivarisian_longbows_quote_attribution: "\n #inno_quote ~ Common Rivarisian motto #!"

 innovation_gallien: "Gallien Knighthood"
 innovation_gallien_desc: "The last of the Gallicaders, the Gallien are a stoic and mountainous people. Long having had to resist Chevalien influence, their Knightly tradtion is often seen as the most pure, for they fight for no glory, riches, or advancement. They truly serve their people, not just as simple guards but as true guardians.$innovation_gallien_quote$"
 innovation_gallien_quote: "\n\n#inno_quote \"'What am I to them?' 'A knight who remembered his vows,' \"#!$innovation_gallien_quote_attribution$"
 innovation_gallien_quote_attribution: "\n #inno_quote ~ Gallien book- A Knight of the Seven Kindoms #!"

 innovation_brotherhood: "Carsavisian Battle-Brothers"
 innovation_brotherhood_desc: "The endless wastes of the Deadlands have proven to be a great threat to the Carsavisians in particular, having often been the first line againt lich incusions, these conditions bore the Brotherhoods. Primarily formed between young nobles, or more rarely non-noble soldiers. Bound in pairs of two, and often keeping their Battle-Bond far after they retire from warfare, they will fight hard to protect or avenge their beloved Battle-Brother, even if facing impossible odds.$innovation_brotherhood_quote$"
 innovation_brotherhood_quote: "\n\n#inno_quote \"...My Brother! Come Join Me! In Battle We Are Stronger!...\"#!$innovation_brotherhood_quote_attribution$"
 innovation_brotherhood_quote_attribution: "\n #inno_quote ~ Excerpt of an iconic Battle-Brother Ballad #!"

 innovation_muhkaikarib: "Warspears of Sarradon"
 innovation_muhkaikarib_desc: "The endless conflict in Sarradon has born a strong military tradition for the Muhkaikarib, the common infantry formation found among the Marmaladid cultures.$innovation_muhkaikarib_quote$"
 innovation_muhkaikarib_quote: "\n\n#inno_quote \"\"#!$innovation_muhkaikarib_quote_attribution$"
 innovation_muhkaikarib_quote_attribution: "\n #inno_quote ~ #!"

 innovation_dezhun_battlemasters: "Battlemasters of Sarradon"
 innovation_dezhun_battlemasters_desc: "The endless conflict in Sarradon has born a strong military tradition for the Battlemasters, the elite magi-infantry formation found among the Dezhunic cultures.$innovation_dezhun_battlemasters_quote$"
 innovation_dezhun_battlemasters_quote: "\n\n#inno_quote \"\"#!$innovation_dezhun_battlemasters_quote_attribution$"
 innovation_dezhun_battlemasters_quote_attribution: "\n #inno_quote ~ #!"

 innovation_sernvryki: "Men of the North"
 innovation_sernvryki_desc: "Unlike their brethren who softened in the rich south, the Sernvryki kept the old ways. Their people are tough and headstrong, they produce fearsome wintery warriors!$innovation_sernvryki_quote$"
 innovation_sernvryki_quote: "\n\n#inno_quote \"Let them grow fat and lazy, when darkness falls, it is strength alone that provides for a people!\"#!$innovation_sernvryki_quote_attribution$"
 innovation_sernvryki_quote_attribution: "\n #inno_quote ~ #!"

 innovation_leskovych: "Men of Iron"
 innovation_leskovych_desc: "The Leskovych are master craftsmen. With vast supplies of armor and weaponry. Combined with their honorbound and warlike culture, they will shatter any hopes of easily taking their lands!$innovation_leskovych_quote$"
 innovation_leskovych_quote: "\n\n#inno_quote \"Iron Within\"#!$innovation_leskovych_quote_attribution$"
 innovation_leskovych_quote_attribution: "\n #inno_quote ~ Common motto of the Oathbound#!"
 
 innovation_saradoani: "Men of Saradoani"
 innovation_saradoani_desc: "The Aversarian Colonists of Sarradon have long contested the region. With a legacy of staunch resistance to the natives seeking to throw out the invaders. Combined with their imperial and expansionist culture, they will shatter any hopes of easily ousting them from their colonies!$innovation_saradoani_quote$"
 innovation_saradoani_quote: "\n\n#inno_quote \"\"#!$innovation_saradoani_quote_attribution$"
 innovation_saradoani_quote_attribution: "\n #inno_quote ~ #!"

 innovation_voreidrakarstataroxoi: "Northern Dragonriders"
 innovation_voreidrakarstataroxoi_desc: "Unlike their southern counterparts, the Dragonriders of the Northwatch, have long been a decentralized and meritocratic institution, having lost much of their homelands they ride now often as semi-folk-heros slaying great beasts, or leading Blackfort Imperial armies into warfare!$innovation_voreidrakarstataroxoi_quote$"
 innovation_voreidrakarstataroxoi_quote: "\n\n#inno_quote \"\"#!$innovation_voreidrakarstataroxoi_quote_attribution$"
 innovation_voreidrakarstataroxoi_quote_attribution: "\n #inno_quote ~ #!"

 innovation_citizen_guard: "The Citizen Guard"
 innovation_citizen_guard_desc: "The fallen Second Empire had brought slow decline and degradation to all the proud isles off the coast, yet with its collapse a new wave of revival has swept across our city states, many fresh faces seek employment in our military. With the establishment of dedicated guard regiments our growing states shall have strong shields protecting them!$innovation_citizen_guard_quote$"
 innovation_citizen_guard_quote: "\n\n#inno_quote \"\"#!$innovation_citizen_guard_quote_attribution$"
 innovation_citizen_guard_quote_attribution: "\n #inno_quote ~ #!"

 innovation_drakarstataroxoi: "Dragonriders of Aversaria"
 innovation_drakarstataroxoi_desc: "The Aversarians once lived with and rode dragons, great magical creatures of Purest Blood. Now long lost... Yet the legacy endures, our modern 'Dragonriders' act as the driving shock-cavalry hammer of any proper Aversarian Army!$innovation_drakarstataroxoi_quote$"
 innovation_drakarstataroxoi_quote: "\n\n#inno_quote \"\"#!$innovation_drakarstataroxoi_quote_attribution$"
 innovation_drakarstataroxoi_quote_attribution: "\n #inno_quote ~ #!"

 innovation_varangonoi: "Varángōnoi Contracts"
 innovation_varangonoi_desc: "The Battle of Ten-Trees has proven that these Northmen are very, VERY, capable combatants, brave, bold, unrelentting, and well equipped. The warlords remaining in the Northern Aversarian lands quickly sought out these formidable warriors, forming contracts with many a Sjalvolki, often granting either lands, riches, or in some cases weddings, in exchange for their protection or their ability to break enemy lines.$innovation_varangonoi_quote$"
 innovation_varangonoi_quote: "\n\n#inno_quote \"\"#!innovation_varangonoi_quote_attribution$"
 innovation_varangonoi_quote_attribution: "\n #inno_quote ~ #!"

 innovation_pelekyphoroi: "Pelekyphóroi Contracts"
 innovation_pelekyphoroi_desc: "The Battle of Elysia has proven that these Northmen are very, VERY, capable combatants, brave, bold, unrelentting, and well equipped. The warlords remaining in the Southern Aversarian lands soon after the disasterous battle, sought out these formidable warriors, forming contracts with many a Sjalvolki, often granting either lands, riches, or in some cases weddings, in exchange for their protection or their ability to break enemy lines.$innovation_pelekyphoroi_quote$"
 innovation_pelekyphoroi_quote: "\n\n#inno_quote \"\"#!innovation_pelekyphoroi_quote_attribution$"
 innovation_pelekyphoroi_quote_attribution: "\n #inno_quote ~ #!"
 
 innovation_eastern_legions: "Aironoi Legion Doctrine"
 innovation_eastern_legions_desc: "The Easten Realms have long been contested due to their sheer size. The military traditions are much different compared to their Western and Northern kinsmen. Focused more on large cavalry formations or pike fromations in reply.$innovation_eastern_legions_quote$"
 innovation_eastern_legions_quote: "\n\n#inno_quote \"\"#!innovation_eastern_legions_quote_attribution$"
 innovation_eastern_legions_quote_attribution: "\n #inno_quote ~ #!"
 
 innovation_samojitian: "Men of Broken Chains"
 innovation_samojitian_desc: "The slaves of the Mayikrata have long suffered inhuman conditions. Seen as less than human and treated as such for generations, the Samojiti are a people awakened in wrath, now they hunt down the fearful Magi who once enslaved them. No Aversarian is blameless for the crimes done to these people, no payment is enough. Only the blood of countless masters can quench our thirst for vengance.$innovation_samojitian_quote$"
 innovation_samojitian_quote: "\n\n#inno_quote \"KILL THE MASTERS!\"#!innovation_samojitian_quote_attribution$"
 innovation_samojitian_quote_attribution: "\n #inno_quote ~ #!"
 
 innovation_diorenic_guardians: "Men of Little Chevalie"
 innovation_diorenic_guardians_desc: "The Diorenics have long suffered attempts at conquest by Chevalie. Seen as a part of the outer cultural influence of Chevalie, they resist integration. Many choosing to remain devout to the Abathonic Cult, in part to spurn the attempts to convert their folk to the Conclave, fighting hard with the arms and armor gained through years of trade to throw back attempted invasions.$innovation_diorenic_guardians_quote$"
 innovation_diorenic_guardians_quote: "\n\n#inno_quote \"\"#!innovation_diorenic_guardians_quote_attribution$"
 innovation_diorenic_guardians_quote_attribution: "\n #inno_quote ~ #!"
 
 innovation_anorlori_winged_knights: "Order of the Winged Knights"
 innovation_anorlori_winged_knights_desc: "The Anorlori are a proud folk. Having a long history of adventurism and heroics, they are culture in constant production of new bold young men seeking to make a name. Many end up in the ranks of the Winged Knights of Anor, an order born from and dedicated to the direct protection of their home isles, while also used to serving new exiled nobles seeking to forge their legend.$innovation_anorlori_winged_knights_quote$"
 innovation_anorlori_winged_knights_quote: "\n\n#inno_quote \"\"#!innovation_anorlori_winged_knights_quote_attribution$"
 innovation_anorlori_winged_knights_quote_attribution: "\n #inno_quote ~ #!"
  
 innovation_coldcoast_marines: "Men of the Coast"
 innovation_coldcoast_marines_desc: "The Coldcoasters are an overlooked folk. Having long been little more than a footnote in Chevalien histories, they are culture of fishers and sailors. Yet time and again they have remained an independant culture from their kindred. With unmatched prowess in Chevalie's naval warfare history.$innovation_coldcoast_marines_quote$"
 innovation_coldcoast_marines_quote: "\n\n#inno_quote \"\"#!innovation_coldcoast_marines_quote_attribution$"
 innovation_coldcoast_marines_quote_attribution: "\n #inno_quote ~ #!"
   
 innovation_guillater_mariners: "Marines of Guillate"
 innovation_guillater_mariners_desc: "The Guillaters are a storied folk. Considered one of the more successful cultures on all Aeras, they are people of warriors and sailors. Time and again they have remained independant from their imperialist neighbors. With unmatched prowess in naval warfare.$innovation_guillater_mariners_quote$"
 innovation_guillater_mariners_quote: "\n\n#inno_quote \"\"#!innovation_guillater_mariners_quote_attribution$"
 innovation_guillater_mariners_quote_attribution: "\n #inno_quote ~ #!"
   
 innovation_aguadosi_marines: "Marines of Aguados"
 innovation_aguadosi_marines_desc: "The Aguadosians are true lovers of the tides and waves. Considering the open oceans their true home. Once mighty trade fleets sailed far and wide, most under guard by our storied marines. Still they sail, for riches or to honor their legacy.$innovation_aguadosi_marines_quote$"
 innovation_aguadosi_marines_quote: "\n\n#inno_quote \"\"#!innovation_aguadosi_marines_quote_attribution$"
 innovation_aguadosi_marines_quote_attribution: "\n #inno_quote ~ #!"
    
 innovation_clan_champions: "Champions of Karan"
 innovation_clan_champions_desc: "The Nevtanei Clans are a deeply mysterious folk. Worshiping a 'Corpse God' and feasting on human flesh, they are an easily hated folk. Yet to their own eyes they are brave heros, forging ahead and staking their oen claim of the Dead Gods Powers.$innovation_clan_champions_quote$"
 innovation_clan_champions_quote: "\n\n#inno_quote \"\"#!innovation_clan_champions_quote_attribution$"
 innovation_clan_champions_quote_attribution: "\n #inno_quote ~ #!"

 innovation_penetworin: "Spellswords of Ethowos"
 innovation_penetworin_desc: "The Spellswords were born from the magi tombs and scrolls the Penetworin were able to gather. Studied by the once slaves, they began to develop their understanding, taking a particularly militant approach, seeking to weild enough power to resist any future enslavement.$innovation_penetworin_quote$"
 innovation_penetworin_quote: "\n\n#inno_quote \"\"#!innovation_penetworin_quote_attribution$"
 innovation_penetworin_quote_attribution: "\n #inno_quote ~ #!"
        
 innovation_karannin: "Men of the Golden Martyrs"
 innovation_karannin_desc: "The Sacred Golden Martyrs are the thousands of long dead Golden Men. Deeply mysterious and lost to time, we worship them and make use of the Holy Relic Armor they left behind.$innovation_karannin_quote$"
 innovation_karannin_quote: "\n\n#inno_quote \"\"#!innovation_karannin_quote_attribution$"
 innovation_karannin_quote_attribution: "\n #inno_quote ~ #!"
         
 innovation_shadowwardens: "Men of Shadows"
 innovation_shadowwardens_desc: "The Shadowsteppers are a deeply hostile and lethal folk. Their 'armies' dont fight, they pick off, they take one by one, till none are left to take. They walk from above and strike suddenly, before vanishing once again into the darkness they call home.$innovation_shadowwardens_quote$"
 innovation_shadowwardens_quote: "\n\n#inno_quote \"\"#!innovation_shadowwardens_quote_attribution$"
 innovation_shadowwardens_quote_attribution: "\n #inno_quote ~ #!"
         
 innovation_kromlandar: "Men of Ancient Days"
 innovation_kromlandar_desc: "These stout folk claim heritage to a long forgotten people, they hail from the most ancient kings, heirs of a war from before recorded history, they still seek the blood of the Aecaggir and all their worshipers.$innovation_kromlandar_quote$"
 innovation_kromlandar_quote: "\n\n#inno_quote \"\"#!innovation_kromlandar_quote_attribution$"
 innovation_kromlandar_quote_attribution: "\n #inno_quote ~ #!"
          
 innovation_agio_marines: "Saintly Marines"
 innovation_agio_marines_desc: "The Agiopadis, and later Lightlanders remained stong supporters and faithful to the Saints. Their Isles long being a bastion for exiled agionists, and targets for raiders alike.$innovation_agio_marines_quote$"
 innovation_agio_marines_quote: "\n\n#inno_quote \"\"#!innovation_agio_marines_quote_attribution$"
 innovation_agio_marines_quote_attribution: "\n #inno_quote ~ #!"
 
 innovation_curgerski: "Men of the North"
 innovation_curgerski_desc: "Our folk have long been few, fewer now after the chaos of these recent years, yet we still live as in ancestral ways. We are hunters and fighters and craftsmen, for there is much work yet few hands.$innovation_curgerski_quote$"
 innovation_curgerski_quote: "\n\n#inno_quote \"\"#!innovation_curgerski_quote_attribution$"
 innovation_curgerski_quote_attribution: "\n #inno_quote ~ #!"
   
 innovation_mastikigni: "Men of War"
 innovation_mastikigni_desc: "Our folk are considered the most formidable warrior culture in the entire history of this world, and rightfully so! Few have face trials we seek out, fewer still have survived half of what we experience daily! Our lands are the bulwark against the fog, and the world rests easier knowing it!$innovation_mastikigni_quote$"
 innovation_mastikigni_quote: "\n\n#inno_quote \"\"#!innovation_mastikigni_quote_attribution$"
 innovation_mastikigni_quote_attribution: "\n #inno_quote ~ #!"
     
 innovation_kaskader: "Men of the Freeholds"
 innovation_kaskader_desc: "Our folk have established themselves as prosperous city keepers, farmers, and merchants. With most Kaskader citizen holding land estates themselves, and many among them belonging to one of the many guilds. In times of war these wealthy 'Freeholders' march together to defend their beloved new homeland and the freedoms they enjoy.$innovation_kaskader_quote$"
 innovation_kaskader_quote: "\n\n#inno_quote \"\"#!innovation_kaskader_quote_attribution$"
 innovation_kaskader_quote_attribution: "\n #inno_quote ~ #!"
        
 innovation_itnicavingi: "Men of the Pass"
 innovation_itnicavingi_desc: "Our folk have established themselves in the lands of the legendary battle of Elysia, farmers, and hunters of the once battlefields. Kinship among the Itnicavingi ins important, they see themselves less as part of a greater people and care more for the direct relatives and bonded families of their local settlement. Though this has led too much infighting, they have united in times of existential threat.$innovation_itnicavingi_quote$"
 innovation_itnicavingi_quote: "\n\n#inno_quote \"\"#!innovation_itnicavingi_quote_attribution$"
 innovation_itnicavingi_quote_attribution: "\n #inno_quote ~ #!"

 innovation_pactlander: "Men of Pacts"
 innovation_pactlander_desc: "The Pactlanders settled the lands no others fought over, mud and deltas. Only surviving through the pacts that gave them their name. These pacts also are key to the military formations they fight under, trusting in one another, they engage in guerilla fighting, avoiding direct engagements with their richer neighbors.$innovation_pactlander_quote$"
 innovation_pactlander_quote: "\n\n#inno_quote \"\"#!innovation_pactlander_quote_attribution$"
 innovation_pactlander_quote_attribution: "\n #inno_quote ~ #!"
  
 innovation_drogvingi: "Men of the Old Way"
 innovation_drogvingi_desc: "The Drogvingi are known well for their refusal of change, the migration changed their brethren much, and instead of following in their misguided efforts to adopt new identities, the Drogvingi honor the Old Ways, they speak the Old Tounge, and still keep to the old rites of their ancestors.$innovation_drogvingi_quote$"
 innovation_drogvingi_quote: "\n\n#inno_quote \"\"#!innovation_drogvingi_quote_attribution$"
 innovation_drogvingi_quote_attribution: "\n #inno_quote ~ #!"
   
 innovation_radivolki: "Men of Radiance"
 innovation_radivolki_desc: "The Radivolki are known well for their rich lands and early innovations, the migration won them much, leading the efforts to adopt new identities, the Radivolki forge the New Ways, they speak the New Tounge, and honor the New Rites of their new home.$innovation_radivolki_quote$"
 innovation_radivolki_quote: "\n\n#inno_quote \"\"#!innovation_radivolki_quote_attribution$"
 innovation_radivolki_quote_attribution: "\n #inno_quote ~ #!"
    
 innovation_sarridian: "Men of Skis"
 innovation_sarridian_desc: "The Sarridians are known well for their skis, a hobby, hunting tactic, and battle tool all at once. These seemingly simple tools allow the Sarridians unmatched manuver ability through their often snowy homelands. Though many Chevaliens would adopt the hobby, few could employ the craft in warfare as the Sarridians have.$innovation_sarridian_quote$"
 innovation_sarridian_quote: "\n\n#inno_quote \"\"#!innovation_sarridian_quote_attribution$"
 innovation_sarridian_quote_attribution: "\n #inno_quote ~ #!"
 
 innovation_daukeni: "Warrior-Poets of the Sjalvolki"
 innovation_daukeni_desc: "The Daukeni are known well for their cultural strength, having become the figure head of all Sjalvolki. This translates to their military, having basic but very sound structure. No fancy fighting or sneaky tactics. Just brave and strong warriors able to form a wall and break through enemy lines for glory and honor.$innovation_daukeni_quote$"
 innovation_daukeni_quote: "\n\n#inno_quote \"\"#!innovation_daukeni_quote_attribution$"
 innovation_daukeni_quote_attribution: "\n #inno_quote ~ #!"
  
 innovation_barki: "Men of Guides and Pathfinders"
 innovation_barki_desc: "The Barki are known well for their place as middlemen between the Sjalvolki and Aversarias, having long been employed for diplomatic and military affairs between these north and south. This translates to their military, having some of the best scouts the northmen can offer."
  
 innovation_ardothane: "Rangers of Kalathipsomi"
 innovation_ardothane_desc: "The Ardothane are known well for their opportunistic raids and 'banditry', though in reality the Rangers of Ardothane follow strict codes, highly uphold honorhood, and never stoop to the mass slaughter Aversarians have subjected the Kelthiunai too time after time."
  
 innovation_caemansi: "Battlebards of the Sjalvolki"
 innovation_caemansi_desc: "The Caemansi are known well for their violent and brutal nature. Songs are not sung of family and peaceful gardens. But of bloodlust and glorious slaughter. No tales of lost love, only lost limbs!"
 
 innovation_adrakamp: "Lawkeepers of the Sjalvolki"
 innovation_adrakamp_desc: "The Adrakamp are known well for their metropolitan and strong diplomatic culture, their advanced trade cities giving death to their tribal ways but birthing an early adoption of professional soldiers in the 'Lawkeepers'."
 
 innovation_ostvolk: "Freelancers of Ostvolk"
 innovation_ostvolk_desc: "The Ostvolk are known well for their rich lands and strong mercenary culture, the migration won them much, leading the charge past the fallen west and into the vast east, the Ostvolk are forged from old Imperial wealth and northern martial valor."
 
 innovation_greulokin: "Faithful of the Sjalvolki"
 innovation_greulokin_desc: "The Greulokin are known well for their religious zeal, having once been the figure head of all Sjalvolki. This translates to their military, having particular ferver in battle. Fighting with more than mere mortal Will in their hearts. They craft tactics after old legends and histories. Just as brave and strong warriors as other tribes."
 
 innovation_irmionoth: "Bloodsingers of the Sjalvolki"
 innovation_irmionoth_desc: "The Irmionoth are known well for their brutal and vengeful oaths, feared by all Sjalvolki. This translates to their military, having particularly brutal and merciless warriors in battle."
 
 innovation_vrodkin: "Wildmen of the Sjalvolki"
 innovation_vrodkin_desc: "The Vrodkin are known well for their strange culture and large numbers, seen as semi-alien by all Sjalvolki. This translates to their military, having particularly large armies in battle"
 
 innovation_tribocicai: "Treeborn of the Sjalvolki"
 innovation_tribocicai_desc: "The Tribocicai are know well to be far more interested in harvests and crop yeilds than warfare. Still they protect their lands and farms, with bow and arrow, though still able in hand to hand when charged in open fields."
  
 innovation_doraxi: "Pirates of Iyross"
 innovation_doraxi_desc: "The Doraxi are despised for their piracy and mercenary dealings. Though they would also come to be prolific merchants, the stain of their pirate legacy would follow them for centuries after the practice died away."
  
 innovation_derescicai: "Pirates of the Sjalvolki"
 innovation_derescicai_desc: "The Derescicai are are know well to be raiders. Though they would also come to be prolific farmers, their warbands reamined focused on raids and looting over proper warfare."
  
 innovation_opakasijan: "Pikes of the Sjalvolki"
 innovation_opakasijan_desc: "The combined Marcher and Sjalvolki influences of the First Landers of the West plus the proud pike traditions of Opakhasia. Have all come together to make one of the proudest and well equipped pikemen in all Aeras."
  
 innovation_civerek: "Fated of the Sjalvolki"
 innovation_civerek_desc: "The God of Fate has guided us to this land. From our fall and roaming, to today, we stand as the most spiritually intune of the Sjalvolki. Prohen has led us here, we have learned from the Fall and shall not fail again."
     
 innovation_sontrventi: "Merchants of the Sjalvolki"
 innovation_sontrventi_desc: "The merchants of the Adrakamp are the life blood of their people. Joined with the vast numbers of the Vrodkin, a new army was formed, the Merchant Guard. Dedicated to defending their employers and the ports that enable their trade."
        
 innovation_old_legionaires: "The First Legion"
 innovation_old_legionaires_desc: "The Legions which brought the Shattered-Coast to kneel. Their legacy lives on to this day. And if returned, they shall bring ruin to the lesser men who dare settle their sacred lands."
         
 innovation_astiliak: "Men of Beasts"
 innovation_astiliak_desc: "According to Astiliak faithful, animals are aspects of certain gods, thus the magi who channel the power of these gods must take aspects of their form and live amongst them, dressed to resemble their divine fellows."
         
 innovation_fenvir: "Nomands of the Sjalvolki"
 innovation_fenvir_desc: "The Fenvir are known well for their warlike and nomadic culture, astranged from their Sjalvolki brethren. This translates to their military, with their special tactic of horesback archery giving them a clear advantage in battle with their fellow Northmen."
            
 fenvir_riders: "Fenvir Outriders"
 fenvir_riders_flavor: "The nomadic Fenvir have adopted the powerful tactic of horesback archery. Enabling them unmatched manuver and striking range, allowing them to dismantle enemy formations at a safe distance, though being Sjalvolki they are happy to run down their foes with blades and axes when out of arrows.#!"
           
 astiliak_magi: "Astiliak Magi"
 astiliak_magi_flavor: "These odd magi dress as the animals they choose to live amoung, taking on their aspects to keep their mortal form intact.#!"
   
 old_legionaires: "Old Legionaires"
 old_legionaires_flavor: "The legions of a time before the Aautokrata. Should they return to Aeras they would shatter many dreams as they had long ago, under Imperial Banners and marching feet.#!"
   
 sontrventi_merchant_guard: "Sontrventi Guardsmen"
 sontrventi_merchant_guard_flavor: "The Sontrventi are a mercantile folk, and a numerous folk. Allowing for deployment of larger well funded armies of simple pike and archer formations.#!"
     
 opakasijan_pikemen: "Opakasijan Pikemen"
 opakasijan_pikemen_flavor: "Pikemen of Opakasija are Armored as Chevaliens, Brave as Sjalvolkis, and Proud as Aversarians! No other pike fromation on Aeras can compare to the proud men of Opakasija.#!"
     
 civerek_royal_guard: "Civerek Royal Guard"
 civerek_royal_guard_flavor: "Inspired by the 'Pikes of the Purest' these pikemen serve the Royal and lesser Nobles of the Civerek realms. They are devoutly faithful to Prohen in particular.#!"
   
 civerek_warriors: "Civerek Warriors"
 civerek_warriors_flavor: "The men of Civerek are well armed and armored, proud descendants of the once-kings of the Greulokin, now kings once more in their new homelands. They fight hard to retain their second chance as rulers.#!"
     
 doraxi_pirates: "Doraxi Pirates"
 doraxi_pirates_flavor: "Hated across the central isles and the coasts of South Etepezea and West Opakhasia, these raiders make a living through their piracy and mercenary work. Ruthless and cunning they would be a constant blight for merchants of the area.#!"
     
 derescicai_warband: "Derescicai Warband"
 derescicai_warband_flavor: "Farmer by day, raiders by night, these warriors avoid direct engagements and prefer to storm in and storm away before proper armies can respond, still when the chips are down they know how to form a wall and fight hard.#!"
   
 ostvolk_knights: "Ostvolk Knights"
 ostvolk_knights_flavor: "The backbone of the Ostvolk realms. These were the second proper knights of the Sjalvolki people's, hailing from the settlers of Far-Eastern Opakhasia and Far-Western Aironoi. Often serving as prized mercenaries or freelancers across the Continent, they are a symbol of their folks wealth and rapid innovation."             
 
 shamans: "Shamans"
 shamans_flavor: "Unlike [Concept('aversaria','Imperial')|E] [magi|E], these tribal spell-casters are deeply intertwined with nature or the powers their Gods bestows.#!"
   
 tribocicai_bowmen: "Tribocicai Warband"
 tribocicai_bowmen_flavor: "Each man a farmer or hunter, and either way, land owners. They prefer to fire from a distance at their foes, yet arent helpless in hand-to-hand fighting. Their new-homeland only encouraging their established tactics.#!"
   
 vrodkin_wildmen: "Vrodkin Warband"
 vrodkin_wildmen_flavor: "Though still Sjalvolki, the Vrodkin have long been seperated from their kinsmen, combined with their larger numbers, their armies are as a result far larger and bit different than their brethren.#!"
   
 adrakamp_harlaws: "Adrakamp Harlaws"
 adrakamp_harlaws_flavor: "Unlike the rest of the Migrant Sjalvolki Armies. The Adrakamp fought as professional soldiers, fighting with forged advaced armor and arms faster than their less mercantile minded brethren. They proved time and again that peace-making, and 'Lawkeeping' is honorable and warrior work.#!"
   
 caemansi_battlebards: "Caemansi Warband"
 caemansi_battlebards_flavor: "Unlike the Daukeni Warrior-Poets. The Caemansi are more akin to Battle-Bards have no clinging to softness. Instead embracing of all that comes from brutal war and bloody violence with open arms. Their heavy great-axes and crushing warhammers smashing through enemy lines like a sharp blade to raw flesh.#!"
   
 barki_pathfinders: "Barki Warband"
 barki_pathfinders_flavor: "Expert scouts and elite wayfinders, these skirmishers are renown for their abilities in woodlands and rough terrain. Though disliked by most their brethren for their 'Aversarian Stench', they still find these same tribesmen keen to employ their scouts in times of war.#!"
     
 ardothane_rangers: "Ardothane Rangers"
 ardothane_rangers_flavor: "Expert archers and experienced raiders, these rangers are seen as mere bandits and brigands by their enemies. Yet to their own they are the Heroic Rangers. Men and women who risk life and limb to protect or avenge their folk.#!"
       
 sarridian_ski_hunters: "Ski Hunters"
 sarridian_ski_hunters_flavor: "Each hunter makes use of their iconic skis to reach blindingly fast speeds through the snowy mountains and hills they call home. Striking fast and hard before vanishing once more. Even in conditions where their skis are unusable, they still can rely on their keen senses and scouting prowess. Sticking always to hit-and-run tactics to wear down stronger forces.#!"
   
 greulokin_warband: "Greulokin Warband"
 greulokin_warband_flavor: "The warriors of the Greulokin are particularly devout amongst the Migrant Sjalvolki. Each man knows his history, and holds dear the memory of where their folk once stood. They are a particularly faithful folk.#!"

 irmionoth_warband: "Irmionoth Warband"
 irmionoth_warband_flavor: "The warriors of the Irmionoth are particularly brutal amongst the Migrant Sjalvolki. These warriors hold grudges like no others. Crushing and slaughtering without pity or respite. They have mastered killing and punishment by death.#!"

 daukeni_warband: "Daukeni Warband"
 daukeni_warband_flavor: "The warriors of the Daukeni are Warrior-Poets and Saga-Singers. Each man focused on winning glory and proving their valor through combat. They are a particularly honorable folk, avoiding some of the casual cruelties of other tribes.#!"

 mastikigni_warband: "Mastikigni Warband"
 mastikigni_warband_flavor: "Each warrior of Mastikigni Warbands has accomplished more than enough deeds worthy of heroship, their warrior culture unmatched on Aeras, facing any horror or horde, no foe can best the battle-valor of the Mastikigni!#!"

 itnicavingi_kinsmen: "Itnicavingi Kinsmen"
 itnicavingi_kinsmen_flavor: "The Itnicavingi have more loyalty to direct family and community over culture. This results in plenty of infighting, but allows their military much flexibility and adaptability. Each regiment from a particular family or community, fighting independant of eachother, striking in unexpected ways and more able to take advantage of unexpected changes in battle.#!"

 pactlander_clansmen: "Pactlander Clansmen"
 pactlander_clansmen_flavor: "These guerilla fighters avoid direct combat, prefering to harass and skirmish with enemy armies, only striking when they can lean on some clear advantage or opportunity.#!"

 drogvingi_warband: "Drogvingi Warband"
 drogvingi_warband_flavor: "The Warbands of the Drogvingi fight just as the Sjalvolki have always fought, much less changed from the migration. Though still with much more wealth, they now fight with new polished blades and modernized armor. The Old Ways still burn bright with these soldiers as they charge into the fires of war.#!"

 kaskader_freeholders: "Kaskader Freeholders"
 kaskader_freeholders_flavor: "Each warrior a citizen and landowner of the Kaskader folk, With strong ties to the farmlands they hold, these warriors fight hard for the families they've established along the Dreaming Hills.#!"

 curgerski_hunters: "Curgerski Hunters"
 curgerski_hunters_flavor: "Though few in number, these experienced hunters, that double as warriors for the Curgerski, are formidable opponents with their honed senses and mastery of hit-and-run tactics.#!"

 agio_marines: "Agíousezonáftes"
 agio_marines_flavor: "Comprised of faithful Agionists of all kinds, these 'Saintlymarines' guard the Agiopadis, later Lightlanders, isles from the various invaders and raiders seeking Saintly treasures to sell off.#!"

 kromlandar_warband: "Kromlandar Warband"
 kromlandar_warband_flavor: "The warriors of Kromland are ferocious fighters. Honoring the most experienced and skilled over any birthright or age. They ever-seek to prove their might and drive back all the horrors of the deep. Longing to one day earn a place in their peoples seemingly endless memory.#!"

 penetworin_spellswords: "Spellswords"
 penetworin_spellswords_flavor: "These Magi were born not to dominate nor enslave. But to uphold the teachings of Ethowos, to have the magical and martial prowess to resist all slavers. To keep their hurt people safe from further pains. The highest honor is to be made a guard to Ethowo, and feed their God.#!"

 karannin_runic_champions: "Relic Champions"
 karannin_runic_champions_flavor: "These warriors, clad and armed in the Holy Relics of the Golden Martyrs, were born out of the desire to learn and master the sacred artifacts of the lost Golden Men. Only the most disciplined and powerful champions may even attempt at weilding such God-Like equipment.#!"

 shadowwardens: "Shadowstep Wardens"
 shadowwardens_flavor: "Our home is not for outsiders. From above we watch for them, they want to talk, or they want to fight and march, instead they scream and go quiet. We drive them out, we serve the Queen of Shadows. We know no outsider, no self, nothing but Her Gift.#!"

 clan_champions: "Champions of Karan"
 clan_champions_flavor: "Devout warriors of the 'Dessicated God', each man earns their place after ritual hunting and slaying of a human, and then feasting on the slain humans flesh, there-by Karan might bestow power and favor in war.#!"

 magi_regular: "Magi"
 magi_regular_flavor: "Though not as powerful, knowledgeable, or well-trained as their [Concept('aversaria','Imperial')|E] counterparts, hedge [magi|E] flock in larger numbers at the sight of coin.#!"

 relic_phalanx: "Relic Phalanx"
 relic_phalanx_flavor: "Most notable for their continued practice of many archaic tactics and placing tradition over practicality these soldiers are still not to be underestimated. For they fight not just for their lives, but for the ancient familial heirlooms and relics that make up their weapons and armor.#!"

 saradoani_legion: "Saradoani Archian Legionaires"
 saradoani_legion_flavor: "The Old Imperial Legions are dust, and the Colonies are in ruin. In this dire hour, a new Legion must rise. Warriors of this new age, legionaires capable of lasting in the bitter desert. For Aversaria!#!"

 northern_legion: "Kalathipsomi Legionaires"
 northern_legion_flavor: "Originally comprised of Veterans of Ten Trees, the Kalathipsomi Legionaires are cold and stoic soldiers. Their occupation under the Sjalvolki granted these legionaires chain armor technology sooner than their southern brethren. Even after the passing of the last of the Veterans, these formations would retain the original legacy forged at Ten Trees.#!"

 exkoubitoi_legion: "Exkoúbitoi Legionaires"
 exkoubitoi_legion_flavor: "The 'Sentinels' are the most ancient and most proud Legionaries of Aversaria. The purest blooded and the most untouched of all Imperial armed formations left. These relics of a bygone era are all that stand between the embers of Aversaria and the abyssal dark of barbarism.#!"

 pureblood_legion: "Pure-Blood Legionaries"
 pureblood_legion_flavor: "The Empire long dead, the surviving Aversarians of Malcois resisted the new age. Thus their armies did as well, refusing to abandon the idea of Aversarian Supremacy, they would copy much of the framework of the Legions of old. With certain unavoidable differences. These legionaires will remind Aeras that only the Purest can save this dying world!#!"

 ironblood_legion: "Iron Legionaries"
 ironblood_legion_flavor: "The Empire long dead, the surviving Aversarians of Eastern Ouletaelats resisted the new age. Thus their armies did as well, refusing to abandon the idea of Imperial Restoration, they would copy much of the framework of the Legions of old. With certain unavoidable differences. These legionaires will remind the Isles of the might of Notianixia!#!"

 black_rangers: "Black Rangers"
 black_rangers_flavor: "The most experienced explorers and most skilled pathfinders through the Fog. Oft making their wealth through guiding eager explorers or seeking certain lost relics for rich buyers. The Black Rangers are feared and seen as cursed folk by many, said to practice evil rituals in deep Foglands, yet these dark tales do little to deter those rich or desperate enough to seek a way through the Fog.#!"

 abdexorn_legion: "Abdêxorn Legionaries"
 abdexorn_legion_flavor: "Valuing strength above all, these legionaires choose lighter equipment as they regularly engage in direct naval combat. Champions of the Abdêxorn people, they seek glory and riches, each legionaire hoping to one day be named among the Heros the Isles hold in such high regard.#!"

 magi_auxiliaros_corpus_xii: "Magi Corpus XII Auxiliaries"
 magi_auxiliaros_corpus_xii_flavor: "The very last official Magi Corpus active since the utter chaos of the Fall of the Second Empire. Having survived Elysia with just enough Magi left to continue resisting the Migration. With superior equipment and training these Auxiliaries are masters of their fields, their standards set higher than the average Aversarian Magi Auxiliary regiments.#!"

 agiosanctarii: "Agiosanctarii"
 agiosanctarii_flavor: "The 'Saintly Crusaders' are men and women who take up arms in the name of one Saint or another. These riders have earned much infamy throughout Sarradon, highly disciplined and devout in their faith, they have more than once been able to win unlikely victories though their sheer zeal.#!"

 komitatenses: "Komitaténses"
 komitatenses_flavor: "Aversaria is dying, and with it so to are her military structures. Thousands of veterans and their families now roam the Old Empire seeking employment and security. A common solution to this plight was the formation of "Companions" Field Armies.#!"

 kastrophylakes: "Kastrophýlakes"
 kastrophylakes_flavor: "The elite guards of the Imperial Magi were originally comprised of old Imperial Legionaires. Our "Fortress Wardens" are nowadays a more kitbashed force of various veterans of disbanded or shattered Imperial formations, now dedicated to serving and guarding the holdings of their Magi overlords.#!"

 ixsianhoplite: "Ixsian Hoplites"
 ixsianhoplite_flavor: "The last remnants of Ixs' old army. These hardened and timelost warriors fight in outdated formations and with relic arms and armor, passed down from father to son, mother to daughter. The Hoplites of Ixs will show these legionaires what true soldiery means.#!"

 apokiakas_loustosi: "Apokiakas loústosi"
 apokiakas_loustosi_flavor: "The various Aversarian ventures, holy orders, and colonies across Sarradon have for many years now relied on professional 'Colonial Pikemen', their military traditions unbroken despite the utter chaos of the 13th century.#!"

 erimatoi_milithosi: "Erimatoi Milithosi"
 erimatoi_milithosi_flavor: "The Erimatos people have long contested control over Sarradon, their particular formations know as 'Milithosi' have fought for their home for many centuries now, making them highly knowledgeable of sarradon and the enemies that are native to the land.#!"

 etrandanexi_legion: "Étrandanexi Légionnaires"
 etrandanexi_legion_flavor: "These rouge Marchers with heavy Aversarian intermixing are the epitome of their greater Étrandanexi culture. Unempathetic and shrewd in combat these soldiers are well-trained yet rarely quite as well-intentioned. Having a long, messy history of immoral actions taken for profit and advancement in Étrandanexi military structures.#!"

 diorenic_guardians: "Diorenic Guardians"
 diorenic_guardians_flavor: "With a history of strife and trade with Western Chevalie, these Anandrasi warriors are heavily armored and well armed. Hailing from warrior and Abathonic faithful families throughout Diorenic lands, they stand valiant guard against any attempt to force their lands or people to conform to Chevalien demands.#!"

 anorlori_winged_knights: "Winged Knights of Anor"
 anorlori_winged_knights_flavor: "With a history of far-flung adventerurs and heroic last stands, these Anandrasi warriors are driven to make their mark and seek deification through deeds. Hailing from noble second-sons and bold champions. Taking their name and iconic armors from the many birds that populate the isles. These knights will find their heroics one way or another!#!"

 coldcoast_marines: "Coldcoast Marines"
 coldcoast_marines_flavor: "With a history of serving in Chevalie's navy, these seaborne warriors are fearsome marines, known for taking enemy ships over by force. They are unmatched in all Chevalie when it comes to naval and islander combat, as well as oft serving as scouts and raiders for larger armies.#!"
 
 guillater_mariners: "Guillater Mariners"
 guillater_mariners_flavor: "With a history of dominance in naval warfare, the marines of Guillate are unmatched in all the Isles when it comes to naval and island combat. Often seen adorned with feathers from the many birds that inhabit their island homelands.#!"
 
 aguadosi_marines: "Aguadosi Mariners"
 aguadosi_marines_flavor: "Often employed to protect large trade ships or small trade fleets. The marines of Aguadosi were once a common sight across the know oceans, even after the collapse they still sail ever on for riches. Keeping the seas as their true home over any rock.#!"

 samojitian_chainbreakers: "Samojitian Chainbreakers"
 samojitian_chainbreakers_flavor: "Countless generations as slaves and playthings for the Magi has birthed a deep hatred in these guerilla infantry, a hate that runs from father to son, mother to daughter. These warriors, bound by trauma and brutal subjugation, now seek total vengance against all Magi, and some seek the blood of all Aversarians, regardless of their magical ability.#!"
 
 lonely_warband: "Lonely Lighter Warband"
 lonely_warband_flavor: "The backbone force of the Lonely Lighters, armed with blades and shields these warriors are expected to defend their island homelands from the undead and other adventurous invaders, these men go on to be life long brothers, often binding their friendships by wedding sons and daughters when in peace time.#!"
 
 partic_warband: "Partic Warband"
 partic_warband_flavor: "The backbone force of the Partic armies, armed with blades and shields these warriors are expected to defend their new homelands from the undead and their new neighbors, these men go on to be life long brothers, often binding their friendships by wedding sons and daughters when in peace time.#!"

 great_axes: "Lonely Lighter Great-Axemen"
 great_axes_flavor: "The elite force of the Lonely Lighters, armed with great-axes these warriors are brutal. Savage in their rage and unrelentting in combat, they cleave apart all threats to their sacred isles.#!"

 ironblood_warband: "Iron-Blood Warband"
 ironblood_warband_flavor: "Having lived harsh lives for generations in the Iron Spines, the Aupagn peoples make for tough warriors. Forming into warbands made up of mostly battle-eager or younger sons. Who obey their experienced elder captains who go to war in hope of dying, to lighten the burden on their families.#!"

 sernvryki_huscarls: "Sernvryki Huscarls"
 sernvryki_huscarls_flavor: "These Northern warriors are hard and unbreakable. Having kept to their harsh and unforgiving lifestyle, the Sernvryki are formidable opponents in battle. Particularly adept in waging war during the coldest of winters.#!"

 leskovych_oathbound: "Leskovych Oathbound"
 leskovych_oathbound_flavor: "These coastal warriors are well armed and armored. With bonds built on sacred oaths and contracts these men are deeply loyal to eachother. They will never forgive a wrong till its righted. Oft weilding mighty war-axes they cleave through lesser armed foes with haunting ease.#!"
 
 grey_guard: "Grey Guardsmen"
 grey_guard_flavor: "Comprised of a mix of lesser Nobility and lowborn warriors, these holy guardians are well experienced in fighting the horrors of the foglands, having long held the Grey Gates.#!"
 
 waymakers: "Waymakers of Velos"
 waymakers_flavor: "Comprised of the most devout and mighty warriors of the Sjalvolki, these holy guardians are very well experienced in the ways of war, having aided in countless migrants find new homelands along the Shattered-Coast.#!"
 
 radivolki_knights: "Radivolki Knights"
 radivolki_knights_flavor: "The pride of the Radivolki Armies. These were the first proper knights of the Sjalvolki people's, hailing from the settlers of Western Etepezea and the Eastern Imperial Isle. They are a symbol of their folks supposed superiority over their fellow migrants.#!"
 
 radivolki_warriors: "Radivolki Warriors"
 radivolki_warriors_flavor: "The infantry of the Radivolki are the best armed and armored soldiers of all the post-migration armies. Despite their greater access to heavy armor and mastercraft weapons, they are oft seen as softer by the other Sjalvolki due to their comfortable new homelands.#!"

 dragon_knights: "Dragon Knights"
 dragon_knights_flavor: "The pride of the Drakelander Armies. The Dragon Knights are a valiant order employed by the Drakelanders and their descendants. Trained from birth and equiped with the finest arms and armor. These glorious Heirs of the Dragonriders are to be feared across all lands.#!"

 drakewarriors: "Drakeland Warriors"
 drakewarriors_flavor: "The Empire long dead, the surviving Aversarians of Etepezea developed a strong love for their more ancient legacy, that of the Dragon. These Drakelanders, armed with mighty draconic armor and master-craft blades, pose a dire threat to any foe-pikemen.#!"

 drakeguard: "Drakeland Guard"
 drakeguard_flavor: "The Empire long dead, the surviving Aversarians of Etepezea developed a strong love for their more ancient legacy, that of the Dragon. These Drakelanders, armed with mighty draconic armor and master-craft polearms, pose a dire threat to any foe-cavalry.#!"

 oejeynican_graveguard: "Oejeynican Graveguards"
 oejeynican_graveguard_flavor: "The Oejeynican Graveguards started originally as one of many Holy Orders dedicated to patrolling and maintaining graveyards and barrows. Then slowly developed into a more secular fighting force. Still though they retain their ancestral purpose at heart. To fight for the living.#!"

 gisreddeport_voulgiers: "Gisreddeport Voulgiers"
 gisreddeport_voulgiers_flavor: "The peoples of the great city of Gisreddeport are no strangers to war, especially with their 'Grande' sister city, and their wealthy knights. These commoners and migrants will fight to the bitter end for their Republic.#!"

 salisian_sergeants: "Salisian Sergeants"
 salisian_sergeants_flavor: "These non-noble soldiers are armored and armed by the mighty forge-industry of the Salisians. Often better equipped than most nobles of other cultures. These Sergeants are an early adoption of the eventually full-plate infantry that would someday become common across the Shattered-Coast.#!"

 dielecender_sergeants: "Dielec Sergeants"
 dielecender_sergeants_flavor: "These soldiers are the heart of Dielec. Experienced in their forests and marshes, and comprised of both noble and lowborn warriors. These Sergeants arent as well armed or armored as their Salisian counterparts, yet their more humble attire does little to blunt their prowess.#!"

 trustian_watchmen: "Watchmen"
 trustian_watchmen_flavor: "These warriors have long held the watch over the Trustian lands, born from a need to keep constant vigilance over the Deadlands, these guardsmen are ready to form a resistance to any invading foe.#!"

 carsavisian_battlebrothers: "Battle-Brothers"
 carsavisian_battlebrothers_flavor: "These noble warriors are the guardians of all Carsavisian lands, the Brotherhood is a concept of deep and unbreakable bond between two (typically noble) Carsavisian warriors, from which a larger formation is made, these Battle-Brothers eat, sleep, train, hunt, and of course fight together.#!"
 
 rivarisian_longbows: "Rivarbowmen"
 rivarisian_longbows_flavor: "These archers hail from all levels of Rivarisian society, trained from birth in the Rivarbow, and very experienced in guerilla warfare. They will use their range and power to drive out any over-welcome guest or would-be conqueror.#!"

 rivarmen: "Rivarmen Infanterie"
 rivarmen_flavor: "These fighters hail from lowborn Rivarisians, trained in fighting the massed pikemen and heavily armored infantry formations of the south, and very experienced in guerilla warfare. Hated across Chevalie for their lack of 'honor' yet ever-loved by their folk who they fight to protect.#!"

 ibraonic_guard: "Ibraonic Sea-Guardsmen"
 ibraonic_guard_flavor: "Comprised of a mix of lesser Nobility and Holy Knights sworn to the Seaguard, these marcher warriors are well experienced in fighting the undead of the far-north, having led the charge in colonizing the forsaken lands.#!"
 
 conclave_spears: "Conclave Spearmen"
 conclave_spears_flavor: "Comprised of a mix of Nobility and lowborn Holy Knights, sworn to the Lifepath, these marcher warriors are better known in Chevalie as the 'Way-Master Guard' for they stand guard to the most sacred Conclave den Raocourt, and historically have acted as the Master of Ways personal army.#!"

 deadlands_crusaders: "Deadlands Crusaders"
 deadlands_crusaders_flavor: "From elite Knights of the Way, to commoner men at arms, the Deadlands Crusader Orders are all brought together for one singular purpose, to defend the world of the living from the tyranny of undeath. No price is too steep to protect Life itself.#!"

 silver_knights: "Knights of the Silver Garter"
 silver_knights_flavor: "Spurring hard with lances couched, these reckless Conrois horsemen of the Silver Garter are fearsome, eager to snatch victory through shock and terror. And experienced in the heat and land of Sarradon. These infamous riders would make their name through their adventure and conquest across Sarradon.#!"
 
 voyagen_conrois: "Conrois"
 voyagen_conrois_flavor: "Spurring hard with lances couched, these reckless Voyagen horsemen plunge into any weakness to be found in enemy formations, eager to snatch victory through shock and terror. These infamous riders would make their name through their relentless hunger and drive for adventure and conquest.#!"
 
 gallien_knights: "Knights of Gallien"
 gallien_knights_flavor: "Knights of Gallien unlike most Marcher Knights are loyal not to a particular ruler but to the Gallien people directly. Hailing from lowborn and noble Gallien households, they dont ride on horesback, instead fighting on foot as keepers of their mountains.#!"

 calmenson_knights: "Calmenson Knights"
 calmenson_knights_flavor: "This Knightly Order was formed by loyal warriors and House Guards of the House of Calmenson. As time continued the order grew wealthy and loyalty shifted away from the House from which they take their name, and more towards the Orders Fortress itself.#!"

 komhp: "Knights of Most Holy Principles"
 komhp_flavor: "Knights of Most Holy Principles are Knights of the Way, and other Marcher Knights, drawn from across the Continent's most devout Orders, loyal to the Grandmaster of the United Orders. Hailing from the most pious and skilled knights across all Chevalie and beyond, these Knights are a grade above the rest, they ride as Guardians for all the living.#!"

 knights_gisredde: "Knights of Gisredde"
 knights_gisredde_flavor: "Knights of Gisredde are Marcher Knights who are loyal to the ruler of the Gisredde. Mostly hailing from noble or wealthy merchant households, they ride as Gisredde's Guardians.#!"

 knights_bastione: "Knights of Bastione"
 knights_bastione_flavor: "Knights of Bastione are Marcher Knights who are loyal to the ruler of the Porte den la Bastione. Mostly hailing from noble households, they ride as Chevalie's Far-Western Guardians.#!"

 knights_perignan: "Knights of Perignan"
 knights_perignan_flavor: "Knights of Perignan are Marcher knights who are loyal to the ruler of Perignan. Mostly hailing from noble households, they ride as Chevalie's Mid-Western Guardians.#!"

 knights_dielec: "Knights of Dielec"
 knights_dielec_flavor: "Knights of Dielec are Marcher knights who are loyal to the ruler of Dielec. Mostly hailing from the various nobles and ambitious adventerurs of Dielec's unique culture.#!"

 knights_varrdevet: "Knights of Varrdevet"
 knights_varrdevet_flavor: "Knights of Varrdevet are Marcher knights who are loyal to the ruler of Varrdevet. Mostly hailing from noble households, they ride as Chevalie's Central Guardians.#!"

 knights_rohr: "Knights of Rohr"
 knights_rohr_flavor: "Knights of Rohr are Marcher knights who are loyal to the ruler of Rohr. Mostly hailing from noble households, they ride as Chevalie's North-Eastern Guardians.#!"

 knights_marroux: "Knights of Marroux"
 knights_marroux_flavor: "Knights of Marroux are Marcher knights who are loyal to the ruler of Marroux. Mostly hailing from noble households, they ride as Chevalie's South-Eastern Guardians.#!"

 karzarad_vitkaz: "Kakarat Vitkazi"
 karzarad_vitkaz_flavor: "Kakarat Vitkazi are Karzarad knights who are devout followers of the Kakarataki Faith. Flying banners of cultural heros and saints of the Karzarad people as they charge. These wintery warriors are especially baneful towards the undead and beasts.#!"

 muhkaikarib: "Muhkaikarib"
 muhkaikarib_flavor: "These 'Warspearmen' have fought for control of their homelands for centuries. Often forming the core of Marmaladid armies, or employed by wealthy clans and merchants. Their deep military tradition holds true to this day.#!"

 dezhun_battlemasters: "Dezhun Battlemasters"
 dezhun_battlemasters_flavor: "These Magi have acted as enforcers and lawkeepers since time immemorial. Often forming the core of Dezhunic armies, or guarding ancient Sun Temples. Their deep military and magical tradition holds true to this day.#!"

 scholarii: "Scholarii"
 scholarii_flavor: "The pride of the Eastern Aversarians. The Scholarii are elite bodyguards and shock cavalry of the eastern legions. Renowned for their loyalty, they have played a key role in holding off Oltenic expansion.#!"

 varangonoi: "Varángōnoi"
 varangonoi_flavor: "The defeat at Ten-Trees made it clear many of the barbarian berserkers of the north possess a fighting spirit and ferocity in combat that is hard to match. These mighty northmen, armed and armored by our own smiths, will be perfect as shock troop attachments for our legionaires.#!"

 pelekyphoroi: "Pelekyphóroi"
 pelekyphoroi_flavor: "The defeat at Elysia made it clear that the invading barbarian berserkers possess a fighting spirit and ferocity in combat that is hard to match. These mighty warriors, armed and heavily armored by our own smiths, will be perfect as shock troop attachments for our legionaires.#!"

 citizen_guardsmen: "Politofýlakes"
 citizen_guardsmen_flavor: "[Concept('aversaria','Aversaria')|E] has fallen. The old Empire destroyed, yet hope is not lost, for from the ashes of dead Aautorkrata come the 'Citizen Guard'. Loyal to the now enriched islanders who had once been a backwater to the Second Empire, now they seek to reclaim their older legacy of mighty and rich Isle-Polis.#!"

 kontophoros: "Kontophóros"
 kontophoros_flavor: "The threat of horselords and their hordes has called for the reformation of dedicated anti-cavalry spearmen formations. These reformed 'Pike-Bearer' infantry would soon be considered a core aspect of Eastern Aversarian armies.#!"

 drakarstataroxoi: "Drakarstataroxoi"
 drakarstataroxoi_flavor: "The pride of the Imperial Army. The Dragon Riders are the knights of Aversaria. Trained from birth and equiped with the finest arms and armor. These valiant guardians of the Empire are to be feared across all our lands.#!"

 voreidrakarstataroxoi: "Vóreidrakarstataroxoi"
 voreidrakarstataroxoi_flavor: "Years of warfare and survival in the Imperial Colonies have forged these knights into a force to be feared. Tested against both Marcher and Barbarian foes. The Northern Dragon Riders will bring us triumph.#!"

 riverwatch_legion: "Riverwatch Legionaires"
 riverwatch_legion_flavor: "Once comprised of legionaires of the Legio LXXIV 'Riverwards'. Now they renounce their old heritage, caring little for Imperial Dreams, or Legion Legacy. Rich and greed-bound off their dubious taxations, they flaunt their wealth gained through gilded plating. Still they are very capable warriors, if only so they may continue to tax all the river-traffic they can.#!"

 aversarian_legionaires: "New-Age Legionaries"
 aversarian_legionaires_flavor: "The Second Empire is dead, any hopes of its return now lost, and yet [Concept('aversaria','Aversaria')|E], and dreams of a Third Empire of Humankind, lives. While the the legionaires of old have been buried along with the Second Empire, their descendents still arm themselves and name themselves as they once had before.#!"

 aversarian_legion: "Imperial State Legionaires"
 aversarian_legion_flavor: "The State Legions of the Aversarian Aautokratirs are feared across the world. Known for their elite training and unbreakable will. These dreadful warriors are the incarnate fist and spear of the Empire. The very manifestation of the Aautokratirs power and Aversarias dominance.#!"

 mayikprolollan_legion: "Mayikrata State Legionaires"
 mayikprolollan_legion_flavor: "The Old Imperial Legions are dust, and the various Arcane Auxiliaries are scattered across the corpse of Aversaria. In this dire hour, a new Legion must rise. Warriors of elite training and discipline, with deep knowledge and mastery of Arcane magic and sorcerery. Bring forth the Arcane Legions!#!"

 oraispol_legion: "Oraispol State Legionaires"
 oraispol_legion_flavor: "The State Legions of the Asiupoli Aautokratirs. Known for their elite training and unbreakable will. These particular Legionaires hail from the Oraispol Aautokrata. Heirs of the original empire, guardians of the heartlands, and loyal warriors of the rightful Aautokratir!#!"

 asiupoli_legion: "Asiupoli State Legionaires"
 asiupoli_legion_flavor: "The State Legions of the Asiupoli Aautokratirs Known for their elite training and unbreakable will. These particular Legionaires hail from the Asiupoli Aautokrata. Heirs of the original empire, guardians of the eastern steppelands, and loyal warriors of the rightful Aautokratir!#!"

 anastereias_legion: "Anastereias State Legionaires"
 anastereias_legion_flavor: "The State Legions of the Anastereias Aautokratirs Known for their elite training and unbreakable will. These particular Legionaires hail from the Anastereias Aautokrata. Heirs of the original empire, guardians of the far-eastern riverlands, and loyal warriors of the rightful Aautokratir!#!"

 stellios_legion: "Stellios State Legionaires"
 stellios_legion_flavor: "The State Legions of the Stellios Aautokratirs. Known for their elite training and unbreakable will. These particular Legionaires are experienced in naval and islander warfare. Heirs of the original empire, guardians of the southern isles, and loyal warriors of the rightful Aautokratir!#!"

 voreias_legion: "Voreias State Legionaires"
 voreias_legion_flavor: "The State Legions of the Voreias Aautokratirs. Known for their elite training and unbreakable will. These particular Legionaires are experienced in harsh winter and mountain warfare. Heirs of the original empire, sons of the northern frontier, and loyal warriors of the rightful Aautokratir!#!"

 aironoi_legion: "Aironoi Governorial Legionaires"
 aironoi_legion_flavor: "The Governorial Legions of the Aironoi Governors East take pride in their Eastern ancestry, feared for their anti-cavalry tactics. To share blood with non-Aversarian peoples is common amongst these formations.#!"

 oreikalos_legion: "Oreikalos Governorial Legionaires"
 oreikalos_legion_flavor: "The Governorial Legions of the Oreikalos Governors take pride in their faith in Aautokratir-Legon Aeschraes, feared for their merciless tactics. To share blood with non-Aversarian peoples is unthinkable amongst these formations.#!"

 mikros_legion: "Mikrosi Governorial Legionaires"
 mikros_legion_flavor: "The Governorial Legions of the Northern Kalathipsomi Governors take pride in their Northern ancestry, feared for their prowess in woodland combat. To share blood with the invaders who brought Aversaria low is not seen as shameful in these cohorts.#!"

 malcois_legion: "Malcois Governorial Legionaires"
 malcois_legion_flavor: "The Governorial Legions of the Malcois Governors take pride in their Raider and Iyrossi ancestries, feared for their prowess in hit-and-run tactics. To share blood with the once enslaved Iyrossi is not seen as shameful in these cohorts.#!"

 megos_legion: "Megosi Governorial Legionaires"
 megos_legion_flavor: "The Governorial Legions of the Southern Kalathipsomi Governors take pride in their Northern ancestry, known for fielding larger formations compared to the other Governorates. The vast farmlands of their province allow for larger cohorts.#!"

 etepezea_legion: "Etepezean Governorial Legionaires"
 etepezea_legion_flavor: " The Governorial Legions of the Etepezean Governors take pride in their Imperial and Draconic ancestry, feared for their prowess in hillside combat. To share blood with the Old Empire is important to these cohorts.#!"

 iron_legion: "Iron Spine Governorial Legionaires"
 iron_legion_flavor: " The Governorial Legions of the Iron Spine Governors take pride in their new and unique sub-culture, feared for their prowess in mountain combat. The brutality and glory of the frontiers call to these cohorts.#!"

 veil_legion: "Whisper Veil Governorial Legionaires"
 veil_legion_flavor: "The Governorial Legions of the Whisper Veil Governors take pride in their new and unique sub-culture, feared for their prowess in mountain combat. The brutality and glory of the frontiers call to these cohorts.#!"

 isles_legion: "Tower-Isles Governorial Legionaires"
 isles_legion_flavor: "The Governorial Legions of the Tower-Isles Governors take pride in their mixed ancestry, feared for their prowess in naval combat. Ones blood is of little to no importance to these marine cohorts.#!"

 opakhasia_legion: "Opakhasian Governorial Legionaires"
 opakhasia_legion_flavor: "The Governorial Legions of the Opakhasian Governors take pride in their Southern ancestry, feared for their use of pikes. To share blood of the Mountain-Sun is important to these cohorts.#!"

 legio_ii_proudest: "Legio II 'Proudest' Legionaires"
 legio_ii_proudest_flavor: "The Second Legion 'Proudest', had long stood as a jewel of the Aversarian Army, disbanded by the foul Kresox, now reformed and rearmed once more. These men and women are expected to look their very best, as they are the new standard for a proper legion.#!"

 legio_iii_malcois: "Legio III 'Bladebreakers' Legionaires"
 legio_iii_malcois_flavor: "The Third Legion 'Malcois', was never a legion of great renown, originally formed as a Noble Legion of Malcois. Only remembered by a few scholars for their part in the Seige of Orthonix during the Agionist Rebellions. Now reformed as guards of the Governate of Malcois.#!"

 legio_iv_elenos: "Legio IV 'Elenos' Legionaires"
 legio_iv_elenos_flavor: "The Fourth Legion 'Elenos', survived the collapse of the Second Empire. Experienced in warfare with the Iyrossi and their hit-and-run tactics, the men of the Fourth will follow their Legon into either reform or glorious death in battle.#!"

 legio_v_golems_fury: "Legio V 'Golem's Fury' Legionaires"
 legio_v_golems_fury_flavor: "The Fifth Legion 'Golem's Fury', are a force once, and now again, feared. Formed originally as a Noble Legion of Etepezea. Remembered for their major triumph at the Humbling of the Martyrs. They now stand again as a monument to Etepezeas revival. Let all fear the Golem's Fury!#!"

 legio_vi_manherders: "Legio VI 'Manherders' Legionaires"
 legio_vi_manherders_flavor: "The Sixth Legion 'Manherders', have oft been a scourge for the Iyrossi, formed originally as a Noble Legion of Malcois remembered for their fall during the Seige of Orthonix but also as brutal legion raiders. They stand reformed to ever keep a boot on any troublesome natives of Malcois.#!"

 legio_vii_parataros: "Legio VII 'Parataros' Legionaires"
 legio_vii_parataros_flavor: "The Seventh Legion 'Parataros', has survived the collapse of the Second Empire. Formed originally from what remained of the State Legion VII 'Valor'. Having lost near all their veterans at the hands of the Sjalvolki. Now they follow their Legon either into reform or inevitable doom.#!"

 legio_vii_anthiope: "Legio VII 'Anthiope' Legionaires"
 legio_vii_anthiope_flavor: "The Seventh Legion 'Anthiope', were a State Legion of Malcois and Katraddia, semi-legendary for their smashing of the last organized Kartharaddi army. Lost to the chaos and fog of the 13th century. Now reformed as valiant guardians of a reclaimed Katraddia.#!"

 legio_viii_enortax: "Legio VIII 'Enortax' Legionaires"
 legio_viii_enortax_flavor: ".#!"

 legio_viii_tomanyros: "Legio VIII 'Tomanyros' Legionaires"
 legio_viii_tomanyros_flavor: ".#!"

 legio_ix_purety: "Legio IX 'Purety' Legionaires"

 legio_x_bravest: "Legio X 'Bravest' Legionaires"
 legio_x_bravest_flavor: ".#!"

 legio_xi_silverwind: "Legio XI 'Silverwind' Legionaires"
 legio_xi_silverwind_flavor: ".#!"

 legio_xii_sea_walkers: "Legio XII 'Sea-Walkers' Legionaires"
 legio_xii_sea_walkers_flavor: ".#!"

 legio_xiii_aautosaxias: "Legio XIII 'Aautosaxias' Legionaires"
 legio_xiii_aautosaxias_flavor: ".#!"

 legio_xiv_chainforgers: "Legio XIV 'Chain-Forgers' Legionaires"
 legio_xiv_chainforgers_flavor: ".#!"

 legio_xv: "Legio XV 'Loyal' Legionaires"

 legio_xvi: "Legio XVI 'Dragonsworn' Legionaires"

 legio_xvii_stereon: "Legio XVII 'Stereon' Legionaires"
 legio_xvii_stereon_flavor: "The Seventeenth Legion 'Stereon', founded in the ashes of vile Kresox's betrayal of the original Seventeenth, formed originally as a State Legion of Opakhasia. Now facing a dire situation. Now they follow their Legon to reform and restoration of Legion might, or doomed to a hopeless last stand against the hordes.#!"

 legio_xviii_philantros: "Legio XVIII 'Philantros' Legionaires"
 legio_xviii_philantros_flavor: ".#!"

 legio_xix_mavia: "Legio XIX 'Mavia' Legionaires"
 legio_xix_mavia_flavor: ".#!"

 legio_xx_conclaves_own: "Legio XX 'Conclave's Own' Legionaires"
 legio_xx_conclaves_own_flavor: ".#!"

 legio_xxi_axiaothea: "Legio XXI Axiaothea Legionaires"
 legio_xxi_axiaothea_flavor: "The Twenty-First Legion 'Axiaothea', were once the most elite of the enitre empire, formed originally as a State Legion of Etepezea, with the legion itself taking the reigning Aautokratirs name. These Twenty-First legionaires are named after Axiaothea. The, now dead, rightful ruler of the Second Empire.#!"

 legio_xxi_heartrenders: "Legio XXI 'Heartrenders' Legionaires"
 legio_xxi_heartrenders_flavor: ".#!"

 legio_xxi_veracity: "Legio XXI 'Veracity' Legionaires"
 legio_xxi_veracity_flavor: ".#!"

 legio_xxii_resplendent: "Legio XXII 'Resplendent' Legionaires"
 legio_xxii_resplendent_flavor: ".#!"

 legio_xxiii_greenfingers: "Legio XXIII 'Greenfingers' Legionaires"
 legio_xxiii_greenfingers_flavor: ".#!"

 legio_xxxiv_heartfire: "Legio XXIV 'Heartfire' Legionaires"
 legio_xxxiv_heartfire_flavor: ".#!"

 legio_xxv_flamestriders: "Legio XXV 'Flamestriders' Legionaires"
 legio_xxv_flamestriders_flavor: ".#!"

 legio_xxvi_exodian: "Legio XXVI 'Exodian' Legionaires"
 legio_xxvi_exodian_flavor: "The Twenty-Sixth Legion 'Exodian', were born in doom and chaos, formed originally as a State Legion of Katraddia. As the fog devoured all life across Katraddia, the Exodians took up the unsung task of ferrying survivors to the west. These are grim soldiers who have seen pure horror and lived to tell of it, so far.#!"

 legio_xxviii_the_invincibles: "Legio XXVIII 'The Invincibles' Legionaires"
 legio_xxviii_the_invincibles_flavor: ".#!"

 legio_xxxiii_blackeyes: "Legio XXXIII 'Black-Eyes' Legionaires"
 legio_xxxiii_blackeyes_flavor: ".#!"

 legio_xxxv_diyotesmaxos: "Legio XXXV 'Diyotesmaxos' Legionaires"
 legio_xxxv_diyotesmaxos_flavor: ".#!"

 legio_xxxviii_vigilant: "Legio XXXVIII 'Vigilant' Legionaires"
 legio_xxxviii_vigilant_flavor: ".#!"

 legio_xxxviii_winters_wolves: "Legio XXXVIII 'Winter's Wolves' Legionaires"
 legio_xxxviii_winters_wolves_flavor: ".#!"

 legio_xxxix_protemaxos: "Legio XXXIX 'Protëmaxos' Legionaires"
 legio_xxxix_protemaxos_flavor: ".#!"

 legio_xlii_pride_of_aversaria: "Legio XLII 'Pride of Aversaria' Legionaires"
 legio_xlii_pride_of_aversaria_flavor: ".#!"

 legio_xliii_firstborn: "Legio XLIII 'Firstborn' Legionaires"
 legio_xliii_firstborn_flavor: ".#!"

 legio_xliv_stalwart: "Legio XLIV 'Stalwart' Legionaires"
 legio_xliv_stalwart_flavor: ".#!"

 legio_xliv_kartharaddis_fear: "Legio XLIV 'The Kartharaddi's Fear' Legionaires"
 legio_xliv_kartharaddis_fear_flavor: ".#!"

 legio_xlv_silverbloods: "Legio XLV 'Silverbloods' Legionaires"
 legio_xlv_silverbloods_flavor: ".#!"

 legio_xlix_starward: "Legio XLIX 'Starward' Legionaires"
 legio_xlix_starward_flavor: ".#!"

 legio_li_riverfiends: "Legio LI 'River-Fiends' Legionaires"
 legio_li_riverfiends_flavor: ".#!"

 legio_lii_redrock_guard: "Legio LII 'Redrock Guard' Legionaires"
 legio_lii_redrock_guard_flavor: "The Fifty-Second Legion 'Redrock Guard', face seemingly hopeless odds, formed originally as a Noble Legion of the Redlands. Surrounded by horrors, traitors, and barbarians that all seek their destruction, the Redrock Guard must summon impossible strength, if they are survive this darkest hour.#!"

