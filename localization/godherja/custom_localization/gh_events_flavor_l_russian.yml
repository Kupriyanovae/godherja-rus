 fieldsofpearlsbadspelltext1:0 "Крики [Concept('magi','магов')|E], которым я поручил возглавить ритуал, и их помощников стали первым знаком того, что всё пошло наперекосяк. Я с ужасом наблюдаю, как один юноша отрывается от вычерчивания руны на полу и начинает корчиться в агонии. Его панические вопли сначала переходят в хриплое сопение, а затем сменяются каменным безмолвием, пока я созерцаю, как его лицо рассыпается в маслянистое, похожее на пепел вещество."
 fieldsofpearlsbadspelltext2:0 "Оборвавшийся на полуслове голос [Concept('magi','мага')|E], возглавлявшего ритуал, стал первой зацепкой, указавшей на беду. Вскинув взгляд, я замечаю, что он исчез, оставив после себя лишь едкий дым. Все замирают в оцепенении на несколько долгих секунд, прежде чем без всякого предупреждения испаряется один из помощников. Начинается паника — ученики один за другим исчезают без предупреждения, звука или взрыва."
 fieldsofpearlsbadspelltext3:0 "Внезапная опасность становится очевидной мгновенно: один из учеников, наносивших масла на холст, замирает с мученическим выражением лица и секунду спустя с грохотом взрывается, заливая комнату кровью. Мы все застываем на мгновение, страх вспыхивает в дюжине пар глаз. Ритуал дарует нам лишь несколько секунд передышки, после чего один из моих слуг, таскавший реагенты из кладовых, ахает и следует за ним, забрызгивая всех кровью и кусками плоти."
 pale_skin_black_feathers:0 "Её тело покрыто глубоким чёрным переливчатым оперением, а лицо поражает мертвенно-бледной кожей с тонкими губами и глазами глубочайшего зелёного цвета."
 dark_skin_scaled:0 "У неё тёмная кожа, а тело покрыто чешуёй, отливающей опаловым блеском. Несмотря на смертельную опасность, которую представляет одно её появление, я вынужден признать: она — одно из прекраснейших созданий, что я когда-либо видел."
 feathered_wimple:0 "Её тело покрыто перьями чистейшего белого цвета, сияющими на солнце словно безупречный алебастр. Лицо у неё умеренно-смуглое, обёрнутое массивным шёлковым головным убором."
 fire_blast_shahmaran:0 "Меня швыряет на землю, когда сам воздух вокруг воспламеняется, без разбора убивая и почитателей-ритуалистов, и охотников. Обгоревшие и тяжело раненные, уцелевшие бойцы из моей охотничьей группы уволакивают меня прочь с поля боя."
 vacuum_implosion_shahmaran:0 "Сама атмосфера пошла рябью вокруг разбегающихся бойцов. Воинов внезапно отрывает от земли и швыряет в воздух, неистово закручивая в замешательстве и агонии. С громовым раскатом те, кто оказался слишком близко к эпицентру, разрываются на жидкое месиво. Меня осыпает яростным градом из костей, плоти и камней оттуда, где её заклинание раскололо саму землю, и я чувствую острую боль — надеюсь, это всего лишь острый обломок скалы вонзился мне в бок."
 screaming_ghosts_shahmaran:0 "Кажется, будто сам Эрас источает сероватый туман, который колышется так, словно обладает собственным разумом. Части дымки начинают отделяться, принимая формы, в которых почти угадываются человеческие очертания, если не считать их когтистых придатков. С мученическим воплем они набрасываются на комбатантов, пока и охотники, и ритуалисты пытаются спастись бегством. Одно из существ устремляется прямо ко мне, полосуя когтями моё лицо и тело. Я спотыкаюсь, падаю назад и бегу, пытаясь спастись, пока боль от ран окончательно не лишила меня сил."
 
 