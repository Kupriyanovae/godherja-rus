l_russian:
 unique_poi_vounill_desc:0 "Великая фигура во Вуниле возвышается настолько гордо и величественно, что моряки могут различать её силуэт на пути к Тинитиде, а целые города живут в её тени. Она поистине чудесна даже в своём разрушенном состоянии, а кое-что в её очертаниях кажется смутно знакомым и... утешительным?"
 unique_poi_towerwatch_desc:0 "Местные телескопы огромны: десятки бронзовых труб выглядывают из исполинских башен, куполов и склонов холмов. Местные послушники любезно позволяют вам взглянуть в одну из них на [Concept('sea_tower','Морскую башню')|E] — это зрелище захватывает дух своим неестественным великолепием."
