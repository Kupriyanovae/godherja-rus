 absurdly_thick:0 "почти абсурдной толщиной, делающей подкопы или прорыв грубой силой совершенно невыполнимой задачей для любого осаждающего"
 extremely_tall:0 "небывалой высотой, что делает их практически неуязвимыми для осадных лестниц и башен"
 magically_reinforced:0 "магическими чарами и укреплениями, делающими их особенно невосприимчивыми к тайным штурмам"
 double_wall:0 "двойной природой: нападающие, которым удаётся взобраться на внешнюю стену, обнаруживают перед собой ещё более величественную внутреннюю стену"