l_russian:
 old_walls_of_oraispol_name:0 "Старые стены Ораисполя"
 old_walls_of_oraispol_desc:0 "«Старые стены» — это череда ныне почти устаревших или вовсе разрушенных стен и оборонительных сооружений, что прорезают историческое сердце Ораисполя, а некоторые из них датируются ещё эпохой полисов. Возводимые, разрушаемые, перестраиваемые и изменяемые бесчисленное количество раз на протяжении истории города, эти стены в конечном счёте были признаны совершенно непригодными для защиты столицы [Concept('aversaria','Аверсарии')|E] Эрамом в VIII веке — особенно если учесть, что к тому времени они защищали лишь древнее ядро города, радикально разросшегося в предыдущие столетия, — и были заменены собственным амбициозным проектом аавтократира.\n\nВ наши дни большая часть старого комплекса используется либо в качестве конструктивной основы для жилых домов, складов и постоялых дворов городской стражи, либо как пристанище для бродяг, однако в чрезвычайной ситуации они теоретически всё ещё могут послужить последней линией обороны в особенно отчаянных ситуациях — хотя толку от этого будет немного."

 eramasic_walls_name:0 "Эрамовы стены"
 eramasic_walls_desc:0 "Названные в честь аавтократира VIII века, который первоначально отдал приказ об их возведении (но так и не дожил до его завершения), Эрамовы стены представляют собой череду величественных каменных стен, окружающих большую часть современного Ораисполя. В отличие от старых стен города, чьё строительство и реконструкция были хаотичным делом, растянувшимся более чем на тысячу лет, Эрамовы стены возводились с самого начала по амбициозному замыслу и с тех пор лишь изредка претерпевали коренные изменения.\n\nРасполагая многочисленными башнями и сильно укреплёнными вратами, эти стены были прорваны лишь считанные разы за всю свою историю, самым бесславным из которых стал момент, когда они получили необратимые повреждения во время бомбардировки города магией огня Эолом в пору [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E]."

 three_gates_of_oraispol_name:0 "Три сестры"
 three_gates_of_oraispol_desc:0 "Хотя в Эрамовых стенах насчитывается несколько десятков врат, три из них выделяются особо — Цветочные врата, Суровые врата и Вилнийские врата.\n\nТак называемые «Цветочные врата» (Пилос Антемос) — старейшие из трёх, возведённые ещё во время первоначального строительства самих стен; они названы так как за свой красочный и богато украшенный облик, так и за обычай убирать их цветами в весеннюю пору. Суровые врата, напротив, являют собой полную противоположность. Возведённые в правление аавтократира, который явно ценил практичность выше любой эстетики, эти врата часто описывают как неприступное, угловатое чудовище, являющееся одновременно и сильнейшим оплотом, и главным уродством всей оборонительной системы города.\n\nНаконец, Вилнийские врата наиболее примечательны тем, что служат самой оживлённой артерией всего города. Построенные специально для того, чтобы пропускать огромные потоки пеших и конных путников, но при этом сохранять оборонительные свойства, они также знамениты тем, что в 1229 году стали местом #E Вилнийского штурма#!."

 gh_walls_04_custom_loc_name:0 "Стены [ROOT.Var('walls_04_namesake_var').GetCharacter.GetFirstNamePossessiveNoTooltip]"
 gh_walls_04_custom_loc_desc:0 "Возведённые [ROOT.Var('walls_04_namesake_var').GetCharacter.GetTitledFirstName] в качестве венца городской обороны, массивные [ROOT.Var('walls_04_material').GetFlagName] стены графства [ROOT.GetProvince.GetCounty.GetName] являются, пожалуй, одними из самых впечатляющих во всём мире. В частности, они примечательны своей [ROOT.Var('walls_04_impressive_quirk').GetFlagName]."

 02_champion_grounds_custom_loc_desc:0 "Обитель воителей, или Протошлити, — это великая крепость, где XLII легион «Гордость Аверсарии» обучал самых выдающихся рекрутов [Concept('aversaria','аверсарианских')|E] государственных легионов. Те, кто прошёл выучку в Протошлити у его почитаемых наставников, со временем сами становились воителями, и истории многих легендарных героев Аверсарии в рядах легионов начинались именно в этих залах.\n\nПосле внушительного покровительства со стороны [ROOT.Var('02_champion_grounds_namesake_var').GetCharacter.GetTitledFirstName], Протошлити была восстановлена до того состояния, в каком она находилась до разрушения войсками аавтократа Эшрея. Обширные тренировочные поля были очищены от обломков, великая стена крепости отремонтирована и укреплена, а также возведено достаточно казарм, чтобы вместить до трёх легионов. Хотя XLII легион уже давно канул в историю, многие ветераны легионов остались, и обещания золота и отдыха достаточно, чтобы убедить их обучать новое поколение легионеров."
 
