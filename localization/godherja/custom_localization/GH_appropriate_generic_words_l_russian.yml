 GH_katief:0 "[Glossary( 'катиф', 'GH_KATIEF_GLOSS' )]"
 GH_KATIEF_GLOSS:0 "Разновидность саррадонских сладких пирожков, обычно с начинкой из сливок или различных видов орехов."
 GH_adiriyya:0 "[Glossary( 'адирийя', 'GH_ADIRIYYA_GLOSS' )]"
 GH_kalamypsi:0 "[Glossary( 'каламипси', 'GH_ADIRIYYA_GLOSS' )]"
 GH_ADIRIYYA_GLOSS:0 "Тонкая лепёшка с начинкой из мяса и овощей, приправленная специями, свёрнутая в рулет и нарезанная кружочками. Популярна как в саррадонской, так и в [Concept('aversaria','западно-аверсарианской')|E] кухне, где она известна как #EMP каламипси#!."
 GH_midinudi:0 "[Glossary( 'мидинуди', 'GH_MIDINUDI_GLOSS' )]"
 GH_MIDINUDI_GLOSS:0 "Сладкое обжаренное во фритюре лакомство, обычно имеющее форму колечка, пропитанного мёдом. Появилось в Каширии, но также стало невероятно популярным в Саррадоне после того, как торговцы завезли его на континент."
