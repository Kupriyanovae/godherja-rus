l_russian:
 #GetRegionalDrink
 GH_beer: "пиво"
 GH_sharbat: "шербет"
 GH_emdvash: "[Glossary( 'эмдваш', 'GH_EMDVASH_GLOSS' )]"
 GH_EMDVASH_GLOSS: "Освежающий саррадонский напиток из смеси мёда и уксуса."
 #GetLocalStreetFood
 GH_katief: "[Glossary( 'катиф', 'GH_KATIEF_GLOSS' )]"
 GH_KATIEF_GLOSS: "Разновидность саррадонских сладких пирожков, обычно с начинкой из сливок или различных видов орехов."
 GH_adiriyya: "[Glossary( 'адирийя', 'GH_ADIRIYYA_GLOSS' )]"
 GH_kalamypsi: "[Glossary( 'каламипси', 'GH_ADIRIYYA_GLOSS' )]"
 GH_ADIRIYYA_GLOSS: "Тонкая лепёшка с начинкой из мяса и овощей, приправленная специями, свёрнутая в рулет и нарезанная кружочками. Популярна как в саррадонской, так и в [Concept('aversaria','западно-аверсарианской')|E] кухне, где она известна как #EMP каламипси#!."
 GH_midinudi: "[Glossary( 'мидинуди', 'GH_MIDINUDI_GLOSS' )]"
 GH_MIDINUDI_GLOSS: "Сладкое обжаренное во фритюре лакомство, обычно имеющее форму колечка, пропитанного мёдом. Появилось в Каширии, но также стало невероятно популярным в Саррадоне после того, как торговцы завезли его на континент."
 GH_falafel: "фалафель"
