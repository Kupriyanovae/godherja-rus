 # GREAT PROJECTS #
 great_project_type_great_project_oasis: "Освоение оазиса"
 great_project_type_great_project_oasis_desc: "Этот недавно обнаруженный [Concept('sarradon_oasis','саррадонский оазис')|E] представляет собой редкую возможность для процветания в засушливых землях. Чтобы максимально использовать его потенциал, правители должны финансировать [Concept('great_project_contributions', 'вклады')|E] и координировать свои действия с другими [Concept('situation_participant_groups','группами участников')|E] для развития оазиса."
 great_project_type_great_project_oasis_contribution_irrigation_expansion: "Сеть каналов"
