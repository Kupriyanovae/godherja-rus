 # Season Names
 the_sarradonian_desert_situation_sand_blessed_bloom_season_situation_phase:0 "Пробуждение песков"
 the_sarradonian_desert_situation_sand_blessed_bloom_season_situation_phase_desc:0 "Пустынные пески охватывает цветение. Выносливая флора бурно разрастается, создавая мимолетные оазисы, поддерживающие как обычную, так и [Concept('magic','магическую')|E] жизнь."
  
 the_sarradonian_desert_situation_sand_scorching_zenith_season_situation_phase:0 "Ярость солнца"
 the_sarradonian_desert_situation_sand_scorching_zenith_season_situation_phase_desc:0 "Солнце палит с нечеловеческим, гнетущим зноем. Над песками колышутся миражи, а к металлу невозможно прикоснуться."
  
 the_sarradonian_desert_situation_sand_sand_scribe_season_situation_phase:0 "Шепчущие ветры"
 the_sarradonian_desert_situation_sand_sand_scribe_season_situation_phase_desc:0 "Неутихающие ветры изо дня в день меняют облик пустыни, обнажая древние тайны лишь для того, чтобы снова их погрести, и доносят шепот забытых знаний до тех, кто умеет слушать."
  
 the_sarradonian_desert_situation_sand_veil_thin_nights_season_situation_phase:0 "Эфирные ночи"
 the_sarradonian_desert_situation_sand_veil_thin_nights_season__situation_phasedesc:0 "Завеса между мирами истончается под холодной пустынной луной. Говорят, что [Glossary('духи','animal_type_spirit_encyclopedia_desc')] скитаются по пустыне во множестве, хотя кто знает, с чем можно столкнуться в глубоких песках."
  
 the_sarradonian_desert_situation_sand_sand_devil_season_situation_phase:0 "Вой"
 the_sarradonian_desert_situation_sand_sand_devil_season_situation_phase_desc:0 "Свирепые [Concept('magic','магические')|E] песчаные бури ревут над пустыней — проявление гнева великих [Glossary('духов','animal_type_spirit_encyclopedia_desc')] или дыхание спящих [Glossary('элементалей','animal_type_elemental_encyclopedia_desc')]. Путешествия смертельно опасны, и даже укрепленные поселения оказываются в осаде бурь."
  
 the_sarradonian_desert_situation_sand_celestial_stillness_season_situation_phase:0 "Звездный оазис"
 the_sarradonian_desert_situation_sand_celestial_stillness_season_situation_phase_desc:0 "Пустыня погружается в тишину, а ночное небо пылает созвездиями столь яркими, что они отбрасывают тени. Эта безмолвная тишь благоприятствует медитации, астрономии и могущественным ритуалам."

 situation_sand_blessed_bloom_season:0 "Пробуждение песков"
 situation_sand_blessed_bloom_season_desc:0 "Пустынные пески охватывает цветение. Выносливая флора бурно разрастается, создавая мимолетные оазисы, поддерживающие как обычную, так и [Concept('magic','магическую')|E] жизнь."
  
