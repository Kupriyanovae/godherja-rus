 great_project_type_great_project_oasis_contribution_garden_palace: "Райский сад"

 great_project_type_great_project_oasis_contribution_irrigation_expansion_desc: "Расширьте водные каналы оазиса, чтобы принести плодородие окружающим землям."
 great_project_type_great_project_oasis_contribution_trade_hub_desc: "Основать торговый пост, чтобы использовать оазис как стояночный пункт для караванов."
 great_project_type_great_project_oasis_contribution_garden_palace_desc: "Построить роскошный дворец с садами, чтобы продемонстрировать красоту оазиса и привлечь знать." 
 great_project_contribution_cost_innovation_seigneurialism: "#weak Улучшено благодаря $innovation_seigneurialism$:#!"
 tgp_oasis_irrigation_agricultural_boom_desc: "Расширение ирригации оазиса значительно увеличило урожайность и налоговые поступления."   
 tgp_oasis_irrigation_moderate_growth: "Рост ирригации оазиса"
 tgp_oasis_irrigation_moderate_growth_desc: "Развитие ирригационных каналов оазиса умеренно повысило производительность сельского хозяйства."   
 tgp_oasis_irrigation_popular_support: "Благодетель оазиса"
 tgp_oasis_irrigation_popular_support_desc: "Инвестиции этого персонажа в ирригацию оазиса снискали ему широкую благодарность местного населения."   
 tgp_oasis_trade_hub_entrepreneur: "Торговый магнат оазиса"
 tgp_oasis_trade_hub_entrepreneur_desc: "Создание торгового узла в оазисе принесло этому персонажу значительное богатство и престиж."   
 tgp_oasis_trade_hub_investment_returns: "Инвестиции в торговлю оазиса"
 tgp_oasis_trade_hub_investment_returns_desc: "Стратегические инвестиции в торговый узел оазиса приносят отличную прибыль и снижают затраты на строительство в других местах."   
 tgp_oasis_garden_prestige_development: "Строительство дворца-сада"
 tgp_oasis_garden_prestige_development_desc: "Строительство великолепного дворца с садом в оазисе способствует росту престижа и развитию региона."   
 tgp_oasis_garden_continuing_development: "Культурное развитие оазиса"
 tgp_oasis_garden_continuing_development_desc: "Завершенный дворец-сад продолжает привлекать ученых, художников и зодчих, ускоряя развитие региона."   
 tgp_oasis_garden_patron_of_arts: "Покровитель искусств в оазисе"
 tgp_oasis_garden_patron_of_arts_desc: "Покровительство этого персонажа искусствам в его дворце-саде оазиса повысило его культурный престиж и духовный авторитет."   
 # County Modifiers
 tgp_oasis_irrigation_county_modifier: "Ирригационная сеть оазиса"
 tgp_oasis_irrigation_county_modifier_desc: "Разветвленная ирригационная сеть направляет драгоценную воду оазиса на прилегающие земли, значительно повышая плодородие и развитие."   
 tgp_oasis_trade_county_modifier: "Торговый центр оазиса"
 tgp_oasis_trade_county_modifier_desc: "Этот оазис стал крупным торговым узлом, привлекающим купцов из дальних стран и укрепляющим местную экономику."   
 tgp_oasis_garden_county_modifier: "Райский сад"
 tgp_oasis_garden_county_modifier_desc: "Великолепный дворец-сад в оазисе стал центром культуры, просвещения и престижа для всего региона."   
 # Oasis Discovery Tiers
 tgp_oasis_discovery_fertility_1_county_modifier: "Малый оазис плодородия"
 tgp_oasis_discovery_fertility_1_county_modifier_desc: "Открытие небольшого оазиса принесло скромное, но долгожданное плодородие в этот засушливый край."   
 tgp_oasis_discovery_fertility_2_county_modifier: "Значительный оазис плодородия"
 tgp_oasis_discovery_fertility_2_county_modifier_desc: "рупный оазис обеспечивает надежный источник воды, существенно улучшая сельское хозяйство и условия для поселений."   
 tgp_oasis_discovery_fertility_3_county_modifier: "Великий оазис плодородия"
 tgp_oasis_discovery_fertility_3_county_modifier_desc: "Открытие великого оазиса преобразило регион, принеся изобилие воды, плодородие и процветание."   
 # Trade-off Modifiers
 tgp_oasis_development_labor_strain: "Нехватка рабочих рук из-за оазиса"
 tgp_oasis_development_labor_strain_desc: "Перенаправление рабочей силы на проекты освоения оазиса временно сократило доступные военные силы."   
 tgp_oasis_garden_construction_cost: "Расходы на постройку дворца-сада"
 tgp_oasis_garden_construction_cost_desc: "Пышное строительство дворца с садом в оазисе создает значительную нагрузку на казну."   
 # Innovation Synergies
 tgp_oasis_qanat_synergy: "Мастерство сооружения кяризов"
 tgp_oasis_qanat_synergy_desc: "Традиционные технологии строительства кяризов были мастерски применены при обустройстве оазиса, что значительно снизило затраты на строительство."   
 tgp_oasis_caravanserai_synergy: "Сеть караван-сараев"
 tgp_oasis_caravanserai_synergy_desc: "Интеграция с существующими сетями караван-сараев максимально раскрыла потенциал оазиса как торгового центра, принеся исключительное богатство."   
 tgp_oasis_persian_garden_synergy: "Традиция персидских садов"
 tgp_oasis_persian_garden_synergy_desc: "Применение древних принципов проектирования персидских садов позволило создать райский оазис исключительной красоты и духовного величия."   
 # Additional useful modifiers (if needed in scripts)
