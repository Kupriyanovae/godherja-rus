 ## EVENTS ##
 gh_oasis_event.0001.t: "Воды из глубин"
  gh_oasis_event.0001.desc: "Доходят известия, что пески пришли в движение. С каждым днем появляется все больше свежей грязи и молодой зелени. В наших землях почти наверняка формируется новый оазис."
  gh_oasis_event.0001.a: "Хвала богам, вода поднимается!"
  gh_oasis_event.0002.t: "Эфемерный оазис"
  gh_oasis_event.0002.desc: "Прошло достаточно времени, чтобы оазис расцвел. Пресная вода доступна в изобилии, и с каждым рассветом появляется все больше флоры и фауны. Вскоре вести разлетятся повсюду, и мы должны быть готовы к наплыву желающих."
  gh_oasis_event.0002.a: "Насладимся этим благословением, пока оно длится."
  gh_oasis_event.0003.t: "Возвращение к пескам"
  gh_oasis_event.0003.desc: "Красота оазиса не вечна.\n\nПески уже начали поглощать наш когда-то изобильный рай обратно в дюны. Дикие звери давно ушли, и скоро здесь не останется ничего, кроме сухой пустыни."
  gh_oasis_event.0003.a: "Со временем все возвращается в прах пустыни."
  gh_oasis_event.1001.t: "Побег скарабеев!"
  gh_oasis_event.1001.desc: "С тем, насколько разрослось наше стадо жуков, что-то подобное было лишь вопросом времени.\n\nЯ просто не ожидал[SelectCString(ROOT.Char.IsFemale, 'а', '' )], что это произойдет так скоро.\n\nЕдва рассвело, жуки умудрились пробить загоны и устроить хаос в нашем лагере. Если мы ничего не предпримем в ближайшее время, то рискуем потерять все стадо."
  gh_oasis_event.1001.a: "К оружию! Не дайте ни одному сбежать!"
  gh_oasis_event.1001.a.success: "Вам удается остановить панический побег"
  gh_oasis_event.1001.a.failure: "Вам не удается остановить панический побег"
  gh_oasis_event.1001.c.success: "Нанятым наемникам удается остановить побег"
  gh_oasis_event.1001.c.failure: "Нанятые наемники бросают попытки остановить побег"
  gh_oasis_event.1001.d.success: "Вам удается успокоить стадо с помощью [Concept('magic','магии')|E]"
  gh_oasis_event.1001.b: "Эх, пускай бегут, я слишком устал[SelectCString(ROOT.Char.IsFemale, 'а', '' )]."
  gh_oasis_event.1001.c: "Нам следует нанять несколько наемников, чтобы они вернули их."
  gh_oasis_event.1001.d: "Я знаю подходящее заклинание для этого!"
  gh_oasis_event.1011.t: "Скифы-реликвии под песком"
  gh_oasis_event.1011.desc: "Наши знатоки скифов доложили, что совсем рядом с нашим аханом глубоко под песками зарыты многочисленные древние реликвии, которые могут сослужить большую службу нашим [Concept('sand_skiffs','песчаным скифам')|E]. Потребуются огромные усилия, чтобы поднять их на поверхность, но выгода может стоить того."
  gh_oasis_event.1011.a: "Хорошо, наймите столько рабочих, сколько нужно."
  gh_oasis_event.1011.a.success: "Нанятые рабочие успешно извлекают детали скифа"
  gh_oasis_event.1011.a.failure: "Нанятые рабочие не справляются с извлечением деталей скифа"
  gh_oasis_event.1011.b.success: "Вам удается полностью восстановить скиф"
  gh_oasis_event.1011.b.partial: "Вам удается достать лишь часть деталей скифа"
  gh_oasis_event.1011.b.catastrophe: "Вам не удается спасти абсолютно ничего"
  gh_oasis_event.1011.b: "Мы должны вернуть все, что сможем!"
  gh_oasis_event.1011.c: "Нет, это обойдется слишком дорого."
  gh_oasis_event.1011.d: "Возможно, здесь поможет магия?"
  gh_oasis_event.1021.t: "Усовершенствование скифов"
  gh_oasis_event.1021.desc: "Наши знатоки скифов пришли ко мне с несколькими проектами, которые, по их мнению, помогут расширить и улучшить наши песчаные [Concept('sand_skiffs','песчаные скифы')|E]. Хотя каждый из них требует трат, полученные преимущества дадут нам шанс на нечто большее, чем просто выживание в этой [Glossary('суровой пустыне','sarradonian_desert_encyclopedia_desc')]."
  gh_oasis_event.1021.a: "Экономический подход предпочтительнее."
  gh_oasis_event.1021.b: "Военный подход подходят лучше всего."
  gh_oasis_event.1021.c: "Может быть, в другой раз."
  gh_oasis_event.1021.d: "Возможно, есть способ получше?"
  gh_oasis_event.1021.d.success: "Вы умело улучшаете скифы"
  gh_oasis_event.1021.d.failure: "Вам удается только испортить скифы"
  gh_oasis_event.1041.t: "Переполненные воды"
  gh_oasis_event.1041.desc: "Регион [Concept('sarradon_oasis','саррадонского оазиса')|E] неизменно привлекает людей со всех уголков пустыни, ищущих воду, свежую еду и отдых от беспощадных песков. На этот раз все так же, но наш участок оазиса слишком быстро заполнился путниками и чужаками. Припасы не вечны, воды иссякают быстрее обычного, и если ничего не предпринять, между укрывшимися в тени группами может вспыхнуть насилие."
  gh_oasis_event.1041.a: "Нам следует брать плату за вход."
  gh_oasis_event.1041.b: "Пусть приходят! Места хватит всем."
  gh_oasis_event.1041.c: "Больше никому нельзя входить. Убивайте каждого, кто ослушается приказа."
  gh_oasis_event.1041.d: "Неужели мы не сможем найти компромисс?"
  gh_oasis_event.1041.e: "Должна быть магия, способная поднять уровень воды."
  gh_oasis_event.1041.d.success: "#weak Вам удается поднять уровень воды в оазисе выше нормы#!"
  gh_oasis_event.1041.d.failure: "#weak Вам не удается поднять уровень воды, и эти земли погружаются в хаос#!"
  gh_oasis_event.1051.t: "Оазисный [attacked_county.Custom('GetAnimalType')|U]"
  gh_oasis_event.1051.desc: "Путники в [attacked_county.GetNameNoTierNoTooltip] за последние дни не раз замечали чудовищного [attacked_county.Custom('GetAnimalType')|U] у оазиса. Хотя [Concept('sarradon_oasis','саррадонский оазис')|E] привлекает много созданий, подобное чуловище наверняка отпугнет и людей, и более привычную дичь, способную прокормить наши лагеря."
  gh_oasis_event.1051.a: "Подобные тревоги не имеют значения."
  gh_oasis_event.1051.b: "Мы выставим дополнительную охрану у водопоев."
  gh_oasis_event.1061.t: "Продается: святая вода"
  gh_oasis_event.1061.desc: "Поступили сведения, что [SelectCString(good_merchant_template.IsFemale, 'одна торговка', 'один торговец' )] в [Concept('sarradon_oasis','оазисе')|E] продает «святую воду», которая якобы исцеляет от любых недугов и даже продлевает жизнь. [SelectCString(good_merchant_template.IsFemale, 'Торговка', 'Торговец' )] ([good_merchant_template.GetName]) предстал[SelectCString(good_merchant_template.IsFemale, 'а', '' )] передо мной по обвинению во лжи, но все еще заявляет о своей невиновности."
  gh_oasis_event.1061.a: "[good_merchant_template.GetSheHe|U] заплатит штраф."
  gh_oasis_event.1061.b: "За воровство [good_merchant_template.GetSheHe] расплатится своей рукой."
  gh_oasis_event.1061.c: "[good_merchant_template.GetSheHe|U] будет служить мне, пока я не решу иначе."
  gh_oasis_event.1061.d: "[good_merchant_template.GetSheHe|U] заплатит своей жизнью!"
  gh_oasis_event.1061.e: "Я покажу [good_merchant_template.GetHerHim] всю ошибочность [good_merchant_template.GetHerHis] пути."
  gh_oasis_event.1061.e.success: "#weak Вам удается убедить торговца в совершении преступления#!"
  gh_oasis_event.1061.e.failure: "#weak Торговцу удается выторговать себе свободу#!"
  gh_oasis_event.1061.f: "...Могу я купить один флакон?"


