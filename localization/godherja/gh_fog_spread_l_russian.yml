l_russian:
 gh_fog_spread_events.10.title:0 "[Concept('the_fog','Туман')|E] приближается"
 gh_fog_spread_events.10.desc:0 "Тьма сгущается на горизонте. Сначала были непрестанные кошмары, затем стали исчезать крестьяне, а теперь, когда поднимается зловещая дымка, отрицать очевидное больше нельзя — [Concept('the_fog','Туман')|E] подступает к нашим землям.\n\nХотя жизнь здесь все еще теплится, край уже начал страдать. И дворяне, и простой люд спешно собирают все пожитки и бегут в более благополучные края, пока упыреподобные обитатели [Concept('the_fog','Тумана')|E] сходят на незащищенных и безрассудных."
 gh_fog_spread_events.11.t:0 "Шепоты"
 gh_fog_spread_events.11.desc:0 "Почему я все еще здесь? Каждый крестьянин, у которого ума хотя бы наполовину больше, чем у курицы, уже ушел — здесь не осталось ничего, что могло бы заинтересовать кого-то, кроме безумцев! Неужели я безумен?\n\nЯ слышу это... эти твари. Они несут чушь, ложь, ЛОЖЬ, все они ЛГУТ.\n\nЭто адское стрекотание не выходит из головы даже во сне, но я не сплю, потому что оно всегда хочет, чтобы я Слушал стрекот но но оно хочет сказать стрекотстрекот правду Слушай правду стрекот но оно лжет а я хочу хочу правду да правду да да да дадада"
 gh_fog_spread_events.11.a:0 "нет нет НЕТ! Я ДОЛЖЕН ВЫБРАТЬСЯ ОТСЮДА!"
 gh_fog_spread_events.11.a.escape.tt:0 "Вы успешно спасаетесь!"
 gh_fog_spread_events.11.a.die.tt:0 "Вы погибаете от опасностей [Concept('the_fog','Тумана')|E]."
 gh_fog_spread_events.11.a.listen.tt:0 "Вы СЛУШАЕТЕ."
 gh_fog_spread_events.11.b:0 "ТЕПЕРЬ Я СЛЫШУ"
 gh_fog_spread_events.12.title:0 "Поглощенные [Concept('the_fog','Туманом')|E]"
 gh_fog_spread_events.12.desc:0 "Последняя колонна беженцев из одного из моих владений покинула [Concept('foglands','Отвергнутые земли')|E]. К этому моменту любой, кто еще остается там, либо мертв, либо осквернен, либо безумно храбр — и его тоже скоро ждет смерть или осквернение.\n\nХотя формально я все еще удерживаю эту провинцию, она полностью вышла из-под моего контроля и превратилась в адскую пустошь, подвластную мерзким отродьям, таящимся в [Concept('the_fog','Тумане')|E]."