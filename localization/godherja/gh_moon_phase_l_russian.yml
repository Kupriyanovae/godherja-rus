 game_concept_moon_phase:0 "Фаза луны"
 game_concept_moon_phase_desc:0 "[Concept('aervalr','Эрвал')|E] известен своими отчётливыми фазами, оказывающими сильное влияние на [Concept('magi','магов')|E]. Эти фазы варьируются от [Concept('new_moon','новолуния')|E] до [Concept('full_moon','полнолуния')|E] и обратно, хотя иногда случаются [Concept('special_phase','особые фазы')|E]."
 game_concept_special_phase:0 "Особая Фаза"
 game_concept_special_phase_desc:0 "Особые фазы — это уникальные и сверхъестественные фазы [Concept('aervalr','Эрвала')|E], которые могут иметь катастрофические последствия. Наиболее известной из них является Кровавая луна."

 game_concept_new_moon:0 "Новолуние"
 game_concept_new_moon_desc:0 "Тьма окутала [Concept('aervalr','Эрвал')|E], скрывая его даже от самого зоркого взгляда."
 game_concept_waxing_crescent:0 "Молодая луна"
 game_concept_waxing_crescent_desc:0 "Краткий проблеск света возвещает начало нового цикла."
 game_concept_first_quarter:0 "Первая четверть"
 game_concept_first_quarter_desc:0 "Свет [Concept('aervalr','Эрвала')|E] обращён на восток, эта фаза ассоциируется с ростом и прогрессом."
 game_concept_waxing_gibbous:0 "Растущая луна"
 game_concept_waxing_gibbous_desc:0 "Тени, скрывающие [Concept('aervalr','Эрвал')|E], почти рассеяны его нерушимым светом."
 game_concept_full_moon:0 "Полнолуние"
 game_concept_full_moon_desc:0 "Свет [Concept('aervalr','Эрвала')|E] сияет во всей своей лучезарной славе."
 game_concept_waning_gibbous:0 "Убывающая луна"
 game_concept_waning_gibbous_desc:0 "Сияние [Concept('aervalr','Эрвала')|E] оспаривается первыми намёками тени."
 game_concept_last_quarter:0 "Последняя четверть"
 game_concept_last_quarter_desc:0 "Свет [Concept('aervalr','Эрвала')|E] обращён на запад, эта фаза ассоциируется с упадком и потерями."
 game_concept_waning_crescent:0 "Старая Луна"
 game_concept_waning_crescent_desc:0 "Последний свет [Concept('aervalr','Эрвала')|E] упрямо мерцает, сопротивляясь надвигающейся тьме."
  
 ##############################
 # PHASE CHANGE NOTIFICATIONS
 ##############################

 moon_phase_notification_full_moon_title:0 "Эрвал достигает полноты"
 moon_phase_notification_full_moon_desc:0 "Свет [Concept('aervalr','Эрвала')|E] достигает полнейшей и самой лучезарной своей фазы. Потоки магии вздымаются."

 moon_phase_notification_blood_moon_title:0 "Восход Кровавой луны"
 moon_phase_notification_blood_moon_desc:0 "[Concept('aervalr','Эрвал')|E] окрасился в глубокий багрянец — дурное предзнаменование. Кровавая фаза искажает потоки магии и предвещает раздоры."

 moon_phase_notification_aelhyoer_moon_title:0 "Сверхпредельная луна"
 moon_phase_notification_aelhyoer_moon_desc:0 "[Concept('aervalr','Эрвал')|E] кричит. Его свет исказился за гранью природного спектра — нечто глубоко неправильное произошло в небесах."

 moon_phase_notification_new_moon_title:0 "Эрвал убывает во тьму"
 moon_phase_notification_new_moon_desc:0 "Тьма поглотила [Concept('aervalr','Эрвал')|E]. Луна проходит незримой, и поток магии убывает до самого низкого своего предела."