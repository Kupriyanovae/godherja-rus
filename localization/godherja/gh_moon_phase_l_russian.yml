 superluminous_moon_name:0 "Сияющая луна"
 superluminous_moon_desc:0 "Зеленоватое свечение [Concept('aervalr','Эрвала')|E] усилилось десятикратно, озаряя земли ниже жутким зелёным оттенком."

 aelhyoer_moon_name:90 "Сверхпредельная луна"
 aelhyoer_moon_desc:90 "[Concept('aervalr','Эрвал')|E] кричит, и его кровь проливается на скорбный мир внизу."

 new_moon_blood_moon_name:0 "Кровавая луна"
 new_moon_blood_moon_desc:0 "[Concept('aervalr','Эрвал')|E] окрашен в кроваво-красный оттенок — дурное предзнаменование, сулящее конфликты и бедствия."
