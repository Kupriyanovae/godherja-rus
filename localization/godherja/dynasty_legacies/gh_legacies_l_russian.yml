 gatecrasher_legacy_track_name:0 "Кровь Взламывающего Врата"
 gatecrasher_legacy_track_desc:0 "Взламывающий Врата сокрушил могучих адабиссцев не один, а два раза — свершение, почти не имеющее равных в истории"
 gatecrasher_legacy_1_name:0 "Кровь Взламывающего Врата"
