 salacad_legacy_track_name:0 "Кровь Коронованного Небом"
 last_aautokratir_legacy_track_desc:0 "Признанный всеми как финальный аавтократ, Коис был среди тех немногих, кому удалось одолеть Ценваре в открытом бою"
 victorious_cois_legacy_track_desc:0 "Когда всякая надежда для [Concept('aversaria', 'Аверсарии')|E] казалась утерянной, Коис восстал из небытия, дабы сокрушить орды Ценваре и спасти Империю"
 cristoff_legacy_track_desc:0 "Жестокий воитель, Хрисе безжалостно вырезал своих соперников и своими лютыми методами принудил к покорности большую часть шевальенского общества, впервые почти за сто лет объединив раздробленное Верховное королевство"
 aeschraes_legacy_track_desc:0 "Эшрей был одним из самых юных легонов в истории и заслужил славу сильнейшего среди [Concept('magi', 'магов')|E] после того, как устроил [Concept('frodbrokna','Фродброкну')|E]"
 pothacleas_legacy_track_desc:0 "Царь Потаклей был последним ийроссцем, бросившим вызов [Concept('aversaria', 'Аверсарии')|E] в партизанской войне. Когда он сдался и взмолился о пощаде для своего народа, аверсарианцы согласились — обратив ийроссов в вечное рабство и предав его смерти"
 skull_taker_legacy_track_desc:0 "Грозный воевода Горассос Сборщик Черепов прорубал себе путь сквозь [Concept('aversaria', 'Аверсарию')|E] во имя Эшрея, прежде чем отложиться от него, дабы сеять смерть уже во имя своё"
 salacad_legacy_track_desc:0 "Коронованные Небом и их потомки привели Дочерей Неба к новому золотому веку их народа"
