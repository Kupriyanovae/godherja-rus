 gh_black_sun_legacy_trigger_req:0 "\n@warning_icon!#N Необходимо создать [GetTitleByKey('e_aversaria_voreias').GetNameNoTier]#!"
 black_sun_legacy_track_desc:0 "Никаноней «Чёрное Солнце» доказал, что равен сьялволкам, и выковал новую [Concept('aversaria', 'Аверсарию')|E] на севере, мечтая вернуть былое величие старой"
