 reform_aversarian_religion: "Реформировать Аагиократию"
 reform_aversarian_religion_desc: "Слишком долго родина была заперта в бесконечной череде зверств, где удар сменялся ударом. Наш долг — положить этому конец, уничтожив магократию и коренным образом изменив саму суть того, что значит быть [Concept('aversaria','аверсарианцем')|E].\n\nЧтобы придать вес нашим словам, мы должны удерживать [GetBuilding('01_kasmeze_cathedral').GetName], одно из самых священных мест старой веры, в нашей хватке, а также явить силу, способную впечатлить всех. Бешеный ручной пёс [GetScriptedCharacterByHistoryID('westernimperial_aeschraes_aagiokrata_1').GetFirstName], [GetScriptedCharacterByHistoryID('southernimperial_aversarian_gorassos_1').GetFirstName] и его гнусный [GetTitleByKey('k_the_bloodied_throne').GetName] воплощают худшие жестокости старого порядка, и получение черепа самого «[GetScriptedCharacterByHistoryID('southernimperial_aversarian_gorassos_1').GetNickname]» — верный способ заставить обернуться не одну голову."
 reform_aversarian_religion_reform_effect: "Мы реформируем [Concept('aversaria','аверсарианскую')|E] веру в более сострадательное, открытое для всех учение." 
 reform_aversarian_religion_kasmeze_tt: "Вы удерживаете [GetTitleByKey('c_kasmeze').GetName]"
 reform_aversarian_religion_gorassos_tt: "[GetScriptedCharacterByHistoryID('southernimperial_aversarian_gorassos_1').GetName] мёртв"  
 reform_aversarian_religion_bloodied_throne_tt: "[GetTitleByKey('k_the_bloodied_throne').GetName] был уничтожен"  
 reform_aversarian_religion_confirm: "Объявить о реформах"
 
 eastern_reforms.0013.title: "Восточные реформы"
 eastern_reforms.0013.desc: "Сегодня начинается новая эра для [Concept('aversaria','Аверсарии')|E]. Самые спорные учёные вытащены из оттуда, где бы они раньше не прятались и многие другие пишут новые писания под наставленными копьями — так начинается новая, лучшая вера. Вера, что положит конец магократии, сильно ослабит нашу зависимость от рабства и значительно смягчит строгие ограничения на то, кого можно считать [Concept('aversaria','аверсарианцем')|E].\n\nБратья наши, без сомнения, будут зубами и когтями бороться с этими переменами, но будь то десять лет или столетие — [Concept('aversaria','Аверсария')|E] родится заново!"
 eastern_reforms.0013.a: "Наша история начинается сейчас!"
 
