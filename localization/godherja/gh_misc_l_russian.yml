 eastern_reforms.0100.title: "Смерть губернатора"
 eastern_reforms.0100.desc: "Губернатор Тетрадия был человеком надменным, фатоватым и трусливым до мозга костей, однако нельзя было не признать за ним поразительное чутьё на выживание. очетая хитрость с простым везением, он сумел пережить интриги имперского двора, Фродброкну и вторжения фенвиров, пробираясь на вершину груды обломков, пока мир пылал вокруг него.\n\nВозможно, я никогда не узнаю, был ли он простым интриганом и приспособленцем или злодеем, стоявшим за убийством Валерикса. Однако одно не вызывает сомнений. Его удача иссякла.\n\nГубернатор Тетрадия мёртв, и вместе с ним умерла его мечта вернуться в [GetTitleByKey('c_asiupoli').GetNameNoTier]."
 eastern_reforms.0100.a: "Истина так и останется тайной..."
 
 eastern_reforms.0101.title: "Несостоявшаяся месть"
 eastern_reforms.0101.desc: "«Проклятье!»\n\nЭтот крысоязыкий подлый убийца Легона совершил своё последнее предательство — на сей раз лишив меня возможности собственноручно прикончить его мечом.\n\nВ кругу своих воинов я шучу, что восстановлю положение магов, если те сумеют воскресить Тетрадию для меня дабы я убила его во второй раз, — но мне не скрыть ярости, что клокочет за этими словами.\n\nВ сердце моём зияет пустота там, где некогда обитал Валерикс, и каждый его удар наполняет меня неутолимой жаждой крови."
 eastern_reforms.0101.a: "Славь Чистейшего, что я не добралась до тебя первая, Тетрадия!"
 
