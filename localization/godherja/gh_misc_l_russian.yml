 # Black Sun
 
 black_sun.0001.title: "Коронация"
 black_sun.0001.desc: "Славный день — мои легионы ликуют, пока я шествую через [capital.GetNameNoTier] во главе великой процессии. Они выкрикивают имя [ROOT.GetCharacter.GetFirstNameNoTooltip], смакуя его словно вино, опьянённые славой и былой, уж было утраченной надеждой.\n\nНо впереди предстоит ещё столько всего, и пусть легионы славят меня, а народ бросает цветы к моим стопам в ликовании — разум мой скован думами о грядущем. Сьялволкам разбили нос в кровь, однако наши победы минувших дней — ничто пред кампанией, что ждёт впереди..."
 black_sun.0001.a: "За [Concept('aversaria','Аверсарию')|E] — вперёд!"
 
 black_sun.0002.title: "Провозгласить себя воплощением Чистейшего"
 black_sun.0002.desc: "Омитилои всей державы собрались, дабы взвесить мои притязания, и затворились на ночь в молитве и раздумьях. На рассвете вышли они и огласили своё провозвестие: я — Чистейший во плоти.\n\nВ самом деле: откуда ещё было взяться моим замыслам? Чья ещё длань направляла мой меч, когда я истреблял варваров-осквернителей? Как иначе могли на меня излиться победа за победой? Нет, нет иного объяснения, кроме божественного наития — нет, божественного воплощения.\n\nПусть жрецы верят во что хотят — главное, чтобы моим солдатам они велели поклоняться мне, проливая кровь язычников. Зовите меня богом во плоти — покуда слушаетесь каждого моего приказа. И лобызайте стяг Чёрного солнца сколько душе угодно — лишь бы он реял над каждым городом Империи."
 black_sun.0002.a: "Поклоняйтесь или нет - главное, повинуйтесь."
 
 AVERSARIA_VOREIAS: "Аверсария Ворейская"
 
 # Marcher Reforms
 
 marcher_lifepath.0100.title: "Путь свободен!"  
 marcher_lifepath.0100.desc: "Недавно [reformer.GetUIName] [Select_CString(reformer.IsFemale, 'провозгласила', 'провозгласил' )] совет Отцов Пути в своей столице в [capital.GetNameNoTier]. После нескольких дней обсуждений был оглашён официальный указ, объявляющий, что Путь отныне — как и замышлялось изначально — открыт всем, дабы каждый избирал его по собственной воле. Это решение вызвало недовольство знати,  которая усматривает в праве простолюдинов выбирать свой путь нарушение собственных прав и угрозу укладу жизни, — но покуда Отцы Пути Шевалье едины во мнении, поделать тут почти нечего.\n\nПока благородные пререкаются и ропщут, крестьянство по большей части предалось празднествам, хотя большинство, без сомнения, по-прежнему будет настоятельно направлять своих детей на на Путь Жатвы."  
 marcher_lifepath.0100.a: "Путь вновь утверждён."  
 marcher_lifepath.0100.b: "Неужели у них нет более важных забот?"  

 marcher_lifepath.0101.title: "Путь регламентирован!"  
 marcher_lifepath.0101.desc: "Сегодня [reformer.GetUIName] [Select_CString(reformer.IsFemale, 'объявила', 'объявил' )], что крестьяне Шевалье отныне лишены права на частные обряд выбора Пути и что Отцы Пути могут проводить их лишь с дозволения местного господина. Узаконив десятилетия расслоения в марочникском обществе, это решение закрепляет крепостное право как норму.\n\nХотя среди простолюдинов оно вызвало возмущение, многие аристократы встретили его ликованием, довольные тем, что крестьяне отныне не могут без их соизволения обучаться ни воинскому искусству, ни науке правления."  
 marcher_lifepath.0101.a: "Путь определён."  
 marcher_lifepath.0101.b: "Неужели у них нет более важных забот?"  
 
 # Marcher Lifepath Adherence Piety Tooltips
 
 lifepath_adherence_notification.tt: "Это действие соответствует вашему [Concept('lifepath','Жизненному пути')|E] и при успехе увеличит ваше [Concept('piety','благочестие')|E]."  
 lifepath_adherence_zealous.tt: "Это действие согласуется с вашим [Concept('lifepath','Жизненным путём')|E] и, в силу вашего фанатизма, повлияет как на [Concept('piety','благочестие')|E], так и на [Concept('stress','стресс')|E]!"  
 lifepath_adherence_variant.tt: "Этот результат демонстрирует ваше мастерство в следовании [Concept('lifepath','Жизненному пути')|E], увеличивая [Concept('piety','благочестие')|E]."  
 lifepath_adherence_variantzealous.tt: "Этот результат подтверждает вашу преданность [Concept('lifepath','Жизненному пути')|E], увеличивая [Concept('piety','благочестие')|E] и снижая [Concept('stress','стресс')|E] благодаря вашему фанатизму."  

 lifepath_adherence_bad.tt: "Это действие противоречит вашему [Concept('lifepath','Жизненному пути')|E] и при обнаружении уменьшит ваше [Concept('piety','благочестие')|E]!"  
 lifepath_disadherence_variant.tt: "Этот результат выставит вас неумелым в следовании [Concept('lifepath','Жизненному пути')|E], уменьшая [Concept('piety','благочестие')|E]."  
 lifepath_adherence_zealousbad.tt: "Это действие идёт вразрез с вашим [Concept('lifepath','Жизненным путём')|E] и может, в силу вашего фанатизма, повлиять как на [Concept('piety','благочестие')|E], так и на [Concept('stress','стресс')|E]!"  
 lifepath_disadherence_variantzealous.tt: "Этот результат опозорит вас и вашего Отца Пути! Ваше [Concept('piety','благочестие')|E] уменьшится, а [Concept('stress','стресс')|E] возрастёт из-за вашего фанатизма."  

 lifepath_crow_adherence_staysneaky.tt: "Раскрытие тайного действия опозорит вас как последователя Пути Воронов, уменьшив [Concept('piety','благочестие')|E]!"  
 lifepath_crow_adherence_zealous.tt: "Успешное тайное действие снизит ваш [Concept('stress','стресс')|E] благодаря вашему фанатизму!"  
 
