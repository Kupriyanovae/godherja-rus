 ####################################
 ## Kingdom of the Kasiryat (Eastern Settlers)
 ####################################
 form_kasiryat_kingdom_decision: "Found a New Kingdom on the Kasiryat"
 form_kasiryat_kingdom_decision_desc:0 "#flavor They came from distant lands; the Theugombrian sword-brothers who found the road, the Balauri serpent-warriors who carry the old ways, the Izikalek folk who read the sky for omens. Each arrived along the [Glossary('Kasiryat River','kasiryat_encyclopedia_desc')] and found a world of prosperity.#!\n\nThe city of Aterispol and the lands surrounding it are our home now, paid for in blood and sweat. Let it be said in law and title what is already true in deed: that the Kasiryat belongs to those who made it their own."
 form_kasiryat_kingdom_decision_tooltip:0 "Claim Aterispol and the Kasiryat, and formally establish a new realm."

 # Effect tooltips
 form_kasiryat_kingdom_title_effect_tt:0 "Establish the Kingdom of the Kasiryat; Aterispol is fortified to serve as the capital of the new settler realm.\n\n#flavor the kingdom's name will be reflected by your cultural origins.#!"
 kasiryat_kingdom_formed_fervor_desc:0 "A kingdom proclaimed in the Kasiryat; the settlers' faith is strengthened by the new homeland."

 # Modifier
 kasiryat_settler_capital_modifier: "Settler Stronghold"
 kasiryat_settler_capital_modifier_desc: "Aterispol has been fortified by the settler peoples, its building potential expanded in recognition of its new role as the frontier capital of the Kasiryat."

 # Titles
 k_kasiryat_adj: "Kasiryat"

 ####################################
 ## Insular Aautokrata (Tower Isles)
 ####################################
 form_isles_aautokrata_decision: "Form the Akrapyrgos Aautokrata"
 form_isles_aautokrata_decision_desc:0 "The sea does not belong to those who gaze upon it from shore. It belongs to those who sail it. The [Glossary('Akrapyrgos','tower_isles_encyclopedia_desc')] form a world unto themselves; a realm of wind, salt, and ambition. Any who hold dominion here do so with the power of an Aautokratir, as [aversaria|E] did. A dominion above mortal kingdoms, blessed by divine humanity."
 form_isles_aautokrata_decision_tooltip:0 "Forge the Akrapyrgos Aautokrata from the tower island kingdoms."

 # Requirement tooltips
 form_isles_aautokrata_kingdoms_tt:0 "Must hold at least three kingdom-tier titles"
 form_isles_aautokrata_no_continental_tt:0 "Must hold no provinces outside the [GetGeographicalRegion('tower_isles_biozone').GetName], [GetGeographicalRegion('central_isles_biozone').GetName], [GetGeographicalRegion('guillate_rocks_biozone').GetName], or [GetGeographicalRegion('the_isles_biozone').GetName] regions"

 # Modifier
 isles_aautokrata_founder_modifier: "Master of the Akrapyrgos"
 isles_aautokrata_founder_modifier_desc: "This character has earned their place in history by securing their dominion over the [shatteredisles|E]."

 # Titles
 e_isles_aautokrata_adj: "Akrapyrgos"

 # Legend
 legend_chronicle_new_title_e_isles_aautokrata: "Founding of the Akrapyrgos Aautokrata"

 ####################################
 ## Formation notification events
 ####################################

 gh_formation_decisions.0002.t: "The Akrapyrgos Aautokrata Proclaimed"
 gh_formation_decisions.0002.opening: "Word has reached us from the islands..."
 gh_formation_decisions.0002.desc: "[scope:aautokratir.GetTitledFirstName], [scope:aautokratir.GetTitledName], has proclaimed the [title:e_insular_aautokrata.GetFullName], asserting dominion over the Tower Isles and the surrounding sea. The Sea of Empires is now an Empire of the Sea."
 gh_formation_decisions.0002.a: "The islands rise above the mainland."
