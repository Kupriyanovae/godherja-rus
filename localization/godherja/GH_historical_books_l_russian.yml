 the_garden_of_copper_title: "Медный сад"
 the_garden_of_copper_desc: "Сборник примерно сорока стихотворений, написанных неизвестным поэтом, посетившим рудники верхней долины [Concept('amsar','Амсара')|E]. В произведении рудники описаны как подземный сад, где шахты уподоблены стволам деревьев, рудные жилы — лианам, а стук кирок — пению птиц. Между ними вплетены жалобы на шахтёров, представленные как метафоры увядающей жизни в дыму. Книга издавна считается поэтической критикой богатства, построенного на страданиях."

 historical_dead_magic_grimoire_1_title: "Мёртвая магия: Собранные заметки Митики"
 historical_dead_magic_grimoire_1_desc: ""

 the_collected_poems_of_useysh_title: "Собрание стихов Усейша"
 the_collected_poems_of_useysh_desc: "Сборник почти тысячи двухсот стихотворений Усейша «Хиксарти», вероятно, самого плодовитого и влиятельного поэта своей эпохи. Его темы варьируются от [Concept('aervalr','луны')|E] до тиссенских крестьян и замысловатых метафор для шехарддских городов-государств. Его стиль постоянно меняется: от кратких гномических фрагментов до длинных извилистых эпопей. Сборник сохранил несколько серий парных стихов, в которых он отвечает на собственные ранние стихи, позволяя читателям проследить изменения в его мышлении на протяжении десятилетий творчества."

 the_five_sealed_springs_title: "Пять запечатанных источников"
 the_five_sealed_springs_desc: "Легендарная история мага-воительницы Ив, которая путешествовала по западному [Concept('amsar','Амсару')|E], чтобы заточить пять джиннов в источниках. Рассказанная в шести чрезвычайно длинных главах, она повествует о её странствиях и битвах, о ритуалах, которыми были связаны сущности, о сокровищах, накопленных джиннами, и о чудесных свойствах источников. Хотя большинство считает это вымыслом, описания побудили поколения искателей приключений тщетно разыскивать их местонахождение."

 a_thousand_dishes_of_sarradon_title: "Тысяча блюд Саррадона"
 a_thousand_dishes_of_sarradon_desc: "Заказанный $qanamsar_parashad_link$ Канамасаром Парашадом#! в 1076 году от И.С., этот сборник собрал рецепты со всего [Concept('amsar','Амсара')|E], западного и центрального [Concept('sarradon','Саррадона')|E]. Он сохранил приготовления от простых медовых тиссенских хлебов до сложных блюд из пряной баранины с прибрежного Удлийя и экстравагантных, чрезвычайно сложных в приготовлении яств, подаваемых Лиренерам Лираажа [Glossary('Айяра','ayyar_coast_encyclopedia_desc')]. Книга была преподнесена Канамасару на его третьей свадьбе, где он, как известно, потребовал подать каждое блюдо за один пир."

 on_the_paths_of_dream_title: "О путях сновидений"
 on_the_paths_of_dream_desc: "Собрание сочинений сновидца Атана ша Пансареха, считающегося, возможно, величайшим магом сновидений после [Concept('gh_the_amsari_prophet','Пророка')|E], по крайней мере среди тех, кто не принадлежал к их династии. Книга сохраняет стенограммы его путешествий по царству сновидений, включая то, что он утверждал как частичный успех в фиксации места внутри него, а также инструкции для тех, кто хочет повторить его достижения."

 the_rise_and_reign_of_naza_title: "Возвышение и правление Назы"
 the_rise_and_reign_of_naza_desc: "Написано [Glossary('дамотанским','damota_encyclopedia_desc')] авантюристом Гибали во время его путешествия на далёкий восток во время возвышения $crater_queen_naza_link$ Назы#! в начале IX века от И.С. Книга повествует о её кампании в [Glossary('Кратере','crater_encyclopedia_desc')], от захвата [GetTitleByKey('d_sinasan').GetNameNoTooltip] до окончательной консолидации региона. Позже книга была подарена $qanamsar_zayar_link$ Канамасару Заяру#! в знак признательности и великой дружбы, процветавшей между двумя мужчинами."

 in_search_of_the_lost_south_title: "В поисках потерянного юга"
 in_search_of_the_lost_south_desc: "Написанная математиком и астрологом Дирхездом на основе его собственных наблюдений за саррадонскими горными хребтами, климатом и географией, эта работа утверждает, что [sarradon|E] должен простираться далеко за Великую пустыню на юг, неизвестный известному миру. Дирхезд выдвигает две возможные теории: либо огромная, необитаемая пустошь, либо единая великая империя, правящая воображаемыми землями, не желающая или не заботящаяся о том, чтобы быть известной. Теория была отвергнута его современниками и сочтена абсурдной большинством, но Дирхезд заявил, что отправится на юг, чтобы доказать это, и его больше никогда не видели."

 the_campaigns_of_sharnira_title: "Кампании Шахр'Ниры"
 the_campaigns_of_sharnira_desc: "Эта книга была написана писцом Ардеком Язмиром, сопровождавшим $qanamsar_sharnira_link$ Канамасару Шахр'Ниру#! на протяжении всех её завоеваний в [Concept('amsar','Амсаре')|E]. Она сочетает точные описания её кампаний с отрывками личных размышлений, приписываемых самой Канамасаре, что делает её одним из самых подробных записей такого рода. В одних местах она неустанно восхваляет победы Шахр'Ниры, а в других открыто критикует её выбор, осуждая поступки, которые автор описывает как морально предосудительные. Переход от восхваления к порицанию резок, но придаёт работе необычную откровенность.\n\nЭта двойственность породила догадки об отношениях Язмира с Шахр'Нирой. Уровень близости, подразумеваемый размышлениями, и нехарактерная свобода, с которой она изображена, заставили многих поверить, что он был среди её неофициальных наложников. Подробные логистические и стратегические заметки о кампаниях Шахр'Ниры, помещённые рядом с её личными, а иногда и чувственными, даже интимными размышлениями, сделали хронику предметом интереса как для военных исследований, так и для тех, кто интересуется интимной стороной её личной жизни."

 collection_of_note_worthy_dreams_vol542_title: "Собрание примечательных сновидений, т. 542"
 collection_of_note_worthy_dreams_vol542_desc: "Книга, украденная из Дома Грёз. Эта компиляция была составлена десятками [Concept('gh_frazan','фразанов')|E], которые сочли переживания верующих достойными потомства. Она сохраняет более двухсот снов, пересказанных просителями, скопированных как можно более точно словами тех, кто их видел. Для каждой записи Фразан записывал краткие заметки и собственные размышления на эту тему. Хотя большая часть работы кажется бесполезной для простолюдина, она остаётся ценной для института Фразан как из-за широты записей, так и из-за того, что может сохранять крупицы истинного откровения."

 proclamations_of_the_emerald_pretender_title: "Прокламации Изумрудного Самозванца"
 proclamations_of_the_emerald_pretender_desc: "Якобы написанная предполагаемым внуком $qanamsar_parashad_link$ Канамасара Парашада#!, книга сохраняет речи и прокламации, приписываемые так называемому Изумрудному Самозванцу. Наряду с осуждениями «лжевосседающего на троне» [GetTitleByKey('e_amsari_hiklahn').GetNameNoTier], она содержит длинные размышления о правлении, легитимности и правах крестьян. Стиль неровен, переходя от прокламации к аргументу и брани, многие отрывки кажутся незаконченными. Большинство учёных считают это более поздней подделкой, составленной несколькими философами к концу [Concept('gh_emerald_rebellion','Изумрудного восстания')|E]."

 annals_of_the_house_of_harthah_title: "Анналы дома Хартах"
 annals_of_the_house_of_harthah_desc: "Написанная учёным и придворным Ханны, внучки $harthah_link$ Хартаха ибн Саррадона#!, книга превозносит деяния династии. Она прославляет Хартаха как великого освободителя, сокрушившего агионистское иго и освободившего [sarradon|E] от его хватки, воспевая его мудрость и решимость очистить землю от чужеземной скверны. Затем она обращается к самой Ханне, изображая её правление как воплощение его видения через стабильность и мир, которые она поддерживала, и представляет её дом как законных хранителей будущего царства."

 unfinished_treatise_of_mamur_adabyn_title: "Неоконченный трактат мамура Адабина"
 unfinished_treatise_of_mamur_adabyn_desc: "Оставленный незавершённым после смерти $mamur_adabyn_link$ мамура Адабина#!, книга представляет собой комментарий к праву договоров. В ней подробно рассматриваются права и обязанности между кредитором и заёмщиком, с особым вниманием к процентам, невыплатам и разделению ответственности в караванных партнёрствах.\n\nАдабин часто цитирует более раннего юриста Харзида, отмечая места, где его толкования были неясны или противоречивы. Некоторые пассажи представляют собой не более чем маргинальные заметки, подвергающие сомнению определение или добавляющие примеры из недавних дел. Работа обрывается во время расширенного обсуждения Адабином наследования долгов, заканчиваясь на полуслове во время опровержения мнения Харзида."

 wisemans_friend_title: "Друг мудреца"
 wisemans_friend_desc: "Книга оккультного и духовного руководства, написанная шевальенским мистиком Жаспером Верданом. Она охватывает широкий круг тем, включая травяные снадобья, религиозные советы, духов и многие другие арканные предметы, и оказалась чрезвычайно популярной среди марочникских студентов эзотерики — её историческое подавление ещё больше расширило её привлекательность."

 owl_dissections_title: "Рассечения совы"
 owl_dissections_desc: "Написано анонимным марочником, известным только как Полимат, который, как говорят, был святым пути. Эта рукопись содержит подробные анатомические диаграммы сов, разрезанных всевозможными способами. Куриные каракули огромной сложности и неразборчивости гарантируют, что рукопись можно воспроизвести только с помощью магических искусств."

 songwood_title: "Лесная песнь"
 songwood_desc: "Ранний марочникский текст, компилирующий различные песенные истории, рассказанные кланами Кланлендеров из Калатипсоми. Говорят, они когда-то пели Лесу в его путешествии."

 azure_tablet_title: "Лазурная табличка"
 azure_tablet_desc: "Древний гримуар неизвестного происхождения, популярно приписываемый таинственному Алому Королю."

 aeltheniax_anatomy_vol_2_title: "«Анатомия» Эльтениакса, том II"
 aeltheniax_anatomy_vol_2_desc: "Книга по человеческой анатомии одного из самых прославленных учёных [Concept('mayikprolollans','Майикпрололлана')|E]. Это второй и гораздо более редкий том, с гораздо большим акцентом на арканные аспекты тела."

 aeltheniax_anatomy_vol_1_title: "«Анатомия» Эльтениакса, том I"
 aeltheniax_anatomy_vol_1_desc: "Книга по человеческой анатомии одного из самых прославленных учёных [Concept('mayikprolollans','Майикпрололлана')|E]. Это первый и гораздо более распространённый том, с акцентом на более обыденные функции тела; в частности, на сердечно-сосудистую систему."

 seventy_seven_cities_title: "Семьдесят семь городов Великого мира"
 seventy_seven_cities_desc: "Деметрий из Хумау был известным писателем наполовину [Concept('marchers','шевальенцем')|E], наполовину [Concept('aversaria','аверсарианцем')|E], чьи две сотни книг, трактатов, памфлетов, стихов, пьес и прочего закрепили за ним статус, возможно, самого важного писателя X века. Его рассказ «Семьдесят семь городов» одновременно подробно описывает и предлагает короткую историю того, что Деметрий считал 77 величайшими городами мира, и даже содержит подробные описания городов вплоть до центра Адабисса или таинственных земель Шакси-Шахай на дальнем востоке, все из которых Деметрий утверждает, что видел своими глазами."

 historical_korlacu_grimoire_1_title: "Гримуар Священного Пламени"
 historical_korlacu_grimoire_1_desc: "Этот гримуар является священной реликвией для последователей Корлаку, которые верят, что сам Огненосец вложил в страницы книги саму суть Священного Пламени."

 historical_wood_law_grimoire_1_title: "Кодекс изменяющих форму"
 historical_wood_law_grimoire_1_desc: ""

 healing_water_rune_scroll_1_title: "Руна целительной воды"
 healing_water_rune_scroll_1_desc: ""

 magistrength_rune_scroll_1_title: "Магическая сила"
 magistrength_rune_scroll_1_desc: ""

 auspex_of_temptation_rune_scroll_1_title: "Авспик соблазнения"
 auspex_of_temptation_rune_scroll_1_desc: "Заклинатель использует магию [aspect_blood], чтобы стать сверхчувствительным к языку тела и другим тонким сигналам объекта своего желания. Однако на высоких уровнях заклинание может сделать заклинателя более подверженным стрессу от внешних событий."

 raise_bloodthralls_rune_scroll_1_title: "Руна поднятия кровавых слуг"
 raise_bloodthralls_rune_scroll_1_desc: ""

 skeletalcraft_rune_scroll_1_title: "Усиление скелета"
 skeletalcraft_rune_scroll_1_desc: "Говорят, что кости содержат саму суть магии, связывающей душу с телом, и многие [Concept('magi','маги')|E], как известно, используют их для усиления своих способностей."

 fire_magick_rune_scroll_1_title: "Огненная магия"
 fire_magick_rune_scroll_1_desc: "Скромный огненный шар, пожалуй, самое распространённое заклинание во всём [Concept('aeras','Эрасу')|E]. Хотя для его сотворения требуется мало тренировки и почти никакой подготовки, существует множество методов, позволяющих [Concept('magi','магам')|E] «заряжать» более сильные снаряды на некоторое время."

 defiled_nadir_magical_scroll_1_title: "Осквернённый Надир"
 defiled_nadir_magical_scroll_1_desc: "Многие меры принимают люди, чтобы отсрочить сладкие объятия смерти. Старые истории рассказывают об иссохших оболочках, больше духах, чем существах из плоти и крови, привязанных к миру живых лишь проклятыми масками, которые они носят. Но для некоторых это всё же не слишком высокая цена."

 skull_of_the_purest_title: "Череп Чистейшего"
 skull_of_the_purest_desc: "Компендиум и комментарий IX века к серии ныне утерянных свитков тебастрийского клирика IV века Вилоса Валона. Свитки документировали видения, увиденные с помощью «Черепа Чистейшего» — загадочного артефакта неизвестного происхождения, судьбы или даже подтверждённого существования.\n\nСами видения часто едва связны, их предмет (когда вообще можно различить какой-либо предмет) чаще всего — акты крайней жестокости и безграничной порочности, совершаемые расой, которую Виас идентифицирует как «Первых людей» из аагиократической мифологии. По всей книге также разбросаны комментарии и анализы неизвестного автора IX века, чаще всего с теологической точки зрения.\n\nНезависимо от достоверности видений, текст обладает глубоко тревожащим качеством, и некоторые из более зловещих глав считаются трудными для чтения целиком. В нескольких местах составитель IX века намекает на существование большего количества свитков Вилоса Валона, но они не были включены в том по неизвестным причинам."

 masenmalik_title: "Поля жемчуга и ямы, полные золота"
 masenmalik_desc: "Мас'ен Малик был плодовитым автором, жившим в золотой век ритуалистского правления над [Concept('sarradon','Саррадоном')|E]. Эта эклектичная работа в тридцати пяти томах — его самое известное и широко читаемое произведение. Хотя серия претендует на звание истории, неортодоксальный стиль Мас'ен Малика приводит к труду, полному фантастических историй, удивительно точных исторических описаний, сокровищницы классической южной поэзии и десятков — возможно, сотен — ритуалов Мёртвой магии, скрытых в закодированном языке по всей книге. Естественно, верные копии этой работы очень ценны. Как ни странно, Мас'ен Малик не был известен как маг. Ведущие теории предполагают, что анонимный «благодетель», которого он благодарит в нескольких местах, мог стоять за сложным шифром, который до сих пор разгадывают почти тысячу лет спустя."

 kam_gutaran_title: "Кам-Гутаран"
 kam_gutaran_desc: "Древняя книга, переписанная с ещё более древнего свитка, якобы содержащего истории от племён Айяра около 2000 лет назад. Кам-Гутаран подробно описывает сотню различных ремёсел в попытке побудить людей овладеть своей профессией. Хотя многие советы по отдельным профессиям устарели, общие жизненные советы удивительно действенны и чрезвычайно проницательны."

 bookofmaps_title: "Книга карт"
 bookofmaps_desc: "Этот том гордо несёт печать Аверсарианского картографического союза. Аверсарианские учёные — единственные в мире (помимо, возможно, адабиссов), кто проявлял интерес к созданию по-настоящему точных карт мира, используя смесь науки и магии для определения точной формы и размера каждого участка суши. Как и следовало имперской традиции, территория Аавтократии показана намного больше, чем она есть на самом деле."

 grimoireofmethinoire_title: "Гримуар Метинора Метиклиза"
 grimoireofmethinoire_desc: "Гримуар Метинора Метиклиза был захвачен марочникским рыцарем Гаоффом ден ва Спенсером во время легендарного налёта на цитадель Кровавый Стон. В поисках освобождения пленных из недавнего набега и мести за своего брата Терина Гаофф и его отряд Анти-Магов убили Метинора и уничтожили его армию нежити во время битвы в тронном зале лича. Гримуар был привезён на юг, и легенды гласят, что он был продан правящему аавтократу за такую сумму, что экономика [chevalie|E] вскоре рухнула от избытка золота и серебра."

 burntgrimoire_title: "Обгоревший гримуар"
 burntgrimoire_desc: "Эта книга изрядно потрёпана, её края обожжены, а десятки страниц отсутствуют (либо вырваны, либо сожжены). Тем не менее, вся мощь, которую она когда-то содержала, всё ещё ощутима, и она излучает удивительное количество магической энергии для такого уродливого сосуда."

 afynehestoree_title: "Славная история земли Шевалье"
 afynehestoree_desc: "Старый том на более старой версии того, что может быть современным [Concept('marchers','шевальенским')|E] языком, или, возможно, новый том, написанный обычным фермером. Будь то результат возраста или безграмотности, книга даёт довольно фантастическое описание [Concept('marchers','шевальенской')|E] истории от [Concept('chevalie_migratory_era','эпохи галликадских племён')|E] вплоть до [Concept('red_river_war','Войны Красной реки')|E], где она внезапно обрывается, словно никогда не была закончена."

 book_of_kurush_title: "Книга Куруша"
 book_of_kurush_desc: "Рассказ амсарского пророка Куруша, в котором он описывает свои видения Ада."

 journal_of_waymaster_germaine_dellecroix_title: "Дневник путеводного отца Жермена Деллекруа"
 journal_of_waymaster_germaine_dellecroix_desc: "Фрагментарный текст, подробно описывающий жизнь и путешествия некоего Жермена Деллекруа, который ищет крайний север континента. Несколько страниц отсутствуют в конце."

 the_lost_cities_title: "Затерянные города"
 the_lost_cities_desc: "Интервью, собранные учёными Майикпрололлана у немногих выживших после встреч с Тенями на Расколотом побережье."

 book_of_forbidden_names_title: "Книга запретных имён"
 book_of_forbidden_names_desc: "Амсарский том демонологической традиции, якобы написанный с намерением помочь противостоять злобным сущностям, которые он описывает, но на практике используемый для противоположной цели столь же часто."

 amazingslaves_title: "Удивительные рабы и где они обитают"
 amazingslaves_desc: "Наполовину вымысел, наполовину путеводитель, эта [Concept('aversaria','аверсарианская')|E] история — результат попытки [Concept('magi','мага')|E] превратить памфлет с советами по работорговле в увлекательный фантастический эпос. Как правило, терпящий неудачу в обоих аспектах, длинные многостраничные описания бёдер [Concept('sarradon','саррадонских')|E] женщин или странная четырнадцатистраничная полная ненависти тирада о сопернике автора Деметрии в разделе об управлении ийросами являются яркими индикаторами того, чего можно ожидать от этой истории."

 fraternityofmagi_title: "Ответ на «Братство магов»"
 fraternityofmagi_desc: "Эта книга представляет собой покаянный ответ на серию трактатов, написанных [Concept('aversaria','аверсарианским')|E] [Concept('magi','магом')|E] Нотоксом Эманаидом под названием «Братство магов» — серию всё более лихорадочных эссе, предлагающих создание истинной Магократии в Аверсарии, где все маги живут на равных независимо от религии и культуры.\n\nКнига, написанная одним из многих критиков Эманаида, предлагает довольно резкий комментарий, как и большинство ответов на эту публикацию. В основном книга подробно описывает нелепость идеи о том, что Аверсария уже не является Братством магов. Автор указывает, что только аверсарианцы являются людьми, и только маги — по-настоящему людьми, и что все люди Аавтократии имеют самый высокий уровень жизни и прав в известном мире. Автор заканчивает книгу предположением, что Эманаид сочувствует своим рабам, и предлагает казнить их за их убеждения."

 the_godherja_title: "Годхерия"
 the_godherja_desc: "Составленная полумифическим Крувоником «Добрым Словом» когда-то в далёком прошлом, а затем записанная его слепым учеником Сьинласом «Блуждающим», Годхерия остаётся по сей день самой важной и влиятельной из сьялволькских саг."

 dragon_tale_title: "Сказание о драконе"
 dragon_tale_desc: "«Сказание о драконе» — знаменитая история [Concept('war_of_the_thousand_dragons','Войны тысячи драконов')|E], написанная [Concept('aversaria','аверсарианским')|E] учёным Дексоном Дивантаксом. В ней с точностью описывается гражданская война между злым Дхаксикеном и добрым Летигано, а также воровство драконов, крадущих силу [Concept('magic','магии')|E] у добрых аверсарианцев и присоединяющихся к Дхаксикену в попытке уничтожить память о Чистейшем. Хотя в целом её хвалят как чрезвычайно точное и хорошо исследованное, хотя и слегка драматизированное, повествование о войне, несколько критиков заметили, что автор (несмотря на утверждение, что писал её во время войны) на самом деле является псевдонимом Давона Давонтера, который жил примерно через 500 лет после событий истории."

 womanknights_title: "О женщинах-рыцарях"
 womanknights_desc: "Эта книга была написана шевальенским учёным Мишоном Андро в XI веке для компиляции многочисленных более мелких работ различных авторов его времени, которые выступали за или против идеи присвоения женщине титула рыцаря, скорее всего, из-за посвящения в рыцари женщины-антимага Розы ден ва Крейзанс в начале века военачальником-королём Антоном Дескадрау.\n\nХотя в марочникской истории есть много примеров женщин-воительниц, конкретный титул рыцаря почти никогда не давался женщине. Хотя работы в целом поддерживают сражения женщин, и никто не осмеливается запятнать имя многих марочникских героинь, Андро завершает работу утверждением, что женщины-рыцари сами по себе являются атакой на «сильные и благородные традиции», которые несёт этот титул, несмотря на неохотное признание того, что убийство леди Розой почти сотни нежити и [Concept('aversaria','аверсарианского')|E] Мага до её 19-й зимы было довольно впечатляющим."

 pocket_guide_to_aversaria_title: "Карманный путеводитель по Аверсарии"
 pocket_guide_to_aversaria_desc: "Собрание карт и описаний мест по всей [GetTitleByKey('h_aversarinas_aautokrata').GetName]."

 manswelbestiarium_title: "Бестиарий Рагамбальда Мансвела"
 manswelbestiarium_desc: "Рагамбальд Мансвел был необычайно много путешествовавшим марочникским авантюристом, который, как говорят, доплыл так далеко на восток, как до границ Катун-Кая. По возвращении в [chevalie|E] Рагамбальд начал трудоёмкий процесс записи своих многочисленных журналов и набросков в письменной форме. Содержащиеся в них описания являются непревзойдённым и удивительно точным руководством по различной фауне, магической и иной, которая обитает в отдалённых регионах [Concept('aeras','Эраса')|E]. Биография самого Рагамбальда — якобы записанная в отдельном томе — к сожалению, почти полностью утеряна для истории, но из его сохранившихся работ можно заключить, что он был замечательным и образованным человеком. Некоторые даже предполагали, что Мансвел мог быть псевдонимом, но это, как и всё остальное о жизни Мансвела, является предметом ожесточённых споров среди шевальенских литераторов."

 contents_of_silver_title: "Содержимое серебра"
 contents_of_silver_desc: "Серия инструкций неизвестного антимага о процессе изготовления и обслуживания зеркал."

 greyfen_codex_title: "Грейфенский кодекс"
 greyfen_codex_desc: "Гримуар, когда-то принадлежавший Ведьме Грейфена, до того как она была убита сэром Рене Усатым. Несмотря на богатство арканных знаний, содержащихся в нём, безграмотный сэр Рене проиграл книгу в игре в кости в гисреддской таверне, после чего она исчезла из исторических записей на столетия. Она вновь появилась в IX веке после того, как была извлечена из личной библиотеки печально известного Тискула ден ва Вескота."

 on_the_triune_blood_of_man_title: "О тройственной крови человека"
 on_the_triune_blood_of_man_desc: "Знаменитый медицинский и философский текст, приписываемый [Glossary('полисному','GH_POLISOCRACY_GLOSS')] эрудиту Мнестриосу."

 the_voyagers_title: "Путешественники"
 the_voyagers_desc: "Записанные сновидческие путешествия кабала Изоэдрона. Возглавляемые адептом Пятого Пальца Санада Ишаком, изоэдроны проникли далеко за известные границы астральной проекции, исследуя глубины психики и самые отдалённые сферы небес."

 clarifications_on_the_ivory_sea_title: "Разъяснения о Слоновой Кости"
 clarifications_on_the_ivory_sea_desc: "Неподписанная рукопись, анализирующая природу объектов, извлечённых из снов Беспробудных. Похоже, существуют ритуалы, способные погрузить кого-то в бесконечный сон, полный тревожных грёз. Если такой сновидец обладает даром магии, иногда вещи, которые ему снятся, могут просочиться сквозь трещины в его истерзанной психике и войти в реальный мир. Обычно это просто предметы."

 neverending_dream_title: "Бесконечный сон"
 neverending_dream_desc: "Аптийская легенда, пересказанная [Concept('aversaria','аверсарианскими')|E] учёными, повествует о мальчике, запертом в своих снах."

 transcripts_of_contention_of_rajmun_title: "Стенограммы прений в Раджмуне"
 transcripts_of_contention_of_rajmun_desc: "Прения в Раджмуне были крупными дебатами между главой университета Раджмуна, учёным Пракшем Утаматаром, и супругой-кхатхпатти Адлурбада, Арджуном Вханати, для обсуждения причин [sabar_lambay_raad|E]. Первоначально сосредоточенные исключительно на катастрофе, они переросли в моральные и теологические дебаты об этике [Concept('magic','магических')|E] экспериментов. Писец, учёный Лубхай Адвани, дополняет стенограммы своими собственными размышлениями и интерпретациями."

 epic_of_talab_title: "Эпос о Талабе"
 epic_of_talab_desc: "Этот древний саррадонский эпос повествует о Талабе, олицетворении созвездия Странника, который направляется ко дворцу Императора Ночи. На своём пути он должен преодолеть множество препятствий и врагов."

 high_chants_of_stargazers_title: "Высокие песнопения бдительных звёздочетов"
 high_chants_of_stargazers_desc: "Собрание утраченных обрядов, которые когда-то направляли забытый орден астрологов в их поисках небесной гармонии."

 splenderous_mirror_turned_inwards_title: "Великолепное зеркало, обращённое внутрь"
 splenderous_mirror_turned_inwards_desc: "Рукопись, подробно описывающая таинственное искусство «внутренней алхимии». Автор утверждает, что работы алхимиков [magi|E] в физическом мире могут быть зеркально отражены во внутреннем мире, где адепт способен фундаментально преобразовать свою личность и пороки с помощью ряда тщательных процессов."

 the_dancers_title: "Танцоры"
 the_dancers_desc: "Весьма поносимая пьеса [Concept('aversaria','аверсарианского')|E] происхождения, её текст тем не менее сохранился в обращении в определённых эзотерических кругах. Она по репутации непостижимо бессмысленна и написана либо особенно бездарным любителем, либо безумцем. Возможно, и тем, и другим."

 the_hippoxiad_title: "Гиппоксиада"
 the_hippoxiad_desc: "[Concept('aversaria','Аверсарианская')|E] комедийная пьеса неясного происхождения, известная тем, что способна буквально гипнотизировать зрителей, среди прочих эффектов."

 sound_of_veins_title: "Звук жил"
 sound_of_veins_desc: "Эпическая и гомоэротическая поэма опахасийской традиции, описывающая вожделения и страдания Вампира."

 testament_to_yunusfur_title: "Завещание Юнусфуру"
 testament_to_yunusfur_desc: "Буклет, повествующий о путешествиях и мученичестве пророка Юнусфура, благословлённого Софокосом. Говорят, что она прошла от одного конца Саррадона до другого, обучая добродетели и правильным религиозным обрядам. Это единственное известное упоминание о её существовании."

 arl_janvreeps_series_title: "Серия Арла Янврипа о Мировом древе"
 arl_janvreeps_series_desc: "Сборник гравюр и угольных набросков, первоначально сделанных конейкменерским магом-исследователем Арлом Янврипом во время его экспедиции в таинственные земли партиков после исчезновения [Concept('kartharadd','картараддцев')|E]."

 songs_of_the_sea_title: "Песни моря"
 songs_of_the_sea_desc: "Сборник народных сказок, записанных в изолированных общинах Западных островов. В центре внимания — фигура Морской королевы, правящей величественным подводным царством, и её двор давно утонувших моряков.\n\nПереплетённые с рассказами о воинах, моряках и мистиках описания древних обрядов, известных как «Соляные песни», которые могут как успокаивать, так и разъярять дикие океаны Запада."

 alkan_tabbot_title: "Жизнь Алкана Таббота"
 alkan_tabbot_desc: "Хотя автор этой книги утверждает, что это некий «Алкан Таббот», якобы моряк времён Второго Рана Кемсара, многочисленные апокрифические детали внутри её страниц делают это чрезвычайно маловероятным. Вместо этого истинным автором широко признаётся саррадонка Сафа Мели, которая, как известно, написала множество подобных псевдонимных произведений на протяжении своей карьеры. В книге описывается строительство Алканом подводного судна в форме дельфина и многие морские приключения, в которые он и его команда пускались."

 musings_on_flight_patterns_title: "Размышления о полёте птиц"
 musings_on_flight_patterns_desc: "Анонимный журнал, написанный как шифром, так и зеркальным письмом, содержащий заметки о птицах, ветрах и других метеорологических явлениях. Похоже, что для завершения текста потребовались заметки, собранные за целую жизнь. Его диаграммы, выполненные с изысканной детализацией, показывают механику полёта и свойства таинственных «путевых ветров»."

 sanasamadta_title: "Санасамадта"
 sanasamadta_desc: "Каширийского происхождения, эта книга подробно описывает легендарные жизни полудюжины исторических завоевателей, от исторически достоверного Отачеда до мифического Витраны, убийцы быков. Говорят, что это когда-то была популярная придворная поэзия, но с тех пор она вышла из моды. Её авторство приписывается поэту Ашкоре, хотя имя этого древнего мудреца часто приписывается анонимным работам для повышения их престижа."

 stony_affair_at_viridue_title: "Каменное дело в Виридивье"
 stony_affair_at_viridue_desc: "Одна из многочисленных пьес, описывающих приключения известного [Concept('magi','магам')|E]-Тектива Тены Пиралис, история знаменует собой первое вторжение Пиралис в королевства Шевалье. Она должна раскрыть тайну презираемого [Concept('court_magi','придворного мага')|E] Виридивье, который, по-видимому, был превращён в камень на свадьбе герцога. Удивительно, но она стала невероятно популярной в королевстве Де-Порт-де-Бастион после адаптации, переработавшей Пиралис в более героического и галантного персонажа."

 lessons_on_oejeynican_burials_title: "Урок о погребальных обрядах и практиках в поздний ойейницкий период"
 lessons_on_oejeynican_burials_desc: "В этой работе шевальенские учёные собрали сохранившиеся записи о древних и сложных погребальных обычаях Ойечинайнза."

 kassidius_diagrams_title: "Диаграммы Кассидия"
 kassidius_diagrams_desc: "Собранные заметки [Concept('aversaria','аверсарианского')|E] [Concept('magi','мага')|E] Кассидия, который посвятил свою долгую карьеру в Майикрате магической диссекции человеческих душ, чтобы правильно идентифицировать метафизические различия между нелюдьми и аверсарианцами. Говорят, что его лаборатория была крупнейшим потребителем рабов во всей академии в период её расцвета."

 lonely_spirit_title: "Книга одинокого духа"
 lonely_spirit_desc: "Дневник опахасийского [Concept('magi','мага')|E]-отшельника по имени Вервередекс, который пытался отделить свою душу от плотских оков тела."

 aversariancookinginformational_title: "Аверсарианская кулинарная информация"
 aversariancookinginformational_desc: "Это довольно... непрактичная поваренная книга, описывающая, как приготовить лучшие и величайшие яства в [Concept('aversaria','Аверсарии')|E]. Написанная, по-видимому, для знати, стоимость каждого ингредиента настолько высока, что даже аавтократа, скорее всего, отпугивала их. Мало того, каждое блюдо требует таких нечестивых магических сил для приготовления, что потребовало бы сотен жертвоприношений. Книга лучше всего служит предметом для разговора, в основном о том, почему аверсарианцы не уничтожили мир раньше. И уксус в свинцовых банках! Уксус в свинцовых банках!?"

 marcherswhatdoweknow_title: "Марочники: что МЫ знаем?"
 marcherswhatdoweknow_desc: "Эта книга — творение [Concept('aversaria','аверсарианского')|E] легона Парфаноса, который, как известно, на протяжении более тридцати лет последовательно выступал за необходимость вторжения в [chevalie|E]. «Марочники, что МЫ знаем» излагает предполагаемые причины его аргументов, от использования марочниками антимагических боевых искусств как доказательства того, что они существа из ада, и до того, почему мужественность их женщин сделала бы их плохими рабами для удовольствий."

 mightmagibuxommaiden_title: "Могучий маг и пышная дева: XXI"
 mightmagibuxommaiden_desc: "Этот популярный [Concept('aversaria','аверсарианский')|E] роман — один из многих в длинной серии аверсарианских любовных романов. Обычно считающийся нелепым в других уголках мира, он в пикантных, а иногда и непристойных подробностях описывает тлеющую похоть между исключительно мускулистым и мужественным магом с голым торсом и исключительно грудастой наивной девственной принцессой, падающей в его объятия. Почти все, кто его читает и осуждает, считают его отвратительным и написанным на детском уровне, и тем не менее он есть у большинства."

 fiftyshades_title: "Пятьдесят оттенков крови"
 fiftyshades_desc: "Этот [Concept('aversaria','аверсарианский')|E] любовный роман одновременно популярен и широко запрещён в приличном обществе. Описывая пикантный роман между доминирующим аверсарианским магом и его скромной рабыней, книга с мучительными подробностями описывает методы его ухаживания и непристойные кожаные приспособления, которые он в них использует. Широко считаясь плохо написанной и отвратительной, она, тем не менее, по-видимому, продаётся в неприличных количествах."

 adabyssianreport_title: "Адабисский доклад о северной цивилизации"
 adabyssianreport_desc: "Этот тщательно запечатанный свиток содержит пространный доклад, по-видимому, от адабисских шпионов, посланных на север для изучения севера и его народов в рамках подготовки к возможному вторжению. Со ссылками на доклады, датируемые примерно 300 лет до [frodbrokna|E], доклад в целом приходит к соглашению о том, что обитатели [Concept('sarradon','Саррадона')|E] и [Concept('aversaria','Аверсарии')|E], скорее всего, являются дальними родственниками человечества и имеют больше общего с человекоподобными животными, чем с цивилизованными видами."

 taleofsirkoeveux_title: "Сказание о сэре Кёвё"
 taleofsirkoeveux_desc: "«Сказание о сэре Кёвё» — это романизация старой [Concept('marchers','марочникской')|E] легенды о старшем сэре Кёвё, который так заблудился в своей старости, что каким-то образом оказался к северу от [Concept('the_lichdoms','Личеств')|E]. В рассказах повествуется о том, как сэр Кёвё сражается с бессмертной Ледяной Королевой, её зловещими [Concept('magi','магами')|E]-канцлерами и рыцарями, а также со злой группой инопланетян с чёрной кожей. Это милая история, которую обычно рассказывают детям, потому что она до смешного нелепа."

 imperialcivilwar_title: "Имперская гражданская война: от начала до конца"
 imperialcivilwar_desc: "Эта книга охватывает [Concept('imperial_civil_war','Аверсарианскую гражданскую войну')|E], которая произошла между аавтократом Эшреем и аавтократом Аксиотеей с 1186 по 1200 год от И.С. Книга, вместо очередного фантастического пересказа, представляет собой крайне сухой список биографий, карт и свидетельств очевидцев, созданный как учебное пособие для будущих поколений."

 nameofthewindknockoff_title: "Звук воздуха"
 nameofthewindknockoff_desc: "«Звук воздуха» — это [Concept('aversaria','аверсарианский')|E] любовно-приключенческий роман, который был довольно популярен до [Concept('frodbrokna','Фродброкны')|E]. Описывая восхождение аавтократа Эшрея и изображая его самым талантливым юношей в истории Аверсарии, книга уделяет много внимания его времени, проведённому в [Concept('mayikrata','Майикратию')|E], и соперничеству и роману с его великой соперницей Аксиотеей. Будучи очень популярной и быстро получившей продолжение, серия так и не получила третьей книги после Фродброкны и конца света."

 tragedyinoejeynica_title: "Трагедия в Ойейнице"
 tragedyinoejeynica_desc: "Эта серия эссе смешанной группы учёных [Concept('aversaria','аверсарианского')|E]-шевальенского происхождения представляет собой обширный анализ того, какие именно решения и события привели к [Concept('sorrowing_of_oejeynica','Скорби по Ойейнице')|E] и возвышению [Concept('the_lichdoms','Личеств')|E]. Хотя, возможно, она чрезмерно детальна и суха, книга содержит некоторые прозрения в магию и способы предотвращения некоторых из её худших проявлений."

 sarradoniansteps_title: "1001 саррадонский шаг"
 sarradoniansteps_desc: "«1001 саррадонский шаг» — это серия рассказов, каждый из которых ведётся от лица члена другой [Concept('ritualism','ритуалистской')|E] секты. Будучи глубоким культурным символом для ритуалистов и обычно считаясь одной из вершин саррадонской литературы, книга тем не менее безнадёжно устарела в течение десятилетия после публикации: почти все секты, упомянутые в книге, либо вымерли, либо распущены, либо объединены, либо переименованы, либо выслежены, либо заменены вдвое большим их числом."

 chivalriccode_title: "Рыцарский кодекс"
 chivalriccode_desc: "«Рыцарский кодекс» — это трактат о том, как истинный [Concept('marchers','шевальенский')|E] рыцарь должен вести себя в повседневной жизни. Книга отводит целую четверть своих страниц тому, как сражаться и благородно относиться к другим, роли крестьянства в обществе, мудрым знаниям о защите слабых и победе над [Concept('undead','нежитью')|E], прежде чем потратить оставшиеся 300 страниц на подробное описание прибыльных зарубежных рынков, советы по ведению переговоров о плате наёмникам и известные иностранные стили боя и способы убийства их практиков."

 griffonbestiary_title: "Бестиарий грифонов"
 griffonbestiary_desc: "Этот бестиарий представляет собой описание различных пород [Concept('marchers','шевальенских')|E] [Concept('griffons','грифонов')|E] и советы по их разведению и дрессировке. Когда-то считавшийся необходимым для многих будущих наездников на грифонах, сегодня он более ценен как исторический артефакт, с подробными и хорошо нарисованными картинками и диаграммами нескольких ныне вымерших пород."

 lasthippogriff_title: "Последний гиппогриф"
 lasthippogriff_desc: "«Последний гиппогриф» — это трагическая серия сочинений марочникского учёного Абаэля Венодау, подробно описывающая его изучение и дружбу с гиппогрифом Кетти, который, как полагают, был последним из своего вида. Книга прослеживает родословную Кетти и кратко описывает историю гиппогрифов от их первого обнаружения шевальенцами до их вымирания из-за чрезмерного использования в [Concept('marcher_aversarian_wars','Войн Марки и Аверсарии')|E]."

 howtomaimadragon_title: "Как покалечить дракона"
 howtomaimadragon_desc: "[Concept('aversaria','Аверсарианское')|E] руководство о том, как лучше всего убить [Concept('dragons','дракона')|E], является предметом ожесточённых споров о том, была ли книга написана до или после вторжения дракона [arthenax|E]. Разница, утверждают они, решила бы, является ли руководство точным руководством, вдохновлённым убийством, или фантастическим взглядом на мальчика, убивающего своего домашнего дракона."

 loveanddeathinasiupoli_title: "Любовь и смерть в Асиуполе"
 loveanddeathinasiupoli_desc: "«Любовь и смерть в [GetTitleByKey('c_asiupoli').GetNameNoTier]» — это [Concept('aversaria','аверсарианская')|E] серия коротких рассказов о колеблющемся бывшем легионере в городе [GetTitleByKey('c_asiupoli').GetNameNoTier], работающем наёмным мускулом. Нанятый красивым магом, чтобы найти убийцу её мужа, прожжённый легионер прокладывает путь через опасную паутину криминальных семей города, а также через свои внутренние демоны."

 silastavroaliveordead_title: "Силас Ставро — жив или мёртв!?"
 silastavroaliveordead_desc: "«Силас Ставро — жив или мёртв!?» — это серия [Concept('marchers','шевальенских')|E] (в основном записанных под диктовку) книг и памфлетов всё более пожилого и эксцентричного Абаэля Венодау. Серия остаётся крайне противоречивой по сей день из-за её кажущейся поддержки ставроистских верований; она утверждает, что архилич [silas_stavro|E] на самом деле не был убит во время вторжения в Марки и поражения от рук [Concept('champion_of_chevalie','Героя Шевалье')|E], а на самом деле жив и регулярно навещает Абаэля, чтобы насладиться чаем и дебатами о любовной литературе. Её критики утверждают, что это хороший пример того, что Венодау сошёл с ума, а её сторонники называют это фантастическим метафорическим произведением."

 howtoreadabook_title: "Как читать книгу"
 howtoreadabook_desc: "Короткий рассказ, предназначенный для обучения марочникских крестьян чтению и письму, этот экземпляр — один из сотен, созданных по настоянию лорда Кавина Шевона, который желал провести великие реформы для улучшения жизни крестьян, но также считается не имеющим никакого понимания управления. Похоже, что Шевон осознал свою ошибку вскоре после создания последней книги, потому что он внезапно прекратил программу и потребовал сжечь все копии книги."

 purelifefifth_title: "О чистой жизни — пятое издание"
 purelifefifth_desc: "«О чистой жизни» — одна из десятков книг, написанных агионистским святым Катаритосом. Сосредоточенная на том, как прожить жизнь наиболее полно и как действовать и относиться к другим, чтобы получить от неё наибольшее удовольствие, многие предложения в книге, по-видимому, прямо противоречат большей части агионистского канона.\n\nПравки, внесённые в различные издания, переосмыслили и откровенно переписали несколько стихов в попытке перевести их на современный язык, объясняя, что доктринальные конфликты были просто плохими переводами или недопониманием текста, а также объясняя, что, как самый плодовитый из агионистских святых, Катаритос неизбежно имел бы некоторые незначительные противоречия."

 purebodyfifth_title: "О достижении чистого тела — пятое издание"
 purebodyfifth_desc: "«О достижении чистого тела» — одна из десятков книг, написанных агионистским святым Катаритосом. Сосредоточенная на том, как усовершенствовать своё тело и что на самом деле означает обладание чистой кровью и чистым телом, многие предложения в книге, по-видимому, прямо противоречат большей части агионистского канона.\n\nПравки, внесённые в различные издания, переосмыслили и откровенно переписали несколько стихов в попытке перевести их на современный язык, объясняя, что доктринальные конфликты были просто плохими переводами или недопониманием текста, а также объясняя, что, как самый плодовитый из агионистских святых, Катаритос неизбежно имел бы некоторые незначительные противоречия."

 puremindfifth_title: "О создании чистого разума — пятое издание"
 puremindfifth_desc: "«О создании чистого разума» — одна из десятков книг, написанных агионистским святым Катаритосом. Сосредоточенная на том, как тренировать свой разум, чтобы он был свободен от нечистот, таких как ненависть и сомнение, и поддерживать позитивный взгляд на жизнь, многие предложения в книге, по-видимому, прямо противоречат большей части агионистского канона.\n\nПравки, внесённые в различные издания, переосмыслили и откровенно переписали несколько стихов в попытке перевести их на современный язык, объясняя, что доктринальные конфликты были просто плохими переводами или недопониманием текста, а также объясняя, что, как самый плодовитый из агионистских святых, Катаритос неизбежно имел бы некоторые незначительные противоречия."

 purelifefirst_title: "О чистой жизни — первое издание"
 purelifefirst_desc: "«О чистой жизни» — одна из десятков книг, написанных агионистским святым Катаритосом. Сосредоточенная на том, как прожить жизнь наиболее полно и как действовать и относиться к другим, чтобы получить от неё наибольшее удовольствие, многие предложения в книге, по-видимому, прямо противоречат большей части агионистского канона.\n\nЭто первое издание — чрезвычайно редкая и часто уничтожаемая копия, написанная собственной рукой святого, что ясно показывает, насколько его собственные взгляды отличаются от современной интерпретации. Один из самых примечательных стихов гласит: «И да будет известно, что сердце самой чистой жизни заключается в следующем: в доброте, в сострадании и в любви. Любите своих друзей и семью, и ближнего своего, и всех, кого встретите, ибо только любовь спасёт вашу душу»."

 purebodyfirst_title: "О достижении чистого тела — первое издание"
 purebodyfirst_desc: "«О достижении чистого тела» — одна из десятков книг, написанных агионистским святым Катаритосом. Сосредоточенная на том, как усовершенствовать своё тело и что на самом деле означает обладание чистой кровью и чистым телом, многие предложения в книге, по-видимому, прямо противоречат большей части агионистского канона.\n\nЭто первое издание — чрезвычайно редкая и часто уничтожаемая копия, написанная собственной рукой святого, что ясно показывает, насколько его собственные взгляды отличаются от современной интерпретации. Один из самых примечательных стихов гласит: «Не нам судить тех, чьи тела рождены слабее, или меньше, или искривлены, или совершенны. Чистота тела измеряется не его структурой или формой, оно измеряется заботой и любовью, с которыми оно представлено и создано. Самая красивая из куртизанок может таить в себе самое жестокое и нечистое сердце, а искалеченный раб может оставаться более чистым, чем даже самый могущественный из магов-лордов»."

 puremindfirst_title: "О создании чистого разума — первое издание"
 puremindfirst_desc: "«О создании чистого разума» — одна из десятков книг, написанных агионистским святым Катаритосом. Сосредоточенная на том, как тренировать свой разум, чтобы он был свободен от нечистот, таких как ненависть и сомнение, и поддерживать позитивный взгляд на жизнь, многие предложения в книге, по-видимому, прямо противоречат большей части агионистского канона.\n\nЭто первое издание — чрезвычайно редкая и часто уничтожаемая копия, написанная собственной рукой святого, что ясно показывает, насколько его собственные взгляды отличаются от современной интерпретации. Один из самых примечательных стихов гласит: «Сосредоточить свой разум — значит не поддаваться магии или не удалять все мысли о сострадании и доброте. Это значит оставаться открытым для новых идей, быть готовым к познанию чужих обычаев и сохранять чистоту мысли, чтобы воспринимать странные и неприятные взгляды и видеть в них собрата-человека»."

 travelsofsaintkatharitos_title: "Путешествия святого Катаритоса"
 travelsofsaintkatharitos_desc: "Эта книга — предполагаемая автобиография святого Катаритоса о различных историях его путешествий по [Concept('aversaria','Аверсарии')|E], [chevalie|E] и [Concept('sarradon','Саррадону')|E]. Книга в разных частях захватывающая, глубокая и душераздирающая, и обычно считается главным трудом Катаритоса. Широко переиздаваемая, она считается одним из величайших произведений в современном обращении, и пьесы по ней широко популярны по всему известному миру."

 hundredtrials_title: "Сто испытаний святой Сансии"
 hundredtrials_desc: "«Сто испытаний святой Сансии» — это полубиографический художественный роман, повествующий о жизни агионистской святой Сансии, от её рождения до жертвоприношения у Стояния Мучеников. Каждая глава посвящена разному периоду её жизни и одному из многих легендарных испытаний, с которыми она столкнулась на каждом этапе своего трудного пути от сироты до святой. Хотя многие из финальных посланий кажутся прямо противоречащими современным агионистским верованиям, каждый финал также содержит раздел, написанный автором, примиряющий его с агионистской доктриной, объясняя, что текст строго метафоричен."

 bookofremedies_title: "Тисская книга средств"
 bookofremedies_desc: "Эта книга представляет собой перечень лекарств и средств от различных болезней и недугов, как распространённых, так и редких, с использованием как лучших доступных ингредиентов, так и местных, чтобы даже крестьянство могло извлечь пользу из её знаний. Хотя в целом книга уважается и до сих пор широко используется лекарями, она тратит спорное количество времени, требуя, чтобы читатель «омыл руки, которые лечат, в чистейшей воде и спирте» — шаг, который большинство современных читателей считает не более чем пустой церемонией. Другая глава, часто удаляемая за нерентабельность печати, говорит о том, что болезни на самом деле распространяются маленькими злыми существами, невидимыми для человеческого глаза, что обычно считается фантазией по сравнению с научно доказанным существованием гуморов."

 saintslawbook_title: "Законник святого Дикайноса"
 saintslawbook_desc: "Эта книга представляет собой собрание судебных заседаний, которые посещал или законов, созданных агионистским святым Дикайносом во время его работы юристом. В отличие от большинства [Concept('aversaria','аверсарианских')|E] юристов, Дикайнос всегда настаивал на том, что закон должен действовать независимо от положения, расы или убеждений человека, и обычно прилагал большие усилия, чтобы не знать имён, пола или происхождения тех, кого он судил. Хотя многие дела были изъяты из записей или подвергнуты цензуре, это тем не менее служит хорошим руководством по следованию дикайносскому методу справедливого закона и суда присяжных."

 rendingthechains_title: ""Разрывая цепи" святого Калисто"
 rendingthechains_desc: "«Разрывая цепи» — это серия эссе, якобы написанных святым Калисто, покровителем агионистского Ордена Ключа святого Калисто. Книга в основном обсуждает, как лучше всего освобождать нуждающихся, наиболее примечательно — путём насильственного порабощения их, а затем принуждения их работать до смерти на службе истинно верующим, чтобы они могли переродиться в следующей жизни как истинно верующие, которые затем могут попасть в положительную загробную жизнь после смерти. Хотя часто считается евангелием Орденом Калисто, многие учёные считают, что книга была на самом деле написана через несколько десятилетий после его смерти неагионистскими авторами."

 calystojournal_title: "Личный дневник Калисто «Волнореза»"
 calystojournal_desc: "Эта потрёпанная непогодой книжечка — не более чем несколько десятков грязных страниц, заключённых в треснувший кожаный переплёт. На первой странице грубыми буквами выведено «Калисто Кейн», и, по-видимому, это личный дневник агионистского святого и (забытого большинством) печально известного пирата Калисто.\n\nДневник уделяет мало времени личным записям или философии, а структура предложений и орфография большей части текста предполагают, что святой Калисто либо имел какой-то недостаток, либо научился грамоте только в позднем возрасте. То, что содержит дневник, — это многочисленные диаграммы, графики, размышления и идеи. Все они свидетельствуют о мастере и изобретательном моряке, способном разрабатывать улучшения для своих кораблей, но они также показывают несколько списков различных невольничьих рынков и рынков по всему [Concept('aversaria','Аверсарии')|E], с указанием лучшего времени для нападений и маршрутов транспортировки рабов в безопасные убежища. В конце книги даже перечислены различные аверсарианские дворяне и магистраты, названные видными сторонниками рабства, которых следует «устранить»."

 eosianswordcharter_title: "Эосианская хартия меча"
 eosianswordcharter_desc: "«Эосианская хартия меча» — это якобы книга о фехтовании и поведении в бою, написанная самим святым Эосом. Книга охватывает множество техник, от странных и чужеземных, с вдохновением, почерпнутым, как утверждается, из далёких уголков мира, куда Эос путешествовал как наёмник, но также и о справедливом и уважительном отношении к врагам и союзникам. В отличие от многих современных руководств по ведению войны из [Concept('aversaria','Аверсарии')|E], «Эосианская хартия меча» делает сильный акцент на уважении, милосердии и защите слабых как на «праведных» путях, чтобы прожить свою жизнь и достичь совершенства как воин и как олицетворение храбрости."

 masuherid_tribe_and_their_ways_title: "Описание племени Масухерид и их обычаев"
 masuherid_tribe_and_their_ways_desc: "Книга, написанная странствующим писцом, который жил среди Масухерид несколько сезонов. Она записывает их обычаи, истории и повседневные практики в мельчайших подробностях."

 tablet_of_the_first_dreamers_title: "Табличка Первых Сновидцев"
 tablet_of_the_first_dreamers_desc: "Перевод архаичного текста, описывающего искажённую версию заоранийской мифологии, где Майя причисляется к [gh_amsari_first_dreamers|E]. Повествование резко расходится с известными амсарскими традициями, изображая Сновидцев как центральных фигур творения наряду с Заораном. Его отвергли как преднамеренную пародию, эксцентричную попытку юмора, а не подлинное изложение веры."

 compendum_five_fathers_title: "Компендиум пяти отцов"
 compendum_five_fathers_desc: "Поистине огромный компендиум пяти основополагающих текстов [GetReligionByKey('wardenism_religion').GetName] — «Столпов добродетели», «Протоколов суда Первого Вардена», «Книги дней», «Видений» и «Маргиналий»."

 dangerofathousandstars_title: "Опасность тысячи звёзд"
 dangerofathousandstars_desc: "Эта книга, написанная неизвестным автором, на первый взгляд кажется не чем иным, как книгой безумных бредней и эзотерических теорий заговора о древних богах и жестоких чуждых властителях. Несмотря на это, многие последователи Забытого Святого утверждают, что книга была написана рукой самого Святого, и многие последователи носят копию при себе, веря, что Забытый Святой был всевидящим существом."

 bannediyrossipoetry_title: "Книга запрещённой поэзии ийроссов"
 bannediyrossipoetry_desc: "Эта книга представляет собой сборник сотни или около того стихотворений, написанных различными литераторами ийроссов на протяжении тысячелетий с момента их порабощения. Подавляющее большинство поэзии либо чрезвычайно скабрёзно, либо подробно рассуждает об отражении [Concept('aversaria','аверсарианской')|E] крови в [Concept('aervalr','лунном свете')|E]. Хотя строго запрещены аверсарианцами, именно ийроссы исторически уничтожали такие книги, опасаясь возмездия аверсарианцев против всей их культуры."

 aeladaxostoaeliadias_title: "От Эладакса до Элиадии"
 aeladaxostoaeliadias_desc: "Эта книга — широко издаваемая публикация, описывающая жизнь аавтократа Элиадии, правившей в VI веке. Хотя книга охватывает большую часть её более чем столетнего правления, её победу над [Concept('dragons','драконом')|E] [arthenax|E], её огромные магические силы и масштабное восстановление [Concept('aversaria','Аверсарии')|E], которое она провела, более половины книги посвящено её знаменитому происхождению. В основном обсуждается довольно спорный момент её жизни, когда она родилась как Эладакс, но, недовольная своим положением мужчины, использовала могущественную магию, чтобы принять женственность.\n\nАвтор, некий [Concept('magi','маг')|E] Калафрос, тратит много времени на критику критиков этой идеи. Калафрос указывает, что Элиадия была аверсарианским магом и совершила свою трансформацию полностью своей собственной силой и по своей воле, и утверждает, что это следует скорее прославлять как истинный подвиг магии и самовыражения."

 compiledworksofvenodau_title: "Собрание сочинений Абаэля Венодау"
 compiledworksofvenodau_desc: "Эта книга представляет собой сборник самых популярных пьес, сказок, стихов и трактатов, написанных эксцентричным писателем IX века Абаэлем Венодау. Самыми известными из них являются одиннадцать сатирических и романтических стихов, которые установили концепцию единой шевальенской идентичности и Братства Шевалье."

 pillarsofaversaria_title: "Столпы Аверсарии"
 pillarsofaversaria_desc: "Широко рассматриваемый как один из самых всеобъемлющих обзоров [Concept('aversaria','протоаверсарианской')|E] истории, этот толстый том является компендием хроник того, что на момент его написания в начале IV века считались одиннадцатью величайшими городами-государствами аверсарианской древности — Орасбаэль ([GetTitleByKey('c_oraispol').GetNameNoTier]), Тильон (Тилоссос), Валтронакс (Вафассус), Андрон (Андрин), Фелакс (Фануриас), Кадмейбаэль (современное местоположение неизвестно), Гортильон (Гортиллай), Навсипакс (Наупирна), Фанара (Фанара), Аспомнокс (Аспомнос) и Висбаэль (Визарополь)."

 ontheoriginofmankind_title: "О происхождении человечества"
 ontheoriginofmankind_desc: "Эта книга охватывает вечные, горячие споры о том, произошли ли [Concept('aversaria','аверсарианцы')|E] из Палитаки или с Острова Башен, или по крайней мере состояние дебатов на момент выпуска работы Архилоигосом Сокониасом в 1125 году. Хотя она пытается занять умеренную позицию и приводит аргументы для обеих точек зрения, внимательный учёный может ясно почувствовать пробалитакийскую предвзятость."

 ataleoftwocities_title: "Повесть о двух городах"
 ataleoftwocities_desc: "Часть эпос, часть хроника, это произведение прослеживает тысячелетнее соперничество между [Concept('aversaria','протоаверсарианскими')|E] городами-государствами Валтронакс и Андрон. Начиная с их мифического основания около 900 года до И.С. двумя разлучёнными братьями, оно охватывает легендарные (и, вероятно, сильно преувеличенные) триста лет войны между ними впоследствии, их противоположные роли в войнах Пунцово-Синих Лиг, их вечную смену сторон во время вторжения Араккариака, их одновременные предательства Парфенаксы у Каллана из-за ошибочного убеждения, что она замышляла против одного с другим, и, наконец, их падение перед армиями Дхаценокса в 7 году до И.С., который предварительно обманул обоих, заставив сражаться друг с другом."

 parthenaxiada_title: "Парфенаксиада"
 parthenaxiada_desc: "Биография воительницы-чародейки начала I века до И.С. Парфенаксы и хроника четырёх войн, которые будут носить её имя. После краткого введения о её относительно неясном происхождении, действие начинается с её переворота в 91 году до И.С. в Фанаре, последующего завоевания большей части Острова Башен в первой и второй Парфенаксических войнах, её вторжения в Палитаку в 79 году до И.С. в третьей, её поражения у Каллана четыре года спустя и изгнания, её чудесного и блестящего возвращения к власти в 73 году до И.С. и, наконец, окончательного поражения и самоубийства у реки Амис в 68 году до И.С.\n\nХотя её попытка объединить враждующие [Concept('aversaria','протоаверсарианские')|E] полисы не увенчалась успехом, два десятилетия беспрестанной войны и хаоса стали фактическим гвоздём в крышку гроба для уже угасающей [Glossary('системы городов-государств','GH_POLISOCRACY_GLOSS')] и подготовили почву для собственного объединения Дхаценоксом."

 edgeoftheworld_title: "Край света"
 edgeoftheworld_desc: "Тилонакс, пожалуй, самый легендарный корсар во всей [Concept('aversaria','аверсарианской')|E] истории, как говорят, окрасил побережья мира в красный две тысячи лет назад, прежде чем выманить у туземцев архипелаг Ранфус и основать там свой одноимённый город. Хотя мифы о его бесчисленных приключениях почти наверняка являются смешением различных историй, накопленных в огромный промежуток времени между его предполагаемым правлением и их компиляцией, и его собственное существование зиждется на сомнительных доказательствах, фантастические истории оставались популярными на протяжении всей истории."

 ninetysixtasks_title: "Девяносто шесть задач Навсиаксы"
 ninetysixtasks_desc: "Прекрасная, цветистая поэма, пересказывающая легендарные девяносто шесть задач, предпринятых безымянным героем, который добивался руки полубогини Навсиаксы в браке в далёком начале времён, прежде чем, как говорят, основать семью — и город Навсипакс (современная Наупирна) с ней. В разных частях радостная, душераздирающая, мрачная, а местами откровенно странная и, казалось бы, несвязная, эта работа широко восхваляется как один из венцов [Concept('aversaria','аверсарианской')|E] литературы. Примечательно, что многие из записанных внутри задач на самом деле являются ритуалами силы, используемыми магами по сей день."

 natureofmatter_title: "Трактат о природе материи"
 natureofmatter_desc: "Редкая коллекция сохранившихся работ Хасиакса, загадочного философа, математика и [Concept('magi','мага')|E] из Аспомнокса IV века до И.С. Родом из Висбаэля, его неортодоксальная школа мысли проповедовала спорную догму, которая в конечном итоге привела к его бегству в близлежащий Аспомнокс, либеральные правители которого были более склонны позволять ему преподавать своё учение в мире. Сегодня его помнят в основном за его роль в основании первой известной академии, которая исключительно изучала то, что стало [Concept('dead_magic','мёртвой магией')|E], и Аспомнокс продолжал сохранять отличие единственного крупного [Concept('aversaria','протоаверсарианского')|E] [Glossary('города-государства','GH_POLISOCRACY_GLOSS')], который в основном использовал её, а не [living_magic|E], на протяжении всей своей независимой истории."

 ruleofmany_title: "Правление многих"
 ruleofmany_desc: "Анализ и восхваление любопытной политической системы [Concept('aversaria','протоаверсарианского')|E] [Glossary('полиса','GH_POLISOCRACY_GLOSS')] Наупирны, написанный местным аристократом по имени Клейстханакс, вероятно, в конце I века до И.С. Столетия правления династии Эстраексов были прекращены в 421 году до И.С., когда последний монарх города, порочный, безумный и, вероятно, каннибал Диоксанекс Младший, был свергнут в кровавом перевороте, уничтожившем всю его линию. Не сумев договориться о преемнике, горожане вместо этого решили выбрать правителя из своих рядов, собрав всех [Concept('magi','магов')|E] и предоставив каждому проголосовать за того, кто должен занять трон. Так была избрана Элиаксея, великая реформаторка и первая, кто носил титул Арконир.\n\nПосле успешного 17-летнего правления, вместо того чтобы передать трон своему старшему ребёнку, как это было принято, она решила снова созвать магов города, чтобы выбрать преемника — и так родилась 400-летняя традиция."

 thedragonandthescorpion_title: "Дракон и скорпион"
 thedragonandthescorpion_desc: "Эпический пересказ попытки завоевания [Concept('aversaria','протоаверсарианского')|E] мира Саррадонской империей Араккариак в конце IV века до И.С. Хотя рассказ, безусловно, захватывающий, он не делает ни малейшей попытки быть объективным. Главный вражеский генерал, Нарамашшин ад Хадур, разрушитель Навсипакса, сжигатель Орасбаэля и мясник Артексиса, особенно очернён до почти абсурда. Тем временем подвиги аверсарианских защитников преувеличены до такой степени, что соперничают с подвигами самих Первых людей."

 arakkariacwar_title: "История войны с Араккариаком"
 arakkariacwar_desc: "В отличие от большинства других работ на эту тему, этот сухой и технический том пытается объективно проанализировать войну с Араккариаком, которая охватила большую часть [Concept('aversaria','протоаверсарианского')|E] мира с 338 по 332 год до И.С.\n\nОн опровергает многочисленные ошибочные взгляды на войну, которые господствуют в массовом сознании — во-первых, что аверсарианцы Острова Башен были порабощены и ритуально съедены после завоевания араккариаками в 393 году до И.С. Во-вторых, что вторжение Нарамашшина было совершенно неоправданным, что опровергается многочисленными записями о провокациях орасбаэльцев, валтронаксов и тилоников в годы, предшествовавшие конфликту. Наконец, утверждение, что царство Араккариак было разбито и отступило после битвы на холме Пелон, вместо этого изображая её как важное, но в конечном счёте относительно небольшое столкновение, которое лишь доказало бесперспективность продолжения конфликта.\n\nБолее того, работа утверждает, что завоевание, вероятно, было бы успешным в любом случае, если бы империя не распалась в кровавой гражданской войне после того, как её монарх умер в том же году, что и битва."

 lostpolis_title: "Затерянный полис"
 lostpolis_desc: "Анализ одной из величайших загадок ранней [Concept('aversaria','аверсарианской')|E] истории — полного исчезновения гегемонистского [Glossary('города-государства','GH_POLISOCRACY_GLOSS')] Кадмейбаэль в середине II века до И.С. Последняя известная запись, упоминающая город, датируется 179 годом до И.С. и не отмечает признаков упадка или бедствия, но после этого ранее крупный полис просто исчезает из всех записей навсегда.\n\nНазвание поселения не упоминается снова до III века от И.С., когда Диоклея из Какузы первой отмечает эту странную историческую аномалию. С тех пор было выдвинуто множество объяснений — магическая катастрофа, эффект особенно мощной Гедеоры, но также и более обыденные причины — например, намеренное стирание из живой памяти после проигранной войны против одного из многих соперников.\n\nВ любом случае, его местонахождение остаётся неизвестным по сей день, подпитывая мифы о том, что затерянный город является домом для богатств и власти, превосходящих человеческое воображение."

 mawtalmunininguide_title: "Вечный Господь"
 mawtalmunininguide_desc: "Часто считающийся основополагающим текстом для секты Мавталмунинин ритуалистов, этот мрачный том утверждает, что сама Смерть является единственной истинной силой на [aeras|E]. Ни один другой бог никогда не проявлял себя так хорошо известным народам мира, как смерть, и хотя любой может сомневаться в существовании божества, только безумец будет сомневаться в существовании смерти. Хотя самоубийство не предписывается явно — мавталмунинин ещё не придумали, как распространять своё спасительное послание из-за могилы — книга поощряет жизнь без заботы о собственном благополучии."

 expeditiontothenorth_title: "Экспедиция к Северному источнику: доклад"
 expeditiontothenorth_desc: "Всесторонний доклад об экспедиции Аверсарианского картографического союза 983 года к источнику [Concept('northern_wayline','Северной лей-линия')|E]. Одна из трёх известных крупных попыток совершить это достижение, она примечательна также тем, что является единственной, от которой сохранились записи — экспедиция 1101 года исчезла бесследно, а записи об экспедиции 531 года [Concept('kartharadd','картараддцев')|E] сгорели дотла при уничтожении Империума.\n\nХотя она началась с большим оптимизмом, команда [Concept('magi','магов')|E] и исследователей быстро столкнулась с нарастающими трудностями, враждебным и мрачным ландшафтом, повышающимся фоновым уровнем магии и магической болезнью. В конечном счёте команда была вынуждена повернуть назад за несколько сотен лиг до цели, отметив, что ни одна башня не была видна с их места, и сделав вывод, что источник может быть погребён или иметь фундаментально иную природу, чем Морская башня, но, безусловно, недоступен.\n\nТревожно, несколько членов экспедиции к тому времени, когда группа повернула назад, впали в бред и вместо этого продолжили свой путь к почти верной гибели."

 howtheendbegan_title: "Как начался конец"
 howtheendbegan_desc: "То, что начинается как обычный военный журнал Легиона XXVI, быстро превращается в хаотичное собрание заметок, карт и отчётов, начиная с 1202 года. Хотя лихорадочный почерк и аннотации едва разборчивы, это один из самых ясных взглядов на происхождение и первые наблюдения [Concept('the_fog','Тумана')|E].\n\nСначала говоря о внезапном появлении большого количества доселе неизвестных племенных народов из внутренних областей континента, затем анализируя странные и сбитые с толку отчёты, полученные от пленных, и, наконец, первые наблюдения самого феномена в 1203 году. Автор, предположительно Легон, проливает свет на свои попытки предупредить правительство в [GetTitleByKey('c_oraispol').GetNameNoTier] о надвигающейся угрозе, получая лишь молчание в лучшем случае или откровенные насмешки и обвинения в измене в худшем.\n\nПоследний отчёт датирован 1221 годом, писатель, по-видимому, был смертельно ранен во время битвы с доселе неконтактными племенами, марширующими на север с какой-то неизвестной целью. Самая последняя запись фиксирует клятву, данную всеми присутствующими, больше не служить прихотям какого-либо мелкого аавтократа, а интересам всего человечества, и что единственным врагом, которого они отныне будут знать, будет не человек, а разлагающие объятия самого Тумана."

 refutation_of_the_phantasmal_mist_title: "Опровержение призрачного тумана"
 refutation_of_the_phantasmal_mist_desc: "Официальное расследование [Concept('mayikrata','Майикратии')|E] тогда только что возникшего [Concept('the_fog','Тумана')|E], написанное в 1211 году неким магистром Прокопионом. Сказать, что к вопросу отнеслись легкомысленно, было бы преуменьшением; тон скорее напоминает шутку, чем академический текст.\n\nОсновная часть работы состоит из пошагового опровержения всё более лихорадочных мольб о поддержке со стороны Легона Иолиана из Легиона XXVI «Эксодиан», отправленных как в сам [GetTitleByKey('e_mayikrata').GetNameNoTier], так и в эшреевскую администрацию [GetTitleByKey('c_oraispol').GetNameNoTier]. Главные аргументы Прокопиона против существования Тумана — ненадёжность свидетельств племён, внутренняя абсурдность магического феномена, не связанного явно ни с живой, ни с мёртвой школами, возможность приписать многие из наблюдаемых странных событий более обыденным причинам и предполагаемые аксиотейские симпатии Иолиана. Идея позволить варварским племенам мигрировать в собственно [Concept('aversaria','Аверсарию')|E] высмеивается с особым презрением.\n\nРазумеется, работа не выдержала испытания временем, и [GetTitleByKey('e_mayikrata').GetNameNoTier] тихо открестился от неё и магистра Прокопиона через несколько десятилетий после публикации."

 inquiryintothefog_title: "Официальное расследование вопросов Тумана"
 inquiryintothefog_desc: "После того как работа магистра Прокопиона была тихо внесена в чёрный список в 1235 году, [Concept('mayikrata','Майикратия')|E] запустила ещё одно расследование природы [Concept('the_fog','Тумана')|E], на этот раз гораздо более серьёзное. В отличие от предыдущего издания, оно никогда не пытается отрицать или даже преуменьшать его существование, и хотя тон старается оставаться холодным и академическим, между строк ощущаются неоспоримые намёки на срочность.\n\nВ буклете сообщается, что все попытки магов, посланных в Великую Аверсарию, чтобы остановить Туман, полностью провалились, а исследования его природы и происхождения дали мало информации. Кроме того, он подтверждает ранее непроверенные сообщения о племенных людях, обитающих внутри, но отмечает, что все попытки общения встречали враждебность, и что единственный живой пленник — который практически постоянно пытался покончить с собой, пока не преуспел — не говорил ни на одном языке, известном учёным или переводчикам варваров.\n\nНаконец, он касается слухов о новой, третьей школе магии, связанной с Туманом и используемой племенными магами, но не выносит здесь окончательного суждения, утверждая, что текущие доказательства в лучшем случае неубедительны."

 clockworkcity_title: "Механический город"
 clockworkcity_desc: "Путевые заметки шевальенского путеводного отца Климента из Васконта, получившего редкое разрешение от картараддского императора посетить их столичный город в 427 году от И.С. Описания почти утопичны, повествуют о счастливом, лояльном населении, работающем в унисон во славу своего суверена. Конечно, эта картина резко контрастирует с тем, что даже беспристрастные учёные сказали бы об условиях жизни в Империуме, заставляя многих отвергать книгу как не более чем пропагандистский материал, написанный Климентом, чтобы втереться в доверие к своему покровителю.\n\nГораздо больший интерес для рядового читателя представляют довольно увлекательные страницы, рассказывающие о самом городе — впечатляющей метрополии из мрамора и латуни, с часовыми автоматами, по-видимому, вплетёнными во все аспекты жизни. Достоверность этих частей книги никогда не подвергалась сомнению, ибо картараддцы были широко известны своим мастерством в механике.\n\nЛюбопытно, что, хотя кажется, что в работе несколько раз упоминалось название города, на самом деле невозможно прочитать эти конкретные слова. В зависимости от читателя, они либо просто пустые промежутки в тексте, либо искажены до неузнаваемости."

 annalsofblank_title: "Анналы и родословные ---------"
 annalsofblank_desc: "Широко постулируется, что это была официальная история правителей картараддцев, однако книга теперь практически бесполезна, поскольку магические влияния сделали её полностью лишённой полезной информации. Её содержание варьируется в зависимости от читателя — некоторые сообщают, что она просто заполнена пустыми страницами, другие — что она написана на совершенно неизвестном им языке или письме, в то время как третьи утверждают, что, хотя слова и на их родном языке, текст кажется просто бессмысленным набором слов без какой-либо различимой логики, и что попытки осмыслить их приводят к сильной головной боли и тошноте."

 whenaervalbleed_title: "Когда Эрвал истёк кровью"
 whenaervalbleed_desc: "Написанная в 773 году отставным [Concept('magi','магом')|E] и ветераном [Concept('kartharadd','картараддских')|E] войн Периаксисом Лейсистратосом, книга представляет собой анализ печально известных событий ночи [Concept('night_of_the_bleeding_moon','23-го вельда 748 года')|E], свидетелем которых автор был лично. Будучи частью легиона, отправленного глубоко на территорию картараддцев во время катастрофы, он описывает быструю смерть и мучительную агонию, предшествовавшую ей, почти всего Империума в леденящих душу подробностях, не имеющих себе равных ни в одной другой работе.\n\nОн также высказывает сомнения в утверждениях о том, что [Concept('aversaria','Аавтократия')|E] сама вызвала атаку. В два десятилетия после той ночи, несмотря на поиски информации у бесчисленных магов и высокопоставленных лиц в армии, он так и не нашёл никого, кто знал бы заранее о том, что должно было произойти в тот роковой день — на самом деле, все силы Аверсарии, по-видимому, были застигнуты врасплох. Вместо этого Периаксис предполагает, что произошедшее было на самом деле попыткой масштабной магической атаки на саму Империю, и что катаклизм на самом деле предназначался для Этепезеи, но провалился по неизвестным причинам."

 treatiseofgoodpractice_title: "Трактат о надлежащей практике"
 treatiseofgoodpractice_desc: "Этот трактат является руководящей книгой, которая устанавливает общепринятый хороший стандарт для обучения [Concept('magi','магов')|E] в [Concept('aversaria','Аверсарии')|E] по системе преподавания [Concept('mayikrata','Майикратии')|E]. Первоначально написанный вместе с Конкордиатским пактом после [Concept('chaos_of_the_seventh_century','Хаоса седьмого века')|E], с тех пор он претерпел почти 400 официальных пересмотров со стороны [Concept('mayikrata','Майикратии')|E] и служит невероятно подробным руководством по науке магии и передовым методам её преподавания."

 chevalienknightinoraispol_title: "Шевальенский рыцарь в Ораисполе, 1262"
 chevalienknightinoraispol_desc: "«Шевальенский рыцарь в Ораисполе, 1262» — это фантастическая история шевальенского учёного Мите Криде, представляющая марочникского рыцаря по имени Мадю ден ва Кризай в [GetTitleByKey('c_oraispol').GetNameNoTier], когда сьялволки завоёвывают [Concept('aversaria','Аверсарию')|E] вокруг него. Мадю исключительно искусен в обращении с клинком, остр на язык и умён, стоек сердцем и предан своему Пути, сражается со злыми аверсарианскими [Concept('magi','магом')|E] и военачальниками, прежде чем присоединиться к сьялволкам, чтобы помочь им в битвах. Мадю быстро поднимается по рангам, становится величайшим товарищем самого Сокрушителя Ведьм, а затем обращает его в [Concept('lifepath','Жизненный путь')|E] и становится его Путеводным отцом.\n\nСамая популярная из работ Мите, идея вообразить историю, которая не является проверенной, оказалась достаточно новой, чтобы очевидные... странности в повествовании можно было игнорировать, и с тех пор она стала популярной для воспроизведения трубадурами. Её популярность оказалась настолько велика, что побудила нескольких Путеводных отцов даже попытаться путешествовать с сьялволками и обращать их самих, с переменным успехом."

 witchbreakerhero_title: "Сокрушитель Ведьм, герой героев!"
 witchbreakerhero_desc: "Эта книга, написанная шевальенским учёным Мите Криде во время его долгих путешествий с сьялволками в попытке узнать больше об их культуре, служит биографией Ценвара Сокрушителя Ведьм для современных марочникских читателей. В предисловии утверждается, что вся информация была предоставлена самим Сокрушителем Ведьм, а также его современниками, и прослеживает его путь от легендарного Довакнинга, в котором он в одиночку победил всех противников (включая собственного брата), не убив ни одного человека, чтобы заявить права на своё племя, до Битвы у Элизийского прохода, где Криде завершил свои путешествия с сьялволками.\n\nРасточая похвалы почти при каждом удобном случае и содержа несколько историй, которые кажутся полным вымыслом, Мите заходит так далеко, что даже добавляет главу о том, насколько великим правителем, по его мнению, был бы Ценвар, и фантазирует о том, каково было бы иметь его личным другом. Обычно высмеиваемый за такие вещи, он тем не менее получил научное признание как самая заметная современная попытка задокументировать жизнь легендарной фигуры."

 sjalvolkipoetry_title: "Книга поэзии сьялволков"
 sjalvolkipoetry_desc: "Книга поэзии сьялволков, написанная шевальенским учёным Мите Криде как часть его серии книг, описывающих его путешествия с народами сьялволков во время их вторжений в [Concept('aversaria','Аверсарию')|E]. Каждая глава представляет собой собрание поэзии разных племён. В отличие от поэзии большинства западных культур, поэзия сьялволков обычно принимает форму боевой поэзии (или, поскольку сьялволки полюбили корабли, морской поэзии) и имеет довольно анархичную структуру и прозу. Тем не менее, многие стихи остаются проницательными или выдают часто игнорируемую задумчивость многих сьялволькских военачальников, причём особенно выделяются несколько стихов самого Ценвара Сокрушителя Ведьм, особенно удивительно меланхоличная композиция из Элизийского прохода."

 bookofthefallen_title: "Книга павших"
 bookofthefallen_desc: "Журнал представляет собой перечень всех имён, вырезанных на стенах Горнила, главной крепости на границе [chevalie|E] и [Concept('the_lichdoms','Личеств')|E]. Принято, чтобы товарищи павших [Concept('antimagi','антимагов')|E] и солдат, отдавших свои жизни в этом месте, вырезали их имена на стене, иногда с несколькими короткими словами о них, и многие марочникские стихи или литература подробно описывают стену или используют её как метафорическое устройство. Однако эта книжечка, объёмом почти 200 страниц, отказывается от этого, чтобы просто перечислить каждое имя и любые другие предложения, связанные с ним. Хотя она малоценна для случайного читателя, простое размышление о её страницах является довольно отрезвляющим опытом."

 jacotwaldisse_title: "Жизнь Жако ден ва Вальдисса"
 jacotwaldisse_desc: "«Жизнь Жако ден ва Вальдисса» — это относительно короткая книга, рассказывающая о жизни марочникского [Concept('antimagi','антимага')|E] Жако ден ва Вальдисса от скромного начала в качестве сына мельника в нищей деревне до его отказа принять попытки своего лорда ограничить его выбор Пути и поспешного бегства к Горнилу, чтобы присоединиться к Орденам и Пути Опустошения, до его участия в битвах и гибели во время Войны Красной реки. Рассказанная современником, товарищем Жако и, как считается, лучшим другом сэром Мишелем Вавасски, книга считается классикой марочникской поэзии и товарищества. Потеря и печаль Вавасски из-за ужасной смерти Жако от рук архилича Силаса Ставро — Жако отдал свою жизнь, чтобы отвлечь лича от нескольких раненых (включая Вавасски) — очевидны в каждом предложении и строфе поэзии, добавленной для разбивки каждой главы.\n\nСовременные учёные предположили, что у Жако и Вавасски были гораздо более близкие отношения, чем дружба, хотя это остаётся крайне спорным."

 delenelbook_title: "Сиреневый сад" Картина Деленела"
 delenelbook_desc: "Эта работа представляет собой первый набросок серии любовной поэзии, написанной легендарно жестоким [Concept('aversaria','аверсарианским')|E] военачальником Легоном [karthyn_delenel|E] из Легиона XIV «Кователи цепей». Известный своей ужасной жестокостью, наставничеством аверсарианского военачальника Горасса и преданностью аавтократу Эшрею (обычно известному как «Повелитель Пепла»), эта работа, по-видимому, была в процессе создания примерно в то время, когда он был смертельно ранен Леганом Исацеей из Легиона XXI «Аксиотея» и окончательно казнён своим учеником Горассом.\n\nХотя «Сиреневый сад» часто написан грубо и содержит множество орфографических и грамматических ошибок, если бы кто-то читал его, не зная автора, он, скорее всего, нашёл бы это чрезвычайно нежное и душевное собрание рассказов с мастерским умением управлять эмоциями через прозу. Многие читатели, без сомнения, с трудом сдерживали бы слёзы, когда юная дева, служащая главной героиней многих произведений, борется со своими чувствами неуверенности и открытия, особенно когда она влюбляется в свою лучшую подругу, женщину-мага Анафему. Читатели также были бы взбешены последним стихотворением, отмеченным как предпоследнее, где Джадиакса (главная героиня) решает умолять Анафему сбежать с ней, когда их деревня поглощается [Concept('the_fog','Туманом')|E]... только чтобы на этом работы оборвались, [karthyn_delenel|E], вероятно, был убит до того, как смог закончить работу."

 redlandsadventure_title: "Приключение в Красных землях"
 redlandsadventure_desc: "Эта книга была опубликована в начале 1100-х годов от И.С. возможно вымышленным авантюристом по имени Лексенир и утверждает, что описывает его путешествие по Красным землям южного Айроноя. Она рисует яркую картину таинственных культов, бродящих по пустошам и похищающих невинных для использования в таинственных и зловещих ритуалах в тёмных целях. В ней рассказывается о встречах Лексенира с не менее чем 11 различными культами, каждый из которых обладал своими странными и жестокими традициями. Эти традиции, варьирующиеся от ритуального каннибализма до человеческих жертвоприношений и питья крови поселенцев красноходов, описаны в мельчайших подробностях, как и его героизм в спасении людей от таких ужасных судеб. Жители Красных земель описаны так, что они кажутся не совсем людьми, утверждается, что они прячутся днём из-за смертоносного солнечного света.\n\nКнига сопровождается серией рисунков, которые Лексенир утверждает, что это традиционное искусство красноходов, состоящее из сложных узоров из фигур, расположенных так, что в их извилистых, спиральных линиях угадываются огромные чудовища. Книга была встречена неоднозначно, и многие утверждали, что Лексенир и его история — выдумка. Тем не менее, она даёт тем, кто живёт по всей далёкой империи, представление о таинственных Красных землях."

 fourlodges_title: "Четыре [Concept('lodges','ложи')|E]"
 fourlodges_desc: "Написанная в конце 1100-х годов от И.С. дамотанским учёным, известным только как Меха, «Четыре [lodges|E1]» — это история основных социальных организаций, определяющих дамотанскую жизнь. Основная часть книги посвящена подробному исследованию событий, которые постепенно превратили [Concept('lodges','Ордены Раякуукс')|E] в те специализированные социальные группы, которыми они являются сегодня. От их основания в 572 году от И.С. при Боккаре Датеше из [olani_dynasty|E] до их последующей роли во Втором [tetenik|E], Меха исследует их первоначальные функции и процедуры, а также то, как именно они впервые оказались втянуты в политику на местном и региональном уровне. Затем повествование фокусируется на местном уровне, с постепенным расхождением отдельных ветвей с первоначальной миссией, причём их официальный раскол в 682 году от И.С. описывается как простое подтверждение. Затем прослеживается их роль в упадке [Concept('boqqarut_damotada','Боккарута')|E], когда их власть росла за счёт государства, и объясняется, что ко времени Третьего [tetenik|E] несколько крупных [Concept('lodges','лож')|E] фактически перестали выполнять все, кроме самых прямых приказов. Согласно Мехе, [zalreb_dynasty|E] была практически неактуальна, а [etami_tetenik|E] был в значительной степени результатом их размывания централизованной власти, интерпретация, которая считается спорной в лучшем случае, хотя работа в целом уважается."

 journalofseekers_title: "Журнал искателей"
 journalofseekers_desc: "«Журнал искателей» — это не один журнал, а скорее сборник различных примечательных выдержек, собранных моговаи во время их путешествий в отдалённые уголки мира. Новое издание выходит каждые 50 лет, причём основным источником журналов является библиотека внутри Ирочи Дамотада, где хранятся собрания сочинений всех, кто путешествовал на север. Эта конкретная версия была впервые составлена в 1239 году и содержит рассказы о широкомасштабных разрушениях после [Concept('frodbrokna','Фродброкны')|E]. Большая часть посвящена продолжающейся кровавой борьбе между агионистами и варденитами, с несколькими свидетельствами очевидцев крупных битв и даже интервью с варденитским мамуром о ситуации, в котором он излагает методичный подход. Это интервью противопоставляется горю другого путешественника, рассказывающего о своих нескольких случаях, когда он едва не погиб, прячась от Ордена Слепого Смотрителя. Кроме того, рассказывается о дворах различных [Concept('aversaria','аверсарианских')|E] военачальников, например, записи путешественника, присутствовавшего при Легионе XXI «Аксиотея» во время их кампании против Эшрея, человека, разрушившего их империю. Шевалье занимают почти всё остальное содержание тома, с историей о приключениях одного человека с наёмной компанией в Бейд-Фалухе."

 godslaverdictations_fix_title: "Личные диктовки Чернивмалы Ческовары"
 godslaverdictations_fix_desc: "Этот том является шевальенской копией восстановленных «личных диктовок» [Concept('kartharadd','картараддского')|E] [Concept('liches','лича')|E] Чернивмалы «Поработительницы богов» Ческовары. Достигнув личества в VII веке после путешествия на север и бегства от своего народа, Ческовара стала одной из многих «мелких личей» Личеств, которая проводила большую часть своего времени, пытаясь выкроить некрополь и ведя мелкие территориальные войны с соседними личами, так и не накопив достаточно сил для организации полноценного вторжения на юг.\n\nЭти мемуары, вероятно, были написаны несколькими слугами-нежитью, которые, судя по нескольким страницам, полным проклятий и гневных опровержений их «безмозглой идиотии», были воскрешены только для того, чтобы постоянно следовать за Чернивмалой и записывать её слова. На двенадцатой странице из более чем двух тысяч (хотя половина из них давно утеряна и забыта, поскольку большинство учёных считают писанину «посредственной»), лич заявляет, что это потому, что «Мои славные слова однажды станут прекрасными священными текстами! Люди будут поклоняться мне как божеству, когда я низвергну их жалких богов! У них должны быть свои писания! Мои слова не должны быть потеряны для истории!»\n\nТекст был извлечён [Concept('antimagi','антимагом')|E] сэром Крено ден Ви, который отправился на север с рыцарской петги-гисреддской группой «Спутники Подмигивающей Розы» и штурмовал Ческовару в её крепости «Вечная Погибель». Хотя они, конечно, позаботились о том, чтобы история звучала достаточно эпично, техническое чтение их отчётов и перекрёстное сравнение различных свидетельств показывают, что Ческовара, по-видимому, уже была на грани смерти, когда они нашли её, и её армия была в значительной степени уничтожена ранее, как упоминается в нескольких отрывках."

 thekardwenwhatweknow_title: "Кардвены: что мы знаем"
 thekardwenwhatweknow_desc: "Этот доклад был написан Легоном Кромусом Рексом о его столкновениях со странными кардвенами. Ранее считавшиеся лишь выдумкой суеверных сьялволков, этот доклад был первым официальным признанием народа какой-либо [Concept('aversaria','имперской')|E] властью. Он начинается с описания прибытия странного человека в аверсарианский лагерь, одетого в плащ, сшитый из крыльев воронов, и использующего рог лося как посох. Затем он из-за пояса поднимает отрубленную голову солдата, который исчез всего неделю назад. Видя это как угрозу, Кромус зарубил человека на месте. На самом деле это был жест примирения: кардвены часто обмениваются головами павших, чтобы их души могли попасть в загробную жизнь. Этот акт развязал гнев ранее неизвестных кардвенов и привёл к катастрофическому поражению Легиона XXIII.\n\nОтправленный аавтократу в разгар этого конфликта, Кромус рисует леденящие душу сцены на границе. Тела, обглоданные до костей, висящие на каждом дереве, и люди, просто исчезающие во сне, были обычными темами. Возможно, самым тревожным из всего является сам язык кардвенов, который напоминает ветер, дующий сквозь деревья, и никогда не поднимается выше шёпота, даже когда они умоляют о пощаде."

 dethediaxnotes_title: "Личные заметки Легана Детедиакс"
 dethediaxnotes_desc: "Этот набор свитков служил личными заметками Легана Детедиакс во время её завоевания и правления долиной ийроссов. Хотя большая часть из них касается создания и теоретизирования её «Детедиаксианского закона», который будет управлять долиной впоследствии, многочисленные другие разделы касаются повседневной жизни, управления её легионами и отношений с тогдашним аавтократом Фанагораксом.\n\nХотя ничто в этих текстах не показывает, что Детедиакс имела какие-либо сомнения в [Concept('aversaria','аверсарианском')|E] деле, тем не менее она проявляет немало сочувствия к ийроссам и особенно много ненависти к самому Фанагораксу. Несколько отрывков заходят так далеко, что называют аавтократа «болтливым идиотом», который «представлял большую опасность для нашего правления в долине, чем ийроссы». Особенно интересный отрывок описывает несколько мелких восстаний, которые Детедиакс была вынуждена подавлять или вести переговоры в тайне, чтобы избежать идиотской реакции из [GetTitleByKey('c_oraispol').GetNameNoTier], ставя под сомнение общее представление о 1000-летней покорности ийроссов. Ещё более интересно краткое упоминание о «детях Потаклея», которых Детедиакс, по-видимому, тайно вывезла в горы, чтобы подавить довольно крупное восстание вокруг них."

 dethediaxiancodex_title: "Детедиаксианский кодекс"
 dethediaxiancodex_desc: "Этот кодекс содержит большую часть Детедиаксианского закона — свода законов и мандатов, которые в основном регулировали обращение с ийроссами после их завоевания в 200 году от И.С. аавтократом Фанагораксом и Леганом Детедиакс. Хотя сейчас он, очевидно, устарел, он тем не менее является шедевром в области права и управления и считается одним из величайших достижений в области управления в мире."

 bluerobetreatise_title: "Трактат синих мантий"
 bluerobetreatise_desc: "Этот свиток является копией оригинального трактата из 37 страниц, написанного магистром Веларасом «Мрачным Спикером» Крейшати в начале [Concept( 'blue_robe_revolt', 'Восстания Голубых Мантий' )|E]. Он объявляет о категорическом отказе Майикпрололлана Айронойакаана от дальнейших исследований [Concept('selfreplicating_blood_magic','самовоспроизводящейся магии крови')|E], заявляя, что ни один [Concept('aversaria','аверсарианский')|E] [Concept('magi','маг')|E] не будет приказан, как собака, даже по настоянию мелкой аавтократии.\n\nВ трактате также говорится, что отныне академия объявляет нейтралитет в [Concept('imperial_civil_war','Имперской гражданской войны')|E] и призывает всех аверсарианских граждан сопротивляться любым попыткам вытеснить их из их крепости. Говорят, что трактат, а также действия так называемых Синих Мантий привели Аксиотею в такую ярость, что она снесла шестивековые кварталы Лаватикас в своей резиденции в Асиуполе и приказала четырём легионам штурмовать Айронойакаан, начав тем самым боевые действия в полной мере."

 boqqarofknives_title: "Ралери: Боккар Ножей"
 boqqarofknives_desc: "Впервые опубликованная в 853 году от И.С., «Боккар Ножей» является биографией одного из самых прославленных и устрашающих правителей [boqqarut_damotada|E]. Книга охватывает всю его публично известную жизнь, от детства в Табик Бетемисыт до его внезапного и неожиданного восхождения на трон и последующих десятилетий интриг и секретности, заканчивая его смертью в 817 году от И.С. Однако более известна книга своим вниманием к неподтверждённым теориям и предположениям о неизвестных аспектах его жизни, адресуя и даже выдумывая слухи о его бесчисленных тайных заговорах и многих убийствах, связывая воедино безвременные кончины его соперников и создавая невероятно правдоподобную картину теневого кукловода, дёргающего за нити Дамоты.\n\nПри публикации книга была одобрена Боккаром Кайобой, который стремился использовать её нелестное изображение своего сильно ненавидимого деда, чтобы дистанцироваться от его тени. Часто считаемая последним великим произведением [Concept('boqqarut_damotada','Боккарута')|E], история, рассказанная о Ралери в её страницах, стала повествованием, которое история предпочла поверить."

 the_aaimorgeneia_title: "Аайморгенея"
 the_aaimorgeneia_desc: "«Аайморгенея» — это политический и социальный трактат XII века известного тогда философа Амеона Мафонаса, пропагандирующий идею уподобления единственной — с точки зрения автора — империи человечества семейной ячейке.\n\nОсуждая полностью разрушенную пост-дикайносскую аверсарианскую правовую систему, он вместо этого выступает за стратифицированное общество, управляемое исключительно через псевдо-семейные отношения и сыновнюю почтительность. В такой системе касты должны были быть упразднены и заменены линейной цепочкой подчинения родителей и детей, с чистокровными аверсарианцами на вершине и санкционированными сестринскими расами и народами ближе к низу как домашние рабы (питомцы в некоторых переводах).\n\nТрактат получил неоднозначные отзывы при публикации, и многие критики осуждали либеральные взгляды Амеона."

 enchiridion_tharsanese_of_kasathox_title: "Энхиридион Тарсанез из Казафокса"
 enchiridion_tharsanese_of_kasathox_desc: "Обширное собрание тейссианских алхимических формул, принципов и ритуалов, составленное в [GetBuilding('01_tur_senach').GetName] в последние годы архимагистрата Казафокса; в конечном счёте самая распространённая работа на эту тему в [Concept('aversaria','Аверсарии')|E] благодаря распространению через [Concept('theyssian_scrivenery_network','Тейссианской писчей сети')|E]."

