 wingspan_pinion_name: "Размах крыльев, маховое перо"
 wingspan_pinion_desc: "Крыло совы разобрано, каждый слой мышц обнажён. Наблюдайте за изящным взмахом маховых перьев. Наблюдайте за пятнами, смотрите, где их узоры начинают образовывать бесформенные руны."
 digits_talons_name: "Пальцы, когти"
 digits_talons_desc: "Могучие когти обнажены передо мной, внутренности распростёрты по странице, чернильный водоворот. Наблюдайте, как длина и изгиб третьего пальца соответствуют теореме Халлемана. Наблюдайте за странными следами когтей, которые вы находите на своём подоконнике к утру."
 lenses_oracle_name: "Линзы, оракул"
 lenses_oracle_desc: "Глаза изящно вырезаны, их линзы и полосы обнажены. Наблюдайте, что никакая ложь не может ускользнуть от их пронзительного взгляда. Наблюдайте, что ваше собственное чувство себя — это ложь. Наблюдайте за собой в своих снах, сквозь мерцающие линзы, которые не являются вашими собственными."