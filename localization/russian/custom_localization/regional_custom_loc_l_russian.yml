 # --- Added from latest English Godherja localization (2026-11-16) ---
 ARRACK_GLOSS:0 "Крепкий алкогольный напиток из тростника или пальмового сока."
 BOCHET_GLOSS:0 "Пряный напиток из варёного мёда."
 COMMANDARIA_GLOSS:0 "Сладкое кипрское десертное вино."
 HIPPOCRAS_GLOSS:0 "Десертное вино с пряностями."
 HUANGJIU_GLOSS:0 "Китайское вино из сброженного риса или проса."
 JACKFRUIT_GLOSS:0 "#bold Джекфрут#! представляет собой огромный тропический фрукт с приторно-сладкой мякотью и очень сильным запахом."
 JUJUBE_GLOSS:0 "#bold Ююба#!, также известная как китайский финик, представляет собой маленький красный плод, в свежем виде похожий на яблоко, а в высушенном — на финик."
 KOUMISS_GLOSS:0 "Кисломолочный напиток из забродившего кобыльего молока."
 KVASS_GLOSS:0 "Лёгкий славянский напиток из сброженного хлеба."
 LONGAN_GLOSS:0 "#bold Лонган#! означает «глаз дракона». Это название обусловлено тем, что небольшие плоды лонгана — подобно родственным им плодам личи — имеют бледную прозрачную мякоть, сквозь которую виднеется тёмное семечко, из-за чего они внешне напоминают глазное яблоко."
 LOQUAT_GLOSS:0 "#bold Локва#! одна из первых приносит плоды по весне. Её небольшие кисло-сладкие плоды золотистого цвета весьма популярны на Востоке."
 LYCHEE_GLOSS:0 "Ароматный фрукт с жёсткой красной кожицей и прозрачной мякотью. Свежее #bold личи#! было настолько желанным продуктом, что императоры династии Тан использовали свою обширную курьерскую сеть для его скорейшей доставки с южных плантаций прямиком ко двору."
 MALVASIA_GLOSS:0 "Насыщенное десертное вино с греческих островов."
 MANGOSTEEN_GLOSS:0 "За толстой фиолетовой кожурой #bold мангостана#! скрывается белая кисло-сладкая мякоть, поделённая на дольки. В Азии этот плод часто называют «королевой фруктов»."
 MEDLAR_GLOSS:0 "#bold Мушмула#! — дерево из семейства розовых. Его небольшие коричневые плоды, столь любимые при многих дворах, становятся мягкими и съедобными лишь после длительного дозревания."
 METHEGLIN_GLOSS:0 "Медовуха с пряностями или травами."
 MULBERRY_GLOSS:0 "Крайне мягкая тёмная ягода, которую практически невозможно перевозить на сколь-нибудь большие расстояния. В связи с этим плоды #bold шелковицы#! очень редки и доступны лишь тем, кто живёт неподалёку от её плантаций."
 PERRY_GLOSS:0 "Напиток из забродивших груш."
 PERSIMMON_GLOSS:0 "Оранжевые плоды восточноазиатской #bold хурмы#! очень сладкие, но при этом жёсткие, поэтому обычно их употребляют либо после полного дозревания, либо после высушивания."
 PIMENT_GLOSS:0 "Сладкое пряное вино."
 PRUNELLE_GLOSS:0 "Ликёр из плодов тёрна или сливы."
 RETSINA_GLOSS:0 "Белое греческое вино с добавлением сосновой смолы."
 RUMNEY_GLOSS:0 "Десертное греческое вино, которое обычно экспортируют в западные латинские державы."
 SACK_WINE_GLOSS:0 "Креплёное иберийское белое вино."
 SAKE_GLOSS:0 "Японское рисовое вино, которое можно подавать как тёплым, так и холодным."
 SHARBAH_GLOSS:0 "Сладкий фруктовый напиток."
 SHIRAZ_WHITE_GLOSS:0 "Белое вино, приготовленное на виноградниках Шираза."
 SLIVOVITZ_GLOSS:0 "Крепкий сливовый бренди, распространённый у славян."
 SMALL_BEER_GLOSS:0 "Лёгкий эль, который простолюдины зачастую пьют вместо воды."
 SOMA_GLOSS:0 "Священный ритуальный напиток древних индоиранских народов. "
 TAMARIND_GLOSS:0 "Коричневые стручки #bold тамаринда#! содержат липкую кисло-сладкую мякоть, которую употребляют в качестве сладости, а также используют в лечебных целях."
 THARRA_GLOSS:0 "Крепкий индийский спиртной напиток с резким запахом."
 TODDY_GLOSS:0 "Алкогольный напиток из забродившего пальмового сока."
 TUBA_GLOSS:0 "Филиппинское вино из забродившего пальмового сока."
