 # Host Desc
 activity_hunt_host_desc_piety:0 "$BULLET_WITH_TAB$Участники могут получить [piety_i|E][Concept('piety', 'благочестие')|E]\n$BULLET_WITH_TAB$У участников может снизиться [stress_loss_i][Concept('stress', 'стресс')|E]\n"
 activity_hunt_host_desc_prestige:0 "$BULLET_WITH_TAB$Участники могут получить [prestige_i|E][Concept('prestige', 'престиж')|E]\n$BULLET_WITH_TAB$Участники могут получить [legitimacy_i] [Concept('legitimacy', 'легитимность')|E]\n$BULLET_WITH_TAB$У участников может снизиться [stress_loss_i][Concept('stress', 'стресс')|E]\n"
 activity_hunt_host_desc_trait_xp:0 "$BULLET_WITH_TAB$Участники могут получить [Concept('trait_level_track_xp', 'опыт пути развития свойства')|E] «[GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]»\n"
 activity_hunt_host_desc_trait:0 "$BULLET_WITH_TAB$Участники могут получить [Concept('trait', 'свойство')|E] «[GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]»\n"
 activity_hunt_host_desc:2 "[SelectLocalization(ObjectsEqual(GetPlayer.GetGovernment, GetGovernment('nomad_government')),'activity_hunt_nomad_additions_desc', 'blank_line')]$BULLET_WITH_TAB$May gain[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] [vassal|E] [opinion|E]\n$BULLET_WITH_TAB$May gain Trophy [artifacts|E]\n"
 activity_legend_seed_tt: "$BULLET_WITH_TAB$Может получить [Concept('legend_seed', 'зарождающуюся легенду')|E]\n"
 activity_hunt_guest_desc_accolade:0 "$BULLET_WITH_TAB$Участвующие [Concept('acclaimed_knights', 'именитые рыцари')|E] могут получить [Concept('glory', 'славу')|E]\n"
 activity_hunt_host_desc_animal:0 "\n[Concept('hunt_danger_no_prefix', 'Опасность')|E] добычи / Награды за редкость:\n$BULLET_WITH_TAB$[prestige_i|E][Concept('prestige', 'престиж')|E]\n$BULLET_WITH_TAB$Трофейные [Concept('artifacts', 'артефакты')|E]"
 activity_hunt_host_desc_moh:0 "\n@warning_icon! #negative_value У вас отсутствует [GetCourtPositionType('master_of_hunt_court_position').GetName()|l]"
 activity_hunt_host_desc_huntsperson: "\n@warning_icon! #negative_value У вас отсутствует [GetCourtPositionType('huntperson_camp_officer').GetName()|l]"
 activity_hunt_host_desc_recent:0 "\n@warning_icon! #negative_value Все принадлежащие вам [Concept('counties', 'графства')|E] недавно устраивали мероприятие «[GetActivityType('activity_hunt').GetName]»"
 # Conclusion Desc
 activity_hunt_conclusion_desc_legendary_success:0 "Охота на легендарное животное ([activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')]) наконец-то завершена! Об этом дне еще сложат песни, восхваляющие таланты тех, кто одолел этого зверя!"
 activity_hunt_conclusion_desc_legendary:0 "Охота за неуловимым животным ([activity.Custom('GetLegendaryColor')|] [activity.Custom('GetAnimalType')]) продолжается, и конца ей пока не видно..."
 activity_hunt_conclusion_desc_falconry_success:0 "Наши [activity.Custom('GetRaptorPlural')|l] заслуживают почестей: благодаря им [activity.Custom('GetAnimalPlural')|l] стали отличной добычей!"
 activity_hunt_conclusion_desc_falconry:1 "Наши [activity.Custom('GetRaptorPlural')|l] оплошали и не смогли поймать таких птиц, как [activity.Custom('GetAnimalPlural')|l]..."
 activity_hunt_conclusion_desc_standard_success:1 "Мы возвращаемся с охоты на таких животных, как [activity.Custom('GetAnimalPlural')|l], покрытые славой!"
 activity_hunt_conclusion_desc_standard:0 "Сегодня [activity.Custom('GetAnimalPlural')|l] ускользнули от нас..."
 activity_hunt_guest_help_text:1 "У [Concept('activity_guests', 'гостей')|E] будет возможность пообщаться и, при активном участии, улучшить свои охотничьи и воинские умения.\n#TOOLTIP:VASSAL_STANCE,glory_hound #L [GetVassalStance( 'glory_hound' ).GetTextIcon]Охочие до славы#!#! [Concept('vassals', 'вассалы')|E] любят охоту, и их [Concept('opinion', 'мнение')|E] о вас улучшится.\n$activity_hunt_guest_help_text_party_size$."
 activity_hunt_guest_help_text_party_size:0 "Каждый участник со свойством «[GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]» слегка увеличивает [Concept('hunt_success_chance_no_prefix', 'шанс успеха')|E]"
 hunt_type_stress:0 "• @stress_icon! Потеря стресса"
 hunt_type_safety:0 "• @death_icon! Безопасность"
 hunt_type_skill_prowess:0 "• @skill_prowess_icon! Доблесть"
 hunt_type_skill_stewardship:0 "• @skill_stewardship_icon! Управление"
 hunt_type_skill_learning:0 "• @skill_learning_icon! Ученость"
 ### ACTIVITY
 # GUESTS
 # PHASES
 hunt_phase:0 "Охота"
 hunt_type_standard:0 "Охота"
 hunt_type_standard_desc:1 "$EFFECT_LIST_BULLET$ Выберите добычу среди местной фауны\n$EFFECT_LIST_BULLET$ Повышает [Concept('trait_level_track_xp', 'опыт пути развития свойства')|E] «[GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]-$trait_track_hunter$»\n$EFFECT_LIST_BULLET$ Чем выше [Concept('hunt_danger_no_prefix', 'опасность')|E], тем больше [prestige_i|E][Concept('prestige', 'престижа')|E]\n$EFFECT_LIST_BULLET$ К активному участию допускаются только персонажи, чей пол считается сильным\n$EFFECT_LIST_BULLET$ Персонажи слабого пола могут наблюдать\n#weak Гордые и хитрые звери бродят в диких краях. Чтобы победить их, нужна сила и смекалка; это настоящее испытание на смелость и превосходная тренировка.#!"
 hunt_type_legendary:1 "Легендарная"
 hunt_type_legendary_desc:1 "$EFFECT_LIST_BULLET$ В этой области видели мифического зверя. Найдите его!\n$EFFECT_LIST_BULLET$ Повышает [Concept('trait_level_track_xp', 'опыт пути развития свойства')|E] «[GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]-$trait_track_hunter$»\n$EFFECT_LIST_BULLET$ Чем выше [Concept('hunt_danger_no_prefix', 'опасность')|E], тем больше [prestige_i|E][Concept('prestige', 'престижа')|E]\n$EFFECT_LIST_BULLET$ К участию допускаются только персонажи, чей пол считается сильным\n$EFFECT_LIST_BULLET$ Персонажи слабого пола могут наблюдать\n#weak В мифических существ верят редко, но кто знает, кто скрывается в лесах.#!"
 hunt_type_falconry:1 "Соколиная"
 hunt_type_falconry_desc:1 "$EFFECT_LIST_BULLET$ Выберите птицу, которая станет добычей\n$EFFECT_LIST_BULLET$ Повышает [Concept('trait_level_track_xp', 'опыт пути развития свойства')|E] «[GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]-$trait_track_falconer$»\n$EFFECT_LIST_BULLET$ Могут участвовать персонажи любого пола\n#weak Соколиная охота обходится дорого, но это благородное заняление приносит ни с чем не сравнимое удовольствие от ощущения власти над природой.#!"

 # OPTIONS
 hunt_option_attendants:0 "Участники"
 hunt_attendants_few:0 "Местные егеря"
 hunt_attendants_few_desc:1 "#weak Небольшой группе охотников помогают местные егеря.#!"
 hunt_attendants_normal:0 "Поисковые отряды"
 hunt_attendants_normal_desc:1 "$BULLET_WITH_TAB$Немного повышает [Concept('hunt_success_chance_no_prefix', 'шанс успеха')|E]$hunt_attendants_roco_tt$\n\n#weak Группы слуг помогают искать и загонять дичь.#!"
 hunt_attendants_many:0 "Вспугивающие отряды"
 hunt_attendants_many_desc:1 "$BULLET_WITH_TAB$Значительно повышает [Concept('hunt_success_chance_no_prefix', 'шанс успеха')|E]$hunt_attendants_roco_tt$\n\n#weak Специально отобранные группы охотников готовы преследовать и направлять дичь.#!"
 hunt_option_party_size:0 "Размер отряда"
 hunt_party_size_few:0 "Отряд из близких"
 hunt_party_size_few_desc:0 "$BULLET_WITH_TAB$Участвуют ваши [GetPlayer.Custom('GetHuntMasterTooltipDesc')|l], [GetCourtPositionType('bodyguard_court_position').GetName()|l], [GetCourtPositionType('court_physician_court_position').GetName()|l], [Concept('spouses', 'супруги')|E], [Concept('friends', 'друзья')|E], [Concept('lovers', 'любовники')|E] и охотники\n\n#weak Небольшой отряд, состоящий из доверенных лиц и придворных.#!"
 hunt_party_size_normal:0 "Средний отряд"
 hunt_party_size_normal_desc:0 "$BULLET_WITH_TAB$Больше [prestige_i|E][Concept('prestige', 'престижа')|E] по завершении\n$BULLET_WITH_TAB$Участвуют безземельные рыцари, [Concept('courtiers', 'придворные')|E] со свойством «[GetTrait('lazy').GetName( GetNullCharacter )]» либо сведущие в военном деле, а также [Concept('guests', 'гости')|E]\n\n#weak Отряд средних размеров, состоящий из известных лиц и придворных державы.#!"
 hunt_party_size_many:0 "Крупный отряд"
 hunt_party_size_many_desc:0 "$BULLET_WITH_TAB$Гораздо больше [prestige_i|E][Concept('prestige', 'престижа')|E] при завершении\n$BULLET_WITH_TAB$Участвуют все [Concept('courtiers', 'придворные')|E] и [Concept('guests', 'гости')|E]\n\n#weak Серьезный отряд, состоящий из большого количества деятелей двора и державы, а также их окружения.#!"
 hunt_activity_master_of_hunt_appointed:0 "$master_of_hunt_court_position$ назначен"
 hunt_attendants_roco_tt:0 "[SelectLocalization( HasDlcFeature( 'royal_court' ), 'hunt_attendants_roco_tt_ROCO_DLC', 'hunt_attendants_roco_tt_NO_ROCO_DLC' )]"
 hunt_attendants_roco_tt_ROCO_DLC:0 "\n$BULLET_WITH_TAB$Эффект усиливается от [Concept('court_amenities', 'увеселений при дворе')|E] «$court_servants$»"
