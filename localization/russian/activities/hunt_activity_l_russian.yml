 # ARTIFACTS
 artifact_animal_trinket_name:1 "[newly_created_artifact.Custom('ArtifactAnimalTrinketType')|U] животного — [owner.Custom('GetAnimalType')|U]"
 artifact_animal_trinket_description:2 "[newly_created_artifact.Custom('ArtifactAnimalTrinketType')|U] животного ([owner.Custom('GetAnimalType')]), которое [Select_CString(creator.IsFemale, 'добыла', 'добыл' )] [creator.GetName] во владении [location.GetBaronyNameExplicitly]."
 artifact_animal_trinket:0 "Сувенир из животного"
 hunt_revenge_skull_name_1:0 "Погибель персонажа [host.GetTitledFirstNameNoTooltip]"
 hunt_revenge_skull_name_2:0 "Погибель персонажа [host.GetTitleAsNamePossessiveNoTooltip]"
 hunt_revenge_skull_name_3:0 "Убийца персонажа [host.GetTitleAsNameNoTooltip]"
 hunt_revenge_skull_desc:0 "Голова животного ([newly_created_artifact.GetFeatureText( 'animal_skull_type' )]), по чьей вине [Select_CString(host.IsFemale, 'погибла', 'погиб' )] [host.GetTitledFirstName] на охоте. Артефакт [Select_CString(creator.IsFemale, 'заказала', 'заказал' )] [host.GetHerHis|l] [Select_CString(creator.IsFemale, 'наследница', 'наследник' )] [creator.GetTitledFirstName]. Она [SCOPE.Custom('ArtifactAdverbQuality')] сохранилась и прикреплена к [SCOPE.Custom('ArtifactAdverbWealth')] резному деревянному ([newly_created_artifact.GetFeatureText( 'generic_material_wood' )]) постаменту."
 hunt_rampage_trinket_slain_desc:1 "[newly_created_artifact.Custom('ArtifactAnimalTrinketType')|U] буйствующего зверя ([activity.Custom('GetAnimalTypeKill')]), который напал на персонажей [host.GetName] и [similar_participant.GetName] во владении [creator.GetCurrentLocation.GetBaronyNameExplicitly], но был повержен ножом, который [Select_CString(animal_slayer.IsFemale, 'держала', 'держал' )] [animal_slayer.GetFirstName]."
 hunt_rampage_trinket_wound_desc:1 "[newly_created_artifact.Custom('ArtifactAnimalTrinketType')|U] буйствующего зверя ([activity.Custom('GetAnimalTypeKill')]), который напал на персонажей [host.GetName] и [similar_participant.GetName] во владении [creator.GetCurrentLocation.GetBaronyNameExplicitly], ранив персонажа [animal_slayer.GetFirstName], когда [Select_CString(animal_slayer.IsFemale, 'та', 'тот' )] [Select_CString(animal_slayer.IsFemale, 'сразила', 'сразил' )] его."
 hunt_rampage_trinket_death_desc:1 "[newly_created_artifact.Custom('ArtifactAnimalTrinketType')|U] буйствующего зверя ([activity.Custom('GetAnimalTypeKill')]), который напал на персонажей [host.GetName] и [similar_participant.GetName] во владении [creator.GetCurrentLocation.GetBaronyNameExplicitly], погубив персонажа [animal_slayer.GetFirstName], когда [Select_CString(animal_slayer.IsFemale, 'та', 'тот' )] [Select_CString(animal_slayer.IsFemale, 'сразила', 'сразил' )] его."
