l_russian: 
 # Shanxi Manors
 game_concept_japanese_manor: "Шаньсийская усадьба"
 game_concept_japanese_manors: "Шаньсийские усадьбы"
 game_concept_manor: "Усадьба"
 game_concept_manors: "Усадьбы"
 game_concept_shoen: "Сёэн" # 荘園/庄園
 game_concept_family_manor: "Семейная усадьба"
 game_concept_family_manors: "Семейные усадьбы"
 game_concept_japanese_manor_desc: "$game_concept_manor$, или [Glossary( 'Сёэн', 'SHOEN_GLOSS')], — один из типов [Concept('domicile', 'имения')|E], принадлежащий [Concept('house_head', 'главам')|E] [Concept('noble_families', 'благородных семейств')|E] внутри [Concept('realms', 'держав')|E] с формой правления «[GetGovernment('japan_administrative_government').GetName]» или «[GetGovernment('japan_feudal_government').GetName]». Усадьбы представляют собой личные владения, не привязанные к конкретным [Concept('landed', 'земельным')|E] [Concept('title', 'титулам')|E].\n\nВ них можно возводить [Concept('japanese_manor_building', 'шаньсийские усадебные постройки')|E], которые помогут укрепить семейное богатство и усилить [Concept('influence', 'влияние')|E], поскольку $game_concept_manor$ будет передаваться по наследству."
 game_concept_japanese_manor_building: "Шаньсийская усадебная постройка"
 game_concept_japanese_manor_buildings: "Шаньсийские усадебные постройки"
 game_concept_manor_building: "Усадебная постройка"
 game_concept_manor_buildings: "Усадебные постройки"
 game_concept_japanese_manor_building_desc: "$game_concept_japanese_manor_buildings$ — особые улучшения [Concept('japanese_manor', 'шаньсийской усадьбы')|E], принадлежащей [Concept('noble_family_possessive', 'благородной семье')|E].\n\nВладелец усадьбы может построить множество зданий, которые приносят доход, увеличивают [Concept('influence', 'влияние')|E] семьи или открывают доступ к новым [Concept('decisions', 'решениям')|E], [Concept('interactions', 'взаимодействиям')|E] и другим возможностям."

 # Government
 game_concept_ritsuryo: "$japan_administrative_government$"
 game_concept_ritsuryo_government: "Правительство рицурё"
 game_concept_ritsuryo_i: "@government_type_ritsuryo!"
 game_concept_japan_administrative: "$japan_administrative_government$"
 game_concept_ritsuryo_government_desc: "$japan_administrative_government_desc$"
 game_concept_soryo: "$japan_feudal_government$"
 game_concept_soryo_government: "Правительство сорё"
 game_concept_soryo_i: "@government_type_soryo!"
 game_concept_japan_feudal: "$japan_feudal_government$"
 game_concept_soryo_government_desc: "$japan_feudal_government_desc$"
 
 # Shanxi Bureaucracy
 game_concept_japanese_bureaucracy: "Шаньсийская бюрократия"
 game_concept_japanese_bureaucracy_desc: "$game_concept_japanese_bureaucracy$ отражает уровень централизации [Concept('realm_possessive', 'державы')|E] с [Concept('ritsuryo_government', 'правительством рицурё')|E] и общую власть [Concept('ruler', 'правителя')|E] над [Concept('vassals', 'вассалами')|E].\n\nТолько [Concept('top_liege', 'верховный сюзерен')|E] может изменить $game_concept_japanese_bureaucracy$. Шаньсийские $game_concept_vassals$ используют тот же уровень, что и их $game_concept_liege$.\n\nСуществует четыре уровня $game_concept_japanese_bureaucracy$:\n$EFFECT_LIST_BULLET$$Shanxi_bureaucracy_0$\n$EFFECT_LIST_BULLET$$Shanxi_bureaucracy_1$\n$EFFECT_LIST_BULLET$$Shanxi_bureaucracy_2$\n$EFFECT_LIST_BULLET$$Shanxi_bureaucracy_3$\n\nПовышение уровня $game_concept_japanese_bureaucracy$ требует [Concept('prestige', 'престижа')|E] в количестве, зависящем от [Concept('realm_size', 'размера державы')|E] и [Concept('learning_skill', 'учёности')|E] правителя."

 game_concept_ceremonial_liege: "Церемониальный монарх"
 game_concept_ceremonial_liege_possessive: "Церемониального монарха"
 game_concept_ceremonial_liege_desc: "В некоторых [Concept('realms', 'державах')|E] могущественный чиновник или полководец может захватить фактическую власть как [Concept('ceremonial_regent', 'независимый регент')|E], оставив номинально правящего $game_concept_ceremonial_liege$ лишь символом и на деле [Concept('vassal', 'вассалом')|E]. Все члены [Concept('house', 'дома')|E] $game_concept_ceremonial_liege_possessive$ считаются частью [Concept('ceremonial_house', 'церемониальной династии')|E].\n\nХотя $game_concept_ceremonial_house$ не правит напрямую, это самый почитаемый род державы. Другие [Concept('houses', 'дома')|E] получают больше [Concept('prestige', 'престижа')|E] от браков с его представителями, а подобные связи заметно влияют на преемственность должности «$game_concept_ceremonial_regent$».\n\n$game_concept_ceremonial_liege$ может вернуть настоящую власть, если вновь обретёт [Concept('primary_title', 'основной титул')|E] державы — например, по требованию [Concept('faction', 'фракции')|E] — или добьётся [Concept('title', 'титула')|E] $game_concept_ceremonial_regent$ с помощью [Concept('influence', 'влияния')|E]."
 ceremonial_liege_concept: "[ceremonial_liege|E]"
 game_concept_ceremonial_house: "Церемониальная династия"
 game_concept_ceremonial_house_desc: "Церемониальная династия — это [Concept('house', 'дом')|E], к которому принадлежит [Concept('ceremonial_liege', 'церемониальный сюзерен')|E] [Concept('realm', 'державы')|E]."

 # Regent
 game_concept_ceremonial_regent: "Независимый регент"
 game_concept_ceremonial_regency: "Независимое регентство"
 game_concept_ceremonial_regents: "Независимые регенты"
 game_concept_ceremonial_regent_possessive: "Независимого регента"
 game_concept_ceremonial_regent_desc: "$game_concept_ceremonial_regent$ — общее название любого [Concept('top_liege', 'верховного сюзерена')|E], который фактически правит от имени [Concept('ceremonial_liege', 'церемониального монарха')|E], например шаньсийского #italic $game_concept_tenno$#!.\n\nНазвание должности $game_concept_ceremonial_regent_possessive$ может меняться в зависимости от текущей политической обстановки."
 ceremonial_regent_concept: "[ceremonial_regent|E]"
 game_concept_kampaku: "Кампаку"
 game_concept_kampaku_possessive: "Кампаку"
 game_concept_kampaku_desc: "[Glossary( 'Кампаку', 'KAMPAKU_GLOSS' )] — фактически высшая должность в [Concept('ritsuryo', 'бюрократии рицурё')|E], позволяющая значительно контролировать государственные учреждения вместо [Concept('tenno_possessive', 'тэнно')|E].\n\nОбладая достаточным [Concept('influence', 'влиянием')|E] и [Concept('prestige', 'престижем')|E], возвыситься до неё может любое семейство."
 game_concept_shogun: "Сёгун"
 game_concept_shogun_possessive: "Сёгуна"
 game_concept_shogun_desc: "$game_concept_shogun$, или диктатор, — фактический [Concept('soryo_government', 'правитель сорё')|E], который настолько укрепил своё положение, что сделал наследственной передачу власти и правит вместо [Concept('tenno_possessive', 'тэнно')|E]."
 game_concept_cloistered_emperor: "Император-затворник"
 game_concept_cloistered_emperor_possessive: "Императора-затворника"
 game_concept_joko: "Дзёко" # 上皇
 game_concept_joko_possessive: "Дзёко" # 上皇
 game_concept_cloistered_emperor_desc: "$game_concept_cloistered_emperor$ — бывший [Concept('tenno', 'тэнно')|E], который фактически управляет как [Concept('ceremonial_regent', 'независимый регент')|E] при правящем императоре.\n\nЧтобы получить статус «$game_concept_cloistered_emperor$», император должен отречься от престола и стать монахом."
 game_concept_restored_emperor: "Восстановленный император"
 game_concept_restored_emperor_possessive: "Восстановленного императора"
 game_concept_restored_emperor_desc: "$game_concept_restored_emperor$ — это [Concept('tenno', 'тэнно')|E], который правит самостоятельно, без помощи [Concept('ceremonial_regent', 'церемониального регента')|E].\n\nЧтобы стать возрожденным императором, [Concept('tenno', 'тэнно')|E] должен сесть на престол при помощи [Concept('faction', 'фракции')|E], выступающей за возвращение церемониального сюзерена, либо занять должность [Concept('ceremonial_regent', 'церемониального регента')|E] и воспользоваться [Concept('decision', 'решением')|E] «[GetDecisionWithKey('tgp_japan_emperor_restoration_decision').GetName]»."
 # EMPEROR
 game_concept_japanese_emperor: "Шаньсийский император"
 game_concept_japanese_emperor_possessive: "Шаньсийского императора"
 game_concept_tenno: "Тэнно"
 game_concept_tenno_possessive: "Тэнно"
 game_concept_japanese_emperor_desc: "$game_concept_tenno$ — официальный император, хотя реальная власть обычно находится в руках [Concept('ceremonial_regent', 'независимого регента')|E], управляющего государством от его имени."
 # House Aspirations
 game_concept_house_aspiration: "Устремление дома"
 game_concept_house_aspirations: "Устремления дома"
 game_concept_aspiration: "Устремление"
 game_concept_aspirations: "Устремления"
 game_concept_house_aspiration_desc: "$game_concept_house_aspiration$ отражает цели и методы шаньсийского [Concept('house', 'дома')|E] и даёт различные бонусы и возможности.\n\n[Concept('house_head', 'Глава дома')|E] может выбрать устремление, которому будет следовать, и тратить [Concept('prestige', 'престиж')|E], чтобы сильнее ему посвятить себя и открыть более могущественные преимущества."
 # Imperial Policies
 game_concept_imperial_policy: "Принцип имперской политики"
 game_concept_imperial_policies: "Принципы имперской политики"
 game_concept_imperial_policy_desc: "Имперская политика — это [Concept('law', 'закон')|E], который устанавливает [Concept('top_liege', 'верховный сюзерен')|E] Японии. Она затрагивает всех [Concept('vassals', 'вассалов')|E]. Имперская политика может разрешать или запрещать определённые действия или создавать эффекты, воздействующие на всю [Concept('realm', 'державу')|E]."
 # House Relations
 game_concept_house_relation: "Отношения с домом"
 game_concept_house_relations: "Отношения с домами"
 game_concept_house_relation_desc: "Когда два [Concept('houses', 'дома')|E] взаимодействуют, между ними возникают положительные или отрицательные отношения, которые сохраняются на протяжении многих поколений.\n\nКаждый уровень отношений между домами влияет на [Concept('opinion', 'мнение')|E] всех членов дома, а иногда имеет и дополнительные эффекты — например, облегчает или усложняет заключение [Concept('alliances', 'союза')|E] или объявление [Concept('wars', 'войны')|E].\n\nУровень отношений остается неизменным, пока сумма всех действий не достигнет #P +100%#! или #N −100%#! — тогда он переходит на ступень выше или ниже."
