l_russian:
 # Overrides for Mandala and Wanua government descriptions — removing Earth-specific references
 # (Devaraja = Sanskrit "God-King", Wanua = Maritime Southeast Asian term) and replacing
 # with world-agnostic or Godherja-appropriate descriptions.

 game_concept_mandala_desc: "При [Concept('government_form', 'форме правления')|E] $game_concept_mandala$ ограничены [Concept('domain_limit', 'предел домена')|E] и число [Concept('direct_vassals', 'прямых вассалов')|E]. Вместо этого [Concept('liege', 'сюзерен')|E] и [Concept('suzerain', 'повелитель')|E] расширяют державу при помощи [Concept('tributaries', 'данников')|E].\n\nПравитель мандалы может стремиться к признанию богом-королём и полагается на [Concept('mandala_radiance', 'сияние мандалы')|E], чтобы приобретать и удерживать $game_concept_tributaries$.\n\n$game_concept_ruler$ должен поддерживать высокое [Concept('opinion', 'мнение')|E] и укреплять отношения со своими $game_concept_tributaries$, чтобы сохранять их надолго. После престолонаследия $game_concept_tributaries$ могут разойтись, если $game_concept_ruler$ не окажется достойным [Concept('mandala_succesor', 'преемником мандалы')|E]."

 game_concept_mandala_government_desc: "$game_concept_mandala_desc$"

 mandala_government_desc: "\n$game_concept_mandala_desc$\n\n#F Лепестки мандалы могут увянуть и погибнуть, но в её сердцевине остаётся божественное право, воплощённое в боге-короле. Достаточно честолюбивый правитель способен сохранить мандалу #EMP навечно#!. #!"

 mandala_vassal_desc: "$game_concept_mandala_desc$"

 WANUA_GLOSS: "Совокупность небольших прибрежных деревень и морских общин, которую часто называют #italic вануа#! и которая создала самобытную культуру мореходства, торговли и набегов."

 wanua_government_desc: "\n$game_concept_wanua_desc$\n\n#F Из своих береговых поселений правители [Glossary( 'вануа', 'WANUA_GLOSS' )] способны пересекать моря, чтобы торговать и совершать налеты намного эффективнее, чем материковые племенные вожди.#!"

 convert_to_mandala_government_decision_desc: "Так начертано в звёздах — сияющий и манящий маяк божественности. Среди нас восходит бог-король, которому суждено властвовать над всеми планами бытия."

 assimilate_to_mandala_decision_government_desc: "Божество, живущее среди нас. Подобное устройство правительства принесет нам только выгоды. Посмотрим, чему мы сможем научиться, приняв этот способ управления."

 building_type_mandala_capital_01_desc: "Этот [Concept('great_project', 'великий проект')|E] — не просто храм. Это свидетельство нашей доблести, наших свершений, нашего #EMP величия#!. Такой храм воплощает власть и милосердие нашего божественного и могущественного бога-короля."

 building_mandala_capital_01_desc: "Скромное начало великого наследия: этот богато украшенный храм служит местом поклонения и молитв правящему богу-королю."

 building_mandala_capital_05_desc: "Редчайшая жемчужина зодчества: храмовый дворец расширили роскошными покоями для божественного бога-короля.\nПамятники, реликвии, сокровища — путешественники со всего света приезжают дивиться изобилию этого божественного храмового дворца."
