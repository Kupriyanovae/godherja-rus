l_russian:
 # Overrides for Mandala and Wanua government descriptions — removing Earth-specific references
 # (Devaraja = Sanskrit "God-King", Wanua = Maritime Southeast Asian term) and replacing
 # with world-agnostic or Godherja-appropriate descriptions.

 game_concept_mandala_desc: "Under the $game_concept_mandala$ [government_form|E], the [domain_limit|E] and amount of [direct_vassals|E] are limited. Instead the [liege|E] and [suzerain|E] are reliant on [tributaries|E] for expanding their realm. \n\nA Mandala [ruler|E] can aspire to be seen as a God-King and relies on [mandala_radiance|E] to acquire and keep $game_concept_tributaries$.\n\nA $game_concept_ruler$ must maintain [opinion|E] and grow relations with their $game_concept_tributaries$ to keep them long-term. On succession $game_concept_tributaries$ may scatter unless the $game_concept_ruler$ is a worthy [mandala_succesor|E]."

 game_concept_mandala_government_desc: "$game_concept_mandala_desc$"

 mandala_government_desc: "\n$game_concept_mandala_desc$\n\n#F The petals of the Mandala government may wither and die, but at the core stands the divine right, manifested in the God-King. An ambitious enough ruler can make the Mandala last, #EMP eternally#!. #!"

 mandala_vassal_desc: "$game_concept_mandala_desc$"

 WANUA_GLOSS: "A collection of small coastal villages and maritime communities, often called a #italic Wanua#!, that have developed a distinct culture of seafaring, trade, and raiding."

 wanua_government_desc: "\n$game_concept_wanua_desc$\n\n#F Из своих береговых поселений правители [Glossary( 'вануа', 'WANUA_GLOSS' )] способны пересекать моря, чтобы торговать и совершать налеты намного эффективнее, чем материковые племенные вожди.#!"

 convert_to_mandala_government_decision_desc: "It is written in the stars — a shining, tempting beacon of divinity. We have a budding God-King in our midst, who shall rule all planes of existence."

 assimilate_to_mandala_decision_government_desc: "Божество, живущее среди нас. Подобное устройство правительства принесет нам только выгоды. Посмотрим, чему мы сможем научиться, приняв этот способ управления."

 building_type_mandala_capital_01_desc: "This [great_project|E] is not just a temple. It is a testament to our mettle. Our accomplishments. Our #EMP grandeur#!. A temple such as this signifies the rule and benevolence of our divine and powerful God-King."

 building_mandala_capital_01_desc: "A humble beginning to a grand legacy, this ornate temple is a place to worship and pray to the ruling God-King."

 building_mandala_capital_05_desc: "A rarely seen architectural gem, the temple palace has been expanded with magnificent lodgings for the divine God-King.\nMonuments, relics, treasures — travelers come from all over to marvel at the excess of this divine temple palace."
