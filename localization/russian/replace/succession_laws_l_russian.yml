l_russian:
  feudal_elective_succession_law:0 "Аристократические выборы"
 feudal_elective_candidates_tooltip:1 "Чтобы иметь законное право на участие в аристократических выборах, персонаж должен удовлетворять одному из следующих условий:\n$EFFECT_LIST_BULLET$Быть законнорожденным [Concept( 'close_family', 'близким родственником' )|E] текущего правителя, не претендующим на наследование теократии или республики. Дети кандидата не могут участвовать в выборах в качестве кандидатов.\n$EFFECT_LIST_BULLET$Быть [Concept( 'claimant', 'претендентом' )|E] на титул, не претендующим на наследование теократии или республики\n$EFFECT_LIST_BULLET$Быть имеющим право называться аристократическим [Concept( 'elector', 'выборщиком' )|E] титула"

 feudal_elective_electors:0 "Правители и вассалы"
 feudal_elective_electors_tooltip:0 "Право называться [Concept( 'elector', 'выборщиками' )|E] на аристократических выборах имеют вассалы, отвечающие всем следующим критериям:\n$EFFECT_LIST_BULLET$Быть [Concept( 'de_jure', 'де-юре' )|E] вассалом титула\n$EFFECT_LIST_BULLET$Быть прямым вассалом титула\n$EFFECT_LIST_BULLET$Быть лишь на один или два [Concept( 'rank', 'ранга' )|E] ниже [Concept( 'title', 'титула' )|E]"