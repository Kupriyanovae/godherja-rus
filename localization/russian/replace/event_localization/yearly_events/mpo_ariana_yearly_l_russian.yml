l_russian:
 mpo_events_ariana.0030.desc: "«Чаши с [ROOT.Char.Custom('GetCulturalKumisVariant')] на нашем пиру совсем опустели, мо[Select_CString(ROOT.Char.IsFemale, 'я', 'й')] [ROOT.Char.GetTitleAsNameNoTooltip]... — жалуется [spymaster.GetName]. — Но, по крайней мере, я знаю, кто виноват в этой засухе». [Select_CString(spymaster.IsFemale, 'Она', 'Он')|U] указывает на [bartender.GetName], котор[Select_CString(bartender.IsFemale, 'ую', 'ого')] заметили за тем, как [Select_CString(bartender.IsFemale, 'она обменивала', 'он обменивал')] чашу кумыса на что-то у другого простолюдина.\n\n«Вы ведь не позволите нашим гостям остаться без угощения, правда? Всё это было приготовлено специально для великих правителей и госпож державы [ROOT.Char.GetPrimaryTitle.GetNameNoTier]», — спрашивает [spymaster.GetName], хитро улыбаясь."
 mpo_events_ariana.0040.desc_wedding_feast: "Зал слабо освещён, воздух наполнен смехом и ароматом [ROOT.Char.Custom('GetExpensiveMeal')]. Следующая часть праздника — это маскарад, где гости и хозяева скрывают свои лица, как поступают ольтены, ради загадки и волнения. Я осторожно надеваю маску, тщательно скрывая себя, и присоединяюсь к остальным гостям в танцах и веселье. По мере продолжения торжества меня всё больше тянет к загадочной фигуре среди карточных игроков. [Select_CString(masked_guest.IsFemale, 'Она', 'Он')|U] скрыта в изысканной маске, изображающей [ROOT.Char.Custom('GetRandomRegionalBird')]. [Select_CString(masked_guest.IsFemale, 'Она', 'Он')|U] манит меня, и я не могу сопротивляться этому притяжению.\n\nВскоре наш разговор становится всё более чувственным, и я ощущаю связь, выходящую за пределы маски. [Select_CString(masked_guest.IsFemale, 'Она', 'Он')|U] притягивает меня в тёплые объятия и намекает, что пора перейти в более уединённое место."
 mpo_events_ariana.0090.desc: "Проведя некоторое время на пастбищах с пастухами, [child.GetFirstName] возвращается в [SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')] с улыбкой на лице.\n\n"
 mpo_events_ariana.0090.desc_younger: "«[child.Custom2('RelationToMeShort', ROOT.Char)|U], я хочу быть [Select_CString(child.IsFemale, 'пастушкой', 'пастухом' )]! — кричит [Select_CString(child.IsFemale, 'она', 'он' )]. — Они весь день с овечками и так счастливы! А [ROOT.Char.GetTitleAsNameNoTooltip] — это же скука смертная!»\n\n[Select_CString(child.IsFemale, 'Она', 'Он' )] протягивает пучок свежеостриженной шерсти, и, хотя та грязная и жесткая, глаза ребенка сияют гордостью."
 mpo_events_ariana.0090.desc_older: "«Я хочу пасти овец, и больше ничего! Ты, [child.Custom2('RelationToMeShort', ROOT.Char)], — [ROOT.Char.GetTitleAsNameNoTooltip], а мне этого не надо! — кричит [Select_CString(child.IsFemale, 'она', 'он' )]. — У них такая простая жизнь, никаких войн и государственных забот».\n\n[Select_CString(child.IsFemale, 'Она', 'Он' )] протягивает комок свежесрезанной шерсти, и хотя она так грязна и жестка, в голосе ребенка я слышу настоящую страсть."
 mpo_events_ariana.0110.desc_ending: "Предлагаю перенести ваше жилище «[SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')]» в [new_capital.GetNameNoTier] — возможно, там вас ждёт процветание»."
 mpo_home_sweet_home_modifier: "Родное жилище «[SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')]» — милое жилище «[SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')]»"
 mpo_home_sweet_home_modifier_desc: "Этот персонаж очень привязался к своему жилищу «[SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')]» и месту, где оно стоит."
