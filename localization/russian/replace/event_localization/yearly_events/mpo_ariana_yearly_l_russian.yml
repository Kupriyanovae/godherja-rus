l_russian:
 mpo_events_ariana.0030.desc: "Чаши с [ROOT.Char.Custom('GetCulturalKumisVariant')] на нашем пиру уже совсем опустели, мо[Select_CString(ROOT.IsFemale, 'я', 'й')] [ROOT.Char.GetTitleAsNameNoTooltip]..." — жалуется [spymaster.GetName]. — "Но, по крайней мере, я знаю, кто виноват в этой засухе." [Select_CString(spymaster.IsFemale, 'Она', 'Он')|U] указывает на [bartender.GetName], которого замечают за обменом чаши кумысa на что-то у другого простолюдина.\n\n«Ты ведь не позволишь нашим гостям остаться без угощения, правда? Ведь всё это было приготовлено специально для великих правителей и леди [ROOT.Char.GetPrimaryTitle.GetNameNoTier].» — [Select_CString(spymaster.IsFemale, 'спрашивает', 'спрашивает')] [spymaster.GetSheHe], с хитрой улыбкой на лице [spymaster.GetHerHis]."
 mpo_events_ariana.0040.desc_wedding_feast: "Зал слабо освещён, воздух наполнен смехом и ароматом [ROOT.Char.Custom('GetExpensiveMeal')]. Следующая часть праздника — это маскарад, где гости и хозяева скрывают свои лица, как поступают [Concept('olteni', 'ольтены')|e], ради загадки и волнения. Я осторожно надеваю маску, тщательно скрывая себя, и присоединяюсь к остальным гостям в танцах и веселье. По мере продолжения торжества меня всё больше тянет к загадочной фигуре среди карточных игроков. [Select_CString(masked_guest.IsFemale, 'Она', 'Он')|U] скрыта в изысканной маске, изображающей [ROOT.Char.Custom('GetRandomRegionalBird')]. [Select_CString(masked_guest.IsFemale, 'Она', 'Он')|U] манит меня, и я не могу сопротивляться этому притяжению.\n\nВскоре наш разговор становится всё более чувственным, и я ощущаю связь, выходящую за пределы маски. [Select_CString(masked_guest.IsFemale, 'Она', 'Он')|U] притягивает меня в тёплые объятия и намекает, что пора перейти в более уединённое место."
 mpo_events_ariana.0090.desc: "After having spent some time in the pastures with shepherds, [child.GetFirstName] returns to the [SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')] with a smile on [child.GetHerHis] face.\n\n"
 mpo_events_ariana.0090.desc_younger: "«Я хочу стать пастухом, [child.Custom2('RelationToMeShort', ROOT.Char)]!» — восклицает [child.GetSheHe]. — «Они весь день проводят с овцами, и посмотри, какие они счастливые. Быть [ROOT.Char.GetTitleAsNameNoTooltip] скучно!»\n\n[child.GetSheHe|U] протягивает мне только что состриженный пучок шерсти, и, хоть он грубый и грязный, я вижу гордость в глазах [child.GetHerHis]."
 mpo_events_ariana.0090.desc_older: "«Я хочу быть тем, кто пасёт овец, а не [ROOT.Char.GetTitleAsNameNoTooltip], как ты, [child.Custom2('RelationToMeShort', ROOT.Char)]», — восклицает [child.GetSheHe]. — «Их жизнь кажется такой простой, без забот о войне и управлении».\n\n[child.GetSheHe|U] протягивает мне только что состриженный пучок шерсти, и, хоть он грубый и грязный, я чувствую страсть в словах [child.GetHerHis]."
 mpo_events_ariana.0110.desc_ending: "I suggest moving your [SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')] to [new_capital.GetNameNoTier], and you might find prosperity there.""
 mpo_home_sweet_home_modifier: "[SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')] Sweet [SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')]"
 mpo_home_sweet_home_modifier_desc: "This character has grown quite attached to their [SelectLocalization( GetPlayer.IsValid, 'GH_GET_YURT_TYPE','Yurt')] and its location."