l_russian:
 court.0110.desc.outro:0 "«[Select_CString(parent.IsFemale, 'Моя мать', 'Мой отец')] бранит меня без тени сожаления\n\n— Каждую ночь, что ты тратишь на мирские утехи, ты приближаешься к [ROOT.Char.GetFaith.NegativeAfterLife]! — добавляет [chaplain.GetNameNoTooltip]. — Мы вразумляем тебя ради спасения твоей души, [Select_CString(ROOT.Char.IsFemale, 'дитя моё', 'дитя моё')]. Ты должен[Select_CString(ROOT.Char.IsFemale, 'а', '')] дать обет безбрачия — лишь это спасёт тебя от вечных мук»"
 court.0103.desc.saint_bones:0 "[Select_CString(executioner.IsFemale, 'Она', 'Он')] [Select_CString(executioner.IsFemale, 'вынимала', 'вынимал')] костный мозг из костей безродных заключённых и [Select_CString(executioner.IsFemale, 'продавала', 'продавал')] их как поддельные артефакты, обманывая иноземцев и священнослужителей, которые принимали их за мощи Святых Пути!"
