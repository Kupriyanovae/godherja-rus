l_russian:
 court.0110.desc.outro:0 "[Select_CString(parent.IsFemale, 'Моя мать', 'Мой отец')] бранит меня без тени сожаления.\n\n«Каждую ночь, проведённую в мирских утехах, ты делаешь ещё один шаг к [ROOT.Char.GetFaith.NegativeAfterLife]! — добавляет [chaplain.GetNameNoTooltip]. — Мы пришли спасти твою душу, дорогое дитя. Принеси обет безбрачия: лишь это избавит тебя от вечных мук»."
 court.0103.desc.saint_bones:0 "[Select_CString(executioner.IsFemale, 'Она извлекала', 'Он извлекал')] костный мозг из костей заключённых низкого происхождения и [Select_CString(executioner.IsFemale, 'продавала', 'продавал')] эти кости под видом реликвий, обманывая иноземцев и священнослужителей, которые покупали их, считая мощами святых Пути!"
