 court.6050.desc_sonetti:0 "Страницы исписаны стихами, изящными по форме, но сладострастными по содержанию. Нежные слова воспевают ангельскую красоту самых разных женщин, едва скрывая низменные желания поэта..."
 6050.desc_generic:0 "Это явно непристойное сочинение, полное чувственных соблазнов, низменных ухищрений и описаний пышных грудей..."
 hold_court.6230.d:0 "[ROOT.Char.GetFaith.HighGodName] ведёт их."
