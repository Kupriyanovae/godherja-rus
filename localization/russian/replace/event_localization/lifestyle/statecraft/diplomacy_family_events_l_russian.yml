 diplomacy_family.0009.desc:0 "[disagreeable_heir.GetTitledFirstName] [Select_CString(disagreeable_heir.IsFemale, 'согласилась', 'согласился')] принять моё наставничество, пусть и без особого энтузиазма.\n\nБоюсь, с таким характером из [Select_CString(disagreeable_heir.IsFemale, 'неё', 'него')] не выйдет хорошего правителя. Но по-настоящему отрезвляющий опыт может помочь [Select_CString(disagreeable_heir.IsFemale, 'ей', 'ему')] осознать, насколько неразумно такое поведение.\n\nЧто нам делать?"
