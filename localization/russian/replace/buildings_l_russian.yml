l_russian:
 building_cereal_fields_01_desc:1 "Зерновые поля — основа аристократической экономики. Здесь трудятся небольшие, но щедрые крестьянские семьи, которые едва ли не сами вызываются отдать значительную часть урожая в качестве десятины своему правителю!"
 building_tribe_02_desc:1 "При создании этого укрепленного поселения строители черпали вдохновение в более «цивилизованных» замках, добавив множество новых оборонительных элементов."


 building_type_scriptorium_01: "Дом знаний"
 building_type_scriptorium_01_desc: "Дома знаний дают образованным и любознательным людям место, где они могут записывать свои познания и сохранять мудрость для будущих поколений."
 building_scriptorium_01: "Библиотеки"
 building_scriptorium_01_desc: "Библиотека полна книг — от небольших трактатов до обширных томов по философии, истории и естествознанию. Здесь хранится великое богатство знаний."
 building_scriptorium_02: "Палаты переписчиков"
 building_scriptorium_02_desc: "Переписчики день и ночь трудятся в копировальных залах, размножая рукописи, чтобы знания распространялись и сохранялись."
 building_scriptorium_03: "Дом переводов"
 building_scriptorium_03_desc: "Здесь учёные переводят труды с древних и чужеземных языков на местный язык науки, открывая доступ к далёким знаниям."
 building_scriptorium_04: "Дом писцов"
 building_scriptorium_04_desc: "Многочисленные переписчики позволяют учёным и авторам диктовать свои труды, которые затем тщательно записываются."
 building_scriptorium_05: "Система каталогов"
 building_scriptorium_05_desc: "Труды тщательно распределяются по месту происхождения и тематике, благодаря чему учёным гораздо легче находить нужное."
 building_scriptorium_06: "Большие архивы"
 building_scriptorium_06_desc: "Здесь собирают, переводят и сохраняют труды из множества земель, чтобы заключённые в них знания не были утрачены."
 building_scriptorium_07: "Школа языков"
 building_scriptorium_07_desc: "Ученики изучают древние и чужеземные языки, что помогает учёным исследовать и сохранять редкие тексты."
 building_scriptorium_08: "Тайные архивы"
 building_scriptorium_08_desc: "Обширные подземные архивы защищают редкие и ценные труды, в том числе множество текстов, найденных в далёких землях."

