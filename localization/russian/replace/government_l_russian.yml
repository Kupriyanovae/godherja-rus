l_russian:
 feudal_government: "Аристократия"
 feudal_government_adjective: "Аристократическ"
 feudal_government_realm: "Аристократическая держава"
 feudal_government_vassals_label: "Аристократические [Concept('obligations', 'обязательства')|E] определяются [Concept('vassal_contract', 'вассальным договором')|E] каждого [Concept('vassal', 'вассала')|E]"
 feudal_government_desc: "\n$game_concept_feudal_desc$\n\n#F Аристократия — самая распространенная форма правления на [Concept('aeras', 'Аэрасе')|E], будь то неофициальное управление землями со стороны династических военачальников или строгие феодальные системы, подобные тем, что существуют в [Concept('chevalie', 'Шевалье')|E]. В ее основе лежат отношения между землевладельцем и теми, кто подчиняется его законам и приказам. Правители, владеющие землей, назначают вассалов, которым передаются территории под управление. В ответ вассалы предоставляют своему правителю [Concept('soldiers', 'войска')|E] и платят [Concept('taxes', 'налоги')|E].#!"

 theocracy_government_desc: "\n$game_concept_theocracy_desc$\n\n#F В теократическом правительстве вся власть принадлежит религиозной организации. Во главе стоит жрец или жрица, исполняющие волю божества на Аэрасе.#!"