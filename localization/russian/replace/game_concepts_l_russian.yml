l_russian:
 game_concept_vassal_obligations_desc: "$game_concept_vassal_obligations$ определяют, сколько [Concept('tax', 'налогов')|E] и сколько [Concept('levies', 'ополчения')|E] [Concept('vassal', 'вассал')|E] предоставляет своему [Concept('liege', 'сюзерену')|E]. [Concept('government_form', 'Форма правления')|E] вассала определяет, какими будут $game_concept_vassal_obligations$.\n\n#weak Например, у аристократических вассалов их $game_concept_vassal_obligations$ устанавливаются их [Concept('vassal_contract', 'вассальным договором')|E].#!\n\n[Concept('feudal', 'Аристократические')|E] [Concept('vassals', 'вассалы')|E] платят процент от своих общих [Concept('taxes', 'налогов')|E] и [Concept('levies', 'ополчения')|E] через обязательства «Дворянские налоги» и «Дворянское ополчение». #EMP Эти [Concept('modifier_contributions', 'взносы-модификаторы')|E] в свою очередь могут быть изменены особыми условиями договора, такими как [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )] или [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )].#!"

 game_concept_religion_desc: "Одна $game_concept_religion$ может состоять из множества различных деноминаций, называемых [Concept('faiths', 'конфессиями')|E]. Религии, в свою очередь, принадлежат к одной из множества [Concept('religious_families', 'религиозных семейств')|E]: [GetReligionFamily('gh_aironoian').GetName], [GetReligionFamily('gh_rf_aversarian').GetName], [GetReligionFamily('rf_eastern').GetName], [GetReligionFamily('gh_marcher').GetName], [GetReligionFamily('rf_pagan').GetName] или [GetReligionFamily('gh_sarradonian').GetName]."
 game_concept_religious_family_desc: "$game_concept_religious_family$ — это группа [Concept('religions', 'религий')|E]. $game_concept_religious_family$ влияет на то, как различные религии и входящие в них [Concept('faiths', 'конфессии')|E] относятся друг к другу."
 game_concept_succession_law_desc: "Каждый [Concept('ruler', 'правитель')|E] имеет основной закон о наследовании, который определяет, что происходит с его [Concept('titles', 'титулами')|E] при [Concept('succession', 'наследовании')|E].\n\nКроме того, отдельный титул иногда может иметь собственный закон о наследовании, который имеет приоритет над законом по умолчанию. Например, в империи может действовать выборное право, даже если у императора основным законом о наследовании является разделение.\n\nВы можете изменить закон о наследовании только при соответствующем уровне [Concept('crown_authority', 'авторитета короны')|E]."

 game_concept_vassal_contract: "Дворянский договор"
 game_concept_vassal_contracts: "Дворянские договоры"
 game_concept_contract: "Договор"
 game_concept_vassal_contract_desc: "$game_concept_contract$ определяет [Concept('obligations', 'обязательства')|E] между [Concept('vassal', 'вассалом')|E] и его [Concept('liege', 'сюзереном')|E]. Только аристократическая и клановая [Concept('government_forms', 'формы правления')|E] позволяют каждому вассалу договариваться об обязательствах индивидуально.\n\nОсобые договоры, такие как контракты типа #V $special_contract_march_short$#!, #V $special_contract_scutage_short$#! или #V $special_contract_palatinate_short$#!, могут иметь только [Concept('vassals', 'вассалы')|E] ранга [Concept('duchy', 'герцогства')|E] или выше."
 
 game_concept_feudal: "Аристократический"
 game_concept_feudal_government: "Аристократическое правление"
 game_concept_feudalism: "Аристократия"
 game_concept_feudal_desc: "При аристократической [Concept('government_form', 'форме правления')|E] [Concept('liege', 'сюзерен')|E] дает своим [Concept('vassals', 'вассалам')|E] [Concept('land', 'земли')|E] в управление в обмен на [Concept('levies', 'ополчение')|E] и [Concept('taxes', 'налоги')|E], что регулируется индивидуальными [Concept('vassal_contracts', 'вассальными договорами')|E] между вассалом и сюзереном."

 game_concept_theocracy_desc: "$game_concept_theocracy$ — это доступная для игры [Concept('government_form', 'форма правления')|E], существующая у некоторых [Concept('faiths', 'конфессий')|E] в зависимости от их [Concept('doctrines', 'доктрин')|E]. Обычно её возглавляет [Concept('head_of_faith', 'глава конфессии')|E] или [Concept('landed', 'землевладельческий')|E] [Concept('realm_priest', 'державный священник')|E]. Епископ также может стать [Concept('independent', 'независимым')|E] теократическим правителем в своих собственных владениях."

 game_concept_republic_desc: "$game_concept_republic_government$ — это доступная для игры [Concept('government_form', 'форма правления')|E], при которой избранный гражданин правит пожизненно; это государственное устройство бюргеров и торговцев.\n\n[Concept('republican', 'Республиканские')|E] [Concept('vassals', 'вассалы')|E] предоставляют [Concept('levies', 'ополчение')|E] и [Concept('taxes', 'налоги')|E] своему [Concept('liege', 'сюзерену')|E] в зависимости от [Concept('aptitude', 'эффективности')|E] [Concept('tax_collector', 'сборщика налогов')|E] указанного сюзерена."
 
 game_concept_initial_legitimacy_desc: "[Concept('legitimacy', 'Легитимность')|E], которой обладает [Concept('character', 'персонаж')|E], когда становится землевладельцем.\n\nОна рассчитывается на основе [Concept('dynasty_prestige_level', 'уровня величия династии')|E], отношений с предшественником, [Concept('court_grandeur', 'величия двора')|E], пола, [Concept('bastardy', 'незаконнорожденности')|E], лет правления в качестве [Concept('ruler', 'правителя')|E], династического [Concept('dynasty_perk', 'наследия')|E] на легитимность, [Concept('diplomacy', 'дипломатии')|E], [Concept('virtues', 'добродетелей')|E], [Concept('sins', 'грехов')|E] и других особых [Concept('traits', 'свойств')|E], таких как [GetTrait('diplomat').GetName( GetNullCharacter )] и [GetTrait('just').GetName( GetNullCharacter )].\n\n[Concept('heirs', 'Наследники')|E] унаследуют [GetDefine( 'NCharacter', 'LEGITIMACY_INHERITED' )|V%^] от легитимности предыдущего правителя, если наследуют [Concept('title', 'титул')|E] более высокого [Concept('title_tier', 'ранга')|E]."

 game_concept_elephant_cavalry: "Elephantid Cavalry"
 game_concept_elephant_cavalry_desc: "$game_concept_elephant_cavalry$ are mounted, often armored [men_at_arms|E].\n\nWhile each kind of $game_concept_elephant_cavalry$ is unique, they are generally a strong [counter|E] to infantry units, and are in turn Countered by [spearmen|E].\n\nWhile most types of $game_concept_elephant_cavalry$ excel in [GetTerrain('jungle').GetName] [terrain|E], some — like [GetMaA('war_mammoth').GetName] — have their own distinct strengths and weaknesses."