 # the Imperial Sea Road
 #GH_TODO_AUH Adapt locs for ISR
 silk_road_situation: "Имперский морской путь"

 game_concept_silk_road_situation: "Имперский морской путь"
 game_concept_silk_road_situation_desc: "$game_concept_silk_road_situation$ — не одна дорога, а целая сеть маршрутов, связывающих самые отдалённые уголки цивилизации ради обмена золотом, товарами и идеями. Иметь доступ к Имперскому морскому пути — значит иметь доступ ко всем богатствам мира.\n\nРазные уровни доступа к Имперскому морскому пути дают различные бонусы к золоту и могут открывать уникальные возможности для получения экзотических [Concept('innovations', 'инноваций')|E]. Количество золота и знаний, перемещающихся по Имперскому морскому пути, зависит от его процветания, на которое влияют многие факторы, в том числе войны, события и китайский [Concept('dynastic_cycle', 'династический цикл')|E]."

 situation_silk_road_phase_exceptional_bounty: "Исключительное богатство"
 situation_silk_road_phase_exceptional_bounty_desc: "Когда на Имперском морском пути наступают благоприятные времена, здесь можно обрести несметные сокровища, получить величайшую прибыль, а идеи и новшества распространяются особенно широко."
 situation_silk_road_phase_steady_trading: "Стабильная торговля"
 situation_silk_road_phase_steady_trading_desc: "Торговцы получают прибыль, стороны торгуются об условиях, а дела идут своим чередом. Где-то ещё могут встретиться более выгодные возможности, но Имперский морской путь надёжнее."
 situation_silk_road_phase_hardship: "Невзгоды"
 situation_silk_road_phase_hardship_desc: "Войны, бедствия и непредсказуемые повороты судьбы полностью парализовали Имперский морской путь. Ни деньги, ни идеи больше не движутся, и следование его маршрутами приносит лишь горе и нищету."

 silk_road_situation_participant_group_china_realm: "Земли Поднебесной"
 silk_road_situation_participant_group_china_realm_desc: "Персонаж — [Concept('ruler', 'правитель')|E] не [Concept('nomadic', 'кочевник')|E] в ситуации «[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName]»."
 silk_road_situation_participant_group_silk_road_domain: "Домены Имперского морского пути"
 silk_road_situation_participant_group_silk_road_domain_desc: "Персонаж — [Concept('independent_ruler', 'независимый правитель')|E] не [Concept('nomadic', 'кочевник')|E], не участвующий в ситуации «[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName]», чей [Concept('domain', 'домен')|E] располагается в регионе [GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]."
 silk_road_situation_participant_group_silk_road_realm: "Державы Имперского морского пути"
 silk_road_situation_participant_group_silk_road_realm_desc: "Персонаж — [Concept('independent_ruler', 'независимый правитель')|E] не [Concept('nomadic', 'кочевник')|E], не участвующий в ситуации «[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName]», чья [Concept('realm', 'держава')|E] располагается в регионе [GetGeographicalRegion('dlc_tgp_silk_road_route_region').GetName]."
 silk_road_situation_participant_group_silk_road_periphery: "Периферийные державы"
 silk_road_situation_participant_group_silk_road_periphery_desc: "Персонаж — [Concept('independent_ruler', 'независимый правитель')|E] не [Concept('nomadic', 'кочевник')|E], не участвующий в ситуации «[GetSituation('silk_road_situation').GetSubRegionByKey('region_silk_road_proper_china').GetName]», чья [Concept('realm', 'держава')|E] располагается в регионе [GetGeographicalRegion('tgp_silk_road_region').GetName]."
 silk_road_situation_participant_group_silk_road_nomad: "Степные кочевники"
 silk_road_situation_participant_group_silk_road_nomad_desc: "Персонаж — [Concept('independent_ruler', 'независимый правитель')|E]-[Concept('nomadic', 'кочевник')|E], который разбил лагерь на [Concept('silk_road_situation', 'Имперском морском пути')|E]"
 silk_road_situation_all: "Текущая [Concept('situation_phase', 'фаза ситуации')|E] на [Concept('silk_road', 'Имперском морском пути')|E]"

 silk_road_phase_effects: "Имперский морской путь: [SITUATION_PHASE_TYPE.GetNameNoTooltip]"

 debug_change_silk_road_cycle: "Изменить фазу Имперского морского пути"



 visit_silk_road_market_decision: "Посетить рынок Имперского морского пути"
 visit_silk_road_market_decision_desc: "Богатства Имперского морского пути хранятся не только в монетах. Порой от базара к базару на верблюжьих спинах странствуют новые... #italic мысли#!. Стоит посетить подходящий рынок, поговорить с нужными людьми — и можно узнать тайны, неведомые остальному миру."
 visit_silk_road_market_decision_tooltip: "Отправиться на рынок Имперского морского пути, чтобы открыть уникальные [Concept('innovations', 'инновации')|E]"
 THE_SILK_ROAD_AWAITS: "Имперский морской путь ждёт!"

 no_building_at_silk_road_market_desc: "В этом [Concept('location', 'месте')|E] #bold нет#! [Concept('special_building', 'особой постройки')|E] Имперского морского пути"

 SILK_ROAD_WINDOW_CATALYSTS_LIST: "Катализаторы Имперского морского пути"
 
 SILK_ROAD_HEADER_DESC: "Сеть рынков, путевых станций и истоптанных троп в безлюдных землях — Имперский морской путь даёт возможность сколотить состояние и открыть новые идеи тем, кому хватит смелости пройти его легендарными маршрутами."



