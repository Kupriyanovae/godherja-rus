l_russian:

 # GH: The Granmaer Throne reclaims direct rule from the Kanzelerij's cliques.
 # Vanilla text framed this as an eastern imperial restoration; retheming for Konijkmener lore.
 tgp_japan_decision.9301.desc: "Я вновь [Select_CString(ROOT.Char.IsFemale, 'обрела', 'обрел' )] своё законное место во главе державы.\n\nКлики, стремившиеся лишь к удовлетворению собственных амбиций, больше не будут править от моего имени. Вся власть снова принадлежит Гранмаерскому престолу."
 tgp_japan_decision.9301.a: "Пусть Престол вновь направляет эти земли."

 tgp_japan_decision.9302.desc: "Молва о возвращении [Select_CString(tenno.IsFemale, 'правительницы', 'правителя' )] разносится по стране, подобно лесному пожару. Желая вырвать власть из рук бездельников и недоброжелателей, [tenno.GetName] [Select_CString(tenno.IsFemale, 'восстановила', 'восстановил' )] [tenno.GetHerHis] законные полномочия."
