l_russian:

 game_concept_merit_level_desc: "$game_concept_merit_level$ [Concept('character_possessive', 'персонажа')|E] показывает, насколько тот подходит на должность [Concept('governor', 'губернатора')|E] в [Concept('aversaria', 'аверсарианских')|E] державах с [Concept('administrative_government', 'административной формой правления')|E].\n\nОн отражает документально подтверждённые достижения и нравственное поведение в соответствии с гуманистическими идеалами через количество накопленных [Concept('merit', 'заслуг')|E].\n\nЧиновник с высоким $game_concept_merit_level$ получает более высокий [Concept('candidate_score', 'рейтинг кандидата')|E] и большую [Concept('governor_salary', 'губернаторскую плату')|E].\n\nУровни:\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_5' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_8' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_9' ).GetNameWithTooltip|L]"

 game_concept_seal_of_investiture_desc: "$game_concept_seal_of_investiture$ — одновременно юридический документ и почитаемый символ милости Чистейшего, подтверждающий особый статус владельца как верного и привилегированного [Concept('tributary', 'данника')|E] державы [SelectLocalization( GetPlayer.IsValid, 'game_concept_seal_of_investiture_desc_ingame', 'h_aversarinas_aautokrata' )].\n\n$game_concept_seal_of_investiture$ можно даровать $game_concept_tributaries$ с высокой [Concept('imperial_grace', 'имперской милостью')|E] во время заключительной церемонии успешной #bold миссии с данью#!."
 game_concept_seal_of_investiture_desc_ingame: "[GetTitleByKey('h_aversarinas_aautokrata').GetDefinitiveName]"

 game_concept_son_of_heaven: "Воплощение Чистейшего"
 game_concept_son_of_heaven_possessive: "Воплощения Чистейшего"
 game_concept_son_of_heaven_desc: "$game_concept_son_of_heaven$ — [Concept('hegemon', 'гегемон')|E] [Concept('aversaria', 'Аверсарии')|E] и [Concept('top_liege', 'верховный сюзерен')|E] державы с [Concept('celestial_government', 'небесной формой правления')|E].\n\nУ обладателя статуса «$game_concept_son_of_heaven$» есть особая форма [Concept('legitimacy', 'легитимности')|E] — [Concept('mandate_of_heaven', 'Мандат Света')|E] — и уникальная [Concept('situation_participant_group', 'группа участников ситуации')|E], которая также называется «$game_concept_son_of_heaven$»."

 game_concept_mandate_of_heaven: "Мандат Света"
 game_concept_mandate_of_heaven_mandate: "Мандат"
 game_concept_mandate_of_heaven_desc: "$game_concept_mandate_of_heaven$ — особый вид [Concept('legitimacy', 'легитимности')|E], доступный только [Concept('son_of_heaven', 'Воплощению Чистейшего')|E]. Он отражает право монарха на власть и определяет, кого всё человечество считает верховным правителем.\n\nМандат тесно связан с [Concept('dynastic_cycle', 'династическим циклом')|E]. Цикл влияет на то, как правящий монарх получает легитимность, а уровень Мандата монарха может изменить [Concept('situation_dynastic_cycle_phase', 'фазу династического цикла')|E]."
