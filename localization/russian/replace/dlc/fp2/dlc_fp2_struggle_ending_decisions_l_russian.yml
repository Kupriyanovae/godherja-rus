l_russian:
 struggle_iberia_ending_hostility_decision_desc:0 "Пришла пора сильному лидеру наконец-то вытащить этот побережье из трясины бесконечных войн и разладов. Сьялвольским побережьем будет править [ROOT.Char.GetFaith.GetNameNoTooltip|l][Select_CString(ROOT.Char.IsFemale, 'ая', 'ий' )] [ROOT.Char.Custom('GetQueenKing')|l] под [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|l]им знаменем!" 
 struggle_iberia_ending_hostility_decision_tooltip:0 "Завершить [Concept('struggle', 'борьбу')|E] Обрядов"  
 struggle_iberia_ending_hostility_decision_confirm:1 "Завершить борьбу Обрядов"  

 struggle_iberia_ending_hostility_decision_region_tt:2 "Никакой другой [Concept( 'independent', 'независимый' )|E] [Concept( 'struggle_involved', 'участвующий в борьбе' )|E] [Concept( 'ruler', 'правитель' )|E] не контролирует более [SCOPE.ScriptValue('fp2_struggle_hostility_region_percent_value')|0]% региона [GetGeographicalRegion('struggle_rite_wars_north').GetName]"  

 fp2_struggle_hostility_conversion_tt:1 "Скорость [Concept( 'councillor_tasks', 'заданий' )|E] $task_conversion$ и $task_promote_culture$ в [Concept( 'region', 'регионе' )|E] [GetGeographicalRegion('struggle_rite_wars_north').GetName]: #P +50%#!"  
 fp2_struggle_hostility_conversion_holy_tt:0 "Скорость [Concept( 'councillor_tasks', 'задания' )|E] $task_conversion$ в [Concept( 'region', 'регионе' )|E] [GetGeographicalRegion('struggle_rite_wars_north').GetName]: #P +50%#!"  
 fp2_struggle_hostility_conversion_culture_tt:0 "Скорость [Concept( 'councillor_tasks', 'задания' )|E] $task_promote_culture$ в [Concept( 'region', 'регионе' )|E] [GetGeographicalRegion('struggle_rite_wars_north').GetName]: #P +50%#!"  

 fp2_struggle_hostility_acceptance_tt:0 "Враждебность на Сьялвольском побережье"  

 fp2_struggle_hostility_house_faith_modifier_desc:0 "Этот дом завоевал большую часть Сьялвольского побережья во имя своей веры."  

 fp2_struggle_hostility_house_culture_modifier_desc:0 "Этот дом завоевал большую часть Сьялвольского побережья во имя своего народа."  

 fp2_struggle_hostility_house_combined_modifier_desc:0 "Этот дом завоевал большую часть Сьялвольского побережья во имя своей веры и народа."  


 struggle_iberia_ending_compromise_decision_desc:0 "Бесконечные конфликты за побережье лишь ослабляют всех. Пришло время признать, что Сьялвольское побережье объединить не получится. Нас устроит и [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."  


 struggle_iberia_ending_compromise_decision_region_tt:0 "Вы контролируете менее [SCOPE.ScriptValue('fp2_struggle_compromise_owned_percent_value')|0]% [Concept( 'region', 'региона' )|E] [GetGeographicalRegion('struggle_rite_wars_north').GetName] (Сейчас: [SCOPE.ScriptValue('struggle_iberia_ending_compromise_decision_region_owned_percent_value')|0]%)"  
 struggle_iberia_ending_compromise_decision_other_region_tt:0 "Никакой другой [Concept( 'independent', 'независимый' )|E] [Concept( 'struggle_involved', 'участвующий в борьбе' )|E] [Concept( 'ruler', 'правитель' )|E] не контролирует [SCOPE.ScriptValue('fp2_struggle_compromise_involved_percent_value')|0]% или более [Concept( 'region', 'региона' )|E] [GetGeographicalRegion('struggle_rite_wars_north').GetName]"  


 struggle_iberia_ending_compromise_decision_interloper_tt:0 "Более [SCOPE.ScriptValue('fp2_struggle_compromise_uninvolved_percent_value')]% [Concept('region', 'региона')|E] [GetGeographicalRegion('struggle_rite_wars_north').GetName] удерживают [Concept( 'struggle_interloper', 'вмешавшиеся' )|E] или [Concept( 'struggle_uninvolved', 'не участвующие в борьбе' )|E] [Concept( 'rulers', 'правители' )|E] (Сейчас: [SCOPE.ScriptValue('struggle_iberia_ending_compromise_decision_region_interloper_percent_value')|1]%)"  


 fp2_struggle_compromise_create_new_kingdoms_tt:0 "Каждое [Concept( 'independent', 'независимое' )|E] или отдельное [Concept( 'duchy', 'герцогство' )|E] в [Concept( 'region', 'регионе' )|E] [GetGeographicalRegion('struggle_rite_wars_north').GetName] становится [Concept('de_jure', 'де-юре')|E] [Concept('kingdom', 'королевством')|E]"  
 fp2_struggle_compromise_create_new_empires_tt:1 "Каждое [de_jure|El] [Concept( 'kingdom', 'королевство' )|E] в [Concept( 'region', 'регионе' )|E] [GetGeographicalRegion('struggle_rite_wars_north').GetName], имеющее более [EmptyScope.ScriptValue('fp2_struggle_compromise_ending_minimal_empire_size')|0] [Concept( 'counties', 'графств' )|E], становится [de_jure|El] [Concept( 'empire', 'империей' )|E]. Остальные королевства [de_jure|El] войдут в состав соседней [Concept( 'empire', 'империи' )|E]."  


 TRUCE_FP2_COMPROMISE:0 "Компромисс на Сьялвольском побережье"  


 fp2_struggle_compromise_house_reward_modifier_desc:0 "Этот дом вывел свои владения из борьбы за Сьялвольское побережье."  


 fp2_struggle_compromise_defensive_reward_modifier_desc:1 "Это графство — историческая столица одного из княжеств Обрядов, пережившая столетия борьбы."  


 struggle_iberia_ending_conciliation_decision_desc:0 "Залечить многовековые раны будет непросто, но нам нужно это сделать, если мы хотим наконец принести на побережье долгий мир. Воистину, Сьялвольское побережье принадлежит нам всем."


 fp2_struggle_conciliation_acceptance_tt:0 "Примирение на Сьялвольском побережье"  


 fp2_struggle_conciliation_join_war_tt:1 "Навсегда разрешает [Concept( 'rulers', 'правителям' )|E] [Concept( 'struggle_involved', 'участвующих в борьбе' )|E] [Concept( 'culture', 'культур' )|E] и [Concept( 'faith', 'конфессий' )|E] присоединяться друг к другу в оборонительных [Concept( 'wars', 'войнах' )|E] против захватчиков из-за пределов региона [GetGeographicalRegion('struggle_rite_wars_north').GetName]."  


 fp2_struggle_conciliation_house_reward_modifier_desc:0 "Этот дом признал, что путь к долгосрочному миру на Сьялвольском побережье лежит через терпимость и дружбу."  


