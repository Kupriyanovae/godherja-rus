l_russian:

 # Added keys missing from the supplied Russian mod
 game_concept_canonized_desc:0 "[character|E], после смерти объявленный святым или приравненным к нему почитаемым праведником — например, святым Пути или чтимым предком, — получает [Concept('trait','свойство')|E] [GetTrait('saint').GetName( GetNullCharacter )].\n\nДобродетельная жизнь может завершиться $game_concept_canonization$: её добиваются с помощью [Concept('decision','решения')|E], иногда с благословения [Concept('head_of_faith','главы конфессии')|E], а закрепляет её освящение могилы праведника. Место упокоения начинает привлекать благочестивых путников, а останки могут стать [Concept('holy_relics','святыми реликвиями')|E]."
