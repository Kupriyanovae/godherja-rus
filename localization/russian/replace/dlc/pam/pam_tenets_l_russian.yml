l_russian:

 # Added keys missing from the supplied Russian mod
 doctrine_parameter_tenet_blessings_minstrels_poet_trait:0 "Получает [Concept('trait','свойство')|E] [GetTrait('lifestyle_poet').GetName( GetNullCharacter )], но с некоторой вероятностью вместо него может получить [Concept('trait','свойство')|E] [GetTrait('violet_poet').GetName( GetNullCharacter )]."
 doctrine_parameter_tenet_court_magi_judge_fickle_penalty:0 "[Concept('characters','Персонажи')|E] со свойством [GetTrait('fickle').GetName( GetNullCharacter )]: #N -10%#! к получаемому @piety_icon![Concept( 'piety', 'благочестию' )|E], #N -10#! к [Concept( 'opinion', 'отношению' )|E] [clergy|E]."
 doctrine_parameter_tenet_court_magi_judge_stubborn_bonus:0 "[Concept('characters','Персонажи')|E] со свойством [GetTrait('stubborn').GetName( GetNullCharacter )]: #P +2#! к @skill_stewardship_icon![Concept( 'stewardship', 'управлению' )|E], #P +10#! к [Concept( 'opinion', 'отношению' )|E] [liege|E], #P +10%#! к получаемому опыту [Concept( 'lifestyle', 'образа жизни' )|E] [learning|E]."
 doctrine_parameter_tenet_dulia_can_select_patron_saint:0 "Можно принять [Concept('decision', 'решение')|E] «[GetDecisionWithKey('pam_determine_patron_saint_decision').GetName]», если ваше [Concept('rite', 'течение')|E] не запрещает почитание святых"
 doctrine_parameter_tenet_dulia_canonization_faith_bonus:0 "[SelectLocalization(GetPlayer.IsValid, 'gh_doctrine_parameter_tenet_dulia_canonization_faith_bonus_ingame','gh_doctrine_parameter_tenet_dulia_canonization_faith_bonus_default')]"
 doctrine_parameter_tenet_dulia_cheaper_saint_costs:0 "[Concept('decisions', 'Решения')|E] «[GetDecisionWithKey('pam_canonize_saint_decision').GetName]» и «[GetDecisionWithKey('pam_extract_relic_decision').GetName]» стоят на #P 15%#! меньше @piety_icon![Concept('piety', 'благочестия')|E] и @gold_icon![Concept('gold', 'золота')|E]"
 doctrine_parameter_tenet_dulia_dynasty_prestige_from_relics:0 "[Concept('decision', 'Решение')|E] «[GetDecisionWithKey('pam_extract_relic_decision').GetName]» по отношению к члену [Concept('dynasty', 'династии')|E] приносит #P [EmptyScope.ScriptValue('medium_dynasty_prestige_gain')|0]#! ед. [Concept('dynasty_prestige', 'признания')|E]"
 doctrine_parameter_tenet_dulia_personal_sainthood_chance:0 "Повышает вероятность вашей [Concept('canonized', 'канонизации')|E] после смерти"
 tenet_acts_of_apostles_default_desc:0 "Несите небесный свет пребывающим во тьме, а отчаявшимся — надежду."
 tenet_adoptionism_default_desc:0 "Подобно тому как божество возвышает праведных и нарекает их своими, мы вправе принимать достойных под свой кров и называть их своими детьми."
 tenet_adoptionism_default_name:0 "Адопционизм"
 tenet_anachoresis_default_desc:0 "Отрешившись от мирского общества и удалившись в глушь, верующие могут обрести духовную чистоту."
 tenet_anachoresis_default_name:0 "Анахоретство"
 tenet_apostolic_succession_default_desc:0 "Непрерывная цепь рукоположений от первых служителей нашей веры до нынешнего дня гарантирует, что её учение передаётся без искажений."
 tenet_apostolic_succession_default_name:0 "Апостольское преемство"
 tenet_be_fruitful_and_multiply_default_desc:0 "По божественному установлению семья — тесный союз жизни и любви, а каждый родившийся в ней ребёнок — благословение для верующих."
 tenet_be_fruitful_and_multiply_default_name:0 "Плодитесь и размножайтесь"
 tenet_celestial_hierarchy_default_desc:0 "Небесное воинство разделено на упорядоченные чины, от высших до низших, и каждый служит божеству согласно своему предназначению."
 tenet_confession_default_desc:0 "Исповедуясь, грешники могут обрести отпущение грехов и примириться с божественным."
 tenet_confession_default_name:0 "Тайна исповеди"
 tenet_consolamentum_default_desc:0 "Через священный обряд утешения верующие очищаются от грехов и готовятся к переходу из этого мира в грядущий."
 tenet_consolamentum_default_name:0 "Консоламентум"
 tenet_divine_liturgy_default_desc:0 "Литургия — главное выражение нашей веры. В ней встречаются небо и земля, а верующие приобщаются к вечному поклонению божественному началу."
 tenet_divine_liturgy_default_name:0 "Божественная литургия"
 tenet_dulia_default_desc:0 "Все, кто ищет заступничества святых, должны обращаться к ним с благоговением и преданностью."
 tenet_dulia_default_historical_glossary:0 ""
 tenet_hesychasm_default_desc:0 ""
 tenet_hesychasm_default_name:0 "Исихазм"
 tenet_holy_myron_default_desc:0 ""
 tenet_holy_myron_default_name:0 "Священное миро"
 tenet_hyperdulia_default_desc:0 "Божественное начало почитают в женщинах, дарующих и взращивающих жизнь. К их советам прислушиваются, их права защищают, а рождение дочерей считают благословением для всего дома."
 tenet_hyperdulia_default_name:0 "Богоматерь"
 tenet_khachkar_default_desc:0 "Камни, украшенные затейливой священной резьбой, — святые памятники, отмечающие места поклонения, хранящие память об умерших и прославляющие божественное провидение."
 tenet_khachkar_default_name:0 "Хачкары"
 tenet_love_thy_neighbour_default_desc:0 "Любовь к ближнему неотделима от любви к Божеству. Делами милосердия и благотворительности мы исполняем всю полноту божественного закона."
 tenet_love_thy_neighbour_default_name:0 "Возлюби ближнего своего"
 tenet_love_thy_neighbour_modifier_desc:0 ""
 tenet_miaphysitism_default_desc:0 ""
 tenet_miaphysitism_default_name:0 "Миафизитство"
 tenet_miles_christi_default_desc:0 "Верующие призваны быть воинами духа: облачившись в божественные доспехи, сражаться с грехом и злом и быть готовыми страдать за веру, как солдаты страдают ради своего полководца."
 tenet_miles_christi_default_name:0 "Воины Христовы"
 tenet_monophysitism_default_desc:0 "Когда божественное начало облеклось плотью, эта плоть растворилась в нём, словно капля воды в море. Природа его едина и всецело божественна."
 tenet_monophysitism_default_name:0 "Монофизитство"
 tenet_mortification_of_the_flesh_default_desc:0 "Мы умерщвляем плоть и её греховные желания, ибо страдания очищают душу и приближают её к духовному совершенству."
 tenet_ora_et_labora_default_desc:0 "Молиться — значит трудиться, а трудиться — значит молиться. Праздность — враг души, и потому мы должны усердствовать и в помыслах, и в делах."
 tenet_original_sin_default_desc:0 "Всё человечество несёт на себе печать древнего прегрешения, искупить которое можно лишь божественной благодатью."
 tenet_original_sin_default_name:0 "Первородный грех"
 tenet_peace_of_god_default_desc:0 "Бессмысленная жестокость по отношению к нашим братьям и сёстрам считается оскорблением Самого Бога."
 tenet_peace_of_god_default_name:0 "Мир Божий"
 tenet_philanthropia_default_desc:0 "Вера рассматривает щедрые подаяния, заботу о бедных и церковную благотворительность как основной христианский долг, следуя Отцам Церкви и примеру ранних приютов и больниц."
 tenet_philanthropia_default_name:0 "Милостыня"
 tenet_purgatory_default_desc:0 "Верующие, умирающие под тяжестью грехов, проходят последнее очищение, после которого в них остаётся лишь благочестие, необходимое, чтобы предстать перед Божеством."
 tenet_purgatory_default_name:0 "Чистилище"
 tenet_scholasticism_default_desc:0 "Благодаря строгому исследованию и диалектическому методу вера и разум могут обрести согласие, открыв нам более глубокое понимание божественной истины."
 tenet_scholasticism_modifier_desc:0 "Стремление к познанию есть одно из проявлений поклонения Всевышнему, ибо, постигая творение, мы приближаемся к пониманию Творца."
 tenet_simony_default_desc:0 ""
 tenet_transubstantiation_default_desc:0 "То, что возлагают на наши алтари, не остаётся прежним. После освящения его сущность преображается в святыню, хотя внешний облик остаётся неизменным."
