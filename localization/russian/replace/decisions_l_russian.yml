  ### MPO DLC ###
 mpo_divination_decision: "Обратиться к небесам"
 mpo_divination_decision_tooltip: "Осмелиться заглянуть в будущее"
 mpo_divination_decision_desc: "Спросить у верховного божества по имени [ROOT.Char.GetFaith.HighGodName] о том, что для вас важнее всего — любовь, война или сама жизнь."
 mpo_divination_decision_confirm: "Бросить игральную кость."
 mpo_divination_decision_tt: "Вы можете получить свойство [GetModifier( 'mpo_divination_love_modifier' ).GetNameWithTooltip], [GetModifier( 'mpo_divination_war_modifier' ).GetNameWithTooltip] или [GetModifier( 'mpo_divination_life_modifier' ).GetNameWithTooltip] на #high 5#! лет."
 mpo_divination_decision_tt_spiritual: "Вы можете получить свойство [GetModifier( 'mpo_divination_love_spiritual_modifier' ).GetNameWithTooltip], [GetModifier( 'mpo_divination_war_spiritual_modifier' ).GetNameWithTooltip] или [GetModifier( 'mpo_divination_life_spiritual_modifier' ).GetNameWithTooltip] на #high 5#! лет."
 court_astrologer_events.0001.t: "$mpo_divination_decision$"
 court_astrologer_events.0001.desc: "Я слежу глазами за персонажем [astrologer.GetFirstName], пока [Select_CString(astrologer.IsFemale, 'она кладет', 'он кладет' )] на землю два тростника на некотором расстоянии друг от друга. Губы астролога едва шевелятся, пока [Select_CString(astrologer.IsFemale, 'она шепчет', 'он шепчет' )] заклинания, наблюдая за тем, как тростинки тянутся друг к другу, подгоняемые ветром.\n\nОдна из них побеждает другую — ведь ноша, которую она несет, куда тяжелее ее тела. Небеса изрекли свою волю."
 court_astrologer_events.0001.a: "Поведай мне о любви."
 court_astrologer_events.0001.a.success: "Вы будете окружены любовью"
 court_astrologer_events.0001.a.success.tt: "Вы изо всех сил стараетесь не пустить слезу"
 court_astrologer_events.0001.a.failure: "Небеса хранят молчание"
 court_astrologer_events.0001.b: "Поведай мне о войне."
 court_astrologer_events.0001.b.success: "Вы добудете победу в каждой битве"
 court_astrologer_events.0001.c: "Поведай мне о жизни."
 court_astrologer_events.0001.c.success: "Ваша жизнь будет процветать"
 court_astrologer_events.0001.d: "Сейчас неподходящее время."
 mpo_divination_love_modifier: "Любимец небес"
 mpo_divination_love_modifier_desc: "Небеса предрекли этому персонажу теплую любовь."
 mpo_divination_war_modifier: "Воин небес"
 mpo_divination_war_modifier_desc: "Небеса предрекли этому персонажу победоносные сражения."
 mpo_divination_life_modifier: "Благословенный небесами"
 mpo_divination_life_modifier_desc: "Небеса предрекли этому персонажу долгую жизнь."