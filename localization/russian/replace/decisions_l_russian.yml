l_russian:
 convert_to_feudalism_decision:0 "Принятие аристократии"
 convert_to_feudalism_decision_desc:0 "Мои владения растут, а вместе с ними растут и трудности управления. Если [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] продолжит расширяться, мы должны оставить старые обычаи в прошлом и стать аристократией."

 promote_gothic_innovations_decision:0 "Вдохновить портимперское возрождение"
 promote_gothic_innovations_decision_desc:0 "Нас ждет новая эпоха искусства и открытий, которая вырвет [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] из этих темных времен и превратит нашу родину в бьющееся сердце континентальной культуры."

 assimilate_local_traditions_decision_desc:0 "Хотя дух приключений навсегда останется в нашей крови, мы признаем, что находимся далеко от своего далекого катраддийского дома. Местные традиции отлично подходят здешнему народу — они хозяева своей земли, а их боги сильны, и мы уважаем это. Со временем мы станем такими же, как они."
 assimilate_local_traditions_decision_tooltip:0 "Вы и все ваши [vassals|El] той же [culture|El] перейдете в культуру и [faith|El] вашей [capital|El] столицы"

 diligent_development_focus_decision_desc:0 "Я мечтаю, что [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] однажды станет предметом зависти каждого правителя под этим небом. Я должен постараться стать тем триумфатором, который превратит этот город в жемчужину Эраса. Все, что от меня требуется — это приложить еще немного усилий...\n\nДа и кому вообще нужен этот сон?"

