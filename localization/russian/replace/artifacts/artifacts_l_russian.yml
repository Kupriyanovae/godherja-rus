 morin_khuur_ornament_name:0 "Маска-орнамент для морин хуура"
 morin_khuur_ornament_description:1 "Изящная фигурка в виде маски, вырезанная из лошадиной кости. Обычно служит украшением для верхней части смычкового инструмента морин хуур. Отправлено персонажу [owner.GetTitledFirstNameNoTooltip] персонажем [inspiration_owner.GetTitledFirstNameNoTooltip] во время [inspiration_owner.GetHerHis] странствий."
 pilgrimage_figurine_name:0 "Фигурка Святого пути Иллиока из кости каракатицы"
 pilgrimage_figurine_description:1 "Фигурка Иллиока ва Ойейникана, полководца Шевалье, сыгравшего решающую роль в разгроме [arch_lich|E] Адваги Адвакампи. Его шлем покрыт тонкими бронзовыми деталями. Отправлено персонажу [owner.GetTitledFirstNameNoTooltip] персонажем [inspiration_owner.GetTitledFirstNameNoTooltip] во время [inspiration_owner.GetHerHis] странствий."
 saint_margaret_fingernails_name:0 "Ногти святой Тейссии"
 saint_margaret_fingernails_description:1 "Агионистская святая Тейссия прославилась тем, что исцелила от чумы тысячи людей вопреки глупым теориям о распространении болезней — вроде существования крошечных невидимых демонов, которые прилипают к коже и которых можно одолеть лишь мытьем рук (что смывает защитный слой кожи, на который полагаются хирурги). Предположительно, эти старые отвратительные обрезки ногтей принадлежали ей. Отправлено персонажу [owner.GetTitledFirstNameNoTooltip] персонажем [inspiration_owner.GetTitledFirstNameNoTooltip] во время [inspiration_owner.GetHerHis] странствий."
 feature_decoration_pattern_culture_symbol:0 "символы, связанные с [SelectLocalization(Artifact.MakeScope.Var('override_culture').IsSet, Artifact.MakeScope.Var('override_culture').Culture.GetCollectiveNounNoTooltip, SelectLocalization(Artifact.MakeScope.Var('writing_culture').IsSet, Artifact.MakeScope.Var('writing_culture').Culture.GetCollectiveNounNoTooltip, Artifact.GetOwner.GetCulture.GetCollectiveNounNoTooltip))|l]ой культурой"
