l_russian:
 tradition_mountaineer_ruralism_name: "Сельская жизнь на утёсах"
 tradition_mountaineer_ruralism_desc: "Представители этой культуры — потомки первых малькойских переселенцев, обосновавшихся на скалистых утёсах там, где Эрамасик пересекает границу Картараддии и Малькои. Они одинаково уверенно чувствуют себя и на каменных кручах, и в речных ущельях."

 tradition_female_only_inheritance_requirements: "Вы должны исповедовать [GetFaithDoctrine('doctrine_gender_female_dominated').GetBaseName] [Concept('faith','кофессию')|E] или принадлежать к #V $heritage_agadari_name$#!, #V $heritage_sarminian_name$#!, #V $heritage_lonely_lighter_name$#! или #V $heritage_canian_name$#! [Concept('heritage','наследию')|E], а также не иметь существующей матриархальной [Concept('culture_tradition','традиции')|E]"
 tradition_hereditary_hierarchy_desc:0 "В этой культуре глубоко укоренилось убеждение, что власть наследуется по крови, благородство рода опирается на стены родовых замков, а власть аристократии незыблема. Здесь не скоро забудут тех, кто нарушил законы сословия."
 tradition_desert_nomads_name:1 "Кочевники саррадонской пустыни"
 tradition_desert_nomads_desc:0 "Эта культура тесно связана с пустынями Саррадона, которые её представители пересекают веками, соединяя море Империй с землями центрального и южного Саррадона."
 culture_in_camel_region_desc:0 "[Concept('culture','Культура')|E] не представлена в регионе [GetGeographicalRegion('world_es_desert').GetName]"
 culture_in_camel_region_percentage_desc:0 "[Concept('culture','Культура')|E] не контролирует #V [EmptyScope.ScriptValue('camel_percentage_trigger_value_desc')|0]%#! своих [Concept('counties','графств')|E] в регионе [GetGeographicalRegion('world_es_desert').GetName]"
 tradition_pollaers_name:0 "Поллаэры"
 tradition_pollaers_desc:0 "Эта культура издавна отвоёвывает землю у окружающего моря. Благодаря этому мелководное морское дно можно использовать для земледелия и строительства."
 culture_in_non_sedentary_geographical_region_trigger_desc:0 "[Concept('culture','Культура')|E] не представлена в регионе [GetGeographicalRegion('GH_REPLACE_world_steppe').GetName]"
 culture_in_india_region_trigger_desc:0 "[Concept('culture','Культура')|E] не представлена в регионе [GetGeographicalRegion('GH_REPLACE_world_india').GetName]"
 culture_in_roman_empire_desc:0 ""
 culture_in_plains_or_steppe_terrain_desc:0 "У этой [Concept('culture','культуры')|E] менее #V 40%#! [Concept('counties','графств')|E] расположено на равнинной [Concept('terrain','местности')|E], степной [Concept('terrain','местности')|E] или в [Concept('region','регионе')|E] [GetGeographicalRegion('GH_REPLACE_world_steppe').GetName]"
 culture_in_plains_or_steppe_terrain_percentage_desc:0 "У этой [Concept('culture','культуры')|E] менее #V 60%#! [Concept('counties','графств')|E] расположено на равнинной [Concept('terrain','местности')|E], степной [Concept('terrain','местности')|E] или в [Concept('region','регионе')|E] [GetGeographicalRegion('GH_REPLACE_world_steppe').GetName]"
 culture_in_steppe_desc:1 "Не менее #V 40%#! [Concept('counties','графств')|E] этой [Concept('culture','культуры')|E] должно находиться в [GetGeographicalRegion('GH_REPLACE_world_steppe').GetName] [Concept('region','регионе')|E]"
 sahara_percentage_desc:0 "[Concept('culture','Культура')|E] не имеет #V 30%#! своих [Concept('counties','графств')|E] в [GetGeographicalRegion('GH_REPLACE_world_africa_sahara').GetName]"
 three_witch_rulers_desc:0 "В [Concept('culture','культуре')|E] нет #V 3#! или более [Concept('rulers','правителей')|E]-[Concept('magi','магов')|E]"
 steppe_heritage_reduction_desc:0 "[Concept('culture','Культура')|E] не имеет степного [Concept('heritage','наследия')|E]"
 culture_in_himalaya_desc:0 ""
 culture_parameter_unlock_garuda_warrior_title:0 "Может назначать [Concept('knights','рыцарей')|E] на [Concept('court_position','должность')|E] (Воин Дхагерай), увеличивая их [Concept('prowess','мощь')|E] и вероятность гибели в бою." #GH ADDITION: Adapted this for the Parakh

 # GH: retheme the vanilla Barangay tradition onto the Rovarska and strip the real-world reference.
 tradition_tgp_barangay_confederations_name: "Роварские конфедерации"
 tradition_tgp_barangay_confederations_desc: "Правители этой культуры возглавляют множество разрозненных городов-государств у речных устьев и на побережье. Такие государства сильно различаются по размеру, но обычно объединяются в конфедерации под началом верховного вождя, избранного из числа вождей-участников."
 DATU_GLOSS: "Титул вождей множества малых государств, рассеянных по Роварске."
 tradition_male_only_inheritance_requirements:0 "Ваша [faith|E] должна иметь доктрину «[GetDoctrine('doctrine_gender_male_dominated').GetBaseName]», либо у вашей культуры не должно быть патриархальных [Concept('culture_tradition','традиций')|E]"
