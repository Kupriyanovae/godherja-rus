 trait_bubonic_plague_desc:0 "Тело этого персонажа прорезано пульсирующими багровыми венами, а из глаз обильно течет кровь; пребывать на этом свете ему осталось недолго."
 trait_bubonic_plague_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] страдает от пульсирующих багровых вен, а из глаз [Select_CString(ROOT.GetCharacter.IsFemale, 'её', 'его' )] обильно течет кровь; [Select_CString(ROOT.GetCharacter.IsFemale, 'она', 'он' )]  не долго задержится на этом свете."

