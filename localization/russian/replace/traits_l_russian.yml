 # TGP
 trait_track_confucian_education: "Humanism"
 trait_track_confucian_education_desc: "С помощью воздержанности и доброжелательности мы вместе строим лучшее общество.\n\n#weak Это [Concept('trait', 'свойство')|E] можно улучшать с помощью [Concept('character_interaction', 'взаимодействия')|E] «#V $request_mentoring_interaction$»#!, [Concept('court_position_tasks', 'поручений')|E] #V верховному наставнику#! или [Concept('court_positions', 'должностей')|E] #V придворного наставника#!"
 trait_confucian_education_character_desc: "Этот персонаж только начал идти по пути к здравомыслию."
 trait_confucian_education: "Humanist Education"
 trait_confucian_education_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] только [Select_CString(ROOT.GetCharacter.IsFemale, 'начала', 'начал')] идти по пути к здравомыслию."
 trait_confucian_education_1: "Genuine Humanist"
 trait_confucian_education_1_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has glimpsed the vast wisdom of the Humanist Ways."
 trait_confucian_education_2: "Прилежный классицист"
 trait_confucian_education_2_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] в меру применяет учение Конфуция в своей повседневной жизни."
 trait_confucian_education_3: "Добродетельный этик"
 trait_confucian_education_3_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] is getting a grasp of what it means to be a virtuous Humanistist."
 trait_confucian_education_4: "Нравственный идеал"
 trait_confucian_education_4_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] может считаться настоящим воплощением пути."
 trait_confucian_education_5: "Безупречный мудрец"
 trait_confucian_education_5_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a virtual saint in Humanist circles. Other Humanistists far and wide have heard of [ROOT.GetCharacter.GetHerHis] moral and ethical prowess."