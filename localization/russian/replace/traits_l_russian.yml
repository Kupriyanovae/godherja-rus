 trait_gh_otachedian_governor_5_governor_3_character_desc: "Воплощение закона, возрождённый [Concept('otachedian_empire', 'Отачед')|E] — [Glossary('риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] являет собой правосудие во плоти и одним присутствием изгоняет тьму коррупции."
 trait_gh_otachedian_governor_4_governor_3_character_desc: "Слова и законы персонажа [Glossary('риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] столь же непреложны, сколь безупречны."
 trait_gh_otachedian_governor_3_governor_3_character_desc: "[Glossary('Риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] — испытанный знаток управления и государственного устройства, славящийся проницательностью и острым умом."
 trait_gh_otachedian_governor_2_governor_3_character_desc: "Одни хвалят персонажа [Glossary('риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] за богатый опыт управления, другие вполголоса порицают за нечестные методы."
 trait_gh_otachedian_governor_1_governor_3_character_desc: "Несомненно, великий [Concept('otachedian_empire', 'Отачед')|E] желал, чтобы [Glossary('риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'пользовалась', 'пользовался')] своей огромной властью почти исключительно ради личной выгоды. #EMP Несомненно#!."
 trait_gh_otachedian_governor_5_governor_2_character_desc: "[Glossary('Риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] — восходящая звезда праведности, чьё имя непременно войдёт в летописи [Concept('kashirya', 'Каширии')|E]."
 trait_gh_otachedian_governor_4_governor_2_character_desc: "[Glossary('Риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] пользуется уважением — и даже внушает страх бесчестным — за неустанное правосудие над подданными."
 trait_gh_otachedian_governor_3_governor_2_character_desc: "Среди [Glossary('риширани', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] выделяется богатым опытом и #EMP гибкостью#!."
 trait_gh_otachedian_governor_2_governor_2_character_desc: "[Glossary('Риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] обладает богатым опытом управления, хотя подданные втайне надеются, что методы правления однажды изменятся к лучшему."
 trait_gh_otachedian_governor_1_governor_2_character_desc: "[Glossary('Риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] — знаток слияний и принудительных поглощений, сколь бы неприятны они ни были окружающим."
 trait_gh_otachedian_governor_5_governor_1_character_desc: "[Glossary('Риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] преследует справедливость с рвением и решимостью — и чаще всего настигает её."
 trait_gh_otachedian_governor_4_governor_1_character_desc: "Соблюдать закон, защищать слабых — [Glossary('риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'широко известна', 'широко известен')] верностью этим принципам."
 trait_gh_otachedian_governor_3_governor_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'приобрела', 'приобрёл')] ценные навыки на службе в качестве [Glossary('риширан', 'GH_RISHIRAN_GLOSS')]."
 trait_gh_otachedian_governor_2_governor_1_character_desc: "Слова персонажа [Glossary('риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] — закон, к лучшему или к худшему."
 trait_gh_otachedian_governor_1_governor_1_character_desc: "Никто не объяснил персонажу [Glossary('риширан', 'GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip], что коррупция — не состязание."
 trait_track_otachedian_governor: "$trait_gh_otachedian_governor_base$: добропорядочность"
 trait_track_otachedian_governor_desc: "От [Glossary('риширани', 'GH_RISHIRAN_GLOSS')] ожидают равного мастерства в управлении и правосудии, а также заботы о стабильности всей Каширии, а не только собственных владений."
 trait_governor_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — выдающийся управленец и судья, идеально подходящий на должность [ROOT.GetCharacter.Custom('GetGovernessGovernor')|l]."
 trait_governor_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] обладает богатым опытом управления землями и отлично справляется с обязанностями [ROOT.GetCharacter.Custom('GetGovernessGovernor')|l]."
 trait_governor_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'приобрела', 'приобрёл')] ценные навыки на службе в качестве [ROOT.GetCharacter.Custom('GetGovernessGovernor')|l]."

 trait_gh_minister_base: "Министр"
 trait_gh_minister_3: "$trait_governor_3_prefix$$trait_gh_minister_base$"
 trait_gh_minister_2: "$trait_governor_2_prefix$$trait_gh_minister_base$"
 trait_gh_minister_1: "$trait_governor_1_prefix$$trait_gh_minister_base$"
 trait_gh_minister_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — выдающийся управленец и судья, идеально подходящий на должность министра."
 trait_gh_minister_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] обладает богатым опытом управления землями и отлично справляется с обязанностями министра."
 trait_gh_minister_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'приобрела', 'приобрёл')] ценные навыки на службе в качестве министра."
 # TGP
 trait_track_confucian_education: "Гуманизм"
 trait_track_confucian_education_desc: "С помощью воздержанности и доброжелательности мы вместе строим лучшее общество.\n\n#weak Это [Concept('trait', 'свойство')|E] можно улучшать с помощью [Concept('character_interaction', 'взаимодействия')|E] «#V $request_mentoring_interaction$»#!, [Concept('court_position_tasks', 'поручений')|E] #V верховному наставнику#! или [Concept('court_positions', 'должностей')|E] #V придворного наставника#!"
 trait_confucian_education_character_desc: "Этот персонаж только начал идти по пути к здравомыслию."
 trait_confucian_education: "Гуманистическое образование"
 trait_confucian_education_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] только [Select_CString(ROOT.GetCharacter.IsFemale, 'начала', 'начал')] идти по пути к здравомыслию."
 trait_confucian_education_1: "Истинный гуманист"
 trait_confucian_education_1_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] [Select_CString(ROOT.GetCharacter.IsFemale, 'приобщилась', 'приобщился')] к великой мудрости гуманистического пути."
 trait_confucian_education_2: "Прилежный классицист"
 trait_confucian_education_2_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] в меру применяет учение Конфуция в своей повседневной жизни."
 trait_confucian_education_3: "Добродетельный этик"
 trait_confucian_education_3_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] начинает понимать, что значит быть добродетельным гуманистом."
 trait_confucian_education_4: "Нравственный идеал"
 trait_confucian_education_4_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] может считаться настоящим воплощением пути."
 trait_confucian_education_5: "Безупречный мудрец"
 trait_confucian_education_5_desc: "В кругах гуманистов [ROOT.GetCharacter.GetFirstNameNoTooltip] считается почти [Select_CString(ROOT.GetCharacter.IsFemale, 'святой', 'святым')]. Гуманисты далёких земель наслышаны о нравственных и этических достоинствах этого персонажа."