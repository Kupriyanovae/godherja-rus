l_russian:
 trait_greatest_of_khans:0 "Хаагер-Хатан"
 trait_greatest_of_khans_desc:0 "Этот персонаж был провозглашен Бог-Императором, правителем всего сущего, чья воля формирует небеса, а владениям нет конца."
 trait_greatest_of_khans_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] — Бог-Император, правитель всего сущего, чья воля формирует небеса, а владениям нет конца."
 
 trait_august:0 "Величественный"
 trait_bubonic_plague:0 "[bloodblight|E]"
 trait_bubonic_plague_desc:0 "Тело этого персонажа прорезано пульсирующими багровыми венами, а из глаз обильно течет кровь; пребывать на этом свете ему осталось недолго."
 trait_bubonic_plague_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] страдает от пульсирующих багровых вен, а из глаз [Select_CString(ROOT.GetCharacter.IsFemale, 'её', 'его' )] обильно течет кровь; [Select_CString(ROOT.GetCharacter.IsFemale, 'она', 'он' )]  не долго задержится на этом свете."

 trait_hashishiyah:0 "Чортозон"
 trait_hashishiyah_desc:0 "Этот персонаж облегчает тяготы повседневной жизни потреблением чорта."
 trait_hashishiyah_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] облегчает тяготы повседневной жизни потреблением чорта."

