 trait_gh_otachedian_governor_5_governor_3_character_desc: "A paragon of law; [Concept('otachedian_empire','Otached')|E] reborn — [Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] is justice made flesh, banishing the darkness of corruption with [ROOT.GetCharacter.GetHerHis] mere presence."
 trait_gh_otachedian_governor_4_governor_3_character_desc: "The words and laws of [Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] are as binding as they are irreproachable."
 trait_gh_otachedian_governor_3_governor_3_character_desc: "[Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] is a tried and tested expert on administration and governance, well-known for [ROOT.GetCharacter.GetHerHis] discerning eye and shrewd acumen."
 trait_gh_otachedian_governor_2_governor_3_character_desc: "Some praise [Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] for the wealth of governing experience; others condemn [ROOT.GetCharacter.GetHerHis] underhanded nature in muted whispers."
 trait_gh_otachedian_governor_1_governor_3_character_desc: "Surely, the great [Concept('otachedian_empire','Otached')|E] intended for [Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] to use [ROOT.GetCharacter.GetHerHis] great powers almost exclusively for personal gain. #EMP Surely#!."
 trait_gh_otachedian_governor_5_governor_2_character_desc: "[Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] is a rising star of righteousness, sure to carve [ROOT.GetCharacter.GetHerHis] name into the annals of [Concept('kashirya','Kashiryan')|E] history."
 trait_gh_otachedian_governor_4_governor_2_character_desc: "[Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] is respected — perhaps even feared (by the unscrupulous sort) — as [ROOT.GetCharacter.GetSheHe] routinely dispenses justice to [ROOT.GetCharacter.GetHerHis] subjects."
 trait_gh_otachedian_governor_3_governor_2_character_desc: "As far as [Glossary('Rishirani','GH_RISHIRAN_GLOSS')] go, [ROOT.GetCharacter.GetFirstNameNoTooltip] is as experienced as [ROOT.GetCharacter.GetSheHe] is #EMP flexible#!."
 trait_gh_otachedian_governor_2_governor_2_character_desc: "[Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] has plenty of experience in administration and governance — even if [ROOT.GetCharacter.GetHerHis] subjects silently wish that [ROOT.GetCharacter.GetSheHe] would mend [ROOT.GetCharacter.GetHerHis] ways."
 trait_gh_otachedian_governor_1_governor_2_character_desc: "[Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] is an expert on mergers and (forceful) acquisitions, however distasteful it might be to others."
 trait_gh_otachedian_governor_5_governor_1_character_desc: "[Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] pursues justice with vigor and determination — and, more often than not, catches it."
 trait_gh_otachedian_governor_4_governor_1_character_desc: "Uphold the law, protect the weak — [Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] is well-known for [ROOT.GetCharacter.GetHerHis] adherence to these principles."
 trait_gh_otachedian_governor_3_governor_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has gained valuable skills in [ROOT.GetCharacter.GetHerHis] role as a [Glossary('Rishiran','GH_RISHIRAN_GLOSS')]."
 trait_gh_otachedian_governor_2_governor_1_character_desc: "The words of [Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] are law, for better or worse."
 trait_gh_otachedian_governor_1_governor_1_character_desc: "No one ever told [Glossary('Rishiran','GH_RISHIRAN_GLOSS')] [ROOT.GetCharacter.GetFirstNameNoTooltip] that corruption is not a competition."
 trait_track_otachedian_governor: "$trait_gh_otachedian_governor_base$ Integrity"
 trait_track_otachedian_governor_desc: "[Glossary('Rishiran','GH_RISHIRAN_GLOSS')] are expected to be equal parts administrator and adjudicator, pursuing the stability of all Kashirya, not just their estates."
 trait_governor_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] is an exceptional administrator and adjudicator, making [ROOT.GetCharacter.GetHerHim] a perfect fit as a [ROOT.GetCharacter.Custom('GetGovernessGovernor')|l]."
 trait_governor_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has plenty of experience administrating lands, and performs well as a [ROOT.GetCharacter.Custom('GetGovernessGovernor')|l]."
 trait_governor_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] has gained valuable skills in [ROOT.GetCharacter.GetHerHis] role as a [ROOT.GetCharacter.Custom('GetGovernessGovernor')|l]."

