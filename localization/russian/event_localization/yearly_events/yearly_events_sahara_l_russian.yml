l_russian:
 #[Faith] Traders in [County]
 # GH NOTE: Copied to update vanilla references and terms
 yearly_saharan.0001.t:0 "[source_county.GetProvince.GetCounty.GetFaith.GetAdherentNameNoTooltip] торговцы в [target_county.GetNameNoTierNoTooltip]"
 yearly_saharan.0001.desc:0 "Транссаррадонская торговля всегда проходила через эти земли, принося богатство, идеи и идеологии. Обычно такому правителю, как я, достаточно просто забирать свою справедливую долю, а в остальном пути работают сами по себе.\n\nОднако в последнее время через [target_county.GetNameNoTier] проходит всё больше и больше купцов веры [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNameNoTooltip], принося с собой свои верования и монеты.\n\nОдин консорциум просит у меня разрешения поселиться и приобрести недвижимость, и ради снискания моей благосклонности они собрали солидный дар."
 yearly_saharan.0001.a:0 "Я с благодарностью принимаю это подношение."
 yearly_saharan.0001.a.tt:0 "#WEAK Это может повлиять на местных жителей в будущем...#!"
 yearly_saharan.0001.b:0 "Вы можете продолжать проходить насквозь, но не более того."
 yearly_saharan.0001.c:0 "[source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] изгоняются из [target_county.GetNameNoTierNoTooltip], а их товары #EMP конфискуются#!!"
 yearly_saharan.0001.c.list:0 "Все [Concept('counties','графства')|E] одной [Concept('realm','державы')|E], граничащие с [target_county.GetNameNoTierNoTooltip]"
 
 yearly_saharan.0003.t:0 "$yearly_saharan.0001.t$: Интеграция"
 yearly_saharan.0003.desc_initial:0 "Торговцы веры [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNameNoTooltip], которым я [Select_CString(ROOT.Char.IsFemale, 'разрешила', 'разрешил' )] поселиться в [target_county.GetNameNoTier], живут там уже несколько лет,"
 yearly_saharan.0003.desc_current:0 "Уже несколько лет [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] из [source_county.GetNameNoTier] живут в [target_county.GetNameNoTier],"
 yearly_saharan.0003.desc:0 "и, похоже, они довольно хорошо интегрировались в существующее сообщество.\n\nВ результате торговля в этом регионе процветает, доходы находятся на рекордно высоком уровне, и даже крестьяне привыкли к звуку звенящего золота!"
 yearly_saharan.0003.a:0 "Прекрасная прибыль!"
 yearly_saharan.0003.b:0 "Обложить их непомерными налогами."
 
 yearly_saharan.0004.t:0 "$yearly_saharan.0001.t$: Коммерческий бум"
 yearly_saharan.0004.desc_initial:0 "$yearly_saharan.0003.desc_initial$"
 yearly_saharan.0004.desc_current:0 "$yearly_saharan.0003.desc_current$"
 yearly_saharan.0004.desc:0 "и торговля, а равно и динамизм, которые они принесли в этот регион, кажутся безграничными!\n\nЛюди стекаются на рынки: телеги, нагруженные золотом, тянутся на север, повозки с солью наводняют юг, и все платят налоги при въезде и выезде! Воистину, это процветающий уголок державы!"
 yearly_saharan.0004.a.tt:0 "Вы пытаетесь улучшить свой уровень [Concept( 'stewardship', 'управления' )|E]"
 yearly_saharan.0004.a:0 "Думается мне, я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] бы перенять пару приёмов у этих купцов!"
 yearly_saharan.0004.a.tt.outcome_1:0 "Уровень управления повышен"
 yearly_saharan.0004.a.tt.outcome_2:0 "$yearly_saharan.0004.a.tt.outcome_1$"
 yearly_saharan.0004.a.tt.outcome_3:0 "$yearly_saharan.0004.a.tt.outcome_1$"
 yearly_saharan.0004.b:0 "Мне не послышалось, или налоговая ставка ползёт вверх?"
 yearly_saharan.0004.c:0 "Разумеется, нам придётся взыскать кое-какие недоимки..."
 
 yearly_saharan.0005.t:0 "$yearly_saharan.0001.t$: Смена веры"
 yearly_saharan.0005.desc_initial:0 "$yearly_saharan.0003.desc_initial$"
 yearly_saharan.0005.desc_current:0 "$yearly_saharan.0003.desc_current$"
 yearly_saharan.0005.desc:0 "и их вера прочно укоренилась в сердцах местных жителей. Настолько, что теперь гораздо больше людей поклоняются [target_county.GetProvince.GetCounty.GetFaith.HighGodName], чем молятся [target_county_old_faith.HighGodName]!\n\nОбращение прошло мирно, и люди кажутся послушными и довольными своими новыми убеждениями, однако старые обычаи уже практически исчезли."
 yearly_saharan.0005.a:0 "Добро пожаловать в свет, что изливает [ROOT.GetCharacter.GetFaith.HighGodName]!"
 yearly_saharan.0005.b:0 "Хм. По крайней мере, они этим довольны."
 yearly_saharan.0005.c:0 "Только не пока я здесь [ROOT.GetCharacter.GetTitleAsNameNoTooltip]!"

 #[Culture] Nomads Flock to [County]
 yearly_saharan.0021.t:0 "[nomad_leader.GetCulture.GetNameNoTooltip] кочевники стекаются в [target_county.GetNameNoTierNoTooltip]"
 yearly_saharan.0021.desc:0 "Хоть я и [Select_CString(ROOT.Char.IsFemale, 'благородная', 'благородный' )] [ROOT.GetCharacter.GetTitleAsNameNoTooltip], существуют места, слишком отдалённые даже для того, чтобы моё имя имело там какой-то вес. Места, которыми я никогда не смогу по-настоящему править.\n\nВыходя из таких мест в глубинах [Glossary('Саррадонской пустыни','sarradonian_desert_encyclopedia_desc')], кочевые племена, которые представляют [nomad_leader.GetCulture.GetCollectiveNounNoTooltip], в последнее время продвигаются в [target_county.GetNameNoTier], без особых усилий занимая пустоты и территории, покидаемые местными поселенцами культуры [target_county.GetProvince.GetCounty.GetCulture.GetNameNoTooltip].\n\nОдин из их лидеров даже пришёл ко мне с просьбой разрешить [Select_CString(nomad_leader.IsFemale, 'ей', 'ему' )] привести свою обширную конфедерацию, дабы удерживать этот регион от моего имени."
 yearly_saharan.0021.a:0 "Я даже позволю тебе управлять им!"
 yearly_saharan.0021.b:0 "[nomad_leader.GetCulture.GetNameNoTooltip] всегда желанные гости в моей державе."
 yearly_saharan.0021.c:0 "Возможно, вместо этого ты присоединишься ко мне в качестве слуги?"
 yearly_saharan.0021.d:0 "Вздор! Убирайтесь прочь!"

 #Slave Raid against [Realm] Escalates
 yearly_saharan.0031.t:0 "Набеги работорговцев на [affected_sub_realm.GetNameNoTierNoTooltip] обостряются"
 yearly_saharan.0031.desc:0 "Набеги за рабами и сопутствующая им торговля людьми зачастую являются жестокой прозой жизни для тех, кто находится в [Glossary('Кемсаре','kemsar_encyclopedia_desc')] или рядом с ним. Деньги, которые приносят такие набеги, могут быть слишком заманчивыми, чтобы от них отказываться, и многие поселения время от времени совершают набеги друг на друга.\n\nОднако в последнее время работорговцы из [slave_raider_county.GetNameNoTier] яростно атакуют близлежащие земли [raided_county.GetNameNoTier], и несколько видных купцов планируют крупное нападение, против которого выступает [raided_character_marshal.GetCouncilTitle] [raided_character_marshal.GetFirstName]."
 yearly_saharan.0031.a:0 "Как выгодно! Отправить солдат присоединиться к ним!!"
 yearly_saharan.0031.a.tt_success:0 "[raided_county.GetNameNoTierNoTooltip] подвергается сильному разграблению ради захвата рабов"
 yearly_saharan.0031.a.tt_fail:0 "[raided_character_marshal.GetTitledFirstNameNoTooltip] отбрасывает работорговцев"
 yearly_saharan.0031.b:0 "Остановите это варварство!"
 yearly_saharan.0031.c:0 "Это меня совершенно не касается."
 yearly_saharan.0031.c.raided_hurt:0 "[raided_county.GetNameNoTierNoTooltip] разграблен"
 yearly_saharan.0031.c.raiders_hurt:0 "Многие [slave_raider_county.GetAdjectiveNoTooltip] налётчики ранены"

 #Marauding Slavers from [Realm]
 yearly_saharan.0032.t:0 "Мародёрствующие работорговцы из [hostile_sub_realm.GetNameNoTierNoTooltip]"
 yearly_saharan.0032.desc:0 "Работорговцы из [Glossary('Кемсаре','kemsar_encyclopedia_desc')] — это, к сожалению, угроза, с которой сталкиваются многие жители этой земли. Соблазн богатства, вымениваемого за отправку своих собратьев на другой конец [Concept('aeras','Эраса')|E], для некоторых оказывается просто слишком силён.\n\nОбычно такие набеги носят разрозненный и беспорядочный характер, но работорговцы из [slave_raider_county.GetNameNoTier] начали совершать согласованные атаки на [raided_county.GetNameNoTier]. Мародёры заковывают в кандалы целые деревни, а ведут их за собой воины, которыми командует [slave_raider_county.GetHolder.GetTitledFirstName] [Select_CString(slave_raider_county.GetHolder.IsFemale, 'сама', 'сам' )]!"
 yearly_saharan.0032.a:0 "К оружию против этих подонков!"
 yearly_saharan.0032.a.tt_success:0 "Вы побеждаете и грабите работорговцев"
 yearly_saharan.0032.a.tt_fail:0 "Налётчики, которых направил [slave_raider_county.GetHolder.GetFirstNameNoTooltip], разоряют [raided_county.GetNameNoTierNoTooltip]"
 yearly_saharan.0032.b:0 "Знаете, им следовало бы заплатить с этого налог..."
 yearly_saharan.0032.c:0 "Мне плевать."

 #Modifiers
 foreign_trader_enclaves_saharan_modifier:0 "Анклавы иноверческих торговцев"
 foreign_trader_enclaves_saharan_modifier_desc:0 "Иноверческие торговцы обосновались здесь."
 respects_local_traditions_saharan_modifier:0 "Уважение к местным традициям"
 respects_local_traditions_saharan_modifier_desc:0 "Этот персонаж известен тем, что ценит традиции своих предков выше иностранного золота."
 foreign_traders_unable_to_root_saharan_modifier:0 "Временные иноверческие торговцы"
 foreign_traders_unable_to_root_saharan_modifier_desc:0 "Иноверческим торговцам запрещено владеть здесь собственностью или задерживаться надолго."
 local_recession_epicentre_saharan_modifier:0 "Местная рецессия"
 local_recession_epicentre_saharan_modifier_desc:0 "Изгнание иноверческих торговцев подорвало местную экономику."
 local_recession_ripple_saharan_modifier:0 "Эхо местной рецессии"
 local_recession_ripple_saharan_modifier_desc:0 "Ликвидация близлежащего торгового пути нанесла ущерб экономике этого округа."
 integrated_foreign_trader_enclaves_saharan_modifier:0 "Интегрированные иноверческие торговцы"
 integrated_foreign_trader_enclaves_saharan_modifier_desc:0 "Иноверческие торговцы стали неотъемлемой частью местного общества."
 overtaxed_merchant_enclaves_saharan_modifier:0 "Обложенные чрезмерными налогами иноверческие торговцы"
 overtaxed_merchant_enclaves_saharan_modifier_desc:0 "Иноверческие торговцы подвергаются нещадному налогообложению в этом округе, что расстраивает их партнеров."
 ecstatic_converts_saharan_modifier:0 "Восторженные новообращённые"
 ecstatic_converts_saharan_modifier_desc:0 "Ликующие массы этого округа рады своему спасению."
 persecuted_converts_saharan_modifier:0 "Преследуемые новообращённые"
 persecuted_converts_saharan_modifier_desc:0 "Бунтарские массы этого округа замышляют побег от своих суровых господ."
 enthusiastic_nomad_settlement_saharan_modifier:0 "Энтузиазм кочевого поселения"
 enthusiastic_nomad_settlement_saharan_modifier_desc:0 "Пустынные племена массово стекаются в этот округ."
 nomad_settlement_saharan_modifier:0 "Кочевое поселение"
 nomad_settlement_saharan_modifier_desc:0 "Пустынные племена прибывают, чтобы заселить этот округ."
 upset_local_nomads_saharan_modifier:0 "Непокорные кочевники"
 upset_local_nomads_saharan_modifier_desc:0 "Местные пустынные племена совершают набеги на дороги и доставляют серьёзные неприятности."
 lord_defeated_slavers_modifier:0 "Сюзерен победил работорговцев"
 lord_defeated_slavers_modifier_desc:0 "Героический сюзерен этого округа разбил банды мародёрствующих работорговцев!"
 lord_complicit_with_slavers_modifier:0 "Сюзерен в сговоре с работорговцами"
 lord_complicit_with_slavers_modifier_desc:0 "Жадный сюзерен этого округа предал местных жителей, выдав их мародёрствующим работорговцам."
 utterly_unphased_modifier:0 "Абсолютно непоколебимый"
 utterly_unphased_modifier_desc:0 " Какие бы ужасные вещи ни происходили с подданными, этого персонажа ничто не может выбить из колеи."
 