l_russian:

 warhorse.0003.altun_mori:0 "Алтун Мори — златогривый конь из степных преданий!"
 warhorse.0003.kulbarys:0 "Кулбарыс — крылатый зверь, что, по преданию, без устали пересекает равнины!"
 warhorse.0003.joragaltai:0 "Джорагалтай — имя, воспетое в старинных песнях об утрате и скорби."

 warhorse.0003.raucel:0 "Росель — конь, который, по преданию, перенёс Доброго короля через Черные горы!"
 warhorse.0003.syagrin:0 "Сиагрин — упрямый конь из реестров путевого дома, верный лишь Матери пути!"
 warhorse.0003.valcroix:0 "Валькруа — вот подходящее имя."

 warhorse.0003.ashkavar:0 "Ашкавар — непокорный скакун пророка Хинамата!"
 warhorse.0003.hrafnvindr:0 "Храфнвиндр — как говорят, скачет бок о бок с воинами в их смертный час!"

 warhorse.0003.paerashva:0 "Паэрашва — перворождённый конь, сотворённый на заре мироздания!"
 warhorse.0003.sarvaketu:0 "Сарвакету — разумный скакун из преданий Авастья-Махани!"

 warhorse.0003.barq_samt:0 "Барк Самт — имя из великих писаний Улиянма!"
 warhorse.0003.rahzat_al_qamar:0 "Рахзат аль-Камар — вот подходящее имя."

 warhorse.0003.sirr_al_haras:0 "Сирр аль-Харас — конь Первого Вардена!"
 warhorse.0003.mizan_al_samt:0 "Мизан аль-Самт — вот подходящее имя."
 warhorse.0003.thyrax:0 "Тиракс — имя из древних сказаний, достойное могучего коня."
 warhorse.0003.oreades:0 "Ореады — в честь горных духов!"
 
