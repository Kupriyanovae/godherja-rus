 # Decorations for wooden furniture.
 feature_wood_decoration_none:0 "Дерево было отшлифовано до гладкого блеска."
 feature_wood_decoration_varnish:0 "Дерево покрыто лаком, придающим ему насыщенный темный блеск."
 feature_wood_decoration_hsb_inlay:0 "Дерево украшено инкрустацией из [Artifact.GetFeatureText( 'decoration_material_inlay_HSB' )]."
 feature_wood_decoration_painted_pattern:0 "Дерево расписано узорами — [Artifact.GetFeatureText( 'decoration_pattern' )]."

 # Thrones 
 artifact_throne_charlemagne_name:1 "Трон Карла Великого"
 artifact_throne_charlemagne_description:0 "Простой, но внушительный трон, лишенный каких-либо украшений. Он сложен из монолитного мрамора; по слухам, плиты для него были взяты из Храма Гроба Господня в Иерусалиме."
 artifact_throne_solomon_name:1 "Трон Соломона"
 artifact_throne_solomon_description:0 "Претенциозный трон, по слухам, некогда принадлежавший легендарному царю Соломону. Сложенный из слоновой кости с золотой позолотой, он украшен множеством драгоценных камней, а на ведущих к нему ступенях стоят металлические скульптуры различных животных."
 artifact_throne_stone_scone_name:1 "Скунский камень"
 artifact_throne_stone_scone:0 "Простое сиденье из красного песчаника, на котором короновались все монархи Альбы со времен короля Кеннета I."
 artifact_byz_throne_name: "Византийский Трон Соломона"
 artifact_byz_throne_description: "Элегантный престол, восседая на котором византийские правители вершат правосудие с мудростью, не уступающей библейскому царю. Его главная особенность — скрытый механизм, позволяющий поднимать трон до самого потолка и опускать обратно."

 # Banner
 artifact_wall_banner_battle_name:1 "Военное знамя державы [epic_loser.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 artifact_wall_banner_battle_description:1 "Военное знамя армий державы [epic_loser.GetPrimaryTitle.GetName], захваченное у их войск после битвы во владении [epic_battle_location.GetName]."
 artifact_wall_banner_royal_name:0 "[target.GetAdjectiveNoTooltip]ое королевское знамя"
 artifact_wall_banner_royal_description:1 "Это знамя державы [target.GetNameNoTooltip], созданное в честь правления персонажа [target.GetHolder.GetTitledFirstNameRegnal]."
 artifact_wall_banner_house_name:0 "Знамя дома [target.GetBaseNameNoTooltip]"
 artifact_wall_banner_house_description:1 "Это знамя дома [target.GetBaseName], символ власти этого рода и всех его потомков."
 artifact_wall_banner_dynasty_name:0 "Знамя династии [target.GetBaseNameNoTooltip]"
 artifact_wall_banner_dynasty_description:1 "Это знамя династии [target.GetBaseName], символ власти этой родословной и всех ее членов, созданное по поручению [newly_created_artifact.MakeScope.Var('banner_commissioner').Char.GetNameRegnal]."
 artifact_wall_banner_name:1 "[target.GetAdjectiveNoTooltip]ое знамя"
 artifact_wall_banner_description:3 "Это [target.GetAdjective]ое знамя, символ власти, которой обладает [target.GetHolder.GetTitleAsName]."

 artifact_wall_banner_kaviani_name:0 "Деравш Кавиани"
 artifact_wall_banner_kaviani:1 "Это легендарный Деравш Кавиани — королевский штандарт павшей Сасанидской империи. Символ самобытности и гордости для наследников Персидской империи."
 artifact_wall_big_edessa_name:1 "Спас Нерукотворный"
 artifact_wall_big_edessa:2 "Это Мандилион — полотно с чудесным образом лика Иисуса, считающееся первой иконой христианства. Его происхождение связывают с царем Абгаром из Эдессы."

 # Shield
 artifact_wall_shield:0 "Настенный щит"
 artifact_wall_shield_name:0 "Щит $artifact_name_prefix$"
 artifact_wall_shield_description:1 "Деревянный щит [SCOPE.Custom('ArtifactQuality')] качества, собранный из прочных досок [newly_created_artifact.GetFeatureText( 'shaft_wood' )] и скрепленный оковкой из [newly_created_artifact.GetFeatureText( 'head_metal' )]. Края щита инкрустированы [newly_created_artifact.GetFeatureText( 'decoration_material_inlay_HSB' )] и расписаны изображениями узоров — [newly_created_artifact.GetFeatureText( 'decoration_pattern' )]."
