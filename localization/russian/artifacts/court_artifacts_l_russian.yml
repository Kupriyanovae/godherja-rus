 artifact_sculpture_ark_of_covenant_name:1 "Ковчег Завета"
 artifact_sculpture_ark_of_covenant_description:0 "Большой каменный сундук, считающийся подлинным Ковчегом Завета, в котором хранятся каменные скрижали, данные Моисею Богом."
 #artifact_sculpture_kali_description: "Вырезанная и раскрашенная статуя Кали, Черной Богини."
 #artifact_sculpture_ganesh_description: "Вырезанная и раскрашенная статуя Ганеши, Устранителя Препятствий."
 artifact_sculpture_armor_babr_name:0 "Бабр-е Баян"
 artifact_sculpture_armor_babr:1 "Это легендарный Бабр-е Баян — доспех, который носил персидский герой Рустам."
 artifact_sculpture_cabinet_pentapyrgion_name:1 "Пентапиргион"
 artifact_sculpture_cabinet_pentapyrgion_description:1 "Этот элегантный шкаф был построен императором Феофилом для демонстрации ваз, корон и других ценностей в Хрисотриклинии — приемном зале Большого дворца в Константинополе."
 create_artifact_epic_tooltip:0 "[inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsFemale, 'привезла', 'привез' )] предмет [epic.GetName] из далеких земель"
