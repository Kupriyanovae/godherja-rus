 artifact_pedestal_rock_name:0 "Священный камень"
 artifact_pedestal_rock_description:0 "Необычный камень, который, по преданию, упал с неба и считается священным в культуре [owner.GetCulture.GetNameNoTooltip]."
 artifact_pedestal_pouch_name:0 "Кошель $artifact_name_prefix$"
 artifact_pedestal_pouch_description:0 "Богато украшенный кошель, идеально подходящий для хранения самоцветов, реликвий и небольших сокровищ."
 artifact_pedestal_scroll_name:0 "Законы $artifact_name_prefix$"
 artifact_pedestal_scroll_description:0 "Официального вида свиток, содержащий свод основных законов державы [owner.GetPrimaryTitle.GetNameNoTooltip], установленный правителем [owner.GetTitledFirstNameNoTooltip]."
 artifact_pedestal_religious_head_letter_name:0 "Письмо от персонажа [compliment_receiver.GetTitledFirstNameNoTooltip]"
 artifact_pedestal_religious_head_letter_description:0 "Текст гласит: «$learning_theology.3022.desc$»\n\nПисьмо адресовано персонажу [letter_receiver.GetTitledFirstName] и подписано [compliment_receiver.GetTitledFirstName]."

 artifact_pedestal_crucifix_name:0 "Распятие $artifact_name_prefix$"
 artifact_pedestal_crucifix_description:0 "Деревянное распятие изысканной работы — скорбное выражение лица Христа способно склонить к покаянию даже самого закоренелого грешника."
 artifact_pedestal_cross_name:0 "Крест $artifact_name_prefix$"
 artifact_pedestal_cross_description:0 "Мастерски сработанный крест, сделанный из золота и усыпанный драгоценными камнями."
 artifact_pedestal_human_skull_name:0 "Череп персонажа [killed.GetTitledFirstNamePossessiveNoTooltip]"
 artifact_pedestal_human_skull_description:0 "Чистый и прекрасно сохранившийся человеческий череп, принадлежавший персонажу [killed.GetTitledFirstNameNoTooltip], которого [Select_CString(owner.IsFemale, 'убила', 'убил' )] [owner.GetTitledFirstNameNoTooltip]."
 artifact_pedestal_human_skull_specific_description:0 "Чистый и прекрасно сохранившийся человеческий череп, якобы принадлежавший персонажу [killed.GetFullName]."
 artifact_pedestal_skull_of_the_enemy_name:0 "Череп посрамленного врага"
 artifact_pedestal_skull_of_the_enemy_description:0 "Чистый и прекрасно сохранившийся человеческий череп, некогда принадлежавший персонажу [rival.GetTitledFirstNameNoTooltip], изъятый хирургическим путем за личные оскорбления в адрес [owner.GetTitledFirstNameNoTooltip]."
 artifact_pedestal_skull_of_the_apostate_name:0 "Череп отступника"
 artifact_pedestal_skull_of_the_apostate_description:0 "Чистый и прекрасно сохранившийся человеческий череп, некогда принадлежавший персонажу [rival.GetTitledFirstNameNoTooltip], изъятый хирургическим путем за жизнь вопреки ценностям, которые проповедует [owner.GetFaith.GetName]."
 #artifact_pedestal_statuette_description: "Небольшая статуэтка изысканной работы, изображающая [owner.Custom('StatuetteSubject')]."
 #artifact_pedestal_statuette_minor_god: "младшее божество веры [owner.GetFaith.GetNameNoTooltip]"
 #artifact_pedestal_statuette_zoroastr: "Фаравахар"
 #artifact_pedestal_statuette_lion: "величественного льва"
 #artifact_pedestal_statuette_griffin: "грозного грифона"
 artifact_pedestal_massive_diamond_name:1 "Алмаз правителя [owner.GetTitledFirstNameNoTooltip]"
 artifact_pedestal_massive_diamond:0 "Массивный алмаз, сияющий и ограненный, уникальный своими размерами и чистотой."
 artifact_pedestal_crown_justinian_name:0 "Корона Юстиниана"
 artifact_pedestal_crown_justinian:1 "Это древняя корона императора Юстиниана: золотая и инкрустированная драгоценными камнями, она до сих пор хранит в себе всю власть и мудрость славного правителя."
 artifact_pedestal_menorah_name:0 "Иерусалимская менора"
 artifact_pedestal_menorah_description:0 "Вероятно, та самая подлинная Менора из Иерусалимского храма."
 artifact_pedestal_gold_nugget_name:0 "Исключительный самородок золота"
 artifact_pedestal_gold_nugget:0 "Огромный золотой самородок — его невиданные размеры определенно служат знаком божественного благоволения."
 artifact_pedestal_jamshid_name:1 "Чаша Джамшида"
 artifact_pedestal_cup_jamshid:1 "Это легендарная Чаша Джамшида: долгое время принадлежавшая древним правителям Персии, она используется для гадания и содержит эликсир бессмертия."
 artifact_pedestal_spear_destiny_name:1 "Копье Судьбы"
 artifact_pedestal_spear_destiny:1 "Это наконечник древнего копья, которым, по преданию, римский воин пронзил ребро распятого Иисуса."
 artifact_pedestal_david_harp_name:0 "Арфа Давида"
 artifact_pedestal_david_harp:1 "Это древняя деревянная арфа. По слухам, она принадлежала царю Давиду и обладает мистическими исцеляющими свойствами."
 artifact_pedestal_branch_name:1 "Ветвь [SCOPE.Custom('BranchTree')]"
 artifact_pedestal_branch_description:0 "Обычная на вид ветка огромной религиозной ценности: поговаривают, что она происходит от никого иного, как от [SCOPE.Custom('BranchTree')]."
 artifact_pedestal_branch_haoma:1 "Божественного Древа Хаомы"
 artifact_pedestal_branch_cypress:1 "Священного Кипариса Кашмара"
 artifact_pedestal_branch_bo:0 "ветви Древа Бо, под которым сидел Будда, когда достиг Просветления"
 artifact_pedestal_branch_bo_name:0 "Ветвь Древа Бо"
 artifact_pedestal_branch_thor:1 "Священного Дуба Тора"
 artifact_pedestal_branch_uppsala:1 "Священного Древа при храме Уппсалы"
 artifact_pedestal_branch_alatyr:2 "Древа Жизни, что растет на камне Алатырь"
 artifact_pedestal_branch_somb:1 "Сомба, Первого Древа на Земле"
 artifact_pedestal_branch_kalpavriksha:2 "одного из исполняющих желания древних деревьев Кальпаврикша"
 artifact_pedestal_branch_general:1 "Древа Жизни"
 artifact_pedestal_crown_iron_name:1 "Железная корона Ломбардии"
 artifact_pedestal_crown_iron:1 "Железная корона Ломбардии — названная так потому, что железный обруч внутри нее, по преданию, был выкован из гвоздя с креста Иисуса"
 artifact_pedestal_crown_thorns_name:0 "Терновый венец"
 artifact_pedestal_crown_thorns:1 "Полностью сохранившийся Терновый венец Иисуса, который был на Нем во время Страстей"
 artifact_pedestal_veil_veronica_name:1 "Плат Вероники"
 artifact_pedestal_veil_veronica:1 "Подлинный Плат Вероники: кусок ткани, на котором чудесным образом отпечатался лик Иисуса во время Страстей. Говорят, что по милости Божией он исцеляет больных"
 artifact_pedestal_cornerstone_name:0 "Украденный краеугольный камень"
 artifact_pedestal_cornerstone_name_desc:0 "Краеугольный камень из постройки типа [rival.Custom('FortifiedBuilding')], принадлежавшей сопернику по имени [rival.GetTitledFirstNamePossessive]"
 #artifact_pedestal_mosque_lamp_name: "Драгоценная масляная лампа"
 #artifact_pedestal_mosque_lamp: "Великолепная лампада для мечети — драгоценная масляная лампа из эмалированного стекла с позолотой."
 artifact_tree_automa_name: "Механическое древо"
 artifact_tree_automa: "Искусно сработанное позолоченное дерево с неотличимыми от живых птицами на ветвях. Только грекам ведомы секреты его скрытого гидравлического насоса, который заставляет птиц двигаться и приятно петь."


 # Books
 artifact_book_title:0 "[newly_created_artifact.GetFeatureText( 'book_title' )]"
 artifact_book_description:0 "[newly_created_artifact.Custom('ArtifactBookDescType')] [newly_created_artifact.GetFeatureText( 'book_decoration' )]."
 artifact_book_title_based_desc:0 "[ROOT.Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')|U] книга, подробно описывающая все жертвы и упорный труд ради того, чтобы стала возможной [ROOT.Artifact.GetFeatureText( 'book_topic' )]. Каллиграфия выполнена [ROOT.Artifact.GetOwner.Custom('ArtifactQuality')] качества, а сами страницы [ROOT.Artifact.GetOwner.Custom('ArtifactAdverbWealth')] украшены миниатюрами."
 artifact_book_other_desc_1:0 "[ROOT.Artifact.GetOwner.Custom('ArtifactArticleWealth')|U] том, демонстрирующий [ROOT.Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')] понимание такой дисциплины, как [ROOT.Artifact.GetFeatureText( 'book_subject' )], поскольку в нем затрагиваются такие темы, как [ROOT.Artifact.GetFeatureText( 'book_topic' )]."
 artifact_book_other_desc_2:0 "Книга, посвященная теме [ROOT.Artifact.GetFeatureText( 'book_topic' )] — наполненная множеством [ROOT.Artifact.GetOwner.Custom('ArtifactBookContentQuality')] комментариев и [ROOT.Artifact.GetOwner.Custom('ArtifactAdverbWealth')] иллюстрированная."
 artifact_book_other_desc_3:0 "[ROOT.Artifact.GetOwner.Custom('ArtifactArticleBookContentQuality')|U] труд, подробно рассматривающий тему [ROOT.Artifact.GetFeatureText( 'book_topic' )], [ROOT.Artifact.GetOwner.Custom('ArtifactAdverbWealth')] оформленный книжными миниатюрами и иллюстрациями."
