 artifact_wall_cid_sword_name:0 "Тисона"
 artifact_wall_el_cids_sword:1 "Этот трехфутовый меч носит гравировку «Тисона». По слухам, знаменитый военачальник Эль Сид отнял его в бою у прежнего владельца. Одно только присутствие этого меча внушает благоговейный трепет перед воинским искусством."

 artifact_wall_sword_muhammad_name:1 "Меч Мухаммеда"
 artifact_wall_sword_muhammad:0 "Один из девяти подлинных мечей Пророка Мухаммеда. Это [SCOPE.Custom('MuhammadSword')]."
 artifact_wall_sword_muhammad_aladb:0 "Аль-Адб — использовался Мухаммедом в битвах при Бадре и Ухуде"
 artifact_wall_sword_muhammad_almathur:0 "Аль-Ма'тур — передан Мухаммеду его отцом"
 artifact_wall_sword_muhammad_arrasub:0 "Ар-Расуб — фамильная реликвия Мухаммеда"
 artifact_wall_sword_muhammad_albattar:0 "Аль-Баттар — захвачен Мухаммедом в качестве трофея у племени Бану Кайнука"
 artifact_wall_sword_muhammad_haft:0 "Хатф — захвачен Мухаммедом в качестве трофея у племени Бану Кайнука"
 artifact_wall_sword_muhammad_qali:0 "Кали — захвачен Мухаммедом в качестве трофея у племени Бану Кайнука"
 artifact_wall_sword_muhammad_dhu:0 "Зульфикар — взят Мухаммедом в качестве трофея в битве при Бадре"
 artifact_wall_sword_muhammad_mikhdham:0 "Аль-Михзам — передан Мухаммедом своему двоюродному брату и зятю Али ибн Аби Талибу"
 artifact_wall_sword_muhammad_alqadib:0 "Аль-Кадыб — меч, который всегда оставался в доме Мухаммеда"
 artifact_wall_sword_attila_name:1 "Меч Господень"
 artifact_wall_sword_attila_description:0 "Легендарный меч гуннского вождя Аттилы, Бича Божьего. Также известен как Меч Марса."

