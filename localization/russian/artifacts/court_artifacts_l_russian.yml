 artifact_wall_narwhal_horn_name:0 "Рог единорога"
 artifact_wall_narwhal_horn:1 "Крупный прямой рог, сияющий белизной. По слухам, он был снят с тела убитого единорога. Рог [SCOPE.Custom('ArtifactAdverbQuality')] обработан и прикреплен к [SCOPE.Custom('ArtifactAdverbWealth')] украшенной подставке из [newly_created_artifact.GetFeatureText( 'generic_material_wood' )]."
