 #Wall Decorations - Large
 artifact_wall_tapestry_name:0 "Гобелен $artifact_name_prefix$"
 artifact_wall_tapestry_description:1 "Большой гобелен из [newly_created_artifact.GetFeatureText( 'generic_material_cloth' )] [SCOPE.Custom('ArtifactQuality')] качества. [newly_created_artifact.GetFeatureText( 'tapestry_scene' )]"
 feature_tapestry_scene_religious:0 "На полотне вышито несколько важных сцен из [Artifact.GetOwner.GetFaith.GetAdjectiveNoTooltip]ого канона."
 feature_tapestry_scene_historical:0 "На полотне вышит момент основания державы [Artifact.GetOwner.GetPrimaryTitle.GetName] и несколько других важных исторических событий, приведших к правлению персонажа [Artifact.GetOwner.GetTitledFirstName]."
 feature_tapestry_scene_geometric_patterns:0 "На полотне выткан сложный узор из переплетающихся геометрических фигур."
 feature_tapestry_scene_hunt:0 "На полотне изображена сцена охоты: несколько охотников с луками и копьями окружили раненое животное и готовятся нанести смертельный удар."
 feature_tapestry_scene_myth:0 "Древние боги, внушающие ужас чудовища и бесстрашные герои вытканы на этом полотне, изображающем сцену из мифов."
 feature_tapestry_scene_calligraphic:0 "На полотне выткан сложный узор, в котором элегантная каллиграфия плавно перетекает в геометрические формы."
 feature_tapestry_scene_bucolic:0 "Полотно изображает безмятежные сцены повседневной жизни в полях в течение года: кто-то сеет, кто-то пашет, а кто-то собирает урожай."
 feature_tapestry_scene_battle:0 "На полотне изображен переломный момент знаменитого сражения во владении [Artifact.GetOwner.MakeScope.Var('epic_battle_location').Province.GetName], в котором [Artifact.GetOwner.GetTitledFirstName] [Select_CString(Artifact.GetOwner.IsFemale, 'одержала победу над', 'одержал победу над' )] [Artifact.GetOwner.MakeScope.Var('epic_loser').Char.GetTitledFirstName]."
 feature_tapestry_scene_coronation:0 "[Artifact.GetOwner.GetTitledFirstName|U] находится в центре полотна, изображающего [Artifact.GetOwner.GetHerHis] коронацию на престол в окружении ликующей толпы."
 feature_tapestry_scene_ships:0 "На полотне изображен могучий флот, идущий под парусами в море. На каждом корабле стоят вооруженные воины и всматриваются в горизонт в поисках врагов."
 feature_tapestry_scene_animals:0 "На полотне выткана сцена охоты диких зверей. В центре могучий лев набросился на оленя, который тщетно пытается спастись."
 feature_tapestry_scene_banquet:0 "На полотне изображен богатый пир при дворе персонажа [Artifact.GetOwner.GetTitledFirstName]: знатные гости сидят за роскошным столом, пока музыканты и танцоры развлекают их."
 feature_tapestry_scene_hearing:0 "На полотне изображен судебный прием: [Artifact.GetOwner.GetTitledFirstName] величественно восседает в центре, пока вассалы, послы, побежденные враги и слуги ждут в очереди, чтобы выказать свое почтение."
 feature_tapestry_scene_garden:0 "На полотне выткан чудесный сад: трава ярко-зеленая, цветы растут пышными и красочными, а усыпанные плодами деревья словно тянутся до самого неба."
 create_artifact_tapestry_tooltip:0 "[inspiration_owner.GetShortUIName] [Select_CString(inspiration_owner.IsFemale, 'создала', 'создал' )] большой гобелен [SCOPE.Custom('ArtifactQuality')] качества"

