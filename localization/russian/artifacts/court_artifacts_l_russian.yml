 artifact_statue_constantine_name: "Статуя Константина"
 artifact_statue_constantine: "Древняя, слегка поврежденная, но все еще внушительная статуя Константина Великого, основателя Константинополя и образца для всех римских императоров."
 artifact_statue_roman_woman_name: "Статуя римлянки"
 artifact_statue_roman_woman_desc: "Древняя, слегка поврежденная, но все еще прекрасная статуя римской женщины."
 artifact_statue_four_tetrarchs_name: "Статуя четырех тетрархов"
 artifact_statue_four_tetrarchs_desc: "Внушительная статуя из порфира, изображающая двух членов первой Тетрархии, учрежденной Диоклетианом."
 artifact_hydraulic_organ_name: "Гидравлический орган"
 artifact_hydraulic_organ_desc: "Впечатляющий водяной трубный орган, который гордо напевает мелодии греческого прошлого."

